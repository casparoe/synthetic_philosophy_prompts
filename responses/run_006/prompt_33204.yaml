answer: |-
  You've put your finger on the profound and persistent nature of the stalemate. Your diagnosis is remarkably astute – the core disagreement is indeed **meta-methodological and epistemological**, revolving around the rules of inference, burden of proof, and the very scope of the arguments themselves, rather than just empirical history or semantics.

  Here's a breakdown of the layers of disagreement, building on your insight:

  1.  **The Surface Dispute: Historical Record (Factual):**
      *   *Appearance:* Realists challenge Laudan's examples, arguing phlogiston/ether weren't *as* successful as claimed, weren't truly abandoned (e.g., structural continuity in equations), or that their core causal claims weren't central to their success. Anti-realists find more historical counterexamples or refine their criteria for "success."
      *   *Reality:* This *looks* like a factual dispute, but it's largely driven by the deeper disagreements below. Each side interprets the historical record through their preferred methodological lens. Success, abandonment, and continuity are often judged differently. While important, resolving historical minutiae rarely convinces the other side because...

  2.  **The Core Dispute 1: Inference to the Best Explanation (IBE) & Burden of Proof (Methodological/Epistemological):**
      *   This is where your hypothesis hits the mark.
      *   **Realist Stance:** The NMA is a valid IBE. The *only* good explanation for the unprecedented, detailed, and novel predictive success of our best scientific theories is that they are latched onto reality in a significant way (approximately true, structurally correct). The burden is on the *anti-realist* to provide a *better* explanation for this success without invoking truth-likeness. They see PMI as failing this burden – past failures don't invalidate the inference *this time*, especially given increased scientific rigor.
      *   **Anti-Realist Stance:** IBE is unreliable when applied to unobservable theoretical posits. The history of science (PMI) *is* the counter-argument showing that IBE *has repeatedly failed* in this domain. The burden is on the *realist* to demonstrate why this time is different, to show a *reliable causal link* between approximate truth and success that transcends historical failures. They see the NMA as question-begging – it *assumes* truth is the best explanation, which is precisely what's in doubt after PMI.
      *   **The Impasse:** They fundamentally disagree on:
          *   **The validity of IBE for deep theory:** Is it a fundamental tool of rationality or dangerously unreliable for unobservables?
          *   **Where the burden lies:** Does the realist need to *prove* the link between success and truth beyond PMI, or does the anti-realist need to *prove* a better explanation for success exists?
          *   **The weight of history:** Is PMI a devastating inductive argument against realism, or is it merely a cautionary tale that doesn't invalidate the NMA applied to our uniquely successful modern theories?

  3.  **The Core Dispute 2: The Nature of "Approximate Truth" (Semantic/Conceptual):**
      *   This underpins the methodological dispute. What does it *mean* for a theory to be "approximately true"? Is it:
          *   Preserving core causal mechanisms?
          *   Preserving mathematical structure (Structural Realism)?
          *   Getting the "posits" roughly right (Selective Realism)?
          *   Simply being more predictively accurate than its predecessor?
      *   **The Impasse:** Without a clear, agreed-upon, non-question-begging account of "approximate truth," the NMA becomes vague. Anti-realists argue the concept is either incoherent or that the historical record shows even "approximately true" theories get radically replaced. Realists refine their accounts (Structuralism, Selectivism) to show *what* is preserved, but anti-realists argue these refinements are ad hoc or don't capture what realists originally meant.

  4.  **The Core Dispute 3: Are They Answering the Same Question? (Meta-Philosophical):**
      *   This is crucial. You suspect they might not be.
      *   **NMA:** "Given the *current, actual success* of our best theories, what is the *best explanation* for this success?" It's a *justification* for realism based on current evidence.
      *   **PMI:** "Given the *historical track record* of successful theories being discarded, what is the *reliability* of inferring truth from success?" It's a *challenge to the reliability* of the inference rule (IBE) used in the NMA.
      *   **The Impasse:** The realist sees the NMA as compelling *now*, regardless of past failures. The anti-realist sees the PMI as demonstrating the fundamental *unreliability* of the inference the NMA relies on. The realist is focused on the *content* of the best explanation *today*; the anti-realist is focused on the *track record* of the *type* of inference being used. They are operating on different levels of epistemic concern.

  **Breaking the Impasse? Prospects are Dim, But Not Hopeless:**

  1.  **Clarifying "Approximate Truth":** Developing a robust, non-circular, and historically plausible account of what approximate truth *means* and how it manifests across theory change (beyond just mathematical structure) is essential. If realists could point to specific, testable criteria for what aspects of a theory are likely preserved *because* they explain success, it would strengthen their case.
  2.  **Deepening Historical Analysis:** Moving beyond cherry-picked examples (ether *vs.* atoms) to large-scale, nuanced studies of theory change. Can we identify robust patterns about *what kind* of success correlates with *what kind* of preservation? Does increased experimental sophistication and integration change the game? This requires historians and philosophers working together rigorously.
  3.  **Focusing on Practice:** Examining how working scientists actually judge theories, make inferences, and build upon past work. Does scientific practice implicitly rely on something like approximate truth or structural continuity? Anti-realists (like constructive empiricists) argue it only relies on empirical adequacy. This "naturalistic" turn might offer new evidence, but risks the genetic fallacy.
  4.  **Shifting the Ground:**
      *   **Deflationary Approaches:** Some argue the whole debate rests on inflated notions of "truth" and "reality." Focusing on models, tools, and reliable prediction might bypass the stalemate (though this often looks like surrender to realists).
      *   **Local *vs.* Global:** Arguing that realism might be justified in some mature, stable domains (e.g., parts of physics) but not others (e.g., fundamental theories undergoing revolution). This concedes some ground to PMI but tries to salvage realism where it seems strongest.
      *   **Explaining Success Differently:** Could anti-realists provide a genuinely compelling, non-truth-linked explanation for the specific *kinds* of novel and detailed success science achieves? (e.g., sophisticated instrumentalism, evolutionary/cognitive accounts). This is the key demand of the NMA burden.

  **Conclusion:**

  You are fundamentally correct. The core is **meta-methodological**: a profound disagreement about the rules of scientific epistemology – the validity of IBE for unobservables, the burden of proof regarding success, and the weight of historical induction versus current explanatory power. The semantic murkiness of "approximate truth" fuels this fire. The arguments often talk past each other because the NMA is about *justification* based on current evidence, while the PMI is about the *reliability* of the inferential method itself.

  **Is it fated?** Likely, yes, in the sense that a definitive, universally convincing resolution is improbable. It resembles other foundational philosophical divides (e.g., mind-body, free will). The disagreement stems from deep-seated, almost pre-theoretical commitments about rationality, evidence, and the reach of science. However, progress *within* the debate is possible: refining concepts, deepening historical understanding, exploring local justifications, and developing more sophisticated versions of both realism and anti-realism. While the impasse might not be *broken*, the conversation can become richer and more nuanced, which is valuable in itself. Your recognition of the meta-level nature of the dispute is a significant step in achieving that nuance.
