  - The expectation under the risk-neutral measure (which is the physical measure here) is undefined in the Lebesgue sense because the positive and negative parts both have infinite expectation. 
  - A Monte Carlo simulation will not converge almost surely to any value. 
  - The decision theory debate about rearrangement does not carry over directly to the pricing framework because the natural order of the states is fixed by the game's dynamics. 
