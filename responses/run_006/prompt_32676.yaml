  Second, cultivation methods become suspect if traits can't stabilize. 
  Third, this makes virtue ethics' guidance ineffective or even harmful by promoting unattainable standards. 

  Important to acknowledge their valid distinction - situationism doesn't disprove ideals in a vacuum. But must press that psychological realism constrains viable normative theories. Doris' "fragmentation" critique is useful here. 

