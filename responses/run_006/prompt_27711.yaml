  ## Commissioner's Memorandum: Recommendation on Lost-Years Damages  
  **To:** Members of the Law Reform Commission  
  **From:** [Your Name]  
  **Subject:** Recommendation on Proposed "Lost-Years" Damages in Wrongful Death Actions  
  **Date:** [Current Date]  

  ### I. Recommendation  
  **Adopt the lost-years provision.** While the Epicurean objection warrants serious consideration, it does not justify denying recognition of the profound human loss inherent in wrongful death. The law should affirm the intrinsic value of a human life unjustly cut short.  

  ### II. Engaging the Epicurean Argument  
  The core objection—rooted in Epicurean philosophy—deserves honest engagement. Epicurus argued that death cannot harm the deceased because:  
  > *"Death is nothing to us, since when we are, death is not, and when death is, we are not."*  

  This asserts two premises:  
  1. **Harm requires a subject** who experiences it.  
  2. **Death eliminates the subject**, leaving no one to "bear" the loss.  

  If accepted, this implies that compensating the *decedent* for lost life experiences is incoherent—a legal fiction benefiting survivors disguised as redress for the deceased.  

  **Why this is not dispositive:**  
  1. **The Law Recognizes Retrospective Harms**:  
     Tort law routinely acknowledges harms that crystallize *after* the victim’s ability to experience them. For example:  
     - A person defamed after death suffers reputational injury.  
     - Breach of a deathbed contract injures the decedent’s interests.  
     The law protects *interests*, not merely conscious experiences. A stolen future is an objective deprivation, even if the decedent cannot subjectively lament it.  

  2. **The "Harm" is the Unjust Deprivation of Life Itself**:  
     The wrong lies in the *prevention of life* the decedent would otherwise have lived. As Thomas Nagel observed, death is an evil because it robs a person of "what they would have otherwise been able to do or experience." The law need not prove the deceased *feels* this loss; it suffices that the defendant destroyed a valuable human existence.  

  3. **Moral Intuition vs. Metaphysical Abstraction**:  
     The Epicurean view clashes with near-universal human intuition: that dying young in a preventable accident is a tragedy *for the victim*. The law should reflect society’s moral consensus that wrongful death inflicts a fundamental injury on the decedent—not merely their survivors. Rejecting this intuition risks reducing the law to arid scholasticism.  

  ### III. Strongest Reason Against Adoption: Valuation Challenges  
  The most persuasive practical objection is **not philosophical but jurisprudential**: How can courts coherently value "lost life experiences"? Unlike lost financial support (calculable via earnings) or funeral costs (concrete expenses), placing a dollar value on "lost years" appears inherently subjective. This risks arbitrary awards, inconsistent verdicts, and conflating the decedent’s loss with survivors' grief—which is already compensated separately.  

  **Response**:  
  1. Courts already value non-economic harms (e.g., pain and suffering, loss of enjoyment of life in personal injury cases).  
  2. Factors like the decedent’s age, health, values, relationships, and unfulfilled goals provide objective anchors for juries.  
  3. This challenge is administrative, not existential—it demands careful jury instructions and appellate review, not abandonment of the principle.  

  ### IV. Conclusion  
  The Epicurean argument, while logically rigorous, is ultimately a metaphysical stance the law need not adopt. Wrongful death statutes exist not to solve ancient philosophical puzzles, but to redress profound injustices as society understands them. Failing to acknowledge the decedent’s lost life treats human existence as a mere instrument for others’ benefit—a view more dehumanizing than any sophistry. Adopt the lost-years provision to affirm that a life wrongfully taken is an irreplaceable loss *to the person whose life it was*.  

  Respectfully submitted,  
  [Your Name]  

  ---

  ### Key Features of This Draft  
  1. **Clear Recommendation**: Unambiguous "yes" upfront.  
  2. **Epicurean Argument Engaged**:  
     - Explains the logic without caricature.  
     - Rejects it as legally irrelevant without dismissing its coherence.  
     - Grounds the rebuttal in legal precedent and societal values.  
  3. **Strongest Counteraddressed**: Focuses on valuation (not philosophy) as the weightiest concern and offers pragmatic solutions.  
  4. **Tone**: Accessible to legally trained readers but avoids oversimplifying philosophy.  
  5. **Moral Foundation**: Framed as affirming human dignity—aligning with law’s normative role.  

  This approach respects philosophical rigor while prioritizing the law’s function as a tool for justice as commonly understood.
