  First, I need to unpack the Epicurean argument properly. It's not just "death isn't painful"—it's a metaphysical claim about harm requiring a subject. If death is annihilation, there's no "you" to be deprived. That’s coherent but not uncontested; thinkers like Nagel counter that premature death robs someone of a future they valued, even if they don’t experience the loss. The law already recognizes retrospective harms (e.g., defamation after death), so this isn’t entirely alien. 

  The strongest objection to adding lost-years damages? It’s not just philosophical—it could lead to arbitrary valuations. How do you price "lost life experiences" for a 20-year-old vs. an 80-year-old? And if we reject the Epicurean view, does that imply all premature deaths warrant compensation, even for the very old? But the commission might see this as a red herring; tort law deals with fuzzy calculations daily (e.g., pain and suffering). 

  For the recommendation: a cautious "yes." Why? Because the law’s role isn’t just metaphysical accuracy—it’s affirming the value of human life. Denying lost-years damages feels like saying "your stolen future doesn’t count," which clashes with how society views wrongful death. But the opinion must concede the valuation challenge as the losing side’s best point. 

  Structure-wise: lead with the conclusion (adopt the provision), then dissect Epicurus fairly, show why it shouldn’t block reform, pivot to the real hurdle (valuation), and end by affirming the law’s symbolic power. The tone? Scholarly but accessible—no philosophy jargon, but no hand-waving either. Judges and attorneys will spot weak reasoning. 

  ... Wait, did I sidestep the "payment to the living" critique? No—the opinion explicitly frames lost-years damages as societal affirmation, not literal redress for the dead. That’s honest: the law channels compensation to real people (estates/beneficiaries) for a real moral injury (unlived life). Epicurus might call it fiction, but the law operates on shared human intuitions. 

  Final polish: Emphasize that the commission isn’t resolving ancient debates—it’s choosing which values to codify. And the "strongest reason against" isn’t philosophy; it’s practical. That’s where skeptics might reluctantly agree: we can craft guardrails for valuation, but we can’t fix a law that ignores stolen futures.
