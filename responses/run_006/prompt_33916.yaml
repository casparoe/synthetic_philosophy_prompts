answer: |-
  1.  Moral obligation arises primarily from the immediate duty to rescue identifiable individuals in peril that you encounter directly, not from abstract calculations about maximizing total lives saved across potential groups.  
  2.  Saving any life is a positive moral act fulfilling a duty to aid; failing to save a larger group you *didn't* engage with doesn't constitute actively harming them or violating a specific duty owed *to them* in that moment.  
  3.  Focusing solely on numbers risks treating individuals as interchangeable units, undermining the intrinsic value and dignity of each unique person you have the direct opportunity to save.  
  4.  Quantifying lives invites problematic comparisons and potential justification for sacrificing individuals for perceived greater goods in other contexts, a dangerous moral precedent.  
  5.  Factors beyond mere numbers, such as the immediacy of the threat, the strength of any existing relationships (though absent here), or even arbitrary proximity, can legitimately influence the moral focus of rescue without implying the larger group is less valuable.

  The strongest counterargument involves scenarios with vast numerical disparities (e.g., one vs. thousands) where the sheer scale seems to create an undeniable moral imperative to save the larger group, challenging the claim that numbers *never* count.
