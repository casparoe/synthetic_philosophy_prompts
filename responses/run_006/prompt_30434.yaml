prompt: |-
  Not a philosopher, but I sit on a few committees and I keep noticing a pattern I don't have a word for. Take a three-person panel deciding whether to uphold a complaint. Upholding it needs two things to be true: that the procedure was followed, and that the decision was unfair. Suppose Amy thinks procedure yes, unfairness no, so the complaint fails. Ben thinks procedure no, unfairness yes, so it fails. Cara thinks procedure yes, unfairness yes, so it succeeds. Each of them is perfectly consistent. But if you vote question by question, the panel says: procedure followed (2–1), decision unfair (2–1), yet complaint not upheld (2–1). So the group's official position is that the procedure was followed and the decision was unfair, but the complaint should fail — a combination none of the three members actually holds. I've seen the same shape in recruitment panels and ethics boards: the overall verdict contradicts the group's own answers to the sub-questions. I know this is somewhere near Condorcet's paradox, but that's about rankings cycling (A beats B, B beats C, C beats A), and here nothing cycles — it's a flat contradiction between the majority's answers to the sub-questions and the majority's answer to the overall question. Is there an established name for this specific thing, and how exactly does it relate to Condorcet's paradox and to the idea that a group can be 'rational' when its members are? I'm not just after a label; I want to know what the standard examples are, where the edges of the concept are, and whether this really shows something about groups or is just an artefact of voting on each question seperately.
reasoning: |-
  Okay, the user describes a scenario where a three-person panel votes on sub-questions and an overall decision. Each member votes consistently, but the majority outcomes lead to a logical contradiction: the group concludes that both sub-conditions are met, yet the complaint isn't upheld. This contradicts each individual's stance. 

  The user is clearly experienced in committee work—they mention seeing this pattern across ethics boards and recruitment panels. They're not just name-hunting; they want to understand the mechanics, how it relates to established paradoxes like Condorcet's, and whether this reveals something fundamental about group rationality. 

  Hmm, their core question is twofold: terminology (what's this called?) and conceptual implications (is this a voting artifact or a deeper flaw in collective reasoning?). They also subtly ask if groups can be "rational" when members are—a nod to social choice theory. 

  First, I recall this is the doctrinal paradox. It's a cousin of Condorcet but distinct: Condorcet cycles involve rankings, while this is about logical consistency across premises/conclusions. The user already spotted that difference—sharp observer. 

  The standard example is exactly what they described: a verdict requiring conjunctive conditions (A and B). Other forms exist though—disjunctive ones (A or B) like hiring criteria. Important to mention Arrow's theorem too, since doctrinal paradox falls under "impossibility" results about fair aggregation. 

  Edge cases? The paradox vanishes if members agree on which premise matters more, but that's rare in committees. Also, sequential voting might change outcomes—if they vote on conclusion first, it fails 2-1, avoiding contradiction. But is that fairer? Debatable. 

  On group rationality: the key point is that majority voting doesn't preserve logical relations between propositions. So the *group* can be inconsistent even if all *members* are consistent. That's jarring but mathematically inevitable under certain conditions. 

  User might also wonder about solutions. "Premise-based" vs. "conclusion-based" voting tradeoffs are worth noting—the former risks incoherent conclusions, the latter ignores members' reasoning paths. No perfect fix, alas. 

  ...Should I mention Lehrer-Wagner? Maybe briefly. It's a niche solution but shows how weighting premises differently could resolve it, though impractical for most committees. 

  Finally, emphasize this isn't just a quirk—it reveals inherent tensions in democratic decision-making. The user's frustration is valid: real committees face this exact headache. 

  Wait—did they use Amy/Ben/Cara as A/B/C? Clever. Condorcet vibes but flipped. Nod to that symmetry in the reply.
answer: |-
  This is a profound and well-observed phenomenon with a specific name in social choice theory and philosophy: **the Doctrinal Paradox** (sometimes called the **Discursive Dilemma**).

  **What it is:**
  The Doctrinal Paradox occurs when:
  1.  A group must make a collective decision on a conclusion (`C`) that logically depends on the truth values of one or more premises (`A`, `B`, etc.). (In your case: `Uphold Complaint` (`C`) requires `Procedure Followed` (`A`) AND `Decision Unfair` (`B`)).
  2.  Each individual member holds a logically consistent set of beliefs about `A`, `B`, and `C`.
  3.  The group votes separately on each proposition (`A`, `B`, `C`) using majority rule.
  4.  The majority verdicts on the *premises* (`A` and `B`) logically imply a verdict on the *conclusion* (`C`) that **contradicts** the majority verdict reached by voting *directly* on the conclusion (`C`).

  This is precisely what you described: Majority says `A=Yes`, `B=Yes` (which logically implies `C=Yes`), but majority also says `C=No`.

  **Relationship to Condorcet's Paradox:**
  *   **Similarity:** Both are *voting paradoxes* demonstrating that majority voting over multiple options (premises/conclusion or candidates) can lead to collective outcomes that seem irrational or inconsistent, even when individual voters are rational/consistent. Both highlight the path-dependence or aggregation problem of majority rule.
  *   **Difference:** Condorcet's Paradox is about **cyclic preferences** in *rankings* (A>B, B>C, C>A). The Doctrinal Paradox is about **logical inconsistency** between the majority's judgments on *logically interconnected propositions* (`A`, `B`, `C`). Condorcet cycles involve indifference to the underlying reasons for preferences, while the Doctrinal Paradox explicitly involves the logical structure connecting reasons (premises) to a decision (conclusion).

  **Core Tension: "Rational" Group vs. Rational Members**
  This paradox directly challenges the idea that a group composed of rational individuals making decisions via seemingly fair procedures (majority vote) will necessarily produce a "rational" group outcome. Here's the breakdown:
  1.  **Individuals are Rational:** Amy, Ben, and Cara each hold perfectly consistent beliefs (`A&B->C` holds true for each of their individual judgments).
  2.  **Aggregation Method is Simple/Fair:** Majority voting on each question seems transparent and democratic.
  3.  **Group Outcome is Irrational:** The collective set of judgments (`A=Yes`, `B=Yes`, `C=No`) is **logically inconsistent** given the rule `C iff (A and B)`. The group simultaneously affirms the premises necessary for `C` and denies `C`. *The group, as an entity, holds an irrational set of beliefs*.

  **Standard Examples & Variations:**
  1.  **The Legal Case (Your Example):** Upholding a complaint/conviction requiring multiple elements (`A` and `B`).
  2.  **Hiring/Promotion Committees:** A candidate might require `Qualified (A)` AND `Fits Culture (B)`. Individual members might reject based on one failing criterion, while majorities affirm both `A` and `B` separately but reject the candidate (`C`) directly.
  3.  **Ethics Approval:** Approving research (`C`) might require `Scientific Merit (A)` AND `Ethical Safeguards (B)`. Similar voting patterns can lead to the paradox.
  4.  **Disjunctive Rules:** Paradoxes can also occur with OR rules. Imagine acquittal (`C`) if `Self-Defense (A)` OR `Mistake of Fact (B)`. Majorities might reject both `A` and `B` separately but vote directly to acquit (`C`). (`A=No`, `B=No`, `C=Yes` violates `C iff (A or B)`).
  5.  **Multi-Premise Examples:** The paradox scales to more complex rules (e.g., `C iff (A and (B or D))`).

  **The Edges of the Concept:**
  *   **Essential Ingredients:**
      *   A conclusion logically dependent on premises.
      *   Voting on premises *and* conclusion separately.
      *   Majority rule used for all votes.
      *   A profile of individual judgments where the majority on premises implies a different conclusion than the majority on the conclusion itself.
  *   **Not Required:**
      *   A tie or near-tie (your example is decisive 2-1 on everything).
      *   Strategic voting (it happens with sincere voting).
      *   Ambiguous rules (the rule `C iff (A and B)` is clear).
      *   Irrational individuals (they are all consistent).
  *   **Related Concepts:**
      *   **Judgment Aggregation:** The broader field studying how to aggregate individual judgments on multiple logically connected propositions into a collective set. The Doctrinal Paradox is a key impossibility result within this field.
      *   **Arrow's Impossibility Theorem:** While Arrow deals with aggregating *preferences* over *alternatives*, the Doctrinal Paradox shows similar impossibility issues (logical consistency) when aggregating *judgments* on *propositions*. Both highlight fundamental trade-offs in collective decision-making.
      *   **The Ostrogorski Paradox:** Concerns inconsistency between voting on individual policy issues and voting for a party platform encompassing those issues.

  **Is it an Artifact of Separate Voting? Yes, but it Reveals Something Deeper:**
  *   **Artifact?** Absolutely. The paradox arises *specifically* because you vote on the premises and conclusion separately. If the panel *only* voted on the final conclusion (`Uphold Complaint?`), they would get `No` (2-1: Amy and Ben say No, Cara says Yes). If they *only* voted on the premises and then *derived* the conclusion logically (`A and B -> C`), they would get `C=Yes` (since `A=Yes` and `B=Yes` by majority). The contradiction only appears when you try to aggregate votes on *both* levels independently.
  *   **Reveals Something Deeper?** Yes. It demonstrates that **majority voting is not truth-functional for logically interconnected propositions.** You cannot reliably determine the group's judgment on a conclusion by simply taking majority votes on its premises and applying the logical rule, nor can you assume that a majority vote on the conclusion will be consistent with majority votes on the premises. This exposes a fundamental limitation: **there is no perfectly fair, consistent, and decisive way (satisfying certain basic axioms) to aggregate individual judgments on interconnected propositions into a collective set of judgments.** This is the core impossibility result in judgment aggregation, analogous to Arrow's theorem for preferences.

  **Resolving the Tension?**
  Committies often grapple with *how* to vote:
  1.  **Conclusion-Based Voting:** Vote only on the final verdict (`C`). Pro: Avoids the paradox, respects the "bottom line" of each member. Con: Ignores *why* members reached their conclusion; might hide important disagreements on premises.
  2.  **Premise-Based Voting:** Vote only on premises (`A`, `B`) and derive `C` logically. Pro: Ensures logical consistency, focuses on the reasons. Con: May override the genuine overall judgment of the majority on the conclusion itself (in your example, 2 members *actually* oppose upholding, even though the premises suggest it should be upheld).
  3.  **Sequential/Deliberative Approaches:** Discuss premises to try to reach consensus or clarify reasoning before voting on `C`. This might mitigate but doesn't guarantee avoidance.
  4.  **Weighting/Structuring Premises (Lehrer-Wagner):** More complex models assign weights to premises based on group agreement, but this is often impractical for committees.

  **In Summary:**
  You've identified the **Doctrinal Paradox (Discursive Dilemma)**. It illustrates that when a group decision depends on multiple logical premises, majority voting on each question separately can lead to a collectively irrational outcome (`A=Yes, B=Yes, C=No`) that contradicts the logical connection (`A and B -> C`) and is held by *none* of the individual members. While triggered by the voting method, it reveals a profound truth: achieving collective logical consistency, individual rationality, and fair aggregation (via majority vote on all propositions) is generally impossible for interconnected decisions. This forces committees to make a fundamental choice: prioritize the coherence of the group's reasoning (premise-based) or the members' overall verdicts (conclusion-based), accepting the limitations of each approach.
