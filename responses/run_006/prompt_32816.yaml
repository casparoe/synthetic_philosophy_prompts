  What I'm stuck on is the precise mechanism. Is the bad conscience just cruelty redirected at the self, or is it more general — the accumulation of all the instincts that can no longer find an external outlet? Also, why does this turned-inward energy show up as bad conscience rather than, say, mere frustration or self-control? And how does this connect to the later stuff about guilt, debt, and punishment? I'd prefer an explanation that tracks his argument step-by-step, not just a summary, and it would help if you could seperate the psychological claim from the historical claim.
