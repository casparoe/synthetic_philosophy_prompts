answer: |-
  ### Distributive Ethics: Where Do You Stand on the Leveling-Down Objection?  
  **Starting Case:** Imagine a policy *only* lowers the welfare of the best-off group, helps no one (directly or indirectly), and makes the distribution more equal.  

  ---

  #### Decision Tree  
  Answer each question below **without** relying on ethical labels. Start from the top and follow the branches based on your answers.  

  1. **Is there *anything at all* good about this outcome, even if you wouldn’t call it "better all things considered"?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 4.  

  2. **Is the good *entirely* due to the reduction in inequality?**  
     - **Yes** → Go to 3.  
     - **No** → **Unoccupied Combination**  
       - *Why?* The case only changes equality/total welfare. If you see non-equality good (e.g., fairness), it’s likely relational—but relational goods aren’t intrinsic to *outcomes*. This view is rare or incoherent here.  

  3. **Is equality the *only* thing that ultimately matters?**  
     - **Yes** → **Monist Telic Egalitarianism**  
       - *Awkward commitment:* Must say leveling down is *pro tanto* good (and possibly all-things-considered good if no tradeoffs exist).  
     - **No** → **Pluralist Telic Egalitarianism**  
       - *Awkward commitment:* Must say leveling down is *pro tanto* good (due to equality), but likely not worth the welfare loss.  

  4. **Is inequality *bad* in some way (e.g., unfair, harmful to society)?**  
     - **Yes** → Go to 5.  
     - **No** → Go to 6.  

  5. **Is the bad of inequality primarily about the *pattern* of distribution itself?**  
     - **Yes** → **Unoccupied Combination**  
       - *Why?* If inequality’s badness is in the pattern, reducing it *must* be good in some way. But you said "no" to Q1. Incoherent!  
     - **No** → **Deontic/Relational Egalitarianism**  
       - *Awkward commitment:* Must deny leveling-down is *pro tanto* good. The badness of inequality lies in unfair *treatment*, not the outcome—so leveling down without addressing relations is pointless/unfair.  

  6. **Is there a threshold of well-being below which losses are *especially bad* (or lexically worse)?**  
     - **Yes** → **Sufficientarianism**  
       - *Awkward commitment:* If the best-off are above the threshold, leveling down is pure loss. But if it pushes anyone below the threshold, it’s catastrophic—even if inequality decreases.  
     - **No** → Go to 7.  

  7. **Do benefits to the worse-off matter *more* than equal benefits to the better-off?**  
     - **Yes** → **Prioritarianism**  
       - *Awkward commitment:* Must prioritize aiding the worse-off *even when inequality is unchanged* (e.g., helping a poor person a little > helping a rich person a lot).  
     - **No** → **Utilitarianism**  
       - *Awkward commitment:* Leveling down is strictly bad (lowers total welfare). But you might endorse large gains for the well-off over smaller gains for the worst-off if total welfare increases.  

  ---

  #### Key Distinctions & Unoccupied Combinations  
  - **Where does equality’s value live?**  
    - Telic egalitarianism: In the *outcome pattern* (Q1–Q3).  
    - Deontic egalitarianism: In *relational fairness* (Q4–Q5).  
  - **Priority to the worse-off?**  
    - Prioritarianism/sufficientarianism: Yes—but due to *absolute welfare levels*, not inequality (Q6–Q7).  
    - Utilitarianism: No (Q7).  
  - **Thresholds?**  
    - Sufficientarianism: Yes (Q6).  
    - Prioritarianism/utilitarianism: No (Q6–Q7).  

  **Unoccupied Combinations & Why:**  
  - **"Inequality is intrinsically bad, but leveling down isn’t *pro tanto* good" (Q1=No + Q5=Yes):** Incoherent. If inequality’s badness is intrinsic (pattern-based), reducing it must be good.  
  - **"Priority for the worse-off + inequality intrinsically bad":** Occupied! This fits **pluralist telic egalitarianism** (Q1=Yes, Q2=Yes, Q3=No). It’s a hybrid view (e.g., valuing equality *and* priority).  

  **Indistinguishable Pair in This Tree:**  
  - **Deontic egalitarianism vs. prioritarianism** *both* reject leveling down (Q1=No) but for different reasons:  
    - Deontic: Inequality is relationally bad (Q4=Yes, Q5=No).  
    - Prioritarianism: Inequality isn’t bad—priority stems from absolute welfare levels (Q4=No, Q6=No, Q7=Yes).  
  - **They diverge in other cases:** E.g., if inequality arises fairly (deontic may permit it; prioritarian still prioritizes the worse-off).  

  ---

  **Why This Tree?**  
  - Avoids labels until the end—forces students to engage with concrete claims.  
  - Separates core issues: outcome-good vs. relational-good, priority, thresholds.  
  - Exposes awkward commitments (e.g., telic egalitarians *must* endorse leveling-down as *pro tanto* good).  

  *Adapted from debates on Parfit, Temkin, Anderson, Frankfurt, and others.*
