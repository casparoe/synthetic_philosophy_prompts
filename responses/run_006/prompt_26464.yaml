  Okay, let me try to unpack the user's question. They're pointing out a contradiction in how historical scientific theories are described. When defending scientific realism, old theories like Newtonian mechanics are called "approximately true," but when arguing for anti-realism, the same theories are deemed "centrally false." The user wants to know if this tension has a name and if there are resolutions.

  First, I need to recall relevant concepts in philosophy of science. The pessimistic meta-induction comes to mind, where past theories were false, so current ones will be too. But the user is asking about the dual characterization of old theories. That's more about the content of those theories—how they can be both approximately true and fundamentally false.

  Then, there's the issue of theory change and reference. For example, Newton's laws work at low speeds but fail at high speeds or strong gravity. But terms like "mass" in Newton vs. Einstein might refer to different concepts. The user mentioned caloric theory and phlogiston, which are often seen as completely wrong, but the math for heat flow was still useful. 

  The user might be looking for a way to reconcile these views. Positions like structural realism could be relevant—it claims that the mathematical structure of theories is preserved, even if the ontological claims change. But does that solve the problem? Critics say it doesn't account for ontological shifts. 

  Another angle is selective realism, where only certain parts of theories are retained. But deciding which parts are "good" can be arbitrary. The user might be seeking a balanced view that acknowledges both continuity and rupture in scientific progress. 

  I should also consider if the user is a student or researcher. They seem well-read, referencing specific theories. Their deeper need might be understanding whether science progresses toward truth or if it's just a series of useful models. They want clarity on the philosophical debate and possible resolutions. 

  The tension is inherent because theories have multiple components: mathematical formalism, ontological commitments, predictive success. Realists focus on the first and third, anti-realists on the second. Resolutions like structural realism try to bridge this but have limitations. The user might need to see that the debate is ongoing, with no clear consensus, but that scientific practice relies on continuity of mathematical structures even when ontologies shift.
answer: |-
  You've hit upon a profound and persistent tension in the philosophy of science, often called the **Problem of the Continuity of Reference** or more broadly, the **Problem of Theory-Ladenness in Scientific Progress**. While it intersects with the Pessimistic Meta-Induction (PMI), it focuses specifically on the *interpretation* of past theories rather than just their falsity. Here's a breakdown:

  1.  **The Core Tension You've Identified:**
      *   **Realist Characterization:** Past theories are "approximately true" or "operationally adequate within a domain." Newtonian mechanics *is* incredibly accurate for most engineering and celestial mechanics at non-relativistic speeds/gravities; caloric theory *did* give correct equations for heat conduction. This emphasizes *continuity* and *preservation of success*.
      *   **Anti-Realist/Pessimistic Characterization:** Past theories were fundamentally *false* because their core *ontological commitments* (the entities and mechanisms they posited) were non-existent. Newtonian absolute space/time, caloric fluid, phlogiston – these central concepts are simply *wrong*. This emphasizes *rupture* and *rejection*.

  2.  **Is it Just the Pessimistic Meta-Induction (PMI)?**
      *   **Related, but Distinct:** The PMI uses the *falsity* of past theories as evidence for the likely falsity of current ones. Your observation is the *fuel* for both sides of the PMI debate. The PMI *relies* on interpreting past theories as fundamentally false. Scientific realists countering the PMI *rely* on interpreting them as approximately true/structurally correct. The tension you see is the *interpretive battleground* upon which the PMI is fought.
      *   **The Distinct Problem:** How can we consistently *characterize the content* of a superseded theory? Was Newtonian mechanics "true but incomplete" or "false but useful"? This is a problem about *semantics* (what did the theory *mean*? what did its terms *refer* to?) and *ontology* (what did the theory *claim exists*?).

  3.  **Named Positions Attempting Resolution (or Exploiting the Tension):**
      *   **Selective Realism (or "Divide et Impera" Realism):** Proponents like Philip Kitcher, Stathis Psillos, and Peter Achinstein argue that we should be selective. *Parts* of past theories (often the mathematical formalism, successful predictions, or well-confirmed causal claims) were genuinely referential and approximately true, while other parts (the specific ontological interpretations, auxiliary assumptions) were false and rightly discarded.
          *   *Resolution Attempt:* Newton got the *mathematical relationships* between force, mass, and acceleration right (F=ma) in its domain, and the concept 'mass' refers *approximately* to the same property we call 'mass' (or relativistic mass/rest energy at low speeds). Caloric theory got the *heat flow equations* right. Phlogiston theory correctly identified *substances released* during combustion/calcination (though misidentified as phlogiston instead of oxygen uptake).
          *   *Critique:* Critics argue selection is often arbitrary and hindsight-driven. How do we know *which* parts to save? Why save Newton's equations but not his absolute space? Did 'mass' *really* refer to relativistic mass, or was Newton's concept fundamentally different?
      *   **Structural Realism (SR):** Proposed by John Worrall (epistemological SR) and James Ladyman (ontic SR). SR argues that what is preserved across theory change is not the specific *nature* of the entities (ontology), but the *structure* of the relationships between them (the mathematical equations, patterns, symmetries).
          *   *Resolution Attempt:* Fresnel's equations for light diffraction were preserved despite the shift from elastic-solid aether to electromagnetic fields. Newton's gravitational inverse-square law is preserved as a low-speed/weak-field limit of General Relativity. Caloric theory preserved the structure of heat flow equations. The *structure* is approximately true and convergent.
          *   *Critique:* Can structure be cleanly separated from ontology? What does mathematical structure *represent* if not underlying entities/processes? Does SR adequately explain *why* the structures work? Critics also point to cases where mathematical formalism changed drastically (e.g., quantum mechanics vs. classical mechanics).
      *   **Referential Realism / Causal Theories of Reference:** Associated with Saul Kripke and Hilary Putnam. This approach argues that the *reference* of theoretical terms can remain stable even as theories change, as long as there is a causal-historical link to the same underlying entity or property.
          *   *Resolution Attempt:* The term 'electron' referred to the same entity for J.J. Thomson (corpuscle), Bohr (orbit), and modern QFT (excitation in a field), despite radically changing theories about its nature. 'Mass' refers to the same fundamental property across Newton and Einstein, even if the *laws* governing it changed.
          *   *Critique:* This struggles with radically false theories. What did 'phlogiston' refer to? Nothing real? Or oxygen *absence*? What did 'caloric' refer to? Kinetic energy? This seems strained. Did 'aether' refer to anything real? The link often seems broken.
      *   **Pragmatic/Perspectival Realism:** Views like Ronald Giere's argue that theories are not true/false simpliciter, but are more or less accurate *models* of the world from specific *perspectives* or for specific *domains*.
          *   *Resolution Attempt:* Newtonian mechanics is a highly accurate *model* for its intended domain (medium-sized objects at low speeds). Caloric theory was an inaccurate model of the *nature* of heat but an accurate model for *predicting heat flow* under certain conditions. Current theories are our best current models for their domains.
          *   *Critique:* Does this abandon the idea of convergence on *truth*? Is it too weak for realism? What guarantees the domains or perspectives are "carving reality at the joints"?

  4.  **Does the Resolution Actually Work?**
      *   **It's an Ongoing Debate:** There is no universally accepted solution. Each position faces significant challenges.
      *   **Partial Success:** Positions like Selective Realism and Structural Realism offer plausible accounts of *how* science can exhibit progress and continuity despite radical ontological shifts. They explain why past theories *worked* as well as they did and why their mathematical cores often survive.
      *   **Persistent Difficulties:**
          *   **Radical Falsehood:** Cases like phlogiston and caloric remain problematic. While their mathematical *consequences* might have been partially correct, their core ontological claims seem irredeemably false. Selective Realism struggles to find *any* preserved truth in the core claims; Structural Realism struggles if the mathematical formalism was ultimately discarded or fundamentally reinterpreted.
          *   **Hindsight Bias:** Identifying the "preserved" parts often relies on knowing the successor theory, raising concerns about circularity or historical distortion.
          *   **The "Miracle" Argument:** Realists argue that the success of science would be a "miracle" if theories weren't at least approximately true. Anti-realists counter that the success of *false* past theories (interpreted pessimistically) shows success doesn't require approximate truth – instrumental reliability suffices. The dual characterization feeds this debate.

  **Conclusion:**

  The tension you identified is central to the realism/anti-realism debate in the philosophy of science. While it fuels the Pessimistic Meta-Induction, it is a distinct problem concerning the **interpretation of the content and reference of superseded theories**. Positions like **Selective Realism** and **Structural Realism** explicitly attempt to resolve it by arguing that past theories were *partially correct* (in their structure, successful predictions, or reference) *enough* to explain their success and justify realism about the preserved elements, while acknowledging their *fundamental falsity* in other aspects. However, these resolutions are contested, particularly regarding theories with radically false core ontologies like phlogiston or caloric. The debate continues, highlighting the complexity of scientific progress and the challenge of characterizing the relationship between our theories and reality.
