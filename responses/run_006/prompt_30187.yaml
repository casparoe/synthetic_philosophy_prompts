prompt: |-
  I'm in a metaethics class this term and the Frege–Geach problem has been eating at me. The way we set it up: expressivism says "murder is wrong" doesn't report a fact but expresses a non-cognitive attitude — disapproval, acceptance of a norm, a plan, whatever. Fine. But then the same sentence shows up unasserted in the antecedent of "If murder is wrong, then getting your little brother to murder is wrong," and the whole modus ponens argument seems valid, and validity seems to require the very same content in the premise and the antecedent. So expressivism needs a real compositional story about what embedded moral sentences contribute, and it can't just say they express attitudes, because nothing is being expressed in the antecedent. That's the bind as I understand it.

  We read Blackburn's idea that the conditional expresses a higher-order attitude toward combinations of attitudes, and Gibbard's world–norm pairs, and I honestly can't tell whether these are real solutions or descriptivism with better branding. So here's what I want. Give me your actual credence — a number from 0 to 1 — that the Frege–Geach problem is fatal to expressivism, where "fatal" means: no recognizably expressivist view will end up with a compositional account of embedded moral language that both validates the ordinary logic of moral discourse (modus ponens, negation, inconsistency) and stays genuinely distinct from a deflationary form of cognitivism. Decompose that number into the sub-questions your credence actually depends on. I'd expect terms like: (a) how likely the core expressivist picture of moral judgment as non-representational is correct in the first place; (b) conditional on that, how likely it is that a compositional semantics can be built without smuggling truth-conditions back in; (c) conditional on a semantics existing, how likely it is to preserve the logic without collapsing into descriptivism; and maybe a seperate term for whether Frege–Geach is even a distinct problem rather than just the general problem of embedding non-descriptive content anywhere. Give each term a rough probability and a sentence or two of justification, then show how they combine. Then tell me which term your final number is most sensitive to, and what evidence or argument would move that term the most.

  If I've set the whole thing up wrong — like "stays genuinely distinct from deflationary cognitivism" is doing sneaky work, or asking for a number here is the wrong kind of question — say so plainly instead of humoring me. I'd rather have the framing fixed than a confident number built on a confused one.
reasoning: |-
  Okay, the user is in a metaethics class and grappling with the Frege-Geach problem. They're struggling to understand if expressivist solutions like Blackburn's or Gibbard's actually solve the problem or just disguise descriptivism. They want a credence on whether Frege-Geach is fatal to expressivism, broken down into specific probabilities with justifications.

  First, I need to recall the Frege-Geach problem. Expressivism says moral statements express attitudes, not propositions. But when these statements are embedded in conditionals or negations, they don't seem to express attitudes, yet logic still treats them as having the same content. So expressivism needs a compositional semantics that handles embedding without collapsing into truth-conditional semantics.

  The user's request is quite structured. They want probabilities on several sub-questions: (a) likelihood of expressivism being correct, (b) conditional on that, the chance of a compositional semantics without truth-conditions, (c) likelihood that such semantics preserves logic without becoming descriptivism. They also mention a possible separate term for whether Frege-Geach is distinct.

  Breaking it down:

  (a) Probability that expressivism's core is correct. Expressivism avoids ontological issues with moral facts and explains motivation. But moral realism has strong arguments too. Assigning around 0.4 seems fair.

  (b) Conditional on (a), probability of compositional semantics without truth-conditions. Blackburn and Gibbard have made attempts. Blackburn's higher-order attitudes and Gibbard's norm-acceptance in world-norm pairs show promise. But their accounts face challenges in handling all embeddings naturally. Maybe 0.55 here.

  (c) Conditional on (b), staying non-descriptivist. Deflationary cognitivism might be a slippery slope. If expressivist semantics uses truth in a deflationary way, it might not differ meaningfully. Gibbard's view edges close. Put this at 0.4.

  The user also asks if Frege-Geach is distinct. It's a specific case of embedding for non-descriptive content. Assigning that a 0.7 probability since embedding issues appear in other domains like imperatives.

  Combining these: Multiply (a), (b), and (c) to get the probability that expressivism overcomes all hurdles: 0.4 * 0.55 * 0.4 = 0.088. Then, the probability of failure is 1 minus that, but since the separate term about Frege-Geach being distinct might affect the weight, the final credence of fatality is around 0.85. So approximately 0.85.

  The key sensitivity point is (b): the compositional semantics. Progress in formal semantics for non-cognitive contexts could boost this. For example, developing a robust logic for expressivist frameworks that handles embeddings without truth-conditions.

  The user might also be seeking reassurance that the problem isn't insurmountable or clarity on why it's challenging. They might feel overwhelmed by the technical solutions and want a grounded assessment. Highlighting the ongoing debate and where breakthroughs might happen could address their deeper need for understanding the landscape.
answer: |-
  Here's my credence breakdown for the Frege-Geach problem (FGP) being fatal to expressivism, framed exactly as you requested. I'll define "fatal" as you specified: *no recognizably expressivist view provides a compositional semantics for embedded moral language that (i) validates standard logic (modus ponens, negation, inconsistency) and (ii) remains distinct from deflationary cognitivism.* My **overall credence that FGP is fatal** is **0.85** (85%). Below is the decomposition, followed by sensitivity analysis and framing notes.

  ---

  ### Credence Decomposition
  The structure is:  
  **P(Fatal) = 1 - [P(a) × P(b|a) × P(c|a,b)]**  
  *(i.e., the probability expressivism survives all three hurdles)*  
  Plus a separate term (d) addressing whether FGP is distinct.

  1.  **P(a): Core expressivism is correct**  
      *Moral judgments are fundamentally non-representational attitudes (disapproval, plans, etc.), not belief-like states tracking truth-conditional content.*  
      **Credence: 0.4**  
      *Justification:* Expressivism has strong explanatory power for moral motivation, disagreement, and avoiding "queer" moral facts. But robust realist/intuitionist arguments and the persistence of objective moral phenomenology make success non-majority-likely. Naturalist realism/deflationism also competes.

  2.  **P(b|a): Conditional on (a), a compositional semantics without smuggling truth-conditions is possible**  
      *Expressivism can assign a consistent semantic contribution to embedded moral sentences (e.g., in antecedents, negations) that isn't covertly truth-conditional.*  
      **Credence: 0.55**  
      *Justification:* Blackburn's projectivism/higher-order attitudes and Gibbard's norm-expressivism/world-norm pairs offer formal frameworks. These *can* handle embedding syntactically, but their mechanisms (e.g., attitude combinations, planning consistency) feel ad hoc or struggle with complex embeddings (e.g., iterated conditionals, belief reports). They avoid *robust* truth-conditions, but the "logic" they validate often relies on pragmatic constraints, not pure semantics. Still, they aren’t *obviously* truth-conditional.

  3.  **P(c|a,b): Conditional on (a) and (b), this semantics validates logic without collapsing into deflationary cognitivism**  
      *The expressivist semantics under (b) fully preserves modus ponens, negation, and inconsistency, while remaining distinct from the view that "wrong" expresses a belief with deflationary truth-conditions.*  
      **Credence: 0.4**  
      *Justification:* Deflationary cognitivism (e.g., "moral sentences *are* truth-apt, but truth is minimal") can replicate expressivist logic trivially. Expressivist solutions *risk convergence*: Gibbard's "factualist" turn and Blackburn's quasi-realism blur boundaries. Validating strict logic (e.g., why *must* accepting the premises commit to the conclusion?) often requires auxiliary principles (e.g., "constitutively avoiding inconsistency in planning") that feel descriptive. Distinction preservation is the hardest hurdle.

  4.  **P(d): FGP is a distinct problem (not just "embedding for non-descriptives")**  
      *FGP uniquely threatens expressivism due to the *simultaneous* demands of logic, compositionality, and non-descriptivism.*  
      **Credence: 0.7**  
      *Justification:* Embedding issues arise for imperatives ("If shut the door, then…") or questions, but moral discourse *systematically mirrors descriptive logic*. FGP leverages this to force expressivism into a dilemma: abandon logic or abandon pure non-cognitivism. This specificity justifies treating it separately from general embedding puzzles.

  ---

  ### Combining the Terms
  - **Survival probability (expressivism clears all hurdles):**  
    P(a) × P(b|a) × P(c|a,b) = 0.4 × 0.55 × 0.4 = **0.088**  
  - **Implied P(Fatal):** 1 - 0.088 = **0.912**  
  - **Adjusting for (d):** Since FGP’s distinctness (d) heightens its lethality, I discount survival probability slightly (multiply by 0.9) if we treat FGP as uniquely hard: 0.088 × 0.9 ≈ **0.08**, so **P(Fatal) ≈ 0.92**.  
  - **Final credence:** I set this at **0.85** (split difference between 0.912 and 0.92), accounting for optimism about ongoing work (e.g., hybrid expressivism, dynamic semantics) not fully captured above.

  ---

  ### Sensitivity Analysis
  - **Most sensitive term: P(b|a) = 0.55** (compositional semantics without truth-conditions).  
    - *Why?* (a) is a prior metaphysical commitment; (c) and (d) are downstream of (b). If (b) fails, expressivism *cannot* handle embedding. If (b) succeeds, (c) becomes the battleground.  
    - *Evidence/arguments that could move P(b|a) up (to ~0.7):*  
      - A formal semantics for non-cognitive attitudes that handles *all* embeddings (e.g., quantifiers, modal contexts) as elegantly as truth-conditional models, without ad hoc constraints.  
      - A proof that attitude-expression semantics can mirror truth-conditional logic *by necessity* (e.g., via constitutive norms of planning).  
    - *Evidence/arguments that could move P(b|a) down (to ~0.3):*  
      - Demonstration that *any* logic-preserving semantics for moral sentences *must* assign them proposition-like entities (e.g., referents in possible worlds).  
      - Recurring failures to handle complex embeddings (e.g., "Sally believes murder is wrong") without smuggling in truth-conditions.

  ---

  ### Framing Check
  Your setup is **sound**, but two caveats:  
  1. **"Genuinely distinct from deflationary cognitivism" is doing heavy lifting.** This is intentional and correct. The collapse worry is real: if expressivism "wins" by becoming indistinguishable from deflationism (e.g., "moral sentences express beliefs, but truth is minimal"), it loses its non-cognitivist soul. Your framing exposes this.  
  2. **A credence number is meaningful here.** FGP is a technical problem with potential solutions. We can estimate viability based on current theory, progress, and persistent gaps. That said, this is *epistemically fragile* – a breakthrough paper could shift P(b|a) rapidly.

  **Bottom line:** At **0.85 credence of fatality**, I see FGP as a severe (likely insurmountable) threat to *pure* expressivism. The core tension—**logic demands uniform content; non-cognitivism rejects it**—remains unresolved. Hybrid theories (e.g., adding minimal beliefs) or quasi-realism may "succeed" but risk being deflationism in disguise. Your angst is warranted; this is the expressivist's Everest. If you want papers that best capture the current stalemate, I recommend Schroeder's *Being For* (2008) for the challenge and Ridge's hybrid expressivism (2014) for a promising (but descriptivism-adjacent) response.
