prompt: |-
  I'm working through the literature on the is-ought gap and the naturalistic fallacy, and I keep finding that different camps talk past each other because they disagree on what would even count as bridging or respecting the gap. Before I go further, I want a specification of the job description: what must any adequate account of the relationship between descriptive and normative claims actually deliver?

  Give me the desiderata — the phenomena it must explain, the cases it must get right, the distinctions it must respect, the results from neighboring fields it cannot contradict — with the argument or example that makes each one a requirement. Then flag which are non-negotiable constraints on any account and which are parochial commitments of particular traditions (Humean, Moorean, expressivist, naturalist, and so on).

  I am especially interested in whether some subset of these desiderata cannot be jointly satisfied. If, for example, the features that make moral language cognitive enough to handle embedding in conditionals and negation also make it impossible to explain why fundamental moral disagreement does not resolve the way fundamental factual disagreement does, that is the kind of tension I want surfaced — the desiderata list itself would then be a result, not just a prelude.

  A brief scorecard of how the main families fare against the list is welcome, but the real work should be in motivating and defending each criterion. If you think some commonly demanded feature — that an account must vindicate the autonomy of ethics, say, or that it must be compatible with metaphysical naturalism — is not a genuine desideratum but a question-begging move by one side, say so and justify that judgment.
reasoning: |-
  Okay, let me approach this systematically. The user is clearly deep into metaethics and wants a rigorous framework for evaluating theories about the is-ought gap. They're frustrated with how different camps talk past each other, so I need to identify the core requirements any theory must satisfy before addressing partisan disputes.

  First, I should map the non-negotiable constraints. The logic of moral discourse is paramount - any account must explain how we actually use moral language. The Frege point about embedded contexts (like conditionals) seems undeniable; we can't ignore how "if stealing is wrong..." functions in reasoning. Similarly, the phenomenon of moral disagreement poses a real challenge - why don't moral disputes resolve like factual ones when both sides have equal access to evidence? This isn't just about expressivism vs realism; it's about observable linguistic behavior.

  Then there's the explanatory demand: why do descriptive facts seem relevant to moral conclusions even if they don't entail them? When we say "he lied" supports "he acted wrongly," that connection needs explaining regardless of one's metaethical stance. And motivational internalism, while debated, reflects how most people experience moral judgments - as intrinsically action-guiding. Even if externalists reject strong internalism, they still owe an account of why moral language typically motivates.

  Now for the contested desiderata. Autonomy of ethics seems like a Moorean presupposition rather than a neutral requirement. Naturalists would reject it outright. Metaphysical parsimony is another battleground - naturalists insist on it, while non-naturalists consider it question-begging. The "no queerness" constraint reveals its anti-realist bias when examined closely; realists would simply deny moral properties are metaphysically problematic.

  The key tension emerges between the cognitive features (logic, embedding) and the practical force of morality. How can moral judgments be both truth-apt and intrinsically motivating? How can moral disagreement persist despite shared reasoning methods? This is where expressivists struggle with embedding while realists struggle with motivation. The user's suspicion about incompatible desiderata seems well-founded - this may be the central puzzle.

  For the scorecard, I'll note how each tradition navigates these tensions. Naturalists handle logic well but stumble on disagreement; expressivists explain motivation but contort over embedding; non-naturalists respect cognitive features but face queerness objections. The trade-offs become clear when we see which desiderata each approach sacrifices.

  Finally, I should emphasize that the autonomy demand and metaphysical constraints often smuggle in partisan assumptions. The real test is whether a theory can satisfy the non-negotiable linguistic and psychological constraints while remaining internally coherent. That's the neutral ground where theories should be evaluated before doctrinal commitments enter.
answer: |-
  Here is a rigorous specification of the desiderata for any account of the descriptive-normative relationship, motivated by phenomena, distinctions, and constraints across metaethics. I'll categorize them as **Non-Nnegotiable Constraints** (NN: grounded in core phenomena any theory *must* explain) and **Parochial Commitments** (PC: tied to specific traditions, often question-begging). Key tensions will be highlighted.

  ---

  ### **Non-Negotiable Constraints (NN)**  
  *Must be addressed by any minimally adequate account, regardless of tradition.*

  1.  **The Logic & Semantics Constraint (NN)**  
      *Phenomenon:* Moral language embeds in complex logical structures: conditionals ("If lying is wrong, then deceiving is wrong"), negation ("Slavery is not just"), disjunctions, and propositional attitudes ("She believes stealing is wrong").  
      *Requirement:* The account must explain how normative claims function as truth-apt propositions within logical reasoning.  
      *Why Non-Negotiable:* Failure here renders moral discourse unintelligible or irrational. (Frege-Geach Problem).  
      *Tension:* Expressivists historically struggled here; non-cognitivists must show how "boo/hooray" attitudes embed logically.

  2.  **The Phenomenology of Disagreement (NN)**  
      *Phenomenon:* Moral disagreements feel *substantive* ("Torture is always wrong" vs. "Sometimes permissible") even when parties agree on all non-moral facts.  
      *Requirement:* The account must explain why such disagreements aren't merely clashes of taste or preference (e.g., "chocolate vs. vanilla").  
      *Why Non-Negotiable:* Central to moral experience; distinguishes ethics from mere conative states.  
      *Tension:* Relativist accounts struggle to explain why disagreements feel *faultless* yet *non-arbitrary*. Naturalists struggle if disagreement persists despite full descriptive knowledge.

  3.  **The Action-Guidingness Constraint (NN)**  
      *Phenomenon:* Moral judgments (e.g., "I ought to help") intrinsically motivate action (albeit defeasibly). Recognizing "X is wrong" typically generates motivation not to do X, distinct from descriptive beliefs.  
      *Requirement:* Explain the *internal connection* between moral judgment and motivation (Internalism).  
      *Why Non-N-Negotiable:* Essential to normative force; distinguishes "ought" from "is".  
      *Tension:* Strong internalism challenges cognitivist realism (How can a *fact* motivate?). Externalists must explain why moral judgments *feel* motivating.

  4.  **The Supervenience Constraint (NN)**  
      *Phenomenon:* If two acts/agents are identical in all descriptive respects, they must be identical in normative respects. No normative difference without a descriptive difference.  
      *Requirement:* Explain why descriptive facts *fix* normative facts.  
      *Why Non-Negotiable:* Observed in moral reasoning; denies radical arbitrariness.  
      *Tension:* Non-naturalists (e.g., Mooreans) must explain *how* supervenience holds without reduction. Naturalists must show descriptive facts *determine* normative facts.

  5.  **The Explanatory Relevance Constraint (NN)**  
      *Phenomenon:* Descriptive facts are cited as *reasons* for normative conclusions ("He lied" → "He acted wrongly"). Normative claims explain actions ("She donated because it was right").  
      *Requirement:* Explain how descriptive facts *support* normative claims, and how normative properties play explanatory roles.  
      *Why Non-Negotiable:* Integral to moral justification and folk psychology.  
      *Tension:* Non-naturalists struggle to show how non-descriptive properties explain actions; error-theorists deny they do.

  ---

  ### **Parochial Commitments (PC)**  
  *Often treated as desiderata but reflect specific philosophical biases.*

  6.  **The Autonomy of Ethics (PC - Moorean/Non-Naturalist)**  
      *Claim:* Normative properties cannot be *reduced* to descriptive properties.  
      *Why Parochial:* Presupposes that reduction is necessary for naturalism or that normativity is sui generis. Naturalists (e.g., Railton, Boyd) reject this, offering non-reductive accounts.  
      *Question-Begging:* Rules out naturalism by fiat. Moore's Open Question Argument assumes linguistic intuition trumps empirical analysis.

  7.  **Metaphysical Parsimony/Naturalism (PC - Naturalist)**  
      *Claim:* Accounts must not posit non-natural entities/properties (e.g., irreducible "oughts").  
      *Why Parochial:* Assumes ontological naturalism (all that exists is scientifically tractable). Non-naturalists (e.g., Parfit, Enoch) reject this as scientism.  
      *Question-Begging:* Defines "adequate" as "scientifically respectable," dismissing non-naturalism from the start.

  8.  **The No Queerness Constraint (PC - Humean/Expressivist)**  
      *Claim:* Moral properties must not be "queer" (e.g., intrinsically motivating facts).  
      *Why Parochial:* Assumes motivational internalism *requires* non-cognitivism or projects Humean psychology onto ontology. Realists (e.g., Brink) argue moral facts needn't be "queer" if motivation is contingent.  
      *Question-Begging:* Uses a psychological/epistemic worry to veto realism.

  9.  **Vindicating Folk Morality (PC - Realist/Quasi-Realist)**  
      *Claim:* Moral claims must be truth-apt and sometimes true.  
      *Why Parochial:* Error-theorists (e.g., Mackie) and expressivists (e.g., Blackburn) deny this is necessary. Folk semantics may mislead.  
      *Not Universal:* While NN requires *explaining* folk usage, it doesn't require *vindicating* it.

  ---

  ### **Key Tensions Between Desiderata**
  The core tension lies in reconciling the **Cognitive Features** (Logic/Semantics NN1, Disagreement NN2) with the **Practical Features** (Action-Guidingness NN3, Explanatory Relevance NN5):

  -   **Realism's Problem:** If moral claims describe mind-independent facts (satisfying NN1, NN2, NN4), how do they *necessarily* motivate (NN3)? Why does disagreement persist despite shared rationality (NN2)? (*Mackie's "queerness" charge; Brink's response weakens internalism*).
  -   **Expressivism's Problem:** If moral judgments are non-cognitive attitudes (satisfying NN3, NN5), how do they embed in logic (NN1)? How is disagreement substantive (NN2)? (*Blackburn's quasi-realism attempts this, but faces Frege-Geach*).
  -   **Naturalism's Problem:** If normative properties reduce to descriptive ones (satisfying NN4, NN5, PC7), how is moral disagreement possible despite factual agreement (NN2)? (*Horgan/Timmons' Moral Twin Earth argument*). How is normativity *action-guiding* (NN3) if it's just another descriptive fact?

  **The Irreconcilable Triad?**  
  1.  **Cognitiveism:** Moral claims are truth-apt propositions (for NN1, NN2).  
  2.  **Strong Internalism:** Moral judgments intrinsically motivate (for NN3).  
  3.  **Humean Psychology:** Beliefs alone cannot motivate; desire is required.  
  *Tension:* (1) + (2) imply motivating *beliefs*, contradicting (3).  
  *Resolution Required:* Abandon one (e.g., realists reject strong internalism; expressivists reject cognitivism).

  ---

  ### **Scorecard of Major Traditions**
  | **Desideratum**          | **Humean/Expressivist** | **Moorean/Non-Nat.** | **Naturalist** | **Error Theory** |
  |--------------------------|-------------------------|----------------------|----------------|------------------|
  | **NN1: Logic/Semantics** | ⚠️ (Quasi-realism)      | ✅                   | ✅             | ✅               |
  | **NN2: Disagreement**    | ✅ (Attitude clash)     | ✅                   | ⚠️ (Twin Earth)| ✅ (All false)   |
  | **NN3: Action-Guiding**  | ✅                      | ⚠️ (Weak int.)       | ⚠️ (Weak int.) | ❌ (No guidence) |
  | **NN4: Supervenience**   | ✅ (Explained)          | ⚠️ (Brute)           | ✅             | ✅               |
  | **NN5: Explanatory Role**| ⚠️ (Attitudes explain) | ⚠️ (Non-nat. props?) | ✅             | ❌               |
  | **PC6: Autonomy**        | ✅                      | ✅                   | ❌             | ✅               |
  | **PC7: Naturalism**      | ✅                      | ❌                   | ✅             | ✅               |
  | **PC8: No Queerness**    | ✅                      | ❌                   | ⚠️             | ✅               |

  **Legend:** ✅ = Strong Fit, ⚠️ = Partial/Tenuous Fit, ❌ = Poor Fit

  ---

  ### **Conclusion**
  The non-negotiable constraints reveal a **trilemma** for any account:  
  1. **Preserve cognitive logic & substantive disagreement** (NN1, NN2),  
  2. **Explain intrinsic motivational force** (NN3),  
  3. **Respect supervenience/explanatory relevance** (NN4, NN5).  

  No dominant theory satisfies all flawlessly:  
  - **Realists** (natural/non-natural) sacrifice strong internalism.  
  - **Expressivists** stretch to handle logic/disagreement.  
  - **Naturalists** struggle with disagreement's persistence.  
  - **Error-theorists** abandon normativity entirely.  

  **The central insight:** The "is-ought gap" isn't merely logical (Hume) or definitional (Moore)—it's the tension between morality's *objective pretensions* (logic, disagreement) and its *practical essence* (motivation, guidance). Any account must navigate this while respecting the *phenomenology* of moral practice (NN1-NN5). Parochial demands (PC6-PC9) often obscure this deeper challenge by importing metaphysical or semantic biases. Your desiderata list *is* the result: it maps the fault lines of metaethics itself.
