answer: |-
  Here’s a villanelle capturing the vertigo of Darwin's and Turing's inversions, weaving the refrains to reveal their shared core:

  **The Strange Inversion**

  No master plan the coral reef displayed,  
  No mind devised the swallow's southward flight.  
  **The coral builds without a blueprint's aid.**  
  Through shallow seas where random currents played,  
  A trillion tiny deaths made structure bright;  
  No master plan the coral reef displayed.  
  The engine plays the move the grandmaster made,  
  Finds patterns deep in data, day and night.  
  **The engine learns what no one ever said.**  
  Like frost on glass, complexity is laid  
  By cold arithmetic grinding slow and right.  
  No master plan the coral reef displayed.  
  It calculates the moves within the shade,  
  A ghost of reason, faceless in the light.  
  **The engine learns what no one ever said.**  
  From mindless parts, a world of sense is made:  
  The logic blooms, the structure takes its height.  
  **The coral builds without a blueprint's aid.**  
  **The engine learns what no one ever said.**

  ---

  **Why this works:**

  1.  **Refrains as Core Concepts:**
      *   **"The coral builds without a blueprint's aid."** (Darwin): Coral reefs are iconic examples of immense complexity (competence) built by countless simple organisms (polyps) following basic rules of survival and growth, without any overarching design (comprehension). "Blueprint" directly implies design.
      *   **"The engine learns what no one ever said."** (Turing): The "engine" represents an AI/machine. "Learns" implies competence (chess, pattern recognition). "What no one ever said" captures the inversion: it derives complex outputs (competence) from data and algorithms, without internal understanding (comprehension). It wasn't explicitly programmed for *that specific* insight.

  2.  **Developing the Theme:**
      *   **Stanza 1:** Establishes natural world competence (coral reef, swallow migration) arising without a plan, introducing the Darwin refrain.
      *   **Stanza 2:** Introduces the mechanical world (engine playing chess) and its competence, introducing the Turing refrain.
      *   **Stanza 3:** Connects the processes – both involve "cold arithmetic grinding slow and right" (selection pressure, algorithmic processing).
      *   **Stanza 4:** Focuses on the eerie, ghostly nature of machine competence.
      *   **Stanza 5:** States the core revelation: "From mindless parts, a world of sense is made." This applies equally to evolution and AI. "Logic blooms" and "structure takes its height" describe both outcomes.
      *   **Final Couplet:** The two refrains stand side-by-side, forcing the comparison. The structure highlights they are *parallel statements* describing the *same phenomenon* manifesting in different domains. The shared "vertigo" is inherent in realizing mindless processes can yield such intricate results.

  3.  **Accuracy & Accessibility:**
      *   **Knows the Idea:** Uses Dennett's key phrase "strange inversion" in the title. "Blueprint" directly opposes Paley's watchmaker argument Darwin overturned. "Engine learns what no one ever said" perfectly encapsulates machine learning's emergent competence without explicit programming for every outcome. "Cold arithmetic" describes algorithmic processes in both evolution and computation. "Ghost of reason" evokes the Turing Test illusion.
      *   **Doesn't Know the Idea:** Experiences a coherent poem about how complex, seemingly intelligent structures (reefs, birds) and actions (chess, learning) emerge from simple, unthinking processes (tiny polyps, calculation engines). The refrains create a hypnotic, unsettling rhythm reflecting the core paradox. Words like "coral," "engine," "blueprint," "arithmetic," "logic" are accessible anchors.
      *   **No Name-Dropping:** Darwin and Turing are never mentioned. The poem embodies their ideas through metaphor and specific examples.

  4.  **Villanelle Structure:**
      *   The relentless return of the refrains mimics the inescapable nature of these inversions once understood.
      *   The final juxtaposition delivers the intended punch – revealing the shared strangeness at the heart of life and machine intelligence. The form itself performs the inversion of expectations about where competence originates.
