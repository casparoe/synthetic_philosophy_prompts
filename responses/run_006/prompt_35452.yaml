prompt: |-
  I'm about to evaluate a batch of proposed debate protocols for scalable oversight, and before I read them I want the specification of what an adequate protocol has to deliver. Treat "debate" broadly: two or more agents argue for competing answers to a hard question in front of a judge who is much less capable than the debaters, and the judge must end up believing the answer that is true, or making the decision the truth would license, without independently checking the answer. Assume the questions are far beyond the judge — proofs of theorems the judge cannot follow end to end, predictions about codebases too large for the judge to audit, factual claims about records the judge cannot inspect — and assume that at least one debater may be adversarially optimizing to make the judge believe a false answer, including by exploiting the judge's biases rather than by arguing honestly.

  Write the desiderata: the full list of requirements any such protocol must satisfy to count as a solution to scalable oversight via debate, rather than an interesting game that happens to use arguments. Do not stop at the obvious candidates — truth-inducingness, robustness to lying, bounded judge effort, independence from a ground-truth oracle — though each of those must be defended with its failure mode; the value is in the requirements that are easy to miss. For each requirement, give the concrete failure mode or case that motivates it — a scenario in which a protocol lacking that property visibly fails. Then mark each requirement as non-negotiable or as a preference of a particular camp, and defend the classification rather than merely asserting it.

  The part I most want is the consistency analysis. Identify any subset of the desiderata that cannot be jointly satisfied given the setup — for example, anything forced by the judge's boundedness, by the absence of any ground-truth oracle, or by the adversary being at least as capable as the honest debater — and say exactly which requirement has to give and why. Also identify the single requirement that does the most work in excluding existing proposals: name it, say what it rules out, and say what it still leaves standing.

  Take a committed position. Do not give me a survey of possible desiderata with the tradeoffs left open; make definite calls about which requirements are genuine, which are non-negotiable, where the list is jointly unsatisfiable, and what an honest designer should sacrifice first.

  Structure the answer in exactly these sections:

  1. "Setup and scope" — the working definition of debate, the class of questions, and the assumptions about judge and debaters; flag any assumptions you need to add for the desiderata to be well-defined. (~150 words)

  2. "The fixed points" — the non-negotiable requirements, each with its motivating failure case and a sentence on why no protocol may drop it. (~350 words)

  3. "The contested requirements" — the desiderata that some camps treat as mandatory but you judge to be preferences, each with whose preference it is and what that camp buys by insisting on it. (~250 words)

  4. "Where the list breaks" — the jointly unsatisfiable subsets, the argument that they conflict, and which requirement gives way first. (~300 words)

  5. "The single most diagnostic requirement" — the one criterion that most efficiently separates live proposals from dead ones, with what it excludes and what survives it. (~150 words)

  6. "Verdict" — if you had to build a protocol, which requirements you would hold fixed, which you would relax, and in what order you would relax them under pressure. (~150 words)
reasoning: |-
  Okay, let me approach this systematically. The user wants a rigorous framework for evaluating debate protocols, with specific focus on inherent tensions and non-negotiable requirements. 

  First, I need to crystallize the core setup: asymmetric capabilities where debaters (potentially superhuman AIs) argue before a limited human judge on questions the judge cannot directly verify. The adversarial element is crucial - at least one debater may actively deceive.

  For non-negotiables, truth-induction must come first. Without it, the entire exercise fails. Consider a judge who consistently picks the more eloquent liar - that's the baseline failure. Then robustness: if the protocol breaks when debaters exploit loopholes (like distracting with emotional appeals), it's useless. Judge effort boundedness seems obvious but needs defense - unlimited cross-examination could theoretically work but isn't scalable. The no-ground-truth-oracle point is subtle but vital; if we required independent verification, debate would be pointless theater.

  The contested requirements are where philosophy creeps in. Symmetric burden of proof sounds ideal but may be unrealistic - forcing truth-tellers to "prove a negative" could backfire. Some researchers might insist on it for ethical reasons, but pragmatically, it's secondary. Similarly, open-endedness versus structured arguments involves tradeoffs between creativity and control.

  Now the painful part: consistency analysis. There's a fundamental tension between truth-induction and judge boundedness. If the judge is truly incapable of following proofs, how can they ever validate complex arguments? The liar could overwhelm with technicalities. This suggests truth-induction must be probabilistic or iterative rather than absolute - a hard pill for purists to swallow.

  For diagnostic power, "no false positives under optimal play" stands out. It immediately kills protocols where a silver-tongued debater can win with fiction. What survives? Possibly recursive debates where claims spawn sub-debates, forcing liars into ever-smaller lies until they crack.

  If building this, I'd hold truth-induction and robustness sacred. Judge effort constraints might need relaxing first - perhaps allowing tools to manage complexity. Symmetry would be next to go; in high-stakes settings, truth shouldn't need to work harder than lies.
answer: |-
  ### 1. Setup and Scope  
  Debate involves ≥2 agents (one honest, one adversarial) arguing before a "bounded judge" (human or weak AI) who cannot independently verify answers. Questions are complex (e.g., mathematical conjectures, security analyses of massive codebases). Debaters are superhumanly capable; the adversary seeks to deceive by exploiting judge weaknesses (e.g., cognitive biases, attention limits). Added assumptions:  
  - **Judge effort is poly-bounded** in problem size (e.g., cannot read 1M lines of code).  
  - **No ground-truth oracle exists** during debate (no external checker).  
  - **Adversary is at least as capable as the honest debater** (equal access to evidence/rhetoric).  

  ---

  ### 2. The Fixed Points (Non-Negotiables)  
  1. **Strict Truth-Induction**: *Failure case*: An honest debater arguing "P=NP" loses to an adversary fabricating a plausible-seeming "disproof" exploiting the judge’s inability to trace cryptographic reductions. *Why non-negotiable?* If debate doesn’t reliably converge to truth, it fails its core purpose.  
  2. **Adversarial Robustness**: *Failure case*: Adversary "wins" by distracting the judge with emotionally charged anecdotes about AI ethics during a debate on cryptographic security. *Why non-negotiable?* Without robustness, superhuman adversaries trivially bypass logic.  
  3. **Judge Effort Boundedness**: *Failure case*: Protocol requires judge to verify a 10,000-step proof. *Why non-negotiable?* Scalability collapses if judge effort scales with problem complexity.  
  4. **No Ground-Truth Oracle**: *Failure case*: Protocol relies on judge querying an external fact-database for "gotcha" checks. *Why non-negotiable?* If such oracles existed, debate would be redundant.  
  5. **Zero Unilateral Advantage**: *Failure case*: Adversary always wins if assigned "No" in a binary question. *Why non-negotiable?* Assignment bias lets adversaries win regardless of truth.  

  ---

  ### 3. The Contested Requirements (Preferences)  
  1. **Symmetric Burden of Proof**: *Preference of* rigorists (e.g., formal epistemologists). *Tradeoff*: Forces the honest side to "prove negatives" (e.g., "no backdoor exists"), risking false losses; but prevents adversarial stonewalling.  
  2. **Open-Ended Argumentation**: *Preference of* naturalism advocates. *Tradeoff*: Allows creative deception (e.g., sophistry) but captures real-world reasoning better than rigid formats.  
  3. **Perfect Consistency**: *Preference of* logic-centric camps. *Tradeoff*: Demands judges never contradict themselves under identical evidence; sacrifices human-like judgment for coherence.  
  4. **Collusion-Proofing**: *Preference of* security-hardened approaches. *Tradeoff*: Adds overhead (e.g., cryptographic commitments) to prevent covert coordination; often irrelevant if adversaries are non-cooperative.  

  ---

  ### 4. Where the List Breaks  
  **Conflict:** *Truth-Induction + Judge Boundedness + Adversarial Capability*.  
  - **Why?** An adversary can construct *valid-seeming but false* micro-arguments at a granularity below the judge’s discernment (e.g., "This AI code is safe because *<obscure lemma>* holds" where the lemma is subtly misapplied). The judge cannot audit the lemma without violating effort bounds.  
  - **Resolution:** *Truth-Induction must relax to "probabilistic truth-tracking"*. We sacrifice **deterministic correctness** for **bounded error rates**. A protocol guaranteeing "judge believes truth with probability ≥1-ε" survives; demanding perfect accuracy under adversarial optimization is impossible.  

  **Secondary conflict:** *Symmetric Burden + Robustness*.  
  - Forcing honesty to prove unfalsifiables (e.g., "no alien civilizations exist") makes robustness impossible. *Symmetric Burden* yields first.  

  ---

  ### 5. The Single Most Diagnostic Requirement  
  **"No false positives under optimal adversarial play"** (a consequence of Truth-Induction + Robustness).  
  - **Excludes:**  
    - **"Optimization dares"** (e.g., "Prove this code *isn’t* secure"): Adversary wins by default if honesty can’t refute all possible attacks.  
    - **Self-contradiction traps** (e.g., "Spot the lie in my 3 statements"): Adversary crafts undetectably consistent fictions.  
  - **Survives:**  
    - **Recursive debates** (e.g., disputing sub-claims in new debates): Forces adversaries to defend lies in progressively simpler contexts until they crack.  
    - **Cross-examination protocols** with incremental evidence disclosure.  

  ---

  ### 6. Verdict  
  **Hold fixed:**  
  1. Truth-Induction (probabilistic variant).  
  2. Adversarial Robustness.  
  3. Judge Effort Boundedness.  

  **Relax in order:**  
  1. **Perfect Consistency** → Accept "human-consistent" judges (e.g., swayed by rhetoric if logically sound).  
  2. **Symmetric Burden** → Let honesty shift burden for unfalsifiables (e.g., "Show a *single* backdoor if you claim it exists").  
  3. **Collusion-Proofing** → Assume non-coordinating adversaries initially; add mitigations only if demonstrated vulnerability.  

  **Sacrifice last:** Zero Unilateral Advantage (bias unmasks all protocols). Build around recursive evidence-reduction to force adversary overextension within judge bounds.
