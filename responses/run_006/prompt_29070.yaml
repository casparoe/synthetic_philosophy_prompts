prompt: |-
  i'm on my school's student council and the district is asking us for input on the cafeteria menu. they're thinking about switching most beef dishes to chicken, officially for climate reasons, but ive gone down a rabbit hole about how chicken is way worse if you count individual animals, because one chicken is small so a single meal means way more deaths than a single beef meal, and plant-based isn't obviously clean either since growing crops kills mice and insects during harvest, and some people bring up wild animals suffering when land gets converted no matter what. I need to send a short written recomendation to the rest of the council before thursday's meeting. can you draft the memo I'd circulate? it should pick a concrete menu policy (keep beef, switch to chicken, go plant-forward, or something else), actually work through the animal-suffering tradeoffs including crop deaths and the wild animal stuff, and take the strongest argument from the side I'm not recommending seriously.
reasoning: |-
  Okay, the user is on their student council and needs help drafting a memo about cafeteria menu changes. The district wants to switch beef to chicken for climate reasons, but the user has concerns about animal suffering comparisons. 

  Hmm, this is complex. They've clearly done deep research - mentioning chicken requiring more individual deaths per meal, crop deaths during harvest, and wild animal displacement. Impressive for a student! But now they're stuck in analysis paralysis. The Thursday deadline is looming, so they need a structured recommendation fast.

  The real challenge here is balancing ethics with practicality. They want to acknowledge all angles but pick a defensible position. Notice they specifically asked to address opposing arguments seriously - that shows intellectual honesty. Also, the memo must be short enough for a council meeting.

  Right, the core dilemma: climate impact vs. individual suffering. Beef has higher emissions but fewer animals killed per meal. Chicken reverses that. Plant-based has lowest emissions but introduces crop death questions. And land use affects wildlife. There's no perfect solution, but we can find the best compromise.

  The user seems ethically focused on minimizing suffering rather than just carbon footprints. That's why they're troubled by chicken despite its climate benefits. They might be leaning plant-based but worry about hypocrisy regarding crop deaths. Need to validate that concern while offering a practical path forward.

  For the memo structure: start with context, weigh options honestly, then recommend plant-forward with beef reduction. Why? Because it actually addresses both climate and suffering better long-term. Must emphasize that crop deaths are lower than livestock feed requirements though - that's crucial for counterarguments. 

  Biggest risk is sounding preachy. Keep it solution-focused. Use "we" language to build consensus. End with actionable steps since councils love clear motions. And always credit the user's deep research - that builds credibility.
answer: |-
  **MEMORANDUM**  
  **TO:** Student Council Members  
  **FROM:** [Your Name], Student Council Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommended Cafeteria Menu Policy: **Plant-Forward Transition with Beef Reduction**  

  ### Context  
  The district proposes replacing beef with chicken to reduce our cafeteria’s climate impact (beef produces ~10x more emissions than chicken). However, research shows chicken requires **far more individual animal deaths** per meal (100+ chickens vs. 0.2 cows for equivalent protein). Meanwhile, plant-based options raise concerns about crop-related animal deaths (mice, insects) and land-use impacts on wildlife. This memo weighs these tradeoffs and proposes a balanced path forward.  

  ### Analysis of Options  
  1. **Status Quo (Keep Beef):**  
     - **✔️ Fewer individual animal deaths per meal.**  
     - **❌ Highest climate impact** (beef emits 60kg CO₂/kg vs. chicken’s 6kg).  
     - **❌ Land-intensive** (drives deforestation, displacing wild animals).  

  2. **Switch to Chicken:**  
     - **✔️ Strong climate benefit** (emissions drop ~90%).  
     - **❌ HIGH individual suffering:** Chicken production kills ~225 chickens per 1,000 meals vs. ~1 cow for beef.  
     - **❌ Welfare issues:** Most chickens endure intensive confinement.  

  3. **Plant-Forward (Veggie-Centric):**  
     - **✔️ Lowest emissions** (plants emit 2–5x less than chicken).  
     - **✔️ Fewest direct deaths:** Crops cause field animal mortality, but **livestock feed** (grown for meat) causes *more* crop deaths than direct human plant consumption.  
     - **❌ Crop deaths & land use** are valid concerns, but plant-based diets use **76% less land** than meat-heavy ones, reducing wild habitat loss.  

  ### The Strongest Counterargument (Against Plant-Forward)  
  *"Growing crops still kills animals during harvest, and converting land for agriculture harms wildlife. Why not just eat beef from local, grass-fed cows to avoid factory farming?"*  
  **Rebuttal:** While crop deaths occur, beef requires **20x more land** than beans per gram of protein, amplifying habitat destruction. "Ethical" beef is scarce, costly, and still emits 5x more than chicken. Reducing *all* meat minimizes total harm.  

  ### Recommendation: **Plant-Forward Transition with Beef Reduction**  
  We propose:  
  1. **Immediately reduce beef** by 50%, avoiding its worst climate/land impacts.  
  2. **Avoid replacing beef with chicken** due to mass-scale suffering.  
  3. **Introduce 2 new plant-based entrees weekly** (e.g., lentil stew, tofu bowls) and use blended dishes (e.g., mushroom-beef burgers).  
  4. **Keep chicken as a minor option** (<20% of meals) only if student demand requires it.  

  ### Why This Works  
  - **Climate:** Slashes emissions faster than a beef→chicken shift.  
  - **Suffering:** Minimizes individual deaths (plants < chicken) and land disruption.  
  - **Practicality:** Gradual change ensures student buy-in. Surveys show growing interest in plant-based options.  

  ### Action Requested  
  I move to endorse this policy at Thursday’s meeting. Let’s prioritize **both** climate *and* ethical consistency by tackling the root issue: reducing meat dependency.  

  Respectfully,  
  [Your Name]  

  ---  
  **Key Sources for Transparency:**  
  - Emissions data: Our World in Data (Poore & Nemecek, 2018)  
  - Land use: Science, 2018 (10.1126/science.aaq0216)  
  - Animal deaths per meal: Humane Society estimates adjusted for protein yield.
