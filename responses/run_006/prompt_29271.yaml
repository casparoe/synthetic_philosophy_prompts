  The key point is that without a group setting, they lack common knowledge. Each might think that others are still committed or that voicing dissent might be risky. There's uncertainty about whether the group as a whole is ready to abandon the pivot. This prevents coordination because no one wants to be the first to speak up in a group setting, fearing isolation or conflict.

