  Now for the 1974 charge: Popper argued natural selection was untestable because it's "tautological" - survival of the fittest just means those who survive are defined as fittest. It could explain any outcome after the fact but couldn't predict specific evolutionary changes. Like saying "whatever happens must have been adaptive" - which is circular reasoning. Under strict falsificationism, this would make Darwinism metaphysical rather than scientific.

  Then in 1978 he changed his mind. Why? Probably because evolutionary biologists showed how selection makes testable predictions - like predicting antibiotic resistance patterns or finch beak changes during droughts. These are potentially falsifiable: if bacteria evolved resistance without antibiotics, or if beaks changed randomly during food shortages, that could refute natural selection.

  But here's the philosophical tension: these tests often involve historical reconstruction rather than lab experiments. Popper might have stretched his criterion to include observable patterns in nature as "tests," or accepted that testability comes in degrees. The criterion officially requires risky predictions that could definitively falsify, but in practice, evolutionary biology deals with probabilities and complex systems where absolute falsification is hard.

  My assessment: Popper didn't fundamentally change his criterion but applied it more flexibly. He realized Darwinism generates testable auxiliary hypotheses (like specific adaptation predictions) even if the core theory is broad. This reveals that his demarcation line was always somewhat fuzzy - especially for historical sciences where direct experimentation is limited. The episode doesn't break falsificationism but shows it needs nuance when dealing with complex, temporal systems.

