  **Recommendations for Lecture**:  
  1. Contrast Augustine’s mental-state focus with contemporary "false statement + intent to deceive" definitions (e.g., Kant's stricter view).  
  2. Highlight how the *duplex cor* doctrine makes lying a sin against *self-integrity* before it deceives others.  
  3. Discuss residual tensions: Can "will to deceive" exist without *duplex cor*? Augustine implies no, but cases like ambiguous irony challenge this.  
  4. Reference *Retractationes* 1.27 where Augustine later regrets not distinguishing "jocose lies" but reaffirms this definition’s core.  

  This analysis underscores Augustine’s radical claim: **Truthfulness is fidelity to one’s mind, not to objective fact.** The ethical burden lies in rigorous intellectual honesty.
