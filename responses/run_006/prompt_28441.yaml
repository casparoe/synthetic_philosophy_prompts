  Three main questions to address:
  First is the believing/opining distinction. Augustine defines believing as holding something true while aware you might not know it (e.g., "I believe it'll rain though I'm no meteorologist"). Opining is thinking you know something you actually don't (e.g., "I know the earth is flat" based on flawed reasoning). Both can lead to false statements without lying, but opining carries epistemic arrogance. This matters because lying requires conscious mismatch between mind and speech; if you sincerely voice your belief/opinion, you're not lying even if wrong.

  Second is the double heart (*duplex cor*). It's the core of lying: a dual mental state where you conceal what you think is true and present what you think is false. It's not identical to intention to deceive but is its necessary psychological mechanism. Augustine explicitly says you can have a double heart without successful deception (e.g., lying to a skeptic who sees through it). The will to deceive springs from this duality.

  Third is the moral implication of making mental state paramount. Recklessly asserting falsehoods (e.g., spreading rumors without verification) isn't lying for Augustine but is still blameworthy as epistemic vice. The professor might worry this lets irresponsible speakers off the hook morally, but Augustine condemns such recklessness separately under "believing what one ought not." The lie-specific sin is the intentional betrayal of truth through double-heartedness.

