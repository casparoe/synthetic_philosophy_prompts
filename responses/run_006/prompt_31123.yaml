prompt: |-
  I'm putting together a grad seminar on democratic theory and I want to open with the boundary problem — the question of who should count as the demos, i.e., who gets a say in a given collective decision, before we even talk about how decisions get made. I keep seeing people gesture at the all-affected-interests principle or the all-subjected-to-the-laws principle and then immediately poke holes with kids, tourists, expats, permanent residents, future people. Before I assign any positive view, I want the full spec of what an adequate answer to the boundary problem actually has to do.

  Write me the desiderata: the cases a theory has to classify correctly, the distinctions it isnt allowed to collapse, the constraints it has to respect, and the reason each one is a requirement. Cases I want to see at least touched: long-term noncitizen residents, citizens abroad, children, convicted felons, tourists, future people, stateless people, and people outside a state who are affected by its environmental policy. I also want you to say whether the theory owes any answer about nonhuman animals, or whether that's a different question.

  On the distinctions: make clear whether a theory has to keep apart being affected by a decision, being subject to a law, and having a stake in the outcome; inclusion in the demos vs how much weight your voice gets; and constituting the demos vs the decision rule used within it. Flag which requirements are non-negotiable and which are just one camp's taste. Then tell me which pairs of requirements you suspect can't be jointly satisfied — my money's on determinacy plus the all-affected idea, but argue it — and which single requirement does the most to rule out the standard principles. Also address the bootstrapping worry directly: is it a real constraint that a theory cant just say the demos decides its own boundaries because that presupposes a demos, or is that overblown? I want the list to do the work; skip the scorecard of existing views except where it makes a requirement vivid.
reasoning: |-
  Okay, the user is organizing a grad seminar on democratic theory and wants to start with the boundary problem—who should be included in the demos. They've seen principles like all-affected-interests or all-subjected-to-the-laws but noticed issues with edge cases like children, tourists, future generations, etc. They want a comprehensive list of desiderata that any adequate theory must address.

  First, I need to outline the key requirements. The user mentioned several cases: long-term noncitizen residents, citizens abroad, children, convicted felons, tourists, future people, stateless people, and those affected by environmental policies. Each of these groups presents unique challenges. For example, long-term residents who aren't citizens might be subject to laws but can't vote, while future generations are affected by current decisions but can't participate.

  The user also wants distinctions clarified: affected vs. subjected vs. having a stake; inclusion vs. voice weight; demos constitution vs. decision rules. These are crucial. Being affected by a law isn't the same as being bound by it. Tourists might be affected by local laws but not subjected long-term. Also, including someone in the demos is different from how much influence they have in decisions.

  I should address nonhuman animals. The user asks if that's a separate issue. Probably yes, because democratic theory traditionally centers on human agents, but some theories might extend to animals. That's a boundary call they might need to note but not necessarily solve.

  The bootstrapping problem: Can the demos decide its own boundaries without presupposing an existing demos? This is a real constraint. Solutions might involve provisional boundaries or external principles, but it's tricky.

  Conflicts between requirements: Determinacy vs. all-affected principle. All-affected is vast and vague—everyone is affected by everything. Making it determinate might require arbitrary lines, conflicting with the principle's inclusivity. Similarly, non-arbitrariness clashes with administrative feasibility when including stateless people or those affected by environmental policies.

  Key non-negotiables: Moral considerability, non-arbitrariness, agency respect, and avoiding bootstrapping. Others like determinacy or feasibility might be flexible but desirable.

  For each case, the theory must explain inclusion or exclusion. Children: included but maybe without full voting rights? Felons: excluded but why? Future generations: how to represent them? Each tests different aspects of the theory.

  The user might have deeper needs: wanting students to grapple with foundational issues before evaluating existing theories. Highlighting conflicts helps them see why no theory is perfect. Also, clarifying distinctions prevents common conflations in discussions.
answer: |-
  Here’s a comprehensive list of desiderata for an adequate theory of the demos boundary problem, structured to meet your seminar’s needs. I’ve organized it around core requirements, key distinctions, critical cases, and inherent tensions, avoiding scoring existing theories except where illustrative.

  ---

  ### **I. Core Requirements (Non-Negotiable)**
  1. **Moral Considerability Requirement**  
     *What it demands*: Every being with morally relevant interests potentially impacted by collective decisions must be accounted for in the theory—even if not granted full membership.  
     *Why*: To avoid legitimizing tyranny over the ignored (e.g., colonial subjects historically excluded).  
     *Constraint*: Failure here renders the theory ethically indefensible.

  2. **Non-Arbitrariness Requirement**  
     *What it demands*: Boundaries cannot rely on morally irrelevant criteria (e.g., race, birthplace randomness). Distinctions must track normatively significant differences.  
     *Why*: Arbitrary exclusions replicate the injustices democracy aims to overcome.  
     *Constraint*: Rules out "birthright citizenship alone" as sufficient.

  3. **Agency-Respect Requirement**  
     *What it demands*: The theory must acknowledge persons as agents (not just interest-bearers) where appropriate.  
     *Why*: Democracy is fundamentally about self-rule; reducing people to passive recipients of outcomes undermines its core.  
     *Constraint*: Forces engagement with *how* inclusion relates to autonomy.

  4. **Bootstrapping Constraint**  
     *What it demands*: The theory cannot presuppose a pre-existing demos to define itself.  
     *Why it’s real (not overblown)*: "Let the demos decide its boundaries" requires prior boundaries to identify the deciders, creating infinite regress or circularity.  
     *Constraint*: Rules out pure procedural self-determination as a starting point.

  ---

  ### **II. Key Distinctions a Theory Must Maintain**
  - **Affected vs. Subjected vs. Stakeholder**:  
    - *Affected*: Impacted by outcomes (e.g., a farmer downstream of a polluting factory).  
    - *Subjected*: Bound/enforced by the rule (e.g., a resident fined for breaking a law).  
    - *Stakeholder*: Has a fundamental life-interest at stake (e.g., long-term residents facing deportation).  
    *Why the distinction matters*: Conflating these collapses disparate moral claims (e.g., tourists are *subjected* to traffic laws but lack the *stake* of residents).

  - **Inclusion in Demos vs. Voice Weight**:  
    - *Inclusion*: Who gets formal membership (e.g., voting rights).  
    - *Voice Weight*: How much influence members have (e.g., proportional representation).  
    *Why*: A theory must explain why children might be in the demos (protected interests) but lack voting rights (voice weight adjusted for capacity).

  - **Constituting the Demos vs. Decision Rules**:  
    - *Constituting*: Who is a member.  
    - *Decision Rules*: How decisions are made (e.g., majority vote).  
    *Why*: A theory can’t "solve" boundary issues by altering decision rules (e.g., "let voters decide non-members’ interests" dodges the core question).

  ---

  ### **III. Critical Cases & Required Classifications**
  Each theory must credibly classify these groups (not necessarily grant full membership, but explain their status):
  - **Long-term noncitizen residents**: Subjected to laws + high-stake interests → strong claim for inclusion.  
  - **Citizens abroad**: May be affected/have stakes but not subjected → weak claim unless ties are significant.  
  - **Children**: Developmentally limited agency but profoundly affected → likely partial inclusion (e.g., via guardians/proxy).  
  - **Convicted felons**: Subjected to laws but excluded → must justify if exclusion is punitive vs. forfeiture of agency.  
  - **Tourists**: Temporarily subjected/affected but minimal stakes → clear exclusion case.  
  - **Future people**: Deeply affected but no agency → must account for interests without literal inclusion.  
  - **Stateless people**: Not subjected anywhere? → tests universality of principle.  
  - **Foreigners affected by environmental policy**: Affected but not subjected → forces "affected interests" to confront overextension.  

  **Nonhuman Animals**:  
    - *Status*: Separate question but revealing.  
    - *Why*: If "interests" or "subjection" define the demos, animals challenge anthropocentrism. A theory should clarify if it *excludes* them by design (e.g., agency requirement) or admits them (radically expanding demos).

  ---

  ### **IV. Tensions Between Requirements**
  1. **Determinacy vs. All-Affected Principle**  
     - *Conflict*: All-affected is infinitely expansive (butterfly effect) and vague. Determinacy demands clear, administrable boundaries.  
     - *Why likely irreconcilable*: Drawing a line (e.g., "significantly affected") is inherently arbitrary under all-affected. Sacrificing determinacy makes the theory useless in practice.  
     - *Your money’s safe*: This is the core tension disabling all-affected as a standalone solution.

  2. **Non-Arbitrariness vs. Feasibility**  
     - *Conflict*: Perfectly non-arbitrary theories (e.g., "include all subjected") struggle with hard cases (e.g., stateless people). Feasibility demands workable institutional answers.  
     - *Example*: Including stateless people may require global institutions, violating statist feasibility.

  3. **Bootstrapping vs. Democratic Self-Determination**  
     - *Conflict*: Self-determination requires the demos to set its rules, but bootstrapping forbids presupposing the demos.  
     - *Resolution attempt*: "Provisional boundaries" (e.g., current residents) that are revisable—but this risks privileging insiders.

  ---

  ### **V. Which Requirement Rules Out the Most?**
  - **The Bootstrapping Constraint** does the heaviest lifting:  
    - *Rules out*: Unqualified self-determination principles ("the people decide who the people are").  
    - *Why*: It exposes circularity in all major proceduralist approaches, forcing appeal to external moral criteria (e.g., subjection, stakeholding).

  ---

  ### **VI. Desiderata Table: Quick Reference**
  | **Requirement**          | **Purpose**                                     | **Non-Negotiable?** | **Threatened By**           |
  |--------------------------|------------------------------------------------|---------------------|-----------------------------|
  | Moral Considerability    | Prevent moral exclusion                        | Yes                 | Stateless/future people cases |
  | Non-Arbitrariness        | Block unjust distinctions                     | Yes                 | Birthright citizenship      |
  | Agency-Respect           | Center self-rule                               | Yes                 | Over-emphasis on interests  |
  | Bootstrapping Compliance | Avoid circularity                              | Yes                 | Self-determination axioms   |
  | Determinacy              | Ensure practical applicability                 | No (but vital)      | All-affected principle      |
  | Feasibility              | Enable real-world implementation               | No                  | Global demos proposals      |
  | Case Responsiveness      | Handle hard cases convincingly                 | No (but expected)   | Tourist/felon ambiguities   |

  ---

  ### **Why This List Works for Your Seminar**
  - **Foundational Focus**: Forces students to grapple with *what a solution must achieve* before assessing theories.  
  - **Case-Driven**: Anchors abstraction in concrete dilemmas (e.g., "Does a tourist get a vote on park benches?").  
  - **Tensions Highlighted**: Prepares students to see why no theory is perfect (e.g., all-affected vs. determinacy).  
  - **Bootstrapping Confronted**: Prevents glib appeals to "let democracy decide itself."  

  This framework ensures your students won’t just critique principles but will demand rigorous, coherent alternatives that meet these demands. Assigning this *before* positive views will make the subsequent theory engagement far more critical.
