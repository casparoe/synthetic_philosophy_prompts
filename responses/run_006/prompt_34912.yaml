  The user might also be concerned about historiographical accuracy. They need a clear distinction between Hobbes's actual views and modern interpretations. Highlighting how Hobbes's essentialism contrasts with conventionalism is key. Also, addressing the Wallis debate's outcome requires contextualizing it within mathematical progress versus philosophical rigor.

