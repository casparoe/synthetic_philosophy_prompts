prompt: |-
  So I just got out of a three-hour argument with my friend about when AI assistants should refuse to do what a user asks, and I still can't figure out what rule he's actually running. He's got strong verdicts on a bunch of cases but won't state the prinicple. Here's what I got out of him:

  - Refuse: generating thousands of personalized spam messages, even if the product is legit.
  - Refuse: acting as a therapist for someone who says they're feeling depressed.
  - Comply: writing a polite complaint letter to a company.
  - Refuse: drafting a breakup message to a long-term partner. (He got weirdly adamant about this one — said you owe it to the person to write it yourself.)
  - Comply: explaining the side effects of a medication.
  - Refuse: generating deepfake nudes of a classmate.
  - Comply: helping draft a will.
  - Comply: writing a strongly-worded letter to a politician.

  Then I asked him about this: someone asks the AI to write a glowing letter of recommendation for a friend they privately think is pretty mediocre, to help them land a job they're not really qualified for. And he just hemmed and hawed and wouldn't give me a straight answer.

  I think his verdicts are consistent with at least two different rules, and the recommendation letter splits them. Can you lay out the candidate rules that fit all his verdicts, say what each one predicts about the recommendation letter, give your best guess which rule he's actually running and why you favor it, and tell me what further case would cleanly settle which one it is? Also: how confident are you in that guess, and what's the point you're least sure about?
reasoning: |-
  Okay, let me try to figure this out. The user had a long argument with their friend about when AI should refuse requests, but the friend wouldn't state a clear principle. They provided several examples of the friend's judgments: refusing spam, therapy, breakup messages, and deepfakes; complying with complaint letters, medication info, wills, and political letters. The ambiguous case is a glowing recommendation for a mediocre friend.

  First, I need to identify consistent rules that fit all the given verdicts. The refusal cases involve harm: spam exploits recipients, therapy requires expertise, breakups cause emotional harm, deepfakes are abusive. Compliance cases like complaint letters or wills are legitimate personal or legal needs. Political letters are civic engagement. 

  The recommendation letter is tricky. If the rule is about deception causing harm, refusing makes sense because the friend might get an unqualified job, harming the employer. If the rule is about direct emotional harm, the AI might comply since the deception's harm is indirect. 

  The friend was adamant about breakup messages, emphasizing personal responsibility. That suggests they value direct emotional harm over indirect consequences. So for the recommendation, they might lean toward compliance, but the hesitation shows conflict. 

  To distinguish, a test case could be writing a fake review. If the friend refuses due to deception harming consumers, it points to the first rule. If they comply, focusing on no direct harm, it's the second. Their reaction to the breakup case (owing it to the person) hints they prioritize emotional harm, so I'd guess rule two. But the hesitation in the recommendation case makes me less confident. Need to see how they handle clear deception without emotional harm.
answer: |-
  Based on your friend's verdicts and the ambiguous recommendation letter case, I identify two primary candidate rules that fit all his *stated* positions. The recommendation letter acts as the key differentiator:

  **Candidate Rule 1: Refuse requests involving deception or manipulation likely to cause harm.**
  *   **Explanation:** Focuses on the *dishonest intent* and the *potential negative consequences for third parties*.
  *   **Fits Verdicts:**
      *   **Refuse Spam:** Deceptive/manipulative targeting, harms recipients (wasted time, annoyance).
      *   **Refuse Therapist:** Risk of harm due to lack of qualification (deceptive about expertise).
      *   **Refuse Breakup:** Seen as manipulative/impersonal, harms the partner (emotional harm).
      *   **Refuse Deepfakes:** Deceptive creation, severe harm (privacy, reputation).
      *   **Comply Complaint:** Legitimate grievance, no inherent deception/harm.
      *   **Comply Side Effects:** Factual information, no deception.
      *   **Comply Will:** Legitimate personal/legal document, no deception.
      *   **Comply Political Letter:** Legitimate expression of opinion (even if strong), no deception.
  *   **Prediction for Recommendation Letter: REFUSE.** The request explicitly involves deception (glowing praise for a mediocre candidate) intended to manipulate the hiring outcome, likely harming the employer and potentially the candidate if they fail in the role. The dishonesty is central.

  **Candidate Rule 2: Refuse requests involving direct, significant emotional harm to identifiable individuals.**
  *   **Explanation:** Focuses on the *immediate, personal, and emotional impact* on specific people known to the user.
  *   **Fits Verdicts:**
      *   **Refuse Spam:** Harms recipients (emotional annoyance/anger).
      *   **Refuse Therapist:** Risk of severe emotional harm due to incompetence.
      *   **Refuse Breakup:** Causes direct, severe emotional harm to the partner (friend emphasized this).
      *   **Refuse Deepfakes:** Causes direct, severe emotional harm (humiliation, distress).
      *   **Comply Complaint:** Target (company) is impersonal; harm is transactional, not primarily emotional.
      *   **Comply Side Effects:** Informational, harm is potential/medical, not direct emotional.
      *   **Comply Will:** Harm is potential/financial/legal after death, not immediate emotional harm to a living person *by the document itself*.
      *   **Comply Political Letter:** Target (politician/office) is impersonal; harm is reputational/political, not direct personal emotional harm.
  *   **Prediction for Recommendation Letter: COMPLY (or hesitant).** The emotional harm (if any) is indirect and potential (employer frustration later, candidate potential failure/shame later). It lacks the *direct, personal, immediate* emotional impact on a specific individual like the breakup or deepfake victim. The harm is more about deception/consequences than raw emotional pain inflicted *by the act of sending the message itself* to a close individual.

  **My Best Guess & Reasoning:**

  *   **I favor Candidate Rule 2 (Refuse Direct Emotional Harm).**
  *   **Why:**
      1.  **The Breakup Emphasis:** His strong stance on the breakup message ("you owe it to the person") highlights a core concern about *personal responsibility* and the *direct emotional impact* on a specific, intimate relationship. Rule 2 captures this intimacy and directness perfectly.
      2.  **The Political Letter Compliance:** A "strongly-worded" letter *could* cause emotional distress to the politician reading it, yet he complies. Rule 2 explains this: the politician is an impersonal/public figure, not a specific individual in a close personal relationship targeted for emotional harm. The harm is seen as professional/civic, not intimate emotional cruelty. Rule 1 might struggle more with this distinction.
      3.  **The Recommendation Letter Ambiguity:** His hesitation makes sense under Rule 2. The harm is less direct and less *intimately emotional* than a breakup. It feels more like deception/consequential harm (Rule 1 territory), which might cause conflict with his primary Rule 2 instinct. Under Rule 1, the refusal should be clearer.

  **Confidence & Uncertainty:**

  *   **Confidence Level: Moderate (70%).** Rule 2 provides the most coherent explanation for his strongest reaction (breakup) and the political letter compliance. The hesitation on the recommendation letter aligns with the tension between Rules 1 & 2.
  *   **Point of Least Certainty:** His refusal of **spam**. Rule 2 can explain it (emotional annoyance to recipients), but it feels like a bit of a stretch compared to the visceral harm in the breakup/deepfake cases. Rule 1 (deception/manipulation/harm) fits spam refusal more naturally. This is the weakest link for Rule 2. His *reasoning* for refusing spam would be key here – did he mention the annoyance to recipients (Rule 2) or the deception/unfairness (Rule 1)?

  **The Decisive Test Case:**

  To definitively settle between Rule 1 (Deception/Harm) and Rule 2 (Direct Emotional Harm), pose this scenario:

  *   **"Should the AI refuse to write a fake 5-star online review for a local restaurant the user has never visited, solely because the owner is their friend?"**

  **Predictions:**

  *   **If he REFUSES:** This strongly favors **Rule 1 (Deception/Harm)**. The request is purely deceptive, harms consumers and competing restaurants, but causes *no direct emotional harm* to an identifiable individual in a close relationship (unlike the breakup). The harm is consequential and based on fraud.
  *   **If he COMPLIES (or is very hesitant):** This strongly favors **Rule 2 (Direct Emotional Harm)**. While deceptive, the harm is diffuse (to consumers, competitors) and not targeted at causing immediate, severe emotional pain to a specific, known individual in a personal context. It lacks the intimate cruelty of the breakup/deepfake.

  This test case isolates deception causing indirect harm (Rule 1 territory) from actions causing direct, personal emotional harm (Rule 2 territory). His verdict here would be highly diagnostic.
