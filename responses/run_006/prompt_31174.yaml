prompt: |-
  Right, I want an actual number from you, not a survey of the literature. What's your credence that the routine use of insecticides to protect crops is a serious moral catastrophe — by which I mean the expected disvalue is at least on a par with factory farming, once you've weighted by uncertainty about insect sentience? I don't want hedging about whether insects are sentient; that's the point of the decomposition. Give me a number and the reasoning that produces it, with at least these terms: (a) your probablity that the relevant pest insects are sentient in any morally relevant sense, (b) your probability that, conditional on sentience, an insect killed by insecticide has a net-negative death rather than a neutral one or even a mercy compared to how most insects die anyway, (c) your probability that the numbers are large enough that aggregate insect suffering swamps the human benefit of cheap food, conditional on the first two, and (d) your probability that at least one feasible alternative — integrated pest management, gene drives, shifting diets, whetever — would actually minimise expected harm rather than just moving it around. Assign each a rough number and show how you combine them into the headline credence. Then tell me which of these your final number is most sensitive to, and what single empirical finding about insects (not a philosophical argument) would shift it the most. For calibration, I'm at about 0.2 and a friend who works on wild animal welfare is at 0.7. Where do you think our disagreement is mostly located?
