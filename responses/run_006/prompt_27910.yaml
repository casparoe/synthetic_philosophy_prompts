prompt: |-
  I'm giving a department colloquium next month defending modal realism — the Lewisian version, where possible worlds are concrete, spatiotemporally isolated universes just as real as ours, and "possibly p" is true iff some such world has p true at it. The audience is mostly metaphysicians and philosophers of math: actualists to a person, several of them perfectly happy with worlds as abstract objects (maximal consistent sets of propositions, recombinations of universals, that sort of thing) but convinced concrete worlds are a nonstarter; two senior people are Platonists who accept a huge ontology of abstracta yet get visibly irritated at the idea of believing in things we are causally cut off from. My positive argument, compressed: actualist accounts either leave primitive modality unexplained or don't supply real truthmakers for modal claims, whereas modal realism gives one uniform reductive story and the weirdness is just the price of the ticket. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this room — not the incredulous stare, they're past that — ordered by how much damage they'd do, each phrased the way one of them would actually put it, with a two-minute reply and an honest note on where the reply is weakest. Include the question I'm hoping nobody asks, and tell me what I should concede up front so I dont look evasive.
reasoning: |-
  Okay, the user is preparing for a department colloquium defending David Lewis's modal realism. They need a Q&A prep sheet with eight objections likely to come from their audience of metaphysicians and philosophers of math. The audience includes actualists who prefer abstract possible worlds and Platonists who dislike causally isolated entities. 

  First, I need to understand the user's core argument: modal realism reduces modality without primitives, while actualist accounts either leave modality unexplained or lack truthmakers. The user wants objections phrased as the audience would, ranked by damage potential, with concise replies and honest weaknesses noted. They also want the dreaded unasked question and upfront concessions.

  The audience's key positions matter here. Actualists will challenge the ontology of concrete worlds. Platonists accept abstracta but draw the line at causally isolated concreta. Objections will likely focus on ontological commitment, explanatory power, theoretical virtues, and epistemology. 

  Top objections should include:
  1. **The ontological cost objection** (most damaging) - Why multiply concrete entities when abstracta suffice? Reply: Abstract worlds don't provide real truthmakers. Weakness: Doesn't fully address why concreteness is necessary.
  2. **The recombination objection** - Concrete worlds can't ground all possibilities like abstract worlds can. Reply: Recombination handles possibilities fine. Weakness: May not cover impossible entities.
  3. **The transworld identity problem** - How do individuals exist across worlds? Reply: Counterparts avoid the issue. Weakness: Loses genuine transworld identity.
  4. **The epistemology worry** - How can we know about causally isolated worlds? Reply: Modal knowledge is primitive. Weakness: Parity argument isn't fully satisfying.
  5. **The theoretical virtues critique** - Lewis's view isn't simpler overall. Reply: Qualitative parsimony matters more. Weakness: Quantitative bloat is still jarring.
  6. **The abstracta comparison** - Platonists accept abstracta but reject concrete worlds. Reply: Abstracta have similar epistemological issues. Weakness: Concreteness feels ontologically heavier.
  7. **The semantics objection** - Abstract worlds handle truth conditions just as well. Reply: They lack truthmakers. Weakness: Truthmaker theory isn't universally accepted.
  8. **The modality charge** - Primitive modality sneaks in. Reply: Recombination defines possibility without primitives. Weakness: May rely on primitive "naturalness."

  The user's nightmare question is about the actuality indexical - why privilege our world? This is hard to answer without sounding dismissive. The best reply is to bite the bullet and admit it's arbitrary but necessary.

  For upfront concessions, the user should acknowledge the weirdness and that counterpart theory modifies transworld identity. This shows awareness of costs without undermining their argument.

  The user's deeper needs include appearing prepared for tough objections, demonstrating understanding of opposing views, and showing where their position has vulnerabilities. They want to avoid seeming dogmatic or evasive. The prep sheet should balance robust defense with intellectual humility.
answer: |-
  Here's your Q&A prep sheet, tailored to your audience and argument, prioritizing objections by damage potential (high to medium). I've phrased them authentically and included concise replies, weaknesses, your nightmare question, and upfront concessions.

  **Upfront Concessions (State Early):**  
  1. **"Yes, it's ontologically extravagant. I agree it's counterintuitive & costly."** (Acknowledge weirdness upfront to avoid seeming dogmatic.)  
  2. **"Counterpart Theory replaces transworld identity; objects don't literally exist in multiple worlds."** (Pre-empts identity objections; shows you’re not overreaching.)  

  **The Nightmare Question (Pray They Don’t Ask):**  
  *"David, if all worlds are equally real and concrete, why is* this *world metaphysically privileged as 'actual'? Isn't 'actual' just an indexical ('here')? If so, doesn't that make all modal claims fundamentally* perspective-dependent *in a way that undermines objective truth—and worse, doesn’t it make* you *a necessary being relative to your world, which is absurd?"*  
  *Reply:* "The indexical account *saves* objectivity: 'actual' rigidly denotes the world we’re in, just as 'here' rigidly denotes a location. Truths about what’s possible are world-independent facts about the pluriverse. My necessity is trivial: every counterpart of me is necessary in their world, but that doesn’t inflate my status."  
  *Weakness:* Conceding "actuality" is *only* indexical feels nihilistic to many; it doesn’t resolve the intuitive sense that our world *is* metaphysically special.  

  ### Top 8 Objections (High to Medium Damage):  
  1. **"Why multiply concrete entities *ad infinitum* when abstract worlds (e.g., maximal consistent sets) provide truth conditions without the ontological bloat?"** (Senior Platonist)  
     *Reply:* "Abstract worlds don't *make* modal claims true; they merely describe them. If a unicorn is possible, what *grounds* that truth? An abstract set doesn't contain a horn or flesh—it's just a description. Concrete worlds provide real truthmakers: a unicorn's possibility is grounded in a flesh-and-blood unicorn *somewhere*."  
     *Weakness:* Truthmaker theory is contentious; some deny modal claims *need* truthmakers beyond truth-conditions.  

  2. **"Your 'recombination' principle presupposes primitive modality! You say worlds recombine *possible* spatiotemporal parts—but isn't 'possible' here just unanalyzed modality?"** (Metaphysician focused on reduction)  
     *Reply:* "Recombination is *combinatorial*: it takes the perfectly natural properties of *actual* objects and permutes them spatiotemporally without assuming 'possibility.' It’s a non-modal recipe for generating worlds."  
     *Weakness:* "Permuting without restriction" may implicitly rely on modal notions like "no contradiction," and "natural properties" might smuggle in modality.  

  3. **"How can concrete worlds explain *impossible* entities (e.g., round squares)? Your theory says they’re impossible because no world contains them—but that’s circular! Abstract accounts explain impossibility via logical inconsistency *without* worlds."** (Phil Math specialist)  
     *Reply:* "Impossibility *is* the absence from all worlds. A 'round square' isn’t a genuine entity; it’s a contradictory description that fails to pick out anything in any world. The explanation is reductive: inconsistency = no concrete instantiation."  
     *Weakness:* Feels like cheating for mathematical impossibilities (e.g., "2+2=5"); abstracta handle logical constraints more elegantly.  

  4. **"If worlds are causally isolated, how can we *know* anything about them? This makes modal knowledge inexplicable!"** (Epistemology-leaning actualist)  
     *Reply:* "We know *our* world’s properties and use recombination to infer possibilities. We don’t observe other worlds; we deduce their content from the actual. Just as Platonists know abstracta non-empirically, we know possibilities via rational analysis of actuality."  
     *Weakness:* Recombination is fallible; we might misjudge what’s recombinable (e.g., before quantum mechanics).  

  5. **"Lewis claims his view is 'parsimonious' by reducing modality—but adding infinite concrete worlds is quantitatively *less* parsimonious than primitive modality or abstract worlds!"** (Theoretical virtues critic)  
     *Reply:* "Parsimony is about *qualitative* economy: types, not tokens. Modal realism adds only one type of thing (concrete worlds) but eliminates a primitive *kind* of fact (brute modality). Abstract worlds often add new primitive types (e.g., uninstantiated universals)."  
     *Weakness:* Quantitative bloat *is* intuitively unparsimonious; Lewis’ redefinition feels ad hoc.  

  6. **"As a Platonist, I accept uncountable abstracta—but concreta we’re causally cut off from are epistemically and metaphysically *odious*. Why believe in *this* type of inaccessible entity?"** (Senior Platonist)  
     *Reply:* "Inaccessibility isn’t decisive. Your mathematical abstracta are also causally inert and inaccessible to perception—yet you accept them for theoretical utility. Concrete worlds do analogous work for modality, and they’re no more 'odious' than numbers."  
     *Weakness:* Concreta *feel* like they should be detectable; abstracta don’t. The disanalogy stings.  

  7. **"Why not prefer *ersatz* worlds? If I take a maximal consistent set of propositions as a 'world,' I get the same semantic utility without your ontological excess."** (Actualist with abstract-world leanings)  
     *Reply:* "Ersatz worlds are *representations*, not truthmakers. When we say 'a unicorn exists in W,' what *makes* that true? If W is a set of propositions, it’s true only if that set is consistent—but consistency is a modal fact! You’ve reduced worlds to modality, not eliminated it."  
     *Weakness:* If propositions are primitive, this might not bother them; some accept ungrounded modality.  

  8. **"Counterpart Theory is a *revision* of our modal concepts—not an analysis. We *do* think *I* could have been a sailor, not just a similar person. You’ve changed the subject!"** (Metaphysician focused on intuition)  
     *Reply:* "Our pre-theoretic intuitions are confused. Transworld identity leads to contradictions (e.g., 'I could have had different origins'). Counterparts preserve what matters: qualitative similarity and de re possibilities, without incoherence."  
     *Weakness:* Bites a huge bullet; most think de re modality is *about* the same object.  

  ### Strategic Tips:  
  - **Emphasize truthmaking** when facing abstract-world proponents—this is your strongest card.  
  - **Redirect to reduction** against Platonists: "You accept abstracta for explanatory power; I do the same for concreta."  
  - **Concede graciously** on intuition costs (e.g., "I agree counterparts feel revisionary") but pivot to theoretical payoff.  
  - **If pressed on the nightmare question**, stress that indexicality *preserves* objectivity: "All facts about the pluriverse are absolute, including which world is actual-from-here."  

  This prep makes you look prepared, intellectually honest, and focused on the core trade-off: ontological cost vs. explanatory power. Good luck!
