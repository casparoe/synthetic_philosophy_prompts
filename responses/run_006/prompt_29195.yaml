prompt: |-
  I've been going through some decision problems a friend sent me and I'm trying to figure out what principle, if any, my choices add up to. Here's what I'd pick, just going on gut:

  Situation 1:
  Option A: $1 million, guaranteed.
  Option B: 89% chance of $1 million, 10% chance of $5 million, 1% chance of $0.
  I pick A. The thought of walking away with nothing when I could have had a million is unbearable, even if it's only a 1% risk.

  Situation 2:
  Option C: 11% chance of $1 million, 89% chance of $0.
  Option D: 10% chance of $5 million, 90% chance of $0.
  I pick D. The odds of winning are so close that the bigger prize swamps the tiny difference in probability.

  Situation 3:
  Option E: 50% chance of $200, 50% chance of $0.
  Option F: $100 for sure.
  I pick F. I'll take the sure thing.

  Situation 4:
  Option G: 0.001% chance of $10 million.
  Option H: 0.002% chance of $5 million.
  I pick G. Both are basically lottery tickets, so I go for the bigger prize.

  Situation 5:
  Option I: 50% chance of $200, 50% chance of $0.
  Option J: $100 for sure.
  I pick J, same as in Situation 3. But now my friend says: what if each option only happens if a coin lands heads (50%), and otherwise you get nothing? So:
  Option I': 25% chance of $200, 75% chance of $0.
  Option J': 25% chance of $100, 75% chance of $0.
  And weirdly, I want to switch to I'. The certainty of the $100 was what made J attractive, and now that its gone, the extra upside of I' pulls me in.

  Situation 6:
  Option K: 80% chance of $400, 20% chance of $0.
  Option L: $300 for sure.
  I pick L.

  Situation 7:
  Option M: 20% chance of $400, 80% chance of $0.
  Option N: 25% chance of $300, 75% chance of $0.
  I pick M. Even though the ratio of probabilities is the same as in Situation 6 (4:1), I flip. When the probabilities get low, I chase the higher amount.

  So: is there a coherent rule that gets all seven of these? I've heard that "expected utility theory" says my choices in 1 and 2 contradict eachother, and that 5 and the pair 6/7 are also problems for it. But I don't know the alternatives. Is there some other theory of rational choice that fits all of them? If not, which of my verdicts is the hardest to defend, and what does the best available principle say about a case I didn't list: a choice between a 0.1% chance of $1 billion and a 0.2% chance of $500 million?
reasoning: |-
  Okay, let me start by understanding what the user is asking. They've listed seven different decision scenarios and their choices in each. They want to know if there's a coherent principle behind all their choices, especially since some seem to contradict expected utility theory (EUT). They also mentioned that their friend pointed out contradictions, so they're probably looking for validation or an explanation of their intuition.

  First, I need to recall what expected utility theory says. EUT is about maximizing the expected value, which is probability multiplied by outcome. But the user's choices don't always align with that. For example, in Situation 1, they chose the guaranteed $1M over a gamble with a higher expected value because of the 1% chance of nothing. That's risk aversion. But in Situation 2, they picked the higher prize despite a slightly lower chance, which seems risk-seeking. That's the first contradiction under EUT.

  Then there's the certainty effect in Situations 3 and 5. They preferred the sure $100 over a 50% chance of $200, but when both options were made uncertain (25% each), they switched to the higher risk option. That's the Allais paradox, showing that certainty has extra weight. Prospect theory explains this with the value function, which is concave for gains but steeper for losses, and probability weighting.

  Situations 6 and 7 show that they're risk-averse when there's a sure gain but risk-seeking when probabilities are low. Again, prospect theory's probability weighting function accounts for this—people overestimate small probabilities and underestimate larger ones. So in Situation 7, a 20% chance feels more significant than 25% because of this distortion.

  The user's choice in Situation 4 (going for the bigger jackpot despite lower probability) also aligns with overweighting small probabilities. Even though both chances are tiny, the $10 million feels disproportionately better.

  Now, the user's deeper need might be understanding why their gut feelings lead to these decisions and if there's a rational framework that justifies them. They might be worried that their choices are irrational, but prospect theory actually normalizes these behaviors. They also want to know about the billion-dollar question, which tests if they consistently overweight small probabilities.

  I should explain prospect theory's components: the S-shaped value function and the inverse-S probability weighting. Then map each situation to these concepts. Highlighting that the certainty effect, probability weighting, and loss aversion explain their choices without contradiction. 

  For the billion-dollar case, prospect theory predicts they'd choose the 0.1% chance of $1B because the probability weighting makes small chances feel larger, and the higher amount has a marginally higher weighted utility. But I should note that this depends on individual weighting parameters. 

  The hardest verdict to defend? Probably Situation 2, where they chose the 10% chance of $5M over 11% of $1M. The expected values are $500K vs $110K, so it makes sense numerically, but under EUT with risk aversion, the sure million in Situation 1 conflicted. However, prospect theory resolves this through different decision weighting in gains versus mixed prospects.

  In summary, the user's choices are consistent with prospect theory, which accounts for how people perceive probabilities and values in real-life decisions, unlike EUT. Their intuition isn't irrational; it's how humans actually evaluate risks and rewards.
answer: |-
  Your choices reveal a pattern consistent with **Prospect Theory** (Kahneman & Tversky, 1979), which explains why Expected Utility Theory (EUT) struggles with your judgments. Here's how each situation fits:

  ### Key Principles of Prospect Theory:
  1.  **Loss Aversion:** Losses hurt more than equivalent gains feel good.
  2.  **Diminishing Sensitivity:** The difference between $0 and $100 feels larger than between $100 and $200.
  3.  **Probability Weighting:** People overweight very small probabilities and underweight moderate-to-high probabilities. Probabilities near 0% are treated as more than their objective value; probabilities near 100% are treated as less than their objective value.

  ---

  ### Analysis of Your Choices:
  1.  **Situation 1 (A over B):**
      *   **EUT Conflict:** B has higher expected value ($1.39M vs $1M). Your aversion to the 1% chance of $0 overcomes the 10% chance of $5M.
      *   **Prospect Theory Fit:** **Loss Aversion** makes the 1% chance of $0 loom very large. The certainty of A is overweighted.

  2.  **Situation 2 (D over C):**
      *   **EUT Conflict:** Combined with Situation 1, this violates EUT (Allais Paradox). C offers $110K EV, D offers $500K EV. Your choice here is rational under EV but conflicts with your extreme risk aversion in Situation 1 for similar probabilities.
      *   **Prospect Theory Fit:** No sure thing exists. The probabilities (11% vs 10%) are both moderate and likely underweighted similarly. The **difference in value ($5M vs $1M)** dominates due to diminishing sensitivity (concave value function for gains). $5M feels *much* better than $1M, outweighing the tiny probability difference.

  3.  **Situation 3 (F over E):**
      *   **EUT Conflict:** E has higher EV ($100 vs $100). Your choice violates EUT's risk-neutrality assumption.
      *   **Prospect Theory Fit:** **Certainty Effect.** The guaranteed $100 is overweighted compared to the 50% chance. Loss aversion makes the 50% chance of $0 in E feel worse than the value of the 50% chance of $200 feels good.

  4.  **Situation 4 (G over H):**
      *   **EUT Conflict:** H has higher EV ($100 vs $100). Your choice violates EV.
      *   **Prospect Theory Fit:** **Probability Weighting.** Both probabilities are tiny and dramatically overweighted. The **difference in prize ($10M vs $5M)** dominates perception due to diminishing sensitivity.

  5.  **Situation 5 (J over I, then I' over J'):**
      *   **EUT Conflict:** Original: Same as Situation 3 (violation). Modified: I' has higher EV ($50 vs $25). Your switch *to* I' is consistent with EV here, but inconsistent with your original choice under the framing change.
      *   **Prospect Theory Fit:** **Framing Effect / Certainty Effect Removal.** In the original, the certainty of J was key. In the modified version, *both* options are risky gambles. The certainty effect disappears. The higher potential gain ($200 vs $100) in I' now drives your choice, consistent with Situation 2 logic.

  6.  **Situation 6 (L over K):**
      *   **EUT Conflict:** K has higher EV ($320 vs $300). Your choice violates EV.
      *   **Prospect Theory Fit:** **Certainty Effect.** The guaranteed $300 is overweighted compared to the 80% chance of $400. The 20% chance of $0 feels significant due to loss aversion.

  7.  **Situation 7 (M over N):**
      *   **EUT Conflict:** N has higher EV ($75 vs $80). Your choice violates EV.
      *   **Prospect Theory Fit:** **Probability Weighting.** Low probabilities (20%, 25%) are overweighted. The difference between 20% and 25% feels smaller than it is. The **difference in prize ($400 vs $300)** becomes the dominant factor due to diminishing sensitivity, similar to Situation 2 & 4.

  ---

  ### Coherent Rule: Prospect Theory
  **Your choices are highly consistent with Prospect Theory.** You exhibit:
  *   **Strong Loss Aversion:** Avoiding sure losses or risks of loss (S1, S3, S6).
  *   **Certainty Effect:** Overweighting guaranteed gains (S1, S3, S6).
  *   **Diminishing Sensitivity:** Valuing larger gains proportionally less, but still enough to choose them when probabilities are similar or both low (S2, S4, S7).
  *   **Probability Weighting:** Overweighting very small probabilities (S4) and underweighting high probabilities (contributing to S1, S6). Perceiving small differences in low probabilities as insignificant (S2, S7).
  *   **Framing Dependence:** Changing preference when a sure thing is reframed as probabilistic (S5).

  ---

  ### The Hardest Verdict to Defend (Under Strict Rationality)
  **Situation 2 (D over C)** is the most challenging under *any* standard theory aiming for consistency, though Prospect Theory explains the *psychology* best.

  *   **Why:** In Situation 1, you treated a 1% risk of $0 as catastrophic compared to a 10% chance of gaining $4M extra. In Situation 2, you treat a 1% *decrease* in the chance of winning *anything* (11% vs 10%) as insignificant compared to the chance to win $4M extra. The risk of getting $0 jumped from 1% (in B) to 90% (in D)! Your intense fear of a small risk of $0 in S1 clashes dramatically with your willingness to accept a massive increase in the risk of $0 (from 89% to 90% chance of *not* winning in S1 vs S2, but the focal risk shifts) for a larger prize in S2.
  *   **Prospect Theory's Defense:** It hinges on the *framing* and the *presence/absence of a sure thing*. S1 has a salient, guaranteed reference point ($1M). Losing *that* feels terrible. S2 has no salient reference point; both are long shots. The comparison is purely between the two gambles, where the prize difference dominates the negligible probability difference. The psychological weight of the risk changes dramatically based on context.

  ---

  ### The Billion-Dollar Choice: 0.1% of $1B vs 0.2% of $500M
  *   **Expected Value:** 
      *   0.1% of $1B = **$1 Million**
      *   0.2% of $500M = **$1 Million**
  *   **Under EUT (Risk-Neutral):** Indifferent.
  *   **Under Your Pattern (Prospect Theory):** You would likely choose the **0.1% chance of $1 Billion**.
      *   **Why:** Both probabilities are extremely small and will be significantly **overweighted**. However, due to **diminishing sensitivity**, the perceived difference between $1B and $500M is *less* than the difference between $500M and $0. Nevertheless, Prospect Theory's probability weighting function typically implies that for *very small* probabilities, people often chase the **larger maximum potential gain** (as in your Situation 4 choice), especially when the EVs are equal. The "dream" of $1B is disproportionately more attractive than the dream of $500M, even at half the (objectively tiny) chance. Your choices in S4 and S7 support this tendency to favor the bigger prize when probabilities are small or similar.

  **In summary, your "gut" choices align remarkably well with the descriptive (how people *actually* decide) model of Prospect Theory, not the normative (how people *should* decide) model of Expected Utility Theory. This explains the seeming contradictions that EUT highlights.** Your aversion to small losses when a sure gain exists, combined with your pursuit of large gains when facing long shots or similar moderate probabilities, is the core pattern.
