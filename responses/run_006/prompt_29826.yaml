prompt: |-
  I'm a PhD student in art history and I've been poking around in philosophy of art on the side, trying to get a handle on the forgery debates. I read this passage in a popular-audience philosophy book and something about it feels off to me, but I can't quite articulate where it goes wrong:

  "Why do we care if a painting is a forgery? If a copy is so perfect that no expert can tell it from the original, then it gives the same visual experience — the same colors, the same brushstrokes, the same composition. Philosophers who say forgeries matter usually appeal to the object's history: a real Vermeer was touched by Vermeer, and that historical connection is what we value. But this is just snobbery dressed up as theory. If the aesthetic experience is identical, the forgery is just as good as art. The only thing you lose is the investment value, which is a market fact, not an aesthetic one."

  Is this a fair summary of the philosophical debate? I'm not asking whether you agree with the conclusion — I want to know whether it accurately represents the positions its arguing against, and whether the moves it makes actually track whats at stake in the literature. What would Dutton or Goodman or someone working in that tradition say if they got a chance to respond? And is there a genuine distinction the summary is collapsing that would matter even to someone sympathetic to its conclusion?
