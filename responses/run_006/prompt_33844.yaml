answer: |-
  Here's a breakdown of how *Arrival* engages with the presentism/eternalism debate, where it succeeds, where it philosophically slides, and the unique contribution of its emotional arc – perfectly suited for your course:

  **Where *Arrival* Genuinely Dramatizes Eternalism:**

  1.  **The "Block Universe" Experience:** The film's core achievement is visualizing Louise's *subjective experience* of the eternalist "block universe." Her non-linear perception of time – seeing her daughter's life simultaneously with her present work, remembering the future – powerfully illustrates the core eternalist idea that all temporal points are equally real. It makes abstract metaphysics visceral.
  2.  **"Time Doesn't Work That Way"**: Louise's repeated statement captures the essence of challenging presentism. Her experience demonstrates that the "flow" of time from future to present to past isn't fundamental; it's a feature of human cognition (which the Heptapods transcend). This directly opposes presentism's claim that only the present exists.
  3.  **Knowledge *of* the Future as Experience:** Louise doesn't just predict the future; she *remembers* it. This reframes "foreknowledge" as *access* to a real part of the temporal structure. It dramatizes the eternalist claim that the future *is real*, just not *present* to us in our usual state. Her visions aren't prophecies; they are experiences of events existing in the timeless block.
  4.  **The Heptapod Language as a Metaphor:** The circular, non-linear Heptapod script, requiring simultaneous understanding of the whole, serves as a brilliant metaphor for the eternalist view. Learning the language literally rewires the brain to perceive time non-linearly, mirroring how adopting an eternalist metaphysics fundamentally changes one's conceptual framework.

  **Where the Film Philosophically Slides (and Needs Pushback):**

  1.  **Conflating Eternalism with Determinism/Fatalism:** This is the film's most significant philosophical slippage. Louise *experiences* her knowledge of the future as binding and unchangeable ("I forgot how good it felt to be held by you"). She *acts* as if knowing the future means she has no choice but to enact it. Philosophers would strongly push back:
      *   **Eternalism ≠ Determinism:** Eternalism is a thesis about the *ontological status* of past, present, and future (all equally real). Determinism is a thesis about *causal necessity* (every event is fixed by prior causes). You can be an eternalist indeterminist (e.g., the block universe contains genuinely random quantum events or free choices). The block universe *includes* the agent's deliberation and choice at the relevant temporal location.
      *   **Foreknowledge ≠ Fixity:** Knowing *that* something will happen doesn't necessarily mean it *must* happen independently of your actions. Your knowledge could be *based* on your future actions. Louise knowing her daughter will die young doesn't *cause* the daughter to die; it means Louise's choice to have her is part of the fixed block that *includes* the daughter's illness and death. Her choice is *part* of the reality she perceives, not negated by it.
  2.  **Implied Incompatibility of Foreknowledge and Agency:** The film heavily implies that Louise's non-linear perception inherently removes her ability to choose otherwise ("Despite knowing the journey and where it leads, I embrace it"). However:
      *   **Agency Within the Block:** Philosophers like Dennett argue that free will and agency are compatible with determinism (compatibilism). Similarly, within eternalism, agency exists *at* the time of the action. When Louise chooses to call Shang, she *is* choosing freely *at that moment in spacetime*. Her future knowledge doesn't erase that moment of choice; it's simply that her choice is part of the fixed structure she perceives non-linearly. Her knowledge is a *consequence* of her future choice, not its negation.
      *   **The "Can't Change" Misconception:** Louise feels she "can't change" the future. But philosophers argue that within eternalism, "changing" the future is a nonsensical concept *from a timeless perspective*. The future isn't changeable *because it already exists as a concrete part of reality*, just like the past. You don't "change" the past; you act within the timeline. Her feeling of powerlessness stems from confusing her privileged perspective (seeing the block) with the nature of agency (which happens *within* the block).
  3.  **Presenting Choice as an Illusion:** The film's emotional weight relies on Louise feeling her choices are preordained. While this captures a *phenomenological* consequence of her new perception, it risks suggesting that under eternalism, choice *is* an illusion. Philosophers would argue that choices are real events *within* the block universe. Her decision to have her daughter, made with full knowledge, *is* a genuine act of will occurring at a specific point in her life, even if it's eternally fixed.

  **The Emotional Arc's Unique Contribution:**

  Louise's choice to have her daughter Hannah, knowing she will die young, adds a profound dimension impossible to capture in a purely logical argument:

  1.  **The Value of Suffering and the Meaning of Life:** Philosophical arguments about freedom vs. determinism often focus on responsibility or control. Louise's choice forces the question: *Is a life destined for profound loss still worth living?* Her "embrace" of the journey despite knowing the pain answers "yes." It dramatizes an existential stance: meaning isn't derived from controlling outcomes but from embracing the entire narrative, joy and sorrow included. This resonates with themes in existentialism and stoicism.
  2.  **Love and Inevitability:** The film explores whether knowing an end diminishes love's value. Louise's choice argues that love's depth isn't negated by its finitude or predetermined end; it might even be intensified by the conscious acceptance of loss. This adds an emotional weight to the "reality" of future events – they are real enough to grieve *now*.
  3.  **Agency as Affirmation, Not Control:** Louise's ultimate agency isn't in *changing* the future but in *affirming* it. Her choice is an act of radical acceptance and love *within* the constraints (or structure) of her perceived reality. This reframes agency not as the power to alter destiny but as the conscious commitment to a path known to contain suffering. It's a powerful, emotionally resonant model of "free will" compatible with non-linear time perception.
  4.  **Lived Experience vs. Abstract Theory:** A paper argues logical points; the film makes you *feel* the weight of knowing the future. It forces the audience to confront: *Would you do it? Could you bear it?* This visceral engagement makes the philosophical questions about time, reality, and choice deeply personal, moving beyond intellectual assent to empathetic understanding.

  **Using the Film in Class Effectively:**

  1.  **Explicitly Flag the Slides:** Start by acknowledging the film's brilliance in visualizing eternalism's core insight (non-linear time as reality) but also clearly point out its conflation of eternalism with determinism/fatalism and its presentation of foreknowledge as negating agency.
  2.  **Contrast Philosophical Nuance:** After watching key scenes (e.g., Louise's "I forgot how good it felt" line, her final monologue), present the philosophical counter-arguments:
      *   "Does seeing the future *cause* it to happen, or does Louise's knowledge simply reflect her future actions being part of the block?"
      *   "Can Louise *choose* to call Shang? When she makes that call, is she acting freely *at that moment*, even if the outcome is fixed?"
      *   "Is her decision to have Hannah evidence of *no choice* or a profound, conscious *choice* made with full awareness?"
  3.  **Leverage the Emotion:** Use Louise's choice to spark discussion on:
      *   "Does knowing suffering is inevitable make life meaningless or *more* meaningful?"
      *   "Is Louise free? In what sense? Does her choice feel like freedom to you?"
      *   "What does the film *add* to the eternalism debate that a dry philosophical argument might miss?"
  4.  **Separate Metaphysics from Epistemology:** Clarify that eternalism is about *what exists* (the block), while Louise's foreknowledge is about *what she can access*. One can be an eternalist without believing humans can access the future (most are!). The film uniquely explores what *might* happen if such access were possible.
  5.  **Focus on "What the Film Does Well":** Emphasize its unparalleled ability to make us *feel* what it might be like to experience time non-linearly and to confront the existential weight of knowing one's future suffering and joys.

  By acknowledging both its powerful dramatization of eternalism's core idea and its philosophical conflations, you can use *Arrival* as an incredibly rich and engaging tool. It won't provide a perfect philosophical argument, but it will make the abstract debate viscerally real and force students to grapple with its implications in a way no textbook can. Louise's final choice, in particular, is a masterstroke for prompting deep reflection on meaning, love, and agency within any theory of time.
