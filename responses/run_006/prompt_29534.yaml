  - Shadow of the future: This is fundamentally the discount factor γ. The translation holds perfectly - higher γ means agents value future retaliation/rewards more, enabling cooperation. The "iterated" aspect is handled by the episodic MDP setup.

  - Tit-for-Tat: Translates neatly to a deterministic policy with state = opponent's last move. The policy table is trivial: start cooperate, then mirror. Axelrod's tournaments resemble RL policy evaluation in multi-agent setting. The "surprising success" comes from robustness against common opponent policies.

  - Evolution of cooperation: Here's where friction appears. While we can frame evolutionary processes as population-based training with fitness=discounted return, there are key mismatches:
    1. Selection operates on entire policies (genomes) rather than updating policy parameters
    2. Mutation/crossover introduce randomness unlike gradient-based RL
    3. Fitness depends on current population - it's relative not absolute
