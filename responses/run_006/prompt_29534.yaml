  - The "self-interested agents" premise differs from RL's expected return maximization
  - Evolutionary timescales vs. agent lifetimes

  I should be honest about where the analogy breaks: Evolution optimizes for reproductive fitness (policy survival), not cumulative reward. The translation holds for mechanisms but not for fundamental objectives. Population-based RL can simulate similar dynamics but isn't identical.

