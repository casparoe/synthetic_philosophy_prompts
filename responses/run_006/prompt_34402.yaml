prompt: |-
  I run a small research team at a policy think tank, and we produce consensus forecasts — GDP growth, inflation, election probabilities, conflict risk, that kind of thing. Our rule is that when two analysts disagree on a number, they have to sit down and hash it out before we publish anything. The problem is we don't actually have a procedure for that conversation. It usually just ends with whoever argues louder or has more seniority, or they split the difference in a way that makes nobody happy and probably makes the number worse.

  I've been reading about Aumann's agreement theorem, and it seems like it should tell us something about how to structure these conversations — the idea that two rational people with the same priors and common knowledge of each other's beliefs can't agree to disagree. I want to turn that into an actual protocol my analysts can follow. Not the math, not the proof — a step-by-step procedure for the conversation itself.

  The constraints: it needs to be something two analysts can run in an hour or two without a facilitator. It should force them to surface the real source of the disagreement, not just trade conclusions. It should say what to do when they still disagree at the end — because that happens, and the theorem's assumptions sure aren't gonna hold perfectly in a conference room. And it should be honest about which steps are judgment calls dressed up as procedure.

  Write the procedure, with clear steps and decision points. Then walk it through two worked examples: one where two analysts disagree on a GDP growth forecast for next quarter, and one where they disagree on the probability that a specific piece of legislation passes. Flag the steps where the theorem's assumptions are clearly violated in practice and what you're supposed to do about it. Also tell me what the procedure *can't* handle — the kinds of disagreements where it'll just break.

  Oh, and write the answer in American English.
reasoning: |-
  Okay, the user runs a small research team at a policy think tank that produces consensus forecasts. Their current process for resolving disagreements between analysts—like on GDP growth or legislative probabilities—is flawed. It often boils down to whoever argues louder or has seniority, or an unsatisfying compromise that worsens the forecast. They've read about Aumann's agreement theorem and want a practical protocol based on it for structured conversations.

  First, I need to recall Aumann's theorem: it states that rational agents with common priors and common knowledge of each other's beliefs can't agree to disagree. They'll converge to the same probability estimate. But real-world scenarios violate these assumptions—analysts have different priors, hidden biases, and no true common knowledge. The challenge is translating this into a workable procedure that surfaces the root causes of disagreement.

  The user's constraints are clear: the procedure must be executable by two analysts in 1-2 hours without a facilitator. It should force them to articulate their reasoning, not just conclusions, and handle cases where disagreement persists. It also needs to honestly flag where judgment calls masquerade as procedure. Finally, they want worked examples (GDP growth and legislation probability) and limitations highlighted.

  Key elements to include in the protocol:
  - **Step-by-step structure**: Start with stating positions, then unpack reasoning step-by-step to identify cruxes, followed by information sharing/updating, and a convergence step.
  - **Crux identification**: Borrowing from CFAR/Julia Galef's "ideological Turing test" concept—force each analyst to articulate the other's view accurately. This addresses the "common knowledge" gap by making reasoning explicit.
  - **Handling violations**: Explicitly note where assumptions fail (e.g., differing priors, private info) and build in mitigations like documenting divergences.
  - **Persistence protocol**: Define what to do if disagreement remains (e.g., weighted average based on past accuracy, or escalation if unresolved).
  - **Honesty about judgment**: Call out steps where subjectivity is unavoidable (e.g., "What evidence would change your mind?" is inherently speculative).

  For the examples:
  - **GDP growth**: Analysts A and B disagree on next quarter's forecast (1.8% vs. 2.5%). The crux surfaces around consumer spending resilience. They share data sources (retail sales vs. credit card debt), update, but still diverge slightly—settling on a weighted compromise due to lingering prior differences.
  - **Legislation probability**: Analysts X and Y disagree on passage odds (30% vs. 70%). Crux is swing senator behavior. They realize priors about political pressure differ, and after sharing whip counts, converge to 45% but document the residual uncertainty.

  Limitations must be explicit: the protocol breaks with deeply held priors (e.g., ideological divides), ambiguous evidence, or when analysts can't articulate models. Also, it assumes good faith—power dynamics or ego clashes aren't addressed.

  Refining the protocol:
  - **Phases**: Position → Reasoning → Information → Update → Convergence → Documentation
  - **Time boxing**: Strict per step (e.g., 15 min for reasoning unpacking) to fit 1-2 hours
  - **Artifacts**: Mandatory shared notes to force clarity
  - **Violation handling**: Tags like "⚠️" for steps where assumptions fray, with fallbacks (e.g., "if priors differ, document and move to weighted compromise")

  This balances theoretical inspiration with pragmatism. The real value isn't perfect convergence but exposing buried assumptions—making disagreements productive even when they persist.
answer: |-
  Here's a practical, step-by-step protocol based on Aumann's insights, designed for your policy analysts. It forces them to expose *why* they disagree and provides off-ramps when pure rationality fails. It’s structured as a 90–120 minute facilitated conversation (they facilitate each other).

  **The Rational Consensus Protocol (RCP)**

  **Core Principle:** Disagreement stems from either (1) differing private information, or (2) differing interpretations of shared information (models/priors). The goal is to surface which one it is and resolve it.

  **Materials:** Shared document/whiteboard, timer, access to data sources.

  **Protocol Steps:**

  1.  **State Positions & Commit to Process (5 mins):**
      *   Analyst A states their forecast/number and confidence level (e.g., "GDP Growth Q3: 1.8%, 70% confident").
      *   Analyst B states their forecast/number and confidence level (e.g., "GDP Growth Q3: 2.5%, 60% confident").
      *   Both verbally commit to seeking consensus rationally, respecting the process, and documenting reasoning. *Judgment Call: Defining "confidence level" subjectively is unavoidable here.*

  2.  **Unpack Reasoning (30 mins):**
      *   **A Explains B's View (Crux Test):** Analyst A *must* articulate Analyst B's reasoning and key assumptions to B's satisfaction. ("B, I think you believe consumer spending will stay strong because of falling gas prices and resilient employment, outweighing the drag from higher interest rates. Is that right?")
      *   **B Explains A's View (Crux Test):** Analyst B *must* articulate Analyst A's reasoning and key assumptions to A's satisfaction. ("A, I think you see consumer spending weakening significantly due to depleted savings and rising credit card delinquencies, making interest rates the dominant factor. Did I get that?")
      *   **Identify the Crux:** Jointly identify the **1-3 key specific points** where their interpretations diverge most sharply (e.g., "Impact of recent credit card delinquency data on near-term consumer spending"). *⚠️ Violation: True "common priors" are rare. Analysts have different mental models. This step forces them to make these models partially explicit and shared, approximating common knowledge of beliefs.*
      *   *Judgment Call: Defining the "crux" is subjective and critical. If stuck, ask: "What single piece of evidence, if proven true, would make you switch to the other's number?"*

  3.  **Share Information & Sources (20 mins):**
      *   For each identified Crux Point:
          *   **A Shares:** The specific data, reports, anecdotes, or models informing *their* view on this point. Be concrete (e.g., "This Fed regional survey data on consumer sentiment, table 2, specifically the drop in 'big-ticket purchase' intentions").
          *   **B Shares:** The specific data, reports, anecdotes, or models informing *their* view on this point (e.g., "Actual retail sales figures from the Commerce Dept for the last two weeks, showing an unexpected uptick despite the sentiment drop").
          *   **Document:** List all shared sources/evidence visibly.
      *   *⚠️ Violation: "Private information" exists (e.g., an analyst's unique source, unshared intuition). This step forces its disclosure, moving towards common knowledge. If one lacks concrete evidence for a key belief, that weakness is exposed.*

  4.  **Update Beliefs (25 mins):**
      *   **Review Shared Info:** Jointly examine the *newly shared* information from Step 3. Is it credible? Does it conflict? Can it be verified quickly (e.g., pull up a specific report)?
      *   **Re-Evaluate:** Separately (2 mins silent thought), then jointly discuss:
          *   "Given this *specific* data point X shared by A/B, does it change your view on the Crux Point? Why/Why not?"
          *   "Is there any shared information here you previously overlooked or weighted differently?"
      *   **Revise if Warranted:** Does this new common knowledge shift either analyst's position or confidence? Document any shifts. *Judgment Call: Deciding *how* new information changes your view is inherently subjective Bayesian updating, even if informal.*

  5.  **Converge (10 mins):**
      *   **Re-state Positions:** A and B state their current forecast/number and confidence level.
      *   **If Consensus:** Agree on the number & document the key reasoning (especially the Crux resolution). Done!
      *   **If Narrowed Gap:** Discuss if a simple average or weighted average (based on stated confidence?) is now reasonable *given the shared reasoning*. Agree & document.
      *   **If Significant Disagreement Remains (The "Aumann Failure" Point):**
          *   **Pinpoint the Irreducible Disagreement:** Explicitly state *why* consensus failed: "We agree on the data, but disagree on how much weight to give consumer sentiment surveys vs. hard retail sales data," or "We disagree on the fundamental model linking interest rates to GDP this quarter." *⚠️ Violation: This is where differing priors/models are exposed as the root cause. True common priors don't exist.*
          *   **Default Action:** Calculate the **confidence-weighted average**: `(A_Number * A_Conf + B_Number * B_Conf) / (A_Conf + B_Conf)`. (e.g., (1.8 * 0.7 + 2.5 * 0.6) / (0.7 + 0.6) = 2.11%). Document this as the consensus number *and explicitly document the unresolved crux and the fact it's a weighted compromise*.
          *   *Judgment Call: The weighting mechanism (confidence, seniority, past accuracy) needs a team policy set beforehand.*

  6.  **Document & Reflect (5 mins):**
      *   Record the final number, key reasoning, sources, unresolved cruxes (if any), and the process used (e.g., "Consensus via confidence-weighted average after identifying data weighting disagreement").
      *   Briefly discuss: "What did we learn about our assumptions? What data should we watch to resolve future disagreements on this crux?"

  ---

  **Worked Example 1: GDP Growth Forecast (Next Quarter)**

  *   **Analyst A:** 1.8%, Conf 70%
  *   **Analyst B:** 2.5%, Conf 60%
  *   **Crux Test:** A explains B's view: "You think strong employment (citing latest jobs report) and falling energy prices (citing EIA forecast) will keep consumer spending resilient, outweighing the drag from the recent rate hike." B confirms. B explains A's view: "You think depleted savings (citing Fed household savings rate data) and rising delinquencies (citing NY Fed credit data) mean consumers will pull back sharply, making the rate hike bite harder." A confirms.
  *   **Crux Identified:** Impact of recent credit card delinquency data on **near-term consumer spending**.
  *   **Share Info:**
      *   **A:** Cites *specific* tables in NY Fed report showing delinquency spike in lower-income cohorts most sensitive to discretionary spending. Argues this is leading indicator.
      *   **B:** Cites *specific* week-over-week retail sales data (Commerce Dept) showing uptick *after* delinquency report, argues hard spending trumps sentiment/leading indicators. Notes delinquency rates are rising but from historic lows.
  *   **Update Beliefs:** Both examine the specific data points. A acknowledges the retail uptick is surprising but worries it's temporary/flawed data. B acknowledges the delinquency rise is real but argues the absolute level is still low and less impactful than jobs/gas. Neither fully convinces the other. A shifts to 1.9% (Conf 65%), B shifts to 2.3% (Conf 65%). Gap narrowed but persists.
  *   **Converge:** Significant disagreement remains on the **weight to give leading indicators (delinquencies) vs. coincident indicators (retail sales)**. This is an irreducible model/prior difference. ⚠️
  *   **Resolution:** Confidence-Weighted Average: `(1.9 * 0.65 + 2.3 * 0.65) / (0.65 + 0.65) = (1.235 + 1.495) / 1.3 = 2.1%`. Document as consensus: "2.1% - Based on strong jobs/energy prices vs. rising credit stress/rates. Weighted compromise due to unresolved debate on leading vs. coincident indicator reliability for near-term consumption. Sources: NY Fed Q2 Credit Report Tbl 5, Commerce Dept Advance Retail Sales 07/15-07/29, EIA Short-Term Energy Outlook Aug, BLS Employment Situation July."

  ---

  **Worked Example 2: Probability of Legislation Passing (Specific Bill)**

  *   **Analyst X:** 30%, Conf 75%
  *   **Analyst Y:** 70%, Conf 80%
  *   **Crux Test:** X explains Y's view: "You think the leadership compromise on Amendment 3 satisfied the key swing bloc (Senators A, B, C), and they'll vote yes now." Y confirms. Y explains X's view: "You think Senator C is still a hard 'No' despite the amendment, and without her, the swing bloc collapses, and leadership can't get 50 votes." X confirms.
  *   **Crux Identified:** True position and leverage of **Senator C**.
  *   **Share Info:**
      *   **X:** Cites a *specific* (non-public but credible) source close to Senator C's staff indicating deep ideological opposition to the bill's core mechanism, unchanged by Amendment 3. Cites C's past history of holding firm on similar issues.
      *   **Y:** Cites Senator C's *public statement* praising the "constructive changes" in Amendment 3 and her key donor group issuing a statement of support. Cites pressure from leadership offering a coveted committee spot.
  *   **Update Beliefs:** Both share their evidence. X argues the public statement is boilerplate, and their source is more reliable. Y argues the donor pressure and committee offer are decisive factors X is underestimating. X acknowledges the pressure but thinks C's ideology wins (shifts to 35%, Conf 70%). Y acknowledges the source but trusts the public pressure more (shifts to 60%, Conf 75%). Gap narrows but persists.
  *   **Converge:** Significant disagreement remains on **how Senator C weights ideological purity vs. political pressure/donor influence** (another prior/model difference). ⚠️
  *   **Resolution:** Confidence-Weighted Average: `(35 * 0.70 + 60 * 0.75) / (0.70 + 0.75) = (24.5 + 45) / 1.45 ≈ 48%` (Rounded to 45% for conservatism). Document as consensus: "45% Probability - Swing vote Senator C remains key hurdle. Compromise reflects differing assessments of whether political pressure/donor support (Y) outweighs deep ideological opposition (X) post-Amendment 3. Sources: Public statement by Sen C (08/XX), [Donor Group] Press Release (08/YY), Analyst X source assessment (confidential). Weighted compromise."

  ---

  **What This Protocol CAN'T Handle (Where It Breaks):**

  1.  **Fundamental Value/Prior Conflicts:** If analysts disagree not on data but on core values or deeply held, unchangeable worldviews (e.g., "Free markets *always* self-correct" vs. "Active regulation is *always* needed"), the protocol exposes this but cannot resolve it. The weighted average becomes a purely political compromise, not a rational consensus.
  2.  **Extreme Asymmetry in Information/Skill:** If one analyst possesses vastly superior knowledge, access, or analytical skill and cannot effectively convey/share it within the time/process constraints, the protocol may legitimize an inferior view through compromise.
  3.  **Bad Faith Actors:** If an analyst is deliberately obstructive, hides information, or refuses to genuinely engage in the Crux Test or belief updating, the process fails. It relies on good-faith effort to expose reasoning.
  4.  **Ambiguous or Novel Evidence:** When the data is extremely noisy, contradictory, or about a genuinely unprecedented situation, the "Update Beliefs" step becomes highly subjective. The irreducible disagreement might be large.
  5.  **Complex Interdependencies:** Disagreements involving many interconnected variables (e.g., forecasting outcomes of a multi-player geopolitical conflict) might produce too many "cruxes" to resolve cleanly in 2 hours. The protocol simplifies by forcing focus on 1-3 key points, potentially oversimplifying.
  6.  **Emotional/Identity-Based Disagreements:** If the disagreement is tied to an analyst's ego, identity, or team politics, the rational structure might be ignored or subverted. The protocol doesn't address these dynamics.

  **Key Takeaway for Your Team:** This protocol won't magically create perfect agreement (Aumann's assumptions are too ideal). Its power is in **forcing the disagreement out of the realm of conclusions and into the realm of specific assumptions and evidence**. Even when consensus fails, you *know why* and have documented it, making the final number more transparent and defensible. The weighted average fallback is a pragmatic solution acknowledging real-world limitations, but it's crucial to document *why* it was needed. Use this process consistently, and over time, your team will develop better shared priors and models.
