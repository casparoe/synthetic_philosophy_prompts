prompt: |-
  I'm a software engineer at a mid-size company and I end up running the postmortem for most of our production incidents — maybe two or three a month. One thing that keeps coming up is whether the incident was caused by something we didn't do: a check we didn't write, a runbook step that got skipped, an alert threshold we never set, a test that was never added. We write these up as causes or contributing factors, and the wording drives what gets fixed and sometimes who gets blamed; in a couple cases our customer contracts have SLA credits tied to the root-cause wording, so its not just an internal label. I have no philosophy background, but a friend of mine does and he says there's a whole literature on causation by omission — whether absences can be causes at all, whether the right test is counterfactual ('would the incident still have happened if we'd done the thing?'), and whether the answer secretly depends on what we expected somebody to do. He says our postmortem fights are basically that debate with a Jira ticket attached.

  What I want is a reusable decision procedure my team can actually run on an incident report — a checklist or flowchart in words — for deciding when an omission should be listed as a cause of an incident. It has to be something an ordinary engineer can run in maybe 20 minutes during a postmortem, without me in the room to explain the theory. It should say what questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says 'not a cause' or 'contributing factor', and where it has to hand the decision to a person because it's a values call rather than a factual one. Please ground it in whatever the philosophy of causation actually knows about omissions, but translated into language we can use: keep the distinctions that survive the translation, and tell me which ones you dropped and why. Then run the procedure on three anonymized cases from our backlog: (1) a database outage where nobody had set a max-connection limit and a runaway query exhausted the pool; (2) an incident where the on-call engineer skipped a step in the runbook that would have caught a bad config before deploy, but the step had been wrong or misleading for months and everyone who had run it recently had skipped it too; (3) an incident where two independent safeguards were both missing — a validation check and an alert — and either one alone probably would have prevented the customer-facing error. I especially want to see a case where the procedure gives an answer my team won't like, and I want you to be honest about what the procedure cannot do — where it's really a management or blame question dressed up as a causal one.
reasoning: |-
  We are creating a decision procedure for determining when an omission (something we didn't do) should be listed as a cause or contributing factor in a postmortem. The procedure must be practical, taking about 20 minutes, and usable by an engineer without a philosophy background. We'll base it on philosophical insights about causation by omission, especially counterfactual reasoning and normative expectations.

  Key philosophical insights:
  1. **Counterfactual Test**: An omission is a cause if, had the action been performed, the incident would not have occurred (or would have been less severe). This is the core test.
  2. **Normative Expectations**: We often consider omissions as causes only if there was a duty or expectation to perform the action. However, the counterfactual test is primary; the normative part helps in deciding which omissions are worth noting in a blame context.
  3. **Overdetermination**: In cases where multiple omissions occurred and any one would have prevented the incident, we may list all as contributing factors, but note that they are individually sufficient.

  We'll design a flowchart-like procedure with steps and questions. The procedure will have three outcomes:
  - **Cause**: The omission is a direct cause (or root cause) of the incident.
  - **Contributing Factor**: The omission played a role but may not be the primary cause, or there are multiple factors.
  - **Not a Cause**: The omission did not cause the incident (it would have happened anyway, or the counterfactual test fails).

  We'll also note when the decision is a values call (e.g., about what we should have expected) and must be escalated.

  Procedure:

  **Step 1: Define the omission clearly.**
     - What specific action was not taken? (e.g., "Did not set max-connection limit", "Did not run step X of the runbook", "Did not implement validation check Y")
     - If multiple omissions, treat each separately at first.

  **Step 2: Apply the counterfactual test.**
     - Ask: "If we had done the omitted action, would the incident have been prevented (or substantially mitigated)?" 
     - Evidence: Use known facts about the incident and the system. If necessary, reconstruct what would have happened.
     - If yes → Proceed to Step 3.
     - If no → Outcome: **Not a Cause** (stop for this omission).
     - If unsure → Note the uncertainty and proceed to Step 3, but flag that the causal link is weak.

  **Step 3: Check for preemption or overdetermination.**
     - Ask: "Were there other omissions or actions that, even if this omission had been addressed, would have led to the incident anyway?" 
     - If yes (i.e., this omission was preempted by another failure) → Then this omission is **Not a Cause** (because the incident would have happened regardless of this omission).
     - If there were multiple omissions and each alone would have prevented the incident → Then each is a **Contributing Factor** (and note they are individually sufficient).
     - Otherwise → Proceed to Step 4.

  **Step 4: Check for normative expectations (the values call).**
     - Ask: "Was there a reasonable expectation that we should have performed this action?" 
     - Consider: 
        - Was it part of a documented process? 
        - Was it a standard industry practice? 
        - Was it a known gap that we had identified? 
        - Was it the responsibility of a specific person/team? 
     - If yes → Outcome: **Cause** (or **Contributing Factor** if there are multiple primary causes).
     - If no → Then we have a judgment call: 
          - Outcome: **Contributing Factor** (if we believe we should have done it, but there was no established expectation) OR **Not a Cause** (if we decide it was beyond reasonable expectation). 
          - Flag: This step requires team consensus or management input because it depends on what we think "should" have been done.

  **Step 5: Assign severity level (optional for the procedure, but note for postmortem context).**
     - Even if an omission is a cause or contributing factor, the team may want to note the severity of its impact.

  **Summary of Outcomes:**
  - **Cause**: The omission passes the counterfactual test (Step 2) and there was a reasonable expectation to perform the action (Step 4). Also, it wasn't preempted (Step 3).
  - **Contributing Factor**: 
      a) It passes the counterfactual test but the expectation is unclear (Step 4 values call) OR 
      b) It passes the counterfactual test but there are multiple causes (Step 3 overdetermination) OR 
      c) It partially mitigates the incident (e.g., would have reduced severity, but not prevented).
  - **Not a Cause**: 
      a) Counterfactual test fails (Step 2) OR 
      b) The omission was preempted (Step 3) OR 
      c) There was no reasonable expectation (Step 4, and the team decides not to count it).

  **What the procedure cannot do:**
  - Assign blame to individuals: That requires a separate process considering intent, knowledge, and organizational context.
  - Resolve deep philosophical disputes: It uses counterfactuals as the primary tool and normative expectations as a secondary filter, but sometimes the team must decide what is "reasonable".
  - Handle cases with extreme uncertainty: If we can't determine the counterfactual, we must rely on probabilities (which we avoid for simplicity) or mark it as uncertain.

  Now, let's run the three cases:

  **Case 1: Database outage due to no max-connection limit (runaway query)**
  - Step 1: Omission: Did not set a max-connection limit.
  - Step 2: Counterfactual: If we had set a max-connection limit, the runaway query would have been blocked from exhausting the pool and the outage avoided? **Yes**.
  - Step 3: Preemption? No other omissions or actions would have caused the outage anyway in this scenario. So, proceed.
  - Step 4: Normative expectation? Setting connection limits is a standard practice for databases. **Yes**, there is a reasonable expectation.
  - Outcome: **Cause**.

  **Case 2: Skipped runbook step that was faulty**
  - Step 1: Omission: The on-call engineer skipped step X in the runbook.
  - Step 2: Counterfactual: If the step had been run, would it have caught the bad config? The step was faulty and had been skipped by others because it was wrong. So, even if run, it would not have caught the config error. **No** (because the step was broken, so running it wouldn't have helped). 
  - Outcome: **Not a Cause** (for the omission of skipping the step). 
  - But note: The broken runbook step is a cause (it's a presence of a defect, not an omission). We are only evaluating the omission of skipping the step. The root cause is the broken runbook.

  **Case 3: Missing validation and alert (either one would have prevented the incident)**
  - We have two omissions: (A) missing validation check, (B) missing alert.
  - Evaluate each separately:

    **Omission A: Missing validation check**
    - Step 1: Did not implement a validation check.
    - Step 2: Counterfactual: If the validation check had been in place, it would have caught the error and prevented the incident? **Yes**.
    - Step 3: Preemption? There was another omission (the missing alert) that also would have prevented the incident, but that doesn't preempt this one. In fact, either one alone would have prevented it (overdetermination). So, we note that and proceed.
    - Step 4: Normative expectation? Having validation checks for critical configs is standard. **Yes**.
    - Outcome: **Contributing Factor** (because there are two independent factors; note that in overdetermination, both are causes but we might list as contributing factors to indicate they are part of a set).

    **Omission B: Missing alert**
    - Step 1: Did not set up an alert for this condition.
    - Step 2: Counterfactual: If the alert had been in place, the on-call would have been paged and could have intervened before the customer impact? **Yes**.
    - Step 3: Preemption? Again, the missing validation check would have prevented it, but that doesn't change that the alert would have too. Overdetermination.
    - Step 4: Normative expectation? We should have alerts for critical systems? **Yes**.
    - Outcome: **Contributing Factor**.

    Overall, the incident had two contributing factors (either one would have prevented it).

  **Case where the team might not like the answer:**
  Consider a variation of Case 2: Suppose the runbook step was not faulty, but the on-call engineer skipped it. However, the step was very obscure and not covered in training. Also, the step had been skipped by the last 5 engineers without incident because the condition it checked was rare.

  - Step 1: Omission: Skipped step X.
  - Step 2: Counterfactual: If run, it would have caught the bad config? **Yes** (assume the step was valid).
  - Step 3: Preemption? None.
  - Step 4: Normative expectation? The step was in the runbook, but it was obscure and not trained on. Also, it had been skipped without consequence. We might argue that the expectation to run it was low. This becomes a values call. 
     - If the team says: "We should have run it because it's in the runbook" → **Cause** (and the engineer might be blamed). 
     - If the team says: "The runbook was too long and the step was not critical in the past, so it's understandable it was skipped" → **Contributing Factor** (and the root cause is the runbook design) or even **Not a Cause** if we decide it wasn't reasonable to expect it.

  The team might not like labeling the engineer's omission as a cause because it assigns blame. But the procedure forces us to consider: was it reasonable? This is where we note that the procedure is about causation, not blame. For blame, we need a separate discussion about why the step was skipped (training? runbook too complex?) and if it's a systemic issue.

  **What the procedure cannot do:**
  - It cannot avoid the values call in Step 4. The team must decide what is "reasonable". This might require management input or a policy change.
  - It cannot assign blame. The outcome is about the causal role of the omission in the incident, not about who is at fault. Blame requires considering intent, negligence, and organizational factors.

  **Final Procedure in Checklist Form:**

  1. **Define the omission**: Write down exactly what action was not taken.
  2. **Counterfactual test**: 
     - Would the incident have been prevented (or significantly mitigated) if the action had been taken?
     - Yes → Go to 3.
     - No → **Not a Cause** (stop).
     - Unsure → Flag as uncertain and go to 3.
  3. **Preemption/Overdetermination**:
     - Would the incident have happened anyway due to another cause, even if this action had been taken?
       - Yes → **Not a Cause** (stop).
       - No → Go to 4.
     - If there are multiple omissions and any one would have prevented the incident, then each is a **Contributing Factor** (but still go to 4 to confirm).
  4. **Normative expectation**:
     - Was there a reasonable expectation that we should have taken this action?
     - Consider: documented? standard? known gap? assigned responsibility?
     - Yes → **Cause** (or **Contributing Factor** if there are multiple causes or if overdetermination).
     - No → This is a values call: 
          - Team consensus: if we think we should have, then **Contributing Factor**; else **Not a Cause**.
          - If uncertain, escalate to management.

  Note: For multiple omissions, run the procedure for each. For complex incidents, you might break into multiple causes and contributing factors.

  This procedure should fit within 20 minutes per omission. It forces the team to think about the causal link and then the reasonableness separately, which should reduce ambiguity.
answer: |-
  Below is a practical, philosophy-grounded decision procedure for your team to evaluate omissions as causes/contributing factors in postmortems. It’s designed as a **repeatable checklist** (not a flowchart, for simplicity) that an engineer can run in **<20 minutes** without philosophy expertise. I’ll first explain the procedure, then apply it to your three cases, and end with limitations.

  ---

  ### **Decision Procedure: "Is This Omission a Cause?"**
  **Philosophy Foundation**: Based on *counterfactual theories of causation* (e.g., David Lewis) and *normative expectations* (e.g., legal/moral duties). Key principles:  
  - An omission is causal only if the incident **would not have occurred** had the action been taken (counterfactual dependence).  
  - "Duty" matters for blame, but **not for causation**—philosophy separates "cause" from "responsibility."  
  - I drop nuanced debates (e.g., "negative events" vs. "absences") because they don’t change practical outcomes in engineering contexts.  
  - **Outputs**: `Cause`, `Contributing Factor`, `Not a Cause`, or `Escalate` (for values calls).

  ---

  #### **The Checklist**  
  Run these questions **in order** for each omission. Stop when you hit an answer.

  1. **CLARITY**: Can you define the omission in one sentence?  
     - *Bad*: "We didn’t test enough."  
     - *Good*: "We didn’t add a test for concurrent DB writes."  
     - ✅ If unclear, redefine it. If impossible, stop → **Not a Cause** (vague omissions aren’t actionable).

  2. **COUNTERFACTUAL TEST**: Would the incident **likely have been prevented** (or *significantly mitigated*) if the action had been taken?  
     - Use evidence (logs, timelines, system knowledge).  
     - → **Yes** → Go to Q3.  
     - → **No** → Stop → **Not a Cause**.  
     - → **Uncertain** → Flag as **Contributing Factor** (erring on caution) and stop.  
     - *Philosophy note: This is the core—it filters out irrelevant omissions.*

  3. **NECESSITY TEST**: Was the omitted action **practically required** to prevent *this type* of incident?  
     - Examples: Security checks for auth systems, load testing for critical APIs.  
     - → **Yes** (e.g., industry best practice, past incidents) → Go to Q4.  
     - → **No** (e.g., nice-to-have, no prior reason to expect risk) → Stop → **Contributing Factor** (it helped, but wasn’t essential).  
     - *Philosophy note: Addresses "duty" minimally—avoids blame but acknowledges expectations.*

  4. **OVERSIGHT TEST**: Was the omission due to a **breakdown in our system** (e.g., flawed process, missing SOP) vs. individual error?  
     - → **Systemic** (e.g., no checklist, outdated runbooks) → **Cause**.  
     - → **Individual** (e.g., engineer skipped a known-valid step) → **Cause**.  
     - → **Unclear** → Escalate to lead/manager (blame-risk decision).  
     - *Philosophy note: Isolates "systemic vs. human" for accountability, but treats both as causal.*

  5. **OVERDETERMINATION TEST** (if multiple omissions): Would **any one action** alone have prevented the incident?  
     - → **Yes** (e.g., either a validation check OR an alert would have worked) → Label all as **Contributing Factors**.  
     - → **No** (e.g., both a test *and* a config change were needed) → Label all as **Causes**.  

  ---

  ### **Key Features for Your Team**
  - **Speed**: Takes 5–15 min per omission (prioritize based on incident severity).  
  - **No Philosophy Jargon**: Uses engineering terms (e.g., "prevented" vs. "counterfactual dependence").  
  - **Values Calls**: Only Q4 (Oversight Test) might require escalation—flags "blame" decisions early.  
  - **Outputs Align with SLAs**:  
    - `Cause` → Directly ties to root cause (SLA credits likely).  
    - `Contributing Factor` → Partial fault (internal fixes, rarely SLA-triggering).  
    - `Not a Cause` → No follow-up needed.  

  ---

  ### **Applied to Your Cases**
  #### **Case 1: Database outage (no max-connection limit)**  
  - **Omission**: "Didn’t set max-connection limit."  
    1. **Clarity**: ✅ Specific.  
    2. **Counterfactual**: Would setting the limit have prevented the outage? **Yes** (runaway query would be blocked).  
    3. **Necessity**: **Yes** (DB connection limits are industry-standard for production DBs).  
    4. **Oversight**: **Systemic** (limit wasn’t in deployment scripts).  
    5. **Overdetermination**: N/A (single omission).  
    → **Verdict**: **Cause** (direct, systemic root cause).  

  #### **Case 2: Skipped runbook step (step was faulty)**  
  - **Omission**: "On-call engineer skipped runbook step."  
    1. **Clarity**: ✅ Specific.  
    2. **Counterfactual**: Would running the step have prevented the incident? **No** (step was broken → it wouldn’t have caught the bad config).  
    → **Verdict**: **Not a Cause** (counterfactual test failed).  
    - *Philosophy note: The **real cause** is the broken runbook (a "presence," not omission). Fix that instead.*  

  #### **Case 3: Missing validation and alert (either would have prevented the error)**  
  - **Omission A**: "No input validation check."  
    1. **Clarity**: ✅  
    2. **Counterfactual**: **Yes** (would have blocked malformed input).  
    3. **Necessity**: **Yes** (validation is standard for customer-facing APIs).  
    4. **Oversight**: **Systemic** (feature shipped without validation).  
    5. **Overdetermination**: Either check OR alert would have sufficed → **Contributing Factor**.  

  - **Omission B**: "No alert for input errors."  
    1. **Clarity**: ✅  
    2. **Counterfactual**: **Yes** (would have triggered manual rollback).  
    3. **Necessity**: **Yes** (alerts are required for critical user flows).  
    4. **Oversight**: **Systemic** (alert never implemented).  
    5. **Overdetermination**: Either check OR alert would have sufficed → **Contributing Factor**.  
    → **Verdict**: Both are **Contributing Factors** (overdetermined; neither is sole cause).  

  ---

  ### **A Case Your Team Won’t Like**  
  **Scenario**: A junior engineer deploys a script without peer review (omission). The script corrupts data. Peer review is encouraged but not enforced.  
  - **Checklist**:  
    1. **Clarity**: ✅ "No peer review."  
    2. **Counterfactual**: **Yes** (review would have caught the bug).  
    3. **Necessity**: **No** (not strictly required—only a "best practice").  
    → **Verdict**: **Contributing Factor** (not a root cause).  
  - **Why you’ll hate it**:  
    - The engineer feels blamed, but the checklist says it’s not a "cause" due to lax policies.  
    - **Reality**: This is a **management/process gap** (no enforcement of reviews). The procedure exposes that the omission isn’t the root issue—the lack of policy is. Fix: Mandate reviews.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Assign Blame**:  
     - Q4 (Oversight Test) identifies systemic vs. individual omissions, but **blame requires human judgment** (e.g., "Was the engineer trained?"). This must be decoupled from causation.  
  2. **Resolve Values Conflicts**:  
     - If Q3 (Necessity Test) is contentious (e.g., "Is this test 'necessary'?"), it becomes a **product/procedural debate**, not a causal one. Escalate to managers.  
  3. **Handle Uncertainty**:  
     - If counterfactuals are speculative (e.g., "Would this alert *really* have helped?"), the procedure defaults to **Contributing Factor**. This is conservative but can over-flag.  
  4. **Replace Human Context**:  
     - Philosophy treats causation as objective, but **SLA/business impacts aren’t**. Example: If finance insists an omission is a "cause" for contractual reasons, override the procedure—this is a business rule, not causation.  

  ---

  ### **Final Advice**  
  - **Train Your Team**: Run a workshop with past incidents to calibrate the checklist.  
  - **Document Rationale**: For each omission, record 1–2 sentences for answers (e.g., "Counterfactual: Yes—max connections would block runaway query").  
  - **Integrate with Postmortems**: Add a "Omission Analysis" section in your incident template.  
  - **Philosophy/Engineering Bridge**: The checklist distills causation into two pillars: **counterfactuals** (objective) and **necessity** (normative). Everything else is either noise or blame.  

  This balances philosophy’s rigor with engineering pragmatism. If SLA credits hinge on wording, add a final step: "If the verdict conflicts with contractual needs, escalate." That’s not causation—it’s business.
