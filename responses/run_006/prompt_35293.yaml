  For example, in moral disagreements, are people really well-informed? Maybe not, because moral knowledge might require more than factual information; it might require wisdom or something.

  But premise (3) says "rational, well-informed, apparently unbiased," so it assumes they are.

  "Apparently" might mean that they seem so, but might not be.

  But in the epistemic case, for disagreements about justification, the philosophers involved are experts and seem rational.

  Still, they disagree.

  I think the core issue is premise (2).

  Let me look for what others might say.

