  I'm dealing with this metaethics argument against moral realism and its parallel that threatens epistemic realism. The key issue is that if the argument works against moral realism, it should also work against epistemic realism, but that would undermine the argument itself because it relies on epistemic facts. So, I need to figure out where the argument goes wrong.

  First, let's outline the argument against moral realism:

  1. If moral realism is true, there are mind-independent moral facts.

  2. If there are mind-independent facts about a domain, then rational inquirers who are well-informed and free of bias should eventually converge in their judgments about that domain.

  3. There is widespread, persistent moral disagreement among rational, well-informed, apparently unbiased people.

  4. The best explanation for this disagreement is that there are no mind-independent moral facts; instead, moral judgments express attitudes, etc.

  5. Therefore, moral realism is probably false.

  The parallel for epistemic realism would be:

  1. If epistemic realism is true, there are mind-independent epistemic facts.

  2. Same as above: convergence should happen.

  3. There is widespread, persistent epistemic disagreement (e.g., about justification, inference, logic).

  4. The best explanation is no mind-independent epistemic facts.

  5. Therefore, epistemic realism is probably false.

  But if epistemic realism is false, then the concepts used in the original argument—like "best explanation," "probably false," and what we "ought" to infer—are not grounded in mind-independent facts. That means the argument is self-defeating because it depends on those epistemic norms to be objectively true.

  So, to avoid this, I need to reject one of the premises. Let's go through them.

  Premise (1) seems fine for both moral and epistemic realism; it's definitional. Moral realism does claim mind-independent moral facts, and epistemic realism claims mind-independent epistemic facts.

  Premise (2) is about convergence. It says that if there are objective facts, rational inquirers should converge on them. But is this true? In science, for example, we do see convergence on many things, but there are also persistent disagreements in some areas, like interpretations of quantum mechanics. But generally, science is seen as converging towards truth.

  However, for moral and epistemic domains, convergence might not happen for other reasons. Premise (2) might be the weak point.

  Premise (3) is observational: there is disagreement. For morality, we see debates on abortion, justice, etc. For epistemology, there are internalism vs. externalism, debates on abductive inference, logical pluralism, etc. So (3) seems true for both domains.

  Premise (4) says that the best explanation for persistent disagreement is that there are no objective facts. But is this necessarily the best explanation? There could be other reasons for disagreement even if facts exist.

  For example, the domain might be complex, or people might have different evidence, or biases that are hard to detect. In science, disagreements persist when evidence is incomplete or theories are underdetermined.

  So, for morality, even if there are objective facts, moral issues might be so complex or involve deeply held values that convergence is difficult. Similarly for epistemology, concepts like justification might be multifaceted.

  Therefore, persistent disagreement doesn't necessarily imply no objective facts; it might just mean that the facts are hard to access or that rationality doesn't guarantee convergence in a reasonable time frame.

  If I reject premise (2), that would solve the problem. Premise (2) claims that if there are mind-independent facts, rational inquirers should converge. But perhaps this is too strong. Convergence might not be guaranteed for various reasons.

  What would rejecting (2) cost? It would mean that the moral realist doesn't have to explain why convergence hasn't happened; they can say that disagreement is consistent with realism because of complexity, human limitations, etc.

  But that might seem ad hoc. Critics could argue that in domains with clear facts, like mathematics or empirical science, convergence does happen, so why not in morality?

  Mathematics has disagreements too, like in foundations, but usually resolved. Empirical science has paradigm shifts, but convergence over time.

  Still, morality might be different. Moral facts might not be empirically accessible, so convergence is harder.

  Similarly for epistemology, which is normative and not directly empirical.

  So, rejecting (2) might be plausible.

  I could reject premise (4). Premise (4) says the best explanation of disagreement is no objective facts. But there might be better explanations.

  For example, in moral disagreement, it could be due to differing non-moral beliefs, incomplete information, or emotional influences that aren't biases per se but affect judgment.

  The moral realist could say that people are not truly rational or well-informed in moral matters, but premise (3) stipulates that they are rational and well-informed.

  Premise (3) says "rational, well-informed, apparently unbiased," but "apparently" might be key. They might have hidden biases or not be fully informed.

  But the argument assumes that in the cases of disagreement, the people involved are as described.

  Perhaps for some disagreements, one side is wrong, but we don't know which, so it persists.

  But that doesn't explain persistence.

  The best explanation might not be anti-realism; it could be that the domain allows for reasonable pluralism or something.

  But realism typically implies a single truth.

  Another idea: epistemic facts might be necessary for reasoning, so they can't be denied without contradiction, unlike moral facts.

  In the self-defeat part, when epistemic realism is challenged, it undermines the argument.

  So, perhaps for epistemic facts, we have to accept them to engage in reasoning at all, so they are inescapable.

  Moral facts might not be the same.

  But that might not directly help with the argument.

  Let's think about where to reject the premise.

  I think premise (2) is the most vulnerable.

  Premise (2) is a claim about what should happen if there are objective facts.

  But it might be false for normative domains.

  For example, even if there is an objective fact about morality, different rational agents might weigh values differently or interpret principles in different ways, leading to disagreement.

  Similarly for epistemology.

  In contrast, for descriptive facts, like physics, evidence forces convergence.

  But normative facts might not have the same kind of evidence.

  So, the realist can reject (2) for normative domains.

  What does that cost? It means the realist must explain why convergence doesn't happen, which might involve acknowledging that rational disagreement is possible even with objective facts.

  For morality, this could be by adopting a pluralistic realism or something.

  But moral realism often assumes convergence in ideal conditions, but the disagreement shows that conditions aren't ideal or something.

