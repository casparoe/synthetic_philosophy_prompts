  Moral realism doesn't have this status.

  So, the argument against moral realism can proceed because it uses epistemic norms, which are secure.

  Whereas the parallel argument against epistemic realism self-destructs because it tries to use epistemic norms to deny them.

  That seems like a way out.

  Then, for moral realism, the disagreement might still support anti-realism.

  But in premise (4) for morality, it says the best explanation is no facts, but with epistemic facts intact, that might hold.

  But let's see.

  In this view, we reject the application of the argument to epistemology because it's self-defeating, but for morality, it's not.

  So, we accept all premises for morality, but for epistemology, we say that premise (4) is not the best explanation because denying epistemic facts undermines reasoning.

  Therefore, for epistemology, persistent disagreement must have another explanation, such as the difficulty of the subject or human limitations.

  Similarly, for morality, if we want to defend realism, we might say the same, but the argument is that for morality, we don't have the same imperative to preserve realism.

  The problem is to identify where the argument goes wrong, and for the moral anti-realist, they might say it goes wrong only for epistemology, not for morality.

  But the seminar argument is against moral realism, so to defend that, we need to show why the parallel doesn't work.

  Perhaps the premise to reject is (2) for both, but that weakens the argument.

  I think the best bet is to reject premise (4) for the epistemic case, but not for the moral case.

