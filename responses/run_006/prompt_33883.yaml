answer: |-
  ### Metaethical Positions via the Frege-Geach Problem: A Decision Tree

  **Start Here:**  
  1. **Do moral sentences (e.g., "Stealing is wrong") function like factual descriptions (e.g., "Snow is white") in logical reasoning (e.g., modus ponens)?**  
     - *No, they work differently* → Go to 2.  
     - *Yes, they work the same way* → Go to 7.  

  2. **Can expressivism (the view that moral sentences express attitudes, not beliefs) solve the Frege-Geach problem without assigning truth-conditions to moral sentences?**  
     - *Yes* → Go to 3.  
     - *No* → Go to 6.  

  3. **Do moral sentences express a single type of mental state (e.g., approval, plans)?**  
     - *Yes* → Go to 4.  
     - *No, they express two distinct states (e.g., a belief + an attitude)* → **Position: Hybrid expressivism** (e.g., Ridge, Copp).  

  4. **Is the solution based on showing that attitudes have their own "logic" (e.g., consistency rules for plans or commitments)?**  
     - *Yes* → Go to 5.  
     - *No, it relies on simpler psychological mechanisms (e.g., attitudes about attitudes)* → **Position: Traditional non-cognitivism** (e.g., Ayer, Stevenson).  

  5. **What is the core mental state expressed by moral sentences?**  
     - *Attitudes (e.g., approval, disapproval)* → **Position: Blackburn-style quasi-realism**.  
     - *Plans or norms (e.g., what to do in various situations)* → **Position: Gibbard-style norm-expressivism**.  

  6. **Can expressivism solve the problem by accepting truth-conditions for moral sentences?**  
     - *Yes, but without positing objective moral facts* → **Position: Blackburn-style quasi-realism** (also reached via 5).  
     - *No, expressivism is fundamentally flawed* → Go to 7.  

  7. **Do moral sentences express beliefs that can be true or false?**  
     - *Yes* → Go to 8.  
     - *No* → **Position: Error theory** (e.g., Mackie).  

  8. **Are some moral sentences actually true?**  
     - *Yes* → **Position: Realist cognitivism** (e.g., Brink, Shafer-Landau).  
     - *No* → **Position: Error theory** (also reached via 7).  

  **Leaves Summary:**  
  1. **Traditional non-cognitivism** (Ayer, Stevenson)  
  2. **Blackburn-style quasi-realism**  
  3. **Gibbard-style norm-expressivism**  
  4. **Hybrid expressivism** (Ridge, Copp)  
  5. **Realist cognitivism**  
  6. **Error theory**  
  7. **The Frege-Geach problem is a pseudoproblem** (e.g., some contextualists or Wittgensteinian views)  

  ---

  ### Commentary on the Tree Structure  
  **Why this structure?**  
  The tree prioritizes *diagnostic questions* about how the Frege-Geach problem (FGP) is solved, not pre-defined labels. Questions probe core commitments:  
  - **Q1** separates views that treat moral/logical syntax as uniform (cognitivist-leaning) from those that don’t (expressivist-leaning).  
  - **Q2** isolates expressivist solutions that avoid truth-conditions (e.g., attitude-logic) from those that adopt them (quasi-realism) or abandon expressivism.  
  - **Q3–Q5** distinguish expressivist subtypes by mental state (single vs. hybrid) and solution strategy (attitude-logic vs. plan-logic).  
  - **Q6–Q8** handle cognitivist responses: realism vs. error theory.  

  **Key Design Choices:**  
  - **Pseudoproblem leaf**: Added for views rejecting the FGP’s presuppositions (e.g., that logic requires truth-conditions). It appears only at Q1 ("No") to avoid redundancy.  
  - **Blackburn appears twice (Q5/Q6)**: Quasi-realism accepts deflationary truth-conditions *while remaining expressivist*. The tree captures this by allowing multiple paths (consistent with Blackburn’s own defense).  
  - **Gibbard separated from Blackburn**: Though both use "logic of attitudes," Gibbard’s focus on *plans* (Q5) vs. Blackburn’s on *attitudes* creates a clean split students can grasp without jargon.  
  - **Hybrid expressivism**: Requires a dedicated branch (Q3) since it posits beliefs *and* attitudes, unlike other expressivists.  
  - **Error theory**: Reached if expressivism fails *and* moral beliefs are false (Q7–Q8).  

  **Unoccupied/Problematic Branches:**  
  - **Empty branch**: "No" at Q4 (attitudes without logic or truth-conditions) leads only to traditional non-cognitivism. No contemporary position holds this, as it fails to solve the FGP.  
  - **Unseparated positions**: Quasi-realism and norm-expressivism share answers until Q5 (nature of mental state). This reflects actual similarities—both posit attitude-logic—while differentiating via their core non-cognitive state.  
  - **Edge case**: "No" at Q6 leads to error theory/cognitivism. No expressivist occupies this, as endorsing truth-conditions while rejecting expressivism is incoherent.  

  **Why 8 leaves?**  
  The tree captures all requested positions, avoids artificial splits, and stays within the 8–12 range. It maps the logical space while naming only defended views:  
  - Traditional non-cognitivism, quasi-realism, and norm-expressivism cover "classic" expressivism.  
  - Hybrid expressivism, realism, and error theory represent major alternatives.  
  - The pseudoproblem leaf accommodates dissenting views (e.g., some forms of relativism).  

  **For Students:** Answer based on your intuitions about moral logic/psychology—not labels. The tree reveals your implicit commitments.
