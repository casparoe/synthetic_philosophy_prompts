prompt: |-
  I'm in an grad epistemology seminar and we've been going around in circles about testimony for weeks. The two camps are, roughly, reductionists (testimonial justification reduces to perception, memory, and induction: you're only justified in believing what someone says if you have empirical reason to think their reliable, or that testimony in general is reliable) and anti-reductionists (testimony is a basic source of justification, on a par with perception and memory, so you're prima facie justified in believing what you're told unless you get a defeater). I want you to write the document that a committed reductionist and a committed anti-reductionist could both sign after a genuine adversarial collaboration, not the usual "we agree to disagree" thing.

  Please make it: (1) a numbered list of substantive claims both sides accept — about what testimony is, what exactly needs explaining, how defeaters work, what the empirical data on children's selective trust does and doesn't show, and the analogy or disanalogy with memory; (2) a disagreements table where each row gives a precise question, the reductionist answer phrased so a reductionist would say "yes, that's exactly my view, not a strawman," and the anti-reductionist answer phrased the same way for their side; (3) a list of cruxes — the sub-questions such that if they were settled, at least one side would have to move — and for each crux, a concrete case, argument, or piece of evidence both sides agree would bear on it, plus what each side predicts about it in advance. If part of the dispute looks merely verbal to you, say which part and why. Don't give a bibliography or citations; just work through the positions. And try to keep it in the weeds: I care about the difference between justification for a single piece of testimony and justification for the standing practice of trusting testimony, whether the monitoring of speakers for signs of unreliability is itself something you need testimony to learn, and whether the infant/child cases actually favor one side over the other.
