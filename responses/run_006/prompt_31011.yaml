  Okay, the user is in a grad epistemology seminar stuck on the testimony debate between reductionists and anti-reductionists. They want a collaborative document both sides could sign, not just agreeing to disagree. Let me unpack their request.

  First, they need a numbered list of shared claims. Both sides agree testimony is an intentional act involving an asserter and a hearer, and justification depends on context. They both recognize defeaters—like signs of unreliability—can undermine justification. The child development data shows selective trust, but neither side thinks it directly resolves the core debate. Memory is a point of agreement too; both see it as preservative, unlike testimony which is generative.

  Next, the disagreements table. The key is phrasing so each side feels represented. For instance, reductionists see testimony as derivative, needing inductive support. Anti-reductionists treat it as fundamental. The monitoring question is crucial: whether you need prior testimony to learn how to monitor speakers. Reductionists say no, it's learned through perception and induction. Anti-reductionists argue yes, some monitoring norms come from testimony itself.

  The cruxes section needs concrete cases that could sway one side. The "novel monitoring norm" scenario is vital. If subjects can learn when to trust without testimony, it supports reductionism. If they can't, anti-reductionism gains ground. The "isolated community" case tests if testimonial practices require inductive grounding. The "infant credulity" point matters too—does early trust stem from innate faculties or learned heuristics?

  The user cares about nuances like single-instance vs. standing-practice justification. Reductionists tie single-instance justification to background knowledge, while anti-reductionists see it as default. Monitoring norms are central—whether they're learned testimonially or independently. Child studies show selective trust, but both sides interpret it through their lenses; reductionists see learned heuristics, anti-reductionists see calibrated innate trust.

  The verbal dispute might be over "fundamental source." Anti-reductionists mean testimony provides new justification without inference, while reductionists see it as mediated. Clarifying terms could help, but the core disagreements remain substantive. The seminar's deadlock might hinge on these cruxes, so focusing on testable predictions could move the discussion forward.
answer: |-
  ### Joint Statement on Testimonial Justification: Points of Convergence and Divergence  
  *(Authored collaboratively by committed reductionist and anti-reductionist representatives)*  

  #### (1) Substantive Points of Agreement  
  1. **Nature of Testimony**: Testimony is a social act wherein an asserter (S) intentionally conveys information to a hearer (H), typically through assertion. H’s belief based on S’s testimony is the target of justification.  
  2. **Justificatory Target**: The primary explanandum is the *justification H possesses for believing that p* when H forms the belief solely because S testified that p. We distinguish this from:  
     - *Justification for the general practice* of trusting testimony (a standing disposition),  
     - *Justification for a single instance* of trust (an occurrent belief).  
  3. **Defeaters Operate Similarly**: Both sides accept that "defeaters" (evidence that S is unreliable, insincere, or that p is improbable) can *override* prima facie justification. Defeaters may be rebutting (directly against p) or undercutting (against S’s trustworthiness).  
  4. **Child Development Data**:  
     - Children display *selective trust* (e.g., trusting consistent/accurate speakers over inconsistent ones by age 3–4).  
     - This selectivity is *empirically established* but does *not* decisively prove either position:  
       - It shows sensitivity to reliability cues, but not whether this sensitivity is *epistemically prior* to testimonial justification (reductionist) or a *calibration* of a default entitlement (anti-reductionist).  
  5. **Memory Disanalogy**: Memory is *preservative*; it cannot generate justification for new content. Testimony is *generative*; it can supply justification for content H had no prior access to. This disanalogy is central and non-verbal.  

  #### (2) Disagreements Table  
  | **Precise Question** | **Reductionist Answer** | **Anti-Reductionist Answer** |  
  |----------------------|-------------------------|------------------------------|  
  | **Is testimonial justification *sui generis*, irreducible to other sources?** | No: Justification for believing p via testimony *wholly reduces* to H’s non-testimonial reasons (perception, memory, induction) supporting S’s reliability or testimony’s general reliability. | Yes: Testimony is a *basic source* of justification. H is prima facie justified in believing p *solely* in virtue of comprehending S’s testimony, absent defeaters. |  
  | **Must H possess *positive inductive evidence* for S’s reliability (or testimony’s general reliability) to be justified in a single instance?** | Yes: Justification requires H to have (even if tacit) empirical reasons for trusting *this* testimony (e.g., past success with S/testimony, cues of competence). | No: Justification is *immediate* and requires no prior positive evidence. Defeaters can *remove* justification, but their absence is not a precondition. |  
  | **Is the ability to monitor speakers for reliability cues *learned independently of testimony*?** | Yes: Monitoring heuristics (e.g., detecting nervousness, inconsistency) are acquired via perception, induction, and non-testimonial social observation. | No: Some monitoring norms *depend on testimony* (e.g., learning *which* cues indicate unreliability requires being told, or trusting testimonial explanations). |  
  | **Does an infant’s initial trust in testimony rely on an innate, epistemically basic capacity?** | No: Early trust is a practical heuristic (shaped by evolution/learning), but *epistemic justification* emerges only when inductive evidence supports it. | Yes: Infant "credulity" reflects an innate, prima facie *epistemic entitlement* analogous to perceptual justification. |  

  #### (3) Cruxes: Key Decisive Questions  
  1. **Crux: Can H be justified in trusting testimony *without any background inductive evidence*?**  
     - **Case**: H is raised in isolation until adulthood, then encounters S asserting p (a mundane claim, e.g., "it rained yesterday"). H has *no prior exposure* to testimony, reliability cues, or inductive evidence about asserters.  
     - **Reductionist Prediction**: H is *unjustified* in believing p. No testimonial justification can arise without inductive basing.  
     - **Anti-Reductionist Prediction**: H *is* prima facie justified—understanding assertion triggers default entitlement.  
     - **Why Crucial**: Anti-reductionists *must* affirm justification here; reductionists *must* deny it.  

  2. **Crux: Is monitoring for reliability *testimonially dependent*?**  
     - **Case**: H learns a *novel* reliability cue (e.g., "speakers avoiding eye contact in this culture are truthful"). Must this cue be acquired non-testimonially to confer justification?  
     - **Reductionist Prediction**: Justification requires H to have *non-testimonial* grounds for accepting the cue (e.g., personal observation). If learned via testimony alone, it’s circular.  
     - **Anti-Reductionist Prediction**: Testimony can *itself* validate monitoring norms (e.g., "I trust you that eye contact signals deceit here").  
     - **Why Crucial**: Reductionists collapse monitoring into induction/perception; anti-reductionists allow testimony to bootstrap its own norms.  

  3. **Crux: Does infant selective trust reflect *epistemic* justification or mere *pragmatic* reliance?**  
     - **Case**: A 3-year-old trusts a previously accurate speaker over a previously inaccurate one. Does this trust exhibit *justification* (even if defeasible)?  
     - **Reductionist Prediction**: No—it’s a pre-epistemic heuristic. Justification emerges later when the child inductively confirms testimony’s reliability.  
     - **Anti-Reductionist Prediction**: Yes—selectivity calibrates an *innate entitlement*; the child is genuinely justified.  
     - **Why Crucial**: Anti-reductionists need early trust to be epistemic; reductionists treat it as proto-justificatory.  

  #### Verbal Dispute Diagnosis  
  - **"Basic Source" Terminology**: Partly verbal. Both agree testimony *delivers* justification. The dispute is whether it *generates new justification non-inferentially* (anti-reductionist) or *transmits justification inferentially* via background induction (reductionist).  
  - **"Reduction" Scope**: Reductionists mean *justification-constitutive reduction*; anti-reductionists deny testimonial justification *necessarily depends* on other sources. This is substantive, not verbal.  

  ---  
  This document isolates core commitments and cruxes. Reductionists anchor testimony in broader inductive practices; anti-reductionists treat it as an autonomous epistemic gateway. Resolving the cruxes requires empirical work (e.g., on testimonial learning in isolation) and conceptual analysis (e.g., whether monitoring can be non-circularly testimonial). Neither side can retreat to "agree to disagree" on these points without abandoning core tenets.
