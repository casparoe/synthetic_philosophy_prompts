  Okay, the user is asking for a rigorous set of desiderata to evaluate theories about AI alignment tax and competitiveness constraints. They want this framework to be practical for labs, funders, and regulators assessing whether safety investments can survive market competition. 

  Hmm, this is a sophisticated request - the user clearly understands the nuances of AI governance debates. They're frustrated with superficial proposals and want concrete evaluation criteria. Their examples suggest deep familiarity with alignment discourse (e.g., mentioning capability dividends and coordination failures). 

  First, I need to define non-negotiable requirements that any credible theory must satisfy. The core is explaining both voluntary adoption and dangerous corner-cutting. A theory that can't explain why some firms invest in safety while others undercut them is useless for policymakers. The firm-destroying vs diffuse harm distinction is equally vital - it determines whether markets self-correct.

  Then come the contested but essential cases. The user flagged tricky scenarios like alignment methods that hurt benchmarks but not real-world performance, or ones that actually improve capabilities. Any theory dismissing these as impossible would fail in practice. I should also include cases where safety costs are fixed vs variable - that affects competitive dynamics.

  For distinctions, the biggest pitfall is conflating measurable performance drops with true alignment tax. Many "taxes" might vanish with better evaluation. And we must separate competitiveness pressure (you'll lose market share) from coordination problems (everyone would benefit if we all cooperated).

  The third category covers structural factors: industry concentration, benefit externalization, and transition costs. These aren't universal but any realistic model must account for them. A theory that only works for monopolies or only for startups is inadequate.

  Now the hardest trade-off: explaining both voluntary safety spending and catastrophic races. Most theories lean too far one way. The requirement doing most exclusion is probably "must explain selective underinvestment" - it rules out both naive "markets fix everything" views and deterministic doom narratives.

  When scoring existing frameworks: The race-to-the-bottom story fails on voluntary adoption cases. The "immature methods" view can't explain why some taxes persist. Coordination theories struggle with selective underinvestment in concentrated markets. All three oversimplify the performance-evaluation distinction.

  My confidence is lowest about how sharply industry concentration affects outcomes. Real markets have complex power laws between monopolies and perfect competition. But for policymaking, we might need to bucket them.

  The user's hidden need seems to be cutting through ideological debates. They want criteria to neutrally evaluate proposals - hence emphasizing "not camp preferences." I'll keep scoring impartial while acknowledging where camps disagree.
answer: |-
  Here is the specification of desiderata for an adequate account of the alignment tax and competitiveness constraint, judged against the purpose of guiding lab/funder/regulator decisions on safety spending viability:

  **Non-Negotiable Requirements (Must Explain):**
  1.  **Voluntary Adoption Despite Cost:** *Requirement:* Explain why firms *ever* adopt safety measures imposing a significant, persistent alignment tax (e.g., slower deployment, higher compute costs, constrained capabilities) absent regulation. *Consideration:* Historical examples exist (e.g., some cybersecurity, aviation safety), and denying this possibility eliminates regulatory rationale prematurely. *Excludes:* Accounts assuming firms *never* voluntarily pay significant safety costs.
  2.  **Dangerous Corner-Cutting:** *Requirement:* Explain why firms might *underinvest* in safety relative to catastrophic risk reduction, even when aware of risks, due to competitive pressure. *Consideration:* The core problem: competition can drive unsafe behavior even if individual firms are risk-averse. *Excludes:* Accounts where perfect competition always optimizes safety or firms fully internalize catastrophic risks.
  3.  **Firm-Destroying vs. Diffuse Failures:** *Requirement:* Distinguish failures that primarily destroy the deploying firm (e.g., major product flaw) from failures causing diffuse, delayed, or externalized harm (e.g., subtle misalignment enabling misuse, slow ecosystem degradation). *Consideration:* Competitiveness pressure is weaker for firm-destroying failures; regulators care most about catastrophic externalities. *Excludes:* Accounts treating all safety failures identically in competitive impact.
  4.  **Measured Tax vs. Evaluation Gap:** *Requirement:* Distinguish a true alignment tax (safety inherently costs capability *even under perfect evaluation*) from a performance difference stemming solely from inadequate evaluation (e.g., safety improves robustness not captured by benchmarks). *Consideration:* Guides R&D: fix evaluation vs. accept inherent trade-offs. *Excludes:* Accounts conflating benchmark drops with fundamental trade-offs.
  5.  **Competitive Pressure vs. Coordination Failure:** *Requirement:* Distinguish pressure to cut costs *within* a competitive equilibrium (competitiveness constraint) from failures to reach a *better* equilibrium via coordination (e.g., everyone wants safety but fears being undercut). *Consideration:* Solutions differ: regulation vs. treaties/institutions. *Excludes:* Accounts treating all underinvestment as purely coordination or purely myopic competition.

  **Contested but Essential Cases (Must Accommodate):**
  6.  **Net-Capability-Negative Tax:** *Requirement:* Accommodate safety methods that demonstrably reduce measured capabilities/speed on relevant benchmarks/tasks. *Consideration:* Some plausible safety techniques (e.g., extensive adversarial training, strong interpretability overhead) likely incur this cost. *Camp:* Pessimists emphasize this; optimists downplay it.
  7.  **Net-Capability-Neutral/Positive Alignment:** *Requirement:* Accommodate safety methods that improve robustness, reliability, or instruction-following with no net loss (or even gain) in measured capabilities. *Consideration:* Some techniques (e.g., better RLHF, verified scaffolding) may fit this; improves commercial viability. *Camp:* Optimists emphasize this as the norm; pessimists see it as limited.
  8.  **Fixed vs. Variable Costs:** *Requirement:* Handle safety costs that are largely fixed overhead (e.g., research, safety team salaries) versus variable costs per model/deployment (e.g., inference-time monitoring). *Consideration:* Competitive pressure differs; fixed costs are easier to absorb by large players. *Camp:* Often underappreciated in simple models.
  9.  **One-Time Transition Costs:** *Requirement:* Account for high initial safety costs that decrease significantly as tooling/standards mature. *Consideration:* Affects long-term viability and regulatory timing. *Camp:* Optimists emphasize reducibility; pessimists worry persistent taxes remain.
  10. **Industry Structure Variation:** *Requirement:* Generate different predictions/outcomes in unipolar (dominant leader), oligopolistic (few large players), and fragmented many-entrant markets. *Consideration:* Competitive dynamics and capacity to absorb costs differ radically. *Camp:* Coordination theorists emphasize oligopoly potential.
  11. **Benefit Capture & Tail Risk Externalization:** *Requirement:* Accommodate actors who capture most of the benefits (profit, market share) from racing/underinvesting in safety while successfully externalizing the catastrophic tail risks onto society. *Consideration:* Core driver of misaligned incentives; defines the externality problem. *Camp:* Pessimists see this as inherent; others see mitigations.

  **Key Tension & Most Excluding Requirement:**
  *   **Tension:** Explaining both **Voluntary Adoption (1)** and **Dangerous Corner-Cutting (2)**, especially concerning catastrophic externalities (**11**), is the hardest balance. Theories often lean too far one way.
  *   **Most Excluding Requirement:** **Dangerous Corner-Cutting (2)** combined with **Tail Risk Externalization (11)** does the most to exclude naive optimistic accounts. A theory *must* explain why catastrophic underinvestment is a plausible outcome despite potential benefits of safety.

  **Scorecard of Existing Views:**
  *   **Naive Race-to-the-Bottom:**
      *   *Fails:* Voluntary Adoption (1), Capability-Neutral/Positive Alignment (7), Fixed Costs (8 - ignores scaling), Transition Costs (9), often Industry Structure (10). Overemphasizes (2,6,11). Collapses Tax vs. Eval Gap (4).
      *   *Verdict:* Too simplistic; ignores mitigating factors and variation.
  *   **"Tax is Immature Methods":**
      *   *Fails:* Net-Capability-Negative Tax (6 - assumes it away), Dangerous Corner-Cutting (2 - assumes vanishing tax eliminates pressure), Tail Risk Externalization (11 - assumes safety becomes cheap/free). Struggles with Diffuse vs Firm-Destroying (3) if diffuse risks require costly mitigation.
      *   *Verdict:* Overly optimistic; underestimates persistent trade-offs and competitive dynamics even if tax reduces.
  *   **Coordination-Failure Framing:**
      *   *Fails:* Often struggles with **Selective Underinvestment (2)** in oligopolistic/unipolar settings (10) – why wouldn't a dominant firm internalize more? Can downplay true Competitive Pressure (distinction from 5). May not adequately address Evaluation Gap (4).
      *   *Verdict:* Strong on (1, 3, 5, 11), but risks underestimating pure competitive pressure in less concentrated/dynamic phases; solution-centric can obscure diagnosis.

  **Confidence:**
  *   High confidence in the necessity of Non-Negotiable requirements (1-5) and Essential Cases (6-11) as test cases.
  *   High confidence in the identified Tension and that Requirement 2 (Dangerous Corner-Cutting) is the major filter.
  *   Moderate confidence in the scorecard assessments; nuances exist within camps.
  *   **Least Confidence:** In precisely how sharply **Industry Structure (10)** determines outcomes between the poles of safe monopoly and catastrophic fragmentation. Real-world markets are messy and path-dependent. Is oligopoly *sufficiently* more stable than fragmentation, or are the incentives still perverse? This point feels most contingent on specific, hard-to-model dynamics.
