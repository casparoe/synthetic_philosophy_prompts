answer: |-
  This is a profound and deeply painful moral dilemma you're grappling with. Your feelings of guilt and the sense of moral equivalence aren't irrational; they touch on a core philosophical debate about "moral luck" – the idea that factors beyond our control (like chance) can dramatically affect the moral judgment of actions that started from the same intentional choice.

  Here's a breakdown of the key moral dimensions:

  1.  **The Core Moral Wrong:** At the moment of decision, when both you and your brother chose to drive drunk, you committed the **exact same moral failing.** You both knowingly engaged in an act of extreme recklessness that disregarded the fundamental safety and inherent value of other human lives. The potential for catastrophic harm was identical in both choices. Morally speaking, the person you *might* have killed existed in the realm of possibility the moment you turned the key.
  2.  **The Role of Luck (Moral Luck):** The tragic outcome for your brother was indeed a matter of horrifyingly bad luck – a pedestrian was present on his route in the dark at that precise moment. Your lack of a tragic outcome was correspondingly good luck. This is the "coin flip" you describe. From a pure *intentional* standpoint, your moral culpability for the *choice* itself is identical to your brother's.
  3.  **Why Outcomes *Feel* (and Legally *Are*) Different:**
      *   **Harm and Responsibility:** Morality isn't *only* about intentions; it also concerns the real-world consequences of our actions and our responsibility for them. Your brother didn't just risk a life; he *ended* one. He bears the direct responsibility for causing irreparable, concrete harm – the loss of a specific person, the grief inflicted on their loved ones. This creates a profound moral burden that you do not carry.
      *   **Restitution and Accountability:** Because he caused actual harm, society (and morality) demands a different level of accountability and potential restitution from him. His suffering (legal, familial, marital, psychological) is partly a consequence *of* the harm he caused, not just punishment for the initial choice. Your lack of harm means you don't have this specific debt to society or the victim's family.
      *   **Family & Social Reaction:** Your family's horror and difficulty looking at him stems directly from the concrete, devastating *outcome* he caused. Their anger and grief are directed at the *destruction* he wrought, not solely the reckless choice he shared with you. This reaction, while intensely painful for him, is understandable as a human response to catastrophic loss.
  4.  **Your Guilt:** Your "strange, gnawing guilt" is **understandable and arguably morally appropriate.** It stems from the honest recognition:
      *   You are morally culpable for the same reckless, dangerous choice.
      *   You escaped the life-shattering consequences purely through luck.
      *   You see the devastating result of that choice embodied in your brother's life, forcing you to confront what *could* have been your reality.
      *   This isn't survivor's guilt in the traditional sense, but a profound form of **moral recognition guilt**. It's the discomfort of knowing you deserve significant blame but avoided the tangible consequences that make that blame externally visible and enforced.

  **Does he deserve *more* moral blame?**

  *   **For the *decision* to drive drunk? No.** Your moral failing in making that choice is equivalent.
  *   **For the *consequences* of that decision? Yes.** He carries the immense moral burden of having actually caused a death through his recklessness. This burden is a form of moral weight beyond the initial blame for the choice.

  **Are the actions morally equivalent?**

  *   **The *choices* made (driving drunk) are morally equivalent.** The core wrong was identical at the moment of decision.
  *   **The *actions* as completed events (one resulting in death, one not) are not morally equivalent.** The completed action includes the consequence, altering its total moral gravity.

  **Are you overthinking?** No. You're grappling with a fundamental and difficult truth about morality, responsibility, and luck. It's *not* straightforward.

  **Summary:** While the *reckless choice* you both made carries equal moral blameworthiness, the *actual death* your brother caused creates a unique and overwhelming moral burden of responsibility and consequence that you, through sheer luck, do not bear.

  **Final One-Sentence View:** **You share identical moral blame for the reckless decision to drive drunk, but your brother bears the crushing additional moral burden of having caused the specific, tragic death that resulted from it.**
