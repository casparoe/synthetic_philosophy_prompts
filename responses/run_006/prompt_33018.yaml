  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  **Node 2:**  
  **Q2:** Now consider a **bit-perfect copy of a music recording** (e.g., a digital replica of a Beatles track). Is its aesthetic value identical to the original, assuming equal playback quality?  
