     3. Historicism about artworks: The artwork's value is tied to its specific history of production (e.g., when, by whom, and under what conditions it was made).
     4. Deception or moral view: The problem with forgeries is primarily the deception involved and the violation of trust.
     5. Institutional-contextualism: The value is determined by the institutional and cultural context in which the artwork is embedded (e.g., its place in art history, the narrative of the artist's development).
     6. Allographic dissolve: The distinction between original and copy doesn't apply to certain arts (like music or literature) because they are not about a particular physical instance but about a structure that can be multiply instantiated.
