  ### Epistemic Regress Decision Tree  
  This tree helps you navigate from pre-theoretic judgments about justification to named positions in the regress debate. Answer each question based on your intuitive judgments about cases (e.g., "Is my belief that 'I have hands' justified without inferring it from other beliefs?"). Positions are **bolded**, and awkward commitments are *italicized*.  

  ---

  #### **Node 1: Must a subject be able to access (by reflection alone) the reasons justifying their belief?**  
  *(This distinguishes internalism from externalism. Internalism demands reflective access; externalism denies it.)*  
  - **NO** → **Externalism (e.g., Reliabilism)**  
    - *Awkward commitment: A belief produced by a reliable process (e.g., reliable clairvoyance) is justified even if the subject has no reflective access to its reliability and every reason to doubt it.*  
  - **YES** → Proceed to Node 2.  

  #### **Node 2: Must every justified belief be supported by other justified beliefs?**  
  *(This is the "inferentialist assumption" launching the regress. Foundationalists reject it; others accept it.)*  
  - **NO** → Proceed to Node 3.  
  - **YES** → Proceed to Node 4.  

  #### **Node 3: Are non-inferentially justified beliefs limited to those about your own current mental states (e.g., "I am in pain" or "I seem to see red")?**  
  *(Distinguishes classical and moderate foundationalism. Answer based on whether perceptual beliefs like "There is a table" can be non-inferentially justified.)*  
  - **YES** → **Classical Foundationalism**  
    - *Awkward commitment: Justified beliefs about the external world (e.g., "Tables exist") are impossible unless inferred from mental-state beliefs—but no such inference is rationally defensible.*  
  - **NO** → **Moderate Foundationalism**  
    - *Awkward commitment: Fallible perceptual beliefs (e.g., "I see a cat") are "rock bottom" justified without support from other beliefs—even though they could be hallucinations.*  

  #### **Node 4: Can a chain of supporting beliefs extend infinitely without circularity?**  
  *(Infinitism says yes; others say no.)*  
  - **YES** → **Infinitism**  
    - *Awkward commitment: For any belief (e.g., "2+2=4") to be justified, you must possess an infinite series of distinct supporting reasons—a task humans cannot complete.*  
  - **NO** → Proceed to Node 5.  

  #### **Node 5: Is circular justification (e.g., Belief A supports B, which supports A) acceptable?**  
  *(Coherentism says yes; skeptics say no.)*  
  - **YES** → **Coherentism**  
    - *Awkward commitment: A self-consistent fairy-tale worldview could be justified even if entirely disconnected from reality.*  
  - **NO** → **Skepticism (Regress-Based)**  
    - *Awkward commitment: No non-trivial belief (e.g., "The sun will rise tomorrow") can ever be justified—including this one.*  

  ---

  ### Unoccupied Logical Possibilities & Resistance  
  - **Unoccupied Views**:  
    1. **Externalist Skepticism** (Justification requires external factors, but none obtain): Logically possible but *unattractive*—externalists adopt their view to avoid skepticism.  
    2. **Internalist Externalism** (Justification requires both reflective access and external factors): *Incoherent*—internalism and externalism are mutually exclusive.  
    3. **Inferentialist Non-Skeptic** (Accepts Nodes 2/4/5 with "YES/NO/NO"): *Incoherent*—rejecting infinitism, circularity, and foundationalism leaves no escape from skepticism.  

  - **Resists Clean Separation**:  
    - **Externalism** vs. **Moderate Foundationalism**: Some externalists are moderate foundationalists (e.g., reliabilist foundationalism). The tree separates them by the *access requirement* (Node 1), but real-world positions often blend. Externalism is a distinct leaf because it rejects the internalist framework driving the regress.  

  ---

  ### Most Theoretically Contestable Branch Point  
  **Node 2 (Inferentialism vs. Non-Inferentialism)** is the deepest cut. Restructuring it would reshape the entire tree.  

  - **Why Contestable?** This node forces a choice: Can justification exist without inferential support? Foundationalists argue that without "basic" beliefs, the regress dooms all justification. Inferentialists (coherentists/infinitists) counter that unsupported "basic" beliefs are arbitrary.  
  - **What Could Change the Tree?** A compelling account of **non-inferential perceptual justification** (e.g., "How can 'I see water' be justified without inference?") might collapse inferentialism into moderate foundationalism. Conversely, a decisive argument that *all* justification requires inference (e.g., Sellars' "myth of the given") might eliminate foundationalism, making Node 3 obsolete and expanding infinitism/coherentism.  

  ---

  ### How to Use This Tree  
  1. Start at **Node 1** and answer based on cases (e.g., "Can a reliable but inaccessible cognitive process justify a belief?").  
  2. Move through branches without reading ahead to positions.  
  3. At your leaf, read the awkward commitment—if it feels intolerable, backtrack and test alternatives!
