prompt: |-
  I've been trying to get clear on what I think about confirmation and old evidence, and I'm hoping you can help me extract a principle from my case judgments. I've read the Bayesian literature on and off for years — Glymour, Earman, Howson and Urbach, the back-and-forth in the journals — but I keep finding that my intuitive verdicts pull in different directions, and I'd like to know whether there's a single coherent account behind them or whether I need to abandon something.

  Here are the cases and my verdicts.

  **1. Mercury and General Relativity.** The anomalous advance of Mercury's perihelion was known for over half a century before Einstein proposed GR. GR wasn't constructed to explain it — the theory was motivated by considerations about equivalence and general covariance — but it entailed the anomaly precisely, with no free parameters left to tune. I judge that the perihelion data strongly confirms GR. If anything, the fact that the data was sitting there unexplained for decades makes the confirmation feel stronger, not weaker. This seems like a clear case of old evidence confirming a theory.

  **2. The Ptolemaic Epicycles.** An ancient astronomer notices that Mars sometimes appears to move backward against the fixed stars. He constructs a geocentric model with epicycles specifically designed to reproduce this retrograde motion, adjusting the radii and periods until the fit is good. I judge that the retrograde motion data does not confirm his model in any interesting sense. The model was built to fit the data, so the fit can't count in its favor — or if it does, the confirmation is negligible. The data isn't doing any work beyond what went into the model's construction.

  **3. The Novel Prediction.** A cosmologist proposes an inflationary theory that predicts a specific value for the scalar spectral index, one that differs from the then-standard Harrison–Zel'dovich value of exactly one. The prediction is precise and surprising. A few years later, the Planck satellite measures the spectral index and finds it within the predicted range. I judge that this strongly confirms the theory. This is the textbook case of novel prediction, and I have no hesitation about it.

  **4. The Forgotten Measurement.** A physicist proposes a theory that makes a surprising prediction about the anomalous magnetic moment of the muon. Unbeknownst to her, a lab measured this quantity five years earlier and published the result in a journal she doesn't read. The measurement matches her prediction. The broader community knows about the measurement, but she doesn't. I find myself wanting to say that the measurement confirms her theory — it would be bizarre to deny that — but that it confirms it less than if the measurement had been made after her prediction. The timing of her knowledge seems like it should matter, but I'm not sure why or how much.

  **5. The Unappreciated Evidence.** In the decades before Darwin, naturalists had documented that species on islands resemble species on the nearest mainland in systematic ways, that similar climates on different continents host dissimilar species, and that fossils in a given region often resemble the living species found there. Darwin's theory of evolution by natural selection wasn't constructed specifically to explain these biogeographic patterns — he drew on many lines of evidence — but the theory explains them beautifully. I judge that the biogeographic data confirms the theory, and fairly strongly, even though the data was collected before the theory was proposed. This feels structurally like the Mercury case, but I'm less confident about the strength of confirmation here.

  **6. The Ad Hoc Rescue.** A theory predicts a new particle at a specific mass. A collider search finds nothing at that mass, with enough sensitivity that the particle should have been seen. The theorist then adds an auxiliary hypothesis — a new symmetry that hides the particle from detection at that energy but makes it visible at a higher one, conveniently just beyond current reach. I judge that the original theory has been disconfirmed by the null result, and the patched version starts from a lower credence than the original theory had before the null result. The null result doesn't confirm the patched theory; the patched theory merely survives. But I'm not sure how to formalize the difference between "surviving" and "being confirmed by" old evidence.

  **7. Two Theories, Same Old Evidence.** Two competing theories T₁ and T₂ both entail some old evidence E. T₁ was developed with full knowledge of E and was shaped by it — the theorist worked backward from E to ensure the theory accommodated it. T₂ was developed independently to solve a different problem, and only later was it noticed that T₂ also entails E. I judge that E confirms T₂ more than it confirms T₁, even though both entail E and E was known all along. But I worry I'm importing considerations about how the theories were constructed — the context of discovery — that shouldn't matter to confirmation itself, which is supposed to be a logical relation between theory and evidence.

  What I'm after is a principle — or a small set of candidate principles — that captures as many of these verdicts as possible. I want the principle stated precisely enough that I can apply it to new cases. In particular, I'd like to know:

  - Is there a version of Bayesian confirmation theory that handles all of these, or do I need to go beyond Bayesianism?
  - Which of my verdicts, if any, does the best principle force me to abandon?
  - What does the principle say about a case I haven't settled: a theory that was constructed to explain old evidence E₁, but also entails old evidence E₂ which the theorist didn't know about and which played no role in the theory's construction? Does E₂ confirm the theory, and if so, how much compared to a novel prediction?

  Please give the answer in American English.
reasoning: |-
  Okay, let me try to unpack this user's deep dive into confirmation theory. They've clearly wrestled with Bayesian epistemology for years, presenting seven nuanced cases where their intuitive judgments clash with standard treatments. I need to find a unifying thread.

  First, examining their cases: Mercury's perihelion feels strongly confirmatory because GR wasn't tuned for it, while Ptolemy's epicycles get no credit because they were reverse-engineered. Novel predictions confirm strongly, but forgotten measurements seem weaker. The Darwin case mirrors Mercury but with less confidence - interesting how historical distance affects their intuition. Ad hoc rescues merely survive rather than get confirmed, and independently entailed evidence confirms more than theory-laden evidence. 

  The core tension emerges: they want confirmation strength to depend on whether evidence was used in theory-building, but worry this violates Bayesianism's separation of discovery/justification. Their forgotten measurement case is particularly telling - they sense the theorist's ignorance should matter, which pure Bayesianism ignores.

  I recall Garber's approach solves the logical problem of old evidence but not the psychological one they're grappling with. Their cases suggest they're intuitively tracking the counterfactual: "would the theory have been different without this evidence?" That explains why Mercury confirms (Einstein wouldn't change GR without it) but epicycles don't (the model would collapse without retrograde data).

  For their unresolved case: E₂ should confirm strongly because it wasn't involved in construction - like a surprise retroactive prediction. The strength approaches novel confirmation since the theorist was ignorant of E₂ during development. 

  The unifying principle seems to be epistemic independence: how freely the evidence could have disconfirmed the theory given its construction path. This preserves most intuitions except perhaps demanding they accept that confirmation isn't purely logical - it's sensitive to historical contingency. Bayesianism can handle this via judicious prior assignments reflecting development paths, though it gets messy. 

  Their deepest need appears to be reconciling logical rigor with historical sensitivity. I'll propose the counterfactual resilience principle as their intuitive lodestar, while being honest about its Bayesian compatibility issues.
answer: |-
  Based on your case judgments, a coherent principle emerges that captures most of your intuitions: **Confirmation strength depends on the degree to which the evidence provides *independent leverage* on the theory, meaning it wasn't used to construct or adjust the theory *and* its fit wasn't guaranteed by the theory's development process.**

  Here's how it applies to your cases and answers your questions:

  1.  **The Principle Stated:**  
      *Evidence E confirms theory T more strongly when:*
      *   *E was not used in T's construction or adjustment (non-adjustment).*
      *   *T's ability to fit E wasn't made probable by the process used to develop T (epistemic independence).*
      *Confirmation is strongest when E is novel and surprising (maximizing independence). Strength diminishes proportionally to the degree E was relied upon or its fit was made likely during T's development.*

  2.  **Application to Your Cases:**
      *   **Mercury & GR (Strong Confirm):** GR wasn't adjusted for Mercury's data; the fit was an unexpected consequence. High independence → Strong confirmation.
      *   **Ptolemaic Epicycles (No/Negligible Confirm):** Model explicitly built *to fit* the retrograde data. Zero independence → No genuine confirmation.
      *   **Novel Prediction (Strong Confirm):** Prediction made before evidence exists. Maximal independence → Strongest confirmation.
      *   **Forgotten Measurement (Moderate Confirm):** Theorist didn't use the data, so non-adjustment holds. *However*, the broader community knew the result; the *potential* for the fit to be coincidental or accommodated later exists, slightly reducing the surprise/leverage compared to a true prediction. Moderate independence → Moderate confirmation.
      *   **Unappreciated Evidence (Strong Confirm):** Like Mercury. Darwin didn't build his theory *specifically* for biogeography; it was an explanatory consequence. High independence → Strong confirmation. (Your slightly lower confidence might stem from Darwin *knowing* this evidence, unlike Einstein/Mercury, increasing the *possibility* it subtly influenced him, though you judge it didn't dominate construction).
      *   **Ad Hoc Rescue (No Confirm/Survival):** The patched theory was *explicitly constructed* to fit the null result. Zero independence → No confirmation. The null result actively disconfirmed the original theory.
      *   **Two Theories, Same Evidence (T₂ > T₁):** T₂ entails E independently of its construction process. T₁ was constructed *to fit* E, guaranteeing the fit. E provides independent leverage for T₂ but not for T₁. Higher independence for T₂ → Stronger confirmation for T₂.

  3.  **Answers to Your Specific Questions:**

      *   **Is there a Bayesian version?** Yes, *with modifications*. Standard Bayesianism struggles with old evidence (the "problem of old evidence"). The solution lies in carefully defining the priors to reflect the *state of knowledge at the time of theory development* and the *counterfactual probability* of the evidence given the theory's construction path.  
          *   **Priors:** Assign priors to T *before* E is considered within the context of T's development. For T₁ (built for E), P(T₁) is high *because* it fits E. For T₂ (independent), P(T₂) isn't influenced by E.  
          *   **Likelihoods:** P(E|T) is 1 for both if they entail E.  
          *   **Confirmation:** Confirmation is P(T|E) / P(T). For T₁, P(T₁) is already high because it was built for E, so P(T₁|E) isn't much larger than P(T₁). For T₂, P(T₂) is *not* influenced by E, so P(T₂|E) is much larger than P(T₂). The difference stems from the priors reflecting the construction context.  
          *   **Forgotten Measurement:** The Bayesian needs to model the physicist's *ignorance*. For *her*, before learning E, P(E) is low (it's surprising). P(E|T) is high. So learning E significantly increases her credence in T. The community perspective is different.  
          *   **Novelty:** Novel predictions often imply low P(E) (surprise), leading to large P(T|E)/P(T). This fits your principle.  
          **Conclusion:** Your principle *can* be Bayesian if priors encode the epistemic history (how the theory came to be, what was known/used). It moves beyond naive Bayesianism that ignores the context of discovery.

      *   **Which verdicts might need abandonment?** Your principle is remarkably consistent with your intuitions. The main tension is with a strict "logical relation" view of confirmation (as hinted in Case 7). **The principle forces you to abandon the idea that confirmation is *purely* a logical/synchronic relation between T and E, independent of historical/epistemic context.** Confirmation strength depends on *how T came to be proposed* and *what was known when*. You judge that this context *does* matter, and your principle formalizes that. You must embrace that "independent leverage" is inherently tied to the discovery process.

      *   **Your Unsettled Case (Theory built for E₁, entails unknown E₂):**  
          *   **E₂ confirms the theory?** **Yes, strongly.**  
          *   **Compared to a novel prediction?** **Slightly less strong, but very close.**  
          **Why:**  
          *   **Non-Adjustment:** The theorist didn't use E₂ in construction; it played no role.
          *   **Epistemic Independence:** The theorist's process focused on E₁; there was no reason inherent in that process to expect T to fit E₂ specifically. The fit to E₂ is a genuine, unforeseen consequence. It provides independent leverage.
          *   **Strength vs. Novel Prediction:** It's slightly weaker than a true novel prediction for two reasons:  
              1.  **Temporal Order:** E₂ *existed* before T was proposed (like Mercury/Darwin), whereas a novel prediction didn't. There's a slight, often negligible, possibility the theorist *could* have known about it or been influenced indirectly, or that E₂ was "floating around" in the background knowledge. A novel prediction has zero prior existence.
              2.  **Risk of Accommodation:** While the theorist didn't *intend* to fit E₂, the theory was explicitly built to fit *some* evidence (E₁). There's a marginally higher risk that the form chosen to fit E₁ *just happens* to fit E₂ coincidentally, compared to a theory *not* built to fit any specific data. A novel prediction usually comes from a theory motivated by deep principles, making coincidental fit less likely. However, this difference is often small, and E₂ provides very strong confirmation – essentially a "retroactive novel prediction."

  **In Summary:**

  *   **Your Core Principle:** Confirmation strength depends on the **epistemic independence** of the evidence from the theory's construction process. Novel predictions maximize this. Evidence actively used in tuning minimizes it. "Forgotten" or "unappreciated" evidence falls in between.
  *   **Bayesianism:** Compatible with a sophisticated Bayesian approach that incorporates the epistemic context into prior probabilities and the interpretation of old evidence.
  *   **Abandonment:** Requires abandoning a purely logical/synchronic view of confirmation; historical context is crucial for strength.
  *   **Unsettled Case:** E₂ provides strong confirmation, very close to the strength of a novel prediction, as it offers significant independent leverage.

  This principle of **"Independent Leverage through Epistemic Independence"** captures the essence of your judgments across diverse cases, providing a clear framework for evaluating new ones.
