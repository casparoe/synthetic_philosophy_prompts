prompt: |-
  I'm running a reading group for philosophy grad students—they know arguments but nobody's done formal decision theory. Next week's topic is the Allais paradox and I've got about forty minutes. Don't explain it to me; I get the paradox. Plan how I should explain it. What needs to be in place first? I assume expected utility and the independence axiom, but how much of the von Neumann–Morgenstern construction do they actually need to see before the paradox lands, or can I just state the axiom and go? What example should carry the whole thing—the original Allais numbers or something stripped down? What misconceptions should I expect? I'm guessing at least "it's just the certainty effect, so it's psychology not rationality," "the independence axiom sounds obviously false once you think about it, so the paradox isn't suprising," and "the paradox just shows people are inconsistent, not that there's a deep problem for the axiom." Where in the sequence do I head each one off? And what's a question I can ask at the end that tells me whether they understood why the paradox is a problem for the axiom specifically, and not just a cute fact about how people flip preferences?
