answer: |-
  ## Ethics Seminar Final Exam Question

  **Question (20 marks):**  
  "Prioritarianism is often claimed to avoid the leveling-down objection that plagues telic egalitarianism. Explain precisely which formal feature of the prioritarian value function (e.g., ∑g(w_i)) grants it this supposed immunity, contrasting it explicitly with the relevant feature of a telic egalitarian view susceptible to leveling-down. Then, critically evaluate whether this very feature means prioritarianism secures its immunity *only by abandoning the core relational concern for fairness that motivates telic egalitarianism in the first place*. Finally, could a telic egalitarian consistently accept the *intuition* behind the leveling-down objection (that leveling down is pointless or worse) while nevertheless rejecting the *conclusion* that this undermines the intrinsic value of equality? If so, how? Where does the leveling-down objection retain its strongest force?"

  ---

  ### Model Answer (Approx. 600 words)

  Prioritarianism avoids the leveling-down objection fundamentally through the **formal feature of additive separability combined with strictly concave transformation**. Its value function takes the form ∑g(w_i), where g() is a strictly concave function (e.g., g(w_i) = √w_i). This concavity embodies *diminishing marginal moral value* of well-being: an additional unit of well-being matters more morally to a worse-off person than to a better-off person. Crucially, because the function is *additively separable*, the value assigned to each individual’s well-being depends *only* on their absolute level of well-being, not on their level *relative* to others.

  The leveling-down objection targets views that intrinsically value equality. A standard telic egalitarian view susceptible to it might value equality directly, using a function like ∑w_i - k * ∑|w_i - w_j| (for some k>0), where the second term explicitly compares individuals. When we level down (e.g., reducing the well-being of the better-off while leaving the worse-off unchanged in a two-person unequal society), the ∑w_i term decreases (making things worse), but the inequality term ∑|w_i - w_j| *also* decreases (making things better). For sufficient k, the net effect *can* be positive, implying the outcome is better *in one respect* (equality) despite being worse for everyone. This is the objection’s core: valuing the mere reduction of inequality *as such*, even when it benefits no one.

  Prioritarianism’s additive separability and concavity block this. In a leveling-down scenario, the absolute well-being of the better-off person(s) decreases. Because g() is strictly concave and applied individually, the *decrease* in g(w_better-off) is a *larger* moral loss than the *increase* in g(w_worse-off) would have been for an equivalent gain (due to diminishing returns). Crucially, there is *no gain* in the g-value for the worse-off person(s) whose level remains unchanged. Therefore, the *only* effect of leveling down is a decrease in the sum ∑g(w_i). It is unambiguously worse, avoiding the objection.

  However, this very feature arguably sacrifices the core relational concern motivating telic egalitarianism. The egalitarian’s fundamental intuition is that *it is bad (pro tanto) for some to be worse off than others through no fault of their own*. This is an *essentially comparative* judgment about the relationship between individuals. Prioritarianism’s additive separability renders it *non-comparative*; it cares only about the absolute weighted sum of individual well-being levels. The "unfairness" of one person being worse off than another *simply isn’t captured* by ∑g(w_i) unless it correlates with absolute disadvantage. If two people have different lives, but both are at levels where g() assigns similar weights, prioritarianism sees no injustice in their inequality *as such*. As Temkin argued, prioritarianism cares about the absolute size of the weighted individual pies, not how they compare. It replaces the egalitarian’s concern for *relational fairness* with a concern for *absolute priority to the worse-off* based solely on their individual position. The "fairness" the egalitarian seeks is relational; prioritarianism abandons this for a non-relational principle.

  A sophisticated telic egalitarian *can* accept the leveling-down intuition without abandoning intrinsic equality. They can argue that the leveling-down objection highlights a *specific flaw* in how some egalitarian views *aggregate* the value of equality with the value of well-being, not a flaw in the intrinsic value of equality itself. They might contend:
  1.  **Equality is intrinsically valuable**, so reducing inequality *is* a genuine gain.
  2.  **Leveling down also involves a distinct, massive loss** in total (and average) well-being.
  3.  **The loss simply *outweighs* the gain in almost all realistic cases.** Accepting the intuition that leveling down is "pointless" or "worse overall" just acknowledges this outweighing. It doesn’t deny the *existence* of the pro tanto gain from equality. It only denies that this gain is ever *sufficient* to outweigh the huge loss in well-being when no one benefits. The intrinsic value of equality remains, but its weight is context-dependent and usually overridden by the disvalue of harming people for no benefit.

  The leveling-down objection retains its strongest force against views that hold:
  1.  **Strict Implication:** That the *only* way to avoid implying leveling down is sometimes good (in one respect) is to deny equality has *any* intrinsic value. (Prioritarianism and this egalitarian response both reject this strict implication).
  2.  **Pragmatic/Intuitive Force:** Against views where the alleged intrinsic value of equality seems *so weak* that it never outweighs even minor losses, making its "intrinsic value" practically irrelevant or implausible.
  3.  **Conceptual Clarity:** Highlighting that the core motivation for telic egalitarianism *is* relational comparison, which prioritarianism explicitly rejects.

  ---

  ### Marking Scheme (Out of 20 Marks)

  **A Answer (17-20 Marks):**
  *   **Precisely identifies** additive separability and strict concavity of g() as the key formal features granting prioritarianism immunity to leveling-down. (3 marks)
  *   **Clearly contrasts** this with the non-separable, relativity-dependent feature of a susceptible telic egalitarian view (e.g., explicit inequality term). (2 marks)
  *   **Accurately explains** *why* concavity/seperability blocks leveling-down: No gain for unchanged individuals, larger moral loss for decreased well-being due to diminishing returns. (3 marks)
  *   **Robust Critical Analysis:** Explicitly argues that additive separability means prioritarianism lacks the *relational* concern central to telic egalitarianism (fairness as comparative), replacing it with non-comparative priority. Engages with the idea that this abandons the core egalitarian motivation. References or implies concepts like Temkin's "comparative fairness". (5 marks)
  *   **Sophisticated Telic Defense:** Clearly articulates how a telic egalitarian can accept the leveling-down *intuition* (loss outweighs gain) while maintaining intrinsic equality value. Distinguishes pro tanto gain from all-things-considered judgment. (3 marks)
  *   **Nuanced on Objection's Force:** Identifies where the objection retains force (against views implying leveling-down is *overall* good, against implausibly weak equality values, highlighting prioritarianism's non-relational nature). (2 marks)
  *   **Structure & Clarity:** Logically organized, precise terminology, no significant errors. (2 marks)

  **B Answer (13-16 Marks):**
  *   Correctly identifies diminishing marginal moral value / concavity as key for prioritarianism but may be less precise on additive separability. (2 marks)
  *   Contrasts prioritarianism and egalitarianism generally but may lack precision on the *formal* differences. (1 mark)
  *   Explains *why* prioritarianism avoids leveling-down but may be less detailed on the mechanism (e.g., mentions no one gains, but doesn't explicitly link to concavity causing larger moral loss). (2 marks)
  *   Some critical analysis of prioritarianism sacrificing egalitarianism's core, but may lack depth on the *relational/non-relational* distinction or fairness vs. priority. (3 marks)
  *   Acknowledges the telic egalitarian defense but may present it simplistically (e.g., "equality is outweighed") without fully distinguishing pro tanto vs. all-things-considered value. (2 marks)
  *   Mentions where the objection retains force but may lack nuance. (1 mark)
  *   Generally clear but may have minor errors or less precise language. (1-2 marks)

  **C Answer (9-12 Marks):**
  *   Identifies prioritarianism involves weighting but may confuse it with egalitarianism or lack formal precision.
  *   Basic understanding that prioritarianism avoids leveling-down but vague on *why*.
  *   Superficial or missing critical analysis of prioritarianism abandoning egalitarian concerns.
  *   Limited or confused discussion of telic egalitarian defense.
  *   Little discussion of the leveling-down objection's residual force.
  *   Significant omissions, vagueness, or minor errors in core concepts.

  **D/F Answer (0-8 Marks):**
  *   Major misunderstandings (e.g., conflates prioritarianism and egalitarianism, misstates leveling-down).
  *   Fails to identify key formal features or explain prioritarianism's immunity.
  *   Neglects critical analysis or telic defense parts of the question.
  *   Contains significant factual errors or incoherent arguments.

  **Common Mistakes Costing Marks:**
  *   **Conflation:** Equating prioritarianism with egalitarianism or sufficientarianism.
  *   **Vagueness:** Saying "weighting" without specifying concavity/seperability.
  *   **Mechanism Failure:** Stating leveling-down is worse under prioritarianism but not explaining *why* (no gain + larger moral loss).
  *   **Misrepresenting Egalitarianism:** Claiming egalitarians *must* think leveling-down is overall good.
  *   **Oversimplifying Defense:** Claiming telic egalitarians must deny the intuition or abandon intrinsic equality.
  *   **Ignoring Relationality:** Not addressing the core critique that prioritarianism drops relational fairness.

  ---

  **Confidence Note:** I am highly confident (90%) in the model answer's structure, identification of key formal features, and the core critique of prioritarianism abandoning relational fairness. The point I'm least sure of (70% confidence) is the precise formulation of the sophisticated telic egalitarian defense. While logically coherent and defended by some philosophers (e.g., Larry Temkin in later work), others argue it stretches the concept of "intrinsic value" too thin if the equality gain is *always* outweighed in practice. The defense is philosophically viable, but its plausibility is contested. The model presents it as a viable option a telic egalitarian *could* adopt, which is sufficient for the question.
