  ...I should emphasize that the transitivity trick is what seals it. If reality is frame-relative, but Frame 1 says "E is real now" and Frame 2 says "E is real now and simultaneous with F," then F must be real in Frame 1 too—else Frame 1 contradicts Frame 2 about E's present reality. That's the silent killer. 

