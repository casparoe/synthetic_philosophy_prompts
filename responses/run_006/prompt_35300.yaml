answer: |-
  **The Rietdijk-Putnam argument’s core philosophical leap is equating “real” with “determinate and frame-independently settled,” then using relativity of simultaneity to force eternalism via transitivity across reference frames.** Here’s the breakdown:

  ### **1. Physics Premises (Uncontroversial in SR):**
     - **Relativity of Simultaneity:** For any spacelike-separated event \(E\) (e.g., a future supernova), there exists a reference frame where \(E\) is simultaneous with your present event \(P\) (here-and-now).
     - **Invariance of Spacelike Separation:** If \(E\) is spacelike-separated from \(P\), it’s spacelike in all frames (no causal connection possible).

  ### **2. Philosophical Premises (Where the Work Happens):**
     - **(P1) Determinateness of the Present:** Events simultaneous with \(P\) in *your current frame* are real and determinate (e.g., you exist *now*, with definite properties).
     - **(P2) Frame-Independent Reality:** If an event is real/determinate in *any* frame, it must be real/determinate in *all* frames. Reality isn’t frame-relative.
     - **(P3) Transitivity of Simultaneity:** If \(E\) is simultaneous with \(P\) in frame \(F_1\), and \(P\) is simultaneous with \(Q\) in frame \(F_2\), then \(E\) and \(Q\) share the same ontological status (both real or both unreal).

  ### **3. The Argument Structure:**
     - **Step 1:** Pick a spacelike-separated future event \(E\) relative to your present \(P\).
     - **Step 2:** By SR, there’s a frame \(F_1\) where \(E\) and \(P\) are simultaneous.
     - **Step 3:** In \(F_1\), \(E\) is simultaneous with \(P\) → By (P1), \(E\) is real/determinate in \(F_1\).
     - **Step 4:** By (P2), if \(E\) is real in \(F_1\), it must be real in *your* frame too (frame-independence).
     - **Step 5 (Transitivity Killshot):** Consider an event \(Q\) simultaneous with \(P\) in *your* frame. In \(F_1\), \(E\) is simultaneous with \(P\), and \(P\) is simultaneous with \(Q\) in your frame → By (P3), \(E\) and \(Q\) are equally real. Since \(Q\) (e.g., your coffee cup) is real, \(E\) must be real *now* in your frame, even though it’s future for you.

  ### **Where to Resist: Attack the Philosophical Premises**
     - **Reject (P1):** Deny that simultaneity in *any frame* confers reality. Maybe only *your* present is real (“presentism”), but then you must explain why frames where \(E\) is "now" don’t count. SR makes all frames physically equivalent—privileging one frame ontologically is ad hoc.
     - **Reject (P2):** Embrace **frame-relative reality**. But this implies:
       - Event \(E\) is real in frame \(F_1\) but unreal in your frame.
       - When frames disagree on whether \(E\) “exists now,” there’s no fact of the matter. This leads to paradox: If you and a moving observer disagree on whether \(E\) is real *now*, and you later meet at \(E\), one of you was wrong about its past existence. This violates the invariance of physical facts.
     - **Reject (P3):** Deny transitivity across frames. But if \(E\) is real in \(F_1\) and simultaneous with \(P\), and \(P\) is real in your frame, how can \(E\) be unreal for you without contradicting \(F_1\)’s observation? This risks ontological inconsistency.

  ### **The Bottom-Line Tension**
  The argument forces a choice:  
  - Accept eternalism (all events are equally real).  
  - Reject SR’s democratic treatment of frames (privilege one frame’s "now").  
  - Embrace radical frame-relativity of existence (undermining objective reality).  

  **To resist, you must either:**  
  (1) **Deny that *any* notion of simultaneity (even frame-dependent) maps to “real”** (e.g., adopt a causal theory of existence), or  
  (2) **Argue that “determinateness” isn’t tied to simultaneity** (e.g., only causally accessible events are real), contradicting (P1).  

  The physics doesn’t *demand* eternalism—it’s the combination with (P1)-(P3) that traps you. Attack those.
