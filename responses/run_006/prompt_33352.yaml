  I'm drafting a term-paper proposal for an advanced metaphysics seminar, and I'd like you to turn my half-formed idea into a tight, one-page proposal. The topic is free-floating rationales: the idea that there can be normative reasons—considerations that genuinely count in favor of actions or beliefs—that are not reasons for any particular agent. The debate between internalists and externalists about reasons is usually framed around whether an agent's motivational set constrains what reasons she has. But both sides tend to assume that reasons are at least reasons *for someone*. I want to ask whether that assumption is defensible, or whether we should take seriously the possibility of agent-unowned reasons: normative facts that favor certain outcomes or states of affairs without thereby being reasons for any specific agent to bring them about.

  The question for the proposal: could there be a free-floating normative reason—a consideration that genuinely favors some state of affairs but is not a reason for any agent, not even an idealized or hypothetical one—and if so, what would this imply for the standard architecture of normative theory, which treats reasons as fundamentally agent-relational?

  The proposal should state the question precisely, explain why neither standard internalism nor standard externalism settles it (since both presuppose agent-relationality), sketch a method for making progress (conceptual analysis of reason-ascription, pressure-testing paradigm cases, mapping downstream consequences for theories of value and obligation), say what a successful result would look like and what would count as the project failing, and give a realistic scope for a 6,000-word semester paper. Don't include a bibliography; I'll add citations myself.
