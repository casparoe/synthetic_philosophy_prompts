prompt: |-
  I'm a software engineer and I've been building a little web app for my friend group (about nine of us) to make shared decisions — where to go for the annual trip, which restaurant, which board game to buy for the house, that kind of thing. We settled on ranked ballots because they felt fair, and I've been trying out different tallying rules: drop the option with the fewest first-place votes and redistribute, award points by position, run pairwise matchups, etc. But every single rule I implement, I can hand-construct a case where someone would get an outcome they prefer more by turning in a ranking that doesn't match what they actually want — like ranking their real second choice last to knock out the option they're scared of. At first I assumed I'd just coded the tallies wrong or picked bad rules, but now I've tried maybe six methods and the same thing keeps popping up.

  So my actual question: is it possible at all to build a voting method for three or more options where everyone's best move is always to just rank the options in their true order of preference? A friend with a math degree says it's provably impossible, but he couldn't explain why, and 'impossible' sounds like the kind of thing people say about a software problem that turns out to just be hard. If he's right, I'd like to understand what the actual tradeoff looks like — which properties can I have together, and which methods are the least bad for a small group of people who mostly trust each other and won't try to game things too hard? I'm not after a reading list, I just want to know whether I should stop chasing this and what to build instead.
reasoning: |-
  Okay, the user is a software engineer building a web app for their friend group to make shared decisions using ranked ballots. They've tried multiple tallying methods but keep encountering situations where strategic voting (insincerely ranking options) could lead to a better outcome for an individual. Their math-degree friend claims it's provably impossible to avoid this, and the user wants to understand why and what alternatives exist without getting a reading list.

  First, I need to confirm the friend's claim. Arrow's Impossibility Theorem states that no ranked voting system can meet all desirable criteria with three or more options. The key criterion being violated here is strategy-proofness—the idea that voters should never benefit from misrepresenting their preferences. The Gibbard-Satterthwaite theorem specifically proves that for three or more options, no voting system is both strategy-proof and non-dictatorial. So yes, the friend is correct; it's mathematically impossible.

  Now, the user's deeper need: they want a practical solution for their small, mostly-trusting group. Since perfect strategy-proofness is unattainable, I should focus on methods that minimize incentives for strategy or are robust in small groups. They need tradeoffs explained simply—which criteria can coexist, and which methods are "least bad." 

  The user mentioned they tried six methods (IRV, Borda, Condorcet, etc.), all failing. They might feel frustrated, thinking they coded something wrong. Reassuring them that the issue is inherent to voting theory, not their implementation, is crucial. They should stop chasing a perfect solution and instead pick a method that's "good enough" for their context.

  For a small cooperative group, methods like Borda or Copeland might work because strategic voting is less likely when trust is high. Alternatively, approval voting could sidestep ranking issues entirely. Explaining the practical strengths of each—Borda's simplicity, Condorcet's fairness despite tie risks, approval's resistance to strategy—would help them decide.

  Also, emphasizing that no method is perfect, but for their use case, transparency and ease of understanding might matter more. Since they're friends, they might prioritize a method that feels fair over theoretical robustness. Maybe suggest implementing two methods to compare outcomes, reducing the need for strategy.

  Finally, summarize the key takeaway: impossibility is proven, so pivot to pragmatic choices based on group dynamics. Highlight methods with lower strategy incentives in practice and encourage simplicity to avoid overcomplicating the app.
answer: |-
  You're facing one of the deepest truths in social choice theory: **your friend with the math degree is correct. It's mathematically impossible.** This isn't just "hard" – it's a fundamental limitation proven by rigorous theorems. Here's the breakdown:

  ### The Core Impossibility: Gibbard-Satterthwaite Theorem
  *   **What it says:** For any voting system that:
      1.  Handles **3 or more distinct options**,
      2.  Produces a single winner (or a well-defined ranking),
      3.  Is **non-dictatorial** (no single voter always decides), and
      4.  Has **at least 3 possible outcomes that any voter might reasonably prefer**,
      ...**it is IMPOSSIBLE** to design a system where voters *always* get their best outcome by ranking options truthfully.
  *   **Why it matters:** This theorem *directly* addresses your problem. It proves that **strategy-proofness** (truthful voting is always optimal) is incompatible with the other basic, desirable properties listed above. Every ranked-ballot method you've tried (and any you *could* try) falls under this umbrella.

  ### What's the Tradeoff? Arrow's Impossibility Theorem (The Bigger Picture)
  Gibbard-Satterthwaite focuses on strategy-proofness. Arrow's Theorem shows a related but broader impossibility:
  *   **What it says:** For 3+ options, no ranked voting system can simultaneously satisfy all of these:
      1.  **Unrestricted Domain:** Any possible set of individual preference rankings is allowed.
      2.  **Non-Dictatorship:** No single voter dictates the outcome.
      3.  **Pareto Efficiency:** If *every* voter prefers A over B, then A should rank above B in the group result.
      4.  **Independence of Irrelevant Alternatives (IIA):** The group ranking between A and B should *only* depend on how individual voters rank A vs. B. The presence or ranking of a "spoiler" option C shouldn't change whether A beats B or B beats A.
  *   **Why it matters:** IIA is crucial for preventing the *exact* strategic scenario you described (ranking a strong opponent last to manipulate pairwise matchups). But Arrow proves you *must* sacrifice at least one of these four properties. Most practical systems sacrifice IIA. **This is why strategic voting opportunities exist.**

  ### What Should You Build? Pragmatic Choices for Your Group
  Since perfect strategy-proofness is impossible, focus on methods that are:
  1.  **Transparent & Understandable:** So your group trusts the result.
  2.  **Reasonably Resistant to Strategy in Practice:** Especially with a small, cooperative group.
  3.  **"Sensible" in Outcomes:** Matches intuitive notions of fairness most of the time.

  Here are practical options, weighing the tradeoffs:

  1.  **Ranked Pairs (Tideman Method) - Condorcet Champion:**
      *   **How:** Finds pairwise winners (A beats B, A beats C, B beats C, etc.). "Locks in" wins starting with the largest victory margins, skipping any that would create a cycle. The option at the top wins.
      *   **Pros:** Always elects a Condorcet winner if one exists (beats all others head-to-head). Feels very fair logically. Resistant to many common strategy types *in practice*.
      *   **Cons:** Can be complex to explain/implement. Susceptible to "burying" (ranking a strong threat *last* strategically) if a Condorcet winner doesn't exist and cycles form. Small groups can have cycles.
      *   **Good for:** Fairness, logical soundness. Best if your group values pairwise comparisons.

  2.  **Instant-Runoff Voting (IRV) / Single Transferable Vote (STV for single winner):**
      *   **How:** Eliminate the option with the fewest 1st-place votes, redistribute ballots. Repeat until one option has >50%.
      *   **Pros:** Simple to understand *conceptually*. Avoids vote-splitting (unlike plurality). Often resists "compromise" strategy (voting for a lesser choice to avoid a worse one).
      *   **Cons:** Violates IIA severely. Highly susceptible to "burying" (like in your example) – ranking your *real* second choice last *can* help your real first choice win. Fails the Condorcet criterion.
      *   **Good for:** Simplicity, electing broadly acceptable candidates. Less good if your group strongly values pairwise comparisons.

  3.  **Borda Count:**
      *   **How:** Points awarded based on rank (e.g., 1st = 3pts, 2nd = 2pts, 3rd = 1pt for 3 options). Highest total wins.
      *   **Pros:** Simple to calculate and understand. Provides a full ranking. Rewards broad acceptability.
      *   **Cons:** Highly susceptible to strategic voting: "Compromising" (boosting a lesser choice) and "burying" (sinking a threat) are major strategies. Very sensitive to the number of options/points system. Fails Condorcet and IIA.
      *   **Good for:** Simplicity, getting a full ranking. **Worst** among these for strategy resistance.

  4.  **Approval Voting (Not Ranked! But Worth Considering):**
      *   **How:** Voters simply select *all* options they "approve" of (find acceptable). Option with the most approvals wins.
      *   **Pros:** Extremely simple. Highly resistant to strategy in practice – best strategy is usually to approve everyone you like *more* than the expected winner. Simple tally.
      *   **Cons:** Doesn't capture strength of preference (ranking). Can encourage "bullet voting" (approving only your favorite) in competitive scenarios, though less likely in a cooperative small group. Winner might be a compromise.
      *   **Good for:** Simplicity, strategy resistance, speed. Great if "acceptable to most" is a key goal.

  ### Recommendation for Your Small, Trusting Group

  1.  **Stop Chasing the Impossible:** Accept that *any* ranked method *can* be gamed. The goal is to minimize the *need* and *incentive* to game it within your specific context.
  2.  **Leverage Your Context:** With only 9 cooperative friends who likely share preferences, the *practical* incentive for complex strategy is **low**. People will probably vote honestly most of the time regardless. Focus on a method that feels fair and produces sensible results.
  3.  **Strong Recommendation 1: Ranked Pairs (Tideman):**
      *   Offers the strongest *theoretical* fairness (Condorcet).
      *   Strategic manipulation (like burying) requires precise coordination or prediction, which is unlikely in a small group.
      *   Results will feel logically sound ("This won because it beat everyone else head-to-head").
  4.  **Strong Recommendation 2: Approval Voting:**
      *   Removes the ranking problem entirely.
      *   Maximally strategy-resistant in practice.
      *   Dead simple to implement and understand.
      *   Forces voters to think about acceptability rather than just a single favorite.
  5.  **Avoid:** Plain IRV (due to strong burying vulnerability) and Borda (most manipulable ranked method) if strategy worries you, though they are simple.

  **In summary:** You've hit bedrock. No ranked method solves the strategy problem. For your trusted small group, embrace the impossibility and choose a method based on **practicality, transparency, and resistance to common manipulations** (Ranked Pairs or Approval Voting are excellent choices). Don't let the theoretical flaw paralyze you – in your context, a good method will work well most of the time with honest voters. Build Ranked Pairs or Approval Voting and move on to making fun decisions!
