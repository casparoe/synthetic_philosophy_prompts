answer: |-
  ## Structured In-Class Activity: Epistemic Peer Pressure Challenge

  ### 1. Overview and Learning Aims (150 words)
  This activity immerses students in an epistemic dilemma where they must reconcile their judgment with an apparent peer’s contradictory view under accuracy incentives. **Aims:**  
  - **Experience the tension:** Students discover why peer disagreement can force confidence revision through direct confrontation.  
  - **Identify rational steadfastness:** They articulate what justifies maintaining their original view despite peer opposition.  
  - **Evaluate costs:** By submitting joint/public and private answers with scoring consequences, they confront the trade-offs between surrender (risking error) and rigidity (ignoring peer input).  
  The design ensures the problem emerges organically: Students receive identical ambiguous evidence, are paired with genuine dissenters, are declared peers by facilitator fiat, and face scoring that rewards only correctness—not agreement—forcing them to weigh evidence against peer credibility.  

  ---

  ### 2. Materials and Advance Preparation (100 words)  
  - **Materials:**  
    1. 16 copies of a 1-page "Evidence Dossier" (see below).  
    2. 16 small blank cards (for private revisions).  
    3. 8 large sheets for joint submissions.  
    4. Timer, whiteboard for scoring.  
  - **Preparation:**  
    - Create an **ambiguous Evidence Dossier**: A short vignette + statistics. *Example: "Is City X safe? 2023 data: 12 violent crimes/10k people (national avg: 10/10k). Testimonials: 3 residents call it 'very safe,' 2 say 'unsafe.'"*  
    - Pre-test dossier with colleagues to ensure ~50/50 split on "Is City X *generally* safe? (Yes/No)" judgments.  
    - Arrange seating to pair dissenters (based on pre-class survey or quick in-class vote).  

  ---

  ### 3. Step-by-Step Timeline with Facilitator Instructions (500 words)  
  **Total: 75 mins**  

  - **(0-5 mins) Setup:**  
    *Distribute Evidence Dossier. No theoretical intro.*  
    > "Read this dossier. **Individual Task:** Decide: Is City X generally safe? Circle YES or NO. Assign **confidence**: 60-100% (100% = total certainty). Write a 1-sentence reason. Silence until all finish."  

  - **(5-20 mins) Individual Judgment:**  
    Students work alone. *Facilitator circulates, notes natural disagreements. Pairs students with opposing answers.*  

  - **(20-25 mins) Peer Pairing & Stipulation:**  
    > "Pair up with [named partner]. **Critical rule:** You are **epistemic peers**. Same evidence, similar skill in evaluating such data, and equal track records. Treat each other as such."  
    *Write on board: "PEER STATUS: Equal evidence, equal reliability."*  

  - **(25-45 mins) Joint Submission Phase:**  
    > "Agree on **one answer** (YES/NO) and **joint confidence %**. Also submit a **shared 2-sentence justification**. Write on large sheet. Dissenters may add a *brief* minority note."  
    *Emphasize: "Your score depends *only* on whether your final answer is correct."*  

  - **(45-50 mins) Private Revision:**  
    > "Silently reconsider. On a blank card, privately write: **Your personal answer** and **confidence %**. No discussion."  

  - **(50-65 mins) Reveal & Scoring:**  
    Reveal "correct" answer (pre-determined by dossier author; e.g., "NO" based on unreleased context).  
    *Display scoring formula (see Section 4). Calculate scores for:  
    (a) Initial individual answer  
    (b) Joint submission  
    (c) Private revision*  

  - **(65-75 mins) Transition to Debrief:**  
    > "Keep your cards. We’ll discuss what happened."  

  ---

  ### 4. Payoff and Scoring Scheme (150 words)  
  Scoring rewards **accuracy**, not consensus, using a logarithmic confidence-based system:  
  - **Correct answer:** Points = Confidence % (e.g., 80% confidence → 80 pts if correct).  
  - **Incorrect answer:** Points = (100 - Confidence %) (e.g., 80% confidence → 20 pts if wrong).  
  **Rationale:** High confidence correct → maximal reward. High confidence wrong → maximal penalty. Low confidence avoids extremes but caps gains.  
  **Three scored stages:**  
    1. **Initial individual** (baseline)  
    2. **Joint submission** (tests consensus cost)  
    3. **Private revision** (tests post-discussion conviction)  
  *Example:* A student switches from correct YES (80%) to incorrect joint NO (70%). They lose: 80 (initial) - 70 = 10 pts. Had they stuck privately, they’d keep 80 pts. The system forces trade-offs: Compromising risks losing points; steadfastness risks heavy penalties if wrong.  

  ---

  ### 5. Debrief: Mapping Activity to Positions (400 words)  
  **Transition:** "Notice where you gained/lost points. Let’s name the pressures you felt."  
  - **Joint phase → Conciliationism (Equal Weight View):**  
    > "When peers disagreed, the joint answer often split differences or lowered confidence. Why? The peer-stipulation made their disagreement *higher-order evidence* against your reliability. If peers are truly equal, their view should ‘pull’ yours toward theirs. This is conciliationism: disagreement *requires* significant confidence revision."  
    *Cost:* If the peer was wrong, conceding lost you points ("spinelessness").  

  - **Private revision → Steadfastness:**  
    > "Some reverted to their initial view privately. To rationally do this, you needed reasons beyond the raw evidence—e.g., ‘I noticed my peer overlooked X in the dossier.’ Steadfastness says: *You* might be uniquely right *if* you have reasons to discount peer input."  
    *Cost:* If you ignored a correct peer, you lost points ("bootstrapping": privileging your judgment circularly).  

  - **Confidence Shifts → Higher-Order Evidence:**  
    > "Your private confidence likely shifted. Was this because you re-examined the dossier? Or because a peer doubted you? The latter is *higher-order evidence*—evidence about your evidence-handling. Conciliationists say this should dominate; steadfasters say dismiss it if you have grounds."  

  - **The Dilemma:**  
    > "Conciliationism risks *skepticism*: If all peers conciliate, confidence evaporates. Steadfastness risks *dogmatism*: Ignoring peers can amplify errors. The core tension: When (if ever) is your ‘ground’ for steadfastness justified, not self-serving?"  

  ---

  ### 6. Predictable Failure Modes and Handling (250 words)  
  - **Failure: Unambiguous Evidence**  
    *Risk:* Dossier triggers unanimous agreement.  
    *Fix:* Pre-test rigorously. If unanimity occurs, use pre-written "disagreement vignettes" (e.g., "Assume your peer argued X [counterfactual]").  

  - **Failure: Pair Conflict/Deadlock**  
    *Risk:* Pairs fight or refuse consensus.  
    *Fix:* > "If deadlocked, submit both answers but *mark one as default*. No penalty; scoring depends only on correctness."  

  - **Failure: Peer Stipulation Ignored**  
    *Risk:* Students dismiss peer status ("But I’m better at stats!").  
    *Fix:* Intervene early: > "The rule *defines* you as peers. You *must* operate under this constraint." Reiterate peer criteria on board.  

  - **Failure: Scoring Confusion**  
    *Risk:* Math distracts from epistemology.  
    *Fix:* Use simple examples pre-activity. Calculate 1-2 sample scores publicly.  

  - **Failure: Superficial Justifications**  
    *Risk:* Joint justifications like "We compromised."  
    *Fix:* > "Your justification must cite dossier *evidence*, not negotiation tactics."  

  ---

  ### 7. What This Activity Cannot Reproduce (150 words)  
  The **emotional and relational stakes** of real-world peer disagreement are unavoidably minimized. In reality:  
  - Peer status is **earned/assessed over time** (not decreed).  
  - Disagreements often involve **deeply held beliefs** (not one-off puzzles).  
  - **Social/power dynamics** (e.g., gender, seniority) shape deference.  
  - **Truth may not be knowable** (unlike the dossier’s pre-set answer).  
  *Debrief admission:*  
  > "Today, I *declared* you peers and we *knew* an answer existed. Real disagreements lack this clarity. You must ask: Was peer status *truly* warranted? Is the issue even settleable? This activity isolates the *logical* tension, but real life adds layers of ambiguity and consequence."  

  ---  
  This design ensures students *feel* the peer-pressure problem before labeling it, using incentives and rules to make conciliationism’s pull and steadfastness’s cost viscerally clear within strict time constraints.
