  ## The Sestina of Unwept Tears

  He never lived, the hero on the **page**,
  Yet something sharp and bitter makes me **grieve**.
  Can tears be shed for shadows? Can I **believe**
  The ink-stained fate that makes my vision blur?
  I watch the actor perfectly **pretend**
  To die; my pulse quickens. What do I **know**?

  A wiser part insists: I truly **know**
  This grief springs from a phantom on the **page**,
  The crafted sorrows that the author **pretend**.
  My trembling lip, the catch – is this to **grieve**
  For what was never, could not be, **real**?
  Or just a practiced dance, a make-**believe**?

  Perhaps the heart needs only make-**believe**
  To trigger ancient circuits. Need we **know**
  The threat is solid, visceral, and **real**
  To flinch? The story conjures from the **page**
  A wave of feeling, sharp enough to **grieve**,
  Though reason whispers "This is just **pretend**."

  But *is* it just a conscious, cool **pretend**,
  This wrenching sorrow? Does my soul **believe**
  Briefly, immersed, forgetting how to **know**
  The boundaries? Lost within the **page**,
  Does some deep, wordless part of me **grieve**
  As if its loss were tangible and **real**?

  The terror feels so utterly **real**
  When darkness cloaks the stage. That anxious **pretend**
  Seizes my breath. Yet, how can I **grieve**
  For Cordelia, when I must **believe**
  She is but marks on Shakespeare's weathered **page**?
  This contradiction logic cannot **know**.

  Perhaps the wiser stance is simply **know**
  The ache persists, undimmed by "not quite **real**."
  The power rests within the printed **page**
  To stir these ghosts. We neither **pretend**
  Nor fully, foolishly, **believe**,
  But yield to currents strong enough to **grieve**.

  Another thought: do we, while we **grieve**,
  Suspend the constant need to truly **know**,
  Admitting "For this moment, I **believe**"?
  Letting the crafted dream feel fiercely **real**
  Within the theatre? Is that **pretend**
  Made potent by the turning of the **page**?

  Or does the **page** demand we **pretend**
  To **know** a death, to **grieve** a loss, to **believe**
  Just long enough the fiction feels **real**?

  \answer{The poem concludes that attempts to resolve the paradox of emotional response to fiction merely rearrange its core elements—genuine feeling, disbelief, and the fictional object—without achieving closure.}
