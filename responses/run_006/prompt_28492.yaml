prompt: |-
  I run a nonprofit that designs and facilitates citizens' assemblies and participatory budgeting processes for municipal governments. We handle eight to ten processes a year, each involving a few dozen residents over three or four weekends, producing recommendations that go to a city council for an up-or-down vote. The stakes are real: councils adopt our assemblies' recommendations more often than not, and a badly designed process can produce recommendations that are incoherent, easily dismissed, or worse than the status quo.

  I've been reading Dewey — not systematically, but enough to recognize that his view of democracy as a method of collective experimental inquiry has implications for how we should structure these sessions. But I can't turn the philosophy into a facilitator's protocol myself, and I don't have the background to know which of Dewey's distinctions are load-bearing and which I can simplify for a facilitator who has never read a word of him.

  Please write me a procedure — a step-by-step guide my facilitators can actually follow when designing and running a deliberative session — grounded in Dewey's experimentalist conception of democracy and inquiry. It should cover: how to frame the initial question so it functions as a genuine problem that opens inquiry rather than closing it; how to structure the presentation of evidence and expert input so it feeds collective hypothesis-formation rather than preempting it; how to guide the group through testing and revising proposals against anticipated consequences; and how to know when the process needs another round of inquiry rather than a vote. The procedure should be usable by a facilitator who has about fifteen minutes to review it before a session and no background in philosophy.

  Then apply the procedure to two cases: (1) a participatory budgeting session where residents must allocate a fixed sum between funding a new library branch, expanding a youth sports program, and improving stormwater drainage — three proposals with incommensurable kinds of evidence behind them; and (2) a citizens' assembly on whether the city should adopt a rent stabilization ordinance, where the expert testimony is sharply contested and the group is polarized from the outset. For at least one of these, show me where the procedure produces a recommendation my team will not like — because it demands more time than we can give it, because it forces a conclusion the group is trying to avoid, or because it reveals that the question as framed by the city council is the wrong question and needs to be reopened.

  Be explicit about where the procedure will break: where Dewey's ideal of inquiry assumes conditions that a three-weekend citizens' assembly cannot meet, where the procedure papers over a genuine tension in Dewey's own thought, and where a facilitator will have to make a judgment call that no procedure can eliminate. If you think the whole project of operationalizing Dewey this way is misguided — that his experimentalism is a regulative ideal, not something you can turn into a facilitator's checklist — say so plainly rather than giving me a procedure that misrepresents it.
reasoning: |-
  We are operationalizing John Dewey's experimentalist conception of democracy and inquiry into a facilitator's protocol for citizens' assemblies and participatory budgeting. The core idea is that democracy is a collective problem-solving process where citizens engage in iterative cycles of hypothesis formation, testing, and revision in response to shared problems.

  Key Deweyan principles:
  1. **Problem as the starting point**: The process must begin with a shared problem that is felt by the community and that opens inquiry (not a pre-determined solution).
  2. **Inquiry as experimental**: Proposals are hypotheses to be tested by considering anticipated consequences.
  3. **Evidence as instrumental**: Information and expert input are not to be taken as final answers but as tools to help the group form and test hypotheses.
  4. **Fallibilism and revisability**: Any conclusion is provisional and subject to revision in light of new evidence or consequences.
  5. **Collective intelligence**: The process must harness the diverse experiences and perspectives of the participants.

  Given the constraints (facilitators without philosophy background, 15-minute review time), we must simplify without losing the core.

  **Procedure: Deweyan Deliberative Session Protocol**

  **Step 0: Pre-Session Framing (Critical for the facilitator to get right)**
  - **Frame the problem, not the solution**: The initial question must be posed as a shared problem that the community faces. Avoid questions that presuppose a solution (e.g., not "Should we build a new library?" but "How can we best meet the community's needs for learning and gathering spaces, given limited resources?"). The problem should be broad enough to allow multiple avenues of inquiry but specific enough to be actionable.
  - **Identify the stakes**: Clearly articulate why this problem matters and to whom. This builds shared motivation.

  **Step 1: Opening the Inquiry (First session)**
  - **Shared problem articulation**: Begin by having participants share their experiences related to the problem. This builds a shared sense of the problem's urgency and multiple dimensions.
  - **Reframe the initial question**: If necessary, adjust the problem statement based on participants' input. The group must "own" the problem.
  - **Hypothesis generation**: Ask participants to brainstorm potential solutions (hypotheses) without evaluation. Capture all ideas.

  **Step 2: Evidence and Expert Input (Integrated throughout)**
  - **Purpose**: Evidence is to inform the group's hypotheses, not to decide the issue.
  - **Structure**:
    - Present evidence in multiple forms (e.g., data, expert testimony, lived experience) but always in relation to the hypotheses the group is considering.
    - After each piece of evidence, ask: "How does this change our understanding of the problem or our hypotheses? What new questions does it raise?"
    - Encourage participants to question experts and challenge evidence. Experts are resources, not authorities.

  **Step 3: Hypothesis Testing and Revision (Core of the process)**
  - For each hypothesis (proposal), guide the group through:
    - **Anticipated consequences**: "If we do X, what do we expect to happen? Who benefits? Who might be harmed? What are the long-term effects? What could go wrong?"
    - **Evidence alignment**: "What evidence supports or challenges these expected consequences?"
    - **Revision**: "How might we adjust X to avoid negative consequences or to better achieve our goals?"
  - Use iterative small group discussions and plenary sharing to deepen analysis.

  **Step 4: Decision Point: Another Round or Vote?**
  - **Criteria for extending inquiry**:
    - The group is stuck in polarization without understanding the root of disagreement.
    - New evidence has emerged that fundamentally challenges a key hypothesis and requires more investigation.
    - The group realizes the problem was framed incorrectly and needs to revisit Step 1.
    - There is no consensus on the anticipated consequences of the leading proposals.
  - **Criteria for voting**:
    - The group has tested the leading proposals against consequences and revised them.
    - The trade-offs are clear and acknowledged by the group.
    - Further inquiry would not yield new insights (diminishing returns).

  **Step 5: Formulating Recommendations**
  - Recommendations must include:
    - The problem as the group now understands it (which may have evolved).
    - The proposed solution(s) as hypotheses.
    - The key anticipated consequences that led the group to favor this solution.
    - Any unresolved questions or contingencies (e.g., "We recommend X, but if condition Y changes, then Z should be reconsidered").

  **Breaking Points and Tensions**:
  - **Time constraints**: Deweyan inquiry is open-ended; a 3-weekend assembly may truncate necessary iterations.
  - **Complexity of evidence**: Incommensurable evidence (e.g., qualitative vs. quantitative) may resist integration without expert mediation the group lacks.
  - **Polarization**: Dewey assumes a shared problem and willingness to inquire. In deeply polarized groups, building shared problem ownership may be impossible in the allotted time.
  - **Facilitator judgment**: Deciding when to extend inquiry or force a vote is inherently subjective and context-dependent.
  - **Power imbalances**: The process may not overcome structural inequities that affect whose voice is heard or whose consequences matter.

  **Is this project misguided?** 
  No, but it requires humility. Dewey's experimentalism is a compass, not a map. The procedure is a heuristic that must be adapted to context. It will not guarantee "truth" but can foster more reflective collective judgment.

  ---

  **Application to Case 1: Participatory Budgeting (Library, Youth Sports, Stormwater Drainage)**

  **Step 0: Pre-Session Framing**
  - Problem: "How can we allocate $1.5 million to best serve the community's diverse needs for learning, recreation, and safety, given that we cannot fund all worthy projects?"

  **Step 1: Opening the Inquiry**
  - Participants share experiences: e.g., flooding in their neighborhood, lack of safe spaces for teens, difficulty accessing library services.
  - Hypotheses: The three proposals are starting points, but the group may generate others (e.g., a smaller library expansion combined with sports).

  **Step 2: Evidence and Expert Input**
  - Present evidence for each:
    - Library: Usage data, equity analysis (access in underserved areas), cost estimates.
    - Youth Sports: Participation rates, health outcomes, crime reduction studies.
    - Stormwater: Flood risk maps, cost of damage, climate projections.
  - After each, ask: "How does this affect our view of the problem? Which needs feel most urgent? What trade-offs emerge?"

  **Step 3: Hypothesis Testing**
  - For each proposal, consider:
    - Library: Consequences might include improved literacy but only in one area; opportunity cost of not addressing flooding.
    - Youth Sports: May reduce youth idleness but may not serve all demographics; maintenance costs?
    - Stormwater: Prevents property damage but invisible until failure; long-term savings vs. immediate benefits.
  - Revision: Group might propose partial funding for all, or a hybrid (e.g., stormwater + a mobile library van).

  **Step 4: Decision Point**
  - If the group sees the trade-offs clearly (e.g., "We fund stormwater because climate risk is existential, even though it's less visible") → vote.
  - If stuck (e.g., "We can't compare literacy to flood prevention"), extend inquiry: Break into small groups to rank consequences by urgency or equity impact.

  **Where the procedure breaks**:
  - Incommensurable evidence: Quantifiable flood risk vs. qualitative youth benefits. Facilitator must help group define shared evaluation criteria (e.g., "Which serves the most vulnerable?").

  **Recommendation we won't like**: The group might reject the council's three options and propose a new hybrid project that requires re-engineering the budget. This demands more time and council buy-in.

  ---

  **Application to Case 2: Rent Stabilization Ordinance**

  **Step 0: Pre-Session Framing**
  - Problem: "How can we ensure that city residents have stable, affordable housing without unintended consequences like reduced housing supply or quality?"

  **Step 1: Opening the Inquiry**
  - Participants share experiences: Renters facing displacement, landlords fearing bankruptcy, etc. Builds shared sense of the problem's complexity.

  **Step 2: Evidence and Expert Input**
  - Present contested evidence:
    - Pro-stabilization: Data on rising evictions, displacement of vulnerable groups.
    - Anti-stabilization: Studies showing reduced new construction, deterioration of existing units.
  - After each, ask: "What assumptions does this evidence challenge? What new hypotheses might we consider?"

  **Step 3: Hypothesis Testing**
  - Leading hypotheses: Adopt rent control (various forms) vs. alternative approaches (e.g., direct subsidies, zoning changes).
  - Anticipated consequences:
    - Rent control: Short-term relief for current renters but possible long-term shortages.
    - Alternatives: May take longer and cost the city money.
  - Revision: Group might propose a hybrid (e.g., rent stabilization with exemptions for new units, paired with subsidies).

  **Step 4: Decision Point**
  - Polarization is high. If group is entrenched in "sides", extend inquiry: Have participants argue for the position they oppose to surface underlying values (e.g., stability vs. market freedom). Then ask: "What shared goals can we agree on? (e.g., 'No one should be homeless due to rent increases')."
  - If time runs out without consensus, the recommendation must honestly reflect the disagreement and propose a pilot program with monitoring.

  **Where the procedure breaks**:
  - Deep polarization: Dewey assumes a community of inquiry. If participants see each other as enemies, not collaborators, the process may fail.
  - Contested expertise: The group may distrust all experts, leading to paralysis.

  **Recommendation we won't like**: The group concludes that rent stabilization is too blunt and asks for 6 more months to study alternatives. This exceeds our timeline and forces the council to confront the inadequacy of their original question.

  ---

  **Conclusion**: This procedure makes Dewey actionable but is no panacea. It will sometimes reveal that the problem is deeper than the council imagined, forcing uncomfortable extensions. But that is Deweyan experimentalism in action: democracy as a learning process, not a voting machine.
answer: |-
  Below is a step-by-step facilitator's protocol grounded in John Dewey's experimentalist conception of democracy as collective inquiry. Dewey's core ideas—democracy as a method of problem-solving through iterative hypothesis-testing, where evidence informs (but doesn't predetermine) decisions—are simplified into actionable steps. I'll flag where the protocol simplifies Dewey, where it breaks, and where facilitator judgment is unavoidable. **Crucially, this is a practical approximation of Dewey's ideals, not a perfect implementation.** Dewey saw inquiry as a fluid, open-ended social process; compressing it into a fixed procedure risks losing its essence. But for your context—time-bound, outcome-oriented assemblies—this balances philosophy and pragmatism.

  ---

  ### **Deweyan Deliberative Session Protocol**  
  *For facilitators (review in 15 mins; no philosophy background needed)*

  **Core Principles Simplified from Dewey:**  
  1. **Start with a "felt problem"**: The problem must be tangible, urgent, and open-ended (not a yes/no question).  
  2. **Treat proposals as hypotheses**: Ideas are experiments to test against real-world consequences, not fixed solutions.  
  3. **Evidence as inquiry fuel**: Experts/data inform hypotheses but don't end debate. Ask: "What if we're wrong?"  
  4. **Collective testing > compromise**: Prioritize revising ideas based on shared consequences over forcing consensus.  
  5. **Embrace fallibility**: If the group hits uncertainty, extend inquiry—don't vote prematurely.  

  ---

  #### **Step-by-Step Procedure**  
  **Total Time:** Adaptable for 3–4 weekends. Each "session" = 2–4 hours.  
  **Facilitator Goal:** Guide the group through cycles of "hypothesis → test → revise" without controlling outcomes.

  1. **Frame the Problem (Weekend 1, Session 1)**  
     - **Goal:** Open inquiry by focusing on a shared, urgent problem. Avoid "solution-first" questions.  
     - **Action:**  
       - Rewrite the city council's question (e.g., not "Should we fund X or Y?" but **"How might we address [specific problem] given what we stand to lose?"**).  
       - Example: For rent stabilization, not "Adopt rent control?" but **"How can we ensure housing stability for renters without unintended harms like reduced housing supply?"**  
     - **Group Activity:**  
       - Have participants share personal stories related to the problem. Cluster these into 2–3 "problem themes" (e.g., "Fear of displacement," "Unpredictable costs").  
       - **Reframe together:** "As a group, what problem are we really trying to solve?"  
     - *Dewey Simplified:* Focus on "problem as disruption" (what people feel). Ignore Dewey's epistemology.  
     - *Breaks if:* The council's question is too rigid (e.g., "Choose A, B, or C"). Facilitator must negotiate reframing upfront.  

  2. **Generate Hypotheses (Weekend 1, Session 2)**  
     - **Goal:** Brainstorm proposals as "testable experiments," not solutions.  
     - **Action:**  
       - Ask: "What might we try to address our problem themes? No idea is too bold."  
       - Cluster ideas into 3–5 hypotheses. Forced diversity: Include unpopular/opposing views.  
       - **Frame hypotheses as experiments:** "If we try [X], what could happen?"  
     - *Example (PB):* "Hypothesis 1: Fund library branch to reduce education gaps. Hypothesis 2: Fund sports to lower youth crime. Hypothesis 3: Fund drainage to prevent flood damage."  
     - *Dewey Simplified:* Hypotheses are social experiments; drop Dewey's "doubt-belief" theory.  
     - *Judgment Call:* Facilitator ensures all voices are heard but doesn’t force "balance" if group leans one way.  

  3. **Feed Evidence to Fuel Inquiry (Integrated throughout)**  
     - **Goal:** Use experts/data to test hypotheses, not end debate.  
     - **Action:**  
       - **Present evidence in "inquiry chunks":**  
         - Before expert input: "What questions do we need answered to test our hypotheses?"  
         - After input: "How does this challenge or support our hypotheses? What new questions arise?"  
       - **Avoid:** Letting experts dominate. Assign roles: "Skeptic," "Advocate," "Impact Analyst" among participants.  
       - **For contested evidence:** "What if [expert A] is right? What if [expert B] is right? How would that change outcomes?"  
     - *Dewey Simplified:* Evidence is instrumental—use it to provoke doubt/revision, not authority.  
     - *Breaks if:* Experts refuse to engage in dialogue (e.g., lecture mode). Facilitator must intervene.  

  4. **Test Hypotheses Against Consequences (Weekend 2–3)**  
     - **Goal:** Evaluate proposals by projecting consequences, not debating "merits."  
     - **Action:**  
       - **Small groups:** Each tests one hypothesis. Ask:  
         - "Who benefits/harms if we try this? How?"  
         - "What could go wrong? (e.g., costs, unintended effects)"  
         - "Is this reversible if it fails?"  
       - **Plenary sharing:** Groups report: "We liked [X], but we worry about [Y]."  
       - **Revise:** Merge/adapt hypotheses to avoid harms (e.g., "Fund drainage but add a low-cost sports pilot").  
     - *Dewey Simplified:* Consequences are the "test" of truth; skip Dewey's logic of inquiry.  
     - *Judgment Call:* Facilitator highlights trade-offs but doesn’t resolve them.  

  5. **Decide: Extend Inquiry or Vote? (Weekend 3–4)**  
     - **Goal:** Vote only if consequences are clear; extend if uncertainty/polarization persists.  
     - **Action:**  
       - **Test for readiness:**  
         - "Do we agree on the likely consequences of our top proposals?" (If no → extend).  
         - "Are we avoiding a hypothesis because it’s uncomfortable?" (If yes → extend).  
       - **Extend inquiry if:**  
         - Fundamental disagreement on facts/values.  
         - New consequences emerge (e.g., "What if drainage funds divert from road repairs?").  
         - The problem feels mis-framed (e.g., "Rent control won’t fix the root issue").  
       - **Vote if:** Trade-offs are acknowledged and consequences are mapped.  
     - *Dewey Simplified:* Dewey saw inquiry as continuous; voting is a "forced settlement." Here, it’s a necessary evil.  
     - *Breaks if:* Time runs out. Facilitator must decide: force a vote or declare deadlock.  

  6. **Formulate Recommendations (Final Session)**  
     - **Goal:** Proposals must include: (1) The revised problem, (2) How hypotheses were tested, (3) Anticipated consequences, (4) Unresolved doubts.  
     - **Action:**  
       - Draft: "We recommend [X] because [consequences], but we’re unsure about [Y]."  
       - Avoid: Vague consensus. Embrace "majority position + minority concerns."  

  ---

  ### **Case Applications**  
  **Key:** I’ll show where the protocol "breaks" Dewey and produces outcomes your team may dislike.  

  #### **Case 1: Participatory Budgeting ($1M for Library, Sports, or Drainage)**  
  - **Problem Framing:**  
    - Council’s question: "Which project should we fund?"  
    - **Deweyan Reframe:** "How can we address urgent gaps in community well-being—learning, youth safety, and climate resilience—with limited funds?"  
  - **Hypotheses:**  
    - Library: "If we fund a branch, more residents gain learning access, but maintenance costs may strain future budgets."  
    - Sports: "If we expand programs, youth crime drops, but it may not reach marginalized teens."  
    - Drainage: "If we improve drainage, flood damage decreases, but it’s invisible until crisis."  
  - **Evidence Feeding:**  
    - Present data on literacy rates, crime stats, and flood risks—but frame as: "How does this data help us test our hypotheses?"  
    - *Incommensurable evidence?* Have groups rank consequences by urgency: "Is preventing floods more critical than reducing crime? Why?"  
  - **Testing Consequences:**  
    - Group realizes drainage prevents financial loss (evidence: cost of flood repairs) but library/sports build social capital (evidence: community surveys).  
    - **Revision:** Hypothesis emerges: "Fund drainage but use library/schools as temporary youth hubs."  
  - **Decision Point:**  
    - Group agrees on consequences but values clash (economic loss vs. social good).  
    - **Protocol forces extension:** Small groups draft "trade-off statements" for the council: "We prioritized drainage because floods displace families, but we urge a future assembly for youth programs."  
    - **Outcome your team won’t like:** The recommendation is incomplete ("fund drainage + study youth options"). It demands **more time** and pressures the council to reopen the process.  
  - *Where Dewey Breaks:* Incommensurable values (economic vs. social goods) can’t be "tested" empirically. The protocol papers over this by prioritizing "urgency," but Dewey saw value conflicts as central to inquiry—your assembly lacks time for this.  

  #### **Case 2: Citizens' Assembly on Rent Stabilization (Polarized, Contested Experts)**  
  - **Problem Framing:**  
    - Council’s question: "Should we adopt rent stabilization?"  
    - **Deweyan Reframe:** "How can we protect renters from displacement without reducing housing quality or supply?"  
  - **Hypotheses:**  
    - Rent control: "If we cap rents, current renters stay, but landlords may cut maintenance."  
    - Alternative: "If we subsidize landlords, affordability improves, but public funds strain."  
  - **Evidence Feeding:**  
    - Experts debate: Economist A (rent control causes shortages) vs. Advocate B (controls prevent homelessness).  
    - **Facilitator action:** "What experiment could test this? What data would change your mind?"  
    - Group questions assumptions: "What if shortages only happen in tight markets? What if we exempt new buildings?"  
  - **Testing Consequences:**  
    - Small groups role-play: "You’re a landlord—how do you react?" "You’re a renter—what risks remain?"  
    - **Consequence:** Group agrees stabilization helps current renters but may worsen long-term supply.  
    - **Polarization surfaces:** Pro-rent group fears displacement; anti-rent group fears economic decline.  
  - **Decision Point:**  
    - **Protocol forces extension:** Group deadlocks on long-term consequences. Facilitator asks: "What shared goal can we agree on?" (Answer: "No one should be homeless").  
    - **Revised hypothesis:** "Pilot rent stabilization for 2 years with data tracking, paired with incentives for new housing."  
    - **Outcome your team won’t like:** The recommendation **reopens the council’s question**. Instead of yes/no, it demands a pilot + monitoring—a complex outcome that may frustrate the council. Worse, polarized members may dissent: "This kicks the can."  
  - *Where Dewey Breaks:* Dewey assumed a "community of inquiry" willing to revise beliefs. In polarization, the protocol uses "shared goals" to paper over distrust—but if participants view opponents as enemies (not collaborators), inquiry fails.  

  ---

  ### **Where the Protocol Breaks Dewey’s Ideals**  
  1. **Time vs. Open-Ended Inquiry:** Dewey saw inquiry as iterative and continuous. Your 3-weekend structure forces premature "settlements," especially for complex issues (e.g., rent control). The protocol masks this with "consequence testing," but it’s a band-aid.  
  2. **Power Imbalances:** Dewey assumed equal participation, but marginalized voices may be drowned out. The protocol’s "small groups" help but can’t fix structural inequities.  
  3. **Contested Expertise:** Dewey valued experts as co-inquirers, but in practice (e.g., rent control), experts often debate, not collaborate. The protocol forces groups to interrogate evidence but can’t resolve deep disagreements.  
  4. **Facilitator Judgment:** Dewey didn’t prescribe facilitation. Critical judgment calls here:  
     - When to reframe the problem (risks overstepping council’s mandate).  
     - When to force a vote despite uncertainty (risks incoherent outcomes).  

  ### **Is This Misguided?**  
  **Yes, but usefully so.** Dewey’s experimentalism is a *regulative ideal*—it guides practice but can’t be reduced to a checklist without losing its adaptive spirit. This protocol is a **pragmatic compromise**: it embeds Dewey’s core tenets (problem-first, hypothesis-testing, fallibility) into your real-world constraints. It will sometimes produce "messy" outcomes (extensions, reopened questions), but that’s Deweyan honesty: inquiry reveals complexity. If you use this, **train facilitators to:**  
  - Explain Dewey’s "experimental" ethos to participants upfront.  
  - Flag when the process is diverging from ideals (e.g., "We’re voting due to time, but ideally we’d test further").  
  - Document unresolved doubts for the council.  

  **Final Advice:** Pair this with a "Deweyan evaluation" post-assembly: "Did recommendations emerge from collective testing? If not, why?" This maintains the experimental spirit.
