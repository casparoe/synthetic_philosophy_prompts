prompt: |-
  I'm running a reading group on free will and moral responsibility for a dozen philosophy graduate students who work mostly in other areas — ethics, language, and mind — and have at most a passing acquaintance with the free will debate. The group is split between people who think compatibilism is obviously right and people who think it is obviously a cheat, which makes every session a little tense, but in a productive way. We have been meeting fortnightly for a term, and our next meeting is on Strawson's reactive attitudes. Everyone will have read the essay beforehand.

  My job in the ninety-minute session is not to summarize it but to make the architecture of the argument visible enough that they can see what work each piece is doing and why the essay has had the staying power it has. Don't explain the position to me; plan how I should structure the session. What idea has to be in place before the phrase reactive attitudes can mean anything more than emotional responses to other people's behavior? I suspect the crucial precursor is the distinction between the participant stance and the objective stance, and that the reactive attitudes are defined by their place within the participant stance — but I am not sure whether I should introduce the objective stance first, or let it emerge from the reactive attitudes themselves. What one example should carry the session (the person who steps on your hand, the colleague who forgets your name, the long-time partner who breaks a promise), and what must that example have and lack so that it draws the line between excusing and exempting conditions without collapsing them? What misconceptions should I expect — for instance, that the reactive attitudes are just emotions, or that Strawson's argument licenses a kind of quietism about the free will problem, or that the objective stance is reserved for the pathologically impaired — and at exactly which point in the sequence should I head each one off? What should I openly refuse to explain at this level (the later compatibilist literature that builds on it, the empirical psychology of blame, the question of whether the reactive attitudes justify retributive punishment), and where does the plan become misleading if I leave that out without saying so? Finally, give me one question I can ask at the end that would show whether they understand why the essay is called Freedom and Resentment rather than Freedom and Determinism — not whether they can recite the argument, but whether they see what the choice of title signals about the kind of argument it is.
reasoning: |-
  Okay, the user is running a reading group for philosophy grad students on free will, specifically focusing on Strawson's "Freedom and Resentment." The group has a split between compatibilists and those who see it as a cheat, which creates productive tension. The user needs to structure a 90-minute session to reveal the architecture of Strawson's argument without summarizing it. They have several specific questions about how to approach this.

  First, I need to recall Strawson's main points. His essay shifts the debate from metaphysical questions about determinism to the role of reactive attitudes in human relationships. The key elements are the participant stance, objective stance, reactive attitudes, and the distinction between excusing and exempting conditions.

  The user wonders whether to introduce the objective stance first or let it emerge from reactive attitudes. Starting with reactive attitudes might be better because they're concrete. Students can relate to emotions like resentment. Then, contrasting this with the objective stance shows how they're opposed. This progression feels natural.

  For the core example, the user mentions options like stepping on a hand or a broken promise. The broken promise scenario is rich. It involves a long-term partner, which adds relational depth. It allows exploring both excusing conditions (distraction) and exempting ones (depression). This distinction is crucial for Strawson's argument, showing when reactive attitudes are inappropriate without denying responsibility entirely.

  Misconceptions are a big concern. Students might think reactive attitudes are just emotions. But they're more than that; they're interconnected with practices like holding others responsible. Also, some might see Strawson as a quietist, but his point is that our practices are resilient to metaphysical worries. The objective stance isn't only for pathology; it's a tool we use in various contexts. These points need addressing when introducing each concept to prevent misunderstandings.

  The user also asks what to avoid. Bringing in later compatibilist literature or empirical psychology could derail the focus on Strawson's structure. The essay's strength is its foundational approach, so staying within its scope is key. But it's important to mention that Strawson sets the stage for those discussions without diving in.

  Finally, the question about the title "Freedom and Resentment" versus "Freedom and Determinism." This highlights Strawson's shift from traditional debates. If students grasp that the essay is about our practices and attitudes rather than determinism's truth, they understand his contribution. Ending with this question tests their comprehension of the essay's core innovation.

  Putting it all together: Start with the broken promise example to elicit reactive attitudes. Define them within the participant stance. Contrast with the objective stance. Use the example to distinguish excuses from exemptions. Address misconceptions as they arise. Avoid tangents but note their existence. End by connecting the title to the argument's focus on human practices over metaphysics.
answer: |-
  Here’s a structured 90-minute session plan targeting your goals, grounded in Strawson’s argumentative architecture and designed to preempt common pitfalls:

  ---

  ### **Session Structure: Making Strawson’s Architecture Visible**
  **Core Goal:** Reveal how reactive attitudes *constitute* moral responsibility within the participant stance, rendering determinism irrelevant to our practices.

  #### **Phase 1: Anchor in Phenomenology (15 mins)**  
  - **Start with your key example: The broken promise by a long-term partner.**  
    - *Why this works*: It’s relational (high stakes), personal (triggers resentment/betrayal), and flexible (allows exploration of excuses/exemptions).  
    - *Ask*: "What is your *immediate response* to this betrayal? Not what you *should* feel, but what you *do* feel." List responses (resentment, indignation, hurt).  
    - **Crucial move**: Frame these as *natural*, *interpersonal* reactions—not just "emotions" but **demands for recognition** (e.g., "They owed me better").  

  #### **Phase 2: Participant Stance as the Foundation (20 mins)**  
  - **Introduce the participant stance FIRST** (before objective stance).  
    - *Define*: The default framework of human relationships where we hold others accountable *through* reactive attitudes (resentment, gratitude, forgiveness).  
    - *Connect to example*: Your resentment isn’t random—it reflects an expectation of goodwill intrinsic to your relationship.  
    - **Head off misconception**: Reactive attitudes ≠ "just emotions." *Emphasize*: They are **interpersonal practices** embedding norms (e.g., resentment asserts a moral claim).  

  #### **Phase 3: Excusing vs. Exempting Conditions via the Example (20 mins)**  
  - **Modify the example to draw the distinction**:  
    - *Excusing condition*: Partner forgot due to a distraction (e.g., emergency call). Resentment *dissolves*—they showed "good will" but failed contingently.  
    - *Exempting condition*: Partner is severely depressed (incapable of reciprocal regard). Resentment *suspended*—they’re not a fitting target for moral demands.  
    - *Key contrast*: Excuses address *acts* within the participant stance; exemptions remove agents *from* that stance.  

  #### **Phase 4: Objective Stance as Contrast (15 mins)**  
  - **Introduce objective stance reactively**: "When *don’t* we resent?"  
    - *Define*: Viewing others as objects to be managed (e.g., therapist viewing depressed partner). Reactive attitudes are suspended.  
    - **Head off misconceptions**:  
      - Not just for "pathology": Use examples like tired parents managing a tantrum or diplomats negotiating with a dictator.  
      - Not "better/worse": Stress it’s a *pragmatic shift*, not moral superiority.  
    - *Critical point*: We *temporarily* adopt this stance—total adoption would destroy relationships.  

  #### **Phase 5: Why Determinism is Irrelevant (10 mins)**  
  - **Pose the challenge**: "If determinism is true, aren’t all exempting conditions in play? Shouldn’t we adopt the objective stance universally?"  
    - *Strawson’s reply*: Our commitment to the participant stance is **inescapable** for beings like us. Determinism doesn’t introduce *new* exempting conditions (e.g., ordinary causation ≠ incapacity for relationship).  
    - **Head off quietism**: This isn’t ignoring determinism—it’s showing why it *can’t* touch our responsibility practices.  

  #### **Phase 6: Title Significance & Legacy (10 mins)**  
  - **Final Question**:  
    > *"Why is the essay titled ‘Freedom and Resentment’ rather than ‘Freedom and Determinism’? What does this signal about Strawson’s strategy for defending compatibilism?"*  
    - *Target insight*: The title reveals his shift from **metaphysical debates** to **anthropology of moral practices**. Resentment isn’t a symptom—it’s the *locus* of responsibility.  
    - *Staying power*: He makes responsibility *visible* in our lived experience, bypassing unanswerable questions.  

  ---

  ### **What to Deliberately Exclude (and Why)**  
  - **Later compatibilist literature** (e.g., Fischer, Wallace): This session is about Strawson’s core argument. Mentioning extensions distracts from his structure.  
  - **Psychology of blame**: Strawson’s project is conceptual, not empirical. Note this if raised, but don’t engage.  
  - **Retributive punishment**: A valid extension, but Strawson’s focus is on *attitudes*, not institutions. Say: "This is downstream of his argument."  

  ### **Critical Warnings if Omitted**  
  - **Do not skip**: The **participant stance as constitutive**. If reduced to "emotions+," the argument collapses into psychology.  
  - **Stress**: The objective stance isn’t *wrong*—it’s **contextually appropriate**. Omitting this risks misreading Strawson as dismissing science.  

  ---

  ### **Why This Flow Works**  
  1. **Builds from concrete experience** (resentment) to abstract framework (participant stance).  
  2. **Uses the broken promise example as an argument engine**: It naturally generates excuses/exemptions, stances, and determinism’s irrelevance.  
  3. **Preempts misconceptions at point of relevance** (e.g., "emotions" when defining reactive attitudes).  
  4. **Title question tests deep understanding**: If they see that "Resentment" centers the *human practice* of responsibility, they grasp Strawson’s revolution.  

  This plan keeps tension productive by forcing both sides to engage the *structure*—compatibilists see responsibility grounded in practice; skeptics see why "cheat" accusations miss Strawson’s target.
