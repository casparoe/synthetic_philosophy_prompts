  We are going to design a decision procedure that helps determine whether a utilitarian approach (minimize expected harm) or a deontological approach (follow strict rules) should be applied in a given drone decision scenario. The procedure will be structured as a flowchart or a set of questions. We'll identify key features of the situation that can flip the switch.

  Key features we might consider:
  - **Certainty of outcomes**: How confident are we in the sensor data and the predicted outcomes?
  - **Presence of clear rules**: Are there existing laws, regulations, or company policies that dictate a specific action?
  - **Potential for catastrophic harm**: Are we considering actions that could lead to irreversible harm (e.g., loss of life) even with low probability?
  - **Time pressure**: How much time does the drone have to make the decision?
  - **Reversibility of action**: Can the action be undone? Are the consequences reversible?
  - **Intentionality**: Does the action involve intentionally causing harm, or is harm a side effect?
  - **Value of the cargo**: Is the cargo critical (e.g., life-saving medication) and does its delivery affect the decision?
  - **Responsibility and accountability**: Can we clearly assign responsibility for the outcome? Would the action violate a duty?

  We will design a decision tree with the following steps:

  1. **Check for immediate safety-critical rules (deontological guardrails)**:
     - Are there any hard-coded rules (from laws, regulations, or company policy) that absolutely forbid or require certain actions in this context? (e.g., "never deliberately steer toward a person", "never drop a package above a certain height over a public space")
     - If yes, follow the rule (deontological) and stop.
     - If no, proceed to next step.

  2. **Assess certainty of harm and outcomes**:
     - How certain are we about the outcomes of each available action? (High certainty: >90% confidence in sensor data and prediction models; Medium: 50-90%; Low: <50%)
     - If certainty is low, then we cannot rely on a utilitarian calculation because the expected harm calculation is too unreliable. Then we must default to a deontological rule (if available) or a harm-minimization rule that avoids intentional harm and chooses the least risky action by a rule-based approach (e.g., "in low certainty, always choose the option that minimizes the maximum possible harm" - a minimax strategy). But note: this might be a judgment call.
     - If certainty is medium or high, proceed to utilitarian analysis.

  3. **Utilitarian analysis**:
     - Calculate the expected harm for each available option. Harm can be quantified in a predefined unit (e.g., using a harm metric that accounts for property damage, injury, loss of life, and the value of the cargo if it is critical and time-sensitive).
     - Compare the expected harm of each option.
     - Is there a clear option with significantly lower expected harm? (Define a threshold for significance, e.g., at least 20% less harm than the next best option)
     - If yes, choose that option (utilitarian).
     - If no, then we have a close call and we must default to a deontological rule (if available) or a tie-breaking rule (e.g., "choose the option that does not involve intentional harm", or "choose the option that preserves the cargo if it is life-critical").

