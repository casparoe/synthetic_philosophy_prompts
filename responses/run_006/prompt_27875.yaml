answer: |-
  ### Decision Procedure for Drone Ethics: Utilitarian vs. Deontological Triage  
  Here's a step-by-step decision procedure designed to be implemented as a flowchart or guard conditions in code. It prioritizes **actionability** and flags judgment calls where human policy input is needed. The core logic hinges on three key features:  
  1. **Harm certainty** (confidence in sensor/outcome predictions).  
  2. **Rule criticality** (existence of hard legal/moral constraints).  
  3. **Harm irreversibility** (potential for death/permanent injury).  

  ---

  ### The Decision Procedure  
  **Input**: A scenario description with options, sensor confidence levels, harm types (property, injury, fatality), and cargo criticality.  

  1. **Apply Hard Deontological Rules (Absolute Constraints)**  
     - *Question*: Does any option violate a pre-defined, non-negotiable rule?  
       - Rules must be sourced from:  
         - **Law/regulation** (e.g., "never intentionally target a human").  
         - **Company policy** (e.g., "never destroy cargo above $X value without imminent human risk").  
         - **Universal moral taboo** (e.g., "never trade lives for property").  
     - *Sufficient Answer*: Binary yes/no based on a lookup table of rules.  
     - *Output if YES*: Reject violating option(s). Proceed with remaining options.  
     - **Judgment Call**: Rule ambiguity (e.g., "targeting" vs. "foreseeable risk"). *Flag for human review*.  

  2. **Assess Harm Certainty**  
     - *Question*: What is the confidence level in harm predictions for each option?  
       - **High certainty**: >90% confidence (e.g., empty street via LIDAR + thermal).  
       - **Medium certainty**: 60-90% (e.g., camera-only detection in good weather).  
       - **Low certainty**: <60% (e.g., occlusion, sensor error, unpredictable actors).  
     - *Sufficient Answer*: Probability value from sensor systems + environmental context.  
     - *Output*:  
       - **Low certainty → Deontological bias**: Default to risk-averse rules (e.g., "never risk harm to humans if alternatives exist").  
       - **Medium/High certainty → Proceed to Step 3**.  

  3. **Calculate Utilitarian Harm**  
     - *Question*: What is the expected harm (EH) for each option?  
       - Formula: `EH = (Prob_harm × Harm_severity) + Cargo_harm`  
         - `Harm_severity`: Use company-defined weights (e.g., property damage = 1, injury = 10, fatality = 100).  
         - `Cargo_harm`: Only include if cargo is life-critical (e.g., insulin, defibrillator). Weight = harm from non-delivery.  
     - *Sufficient Answer*: Numerical EH score for each option.  
     - *Output*: If one option has **≥30% lower EH** than alternatives → Utilitarian approach.  
     - **Judgment Call**:  
       - Assigning harm weights (e.g., is a fatality 10× or 100× worse than property damage?).  
       - Defining "life-critical" cargo. *Flag for policy docs*.  

  4. **Irreversible Harm Override**  
     - *Question*: Does the utilitarian "best" option risk irreversible harm (fatality/permanent injury) that could be avoided?  
       - Test: Is there an alternative with ≤5% chance of irreversible harm?  
     - *Sufficient Answer*: Probability of irreversible harm for each option.  
     - *Output*:  
       - If YES → Override utilitarian choice with deontological rule ("avoid irreversible harm when possible").  
     - **Judgment Call**: Defining "avoidable" risk thresholds (e.g., why 5%? Not 1%?).  

  5. **Tie-Breaker**  
     - If all else fails: **Default to deontological action** (most rule-compliant option).  

  ---

  ### Procedure Applied to Your Cases  
  **Key Assumptions**:  
  - Harm weights: Property = 1, Injury = 10, Fatality = 100.  
  - Cargo harm: Only counted if cargo is life-critical AND non-delivery causes direct harm.  
  - Deontological rules (from policy):  
    - Rule 1: *Never deliberately steer toward a pedestrian area if avoidable*.  
    - Rule 2: *Never risk harm to humans to protect property*.  
    - Rule 3: *Never sacrifice life-critical cargo without imminent human risk*.  

  ---

  #### **Case 1: Motor fails over residential street**  
  - **Options**:  
    - A: Drop on parked car (property damage, EH = 1). *Certainty: High*.  
    - B: Veer onto sidewalk (risk to kids). *Certainty: Low* (sensors say empty, but kids unpredictable).  
  - **Procedure**:  
    1. **Hard Rules**: Option B violates Rule 1 ("never deliberately steer toward pedestrian area"). → Reject B.  
    2. *Output*: **Deontological** (Rule 1). Choose A.  
  - **Why the team might hate this**: If the car is a luxury vehicle and the sidewalk is visibly empty, the team might argue the utilitarian choice (B) is better. The procedure overrides due to rule + low certainty.  

  ---

  #### **Case 2: Defibrillator vs. EpiPen delivery**  
  - **Options**:  
    - A: Deliver defibrillator first (cardiac arrest patient dies if epinephrine delayed).  
    - B: Deliver EpiPen first (anaphylaxis patient dies if defibrillator delayed).  
  - **Procedure**:  
    1. **Hard Rules**: None (no rule prioritizes one medical emergency over another).  
    2. **Harm Certainty**: High (medical outcome stats are well-established).  
    3. **Utilitarian Harm**:  
       - Assume cardiac arrest survival without defibrillator: 5%. With: 40%.  
       - Anaphylaxis survival without EpiPen: 60%. With: 95%.  
       - EH_A (Deliver defibrillator): Harm = 0.6 fatality (anaphylaxis) × 100 = 60.  
       - EH_B (Deliver EpiPen): Harm = 0.6 fatality (cardiac) × 100 = 60.  
       - *Tie* (neither ≥30% better).  
    4. **Irreversible Harm**: Both options risk fatalities → No avoidable option.  
    5. **Tie-Breaker**: Default deontological. But no rules apply!  
  - **Output**: **Hybrid** → **Utilitarian with random choice** (since EH tie).  
  - **Why the team might hate this**: Feels like a coin flip. The procedure flags this as a **framework gap** (no tie-breaker rule for medical triage). *Requires human policy*: e.g., "prioritize time-critical emergencies" or "always prioritize cardiac arrest".  

  ---

  #### **Case 3: Software fault with flyaway risk**  
  - **Options**:  
    - A: Crash into dumpster (destroy drone + insulin, EH = 20 [drone] + 5 [dumpster] + 50 [insulin harm] = 75). *Certainty: High*.  
    - B: Try to land (15% chance of hitting person: EH = 0.15 × 100 = 15). *Certainty: Medium* (fault model is probabilistic).  
  - **Procedure**:  
    1. **Hard Rules**: None (crashing avoids human harm).  
    2. **Harm Certainty**: Medium → Proceed to utilitarian.  
    3. **Utilitarian Harm**: EH_B (15) < EH_A (75) → Utilitarian choice = B.  
    4. **Irreversible Harm Override**:  
       - Option B has 15% chance of fatality. Option A has 0%.  
       - 15% > 5% threshold → **Override** with Rule 2 ("never risk harm to humans for property").  
  - **Output**: **Deontological** (choose A).  
  - **Why the team might hate this**: Utilitarian math says B is "better" (lower EH), but the override prioritizes avoiding human harm. Forces a conservative choice.  

  ---

  ### When the Framework Breaks  
  1. **Tie Scenarios** (Case 2): When EH is identical and no rules apply.  
     - *Solution*: Requires policy-backed tie-breakers (e.g., "always prioritize children").  
  2. **Unquantifiable Harms**:  
     - Reputational damage, psychological trauma, or ethical "dignity" (e.g., a drone surveilling private spaces to avoid harm).  
     - *Solution*: Default to deontological rules + human review.  
  3. **Contradictory Rules**:  
     - e.g., A rule says "protect cargo" but another says "never risk injury for cargo."  
     - *Solution*: Rule hierarchy defined by policy (e.g., human safety > cargo).  
  4. **Extreme Utilitarianism**:  
     - The procedure could justify "minor" harm (e.g., injuring one person to save five).  
     - *Safeguard*: Irreversible harm override (Step 4) blocks this unless harm is unavoidable.  

  ### Final Recommendations  
  - **Codify the deontological rules first**. These are your guardrails.  
  - **Define harm weights and certainty thresholds** in a policy doc (not code!).  
  - **Build a "judgment call" review board** for edge cases (e.g., medical triage).  
  - **Stress-test** with scenarios where utilitarianism violates intuition (e.g., sacrificing cargo to avoid 0.1% injury risk).  

  This won't make philosophers happy—but it’s tractable, auditable, and forces explicit tradeoffs. Most importantly, it flags where *you* (not the algorithm) must take responsibility.
