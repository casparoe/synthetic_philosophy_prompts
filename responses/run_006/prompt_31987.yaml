prompt: |-
  I'm about to read a load of stuff on the units of selection debate and I want to go in with a proper spec rather than the usual genic-vs-group framing. Before I read any more of it, write me the desiderata: what would an adequate theory of the units of selection actually have to get right? Give the case or consideration behind each one, and be clear about which are non-negotiable and which are just preferences of one camp.

  Make sure the list grapples with at least these, but don't let it become a list of textbook talking points:

  - the distinction between replicators and vehicles/interactors, and why a theory can't get away with conflating them
  - what a group-level trait actually is, and when you're entitled to say group selection is doing causal work rather than just redescribing individual or genic selection (the by-product worry)
  - the empirical cases people actually fight over: altruism and eusociality, sex ratio evolution, meiotic drive and transposable elements, cancer as a within-organism selection process, species selection in the fossil record, cultural evolution
  - whether the theory has to be consistent with the Price equation, and what "consistent with" even means there (its a partition, not an empirical claim, right?)
  - the major transitions problem: why selection at a lower level doesn't just undermine higher-level individuality (cheating in multicellular bodies, uniparental inheritance, germline sequestration)
  - whether a theory of units of selection is answering a causal question, a bookkeeping question, or a "who are the beneficiaries of adaptation" question, and whether one theory has to answer all three

  For each desideratum, say whether it's non-negotiable or a camp preference, and flag any pairs you suspect can't be jointly satisfied. If some subset of them is jointly unsatisfiable, say so explicitly, that's the bit I most want. Then tell me which single requirement does the most to rule out the most popular positions. I don't need a full scorecard, but a quick sense of how genic selectionism, multilevel selection (MLS1 and MLS2), and the replicator/interactor framework fare against the list would help.

  Also: for each requirement, say how confident you are that it's genuinely a requirement and not just a prejudice of one side, and single out the one you're least sure about. And if there's a place where the literature is just talking past itself, say so.
