prompt: |-
  I run the policy shop at a small nonprofit that builds short-term coalitions between groups that normally won't be in the same room — an animal-welfare group and a hunters' group, a religious-traditionalist group and a secular civil-liberties group, that kind of pairing. We get maybe one of these a month, and the stakes are high: coalitions fall apart, board members resign, the local paper writes about us. My staff are organizers, not philosophers, and the executive director wants a written procedure she can sign off on, not a seminar.

  Lately I've been reading about this idea called moral trade — the thought that two groups with very different moral views can each come out ahead by their own lights if they trade concessions: each gives ground on something it sees as relatively unimportant in exchange for the other side giving ground on something it sees as much more important. Neither side is compromising its core values; they're just trading on the basis of different priorities. I find the idea compelling but I have no idea how to actually run it.

  Could you turn moral trade into a decision procedure I can use? I want a checklist my team can run on a proposal in a few hours: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person because the step is a value judgment rather than a fact. Please deal with the hard cases: one side says an issue is an absolute and not up for trade; the two sides cant agree on any common scale; a trade helps both sides but harms a third party; one side's views are bad enough that dealing with them at all feels like legitimizing them; and both sides claim to care more about the same thing so there's no obvious swap. Then run the procedure on two or three worked examples, and make at least one of them a case where the procedure tells me not to do a trade I'd otherwise be tempted to make.
reasoning: |-
  We are going to design a decision procedure for moral trade. The goal is to have a step-by-step checklist that can be applied to a proposed coalition or agreement. The procedure should help determine whether a moral trade is feasible and advisable. We'll break it down into steps, each with specific questions and criteria for passing. We'll also address the hard cases as termination conditions or decision points.

  **Decision Procedure for Moral Trade**

  **Objective**: To evaluate a proposed agreement (or set of trade-offs) between two groups with differing moral views, to see if it constitutes a moral trade that is acceptable and beneficial by each group's own standards, without compromising core values.

  **Precondition**: We have two groups (Group A and Group B) and a proposed set of actions or concessions by each. The procedure assumes that the groups are at the table and have expressed a willingness to consider a deal.

  **Procedure Steps**:

  1. **Identify the Proposed Trade**:
     - Question: What exactly is each group proposing to give (concession) and what is each proposing to get (gain) in the deal?
     - Required: A clear, written list of concessions and gains for both sides. Each concession and gain must be a specific, actionable item.
     - Pass: The proposal is clear and specific enough to evaluate.
     - Fail: If the proposal is too vague or incomplete. Stop and ask for clarification.

  2. **Check for Absolute Constraints**:
     - Question: For each concession being asked of a group, does that concession violate an absolute (non-negotiable) moral principle of that group?
     - How to check: Ask each group: "Is there any part of what you are being asked to concede that you consider absolutely forbidden, regardless of the benefits?" Also, ask: "Is there any concession the other group is making that you consider absolutely unacceptable for them to make (even if they are willing) because it violates a core principle you hold about what others should do?"
     - Pass: No absolute constraint is violated by the concessions being made by either side (from their own perspective and from the other group's perspective if applicable).
     - Fail: If any group identifies an absolute constraint that would be violated. Stop with a "No" and do not proceed. (Note: This step addresses the hard case where one side says an issue is absolute.)

  3. **Assess Relative Importance**:
     - Question: For each group, how important is the concession they are making (the cost) relative to the gain they are receiving? And how important is the concession the other group is making (which might be seen as a gain for the first group) relative to the gain they are receiving?
     - How to assess: Have each group separately assign a numerical weight (e.g., on a scale of 1 to 10) to:
          a) The importance of the concession they are making (cost).
          b) The importance of the gain they are receiving.
          c) (Optional but helpful) The importance of the concession the other group is making (if that concession is seen as a moral gain for the first group).
     - Pass Condition: For each group, the gain must be rated as more important than the cost they are incurring. That is, for Group A: `Importance(gain_A) > Importance(cost_A)`. Similarly for Group B: `Importance(gain_B) > Importance(cost_B)`.
     - Fail: If either group does not rate their gain as more important than their cost. Stop with a "No" and do not proceed.
     - Note: If groups cannot assign numbers, ask for a qualitative comparison: "Is the gain more important to you than the cost?" and require a "yes" from both groups. This step addresses the hard case of having no common scale because each group uses their own.

  4. **Check for Mutual Benefit**:
     - Question: Does the trade leave both groups better off by their own lights? (This is a restatement of step 3 but with an overall view.)
     - How to check: Based on the assessments in step 3, we have already established that each group values their gain more than their cost. Now, we also want to check if the overall trade is balanced in a way that both groups feel they are getting a good deal. We are not requiring that the gains are equal in any objective sense, but that each group subjectively feels the trade is beneficial.
     - Pass: Both groups state that the overall deal is acceptable and beneficial to them.
     - Fail: If either group feels the deal is not beneficial overall (even if step 3 passed, they might have other concerns). Stop with a "No". (This step is a sanity check and might catch issues that step 3 didn't, such as if the group feels the cost is too high relative to the gain when considering other factors.)

  5. **Third-Party Impact Assessment**:
     - Question: Are there significant negative impacts on third parties (individuals or groups not at the table) as a result of the trade?
     - How to check: Brainstorm and list potential negative effects on third parties. Then, evaluate:
          a) Severity: How severe are these negative impacts?
          b) Mitigation: Can these impacts be mitigated?
          c) Consent: Can the affected third parties be brought into the negotiation? (If feasible and appropriate.)
     - Pass Condition: 
          - If there are no significant negative third-party impacts, pass.
          - If there are negative impacts but they are minor and/or can be mitigated to an acceptable level, pass.
          - If the negative impacts are severe and cannot be mitigated, and the affected third parties are not represented and cannot be brought in, then this step fails.
     - Decision Point: If the negative impacts are severe but the groups are willing to adjust the deal to mitigate them, then go back to step 1 with a revised proposal. If the negative impacts are severe and cannot be mitigated, stop with a "No". (This step addresses the hard case of harm to a third party.)

  6. **Legitimacy and Reputational Risk**:
     - Question: Does making this trade lend legitimacy to a group or a view that is so harmful that it should not be legitimized? And what are the reputational risks to our nonprofit and the participating groups?
     - How to assess: This step requires a value judgment. Consider:
          a) The nature of the groups' views: Are any of the views being expressed or actions being taken by either group so egregious (e.g., advocating violence, hate, or severe rights violations) that we should not be seen as facilitating?
          b) The message sent: Could the trade be misinterpreted as endorsing harmful views?
          c) Reputational harm: Could this trade damage the reputation of our nonprofit or the coalition partners?
     - Pass Condition: The trade does not legitimize views that are beyond the pale (as determined by our organization's values and the broader societal context). Also, the reputational risks are acceptable to the nonprofit and the groups involved.
     - Fail: If the trade would legitimize a group or view that we deem unacceptable, or if the reputational risks are too high. Stop with a "No".
     - Note: This step is a value judgment. The procedure must hand this decision to a person (or the executive director) because it involves ethical and strategic considerations beyond the immediate groups. (This step addresses the hard case of legitimizing bad views.)

  7. **Conflict on Shared Values**:
     - Question: Do both groups claim to care about the same thing (e.g., "the environment", "human dignity") but in a way that leads to conflict (e.g., they both want to control the same resource or they have incompatible interpretations)? If so, can we reframe the trade to avoid direct conflict on that shared value?
     - How to check: Identify any shared values that are central to the conflict. Then, see if the trade can be structured so that each group is conceding on a different issue (not the shared value) or if the trade can be broken into parts that don't directly conflict on the shared value.
     - Pass Condition: The trade does not require either group to concede on the shared value in a way that causes internal conflict. Alternatively, if the trade can be reframed so that each group is making a concession that doesn't directly undermine the shared value but instead addresses a secondary issue, then pass.
     - Fail: If the trade forces a direct confrontation on the shared value and neither group is willing to back down, then stop with a "No". (This step addresses the hard case of both sides claiming to care more about the same thing.)

  **Termination**:
  - If any step fails (with a "No"), the procedure stops and the trade is rejected in its current form.
  - If all steps pass, the trade is approved as a moral trade and the coalition can proceed.

  **Procedure Output**:
  - Go: Proceed with the trade.
  - No-go: Do not proceed (with reasons).
  - Revise: The proposal can be revised and resubmitted (if the failure is at a step that can be addressed by revision, such as step 5).

  **Worked Examples**:

  **Example 1: Animal Welfare Group (A) and Hunters' Group (B)**
  - **Proposal**: 
      - Group A (Animal Welfare) will support the hunters' group in opposing the development of a wilderness area into a shopping mall (which would destroy habitat and hunting grounds). 
      - Group B (Hunters) will support the animal welfare group's proposal for a ban on hunting a particular endangered species in that area.

  - **Step 1**: The trade is clear: A gets B's support on the endangered species ban; B gets A's support in opposing the mall.

  - **Step 2**: 
      - Group A: They are conceding by supporting a group that hunts (which they normally oppose) but note they are not being asked to endorse hunting. They do not consider this concession absolutely forbidden because the primary goal is habitat protection and saving an endangered species, which they value more than opposing hunting in general in this context. Also, they are not being asked to allow hunting of the endangered species.
      - Group B: They are conceding by supporting a ban on hunting one species. They might normally oppose such bans, but they see the mall development as a bigger threat to their hunting rights and all wildlife. They do not consider the ban on one species an absolute constraint because they can still hunt other species.
      - Pass.

  - **Step 3**:
      - Group A: 
          - Cost: Supporting the hunters' group (rate 4) 
          - Gain: Ban on hunting the endangered species (rate 9) -> 9>4, so OK.
      - Group B:
          - Cost: Supporting the ban on hunting the endangered species (rate 5)
          - Gain: Support against the mall development (rate 10) -> 10>5, so OK.
      - Pass.

  - **Step 4**: Both groups feel the trade is beneficial overall.

  - **Step 5**: Third-party impact: The mall developer and potential employees might be affected. However, the groups argue that the environmental and recreational value of the wilderness area is more important. The impact on the developer is not severe enough to block the trade? (This might be borderline, but in this context, we'll assume it passes.)

  - **Step 6**: Legitimacy: The animal welfare group might worry about legitimizing hunting. However, the trade is focused on land conservation and species protection, not an endorsement of hunting. The nonprofit decides the reputational risk is acceptable because the cause (saving the wilderness) is a shared goal. Pass.

  - **Step 7**: Shared value: Both groups care about the wilderness. They are not trading on the wilderness itself but on two different actions that both protect the wilderness. The trade does not force a conflict on the shared value. Pass.

  - **Result**: Go.

  **Example 2: Religious-Traditionalist Group (A) and Secular Civil-Liberties Group (B)**
  - **Proposal**:
      - Group A will support Group B's campaign for prison reform (which they see as a humanitarian issue) in exchange for Group B backing a bill that allows religious organizations to opt out of providing certain services (e.g., abortion referrals) based on religious objections.

  - **Step 1**: Clear: A gets B's support on the religious exemption bill; B gets A's support on prison reform.

  - **Step 2**:
      - Group A: They are being asked to support prison reform, which they don't typically prioritize but don't see as against their values. They are not being asked to compromise on their religious beliefs. The concession they are making (supporting prison reform) is not absolutely forbidden.
      - Group B: They are being asked to support a religious exemption that they believe might lead to discrimination. They see this as potentially violating their core principle of equal access to services. They might say that supporting any religious exemption that limits access to services is absolutely forbidden? (This is the hard case.)

          - If Group B states that supporting any religious exemption that affects access to services is an absolute constraint, then step 2 fails. Stop with a "No".

  - **Result**: No-go. Even if the trade might otherwise be beneficial, the absolute constraint is violated.

  **Example 3: Environmental Group (A) and Local Business Group (B)**
  - **Proposal**:
      - Group A (Environmental) will support the business group's request for tax breaks for local businesses in the downtown area.
      - Group B (Business) will support the environmental group's campaign for a new recycling program that businesses must participate in.

  - **Step 1**: Clear.

  - **Step 2**:
      - Group A: They are not being asked to compromise on an absolute. They might not like tax breaks for businesses but don't see it as an absolute.
      - Group B: They are not being asked to compromise on an absolute. They might see the recycling program as an added cost but not absolutely forbidden.
      - Pass.

  - **Step 3**:
      - Group A: 
          - Cost: Supporting tax breaks (rate 3) 
          - Gain: Recycling program (rate 8) -> 8>3, pass.
      - Group B:
          - Cost: Supporting the recycling program (rate 6) 
          - Gain: Tax breaks (rate 7) -> 7>6, pass.

  - **Step 4**: Both feel they come out ahead.

  - **Step 5**: Third-party impact: The tax breaks might reduce public funds for other services (e.g., schools). The recycling program might impose costs on all businesses, including small ones that are not part of the business group. 
      - Severity: Moderate. 
      - Mitigation: The groups might adjust the proposal to target tax breaks to businesses that adopt green practices and phase in the recycling program. 
      - Revised proposal: 
          - Group A supports tax breaks only for businesses that meet certain environmental standards.
          - Group B supports a phased-in recycling program with financial assistance for small businesses.
      - After revision, the third-party impacts are mitigated. Pass.

  - **Step 6**: Legitimacy: No major concerns. Pass.

  - **Step 7**: Shared value: Both groups care about the community's well-being, but the trade doesn't directly conflict on that. Pass.

  - **Result**: Go after revision.

  **Example 4: Anti-Abortion Group (A) and Abortion-Rights Group (B)** [This is the case where we are tempted but the procedure says no]
  - **Proposal**:
      - Group A will support Group B's push for increased funding for prenatal care for low-income women.
      - Group B will support Group A's push for mandatory waiting periods for abortion.

  - **Step 1**: Clear.

  - **Step 2**:
      - Group A: They are being asked to support prenatal care, which they believe in anyway. Not an absolute constraint.
      - Group B: They are being asked to support mandatory waiting periods, which they view as a violation of women's rights and an undue burden. They might see this as an absolute constraint? (It depends on the group.) Let's assume Group B says: "We absolutely oppose any restriction that delays access to abortion." Then step 2 fails.

  - **Result**: No-go because of an absolute constraint.

  - **But note**: What if Group B doesn't see it as absolute? Then we proceed to step 3.

  - **Step 3**:
      - Group A: 
          - Cost: Supporting prenatal care (they might rate this as 2 because they already support it) 
          - Gain: Waiting periods (rate 10) -> 10>2, pass.
      - Group B:
          - Cost: Supporting waiting periods (rate 9) 
          - Gain: Increased funding for prenatal care (rate 8) -> 8>9? No, because 8 is less than 9. So step 3 fails.

  - **Result**: No-go because Group B does not value the gain more than the cost.

  - **Why we might be tempted**: Because both groups are getting something they want, but by Group B's own lights, the cost (waiting periods) is more important than the gain (prenatal care funding). They are worse off by their own standards. Hence, it is not a moral trade.

  **Conclusion**: The procedure provides a systematic way to evaluate moral trade proposals. It stops when a step fails, preventing bad trades, and requires revision when possible. It also highlights where human judgment is necessary (especially in step 6).
answer: |-
  ### Moral Trade Decision Procedure: Step-by-Step Checklist  
  This procedure transforms the concept of moral trade into a practical, time-bound (2-4 hour) evaluation for your team. It includes clear questions, pass/fail criteria, and handles hard cases. Steps 6 and 7 require human judgment; all others are fact-based. **If any step fails, reject the trade or revise the proposal.**  

  ---

  #### **Step 1: Define the Trade**  
  **Question:** What specific concessions are each group offering, and what specific gains are they receiving? List them in writing.  
  **Good Enough Answer:** Concessions and gains must be concrete, actionable, and verifiable (e.g., "Group A stops lobbying against Bill X" not "Group A becomes friendlier").  
  **Failure Condition:** Vague or unenforceable terms. **Stop → Revise or reject.**  
  **Hard Case Handling:** If one side’s concession is too ambiguous (e.g., "support our cause"), demand specifics.  

  #### **Step 2: Check for Absolutes**  
  **Question:** Does either group declare any part of their concession as non-negotiable or an absolute moral line?  
  **Good Enough Answer:** Both groups confirm in writing that no concession violates a core, unmovable principle (e.g., "We will never endorse violence").  
  **Failure Condition:** One side identifies an absolute. **Stop → Reject.**  
  **Hard Case Handling:** If an absolute is claimed (e.g., "abortion is always wrong, so we can’t trade on it"), respect it. Do not proceed.  

  #### **Step 3: Assess Relative Importance**  
  **Question:** For each group, rank the importance of their concession and gain on a scale of 1–10 (1 = trivial, 10 = critical).  
  **Good Enough Answer:**  
  - For Group A: Importance of **gain** > Importance of **concession**.  
  - For Group B: Importance of **gain** > Importance of **concession**.  
  **Failure Condition:** Either group values their concession more than their gain. **Stop → Reject.**  
  **Hard Case Handling:** If groups reject numerical scales, use pairwise comparisons: "Is your gain worth more to you than your concession?" Require "yes" from both.  

  #### **Step 4: Verify Mutual Benefit**  
  **Question:** Would both groups be better off by their own moral metrics after the trade?  
  **Good Enough Answer:** Each group states: "This trade advances our core mission more than it harms it."  
  **Failure Condition:** Either group cannot affirm this. **Stop → Reject.**  
  **Hard Case Handling:** If priorities shift mid-process (e.g., "we care more about X now"), return to Step 3.  

  #### **Step 5: Third-Party Harm Check**  
  **Question:** Could this trade harm an uninvolved third party? If yes, how severe is the harm?  
  **Good Enough Answer:**  
  - No significant harm to third parties, OR  
  - Harm is mild and mitigatable (e.g., compensating affected parties), OR  
  - Harm is outweighed by greater good (requires executive judgment).  
  **Failure Condition:** Severe, unmitigatable harm to a vulnerable group (e.g., "this deal excludes immigrant workers"). **Stop → Reject.**  
  **Hard Case Handling:** If harm exists, involve your legal/ethics team. Never proceed if harm is irreversible (e.g., loss of healthcare access).  

  #### **Step 6: Legitimacy Risk Assessment (Human Judgment Required)**  
  **Question:** Does this trade legitimize a group or view so harmful that it risks our integrity?  
  **Good Enough Answer:** Executive Director (ED) judges "no" after considering:  
  - Does the group promote violence, hatred, or human rights abuses?  
  - Would this trade normalize their harmful views?  
  - Can we publicly justify the trade neutrally (e.g., "pragmatic cooperation on issue Y")?  
  **Failure Condition:** ED concludes the trade legitimizes intolerable views. **Stop → Reject.**  
  **Hard Case Handling:** If views are odious but not illegal (e.g., a xenophobic group), ED may still reject to protect the nonprofit’s reputation.  

  #### **Step 7: Shared Value Conflict Resolution (Human Judgment Required)**  
  **Question:** If both groups claim to care most about the same thing (e.g., "children’s safety"), is the trade structured to avoid direct conflict on that value?  
  **Good Enough Answer:** ED judges "yes" if:  
  - The trade sidesteps the shared value (e.g., trading unrelated issues like funding and access rights), OR  
  - Gains/concessions are secondary to the shared value (e.g., both compromise on methods, not goals).  
  **Failure Condition:** Trade forces a zero-sum choice on the shared value (e.g., "who controls the school curriculum"). **Stop → Reject.**  
  **Hard Case Handling:** If conflict is unavoidable, abandon the trade—no swap is possible.  

  ---

  ### **Worked Examples**  
  #### **Example 1: Animal Welfare (A) vs. Hunters (B)**  
  **Proposal:**  
  - *A’s concession:* Stop opposing B’s deer culling program in Park X.  
  - *A’s gain:* B supports A’s campaign to ban lead ammunition statewide.  
  - *B’s concession:* Support lead ammo ban.  
  - *B’s gain:* A stops blocking deer culling in Park X.  

  **Procedure Check:**  
  1. **Step 1:** Pass. Terms are concrete.  
  2. **Step 2:** Pass. No absolutes (A opposes culling but doesn’t deem it "unforgivable").  
  3. **Step 3:** Pass.  
     - A: Culling concession = 4/10 (Park X is low-priority); lead ban gain = 9/10.  
     - B: Lead ban concession = 5/10 (costly but manageable); culling gain = 8/10 (solves overpopulation).  
  4. **Step 4:** Pass. Both state they’re better off.  
  5. **Step 5:** Pass. No major third-party harm (lead ban helps ecosystems).  
  6. **Step 6:** Pass. ED judges no legitimization of harm (hunting is legal; focus is environmental).  
  7. **Step 7:** Pass. Shared value: "wildlife health." Trade avoids conflict (A trades local culling for statewide ammo reform).  
  **Result:** ✅ **GO** — Moral trade valid.  

  #### **Example 2: Religious Conservatives (A) vs. LGBTQ+ Advocates (B)**  
  **Proposal:**  
  - *A’s concession:* Withdraw support for a bill banning gender-affirming care.  
  - *A’s gain:* B endorses A’s school prayer initiative.  
  - *B’s concession:* Support school prayer in District Y.  
  - *B’s gain:* A stops backing the gender-affirming care ban.  

  **Procedure Check:**  
  1. **Step 1:** Pass. Terms clear.  
  2. **Step 2:** **FAIL.** Group B declares: "Supporting school prayer legitimizes discrimination—absolute no."  
  **Result:** ❌ **STOP. REJECT.** Absolute constraint violated.  

  #### **Example 3: Environmentalists (A) vs. Oil Company (B) (Tempting but Flawed Trade)**  
  **Proposal:**  
  - *A’s concession:* Silence on B’s offshore drilling in Area Z.  
  - *A’s gain:* B funds $5M for urban solar farms.  
  - *B’s concession:* Fund solar farms.  
  - *B’s gain:* A stops protesting drilling in Area Z.  

  **Procedure Check:**  
  1. **Step 1:** Pass.  
  2. **Step 2:** Pass. No absolutes claimed.  
  3. **Step 3:** Pass.  
     - A: Drilling concession = 7/10; solar gain = 8/10.  
     - B: Solar concession = 6/10; drilling gain = 9/10.  
  4. **Step 4:** Pass. Both feel better off.  
  5. **Step 5:** **FAIL.** Severe harm: Drilling in Area Z threatens Indigenous fishing grounds. No mitigation possible.  
  **Result:** ❌ **STOP. REJECT.** Third-party harm is irreversible and unaddressed.  

  ---

  ### **Key Features**  
  - **Speed:** Completable in 2–4 hours with prepared documents.  
  - **Accountability:** Documents signed at each step (e.g., "Group A confirms no absolutes violated").  
  - **Safety Nets:**  
    - Steps 6–7 escalate to the ED.  
    - Step 5 requires third-party vetting.  
  - **Outputs:** GO (proceed), REJECT (stop), or REVISE (return to Step 1).  

  This procedure prevents harmful trades while enabling legitimate moral swaps. Customize weights/scales as needed, but never skip Step 5 (third-party harm)—it’s your ethical firewall.
