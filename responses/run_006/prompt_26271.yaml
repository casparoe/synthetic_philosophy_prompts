  I notice both make valid points but miss nuances. Hendricks is right that logically, "here is a hand" entails "external objects exist" if we grant hands are external. But Carroway correctly notes the skeptic doesn't deny this entailment - they deny we know the premise. This is crucial: Moore's argument isn't for the skeptic but against skepticism's theoretical demands. 

