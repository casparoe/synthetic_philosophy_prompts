answer: |-
  Here's a breakdown of both views in statistical modeling terms, a residue report on the translation, and an analysis of your key concern about truth-value gaps:

  ---

  ### **1. Epistemicism as a Statistical Model**
  - **Core Idea**: There exists a single, precise threshold value (e.g., 10,000 grains) where "heap" objectively begins, but this value is *epistemically inaccessible*.
  - **Model-Based Restatement**:  
    - Let \( \theta \) be the true cutoff parameter (number of grains defining "heap").  
    - We assume \( \theta \) is a fixed but *hidden* parameter in the data-generating process.  
    - Due to noisy/incomplete data (e.g., vague contextual factors, perceptual limitations), we can only estimate a *probability distribution* over possible values of \( \theta \).  
    - **Truth conditions**:  
      - "n grains is a heap" is **true** if \( n \geq \theta \), **false** otherwise.  
      - Borderline cases occur when our estimated \( P(n \geq \theta) \) is neither ≈0 nor ≈1 (high uncertainty).  

  ---

  ### **2. Supervaluationism as a Statistical Model**
  - **Core Idea**: "Heap" has no single cutoff. Instead, there is a set of *admissible precisifications* (e.g., 9,500–10,500 grains), and truth requires consensus across all precisifications.
  - **Model-Based Restatement**:  
    - Let \( \Theta = \{ \theta_1, \theta_2, \dots, \theta_k \} \) be a set of equally valid cutoff parameters (the "admissible precisifications").  
    - A sentence is **true** iff it holds for all \( \theta \in \Theta \).  
    - **False** iff it fails for all \( \theta \in \Theta \).  
    - **Neither true nor false** iff it holds for some \( \theta \in \Theta \) but not others.  
    - *Example*: For \( n = 10{,}000 \) and \( \Theta = [9{,}500, 10{,}500] \):  
      - "10,000 grains is a heap" is **true** (since \( n \geq \theta \) for all \( \theta \leq 10{,}000 \)).  
      - "9,999 grains is a heap" is **neither** (fails if \( \theta = 10{,}000 \), holds if \( \theta = 9{,}999 \)).  

  ---

  ### **Residue Report: Translation Challenges**
  | **Aspect**               | **Epistemicism**                                  | **Supervaluationism**                             | **Residue**                                                                 |
  |--------------------------|--------------------------------------------------|--------------------------------------------------|-----------------------------------------------------------------------------|
  | **Cutoff parameter**     | Single hidden \( \theta \)                       | Set \( \Theta \) of precisifications             | Clean. Both map to parameters in a model space.                             |
  | **Borderline cases**     | High uncertainty about \( \theta \)              | Truth-value gaps (lack of consensus in \( \Theta \)) | **Fudged**: Supervaluationism's "neither" isn't epistemic—it's *logical indeterminacy*. |
  | **Truth conditions**     | Binary (wrt hidden \( \theta \))                 | Ternary (true/false/indeterminate)               | **No counterpart**: Statistical models lack a native "indeterminate" truth value. |
  | **Metaphysical commitment** | \( \theta \) exists but is unknowable          | \( \Theta \) exhausts meaning; no "true" \( \theta \) | **Lost in translation**: Statistical models are agnostic about metaphysics. |

  ---

  ### **Your Key Concern: Truth-Value Gaps vs. Epistemic Gaps**
  You’re right that supervaluationism’s "neither true nor false" **feels like an epistemic gap** in modeling terms. However, philosophers insist this is a **fundamental distinction**:
  - **Epistemicism** (your view):  
    - Borderline statements *have* a truth value (true/false) relative to \( \theta \).  
    - Our ignorance about \( \theta \) creates an *epistemic gap*—we can’t know which it is.  
  - **Supervaluationism**:  
    - Borderline statements *lack* a truth value *by definition*.  
    - It’s not about knowledge—it’s about the *meaning* of "heap" being inherently underspecified.  
    - In your terms: The model set \( \Theta \) **fails to assign a truth value** not because of missing data, but because the concept’s structure rejects bivalence.  

  **Why philosophers defend the distinction**:  
  1. **Linguistic phenomenology**: We don’t treat "9,999 grains is a heap" as *unknown* (waiting for evidence)—we treat it as *undefined*.  
  2. **Penumbral connections**: Supervaluationism explains why "n grains is a heap iff n+1 grains is" is *false* (it fails for some \( \theta \in \Theta \)), even while borderline cases exist. Epistemicism struggles with this.  
  3. **No hidden parameter**: Supervaluationists deny \( \theta \) exists, making "indeterminacy" ontological, not epistemic.  

  ---

  ### **Conclusion: Is the Distinction Necessary?**
  - **In your framework**: Yes, the distinction collapses because statistical models assume an underlying reality (data-generating process). Supervaluationism rejects this for vague predicates.  
  - **What you’re missing**: Supervaluationism’s core claim—that vagueness is *not* about hidden facts but *semantic incompleteness*. Your model assumes all concepts have sharp extensions (even if unknown); theirs denies this.  
  - **Practical irrelevance?** For statistical prediction, both may behave similarly (e.g., both predict graded judgments). But for *interpretation*, the distinction matters:  
    - Epistemicism: "We’ll never know the cutoff."  
    - Supervaluationism: "There’s no cutoff to know."  

  **Bottom line**: Your vocabulary can express the mechanics but not the metaphysical commitments. Whether those commitments do useful work depends on whether you think vagueness requires abandoning bivalence or merely modeling uncertainty. Philosophers think it does; your statistical lens (naturally) leans epistemicist.
