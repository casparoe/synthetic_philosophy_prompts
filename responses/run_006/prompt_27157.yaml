prompt: |-
  So I just spent a whole evening arguing with a friend about whether there's a sharp number of grains that makes a heap, and he kept insisting I had to pick between epistemicism and supervaluationism. I work in statistical modeling, so the way I'd naturally cash this out is: epistemicism says there's a single true cutoff that we just can't identify from any evidence, while supervaluationism says there's a set of admissable precisifications and a sentence only counts as true if it holds across all of them. Restate both views in that model-based vocabulary as faithfully as you can, and then give me the residue report: what translates cleanly, what you had to fudge, and what has no counterpart at all. In particular, when supervaluationists say a borderline sentence is neither true nor false, I hear it as the model set not settling the question, which sounds like an epistemic gap, not a truth-value gap. Am I collapsing a distinction my vocabulary can't express, or is that distinction doing less work than philosophers think?
