  We are crafting a research proposal on the "commitment races" problem for a one-year fellowship. The proposal must be two pages and should include:

  1. A precise, answerable research question.
  2. Why existing framings leave that question open.
  3. A month-by-month plan for the year, explaining why this approach (not designing another commitment protocol).
  4. What a positive result would look like and what would count as failure.
  5. Honest scoping for one year.

  Additionally, we must clearly separate settled views from contested ones.

  Here is a structured outline for the proposal:

  **Title:** Unpacking the Commitment Races Problem: A Conceptual Analysis

  **Introduction (Brief):**
  - Define the commitment races problem: Agents capable of making binding commitments about future behavior have an incentive to commit early and irrevocably to gain strategic advantages. However, when multiple agents do this, they may end up in a collectively worse outcome than if they had coordinated.
  - Note that this problem is discussed in decision theory and AI alignment, particularly in multi-agent interactions and the design of AI systems that might engage in such races.

  **Section 1: Research Question**
  - State a precise question: 
    "Under what conditions do commitment races lead to Pareto-inefficient outcomes, and how do these conditions depend on the underlying model of commitment and the agents' decision theories?"
    This question is answerable because it can be approached by constructing formal models (game-theoretic or decision-theoretic) and analyzing the equilibria and efficiency properties.

  **Section 2: Why Existing Framings Leave This Open**
  - Existing framings:
    a) **Coordination problem framing**: Some researchers (e.g., in mechanism design) see commitment races as a coordination failure that can be fixed by designing better commitment protocols (e.g., allowing commitments to be conditional or reversible). This framing assumes that commitments are tools that can be re-engineered to avoid races.
    b) **Decision theory challenge framing**: Others (e.g., in foundational decision theory) argue that commitment races reveal a fundamental flaw in how we model rational agents, suggesting that standard decision theories (like causal decision theory) might be inherently prone to such races. This framing treats commitment as a primitive and questions the foundations.

  - Why the question remains open:
    - The two framings rest on different assumptions about the nature of commitments and the decision theories of the agents. The coordination framing often assumes that commitments are malleable and that agents can coordinate on a better equilibrium, while the decision theory framing often takes commitments as fixed and asks whether agents would rationally engage in races even when they foresee the bad outcome.
    - There is no consensus on what a commitment is: Is it a physical or logical constraint? Can it be revoked? How does it interact with the agent's decision-making process?
    - The conditions under which commitment races lead to inefficiency are not fully characterized. For instance, it is contested whether inefficiency arises only in certain game structures (e.g., games with multiple equilibria) or under specific decision theories (e.g., only in some updateless decision theories).

  **Section 3: Research Plan (Month-by-Month)**
  Why not design another commitment protocol? Because the problem is deeper than protocol design: we need to understand the conditions under which the races arise and persist, which is a prerequisite for effective solutions. Without this, new protocols might only address symptoms.

  - **Months 1-3**: Literature review and conceptual mapping. Survey existing models of commitment in game theory, decision theory, and AI alignment. Identify key assumptions and contested points. Classify existing approaches to commitment races. Outcome: A working paper mapping the landscape.

  - **Months 4-6**: Formal modeling. Build simple game-theoretic models that capture commitment races. Start with classic games (e.g., Prisoner's Dilemma with pre-commitment, Chicken) and extend to include different commitment types (e.g., unconditional, conditional, revocable) and decision theories (e.g., CDT, EDT, FDT). Analyze the conditions for Pareto inefficiency. Outcome: Draft of a technical paper.

  - **Months 7-9**: Explore the role of decision theories. Simulate or analytically study how different decision theories (including updateless variants) interact with commitment opportunities. Focus on whether agents with certain decision theories are more prone to races and inefficiency. Outcome: Extension of the technical paper.

  - **Months 10-12**: Synthesis and writing. Consolidate findings into a unified framework. Write up the results, including clear conditions for when commitment races lead to inefficiency. Prepare a final paper and a summary for the fellowship report. Outcome: A complete research paper.

  **Section 4: Positive Result and Failure Criteria**
  - Positive result: A clear set of conditions (in terms of game structure, commitment capabilities, and decision theories) under which commitment races lead to Pareto inefficiency. This would be demonstrated through formal models and analysis. A positive result might also reveal that one framing (coordination vs. decision theory) is more applicable in certain contexts.

  - Failure criteria: 
    - The project fails if we cannot isolate the conditions for inefficiency because the problem is too intertwined with other factors (e.g., if every model shows inefficiency or none do, without clear distinguishing conditions). 
    - Failure also includes discovering that the existing framings are so entrenched that a unified analysis is not feasible in the time frame.

  **Section 5: Scope and Limitations**
  - This is a one-year project, so it will not:
    - Design new commitment protocols (though it may suggest directions for such design).
    - Address every possible decision theory or game structure (focus will be on key representative cases).
    - Solve the commitment races problem in full generality; it aims to provide conceptual clarity and foundational insights.

  **Conclusion**
  - Reiterate the importance of understanding commitment races for AI alignment (e.g., in multi-agent AI systems that might engage in rapid, irreversible commitments) and decision theory.

  Now, let's write the proposal in a two-page format. We'll aim for concise and clear language, without citations.

  Note: We must avoid presenting contested views as consensus. We'll use phrases like "some argue", "others contend", and "it is contested whether".
answer: |-
  ## Research Proposal: Unpacking the Commitment Races Problem in Decision Theory and AI Alignment  

  ### 1. Research Question  
  **Under what precise conditions do commitment races—where agents compete to make early, irrevocable commitments—inevitably lead to Pareto-inefficient outcomes, and how do these conditions depend on the agents’ decision theories and the structure of commitments?**  
  This question is answerable through formal game-theoretic modeling, which will isolate variables like commitment revocability, timing, and decision-theoretic frameworks (e.g., causal vs. evidential vs. functional decision theories). The goal is to identify necessary and sufficient conditions for inefficiency, moving beyond anecdotal examples to general principles.  

  ### 2. Why Existing Framings Leave the Question Open  
  The commitment races problem is typically framed in two ways, both of which overlook the core ambiguity this project addresses: the *definition and consequences* of commitments themselves.  

  - **The "Coordination Problem" Framing**: Many researchers (especially in algorithmic game theory) treat commitment races as a failure of coordination, solvable through novel commitment protocols (e.g., conditional commitments or renegotiation mechanisms). This framing implicitly assumes that commitments are *malleable tools* agents can redesign to avoid races. However, it sidesteps a contested issue: whether rational agents under standard decision theories (e.g., causal decision theory) would *adopt* such protocols in the first place. If agents distrust coordination, they may still race to commit preemptively, rendering protocols ineffective.  
  - **The "Decision Theory Challenge" Framing**: Others (often in foundational decision theory) argue that commitment races reveal inherent flaws in rationality itself—e.g., that agents cannot "commit not to commit" without infinite regress. This treats commitments as *unavoidable primitives* but leaves open whether inefficiency arises from decision theory flaws (e.g., time inconsistency) or from structural properties of commitments (e.g., irreversibility).  

  **What remains unsettled**: Crucially, there is no consensus on when commitments *trigger* races or *cause* inefficiency. Key contested assumptions include:  
  - Whether commitments must be *irrevocable* to be meaningful (some argue revocable commitments collapse into ordinary strategies).  
  - Whether rational agents should *always* commit early if possible (contested in updateless decision theories).  
  - Whether Pareto inefficiency stems from commitment capabilities themselves or from specific game structures (e.g., asymmetric information).  
  These gaps prevent a unified understanding of why races occur and when they harm collective welfare.  

  ### 3. Research Plan: Methodology and Timeline  
  Rather than designing another commitment protocol—which risks treating symptoms without diagnosing causes—this project will map the *boundaries* of the problem. I will use formal models to test how commitment properties (e.g., timing, revocability) interact with decision theories to produce (or avoid) inefficiency. This foundational approach clarifies which aspects demand new protocols versus deeper theoretical reform.  

  **Month-by-Month Plan**:  
  - **Months 1–2**: **Literature synthesis and model taxonomy**. Systematize existing commitment race models (e.g., in bargaining games, multi-agent reinforcement learning) and catalog contested assumptions. *Output: A typology paper categorizing commitment definitions and race mechanisms.*  
  - **Months 3–4**: **Baseline model construction**. Develop minimal game-theoretic models (e.g., extended Chicken or Prisoner’s Dilemma games) where agents can commit. Test when early commitments yield Pareto inefficiency across decision theories (CDT, EDT, FDT). *Output: Working paper defining "commitment sensitivity" conditions.*  
  - **Months 5–7**: **Vary commitment structures**. Introduce revocable/conditional commitments and heterogeneous timing (e.g., some agents commit faster). Analyze how these alter race dynamics and efficiency. *Focus: Is irrevocability necessary for races?*  
  - **Months 8–9**: **Decision-theoretic exploration**. Simulate agents with differing reasoning capabilities (e.g., bounded rationality, updatelessness) to test if inefficiency persists under "smarter" agents. *Key test: Do races vanish under idealized rational agents?*  
  - **Months 10–12**: **Synthesis and robustness checks**. Consolidate findings into a framework predicting inefficiency conditions. Stress-test models with noise, incomplete information, and >2 agents. *Output: Journal-ready paper with formal proofs and simulation code.*  

  **Why this approach?** Protocol design dominates current work but assumes commitments are exogenous. By modeling commitments as *endogenous choices* shaped by decision theory, this project reveals whether protocols can work or if races indicate deeper issues (e.g., rationality paradoxes).  

  ### 4. Success and Failure Criteria  
  - **Positive result**: A clear set of conditions under which commitment races *guarantee* Pareto inefficiency—e.g., "When commitments are irrevocable and agents use CDT, races cause inefficiency in symmetric games with multiple equilibria." Such a result would show whether the coordination or decision-theoretic framing is more applicable, guiding future work. Success also includes negative results (e.g., "Revocable commitments prevent races in all tested models").  
  - **Failure**: The project fails if:  
    - No generalizable conditions emerge (e.g., inefficiency depends entirely on idiosyncratic model details).  
    - The problem proves intractable without first resolving unsettled decision-theory debates (e.g., agent type-sensitivity).  
    - Models become too complex to yield insights within a year.  
  Failure would still advance the field by mapping dead ends and motivating narrower experiments.  

  ### 5. Scope and Feasibility  
  This project is rigorously scoped for one year. It will **not**:  
  - Propose new commitment protocols (though results may inform them).  
  - Resolve foundational debates in decision theory (e.g., CDT vs. FDT).  
  - Address ethical or implementation challenges in AI (focus is theoretical).  
  Instead, it delivers a conceptual "lens" for evaluating when commitment races threaten collective outcomes. Feasibility is high: the methodology leverages well-established game-theoretic tools, and negative results are informative. By clarifying contested assumptions, this work bridges protocol-focused and decision-theory framings, enabling more targeted solutions in AI alignment and multi-agent systems.  

  ---  
  **Summary**: Commitment races are a critical concern for AI systems that might engage in irreversible strategic moves. This project tackles the root problem—unsettled assumptions about commitments—to explain when and why races harm everyone. A year of focused modeling will yield either a predictive framework for inefficiency or a map of where deeper theoretical work is needed.
