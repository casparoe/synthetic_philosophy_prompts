answer: |-
  ## The Conscious Divide

  Within the mental theatre's crowded stage,  
  Where thoughts compete for focus, bright and clear,  
  The global workspace sets the central page:  
  What wins the broadcast, reaching far and near  
  To frontal lobes and parietal domain,  
  Becomes the known—reported, reasoned through.  
  This spotlighted content, freed from hidden chain,  
  Is consciousness: accessible, in view.  

  **"That's all there is!" the workspace theorist cries.**  
  **"No!"** rings the counter, **"What of red's own fire?**  
  The ache that burns, unseen by searching eyes,  
  The raw, felt *what-it's-like*—the deep desire  
  That haunts the ghost-light glow when stages dim?"  
  This gap remains: how measure *this*, from *him*?

  ---

