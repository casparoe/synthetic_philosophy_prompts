  **Key Elements Achieved:**
  *   **Octave:** Describes global workspace ("mental theatre," "broadcast," "frontal lobes," "accessible, in view").
  *   **Volta:** Explicit "That's all there is!" / "No!" at line 9.
  *   **Sestet:** Presents phenomenal residue ("red's own fire," "ache that burns," "raw, felt *what-it's-like*," "ghost-light glow").
  *   **Couplet:** Captures the core debate resistance ("This gap remains: how measure *this*, from *him*?" implying the subjective-objective divide).
  *   **Form:** Strict Shakespearean sonnet (ABABCDCD EFEFGG), iambic pentameter.
