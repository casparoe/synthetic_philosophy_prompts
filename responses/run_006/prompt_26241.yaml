  So here's my request: could you write a joke that captures the philosophical irony of the situation? The joke should actually turn on his verificationism or emotivism—something that wouldn't be funny to someone who doesn't know his actual views. Not just a generic "atheist goes to heaven" gag. It can be a one-liner, a short dialogue, whatever. Just make it clever and philosophically apt.

  Cheers.
