  ### MEMORANDUM  
  **To:** Grants Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for the Remaining Fellowship: Balancing Du Bois’s "Criteria of Negro Art" with Contemporary Funding Imperatives  

  #### I. Context and Dilemma  
  We face a challenging decision between two exceptional finalists for our last fellowship slot:  
  1. **Abstract Painter:** Formally innovative, explicitly non-political, refuses to center identity/politics.  
  2. **Multimedia Artist:** Openly propagandistic (per Du Bois’s framing), prioritizing housing justice/police accountability over formal experimentation.  

  The committee’s split hinges on divergent interpretations of W. E. B. Du Bois’s 1926 essay "Criteria of Negro Art." One faction argues it mandates funding the multimedia artist because "all art is propaganda" and must serve Black liberation. The other contends Du Bois’s essay was context-specific and that rigid application risks instrumentalizing art and misrepresenting his views.  

  #### II. Engaging Du Bois’s Argument  
  Du Bois’s core claim—"all Art is propaganda"—is not a blanket dismissal of non-political art but a *political ontology of art*. He asserts art inevitably functions as persuasion, writing: "Whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy." Yet he simultaneously demands artistic excellence, condemning art that is "only" propaganda as ineffective. Crucially, his essay targets:  
  - **White patrons** imposing apolitical standards to silence racial justice narratives.  
  - **Black artists** seeking refuge in "art for art’s sake" to evade racial responsibility.  

  Du Bois *does* leave room for formal innovation as a mode of service to Black life. He celebrates beauty and craft as intrinsic to effective propaganda, arguing that art lacking aesthetic power fails its political mission. His distinction is not between "political" and "non-political" art but between art that *acknowledges* its propagandistic function (and wields it for liberation) versus art that denies this function (thereby tacitly upholding oppression).  

  #### III. Our Committee’s Position  
  Du Bois’s argument applies to us *indirectly*. Unlike the white patrons he criticized, we are a Black-centered institution seeking to empower artists. His framework urges us to ask: **Does this art, consciously or not, advance or hinder Black self-determination?** However, reducing his essay to a scoring rubric contradicts his insistence that Black art must defy prescriptive boundaries. Our criteria ("artistic excellence" and "contribution to Black cultural life") intentionally embrace plurality—a stance Du Bois might endorse today, as Black cultural life encompasses both protest and reimagined futures beyond struggle.  

  #### IV. Analysis of Finalists  
  - **Abstract Painter:** Her formal innovation challenges Eurocentric aesthetic hierarchies, expanding possibilities for Black expression. This *is* a contribution to Black cultural life—not by avoiding politics but by asserting autonomy from reductive expectations. Du Bois might critique her disavowal of politics as naive (since her work’s existence in a racialized art world remains political), but her craft aligns with his demand for excellence.  
  - **Multimedia Artist:** Her work directly answers Du Bois’s call for art as a "weapon" for justice. However, Du Bois would caution that subordinating form to message risks producing ineffective propaganda if the art lacks originality or emotional depth.  

  **Strongest Argument for Multimedia Artist:** In a moment of acute racial crises (housing, policing), art prioritizing tangible justice aligns with Du Bois’s imperative that Black creativity must "gainsay" the lies of white supremacy.  
  **Strongest Argument for Abstract Painter:** Funding work transcending struggle-centric narratives resists Du Bois-era pressures to confine Black art to protest—fulfilling our mission by affirming that Black cultural contribution includes redefining aesthetics on our own terms.  

  #### V. Recommendation: Fund the Painter, with Conditions  
  I recommend funding the **abstract painter**, contingent on two conditions:  
  1. She participates in a public dialogue (hosted by our foundation) exploring intersections of formalism, Black identity, and implicit politics in her work.  
  2. Next cycle’s application explicitly prompts artists to address how their work engages with Black cultural life, whether through form, content, or both.  

  **Rationale:**  
  - Du Bois’s essay cautions against *imposed* apoliticism but does not preclude art serving Black life through formal innovation. The painter’s work embodies this, resisting the white art world’s pigeonholing of Black artists.  
  - Our role is to nurture a diverse ecosystem of Black art. Prioritizing overtly political work today could inadvertently narrow the scope of "contribution to Black cultural life," undermining the expansive vision Du Bois himself advanced when celebrating Black artistic genius beyond protest.  
  - Deferring would delay urgent support without resolving the philosophical tension. Funding the multimedia artist would elevate one valid mode of Du Boisian art but risks signaling that "propaganda" in the literal sense is superior to other contributions—a stance Du Bois rejected when he demanded art be "beautiful" first.  

  #### VI. Conclusion  
  Du Bois’s "propaganda" claim is a starting point, not an endpoint, for our deliberations. It reminds us that all art has political resonance but does not dictate a singular expression of that resonance. By funding the painter, we honor Du Bois’s belief in art’s transformative power while trusting Black artists to define their own contributions to liberation.  

