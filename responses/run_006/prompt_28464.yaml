prompt: |-
  I'm a microeconomist, not a philosopher — utility functions, budget sets, endowments, feasible sets, envy-freeness, mechanism design, that's where I live. I've picked up that political philosophy has this long fight about what equality is supposed to be equality of — welfare, resources, capabilities — but I've never actually worked through it. I want you to restate the whole debate in my vocabulary, position by position, as faithfully as you can. Translate the welfare view into equalizing utility or preference satisfaction, with the expensive-tastes and adaptive-preferences objections. Translate the Dworkin-style resource view into equal endowments plus a hypothetical insurance market that compensates brute luck but not option luck, with the ambition-sensitivity / endowment-sensitivity distinction. Translate the Sen/Nussbaum capability view into a person-specific conversion function from resources into a feasible set of functionings, and the functionings-vs-capabilities distinction. For each one, tell me what maps cleanly, what you had to fudge to force it to fit, and what has no counterpart in anything I normally model.

  Then give me the residue report. The thing I actually want to know: is a 'capability' just a budget set with a nonlinear, person-specific production function, or does something drop out in translation? If something drops out — the intrinsic value of unchosen options, adaptive preferences, the brute-luck/option-luck line, dignity or participation as non-market functionings — tell me whether that's a real gap in the economist's vocabulary or a sign that the philosophers' distinction was less sharp than it sounds once you demand a measurable structure. Dont give me citations or a reading list; I want the translation and the residue, not a bibliography.
reasoning: |-
  Okay, the user is a microeconomist asking for a translation of political philosophy debates about equality into economic terms. They specifically want welfare, resources, and capabilities frameworks mapped to utility functions, endowments, and feasible sets - with notes on what gets lost in translation. And crucially, they want to know if "capability" is just a fancy budget set.

  First, I need to unpack their request. They're clearly comfortable with formal modeling but find philosophical distinctions fuzzy. That "don't give me citations" demand suggests they've seen surface-level summaries before and want operational clarity. The residue question is key - they suspect philosophers might be dressing up simple concepts.

  For welfare egalitarianism: Straightforward mapping to utility equality. Expensive tastes become non-convex preferences, adaptive preferences a problem of endogenous utility formation. Should note how philosophers care about the "why" of utility differences while economists often take preferences as given.

  For resources: Dworkin's auction+insurance model translates neatly to initial endowment + state-contingent claims market. Brute luck vs option luck mirrors exogenous vs endogenous risk exposure. But the hypothetical insurance device is slippery - how to model that counterfactual? And philosophers care about the narrative of "choice vs circumstance" in a way that doesn't reduce to statistical discrimination.

  Capabilities are the trickiest. The budget set analogy works if we add person-specific production functions converting resources to functionings. But two big gaps: First, the value of unchosen options (philosophers care about capability as freedom, not just revealed preference). Second, non-market functionings like dignity that have no price but matter for equality. Must emphasize that for Sen, the capability set has intrinsic value beyond its maximal element.

  Residue analysis: Yes, capability is like a personalized budget set - but with non-commodified dimensions and process values built in. The unchosen-options point reveals a real vocabulary gap in economics, where opportunity cost captures value only through forgone alternatives. Adaptive preferences expose where welfarism fails when preferences are distorted. And the brute/option luck distinction? Economists can model it with type-contingent transfers, but philosophers insist on a moral distinction that survives even when risks are observable.

  The user's "less sharp than it sounds" suspicion is half-right - some distinctions collapse under measurement pressure (like dignity metrics), but others reveal genuine blind spots in standard models. Should flag that participation/dignity might require modeling externalities or constraint sets that don't map to prices.
answer: |-
  Here's the translation into microeconomic vocabulary, followed by the residue analysis you requested:

  **Core Positions Translated:**

  1.  **Welfare Egalitarianism (e.g., Utilitarianism, some luck egalitarians):**
      *   **Goal:** Equalize *utility* (preference satisfaction) across individuals.
      *   **Mechanism:** Redistribute resources (income, goods) until marginal utilities are equalized. Requires interpersonal utility comparisons.
      *   **Objections Translated:**
          *   *Expensive Tastes:* Requires massive transfers to individuals with costly preferences (e.g., needing champagne to achieve same utility level as someone content with water). Violates Pareto efficiency and seems intuitively unfair – why reward costly preferences?
          *   *Adaptive Preferences:* Individuals in deprived circumstances lower their expectations, reporting high utility despite objectively poor conditions. Equalizing this "adaptive utility" perpetuates deprivation and ignores objective well-being. (Problem: Utility function is endogenous to deprivation).
      *   **Clean Fit:** Goal (utility equality), mechanism (transfer-based redistribution), expensive tastes objection (non-convex preferences causing inefficiency/perverse incentives).
      *   **Fudged:** Interpersonal utility comparison – economists treat it as heroic/impossible; philosophers debate its possibility/meaning. Adaptive preferences challenge the stability and normativity of the utility function itself.
      *   **No Direct Counterpart:** The *normative weight* given to subjective utility as the *sole* metric of justice. Economists often take utility as given for positive analysis; philosophers debate if it *should* be the target.

  2.  **Resource Egalitarianism (e.g., Dworkin):**
      *   **Goal:** Equalize *opportunity* via initial *resource endowments*, compensating for unchosen disadvantages ("brute luck") but not differences due to choice ("option luck").
      *   **Mechanism:**
          1.  **Initial Auction ("Equal Resources"):** Start with equal wealth endowments. Hold a competitive auction for all available resources (including personal traits?) to find market-clearing prices reflecting opportunity costs. Result: Different bundles, but equal value at auction prices.
          2.  **Hypothetical Insurance Market ("Compensating Brute Luck"):** Individuals, behind a "veil of ignorance" about their own talents/disabilities/starting place, would buy insurance against poor brute luck (low talent, disability). Actual transfers mimic the *premiums* and *payouts* of this hypothetical market.
      *   **Distinctions:**
          *   *Ambition-Sensitivity:* Outcomes differing due to choices (work effort, risk-taking) are just. Modeled by letting the initial endowment be spent/traded freely post-auction/insurance.
          *   *Endowment-Insensitivity:* Outcomes differing due to unchosen traits/disadvantages (brute luck) are unjust. Compensated via hypothetical insurance payouts.
      *   **Clean Fit:** Separating endowment (brute luck) from choice (option luck/ambition). Auction as a mechanism for valuing heterogeneous resources. Insurance market as a device for modeling compensation for risk exposure.
      *   **Fudged:** The "veil of ignorance" for the insurance market is a thought experiment, not an operational market. Defining which traits/resources are auctionable/insurable (e.g., raw talent vs. cultivated skill? Personality?). Auctioning personal traits is metaphoric.
      *   **No Direct Counterpart:** The *moral distinction* between brute luck and option luck as the *foundation* for justice. Economists model risk types and state-contingent contracts, but don't inherently assign moral blame/responsibility based on the source of the risk.

  3.  **Capability Approach (e.g., Sen, Nussbaum):**
      *   **Goal:** Equalize effective *freedom* or real *opportunity* to achieve valuable states of being and doing ("functionings").
      *   **Core Concept:** **Capability Set = Feasible Set of Functionings.**
          *   **Functioning:** An achieved outcome/state (e.g., being well-nourished, literate, participating in community).
          *   **Capability:** The *freedom* to achieve a functioning, i.e., it being within one's feasible set.
      *   **Mechanism:** Focus on equalizing the *capability set*. Requires:
          1.  **Person-Specific Conversion Functions:** Individuals have heterogeneous "production functions" transforming *resources* (income, goods, public services) into *functionings*. These functions depend on personal characteristics (disability, metabolism, gender) and social/environmental factors (discrimination, pollution, infrastructure).
          2.  **Non-Market Inputs:** Some functionings (e.g., dignity, participation) depend on social relations, rights, norms – not directly purchasable resources.
      *   **Distinction (Functionings vs. Capabilities):** Equalizing *achieved* functionings (e.g., forcing everyone to be nourished) vs. equalizing the *opportunity set* (capability set) from which individuals *choose* their functionings. The capability set is the target.
      *   **Clean Fit:** Capability Set = Feasible Set. Person-specific conversion functions mapping resources to outcomes. Focus on opportunity (capability) rather than outcome (functioning) aligns with valuing choice.
      *   **Fudged:** Defining the relevant "valuable" functionings/capabilities (Sen: open-ended list via public reason; Nussbaum: specific list). Quantifying the "size" or "value" of a capability set (beyond just counting elements) is complex. The "freedom" aspect is richer than simple feasibility.
      *   **No Direct Counterpart:** The intrinsic value of *having options* (capabilities) even if unchosen. The explicit inclusion of *non-commodifiable* inputs (social bases of respect, rights) into the production of well-being/opportunity.

  **Residue Report: Capabilities vs. The Budget Set**

  Your core question: **Is a capability set just a budget set with a nonlinear, person-specific production function?**

  *   **Yes, partially:** This captures the *core technical structure* remarkably well.
      *   **Resources = Income/Commodities:** The inputs you can purchase/are endowed with.
      *   **Person-Specific Production Function:** Transforms resources into potential functionings (outputs). Highly nonlinear due to conversion factors (e.g., a wheelchair converts money into mobility far more efficiently for a paraplegic than an able-bodied person).
      *   **Feasible Set:** The set of all functionings vectors achievable *given* the resource endowment *and* the production function. This *is* the capability set.
      *   **Choice:** Individuals then choose a point (bundle of functionings) from within this feasible set.

  *   **But Significant Residue Drops Out:**
      1.  **Intrinsic Value of Unchosen Options:** Economists typically value the feasible set *only* through the lens of the *chosen* point (revealed preference) or its maximal value. Capability theory asserts the *freedom itself* – the existence of unchosen but valuable options – has intrinsic worth for justice/well-being/dignity. This "opportunity freedom" isn't captured by the value of the chosen bundle or the size of the set alone. *(Real Gap: Standard economics lacks a formal way to value the set intrinsically beyond its boundaries or best element).*
      2.  **Adaptive Preferences:** If preferences adapt to a small feasible set (e.g., the poor don't desire education because it seems impossible), revealed preference based on choice *within* that set becomes a poor indicator of well-being or the value of the set itself. The capability approach rejects using *only* revealed preference to judge the adequacy of the set. *(Real Gap: Economists model endogenous preferences with difficulty; incorporating them normatively challenges welfare foundations).*
      3.  **Non-Market "Resources" and Functionings:** The "production" of functionings like "appearing in public without shame," "having self-respect," or "participating effectively in political life" depends critically on social norms, legal rights, discrimination levels, and relational goods – things not bought/sold in markets or easily modeled as standard commodities entering a production function. Dignity/participation *are* the functionings, not inputs or outputs in the usual economic sense. *(Real Gap: Standard commodity space and production functions struggle with non-rival, non-excludable, socially constituted goods central to capabilities).*
      4.  **Brute Luck vs. Option Luck (in Conversion):** The heterogeneity in the conversion function (production function) is largely due to "brute luck" (genetics, disability, birthplace, discrimination). The capability approach demands compensation for poor brute luck affecting this conversion efficiency. While economists can model compensating for observable disadvantages affecting productivity, the *moral imperative* based on the luck/choice distinction isn't inherent in the model. *(Philosophers' Distinction Less Sharp? The line is fuzzy, but the *normative focus* on compensating for unchosen conversion disadvantages is clearer in philosophy. Economists can model the compensation but not the *reason*).*
      5.  **Valuing the Set vs. Choosing from it:** The sharp distinction philosophers draw between judging the justice of the *opportunity set* (capabilities) versus judging the justice of the *choices made* from within it (functionings) is conceptually clearer in their framework. While economists understand feasibility, the *primary normative focus* is often shifted decisively to the set itself.

  **Conclusion:** The capability set **is structurally analogous** to a feasible set defined by a budget constraint and a personalized, nonlinear production function mapping resources to multidimensional outcomes (functionings). This translation captures the essence of *how* capabilities are generated.

  **However, significant normative residue drops out:** The intrinsic value of freedom (unchosen options), the problem of adaptive preferences deforming choice-based valuation, the centrality of non-market social factors and "beings/doings" like dignity, and the explicit normative grounding in compensating for brute luck disadvantages affecting the conversion process. **These represent real gaps or differing emphases compared to standard microeconomic modeling vocabulary and normative focus.** The philosopher's distinctions highlight aspects (freedom's intrinsic value, social bases of functioning, the moral weight of unchosen disadvantage) that standard economic models either struggle to formalize meaningfully or do not inherently prioritize in their conception of equality. The "fuzziness" appears more in operationalizing measurement than in the conceptual distinctions themselves.
