answer: |-
  Here is the translation and residue report as requested:

  1.  **Epistemic Bubble as Restricted Focalization:** An epistemic bubble translates cleanly to a narrative situation defined by *restricted focalization* or a *limited point of view character*. The narrative (or the character's experience within it) simply *omits* information from external sources, akin to a camera only showing part of the scene, without necessarily distorting the information it *does* contain. The reader might infer the missing information exists "off-screen."
  2.  **Echo Chamber as Active Unreliable Narration + Distrust Framing:** An echo chamber aligns with an *unreliable narrator* whose unreliability stems from *systematically discrediting external sources*, often signaled through *free indirect discourse* revealing contempt or dismissal. The narrative doesn't just omit outside views (like a bubble); it actively *frames them* as inherently untrustworthy or malicious through the narrator's voice or the focal character's internalized judgments.
  3.  **Residue: Systemic Reinforcement vs. Individual Psychology:** The translation fudges the *systemic, networked nature* of echo chambers. While narrative tools excel at depicting an *individual's* distorted worldview and distrust (e.g., unreliable narration), they struggle inherently to show the *mutually reinforcing feedback loops*, coordinated discrediting campaigns, and *group identity mechanics* that sustain real-world echo chambers beyond a single character's psychology.
  4.  **Residue: Motive & Manipulation Contention:** The philosopher's contested aspect – whether echo chambers *require* deliberate manipulation by bad actors or can arise organically – has no clean counterpart. Narrative unreliability often implies *personal motive* (deception, bias, trauma). Echo chambers might involve manipulation, but philosophers debate if this is essential or if identity-preserving distrust alone suffices. Narrative tools tend to individualize motive where the philosophical concept allows for more distributed agency.
  5.  **Residue: The Reader's Position & Alternative Views:** Narrative techniques inherently manage *reader access* to truth (dramatic irony, reliable framing narration). The core residue is that while a novel *always* provides the reader *some* privileged perspective or contrasting view (even if subtle), real epistemic bubbles and echo chambers offer participants *no inherent, author-sanctioned access* to reliable counter-perspectives within their informational ecosystem. The novelist's control of totality has no real-world equivalent.
