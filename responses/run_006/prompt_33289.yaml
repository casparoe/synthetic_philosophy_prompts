prompt: |-
  I serve on the grants committee of a small family foundation in a midsized city. Each year we distribute a fixed sum among local programs, mostly for children and families, and over the past few years I have noticed that my votes do not follow any rule I can state. They are not "do the most good with the money," and they are not "make things as equal as possible." I have no training in philosophy, and I have been trying to work this out on my own, but I keep going in circles. Below are the cases that have stayed with me, with my honest verdicts.

  Case A. Two after-school programs each request $20,000. One serves children from families below the poverty line; the other serves children from comfortable families. The money would buy the same materials and reach the same number of children, but the program for the poorer families is harder to administer, so each dollar is expected to produce somewhat less measurable benefit. I vote to fund the poorer program.

  Case B. A proposal would make the distribution of programs more equal by shutting down a well-attended summer program in an affluent neighborhood, with no plan to move the money anywhere useful; the original donor would simply keep the funds. No child elsewhere gains anything. I vote against it. I feel a faint pull toward "at least the gap would be smaller," but I cannot treat that as a reason to make some children worse off for nobody's benefit.

  Case C. We must choose between two $20,000 proposals. One would give roughly five hundred already-comfortable seniors a pleasant museum outing. The other would pay several months of rent and a security deposit for two families who would otherwise remain homeless. The total benefit, counted plainly, seems larger for the seniors; I vote for the two families. The depth of the need outweighs the number of people helped.

  Case D. A proposal would move funds from a program for the working poor — people above the poverty line but barely getting by — to a program for the destitute, people on the street. Because of how the two programs are structured, for every $100 moved, only about $15 would reach the destitute; the rest would be eaten by transition costs. I am genuinely torn. In the end I vote no; the waste is simply too large. But I notice this sits uneasily with Case C.

  Case E. Two programs serve children who are both badly off, but one group is somewhat worse off than the other: families in emergency shelter versus families doubled up in unsafe housing. The money would do roughly equal measurable good for each group. I lean toward the emergency-shelter group, though not as strongly as I do when the choice is between badly off and comfortable.

  Case F. A proposal would reduce the gap between upper-middle-class and wealthy families by giving extra help to the upper-middle-class children at the expense of the wealthy children, without changing anything for anyone genuinely badly off. I do not see the point. The gap between those two groups does not move me.

  The closest I have come to a statement of my view is that I care about how badly off people are, not about equality as such. But that cannot be the whole story: in Case E both groups are badly off and I still lean toward the worse-off one, and in Case D I balk at waste even though the money would reach the worst off. I would like to know whether there is one principle that captures all of this, or nearly all of it. If it cannot capture everything, I want to know which of my verdicts it forces me to drop, and why. I would also like the principle tested against cases I have not listed.

  You are a professional philosopher who specializes in distributive justice. Please think carefully. Begin by brainstorming the main candidate principles someone in my position might be relying on; state each precisely and say which of my cases it handles well and which it handles badly. Then give your best proposal: the principle, or small set of candidates, that best fits my verdicts, stated precisely and in plain language, with the case that motivates each clause. For any verdict it cannot accommodate, say so honestly and explain what the principle says I should think instead. Finally, apply the principle to two or three new cases, including at least one where its answer is surprising or uncomfortable. Do not assume I know the academic literature; define any technical terms you use, and do not give me a reading list.
reasoning: |-
  Okay, let me tackle this grants committee member's dilemma. They've described six real-world cases where their intuitive funding decisions don't seem to follow a clear rule, and they're looking for a unifying principle. 

  First, I notice their rejection of strict utilitarianism ("do the most good") and strict egalitarianism ("make things equal"). In Case A, they fund the poorer program despite lower efficiency, which suggests prioritizing need over pure benefit. Case B shows they won't support leveling down - making some worse off without helping others. Case C reveals a strong preference for helping the desperately needy (homeless families) over providing mild benefits to many comfortable seniors. 

  The tension appears in Case D: they oppose redirecting funds from working poor to destitute when 85% is wasted, even though in Case C they prioritized the destitute. This suggests efficiency matters when redistribution costs are high. Case E shows they care about degrees of need even among disadvantaged groups, while Case F confirms they don't care about narrowing gaps between already-advantaged groups.

  Hmm... their core concern seems to be improving the condition of the worst off, but with practical constraints. The philosopher Amartya Sen's capability approach might resonate here - focusing on what people can actually do and be. But I should avoid name-dropping theories.

  Let me brainstorm candidate principles:
  1. Maximin (help the worst off): Explains A, C, E but fails D (where worst off get little) and conflicts with B (no leveling down).
  2. Prioritizing basic needs: Captures C and E, but struggles with A (where both serve children) and D's efficiency concern.
  3. Sufficientarianism (get everyone to a threshold): Explains focus on destitute in C, but not the gradation in E or A's choice.

  The waste aversion in D suggests a cost-effectiveness threshold. And their indifference in F implies they only care about inequalities affecting the genuinely deprived. 

  Perhaps the unifying idea is: Prioritize those with unmet basic needs, but require reasonable cost-effectiveness. The "basic needs" part explains why they help poorer kids (A), homeless (C), and worse-off kids (E). The efficiency clause explains D's rejection and B's anti-leveling. Case F falls away because no basic needs are involved.

  For new cases: What if helping the worst off requires huge resources for tiny gains? Their principle would likely say no. Or if two groups have equal need but one is cheaper to help? They'd probably fund the more efficient one. The discomfort comes when basic needs are met but serious disadvantages remain - their principle might neglect those, but that matches their verdict in F.

  This seems consistent except possibly Case E's "lean" - their principle might require stronger preference than they feel, but the direction aligns. I'll present this as "Prioritize Basic Needs with Reasonable Efficiency," specifying what counts as basic needs and how efficiency is weighed.
answer: |-
  After careful analysis of your cases, I propose this principle: **Prioritize resources to alleviate severe deprivation of basic human needs, but require that the resources achieve meaningful benefit at reasonable efficiency.** This captures your core judgments while explaining tensions.

  ### Brainstormed Candidate Principles
  1. **Strict Utilitarianism:** "Maximize total measurable benefit per dollar."  
     - *Fits:* Nothing (rejects A, C, E)  
     - *Fails:* You prioritize need over total benefit (A, C), and reject waste even for the worst off (D).

  2. **Maximin (Rawlsian):** "Always benefit the worst-off group."  
     - *Fits:* A (poorer children), C (homeless families), E (emergency-shelter kids).  
     - *Fails:* B (you reject harming the affluent to "help" the worst off), D (you reject inefficient aid to the destitute).

  3. **Sufficientarianism:** "Get everyone above a threshold of basic needs."  
     - *Fits:* C (homeless below threshold, seniors above), E (both below but shelter is farther below).  
     - *Fails:* A (both groups may be above threshold, yet you favor poorer children), F (indifference to gaps above threshold).

  4. **Moderate Egalitarianism:** "Reduce gaps between groups, but not by leveling down."  
     - *Fits:* B (rejects leveling down), F (indifferent to gaps above threshold).  
     - *Fails:* A (you favor poorer kids despite equal numbers, not just gap reduction), E (you prioritize absolute need over relative gap).

  ---

  ### Proposed Principle
  **Your guiding principle:**  
  **"Direct resources first to those experiencing severe deprivation of basic needs (safety, shelter, nutrition, stability), but only when the resources provide meaningful improvement at reasonable efficiency."**

  #### How It Explains Your Cases:
  - **Case A (Poorer program):** Children in poverty face greater deprivation of basic needs (e.g., stability, nutrition support). Efficiency loss is tolerated because the need is more severe. *Fits.*  
  - **Case B (No leveling down):** Reducing gaps by harming some violates "meaningful improvement" (no one gains) and "reasonable efficiency" (resources vanish). *Fits.*  
  - **Case C (Homeless families):** Homelessness is severe deprivation of shelter/safety; seniors' museum trip is non-basic. Depth of need outweighs numbers. *Fits.*  
  - **Case D (Blocked transfer to destitute):** Redirecting funds fails "reasonable efficiency" (85% waste). Even severe need doesn’t justify extreme inefficiency. *Fits, and resolves tension with C.*  
  - **Case E (Emergency shelter):** Both groups are deprived, but emergency shelter implies greater severity (e.g., safety risk). You prioritize the *more* severe basic need. *Fits.*  
  - **Case F (Gap between affluent):** Neither group faces deprivation of basic needs. Gaps above the threshold don’t matter. *Fits.*

  #### Verdict It Cannot Fully Capture:
  - **Case E’s "lean" (not strong preference):** The principle clearly favors the worse-off group in E. If your "lean" feels weaker than in C, it’s because *both* groups in E have unmet basic needs (vs. C’s comfortable seniors). The principle captures this nuance—severity matters, but the gap narrows when both suffer deprivation.

  ---

  ### Testing the Principle: New Cases

  **Case G: School Meals vs. Therapy**  
  - Proposal 1: $20k feeds 200 food-insecure children for a semester.  
  - Proposal 2: $20k provides trauma therapy for 10 severely abused children.  
  - *Principle’s verdict:* **Therapy group.** Both address basic needs (nutrition vs. safety/mental health), but severe abuse represents more acute deprivation. Efficiency is comparable. *Surprise:* Though fewer are helped, the depth of need dominates.  

  **Case H: Efficient but Moderate Need**  
  - Proposal 1: $20k prevents 50 working-poor families from losing heat in winter (efficiency: 100% reach).  
  - Proposal 2: $20k moves 1 homeless family into permanent housing (efficiency: 100% reach).  
  - *Principle’s verdict:* **Homeless family.** Shelter is a more severe deprivation than temporary heat loss (which may be remedied by other means). Efficiency doesn’t override severity.  

  **Case I: High Cost for Catastrophic Need**  
  - Proposal: Spend $100k to save one child’s life (rare medical treatment). Same funds could build a community center serving 1,000 low-income children.  
  - *Principle’s verdict:* **Save the child.** Death is the ultimate deprivation of basic needs. But if costs were higher (e.g., $500k), efficiency might override—"meaningful benefit at reasonable efficiency" has limits. *Discomfort:* Prioritizing one life over many smaller gains forces hard tradeoffs, but aligns with your focus on depth of need.

  ---

  ### Key Clarifications
  - **"Basic Needs":** Safety, shelter, nutrition, medical survival, stability. *Not* enrichment, comfort, or equal opportunity above this threshold (explains F).  
  - **"Reasonable Efficiency":** Contextual. 15% reach (D) is unreasonable; 20% administrative overhead (A) may be tolerable for severe need.  
  - **Why it works:** It centers on *absolute deprivation*, not comparison (equality), while acknowledging practical constraints. This mirrors your rejection of leveling down (B), indifference to affluent gaps (F), and tolerance for inefficiency only when needs are deep (A vs. D).

  This principle preserves all your verdicts, explains Case D’s tension with C, and highlights your intuition that **life-threatening deprivation demands priority—but not at any cost.**
