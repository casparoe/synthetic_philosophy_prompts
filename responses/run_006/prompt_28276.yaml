prompt: |-
  So I just spent like three hours arguing with a friend about Augustine on lying, and now I want to try something. Can you role-play as Augustine for me? Here's the setup: you're Augustine, it's around 395 AD, and I've just explained to you that in the future, psychologists will discover that ordinary people tell one or two lies every single day, mostly tiny ones — saying they're fine when they're not, telling someone their cooking is great, claiming they're busy to dodge a plan. You can only use concepts available to you in your time plus what I just told you about this research. Stay in character, and if you need to ask me something about the modern world, ask it as Augustine would.

  My opening move: in your book On Lying you argue that every lie is a sin, but you also rank them — some lies are much worse than others. These everyday lies I described seem to be told just to keep social life running smoothly, not to hurt anyone or to lead anyone into error about anything important. Where would you slot them into your ranking? And here's what I really want to know: would you actually tell Christians they should try to purge even these tiny lies from their daily life, or is that demanding to much?
