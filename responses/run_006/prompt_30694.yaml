prompt: |-
  I'm writing a paper on whether the bootstrapping problem and the problem of easy knowledge undermine externalist accounts of justification, and before I commit to a diagnosis I want a full specification of what an adequate treatment must accomplish. Write the desiderata for a theory of how a basic source—perception, memory, testimony, an instrument—can yield justification or knowledge without licensing vicious bootstrapping: a subject who already knows a gas gauge has been reliable reads F, infers the gauge is accurate on this occasion, and then uses such instances to confirm its reliability. The account must respect the difference between that reasoning and legitimate track-record reasoning of the sort used to validate instruments, and must address the easy-knowledge inference in the red-table case—I know by looking that the table is red, so I know it is not a white table illuminated by red light—saying whether, and why, that inference is too easy. For each desideratum, give the case or argument behind it and mark it as non-negotiable or as a camp-specific preference (internalist, externalist, closure-denier, and so on). The part I most want is the conflict structure: say which subsets of desiderata cannot be jointly satisfied—in particular whether a view can keep closure under known entailment, block bootstrapping, and avoid an unacceptable skepticism about our basic sources while returning a principled verdict on the easy-knowledge inference—and which single requirement does the most to exclude the standard reliabilist, dogmatist, and skeptical treatments. Keep the scorecard brief; the criteria and their conflicts are the deliverable.
reasoning: |-
  Okay, the user is writing a paper on epistemology, specifically tackling the bootstrapping problem and easy knowledge in relation to externalist accounts of justification. They need a clear set of desiderata for a theory that handles these issues without falling into vicious bootstrapping. I should outline what such a theory must accomplish, referencing key cases like the gas gauge and the red table.

  First, the bootstrapping problem involves someone using a source (like a gas gauge) to confirm its own reliability in a circular way. The user wants the theory to block this while allowing legitimate track-record reasoning. The red-table case is about inferring that a table isn't white under red lights just from seeing it's red—this easy knowledge inference needs evaluation.

  The user wants desiderata with each case or argument noted, marking if it's non-negotiable or camp-specific. Also, they want conflicts between these desiderata highlighted, especially regarding closure, avoiding skepticism, blocking bootstrapping, and handling the easy-knowledge inference.

  I recall the gas gauge example: if someone already knows the gauge is reliable, reads 'F', infers it's accurate this time, then uses such instances to confirm reliability—that's bootstrapping. Legitimate track-record reasoning must be different. For the red table, inferring it's not white under red lights from perception alone might be too easy.

  Desiderata should include: blocking bootstrapping (non-negotiable), distinguishing it from legitimate reasoning (non-negotiable), explaining the red-table inference (non-negotiable), maintaining closure under known entailment (contested), allowing basic sources to yield justification without prior validation (non-negotiable), avoiding ad-hoc distinctions (non-negotiable), and providing a unified account (non-negotiable).

  Conflicts: Closure (D4) and blocking bootstrapping (D1) might conflict with avoiding skepticism (D5). Theories might have to compromise—externalists might reject closure, while internalists might require prior justification, risking skepticism. The red-table inference (D3) is tricky; if it's blocked, it might lead to skepticism, but allowing it might permit easy knowledge.

  The key tension is between D1, D4, and D5. Standard treatments like reliabilism allow bootstrapping, dogmatism allows easy knowledge but not bootstrapping, skepticism denies D5. The most excluding desideratum is D1 (Blocking Bootstrapping), as it challenges externalist views like reliabilism.

  I need to structure this clearly: list each desideratum with its basis and status, then outline conflicts, and finally the scorecard showing how standard treatments fail certain desiderata.
answer: |-
  Here are the core desiderata for an adequate theory, the cases/arguments motivating them, their status, and an analysis of conflicts. The central tension lies in reconciling closure, anti-bootstrapping, and anti-skepticism.

  **Core Desiderata:**

  1.  **Block Bootstrapping (D1):** The theory must diagnose *why* the gas-gauge reasoning is viciously circular/epistemically defective.
      *   **Case:** Gas Gauge (Vogel): S knows the gauge is generally reliable. S reads "F", infers (via source) the gauge is accurate *this time*, then uses this instance as evidence for general reliability.
      *   **Status:** **Non-negotiable.** Widely accepted as a fatal flaw by nearly all camps if licensed. The reasoning is intuitively question-begging and generates justification/knowledge too easily from a source whose reliability is precisely what's at stake in the inference.

  2.  **Permit Legitimate Track-Records (D2):** The theory must allow knowledge/justification from legitimate track-record reasoning (e.g., using independent sources to validate an instrument).
      *   **Case:** Validating a Thermometer: Using a certified reference thermometer (calibrated via a different, independent method) to check the accuracy of a new thermometer across various temperatures, thereby justifiably concluding the new thermometer is reliable.
      *   **Status:** **Non-negotiable.** Denying this entails an unacceptable skepticism about our ability to empirically validate sources. Distinguishing D2 from D1 is crucial.

  3.  **Account for the Red-Table Inference (D3):** The theory must provide a principled account of whether the inference "I see a red table, therefore it's not a white table illuminated by red light" yields knowledge/justification, and explain *why*.
      *   **Case:** Red Table (Cohen): S knows via perception that the table is red. S infers via known entailment that it is not a white table illuminated by red light. Is this knowledge? If not, why is it defective? If so, why isn't *it* "too easy"?
      *   **Status:** **Non-negotiable (Explanation Required).** The verdict itself (allowed/blocked) is **camp-specific** (e.g., dogmatists often allow, conservatives/closure-deniers often block), but a theory *must* take a stance and provide a rationale linking it to its core principles and its treatment of bootstrapping (D1). Avoiding this case is inadequate.

  4.  **Preserve Closure under Known Entailment (D4):** If S knows P, and S competently deduces Q from P (while knowing P entails Q), then S knows Q.
      *   **Argument:** Intuitive plausibility; denying closure leads to highly counterintuitive results (e.g., knowing you have hands but not knowing you're not a brain in a vat being fed hand-experiences). Fundamental to much deductive reasoning.
      *   **Status:** **Highly Desirable but Contested.** Non-negotiable for **Closure Preservationists** (many internalists, some externalists). Routinely sacrificed by **Closure Deniers** (e.g., Dretske, Nozick) to handle skepticism/easy knowledge/bootstrapping.

  5.  **Avoid Skepticism about Basic Sources (D5):** The theory must allow that perception, memory, etc., *can* provide non-inferential justification/knowledge without requiring prior, independent validation of their reliability.
      *   **Argument:** Foundationalism: Basic sources must be able to start the justificatory chain. Requiring prior validation leads to regress/circularity/skepticism.
      *   **Status:** **Non-negotiable.** Any theory that makes justification from basic sources impossible *until after* they are independently validated is self-defeating and radically skeptical. Core commitment of **Externalism** and **Moderate Internalist Foundationalism**.

  6.  **Avoid Ad-Hoc Distinctions (D6):** The distinction between vicious bootstrapping (D1) and legitimate track-records (D2) must flow naturally from the theory's core principles (e.g., nature of justification, basing relation, defeat), not be a brute stipulation.
      *   **Argument:** Theoretical Virtue. Ad-hoc patches lack explanatory power and fail to provide a deep understanding.
      *   **Status:** **Non-negotiable.** A theory that simply declares the gas gauge bad and the thermometer good without a principled basis fails.

  7.  **Unified Account (D7):** The theory should ideally handle both bootstrapping (D1) and the red-table inference (D3) with the same core mechanism or principle.
      *   **Argument:** Theoretical Elegance & Explanatory Power. The cases feel related (potential for "too easy" knowledge generation from basic sources via entailment/inference).
      *   **Status:** **Highly Desirable Preference.** Lacking unification isn't fatal, but it's a significant theoretical advantage.

  **Conflict Structure & Scorecard:**

  *   **The Core Trilemma:** Reconciling **D1 (Block Bootstrapping)**, **D4 (Closure)**, and **D5 (Anti-Skepticism)** is the fundamental challenge. Most theories sacrifice one:
      *   **Sacrifice D4 (Closure Denial):** Allows D1 blocking + D5 (e.g., Dretske/Nozick). But faces counterintuitive consequences of closure denial and struggles with D3 (often must deny it too).
      *   **Sacrifice D5 (Skepticism/Prior Validation):** Allows D1 blocking + D4 (e.g., demanding independent validation for basic sources before they yield justification). Violates D5 and cripples foundationalism.
      *   **Sacrifice D1 (Allow Bootstrapping):** Allows D4 + D5 (e.g., Simple Reliabilism). But licenses intuitively defective reasoning.

  *   **D3 (Red-Table) Amplifies the Trilemma:**
      *   Allowing the Red-Table inference seems to conflict with blocking bootstrapping (D1) – both involve inferring the absence of a defeating alternative from the source's deliverance. Blocking it often requires sacrificing closure (D4) or risking skepticism.
      *   Blocking the Red-Table inference (to preserve D1) *without* sacrificing D5 requires explaining why perception yields knowledge of color but *not* of the absence of defeaters (via entailment), which pressures D4 or D6.
      *   A unified account (D7) is difficult precisely because of this tension.

  *   **The Most Excluding Requirement:** **D1 (Block Bootstrapping)** is the most powerful excluder. It is:
      *   **Fatal to Simple Reliabilism:** Reliabilism typically licenses bootstrapping (it *is* a reliable process to form beliefs about the gauge's accuracy based on its readings and then generalize).
      *   **The Key Challenge for Externalism:** Externalists must add structure (e.g., proper functionalism + defeat, sensitivity/ safety constraints, entitlement theories) to block D1 without collapsing into skepticism (D5) or ad-hocery (D6), often pressuring D4.
      *   **Central to Dogmatism's Problem:** Dogmatism (Pryor) easily allows the Red-Table inference (D3 allowed) and satisfies D4 & D5, but notoriously struggles to block bootstrapping (D1) without seeming ad hoc (D6).

  **Standard Treatments Scorecard:**

  | Treatment             | D1 (Block Bootstrap) | D2 (Permit Track-Record) | D3 (Red-Table Inference) | D4 (Closure) | D5 (Anti-Skepticism) | D6 (Non-Ad-Hoc) | D7 (Unified) |
  | :-------------------- | :------------------- | :----------------------- | :----------------------- | :----------- | :------------------- | :-------------- | :----------- |
  | **Simple Reliabilism**| ❌ (Allows)           | ✅                        | ✅ (Often Allows)         | ✅            | ✅                    | ~ (License is direct) | ~             |
  | **Dogmatism**         | ❌ (Struggles)        | ✅                        | ✅ (Allows)               | ✅            | ✅                    | ❌ (Distinction to D1 often seems ad hoc) | ❌             |
  | **Closure Denial**    | ✅                    | ✅                        | ❌ (Often Denies)         | ❌            | ✅                    | ✅/❌ (Core, but counterintuitive) | ~             |
  | **Skepticism/Prior Val.**| ✅                  | ❌ (Requires prior val.)  | ❌ (Requires prior val.) | ✅            | ❌                    | ✅ (Consequence) | ~             |
  | **Ideal Externalism?**| ✅                    | ✅                        | *Camp-Specific*          | *Often ✅*      | ✅                    | ✅               | ✅ (Goal)     |

  **Key:** ✅ = Satisfies, ❌ = Violates, ~ = Mixed/Depends, *Italic* = Varies within camp.

  **Conclusion:** An adequate theory must satisfy D1, D2, D3 (with explanation), D5, and D6. The primary obstacle is doing this while respecting D4 (Closure) without the distinction between D1 and D2/D3 feeling ad hoc. D1 (Blocking Bootstrapping) is the primary filter excluding standard externalist (reliabilist) and dogmatist views, forcing them to develop more sophisticated structures. Success requires navigating the trilemma of D1, D4, and D5, with D3 acting as a crucial test case for the theory's coherence and D6 ensuring its solution is principled.
