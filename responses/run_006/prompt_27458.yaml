  (3) To avoid such Dutch books, the agent must respect every logical entailment, i.e., be logically omniscient.

  (4) Logical omniscience is computationally impossible for any finite system.

  (5) Therefore, the Dutch book argument, taken to its logical conclusion, would make rational agency impossible.

  (6) So the Dutch book argument must be flawed.

  The key issue is whether the Dutch book theorem applies only to explicit representations or also to implicit logical relationships.

