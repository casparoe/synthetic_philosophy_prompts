prompt: |-
  I'm a senior investigator in my organization's internal compliance office. We regularly handle cases where multiple employees appear to have violated policy in coordination — bid-rigging, covering up a safety incident, coordinated harassment, collusive pricing — and whether they acted jointly or merely in parallel matters enormously for how we classify the conduct, who is accountable for what, and what sanctions apply. Right now, investigators rely on rough heuristics: if people communicated beforehand, we call it collusion; if they didn't, we call it coincidence. But communication isn't always documented, and sometimes people converge on the same misconduct without ever exchanging a word, while in other cases a shared understanding forms through nods, omissions, and half-sentences that leave no paper trail.

  I want a decision procedure my investigators can run — something grounded in what philosophy actually knows about shared intention and joint action, but usable by someone who has never read a word of action theory. It should be a sequence of questions to ask about the facts of a case, with clear stopping rules: where the procedure says "this is joint action," where it says "this is parallel individual action," and where it says "the facts don't settle it — escalate." For each question, give me the kinds of evidence that would count toward an answer (emails, meeting notes, patterns of behavior, testimony, timing, etc.) and what standard of proof each step requires.

  Then run the procedure on three cases:

  1. Three managers from different divisions submit nearly identical inflated expense reports in the same week, with no evidence they communicated. The amounts and categories match down to the line items, and all three attended the same compliance training two weeks earlier where the expense policy was discussed.

  2. Two engineers jointly falsify a test result: one suggests it verbally in a meeting with no recording, the other nods and later enters the false data. The first denies ever suggesting it; the second says they only acted because they believed the first had authority to order it and that refusal would have been insubordination.

  3. A group of employees in a Slack channel complain about a supervisor. Over several days, the complaints escalate, and one person proposes filing a coordinated HR complaint using identical wording. Several agree with emoji reactions. Three actually file, using the suggested language. One files separately with their own wording but references the group's discussion in their submission. A fifth person, who never posted in the channel but read the entire thread, files a complaint the same week with different wording that nonetheless echoes the group's core allegations.

  Flag the points where the procedure requires a judgment call that no checklist can eliminate, and tell me honestly what it cannot do — for example, can it distinguish joint action from parallel action when all the evidence is circumstantial and the participants deny coordination? Does the procedure handle cases where the parties had different understandings of what they were jointly doing? And if the procedure draws a line that your own theory says is philosophically arbitrary but practically necessary, mark it as such.
reasoning: |-
  We are constructing a decision procedure based on philosophical theories of shared intention and joint action. Key philosophers here include Michael Bratman, Margaret Gilbert, and John Searle. 

  Bratman's theory of shared cooperative activity (from "Shared Cooperative Activity") emphasizes mutual responsiveness, commitment to joint activity, and commitment to mutual support. Gilbert's joint commitment theory (from "On Social Facts") requires a "pool of wills" formed by mutual agreement, creating obligations. Searle's collective intentionality (from "The Construction of Social Reality") focuses on collective intentions that are not reducible to individual intentions.

  The procedure will be a series of questions that build on these ideas, focusing on evidence that can be collected in a corporate setting.

  **Decision Procedure: Joint vs. Parallel Action**

  **Step 1: Check for Explicit Agreement**
     - Question: Is there direct evidence (written or recorded) of an explicit agreement to act together?
     - Evidence: Emails, chat logs, meeting minutes, recorded calls, signed documents, or credible testimony describing an explicit agreement.
     - Standard of Proof: Preponderance of the evidence (more likely than not).
     - Outcome: 
          - If yes → Joint action (escalate for sanctions as collusion).
          - If no → Proceed to Step 2.

  **Step 2: Check for Implicit Agreement through Communication**
     - Question: Even without explicit agreement, is there evidence of communication that implies a mutual understanding of a joint plan?
     - Evidence: Indirect communications (e.g., vague messages, suggestive language, non-verbal cues in meetings) that, in context, indicate coordination. Also, patterns of communication (timing, frequency) that suggest coordination.
     - Standard of Proof: Preponderance of the evidence, but note that ambiguity may require inference.
     - Outcome:
          - If yes → Joint action.
          - If no → Proceed to Step 3.

  **Step 3: Check for Mutual Responsiveness in Action**
     - Question: Did the parties adjust their actions in response to each other in a way that indicates a shared plan?
     - Evidence: Timing of actions (e.g., sequential actions that build on each other), modifications of behavior that only make sense if responding to another's actions, testimony about why actions were taken (if available).
     - Standard of Proof: Preponderance of the evidence. This step requires inference from behavior.
     - Outcome:
          - If yes → Joint action.
          - If no → Proceed to Step 4.

  **Step 4: Check for Common Knowledge of Interdependence**
     - Question: Did each actor know that the success of their own action depended on the actions of the others, and did they know that the others knew this?
     - Evidence: The structure of the situation (e.g., bid-rigging requires multiple bidders to submit non-competitive bids), communications that show awareness of others' roles, testimony about understanding of the situation.
     - Standard of Proof: Preponderance of the evidence. This step is critical for distinguishing parallel from joint action in the absence of communication.
     - Outcome:
          - If yes → Joint action.
          - If no → Proceed to Step 5.

  **Step 5: Check for Convergence without Interdependence**
     - Question: Did the actors arrive at the same action independently, without relying on each other?
     - Evidence: Common external influences (e.g., same training, same instructions, same environmental pressures) that explain parallel behavior, lack of any evidence of communication or responsiveness, testimony about independent decision-making.
     - Standard of Proof: Preponderance of the evidence.
     - Outcome:
          - If yes → Parallel individual action.
          - If undetermined → Proceed to Step 6.

  **Step 6: Ambiguity Resolution**
     - Question: After Steps 1-5, is the evidence still ambiguous?
     - Evidence: All collected evidence is inconclusive, and there are roughly equal reasons to believe in both joint and parallel action.
     - Outcome:
          - If ambiguous → Escalate for further investigation (or higher-level review).
          - Otherwise, the prior step should have determined the outcome.

  **Limitations and Judgment Calls:**
     - **Circumstantial Evidence and Denials**: The procedure may not resolve cases where evidence is entirely circumstantial and participants deny coordination. In such cases, the procedure will likely lead to Step 6 (escalation). The procedure cannot read minds; it relies on available evidence.
     - **Differing Understandings**: The procedure (especially Step 4) requires that the actors had a shared understanding of interdependence. If one thought they were acting jointly and the other did not, then joint action might not hold. This is a judgment call based on testimony and context.
     - **The Line in Step 4**: The distinction between common knowledge of interdependence (joint) and mere parallel action (individual) can be philosophically arbitrary in borderline cases. We draw it because without evidence of mutual responsiveness or communication, it is practically necessary to avoid over-attributing joint action.

  Now, let's apply the procedure to the three cases.

  ---

  **Case 1: Three managers submit nearly identical inflated expense reports**

  - Step 1: No evidence of explicit agreement → Proceed.
  - Step 2: No evidence of communication (emails, etc.) → Proceed.
  - Step 3: Mutual responsiveness? The actions are nearly simultaneous and identical, but there's no indication that one adjusted in response to another. The identical line items might suggest a common source, but not necessarily mutual responsiveness → Proceed.
  - Step 4: Common knowledge of interdependence? The expense reports are individual acts. There's no indication that the success of one manager's inflation depended on the others doing the same. They might have been independently inspired by the same training (which discussed policy, perhaps highlighting loopholes) → No interdependence → Proceed to Step 5.
  - Step 5: Convergence without interdependence? The common training two weeks earlier is a plausible common influence that explains the parallel behavior. The identical amounts and categories are consistent with having learned the same method. Without evidence of coordination, this points to parallel action.
  - Outcome: Parallel individual action.

  **Judgment Call**: The high similarity could be interpreted as evidence of communication (Step 2) if the training did not provide a template. But without any communication evidence, we rely on the common cause. If the training did not cover the specific inflated categories, then Step 5 might be less clear, but the training is still a common influence. This case might be escalated if the similarity is too striking to be coincidental, but the procedure as designed would call it parallel.

  ---

  **Case 2: Two engineers falsify a test result**

  - Step 1: No explicit written agreement. The verbal suggestion and nod are not recorded → Proceed.
  - Step 2: Implicit agreement? The first engineer's verbal suggestion and the second's nod in a meeting. Even without recording, testimony exists (though conflicting). The nod in context of a meeting about the test could be seen as non-verbal agreement. The second engineer's testimony that they believed it was an order complicates it. However, the act of nodding in response to a suggestion of falsification, followed by execution, implies a mutual understanding of a plan → Evidence of implicit agreement (preponderance: more likely than not that the nod indicated agreement to act jointly).
  - Outcome: Joint action (due to Step 2).

  **Judgment Call**: The second engineer claims they felt coerced. But the procedure at Step 2 only asks if there was communication implying a mutual understanding. The nod and subsequent action suggest that. However, if the first engineer had authority, then the second might be acting under duress (not joint). But joint action can occur under hierarchy. The key is whether they both understood they were acting together. The second engineer's testimony that they believed it was an order might break the mutuality. This is a gray area. 

  The procedure would note: 
     - The nod and the subsequent action are evidence of implicit agreement (Step 2 meets the standard). 
     - But the second engineer's state of mind (believing it was an order) might mean they did not see it as a joint action but as following an order. This could be a case of differing understandings. 

  However, the procedure does not require equal participation. In hierarchical contexts, joint action can still occur if both are committed to the joint activity (even if one is leading). The denial by the first engineer and the second's claim of coercion might lead to escalation if the evidence is contested. But based on the facts, we have:
     - Suggestion (by first) and nod (by second) → communication of a plan, and then execution by the second. This is sufficient for Step 2. 

  Thus, we classify as joint action.

  ---

  **Case 3: Slack channel and HR complaints**

  We break down the actors:
     - A: The person who proposed coordinated complaint with identical wording.
     - B: Several who agreed with emoji.
     - C: Three who filed using the suggested language.
     - D: One who filed separately with own wording but referenced the group.
     - E: Fifth person who read without posting and filed with different wording.

  We must consider each actor in relation to the joint action.

  **The Proposed Joint Action**: Filing coordinated HR complaints.

  **For A, B, C, D, E**:

  - Step 1: Explicit agreement? The proposal by A and the emoji agreements (B) are explicit in the Slack channel. This is written evidence. The agreement is for coordinated filing → For A, B, and C (who filed as agreed): explicit agreement. For D: they filed separately and referenced the group, but not identically. They did not explicitly agree to the identical wording plan. For E: no explicit agreement (they didn't post).

    So for A, B, C: Joint action (via Step 1). For D and E: Proceed.

  - For D and E, we consider separately.

  **For D** (filed separately with own wording but referenced group discussion):
     - Step 1: No explicit agreement to the coordinated plan (they didn't agree via emoji? The case says "several agreed" and then three filed. We don't know if D was one of the emoji reactors. Assuming D did not explicitly agree (they filed separately and with their own wording) → Proceed.
     - Step 2: Implicit agreement? D referenced the group's discussion in their submission, showing they were part of the conversation. But they did not adopt the identical wording. This might show they were aware of the joint plan but chose not to fully join. Without evidence of implicit agreement (like a private message), we cannot say they implicitly agreed to the joint action → Proceed.
     - Step 3: Mutual responsiveness? D filed around the same time and referenced the group, which might show they were influenced by the group. But they did not follow the plan. Their action is responsive in a general way but not in the specific coordinated manner → Not enough for mutual responsiveness to the joint plan → Proceed.
     - Step 4: Common knowledge of interdependence? The success of the coordinated complaint (using identical wording) did not depend on D's action. D's complaint was independent. D might have known of the joint plan but did not rely on it → No interdependence → Proceed to Step 5.
     - Step 5: Convergence without interdependence? D's complaint was influenced by the group (they reference it) but not interdependent. They acted individually, inspired by the group → Parallel individual action.

  **For E** (read without posting, filed same week with different wording):
     - Step 1: No explicit agreement → Proceed.
     - Step 2: No communication from E → Proceed.
     - Step 3: Mutual responsiveness? E read the thread and filed, but there's no evidence E adjusted their actions in response to others. They used different wording → Proceed.
     - Step 4: Common knowledge of interdependence? E was not part of the Slack conversation. They might have known about the group's plan (by reading) but their action did not depend on the others. The group's plan did not depend on E → No → Proceed to Step 5.
     - Step 5: Convergence without interdependence? E was influenced by reading the Slack thread, so they converged on the idea of complaining, but without coordination → Parallel individual action.

  **Summary for Case 3**:
     - A, B, C: Joint action (explicit agreement in Slack).
     - D: Parallel individual action.
     - E: Parallel individual action.

  **Judgment Call**: The emoji reactions are explicit agreements? In digital communication, an emoji (like a thumbs-up) can be explicit agreement. But if the emoji were ambiguous (e.g., a "like"), it might not be. The procedure assumes emoji reactions in context of agreement are explicit. Also, for D and E, the line is drawn at explicit agreement. Without it, they are parallel even if inspired.

  ---

  **Overall Limitations**:
     - The procedure cannot definitively resolve cases with no evidence and conflicting testimony. It will often escalate these.
     - It may not capture subtle forms of joint action where there is mutual responsiveness but no communication (e.g., tacit collusion in economics). Step 4 (interdependence) is meant to catch that, but it is hard to prove without communication.
     - The procedure assumes that the investigators can gather sufficient evidence. In practice, if evidence is missing, escalation is necessary.
     - The distinction between joint and parallel action is sometimes arbitrary, especially in Step 4. But the procedure provides a structured way to make the call.

  This procedure is grounded in philosophy (shared intention requires mutual commitment and responsiveness) but simplified for practical use.
answer: |-
  ### Decision Procedure: Joint Action vs. Parallel Individual Action  
  Based on philosophical frameworks (e.g., Bratman's *shared cooperative activity*, Gilbert's *joint commitment*, and Searle's *collective intentionality*), this procedure uses a sequential checklist to classify conduct. It prioritizes **mutual responsiveness**, **interdependence of intentions**, and **common knowledge** as key markers of joint action.  

  **Key Standards of Proof**:  
  - **Preponderance of evidence** (51% likelihood) for all steps unless noted.  
  - **Clear and convincing evidence** (75% likelihood) for high-stakes conclusions (e.g., joint action sanctions).  

  **Procedure Steps**:  
  1. **Evidence of Explicit Agreement**  
     - *Question*: Is there direct evidence of an explicit agreement (written, verbal, or digital) to act together?  
     - *Evidence*: Emails, chat logs, meeting recordings, signed documents, credible testimony.  
     - *Stopping Rule*:  
       - **Yes** → *Joint action*. Escalate for collusion sanctions.  
       - **No** → Proceed to Step 2.  

  2. **Evidence of Implicit Agreement**  
     - *Question*: Is there indirect evidence of a mutual understanding (e.g., coded language, non-verbal cues, contextual patterns) suggesting coordination?  
     - *Evidence*: Meeting notes (e.g., "nods," "winks"), ambiguous Slack messages, timing of actions, testimony about unrecorded conversations, behavioral patterns (e.g., repeated coincidences).  
     - *Stopping Rule*:  
       - **Yes** → *Joint action* (requires clear and convincing evidence due to subjectivity).  
       - **No** → Proceed to Step 3.  

  3. **Mutual Responsiveness**  
     - *Question*: Did actors adjust their behavior in real-time based on others’ actions, indicating interdependence?  
     - *Evidence*: Sequence of events (e.g., Person A acts, then Person B reacts), revisions to documents/plans after interaction, testimony about real-time adjustments.  
     - *Stopping Rule*:  
       - **Yes** → *Joint action*.  
       - **No** → Proceed to Step 4.  

  4. **Interdependence of Outcomes**  
     - *Question*: Did the success of one person’s action *depend* on others acting similarly?  
     - *Evidence*: Task design (e.g., bid-rigging requires multiple participants), financial/operational reliance (e.g., collusive pricing fails if one defects), testimony about incentives.  
     - *Stopping Rule*:  
       - **Yes** → *Joint action* (even without communication).  
       - **No** → Proceed to Step 5.  

  5. **Common Knowledge of Shared Intent**  
     - *Question*: Did actors know others were acting similarly, and know that others knew (creating shared awareness)?  
     - *Evidence*: Public statements (e.g., "we all know what to do"), group meetings, accessible chat threads, cultural norms (e.g., "everyone does this here").  
     - *Stopping Rule*:  
       - **Yes** → *Joint action*.  
       - **No** → Proceed to Step 6.  

  6. **Plausible Independent Motivation**  
     - *Question*: Is there a strong alternative explanation for parallel actions (e.g., common training, identical instructions, external pressure)?  
     - *Evidence*: Training materials, policies, environmental factors (e.g., budget cuts), testimony about individual motives.  
     - *Stopping Rule*:  
       - **Yes** → *Parallel individual action*.  
       - **Unclear/No** → *Escalate* for deeper review.  

  **Final Escalation Trigger**: Ambiguity after Step 6 → Escalate to senior leadership/legal.  

  ---  
  ### Limitations and Judgment Calls  
  - **What the procedure cannot do**:  
    - **Prove joint action without evidence**. If all evidence is circumstantial and participants deny coordination, the procedure defaults to escalation (Step 6). Philosophy recognizes that joint action *can* exist without documentation (e.g., Gilbert’s "plural subject"), but proving it requires inference.  
    - **Resolve conflicting understandings**. If parties had different perceptions (e.g., one believed they were collaborating, the other felt coerced), the procedure may misclassify. Step 4 (interdependence) is the best tool here, but it relies on subjective interpretation.  
    - **Handle "tacit" collusion definitively**. Economists note that parallel action can *become* joint through repeated alignment (e.g., price-fixing without communication). The procedure treats this as parallel unless interdependence (Step 4) or common knowledge (Step 5) is proven.  
  - **Philosophically arbitrary but practical lines**:  
    - **Step 2 (Implicit Agreement)**: A "nod" may be weak evidence philosophically (Bratman requires stronger mutual commitment), but it is included for practicality.  
    - **Step 5 (Common Knowledge)**: Searle’s collective intentionality could theoretically exist without explicit knowledge, but the procedure requires evidence to avoid overreach.  

  ---  
  ### Application to Cases  

  #### **Case 1: Inflated Expense Reports**  
  - **Step 1 (Explicit Agreement)**: No evidence of communication → *No*.  
  - **Step 2 (Implicit Agreement)**: No emails/chats; contextual training may imply shared inspiration but not coordination → *No*.  
  - **Step 3 (Mutual Responsiveness)**: Simultaneous submissions; no adjustments based on others → *No*.  
  - **Step 4 (Interdependence)**: No mutual reliance (one manager’s fraud doesn’t affect others’ success) → *No*.  
  - **Step 5 (Common Knowledge)**: Training was group-based, but no evidence they knew others would cheat → *No*.  
  - **Step 6 (Independent Motivation)**: Identical training explains parallel behavior → *Yes*.  
  - **Conclusion**: **Parallel individual action**.  

  #### **Case 2: Falsified Test Result**  
  - **Step 1 (Explicit Agreement)**: Verbal suggestion + nod; no recording → *No* (lacks documentation).  
  - **Step 2 (Implicit Agreement)**: Nod in meeting + subsequent action implies mutual understanding. *Evidence*: Testimony about the nod and entry of false data.  
    - **Judgment Call**: The nod is weak evidence, but paired with action, meets *clear and convincing* standard for implicit agreement. Engineer 2’s claim of coercion doesn’t negate joint intent (Gilbert: joint action can include hierarchy). → **Yes**.  
  - **Conclusion**: **Joint action** (via Step 2).  

  #### **Case 3: Coordinated HR Complaint**  
  - **Actors**:  
    - **A (Proposer)**, **B (Emoji Reactors)**, **C (Identical Filers)**, **D (Separate Filer Referencing Group)**, **E (Silent Reader Filer)**.  
  - **Analysis**:  
    - **A, B, C**:  
      - Step 1: Explicit agreement via Slack proposal and emoji reactions → **Yes** → *Joint action*.  
    - **D (Referenced Group)**:  
      - Step 1: No emoji/reply → *No*.  
      - Step 2: Slack reference shows awareness but not coordination → *No*.  
      - Step 5: Knew of group intent → *Yes* → *Joint action* (via shared awareness).  
    - **E (Silent Reader)**:  
      - Step 1: No interaction → *No*.  
      - Step 2: No participation → *No*.  
      - Step 5: No evidence they knew others knew → *No*.  
      - Step 6: Group discussion plausibly inspired independent action → *Yes* → *Parallel action*.  
  - **Conclusion**:  
    - A, B, C, D: **Joint action** (D via Step 5).  
    - E: **Parallel individual action**.  
    - **Judgment Call**: D’s outcome is borderline. Philosophically, referencing the group may not imply joint commitment (Bratman requires mutual responsiveness), but practically, it shows common knowledge.  

  ---  
  ### Final Notes  
  - **When Escalation is Critical**:  
    - Denials with circumstantial evidence (e.g., Case 1 if training was ambiguous).  
    - Conflicting understandings (e.g., Case 2 if coercion was proven).  
  - **Training Investigators**: Emphasize that **mutual responsiveness** (Step 3) and **interdependence** (Step 4) are the most reliable indicators of joint action when communication is absent. Philosophy supports this (Bratman: "mesh of plans").  
  - **Tool Supplement**: Pair this with data analytics (e.g., Slack metadata, timing patterns) to reduce ambiguity.  

  This procedure systematizes heuristics while flagging its limits—ensuring consistency without overclaiming objectivity.
