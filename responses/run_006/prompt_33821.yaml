  Another area is higher-order vagueness. Epistemicism treats borderline cases as having a definite truth value, though unknowable, so statements about someone being borderline bald would be either true or false. Supervaluationism, however, might not have a definite truth value for such statements due to varying precisifications, leading to truth-value gaps at higher levels.

  The user might also be questioning whether these theories are substantively different or just semantic variations. The examples show that they do make different predictions about specific statements, proving they're not just different stories but have distinct ontological commitments. Epistemicism is realist about cutoffs, while supervaluationism is more pluralistic.

