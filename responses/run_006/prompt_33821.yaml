  First, I need to recall the core tenets of both theories. Epistemicism asserts that vague predicates have sharp cutoffs, but we can't know where they are due to our epistemic limitations. Supervaluationism, on the other hand, denies a single cutoff. Instead, it considers multiple precisifications, and a statement is true only if it holds in all admissible precisifications. Both maintain classical logic, but their mechanisms differ.

