prompt: |-
  I've been reading about theories of vagueness and I'm stuck on the difference between epistemicism and supervaluationism. Both seem to want to keep classical logic intact, unlike fuzzy logic or degree theories. But they go about it in completely opposite ways — epistemicism says there IS a sharp cutoff for "bald" or "heap," we just can't know where it is, while supervaluationism says there's no single sharp cutoff but we can precisify the term in multiple admissible ways and a sentence is true only if it holds on all of them. What I don't get is: if both preserve classical logic, do they actually make different predictions about any cases? Like, is there a concrete example where they'd disagree about the truth value of some sentence involving a vague predicate? And if they never disagree, are they actually different theories or just different stories about the same underlying formal structure? Basically, compare them and tell me where the rubber meets the road — or doesn't.
