prompt: |-
  You are a professional philosopher working in formal epistemology and the philosophy of probability. Please think through the problem carefully, and begin by brainstorming candidate requirements and the cases that motivate them before you settle on your final list.

  I want a specification of what an adequate theory of deference to objective chance must do. I keep seeing this debate conducted one counterexample at a time, and I would like the full list of requirements first. The job of the theory, as I am conceiving it, is to explain how and when a rational agent's credences should be constrained by facts about objective chance, well enough to underwrite the role chance plays in science and in decision-making under uncertainty. If you think that is the wrong job for such a theory, say what the right job is and defend it briefly.

  Write the desiderata: the phenomena any such theory must capture, the cases it must get right, the distinctions it must not collapse, and the formal results it must be consistent with. For each requirement, give the case or consideration that makes it a requirement rather than a mere preference. In particular, make sure the list speaks to at least the following:

  - the basic deference intuition, roughly that learning the chance of A is x, and nothing else that bears on A, should make your credence in A equal x;
  - ordinary chance setups with well-defined probabilities, and the case in which you are uncertain what the chance value is, so that your credence is spread over possible chance values;
  - higher-order chances and the chance of chance;
  - the time-relativity of chance, including the difference between the chance of a past event and the chance of a future event, and how chance at one time relates to chance at a later time;
  - evidence that is inadmissible, such as future information, information about the outcome itself, and the crystal-ball case;
  - the undermining-future problem that arises if chance is understood along broadly Humean lines, and the question whether the complete chance theory is itself admissible evidence;
  - the relation of the deference norm to Bayesian conditionalization and to the probability axioms;
  - a principled account of which evidence is admissible, one that does not reduce the principle to vacuity by letting any recalcitrant evidence simply be declared inadmissible.

  Mark which requirements are non-negotiable and which are only the preferences of particular camps, such as compatibility with Humean supervenience versus taking chance as primitive. Then give me the part I care about most: identify any subset of these requirements that cannot be jointly satisfied, and say exactly which requirement must be relaxed, and what the main options are for relaxing it, for example revising the deference principle, restricting the admissible evidence, or giving up Humeanism. Do not merely gesture at the tension; show precisely why the requirements collide.

  Finally, tell me which single requirement does the most work in eliminating candidate theories, and then give a brief scorecard: how do the original Principal Principle associated with Lewis and the New Principle associated with Hall fare against your list? Keep the scorecard short, since the criteria and their motivation are the main deliverable.
reasoning: |-
  We are to specify the desiderata for an adequate theory of deference to objective chance. The theory should explain how rational credences are constrained by objective chances, supporting the role of chance in science and decision-making. I'll start by brainstorming the requirements, motivated by specific cases, and then organize them into a list. After that, I'll identify tensions and evaluate existing principles.

  ### Brainstorming Candidate Requirements and Motivating Cases

  1. **Basic Deference (Direct Reflection)**: 
     - *Requirement*: Upon learning that the chance at time t of event A is x, and having no other relevant information (especially no inadmissible evidence), a rational agent sets their credence in A to x.
     - *Motivating Case*: Consider a fair coin about to be tossed. If you learn that the chance of heads is 0.5, then your credence in heads should become 0.5. This is the core intuition.

  2. **Uncertainty about Chance Values**:
     - *Requirement*: When an agent is uncertain about the chance of A (i.e., they have a credence distribution over possible chance values), their credence in A should be the expectation of the chance of A.
     - *Motivating Case*: Suppose you know that a coin is either fair (chance of heads=0.5) or biased (chance=0.8), with equal credence. Then your credence in heads should be (0.5 * 0.5 + 0.5 * 0.8) = 0.65.

  3. **Time-Relativity of Chance**:
     - *Requirement*: The chance of an event is relative to a time. For a future event, the chance can be non-trivial (between 0 and 1), but for a past event, the chance is either 0 or 1 (if we assume determinism) or at least fixed by the past (in indeterministic cases). Also, the chance at a later time must be consistent with the chance at an earlier time and the intervening history.
     - *Motivating Case*: Consider a coin toss that has already occurred but the outcome is unknown to you. The chance of heads now is either 0 or 1 (if the coin toss is in the past). But if the toss is in the future, the chance might be 0.5. Additionally, if at time t1 the chance of A at t2 (t2>t1) is x, and then at t2 the chance of A becomes y, then if no event between t1 and t2 affects A, we expect x=y. But if something happens in between, the chance can change.

  4. **Higher-Order Chances**:
     - *Requirement*: The theory must handle statements about the chance of chance statements. For instance, what should your credence be if you learn that there is a chance of 0.5 that the chance of A is 0.6?
     - *Motivating Case*: Consider a chance device that produces other chance devices. For example, an urn contains two types of dice, one fair and one biased. You draw a die at random. The chance that you draw a fair die is 0.5. Then the chance of rolling a six with the drawn die is either 1/6 (if fair) or 1/3 (if biased). The overall chance of six is (0.5 * 1/6 + 0.5 * 1/3) = 0.25. But also, we must be able to express the chance that the chance of six is 1/6 (which is 0.5) and so on.

  5. **Inadmissible Evidence**:
     - *Requirement*: The theory must account for evidence that defeats the mandate to defer to chance. This includes information about the future (beyond what the chance function encodes), information about the outcome itself, and "crystal ball" evidence (direct revelation of the outcome). The principle should specify when evidence is admissible and when it is not.
     - *Motivating Case (Future Information)*: Suppose you learn that the chance of rain tomorrow is 0.3. But then you also get a reliable weather forecast (which you trust) that says it will rain. Then you should not set your credence to 0.3. This future-oriented evidence is inadmissible. Similarly, if you learn the outcome (e.g., it rained), then your credence should be 1, not 0.3. The crystal ball case: a wizard tells you the outcome.

  6. **Undermining Futures (for Humean Chance)**:
     - *Requirement*: If chance is Humean (i.e., supervenes on the total pattern of events in the world, including the future), then a complete chance theory might be undermined by the very outcomes it assigns chances to. The theory must handle this without inconsistency.
     - *Motivating Case (Humean Undermining)*: Suppose the chance theory T is true and assigns a positive chance to a future event F that, if it occurred, would make T false (because the total pattern of events would no longer support T). Then, if you condition on T, you must assign a positive credence to F, but if F occurs, T is false. This leads to a contradiction if we try to set credence in F to the chance given by T.

  7. **Compatibility with Bayesian Framework**:
     - *Requirement*: The deference principle should be compatible with the axioms of probability and with Bayesian conditionalization as a way of updating credences.
     - *Motivating Case*: The agent's credences must satisfy the probability axioms to be coherent. Also, when learning chance statements, the update should be by conditionalization.

  8. **Principled Account of Admissibility**:
     - *Requirement*: The account of what evidence is admissible must not be ad hoc. It should be defined in a way that does not trivialize the principle (e.g., by declaring any evidence that conflicts with chance as inadmissible). A common approach is to tie admissibility to being "about the past and present" relative to the time of the chance, but that may need refinement.
     - *Motivating Case*: Without a principled account, we could always avoid conflict by declaring any evidence that doesn't fit the chance to be inadmissible, making the principle empty.

  ### Formalizing the Requirements

  We can now list the desiderata more formally.

  **Desiderata for an Adequate Theory of Deference to Chance**

  1. **Direct Deference (DD)**: 
     - *Requirement*: For any proposition A and time t, if an agent at time t learns that the chance at t of A is x and no other inadmissible evidence (with respect to A and t), then the agent's credence in A should be x.
     - *Motivation*: Basic intuition about chance guiding credence (coin toss).
     - *Status*: Non-negotiable.

  2. **Expectation Deference (ED)**:
     - *Requirement*: If the agent is uncertain about the chance of A, then their credence in A should equal the expected chance of A. That is, Cr(A) = ∑_{ch} Cr(ch) * ch(A), where ch ranges over chance functions and Cr(ch) is the credence that ch is the true chance function.
     - *Motivation*: Uncertainty about chance (fair or biased coin).
     - *Status*: Non-negotiable (follows from DD and the laws of probability).

  3. **Time-Relativity (TR)**:
     - *Requirement*: (a) Chance is time-relative: ch_t(A) is defined relative to time t. (b) For a past event A (at a time before t), ch_t(A) is either 0 or 1 (if the event is determined) or fixed by the past. (c) The chance at a later time must be consistent with the history up to that time and the chance at an earlier time. In particular, if no new event occurs that affects A, then chance should not change arbitrarily.
     - *Motivation*: Past events have trivial chances; future events may not. Also, the chance of a future event can change over time as new events occur.
     - *Status*: Non-negotiable (follows from the concept of chance).

  4. **Higher-Order Chance (HOC)**:
     - *Requirement*: The principle must be applicable to propositions about chance, including nested chance statements. The agent's credence should respect the expected chance even when the chance is uncertain and the uncertainty is described by chance.
     - *Motivation*: Chance devices that produce other chance devices (urn of dice).
     - *Status*: Non-negotiable (for a complete theory).

  5. **Inadmissible Evidence (IE)**:
     - *Requirement*: The principle must specify that certain kinds of evidence (e.g., about the future beyond what the chance function encodes, or about the outcome itself) are inadmissible and hence prevent the direct application of the chance value. The principle must still tell the agent how to update in the presence of such evidence.
     - *Motivation*: Crystal ball case, future forecasts.
     - *Status*: Non-negotiable.

  6. **Handling Undermining (for Humeanism) (HU)**:
     - *Requirement*: If chance is Humean, the principle must avoid the inconsistency that arises from the possibility of undermining futures. In particular, the complete chance theory T (which is a proposition about the entire pattern of events) must be handled in a way that respects the chances it assigns even though T itself might be undermined by the occurrence of events it assigns positive chance to.
     - *Motivation*: The undermining problem for Humean theories of chance.
     - *Status*: Non-negotiable for Humeans, but not required for non-Humeans.

  7. **Bayesian Compatibility (BC)**:
     - *Requirement*: The deference principle must be expressible within the Bayesian framework: the agent's credences are a probability function, and updating is by conditionalization.
     - *Motivation*: Coherence and standard norms of rationality.
     - *Status*: Non-negotiable.

  8. **Principled Admissibility (PA)**:
     - *Requirement*: The set of admissible evidence must be defined in a principled and non-circular way. A common proposal is that admissible evidence at time t is evidence about events up to time t (the past and present). However, this may require refinement to handle cases like the chance of past events (where we might have new historical evidence) and to account for the fact that the chance function itself may encode some information about the future (in indeterministic worlds).
     - *Motivation*: Without this, the principle is vacuous.
     - *Status*: Non-negotiable.

  ### Tensions and Conflicts

  The main tension arises between **Handling Undermining (for Humeanism)** and the **Direct Deference** and **Expectation Deference** when combined with the **Principled Admissibility** (using the common definition of admissibility as past and present).

  - **The Undermining Problem**: 
    - In a Humean framework, the chance theory T supervenes on the entire history of the world, including the future. Now, consider a possible future F that is inconsistent with T (i.e., if F occurs, then T is false). The Humean might assign a positive chance to F: ch_T(F) = x > 0. 
    - By the Direct Deference principle, if we condition on T (and no inadmissible evidence), our credence in F should be x. 
    - However, T entails that F does not occur (because if T is true, then the pattern of events is such that F is not the case). So conditioning on T, we have that F is false. Hence, we must have Cr(F | T) = 0. 
    - This contradicts the requirement that Cr(F | T) = x>0.

  Thus, we have a contradiction. The requirements that lead to this are:
  - Direct Deference (DD)
  - The admissibility of the chance theory T (if we consider T to be admissible, as it is about the pattern of events, which for Humeans is a global fact that may be determined by the entire history, including the future)
  - The Humean supervenience thesis (which makes T incompatible with F in the undermining case)

  **Resolution Options**:

  1. **Revise the Deference Principle**: Instead of the original Principal Principle, use the New Principle (also called the Principal Principle Revised). The New Principle says: 
     - Cr(A | T) = ch_T(A | T)
     - Note: ch_T(A | T) is the chance that A given T, according to T. But note that T is a theory that specifies the entire chance function, so ch_T(·|T) is defined. In the undermining case, ch_T(F | T) might be 0, because T entails not-F. Then we avoid the contradiction.

  2. **Restrict Admissibility**: Declare that the chance theory T is inadmissible. But then we cannot condition on T and use the chance it gives? That would break the principle. Alternatively, we might say that T is admissible only if it is not undermined. But this seems ad hoc.

  3. **Give up Humeanism**: If chance is not Humean but primitive (or not supervening on the entire future), then T does not supervene on the future in a way that makes F undermine T. Then T and F might be compatible? But this is a major metaphysical shift.

  The most popular solution in the literature is to adopt the New Principle (option 1). This is what Lewis and Hall proposed.

  ### Identifying the Most Demanding Requirement

  The requirement that does the most work in eliminating candidate theories is **Handling Undermining (for Humeanism)**. For Humean theories, without a fix, the original Principal Principle leads to inconsistency. Hence, the New Principle is required for Humeans.

  ### Scorecard: Original Principal Principle vs. New Principle

  - **Original Principal Principle (PP)** [Lewis 1980]:
     - Formulation: Cr(A | H_t T) = ch_T(A)
       - H_t: the history up to time t.
       - T: the complete theory of chance (true at the world).
       - ch_T: the chance function according to T.
     - Satisfies:
       - DD: Yes, if we have H_t and T and no other evidence.
       - ED: Yes, by the law of total probability.
       - TR: By incorporating H_t, it respects time-relativity (since H_t is the past and present).
       - HOC: In principle, but may have issues with higher-order chances without adjustment.
       - IE: By using H_t as admissible, it excludes future evidence.
       - HU: **Fails** because of undermining.
       - BC: Yes, it is a constraint on conditional credences.
       - PA: It uses H_t (history up to t) as admissible, which is principled.

  - **New Principle (NP)** [Hall 1994, Lewis 1994]:
     - Formulation: Cr(A | T) = ch_T(A | T)
       - But note: this must be combined with the history. A common formulation is: Cr(A | H_t T) = ch_T(A | T)
       - Why? Because T alone does not determine the chance at t without the history (since chance is time-relative). Actually, T and H_t together determine the chance function at t, so we can write ch_{T,H_t}(A) = ch_T(A | H_t). But in the NP, we set Cr(A | H_t T) = ch_T(A | T). However, note that ch_T(A | T) might be problematic because T is a theory and not an event in the chance space. Alternatively, we can think of T as a proposition. Then, the chance function ch_T is defined only if T is true. And ch_T(A | T) is the chance of A conditional on T. But note that if T is true, then ch_T(T)=1? Not exactly: T is a proposition about the entire world. In the NP, we consider the chance of A given T, which for the true T should be the same as the chance of A (if T is true) because T is settled? Actually, the problem is that ch_T(T) is not 1 if T is a contingent truth that might be undermined. The New Principle avoids the undermining problem by conditioning on T within the chance function.
     - Satisfies:
       - DD: Yes, but in a modified form: it defers to the conditional chance.
       - ED: Yes.
       - TR: By using H_t, it respects time.
       - HOC: Handles higher-order chances naturally.
       - IE: Same as PP.
       - HU: **Satisfies** because in the undermining case, ch_T(F | T) = 0 (since T entails not-F), so Cr(F | T) = 0, which is consistent with T entailing not-F.
       - BC: Yes.
       - PA: Same as PP.

  ### Summary of Scorecard

  - **Original Principal Principle (PP)**: Fails on HU (undermining) but satisfies the others. It is adequate for non-Humean chance or in worlds without undermining, but not for Humean chance in general.
    
  - **New Principle (NP)**: Satisfies all, including HU. It is the fix for Humean chance. However, note that NP requires that the chance function be defined conditionally on the chance theory itself, which might be seen as complex. Also, in non-Humean settings, it might be equivalent to PP if there is no undermining.

  ### Final Note

  The list of requirements is demanding, and the tension between Humeanism and the deference principle (without the fix) is the central challenge. The New Principle resolves it and thus is the current standard in formal epistemology for Humean chance.
answer: |-
  ### Desiderata for a Theory of Deference to Objective Chance  
  The core job of the theory is to explain how rational credences are constrained by objective chance in a way that supports scientific practice (e.g., guiding predictions and explanations) and decision-making (e.g., under objective uncertainty). This requires a bridge between chance as a metaphysical feature of the world and credence as an epistemic norm. Below, I present desiderata motivated by cases and formal considerations, marking non-negotiable requirements (NN) and camp-specific preferences (CSP).  

  #### **1. Basic Deference Intuition (NN)**  
     - **Requirement**: Upon learning *only* that the chance of proposition \(A\) at time \(t\) is \(x\) (and no other evidence bearing on \(A\)), a rational agent’s credence in \(A\) should be \(x\).  
     - **Motivating Case**: A fair coin is tossed at \(t\). Learning that \(\textit{ch}_t(\text{heads}) = 0.5\) (with no other information) should make your credence in heads 0.5.  
     - **Why Non-Negotiable**: Without this, chance cannot play its core role in guiding uncertain agents.  

  #### **2. Handling Uncertain Chance (NN)**  
     - **Requirement**: When an agent is uncertain about the chance of \(A\) (i.e., has a credence distribution over possible chance values), their credence in \(A\) should be the *expectation* of the chance: \(Cr(A) = \sum_{x} Cr(\textit{ch}_t(A) = x) \cdot x\).  
     - **Motivating Case**: You know a coin is biased but are unsure if \(\textit{ch}_t(\text{heads}) = 0.6\) (50% credence) or \(0.7\) (50% credence). Your credence in heads should be \(0.65\).  
     - **Why Non-Negotiable**: Follows from probability axioms and basic deference; required for statistical inferences.  

  #### **3. Time-Relativity of Chance (NN)**  
     - **Requirements**:  
       - (a) Chance values depend on time: \(\textit{ch}_t(A)\) is defined relative to \(t\).  
       - (b) Past events have trivial chances: If \(A\) describes an event before \(t\), \(\textit{ch}_t(A)\) is 0 or 1.  
       - (c) Chance evolves: \(\textit{ch}_{t'}(A)\) for \(t' > t\) must incorporate history between \(t\) and \(t'\).  
     - **Motivating Cases**:  
       - *(Past)*: After a coin toss (outcome unknown), \(\textit{ch}_t(\text{heads})\) is 0 or 1, even if you don’t know which.  
       - *(Future)*: The chance of rain tomorrow may change today if storm patterns shift.  
     - **Why Non-Negotiable**: Chance must reflect temporal asymmetry (past is fixed, future is open).  

  #### **4. Higher-Order Chances (NN)**  
     - **Requirement**: The theory must handle higher-order chances (e.g., \(\textit{ch}_t(\textit{ch}_{t'}(A) = y) = z\)) without inconsistency, and deferring to them should yield coherent credences.  
     - **Motivating Case**: An oracle says, “The chance that the chance of rain is 0.8 equals 0.5.” A rational agent should integrate this into their credence for rain.  
     - **Why Non-Negotiable**: Chance assignments are often uncertain or probabilistic; ignoring this collapses epistemic levels.  

  #### **5. Inadmissible Evidence (NN)**  
     - **Requirements**:  
       - (a) The theory must define inadmissible evidence (defeaters of deference).  
       - (b) It must exclude future information, outcome information, and crystal-ball evidence.  
     - **Motivating Cases**:  
       - *Crystal Ball*: Learning \(\textit{ch}_t(A) = 0.3\) and then seeing a vision of \(A\) occurring. Your credence should ignore the chance and be near 1.  
       - *Outcome Information*: Learning the outcome of \(A\) defeats deference to \(\textit{ch}_t(A) = x\).  
     - **Why Non-Negotiable**: Without this, deference conflicts with updating on direct evidence.  

  #### **6. Undermining Futures (CSP: Humeans)**  
     - **Requirement**: For Humean theories (where chance supervenes on the entire history), the deference principle must avoid assigning positive credence to "undermining futures" (histories that make the chance theory false).  
     - **Motivating Case**: A Humean chance theory \(T\) says \(\textit{ch}_t(\text{future } F) = 0.5\), but \(F\) would make \(T\) false. Deference to \(T\) must not force \(Cr(F \mid T) = 0.5\) if \(T\) entails \(\neg F\).  
     - **Why Camp-Specific**: Non-Humeans (e.g., primitivists) avoid this by not tying chance to the Humean mosaic.  

  #### **7. Compatibility with Bayesianism (NN)**  
     - **Requirement**: The deference norm must be consistent with (i) probability axioms and (ii) conditionalization (updating by Bayes’ rule).  
     - **Motivating Case**: Learning \(\textit{ch}_t(A) = x\) should be integrated via conditionalization into a coherent credence function.  
     - **Why Non-Negotiable**: Violating Bayesianism invites Dutch books and incoherence.  

  #### **8. Principled Admissibility (NN)**  
     - **Requirement**: Admissible evidence must be defined non-circularly, e.g., as "historical information up to \(t\)" or "causally independent of future chances."  
     - **Motivating Case**: If admissibility is left vague, any counterexample can be dismissed by declaring evidence "inadmissible," rendering the deference principle vacuous.  
     - **Why Non-Negotiable**: A vacuous principle cannot constrain rational credence.  

  ---

  ### **Tensions and Incompatibilities**  
  The requirements **cannot all be jointly satisfied** under Humeanism due to the **undermining futures problem** (Desideratum 6). Here’s the precise conflict:  
  - **Setup**: Let \(T\) be the true Humean chance theory (supervening on the entire history). Let \(F\) be a future such that:  
    - \(\textit{ch}_t(F) = x > 0\) according to \(T\).  
    - But if \(F\) occurs, \(T\) is false (since \(F\) alters the Humean mosaic on which \(T\) supervenes).  
  - **Conflict**:  
    - By **Basic Deference** (1), \(Cr(F \mid T \land E) = x\), where \(E\) is admissible.  
    - By **Principled Admissibility** (8), \(T\) must be admissible (it’s a "theory," not direct outcome evidence).  
    - But if \(T\) is admissible, \(Cr(F \mid T \land E) = x\).  
    - However, \(T\) entails \(\neg F\) (since if \(F\) occurs, \(T\) isn’t the true theory). Thus, \(Cr(F \mid T \land E)\) should be 0.  
    - Contradiction: \(x > 0\) vs. \(0\).  
  - **Which Requirement Fails?**  
    - **Basic Deference** (1) and **Admissibility of \(T\)** (from 8) clash with **Humeanism** (6).  
  - **Resolution Options**:  
    1. **Revise Deference**: Adopt the *New Principle* (see Scorecard below), which uses conditional chances: \(Cr(A \mid T) = \textit{ch}_T(A \mid T)\). This avoids contradiction because \(\textit{ch}_T(F \mid T) = 0\).  
    2. **Restrict Admissibility**: Declare \(T\) inadmissible. But this undermines Humeanism (why learn \(T\) if inadmissible?) and risks vacuity.  
    3. **Reject Humeanism**: Take chance as primitive (non-supervening). This dissolves undermining but abandons naturalism.  

  ---

  ### **Most Demanding Requirement**  
  **Principled Admissibility (8)** does the most work in eliminating theories.  
  - It forces a non-circular account of "admissible evidence," which:  
    - Rules out Lewis’s initial "no undermining" fix (ad hoc).  
    - Constrains Humean responses (e.g., requiring \(T\)’s inadmissibility).  
  - Without (8), any theory can "explain away" counterexamples by declaring evidence inadmissible.  

  ---

  ### **Scorecard: Principal Principle vs. New Principle**  
  | **Desideratum**              | **Original Principal Principle (PP)**<br>*Lewis (1980)* | **New Principle (NP)**<br>*Hall/Lewis (1994)* |  
  |------------------------------|--------------------------------------------------------|-----------------------------------------------|  
  | **Basic Deference (1)**      | ✓ (via \(Cr(A \mid H_t \land T) = \textit{ch}_T(A)\)) | ✓ (via \(Cr(A \mid T) = \textit{ch}_T(A \mid T)\)) |  
  | **Uncertain Chance (2)**     | ✓ (by expectation)                                     | ✓                                             |  
  | **Time-Relativity (3)**      | ✓ (uses history \(H_t\))                               | ✓ (same)                                      |  
  | **Higher-Order Chances (4)** | ⚠ (inconsistent in some cases)                         | ✓ (handles nesting)                           |  
  | **Inadmissible Evidence (5)**| ✓ (admissible = historical)                            | ✓ (same)                                      |  
  | **Undermining (6)**          | ✗ (contradiction)                                      | ✓ (avoids via conditional chance)             |  
  | **Bayesian Compatibility (7)**| ✓                                                      | ✓                                             |  
  | **Principled Admissibility (8)**| ✗ (calls \(T\) admissible, leading to vacuity)       | ✓ (defines admissibility consistently)        |  

  - **PP Verdict**: Fails on undermining (6) and principled admissibility (8).  
  - **NP Verdict**: Satisfies all, but requires complex conditional chances.  

  **Conclusion**: The NP is superior for Humeans, but non-Humeans may prefer PP. Both require admissibility tied to temporal/causal asymmetry. The core tension—undermining—pushes theorists toward either revising deference (NP) or abandoning Humeanism.
