  For the Gould/Lewontin comparison... Hmm. Darwin's definitely describing what they'd later call "developmental constraints" and "nonadaptive byproducts." But he frames it as a qualification to adaptationism rather than a full alternative. The key difference is emphasis: Darwin still sees correlation as secondary to natural selection, while Gould/Lewontin make constraints primary. Still, the seeds of their critique are undeniably here in Darwin—he just didn't weaponize it against "adaptationist storytelling" like they did.

