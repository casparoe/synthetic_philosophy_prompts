  ok so i've been reading about nuclear strategy and there's something that seems genuinely paradoxical about the whole setup. nuclear states spend billions maintaining 'second-strike capability' — basically, submarines loaded with nukes that hide underwater, so that even if your entire country gets vaporized, you can still push the button and destroy the attacker in return. the theory is that this deters a first strike: no one attacks you because they know they'll get wrecked on the way out. but here's what i can't get straight. what does this practice actually presuppose about the adversarys rationality? on the one hand, it assumes they're rational enough to be deterred — they weigh the costs and decide not to launch. but on the other hand, anyone who is seriously contemplating a nuclear first strike has already decided that the destruction of their own country is a price worth paying (or they're not thinking clearly at all). so why would a second-strike threat deter them? it seems like the practice presupposes that the adversary is simultaneously rational enough to calculate consequences and irrational enough to start a nuclear war. reconstruct the implicit theory of rationality — or decision theory, or whatever — that makes this practice coherent. and if you think it's genuinely inconsistent, say what would have to change in the practice (or in the theory) to make it hang together.
