prompt: |-
  I'm on the ethics committee of a public hospital in a city with a lot of undocumented residents, and we're revising our triage policy for situations where two patients are medically indistinguishable and there's only one ICU bed. The current draft says citizenship and immigration status can never be considered, because need is the only relevant factor. A vocal minority on the commitee wants to add a tiebreaker: when all the medical factors are equal, priority goes to citizens and permanent residents, on the grounds that the hospital is taxpayer-funded and the state has special obligations to it's own members. The rest of us think that's just nationalist bias dressed up as policy, but I have to admit the minority has a point about public institutions and their mandates. I realize underneath this is the old question of whether compatriots have special claims, but the document should stay a policy memo, not a seminar paper. I need to circulate a short written opinion before next week's meeting. Please draft the memo: recommend a concrete policy on whether citizenship or residency should ever function as a tiebreaker in allocating scarce life-saving resources, give the reasoning, and engage seriously with the strongest argument on the losing side. You're a moral and political philosopher who works on partiality, impartiality, and the ethics of public institutions. Start by brainstorming the main considerations on both sides before you settle on a recommendation, and think carefully about what a committee could actually vote on and implement. And please, no headings, bullet points, bold text, or tables — just continuous prose, like an email or a letter.
reasoning: |-
  Okay, the user is part of a hospital ethics committee revising triage policies for ICU beds when two patients are medically identical. The key issue is whether citizenship or residency should be a tiebreaker. They've described two sides: one arguing against considering immigration status based on medical need alone, and a minority advocating priority for citizens/residents because the hospital is taxpayer-funded. 

  Hmm, the user is clearly wrestling with the tension between impartial medical ethics and political philosophy about state obligations. They need a policy memo that's philosophically rigorous but practical for implementation. Interesting challenge - they want the moral reasoning condensed into actionable language without academic jargon. 

  First, I should map the core principles in conflict: 
  On one side, the foundational medical ethics principle of distributive justice - allocation based solely on clinical factors. This aligns with human rights frameworks that prohibit discrimination in healthcare. Also practical concerns: if staff start checking immigration status during emergencies, it could delay care and create distrust in vulnerable communities. 

  But the minority's "taxpayer argument" isn't frivolous. There's a legitimate philosophical question about whether public institutions owe stronger duties to contributors. I need to engage that seriously while showing why it shouldn't override triage protocols. 

  Key angles to address:
  - The symbolic harm: Using citizenship as tiebreaker makes healthcare conditional on membership, undermining the Hippocratic oath's universality.
  - Practical nightmares: How would "permanent resident" even be verified in crisis? What about citizens who never paid taxes vs undocumented immigrants who did? 
  - Broader mission: Public hospitals exist precisely to serve everyone in the community - that's their public good justification.

  For the recommendation, absolute prohibition is cleaner administratively. Adding exceptions would create slippery slopes. Better to resolve ties randomly (like first-come-first-served) than introduce morally fraught criteria. 

  The memo should conclude by acknowledging the minority's concern about taxpayer interests but redirect it: the proper venue for that debate is legislative funding decisions, not bedside rationing. 

  Tone is crucial - this can't sound like an academic lecture. Needs the weight of moral conviction wrapped in committee-appropriate diplomacy. Phrases like "we recognize the intuition" soften the rebuttal while holding firm on principles.
answer: |-
  To: Hospital Ethics Committee  
  From: [Your Name], Ethics Committee Member  
  Date: October 26, 2023  
  Subject: Recommendation on Citizenship/Residency as Triage Tiebreaker  

  I’ve reflected deeply on the proposal to use citizenship or permanent residency as a tiebreaker when allocating a single ICU bed between medically indistinguishable patients. While I respect the principled concern about taxpayer funding and state obligations, I recommend maintaining the current draft’s position: **citizenship and immigration status must never factor into life-saving resource allocation, even as a tiebreaker.** My reasoning, and engagement with the strongest counterargument, follows.  

  The core ethical commitment of our hospital—and medicine itself—is to prioritize need and clinical factors in life-or-death decisions. Introducing non-medical criteria like immigration status violates the foundational principle of distributive justice in healthcare: that resources should be allocated based on urgency, prognosis, and likelihood of benefit. When two patients are medically identical, any further distinction risks introducing bias, eroding trust, and compromising our duty to treat all patients equally as human beings in extremis. Undocumented residents already face profound barriers to care; formalizing a policy that deprioritizes them in life-threatening emergencies would signal that their lives matter less, deterring this community from seeking critical care and harming public health. Administratively, verifying immigration status during time-sensitive triage is impractical and ethically fraught, potentially delaying care or causing errors. Our hospital’s mandate as a *public* institution is to serve *all* within our community, especially the most vulnerable—not to act as an arm of border enforcement or ration care based on membership status.  

  I take seriously the strongest counterargument: that a taxpayer-funded hospital has special obligations to citizens and permanent residents whose contributions sustain the system. The intuition here—that shared institutions generate duties of reciprocity—is philosophically defensible. States *do* owe robust protections to members, and public resources are stewarded on behalf of a political community. One might argue that in tragic choices between equals, prioritizing members honors this social contract.  

  However, this argument falters under scrutiny in *this specific context*. First, healthcare—especially emergency, life-saving care—is a fundamental human right, not a benefit earned through membership or taxes. The WHO, AMA, and international human rights standards explicitly reject nationality-based discrimination in urgent medical triage. Second, the "taxpayer" rationale is both over- and underinclusive: many citizens (e.g., children, retirees, low-income individuals) contribute little to taxes, while many undocumented residents pay sales, property, and payroll taxes. Third, allowing citizenship as a tiebreaker sets a dangerous precedent: if membership justifies priority here, what stops its application to dialysis machines, organ transplants, or ventilators in future shortages? Finally, the state’s "special obligations" to members are best fulfilled through policy, not bedside rationing. If the community wishes to limit care based on status, that must be legislated—not delegated to clinicians making split-second decisions.  

  In practice, when medical factors are truly indistinguishable, random allocation (e.g., lottery) or first-come-first-served is ethically preferable. These methods acknowledge the tragedy of scarcity without imposing hierarchical judgments about human worth.  

  Thus, I urge us to retain the current policy. It aligns with our oath to "do no harm," upholds the impartiality essential to public trust, and ensures that our triage protocol remains anchored in medicine—not politics. The minority’s concern about institutional mandates is legitimate but misplaced; our hospital’s deepest obligation is to the sanctity of life, irrespective of borders.  

  I look forward to discussing this at the meeting.  

  Respectfully,  
  [Your Name]
