prompt: |-
  I'm taking a course on contemporary moral philosophy this semester, and we have just started Scanlon's contractualism. In preparation for a paper, I read a chapter in a study guide that summarizes his position, and I want to know how much of it I can trust before I lean on it.

  The chapter's summary runs roughly as follows. Scanlon holds that an act is wrong just in case it would be disallowed by any principle for the general regulation of behavior that no one could reasonably reject. Because the only things that matter are the complaints individuals can press, the numbers can't count: the fact that a million viewers would miss a World Cup match cannot justify leaving one injured person stuck in the transmitter room, since that one person has a reasonable complaint against any principle permitting him to be sacrificed for the crowd's enjoyment. But the chapter says this is where the view gets into trouble. If you can save either one person or five, the same reasoning seems to force treating the choice as a toss-up: each of the five has exactly the same complaint as the one, and no individual complaint outweighs another. According to the chapter, Scanlon accepts this result — saving the five is no more justified than saving the one, because appealing to the greater number is just another form of aggregation, and aggregation is precisely what contractualism rules out. The chapter concludes that Scanlon's view therefore diverges sharply from common sense, and that this is the price he pays for rejecting the summing of harms and benefits across persons.

  I suspect something goes wrong somewhere in the middle of that summary, but I can't tell whether the problem is in the chapter or in my own understanding of the view. Could you tell me which parts of the summary are accurate, which are subtle distortions or overstatements, and how a careful Scanlonian would reply? In particular, does the conclusion that Scanlon must treat one-versus-five as a coin flip actually follow from his position, and if not, what distinction rescues him — and does that distinction come at any cost? Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question. Please answer in American English.
reasoning: |-
  Okay, the user is studying Scanlon's contractualism and came across a summary in a study guide. They're unsure how much to trust it, especially regarding the one-versus-five dilemma where the summary claims Scanlon sees it as a coin flip. 

  First, I need to verify the accuracy of the summary. The core definition of wrongness as what no one could reasonably reject seems correct. The World Cup transmitter room example also aligns with Scanlon's anti-aggregation stance—individual complaints can't be summed, so sacrificing one for many's benefit is wrong. 

  Where it gets shaky is the one-versus-five rescue case. The summary insists Scanlon *must* treat it as a toss-up because no individual complaint outweighs another. But that's misleading. Scanlon actually distinguishes between generic and personal claims. In rescue cases, each person has a generic complaint about not being saved, but no one has a unique grounds for rejection. If you save the five, the single person can't reasonably reject that principle because their complaint—being left unsaved—is identical to what any of the five would face if saved instead. Meanwhile, saving the one would leave each of the five with the same complaint, but collectively they represent multiple identical complaints. Crucially, Scanlon allows weighing *identical* generic complaints because the principle must consider everyone affected. So saving five over one isn't aggregation of value—it's acknowledging more people bear the same complaint. 

  The user suspects a "subtle distortion," and they're right. The summary conflates Scanlon's rejection of summing *different* types of harms (like boredom vs. death) with ignoring numbers entirely in same-harm cases. His actual position is more nuanced. 

  As for costs: This approach still struggles with *partial* aggregation cases—like saving five from minor harm versus one from severe harm—where complaints aren't identical. Scanlon bites the bullet there, refusing to sum minor harms, which *does* clash with common sense. But the rescue case isn't where he pays that price; it's where his solution works. 

  The user's deeper need here is clarity for their paper. They likely want to critique the study guide but need confidence in their understanding. Highlighting Scanlon's generic/personal distinction gives them a precise rebuttal tool.
answer: |-
  The summary accurately presents Scanlon's core contractualist formula and anti-aggregation stance (e.g., the World Cup case), but **its claim that Scanlon must treat the one-versus-five rescue case as a coin flip is a significant distortion, as Scanlon explicitly denies this and provides a contractualist rationale for saving the five.**

  Here's the breakdown:

  1.  **Accurate Elements:**
      *   **Core Definition:** Scanlon *does* define an act as wrong if disallowed by principles no one could reasonably reject.
      *   **Anti-Aggregation:** Scanlon *does* reject summing small benefits across many people to outweigh a large burden on one person (like the World Cup transmitter case). The single person's complaint against being sacrificed *does* reasonably outweigh the aggregated minor losses of the many.
      *   **Numbers Alone Don't Sum Different Harms:** Contractualism *does* reject justifying imposing a severe harm on one person simply because it provides a *different* type of benefit (even if large) to many others.

  2.  **The Distortion in the One-vs-Five Rescue Case:**
      *   **Scanlon's Actual Position:** Scanlon argues we *should* save the five. He **distinguishes the rescue case from the World Cup case.**
      *   **The Key Distinction - Generic vs. Personal Claims:** In the rescue case, everyone faces the *same* type of burden: death if not saved.
          *   The single person's complaint if we save the five is: "I was left to die."
          *   Each of the five's complaint if we save the one is: "I was left to die."
      *   **Reasonable Rejection Test:** Could the single person *reasonably reject* a principle requiring saving the greater number in same-harm rescue scenarios?
          *   Scanlon argues **no**. Their complaint ("I wasn't saved") is no different in kind or severity from the complaint *each* of the five would have if we saved the one instead. There's no special feature making *their* potential loss uniquely worse or giving them stronger grounds for rejection.
          *   Conversely, a principle requiring saving the *smaller* number *could* reasonably be rejected by *each* of the five. Each can say: "This principle allows me to die when another principle (saving the greater number) could have saved me *without* imposing a greater burden on anyone else." The principle fails because it needlessly leaves more people with a fatal complaint.
      *   **This Isn't Aggregation (by Scanlon's Lights):** Scanlon insists this reasoning does *not* aggregate harms. We aren't summing the "badness" of five deaths and comparing it to one. We are comparing the *individual complaints* people would have under different principles. The principle of saving the greater number withstands the reasonable rejection test because:
          *   No individual (including the single person) can claim they bear a *distinctive* burden under this principle that others avoid under the alternative.
          *   The alternative principle (saving the smaller number) *does* allow individuals (each of the five) to bear a burden (death) that could be avoided without imposing a greater burden elsewhere.

  3.  **The Careful Scanlonian Reply & Its Cost:**
      *   **Reply:** The rescue case involves identical generic complaints (death). A principle permitting failing to save a smaller number when you could save a larger number *can* reasonably be rejected by those in the larger group, as each has a complaint as strong as the person in the smaller group, and the principle needlessly results in more such complaints. Saving the five is justified because the principle allowing it cannot reasonably be rejected, while the principle requiring saving the one *can* be reasonably rejected by each of the five.
      *   **The Cost (Where Aggregation *is* Truly Ruled Out):** The cost comes in cases involving **different types or scales of burdens where aggregation *seems* intuitively permissible but Scanlon forbids it**. For example:
          *   **Moderate Harm to Many vs. Severe Harm to One:** Saving one person from severe paralysis vs. curing moderate, temporary pain for a very large number. Scanlon argues the single person's complaint against being paralyzed likely reasonably outweighs *each individual's* complaint about temporary pain, and since aggregation is forbidden, we cannot sum the many moderate pains to outweigh the one paralysis. This *does* clash with common sense for many, and Scanlon accepts this consequence.
          *   **Distributive Cases:** Spread a small burden over many to avoid a catastrophic burden on one? Scanlon often says no, if the complaint of the one against their catastrophic burden is stronger than the complaint *each* of the many would have against the small burden. The summed small burdens don't count.

  **Bottom Line Recap:** The summary correctly states the core view and anti-aggregation in cases like World Cup, but wrongly insists Scanlon is forced into a coin flip on one-vs-five rescue. Scanlon uses the distinction between identical generic burdens (where numbers matter via the reasonable rejection test) and different/non-identical burdens (where aggregation is forbidden) to justify saving the five. The *real* cost of rejecting aggregation is seen in cases involving many small harms vs. one large harm, not in same-harm rescue cases.
