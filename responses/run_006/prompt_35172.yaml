prompt: |-
  ok so i'm a phd student in philosophy working on moral psychology and i'm TA-ing this upper-level undergrad seminar on virtue ethics. we're about to hit the situationist critique (doris, harman, etc.) and the prof is letting me run one session -- 15 students, 75 minutes.

  i really want them to *feel* the situationist point in their bones, not just read about it. you know how when you first encounter the darley and batson good samaritan study it's kind of vertigo-inducing? like, wait, whether someone stops to help a stranger is mostly about whether they're in a hurry, and whether they just heard a lecture on the good samaritan makes basically no difference? i want that feeling, but generated by something they do in class, not by a paper they read the night before.

  constraints: no deception that would make anyone feel shitty afterwards (so no staging a fake emergency where they think they failed a moral test), no real money needed, and ideally the setup is simple enough that i'm not spending 20 minutes explaining the rules.

  what i'm picturing is something where they make predictions about behavior -- either their own or other people's -- and then something happens that reveals a gap between their character-based expectations and actual outcomes. or maybe they themselves are put in slightly different situations without realizing that's the variable, and then we look at the aggregate difference. the key is that the situationist insight should emerge from what they do, not from me explaining it afterwards.

  the debrief should connect the dots to the philosophical claims: the global vs. local trait distinction, the fundamental attribution error, and what it means for the virtue-ethical idea that character is where moral evaluation should primarily land. also i want them to see why the situationist critique isnt just "people are inconsistent" -- its a specific challenge to the predictive and explanatory power of character traits.

  also: tell me what'll predictably go wrong when i run this, and be honest about which part of the situationist critique the activity can't get at and i'll have to just explain. (i'm guessing the activity can't really capture the "negative" part of the situationist claim -- that even if there are local traits, they dont do the normative work virtue ethics needs them to do -- but maybe i'm wrong.)
reasoning: |-
  Okay, the user is a PhD student in philosophy, TA-ing an upper-level undergrad seminar on virtue ethics. They want to create an in-class activity to make the situationist critique tangible. The key is that students should *experience* the gap between their predictions and actual behavior, rather than just reading about studies. 

  Hmm, the user has clear constraints: no deception that causes distress, no real money, and minimal setup time. They want the activity to reveal how situational factors override character predictions. The deeper goal is philosophical—connecting this to virtue ethics' reliance on global traits.

  I recall the Darley and Batson Good Samaritan study they mentioned. That vertigo effect is what they want to replicate. But how to do it ethically? No fake emergencies. Maybe a low-stakes scenario where students predict behavior, then see how minor situational tweaks change outcomes.

  The "Predictions vs. Reality" activity comes to mind. Split the class into two groups, give them identical tasks but with subtle situational differences (e.g., time pressure or framing). Have them predict outcomes first. Later, reveal how the situational variable caused divergence. 

  Wait, would time pressure work? Undergrads are always busy. Framing the task as "evaluation" vs. "helping" might tap into intrinsic motivation differences. Both are ethical and low-cost. 

  For the debrief, the user needs to connect the dots: global traits vs. local traits, fundamental attribution error. The activity shows how small changes disrupt behavior predictions, undermining virtue ethics' character-based model. 

  But what can go wrong? If the situational nudge is too weak, results might be muddy. Also, students might guess the variable being tested, ruining the effect. Need a plausible cover story. And the activity can't cover the "normative insufficiency" of local traits—that’s a lecture point. 

  User’s last point is crucial: this isn’t just about inconsistency. It’s about traits lacking predictive power. The activity must highlight that. Maybe emphasize how predictions failed despite identical "character" assumptions. 

  Alternative ideas? A voting game where anonymity vs. publicity changes behavior. But that might feel manipulative. Stick to the first idea—it’s cleaner. 

  Final thought: user is sharp. They know the activity’s limits re: normative critique. I should flag that explicitly. Also, prep backup discussion questions in case data is inconclusive.
answer: |-
  Here's a structured, experiential activity designed to make the situationist critique visceral, meeting your constraints and philosophical goals:

  **Activity: "The Paper Swap"**

  **Time:** 35-40 minutes (Activity + Initial Data Collection), 35-40 minutes (Debrief/Discussion)

  **Setup (5 mins - Start of Class):**
  1.  **Divide the Class:** Randomly split the 15 students into **Group A** (8 students) and **Group B** (7 students). *Tell them it's for logistical purposes.* Send Group B to a designated area outside the classroom (hallway, lounge) with a simple task: "Discuss among yourselves: 'What's *one* key strength and *one* key weakness of Aristotle's conception of virtue as a mean?' Be ready to share briefly."
  2.  **Setup Group A (In-Class):** Give each Group A student **two** identical-looking blank sheets of paper and a pen/pencil. Explain: *"We're going to do a quick peer feedback exercise. On the* ***first sheet***, please write your name and a short paragraph (3-5 sentences) summarizing the core argument of the Situationist Critique against virtue ethics (as you understand it from the readings). Don't overthink it, just get your thoughts down. You have **3 minutes**."*
  3.  **The Crucial Variable (Unbeknownst to Students):** As Group A finishes writing, collect **ONLY the first sheet** (the one with their name and summary) from each student.
  4.  **The Ask:** Hold up the stack of summaries. *"Okay, great. Now, here's the second part. On your* ***second sheet***, I'd like you to write a brief, constructive comment on *one* of these summaries. I'll hand them out randomly. Please be thoughtful but concise – maybe one strength and one suggestion. **Importantly:** *Please sign your comment with your name.* This is so the original author knows who gave the feedback and can follow up if needed. You have **3 minutes**." Hand out the summaries **randomly** to Group A for commenting.
  5.  **Introduce Group B:** Bring Group B back in. Give each Group B student **two** identical blank sheets and a pen/pencil. Explain: *"Group B, while you were out, Group A wrote summaries. Now, I'd like you to do the same peer feedback task Group A just did."*
  6.  **The Variable for Group B:** *"On your* ***first sheet***, please write your name and the same short summary of the Situationist Critique core argument. You have **3 minutes**." (Collect these).
  7.  **The Key Difference:** Hold up Group B's summaries. *"Now, on your* ***second sheet***, please write a brief, constructive comment on one of these summaries, just like Group A did. I'll hand them out randomly. **However, this time:** *Please do* ***NOT*** *put your name on your comment.* Make it anonymous. You have **3 minutes**." Hand out Group B's summaries randomly for anonymous commenting.
  8.  **Collect Everything:** Collect all second sheets (the comment sheets) from both groups.

  **Data Reveal & Initial Shock (10 mins):**
  1.  **Tally Publicly:** Draw two columns on the board: "Group A (Signed)" and "Group B (Anonymous)".
  2.  **Categorize Comments:** Quickly scan the comment sheets. For *each* comment sheet, simply mark a tally under the respective group column for one of two categories:
      *   **"Constructive+":** Comments that include *at least one specific suggestion for improvement* (e.g., "Could clarify what 'local traits' means", "Might mention Harman's argument specifically", "Example needed for the helping study").
      *   **"General/Neutral":** Comments that are only praise ("Good summary"), only vague ("Could be clearer"), or neutral ("Interesting point").
  3.  **Reveal the Discrepancy:** Show the tallies. **Predictably:** Group A (Signed) will have significantly *fewer* "Constructive+" comments and significantly *more* "General/Neutral" comments than Group B (Anonymous). The *only* difference was the requirement to sign their name (public accountability) vs. anonymity.

  **The Vertigo Moment:** Ask:
  *   *"Look at these results. What stands out?"*
  *   *"Group A and Group B are both upper-level philosophy students in the same seminar. We'd expect similar levels of critical engagement, right? What happened?"*
  *   *"Before we started, if I'd asked you to predict which group would give more constructive critical feedback, what would you have said? Why?"* (They likely would have predicted no difference or maybe slight variations based on *who* was in which group, not the *situation*).

  **Debrief & Philosophical Connection (30-35 mins):**
  Guide the discussion using their *experience* and the *data*:

  1.  **The Gap & The Fundamental Attribution Error (FAE):**
      *   *"Why did we likely predict no big difference? What were we assuming about our classmates?"* (We assumed stable traits like "helpfulness," "critical thinking," "willingness to engage," "confidence" would determine behavior).
      *   *"When we see someone in Group A give only vague praise, what's our instinctive explanation?"* (They're not confident, they're lazy, they're conflict-averse, they're just nice). *"When we see someone in Group B give specific suggestions, what's our instinctive explanation?"* (They're insightful, they're critical thinkers, they're engaged).
      *   **Connect:** Highlight this is the FAE in action: overemphasizing personality (global traits) and underestimating the power of the situation (anonymity vs. public identification). *They just did it to each other.*

  2.  **Global vs. Local Traits:**
      *   *"Did people suddenly become 'unhelpful' or 'uncritical' in Group A? Did they suddenly become 'helpful critics' in Group B?"* (No, the *situation* triggered different behaviors).
      *   *"What kind of 'trait' might explain the behavior *within* Group B?"* (Maybe "willing to give constructive criticism *when anonymous*"). *"Within Group A?"* (Maybe "gives vague praise *when accountable*").
      *   **Connect:** Contrast these narrow, context-dependent "local traits" with the broad, cross-situationally consistent "global traits" (like "helpfulness," "honesty," "courage") that virtue ethics typically relies on. The activity shows behavior is highly sensitive to specific situational cues (like accountability), making global traits poor predictors.

  3.  **Predictive/Explanatory Power:**
      *   *"If virtue ethics tells us to look at character (global traits) to predict and explain moral behavior, how well did that work here?"* (It failed miserably). *"Why?"* (The situation swamped any effect of presumed stable character differences between groups).
      *   *"Does this mean people are just 'inconsistent'?"* Emphasize: **No!** Situationism argues behavior is often *highly consistent* – **with the demands of the specific situation.** It's predictable based on the context (anonymity fosters critical feedback; accountability inhibits it), *not* based on a global character assessment. The inconsistency is *across* different types of situations, not within the *same* situation.

  4.  **The Challenge to Virtue Ethics:**
      *   *"What does this imply for the idea that 'character is where moral evaluation should primarily land'?"* (It becomes much harder: If behavior is so situationally driven, evaluating the *person* as "virtuous" or "vicious" based on actions in specific contexts seems misplaced or at least insufficient. The situation deserves significant evaluative weight).
      *   *"Can we reliably cultivate the *global* traits virtue ethics values (like courage, honesty, generosity) if behavior is so fragmented across situations?"* (This raises deep doubts – can you practice "courage" in a way that reliably transfers from physical danger to social risk to intellectual honesty? The situationist says probably not, or at least, it's much harder and less reliable than virtue ethicists assume).

  **What Will Predictably Go Wrong & Limitations:**

  1.  **The Nudge Might Be Too Weak/Strong:** The effect size might be smaller than hoped (though anonymity effects on criticism are robust). Conversely, if the groups sense competition or feel judged, it could amplify the effect artificially. **Mitigation:** Emphasize the randomness of group assignment and the mundane nature of the task. Focus on the *aggregate* difference, not individual behavior.
  2.  **Students Guess the Variable:** Some astute students in Group B might suspect anonymity is the point. **Mitigation:** The cover story ("peer feedback exercise") is plausible. Even if guessed, the *magnitude* of the difference can still be striking and drive the point home. Debrief focuses on the *effect*, not the surprise.
  3.  **Inconclusive Data:** It's possible the tallies are close. **Mitigation:** Have backup slides ready summarizing classic studies (Good Samaritan, Milgram variations, Asch conformity) showing dramatic situational effects. Say: "Interesting, our results were [describe]. Studies consistently find..." The discussion about *predictions* vs. *actual possibility* of no difference is still valuable.
  4.  **Awkwardness/Resentment:** Students might feel awkward seeing who gave weak feedback (Group A) or worry their anonymous comment (Group B) was too harsh. **Mitigation:** Reassure them immediately after tallying: "This wasn't a test of *you*, it was a demonstration of how *situations* influence all of us. The content of the feedback wasn't the point, just its *characteristic*." Do NOT share who commented on whom. Focus on group aggregates.
  5.  **Can't Capture the "Negative" Claim (Your Guess is Correct):** This activity brilliantly shows the **descriptive/explanatory challenge** (global traits don't predict/explain well; situations do). It *doesn't* directly address the **normative challenge**: Even if local traits exist ("honest-when-unobserved"), are they the *right kind* of thing for ethical evaluation? Do they constitute *virtue*? Virtue requires cross-situational consistency and the right reasons. This is crucial and needs explicit explanation/discussion after the activity. *"Okay, so maybe we have 'local traits'... but is someone 'virtuously honest' if they are only honest when no one is looking? What does virtue ethics require that situationism says we likely lack?"*

  **Why this works:**
  *   **Experiential:** Students *make predictions* (implicitly or explicitly), *act* in subtly different situations, and *see* the divergence.
  *   **Low-Stakes & Ethical:** It's a mundane academic task. No deception about morality or emergencies. Anonymity is a common practice.
  *   **Clear Situational Variable:** Signed vs. Anonymous is simple, powerful, and directly relevant to accountability – a key situational factor.
  *   **Rapid Data Generation:** Results are immediate and visual.
  *   **Perfect Setup for Debrief:** The gap between expectation (similar behavior) and reality (divergent behavior based on situation) creates the "vertigo." The FAE, local/global traits, and predictive failure flow naturally from discussing this gap.

  This "Paper Swap" creates the jarring realization that a seemingly minor, ethically neutral situational tweak (signing a name) dramatically altered the *quality* of a small moral/cognitive behavior (giving constructive criticism), directly challenging their intuitive understanding of character's role. Good luck!
