answer: |-
  You're absolutely right to be suspicious—this is a classic case of pop-science oversimplification declaring a complex philosophical debate "settled." While the evolutionary debunking argument (EDA) is influential, the author's summary contains significant errors and overstatements. Let's break it down:

  ### Parts Moral Realists *Would* Accept:
  1.  **Moral intuitions are products of evolution:** Realists generally agree that our *faculty* for moral judgment, and the specific *content* of many common intuitions (like reciprocity, kinship altruism, aversion to harm), were shaped by natural selection to promote cooperation and survival. This is well-supported by evidence.
  2.  **Evolution didn't select intuitions for "truth-tracking":** Realists concede that natural selection favors traits that enhance reproductive fitness, not necessarily those that track abstract moral truths. The *mechanism* shaping intuitions was fitness, not truth-seeking.

  ### Parts That Are Oversimplified, Misleading, or Wrong:
  1.  **"It would be an insane coincidence that our Stone Age brains happened to evolve to detect them [objective moral facts]":** This is the core leap critics challenge.
      *   **Not Necessarily a Coincidence:** Realists argue it might *not* be a coincidence. If objective moral facts exist *and* adhering to them reliably promoted survival and cooperation in ancestral environments (e.g., because cooperation *is* objectively good, or truth-tracking *is* fitness-enhancing in certain domains), then evolution *could* have selected for cognitive faculties capable of detecting those facts, at least approximately. Our cognitive faculties for logic, perception, and empirical reasoning also evolved for fitness, yet we (usually) trust them to track truth.
      *   **The "Insane Coincidence" Charge Assumes the Conclusion:** It assumes moral realism is false to conclude it would be a coincidence if true. Realists like David Enoch ("Taking Morality Seriously") argue that if moral realism *is* true, it's plausible that fitness and moral truth correlate sufficiently for reliable belief formation.
  2.  **"The much simpler explanation is that moral facts don't exist":**
      *   **Simpler ≠ Truer:** Parsimony is a virtue in science, but philosophy often deals with complex realities. Dismissing a whole domain of potential reality *just* because it seems simpler to deny its existence is philosophically dubious.
      *   **Ignores Alternatives:** It falsely presents a dichotomy: "either insane coincidence or no moral facts." Realists offer other explanations (like the correlation argument above). Anti-realists like Sharon Street (a prominent EDA proponent) don't necessarily deny moral facts exist; she argues they are *response-dependent* (based on our evaluative attitudes) rather than *stance-independent* (existing independently of us).
  3.  **"Most philosophers now accept this and it's basically killed off moral realism as a serious position":** **This is blatantly false.**
      *   **Moral Realism is Alive and Well:** Surveys like the PhilPapers Survey consistently show moral realism is held by a significant plurality, if not a majority, of professional philosophers. It's absolutely a mainstream, serious position defended by leading figures (e.g., Derek Parfit, T.M. Scanlon, David Enoch, Russ Shafer-Landau, Erik Wielenberg).
      *   **The EDA is Highly Contested:** While influential, the EDA is subject to extensive and sophisticated critiques. Realists have developed numerous responses:
          *   **The Third-Factor/Coincidence Response:** As above, arguing for a link between fitness and moral truth (Enoch, Wielenberg).
          *   **Distinguishing Origin from Justification:** Just because beliefs *originated* for non-truth-related reasons doesn't mean they *can't* be justified or true now. We can rationally scrutinize and refine evolved intuitions (Shafer-Landau).
          *   **Selective Skepticism:** If the EDA works against moral beliefs, shouldn't it equally undermine *all* beliefs shaped by evolution, including logic, math, and science? But we don't reject those (this is the "companions in guilt" argument). Defenders of the EDA try to show why morality is uniquely vulnerable.
          *   **Non-Naturalist Realism:** Some realists (like Parfit) argue moral facts are non-natural and causally inert, so evolution *couldn't* have directly shaped beliefs about them. Instead, evolution shaped our *contingent* sensitivities, which we then use reason to refine towards truth.

  ### Does the Conclusion Follow?
  **No, not convincingly.** While the EDA presents a *serious challenge*, the leap from "moral intuitions evolved for fitness" to "therefore, moral facts don't exist" is **invalid** based on the premises alone. It requires **additional, highly contested philosophical assumptions**:
  1.  That there is *no possible link* between evolutionary fitness and objective moral truth.
  2.  That evolved cognitive faculties are *fundamentally incapable* of tracking non-empirical truths, even with rational refinement.
  3.  That the parsimony argument decisively outweighs any realist arguments or intuitions.

  **In short:** The author accurately describes the *core challenge* of the EDA but massively oversimplifies the philosophical response and falsely declares the debate settled. Moral realism remains a robust, widely held position precisely because philosophers find the EDA's jump to the conclusion that moral facts "don't exist" unconvincing. The EDA highlights the need for realists to explain *how* we could have reliable access to moral truths given our evolutionary history, but it doesn't prove such access is impossible or that moral truths are fictions.

  Think of it like this: Evolution shaped our visual system to detect light wavelengths relevant to survival, not "true color." Does this mean the physical properties of light and color don't exist? No. It means our *perception* of them is contingent and shaped by fitness. Moral realists argue something similar might hold for morality: our *intuitions* are contingent and shaped, but they might still track (or be refined to track) something real. The debate is about whether that analogy holds.
