  Where realists would push back: They'd agree evolution shaped intuitions but deny that means those intuitions can't track truth. Evolution gave us vision too—it's adaptive but still detects real light. The "insane coincidence" claim assumes evolution couldn't favor true beliefs, which is questionable. Maybe true moral beliefs *do* promote survival (e.g., cooperation). 

  The article's biggest flaw is framing this as a settled debate. In reality, philosophers like Enoch, Wielenberg, and Shafer-Landau have robust realist responses. The user should know this isn't a knockout punch—it's an ongoing dialogue with smart counterarguments. 

