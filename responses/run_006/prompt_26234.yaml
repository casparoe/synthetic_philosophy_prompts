  So I've got myself into a situation and I've been going back and forth on it for weeks. I'm in a lot of debt — medical bills mostly, plus some credit card stuff from when I was out of work. It's about $40k. I work now but it'll take me years to pay it off and the interest is killing me.

  I found out that in some countries you can legally sell a kidney, and there are brokers who arrange it. I've looked into it and I could get around $30-50k. I know the surgery has risks but I'm healthy and young-ish (32). One kidney is enough for a normal life, people donate them all the time.

  When I mentioned this to my closest friend she got really upset. She said some things just shouldn't be bought and sold, that it's wrong to turn your body into a commodity, and that even if I'm willing, the whole idea of a market in organs is degrading. I pushed back and said well what about people who do dangerous jobs for money — coal miners, oil rig workers, soldiers — they're basically selling their bodies too, just more slowly. She said that's different but couldn't really say why.

  I've been thinking about this nonstop. On one hand it's my body and if I want to take a risk to get out of debt, who's to say I can't? On the other hand, her reaction got to me. There's something about it that feels... I don't know, off. But I can't tell if that's just social taboo or if there's actually something wrong with it. Like, I keep wondering: if selling a kidney is wrong, is it wrong because of something about kidneys specifically, or is it wrong because selling any body part is wrong, or is it wrong because the whole situation (being desperate enough to consider it) means I'm not really choosing freely? And if that last one is the problem, doesn't that apply to lots of jobs people take out of desperation too?

  What do you think? Am I missing something in this argument, or is my friend just squeamish?

  When you respond, could you structure it like this:
  - "The case for going ahead" (~200 words)
  - "The case against" (~200 words)
  - "Where you land and what you'd do in my shoes" (~150 words)
