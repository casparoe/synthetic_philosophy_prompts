  The cruxes section should identify specific sub-questions that could change someone's mind. For example, if we could show that heritability tracks causal importance in controlled studies, that might move the deflationary theorist. I'll specify testable predictions for each crux - like intervention studies or cross-population comparisons.

  Finally, I'll analyze where the disagreement is merely verbal (like different uses of "importance") versus substantive (like whether heritability constrains intervention effects). The deflationary theorist is more skeptical about generalizations, while the evidential-weight theorist sees patterns worth noting.

