answer: |-
  ## Research Proposal: Epistemic Thresholds for Extreme Probabilities in Expected Value Fanaticism

  **Proposed Research Title:** Distinguishing Live Possibilities from Modelling Artefacts: An Epistemic Approach to Expected Value Fanaticism

  **Supervisory Area:** Normative Decision Theory / Philosophy of Probability / Formal Epistemology

  **1. Research Question & Core Problem**
  The standard debate surrounding *expected value (EV) fanaticism* – exemplified by scenarios like Pascal's Mugging – centres on whether a sufficiently enormous potential payoff, multiplied by a non-zero probability, no matter how minuscule, should dominate rational choice. Proposed solutions include accepting counterintuitive verdicts ("biting the bullet"), bounding utility functions, or applying *ad hoc* probability discounting. This project identifies a critical gap *prior* to this calculation: **Under what conditions should an extremely low-probability event be treated as a 'live possibility' warranting inclusion in EV calculations, versus dismissed as a mere 'modelling artefact' or effectively unrealisable speculation?** The core research question is therefore:

  > *What epistemic criteria determine when a theoretically possible, extremely low-probability event transitions from being a negligible modelling artefact to a live possibility that must be incorporated into normative decision-theoretic frameworks, particularly in contexts susceptible to fanaticism?*

  This question shifts focus from *how* to handle tiny probabilities in calculation to the prior issue of *which* tiny probabilities possess sufficient epistemic credentials to merit serious consideration at all.

  **2. Why Existing Approaches Are Insufficient**
  Current positions within the fanaticism debate fail to adequately address this prior epistemic question:

  *   **Biting the Bullet:** Approaches accepting fanatical conclusions (e.g., always act on the highest potential EV, however improbable) implicitly treat *any* non-zero probability as epistemically robust enough for inclusion. This ignores the crucial distinction between well-grounded infinitesimal probabilities and those arising from arbitrary model specification or unfounded conjecture.
  *   **Utility Bounding:** Solutions that cap the maximum possible utility avoid fanatical conclusions but do so purely within the calculation. They offer no guidance on whether the low-probability event *itself* was ever justified as a live input. They sidestep the epistemic question.
  *   **Ad Hoc Probability Discounting:** Schemes that down-weight or ignore probabilities below a certain threshold (e.g., \(10^{-100}\)) are fundamentally arbitrary. They lack a principled epistemic basis for *why* that specific threshold is chosen or how it relates to the *nature* and *source* of the probability estimate. They treat all low probabilities alike, regardless of origin.
  *   **Imprecise Probabilities:** While acknowledging uncertainty in probability assignments, this framework still requires incorporating *some* interval of probabilities. It does not inherently provide criteria for excluding an event entirely from the model space due to its epistemic status as an artefact.

  The common limitation is the **failure to provide an epistemically grounded filter** for determining which tiny probabilities reflect genuine, albeit remote, possibilities in the world, and which are merely artefacts of model construction, conceptual exploration, or imaginative speculation lacking any substantive connection to reality. This project aims to develop such a filter.

  **3. Research Objectives**
  1.  **Conceptual Analysis:** Precisely define "modelling artefact" and "live possibility" in the context of extreme low-probability events within decision models. Identify key epistemic dimensions (e.g., source of probability estimate, robustness to model specification, connection to empirical evidence or well-established theory, coherence with background knowledge).
  2.  **Develop Epistemic Criteria:** Formulate testable criteria for distinguishing artefacts from live possibilities. Potential factors include:
      *   **Evidence Robustness:** Does the probability assignment rely on chains of speculation vulnerable to small errors, or is it relatively robust?
      *   **Model Dependence:** Is the probability highly sensitive to arbitrary modelling choices (parameterisation, structure)?
      *   **Theoretical Grounding:** Is the possibility grounded in well-confirmed theory, or is it purely hypothetical/conceptual?
      *   **Calibratability/Testability:** Is there *any* conceivable pathway, even indirect, for evidence to significantly update the probability estimate upwards or downwards?
  3.  **Integrate into Decision Frameworks:** Develop modified decision-theoretic frameworks that incorporate these epistemic filters *before* EV calculation. Explore formal representations (e.g., restricted probability spaces, meta-decision rules about model inclusion).
  4.  **Apply to Paradigm Cases:** Test the proposed criteria and frameworks against classic fanaticism scenarios (Pascal's Mugging, Pascal's Wager variants) and high-stakes real-world dilemmas (e.g., existential risk mitigation, long-term policy under deep uncertainty) to assess their ability to yield more plausible verdicts.

  **4. Methodology**
  The project employs a primarily analytical and formal approach, characteristic of philosophy and formal decision theory, supplemented by conceptual case-study analysis:

  *   **Phase 1: Foundational Analysis (Months 1-9)**
      *   Months 1-3: Comprehensive literature review (Decision Theory, Philosophy of Probability, Formal Epistemology, relevant Existential Risk literature).
      *   Months 4-6: Detailed conceptual analysis of "modelling artefact," "live possibility," and related concepts (negligible probability, practical impossibility, epistemic warrant). Identify key epistemic dimensions.
      *   Months 7-9: Develop and refine initial criteria for distinguishing artefacts from live possibilities. Initial critique against simple cases.
  *   **Phase 2: Formalisation & Framework Development (Months 10-18)**
      *   Months 10-12: Formalise the identified criteria where possible (e.g., defining robustness metrics, model sensitivity thresholds).
      *   Months 13-15: Propose and model decision frameworks incorporating the epistemic filter (e.g., restricted EV, hierarchical models, possibility-space pruning rules).
      *   Months 16-18: Internal coherence and consistency checks of proposed frameworks. Refine criteria based on formal challenges.
  *   **Phase 3: Application & Evaluation (Months 19-30)**
      *   Months 19-21: Apply criteria and frameworks systematically to classic fanaticism thought experiments. Analyse verdicts vs. standard approaches.
      *   Months 22-24: Apply to selected complex real-world-inspired scenarios (e.g., evaluating low-probability high-impact interventions in AI safety or climate change). Assess practical implications and plausibility.
      *   Months 25-27: Identify potential counterexamples, limitations, and boundary cases. Refine criteria and frameworks.
      *   Months 28-30: Synthesis of findings, thesis drafting, preparation for viva.
  *   **Phase 4: Dissemination & Completion (Months 31-36)**
      *   Thesis finalisation, submission, viva voce examination. Preparation of journal articles.

  **5. Original Contribution & Significance**
  This project makes a novel contribution by:
  *   Identifying and rigorously addressing the *epistemic gap* prior to the standard EV fanaticism calculation.
  *   Providing the first systematic framework for epistemically vetting extreme low-probability inputs into decision models.
  *   Offering a principled alternative to arbitrary probability discounting or unqualified acceptance of fanaticism.
  *   Potentially resolving long-standing puzzles like Pascal's Mugging by showing the probability assignment lacks the epistemic status to be considered a live possibility.
  *   Enhancing the applicability of decision theory to real-world high-stakes, low-probability domains (e.g., existential risk, long-term futures) by providing tools to filter out ungrounded speculation.

  **6. Feasibility, Failure Conditions & Dissertation Scope**
  *   **Feasibility:** The project leverages well-established methodologies in analytical philosophy and decision theory. The focus is conceptual and formal development, avoiding primary empirical data collection, making it feasible within PhD resources and timeframe. The phased approach ensures structured progress.
  *   **Defining Success:** Success would involve:
      *   Developing a coherent and non-arbitrary set of epistemic criteria for distinguishing artefacts from live possibilities.
      *   Successfully integrating these criteria into workable decision-theoretic frameworks.
      *   Demonstrating that these frameworks yield more plausible verdicts than standard approaches in key fanaticism cases and offer practical guidance in complex scenarios.
      *   Articulating clear limitations and scope conditions for the proposed approach.
  *   **Failure Conditions & Mitigation:** The project would fail if:
      *   **Vagueness Persists:** No clear, non-circular, or operationalisable criteria for "live possibility" vs. "artefact" can be established. *Mitigation:* Focus on comparative robustness and model dependence as core, tractable dimensions. Accept partial criteria as a contribution.
      *   **Collapse into Existing Views:** The developed criteria effectively replicate *ad hoc* discounting or lead back to accepting/rejecting fanaticism wholesale without a novel epistemic basis. *Mitigation:* Constantly stress the *source* and *grounding* of the probability as the differentiating factor.
      *   **Intractable Complexity:** Formal integration creates models too complex to yield clear insights. *Mitigation:* Prioritise conceptual clarity and illustrative simple formal models over exhaustive generality initially.
      *   **No Plausible Verdicts:** The frameworks yield equally or more counterintuitive results than existing approaches in paradigm cases. *Mitigation:* Use this as valuable data to refine criteria; negative results on specific proposals are still informative.
  *   **Dissertation Scope:** The project is ambitious but appropriately scoped for a PhD. It avoids attempting a grand unified theory of probability or decision-making. It focuses squarely on the *epistemic filter* problem within the specific context of EV fanaticism. The phased methodology ensures manageable progression from concepts to formalisation to application. Producing a definitive, universally accepted solution is unlikely and not required; demonstrating a significant, rigorous, and novel contribution to the debate is the achievable goal.

  **7. Conclusion**
  This research addresses a fundamental yet overlooked step in the expected value fanaticism debate: determining which vanishingly small probabilities possess the epistemic standing to be treated as live possibilities rather than dismissed as modelling artefacts. By developing criteria grounded in evidence robustness, model dependence, theoretical grounding, and calibratability, and integrating them into decision-theoretic frameworks, this project aims to provide a principled solution to the prior epistemic question that existing approaches neglect. The resulting framework promises greater plausibility in resolving fanaticism puzzles and enhanced practical utility for decision-making under deep uncertainty concerning extreme impacts.
