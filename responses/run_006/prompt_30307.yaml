  ### Key Clarifications:
  - **Why not "Cobra Effect"?** The Cobra Effect requires the incentive to *worsen* the original problem (e.g., pest bounties increasing pest populations). In your cases, the goal *may* degrade due to neglect, but the focus is on the metric becoming meaningless.  
  - **Why not "Perverse Incentive"?** This is an umbrella term. Goodhart's Law specifically explains *why* the perversity emerges: the proxy metric breaks under optimization pressure.  
  - **Machine learning**: "Reward hacking" is an instance of Goodhart's Law in RL systems, not a distinct concept.  

  ### Solutions?
  To combat Goodhart's Law:  
  1. Use multiple metrics (e.g., ticket closure rate + customer satisfaction scores).  
  2. Audit for "gaming" behaviors (e.g., track reopened tickets).  
  3. Assess metrics dynamically: Retire/replace them when proxies degrade.  
  4. Incentivize outcomes (e.g., "resolved customer issues") over outputs (e.g., "closed tickets").
