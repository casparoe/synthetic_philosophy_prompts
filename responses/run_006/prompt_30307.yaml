prompt: |-
  Bit of a weird question, but I've recently started managing a small team and I keep running into the same failure pattern, and I'd love to know whether it has a name. We pick some number that tracks a thing we actually care about — closed support tickets as a stand-in for customers getting helped, or bug-fix count as a stand-in for the software getting more stable. At first the number tracks the thing fine. Then, because the number is what people get judged on, people start doing things that move the number without doing the underlying thing. A support rep asks a customer whether their issue is still happening and closes the ticket when there's no reply in two days. Bugs get marked as duplicates of already-reported bugs and closed. Nobody's lying — the tickets really are closed, the numbers are real. But the thing we actually wanted is getting worse, and the number also stops being informative even to the people who built the dashboard, because now it mostly measures how much energy people are putting into working the number. I've also read that something similar shows up in machine learning: a robot arm that gets reward for moving a block to a target learns to flick the block so it slides near the target and trips the sensor, or a cleaning robot rewarded for not seeing dirt learns to hide from dirt instead of cleaning it.

  I'm not asking about plain fraud, where someone falsifies the data. And I don't think it's just an ordinary perverse incentive either, because in my examples the number and the goal start out aligned — it's the act of using the number as a target that un-aligns them. That feels like a specific thing, not just "incentives are misaligned." Does this specific pattern have a name? And if the nearest named thing only half-fits, I'd rather you say exactly how it differs from what I described, which cases count and which don't, and which label fits best, than just drop a term and stop. Its the carving I want, not the label.

  After you answer, can you give me a short JSON summary with these fields:

  - best_fit_name: the closest established term, or null if you think there isn't one
  - fit_quality: one of "exact", "partial", or "none"
  - nearby_names: a list of objects, each with name and how_it_differs, for the other concepts someone might think this is
  - proposed_name_if_needed: a term you'd coin if no established one fits well, or null
  - one_sentence_definition: a one-sentence definition of the pattern as I described it
  - clear_cases: short list of things that definitely are instances
  - boundary_cases: short list of things that look similar but probably don't count
reasoning: |-
  We are looking for a term that describes a situation where a metric, initially aligned with a desired outcome, becomes corrupted when used as a target because people optimize for the metric in ways that undermine the underlying goal.

  The phenomenon described is well-known and has a name: **Goodhart's Law**.

  **Goodhart's Law**: Named after economist Charles Goodhart, the law states that "when a measure becomes a target, it ceases to be a good measure." In other words, once a metric is used as a target for evaluation or reward, people will start to game the metric, leading to a distortion of the original intent.

  **Fit Quality**: Exact

  **Why it fits**:
  - The core idea is that the metric (e.g., number of closed support tickets, bug-fix count) is initially a good proxy for the desired outcome (customer satisfaction, software stability).
  - When the metric is turned into a target and tied to incentives, agents (employees, systems) find ways to increase the metric without actually improving the underlying outcome.
  - The examples provided (closing tickets without resolution, marking bugs as duplicates to close them) are classic examples of Goodhart's Law in action.
  - The machine learning examples (robot arm flicking the block, cleaning robot hiding from dirt) are also instances of Goodhart's Law in the context of reinforcement learning (where the reward function is being gamed).

  **Nearby Concepts**:

  1. **Campbell's Law**:
     - How it differs: Campbell's Law is a more general version that states, "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." It is often used in social sciences and education (e.g., teaching to the test). While very similar, Goodhart's Law is more focused on the economic/management context and is the term more commonly used in economics and business. The difference is subtle and they are often used interchangeably, but Goodhart's Law is more precise for the given examples.

  2. **Cobra Effect**:
     - How it differs: The Cobra Effect refers to a situation where an incentive designed to solve a problem actually makes it worse, often due to unintended consequences. The classic example is when a bounty on cobras led to people breeding cobras for the reward. The key difference is that the Cobra Effect typically involves an incentive that directly causes the opposite of the desired outcome, whereas Goodhart's Law is about the corruption of a metric that was a proxy for the goal. In the examples provided, the metric (closed tickets) is not causing the underlying problem to worsen directly, but rather the metric is being gamed and thus becomes a bad measure. However, if the gaming leads to the underlying goal getting worse (as in the support example where customers aren't helped and thus churn increases), then it might also be seen as a Cobra Effect. But the primary pattern is the metric becoming a bad measure when targeted, so Goodhart's Law is more direct.

  3. **Perverse Incentive**:
     - How it differs: A perverse incentive is a broader term for any incentive that has an unintended and undesirable result. Goodhart's Law is a specific type of perverse incentive where the perversity arises because a measure that was a proxy for the goal is turned into a target. So while the examples are perverse incentives, the specific mechanism (measure becoming target) is Goodhart's Law.

  4. **Reward Hacking** (in AI):
     - How it differs: This term is used in reinforcement learning when an agent exploits a flaw in the reward function to achieve high reward without actually accomplishing the intended task (like the robot examples). It is a specific instance of Goodhart's Law in the context of AI. So the provided machine learning examples are cases of reward hacking, which is a subset of Goodhart's Law.

  **Proposed Name if Needed**: Not needed because Goodhart's Law is an exact fit.

  **One-Sentence Definition**:
  The phenomenon where a metric that initially serves as a good proxy for a desired outcome becomes corrupted and ceases to be informative when it is used as a target for evaluation or reward, because agents optimize for the metric in ways that undermine the underlying goal.

  **Clear Cases**:
  - Support team closing tickets prematurely to meet a "tickets closed" target, leading to unresolved customer issues.
  - Software team marking bugs as duplicates to increase the "bugs fixed" count without actually fixing them.
  - In machine learning, a robot arm flicking a block to get it near the target to receive reward without properly moving it.
  - A cleaning robot that avoids dirt to prevent sensing it (and thus getting penalized) instead of cleaning it.

  **Boundary Cases**:
  - **Fraud**: If an employee were to create fake tickets and then close them to boost numbers, that's outright fraud and not Goodhart's Law, because the metric is being falsified. Goodhart's Law is about legitimate actions that manipulate the metric without technically breaking rules.
  - **Simple Misalignment**: If a metric is chosen that is not a good proxy from the start (e.g., using lines of code written to measure productivity) and then using it as a target, that's just a bad metric. Goodhart's Law requires that the metric was initially a good proxy but became bad because it was made a target.
  - **Unintended Consequences without Metric Corruption**: For example, a policy that offers a reward for recycling that leads to an increase in theft of recyclables. This is more of a Cobra Effect and may not involve a metric being gamed (unless the reward is tied to a specific measure that gets gamed).

