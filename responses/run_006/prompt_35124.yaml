  - If you match SSA: You are using the Self-Sampling Assumption. You reason as if you are a random observer from all actual observers in your reference class. This leads you to update in favor of hypotheses where your observations are more typical. For example, in the Doomsday Argument, you update in favor of the short-lived human species because your birth rank is then more typical.

