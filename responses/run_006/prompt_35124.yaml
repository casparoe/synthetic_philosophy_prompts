answer: |-
  Below is a comprehensive quiz designed to diagnose positions in anthropic reasoning through concrete cases without using technical labels. The quiz includes eight thought experiments, each with answer options that map onto the Self-Sampling Assumption (SSA), Self-Indication Assumption (SIA), Full Non-indexical Conditioning (FNC), or reveal inconsistencies. After taking the quiz, users will be sorted into one of these categories (or flagged as "no stable position") based on their answer patterns. Explanations of the positions are provided only after scoring.

  ---

  ### **Anthropic Reasoning Quiz**
  **Instructions**: For each scenario, select the answer that best matches your intuition. There are no trick questions—go with your gut.

  1. **Doomsday Argument**  
     Humanity could be short-lived (100 billion humans total) or long-lived (100 trillion humans total). You discover you are the 60 billionth human. How should this affect your belief about humanity's future?  
     - A) Update toward short-lived: This rank is more typical if humanity ends soon.  
     - B) Don’t update: The rank is equally consistent with both scenarios.  
     - C) Update toward long-lived: More humans make higher ranks like 60B more likely.  

  2. **Presumptuous Philosopher**  
     Two universe theories are equally supported by evidence: T1 (1 galaxy) and T2 (1 trillion galaxies). Before new data, what’s your credence in T2?  
     - A) 50%: No reason to favor either yet.  
     - B) ~100%: More galaxies mean T2 is inherently more probable.  
     - C) ~0%: We’re likelier to observe a small universe.  

  3. **God’s Coin Toss**  
     A fair coin flips. Heads: 1 person is created. Tails: 1 million people are created. You wake up in a room. What’s P(tails)?  
     - A) 50%: The coin is fair; your existence doesn’t change that.  
     - B) ~0%: You’re probably the one person if heads won.  
     - C) ~100%: If tails won, there are more people like you.  

  4. **Urn Draw**  
     A fair coin picks an urn: Small (10 balls) or Huge (10,000 balls). You draw a ball numbered 7 (which exists in both urns). How do you update?  
     - A) Favor Small: Drawing #7 is more likely in the Small urn.  
     - B) Favor Huge: More balls make any draw more probable.  
     - C) No update: The draw is neutral; stay at 50%.  

  5. **Sleeping Beauty**  
     Sleeping Beauty is put to sleep. A fair coin flips. Heads: She awakens once (Monday). Tails: She awakens twice (Monday/Tuesday) with amnesia between. Upon awakening, what’s P(heads)?  
     - A) 1/3  
     - B) 1/2  
     - C) 1/4  

  6. **Two Worlds Coin**  
     A fair coin flips. Heads: 1 person is created. Tails: 2 people are created. You exist. What’s P(heads)?  
     - A) 50%  
     - B) ~67% (2/3)  
     - C) ~33% (1/3)  

  7. **Multiverse Theories**  
     A fair coin picks T1 (10 civilizations) or T2 (10,000 civilizations). You exist as a civilization. What’s P(T1)?  
     - A) 50%  
     - B) ~0.1%  
     - C) ~99.9%  

  8. **Red Rooms**  
     A fair coin flips. Heads: 1 person in a red room. Tails: 2 people, each in a red room. You wake up in red. What’s P(heads)?  
     - A) 50%  
     - B) 33% (1/3)  

  ---

  ### **Scoring Key & Diagnostics**
  **Answer Key** (for quiz admin; not shown to users):  
  | Question | SSA          | SIA          | FNC          | Splits                              |  
  |----------|--------------|--------------|--------------|-------------------------------------|  
  | 1        | A            | B            | B            | SSA vs. SIA/FNC                     |  
  | 2        | C            | B            | A            | All three                           |  
  | 3        | B            | C            | A            | All three                           |  
  | 4        | A            | C            | C            | SSA vs. SIA/FNC                     |  
  | 5        | A            | A            | B            | FNC vs. SSA/SIA                     |  
  | 6        | B            | C            | A            | All three                           |  
  | 7        | C            | B            | A            | All three                           |  
  | 8        | B            | B            | A            | FNC vs. SSA/SIA                     |  

  **Scoring Method**:  
  - Tally matches between the user’s answers and the templates below.  
  - Highest match wins.  
  - Tie/"No stable position": No clear majority (e.g., ≤4 matches for all).  

  **Position Templates**:  
  - **SSA**: A, C, B, A, A, B, C, B  
  - **SIA**: B, B, C, C, A, C, B, B  
  - **FNC**: B, A, A, C, B, A, A, A  

  **Diagnostics**:  
  - **Incoherent combinations**: Answers like [A, B, A, B, A, B, A, B] match no template (score ≤3 for all). This suggests inconsistency or an unexplored hybrid view.  
  - **Indistinguishable pairs**:  
    - SSA vs. SIA: Only differ on Q1,3,4,6,7. All other splits are clear.  
    - SIA vs. FNC: Only differ on Q2,3,6,7,8.  
  - **"No stable position"**: If no template matches ≥5 answers, the user may hold an inconsistent or non-standard view.  

  **Result Mapping**:  
  - **SSA**: Self-Sampling Assumption. You reason as if you’re a random observer from all *actual* observers.  
  - **SIA**: Self-Indication Assumption. You weight hypotheses by the number of observers (more observers = more likely).  
  - **FNC**: Full Non-indexical Conditioning. You treat your existence as fixed and ignore "which observer" information.  
  - **No stable position**: Your answers don’t align with a consistent anthropic principle.  

  ---

  ### **Why Sleeping Beauty Was Included**  
  Sleeping Beauty (Q5) is retained because it cleanly splits FNC (which ignores indexical awakening information) from SSA/SIA (which treat awakenings as distinct observations). It avoids redundancy by testing sequential amnesia, unlike the other population-based questions.

  ---

  ### **Quiz Implementation Tips**  
  1. **For the blog**: Use a simple scoring script (e.g., JavaScript) to match answers against templates.  
  2. **Post-quiz explanation**: After sorting, define SSA, SIA, and FNC in plain language (e.g., "SSA: You’re a random human in history; SIA: Your existence hints at more humans; FNC: Your existence tells you nothing new").  
  3. **Audience note**: Assumes familiarity with basic probability but not anthropic literature.  
  4. **Edge cases**: If users pick "C" for Q8, map it to "B" (only A/B are valid).  

  This quiz isolates core intuitions without jargon, ensuring users discover their position through cases, not labels.
