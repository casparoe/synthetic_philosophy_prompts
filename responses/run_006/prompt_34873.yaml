answer: |-
  ## The Equations Endure (A Villanelle on Scientific Realism)

  The graveyard grows with every age we scan,
  Where phlogiston fled and caloric turned cold,
  **Each bright theory perished, built on sand.**

  See Fresnel's ether, once a masterplan,
  Dissolve to nothing, a discarded mould.
  The graveyard grows with every age we scan.

  Yet latent heat persists, a proven strand,
  And Maxwell's fields the old equations hold.
  **Each bright theory perished, built on sand,**
  **But what was wrought in numbers yet can stand.**

  The caloric substance? Lost and uncontrolled.
  The graveyard grows with every age we scan.

  Ether's ghost departs at light's command,
  But laws of optics, radiant, still unfold.
  **Each bright theory perished, built on sand.**

  Shall we then renounce what we understand?
  Or track what patterns time has not unrolled?
  The graveyard grows with every age we scan —
  **But what was wrought in numbers yet can stand.**

  Our maps are flawed, this much the past has told;
  The stuff proposed slips through the clutching hand.
  **Each bright theory perished, built on sand.**

  The radiant structure stays, a constant strand,
  While truths that time corrodes are turned to dross.
  The graveyard grows with every age we scan,
  **But what was wrought in numbers yet can stand.**

  Summary: Structural realism counters the pessimistic meta-induction by conceding the historical failure of specific ontologies while asserting the enduring epistemic value of the mathematical structures preserved across theory change.
