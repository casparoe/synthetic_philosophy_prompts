prompt: |-
  I've been working my way through some older philosophy of mind and animal cognition literature, and a pattern keeps surfacing that I can't quite pin down with the vocabulary I have. The pattern goes like this: you observe a system — an animal, a piece of software, a bureaucracy — performing a sequence of actions that looks intelligent and goal-directed. It adjusts to circumstances, it completes sub-tasks in order, it seems to "know what it's doing." But then you notice that the whole performance is keyed to a very specific triggering condition, and if you interrupt the sequence at just the wrong point, the system doesn't improvise or find a workaround — it loops back to the beginning and starts the entire routine over, even when that makes no sense by its own apparent goals. The example that got me thinking about this is a solitary wasp I read about (I think in the context of a discussion of free will): the wasp brings a paralyzed cricket to the entrance of its burrow, leaves it there, goes inside to inspect the nest, comes back out, and then drags the cricket in. If an experimenter nudges the cricket a few inches away while the wasp is inside, the wasp emerges, finds the cricket, drags it back to the entrance — and then, instead of just taking it inside, goes down into the burrow again to repeat the inspection step. It will do this dozens of times, never "catching on" that the inspection is redundant. What interests me is that this isn't just a failure of intelligence in a general sense — it's a very specific kind of failure where the behavior presents all the outward marks of flexible, means–end rationality right up until the moment it doesn't, and the brittleness is invisible unless you probe at exactly the seam the system isn't built to handle. I've started noticing analogues in automated phone trees that send you back to the main menu when they can't parse your response, in institutional procedures that restart a multi-step review because one box wasn't checked, and arguably in certain human cognitive habits — though I'm less sure about that last one.

  I'm trying to find out whether there is an established term for this specific configuration: the gap between the apparent purposiveness of a behavior and its underlying mechanical rigidity, where the rigidity is revealed only by interrupting the routine at a point the system has no provision for. I'm aware of several nearby concepts — fixed action patterns in ethology, stimulus–response chains, maybe something in Dennett's work on the intentional stance, and certainly the broader idea that apparent intelligence can be underlain by simple mechanisms. But what I'm after is narrower: not just any rigid behavior, and not just any case where something looks smarter than it is, but this particular structure where the behavior is complex and multi-step, looks flexible in normal operation, and has a specific kind of brittleness that shows up as compulsive restarting when the world deviates from the script at an un-handled juncture. Does this have a name? If it does, how exactly is the concept defined, and what are its boundaries — does it apply to humans, to institutions, or only to simpler systems? If it doesn't have a name, what are the closest concepts, how do they fall short, and what would you propose calling it? I'm also interested in whether the concept, once clarified, has any philosophical traction: does it mark a distinction that matters for debates about free will, or about the difference between genuine and merely apparent agency?

  Please structure your response in the following sections, in this order:

  - **Nearest Established Concepts** (roughly 250 words): identify the concepts in philosophy, ethology, or cognitive science that come closest to capturing the phenomenon I've described, with brief definitions of each.
  - **How the Described Phenomenon Differs** (roughly 250 words): for each candidate concept, explain where it matches the description and where it diverges — what it includes that I'm not pointing at, or what it misses that I am.
  - **Which Fits Best, and Whether a New Term Is Needed** (roughly 200 words): give your verdict on whether an existing term adequately covers the phenomenon, and if so which one and why; if not, explain why the gap is real.
  - **Proposed Term and Definition** (roughly 200 words): if you think a new term is warranted, propose one, define it precisely, and give its boundary conditions. If you think an existing term suffices, use this section to refine its definition so it captures the phenomenon more sharply.
  - **Philosophical Significance** (roughly 200 words): discuss whether this phenomenon, once properly named and bounded, has implications for debates about free will, agency, or the nature of intelligence — or whether it's merely a curiosity with no deeper philosophical weight.
reasoning: |-
  Okay, the user is describing a specific pattern they've noticed in systems that appear intelligent but reveal rigid, repetitive behavior when interrupted at critical points. They mention examples like a wasp restarting its nest-inspection routine when a cricket is moved, automated phone trees resetting to the main menu, or bureaucratic processes requiring full restarts for minor errors. The user wants to know if there's an established term for this "brittleness" in otherwise goal-directed behavior and if it has philosophical implications.

  Hmm, I need to recall relevant concepts from ethology, cognitive science, and philosophy. Fixed action patterns (FAPs) in ethology come to mind—those are innate, rigid sequences triggered by specific stimuli. The wasp example fits perfectly here. Then there's script theory from cognitive psychology, which deals with pre-set behavioral sequences in humans. In AI, there's the concept of brittle systems that fail outside their programmed parameters. Dennett's intentional stance also feels relevant—we interpret behavior as purposeful until it breaks down in unexpected ways.

  But none of these fully capture what the user describes. FAPs are usually simpler sequences, while the user's examples involve multi-step complexity. Script theory includes human improvisation, which contradicts the compulsive restarting. AI brittleness is broader, covering any failure, not specifically restart loops. Dennett's framework is more about interpretation than the mechanism itself.

  The key elements here are: multi-step sequences that appear flexible normally, a critical interruption point causing failure, and compulsive restarting instead of adaptation. The closest existing term is probably "fixed action pattern," but it needs stretching to cover complex cases like bureaucracies. Maybe we need a new term? "Cyclic compulsion syndrome" could work—emphasizing the looped restart and lack of control. Or "script brittleness" to highlight the breakdown of structured sequences.

  Philosophically, this challenges notions of agency. If a system can't adapt when routines fail, how "free" or "intelligent" is it? For the wasp, it undermines claims of insect agency; in humans, it questions how much our "choices" are just elaborate scripts. The gap between appearance and reality here is crucial for debates about consciousness and free will. The user's observation isn't just a curiosity—it reveals how fragile our assumptions about intelligence can be.
answer: |-
  ### **Nearest Established Concepts**  
  *(~250 words)*  

  1.  **Fixed Action Pattern (FAP)** (Ethology): An innate, stereotypic behavioral sequence triggered by a specific *sign stimulus* (e.g., Tinbergen's digger wasp). Once initiated, it runs to completion regardless of environmental changes.  
  2.  **Stimulus–Response Chain** (Behaviorism): A learned sequence where each step's completion acts as the stimulus for the next step. Rigidity arises from conditioning, not innate programming.  
  3.  **Script/Schema Theory** (Cognitive Psychology): Mental frameworks (e.g., Schank & Abelson's "restaurant script") guiding behavior in familiar scenarios. Scripts imply sequential steps but allow for minor variations.  
  4.  **Brittleness** (AI/Cybernetics): A system's failure when faced with unanticipated inputs or perturbations, often due to overspecialization or lack of error-handling.  
  5.  **Intentional Stance Breakdown** (Dennett, Philosophy of Mind): The point where attributing beliefs/goals to a system (as if it were rational) fails because its behavior becomes inexplicably rigid or maladaptive.  

  ### **How the Described Phenomenon Differs**  
  *(~250 words)*  

  -   **FAP**: Matches the wasp example perfectly: innate, sequence-specific, and compulsively restarted when interrupted mid-flow. However, FAPs are typically applied to *innate animal behaviors* and imply *simpler* sequences (e.g., egg-retrieval in geese). Your phenomenon extends to learned/institutional systems (e.g., software, bureaucracy) with far more complex, *apparently* flexible sequences.  
  -   **Stimulus–Response Chain**: Captures the mechanistic chaining of steps but emphasizes *learning* over innateness. It diverges by not inherently including the critical feature: *compulsive restarting from step one* upon interruption. Chains might simply halt or exhibit extinction.  
  -   **Script/Schema Theory**: Explains multi-step, context-dependent routines (e.g., bureaucracy). However, scripts imply *adaptability* (e.g., skipping a step if a waiter is absent). Your phenomenon excludes such flexibility, highlighting instead a *non-adaptive reset* when the script lacks branching logic.  
  -   **Brittleness**: Broadly overlaps (failure at unhandled edge cases) but is too general. Brittleness could manifest as crashing, freezing, or gibberish—not specifically *ritualistic restarting of the entire sequence*.  
  -   **Intentional Stance Breakdown**: Describes the *observer's* interpretive failure when rigidity appears, but doesn’t specify the *mechanism* (compulsive restarting) or apply cleanly to non-minded systems like software.  

  Your phenomenon uniquely combines: (1) multi-step, *apparently* goal-directed complexity, (2) *hidden rigidity* exposed only at specific interruption points, (3) *compulsive sequence reset* as the failure mode. Existing terms capture facets but miss this precise configuration.  

  ### **Which Fits Best, and Whether a New Term Is Needed**  
  *(~200 words)*  

  **Fixed Action Pattern (FAP)** is the closest existing concept, especially for ethological cases like the wasp. It explicitly includes sequence-specific triggers, completion compulsion, and maladaptive repetition when interrupted. However, it falls short in three ways:  
  1.  **Scope**: FAPs are ethologically defined as *innate* and *species-typical*, excluding learned bureaucratic/software routines.  
  2.  **Complexity**: FAPs imply "ballistic" simplicity (e.g., egg-rolling), not the layered sub-tasks in your examples.  
  3.  **Reset Specificity**: While FAPs restart, this isn't emphasized as the *defining* failure mode across domains.  

  The gap is real: no term adequately captures the *cross-domain pattern* of intelligent-seeming sequences that pathologically *reboot* when derailed at unscripted points. FAP is a prototype but doesn’t generalize. A new term is warranted to unify this observed fragility in biological, artificial, and institutional systems.  

  ### **Proposed Term and Definition**  
  *(~200 words)*  

  **Term**: **Cyclic Compulsion Syndrome (CCS)**  
  **Definition**: A failure mode in goal-directed systems (biological, artificial, or institutional) where:  
  1.  Behavior is organized into a *multi-step sequence* that appears flexibly adaptive under normal conditions.  
  2.  The sequence has *critical junctures* where interruption or deviation blocks progression.  
  3.  The system lacks error-correction or branching logic for such deviations.  
  4.  Failure manifests as *compulsive re-initiation of the entire sequence* rather than local repair, skipping, or aborting—even when restarting is counterproductive to the system’s ostensible goals.  

  **Boundary Conditions**:  
  - Applies *only* to systems exhibiting all four criteria.  
  - **Included**: Animal instincts (wasp), rigid algorithms (phone trees), institutional workflows (permitting processes).  
  - **Excluded**:  
    - Simple reflexes (e.g., knee jerk).  
    - Systems that halt or randomize upon failure (e.g., a crashed program).  
    - Systems with robust error-handling (e.g., human revising a plan).  
  - **Human Relevance**: Applies only to pathological rigidities (e.g., OCD rituals), *not* general human planning.  

  ### **Philosophical Significance**  
  *(~200 words)*  

  CCS has substantial philosophical traction, particularly for:  

  1.  **Agency & Free Will**: CCS demonstrates that *apparent goal-directedness* can emerge from mechanical repetition. This challenges libertarian free will by showing how "purposeful" actions can be inflexible programs (e.g., the wasp’s behavior isn’t "chosen" but triggered). It supports compatibilist views where agency requires *robust contingency-handling*.  
  2.  **Intentionality**: CCS reveals the gap between *ascription* of intentionality (Dennett’s stance) and *real* flexibility. A system exhibiting CCS invites then betrays intentional interpretation, highlighting that belief/deser attribution is observer-dependent.  
  3.  **Minds vs. Mechanisms**: CCS is a marker for "cognitively shallow" systems. Genuine intelligence (per Clark, Dreyfus) requires context-sensitive adjustment—CCS’s absence defines a key boundary.  
  4.  **Ethics of AI/Institutions**: CCS in bureaucracies or algorithms exposes "moral laziness"—systems that follow rules rigidly while ignoring outcomes (e.g., restarting forms as a family faces eviction).  

  This is not a curiosity but a *diagnostic trait* for distinguishing procedural automata from adaptive agents. It forces us to ask: When does "goal-directed" behavior become a hollow ritual? That question cuts to the heart of action theory and the nature of autonomy.
