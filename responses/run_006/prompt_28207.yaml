prompt: |-
  ok, here's the thing. i keep seeing people argue about whether an LLM or a crow or a savant is really intelligent by pointing at exactly one case and then building the whole theory downstream of that. i want the spec first. You're a philosopher of cognitive science who has actually worked through this mess; take your time, brainstorm a bit before you commit, and then give me the desiderata.

  The purpose that matters to me: I want a theory of intelligence that can do three jobs at once — (1) compare a human, an octopus, and a neural network without just changing the subject, (2) say whether intelligence is one thing or a family of loosely related capacities, and (3) keep us honest about the difference between being intelligent and merely doing intelligent-looking things. Adequacy is relative to those jobs, so tell me when a requirement is only needed for one of them.

  Give me the list with the reasoning, not just labels:

  - The cases any adequate theory has to get right, each with one sentence on why it's a requirement. At minimum use: a savant who can do calendar calculation but can't manage ordinary life; an LLM that passes a professional licensing exam and then fails a simple novel task a young child gets; a crow or octopus solving a multi-step problem it has never seen before; the Flynn effect, where scores keep rising across cohorts; and a person with high test scores and persistently terrible real-world judgment. Add any others only if they're genuinely load-bearing.
  - The distinctions it can't collapse, with what goes wrong if you collapse each one. I suspect at least: performance vs. competence; fluid vs. crystallized; domain-general vs. domain-specific; intelligence vs. knowledge; and intelligence vs. rationality. Push on the ones you think are overrated.
  - The empirical patterns it has to be consistent with or explain away: the positive manifold (people who do well on one cognitive test tend to do well on others), the way brain damage can knock out one ability and leave others intact, and whatever else you'd treat as non-negotiable.
  - Mark wich requirements are genuine desiderata and which are just the tastes of particular camps (the g-factor people, the multiple-intelligences people, the embodied-cognition people, the AI-capabilities people). I want to know where the list would be controversial.
  - The part I most want: are any two or three of these jointly unsatisfiable? Is a single scalar g compatible with the savant and dissociation cases? Is a fully domain-general account compatible with abilities breaking apart under brain damage? Tell me where the list itself is a result rather than a shopping list, and bold any pair that can't both be met.
  - Then, briefly — one short paragraph each, keep it tight — how the main families fare against the list: psychometric g, multiple intelligences, computational/rational-analysis, and embodied/enactivist. The criteria are the point, so don't let the scorecard take over.
  - End with the single requirement you'd bet knocks out the most candidates, and why.

  A table is fine for the requirements if it helps, but I want the reasoning in prose around it.
reasoning: |-
  Okay, the user is asking for a rigorous framework to evaluate theories of intelligence. They clearly want to avoid superficial arguments and are frustrated with cherry-picked examples. Their core demand is a set of criteria that can handle comparisons across humans, animals, and AI while distinguishing genuine intelligence from mimicry.

  Hmm, the user's background seems technical - probably philosophy or cognitive science adjacent. The way they specify "three jobs" suggests they've seen theories fail at cross-domain comparisons before. Their emphasis on dissociation cases (savants, high-IQ-low-judgment people) hints they reject purely psychometric approaches. 

  Let me unpack their requirements systematically. First, the test cases: Savants challenge monolithic intelligence; LLMs expose simulation vs competence; crows/octopuses demand non-human benchmarks; Flynn effect questions test validity; high-IQ-poor-judgment cases decouple rationality from intelligence. Each is a landmine for oversimplified theories.

  For distinctions: Performance/competence matters because LLMs ace tests but lack understanding. Fluid/crystallized explains why Flynn effect affects some tests more. Domain-general/specific accounts for savants. Intelligence/knowledge separation is crucial for AI debates. Intelligence/rationality distinction covers smart-but-dumb decisions. 

  Empirical constraints: Positive manifold can't be ignored (sorry, radical MI theorists). Dissociation under brain damage kills extreme domain-general views. Development trajectories matter too - intelligence isn't static. 

  *Internal conflict alert*: A strong g-factor clashes with savant cases. Domain-general theories struggle with selective deficits. Embodied cognition fans will hate how LLMs meet some criteria without bodies. 

  Main theories: 
  - g-factor flunks savants and rationality decoupling. 
  - Multiple intelligences ignores positive manifold. 
  - Computational models often miss embodiment. 
  - Enactive theories struggle with crystallized knowledge in AI. 

  The knockout punch? Probably "dissociation-resistance" - any theory must explain how abilities can split (savants) or converge (positive manifold). Most candidates fail one side. 

  User's deepest need might be epistemic honesty - they want a theory that doesn't disappear when cases collide. I'll highlight where requirements conflict to satisfy their skepticism.
answer: |-
  Here's a philosopher's analysis of intelligence desiderata, structured for your goals. After careful consideration of conflicts and camps, the requirements are derived from the core jobs you specified: **cross-comparison, unity/diversity, and simulation vs. competence.**

  ---

  ### **I. Core Test Cases & Why They're Non-Negotiable**
  1. **Savant (e.g., calendar calculator with low adaptive function)**  
     *Requires explaining how isolated excellence coexists with generalized deficit. Tests if intelligence is unitary or dissociable.*  
  2. **LLM (aces exam, fails novel child-level task)**  
     *Exposes competence/performance gaps in artificial systems. Tests if "intelligence" requires understanding vs. pattern-matching.*  
  3. **Crow/Octopus (solves unseen multi-step problem)**  
     *Demands non-anthropocentric benchmarks. Tests domain-generality in non-human biological systems.*  
  4. **Flynn Effect (rising cohort test scores)**  
     *Challenges fixed "innate" intelligence. Tests role of environment/culture in crystallized knowledge.*  
  5. **High test scores, poor real-world judgment**  
     *Decouples intelligence from rationality. Tests if intelligence includes decision-making under uncertainty.*  

  **Added Load-Bearing Case**:  
  6. **Developmental Trajectories (e.g., child prodigies vs. late bloomers)**  
     *Tests if intelligence is a static trait or dynamic capacity. Essential for cross-species/AI comparisons.*  

  ---

  ### **II. Essential Distinctions (Collapsing = Failure)**  
  - **Performance vs. Competence**: Collapse → *LLMs appear "competent" via statistical performance, masking lack of understanding.*  
  - **Fluid vs. Crystallized**: Collapse → *Flynn Effect becomes inexplicable; savant skills conflated with adaptive intelligence.*  
  - **Domain-General vs. Domain-Specific**: Collapse → *Crow intelligence misattributed to instinct; savants threaten g-theory.*  
  - **Intelligence vs. Knowledge**: Collapse → *LLMs mistaken for "knowing" facts rather than retrieving patterns.*  
  - **Intelligence vs. Rationality**: Collapse → *High IQ/poor judgment cases vanish; rationality becomes tautological.*  
  *Overrated Distinction*: "Consciousness" (irrelevant to functional intelligence; crows/LLMs solve problems without it).  

  ---

  ### **III. Non-Negotiable Empirical Patterns**  
  1. **Positive Manifold** (correlation across cognitive tests)  
  2. **Selective Dissociation** (brain damage impairs specific abilities)  
  3. **Developmental Canalization** (intelligence stabilizes in adulthood but varies in childhood)  
  *Ignore these → theory contradicts robust evidence.*  

  ---

  ### **IV. Controversy Mapping**  
  | Requirement                  | Psychometric (g) | Multiple Intel. | Embodied/Enactive | AI-Capabilities |  
  |------------------------------|------------------|-----------------|-------------------|----------------|  
  | Savant Excellence            | ✗ (threatens g)  | ✓               | ✓                 | ✓              |  
  | LLM Competence Gap           | ?                | ✓               | ✓                 | ✗ (downplayed) |  
  | Non-Human Problem-Solving    | ✗ (anthropocentric) | ✓         | ✓                 | ✓              |  
  | Flynn Effect                 | ✓ (crystallized) | ✓               | ✗ (ignores tests) | ✓              |  
  | IQ-Rationality Split         | ✗ (conflates)    | ✓               | ✓                 | ✗ (conflates)  |  
  | Positive Manifold            | ✓ (core axiom)   | ✗ (rejected)    | ?                 | ✓ (in scaling) |  
  | Selective Dissociation       | ✗ (g is unitary) | ✓               | ✓                 | ✓              |  

  **Key Controversies**:  
  - *g-theorists* reject domain-specific dissociations (savants = "anomalies").  
  - *Multiple intelligence advocates* dismiss positive manifold as testing bias.  
  - *Embodied camps* see fluid intelligence as inseparable from sensorimotor engagement.  
  - *AI-capabilities* often conflate performance with competence.  

  ---

  ### **V. Inherent Conflicts: Where Requirements Clash**  
  1. **Positive Manifold vs. Selective Dissociation**  
     → *g-theory struggles: if g is unitary, brain damage shouldn't dissociate abilities so cleanly.*  
  2. **Domain-General Claims vs. Savant/Crow Cases**  
     → *Pure domain-general theories (e.g., some computational models) can't explain isolated excellence without ad-hoc fixes.*  
  3. **Fluid Intelligence vs. Flynn Effect**  
     → *If fluid g is biologically fixed, Flynn gains (increasingly abstract tests) shouldn't occur.*  
  **Bold Conflict**: **Positive manifold requires coherence, but dissociation cases demand fracture.**  

  ---

  ### **VI. Theory Scorecard (Brief)**  
  - **Psychometric g**: Excels at positive manifold and cross-task prediction. *Fails* savants, dissociation, IQ-rationality split.  
  - **Multiple Intelligences**: Handles savants, dissociation, non-human intelligence. *Fails* positive manifold, Flynn Effect (no "rising g").  
  - **Computational/Rational**: Strong on competence/performance, LLM critique. *Fails* embodied cognition (crows/octopuses), IQ-rationality split.  
  - **Embodied/Enactive**: Best for crows/octopuses, integrates environment. *Fails* crystallized knowledge (Flynn), LLM competence gaps.  

  ---

  ### **VII. The Knockout Requirement**  
  **Dissociation-Resistance**: Any theory must explain why abilities *sometimes* correlate (positive manifold) but *sometimes* dissociate entirely (savants, brain damage, IQ-rationality splits).  
  *Why it kills most candidates*:  
  - g-theory can't handle dissociation without abandoning unity.  
  - Multiple intelligences can't explain correlations without admitting hierarchy.  
  - Computationalism struggles with "fractionated" competence in biological systems.  
  - Embodied views lack tools to explain crystallized knowledge peaks in savants/LLMs.  

  **Result**: Intelligence must be a *hierarchically nested construct*—domain-specific mechanisms scaffolded by domain-general resources (attention, working memory), with rationality as a downstream application. No single scalar survives; no disconnected modules explain coherence. Your "family of capacities" (Job #2) wins, but only if their interactions are specified.
