answer: |-
  Here are the core desiderata for any adequate costly signaling theory, derived from the phenomena you listed and the conceptual distinctions that matter. Treat this as the "spec sheet" for evaluating theories.

  **Core Desiderata (Non-Negotiable)**

  1.  **Honesty at Equilibrium:** The theory must explain why signals *reliably convey true information about the sender's unobservable quality/intention/type* in a stable state (equilibrium). Signals cannot be routinely deceptive without collapsing.
      *   *Why:* Fundamental to all cases. Ornaments must correlate with mate quality, warnings with toxicity, stotting with escape ability, threats with fighting ability, sacrifices with commitment. Without honesty, signals are useless or misleading.
      *   *Case:* Mate-choice (peacocks), Aposematism (poison frogs), Threats (stags roaring).

  2.  **Differential Cost (Marginal Cost):** The *net cost* (or difficulty) of producing a signal of a given magnitude/intensity must be *lower* for senders with higher underlying quality/trait value *at the margin*. Higher-quality senders pay a *lower marginal cost* for the same signal level, or can afford a *higher signal level* for the same net cost.
      *   *Why:* This is the core mechanism preventing low-quality cheaters from faking high-quality signals. It's the mathematical definition of a "handicap." Non-negotiable. "Expensive" alone isn't enough; it must be *differentially* expensive.
      *   *Case:* A weak gazelle pays a higher survival cost (increased predation risk, energy drain) for stotting than a fast one. A low-quality bird pays a higher fitness cost (immunocompromise, energy) for a large ornament than a high-quality one.

  3.  **Stability Against Cheating:** The equilibrium must be evolutionarily stable (ESS) or Nash stable. Senders must have no incentive to deviate (e.g., signal dishonestly) *given the receiver's response strategy*, and receivers must have no incentive to deviate (e.g., ignore the signal) *given the sender's signaling strategy*.
      *   *Why:* Ensures the signaling system persists. If cheating is profitable, it will invade and destroy reliability.
      *   *Case:* If a non-toxic butterfly could cheaply mimic a toxic one and avoid predation, it would. The theory must explain why this doesn't happen or is unstable.

  4.  **Receiver Benefit:** The signal must provide *net benefits to receivers* that outweigh the costs of attending to it and responding appropriately. Receivers must gain fitness/payoff from using the signal to make better decisions.
      *   *Why:* Drives the co-evolution of the response. If receivers don't benefit, they won't evolve responses, making the signal pointless. Signals exist because receivers *use* the information.
      *   *Case:* Females benefit by choosing higher-quality mates via ornaments. Predators benefit by avoiding toxic prey via aposematism. Opponents benefit by avoiding costly fights via honest threats.

  **Essential Distinctions & Mechanisms (Non-Negotiably Accounted For)**

  5.  **Signal vs. Cue:** Must distinguish signals (traits evolved *because* they convey information, modifying receiver behavior) from cues (traits that convey information as a byproduct, not evolved *for* communication).
      *   *Why:* Costly signaling specifically addresses the evolution of *signals*. Confusing cues (e.g., limping revealing injury) with signals (e.g., stotting) misses the point of evolved communication systems.
      *   *Case:* A predator seeing a limping gazelle (cue) vs. seeing a gazelle deliberately stotting (signal).

  6.  **Honesty Mechanism vs. Equilibrium Honesty:** Must specify *how* honesty is enforced (the mechanism, e.g., differential cost, punishment, physical constraint) and *why* this leads to a stable, honest equilibrium.
      *   *Why:* "Honest" isn't magic; it needs a cause. Simply stating signals are honest at equilibrium isn't sufficient; the *how* (mechanism) must be linked to the *why* (stability).
      *   *Case:* Handicap Principle (differential cost enforces honesty) vs. Punishment Models (receivers punish dishonest signals).

  7.  **Evolved Cost vs. Physical Constraint Cost:** Must distinguish signals whose cost is an *evolved feature* of the communication system (a handicap) from signals whose cost arises purely from *physical/physiological necessity* unrelated to signaling (e.g., large antlers for fighting also being used as a signal).
      *   *Why:* The Handicap Principle specifically posits that costs can be *strategically added* to enforce honesty. Costs from physical constraints alone don't necessarily imply strategic signaling evolution.
      *   *Case:* A deer's antlers used in fighting (physical constraint cost) vs. a peacock's tail, where much of the cost *is* the signal (evolved handicap cost).

  **Important Considerations (Highly Desirable, Often Non-Negotiable in Practice)**

  8.  **Explaining Variation in Signal Magnitude:** Must account for why signals vary in size/intensity/costliness *within* a population (e.g., why are some tails longer than others?).
      *   *Why:* Variation is ubiquitous. A theory only explaining "signal vs. no signal" is incomplete. Often linked to differential costs and separating equilibria.
      *   *Case:* Variation in tail length among peacocks, toxin levels among poison frogs (signaled by brightness).

  9.  **Accounting for Cheating/Predation Attempts:** Must explain the (often low) frequency of cheating attempts or unreliable signals (e.g., Batesian mimicry, failed bluffs) and why they don't overwhelm the system.
      *   *Why:* Cheating attempts *do* exist; the theory must be robust enough to incorporate them or explain their rarity/instability.
      *   *Case:* Non-toxic mimics of aposematic species exist but are often rare.

  10. **Applicability Across Domains:** Must provide a coherent framework applicable to the core biological cases (mate choice, warning, deterrence, aggression) *and* potentially human cultural signals.
      *   *Why:* The core logic should be universal, even if implementation differs (e.g., genetic vs. cultural transmission, individual vs. group selection). A theory only working for mate choice is inadequate.
      *   *Case:* Potlatch (costly destruction displays wealth/reliability) as a human cultural analogue.

  11. **Efficiency/Non-Wastefulness (If Possible):** Should ideally show that the cost is the *minimal necessary* to ensure honesty at the required level of reliability, avoiding systematic, pointless waste.
      *   *Why:* A major criticism of early handicap ideas was "waste." While some waste is inherent, systems shouldn't be *more* wasteful than needed. (This is a point of tension - see below).
      *   *Case:* Is the peacock's tail *as costly as it is* purely because it needs to be that costly to be honest, or could a slightly cheaper tail convey the same info? A theory explaining the former is stronger.

  **Tensions & Trade-offs**

  *   **Honesty, Stability & Non-Wastefulness:** This is the primary tension. Achieving perfect honesty in a stable equilibrium often requires significant costs (waste). Minimizing waste might require tolerating *some* imprecision or instability (e.g., partial pooling equilibria, some cheating). A **fully separating equilibrium** (every quality level sends a distinct signal) maximizes information but often requires the highest costs to prevent cheating at every level. **Pooling or partial pooling** equilibria (groups of qualities send the same signal) are cheaper but convey less precise information. **Sender/Receiver Optimality** is also in tension with minimal cost: the signal level that's optimal for the sender (maximizing benefit minus cost) may not be the level that provides the most precise information for the receiver at the lowest *system* cost.
  *   **Differential Cost Universality vs. Implementation:** The *requirement* for differential cost is non-negotiable. However, *how* that differential cost arises can vary significantly (e.g., physiological linkage, resource allocation trade-offs, direct receiver punishment for under-performance) across cases. A theory insisting on one specific *source* of differential cost (e.g., only immunocompetence) would be overly restrictive.

  **The Knockout Punch Requirement**

  *   **Differential Cost (Marginal Cost - Desideratum 2)** does the most work in eliminating sloppy versions. **"It's honest because it's expensive" is fatally incomplete.** Sloppy versions fail because:
      1.  They don't specify *for whom* it's expensive. If it's equally expensive for everyone, high and low quality alike, then a low-quality individual *could* still fake it if the benefit is high enough (e.g., attracting a great mate by building a huge, costly nest they can't actually provision).
      2.  They confuse **total cost** (which might just reflect physical necessity) with **differential/marginal cost** (the key enforcer of honesty).
      3.  They don't link cost to the *specific unobservable quality* being signaled. The cost must be differentially linked to *that quality*.

  **In Summary:** An adequate costly signaling theory must center on **differential costs enforcing honesty at a stable equilibrium where receivers benefit.** It must rigorously handle the core distinctions (signal/cue, mechanism/equilibrium, evolved/physical cost) and explain variation while navigating the inherent tension between perfect honesty/stability and efficiency. Any theory that cannot clearly articulate and rigorously model **differential marginal cost** as the linchpin preventing cheating fails the most fundamental test.
