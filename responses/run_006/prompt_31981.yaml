  i'm trying to get my head around costly signaling theory and the handicap principle before i read any more of it, and i'd rather start from the spec than from whatever the latest model happens to do. so write me the desiderata. what does a theory of costly signaling actually have to get right to count as adequate? give me the full list of requirements, with the case or consideration behind each. i want the cases covered: mate-choice ornaments, aposematic displays, stotting and other pursuit-deterrence stuff, aggressive displays that let animals settle contests without fighting, maybe human things like potlatch or risky public sacrifice. i also want the distinctions a theory can't collapse: signal vs cue, honest at equilibrium vs honest as a mechanism, average cost vs marginal or differential cost, and signals that evolved to be costly vs signals that are costly because they're physically constrained. for each requirement say why it's a requirement and whether it's non-negotiable or just a camp preference. then the part i most want: tell me if any subset of these desiderata is jointly unsatisfiable or at least in tension—like honesty, no incentive to cheat, and not being systematically wasteful; or a fully separating equilibrium and sender/receiver optimality. and say which single requirement does the most work in knocking out the sloppy versions of the handicap principle, the ones that just say "it's honest because it's expensive" and leave it there. keep the scorecard of existing theories brief or skip it, the criteria are what i'm after.
