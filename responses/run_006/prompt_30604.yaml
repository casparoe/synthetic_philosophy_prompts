  ### Decision Procedure for Invertebrate Welfare Protections  
  This procedure uses a linear, evidence-based pathway to assign one of four tiers:  
  - **Full protection**: Required for animals with strong evidence of capacity for suffering (e.g., humane stunning/slaughter).  
  - **Limited protection**: Applied when evidence is ambiguous but warrants safeguards (e.g., stress reduction during transport).  
  - **No protection**: No welfare requirements beyond baseline hygiene.  
  - **Insufficient evidence with precautionary handling**: Uncertainty triggers default safeguards (e.g., rapid chilling).  

  Key philosophical/scientific distinctions:  
  - **Nociception ≠ felt pain**: Reflexive harm avoidance (nociception) is insufficient; we require evidence of *affective experience* (e.g., trade-offs between pain and reward).  
  - **Consciousness is graded**: Valenced experience (pleasure/suffering) is prioritized over self-awareness.  
  - **Evidence hierarchy**: Behavioral markers (e.g., avoidance learning) outweigh neuroanatomy; both are assessed independently.  
  - **Precautionary principle**: Applied only when evidence is inconclusive but nociception exists.  

  | Step | Question to ask                                                                                                                                                               | What counts as a yes                                                                                                                               | What counts as a no                                                                                                                                 | Action if yes                                                                 | Action if no or insufficient evidence                                                                 | Judgment call?       |  
  |------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|----------------------|  
  | 1    | Is there robust evidence of nociception? (e.g., nociceptors + reflex responses to injury)                                                                                     | Peer-reviewed studies document specialized receptors and withdrawal/escape reflexes.                                                              | No documented receptors or reflexes; responses are non-specific (e.g., general mechanical reaction).                                                | Go to Step 2                                                                  | Assign: **No protection**                                                                             | Factual             |  
  | 2    | Is there evidence of *felt pain* from behavioral markers? (e.g., avoidance learning, trade-offs, protective behavior, or analgesia-modulated responses)                         | ≥1 study shows: conditioned avoidance of harm-associated contexts, sacrifice of rewards to avoid injury, guarding wounds, or painkiller mitigation. | Only reflexive responses (e.g., immediate withdrawal); no learning/trade-offs; responses unchanged by analgesics.                                  | Go to Step 3                                                                  | Go to Step 4                                                                                          | Factual             |  
  | 3    | Is there neuroanatomical evidence supporting pain integration? (e.g., centralized brain with opioid receptors or structures analogous to vertebrate pain-processing regions) | Brain/ganglia show: synaptic integration, endogenous pain modulation (e.g., opioids), or sensory-emotional crossover.                             | Nervous system is decentralized (e.g., nerve nets); no brain regions for sensory integration; absence of pain-modulating neurotransmitters.         | Assign: **Full protection**                                                   | Go to Step 4                                                                                          | Factual             |  
  | 4    | (From Step 2 "no" or Step 3 "no") Is there *any* credible evidence of felt pain? (e.g., weak behavioral markers OR neuroanatomical ambiguity)                                  | Inconclusive/contested studies (e.g., single-behavior indicators like rubbing wounds) OR partial neuroanatomy (e.g., ganglia but no opioids).     | Complete absence of behavioral/neuroanatomical evidence for pain; consensus that responses are purely reflexive.                                  | Go to Step 5                                                                  | Go to Step 6                                                                                          | Factual             |  
  | 5    | (From Step 4 "yes") Does the precautionary principle apply? (i.e., is potential suffering plausible enough to justify safeguards?)                                             | N/A – committee deliberates risk severity and feasibility of precautions.                                                                         | N/A – committee deliberates risk severity and feasibility of precautions.                                                                           | Assign: **Insufficient evidence with precautionary handling**                 | Assign: **No protection**                                                                             | **Value judgment** |  
  | 6    | (From Step 1 "no" or Step 4 "no") Is nociception absent?                                                                                                                      | Confirmed absence of nociceptors/reflexes.                                                                                                       | Nociception present but no evidence of felt pain.                                                                                                 | Assign: **No protection**                                                     | Go to Step 5 (if nociception exists)                                                                  | Factual             |  

  ### Worked Cases  
  #### Case 1: Octopus (*Octopus vulgaris*)  
  - **Evidence inputs**:  
    - Nociception: Yes (nociceptors; reflex arm withdrawal).  
    - Behavioral pain markers: Yes (avoids electric shocks after one exposure; sacrifices food for pain relief; guards injured arms).  
    - Neuroanatomy: Yes (centralized brain with vertical lobe; opioid receptors; sensory integration analogous to mammals).  
  - **Path through steps**:  
    - Step 1: Yes → Step 2.  
    - Step 2: Yes → Step 3.  
    - Step 3: Yes → **Full protection**.  
  - **Resulting tier**: Full protection.  
  - **Confidence**: High.  
  - **Residual uncertainty**: None for welfare requirements. Disagreement exists on whether octopus consciousness resembles vertebrates, but valenced experience is well-supported.  

  #### Case 2: Blue Crab (*Callinectes sapidus*)  
  - **Evidence inputs**:  
    - Nociception: Yes (nociceptors; reflexive leg autotomy).  
    - Behavioral pain markers: Contested (rubs injured areas; avoids shock zones but learning speed debated; no trade-off studies).  
    - Neuroanatomy: Partial (centralized ganglia; opioid receptors present but limited integration evidence).  
  - **Path through steps**:  
    - Step 1: Yes → Step 2.  
    - Step 2: **No** (inconclusive trade-offs/learning) → Step 4.  
    - Step 4: Yes (weak evidence: rubbing + opioids) → Step 5.  
    - Step 5: **Value judgment** → Assign **Insufficient evidence with precautionary handling** (majority vote: risk justifies rapid chilling).  
  - **Resulting tier**: Insufficient evidence with precautionary handling.  
  - **Confidence**: Low (behavioral evidence disputed).  
  - **Residual uncertainty**: Smart reversal possible if committee weights neuroanatomy higher (assigning Limited protection) or dismisses rubbing as reflex (No protection). Producers will oppose precautionary measures.  

  #### Case 3: Pacific Oyster (*Magallana gigas*)  
  - **Evidence inputs**:  
    - Nociception: Yes (generalized mechanoreceptors; shell closure reflex).  
    - Behavioral pain markers: No (no avoidance learning; no injury response beyond reflex).  
    - Neuroanatomy: No (decentralized ganglia; no brain; no pain-modulation systems).  
  - **Path through steps**:  
    - Step 1: Yes → Step 2.  
    - Step 2: No → Step 4.  
    - Step 4: No (no credible evidence) → Step 6.  
    - Step 6: Nociception present → Step 5.  
    - Step 5: **Value judgment** → Assign **No protection** (majority: no plausible suffering evidence).  
  - **Resulting tier**: No protection.  
  - **Confidence**: Medium.  
  - **Residual uncertainty**: Precautionary tier defensible if committee emphasizes nociception + ecological complexity (e.g., stress-induced spawning).  

