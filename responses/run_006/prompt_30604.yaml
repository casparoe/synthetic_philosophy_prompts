  1. Nociception vs. felt pain: Nociception is the detection of harmful stimuli and the initiation of reflexive responses. Felt pain involves a subjective, negative experience. We want to know if the animal feels pain, not just reacts.

  2. Consciousness: Is it binary (either present or absent) or graded (varying levels)? For welfare, we are primarily concerned with the capacity for valenced experiences (positive and negative feelings) rather than self-awareness or higher cognitive abilities.

  3. Evidence: We'll consider both behavioral markers (e.g., avoidance learning, protective behavior, trade-offs with other motivations) and neuroanatomical evidence (e.g., presence of brain structures analogous to those involved in pain processing in vertebrates, especially mammals). However, note that invertebrates lack a neocortex, so we must look for functional analogs.

  4. Precautionary principle: When evidence is thin, we may err on the side of caution and require some protections.

  The procedure will have steps that are mostly factual (based on evidence) but some may require value judgments (e.g., how much evidence is enough, or how to weigh conflicting evidence).

  We'll define four tiers of protection:
  - Full protection: Requires methods that minimize pain and distress (e.g., effective stunning before slaughter, humane transport).
  - Limited protection: Requires avoiding unnecessary harm, but without the same level of certainty as full protection (e.g., avoiding practices known to cause prolonged suffering, but stunning may not be required if evidence is weak).
