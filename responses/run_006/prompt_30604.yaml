  ### Key Notes for Committee  
  1. **Procedural limits**:  
     - Steps 2 (behavior) and 3 (neuroanatomy) are **factual** but open to interpretation (e.g., "robust" evidence thresholds).  
     - Step 5 is a **value judgment**; committees may disagree on risk tolerance.  
  2. **Reversible calls**:  
     - Blue crab outcome could shift to "No protection" if behavioral markers are dismissed (Step 2 → Step 4 "no" → Step 6).  
     - Pacific oyster could shift to "Insufficient evidence" if precaution wins (Step 5 "yes").  
  3. **Board conflict**:  
     - Blue crab's precautionary tier will anger producers (added costs) but satisfy retailers/cephalopod researchers.  
