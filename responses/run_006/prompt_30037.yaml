  The challenge is balancing simplicity with philosophical rigor - keeping scenarios concrete while ensuring each question meaningfully contributes to mapping the ethical landscape. The scoring key will need clear decision trees to handle overlapping answer patterns.
answer: |-
  Here's a quiz designed to probe intuitions about aggregating harm, inspired by the "torture vs. dust specks" dilemma, written in British English with minimal jargon. It focuses on concrete choices to reveal underlying principles.

  **The Harm Calculus Quiz**

  **Instructions:** For each scenario, choose the outcome you believe is **morally preferable** (or least bad). Answer intuitively and honestly – there are no "right" answers, only revealing ones!

  1.  **The Classic:**
      *   A) One person experiences 50 years of excruciating torture.
      *   B) 3^20 people (roughly 3.5 billion) each experience a tiny, barely noticeable speck of dust in one eye for a moment.
      *   ➡️ Choice: ____

  2.  **Concentrated Specks:**
      *   A) 3^20 specks of dust land in one person's eye, all at once. This is intensely irritating and painful for several minutes, like severe grit or sand in the eye, but causes no lasting damage.
      *   B) One person experiences 50 years of excruciating torture.
      *   ➡️ Choice: ____

  3.  **Mid-Level Harm vs. Vast Specks:**
      *   A) 10^15 people (1 quadrillion) each get a tiny, barely noticeable speck of dust in one eye for a moment.
      *   B) One person suffers a clean break of their forearm (painful, requires a cast for weeks, significant temporary inconvenience).
      *   ➡️ Choice: ____

  4.  **Repeated Tiny Harm (One Person):**
      *   A) One person experiences a single, moderately painful headache lasting 4 hours.
      *   B) The *same* person experiences one-million separate instances of a barely noticeable flicker of discomfort (like the dust speck) randomly spaced throughout their lifespan.
      *   ➡️ Choice: ____

  5.  **Breaking Point?**
      *   A) One person suffers a clean break of their forearm.
      *   B) 10^9 people (1 billion) each experience a distinct, moderately painful pinch on the arm (like a hard nip) lasting a few seconds.
      *   ➡️ Choice: ____

  6.  **Distribution Matters?**
      *   A) One person experiences 10,000 barely noticeable dust specks in their eye over their lifetime (one speck every few days on average).
      *   B) 10,000 *different* people each experience one barely noticeable dust speck in their eye.
      *   ➡️ Choice: ____

  7.  **Threshold Test:**
      *   A) One person suffers a clean break of their forearm.
      *   B) 10^20 people (100 quintillion) each experience a sensation so faint it's literally imperceptible – like a single photon hitting their retina. They never notice it, feel it, or are affected by it in any way.
      *   ➡️ Choice: ____

  8.  **Torture vs. Imperceptible:**
      *   A) One person experiences 50 years of excruciating torture.
      *   B) 10^30 people each experience a sensation so faint it's literally imperceptible. They are completely unaware of it.
      *   ➡️ Choice: ____

  9.  **The Slippery Slope:**
      *   A) One person stubs their toe quite painfully (enough to make them hop and curse for a minute).
      *   B) 10^25 people each experience a sensation so faint it's literally imperceptible. They are completely unaware of it.
      *   ➡️ Choice: ____

  **Scoring Key & Position Mapping**

  This key maps patterns of answers onto philosophical positions based on the *structure* of your choices. It focuses on the logical implications revealed by your answers across different scenarios.

  **1. Aggregative Utilitarian (AU):**
      *   **Core Belief:** All harms, no matter how small, can be summed across individuals. The total "disutility" matters. More people experiencing a very small harm can eventually outweigh a severe harm to one person.
      *   **Answer Pattern:**
          *   Q1: B (Specks over torture - vast numbers outweigh)
          *   Q2: A (Concentrated specks over torture - concentrated harm is less than torture)
          *   Q3: A (Quadrillion specks over broken arm)
          *   Q4: B (Million specks over headache - summed small harms outweigh single medium harm)
          *   Q5: B (Billion pinches over broken arm)
          *   Q6: A or B (Indifferent - total harm is the same)
          *   Q7: B (Imperceptible over broken arm - vast numbers *do* outweigh a moderate harm)
          *   Q8: B (Imperceptible over torture - vast numbers *do* outweigh extreme harm)
          *   Q9: B (Imperceptible over stubbed toe)
      *   **Key Tests Passed:** Accepts vast tiny harms outweighing severe harms (Q1, Q8), accepts imperceptible harms summing (Q7, Q8, Q9), indifferent to distribution (Q6).

  **2. Lexical Priority (LP):**
      *   **Core Belief:** Severe suffering has absolute moral priority. No amount of minor annoyances, no matter how many people experience them, can morally outweigh *any* instance of extreme suffering like prolonged torture. There's a strict hierarchy where the worst-off individual's suffering dominates.
      *   **Answer Pattern:**
          *   Q1: A (Torture over any specks)
          *   Q2: B (Torture over concentrated specks - torture is still worse)
          *   Q3: B (Broken arm over specks - moderate harm > vast minor harms)
          *   Q4: A (Headache over million specks - single medium harm > summed small harms)
          *   Q5: A (Broken arm over billion pinches)
          *   Q6: B (Distributed specks preferable - avoids concentrating even minor annoyance)
          *   Q7: A (Broken arm over imperceptible - moderate harm > any number of non-harms)
          *   Q8: A (Torture over imperceptible - severe harm > any number of non-harms)
          *   Q9: A (Stubbed toe over imperceptible - noticeable harm > any number of non-harms)
      *   **Key Tests Passed:** Always chooses the option with the most severe *individual* suffering (Q1, Q2, Q3, Q5, Q7, Q8, Q9). Rejects summation (Q1, Q3, Q5). Prefers harm distribution (Q6).

  **3. Threshold Utilitarian (TU):**
      *   **Core Belief:** Harms can be summed, *but only above a certain threshold of significance*. Harms below this threshold (e.g., imperceptible, or perhaps even noticeable specks) contribute nothing or negligible weight to the sum. They cannot outweigh harms above the threshold.
      *   **Answer Pattern:**
          *   Q1: A (Torture over specks - specks below threshold, don't sum enough)
          *   Q2: A (Concentrated specks over torture - concentrated harm *is* above threshold and less than torture)
          *   Q3: A or B (Ambiguous - Broken arm might be above threshold, quadrillion specks might be below *or* their sheer number might push total above)
          *   Q4: A (Headache over million specks - specks below threshold, don't sum)
          *   Q5: A or B (Ambiguous - Pinches might be above/below threshold)
          *   Q6: A or B (Indifferent or prefers distribution - if above threshold, sum matters; if below, doesn't)
          *   Q7: A (Broken arm over imperceptible - imperceptible definitely below threshold, count as zero)
          *   Q8: A (Torture over imperceptible - imperceptible count as zero)
          *   Q9: A (Stubbed toe over imperceptible - imperceptible count as zero)
      *   **Key Features:** Crucially rejects imperceptible harms summing (Q7, Q8, Q9). Rejects or is ambiguous about *noticeable* tiny harms (like specks/pinches) summing to outweigh moderate/severe harms (Q1, Q3, Q4, Q5). Accepts concentrated harm above threshold outweighing torture (Q2).

  **4. Distribution-Sensitive Aggregator (DSA):**
      *   **Core Belief:** Harms can be summed, but the *distribution* matters intrinsically. Concentrating harm on fewer individuals is worse than spreading the same total harm thinly across many, even if the individuals experience it as minor. Suffering is non-linear with intensity.
      *   **Answer Pattern:**
          *   Q1: B (Specks over torture - vast numbers outweigh *and* avoids extreme concentration)
          *   Q2: B (Torture over concentrated specks - concentrated medium harm is worse than severe harm? Or maybe A? **Incoherence Risk**)
          *   Q3: A (Specks over broken arm - avoids concentration)
          *   Q4: A (Headache over million specks - avoids diffuse suffering burden on one)
          *   Q5: B (Billion pinches over broken arm - avoids concentration)
          *   Q6: **B** (Strongly prefers distributed specks over concentrated on one)
          *   Q7: A or B (Imperceptible vs Broken Arm - depends on view of imperceptible)
          *   Q8: A or B (Torture vs Imperceptible - depends on view of imperceptible)
          *   Q9: A or B (Stubbed Toe vs Imperceptible - depends on view of imperceptible)
      *   **Key Tests Passed:** Strong preference for distributed minor harms over concentrated harm (Q6), likely prefers specks over torture (Q1) *and* pinches over broken arm (Q5). Crucial test is Q2 vs Q1: If you choose B in Q1 (specks over torture) *and* B in Q2 (torture over concentrated specks), it reveals a strong distribution-sensitivity where concentrated medium harm is seen as *worse* than severe harm. This is unusual but coherent. Choosing A in Q2 (concentrated specks over torture) aligns more easily with AU.

  **5. Inconsistent / Contextual (IC):**
      *   **Core Belief:** No single principle captures moral intuition. Decisions are highly context-dependent, intuitive, or based on factors not captured by simple aggregation (e.g., rights violations, symbolic significance, personal resonance). Answers don't form a logically consistent ranking.
      *   **Answer Pattern:** Shows significant inconsistencies when choices are chained logically. Common examples:
          *   Choosing B in Q1 (specks over torture) but A in Q3 (broken arm over quadrillion specks) without a clear threshold principle to explain the difference in numbers.
          *   Choosing A in Q1 (torture over specks) but B in Q5 (billion pinches over broken arm) without a clear principle distinguishing torture from a broken arm in this context.
          *   Strongly rejecting imperceptible harms (Q7, Q8, Q9) but accepting specks summing in Q3 or Q5.
          *   Inconsistent answers on distribution (Q6) vs. summation (Q1, Q3, Q5).
      *   **Key Feature:** The pattern cannot be neatly mapped to AU, LP, TU, or DSA without significant contradictions when comparing answers across different scenarios. This is common and reflects the intuitive difficulty of the dilemmas.

  **Notes on the Mapping:**

  1.  **Unlikely/Unattractive Positions:**
      *   **Accepting Imperceptible Harms Summing to Outweigh Noticeable Harms (Q7=B, Q9=B):** Logically coherent for a strict AU, but most people (even utilitarians) find this deeply counterintuitive and reject it (Q7=A, Q9=A). Positions holding Q7=B or Q9=B are rare and often deemed unattractive.
      *   **Strong DSA choosing Torture over Concentrated Specks (Q2=B):** Logically possible if one *really* believes concentrated medium harm is worse than severe harm spread over time. This is highly unusual and arguably incoherent with valuing suffering reduction, as torture seems objectively worse. Most DSA lean towards Q2=A.

  2.  **Distinguishing Challenges:**
      *   **AU vs TU:** The clearest differentiator is the treatment of *imperceptible* harms (Q7, Q8, Q9). AU accepts they can sum (B); TU rejects (A).
      *   **LP vs TU:** Both reject vast specks outweighing torture (Q1=A). Key differentiator is Q2: LP *always* chooses torture (B); TU chooses concentrated specks (A) because it's above threshold and less bad. Also, TU is more likely to accept vast minor harms summing against *moderate* harms (Q3=A, Q5=B) if above threshold, which LP rejects (Q3=B, Q5=A).
      *   **DSA vs AU:** The clearest differentiator is Q6 (strong preference for B) and especially Q2. Choosing B in Q2 flags strong DSA. Choosing A in Q2 makes DSA hard to distinguish from AU without other distribution questions. Q4 (Headache vs Million Specks on One) also probes distribution sensitivity specifically on one person.
      *   **Threshold Location:** TU is inherently fuzzy. Where someone draws the threshold (above specks? above pinches? only above noticeable pain like headache?) will cause variation in Q3, Q4, Q5. The quiz identifies the *existence* of a threshold (via Q7/A, Q8/A, Q9/A) but not its precise location.

  3.  **Coherence & Unexplored:** The IC category highlights that many answer sets are logically inconsistent. This isn't necessarily "unexplored" philosophically (contextualism exists) but shows the limits of simple aggregation models. The position accepting imperceptible harms summing (Q7=B, Q8=B, Q9=B) is coherent but largely unexplored/unattractive in practical ethics.

  **How to Use:**

  1.  Have your friends take the quiz.
  2.  Tally their answers (A or B for each question).
  3.  Compare their pattern to the descriptions above. Look for the best fit.
  4.  Focus on the key differentiator questions:
      *   Q1 & Q8: Core torture vs specks/imperceptible (AU vs LP/TU/DSA)
      *   Q2: Tests distribution sensitivity vs threshold/lexical (DSA vs AU/TU/LP)
      *   Q7 & Q9: Imperceptible harms (AU vs Everyone Else)
      *   Q6: Pure distribution sensitivity (DSA flag)
      *   Inconsistencies: Flag for IC.

  This quiz forces concrete choices that reveal underlying commitments about summation, thresholds, lexical priority, and distribution, without ever asking directly about philosophical labels. Enjoy the discussions it sparks!
