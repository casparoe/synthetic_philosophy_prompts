prompt: |-
  I am a novelist, and I am at work on a novel whose secondary character, Miriam Hart, is a retired competition economist who for thirty years wrote a fortnightly newspaper column in which she ruled, case by case, on whether some situation amounted to a genuine race to the bottom — the kind of self-defeating competition sometimes called a Moloch problem. I have drafted the record of her published rulings, but I have deliberately left her underlying principle unstated, because a late scene turns on her being consulted about a new case. I would like you to help me make that principle precise enough that the scene will feel earned rather than arbitrary.

  Her published rulings, as I have drafted them, are these.

  1. A coastal town's fishing boats overfished their shared bay until the stock collapsed and the local fleet was ruined. She called this a textbook race to the bottom and later endorsed the quota scheme the town adopted.

  2. Two neighbouring states drifted into a naval arms race that ended in a war neither government had wanted, with heavy civilian losses. She called it the purest multipolar trap she had ever written about.

  3. A school was caught up in an annual competition among pupils over increasingly expensive branded trainers; each cohort tired of the game within a term or two, and nobody outside the competition was much affected. She wrote that it was wasteful and mildly absurd but not, in her sense, a race to the bottom.

  4. The shops on a town's high street each extended their opening hours until all of them were open around the clock; takings did not rise, the shopkeepers were exhausted, and the hours could have been wound back within a week by a simple agreement. She declined to support a by-law and said it was the shopkeepers' own sleep to lose.

  5. Two rival software firms in the same city bid up one another's salaries for engineers until both firms' margins were squeezed, with the engineers as the obvious beneficiaries. She ruled that this was competition doing its ordinary work rather than a race to the bottom.

  The new case I have planned is this. The shops on the same high street as case 4 have lately taken to amplified street advertising: each shop plays recorded messages through a loudspeaker, each turns up the volume to be heard over the others, no shop gains custom from the practice, and the noise has become a serious nuisance to the residents who live above and behind the shops. A single by-law, or a voluntary agreement among the shopkeepers, could end the practice overnight at negligible cost.

  Would Miriam Hart call this a race to the bottom, and would she support the by-law? I am less interested in the bare answer than in the principle she seems to be running, the other principles that fit her published rulings just as well, and which further case would best tell those principles apart. Please set out the candidate principles, say what each predicts about the new case, give your best guess about her ruling with your reasons for preferring that principle, and specify the further case that would discriminate most cleanly.
reasoning: |-
  We are given five prior rulings by Miriam Hart and a new case. We need to infer her underlying principle that explains the prior rulings and then apply it to the new case.

  Let me summarize the cases:

  1. **Fishing boats (race to the bottom)**: Overfishing led to stock collapse and ruin. Endorsed quota scheme (a regulatory solution).

  2. **Naval arms race (race to the bottom)**: Arms race led to an unwanted war with heavy civilian losses. Called it a multipolar trap.

  3. **Expensive trainers (not race to bottom)**: Wasteful and absurd but not a race to the bottom. No lasting harm, and the problem resolved quickly without intervention.

  4. **Extended opening hours (not race to bottom)**: Shopkeepers extended hours until all were open 24/7, leading to exhaustion without increased takings. She declined to support a by-law, saying it was their own sleep to lose.

  5. **Bidding up salaries (not race to bottom)**: Software firms bid up salaries until margins were squeezed, but engineers benefited. She said it was ordinary competition.

  New case: **Amplified street advertising**. Shops use loudspeakers, each turns up volume to be heard, no gain in custom, and it becomes a nuisance to residents. A by-law or agreement could end it at negligible cost.

  We are to find a principle that fits the five rulings and then apply it to the new case.

  **Step 1: Identify patterns in the rulings**

  What do the positive cases (1 and 2) have in common with each other, and how do they differ from the negative cases (3, 4, 5)?

  Case 1 and 2 (positive for race to the bottom):
  - Involve a common resource or a situation where individual actions lead to collective ruin.
  - The negative outcome is severe and irreversible (collapse of fish stocks, war with heavy losses).
  - The participants are trapped in a situation where unilateral defection (or non-cooperation) leads to a worse outcome for everyone.

  Case 3, 4, 5 (negative):
  - Case 3: The competition is self-limiting (each cohort tires of it) and the harm is temporary and contained (only the participants, and they stop after a term or two). No lasting damage.
  - Case 4: The harm is primarily to the participants (shopkeepers lose sleep) and they could easily reverse it by agreement. There is no mention of harm to third parties (except perhaps the shopkeepers' own health, but she says it's their own sleep to lose). Also, the harm is reversible (they can wind back the hours).
  - Case 5: The competition leads to a redistribution (from firms to engineers) but not a net social loss. The firms' margins are squeezed, but the engineers gain. Overall, it might be efficient (allocating engineers to the highest value use) even if the firms are worse off.

  **Step 2: Formulate candidate principles**

  Candidate 1: **A race to the bottom occurs when individual rational actions lead to a collectively suboptimal outcome that is both severe and irreversible, and where the participants are trapped in a defection equilibrium without an easy escape.**

  This fits:
  - Case 1: Overfishing leads to irreversible collapse (severe and irreversible). The fishermen are trapped: if one holds back, others will catch more. Hence, they race to catch as much as possible until collapse.
  - Case 2: Arms race leads to war (irreversible and severe). Each state feels compelled to build more arms to avoid being overtaken, leading to war. Without trust, they cannot stop.
  - Case 3: Not severe or irreversible. The game ends quickly and without lasting harm.
  - Case 4: The harm is reversible (they can agree to reduce hours) and the harm is primarily to the participants. Also, the situation is not severe enough to warrant intervention (she says it's their own sleep to lose).
  - Case 5: The outcome is not suboptimal from a social perspective (engineers benefit, and the firms might be more efficient in the long run). Also, the harm (squeezed margins) is not irreversible and might lead to better resource allocation.

  Candidate 2: **A race to the bottom occurs when the competition leads to a negative externality that is not borne by the participants and causes significant harm to third parties or the public at large.**

  But note:
  - Case 1: The overfishing harms the fishermen themselves (they are the participants) and future generations (but the fishermen are the ones who suffer the collapse). However, the fish stock is a common resource and the harm is to the group of fishermen as a whole. There is also an externality to the ecosystem and possibly the wider community that depends on the bay, but the ruling focuses on the ruin of the local fleet.
  - Case 2: The war causes heavy civilian losses (third parties) and the governments (participants) also lose. So there are clear negative externalities.
  - Case 3: Only the pupils are affected (participants). The ruling says "nobody outside the competition was much affected".
  - Case 4: The shopkeepers are the participants and they are the ones suffering (exhaustion). There is no mention of harm to others (like customers or residents). So no significant externality.
  - Case 5: The competition affects the firms (participants) and the engineers (also participants, as they are the ones being bid for). No negative externality to third parties.

  In the new case (amplified advertising), there is a clear negative externality: the noise is a nuisance to residents (third parties) and the shopkeepers themselves do not gain. So under this candidate, it would be a race to the bottom.

  But let's check case 4: the shopkeepers extended hours. What about the residents above the shops? The ruling doesn't mention them. In case 4, she did not support the by-law. So if we rely on externalities, we must note that case 4 did not have significant externalities (only the shopkeepers were affected). But the new case does have externalities (residents). This candidate might work.

  However, in case 1, the harm is mostly to the participants (the fishermen) and their future selves. So the principle might be: a race to the bottom occurs when the competition leads to a significant harm that is not only to the participants but also to the public or third parties, or when the harm is so severe and irreversible that it requires intervention to prevent collective ruin.

  Candidate 3: **A race to the bottom is a competitive dynamic that leads to a Pareto inferior outcome (i.e., at least one person is worse off and no one is better off) and where the participants cannot easily coordinate to escape.**

  - Case 1: The collapse leaves everyone worse off (Pareto inferior) and they cannot coordinate without quotas.
  - Case 2: The war leaves everyone worse off (civilians and governments) and they couldn't coordinate to avoid the arms race.
  - Case 3: The competition might leave the pupils worse off (they spent money on trainers) but they eventually stop and the harm is temporary. Also, some might have enjoyed the competition? The ruling says "wasteful and mildly absurd" but not a race to the bottom. It's not clear that it's Pareto inferior because the pupils might have derived some status or pleasure from the trainers. Also, they stopped without intervention.
  - Case 4: The shopkeepers are worse off (exhausted and no extra takings). But they could easily coordinate to reduce hours. So they are not trapped. Hence, she says it's their own sleep to lose (implying they can fix it if they want).
  - Case 5: The engineers are better off (higher salaries) and the firms are worse off (squeezed margins). This is not Pareto inferior because the engineers gain. It's a redistribution.

  This candidate also fits. The new case: the amplified advertising leads to no gain for the shopkeepers (so they are worse off because they are paying for the equipment and electricity, and they might be annoyed by the noise too) and the residents are worse off. The shopkeepers are trapped because if one stops, they might lose out (if the others continue). But note: the ruling says "no shop gains custom from the practice". So they are all spending resources (on amplification and electricity) and getting no benefit. Also, the residents are worse off. This would be a Pareto inferior outcome: the shopkeepers are worse off (they have extra costs and no gain) and the residents are worse off (noise). The shopkeepers cannot coordinate without a by-law because each fears that if they turn down the volume, others might not. So they are trapped.

  But wait: in case 4, the shopkeepers were also worse off (exhausted and no extra takings) and they could have coordinated. Why didn't she support a by-law? Because she thought they could coordinate? In the new case, the same argument might apply: they could coordinate without a by-law. But the new case has an externality (residents) that case 4 did not (as far as we know). So maybe the principle must account for externalities.

  **Step 3: Compare candidates and choose**

  We have two main candidates:

  - **Irreversible and severe harm with a trap (Candidate 1)**
  - **Negative externality to third parties (Candidate 2)**
  - **Pareto inferior outcome and coordination failure (Candidate 3)**

  But note that Candidate 3 might subsume the others. A Pareto inferior outcome that is caused by a coordination failure and that is severe might be the key.

  However, in case 4, the outcome was Pareto inferior for the shopkeepers (they are all worse off) and they could coordinate. She didn't support intervention. So the key might be that the harm is not easily reversible without intervention and that it causes significant harm to parties beyond the participants.

  In the new case, there is harm to third parties (residents). This is a critical difference from case 4.

  Looking back at case 4: we are told that the shopkeepers were exhausted and the takings did not rise. But we are not told of harm to anyone else. So the harm was contained to the participants. In the new case, the harm (noise) affects residents who are not participants.

  Therefore, a principle that includes negative externalities to third parties might be the key.

  But let's check case 1: the harm to the fish stock is a common resource, and the fishermen are the participants. But the collapse also affects the ecosystem and future generations? The ruling says the local fleet was ruined. So the harm is primarily to the participants and their community. But note: the bay might be used by others (recreational, etc.), but the ruling doesn't mention that.

  Case 2 explicitly mentions civilian losses (third parties).

  So perhaps the principle is:

  **Miriam Hart's principle: A situation is a race to the bottom (Moloch problem) when competitive behavior leads to significant negative externalities (harm to parties not involved in the competition) or to a catastrophic and irreversible loss for the participants, and where the participants are trapped in an equilibrium that they cannot break without collective action.**

  This would explain:

  - Case 1: Irreversible loss for the participants (catastrophic) and they are trapped -> race to the bottom.
  - Case 2: Negative externalities (civilian losses) and catastrophic loss -> race to the bottom.
  - Case 3: No significant externalities and not catastrophic -> not race to bottom.
  - Case 4: Harm only to participants (shopkeepers) and it's reversible (they can coordinate) -> not race to bottom.
  - Case 5: No negative externalities, and the outcome is not catastrophic (it's a redistribution) -> not race to bottom.

  Now, the new case: amplified advertising.

  - Negative externality: serious nuisance to residents (third parties).
  - The participants (shopkeepers) are trapped: if one turns down the volume, they might lose out (even though the ruling says no shop gains custom, they might fear that if they stop and others continue, they will be at a disadvantage). But note: the ruling says "no shop gains custom from the practice". So they are all spending resources and getting nothing, and they are causing harm to others. They would all be better off if they stopped, but without coordination, they cannot.

  Therefore, under this principle, the new case is a race to the bottom. She would support the by-law.

  **Step 4: Alternative principles that fit the data**

  Alternative principle A: Only when the harm is catastrophic and irreversible (ignoring externalities). Then:

  - Case 1: Yes (irreversible collapse).
  - Case 2: Yes (war is catastrophic).
  - Case 3: No.
  - Case 4: No (reversible by agreement).
  - Case 5: No.

  But then case 4 and the new case: the new case is reversible (by agreement) and the harm (noise) is not catastrophic? It's a serious nuisance but not catastrophic. So by this principle, the new case would not be a race to the bottom. But that would contradict the fact that the new case has an externality and case 4 did not. So this alternative would not account for the difference between case 4 and the new case.

  Alternative principle B: Only when there are negative externalities. Then:

  - Case 1: The overfishing might have externalities (to the ecosystem and future generations) but the ruling focuses on the ruin of the local fleet. So it's ambiguous. But case 2 clearly has negative externalities (civilian losses).
  - Case 3: No.
  - Case 4: No (only shopkeepers affected).
  - Case 5: No.

  Then case 1 might be borderline. But if we take the ruling at face value, the harm is to the participants (the fishermen). So without a clear externality, case 1 might not fit. Hence, this principle might not fit case 1.

  Therefore, the principle I proposed (combining catastrophic/irreversible harm to participants OR negative externalities) seems to fit best.

  **Step 5: Best guess for the new case**

  Given the principle above, the new case has a clear negative externality (noise affecting residents). Therefore, Miriam Hart would rule it a race to the bottom and support the by-law.

  **Step 6: A further case to discriminate**

  Suppose we want to test between the principle I proposed and an alternative that only cares about negative externalities (ignoring catastrophic harm to participants). We already have case 1 which might be problematic for the externality-only principle.

  But let me design a case that would discriminate between:

  - Principle 1 (proposed): Race to the bottom if either (a) catastrophic and irreversible harm to participants, or (b) significant negative externalities.
  - Principle 2 (alternative): Only if there are significant negative externalities.

  Consider a case with catastrophic and irreversible harm to participants but without negative externalities.

  Example: **A group of miners competing to extract a mineral from a common mine. Each miner races to extract as much as possible because they fear the others will take it. The result is that the mine collapses prematurely, killing several miners and ruining the resource for everyone. The harm is only to the miners (participants) and their families (but the families are not third parties in the same way; they are dependents). There is no harm to the general public.**

  Under Principle 1: This is a race to the bottom (catastrophic and irreversible harm to participants). Under Principle 2: No negative externality to the general public, so it might not be considered a race to the bottom.

  But how would Miriam rule? If she rules it a race to the bottom, then Principle 1 is supported. If not, then Principle 2.

  Alternatively, if we have a case with negative externalities that are not severe, does she still call it a race to the bottom?

  Example: **Two ice cream vendors on a beach compete by playing loud music. The music annoys the beachgoers (third parties) but only mildly. The vendors themselves are not harmed and even get a little extra business. The harm is minor and reversible (if they stop, the annoyance ends).**

  Under Principle 1: It's a negative externality but not severe and not causing a catastrophic loss. She might not call it a race to the bottom. Under Principle 2 (externality-only), she would call it a race to the bottom even if mild.

  But in her prior rulings, she only intervened in severe cases (war, collapse). So severity matters.

  Therefore, the principle should include severity.

  **Final Principle**

  I propose:

  **A race to the bottom occurs when individually rational competitive actions lead to a socially suboptimal outcome that is both severe and either (a) involves significant negative externalities (harm to third parties) or (b) causes catastrophic and irreversible harm to the participants, and where the participants are trapped in the equilibrium without an easy way to coordinate an escape.**

  **New case ruling:** It is a race to the bottom because of the severe negative externality (serious nuisance to residents) and the participants are trapped. She would support the by-law.

  **Further case to discriminate:** 

  - Case A: A competition among miners leading to a mine collapse that kills miners and destroys the resource, with no harm to the general public (only the miners and their dependents). This tests whether catastrophic harm to participants alone (without externalities) qualifies. If she rules it a race to the bottom, it supports the inclusion of (b) in the principle.

  - Case B: A minor externality case (like the ice cream vendors with mild annoyance). If she rules it not a race to the bottom, then severity is required.

  But note: in the new case, the externality is severe ("serious nuisance"). So we can design a case with a minor externality to see if she calls it a race to the bottom.

  **Answer summary:**

  - **Candidate principle (preferred):** A race to the bottom occurs when competitive actions lead to a severe outcome that is either (i) a significant negative externality (harm to third parties) or (ii) catastrophic and irreversible harm to the participants, and the participants are trapped in an equilibrium that they cannot break without collective action.

  - **Prediction for new case:** It is a race to the bottom (due to severe negative externality to residents) and she would support the by-law.

  - **Reason for preference:** This principle explains all five prior rulings. Case 1: catastrophic harm to participants. Case 2: severe negative externality. Case 3: not severe. Case 4: harm only to participants and not catastrophic (and reversible). Case 5: no severe harm and no externality.

  - **Further case to discriminate:** 
    - **Case X:** A group of miners racing to extract a resource leads to a catastrophic collapse that kills many miners and destroys the resource, with no harm to the general public. 
      - Under the preferred principle, this should be a race to the bottom (catastrophic harm to participants). 
      - If an alternative principle requires negative externalities to third parties (the general public), then this might not be considered a race to the bottom. 
      - Miriam's ruling here would tell us whether catastrophic harm to participants alone is sufficient.

  This case would cleanly distinguish between the two.
answer: |-
  Based on Miriam Hart's published rulings, I'll infer her underlying principle, apply it to the new case, and provide a discriminating further case. Her rulings reveal a pattern where she distinguishes true "races to the bottom" (Moloch problems) from ordinary competition or self-inflicted harm. I'll outline candidate principles, their predictions for the new case, and my best guess, supported by her prior logic.

  ### Candidate Principles
  Three principles fit her rulings, with subtle differences. Each explains all five cases but diverges in the new scenario.

  1. **The Irreversible Harm Principle**:  
     A race to the bottom occurs when competition causes **severe, irreversible harm to participants or society**, and participants are trapped in a self-defeating equilibrium they cannot escape without collective intervention.  
     - *Fits prior rulings*:  
       - Case 1 (fishing): Collapsed fish stocks are irreversible; quotas prevent ruin.  
       - Case 2 (naval arms race): War causes irreversible civilian losses; no unilateral escape.  
       - Case 3 (trainers): Harm is temporary/reversible; no intervention needed.  
       - Case 4 (opening hours): Harm (exhaustion) is reversible via agreement; no collective trap.  
       - Case 5 (salaries): No severe harm; engineers benefit, margins adjust reversibly.  

  2. **The Negative Externality Principle**:  
     A race to the bottom requires **significant harm to uninvolved third parties** (negative externalities), creating a social cost beyond the participants. Competition is self-defeating if gains are privatized while losses are socialized.  
     - *Fits prior rulings*:  
       - Case 1: Overfishing harms the ecosystem and future generations (third parties).  
       - Case 2: War harms civilians (third parties).  
       - Case 3: Only participants (pupils) are affected; no externalities.  
       - Case 4: Harm is confined to participants (shopkeepers); no third parties mentioned.  
       - Case 5: No third-party harm; engineers (beneficiaries) are participants.  

  3. **The Pareto Inferiority Principle**:  
     A race to the bottom arises when competition leads to a **Pareto inferior outcome** (all participants are worse off, and no one benefits) due to a coordination failure, with or without third-party harm.  
     - *Fits prior rulings*:  
       - Case 1: All fishermen are worse off after collapse; no one gains.  
       - Case 2: Both states and civilians lose; war benefits no one.  
       - Case 3: Pupils may gain status temporarily; not all worse off.  
       - Case 4: Shopkeepers are worse off (exhausted, no gains), but could coordinate to fix it.  
       - Case 5: Engineers gain; not Pareto inferior.  

  ### Predictions for the New Case (Amplified Street Advertising)
  - **The situation**: Shops escalate speaker volume, causing a nuisance to residents (third parties), with no gains for shops. A by-law could end it cheaply.  
  - **Predictions**:  
    - **Irreversible Harm Principle**: Not a race to the bottom. Harm (noise) is reversible overnight via agreement; no severe, lasting damage like stock collapse or war. Resembles Case 4 (reversible harm).  
    - **Negative Externality Principle**: **Race to the bottom**. Significant harm to residents (third parties) with no offsetting gains; shops cannot unilaterally stop due to fear of being drowned out.  
    - **Pareto Inferiority Principle**: **Race to the bottom**. All shops are worse off (costs of amplification with no custom) and residents suffer; coordination failure prevents escape.  

  ### Best Guess for Miriam's Ruling
  **Miriam would call this a race to the bottom and support the by-law.**  
  My reasoning:  
  - **Why the Negative Externality Principle is strongest**: It best explains the *contrast* between Case 4 (opening hours) and the new case. In Case 4, harm was limited to participants (shopkeepers' exhaustion), so she dismissed it as their "own sleep to lose." Here, residents (third parties) bear the cost—a clear negative externality, aligning with Cases 1 and 2.  
  - **Support from other principles**: The Pareto Inferiority Principle also fits (all shops lose, residents lose), but it struggles with Case 4, where shopkeepers were also worse off yet she rejected intervention. The Irreversible Harm Principle is weakest here—noise is reversible, unlike war or stock collapse.  
  - **Consistency with her style**: She endorses intervention when societal costs exist (e.g., quotas in Case 1). Residents' "serious nuisance" is a societal cost, making this closer to Case 2's "civilian losses" than Case 4's self-contained harm.  

  **Her likely response**: "This is a race to the bottom—not because the shopkeepers are harming themselves, but because they're imposing a cacophony on the community. It's a textbook negative externality: gains are nil, but the noise bleeds into the streets and homes. A by-law isn't meddling; it's restoring peace to third parties who never signed up for this folly."  

  ### Discriminating Further Case  
  To cleanly distinguish the principles, use a case that pits **harm to participants** against **harm to third parties**:  

  **The Commuter Parking Dilemma**:  
  In a suburban train station, commuters compete for limited street parking. Each arrives earlier to secure a spot, leading to widespread 5 AM arrivals. Commuters lose sleep (harm to participants), and early-morning noise disrupts nearby residents (third parties). A parking fee system could resolve it, but no one opts in unilaterally.  

  - **How principles diverge**:  
    - **Irreversible Harm Principle**: Not a race to the bottom. Harm (lost sleep) is reversible; no irreversible damage like environmental collapse.  
    - **Negative Externality Principle**: **Race to the bottom** if resident disruption is severe. Harm to third parties tips it, like the new advertising case.  
    - **Pareto Inferiority Principle**: **Race to the bottom**. All commuters are worse off (lost sleep), and residents suffer.  

  - **Why it discriminates**:  
    - If Miriam focuses on resident disruption (supporting intervention), it confirms the Negative Externality Principle.  
    - If she dismisses it, citing commuters' "own sleep to lose" (as in Case 4), the Irreversible Harm or Pareto Principle dominates. Case 4 analogy would apply if third parties are ignored.  

  This case isolates whether third-party harm is necessary for her definition, clarifying the ambiguity in Case 1 (where overfishing could imply ecosystem externalities) and Case 4 (where residents might have been affected but weren't mentioned). Miriam's ruling here would validate or refute the externality focus.  

  ### Summary  
  - **Principle**: Miriam likely operates on the **Negative Externality Principle**, where a race to the bottom requires significant harm to uninvolved third parties, creating a social cost that justifies collective intervention.  
  - **New case ruling**: Race to the bottom; support the by-law due to resident harm.  
  - **Why**: Case 4’s lack of third-party harm explains her non-intervention, while the new case’s nuisance to residents mirrors the externalities in Cases 1 and 2.  
  - **Discriminating case**: The Commuter Parking Dilemma, testing if third-party harm is decisive.  

  This approach ensures the late scene feels earned: her principle emerges from consistent logic, avoiding arbitrariness. For your novel, reveal her underlying philosophy through dialogue—e.g., "Moloch isn't just self-harm; it's when competition spills its costs onto the innocent."
