prompt: |-
  I've been mulling over population ethics — basically, when is one world better than another given how many people exist and how well off they are. I don't have a philosophy background, I just find myself going in circles on these cases. Here's where my gut lands:

  Start with a world of a billion people all flourishing. Compare it to a world with a hundred trillion people where every life is just barely above neutral — mild boredom, ocassional small pleasures, nothing awful but nothing great. My gut says the first world is better, no contest.

  But now take a world of a million people living great lives. Add a hundred thousand more people whose lives are genuinly good, just not as good as the original million. The original people are unaffected. I don't think the new world is worse. It seems at least as good.

  Now take a world where everyone is at wellbeing 80 out of 100. Compare it to a world with twice the population, everyone at 79. I think the second world is better — the tiny per-person drop seems worth it.

  Here's the problem. If I keep making moves like that last one — slightly lower everyone's wellbeing, add more people at that level — I eventually reach the hundred-trillion barely-worth-living world from the first case. But I said that world was worse than the flourishing billion. So somethings gotta give.

  Final case: ten billion happy people, versus that same world plus one extra person with a life of pure suffering. I say the world with the suffering person is worse.

  I want to know what principle could be driving these verdicts. Give me exactly five different principles that could each capture a different subset of my verdicts. For each one, say which verdicts it gets right and which ones it has to reject. One sentence describing the principle, one sentence on what it saves and what it drops. No intro, no conclusion — just the five numbered items.
reasoning: |-
  Okay, the user is grappling with population ethics, specifically how to compare different worlds based on population size and well-being levels. They've presented several scenarios where their intuitive judgments seem to conflict, leading to a paradox. They want five distinct ethical principles that each capture different subsets of their intuitions, with clear explanations of which judgments each principle supports and rejects.

  First, I need to analyze their cases. Case 1: A billion flourishing people vs. a hundred trillion with barely positive lives. The user prefers the first world. Case 2: Adding a smaller group with good lives (though not as good) to a million thriving people seems acceptable or neutral. Case 3: Doubling population with a tiny per-person well-being drop (80→79) seems better. Case 4: The sequence from case 3 leads paradoxically to the undesirable outcome in case 1. Case 5: Adding one suffering person makes a world worse.

  I recall several population ethics frameworks. Total utilitarianism sums all well-being - this would favor the huge barely-positive population in case 1 and approve the trade-offs in case 3, but contradict the user on case 1 and case 5. Average utilitarianism focuses on per-person averages - this aligns with case 1 but rejects case 3. Critical-level theories set a threshold above neutrality - this might handle case 1 but struggle with case 2 where added lives are good but below some "flourishing" level. Person-affecting views focus on harm to existing beings - this explains case 5 but fails case 3 where no one is harmed. Finally, lexical views prioritize avoiding suffering - this saves case 5 but can't explain the small drop in case 3.

  For each principle, I'll state it concisely, note which verdicts it saves (matches the user's intuition), and which it drops (contradicts). The conflicts arise because: totalism forces acceptance of the repugnant conclusion, averagism blocks beneficial population growth, critical levels might reject good additions, person-affecting can't value new lives, and lexical views ignore small compromises for gains. No single principle captures all intuitions - that's the core dilemma in population ethics the user is encountering.
answer: |-
  **1. Total Utilitarianism:** Maximizes the sum total of well-being. *Saves* the verdict that doubling the population at 79 > 80 (Case 3) and that adding good lives doesn't make things worse (Case 2); *drops* the verdict that the flourishing billion is better than the barely-positive trillion (Case 1) and that adding a sufferer makes things worse (Case 5).  
  **2. Average Utilitarianism:** Maximizes average well-being per person. *Saves* the verdict that the flourishing billion is better than the barely-positive trillion (Case 1); *drops* the verdict that doubling the population at 79 > 80 (Case 3) and that adding good lives doesn't make things worse (Case 2).  
  **3. Critical-Level Utilitarianism:** Adds value only for lives above a specific positive well-being threshold. *Saves* the verdict that the flourishing billion is better than the barely-positive trillion (Case 1, if level > barely-positive) and possibly adding the moderately good lives (Case 2, if level < their good); *drops* the verdict that doubling the population at 79 > 80 (Case 3, if 79 is below the critical level).  
  **4. Person-Affecting Principle:** Only changes affecting existing or future specific individuals matter; adding lives with positive welfare doesn't improve things. *Saves* the verdict that adding a sufferer makes things worse (Case 5) and might save Case 1 via non-affecting; *drops* the verdict that doubling the population at 79 > 80 (Case 3) and that adding good lives doesn't make things worse (Case 2 - it holds adding them doesn't make it *better*).  
  **5. Lexical Priority to Suffering:** Preventing suffering has absolute priority over increasing positive welfare. *Saves* the verdict that adding a sufferer makes things worse (Case 5) and might save Case 1 by deeming barely-positive lives risky or containing suffering; *drops* the verdict that doubling the population at 79 > 80 (Case 3, as it ignores small positive gains).
