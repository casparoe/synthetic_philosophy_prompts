answer: |-
  Here's a **Practical Orwellian Revision Procedure** designed for your novel, grounded in Orwell's core principles but adapted for fiction. Aim for **5-10 minutes per page** or **15 minutes per scene**. Keep Orwell's key quote handy: *"Political language... is designed to make lies sound truthful and murder respectable, and to give an appearance of solidity to pure wind."*

  **The Procedure: The Orwell Sanity Check (Per Passage)**

  1.  **Identify the Action/Event:**
      *   **Ask:** *What specific, concrete thing actually happened here? Who did it? Who did it happen to?*
      *   **Look For:** Verbs, direct objects, subjects. The core event.
      *   **Fail:** If you cannot immediately state the concrete action and the primary actor/acted-upon in simple, physical terms (e.g., "A cop shot an unarmed man," "The agency fired 150 workers," "The drone dropped a bomb").
      *   **Stop/Flag:** If the passage obscures the core action entirely (e.g., abstract nouns, passive voice without agent, euphemism). *This usually requires immediate revision.*
      *   **Hand Back:** If the *character* is deliberately obscuring it (dialogue/internal monologue) and this serves a clear narrative purpose (e.g., showing their denial, hypocrisy, or position within the system). *Proceed to Step 2 for analysis.*

  2.  **Test Verbs & Voice:**
      *   **Ask:** *Is the strongest possible verb used? Is the sentence active voice? If passive, is the *agent* (who did it) clearly stated and necessary?*
      *   **Look For:** Weak verbs ("occurred," "took place," "was conducted"), passive constructions ("was killed," "were terminated"), nominalizations (turning verbs into nouns - "the implementation of procedures" instead of "they implemented procedures").
      *   **Fail:** Passive voice hiding the agent when the agent *is known and important to the truth of the event*. Weak verbs replacing strong, concrete ones. Overuse of nominalizations making actions abstract.
      *   **Stop/Flag:** Passive constructions hiding the responsible party. Weak verbs obscuring violence or impact ("neutralized" vs. "killed," "impacted" vs. "destroyed"). *Requires revision unless justified in Step 1.*
      *   **Hand Back:** If passive voice is used intentionally for character voice/narrative effect *and* the agent is still clear or deliberately ambiguous for artistic/plot reasons (e.g., official reports within the story). Ambiguity *can* be a tool if used consciously.

  3.  **Interrogate Nouns & Adjectives (The Euphemism Scan):**
      *   **Ask:** *Are any nouns or adjectives softening, obscuring, or lying about the concrete reality? Could a child understand what *actually* happened from this word?*
      *   **Look For:** Institutional jargon, bureaucratic terms, technical-sounding phrases for simple/violent acts, euphemisms ("collateral damage," "pacification," "downsizing," "enhanced interrogation," "incident," "reduction in force," "person of interest").
      *   **Fail:** Words that deliberately misrepresent a harsh reality as something neutral, technical, or positive. Words that distance the speaker/writer from the consequences.
      *   **Stop/Flag:** Any term Orwell would call "inflated" or "meaningless" in this context. *Requires replacement with concrete truth or deliberate character usage.*
      *   **Hand Back:** If the term is used *in dialogue* by a character who *would* speak that way (politician, bureaucrat, propagandist) and its use reveals *their* evasion/complicity. Also, if a deliberately clinical narrator's tone requires specific jargon *for effect* (use sparingly and consciously).

  4.  **Check for Dead Metaphors & Pretentious Diction:**
      *   **Ask:** *Are there clichés, overused metaphors ("toe the line," "stand shoulder to shoulder"), or unnecessarily complex/latin-derived words where simple Anglo-Saxon ones would do?*
      *   **Look For:** Phrases you've heard a thousand times, words chosen to sound impressive rather than clear ("utilize" vs. "use," "commence" vs. "start," "individual" vs. "person").
      *   **Fail:** Clichés that deaden thought. Pretentious words that obscure meaning without adding nuance.
      *   **Stop/Flag:** Clichés used unthinkingly by the *narrator*. Fancy words replacing simpler, clearer ones *unless* it serves voice. *Usually revise for freshness & clarity.*
      *   **Hand Back:** If a cliché is part of a character's idiolect or used ironically. If a "fancy" word is the *precisely* correct word conveying a nuance the simpler word misses.

  5.  **Assess Abstraction & Distance:**
      *   **Ask:** *Is the passage grounded in sensory details or physical consequences? Does it focus on systems/concepts ("the economy," "security," "efficiency") while avoiding the human impact?*
      *   **Look For:** Abstract nouns dominating concrete ones. Lack of sensory detail (sight, sound, smell, touch, taste). Focus on policy over people, statistics over suffering.
      *   **Fail:** When abstraction is used *by the narrator* to avoid confronting the visceral reality of an event, especially violence or injustice. When the human cost is entirely absent.
      *   **Stop/Flag:** Narrator passages describing harmful actions solely through abstract/systemic language without anchoring them to human experience. *Requires grounding or reframing.*
      *   **Hand Back:** If the abstraction reflects a *character's* perspective (e.g., a cold bureaucrat thinking only in terms of quotas). If the narrative *purpose* is to show the dehumanizing effect of the system *by replicating its language temporarily* (use with extreme care and clear intention).

  **Running the Procedure on Your Passages:**

  1.  **"An incident occurred."**
      *   **Step 1:** What happened? Who did it? To whom? *FAIL.* Concrete action & agents completely obscured. *STOP/FLAG.* Immediate revision needed. Replace with concrete truth: "Officer Jenkins shot and killed Marcus Green." or "A police bullet killed the teenager."
      *   *Why it fails:* Pure passive abstraction. Hides actor, victim, and nature of the "incident." Textbook evasion.

  2.  **Political Speech: "The pacification operation, while successful in neutralizing the threat, regrettably resulted in minimal collateral damage."**
      *   **Step 1:** What happened? Who did it? (Likely "We/Military"). To whom? ("Threats" & Civilians). *PASS (for dialogue - character is speaking)*. Proceed.
      *   **Step 2:** Verbs? "Successful," "neutralizing," "resulted in." Weak/abstract verbs hiding violence. Passive "resulted in" hides direct action. *FAIL for honest prose, but...*
      *   **Step 3:** Nouns/Adj? "Pacification operation" (invasion/violence), "neutralizing" (killing/capturing), "minimal collateral damage" (dead/injured civilians). *Major FAIL for honesty, but...*
      *   **Step 4:** Metaphors/Diction? "Pacification," "neutralize," "collateral damage" are institutional euphemisms/dead metaphors. *FAIL for honesty, but...*
      *   **Step 5:** Abstraction? Entirely abstract/system-focused. No human cost mentioned. *FAIL for honesty, but...*
      *   **Overall for Dialogue:** **HAND BACK.** This *perfectly* demonstrates the bureaucratic language your novel critiques. It *should* sound evasive and awful. *Keep it.* Its failure *is* its success in characterizing the speaker and the system. The procedure flags its dishonesty, confirming it's working *as dialogue*. No revision needed *if* it's clearly attributed to a character embodying the problem.

  3.  **Plain, Concrete, Honest Prose (Example): "The old woman knelt in the rubble, cradling the small, broken body. The dust from the collapsed building coated her hair like grey snow. She made no sound, just rocked back and forth, her eyes fixed on the child's face."**
      *   **Step 1:** What happened? (Implied: Building collapse killed child). Who did it? (Likely bombing/attack - agent *might* be implied or unknown). *PASS* (Concrete actions: knelt, cradling, coated, rocked. Clear victims: woman, child). Proceed.
      *   **Step 2:** Verbs? Strong & concrete: knelt, cradling, coated, collapsed, rocked, fixed. Active voice. *PASS.*
      *   **Step 3:** Nouns/Adj? Concrete & sensory: old woman, rubble, small broken body, dust, collapsed building, grey snow, sound, eyes, child's face. No euphemism. *PASS.*
      *   **Step 4:** Metaphors/Diction? "coated her hair like grey snow" - fresh, appropriate simile. Simple, clear words. *PASS.*
      *   **Step 5:** Abstraction? Grounded entirely in sensory detail and human action/reaction. Shows consequence viscerally. *PASS.*
      *   **Overall:** **PASS.** The procedure shouldn't flag this. It's concrete, honest, and human-centered. It achieves Orwell's ideal of making the reader *see* and *feel* the consequence. If a procedure step *did* flag this, it would likely be a misfire (see limitations below).

  **Where the Procedure Misfires & What You Must Decide:**

  1.  **Character Voice vs. Narrative Complicity:** The biggest challenge. The procedure will flag *any* bureaucratic/euphemistic language. **You decide:** Is this language coming from a *character* (keep it!) or is it the *narrator* unintentionally adopting the system's voice (revise it!)?
  2.  **Unreliable Narrators:** A narrator deliberately lying or obscuring needs to *sound* evasive. The procedure will flag it. **You decide:** Is the evasion a conscious narrative device revealing character flaw/theme? Or is it accidental authorial sloppiness?
  3.  **Style, Voice, and Artifice:** Orwell prioritized clarity above all. Fiction needs rhythm, tone, voice, ambiguity, and stylistic flair.
      *   **Misfires:** Might flag complex sentences necessary for rhythm, unusual metaphors chosen for specific effect, deliberate ambiguity for tension/mystery, or a narrator's unique (non-evasive) voice that uses abstraction poetically.
      *   **You decide:** Does this stylistic choice serve an *artistic purpose* (keep it!) or is it primarily *obscuring meaning* (revise it!)? Does it align with the *narrative's* moral stance?
  4.  **Pacing & Focus:** Sometimes, briefly summarizing a complex bureaucratic process abstractly is necessary for pacing, even if Orwell would prefer it dissected. **You decide:** Is this abstraction necessary for flow, or is it an evasion of responsibility? Can the human cost be implied or shown later?
  5.  **Thematic Abstraction:** Discussing systemic forces *is* necessary in a political novel. **You decide:** Is the abstraction anchored by concrete examples/human consequences elsewhere? Or does it float free, becoming "pure wind"?
  6.  **"Saying the Quiet Part Loud":** Sometimes the most powerful indictment is letting the system's own euphemistic language hang in the air, starkly contrasted with the reality shown. The procedure flags the language; **you decide** if the *contrast* is the point.

  **The Core Takeaway:**

  This procedure is a **truth detector for your prose**, forcing you to confront *what is actually being said* vs. *what actually happened*. Its red flags highlight potential complicity or unintentional obscurity. However, fiction isn't an essay. **The final judgment call is always yours:**

  *   **If the procedure flags language in your *narrative voice*:** Rework it towards concrete, active, honest language. Make the reader see and feel.
  *   **If it flags language in *character voice or dialogue*:** Ask: Does this reveal the character's complicity/evasion? If yes, keep it. It's working.
  *   **If it flags something for style/voice/pacing:** Ask: Does this *honestly* serve the story's deeper truth and artistic purpose, or is it lazy? Revise only if it's the latter.

  Run this checklist ruthlessly on your narrator's voice. Be more forgiving (but still critical) of character voices. Trust your gut when the procedure clashes with undeniable artistic necessity – but interrogate *why* it clashed. Good luck with the revisions – the fact you're asking these questions means you're on the right track.
