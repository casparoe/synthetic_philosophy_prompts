prompt: |-
  ive been trying to get clear on what would actually count as solving the frame problem, and i keep finding papers that gesture at it but dont say what the target is. before i read any more, write me the desiderata: what a candidate solution has to deliver to be a real solution and not a workaround, a change of subject, or an engineering hack. give me the requirements list, and for each one the case or failure mode that makes it a requirement. at minimum cover: the narrow problem of updating a world model after an action (the robot paints the living room and shouldnt have to re-derive that the number of windows is unchanged, nor be told in advance that painting doesnt affect window counts) versus the wide problem of how an agent figures out whats relevant in the first place; the yale shooting problem, where a formalism has to project that a loaded gun stays loaded through a wait and that the victim dies after the shot, rather than quietly concluding the gun unloaded itself; ramifications (flipping the switch turns on the light and wakes the cat) and qualifications (the match lights only if it's dry and struck and so on) and why those are separate problems a solution might or might not take on; the requirement that a solution not just re-express the frame axioms in a more compact notation and declare victory (say, successor-state axioms) unless it also explains where the compact summary comes from; and whether computational tractability is a real requirement or just a preference. for each one, say whether it's non-negotiable or a camp preference (logic-based AI, situated robotics, philosophy of mind). then flag any pair of desiderata that looks like it cant be jointly satisfied, and say which single requirement does the most to eliminate the standard off-the-shelf candidates. keep the scorecard short — the criteria are the part i actually want.
reasoning: |-
  We are going to list the desiderata for a solution to the frame problem. We'll cover:

  1. The narrow frame problem (efficient update without frame axioms)
  2. The wide frame problem (relevance determination)
  3. Handling the Yale shooting problem (temporal projection with inertia)
  4. Ramifications and qualifications (and why they are separate)
  5. Avoiding compact re-expression without explanation
  6. Computational tractability

  For each, we state:
  - The requirement
  - The failure mode that necessitates it
  - Whether it is non-negotiable or a camp preference

  Then we note any conflicts and the most eliminative requirement.

  ---

  **Desiderata for Solving the Frame Problem**

  1. **Narrow Frame Problem (Non-Negotiable)**  
     *Requirement*: After an action, the agent must update its world model by changing only what the action directly affects, without having to explicitly represent or derive frame axioms (like "painting doesn't change the number of windows").  
     *Failure Mode*: Without this, the agent must either (a) be told an infeasible number of frame axioms (one for every unaffected property per action) or (b) re-derive each unaffected property from scratch after every action, both of which are computationally infeasible and cognitively implausible.  
     *Status*: Non-negotiable for any solution claiming to address the core issue.

  2. **Wide Frame Problem (Camp Preference: Philosophy of Mind / Cognitive Science)**  
     *Requirement*: The agent must be able to determine, without explicit prior enumeration, what is relevant to a given action or inference (i.e., the set of frame axioms that hold).  
     *Failure Mode*: Without this, the agent cannot operate in novel domains without being pre-programmed with all possible relevancies, which is impossible for open-ended agents.  
     *Status*: Camp preference. Logic-based AI often avoids it by assuming a fixed domain, while situated robotics and cognitive science require it for real-world adaptability.

  3. **Yale Shooting Problem (Non-Negotiable)**  
     *Requirement*: The solution must support temporal projection with default persistence (inertia) that holds unless interrupted by an event. It must correctly project that a loaded gun remains loaded during a wait and that firing it kills the victim, without being derailed by the possibility of spontaneous changes (like the gun unloading itself).  
     *Failure Mode*: Without this, the formalism would either (a) require explicit axioms to rule out every possible interruption (which is infeasible) or (b) fail to make the correct prediction (e.g., conclude the victim might be alive because the gun might have unloaded).  
     *Status*: Non-negotiable for any solution that claims to handle commonsense reasoning about time and change.

  4. **Ramifications and Qualifications (Camp Preference: Logic-based AI vs. Broader AI)**  
     - *Ramifications*: The indirect effects of actions (e.g., flipping a switch turns on the light, which wakes the cat) must be handled without explicitly listing every chain of effects for every action.  
     - *Qualifications*: The preconditions of actions (e.g., a match lights only if it is dry, struck, etc.) must be handled without having to list every possible disqualifying condition.  
     *Failure Mode*: Without handling ramifications, the agent must explicitly state every indirect effect (infeasible). Without handling qualifications, the agent must assume actions always succeed unless explicitly prevented (leading to the qualification problem).  
     *Status*: Camp preference. Some approaches (e.g., fluent calculus) handle ramifications by state constraints, while others (e.g., causal reasoning) aim for more generality. Qualifications are often considered a separate (qualification) problem but are sometimes grouped with the frame problem. A comprehensive solution would address both, but many solutions focus only on the core frame problem.

  5. **Avoiding Compact Re-expression (Non-Negotiable)**  
     *Requirement*: A solution must not merely re-express the frame axioms in a compact form (e.g., successor-state axioms) without also explaining how the compact summary is acquired or justified.  
     *Failure Mode*: If the solution just hides the frame axioms in a compact notation (e.g., one axiom per fluent per action), it does not solve the problem of how the agent knows which things don't change — it only makes the representation smaller. The original problem of the infeasible number of frame axioms reappears as the need to pre-specify all the compact axioms.  
     *Status*: Non-negotiable. This requirement eliminates many "solutions" that are only representational hacks.

  6. **Computational Tractability (Camp Preference: Engineering vs. Theory)**  
     *Requirement*: The solution must be computationally feasible for real-time agents.  
     *Failure Mode*: Without tractability, the solution is of theoretical interest only and cannot be used in practical AI systems.  
     *Status*: Camp preference. Logic-based approaches may tolerate higher complexity for formal clarity, while situated robotics requires real-time performance.

  ---

  **Conflicts and Most Eliminative Requirement**

  - **Conflict**: The requirement to avoid compact re-expression (5) and the requirement for computational tractability (6) may conflict with the wide frame problem (2). A solution that explains how compact summaries are acquired (e.g., through learning) might be computationally expensive, while a tractable solution might rely on pre-compiled knowledge.  
    - *Resolution*: This tension is inherent and may require trade-offs, but a complete solution should aim for both.

  - **Most Eliminative Requirement**: **Avoiding Compact Re-expression (5)**. This requirement alone eliminates the majority of off-the-shelf candidates (e.g., successor state axioms in situation calculus, which are compact but do not explain how the agent knows the axioms). It forces the solution to address the origin of persistence knowledge.

  ---

  **Summary Scorecard**  
  | Desideratum                     | Non-Negotiable | Camp Preference |  
  |---------------------------------|----------------|-----------------|  
  | Narrow Frame Problem            | ✓             |                 |  
  | Wide Frame Problem              |               | ✓ (Cognitive)   |  
  | Yale Shooting Problem           | ✓             |                 |  
  | Ramifications & Qualifications  |               | ✓ (Logic/Gen)   |  
  | Avoiding Compact Re-expression  | ✓             |                 |  
  | Computational Tractability      |               | ✓ (Engineering) |
answer: |-
  ### Desiderata for Solving the Frame Problem  
  **Non-negotiable requirements** (failure to satisfy disqualifies the solution):  
  1. **Narrow frame problem**:  
     - *Requirement*: After an action, update the world model *without* re-deriving unaffected fluents (e.g., painting the room doesn't alter window counts).  
     - *Failure mode*: Computational explosion; the agent exhaustively checks every fluent or relies on pre-specified frame axioms.  
     - *Status*: Non-negotiable.  

  2. **Temporal projection (Yale Shooting)**:  
     - *Requirement*: Default persistence ("inertia") must hold: fluents (e.g., "gun loaded") persist across actions (e.g., waiting) unless interrupted.  
     - *Failure mode*: Erroneously concluding spontaneous changes (e.g., the gun unloads itself) or requiring exhaustive exclusion of interruptions.  
     - *Status*: Non-negotiable.  

  3. **Avoid compact re-expression**:  
     - *Requirement*: Solutions must *not* just repackage frame axioms (e.g., successor-state axioms) without explaining the *origin* of the compact summary.  
     - *Failure mode*: Shrinks axioms syntactically but still requires prior enumeration ("how does the agent *know* painting preserves windows?").  
     - *Status*: Non-negotiable. **Eliminates most off-the-shelf candidates** (e.g., Reiter’s successor-state axioms).  

  **Camp-specific preferences** (solutions may prioritize based on goals):  
  4. **Wide frame problem**:  
     - *Requirement*: Determine relevance dynamically (e.g., infer that "painting affects wall color but not gravity").  
     - *Failure mode*: Brittleness in novel domains; requires pre-programmed relevance rules.  
     - *Status*: Preference (situated robotics/cognitive science). Logic-based AI often neglects this.  

  5. **Ramifications & qualifications**:  
     - *Ramifications*: Handle indirect effects (e.g., flipping a switch wakes the cat).  
     - *Qualifications*: Handle implicit preconditions (e.g., a match lights *only if* dry).  
     - *Why separate?* Ramifications cascade changes; qualifications prevent actions. Most solutions address one but not both.  
     - *Status*: Preference (philosophy of mind/logic-based AI). Engineering hacks often sidestep these.  

  6. **Computational tractability**:  
     - *Requirement*: Update in polynomial time/constant effort per fluent.  
     - *Failure mode*: Correct but too slow for real agents (e.g., exhaustive theorem-proving).  
     - *Status*: Preference (situated robotics). Logic-based AI may tolerate inefficiency.  

  ### Conflicts & Key Tensions  
  - **Unresolvable tension**:  
    **Avoid compact re-expression** (non-negotiable) vs. **Computational tractability** (preference).  
    - Explanation: Dynamically inferring persistence (to avoid pre-specified axioms) risks intractability; efficient methods (e.g., causal graphs) often smuggle in implicit axioms.  

  - **Wide vs. narrow trade-off**:  
    Fully solving the *wide* problem (relevance determination) may require probabilistic/approximate methods, conflicting with logic-based demands for soundness.  

  ### Scorecard  
  | **Desideratum**              | Non-negotiable | Camp Preference       |  
  |------------------------------|----------------|------------------------|  
  | Narrow frame update          | ✓              |                        |  
  | Temporal projection (Yale)   | ✓              |                        |  
  | Avoid compact re-expression  | ✓              |                        |  
  | Wide frame (relevance)       |                | ✓ (situated robotics)  |  
  | Ramifications                |                | ✓ (logic-based AI)     |  
  | Qualifications               |                | ✓ (philosophy of mind) |  
  | Tractability                 |                | ✓ (engineering)        |  

  **Most eliminative requirement**: **Avoid compact re-expression**. It discards syntactic solutions (e.g., successor-state axioms) that fail to explain how persistence knowledge is acquired.  
  **Hardest pair to satisfy**: *Avoid compact re-expression* + *Tractability*—dynamic inference is often slow; compiled knowledge risks being axiom-laden.
