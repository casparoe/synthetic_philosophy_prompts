  First, I need to recall the sorites paradox. It's about vague predicates having no clear cutoff. For example, how many grains make a heap? The challenge here is applying that to "significant degradation." Any sharp line will have borderline cases. The user wants a method that's consistent, defensible, and honest about the vagueness.

