  Looking at the three cases: Selenium increase with cumulative stressors, wetland loss in a depleted area, and negligible individual but significant cumulative nitrogen. These highlight thresholds vs. cumulative effects. The procedure must differentiate between clear cases and borderline ones, pushing those to senior officials.

  Key elements from philosophy: Supervaluationism says there are clear cases and penumbra where judgment is needed. Contextual factors matter. Also, epistemicism might say there's a fact, but we can't know it—so procedural fairness is key. But the user needs practical steps, not theory.

