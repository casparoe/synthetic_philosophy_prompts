answer: |-
  Below is a comprehensive decision procedure for "significant degradation" that incorporates insights from philosophical vagueness theory (supervaluationism, contextualism, and epistemicism) while prioritizing practical usability. The procedure acknowledges that vagueness cannot be eliminated but can be managed through **structured judgment**, **tiered analysis**, and **explicit disclosure of indeterminacy**. It replaces arbitrary thresholds with a weighted framework focused on **ecological context**, **cumulative impacts**, and **irreversibility**.

  ---

  ### **Decision Procedure: "Significant Degradation" Determination**
  **Core Principles:**  
  1. **No Bright Lines**: Reject fixed thresholds as decisive. Use science-based benchmarks only as *initial screening tools*.  
  2. **Context is Sovereign**: Significance depends on ecological/social vulnerability.  
  3. **Cumulative Burden**: Small effects matter when part of a trend.  
  4. **Procedural Honesty**: Document where judgment supersedes data.  
  5. **Tiered Escalation**: Borderline cases trigger senior review and policy input.

  ---

  #### **Step 1: Initial Quantitative Screen (Mechanical)**  
  - **Question:** Does the project exceed *any* of these science-based "bright line" thresholds?  
    - Turbidity increase ≥10% from baseline  
    - Pollutant concentration ≥90% of EPA water quality criteria  
    - Wetland fill ≥1 acre  
    - Habitat loss ≥5% of a critically endangered species’ range  
    *[Customize thresholds using agency data/peer-reviewed studies]*  
  - **Instructions:**  
    - **If YES →** Proceed to Step 2 (qualitative review). *Threshold breach alone is insufficient for "significance."*  
    - **If NO →** Proceed to Step 2. *Low quantitative impact does not guarantee insignificance.*  
  - **Flag for Analysts:** This step avoids wasting resources on trivial cases but resolves nothing alone. A "NO" here doesn’t end the analysis.

  ---

  #### **Step 2: Qualitative Impact Assessment (Judgmental)**  
  Evaluate the project against six factors. Score each **0 (low concern) to 2 (high concern)**:  
  1. **Ecological Vulnerability**: Sensitivity of affected species/ecosystems (e.g., salmon spawning grounds = 2).  
  2. **Cumulative Stressors**: Proximity to other pollution sources/land disturbances (e.g., watershed with 60% wetland loss = 2).  
  3. **Irreversibility**: Can impacts be undone? (e.g., wetland fill = 2; reversible turbidity = 0).  
  4. **Ecosystem Services**: Flood control, drinking water, recreation (e.g., wetlands protecting a town = 2).  
  5. **Bioaccumulation Risk**: Pollutants that magnify in food chains (e.g., selenium = 2).  
  6. **Social Equity**: Disproportionate impact on vulnerable communities (e.g., flood risk to low-income area = 2).  

  - **Instructions:**  
    - **Total Score 0–3 →** Likely insignificant degradation. *Proceed to Step 4 for confirmation.*  
    - **Total Score 4–8 →** Borderline case. *Proceed to Step 3 (cumulative analysis).*  
    - **Total Score 9–12 →** Likely significant degradation. *Proceed to Step 4.*  
  - **Flag for Analysts:** Scoring requires training. Use agency guidance documents with examples. Document rationale for each score.

  ---

  #### **Step 3: Cumulative Impact Analysis (Judgmental + Mechanical)**  
  - **Question:** Would this project, combined with past/future projects:  
    a) Push cumulative impacts past a critical threshold (e.g., total nitrogen exceeding watershed TMDL)?  
    b) Accelerate loss of a keystone species or ecosystem?  
    c) Disproportionally degrade environmental justice communities?  
  - **Instructions:**  
    - Use models (e.g., watershed nitrogen loading) where data exists.  
    - **If evidence of tipping point (a/b/c) →** Strong indicator of significance.  
    - **If no data/model available →** Default to "unable to determine"; escalate to Step 5.  
  - **Flag for Analysts:** This step handles "sorites traps" (e.g., the 400th farm). Small individual contributions matter only if cumulative harm is provable.

  ---

  #### **Step 4: Decision Integration (Mechanical)**  
  | Step 1 Result | Step 2 Score | Step 3 Finding           | Determination              |  
  |---------------|--------------|--------------------------|----------------------------|  
  | Any           | 0–3          | Any                      | **No significant degradation** |  
  | Any           | 9–12         | Any                      | **Significant degradation**    |  
  | NO threshold  | 4–8          | No tipping point         | **No significant degradation** |  
  | YES threshold | 4–8          | No tipping point         | **Escalate to Step 5**         |  
  | Any           | 4–8          | Tipping point likely     | **Significant degradation**    |  

  - **Instructions:**  
    - For "significant degradation," require full environmental review.  
    - For "no significant degradation," issue permit with conditions (e.g., monitoring).  
    - For "escalate," proceed to Step 5.  

  ---

  #### **Step 5: Senior Official Review (Policy Judgment)**  
  - **Trigger:** Escalation from Step 4 or unresolved uncertainty in Step 3.  
  - **Actions:**  
    1. **Disclose Vagueness**: Explicitly state in the record that the decision rests on policy, not just science.  
    2. **Apply Precautionary Principle**: Favor review if impacts are uncertain, irreversible, or affect vulnerable groups.  
    3. **Policy Weights**: Consider agency priorities (e.g., climate resilience, environmental justice).  
  - **Outcome:** Senior official issues binding determination with written justification.  

  ---

  ### **Limitations & Pitfalls**  
  1. **False Precision**: Scoring in Step 2 may imply rigor where none exists. **Mitigation**: Train analysts to treat scores as heuristics, not math.  
  2. **Data Gaps**: Cumulative analysis (Step 3) fails without models/monitoring. **Mitigation**: Escalate to Step 5; shift burden to applicant for data.  
  3. **Slow-Motion Crises**: Gradual degradation (e.g., 400 farms) may evade detection. **Mitigation**: Track watershed-level permits; flag "death by a thousand cuts."  
  4. **Unavoidable Arbitrariness**: Borderline cases (e.g., Step 2 score of 4 vs. 5) remain. **Mitigation**: Senior review (Step 5) injects consistency.  

  **What the Procedure Cannot Do**:  
  - Eliminate vagueness; it only structures its management.  
  - Replace policy choices with pure science (Step 5 admits this).  
  - Resolve conflicts about "how much risk is acceptable."  

  ---

  ### **Application to Current Cases**  
  #### **Case 1: Mining Operation (4% Selenium Increase)**  
  - **Step 1:** 4% < typical 10% turbidity threshold → **NO**  
  - **Step 2:**  
    - Ecological Vulnerability: Stressed salmon run **(2)**  
    - Cumulative Stressors: Multiple existing stressors **(2)**  
    - Irreversibility: Selenium persists **(2)**  
    - Bioaccumulation: Confirmed **(2)**  
    - Other factors: **(0)** → **Total Score = 8**  
  - **Step 3:** Models show selenium bioaccumulation threatens salmon collapse → **Tipping point likely**.  
  - **Step 4:** Significant degradation → **Full review required**.  
  - **Why it works:** Context (salmon vulnerability + bioaccumulation) overrides low quantitative increase.

  #### **Case 2: Housing Development (0.3-Acre Wetland Fill)**  
  - **Step 1:** 0.3 acres < 1-acre threshold → **NO**  
  - **Step 2:**  
    - Cumulative Stressors: Watershed lost 60% wetlands **(2)**  
    - Ecosystem Services: Flood control for 4,000 people **(2)**  
    - Irreversibility: Fill is permanent **(2)**  
    - Other factors: **(0)** → **Total Score = 6**  
  - **Step 3:** Watershed models indicate flood risk increases nonlinearly after 70% loss → **Tipping point possible but unconfirmed**.  
  - **Step 4:** Escalate to Step 5 (borderline + unresolved cumulative impact).  
  - **Senior Review:** Precautionary principle applied due to flood risk; **significant degradation** → **Full review required**.  
  - **Why it works:** Small fill becomes significant due to cumulative loss and social vulnerability.

  #### **Case 3: Dairy Farm (0.1% Nitrogen Runoff)**  
  - **Step 1:** 0.1% << typical thresholds → **NO**  
  - **Step 2:**  
    - Cumulative Stressors: 400+ farms in watershed **(2)**  
    - Ecosystem Services: Hypoxic zone downstream **(2)**  
    - Other factors: **(0)** → **Total Score = 4**  
  - **Step 3:** Cumulative nitrogen exceeds TMDL; this farm contributes to breach → **Tipping point confirmed**.  
  - **Step 4:** Significant degradation → **Full review required**.  
  - **Why it works:** Explicit cumulative analysis catches "sorites paradox" of incremental adds.  

  ---

  ### **Implementation Notes**  
  - **Training**: Role-play borderline cases to calibrate Step 2 scoring.  
  - **Transparency**: Publish determinations with Step 2–3 rationales to deter appeals.  
  - **Appeals**: Defend decisions by showing structured consideration of context/cumulative effects, not just thresholds.  

  This procedure replaces arbitrary lines with a defensible framework that embraces vagueness while delivering consistency. By forcing explicit discussion of uncertainty and policy trade-offs, it satisfies the statute’s intent while reducing gamesmanship in appeals.
