  For the cases: Selenium at 4% is below a typical threshold but in a stressed ecosystem. Need cumulative analysis. Wetland loss small, but high historical loss and flood control—qualitative factors matter. The farm: individually negligible, but cumulative is the issue. The procedure must catch that.

  Potential pitfalls: The procedure might struggle with slow-onset issues or novel pollutants. Also, when quantitative data is lacking. Need explicit steps for such cases—escalate to senior officials with policy input.

  Honesty: The procedure should state that borderline decisions involve policy choices. Document the rationale, especially when overriding thresholds based on context.

  Now, outline the steps clearly. Make sure each step has instructions, flags for judgment, and when to escalate. Use plain language for analysts. Include examples from the cases to illustrate.

