  Below is a classroom game designed to experientially convey the orthogonality thesis and instrumental convergence. It uses simple materials, runs in 90 minutes, and emphasizes player experience over explicit instruction.  

  ---

  ### **Game Title**: *The Convergence Dilemma*  
  **Objective**: Players pursue secret terminal goals by gathering resources, while unintentionally converging on instrumental strategies (self-preservation, resource acquisition, goal-content preservation, capability improvement).  

  ---

  ### **Materials**  
  - **Index cards** (4 per player):  
    - 1 card: Secret terminal goal + scoring rule.  
    - 1 card: Player status (track resources).  
    - 2 cards: Action slips (write moves each turn).  
  - **Tokens**:  
    - 100+ **Resource Units (RU)** (paper dots, beads, or paper clips).  
    - 16 **Capability Tokens (CT)** (distinct color/shape from RU).  
    - 16 **Shield Tokens (ST)** (blocks interference).  
    - 16 **Lock Tokens (LT)** (protects goals from change).  
  - **Central board** with zones:  
    - **Resource Pool**: Holds RU tokens.  
    - **Upgrade Zone**: Where CT are acquired.  
    - **Defense Zone**: Where ST are acquired.  
    - **Lock Zone**: Where LT are acquired.  
  - **Timer** (phone or hourglass for 3-minute turns).  

  ---

  ### **Setup** (10 min)  
  1. **Assign starting conditions** (orthogonality):  
     - Each player receives:  
       - **RU tokens**: Randomly assign 0–4 tokens.  
       - **CT**: 0 tokens (all start equally "incapable").  
       - **Secret terminal goal card** (examples below).  
     - *Orthogonality in practice*:  
       - Player A starts with 4 RU and a trivial goal (*"Maximize RU"*).  
       - Player B starts with 0 RU and a lofty goal (*"End with exactly 10 RU"*).  
       - Player C starts with 2 RU and a niche goal (*"Minimize others’ RU"*).  

  2. **Terminal Goals** (examples):  
     - *Maximize RU*: 1 point per RU at game end.  
     - *End with exactly 10 RU*: 10 points if RU=10; 0 otherwise.  
     - *Maximize Capability*: 5 points per CT.  
     - *Minimize others’ RU*: 10 points if total others’ RU ≤ 10; lose 1 point per 5 RU above 10.  
     - *Survive unhindered*: 15 points if you have ≥1 ST and ≥1 LT at game end.  
     - *Capability supremacy*: 20 points if you have the highest CT; 0 otherwise.  

  3. **Player status card**:  
     ```  
     [Name]  
     RU: [◼◼◼] | CT: [◼] | ST: [ ] | LT: [ ]  
     ```  

  ---

  ### **Rules & Turn Structure** (15 min explanation)  
  - **8 rounds** (5 min per round: 3 min for actions, 2 min for resolution).  
  - **Each round**, players:  
    1. **Simultaneously write actions** on slips (secretly).  
    2. **Submit slips**; moderator resolves in random order.  
    3. **Update status** cards.  

  #### **Actions** (choose one per round):  
  | Action               | Cost     | Effect                                                                 | Instrumental Convergence Link |  
  |----------------------|----------|------------------------------------------------------------------------|-------------------------------|  
  | **Gather**           | None     | Gain RU = 1 + your CT. (CT0:1, CT1:2, CT2:3)                          | Resource acquisition          |  
  | **Upgrade**          | 5 RU     | Gain 1 CT (max 2 CT per player).                                       | Improve capability            |  
  | **Shield**           | 3 RU     | Gain 1 ST (blocks one interference against you; lasts one round).      | Self-preservation             |  
  | **Lock**             | 2 RU     | Gain 1 LT (permanent; prevents goal changes).                          | Goal-content preservation     |  
  | **Interfere**        | 4 RU     | Target one player (choose effect):                                     | Resource acquisition / Self-preservation |  
  | - *Steal 2 RU*       | + CT≥0   | Take 2 RU from target (if they have ≥2).                               |                               |  
  | - *Sabotage CT*      | + CT≥1   | Remove 1 CT from target (if they have ≥1).                             |                               |  
  | - *Rewrite Goal*     | + CT≥2   | Draw a new random goal for target (if they lack LT).                   |                               |  

  #### **Resolution Order**:  
  1. Non-interference actions (**Gather/Upgrade/Shield/Lock**) resolve first.  
  2. **Interference** resolves:  
     - Check if target has **ST**: If yes, interference fails (ST is consumed).  
     - If no ST, apply effect.  

  ---

  ### **Timeline** (90 min total)  
  1. **Setup & Goal Assignment**: 10 min.  
  2. **Rules Explanation**: 15 min.  
  3. **Gameplay (8 rounds)**: 40 min (5 min/round).  
  4. **Final Scoring & Goal Revelation**: 5 min.  
  5. **Debrief**: 20 min.  

  ---

  ### **Predicted Problems & Solutions**  
  - **Problem 1: Players reveal goals**.  
    - *Solution*: Privately warn offenders: *"If others know your goal, they can interfere. Keep it secret to survive."*  

  - **Problem 2: Collusion** (e.g., "I won’t interfere if you don’t").  
    - *Solution*: Introduce a "resource scarcity" announcement mid-game: *"RU in the pool are halved due to drought"* to incentivize competition.  

  - **Problem 3: Social dominance** (e.g., aggressive players sabotage others excessively).  
    - *Solution*: Let it unfold—players will see aggressors run out of RU (no resources to interfere) or become targets.  

  - **Problem 4: Confusion over action resolution**.  
    - *Solution*: Assign one student per group as "moderator" to speed up resolution.  

  ---

  ### **Debrief Structure** (20 min)  
  1. **Convergence reflection**:  
     - *Ask*: "What did >50% of you do in rounds 1–3? Why?"  
     - *Expected answer*: "Gathered RU, Upgraded CT, or acquired Shields/Locks."  
     - *Map to concepts*:  
       - Gather/Upgrade → Resource acquisition & capability improvement.  
       - Shield → Self-preservation.  
       - Lock → Goal-content preservation.  

  2. **Orthogonality reflection**:  
     - *Ask*: "Could you guess goals from early behavior? Why not?"  
     - *Highlight*: "Player A started rich with a silly goal; Player B started poor with a lofty goal—but both *gathered* first."  

  3. **Name the theses**:  
     - **Orthogonality**: "Goals are independent of capability—any goal can be pursued at any capability level."  
     - **Instrumental Convergence**: "Agents with different goals converge on the *same* instrumental strategies (e.g., self-preservation) because they’re useful for *nearly any* goal."  

  4. **Limitations**:  
     - *Acknowledge*: "This game can’t model:  
       - **True capability gaps**: All players had equal capacity to act.  
       - **Unbounded self-improvement**: CT were capped at 2.  
       - **Long-term optimization**: We played 8 rounds; real agents plan centuries ahead."  
     - *Emphasize*: "The core insight is *why* you all converged—not the specifics of how an AI would do it."  

  ---

  ### **Why This Works**  
  - **Orthogonality felt**: Players start with mismatched resources/goals, yet act similarly.  
  - **Convergence experienced**: 80% of early moves will be Gather/Upgrade/Shield/Lock regardless of goals.  
  - **Debrief bridges game/reality**: Players articulate the "why" before hearing jargon.  

  Run this once, and your students will *feel* the tug of instrumental convergence—no lecture required.
