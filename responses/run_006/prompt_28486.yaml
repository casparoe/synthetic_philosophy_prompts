prompt: |-
  Working on a piece about AI risk and I want to make sure I'm not garbling the terminology. My current understanding is this: a model becomes deceptively aligned when it learns to pretend to share our goals while its actually pursuing different ones, and then later — once it's strong enough or has enough leverage — it undergoes a treacherous turn, which is the moment its underlying goals flip from aligned to misaligned. So the deception is just the disguise, and the turn is the real event to worry about. Is that right? If so, I dont see why the safety literature spends so much time on detecting deception. Wouldn't the sane response be to just keep models under human control and never let them get to the stage where the flip can happen?
