answer: |-
  Your frustration is utterly warranted—this debate *is* intellectually gridlocked, and it's not because the arguments are weak, but because the camps are anchored to fundamentally divergent explanatory projects with incommensurable priorities. Here's a diagnosis with reasons, breaking down the nature of the disagreement and what progress might look like.

  ### The Core Disagreement: Two Projects, One Word, and a Clash Over Normativity
  1. **It's Not (Just) Verbal**:  
     Yes, SE and CR answer different questions: SE addresses **trait etiology** ("why does this trait *exist*?"), while CR addresses **system dynamics** ("how does this *work* contribute to a larger capacity?"). But the conflict runs deeper than polysemy. The crux is **normativity**: SE insists functions are inherently normative (a trait *should* do what it was selected for, hence "malfunction" is objective), while CR treats function as instrumental and observer-relative (a "malfunction" is just a deviation from a system goal *we* care about). This isn't terminological—it's a metaphysical split about whether normativity is "out there" in nature (SE) or imposed by our analysis (CR).

  2. **Why the Dialectic Stalls**:  
     - **SE's Non-Negotiables**: History and normativity. Without selection, SE can't ground "proper function" or distinguish function from accident (e.g., a rock's shadow cooling a plant isn't its function, but a leaf's shade might be). Their reply to CR's duplicate human isn't evasion—they *deny* the duplicate's heart has a "function" in the biological sense; it merely has a causal role. For SE, function is inherently teleological.  
     - **CR's Non-Negotiables**: Ahistoricity and explanatory flexibility. CR *needs* to ascribe functions to artifacts, convergent traits, or synthetic biology cases without evolutionary histories. For them, SE's historical requirement is epistemically inaccessible (we rarely know selection histories) and irrelevant to how systems operate *now*.  
     - **Mutual Incompatibility**: SE can't absorb CR's cases without abandoning normativity; CR can't absorb SE's normativity without smuggling in history or goals. Their "counterarguments" aren't flaws—they're defenses of irreconcilable starting points.

  3. **The Hidden Battleground: Naturalizing Normativity**  
     Your suspicion is sharp: the real heat comes from projects like naturalizing mental content (e.g., teleosemantics). SE functions provide "normativity for free"—a misrepresentation *shouldn't* happen because it wasn't selected for. CR functions offer no such basis; if content depends on function, CR reduces meaning to causal roles, risking collapse into behaviorism. This *substantive* disagreement about whether biology inherently supports norms (SE) or requires pragmatic/stipulative norms (CR) is the engine of the stalemate.

  ### Diagnosing the Stalemate: Bedrock Intuitions + Explanatory Divergence
  This is **not** merely verbal, nor is it resolvable by empirical studies alone. It's a **clash of explanatory paradigms** rooted in:
  - **Divergent Intuitions About Normativity**: SE sees biological traits as inherently purposive (due to selection); CR sees purpose as perspectival.
  - **Different Scientific Goals**: SE optimizes for evolutionary biology (trait origins); CR for physiology/engineering (system mechanics).
  - **Metaphysical Commitments**: SE implies a "natural teleology"; CR is often allied with mechanistic anti-realism about goals.

  Empirical studies of scientific usage (e.g., Machery's work) confirm biologists *do* use both—but this doesn't resolve the debate. It just shows pluralism, which both camps already admit. The problem is that each side claims their view captures the "real" or "core" concept.

  ### What Counts as Progress? Moving Beyond the Impasse
  Progress won't come from rehashing arguments. It requires:
  1. **Explicit Pluralism with Boundaries**:  
     Admit SE and CR are distinct concepts for distinct tasks. Larry Wright's 1976 hybrid proposal failed because it tried to merge them, but a *taxonomy* could clarify:  
     - **Etiological Functions** (SE): Use when explaining trait origins, dysfunction, or naturalizing norm-dependent phenomena (e.g., content).  
     - **Systemic Functions** (CR): Use when reverse-engineering mechanisms, designing systems, or analyzing ahistorical contexts.  
     This reframes the debate: not "which is correct?" but "which is *appropriate* for this context?"

  2. **Target Normativity Directly**:  
     The SE/CR deadlock mirrors broader philosophy of mind debates. Progress might come from:  
     - **Naturalizing Normativity Without History**: E.g., explore if self-sustaining systems (e.g., autopoiesis) ground norms ahistorically (CR-friendly).  
     - **Empirical Work on "Malfunction"**: Do biologists treat dysfunction as objective (supporting SE) or pragmatic (supporting CR)? Studies like Neander's suggest even physiologists invoke evolutionary norms implicitly.  
     - **Teleosemantics-Specific Solutions**: If mental content is the goal, decouple it from the broader function debate. Argue that content *requires* SE functions (e.g., Millikan) or that CR can suffice if combined with other principles (e.g., predictive processing).

  3. **Radical Simplification: Drop "Function"**  
     In foundational contexts, *avoid the term*. Use:  
     - **"Selected effect"** for SE cases (e.g., "Hearts have the selected effect of pumping blood").  
     - **"Causal role"** for CR cases (e.g., "In circulatory systems, hearts play a causal role in blood movement").  
     This forces clarity without conceding ground.

  ### Why This Isn't Just Semantics
  The normativity rift ensures this isn't verbal. If you believe biological norms are real (SE), denying them feels like rejecting Darwin. If you believe norms are projections (CR), SE seems like mystification. **Progress starts by treating this as a conflict of frameworks, not definitions.** Distinguish the questions, specify contexts, and tackle normativity head-on—or abandon "function" where precision matters. The debate won't end, but it can evolve.
