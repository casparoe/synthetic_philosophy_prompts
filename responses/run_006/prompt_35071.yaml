  That's a fascinating and notoriously tricky passage! Turing isn't *endorsing* ESP as definitively real, but he *is* taking the reported statistical evidence seriously enough to engage with its implications for his argument about machine intelligence. Here's a breakdown:

  1.  **Acknowledging the (Reported) Evidence:** Turing states, "Unfortunately the statistical evidence, at least for telepathy, is overwhelming." He's referencing the work of J.B. Rhine and others at Duke University in the 1930s-40s who claimed strong statistical support for ESP phenomena using card-guessing experiments. While highly controversial (and later largely discredited due to methodological flaws, unreplicability, and potential fraud), this research was prominent at the time Turing was writing (1950). He's not saying *he personally* finds it convincing beyond doubt, but he *is* saying that *if one looks at the published claims*, the evidence appears strong enough that simply dismissing it out of hand isn't a valid scientific response.

  2.  **Granting the Premise for Argument's Sake:** Crucially, Turing *is* using this as a **rhetorical strategy** within his larger argument. This passage appears in the section addressing objections to the possibility of machine intelligence. Specifically, this part tackles the *Extrasensory Perception Objection*. The objection (as Turing frames it or anticipates it) goes something like:
      *   *"You claim a machine could think? But thinking might involve non-physical phenomena like telepathy or psychokinesis, which a purely physical machine couldn't possess. Your imitation game test might be fooled because the human participant could use ESP to 'read the mind' of the judge or the hidden machine, or the machine might lack the 'psychic' component of real thought."*

      To counter this objection effectively, Turing needs to show that *even if ESP exists*, it doesn't invalidate the imitation game or the possibility of machine intelligence. He can't effectively counter it if he just dismisses ESP outright – he needs to demonstrate his argument holds *even under the ESP premise*.

  3.  **The "Disturbing" Consequences & "Cold Comfort":** Turing is highlighting why ESP is such a problem for his *own* scientific worldview. He prefers a materialist understanding where bodies (and minds as emergent phenomena) operate under known (or discoverable) physical laws. ESP, if real, blows that up ("deny all our usual scientific ideas," "the idea that our bodies move simply according to the known laws of physics... would be one of the first to go"). He admits the desire to "discredit" it and finds the alternative ("ghosts and bogies") unpalatable. The "cold comfort" is the argument that science still *works* practically even if it clashes with ESP. But this, Turing implies, is intellectually unsatisfying – we want a coherent understanding, not just functional compartmentalization.

  4.  **"Thinking is just the kind of phenomenon...":** This is key to the objection and Turing's counter. The ESP objector argues that thinking is *precisely* the domain where non-physical, ESP-like phenomena might be crucial. If true, then:
      *   A machine, being purely physical, might fundamentally *lack* this essential aspect.
      *   The imitation game could be compromised because the human could use ESP to gain an unfair advantage (e.g., reading the judge's mind for desired answers, sensing the machine's hidden nature) or the machine might fail to replicate the "psychic" component.

      **Turing's Counter (Developed Later):** Turing doesn't admit the game is unreliable here. In the *next few sentences* (crucially!), he argues that if ESP exists, it likely affects *all* participants equally. If telepathy is involved, it would work between humans *and* potentially between humans and machines (if the machine is complex enough to be a "suitable 'mind'"). If psychokinesis is involved, the machine could potentially influence the judge just as a human could. Therefore, **ESP becomes a source of "noise" or "interference" affecting *both* the human and the machine competitor equally within the test.** The imitation game remains a fair test of *behavioral* indistinguishability under these conditions. The judge would still be trying to discern based on the *answers*, not the (hypothetical) mechanism of ESP influencing them.

  **In Summary:**

  *   **Not Endorsement, but Serious Engagement:** Turing isn't declaring personal belief in ghosts. He *is* acknowledging that the *reported statistical evidence* for telepathy (Rhine's work) was a significant cultural/scientific talking point that couldn't be ignored in a comprehensive argument. He treats it seriously enough to grapple with its potential implications.
  *   **Rhetorical Strategy:** He grants the premise (ESP exists) *specifically* to dismantle the *Extrasensory Perception Objection* to machine intelligence and the imitation game.
  *   **The Force of the "Thinking" Line:** This line highlights the *core* of the potential objection: that thinking might involve something beyond physics that machines lack. Turing *doesn't* concede this makes the game unreliable. Instead, his counter (developed immediately after your quote) is that *if* ESP exists and *if* it's relevant to thinking/interaction, it would likely operate as a confounding factor affecting *all* players in the imitation game equally, thus preserving the test's validity as a measure of observable, interactive behavior. The game tests the *effect* of thinking/communication on the judge, not the underlying (potentially non-physical) mechanism.

  Turing is being characteristically rigorous and thorough, addressing even the most fringe-sounding objections head-on by assuming their premise and showing his argument remains robust. It's a mark of his intellectual honesty and the provocative nature of his core thesis.
