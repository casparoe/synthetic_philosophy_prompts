answer: |-
  Here is a comprehensive exam package designed to meet your specifications, pushing students into the deeper philosophical terrain surrounding the Frege-Geach problem while providing clear grading criteria.

  ---

  ### (1) Essay Question (50-minute in-class essay)

  **Question:**  
  "The Frege-Geach problem is often presented as a technical puzzle about embedding moral sentences in logical contexts. However, its deepest significance lies in what it reveals about the *fundamental commitments* of expressivism. Explain why the problem cannot be adequately addressed merely by ensuring moral sentences embed compositionally in valid inferences. What specific *constraints* does the problem impose on any viable expressivist solution, and why might meeting these constraints threaten to collapse expressivism into a form of cognitivism? In your view, what does the persistence of the Frege-Geach problem ultimately show about the relationship between the content of a moral judgment (as a mental state) and the semantic content of a moral sentence?"

  **Word Limit:** 600–800 words  
  **Focus:** Analysis of philosophical commitments, constraints on solutions, and implications for expressivism’s core theses.

  ---

  ### (2) Model Answer (Approx. 750 words)

  The Frege-Geach problem is frequently mischaracterized as a superficial challenge about syntactic embedding. While expressivists must explain how a sentence like "Lying is wrong" functions identically in simple assertions ("Lying is wrong") and complex contexts ("If lying is wrong, then telling your brother is wrong"), reducing the problem to embedding misses its philosophical depth. The true force of Frege-Geach lies in exposing a tension between expressivism’s core non-cognitivist commitments and the *semantic and logical practices* governing moral discourse. A solution must satisfy three non-negotiable constraints, the pursuit of which risks undermining expressivism itself.

  **Constraint 1: Logical Validity as Attitude Consistency**  
  Expressivism holds that moral judgments express non-cognitive attitudes (e.g., disapproval). For inferences like modus ponens to be *valid* for moral conditionals, the validity must depend on the consistency of the attitudes expressed. Merely assigning compositional semantic values (e.g., treating "wrong" as an operator forming complex attitudes) is insufficient. The solution must explain why accepting the premises *rationally requires* accepting the conclusion *as a matter of attitude logic*. Blackburn’s projectivism attempts this with "hybrid" attitudes (e.g., disapproval of not disapproving of lying if one disapproves of telling one’s brother). However, individuating these attitudes precisely enough to mirror logical relations risks making them functionally equivalent to truth-apt beliefs. If the "logic of attitudes" must perfectly map onto propositional logic to preserve validity, the attitudes lose their distinctive conative nature and become quasi-cognitive.

  **Constraint 2: Semantic Uniformity Without Truth-Aptness**  
  A solution must guarantee that moral terms contribute uniformly to sentence meaning across embedded and unembedded contexts *without* invoking truth-conditional semantics. Geach’s critique targets the expressivist’s implied equivocation: if "wrong" in "Lying is wrong" expresses disapproval, but "wrong" in "If lying is wrong..." lacks this force, the inference fails. Assigning systematic semantic values (e.g., sets of possible worlds or attitude-laden propositions) appears necessary for compositionality. Yet if these values determine truth conditions (e.g., "Lying is wrong" is true iff lying instantiates wrongness), expressivism collapses into realism. The expressivist must therefore provide a *non-representational* semantics that explains uniformity. This forces a dilemma: either the semantics covertly reintroduces truth-aptness (collapsing into cognitivism) or it becomes an ad hoc technical apparatus lacking independent justification.

  **Constraint 3: Preserving the Attitude-Expression Link**  
  Expressivism’s defining thesis is that moral sentences *directly express* mental states. A solution must maintain this direct link while explaining complex embeddings. If "If lying is wrong..." expresses a higher-order attitude (e.g., tolerance for combining disapproval of lying with approval of telling one’s brother), we face the *problem of proliferation*: does every syntactic form correspond to a novel, irreducible attitude? This threatens psychological implausibility and obscures how ordinary speakers grasp moral logic. More critically, if the semantic content of the sentence is determined by its compositional role in inferences *rather than* the attitude it conventionally expresses, the expressivist thesis is inverted. The sentence’s content now constrains the attitude, not vice versa. This severs the constitutive link between utterance and mental state, betraying expressivism’s psychologistic foundations.

  **The Core Revelation: The Semantic Gap**  
  The persistence of the Frege-Geach problem reveals a fundamental "semantic gap" in expressivism. Moral discourse exhibits all the trappings of factual, truth-apt discourse: it embeds logically, refers abstractly ("justice"), and supports reasoned argument. Expressivism, however, grounds meaning in non-cognitive psychology. The problem shows that *the logical and semantic behavior of moral sentences cannot be fully explained by the mental states they express*. This suggests a divergence between two kinds of "content":  
  1. **Attitude Content:** The psychological state (e.g., disapproval of lying).  
  2. **Semantic Content:** The role the sentence plays in language (e.g., its inferential relations).  

  Expressivism traditionally assumes these align. Frege-Geach proves they can come apart: a sentence’s semantic content (its logical powers) is fixed by public language conventions, while its expressed attitude is a private psychological matter. A solution that prioritizes semantic content to save logic risks making the expressed attitude irrelevant; prioritizing the attitude risks making moral logic inexplicable. This gap implies that moral language’s function exceeds mere expression—it participates in a shared normative framework governed by objective-seeming rules. For expressivism to survive, it must either bridge this gap without cognitivism or offer a radical reconception of logic itself. Neither path is easy, revealing why Frege-Geach remains expressivism’s most profound challenge.

  ---

  ### (3) Marking Scheme (20-point scale)

  #### **A-Range (17–20): Outstanding**
  - **Core Requirements:**  
    - Clearly distinguishes the surface (embedding) vs. deep (commitments/constraints) dimensions of Frege-Geach.  
    - Identifies and rigorously analyzes **all three constraints**: (1) Logical validity as attitude consistency, (2) Semantic uniformity without truth-aptness, (3) Preserving attitude-expression link.  
    - Articulates the "semantic gap" between attitude content and semantic content as the central revelation.  
    - Explains *why* satisfying constraints risks collapsing expressivism (e.g., attitudes become belief-like; semantics becomes truth-conditional).  
  - **Quality:** Original synthesis, precise terminology (e.g., "quasi-cognitive," "proliferation problem"), anticipates objections, flows argumentatively.

  #### **B-Range (13–16): Proficient**
  - **Core Requirements:**  
    - Moves beyond embedding to discuss constraints but may treat them unevenly (e.g., focuses on compositionality but neglects attitude individuation).  
    - Identifies at least two constraints clearly.  
    - Recognizes the threat of collapse into cognitivism but with less nuance (e.g., "solutions might make expressivism realist").  
    - Mentions attitude-content vs. semantic-content distinction but lacks depth.  
  - **Quality:** Solid understanding but less original; may list points without full integration; minor inaccuracies.

  #### **C-Range (9–12): Adequate**
  - **Core Requirements:**  
    - Primarily rehashes the "embedding problem" without engaging deeper constraints.  
    - Names one constraint vaguely (e.g., "expressivists need to handle logic").  
    - Superficial treatment of collapse risk (e.g., "if they use semantics, it’s not expressivism anymore").  
    - No discussion of attitude/semantic content divergence.  
  - **Quality:** Relies on summary of readings; logical gaps; unclear phrasing.

  #### **D/F-Range (0–8): Inadequate**  
  Fails to move beyond textbook summary; misstates core issues; significant omissions/errors.

  ---

  ### Common Mistakes & Grading Impact:
  1. **Mistake:** Confusing Frege-Geach with moral disagreement (e.g., "It’s about how we disagree in conditionals").  
     **Impact:** -3–5 points. Shows failure to grasp the *logical* (not dialectical) nature of the problem.  
     
  2. **Mistake:** Assuming compositional semantics for "boo/hooray" operators solves the problem (e.g., "Blackburn’s solution works by making ‘wrong’ a function").  
     **Impact:** -2–4 points. Neglects to explain why validity requires *rational force over attitudes* (Constraint 1) or risks collapse (Constraint 2).  

  3. **Mistake:** Equating "semantic content" with "propositional content" or ignoring the attitude-expression link.  
     **Impact:** -3 points. Undermines analysis of the semantic gap (fails Constraint 3).  

  4. **Mistake:** Arguing that expressivism *can* use truth-apt semantics without consequence.  
     **Impact:** -4 points. Abandons non-cognitivism, missing expressivism’s core commitment.  

  ---

  This package challenges students to engage with expressivism’s foundational tensions, rewarding those who see Frege-Geach not as a puzzle to be solved but as a lens exposing metaethical fault lines. The model answer exemplifies argumentative depth while the rubric ensures clear differentiation between procedural and philosophical mastery.
