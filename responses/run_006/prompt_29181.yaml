  ## The Cathedral of Story: Beyond Just-So Tales in Evolutionary Fiction

  **(Good morning, everyone. It’s truly a pleasure to stand before this unique gathering – scientists who map the deep structures of mind and behavior, alongside storytellers and critics who navigate the intricate landscapes of human experience through narrative. My name is [Your Name], and as a novelist, I spend my days wrestling with the raw materials of character, plot, emotion, and language, trying to build worlds that feel true. So, it’s both thrilling and humbling to open a conversation about the evolutionary roots of this ancient, fundamental craft.)**

  Imagine you’re building a cathedral. You have soaring arches meeting at precise points, creating vast, awe-inspiring spaces. But look closely where those arches meet the walls. You see triangular spaces, often beautifully decorated – spandrels. Now, the *primary function* of the arches is structural: they hold up the roof, spanning the space. But what about those spandrels? Are they *the reason* the arches exist? Did the architect design the entire cathedral *just* to create those specific decorative triangles?

  Biologists Stephen Jay Gould and Richard Lewontin famously used this architectural metaphor to challenge a tendency in evolutionary biology: the assumption that every single feature of an organism must be a direct product of natural selection, honed for a specific adaptive purpose. They argued that many features are *spandrels* – necessary byproducts of the primary structural design. They exist because the arch *had* to meet the wall at that angle; they are *consequences* of the core architecture. Only later might they be co-opted, decorated, perhaps even *gain* a function – but that function wasn't the *cause* of their existence.

  **Why does this matter for us, gathered here to talk about fiction and evolution?**

  As novelists, we are endlessly fascinated by *why* stories work. Why do certain plots resonate across cultures? Why are specific character archetypes so persistent? Why do we crave resolution, fear the unknown, or weep at a tragic flaw? An evolutionary lens offers powerful tools to explore these deep patterns, suggesting they might tap into universal human cognitive architecture sculpted over millennia. That’s incredibly exciting!

  But here’s where the spandrels critique becomes vital for *our* workshop. If we apply evolutionary thinking to narrative craft, we risk falling into the same trap as the overly zealous adaptationist: assuming every element of a story *must* have been directly selected *for* its current function or emotional effect. We risk creating literary "just-so stories."

  Let me offer a literary example: the *unreliable narrator*. From Huck Finn to Amy Dunne, readers are fascinated by narrators whose perspective is distorted. An easy adaptive story might be: *"Unreliable narrators evolved because they train readers in essential social deception detection skills, enhancing survival in complex social groups."* It sounds plausible, even insightful! But is that *necessarily* why the device exists or why it works?

  Could the unreliable narrator be a *spandrel*? Perhaps it arises inevitably as a byproduct of two core, adaptive features of narrative:
  1.  **The Fundamental Drive for Subjective Experience:** Fiction thrives on immersing us in individual consciousness – a likely adaptation for empathy, social learning, and modeling others' minds.
  2.  **The Necessity of Perspective:** Every story is told *from somewhere*. There's no neutral, omniscient "view from nowhere" in lived human experience.

  When you combine the imperative to render subjective consciousness (Adaptation 1) with the inherent limitation of any single perspective (Adaptation 2), the unreliable narrator isn't necessarily a *direct* adaptation *for* deception training. It might simply be an *inevitable consequence* – a structural byproduct. Its power today – its ability to thrill, unsettle, or train us in perspective-taking – could be a *later co-option* of that necessary feature. It’s a beautiful, functional decoration on an architectural necessity.

  **So, how do we avoid just-so stories and embrace a richer, spandrels-aware evolutionary understanding of fiction?** Let’s propose a shared standard for evaluating an evolutionary explanation of a narrative feature:

  1.  **Beyond Plausibility:** Is the explanation *more* than just plausible? Does it offer specific, testable insights beyond what we already know from literary analysis or psychology? (The "deception detection" theory for unreliable narrators feels plausible but is vague and hard to test specifically within fiction).
  2.  **Consider the Alternatives:** Have we seriously considered non-adaptive explanations? Could this feature be:
      *   A **spandrel** (a necessary byproduct of another core narrative adaptation)?
      *   An **exaptation** (a feature originally shaped for one purpose, now used for another – like feathers for warmth before flight)?
      *   A product of **cultural evolution** riding on, but not directly dictated by, biological predispositions?
      *   Simply **random variation** or historical accident within cultural transmission?
  3.  **Fit the Evidence:** Does the explanation account for the *full range* of the feature's manifestations? Does it explain its presence, its variations, its absence in some contexts? Does it align with what we know about cognitive development and historical literary emergence?
  4.  **Beware Panglossianism:** Is the explanation overly optimistic, assuming every feature is "the best of all possible worlds"? Does it acknowledge trade-offs, inefficiencies, or even maladaptive aspects that might arise in stories?

  **This workshop isn't about choosing sides.** It’s not "Evolutionary Explanation vs. The Spandrels Critique." It’s about building a *better toolkit together*. Understanding potential spandrels doesn't weaken evolutionary approaches; it *strengthens* them. It demands more rigorous hypotheses. It prevents us from forcing every square narrative peg into a round adaptive hole. It allows for the complexity, the historical contingency, and the sheer serendipitous beauty that we novelists know lives at the heart of powerful stories.

  For the scientists here: Novelists are intimate cartographers of the human interior. We grapple daily with the messy, emergent properties of consciousness and culture that your models seek to explain. We can offer rich data points – the "phenotype" of human experience rendered in language.

  For my fellow writers and critics: Scientists offer frameworks to understand the deep currents beneath the surface ripples of our craft. They challenge us to think beyond the individual text to the universal patterns we instinctively weave.

  **By embracing the possibility of spandrels alongside adaptations, by demanding rigor and avoiding just-so stories, we open the door to a far more fascinating conversation.** We can explore not just *what* narrative features exist, but *how* they truly came to be and why they resonate – whether as load-bearing arches, essential structural consequences, or later-adorned decorations lending meaning to the whole.

  So, let’s step into this workshop like explorers entering that cathedral. Let’s admire the soaring arches of adaptation, but let’s also look closely at the spandrels, the corners, the unexpected spaces. Let’s ask not just "What is this *for*?" but also "How did this *come to be* here?" and "What possibilities does its structure unlock?"

  The most profound truths about story likely lie in the complex interplay between the arch and the spandrel, the adaptation and the byproduct, the deep past and the ever-unfolding present of human imagination. I’m incredibly excited to begin that exploration with all of you. Thank you.

  **(15 minutes, ends on an invitational, collaborative note, respecting both disciplines while advocating for nuanced thinking.)**
