  Hmm... I recall that teleosemantics defines content based on evolutionary function, while informational semantics relies on current covariance. The challenge is finding an organism where a representational state now responds to something new that wasn't historically selected for. 

  Considering real organisms... Spadefoot toad tadpoles come to mind. Their carnivore morphs have specialized mouthparts for eating fairy shrimp, which was likely the primary prey during evolution. But in some temporary ponds, similar-sized tadpoles of other species might now trigger the same predatory response due to visual similarity. 

  This seems promising because:
  1) It's biologically documented (e.g., research by Pfennig)
  2) The current environment creates covariance with both shrimp and heterospecific tadpoles
  3) Historically only shrimp were significant prey
  4) It avoids sci-fi/swampman tropes

  For the analysis: Teleosemantics should assign "fairy shrimp" as content because that's what the response was selected for. Informational semantics must assign the disjunction "fairy shrimp or similar-sized tadpoles" due to reliable covariance with both in current ponds. The key feature enabling divergence is the novel environmental change introducing look-alike prey. If removed, it collapses to standard cases.

  A defender of informational semantics might argue we should idealize to "normal conditions" - but "normal" is ambiguous here between historical and statistical norms, creating problems. The move doesn't fully succeed because both readings face counterexamples in this case.
answer: |-
  Here is a thought experiment meeting your specifications, built around the **carnivorous morph larvae of the spadefoot toad (*Spea bombifrons*)** and their prey-targeting strike response:

  **Scenario:** Spadefoot toad tadpoles in temporary desert ponds exhibit a facultative carnivorous morph with specialized mouthparts and a rapid strike behavior triggered by rapid, small-sized movements in their visual field. This strike mechanism (state R) was selected for in ancestral environments where the primary (and overwhelmingly most common) prey was fairy shrimp (*Thamnocephalus* spp.), whose distinct jerky swimming pattern reliably triggered R. However, due to habitat fragmentation and invasive species, some modern ponds now contain abundant, similarly-sized tadpole prey from invasive toad species (*Rhinella marina*) whose thrashing movements are visually indistinguishable *to the larvae's detection system* from fairy shrimp swimming. In these invaded ponds, R is triggered equally reliably by both fairy shrimp and the invasive tadpoles. Crucially, *Rhinella* tadpoles were entirely absent from the ancestral North American desert pond environments where the carnivorous morph and R evolved.

  **Walkthrough:**

  1.  **R:** The internal neuro-motor state triggering the rapid, targeted strike behavior in carnivorous morph *Spea bombifrons* tadpoles upon detecting specific rapid, small-scale visual motion patterns.
  2.  **Teleosemantic Content:** Fairy shrimp (*Thamnocephalus* spp.). This is derived from R's *selection history*. The mechanism producing R proliferated in the population *because* it successfully mediated strikes *at fairy shrimp*, the primary nutritious prey reliably present during the evolutionary history of the carnivorous morph. The mechanism's success (contributing to faster growth/metamorphosis before pond drying) depended specifically on its indication of fairy shrimp. The invasive tadpoles (*Rhinella*) were not present during this selection period; R's successful operation relative to *Rhinella* is a recent coincidence, not a factor explaining R's fixation or maintenance in the lineage. Therefore, R's *proper function* is to indicate the presence of fairy shrimp.
  3.  **Informational/Covariance Content:** Fairy shrimp *OR* invasive *Rhinella* tadpoles (a disjunction). This is derived from the *current reliable covariance* in the invaded ponds. In this specific modern environment, the visual motion signature triggering R is reliably caused by *both* fairy shrimp and *Rhinella* tadpoles. Given the sensory limitations of the tadpole's system (it doesn't further discriminate between these sources), the occurrence of R carries the information that *either* a fairy shrimp *or* a *Rhinella* tadpole is present. The covariance holds reliably in this environment.
  4.  **The Divergence & Key Feature:** The divergence arises because the environment has changed significantly since the mechanism was selected, introducing a novel stimulus (invasive tadpole movements) that was *absent or negligible in the selective environment* but is now reliably correlated with the triggering sensory signature. **The key feature enabling the divergence is the introduction of a novel, covarying stimulus type that was not part of the selection history.** If this novel stimulus (*Rhinella* tadpoles) were removed, R would once again covary primarily only with fairy shrimp (its selective target), collapsing the divergence. This case differs from the standard frog/BB case because: (a) it involves a real, documented biological system with known evolutionary pressures and recent environmental change, (b) the novel stimulus (*Rhinella* tadpoles) is ecologically relevant prey, not an artificial distractor, and (c) the broadening of covariance is due to a *biologically realistic sensory limitation* in discriminating evolutionarily novel stimuli, not an arbitrary lab manipulation.
  5.  **Informational Theorist's Strongest Move:** The informational theorist could resist the disjunctive verdict by **invoking an idealization to "normal" or "ecologically relevant" conditions.** They might argue that *Rhinella*-invaded ponds are "abnormal" or statistically rare outliers relative to the broader range or historical norm of *Spea* habitats, and that informational content should be defined relative to the conditions for which the organism is "designed" or statistically typical conditions. They might claim that under *normal* conditions (ponds without *Rhinella*), R covaries specifically with fairy shrimp.
  6.  **Does the Move Succeed?** **No, not robustly.** This move faces two significant problems:
      *   **The "Normalcy" Problem:** Defining "normal conditions" is notoriously difficult. Is it statistical prevalence across all current habitats? If invaded ponds are now common in certain regions, they *are* statistically normal there. Is it historical conditions? But informational theories typically eschew historical claims. Is it conditions where the organism thrives? Both types of ponds might support thriving populations. The informational theorist lacks a clear, non-circular (non-representational) criterion for "normal" that reliably excludes the invaded ponds in this context.
      *   **The Specificity Problem:** Even if "normal" could be defined to exclude *Rhinella*-ponds, the informational theory *still* assigns disjunctive content *within those specific invaded ponds*. The core claim of simple covariance theories is that content is determined by reliable correlations *in the actual environment of the token state*. For a tadpole *in* an invaded pond, R *does* reliably covary with the disjunction. Denying this seems to abandon the core commitment to actual covariance in favor of a historical or idealization criterion that looks suspiciously like teleosemantics itself. The move risks conceding that pure current covariance is insufficient and needs supplementation by something like evolutionary history to determine "relevant" correlations.

  This case provides a biologically grounded scenario where selection history (teleosemantics) points to a specific content (fairy shrimp) while current reliable covariance (informational semantics) points to a broader disjunction (fairy shrimp *or* invasive tadpoles), isolating the role of selection history in fixing determinate content against the backdrop of environmental change and sensory limitations.
