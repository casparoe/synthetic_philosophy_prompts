answer: |-
  Your reasoning captures a common tension in decision theory, particularly in puzzles like counterfactual mugging that involve predictors like Omega. The core issue revolves around whether to adopt a policy of paying in such scenarios, given the trade-off between ex ante expected value and ex post outcomes in the actual world. Let's break down where your argument goes astray, step by step, and clarify why paying is generally considered the rational choice in the single-instance counterfactual mugging.

  ### Step-by-Step Breakdown of Your Argument
  **(1) If you should pay in the original counterfactual mugging, it's because you want to be the kind of agent who pays—that's what gets you the $10,000 in heads-worlds.**  
  This is correct and aligns with standard decision-theoretic reasoning (e.g., evidential or updateless decision theory). By committing to paying in tails, you ensure that in the heads world (which occurs with 50% probability), you receive $10,000. The expected value (EV) of this policy, from an ex ante perspective, is positive:  
  - EV(pay) = (0.5 × $10,000) + (0.5 × -$1,000) = $5,000 - $500 = $4,500.  
  - EV(not pay) = (0.5 × $0) + (0.5 × $0) = $0.  
  Thus, ex ante, paying dominates not paying.

  **(2) Being that kind of agent means paying in every counterfactual mugging you encounter, not just this one. The disposition "pays when counterfactually mugged" doesn't come with a limit switch.**  
  This is where the argument starts to weaken. The assumption that a paying disposition requires paying in every possible counterfactual mugging, regardless of stakes or context, is flawed. Rational agents can (and should) have a disposition that is conditional on the specifics of each mugging, such as the cost-to-gain ratio ($C$ vs. $G$), their current wealth, risk tolerance, or the probability involved. For example:
  - An agent might adopt a rule like: "Pay if $G/C > k$ for some threshold $k$," where $k$ is chosen to ensure positive expected utility (e.g., $k = 2$ if the coin is fair, so $G > 2C$ guarantees EV > 0). 
  - In the original case ($G = 10,000$, $C = 1,000$, so $G/C = 10$), paying is clearly beneficial. But if faced with a mugging where $G = 1,000$ and $C = 2,000$ (so $G/C = 0.5$), the EV is negative, and a rational agent would not pay. Omega, as a perfect predictor, would know this conditional disposition and only run the mugging in scenarios where the agent would pay (if beneficial).

  Thus, the disposition "pays when counterfactually mugged" can and should include limits based on rational criteria. It does not inherently commit you to paying in every iteration, especially not in high-stakes or unfavorable cases.

  **(3) But there's no bound on how many counterfactual muggings you could face. Omega, or some other predictor, could run this on you every day with different stakes.**  
  While true in theory, this concern is often overstated and doesn't invalidate paying in the single case. Rational agents can manage iterative scenarios through:
  - **Expected utility maximization**: Each counterfactual mugging should be evaluated independently (or with proper discounting for future events). If each instance has a positive expected value (e.g., $G > C$ for a fair coin), then paying in all such instances maximizes long-term expected utility, even though bad outcomes (e.g., many tails) are possible. Bankruptcy is unlikely if $G/C$ is reasonable and stakes are managed. For example:
    - With $G = 10C$ and a fair coin, the per-mugging EV is $4.5C$ as before.
    - The probability of going bankrupt decreases exponentially with the number of muggings if $C$ is small relative to initial wealth. For instance, with $N$ muggings, $P(\text{all tails}) = (0.5)^N$, which is tiny for large $N$.
  - **Risk management**: An agent can set stakes-based or wealth-based limits. For example, "Pay only if $C$ is less than 10% of current wealth" to avoid bankruptcy. Omega would respect such a disposition, and muggings would only occur when conditions are favorable.

  **(4) If you pay in all of them, you go broke in the tail-worlds, even though you get rich in the heads-worlds. And since you actually live in exactly one world, in the actual tail-world you're just bankrupt.**  
  This ignores the ex ante perspective and the role of expected utility. A policy can be rational even if it leads to bad outcomes in some realizations, as long as it has high expected value overall. For analogy:
  - Insurance: Paying premiums might leave you worse off if you never file a claim, but it's rational ex ante due to the protection against large losses.
  - Investing: A diversified portfolio has high expected return but can lose value in a market crash; this doesn't make investing irrational.
  In counterfactual mugging, the high expected value justifies the risk of loss in tails-worlds. Bankruptcy in a tail-world is a possibility, not a certainty, and its low probability (if stakes are managed) is outweighed by the gains in heads-worlds.

  **(5) A decision procedure that tells you to adopt a policy that leaves you bankrupt in the actual world (even if it had high ex ante expected value) is self-defeating.**  
  This is the key misstep. A policy isn't self-defeating simply because it can lead to bankruptcy in unfavorable outcomes; it's self-defeating only if following it guarantees a worse result than not following it, regardless of the world. Here:
  - The policy of paying (when $G > C$) does not guarantee bankruptcy. It has a high probability of net gain.
  - Even in the worst case (actual tail-world), bankruptcy might occur only after many muggings, and it could still be rational if the ex ante EV is positive (just as buying insurance is rational even if you never use it).
  - Crucially, not paying in the single case leads to a sure loss of expected value: you forgo the $4,500 EV gain for no benefit, since Omega's prediction means your decision reveals your disposition. Refusing to pay "saves" $1,000 in tails but costs you the $10,000 in heads by making it true that you wouldn't pay.

  **(6) So you shouldn't pay in the original mugging either.**  
  This conclusion doesn't follow because (2) and (5) are flawed. Paying in the single mugging is rational, and the iterative concerns can be addressed without abandoning the policy. Refusing to pay in the original case is myopic: it focuses on the local outcome in the actual world (tails) while ignoring the global ex ante benefit.

  ### Why You Should Pay in the Original Counterfactual Mugging
  The rational choice depends on your decision theory, but most frameworks (e.g., evidential decision theory or updateless decision theory) recommend paying:
  - **Evidential decision theory (EDT)**: Paying provides evidence that you are the type of agent who pays, which means in the heads world (which you might have been in), you would have received $10,000. While EDT can lead to irrationalities in some cases, here it supports paying because the correlation between your action and the heads outcome is strong.
  - **Updateless decision theory (UDT)**: You should act as the agent you committed to be before knowing the coin flip. Since the ex ante optimal policy is to pay (for favorable stakes), you should pay even after learning the coin is tails to "cooperate" with your counterfactual self. UDT avoids time inconsistency by ignoring the "irrelevant" information of the coin flip for the decision.
  - **Causal decision theory (CDT)**: CDT often says not to pay because your action doesn't cause the heads outcome—it's already determined. However, CDT is criticized for this in Newcomb-like problems, as it leaves money on the table. Most decision theorists argue that CDT is suboptimal here.

  In practice, for the single mugging:
  - Paying costs $1,000 in tails but secures the $10,000 in heads, making it worth the risk.
  - Not paying saves $1,000 in tails but forfeits the $10,000 in heads, resulting in lower expected value.

  ### Addressing the Iterated Case
  If counterfactual muggings are iterated, the solution is not to abandon paying but to adopt a bounded disposition:
  - **Set a threshold**: Only pay if $G/C > k$ for some $k > 1$ (e.g., $k = 2$ for a fair coin) to ensure positive EV.
  - **Incorporate risk aversion**: If utility is concave (e.g., diminishing marginal utility of wealth), decline muggings where a loss in tails would be catastrophic. Omega will predict this and not run such muggings.
  - **Wealth management**: Treat each mugging as an independent investment. With linear utility, always pay when $G > C$; with risk aversion, use a utility function to evaluate bets.

  This bounded disposition resolves the bankruptcy concern while preserving the benefits in the single case.

  ### Conclusion
  The argument breaks at steps (2) and (5):
  - (2) is incorrect because a paying disposition can be conditional and bounded; it doesn't require paying in every possible mugging.
  - (5) is incorrect because a policy with high expected value isn't self-defeating just because it can lead to bad outcomes in some worlds—it's rational if the expected value justifies it.

  Thus, for the original counterfactual mugging, you should pay the $1,000 when Omega says the coin is tails. Doing so reflects a rational policy that maximizes expected value, and the iterative concerns can be managed with sensible limits. Refusing to pay sacrifices significant expected gain for no compensating benefit. If you and your roommate are still at odds, consider running a simulation with repeated games to see how the paying policy performs on average—it should come out ahead.
