answer: |-
  ### Decision Procedure for Treatment Assessment: Lexical Threshold Negative Utilitarianism

  **Core Principles:**  
  1. **Lexical Priority of Suffering Relief:** Relief of pain above a defined severity threshold ("very severe pain") takes absolute priority over any gains in positive well-being.  
  2. **Incommensurability of Pain and Pleasure:** Pain and pleasure are not fully interchangeable; relief of severe pain cannot be traded for any quantity of positive well-being.  
  3. **Threshold Definition:** "Very severe pain" is predefined as:  
     - Pain rated ≥8/10 on a validated scale (e.g., Numerical Rating Scale).  
     - Associated with functional incapacity (e.g., inability to work, sleep, or engage in daily activities).  
     - Chronic (≥6 months) or recurrent with high frequency.  
  *(Value judgement: Clinicians must agree on this threshold annually. Disputes go to the Ethics Panel.)*

  ---

  ### Step-by-Step Procedure  
  **Time Allocation:** 60 minutes per proposal.  
  **Team Actions:** Ask questions in sequence. Stop at first conclusive answer. Escalate value judgements to the Ethics Panel.  

  #### Step 1: **Does the treatment relieve pain at or above the "very severe" threshold?**  
     - **Data Required:** Clinical trial data on pain severity reduction, using predefined threshold metrics.  
     - **Sufficient Answer:**  
       - **Yes → Proceed to Step 2.**  
       - **No → Proceed to Step 4.**  
     - **Stop for No:** Never. Proceed based on evidence.  
     - **Value Judgement?** No (factual).  

  #### Step 2: **Would funding this treatment cause a net increase in very severe pain elsewhere?**  
  *(Assess opportunity cost: Withdrawing existing treatments to fund this one.)*  
     - **Data Required:**  
       - Number of patients gaining relief from very severe pain with the new treatment.  
       - Treatments displaced by funding; evidence on whether displaced treatments prevent/relieve very severe pain.  
     - **Sufficient Answer:**  
       - **Net increase in very severe pain → Reject.**  
       - **Net decrease or no change in very severe pain → Fund.**  
     - **Stop for No:** Reject if net increase in very severe pain.  
     - **Value Judgement?** Partly (e.g., forecasting long-term effects).  
       - If uncertainty >20% or team disagrees → Escalate to Ethics Panel.  

  #### Step 3: **Does the treatment relieve non-threshold pain (moderate/severe but below "very severe")?**  
  *(Only if Step 1 was "No" or Step 2 inconclusive.)*  
     - **Data Required:** Evidence of pain relief below threshold (e.g., pain reduction to ≤7/10).  
     - **Sufficient Answer:**  
       - **Yes → Proceed to Step 5.**  
       - **No → Proceed to Step 4.**  
     - **Stop for No:** Never.  
     - **Value Judgement?** No (factual).  

  #### Step 4: **Does the treatment *only* provide gains in positive well-being?**  
     - **Data Required:** Clinical data on well-being improvements (e.g., quality-of-life surveys).  
     - **Sufficient Answer:**  
       - **Yes → Reject.** *(Lexical priority: Pleasure gains never outweigh pain relief needs.)*  
       - **No → Proceed to Step 5.**  
     - **Stop for No:** Reject if only positive well-being gains.  
     - **Value Judgement?** No (factual).  

  #### Step 5: **Cost-effectiveness assessment for non-threshold benefits.**  
  *(Trade-offs allowed only for sub-threshold pain or ancillary well-being gains.)*  
     - **Data Required:**  
       - QALY gains (standard calculation).  
       - Cost per QALY.  
     - **Adjustments for Lexical Priorities:**  
       - **Pain Relief Component:** Multiply QALY gains from pain relief by 2.0x.  
       - **Well-Being Component:** Multiply QALY gains from pleasure by 0.5x.  
     - **Decision Rule:**  
       - **Fund if adjusted cost-per-QALY ≤ £30,000.**  
       - **Reject if >£30,000.**  
     - **Value Judgement?** Yes (weighting factors and threshold).  
       - Escalate to Ethics Panel if team disputes weights.  

  ---

  ### Application to Proposals  
  **Proposal 1:** Relieves moderate chronic pain; modest enjoyment gains.  
  - **Step 1:** No (moderate pain < threshold).  
  - **Step 3:** Yes (relieves non-threshold pain).  
  - **Step 5:**  
    - Standard QALY: 50 (pain relief) + 10 (well-being) = 60.  
    - Adjusted QALY: (50 × 2.0) + (10 × 0.5) = 105.  
    - Cost-per-QALY: £20,000 → **£20,000/105 = £190/adjusted QALY.**  
    - **Fund** (well below £30,000 threshold).  

  **Proposal 2:** Large gains in mild well-being; no relief for severe episodic pain.  
  - **Step 1:** No (does not relieve pain).  
  - **Step 4:** Yes (only provides well-being gains). → **Reject.**  
    - *Team may not like this:* Lexical priority blocks pleasure-only treatments.  

  **Proposal 3:** Relieves very severe pain for a few; displaces moderate pleasure for many.  
  - **Step 1:** Yes (relieves threshold pain).  
  - **Step 2:**  
    - Gains: 10 patients relieved of very severe pain.  
    - Losses: Displaced treatments provided moderate pleasure (no pain relief).  
    - **Net change in very severe pain: Decrease (no new cases created).**  
    - **Fund.**  
    - *Team may not like this:* Sacrifices pleasure for pain relief, but lexical priority requires it.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Threshold Definition Disputes:** Clinicians may contest the "very severe pain" criteria.  
  2. **Uncertain Opportunity Costs:** Forecasting long-term effects of defunding treatments.  
  3. **Weighting in Step 5:** The 2.0x/0.5x multipliers are value-laden.  
  4. **Edge Cases:** e.g., Treatments partially relieving threshold pain.  
  **Resolution:** Escalate to Ethics Panel for unresolved value judgements.  

  ---  
  **British English Compliance:** Prioritised "pain relief" over "pain management," used "£" for currency, and "escalate" for referrals.
