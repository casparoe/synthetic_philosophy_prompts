  We are designing a decision procedure based on lexical threshold negative utilitarianism. This approach prioritises the relief of severe suffering above all else, particularly when that suffering reaches a certain threshold of severity. It also incorporates the idea that pain and pleasure may not be fully commensurable (i.e., they cannot always be traded off against each other in a simple way).

   The procedure will have the following steps. At each step, if the answer meets the condition for a decision, we stop and return that decision. Some steps require a value judgement and must be passed to a designated person (e.g., a senior ethicist or a panel of experts in ethics and clinical practice) for a ruling.

   Key principles:
   1. We define a threshold of "very severe pain" as pain that is so intense that it completely dominates the individual's experience, making any positive aspects of life inaccessible or irrelevant. This is a value judgement and must be defined by the organisation in advance, perhaps with clinical input. For our procedure, we will assume that such a threshold exists and is agreed upon.
   2. Lexical priority: the relief of very severe pain (above the threshold) takes absolute priority over any amount of positive well-being, no matter how large, and also over the relief of pain below the threshold (moderate or even severe but not crossing into the very severe category). However, note that we are using a threshold so only pain above that threshold is lexically prior.
   3. For conditions that do not involve very severe pain (above the threshold), we may use a standard QALY-like calculation, but we must be cautious because of the incommensurability concern. We might allow trade-offs between positive well-being and the relief of non-lexical pain only if the pain is below the threshold and the trade-offs are within a certain range. But if the pain is above the threshold, it is off the table for trade-offs.

