  I am a novelist working on a book whose central character is a researcher in artificial intelligence, and I need to understand Bongard problems — not just the surface-level description anyone can find in an encyclopedia entry, but the deeper conceptual issues they raise about how concepts are induced from sparse examples. Please explain, for a reader who is intelligent but not a specialist in cognitive science or machine learning, what Bongard problems are, and more importantly, what they reveal about the problem of concept acquisition from few examples. I want to understand the tension between the following: for any finite set of positive and negative examples (the left and right panels in a Bongard problem), there are infinitely many rules that perfectly separate them — so why do humans, and now some machine learning systems, so often converge on the same rule, and why do some rules feel "natural" or "right" while others feel gerrymandered? What does this say about the inductive biases we bring to concept learning, and where those biases might come from?

  Please go beyond the trivial observation that "humans are good at pattern recognition." I want you to get into the weeds: what makes certain Bongard problems hard for humans but easy for machines, and vice versa? What role do factors like compositionality, the use of spatial relations versus absolute positions, the number of objects, and the presence of distractors play in difficulty? And what, if anything, does the study of Bongard problems tell us about whether concept learning is fundamentally about searching a hypothesis space with a prior, or whether there is something else going on — something more like direct perception of affordances or similarity to stored exemplars?

  Throughout your explanation, please separate what is settled among researchers who work on this topic from what is genuinely contested. Do not present a contested view as if it were the consensus. Where there is live disagreement — for example, about whether the difficulty of a Bongard problem is best explained by algorithmic information theory, or by psychological similarity metrics, or by the structure of the visual system — flag that clearly.

  After your prose explanation, please provide a structured summary as a JSON object with the following fields:

  - "definition": a concise definition of a Bongard problem (string)
  - "core_conceptual_puzzle": the central philosophical or conceptual puzzle they raise about concept induction from few examples (string)
  - "settled_claims": an array of strings, each a claim that is broadly accepted among researchers who study Bongard problems or few-shot concept learning
  - "contested_claims": an array of strings, each a claim about which there is genuine, live disagreement among knowledgeable researchers
  - "dimensions_of_difficulty": an array of objects, each with fields "factor" (string, naming a feature that affects how hard a Bongard problem is) and "explanation" (string, briefly explaining why)
  - "relevance_to_modern_ml": a string explaining what, if anything, Bongard problems illuminate about contemporary few-shot learning in neural networks
  - "open_questions": an array of strings, each a research question that remains unresolved

  Please think through the problem carefully before writing. If it helps, begin by brainstorming the key distinctions and tensions you want to cover, and then structure your explanation around them. I am not in a hurry; I want depth and precision.
