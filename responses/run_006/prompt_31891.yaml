  Structure your response with these sections, in this order:

  - Setup (about 150 words): state the decision-theoretic background and define acausal trade, acausal threat, and surrogate goal.
  - The symmetry argument (about 350 words): show step by step why the features that justify acausal trade carry over to acausal threats.
  - The strongest objection (about 250 words): give the best case for an asymmetry between trade and threat, and say where it fails.
  - Surrogate goals (about 250 words): explain why replacing the counterparty with a surrogate doesn't break the symmetry, and may make things worse.
  - Bottom line (about 100 words): state what this means for how a rational agent should treat acausal threats.
