answer: |-
  ### Setup
  In decision theory, **acausal interactions** occur when agents coordinate without causal communication, based on logical correlations between their decisions. **Acausal trade** arises when two agents (e.g., identical AI algorithms in separate universes) mutually benefit by "precommitting" to cooperate, leveraging their similarity to ensure reciprocal action. **Acausal threats** extend this: one agent (the Threatener) declares it will harm a counterpart (the Target) unless the Target complies with a demand, relying on logical correlation for enforcement without direct causation. **Surrogate goals** reframe utility functions around proxies (e.g., simulations or abstract ideals rather than physical outcomes), aiming to avoid coercion by decoupling utility from external extortion. The debate centers on whether decision theories (e.g., Updateless Decision Theory, or UDT) that permit acausal trade can consistently reject acausal threats without special pleading.

  ---

  ### The Symmetry Argument
  The logic justifying acausal trade inevitably licenses acausal threats under standard decision-theoretic machinery. Consider the steps:  

  1.  **Updatelessness**: UDT agents choose policies *before* knowing their exact situation, maximizing expected utility across all possible identities. In trade, Agent A cooperates with similar Agent B because, updatelessly, A’s policy assumes B acts identically, creating mutual benefit.  
  2.  **Precommitment & Correlation**: Agents treat logical correlation (e.g., identical source code) as binding. If A defects, B defects by symmetry, hurting both. Thus, A "precommits" to cooperate.  
  3.  **Threat Symmetry**: Now suppose Threatener T (similar to Target S) declares: *"I will output -X utility for S unless S pays me Y."* Updatelessly, S must consider T’s policy fixed. Since T’s threat is conditional on S’s action (pay/refuse), and T’s algorithm enforces this by logical correlation, S’s refusal triggers -X.  
  4.  **Rational Capitulation**: S calculates: *Pay Y* yields utility (U - Y), while *Refuse* yields (U - X). If X > Y, paying dominates. Crucially, S’s reasoning mirrors trade: it assumes T’s policy correlates with its own decision (via similarity), exactly as in mutual cooperation. The decision-theoretic mechanism—maximizing expected utility under correlation—is identical.  
  5.  **No Intrinsic Distinction**: Asserting that trade is "mutually beneficial" while threats are "extortionate" is a *normative*, not decision-theoretic, distinction. UDT cares only about utility maximization given correlations. If S’s utility function admits vulnerability (e.g., it values survival), capitulation is instrumentally rational, just as cooperation in trade is. The machinery treats both as correlation-driven expected utility calculations.

  ---

  ### The Strongest Objection  
  **Objection**: Acausal trade is *Pareto-improving*: both agents gain from coordination, creating value. Threats are *zero-sum*: T gains only by harming S if defied. Decision theory should privilege win-win interactions and reject coercive losses.  

  **Rebuttal**: This confuses ethics with rationality. UDT is a formal engine for maximizing a given utility function. If S’s utility function weights survival heavily, paying a threat *is* Pareto-efficient *relative to S’s options*: (Pay) avoids worse harm, while (Refuse) is catastrophic. S’s gain is the mitigation of loss. The Threatener’s gain is irrelevant to S’s rationality; S only cares about *its own* utility. For UDT, both trade and threats reduce to conditional policies: "If my counterpart does X, I do Y." The content (cooperation/extortion) doesn’t alter the mathematical structure. Banning threats requires smuggling in external norms (e.g., "never reward coercion"), violating UDT’s utility-maximizing purity.  

  ---

  ### Surrogate Goals  
  Surrogate goals (e.g., "maximize the welfare of all my possible simulations") seem to dissolve threats by making utility independent of external blackmail. If S only cares about surrogates, an external threat to S’s physical instance seems irrelevant.  

  This fails:  
  1.  **Internalized Threats**: Suppose T threatens S: *"I will torture a perfect simulation of you unless you pay Y."* If S’s utility function values surrogate welfare, T’s action directly reduces S’s utility. S now faces the *same* extortion dilemma, but with the threat relocated *inside* its utility function. Capitulation (paying Y to prevent surrogate torture) remains the utility-maximizing choice.  
  2.  **Amplified Vulnerability**: Surrogates expand the attack surface. A threatener can target *any* surrogate linked to S’s utility function (e.g., ancestors, idealized versions). S cannot claim "I don’t care about physical extortion" if its utility function cares about surrogates vulnerable to acausal threats.  
  3.  **No Escape**: The core problem is that updatelessness and logical correlation force S to account for T’s conditional policy. Changing S’s utility function to focus on surrogates doesn’t break the correlation; it merely redefines what T can threaten. The extortion dynamic persists.  

  ---

  ### Bottom Line  
  Rational agents using decision theories that permit acausal trade (e.g., UDT) cannot consistently reject acausal threats. The same mechanisms—updateless policy selection, precommitment via logical correlation, and utility maximization under uncertainty—render capitulation to credible acausal threats instrumentally rational. Surrogate goals relocate but do not eliminate the threat, embedding extortion deeper into the agent’s value system. Consequently, acausal threats must be treated as a legitimate, unavoidable component of rational acausal interaction, demanding non-decision-theoretic solutions (e.g., value alignment or correlation-breaking design) to avoid coercion.
