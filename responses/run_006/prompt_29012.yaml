prompt: |-
  I've been tracking this one appellate judge's opinions for a while now — a friend who clerked for her said her judicial philosophy is frustratingly hard to pin down, and I've been treating it as a clustering problem. She seems to toggle between hardcore textualism and purpose-driven interpretation in ways that don't fit any of the standard boxes. I pulled five cases where the structure was the same: a statute says X, the facts arguably fall under X but arguably don't, and something morally or practically significant is riding on it.

  (1) *State v. Morrison.* An old statute made it a felony to "carnally know a child under the age of consent." A 19-year-old had consensual sex with someone two months shy of 18 who'd presented a fake ID. Ruling: the statute targeted predatory adults exploiting actual children; applying it here would be absurd. Acquitted.

  (2) *City of Northport v. Brewster.* Ordinance required "any establishment serving food" to install a commercial grease trap. A tiny coffee shop that sells only black coffee and pre-wrapped pastries showed they produce essentially no grease. Ruling: "any establishment serving food" means exactly that; if the city council wanted exceptions, they'd have written them. Violation upheld.

  (3) *U.S. v. Keller.* Federal statute criminalized "using or carrying a firearm" during a drug trafficking offense. Defendant had a handgun locked in a safe in the trunk during a drug deal in a parking lot. Ruling: "carry" requires immediate accessibility; a gun locked away in a trunk is stored, not carried. Conviction overturned.

  (4) *Wildlands Conservancy v. Chen.* Regulation prohibited "motorized vehicles" in a protected wilderness area. Defendant flew a camera drone with near-silent electric rotors at 400 feet, arguing a drone isn't a "vehicle" under any ordinary definition. Ruling: the regulation's purpose — protecting quiet and wildlife — plainly covers drones; form doesn't trump function. Violation upheld.

  (5) *Whitman v. Commissioner.* Tax code allows deduction for "educational expenses that maintain or improve skills required in the taxpayer's current employment." A software engineer deducted tuition for a philosophy master's, arguing it cultivates the analytical rigor her programming job requires. Ruling: the provision means concrete technical skills specific to the occupation, not general intellectual cultivation. Deduction denied.

  Now the case headed her way: A 1973 statute criminalizes broadcasting "obscene, indecent, or profane material over the public airwaves." A website with no age gate streams hardcore porn, and a federal prosecutor wants to apply the statute, arguing "broadcast" has evolved to cover internet streaming to the general public. The defense says Congress in 1973 was plainly thinking of radio and TV, and stretching the term this way violates due process.

  I can see at least two rules that fit her five prior verdicts perfectly. One: apply the ordinary meaning at enactment unless it produces an absurdity the legislature couldn't have intended — which predicts overturning the conviction, since "broadcast" in 1973 didn't mean internet streaming and Congress can update the statute if they care to. Two: identify the mischief the statute was meant to remedy and cover all cases that implicate that mischief — which predicts upholding, since making obscene content freely available to the public is exactly the harm Congress was targeting, and the delivery mechanism is incidental. But I keep wondering if there's a third, deeper rule — something about the relative determinacy of text versus purpose, or a criminal/regulatory asymmetry, or maybe she's doing a Dworkinian constructive interpretation of the whole legal order and the pattern I'm seeing is just an artifact of that. If you had to bet which way she goes, and you got to design one additional hypothetical to test against the existing five before committing, what case would you pick? I'm especially interested in whether her implicit theory is closer to Hart's (law as social fact, judges exercising discretion in the penumbra) or Fuller's (law as a purposive enterprise you can't interpret without reference to what it's for).
reasoning: |-
  Okay, the user is diving deep into judicial philosophy through a clustering problem with an appellate judge's rulings. They've provided five cases where the judge alternates between textualism and purpose-driven approaches. Now, there's a new case about whether "broadcasting" in a 1973 statute includes internet streaming of porn. The user sees two possible rules fitting past cases but suspects a deeper pattern. They want to know how this judge might rule and propose a hypothetical to test her philosophy.

  First, I need to analyze the five cases to spot patterns. Let's look at each outcome and reasoning:

  1. **Morrison**: Acquitted. Textualism would say "carnally know a child" applies, but she used purpose (preventing exploitation) to avoid absurdity.
  2. **Brewster**: Violation upheld. Strict textualism—"any establishment" means no exceptions.
  3. **Keller**: Conviction overturned. Textualism focusing on "carry" requiring immediate accessibility, not storage.
  4. **Chen**: Violation upheld. Purpose-driven—protecting wilderness covers drones despite not being traditional vehicles.
  5. **Whitman**: Deduction denied. Textualism interpreting "educational expenses" as specific job skills, not general education.

  The user identified two rules: textualism unless absurdity, or purpose-driven mischief rule. But the judge uses both inconsistently. What's the hidden factor? Maybe it's about who benefits or the consequences. In Morrison (acquittal) and Keller (overturned), the defendant avoids harsh outcomes. Brewster (coffee shop) and Whitman (tax denial) are regulatory, upholding the law strictly. Chen is environmental protection, so purpose-driven.

  But Morrison and Keller are criminal cases with liberty at stake, while Brewster and Whitman are regulatory/compliance. Chen is regulatory but environmental, so purpose-driven. So maybe criminal vs. regulatory distinction? Morrison and Keller criminal—lenient; Brewster and Whitman regulatory—strict; Chen regulatory but purpose-driven because of environmental goals. That doesn't fully fit.

  Another angle: determinate text vs. broad purpose. When the text is clear and specific (Brewster's "any," Keller's "carry"), she follows text. When text is vague or broad (Chen's "motorized vehicles," Morrison's "child"), she uses purpose. But Whitman's "educational expenses" is broad, yet she went textualist. Hmm.

  The user mentions Hart vs. Fuller. Hart's positivism says law is rules with core and penumbra; judges decide penumbra cases. Fuller's purposivism says law must be interpreted by its purpose. The judge seems to blend both. But maybe there's a meta-rule: use textualism when it avoids punishing morally blameless conduct or when purpose is ambiguous. Use purpose when text leads to absurdity or the harm is clear.

  For the new case, "broadcasting obscene material" in 1973. Textually, broadcasting meant radio/TV. Applying it to internet streaming is a stretch. But the purpose is preventing public obscenity. If she's criminal-case lenient, she might overturn. But if purpose-driven when harm is clear, she might uphold.

  The user wants a hypothetical to test. Need one that isolates variables. Proposed hypothetical: a criminal case with clear text but absurd outcome. Example: a statute criminalizing "vehicle operation while intoxicated" applied to a kid on a bicycle. If she acquits (absurdity), that matches Morrison. If she convicts (textualism), that's inconsistent. Alternatively, a regulatory case with broad text but no clear harm. Like a permit requirement for "any watercraft" applied to a toy boat. If she upholds violation (textualism), that's like Brewster. If she dismisses (purpose), that's new.

  But the user's deeper need might be understanding the judge's philosophy for prediction or academic insight. They might be a law student, clerk, or legal analyst. They want to know if her approach is consistent or situational. The proposed hypothetical should clarify whether absurdity overrides text in criminal cases or if purpose is only used when text is ambiguous.

  Also, considering Hart vs. Fuller: she uses discretion in penumbra (Hart) but also purpose (Fuller). Her approach seems pragmatic, avoiding harsh criminal penalties while enforcing regulatory texts strictly. So for the new case, since it's criminal and stretching "broadcast" might be absurd, she might overturn. But the harm is similar to the statute's purpose, so it's a toss-up. The hypothetical could help decide.
answer: |-
  Based on your analysis and the judge's pattern, I believe a **third, unifying rule** emerges that better explains her decisions than either "text unless absurdity" or "purpose covers mischief" alone. Her jurisprudence appears to be:  

  **"Apply the textual meaning at enactment *unless* (1) it produces a morally disproportionate or absurd result in a *criminal* context, *or* (2) the statutory purpose is unambiguous and compellingly applies to a functionally equivalent harm, even if the form is novel."**  

  ### Breakdown of the Rule Against the Cases:  
  1. **Morrison (Acquittal):**  
     - *Trigger:* Criminal case + absurd/morally disproportionate result (prosecuting non-predatory conduct).  
     - *Mechanism:* Purpose used *to narrow* text to avoid injustice.  

  2. **Brewster (Violation Upheld):**  
     - *Trigger:* Regulatory context + unambiguous text ("any") + no absurdity (coffee shop can comply).  
     - *Mechanism:* Text enforced strictly; purpose not invoked to create exceptions.  

  3. **Keller (Conviction Overturned):**  
     - *Trigger:* Criminal case + text ("carry") not satisfied under ordinary meaning + disproportionate punishment risk.  
     - *Mechanism:* Text narrowed to avoid over-extension.  

  4. **Chen (Violation Upheld):**  
     - *Trigger:* Unambiguous purpose (protecting wilderness quiet/wildlife) + functionally equivalent harm (drone noise/disturbance).  
     - *Mechanism:* Purpose expands "motorized vehicle" to cover novel technology.  

  5. **Whitman (Deduction Denied):**  
     - *Trigger:* Regulatory context + text ("skills required in current employment") not met under ordinary meaning.  
     - *Mechanism:* Text enforced strictly; purpose not used to broaden "skills."  

  ### Prediction for the New Case:  
  - **Likely Outcome: Overturn Conviction (Statute Doesn’t Apply)**  
    - *Why:*  
      - **Criminal context** (triggering her caution against over-extension).  
      - "Broadcast" in 1973 unambiguously meant radio/TV transmissions, not internet streaming (ordinary meaning).  
      - Applying it to modern tech creates due process/fair notice concerns (absurdity/disproportionality).  
      - Congress can update the law if intended (echoes *Morrison*/*Keller*).  
    - *Counter:* The *Chen* logic (purpose covering novel forms) could apply, but the criminal stakes tip the balance toward textual restraint.  

  ### Key Philosophical Alignment:  
  She blends **Hartian and Fullerian elements pragmatically**:  
  - **Hartian:** Text as the core rule ("plain meaning" in *Brewster*, *Keller*, *Whitman*), with discretion in the penumbra (*Morrison*, *Chen*).  
  - **Fullerian:** Purpose resolves ambiguity when text is outdated or underinclusive (*Chen*), but *only if* the purpose is crystal clear and the harm is identical.  
  - **Her Hybrid:** Purpose is a *shield* for defendants in criminal cases (*Morrison*), or a *sword* for regulators in non-criminal cases with novel harms (*Chen*)—but text dominates unless these specific conditions are met.  

  ### Critical Hypothetical to Test Her Philosophy:  
  **Case:** A city ordinance prohibits "sale of alcoholic beverages within 500 feet of a school." A bookstore 450 feet from a school sells a rare, unopened 1920s wine bottle as a collector’s item (no intent to consume). Criminal charges are filed.  

  **Why this tests her rule:**  
  - **Criminal context** + **literal text satisfied** (sale of alcohol near school).  
  - But potential **absurdity/moral disproportionality** (punishing a collector, no risk to children).  
  - **Purpose:** Preventing student access to alcohol (not implicated here).  

  **Her Likely Ruling:**  
  - **Acquittal.** Text would yield absurdity in a criminal case, so purpose narrows the statute to cover only sales posing a risk to minors (*Morrison* parallel). If she *convicts*, it breaks her pattern (strict text in criminal cases only appears defensible in *Keller*, where the text *wasn’t* met).  

  **What This Reveals:**  
  - If she acquits, she prioritizes avoiding criminal injustice over textual literalism.  
  - If she convicts, her "absurdity" exception is narrower than *Morrison* suggested, making her approach less predictable.  

  ### Strategic Takeaway:  
  - **Bet Against the Prosecutor** in the porn streaming case. Her pattern shows heightened solicitude for defendants in criminal cases where text is stretched beyond its original meaning.  
  - **Her Philosophy:** Fullerian in spirit (law as purposive), but with a Hartian safety valve for criminal defendants. She’s a **pragmatic textualist with purpose-driven escape hatches**—but only when justice or unambiguous legislative goals demand it.  

  This judge defies pure categorization because her method is **outcome-sensitive** within a framework that defaults to text but bends to purpose when human stakes (liberty/environmental harm) are high and legislative intent is clear. The hypothetical above forces her to choose between text and mercy in a criminal edge case—perfectly isolating her core tension.
