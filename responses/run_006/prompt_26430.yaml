          *   **Definition:** Accurately defines ontological reduction as concerning the *nature of entities/properties themselves* ("higher-level entities and properties are nothing over and above... identical to, or wholly constituted by").
          *   **Key Insight:** Correctly identifies that these are distinct concepts – one can hold without the other.
