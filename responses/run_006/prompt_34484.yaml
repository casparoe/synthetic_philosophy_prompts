  We are going to design an activity that parallels Mary's situation. The key idea is to have students acquire third-person knowledge about a sensory experience they haven't had, then have the experience and reflect on whether they learned something new.

   The challenge: We need a sensory experience that is novel for most students, safe, and easy to set up in a classroom. We also need to provide third-person knowledge about it.

   Idea: **Taste experience** (but we must be cautious of dietary restrictions). However, since we cannot know every restriction, we choose something very common and mild. Alternatively, we can use **smell** (which is less invasive and has fewer restrictions) or even a visual illusion that they haven't seen before? But visual experiences are often not novel. Another idea: **sounds**? But again, hard to guarantee novelty.

   Let's go with **taste** but with a common and safe item: **Dark chocolate** (with high cocoa content, say 85% or above). Why?
     - Many students may have had chocolate, but not necessarily high-quality, very dark chocolate (which has a distinct bitter and complex taste).
     - However, we cannot assume that no one has had it. So we need a backup.

   Alternatively, we can use **unusual fruit** that is not common in the region? But we don't know what's available and safe.

   Another idea: **Jelly beans** of unusual flavors? But again, we don't know allergies.

   Considering the constraints, let's use **dark chocolate** and have a non-chocolate alternative for those who cannot have it (like a strong herbal tea or a piece of fruit that is common but not too common, e.g., a slice of starfruit or dragon fruit? But availability might be an issue). However, we must note that the activity might not be perfect because some might have had the experience.

   How about we use a **scent**? We can have vials with essential oils (like lavender, but that's common; or something less common like patchouli, bergamot, or vetiver). The advantage is that we can have multiple options and students can choose one they haven't smelled before? But we don't know what they have smelled.

   Alternatively, we can use **visual illusions** that are less known? For example, the "hollow mask illusion" or the "spinning dancer" (which can be ambiguous). However, the knowledge argument is typically about qualia and sensory experiences like color, taste, smell, etc. Visual illusions are more about cognitive processing.

   Given the time and practicality, I propose:

   **Activity: The Chocolate Tasting (with alternative for non-chocolate eaters)**

   Steps:

   1. **Preparation**:
      - Buy a bar of high-quality dark chocolate (85% or 90% cocoa) and break it into small pieces (each piece about the size of a chocolate chip). Place each piece in a small paper cup or on a napkin. Also, have an alternative for those who can't have chocolate (e.g., a slice of a mild fruit like pear or apple? but that's common; or a piece of ginger? but that's strong). Alternatively, have a non-food sensory experience? 
      - Actually, let's avoid food if possible due to restrictions. Instead, let's use **scented markers or scratch-and-sniff stickers**? But again, we don't know what they have smelled.

   2. **Alternative plan: Use a sound?** We can play a sound that is not easily identifiable and ask them to predict what it sounds like? But predicting the sound from a description might be hard.

   3. **Revised plan: Use a visual puzzle that creates a novel experience?** For example, the "Necker cube" or the "Rubin vase" are common. But we want something they haven't experienced.

   4. **Back to taste/smell**: Given the constraints, I think we have to accept that some may have had the experience. We'll note that in the debrief.

   5. **Final decision**: We'll use **smell** with a set of essential oils. We choose 3-4 distinct and less common scents (e.g., vetiver, bergamot, tea tree, and patchouli). We'll have small vials or scent strips. We assume that most students haven't smelled at least one of these. We'll let them choose one that they are sure they haven't smelled (if any). If they have smelled all, they can still participate by trying to recall or by focusing on the description.

   Activity Structure:

   **Part 1: Knowledge Acquisition (Third-Person Description)**
     - Without revealing the scent, provide a detailed third-person description of one of the scents (say, vetiver). This description should include:
          - Chemical composition (simplified: e.g., "it contains sesquiterpenes")
          - Common uses (e.g., in perfumery, as a fixative; also in aromatherapy for grounding)
          - How it is produced (from the roots of a grass)
          - Comparisons to other scents (e.g., "it is earthy, woody, and somewhat smoky, reminiscent of wet soil and roots")
          - But do not use words that are too evocative (like "it smells like fresh earth after rain")? Actually, we want to avoid giving away the qualitative experience. We want to stick to objective facts.

     - Alternatively, we can provide a fact sheet about the scent.

   **Part 2: Prediction**
     - Ask students to write down a prediction: Based on the description, what do they expect the scent to smell like? How would they describe the experience? They should also note if they think they will recognize it.

   **Part 3: Experience**
     - Pass around the vial (or scent strip) for that scent. Let each student smell it (without revealing the name of the scent until after).
     - Ask them to write down their experience: How does it actually smell? Is it different from what they expected? Did they learn something new?

   **Part 4: Debrief and Map to Mary's Room**
     - Reveal the scent and discuss.
     - Map the experience to Mary's room: 
          - The third-person description is like Mary's complete physical knowledge.
          - The prediction step is like Mary predicting what seeing red will be like.
          - The experience is like Mary leaving the room and seeing red for the first time.
          - The new knowledge they gained (if any) is the "what it's like" knowledge.

   However, note: In the original thought experiment, Mary learns something new. But in our activity, some might not have learned anything new (if they already knew the scent). We must address that.

   Timeline for 80 minutes:

    0-10 min: Introduction to the activity and the knowledge argument (remind them of Mary's situation). Explain the steps.
    10-20 min: Provide the third-person knowledge (handout or lecture) about the scent. We choose one scent (e.g., vetiver). Students read/listen and then write predictions (5 min for writing).
    20-25 min: Collect predictions (or have them hold on to them). Explain the smelling procedure.
    25-35 min: Pass the scent around. Each student smells and writes down their experience (and whether it matched their prediction). They also note if they learned something new.
    35-50 min: Group discussion: Share experiences. Did anyone learn something new? How did the actual experience compare to the description?
    50-70 min: Debrief: Map to Mary's room. Then introduce the physicalist replies (which they have read) and discuss how they might respond to this activity. Also, discuss the limitations of the activity.
    70-80 min: Wrap-up and questions.

   Materials:
     - Handout with the third-person facts about the scent (for vetiver, for example).
     - A vial or scent strip with the scent (one that can be passed around). Alternatively, prepare multiple strips so that students can have their own (if time and budget allow).
     - Paper and pens for predictions and reflections.
     - A backup scent in case of allergies or if the first scent is known by too many? But we'll stick to one for simplicity.

   What the activity cannot reproduce:
     - Mary's complete physical knowledge: Our description is nowhere near complete. We give only a few facts.
     - The sensory modality: Smell is not vision. The argument is about color, but the structure is similar.
     - The novelty: Some students might already have experienced the scent.

   What the facilitator must supply:
     - The analogy: Explicitly connect each step to Mary's situation.
     - The philosophical context: Remind them that the knowledge argument is about whether physicalism can account for subjective experience.

   Predictable problems and solutions:

    Problem 1: Some students have already smelled the scent.
        Solution: Acknowledge that this is a limitation. Ask them to try to recall if they learned something new when they first smelled it, or to focus on the gap between the description and the memory of the experience.

    Problem 2: The scent is too weak or too strong, or the vial doesn't pass well.
        Solution: Use scent strips (like perfume testers) so each student can have one. Or, have multiple vials and pass them in groups.

    Problem 3: Allergies or sensitivities.
        Solution: Before the activity, ask if anyone has sensitivities to scents. Have an alternative activity for those who cannot participate (e.g., they can do a thought experiment with a visual illusion that you describe, but they don't see until later). Or, have a visual alternative (like a unique image) for them.

    Problem 4: Students don't take the prediction seriously or write vague predictions.
        Solution: Emphasize that they should try to imagine the experience as best they can from the description. Encourage detail.

    Problem 5: Time management: The passing of the scent might take longer than expected.
        Solution: Use scent strips that can be quickly distributed. Or, have students come up in groups to smell at the front.

    Problem 6: The description might inadvertently give away the qualitative experience (e.g., by saying "it smells like wet earth").
        Solution: The description should be as objective as possible. Avoid subjective descriptors. Stick to facts about production, chemistry, and use.

   Example Description for Vetiver:

     - Vetiver is a perennial grass native to India.
     - The oil is extracted from the plant's roots through steam distillation.
     - The main chemical components are sesquiterpenes, such as beta-vetivene, vetiverol, and vetivenyl vetivenate.
     - It is used in perfumery as a fixative to make scents last longer, and in aromatherapy for its calming properties.
     - It is also used in some soaps and cosmetics.

     Note: We avoid any description of the smell.

   Debrief Map:

     - The third-person knowledge provided = Mary's complete physical knowledge of color vision.
     - The prediction = Mary's prediction about what seeing red will be like.
     - The experience = Mary leaving the room and seeing red.
     - The reflection on whether they learned something new = Mary's exclamation "So that's what it's like!"

     Then we ask: Did you learn something new? If so, what? How does this bear on physicalism?

     Then we can introduce the replies:

        - Ability hypothesis (Lewis): What you gained was not new propositional knowledge but new abilities (e.g., to recognize, imagine). Ask: Did you gain a new ability to recognize vetiver? Or did you gain a new piece of information (what it's like)?

        - Churchland's reply: Mary would not be surprised because she could have deduced the experience from her knowledge. But in our case, could they have deduced the smell? Why or why not?

     We must note that our description was incomplete (unlike Mary's complete knowledge) so the analogy is imperfect.

  Let's adjust for time and practicality:

    Since 80 minutes is tight, we might need to streamline.

    Alternative: Use a visual experience? For example, show them a description of an optical illusion (without showing the image) and then show the image? But again, the knowledge argument is about sensory qualia, and visual illusions are about cognitive processing.

    I think the scent activity is still the best.

    Revised Timeline:

    0-5 min: Introduction (remind of Mary, set up the activity)
    5-15 min: Distribute the fact sheet about the scent (vetiver). Give them 5 minutes to read and then 5 minutes to write a prediction.
    15-20 min: Collect predictions (or have them keep for comparison).
    20-25 min: Distribute scent strips (or pass vials). They smell and write their experience (5 min).
    25-40 min: Group discussion (in small groups of 3-4): Share what they wrote about their experience and whether they learned something new. Then, each group reports back one key insight.
    40-60 min: Class debrief: Map to Mary. Discuss: Did the activity make them feel the force of the knowledge argument? Then, connect to the physicalist replies they read.
    60-75 min: Discuss the replies in light of the activity.
    75-80 min: Wrap-up.

    Materials for 18 students:

     - 18 copies of the fact sheet (one per student).
     - 18 scent strips (each with a drop of vetiver essential oil, placed in a small ziplock bag to preserve scent and prevent contamination) OR one vial per 3-4 students (so 4-6 vials) to pass around. Strips are better for speed and hygiene.
     - Alternatively, use cotton balls with a drop of oil in a small, labeled plastic bag (one per student). This is cost-effective.

    Preparation:

     - Buy vetiver essential oil (available online or at health stores). 
     - Prepare fact sheets (print out the description without any qualitative descriptors).
     - Prepare scent strips: Cut blotter paper (or use coffee filters) into small strips. Put a drop of oil on each and place in a small ziplock bag. Label the bag with a number (so they don't know the scent until the end).

    Safety: Vetiver oil is generally safe, but if a student is pregnant or has a known sensitivity, they should avoid. So we must check.

    If we cannot guarantee safety, we might choose a more common and safe scent? Like vanilla? But vanilla is too common. Or we can use a non-scented alternative? 

    Alternatively, use a **taste** that is safe: **Honey** from a specific flower (like manuka) that has a distinct taste? But again, not novel.

    Given the time, let's stick with the scent but have an alternative for those who cannot participate: They can be the "Mary" for a taste experience? But we don't want to have two parallel activities.

    Or, they can do a thought experiment: Imagine a scent they haven't experienced and then read the description and then later we reveal and they imagine the experience? But that's weak.

    We might have to accept that a few students might not be able to participate. They can still participate in the discussion by listening to others.

    Final Note: The facilitator must emphasize that this is an imperfect analogy but designed to evoke the intuition behind the knowledge argument.

    List of problems again:

     1. Novelty: Some know the scent -> Have a few scents available? But that complicates. Alternatively, we can have two groups: One with scent A, one with scent B. But then we need two fact sheets and double the preparation. For a first time, stick to one scent and accept the limitation.

     2. Allergies: Ask ahead of time. In the invitation email, let students know we will be using scents and ask if anyone has sensitivities. If so, have a visual alternative. For example, for those students, provide a fact sheet about a visual illusion (like the "checker shadow illusion") and then show them the image. They can write about whether the experience matched the description.

     3. Time: Keep strict time limits.

     4. Vague predictions: Model a prediction: "Based on the fact that it comes from roots and has these chemicals, I expect it to smell earthy and perhaps a bit medicinal."

    This is a rich activity. Good luck!
answer: |-
  ### Structured In-Class Activity: "Mary's Scent Experiment"  
  **Objective**: To recreate the epistemic structure of Jackson's knowledge argument (Mary's room) by having students predict a novel sensory experience based on third-person knowledge, then undergo the experience to test for new knowledge.  

  ---

  ### **Activity Rules and Sequence**  
  #### **Phase 1: Knowledge Acquisition (15 mins)**  
  - **Rules**:  
    1. Students receive a **fact sheet** about a specific scent (e.g., **vetiver essential oil**—a complex, earthy, less common scent).  
    2. The sheet contains **only third-person, physical/functional knowledge** (no qualitative descriptions).  
    3. Students **must not smell the scent yet** and should avoid guessing the scent name.  
  - **Content of Fact Sheet** (example for vetiver):  
    - *Botanical source*: Extracted from the roots of *Chrysopogon zizanioides*, a tropical grass.  
    - *Chemical composition*: Primary compounds are sesquiterpenes (e.g., β-vetivene, vetiverol).  
    - *Production*: Steam distillation of dried roots; 100 kg roots yield ~1 kg oil.  
    - *Uses*: Fixative in perfumes, aromatherapy for stress relief, antifungal in agriculture.  
    - *Comparisons*: Structurally similar to patchouli but with higher alcohol content.  
  - **Student Task**:  
    - Read the fact sheet.  
    - Write a prediction: *“Based on this information, describe what you expect the scent to smell like. Be specific.”*  

  #### **Phase 2: Prediction & Reflection (10 mins)**  
  - **Rules**:  
    1. Students hand in predictions (to avoid post-hoc adjustments).  
    2. **Silent reflection**: *“On a scale of 1–5, how confident are you in your prediction?”*  
  - **Facilitator Note**: Emphasize that predictions must derive **only** from the physical facts.  

  #### **Phase 3: Sensory Experience (10 mins)**  
  - **Rules**:  
    1. Distribute **scent strips** (blotting paper with 1 drop of vetiver oil) in sealed bags.  
    2. Students smell the scent privately and write:  
       - *“Describe the scent in your own words.”*  
       - *“Did you learn anything new? If so, what?”*  
       - *“Was your prediction accurate? Why or why not?”*  

  #### **Phase 4: Group Discussion (20 mins)**  
  - **Rules**:  
    1. **Small groups (4–5 students)**: Share experiences using guiding questions:  
       - *“Did anyone feel they learned something new? What?”*  
       - *“How did the actual experience differ from your prediction?”*  
       - *“Could the fact sheet fully prepare you for the smell?”*  
    2. **Full class**: Groups report key insights.  

  ---

  ### **Timeline (Total: 80 mins)**  
  1. **Introduction** (5 mins): Recap Mary’s room argument and activity goals.  
  2. **Phase 1: Knowledge Acquisition** (15 mins).  
  3. **Phase 2: Prediction & Reflection** (10 mins).  
  4. **Phase 3: Sensory Experience** (10 mins).  
  5. **Phase 4: Group Discussion** (20 mins).  
  6. **Debrief & Philosophy Link** (15 mins).  
  7. **Q&A/Wrap-up** (5 mins).  

  ---

  ### **Materials to Prepare**  
  1. **Fact sheets** (18 copies): 1-page physical/functional description of vetiver (or backup scent).  
  2. **Scent strips**:  
     - 18 blotter paper strips + 1 small vial of **vetiver essential oil** (cost: ~$10 online).  
     - Place each strip in a labeled ziplock bag to contain scent.  
  3. **Backup for allergies/sensitivities**:  
     - **Visual alternative**: Fact sheet about the **“checker shadow illusion”** (Adelson, 1995). Students predict how Squares A/B will look, then view the image.  
     - Provide scent-free seating at the front for sensitive students.  
  4. **Paper/pens** for predictions and reflections.  
  5. **Timer** to keep phases strict.  

  ---

  ### **Debrief: Mapping to Jackson’s Argument**  
  1. **Mary’s Knowledge → Fact Sheet**:  
     - Students had “complete” physical knowledge (chemical, botanical, functional)—analogous to Mary’s neuroscientific knowledge.  
  2. **Prediction → Mary’s Expectations**:  
     - Predictions were based on deductions from physical facts, mirroring Mary’s inferences about color experience.  
  3. **Sensory Experience → Mary Leaving the Room**:  
     - The moment of smelling vetiver parallels Mary seeing red for the first time.  
  4. **New Knowledge → Jackson’s Conclusion**:  
     - Most students will report **phenomenal novelty** (e.g., *“I knew it was earthy, but not this smoky or deep”*). This “what it’s like” knowledge (qualia) is the argument’s core: **physical knowledge is incomplete**.  
  5. **Connect to Readings**:  
     - *Lewis/Churchland reply*: “Did you gain new *information* or just a new *ability* (e.g., to recognize vetiver)?”  
     - *Jackson*: “Does this show physicalism can’t explain subjective experience?”  

  ---

  ### **Honest Limitations & Facilitator Notes**  
  #### **What the Activity Can’t Reproduce**:  
  - **Mary’s “Complete” Knowledge**: Students get a *fraction* of physical knowledge (not the “entire physical truth”). The facilitator must stress this gap.  
  - **Universal Novelty**: Some students may recognize vetiver. **Mitigation**: Use a less common scent (e.g., **ylang-ylang** or **myrrh**) and frame prior exposure as “Mary forgetting her knowledge.”  
  - **Scent ≠ Color**: Smell involves memory/emotion more than vision. **Facilitator must clarify**: The argument is about *any* experiential knowledge, not just vision.  
  - **Subjectivity**: Not all will agree they learned something new. **Use this**: It mirrors philosophical disagreement!  

  #### **Facilitator’s Role**:  
  - **Supply the Analogy**: Explicitly link each step to Mary’s story during debrief.  
  - **Defuse Reductionism**: Preempt Churchland-style replies by asking, *“Could Mary *deduce* the smell from the facts?”**  
  - **Emphasize Imperfection**: “This is a rough analogy—let’s critique it!”  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: “I’ve smelled this before!”  
     - **Solution**: Pre-select a less common scent (avoid lavender/vanilla). If recognized, ask: *“Could young Mary, with *only* the fact sheet, have predicted this?”* Redirect to the thought experiment.  
  2. **Problem**: Allergies/sensitivities.  
     - **Solution**: Announce the activity in advance; use visual backup. For scent-sensitive students, offer to step outside during Phase 3.  
  3. **Problem**: Vague predictions (e.g., “It’ll smell weird”).  
     - **Solution**: Model a prediction: *“Based on the chemistry, I expect a sharp, medicinal odor.”*  
  4. **Problem**: Scent strips too weak.  
     - **Solution**: Test oil potency beforehand; use 2 drops per strip. Have a backup vial to reapply.  
  5. **Problem**: Time runs short.  
     - **Solution**: Cut group discussion to 15 mins; focus debrief on 2–3 key insights. Prioritize mapping to Jackson.  
  6. **Problem**: Students dismiss the argument.  
     - **Solution**: Highlight the *intuition*: *“Why did 70% of you report surprise? What does that suggest?”*  

  ---

  ### **Why This Works**  
  - **Tangible Aha Moment**: Students *feel* the gap between description and experience.  
  - **Low Cost/Safety**: Scents are cheap, non-ingestible, and easy to distribute.  
  - **Debate Spark**: The mismatch primes critique of physicalist replies (e.g., “Was your ‘new knowledge’ just an ability?”).  

  **Tip**: Run a test with a colleague first! Adjust scents based on regional availability (e.g., **juniper berry** in Europe, **palo santo** in the Americas).
