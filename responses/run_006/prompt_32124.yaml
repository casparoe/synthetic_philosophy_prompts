  ok so i keep running into this move in consciousness debates: someone says "a philosophical zombie is basically like a really advanced AI — it does all the same stuff we do, talks about its feelings, writes poetry about its inner life, but there's nothing it's like to be it. if you think AI could do all that without being conscious, you've already accepted the zombie intuition. so consciousness must be a further fact beyond the physical." the conclusion they're pushing is that physicalism is false.

  i want to audit this analogy. what maps onto what between the AI case and the zombie case? where does the mapping break? which breaks actually matter for the conclusion and which are just incidental? and does the anti-physicalist conclusion hold up once the disanalogies are on the table, or was the analogy doing more work than it looked like?
