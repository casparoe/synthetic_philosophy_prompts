  First, I need to parse the argument step by step. Premise (1) is the factivity of knowledge: if you know p, p must be true. That's standard in epistemology, so rejecting it would undermine the whole concept of knowledge. Premise (2) says if p is true, any evidence against it is misleading because it points to a falsehood. That seems intuitive—if p is true, counter-evidence must be deceptive. Step (3) combines (1) and (2) to say that knowing p means any counter-evidence is misleading, and you know this just from knowing p. Step (4) claims that if you know evidence is misleading, you can set it aside rationally. Step (5) concludes that knowing p allows you to ignore counter-evidence. Step (6) points out the absurdity: this leads to dogmatism where you never revise beliefs. Step (7) says one premise must go, but each seems okay.

