  If I reject step (3), it costs some by limiting how knowledge transfers to related propositions, but it's better than rejecting core principles like factivity. Premise (4) might also be weak because knowing evidence is misleading doesn't always mean you can ignore it—it could indicate your knowledge was flawed. But step (3) seems the cleaner break. 

