  Lastly, the film’s deterministic framing undermines liberal eugenics’ nuance. By showing genes as destiny in society’s eyes, it ignores how liberal eugenics allows for diverse traits. Defenders would argue Gattaca attacks a strawman. Scenes where characters underestimate Vincent due to genetics exemplify this misrepresentation.

