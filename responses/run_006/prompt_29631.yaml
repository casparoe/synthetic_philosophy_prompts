answer: |-
  Here's a breakdown of the distinct claims "a white horse is not a horse" (bái mǎ fēi mǎ) can express, their plausibility, and their implications for your friend's conclusion about conventionalism vs. natural kinds. I'll draw on logical distinctions and historical context (primarily Gongsun Long's *White Horse Dialogue* and Mohist logic) to clarify the readings.

  ### Core Distinctions & Key Term ("fēi" - 非)
  *   **fēi as Non-Identity (A ≠ B):** Asserting that the terms/concepts "white horse" and "horse" do not denote the same thing. (Conceptual/Semantic difference)
  *   **fēi as Class Exclusion (A ∉ B):** Asserting that an object designated as a "white horse" does not belong to the class designated as "horse". (Metaphysical/Membership claim)
  *   **Radical vs. Moderate Readings:** Does the claim challenge *all* kind-membership, or just specific linguistic/conceptual boundaries?

  ---

  ## The Menu of Live Readings

  1.  **Non-Identity of Concepts/Intensions (Moderate Semantic Reading)**
      *   **Claim:** The *concept* "white horse" is not identical to the *concept* "horse". They have different intensions (definitions/meanings): "white horse" connotes whiteness + horseness, while "horse" connotes only horseness (potentially color-neutrally).
      *   **Plausibility:** **Trivially True.** Concepts with different defining properties are different concepts. This is foundational to logic and semantics.
      *   **Implies Conventionalism?** **No.** Different concepts can perfectly well track different, real aspects or subdivisions of reality. "Mammal" and "vertebrate" are different concepts tracking real biological features. This reading only establishes a linguistic/conceptual distinction, not that the distinctions are arbitrary or that the things the concepts pick out aren't real.
      *   **Historical Context:** This is likely the *core* of Gongsun Long's argument in the dialogue. He emphasizes that "horse" signifies the *shape/form* (形 xíng) while "white" signifies the *color* (色 sè). Adding "white" to "horse" changes the concept being signified.

  2.  **Exclusion from Extension (Moderate Semantic-Metaphysical Reading)**
      *   **Claim:** The *extension* (set of things referred to) of the term "white horse" is not identical to, and is a *proper subset* of, the extension of the term "horse". Therefore, while all white horses *are* horses, the *terms* do not refer to the same set. "A white horse" picks out a smaller, specific group *within* "horses".
      *   **Plausibility:** **Trivially True.** Extensions are sets defined by intensions. Different intensions (as in #1) generally define different extensions (or nested ones). This is basic set theory/logic.
      *   **Implies Conventionalism?** **No.** This simply reflects the hierarchical structure of classification. The fact that "oak" refers to a subset of "tree" doesn't mean trees or oaks aren't natural kinds; it reflects the real biological hierarchy. The terms track real nested divisions. Gongsun Long's point might be that demanding "a white horse" when asked for "a horse" is incorrect *because* the extensions differ (you're asking for a specific subset, not the general kind), but this doesn't challenge the reality of the kinds themselves.

  3.  **Semantic Exclusion / Violation of Necessary Conditions (Moderate-Metaphysical Reading - Closest to Gongsun Long)**
      *   **Claim:** The term "horse" signifies the essential property (形 xíng, shape/form) *alone* and *necessarily excludes* color specifications. Therefore, applying the term "horse" to something *requires* abstracting away from its color. An object possessing a *specific* color (like white) *cannot* be correctly designated *simply* as "horse" in its full particularity; "white horse" is the correct designation *because* it includes the color. To call it just "horse" is incomplete/misleading regarding its actual properties. (Alternatively: "Horse" implicitly means "horse *of no specific color*", making "white horse" something different).
      *   **Plausibility:** **Substantive but Defensible (Contextually).** This hinges on a specific, perhaps stipulative, semantic theory about kind terms requiring abstraction from accidental properties like color. While not how we *always* use "horse" (we often use it to include colored particulars), it's a coherent position emphasizing the gap between abstract universals and concrete particulars. Gongsun Long argues this strenuously in the dialogue (e.g., "Horses certainly have color. Therefore, there are white horses... If horses had no color, there would simply be horses. How could there be white horses?").
      *   **Implies Conventionalism?** **Weakly, or Not Necessarily.** It highlights how *language* abstracts and selects properties for designation. This suggests a *conventional element* in how we *form* kind terms – we choose which properties to essentialize (shape) and which to treat as accidental/modifiable (color). However, it **does not deny** that the underlying properties (horseness, whiteness) or the objects possessing them are real. It argues that *how we use the bare term "horse"* involves a conventional act of abstraction, but the basis for that abstraction (the shared shape/form) might still be real. It leaves open the possibility of natural kinds (like "horse") defined by real essential properties, even if our linguistic practice involves abstraction.

  4.  **Category Mistake / Misuse of "Is" (Part-Whole Confusion)**
      *   **Claim:** Asserting "a white horse *is* a horse" commits a category error by conflating a specific instance/subtype ("white horse") with the general category ("horse"). The "is" of predication ("is a horse") is being misinterpreted as an "is" of identity ("is identical to the concept Horse"). Therefore, "a white horse is *not* [identical to] a horse" correctly denies this mistaken identity, while "a white horse *is a* horse" correctly asserts class membership.
      *   **Plausibility:** **Trivially True** (as a corrective to the specific confusion). It clarifies logic.
      *   **Implies Conventionalism?** **No.** This is purely about avoiding a logical/semantic error in using "is". It presupposes the coherence of class membership and says nothing about whether the classes themselves are conventional or natural.

  5.  **Radical Nominalism / Denial of Kind-Membership (Strong Metaphysical Reading)**
      *   **Claim:** Particular objects (like *this* white horse) do not truly instantiate universals or belong to natural kinds (like Horse). There are only unique particulars ("white horses"), and grouping them under general terms ("horse") is purely a conventional linguistic act with no basis in mind-independent reality. "A white horse is not a horse" means this particular isn't *really* a member of the kind "horse" because such kinds don't objectively exist.
      *   **Plausibility:** **Substantive, but Highly Controversial/Generally Considered False.** While nominalism is a serious philosophical position, the claim that *no* particulars belong to *any* natural kinds is extreme and clashes with scientific practice and common sense. It struggles to explain shared properties, causal powers, and successful induction/prediction.
      *   **Implies Conventionalism?** **Yes, Radically.** This reading directly entails that *all* kind-terms are merely conventional groupings imposed on a world of unique particulars, denying natural kinds entirely. *This is the reading your friend needs to license his strong conclusion.*
      *   **Historical Context:** While the School of Names challenged naive realism, attributing *this* radical nominalism to Gongsun Long is dubious. He argues *for* the reality of abstract attributes (形 xíng - shape/form; 色 sè - color; 坚白 jiān bái - hardness/whiteness) and their independence. His point is often that "white horse" signifies a *compound universal* (white-horse), distinct from the simple universal "horse", both of which he seems to treat as real abstractions. He's more of a peculiar realist about universals/attributes than a nominalist about particulars.

  6.  **Contextual/Sortal Relativity (Moderate Semantic-Metaphysical Reading)**
      *   **Claim:** Whether something counts as "a horse" depends on the context and the operative "sortal" concept. In a context demanding identification by species/shape alone, "horse" suffices. In a context demanding identification by specific color, "white horse" is required, and using just "horse" would be insufficient or incorrect *for that purpose*. "A white horse is not a horse" means it's not correctly identifiable *merely* as a horse *in contexts where color specification is essential*.
      *   **Plausibility:** **Substantive and Defensible.** Sortal concepts and context-sensitivity are real features of language and identification.
      *   **Implies Conventionalism?** **Partly, but Weakly.** It shows that *which* kind-term we apply, and whether a bare kind-term suffices, depends on contextual conventions and purposes. However, it **does not deny** that the object has the property of being a horse, or that "horse" picks out a real, mind-independent category. It highlights the pragmatic/conventional element in *application* without undermining the reality of the kinds themselves.

  ---

  ## Which Readings License Your Friend's Conclusion?

  *   **Directly Licenses Strong Conventionalism (Denial of Natural Kinds):**
      *   **5. Radical Nominalism:** This is the *only* reading that directly and fully supports the conclusion that kind-terms are *purely* conventional and do not track mind-independent divisions. However, it's the least plausible reading historically and philosophically.
  *   **Weakly Suggests or Compatible with *Some* Conventional Element, but Leaves Natural Kinds Intact:**
      *   **3. Semantic Exclusion:** Highlights conventionality in *how we define and use* the *bare term* "horse" (abstracting from color), but presupposes the reality of the property (horseness) it designates.
      *   **6. Contextual/Sortal Relativity:** Shows conventionality/pragmatics in *application* of kind-terms, but doesn't challenge the reality of the properties/kinds referred to.
  *   **Do Not License Conventionalism Conclusion:**
      *   **1. Non-Identity of Concepts:** Only about concepts/words, not reality.
      *   **2. Extension Exclusion:** Only about set relationships, presupposes the sets exist.
      *   **4. Category Mistake:** Corrects logic, presupposes class membership.

  **Your Friend's Likely Move:** He is almost certainly **conflating Reading 1 (Trivially True Non-Identity of Concepts) with Reading 5 (Radical Nominalism)**. He points to the undeniable conceptual difference (Reading 1) but slides from that to the conclusion that the groupings are conventional because the concepts differ (which only follows if you assume Reading 5 – that differing concepts *must* mean purely conventional groupings). Alternatively, he might be leaning on a strong interpretation of Reading 3 (Semantic Exclusion) and misinterpreting its implications. The historical core (Reading 3) does *not* entail the radical conventionalism he wants.

  ---

  ## Confidence & Uncertainty

  *   **Overall Confidence: High.** The distinctions between conceptual non-identity, class membership, and radical nominalism are fundamental in philosophy of language/metaphysics. The analysis of `fēi` aligns well with scholarship on classical Chinese logic (e.g., comparisons with Mohist `shi`/`fei`). Mapping the readings to implications for conventionalism is logically sound.
  *   **Point of Least Certainty:** **The precise metaphysical implications of Reading 3 (Semantic Exclusion) within Gongsun Long's own framework.** Did he believe "horseness" (马 mǎ) was a *real universal* (Platonic form, Aristotelian essence, or some other abstract entity) existing independently of particulars and language? Or was it merely a linguistic abstraction with no robust ontological commitment? Scholars debate this. If he was a strong realist about the universals `horse` and `white`, then even Reading 3 is compatible with natural kinds (albeit strangely essentialized ones). If he saw the universals *only* as products of linguistic abstraction, then Reading 3 leans closer to conventionalism. The dialogue focuses on logic, semantics, and correcting misuse, not explicitly laying out an ontology. My characterization of Reading 3 as leaving natural kinds *potentially* untouched reflects the more common scholarly interpretation that he wasn't a radical nominalist, but the ontological grounding remains ambiguous. **This ambiguity is precisely where your friend might be smuggling in his stronger conclusion.**
