  4. Part-whole confusion: White horses are a subset, so saying they're not horses misuses "is not." Trivially true but doesn't help conventionalism.
  5. Radical nominalism: Denying that particulars belong to kinds. This is false and extreme, but if accepted, it would support conventionalism. However, Gongsun Long likely wasn't going this far.
