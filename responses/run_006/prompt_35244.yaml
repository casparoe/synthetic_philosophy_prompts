answer: |-
  1. **Integrity as constitutive of self**: Exploiting the gap would fundamentally alter your relationship with your profession and self-conception, turning your skills—meant for building and securing—into instruments of theft, corrupting your identity regardless of external observation.  
  2. **Violation of implicit fiduciary duty**: As a steward of financial systems, you hold a position of inherent trust; exploiting a hidden flaw breaches this duty of loyalty to your employer, clients, and the system’s integrity, irrespective of explicit agreements.  
  3. **Normalization of hidden harm**: Your act, though isolated, implicitly endorses a world where exploiting undetectable vulnerabilities is permissible, weakening the foundational trust necessary for cooperative systems (like finance) to function justly for everyone.  
  4. **Corrosive effect on character**: Choosing theft cultivates dispositions like rationalization and entitlement; even undetected, this erosion of virtue makes future moral compromises easier and diminishes your capacity for genuine trustworthiness.  
  5. **Existential self-respect**: Abstaining affirms that your actions align with your aspirational values—not out of fear, but because you refuse to be the kind of person who exploits such opportunities, preserving intrinsic self-worth beyond utility or consequence.
