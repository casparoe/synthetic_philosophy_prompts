prompt: |-
  Bit of an odd one. I'm a software engineer with basically no philosophy background, but I've been going back and forth with a mate about whether taste in music and film is just subjective or weather some verdicts are simply better. He kept pointing me to Hume's standard of taste, and I've now read the essay twice but it still sits in my head as a list of moves rather than one idea. I find that tight formal constraints help me actually grasp a position, the way writing a small parser helps me understand a grammar.

  So could you write me a Petrarchan sonnet about Hume's standard of taste? I'd like the octave to set up the problem properly: beauty is not a property out there in the object, it is a sentiment in the observer, and yet we don't in practice treat all judgements as equal, and we do talk about one work being better than another. The volta should be the move to the idea that some judges are better placed than others — strong sense, delicacy, practice, comparison, freedom from prejudice, good sense — and that the standard is something like the convergence of such judges over time. The sestet should make clear that this is not a mechanical rule you can apply like a checklist, and maybe say something about why the standard is slow and empirical rather than deductive. Someone who knows Hume should recognise the view without you name-dropping the jargon every line, and someone who doesn't should still find it a good poem.

  After the poem, add a short note saying where you've taken liberties or leaned on a contested reading of Hume, how confident you are in the philosophical details, and wich bit you are least sure of.
