prompt: |-
  So I'm a software engineer — tech lead at a mid-size company, no formal philosophy background — and I keep getting pulled into these monthly kill-or-keep meetings for projects that are behind schedule and over budget. The official wisdom in the room is always the same: sunk costs are sunk, so ignore them and only look forward. But when I try to actually apply that to a real project its not clean at all. Some of the money we already spent did buy stuff that matters going forward: we learned where the hard parts are, the team built up context on the codebase, customers are expecting the thing because we announced it, and switching to something else has real migration costs of its own. So I can't tell whether I'm being rational or just dressing up throwing good money after bad.

  Could you write me a reusable decision procedure for these kill-or-keep calls, grounded in whatever economics or philosophy actually says about the sunk cost fallacy? It should be a checklist I can run in about an hour, with the questions in order, what counts as a good enough answer to each, where it stops with a kill, where it stops with a keep, and where it should punt to a human because the question is a values call rather than a facts call. I want you to be honest about which steps are judgment calls disguised as procedure, and about whether honoring sunk costs is actually always irrational or whether there are legit cases where past investment should change the decision. Then run it on two or three of these: (a) a two-year internal tool rewrite that's maybe 60–70% done, but a SaaS product now covers 80% of what we needed it for; (b) a customer-facing feature we publicly promised and some customers pre-paid for, now way over budget, and a competitor just shipped something close; (c) a small spike we funded that produced no product but taught us a lot about which approach not to take. Include at least one case where the procedure tells me to kill something the team will hate killing. These decisions are usually a few hundred thousand to a couple million in future spend, a team of five to eight people, the eng manager and a product person have to sign off on the call, and the folks in the room mostly have skin in the game because they've been building the thing.
reasoning: |-
  Okay, the user is a tech lead at a mid-sized software company dealing with monthly kill-or-keep meetings for troubled projects. They understand the sunk cost fallacy but find real-world application messy because past investments often create tangible future value (knowledge, customer expectations, migration costs). They want a practical, reusable decision framework that acknowledges these complexities.

  Hmm... the core tension here is between textbook economics (which says sunk costs should always be ignored) and operational reality (where sunk costs often create path dependencies). The user's frustration suggests they've encountered dogmatic application of the fallacy that ignores second-order effects. Interesting how they specifically mention "dressing up throwing good money after bad" - they're suspicious of their own biases.

  Let me unpack their implicit needs: First, they need cover for politically charged decisions (hence wanting something "grounded in economics/philosophy"). Second, they need to shortcut endless debates by making implicit tradeoffs explicit. Third, they want to protect against both sunk cost fallacy AND its opposite (the "Concorde fallacy" of abandoning viable projects due to optics). Fourth, they need to surface when decisions are actually about values vs analysis.

  For the framework... should anchor in three principles: 1) Future costs/benefits only, 2) Explicitly value intangible assets created by past spend, 3) Acknowledge decision costs. Needs to force quantification even when numbers are fuzzy. The "punt to human" flags are crucial - this user understands that not everything reduces to math.

  Key economic concepts to weave in: Opportunity costs (Marshall), option value (Dixit), irreversible investments (Gintis). For philosophy, add existential commitment (Sartre) vs rational choice (Weber). But must keep this practical - no jargon in the checklist.

  For the case studies: The internal tool rewrite (a) is perfect for showing when sunk costs create option value. The pre-paid feature (b) will test how to weigh contractual ethics against market changes. The failed spike (c) demonstrates explicit learning value. And yes, need to include a "kill" that'll be unpopular - probably the competitor scenario where pride is in play.

  Biggest trap to avoid: Framing this as sunk cost vs non-sunk cost. The real magic is in steps 5-8 where we convert past losses into future assets. The termination cost analysis (step 4) is where most frameworks undercook it. Should emphasize that "migration costs" include productivity drains from context switching.

  ...time to structure this as a flow with clear off-ramps. The "one hour" constraint means no more than 8 steps. Will make step 7 the ethics gatekeeper - that's where values unavoidably enter. For the "judgment call" warnings, need to be brutally honest about steps 3 (learning valuation) and 7 (reputational weight).
answer: |-
  Here's a battle-tested decision procedure grounded in behavioral economics and decision theory, designed for messy real-world scenarios where sunk costs create tangible *future* value. It explicitly handles the tension between textbook sunk cost fallacy and operational reality.

  **Reusable Kill/Keep Decision Framework (60-Minute Checklist)**

  **Core Principle:** *Only future costs and benefits matter* — but **past investments can create future assets** (knowledge, artifacts, relationships) or **future liabilities** (switching costs, reputational damage). Value these explicitly.

  ---

  **1. Future Baseline (5 mins)**  
      *Q:* "If we'd never started this project, knowing what we know *now*, would we start it *today*?"  
      *Good Answer:* Clear "yes" (proceed to step 2) or "no" (proceed to step 4). Murky "maybe" → proceed to step 2.  
      *Stop if:* Clear "no" → **KILL** (unless step 4 shows catastrophic termination costs).  
      *Judgment Call:* Defining the "know what we know now" baseline objectively.

  **2. Future Value Assessment (15 mins)**  
      *Q:* "Quantify the *remaining* benefits (revenue, cost savings, strategic positioning) if completed *on the new timeline/budget*. Be pessimistic."  
      *Good Answer:* Monetary estimate or clear strategic objective (e.g., "retain Enterprise Client X").  
      *Stop if:* Value < 50% of estimated *remaining* cost → **KILL**.  
      *Judgment Call:* Valuing intangibles (e.g., "strategic positioning").

  **3. Sunk Cost Assets (10 mins)**  
      *Q:* "What future *assets* did past spending create? (e.g., knowledge, reusable code, trained team, customer commitments). What would replicating these cost if starting fresh?"  
      *Good Answer:* Specific, defensible valuations (e.g., "Team context = 3 months ramp-up worth $150k", "Customer expectation = risk of 15% churn").  
      *Stop if:* These assets make continuing cheaper than a fresh start → proceed to step 5. Else → **KILL**.  
      *Key Insight:* This is where sunk costs *legitimately* matter — as *lower future costs*.

  **4. Termination Costs (10 mins)**  
      *Q:* "What are the tangible costs of killing? (e.g., refunds, migration, reputation damage, team morale loss, lost learnings)?"  
      *Good Answer:* Quantified costs/scenarios ("Refunds = $200k", "Morale drop = risk of 2 engineers quitting").  
      *Stop if:* Termination costs > remaining project cost → **KEEP** (unless step 2 value is near-zero). Else → proceed.  
      *Judgment Call:* Valuing morale/reputation.

  **5. Opportunity Cost (10 mins)**  
      *Q:* "What's the *best alternative* use for these resources? Quantify its value and cost."  
      *Good Answer:* Concrete alternative project/action with estimates.  
      *Stop if:* Alternative NPV > (Current Project Future Value - Remaining Cost) → **KILL**. Else → proceed.  
      *Rationale:* Forces explicit comparison, not just "is this good?"

  **6. Path Dependency (5 mins)**  
      *Q:* "Does continuing create irreversible commitments or lock-in? Does stopping close future options?"  
      *Good Answer:* "Completing locks us into Tech X" or "Stopping loses first-mover advantage".  
      *Punt if:* High irreversible commitment AND low confidence → **Human Judgment** (Leadership decides risk appetite).  
      *Philosophy:* Real Options Theory (Dixit & Pindyck) — flexibility has value.

  **7. Ethical/Contractual Obligations (5 mins)**  
      *Q:* "Are there binding promises (contracts, public commitments) that change the cost/benefit?"  
      *Good Answer:* Legal assessment or PR strategy.  
      *Punt if:* Material obligations exist → **Human Judgment** (Legal/Execs decide weight of ethics vs. economics).

  **8. Final Decision**  
      *Weighted Factors:* Combine outputs from Steps 2-5 numerically if possible. If steps 6-7 punted, incorporate judgment.  
      *Threshold:* Future Value (2) + Sunk Assets (3) - Remaining Cost - Termination Cost (4) > Opportunity Cost (5) → **KEEP**, else **KILL**.

  ---

  **Critical Notes:**
  - **When Sunk Costs Matter Legitimately:** *Only* when they reduce *future* costs (step 3) or create switching costs (step 4). Never because "we’ve spent so much."
  - **Judgment vs. Procedure:** Steps 3 (valuing knowledge), 4 (reputation/morale), 6 (irreversibility), and 7 (ethics) are inherently subjective. The framework forces explicit discussion.
  - **The Trap:** Confusing *sunk cost assets* (real) with *sunk cost fallacy* (emotional). Step 3 validates the former; if you can’t articulate assets, it’s likely fallacy.

  ---

  **Case Applications:**

  **Case A: Internal Tool Rewrite (60-70% done, SaaS covers 80%)**
  1. **Future Baseline:** Unlikely to start today → proceed to step 4.  
  2. *Skip Step 2 (low value).*  
  3. **Sunk Assets:** Team context ($100k replication cost?), code artifacts (reusable?).  
  4. **Termination Costs:** Migration to SaaS ($50k?), morale hit.  
  5. **Opportunity Cost:** Deploy SaaS now → save $300k remaining dev + $75k/year maintenance.  
  6. **Path Dependency:** Completing locks internal processes to custom tool.  
  7. **Ethics:** None material.  
  *Decision:* (Sunk Assets + Termination Cost) = ~$150k < Opportunity Savings $300k+ → **KILL**.  
  *Why team hates it:* They invested effort, but SaaS objectively better. Frame as "freeing you for higher-impact work."

  **Case B: Over-Budget Pre-Paid Feature (Competitor Shipped)**
  1. **Future Baseline:** Maybe not start today (competitor exists) → proceed.  
  2. **Future Value:** Reduced differentiation → estimate $50k/month revenue (pessimistic).  
  3. **Sunk Assets:** Domain knowledge ($80k?), partial code.  
  4. **Termination Costs:** Refunds ($200k), reputation risk (churn? → estimate 10% churn risk = $500k), morale.  
  5. **Opportunity Cost:** Pivot resources → $300k value alternative.  
  6. **Path Dependency:** Low.  
  7. **Ethics:** Public promise + pre-payments → **Human Judgment: Execs must weigh $700k+ termination costs vs. $50k/month value.**  
  *Decision:* Likely **KEEP** due to catastrophic termination costs, but negotiate scope cut. If future value is near-zero, still kill and absorb costs.

  **Case C: Failed Spike (No Product, Learned Approach Doesn’t Work)**
  1. **Future Baseline:** Wouldn’t start *this spike* again → proceed.  
  2. *Skip (no product value).*  
  3. **Sunk Assets:** Knowledge of dead-end = saved $500k future wasted spend → **high-value asset!**  
  4. **Termination Costs:** None (expected outcome of spike).  
  5. **Opportunity Cost:** New spike ($50k) → potential $400k value.  
  *Decision:* **KILL** (successfully completed spike!) + **immediately fund new spike**. Team celebrates learning.

  ---

  **Key Takeaways for Your Meetings:**
  1. **Force Quantification:** Even rough numbers (order of magnitude) prevent hand-waving.
  2. **Separate Assets from Fallacy:** "What did we *buy* with the sunk cost?" is the pivotal question.
  3. **Opportunity Cost is the Silent Killer:** Most failed projects continue because this isn’t calculated.
  4. **Ethics Gets a Vote, Not a Veto:** If continuing is financially irrational, executives must own the ethical choice to absorb losses.

  This turns sunk cost debates from philosophical debates into an engineering tradeoff analysis — which is where you excel. Use the framework to depersonalize decisions and focus on resource optimization.
