  ## The Inescapable Indeterminacy: Why Harsanyi's Theorem Fails to Derive Utilitarianism

  John Harsanyi's celebrated aggregation theorem presents a compelling vision: under conditions of rational individual preferences (conforming to the von Neumann-Morgenstern axioms) and a rational, impartial social observer satisfying similar axioms, social welfare *must* take the form of a weighted sum of individual utilities. This appears a powerful derivation of utilitarianism – the sum-total of welfare – from ostensibly non-ethical, rationality-based premises. However, this defence of utilitarianism is fundamentally incomplete. The theorem falls short precisely because the indeterminacy of the weights in this weighted sum renders it compatible with *any* distributional principle. Resolving this indeterminacy unavoidably demands interpersonal comparisons of utility, the very thing Harsanyi's axiomatic structure was designed to circumvent. This failure is intrinsically linked to the nature of von Neumann-Morgenstern (vNM) cardinal utility and its limitations regarding interpersonal comparability.

  **1. The Illusion of Determinacy: The Weight Problem**

  Harsanyi's theorem establishes that social welfare (W) is given by:
      W = a₁U₁ + a₂U₂ + ... + aₙUₙ
  where Uᵢ represents individual i's vNM utility function, and the aᵢ are positive weights.

  The critical flaw lies in the **indeterminacy of the weights (aᵢ)**. The theorem, based solely on rationality axioms applied to individual preferences and the social observer's preferences, *cannot determine the values of these weights*. It only guarantees that *some* set of positive weights exists. This indeterminacy is profound:

  *   **Compatibility with Any Distribution:** Assigning vastly higher weights to some individuals (e.g., the wealthy, a specific social group) and negligible weights to others leads to a social ordering that prioritises the welfare of the heavily weighted, irrespective of the *level* or *distribution* of welfare across society. Conversely, assigning equal weights yields classical sum-utilitarianism. Assigning higher weights to the worse off yields prioritarianism or egalitarian principles. **The theorem itself imposes no constraint whatsoever on how these weights are distributed.** Any principle governing the fair or desirable distribution of welfare – strict egalitarianism, maximin, elitism, or pure sum-ranking – can be implemented simply by choosing the appropriate set of weights. The "utilitarian" sum is an empty vessel without ethical guidance on weighting.

  **2. vNM Cardinality: A Solitary Scale, Not a Common Ruler**

  Harsanyi's defence often leans on the cardinal properties of vNM utility functions. It is true that vNM utility provides an *interval scale* representation of preference under risk. For an *individual*, this means:
  *   Utility differences (U(A) - U(B) > U(C) - U(D)) are meaningful indicators of the *intensity* of preference between lotteries.
  *   The utility function is unique only up to a positive affine transformation: if U represents an individual's preferences, so does U' = αU + β (where α > 0).

  **Crucially, this cardinality is confined to the *intrapersonal* domain.** It tells us about the *relative intensity* of one person's preferences over risky prospects. It does *not*, by itself, provide any basis for comparing utility *levels* or *differences* *between different people*. Knowing that individual A experiences a larger utility *gain* moving from state X to Y than individual B gains moving from P to Q tells us nothing about whether A at X is better off than B at P, or whether A's gain from X to Y is "larger" in any ethically significant sense than B's gain from P to Q. The zero points and units of each individual's vNM scale are arbitrary (β and α can differ arbitrarily across individuals).

  **3. The Weight Indeterminacy Mirrors the Comparability Problem**

  The indeterminacy of the weights (aᵢ) in Harsanyi's sum is a direct consequence of the lack of natural interpersonal comparability inherent in vNM utilities. Consider:

  *   Suppose we scale individual 1's utility by multiplying by 2 (U'₁ = 2U₁). To preserve the *same* social ordering based on the weighted sum, we would need to *halve* their weight (a'₁ = a₁ / 2). The social welfare function W' = (a₁ / 2)(2U₁) + a₂U₂ + ... = a₁U₁ + a₂U₂ + ... is identical to the original W.
  *   **The choice of weight aᵢ is mathematically equivalent to choosing the scaling factor (αᵢ) for individual i's vNM utility function.** Assigning a high weight to an individual is indistinguishable from stretching their personal utility scale, making a unit change on *their* scale count for more in the social calculus.

  **4. Avoiding Comparability? The Veil's Limited Shelter**

  Harsanyi invoked an impartial observer behind a "veil of ignorance" (uncertainty about which societal position they would occupy) to generate the required impartiality. While this compels the observer to consider everyone's interests, it does *not* solve the weight problem. The observer, behind the veil, still needs to evaluate lotteries over social states where they have an equal chance of being *any* person. To form preferences over these lotteries, they must somehow amalgamate the vNM utilities of the different individuals they might become. **This amalgamation *requires* making interpersonal comparisons.**

  *   Should the observer be indifferent between a lottery where they might be a very happy person or a miserable person, versus one where they are always moderately content? The answer depends entirely on *how* the utilities of different people are scaled relative to each other – i.e., on the interpersonal comparisons implicitly encoded in the scaling. The observer's risk aversion over identities is meaningless without a prior interpersonal calibration of the utility scales. The veil compels consideration of all positions but provides no non-arbitrary way to commensurate the welfare levels across those positions using only the *given*, intrapersonally cardinal vNM utilities. The observer must *import* a principle for interpersonal comparison to make their choices under the veil non-arbitrary, which violates the aspiration to derive utilitarianism solely from non-ethical rationality axioms.

  **Conclusion**

  Harsanyi's aggregation theorem provides a significant result: rational individual preferences and a rational, impartial social observer, under uncertainty, necessitate a *linear* social welfare function. However, it fails decisively as a derivation of *utilitarianism* – understood as the impartial summation of comparable individual utilities – from non-ethical premises. The fundamental stumbling block is the **indeterminacy of the weights** in the aggregated sum. This indeterminacy arises because the cardinality of vNM utility functions, while capturing intrapersonal intensity of preference, provides absolutely no intrinsic basis for interpersonal comparisons of utility levels or differences. Resolving the weights – deciding whose utility counts for more in the social sum – is inherently an *ethical* task requiring precisely the interpersonal comparisons that Harsanyi's framework sought to avoid.

  The theorem demonstrates that *if* utilities are interpersonally comparable on a ratio scale (a very strong assumption Harsanyi did not explicitly build in), *then* utilitarianism follows. But without that prior ethical commitment to a specific scheme of interpersonal comparability (effectively fixing the weights or the scaling factors), the "weighted sum" form is compatible with any distributional principle one might favour, rendering the supposed derivation of utilitarianism vacuous. The indeterminacy of the weights is not a minor technicality; it is the fatal flaw revealing that interpersonal comparability, far from being avoided, is the indispensable ethical foundation that Harsanyi's impressive apparatus ultimately presupposes but cannot provide.
