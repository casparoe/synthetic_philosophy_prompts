prompt: |-
  A friend walked me through this and I can't find the exit, even though the conclusion is obviously false.

  (1) Let P be the set of all countable subsets of the real numbers, ordered by inclusion.
  (2) Every chain in P has an upper bound in P. Take any chain C in P and let U be the union of all the sets in C. Each member of C is countable, and since C is a chain, U is a countable union of countable sets, hence countable. So U is in P and contains every set in C.
  (3) By Zorn's lemma, P has a maximal element M.
  (4) M is a countable subset of R. If M weren't all of R, pick a real x not in M; then M ∪ {x} is still countable and strictly contains M, contradicting maximality.
  (5) So M = R, and R is countable.

  But the reals aren't countable, so one of these steps has to go. My friend insists it's a legitamate use of Zorn and that I should just accept that my picture of the reals is wrong, which I won't do. Which step do you reject, and what exactly is the mistake? I'd like to keep both Cantor's theorem and Zorn's lemma if I can, but tell me what I'm paying either way.
