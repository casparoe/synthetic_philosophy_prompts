prompt: |-
  I've been trying to get clear on when I think an omission is a cause of something, as opposed to just a failure to prevent it, and I'm realizing my gut verdicts don't line up neatly. Here they are.

  A lifeguard on duty, up in the chair, watching a swimmer struggle and doing nothing: I say his not jumping in caused the death. A tourist standing right next to him who also does nothing: I don't say the tourist caused the death, even though if either had acted the swimmer would have lived. A parent who doesn't feed their infant: caused the death. A doctor who doesn't give a clearly indicated antibiotic to a septic patient: caused the death. A mechanic who doesn't tighten a brake bolt he was paid to tighten: caused the crash. A drug company that learns its pill increases stroke risk but doesn't update the label: I say the company caused the strokes, or at least the excess strokes.

  So far it looks like the principle is "you caused it if you had a duty to act." But then: I dig a hole in the sidewalk in front of my house, don't cover it or put up a light, and someone falls in at night and breaks a leg. I don't have any official duty, but I'd still say I caused the injury by not covering the hole. And a friend who promises to water my plants while I'm away and forgets: I say their not watering caused the plants to die, though that feels less like causing a death and more like breaking a promise — still, I do say caused. But a neighbor who never promised and just didn't bother: I don't say they caused the plants to die.

  The pair I can't stop going back and forth on: an off-duty lifeguard, fully trained, sits on the same beach and watches someone drown. No job, no special relationship. I want to say she didn't cause the death, same as the tourist. But she could of saved the person just as easily as the on-duty guard, and she knows she could. It feels wrong that the only difference is a paycheck and a red chair.

  Is there a principle that captures my verdicts, or most of them? And what does it say about some cases I haven't listed — like someone who forgets to replace a dead smoke alarm battery in their own home and a guest dies in a fire, or a stranger who sees a child drowning in a shallow pond and does nothing? Which of my verdicts does your principle force me to give up?

  When you answer, tell me where your reasoning is most likely to fail and what argument or case would change your mind about the principle. American English please.
reasoning: |-
  Okay, the user is struggling with when an omission (not doing something) counts as causing harm versus just failing to prevent it. They've listed several scenarios where their gut reactions vary, and they're looking for a principle that explains their judgments. Let me start by understanding their examples.

  First, they mention the on-duty lifeguard causing death by not acting, but a tourist nearby doesn't. Then, a parent not feeding their infant causes death, a doctor withholding antibiotics causes death, a mechanic not tightening a bolt causes a crash. These cases all involve a duty to act. But then they bring up digging a hole and not covering it—no official duty, but they still feel responsible. A friend who promised to water plants causes the plants' death, but a neighbor without a promise doesn't. The tricky one is the off-duty lifeguard: no duty, but the user feels conflicted because they could have easily helped.

  The user wants a principle that fits most of their judgments. They also mention other cases: forgetting a smoke alarm battery leading to a guest's death, and a stranger ignoring a drowning child. They’re asking which judgments might need revising and where the principle might fail.

  Hmm. The core issue is distinguishing causation by omission from mere failure to prevent. The user’s intuitions seem tied to duties, but not just formal duties. The hole-digging example shows that even without a formal duty, creating a risk imposes an obligation. The plant scenario involves a promise, creating a duty. The off-duty lifeguard lacks both formal duty and risk creation, so the user hesitates to assign causation.

  The principle could be: omissions cause harm when there’s a duty to act, with duties arising from roles, contracts, risk creation, or explicit promises. But the off-duty lifeguard challenges this because they have the ability but no duty. The user feels it's wrong that a paycheck makes the difference. 

  The shallow pond case (like Singer’s example) might test this. If a stranger can save a child easily, does their omission cause death? The user might say no, but morally it’s blameworthy. The principle might need to separate causation from moral responsibility. 

  The smoke alarm case: the homeowner forgot to replace the battery. They created the risk (having a smoke alarm that’s now dead), so duty arises. They caused the guest's death. But if it's a guest who noticed the dead battery and didn’t act, no duty, so no causation. 

  For the off-duty lifeguard, the principle would say no causation, but the user might feel uneasy. Maybe the principle needs to include situations where one has a unique ability to help, but that could overextend. Alternatively, perhaps moral responsibility exists without causation. The user might need to accept that causation isn’t the same as blame. 

  Cases that challenge the principle: if someone has a special skill (like a doctor off-duty) but no other duty factors, does their omission cause harm? The user’s initial verdict says no. The principle might force them to stick with that, even if it feels morally unsatisfying. 

  The user might resist giving up the idea that the off-duty lifeguard caused the death. But the principle based on duty (without including ability alone) would require that. They need to decide if causation is about duty-based obligations or includes moral opportunities. 

  In summary, the principle works for most cases by tying omissions to specific duties. The off-duty lifeguard and shallow pond cases are exceptions where moral responsibility exists without causation. The user might need to accept that distinction or adjust their intuition for those cases.
answer: |-
  Here's a principle that captures nearly all your verdicts, grounded in moral philosophy and legal concepts like "duty of care":

  **An omission causes harm when:**
  **(1) The agent had a *specific obligation* to prevent that harm, AND**
  **(2) The omission was a *necessary condition* for the harm occurring given the circumstances.**

  **How this explains your cases:**

  | **Case** | **Specific Obligation?** | **Necessary Condition?** | **Your Verdict** | **Principle Match?** |
  |----------|--------------------------|--------------------------|-----------------|----------------------|
  | **On-duty lifeguard** | Yes (job responsibility) | Yes | Caused | ✅ |
  | **Tourist** | No | Yes | Didn't cause | ✅ |
  | **Parent** | Yes (role relationship) | Yes | Caused | ✅ |
  | **Doctor** | Yes (role responsibility) | Yes | Caused | ✅ |
  | **Mechanic** | Yes (contractual duty) | Yes | Caused | ✅ |
  | **Drug company** | Yes (legal/ethical duty) | Yes | Caused | ✅ |
  | **Hole-digger** | Yes (created the hazard) | Yes | Caused | ✅ |
  | **Plant-friend (promised)** | Yes (explicit commitment) | Yes | Caused | ✅ |
  | **Plant-neighbor (no promise)** | No | Yes | Didn't cause | ✅ |
  | **Off-duty lifeguard** | **No** | Yes | Didn't cause | ✅ |

  **Breaking it down:**
  - **Specific obligation** comes from: 
    - Formal roles (lifeguard on duty, parent, doctor)
    - Contracts (mechanic)
    - Creating the hazard (digging the hole)
    - Voluntary commitments (plant promise)
    - Legal/ethical duties (drug company)
  - **Necessary condition** means: Without this *particular* person's action, the harm occurs ("but-for" causation). The tourist fails here because the *on-duty* lifeguard was primarily obligated.

  **Now, your unresolved cases & edge tests:**
  1. **Smoke alarm battery (homeowner):** 
     - ✅ **Caused the death.** You created the fire risk (home), assumed responsibility for safety, and the dead battery was necessary for the guest's death. *Fits your hole-digging logic.*

  2. **Shallow pond (stranger):** 
     - ❌ **Did NOT cause the death** under this principle. No specific obligation exists (unlike your tourist case). *But this clashes with moral intuition (à la Peter Singer). This is where your gut might rebel.*

  3. **Off-duty lifeguard:** 
     - ❌ **Did NOT cause death** per principle (no obligation beyond general morality). *You feel uneasy because ability ≠ obligation. The principle forces you to maintain this verdict.*

  **Where reasoning is most vulnerable & what could change it:**
  - **Weakness:** The "specific obligation" requirement prioritizes *social/legal roles* over *moral capacity*. This excludes cases where someone could easily prevent harm at no cost (shallow pond paradox). If you believe *unique ability to prevent catastrophe* creates obligation, the principle fails.
  - **Mind-changing argument:** If presented with a case where society widely recognizes a "duty to rescue" (e.g., Vermont's "Bad Samaritan" law punishing failure to aid), the principle would need revision to include *inescapable moral opportunities*.
  - **Mind-changing case:** *A virologist alone with a soon-to-explode pandemic virus sample.* She could easily destroy it but doesn't. Even with no formal duty, we'd likely say her omission *caused* the pandemic. This suggests extreme stakes + unique capability *can* create obligation.

  **Your required surrender:** To keep consistency, you must accept:
  - The **off-duty lifeguard** truly *didn't cause* the death (only failed to prevent it).
  - The **shallow pond stranger** *didn't cause* the drowning (however monstrous their inaction).

  **Final refinement:** Add "foreseeability" to strengthen the principle? In your drug company case, *knowing* the risk makes the omission causal. But your hole-digging example already implies foreseeability without stating it. The core remains obligation + necessity.

  This framework explains 9/10 of your intuitions and forces clarity on the tough 10%. Its power is distinguishing *causal responsibility* from *moral blameworthiness* – the tourist and off-duty lifeguard may be blameworthy, but only the obligated parties *caused* the harm through inaction.
