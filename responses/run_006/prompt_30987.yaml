prompt: |-
  I'm trying to sort out what I actually think about whether information can be bad for you, and how that squares with Good's theorem. Here are my gut verdicts on cases:

  - A free, perfectly reliable app tells me which of two gas stations is cheaper; I drive to the cheaper one. Obviously the information is good.
  - A reliable source tells an investor a stock will drop about 10% next week; the investor panics, dumps their whole portfolio, and misses the rebound. I want to say the information hurt them, but I also think the problem was their updating, not the information.
  - Someone with a severe fear of flying learns their plane has a one-in-ten-million chance of crashing, so they drive 600 miles instead and die in a car crash. Same as the last one: the info made them worse of, but I blame the way they weighed the risks.
  - A patient in their last year of life is offered a free, accurate estimate of how many months they have left and declines because knowing would make them miserable. I think that's rational, and I think the information would genuinely be bad for them, even though there's no decision to make with it.
  - A recovering addict knows that if they learn where their old dealer moved, they'll relapse, so they avoid finding out. I think that's rational too, and this one bugs me because they'd update on the information accurately, so I can't just blame bad reasoning.
  - A manager is about to promote someone when a free, accurate background check turns up an old conviction that is legally irrelevant but, once known, triggers a company policy requiring a costly review. The manager ends up worse off, but I don't think that's a counterexample to Good's theorem, because the information changed which actions were available.
  - A person learns their spouse is cheating, gets divorced, and is miserable for years. I don't think the information was bad; I think the marriage was bad and the information let them act on it.

  Is there one principle that gets all of these, and what does it say Good's theorem is actually claiming? Which of my verdicts does it force me to drop? And what should I say about the case I keep going back and forth on: a person offered a free, accurate genetic test for a disease with no treatment, where the result would change nothing about what they can do but might change how they spend their remaining years in ways they can't predict?

  Please write the answer in American English.
reasoning: |-
  Okay, the user is struggling with whether information can be harmful, especially in light of Good's theorem. They've listed several scenarios where information seems beneficial in some cases but detrimental in others. Let me start by recalling Good's theorem: it states that information has positive expected value when it's free and accurate, assuming rational decision-making. But the user's examples highlight situations where people aren't fully rational or where the information leads to negative emotional outcomes.

  First, the gas station app is straightforward—information leads to a better decision, saving money. Then the investor panics despite knowing the stock drop is temporary. Here, the issue is irrational response, not the info itself. Similarly, the fear of flying case: the person overreacts to a tiny risk. Good's theorem would say the info is good, but the user blames the reasoning. 

  The terminal patient case is tricky. The patient declines the info because it would cause distress. The user thinks this is rational. Good's theorem might not apply here because there's no decision to make. The patient values emotional well-being over knowledge. This suggests that if the information doesn't aid a decision, its value can be negative based on utility.

  The recovering addict example is key. The user notes that the addict would update accurately but still relapse. So, the information itself is harmful because it leads to a loss of control. Good's theorem assumes that decisions are made rationally with the new info, but here the info directly causes a harmful action. This might be a case where the theorem's assumption of rational action breaks down.

  The manager scenario involves institutional constraints. The background check changes the available actions due to company policy. Good's theorem accounts for this because the information alters the action set, making it a different decision problem. So not a counterexample.

  The cheating spouse case: the info leads to a painful but necessary action. The harm was inherent in the situation, not the info. 

  The genetic test with no treatment is the user's sticking point. No decision to change, but potential emotional impact. If the person can't predict how they'll react, the expected utility is uncertain. Without decision relevance, the value depends on psychological impact. Some might prefer knowing to plan, others avoid distress. So it's subjective and context-dependent.

  The user's deeper need seems to be reconciling rational decision theory with real human psychology. They want a principle that accounts for emotional costs and irrational behaviors. The key is that Good's theorem applies when decisions are made rationally and information is decision-relevant. When emotions or constraints interfere, the theorem's assumptions don't hold, so information can have negative value. 

  The user might need to accept that Good's theorem is a normative ideal, not descriptive of all human behavior. Their verdicts mostly align if they consider rationality and decision relevance. For the genetic test, it's valid to decline if emotional costs outweigh benefits, which is rational given their preferences. So the principle is: information is valuable if it improves decisions via rational updating; otherwise, its value depends on non-instrumental factors like emotional impact.
answer: |-
  Here's a principle that reconciles your verdicts with Good's theorem:

  **Information is instrumentally valuable *only* if it can improve a decision you are facing.** Its *net* value depends on:
  1.  **Decision-Relevance:** Does it potentially change the best course of action?
  2.  **Rational Updating & Action:** Will you update your beliefs correctly *and* choose the best action based on those updated beliefs?
  3.  **Costs of Acquisition/Processing:** Are there direct costs (time, money, effort, stress) to getting or using the information?
  4.  **Non-Instrumental Effects:** Does the information itself cause direct positive or negative utility (joy, distress, compulsion) *independent* of any decision it influences?

  **Good's theorem formally proves:** For a rational decision-maker facing a *choice*, where information is *free* and *perfectly accurate*, the *expected instrumental value* of that information (its ability to improve the decision outcome) is always non-negative, and strictly positive if the information could change the optimal action.

  **How this principle handles your cases:**

  1.  **Cheaper Gas Station:** Highly decision-relevant. Correct updating & action. Free. No negative non-instrumental effects. **Good. (Matches)**
  2.  **Stock Tip:** Decision-relevant. *Irrational* updating/action (panic selling disregarding long-term). Free. Non-instrumental effect (panic) was negative. **Info itself had positive instrumental value *potential*, but irrational action and negative non-instrumental effect led to a bad outcome. The info didn't *cause* the harm; the reaction did. (Matches)**
  3.  **Fear of Flying:** Decision-relevant (fly or drive). *Irrational* updating/action (severe overestimation of flying risk, underestimation of driving risk). Free. Strong negative non-instrumental effect (fear). **Same as #2: Positive instrumental potential, ruined by irrationality and negative non-instrumental effects. (Matches)**
  4.  **Terminal Prognosis:** *No decision-relevance* (assumed - nothing changes medically/behaviorally). Correct updating likely. Free. Strong negative non-instrumental effect (misery). **Instrumental value = $0$ (no decision to improve). Negative non-instrumental effect dominates. Net value negative. Rational to decline.** *(Good's theorem doesn't apply because there's no decision to inform.)* **(Matches)**
  5.  **Recovering Addict:** *Decision-relevant?* Controversial. Knowing the location *creates* a new, harmful decision ("relapse?") that wasn't salient or easily acted upon before. Correct updating *and* predicted harmful action. Free. Strong negative non-instrumental effect (craving/compulsion). **Information enables a harmful action they predictably *will* take (rational action *given* their addiction, but harmful overall). Instrumental value is *negative* because it enables a worse outcome. Non-instrumental effect also negative. Net value strongly negative. Rational to avoid.** *(Good's theorem's core assumption - that information only informs an *existing* fixed set of actions - is violated here. The information fundamentally changes the available actions/decisions.)* **(Matches - Principle explains why it's different from #2/#3)**
  6.  **Background Check:** Information *changes the action set* (triggers mandatory costly review). Free. Correct updating/action likely. **Good's theorem *explicitly* handles cases where information changes the available actions. The review cost is a direct consequence of *having* the information, making it effectively not free. Instrumental value can be negative.** **(Matches - Not a counterexample to Good's theorem when correctly applied)**
  7.  **Spouse Cheating:** Decision-relevant (stay or leave). Correct updating/action likely (leaving a bad situation). Free. Negative non-instrumental effect (pain). **Strong positive instrumental value (enables escaping a harmful situation) outweighs the negative non-instrumental effect. Net positive. Good.** **(Matches)**

  **What verdicts does this force you to drop?** None. Your intuitions align perfectly with this nuanced interpretation of Good's theorem and the principle above.

  **The Genetic Test Case:**

  *   **Principle Applied:**
      *   **Decision-Relevance:** None (by description - "change nothing about what they can do").
      *   **Rational Updating & Action:** N/A (no decision).
      *   **Costs:** Free.
      *   **Non-Instrumental Effects:** Uncertain psychological impact ("might change how they spend their remaining years in ways they can't predict" - could be positive, negative, or neutral).

  *   **Analysis:** This is **analogous to the Terminal Prognosis (#4)**. Since there's no decision to inform, the *instrumental* value is $0$. The *only* value comes from the non-instrumental effects – the psychological impact of knowing vs. not knowing.
      *   The *expected* net value depends entirely on the *person's prediction* of how knowing will affect their well-being *independent of any actions they take*.
      *   If they predict knowing will cause significant anxiety, depression, or prevent them from enjoying their time (even without changing actions), the expected non-instrumental effect is negative. **Rational to decline.**
      *   If they predict knowing will bring peace, closure, or allow them to focus their remaining time meaningfully (even without changing actions), the expected non-instrumental effect is positive. **Rational to accept.**
      *   If they truly cannot predict the impact, the *expected* non-instrumental effect is highly uncertain and could be positive or negative. Declining might be the risk-averse choice.

  *   **Good's Theorem:** Does **not** apply. There is no decision the information is meant to improve. The value is purely non-instrumental/psychological.

  **In Summary:**

  *   Good's theorem guarantees that *free, accurate information has non-negative expected value for improving a specific decision* facing a rational agent.
  *   Information can be "bad" in reality because:
      1.  **It enables harmful actions** that weren't easily available before (Addict, Background Check).
      2.  **People act irrationally** on it (Investor, Fearful Flyer).
      3.  **It causes direct psychological harm** with no decision upside (Terminal Prognosis, Genetic Test - potentially).
      4.  **It has hidden costs** (like triggering mandatory procedures - Background Check).
  *   Your "back and forth" on the genetic test is justified. With no decision impact, its value is purely psychological and unpredictable. Declining based on a fear of negative psychological impact is rational, just as accepting based on a hope for positive psychological impact is rational. Good's theorem is silent here.
