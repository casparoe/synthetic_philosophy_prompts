  We are drafting an adversarial collaboration document on the dispute about epistemic akrasia and higher-order evidence. The document should have the following structure:

  1. A numbered list of jointly accepted claims, precisely stated.
  2. A disagreements table with each side's position in their own words.
  3. Identification of the cruxes (sub-questions) and for each crux, a concrete case or argument that both sides agree bears on it, along with each side's classification and reasoning.
  4. An explicit statement about whether any part of the dispute is verbal.

  Let's proceed step by step.

  ### Step 1: Jointly Accepted Claims

  We need to state precisely what we both accept. This should cover:

  - What higher-order evidence is.
  - What a case of epistemic akrasia involves.
  - What any satisfactory treatment of such cases must explain.

  Here is a draft of the jointly accepted claims:

  1. **Higher-Order Evidence (HOE)**: Higher-order evidence is evidence about the epistemic status of one's first-order beliefs or about the quality of one's first-order reasoning. It includes evidence about one's cognitive condition (e.g., fatigue, intoxication), evidence about one's reliability in the domain, and evidence from peer disagreement.

  2. **Epistemic Akrasia**: An agent is in a state of epistemic akrasia when she holds a belief (or other doxastic attitude) at the first-order level while simultaneously holding a belief that this first-order attitude is not supported by her total evidence or is irrational. More precisely, for a proposition p, the agent believes p (at the first order) and believes that her total evidence does not support p (at the higher order), or alternatively, believes that it is irrational for her to believe p.

  3. **Requirements for a Satisfactory Treatment**: Any adequate account of rationality must explain how agents should respond to higher-order evidence. In particular, it must address:
     - How higher-order evidence can affect the rational status of first-order beliefs.
     - Whether it is ever rational to be in a state of epistemic akrasia.
     - How to resolve conflicts between first-order evidence and higher-order evidence.

  ### Step 2: Disagreements Table

  We have two positions:

  - **Position A (Enkratic Requirement)**: Epistemic akrasia is always irrational. A fully rational agent must satisfy an enkratic requirement: she cannot rationally believe p while also believing that her total evidence does not support p.

  - **Position B (Level-Splitting)**: Rationality can sometimes require or permit epistemic akrasia. There are cases where the first-order evidence supports p, but the higher-order evidence misleadingly suggests that it does not, and in such cases, it can be rational to believe p while also rationally believing that one's evidence does not support p.

  We present the disagreement in a table with each side's own words.

  | **Position A** | **Position B** |
  |----------------|----------------|
  | "We hold that epistemic akrasia is always irrational: a fully rational agent cannot simultaneously believe p and believe that her total evidence does not support p (or that believing p is irrational). Any adequate theory of rationality must include an enkratic requirement that forbids such mismatches between first-order beliefs and higher-order assessments." | "We hold that rationality can sometimes permit or even require epistemic akrasia: in cases where the first-order evidence supports p but the higher-order evidence misleadingly indicates that it does not, a rational agent may (or must) believe p while also rationally believing that her evidence does not support p. The enkratic requirement is not a genuine requirement of rationality." |

  ### Step 3: Cruxes and Concrete Cases

  We identify the key sub-questions (cruxes) and for each, provide a concrete case that both sides agree is central. Then we state each side's view on the case.

  #### Crux 1: Can misleading higher-order evidence make epistemic akrasia rational?

  **Concrete Case: The Meticulous Proof (with misleading testimony about fatigue)**

  *Case Description*: Alice, a mathematician, has just completed a meticulous proof of theorem T. She checks it several times and finds no errors. However, a trusted colleague (who has not seen the proof) tells her that she has been working for 72 hours straight and that her cognitive abilities are severely impaired. In fact, the colleague is mistaken: Alice has only worked for 2 hours and is perfectly alert. But Alice has no reason to doubt the colleague's testimony. The first-order evidence (the proof) strongly supports T. The higher-order evidence (the testimony about fatigue) strongly suggests that Alice is not reliable in assessing the proof and thus that her evidence does not support T.

  *Question*: What should Alice believe about T? And what should she believe about whether her evidence supports T?

  | **Position A** | **Position B** |
  |----------------|----------------|
  | Alice should not believe T. She should suspend judgment on T because her total evidence (which includes the testimony) does not support T. Moreover, she should believe that her evidence does not support T. Thus, she avoids akrasia. | Alice should believe T because the first-order evidence (the proof) supports T. However, she should also believe that her total evidence does not support T because of the higher-order evidence (the testimony). Thus, she is akratic and this is rational. |

  #### Crux 2: Is the enkratic requirement a fundamental requirement of rationality?

  **Concrete Case: The Reason-Distorting Drug (fully understood)**

  *Case Description*: Bob takes a drug that he knows (with certainty) causes 99% of people to become extremely unreliable about a certain domain (say, politics) for the next hour, but leaves 1% unaffected. Bob also knows that the drug does not alter one's subjective sense of confidence. After taking the drug, Bob considers a political proposition Q. His first-order evidence (without the drug) would strongly support Q. However, after taking the drug, he gets a strong feeling that Q is false. He knows the drug typically distorts reasoning, but he also knows that 1% are unaffected and he has no way to tell if he is in that 1%. 

  *Question*: What should Bob believe about Q? And what should he believe about whether his evidence supports Q?

  | **Position A** | **Position B** |
  |----------------|----------------|
  | Bob should not believe Q. His total evidence (including the drug's effects) does not support Q. He should believe that his evidence does not support Q. Thus, no akrasia is required. | Bob should suspend judgment on Q because the higher-order evidence (about the drug) undermines his first-order reasoning. However, note: in this case, Position B might say that Bob should not trust his first-order feeling. But a variant: suppose Bob, despite the drug, has first-order evidence that objectively supports Q (e.g., a clear and simple argument) and he is in the 1% unaffected. Then Position B might say he should believe Q and also believe that his evidence does not support Q (because he knows about the drug). Position A would reject this. |

  *Refinement for Position B*: To make the case more directly about akrasia, we can adjust so that Bob's first-order evidence (if unaffected) supports Q, and he is unaffected, but he has the higher-order evidence about the drug. Then:

  - Position B: Bob should believe Q (because he is unaffected and the first-order evidence is good) and also believe that his evidence does not support Q (because of the higher-order evidence). This is rational akrasia.
  - Position A: Bob should not believe Q because the higher-order evidence defeats the first-order support. He should believe that his evidence does not support Q.

  #### Crux 3: Does higher-order evidence always transmit to first-order?

  **Concrete Case: Peer Disagreement (apparently self-undermining HOE)**

  *Case Description*: Two equally skilled and informed peers, Carla and David, independently assess the same body of evidence regarding a proposition R. They meet and find that they disagree: Carla believes R and David believes not-R. Both have access to the same first-order evidence and have equal respect for each other's judgment. After full disclosure, they still disagree. This disagreement is higher-order evidence for each: it suggests that the other might be right and they might be wrong.

  *Question*: What should Carla believe about R? And what should she believe about whether her evidence supports R?

  | **Position A** | **Position B** |
  |----------------|----------------|
  | Carla should move to suspend judgment on R because the peer disagreement is higher-order evidence that she might be mistaken. She should believe that her total evidence (now including the disagreement) does not support R. Thus, she avoids akrasia. | Carla should remain confident in R if her first-order evidence supports R, but she should also believe that her evidence does not support R (because of the peer disagreement). Thus, she is akratic and this is rational. However, note that some versions of Position B might say she should reduce confidence but still believe, or suspend judgment. We need a version where the first-order evidence is very strong. |

  *Refinement*: Suppose Carla has a very strong first-order case for R, and she knows that David is usually reliable but in this instance she has specific reasons to think he might have made a mistake (though she cannot pinpoint it). Position B might hold that she can rationally believe R and also believe that the total evidence (including the disagreement) does not support R.

  ### Step 4: Verbal Disagreement

  We state explicitly whether any part of the dispute is verbal.

  **Statement on Verbal Disagreement**:

  We agree that there is a substantive disagreement about the nature of rationality and the role of higher-order evidence. However, we also recognize that some differences in terminology might be at play. Specifically, the term "total evidence" might be understood differently:

  - Position A might be understood as holding that higher-order evidence is part of the total evidence that directly bears on the first-order proposition. Thus, when we say "total evidence supports p", it already incorporates HOE.
  - Position B might be understood as distinguishing between the first-order evidence (which directly bears on p) and the higher-order evidence (which bears on the relation between the first-order evidence and p). Thus, the total evidence might be split.

  However, both sides agree that the dispute is not merely verbal because:

  - The disagreement about whether an agent can rationally hold contradictory beliefs (believing p and believing that believing p is irrational) is a substantive disagreement about the structure of rationality.
  - The cases we have discussed (like the meticulous proof and the drug case) are intended to force a choice between two incompatible responses, and both sides agree that the cases are not resolved by terminological clarification alone.

  Thus, we conclude that the core dispute is not verbal but reflects a deep divergence in epistemic theory.

  ### Final Document Structure

  We can now compile the document.

  ---

  **Adversarial Collaboration on Epistemic Akrasia and Higher-Order Evidence**

  **Jointly Accepted Claims**:

  1. **Higher-Order Evidence (HOE)**: We accept that higher-order evidence is evidence about the epistemic status of one's first-order beliefs or about the quality of one's first-order reasoning. This includes evidence about one's cognitive condition (e.g., fatigue, intoxication, emotional state), evidence about one's reliability in a given domain, and evidence from peer disagreement.

  2. **Epistemic Akrasia**: We accept that an agent is in a state of epistemic akrasia with respect to a proposition p when she believes p at the first-order level and simultaneously believes at the higher-order level that her total evidence does not support p, or that believing p is irrational for her given her evidence.

  3. **Requirements for a Satisfactory Treatment**: We agree that any adequate theory of rationality must:
     - Explain how higher-order evidence affects the rational status of first-order beliefs.
     - Address whether epistemic akrasia can ever be rational.
     - Provide a resolution for apparent conflicts between first-order and higher-order evidence.

  **Disagreement**:

  We disagree on the following:

  | **Position A (Enkratic Requirement)** | **Position B (Level-Splitting)** |
  |---------------------------------------|----------------------------------|
  | "We hold that epistemic akrasia is always irrational: a fully rational agent cannot simultaneously believe p and believe that her total evidence does not support p (or that believing p is irrational). Rationality requires that one's beliefs are enkratic, meaning that one cannot rationally hold a first-order belief while also believing that it is irrational. Any theory that permits epistemic akrasia is thereby inadequate." | "We hold that rationality can sometimes permit or even require epistemic akrasia: in cases where the first-order evidence supports p but the higher-order evidence misleadingly indicates that it does not, a rational agent may (or must) believe p while also rationally believing that her evidence does not support p. The enkratic requirement is not a genuine requirement of rationality; it is sometimes rational to have beliefs that are not enkratic." |

  **Cruxes**:

  We identify the following cruxes. For each, we describe a concrete case, and then state each position's verdict and reasoning.

  1. **Crux 1: The Meticulous Proof Case**  
     *Case*: Alice completes a meticulous proof of theorem T. A trusted colleague (mistakenly) tells her she has been working for 72 hours and is severely impaired. In fact, she is alert. The proof is correct.  
     *Question*: What should Alice believe about T and about whether her evidence supports T?  
     - **Position A**: Alice should not believe T. Her total evidence (including the testimony) does not support T, and she should believe that it does not. Thus, no akrasia.  
     - **Position B**: Alice should believe T (because the proof is correct) and also believe that her evidence does not support T (because of the testimony). This akrasia is rational.  

  2. **Crux 2: The Reason-Distorting Drug Case**  
     *Case*: Bob takes a drug that he knows causes 99% of people to become unreliable about politics for one hour, but 1% are unaffected. He is in the 1% (but doesn't know that). His first-order evidence (a clear argument) supports Q. After taking the drug, he feels that Q is false.  
     *Question*: What should Bob believe about Q and about whether his evidence supports Q?  
     - **Position A**: Bob should not believe Q. The higher-order evidence (about the drug) defeats the first-order support. He should believe that his evidence does not support Q. No akrasia.  
     - **Position B**: Bob should believe Q (because he is unaffected and the argument is sound) and also believe that his evidence does not support Q (because of the drug). This akrasia is rational.  

