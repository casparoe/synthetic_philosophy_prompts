answer: |-
  Here’s a complete seminar plan designed to elicit the experiential shift towards Smith’s impartial spectator, adhering to your constraints and objectives. The activity uses a low-stakes ethical dilemma to trigger partial reasoning before introducing the impartial perspective.

  **Activity Title:** *The Heirloom Dilemma*  
  **Duration:** 115 mins total (setup: 5 mins, Stage 1: 20 mins, Stage 2: 30 mins, Stage 3: 30 mins, Debrief: 30 mins)  
  **Materials:** Paper, pens, projector/screen for prompts.  

  ---

  ### **Setup & Rules**  
  1. **Grouping:** Divide 18 students into 6 trios.  
  2. **Scenario:** Present a family inheritance dilemma (below).  
  3. **Key Rule:** Participants must argue *as themselves* in the scenario, not hypothetically.  

  ---

  ### **Prompts & Timeline**  
  *(All prompts displayed verbatim)*  

  **0-5 mins: INTRODUCTION**  
  *Project:*  
  > *“You’ve inherited a small, valuable antique (£5k) from a grandparent. Your two siblings/cousins (also inheriting) want to sell it and split the money equally. You believe you have the strongest emotional connection to it and should keep it without paying them. You all need the money.*  
  > ***Task 1 (Individual):*** *Write your argument for keeping the heirloom without compensation. Why is this fair?*”  

  **5-25 mins: STAGE 1 — PARTIAL REASONING**  
  - Students write personal justifications (e.g., *“I cared for Gran,” “It’s sentimental to me,” “They don’t appreciate it”*).  

  **25-55 mins: STAGE 2 — MUTUAL SYMPATHY (TRIOS)**  
  *Project:*  
  > *“In your trio, take turns:*  
  > *1. Read your argument aloud.*  
  > *2. Listeners note: What feels convincing? What feels self-serving?*  
  > *3. Discuss: Could you persuade your siblings? Why/why not?”*  
  - *Goal:* Surface how personal stakes distort fairness claims.  

  **55-85 mins: STAGE 3 — IMPARTIAL PANEL**  
  *Project:*  
  > *“Regroup: Form 3 panels of 6 (two trios merged).*  
  > *1. **ANONYMOUS SUBMISSION:** Each person submits their Stage 1 argument (no names).  
  > *2. **PANEL TASK:** As impartial judges, review all 6 arguments.*  
  > *3. **DECIDE:** Which *one* claimant deserves the heirloom? Why? Rules:  
  > — No ‘equal split’ compromises.  
  > — Base verdict solely on submitted arguments, not real-life identities.*”  
  - *Predictable Issue:* Panels may resist picking one; insist they must choose.  

  ---

  ### **Debrief Script (30 mins)**  
  *(Transition calmly; avoid Smithian terms until end)*  

  **Step 1: Elicit Reactions**  
  - “How did it feel arguing *for yourself* vs. judging others anonymously?”  
  - “Did anyone’s self-justification sound different when heard by outsiders?”  
  - “Panels: what made one claim ‘win’? Was it harder to be generous with others’ money?”  

  **Step 2: Map to Smith’s Framework**  
  > *“Today mirrored a core mechanism in moral psychology. When you wrote your initial claim, you were mired in **natural partiality** — your emotional stake made ‘fairness’ align with your desire.*  
  >  
  > *In trios, you sought **mutual sympathy**: trying to make others *feel* your position. But when your siblings (peers) resisted, you hit a wall — their self-interest blocked full sympathy.*  
  >  
  > *The panels replicated what Adam Smith called the **‘impartial spectator’**. By anonymising claims, you became detached observers. You consulted an imagined standard of fairness — not ‘what helps me’, but ‘what would a neutral party see as just’.*  
  >  
  > *Smith argues this spectator isn’t real, but *constructed* through social practice. Its ‘authority’ comes from stepping outside our biases. Like the panels, it’s *hard*: you had to dismiss five claims. But it felt more objective, yes? That’s the spectator’s corrective power — it arbitrates when sympathy fails.”*  

  **Step 3: Connect to Authority**  
  - “Why did the panel’s verdict *feel* weightier than your own argument? Smith says the impartial judge’s authority stems from its independence — it’s untainted by our ‘passions’. We internalise this standard to self-correct.”  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Problem:** Students treat it as role-play → **Fix:** Stress *“This isn’t acting — base arguments on your real instincts.”*  
  2. **Problem:** Panels deadlock → **Fix:** “As facilitator, I’ll cast a tie-breaker vote *based solely on the text*.”  
  3. **Problem:** Superficial arguments → **Fix:** Circulate during Stage 1, asking: *“Why would your siblings call this unfair?”*  
  4. **Problem:** Debrief abstracts the experience → **Fix:** Anchor discussion in specific panel decisions: *“Panel C, you chose Claim 4 — what *specific phrase* made it feel impartial?”*  

  ---

  ### **Honest Assessment: The Unreproducible Element**  
  **What the activity captures:**  
  - The *cognitive shift* from partial → impartial reasoning.  
  - The *authoritative weight* of the detached perspective.  
  - Smith’s idea that impartiality *emerges socially* (via mutual sympathy’s failure).  

  **What it misses (must be emphasised in debrief):**  
  Smith’s spectator is not just *neutral* but **sympathetically constructed**. The panel judges *coldly*; Smith’s spectator arises from *fellow-feeling*. Students experience detachment as *clinical*, whereas Smith’s spectator retains emotional resonance — it’s born of our desire for *shared moral sentiment*. Without this, it risks feeling like utilitarianism.  

  **Post-Activity Clarification:**  
  > *“Crucially, Smith’s spectator isn’t a robot. It’s forged through *sympathy* — we imagine what others feel *first*, then refine it into impartiality. Today, the panels skipped that warm-up. Smith would say true impartiality requires *emotional labour*: projecting into others’ lives, then stripping away our biases. Next week, we’ll see how he bridges sympathy and spectatorship.”*  

  ---  
  This structure ensures students viscerally grapple with partiality before naming the spectator, using ethical tension they’re incentivised to take seriously. The debrief explicitly links their frustration in trios to Smith’s account of sympathy’s limits, and the panel’s verdict to the spectator’s authority — preparing the ground for textual analysis.
