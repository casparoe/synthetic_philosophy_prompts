  Hmm, what's really at stake here? The user needs to defend against reductionism while avoiding dualist traps. Their supervisor's position implies that any talk of higher-level causation is just epistemic convenience - a stance that threatens the foundations of cognitive science. The workshop context suggests they need robust, contemporary arguments that withstand analytical scrutiny.

