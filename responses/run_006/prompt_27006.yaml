prompt: |-
  I'm a high school student, and something that happened in my family has me unsettled about the future. My dad drove a truck for 22 years. Last month his company started replacing drivers with self-driving trucks on several long-haul routes, and he's been told his position will be eliminated within two years. He's not just worried about money — he's devastated in a way that feels deeper. Driving was who he was. He took pride in navigating difficult routes, he had a community of other drivers he'd meet at stops, he had a rhythm to his days that gave his life structure. Now he sits around saying he's useless, and I don't know how to respond.

  My mom keeps telling him that automation is progress and he should just retrain for something else — she's been sending him links to coding bootcamps. And on one level she has a point: if the income can be replaced, what's the problem? But I can see that my dad's loss isn't just financial. It's like the work itself mattered to who he is in a way that a paycheck doesn't capture.

  I'm supposed to start applying to colleges soon and pick a career direction, and honestly this whole thing has made me freeze up. If any job can be automated away, what am I even aiming for? And is my mom right that work is ultimately just about earning money, so as long as you can earn a living some other way you haven't really lost anything important? Or is my dad's devastation telling us something real about what work means — something the "just retrain" advice completely misses?

  I'd like you to approach this as a philosopher who works on the meaning of work and automation. Please think through this carefully — maybe start by mapping out the different ways work can be meaningful in a person's life, beyond just providing income. Then use that framework to analyze what exactly my dad lost, and whether retraining actually addresses those losses. Finally, I want to know what all of this implies for someone my age trying to figure out what kind of work to pursue in a world where automation keeps advancing.
