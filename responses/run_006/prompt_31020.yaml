  *flips through imaginary Dennett texts* Right, the key is that free-floating rationales aren't things in the world but patterns in the evolutionary process that license intentional explanations. Like when we say a mantis's camouflage is "for" avoiding predators - we're not positing cosmic reasons, but noting a stable problem/solution dynamic. 

  *scratches head* The tricky bit is explaining why this isn't just causal description. Ah! Because it captures counterfactuals: if environmental pressures changed, different "reasons" would apply. That predictive power makes it more than redescription. 

