  Okay, the user is a high school student working on a 4,000-word research essay about the Mencius vs. Xunzi debate on human nature. They've got the basics down but need help narrowing their focus. They're juggling this with regular coursework and have three months, so efficiency is key. 

  First, I need to understand their actual needs. They're not just asking for topic suggestions—they want a prioritized list of high-impact sub-questions with clear justification. The ranking criteria matter as much as the topics themselves. They’re signaling academic maturity by rejecting a "survey approach" and demanding depth. 

  Hmm… their unspoken needs might include: 
