prompt: |-
  I'm a high school student preparing an extended research essay — roughly 4,000 words — on the debate between Mencius and Xunzi about human nature. I have about three months to work on it alongside my regular coursework, so I need to be selective about where I direct my effort. I have read enough to grasp the basic positions: Mencius holds that human nature (xing) is good, pointing to our spontaneous moral responses — for instance, the feeling of alarm at seeing a child about to fall into a well — and argues that self-cultivation consists in nurturing innate sprouts of virtue. Xunzi holds that human nature is bad, meaning that our raw impulses are self-interested and that goodness is an artificial achievement, imposed through ritual, law, and deliberate education. I also understand that the disagreement is not simply terminological, though it matters that they appear to define xing differently: Mencius takes xing to be what distinguishes humans from animals, while Xunzi takes it to be what is given prior to any cultural shaping.

  What I am less sure about is where to focus within this debate. Which two or three sub-questions or lines of argument are most worth developing in depth, and why? Please rank them and defend the ranking. By a sub-question I mean something like: whether Mencius and Xunzi are substantively disagreeing or merely using xing in different senses; whether findings from contemporary developmental psychology favor one position over the other; whether the debate has practical consequences for how we design educational institutions or legal systems; whether one side handles the problem of moral failure more convincingly; or some other candidate I have not yet identified.

  For each sub-question you select, I would like you to explain why it deserves my limited time more than the alternatives you considered and rejected — what makes it deeper, more tractable given my resources, or more consequential for the overall debate. Please also be explicit about the criteria you are using to produce the ranking (for example, philosophical depth, tractability for a high school researcher, relevance to the core disagreement, practical importance, or how many other questions depend on it) and about what trade-offs you are making between those criteria. I am less interested in a survey of the debate than in a defended judgment about where the highest-return work lies.
