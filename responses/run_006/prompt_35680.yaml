answer: |-
  Our thoughts reside in bone-encased retreat,
  Where neurons weave their bright electric song.
  The mind's true home: the skull's discreet conceit,
  A world contained where inward paths belong.
  To lift a limb or solve a subtle sum
  Requires no props beyond the flesh and bone.
  Common sense holds cognition's kingdom
  Is built by brain, and brain alone.

  But wait! See Otto, memory impaired,
  Whose notebook holds addresses he must know.
  It stands for him where failing cells despaired,
  A constant, needed part of his mind's flow.
  If mind extends where function finds its place,
  Beyond the skin, creating thinking-space,

  Then self and world begin to intermix,
  Negotiate the bounds cognition draws.
  The tools we trust, the habits that we fix,
  Become the mind itself, beyond old laws.
  No fuzzy edge, but active, shifting ground,
  Where coupled systems thought and world confound.

  So mark the mind, a leaky, wide embrace,
  Negotiating far beyond the spinal cord's old claim.
