  Hmm, this is a fascinating challenge from a programme officer at a philanthropic foundation. They're dealing with "Pascal's mugging" style proposals - interventions claiming tiny probabilities of enormous payoffs that dominate expected value calculations. The user needs a practical, step-by-step procedure to filter these, with three key requirements: it must be operable by non-philosophers in an afternoon, produce clear recommendations, and flag judgment calls transparently.

  The core tension here is between theoretical expected value maximisation (which these proposals exploit) and practical grantmaking wisdom. I need to design something that incorporates epistemic humility while avoiding paralysis. The procedure should probably include: probability sanity-checks, value inflation checks, independence assessments, and portfolio considerations.

  For the test cases: Proposal A (AI prevention) might pass scrutiny as it's in a credible domain (longtermism), though the valuation is tricky. Proposal B (income doubling) seems most plausible - concrete mechanism, modest claim. Proposal C (global meditation) should trigger discomfort - the probability is unfalsifiably small and the causal mechanism dubious.

  Important to build in "judgment call" flags at: probability plausibility assessments, value quantification challenges, and when rejecting EV-maximisation. The rejection of pure EV calculations needs to be explicit but not dogmatic - perhaps through dominance principles.

  The summary should capture that we're seeking "robustly plausible" impact rather than mathematically optimised fantasy. British English requirements mean vigilance for "-ise" spellings and avoiding Americanisms like "math".
answer: |-
  ## Pascal's Mugging Screening Protocol for Philanthropic Grants

  **Core Principles:** This procedure prioritises **robustly plausible impact** over highly uncertain, mathematically dominant expected value (EV) calculations vulnerable to Pascal's mugging. It focuses on **epistemic credibility**, **causal plausibility**, **independence**, and **portfolio fit**. Judgment calls are explicitly flagged.

  **Step-by-Step Procedure:**

  1.  **Initial EV Calculation & Flag:**
      *   Calculate the claimed EV: `EV = (Claimed Probability) x (Claimed Value)`.
      *   **Flag:** This is the mugging target. Acknowledge that *prima facie*, this EV may dominate other proposals. Proceed sceptically.

  2.  **Probability Plausibility Assessment (Judgment Call):**
      *   **Question:** Is the claimed probability based on a credible, falsifiable model or evidence (e.g., pilot data, established theory, robust forecasting)? Or is it essentially arbitrary/speculative?
      *   **Red Flags:** Probabilities derived solely from "needing" a high EV; unfalsifiable magnitudes (e.g., 10^-9); lack of clear mechanism linking intervention to outcome.
      *   **Action:**
          *   If **Implausible (Highly Speculative)**: Reject. **Flag:** Judgment call based on lack of credible probability estimation.
          *   If **Ambiguous/Weak**: Proceed to Step 3, noting significant doubt.
          *   If **Plausible (Credible Basis)**: Proceed to Step 3.

  3.  **Value Claim Assessment (Judgment Call):**
      *   **Question:** Is the claimed value astronomic *primarily* because it scales to an entire population/future (e.g., existential risk mitigation, global transformation)? Or is it a more direct, concrete outcome (e.g., doubling income in one country)?
      *   **Red Flags:** Valuations relying on extreme aggregation/discounting (e.g., valuing future lives at current $); valuations claiming to capture "infinite" utility; valuations detached from measurable outcomes.
      *   **Action:**
          *   If **Primarily Aggregated/Futuristic Value**: Apply a **Dominance Discount**. Assume a *much* lower ceiling value (e.g., no more than 10-100x the value of other major, concrete interventions in our portfolio) for evaluation purposes, due to extreme uncertainty in valuation and path dependence. **Flag:** Significant judgment call applying dominance discount to speculative aggregate/future value.
          *   If **Concrete, Direct Value**: Use the claimed value (with scrutiny on the calculation itself).

  4.  **Adjusted EV Calculation:**
      *   Recalculate EV using either:
          *   The original probability (if deemed plausible in Step 2) and the **Dominance Discounted Value** (if applied in Step 3).
          *   The original probability and value (if both passed Step 2 & 3 without discounting).
          *   **If probability was rejected in Step 2, stop. Reject.**

  5.  **Causal Mechanism & Tractability Check (Judgment Call):**
      *   **Question:** Is there a credible, step-by-step causal pathway linking *this specific intervention* to the claimed outcome? Does the proposal demonstrate why *this* approach is tractable where others fail? Is the intervention plausibly scalable to the required level?
      *   **Red Flags:** Vague or magical mechanisms; reliance on unprecedented social/technological leaps without evidence; scale mismatch (e.g., tiny NGO claiming global behavioural change).
      *   **Action:**
          *   If **Mechanism Weak/Implausible**: Reject. **Flag:** Judgment call based on implausible causal pathway/tractability.
          *   If **Mechanism Ambiguous**: Proceed, noting significant risk.
          *   If **Mechanism Plausible**: Proceed.

  6.  **Independence & Neglectedness Check:**
      *   **Question:** Is this outcome *only* addressable by this specific intervention? Is this area highly neglected by other funders (governments, major philanthropies)? Would our grant significantly increase the chance of success?
      *   **Action:** If the outcome is already heavily resourced elsewhere, or our grant adds negligible marginal value, lean towards rejection. If highly neglected and our grant is pivotal, strengthens the case.

  7.  **Portfolio Fit & Risk Assessment:**
      *   **Question:** Does funding this align with our foundation's mission and risk tolerance? Does it complement or excessively concentrate our portfolio? Even if plausibility is low, is the *potential* upside so unique it warrants a small, high-risk allocation?
      *   **Action:** Make final recommendation considering overall strategy. **Flag:** Mission/risk tolerance is a foundation-level judgment call.

  8.  **Final Recommendation:**
      *   **Reject:** If failed Steps 2, 3, or 5 decisively; if adjusted EV is unremarkable; if poor portfolio fit.
      *   **Further Due Diligence (Flag for Team):** If passed Steps 2 & 5 with reservations (Amber flags), or has strong neglectedness case, but needs deeper expert review on probability/mechanism.
      *   **Consider for Funding:** Only if passed Steps 2 & 5 with *strong* plausibility (Green flags), has a credible (even if dominance discounted) value proposition, strong neglectedness, and fits portfolio. **Extreme scrutiny still applies.**

  ---

  **Application to Hypothetical Proposals:**

  **Proposal A: AI X-risk Prevention (0.01% chance, $10^14 value)**
  1.  EV = 0.0001 * 10^14 = **$10^10 (Dominates portfolio prima facie).** *Flag: Mugging Target.*
  2.  **Probability Plausibility:** AI X-risk is a serious field; 0.01% (1 in 10,000) is within bounds of credible forecasts (e.g., MIRI, FLI surveys). **Amber Flag:** Highly uncertain, but not *inherently* implausible. *Proceed.*
  3.  **Value Claim:** Primarily aggregated/futuristic (value of future civilisation). **Apply Dominance Discount.** Assume ceiling value no higher than **$10^11** (e.g., equivalent to preventing a major war or pandemic). *Flag: Judgment call discounting speculative future value.*
  4.  **Adjusted EV:** 0.0001 * 10^11 = **$10^7**.
  5.  **Causal Mechanism:** *Highly dependent on proposal specifics.* If it's funding a specific technical safety agenda by credible researchers, **Plausible (Green Flag)**. If vague "AI ethics awareness", **Implausible (Reject)**. *Assume credible technical proposal for now.*
  6.  **Independence:** AI safety is relatively neglected vs. risk level. Our grant could be pivotal for a small team.
  7.  **Portfolio Fit:** Aligns with global health/speculative remit if framed as catastrophic risk.
  8.  **Recommendation:** **Proceed to Further Due Diligence.** High stakes, plausible probability & mechanism *for the field*, strong neglectedness. Adjusted EV is significant but not dominant. *Requires deep expert review on the specific project's plausibility.*

  **Proposal B: Double Income in LIC (0.1% chance, $10^10 value)**
  1.  EV = 0.001 * 10^10 = **$10^7.** *Flag: Mugging Target (less extreme).*
  2.  **Probability Plausibility:** 0.1% (1 in 1,000) is ambitious but potentially plausible for a novel, well-designed economic intervention with strong theory/pilots (e.g., targeted UBI, market access reform). **Plausible (Green Flag)** if evidence-based. *Proceed.*
  3.  **Value Claim:** Concrete, direct (aggregate national income increase). Scrutinise calculation ($10^10 for doubling income in a ~50m pop LIC? ~$200/person? Seems low - check assumptions!). **Use Claimed Value $10^10** (after verification). *No Dominance Discount needed.*
  4.  **Adjusted EV:** **$10^7**.
  5.  **Causal Mechanism:** Critical. Must show *how* the intervention directly causes doubling. Needs strong theory of change, evidence base, scalability plan. **Judgment Call:** Likely **Plausible (Green Flag)** for a serious econ research org, **Implausible** for a vague scheme.
  6.  **Independence:** Development funding is competitive, but novel interventions can be neglected.
  7.  **Portfolio Fit:** Strong fit for global health/education via poverty reduction.
  8.  **Recommendation:** **Strong Candidate for Funding Consideration.** High plausibility on probability and value, clear causal mechanism expected, concrete outcome. EV is solid. Proceed with standard due diligence.

  **Proposal C: World Peace via Meditation (10^-9 chance, $10^20 value)**
  1.  EV = 0.000000001 * 10^20 = **$10^11 (Dominates portfolio prima facie).** *Flag: Mugging Target.*
  2.  **Probability Plausibility:** 1 in a billion. Based on what? No credible model links mass meditation to lasting global peace; probability is essentially unfalsifiable and arbitrary. **Implausible (Red Flag).** *Reject.*
  3.  *(Stop - Failed Step 2)*
  4.  **Recommendation:** **REJECT** as Pascal's Mugging. *Flag:* Judgment call on probability being unfalsifiable and lacking any credible basis. Causal mechanism (Step 5) would also be deemed **Implausible (Red Flag)** if assessed. **THIS IS THE COMFORT-CHALLENGING ONE.** The maths looks compelling ($10^11 EV!), but the foundation team should feel *strongly* uncomfortable funding based on this. The procedure rejects it early on epistemic grounds (Step 2).

  ---

  **Core Principle Summary:** Prioritise interventions with robustly plausible pathways to impact over those relying on mathematically dominant but epistemically unsound combinations of minuscule probabilities and unfalsifiable, astronomical valuations.
