answer: |-
  Here are five numbered points diagnosing the stalemate in the category representation debate, using the letter 'a' example:

  1.  **Level Confusion:** The debate conflates *computational* (what function is performed—recognizing 'a'-ness across variation) and *implementational* (how brains physically realize it—neural patterns, circuits) levels of explanation; theories often talk past each other by focusing on different levels without specifying the necessary bridges between them.  
  2.  **Explanatory Target Ambiguity:** Disagreement persists partly because "explaining categorization" is underspecified—is the goal to model behavioral flexibility (prototypes/exemplars), find necessary/sufficient conditions (classical), account for learning and context (theory-theory), or describe neural encoding? No consensus exists on the *primary* explanandum.  
  3.  **Multiple Mechanism Coexistence:** The stalemate arises from assuming a single, monolithic mechanism; evidence suggests the brain likely uses *hybrid* strategies (e.g., rapid exemplar-like matching for familiar fonts *and* activated schema-like knowledge for degraded 'a's), making experiments favoring one model over others context-dependent and inconclusive for a grand theory.  
  4.  **"Category Representation" as a Misleading Reification:** Treating categories as static, stored mental *objects* (a prototype, a definition, exemplars) may be flawed; letter recognition is better modeled as a dynamic *process* of pattern completion, sensory-motor simulation, and prediction within a complex, distributed neural system shaped by statistical learning, resisting reduction to a single representational format.  
  5.  **Empirical Tools Lagging Behind Complexity:** Current methods (behavioral categorization tasks, basic neuroimaging) lack the spatiotemporal resolution and ecological validity to distinguish how low-level feature detection, mid-level perceptual grouping, high-level conceptual knowledge, and task demands *interact dynamically* in real-time recognition of highly variable instances like diverse 'a's, mirroring the pre-assay stalemate in biochemistry.
