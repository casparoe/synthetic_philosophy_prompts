  ### Residue Report: Mapping ECL to Standard Game Theory  
  **Clean Mappings (Direct analogs in your framework):**  
  1. **Type Correlation and Common Prior**: The identicality of Alice and Bob is cleanly captured by a common prior with perfectly correlated types ($\theta_A = \theta_B$). This is standard in Bayesian games (e.g., Harsanyi’s type spaces).  
  2. **Correlated Equilibrium**: The cooperative outcome maps to a correlated equilibrium where the correlating device is the players' common type. No fudging needed.  
  3. **Payoff Interdependence via Beliefs**: The belief that $a_A$ signals $a_B$ (due to type identity) is analogous to **cheap talk** or **pre-play communication** that aligns expectations.  

  **Stretched/Fudged Mappings (Requires conceptual leaps):**  
  1. **Conditioning on One's Own Action**:  
     - In standard game theory, players don’t "condition" on their own actions; they choose optimally given beliefs. ECL’s evidential step—where Alice uses $a_A$ to infer $\theta_A$ and thus $o_A$—is **stretched**. It smuggles in **evidential decision theory (EDT)** by treating the action as evidence about the state.  
     - *Fudge*: We simulate this by making actions type-determined (so choosing $a_A$ reveals $\theta_A$), but this removes agency—players don’t "choose" actions; types dictate them. In true ECL, agents have free choice but use it as evidence.  

  2. **Acausal Correlation as Exogenous Correlation Device**:  
     - The correlation between $\theta_A$ and $o_A$ (e.g., cooperators face nicer opponents) is exogenously assumed. This mirrors a **correlating device**, but ECL treats it as a universal prior about "similar worlds."  
     - *Stretch*: Standard mechanism design uses devices as exogenous constructs (e.g., a mediator), but ECL’s "large worlds" justify it via anthropic/ logical uncertainty—e.g., "I’m probably in a world where my type matches my environment."  

  **No Counterpart (Gaps in your framework):**  
  1. **No Shared World/No Causality**:  
     - ECL assumes agents don’t share a universe and can’t affect each other causally. Your framework implicitly assumes a shared game (players interact within the same rules). ECL’s "separate worlds" lack even counterfactual dependence, so payoffs are independent.  
     - *Gap*: Standard equilibrium concepts (Nash, correlated) rely on *strategic interdependence* (my payoff depends on your action). In ECL, Alice’s payoff doesn’t depend on Bob’s action; it depends on her *belief* about Bob, which comes from type correlation. This is belief-mediated "pseudo-interdependence."  

  2. **Uncertainty Over Decision Algorithms**:  
     - ECL often implies agents are uncertain about their *own* decision rules or the "algorithm" of their copies (e.g., "Am I the type who cooperates?"). Your framework assumes players know their types/strategies.  
     - *Gap*: This is closer to **zero-knowledge proofs** or **program equilibrium** in CS, but game theory lacks tools for "introspective uncertainty" about one’s own rationality.  

  3. **Evidential vs. Causal Reasoning**:  
     - ECL’s core move—cooperating because it *signals* a favorable world—is fundamentally **evidential**. Your toolbox is **causal**; players best-respond to beliefs about others, but don’t update beliefs based on their own actions.  
     - *Gap*: ECL requires embedding EDT into game theory, where actions provide evidence about unobservables (e.g., $\theta_A \rightarrow o_A$). No mainstream solution concept does this.  

