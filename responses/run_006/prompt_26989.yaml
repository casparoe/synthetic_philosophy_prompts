  In the case where a and o are independent, then P(o|a) = P(o) and the agent chooses a to maximize E[u(a,o)] without conditioning. Then there is no evidential effect.

  But if a and o are correlated (because the world is such that cooperative agents tend to face cooperative opponents), then conditioning on a provides information about o.

  ## Step 2: Residue Report

  ### Clean Mappings

  1. **Common Prior**: The concept of a common prior over the state of the world (which includes the actions of all players) is central in Bayesian games and is used here.
     
  2. **Correlation between Actions**: The idea that actions might be correlated due to the common prior is similar to correlated equilibrium. However, note that in correlated equilibrium, the correlation is through a signal from a device, and the players condition on their signal. In ECL, the agent conditions on her own action. This is similar to the concept of self-signaling in decision theory.

  3. **Symmetric Games and Symmetric Equilibria**: The symmetry in the setup (identical clones) maps to symmetric Bayesian games and the focus on symmetric equilibria.

  ### Stretched or Fudged Mappings

  1. **Conditioning on One's Own Action**: In standard game theory, players do not condition on their own actions because they choose them. The idea of updating beliefs based on one's own action is more from evidential decision theory (EDT) than from causal decision theory (CDT) or game theory. Game theory typically assumes that players choose actions to maximize expected utility given their beliefs, and beliefs are updated only on observations (which do not include one's own action, because the action is chosen after the update). Therefore, this conditioning is a stretch.

     We can force it into the Bayesian game framework by considering the action as part of the signal. But then the correlating device would have to include the action in the signal, which is circular.

     Alternatively, we can think of the agent as having multiple "types" that correspond to different actions, but then the type would determine the action and the agent would condition on the type. This is the standard way: in a Bayesian game, a player's type determines her action (via her strategy). Then the player conditions on her type and chooses an action. In ECL, the agent does not have a type in the usual sense; instead, she conditions on the action she is about to take. 

     We can simulate this by defining the type to be the same as the action? But then the type space would have two types: type C and type D, and each type plays C and D respectively. Then the prior over types (and over the state o) is given. The agent, being type a, conditions on her type and gets the payoff u(a, o). But then she doesn't choose the action; it is fixed by the type. So there is no choice. This is not a decision problem.

     Therefore, the conditioning on one's own action does not have a clean analog in standard game theory. It is more a feature of EDT.

  2. **Causal Disconnect**: The fact that the players are in separate universes and do not causally influence each other is handled by the independence of the payoff functions. This is clean: the payoff of an agent depends only on her own action and her own opponent's action. However, the evidential argument relies on the correlation between the agent's action and the opponent's action in her own universe. This correlation is exogenous and due to the prior.

  ### No Counterpart

  1. **Uncertainty about One's Own Decision Algorithm**: In ECL, the "Large Worlds" idea often involves uncertainty about the entire decision setup, including the agent's own algorithm. This is not typically modeled in standard game theory, where the decision rule is fixed and known. Game theory assumes that the players are rational and that this is common knowledge. In ECL, the agent is uncertain about what decision she will make because she is uncertain about the world state, which includes the decision algorithm? This is a meta-uncertainty that standard game theory does not address.

  2. **Acausal Trade**: The extension to trade between agents in separate worlds is even more speculative. It relies on the idea that if I decide to send resources to a copy in another universe, then that copy will also decide to send resources to me, because we are identical. But since there is no causal link, this is purely evidential. In game theory, this would be like a coordination game with no possibility of communication. But without the evidential conditioning, it would be impossible to coordinate. The standard game-theoretic solution would be to use a correlating device, but in acausal trade, there is no device. The correlation comes from the symmetry.

     However, we can model this as a coordination game with symmetric equilibria. The agents coordinate on the good equilibrium because they are symmetric. But then the residue is the same as above: conditioning on one's own action.

  ## Step 3: Analysis of the Conceptual Gap

  There is a genuine conceptual gap. The gap arises because:

  1. **Evidential vs. Causal Reasoning**: Standard game theory (and mechanism design) uses causal reasoning. Players choose actions to cause outcomes. In ECL, the reasoning is evidential: an action is evidence about the state of the world. This distinction is highlighted by the conditioning on one's own action.

  2. **Uncertainty about Decision-Making**: ECL often includes uncertainty about the decision-making process itself, which is not part of standard game theory. In game theory, the players are rational and know the game and the rationality of others. In ECL, the agents are uncertain about the world in a way that includes uncertainty about how they will decide.

  Whose problem is it?

  - **If the claim is that ECL is a new form of cooperation that cannot be captured by correlated equilibrium**: Then it is partly true because correlated equilibrium requires a correlating device and does not involve conditioning on one's own action. The evidential reasoning in ECL is different.

  - **However, the essence of the cooperation in the symmetric case (choosing the good equilibrium) can be captured by the idea of focal points or by the fact that in symmetric games, players can coordinate on the Pareto-superior equilibrium.** But this coordination does not require evidential reasoning; it is a standard solution concept.

  - **The extension to non-symmetric settings and to acausal trade is less clear.** The evidential argument for cooperation in the presence of correlation between the agent's action and the state of the world (including the opponent's action) is a valid decision-theoretic argument under EDT. But it is not part of standard game theory because game theory typically uses causal reasoning.

  Therefore, the gap is more in the decision-theoretic foundation than in the game-theoretic framework per se. Game theory can be extended to include evidential reasoning, but it would require a departure from the standard expected utility maximization based on causal effects.

  ## Conclusion

  ECL is not just reinventing correlated equilibrium. It is using a different decision theory (evidential) that allows conditioning on one's own action to update beliefs about the world. This is not part of the standard toolbox. The residue includes:

  - Clean mappings: common prior, correlation, symmetry.
  - Stretched: conditioning on one's own action (simulated by type conditioning but without the choice).
  - No counterpart: uncertainty about one's own decision algorithm and acausal trade without any communication device.

  The gap is genuine. It is a problem for the standard framework if we want to capture evidential reasoning. However, the standard framework (using causal reasoning) might be extended to incorporate these ideas by explicitly modeling the decision process as part of the state and allowing for self-referential beliefs. Alternatively, one might argue that evidential reasoning is not necessary and that causal decision theory is sufficient, but then the ECL examples would not lead to cooperation.

  In the end, the economist's framework is missing the evidential decision theory component. Whether that component is philosophically and practically sound is a separate debate.
answer: |-
  ### Restating Evidential Cooperation in Large Worlds (ECL) in Game-Theoretic Terms  
  The core ECL argument—where agents cooperate with "copies" of themselves in causally disconnected worlds because their decision provides evidence about the copies' actions—can be mapped to your framework using **Bayesian games with type-correlation and self-signaling strategies**. I'll use the canonical ECL example: two identical rational agents (Alice and Bob) in separate universes, each playing a Prisoner's Dilemma (PD) against a local opponent. Their payoffs depend *only* on their local interaction, but they know they are identical to each other.  

  #### Step-by-Step Translation:  
  1. **Game Structure as a Bayesian Game**:  
     - **Players**: Alice (A) and Bob (B).  
     - **Types**: Each player has a type defining their *disposition to cooperate*. The type space is binary: $\theta_i \in \{ \text{Cooperator}, \text{Defector} \}$ for $i \in \{A, B\}$.  
     - **Common Prior**: The prior belief is that Alice and Bob have *identical types* due to symmetry (i.e., $\theta_A = \theta_B$). This is common knowledge. The prior distribution $P(\theta_A, \theta_B)$ places positive probability only on type profiles $(\text{Coop}, \text{Coop})$ or $(\text{Defect}, \text{Defect})$.  
     - **Actions**: Each player chooses $a_i \in \{ C, D \}$ in their local PD.  
     - **Payoffs**: For Alice, $u_A(a_A, o_A)$ depends *only* on her action $a_A$ and her local opponent's action $o_A$ (similarly for Bob). Crucially, $o_A$ and $o_B$ are determined by exogenous factors (e.g., nature or fixed opponent strategies).  

  2. **Type Correlation and Evidential Reasoning**:  
     - Alice knows that her type $\theta_A$ is identical to Bob's type $\theta_B$ (common prior enforces $\theta_A = \theta_B$).  
     - Alice also knows that her action $a_A$ is determined by her type: $\text{Cooperator}$ types always play $C$, $\text{Defector}$ types always play $D$. Thus, her action *signals* her type.  
     - When Alice chooses $a_A = C$, she infers $\theta_A = \text{Cooperator}$, which implies $\theta_B = \text{Cooperator}$, and thus $a_B = C$.  
     - **Key twist**: Alice's local opponent's action $o_A$ is *correlated* with her type $\theta_A$ in the prior. For example:  
       - If $\theta_A = \text{Cooperator}$, then $P(o_A = C \mid \theta_A) = 0.9$.  
       - If $\theta_A = \text{Defector}$, then $P(o_A = C \mid \theta_A) = 0.1$.  
       This correlation arises because the "world" (including opponents) is assumed similar across universes—e.g., cooperative agents tend to face cooperative opponents.  

  3. **Decision as Self-Signaling**:  
     Alice computes expected utility conditional on her action:  
     - If she chooses $C$, she infers $\theta_A = \text{Cooperator}$, so:  
       \[
       \mathbb{E}[u_A \mid a_A = C] = u_A(C, o_A) \cdot P(o_A = C \mid \theta_A = \text{Cooperator}) + \cdots
       \]  
       High $P(o_A = C \mid \theta_A = \text{Cooperator})$ implies high expected payoff.  
     - If she chooses $D$, she infers $\theta_A = \text{Defector}$, so:  
       \[
       \mathbb{E}[u_A \mid a_A = D] = u_A(D, o_A) \cdot P(o_A = C \mid \theta_A = \text{Defector}) + \cdots
       \]  
       Low $P(o_A = C \mid \theta_A = \text{Defector})$ implies low expected payoff.  
     Thus, $C$ yields higher expected utility *because* conditioning on $a_A = C$ updates beliefs about $\theta_A$, which updates beliefs about $o_A$ (due to prior correlation).  

  4. **Equilibrium Interpretation as Correlated Equilibrium with Self-Play**:  
     - The outcome $(a_A = C, a_B = C)$ is a **correlated equilibrium** under a "self-play" correlating device: the device draws $\theta_A = \theta_B$ from the prior, and both players obey their type-determined actions.  
     - Alice cooperates because deviating to $D$ would require her to be a $\text{Defector}$ type, which lowers $\mathbb{E}[u_A \mid a_A = D]$ via the correlation between $\theta_A$ and $o_A$.  

  In your terms: **ECL is a Bayesian game where identical types enforce symmetric actions, and the correlation between types and opponent behavior makes cooperation a self-signaling strategy**. The "acausal" aspect is the type correlation ($\theta_A = \theta_B$), which substitutes for direct causal interaction.  

