answer: |-
  1. Suppose every red object in the universe vanishes, and all minds forget the concept of red. Does "redness" still exist?  
     A. Yes—universals exist independently of both minds and physical objects.  
     B. No—universals only exist when there are particular things that embody them.  
     C. No—properties are just concepts we create, so without minds, they vanish.  
     D. No—and "redness" was never real; we merely group similar things.  

  2. Two apples are identical in color. What makes both "red"?  
     A. They both participate in the same abstract universal.  
     B. They objectively resemble each other.  
     C. Each has its own unique red property, and these properties are similar.  
     D. We mentally classify them under the same concept.  

  3. Where is justice located?  
     A. Outside space and time—in a realm of pure Forms.  
     B. In just actions and people—it exists when embodied in particulars.  
     C. Only in the mind—it’s a concept we project onto actions.  
     D. Nowhere—it’s not a real entity; we only use the word for similar behaviors.  

  4. A leaf changes from green to red. What changed?  
     A. It stopped instantiating the universal "green" and started instantiating "red."  
     B. It lost the universal greenness and gained the universal redness.  
     C. It lost its green trope and gained a new red trope.  
     D. We now apply the concept "red" instead of "green" due to altered resemblances.  

  5. The roundness of one ball and the roundness of another ball are:  
     A. The same universal present in both.  
     B. Two distinct properties that happen to resemble each other.  
     C. Not properties at all—the balls just share concrete similarities.  
     D. Concepts we impose on distinct objects.  

  ---

  **Scoring Key**  
  *(Match answers 1–5 to positions)*  

  - **Platonic realism**: 1A, 2A, 3A, 4A, 5A  
    *(Universals exist independently in a non-physical realm; particulars "participate" in them.)*  
  - **Aristotelian realism**: 1B, 2A, 3B, 4B, 5A  
    *(Universals exist but only when instantiated in particulars; they are not separate.)*  
  - **Resemblance nominalism**: 1D, 2B, 3D, 4D, 5C  
    *(No universals; objects grouped by objective resemblances; properties aren’t real entities.)*  
  - **Trope theory**: 1D, 2C, 3D, 4C, 5B  
    *(Properties are particular instances (tropes); similarity between tropes is fundamental.)*  
  - **Conceptualism**: 1C, 2D, 3C, 4D, 5D  
    *(Universals are mind-dependent concepts; grouping is based on mental acts.)*  

  **Notes**:  
  - **Aristotelian vs. Platonic realism** share answers to Q2 and Q5 (both 2A and 5A). To split them, add:  
    *"Can universals exist without any instances?"*  
    - **Platonic**: Yes (separate realm).  
    - **Aristotelian**: No (require particulars).  
  - **Unmatched patterns** (e.g., 1A,2B,3A,4A,5A) imply inconsistent commitments:  
    - Platonic realism (1A,3A) clashes with resemblance-based views (2B).  
    - Trope theory (2C,5B) conflicts with universal-based answers (1A,5A).  
  - **Q4D ambiguity**: Resemblance nominalism and conceptualism both choose 4D, but they split on Q2 (B vs. D) and Q3 (D vs. C).
