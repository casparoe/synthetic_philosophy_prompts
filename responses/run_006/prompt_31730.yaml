answer: |-
  Anscombe's distinction hinges on **intentionality vs. foresight** within the Principle of Double Effect (PDE). Her core argument is that murder requires the *intentional* killing of the innocent as a *means* or as an *end-in-itself*.

  1.  **"Choosing to kill the innocent as a means" (Always Murder):**
      *   Here, the death of the innocent is *part of your plan* to achieve the goal. You need their death to happen for your end to succeed.
      *   **Example (Truman, per Anscombe):** Dropping atomic bombs on cities *intended* the mass death of civilians *as the direct mechanism* to terrorize Japan into surrender. Their deaths weren't just a side-effect; they were the chosen *instrument* of policy.

  2.  **"Killing the innocent... as a matter of statistical certainty" (Not Necessarily Murder):**
      *   Here, the death is a *foreseen but unintended side-effect* of an action aimed at a legitimate good. You proceed *despite knowing* the deaths will likely occur, but you do not *choose* or *rely on* those deaths to achieve your primary goal.
      *   **Example (Classic PDE):** Bombing a legitimate military factory during wartime, knowing nearby civilian workers will likely die. The *intended* act is destroying the factory to weaken the enemy. The civilian deaths are foreseen but not desired or used as a means – the factory's destruction would be just as effective if civilians weren't present.

  **The Crucial Role of "Unscrupulousness":**
  *   **Unscrupulousness in considering possibilities** means failing to rigorously examine alternatives or *deliberately avoiding* thinking about ways to minimize foreseeable harm to the innocent.
  *   **Why it "turns it into murder":** This negligence demonstrates a *practical willingness* to treat the innocent as expendable. If you skip searching for less harmful options (e.g., a different bombing time, precision targeting, ground assault, negotiation) or refuse to weigh the proportionality of the harm against the good, it reveals that you *are*, in effect, *choosing* to inflict the foreseeable deaths as part of your plan. Your lack of due care implies acceptance of their deaths as a necessary cost – making it functionally equivalent to using them as a means.

  **In short:** For Anscombe, *murder* requires *intending* innocent death as a tool. *Foreseeing* death as a side-effect isn't murder *if* the act is legitimate, the deaths aren't intended, and you scrupulously try to avoid/minimize them. Unscrupulousness collapses this distinction by showing disregard equivalent to intentional use. Truman, she argues, intended civilian deaths as a means.
