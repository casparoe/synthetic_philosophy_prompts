  The confusion makes sense. If you bomb a city knowing kids will die, how isn't that intentional? Here's where double effect reasoning kicks in: it's about whether death is part of your goal (like Truman wanting civilian terror to force surrender) versus merely predictable fallout (like destroying a munitions factory knowing workers might die). 

  The unscrupulousness clause is crucial too. If you skip evaluating alternatives to minimize harm - say, not considering precision bombing instead of nukes - that negligence morphs foreseeable death into de facto intent. That's why Anscombe calls it murder. 

