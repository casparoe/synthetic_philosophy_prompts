  5. Debrief (35 minutes)

  Alternative: To save time, we can skip the physical building and do a digital building exercise? But the physical aspect makes it more engaging and the tampering more obvious when they submit a digital image.

  Alternatively, we can have a very simple building task that is trivial to build, so that they don't bother tampering? Then we don't get the behavior. We want the building to be hard enough that tampering is tempting.

