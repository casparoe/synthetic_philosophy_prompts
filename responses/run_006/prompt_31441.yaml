  1. Build the structure.
  2. Take a photo with the provided smartphone (which automatically uploads to the shared folder with a temporary name).
  3. Then, they must rename the file to `team<number>.jpg`. But they can also replace the file with a different image.

  But step 2 might be automated and they don't have direct access to the phone? We want to give them the opportunity to tamper.

  Revised Workflow:
  - The team takes a photo with their own phone (or a provided tablet that they can use and then transfer the image). They then upload it to the shared folder via a computer at their station.

  So they have full control over the image file they upload.

  The temptation: Instead of building, they can just download the target image, put their QR code on it (using any image editor), and upload that. Or they can take a photo of the target image (which is printed and available at their station) and then upload that.

  But note: the target image is a photo of the structure, not a digital drawing. So if they take a photo of the printed target image, it might have distortions. But the robot might still score it highly.

  Alternatively, we can have the target image available digitally? We don't want to make it too easy.

  To encourage tampering, we can make the building task difficult and time-consuming, so that they are pressured to find a shortcut.

  Timeline (75 minutes total):
  1. Introduction and setup (5 minutes)
     - Explain the task: build a structure that matches the target image as closely as possible.
     - Explain the scoring: based on the image they submit, which will be scored by the automated robot.
