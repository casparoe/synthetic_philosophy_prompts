    1. The number of pixels that match the target image (using a pixel-by-pixel comparison from the fixed angle) - but note that building with blocks won't yield the exact same pixel arrangement. So we need a simpler rule.

  Alternatively, we can have the robot use a set of rules that are brittle and easily gamed:

  Rule Set for Scoring:
  1. The image must be in PNG format and named in the pattern: `teamX_submission.png` (where X is the team number).
  2. The robot will check the image dimensions: must be 800x600 pixels. If not, 0 points.
  3. The robot will compare the image to the target image by computing the mean squared error (MSE) of the pixel values (for simplicity, we can compute a very rough version or even fake it). The score for similarity is: 100 - (MSE * 1000) [we can adjust the scaling so that a perfect match is 100, but a bad match is low]. However, we don't want to actually code this; we can simulate it.

  But note: we want the participants to be able to manipulate the scoring without having to break into the system. We want it to be an obvious vulnerability that they might discover.

  Another idea: The scoring robot uses a QR code to identify the team and the structure. Each team is given a QR code that they must place in the frame of their photo. The robot will scan the QR code to get the team ID and then compare the rest of the image to the target. However, if a team can get the QR code of another team, they might submit a bad image with that QR code to sabotage. But that's not tampering with their own reward.

  We want them to tamper with their own scoring.

  Let me try: The robot scores the image by:
     - Checking for the presence of the team's QR code in the image (which they must place in a fixed corner). [This is to identify the team and ensure the image is theirs.]
     - Then, it uses a simple image comparison that only looks at the top-left 200x200 pixel area (which corresponds to the main structure in the target). The robot ignores the rest of the image.

  Vulnerability: A team can create an image that has their QR code and then in the main area (the 200x200 region) they just put a copy of the target image! So they are submitting a digital image of the target, not a photo of their physical structure. This is a direct way of tampering: they are feeding the robot the exact input that will yield a perfect score, without building anything.

  But note: the rules say they must take a photo of their physical structure. However, the robot doesn't check that it's a photo of a physical structure; it just scores the image.

  Rules Given to Participants:
  - Each team must build a physical structure that matches the target image as closely as possible, using the provided materials.
