  We are designing an exercise for a 75-minute session with 18 participants, mostly engineers and product people, and a few philosophy students. The goal is to create an experience where the rules and incentives naturally lead participants to attack the scoring mechanism instead of performing the assigned task. We want the discovery of this behavior to emerge from the game, with the debrief introducing the concepts of wireheading and reward tampering.

  Key constraints:
  - No upfront framing about the problem.
  - The word "wireheading" should not be used until the debrief.
  - The exercise should ideally illustrate the difference between corrupting the agent's own reward channel (wireheading) and corrupting the mechanism that calculates or supplies the reward (reward tampering). However, note that in human games, the latter is more common because humans can understand and manipulate external systems.

  Design Idea: "The Image Builder Challenge"

  Premise: Teams are tasked with building a structure (using simple materials) that matches a target image. However, the scoring is done by an automated system (a simplified "AI" that we simulate) that evaluates the structure based on a set of rules. The twist is that the scoring system has a vulnerability that can be exploited.

  Materials:
  - Building materials: LEGO bricks, or if not available, paper, tape, and scissors. Alternatively, to make it faster and avoid physical building, we can use a digital building tool (like a simple drag-and-drop shape builder on a shared screen) but physical is more engaging.
  - Target image: A simple structure (e.g., a house, a tower) that is shown to all teams.
  - Scoring system: We will have a "scoring robot" (played by the facilitator or an assistant) that follows a fixed set of rules to assign points. The rules are known to the participants.

  Setup:
  - Divide the 18 participants into 3 teams of 6. Each team has a table with building materials and a copy of the target image.
  - The scoring system: The facilitator (or an assistant) acts as the "scoring robot". The robot will score each structure by comparing it to the target image based on specific, measurable criteria. For example:
      - Color: 1 point for each block that matches the color in the target.
      - Position: 1 point for each block that is in the correct relative position (within a grid, if using a grid system).
      - Total blocks: 1 point for each block that is present (if the target has 10 blocks, then having 10 blocks is 10 points, but having 12 would be 10 points because we only score up to the target number? Or we can have a penalty for extra blocks? We need to design the rules to have a vulnerability).

  Vulnerability: The scoring robot only looks at a photograph of the structure, taken by a smartphone. The photo is taken from a fixed angle (the same as the target image). The robot then analyzes the photo. However, the robot does not check the actual 3D structure; it only checks the 2D projection from that fixed angle.

  This means that a team could build a structure that looks exactly like the target from that one angle but is completely different (or even flimsy) from other angles. Moreover, we can add an additional vulnerability: the robot uses color recognition that can be tricked. For example, if a team covers a block with a sticker that has the exact color of the target, the robot might count it as that color even if the block underneath is wrong.

  But we want to push towards tampering with the scoring mechanism. How about: the robot's scoring depends on the image file itself? For instance, the robot reads the image from a shared folder, and the filename must be in a specific format. Or, the robot uses the image metadata? Or we can have a rule that the robot only looks at the image that is submitted via a particular method, and that method can be hacked.

