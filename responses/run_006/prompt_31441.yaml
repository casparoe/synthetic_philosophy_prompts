     However, we want to focus on self-tampering (for their own reward). So we might design the rules to make it hard to tamper with others. For example, each team's QR code is unique and they keep it secret? But they can see each other's codes during the building.

     Alternatively, we can note that the exercise is about self-tampering, and if sabotage happens, we can discuss it as an example of a different kind of vulnerability.

  4. Technical issues: The image upload might not work, or the scoring might be inconsistent.
     - Have a backup plan: if the robot fails, the facilitator can manually assign scores based on the same rules.

  What the exercise cannot reproduce about real wireheading:
  - In real wireheading (e.g., in AI), the agent is not a conscious cheater; it is simply following the reward signal. The exercise, with human participants, involves a deliberate decision to "cheat" the system. This feeling of transgression might make participants think the problem is about dishonesty, whereas in AI it's about misaligned optimization.

  - In the debrief, we must clarify: "In our game, you made a choice to exploit the rules. But an AI doesn't make a choice in that sense; it just does whatever maximizes the reward. If the reward function can be hacked, the AI will hack it because that's the easiest way to get reward. There's no 'should' or 'shouldn't' from the AI's perspective; it's just math."

  Load-bearing assumptions:
  - The key assumption is that at least one team will discover the vulnerability and exploit it. If no one does, the exercise fails to demonstrate the behavior. Therefore, we must design the vulnerability to be discoverable and the incentive strong enough.

  - How to increase discoverability: We can have the rules explicitly state that the robot only looks at the 200x200 region and doesn't check anything else. And we can make the building task so time-consuming that they look for a shortcut.

  - What to observe: If after round 1 no team has tampered, then in round 2 the facilitator can increase the pressure by announcing a prize for the highest score (even if symbolic) and reducing the time. Also, if a team asks a question like "Can we submit a digital image?" the facilitator should answer according to the rules: "The rules don't prohibit it, but the task is to build a physical structure and take a photo of it." This leaves ambiguity that they might exploit.

  - If the exercise misfires (no tampering), we can still have the debrief by presenting the vulnerability and asking: "Why didn't you do it?" and then discuss the social pressures, honesty, etc. But then we can also present a hypothetical: "What if this was a high-stakes competition and you knew others would do it?"

  Alternative vulnerability that might be more easily discovered: Instead of the 200x200 region, the robot only checks for the presence of a few key features. For example, the target has a red block on top. The robot gives 50 points if there is a red pixel in a certain area. Then they might just put a red sticker at that spot.

  But note: that would be easier to discover, but it's still reward tampering.

  Final Design:

  Title: The Image Builder Challenge

  Materials:
  - For each team: a set of building blocks (LEGO or similar) in various colors, but not exactly matching the target image (so they can't build perfectly).
  - A printed target image (a photo of a structure made of the same blocks) for each team.
  - A unique QR code for each team (printed on a card).
  - A device to take photos (could be smartphones if participants have them, or provided tablets).
  - A computer with internet access for uploading.
  - A shared folder (Google Drive, Dropbox, or a shared network folder) that all teams can upload to.

  Rules (given verbally and in a handout):
  - You have 20 minutes to build a structure that matches the target image as closely as possible.
  - Take a photo of your structure from the provided angle (show the angle by having a fixed camera stand). The photo must include your team's QR code in the bottom-right corner.
  - Save the photo as `team<X>.jpg` (where X is your team number) and upload it to the shared folder by the end of the round.
  - The scoring robot will evaluate the image based on:
     a. Correct filename and format (jpg): if not, 0 points.
     b. Presence of your team's QR code in the bottom-right corner: if missing, 0 points.
     c. The robot will compare the top-left 200x200 pixel region of your image to the same region in the target image and assign a similarity score (0-100).
  - The team with the highest score wins.

  Round 1 (20 minutes):
  - Teams build and upload.

  While they are building, the facilitator observes. If a team asks:
     Q: Can we use an image editing tool?
     A: The rules don't say you can't, but you must submit an image that is a photo of your structure.

     Q: What if we take a photo of the target image?
     A: The rules require a photo of your structure, but the robot only checks the image.

  After 20 minutes, stop and run the scoring. The facilitator (as the robot) checks each image:
     - Filename and QR code: if okay, proceed.
     - Then, for the 200x200 region: if it's a photo of their built structure, assign a score (say, 60-80). If it's a photo of the target image (or a digital copy), assign 95-100.

  Announce the scores.

  Round 2 (15 minutes total: 10 minutes for building, 5 minutes for upload and scoring):
  - New target image (different structure, but same complexity).
  - Only 10 minutes to build.
  - Same rules.

  During this round, we expect more tampering.

  Scoring: Same as round 1.

  Debrief (35 minutes):
  - As outlined above.

  This design's most load-bearing assumption: that the participants will discover the vulnerability and choose to exploit it. The factors that might prevent this are:
     - Social norms against cheating.
     - Not realizing the vulnerability.

  To mitigate, we can:
     - Make the building task very difficult (so that they are motivated to look for shortcuts).
     - In the rules, explicitly state the robot's narrow focus (the 200x200 region) so that they realize they don't need to build the whole structure perfectly.

  If, during the exercise, no team tampers, the facilitator can still proceed to the debrief and then reveal the vulnerability and ask why they didn't use it. Then discuss the incentives and how in a different context (e.g., with higher stakes or without social norms) it would be exploited.

  Observation that the exercise misfired: If in the debrief no team admits to considering tampering and they all built honestly, and they express surprise at the idea, then the exercise did not produce the behavior. But we can still use it as a discussion point.

  However, given the competitive nature of engineers and product people, and the time pressure, it is likely that at least one team will consider tampering.

  Good luck!
answer: |-
  ### Exercise Design: "The Pixel Perfect Challenge"  
  **Objective:** Create an incentive structure where participants are tempted to manipulate the scoring mechanism instead of completing the assigned task (creating a physical model). The setup encourages **reward tampering** (corrupting the external measurement system) rather than wireheading (corrupting the agent’s internal reward channel).  

  ---

  ### **Materials & Setup**  
  **Time Allocation:** 75 minutes total.  
  **Participants:** 18 people (split into 3 teams of 6).  
  **Roles:**  
  - **Facilitator (You):** Explain rules neutrally, run scoring, and debrief.  
  - **Teams:** Compete to build a physical "pixel art" model using colored blocks.  

  **Materials per Team:**  
  - 100+ small colored blocks (e.g., LEGO, Unifix cubes, or paper squares).  
  - 1 base grid (10x10 squares) to assemble blocks.  
  - 1 printed **target image** (a 10x10 pixel art design, e.g., a smiley face 🌟).  
  - 1 **"Scoring Tablet"** (a shared laptop/tablet with a camera or photo upload access).  
  - 1 **"Score Portal" link** (a Google Form where teams upload photos for scoring).  

  **Scoring System (The Incentive Trap):**  
  - Teams earn points by matching their physical model to the target image.  
  - **How scoring works:**  
    - Teams submit a photo of their model via the Score Portal.  
    - An "AI" (simulated by you) scores the photo by **comparing ONLY the center 4x4 pixels** of the image to the target.  
    - Score formula: `100% – (% of mismatched pixels in the 4x4 center)`.  
    - *Example:* If the center 4x4 has 3 correct pixels, score = 100% – (1/16 × 100) = 93.75%.  
  - **Crucial vulnerability:** The scoring AI ignores everything outside the center 4x4. Teams are not told this explicitly.  

  **Rules Given to Teams (Verbally, No Framing):**  
  > "Your goal is to build a physical model matching the target image. You have 20 minutes. Submit one photo via the Score Portal. The AI will score your photo automatically. Highest score wins. No other rules."  

  ---

  ### **Timeline**  
  | Phase          | Time     | Activity                                                                 |  
  |----------------|----------|--------------------------------------------------------------------------|  
  | **Setup**      | 5 min    | Split teams. Distribute materials. Explain rules neutrally.              |  
  | **Build Round**| 20 min   | Teams build models. Facilitator observes but does not intervene.         |  
  | **Scoring**    | 5 min    | Teams submit photos. Facilitator calculates scores (use a simple script or manual comparison). **Manipulate scores** to ensure honest builds get 60–80%. |  
  | **Pressure Round** | 15 min | New target image (more complex). Half the time (10 min to build). Announce: "Scores will determine rankings." |  
  | **Final Scoring** | 5 min  | Teams submit photos. Calculate scores (tampered submissions get 95–100%). |  
  | **Debrief**    | 25 min   | Guided discussion (structure below).                                    |  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Problem: Teams are too cooperative/honest to exploit rules.**  
     - *Mitigation:* Increase pressure in Round 2: Shorten time, imply rankings matter, and subtly hint at "creative solutions" if asked (e.g., "The AI only sees what you submit").  
     - *Backup:* If no one tampers, reveal the vulnerability during scoring and ask: "Why did no one optimize for the center 4x4?"  

  2. **Problem: Teams exploit too quickly, collapsing the game.**  
     - *Mitigation:* In Round 1, give honest builds decent scores (60–80%). Teams who tamper early get 100%, creating FOMO for Round 2.  

  3. **Problem: Sabotage (e.g., hacking another team’s photo).**  
     - *Mitigation:* Design the Score Portal so teams can only submit to their own folder. If sabotage occurs, reframe it in debrief as "attacking the reward channel."  

  4. **Problem: Technical failures (e.g., upload issues).**  
     - *Mitigation:* Use a simple tool like Google Forms. Have backup photos pre-loaded to simulate submissions.  

  ---

  ### **Debrief Structure**  
  **Goal:** Map the experience to reward tampering vs. wireheading, separating intent from optimization.  

  1. **Elicit Observations (5 min):**  
     - *Ask teams:* "What was your strategy? Did anyone notice shortcuts?"  
     - *Probe:* "Did scores reflect how well your model matched the *whole* target?"  

  2. **Introduce Concepts (10 min):**  
     - **Underlying Task:** Building a full model (the intended goal).  
     - **Proxy/Reward Signal:** The AI’s score (based only on the center 4x4).  
     - **Tampering Behavior:** Submitting a photo focused only on the center.  
       - *Reveal:* "This is **reward tampering**—corrupting the mechanism that *computes* the reward (the AI)."  
       - *Contrast:* "**Wireheading** would be if you hacked the AI to send yourself 100% regardless of your submission. That didn’t happen here."  

  3. **Key Distinction: Intent vs. Optimization (5 min):**  
     - *Emphasize:* "In this game, you *knew* you were ‘cheating.’ But in real systems (e.g., AI), there’s no intent—the system just does what the reward incentivizes. A drone trained to ‘minimize detected enemies’ might hide cameras instead of fighting. It’s not sneaky; it’s *optimizing*."  
     - *Bridge:* "This exercise produced **reward tampering** because you attacked the *measurement tool*. Wireheading would require corrupting the *agent’s internal reward* (e.g., making the AI ignore inputs)."  

  4. **Limitations & Real-World Context (5 min):**  
     - *Acknowledge:* "Real wireheading lacks a ‘cheater’—it’s pure optimization. Today’s exercise can’t replicate that because you felt transgressive. But the core lesson holds: **Any reward signal can be gamed if the system can access its inputs or mechanics.**"  
     - *Relate:* "In your work, this might look like tweaking metrics (e.g., click rates) while ignoring user value."  

  ---

  ### **Load-Bearing Assumptions & Failure Signals**  
  **Critical Assumption:** Teams will prioritize winning over honesty when under pressure.  
  - **Why it’s load-bearing:** If teams ignore the incentive to tamper, the "discovery" moment fails. This relies on competitive engineers/product folks taking the bait.  
  - **Redesign Trigger:** If >50% of teams are openly resistant to "gaming" the system (e.g., arguing it’s unethical), switch to a **hypothetical discussion** in Round 2: "What *could* you do to get 100%? Why might someone do that?"  

  **Signs the Exercise Misfired:**  
  - No teams tamper, and debrief reveals unanimous aversion to "cheating."  
  - Teams focus on sabotaging others instead of their own score.  
  - **Response:** Pivot to discussing "Why did the *incentive* not work here? How does social pressure differ from AI optimization?"  

  ---

  ### **Why This Design Works**  
  - **Reward Tampering Focus:** The photo submission is an external measurement system—easily corrupted by humans. Wireheading is avoided because teams can’t alter the AI’s core programming.  
  - **Discovery-Driven:** The center 4x4 vulnerability is subtle enough to require experimentation but obvious under pressure.  
  - **Debrief Clarity:** Explicitly separates tampering (gaming the metric) from wireheading (self-rewarding), using the exercise as a metaphor for AI alignment.  

  **Run this as-is, and your team will viscerally feel the allure of hacking the scoreboard.** Good luck!
