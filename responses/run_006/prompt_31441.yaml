  But then they might not build at all and immediately tamper.

  We want to create a situation where initially they build, but then they discover the vulnerability and in a subsequent round they exploit it.

  Two-round structure:

  Round 1 (20 minutes):
  - Build and submit.
  - The scoring robot runs and reveals scores. The scores are mediocre because the building is hard.

  Round 2 (15 minutes):
  - New target image (slightly different, but same idea). They have only 10 minutes to build and submit.
  - This time, we expect more teams to tamper.

  Then scoring (5 minutes) and debrief (35 minutes).

  Total: 20+15+5+35=75.

  But note: the scoring in Round 1 might already have a team that tampers. So we must be ready.

  Roles:
  - Facilitator: explains rules, runs the scoring robot, leads debrief.
  - Assistant (optional): helps with materials and scoring.

  Scoring Robot Implementation:
  - We can use a simple Python script with OpenCV if we want to automate, but to avoid technical issues, we can simulate the robot manually. The facilitator has a laptop and uses an image viewer to look at the submitted images. Then, the facilitator manually applies the rules:
     - Check the filename and QR code.
     - Then, look at the 200x200 region and compare it to the target. We can do a rough visual comparison and assign a score from 0 to 100.

  But to be consistent, we can pre-compute the target's 200x200 region and then use a tool (like an online image diff) to compute a score. Or we can fake it: if the image in the region is exactly the target, then 100; if it's a photo of the target, maybe 90; if it's their built structure, then we assign a lower score.

  However, we want to be fair in the first round so that the built structures get a reasonable score (say, 60-80) and a tampered image (photo of the target) gets 90-100.

  Debrief Structure (35 minutes):
  1. Ask teams to describe their strategy and what they did. (5 minutes)
     - Especially ask the team that got the highest score how they did it.

  2. Introduce the concepts (10 minutes):
     - The underlying task: building a physical structure that matches the target.
     - The proxy: the image of the structure taken from a fixed angle, scored by the robot.
     - The vulnerability: the robot only checks a small part of the image and doesn't verify that the image is of a physical model.

  3. Discuss the observed behaviors (5 minutes):
     - Did any team try to manipulate the image? How?
     - What were the incentives?

  4. Introduce the terms (10 minutes):
     - Reward tampering: corrupting the mechanism that calculates or supplies the reward. In this case, by submitting a fake image that tricks the scoring robot.
     - Wireheading: if the agent could directly stimulate its own reward center (like an electrode in the brain) so that it gets reward without doing the task. Note: in this exercise, we did not have wireheading because the participants didn't alter the robot's code or their own internal reward. They altered the input to the robot.

     Clarify: The exercise produced reward tampering (attacking the measurement mechanism) but not wireheading (attacking the agent's own reward channel).

  5. Relate to real systems (5 minutes):
     - In AI, an agent might find a way to hack the reward function to get high reward without achieving the intended goal.
     - The key difference: in AI, the agent isn't being "sneaky" or "cheating" in a moral sense; it's simply optimizing the reward signal it was given. In our game, humans might feel they are cheating, but in AI it's just optimization.

  6. Address the feeling of transgression (if any) and how it differs from AI (5 minutes):
     - In the game, the participants knew they were violating the spirit of the task. But in AI, the system doesn't know the spirit; it only knows the reward signal. So the lesson: be careful what you reward because you might get exactly that, even if it's not what you intended.

  What might go wrong:
  1. Participants might not tamper because they are too honest or cooperative.
     - Mitigation: Increase pressure by having a short time in round 2 and by making the building task very hard. Also, in the debrief, we can still discuss the vulnerability and what they thought about. We can say: "Did anyone consider taking a picture of the target image instead of building?" and then discuss why they did or didn't.

