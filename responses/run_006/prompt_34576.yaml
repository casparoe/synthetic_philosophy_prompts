  I should also mention Carnap's framework relativism, which views such disputes as internal/external questions. That ties into pragmatic factors influencing concept choice. 

  The key is that the disagreement is normative or conceptual, not factual. It's about which linguistic framework to adopt based on values like simplicity or explanatory power. So even without empirical differences, the choice of framework matters for theoretical or practical reasons. 

