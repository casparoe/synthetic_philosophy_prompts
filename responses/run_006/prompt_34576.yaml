  I remember that in metaontology, there's a concept called "merely verbal disputes" versus "substantive disagreements." But in cases like existence debates, even after clarifying definitions, the disagreement remains. That's where the notion of "metalinguistic negotiation" comes in. That term, coined by David Plunkett and Tim Sundell, refers to disagreements that are about which concepts or meanings should be applied in a context, rather than factual differences. 

  Also, Eli Hirsch's "quantifier variance" is relevant. He argues that existence disputes can be verbal because different conceptual schemes have different, equally valid meanings for "exists." But opponents like Ted Sider think there's a single, privileged ontological structure, making the disagreement substantive. 

