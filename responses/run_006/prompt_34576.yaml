answer: |-
  You've brilliantly pinpointed a core and notoriously tricky debate in **metaontology** (the study of the nature of ontological disputes themselves). While there isn't one universally agreed-upon term, several concepts capture facets of what you're describing:

  1.  **Metalinguistic Negotiation (David Plunkett & Tim Sundell):** This is arguably the most precise fit. Proponents argue that *many* philosophical disputes, including these ontological ones, are not about the non-linguistic facts (which are agreed upon), but about **which concepts we ought to use** or **how we ought to deploy our linguistic resources** in describing those facts. The disagreement is "metalinguistic" because it's about language *use* itself. The philosophers aren't disagreeing about particles or observations; they're disagreeing about whether the concept "exists" (or "table," "number," etc.) is the *best* or *most appropriate* concept to apply to that agreed-upon reality. The "substance" lies in the normative choice of conceptual framework based on theoretical virtues (simplicity, explanatory power, connection to other concepts, avoiding paradox, etc.).

  2.  **Quantifier Variance (Eli Hirsch):** Hirsch argues that these disputes are **verbal** precisely *because* of what you observe – agreement on all non-linguistic facts. He claims there is no single, privileged meaning for "exists" or "object." Different conceptual schemes have different, equally valid ways of "carving up" reality using quantifiers ("there exists an X such that..."). The dispute persists because each side is implicitly using their own conceptually relative quantifier meaning. They *are* talking past each other, but the ambiguity is deep-seated in the conceptual frameworks, not a simple homonym like "bank."

  3.  **Framework-Relative Existence (Rudolf Carnap):** Carnap distinguished between **internal questions** (existence claims *within* a linguistic framework, e.g., "Is there a prime number between 10 and 15?") and **external questions** (questions *about* the framework itself, e.g., "Do numbers *really* exist?"). He argued that external questions are **practical questions** about which framework is more *useful* or *expedient* for certain purposes, not theoretical questions with true/false answers. Your dispute fits perfectly as an external question.

  4.  **Shallow Disagreement / Verbal Dispute (in the broader sense):** While you note the annoyance with this label, many philosophers *do* classify these disputes as fundamentally verbal, precisely *because* no non-linguistic facts distinguish the positions. The "substance" they feel is the importance of the *choice* of conceptual scheme and its implications for how we think and talk, not a difference in the world described.

  **How does this relate to the concept of a "verbal dispute"?**

  *   **It's a subspecies (or a sophisticated case):** It fits the broader definition: a dispute arising from or resolvable by attention to language/meaning, where agreement on non-linguistic facts is possible. However, it's not the trivial homonym type. The ambiguity isn't surface-level; it's embedded in complex conceptual frameworks and the very meaning of fundamental terms like "exists" and "object."
  *   **It exposes a problem:** Your observation *does* challenge a naive verbal/substantive distinction. It shows that:
      *   What counts as "linguistic" vs. "non-linguistic" isn't always clear-cut (conceptual frameworks shape how we *see* the facts).
      *   Disagreements about *which concepts to use* can feel deeply substantive and have real philosophical consequences, even without factual divergence.
      *   The insistence on substance often stems from the belief that one framework captures reality's "true structure" or is objectively privileged (a view challenged by quantifier variance and Carnapian views).

  **Why do philosophers insist it's substantive? (What's "real" about it?)**

  1.  **Normative Stakes:** Choosing one framework over another isn't *arbitrary*. It involves values:
      *   **Theoretical Virtues:** Simplicity, parsimony (Ockham's Razor), explanatory power, coherence with other established theories, fruitfulness for further inquiry.
      *   **Practical/Aesthetic Virtues:** Intuitiveness, connection to common sense, avoiding counterintuitive consequences, elegance.
      *   **Metaphysical Commitment:** Believing one framework genuinely reflects the *mind-independent structure of reality* (e.g., Sider's "structure" realism), while others are merely useful fictions or distortions. This is the core realist stance against deflationism/variance.
  2.  **Downstream Conceptual Consequences:** Adopting "Tables exist" vs. "Only particles arranged table-wise exist" influences how we conceptualize identity, persistence, causation, perception, and responsibility. It shapes the entire network of concepts we use. *How* we talk shapes *how* we think and reason.
  3.  **The Meaning of "Existence" Itself:** Many philosophers (like Quineans or Sider) argue that "exists" has a single, fundamental, objective meaning tied to logic and quantification ("∃x"). Disagreeing about what exists, given agreement on the facts, *must* therefore be a disagreement about the facts themselves – one side must be making a *mistake* about the world. They reject quantifier variance.
  4.  **Phenomenology:** The *feeling* of grappling with "what is *really* there" feels deeply substantive and non-linguistic, even if analysis reveals linguistic/conceptual elements.

  **In Summary:**

  *   **Best Specific Terms:** **Metalinguistic Negotiation** or **Quantifier Variance** (depending on the specific argument).
  *   **Relation to Verbal Dispute:** It's a sophisticated form of verbal dispute where the ambiguity is deep, conceptual, and framework-relative, not superficial. It highlights the blurry line between linguistic choice and factual discovery.
  *   **Why it Feels Substantive:** The disagreement involves **normative choices** (which framework is best/most true to reality?) based on **theoretical virtues**, has **downstream conceptual consequences**, and often stems from a commitment to one framework capturing **objective reality's structure**. The "real work" isn't differentiating empirical predictions but shaping our fundamental conceptual map of the world.

  You've grasped a central issue in contemporary metaphysics and philosophy of language. The persistence of these debates, despite agreement on "the facts," forces us to confront the nature of language, concepts, reality, and philosophical inquiry itself.
