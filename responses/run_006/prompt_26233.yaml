prompt: |-
  I'm in a metaphysics seminar that's been focused on the identity of indiscernibles and whether it should be treated as a necessary truth, a contingent truth, or rejected outright. We've spent several sessions on Max Black's two-sphere universe and the surrounding literature on whether purely relational differences can ground numerical diversity. Before I settle on a view, I want to step back and work out what the criteria for success even are.

  Please write the desiderata: what any adequate theory of object individuation must deliver. For each requirement, give the case or consideration that motivates it, and indicate whether it is a hard constraint (something no theory can responsibly violate) or a camp-specific commitment (e.g., something a bundle theorist will insist on that a substratum theorist might reject, or vice versa). Be specific about the cases — Black's spheres, symmetric worlds more generally, quantum statistics for identical particles, vague objects, the statue and the clay, and any others you think are load-bearing. Then tell me which single desideratum eliminates the most candidate theories, and whether any two desiderata on your list cannot be jointly satisfied. If there is a tension, trace exactly how it arises.
