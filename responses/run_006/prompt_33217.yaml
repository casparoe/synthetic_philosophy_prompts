prompt: |-
  I recently spent a long evening arguing with a friend about how one ought to act under moral uncertainty, and by the end of it I found myself defending a view I had not previously stated in so many words. I have come to think that the correct approach is to maximize expected choiceworthiness: assign each live moral theory a subjective probability, represent what each theory recommends on some common scale of choiceworthiness, and choose the option with the highest expectation. My friend pressed two objections especially hard. First, he argued that the whole apparatus depends on intertheoretic value comparisons for which there is no fact of the matter, so any trade rate between utilitarian value and deontological constraint, for example, is arbitrary and the results of the calculation are artefacts of the scale. Second, he argued that the view invites fanaticism, since a minuscule probability assigned to a theory according to which the stakes are astronomically high will dominate every practical decision, and we have no principled way of excluding such theories from consideration.

  I still think something close to this position is right, but I want to know what would count against it, not merely what critics have already said. I would like a map of the view's exposure: which observations, possible cases, formal results, or commitments would have to be true for it to be false or badly damaged? Which of these would a defender of expected choiceworthiness themselves concede as counting against the view, and which would they dismiss as difficulties for everyone rather than difficulties for this position in particular? I would also like to know what the view predicts about actual decisions that its main rivals, such as acting on one's preferred theory or adopting a precautionary rule, do not, and whether a failure of those predictions would count against it. Please rank the defeaters from fatal to merely awkward, and give an honest assessment of whether the view has been qualified into unfalsifiability, and whether that should trouble me. I would personally find most persuasive a defeater that shows the view cannot even be stated without presupposing one of the theories in dispute. Please write the answer in British English.
reasoning: |-
  Okay, let me unpack this user's query. They've had a deep debate about moral uncertainty and settled on expected choiceworthiness maximisation (ECM). Now they want to know what could genuinely undermine this position, beyond standard objections. 

  First, I need to map their core concerns: (1) the intertheoretic comparison problem feels like a showstopper because it questions ECM's very coherence, and (2) the fanaticism objection suggests ECM could force absurd decisions. But they're explicitly asking for *new* defeaters, not just rehashed critiques. 

  Hmm... what would make ECM untenable even to its defenders? The user hints they'd find it devastating if ECM secretly presupposes one moral theory. That's clever - if ECM's machinery (probabilities, choiceworthiness scales) only works by borrowing assumptions from say, utilitarianism, then it's circular. But is that true? 

  *Scratches head* Well, assigning probabilities to theories feels Bayesian, which leans consequentialist. And "choiceworthiness" sounds suspiciously like utility... but maybe we could define it minimally? Still, the act of maximising expectation itself feels consequentialist. That might be a Category 5 defeater if proven. 

  Then there's the "no neutral metatheory" angle. If moral theories are incommensurable frameworks (like Kuhn's paradigms), ECM's maths becomes a category error. But the user might dismiss this as a general problem. 

  For fanaticism, could there be a formal proof that ECM *must* prioritise tiny probabilities of huge payoffs? Like Pascal's Mugging but for ethics. That'd be Category 2 - damaging but maybe fixable with probability discounts. 

  *Pauses* The user wants predictions too. ECM uniquely predicts we'd sacrifice modest certain goods for tiny chances of moral jackpots (e.g., donating to asteroid defence). If real decisions never reflect this, it counts against ECM. Rivals like "maximin" wouldn't. 

  Most awkwardly, ECM defenders might immunise it by tweaking scales or capping payoffs. That'd risk unfalsifiability. The user should worry if every counterexample gets "solved" by ad-hoc adjustments. 

  *Sighs* Honest assessment? ECM's unfalsifiability threat is real but not terminal yet. The circularity charge is the nuclear option - if it lands, game over. But I'll need British phrasing: "rather damning" not "game over". Right then.
answer: |-
  Your defence of expected choiceworthiness maximisation (ECM) faces profound challenges—some potentially fatal, others merely awkward but collectively demanding serious reckoning. Below is a ranked assessment of defeaters, from lethal to corrigible, with predictions distinguishing ECM from rivals and an evaluation of falsifiability. I'll use British spellings throughout.

  ### **Ranked Defeaters: From Fatal to Awkward**
  #### **Category 1: Potentially Fatal**  
  1. **The Presupposition Defeater (Circularity Charge)**  
     - **The Core Problem**: ECM requires a *meta-scale* to normalise "choiceworthiness" across theories. But constructing this scale **presupposes a background moral theory** (e.g., utilitarianism to compare utility with deontic constraints). If true, ECM covertly privileges one theory in the set it claims to weigh impartially.  
     - **Why Fatal?** If ECM cannot be formulated without implicitly endorsing a contested moral framework (e.g., consequentialism), it collapses into begging the question. Your friend’s "no fact of the matter" objection becomes inescapable.  
     - **ECM Defender’s Reply**: Concede this threatens coherence but argue that *all* decision procedures under moral uncertainty face analogous presuppositions. Dismiss as a "problem for everyone".  

  2. **Radical Incommensurability**  
     - **The Core Problem**: Some theories (e.g., virtue ethics vs. hedonistic utilitarianism) may lack *any conceivable common measure*. ECM’s "expectation" is undefined if choiceworthiness scales are isomorphic to comparing kilograms to metres.  
     - **Why Damaging?** Renders ECM *literally unintelligible* in many practical cases. A utilitarian "utilon" and a Kantian "duty violation" might be no more comparable than a colour and a sound.  
     - **ECM Defender’s Reply**: Insist on pragmatic comparability (e.g., "both theories care about suffering") or adopt a **voting-based fallback** (e.g., Borda counts). Risks ad hoc manoeuvring.  

  #### **Category 2: Severely Damaging**  
  3. **Fanaticism as Formal Entailment**  
     - **The Core Problem**: ECM mathematically *requires* prioritising minuscule probabilities of astronomical stakes. Example: A 0.0001% chance of "total utilitarianism being true" demands dedicating all resources to preventing existential risk—even if other theories condemn this as monstrous.  
     - **Why Severe?** Makes ECM practically absurd. No principled "probability threshold" excludes crackpot theories (e.g., "killing one person dooms 10^100 souls"), as *any* non-zero probability dominates.  
     - **ECM Defender’s Reply**: Impose **lexical thresholds** (e.g., ignore probabilities below 1/10^6) or **normalise stakes** by theory-relative variance. Concedes arbitrariness but preserves ECM’s core.  

  4. **Self-Undermining in Metachoice**  
     - **The Core Problem**: Should you use ECM to decide *whether to adopt ECM*? If ECM assigns high weight to theories rejecting maximisation (e.g., deontology), it may tell you to abandon ECM—a paradox akin to "money pumps".  
     - **Why Damaging?** Reveals ECM as **dynamically inconsistent**. Defenders must either privilege ECM axiomatically (dogmatism) or accept a regress.  
     - **ECM Defender’s Reply**: Bite the bullet—ECM is a *substantive moral claim* about uncertainty, not a neutral algorithm. Rejects "metachoice" as a category error.  

  #### **Category 3: Awkward but Corrigible**  
  5. **Sensitivity to Framing & Scale Artifacts**  
     - **The Core Problem**: Doubling all "choiceworthiness" values in one theory doubles its influence. Different normalisations (e.g., range-based vs. variance-based) yield contradictory prescriptions.  
     - **Why Awkward?** Invites manipulation and undermines objectivity. Your friend’s "artefact" charge gains traction.  
     - **ECM Defender’s Reply**: Adopt **variance normalization** (scale theories to equal "stakes") or **structural similarity** (e.g., assume theories share a cardinal structure). Accepts this as a live technical problem.  

  6. **Ignorance Over Theory Space**  
     - **The Core Problem**: Probabilities require a defined hypothesis space. But moral theories are non-enumerable (e.g., "utilitarianism with discount rate *r*" for all real *r*). Unconsidered theories may dominate if discovered later.  
     - **Why Awkward?** ECM becomes hostage to epistemic luck.  
     - **ECM Defender’s Reply**: Embrace **approximation** (e.g., cluster similar theories) or **conservatism** (discount novel theories).  

  ---

  ### **Predictions vs. Rivals**  
  ECM uniquely predicts:  
  - **Systematic bias toward high-stakes, low-probability interventions** (e.g., donating to AI risk mitigation over local poverty aid).  
  - **Reckless "moral exploration"**: Pursuing actions that resolve moral uncertainty (e.g., testing a debatable deontic constraint) even if theories deem it impermissible.  
  - **Non-monotonicity**: Small probability shifts (e.g., from 0.1% to 0.2% for a theory) radically alter decisions.  

  **Rivals’ Contrasts**:  
  - **Maximin (Precautionary)**: Avoids fanaticism but stagnates (e.g., "never violate rights, even for immense gains").  
  - **My Favourite Theory (MFT)**: Ignores uncertainty, leading to dogmatism in moral dilemmas.  
  - **Normative Voting (e.g., Borda count)**: Less framing-sensitive but struggles with proportionate weighting.  

  A **failed prediction** (e.g., if ECM agents *never* favour Pascal's Mugging-style gambles) would undermine ECM. Empirical psychology could test this.  

  ---

  ### **Falsifiability & Immunisation**  
  - **Unfalsifiability Threat**: High. Defenders "immunise" ECM by:  
    - Tweaking normalisation rules (*ad hoc* scale adjustments).  
    - Capping "acceptable" stakes (arbitrary thresholds).  
    - Blaming failures on "poor probability assignments".  
  - **Should You Worry?** Yes, if you value Popperian rigour. ECM risks becoming a "choose-your-own-adventure" formalism where desired outcomes are reverse-engineered. The **presupposition defeater** remains the gravest concern—if ECM’s machinery smuggles in contested meta-norms, it cannot claim neutrality.  

  ---

  ### **Conclusion: A Qualified Defence?**  
  ECM survives as a *coherent framework* only if:  
  1. Intertheoretic comparisons are feasible (e.g., via "universal basic goods" or structural axioms).  
  2. Fanaticism is tamed through principled constraints (e.g., **normalised stakes + lexical thresholds**).  
  3. Its meta-normative presuppositions are acknowledged and defended substantively.  

  If these fail, **myopic MFT** or **robust satisficing** (e.g., "satisfy all theories above a probability threshold") may become preferable. The deepest wound remains ECM’s potential circularity—if you cannot define choiceworthiness without your favourite theory, the view is not just damaged but **self-defeating**. Proceed with caution, but not despair.
