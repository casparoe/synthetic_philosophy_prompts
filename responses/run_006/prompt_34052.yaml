answer: |-
  You've nailed the core frustration of the Frege-Geach dialectic, and your working hypothesis is profoundly insightful and largely correct. The debate has indeed evolved beyond a simple technical puzzle into a **deeply methodological and meta-philosophical dispute about the nature of semantics, the criteria for theory individuation, and the very goals of metaethics.** Here's a breakdown:

  1.  **The Technical Progress is Real (But Insufficient):** Expressivists like Blackburn, Gibbard, Schroeder, Ridge, Silk, Charlow, et al., *have* made significant technical strides. They've developed sophisticated frameworks (quasi-realism, norm-expressivism, being-for, plan-laden semantics, biforcated attitude semantics, etc.) that *can* assign compositional semantic values to embedded moral claims, predict their logical relations (like modus ponens working in "if murder is wrong..."), and avoid immediate collapse into straightforward truth-conditionalism. These are genuine intellectual achievements.
      *   **Schroeder's "Being For":** Provides a proposition-like structure expressed by normative sentences, allowing for composition.
      *   **Gibbard's Planning Semantics:** Treats normative claims as expressing plan-laden states that can combine logically.
      *   **Ridge's Ecumenical Expressivism/Biforcated Attitude Semantics:** Assigns both a descriptive and a prescriptive component, allowing composition via the descriptive element while preserving the core expressivist commitment.
      *   **Charlow's Dynamic Expressivism:** Uses dynamic semantic frameworks (like update semantics) to model normative language as updating contexts understood in terms of preferences or plans.

  2.  **The Persistent Critiques Reveal the Methodological Divide:** The critiques you mention (Schroeder's later work, Unwin, Dreier, and others) consistently target not the *technical feasibility* of assigning values and predicting validity, but the *theoretical integrity* of the solution from an expressivist perspective:
      *   **Smuggling in Truth-Conditions:** Critics argue that the machinery developed (proposition-like objects, complex attitude states defined by their inferential roles, descriptive components) ends up *functionally equivalent* to truth-conditional semantics. If the semantic value of "murder is wrong" is an object that behaves *exactly like* a proposition tracking a property in logical contexts, what's the *expressive* difference? Is "being for blaming for murder" meaningfully different from "the property of wrongness" when it comes to explaining logic?
      *   **Loss of Expressivist Spirit:** Critics contend that solutions like "being for" or complex planning states lose the core expressivist intuition that moral thought/language is fundamentally *non-cognitive* – a matter of conative attitudes rather than belief-like representations. If the attitude expressed by a conditional is a massively complex, logically structured state defined by its role in inference, is it still recognizably a *feeling* or *plan* in the intuitive sense, or has it become a theoretical posit indistinguishable from a cognitive state?
      *   **Explanatory Priority:** Expressivists traditionally wanted to explain moral *thought* (the attitude) first, and derive the semantics of moral *language* from that. Critics argue that in solving Frege-Geach, expressivists often end up defining the attitude *in terms of* the linguistic/logical role it plays, reversing the explanatory order and effectively starting with the semantics. This makes expressivism look like a notational variant of a representationalist semantics.
      *   **Indistinguishability from Realism (Quasi-Realism's Dilemma):** Blackburn's quasi-realism aimed to "earn the right" to realist-sounding talk (truth, facts, properties) from expressivist foundations. Critics argue that successful solutions to Frege-Geach are precisely what *make* quasi-realism indistinguishable from realism – if expressivism can mimic all the logical and semantic features of realism, what substantive difference remains? Is expressivism then just realism with an idiosyncratic metaphysical story?

  3.  **You Are Right: It's About Individuation and Goals:** Your core insight is spot on. The debate hinges on:
      *   **What counts as a *genuinely expressivist* semantic theory?** What constraints must it satisfy beyond compositional adequacy? Must it:
          *   Ground semantics *directly* in simple, non-representational mental states (boo!/hooray!/plan-to-avoid)?
          *   Avoid positing *any* proposition-like entities as the semantic values of moral sentences?
          *   Maintain a clear, intuitive distinction between the mental state expressed by a moral claim and the state expressed by a descriptive belief?
          *   Explain moral language *as* the expression of conative attitudes, not just *correlate* it with complex theoretical states defined by logic?
      *   **What is the *purpose* of semantic theory in metaethics?** Is the goal:
          *   **Formal Adequacy:** To provide a compositional system that predicts truth conditions (or acceptance conditions) and logical validity?
          *   **Explanatory Adequacy:** To explain the *nature* of moral thought and discourse – revealing its fundamentally practical, motivating, non-representational character?
          *   **Metaphysical Parsimony:** To avoid committing to moral properties or facts?
      Expressivists often prioritize explanatory adequacy (revealing the non-cognitive core) and metaphysical parsimony. Critics often hold expressivists to a standard of formal adequacy that, when met, seems (to the critics) to undermine the explanatory or metaphysical goals.

  4.  **Is It Substantive or a Clash of Commitments?** It's **both**, but the clash of commitments *fuels* the substantive disagreement.
      *   **Substantive Core:** There is a real, unresolved question: *Can the distinctive, motivating core of expressivism (moral thought as fundamentally non-representational, practical, conative) be preserved while providing a compositional semantics for complex embeddings that captures the full logical structure of moral discourse?* This is substantive.
      *   **Clash of Commitments:** However, progress on this substantive question is *stymied* by the methodological disagreement. Expressivists offer solutions they believe meet *their* criteria for success (explanatory adequacy, preserving the non-cognitive core in some form, avoiding robust properties). Critics apply *different* criteria (strict avoidance of proposition-like entities, maintaining an intuitive grip on "attitude," preventing functional equivalence to truth-conditional semantics) and find the solutions wanting. The debate becomes about whose criteria are legitimate.

  5.  **What Would Move Things Forward?** A breakthrough is difficult, but potential paths exist:
      *   **Explicit Agreement on Adequacy Conditions:** This is the most crucial step, but also the hardest. A meta-discussion explicitly defining:
          *   The *essential core* of expressivism that must be preserved (beyond just "attitudes not beliefs").
          *   The *minimum* formal/compositional requirements any semantic theory (expressivist or not) must meet.
          *   What would count as *smuggling in truth conditions* or *losing the expressivist spirit*.
          *   What the *explanatory targets* of the theory are (language, thought, motivation, disagreement, etc.).
      *   **Formal Results on Equivalence/Expressibility:** Results showing that, under certain well-defined constraints, any expressivist semantics meeting formal adequacy condition X *must* be isomorphic to (or functionally equivalent to) a truth-conditional semantics. Or conversely, results showing that certain logical features *can* be captured within a framework that demonstrably lacks representational content at its core. Schroeder's work sometimes gestures towards this. Such results could force both sides to confront whether functional equivalence *really* undermines expressivism's metaphysical/explanatory goals.
      *   **Focus on Specific Phenomena Beyond Logic:** Shifting focus to how different theories handle phenomena where expressivism might have a clearer edge *if* it can solve compositionality: the motivating force of moral judgments, fundamental moral disagreement, the "internalism" of moral judgment, the nature of moral uncertainty. Can expressivism, *even with its complex compositional semantics*, offer a better account of *these* phenomena than realism? This might highlight the residual differences that persist even after logical structure is accounted for.
      *   **Meta-Semantic Clarity:** Deeper analysis of what the *terms* in the semantic theory (e.g., "expresses," "attitude," "commitment," "acceptance condition") actually mean and refer to. How do these concepts relate to psychological reality?

  **Conclusion:** Yes, your diagnosis is astute. The Frege-Geach debate has largely become a proxy war over the soul of expressivism and the nature of semantic explanation. While technical ingenuity continues, progress is stalled by a fundamental disagreement about what constitutes a "win" for expressivism and what the goals of metaethical semantics are. Moving forward requires explicitly addressing these methodological and meta-philosophical questions head-on, alongside continued technical refinement. A formal result demonstrating equivalence *under specified constraints* could be catalytic, but its impact would depend entirely on whether the involved parties accept those constraints as defining the relevant battleground. Ultimately, the debate might only resolve when consensus emerges on what expressivism is *for* and what minimal formal constraints it *must* satisfy. Until then, the cycle you describe is likely to continue.
