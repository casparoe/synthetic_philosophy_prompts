  For the model answer, I’ll structure it around Thomson’s core move—the contradiction derived from continuity assumptions—then show why this doesn’t kill all supertasks. The ball example will illustrate how some descriptions *do* fix the limit state. Physical realizability gets a separate section to clarify it’s not the paradox’s main point. 

