prompt: |-
  I am setting the final examination for a third-year undergraduate module in the philosophy of mathematics, and I want one essay question on supertasks that a candidate cannot answer well by simply retelling Thomson's lamp and the standard underdescription reply. The question should force candidates to work through what the lamp's failure to determine a final state actually establishes: whether it refutes the logical possibility of supertasks, merely shows that some supertask descriptions are incomplete, or bears only on whether such tasks can be carried out in a physical world. It should also push them to contrast the lamp with supertasks whose state at the limit is fixed by the description itself, so that the two kinds of case are not conflated. Please draft the question, a model answer of roughly 700 words, and a marking scheme out of 20 marks built around five specific moves a first-class answer must make. For each move, state the marks and add a one-line note on how candidates typically mishandle it. The marking scheme should also spell out what separates a first-class script from an upper-second one, in terms of the moves made rather than general qualities such as clarity or depth.
