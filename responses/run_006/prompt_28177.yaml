prompt: |-
  I am a philosophy professor whose doctoral work was in biostatistics, and I now teach a graduate seminar in the philosophy of biology. One debate I keep returning to is the long-running dispute over whether evolutionary psychology produces science or just-so stories. On my reading, the critics' charge is that an adaptationist can, for nearly any trait or behavioral tendency, tell a plausible story about how it promoted fitness in the ancestral environment, and the story survives only because it has not been forced to run much risk of being wrong. The defenders answer that this is a caricature: serious work in evolutionary psychology, they say, derives testable predictions from well-specified models of ancestral selection pressures and checks them against independent sources of evidence. I would like you to restate this dispute in the vocabulary I actually think in when I am doing statistics: model fitting and model criticism. Translate the charge of just-so storytelling into the language of overfitting, free parameters and degrees of freedom, post hoc fitting, multiple comparisons, identifiability, pre-registration, and out-of-sample testing. Then translate the adaptationist reply into the same language: what would a well-regularized evolutionary hypothesis look like, what would count as a pre-specified test, what would the null model be, and what evidence would show that the hypothesis was not reverse-engineered from the trait it explains? I am fluent in this vocabulary, so use the terms precisely rather than explaining them, and be honest about what the translation forces you to distort.

  Then give me the residue report. I want to know which parts of the debate map cleanly onto model selection and which parts only map if you quietly change the meaning of the statistical terms. In particular, I suspect that a spandrel is not simply the null model, and that calling something an adaptation is not simply saying that a function fits a trait with low error; it is a claim about a historical causal process involving selection pressures, and that may have no counterpart in the vocabulary of fitted models. Tell me what does not survive the translation, and then say which side of the ledger is doing the work: is the statistical vocabulary missing something the debate genuinely turns on, or does the failed translation show that some of the philosophical talk is less precise than it sounds?
reasoning: |-
  Okay, let me start by unpacking what this philosophy professor is asking. They want the evolutionary psychology debate framed in statistical terms like model fitting and criticism. The key points are translating "just-so stories" into concepts like overfitting, post hoc analysis, etc., and then the adaptationist defense into pre-specified tests and regularization. 

  Hmm, the challenge here is precision. Terms like "free parameters" in stats are straightforward with numerical data, but in evolutionary psych, a "parameter" might be a narrative element (e.g., "ancestral threat X caused trait Y"). That’s a translation distortion already—narrative flexibility isn’t quite the same as adding polynomial terms. 

  Next, the null model. In stats, it’s often a baseline like "no relationship." But in evolution, the null (a spandrel) isn’t just noise; it’s complex non-adaptive causation like drift or constraints. That’s a mismatch—spandrels aren’t i.i.d. Gaussian noise. 

  Pre-registration seems clean: specifying hypotheses before data collection. But evolutionary psych often relies on existing anthropological/biological data. How pre-registrable is that? Out-of-sample testing could mean cross-cultural studies, but what if the "sample" is all humans? That’s tricky. 

  The residue is where it gets juicy. Claiming adaptation isn’t just low SSE—it’s a historical causal claim. Stats models don’t naturally handle causality or history. Plus, spandrels as nulls ignore that they can be structured (e.g., developmental constraints). 

  So the failed translations reveal philosophical imprecision. "Selection pressure" gets blurred with curve-fitting, but the stats lens shows that evo psych critics might overlook when predictions *are* pre-specified (e.g., universal mate preference studies). Yet the core issue—proving historical selection—remains outside the math. Stats can’t model the actual past, only patterns in present data. 

  Verdict: The stats translation sharpens testability debates but exposes where evo psych overclaims causality. Both sides gain clarity, but the deepest conflict (history vs. pattern) survives.
answer: |-
  ### Translation of the Debate into Statistical Vocabulary  

  #### Critics' Charge (Just-So Stories as Statistical Pathology)  
  - **Overfitting**: Evolutionary psychology (EP) hypotheses are *overfit narratives* that exploit excessive degrees of freedom in reconstructing ancestral environments.  
  - **Free Parameters**: Unconstrained assumptions about selection pressures (e.g., "male jealousy increased fitness in savanna environments") act as *free parameters* that inflate model flexibility without penalty.  
  - **Post Hoc Fitting**: Hypotheses are often reverse-engineered (*post hoc*) from observed traits, equivalent to fitting a model to noise.  
  - **Multiple Comparisons**: Testing numerous adaptive stories without correction (e.g., "trait X could be for foraging, mating, or coalition-building") inflates false positives.  
  - **Identifiability Failure**: Many EP models are *non-identifiable*—distinct selection histories (e.g., sexual vs. natural selection) can produce identical trait outcomes.  
  - **Lack of Pre-Registration**: Absence of *pre-specified tests* (e.g., defining ancestral ecology or fitness metrics *before* analysis) invites narrative flexibility.  
  - **In-Sample Testing**: Validation relies solely on *in-sample* data (e.g., modern traits), lacking out-of-sample tests (e.g., cross-species or archaeological predictions).  

  #### Adaptationist Reply (Rigorous EP as Regularized Modeling)  
  - **Well-Regularized Hypotheses**: Impose *penalties* via:  
    - **Strong Priors**: Independent evidence (e.g., paleoecology, comparative biology) constrains ancestral models.  
    - **Pre-Specified Tests**: *Pre-registered* predictions (e.g., "bipedalism predicts pelvic morphology changes in hominin fossils").  
  - **Null Model Specification**: The null is *non-adaptive causation* (e.g., genetic drift, developmental constraints) with explicit effect sizes.  
  - **Out-of-Sample Validation**: Testing on independent data (e.g., cross-cultural universals, extinct hominin behavior inferred from artifacts).  
  - **Identifiability Constraints**: Using *instrumental variables* (e.g., biogeographic isolation events) to disentangle selection histories.  
  - **Model Comparison**: Competing hypotheses (e.g., adaptation vs. spandrel) evaluated via *AIC/BIC* with penalized complexity.  

  ---

  ### Residue Report: What Survives, What Distorts, and What’s Lost  

  #### Clean Mappings  
  1. **Overfitting ⇔ Just-So Story Flexibility**  
     - Both describe exploiting unconstrained assumptions to fit data.  
  2. **Pre-Registration ⇔ A Priori Predictions**  
     - Pre-specifying tests avoids narrative retrofitting.  
  3. **Out-of-Sample Testing ⇔ Cross-Validation**  
     - Independent evidence (e.g., archaeology) acts as holdout data.  

  #### Forced Distortions  
  1. **Spandrel ≠ Null Model**  
     - *Distortion*: Statistical nulls (e.g., no relationship) lack the *positive causal structure* of spandrels (e.g., developmental byproducts).  
     - *Why*: Spandrels imply structured non-adaptive causes, not just noise.  
  2. **Adaptation ≠ Low Prediction Error**  
     - *Distortion*: A model fitting a trait well doesn’t entail *historical selection*—it could fit equally well to drift or constraint.  
     - *Why*: EP claims are causal-historical; curve-fitting is correlational.  
  3. **Identifiability ≠ Historical Uncertainty**  
     - *Distortion*: Statistical non-identifiability concerns parameter estimation, not *temporal inaccessibility* of ancestral environments.  
     - *Why*: We can’t randomize Pleistocene societies—this is an ontological, not statistical, limit.  

  #### What Does Not Survive Translation  
  1. **Causation vs. Correlation**  
     - Statistical models infer patterns; EP asserts *specific historical causal pathways* (e.g., "selection *for* X"). No statistical term captures this.  
  2. **Trait Complexity**  
     - Traits (e.g., "jealousy") aren’t cleanly quantifiable variables—operationalization adds epistemic noise.  
  3. **Ancestral State Uncertainty**  
     - Reconstructing past environments involves *hermeneutic interpretation* (e.g., fossilized behaviors), not measurement error.  

  #### Philosophical Implications  
  - **Where Stats Exposes Imprecision**:  
    - EP critics conflate *methodological laxity* (fixable via pre-registration) with *ontological irreparability* (unknowable past causes).  
    - Defenders confuse *model fit* (e.g., cross-cultural universals) with *causal evidence* (selection’s historical action).  
  - **Where Philosophy Adds Value**:  
    - The debate’s core—whether EP can access *historical truth*—transcends model selection. Statistics can’t resolve if a well-regularized model is *explanatory* or merely *predictive*.  

  #### Verdict  
  The statistical vocabulary **sharpens methodological critiques** (e.g., post hoc fitting) but **fails to capture the historical ontology** central to the debate. Adaptationist claims require causal narratives beyond fitted models, while critics rightly note that statistical rigor alone can’t resurrect the past. The residue reveals a **category error**: EP defenders often treat *predictive adequacy* as proof of *historical causation*, while critics mistake *epistemic limits* for *fatal flaws*. The debate’s unresolved core isn’t statistical—it’s about whether selectionist histories can be credibly inferred *at all* given the data-generating process’s inaccessibility.
