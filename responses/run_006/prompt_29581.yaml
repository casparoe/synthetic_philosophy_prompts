prompt: |-
  Been trying to sort out my views on the ethics of belief lately, partly because my best friend got accussed of something at work and I noticed I was still believing her on evidence I'd never accept from a stranger. Before I commit to anything I want a consistency check on five things I'm inclined to hold. (1) A Clifford-style evidentialism: a belief is justified only if your evidence supports it, and wanting it to be true doesn't count. (2) Anti-pragmatic encroachment: practical stakes don't change the threshold for justified belief; high stakes mean you should check more, not that you need more evidence for the same belief. (3) Doxastic involuntarism: you can't believe at will, so any epistemic ought has to attach to what you do control—inquiry, attention, which sources you trust. (4) Epistemic partiality: you're allowed, maybe required, to keep trusting a friend's word in cases where you'd doubt the same story coming from a stranger. (5) Self-fulfilling beliefs: there are cases where believing ahead of your evidence is okay because the believing helps make the thing true, like confidence that a fragile relationship will last or that you can finish a hard project. I keep telling myself these mostly cohere, but I might be papering over something. Go through the pairs: which are genuinely in tension, which only look like they are, rank the real tensions by severity, and tell me the cheapest revision and which single change would clean up the most.
reasoning: |-
  Okay, the user is grappling with the ethics of belief, especially after their friend was accused of something at work. They've listed five principles they're inclined to hold and want a consistency check. Let me start by understanding each point clearly.

  First, evidentialism: belief justified only by evidence, desires don't count. That's straightforward Clifford. Then anti-pragmatic encroachment: stakes shouldn't change evidence threshold, just how much you check. Doxastic involuntarism says you can't believe at will, so oughts apply to inquiry, attention, etc. Epistemic partiality allows trusting friends more than strangers. Self-fulfilling beliefs justify believing ahead of evidence if it helps make the belief true.

  Looking for tensions. Evidentialism and partiality clash because partiality lets you trust a friend with less evidence than a stranger. That's a big one. Also, self-fulfilling beliefs conflict with evidentialism since you believe without sufficient evidence. Anti-pragmatic encroachment and self-fulfilling might have issues if high stakes require more evidence, but self-fulfilling might need early belief. But the user's anti-pragmatic stance says stakes don't change evidence thresholds, so maybe not a direct clash. 

  Doxastic involuntarism seems compatible with the others since it focuses on control over inquiry, not belief itself. Evidentialism and anti-pragmatic can coexist if checking more doesn't alter justification standards. 

  Ranking tensions: Epistemic partiality vs. evidentialism is the worst because it directly challenges evidence as the sole justifier. Self-fulfilling vs. evidentialism is next. Then partiality vs. anti-pragmatic might be minor if partiality affects inquiry, not thresholds. 

  Cheapest fix? Reframe partiality as affecting inquiry, not belief. So, you investigate your friend's claim more but eventually need evidence. For self-fulfilling, treat it as a practical reason influencing action, not belief. The biggest fix would be dropping evidentialism for a pluralist view allowing non-evidential justifiers. 

  User's scenario: They trust their friend despite weaker evidence. They might need to justify that trust without compromising their principles. Underlying needs could be balancing loyalty with rationality, avoiding guilt over partiality. They want coherence to feel intellectually honest while maintaining relationships. Recommending reframing partiality as part of inquiry might satisfy both without abandoning evidentialism.
answer: |-
  Your five commitments create a fascinating but unstable philosophical alloy. Here's a breakdown of tensions, ranked by severity, followed by revision strategies:

  **Core Tensions (Ranked by Severity):**

  1.  **Evidentialism (1) vs. Epistemic Partiality (4):** (Severe Tension)
      *   **Conflict:** This is the most direct and severe clash. Evidentialism demands justification *solely* from evidence. Epistemic partiality explicitly permits (or requires) holding a belief *based on the source* (your friend) where the *same evidence* from a stranger would be insufficient. This violates Clifford's core principle. Wanting to believe your friend *is* influencing your belief in a way evidentialism forbids.
      *   **Why it's severe:** It strikes at the heart of both (1) and (4). If partiality is justified, then evidence alone isn't sufficient/necessary for justification in these cases, contradicting (1). If evidentialism holds, then partiality is an irrational bias.

  2.  **Evidentialism (1) vs. Self-Fulfilling Beliefs (5):** (Major Tension)
      *   **Conflict:** Evidentialism requires sufficient evidence *now*. Self-fulfilling beliefs explicitly involve believing *ahead* of sufficient evidence, justified by the *future consequences* of the belief (making the proposition true). This pragmatic justification for belief contradicts the purely evidential basis required by (1).
      *   **Why it's major:** While (5) carves out a specific exception, it directly violates the core principle of (1) – evidence is the *only* justifier. The "because it helps make it true" is a pragmatic, not evidential, reason for belief.

  3.  **Epistemic Partiality (4) vs. Anti-Pragmatic Encroachment (2):** (Moderate Tension)
      *   **Conflict:** Anti-pragmatic encroachment says stakes shouldn't raise the *evidential threshold* for justified belief. However, epistemic partiality effectively *lowers* the evidential threshold for a specific source (your friend). If high stakes *don't* raise the bar, why should a personal relationship *lower* it? Both involve non-evidential factors affecting the standard of evidence required.
      *   **Why it's moderate:** It's less direct than the first two. You *could* argue partiality isn't about the *threshold* per se, but about the *weight* assigned to evidence from a trusted source (though this often amounts to the same thing). It highlights a potential inconsistency in applying non-evidential factors.

  **Potential Tensions (Manageable with Care):**

  4.  **Self-Fulfilling Beliefs (5) vs. Anti-Pragmatic Encroachment (2):**
      *   **Potential Conflict:** In high-stakes self-fulfilling scenarios (e.g., saving a crucial relationship), one might argue the pragmatic encroachment advocate would say you need *more* evidence to believe optimistically, while (5) says you should believe *without* that evidence *because* it's necessary for success. (2) denies stakes change the threshold, so (5) isn't *more* threatened in high stakes.
      *   **Why it's manageable:** Your (2) actually *helps* (5) in high-stakes cases by denying the threshold rises. The main tension for (5) is with (1), not directly with (2). (2) and (5) can coexist if (5) is accepted as an exception.

  5.  **Doxastic Involuntarism (3) & All Others:**
      *   **Compatibility:** (3) is surprisingly compatible with the others, *if* framed correctly. It shifts the "ought" from the *belief state itself* to the *activities leading to it* (inquiry, attention, trust calibration). You can hold (1), (2), (4), and (5) *within* this framework:
          *   (1) You ought to inquire/attend to get sufficient evidence.
          *   (2) High stakes mean you ought to inquire *more thoroughly* (but the justification standard remains fixed).
          *   (4) You ought to maintain a stance of trust towards your friend's testimony *by default* (as part of your "source trust" policy), requiring counter-evidence to override it, whereas you start from distrust with strangers.
          *   (5) You ought to engage in actions/mental practices that cultivate a hopeful attitude (acting *as if*), knowing this attitude contributes to the outcome, even while recognizing your *full belief* awaits evidence.

  **Ranking of Real Tensions by Severity:**
  1.  Evidentialism (1) vs. Epistemic Partiality (4) (Severe)
  2.  Evidentialism (1) vs. Self-Fulfilling Beliefs (5) (Major)
  3.  Epistemic Partiality (4) vs. Anti-Pragmatic Encroachment (2) (Moderate)

  **Revision Strategies:**

  1.  **Cheapest Revision (Minimal Change, Preserves Core):**
      *   **Reframe Epistemic Partiality (4) within Doxastic Involuntarism (3):** Instead of partiality justifying the *belief itself*, frame it as governing *inquiry* and *default trust*. You *owe* your friend a *presumption of honesty* and a *more thorough investigation* before doubting them. This means:
          *   You don't dismiss the accusation outright (violating (1)).
          *   You actively seek evidence *for* your friend's innocence *more diligently* than you would for a stranger (satisfying loyalty).
          *   The *justification for belief* still ultimately depends on the *evidence gathered* through this partial inquiry (satisfying (1)). If the evidence points against your friend, (1) demands you adjust your belief.
      *   **Reframe Self-Fulfilling Beliefs (5) as Practical, Not Doxastic:** Treat the "belief" in (5) as a *practical stance* or *hopeful action-guiding assumption*, not a full-blown epistemic belief. You *act confidently* on the project or relationship because that action *is* necessary for success, while acknowledging your *evidential confidence* ("belief" in the strict sense of (1)) is lower. This "acting as if" is controlled (per (3)).

  2.  **Revision with Highest Impact (Cleans Up Most Tensions):**
      *   **Modify/Abandon Strict Cliffordian Evidentialism (1):** Adopt a more *pluralistic* view of justification. Allow that factors like:
          *   **Relationship (Partiality):** The depth of a relationship *can* be a legitimate (though defeasible) source of justification for testimony, altering the evidential threshold required *in that specific context*.
          *   **Pragmatic Role (Self-Fulfilling):** The essential role a belief plays in bringing about a desired outcome *can* provide pro-tanto justification for adopting/holding it, especially when evidence is unavoidably limited *at the crucial time*.
      *   **Impact:** This directly resolves tensions #1 and #2. It also eases tension #3, as both partiality and (potentially) stakes could now be seen as legitimate non-evidential factors influencing justification standards (though you'd need to reconcile this with your desire to keep (2) - anti-pragmatic encroachment might become harder to maintain). (3) remains compatible.

  **Recommendation:**

  The **Cheapest Revision** (reframing (4) & (5) using (3)) is likely the most viable path forward while retaining the core spirit of your commitments. It allows you to:
  *   Maintain strict evidentialism for belief justification (1).
  *   Keep stakes irrelevant to the justification threshold (2).
  *   Honor your loyalty to your friend through your *actions* (investigative diligence, presumption of honesty requiring rebuttal) without demanding you believe against evidence (4).
  *   Pursue goals optimistically through deliberate action and hopeful assumption, without claiming insufficiently evidenced *belief* is epistemically justified (5).

  This approach directly addresses your experience with your friend: your "belief" stems from a default trust stance owed to her, triggering a more rigorous *investigation* to *gather evidence* that *will* ultimately justify your belief (or force you to revise it). It wasn't that the evidence was *less*; it was that your *starting point for inquiry* was different, and you were committed to digging deeper before concluding. This satisfies the demands of loyalty without sacrificing evidential rigor.
