prompt: |-
  You are a professional philosopher of mind with expertise in the metaphysics and science of consciousness, and you have been asked to serve as the neutral facilitator for an adversarial collaboration between two camps on the meta-problem of consciousness.

  The first camp is a Chalmers-style phenomenal realist. It holds that there is a hard problem of consciousness: explaining why and how physical processing gives rise to subjective experience, or what it is like to be a subject. On this view, the meta-problem—the problem of explaining why we have the powerful intuition that there is a hard problem, and why we produce the phenomenal reports and judgments we do—is a distinct, largely empirical problem. Solving the meta-problem may clarify the sources of our phenomenal intuitions and even help with the hard problem, but it does not by itself dissolve or debunk the hard problem.

  The second camp is a Frankish-style illusionist. It holds that phenomenal consciousness, understood as a realm of qualitative properties over and above functional, representational, dispositional, and physical facts, is an illusion. On this view, the meta-problem is the central problem: the task is to explain why creatures like us are so strongly convinced that we have such properties. A completed explanation of these intuitions, one that does not itself invoke phenomenal properties, would debunk the intuitions rather than vindicate them.

  Think carefully before you write. In your first pass, brainstorm: (a) claims about phenomenal reports, introspective confidence, and the explanatory gap that both camps could honestly sign; (b) the places where each camp would reject a formulation as slanted; and (c) which apparent disagreements might be partly verbal and which are substantive. Then draft the document.

  Your deliverable is the joint statement these two camps could both sign after a good-faith adversarial collaboration, with the residual disagreement made exact. It must contain the following parts.

  1. Agreed claims. A numbered list of substantive, non-vacuous claims both camps accept. Cover at least: the behavioral and introspective data to be explained (e.g., that people report phenomenal states, find them introspectively obvious, and find physical-functional explanations of them unsatisfying); what the meta-problem asks; what a solution to the meta-problem must do; and constraints on any acceptable explanation of phenomenal reports. Avoid phrasing these so weakly that they are uninformative.

  2. Disagreements table. A table with one row per point of disagreement. Columns: (i) the issue in neutral wording; (ii) the realist's preferred formulation of its own view, which a careful realist would sign; (iii) the illusionist's preferred formulation of its own view, which a careful illusionist would sign; (iv) whether the disagreement is substantive or partly verbal, with a one-sentence note if it is partly verbal. Rows should include at least: whether explaining the intuitions debunks them or leaves the explanatory gap untouched; whether introspective conviction has a special epistemic authority; whether phenomenal properties are needed to explain anything beyond the reports themselves; and whether the conceivability of zombies or the apparent explanatory gap is evidence for realism or just another intuition to be explained away.

  3. Cruxes and tests. Identify the sub-questions such that settling them would move at least one camp. For each crux, specify a concrete case, experimental manipulation, or argument that both camps would accept as bearing on it, and record in advance each camp's prediction about what that test would show and what result would count as a concession or would significantly shift that camp's view. Include at least one crux about dissociations between reports and first-order function (for example, blindsight, change blindness, or subjective inflation), one about a mechanism-level model that predicts and manipulates people's phenomenal intuitions, and one about a hypothetical system built to reproduce human phenomenal reports while remaining functionally and physically specified but lacking, by stipulation, whatever the realist means by phenomenality.

  Do not include a bibliography or reading list. The statement should stand on the content of the two views, not on citations.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between phenomenal realists (Chalmers-style) and illusionists (Frankish-style) on the meta-problem of consciousness. The goal is to find common ground and clarify disagreements.

  First, brainstorm:

  (a) Claims both camps could honestly sign:

  1. People report having phenomenal states (e.g., "I see red", "I feel pain") and express strong introspective confidence in these reports.
  2. People often find physical or functional explanations of consciousness unsatisfying, leading to an intuition of an "explanatory gap".
  3. The meta-problem is the problem of explaining why we have these reports, judgments, and intuitions about phenomenal consciousness.
  4. A solution to the meta-problem must provide a causal/mechanistic explanation for the occurrence and content of phenomenal reports and intuitions, without presupposing the truth of phenomenal realism (i.e., it should be consistent with either realism or illusionism).
  5. An acceptable explanation of phenomenal reports must be grounded in empirically supported cognitive and neural mechanisms.
  6. Solving the meta-problem is an important scientific and philosophical endeavor.

  (b) Places where each camp would reject a formulation as slanted:

  - Realists might reject any formulation that implies that explaining the meta-problem would dissolve the hard problem or that phenomenal properties are reducible without remainder.
  - Illusionists might reject formulations that treat phenomenal properties as given or that suggest introspective reports are incorrigible.

  (c) Apparent disagreements:

  - Verbal: The term "consciousness" might be used differently. Realists typically mean phenomenal consciousness (subjective experience), while illusionists might argue that what we call consciousness is really a set of functional processes and that the phenomenal aspect is illusory. However, both can agree on the behavioral and introspective data to be explained.
  - Substantive: 
    - Whether the explanatory gap is a reflection of a real metaphysical gap or just a cognitive illusion.
    - Whether introspective confidence provides strong evidence for the existence of phenomenal properties or is just a report that needs explanation.
    - Whether the conceivability of zombies (physically identical but lacking consciousness) is evidence for non-physical properties or just a cognitive error.

  Now, draft the document:

  **Joint Statement on the Meta-Problem of Consciousness**

  **1. Agreed Claims**

  The following claims are accepted by both camps:

  1. **Phenomenal Reports and Judgments**: Humans reliably report having subjective experiences (phenomenal states) and make judgments about them (e.g., about qualia, what it's like). These reports are accompanied by high introspective confidence and are widespread across cultures.

  2. **Explanatory Gap Intuition**: There is a robust intuition that physical and functional accounts of the mind leave an "explanatory gap" — that is, they seem insufficient to fully explain subjective experience. This intuition is often expressed in philosophical thought experiments (e.g., zombies, knowledge argument) and in ordinary discourse.

  3. **The Meta-Problem**: The meta-problem of consciousness is the problem of explaining why humans have the specific phenomenal reports, judgments, and intuitions (including the explanatory gap intuition) that we do. It asks for a causal explanation of these phenomena.

  4. **Requirements for a Solution**: A solution to the meta-problem must:
     - Be an empirically grounded explanation in terms of cognitive, neural, and ultimately physical processes.
     - Account for the content and strength of phenomenal reports and the persistence of the explanatory gap intuition.
     - Not rely on the existence of irreducibly phenomenal properties in the explanation (i.e., the explanation should be consistent with both realism and illusionism).

  5. **Constraints on Explanation**: Any acceptable explanation of phenomenal reports must:
     - Be compatible with the broader scientific understanding of human cognition and neuroscience.
     - Explain both typical and atypical cases (e.g., altered states, illusions, disorders) of phenomenal reports and judgments.

  6. **Value of Solving the Meta-Problem**: Solving the meta-problem is a significant scientific achievement that will clarify the origins of our intuitions about consciousness and may have implications for the hard problem.

  **2. Disagreements Table**

  | Issue (Neutral Wording) | Realist's Formulation | Illusionist's Formulation | Substantive or Partly Verbal | Note if Partly Verbal |
  |-------------------------|------------------------|---------------------------|------------------------------|------------------------|
  | Does explaining the meta-problem debunk phenomenal intuitions or leave the explanatory gap untouched? | Explaining why we have the intuition of an explanatory gap does not by itself close the gap or show that phenomenal properties are illusory; it leaves the hard problem of consciousness intact. | A complete explanation of the meta-problem, which accounts for phenomenal reports and intuitions without invoking phenomenal properties, debunks the intuition that there is a hard problem and shows that phenomenal consciousness (as ordinarily conceived) is an illusion. | Substantive | |
  | Does introspective conviction about phenomenal states have special epistemic authority? | Introspective reports about phenomenal states are not infallible, but the strong introspective conviction we have provides prima facie evidence for the existence of phenomenal properties that cannot be fully explained away by third-person accounts. | Introspective conviction is a psychological state that can be explained by cognitive mechanisms; it does not provide privileged access to non-physical properties and is subject to error and illusion like other judgments. | Substantive | |
  | Are phenomenal properties needed to explain anything beyond the reports themselves? | Phenomenal properties play an irreducible role in explaining certain behaviors (e.g., why we avoid pain) and cognitive processes (e.g., attention, learning) and cannot be fully captured by functional or physical explanations. | Phenomenal properties, as non-functional properties, are not needed to explain any behavior or cognitive process; all relevant phenomena can be explained by functional, representational, and physical processes. | Substantive | |
  | Is the conceivability of zombies or the apparent explanatory gap evidence for realism, or just another intuition to be explained? | The conceivability of zombies and the apparent explanatory gap are evidence that phenomenal consciousness is not logically supervenient on the physical, pointing to a metaphysical distinction. | The conceivability of zombies and the explanatory gap intuition are themselves products of cognitive mechanisms and do not provide evidence for non-physical properties; they are part of the meta-problem to be explained. | Substantive | |
  | What is the referent of "consciousness" in ordinary discourse? | Ordinary phenomenal concepts refer to real, irreducible phenomenal properties. | Ordinary phenomenal concepts are mistaken; they purport to refer to non-functional properties, but no such properties exist. | Partly Verbal | The disagreement hinges on whether our concepts successfully refer to the properties they seem to. |

  **3. Cruxes and Tests**

  We identify key cruxes and tests that could shift views:

  1. **Crux: Dissociation between reports and first-order function**  
     - **Test Case**: Study of blindsight patients (who can discriminate visual stimuli without reporting conscious vision) and their phenomenal reports. Also, experiments on change blindness and inattentional blindness, and cases of subjective inflation (e.g., under hypnosis or suggestion, reporting vivid experiences without corresponding functional changes).  
     - **Realist Prediction**: In blindsight, the absence of phenomenal reports corresponds to an absence of phenomenal consciousness, despite preserved function. In subjective inflation, the report of vivid experience without functional change might be a false report, but if verified, it would challenge functionalism. Realists would expect that changes in phenomenal reports often track changes in phenomenality.  
     - **Illusionist Prediction**: Blindsight shows that visual function can occur without the accompanying cognitive mechanisms that produce phenomenal reports. Subjective inflation shows that reports can be manipulated independently of first-order processing. Illusionists would expect that phenomenal reports can be dissociated from first-order function by manipulating reporting mechanisms.  
     - **Concession**: If a dissociation shows that phenomenal reports can be systematically altered without any change in first-order processing (and vice versa), realists might concede that reports are not always reliable, but maintain that they are generally reliable. Illusionists would see this as evidence that phenomenality is not a functional property. If no such dissociation is found, illusionists might concede that reports are tightly linked to function, but argue that the link is functional.

  2. **Crux: Mechanism-level model predicting and manipulating phenomenal intuitions**  
     - **Test**: Develop a computational or neural model that predicts when and why people report explanatory gaps (e.g., in response to certain thought experiments) and manipulate the model's parameters to alter these reports. For example, a model that links the gap intuition to cognitive limitations (e.g., in conceptualizing complex systems) and then experimentally induce or reduce the intuition by training or cognitive load.  
     - **Realist Prediction**: While such a model might explain the cognitive basis of the intuition, it would not eliminate the hard problem. The intuition might be modulated, but the underlying metaphysical gap remains. Realists would not see this as resolving the hard problem.  
     - **Illusionist Prediction**: A successful model that predicts and manipulates gap intuitions without invoking phenomenal properties would support illusionism by showing that the intuition is a cognitive construct.  
     - **Concession**: If the model fully accounts for the intuition without residue, realists might concede that the intuition is explained but hold that the gap is still metaphysical. Illusionists would take this as strong evidence for their view. If the model fails to capture key aspects, illusionists might need to refine it, while realists might see it as evidence that the intuition points to something real.

  3. **Crux: Hypothetical system that reproduces reports without phenomenality**  
     - **Test**: Consider a hypothetical system (e.g., an AI) that is functionally and physically isomorphic to a human in all relevant respects, producing identical verbal and non-verbal reports about consciousness, but stipulated by the realist to lack phenomenality (a zombie). Both camps must agree that such a system is at least logically possible (for realists) or that if built, it would be indistinguishable from a conscious system (for illusionists).  
     - **Realist Prediction**: Realists hold that such a zombie is conceivable and metaphysically possible, and that we would not know if we were interacting with one (since behavior is identical). Therefore, they would say that even if we build such a system, its lack of phenomenality would be undetectable but real.  
     - **Illusionist Prediction**: Illusionists argue that such a system would be conscious (because consciousness is functional) or that the concept of a zombie is incoherent. If we can build a system that passes all functional tests for consciousness, then it is conscious, and the stipulation of lacking phenomenality is empty.  
     - **Concession**: If a zombie is built and behaves indistinguishably, realists might still maintain it lacks consciousness, but illusionists would argue that this shows the concept of non-functional phenomenality is vacuous. Conversely, if building such a system proves impossible (i.e., functional isomorphs always have phenomenality), realists might see this as evidence for supervenience, but illusionists would say it confirms that consciousness is functional.

  This statement represents our current agreements and disagreements. We commit to revising our views in light of new evidence, especially from the tests outlined.
answer: |-
  ### Joint Statement on the Meta-Problem of Consciousness  

  #### 1. Agreed Claims  
  Both camps affirm the following substantive, non-vacuous claims regarding the meta-problem of consciousness:  

  1. **Phenomenal Reports and Introspective Confidence**: Humans reliably produce reports about subjective experiences (e.g., "I see red," "I feel pain"), which are characterized by high introspective confidence. These reports are robust across cultures, contexts, and individuals, and they are treated as epistemically compelling in ordinary discourse.  
     
  2. **Explanatory Gap Intuitions**: Humans consistently report an "explanatory gap"—the intuition that physical or functional accounts of mental processes (e.g., neural correlates, computational models) fail to fully explain subjective experience. This gap manifests in philosophical thought experiments (e.g., zombies, inverted qualia) and everyday reasoning.  

  3. **Meta-Problem Definition**: The meta-problem is the project of explaining why humans generate phenomenal reports, exhibit introspective confidence, and experience the explanatory gap intuition. It seeks a causal, mechanistic account of these phenomena.  

  4. **Requirements for a Solution**: A solution to the meta-problem must:  
     - Provide a testable, naturalistic explanation (e.g., cognitive, neural, or evolutionary) for the origins and content of phenomenal reports, introspective confidence, and gap intuitions.  
     - Be empirically grounded, relying on data from psychology, neuroscience, and related fields.  
     - Explain both typical cases (e.g., ordinary perceptual experiences) and atypical cases (e.g., hallucinations, blindsight, altered states).  

  5. **Constraints on Explanations**: Any acceptable explanation of phenomenal reports must:  
     - Avoid circularity by not presupposing the existence of irreducibly phenomenal properties in the explanans.  
     - Account for the cultural and developmental variability in phenomenal judgments while explaining their cross-contextual stability.  
     - Be compatible with the broader framework of scientific physicalism (i.e., no appeals to supernatural or non-natural causes).  

  6. **Meta-Problem’s Significance**: Solving the meta-problem is scientifically valuable for understanding human cognition. It may clarify the relationship between first-person reports and third-person mechanisms, regardless of its implications for the hard problem.  

  #### 2. Disagreements Table  
  The following table outlines unresolved disagreements. Each camp’s preferred formulation is stated in its own terms.  

  | Issue (Neutral Wording) | Realist’s Preferred Formulation | Illusionist’s Preferred Formulation | Substantive or Partly Verbal | Note if Partly Verbal |
  |-------------------------|---------------------------------|-------------------------------------|------------------------------|------------------------|
  | Does solving the meta-problem debunk phenomenal intuitions or leave the hard problem intact? | A complete explanation of the meta-problem clarifies the psychological origins of our phenomenal intuitions but does not resolve the hard problem; the explanatory gap persists as a metaphysical issue. | A complete explanation of the meta-problem debunks phenomenal intuitions by revealing them as cognitive illusions; no further "hard problem" exists. | Substantive | |
  | Does introspective confidence confer special epistemic authority? | Introspective confidence provides defeasible but prima facie justification for believing in phenomenal properties, as it directly accesses subjective experience. | Introspective confidence is a report-generating mechanism with no privileged access to truth; it is explained by cognitive processes and can be systematically misleading. | Substantive | |
  | Are phenomenal properties necessary to explain phenomena beyond reports? | Phenomenal properties are causally relevant to non-report behaviors (e.g., pain avoidance) and cognitive processes (e.g., attention), and their omission leads to explanatory incompleteness. | Phenomenal properties are not necessary to explain any behavior or cognitive process; all phenomena are fully explicable via functional, representational, and physical properties alone. | Substantive | |
  | Does the conceivability of zombies or the explanatory gap intuition support realism? | The conceivability of zombies and the stubbornness of the explanatory gap intuition provide evidence that consciousness does not logically supervene on the physical. | The conceivability of zombies and gap intuitions are psychological data points to be explained by the meta-problem; they offer no evidence for non-physical properties. | Partly Verbal | Disagreement hinges on whether "evidence" implies metaphysical insight (realist) or cognitive artifact (illusionist). |
  | What is the status of phenomenal concepts? | Phenomenal concepts refer to irreducibly subjective properties and cannot be fully analyzed in physical/functional terms. | Phenomenal concepts are empty or erroneous; they misrepresent functional states as having intrinsic qualitative properties. | Partly Verbal | Disagreement stems from divergent theories of reference (e.g., direct reference vs. descriptivist). |

  #### 3. Cruxes and Tests  
  The camps identify the following cruxes, where empirical or conceptual tests could shift views. Predictions and conditions for concession are specified.  

  1. **Crux: Dissociation between reports and first-order function**  
     - **Test Case**: Experimental manipulation of subjective inflation—e.g., using suggestion or neurostimulation to induce vivid phenomenal reports (e.g., "phantom light") without corresponding changes in first-order visual function (e.g., discrimination accuracy). Blindsight and change blindness serve as baseline contrasts.  
     - **Realist Prediction**: Subjective inflation will correlate with neural markers of "phenomenality" (e.g., recurrent processing); dissociations between reports and function will be rare and explicable via noise. A robust dissociation would challenge functionalism but not realism.  
     - **Illusionist Prediction**: Reports will dissociate from first-order function under manipulation, revealing them as separable cognitive processes. Concession if no dissociation is found across multiple paradigms.  
     - **Outcome Significance**: Robust dissociation supports illusionism; tight coupling supports realism.  

  2. **Crux: Mechanism-level model of phenomenal intuitions**  
     - **Test Case**: Develop a computational model (e.g., a cognitive architecture) that predicts and manipulates gap intuitions. For example, use transcranial magnetic stimulation (TMS) to inhibit prefrontal regions implicated in metacognition, then measure reductions in gap reports (e.g., "Does this robot *really* feel pain?").  
     - **Realist Prediction**: The model may reduce gap intuitions but will not alter the underlying subjectivity; residual intuitions will persist. Concession if the model eliminates gap intuitions without residue.  
     - **Illusionist Prediction**: The model will fully explain and modulate gap intuitions, linking them to metacognitive limitations. Failure to predict intuitions would require model revision.  
     - **Outcome Significance**: A complete model favors illusionism; irreducibly "hard" residuals favor realism.  

  3. **Crux: Hypothetical system with human-like reports without phenomenality**  
     - **Test Case**: Imagine a functionally identical AI system that reproduces human phenomenal reports (e.g., "I experience red") but is stipulated by realists to lack phenomenality. Debate whether its reports are epistemically equivalent to humans'.  
     - **Realist Prediction**: The system’s reports are not authoritative; we could conceive of it as a "zombie." Verbatim replication of reports would not prove phenomenality. Concession if no coherent distinction remains.  
     - **Illusionist Prediction**: The system’s reports are functionally identical to humans', rendering "lacking phenomenality" incoherent; any failure to replicate reports would imply functional differences.  
     - **Outcome Significance**: If the zombie is coherent, realism gains plausibility; if incoherent, illusionism is strengthened.  

  ---  
  This statement reflects our shared ground and exact points of divergence. We agree that resolving the cruxes through collaborative research could substantially alter our positions.
