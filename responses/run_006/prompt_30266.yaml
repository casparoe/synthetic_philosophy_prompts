prompt: |-
  So this argument broke out at a meetup last week and I've been turning it over ever since. Two friends of mine, both pretty serious about rationality and both read the sequences back in the day, got into it about a third friend's investment decision. I'll call them Nate and Chloe.

  The situation: our mutual friend Derek put about $15k — basically his entire savings at the time — into a crypto project two years ago. At the time, the project had basically every red flag: anonymous team, plagiarized whitepaper, promises of guaranteed returns, the works. Multiple people told Derek it looked like a scam. He said he had a "good feeling" about it. Fast forward to today: the token did a 200x, Derek cashed out near the top, and he's sitting on about three million dollars.

  Here's how the argument went.

  Nate: Derek made an objectively terrible decision. The expected value was clearly negative given the information available to him. The fact that it worked out is pure luck. If you run that decision a thousand times, Derek is broke in 990 of them.

  Chloe: But we don't have a thousand runs. We have one run, and in that run, Derek made three million dollars. By what metric was that a bad decision? You're defining "good decision" in a way that's completely disconnected from results.

  Nate: I'm defining it in terms of the decision procedure. If someone drives drunk and gets home safely, they still made a bad decision. The outcome doesn't retroactively make the decision good. This is basic — it's like, the first thing you learn about evaluating decisions under uncertainty.

  Chloe: The drunk driving analogy is misleading because we have massive amounts of data telling us drunk driving is dangerous. With a novel crypto project, the base rates are much murkier. Derek might have been picking up on real signals that your checklist missed. The fact that he bet big and won is Bayesian evidence that his "good feeling" was tracking something real — maybe not consciously, but the outcome updates us toward "Derek has some ability to spot real projects that look like scams."

  Nate: That's exactly the error. You're using the outcome as evidence about the decision quality, but you can only do that if you have a reference class. The reference class here is "crypto projects with anonymous teams and plagiarized whitepapers that promise guaranteed returns." In that reference class, the success rate is approximately zero. Derek got the one-in-a-thousand outcome. Using that to update your model of Derek's judgment is textbook survivorship bias.

  Chloe: But your reference class is question-begging. Why is the relevant reference class "projects with those specific red flags" rather than "projects Derek felt good about"? If Derek has a track record — and he does now — of betting on things that succeed, then "projects Derek feels good about" starts looking like a pretty good reference class. You're assuming the red flags are the right way to carve reality, but maybe Derek is tracking something those red flags don't capture.

  Nate: He has a track record of one! One data point! You can't build a reference class out of one data point. That's not how any of this works.

  Chloe: Sure, one data point is weak evidence. But it's not zero evidence. And more importantly, you're dodging the deeper point: if we never let outcomes update our models of what good decision procedures are, then our models of good decision procedures become completely untethered from reality. They become just... kinda aesthetic preferences about what kinds of reasoning sound good. At some point the map has to answer to the territory, and the territory is outcomes.

  Nate: The territory is the distribution of outcomes across the reference class, not the single outcome. You're confusing the territory with a tourist photo of the territory.

  Chloe: And you're confusing a model with the thing it's modeling. Your reference class is a model. It might be wrong. Derek's success is a reason — not a conclusive reason, but a reason — to think it's wrong, or at least that it doesn't carve the world at the joints the way you think it does.

  At this point someone changed the subject and they never resolved it. I've been trying to figure out who's right about what. Can you go through their exchange move by move and adjudicate? I'm especially interested in whether Chloe's point about reference classes being models that need to answer to outcomes is actually a good point or just a sophisticated way of comitting the outcome bias, and whether Nate is right that the whole thing reduces to "don't update on a single data point" or whether that's too quick.
reasoning: |-
  Okay, let me unpack this fascinating debate between Nate and Chloe. The core issue revolves around Derek's crypto investment that defied all rational expectations. Nate insists it was a terrible decision based on the red flags, while Chloe argues the outcome suggests Derek's intuition might have been onto something.

  First, I need to understand Nate's position. He's firmly in the expected value camp - the decision should be judged by the process, not the outcome. His drunk driving analogy seems strong initially because we have robust statistics showing its danger. But Chloe rightly points out crypto scams lack that data foundation. That's a crucial distinction - when base rates are fuzzy, maybe intuition deserves more weight?

  Chloe's challenge about reference classes keeps nagging at me. Nate defines the reference class narrowly by red flags, but what if Derek's gut feeling creates a different reference class? If we never let outcomes update our models, don't we risk creating decision theories detached from reality? That "map vs territory" point feels profound.

  But then Nate counters brilliantly with "tourist photo" metaphor - a single outcome doesn't define the territory. And he's statistically correct that one data point proves nothing. Yet... Chloe's insistence that this at least warrants some Bayesian updating seems reasonable. Even weak evidence isn't zero evidence.

  The more I sit with this, the more I see both have valid points. Nate wins on pure decision theory - Derek's choice was reckless by any rational standard. But Chloe exposes a flaw in how we apply decision theory to novel domains. When reference classes are poorly defined, maybe we should treat successful outliers as discovery opportunities rather than just luck.

  What's really smart is how Chloe reframes Derek's success not as justifying the decision, but as challenging Nate's reference class model. That's subtle and important. Meanwhile Nate correctly warns against overfitting to noise. 

  Ultimately I think Chloe's deeper point about models answering to reality is correct philosophically, but Nate's practical warning against over-updating on flukes is crucial. The resolution might lie in distinguishing between evaluating the original decision (Nate's right) versus updating future models (Chloe has a point).
answer: |-
  Let's break down this debate systematically, addressing the core philosophical and statistical tensions. Both Nate and Chloe make valid points, but they're arguing at different levels—Nate focuses on **decision quality at the time**, while Chloe questions **how we define "quality" in hindsight**. Here's a move-by-move adjudication:

  ### 1. **Nate's Opening: Expected Value Matters**
     - **Nate's Claim**: Derek's decision was terrible because the EV was negative based on known red flags (anonymity, plagiarism, guarantees). The outcome was pure luck.  
     - **Strength**: Objectively correct under classic decision theory. Given the reference class of similar scams, failure probability was near-certain. EV = (Probability of Success × Gain) - (Probability of Failure × Loss). With 99% failure odds, EV ≈ (0.01 × $3M) - (0.99 × $15k) = **-$14.7k** — deeply negative.  
     - **Weakness**: Assumes the reference class is perfectly defined (more on this later).

  ### 2. **Chloe's Counter: Results Matter in Reality**
     - **Chloe's Claim**: The outcome ($3M) proves Derek’s decision wasn’t bad *in this instance*. Ignoring outcomes risks decoupling "good decisions" from reality.  
     - **Strength**: Highlights a flaw in rigid EV frameworks: **If a model consistently contradicts reality, the model might be wrong**. Derek’s win *is* weak Bayesian evidence (1 data point) his intuition tapped into something.  
     - **Weakness**: Overstates the significance of 1 outcome. Success could easily be noise, not signal (e.g., lottery winners aren’t "skilled").

  ### 3. **Nate's Drunk Driving Analogy**
     - **Nate's Claim**: Like drunk driving, a bad process stays bad regardless of outcome.  
     - **Strength**: Analogies to high-predictability scenarios (drunk driving crashes ~10-15x more likely) work when base rates are solid.  
     - **Weakness**: Chloe correctly notes crypto scams lack clean base rates. Anonymity+plagiarism may correlate with scams 99% of the time, but what if Derek sensed the 1%? The analogy fails if Derek’s intuition *is* a relevant variable.

  ### 4. **Chloe's Bayesian Update Argument**
     - **Chloe's Claim**: Derek’s success is evidence his "good feeling" might track real signals.  
     - **Adjudication**:  
       - **Technically correct**: Bayes’ theorem *does* allow updating on any outcome. If prior belief was "Derek has 0.1% chance of having uncanny intuition," a $3M win might raise it to 1% (still low!).  
       - **But insufficient**: One success proves little. If Derek repeats this 10x and wins 3x, *then* Chloe’s point holds weight. Until then, Nate’s "survivorship bias" warning is valid.  
       - **Key nuance**: Chloe isn’t saying Derek’s decision *was* good—only that the outcome should nudge us to question Nate’s reference class.

  ### 5. **The Reference Class War**
     - **Nate’s Reference Class**: "Projects with anonymity/plagiarism/guarantees." → Near-zero success rate.  
     - **Chloe’s Reference Class**: "Projects Derek feels good about." → Now 1/1 success rate.  
     - **Adjudication**:  
       - **Nate is statistically safer**: Defining reference classes by observable features (red flags) is standard practice. Chloe’s class is unfalsifiable without Derek’s internal state.  
       - **But Chloe has a meta-point**: Reference classes *are* models, and models can be wrong. If reality repeatedly contradicts a model (e.g., Derek keeps winning against odds), the model must be updated. **This isn’t outcome bias—it’s scientific epistemology**.  
       - **Compromise**: Chloe’s view would hold if Derek had a *pre-existing* track record (e.g., 5/5 "good feeling" investments succeeded). With no prior data, Nate’s class is better.

  ### 6. **Chloe’s "Map vs. Territory" Argument**
     - **Claim**: If decision theory ignores outcomes, it becomes untethered from reality.  
     - **Adjudication**: **Profound and correct**. Rationality requires feedback loops. If a "good decision" model persistently leads to bad outcomes, the model is flawed. Conversely, if "bad decisions" keep working, we must ask why.  
     - **Caveat**: This doesn’t excuse Derek. It means we should:  
       - Re-examine Nate’s reference class (were the red flags *always* predictive?).  
       - Investigate Derek for hidden variables (e.g., insider knowledge? pattern recognition?).

  ### 7. **Nate’s "Tourist Photo" Retort**
     - **Claim**: A single outcome is a snapshot, not the territory (outcome distribution).  
     - **Adjudication**: **Statistically airtight**. One data point can’t define a distribution. Chloe’s demand to update models needs more evidence.

  ---

  ### Final Verdict
  - **Nate is closer on the specifics of Derek’s case**: Judged *at the time*, with no prior evidence of Derek’s intuition, this was a reckless bet. One success doesn’t justify the process.  
  - **But Chloe wins the philosophical battle**: 
    - Outcomes *must* inform our models. If Derek’s intuition keeps working, it’s irrational to dismiss it because of a checklist.  
    - Reference classes *are* provisional models. Extraordinary outcomes should prompt investigation, not dismissal.  
  - **Where both stumble**:  
    - **Nate** understates how weak crypto scam base rates are (e.g., Dogecoin had red flags yet succeeded).  
    - **Chloe** conflates *updating on Derek’s intuition* (legitimate) with *calling the original decision good* (fallacious outcome bias).  

  ### Practical Resolution
  1. **Derek’s decision**: Bad process, lucky outcome.  
  2. **Lesson for Nate**: If Derek repeats this success, research *why* instead of insisting it’s luck.  
  3. **Lesson for Chloe**: Demand more data points before concluding Derek has skill. One win ≠ a replicable edge.  
  4. **Broader takeaway**: Good decision-making balances **rigorous models** with **empirical humility**. Ignoring outcomes is dogma; overfitting to noise is folly.
