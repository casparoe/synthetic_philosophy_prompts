prompt: |-
  I've been going back and forth with a friend who's an econ PhD student about this St. Petersburg paradox thing, and honestly I can't tell whether I'm missing something deep or whether the whole thing is just mathematicians being confused by infinity. Here's the setup as I understand it: you flip a fair coin until it comes up heads, and if heads first appears on the nth flip you get 2^n dollars. The expected value is infinite — it's the sum over n of (1/2)^n times 2^n, which is 1 + 1 + 1 + ... forever — but obviously no actual person would pay more than maybe thirty bucks to play this game. And this has been a legit puzzle for like three centuries, with Bernoulli and a bunch of other people offering resolutions about diminishing marginal utility and finite bankrolls and whatnot.

  Here's the thing. I'm a software engineer, I work on systems that do Monte Carlo sampling and randomized algorithms, and I spend a lot of time thinking about what happens when you actually try to *run* a stochastic process rather than just stare at its mathematical definition. I want to understand this paradox in the vocabulary I actually use: sampling from distributions, convergence of estimators, tail bounds, computational boundedness, the halting behavior of probabilistic processes. Like, what does it even mean to talk about "expected value" for a distribution whose mean doesn't converge? If I wrote a while-loop that samples from this game, it would terminate with probability 1 but its expected runtime — and expected payout — wouldn't be finite. That's a specific kind of pathological object in CS. Similarly, the finite-bankroll resolution sounds an awful lot like saying "any actual implementation has to truncate, and the truncated version has a finite mean." The diminishing-marginal-utility thing sounds like applying a bounded utility function to make the expectation converge. I can squint and see the translations, but I want someone to actually do them systematically.

  So: restate the St. Petersburg paradox and its major resolutions in the vocabulary of algorithmic sampling, computational boundedness, and the analysis of randomized processes. Be precise about what maps to what. Then give me the residue report. Which parts of the philosophical debate translate cleanly, which parts you had to fudge or stretch, and which parts have no counterpart at all in my framework? In particular I want to know: is the normative question — "should you maximize expected value even when the expectation is infinite?" — something that has a meaningful analog in CS, or does it just evaporate once you insist on computational boundedness? Is my framework missing something important, or is the paradox mostly a symptom of reasoning about infinite objects as if they were finite?
