prompt: |-
  I keep noticing a pattern in how people assign causal responsibility, and I'm wondering if philosophers have carved this out as a distinct topic. The pattern is: we treat omissions as causes only when the person who omitted had some kind of duty or was expected to act. A gardener who doesn't water your plants "caused" them to die; a random passerby who also didn't water them didn't cause anything. A lifeguard who doesn't jump in "caused" the drowning; a sunbather who also didn't jump in didn't. But here's what bugs me: in the physical world, both omissions are identical — no water was applied, no rescue was attempted. So it looks like whether an omission counts as a cause depends on social norms or role expectations, which seems like it makes causation weirdly subjective. I've also noticed that people switch between treating omissions as causes and not depending on what they're trying to argue — like in policy debates, someone will say budget cuts "caused" deaths (treating an omission as a cause) and then five minutes later say you can't blame them for something they merely failed to prevent. Is there a name for this whole cluster of issues, and what are the main philosophical positions on whether omissions can be genuine causes? I'm not just after a label — I want to know if there's a live debate here and what the fault lines are.
reasoning: |-
  Okay, the user is pointing out a pattern where people assign causal responsibility for omissions based on duties or expectations. They give examples like a gardener not watering plants versus a random passerby not doing so. The user is bothered because physically, both omissions are the same—no action was taken. Yet, socially, one is seen as causing harm and the other isn't. They also mention how in debates, people flip-flop on treating omissions as causes when it suits their argument. They want to know if there's a philosophical term for this and what the main arguments are.

  First, I need to recall the key concepts here. The main issue is whether omissions can be genuine causes. The user's examples highlight the role of normative expectations in assigning causality. Philosophers have definitely debated this. The primary terms that come to mind are "causation by omission" and the distinction between causation and responsibility. 

  The user's deeper concern seems to be about the subjectivity in causation. They’re noticing that social norms influence what we consider a cause, which clashes with the idea of causation being an objective physical process. They might be worried about inconsistency in moral or legal blame, especially since they mention policy debates where people switch stances opportunistically. So, their real interest could be in how normative judgments shape our understanding of causation, and whether this undermines objectivity in assigning blame.

  Now, the philosophical positions. The main camps are: those who think omissions can't be causes (like Beebee or Dowe) because causation requires physical processes, and omissions are absences. Then there are those who argue that omissions can be causes (Schaffer, Lewis) by expanding the concept of causation to include counterfactual dependence. The third group focuses on pragmatics and normativity, saying that we label omissions as causes based on context and expectations (Hart, Honoré).

  The user also mentioned the inconsistency in debates. That ties into the distinction between causation and responsibility. Even if an omission is a cause in a broad sense, moral responsibility requires duty. So in policy debates, when someone says budget cuts caused deaths, they're blending causation and blame. When they deny responsibility by saying they didn't prevent it, they're separating the two. This flip-flopping exploits the ambiguity between factual causation and normative responsibility.

  I should explain the fault lines clearly. The ontological debate is about what causation fundamentally is—whether it can include absences. The pragmatic view avoids this by saying causation ascriptions are context-dependent. The user might find the pragmatic view unsatisfying because it doesn't resolve the inconsistency they observe. 

  Also, the user might be interested in real-world implications, like legal liability. For example, in tort law, duty of care determines if an omission is actionable. This connects philosophy to practical issues, which could address their concern about policy debates.

  I need to make sure I cover the key terms: causation by omission, counterfactual dependence, normative roles. Highlight the live debate between eliminativists and realists. Emphasize that the tension between physical equivalence and normative asymmetry is central. The user’s frustration with subjectivity is valid, and philosophers are actively discussing this. Mentioning contributors like Schaffer and Beebee shows it's current. 

