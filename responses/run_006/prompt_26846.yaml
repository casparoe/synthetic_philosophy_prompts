answer: |-
  You've astutely identified a core philosophical puzzle with profound implications for ethics, law, and everyday reasoning. This cluster of issues is indeed a major topic in the philosophy of causation and moral responsibility, often debated under the headings **"Causation by Omission"** or **"Negative Causation"**. It's a live, contentious debate with several distinct positions.

  **Core Problem:** As you note, physically identical absences of action (omissions) are treated as causes only when linked to a **duty, norm, or expectation**. This injects a normative (ought-based) element into seemingly factual (is-based) causal claims, creating tension.

  **Key Terms & Concepts:**

  1.  **Causation by Omission:** When an agent's *failure* to perform an action is cited as the cause of an outcome (e.g., the gardener *not* watering *caused* the plants to die).
  2.  **Normative Role/Expectation:** The social, moral, or institutional duty that makes an omission salient (e.g., the gardener *should have* watered, the lifeguard *should have* rescued).
  3.  **Counterfactual Dependence:** A central concept in causation: "C caused E" often means "If C hadn't occurred, E wouldn't have occurred." Omissions fit this *if* we imagine the expected action *had* occurred (If the gardener *had* watered, the plants *would not* have died).
  4.  **Absences vs. Events:** The ontological worry: Can a non-event (an absence, a "nothing") genuinely *cause* an event (a "something")? This challenges traditional views of causation as a relation between events.

  **Major Philosophical Positions on Omissions as Causes:**

  1.  **Eliminativism / "No Causation" View:**
      *   **Core Claim:** Omissions are *never* genuine causes. Causation fundamentally involves *positive* events, processes, or transfers of energy/momentum. Absences (omissions) are metaphysically incapable of causing anything.
      *   **Argument:** Physically, the world is identical whether the gardener fails or the passerby fails – no distinct causal process originates from the omission itself. What we call "causation by omission" is really just *causal explanation* based on *normative expectations* or *moral responsibility*. The "real" cause is the positive event (the plants drying out due to sun/heat).
      *   **Proponents:** Helen Beebee, Phil Dowe, David Armstrong.
      *   **Strengths:** Preserves a purely physical, objective metaphysics of causation. Avoids the problem of an infinite number of "causes" (everyone who *didn't* water the plants).
      *   **Weaknesses:** Struggles to explain the strong intuition and linguistic practice of assigning causal roles to omissions, especially in contexts like law or medicine (e.g., "The doctor's failure to diagnose *caused* the patient's death"). Feels counterintuitive and potentially divorces causation from explanation/responsibility.

  2.  **Counterfactualism / "Omissions as Causes" View:**
      *   **Core Claim:** Omissions *can* be genuine causes because causation is fundamentally tied to counterfactual dependence. If the outcome (E) counterfactually depends on the omission (O) – meaning if the expected action *had* been performed, E *would not* have occurred – then O causes E.
      *   **Argument:** Causation isn't solely about physical pushes; it's about difference-making. The gardener's omission *makes the difference* between the plants living and dying in a way the passerby's omission typically does not (because we don't expect the passerby to act). Norms help select *which* counterfactuals are relevant.
      *   **Proponents:** David Lewis (early work), Jonathan Schaffer, Michael Moore (in law).
      *   **Strengths:** Aligns with intuitive judgments and linguistic practice. Explains why some omissions (gardener) are causal and others (passerby) are not – it depends on *which* action we hold fixed in the counterfactual scenario (based on norms/expectations). Provides a unified theory of positive and negative causation.
      *   **Weaknesses:** Accused of conflating causation with explanation or dependence. Raises the problem of "too many causes" (many omissions could pass a counterfactual test if norms are loose). Still faces the metaphysical worry about absences causing events.

  3.  **The Pragmatic/Normative View:**
      *   **Core Claim:** While causation might have a physical core, *ascriptions* of causation (especially for omissions) are inherently pragmatic and normative. We label omissions as causes *only* when there is a salient norm, duty, or expectation violated. Causation-talk is deeply intertwined with responsibility-talk in these contexts.
      *   **Argument:** The "subjective" element you noticed isn't a bug; it's a feature. Calling an omission a cause serves a social function – marking it as a basis for blame, liability, or intervention. The physical symmetry between the gardener and passerby is real, but the *causal relevance* of their inactions is determined by normative context. We are identifying *responsible* causes, not just physical ones.
      *   **Proponents:** H.L.A. Hart & Tony Honoré (*Causation in the Law*), Judith Jarvis Thomson, many legal theorists.
      *   **Strengths:** Directly addresses your observation about duty/expectations. Explains the context-dependence and argumentative shifts you see in policy debates. Connects causal language to its practical purposes (assigning responsibility, guiding action).
      *   **Weaknesses:** May concede too much objectivity about causation. Can be seen as giving up on defining causation itself and focusing only on how we talk about it. Doesn't fully resolve the ontological puzzle.

  **The Live Debate & Fault Lines:**

  *   **Metaphysical Heartburn:** The core debate remains **whether absences (nothing) can genuinely *cause* events (something)**. Eliminativists say no, it's metaphysically incoherent. Counterfactualists say yes, causation is about dependence, not just physical pushes. Pragmatists sidestep the metaphysics, focusing on language/function.
  *   **The Role of Norms:** Is the normative element (duty/expectation) merely *epistemic* (helping us identify which omission was relevant) or *constitutive* (actually making the omission a cause)? Counterfactualists often see norms as epistemic (selecting relevant counterfactuals), Pragmatists see them as constitutive of causal *ascriptions*, Eliminativists see them as masking the non-causal nature of omissions.
  *   **Causation vs. Responsibility:** A crucial fault line is **whether causation and moral/legal responsibility can or should be separated**. Your policy debate example perfectly illustrates this:
      *   When saying "budget cuts *caused* deaths," the speaker is blending causation and responsibility (implying the budgeters had a duty to fund the program).
      *   When saying "you can't blame us for merely failing to prevent," they are trying to separate causation (the "real" cause was the disease/accident) from responsibility (denying a duty to prevent *this specific harm* or claiming prevention was impossible/too costly).
      *   Philosophers debate if causation is a necessary precursor to responsibility (requiring resolution of the omissions question), or if responsibility judgments fundamentally shape which events/omissions we even *count* as causes in a given context.

  **Conclusion:**

  Your observation hits the nail on the head. The tension between the physical symmetry of omissions and the normative asymmetry in how we assign causal blame is **the central puzzle of causation by omission**. It remains a "live" debate with no consensus. Key fault lines are:

  1.  **Ontological:** Can absences be causes? (Eliminativists vs. Counterfactualists).
  2.  **Explanatory/Pragmatic:** Is causation by omission primarily a feature of how we *explain* and assign *responsibility* based on norms, rather than a fundamental feature of the world? (Pragmatists vs. others).
  3.  **Causation-Responsibility Link:** How intertwined *are* factual causation and normative responsibility? Can/should they be separated?

  Understanding these positions helps dissect the rhetorical moves in your policy debate example. Speakers are strategically navigating the blurry line between factual causation and normative responsibility, exploiting the inherent ambiguity of omissions to frame blame or deflect it. The debate is very much alive, driven by the kind of insightful tension you identified.
