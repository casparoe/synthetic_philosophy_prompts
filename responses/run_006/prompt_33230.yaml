answer: |-
  Based on your friend's recorded verdicts, she appears to adhere to a rule grounded in the principles of the Condorcet jury theorem, with adjustments for voter independence and homogeneity. Let's analyse her rule, alternative rules that fit her prior judgments, the prediction for the new case, and a further case to distinguish between these rules.

  ### Her Likely Rule
  From her verdicts:
  - For homogeneous groups (all members have the same competence) where members are **independent** and individually **more than 50% competent**, she states that the majority is more reliable than any single member. This aligns with the Condorcet jury theorem, which shows that under these conditions, majority reliability exceeds individual reliability and increases with group size.
  - For the dependent case (voters relying on the same one-sided source), she rejects majority superiority due to violated independence, as dependence negates the theorem’s assumptions.

  Thus, her rule seems to be:
  > **If jurors are independent and each has a competence > 50%, then the majority is more reliable than any single juror in homogeneous groups. In heterogeneous groups (varying competences), the majority may not exceed the competence of the best juror.**

  This rule fits all recorded cases:
  - **Jury of twelve (60% homogeneous, independent)**: Majority reliability is higher than 60% (≈72.6% for twelve jurors).
  - **Thousand voters (51% homogeneous, independent)**: Majority reliability approaches 100%, exceeding 51%.
  - **Thousand voters (dependent)**: Independence violated; majority no better than a single voter.
  - **Panel of three (60% homogeneous, independent)**: Majority reliability is ≈64.8%, exceeding 60%.

  ### Alternative Rules That Fit the Recorded Verdicts
  Other rules could explain her prior judgments:
  1. **Average Competence Rule**:  
     The majority is more reliable than the **average juror** if independence holds and average competence > 50%.  
     - **Fits prior cases**:  
       - Homogeneous groups: Average competence equals individual competence (e.g., 60%), and majority reliability exceeds it.  
       - Dependent case: Rule not applied (independence violated).  
     - **Difference from her likely rule**: Focuses on the average juror, not the best juror, in heterogeneous groups.

  2. **Median Competence Rule**:  
     The majority is more reliable than the **median juror** if independence holds and median competence > 50%.  
     - **Fits prior cases**:  
       - Homogeneous groups: Median competence equals individual competence.  
       - Dependent case: Rule not applied.  
     - **Difference**: In heterogeneous groups, median competence may differ from best or average.

  3. **Weighted Majority Rule**:  
     The majority is more reliable than a **typical juror** (e.g., the minimum or a fixed percentile) under independence and competence > 50%.  
     - **Fits prior cases**: In homogeneous groups, all jurors are identical.  
     - **Difference**: Ambiguous in heterogeneous groups; could prioritise the weakest juror.

  All three alternative rules fit the homogeneous and dependent cases, as homogeneity makes "any single juror," "average juror," and "median juror" equivalent. The key divergence is in heterogeneous groups.

  ### Prediction for the New Case
  **Panel of three independent jurors with competences: 90%, 60%, and 60%.**  
  - **Majority reliability calculation**:  
    The majority is correct if:  
    - The 90% juror is correct and at least one 60% juror is correct: \(0.90 \times (1 - 0.40 \times 0.40) = 0.90 \times 0.84 = 0.756\).  
    - The 90% juror is wrong and both 60% jurors are correct: \(0.10 \times (0.60 \times 0.60) = 0.10 \times 0.36 = 0.036\).  
    Total: \(0.756 + 0.036 = 0.792\) (79.2%).  
  - **Comparison to the 90% expert**:  
    79.2% < 90%, so the majority is **less reliable** than the expert.

  **Prediction**:  
  She will **not** say the majority is more reliable than the 90% expert. Instead, she will state that **the panel should defer to the expert**.  
  - **Reasoning under her likely rule**: The majority (79.2%) is less reliable than the best juror (90%), violating the homogeneous-group expectation. Her rule emphasises independence and homogeneity, and without the latter, she prioritises the highest individual competence.  
  - **Under alternative rules**:  
    - **Average competence rule**: Average = \((90\% + 60\% + 60\%) / 3 = 70\%\). Majority (79.2%) > 70%, so she would say the majority beats the average juror. But the question specifies the 90% expert, not the average. Thus, she would still **not** claim the majority beats the expert.  
    - **Median competence rule**: Competences ordered: 60%, 60%, 90%; median = 60%. Majority (79.2%) > 60%, but again, the query is about the 90% expert. Same conclusion.  
    - **Weighted majority rule**: If "typical juror" means the best, she defers to the expert; if not, she might compare to the 60% jurors. However, the question explicitly references the 90% expert, so deferral is consistent.  

  **Conclusion**: All rules predict she will **defer to the expert** when directly comparing the majority to the 90% juror, as 79.2% < 90%. The core reason is that the high competence of the expert dominates the majority’s reliability in this small group.

  ### Further Case to Distinguish the Rules
  To disentangle her rule from the alternatives, propose a heterogeneous case where:
  - **Majority reliability exceeds the average competence but is less than the best juror’s competence**.  
    Example: **Three independent jurors with competences 99%, 51%, and 51%**.  
    - **Majority reliability**:  
      - 99% correct and at least one 51% correct: \(0.99 \times (1 - 0.49 \times 0.49) \approx 0.99 \times 0.7599 = 0.752301\).  
      - 99% wrong and both 51% correct: \(0.01 \times (0.51 \times 0.51) \approx 0.01 \times 0.2601 = 0.002601\).  
      Total: \(0.752301 + 0.002601 = 0.754902\) (≈75.5%).  
    - **Comparisons**:  
      - Best juror: 99% (75.5% < 99%).  
      - Average juror: \((99\% + 51\% + 51\%) / 3 = 67\%\) (75.5% > 67%).  
      - Median juror: 51% (75.5% > 51%).  

  **Questions to ask**:  
  1. "Is the majority more reliable than the 99% expert?"  
  2. "Is the majority more reliable than a typical 51% juror?"  

  **Expected answers under each rule**:  
  - **Her likely rule (best juror focus)**:  
    - Answer to Q1: **No** (75.5% < 99%).  
    - Answer to Q2: **Yes** (75.5% > 51%).  
  - **Average competence rule**:  
    - Answer to Q1: **No** (same as above).  
    - Answer to Q2: **Yes** (same as above).  
    *But to distinguish, ask: "Is the majority more reliable than the average juror (67%)?"*  
    - She would say **Yes** under this rule (75.5% > 67%).  
  - **Median competence rule**:  
    - Answer to Q1: **No**.  
    - Answer to Q2: **Yes** (but median is 51%, so 75.5% > 51%).  
    *Distinguishing question: "Is the majority more reliable than the median juror (51%)?"*  
    - She would say **Yes** under this rule.  
  - **Weighted majority rule (e.g., min competence focus)**:  
    - If "typical juror" is the weakest (51%), she says **Yes** to Q2.  
    - But Q1 remains **No**.  

  **Key distinguishing question**:  
  Ask: **"Is the majority more reliable than any single juror in the panel?"**  
  - **Interpretation**: "Any single juror" implies *every* juror, including the best.  
  - **Prediction**:  
    - Her likely rule: **No**, because the majority (75.5%) is less reliable than the 99% juror.  
    - Average/median rules: **No**, for the same reason.  
    *This question does not fully separate the rules, as all agree on "no."*  

  **Better distinguishing question**:  
  Ask: **"Is the majority more reliable than the average juror (67%)?"**  
  - **Her likely rule**: She may avoid this, as her focus is on the best juror or homogeneous cases. She might say **Yes** (75.5% > 67%) but clarify it is irrelevant to the expert comparison.  
  - **Average competence rule**: **Yes** (explicitly endorses comparison to average).  
  - **Median competence rule**: **No opinion or inconsistent**, as the rule compares to the median, not average.  

  **Conclusion for further case**:  
  The case of **99%, 51%, 51%** with the question **"Is the majority more reliable than the 99% expert?"** will yield a clear "no" under all rules. To distinguish, **add a question about the average juror**:  
  - If she **affirms** the majority beats the average (67%), she likely follows the **average competence rule**.  
  - If she **avoids or rejects** the average comparison and emphasises the best juror, she follows the **best-juror-focused rule**.  

  For your immediate purpose, in the **90%, 60%, 60%** case, she will **defer to the expert** regardless of the rule, as the majority is objectively worse than the 90% juror. The further case with 99%, 51%, 51% and a follow-up on the average juror will best clarify her underlying principle.
