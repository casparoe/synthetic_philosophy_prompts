  We are drafting a joint statement between a hinge epistemologist (inspired by Wittgenstein's On Certainty) and a traditional evidentialist. The statement has four sections.

  Section 1: Agreed Claims (numbered list)
  Both parties agree on the following substantive claims:

  1. The skeptical paradox correctly identifies that if all beliefs require justification by other beliefs, then an infinite regress of justification would ensue, which is impossible. Therefore, the paradox challenges the very possibility of knowledge by showing that without a foundation, justification seems to collapse.

  2. Ordinary doubt in practice always occurs against a background of certainties that are not themselves doubted. For example, doubting whether a bird in the distance is a goldfinch presupposes that birds exist, that one's eyesight is functioning normally in good light, etc. These background certainties are not at issue in the act of doubting.

  3. There is a regress of justification, and it does bottom out. However, the parties may have different accounts of what the regress bottoms out in: the evidentialist might say it bottoms out in basic beliefs that are self-justifying or justified by experience, while the hinge epistemologist holds that it bottoms out in hinge commitments that are not justified at all but are the framework for justification. But they agree that the regress must stop somewhere.

  4. For inquiry to proceed, there must be a stable background of commitments that are not under scrutiny in that inquiry. These background commitments enable the process of questioning and testing other beliefs.

  5. It is neither psychologically possible nor rationally coherent to doubt everything at once. A total doubt would leave no stable ground from which to raise doubts or to evaluate them.

  Section 2: Disagreements Table

  We present the following table of disagreements. For each question, we state the hinge epistemologist's answer and the evidentialist's answer in terms that each would endorse.

  | Question | Hinge Epistemologist | Traditional Evidentialist |
  |---------|----------------------|---------------------------|
  | (a) Are hinge commitments propositional — do they have truth-conditional content that can be asserted and denied? | Hinge commitments are not propositional in the sense that they do not function as empirical claims that can be asserted or denied in the same way as ordinary beliefs. They are expressed in propositional form, but their role is not to represent states of affairs; rather, they are rules of our language-games or framework conditions. | All hinge commitments, if they are to be considered as commitments at all, must be propositional. They have truth-conditional content and can in principle be asserted or denied. Even if we do not in fact doubt them, they are candidates for truth and falsity. |
  | (b) Are hinge commitments subject to epistemic norms, or do they lie outside the space of reasons? | Hinge commitments lie outside the space of reasons. They are not subject to epistemic norms (like justification) because they are the preconditions for the application of such norms. They are arational certainties. | All doxastic commitments are in principle subject to epistemic norms. Even if a belief is deeply held and not currently doubted, it must be answerable to evidence and reasons. There are no beliefs that are beyond rational evaluation. |
  | (c) Can a rational agent suspend judgment on a hinge commitment without thereby abandoning rationality? | No. Suspending judgment on a hinge commitment (e.g., "The external world exists") would undermine the very framework required for rational inquiry. Such suspension would not be rational but would instead lead to a collapse of the ability to reason. | Yes, in principle. A rational agent can suspend judgment on any commitment if there are reasons to doubt it. Even for deeply fundamental beliefs, if there were sufficient reason to doubt, suspension of judgment would be the rational response. However, in practice, such reasons might be very hard to come by. |
  | (d) Does treating hinge commitments as arational certainties dissolve the skeptical problem, or does it merely relabel the point at which justification gives out? | It dissolves the skeptical problem by showing that the demand for justification of hinges is misplaced. Skepticism arises from applying the model of justification to what is not justifiable. Recognizing hinges as arational removes the threat. | It merely relabels the point at which justification gives out. The skeptical problem remains because we are left without a rational basis for these certainties. The evidentialist holds that we must provide an account of how even basic commitments are justified, or else we have not addressed skepticism. |
  | (e) Is the status of a hinge commitment — as hinge — itself an epistemological discovery, or is it a mere description of what we happen not to doubt? | The status of a hinge is an epistemological discovery: it is a feature of our rational practice that certain commitments function as hinges, and this is not merely contingent but necessary for the practice of justification. | The status of a hinge is merely a description of what we happen not to doubt. There is no special epistemological category; what we call hinges are just deeply entrenched beliefs that could, in principle, be questioned and justified. |
  | (f) When one hinge commitment conflicts with another across different world-pictures or epistemic systems, is there any rational procedure for adjudicating between them? | There is no overarching rational procedure for adjudicating between conflicting hinges from different world-pictures. Rationality is internal to a world-picture, and without shared hinges, there is no common ground for rational debate. | There are rational procedures, such as comparing the overall coherence, explanatory power, and empirical adequacy of the entire system. Even fundamental commitments can be evaluated by how well they support a system that meets our epistemic goals. |

  Section 3: Cruxes

  We identify the following cruxes, which are key sub-questions that, if resolved, would cause at least one side to substantially revise its view.

  1. **The nature of hinge commitments under pressure from counter-evidence**: 
     - *Test*: Consider a case where a deeply held hinge commitment (e.g., "My senses are generally reliable") appears to be undermined by a large body of counter-evidence (e.g., widespread and systematic perceptual illusions). 
     - *Hinge prediction*: The hinge epistemologist predicts that even in the face of such evidence, we would not (and could not rationally) abandon the hinge. Instead, we would reinterpret the evidence or adjust auxiliary beliefs to preserve the hinge, because abandoning it would collapse our entire epistemic system.
     - *Evidentialist prediction*: The evidentialist predicts that if the counter-evidence were sufficiently strong and widespread, a rational agent would have to at least suspend judgment on the hinge and seek a new foundation, even if that requires a radical restructuring of beliefs.
     - *Impact*: If it turns out that in such scenarios agents consistently retain the hinge and successfully reorganize their beliefs, that would support the hinge view. If agents are forced to abandon the hinge, that would support the evidentialist.

  2. **The possibility of rational hinge revision**:
     - *Test*: Examine historical cases of radical conceptual change (e.g., the shift from a geocentric to a heliocentric worldview, which involved abandoning what were once hinge commitments). 
     - *Hinge prediction*: The hinge epistemologist holds that such changes are not rational transitions in the sense of being based on evidence against the hinge itself, but rather are more like conversions or shifts in the entire framework. Rationality is internal to the framework, so there is no neutral rational standard to judge the shift.
     - *Evidentialist prediction*: The evidentialist holds that even in such cases, the change can be rational if the new system better accounts for the evidence and meets overall epistemic goals. The old hinges were revised because they were found to be inadequate in light of the evidence.
     - *Impact*: A detailed historical analysis that shows that the shift was driven by rational considerations (even if not solely by evidence directly against the hinge) would support the evidentialist. If it shows that the shift was non-rational (e.g., based on non-epistemic factors), that would support the hinge view.

  3. **The role of hinges in the acquisition of evidence**:
     - *Test*: Consider a thought experiment where an agent is raised in an environment that systematically distorts their perception (e.g., a brain in a vat). Can such an agent have evidence at all?
     - *Hinge prediction*: The hinge epistemologist holds that the agent would still have a framework of hinges (even if false) that allows for evidence within that framework. The concept of evidence only makes sense within a hinge framework.
     - *Evidentialist prediction*: The evidentialist holds that the agent can still have evidence, but the reliability of that evidence might be called into question. The evidentialist would argue that the agent's evidence is just as good as ours, but it is misleading because of the environment.
     - *Impact*: If it can be shown that the brain in a vat can have a coherent system of beliefs and evidence, that would support the hinge view that hinges are necessary for evidence. But the evidentialist would say this doesn't show that hinges are arational, only that they might be false.

  Section 4: Verbal Disputes

  After discussion, we identify one potential verbal dispute and note that other disagreements are substantive.

  - **Verbal Dispute**: The use of the term "belief" for hinge commitments. Both sides agree that hinge commitments are deeply held and play a foundational role. However, the hinge epistemologist prefers to say that they are not beliefs (because beliefs are subject to justification) but rather certainties or commitments. The evidentialist insists that they are beliefs, albeit foundational ones. If we clarify terminology, both might agree on the functional role of these commitments but still disagree on whether they are subject to epistemic norms.

    - *Agreement*: Both agree that there are deeply held commitments that are not questioned in ordinary inquiry and that these provide a framework for justification.
    - *Residual Disagreement*: Whether these commitments are subject to epistemic norms (evidentialist) or lie outside the space of reasons (hinge).

  - **Substantive Disagreements**: The core disagreement about whether justification must extend to all beliefs (evidentialist) or whether there is a category of arational certainties (hinge) is substantive. Both sides reject the idea that this is merely verbal because it affects how we understand the structure of knowledge and the force of skeptical arguments.

    - *Hinge Reason*: The hinge epistemologist argues that if hinges were subject to justification, then the regress would either be infinite or circular, which is unacceptable. Therefore, hinges must be arational.
    - *Evidentialist Reason*: The evidentialist argues that without justification at the foundation, we have no rational basis for our knowledge, and we are left with an arbitrary foundation. This does not solve the skeptical problem.

  Thus, we conclude that while some terminological differences exist, the central disputes are substantive and require further philosophical investigation.
answer: |-
  ### Joint Statement: Adversarial Collaboration Between a Hinge Epistemologist and a Traditional Evidentialist  

  #### **Section 1: Agreed Claims**  
  Both parties affirm the following substantive claims, grounded in shared observations about epistemic practice:  

  1. **The Skeptical Paradox’s Insight**: The skeptical paradox correctly identifies that if *all* beliefs must be justified by further beliefs, this generates an infinite regress that threatens to undermine justification entirely. This regress problem is genuine and exposes a structural vulnerability in our epistemic practices.  

  2. **Ordinary Doubt’s Structure**: Ordinary doubt operates locally and contextually, always presupposing a stable background of undoubted commitments. For instance, doubting whether a specific door is locked presupposes the existence of doors, physical laws, and one’s sensory reliability—none of which are questioned in that moment. Genuine doubt requires this background to function.  

  3. **Regress Termination**: The regress of justification bottoms out. It terminates not in further justificatory beliefs but in commitments that are *held fast*—whether due to their foundational role (evidentialist) or their status as non-justificational certainties (hinge). Neither party endorses infinitism or pure coherentism.  

  4. **Inquiry’s Preconditions**: For inquiry to proceed, agents must rely on commitments that are temporarily exempt from scrutiny. Inquiry is parasitic on unexamined assumptions (e.g., the reliability of memory or the uniformity of nature), which anchor the testing of hypotheses.  

  5. **Impossibility of Global Doubt**: It is neither psychologically possible nor rationally coherent to doubt *all* commitments simultaneously. Global doubt would collapse the framework needed to formulate doubts, evaluate evidence, or engage in reasoning.  

  #### **Section 2: Disagreements Table**  
  | Question | Hinge Epistemologist’s Answer | Traditional Evidentialist’s Answer |  
  |----------|-------------------------------|-----------------------------------|  
  | **(a) Are hinge commitments propositional?** | "Hinge commitments are not propositional in the ordinary sense; they lack assertoric, truth-conditional content. They are grammatical rules that shape our language-games, not empirical claims subject to verification." | "All hinge commitments are propositional: they express truth-apt content (e.g., ‘The Earth exists’). That we rarely test them does not negate their semantic status as assertions capable of being true or false." |  
  | **(b) Are hinge commitments subject to epistemic norms?** | "Hinge commitments lie outside the ‘space of reasons.’ They are not justified or unjustified; they are arational certainties that *enable* justification. Epistemic norms only apply within the framework they provide." | "All doxastic commitments, including hinges, are in principle subject to epistemic norms. Their immunity to doubt is pragmatic, not normative; they *can* be evaluated for justification if challenged (e.g., via abductive reasoning)." |  
  | **(c) Can a rational agent suspend judgment on a hinge?** | "Suspending judgment on a hinge (e.g., ‘Objects persist unperceived’) is impossible for a rational agent. Doing so would dismantle the framework for rationality itself, rendering inquiry incoherent." | "Rational agents can suspend judgment on *any* commitment if confronted with counter-reasons (e.g., radical skeptical scenarios). Rationality demands openness to revising even ‘hinges’ in exceptional circumstances." |  
  | **(d) Do hinges dissolve skepticism or relabel regress?** | "Treating hinges as arational dissolves skepticism: it shows that demands for their justification are category errors. Skepticism arises only when we mistakenly treat hinges as empirical claims." | "Hinges merely relabel where justification ends. This relabeling does not resolve skepticism; it concedes that justification halts at arbitrary commitments, leaving them vulnerable." |  
  | **(e) Is hinge status epistemological or descriptive?** | "The hinge status is an epistemological discovery: these commitments are *necessarily* exempt from doubt for rational practices to function. Their role is structural, not psychological." | "Hinge status is descriptive: it reflects contingent psychological or cultural facts about what we *happen* not to doubt. There is no deeper epistemological necessity to their immunity." |  
  | **(f) Can conflicting hinges be rationally adjudicated?** | "No rational adjudication is possible between fundamentally conflicting hinges (e.g., naturalistic vs. supernaturalistic world-pictures). Rationality is internal to a system; without shared hinges, dialogue collapses into persuasion, not proof." | "Rational adjudication is always possible: agents can compare hinges’ explanatory power, coherence, or empirical fruitfulness across systems using shared epistemic criteria (e.g., simplicity, predictive success)." |  

  #### **Section 3: Cruxes**  
  Key sub-questions where resolution would force substantial revision:  

  1. **Crux: Can hinges survive counter-evidence without revision?**  
     - *Test*: A scenario where overwhelming evidence challenges a hinge (e.g., pervasive neural implants casting doubt on sensory reliability).  
     - *Hinge Prediction*: Agents will reinterpret/ignore counter-evidence to preserve the hinge; abandoning it would cause epistemic collapse.  
     - *Evidentialist Prediction*: Agents will revise the hinge if counter-evidence is sufficiently systematic, as rationality demands responsiveness to reasons.  
     - *Decisive Case*: If neuroscience revealed systematic perceptual errors yet agents retained sensory hinges unrevised, hinge theory gains support.  

  2. **Crux: Are hinges culturally invariant?**  
     - *Test*: Cross-cultural study of epistemic practices to identify commitments universally treated as undoubtable (e.g., physical object permanence).  
     - *Hinge Prediction*: Certain hinges (e.g., "The world exists") will prove universal; their necessity transcends culture.  
     - *Evidentialist Prediction*: No universal hinges exist; all "certainties" vary culturally (e.g., ancestral veneration vs. natural laws), proving their contingency.  
     - *Decisive Case*: Anthropological evidence of a culture doubting a purported universal hinge (e.g., personal identity) would challenge hinge theory.  

  3. **Crux: Can hinge revision be rational?**  
     - *Test*: Historical analysis of hinge-like shifts (e.g., heliocentrism replacing geocentrism).  
     - *Hinge Prediction*: Such shifts are non-rational "conversions"; no reasons directly target the hinge—auxiliary beliefs change first.  
     - *Evidentialist Prediction*: Shifts are rational; cumulative evidence directly undermines the old hinge (e.g., telescopic data refuting geocentrism).  
     - *Decisive Case*: If historical records show agents citing evidence *against* a hinge (e.g., "The Earth is immovable") pre-revolution, evidentialism is strengthened.  

  #### **Section 4: Verbal Disputes**  
  After deliberation, we identify one verbal dispute and confirm others as substantive:  

  - **Verbal Dispute**: The term "belief."  
    - *Agreement*: Both agree that hinges are deeply held, action-guiding commitments.  
    - *Clarification*: If "belief" requires susceptibility to justification, the hinge theorist denies hinges are beliefs; the evidentialist insists they are.  
    - *Residual Disagreement*: Whether epistemic norms govern hinges (substantive).  

  - **Substantive Disagreements**:  
    - **Hinge Perspective**: Rejects "merely verbal" labels; the question of whether hinges are in the "space of reasons" determines if skepticism is dissolved or evaded.  
    - **Evidentialist Perspective**: Terminology like "arational" obscures the real issue: hinges *are* evaluable, and refusing this concedes ground to skepticism.  

  **Conclusion**: While terminology about "belief" is negotiable, the core disagreement—whether epistemic norms apply to hinges—is irreducibly substantive. It shapes our response to skepticism and the scope of rationality.
