prompt: |-
  I'm a software engineer with a working knowledge of formal specification and verification: I use TLA+ for modeling concurrent systems, I understand the frame rule in separation logic, and I work daily with invariants, preconditions, postconditions, and the distinction between what a specification must say and what it may leave implicit. I have no formal philosophy background.

  Restate the frame problem — both the original computational version (how to represent that most things in a situation do not change when an action is performed, without explicitly enumerating the non-changes) and the later philosophical version that developed from it (about relevance, about what an agent notices and ignores in a world of indefinitely many facts, about how a bounded reasoner draws the line between what bears on an action and what can be safely left alone) — in the vocabulary I actually use: state, specification, invariant, frame condition, modularity, abstraction, refinement, and so on. Be as precise as you can.

  Then give me the residue report: what translated cleanly, what had to be bent to fit, and what has no counterpart in my vocabulary at all. I particularly want to know whether the philosophical version of the frame problem is just the computational version dressed up, or whether it points to something my tools were never designed to handle — and if so, whether that is a limitation of my tools or a sign that the philosophical version is less precise than it looks.
reasoning: |-
  We are going to address the frame problem in two parts: the computational version and the philosophical version, using the requested vocabulary.

  ### Part 1: Restating the Frame Problem

  #### Computational Frame Problem:
  In the context of modeling state changes in systems (like in TLA+ or separation logic), the computational frame problem arises when we specify an action that modifies some part of the state. We must ensure that the rest of the state (the "frame") remains unchanged. Explicitly listing every non-change is infeasible in large systems because it violates modularity and abstraction. 

  We want to write specifications that are:
  - **Modular**: The effect of an action is described locally, without having to consider the entire global state.
  - **Abstracted**: We can reason about an action in a component without knowing the complete state of the system.

  In formal terms:
  - Let `S` be the state space.
  - An action `A` is specified by a precondition `Pre_A` and a postcondition `Post_A`, which relates the old state `s` and the new state `s'`.
  - The **frame condition** for `A` is the part of the specification that states which parts of the state are not modified by `A`.

  The problem is: how do we specify `Post_A` such that it only describes the changes and implicitly leaves the rest of the state unchanged? Without such a mechanism, we would have to write:

      Post_A(s, s') :≡ 
          Change_1(s, s') ∧ ... ∧ Change_n(s, s') 
          ∧ (for all other state components, s'.x = s.x)

  This becomes verbose and breaks modularity because if we add a new state component, we must update all actions to include it in the frame.

  **Solutions in Your Tools**:
  - In **TLA+**, we typically write actions that only specify the variables that change, and the rest are implicitly unchanged. This is because TLA+ uses stuttering steps where variables not mentioned in the action are left unchanged. However, when composing modules, we must be cautious because TLA+ does not have a built-in frame rule; we rely on the next-state relation to specify changes and the rest is stuttering.
  - In **separation logic**, the frame rule provides an elegant solution: 
          {P} C {Q}   implies   {P * R} C {Q * R}
    provided that command `C` does not modify the resources described by `R`. This rule allows local reasoning: we can focus on the part of the state that the command `C` actually accesses (the footprint), and the rest (the frame) is guaranteed to be preserved.

  #### Philosophical Frame Problem:
  The philosophical frame problem arises in the context of an agent (like a robot or an AI) that must reason about the world to act. The world has an unbounded number of facts, and the agent must decide which facts are relevant to its current action and which can be ignored (i.e., which facts are in the "frame" and thus assumed to remain unchanged). The challenge is how a bounded agent can efficiently draw this line without considering all facts.

  In your vocabulary:
  - The agent operates in a state space that is too large (or even infinite) to represent explicitly.
  - The agent has a specification for its actions, but the **invariants** that hold in the world are not all known or are too numerous to track.
  - The agent must **abstract** away irrelevant parts of the state to make reasoning feasible. However, what is irrelevant (i.e., what lies in the frame) for one action might become relevant for another, and the agent must avoid drawing incorrect conclusions by ignoring something that actually changes (a violation of the frame condition).

  This problem is about **relevance**: how to determine, without exhaustive search, the minimal set of state components that might be affected by an action (or that might affect the outcome of the action). It also touches on the **modularity** of knowledge: can we structure the agent's knowledge so that it can reason locally and then compose?

  ### Part 2: Residue Report

  #### What translated cleanly:
  1. **State**: This concept is central in both contexts. The computational version deals with the state of a system, and the philosophical version with the state of the world.
  2. **Specification**: In both, we have a description of how actions change the state. The computational version has formal pre/postconditions, while the philosophical version might have more informal or incomplete specifications.
  3. **Invariant**: In the computational setting, invariants are properties that must hold in every state. In the philosophical setting, the agent relies on many implicit invariants (like the persistence of most facts) to avoid reasoning about everything.
  4. **Frame condition**: This term comes directly from the computational frame problem and is the explicit part of the specification that says what doesn't change. The philosophical version is about the challenge of even defining what the frame condition should be without knowing the entire state.
  5. **Modularity and abstraction**: These are key in both. The computational frame problem is solved by modular reasoning (like the frame rule in separation logic). The philosophical version seeks a similar modularity in the agent's reasoning about the world.

  #### What had to be bent to fit:
  1. **Refinement**: In formal methods, refinement is about implementing an abstract specification with a concrete one while preserving properties. In the philosophical problem, we might think of the agent's internal model as a refinement of the world, but the issue is that the agent's model is necessarily incomplete and abstracted. The philosophical problem doesn't have a clear refinement hierarchy but rather an under-specified model.
  2. **Bounded reasoner**: Your tools (TLA+, separation logic) are typically used for unbounded (though finite at a given time) or even infinite state spaces, but the reasoning is done by an unbounded (mathematical) mind. The philosophical problem introduces a computational limitation: the agent cannot consider all facts. This limitation is not directly modeled in TLA+ or separation logic, which are used for specification and verification, not for efficient agent reasoning.

  #### What has no counterpart:
  1. **Efficient relevance detection**: The philosophical frame problem requires a method for an agent to quickly determine what is relevant to an action. This is a problem of computational complexity and heuristics, which is not typically addressed by the formal specification languages you use. They focus on correctness, not efficiency of reasoning.
  2. **Dynamic and open world**: In the philosophical setting, the world is open (new facts can emerge) and dynamic in ways that are not fully known. In contrast, the computational setting usually assumes a fixed state space and a fixed set of actions. Even when using abstraction in refinement, the state space is defined in the specification.

  #### Is the philosophical frame problem just the computational version dressed up?
  Not exactly. The computational frame problem has been largely solved in formal methods by techniques like the frame rule in separation logic or stuttering in TLA+. These solutions work because the state is fully specified and the frame is determined by the specification.

  The philosophical frame problem, however, is more about the challenge of building an agent that can operate without a complete specification of the world. The agent must:
  - Decide what is relevant (i.e., what might change or be affected) without having a complete state representation.
  - Cope with an open world where the set of facts is not known in advance.

  This is a harder problem because it's about the agent's ability to manage bounded resources (time, memory) and to learn or adapt its frame conditions.

  #### Limitations of Your Tools vs. Philosophical Imprecision:
  - **Limitation of tools**: Your tools (TLA+, separation logic) are designed for verification and specification. They assume a known state space and known actions. They are not designed for efficient reasoning under bounded resources or for open worlds. So the philosophical frame problem points to a gap in the tools for building autonomous agents that must reason efficiently and robustly in complex environments.
  - **Philosophical imprecision**: The philosophical frame problem is often stated in broad terms, which makes it less precise. It doesn't specify the exact nature of the agent's reasoning mechanism or the structure of the world. Without such details, it's hard to formalize. However, attempts have been made to formalize it (e.g., in AI planning and knowledge representation), but the solutions are often domain-specific and not as general as the frame rule.

  ### Conclusion
  The philosophical frame problem is not just the computational version dressed up. It introduces new challenges of bounded rationality, open worlds, and relevance that go beyond the state-based formal methods you use. While your tools elegantly solve the computational frame problem by allowing local reasoning (via the frame rule or stuttering), they do not address the efficiency and adaptability required by the philosophical version. This is a limitation of the tools for that particular problem, but it is also a sign that the philosophical problem is more complex and less precisely defined in its full generality.
answer: |-
  ### Restating the Frame Problem in Formal Specification Vocabulary

  #### **Computational Frame Problem**  
  In a state-based system, an action's specification defines how it transforms preconditions to postconditions. The challenge is to **implicitly preserve invariants** over unchanged parts of the state (the "frame") without explicitly listing every non-change.  

  - **State**: A snapshot of system variables (e.g., `x, y, z`).  
  - **Action**: An operation (e.g., `inc_x`) with:  
    - **Precondition**: `Pre := x >= 0`  
    - **Intended change**: `Post := x' = x + 1`  
  - **Frame condition**: The requirement that `y` and `z` remain unchanged.  
  - **Problem**: Without a structural mechanism, we must manually specify:  
    ```  
    Full_Post := x' = x + 1 ∧ y' = y ∧ z' = z  
    ```  
    This breaks **modularity** and **abstraction**: adding a new variable `w` forces updating all actions.  

  **Solution in your tools**:  
  - **Separation logic**: Frame rule `{P} C {Q} ⇒ {P * R} C {Q * R}` (if `C` doesn’t modify `R`).  
  - **TLA+**: Actions only mention changed variables; stuttering steps implicitly preserve others.  

  ---

  #### **Philosophical Frame Problem**  
  An agent (bounded reasoner) must act in a state space with **indefinitely many facts** (e.g., `x, y, z, ...`). The challenge is determining which subset of the state is **relevant** to an action without exhaustive checks.  

  - **State**: All facts about the world (possibly infinite/unknown).  
  - **Specification gap**: Pre/postconditions cannot explicitly reference all irrelevant facts.  
  - **Abstraction failure**: Invariants assumed preserved (e.g., "gravity unchanged") might interact with unconsidered state components.  
  - **Modularity threat**: Naive **refinement** (adding details) risks breaking implicit relevance boundaries.  

  **Core tension**: How to isolate a minimal **frame** (what bears on the action) from the state while ensuring soundness under partial knowledge.  

  ---

  ### Residue Report: Translation Gaps  

  #### **What Translated Cleanly**  
  1. **State/Invariants**: Both versions map directly. Invariants are properties preserved unless an action violates them.  
  2. **Frame condition**: The computational "non-change preservation" is a subset of the philosophical "relevance boundary."  
  3. **Modularity/Abstraction**: Central to both. Explicit frames enable local reasoning; their absence forces global checks.  
  4. **Specification intent**: What *must* be stated (e.g., postconditions) vs. what *may* be omitted aligns with implicit frame assumptions.  

  #### **What Bent to Fit**  
  1. **Bounded reasoner**:  
     - Your tools assume an omniscient perspective (all states are checkable). Philosophy deals with agents who *cannot* enumerate all facts.  
     - Bent via "partial specification": Modeling the agent’s *view* of the state as an abstracted sub-state.  
  2. **Relevance**:  
     - Computational: Relevance is defined by the specification (e.g., separation logic’s footprint).  
     - Philosophical: Relevance is dynamic and contextual (e.g., "Does rain in London affect my code?").  
     - Bent by treating relevance as a **refinement invariant**: Lower-level specs must respect higher-level relevance boundaries.  

  #### **What Has No Counterpart**  
  1. **Epistemic uncertainty**:  
     - Philosophy: Agents ignore facts not because they’re irrelevant, but because they’re *unknown*. Your tools assume complete state knowledge.  
  2. **Emergent interactions**:  
     - Philosophy: Adding a new fact (e.g., "the floor is slippery") retroactively invalidates past frame assumptions. TLA+/separation logic lack built-in mechanisms for "relevance feedback."  
  3. **Scalability of ignorance**:  
     - Philosophy: The cost of *proving* irrelevance grows with state size. Your tools focus on verification, not reasoning complexity.  

  ---

  ### Philosophical vs. Computational: Core Distinction  
  The philosophical problem **is not** just the computational version "dressed up." It exposes two gaps in your tools:  

  1. **Omniscience assumption**:  
     - Your tools verify systems under complete knowledge. Philosophy asks: *How does a bounded agent know what to verify?*  
     - Example: Separation logic’s frame rule requires knowing what `R` is. Philosophy struggles with *discovering* `R` efficiently.  

  2. **Dynamic relevance**:  
     - Computational frames are static (defined in the spec). Philosophical frames must adapt to new contexts.  
     - Example: An agent learning that "flipping a light switch can electrocute if wiring is faulty" breaks prior frame assumptions.  

  #### **Is This a Tool Limitation or Philosophical Imprecision?**  
  - **Tool limitation**: Your stack (TLA+, separation logic) wasn’t designed for:  
    - Resource-bounded reasoning (e.g., probabilistic relevance heuristics).  
    - Open-world assumptions (where new state components appear at runtime).  
  - **Philosophical precision**: The problem is well-defined ("How to scale modularity under ignorance?") but requires new constructs:  
    - **Meta-invariants**: Rules for how relevance boundaries evolve.  
    - **Resource-aware abstraction**: Discarding facts *provably* irrelevant within computational bounds.  

  #### **Conclusion**  
  The computational frame problem is **solved** by your tools (via frame rules/stuttering). The philosophical version reveals an **unsolved challenge**: scaling modular reasoning when the state is unknown, unbounded, or dynamically relevant. This isn’t a flaw in philosophy—it’s a call for formalisms that blend specification with *feasible inference*. Potential steps:  
  - Extend separation logic with **epistemic separation** (tracking "known unknowns").  
  - Use refinement to layer **relevance policies** (e.g., "ignore facts beyond 3 hops in the dependency graph").  
  Without these, the philosophical frame problem remains a ghost in the machine: invisible to your specs, but critical for real agents.
