  First, I notice the user has done extensive self-education through library and online sources. They're intellectually curious but concerned their views might not cohere. This seems like someone who values systematic thinking and wants expert validation.

  Looking at their six points:
  Point 1 is standard evolutionary biology - uncontroversial. 
  Point 2 about trial-and-error learning as mindedness is reasonable but needs clarification on "mindedness" boundaries. 
  Point 3 on internal simulation is strong but overlaps with point 6.
  Point 4 about cultural scaffolding in humans is well-supported.
  Point 5 about animal consciousness and moral status is ethically important but philosophically contested.
  Point 6 claims reflection requires symbol systems - this seems problematic and conflicts with point 3.

  The major tension appears between points 3 and 6. If animals like corvids can simulate internally without language, that contradicts the claim that reflection requires symbols. Also point 6's "genuine thought" definition might be too narrow.

  For controversial areas:
  - Consciousness (point 5) is hotly debated
  - The symbol system requirement (point 6) is disputed
  - Moral status extensions (point 5) involve ethical disagreements

  I should suggest revising point 6 to be less restrictive, perhaps distinguishing between different cognitive capabilities rather than creating hierarchies. The user might benefit from exploring embodied cognition theories as alternatives to language-centric models.

