  First, I need to assess if their diagnosis is correct. The user is asking whether this is a substantive disagreement or more of a verbal dispute. They also wonder what would count as progress. Let me break this down.

  The user mentions that both sides keep classical logic. Epistemicists maintain it fully, while supervaluationists preserve it for tautologies but introduce truth-value gaps. The sorites major premise is false in both, but for different reasons. So the disagreement isn't about which sentences are true but the underlying semantics.

  The user's theory about semantics' purpose seems spot-on. Epistemicists are committed to bivalence and metaphysical determinacy. Williamson ties meaning to use but insists that usage fixes exact boundaries, even if unknowable. Supervaluationists, however, see meaning as underdetermined, leading to gaps. So the core is indeed about what semantics should do: describe reality faithfully versus accommodate indeterminacy.

  But is there a deeper factual disagreement? One point is the nature of borderline cases. Epistemicists view them as epistemic—we don't know the exact boundary. Supervaluationists see them as semantic—no fact of the matter. This ties into the user's question about what "borderline" means. Resolving this might require insights beyond philosophy, like cognitive science. How do people process borderline cases? If evidence shows we treat them as lacking truth values, that might favor supervaluationism.

  Another angle is metaphysical commitments. Epistemicism implies sharp boundaries in reality, which some find implausible. For example, is there really a precise number of grains that make a heap? If the world itself is vague, epistemicism's metaphysical stance might be problematic. Supervaluationism avoids this by making vagueness semantic, not ontological. But then, can semantics alone handle vagueness without ontological implications? That's tricky.

  The user asks if it's a verbal dispute. While both use terms like "truth" and "meaning," their definitions differ. Epistemicists have a classical, binary truth, while supervaluationists have super-truth across sharpenings. So yes, partially verbal, but also foundational in what they prioritize in semantics.

  Regarding progress, formal results might not resolve it. Williamson's margin for error and higher-order vagueness are challenges. Supervaluationism struggles with higher-order vagueness too. Maybe empirical work on cognition or language use could help. If studies show that people naturally accept truth-value gaps, supervaluationism gains ground. Alternatively, if epistemicism's unknowable boundaries align with how we handle uncertainty, that's a point for them.

  Also, considering other theories like degree-based approaches or paraconsistent logics might offer alternatives, but the user is focused on the current standoff. The instructor might want them to see that philosophical debates often hinge on foundational priorities rather than empirical facts.

  In conclusion, the user's diagnosis is correct. The standoff is about the role of semantics. Progress might come from interdisciplinary insights or re-evaluating what we expect from a theory of vagueness. The user's deeper need might be understanding how to navigate such stalemates in philosophy, recognizing that some debates reflect differing values rather than solvable puzzles.
answer: |-
  Your diagnosis is remarkably sharp and hits the core of the standoff. While there *are* substantive disagreements hiding underneath, the primary conflict is indeed **foundational and methodological**: it's about the core goals and commitments of semantic theory itself, not just the truth-values of specific sentences. Let's break it down:

  1.  **Your Diagnosis is Largely Correct:**
      *   **Epistemicism's Priority:** Protects bivalence, classical logic/metaphysics, and a **realist picture of meaning**. Meaning is fully determined by use/convention, and *therefore* must fix a precise extension, even if unknowable. Vagueness is an *epistemic* phenomenon (lack of knowledge), not a *semantic* one (lack of fact). Its driving force is preserving a clean, classical, bivalent picture of reality and logic.
      *   **Supervaluationism's Priority:** Protects the **phenomenology of vagueness** and the idea that meaning is *inherently* underdetermined for borderline cases. Insists semantics must reflect that nothing in our linguistic practice or the world fixes a sharp boundary. Vagueness is a *semantic* phenomenon (indeterminacy of truth-value). Its driving force is respecting linguistic practice and the apparent absence of facts settling borderline cases.

  2.  **Substantive Disagreements Underneath the Methodological Split:**
      *   **The Nature of Borderline Cases:** This is the most direct factual clash.
          *   *Epistemicist:* Borderline cases *are* cases where the predicate determinately applies or doesn't, but we *cannot know* which. "Joe is borderline bald" means "Joe is either determinately bald or determinately not bald, but we can't tell which."
          *   *Supervaluationist:* Borderline cases are cases where the predicate *fails to have a determinate extension*. "Joe is borderline bald" means "There is no fact of the matter whether 'bald' applies to Joe."
      *   **The Metaphysics of Boundaries:** Is there *really* a sharp boundary "out there"?
          *   *Epistemicist:* Yes, absolutely. Reality (or meaning) *is* precise. The boundary exists objectively, even if hidden from us.
          *   *Supervaluationist:* No. The *appearance* of no sharp boundary is veridical. The boundary isn't hidden; it's *absent*. Reality/properties might be vague, or at least, our semantic access to them is.
      *   **Higher-Order Vagueness:** How to handle the vagueness *of* "borderline" itself?
          *   *Epistemicist:* This is a major challenge. Williamson uses increasingly complex "margin for error" principles, but it arguably leads to deeply counterintuitive unknowability cascades (e.g., we can't even know there *is* vagueness, or know that we don't know where the boundary is?).
          *   *Supervaluationist:* Also a major challenge ("higher-order indeterminacy"). Can we define "admissible sharpening" sharply? If not, the supervaluationist framework itself seems to inherit vagueness, potentially undermining its own foundations.
      *   **The Link Between Meaning and Use:** How does linguistic practice determine meaning?
          *   *Epistemicist:* Use *does* fix a precise extension, even though we cannot discern it. Meaning is fully determinate *despite* the fuzziness of use.
          *   *Supervaluationist:* Use *fails* to fix a precise extension for borderline cases, and meaning *should reflect* this underdetermination. Meaning is partially indeterminate *because* of the fuzziness of use.

  3.  **Is it a Verbal Dispute?**
      *   **Partly, but not entirely.** They often use key terms ("truth," "meaning," "determinate," "borderline") with subtly or significantly different meanings. "Truth" for an epistemicist is classical bivalent truth. "Truth" for a supervaluationist often means "super-truth" (true on all sharpenings). This creates friction.
      *   However, the disagreement about the *nature of borderline cases* and the *existence of sharp boundaries* is substantive. They genuinely disagree about what the world/meaning is like, not just how to describe it. One side asserts a sharp boundary exists (unknowably); the other denies its existence.

  4.  **What Would Count as Progress?**
      Progress is hard in such foundational disputes, but potential avenues exist:
      *   **Resolving Higher-Order Vagueness:** A convincing formal *or* philosophical account handling higher-order vagueness within either framework would be major progress. Both struggle here significantly. A demonstration that one framework *cannot in principle* handle it cleanly would weaken it.
      *   **Empirical Insights (Cognitive Science/Linguistics):** Evidence about how humans *actually* process and reason with vague concepts could be decisive. Do we treat borderline cases as having a hidden truth (epistemicist) or as genuinely indeterminate (supervaluationist)? Do our reasoning patterns align more with classical logic plus ignorance, or with a gappy logic? Findings favoring one cognitive model could lend significant weight to the corresponding semantic theory. (This is increasingly seen as crucial).
      *   **Explanatory Power:** A theory that better explains *why* the sorites paradox feels compelling, or *why* we have vague concepts at all, gains ground. Does epistemicism's "unknowable boundary" explain the *phenomenology* of hesitation and disagreement better than supervaluationism's "no fact of the matter"?
      *   **Pragmatic/Conceptual Costs:** Demonstrating that one theory leads to more severe *unacceptable* consequences than the other. For example:
          *   Does epistemicism's commitment to unknowable boundaries imply other deeply counterintuitive unknowabilities (e.g., about the number of grains in a heap, or even about whether vagueness exists at all)?
          *   Does supervaluationism's reliance on "admissible sharpenings" collapse under its own higher-order vagueness, or make communication/agreement inexplicable?
      *   **Admitting the Question is Ill-Posed?** Some (e.g., contextualists, pragmatic theorists) argue both approaches are wrong because they mislocate vagueness solely in semantics. They might see progress in shifting the focus entirely to context, psychology, or pragmatics. Others might argue that "What is the semantics of vague predicates?" *presupposes* a classical framework that is inappropriate, and progress means finding a radically new framework (e.g., fuzzy logics, though these have their own severe issues).
      *   **Formal Results:** While important for working out internal consistency and implications (e.g., Fine's and Keefe's formal supervaluationist models, Williamson's epistemic logic), formal results alone are unlikely to break the standoff. Both frameworks *can* be made formally coherent to a large extent. The disagreement is about which formalization best captures the *phenomenon* and aligns with our broader philosophical commitments.

  **Conclusion:**

  You've nailed the essence. The standoff between epistemicism and supervaluationism is fundamentally a clash of philosophical **values and priorities** regarding semantics and metaphysics:

  *   **Epistemicism** values **bivalence, classical logic, metaphysical determinacy, and a robust conception of meaning** as fully fixing extension, even at the cost of positing massive, in-principle unknowability.
  *   **Supervaluationism** values **respecting the phenomenology of vagueness, avoiding commitment to unknowable facts, and reflecting the underdetermination of meaning by use**, even at the cost of introducing truth-value gaps and complicating the logic.

  While there are substantive disagreements about the existence of sharp boundaries and the nature of borderline cases lurking beneath, the engine of the dispute is this foundational difference in what a semantic theory *should do* and what it *should preserve*. Progress is less likely to come from a "knockdown" argument within pure semantics and more likely from interdisciplinary insights (especially cognitive science), successfully tackling higher-order vagueness, or a convincing demonstration of the unacceptable pragmatic or metaphysical costs of one approach. The debate endures because both sides protect something deeply important, yet seemingly incompatible, about language and the world. Your seminar is grappling with a genuine, hardcore philosophical stalemate.
