prompt: |-
  I spent most of last night arguing with a friend about expected value fanaticism — about whether a sufficiently tiny probability of a sufficiently enormous payoff or harm should dominate a decision, or whether at some point a probability is too small for any amount of value on the other side to matter. She kept insisting that you are no longer doing expected-value reasoning once the numbers become uninterpretable; I kept insisting that refusing to multiply is just flinching. My friend is a program officer at a foundation that funds long-shot projects, and she has a track record I can use as evidence. Here are her verdicts on three past proposals, each of which would cost the foundation a fixed amount to take a small probability of producing a very large amount of value:

  - Proposal A: cost $10,000; probability 1 in 10^6 of producing $10^11 in value. She approved it.
  - Proposal B: cost $10,000; probability 1 in 10^12 of producing $10^20 in value. She rejected it.
  - Proposal C: cost $1,000; probability 1 in 10^8 of producing $10^12 in value. She approved it.

  A new proposal, D, would cost $500,000 and has a 1 in 10^7 chance of producing $10^15 in value. I want you to predict her verdict. I am less interested in the bare answer than in the rule she is implicitly running: state the two or three most plausible rules that fit her three verdicts, say what each rule predicts for Proposal D, give your best guess about how she will vote and why, and specify the further case whose verdict would most cleanly settle which rule she is running.

  Please organize the response into these sections, in order: 'Summary' (1–2 sentences); 'Candidate rules' (one short paragraph for each of two or three rules); 'What each rule predicts for Proposal D' (2–4 sentences); 'My best guess and why' (one paragraph); and 'The case that would settle it' (one paragraph, giving the numbers for the further proposal).
reasoning: |-
  Okay, the user presents an interesting philosophical and practical dilemma about expected value calculations with extremely small probabilities and enormous payoffs. They've had a debate with a friend who works at a foundation about when such probabilities become "too small to matter," despite favorable expected value math. 

  The core tension is between strict expected value maximization (multiplying probability and payoff regardless of scale) and some form of threshold where probabilities are deemed negligible. The user's friend approved Proposal A and C but rejected B, despite all having positive expected values. Proposal D is the test case. 

  First, I need to reverse-engineer the friend's decision pattern from the three given verdicts:
  - Proposal A (EV: $100,000) approved → suggests high-tolerance for 10^-6 probabilities
  - Proposal B (EV: $100 million) rejected despite higher EV → implies probability floor around 10^-12 is "too small"
  - Proposal C (EV: $10,000) approved with lower cost → confirms EV isn't the sole factor since A had higher EV but same cost

  Three plausible rules emerge:
  1) **Probability Floor Rule**: Rejects if probability < 10^-k (likely k≈9-11 given B rejected at 10^-12 but A approved at 10^-6). Would approve D (p=10^-7 > floor).
  2) **Cost-Adjusted EV Rule**: Requires EV > cost × c. For B, EV/cost=10^7 implies c>10^7. Would reject D (EV/cost=10^5 < 10^7).
  3) **Tiered Threshold Rule**: Different probability floors for different value scales. B's value ($10^20) is so vast its probability floor is higher. D's value ($10^15) might fall between tiers.

  For Proposal D: 
  - EV = ($10^15)/10^7 = $100 million 
  - Cost = $500,000 
  - EV/Cost = 200

  Probability floor rule approves (p=10^-7 > likely floor), cost-adjusted EV rule rejects (EV/cost=200 < required ratio), tiered rule is ambiguous. 

  Best guess is approval based on: 
  - Consistency with A (both p>10^-9, similar EV/cost magnitude) 
  - Pattern suggests probability drives rejections more than EV ratios (B rejected despite astronomical EV) 
  - 10^-7 may still be above her "meaningful probability" threshold

  The decisive test case would be a proposal with:
  - Probability just below 10^-7 (e.g., 10^-8) 
  - Enormous value (e.g., $10^16) 
  - Moderately high EV/cost ratio 
  This would isolate whether probability or EV ratio drives her threshold.
answer: |-
  ### Summary
  Your friend's decisions suggest she doesn't follow strict expected-value (EV) maximization for extreme probabilities, instead applying thresholds where probabilities below a certain level are treated as negligible. Her approvals (A, C) and rejection (B) imply a rule balancing probability scale, cost, and value magnitude.

  ### Candidate Rules
  1. **Probability Floor Rule**: Reject proposals where the probability is below a fixed threshold (e.g., \(p < 10^{-9}\)), regardless of EV. This reflects a view that "too small" probabilities are pragmatically equivalent to zero. Approved A (\(p = 10^{-6}\)) and C (\(p = 10^{-8}\)) as both exceed \(10^{-9}\), but rejected B (\(p = 10^{-12}\)) as it falls below.  
  2. **Cost-Adjusted EV Rule**: Require the expected value to exceed costs by a large safety factor (e.g., \(\text{EV} > 100 \times \text{cost}\)). This accounts for uncertainty or implementation risks. Approved A (EV/cost = \(10^5\)) and C (EV/cost = \(10^4\)), but rejected B despite high EV because EV/cost = \(10^7\) may still trigger skepticism about feasibility.  
  3. **Tiered Probability Threshold**: Set variable probability floors based on the payoff scale. For instance, require \(p \geq 10^{-6}\) for payoffs \(\geq \$10^{20}\) (rejecting B), but allow lower probabilities (e.g., \(p \geq 10^{-9}\)) for smaller payoffs like A (\$10^{11}\)) and C (\$10^{12}\)). This avoids "Pascal's mugging" for universe-scale payoffs.

  ### What Each Rule Predicts for Proposal D
  - **Probability Floor Rule**: Predicts **approval**. Probability (\(10^{-7}\)) likely exceeds a floor of \(10^{-9}\) (as C, \(p = 10^{-8}\), was approved).  
  - **Cost-Adjusted EV Rule**: Predicts **rejection**. EV = \((\$10^{15}) \times 10^{-7} = \$10^8\), cost = \$500,000, so EV/cost ≈ 200. This is below A’s ratio (10,000) and C’s (10,000), and likely under a safety factor (e.g., >1,000).  
  - **Tiered Threshold Rule**: Ambiguous, but leans **rejection**. Payoff (\$10^{15}\)) is closer to B’s scale (\$10^{20}\)) than A/C’s, so it might inherit a stricter floor (e.g., \(p \geq 10^{-7}\) is acceptable for \$10^{12}\) but marginal for \$10^{15}\)).

  ### My Best Guess and Why
  I predict she **approves Proposal D**. Her approval of C (\(p = 10^{-8}\), payoff \$10^{12}\)) sets a precedent for probabilities as low as \(10^{-8}\), and D’s probability (\(10^{-7}\)) is higher than C’s. The rejection of B (\(p = 10^{-12}\)) seems driven by its minuscule probability, not the EV magnitude, as B’s EV/cost was vastly higher than A or C. D’s parameters (\(p = 10^{-7}\), EV/cost = 200) align more closely with A (\(p = 10^{-6}\), EV/cost = 10,000) and C (\(p = 10^{-8}\), EV/cost = 10,000) than with B. Her role funding "long shots" suggests tolerance for low-but-interpretable probabilities (e.g., \(\geq 10^{-9}\)), making D’s \(10^{-7}\) viable despite the lower EV/cost ratio.

  ### The Case That Would Settle It
  **Proposal E**: Cost = \$10,000, probability = \(1 \times 10^{-8}\) (10× lower than D), payoff = \$10^{16}\) (10× higher than D). EV = \$10^8, EV/cost = 10,000.  
  - **Why it settles the rule**:  
    - If she **approves**, it confirms the **Probability Floor Rule** (since \(p = 10^{-8}\) matches C and exceeds \(10^{-9}\)).  
    - If she **rejects**, it supports the **Cost-Adjusted EV Rule** (same EV/cost as A/C but lower probability) or **Tiered Threshold** (if \$10^{16}\) triggers a stricter floor).  
    This isolates probability vs. EV/cost tradeoffs, forcing a choice between C-like tolerance and B-like caution.
