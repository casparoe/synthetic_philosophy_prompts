  Then, how likely is it that decision theory should remain silent here? This seems plausible. The game's payoff structure is pathological by design, and real-world decisions rarely involve such infinite series. Expected utility theory handles most cases well, so this might just be a boundary case. I'd put this at 50%, as it's a common view among decision theorists.

