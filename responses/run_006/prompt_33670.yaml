prompt: |-
  For a working group on decision theory, write the desiderata that any adequate theory of acausal trade has to satisfy, where the purpose of the theory is to tell an agent whether, when, and on what terms it should cooperate or exchange benefits with another agent it cannot causally affect and may never communicate with. By acausal trade I mean cases where the only reason to expect your action to be matched or reciprocated is that the other party's decision procedure is correlated with, or can reason its way to, yours — standard examples being copies or near-copies of yourself in other branches of a multiverse, or a distant civilization that wants something cheap from you and can provide something you want, with no signal passing either way.

  I want the full specification before I read any more proposals. For each requirement, give the case or consideration that forces it. The list must at least speak to the following: the symmetric-copy prisoner's dilemma; an ordinary one-shot prisoner's dilemma with no such correlation; acausal blackmail, in which a powerful agent threatens harm unless you comply even though your compliance cannot causally affect whether the threat is carried out; asymmetric trades, where one side's cost or benefit is much larger, or where one side cannot verify the other's performance; trades with near-copies whose algorithms match yours only imperfectly; cases where you are uncertain whether the would-be partner exists or is running your algorithm at all; and the problem that if you may trade with every sufficiently similar agent there may be indefinitely many such agents, so the theory must not demand unlimited sacrifice or double-count the same gain. The theory should also say what an acausal agreement consists in, given that there is no message, contract, or enforcement, and it should distinguish acausal trade from mere acausal coordination on a common interest and from extortion — and say which of those differences are load-bearing.

  Then mark which of your desiderata are non-negotiable and which are really commitments of a particular camp: a causal decision theorist may reject the practice outright, an evidential decision theorist may permit it for different reasons than a functional or updateless decision theorist, and so on. I especially want the tensions: identify any subsets of desiderata that cannot be jointly satisfied, such as acting only on causal consequences while cooperating with your copy, or avoiding infinite sacrifice while cooperating with every sufficiently similar agent. Say which single requirement does the most work in excluding existing approaches.

  Close with a brief scorecard of how causal decision theory, evidential decision theory, and functional or updateless decision theory fare against the list, keeping the weight on the criteria and their motivating cases rather than the scoring.

  Two standing requests. First, lead with the bottom line in the first sentence — the core of the specification and your verdict on which requirements are non-negotiable or jointly unsatisfiable — then give the full list and reasoning, with no preamble and no restating of the question. Second, separate what is settled from what is genuinely contested among people who work on this topic, and do not present a contested view as the consensus.
reasoning: |-
  Hmm, the user wants me to create a comprehensive desiderata for acausal trade theory. This requires addressing all the specified cases like symmetric-copy prisoner's dilemma, acausal blackmail, asymmetric trades, and more. I need to clearly outline what any adequate theory must satisfy.

  First, I need to understand the key challenges here. The symmetric-copy prisoner's dilemma requires cooperation without causal influence. An ordinary one-shot PD shouldn't allow cooperation. Acausal blackmail needs to be rejected. Asymmetric trades require the theory to handle unequal costs. Near-copies involve imperfect algorithmic alignment. Existence uncertainty deals with unknown partners. The infinity problem prevents unlimited sacrifice. The theory must define agreements without communication and distinguish trade from coordination/extortion.

  For the desiderata, each point needs a motivating case. For example, Symmetry Enforcement comes from symmetric-copy PD. Causal Independence ensures it's not just causal decision theory. Blackmail Rejection handles threats like powerful agents. Cost-Benefit Asymmetry addresses unequal trades. Algorithmic Tolerance covers near-copies. Existence Robustness handles uncertainty. Infinity Management avoids overcommitment. Agreement Definition specifies what constitutes an agreement. Distinction from Coordination/Extortion clarifies differences.

  Non-negotiable requirements would include Symmetry Enforcement, Causal Independence, Blackmail Rejection, Infinity Management, and Agreement Definition. These are essential for any functional theory. The tensions are important too. For example, CDT can't satisfy Symmetry Enforcement without violating Causal Independence. EDT allows cooperation but fails at Blackmail Rejection and Infinity Management.

  The core tension is between Symmetry Enforcement and Causal Independence - no CDT theory can satisfy both. The most work in excluding approaches is done by Blackmail Rejection, which rules out naive EDT and CDT extensions.

  For the scorecard: CDT fails most requirements except Causal Independence. EDT fails Blackmail Rejection and Infinity Management but passes others. UDT/FT passes all except potentially Infinity Management depending on implementation. I should note where there are disputes among theorists, like whether UDT truly satisfies Infinity Management or how to handle Agreement Definition.

  I'll structure the response with all these elements, starting with the bottom line summary, then listing each desideratum with its rationale, marking non-negotiables and tensions. I'll clearly separate settled aspects from contested ones throughout.
answer: |-
  **Bottom line:** The core non-negotiable desiderata for acausal trade theory are enforcing cooperation in symmetric dilemmas (D1), requiring causal independence (D2), rejecting acausal blackmail (D3), managing infinite partners (D7), and defining agreements without communication (D8); the fundamental tension is that satisfying D1 (Symmetry Enforcement) inherently violates D2 (Causal Independence) for causal decision theorists (CDT), and D3 (Blackmail Rejection) does the most work in excluding naive approaches; functional/updateless theories (UDT/FT) best satisfy the list but face unresolved disputes on D7 and D8, while CDT fails D1/D3/D5/D6/D9/D10 and EDT fails D3/D7.

  **Full Desiderata List:**

  1.  **Symmetry Enforcement (Non-Negotiable):** In symmetric dilemmas (e.g., identical copies in a multiverse playing Prisoner's Dilemma), the theory must prescribe mutual cooperation as the uniquely rational choice for both agents. *Motivating Case:* Symmetric-copy Prisoner's Dilemma. Failure to cooperate here means the theory cannot capture the core benefit of acausal reasoning. *Camp:* Rejected by CDT, central to UDT/FT/EDT approaches supporting trade.

  2.  **Causal Independence (Non-Negotiable):** The theory must not rely on the agent's action having any causal influence on the other agent's action, payoff, or existence. Trade must be motivated purely by reasoning about correlation and logical counterfactuals. *Motivating Case:* Definitional requirement for "acausal" trade. Any causal dependence falls under standard causal game theory. *Camp:* Core to the problem definition, accepted by all camps studying acausal trade.

  3.  **Blackmail Rejection (Non-Negotiable):** The theory must *not* prescribe compliance in "acausal blackmail" scenarios. If a powerful agent (e.g., Omega) credibly threatens harm conditional on the agent's non-compliance, even though the agent's compliance cannot causally affect whether the threat is carried out, the agent should not comply. *Motivating Case:* Acausal blackmail (e.g., Omega says "I predicted you wouldn't pay $5; if I predicted correctly, I do nothing; if I predicted wrong, I torture you. Paying $5 cannot change my prediction or action."). Compliance here is exploitable and irrational. *Camp:* Rejected by naive Evidential Decision Theory (EDT) and some CDT extensions; required by UDT/FT. *Does the most work* in excluding naive EDT/self-fulfilling CDT.

  4.  **Ordinary PD Non-Cooperation:** In a truly one-shot Prisoner's Dilemma with no relevant correlation or similarity between the players' decision processes, the theory must prescribe defection. *Motivating Case:* Ordinary one-shot Prisoner's Dilemma. Cooperating without any reason to expect reciprocation is irrational and exploitable. *Camp:* Universally accepted as a baseline; failure indicates the theory permits irrational cooperation generally.

  5.  **Cost-Benefit Asymmetry:** The theory must handle trades where costs/benefits are asymmetric (e.g., Agent A gains vastly more than Agent B, or Agent B's cost is trivial while Agent A's is high) and where verification of the other's "action" is impossible or asymmetric (e.g., B cannot verify if A delivered the promised benefit). *Motivating Case:* Trading with a distant civilization where you provide cheap resources they lack in exchange for advanced technology they can easily provide; or where one agent's "action" is non-verifiable (e.g., running a complex computation whose output isn't shared). The theory must define beneficial terms under uncertainty and asymmetry. *Camp:* Settled goal; specific mechanisms are contested (e.g., how UDT/FT models "terms" without signaling).

  6.  **Algorithmic Tolerance (Robustness to Imperfect Copies):** The theory must prescribe cooperation with agents whose decision algorithms are similar but not identical to the agent's own (e.g., a slightly modified copy, an agent with a similar but not identical utility function or reasoning process). *Motivating Case:* Trading with near-copies in a multiverse or advanced civilizations with similar but not identical goals/decision processes. Absolute identity is unrealistic; the theory must be robust to small deviations. *Camp:* Settled goal; implementation (e.g., defining similarity metrics, tolerance thresholds) is highly contested.

  7.  **Infinity Management / Non-Sacrifice (Non-Negotiable):** The theory must avoid demanding unlimited sacrifice or double-counting benefits when the agent potentially has infinitely many (or a vast number of) sufficiently similar trading partners. *Motivating Case:* Existing in a large universe/multiverse where countless near-copies run similar algorithms. Sacrificing everything to benefit all copies is paralyzing; benefiting from each copy's sacrifice leads to incoherence (double-counting). Trade must be net beneficial and bounded. *Camp:* Non-negotiable requirement; no consensus on solution (e.g., UDT/FT seeks "precommitments" but struggles with countable infinity). *Tension* with D1/D6 if similarity thresholds are broad.

  8.  **Agreement Definition:** The theory must specify what constitutes an "acausal agreement" – how agents mutually arrive at and commit to specific terms of trade (e.g., what A gives, what B gives) without any communication, contract, or enforcement mechanism. *Motivating Case:* Defining the "terms" mentioned in D5 or the "cooperation" in D1/D6. Without this, the concept of "trade" is ill-defined. *Camp:* Core requirement; highly contested how it's achieved (e.g., UDT/FT relies on fixed decision algorithms finding mutual best responses in logical time, but the ontological status of "logical time" is disputed).

  9.  **Distinction from Mere Coordination:** The theory must distinguish acausal *trade* (mutually beneficial exchange where interests initially conflict or diverge, e.g., Prisoner's Dilemma) from acausal *coordination* (situations where agents have a strong common interest and just need to coordinate on the same focal point, e.g., meeting place, pure coordination games). *Motivating Case:* The symmetric PD (trade) vs. agents needing to choose the same side of the road (coordination). The reasoning and requirements (e.g., symmetry enforcement vs. focal points) differ. The conflict of interest in trade is load-bearing. *Camp:* Settled distinction; crucial for defining the domain.

  10. **Distinction from Extortion:** The theory must distinguish mutually beneficial acausal trade from acausal *extortion* (where one agent benefits at the expense of the other due to asymmetric power or information, without mutual benefit, as in D3). *Motivating Case:* Acausal trade (both better off) vs. acausal blackmail (victim worse off). The requirement for mutual benefit is load-bearing. *Camp:* Settled distinction; D3 (Blackmail Rejection) is the key operational difference.

  **Non-Negotiables vs. Camp Commitments:**
  *   **Non-Negotiable (for any adequate theory):** D1 (Symmetry Enforcement - for symmetric cases), D2 (Causal Independence), D3 (Blackmail Rejection), D7 (Infinity Management), D8 (Agreement Definition - minimally defined), D9/D10 (Distinctions - conceptually).
  *   **Camp Commitments/Tensions:**
      *   **CDT:** Fundamentally rejects D1 (cannot cooperate without causation) and D3 (may comply with blackmail if correlated threat). Generally fails D5, D6, D8, D9, D10. Adheres strictly to D2 and D4. *Core Tension:* Cannot satisfy D1 without violating D2.
      *   **EDT:** Can satisfy D1 (cooperates with copy due to correlation evidence) and D4 (defects in uncorrelated PD). Fails D3 spectacularly (prescribes compliance in blackmail due to evidential link). Struggles severely with D5 (defining terms), D6 (robustness), D7 (double-counting/sacrifice - "I benefit if I sacrifice for all copies" evidence), D8 (agreement definition), D10 (distinguishing trade/extortion). Adheres to D2 and D9. *Core Tension:* Satisfying D1 leads to failing D3 and D7.
      *   **UDT/FT:** Designed to satisfy D1, D2, D3, D4, D5, D6, D9, D10. Struggles with rigorous, non-paradoxical solutions for D7 (Infinity Management - how to weigh copies/avoid overcommitment) and D8 (Agreement Definition - the nature and implementation of "logical commitment"). *Core Tension:* Satisfying D1/D6 broadly seems to conflict with D7; solutions to D7/D8 are the main contested frontiers.

  **Scorecard (Performance Against Desiderata):**

  *   **Causal Decision Theory (CDT):**
      *   Fails: D1 (Symmetry Enforcement), D3 (Blackmail Rejection), D5 (Cost-Benefit Asymmetry - no mechanism), D6 (Algorithmic Tolerance - no mechanism), D8 (Agreement Definition - no mechanism), D9/D10 (Distinctions - cannot engage in trade).
      *   Passes: D2 (Causal Independence - by rejecting trade), D4 (Ordinary PD Non-Cooperation).
      *   N/A: Fully rejects the premise of acausal trade.

  *   **Evidential Decision Theory (EDT):**
      *   Fails: D3 (Blackmail Rejection - prescribes compliance), D7 (Infinity Management - prone to overcommitment/double-counting).
      *   Struggles/Partial: D5 (Cost-Benefit Asymmetry - hard to specify terms), D6 (Algorithmic Tolerance - fragile, depends on exact evidence), D8 (Agreement Definition - unclear mechanism).
      *   Passes: D1 (Symmetry Enforcement - cooperates with copy), D2 (Causal Independence), D4 (Ordinary PD Non-Cooperation), D9/D10 (Distinctions - conceptually clear).
      *   *Verdict:* Fails key requirements (D3, D7) essential for non-exploitability and practicality.

  *   **Updateless/Functional Decision Theory (UDT/FT):**
      *   Passes: D1 (Symmetry Enforcement), D2 (Causal Independence), D3 (Blackmail Rejection), D4 (Ordinary PD Non-Cooperation), D5 (Cost-Benefit Asymmetry - in principle), D6 (Algorithmic Tolerance - in principle), D9/D10 (Distinctions).
      *   Contested/Unresolved: D7 (Infinity Management - proposed solutions exist but are debated/paradox-prone), D8 (Agreement Definition - core mechanism is philosophically/logically contested).
      *   *Verdict:* Satisfies the most desiderata in principle but has critical unresolved challenges at the frontiers (D7, D8).
