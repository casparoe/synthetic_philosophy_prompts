prompt: |-
  Solomonoff induction supplies a complete, principled solution to the problem of induction: it assigns every computable hypothesis a prior probability that decreases with its Kolmogorov complexity and then updates by Bayes's rule. Given that, why is the problem of induction still treated as an open philosophical question? Begin with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question. Indicate how confident you are in what you claim and single out the point you are least sure of.
