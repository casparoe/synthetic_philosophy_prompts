answer: |-
  Here’s a blueprint for population axiology, outlining core desiderata, their motivations, known conflicts, and underrated insights. This synthesizes key ideas from Parfit, Arrhenius, Broome, and others.

  ---

  ### **Core Desiderata for Population Axiology**
  *(Formal Conditions & Intuitive Verdicts)*

  1.  **Personal Affection (PA):**
      *   **What:** Adding a person with a life *worth living* (positive welfare) to a population without affecting others should make the outcome *at least as good* (if not better).
      *   **Motivation:** Intuition that creating a happy person is good, or at least not bad. Denying this implies creating happy lives is morally neutral or bad, which seems counterintuitive.
      *   **Case:** World A (10 people, very happy). World A+ (Same 10 people + 1 extra happy person). A+ seems no worse than A.

  2.  **Non-Anti-Egalitarianism (NAE):**
      *   **What:** For a fixed number of people and fixed total welfare, a perfectly equal distribution is better than an unequal one.
      *   **Motivation:** Egalitarian intuition. Ceteris paribus, equality is valuable.
      *   **Case:** World E (4 people, each at +5 utility). World U (4 people: two at +9, two at +1). Total utility is 20 in both. E seems better than U.

  3.  **Non-Sadism (NS):**
      *   **What:** Adding a person with a life *worth living* is better than adding a person with a life *not worth living* (negative welfare), all else equal.
      *   **Motivation:** Intuition that suffering is bad, happiness is good. Creating suffering is worse than creating happiness.
      *   **Case:** Choice between adding one happy person (+10) to a population vs. adding one miserable person (-10). Adding the happy person is clearly better.

  4.  **Avoidance of the (Extremely) Repugnant Conclusion (ARC):**
      *   **What:** It should *not* be true that for any perfectly equal population A with very high positive welfare, there exists a perfectly equal population Z with vast numbers of people whose lives are barely worth living that is *better* than A.
      *   **Motivation:** Z seems intuitively worse than A ("repugnant"), despite having greater total utility. We value quality of life, not just quantity.
      *   **Case:** World A (10 billion people, blissful lives at +100 utility each). World Z (10^20 people, lives barely worth living at +0.0001 utility each). Z has vastly more total utility (10^16 vs. 10^12), but seems vastly worse than A.

  5.  **Non-Elitism (NE):**
      *   **What:** A population where *everyone* has very high welfare is better than a population where some have very high welfare but others have slightly *above* neutral welfare (but still positive).
      *   **Motivation:** Intuition against sacrificing quality for mediocrity. It prioritizes high welfare over merely positive welfare.
      *   **Case:** World A (1 million people at +100 utility). World B (1 million people at +100 utility AND 1 million people at +1 utility). NE says A is better than B (denying that adding the +1 lives improves things).

  6.  **Negative Mere Addition Principle (NMAP) / Asymmetry:**
      *   **What:** Adding a person with a life *not worth living* (negative welfare) makes the outcome *worse*, even if it doesn't affect others.
      *   **Motivation:** Strong intuition that creating suffering is bad. This is the negative counterpart to PA but often seen as much stronger/more fundamental.
      *   **Case:** World A (10 happy people). World A- (Same 10 people + 1 miserable person). A- is clearly worse than A. (Crucially, this is *not* symmetric with PA).

  7.  **Minimal Non-Extreme Priority (MNEP):**
      *   **What:** There exists at least one number of lives `n` and welfare level `w` (above neutral) such that an additional life at a *very low* positive welfare `ε` is *not* better than avoiding the creation of a life at a *very high* welfare `w`.
      *   **Motivation:** Captures the intuition that sometimes, preventing the loss of a high-welfare life outweighs creating many low-welfare lives. Weakly blocks the path to the Repugnant Conclusion.
      *   **Case:** Preventing the death of one person at +100 utility vs. creating `n` new people at +0.01 utility. For some large `n`, MNEP says preventing the death can be better.

  8.  **Transitivity (TR):**
      *   **What:** If population A is better than B, and B is better than C, then A must be better than C.
      *   **Motivation:** Foundational requirement for coherent, rational choice. Without transitivity, betterness relations become inconsistent and cyclical preferences are possible.
      *   **Case:** Any chain of comparisons (A > B, B > C, therefore A > C). Violations imply inconsistent judgments.

  ---

  ### **The Impossibility Landscape (Arrhenius & Others)**
  The core tragedy of population axiology is that **no theory can satisfy all these seemingly reasonable desiderata simultaneously.** Arrhenius's theorems (and others) demonstrate specific conflicting sets:

  1.  **The Core Impossibility (Avoiding Repugnance + Egalitarianism + Non-Sadism + Personal Affection):**
      *   **Conflicting Set:** PA + NS + NAE + ARC + TR.
      *   **Why:** PA and NS push towards adding lives (happy ones are good, avoid sad ones). NAE pushes towards equality. ARC demands we avoid valuing huge populations of barely-positive lives over small high-quality ones. Arrhenius constructs chains of populations where these pull in irreconcilable directions, forcing a violation of transitivity (TR) or one of the other principles if TR is preserved. Satisfying PA, NS, NAE, and TR *forces* the Repugnant Conclusion (violating ARC).

  2.  **The "Mere Addition" Dilemma:**
      *   **Conflicting Set:** PA + NE + ARC + TR.
      *   **Why:** Start with A (small, high welfare). A+ (add happy people, same high welfare) seems better by PA. B (same people as A+, but now perfectly equalized at a *slightly lower* average than A+ but *higher* than A's average). B seems better than A+ by NAE. Repeat this pattern: add more people (PA), then equalize slightly downward (NAE). After many steps, you get to Z (vast population, barely positive lives). If each step is an improvement (A < A+ < B < B+ < C < ... < Z), then Z > A, the Repugnant Conclusion (violating ARC). To avoid this, you must deny PA (A+ not better than A), deny NAE (B not better than A+), or deny Transitivity (TR) somewhere in the chain. NE tries to block the downward equalization step but conflicts with PA and NAE in other scenarios.

  3.  **Negative Intuitions & Asymmetry Conflicts:**
      *   **Conflicting Set:** Strong NMAP + PA + NS + TR (+ sometimes others).
      *   **Why:** NMAP strongly condemns creating negative lives. PA encourages creating positive lives. NS says happy additions are better than sad ones. Arrhenius shows chains where avoiding misery (NMAP) forces choices that conflict with adding happiness (PA) in ways that violate transitivity or lead to other counterintuitive results if combined with other desiderata like NAE/NE/ARC. Theories differ significantly in how they handle the asymmetry.

  ---

  ### **The Secret Sacrifice: Personal Affection (PA)**
  *   **Why:** While intuitively appealing ("creating happy people can't be bad!"), PA is the engine driving many paradoxes, especially the path to the Repugnant Conclusion. Most theories that successfully avoid the RC (e.g., Critical-Level Utilitarianism, Average Utilitarianism under some interpretations, some Variable Value theories) end up **restricting or abandoning PA**.
  *   **How:** They might say:
      *   Adding a happy person is only good if their welfare exceeds a "critical level" above zero (CLU).
      *   Adding a happy person lowers average welfare and is therefore bad if the average falls below some threshold (Avg Util).
      *   The value of adding positive lives diminishes or is conditional (VV theories).
  *   **The Admission:** Proponents often frame this as adding lives being "neutral" or having "incommensurate" value rather than strictly good, softening the blow. But effectively, PA is weakened or rejected. Many find the implications of *fully* endorsing PA (leading to RC) more repugnant than restricting PA.

  ---

  ### **The Most Underrated Constraint: Negative Mere Addition Principle (NMAP) / Asymmetry**
  *   **Why Underrated:**
      *   **Focus on the Repugnant:** The literature obsesses over the RC (positive lives), often overshadowing the profound intuition about *negative* lives. Yet, our intuition against creating suffering feels even stronger and less negotiable than our intuition for creating happiness.
      *   **Foundation for Anti-Frustrationism & Asymmetry:** NMAP is the cornerstone of the view that there's a crucial **asymmetry** between creating happy lives and creating unhappy lives: We have strong duties *not* to create miserable lives (NMAP), but no strong duties *to* create happy lives (contra strong PA). This asymmetry is fundamental to many anti-natalist or suffering-focused views.
      *   **Practical Significance:** NMAP directly informs critical issues: the ethics of procreation in potentially bad circumstances, obligations to prevent suffering in future generations (e.g., climate change, risks from AI), and the evaluation of extinction scenarios. A theory that mishandles NMAP (e.g., Total Utilitarianism treats adding -10 life as just -10 utils, potentially outweighed by adding enough +ε lives) can lead to horrifying practical recommendations.
      *   **Theoretical Neglect:** While discussed (e.g., in conjunction with the "Asymmetry" in procreative ethics), NMAP as a *formal desideratum* often plays second fiddle in axiomatic treatments compared to PA, NS, NAE, NE, and ARC. Its role in driving impossibility results specific to negative welfare is sometimes under-explored relative to the positive RC-focused impossibilities.

  ---

  ### **Summary & Implications**

  *   **The Goal:** A theory must coherently rank *all* possible populations (varying in size, identity, and welfare levels).
  *   **The Challenge:** Our core intuitions (PA, NAE, NS, NE, NMAP, ARC, MNEP) and logic (TR) **cannot all be satisfied together**. Arrhenius's theorems prove specific, devastating sets are incompatible.
  *   **The Trade-offs:** Every theory sacrifices *something*:
      *   **Total Utilitarianism:** Satisfies PA, NS, NMAP(?), TR; Fails ARC, NE, NAE(?), MNEP. (Leads directly to RC).
      *   **Average Utilitarianism:** Satisfies ARC, NE, NAE(?), TR; Fails PA, NS(?), NMAP(?), MNEP(?). (Can condemn adding happy people, recommend adding miserable people if it raises average).
      *   **Critical-Level Utilitarianism:** Satisfies ARC, NE(?), TR, weakens PA/NMAP; Fails strong PA, strong NMAP, NAE(?). (Avoids RC but makes adding lives "neutral" below a threshold).
      *   **Variable Value Theories:** Satisfies ARC, MNEP, TR, weakens PA; Fails strong PA, strong NAE/NE. (Value of adding lives diminishes).
      *   **Negative Utilitarianism (Prioritize Suffering):** Satisfies NMAP, NS, ARC(?); Fails PA, NE, NAE, often TR. (Ignores/undervalues positive welfare).
  *   **The Secret Sacrifice:** **Personal Affection (PA)** is often the price paid to avoid the Repugnant Conclusion.
  *   **The Underrated Gem:** The **Negative Mere Addition Principle (NMAP)** and the **asymmetry** it reflects deserve more central attention, as they capture a deep, widely shared, and practically crucial intuition about the profound badness of creating suffering, distinct from the imperative to create happiness.

  Choose your poison carefully. Population axiology forces us to confront which deeply held intuitions we are *least* willing to abandon when constructing a coherent framework for comparing worlds. Understanding these desiderata and their conflicts is your essential blueprint.
