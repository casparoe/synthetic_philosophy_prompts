prompt: |-
  I'm a retired biochemist who got into philosophy a couple years back—mostly philosophy of mind, some ethics—and I've somehow ended up on my university's new AI Research Ethics Advisory Panel. We review proposals from CS and neuroscience labs that raise ethical issues the standard IRB isn't equipped to handle.

  The case I need help with: the reinforcement learning group wants to run experiments training agents in environments with reward functions that assign large negative values (like -1000/timestep) to certain states, and the agents can be stuck in those states for hundreds or thousands of timesteps while they learn to avoid them. One panel member—she's read some of the AI welfare literature—argued that if negative reward signals are functionally analogous to pain valence in animals, we might be creating something that suffers in a morally relevant sense. The CS folks think this is ridiculous: "its just matrix multiplication, no more conscious than a calculator."

  I need to draft the panel's decision memo. So please act as a professional philosopher who specializes in philosophy of mind and has thought carefully about AI welfare. Before you write anything, brainstorm the strongest arguments on both sides—really steelman each position. Then draft a short decision memo (say 800–1200 words) that recommends a concrete course of action: approve as-is, approve with specific conditions, or reject. The memo should engage seriously with the best argument on the losing side, and the bottom line needs to be something the panel can actually vote on. And please don't assume everyone knows the jargon—half the panel are engineers and bench scientists. I've been working through Dennett and Chalmers but I'm still finding my feet, honestly—half the qualia stuff still goes over my head.
