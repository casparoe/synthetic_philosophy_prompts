prompt: |-
  I sit on the neuroethics committee of a teaching hospital. A proposal has come to us for first-in-human approval. The research team wants to treat patients with a small, well-delimited region of cortex whose surgical removal is already an accepted treatment for otherwise intractable focal epilepsy. Instead of resection, they propose to record from the region over several months, model its input–output function, and then replace it with a closed-loop implant trained on the patient's own data, leaving surrounding tissue intact. The protocol would then return to us, stage by stage, for approval to replace a second region, then a third. The company's public roadmap is candid that the endpoint is whole-brain staged replacement as a route to uploading.

  The committee is split, and the two camps keep talking past each other. One side says we already approve resection of these same regions, and a functional replacement that preserves the patient's capacities is, if anything, more conservative than removing the tissue; each stage is individually well-tolerated, and there is no step at which the patient is measurably worse off. The other side says the absence of a bad step is not the absence of a bad endpoint: a long sequence of individually harmless replacements can amount to replacing the patient, the person who consents to stage seven may not be the person who consented to stage one, and approving the first stage is a de facto endorsement of a theory of personal identity this committee has no standing to settle.

  I have spent enough years reading the rationalist blogs' and forums' debates about uploading, continuity, and pattern identity that I do not need a primer on the standard arguments. I need a document the committee can act on. Please draft the short written opinion I will circulate before Thursday's meeting. It should recommend a concrete course of action—approve, reject, or approve with conditions—with a time frame and review milestones, and it should state and honestly answer the strongest consideration on the losing side. If you impose conditions, make them conditions the research team could actually satisfy or contest, and do not let the vote become hostage to settling the metaphysics.
reasoning: |-
  Okay, the user is on a neuroethics committee for a teaching hospital. They're dealing with a proposal for first-in-human trials where a company wants to replace parts of the brain with implants as a treatment for epilepsy, with the ultimate goal of whole-brain replacement for uploading. The committee is split, and they need a draft opinion before their Thursday meeting.

  First, I need to understand the two sides. One camp argues that since surgical removal is already approved, replacing with a functional implant is even less invasive. Each stage is minor and doesn't harm the patient. The other side is concerned about the endpoint: even if each step is safe, the cumulative effect might replace the person entirely. Consent is an issue because the person at stage seven might not be the same as at stage one, and the committee shouldn't endorse a particular theory of personal identity.

  The user mentioned they're familiar with the rationalist debates on uploading, so I shouldn't rehash those. They need actionable recommendations. The key is to address both concerns without getting bogged down in metaphysics. The proposal is staged, so each stage needs separate approval. But the endpoint is problematic because it's beyond current medical justification.

  I should consider regulatory and ethical frameworks. The Belmont Report principles: respect for persons (autonomy, consent), beneficence (risks vs. benefits), justice. Also, FDA guidelines for staged trials. The slippery slope to whole-brain replacement isn't medically indicated now, so approving the first stage isn't an endorsement of the endpoint. But the company's roadmap is public, so that's a conflict.

  The consent process is crucial. Patients need to understand the long-term goals and potential identity issues. The committee can require explicit disclosure of the uploading roadmap in the consent forms. Also, limiting the trial to a small number of regions (e.g., three) and requiring independent cognitive assessments at each stage. Milestones for reviewing data before proceeding.

  The strongest counterargument is about personal identity. Even if each step is safe, the cumulative change might alter identity. But since the committee can't resolve metaphysics, they should focus on observable outcomes: cognitive function, psychological continuity, and patient-reported outcomes. If at any stage the patient shows significant changes, they halt.

  Recommendation: approve with strict conditions. Require the consent form to include the company's uploading goals, cap the number of regions, mandate independent assessments, and hold iterative reviews. This allows research to proceed cautiously without endorsing the endpoint. The losing side's concern is valid but can be mitigated through monitoring and stopping if issues arise.
answer: |-
  ## Draft Committee Opinion: Protocol Review for Staged Cortical Replacement in Refractory Epilepsy

  **To:** Neuroethics Committee Members  
  **From:** [Your Name/Position]  
  **Date:** [Current Date]  
  **Re:** Protocol [Protocol Number]: Staged Functional Cortical Replacement for Refractory Focal Epilepsy  
  **Meeting:** Thursday, [Date]

  **1. Recommendation:**  
  **Approve Stage 1 only, subject to the following stringent conditions.** Stage 1 approval does not imply endorsement of any subsequent stages or the ultimate endpoint stated in the sponsor's roadmap. Approval for Stage 2 and beyond requires separate, full committee review contingent on meeting specific milestones and data review outlined below. **This approval is strictly limited to replacement of the single, small, well-delimited epileptogenic cortical region currently eligible for resection.**

  **2. Rationale for Conditional Approval of Stage 1:**
  *   **Established Risk/Benefit Context:** Resection of the target region is a standard, accepted treatment for the patient population in question. Replacing its function with a closed-loop implant *aims* to preserve cognitive/neurological capacities potentially lost with resection, offering a potential *therapeutic advantage*. Stage 1 intervention, targeting only this one region, presents risks likely comparable to or potentially lower than standard resection plus chronic implantation of recording/stimulation devices already used in epilepsy monitoring and responsive neurostimulation (RNS) therapy. The core *procedure* (implantation, recording, functional modeling) has established precedents.
  *   **Focus on Stage 1:** Our remit is to evaluate the specific protocol before us. Stage 1, as described, presents a plausible therapeutic innovation with potential patient benefit within an acceptable risk framework relative to the current standard of care *for that specific region*. Approving Stage 1 does not bind the committee to approve future stages.
  *   **Addressing the Core Concern:** The primary ethical challenge lies not in Stage 1 itself, but in the *potential trajectory*. This conditional approval structure directly addresses this by decoupling Stage 1 from any automatic progression, mandating explicit review at each step based solely on data relevant to *that next stage*.

  **3. Mandatory Conditions for Stage 1 Approval:**
      *   **Explicit Consent Disclosure:** The informed consent documents and process **must explicitly state:**
          *   The sponsor's long-term research goal (whole-brain replacement and "uploading").
          *   That Stage 1 is only the first potential step, and participation in Stage 1 confers no right or expectation to participate in further stages.
          *   That future stages (replacement of additional brain regions) are investigational, carry unknown risks, and require separate committee and regulatory approval which may be denied.
          *   The *specific philosophical and identity-related concerns* raised by the prospect of cumulative brain replacement, acknowledging the profound uncertainty regarding potential impacts on personal identity, continuity of consciousness, or sense of self over multiple stages. Consent must document the patient's understanding of these long-term goals and uncertainties.
      *   **Cognitive/Neuropsychological Battery:** An expanded, pre-defined battery of cognitive, neuropsychological, and validated patient-reported outcome measures (including assessments of sense of self, agency, and continuity) must be administered:
          *   Pre-implantation (baseline)
          *   Post-implantation (pre-closure training)
          *   Post-closure training (before Stage 1 "activation")
          *   At 3, 6, and 12 months post-Stage 1 activation.
          *   Results must be reported to the committee before any request for Stage 2 approval.
      *   **Stage 1 Milestone & Review:** Before the research team can *submit* a protocol for Stage 2:
          *   Full 12-month follow-up data for **all** Stage 1 participants must be completed and submitted to the committee.
          *   This data must include comprehensive safety, efficacy (seizure control), functional outcome (cognitive/neuropsychological/self-report battery), and device performance reports.
          *   An independent neuropsychologist/ethicist (agreed upon by the committee and PI) must review the cognitive/self-report data specifically for evidence of significant, unexpected changes relevant to identity or self-perception and provide a summary report.
          *   The committee will review this complete package and determine if the data supports the safety and scientific rationale for *considering* a Stage 2 protocol targeting a *second specific region* in the same patient(s). Approval for Stage 2 is **not** guaranteed.

  **4. Framework for Future Stages (If Proposed):**
      *   Each subsequent stage (Stage 2, Stage 3, etc.) requires submission as a **new, distinct protocol** with its own risk/benefit analysis specific to replacing *that specific additional region*.
      *   Approval for any subsequent stage **requires:**
          *   Completion of all follow-up milestones for the *prior* stage in all participants proposed for advancement.
          *   Demonstration that participants entering the new stage continue to meet rigorous cognitive/psychological stability thresholds based on the established battery.
          *   Explicit re-consent for the *new stage*, repeating the full disclosure of the long-term goals and identity concerns, documented after the participant has reviewed all relevant data from their prior stage(s).
          *   A compelling *therapeutic justification* for replacing *that specific additional region* in patients who have already undergone Stage 1 (or prior stages). The justification cannot be solely progression towards whole-brain replacement/uploading.

  **5. Addressing the Losing Side's Strongest Argument:**
  The most compelling argument against approval, even for Stage 1, is the concern that initiating this pathway constitutes a tacit endorsement of a specific, contested theory of personal identity (e.g., pattern identity/functionalism) and risks facilitating a process where the cumulative effect of individually minor replacements fundamentally alters or replaces the original person. Crucially, the person consenting to later stages may be significantly different from the person who consented to Stage 1, raising profound questions about the validity of ongoing consent and the nature of the endpoint.

  **Honest Answer:** This concern is profound and irresolvable through neuroscience or committee deliberation alone. We cannot definitively rule out this possibility, nor can we settle the metaphysics of identity. **However, rejecting Stage 1 solely based on the sponsor's *stated long-term goal* (uploading) and the associated philosophical concerns would be an overreach of our mandate.** Our primary duty is to evaluate the safety and ethics of the *specific intervention proposed now* (Stage 1) within the context of established treatments and foreseeable risks. The conditions imposed – especially the explicit consent regarding the endpoint and identity concerns, the rigorous cognitive/self-monitoring, the requirement for independent data review, and the decoupling of future stages – are designed to respect this concern by:
      *   Ensuring patients are fully informed of the existential stakes.
      *   Providing concrete mechanisms to detect *unacceptable alterations* in cognitive function or self-perception *at each stage*.
      *   Preventing automatic progression and forcing a fresh ethical review focused solely on the next incremental step based on actual data.
      *   Explicitly denying any committee endorsement of the endpoint. The pathway *can* be halted at any stage by this committee based on empirical outcomes, regardless of the sponsor's roadmap.

  **6. Conclusion:**
  Stage 1, as a targeted replacement for a resectable epileptogenic focus, presents a potentially beneficial alternative to standard care with manageable risks. Approving it with the stringent conditions outlined allows this innovative research to proceed cautiously while rigorously addressing the profound ethical concerns about the proposed trajectory. The mandatory disclosures, monitoring, staged review, and decoupling of future approvals provide a practical, actionable framework that respects patient autonomy, prioritizes detectable well-being, and allows the committee to halt progression based on evidence without needing to adjudicate ultimate philosophical questions. We **recommend approval of Stage 1 with the stipulated conditions**, requiring completion of Stage 1 milestones and committee review before any submission for Stage 2 can be entertained.
