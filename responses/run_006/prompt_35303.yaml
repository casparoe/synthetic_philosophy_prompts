answer: |-
  Here is a structured analysis of the desiderata for a theory of supererogation, categorized per your request. The core challenge lies in satisfying seemingly intuitive requirements that may pull in conflicting directions.

  **I. Non-Negotiable Desiderata (Failure invalidates the theory):**

  1.  **Distinction from Duty/Obligation:** The theory must clearly differentiate supererogatory acts from acts that are morally required or obligatory.
      *   **Motivation:** If an act is supererogatory, it *cannot* be obligatory. Failure here dissolves the concept entirely. Example: Saving a drowning child at minimal risk is paradigmatically obligatory. Jumping onto live grenades to save strangers is paradigmatically supererogatory. A theory that labels the latter as obligatory is counter-intuitive and collapses the category.

  2.  **Distinction from (Merely) Permissible Indifference:** The theory must differentiate supererogatory acts from acts that are merely morally permissible but carry no special positive moral value (morally neutral or indifferent acts).
      *   **Motivation:** Supererogatory acts are morally *good*, even laudable, whereas merely permissible acts like scratching your nose are morally neutral. Failure here trivializes supererogation. Example: Donating a kidney to a stranger is supererogatory; choosing vanilla over chocolate ice cream is merely permissible. Equating them is absurd.

  3.  **The Core Asymmetry (Praiseworthiness/Non-Blameworthiness):** The theory must explain why performing a supererogatory act is typically morally praiseworthy (or at minimum, morally good), while *failing* to perform it is *not* blameworthy (assuming standard conditions).
      *   **Motivation:** This asymmetry is the defining feature of supererogation. Praise for doing, no blame for not doing. Failure here means the theory fails to capture the phenomenon. Example: We praise the firefighter who rushes into a collapsing building to save a child (supererogatory), but we don't blame the firefighter who, assessing the extreme danger, does not (non-blameworthy omission).

  4.  **Continuity:** The theory must account for the spectrum of supererogatory acts, from minor favors (giving directions) to extreme sacrifices (martyrdom), without positing a sharp, arbitrary boundary where minor acts become obligatory or major acts lose their special status.
      *   **Motivation:** Moral life exhibits a smooth gradient of "good beyond duty." A theory that cannot accommodate both ends of this spectrum or imposes unnatural breaks fails descriptively. Example: Holding the door open is clearly supererogatory (if easily done), sacrificing your life for a cause is clearly supererogatory. A theory must handle the continuum between them.

  5.  **Optionality (Genuine Choice):** The theory must establish that supererogatory acts are genuinely optional – the agent has a morally permissible choice *not* to perform them without needing a specific justification beyond agent-relative reasons (like personal projects, interests, or costs).
      *   **Motivation:** If an act *must* be done (absent countervailing duties), it's obligatory. Supererogation implies a real choice to go beyond. Failure here collapses into duty. Example: An affluent person can morally choose *not* to donate a large portion of their wealth to effective charities (supererogatory omission), even if donating would be very good. They don't *owe* that donation as a duty.

  **II. Highly Desirable Desiderata (Failure weakens the theory significantly, but doesn't destroy it):**

  6.  **Normative Force:** The theory should explain why there are often *strong moral reasons* to perform supererogatory acts, even though they are not obligatory. They shouldn't be presented as morally weightless options.
      *   **Motivation:** Supererogatory acts aren't just permissible; they are positively good, often *very* good. A theory that makes them seem morally inert fails to capture their significance. Example: There are powerful reasons to donate to disaster relief (supererogatory), reasons far stronger than reasons to eat dessert.

  7.  **Explanatory Depth:** The theory should explain *why* the asymmetry exists. What is it about supererogatory acts or the moral landscape that grounds the praiseworthiness/non-blameworthiness distinction?
      *   **Motivation:** Merely describing the asymmetry isn't enough; a good theory illuminates its source. Failure leaves the core phenomenon mysterious.

  **III. Contested Desiderata (Rejected by significant traditions):**

  8.  **Compatibility with Impartiality / Agent-Centered Permissions:**
      *   **Motivation:** This is the **key differentiator** between major approaches. Consequentialism (especially act-utilitarianism) struggles mightily with supererogation precisely because its strong impartiality often implies that the best available act is *obligatory*. To accommodate supererogation, consequentialists typically need to introduce **agent-centered permissions** (allowing agents to give *some* priority to their own interests/projects) or deny maximizing impartiality is always obligatory. Non-consequentialist theories (Kantian, Virtue, Contractualist) generally find it easier to build in agent-centered permissions from the start.
      *   **Contested By:** Strong impartialists (especially strict act-consequentialists) may reject the *need* for a separate category of supererogation, arguing that what we call supererogatory is either obligatory (if best) or merely permissible (if sub-optimal but acceptable). They may see agent-centered permissions as an illegitimate concession.

  9.  **Motivational Freedom:** Some argue a supererogatory act must be done from a morally commendable motive (e.g., benevolence, duty+) to be truly supererogatory, not just have good consequences.
      *   **Motivation:** Performing a saintly sacrifice solely for fame seems morally deficient and perhaps not truly supererogatory in the fullest sense.
      *   **Contested By:** Consequentialists and others who prioritize outcomes may argue that the act's goodness (consequences) is what matters, regardless of motive (though motive might affect praiseworthiness *further*). Virtue ethicists strongly favor this desideratum.

  **IV. Potential Tensions & Pressure Points:**

  *   **Optionality vs. Normative Force:** How can an act be genuinely *optional* (no blame for omission) yet carry such *strong moral reasons* to perform it? This is the central tension. Theories risk either making the reasons too weak (trivializing supererogation) or too strong (collapsing into obligation). **This is the most fundamental pressure point.**
  *   **Continuity vs. Distinction:** Maintaining a smooth spectrum while sharply distinguishing supererogatory acts from both duty and mere permissibility is difficult. Where does "easy rescue" stop being supererogatory and become obligatory? How costly must an act be to move from merely permissible indifference to supererogatory? No clear line exists, posing a challenge for precise theories.
  *   **Asymmetry vs. Explanatory Depth:** Explaining *why* we praise performance but don't blame omission is non-trivial. Simply stating the asymmetry is inadequate, but providing a deep explanation that doesn't inadvertently justify blame for omission or undermine the praiseworthiness is challenging.
  *   **Optionality vs. Impartiality:** Strong impartiality (e.g., act-consequentialism) directly threatens genuine optionality. If the act produces the best outcome impartially considered, impartiality often demands it *is* obligatory. Accommodating optionality robustly seems to require abandoning strong impartiality in favor of agent-centered prerogatives. **This is likely the locus of a "no-go" result for strict impartial maximization.**

  **V. Key Differentiator:**

  The single desideratum that most sharply divides the main approaches is **Compatibility with Impartiality / Requirement for Agent-Centered Permissions (Desideratum 8)**.

  *   **Consequentialism:** Must actively *modify* strict impartial maximization (e.g., via satisficing, scalar consequentialism, or explicit agent-centered permissions) to accommodate supererogation. Struggles most with Optionality.
  *   **Kantianism:** Built-in agent-centered permissions via imperfect duties and the latitude in how we pursue the happiness of others. Accommodates supererogation relatively naturally.
  *   **Virtue Ethics:** Focuses on character. Supererogation arises from excellences of character (benevolence, courage) that go beyond the requirements of mere decency (justice). Strong on Motivational Freedom and Continuity.
  *   **Contractualism (Scanlon-style):** Defines duty via principles no one could reasonably reject. Supererogation might be what is "beyond the call" of such principles, or permitted by principles allowing significant agent-favoring. Handles Optionality via the reasonableness standard.

  **Brief Scorecard of Approaches vs. Key Desiderata:**

  | Desideratum          | Consequentialism | Kantianism | Virtue Ethics | Contractualism |
  | :------------------- | :--------------- | :--------- | :------------ | :------------- |
  | Distinction (Duty)   | ⚠️ (Struggles)   | ✅          | ✅             | ✅              |
  | Distinction (Permiss)| ✅                | ✅          | ✅             | ✅              |
  | Core Asymmetry       | ⚠️ (Explains?)   | ✅          | ✅             | ✅              |
  | Continuity           | ✅                | ⚠️          | ✅             | ⚠️             |
  | **Optionality**      | ❌ (Major Issue)  | ✅          | ✅             | ✅              |
  | Normative Force      | ✅✅ (Strong)     | ✅          | ✅             | ✅              |
  | Agent-Centered Perms | ❌ (Needs Add-on) | ✅          | ✅             | ✅              |
  | Motivational Freedom | ⚠️/❌             | ⚠️         | ✅✅           | ⚠️             |

  **(✅ = Generally Satisfies, ⚠️ = Satisfies with Caveats/Difficulty, ❌ = Fundamental Struggle)**

  This framework provides the necessary pressure points and distinctions to rigorously evaluate any theory of supererogation. The tensions, especially between Optionality, Normative Force, and Impartiality, highlight where theoretical innovation is most needed and where compromises might be inevitable. Good luck with developing your theory!
