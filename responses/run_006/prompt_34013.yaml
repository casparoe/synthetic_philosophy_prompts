  **MEMORANDUM**  
  To: Pretrial Services Working Group  
  From: [Your Name], Policy Subcommittee  
  Date: [Current Date]  
  Subject: Recommendation for Reporting Risk-Assessment Scores at Bail Hearings  

  ### I. Introduction  
  This memo addresses the core dispute in our working group regarding how risk-assessment scores (specifically, failure-to-appear/FTA probabilities) should be reported to judges, using the illustrative case of a 34-year-old defendant charged with felony theft and one prior FTA. The divergence in FTA rates across reference classes—21% (county-wide), 43% (men aged 30–39 with prior FTA), and 76% (full-profile match, *n* = 17)—highlights a fundamental tension between statistical specificity and reliability. This memo synthesizes the competing views, recommends a revised reporting policy, and outlines implementation steps.  

  ### II. Summary of Competing Views  
  The group’s disagreement centers on three perspectives:  
  1. **Narrowest Reference Class Advocates**: Argue that the full-profile match (76%) is the only ethically defensible metric, as it reflects the defendant’s unique circumstances. Ignoring it, they contend, disregards data most relevant to individualized justice.  
  2. **Intermediate Reference Class Advocates**: Assert that small samples (e.g., *n* = 17) produce volatile, unreliable estimates. The 43% rate (men aged 30–39 with prior FTA) balances specificity and stability, avoiding "noise" from undersized cells.  
  3. **Reference Class Skeptics**: Maintain that no single class is "objectively correct." Risk is inherently contextual, and presenting any single number obscures this ambiguity. Judges should weigh multiple rates qualitatively.  

  ### III. Recommended Reporting Policy  
  After evaluating these positions, **we recommend reporting a *bounded range* of FTA probabilities alongside contextual annotations**, rather than a single number or no score. This approach acknowledges the merits of each view while mitigating their limitations.  

  #### A. **What to Report**  
  1. **Primary Output**: A range spanning the **intermediate class rate** (e.g., men aged 30–39 with prior FTA) and the **narrowest class rate** (e.g., full-profile match), *when the narrowest class has ≥20 cases*.  
     - *Example for the case at hand*: "FTA Risk Range: 43–76%. The low end reflects defendants with similar age/prior FTA; the high end reflects defendants matching all key factors (charge type, zip, etc.)."  
  2. **Small-Sample Protocol**: If the narrowest class has <20 cases, report the intermediate class rate **only**, annotated with:  
     - *Example*: "FTA Risk: 43%. Note: A more specific subgroup (matching all factors) was too small (*n* = 17) for a reliable estimate."  
  3. **Mandatory Context**: All reports must include:  
     - Sample sizes for each reference class.  
     - A brief disclaimer: "Risk scores reflect group averages, not individual predictions. Judges must weigh this information alongside case-specific factors."  

  #### B. **Why This Approach?**  
  - **Addresses Narrowest-Class Advocates**: The range preserves granular data without treating small samples as definitive. It signals that the defendant’s risk *could* align with the higher rate, fulfilling the duty to disclose case-specific information.  
  - **Addresses Intermediate-Class Advocates**: It defaults to the intermediate rate when narrow data is sparse, avoiding overreliance on unstable estimates. The 20-case threshold ensures statistical rigor (aligned with sample size standards in social science).  
  - **Addresses Reference Class Skeptics**: The range explicitly quantifies uncertainty, inviting judges to treat risk as a spectrum rather than a fact. Annotations frame scores as one input among many, reducing overinterpretation.  
  - **Practical Balance**: Judges receive actionable data (a defined range or single number) without drowning in complexity. National best practices (e.g., PSA Framework) support "transparent uncertainty reporting."  

  #### C. **Instructions to Judges**  
  Training and bench guides should emphasize:  
  1. **Scores as Context, Not Determinants**: "Risk ranges estimate probabilities for *groups* of similar defendants. They do not predict this defendant’s behavior. Your decision must consider statutory factors (e.g., flight risk, public safety) and case details (e.g., employment, ties to community)."  
  2. **Interpreting Ranges**:  
     - A narrow range (e.g., 40–45%) suggests high confidence.  
     - A wide range (e.g., 43–76%) signals uncertainty—favor the lower end if the defendant presents mitigating circumstances; consider the upper end if aggravating factors dominate.  
  3. **Small-Sample Caveats**: Highlight that scores based on <20 cases lack precision; judges should seek additional information from pretrial officers.  

  ### IV. Implementation Timeline  
  | Phase | Action | Deadline |  
  |-------|--------|----------|  
  | 1 | **Policy Finalization**: Working group vote on this memo | This Thursday’s meeting |  
  | 2 | **Tool & Template Updates**: IT modifies risk-assessment output to generate ranges/annotations | 3 weeks |  
  | 3 | **Training**: Pretrial officers and judges trained on new protocol (90-min session) | 5 weeks |  
  | 4 | **Pilot**: Soft launch for 30 days; feedback collected | 6–10 weeks |  
  | 5 | **Full Implementation** | 12 weeks |  

  ### V. Conclusion  
  The bounded-range policy respects the ethical demand for specificity while honoring statistical realities. It transforms the "reference class problem" from a philosophical obstacle into a structured input for judicial discretion. By Thursday, please come prepared to: (1) debate the 20-case threshold, (2) refine annotation language, and (3) identify training leads. This proposal ensures our tool informs—but does not dictate—bail decisions, preserving the judiciary’s duty to individualize justice.  

  **Attachment**: Draft Bench Guide Excerpt (see next page)  

  ---  
  **DRAFT BENCH GUIDE EXCERPT**  
  **Using Risk-Assessment Scores at Bail Hearings**  
  - **What You See**: A risk range (e.g., 20–45%) or single number, with sample sizes and notes on reliability.  
  - **What to Do**:  
    1. Consider the range’s width: Wider = more uncertainty.  
    2. Note small sample sizes (<20): Request supplemental details from pretrial services.  
    3. Balance scores with defendant-specific facts (e.g., stability, victim statements).  
  - **What to Avoid**:  
    - Using the score as a standalone threshold for release/detention.  
    - Ignoring annotations about data limitations.  
  - **Reminder**: These scores estimate "group risk," not this defendant’s behavior.
