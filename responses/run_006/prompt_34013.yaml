  We are drafting a memo to address a policy question on how to report risk-assessment scores to judges in bail hearings. The core issue is the reference class problem: which statistical group's failure-to-appear (FTA) rate should be used for a defendant when the tool produces a single number but the underlying data shows variation across different reference classes (broad, intermediate, narrow).

  The case example:
  - Defendant: 34-year-old man, charged with felony theft, one prior FTA.
  - FTA rates from the data:
    - Overall county: 21%
    - Men aged 30-39 with a prior FTA: 43%
    - Narrowest group (age, charge type, zip code, prior record): 76% (but only 17 people in this group)

  Three factions:
  1. Use the narrowest class (most similar) because it's the most specific to the defendant.
  2. Use the intermediate class (men 30-39 with prior FTA) because the narrow class is too small (only 17) and may be noisy/unreliable.
  3. The reference class problem: there is no single "true" probability until we fix a reference class, and the data alone doesn't fix it.

  We need to recommend a concrete policy for reporting:
  - A single number?
  - A range?
  - Not at all?

  Also, how should judges be instructed to use what we give them?
  And a timeline for implementation.

  The memo should:
  - Take the opposing views seriously, especially the view that the most specific class is the only defensible one.
  - Not just restate the legal standard for bail.

  Structure the memo:

  1. **Introduction**: Purpose of the memo, the issue at hand, and the need for a policy.
  2. **Summary of the Case and Divergent Views**: Present the case example and the three factions without bias.
  3. **Analysis of the Reference Class Problem**: Acknowledge the philosophical issue but focus on practical implications for risk assessment in pretrial services.
  4. **Recommendation**: 
     - What to report (single number, range, etc.)
     - How to instruct judges
     - Timeline
  5. **Rationale for Recommendation**: Address the opposing views and explain why the recommendation is the best balance.

  Recommendation Considerations:
  - Reporting a single number from the narrowest class may be misleading due to small sample size (high variance). 
  - Reporting a range (from the intermediate to the narrowest, or including the overall?) might convey uncertainty but could be confusing or misused.
  - Another option: report the narrowest class but with a warning about the sample size and also provide the intermediate or broader class for context.
  - Alternatively, we might decide that when the narrowest class is below a certain size (e.g., less than 30 or 50), we use the intermediate class. But then we need to define that threshold.

  Proposed Recommendation:
  - Report the risk score as a range: from the intermediate class (or the next broader reliable class) to the narrowest class, but only if the narrowest class has at least a minimum number of cases (e.g., 20). If the narrowest class is too small, then use the intermediate class and note that the specific group was too small to be reliable.
  - However, the range might be too complex. Alternatively, we might report the intermediate class as the point estimate and then note the narrow class rate as an upper bound, but that could be misinterpreted.

  Another idea: report two numbers and their contexts. For example:
    "Based on similar defendants in the county (men aged 30-39 with a prior FTA), the FTA rate is 43%. When looking at a more specific group (same age, charge type, zip code, and prior record), the rate was 76% but this is based on only 17 cases and may be less reliable."

  But then we are giving two numbers and leaving it to the judge to decide? That might be too much.

  Alternatively, we might use a statistical method to combine the estimates (like empirical Bayes or a shrinkage estimator) that shrinks the narrow class estimate toward the intermediate when the sample is small. But that might be too technical and we don't have the infrastructure.

  Given the constraints, I propose:

  - For reporting, we use a point estimate from the intermediate class when the narrowest class has fewer than a threshold (say 30) cases. Otherwise, we use the narrowest class. But we also report the sample size of the narrowest class and the intermediate class rate as a context.

  But the memo is about the policy for how scores are presented. We must decide on a standard method.

  We also have to instruct judges on how to use the information. We should remind them that the risk score is just one factor and they must consider the individual circumstances.

  Timeline: We can phase in the new policy over a month for training and system updates.

  Draft the memo:

  ---

  **MEMORANDUM**

  To: Working Group on Pretrial Risk Assessment  
  From: [Your Name/Office]  
  Date: [Current Date]  
  Subject: Policy Recommendation for Reporting Risk-Assessment Scores at Bail Hearings  

  **Introduction**  
  This memo addresses the ongoing debate within our working group regarding the presentation of risk-assessment scores to judges at bail hearings. The case of a 34-year-old male defendant charged with felony theft with one prior failure to appear (FTA) has highlighted a fundamental challenge: how to report a risk score when the underlying data yields divergent rates of FTA across different reference classes. This memo summarizes the issue, considers the competing viewpoints, and recommends a concrete policy for reporting risk scores, along with guidance for judges and a timeline for implementation.

  **Case Summary and Divergent Views**  
  The defendant in question falls into multiple statistical groups with varying FTA rates:  
  - Overall county defendants: 21% FTA rate  
  - Men aged 30-39 with a prior FTA: 43% FTA rate  
  - Narrowest group (matching age, charge type, zip code, and prior record): 76% FTA rate (based on 17 cases)  

  The working group has expressed three primary viewpoints:  
  1. **Narrowest Class Advocates**: Argue that the most specific group (76%) is the only defensible reference because it is the most similar to the defendant.  
  2. **Intermediate Class Advocates**: Contend that a group of 17 is too small to be reliable and that the intermediate class (43%) offers the best balance of specificity and statistical reliability.  
  3. **Reference Class Skeptics**: Maintain that the data alone cannot determine the "true" probability because the choice of reference class is inherently arbitrary, and no single class is objectively correct.  

  **Analysis**  
  We acknowledge the validity of each perspective. The narrowest class provides the closest match to the defendant’s characteristics, but small sample sizes (n<30) introduce significant statistical uncertainty, as random variation can greatly influence the observed rate. The intermediate class offers more stability but may mask important subgroup variations. The reference class problem is a genuine philosophical and statistical issue; however, in practice, we must provide judges with actionable information that is both relevant and reliable.  

  **Recommendation**  
  After careful consideration, we recommend a two-tiered approach for reporting risk-assessment scores:  

  1. **Reporting Method**:  
     - **Primary Score**: The risk score presented to judges should be based on the narrowest reference class that meets a minimum sample size threshold. We set this threshold at **30 cases**.  
       - If the narrowest class has at least 30 cases, report that rate.  
       - If the narrowest class has fewer than 30 cases, use the rate from the intermediate class (in this case, men aged 30-39 with a prior FTA).  
     - **Contextual Information**: Alongside the primary score, report:  
       - The sample size of the narrowest class.  
       - The FTA rate of the next broader reliable class (the intermediate class or, if that is also too small, the overall county rate) to provide context on the range of uncertainty.  
     - **Format**: The score should be presented as a single point estimate (to avoid confusion) but accompanied by a brief note on the reliability and context. For example:  
       > "The defendant's estimated failure-to-appear risk is 43%. This is based on the intermediate reference class (men aged 30-39 with a prior FTA) because the narrowest class had only 17 cases. The narrowest class (matching all factors) had a 76% FTA rate but is less reliable due to the small sample size."  

     Alternatively, if the narrowest class meets the threshold:  
       > "The defendant's estimated failure-to-appear risk is 76%, based on a group of 50 similar defendants."  

     This approach balances specificity and reliability while transparently disclosing the limitations.

  2. **Instructions to Judges**:  
     - Judges must be educated that risk scores are statistical estimates, not individual predictions. Training should emphasize:  
       - The scores represent group averages and may not capture the defendant's unique circumstances.  
       - The scores are one factor among many in the bail decision, which must also consider the nature of the offense, the defendant's ties to the community, employment, and other mitigating or aggravating factors.  
       - When the sample size of the narrowest class is small, the score is less reliable and should be weighted accordingly.  
     - We recommend developing a one-page guide for judges on interpreting risk scores, including a glossary of terms and a visual aid on sample size reliability.

  3. **Timeline for Implementation**:  
     - **Week 1**: Finalize and circulate this policy for working group approval.  
     - **Week 2-3**: Update the risk-assessment tool and reporting templates to incorporate the new method.  
     - **Week 4**: Train pretrial services staff on the new reporting protocol.  
     - **Week 5**: Train judges via a judicial education session.  
     - **Week 6**: Full implementation, with a 3-month review period to assess any issues.  

  **Rationale**  
  This recommendation directly addresses the concerns raised:  
  - **To the narrowest class advocates**: We prioritize the most specific data when it is statistically reliable (n≥30).  
  - **To the intermediate class advocates**: We avoid over-reliance on small, noisy samples by reverting to a broader class when necessary.  
  - **To the reference class skeptics**: We acknowledge uncertainty by disclosing the sample size and broader class rate, thus making the limitations transparent.  

  By setting a clear threshold, we provide consistency while allowing flexibility. The disclosure of contextual information empowers judges to critically evaluate the score without overwhelming them with technical details.  

  **Conclusion**  
  This policy aims to enhance the accuracy and transparency of risk-assessment reporting while respecting the judicial role in bail decisions. We recommend adoption by the working group and implementation according to the proposed timeline.  

  Please provide feedback by [Date before Thursday's meeting] so we can discuss at Thursday's meeting.
