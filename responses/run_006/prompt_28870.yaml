prompt: |-
  I've recently taken a position on the risk committee of an environmental regulatory agency. I review quantitative risk assessments that inform permitting decisions for hazardous facilities, and I keep running into the same foundational problem. Different analysts assign wildly different probabilities to the same event — a catastrophic failure, an extreme flood, a contamination plume reaching an aquifer — and when I press them, the disagreement isn't about the data. It's about what a probability claim is in the first place. One analyst treats it as a long-run frequency and worries endlessly about which reference class the event belongs to. Another treats it as a rational degree of belief given the evidence and updates it whenever new information arrives. A third talks about the physical propensity of the system, as if probability were a property like mass. I need to get this straight before I can judge whose numbers to trust.

  Write me the desiderata for an interpretation of probability: what any adequate account of what probability means must deliver. Give me the list of requirements, each with the case or phenomenon that makes it a requirement, and distinguish which are non-negotiable constraints on any interpretation and which are parochial demands of one camp that another can reasonably set aside.

  Make sure the list wrestles with at least these fault lines: how an interpretation handles unique, non-repeatable events (this particular dam, this particular watershed under this climate scenario) versus its obligation to explain why probabilities are constrained by observed frequencies; how it accounts for the role of probability in guiding action under uncertainty versus its role in scientific explanation; and how it makes room for the fact that reasonable people with the same evidence can disagree about a probability without either of them being obviously irrational, while also making room for the fact that some probability assignments are flatly wrong.

  I want a committed answer. Tell me which requirements you think are mandatory, whether any subset of them can't be jointly satisfied, and which single requirement does the most work in excluding the leading interpretations. A table for the scorecard is fine, but the weight should be on the reasoning behind each entry on the list — why it earns its place and what it costs to drop it.
reasoning: |-
  Okay, the user is on a risk committee for an environmental regulatory agency and is struggling with how different analysts interpret probability. They need a clear set of desiderata to evaluate which interpretation of probability is most suitable for their work. Let me start by understanding their main concerns.

  First, the core issue is the foundational disagreement among analysts: frequentist, Bayesian, propensity. Each has a different approach, leading to varied probabilities for the same events. The user needs criteria to judge which interpretation is reliable for permitting hazardous facilities. Their unspoken need is probably to make consistent, defensible decisions that can withstand scrutiny, especially given the high stakes involved.

  They mentioned unique events like a specific dam or watershed under climate change. So, the interpretation must handle non-repeatable events. Also, it must reconcile with observed frequencies, even if the event is unique. That's a tension—how can an interpretation apply to one-time events yet still be constrained by data?

  Another point is the role of probability in action vs. scientific explanation. For regulatory decisions, guiding action under uncertainty is crucial. But they also need probabilities that explain physical systems, like why a failure might occur. Balancing these roles is key.

  Then there's the issue of legitimate disagreement. Analysts with the same evidence might assign different probabilities without being irrational, yet some assignments are just wrong. The interpretation must allow for expert judgment while having objective anchors.

  I should outline desiderata that address these. Start with non-negotiable constraints. Universality is essential because they deal with unique events. If an interpretation can't assign probabilities to one-off cases, it's useless here. Measurability is another—probabilities need empirical constraints, like historical data. Without that, they're just opinions.

  Actionability is critical for decision-making. Regulatory decisions involve cost-benefit analysis, so probabilities must inform actions. Objectivity is tricky. They need some basis to say when a probability is wrong. Maybe through calibration or consensus methods, even if it's not strictly objective.

  Synthesis and Parsimony are important but negotiable. Synthesizing frequencies and beliefs helps in complex scenarios. Parsimony avoids overcomplicating models, which is practical but not a deal-breaker.

  Now, weighing these. Universality and Measurability are foundational. Without them, the interpretation fails in this context. Actionability follows closely because decisions drive their work. Objectivity ensures accountability, which is vital for regulatory bodies.

  The Bayesian interpretation might be the strongest here. It handles unique events via degrees of belief, updates with evidence, and uses calibration to tie to frequencies. It allows expert disagreement but sets criteria for rationality. Propensity can explain mechanisms but struggles with unique cases. Frequentism fails on unique events and doesn't accommodate legitimate disagreement well.

  The user might also need a framework to evaluate analysts' methods. Encouraging structured expert judgment or cross-paradigm dialogue could help. Highlighting that Bayesian with frequentist anchors offers flexibility while maintaining empirical grounding. Emphasizing calibration and sensitivity analysis would add robustness to their assessments.
answer: |-
  Here is a committed set of desiderata for an interpretation of probability, tailored to your regulatory context, with clear reasoning, mandatory status, and analysis of trade-offs. The core tension lies in **Universality** vs. **Measurability/Objectivity**, with **Actionability** being paramount for decision-making.

  **Non-Negotiable Core Desiderata (Must-Haves):**

  1.  **Universality:** *The interpretation must assign meaningful probabilities to single, non-repeatable events.*
      *   **Case:** Permitting decisions for a *specific* dam under *future, unprecedented* climate conditions; assessing the risk of contamination reaching a *specific* aquifer from a *unique* waste facility configuration. These are singular events, not members of long-run sequences.
      *   **Why Mandatory:** Regulatory decisions *always* concern specific future contingencies. If an interpretation cannot assign probabilities to "this dam failing under this loading scenario," it is useless for your core task. Dropping this renders probability irrelevant to unique facility risks.
      *   **Cost of Dropping:** Confines risk assessment only to generic events (e.g., "dams of this type fail"), ignoring critical site-specific factors and novel scenarios – precisely where regulators need guidance most.

  2.  **Measurability / Empirical Constraint:** *The interpretation must provide a principled connection between probability assignments and observable evidence, particularly relative frequencies where they exist.*
      *   **Case:** An analyst assigns P(failure) = 10^-6 for a new valve design. Historical data shows similar valves failing at ~10^-4/year in comparable service. The interpretation must explain why the 10^-6 assignment *needs justification* relative to the 10^-4 data, even if other evidence exists.
      *   **Why Mandatory:** Risk assessments cannot be arbitrary fantasies. They must be constrained by the physical world's behavior as revealed through data. Long-run frequencies provide the most robust anchor for calibration and validation. Ignoring relevant frequency data undermines scientific credibility and leads to indefensible numbers. Probability must be *about* something in the world, not just internal belief.
      *   **Cost of Dropping:** Opens the door to probabilities untethered from reality, where beliefs (no matter how ill-informed) or abstract propensities (with no empirical check) dominate, making assessment unfalsifiable and useless for evidence-based regulation.

  3.  **Actionability (Decision-Theoretic Foundation):** *The interpretation must provide a clear, operational foundation for decision-making under uncertainty.*
      *   **Case:** The committee must decide whether to permit a facility based on a cost-benefit analysis where catastrophic failure probabilities are key inputs. The interpretation must justify *why* using P(event) in an expected utility calculation is the rational way to choose an action.
      *   **Why Mandatory:** The *raison d'être* of your risk assessments is to inform high-stakes decisions. Probability only has practical meaning in your context if it tells you how to *act*. Interpretations that fail to ground decision theory are philosophically interesting but practically irrelevant for regulation.
      *   **Cost of Dropping:** Severs the vital link between risk assessment and regulatory action. Probabilities become abstract numbers without clear guidance on how they should influence the permit decision.

  4.  **Room for Legitimate Disagreement / Subjectivity (Bounded):** *The interpretation must allow that rational agents with access to the same core evidence can assign different probabilities without either being obviously irrational, especially when evidence is incomplete or ambiguous.*
      *   **Case:** Two experts review identical seismic data and engineering models for a dam. Expert A (focusing on historical quakes) assigns P(overtopping) = 0.01; Expert B (focusing on newly discovered fault lines) assigns 0.05. Neither is clearly misreading the data; they weigh/model uncertainties differently.
      *   **Why Mandatory:** Evidence in complex systems (geology, climate, human error) is rarely complete or perfectly unambiguous. Requiring a single "objective" probability in such cases is unrealistic and stifles necessary expert judgment. The interpretation must reflect the epistemic state of the assessor relative to the evidence.
      *   **Cost of Dropping:** Forces a false objectivity, suppressing valuable expert nuance and uncertainty. Leads to spurious precision and ignores the inherent ambiguity in complex systems.

  **Important but More Negotiable / Context-Dependent Desiderata:**

  5.  **Objectivity / Grounding (Aspirational):** *The interpretation must provide a basis for saying some probability assignments are objectively wrong, even if the path to objectivity is complex.*
      *   **Case:** An analyst, ignoring all seismic data and historical failure rates, assigns P(major earthquake causing dam failure next year) = 0.9 for a site with minimal historical seismicity and robust design. The interpretation must provide grounds to reject this as unreasonable or "wrong," not just a different belief.
      *   **Why Negotiable:** While crucial for scientific integrity and accountability, "objectivity" manifests differently. Frequentism uses direct frequency mismatch. Bayesianism uses incoherence (violating probability axioms), gross miscalibration over many assessments, or ignoring overwhelming evidence. Propensity invokes a flawed model of the system's nature. The *need* to rule out extreme assignments is mandatory, but the *mechanism* varies.
      *   **Cost of Weakening:** Increases the risk of accepting wildly implausible or ideologically driven assessments without a clear basis for rejection. Undermines scientific standards.

  6.  **Synthesis (Bridge between Belief, Frequency, and Propensity):** *The interpretation should ideally help integrate rational belief, observed frequencies, and understanding of physical mechanisms.*
      *   **Case:** Assessing P(plume reaches aquifer): Historical data on similar sites (frequency), site-specific hydrogeology & containment design (propensity), and expert judgment on model uncertainty (belief) all contribute. A good interpretation shows how these interact coherently.
      *   **Why Negotiable:** While highly desirable for comprehensive risk assessment, a strict interpretation might prioritize one lens (e.g., Bayesian belief). Practical risk assessment *methods* often blend paradigms regardless of philosophical purity. However, an interpretation hostile to synthesis is less useful.
      *   **Cost of Dropping:** Encourages siloed approaches, making it harder to leverage all available evidence types effectively. Can lead to internal inconsistency in assessment frameworks.

  7.  **Parsimony / Model Fitness:** *The interpretation should encourage probability assignments based on the simplest adequate model of the system, avoiding unnecessary complexity without justification.*
      *   **Case:** An analyst proposes an extremely complex, unvalidated computational model to derive a P(failure) slightly different from one based on well-established, validated simpler models + expert adjustment. The interpretation should favor the simpler, more transparent approach unless complexity demonstrably adds significant accuracy.
      *   **Why Negotiable:** This is more a principle of good scientific modeling and risk communication than a strict requirement of the interpretation itself. However, interpretations that inherently encourage overfitting or "black box" assignments (without good reason) are less desirable pragmatically.
      *   **Cost of Dropping:** Increases the risk of opaque, resource-intensive assessments prone to hidden errors and difficult to review or challenge.

  **The Central Tension & The Most Excluding Requirement:**

  *   **Universality vs. Measurability/Objectivity:** This is the fundamental fault line. **Universality** is the most effective requirement for **excluding Strict Frequentism.** Strict Frequentism defines probability *only* as a long-run frequency over repeatable trials. It fundamentally cannot assign a probability to a unique event like "this specific dam failing under climate scenario X." It can only talk about frequencies of "dams like this" failing under "conditions like this," which immediately runs into the **reference class problem** (which class is relevant?) – the very issue your analysts struggle with. To satisfy Universality, an interpretation *must* move beyond strict long-run frequencies.
  *   **Measurability/Objectivity** strongly challenges **Extreme Subjective Bayesianism.** While Bayesianism easily satisfies Universality and Actionability, a purely subjective view where probability is *only* personal belief, completely unconstrained by frequencies and without any grounding for saying some beliefs are "wrong" (beyond internal consistency), fails Measurability and Objectivity. It struggles to explain why historical failure rates *must* impact a rational belief or why an assignment ignoring all data is invalid.

  **The Committed Answer & The Strongest Contender:**

  1.  **Mandatory Set:** Universality, Measurability, Actionability, Room for Legitimate Disagreement. Objectivity (in the sense of ruling out demonstrably wrong assignments) is aspirational but operationally crucial for regulation.
  2.  **Joint Satisfaction:** Universality and Measurability are in tension but **can be jointly satisfied** by interpretations that use frequencies as crucial *evidence* for constraining beliefs about singular events, or by propensity views carefully tied to measurable system properties. Actionability and Legitimate Disagreement are compatible with this synthesis.
  3.  **Most Excluding Requirement:** **Universality.** It definitively rules out Strict Frequentism as a standalone foundation for regulatory risk assessment of unique facilities/situations.
  4.  **The Strongest Contender: Calibrated Bayesianism (with Frequentist Anchors).**
      *   **Why:** It directly satisfies **Universality** (degrees of belief about unique events), **Actionability** (foundation of decision theory), and **Room for Legitimate Disagreement** (different priors/weighting of evidence).
      *   **How it Meets Measurability/Objectivity:** It mandates that rational beliefs must be *informed* by all relevant evidence, *especially* frequencies where available (via the likelihood or informing the prior). It provides tools (calibration requirements, scoring rules) to hold analysts accountable and identify *persistently* poor assessments (e.g., an analyst whose 90% confidence intervals only contain the truth 50% of the time is demonstrably poor). It forces justification for deviations from baseline frequencies.
      *   **Synthesis:** It naturally incorporates frequencies (evidence), propensities (inform priors/likelihoods), and belief.
      *   **Costs:** Requires careful handling of priors (sensitivity analysis is key), demands calibration efforts, and can be misused if objectivity is neglected.

  **Interpretation Scorecard:**

  | Desideratum          | Strict Frequentism | Propensity         | Extreme Subjective Bayesianism | Calibrated Bayesianism |
  | :------------------- | :----------------- | :----------------- | :----------------------------- | :--------------------- |
  | **1. Universality**  | ❌ (Fatal)         | ⚠️ (Debatable)     | ✅                              | ✅                     |
  | **2. Measurability** | ✅ (Core)          | ⚠️ (Often vague)   | ❌ (Ignored)                    | ✅ (Via evidence/calib)|
  | **3. Actionability** | ⚠️ (Indirect)      | ⚠️ (Indirect)      | ✅                              | ✅                     |
  | **4. Legit Disagree**| ❌ (Single "True" P)| ⚠️ (Single "True" P)| ✅                              | ✅                     |
  | **5. Objectivity**   | ✅ (Direct)        | ✅ (In theory)      | ❌                              | ✅ (Via calib/evidence)|
  | **6. Synthesis**     | ❌                 | ⚠️ (Limited)       | ⚠️ (Belief only)               | ✅                     |
  | **7. Parsimony**     | ✅                 | ⚠️                 | ⚠️                             | ⚠️                     |

  **Recommendation for Your Committee:**

  1.  **Formally Endorse Calibrated Bayesianism as the Foundation:** Mandate that probabilities represent *rational degrees of belief, conditional on all available evidence*. This provides the necessary Universality and Actionability.
  2.  **Enforce Measurability/Objectivity via Process:**
      *   Require explicit justification of priors and likelihoods, *especially* when deviating from baseline frequencies derived from relevant reference classes/data.
      *   Implement calibration requirements: Analysts must track past probabilistic predictions vs. outcomes (where possible) and demonstrate their methods are well-calibrated.
      *   Require sensitivity analyses showing how probabilities change with different reasonable assumptions/priors.
      *   Demand transparency: Full documentation of evidence, models, assumptions, and expert judgments used.
  3.  **Acknowledge Legitimate Disagreement:** Encourage structured expert judgment (e.g., Delphi, Cooke's method) to synthesize views when evidence is ambiguous. Document the range of credible estimates.
  4.  **Focus Review:** Judge assessments not on a single "true" number, but on the *robustness of the reasoning process*: Was all relevant evidence considered? Are deviations from data justified? Is the model adequate? Are uncertainties (including model uncertainty) properly characterized? Is the analyst well-calibrated?

  This approach leverages the strengths of the Bayesian framework for decision-making under unique uncertainties while building in the necessary empirical anchors and accountability demanded by the regulatory context and scientific integrity. It directly addresses the foundational disagreements by providing a coherent, justifiable, and actionable standard.
