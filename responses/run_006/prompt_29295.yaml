prompt: |-
  Ok here's what I want. I keep reading about Russell's theory of descriptions and every paper seems to be holding it to a different standard of what a theory of definite descriptions even has to do. Before I read any more of this stuff, give me the spec. What should I be asking of a theory of definite descriptions, if the point is a theory good enough for doing semantics of natural language — one that explains how we actually understand definite descriptions and why the classic puzzles arise in the first place? Write the desiderata: the cases it has to get right (the present king of France, negative existentials, incomplete descriptions like 'the table is covered with books', anaphoric uses like 'a man walked in; the man sat down', fictional names), the distinctions it can't collapse (surface grammar vs logical form, referring vs quantifying, presupposition vs assertion, referential vs attributive use, primary vs secondary occurrence of a description under negation), and the facts it can't just contradict (compositionality, the ease with which we understand novel descriptions, the way uniqueness is normally contextually restricted rather than global — or if you think that framing is wrong, say so and make it a point of dispute rather than a datum). For each requirement, give the case or consideration that makes it a requirement, and say whether it's non-negotiable or just a preference of one camp. It also has to say something principled about whether bivalence survives once 'the present king of France is bald' and its negation are both on the table. Then score Russell, Strawson's presupposition view, and Donnellan's referential/attributive distinction against the list, but keep that part short — the list is the point, not the scorecard. Also tell me wether any pair of these desiderata are in tension or jointly unsatisfiable; if the list itself is a result because some pair can't both be met, that's the part I most want. And at the end, say how confident you are in the list as a whole and single out the one requirement you're least sure about.
reasoning: |-
  Okay, the user is diving deep into the philosophy of language, specifically Russell's theory of descriptions. They're frustrated with the inconsistent standards in academic papers and want a clear set of desiderata for evaluating any theory of definite descriptions. Their main goal is to understand what a theory needs to accomplish to be viable for natural language semantics—explaining how we understand phrases like "the present king of France" and why puzzles arise.

  First, I need to outline the key cases a theory must handle: present king of France (nonexistent referent), negative existentials ("the king doesn't exist"), incomplete descriptions ("the table" without specifying which), anaphoric uses ("a man... the man"), and fictional names. Each case tests different aspects like existential commitment, context-dependency, and coreference.

  Then there are distinctions the theory must preserve. Surface grammar vs. logical form is crucial because sentences like "the king is bald" aren't simple subject-predicate structures. Referring vs. quantifying ties into whether descriptions act like names or quantifiers. Presupposition vs. assertion matters for negation handling—does "the king isn't bald" presuppose existence? Referential vs. attributive uses (Donnellan's point) and primary/secondary occurrences under negation (Russell's scope distinction) are also key.

  Next, empirical facts: compositionality (how meaning builds from parts), novelty (understanding new descriptions easily), and contextual uniqueness (uniqueness is often situational, not universal). These ensure the theory aligns with how language actually works.

  Bivalence is a biggie—can "the king is bald" be true/false if the king doesn't exist? Some theories abandon bivalence; others preserve it via scope. This needs principled handling.

  Now, tensions: Presupposition vs. bivalence clash—if existence is presupposed, truth-value gaps arise, but bivalence demands true/false. Referential use vs. semantic content is another; if descriptions sometimes refer directly, it challenges the quantificational view. Novelty vs. semantic simplicity might conflict if ad-hoc contextual restrictions are needed for incomplete descriptions.

  The user also wants a brief scorecard for Russell, Strawson, and Donnellan, but the focus is the list. Russell handles quantification and scope but stumbles on referential uses and contextual uniqueness. Strawson captures presuppositions but struggles with bivalence and compositionality. Donnellan highlights speaker's intent but blurs semantics/pragmatics.

  Least confident about the presupposition/assertion distinction—some modern theories treat existence as part of the assertion. Overall, the list is solid, covering core cases and tensions. User's deep dive suggests they're preparing for research or rigorous study, so clarity on conflicts (like presupposition vs. bivalence) is vital for their understanding.
answer: |-
  Here's a specification for a theory of definite descriptions aimed at natural language semantics, focusing on core desiderata, distinctions, facts, tensions, and the bivalence issue. The list prioritizes explanatory power over formal elegance.

  **Core Desiderata: Cases to Handle**

  1.  **Nonexistent Referents (The Present King of France):**
      *   *Case:* "The present king of France is bald." uttered when there is no king of France.
      *   *Requirement:* Explain the intuition of meaningfulness yet lack of straightforward truth value (or falsity/truth), and the source of the "problem" (e.g., presupposition failure, false existential claim). **Non-negotiable.**
  2.  **Negative Existentials:**
      *   *Case:* "The present king of France does not exist."
      *   *Requirement:* Explain how this sentence can be true without paradox (e.g., denying the existence claim, treating the description as having no referent). **Non-negotiable.**
  3.  **Incomplete Descriptions:**
      *   *Case:* "The table is covered with books." uttered in a room with many tables, yet understood.
      *   *Requirement:* Explain how context supplies the missing uniqueness condition (e.g., domain restriction, salience). Cannot rely on global uniqueness. **Non-negotiable.**
  4.  **Anaphoric Uses:**
      *   *Case:* "A man walked in. The man sat down."
      *   *Requirement:* Explain how "the man" inherits its referent from "a man", demonstrating coreference and dynamic context update. **Non-negotiable.**
  5.  **Fictional/Non-Referential Names in Descriptions:**
      *   *Case:* "The present king of France is a fictional character." or "The unicorn in that story has a golden horn."
      *   *Requirement:* Explain how descriptions can be meaningful and have truth-conditional content even when their embedded names lack real-world referents, often within an intensional or fictional context. **Non-negotiable.**

  **Core Distinctions to Preserve**

  6.  **Surface Grammar vs. Logical Form:**
      *   *Consideration:* Surface subject-predicate form ("The F is G") often doesn't reflect semantic structure (e.g., it's quantificational, not referential). The theory must provide a distinct logical form. **Non-negotiable.** (Failure collapses semantics into surface syntax).
  7.  **Referring Expressions vs. Quantifiers:**
      *   *Consideration:* Definite descriptions behave differently from paradigmatic referring expressions (like names) and paradigmatic quantifiers (like "every"). The theory must specify their semantic type and explain the differences. **Non-negotiable.** (Failure leads to incorrect predictions about scope, anaphora, etc.).
  8.  **Presupposition vs. Assertion:**
      *   *Consideration:* In "The F is G", is the existence and uniqueness of an F part of what is *asserted* (claimed true/false) or *presupposed* (taken for granted, background for the assertion)? The theory must take a stance and explain phenomena like projection under negation/conditionals. **Highly desirable, but frameworks differ** (Presuppositionalists vs. Assertionists - Strawson vs. Russell).
  9.  **Referential vs. Attributive Use (Donnellan):**
      *   *Case:* (Attributive) "Smith's murderer is insane." (said looking at brutal corpse, unknown murderer). (Referential) "Smith's murderer is insane." (said pointing at Jones acting crazy in the dock, regardless of guilt).
      *   *Requirement:* Explain the speaker/hearer intuition difference - is the description used to *pick out* an individual or to *state something about whoever fits the description*? The theory must accommodate or explain away this distinction. **Contested but empirically robust.** Most theories now locate it in pragmatics/speaker meaning, not semantics.
  10. **Primary vs. Secondary Occurrence (Scope under Operators):**
      *   *Case:* "The present king of France is not bald." vs. "It is not the case that the present king of France is bald." (Ambiguity under negation).
      *   *Requirement:* Explain the potential ambiguity in truth conditions when descriptions interact with operators like negation, modals, quantifiers, attitude verbs. **Non-negotiable** for handling embedding and negation puzzles.

  **Empirical Facts to Respect**

  11. **Compositionality:**
      *   *Fact:* Meaning is built systematically from parts and structure.
      *   *Requirement:* The meaning of "the F is G" must be derived from the meanings of "the", "F", "is", and "G" plus syntactic structure. **Non-negotiable.** (A theory positing ad-hoc meanings fails).
  12. **Novelty/Ease of Understanding:**
      *   *Fact:* We effortlessly understand novel definite descriptions ("Bring me the blue cup next to the toaster you bought yesterday").
      *   *Requirement:* The theory must not rely on pre-established referential links or conventions for each description. Mechanisms like contextual restriction must be general and efficient. **Non-negotiable.**
  13. **Contextual Uniqueness:**
      *   *Fact:* Uniqueness is almost always relative to a contextually salient domain, not absolute ("the president", "the car", "the moon").
      *   *Requirement:* The theory must incorporate a mechanism for contextually restricting the domain of quantification or salience. **Non-negotiable.** (The "global uniqueness" framing *is* wrong for natural language).

  **The Bivalence Question**
  *   *Requirement:* The theory must explicitly state its position on the truth value of "The present King of France is bald" (P) and its negation ("The present King of France is not bald" or "It is not the case that P") when there is no King. Does it:
      *   Maintain bivalence (both have a truth value, e.g., both false for Russell)?
      *   Abandon bivalence for these cases (truth-value gap, e.g., Strawson)?
      *   Offer a different resolution? The stance must be principled and consistent with the theory's core analysis. **Non-negotiable** to address the core puzzle.

  **Tensions Between Desiderata**

  1.  **Presupposition (8/9) vs. Bivalence:** This is the *core* tension. If existence/uniqueness is a presupposition (Strawson), failure leads to truth-value gaps, abandoning bivalence. If existence/uniqueness is asserted (Russell), bivalence is maintained (P is false, negations need scopal analysis). **This is the fundamental divide.** Reconciling robust presupposition with strict bivalence is extremely difficult, leading many to reject bivalence for natural language semantics or to heavily pragmatize presupposition.
  2.  **Referential Use (9) vs. Semantic Uniformity (7):** If referential use is semantically significant (Donnellan's early view), it threatens the idea that descriptions have a uniform semantic type (usually quantifier). Locating it firmly in pragmatics preserves semantic uniformity but must explain the strong speaker intuitions.
  3.  **Novelty (12) & Contextual Uniqueness (13) vs. Semantic Simplicity:** Handling novel, contextually restricted descriptions robustly often requires complex mechanisms (e.g., dynamic semantics, elaborate context parameters) that some find theoretically costly compared to a simpler, more literal analysis.

  **Brief Scorecard (Focus: Core Challenges)**

  *   **Russell:**
      *   *Strengths:* Nails 1 (false existential), 2 (true negative existential), 6 (LF distinct), 7 (quantifier), 10 (scope), 11 (compositional), 12 (novelty handled via context *implicitly*), maintains bivalence (P false, negation ambiguous).
      *   *Weaknesses:* Struggles with 3 (incomplete - domain restriction ad-hoc?), 4 (anaphora - needs supplementation), 5 (fiction - needs supplementation), 8/9 (presupposition/referential use intuitions ignored/explained away pragmatically), 13 (contextual uniqueness not formally integrated).
  *   **Strawson (Presupposition):**
      *   *Strengths:* Captures intuitions for 1 (meaningful but undefined), 8 (presupposition), 9 (attributive use central), 13 (contextual uniqueness implicit in domain).
      *   *Weaknesses:* Fails 2 (negative existential problematic), abandons bivalence; struggles with 4 (anaphora), 5 (fiction - presupposition failure?), 6 (LF often underdeveloped), 7 (referring? but failure possible), 10 (scope ambiguity less clear), 11 (compositionality of presuppositions complex), 12 (novelty - presuppositions must be computed).
  *   **Donnellan (Referential/Attributive Distinction):**
      *   *Strengths:* Highlights crucial pragmatic phenomenon (9), challenges purely quantificational view (7).
      *   *Weaknesses:* Not a full semantic theory. As a semantic claim (ambiguity), it fails 11 (compositionality of ambiguity), 12 (novelty - how is ambiguity resolved?), and struggles with 1, 2, 3, 4, 5, 6, 8, 10, 13. Most theories now incorporate the *phenomenon* pragmatically within Russellian or presuppositional frameworks.

  **Confidence & Least Sure Requirement**

  *   **Overall Confidence:** High (8/10). This list captures the essential phenomena, distinctions, and constraints debated in the literature for over a century. A theory failing multiple non-negotiables (1-7, 10-13, Bivalence stance) is inadequate for natural language semantics.
  *   **Least Sure Requirement:** **The precise status of the Presupposition vs. Assertion distinction (8) and its relationship to Referential/Attributive (9).** While the *phenomena* (projection, felt "givenness" of existence, speaker referential intent) are undeniable, whether the best semantic theory encodes existence/uniqueness as a *semantic presupposition* (creating truth-value gaps) or as an *entailment/part of the assertion* (maintaining bivalence via mechanisms like scope) remains the hottest point of contention. Modern dynamic semantic and pragmatic frameworks offer sophisticated ways to model presupposition-like behavior without abandoning compositionality or (sometimes) bivalence, making the strict dichotomy less clear-cut. The *fact* of the behavior is non-negotiable; its *theoretical categorization* is the major dispute.
