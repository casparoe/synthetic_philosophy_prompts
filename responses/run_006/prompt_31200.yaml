      "Degree of Tolstoy's applicability to anti-art gestures (scholarly divide)",
      "Exact motives of the board (genuine concern vs. snobbery)"
    ]
  }
  ```

  ### Contested vs. Settled: Key Distinctions  
  - **Settled**:  
    - Tolstoy’s criteria formally reject *Fountain* as non-art.  
    - The infection test is the core reason.  
    - The board’s suppression aligns with Tolstoy’s institutional critique.  
  - **Contested**:  
    - Whether *Fountain*’s defiance constitutes a "feeling" Tolstoy might recognize.  
    - Whether Duchamp’s sincerity in critique *could* satisfy Tolstoy under a broad reading.  
    - If Tolstoy’s theory *implicitly* predicts avant-garde rebellions like *Fountain*.  

  *Fountain* doesn’t refute Tolstoy—it reveals his theory’s blind spot for art that interrogates its own foundations. The suppression is Tolstoyan; the work itself is not.
