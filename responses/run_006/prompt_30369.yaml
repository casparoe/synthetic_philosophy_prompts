answer: |-
  ## Joint Statement: Adversarial Collaboration on Fairness in Pretrial Risk Assessment

  We, the undersigned, have engaged in an adversarial collaboration regarding the fairness criteria for pretrial risk assessment instruments (PRAIs). After a year of debate, we agree on core mathematical facts and the limitations of any single metric, but differ on the essential requirements for fairness in high-stakes deployment. This statement outlines our shared understanding and clarifies our remaining disagreements.

  ### 1. Agreed Claims

  Both parties endorse the following statements:

  1.  **Definition - Calibration:** A risk score is *calibrated within groups* if, for any given score value `s` and any group `A` or `B`, the probability of the outcome (e.g., rearrest) given the score `P(Y=1 | S=s, G=A) = P(Y=1 | S=s, G=B)`. This means the score reflects the same underlying risk level regardless of group membership.
  2.  **Definition - Error Rates:** The *false positive rate (FPR)* for a group is `P(S > threshold | Y=0, G)`. The *false negative rate (FNR)* for a group is `P(S <= threshold | Y=1, G)`. Equal FPR/FNR across groups implies similar burdens of erroneous decisions (e.g., unnecessary detention, inappropriate release).
  3.  **Mathematical Impossibility (Tradeoff):** For an imperfect predictor (`AUC < 1`) applied with a single threshold, it is **mathematically impossible** to simultaneously achieve calibration within groups *and* equal FPR *and* equal FNR across groups **if the base rates differ between groups** (`P(Y=1 | G=A) ≠ P(Y=1 | G=B)`).
  4.  **Consequence of Base Rate Differences:** The impossibility theorem (Claim 3) implies that when base rates differ, policymakers must choose between:
      *   **Option A:** Prioritizing calibration and accepting unequal FPR and FNR across groups.
      *   **Option B:** Prioritizing equal FPR *or* equal FNR (or a balance thereof) and accepting miscalibration (the score meaning different things for different groups at the same value).
  5.  **Value Judgment Required:** The choice between Calibration (Option A) and Error Rate Parity (Option B) is **inherently a value judgment** about what constitutes "fair treatment" or "minimizing harm" in the specific high-stakes context. Mathematics alone cannot resolve this choice.
  6.  **Imperfect Scores:** All real-world PRAIs are imperfect predictors (`AUC < 1`). Therefore, the tradeoff described in Claim 3 is practically relevant.

  ### 2. Disagreements Table

  | Feature                      | Position A (Calibrationist)                                                                 | Position B (Error Parity Advocate)                                                                 |
  | :--------------------------- | :------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------- |
  | **Core Fairness Requirement** | A calibrated score is *necessary and sufficient* for fairness.                              | Calibration is *necessary but not sufficient* for fairness.                                        |
  | **Reasoning**                | Fairness means the score accurately reflects risk *for each individual*, regardless of group. Like risks (same score) *must* receive like predictions. Equal error rates, when base rates differ, would require systematically mispredicting risk for some individuals based on group, violating this principle. | Fairness requires not only accurate risk estimation but also *equitable distribution of harms from errors*. Systematically higher FPR (unnecessary detention) or FNR (inappropriate release) on one group imposes an unjust burden, even if scores are calibrated. |
  | **View on Tradeoff**         | Accepting unequal error rates is the *fair* consequence of accurately reflecting differing underlying base rates. Forcing equal error rates distorts the meaning of the score and treats dissimilarly risky cases similarly based on group. | Accepting unequal error rates perpetuates or exacerbates existing disparities in harm. Calibration ensures score *meaning* is consistent, but fairness *also* requires mitigating disproportionate harms caused by errors, necessitating adjustments sacrificing strict calibration. |
  | **View on "Like Treatment"** | "Like treatment" means individuals *with the same assessed risk* receive the same prediction. | "Like treatment" requires that the *impact* of the decision system (considering errors) is comparable across groups, not just the mapping from score to prediction. |

  ### 3. Cruxes: Key Sub-Questions & Testable Predictions

  1.  **Crux: Does achieving calibration justify accepting significantly unequal error burdens?**
      *   **Concrete Case:** Consider Group A (Base Rate = 10%) and Group B (Base Rate = 30%). A perfectly calibrated score achieves Calibration. At a threshold chosen for an overall FPR of 20%, Group A's FPR is 25% and Group B's FPR is 17%. Group A experiences 1.47x the rate of unnecessary detention errors relative to their non-reoffending population compared to Group B. Is this outcome "fair enough" solely because the score is calibrated?
      *   **Position A Prediction:** Yes. The score accurately reflects the lower base risk in Group A. The higher FPR is a consequence of the lower prevalence of non-reoffenders in Group A relative to the threshold choice, not bias in the score. Unnecessary detentions are regrettable but stem from accurate risk assessment applied consistently. Forcing FPR parity would misrepresent risk for Group B individuals.
      *   **Position B Prediction:** No. While the score is technically accurate, the system imposes a significantly higher burden of harmful errors (unnecessary detention) on Group A relative to their size in the non-offending population. This disproportionate harm is unfair and requires mitigation, even if it means sacrificing strict calibration.

  2.  **Crux: Does the *cause* of base rate differences affect the fairness argument for requiring error rate parity?**
      *   **Concrete Evidence:** Rigorous, agreed-upon analysis of the dataset showing to what extent the observed base rate difference (e.g., rearrest rates) is attributable to:
          *   (a) Differences in underlying criminal behavior prevalence.
          *   (b) Biases in policing, arrest, or charging practices affecting what events are recorded as `Y=1`.
          *   (c) Measurement error or noise in the outcome data.
      *   **Position A Prediction:** The legitimacy of requiring strict calibration holds regardless of the *cause* of the base rate difference. The score's job is to predict the *observed outcome* `Y` as accurately as possible for each individual based on available data. Distorting predictions to achieve error parity based on beliefs about causality introduces unfairness by misrepresenting predicted risk.
      *   **Position B Prediction:** If a significant portion of the base rate difference is demonstrably caused by systemic bias in the outcome definition or measurement (b, c), then prioritizing error rate parity becomes *more* crucial. Using a calibrated score trained on a biased outcome `Y` risks baking in that bias, and accepting its error burdens is less defensible. The fairness argument for calibration weakens if the target `Y` itself is tainted by unfair processes.

  3.  **Crux: Does the "meaning" of the score inherently include the consequences of its use at a threshold?**
      *   **Concrete Case:** Two individuals from different groups both receive a score of `s=6`, calibrated to mean `P(Y=1) = 0.4`. Due to base rate differences and error rate tradeoffs, the individual from Group A has a true probability `P(Y=1) = 0.4`, while the individual from Group B has a true probability `P(Y=1) = 0.4`. However, because of the threshold setting needed for overall resource constraints, the FPR/FNR context means the `s=6` individual in Group A is more likely to be falsely detained than the `s=6` individual in Group B.
      *   **Position A Prediction:** The "meaning" (predicted risk) is identical (`P=0.4`) and fair. The difference in *decision outcome probability* is a separate artifact of the threshold choice and base rates, not a property of the score's fairness. Fairness lies in the risk assessment itself.
      *   **Position B Prediction:** In operational use, the score `s=6` *de facto* carries different implications for the likelihood of experiencing a harmful error (false detention) depending on group. This difference in *impact* is part of the practical "meaning" of receiving that score in the real-world system. A score cannot be considered fully fair if its *operational consequence* for similarly scored individuals differs systematically by group.

  ### Verbal & Normative Components

  *   **Verbal Disagreement:** The core disagreement over the definition of "fair" is partially verbal. Position A defines fairness primarily in terms of *procedural consistency in risk estimation* (same score = same predicted risk). Position B defines fairness primarily in terms of *distributive justice regarding outcomes/harms* (comparable rates of harmful errors). Both use the word "fair" but emphasize different aspects.
  *   **Normative Disagreement:** The fundamental disagreement is normative: **How should we weigh the value of accurate individual risk prediction against the value of equitable distributions of error burdens across groups when these goals conflict due to base rate differences?** Mathematics proves the conflict; societal values must resolve the prioritization.
  *   **Mathematical Agreement:** We fully agree on the mathematical tradeoff (Claim 3, 4) and that it arises from base rate differences combined with predictor imperfection. Our disagreement lies in the *interpretation* of this tradeoff and the *weight* given to the competing fairness desiderata in light of this tradeoff.

  **Next Steps:** We commit to collaboratively investigating the "Cruxes" outlined above. We will jointly design or identify empirical analyses for Crux 2 and refine thought experiments for Cruxes 1 and 3 to further clarify the value judgments involved.

  **Signed,**

  [Signature - Calibrationist]  
  [Signature - Error Parity Advocate]

  **Date:** October 26, 2023
