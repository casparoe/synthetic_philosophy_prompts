  Textually, they're on solid ground. The 1797 essay does fixate on legal imputability—that bit about "blood-guiltiness" is pure juridical language. And Kant explicitly says he's rebutting Constant's *political* argument. The user might strengthen this by contrasting the essay's tone with, say, Groundwork's ethical rigorism.

  As for shifting the problem... well, yes, but productively! Kant's ethics still seems harsh, but now we see it's not because he's oblivious to consequences—it's because he's building a system where law and ethics have different logics. The user could push further: does this separation actually *explain* why we intuitively want to lie to the murderer (we're thinking ethically) while Kant insists on truth (he's in juridical mode)?

  Their self-awareness is impressive. They're exactly right to worry about (a) the Doctrine of Virtue collapsing back into absolutism, and (b) textual counterevidence. I should flag that Kant does mention "ethical duties" in the essay, but it's a passing reference—the weight is juridical. Maybe suggest they preempt that objection?

