answer: |-
  Here's my decomposition of epistemic two-dimensionalism (E2D), structured around the core claims you outlined, with credences, justifications, and how they interact. My overall credence lands near yours (~0.35), but the unevenness is revealing. I'll flag where objections bite hardest and which term is most vulnerable.

  ### Core Decomposition & Credences
  1.  **Existence of Well-Defined Primary Intensions (1-Intensions):**
      *   **Credence:** 0.7
      *   **Justification:** For *many* expressions (descriptive names, phenomenal concepts like "pain," observational terms like "red"), the procedure of evaluating reference under hypothetical epistemic scenarios ("centered worlds") yields a stable, non-trivial function. It captures how we *identify* reference based on evidence. However, for rigid designators like standard proper names ("Kripke") or natural kind terms ("water") used non-descriptively, the 1-intension feels artificially generated *post hoc* to fit the 2D mold rather than reflecting core cognitive content. It's *defined*, but its psychological reality is shakier.
      *   **Domain Variance:** Higher for phenomenal/observational terms (0.8), lower for pure rigid designators (0.5).

  2.  **1-Intensions Capture Genuine Cognitive/Epistemic Content:**
      *   **Credence:** 0.6
      *   **Justification:** This is the heart of the "zombie objection" you mentioned. If "Hesperus is Phosphorus" is a priori knowable under ideal reflection (as E2D often suggests for necessary truths), then its 1-intension is necessary. But this seems to erase the *cognitive significance* difference between "Hesperus" and "Phosphorus" – the core Fregean datum! E2D defenders argue 1-intensions *are* fine-grained enough (e.g., via structured intensions), but it's contentious. The link to *actual* speaker competence (vs. idealization) is weakest here. "Epistemic content" risks becoming a theoretical posit divorced from psychology.
      *   **Objection Link:** Directly addresses the "coarse-grained 1-intension" and "over-idealization" objections.

  3.  **1-Intensions are Distinct from Secondary Intensions (2-Intensions):**
      *   **Credence:** 0.9
      *   **Justification:** Kripke's arguments are robust. The 2-intension of "water" picks out H₂O in all worlds; its 1-intension picks out the watery stuff in each world. These functions demonstrably differ. This distinction is E2D's strongest selling point.
      *   **Domain Variance:** Minimal. Holds strongly across domains (names, kinds, phenomenology).

  4.  **1-Intensions Explain the Necessary A Posteriori:**
      *   **Credence:** 0.8
      *   **Justification:** E2D provides an elegant *formal* explanation: A statement is necessary a posteriori iff its 1-intension is contingent but its 2-intension is necessary. The *epistemic* work comes from the contingency of the 1-intension requiring empirical input to fix reference and reveal the necessity. This is compelling *if* you buy (1) & (2). If the 1-intension isn't genuinely epistemic, the explanation becomes descriptive rather than explanatory.
      *   **Objection Link:** Relies on a substantive notion of apriority (covered next).

  5.  **1-Intensions Underwrite a Substantive Conceivability-Possibility Link (C→P):**
      *   **Credence:** 0.55
      *   **Justification:** This is E2D's most ambitious and vulnerable claim. The idea: ideal primary conceivability (based on the 1-intension) entails primary possibility (truth at *some* centered world). *If* ideal conceivability tracks the 1-intension, and the 1-intension defines a space of epistemic possibility, this *could* work. But counterexamples abound: complex mathematical truths (conceivably false but metaphysically necessary), Kripkean a posteriori necessities (zombies are *prima facie* conceivable but metaphysically impossible if physicalism is true). Chalmers restricts C→P to *primary* possibility, but does this preserve substance? Idealization risks making conceivability an empty, inaccessible test.
      *   **Domain Variance:** Highest credence for phenomenal concepts/zombies (0.7), lowest for natural kinds/identities (0.4). The "zombie objection" *against* C→P is strongest for identities.
      *   **Objection Link:** Core of the "over-idealization" and "apriority foundation" objections.

  6.  **1-Intensions are Non-Trivial (Not Just Diagonalized Contextual Parameters):**
      *   **Credence:** 0.65
      *   **Justification:** Stalnaker's "diagonal" shows how context-dependence can generate a 2D profile. E2D insists the primary intension is *prior* to context, reflecting deep cognitive/epistemic content. The case is strongest for phenomenal concepts and terms with a core descriptive element. For pure indexicals ("I") or demonstratives ("that"), the diagonal *is* arguably the core epistemic content. For rigid names, it's less clear what work the 1-intension does beyond the diagonalization trick. The burden is on E2D to show its primacy.
      *   **Objection Link:** The "triviality" objection directly targets this.

  ### Combining the Credences & Overall Credence
  *   **Combination Logic:** These claims are interdependent but not perfectly correlated. Claim (3) is almost presupposed. Claim (1) & (2) are foundational for (4), (5), and (6). Claim (5) is the most ambitious and dependent on the others. A simple product (0.7 * 0.6 * 0.9 * 0.8 * 0.55 * 0.65) ≈ **0.11** is too harsh due to dependencies.
  *   **Weighted Approach:** Claims (1), (2), and (5) are the linchpins. Failure of (2) or (5) severely undermines E2D's *epistemic* ambitions. Claim (3) and (4) are robust but insufficient alone. Claim (6) is important but secondary.
  *   **My Overall Credence:** ~**0.35**. This reflects:
      *   High confidence in the *formal distinction* (3) and its *explanatory power for modality* (4).
      *   Moderate confidence in the *existence* (1) and *non-triviality* (6) of 1-intensions for *some* key domains.
      *   Low confidence that 1-intensions robustly capture *cognitive significance* (2) and can substantively ground C→P (5) *across the board*, especially under idealization.

  ### The Weakest Link: Conceivability-Possibility (Claim 5, Credence 0.55)
  *   **Why Least Confident?** It's the claim most exposed to counterexamples (Kripkean necessities, complex math) and most reliant on highly idealized rational reflection. The gap between "conceivable *for us*" and "ideally primarily conceivable" feels vast, potentially severing the link to *our* epistemic practices. The restriction to "primary" possibility can seem like moving the goalposts.
  *   **Evidence/Arguments That Would Move My Credence:**
      *   **Positive:** A rigorous, *non-question-begging* demonstration that ideal primary conceivability *reliably* tracks metaphysical possibility (or even just primary possibility) in a significant, non-trivial class of cases *beyond* uncontroversial examples (e.g., showing it works for theoretical identities or complex necessities). Cognitive science evidence suggesting humans reliably approximate the ideal in ways relevant to modal judgment could help bridge the idealization gap.
      *   **Negative:** Stronger counterexamples where ideal primary conceivability clearly conflicts with metaphysical possibility in a way E2D cannot resolve without *ad hoc* maneuvers. A convincing argument showing that the *only* stable notion of conceivability usable in C→P is so idealized it loses all connection to justification, evidence, or cognition. Developments in modal epistemology offering a more compelling alternative to C→P.

  ### Uneven Success & Scope Restriction
  *   **Yes, Unevenness is Real:** My credence varies significantly by domain:
      *   **Phenomenal Concepts ("pain", "red experience"):** Highest (~0.65). The epistemic gap ("what it's like") feels fundamental. Zombie arguments leverage this. 1-intensions seem plausible for capturing "what we are picking out epistemically." C→P link is most intuitive here.
      *   **Natural Kind Terms ("water", "tiger"):** Moderate (~0.5). The descriptive element ("watery stuff") plays a role in reference-fixing, supporting a non-trivial 1-intension. Explaining necessary a posteriori works well. However, cognitive significance (Claim 2) and the C→P link (Claim 5) are weaker here than for phenomenology. Rigidity dominates post-fixing.
      *   **Proper Names ("Aristotle", "Kripke"):** Lowest (~0.4). The 1-intension often seems like a philosopher's construct. While *some* descriptive backing might exist, it rarely feels like the core cognitive content for competent users. The diagonalization worry (Claim 6) is strongest here. Explaining necessary a posteriori *using the 1-intension* feels less explanatory than simply invoking rigidity and the causal history.
  *   **Revision vs. Restriction:** This unevenness **strongly suggests scope restriction, not total rejection.** Abandoning E2D *for names* doesn't invalidate its insights for *phenomenal concepts* or even natural kinds. The framework's core strength lies in handling cases where epistemic access and metaphysical nature come apart in specific ways (the epistemic "gap"). Trying to force *all* expressions, especially pure rigid designators, into the mold weakens the theory. A more plausible E2D might:
      *   Focus primarily on phenomenal concepts, indexicals, and descriptive elements of kind terms.
      *   Acknowledge a more limited role for 1-intensions in names, perhaps closer to Stalnaker's diagonal capturing context-dependence in communication.
      *   Moderate the ambitions of the C→P link, accepting it primarily for the epistemic/explanatory gap phenomena it was designed for (like consciousness).

  The framework remains a powerful tool for *structuring* modal and epistemic puzzles, even if its strongest epistemic claims don't hold universally. Your oscillation is understandable – it reflects the genuine tension between the framework's elegant formal power and the persistent philosophical worries about its psychological and epistemic foundations, particularly concerning idealization and the nature of cognitive content.
