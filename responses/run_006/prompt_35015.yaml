answer: |-
  You've hit the nail on the head—the Mary's room debate *is* stuck in a meta-impasse, and your hunch about the core disagreement is astute. Here’s a diagnosis of the stalemate and what progress might look like:

  ### The Real Impasse: Competing Definitions of "Physical Fact" & Physicalism
  1.  **The Semantic Trench Warfare:**
      *   **Anti-physicalists (Jackson, Chalmers):** Define "physical facts" narrowly as objective, third-person, structural/functional descriptions of the world (brain states, wavelengths, computational processes). They argue Mary learns a *new kind of fact* – a subjective, first-person, phenomenal fact – which isn't derivable from or identical to the objective physical facts. *Physicalism is false because it can't account for this type of fact.*
      *   **Physicalists (Lewis, Nemirow, Loar, Papineau):** Define "physical facts" much more broadly. They argue Mary learns *only* new **ways of accessing, representing, or conceptualizing** physical facts she already knew abstractly (abilities, indexical knowledge, phenomenal concepts). Crucially, *the facts themselves* (the underlying physical/neural states) were already encompassed by physical theory. *Physicalism is safe because no new *ontologically basic* fact is added.*

  2.  **The Shifting Goalposts:** Every refinement (Phenomenal Concept Strategy, Ability Hypothesis, Acquaintance Hypothesis) is an attempt by physicalists to explain *how* Mary gains something epistemically new without it being ontologically new. Anti-physicalists counter by refining what they mean by Mary's new knowledge ("thick" phenomenal concepts, irreducible subjective character) to resist these explanations. The debate cycles because **they fundamentally disagree on what physicalism *must* account for to be true.**

  3.  **The Hidden Question: What is "Knowledge of"?** The disagreement hinges on the relationship between:
      *   Objective scientific description
      *   Subjective experience
      *   Conceptual representation
      *   Abilities/demonstrative reference
      *   Fundamental ontology
      Each side prioritizes different aspects of this web when defining "fact" and "physicalism."

  ### What Kind of Disagreement Is This?
  1.  **Primarily Conceptual/Metaphysical:** It’s about the definitions of key terms ("physical fact," "knowledge," "explanation," "physicalism") and the scope of metaphysical commitments. It's a clash of philosophical frameworks.
  2.  **Secondarily Empirical (But Indirectly):** Neuroscience *can* inform it by revealing how phenomenal states are realized and represented in the brain. However:
      *   **Finding neural correlates (NCCs)** satisfies physicalists (it shows the physical basis) but doesn't satisfy anti-physicalists (they argue the *explanatory gap* remains: why does *this* neural state feel like *redness*?).
      *   **Understanding neural representation** (e.g., predictive processing, sensorimotor contingencies) might *support* physicalist accounts of how acquaintance/knowledge-how works without new ontological facts. But anti-physicalists can still insist the subjective "what it's like" transcends functional representation.
      *   **Radical empirical discoveries** (e.g., proving consciousness is fundamental like gravity, or showing qualia exist independently of brains) *could* shift the debate, but these seem highly unlikely given current science.

  ### What Would Count as Progress?
  Genuine progress is unlikely to be a knockout punch. Look for shifts in the *terrain* of the debate:

  1.  **A New Conceptual Distinction or Framework:**
      *   Something that successfully reframes "what it's like" within a physical ontology in a way anti-physicalists find less question-begging (e.g., powerful developments in the Phenomenal Concept Strategy or integrated information theory).
      *   A persuasive argument showing that the anti-physicalist intuition fundamentally misconstrues the relationship between representation, experience, and knowledge (e.g., strong illusionism gaining traction).
      *   Clarifying that physicalism is only committed to *ontological* monism, not *epistemological* or *representational* exhaustiveness.

  2.  **Empirical Results Constraining the Options:**
      *   Neuroscience showing that phenomenal knowledge *is* literally the acquisition of new conceptual/demonstrative abilities tied to specific neural mechanisms, making Ability/Acquaintance Hypotheses much more concrete and plausible.
      *   AI/robotics creating systems that convincingly report "what it's like" based solely on complex information processing, undermining the intuition that subjectivity *must* be non-physical.
      *   Evidence that "what it's like" is highly fragmented, context-dependent, or less unified than the thought experiment suggests, weakening its status as a fundamental "fact."

  3.  **Recognizing the Question's Limits (Your "Ill-Posed" Option):**
      *   **Progress = Consensus that the argument is dialectically deadlocked** because it rests on irreconcilable intuitions about the nature of facts and physicalism. Philosophers might agree to set it aside, focusing instead on building better theories of consciousness within their preferred frameworks without expecting to "refute" the other side via Mary.
      *   **Progress = Widely accepting Epistemic Humility:** Recognizing that while physicalism *might* be true, we currently lack the conceptual tools to fully understand how subjective experience arises from the physical, and Mary highlights *that* gap, not necessarily an ontological one. This shifts focus to the "Hard Problem" itself.

  ### Conclusion
  You're absolutely right: **The core disagreement is semantic and metaphysical – about the definitions of "physical fact" and the commitments of physicalism.** Both sides agree Mary gains *something* new (epistemic access, a mode of presentation, an ability, acquaintance), but disagree vehemently on whether this constitutes learning a new *kind of fact* that breaks physicalism.

  **True progress will likely come from one of three paths:** 
  (1) A conceptual breakthrough that reframes phenomenal knowledge within physicalism convincingly (or refines physicalism itself), 
  (2) Empirical advances that make physicalist explanations of Mary's new knowledge vastly more concrete and less intuitive to deny, or 
  (3) The philosophical community collectively acknowledging the argument has reached a stalemate rooted in foundational intuitions, and moving the debate about consciousness forward on different grounds. 

  The Mary argument remains powerful because it exposes a deep intuition. Resolving it might not mean one side "wins," but rather that we develop a richer understanding of mind and matter that makes the original question feel less urgent or differently posed.
