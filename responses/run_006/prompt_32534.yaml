          - The selection probability within a known frame maps to being a random observer within a known world.

    - What you have to distort to make it fit:
          - In survey sampling, the frame is usually known. In anthropics, the frame is unknown and is the object of inference.
          - In survey sampling, we often have a known sampling design. In anthropics, the design is philosophical: are we randomly selected from the actual world or from the multiverse?

    - What has no counterpart:
          - The core philosophical question: which frame should we use for anthropic reasoning? Survey methodology doesn't address how to choose a frame when there is uncertainty about the frame itself, especially when the frame choice has such dramatic effects on the inference.

    - Is there something real in the debate that survey methodology can't express? 
          - Yes: the choice of frame. Survey methodology assumes the frame is given. The debate is about whether the frame should be the actual world or the multiverse. This choice is not a technical survey issue; it is a philosophical one.

    - Is the philosophers' problem just that they haven't noticed they're arguing about survey weights?
          - Partially, but not entirely. The mechanics of the updates can be expressed with survey weights, but the choice of frame (which determines the weights) is the essence of the debate. Survey weights are defined relative to a frame. If the frame is not agreed upon, then the weights are not agreed upon. So the debate is about the frame, not the weights per se.

  In summary, the anthropic debate can be partially mapped to survey sampling concepts, but the central issue (frame choice) is philosophical and goes beyond survey methodology.
