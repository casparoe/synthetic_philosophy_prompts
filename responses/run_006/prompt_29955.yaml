prompt: |-
  I teach an upper-level undergraduate seminar on rational choice and decision theory — 12 students, one 80-minute session — and most of them can compute an expected value but have never met the Pasadena paradox or the idea of an undefined expectation. Design an in-class activity in which they feel, before anyone names it, the force of this fact: a gamble with infinitely many outcomes can fail to have a well-defined expected value, because the sum of probability-weighted payoffs depends on the order in which the outcomes are listed. They should arrive at that realization through their own arithmetic and their own bids, not through anything I say up front. The terms "Pasadena paradox," "conditional convergence," and "Riemann rearrangement" should not be spoken until the debrief.

  The mathematical engine is the following gamble. A fair coin is flipped until it first lands tails. If the first tails occurs on the nth flip, the payoff is

  P(n) = (-1)^(n-1) · (2^n / n) tokens,

  where a negative payoff means the player pays that many tokens to the bank. The probability of first tails on flip n is 2^(-n), so the probability-weighted payoff for outcome n is (-1)^(n-1) / n. In the natural order n = 1, 2, 3, ..., the running total converges to ln 2 ≈ 0.693 tokens. Use three tickets that describe exactly the same gamble but list the outcomes in three different orders:

  - Ticket A, natural order: n = 1, 2, 3, 4, 5, ...
  - Ticket B, two positive terms of the alternating series followed by one negative term: outcomes in the order 1, 3, 2, 5, 7, 4, 9, 11, 6, 13, 15, 8, ...; the running total converges to (3/2) ln 2 ≈ 1.040 tokens.
  - Ticket C, one positive term followed by eight negative terms: outcomes in the order 1, 2, 4, 6, 8, 10, 12, 14, 16, 3, 18, 20, 22, 24, 26, 28, ...; the running total converges to -(1/2) ln 2 ≈ -0.347 tokens.

  Each ticket should come with a pre-printed worksheet whose columns are: outcome number n, probability, token payoff, probability-weighted payoff (pre-printed, to keep the arithmetic light), and a blank running-total column. Groups compute running totals for the first 16 listed outcomes, then write down the most they would pay to play the gamble once, allowing negative amounts for groups that conclude they would have to be paid to take it. Follow this with a sealed-bid token auction: each group starts with, say, 10 tokens, bids may be negative, and the winning group pays its bid and then plays a scaled, capped trial run of the gamble for token stakes (payoffs divided by 100, flips capped at 10, no payoff if no tails by flip 10), with the scaling and cap stated openly as a practical stand-in for the infinite gamble. Then — and only then — reveal that all three tickets describe the same gamble, and ask the room which fair price was right.

  The debrief should map what happened onto the mathematics: why the sum is only conditionally convergent; why rearranging its terms can make it converge to any real number, with the three tickets as three instances; why expected utility theory therefore needs absolute convergence or some other restriction before an expectation is well-defined; and how this differs from the St. Petersburg paradox, where the expectation is infinite rather than undefined. Also say what the activity cannot reproduce — in particular, that the trial run is finite and capped, so it has a well-defined expectation, while the genuinely infinite object is only being priced, not played.

  Structure your answer under the following headings, in this order, with these approximate lengths:
  - Setup and materials (150 words): room layout, groups, what to print, token scheme.
  - The activity step by step (600 words): the exact sequence, including the worksheet instructions, the auction rules, and the moment of reveal.
  - The debrief (500 words): the mapping from the running totals and bids to conditional convergence, rearrangement, and undefined expectations.
  - What will predictably go wrong and how to handle it (300 words).
  - What the activity cannot reproduce (200 words).

  Do not include a bibliography or reading list.
reasoning: |-
  We are designing an in-class activity to illustrate that a gamble can have an undefined expected value due to conditional convergence. The gamble is the Pasadena paradox, but this term and related mathematical jargon will be withheld until the debrief. The activity uses three tickets (A, B, C) that list the same outcomes but in different orders, leading to different partial sums. Students, in groups, will compute running totals for the first 16 outcomes and then bid in an auction. After the auction, they will play a scaled and capped version of the gamble, and then the instructor reveals that all tickets are the same gamble, prompting discussion.

  Structure:

  1. Setup and materials (150 words)
  2. The activity step by step (600 words)
  3. The debrief (500 words)
  4. What will predictably go wrong and how to handle it (300 words)
  5. What the activity cannot reproduce (200 words)

  Let's begin.

  ---

  **Setup and materials**

  Arrange the room for group work: three groups of four students each (12 students). Print three sets of materials:
  - **Ticket A**: lists outcomes in natural order (n=1,2,3,...).
  - **Ticket B**: lists outcomes in the order: 1,3,2,5,7,4,9,11,6,13,15,8,17,19,10,21,...
  - **Ticket C**: lists outcomes in the order: 1,2,4,6,8,10,12,14,16,3,18,20,22,24,26,28,...

  Each ticket comes with a pre-printed worksheet (one per group). The worksheet has columns: Outcome (as listed on the ticket), n (the flip number), Probability (2^{-n}), Token Payoff (P(n)=(-1)^{n-1} * 2^n / n), Probability-weighted Payoff (pre-printed, computed as (-1)^{n-1}/n), and a blank column for Running Total.

  Each group starts with 10 tokens. Prepare a coin for flipping (or a random number generator) for the auction phase. Also, have a whiteboard or projection for recording bids and results.

  ---

  **The activity step by step**

  1. **Introduction (without revealing the paradox)**: 
     - "Today we are going to explore a gamble. Each group will receive a ticket describing a gamble. The gamble involves flipping a fair coin until the first tails. The ticket lists the possible outcomes in a particular order, along with their probabilities and payoffs. Your task is to compute the running total of the probability-weighted payoffs for the first 16 outcomes listed on your ticket. Then, based on that, decide the maximum amount your group would be willing to pay to play the gamble. Remember, a negative amount means you would require payment to take the gamble."

  2. **Group work (20 minutes)**:
     - Distribute one ticket (A, B, or C) to each group, along with the corresponding worksheet. Each group has a unique ticket.
     - Instruct groups to compute the running total (cumulative sum) of the probability-weighted payoffs for the first 16 outcomes on their list. The probability-weighted payoff for outcome n is (-1)^{n-1}/n (pre-printed). They write the running total in the blank column.
     - After computing, each group writes down the maximum they would pay (which can be negative) to play the gamble once, based on their partial sum.

  3. **Sealed-bid auction (10 minutes)**:
     - Announce: "Each group starts with 10 tokens. You may bid any real number (positive, negative, or zero) to play a scaled and capped version of the gamble. The highest bid wins. The winning group pays their bid (so if they bid 5, they pay 5 tokens; if they bid -3, they receive 3 tokens) and then plays the gamble with the following modifications: the payoff for outcome n is divided by 100, and we cap the flips at 10. If no tails by flip 10, the payoff is 0 tokens. The coin is fair and flipped until the first tails or until 10 flips, whichever comes first."
     - Groups write their bids on a slip and hand it in. The instructor collects bids and announces the winning group (highest bid) and the bid amount.

  4. **Play the gamble (5 minutes)**:
     - The winning group plays the gamble: flip a coin until first tails (capped at 10 flips). Record the flip number n (if tails on the k-th flip, n=k; if no tails in 10 flips, n= none, payoff 0). Then compute the payoff as [P(n)/100] if n<=10, else 0. Adjust the group's token count: subtract their bid and add the payoff.

  5. **The reveal (5 minutes)**:
     - After the play, write the three bids on the board. Then reveal: "All three tickets describe the exact same gamble. The only difference is the order in which the outcomes are listed." Show the natural order (Ticket A) and explain that the same outcomes are just rearranged in Tickets B and C.

  6. **Prompt for discussion (5 minutes)**:
     - "Given that the gamble is the same, why did your groups come up with different running totals and different bids? Which fair price is right?"

  ---

  **The debrief**

  Begin by acknowledging the bids and running totals. Write the three running totals (after 16 outcomes) on the board. Point out that they are different: A ≈ ln2 (≈0.693) but we have partial sums; for 16 terms in natural order, the sum is about 0.725 (the partial sum of the alternating harmonic series for 16 terms). For Ticket B (pattern: two positive, one negative) the partial sum for 16 terms is about 1.15 (approximating (3/2)ln2). For Ticket C (one positive then eight negative) the partial sum for 16 terms is about -0.35 (approximating -(1/2)ln2).

  Ask: "Why did we get different answers for the same gamble?" Guide the discussion:

  - The gamble has infinitely many outcomes. The expected value is the sum of the probability-weighted payoffs: Σ (-1)^{n-1}/n. This series is conditionally convergent (it converges to ln2 in the natural order) but not absolutely convergent (the harmonic series Σ 1/n diverges).
  - Because the series is conditionally convergent, Riemann showed that by rearranging the terms, we can make the sum converge to any real number, or even diverge. In our case, Ticket A: natural order → ln2. Ticket B: rearranged to have two positive then one negative → (3/2)ln2. Ticket C: one positive then eight negative → -(1/2)ln2.

  Connect to decision theory:
  - Expected utility theory requires the expected value to be well-defined. But here, the expected value is not well-defined because the sum depends on the order of summation. Therefore, the gamble does not have a unique expected value. This is the Pasadena paradox (now name it).
  - Contrast with the St. Petersburg paradox: there, the expected value is infinite (so it's defined, but infinite). Here, it's undefined.

  Conclude:
  - To have a well-defined expectation, we require absolute convergence (or finite outcomes). Without it, the expected value is sensitive to the order of summation, which is arbitrary when the outcomes are not naturally ordered. In the Pasadena gamble, the natural order might seem intuitive, but why should that order be privileged? In decision theory, we need a rule to fix the order, or we must require absolute convergence.

  ---

  **What will predictably go wrong and how to handle it**

  1. **Groups struggle with the running total calculation**:
     - The probability-weighted payoffs are pre-printed, so they only need to add them. But if they make arithmetic errors, have them double-check. Encourage groups to assign roles: one reads, one records, one adds, one verifies.

  2. **Groups may not understand negative payoffs or negative bids**:
     - Clarify: "A negative payoff means you pay that amount. A negative bid means you are willing to be paid to take the gamble." Give an example: "If your running total is negative, you might bid -0.5 tokens, meaning you want to be paid at least 0.5 tokens to play."

  3. **Bids might be too extreme or not reflective of the partial sum**:
     - Some groups might bid 0 regardless. Remind them to base the bid on their running total. If a group bids very high (like 10 tokens) and wins, they might lose tokens in the capped play. That's okay — it illustrates the risk.

  4. **The auction might have a tie**:
     - Break ties arbitrarily (e.g., earliest submission wins) or by a coin flip.

  5. **Students might not see that the gamble is the same**:
     - During the reveal, explicitly list the first few outcomes for each ticket and show that they are the same set of outcomes. For example, Ticket A: n=1,2,3,4,...; Ticket B: n=1,3,2,... but the payoff for n=1 is the same, etc.

  6. **Time constraints**:
     - Keep the group work to 20 minutes. If groups are slow, provide a hint: "Focus on the running total column — just add the pre-printed numbers one by one." If necessary, extend the activity to the next class.

  ---

  **What the activity cannot reproduce**

  The trial run is finite (capped at 10 flips) and scaled (divided by 100). Therefore, the actual gamble played has a well-defined expected value (the partial sum of the first 10 terms of the alternating series, divided by 100). But the original gamble is infinite and uncapped. The activity only approximates the pricing of the infinite gamble. The key difference is that the infinite gamble does not have a well-defined expectation because the series is conditionally convergent. The finite version does because the sum is finite. The activity lets students experience the ambiguity in pricing that arises from the order of listing, but the actual play is a different (finite) gamble. This limitation is necessary for practicality but must be clarified in the debrief.

  ---
answer: |-
  **Setup and materials**  
  Arrange students into three groups of four. Each group receives a unique ticket (A, B, or C) describing the same gamble but listing outcomes in different orders. Print for each ticket a worksheet with pre-filled columns: outcome number (as listed), flip number \(n\), probability \(2^{-n}\), token payoff \((-1)^{n-1} \cdot 2^n / n\), and probability-weighted payoff \((-1)^{n-1}/n\). Include a blank column for cumulative running total. Provide calculators. Groups start with 10 tokens each for the auction. Prepare a fair coin, a flip cap (10 flips max), and a whiteboard for recording bids and results. Tokens are divisible (e.g., bids can be decimals).  

  ---

  **The activity step by step**  
  1. **Introduction (5 min)**: Distribute tickets and worksheets. Instruct: "Compute the running total of probability-weighted payoffs for the first 16 outcomes on your ticket. Based on this, decide the maximum your group would pay to play this gamble once—negative bids mean you’d need payment. Keep your ticket private."  
  2. **Group work (20 min)**: Groups calculate cumulative sums in the blank column. Circulate to assist with arithmetic. After 16 outcomes, groups record their bid (e.g., "We’d pay up to 0.8 tokens" or "We’d need at least 0.4 tokens to play").  
  3. **Auction setup (5 min)**: Announce rules: "Each group submits one sealed bid. Highest bid wins. Winner pays their bid from their 10 tokens (if bid is -2, they gain 2 tokens). They then play a scaled gamble: payoffs divided by 100, flips capped at 10. If no tails by flip 10, payoff is 0."  
  4. **Auction and play (10 min)**: Collect bids. Declare the winner. Flip a coin until first tails (max 10 flips). If tails occurs on flip \(n \leq 10\), payoff is \(\left[(-1)^{n-1} \cdot 2^n / n\right] / 100\); else, 0. Adjust winner’s tokens.  
  5. **Reveal (5 min)**: Post all bids. Announce: "All tickets describe the identical gamble. The outcomes are the same—only the listing order differs." Display outcome sequences. Ask: "If the gamble is the same, why did bids differ? What should its fair price be?"  

  ---

  **The debrief**  
  Begin by highlighting the bids and the running totals (e.g., Group A: ≈0.72, Group B: ≈1.15, Group C: ≈-0.35 after 16 terms). Ask: "Why did the same gamble yield different partial sums?" Elicit that the order of outcomes altered the cumulative value. Map this to the mathematics:  
  - **Conditional convergence**: The series \(\sum (-1)^{n-1}/n\) converges to \(\ln 2 \approx 0.693\) in natural order (Ticket A), but only conditionally because the absolute series \(\sum 1/n\) (harmonic) diverges.  
  - **Rearrangement effect**: Riemann’s theorem shows rearrangements can converge to any real number. Ticket B (two positives, one negative) skews high (\((3/2)\ln 2\)); Ticket C (one positive, eight negatives) skews low (\(-(1/2)\ln 2\)).  
  - **Undefined expectation**: No unique expected value exists—it depends on the arbitrary order of summation. Thus, rational choice fails: bids varied despite identical gambles.  
  - **Contrast with St. Petersburg**: Here, expectation is undefined (order-dependent), not infinite. Emphasize that expected utility theory requires absolute convergence or finite outcomes to avoid this paradox. Conclude by naming the Pasadena paradox and its implications: without a privileged order, pricing is ambiguous.  

  ---

  **What will predictably go wrong and how to handle it**  
  1. **Arithmetic errors**: Groups may misadd running totals. Mitigate by providing calculators and clarifying the pre-printed probability-weighted payoffs. Intervene to correct errors during group work.  
  2. **Confusion over negative payoffs/bids**: Some may miss that negative payoffs mean paying the bank. Explicitly state: "Negative = you lose tokens." Offer examples (e.g., "A bid of -0.5 means: Pay us 0.5 to play").  
  3. **Bids ignoring partial sums**: Groups might bid based on intuition (e.g., 0). Redirect: "Your bid should reflect your running total’s trend." If bids cluster, contrast them during the reveal to spark discussion.  
  4. **Auction ties**: Use a coin flip to break ties. If bids are identical, emphasize this as a teaching moment: "Even identical bids don’t resolve the underlying ambiguity."  
  5. **Skepticism during reveal**: Students may doubt tickets are identical. List outcomes 1–5 for each ticket to prove equivalence (e.g., Ticket A: n=1,2,3,4,5 → payoffs +2, -2, +8/3, -4, +32/5; Ticket B: n=1,3,2,... → same payoffs, different order).  
  6. **Time overrun**: Strictly enforce 20 minutes for group work. If lagging, suggest: "Compute the first 10 outcomes only." Scale bids proportionally if needed.  

  ---

  **What the activity cannot reproduce**  
  The trial run uses a finite cap (10 flips) and scaled payoffs (/100), ensuring a well-defined expectation (partial sum of an alternating series). The original gamble, however, is infinite and uncapped. This divergence is critical: the activity’s capped version has a fixed expected value (≈0.693/100 for natural order), but the true gamble lacks any well-defined expectation due to conditional convergence. The bids reflect students’ exposure to the ambiguity of pricing via partial sums, but the played gamble is distinct—it truncates risk. Emphasize that while the activity simulates the paradox’s "feel," only the infinite case genuinely exhibits undefined expectation, and the auction is merely a pedagogical proxy.
