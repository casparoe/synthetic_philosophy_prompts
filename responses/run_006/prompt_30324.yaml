answer: |-
  Here is the requirements list for an adequate theory of pain's badness, structured as requested, with pain asymbolia as the central, load-bearing case:

  **1. The target and the central case**  
  A theory of pain's badness must explain why and how pain is typically intrinsically unpleasant, motivating aversion and relief-seeking. Pain asymbolia establishes a critical dissociation: it demonstrates that the sensory-discriminative dimension of pain (intensity, location, quality) can be fully intact while the affective-motivational dimension (unpleasantness, aversiveness) is absent, challenging theories that conflate or necessarily link these dimensions.

  ---

  **2. Non-negotiable requirements**  
  *(Motivating cases in italics)*  

  | Requirement                                                                 | Motivating Case/Consideration                                                                                                                               |
  | :-------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **R1: Accommodate the dissociation**                                        | ***Pain asymbolia*** itself: Subjects report feeling pain (sensory dimension) but deny unpleasantness and show no motivation to avoid/escape.                                 |
  | **R2: Acknowledge asymbolic pain as genuine pain**                          | ***Clinical diagnosis***: Asymbolics self-report pain sensation ("I feel it, it's sharp/hot") and exhibit normal nociceptive reflexes, distinguishing it from analgesia or anosognosia. |
  | **R3: Distinguish pain intensity from unpleasantness**                      | ***Analgesic studies (e.g., opioids/placebo)***: Reduced unpleasantness despite preserved sensory intensity; ***Hypnotic suggestion***: Unpleasantness modulated independently of intensity ratings. |
  | **R4: Preserve multidimensionality**                                        | ***Empirical consensus (IASP definition)***: Pain is a "sensory *and* emotional experience"; asymbolia confirms dimensions are dissociable components.                                |
  | **R5: Explain the *source* of badness**                                     | ***Ordinary acute pain vs. asymbolia***: Why is pain usually bad? Why is it *not* bad in asymbolia? Must avoid circularity (e.g., "badness defines pain" fails R2).      |
  | **R6: Account for motivational inertness**                                  | ***Behavior in asymbolia***: No withdrawal, no learned avoidance, indifference to noxious stimuli despite accurate identification.                                     |
  | **R7: Handle cases without tissue damage**                                  | ***Neuropathic pain, fibromyalgia, "pain illusions" (e.g., thermal grill)***: Bad pain without clear peripheral noxious input.                                    |

  ---

  **3. Negotiable or camp-specific requirements**  
  *   **Intrinsic badness**: The claim that badness is *essential* to pain (R5a). **Evaluativists** (e.g., Bain, Klein) insist on this; **imperativists** (e.g., Klein, Martínez) and **representationalists** (e.g., Tye) can reject it to accommodate asymbolia (R1, R2).  
  *   **Metaphysical commitment**: Whether badness *must* be explained via representation (e.g., pain represents bodily damage as *bad* - **representationalism**), command (e.g., pain *commands* cessation - **imperativism**), or evaluative attitude (e.g., suffering *consists in* a negative attitude - **attitudinalism**). Choice here defines camps.  
  *   **Biological function as constitutive**: Whether the biological function of pain (warning/protection) is *necessary* for its badness. **Imperativists** often prioritize this; **attitudinalists/evaluativists** may decouple it.  
  *   **Phenomenal primacy**: Whether the unpleasant *feel* is explanatorily basic (**phenomenalists**) or reducible to motivation/representation (**reductionists**).  

  ---

  **4. Tensions and jointly unsatisfiable subsets**  
  The core tension lies between **R5a (Intrinsic Badness)** and the conjunction of **R1 (Dissociation)**, **R2 (Genuine Pain)**, and **R4 (Multidimensionality)**. If badness is intrinsic/essential to pain (R5a), then asymbolia (R1) cannot involve genuine pain (contra R2) – it must be misdescribed sensation or a different state. Conversely, if asymbolia involves genuine pain without badness (R1, R2), then badness cannot be intrinsic to pain (R5a must be rejected). **Resolution**: R5a (intrinsic badness) is negotiable and likely must be abandoned for an adequate theory respecting dissociation. Theories must instead explain why badness is *typically* but not *necessarily* attached to pain (e.g., via contingent mechanisms, functional context, or cognitive appraisal). Representationalism/imperativism can do this; strict evaluativism struggles.

  ---

  **5. The requirement that does the most work**  
  **R5 (Explain the source of badness)** eliminates the most standard candidates. It forces theories to explicitly address *why* dissociation occurs in asymbolia, exposing weaknesses:  
  *   **Simple perceptualism** (pain = perception of damage) fails: Damage perception remains in asymbolia without badness.  
  *   **Naïve evaluativism** (pain = evaluation of sensation as bad) fails: Asymbolics feel pain without this evaluation.  
  *   **Crude imperativism** (pain = "Stop!" command) fails: Asymbolics receive the "command" but feel no urgency.  
  *   Theories claiming badness is *identical* to sensory qualities fail R1/R3.  
  R5 compels theories to provide a mechanism for *contingent linkage* between sensation and affect. Imperativism must explain why commands aren't motivating; representationalism must explain why a "bad" representation isn't disliked; attitudinalism must explain why the attitude is absent. Most theories require significant refinement or auxiliary hypotheses to satisfy R5 alongside R1-R2.

  ---

  **6. Where I am least confident**  
  I am least confident about **R5b (requiring an explanation for why badness is *absent* in asymbolia)** as a *non-negotiable* demand. While explaining the *presence* of badness in typical pain is essential, the precise explanation for its *absence* in asymbolia might legitimately depend on contingent neurocognitive details (e.g., insula dysfunction disrupting integration) that a philosophical theory of *badness itself* shouldn't be expected to fully specify. If future research revealed that asymbolics exhibit *subtle, non-conscious aversion* (e.g., via priming or autonomic responses) despite explicit reports of indifference, it might challenge R1/R6 and suggest R5b is too strong or misdirected. A theory might adequately characterize badness and its typical causes without fully explaining every pathological dissociation, provided it doesn't *contradict* the dissociation (R1 remains non-negotiable).
