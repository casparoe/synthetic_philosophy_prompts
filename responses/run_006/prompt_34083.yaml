prompt: |-
  I'm a novelist -- literary fiction, three books out, one of them shortlisted for a prize you haven't heard of. I've been reading Hofstadter and Sander's Surfaces and Essences, or at least the first half of it, and the core claim -- that analogy is the fuel of all cognition, that there's no bright line between literal and figurative thinking, that every concept we have is just a category stretched by past analogies -- has been rattling around in my head while I revise my current manuscript.

  Here's what I want. I want you to restate the Hofstadter/Sander thesis -- the whole thing, the claim that analogy is the core of cognition -- in the vocabulary of my craft. Not "explain it to a novelist" -- I mean actually translate it. Take every major claim they make and try to say it using only the concepts a working novelist uses when thinking about fiction: character, plot, narrative voice, point of view, scene, pacing, metaphor and simile, theme, motif, subtext, tone, showing vs. telling, revision, drafting, the "felt" quality of a passage, and whatever else lives in that toolbox. Assume I'm fluent in that vocabulary, because I am.

  Then give me the residue report. Which claims translate cleanly? Which ones did you have to bend or fudge to fit? Which ones have no expression at all in the novelist's vocabulary? And here's the part I really want: is the stuff that didn't survive the translation a clue that the novelist's framework is missing something -- something about cognition it can't see -- or is it a clue that the Hofstadter/Sander thesis is smugling in assumptions that the translation exposes? Or both?

  I want you to be honest about the translation. Don't just declare that "metaphor" maps to "analogy" and call it done. The point is to see what the novelist's vocabulary can and can't carry.

  Before you write the main answer, spend some time brainstorming: list the central claims of the Hofstadter/Sander thesis, then think through what each one looks like when you try to restate it in the novelist's vocabulary. Note where the fit is snug and where it starts to gap.

  At the very end, give me a one-sentence summary of the most important thing that didn't survive the translation, formatted as \answer{...}.
