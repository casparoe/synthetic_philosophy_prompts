  So I've been arguing with my officemate about Maxwell's demon for like a week now — he's a physics grad student and I'm in CS but I got sucked into reading about the thermodynamics of computation and now I can't stop. The standard Bennett/Landauer resolution says the demon can measure molecules without any entropy cost, but eventually it fills up its memory and has to erase, and erasure costs kT ln 2 per bit, which saves the second law. My officemate thinks this is basically settled. But I've come across these arguments — going back to Brillouin and more recently revived — saying no, measurement itself has an irreducible thermodynamic cost, and Bennett's whole erasure story is unnecessary; the demon fails at step one.

  I want a thought experiment that isolates this exact dispute. Here's the spec: construct a classical (no quantum) setup where a demon-like mechanism acquires one bit of information about a particle and uses it to extract work, but the measurement apparatus is engineered so that it ends up in exactly the same thermodynamic state it started in — no memory to erase, no record left behind, the information is "consumed" in the act of extracting work. If measurement really is free, this setup should be a clean second-law violation. If it's not, we should be able to point to exactly where the entropy cost enters.

  Constraints: the mechanism has to be physically possible in principle (no magic, no perfect pistons that violate their own thermodynamics), the work extraction should be quantifiable at least roughly, and the whole scenario should fit in two paragraphs. After the scenario, walk through the entropy accounting step by step — system, measurement apparatus, work reservoir — and tell me whether the second law is violated on the assumption that measurement is free. If it's not violated, pinpoint where the entropy cost sneaks in. Then tell me what a Bennett-style "erasure is the only cost" person would say about your setup: where would they claim hidden memory is lurking that you missed?
