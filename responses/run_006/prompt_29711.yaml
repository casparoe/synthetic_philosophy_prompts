  Okay, the user is writing a dissertation chapter on moral dilemmas and has noticed that the literature is talking past itself because different authors are addressing subtly different questions under the same label. They want to establish what an adequate theory must get right before evaluating positions like Williams' moral remainders, Brink's dissolution, Marcus' deontic logic approach, and 'ought implies can' arguments. 

  Hmm, this is a sophisticated request. The user clearly has deep familiarity with the primary literature but is frustrated by the lack of conceptual clarity. They're not just asking for a list of desiderata - they want to understand the underlying tensions between them, especially where satisfying one requirement might force violations of another. That's meta-theoretical heavy lifting.

  The key insight here is recognizing that "genuine moral dilemma" isn't a monolithic concept but a cluster of related phenomena. Any adequate theory must at minimum: preserve the phenomenology of tragic choice (that Agnes feeling), maintain logical coherence (no contradictions), and account for moral residue (Williams' guilt). But these already pull in different directions - the Agnes case wants conflicting obligations, while logic forbids it. 

  Ah, and there's the rub: the central tension emerges between Phenomenological Adequacy and Logical Coherence. Most theories sacrifice one for the other. Brink dissolves the phenomenology; Williams embraces logical inconsistency. Only hybrid approaches like those using defeasible obligations or context-indexed norms try to satisfy both, but they have their own costs regarding Action Guidance and Normative Authority.

  The user will need to decide which desiderata they consider non-negotiable. For example, if they take moral residue as non-negotiable (as Williams does), that forces rejection of the agglomeration principle in deontic logic. But if they prioritize logical consistency above all (like Brink), they must explain away residual guilt as irrational. 

  What's brilliant about framing it this way is that it transforms the debate from "who's right about dilemmas" to "what are we even asking when we ask about dilemmas?" That's dissertation gold - the kind of meta-level contribution that gets committees excited.
answer: |-
  Here is a meticulously structured specification of desiderata for any adequate theory of genuine moral dilemmas, designed to map the conceptual terrain and expose underlying tensions. I've categorized them, provided motivating cases, indicated negotiability, and highlighted key conflicts.

  ## Desiderata for a Theory of Genuine Moral Dilemmas

  | Desideratum                          | Core Motivation & Example                                                                                                                                                 | Non-Negotiable? | Key Tensions/Considerations                                                                                                                              |
  | :------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **I. Phenomenological Adequacy**     |                                                                                                                                                                            |                 |                                                                                                                                                          |
  | **1. Residual Phenomenology**         | **Motivation:** Must account for the *distinctive phenomenology* of tragic choices: inescapable guilt, regret, or sense of moral taint even after choosing. **Example:** Williams' "Jim and the Indians" – Jim feels profound guilt/shame for killing one to save nineteen, even if it was "right." **Loss:** Abandoning this loses the core experiential datum driving the debate. | **Yes**         | **Primary Tension:** Direct conflict with Logical Coherence & Normative Authority. Capturing this *requires* acknowledging a persistent negative moral residue that seems incompatible with consistent obligation discharge. |
  | **2. Choice Phenomenology**           | **Motivation:** Must explain the *experienced impossibility* of full compliance and the feeling of being "damned if you do, damned if you don't." **Example:** Sartre's student torn between joining Resistance or caring for mother – each choice feels like a profound moral failure. **Loss:** Reduces dilemmas to mere difficult choices or epistemic uncertainty. | **Yes**         | Tensions with Normative Authority (if "ought implies can" is strict) and Action Guidance.                                                                     |
  | **II. Logical & Conceptual Coherence** |                                                                                                                                                                            |                 |                                                                                                                                                          |
  | **3. Logical Consistency (Non-Contradiction)** | **Motivation:** Avoids rendering normative ethics logically incoherent. Obligations must not entail contradictions. **Example:** If "Obligatory A" and "Obligatory not-A" are both true simultaneously, logic explodes. **Loss:** Abandoning this makes normative reasoning impossible; sacrifices rational foundations. | **Yes**         | **Primary Tension:** Direct conflict with Residual Phenomenology & Choice Phenomenology if interpreted as requiring *simultaneous, indefeasible* conflicting obligations. |
  | **4. Normative Authority ("Ought Implies Can")** | **Motivation:** Captures the link between obligation and agency. An impossible obligation lacks genuine normative force. **Example:** It seems absurd to say I *ought* to jump to the moon tomorrow. **Loss:** Risks "moral fetishism" – divorcing obligation from human capacity. | **Contested**   | **Crucial Battleground:** Brink-style dissolutionists treat this as strict & non-negotiable, making dilemmas impossible. Dilemma defenders often weaken it (e.g., Williams: "can" includes psychological possibility) or reject its universal application in dilemma contexts. Tension with Choice Phenomenology. |
  | **5. Agglomeration Principle**        | **Motivation:** Preserves core deontic logic: if you ought to do A and ought to do B, you ought to do (A and B). **Example:** If I ought to keep my promise and ought to save a life, I ought to do both. **Loss:** Undermines standard deontic logic (SDL); complicates reasoning about multiple obligations. | **Contested**   | Dilemma defenders (Marcus, McConnell) *must* reject Agglomeration to avoid logical contradiction (if OA and O~A, then O(A & ~A) is explosive). Sceptics insist on it. |
  | **III. Normative Functionality**      |                                                                                                                                                                            |                 |                                                                                                                                                          |
  | **6. Action Guidance**                | **Motivation:** Ethics must offer practical direction. Even in dilemmas, a theory should guide choice. **Example:** A soldier in a "dirty hands" scenario needs to know *what to do*, even if it's tragic. **Loss:** Renders ethics practically inert in the hardest cases. | **Contested**   | Dilemma defenders often argue guidance *is* possible (choose the lesser evil, follow strongest prima facie duty) *despite* residue. Sceptics argue dilemmas make guidance impossible, hence they can't be genuine. Tension with Residual Phenomenology if guidance implies full discharge. |
  | **7. Blame/Justification Structure**  | **Motivation:** Must account for judgments of blame, excuse, justification, and tragic fault. **Example:** Agamemnon sacrificing Iphigenia may be *understandable* or even *all-things-considered justified* but still blameworthy/tragically faulty. **Loss:** Fails to explain complex moral assessments prevalent in dilemma discourse. | **Yes**         | Requires explaining how an action can be justified/required but still incur blame/residue (tension with simple monism).                                                                 |
  | **IV. Theoretical Parsimony & Scope** |                                                                                                                                                                            |                 |                                                                                                                                                          |
  | **8. Fit with Broader Metaethics**    | **Motivation:** Should cohere with plausible metaethical commitments (e.g., realism vs. expressivism, objectivism vs. relativism). **Example:** Moral realism might find dilemmas harder to accommodate than pluralism or non-cognitivism. **Loss:** Ad hoc solutions; reduced theoretical credibility. | **Contested**   | Different metaethical starting points influence which desiderata are prioritized (e.g., expressivists may downplay Logical Consistency for Phenomenology). |
  | **9. Explanatory Power**              | **Motivation:** Should explain *why* dilemmas arise (if possible) – e.g., value pluralism, rule conflicts, situational constraints. **Example:** Berlin/Williams on deep value pluralism as the source. **Loss:** Leaves the phenomenon mysterious; merely stipulative. | **Contested**   | Sceptics (like Brink) argue dissolution *is* explanatory (it shows the error generating the illusion).                                                                   |

  ## Key Tensions & Substantive Results

  1.  **The Core Antinomy:** The fundamental tension lies between **Phenomenological Adequacy (1 & 2)** and **Logical Consistency (3)** combined with a strict **Normative Authority (4)** and **Agglomeration (5)**. Satisfying the phenomenology *seems* to require acknowledging inescapable conflicting obligations leading to inescapable residue, violating logical consistency and potentially "ought implies can". Satisfying logic and strict OIC forces reinterpreting or denying the core phenomenology (e.g., as irrational guilt, or reducing conflicts to epistemic problems or commensurable trade-offs).
      *   **Result:** *This tension is the engine of the debate.* Positions define themselves by which pole they prioritize and how they manage the trade-off.

  2.  **The Agglomeration Battleground:** Rejecting the **Agglomeration Principle (5)** is *necessary* for most defenders of genuine dilemmas to avoid outright logical contradiction while accepting conflicting obligations. Sceptics see rejecting Agglomeration as an unacceptable ad hoc maneuver that cripples deontic logic. *This is a key fault line.*

  3.  **"Ought Implies Can" as Scalpel or Sledgehammer:** How strictly **Normative Authority (4)** is interpreted is decisive.
      *   Strict OIC + Agglomeration + Logical Consistency → **Impossibility Thesis** (Brink, McConnell sometimes). Dilemmas are illusions.
      *   Weakened OIC (e.g., psychological impossibility counts, or OIC doesn't apply to *prima facie* oughts) + Rejection of Agglomeration → **Possibility Thesis** (Marcus, Williams, Nussbaum). Dilemmas are real and tragic.
      *   **Tension:** Strict OIC clashes directly with Choice Phenomenology (2). Weakened OIC risks diluting normative force.

  4.  **Residue Requires Asymmetry:** Adequately explaining **Residual Phenomenology (1)** and the **Blame Structure (7)** *without* logical contradiction typically requires an asymmetry:
      *   The agent incurs a "dirty" residue/blame *despite* having chosen the best/only possible course (*justified wrongdoing* - Williams, dirty hands).
      *   Or, obligations are defeasible/hierarchical, but the defeated obligation leaves a persistent "remainder" (Rossian prima facie duties).
      *   **Loss (for symmetry):** Pure symmetry (two equally indefeasible, conflicting obligations) seems logically unsustainable and struggles with Action Guidance (6).

  ## What is Settled vs. Contested

  *   **Settled:**
      *   The *phenomenon* described by Phenomenological Adequacy (1, 2) is real and central to the debate. Any theory must engage with it seriously, even if to explain it away.
      *   Outright logical contradiction (violating 3) is unacceptable for any theory aspiring to rational coherence. Dilemma defenders *must* find ways to avoid OA & O~A being simultaneously true in an indefeasible, all-things-considered sense.
      *   Any adequate theory must address the Action Guidance/Blame Structure (6, 7) issues raised by apparent dilemmas.

  *   **Contested:**
      *   **The Possibility Question:** Whether genuine dilemmas (satisfying 1 & 2 without violating 3) are *actually* possible remains the core dispute.
      *   **The Status of OIC (4) & Agglomeration (5):** Whether these are inviolable constraints or adjustable tools is hotly debated. This is where the battle lines are most clearly drawn.
      *   **The Best Explanation of Residue (1 & 7):** Is it genuine moral remainder from a violated obligation? Irrational guilt? Aesthetic regret? A feature of non-moral commitments? Deeply contested.
      *   **The Role of Metaethics (8):** While all theories need metaethical coherence, *which* metaethics best supports or dissolves dilemmas is unresolved.

  ## Conclusion: The Map & The Terrain

  An adequate theory must navigate this minefield. It **must** (Non-Negotiable):

  1.  **Capture the distinctive, inescapable negative residue** (Residual Phenomenology).
  2.  **Capture the experience of impossible moral compliance** (Choice Phenomenology).
  3.  **Maintain logical consistency** in its core normative claims.
  4.  **Explain the structure of justification, blame, and excuse** in tragic choices.

  It **must convincingly address** the contested but crucial pressures from:

  5.  **Normative Authority ("Ought Implies Can")**: Does it strictly forbid dilemmas, or can it be nuanced?
  6.  **The Agglomeration Principle**: Can it be rejected, or is rejecting it too costly?
  7.  **Action Guidance**: Can it offer practical direction without dissolving the dilemma?
  8.  **Fit with Broader Metaethics**: Does it cohere with a plausible underlying account of morality?
  9.  **Explanatory Power**: Does it explain *why* dilemmas arise (if they do)?

  **The Substantive Tension:** The unresolvable pull is between the raw, tragic phenomenology demanding recognition of inescapable moral failure/residue, and the rational demands of logic and normative authority that seem to forbid the very possibility of such failure being genuinely *moral* and *inescapable*. **This tension isn't preliminary; it *is* the heart of the debate.** A successful theory doesn't dissolve the tension; it provides the most compelling account of why it arises and how we should live with (or resolve) it. Your evaluation of positions should focus on how they manage this fundamental antinomy and which trade-offs they make between these core desiderata.
