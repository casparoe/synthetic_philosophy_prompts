  Okay, the user is deep into linguistic philosophy, specifically the semantics and pragmatics of slurs. They're clearly frustrated with piecemeal accounts and want a comprehensive framework to evaluate theories against. This isn't casual curiosity—they're building analytical tools.  

  Hmm, their request is unusually systematic. They've listed specific phenomena (embedding behaviors, in-group reclamation) but also implied gaps ("add anything I've missed"). That suggests they might be preparing for academic writing or dissertation work. The emphasis on "non-negotiable" vs. "theory-optional" points to rigor—they want to identify which constraints are empirical bedrock versus ideological commitments.  

  Breaking it down:  
  First, core distinctions—slurs vs. neutral counterparts (like "n-word" vs. "Black person") and vs. generic insults ("jerk"). Must explain why one is socially toxic while others aren't. Then embedding puzzles: why "He's not a [slur]" still feels offensive, or how quotation ("Some say [slur]") dodges full derogation. These seem non-negotiable; real language data hinges on them.  

  Social dynamics are trickier. In-group reclamation (e.g., queer communities using "queer") needs handling without implying slurs magically lose power. Also speaker asymmetry: why identical words harm more from out-group mouths. Here, some requirements might be theory-laden—e.g., if you prioritize speaker intent over community practice, reclamation looks different.  

  The taboo/false distinction is crucial. Slurs aren't just lies; they're violence-laden. A theory collapsing offense and falsity would fail when slurs are "accurately" used hatefully. Similarly, contempt without slurs ("You're disgusting") vs. slur without audible contempt—the former might insult, but the latter *constitutes* group-based harm.  

  Biggest tension? Probably between variation (slurs change over time/community) and stability (we still recognize them as a category). If a theory makes slurs too relative, it can't explain persistent harm patterns. Yet rigid universalism ignores reclamation.  

  Most eliminative desideratum? Embedding behavior. Many popular theories (expressivist, semantic) stumble on negation or questions. If "Is X a [slur]?" isn't neutral, that kills purely truth-conditional accounts.  

  User's unspoken need: they want ammunition to dismantle weak theories. So I'll flag irreconcilables—e.g., if you demand in-group uses *never* derogate, you might break embedding patterns. And I'll highlight which requirements are battle lines (e.g., prescriptivists hate variation; critical theorists insist on asymmetry).  

  Final note: user said "keep scorecard brief," so I'll summarize conflicts without diving into each theory's flaws. Their goal is criteria, not a survey.
answer: |-
  Here is a comprehensive set of desiderata for a theory of slurs, organized by core phenomena, with contrasts illustrating each requirement. I've marked non-negotiables (NN), theory-laden demands (TL), flagged tensions, and identified the most eliminative criterion.

  ### I. Core Identity & Distinctions
  1.  **Slur vs. Neutral Counterpart (NN):** Must explain the *truth-conditional equivalence* yet *pragmatic/expressive difference* (e.g., "k*ke" vs. "Jewish person" can refer to the same group but convey hatred). *Contrast:* Uttering "He is Jewish" (neutral) vs. "He is a k*ke" (derogatory) while potentially referring to the same individual.
  2.  **Slur vs. Generic Insult (NN):** Must explain why slurs target group membership inherently, while insults target behavior/character (e.g., "asshole" insults action/character; "f****t" insults group identity). *Contrast:* "You're acting like an asshole" (criticizes behavior) vs. "You're a f****t" (attacks identity).
  3.  **Derogation vs. Mere Offense (NN):** Must distinguish causing personal upset ("That haircut is awful") from the group-based degradation and dehumanization inherent in slur use. *Contrast:* Calling someone "ugly" (offensive, personal) vs. calling them a "r*tard" (derogatory, group-based, dehumanizing).
  4.  **Taboo vs. Falsehood (NN):** Must distinguish why slurs are verboten (taboo) regardless of factual accuracy in a context, unlike false descriptions. *Contrast:* Falsely saying "He's a thief" (false, potentially harmful, but not inherently taboo) vs. accurately saying "He's a k*ke" (true on some historical definitions, yet still deeply taboo and harmful due to derogation).

  ### II. Semantic & Pragmatic Behavior
  5.  **Embedding Resilience (NN - Core Cases):** Must explain why derogatory force often persists under:
      *   **Negation:** "He is not a ch*nk" still feels offensive/derogatory.
      *   **Conditionals:** "If he's a sp*c, he can't be trusted" implicates the speaker endorses the derogation.
      *   **Questions:** "Is she a dyke?" feels loaded and offensive, not neutral inquiry.
      *   *(Note: Attitude reports & quotation/mention are more complex - see 6 & 10)*
  6.  **Embedding Variability:** Must account for potential shifts in force under:
      *   **Attitude Reports:** "John believes she's a w*p" may attribute the derogatory belief to John, sparing the reporter *full* complicity, yet often still feels tainted.
      *   **Quotation/Mention:** "Some people use the word 'n****r'" (mention) typically lacks the full derogatory force of direct use, though context matters. *Contrast:* Direct use vs. linguistic citation.
  7.  **Use vs. Mention Distinction (NN):** Must rigorously handle the difference between *using* a slur derogatorily and *mentioning* it (e.g., in linguistic or historical discussion). *Contrast:* "He called me a [slur]" (mention/reporting) vs. "You are a [slur]" (direct use).

  ### III. Speaker, Audience & Social Dynamics
  8.  **Speaker Identity Asymmetry (NN):** Must explain why out-group use is typically maximally derogatory/harmful, while in-group use *can* be non-derogatory, reclaimed, or complexly nuanced. *Contrast:* A white person using "n****r" vs. a Black person using it (potentially as "nigga").
  9.  **In-Group Use & Reclamation (TL - but essential):** Must accommodate the possibility of in-group usage that lacks derogatory intent/force (camaraderie, defiance) and the phenomenon of reclamation (e.g., "queer," "bitch"), explaining how the term's meaning/force changes *for the group* without erasing its history or its toxicity from out-group mouths. *Contrast:* "We're here, we're queer!" vs. an outsider shouting "You queer!"
  10. **Mention vs. Use by Outsiders:** Must explain the potential offensiveness/harm *even in mention* by outsiders, distinct from direct derogatory use but often still problematic. *Contrast:* A teacher carefully discussing the word "n****r" in a literature class (potentially appropriate mention) vs. a comedian using it for shock value (exploitative pseudo-mention).

  ### IV. Variation & Stability
  11. **Cross-Community & Diachronic Variation (NN):** Must allow that a term's status as a slur, its intensity, and its neutral counterpart can vary across communities and time (e.g., "gyp" vs. "Romani"; changing acceptability of "oriental"). *Contrast:* "Chinaman" (widely recognized slur) vs. regional/dated terms with variable perception.
  12. **Category Stability (NN):** Despite variation, must explain the robust, cross-cultural recognition of slurs *as a functional linguistic category* (expressing group-based contempt). *Contrast:* Slurs vs. merely outdated/impolite terms (e.g., "colored" vs. the n-word).

  ### V. The Force & Its Sources
  13. **Derogation Without Audible Contempt (NN):** Must explain how a slur uttered dispassionately, jokingly, or "neutrally" by an out-group speaker still constitutes derogation and causes harm. *Contrast:* A bored teenager casually saying "That's so gay" vs. someone shouting "You f*****!" in rage.
  14. **Contempt Without Slur (NN):** Must explain why intensely contemptuous non-slur language ("You subhuman vermin!") can be deeply offensive and harmful, but *differs* from the specific, identity-targeting harm of a slur. *Contrast:* "You disgusting piece of trash!" (generic contempt) vs. "You dirty k*ke!" (identity-based derogation).
  15. **Content vs. Identity Interaction (TL):** Must address the interplay between the semantic/referential content of the slur, the speaker's identity/intent, and the audience's perception/response. *(Most theories prioritize one aspect but must acknowledge the others)*.

  ## Classification & Conflicts

  *   **Non-Negotiables (NN):** 1, 2, 3, 4, 5 (core embeddings: neg, cond, ques), 7, 8, 11, 12, 13, 14. These are widely agreed core phenomena a theory *must* address.
  *   **Theory-Laden Demands (TL):** 6 (specifics of attitude/quote handling), 9 (specifics of reclamation mechanism), 15 (degree of speaker vs. term primacy). Different camps prioritize different solutions here.
  *   **Flagged Tensions:**
      *   **In-Group Non-Derogation (9) vs. Embedding Resilience (5):** If in-group use genuinely lacks derogatory content/force, why does "He's not a [slur]" (uttered by an in-group member) often *still* feel problematic or carry echoes of the slur? Conversely, if the derogation is purely semantic, how does in-group use neutralize it?
      *   **Variation (11) vs. Category Stability (12):** Accounting for significant variation without dissolving the category requires careful balancing of semantic core vs. pragmatic/social factors. Over-emphasis on either risks failure.
  *   **Most Eliminative Desideratum:** **Embedding Resilience (5), particularly under Negation and Conditionals.** Many popular theories fail decisively here:
      *   **Pure Semantic (Loaded Description):** Struggles with negation ("He's not a ch*nk" should negate the description, removing offense).
      *   **Pure Expressivist/Exclamation:** Struggles with embedding in complex sentences (can't easily explain why force projects in conditionals/questions).
      *   **Presuppositional:** Can handle projection but often struggles with the *specific kind* of offense and its truth-conditional equivalence with the neutral counterpart.
      *   **(Hybrid theories like Dual-Content/Pragmatic Encapsulation are often developed specifically to address this challenge.)**

  ## Brief Scorecard of Leading Views (How they fare on key NN)

  *   **Semantic (Loaded Description):** Fails 5 (Embedding).
  *   **Pure Expressivism:** Fails 5 (Embedding), struggles with 1 (Truth-Conditional Equivalence).
  *   **Presuppositional:** Fails 5 (often predicts cancelability under negation which isn't observed), can struggle with 1.
  *   **Prohibitionist (Taboo):** Fails 3 (Derogation vs. Offense), 4 (Taboo vs. False), 13 (Derogation w/o Contempt).
  *   **Dual-Content/Hybrid (e.g., Pejoratives):** Designed to handle 1 & 5, often does well on core NN. Challenges remain with 9 (Reclamation) & 6 (Attitude Reports).
  *   **Pragmatic (e.g., Stereotyping Implicature):** May struggle with 5 (Projection strength), 13 (Derogation w/o Contempt), often makes force too cancelable.

  An adequate theory must navigate these constraints, prioritizing the non-negotiables, especially the embedding behavior, while offering plausible accounts for the more theory-laden phenomena like reclamation and the nuances of attitude reports. The tension between in-group use and embedding resilience remains a significant hurdle.
