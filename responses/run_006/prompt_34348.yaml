prompt: |-
  I teach a mixed undergrad/grad seminar on risk and collective action — 16 people, one 80-minute session. Next week I want to do the unilateralist's curse, but I don't want to lecture it: I want them to walk into it themselves before I name it. Design an in-class game where each player has a private, noisy signal about whether some risky action is a good idea, and any single player can unilaterally pull the trigger on that action for the whole group. The punchline they should hit on their own is that the group ends up acting far more often then any individual would endorse, and that adding more independent deciders makes it worse, not better. Give me rules, materials, a points-based payoff scheme (no real money, and no calling it a curse until the debrief), a timeline for the 80 minutes, and a debrief that maps specific moments in the game onto the formal structure — especially the point that the group's effective threshold is the most optimistic member's threshold rather than any kind of average or vote. Also tell me what will predictably go wrong the first time I run it and how to handle each, and be honest about which feature of the curse the game can't capture and that I'll have to just say outright.

  Structure the answer as:
  1. Setup and materials (~120 words)
  2. Rules and payoffs (~300 words)
  3. Timeline for the session (~150 words)
  4. Debrief: what happened and what it maps to (~300 words)
  5. Predictable failures and fixes (~200 words)
  6. What the game can't reproduce (~150 words)
reasoning: |-
  Okay, I need to design an in-class game for a seminar on risk and collective action that illustrates the unilateralist's curse. The user wants students to discover through gameplay that having multiple independent deciders leads to more frequent risky actions than any individual would prefer, and that adding more players worsens the problem. 

  First, considering the constraints: 16 students, 80-minute session, no lecturing upfront about the curse. The game must use points-based payoffs with no real money. The debrief should explicitly connect game events to the formal structure, especially highlighting how the group's action threshold becomes the most optimistic member's threshold.

  For setup, I'm thinking a simple card game with sealed envelopes containing private signals. Materials needed: envelopes, colored cards (green/yellow/red), a central "action trigger" like a bell. Each player gets a private signal about whether an action is safe (green), risky (yellow) or dangerous (red), with the true state determined by a hidden reference card. The twist: any player can unilaterally trigger the action.

  The payoff structure should incentivize triggering only when safe, with penalties for inaction during safe states and catastrophic penalties for triggering when dangerous. Point values need careful calibration to make triggering tempting with yellow signals but disastrous with red.

  Timeline-wise: 5 min setup explanation, 15 min gameplay across multiple rounds with varying player counts, 10 min small group discussion, then 40 min guided debrief. Key is leaving enough time for students to articulate the problem before naming the curse.

  Predictable issues: students might be overly cautious initially, or conversely one dominant player might trigger immediately. Need mitigation strategies like emphasizing point incentives and using the "no early triggering" rule. Also prepare for signal misinterpretation - using simple color coding should help.

  The game can't perfectly replicate continuous probability distributions or varying risk thresholds - I'll note this limitation and clarify during debrief that real-world applications involve more nuanced judgment calls. The core takeaway should remain clear: decentralized decision authority creates systemic over-action bias.
answer: |-
  ### 1. **Setup and Materials**  
  **Materials:** 16 sealed envelopes (each containing one colored card: GREEN/YELLOW/RED), 1 reference envelope (holds the "true state" card: SAFE/DANGEROUS), a bell/button as the "action trigger," scoreboard. Prepare envelopes: 8 GREEN, 4 YELLOW, 4 RED cards for players. Reference envelope: pre-set SAFE (75%) or DANGEROUS (25%). **Room Setup:** Desks in a circle; trigger in center. Distribute envelopes randomly; students *don’t open yet*. Explain: "You’re a team deciding whether to launch a risky project. Each holds a private signal about its safety. *Any one of you* can trigger it alone. Goal: Maximize points."

  ### 2. **Rules and Payoffs**  
  **Rules:**  
  - Open envelopes privately. GREEN = "Likely safe," YELLOW = "Uncertain," RED = "Likely dangerous."  
  - Players deliberate openly *but cannot reveal their card color*.  
  - **Any player** can trigger the action at any time by ringing the bell.  
  - If no one triggers after 3 minutes, action is not taken.  
  - Reveal true state (SAFE/DANGEROUS) after each round.  

  **Payoffs (Points):**  
  - **Trigger & SAFE:** +50 points to *everyone*  
  - **Trigger & DANGEROUS:** –100 points to *everyone*  
  - **No trigger & SAFE:** –10 points to *everyone* (missed opportunity)  
  - **No trigger & DANGEROUS:** +20 points to *everyone* (avoided disaster)  

  **Rounds:**  
  1. **Round 1:** 4 players (others observe).  
  2. **Round 2:** 8 players.  
  3. **Round 3:** Full 16 players.  
  *Reset points each round; track group totals.*

  ---

  ### 3. **Timeline for Session**  
  - **0–5 min:** Introduce scenario, distribute envelopes, explain rules/payoffs.  
  - **5–20 min:** **Round 1 (4 players).** 3-min deliberation → trigger or not → reveal true state → record points.  
  - **20–35 min:** **Round 2 (8 players).** Repeat.  
  - **35–50 min:** **Round 3 (16 players).** Repeat.  
  - **50–60 min:** Small groups discuss: *"Did the group act more/less than you wanted? Why?"*  
  - **60–80 min:** Debrief (structure below).  

  ---

  ### 4. **Debrief: What Happened and What It Maps To**  
  **Start with observations:**  
  - *"How many rounds saw the action triggered? Did anyone personally want to trigger it when others didn’t?"* (Likely: Action triggered in most rounds, especially with more players).  
  - *"Did anyone with a RED card feel pressured to stay silent?"* (Highlight asymmetric influence: Optimists speak up; pessimists hesitate).  

  **Map to formal structure:**  
  - **Private signals:** Cards simulate noisy information (GREEN/YELLOW/RED ≈ high/medium/low confidence of safety).  
  - **Unilateral power:** The bell represents *any single actor’s ability to impose risk on all*.  
  - **Group threshold:** Point out: *"The action happened whenever the *most trigger-happy* person decided—even if 15/16 disagreed. Did your ‘average’ signal matter?"* (No! The group’s de facto threshold was the *lowest* bar for action, not consensus or median).  
  - **Scaling problem:** Show round-by-round points: *"As we added players, did triggering become more or less frequent? Why?"* (More players = higher chance one has GREEN/misreads signal → over-action). **Name the curse here** and link to real cases (e.g., AI research, pollution).  

  ---

  ### 5. **Predictable Failures and Fixes**  
  - **Failure 1:** *No one triggers even when SAFE* (e.g., Round 1). **Fix:** Between rounds, remind players: "Inaction costs points if SAFE!" Show missed +50 vs. –10.  
  - **Failure 2:** *One player triggers immediately*. **Fix:** Enforce "no triggering in first 60 seconds" to allow deliberation. If it happens, use it: *"Why did you act? Did others agree?"*  
  - **Failure 3:** *Players reveal card colors*. **Fix:** Warn: "No revealing colors—this simulates private info!" Confiscate cards if breached.  
  - **Failure 4:** *Dominant voices suppress others*. **Fix:** Post-game discussion: *"Did quieter players with RED cards speak? Why not?"*  

  ---

  ### 6. **What the Game Can’t Reproduce**  
  The game simplifies **continuous probability distributions** into discrete signals (GREEN/YELLOW/RED). Real-world actors receive nuanced evidence (e.g., 70% confidence), and thresholds vary individually. Here, thresholds are fixed by card colors, hiding how rational actors might *adjust* their risk tolerance based on group size. **Explain post-game:** *"In reality, the curse worsens when individuals underestimate how their optimism combines with others’ independence. A rational agent might set a higher personal threshold in larger groups—but humans rarely do this intuitively."* Use this to transition to mitigation strategies (e.g., voting, blinding).
