  So, the outcomes are:

          Low (0.2)   Medium (0.5)   High (0.3)
  A       $1,000      $2,000         $3,000
  B       $0          $3,000         $3,000

  Note: We assume the utility function u is linear in money for simplicity (u(x)=x) because we want the divergence to come from risk weighting. Also, the stakes are ordinary (a few thousand dollars) and not life-or-death.

  First, we compute the expected utilities (EU) for both options.

  For EU, we use the standard formula:
  EU(A) = 0.2 * u(1000) + 0.5 * u(2000) + 0.3 * u(3000)
  Since u(x)=x, 
  EU(A) = 0.2*1000 + 0.5*2000 + 0.3*3000 = 200 + 1000 + 900 = 2100

  EU(B) = 0.2 * u(0) + 0.5 * u(3000) + 0.3 * u(3000) = 0.2*0 + (0.5+0.3)*3000 = 0 + 0.8*3000 = 2400

  So EU(B) = 2400 > EU(A)=2100. Therefore, EU theory recommends B.

  Now, we compute the risk-weighted expected utility (REU) for both options. We use the risk function r(p) = p^0.5 (square root). This function is convex, meaning the decision-maker is risk-averse.

  To compute REU, we must order the outcomes from worst to best.

  For Option A:
  Outcomes: $1000 (worst), $2000 (middle), $3000 (best)
  Probabilities: 
    - $1000: 0.2 (low state)
    - $2000: 0.5 (medium state)
    - $3000: 0.3 (high state)

  We assign cumulative probabilities for each outcome starting from the worst. The risk-weighted utility is computed as:
  REU(A) = u(worst) * r(prob(worst)) + 
            u(middle) * [r(prob(middle or worse)) - r(prob(worst))] +
            u(best) * [r(1) - r(prob(middle or worse))]

  But note: the cumulative probabilities are:
  - For the worst ($1000): cumulative probability = 0.2 (just the low state)
  - For the middle ($2000): cumulative probability = 0.2 (low) + 0.5 (medium) = 0.7
  - For the best ($3000): cumulative probability = 1.0

  So:
  REU(A) = 1000 * r(0.2) + 
            2000 * [r(0.7) - r(0.2)] + 
            3000 * [r(1) - r(0.7)]

  With r(p)=p^0.5:
  r(0.2) = sqrt(0.2) ≈ 0.4472
  r(0.7) = sqrt(0.7) ≈ 0.8367
  r(1) = 1

