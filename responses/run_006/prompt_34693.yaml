  First, I need to understand the core issues. The main conflict revolves around accountability: the lottocrat argues that random selection avoids donor capture, while the electoralist emphasizes the ability to vote officials out. There might be a verbal dispute here where "accountability" means different things to each side. I should dissect that term to clarify the disagreement.

  Next, I'll structure the document with numbered agreements. Both sides likely agree that current electoral systems have problems like polarization and corruption. They probably acknowledge that sortition offers descriptive representation and reduces elite capture, while elections provide accountability through voting and allow for expertise. Historical examples like Athens and Venice could be common ground.

  For disagreements, I'll create a table with precise statements from each side. Key areas include the definition of democratic legitimacy, accountability mechanisms, competence of citizens, vulnerability to corruption, and feasibility. Each point needs to be phrased neutrally so neither feels misrepresented.

  The cruxes are critical. These are sub-questions that, if answered, could shift someone's stance. For instance, whether descriptive representation ensures legitimacy or if electoral accountability is effective. Each crux needs a test both sides accept, like analyzing civic lottery outcomes or studying recall mechanisms. Predictions from each side will highlight their expectations.

  The accountability debate needs special attention. I'll break it into ex-ante (selection) versus ex-post (removal) accountability. This distinction might resolve the verbal dispute, showing they're emphasizing different phases.

  Finally, I'll note where my framing might be shaky. If evidence shows that sortition groups don't make competent decisions or that electoral accountability is stronger than assumed, I'd need to adjust. Also, real-world examples like Ireland's assemblies could challenge assumptions about feasibility.

