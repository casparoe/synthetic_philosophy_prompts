prompt: |-
  I teach an upper-level undergraduate seminar on social epistemology, about 15 students, and I have a 75-minute session coming up on the topic of epistemic dependence on AI systems and the erosion of understanding. I want an in-class activity that makes students experience — not just talk about — how outsourcing cognitive work to a reliable external system can degrade their own grasp of a domain, even when the system never gives wrong answers. The activity should have at least two distinct phases: an initial phase where students work through some kind of problem or task unaided, and a later phase where they have access to an "oracle" (played by you as the facilitator or by a confederate) that supplies correct answers on demand. By the end, students should notice that something has slipped — they understand less, or they've lost track of their reasons, or they can no longer perform the task they could perform before. The idea should hit them through what they do, not through a lecture. No upfront framing about AI or epistemic dependence; the debrief connects what happened to the philosophical terrain. Please provide: the rules and setup, materials needed, a timeline for the 75 minutes, a detailed debrief script or outline that maps moments in the activity onto specific philosophical concepts (e.g., extended cognition, cognitive outsourcing, understanding versus knowledge, the difference between relying on a tool and being unable to recover the skill), an honest note on what predictably goes wrong the first time I run it and how to handle it, and a candid account of which features of real-world epistemic dependence on AI the activity cannot reproduce and that I'll need to address separately. The answer should be in American English.
reasoning: |-
  We are designing an in-class activity for a 75-minute session on epistemic dependence and erosion of understanding. The goal is to have students experience how relying on an "oracle" (simulating AI) degrades their own grasp of a domain, even when the oracle is always correct.

  Activity: "The Map and the Oracle"

  **Concept**: Students will be given a map of a fictional city and a set of navigation tasks. In the first phase, they must plan routes without any aids. In the second phase, they can ask an oracle (the instructor or a confederate) for the optimal route between any two points. The catch: the oracle gives only the route steps (turn-by-turn) without any explanation or map reference. We expect that in the second phase, students will stop building a mental model of the city and instead just follow instructions, leading to a degradation in their ability to navigate without the oracle.

  **Materials**:
  1. A fictional city map (prepared in advance) with distinct landmarks, streets, and intersections. The map should be complex enough to require some thought but not overwhelming. Example: a grid with some diagonals and obstacles (like parks or rivers) that break the grid.
  2. Task sheets for two phases (Phase 1 and Phase 2). Each task is a set of point-to-point navigation problems (e.g., "Go from the Library to the Train Station").
  3. Answer sheets for students to write down their routes (for Phase 1) and to record the oracle's instructions (for Phase 2).
  4. A stopwatch or timer.

  **Setup**:
  - Prepare the map and task sheets. The map should be handed out to all students at the beginning.
  - The oracle (instructor or confederate) must have a complete set of optimal routes for every possible pair of points on the map (precomputed). The oracle will only give step-by-step instructions (e.g., "Start at A, go north 2 blocks, turn east, go 1 block, ...") without showing the map or explaining why.

  **Rules**:
  - Phase 1 (Unaided): Students work individually or in pairs (depending on class size) to solve 5 navigation tasks on the map. They write down the route they would take for each task. They are not allowed to consult with others (if working individually) or with other groups. Time: 20 minutes.
  - Phase 2 (Oracle-aided): Students are given 5 new navigation tasks (same map). This time, they can ask the oracle for the optimal route for any task. They can ask for one task at a time. The oracle only gives the step-by-step instructions. Students record the instructions. They are not allowed to use the map to plan, only to record the steps. Time: 15 minutes.
  - Phase 3 (Unexpected Test): Without warning, collect the maps and the oracle's instructions. Then, give students a new task: a navigation problem on the same map (but without the map). They must write down the route from memory. Time: 5 minutes.

  **Timeline (75 minutes total)**:
  - (0-5 min): Introduction to the activity without revealing the philosophical point. Distribute maps and Phase 1 task sheets. Explain: "You'll be solving navigation problems. In this first part, work on your own (or in pairs) to figure out the best route for each task. Write down the route step by step."
  - (5-25 min): Phase 1 - Unaided work (20 min). Walk around to monitor.
  - (25-30 min): Collect Phase 1 answers. Distribute Phase 2 task sheets. Introduce the oracle: "Now, for these next tasks, you have access to an oracle. You can ask me (or the confederate) for the best route for any task. I'll give you step-by-step instructions. Record them. You are not allowed to use the map to plan, only to record the steps given by the oracle." (Note: The map is still in their possession but they are instructed not to use it for planning, only as a reference to understand the steps if needed. However, in the unexpected test, we take the map away so they cannot use it at all.)
  - (30-45 min): Phase 2 - Oracle-aided work (15 min). The oracle gives instructions on request.
  - (45-50 min): Collect all materials (maps, task sheets, oracle instructions). Then, announce: "Now, without any materials, I want you to solve one more navigation task. Write down the route from memory." Hand out the Phase 3 task.
  - (50-55 min): Phase 3 - Unexpected Test (5 min). Students work individually.
  - (55-75 min): Debrief (20 min). Collect Phase 3 answers. Lead a discussion connecting the experience to the philosophical concepts.

  **Debrief Script/Outline**:

  Start by asking about their experience in Phase 3. Then, guide the discussion to the philosophical points.

  1. **Initial Reactions** (2 min):
     - "How did you feel when I took away the map and the oracle for the last task?"
     - "What was different about solving that last task compared to the first set?"

  2. **Contrasting Phases 1 and 2** (5 min):
     - "In Phase 1, when you were planning routes without help, what were you doing mentally? Did you notice yourself building a mental map? Did you have to reason about the city layout?"
     - "In Phase 2, when you had the oracle, what was your mental process like? Did you feel you were building the same kind of understanding? Why or why not?"

  3. **Key Philosophical Concepts** (10 min):
     - **Epistemic Dependence**: Point out that they became dependent on the oracle for answers. Ask: "Did you feel you needed the oracle in Phase 2? Why?"
     - **Erosion of Understanding**: Highlight that even though the oracle gave correct answers, their own ability to navigate degraded because they stopped building and maintaining a mental model. Connect to the idea that understanding requires a "grasp of explanatory relations" (as per epistemologists like Jonathan Kvanvig) and that by outsourcing the reasoning, they lost that grasp.
     - **Extended Cognition vs. Skill Atrophy**: Note that in Phase 1, they were using the map as a tool that extended their cognition (they built a mental model with it). In Phase 2, they used the oracle as a crutch that replaced their cognitive work. This led to skill atrophy for the task.
     - **Knowledge vs. Understanding**: They might have known the routes in Phase 2 (because they recorded them) but they didn't understand the city layout. So when the map was taken away, they couldn't reconstruct the route.

  4. **Connecting to AI** (3 min):
     - "How does this relate to using AI systems like GPS or ChatGPT? What happens when we rely on them for tasks we used to do ourselves? Does it matter that the AI is always correct?"

  5. **Wrap-up** (1 min):
     - Summarize: The activity shows that when we outsource cognitive work, we risk losing our own understanding and skills, even if the external system is perfectly reliable.

  **What Predictably Goes Wrong**:
  1. **Students might cheat in Phase 1**: If working in pairs, they might split tasks. If individuals, they might peek at others. Mitigation: Monitor and remind them to work independently.
  2. **Phase 2: Students might still use the map**: Even with instructions not to plan, they might look at the map. Mitigation: Stress that they are only to record the oracle's words. If they look at the map, it's okay because in the unexpected test they won't have it. But if they are building a mental model, that's what we want to see degrade.
  3. **Phase 3: Some students might do well**: They might have built a mental model in Phase 1 that lasts. That's okay! Use it to discuss individual differences and how prolonged outsourcing leads to erosion. Also, some might have memorized the oracle's instructions for a specific route, but the unexpected test is a new route. So design the unexpected task to require knowledge of the city layout (e.g., a route they haven't done before but that uses landmarks they encountered in both phases).
  4. **Time pressure**: The activity is tight. If Phase 1 runs over, cut it off at 20 minutes. Phase 2 must end on time to leave room for the test and debrief.

  **Limitations of the Activity**:
  1. **Real AI systems are more integrated and persistent**: In real life, we use AI over long periods, so the erosion is more gradual and profound. The activity is a one-time snapshot.
  2. **AI systems often provide explanations**: Modern AI sometimes gives reasons (though often shallow). Our oracle didn't, making the effect more pronounced. In reality, partial explanations might slow erosion but not prevent it.
  3. **The task is artificial**: Navigation is a specific skill. Epistemic dependence in other domains (like medical diagnosis or writing) might involve different cognitive processes.
  4. **No error feedback**: In the real world, AI systems do make mistakes, which can lead to a false sense of security. Our oracle was perfect, so we only saw the effect of outsourcing without the complication of errors.
  5. **Ethical and social dimensions**: The activity doesn't address issues of responsibility, bias, or social implications of epistemic dependence (e.g., when the AI is owned by corporations).

  **Addressing Limitations**:
  In the debrief, acknowledge these limitations. Then, in a follow-up lecture or discussion, you can extend the conversation to:
  - How long-term use of AI leads to deeper erosion.
  - The role of explanations in AI and whether they help maintain understanding.
  - Cases where AI errors have led to problems because users didn't have the understanding to catch them.
  - The ethical and societal implications (e.g., deskilling in professions, loss of human knowledge).

  This activity should create a memorable experience that sets the stage for deeper philosophical exploration.
answer: |-
  ### Activity Design: "The Cognitive Shortcut"  
  **Objective:** Students experience firsthand how relying on an infallible "oracle" (simulating AI) degrades their depth of understanding, even when answers are correct. The activity uses a logic puzzle to force cognitive outsourcing, followed by an unexpected test to reveal skill erosion.  

  ---

  ### **Rules and Setup**  
  **Materials Needed:**  
  1. **Phase 1 Task Sheets (Unaided):** Logic puzzles requiring multi-step deduction (e.g., "Who owns the zebra?"-style problems with 5 variables).  
     - *Example Puzzle:* "Five people live in five houses, each with a unique color, pet, job, and favorite drink. Use the clues to determine who has the dog. Clues: (1) The engineer lives in the blue house. (2) The teacher owns the cat. (3) ..." [Include 5–6 clues].  
  2. **Phase 2 Task Sheets (Oracle-Aided):** New puzzles of similar complexity but different variables (e.g., "Five athletes in different sports, with unique nationalities, medals, and diets").  
  3. **Oracle Response Cards (for instructor/confederate):** Pre-solved answers for Phase 2 puzzles (e.g., "The swimmer has the gold medal").  
  4. **Phase 3 "Surprise Test" Sheets:** A simplified version of the Phase 1 puzzle type but with one variable changed (e.g., "Who drives the electric car?" instead of "Who owns the dog?").  
  5. **Timers, whiteboard for debrief, and pens/paper.**  

  **Setup:**  
  - Arrange students in pairs to encourage discussion (easier to monitor than groups).  
  - **Oracle Role:** Played by you (the instructor) or a confederate. The oracle gives **only the final answer** (e.g., "The answer is Maria") when asked—**no explanations or steps**.  
  - **Distracter Task:** After Phase 2, have students do a 2-minute "buffer activity" (e.g., "Write three questions about today's reading") to clear working memory before the surprise test.  

  ---

  ### **Timeline (75 Minutes Total)**  
  | **Time** | **Phase** | **Instructor Actions** |  
  |----------|-----------|------------------------|  
  | 0–5 min  | Setup     | Distribute Phase 1 task sheets. Say: *"Solve this puzzle with your partner. Record your answer and the steps you took."* **Avoid framing the activity’s purpose.** |  
  | 5–25 min | Phase 1 (Unaided) | Circulate, observe, and note how students approach reasoning (e.g., sketching grids, debating clues). |  
  | 25–30 min | Transition | Collect Phase 1 sheets. Distribute Phase 2 sheets. Introduce the oracle: *"For this next puzzle, you may ask me for the correct answer at any time. I’ll give you only the final answer—no explanations."* |  
  | 30–45 min | Phase 2 (Oracle-Aided) | Act as oracle. Give **only** the answer when asked (e.g., "The answer is Alex"). Note if students request fewer answers than expected. |  
  | 45–47 min | Distracter Task | *"Before we discuss, write two questions about social epistemology."* (Collect Phase 2 sheets during this.) |  
  | 47–52 min | Phase 3 (Surprise Test) | Distribute Phase 3 sheets. Reveal: *"Solve this new puzzle individually—without your partner or the oracle."* (Use a simplified but related puzzle.) |  
  | 52–57 min | Collect & Transition | Collect Phase 3 sheets. Transition to debrief: *"Let’s discuss how that felt."* |  
  | 57–75 min | Debrief | Guide discussion using the script below. |  

  ---

  ### **Debrief Script & Philosophical Connections**  
  **Goal:** Help students connect their experience to epistemology. Start open-ended, then layer in theory.  

  #### **Step 1: Elicit Reactions (3 min)**  
  - *Ask:* "How did Phase 3 feel compared to Phase 1? Be honest—was it harder, easier, or different?"  
  - *Listen for:* Frustration, blankness, or comments like *"I forgot how to start"* or *"I relied on the oracle too much."*  
  - **Philosophical Hook:** Surface *phenomenological evidence* of understanding erosion (e.g., losing the "aha" moment of insight).  

  #### **Step 2: Contrast Unaided vs. Oracle-Aided Work (5 min)**  
  - *Ask:* "In Phase 1, how did you and your partner approach the puzzle? What mental steps did you take?"  
    - *Expected answers:* "We mapped clues," "We tried different combinations," "We argued over inferences."  
  - *Ask:* "In Phase 2, when you had the oracle, how did your process change?"  
    - *Expected answers:* "We asked for answers faster," "We didn’t bother with clues," "We just wrote down what you said."  
  - **Philosophical Connection:**  
    - **Cognitive Offloading:** Students replaced *deliberative reasoning* (building mental models) with *instrumental reliance* (using the oracle as a tool).  
    - **Understanding vs. Knowledge:** Phase 1 required *understanding* (grasping relationships between variables); Phase 2 gave *propositional knowledge* (facts without context).  

  #### **Step 3: Highlight the Erosion (5 min)**  
  - *Ask:* "Why was Phase 3 harder for some of you, even though it used the same skills as Phase 1?"  
    - *Probe:* "Did the oracle ‘save’ you time in Phase 2 but cost you something later?"  
  - **Philosophical Connection:**  
    - **Skill Atrophy:** Outsourcing cognition prevents *integrative practice*—students lose the ability to "recover" the skill independently (mirrors GPS navigation eroding spatial memory).  
    - **Epistemic Dependence:** They became *dependent* on the oracle for answers but *vulnerable* when it was removed (like depending on ChatGPT for writing).  

  #### **Step 4: Link to Social Epistemology (5 min)**  
  - *Ask:* "Was the oracle harmful if it always gave correct answers? Why or why not?"  
    - *Guide to:* "It degraded your *ability*, not the answer’s accuracy."  
  - **Philosophical Connection:**  
    - **Extended Cognition Debate:** Does the oracle extend the mind (à la Clark & Chalmers) or replace it? Here, it *supplanted* cognition because students didn’t integrate the tool into their reasoning.  
    - **Erosion of Understanding:** Philosopher Linda Zagzebski—understanding requires *internal coherence*; outsourcing breaks the chain of justification.  

  #### **Step 5: Bridge to AI (2 min)**  
  - *Pose:* "How might this relate to using AI in real life—like medical diagnosis apps, ChatGPT, or algorithm-driven news feeds?"  
  - *Conclude:* "Reliance isn’t inherently bad, but uncritical outsourcing risks: (1) losing skills, (2) not knowing when the system fails, and (3) eroded autonomy."  

  ---

  ### **What Predictably Goes Wrong (and How to Handle It)**  
  1. **Students Resist the Oracle:** Some pairs might solve Phase 2 unaided to "prove" self-reliance.  
     - *Fix:* Gently enforce oracle use: *"Remember, you can ask me—it might save time!"* If they refuse, note it for debrief: *"Did anyone avoid the oracle? Why?"*  
  2. **Phase 3 Backfires:** High-aptitude students may ace the surprise test, diluting the erosion narrative.  
     - *Fix:* In debrief, contrast their experience: *"Some of you breezed through—did you use the oracle less? What does that tell us about *intentional* vs. *passive* reliance?"*  
  3. **Debrief Stalls:** Students might not "feel" the erosion if the puzzle was too easy/hard.  
     - *Fix:* Pre-test puzzles for moderate difficulty. If energy lags, share anonymous Phase 3 results: *"75% of you took twice as long in Phase 3—why?"*  
  4. **Time Crunch:** Phase 2 might run long if students queue for oracle answers.  
     - *Fix:* Set a 1-minute per-request limit. Have a TA help if possible.  

  ---

  ### **What the Activity *Cannot* Reproduce (Address Separately)**  
  1. **Slow, Invisible Erosion:** Real AI dependence (e.g., spellcheck, search engines) degrades skills over *years*, not 20 minutes. Students might miss the long-term stakes.  
     - *Address Later:* Discuss studies like GPS reducing hippocampal activity (neuroscience) or deskilling in professions (e.g., pilots over-trusting autopilot).  
  2. **Complex Trust Dynamics:** Real AI makes errors, has biases, or manipulates (e.g., social media algorithms). The oracle was perfectly reliable, so students didn’t experience *misplaced* trust.  
     - *Address Later:* Use cases like medical AI misdiagnosis due to opaque "black box" reasoning.  
  3. **Social and Ethical Weight:** Real-world outsourcing affects equality (e.g., AI access disparities) and responsibility (e.g., who’s accountable for AI-driven decisions). The activity focuses on individual cognition.  
     - *Address Later:* Assign readings on Miranda Fricker’s *epistemic injustice* or AI ethics (e.g., Buolamwini’s work on bias).  

  ---

  ### **Instructor Notes**  
  - **Puzzle Design:** Use free online logic puzzle generators (e.g., PuzzleBaron) for Phases 1 and 2. Make Phase 3 *slightly* easier to ensure most students *could* solve it unaided—making their failure more jarring.  
  - **Confederate Tip:** If using a TA as the oracle, brief them to be neutral and robotic (e.g., no hints, flat tone).  
  - **Ethical Safeguards:** After debrief, validate frustration: *"This was designed to be disruptive—it’s not a test of your ability."*  
  - **Follow-Up:** In the next class, discuss real-world cases (e.g., airline accidents due to automation complacency) to cement concepts.  

  This activity creates visceral "aha" moments about epistemic dependence, priming students for deeper critique of AI in later seminars.
