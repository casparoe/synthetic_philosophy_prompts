prompt: |-
  I'm in my school's philosophy and economics club, and I'm leading a thirty-minute session next week on the dollar auction and escalation of commitment. The audience is about a dozen juniors and seniors; most have taken an intro econ or psych course. I already understand the material — what I need from you is a teaching plan. I want the exact sequence: what idea has to go first, what depends on what, and where the escalation-of-commitment generalization should be introduced relative to the auction itself. Pick one carrying example — the dollar auction or something else — and defend why that one rather than alternatives. Map out the misconceptions I should expect: the ones students will walk in with, the ones they'll form midway through, and the exact point in the sequence where I should head each off. Finally, give me one question to ask at the end that would tell me whether they understood the structure of the trap rather than just the anecdote. I want a committed answer: make definite choices and give your reasons, don't lay out options for me to pick from.
