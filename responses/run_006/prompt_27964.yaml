answer: |-
  Here’s a battle-tested teaching plan for your 30-minute session, prioritizing conceptual clarity and preempting misconceptions. I’ll use the **dollar auction** as the core example and defend this choice.

  **Core Pedagogical Strategy:** *Experience First, Explain Later.* Students feel the trap before analyzing it.

  **Sequence & Timing (Total: 30 min):**

  1.  **Hook & Sunk Cost Primer (5 min):**
      *   **Start:** "Raise your hand if you've ever finished a bad movie just because you paid for the ticket? Or kept eating mediocre food because you didn't want to 'waste' it?" (Acknowledge hands).
      *   **Concept:** "That feeling? It's called the **Sunk Cost Fallacy**. **Sunk costs** are past expenses – time, money, effort – that are *irrecoverable*. Rational decision-making says we should *ignore* sunk costs; only future costs and benefits matter. But our brains hate 'wasting' things, so we often throw good money after bad." *Why first?* Establishes the foundational psychological bias that fuels escalation. Without this, the auction seems purely irrational greed.

  2.  **The Dollar Auction DEMO (8 min):**
      *   **Setup:** "Let's play a quick game. I'm auctioning this $1 bill (hold it up). Rules: 1) Bids start at 5 cents. 2) Bids increase by 5-cent increments *minimum*. 3) **Crucially:** The *highest* bidder wins the dollar... **but the *second-highest* bidder also pays their last bid and gets nothing.**" Write rules clearly.
      *   **Conduct:** Start the auction briskly. *Be prepared:* Have a "plant" ready to bid early if needed (subtly!), but let real bids flow. Let it run until two students are clearly escalating past 50-60 cents. STOP before reaching $1. **Do NOT award the dollar yet.** *Why demo first?* Creates immediate, visceral engagement. Students *feel* the tension and irrationality before understanding it intellectually. This anchors the entire lesson.

  3.  **Analysis: Why Did *That* Happen? (7 min):**
      *   **Ask:** "What just happened? Why did [Bidder A] and [Bidder B] keep bidding even when the bids were getting close to $1?" (Elicit responses: "Didn't want to lose," "Already put money in," "Thought they could win").
      *   **Map the Trap (Diagram on Board):**
          1.  *Early Stage:* Rational competition for a prize (profit motive). Bidder A: 10c, Bidder B: 15c... both see potential profit.
          2.  *The Tipping Point (Highlight this!):* When the *losing* bidder faces a loss. E.g., Bidder A bids 40c, Bidder B bids 45c. Bidder A now faces: **Pay 40c & get nothing (LOSE $0.40)** OR **Bid 50c (maybe win $0.50 profit, maybe lose more)**.
          3.  *Escalation Phase:* Motivation shifts from **pursuing gain** to **avoiding loss**. The *already sunk* cost (the losing bid) creates intense pressure to bid again to avoid realizing that loss. The *winner* is also trapped, forced to keep bidding to protect their increasingly small potential profit (or avoid a loss if bid >$1).
      *   **Key Insight:** Introduce **Escalation of Commitment** HERE: "This is called **Escalation of Commitment**: The tendency to *increase* investment in a losing course of action because of the resources already committed (sunk costs), often driven by the desire to avoid admitting failure or realizing losses. The auction *structure* creates this trap systematically." *Why now?* Analysis immediately follows the shared experience. The concept ("Escalation of Commitment") is named *after* they've seen and partially explained the phenomenon using the sunk cost foundation.

  4.  **Generalization & Real-World Examples (5 min):**
      *   **Broaden:** "This isn't *just* a silly auction. Where else do we see this dynamic?"
      *   **Examples:**
          *   **Business:** A failing project gets more funding because "we've already spent $2 million." (Vietnam War, Concorde project, many startups).
          *   **Relationships:** Staying in an unhealthy relationship because "I've invested 5 years."
          *   **War:** Continuing a costly conflict to "justify the sacrifices already made."
          *   **Gambling:** Chasing losses ("I have to win my money back").
      *   **Connect:** "The core is the same: Sunk costs + the prospect of a salient, immediate loss if you quit + competitive or self-justifying pressures trap you into doubling down." *Why now?* Generalization follows naturally from analyzing the auction mechanics. The auction provides the clear structural model for understanding messier real-world cases.

  5.  **Mitigation & Discussion (4 min):**
      *   **Ask:** "So, how can we avoid these traps? What might break the cycle?" (Elicit: Pre-set limits, separating decision-makers from past investments, focusing on future costs/benefits only, normalizing "cutting losses").
      *   **Emphasize:** "Recognizing the *structural trap* is key. It's not just about individual stupidity; the system creates perverse incentives. Awareness and pre-commitment are crucial defenses."

  6.  **Final Check: The Understanding Question (1 min):**
      *   **Ask:** **"Imagine you're the *second-highest* bidder when the bid is at 95 cents. Explain *exactly* why it feels rational to bid $1.00 in that moment, even though you know the winner might outbid you and you'll lose even more."**
      *   *Why this question?* It forces them to articulate the *structural shift* in motivation (avoiding the 95c loss vs. pursuing a $1 gain) that is the hallmark of the escalation trap. A correct answer identifies the avoidance of the sunk loss as the driver, proving they grasp the core mechanism beyond just recalling the auction rules. Anecdotal understanding would just say "you don't want to lose your money" without pinpointing the *specific* loss-avoidance logic of the second-place position.

  **Why Dollar Auction Over Alternatives?**
  *   **Vietnam/Iraq Wars:** Powerful, but complex, political, emotionally charged, and lacks the immediate, clear-cut structure. Hard to isolate the economic/psych mechanism in 30 min.
  *   **Sunk Cost Fallacy Examples (Movie/Meal):** Too simple. They illustrate the bias but lack the **competitive/auction dynamics** and the **tragic structure** where one party's loss is locked in *before* the escalation truly begins. The dollar auction perfectly models the point-of-no-return dynamic.
  *   **Gambling:** Relevant, but often dismissed as "irrational addicts." The dollar auction feels more like a "rational" game initially, making the trap more surprising and instructive.
  *   **The Dollar Auction is Perfect:** Simple rules, immediate stakes ($1!), forces the structural trap (second-highest pays), creates visceral escalation quickly, clearly demonstrates the shift from profit-seeking to loss-avoidance, and is easily generalizable. It's the "fruit fly" of escalation studies.

  **Misconceptions to Head Off & When:**

  1.  **Pre-Demo (Sunk Cost):** **Misconception:** "Sunk costs *should* influence decisions because waste is bad." **Head Off:** During the Sunk Cost Primer (Step 1), explicitly state: "Economically, *only future costs and benefits matter*. The past investment is gone regardless. Chasing it is the fallacy." Use clear examples (movie ticket).
  2.  **Mid-Demo (Auction Blame):** **Misconception:** "The bidders are just stupid/greedy." **Head Off:** Right after stopping the auction (Step 3), when asking "why?", guide them towards the *structure* ("What does the rule about the *second-highest* bidder force them to consider?") before letting them blame the individuals. Emphasize the *rationality* of loss-avoidance in the moment.
  3.  **Post-Analysis (Escalation = Always Irrational):** **Misconception:** "Escalation is always dumb; just quit early." **Head Off:** During Generalization (Step 4), acknowledge: "Sometimes persistence *is* rational (new info, changing conditions). Escalation is specifically about *increasing* commitment *despite* clear negative prospects *because* of sunk costs and loss aversion. It's about the *why*, not just the act of continuing." Contrast with rational persistence.
  4.  **Post-Generalization (Only About Money):** **Misconception:** "This only applies to financial bids." **Head Off:** When giving real-world examples (Step 4), *emphasize* non-monetary sunk costs (time, effort, reputation, lives) and losses (embarrassment, failure, wasted effort).

  **Key Delivery Tips:**
  *   **Pace:** Be strict on timing. Demo and Analysis are critical.
  *   **Energy:** Bring enthusiasm to the auction and the analysis.
  *   **Board Use:** Diagram the auction trap clearly during Step 3.
  *   **Plant:** Have a reliable student agree beforehand to bid early/mid to ensure the trap springs.
  *   **Handout?** Consider a simple half-sheet with rules & key definitions *after* the demo to avoid spoilers.

  This sequence builds logically: Foundational Bias -> Experiential Demonstration -> Mechanistic Analysis -> Conceptual Generalization -> Real-World Application -> Mitigation Strategies, with misconceptions tackled at the precise point they are likely to arise. The final question directly probes structural understanding. Good luck!
