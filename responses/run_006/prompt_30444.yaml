prompt: |-
  I chair the Rules Committee of a university faculty senate. Each spring the senate elects a six-member executive committee, and when more than two candidates stand for a seat the current rule is a plurality vote with a runoff if no candidate reaches forty percent. The committee agrees this rule has to go, but we are split three ways. One faction wants instant-runoff voting, on the ground that it uses the full ranking and guarantees a majority winner; a second wants approval voting, on the ground that it is simple, cheap, and less likely to encourage tactical voting than ranked methods; a third wants a Condorcet method — ranked ballots, electing whichever candidate beats each rival in head-to-head comparisons — on the ground that it best captures majority preference. A senior colleague keeps invoking the Gibbard–Satterthwaite theorem to short-circuit the debate: under the standard assumptions, with three or more candidates, voters free to hold any complete ranking, no dictator, and no candidate excluded in advance, no rule that turns those rankings into a single winner is strategy-proof, so every ranked method on the table can be gamed. The approval-voting faction replies that the theorem is stated for rules defined on complete ranked preferences, and approval voting asks voters a different kind of question, so the theorem does not settle its status — though they grant that approval voting, too, can be manipulated in some scenarios.

  Please draft the short decision memo I will circulate before our next meeting. It should recommend one concrete voting rule for multi-candidate senate elections, with enough detail about the ballot and the counting procedure that the senate office could implement it, and it should explain what the Gibbard–Satterthwaite theorem does and does not imply for our choice. I want the memo to treat the strongest consideration against the recommended rule as a serious one: if the recommendation is to stop treating strategy-proofness as the decisive criterion, say why the appeal to the theorem is not merely a technicality and then why it should not carry the day. The bottom line should be a rule the committee could adopt, not a survey of options.
reasoning: |-
  We are recommending approval voting. 

  Memo Draft:

  **To:** Rules Committee Members  
  **From:** Chair, Rules Committee  
  **Subject:** Recommendation for a New Voting Rule for Senate Executive Committee Elections  

  At our last meeting, we discussed replacing the current plurality-with-runoff rule for electing the six-member executive committee. After careful consideration of the options (instant-runoff voting, approval voting, and Condorcet methods) and the implications of the Gibbard–Satterthwaite theorem, I recommend that we adopt **approval voting** as our new voting rule. 

  ### The Recommended Rule: Approval Voting

  **Ballot:**  
  The ballot will list all candidates for the executive committee. Each voter may vote for (i.e., "approve") as many candidates as they wish. There is no ranking. A voter may choose to approve only one candidate, several, or none. 

  **Counting Procedure:**  
  - Each approval vote counts as one vote for the candidate.  
  - The candidates are ranked from highest to lowest based on the total number of approval votes they receive.  
  - The six candidates with the highest approval totals are elected.  
  - In the event of a tie for the sixth position, the tie will be broken by a random method (e.g., drawing lots). 

  This rule is simple: voters mark the candidates they find acceptable, and the six with the most approvals win. It does not require multiple rounds of voting (as in the current system) or complex counting (as in ranked methods). 

  ### Gibbard–Satterthwaite Theorem: What It Does and Does Not Say

  Our senior colleague has rightly pointed out the Gibbard–Satterthwaite (GS) theorem, which states that no voting system that asks voters for a complete ranking of candidates and selects a single winner (under the standard assumptions) is immune to strategic voting. That is, in any such system, there are scenarios where a voter can achieve a better outcome by misrepresenting their true preferences. This applies to both instant-runoff and Condorcet methods because they rely on ranked ballots. 

  However, the GS theorem does not directly apply to approval voting because approval voting does not ask for a complete ranking. Instead, it asks voters to divide the candidates into two groups: approved and not approved. Therefore, the theorem does not automatically extend to approval voting. 

  That said, approval voting is not immune to strategic voting. For example, a voter might choose to approve a candidate they moderately like but not a candidate they strongly like if they believe the latter is safe and they want to help a marginal candidate. However, the strategic considerations in approval voting are typically simpler and less severe than in ranked systems. Moreover, the simplicity of the ballot and the counting process reduces the opportunity and incentive for manipulation. 

  ### Why Approval Voting?

  We recommend approval voting for the following reasons:  
  1. **Simplicity and Cost:** The ballot is easy to understand and mark, and the counting is a straightforward tally. This reduces errors and speeds up the process.  
  2. **Reduced Incentive for Tactical Voting:** While no system is perfectly strategy-proof, approval voting is less vulnerable to complex strategic voting than ranked methods. Voters can express support for multiple candidates without worrying about vote-splitting or the intricacies of ranking.  
  3. **Guarantee of Sincere Voting in Key Cases:** A voter can always sincerely approve all candidates they truly prefer without fear of harming their preferred candidates (as long as they do not approve candidates they dislike). This is not always true in ranked systems.  
  4. **Better Representation:** Approval voting tends to elect candidates who are broadly acceptable rather than those with intense support from a minority. This is desirable for a committee that should represent the whole faculty.  

  ### Addressing the Strongest Objection

  The strongest objection to approval voting is that it does not allow voters to express the intensity of their preferences (e.g., a voter cannot distinguish between a strong favorite and a marginally acceptable candidate). This is a valid concern. However, we believe that in the context of electing a committee of six, the goal is to find broadly acceptable representatives. Approval voting achieves this by letting voters indicate all candidates they consider acceptable. Moreover, the simplicity and transparency of approval voting outweigh the theoretical benefits of more complex systems that are also vulnerable to manipulation and might confuse voters. 

  ### Why the Gibbard–Satterthwaite Theorem Does Not Carry the Day

  The GS theorem is a profound result, but it should not paralyze our decision. It tells us that no ranked system is perfect. However, we must choose a practical system that works for our faculty. The theorem does not say that all systems are equally manipulable; it only says that no ranked system is immune. Approval voting, by using a different ballot format, falls outside the theorem’s scope and, in practice, has shown less susceptibility to manipulation. 

  Moreover, the current system (plurality with runoff) is also vulnerable to strategic voting (e.g., vote-splitting in the first round). Approval voting is an improvement because it eliminates the spoiler effect and allows voters to support multiple candidates without penalty. 

  ### Conclusion

  I propose that we adopt approval voting for the election of the executive committee. This method is simple, efficient, and less prone to manipulation than the alternatives. It will be easy to implement and explain to the faculty. 

  We will vote on this recommendation at our next meeting. Please come prepared to discuss and, if necessary, amend this proposal. 

  Attached: A sample approval voting ballot for the executive committee election.
answer: |-
  **To:** Rules Committee Members  
  **From:** Chair, Rules Committee  
  **Subject:** Recommendation for New Executive Committee Voting Rule  

  After thorough deliberation, I recommend adopting **approval voting** for the election of the senate executive committee. This memo details the proposed rule, addresses the Gibbard–Satterthwaite theorem’s implications, and explains why approval voting best balances fairness, simplicity, and practicality for our context.  

  ### Proposed Voting Rule: Approval Voting  
  **Ballot Format:**  
  - Voters receive a ballot listing all candidates.  
  - Voters may select (i.e., "approve") **any number of candidates** they find acceptable. There is no ranking, minimum, or maximum.  
  - Example: In a race with 10 candidates, a voter may approve 0, 1, 6, or all 10.  

  **Counting Procedure:**  
  1. Tally all approval votes for each candidate.  
  2. The **six candidates with the highest approval totals** are elected.  
  3. **Tiebreaking:** If a tie affects the sixth seat, the tie is resolved by a runoff election between the tied candidates. If the tie persists, a random draw (e.g., lottery) applies.  

  **Implementation Notes:**  
  - Ballots can be counted electronically (via existing senate voting systems) or manually.  
  - No runoff rounds are needed. Results are final after one ballot.  

  ### Why Approval Voting?  
  1. **Simplicity and Accessibility:**  
     - Voters easily understand "vote for all acceptable candidates." Ballots are intuitive and reduce voter errors.  
     - Counting is transparent and efficient—no complex algorithms or iterative rounds.  

  2. **Reduced Strategic Incentives:**  
     - Unlike ranked methods, approval voting minimizes "vote-splitting" (e.g., similar candidates cannibalizing each other’s support).  
     - Voters can support both a preferred long-shot and a viable candidate without penalty, encouraging sincere expression.  

  3. **Practical Benefits for Committee Elections:**  
     - Electing six winners aligns with approval voting’s strength in multi-seat races: it identifies broadly acceptable candidates, fostering a committee with wide legitimacy.  
     - Eliminates low-turnout runoffs and reduces costs.  

  ### Addressing the Gibbard–Satterthwaite Theorem  
  The Gibbard–Satterthwaite (GS) theorem proves that **no ranked voting method** (e.g., instant-runoff or Condorcet) can be fully strategy-proof when three or more candidates compete. It assumes voters submit complete rankings, and any rule satisfying minimal fairness criteria *must* allow scenarios where voters gain by misrepresenting preferences.  

  **What GS Does Not Imply:**  
  - **It does not apply to approval voting.** GS assumes ranked preferences, while approval voting uses a binary "approve/not approve" ballot. Thus, GS does not condemn approval voting.  
  - **It does not mean all methods are equally manipulable.** Some systems are *more resistant* to strategy in practice. Approval voting’s simplicity reduces opportunities for complex taktics (e.g., burying or compressing rankings), and empirical studies show voters often vote sincerely.  

  **Why GS Should Not Carry the Day:**  
  While GS is a vital theoretical caution—reminding us that no system is perfect—it should not paralyze reform. The theorem’s assumptions (e.g., complete rankings) do not reflect real-world voter behavior. In practice:  
  - **Ranked methods are uniquely vulnerable to GS-type manipulation:** Voters must navigate complex incentives (e.g., in instant-runoff, ranking a second choice too high might help defeat a first choice).  
  - **Approval voting’s flaws are less severe:** Strategic voting (e.g., approving a "lesser evil" but not a favorite to boost a marginal candidate) is rare in low-stakes elections like ours and is easier for voters to intuit.  
  - **Status quo comparison:** Our current plurality-runoff system is *highly* manipulable (e.g., vote-splitting forces runoffs). Approval voting is a strict upgrade.  

  ### Addressing the Strongest Objection  
  **Objection:** *Approval voting fails to capture preference intensity (e.g., a voter cannot distinguish a top choice from a marginal compromise).*  
  This is valid—ranked methods excel here. However, **intensity is secondary to broad acceptability** in a committee election. Our goal is a diverse, consensus-driven body, not a single "most intense" winner. Approval voting ensures elected candidates have wide support, reducing polarization. Further, adding rankings would reintroduce GS vulnerabilities and complexity, undermining our aim for a robust, implementable system.  

  ### Conclusion  
  Approval voting offers the best compromise: it is simple, efficient, hard to manipulate at scale, and tailored for multi-seat elections. The Gibbard–Satterthwaite theorem, while theoretically significant, does not invalidate approval voting and should not overshadow its practical advantages. I move that we adopt approval voting for the 2025 executive committee election.  

  **Next Steps:**  
  Vote on this recommendation at our next meeting. If adopted, we will draft formal bylaws and educate the senate.  

  Attached: Sample approval voting ballot and tally report.  

