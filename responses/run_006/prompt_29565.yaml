  We are given the absent-minded driver problem and an argument that seems to show that the rational plan (p=2/3) is abandoned when the driver is at an intersection. The argument concludes that the driver, at the moment of decision, will exit at the first intersection (getting 0) because he assigns 1/2 to being at X and 1/2 to being at Y, and then finds that exiting gives 2 in expectation while continuing gives 1.5.

  But we know that the plan p=2/3 is optimal from the ex-ante perspective (expected utility 4/3). The problem is that the driver's reasoning at the intersection leads him to deviate, and if he always deviates, he gets 0, which is worse.

  The challenge is to find the flaw in the reasoning.

  Let me break down the argument step by step and see where it goes wrong.

  Step (4) is critical: the driver assigns probability 1/2 to being at X and 1/2 to being at Y. This is because he has no information to distinguish the two. However, this assignment does not take into account the fact that his own strategy affects the probability of being at X versus Y.

  In fact, the probability that he is at a particular intersection is influenced by his strategy. Specifically, the chance that he is at X is higher than the chance that he is at Y because he starts at X and might have exited at X. Moreover, the chance that he is at Y is conditional on having passed X without exiting.

  Therefore, the 1/2-1/2 assignment is incorrect because it ignores the causal structure and the strategy.

  But note: the driver has imperfect recall. He doesn't remember if he has passed an exit. So when he is at an intersection, he must condition on the fact that he is at an intersection, but without knowing which one.

