  Continue: (4 - 2*(2/3)) / (5/3) = (4 - 4/3) / (5/3) = (12/3 - 4/3) = 8/3 divided by 5/3 = 8/3 * 3/5 = 8/5 = 1.6

  So at p=2/3, the expected payoff of exiting and continuing are equal: both 1.6.

  Therefore, the driver is indifferent between exiting and continuing. So he has no incentive to deviate from the plan of continuing with probability p=2/3. He can randomize as planned.

  Moreover, note that if p were less than 2/3, then:

  Compare 4p and 4-2p: if p < 2/3, then 4p < 4-2p, so continuing would be better.

  If p > 2/3, then 4p > 4-2p, so exiting would be better.

  But at p=2/3, they are equal.

  So the plan p=2/3 is stable: when the driver is at an intersection and believes he is at X with probability 1/(1+p) and at Y with probability p/(1+p), then he is indifferent and will follow the plan.

  Therefore, the flaw in the original argument was in step (4): the driver should not assign 1/2 to being at X and 1/2 to being at Y. Instead, the assignment depends on the strategy p.

  This resolves the time-inconsistency.

  But now, what is the cost? The driver must have self-locating beliefs that depend on his own strategy. This may seem circular: to choose a strategy, we need to know the beliefs, and the beliefs depend on the strategy.

  However, in equilibrium, we can solve for a fixed point.

