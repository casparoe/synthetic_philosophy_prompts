  I'm in a graduate philosophy of language seminar, and "meaning ain't in the head" gets used to shut down arguments so often that I've started to suspect it's doing several different jobs at once. Last week someone raised a question about whether a brain in a vat — a perfect molecule-for-molecule duplicate of you, envatted — could use the word "water" to mean water, or mean anything at all. The response was "well, meaning ain't in the head," and the discussion moved on. But I'm not convinced that slogan by itself settles the question, and I doubt everyone who nods along is agreeing on the same claim. I want to sort out what precise theses that sentence could be expressing, from the narrowest reading (something about natural kind terms and their extensions) to the most radical (something about whether there are any mental states at all whose content is independent of the external world). For each reading, I want to know whether it's plausible, whether it's trivially true or substantively controversial, and whether it would actually support dismissing the brain-in-a-vat question the way it was used. Please write it as continuous prose — no headings, no bullet points, no bold, no tables — the way you'd write a long email.
