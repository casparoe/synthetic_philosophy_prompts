answer: |-
  ## Everett's Burden

  When Schrödinger's equation holds sole sway,
  And wavefunctions, unmarred, unfurl and churn,
  No mystic collapse to sweep away
  The worlds that from a single vector spurn—
  But spread with decoherence, clear and bright,
  Each branch a history the quantum weaves,
  No measurement postulate, tacked-on slight,
  Just unitary law the cosmos cleaves.

  **Yet turn:** if *every* branch is actual fact,
  A concrete realm where conscious copies dwell,
  Why heed the amplitude-squared contract?
  Why should this splitting agent care to tell
  That *this* path holds more weight within the math,
  Not just count branches on the branching path?

  **Thus hangs the weight: impose Born's rule outright,**
  **A graft upon the tree that feels unsound,**
  **Or seek in choice a grounding for the right—**
  **But risk the norm you seek is what you've found.**

  ---

  **Notes for the Philosopher of Physics:**

  *   **Octave:** Celebrates MWI's core virtues: pure unitary evolution ("Schrödinger's equation holds sole sway"), the branching metaphor ("worlds that from a single vector spurn"), the role of decoherence ("spread with decoherence, clear and bright"), and the elimination of the measurement postulate ("No measurement postulate, tacked-on slight" / "Just unitary law the cosmos cleaves").
  *   **Volta (Line 9 - "Yet turn"):** Introduces the problem. If all branches are equally real ("*every* branch is actual fact"), the *meaning* of probability derived from the Born rule ("amplitude-squared contract") is challenged. Why should a rational agent ("this splitting agent") care about the amplitude measure instead of simply counting equally real outcomes ("count branches")?
  *   **Sestet (Lines 10-14):** Develops the dilemma. The agent faces distinct futures ("concrete realm where conscious copies dwell"), making the relevance of the Born rule for *pre-branching* subjective anticipation the core issue ("Why should this splitting agent care to tell / That *this* path holds more weight within the math?").
  *   **Couplet:** Precisely states the horns of the dilemma:
      1.  **"Impose Born's rule outright":** Treating the probability measure as a brute, primitive postulate ("A graft upon the tree") that conflicts with MWI's otherwise parsimonious ontology ("feels unsound").
      2.  **"Seek in choice a grounding for the right":** Attempting a decision-theoretic derivation (e.g., Deutsch/Wallace approach) to justify caring about the Born rule.
      3.  **"But risk the norm you seek is what you've found":** Highlights the circularity worry – that such derivations may implicitly *presuppose* the validity of the Born rule norm they aim to derive ("grounding for the right").
