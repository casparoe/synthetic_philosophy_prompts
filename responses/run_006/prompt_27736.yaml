prompt: |-
  You're an applied mathematician who works on deterministic chaos and has also had to write operational guidance for forecasters who don't have time for theory. Think carefully, and before you commit to a procedure, brainstorm the distinct ways a deterministic forecast can go wrong and what each one implies about whether it's responsible to issue a single number.

  I'm a senior hydrologist at a regional flood forecasting agency. We run deterministic rainfall–runoff and river-routing models to produce water-level forecasts, and we're under constant pressure from emergency managers to put one number on things: "where will the river crest?" But the models, while deterministic, are chaotic in practice. Tiny differences in the initial soil-moisture state or in rainfall estimates — well within measurement error — produce completely different forecasts by day 3 or 4, and sometimes the spread collapses again. I suspect there's a principled distinction between the timescale where a single deterministic forecast is meaningful and the timescale where we should be issuing ranges, ensembles, or scenario-based guidance, and that it has something to do with Lyapunov times and predictability horizons. But I've never seen that turned into something a duty forecaster could actually run at 2 a.m.

  Please write me a decision procedure my forecasters can run each time a forecast request comes in. It should be a checklist: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says "do not issue a single number," and where it hands the decision to a person because the call is about values (say, an acceptable false-alarm rate) rather than dynamics. The constraints: one forecaster on duty, about twenty minutes per request, no time to spin up a new ensemble from scratch, and we may not have a computed Lyapunov exponent or a decent estimate of model structural error for our particular catchment. Say what to do when those numbers arent available, and be honest about which steps are judgement calls dressed up as procedure. Then run the procedure on three cases: a 36-hour crest forecast for a town during an ongoing storm; a 7-day inflow outlook for a drought-stricken reservoir where the water manager wants a single volume for release planning; and a 30-day seasonal water-supply outlook. I expect at least one of these to come out as an answer we won't like — probably the 7-day one — so dont soften it. End with a short note on what the procedure cannot settle and where it will misfire.

  Make the very last line a one-sentence summary of the procedure, beginning with "Summary:".
reasoning: |-
  We are designing a decision procedure for hydrologists to decide when to issue a single number (deterministic forecast) and when to issue a range, ensemble, or scenario-based guidance. The key is to assess the predictability horizon of the system given the current conditions and the forecast lead time. The procedure must be practical, requiring about 20 minutes, and account for the absence of computed Lyapunov exponents or model structural error estimates.

  Key factors to consider:
  1. **Lead time**: The forecast horizon (e.g., 36 hours, 7 days, 30 days).
  2. **System state**: Current soil moisture, river levels, and recent rainfall (which affect the initial condition sensitivity).
  3. **Atmospheric forcing uncertainty**: Especially for rainfall, which is a major driver and has inherent uncertainty.
  4. **Model predictability**: How fast do small errors grow? This is related to the Lyapunov exponent, but we may not have it precomputed.

  We'll break the procedure into a checklist of questions. The forecaster must answer them in order. At any point where the answer indicates high uncertainty beyond a threshold, we stop and recommend against a single number.

  **Checklist Procedure:**

  1. **What is the forecast lead time?**
     - If lead time ≤ T1 (a pre-determined threshold for high confidence, e.g., 24-48 hours), proceed to step 2.
     - If lead time > T2 (a pre-determined threshold for low confidence, e.g., 5-7 days), skip to step 5 (or later steps) to assess if there are mitigating factors.
     - Default thresholds (adjust based on your basin's typical behavior):
          T1 = 36 hours (for high confidence)
          T2 = 4 days (beyond which we start to worry)
     - *Note: These thresholds are basin-specific and should be set by experience. If not set, use 36 hours for T1 and 4 days for T2 as starting points.*

  2. **Is the system in a quiescent state?**
     - Check: current river levels are well below flood stage, no significant rainfall in the past 72 hours, and soil moisture is near normal (or below). 
     - If yes, even at longer leads (up to T2) the system might be predictable. Proceed to step 3.
     - If no (i.e., active storm, high river levels, saturated soils), then even at shorter leads (like 36 hours) we may have high uncertainty. Proceed to step 4.

  3. **Is the forecast driven by a well-predicted atmospheric event?**
     - For lead times beyond T1 but within T2, check the confidence in the rainfall forecast.
     - Use available ensemble precipitation forecasts (if not available, use forecaster judgment on model consensus and recent performance).
     - If the precipitation forecast is highly certain (e.g., a stable, large-scale system with high model agreement and low spread in ensembles), then a deterministic forecast may be acceptable. Proceed to step 6.
     - If uncertain, go to step 5.

  4. **Assess initial condition uncertainty.**
     - How sensitive is the model to initial soil moisture and river states? 
     - If initial condition errors (say, in soil moisture) are known to cause large divergence in the model within the lead time, then we must account for it.
     - How to assess without Lyapunov exponent? Use:
          - Past events: In similar conditions, did small changes in initial state lead to large forecast differences?
          - Quick sensitivity test: If time allows, run two additional model runs: one with soil moisture increased by 10% and one decreased by 10% (or within measurement error bounds). If the difference in the forecast crest is more than a tolerance (e.g., 0.5 feet or 10% of the expected crest), then initial condition uncertainty is too high. Then go to step 5.
          - If no time for tests, and the system is active (step 2: no), then assume high sensitivity and go to step 5.

  5. **Assess predictability horizon.**
     - We are here because either the lead time is long (beyond T2) or the system is active and sensitive.
     - Without a Lyapunov exponent, we use heuristics:
          - In active systems, the predictability horizon is often shorter. A rule of thumb: if the lead time is beyond the typical time it takes for the system to show divergence (e.g., 3-4 days in many basins), then we avoid a single number.
          - Check if the forecast is near a bifurcation point (e.g., the crest might be near flood stage, or the system is near saturation). If so, predictability is lower.
     - If the lead time is beyond the typical predictability horizon (say 4 days) and the system is active, then do not issue a single number. Issue a range or scenario-based forecast.
     - If the lead time is within the typical predictability horizon but the system is highly sensitive (from step 4), then also avoid a single number.

  6. **Is model structural error a major factor?**
     - Even if the system is predictable in the chaotic sense, model structural errors (e.g., in routing, infiltration) might cause systematic biases. 
     - Without a good estimate, use historical performance: in similar conditions, what was the mean absolute error (MAE) or root mean square error (RMSE) of the model? 
     - If the expected error (from past events) is above an acceptable threshold (e.g., 1 foot for flood stage, or 10% for reservoir inflow), then issue a range (e.g., deterministic forecast ± expected error) and note the uncertainty.

  7. **Final decision point:**
     - If you have passed steps 1-6 and still consider a single number, then it may be acceptable. But note that even then, a range might be more informative.
     - If at any step the uncertainty is too high, then do not issue a single number. Instead, issue:
          - A range (based on sensitivity tests or historical error).
          - Scenario-based: e.g., "If rainfall is X, then crest Y; if rainfall is Z, then crest W."
          - Or, if an ensemble is available (even if not spun up fresh, perhaps a pre-existing one), use the ensemble spread.

  **Where the call is about values (e.g., acceptable risk):**
  - The procedure above stops at step 5 or 6 and says "do not issue a single number" when the uncertainty is too high. However, emergency managers might have a risk tolerance. This is a judgment call for the senior hydrologist or the duty forecaster in consultation. The procedure flags the uncertainty, but the decision to issue a single number under high uncertainty (with a warning) is a value-based decision. The procedure should note: "Uncertainty exceeds thresholds, but if emergency managers require a single number for action, issue with explicit caveats and consider the worst-case scenario."

  **Running the procedure on three cases:**

  **Case 1: 36-hour crest forecast for a town during an ongoing storm.**
  1. Lead time: 36 hours (within T1=36 hours) -> proceed.
  2. System state: Ongoing storm -> not quiescent -> go to step 4.
  3. (Skip step 3 because we went to 4)
  4. Assess initial condition uncertainty: 
     - In an ongoing storm, soil moisture is likely high and the system is sensitive. 
     - Without time for tests, assume high sensitivity. 
     - Also, rainfall uncertainty is critical. Check: current storm has high rainfall uncertainty? If yes, then proceed to step 5.
  5. Predictability horizon: 36 hours is within the typical 4-day horizon, but the active storm and high sensitivity might reduce it. However, 36 hours is short. 
     - Heuristic: in many basins, 36 hours is manageable. But if the storm is complex (e.g., convective) and rainfall uncertainty is high, then we avoid a single number. 
     - If the forecaster has a high-confidence quantitative precipitation forecast (QPF), then a deterministic forecast with a range (due to initial conditions) might be acceptable. Otherwise, issue a range.
     - **Decision**: If QPF is confident, issue a single number with a note of uncertainty (e.g., "Crest expected at 24.5 feet ± 0.5 feet due to initial state uncertainty"). If QPF is uncertain, issue a range (e.g., 24-26 feet) or scenarios.

  **Case 2: 7-day inflow outlook for a drought-stricken reservoir.**
  1. Lead time: 7 days (> T2=4 days) -> go to step 5 (skip steps 2-4 for now, but we might come back).
  5. Predictability horizon: 7 days is beyond the typical 4-day horizon. 
     - Also, the system is drought-stricken: 
          - Step 2: Quiescent state? Yes, because drought means low soil moisture and no recent rain. 
          - However, step 3: Is the forecast driven by a well-predicted event? 
              - For 7 days, atmospheric forecasts are highly uncertain. Without a confident QPF, we cannot rely on a deterministic forecast. 
          - Step 4: Initial condition uncertainty? In drought, the model might be less sensitive to initial soil moisture (because soils are dry and infiltration is less variable). But the main uncertainty is the rainfall. 
     - Therefore, the rainfall uncertainty dominates. 
     - **Decision**: Do not issue a single number. The 7-day lead time and high uncertainty in rainfall make a deterministic forecast unreliable. Issue a range (using ensemble precipitation forecasts if available) or scenario-based guidance (e.g., dry, median, wet scenarios).

  **Case 3: 30-day seasonal water-supply outlook.**
  1. Lead time: 30 days (far beyond T2) -> go to step 5.
  5. Predictability horizon: Beyond any reasonable deterministic horizon. 
     - However, seasonal outlooks are inherently probabilistic. 
     - Even if the system is quiescent (step 2: yes, because drought) and initial condition uncertainty might be low (step 4: low sensitivity in dry conditions), the atmospheric forcing over 30 days is unpredictable deterministically. 
     - **Decision**: Do not issue a single number. Use a probabilistic forecast (e.g., from a seasonal climate model ensemble) and issue a range (e.g., 50% chance of inflow between X and Y).

  **What the procedure cannot settle and where it will misfire:**
  - The procedure relies on thresholds (T1, T2) and heuristics that are basin-specific and may not capture rare events or nonlinear thresholds (e.g., when a small change causes a levee breach).
  - Without Lyapunov exponents, we use rules of thumb that might be inaccurate for a particular basin.
  - The procedure cannot account for unknown model structural errors that might become significant in new conditions.
  - It may misfire in rapidly changing situations (e.g., a sudden shift in weather patterns) or when the system is near a critical threshold (like flood stage) where small errors have large consequences.
  - The value-based decisions (e.g., if emergency managers insist on a single number despite high uncertainty) are left to the forecaster's judgment and risk communication skills.

  **Summary:** A deterministic forecast may be issued only if the lead time is short and the system is quiescent with low initial condition and forcing uncertainty; otherwise, issue ranges, scenarios, or probabilistic guidance.
answer: |-
  ### Decision Procedure for Issuing Deterministic River Forecasts  
  **Goal:** Determine when a single-number forecast is justifiable vs. when ranges/ensembles are required, based on predictability limits. Use available data within 20 mins.  

  ---

  ### Checklist: Questions, Thresholds, and Exit Rules  
  *Run in order. Stop if any step fails.*  

  1. **What is the lead time?**  
     - *Ask:* Time until forecasted event (e.g., crest, inflow).  
     - **Sufficient answer:** Exact hours/days.  
     - **Thresholds:**  
       - ≤ 48 hours: Proceed to Q2.  
       - > 48 hours but ≤ 4 days: Proceed to Q3.  
       - > 4 days: Skip to Q5 (high uncertainty likely).  
     - *Exit rule:* If lead time > 4 days, **do not issue a single number** (go to Q5).  

  2. **Is the system quiescent?**  
     - *Ask:* Is current river level < 80% of flood stage? AND no rainfall past 72 hours? AND soil moisture < 90% saturation?  
     - **Sufficient answer:** Yes/no based on real-time gauges and soil sensors.  
     - **Threshold:**  
       - Yes: Proceed to Q4.  
       - No: Proceed to Q3.  
     - *Judgement call:* "Quiescent" thresholds are basin-specific (adjust during onboarding).  

  3. **Is rainfall forcing predictable?**  
     - *Ask:* Does the precipitation forecast show high confidence?  
     - **Sufficient answer:**  
       - High confidence: Ensemble precipitation spread < 20% of mean and aligned with nowcast.  
       - Low confidence: Spread ≥ 20% or models disagree.  
     - **Threshold:**  
       - High confidence: Proceed to Q4.  
       - Low confidence: **Do not issue a single number** (issue scenarios/range).  
     - *Fallback without ensembles:* Use forecaster judgment on model consensus (NWP alerts, satellite trends).  

  4. **Is initial condition uncertainty controlled?**  
     - *Ask:* Could small errors in soil moisture/river state (< 5% change) alter the forecast beyond tolerance?  
     - **Sufficient answer:**  
       - Run two sensitivity tests:  
         - Base run: Current best estimate.  
         - Perturbed run: ±5% soil moisture or ±0.1m river stage (within sensor error).  
       - Compare crest/inflow results.  
     - **Threshold:**  
       - Difference ≤ 0.2m (stage) or ≤ 10% (volume): Proceed to Q6.  
       - Difference > 0.2m or > 10%: **Do not issue a single number** (use range of sensitivities).  
     - *Fallback without computational time:* Use historical analogs (e.g., "In similar storms, 5% soil error caused ±15% crest change").  

  5. **Is the predictability horizon exceeded? (Lyapunov time proxy)**  
     - *Ask:* Is lead time > typical error doubling time?  
     - **Sufficient answer:**  
       - Pre-computed basin estimate (e.g., "Our model diverges after 3 days in storm conditions").  
       - Heuristic without Lyapunov exponent:  
         - "Error doubling time" ≈ 24–36 hours in active storms; 48–72 hours in dry spells.  
     - **Threshold:**  
       - Lead time ≤ doubling time: Proceed to Q6.  
       - Lead time > doubling time: **Do not issue a single number** (issue ensemble/scenarios).  
     - *Judgement call:* If no data, assume 36-hour doubling time during events, 60 hours in drought.  

  6. **Is structural error acceptable?**  
     - *Ask:* For the forecasted variable (crest/inflow), is historical mean absolute error (MAE) < tolerance?  
     - **Sufficient answer:**  
       - MAE from past forecasts in similar conditions (e.g., "MAE for 3-day crests is 0.3m").  
     - **Threshold:**  
       - MAE ≤ 0.2m (stage) or ≤ 15% (volume): **Single number acceptable** (state value ± MAE as range).  
       - MAE > 0.2m or > 15%: **Do not issue a single number** (state range: forecast ± MAE).  
     - *Fallback without MAE:* Use "rule of thumb" MAE = 10% of forecasted value.  

  ### Handoff to Human Judgment  
  - After any "do not issue" step, the forecaster **must** decide:  
    - *Risk tolerance:* "Is the emergency manager’s need for simplicity worth a 30% chance of a 1m error?"  
    - *Communication:* If pressured, issue scenarios (e.g., "Most likely: 5.2m; Worst-case: 6.0m") with explicit confidence levels.  
  - *Never* override a "do not issue" from Q3–Q5 without senior approval.  

  ---

  ### Case Applications  
  **Case 1: 36-hour crest forecast during ongoing storm**  
  - Q1: Lead time 36h (<48h) → Proceed.  
  - Q2: System quiescent? No (storm ongoing) → Q3.  
  - Q3: Rainfall predictable? If ensemble spread <20% → Q4. Else, stop: no single number.  
  - Q4: Initial condition sensitivity? Run quick tests. If difference ≤0.2m → Q6. Else, stop.  
  - Q6: Structural error? If MAE ≤0.2m → **Issue single number with range (e.g., "5.5m ± 0.3m")**.  
  - *Outcome:* Likely acceptable if rainfall confidence high and sensitivity low.  

  **Case 2: 7-day inflow outlook for drought-stricken reservoir**  
  - Q1: Lead time 7 days (>4 days) → Skip to Q5.  
  - Q5: Predictability horizon? Doubling time heuristic: ~60h in drought. 7 days (168h) >> 60h → **Do not issue a single number**.  
  - *Outcome:* Unacceptable. Issue scenarios (e.g., "Dry: 10GL; Median: 20GL; Wet: 40GL") or use a pre-calculated ensemble.  

  **Case 3: 30-day seasonal water-supply outlook**  
  - Q1: Lead time 30 days (>4 days) → Skip to Q5.  
  - Q5: Predictability horizon? 30 days >> error doubling time (max 72h) → **Do not issue a single number**.  
  - *Outcome:* Use probabilistic guidance (e.g., "50% chance inflow is 50–70 GL").  

  ---

  ### Limitations and Failure Modes  
  - **Cannot settle:**  
    - Value trade-offs (e.g., "Is a 20% chance of missing a flood crest acceptable?").  
    - Novel events (e.g., unprecedented land-cover change).  
  - **Will misfire:**  
    - When model structural error is misestimated (e.g., uncalibrated for mega-storms).  
    - Near bifurcation points (e.g., soil saturation tipping from 89% to 91% during Q2).  
    - If atmospheric forcing shifts abruptly post-check (e.g., Q3 passed, but rainfall changes 1h later).  

  Summary: Issue a single number only if lead time is short, forcing is predictable, initial conditions are insensitive, and structural error is small; otherwise, issue ranges, scenarios, or ensembles.
