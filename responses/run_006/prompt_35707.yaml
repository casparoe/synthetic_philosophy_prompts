answer: |-
  The core impasse in the scientific realism debate is not primarily empirical, statistical, or semantic—though those elements surface. Rather, it is a **normative disagreement about epistemic risk and theory individuation**, entrenched by incompatible attitudes toward what constitutes "reasonable" belief in science’s theoretical claims.  

  First, consider the dispute over historical cases. When the realist argues that phlogiston theory’s "working parts" (e.g., weight relationships in combustion) were preserved in oxygen theory, while its "false core" (phlogiston as a substance) was discarded, the anti-realist retorts that this redescription is arbitrary. The disagreement here hinges on **how to individuate theoretical content**. The realist sees theories as modular: successful components can be salvaged as "approximately true" even if the overarching framework fails. The anti-realist insists theories are holistic: falsity in one domain (e.g., the ontology of phlogiston) infects the whole. This isn’t merely verbal; it reflects a deeper rift about what *counts* as preserving reference or success. For the realist, retention of predictive equations or functional roles suffices; for the anti-realist, only intact ontological commitment matters. They are, in effect, applying different criteria to "count" the same historical episodes, making their samples incommensurable.  

  Second, the burden-of-proof dynamic is real but symptomatic. The realist demands: *Why distrust science’s best theories when they empirically succeed?* The anti-realist counters: *Why trust them when history shows success coexists with radical error?* This exposes divergent **epistemic risk profiles**. The realist operates with a *default permission* to believe successful theories are truth-tracking, absent specific defeaters. The anti-realist adopts a *default skepticism*, demanding positive reasons to believe success indicates truth. These stances aren’t arbitrary; they stem from competing valuations of false positives (believing a false theory) versus false negatives (rejecting a true one). The realist prioritizes avoiding false negatives (missed truths), seeing science’s progress as evidence of reliability. The anti-realist prioritizes avoiding false positives (credulousness), citing science’s revolutions as proof of fragility.  

  Could anything break the impasse? A new historical case would likely be assimilated into existing narratives: realists would highlight retained elements, anti-realists the discarded ontology. A formal result (e.g., a Bayesian model showing success *must* correlate with truth under certain assumptions) might clarify dependencies but would face charges of idealization. Operationalizing "approximate truth" could help—e.g., defining it as *empirical adequacy across all actual and possible observations in a domain*—yet this risks collapsing into instrumentalism, satisfying neither side.  

  The most promising path lies in **reframing the question**. Instead of asking "Are successful theories approximately true?" we might ask: *What specific inferential practices license trusting theories for particular purposes?* For example, when a theory’s models reliably guide material interventions (e.g., semiconductor design via quantum mechanics), the realist infers ontological grounding, while the anti-realist attributes success to empirical tuning alone. Here, detailed studies of *how* theories are applied and modified in practice—tracking whether their "working parts" rely on contested ontology—could expose shared ground. If certain theoretical components consistently underpin novel predictions *without* ontological commitment (e.g., mathematical structures), structural realism might bridge the divide. Conversely, if successful predictions always dissolve when ontology is excised, anti-realism gains traction.  

  Ultimately, the debate persists because it is **foundational**: it concerns what science *ought* to warrant. Realists see anti-realism as undermining science’s epistemic authority; anti-realists see realism as naively metaphysical. This normative core ensures the dialectic loops. Resolution may require conceding that "truth" in science is not a binary verdict but a context-dependent license—one that justifies trust in specific domains without demanding global certainty. Until both sides disentangle these contexts, the graveyard and the salvage yard will remain rival landscapes.
