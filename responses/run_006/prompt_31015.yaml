prompt: |-
  I'm writing a paper on the badness of pain, and I need to get clear on what any adequate theory of pain's badness must accomplish before I evaluate the candidates. The clinical literature on pain asymbolia, morphine dissociation, and related phenomena has made it impossible to just assume that pain's badness is a simple, unitary thing — but I'm not sure how much weight these cases should bear, or what else belongs on the list.

  Please produce a structured specification of the desiderata for a theory of pain's badness. I want:

  1. A numbered list of requirements. For each: the case, datum, or consideration that makes it a requirement; whether it is non-negotiable or merely a desideratum favored by one approach; and, where relevant, what exactly the requirement rules out.

  2. The requirements should address at minimum:
     - The dissociation of sensory intensity from unpleasantness (pain asymbolia, morphine, frontal lobotomy, and the converse — suffering without nociception, as in some forms of depression or grief). What pattern must a theory predict or at least accommodate across these cases?
     - The relationship between pain's badness and pain's motivational role. Is it a requirement on a theory of badness that it explain why pain normally motivates avoidance, or can that be outsourced to a separate account of motivation?
     - Whether pain's badness is intrinsic to the experience or relational (e.g., a matter of the subject's attitude toward the sensation). What would force a theory to one side or the other?
     - The neuroscience constraint: must a philosophical theory of pain's badness be consistent with the known separation of the lateral (sensory-discriminative) and medial (affective-motivational) pain pathways, or is that an inappropriate demand on conceptual analysis?

  3. After the list, flag any pairs of desiderata that appear to be in tension — where satisfying one makes satisfying the other harder or impossible. If you think the tension is only apparent, explain why.

  4. Identify the single requirement that does the most to narrow the field — the one that, once you take it seriously, eliminates the largest number of otherwise plausible theories.

  5. If there is any commonly cited desideratum that you think is illegitimate — something the literature treats as a requirement but that a theory shouldn't have to meet — name it and make the case against it.

  I don't need a full scorecard of every theory, but if a particular desideratum is especially awkward for a major view (e.g., pure perceptualism, evaluativism, imperativism, or attitudinal theories), note it briefly.
reasoning: |-
  Okay, the user is writing a paper on the badness of pain and needs a structured list of requirements for any adequate theory. They mentioned clinical cases like pain asymbolia and morphine dissociation, which show that pain's unpleasantness isn't always tied to its sensory aspect. 

  First, I need to outline what an adequate theory must accomplish. The user wants a numbered list with each requirement, including the case or consideration that necessitates it, whether it's non-negotiable or just a desideratum, and what it rules out. Key areas to cover are dissociation cases, the link between badness and motivation, whether badness is intrinsic or relational, and the neuroscience constraint.

  Starting with the dissociation phenomena. Pain asymbolia shows that sensory intensity can exist without unpleasantness. Morphine and lobotomy reduce suffering without eliminating sensation. Conversely, conditions like depression involve suffering without physical pain. So Requirement 1 should be about accommodating both dissociation directions. That's non-negotiable because any theory that can't explain these cases fails empirically. This rules out theories that treat pain as a single, unified experience.

  Next, the motivational role. Pain normally drives us to avoid it, but in asymbolia, that motivation is gone. A theory must explain why badness typically motivates but doesn't always (Requirement 2). Non-negotiable because motivation is central to pain's function. This challenges imperativism, which might overemphasize command aspects, and attitudinal theories that could separate motivation too much.

  Then, the intrinsic vs. relational nature of badness. Cases like asymbolia suggest that unpleasantness isn't inherent to sensation but depends on other factors. Requirement 3 would be that badness isn't intrinsic to sensory qualities. Non-negotiable as dissociation cases show variability. This rules out simple perceptualism and supports evaluativism or attitudinal theories.

  Neuroscience constraints: The dual pathways (lateral for sensory, medial for affective) must be acknowledged (Requirement 4). Non-negotiable because ignoring established science undermines the theory. Rules out theories that don't account for separable components.

  Other requirements: Phenomenology (Requirement 5) - the badness must feel bad, which is non-negotiable. Hedonic variability (Requirement 6) - intensity can vary independently, non-negotiable. Also, the first-person authority (Requirement 7) - if it feels bad, it is bad, non-negotiable. Practical rationality (Requirement 8) - why we should avoid pain, non-negotiable. And unity (Requirement 9) - explaining why sensory and affective usually co-occur, a desideratum.

  Now, tensions: Requirement 3 (relational badness) and Requirement 7 (first-person authority) might clash. If badness depends on attitudes, how can we be infallible about it? But maybe attitudes are part of the experience, so the tension is only apparent. Also, neuroscience constraints vs. philosophical purity - but they can complement each other.

  The most narrowing requirement is likely Requirement 1 (dissociation accommodation) because it forces theories to handle cases where sensory and affective components come apart, eliminating simple unified views.

  Illegitimate desideratum: The demand for a single neural correlate might be too reductive. Pain's badness is multi-level, so neural correlates alone aren't sufficient.

  Also, considering theories: Perceptualism struggles with asymbolia. Imperativism might handle motivation but not cases where pain doesn't command action. Evaluativism could explain badness as content but needs to account for motivational force. Attitudinal theories might separate attitude from sensation but face issues with first-person authority.

  Need to ensure each requirement is clearly explained, with the supporting cases and implications. Highlighting tensions and the most critical requirement will help the user evaluate theories effectively.
answer: |-
  Here is a structured specification of desiderata for a theory of pain's badness, incorporating your requirements and addressing the key philosophical and empirical challenges:

  ### Desiderata for a Theory of Pain's Badness

  1.  **Accommodate Bidirectional Dissociation of Sensory Intensity and Unpleasantness (Non-Negotiable)**
      *   **Case/Datum:** Pain asymbolia (intense sensation without unpleasantness/avoidance), morphine/lobotomy (reduced suffering despite preserved sensation), and converse cases like emotional suffering without nociception (depression, grief) or centrally generated pain (phantom limb pain).
      *   **Requirement:** The theory must explain or be consistent with the possibility that the sensory-discriminative component (intensity, location, quality) and the affective-motivational component (unpleasantness, badness) can exist independently or be dissociated in intensity.
      *   **Rules Out:** Theories that treat pain's badness as an intrinsic, inseparable property of the sensory quality itself (naive perceptualism). Theories that cannot account for suffering without physical sensation.

  2.  **Explain the Normative Link to Motivation (Non-Negotiable)**
      *   **Case/Datum:** Pain normally motivates avoidance and action *because* it is bad. In asymbolia, the lack of unpleasantness correlates with a lack of motivation.
      *   **Requirement:** The theory must explain *why* the badness of pain *typically* provides a reason for avoidance and motivates action. It must account for the normative force ("This *should* stop") inherent in pain's unpleasantness.
      *   **Rules Out:** Theories that completely divorce the *badness* from the *motivational oomph* (e.g., some strict attitudinal theories might struggle). Theories that make the motivational role merely contingent or unexplained.

  3.  **Deny Intrinsic Badness of Sensory Qualia (Non-Negotiable)**
      *   **Case/Datum:** Pain asymbolia and morphine dissociation demonstrate that identical or near-identical sensory qualities can be experienced as either neutral/unpleasant depending on context (brain state, drugs).
      *   **Requirement:** The theory must hold that the sensory qualities themselves (the "painfulness" of the sensation) are not intrinsically bad. The badness must arise from something else – either an added evaluative component (evaluativism), a command structure (imperativism), or a contingent attitude (attitudinalism).
      *   **Rules Out:** Theories claiming that the phenomenal character of the sensory quale *just is* its badness (Simple Intrinsic Qualia View). Theories where badness is a simple, non-relational property of the sensation.

  4.  **Respect Neuroscientific Constraints on Separability (Non-Negotiable)**
      *   **Case/Datum:** The lateral (sensory-discriminative) vs. medial (affective-motivational) pain pathways; lesions/imaging showing distinct neural correlates for intensity vs. unpleasantness; modulation of affective component by opioids, ACC activity, etc.
      *   **Requirement:** The theory must be consistent with the empirical fact that the sensory and affective dimensions of pain are subserved by distinct, though interacting, neural systems. It cannot require that badness be implemented in the same way or same place as sensory discrimination.
      *   **Rules Out:** Theories that conceptually *entail* the neural inseparability of sensory and affective components. Theories that render the established neuroscience irrelevant or inexplicable.

  5.  **Capture the Phenomenology of Badness (Non-Negotiable)**
      *   **Case/Datum:** The first-person experience of pain's unpleasantness – its aversive, intrusive, demanding, "hurting" character.
      *   **Requirement:** The theory must provide a plausible account of *what it is like* for the badness of pain to be present in experience. It must explain the felt, immediate aversion.
      *   **Rules Out:** Theories that reduce badness to purely dispositional or behavioral properties without capturing its experiential presence. Theories that make badness seem merely cognitive or detached.

  6.  **Account for Hedonic Intensity Variability (Non-Negotiable)**
      *   **Case/Datum:** Pains can be more or less unpleasant independently of sensory intensity (e.g., morphine reduces unpleasantness more than sensation; anxiety amplifies unpleasantness).
      *   **Requirement:** The theory must explain how the *degree* of badness/unpleasantness can vary relative to sensory intensity, including modulation by context, expectation, emotion, and meaning.
      *   **Rules Out:** Theories that strictly tie the intensity of badness solely to the intensity of sensory input.

  7.  **Preserve First-Person Authority (Non-Negotiable)**
      *   **Case/Datum:** If someone sincerely reports an experience as intensely unpleasant/bad, it *is* bad for them. We generally accept self-reports of pain's unpleasantness as authoritative.
      *   **Requirement:** The theory must accommodate the idea that the subject's experience is definitive regarding whether the pain is bad *for them* at that moment. It shouldn't make badness something externally verifiable independently of the subject's experience.
      *   **Rules Out:** Theories that make badness entirely dependent on external judgments, long-term consequences, or biological function *in a way that overrides the subject's current experience*. (E.g., "This pain isn't *really* bad for you because it's helping you heal" contradicts the felt experience).

  8.  **Ground Practical Rationality (Non-Negotiable)**
      *   **Case/Datum:** The badness of pain provides a fundamental, pro-tanto reason to avoid or alleviate it. This reason seems intrinsic to the experience.
      *   **Requirement:** The theory must explain why the experience of pain's badness inherently counts as a reason for the subject to act (e.g., to stop it, avoid it, seek help).
      *   **Rules Out:** Theories that make the badness merely descriptive or fail to connect it normatively to reasons for action.

  9.  **Explain the Typical Unity of the Pain Experience (Desideratum)**
      *   **Case/Datum:** While dissociable, sensory intensity and unpleasantness are highly correlated and experienced as unified in normal, untreated pain.
      *   **Requirement:** The theory should ideally explain *why* the sensory and affective components are usually tightly bound together in experience, despite being dissociable.
      *   **Rules Out:** (Less strict) Theories that *only* account for dissociation but struggle to explain the robust default coupling. (Favors theories invoking shared evolutionary origins or integrated processing).

  ### Tensions Between Desiderata

  *   **Tension 1: Relational Badness (Req 3) vs. First-Person Authority (Req 7):** If badness depends on a contingent attitude or evaluative stance (Req 3), how can the subject be infallible about it (Req 7)? Couldn't they be wrong about their own attitude? **Resolution Potential:** Attitudinal/Evalutivist theories can argue the attitude/evaluation is *constitutive* of the unpleasant experience itself, making it self-intimating. The attitude isn't a separate, hidden state.
  *   **Tension 2: Neuroscience Constraints (Req 4) vs. Philosophical Purity:** Some philosophers argue conceptual analysis shouldn't be dictated by empirical findings. **Resolution:** Req 4 doesn't demand the theory *derive* from neuroscience, only that it be *consistent* with well-established facts about implementation. A good theory should not be falsified by known science.
  *   **Tension 3: Normative Motivation (Req 2) vs. Relational/Attitudinal Views (Req 3):** If badness comes from an attitude or evaluation, why does it *necessarily* motivate? Couldn't one have the "bad-making" attitude without being motivated? **Resolution Potential:** Imperativism handles this best, building motivation in. Evaluativism can argue representing something as bodily damage *just is* motivating for a rational agent concerned with integrity. Attitudinalists need to tightly link the attitude type to motivation.

  ### The Most Field-Narrowing Requirement

  *   **Requirement 1 (Bidirectional Dissociation)** does the most to narrow the field. Taking dissociation seriously eliminates:
      *   **Simple Perceptualism:** (Pain = perception of tissue damage). Asymbolics perceive damage but feel no badness.
      *   **Simple Intrinsic Qualia Views:** The "ouchiness" isn't intrinsically bad if it can be felt without aversion.
      *   **Crude Behaviorism:** Asymbolics have the sensation without avoidance behavior.
      *   **Theories ignoring affective dimension:** Must account for suffering without sensation (depression).
      It forces theories to have at least two dissociable components or mechanisms.

  ### Illegitimate Desideratum

  *   **"Must Identify a Single, Simple Neural Correlate of Badness":** The literature sometimes implicitly demands this, expecting badness to map neatly onto one brain region or process.
  *   **Case Against:** Neuroscience (Req 4) shows pain's unpleasantness involves distributed networks (ACC, Insula, PFC, Amygdala) interacting dynamically. Badness in other modalities (disgust, grief) likely involves overlapping but distinct patterns. A philosophical theory aims to characterize the *nature* of the badness (intentional, imperatival, attitudinal), not its precise neural implementation. Demanding a single correlate is overly reductionist and ignores the multi-level nature of explanation (phenomenal, functional, neural). A good theory should be *consistent* with neural complexity, not *reducible* to a single correlate.

  ### Awkwardness for Major Views

  *   **Perceptualism (Pure):** Struggles severely with **Req 1 (Dissociation)** and **Req 3 (Intrinsic Badness)**. If pain is just perceiving damage, why no badness in asymbolia?
  *   **Evaluativism:** Can face challenges explaining the raw **Motivational Force (Req 2)** – why does representing damage *as bad* necessarily *command* action, not just describe? May need supplementation.
  *   **Imperativism:** Can struggle with **Req 1 converse cases (Suffering without Nociception)** – what bodily command is being issued in grief? Also, can feel less intuitive capturing the full *phenomenology* of suffering **(Req 5)** compared to aversiveness.
  *   **Attitudinal Theories:** Risk violating **Req 7 (First-Person Authority)** – if badness is a contingent attitude, could I be wrong about whether my pain feels bad? Also, need strong account of **Req 2 (Motivation)** – why *must* this attitude motivate? Can struggle with **Req 6 (Intensity Variability)** of the attitude itself.

  This specification provides a rigorous framework for evaluating theories of pain's badness, grounded in the empirical and conceptual challenges that define the current debate.
