answer: |-
  Here’s a practical 5-step decision procedure for your managers, designed for <10 minute use:

  ### The Responsibility Decision Tree
  *(Ask in Order - Stop When You Reach a Conclusion)*

  1.  **Was this a violation of a CLEAR, KNOWN safety rule? (YES/NO)**
      *   **Satisfactory Answer:** Rule exists in writing/is trained, employee signed acknowledgment/training records.
      *   **Stop if YES:** **Blaming Stance Required.** Immediate corrective action (write-up, suspension pending investigation, potential termination). Safety is non-negotiable. Explain consequences clearly, demand accountability.
      *   **If NO:** Go to Step 2.

  2.  **Did the employee KNOW the standard/procedure and have the SKILL to meet it? (YES/NO)**
      *   **Satisfactory Answer:** Confirmed via training records, past performance, or employee admission. Skill assessed via certification or observed competence.
      *   **Stop if NO:** **Problem-Solving Stance Required.** This is a training/support gap. Investigate why knowledge/skill was missing. Provide training/coaching. No blame.
      *   **If YES:** Go to Step 3.

  3.  **Did the employee have REASONABLE CONTROL over the circumstances? (YES/NO - Judgment Call)**
      *   **Check for:** Unforeseen emergencies, documented equipment failure, documented conflicting instructions, verified overwhelming workload *beyond normal expectations*, verified lack of necessary parts/tools *they couldn't resolve*.
      *   **Satisfactory Answer:** Evidence supports lack of control (e.g., work logs showing double-booked appointments, broken tool report).
      *   **Stop if NO:** **Problem-Solving Stance Required.** Focus on fixing the system (scheduling, resource allocation, process clarity) that failed the employee. Support, don't blame.
      *   **If YES:** Go to Step 4. *Flag: This step involves significant judgment about "reasonable."*

  4.  **Is there EVIDENCE of DELIBERATE DISREGARD for standards? (YES/NO - Judgment Call)**
      *   **Check for:** Admission of cutting corners, proven dishonesty (lying about work done), pattern of similar issues despite coaching, clear evidence of rushing for personal gain (like leaving early), ignoring a direct instruction.
      *   **Satisfactory Answer:** Clear, documented facts or credible admission (not just suspicion).
      *   **Stop if YES:** **Blaming Stance Required.** Hold fully accountable. Explain the breach of trust and the consequences (disciplinary action). Anger can be channeled into firm clarity about expectations and values.
      *   **If NO:** Go to Step 5. *Flag: Core moral judgment about intent and choice.*

  5.  **Is this a REPEAT occurrence of the SAME issue? (YES/NO)**
      *   **Satisfactory Answer:** Documented history of the same error/problem, despite previous feedback/support.
      *   **Stop if YES:** **Blaming Stance Required.** Problem-solving was tried and failed. Accountability for not improving is necessary (performance improvement plan, final warning).
      *   **Stop if NO:** **Problem-Solving Stance Required.** Treat as a likely one-off mistake or system issue. Investigate root cause collaboratively. Focus on correction and prevention. Support the employee.

  ---

  ### Worked Applications

  1.  **Mechanic rushes brake job to leave early, car unsafe.**
      *   Step 1: YES (Safety violation - unsafe brakes). **STOP: Blaming Stance.** Manager must act decisively: serious write-up, suspension, possible termination investigation. Anger is justified regarding the reckless choice; accountability is paramount for safety culture.

  2.  **Service writer, after 16-hour days for two weeks, makes costly billing error.**
      *   Step 1: NO (Not a core safety rule).
      *   Step 2: YES (Knows billing, skilled normally).
      *   Step 3: Is 16-hour days for weeks "reasonable control"? **NO.** (Judgment: Extreme fatigue is a mitigating factor beyond normal expectation). **STOP: Problem-Solving Stance.** Manager investigates workload/staffing. Apologizes for the unsustainable situation causing the error. Corrects the billing, provides rest/support. Focus is on fixing the system, not blaming the exhausted employee.

  3.  **The "Bad Taste" Case: Experienced, generally good technician installs the wrong part (non-safety critical) because the parts inventory system was ambiguous, and the shop foreman gave conflicting verbal instructions that day. This is the first such error.**
      *   Step 1: NO.
      *   Step 2: YES (Knows parts, skilled).
      *   Step 3: Did they have control? **NO.** (Judgment: Conflicting instructions and ambiguous system are external factors). **STOP: Problem-Solving Stance.**
      *   **Why you won't like it (but should follow it):** Your instinct might be to blame the tech: "They should have double-checked!" or "They know better!" The procedure forces focus on the *system failure* (ambiguous inventory, poor communication). Blaming the tech here ignores the root cause, damages trust with a good employee, and fails to fix the real problem, guaranteeing repeat errors by others. Fix the system, support the tech.

  ---

  ### Limitations & Hidden Judgments

  1.  **Limitations:**
      *   **Complex/Ambiguous Situations:** Blended causes (some employee choice, some system failure) can make the path murky, especially at Step 3 & 4.
      *   **"Known" Standards (Step 2):** Assumes good documentation/training. Weak shops will struggle.
      *   **Intent (Step 4):** Proving "deliberate disregard" is hard without admission. Relies heavily on manager perception.
      *   **Interpersonal Issues:** Doesn't handle personality conflicts, harassment, or deep-seated performance issues well.
      *   **Severity vs. Stance:** A severe outcome (even if accidental) might *feel* like it needs blame, but the procedure might dictate problem-solving (e.g., Step 3 NO).

  2.  **Hidden Moral Judgments (Dressed as Procedure):**
      *   **Step 3 ("Reasonable Control"):** Defining "reasonable" involves judgments about responsibility, workload fairness, and employee agency.
      *   **Step 4 ("Deliberate Disregard"):** This is the core moral judgment about culpability and intent. The checklist format masks the deep assessment of *why* someone chose (or didn't choose) to act poorly.
      *   **Step 5 ("Repeat Occurrence"):** Judges whether prior support was sufficient and the employee's responsiveness, implying moral failing in not improving.

  **The Bottom Line:** This procedure forces managers to pause, consider context and intent systematically, and move beyond pure instinct (blame or avoidance). It prioritizes safety absolutely, demands accountability for deliberate actions, but mandates system fixes and support where the system or circumstances failed the employee. Consistency here builds trust and retains talent.
