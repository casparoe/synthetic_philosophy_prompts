prompt: |-
  I've been working through Bernard Williams's essay "Internal and External Reasons" for a seminar on metaethics, and I keep returning to a worry that I'm having trouble stating precisely. As I understand the argument, Williams holds that all genuine reasons for action must be "internal" — by which he means that a consideration counts as a reason for an agent to φ only if that consideration can be reached through a sound deliberative route starting from something already present in that agent's subjective motivational set. If a consideration fails to connect to what the agent actually cares about, it simply isn't a reason for them. Now, Williams is explicit that the deliberative route can involve things like correcting factual errors, resolving inconsistencies among one's existing desires, and exercising imagination about what satisfying a desire would actually involve. But none of this, it seems to me, can generate a reason where there is genuinely nothing in the agent's motivational set to work with — no seed of concern, no latent impulse that deliberation could draw out. And this seems to land us in a deeply uncomfortable place. If someone is indifferent to the suffering of others, and this indifference is not based on any factual mistake or inconsistency, then on Williams's view there simply is no reason for that person to refrain from causing harm. Moral criticism of such a person would then amount to something like expressing our own motivational set, or perhaps trying to causally reshape theirs, but not to identifying a reason that genuinely applies to them. But this seems to hollow out the very idea of moral normativity — the thought that some reasons bind us irrespective of what we happen to want. Am I reading Williams too uncharitably, or is this really where the internal reasons thesis leads? And if he is right, what remains of the practice of holding one another morally accountable?

  Please limit your response to no more than 500 words.
reasoning: |-
  Okay, the user is grappling with Bernard Williams's internal reasons thesis and its implications for moral normativity. They're concerned that if reasons are entirely dependent on an agent's subjective motivational set, then morally indifferent agents have no reason to avoid causing harm—which seems to undermine moral accountability. This is a sophisticated metaethical worry from someone clearly well-versed in the literature (likely a grad student or advanced undergrad).

  The core tension they identify is real: Williams *does* bite the bullet here. His rejection of external reasons means that the "amoralist" truly has no reason to be moral if their "S" contains no relevant dispositions (like sympathy or fairness). The user rightly notes this threatens the robust "bindingness" of morality. But we should clarify three points they might be missing:

  First, Williams emphasizes how rich "subjective motivational sets" actually are—they include not just desires but dispositions, commitments, and even "thick" ethical concepts the agent already holds. So true indifference is rarer than the thought experiment suggests. Second, his account *does* ground normativity in rationality: reasons emerge from ideal deliberation on existing motivations. This preserves accountability as a form of rational criticism ("you aren't living by your own standards"). Third, Williams might say moral practices like blame aim to *create* internal reasons by triggering dispositions (e.g., shame) the amoralist might still possess.

  Still, the user's discomfort reveals the real cost of internalism: morality loses its categorical force over agents who utterly lack moral sentiments. For Williams, that's just how practical reason works—but many moral realists would reject this. The user might explore hybrid theories (e.g., Korsgaard) that try to reconcile internalism with stronger normativity.

  Their underlying anxiety seems twofold: (1) Is moral criticism rationally groundless against the amoralist? (Yes, for Williams—it becomes psychological persuasion.) (2) Can we preserve genuine accountability? (Only by expanding "S" via social practices—a move some find unsatisfying.) I should validate their reading while suggesting where Williams has resources to soften the blow.
answer: |-
  You've captured Williams's position accurately and identified its challenging implication: for an agent devoid of any relevant motivational elements (like empathy or a sense of fairness), there is, strictly speaking, no internal reason to avoid causing suffering. Williams acknowledges this "amoralist" figure and accepts the conclusion—moral criticism directed *at the amoralist themselves* isn't pointing to a reason *they* have, but rather expressing *our* motivations or attempting causal influence.

  This *does* challenge a robust objectivist view of moral normativity binding agents irrespective of their contingent motivations. However, Williams argues this doesn't render morality illusory or hollow accountability practices meaningless, for several reasons:

  1.  **The Rarity of True Amoralism:** Williams contends that a motivational set (S) utterly devoid of elements that could, under sound deliberation (including vivid awareness of others' suffering), generate concern for others is highly exceptional. Most people possess dispositions like sympathy, a desire for social acceptance, or commitments to reciprocity that deliberation *can* connect to moral reasons.
  2.  **Normativity within Internalism:** Reasons remain normative *for the agent*. When we criticize someone morally (e.g., "You were cruel"), we often imply they are failing *by their own internal standards*—perhaps violating a commitment they *do* hold, or failing to grasp the consequences of their actions on things they *do* care about. The criticism appeals to reasons *internal* to them, revealed through (idealized) deliberation.
  3.  **The Function of Blame:** While blame cannot conjure an external reason for the true amoralist, Williams sees it as a complex social practice. It *can*:
      *   Appeal to reasons the agent *might* have (if deliberation were improved).
      *   Express the blamer's own motivations and values.
      *   Aim to *modify* the agent's S (inducing shame, prompting reflection) to *create* an internal reason where one was absent. This is causal influence, not reason-giving, but it serves a crucial social function in sustaining ethical life.

  **Where this leaves moral accountability:** Holding each other accountable shifts focus. It becomes less about invoking transcendent "reasons that apply" regardless of S, and more about:

  *   **Demanding Deliberative Integrity:** Holding people responsible for failures to deliberate soundly from their *own* S (e.g., ignoring known consequences, inconsistency).
  *   **Social Negotiation & Persuasion:** Using moral language and practices (including blame) to shape motivations, reinforce shared values, and maintain cooperative frameworks—acknowledging this involves influence, not just pointing to pre-existing reasons.
  *   **Expressing Shared Standards:** Affirming the values constitutive of our community, even when confronting those who reject them.

  Williams *is* rejecting the idea of reasons that magically bind agents in total motivational isolation. What remains of accountability is grounded in the interplay of individual psychology, rational deliberation, and the causal/social force of our practices—a more contingent, but arguably more psychologically realistic, picture of normativity. Whether this sufficiently captures the "binding" force many feel morality has is the core debate he provokes. Your worry highlights the genuine tension he exposes.
