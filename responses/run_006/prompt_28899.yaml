  ## Joint Statement on the Free Energy Principle & Its Role in Cognitive Science  
  *Following Six Months of Adversarial Collaboration*

  **Preamble:** We, having engaged in sustained good-faith argument, agree on core mathematical and conceptual elements of the Free Energy Principle (FEP) and Active Inference (AIF), while acknowledging fundamental disagreements about its epistemic status, empirical content, and unifying power. This document specifies points of agreement and disagreement clearly and neutrally.

  ---

  ### Part 1: Agreed Claims  

  1.  **Mathematical Foundation:** The FEP, as derived from information theory and Bayesian mechanics, states that any random dynamical system *at non-equilibrium steady state* that maintains a phenotype must implicitly minimize an upper bound (variational free energy) on surprisal (or self-information). This formalism is nontrivial; it requires specific assumptions (e.g., ergodicity, Markov blanket factorization).
  2.  **Markov Blankets as Formal Objects:** Markov blankets are a mathematically well-defined concept within the FEP formalism, enabling the factorization of the generative model into internal, blanket, and external states. This factorization is necessary for the derivation.
  3.  **AIF as an Implementation Framework:** Active Inference provides a concrete process theory derived from FEP minimization, specifying how action and perception jointly minimize free energy, typically via predictive processing (PP) architectures.
  4.  **FEP Alone is Insufficient for Concrete Prediction:** The bare FEP does not, by itself, specify the *particular* generative model, dynamics, or Markov blanket partition for any specific biological system (e.g., the human brain). Deriving empirically testable predictions requires substantial auxiliary assumptions.
  5.  **PP Has Empirical Traction:** Predictive processing models (e.g., hierarchical Bayesian filtering, prediction error minimization) have generated novel hypotheses and explained empirical phenomena in perception, action, and psychopathology, independent of appeals to the FEP's foundational claims.
  6.  **FEP is Not "Just Entropy Minimization":** While related to concepts like homeostasis, FEP minimization (specifically variational free energy) is formally distinct from simple entropy minimization and incorporates model complexity (via the Kullback-Leibler divergence).

  ---

  ### Part 2: Disagreements Table

  | Neutral Statement of Disagreement                                                                 | Defender's Characterization                                                                                                 | Deflationist's Characterization                                                                                              | Verbal or Real Dispute? | Crux (if Real)                                                                                                                               |
  | :------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :---------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. The ontological/epistemic status of Markov blanket partitions in real systems.**             | "Markov blankets often reflect natural, functionally relevant boundaries in self-organizing systems (e.g., cell membranes)." | "Markov blankets are primarily analytical tools we impose; their 'reality' is contingent on modeling goals, not ontology."   | **Real**                | **Crux:** *Can functionally equivalent, persistent systems exist that demonstrably lack any plausible Markov blanket partition consistent with FEP dynamics?* |
  | **2. The capacity of Active Inference to generate novel, falsifiable predictions.**               | "AIF generates unique predictions distinct from standard PP (e.g., precision dynamics in pathology, reflex arcs as AIF)."    | "AIF's apparent predictions rely heavily on ad-hoc parameterization of the generative model; it accommodates, not predicts." | **Real**                | **Crux:** *Does AIF make a novel, non-trivial prediction about neural or behavioral data that is not also made (or easily accommodated) by simpler PP models lacking the FEP ontology?* |
  | **3. The dependence of Predictive Processing's empirical success on the Free Energy Principle.** | "PP derives its foundational rationale and core dynamics (action/perception unity) *from* FEP; it's not just engineering." | "PP is a powerful, empirically successful *algorithm*; its success is orthogonal to the FEP's foundational claims."          | **Real**                | **Crux:** *Could a complete, empirically adequate cognitive neuroscience be built using PP models that explicitly reject the FEP as a foundational principle?* |
  | **4. The falsifiability of the core Free Energy Principle claim.**                                | "FEP could be falsified by finding persistent systems whose dynamics demonstrably violate its mathematical conditions."     | "The FEP, as a claim about *any* persistent system, is unfalsifiable; persistence *is* FEP-minimization by definition."      | **Primarily Real**      | **Crux:** *Can the Defender specify a concrete, observable signature that would definitively show a persistent system is* not *minimizing variational free energy?* |

  ---

  ### Crucial Tests & Predictions (Based on Cruxes 2 & 4)

  1.  **Crux 2 (AIF Novelty): Auditory Oddball Mismatch Negativity (MMN) under N-methyl-D-aspartate receptor (NMDAr) modulation.**
      *   **Case:** Manipulate NMDAr function (e.g., ketamine) known to affect prediction error weighting (precision) in PP models. Measure MMN (a neural signature of prediction error) under varying stimulus deviance probabilities.
      *   **Defender Prediction:** AIF uniquely predicts a *specific, non-linear interaction* between NMDAr modulation, stimulus volatility (environmental precision prior), and the shape of the MMN response curve that simpler error-minimization PP models cannot capture without adopting the full FEP/AIF dynamics (e.g., a precise shift in the *type* of surprise minimized, not just gain).
      *   **Deflationist Prediction:** Standard hierarchical PP models with adaptive precision estimation will fully explain the MMN modulation patterns under ketamine; no uniquely "AIF" signature distinct from established PP mechanisms will be found. The FEP adds no necessary explanatory layer.
      *   **What Counts Against Defender:** Failure to find the predicted specific interaction pattern using AIF models, while simpler PP models fit the data equally well or better with fewer parameters.

  2.  **Crux 4 (FEP Falsifiability): Engineered Non-Equilibrium Steady State (NESS) Systems.**
      *   **Case:** Construct a synthetic system (e.g., a chemical reaction network, a simple robot controller) demonstrably in a NESS, persisting in an environment, but explicitly designed *not* to minimize variational free energy under *any* plausible Markov blanket partition consistent with its dynamics and observed state distributions.
      *   **Defender Claim:** Such a system is impossible. Persistence in a NESS *entails* variational free energy minimization relative to some blanket partition.
      *   **Deflationist Claim:** Such a system is possible. Persistence can be achieved by mechanisms not describable as minimizing VFE, or requiring such an unnatural/arbitrary blanket partition that the FEP description becomes vacuous.
      *   **What Counts Against Defender:** The successful construction and empirical demonstration of such a system. **Deflationist Concession Point:** If the Defender *can* specify concrete, non-ad-hoc observable conditions under which she would concede a persistent system is *not* minimizing VFE (e.g., specific measurable violations of conditional independencies mandated by the FEP math), this strengthens the claim of falsifiability.

  ---

  **Signed,**

  [Defender's Name]  
  [Deflationist's Name]  
  Date: [Date]

  ---

  **My Reasoning & Calls as Arbiter (Philosopher of Cog Sci):**

  *   **Brainstorming Signatures:**
      *   **Defender Balks At:** Anything implying FEP is "just math," "tautological," or that PP is truly separable. She needs acknowledgment of FEP's *constraining power* and role as the "why" behind PP's "how." Words like "principle," "unifying," "necessity" matter.
      *   **Deflationist Balks At:** Terms like "unified theory," "fundamental law," or claims FEP *explains* persistence *beyond* modeling it. "Framework," "formalism," "sufficiency not necessity" are key. Equating PP success with FEP validation is anathema.
      *   **Vacuous Compromise Temptation:** "FEP is a powerful perspective." "Both views have merit." "More research is needed." Statements avoiding specifics on falsifiability, blanket ontology, or the PP-FEP link. We explicitly named cruxes and tests to avoid this.

  *   **My Calls:**
      1.  **Markov Blanket Reality: Real Dispute.** This is core ontology. The Defender sees blankets carving nature; the Deflationist sees them as tools. The engineered system test (Crux 4) directly probes this. *My Bet:* Deflationist wins this round. Defining blankets for complex, messy biological systems often involves pragmatic choices blurring the "real joint" claim.
      2.  **AIF Novelty: Real Dispute & My Key Focus.** This is where empirical rubber meets road. The Defender *must* point to unique AIF predictions beyond fitting known data. The MMN/NMDAr case is perfect because precision is central to AIF claims. *My Bet:* On *this specific test*, the Deflationist likely wins. I've seen too many "novel" AIF predictions retrodict or be absorbed into broader PP. But this test forces the Defender to put skin in the game. If AIF *does* uniquely predict here, it's a major win.
      3.  **PP-FEP Dependence: Real Dispute.** This is about the theory's core structure. Can you have the algorithm without the alleged foundation? *My Bet:* Deflationist is largely correct *for now*. PP works well as engineering. But if the Defender wins Crux 2 (AIF novelty), it strengthens the claim that FEP provides essential explanatory depth.
      4.  **FEP Falsifiability: Real Dispute, Defender's Burden.** This is the deflationist's strongest card. The Defender *must* specify what FEP excludes. The engineered NESS test is the acid test. *My Bet:* The Defender will struggle to specify a clear falsifier *that doesn't rely on defining persistence/system boundaries in a way that begs the question*. If she can't name a falsifying scenario in the document, it concedes significant ground to the deflationist view. **This is the most philosophically significant crux.**

  **Where I'd Put My Money:** Overall, on the *specific empirical traction* question (Crux 2, AIF Novelty), I lean Deflationist based on current evidence. On the *foundational scope/falsifiability* (Crux 4), I lean Deflationist, as the burden of proof for non-vacuity lies squarely on the Defender. The document forces both sides to confront their weakest points: the Defender on falsification, the Deflationist on whether FEP *constrains* model building in non-trivial ways (beyond just needing auxiliary assumptions). That alone makes it worthwhile.
