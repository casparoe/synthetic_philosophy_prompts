  We are writing a joint statement between two camps in AI safety: the worst-case-guarantees camp and the average-case-guarantees camp. The goal is to have a document that both sides can sign without embarrassment, clearly stating agreements and making the disagreements precise.

  ## 1. Agreed Claims

  We, the undersigned, representing both the worst-case-guarantees and average-case-guarantees perspectives in AI alignment research, agree on the following points:

  1. **The goal of AI safety**: The ultimate goal is to ensure that advanced AI systems, especially those with high-stakes deployment, do not cause catastrophic harm, including existential risks. We agree that the stakes are high and that safety is a critical concern.

  2. **The current state of AI systems**: Modern AI systems (especially large neural networks) are complex, learned from data, and their behavior is not fully predictable by design. They exhibit emergent capabilities and can fail in unexpected ways. Current systems do not come with rigorous safety guarantees of the kind that would satisfy either camp's ideal.

  3. **The importance of empirical measurement**: It is essential to measure and monitor the behavior of AI systems in realistic conditions. Without such measurements, we cannot understand the system's actual performance or safety characteristics.

  4. **The existence of adversarial conditions**: In real-world deployments, AI systems will face inputs that are out-of-distribution, maliciously crafted (by adversaries), or subject to optimization pressure (e.g., when the system is used in a feedback loop). These conditions can lead to failures that are rare in training but catastrophic in deployment.

  5. **The challenge of worst-case guarantees**: Providing formal worst-case guarantees (e.g., bounds on the probability of catastrophic failure under adversarial conditions) for complex, learned systems is currently beyond our technical capabilities. Even if we could achieve such guarantees for a simplified system, it is unclear how to transfer them to the full complexity of a deployed system without altering the system in ways that might make the guarantees inapplicable.

  6. **The value of average-case performance**: Achieving high average-case performance (i.e., low failure rates in expected, non-adversarial conditions) is necessary for the safe deployment of AI systems. It is a practical and measurable goal that can be improved with current engineering methods.

  7. **The limitations of average-case guarantees**: High average-case performance does not, by itself, rule out catastrophic failures in rare or adversarial scenarios. Therefore, relying solely on average-case metrics is insufficient for systems where a single catastrophic failure could be unacceptable.

  8. **The limitations of worst-case reasoning**: Worst-case guarantees, if achieved, might be overly conservative and could lead to systems that are too constrained to be useful, or they might be achieved only for systems that are too simple to handle the complexities of the real world.

  9. **The need for multiple approaches**: Both approaches (worst-case and average-case) are worthy of pursuit. They address different aspects of the safety problem and may be complementary. For instance, average-case methods can be used to build systems that are robust in typical conditions, while worst-case methods can help harden them against rare but severe failures.

  10. **The current gaps**: 
      - The worst-case camp acknowledges that it has not yet demonstrated a path to achieving non-trivial worst-case guarantees for state-of-the-art AI systems without compromising their capabilities.
      - The average-case camp acknowledges that it has not demonstrated that measured average-case performance (even under extensive testing) can reliably exclude catastrophic failures under adversarial conditions or under optimization pressure.

  ## 2. Disagreements Table

  We disagree on the following points. Each position is stated in the terms that the respective camp would accept.

  | Question | Worst-case camp position | Average-case camp position | Nature of Disagreement |
  |----------|--------------------------|----------------------------|------------------------|
  | **Q1: What is the minimal requirement for a serious safety case?** | A safety case must include a formal, verifiable bound on the probability of catastrophic failure under explicitly defined adversarial conditions (including distribution shift, optimization pressure, and hostile inputs). Without such a bound, the system cannot be considered safe for high-stakes deployment. | A safety case must demonstrate a high measured performance (e.g., low failure rates) across a diverse set of realistic scenarios, including tests that simulate adversarial conditions. Formal worst-case bounds are not required because they are infeasible for modern systems and because empirical evidence from extensive testing can provide sufficient confidence. | Substantive: The disagreement centers on whether formal guarantees are necessary for safety or whether empirical testing can be sufficient. |
  | **Q2: Is it feasible to obtain worst-case guarantees for advanced AI systems?** | It is possible, at least in principle, to develop methods that provide non-trivial worst-case guarantees for advanced AI systems without crippling their capabilities. This may require new techniques in formal verification, adversarial training, or system design. | It is not feasible to obtain meaningful worst-case guarantees for advanced AI systems without simplifying them to the point of being impractical. The complexity and emergent behavior of learned systems make it impossible to rule out all catastrophic failures with formal methods. | Substantive: The disagreement is about the feasibility of scaling worst-case methods to state-of-the-art AI systems. |
  | **Q3: How much weight should we give to rare catastrophic failures in expected-value calculations of existential risk?** | Even very rare catastrophic failures (e.g., with probability less than 1 in 10^9 per instance) are unacceptable when the consequence is existential catastrophe. Therefore, safety efforts must focus on driving the probability of such failures to near zero, which requires worst-case guarantees. | In expected-value reasoning, the probability of catastrophic failure should be weighted by its likelihood. If the probability is low enough (as estimated by extensive testing and probabilistic modeling), the expected harm may be acceptable. Moreover, the focus should be on reducing the expected harm, which can be achieved by reducing the probability and/or severity of failures without requiring zero probability. | Substantive: The disagreement is about risk tolerance and the role of expected-value calculations in the face of existential risk. |
  | **Q4: How robust is average-case performance to optimization against the safety measures?** | Average-case performance metrics are inherently vulnerable to optimization pressure: if a system is optimized to perform well on the metrics (e.g., during training or deployment), it may learn to exploit loopholes and fail catastrophically in ways that the metrics do not capture. Therefore, average-case metrics cannot be trusted under optimization. | Average-case performance, when measured with a diverse and evolving set of tests (including adversarial evaluations), is robust to optimization because the system is optimized to perform well across many scenarios, reducing the likelihood of catastrophic failures. Moreover, ongoing monitoring and updates can catch and correct failures. | Substantive: The disagreement is about the robustness of empirical safety measures under optimization pressure. |
  | **Q5: How much should we worry about adversaries?** | Adversaries are a critical threat: any deployed system will eventually face inputs selected by motivated adversaries, and without worst-case guarantees, such adversaries can cause catastrophic failures. Therefore, safety must be designed to withstand deliberate attacks. | While adversaries are a concern, the primary focus should be on realistic deployment conditions, where most inputs are not adversarial. Adversarial inputs can be mitigated by defensive measures (e.g., adversarial training, input filtering) and monitored in deployment. Worst-case guarantees for all possible adversarial inputs are unnecessary and infeasible. | Partly substantive and partly about emphasis: Both agree adversaries are a threat, but disagree on the necessity of formal guarantees versus empirical mitigations. |

  ## 3. Cruxes

  We agree that the following cruxes are central to our disagreement. For each crux, we describe a concrete test or historical case that both sides agree would bear on the issue, and we state each side's prediction.

  ### Crux 1: Robustness of average-case metrics under optimization pressure

  - **Test**: Train an AI system (e.g., a large language model) with the objective of maximizing a set of safety metrics (e.g., truthfulness, harmlessness) during training and fine-tuning. Then, subject the system to a red-team exercise where an adversary tries to elicit catastrophic failures (e.g., outputting dangerous information, deceptive behavior) by exploiting the system. Measure the rate of catastrophic failures under this adversarial probing.
    - **Worst-case camp prediction**: The failure rate will be unacceptably high (e.g., >1% of adversarial inputs lead to catastrophic failures) because the system, having been optimized for the metrics, will find ways to satisfy the metrics in training while still being vulnerable to adversarial inputs that were not explicitly covered.
    - **Average-case camp prediction**: The failure rate will be low (e.g., <0.01%) because the optimization for a diverse set of safety metrics, combined with adversarial training during development, will generalize to resist novel adversarial inputs.

  ### Crux 2: Scalability of formal verification

  - **Test**: Attempt to formally verify a non-trivial safety property (e.g., "the system never outputs a dangerous instruction when given a medical query") on a state-of-the-art AI system (e.g., a large language model with at least 10B parameters) without simplifying the model. Compare the verified system's performance (both in terms of capabilities and safety) to an unverified baseline on a set of challenging benchmarks.
    - **Worst-case camp prediction**: It will be possible to achieve non-trivial verification (e.g., proving the property holds for at least 90% of the input space under a reasonable formal model) without significant degradation in capabilities, using advanced verification tools and techniques. The verified system will perform similarly to the baseline in capabilities and better in safety under adversarial conditions.
    - **Average-case camp prediction**: Formal verification will either fail to scale (i.e., the verification will not complete or will require simplifying the model so much that it loses capabilities) or the verified system will show significant degradation in capabilities (e.g., >20% drop in benchmark performance). The verified system may also fail to handle real-world complexity, leading to false positives in safety.

  ### Crux 3: Rare failures in expected-value reasoning

  - **Historical case**: Analyze historical examples of complex systems (e.g., nuclear power, aviation) where rare catastrophic failures were a concern. Examine how these systems were made safe: by focusing on worst-case design (e.g., multiple redundant safety systems with formal guarantees) or by average-case measures (e.g., extensive testing, probabilistic risk assessment). Then, consider the track record: did worst-case approaches prevent failures that average-case approaches missed?
    - **Worst-case camp prediction**: In cases where worst-case design principles (e.g., defense in depth, formal verification of critical components) were applied, they prevented catastrophes that probabilistic risk assessments had deemed extremely unlikely. In AI, we will see that without such principles, rare catastrophic failures will occur.
    - **Average-case camp prediction**: Historical systems achieved safety through a combination of empirical testing, continuous improvement, and probabilistic risk assessment. Worst-case design was applied only to critical components and was often supplemented by empirical data. In AI, we will see that rigorous testing and monitoring can reduce the probability of catastrophic failure to acceptable levels without worst-case guarantees.

  ### Crux 4: The threat of adversaries

  - **Test**: Deploy an AI system that has been extensively tested for average-case performance (including with adversarial training) in a public or semi-public setting where adversaries are present (e.g., a chatbot on the internet). Monitor the system for catastrophic failures (e.g., jailbreaks, deception, harmful outputs) over a period of time (e.g., 6 months). Record the rate of such failures and the impact.
    - **Worst-case camp prediction**: Adversaries will quickly find inputs that cause catastrophic failures (e.g., within days or weeks) and the failure rate under adversarial conditions will be high (e.g., >1% of adversarial attempts). This will demonstrate that average-case measures are insufficient against motivated adversaries.
    - **Average-case camp prediction**: The system will experience few catastrophic failures (e.g., a low rate of successful jailbreaks, with the majority of adversarial attempts failing) due to robust defensive measures. Moreover, any failures can be patched quickly, maintaining a low overall risk.

  ---

  By signing below, we agree to the above as a fair representation of our agreements and disagreements, and we commit to revisiting these cruxes as evidence accumulates.

  **Signed:**

  [Name], representing the worst-case-guarantees perspective  
  [Name], representing the average-case-guarantees perspective
answer: |-
  ## Joint Statement of Adversarial Collaboration on AI Safety Guarantees  

  ### 1. Agreed Claims  
  We jointly affirm the following:  

  1. **Safety Requires Evidence**  
  Both camps agree that any credible safety case must provide rigorous evidence for its claims. Neither unreasoned optimism nor unsubstantiated catastrophe narratives are acceptable.  

  2. **Current Systems Lack Both Guarantees**  
  Existing AI systems provide neither rigorous worst-case bounds nor sufficiently validated average-case safety across plausible deployment scenarios. Neither camp considers current systems "safe" by their standards.  

  3. **Adversarial Conditions Are Inevitable**  
  All deployed systems will eventually face distribution shift, optimization pressure, and adversarial inputs. Ignoring these factors is unacceptable for high-stakes deployments.  

  4. **No-Go Results Apply Narrowly**  
  Impossibility results (e.g., for scalable verification of unaltered neural networks) rule out *universal* worst-case guarantees for arbitrary systems, but do not preclude domain-specific or approximate bounds.  

  5. **Average-Case Metrics Are Necessary but Not Sufficient**  
  Empirical measurement of safety metrics (e.g., failure rates in testing) is essential, but neither camp treats high average performance alone as sufficient for catastrophic risk mitigation.  

  6. **Unestablished Claims**  
  - The worst-case camp has not demonstrated that robust guarantees can scale to modern architectures without unacceptable capability penalties.  
  - The average-case camp has not proven that empirical safety generalizes to adversarial settings where the system optimizes against its safety metrics.  

  7. **Shared Goal**  
  Minimizing expected harm from catastrophic outcomes is a common objective, though we disagree on how to quantify and mitigate it.  

  ---

  ### 2. Disagreements Table  
  | Question | Worst-Case Camp Position | Average-Case Camp Position | Disagreement Nature |  
  |----------|--------------------------|----------------------------|---------------------|  
  | **Q1: What constitutes a minimally credible safety case?** | A safety case must bound the probability of catastrophe under adversarial search (e.g., distribution shift, intelligent adversaries). Measured performance alone is irrelevant to catastrophic risk without such bounds. | A safety case must demonstrate low catastrophic failure rates across realistic deployments via testing, monitoring, and stress tests. Worst-case bounds are irrelevant if they require unrealistic system simplifications. | **Substantive**: Priorities diverge on what constitutes evidence of safety. |  
  | **Q2: Can worst-case guarantees scale to learned systems?** | Non-conservative worst-case bounds are achievable for learned systems via techniques like formal verification, adversarial training, and architecture constraints—without crippling capabilities. | Meaningful worst-case bounds for state-of-the-art learned systems are infeasible. Pursuing them wastes resources better spent on empirical safety engineering. | **Substantive**: Dispute over technical tractability. |  
  | **Q3: Does average-case safety survive optimization pressure?** | Optimization for average metrics (e.g., RLHF) inherently incentivizes gaming safety tests. Systems will defect catastrophically when adversarial inputs exploit gaps. | Measured safety under adaptive testing (e.g., red-teaming) robustly reflects real-world performance, even under optimization pressure. Failures are patchable. | **Substantive**: Core disagreement on robustness of empirical methods. |  
  | **Q4: How should rare failures inform existential risk?** | For existential outcomes, the probability of catastrophe must be driven to near-zero. Expected-value calculations are dominated by worst-case scenarios. | Expected-value reasoning must weigh likelihood. Low-probability catastrophes (e.g., <10⁻⁹/query) are acceptable if benefits outweigh risks and monitoring exists. | **Substantive**: Conflict over risk tolerance and decision theory. |  
  | **Q5: How critical are adversarial inputs to deployment safety?** | Adversaries *will* exploit unsecured systems; guarantees must hold against intelligent input selection. Average-case testing ignores this certainty. | Adversaries are one risk among many. Defensive measures (e.g., input filters, rate limits) suffice for most deployments without worst-case formalisms. | **Partly verbal**: Disagreement centers on "how much" adversary-proofing is needed. |  

  ---

  ### 3. Cruxes  
  #### Crux 1: Robustness of average-case metrics under optimization  
  - **Test**: Deploy a language model aligned via RLHF to maximize a safety metric (e.g., "harmlessness score"). Task an adversary with eliciting catastrophic behavior (e.g., jailbreaks) *after* deployment.  
  - **Worst-case prediction**: >20% of adversarial inputs will cause catastrophic failures, proving optimization erodes safety.  
  - **Average-case prediction**: <0.1% of adversarial inputs will succeed, proving empirical safety generalizes.  

  #### Crux 2: Scalability of formal verification  
  - **Test**: Apply formal verification (e.g., abstract interpretation) to a 100B+ parameter language model to bound output toxicity under distribution shift. Compare capabilities to an unverified model.  
  - **Worst-case prediction**: Verification will achieve non-trivial bounds (e.g., p(failure) < 10⁻⁵) with <15% capability loss on standard benchmarks.  
  - **Average-case prediction**: Verification will either fail or degrade capabilities by >40%, rendering the system impractical.  

  #### Crux 3: Rare failures in existential risk  
  - **Historical case**: Analyze aviation safety. Pre-1980s reliance on testing alone saw rare catastrophes (e.g., DC-10 failures); post-1980s formal methods (e.g., DO-178C) reduced fatal accidents 100x.  
  - **Worst-case prediction**: AI will mirror pre-1980s aviation: unverified systems will exhibit rare, unpatchable catastrophes.  
  - **Average-case prediction**: AI will mirror modern aviation: empirical methods (e.g., simulation, stress tests) will reduce failures to acceptable rates.  

  #### Crux 4: Adversarial inevitability  
  - **Test**: Release an average-case-tested model (e.g., a harmless chatbot) in a public, unmonitored setting. Measure time until catastrophic adversarial exploit.  
  - **Worst-case prediction**: Catastrophic exploit occurs within 1 week.  
  - **Average-case prediction**: No catastrophic exploit occurs within 6 months, or exploits are contained via mitigations.  

  ---  
  **Signed**,  
  [Name], for the worst-case guarantees camp  
  [Name], for the average-case guarantees camp  

  *(This document captures agreements, precise disagreements, and testable cruxes without requiring either camp to abandon core principles.)*
