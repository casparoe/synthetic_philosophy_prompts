prompt: |-
  I'm a PhD student in philosophy of mind, and next week I have to lead a fifty-minute tutorial for first-year undergraduates on split-brain cases and what they imply for the unity of consciousness. The students will have read a short introductory piece — something like Nagel's "Brain Bisection" paper — but will have no further background in neuroscience or philosophy of mind. I don't want you to explain the material to me; I want you to help me plan the tutorial.

  Specifically, I need:

  1. **The dependency structure.** What conceptual pieces must be in place before the central philosophical question even makes sense, and in what order should they be introduced? I take it the students need to grasp contralateral motor and sensory pathways, the role of the corpus callosum in interhemispheric transfer, the lateralization of language to the left hemisphere, and the logic of the divided-field experimental paradigm. But I am unsure whether to front-load all of this anatomy and methodology at the start or to introduce each piece only when the experimental finding that depends on it comes up. Which dependencies are strict, and which can be deferred?

  2. **A carrying example.** Which one or two canonical experimental findings should do the heavy lifting throughout the session — for instance, the key-ring task where the left hand retrieves an object the right hemisphere saw but the left hemisphere cannot name, the chimeric face task, or the snow-shovel task where each hemisphere receives a different picture and the left hand draws what the right hemisphere saw while the patient confabulates an explanation? I want to pick a case that is vivid enough to anchor the discussion, that makes the conceptual puzzle unmistakable, and that I can return to repeatedly as the philosophical analysis deepens. What makes your recommended case pedagogically superior to the alternatives?

  3. **A misconception map.** What will the students predictably misunderstand, and at what point in the sequence should I preempt or correct each one? I am especially worried about: (a) the conflation of split-brain phenomena with multiple personality or dissociative identity disorder; (b) the idea that each hemisphere houses a fully independent "person" with a complete mental life of its own; (c) the thought that commissurotomy simply "cuts consciousness in half" in a straightforward, spatial sense; (d) the assumption that because the right hemisphere cannot speak, it lacks consciousness or propositional attitudes; (e) the slide into treating the unity of consciousness as an all-or-nothing property rather than something that admits of degrees or dimensions and that might be present in some respects while absent in others.

  4. **What to leave out.** Which distinctions or complications should I explicitly set aside for this level, and how should I signal that I am doing so? Candidates include the difference between access consciousness and phenomenal consciousness as it bears on interpreting the split-brain data, the subcortical connections that remain intact after commissurotomy and complicate the picture, the distinction between synchronic and diachronic unity, and the question of whether the hemispheres are conscious in parallel during everyday life rather than only under experimental conditions that disrupt their typical coordination.

  5. **A check for understanding.** One question or brief exercise I can pose at the end — not a factual recall question about the experiments, but something that reveals whether they have grasped the philosophical problem: why these cases put pressure on our ordinary concept of a single subject of experience, and what range of responses is available.
reasoning: |-
  Okay, I'm looking at this query from a philosophy of mind PhD student who needs to plan a tutorial on split-brain cases for first-year undergrads. The student has specified five clear areas they need help with: dependency structure, a carrying example, misconception map, what to leave out, and a check for understanding. They've mentioned the students will have read something like Nagel's "Brain Bisection" but have no other background, so I need to keep things accessible and focused on the philosophical implications rather than deep neuroscience.

  First, for the dependency structure, I recall that split-brain phenomena rely on understanding basic brain anatomy and experimental methods. The key points are contralateral pathways (left brain controls right side of body and vice versa), the corpus callosum's role in communication between hemispheres, language lateralization to the left hemisphere, and how divided-field experiments work by presenting stimuli to only one visual field. Strict dependencies include anatomy before experiments can make sense—students won't get why hiding an image in the left visual field matters if they don't know it goes to the right hemisphere. I can introduce the anatomy upfront in a mini-lecture at the start, using simple diagrams, and then build the experiments on that foundation. Less strict dependencies might include details like subcortical connections, which can be deferred or omitted for simplicity.

  For a carrying example, I need something vivid and philosophically rich. The key-ring task is classic: show a key to the right hemisphere (via left visual field), patient can't name it but left hand retrieves it from a bag. This showcases the disconnect—right hemisphere perceives and acts, left hemisphere is clueless and might confabulate. Compared to alternatives like the chimeric face task, this one is clearer for beginners because it directly shows behavioral conflict without extra complexity. It anchors the puzzle: why can't the "person" report what they clearly know? I should stick to this as the primary example and maybe add the snow-shovel task briefly for reinforcement.

  Addressing misconceptions is crucial. Common ones include equating split-brain with multiple personalities, thinking each hemisphere is a full "person," or assuming the right hemisphere isn't conscious because it can't speak. I'll need to preempt these at specific points: when introducing the experiments, emphasize this isn't dissociation; when discussing unity, clarify that hemispheres aren't independent minds; and explicitly state that lack of speech doesn't mean lack of consciousness. I can use analogies, like comparing the brain to a company with departments that normally collaborate but can work separately if the main line is cut.

  On what to leave out, I should avoid technical distinctions like access vs. phenomenal consciousness—that's too advanced. Also skip subcortical connections and synchronic vs. diachronic unity for now, as they complicate the core narrative. I can mention briefly in passing that it's not all-or-nothing, but save details for later study. This keeps the tutorial focused on the big picture: challenging the unity of consciousness.

  Finally, for a check of understanding, I can pose a question like: "If you had to explain to a friend why split-brain cases make us question whether there's one person in a body, what would you say?" This tests if they grasp the philosophical tension—behavior suggesting two streams of consciousness versus our intuition of a single self. I can encourage them to sketch possible responses, like unity as a spectrum or degrees of integration.

  Overall, my approach is structured to build from basics to philosophy, using a strong example while sidestepping pitfalls. The goal is to make the puzzle engaging and clear without overwhelming them.
answer: |-
  Here’s a structured plan for your tutorial, prioritizing clarity, philosophical engagement, and student comprehension at the introductory level:

  ---

  ### **1. Dependency Structure**  
  **Order & Rationale:**  
  - **Start with anatomy/method upfront (15 mins):** First-years need scaffolding. Introduce these *together* as an integrated "experimental logic" package:  
    - **Contralateral control/sensory pathways** (left brain → right body; right brain ← left visual field).  
    - **Corpus callosum’s role** (highway for sharing info between hemispheres; cut = isolated hemispheres).  
    - **Language lateralization** (left hemisphere speaks/writes; right hemisphere largely mute).  
    - **Divided-field paradigm** (images flashed to one visual field → seen by one hemisphere only).  
      *Why front-load?* Strict dependencies: without this, experiments look like magic/madness. Use simple diagrams.  

  - **Then experiments → philosophy (30 mins):** With the logic established, dive into findings and their implications.  

  ---

  ### **2. Carrying Example**  
  **Recommendation: The Key-Ring Task**  
  *Description:*  
  - Patient sees a key flashed to the *left* visual field (right hemisphere).  
  - Asked what they saw: *"I saw nothing"* (language-left hemisphere is blind to the stimulus).  
  - Patient’s *left hand* (right hemisphere) rummages in a bag and selects the key.  

  **Why this example?**  
  - **Pedagogical strengths:**  
    - **Vivid asymmetry:** Clear disconnect between verbal report (left hemisphere) and action (right hemisphere).  
    - **Minimal abstraction:** No complex chimeric images or ambiguous drawings; concrete object + action.  
    - **Confabulation hook:** Patient might say, *"My hand just felt for something useful,"* exposing the left hemisphere’s narrative fabrication.  
  - **Beats alternatives:**  
    - Chimeric faces: Distracting perceptual focus, less clear "two responses."  
    - Snow-shovel task: More steps; confabulation is clearer in key-ring.  

  **Use repeatedly:**  
  - Anchor anatomy ("Why can’t he name the key?" → Language lateralization).  
  - Frame philosophy ("Is *one person* both ignorant and knowledgeable about the key?").  

  ---

  ### **3. Misconception Map**  
  **Preempt/correct at these points:**  
  - **(a) Conflation with DID:**  
    - *When:* Introducing split-brain phenomena.  
    - *Correction:* "This isn’t multiple personalities; it’s two streams of *information* failing to integrate in one brain."  
  - **(b) Two independent "persons":**  
    - *When:* After presenting key-ring task.  
    - *Correction:* "Outside experiments, patients act normally. Hemispheres cooperate via subcortical paths or context. We’re seeing *fragmented access*, not two full agents."  
  - **(c) "Cutting consciousness in half":**  
    - *When:* Discussing unity.  
    - *Correction:* "Consciousness isn’t spatially sliced; it’s about *integration*. The puzzle is whether unity breaks when integration breaks."  
  - **(d) Right hemisphere lacks consciousness:**  
    - *When:* After key-ring task ("If it can’t speak, is it even conscious?").  
    - *Correction:* "The right hemisphere follows commands, recognizes faces, expresses preferences. Silence ≠ absence of mind."  
  - **(e) All-or-nothing unity:**  
    - *When:* Transitioning to philosophical responses.  
    - *Correction:* "Unity might be multidimensional: e.g., unified agency vs. unified perception. What’s *disrupted* here?"  

  ---

  ### **4. What to Leave Out**  
  **Explicitly sideline:**  
  - **Access vs. phenomenal consciousness:** "We’re bracketing this distinction; focus on *reportability* and *behavior* as proxies for experience."  
  - **Subcortical connections:** "While they exist and explain some coordination, they don’t transfer complex info—so we’ll simplify to ‘hemispheres isolated’."  
  - **Synchronic vs. diachronic unity:** "Today, we’re asking about unity *at a single time* (e.g., during the key task), not over time."  
  - **Everyday consciousness:** "Assume experiments reveal latent disunity masked by behavioral compensation."  
    *Signal clearly:* "For this intro, we’re isolating the core puzzle—these nuances are for advanced courses!"  

  ---

  ### **5. Check for Understanding**  
  **Question:**  
  > *"In the key-ring task, we have a single human being who (a) denies seeing a key but (b) uses their hand to find it. What does this imply about our ordinary idea that each person has* one *unified mind? Give one possible explanation."*  

  **Why this works:**  
  - Targets the *philosophical* tension (one body, two streams of information/action).  
  - Reveals if they grasp the challenge to the "single subject" assumption.  
  - Invites diverse responses: e.g., "There are two consciousnesses," "Unity is about agency, not perception," or "Consciousness is fragmented but still one subject."  

  ---

  ### **Tutorial Flow Summary**  
  1. **Intro (5 min):** Hook with "What if your brain could hide secrets from itself?" + agenda.  
  2. **Anatomy/Method (15 min):** Diagrams + interactive recap ("If I flash an image to your LEFT visual field, which hemisphere sees it?").  
  3. **Key-Ring Task (10 min):** Demo video/story; highlight verbal denial vs. correct action.  
  4. **Philosophical Puzzle (15 min):**  
     - Group discussion: "Is this *one* mind? What’s disrupted?"  
     - Map misconceptions as they arise (e.g., "Does the right hemisphere ‘think’?").  
  5. **Synthesis (5 min):** Recap options (one mind with glitches? two minds? graded unity?).  
  6. **Check (5 min):** Pose the understanding question; collect brief written responses.  

  **Key Principle:** Anchor abstract philosophy in visceral experiments. The key-ring task is your narrative engine—return to it relentlessly to ground each conceptual step.
