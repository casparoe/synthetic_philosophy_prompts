answer: |-
  You've pinned me on a classic worry, but your "p and no one ever knows p" isn't admissible for knowability! The conjunct "no one ever knows p" presumes a *recognition-transcendent* truth about what *cannot* be known across all time—a notion my anti-realism rejects from the start. Truth isn't a static property independent of our epistemic capacities; it's constitutively tied to what we *could* verify. So I reject the intelligibility of forming such a conjunction about a *specific unknown p* while clinging to verification-transcendence. The knowability principle (KP) applies only to propositions whose truth-conditions we can grasp—which this conjunct fails.  

  *Weakness: Distinguishing "admissible" truths risks ad hoc maneuvering unless grounded in a deeper theory of meaning.*  

