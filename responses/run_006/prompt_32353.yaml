answer: |-
  Here’s a crisp set of desiderata for a decision theory handling infinite/undefined expectations, grounded in the paradoxes and core principles of rational choice. I’ll flag key conflicts where satisfying one might force sacrificing another.

  ---

  ### **Core Desiderata for Rational Choice with Infinite Expectations**
  1. **Defined Expectations for Finite Cases**  
     *Motivation*: Any adequate theory must reduce to standard EU for gambles with finite possible outcomes.  
     *Case*: Choosing between $50 for sure vs. a 50% chance of $100 must yield the latter as (weakly) preferred.

  2. **Consistency Under Rearrangement (Pasadena Constraint)**  
     *Motivation*: Rational preferences shouldn’t depend on arbitrary labeling of outcomes.  
     *Case*: The Pasadena game’s EV changes if you permute the order of terms in its series (e.g., sum to 1, –∞, or π). A theory must either assign a *unique* value or declare it incomparable/undefined—**not** let value vary with labeling.

  3. **Weak Dominance Principle**  
     *Motivation*: If gamble A pays at least as much as B in every possible state (and strictly more in some), A should be strictly preferred.  
     *Case*: Altadena game (Pasadena but +$1 in every outcome) **must** dominate Pasadena. Violating this undermines rationality.

  4. **Stability Under Truncation**  
     *Motivation*: Real agents face finite horizons. Approximations of infinite gambles should converge to the "true" evaluation.  
     *Case*: Finite truncations of St. Petersburg ($\sum_{n=1}^N \frac{1}{2^n} \cdot 2^n = N$) should inform the infinite case. *But* Pasadena’s partial sums oscillate wildly—how should a theory handle this?

  5. **Sensitivity to St. Petersburg-Type Infinity**  
     *Motivation*: Some infinite expectations "feel" rationally compelling (e.g., St. Petersburg with linear utility).  
     *Case*: A theory should explain when/why an infinite EU is acceptable (e.g., "pay $1e6 to play St. Petersburg?") vs. pathological (Pasadena).

  6. **Robustness to Small Perturbations**  
     *Motivation*: Tiny changes in probabilities/utilities shouldn’t radically alter rationality.  
     *Case*: If Pasadena’s probabilities are slightly perturbed to ensure absolute convergence, its EV becomes finite. A theory shouldn’t switch from "undefined" to "$+\infty$" or "$-\pi$" under negligible noise.

  7. **Compatibility with Sequential Reasoning**  
     *Motivation*: Rationality should be consistent over time.  
     *Case*: In the Ross-Littlewood urn (add 10 balls, remove 1 repeatedly), expected balls diverge, yet the urn ends empty. A theory must handle such processes without contradiction.

  8. **Intuitive Pairwise Choices**  
     *Motivation*: Simple comparisons should resolve clearly.  
     *Case*: Pasadena vs. $0 should have a recommendation; Pasadena vs. St. Petersburg should be addressable.

  ---

  ### **Key Conflicts (Where Desiderata Clash)**
  1. **Consistency Under Rearrangement vs. Defined Expectations**  
     *Conflict*: To assign a defined EV to Pasadena (desideratum 1), you must pick *one* summation order—violating desideratum 2. If you insist on rearrangement-invariance (2), EV *must* be undefined—sacrificing 1.  
     *Theories*: Hájek’s "No Expectation" view embraces undefinedness (upholds 2, sacrifices 1). Others (e.g., Easwaran) impose a "canonical order" (uphold 1, sacrifice 2).

  2. **Weak Dominance vs. Defined Expectations**  
     *Conflict*: If Pasadena has undefined EV, can it be rationally compared to Altadena? Weak dominance (3) demands Altadena ≻ Pasadena. But if EV is undefined, standard comparisons fail.  
     *Theories*: Bartha’s relative expectation upholds dominance but abandons cardinal EU. Others (e.g., Colyvan) use dominance to force a defined value.

  3. **Stability Under Truncation vs. Handling St. Petersburg**  
     *Conflict*: St. Petersburg’s truncations grow slowly ($\log N$), while Pasadena’s oscillate. Demanding uniform truncation stability (4) might undervalue St. Petersburg (conflict with 5) or overconstrain Pasadena.  
     *Theories*: Lauwers & Vallentyne reject truncation-stability for St. Petersburg; Nover embraces oscillation.

  ---

  ### **Which Desiderata Knock Out Popular Fixes?**
  - **Weak Dominance (3)** is the killer:  
    - Hájek’s "No Expectation" view struggles to explain why Altadena ≻ Pasadena (if both lack EV).  
    - "Capped utility" fixes (e.g., set $u(\pm\infty)=M$) violate dominance in distorted St. Petersburg variants.  
  - **Robustness (6)** sinks "canonical ordering" fixes:  
    - If you order Pasadena’s terms to sum to $1$, but a 0.001% chance of a $+10^{100}$ payoff is added, the "canonical" EV jumps arbitrarily.

  ---

  ### **What’s Up for Grabs?**
  - **Expected Utility as the Sole Criterion**: With undefined EVs, we may need *non-archimedean* utilities (e.g., surreal numbers), dominance hierarchies (Bartha), or ordinal comparisons (Schmalensee).  
  - **Infinite vs. Undefined**: Distinguishing "legitimately infinite" (St. Petersburg) from "pathologically undefined" (Pasadena) is negotiable.  
  - **Role of Finite Agents**: Must a theory prescribe acts for beings who can’t compute infinite sums? (Yes, per truncation stability; No, per Hájek).

  ### **Non-Negotiables**
  Weak Dominance (3), Consistency (2), and reducing to EU for finite cases (1) are bedrock. Sacrificing these risks abandoning rationality itself.

  ---

  **Bottom Line**: The tension between **defined expectations** (for comparability) and **rearrangement-invariance** (for labeling-robustness) is the core fracture. Any "fix" leans one way: either you accept undefined EVs (and need new comparison tools) or impose order (and accept arbitrariness). The Altadena dominance challenge then tests whether your chosen path preserves intuitive dominance. No theory satisfies all desiderata; the literature is a map of strategic retreats.
