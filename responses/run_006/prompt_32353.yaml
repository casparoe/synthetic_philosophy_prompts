prompt: |-
  I'm taking a grad seminar on decision theory this semester and we just hit the Pasadena paradox, and honestly I'm kind of lost in the weeds. The professor threw it at us right after St. Petersburg and I think half the class is still trying to figure out why conditional convergence even matters for a gamble. For those who haven't seen it: the Pasadena game is this gamble where the expected value is the sum of an alternating harmonic series — it converges conditionally but not absolutely, so depending on how you order the terms, you can get the sum to be any real number, or diverge to ±∞. So the expected value isn't just infinite (like St. Petersburg), it's literally undefined. And there are other games in the neigborhood — the St. Petersburg game itself, the two-envelope problem, the Ross-Littlewood paradox if you think of it in decision-theoretic terms — where something goes wrong with expected value maximization.

  Before I read any of the proposed fixes — the Nover and Hájek stuff, the various dominance principles people have cooked up, the proposals to restrict the domain of expected utility theory — I want to know what I should be asking of a theory here. Write me the desiderata: what any adequate theory of rational choice has to deliver when expected values are infinite or undefined. Which cases must it get right, which puzzles must it dissolve or at least explain away, which constraints from standard decision theory can't be abandoned lightly, and which are up for grabs. For each desideratum, give the case or consideration that motivates it. And flag any pair of desiderata you suspect can't be jointly satisfied — that's the part I most want to see, because I suspect the whole literature is people trying to have their cake and eat it too.

  I don't need a full scorecard of every theory against the list, but if there's one or two desiderata that do most of the work in knocking out the popular fixes, point that out.
