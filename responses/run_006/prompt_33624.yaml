prompt: |-
  i'm a journalist who covers science and ideas, and right now I'm reporting a piece on a recent wave of writing in game studies and philosophy about whether what you do to NPCs in a video game has any moral weight. A designer I interviewed kept batting the whole question away with "it's just a game." The moment that stuck with me: I described a player who spends an hour tormenting a shopkeeper NPC in a life sim until the character weeps and begs, and he shrugged and said it's just a game — there's no one there. I want to represent his position fairly, but I cant tell which claim that sentence is supposed to be making. Could you lay out the distinct precise claims "it's just a game" could be expressing — about fictionality, about no one being harmed, about games being sealed off from real life, about the player's character not being revealed, about designers having no obligations, and anything else you can find — and for each one say whether it's a platitude, a substantive and defensible claim, or just false. Then tell me which of those readings would actually support the dismissal he was using it for, and which readings I'd be within my rights to push back on. Keep it under 800 words; a numbered menu would help me use it while I write.
