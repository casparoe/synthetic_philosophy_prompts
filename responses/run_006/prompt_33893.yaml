  so i run this monthly discussion group at the library—it's called "Big Questions" and it's basically just thoughtful people from the neighborhood, some religious some not, nobody with a philosophy degree. next month i want to do the argument from divine hiddenness. i get the basic idea: if God is perfectly loving, why would God stay hidden from people who are genuinely looking? but i don't want to just dump a summary of the argument on them and watch people talk past each other. i want to plan the actual session so they come to see why it's a distinct argument and not just the problem of evil in a hat.

  so: what order do the pieces have to go in? like, what has to be in place before the argument even makes sense to them? i'm guessing i need to start with what "perfectly loving" actually commits you to, not just "God is nice." what's the one example or scenario i should build the whole thing around—maybe a parent who never shows up? what are the misconceptions people are going to walk in with or form halfway through, and at what point in the sequence do i head each one off? the big one i'm worried about is people thinking it's just the problem of evil again. also people in my group tend to jump straight to "well free will explains it" before they've even understood what's being claimed, so i need to know when to acknowledge that and when to set it aside. and i want to end with a question that tells me whether they actually understood the argument's specific target, not just whether they found it unsettling. also, what should i openly say i'm leaving out at this level?
