prompt: |-
  My friend is deep into distributive justice and I've been keeping a list of her verdicts. She says:

  - a person who becomes paraplegic in an accident should get public support for a wheelchair, home modifications, and retraining, even if after adapting she reports being just as happy as before;
  - a person who has cultivated expensive tastes — pre-phylloxera wine, first editions, whatever — shouldn't get extra resources just because the same income leaves them less satisfied than other people;
  - we shouldn't tax a naturally cheerful person to top up a naturally gloomy one, even if the gloomy person is less happy on the same income;
  - a person with a severe cognitive disability who can't manage their own affairs should get substantial support, including a paid guardian, even though they report being content with very little;
  - a student whose family lost everything in a flood should get financial aid, but a student who blew the same amount on a luxury vacation shouldn't;
  - and a worker in a dangerous job who insists he's fine with the risk because he's never known anything safer should still get protective regulation.

  Next week I want to ask her about a new case. Maria has a rare condition that makes her an extremely efficient converter of resources into a decent life: on half the median income she's just as healthy, mobile, educated, and socially active as her neighbors, and by any list you'd care about her capabilities are equal to everyone else's. But her job pays half the median wage because the only skill she has is in low demand, retraining isn't realistic for her, and she works the same hours as everyone else. Is Maria's lower income unjust? Would my friend say so?

  I'm less interested in the yes/no than in the principle she's actually runing — Dworkin-style equality of resources, Sen-style capabilities, equality of welfare, luck egalitarianism, or something else — which other principles fit her track record just as well, what each of them would say about Maria, your best guess about her verdict and why, and what further case would most cleanly tell the candidates apart.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user has a friend who's really into distributive justice, and they've been keeping track of her judgments on various cases. Now they want to know what she'd say about Maria's situation and, more importantly, what underlying principle she's using. 

  First, I need to look at all the cases the friend has already ruled on. There are six of them: paraplegic support regardless of happiness, no extra for expensive tastes, no taxing cheerful people to help gloomy ones, support for cognitive disabilities even if content, aid for disaster victims but not spendthrifts, and safety regulations for workers who don't perceive risk. 

  Hmm, the pattern here seems to be that she cares about unchosen disadvantages. Like the paraplegic didn't choose the accident, the person with cognitive disability didn't choose their condition, the flood victim didn't cause the disaster. But the expensive tastes person chose their lifestyle, and the vacation spender chose to blow their money. 

  The cheerful/gloomy case is interesting - she says no redistribution even though the gloomy person didn't choose their temperament. That suggests she doesn't care about equalizing happiness per se. And the worker safety case shows she thinks some risks shouldn't be allowed even if consented to, probably because the worker might not fully understand the danger. 

  So putting this together, it looks like luck egalitarianism - compensating for bad brute luck but not for option luck. The wheelchair, disability support and flood aid are all brute luck, while expensive tastes and vacation spending are option luck. The worker safety case fits because the risk is structural, not truly chosen.

  Now for Maria's case - she's efficient at converting resources to capabilities, but stuck in a low-paying job due to low-demand skills. Her disadvantage comes from unchosen circumstances (her rare condition? the job market?) but she didn't choose to have this efficiency either. 

  Under luck egalitarianism, the key question is whether her situation results from brute luck. Her low-demand skill could be seen as brute luck (she didn't choose the job market) but her efficiency means she isn't actually disadvantaged in capabilities. That's tricky. 

  Other theories would say different things. Capability approach would say she's fine since her capabilities are equal. Resource equality would say she has fewer resources and that's unjust. Welfare equality would say no injustice since she's equally happy. 

  The user's friend will probably say no injustice for Maria - because her capabilities are equal despite lower income. That matches her past rulings where actual functioning mattered more than resources or happiness. 

  To test this against luck egalitarianism, I could propose a case where someone has brute luck disadvantage but normal resource-to-capability conversion. Like someone born with a condition requiring expensive medication just to reach normal functioning. Luck egalitarianism would support help, capability approach might too, but resource equality without the condition wouldn't. 

  The user seems really thoughtful about this - they've carefully documented the friend's positions and want to understand the philosophical underpinnings. They're probably preparing for a deep discussion next week. Beyond just predicting the friend's answer, they want to grasp why she thinks that way and how to probe further. That's sophisticated - they're not just looking for a quick answer but wanting to engage at the same level as their friend. I should make sure to honor that depth in my response.
answer: |-
  Based on your friend's consistent verdicts, her underlying principle aligns most closely with **Amartya Sen's Capability Approach**, with significant influences from **Luck Egalitarianism**. Here's the breakdown:

  ### Core Principle: Equality of Capabilities (Sen)
  *   **Focus:** Justice requires ensuring people have equal *opportunities* (capabilities) to achieve valuable functionings (e.g., being healthy, mobile, educated, socially integrated, having control over one's environment), *not* equal resources or equal welfare/happiness.
  *   **Fits the Verdicts:**
      *   **Paraplegic:** Needs resources to achieve *mobility* and *participation* (key capabilities), regardless of reported happiness.
      *   **Expensive Tastes:** Has the *capability* to achieve standard functionings with normal resources; their failure to do so is a choice, not a capability deficit.
      *   **Cheerful/Gloomy:** Both have the same *capability set* for achieving functionings with the same income; differences in welfare are irrelevant.
      *   **Cognitive Disability:** Lacks the *capability* for self-determination and managing affairs; support provides that capability via a guardian.
      *   **Flood vs. Vacation:** The flood *destroyed capabilities* (shelter, security, access to education); the vacation was a *choice* expending resources without creating a capability deficit.
      *   **Dangerous Job:** The worker may lack the *capability* for genuine informed consent or the *capability* to be safe; regulation secures the basic capability of physical integrity.

  ### Luck Egalitarian Influence
  *   **Focus:** Compensates for disadvantages arising from *brute luck* (unchosen circumstances) but not *option luck* (consequences of choices).
  *   **Fits the Verdicts:**
      *   **Paraplegic/Cognitive Disability/Flood:** Brute luck disadvantages warrant compensation.
      *   **Expensive Tastes/Vacation:** Option luck (choices) do not warrant compensation.
      *   **Cheerful/Gloomy:** Temperament is brute luck, but since it doesn't affect capabilities (only welfare), it's not compensated. This highlights the *capability* filter on luck egalitarianism.
      *   **Dangerous Job:** The *systemic risk* and potentially constrained choices (lack of alternatives) frame it as brute luck, justifying intervention.

  ### Why Other Principles Don't Fit as Well
  1.  **Equality of Resources (Dworkin):**
      *   **Problem:** Would compensate the paraplegic (resource cost of disability) but likely *not* the cognitively disabled person who is "content with little" (if resources are the metric). It *might* compensate expensive tastes under some insurance market interpretations (a point Dworkin wrestled with). It would see Maria's lower income as potentially just if markets priced her skills fairly.
      *   **Misfit:** Fails the cognitive disability case (no resource deficit claimed) and the cheerful/gloomy case (resources equal, welfare irrelevant). The flood/vacation distinction is harder to make purely on resources.

  2.  **Equality of Welfare:**
      *   **Problem:** Would compensate the gloomy person, potentially compensate expensive tastes (to equalize welfare), and likely *not* support the paraplegic or cognitively disabled person if they report equal happiness. Might see Maria's situation as just.
      *   **Misfit:** Directly contradicts the expensive tastes, cheerful/gloomy, paraplegic (if happy), and cognitive disability (if content) verdicts.

  3.  **Strict Utilitarianism (Welfare Maximization):**
      *   **Problem:** Similar to welfare equality. Would prioritize interventions based on welfare gains, potentially neglecting the paraplegic (if adaptation parity is high) or the cognitively disabled (if cheap to make content) in favor of boosting the gloomy person. Might oppose costly support for Maria if others gain more welfare from the resources.
      *   **Misfit:** Fails the cheerful/gloomy, expensive tastes, and cognitive disability verdicts.

  ### Maria's Case: The Prediction
  *   **Your friend will likely say Maria's lower income is *NOT* unjust.**
  *   **Why (Capability Perspective):** Maria achieves *equal capabilities* (health, mobility, education, social activity) to her neighbors *despite* having half the income. Her condition means she doesn't *need* the median income to achieve the valuable functionings central to a decent life. The injustice metric is capability equality, which she achieves. Her low wage reflects market valuation of her skills (arguably option luck or circumstantial), but crucially, it doesn't result in a capability deficit. Retraining isn't feasible, but she doesn't *need* it to achieve the core capabilities.
  *   **Why (Luck Egalitarian Perspective):** Maria's "efficiency" is brute luck. However, it confers an *advantage*, not a disadvantage. Her low wage could be seen as brute luck (low-demand skill) or option luck (career path choices, though constrained). The key is that this brute luck doesn't create a disadvantage in terms of capabilities – her *advantage* neutralizes the potential disadvantage of low income. No compensation is needed.

  ### A Clean Test Case: "The Expensive Medical Need"
  *   **Scenario:** Two people require constant, expensive medical treatment just to stay alive and achieve *basic* functionings (e.g., breathing without assistance, minimal mobility). Person A has a genetic condition (brute luck). Person B has the same need due to injuries sustained while voluntarily engaging in an extremely dangerous hobby (option luck). Both would die without treatment. Does justice require society to provide the treatment equally to both?
  *   **How it Distinguishes the Principles:**
      *   **Capability Approach (likely your friend's core):** **YES, treat both.** The core capability of "life" and "bodily health" is threatened for both. The *source* of the threat (brute luck vs. option luck) is secondary to restoring the fundamental capability. The expensive taste verdict was about *preferences*, not *basic capabilities*.
      *   **Strict Luck Egalitarianism:** **NO, only treat Person A.** Person B's need results from option luck (their choice to engage in the dangerous hobby), so they bear the cost. Person A's need is brute luck, warranting compensation.
      *   **Equality of Resources:** **Unclear/Mixed.** Might focus on the resource cost of the "medical need" handicap. Dworkin's hypothetical insurance might cover genetic conditions but exclude extremely reckless self-imposed risks, leaning towards treating only Person A. Or it might see the medical need itself as the resource deficit to compensate, treating both.
      *   **Equality of Welfare/Utilitarianism:** **Likely YES, treat both** (if resources allow), as letting either die creates massive welfare loss. Might prioritize based on future welfare potential.

  This test case cleanly separates your friend's predicted capability-centric view (focus on restoring the basic functioning, regardless of cause) from a stricter luck egalitarian view (compensates brute luck only), and potentially from a pure resource view depending on interpretation. Her likely "Treat Both" verdict would strongly confirm the Capability Approach as her foundational principle, using luck/choice distinctions mainly within that framework (e.g., to deny claims based purely on preferences/choices like expensive tastes).
