prompt: |-
  I run a product org at a mid-size software company, and every quarter we sit down for a kill/continue review of half-built features, internal tools, and legacy migrations. The company line is always 'don't throw good money after bad,' but I keep seeing decisions where walking away looks cheaper only because you ignore what we've already learned, or the cost of restarting later, or what killing the project does to the team. I want a decision procedure my staff can actually run in a one-hour review, without a philosopher in the room: the questions to ask in order, what counts as a good enought answer to each, where the procedure stops and says kill, where it says continue, and where it has to hand the call to a person because the step is a judgment call rather than a fact. Ground it in what the philosophy and economics literature actually says about sunk costs — not just the slogan — and be honest about which steps are judgment dressed up as procedure. Then run it on three cases: (1) a feature that's 80% built and just missed its market window, (2) an internal tool that works but took twice as long as planned and now looks redundant with a vendor product, and (3) a rewrite of a legacy system where continuing is mostly about not wasting the migration work already done. Make sure at least one case comes out with an answer I won't like, and say what the procedure can't do. At the end, tell me how confident you are in the procedure overall and which single step you're least sure about.
reasoning: |-
  We are creating a decision procedure grounded in economic and philosophical literature on sunk costs. The key insight from economics is that sunk costs (past investments that cannot be recovered) should not influence future decisions. However, this is often oversimplified. We must also consider:
  - Learning: The knowledge gained (which can be applied elsewhere) and the cost of restarting later (if we abandon now, we might have to redo the learning and setup).
  - Opportunity costs: What else could we do with the resources?
  - Psychological and team morale factors: Killing a project might demotivate the team, especially if they have invested effort.

  The procedure will have a series of steps with clear questions. Some steps will be factual, others judgment-based. We'll structure it as a flowchart with stopping points for "Kill", "Continue", or "Hand to Human Judgment".

  **Decision Procedure Steps:**

  1. **Step 0: Preparation** (Before the meeting)
     - Gather data: current status, resources spent (time/money), estimated remaining effort (time/money), and any quantifiable benefits expected (e.g., revenue, cost savings, user satisfaction).
     - Identify the sunk costs: document what has been spent and cannot be recovered.

  2. **Step 1: Is the project already dead?** 
     - *Question:* Has the fundamental reason for starting this project disappeared (e.g., the market need, the strategic alignment, the technical feasibility)? 
     - *Factual:* If yes, then **Kill**. (No need to proceed further.)
     - *Judgment call?* Mostly factual, but sometimes the reason might be ambiguous.

  3. **Step 2: Is the project complete?**
     - *Question:* Has the project achieved its minimum viable goal? (i.e., even if not 100%, is it delivering value now?)
     - *Factual:* If yes, then **Continue** (to maintain and possibly enhance). 
     - *Note:* For internal tools, "complete" might mean it's operational and providing value.

  4. **Step 3: Assess the remaining investment.**
     - *Question:* What is the best estimate of the remaining effort (time and cost) to reach the minimum viable state (or to complete if that's the goal)? 
     - *Factual:* Get an estimate from the team. If the estimate is not available, note it as a risk.

  5. **Step 4: Assess the expected future value.**
     - *Question:* What is the expected value (monetary or otherwise) of completing the project? Consider:
          - Direct value (e.g., revenue, cost savings)
          - Indirect value (e.g., strategic positioning, learning, team morale, avoiding future costs)
     - *Judgment call:* This step requires estimation and judgment. Use available data (e.g., market analysis, user feedback) but acknowledge uncertainty.

  6. **Step 5: Compare remaining investment to expected future value.**
     - *Question:* Is the expected future value greater than the remaining investment? (Use best estimates and include both tangible and intangible factors.)
     - *Factual if numbers are clear, else judgment:* 
          - If clearly yes, then **Continue**.
          - If clearly no, then **Kill**.
          - If uncertain, proceed to next step.

  7. **Step 6: Consider the cost of abandonment.**
     - *Question:* What are the costs of abandoning the project? Consider:
          - The cost of restarting later (if we might have to redo work, re-learn, or if the problem will come back).
          - The value of the knowledge already gained (can it be applied elsewhere?).
          - The impact on team morale (will killing this project demotivate the team?).
          - Any contractual or reputational costs?
     - *Judgment call:* This step is highly contextual and requires human judgment.

  8. **Step 7: Compare the net value of continuing vs. abandoning.**
     - *Question:* After factoring in the costs of abandonment, does continuing still have a positive net value? (i.e., (Expected future value - remaining investment) > (Cost of abandonment + opportunity cost of resources))
     - *Judgment call:* This is a synthesis of the previous steps. If the net value of continuing is positive, then **Continue**. If not, then **Kill**. If uncertain, **Hand to Human Judgment** (escalate to a higher-level decision maker).

  **Additional Notes:**
  - **Opportunity Cost:** Throughout, we must consider what else the team could be doing (the opportunity cost). This is implicit in the expected future value (if we continue, we forgo other projects). But it may be explicitly discussed in Step 7.
  - **Time Limit:** The procedure must fit in an hour. Therefore, we assume that the preparation (Step 0) has been done and the team comes with the required data.

  **Procedure Flowchart:**
  ```
  Start
    │
    ▼
  Step 1: Is the project already dead? → Yes → Kill
    │ No
    ▼
  Step 2: Is the project complete? → Yes → Continue
    │ No
    ▼
  Step 3: What is the remaining investment? (Fact)
    │
    ▼
  Step 4: What is the expected future value? (Judgment)
    │
    ▼
  Step 5: Is expected future value > remaining investment? → Yes → Continue
    │                                     │ No
    ▼                                     ▼
  Step 6: Cost of abandonment? (Judgment)   Kill? (But wait, maybe not)
    │                                     (Actually, we go to Step 6 only if Step 5 is uncertain or if we are considering abandonment costs to override a negative Step 5)
    │
    ▼
  Step 7: Net value of continuing vs. abandoning → Positive → Continue
            (Judgment)                       │
                                   Negative → Kill
                                   │
                                   Uncertain → Hand to Human Judgment
  ```

  **Important:** The procedure is designed to ignore sunk costs. However, in Step 6 we consider the cost of abandonment, which may include the loss of knowledge (which is a sunk cost but might be an asset) and the cost of restarting (which is a future cost). This is where the literature is nuanced: sunk costs are past and should not be considered, but the knowledge gained is an asset and the cost of restarting is a future cost that should be considered.

  **Running the cases:**

  ### Case 1: Feature that's 80% built and just missed its market window.
  - **Step 1:** Is the project already dead? The market window missed, but maybe there's still a market? If the market need is gone, then kill. But let's say we are not sure (maybe it's delayed but still relevant) → No.
  - **Step 2:** Is it complete? 80% built, so no.
  - **Step 3:** Remaining investment: 20% of original effort? But note: the last 20% might be harder, and original estimates were wrong. Let's say the team estimates 1 month (original estimate for the whole was 5 months, so 1 month is 20% of the time but they are 4 months in). 
  - **Step 4:** Expected future value: The market window is missed, so the value might be reduced. Maybe it's now worth 50% of the original value. Original value was estimated at $100k, now $50k.
  - **Step 5:** Remaining investment is 1 month of 5 engineers (say $50k). Expected value is $50k. So, is $50k > $50k? It's equal. So we are uncertain (or it's borderline).
  - **Step 6:** Cost of abandonment: 
      - If we kill, we lose the knowledge and might have to rebuild later if the market comes back? But the market window might be gone for good. 
      - The team might feel demotivated because they worked hard and it was almost done. 
      - The knowledge gained might be applicable to other features? 
      - Also, if we don't release, we might lose early adopters to competitors? 
      - Overall, abandonment costs might be moderate (team morale hit, and potential restart cost if market returns).
  - **Step 7:** Net value of continuing: 
      - The direct net value is $50k - $50k = $0. 
      - But including the cost of abandonment: if we abandon, we lose the chance of $50k and also incur the morale hit and potential restart cost. 
      - However, the opportunity cost of the 1 month is high (they could work on something else). 
      - Given the direct value is zero and the abandonment costs are not huge, but the opportunity cost is high, the net value of continuing is negative? 
      - **Judgment:** Kill. But note, if the team believes the market window isn't completely gone and they can capture some value, maybe continue. But in this case, the procedure would likely lead to **Kill**. 

  *Outcome: Kill* (which you might not like because it's 80% done, but the market window is gone and the remaining cost is as high as the expected value.)

  ### Case 2: Internal tool that works but took twice as long as planned and now looks redundant with a vendor product.
  - **Step 1:** Is the project already dead? The vendor product exists, but maybe our tool is better or we have specific needs? Let's say the vendor product meets 90% of the requirements. If the vendor product completely supersedes, then maybe dead. But we are not sure → No.
  - **Step 2:** Is it complete? It works, so yes? But note: the question is about achieving the minimum viable goal. If it's already working and providing value, then it's complete. So **Continue**? 
      - However, note: the tool is built and working, but we are considering if we should continue using and maintaining it or switch to the vendor. This step might be tricky because the project is "complete" in the sense that the tool is built, but the review is about whether to continue investing in it (maintenance, enhancements) or kill it (abandon and switch to vendor). 
      - Let's redefine: The project in question is the ongoing investment in the internal tool. So Step 2: Is the project complete? No, because we are in a state of having to choose between maintaining our tool or switching. We are not done with the project because we have to decide on the future.

      We adjust: The project under review is the "internal tool initiative", which is ongoing. So the current state is: we have a working tool, but we are considering whether to continue investing (maintain and improve) or kill (switch to vendor). So Step 2 might not be "complete" because the initiative is ongoing.

      Alternatively, we can think of the project as having two phases: build and operate. The build is done. The question is about the operate phase. So we skip Step 2 (because the build is done) and go to Step 3.

      Revised flow for this case:

      - Step 1: No, the project isn't dead (we are still using the tool).
      - Step 2: The build is complete? Yes, but the ongoing operation is part of the project? We are reviewing the entire initiative. Let's reframe: the project is the ongoing support and use of the tool. So Step 2: Is the project complete? Meaning, has the tool been fully decommissioned? No. But we are not at a state of "completion" in the sense of the review? 

      We'll skip Step 2 and go to Step 3.

  - **Step 3:** Remaining investment: What is the cost to maintain the tool per year? Also, if we switch to the vendor, what is the cost? 
      - Our tool: maintenance cost per year: $20k. 
      - Vendor: license and setup cost: $10k per year, but we have to integrate and migrate (one-time cost of $10k). 
      - So the remaining investment for our tool is $20k/year, and for the vendor it would be $10k one-time + $10k/year.

      But note: the procedure is about continuing the existing project (our tool) versus killing it (switching to vendor). So we are comparing the future costs and benefits of each option.

  - **Step 4:** Expected future value of continuing with our tool:
      - Value: We have full control, and it's tailored to our needs (maybe the vendor product doesn't meet 100% of our needs). Let's say the value of having the tool (in cost savings or productivity) is $50k per year. 
      - Expected future value of switching to vendor: 
          - Value: same $50k per year (because it meets 90% of needs, so maybe $45k per year) but also we save on maintenance? 
          - Actually, the value of the tool is the productivity gain. The vendor tool also provides that, but maybe slightly less? And we pay the vendor $10k/year. 
      - So for our tool: net value = $50k - $20k = $30k/year.
      - For the vendor: net value = $45k - $10k = $35k/year (and we have to pay the one-time $10k migration).

      But note: we are only evaluating the project of continuing our tool. The alternative (vendor) is the opportunity.

      We must consider the net value of continuing our tool vs. switching. The value of continuing is $30k/year. The value of switching is $35k/year minus the one-time cost (which over 3 years, say, would be $35k*3 - $10k = $95k vs. $30k*3 = $90k). So switching is better? 

      In Step 4, we are only asked for the expected future value of continuing the project (our tool). That is $30k/year. 

  - **Step 5:** Is the expected future value of continuing ($30k/year) greater than the remaining investment? The remaining investment for continuing is the maintenance cost ($20k/year) but note: the value is net of that? Actually, in Step 4 we are to assess the expected future value (gross value) and then in Step 5 we compare to the remaining investment (cost). 

      Let me clarify: 
      - Step 4: What is the expected future value (gross) of completing (or in this case, continuing) the project? The gross value is $50k/year (the productivity gain).
      - Step 5: Compare that to the remaining investment (the $20k/year). So $50k > $20k → Yes, so **Continue**.

      But wait, that ignores the alternative. The procedure doesn't explicitly compare alternatives until Step 7? 

      We need to consider opportunity cost. The opportunity cost of continuing is the forgone benefit of switching to the vendor (which is $35k/year after the migration). 

      So we adjust in Step 7.

  - **Step 6:** Cost of abandonment (switching): 
      - We have to pay the migration cost ($10k) and the team might feel bad because they built the tool and now we are abandoning it? 
      - Also, we lose the knowledge? Not really, because we are switching to a vendor. 
      - The cost of abandonment is the one-time migration cost and the risk of disruption.

  - **Step 7:** Net value of continuing vs. abandoning:
      - Continuing: net value = $50k - $20k = $30k/year.
      - Abandoning (and switching): net value = $45k - $10k/year (license) = $35k/year, but minus the one-time cost of $10k. Over 1 year: $35k - $10k = $25k (which is less than $30k). Over 3 years: $35k*3 - $10k = $95k vs. $30k*3 = $90k → so $95k > $90k, so switching is better in the long run.

      But note: the gross value of continuing is $50k, but the opportunity cost is the $35k/year we could get by switching? So the net value of continuing is $30k/year, but the opportunity cost is $25k in the first year and $35k in subsequent years? 

      We have to compare the two options. The procedure in Step 7 is about the net value of continuing relative to abandoning. But we are really comparing two projects: continuing vs. switching.

      The net value of continuing (relative to switching) in the first year: $30k - $25k = $5k. But in the second year: $30k - $35k = -$5k. So overall, it might be better to switch.

      Since Step 5 said to continue (because $50k > $20k), but Step 7 requires a more holistic view including the alternative, we might override and kill. 

      **Judgment:** The opportunity cost of not switching is high in the long run. Therefore, we should kill the internal tool project and switch to the vendor. 

  *Outcome: Kill* (which you might not like because the team built it and it works, but the vendor is more cost-effective in the long run.)

  ### Case 3: Rewrite of a legacy system where continuing is mostly about not wasting the migration work already done.
  - **Step 1:** Is the project already dead? The legacy system is still in use and causing issues? The need for the rewrite is still there? → No.
  - **Step 2:** Is it complete? No, it's in progress.
  - **Step 3:** Remaining investment: The team estimates it will take 6 months to complete the migration. The original estimate for the whole project was 12 months, and they have spent 12 months already (so 100% over schedule). The remaining investment is 6 months of 10 engineers → $300k.
  - **Step 4:** Expected future value: 
      - The rewrite will reduce maintenance costs by $100k per year and avoid potential outages (valued at $50k per year). So total $150k per year. 
      - Also, it will enable new features (estimated $50k per year). Total value: $200k per year.
      - The project is expected to have a lifespan of 5 years, so total value: $1,000,000.
  - **Step 5:** Is $1,000,000 > $300k? Yes → **Continue**.

  But wait, let's check the time value of money. The $1M is over 5 years. The net present value (NPV) might be less. But for simplicity, we ignore discounting because the procedure must be quick.

  However, note that the sunk cost fallacy is at play: the team feels they must continue because they've already spent 12 months. But the procedure ignores that and only looks at the future.

  Outcome: **Continue**.

  **But note:** The example says "continuing is mostly about not wasting the migration work already done". The procedure ignores the sunk cost (the 12 months already spent) and only considers the future value and future cost. So it correctly says continue because the future value is high enough.

  **What the procedure can't do:**
  - It cannot perfectly quantify intangible factors (like morale, strategic alignment, or the value of learning). These are judgment calls.
  - It relies on the quality of the estimates (remaining effort, future value). If these are off, the decision may be wrong.
  - It doesn't explicitly account for risk (e.g., the remaining work might take longer, or the value might not materialize). We assume best estimates.
  - It doesn't handle multi-year projections perfectly (discounting, uncertainty).

  **Confidence in the procedure:**
  Overall, I am confident that this procedure will lead to better decisions than ones that ignore the nuances of sunk costs. It forces the team to focus on future costs and benefits, while accounting for the cost of abandonment (which is often neglected).

  **Least confident step:**
  Step 4 (Assess the expected future value) is the step I am least sure about. It requires judgment and estimation of intangibles and future events, which are inherently uncertain. In a one-hour meeting, teams might not have the data and might rely on gut feelings, which could lead to biased outcomes.

  **Final Note:** The procedure is a framework to guide discussion and ensure key factors are considered. It doesn't eliminate the need for judgment but structures the decision process to avoid the sunk cost fallacy while accounting for the real costs of abandonment.
answer: |-
  Below is a decision procedure grounded in sunk cost literature (from economists like Richard Thaler, Daniel Kahneman, and Stephen Marglin), designed for 60-minute reviews. It explicitly ignores sunk costs but captures *forward-looking* costs of abandonment (e.g., lost learning, restart penalties, morale). The procedure has **6 steps**, with clear kill/continue thresholds. Judgment steps are flagged.

  ---

  ### **Decision Procedure: Sunk Cost Review Framework**  
  **Core Principle:** Only future costs/benefits matter. Sunk costs are irrelevant *unless* they create future liabilities (e.g., lost capabilities, restart costs).  
  **Time:** 45-60 mins per project. Prep data (effort, value estimates) ahead of time.  

  | Step | Question to Ask | Good Enough Answer | Kill/Continue Threshold | Judgment? |
  |------|-----------------|--------------------|-------------------------|-----------|
  | **1** | **Is the original goal still viable?**<br>(e.g., market need, strategic fit) | Evidence: User feedback, market data, strategy docs. A "no" here overrides all else. | **Kill if:** Goal is obsolete (e.g., market vanished). **Continue if:** Goal is intact. | Fact-driven. |
  | **2** | **What is the *minimum* cost to complete?**<br>(Time, $, opportunity cost) | Team estimate + 20% buffer. Opportunity cost = value of next-best project. | (Not a threshold yet—inputs for Step 4) | Fact-driven. |
  | **3** | **What is the *expected value* of completion?**<br>(Revenue, cost savings, risk reduction) | Quantifiable: Revenue forecasts, saved hours. Qualitative: Strategic positioning, morale. | (Input for Step 4) | **Judgment-heavy.** Use ranges (pessimistic/optimistic). |
  | **4** | **Is Expected Value > Completion Cost?**<br>(Net future value) | Yes/No with data from Steps 2–3. If unclear, use "expected value" (probability-weighted). | **Kill if:** Value ≤ Cost.<br>**Continue if:** Value > Cost. | Fact if data exists; else judgment. |
  | **5** | **What are abandonment costs?**<br>(e.g., restart costs, lost learning, morale hit, contractual penalties) | Examples: "Restarting later = 2x current effort." "Team attrition risk: 30%." | (Not a threshold—inputs for Step 6) | **Judgment-heavy.** Focus on *provable* risks. |
  | **6** | **Does (Value − Completion Cost) > Abandonment Cost?**<br>(Net continuation benefit vs. abandonment penalty) | Compare Step 4 (net value) vs. Step 5 (abandonment cost). | **Kill if:** Abandonment cost is lower.<br>**Continue if:** Net continuation benefit > abandonment cost.<br>**Judgment call if:** Tie or high uncertainty. | **Final judgment.** Escalate ambiguous cases. |

  ---

  ### **Applied to Your Cases**  
  **Case 1: Feature (80% built, missed market window)**  
  - **Step 1:** Goal viable? Market window missed, but adjacent use cases exist → **Viable? Judgment call** (assume "yes" for demo).  
  - **Step 2:** Completion cost = 20% effort + opportunity cost (e.g., 2 engineer-months).  
  - **Step 3:** Expected value = 40% of original (due to delay). Low confidence → **$50k (range: $20k–$80k)**.  
  - **Step 4:** Value ($50k) vs. Cost ($60k) → **Value < Cost → KILL threshold**.  
  - **Step 5:** Abandonment costs = Lost learning ($10k), morale hit (moderate), restart cost ($70k later). **Total ~$30k**.  
  - **Step 6:** Net continuation benefit = ($50k − $60k) = **−$10k** vs. abandonment cost ($30k) → **−$10k < $30k → KILL**.  
  **Outcome: KILL** (You won’t like this—but the market delay gutted value, and completion costs exceed returns).  

  **Case 2: Internal Tool (Works, but redundant with vendor)**  
  - **Step 1:** Goal viable? Original goal (cost savings) still valid, but vendor does 90% → **Viable? Yes**.  
  - **Step 2:** Completion cost = Maintenance (e.g., $10k/year) + enhancements ($5k).  
  - **Step 3:** Expected value = Savings vs. vendor ($8k/year) + customization benefits ($2k/year) → **$10k/year**.  
  - **Step 4:** Value ($10k) vs. Cost ($15k) → **Value < Cost → KILL threshold**.  
  - **Step 5:** Abandonment costs = Migration to vendor ($5k), lost tribal knowledge ($3k), morale (low—team prefers vendor). **Total ~$8k**.  
  - **Step 6:** Net continuation benefit = ($10k − $15k) = **−$5k** vs. abandonment cost ($8k) → **−$5k < $8k → KILL**.  
  **Outcome: KILL** (Even with sunk effort, the vendor is cheaper long-term).  

  **Case 3: Legacy Migration (Mostly avoiding wasted effort)**  
  - **Step 1:** Goal viable? Legacy system risks (security, scalability) still exist → **Viable? Yes**.  
  - **Step 2:** Completion cost = 3 months of work ($150k). Opportunity cost = delayed AI project ($200k). **Total $350k**.  
  - **Step 3:** Expected value = Risk reduction ($250k) + efficiency gains ($300k) → **$550k**.  
  - **Step 4:** Value ($550k) > Cost ($350k) → **CONTINUE threshold**.  
  - **Step 5:** Abandonment costs = Restart penalty ($400k later), morale crash (high—team invested 18 months), lost momentum ($100k). **Total ~$500k**.  
  - **Step 6:** Net continuation benefit = ($550k − $350k) = **$200k** vs. abandonment cost ($500k) → **$200k < $500k → KILL?**  
    - **Judgment call:** Abandonment costs are speculative. If restart penalty is certain, kill. If not, continue.  
    - **Assumption:** Restart penalty is valid → **KILL** (massive abandonment costs dominate).  
  **Outcome: KILL** (You’ll hate this—but the opportunity cost + restart risk outweigh finishing).  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Quantify morale or culture impacts** (Step 5): Relies on subjective estimates.  
  2. **Handle black swans** (e.g., regulatory changes): Requires override.  
  3. **Resolve biased estimates** (e.g., teams sandbagging completion costs): Needs independent review.  
  4. **Replace strategic vision**: If leadership insists on a project for non-economic reasons (e.g., brand), the procedure defers.  

  ---

  ### **Confidence Assessment**  
  - **Overall confidence: 7/10**.  
    - **Strengths:** Forces focus on future trade-offs, ignores sunk costs, scalable for 1-hour reviews.  
    - **Weaknesses:** Highly sensitive to input quality (garbage in, garbage out).  
  - **Least confident step: Step 3 (Expected Value)**.  
    - **Why:** Value estimates (especially strategic/temporal) are often inflated or vague. Requires disciplined calibration (e.g., "What’s the 90% confidence range?"). Mitigate by using pre-agreed valuation heuristics (e.g., "User time saved = $X/hour").  

  **Recommendation:** Pilot this with 2–3 projects, track outcomes, and refine value/abandonment cost heuristics. Philosophy’s sunk cost insight is sound—but economics reminds us that *ignoring abandonment costs* is just as irrational as clinging to sunk costs.
