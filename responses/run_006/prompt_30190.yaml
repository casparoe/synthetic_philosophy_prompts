answer: |-
  That's a sharp analysis, but I believe Hofstadter's satire successfully achieves its goal *despite* the historical difference. Here's why the satire doesn't backfire and why it *does* effectively challenge generic "man" and "he":

  1.  **The Core Mechanism: Making the Familiar Strange:** Hofstadter's brilliance lies in using a *different* attribute (race) to expose the underlying logic and emotional impact of using a dominant group's specific identifier as the "generic" term. By substituting "white" for "man," he forces readers who might be numb to the gendered implications of "man" to viscerally experience the exclusion and absurdity inherent in that linguistic structure. The shock value comes precisely because "white" hasn't historically been used that way – it highlights how *wrong* it feels. This shock then reflects back onto the familiar term "man," making its exclusionary nature suddenly visible and uncomfortable.

  2.  **Exposing the Argument from "Naturalness":** The satire directly targets the *argument* often used to defend generic "man" – that it's "natural," "historical," and "understood." By applying the *same* argument to "white" (even though it lacks the history), he reveals the argument's emptiness and circularity. Defenders of "man" say:
      *   "It's always been that way" (tradition).
      *   "Everyone understands it means 'human'" (convention).
      *   "Changing it is artificial/awkward/pandering" (resistance to reform).
      Hofstadter shows that if we accept this logic for *gender*, we must also accept it for *race*. If "man" is "natural" because of history and convention, then why isn't "white" equally "natural" if we *decide* to use it conventionally that way? The satire exposes that the defense of "man" relies not on pure logic or linguistic inevitability, but on *acceptance of male-as-default* baked into the culture and language over time. The discomfort with "white" reveals that the "naturalness" of "man" is contingent on social power structures, not inherent linguistic truth.

  3.  **Highlighting the Effect of Exclusion, Regardless of Intent:** The satire powerfully demonstrates the *effect* of such generic terms. Even if "man" was historically intended generically, its effect *now* (as in Hofstadter's time and ours) is often exclusionary or ambiguous. Numerous studies (like those by Wendy Martyna and others) have shown that generic "man" and "he" frequently trigger male-specific imagery in listeners/readers, marginalizing women. The satire uses the jarring effect of "white" to mirror this exclusionary effect of "man," making it impossible to ignore. The point isn't the *historical origin* of the term, but its *current impact* and the *bias* it perpetuates.

  4.  **The Satire's Target is the *Logic*, Not the *History*:** Hofstadter isn't primarily making a historical linguistic argument. He's satirizing a *contemporary rhetorical stance* used to resist inclusive language reform. The satire works because it takes the *logic* deployed by defenders of generic "man" ("it's traditional," "it's understood," "changes are artificial") and applies it to a context where that logic is immediately seen as indefensible (racial exclusion). This demonstrates that the logic itself is flawed and based on accepting the dominance of one group as the norm.

  **Why it Doesn't Leave "Man" Untouched:**

  The satire *doesn't* prove we should only reject *invented* reforms. Instead, it:

  *   **Undermines the Arguments for Keeping "Man":** By showing how easily the same arguments defend the absurd "white," it destroys the credibility of those arguments for defending "man."
  *   **Reveals the Harm:** It viscerally communicates the exclusion and bias inherent in using a subgroup's identifier as the generic term, forcing readers to empathize with that experience in the context of gender.
  *   **Demonstrates the Possibility of Change:** The very act of reading the satire forces the reader to adapt to a new (if absurd) linguistic convention ("white" as generic). This implicitly argues that adapting to *less* absurd and *more* inclusive conventions ("human," "person," "they," "he or she") is entirely possible and beneficial once the harm of the old convention is recognized.
  *   **Shows "Naturalness" is Malleable:** Language constantly evolves. What was "natural" (generic "man") becomes less so as society changes. The satire highlights that clinging to an exclusionary "naturalness" is a choice to prioritize tradition over inclusivity.

  **Conclusion:**

  The historical fact that "white" wasn't generic is irrelevant to the satire's effectiveness. Its power lies in using a shocking analogy to expose the flawed logic, inherent bias, and exclusionary impact of using a dominant group's specific term as the generic default. By making the familiar logic of defending "man" feel absurd and offensive when applied to race, Hofstadter brilliantly destabilizes that very logic and compels the reader to re-evaluate the acceptability of generic "man" and "he." It doesn't backfire; it uses the *difference* in historical usage as a tool to achieve its goal. The satire argues that long-established usage does *not* immunize a term from critique or reform, especially when that usage perpetuates inequality.
