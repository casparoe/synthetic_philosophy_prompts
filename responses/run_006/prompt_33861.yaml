  Okay, the user is on a city licensing commission facing a tough vote. A business that's legal and consensual but opposed on moral grounds. The opponents haven't shown any concrete harm—no crime, nuisance, or property value drops—just moral revulsion. The ordinance allows denying a license if it's "injurious to public morals." After a debate with a friend, the user is unsure how to vote. They want a draft opinion that recommends granting or denying, gives actionable reasons, addresses the losing side's points, and resolves an inconsistency with other licensed businesses like liquor stores and casinos.

  First, I need to figure out the core issue here. The business is lawful and consensual, so the opposition is purely based on subjective morality. The legal standard is "injurious to public morals." But what does that mean exactly? The user mentioned that in other cases, the commission licenses businesses despite moral objections, focusing only on tangible harms. So there's a conflict: why treat this case differently?

  The user needs a principled distinction. They’re bothered by the inconsistency. If moral revulsion alone isn't enough for liquor stores, why here? Or if it is, why not there? The opinion must clarify this principle to guide future decisions.

  I should start by recommending granting the permit. The opponents haven't shown concrete harm, which seems crucial. The term "public morals" probably requires more than personal distaste. Historical context like the Hart-Devlin debate comes to mind—should law enforce morality without harm? That supports limiting "public morals" to demonstrable community harm.

  Addressing the opposing view: the neighborhood association's revulsion is genuine, and communities do shape moral standards. But allowing denial here could set a precedent where any minority's morals override lawful businesses. That's problematic for a diverse society. Plus, the commission's past actions show they don't use morality alone for other controversial businesses, so consistency matters.

  The inconsistency with liquor stores etc. needs a clear principle. The key is whether the business causes direct harm versus offending sensibilities. Liquor stores are regulated for underage sales or noise—tangible issues. Payday lenders for predatory terms. Here, no such harms are claimed. The distinction is between concrete community injury and subjective offense. The opinion should state that "injurious to public morals" requires evidence of harm, not just distaste.

  For future commitments, the commission should consistently require proof of harm. This protects against arbitrary denials and respects legal businesses. It also aligns with how other permits are handled.

  Need to structure the opinion: start with facts, recommend granting, explain why moral revulsion isn't enough, address the counterargument, resolve the inconsistency with a principle, and outline future implications. Keep it concise and authoritative.
