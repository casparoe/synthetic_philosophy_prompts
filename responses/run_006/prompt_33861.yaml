  ## DRAFT COMMISSION OPINION: APPLICATION #2024-117

  **TO:** Licensing Commission Members  
  **FROM:** Commissioner [Your Name]  
  **RE:** Permit Application for [Business Type/Name] at [Address]; Recommendation to GRANT  
  **DATE:** [Current Date]  

  After careful review of the application, public testimony, and our governing ordinance, I recommend **GRANTING** the permit for the proposed business at [Address]. My reasoning, grounded in the legal constraints and precedents governing this Commission, is as follows:

  1.  **Absence of Demonstrable Harm:** Our ordinance authorizes denial if a use would be "injurious to public morals." While "public morals" is a broad term, our precedent and sound legal principles require it to be anchored in demonstrable harm to the community, not solely subjective moral disapproval. The opponents, while expressing sincere and strong moral revulsion, have explicitly conceded they cannot identify *any* specific, tangible harm – no increased crime, no nuisance (noise, traffic, litter), no blight, no adverse impact on property values, and no evidence of non-consensual or unlawful activity associated with the proposed operations. The business itself is lawful and operates on a consensual basis among adults.

  2.  **The Limiting Principle for "Public Morals":** The strongest argument against granting the permit rests on the sincere belief of the neighborhood association that the business is morally degrading and that licensing it implicitly condones this degradation, thereby injuring the community's moral fabric. I take this concern seriously. A community's shared values are important, and the law can sometimes reflect those values to prevent tangible harm or maintain public order. **However, allowing licensing decisions to be based solely on subjective moral offense, absent any claim of concrete harm, establishes a dangerously unworkable standard.** In a diverse community, moral viewpoints inevitably conflict. Granting this permit based on moral revulsion alone would empower any sufficiently vocal group to veto any lawful business they find morally objectionable – be it a bookstore selling certain literature, a restaurant serving particular cuisine, or a theatre presenting controversial plays – based purely on the intensity of their disapproval. Our ordinance requires "injurious," implying harm, not just offense.

  3.  **Resolving the Inconsistency:** This leads directly to the troubling inconsistency with our licensing of liquor stores, casinos, and payday lenders despite moral objections. The principle distinguishing these cases is **the presence or potential for concrete, measurable harm, not merely moral disapproval.** We license these businesses *because* they are lawful, but we impose specific, strict conditions precisely to *mitigate* the tangible harms associated with them:
      *   **Liquor Stores:** Regulated to prevent sales to minors, public intoxication, litter, loitering, and crime hotspots – demonstrable harms.
      *   **Casinos:** Regulated for gambling addiction resources, financial transaction oversight, security, and preventing criminal activity – specific, identifiable harms.
      *   **Payday Lenders:** Regulated to prevent predatory lending practices, usurious interest rates, and debt traps that cause financial ruin – concrete economic harms.
      We do not deny licenses to these businesses *solely* because some citizens find them morally objectionable. We deny them only if they cannot operate without causing, or without adequate safeguards against, the *specific, tangible harms* we are empowered to prevent. The absence of any analogous, demonstrable harm claim regarding the current application is the crucial distinction.

  **What This Principle Commits Us To:** Adopting this principle – that "injurious to public morals" requires evidence of concrete harm beyond subjective moral offense – provides clarity and consistency moving forward. It commits this Commission to:

  *   **Focusing on Evidence:** Requiring objectors to articulate and provide evidence of specific, tangible harms (crime, nuisance, blight, economic damage, threats to public safety/health) when invoking "public morals."
  *   **Rejecting Purely Subjective Vetoes:** Declining to deny permits based solely on the intensity of moral disapproval, however sincerely held, when no concrete harm is identified or reasonably foreseeable.
  *   **Upholding Lawful Activity:** Respecting the legislature's role in defining unlawful activity and ensuring that lawful businesses are not arbitrarily excluded based on the moral preferences of a segment of the community.
  *   **Applying Standards Uniformly:** Ensuring that the threshold for finding something "injurious to public morals" is applied consistently across *all* license applications, regardless of the nature of the business or the source of the objection.

  **Conclusion:** While I respect the moral convictions of the neighborhood association, our role as a licensing commission is not to enforce a particular moral code in the absence of demonstrable harm. The opponents have failed to show how this lawful, consensual business operation would cause the concrete injury to the community required by our ordinance. Granting this permit aligns with our consistent practice of focusing on tangible harms for businesses like liquor stores and casinos, and it upholds the principle that lawful activity cannot be prohibited based solely on subjective moral disapproval in a diverse society. I therefore vote to **GRANT** the permit.
