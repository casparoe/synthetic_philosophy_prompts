prompt: |-
  I'm a PhD student in philosophy working on just war theory and I've been deep in Anscombe's stuff — 'Mr. Truman's Degree,' 'War and Murder,' and *Intention*. Something's been nagging at me. She died in 2001, right before the U.S. drone program really took off. I'm trying to figure out what she'd say about targeted killing by drone.

  On one hand, you could argue drones are *better* than what she condemned. She went after Truman for intentionally killing innocents as a means — the civilians at Hiroshima and Nagasaki were the target, not collateral. Drone strikes at least *aim* at specific militants, and the civilian deaths are (supposedly) foreseen but not intended, which her own double-effect framework should in principle allow. So maybe she'd see drones as a move in the right direction.

  But then I think about her insistence that you can't just redescribe what you're doing to make it sound better — the intention is in the action itself, not in some private mental act you can point to later. And when you look at how drone programs actually operate — signature strikes where you don't even know who you're killing, 'combatant' defined so loosely it covers any military-age male in a strike zone — it starts looking a lot like the kind of indiscriminate killing she thought was absolutely ruled out. She was pretty clear that if you're willing to kill the innocent as a means, the whole moral framework has already collapsed.

  So what do you think? Would Anscombe condemn the drone program in the same terms she used against Truman, or would she see a morally relevant difference? And does the physical distance of the operator matter to her framework at all, or is that just a red herring?
reasoning: |-
  Okay, let me unpack this PhD student's query about Anscombe and drone warfare. They're clearly deep in her work - citing specific texts and grappling with her core concepts like intention and double effect. The Truman comparison is sharp: they're spotting a tension between theoretical permissibility under double effect versus the practical realities of signature strikes.

  Hmm, the student's real struggle seems to be about consistency in applying Anscombe's framework. They're not just asking "what would she think" but testing whether her principles hold against modern warfare. That "nagging" feeling suggests they sense drones might expose a flaw in or evolution of just war theory.

  First angle: the student's right that Anscombe might initially see drones as progress. Precise targeting appears to satisfy her objection to Truman's direct targeting of innocents. But I recall her Wittgensteinian roots - she'd demand we look at the action's grammar. When they mention signature strikes redefining "combatant," that's exactly the linguistic manipulation she'd pounce on.

  Important nuance: the student's hinting at institutional intentionality. When policy definitions make civilian deaths systemic rather than accidental, that crosses Anscombe's red line about "willingness to kill innocents." The combat-age-male example is perfect - it mirrors Hiroshima's dehumanizing categorization.

  Physical distance... interesting they flagged that. Anscombe would likely dismiss it as morally irrelevant. Her objection to Truman wasn't about proximity but about the will's orientation. A remote operator deliberately pressing a button after faulty intelligence is still intending to kill that blurry figure on screen.

  Wait - the student's buried question might be about moral epistemology. With Truman, the immorality was clear-cut (entire cities vaporized). Drones create moral fog through bureaucratic diffusion: who "intends" when intelligence officers mislabel targets, lawyers redefine proportionality, and operators just follow orders? Anscombe's Intention would demand we trace the chain of practical reasoning.

  Biggest hurdle: applying 1940s framework to 21st-century tech. Would Anscombe update her criteria? Unlikely - she'd probably argue that removing warriors from physical danger exacerbates the vice of cowardice she condemned. Her "war and murder" piece connects virtue to risk-taking.

  Ultimately the student seems to suspect Anscombe would condemn both Truman and drones as species of the same moral failure. The through-line is institutionalized contempt for innocent life, whether through atomic annihilation or bureaucratic kill lists. That's where I should emphasize the continuity in her thought.
answer: |-
  Your question cuts to the heart of Anscombe's moral rigor and the challenge of applying principles developed for conventional warfare to asymmetric conflicts and remote technologies. Based on her core arguments in "Mr. Truman's Degree," "War and Murder," and *Intention*, here's a reasoned analysis:

  **Why Anscombe Would Likely Condemn the Drone Program (Especially Signature Strikes & Broad Definitions):**

  1.  **The Primacy of Intention in the Act Itself:** As you rightly note, Anscombe rejected mental gymnastics. Intention isn't a private feeling you rationalize later; it's inherent in the *description of the action you choose to perform*. If you launch a missile into an area where you know non-combatants are intermingled with suspected militants (especially under "signature strike" logic), the act is *intentionally creating a situation where non-combatant deaths are highly probable and accepted as part of the operation's cost*. This isn't "collateral damage" in the morally permissible double-effect sense; it's closer to *reckless endangerment* or even *intentional use of force likely to kill innocents as a condition of success*. For Anscombe, foreseeing the outcome as virtually certain **is** intending it in the moral sense relevant to murder.

  2.  **The Redescription Problem (Hiroshima Parallel):** She condemned Truman for *directly targeting* civilians (the cities) to break Japanese morale. Drone programs that:
      *   Use "signature strikes" (targeting based on behavior patterns without positive ID).
      *   Define "combatant" as "military-age male in an area of terrorist activity".
      *   Employ "continuous combat function" definitions that blur the civilian/combatant line.
      ...are engaging in precisely the kind of *redescription* she abhorred. By redefining vast categories of people as legitimate targets based on location, gender, age, or inferred association – rather than *concrete hostile action* – the program effectively *intends* to kill individuals who, under traditional JWT and her principles, are innocent non-combatants. This mirrors the logic of Hiroshima: expand the target category to achieve the strategic goal. She would see this as collapsing the absolute prohibition on intentional killing of the innocent.

  3.  **The Requirement of Discrimination:** Anscombe, rooted in classical JWT, held discrimination as non-negotiable. You must *aim* only at legitimate military targets. The practices above demonstrate a systemic failure of discrimination. If you don't know *who* you're killing ("signature strikes"), or define the target group so broadly it includes non-combatants by default, you cannot possibly be *discriminating* in the required sense. The action itself becomes indiscriminate, thus intrinsically immoral.

  4.  **The Corruption of Double Effect:** She accepted double effect *in principle*, but with stringent conditions:
      *   The *act itself* must be good or neutral (e.g., attacking a legitimate military target).
      *   The *intention* must be only the good effect (destroying the target); the bad effect (civilian death) must not be intended *as a means or an end*.
      *   The good effect must be sufficiently grave to permit the foreseen bad effect.
      *   There must be proportionality between the good and bad effects.
      Drone strikes often fail this test:
      *   **Act itself:** Questionable if the target isn't verified (signature strikes) or is defined too loosely.
      *   **Intention:** If civilian presence is foreseeable and strikes proceed anyway, especially when their death or terror contributes to the strategic effect (deterrence, disruption), it suggests they *are* being used as a means or their death is accepted *as part of the goal*.
      *   **Proportionality:** The cumulative toll of civilian deaths, destruction of homes/infrastructure, and terror inflicted on communities often seems disproportionate to the killing of low-level militants, especially under broad definitions. Anscombe would demand rigorous, honest proportionality assessments she likely wouldn't see in current practice.

  **Where Drones *Might* Get Scrutiny, Not Automatic Condemnation:**

  *   **Truly Discriminate Strikes:** A strike against a *positively identified, actively plotting, high-value militant* in a truly isolated location, with minimal foreseeable civilian risk, and where collateral damage is genuinely unintended and minimized, *might* pass Anscombe's double-effect test *in principle*. However, she would be deeply skeptical of intelligence claims and operational realities achieving this ideal consistently.
  *   **Proportionality in Self-Defense:** If a drone strike were the *only feasible means* to stop an imminent, catastrophic attack, and civilian casualties were minimized and truly unintended, the proportionality bar *might* be met. But she would demand this be the exception, not the norm of a continuous campaign.

  **Physical Distance: A Red Herring?**

  *   **Morally Irrelevant to Intention:** Anscombe would emphatically reject distance as a morally relevant factor. The moral character lies in the *intention* and the *nature of the act chosen*. Pulling a trigger from 8,000 miles away is still the *intentional act of killing a human being*. The physical ease and lack of risk to the operator might exacerbate the *vice* of cowardice (which she condemned in "War and Murder") or promote callousness, but it doesn't change the fundamental moral structure of the act itself. Murder is murder, whether done face-to-face or via satellite link. Distance might make the *reality* of the death easier to ignore psychologically, but it doesn't alter its *moral reality*.

  **Conclusion:**

  Anscombe would likely condemn the **current practices** of the US drone program (especially signature strikes, broad definitions of combatant, and systemic acceptance of civilian casualties) **in terms strikingly similar to her condemnation of Truman.**

  *   **Core Reason:** Both involve the *intentional killing of the innocent* through a corrupted application of double effect and a failure of discrimination, masked by strategic redescription (civilians as "morale targets" then, "military-age males" or "signature terrorists" now).
  *   **Difference in Degree, Not Kind:** While drones *could* be used more discriminately than a nuclear bomb, the *institutional practices* and *underlying logic* of many strikes replicate the core moral failure she identified: the willingness to kill individuals who are not legitimate military targets as a means to an end (security, disruption, deterrence), effectively treating them as expendable.
  *   **Distance Doesn't Absolve:** The remoteness of the operator is irrelevant to the moral assessment of the act's intention and permissibility. It might make the act psychologically easier, but not morally different.

  Her likely verdict would be that the drone program, as typically implemented, represents a **systematic violation of the absolute prohibition against intentional killing of the innocent** and constitutes **state-sanctioned murder**, just as the bombing of Hiroshima and Nagasaki did. She would demand a return to genuine discrimination and a rejection of any doctrine or practice that intentionally blurs the line between combatant and non-combatant. Her rigor leaves little room for the moral ambiguities often invoked to justify contemporary targeted killing practices.
