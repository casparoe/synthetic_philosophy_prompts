  Also, considering the time limit, the activity must be concise. A multi-stage group activity might work: start with individual intuition, then group discussion, then a whole-class scenario. The inheritance scenario seems promising because it introduces personal stakes—deciding who gets an inheritance based on identity. This could make the abstract question more tangible. Students might initially focus on traits but then realize origin matters when hypothetical duplicates appear. Candy can be used as a low-stakes reward to keep engagement high.

