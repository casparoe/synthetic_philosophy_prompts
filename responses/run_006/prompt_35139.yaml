answer: |-
  Here’s a structured activity designed to surface origin essentialist intuitions, followed by a debrief plan. It leverages personal stakes, hypothetical scenarios, and group negotiation to make the abstraction tangible—without naming the position upfront.

  ---

  ### **Activity: "The Inheritance Dilemma"**  
  **Time:** 45 mins  
  **Materials:** Whiteboard, markers, index cards (1 per student), candy (optional incentive)  

  #### **Setup (5 mins)**  
  1. Rearrange chairs into 3 groups of ~5 students each.  
  2. Write on the whiteboard:  
     > *"A billionaire philosopher dies. Their will states: 'My fortune goes to [Student Name]—but ONLY the **original** person I knew. Clones, duplicates, or impostors get nothing.'"*  
     *(Replace [Student Name] with an actual student's name—e.g., "Chloe")*  
  3. Hand each student an index card: "You are a lawyer arguing for your client. Your client claims to be the **real** Chloe."  

  #### **Phase 1: Warm-Up Dilemma (10 mins)**  
  - Present this scenario verbally:  
    > *"Chloe was in a lab accident. Simultaneously:*  
    > *– An exact biological duplicate of Chloe (same memories, personality, scars) materializes 1 mile away.*  
    > *– The original Chloe’s body is repaired perfectly in the lab.*  
    > *Both claim to be the real Chloe. Who gets the inheritance?"*  
  - **Task:** Groups have 5 mins to pick **one** claimant and write their argument on the board.  

  #### **Phase 2: Group Inheritance Challenge (20 mins)**  
  - Give all groups the same new scenario:  
    > *"Now, TWO claimants appear:*  
    > *– **Claimant A:** Born from Chloe’s original sperm and egg, but raised in total isolation with fake memories of Chloe’s life.*  
    > *– **Claimant B:** Born from different sperm/egg, but has Chloe’s exact memories, personality, and brain structure (due to futuristic tech).*  
    > *Both appear identical. Who is the 'original' Chloe?"*  
  - **Rules:**  
    - Groups must reach a **unanimous decision**.  
    - Arguments must reference *what makes someone "Chloe"* (biology? memory? origin?).  
    - Assign roles: 1 facilitator (keeps convo on track), 1 scribe (notes arguments), 1 skeptic (challenges assumptions).  
  - **Incentive:** The most persuasive group (voted by peers) wins candy.  

  #### **Phase 3: The Twist (10 mins)**  
  - Reveal a final scenario:  
    > *"Claimant C emerges: genetically identical to Chloe, created from her childhood hair follicle, with uploaded memories. She says: 'I’m the true Chloe—my origin is her body!'"*  
  - **Task:** Groups have 5 mins to decide if this changes their verdict. No need for unanimity.  

  ---

  ### **Predictable Challenges & Mitigation**  
  - **"This is sci-fi nonsense!"** → Stress: *"We’re testing intuitions, not realism. Imagine it’s possible—what would you say?"*  
  - **Groups deadlock** → Encourage the skeptic to force a vote. Deadlocks themselves reveal tension.  
  - **Overfocus on "memories"** → Ask: *"If Claimant B’s memories were implanted, does that make them less Chloe?"*  
  - **Dominant voices** → Role assignments (skeptic/facilitator) distribute engagement.  

  ---

  ### **Debrief (15 mins)**  
  **Goal:** Connect their struggles to philosophical concepts, acknowledge contested ground.  

  1. **Map the Battlefield (5 mins)**  
     - Ask: *"What criteria did you use for 'being Chloe'?"* List answers on board (e.g., "DNA," "memories," "original body").  
     - Circle biology/origin-based answers: *"This intuition—that your specific origin is necessary—is called **origin essentialism**."*  
     - Star memory/psychology-based answers: *"This is **psychological continuity theory**."*  

  2. **Expose the Tension (5 mins)**  
     - Point out contradictions: *"In Phase 1, most pick the repaired original. In Phase 2, groups split. Why?"*  
     - Highlight: *"Origin essentialism says: Different sperm/egg? Not you. Psychological continuity says: Same mind? Still you."*  
     - **Key insight:** *"Your gut agreed with origin essentialism when duplicates threatened identity (Phase 1), but it clashed with psychology in Phase 2."*  

  3. **Contextualize the Debate (5 mins)**  
     - **Settled:** No consensus. Kripke (*Naming and Necessity*) argues origin is essential; Parfit (*Reasons and Persons*) says identity isn’t what matters—survival via psychology does.  
     - **Contested:** Whether biology defines *numerical identity* (being the *same* entity) or just *qualitative similarity*.  
     - **Limitations of the activity:**  
       - It frames identity as binary (same/different), but some philosophers see degrees of "survival."  
       - It can’t resolve if origin is *metaphysically* essential or just how *we track* identity (epistemic).  
       - Smuggled assumption: That "Chloe" refers to a persisting entity. Bundle theorists reject this.  

  4. **Open the Door Further**  
     - Challenge: *"If origin is essential, are you still you if 51% of your cells are replaced by clones?"*  
     - Conclude: *"This isn’t solved. But now you see why your classmates were torn: biology feels fundamental, yet we care about our minds."*  

  ---

  ### **What the Activity Captures (and What It Doesn’t)**  
  | **Strengths**                                  | **Limitations**                                  |  
  |------------------------------------------------|-------------------------------------------------|  
  | Surfaces **pre-theoretical intuitions** for origin essentialism | Can’t disentangle **metaphysical** (what *is* identity) vs. **epistemic** (how we *know* it) claims |  
  | Forces confrontation with **duplicate scenarios** (Kripke’s "no branching" rule) | Smuggles **causal history** as central—opponents may reject this |  
  | Shows **psychological continuity** as a rival (Parfit) | Doesn’t address **four-dimensionalism** (identity over time) |  

  ---

  ### **Philosophical Ground Truth**  
  - **Kripke’s origin essentialism** is influential but **not consensus**. Many metaphysicians accept it for biological organisms; others reject it for persons.  
  - **The debate is alive**: Neo-Lockeans (like Olson) argue biology is irrelevant to *personal* identity; animalists (like Snowdon) say you *are* your organism.  
  - **What’s uncontroversial**: This is squarely in the domain of *modal metaphysics* (how things *could be*), where thought experiments are valid tools.  

  This design makes the invisible tug-of-war over identity visceral. Students will leave knowing *why* their disagreement runs deep—and that philosophy won’t hand them easy answers.
