prompt: |-
  ok so I just spent an hour going back and forth with a friend about disjunctivism and the argument from illusion, and I want to turn it into a handout for my philosophy of perception seminar. Build me a thought experiment where a disjunctivist and a common-kind theorist about perceptual experience agree about the subject's first-person report and behavior, but still disagree about the metaphysics of the experience. Set it up like this: the subject has a veridical perception and a subjectively matching illusion, and the common-kind theorist says the two episodes share a fundamental kind of mental state while the disjunctivist denies that. The scenario has to be ordinary — a kitchen, an office, a street corner — no labs, no evil demons, no brains in vats. Keep the scenario itself to a paragraph, and pick an illusion the subject can know about and still be taken in by, so the disagreement cant be dissolved just by giving the subject more information. The case has to generate the verdicts rather than stipulate them. After the scenario, walk through: (1) the verdict each theory gives and why they agree at the level of the subject's report and behavior; (2) the exact point where they split; (3) which feature of the case is doing the work, and what happens if you remove it; and (4) the strongest objection the common-kind theorist would press against the disjunctivist's use of the case. oh, and please write the answer in American English.
