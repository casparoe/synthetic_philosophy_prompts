  Okay, let me start by unpacking the user's query. They're describing a common practice in natural sciences where existing evidence supports a new theory, even though that evidence was known before the theory existed. The examples given are the anomaly in Mercury's orbit supporting general relativity, coastlines fitting for continental drift, and known regularities explained by new theories. The user is asking what theory of evidence this implies, especially whether it conflicts with Bayesian updating.

  First, I need to figure out the core issue here. The user is questioning if standard Bayesian confirmation can handle cases where old evidence confirms a new theory. Bayesianism typically updates on new information, but here the evidence isn't new. The user mentions two responses: the counterfactual approach (probability of evidence without the theory) and the learning-the-theory approach. I should explore both.

  The user wants a reconstruction of the implicit epistemology. So, what do scientists actually assume when they accept old evidence as confirmation? They seem to value explanatory fit—how well the theory makes sense of existing facts. This aligns with hypothetico-deductivism or abduction. The practice suggests that confirmation isn't just about new data but about coherence with the entire body of knowledge.

  Next, I need to assess coherence. The practice is internally consistent but clashes with strict Bayesian conditionalization. The counterfactual approach tries to bridge this but has issues like specifying which background knowledge to remove. The learning-the-theory approach treats accepting the theory as new info, which might be a stretch. The underdetermined parts are whether scientists implicitly use counterfactuals or if it's purely about explanatory power.

  Then, imagining a strictly diachronic Bayesian world: scientists would ignore old evidence for new theories. That means anomalies like Mercury's orbit wouldn't support GR until after it's proposed and confirmed by new predictions. This seems inefficient and ignores the rational aspect of theory choice based on existing knowledge. The costliest loss would be the ability to leverage existing data for theory evaluation, making science slower and less cumulative.

  The user's deeper need might be understanding the philosophy behind scientific practice and whether Bayesianism can fully account for it. They might be interested in the tension between formal models and real-world science. Highlighting the explanatory coherence as central to scientific reasoning addresses why the practice persists despite theoretical challenges.
answer: |-
  This scientific practice reveals a deep tension between actual scientific reasoning and a naive application of Bayesian conditionalization. Let's reconstruct the implicit epistemology, assess its coherence, and contrast it with a strict diachronic Bayesian view.

  **Reconstructing the Implicit Epistemology:**

  1.  **Core Principle: Explanatory Coherence as Confirmation:** The practice presupposes that **a hypothesis is confirmed by its ability to provide a compelling explanation for existing, well-established facts**. The value lies in the *fit* or *explanatory power* the hypothesis exhibits towards the known body of evidence.
      *   *Presupposition:* This view inherently assumes that confirmation is fundamentally about the **logical or probabilistic relationship between the hypothesis (H) and the evidence (E)**, considered synchronically (at a point in time), rather than being solely defined by the *diachronic process* of updating beliefs upon learning E.
      *   *Coherence:* This principle is internally coherent. It aligns with common sense and scientific intuition: a good theory *should* make sense of what we already know. It forms the basis of hypothetico-deductive (H-D) confirmation (if H entails E, and E is true, then E confirms H) and abductive reasoning (inference to the best explanation - IBE). It treats the known evidence as a constraint that any viable theory must satisfy.

  2.  **Role of Novelty:** While explanations of old evidence are valued, novel predictions are often seen as *more* impressive.
      *   *Comfortable Fit:* This fits well with the view that novel predictions are less susceptible to charges of ad hoc tuning or data dredging. Explaining known facts is necessary; successfully predicting *unknown* facts is a stronger test. This is compatible with Bayesianism (where novel predictions can yield very high likelihood ratios) and with Popperian emphasis on riskiness.

  3.  **Status of Known Evidence (E):** E is treated as fixed, certain background knowledge.
      *   *Presupposition:* This strictly presupposes that the **certainty of E does not nullify its confirmatory power** for a *new* H. The relevant probability is not P(E) (which is 1), but P(E | H) compared to P(E | ~H) or compared to P(E | competing theories). The practice assumes that **P(E | ~H) or P(E | background knowledge alone) is significantly less than 1**.
      *   *Underdetermined:* The practice itself doesn't strictly presuppose *how* P(E | ~H) is determined or compared. It simply relies on the judgment that the new theory explains E *better* than the previous understanding did.

  **Can Bayesianism Absorb the Practice?**

  Yes, but not without significant modifications to a naive diachronic model. The core challenge is assigning a probability less than 1 to E, which is already known (P(E) = 1).

  1.  **Counterfactual ("Old Evidence") Approach (e.g., Garber, Jeffrey, Howson):**
      *   *Mechanism:* Consider the probability E *would have had* **before E was learned** (or before the relevant background knowledge making E certain was acquired), conditional on the *new* H and the *relevant* background knowledge (K) *excluding the certainty of E itself*. Calculate the likelihood ratio: [P(E | H & K-) / P(E | ~H & K-)], where K- is background knowledge *without* the certainty of E.
      *   *Coherence:* Conceptually coherent within Bayesianism, but practically problematic.
      *   *Problems:* Defining K- precisely is difficult and often seems artificial ("Which specific piece of knowledge made E certain? What exactly is removed?"). Assigning probabilities counterfactually is highly subjective and lacks clear operational guidance for scientists in real time. The practice itself does not *strictly presuppose* this complex counterfactual calculation; scientists intuitively judge explanatory fit without explicitly reconstructing past probabilities.

  2.  **"Learning the Theory" Approach (e.g., Hacking):**
      *   *Mechanism:* Treat the *proposal of the new theory H* itself as the new information learned. Update beliefs *about H* based on how well H fits the existing evidence E. This involves recognizing the logical relationship (entailment, high probability) between H and E.
      *   *Coherence:* More naturalistic than the counterfactual approach. It captures the moment of "Eureka!" when the theory makes known facts suddenly make sense.
      *   *Fit:* Comfortably fits the practice. Scientists *do* learn something new (the theory) and judge its fit with known evidence. However, this stretches the standard Bayesian notion of "learning evidence" to include "learning hypotheses". The practice *fits comfortably* with this view but doesn't strictly *presuppose* it as the formal mechanism; the focus remains on the fit itself.

  **Underdetermined Aspects:**

  *   The practice doesn't strictly require a *single* formal mechanism (counterfactual vs. learning-the-theory). It only requires the *judgment* that H explains E better than the alternatives/pre-theoretic understanding.
  *   It doesn't strictly presuppose whether the confirmatory power comes from logical entailment, high probability, or a more qualitative notion of explanatory unification.

  **A Strictly Diachronic Bayesian World (Conditionalization Only on New Evidence):**

  If scientific practice were governed by a rule where only *newly learned* evidence could update beliefs via conditionalization, and known evidence (P(E)=1) was confirmationally inert:

  1.  **Theory Choice Would Look Radically Different:**
      *   **Old Evidence Ignored for Confirmation:** Known anomalies (Mercury's orbit), patterns (fossil distributions), or regularities could *never* be cited as positive evidence *for* a new theory. They could only be used to falsify existing theories if they contradicted them. A new theory would start with a prior probability based on simplicity, etc., but its ability to explain existing facts would not increase its probability.
      *   **Exclusive Focus on Novel Predictions:** The *only* way a new theory (H) could gain confirmation would be by making successful *novel predictions* (predicting evidence E_new that was not known when H was proposed). Confirmation would be purely prospective.
      *   **Stagnation of Anomalies:** Well-known anomalies would persist indefinitely. They could motivate the search for new theories, but no new theory could be *confirmed* by resolving them. Only if the new theory also made successful novel predictions could it be accepted, *despite* also explaining the old anomaly.
      *   **Rejection of Abduction/IBE:** The core reasoning pattern of inferring the best explanation for known facts would be invalid as a means of confirmation.
      *   **Theory Introduction as Logically Neutral:** Proposing a theory that entailed all known evidence would confer no advantage over proposing a theory incompatible with some known evidence, as long as neither made novel predictions yet. Only when tested against *new* data would their probabilities diverge.

  **The Most Costly Feature to Surrender:**

  The feature of actual scientific practice that would be most costly to surrender is the **ability to use the explanatory fit between a new theory and the vast body of *already established knowledge* as a powerful, legitimate, and often decisive source of confirmation.**

  *   **Why it's Costly:**
      1.  **Inefficiency:** It ignores the rational insight that a theory which coherently explains *everything we know* is inherently more credible than one that does not, even before new predictions are tested. Waiting solely for novel predictions would slow scientific progress enormously.
      2.  **Loss of Rational Constraint:** It severs the crucial link between theory and the existing empirical foundation. Theories wouldn't need to be constrained by or make sense of known facts to gain acceptance, only by their ability to predict the unknown. This could lead to acceptance of theories that are ad hoc for new predictions but wildly inconsistent with existing knowledge.
      3.  **Undermining Cumulative Knowledge:** Science builds cumulatively. Surrendering the confirmatory power of old evidence denies the rational weight of this cumulative structure in evaluating new ideas. An anomaly resolved becomes merely a historical footnote, not evidence for the theory that resolved it.
      4.  **Misrepresentation of Scientific Reasoning:** It fails to capture the profound "aha!" moment when a new theory makes disparate, well-known facts fall into place, a moment scientists universally recognize as a strong argument *for* the theory. Surrendering this ignores a core driver of scientific insight and theory acceptance.

  **Conclusion:**

  Actual scientific practice presupposes that **confirmation arises from the explanatory relationship (fit, entailment, coherence) between a hypothesis and the total body of relevant evidence, regardless of the temporal order in which the evidence was learned.** This synchronic view of confirmation as logical/explanatory fit is coherent and fundamental to scientific reasoning, embodied in abduction and hypothetico-deductivism. While Bayesianism *can* be stretched to accommodate this practice (via counterfactual likelihoods or treating theory-learning as evidence), these maneuvers are complex and arguably less natural than the intuitive judgment of explanatory coherence made by scientists. A strict diachronic Bayesian rule rendering known evidence inert would cripple scientific practice by eliminating the primary rational basis for judging a new theory's plausibility based on its ability to make sense of what we already know. The cost of surrendering the confirmatory power of explanatory fit with established facts would be prohibitively high, leading to stagnation and irrational theory choice.
