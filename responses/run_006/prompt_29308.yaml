answer: |-
  You're absolutely right to be skeptical - while your friend captures the *starting point* of Austin's work brilliantly, her summary oversimplifies its development and ultimate conclusions. Austin himself famously *collapsed* the very distinction she presents as settled. Here's a breakdown:

  **Parts of her summary that are accurate or acceptable:**

  1.  **Performatives "do something":** This is core to Austin's initial insight. Utterances like "I promise," "I bet," "I pronounce you married" are acts in themselves, not descriptions of acts.
  2.  **Felicity vs. Truth/Falsity:** Austin correctly argued that performatives succeed or fail based on **felicity conditions**, not truth conditions. These conditions include:
      *   **Appropriate participants & circumstances:** (e.g., only authorized people can pronounce marriage, a promise requires an audience).
      *   **Correct & complete execution:** (e.g., saying the exact words required by a procedure).
      *   **Subsequent conduct:** (This is where sincerity *initially* comes in for Austin, contrary to your friend's claim - see below).
  3.  **Performatives aren't descriptions:** Saying "I promise" isn't *describing* the act of promising; it *is* the act (under the right conditions).

  **Oversimplifications and Problems:**

  1.  **The Sincerity Claim is Wrong/Misleading (Crucial Point!):**
      *   Your friend says: *"you can't really ask whether the speaker was being sincere — the act happens as soon as the words come out... whether they intend to keep the promise is a separate ethical question."*
      *   Austin's View: **Sincerity *is* a core felicity condition.** For a promise to be *fully felicitous* (or "happy"), the speaker must *intend* to do the promised thing. Austin called insincere promises **Abuses**. The act *is* performed (it exists as a promise), but it's **infelicitous** *because* it's insincere. It's not "merely" an ethical question external to the speech act; the *act itself is flawed* due to the lack of requisite intention. Asking "Were they sincere?" *is* asking about the felicity of the speech act.
  2.  **The Neat Performative/Constative Split Collapses:**
      *   Your friend says: *"language splits neatly into two kinds... performatives... and constatives... most of language is constative, and performatives are a special marked-off class."*
      *   Austin's Development: This was his *starting hypothesis*. However, as he explored it in his lectures ("How to Do Things with Words"), he found it impossible to maintain:
          *   **Performatives can be true/false:** Statements like "I *state* that the cat is on the mat" are simultaneously a performative act (stating) *and* a constative (describing the cat's location) which can be true or false.
          *   **Constatives involve performative force:** Even simple descriptive statements ("The cat is on the mat") *are* actions: acts of stating, informing, asserting, etc. They also have their own felicity conditions (e.g., the speaker must believe it, have evidence).
          *   **Explicit vs. Implicit Performatives:** "I promise to be there" (explicit performative) and "I'll be there" (implicit performative) both *perform* the act of promising. The difference is in explicitness, not a fundamental categorical divide.
      *   **Austin's Conclusion:** He abandoned the performative/constative dichotomy as unsustainable. He realized that *every* meaningful utterance is simultaneously both a locutionary act (producing sounds/words with meaning) *and* an **illocutionary act** (performing an action *in* saying something: promising, stating, warning, asking, commanding, etc.). *This is the core lasting contribution of speech act theory.*

  **The Fate of "Performatives as a Special Marked-Off Class":**

  *   **Doesn't Survive:** This conclusion is explicitly rejected by Austin in his later lectures. He realized performativity wasn't a special class of *sentences*, but a dimension inherent in *all* utterances.
  *   **What Survives:** The concept of **Explicit Performative Utterances**. These are a specific grammatical *form* (1st person singular present indicative active verb: "I promise", "I bet", "I declare") used to make the illocutionary force maximally explicit. They are a recognizable linguistic *device*, but they are just one way (albeit a very clear one) of performing an illocutionary act. The *act* performed (promising, betting) can be done without using this explicit form ("I'll be there tomorrow" = promise).

  **Careful Speech Act Theorist's View (Post-Austin):**

  1.  **All Utterances Have Illocutionary Force:** Every utterance is doing something (asserting, questioning, promising, exclaiming, etc.) in addition to having a meaning.
  2.  **Felicity Conditions Apply Widely:** Illocutionary acts succeed or fail based on felicity conditions, which vary by act type. These typically include:
      *   **Preparatory Conditions:** (e.g., For a promise: Speaker believes the hearer wants the action done; it's not obvious it would happen anyway).
      *   **Sincerity Condition:** (e.g., For a promise: Speaker intends to do the action).
      *   **Essential Condition:** What the utterance *counts as* (e.g., undertaking an obligation for a promise).
  3.  **Truth/Falsity Still Matters for Assertives:** While *all* utterances have an illocutionary force, acts like stating, asserting, informing (the "assertive" class) also carry a commitment to truth and can be judged true or false *in addition* to being felicitous or infelicitous.
  4.  **Explicit Performatives are a Useful Subtype:** They are a clear grammatical way to *name* the illocutionary act being performed, but they are not fundamentally different in *kind* from other ways of performing that act.

  **Conclusion:**

  *   **Where she's spot on:** Performatives as acts, felicity conditions being crucial for them, the inadequacy of truth/falsity alone.
  *   **Major Oversimplification:** The claim that sincerity is irrelevant to the speech act itself and purely "ethical". (Austin saw it as key to felicity).
  *   **Fundamentally Incorrect/Outdated Conclusion:** The idea of a "neat split" between performatives and constatives, and performatives being a distinct, "special marked-off class" of utterances separate from most language. Austin himself dismantled this. The "special marked-off class" idea *does not survive* scrutiny.
  *   **The Upshot:** Austin's genius wasn't in creating a lasting binary, but in revealing the **performative dimension inherent in *all* language use** – that *saying* is always *doing* something (an illocutionary act), governed by complex rules (felicity conditions) beyond mere truth. Speech act theory, developed further by Searle and others, focuses on classifying these *acts* (illocutionary forces) and their conditions, not on segregating a special class of sentences.

  Your vague memory is correct: Austin *did* back off the sharp performative/constative distinction. Your friend has accurately described the *starting point* of his lectures but missed the crucial evolution of his argument and its revolutionary conclusion. The real "upshot" is that language is *far less* "neat" and *far more* action-oriented than her summary suggests.
