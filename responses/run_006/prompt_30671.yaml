prompt: |-
  In a seminar on information cascades and rational herding, a classmate waved off a worry about a bank run by saying that "everyone can't be wrong." His move was this: if enough depositors are withdrawing, the best explanation of their behavior is that each has good private reasons, so a rational observer should withdraw too, and the run itself becomes evidence that the bank really is in trouble. I am fairly sure that slogan is doing more work than he has acknowledged, but I cannot yet say exactly which work it is doing. I want you to separate the distinct precise claims "everyone can't be wrong" could be used to express — for instance, claims about the accuracy of independent judgments pooled across many people, claims about markets or crowds aggregating dispersed private information, claims about what a rational agent may infer from observing the actions of others, and claims about the improbability of a large group converging on a falsehood. For each reading, spell out the conditions it assumes (independence of signals, observability of actions, common knowledge of rationality, and the like), whether it is true under those conditions, how it fares once agents observe and imitate one another rather than decide independently, and whether that reading would actually support the inference from a run on the bank to the bank's being in trouble. Lay the readings out as a menu rather than defending one interpretation, flag which are trivial, and say which ones would genuinely do the work my classmate's argument needs.
reasoning: |-
  Okay, the user is asking about the phrase "everyone can't be wrong" in the context of bank runs and information cascades. They mentioned their classmate used it to dismiss worries about bank runs, suggesting that if many people withdraw, it must mean the bank is truly in trouble. The user suspects this slogan is oversimplified and wants me to break it down into different precise interpretations.

  First, I need to recall the key concepts here: information cascades, rational herding, and how individuals make decisions based on others' actions. The classmate's argument seems to rely on the idea that a crowd's action aggregates private information correctly. But as the user pointed out, this might not hold when people are influenced by each other.

  The user wants me to list distinct interpretations of "everyone can't be wrong," each with assumptions, truth conditions, and applicability to the bank run scenario. They also want to know which interpretations support the classmate's argument. I should cover aspects like independent judgments, information aggregation, rational inference from actions, and the improbability of large-scale error.

  Let me start with the first interpretation: Condorcet's Jury Theorem. This applies when individuals have independent signals and vote based on them. The theorem says that as more people vote, the majority decision becomes more accurate. But in a bank run, depositors aren't voting; they're acting sequentially, and later actors can see earlier actions. Independence is broken once people observe others. So this might not hold in cascades.

  Next, the Wisdom of Crowds. This is about aggregating diverse, independent estimates. Again, in a bank run, if people are imitating, their estimates aren't independent. The average might not converge to the truth. So this interpretation doesn't support the classmate's argument well.

  Then there's Bayesian Updating with Observational Learning. Here, a rational agent observes others' actions and updates their belief. If early depositors withdraw based on strong signals, later ones might follow even with weak signals, leading to a cascade that could be wrong. So while this model explains why runs happen, it doesn't guarantee that the run is correct. The classmate's inference isn't always valid here.

  The fourth interpretation is the Improbability of Large-Scale Error. The idea is that it's statistically unlikely for many people to be wrong if they act independently. But in a cascade, their actions aren't independent; they're correlated through observation. So a run can happen even if the bank is solvent. This doesn't support the argument.

  The Common Knowledge of Rationality point is interesting. If everyone is rational and knows others are rational, then a run might indicate trouble. But in reality, not everyone is rational, and there might be coordination failures or panic. So this is too idealized.

  Lastly, the Self-Fulfilling Prophecy aspect. Bank runs can be self-fulfilling because the run itself causes the failure. Here, "everyone can't be wrong" is tautological—the run causes the problem, so it's "right" in a sense, but not because the bank was inherently troubled. This is trivial and doesn't support the classmate's point about the bank's fundamental health.

  Putting it all together, the Bayesian Updating and Self-Fulfilling Prophecy interpretations might be what the classmate is implicitly using. However, the Bayesian one doesn't guarantee correctness in cascades, and the self-fulfilling one is trivial. The user needs to see that the slogan overlooks dependencies in observational learning, where cascades can lead to incorrect herding.

  The user's deeper need is to critique the classmate's argument by exposing the flawed assumptions. They might be preparing for a discussion or paper, so providing clear, structured interpretations helps them dismantle the slogan's misuse. Highlighting the lack of independence in signals during cascades is key. Also, mentioning that rational herding can lead to errors despite individual rationality would strengthen their rebuttal.
answer: |-
  Here's a breakdown of distinct interpretations of "everyone can't be wrong," analyzed for their relevance to your classmate's bank run argument. Each interpretation is evaluated based on its assumptions, validity, behavior under imitation/cascades, and support for inferring the bank *is* actually troubled.

  ### The Menu of Interpretations

  1.  **Condorcet's Jury Theorem (Aggregating Independent Judgments)**
      *   **Claim:** If many individuals make *independent* judgments about a binary fact (e.g., "Is the bank solvent?") based on private signals (each more likely correct than incorrect), then the probability that the *majority decision* is correct approaches 1 as the group size increases. "Everyone" (meaning the majority) "can't be wrong" in large groups.
      *   **Assumptions:** Private signals are (a) *independent*, (b) identically distributed, (c) unbiased (p(correct) > 0.5), (d) individuals vote truthfully based *only* on their private signal.
      *   **True Under Conditions?** Yes, mathematically proven under these strict assumptions.
      *   **Under Imitation/Cascades?** **Fails catastrophically.** Cascades occur precisely because later individuals *ignore* their private signals and follow the herd. Actions become highly correlated, violating independence. The majority can be completely wrong even in large groups.
      *   **Supports Bank Run Inference?** **No.** Bank runs involve sequential decisions where depositors see others withdrawing. Independence is destroyed. A run (the "majority" action) can occur even if the bank is solvent, as early withdrawals based on weak signals can cascade. This interpretation *undermines* the classmate's argument.

  2.  **Wisdom of Crowds (Aggregating Dispersed Information via Averaging)**
      *   **Claim:** The *average* estimate or judgment of a diverse group of individuals, each possessing independent pieces of information, tends to be remarkably accurate, often better than most individual experts. "Everyone" (the crowd's aggregate judgment) "can't be wrong" in the sense of being far from the truth.
      *   **Assumptions:** (a) *Diversity* of information/opinions, (b) *Independence* of judgments (no communication or copying), (c) *Decentralization* (individuals use local knowledge), (d) an *Aggregation mechanism* (like averaging).
      *   **True Under Conditions?** Often true for estimation tasks (e.g., guessing weight of an ox) under these conditions. Less directly applicable to binary actions like withdrawing.
      *   **Under Imitation/Cascades?** **Fails.** Imitation destroys independence and reduces diversity of *expressed* judgments/actions. The "crowd" converges prematurely, potentially on a falsehood. The aggregate (e.g., the sheer number withdrawing) no longer reflects dispersed information accurately.
      *   **Supports Bank Run Inference?** **Weakly/No.** While the *existence* of withdrawals signals *some* negative information, the *scale* of the run under imitation does *not* reliably indicate the *true* level of trouble. The aggregated action is distorted by herding. It doesn't strongly confirm the bank is fundamentally insolvent.

  3.  **Bayesian Observational Learning / Rational Herding (Inferring from Actions)**
      *   **Claim:** A rational agent observing the actions of predecessors updates their belief about the underlying state (bank solvency). If sufficiently many people choose action A (withdraw), a rational observer should infer that the predecessors likely had strong private signals favoring A, and thus the observer should also choose A, even if their own private signal is weak or suggests otherwise. "Everyone" choosing A becomes strong evidence *for* A being correct.
      *   **Assumptions:** (a) Agents are *Bayesian rational*, (b) Agents have *private signals* correlated with the true state, (c) Actions of predecessors are *observable*, (d) *Common knowledge* of rationality and the structure of the game/model (payoffs, signal distributions).
      *   **True Under Conditions?** **Yes, but with caveats.** Agents *rationally* herd based on the information inferred from others' actions. Cascades *can* start and persist rationally.
      *   **Under Imitation/Cascades?** **This is *the* core mechanism.** The interpretation *assumes* imitation/rational herding. Cascades are a predicted outcome.
      *   **Supports Bank Run Inference?** **Yes, *for the participating agents*, but crucially *not* for an external observer.** Within the model, agents *within the cascade* rationally believe withdrawing is the best action given the observed run. However, **the cascade can be *incorrect*.** An early run based on misleading signals or random clustering can trigger a cascade where *all* subsequent depositors rationally withdraw, even if the bank is solvent. **The run is evidence depositors *believe* it's in trouble, but *not* conclusive evidence it *is* in trouble.** This interpretation explains *why* runs happen rationally but *does not guarantee* the run reflects fundamental insolvency.

  4.  **Statistical Improbability of Large-Scale Error**
      *   **Claim:** It's statistically vanishingly unlikely for a very large number of individuals to independently arrive at the same wrong conclusion by chance. Therefore, widespread agreement (e.g., everyone withdrawing) *must* indicate they are responding to a true underlying reality.
      *   **Assumptions:** (a) Individuals act *independently* (key!), (b) Individuals have a non-zero probability of being wrong, (c) The state of the world is fixed.
      *   **True Under Conditions?** **Yes, mathematically.** The probability of N independent agents all being wrong if p(wrong) < 1 decreases exponentially with N.
      *   **Under Imitation/Cascades?** **Fails.** This logic hinges *entirely* on independence. Once agents observe and imitate others, their actions are *not independent*. A single wrong action can propagate to many through the cascade. Large-scale error becomes not only possible but a common feature of observational learning models.
      *   **Supports Bank Run Inference?** **No, and it's the core fallacy.** Your classmate's argument likely implicitly relies *heavily* on this intuition ("If everyone's doing it independently, it must be right!"). However, in a bank run, actions are demonstrably *not* independent due to sequential observation. This interpretation crumbles under the reality of herding.

  5.  **Common Knowledge of Rationality & Coordination ("It Must Be Obvious")**
      *   **Claim:** If everyone is rational, and everyone knows everyone is rational (common knowledge), and a run is happening, it must be common knowledge that the bank is insolvent. Otherwise, rational depositors expecting others not to run wouldn't run themselves to avoid needless penalty/panic. "Everyone can't be wrong" because their coordinated action reveals the truth is unavoidably known.
      *   **Assumptions:** (a) *Common knowledge* of rationality, (b) Common knowledge of payoffs/structure, (c) Often assumes *simultaneous* or highly coordinated actions rather than purely sequential decisions.
      *   **True Under Conditions?** **Debatable in complex games.** In highly stylized models (e.g., global games of regime change), this can select a unique equilibrium where attack/run only happens if fundamentals are truly bad. However, the assumptions are extremely strong.
      *   **Under Imitation/Cascades?** **Not directly applicable.** Sequential observational learning models often don't require full common knowledge beyond the immediate predecessors' actions. Cascades can start without common knowledge of insolvency.
      *   **Supports Bank Run Inference?** **Potentially, but weakly and unrealistically.** If one believes the bank run is a simultaneous coordination game with perfect common knowledge, then observing a run *might* imply insolvency is the only rationalizable outcome. However, real bank runs are sequential, involve panic, and lack perfect common knowledge. This interpretation is too idealized to strongly support the inference. It also struggles with *self-fulfilling* runs (see #6).

  6.  **Self-Fulfilling Prophecy / Equilibrium Selection (Trivial Truth)**
      *   **Claim:** In a bank run model with multiple equilibria (one where the bank survives, one where it fails), the act of enough people withdrawing *causes* the bank to fail, making their belief "correct" by construction. "Everyone" withdrawing *isn't* "wrong" because their actions *create* the reality where failure was the outcome. "The run *is* the trouble."
      *   **Assumptions:** (a) Bank failure depends on the *number* withdrawing (liquidity crisis), (b) There exists an equilibrium where the bank fails if enough withdraw, regardless of initial solvency.
      *   **True Under Conditions?** **Trivially true by definition.** If the run causes failure, then the depositors withdrawing were "right" *that the bank would fail if they (and others) ran*. It doesn't speak to whether the bank was *fundamentally* solvent before the run.
      *   **Under Imitation/Cascades?** **This is the *consequence* of a run.** Cascades are one mechanism that can *trigger* this self-fulfilling prophecy.
      *   **Supports Bank Run Inference?** **Yes, but trivially and unhelpfully.** It supports the inference that *a run causes failure*, not that the bank was *inherently insolvent* before the run started. This is a tautology: "The run happened and caused failure, therefore the run was 'correct' in causing failure." It doesn't validate the depositors' *initial reasons* for fearing insolvency. This interpretation doesn't provide the *explanatory power* your classmate likely intends.

  ### Summary & Which Ones Do the Work

  *   **Trivial Interpretation:** #6 (Self-Fulfilling Prophecy). It's true by definition but doesn't support the inference that the bank was *fundamentally* in trouble *before* the run.
  *   **Interpretations Undermining the Argument:** #1 (Condorcet - relies on independence), #2 (Wisdom of Crowds - relies on independence/averaging), #4 (Statistical Improbability - *crucially* relies on independence).
  *   **Interpretation Explaining the Phenomenon But Not Guaranteeing Correctness:** #3 (Bayesian Observational Learning). This is the core model of rational herding/cascades. It explains *why* rational depositors join the run based on observing others, but **explicitly allows for the run to be incorrect** (based on misleading early signals). It supports the inference *for depositors within the cascade* but **not** for an external observer (or your classmate) claiming the run *proves* fundamental insolvency.
  *   **Interpretation Potentially Supporting (but Unrealistically):** #5 (Common Knowledge). Requires extremely strong, unrealistic assumptions about common knowledge and coordination.

  **Conclusion:** Your classmate's argument primarily relies on the **fallacious intuition of #4 (Statistical Improbability of Large-Scale Error)**, implicitly assuming depositors act independently. The slogan "everyone can't be wrong" powerfully evokes this intuition. However, in the context of a bank run, characterized by **sequential decisions and observational learning (Interpretation #3)**, independence is destroyed. While #3 explains why the run *happens* rationally, and #6 trivially states the run *causes* failure, **none of the robust interpretations guarantee that a bank run proves the bank was fundamentally insolvent *prior* to the run.** The key work the slogan does is smuggling in the false assumption of independence, masking the very real possibility of incorrect information cascades. Your skepticism is well-founded.
