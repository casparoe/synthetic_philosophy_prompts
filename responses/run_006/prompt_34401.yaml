answer: |-
  Here is a rigorous set of desiderata for a defensible theory of "the will of the people," structured by the challenges you identified. The core tension—and the impossibility result—lies at the heart of defining the demos.

  **Core Desiderata (Non-Negotiable for Intellectual Defensibility):**

  1.  **Non-Arbitrary Demarcation (Boundary Problem):** The theory **must** provide a non-arbitrary, principled definition of who constitutes "the People." It must address inclusion/exclusion of:
      *   Citizens vs. Permanent Residents
      *   Voters vs. Non-voters (apathetic, disenfranchised)
      *   Minors
      *   Future Generations
      *   Distinct Regional/Cultural Minorities within the polity
      *   The Diaspora (expatriates)
      *   *Case Forcing It:* Immigration policy, climate policy (future generations), constitutional reform affecting minority regions (e.g., Catalonia, Quebec), taxation of non-voting residents. A theory that arbitrarily defines "the People" (e.g., only current voters, only ethnic majority) fails fundamentally.

  2.  **Resistance to Framing & Aggregation Pathologies:** The theory **must** account for and mitigate the fact that expressed preferences (votes, poll answers) are highly sensitive to:
      *   Question Framing & Wording
      *   Agenda Setting (order of votes/issues)
      *   Voting Method (FPTP, Ranked Choice, Approval)
      *   The possibility of cyclical majorities (Condorcet Paradox)
      *   Issue-by-issue majorities conflicting with coherent platforms/bundles.
      *   *Case Forcing It:* Contradictory referendum results on related topics, legislatures passing bills unpopular in isolation but part of a popular compromise package, different electoral systems yielding different "winners" from the same votes.

  3.  **Acknowledgment of Instability & Manipulability:** The theory **must** recognize that mass preferences are often:
      *   Unstable (shifting with events, new information, mood)
      *   Based on limited information/attention
      *   Susceptible to propaganda, misinformation, and emotional manipulation.
      *   *Case Forcing It:* Rapid opinion shifts after crises or major media campaigns, low-information voters swayed by simplistic slogans, policies enacted based on transient panic later regretted.

  4.  **Temporal Specification:** The theory **must** explicitly state *when* "the will" is ascertained and how long it endures. It must address:
      *   Binding future generations (constitutions, debt, environment)
      *   The authority of past decisions vs. present preferences.
      *   *Case Forcing It:* Constitutional originalism vs. living constitution debates, long-term environmental treaties, national debt burden, reversing past referendums (e.g., Brexit).

  5.  **Distinction Between Preference Types:** The theory **must** clearly state *which* "will" it claims to represent and justify that choice:
      *   **Revealed Preferences (Actual):** What people say/want *now*, warts and all.
      *   **Considered Judgments (Deliberative):** What people *would* want under conditions of good information, reflection, and dialogue.
      *   **Objective Interests:** What is *truly* good for them (or "in their name"), even if they don't realize it.
      *   *Case Forcing It:* Unpopular but necessary reforms (austerity, vaccination), policies based on misinformation (e.g., harmful populist economics), complex issues requiring expertise (tech regulation, pandemic response). Conflating these is a major source of manipulation.

  **Important But Contested Desiderata (Reflecting Philosophical Camps):**

  6.  **Coherence Requirement (Contested):** *Some camps insist* the "will" must be a logically consistent set of preferences/policies. *Others* argue the people's will can be inherently contradictory or fragmented, demanding compromise, not coherence. *Case Forcing Debate:* Platform-based voting vs. single-issue voting, coalition governments, reconciling conflicting majoritarian demands (e.g., lower taxes *and* more services).

  7.  **Expressibility Requirement (Contested):** *Plebiscitarians often insist* the will must be expressible via simple binary choices (referendums). *Deliberativists/Representative Democrats argue* complex will requires representative deliberation or nuanced multi-option processes. *Case Forcing Debate:* Constitutional amendments vs. legislative statutes, complex trade deals vs. simple tariffs.

  8.  **Existence Prior to Institutions (Contested - Strong Populist Prejudice):** *Radical Populists often claim* the "real" will exists raw and unmediated, prior to and independent of formal institutions (parties, legislatures, courts). *Institutionalists argue* the will is fundamentally *shaped* and *given coherent form* by institutions; it doesn't exist meaningfully "out there" in a pre-institutional state. *Case Forcing Debate:* Populist attacks on "corrupt elites" subverting the "true will," the role of parties in aggregating preferences, the need for procedural rules to avoid chaos.

  9.  **Discovered vs. Constructed (Contested):** *Essentialists/Plebiscitarians* often treat the will as a pre-existing fact to be *discovered* (by vote, acclamation, leader's intuition). *Deliberativists/Constructivists* argue the will is *formed* or *constructed* through the process of democratic engagement itself. *Case Forcing Debate:* Mandatory vs. deliberative referendums, the role of leaders in "channeling" the will vs. facilitating its formation.

  **The Impossibility Result & The Key Wrecking Ball:**

  *   **The Central Impossibility:** **Non-Arbitrary Demarcation (1)** + **Demos Independence (8 - the strong populist prejudice)** + **Coherence Requirement (6 - often implied by plebiscitarians)** = **Impossible Trilemma.**
      *   *Why?* Defining "the People" non-arbitrarily (1) inherently requires institutional/constitutional rules (e.g., citizenship laws, residency requirements, voting age). This directly contradicts the demand that the "true" will exists *prior* to and *independent* of institutions (8). Furthermore, achieving meaningful coherence (6) from a large, diverse population *requires* institutional mechanisms (representation, agenda-setting, voting rules, deliberation). Insisting on pre-institutional existence *and* coherence while demanding a non-arbitrary demos is logically unsustainable. One must give. Most defensible theories sacrifice Demos Independence.

  *   **The Key Wrecking Ball:** **Resistance to Aggregation Pathologies (2)** is the single requirement that most devastatingly excludes **Plebiscitarian** and simple **Aggregative** (pure majoritarian) accounts. They simply cannot handle framing effects, agenda manipulation, or cyclical majorities without collapsing into arbitrariness ("*this* vote on *this* day captures it!"). It also severely challenges **Identitarian** accounts relying on a homogenous "true people," as heterogeneous populations exacerbate aggregation problems. **Deliberative** theories *aim* to mitigate (2) but often struggle with scalability and feasibility.

  **Brief Scorecard of Familiar Accounts:**

  *   **Plebiscitarian:** Strong on (8), (9-Discovered), (7-Binary). Catastrophically fails (2), (3), usually fails (1 - often defines people narrowly), struggles with (4), often conflates (5). Vulnerable to leader-manipulation.
  *   **Aggregative (Pure Majoritarian):** Focuses on (7), (5-Actual). Fails (2), (3), often ignores (1), struggles with (4) & (6). Easily manipulated.
  *   **Deliberative:** Strong on (5-Considered), aims for (2), (3), (6), (9-Constructed). Weak on (7 - complexity), struggles massively with (1 - scalability of deliberation), feasibility of (8), practical implementation of (4).
  *   **Identitarian:** Defines (1) narrowly (ethnic, cultural "true people"). Ignores/rejects (2), (3) within the defined group, conflates (5). Fails (1) non-arbitrarily by exclusion, fails (2) by dismissing dissent as non-people.

  **For Your Theorist: The Path Forward**

  To avoid caricature and leader-worship, the theorist **must** grapple with the non-negotiable desiderata, especially the Boundary Problem (1) and Aggregation Pathologies (2). The impossibility result suggests they **cannot** credibly hold a pre-institutional, perfectly coherent, non-arbitrarily defined popular will. 

  A defensible, intelligent account for your novel might look like this:

  *   **Sacrifice Demos Independence (8):** Acknowledge "the People" is a *political construct* defined by a constitutional order (addressing 1 non-arbitrarily, based on residency/birth/citizenship principles).
  *   **Embrace Construction (9):** Argue the "will" is *formed* through legitimate democratic *processes* (elections, legislatures, referendums *with safeguards*), not discovered raw.
  *   **Mitigate, Don't Eliminate, Pathologies (2 & 3):** Advocate for robust institutions (independent electoral commissions, clear referendum rules, free press, civic education) to *minimize* framing effects and manipulation, acknowledging perfection is impossible. Value stability and deliberation over momentary passions.
  *   **Clarify the "Will" (5):** Explicitly ground it in **Considered Judgments** ("what the people would want if reasonably informed and reflective"), requiring mechanisms for deliberation and time for reflection. Reject conflating it with raw opinion or leader's intuition.
  *   **Address Time (4):** Argue for constitutional entrenchment of core principles (reflecting the considered will of the past/founding) while allowing ordinary legislation to adapt to evolving considered judgments via representative institutions.
  *   **Accept Constrained Coherence (6):** Prioritize *procedural legitimacy* and *reason-giving* over perfect substantive coherence, acknowledging pluralism.

  This creates a "Procedural Realism" or "Institutionally Constructed Deliberative Will" account. It's defensible intellectually, avoids leader-centric collapse (the will is formed *by* legitimate processes, not decreed *to be* the will), but still provides a powerful rhetorical foundation for reformist populism ("our institutions are failing to *properly* form and enact the people's considered will!"). It accepts the messiness of democracy while offering a principled ideal for the movement to strive towards. The theorist's internal tension could stem from the gap between this ideal and the messy reality of political mobilization.
