prompt: |-
  I'm taking a course on formal theories of democracy and I keep hitting the same wall: one person defends instant-runoff voting, another says it's garbage because it fails monotonicity, a third says none of that matters because the real issue is the spoiler effect, and everyone is just pointing at the one feature they happened to have a strong feeling about. Before I read another voting-system proposal I want the full spec on the table. What should a rule that takes individual ordinal rankings and returns a social ranking (or at least a winner) actually have to deliver? Give me the desiderata: the cases it has to get right (Condorcet cycles, the no-spoilers intuition, maybe preference intensity if you think it belongs), the distinctions it can't collapse (what a group would choose versus what's fair to its members, an input profile versus a rule, a tie versus a real indifference), and the formal results it cant contradict (Arrow's theorem, and Gibbard-Satterthwaite if you count manipulability as a constraint). For each requirement, give the case or consideration behind it, and flag which are non-negotiable and which are just preferences of a particular camp — independence of irrelevant alternatives, unrestricted domain, transitivity versus acyclicity, non-dictatorship, and so on.

  The part I most want to see is the interplay: which subsets of this list are jointly unsatisfiable given Arrow's theorem, and which single requirement is doing the most work to knock out otherwise attractive rules. If the right lesson is that one of the "requirements" was never really a requirement — that IIA, say, was a technical convenience people mistook for a fairness condition — then say so and defend it. A table is fine.
reasoning: |-
  We are going to list the desiderata for a voting rule that takes individual ordinal rankings (preference orders) and returns a social ranking (or at least a winner). We'll break it down into:

  1. **Formal Requirements** (often from social choice theory, some non-negotiable due to impossibility theorems)
  2. **Fairness and Robustness Criteria** (which are often desired but may be in tension with each other or with formal requirements)
  3. **Practical Considerations** (like resistance to strategic voting, spoiler effect, etc.)

  We will also discuss the interplay and which subsets are jointly unsatisfiable (especially in light of Arrow's theorem and others).

  ---

  ### I. Formal Requirements (from Social Choice Theory)

  These are typically non-negotiable for a rule that claims to be a democratic social welfare function.

  1. **Unrestricted Domain (UD)**  
     - **Definition**: The voting rule must be able to handle every possible profile of individual preference orders (i.e., any set of complete and transitive individual rankings over the alternatives).  
     - **Why?** We don't want to restrict what voters can think.  
     - **Status**: Non-negotiable for a general rule. Without it, we might avoid impossibility theorems by restricting preferences, but that is often seen as unrealistic.

  2. **Non-Dictatorship (ND)**  
     - **Definition**: There is no single voter such that whenever they prefer alternative A over B, society ranks A over B, regardless of others' preferences.  
     - **Why?** Obviously, a dictatorship is not democratic.  
     - **Status**: Non-negotiable. Arrow's theorem shows that without it (and with other conditions) we can have a social welfare function, but we don't want a dictator.

  3. **Transitivity (or at least Acyclicity) of Social Ordering**  
     - **Definition**: The social ranking should be transitive (if A is ranked above B and B above C, then A above C). A weaker condition is acyclicity (no cycles in the strict social preference).  
     - **Why?** Without transitivity, we might not have a clear winner or a clear social ranking.  
     - **Status**: Often non-negotiable for a social ranking. However, some rules (like majority rule) can produce cycles (Condorcet cycles) and then we need a way to break them. For a social choice function (just picking a winner), we can require the existence of a winner (which requires acyclicity) but not full transitivity.

  4. **Pareto Efficiency (PE)**  
     - **Definition**: If every voter prefers A to B, then the social ranking must have A above B.  
     - **Why?** It's a minimal form of unanimity.  
     - **Status**: Non-negotiable for most. It's hard to argue against unanimity.

  5. **Independence of Irrelevant Alternatives (IIA)**  
     - **Definition**: The social ranking between A and B should depend only on the individual rankings of A and B (and not on how they rank other alternatives).  
     - **Why?** Arrow introduced it to avoid strategic voting and to make the rule robust to adding/removing alternatives. But it has been criticized as being too strong.  
     - **Status**: Controversial. Arrow's theorem shows that it is the key condition that (with UD, PE, and transitivity) leads to dictatorship. Some argue that it is a technical convenience that doesn't capture fairness because it ignores preference intensity information that might be present in the full rankings (even though we only have ordinal rankings). Many voting rules (like Borda, IRV) violate IIA.

  ---

  ### II. Fairness and Robustness Criteria

  These are often desired properties but are not always achievable together.

  1. **Condorcet Criterion (CC)**  
     - **Definition**: If there is an alternative that beats every other alternative in pairwise majority comparisons (a Condorcet winner), then that alternative should win.  
     - **Why?** It seems to capture the idea of majority rule.  
     - **Status**: Highly desirable for many, but note that a Condorcet winner doesn't always exist (due to cycles). Rules that satisfy CC (like Copeland) are called Condorcet methods. Others (like Plurality, IRV, Borda) may fail to elect a Condorcet winner in some cases.

  2. **Monotonicity**  
     - **Definition**: If a voter raises the ranking of a winning alternative (without changing the relative order of others), then that alternative should still win.  
     - **Why?** It seems perverse that improving the standing of a candidate could cause them to lose (as can happen in IRV).  
     - **Status**: Considered basic by many, but some rules (like IRV) fail it.

  3. **Participation**  
     - **Definition**: Adding a voter who ranks A above B should not change the winner from A to B.  
     - **Why?** It incentivizes voting: your vote shouldn't hurt your favorite candidate.  
     - **Status**: Desirable, but many rules (including IRV and even some Condorcet methods) can fail it.

  4. **Consistency (or Reinforcement)**  
     - **Definition**: If the electorate is split arbitrarily into two groups and the voting rule chooses the same winner in both groups, then that winner should be chosen by the whole electorate.  
     - **Why?** It ensures coherence in the outcome when the electorate is split.  
     - **Status**: Desirable, but many rules (including IRV) fail it.

  5. **Independence of Clones**  
     - **Definition**: The outcome should not change if a candidate is replaced by a set of clones (candidates who are ranked in the same positions as the original by every voter).  
     - **Why?** To avoid vote-splitting (a form of spoiler effect).  
     - **Status**: Desirable to mitigate the spoiler effect.

  ---

  ### III. Practical Considerations and Strategic Issues

  1. **Resistance to Strategic Voting (Strategy-Proofness)**  
     - **Definition**: It should be in the best interest of every voter to report their true preferences.  
     - **Why?** To avoid manipulation.  
     - **Formal Result**: Gibbard-Satterthwaite theorem: If there are at least three alternatives, any voting rule that is non-dictatorial and can produce any alternative as the winner (surjective) is manipulable. Hence, perfect strategy-proofness is impossible (except for dictatorships or rules that only consider two alternatives).  
     - **Status**: We can only aim for partial resistance.

  2. **Spoiler Effect**  
     - **Definition**: The presence of a candidate who cannot win (a spoiler) affects the outcome of the election, potentially causing a candidate that would have won in the spoiler's absence to lose.  
     - **Why?** It leads to strategic entry/exit of candidates and can cause the winner to be less representative.  
     - **Relation to IIA**: The spoiler effect is a violation of IIA? Not exactly: IIA is about the social ranking between two alternatives not being affected by other alternatives. The spoiler effect is about the winner changing when a non-winning candidate is added/removed. They are related: IIA violations often lead to spoiler effects.  
     - **Status**: Highly undesirable in practice.

  3. **Simplicity and Transparency**  
     - **Why?** For public trust and ease of implementation.

  ---

  ### Interplay and Impossibility Results

  - **Arrow's Theorem**: If we require a social welfare function (full transitive ranking) that satisfies UD, PE, IIA, and transitivity, then it must be a dictatorship.  
    - **Lesson**: We must relax one of these. Most voting rules relax IIA (e.g., Borda, IRV) or transitivity (by not producing a full ranking, or by using a method that breaks cycles). Some relax UD (by assuming single-peaked preferences, which avoids cycles and allows majority rule to work).

  - **Gibbard-Satterthwaite**: For social choice functions (selecting a winner), if we have at least three alternatives, UD, non-dictatorship, and surjectivity (every candidate can win in some profile), then the rule is manipulable.  
    - **Lesson**: We must either accept some manipulability or relax UD, non-dictatorship, or surjectivity.

  - **Trade-offs**:  
    - **IIA vs. Condorcet**: Rules that satisfy IIA (like plurality) often fail the Condorcet criterion. Condorcet methods (which violate IIA) can be complex and may have cycles.  
    - **Monotonicity and Participation**: IRV fails monotonicity and participation. Condorcet methods can fail participation.  
    - **Spoiler Effect**: Plurality and IRV are susceptible to the spoiler effect. Condorcet methods (like Ranked Pairs or Schulze) are designed to be less susceptible because they respect pairwise comparisons.

  ---

  ### Which requirement is the most problematic?

  **IIA** is the key requirement that leads to Arrow's impossibility. Many theorists argue that IIA is too strong because it discards information about the strength of preference that is implicit in the entire ranking. For example, in the Borda count, the ranking of other alternatives affects the points assigned to A and B. In a pairwise comparison, if A beats B in every ranking, then IIA requires A to be above B regardless of how they are ranked relative to others. But in a situation where A and B are both low in everyone's ranking, and C is the clear favorite, IIA still requires A to be above B even though the voters don't care much about either. This seems to miss the big picture.

  Moreover, violations of IIA are common in real voting. For instance, in the 2000 US presidential election, if Nader (a spoiler) had not run, Gore might have won Florida (and hence the election). This spoiler effect is a violation of IIA? Not exactly, but it's related: the relative ranking of Bush and Gore was affected by the presence of Nader. So, relaxing IIA is necessary to avoid dictatorship, and it allows for rules that are more context-sensitive.

  However, without IIA, we open the door to the spoiler effect. Rules that violate IIA (like Borda) can be vulnerable to spoilers. But note: some rules that violate IIA (like Condorcet methods) are designed to minimize the spoiler effect by being based on pairwise comparisons.

  ---

  ### Summary Table of Desiderata

  | Desideratum                           | Non-Negotiable? | Notes                                                                                          |
  |---------------------------------------|-----------------|------------------------------------------------------------------------------------------------|
  | **Formal Requirements**               |                 |                                                                                                |
  | Unrestricted Domain (UD)              | Yes (for generality) | Without it, we avoid impossibilities but at the cost of restricting preferences.               |
  | Non-Dictatorship (ND)                 | Yes             | Core to democracy.                                                                             |
  | Transitivity (or Acyclicity)          | For ranking: transitivity; for winner: acyclicity | Without transitivity, we have cycles. Acyclicity is enough for a winner. |
  | Pareto Efficiency (PE)                | Yes             | Unanimity is fundamental.                                                                      |
  | Independence of Irrelevant Alternatives (IIA) | Controversial   | Arrow's theorem shows it leads to dictatorship with the others. Often relaxed.                 |
  | **Fairness Criteria**                 |                 |                                                                                                |
  | Condorcet Criterion (CC)              | Desirable       | Majority rule ideal, but not always possible (cycles).                                         |
  | Monotonicity                          | Desirable       | Violated by IRV in some cases.                                                                 |
  | Participation                         | Desirable       | Voting shouldn't hurt your favorite.                                                           |
  | Consistency                           | Desirable       | Coherence under partition.                                                                     |
  | Independence of Clones                | Desirable       | Mitigates spoiler effect.                                                                      |
  | **Strategic Considerations**          |                 |                                                                                                |
  | Strategy-Proofness                    | Partially       | Gibbard-Satterthwaite: impossible in full strength.                                            |
  | Resistance to Spoiler Effect          | Highly desirable | Related to IIA and clone independence.                                                         |
  | Simplicity and Transparency           | Practical       | Important for real-world adoption.                                                             |

  ---

  ### Conclusion

  There is no perfect voting rule. The choice of a rule involves trade-offs. For example:

  - If you want to avoid the spoiler effect and respect majority rule (Condorcet), then a Condorcet method (like Schulze or Ranked Pairs) is attractive, but it may be complex and fail participation.
  - If you want simplicity and monotonicity, then plurality or approval voting might be considered, but they fail the Condorcet criterion and are vulnerable to spoilers.
  - IRV (instant-runoff) is used in some places and satisfies IIA? (No, it doesn't) ... actually, IRV violates IIA and monotonicity, but it avoids vote-splitting in some cases and is relatively simple.

  Given the impossibilities, it's important to understand the priorities of the electorate. For instance, if the electorate is expected to have single-peaked preferences (which is common in political spectra), then majority rule (which is Condorcet-consistent and transitive) works.

  In light of Arrow's theorem, the requirement that is doing the most work to knock out otherwise attractive rules is **IIA**. Many argue that it is a technical convenience that doesn't align with our intuitions about fairness because it ignores the context of other alternatives. Therefore, relaxing IIA is common and allows for rules that are more expressive and, in some cases, more fair.

  For your course, it would be valuable to map the voting rules to these desiderata and see which ones they satisfy and which they fail. This will help in understanding the trade-offs.
answer: |-
  Below is a structured breakdown of the desiderata for a voting rule that maps individual ordinal rankings to a social ranking or winner. I've categorized them, explained their rationale, flagged negotiability, highlighted key trade-offs (especially per Arrow/Gibbard-Satterthwaite), and identified the most contentious requirements. A summary table is included at the end.

  ---

  ### **Core Desiderata: Non-Negotiables**  
  These are foundational for *any* minimally democratic rule. Violating them implies a fundamental flaw.

  1. **Unrestricted Domain (UD)**  
     - **Definition**: Accepts any logically possible profile of individual ordinal rankings.  
     - **Why non-negotiable?** Rules failing UD exclude "inconvenient" voter preferences, violating democratic legitimacy.  
     - **Arrow's Role**: Critical in Arrow’s theorem. Relaxing UD (e.g., assuming single-peaked preferences) avoids impossibility but limits real-world applicability.

  2. **Non-Dictatorship (ND)**  
     - **Definition**: No single voter always determines the social ranking.  
     - **Why non-negotiable?** Dictatorship is antithetical to democracy.  
     - **Arrow's Role**: Directly contradicted by Arrow’s theorem if UD, IIA, PE, and transitivity hold.

  3. **Pareto Efficiency (PE)**  
     - **Definition**: If all voters prefer A > B, society ranks A > B.  
     - **Why non-negotiable?** Basic respect for unanimous preferences. Weakest form of collective rationality.

  4. **Collective Rationality (Transitivity/Acyclicity)**  
     - **Definition**: Social rankings must be transitive (if A > B and B > C, then A > C) or at least acyclic (no Condorcet cycles like A > B > C > A).  
     - **Why non-negotiable?** Intransitive outcomes ("no winner" or arbitrary cycles) delegitimize results.  
     - **Trade-off**: Transitivity is stricter; acyclicity suffices for a winner but not a full ranking.  
     - **Key case**: Condorcet cycles (e.g., 1/3 prefer A>B>C, 1/3 B>C>A, 1/3 C>A>B) force rules to "break" cycles fairly.

  ---

  ### **Substantive Fairness Criteria**  
  These address democratic ideals but are often mutually exclusive or in tension with formal constraints.

  5. **Condorcet Winner Criterion (CWC)**  
     - **Definition**: If a candidate beats all others in pairwise majority comparisons, they must win.  
     - **Rationale**: Embodies majority rule. Failing this (e.g., IRV in 2009 Burlington mayoral race) feels undemocratic.  
     - **Negotiability**: High-priority for many, but some rules (e.g., Borda) prioritize other values (e.g., broad consensus).  
     - **Key case**: A Condorcet winner exists but loses under IRV/Borda/Plurality.

  6. **Monotonicity**  
     - **Definition**: Improving a candidate’s ranking should never harm them.  
     - **Rationale**: Avoids perverse incentives (e.g., "rewarding" a candidate by ranking them lower).  
     - **Negotiability**: Often considered essential; IRV fails this (e.g., in the 1957 Queensland election).  
     - **Key case**: Candidate A wins; after some voters rank A higher, A loses.

  7. **Independence of Clones (IoC)**  
     - **Definition**: Adding/removing "clone" candidates (identical in all rankings) shouldn’t change outcomes.  
     - **Rationale**: Mitigates spoiler effect (e.g., Nader spoiling Gore in 2000).  
     - **Negotiability**: Desirable but secondary; IRV satisfies this, Plurality fails.

  8. **No Favorite Betrayal/Participation**  
     - **Definition**: Voting honestly shouldn’t hurt your preferred candidate.  
     - **Rationale**: Encourages participation. Failing this (e.g., in some Condorcet methods) disenfranchises voters.  
     - **Negotiability**: Weaker priority; violated by many rules.

  ---

  ### **Strategic & Procedural Constraints**  
  Address manipulation and implementation.

  9. **Strategy-Proofness (Non-Manipulability)**  
     - **Definition**: No voter benefits from misrepresenting preferences.  
     - **Rationale**: Ensures honest voting.  
     - **Gibbard-Satterthwaite (GS)**: Implies no ordinal rule with ≥3 alternatives can satisfy UD, ND, and strategy-proofness. Thus, **all non-dictatorial rules are manipulable**.  
     - **Negotiability**: Must be relaxed; focus shifts to *resistance* (how hard is manipulation?).

  10. **Independence of Irrelevant Alternatives (IIA)**  
      - **Definition**: Social ranking of A vs. B depends only on individual A vs. B rankings.  
      - **Rationale**: Prevents spoiler effects and strategic nomination.  
      - **Controversy**: Arrow requires IIA, but it’s **arguably not a fairness condition**—it ignores preference intensity (e.g., Borda violates IIA to capture "how much" A is preferred).  
      - **Key criticism**: IIA is a technical crutch; real fairness requires context (e.g., if everyone hates C, A vs. B should reflect overall standings).  
      - **Status**: **The most overrated requirement**. Relaxing IIA avoids Arrow’s dictatorship but enables spoilers (see table).

  ---

  ### **Distinctions & Edge Cases**  
  How rules handle ambiguities.

  11. **Tie vs. Indifference**  
      - **Definition**: Must distinguish voter indifference (A=B) from a tied outcome.  
      - **Rationale**: Indifference is an input; ties are output failures.  
      - **Non-negotiable**: Rules must handle both (e.g., Borda allows voter indifference; Condorcet may output ties).

  12. **Resolvability**  
      - **Definition**: Avoids tied outcomes when possible (e.g., via tie-breaking).  
      - **Rationale**: Societies need decisive winners.  
      - **Negotiability**: Practical necessity; most rules incorporate tie-breakers.

  ---

  ### **Trade-offs & Impossibilities**  
  | Requirement                | Violated By          | Conflict With                         | Why Conflict?                                                                 |
  |----------------------------|----------------------|---------------------------------------|-------------------------------------------------------------------------------|
  | **IIA**                    | Borda, IRV, Approval | Condorcet, Monotonicity, IoC          | Arrow: IIA + UD + PE + Transitivity → Dictatorship. Relaxing IIA enables CWC. |
  | **Transitivity**           | Majority Rule        | UD                                    | Condorcet cycles force cycle-breaking (e.g., Ranked Pairs, Schulze).          |
  | **Strategy-Proofness**     | All non-dictatorial rules | UD, ND                               | Gibbard-Satterthwaite: Fundamental impossibility.                             |
  | **CWC**                    | Plurality, IRV, Borda | IIA, Simplicity                      | CWC requires pairwise comparisons; IIA forbids using full rankings.          |
  | **Monotonicity**           | IRV                  | CWC (in some cases)                  | Some Condorcet methods (e.g., Minimax) and IRV sacrifice monotonicity.       |

  ---

  ### **Which Requirement Does the Most Damage?**  
  **IIA** is the linchpin:  
  - It’s the key driver of Arrow’s theorem.  
  - It conflicts with CWC, monotonicity, and spoiler resistance.  
  - **Defense for relaxing it**: IIA is a technical axiom mislabeled as "fairness." Real-world fairness requires context (e.g., ranking positions matter in Borda). Rules violating IIA (e.g., Condorcet methods) better handle spoilers and intensity.  

  **Gibbard-Satterthwaite** is equally devastating for strategy-proofness but is often sidestepped by accepting limited manipulation (e.g., in Approval Voting).

  ---

  ### **Recommendations for Rules**  
  - **Prioritize CWC/monotonicity/IoC?** → Condorcet methods (Ranked Pairs, Schulze).  
  - **Prioritize simplicity/IIA?** → Approval Voting (but violates CWC).  
  - **Balanced approach?** → IRV (violates monotonicity/CWC) or Borda (violates IIA/CWC).  

  > **Key Insight**: No rule satisfies all desiderata. Choose based on values:  
  > - **Majority rule**: Condorcet methods.  
  > - **Spoiler resistance**: Condorcet or IRV.  
  > - **Simplicity**: Plurality or Approval.  
  > Arrow/GS force us to abandon IIA, full strategy-proofness, or transitivity in cycles.
