  But deeper needs emerge:
  They want to transform antagonism into productive disagreement. The department likely needs a framework that allows both sides to preserve intellectual integrity while continuing collaboration. There's also an unspoken urgency - "two semesters going in circles" suggests wasted resources and frustration.

  For the consensus section, I'll identify points both camps implicitly accept. The asymmetry's psychological existence seems undisputed - nobody denies people intuit it. Both acknowledge moral realism isn't at stake. Key test cases like "Miserable Child" vs "Happy Child" appear in all literature they've read.

  The disagreements table requires special care. For Team Asymmetry, I'll mirror their "non-instrumental reason" language from Harman/Narveson. For Team Reductionist, I'll use their "scope confusion" framing from McMahan/Parfit. Crucially, I must avoid any phrasing that implies one side is defending common sense while the other is revisionist.

  When constructing cruxes, I'll focus on pressure points where empirical predictions diverge. The "Duty to Procreate" case tests if asymmetry logically forces antinatalism - a key Team Reductionist concern. The "Replaceable Happy Person" scenario isolates whether absence-of-good constitutes non-reason or weak reason. 

  Noticing a potential verbal trap: "harm" vs "wronging". Team Reductionist sees "harm" as conceptually requiring existence, while Team Asymmetry might accept impersonal harm. This gets flagged in section 4 with Benatar's equivocation warning.

  The document's architecture follows conflict-resolution principles: start with common ground, then map fault lines with mutual respect. Ending on cruxes provides research direction - exactly what exhausted academics need to move forward. Tone must remain clinical but not cold, honoring the emotional labor already invested.
answer: |-
  Here is the adversarial-collaboration document drafted to map the terrain of your department's disagreement on the procreation asymmetry, designed for mutual recognition without adjudication:

  **Document: Mapping the Procreation Asymmetry Disagreement**

  **Preamble:**  
  This document reflects points of agreement and persistent disagreements between two perspectives on the procreation asymmetry in population ethics ("Team Asymmetry" and "Team Reductionist"). It aims to clarify commitments, isolate cruxes, and identify test cases for future resolution. Signatories endorse this *as an accurate map of the current debate*, not necessarily the truth of any claim.

  ---

  **1. Consensus Claims (Both Sides Endorse):**

     1.1. **Psychological Asymmetry Exists:** Humans widely intuit a moral difference between (a) creating a person whose life would be net miserable and (b) not creating a person whose life would be net happy. We feel a strong obligation to avoid (a), but no symmetrical obligation to pursue (b).  
     1.2. **Non-Identity is Relevant:** The "non-identity problem" (Parfit) is central. The person who would be miserable or happy in the scenarios under discussion *does not yet exist* at the point of decision.  
     1.3. **Moral Realism Presumed:** Both sides operate within a broadly realist framework. The debate concerns the *content* and *structure* of morality, not its existence or our ability to know it.  
     1.4. **Key Test Cases:** Any adequate account must handle:
          *   **1.4.1. Miserable Child:** Choosing to conceive a child foreseen to have a life of intense, unremitting suffering (e.g., severe genetic disorder causing constant pain). Intuition: Strong moral reason *against* procreation.
          *   **1.4.2. Happy Child:** Choosing *not* to conceive a child foreseen to have a long, happy life full of well-being. Intuition: No significant moral reason *in favor* of procreation (beyond indirect effects).
          *   **1.4.3. Same-Person vs. Different-Person Harms/Benefits:** Distinguishing harming an existing person (e.g., causing pain) vs. creating a new person who will suffer (Miserable Child) or not creating a new person who would be happy (Happy Child).  
     1.5. **Not Solely About "Good For":** While the concept of "good for" a person is central, the asymmetry debate involves more than its definition. It concerns the *moral reasons* generated by potential states of welfare concerning potential persons.  
     1.6. **Not Necessarily Anti-Natalist:** Accommodating the asymmetry does not *logically entail* that coming into existence is always a net harm or that procreation is always wrong (anti-natalism).  
     1.7. **Theoretical Burden:** An ideal population axiology *should* either explain the intuitive asymmetry in a coherent way ("Team Asymmetry") or explain why the intuitive asymmetry is misleading and provide a superior, coherent alternative ("Team Reductionist").

  ---

  **2. Disagreements Table (Stated in Endorsed Wording):**

  | Issue                                 | Team Asymmetry View (Endorsed Wording)                                                                 | Team Reductionist View (Endorsed Wording)                                                                 |
  | :------------------------------------ | :------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------- |
  | **Status of the Asymmetry**           | The asymmetry reflects a deep, irreducible feature of morality: the moral reasons concerning bringing potential persons into existence are fundamentally asymmetric. Avoiding misery grounds a strong moral reason; creating happiness grounds at best a very weak (or no direct, non-instrumental) moral reason. | The intuitive asymmetry is not a fundamental moral datum. It arises from a confusion between different *types* of reasons (person-affecting vs. impersonal) or scope limitations, or fails to withstand scrutiny under a coherent impersonal axiology. |
  | **Moral Force of Creating Happy People** | There is **no duty, and typically no significant non-instrumental moral reason**, to bring a potential happy person into existence solely for their sake (their future welfare). The absence of a good (their happy life) is not itself a bad state of affairs requiring correction. | There *is* an impersonal moral reason to bring a potential happy person into existence (it makes the world better by adding net well-being), though this reason may be weak, easily overridden, or practically insignificant compared to person-affecting duties. |
  | **Source of the Reason Against Creating Misery** | Creating a miserable person is **wrong** *because* it **harms** that specific individual *by creating them into a harmed state*. This is a person-affecting reason (though the person didn't exist prior). | Creating a miserable person is **impersonally bad** (it creates a state of affairs containing unnecessary suffering). The language of "harming" *that individual* is misleading or incoherent here due to the non-identity problem; they are only harmed *relative to non-existence*, which is not an alternative state *for them*. |
  | **Commitment to Anti-Natalism**       | Accommodating the asymmetry does not require anti-natalism. One can consistently hold the asymmetry while affirming that procreation is permissible (or even good) when the expected life is sufficiently good, due to *other* reasons (e.g., fulfillment of parents, relational goods) *or* because the asymmetry only denies a *duty* to create happy lives, not forbidding it. | Attempts to accommodate the asymmetry within person-affecting constraints inevitably lead to implausible conclusions (e.g., the "Repugnant Conclusion" in person-affecting forms, inconsistency, or *de facto* anti-natalism when pressed) or fail to account for the impersonal value of happy lives. A coherent impersonal axiology (e.g., Total Utilitarianism) avoids these pitfalls, even if it sacrifices the strict asymmetry. |
  | **"Harm" in Creation**                | Bringing a person into existence *can* harm them if their life is net miserable. This harm grounds the strong moral reason against creation. Non-existence is the relevant (though non-actual) baseline for comparison of harm. | Strictly speaking, bringing someone into existence cannot *harm* them if their life is worth living (even barely) because there is no alternative state *for that person* where they exist and are better off. Creating a miserable person creates a *bad existence*, but it does not harm *a pre-existing victim*. The harm language invites equivocation. |

  ---

  **3. Cruxes: Key Sub-Questions & Test Cases**

     3.1. **Crux 1: Does avoiding the creation of a miserable person generate a *stronger* moral reason than creating a happy person generates?**
          *   **Test Case: The Symmetric Choice:** Agent can choose only one of two actions:
              *   A: Create Happy Child H (guaranteed very happy life).
              *   B: Refrain from creating Miserable Child M (guaranteed very miserable life). No other effects.
          *   **Team Asymmetry Prediction:** B is *clearly* morally required over A. The reason to avoid creating M outweighs any reason to create H.
          *   **Team Reductionist Prediction:** The reasons are *comparable in strength* (both based on the magnitude of welfare change introduced). If H's happiness is great and M's misery is great, it might be a close call or even obligatory to choose A (create H) if the net gain in well-being is larger. B is only clearly obligatory if M's misery is significantly *worse* than H's happiness is good.
          *   **Why Crucial?** Directly tests whether the asymmetry involves a *difference in kind* or merely *degree* in the strength of reasons.

     3.2. **Crux 2: Does the absence of a *duty* to create happy lives imply the absence of any *positive moral reason* (even weak/impersonal) to do so?**
          *   **Test Case: The Replaceable Happy Person:** Agent must decide whether to conceive Child C (foreseen very happy life) *or* instead use those resources to significantly improve the life of an *existing* person E (from mediocre to very happy). C and E cannot both be made happy.
          *   **Team Asymmetry Prediction:** There is *no moral reason* (or only an extremely weak, easily overridden one) stemming *directly from C's potential welfare* to choose conception over improving E. The reason to improve E is strong (person-affecting). Choosing to help E is clearly permissible, likely obligatory.
          *   **Team Reductionist Prediction:** There *is* a positive (impersonal) moral reason to create C (adding a happy life makes the world better). However, this reason might be outweighed by the strong person-affecting reason to improve E's life. The choice is non-obvious; depending on the magnitude of gains, creating C *could* be the better option. The reason to create C is real but potentially weaker than the reason to help E.
          *   **Why Crucial?** Tests whether "no duty" implies "no reason" (Asymmetry) or merely "a weak/overridable reason" (Reductionist). Isolates the moral status of the potential happy life itself.

     3.3. **Crux 3: Can a purely person-affecting framework coherently accommodate the asymmetry without implausible consequences (e.g., paralysis, anti-natalism, repugnant conclusions)?**
          *   **Test Case: The Non-Identity Dilemma:** Building a playground causes small, unavoidable pollution that slightly increases the risk of a minor health defect decades later. This pollution also subtly alters conception patterns: *different children* will exist if the playground is built than if it isn't. The children who exist if it's built will have lives *very well worth living* (net positive, including the minor defect), but slightly *less* happy on average than the children who *would* have existed if it wasn't built (who would also have very well worth living lives). The playground provides significant joy to existing children now.
          *   **Team Asymmetry Prediction:** Building the playground is likely permissible. While creating slightly less happy people *might* be seen as a weak impersonal negative, the strong person-affecting reason to benefit *existing* children (who cannot be "replaced" without identity change) outweighs it. The asymmetry helps avoid the paralysis of worrying about minor impersonal losses to future, non-identifiable persons. (*Note: Specific person-affecting theories may vary here*).
          *   **Team Reductionist Prediction:** Person-affecting views struggle here. If creating the slightly less happy people is "worse for" none of them (compared to their non-existence), and if the asymmetry denies a reason to create the *slightly happier* possible people, then the person-affecting view may lack the resources to explain why building the playground (creating less happy people) isn't wrong, or why *not* building it (failing to create happier people) isn't obligatory. Impersonal views easily explain permissibility (net benefit to existing children outweighs minor impersonal loss).
          *   **Why Crucial?** Tests the practical coherence and plausibility of person-affecting asymmetry theories vs. impersonal theories in complex non-identity scenarios.

  ---

  **4. Verbal/Conceptual Clarifications (Potential Equivocations):**

  *   **"Harm":** This is a major source of potential equivocation. Team Asymmetry uses "harm" in a *counterfactual-comparative sense* (creating someone into a state worse than non-existence *harms* them). Team Reductionist typically reserves "harm" for *worsening the state of an existing person*. **Flag:** Disagreement over the applicability of "harm" to creation may be partially verbal. The substantive disagreement is whether creating a miserable person generates a *special, person-affecting kind of moral reason* distinct from impersonal badness.
  *   **"Good For":** Both sides agree that a happy life is "good for" the person living it and a miserable life is "bad for" them. The disagreement is not primarily about the meaning of "good for," but about the **moral reasons generated** by the *prospect* of bringing about states that are "good for" or "bad for" a potential person. **Flag:** Accusations of equivocation on "good for" likely miss the target; the dispute lies in the normative implications of welfare for potential persons.
  *   **"Wronging":** Similar to "harm." Team Asymmetry might say creating a miserable person *wrongs* that person. Team Reductionist typically denies this, arguing you cannot wrong someone by creating them unless their life is not worth living *and* there was a better alternative *for them* (which there isn't, given non-identity). **Flag:** The substantive question is whether the moral reason against creation has a patient-directed (person-affecting) structure.

  ---
  **Signatures:**
  [_________________________] (Team Asymmetry Representative)
  [_________________________] (Team Reductionist Representative)
  [Date]

  This document provides the requested structure: clear agreements, disagreements stated fairly, test cases isolating cruxes, and flags for verbal pitfalls. It avoids adjudication, focuses on mapping, and uses wording designed for endorsement by both sides as a foundation for more productive engagement.
