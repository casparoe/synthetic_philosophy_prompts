prompt: |-
  I'm the parliamentarian for a professional association's governing council. We meet monthly, and I'm the one who runs the votes and keeps the minutes. Over the last year Ive noticed something that keeps happening: when a motion has several parts, the outcome depends on whether we vote the parts one at a time and then let the overall result fall out, or just take a single vote on the whole motion. Same people, same votes, but the decision flips. I've heard people call this the discursive dilemma or the doctrinal paradox, but nobody on the council knows the theory and they're not going to learn it.

  What I want is a standing procedure I can actually run. Not a lecture. The decisions are things like: expelling a member, which by our rules requires two separate findings both to pass; adopting a policy resolution with three operative clauses; approving a budget line that requires three conditions to be met. The stakes are real — people can lose their membership, the association takes public positions, and it's dues money. The meetings run 90 minutes, so I need something I can use in the few minutes between when debate ends and when I call the vote. The chair has to sign off on whatever I use, and she wants to know what to tell a member who says the result looks contradictory.

  Please write the procedure as a checklist with the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a mechanical one. It should say when to vote the parts first and let the result fall out, when to vote the whole thing directly, and when to do neither. It should also tell me how to spot someone trying to game the order of the votes, and how to phrase the minutes so the council doesnt look incoherent when the paradox actually shows up. Then run the procedure on two or three worked cases. One of them should be a case where the procedure gives an answer I personally won't like, and you should say what I should do then. Finally, tell me what the procedure can't do — the cases it will get wrong or just not settle.
reasoning: |-
  We are facing the doctrinal paradox (also known as discursive dilemma) in which the outcome of a vote on a multi-part motion can change depending on whether we vote on the parts individually (premise-based) or on the whole motion (conclusion-based). The goal is to have a standing procedure that is practical and can be implemented quickly during a meeting.

  The procedure must:
  1. Be a checklist with ordered questions.
  2. Specify what counts as a sufficient answer to each question.
  3. Indicate where the procedure stops with a "no" and where it hands the decision to a person (values call).
  4. Specify when to vote on parts first (premise-based), when to vote on the whole directly (conclusion-based), and when to do neither.
  5. Help spot attempts to game the order of votes.
  6. Provide guidance on phrasing the minutes to avoid the appearance of incoherence.
  7. Include worked examples, including one where the result is not liked by the parliamentarian.
  8. State the limitations of the procedure.

  After research, note that the doctrinal paradox arises when:
  - There are multiple premises (conditions) that lead to a conclusion (decision).
  - The group might have a majority for each premise individually but not for the conclusion, or vice versa.

  We need a procedure that, for a given motion with multiple parts, decides the voting method (premise-based or conclusion-based) in a way that is fair and consistent.

  However, the choice between premise and conclusion-based voting is not arbitrary. The literature suggests:
  - Premise-based is appropriate when the premises are independently important (e.g., when each condition must be met for the conclusion to hold, and we care about recording the group's judgment on each condition).
  - Conclusion-based is appropriate when the group only cares about the bottom line.

  But in our association, the rules may sometimes dictate the method (e.g., for expelling a member, the rules require two separate findings). Therefore, we must first check the rules.

  Proposed Procedure Checklist:

  1. **Check the Rules**: Does the association's governing document (bylaws, standing rules) specify the voting method for this type of motion?
     - Sufficient answer: Yes (with citation) or No.
     - If Yes: Follow the rule. Stop. (No further steps needed.)
     - If No: Proceed to step 2.

  2. **Determine the Logical Structure**: Is the motion structured such that the conclusion (overall decision) is defined by a logical combination of the parts? (e.g., all parts must pass for the whole to pass? Or any one? Or a specific combination?)
     - Sufficient answer: The mover must state the logical structure when moving the motion. If not, the chair must ask the mover to clarify immediately.
     - If the structure is "AND" (all parts must pass for the whole to pass) or "OR" (at least one part must pass) or a more complex combination, note it.
     - If the structure is not clear, the chair must rule on the structure (values call). The chair may consult the parliamentarian and the mover. The chair's ruling is final.
     - Proceed to step 3.

  3. **Assess the Purpose**: Is the primary purpose of the vote to:
     a) Record the group's judgment on each part (premises) because they have independent significance? OR
     b) Reach a collective decision on the overall question (conclusion) without necessarily recording the parts?
     - This is a values call. The chair, in consultation with the parliamentarian, must decide. The chair may ask the council for input but should not spend excessive time. The chair should consider:
        - If the parts are policy positions that might be referenced separately in the future, then premise-based is better.
        - If the parts are conditions that are only relevant for this decision and the group cares only about the outcome, then conclusion-based is better.
        - If the motion is about expelling a member (and the rules don't specify), then the two findings are independently important and should be voted separately (premise-based) because they protect the member's due process.
     - The chair's decision is final. Proceed accordingly.

  4. **Voting Procedure**:
     - If premise-based: Vote on each part in a logical order (if the parts are independent, order doesn't matter; if dependent, vote prerequisites first). Then the conclusion is determined by the logical structure (e.g., if all parts pass, the whole passes). Record each part's vote and the resulting conclusion.
     - If conclusion-based: Vote only on the entire motion. Do not vote on the parts. Record only the overall vote.

  5. **Handling the Paradox**: If the paradox occurs (e.g., in premise-based voting the parts get majority but the conclusion would fail, or vice versa) and someone points out an apparent contradiction, the chair should explain:
     - "The council has voted on the premises (or the conclusion) as a whole. The outcome is determined by the voting method we agreed upon, which was chosen because [reason from step 3]. The result is not contradictory because we have followed the procedure that best reflects our priorities for this decision."

  6. **Spotting Gaming**: Be alert if a member proposes a voting order that seems designed to achieve a particular outcome. For example:
     - If a member insists on premise-based when the conclusion might be unpopular, or conclusion-based when they fear the premises won't pass individually.
     - The parliamentarian should note to the chair if a proposed order seems to manipulate the outcome. The chair should then consider the primary purpose (step 3) and not let the gaming attempt influence the method.

  7. **Minutes Phrasing**:
     - For premise-based voting: Record the vote on each part and the resulting outcome. Example: "The council voted on Part A: [result]; Part B: [result]. As both parts passed, the motion [description] is adopted."
     - For conclusion-based voting: Record only the overall vote. Example: "The council voted on the motion [description]: [result]."
     - If the paradox occurs and is noticed, add: "The council followed the [premise/conclusion]-based voting procedure as determined by the chair based on the independent significance of the parts / the overall decision being the primary concern."

  Worked Examples:

  Example 1: Expelling a Member (Rule requires two separate findings)
  - Step 1: The rules specify two separate votes. So we vote on each finding (premise-based). The overall expulsion passes only if both pass.
  - Suppose we have two findings: (A) The member violated rule X, and (B) The violation warrants expulsion.
  - Vote on A: passes 6-5.
  - Vote on B: fails 5-6.
  - Result: Expulsion fails even though A passed. There's no paradox because the rules dictate the method.

  Example 2: Policy Resolution with Three Operative Clauses (without rule)
  - Step 1: No rule.
  - Step 2: Mover states that the resolution is adopted as a whole. The logical structure: all clauses must be adopted together? Or can they be divided? The mover says it's a package. So the structure is that the entire resolution must pass as a whole (so if we do premise-based, we would have to pass all clauses for the resolution to pass). But the chair must decide the voting method.
  - Step 3: The chair consults with the parliamentarian. The clauses are interdependent (they form a coherent policy). The chair decides that the primary purpose is to adopt the entire policy, so conclusion-based voting is used.
  - Vote on the entire resolution: fails 5-6.
  - Result: The resolution is not adopted.

  Example 3: Budget Line with Three Conditions (without rule)
  - Step 1: No rule.
  - Step 2: The motion states that the budget line is approved if Condition A, B, and C are met (logical AND).
  - Step 3: The chair decides that the conditions are independently important (e.g., they are criteria set by the finance committee). Therefore, premise-based voting is used.
  - Vote on A: passes 6-5.
  - Vote on B: passes 6-5.
  - Vote on C: fails 4-7.
  - Result: The budget line is not approved because Condition C failed.
  - Now, suppose we had done conclusion-based: the entire motion to approve the budget line might have passed 6-5? Then the paradox would have occurred. But with our procedure, we avoided it by choosing premise-based because the conditions were independently important.

  Example 4: A case the parliamentarian won't like.
  - Motion: To approve an event that requires two conditions: (A) The event is financially viable, and (B) The event aligns with the association's mission.
  - Step 1: No rule.
  - Step 2: Logical structure is A AND B.
  - Step 3: The chair (after consulting) decides that both conditions are important and should be recorded, so premise-based.
  - Vote on A: fails 5-6 (not financially viable).
  - Vote on B: passes 8-3 (aligns with mission).
  - Result: The event is not approved because A failed.
  - As parliamentarian, I believe the event is mission-aligned and I think it should be approved. But the procedure led to the event being rejected because of the financial condition. What should I do? 
     - I must execute the procedure without bias. The chair's ruling on the voting method is final. I record the votes and the result. I do not let my personal preference interfere.

  Limitations of the Procedure:
  - It cannot eliminate the paradox. The paradox is inherent in collective decision-making. The procedure only chooses a method to minimize the chance of a result that the group would find unacceptable, but it cannot guarantee a consistent outcome in all cases.
  - It relies on the chair's judgment in step 3. If the chair makes a poor decision, the method might not reflect the group's intent.
  - It does not resolve the paradox when it occurs. It only provides a way to explain it.
  - It cannot handle very complex logical structures (e.g., combinations of AND/OR) without becoming cumbersome.
  - It does not address strategic voting by members (where they vote against their true preference to manipulate the outcome).

  Final Procedure Checklist (for the parliamentarian to follow):

  1. **Check the Rules**:
     - Is the voting method specified in the association's governing documents?
       - Yes: Use that method. Stop.
       - No: Proceed to step 2.

  2. **Clarify the Logical Structure**:
     - Ask the mover: "What is the logical relationship between the parts? (e.g., all must pass? any one? etc.)"
     - If unclear, the chair rules on the structure. Proceed to step 3.

  3. **Determine the Primary Purpose** (Chair's values call, after consulting parliamentarian):
     - Are the parts independently significant? (e.g., due process, future reference, separate policies) -> Premise-based.
     - Is the overall decision the only thing that matters? -> Conclusion-based.
     - Chair announces the method.

  4. **Conduct the Vote**:
     - Premise-based: Vote on each part in a logical order. Compute the result based on the structure.
     - Conclusion-based: Vote on the entire motion.

  5. **Record in Minutes**:
     - Premise-based: Record each part's vote and the resulting outcome.
     - Conclusion-based: Record only the overall vote.

  6. **Addressing the Paradox**:
     - If a member points out a seeming contradiction, the chair explains: "We followed the procedure that best reflected our priorities for this decision. The outcome is determined by the method we agreed upon."

  7. **Watch for Gaming**:
     - Parliamentarian alerts chair if a member's request for a particular method seems manipulative. The chair should base the decision on step 3, not the manipulative intent.

  This procedure should fit within the 90-minute meeting because steps 1-3 can be done quickly (1-2 minutes) if the parliamentarian and chair are prepared.
answer: |-
  Below is a practical, checklist-based standing procedure for handling multi-part votes to avoid the "discursive dilemma" (where outcomes flip based on voting order). This is designed for speed (under 5 minutes) and clarity, with built-in safeguards against gaming. The chair must approve this procedure in advance and apply it consistently.

  ---

  ### **Standing Procedure for Multi-Part Votes: Checklist**

  **When to Use:** For any motion with multiple interdependent parts (e.g., conditions, clauses, findings) where the outcome depends on logical relationships (e.g., "all parts must pass" or "any part passing suffices").  
  **Who Decides:** Chair rules on steps 2–3 after consulting the parliamentarian. Parliamentarian executes steps 4–6.  
  **Time Limit:** 2–4 minutes total. If debate resumes, restart the checklist.

  #### **Step 1: Check Rules and Structure**  
  - **Question:** "Do our governing documents (bylaws, policies) specify how to vote on this type of motion?"  
  - **Sufficient Answer:**  
    - **Yes** (with exact rule citation): Follow the rule exactly. **Stop here.**  
    - **No:** Proceed to Step 2.  
  - **If Stop:** Vote as rules require. No discretion allowed.  
  - **Gaming Alert:** If someone demands a method that contradicts rules, note it as out of order.

  #### **Step 2: Define the Logic**  
  - **Question:** "What is the logical relationship between the parts? (e.g., ALL must pass? AT LEAST ONE must pass?)"  
  - **Sufficient Answer:**  
    - Mover must state logic during motion (e.g., "all clauses are required" or "any condition suffices").  
    - If unclear, chair rules immediately (no debate).  
  - **Handoff:** Chair decides logic based on mover’s intent. Values call (e.g., "expulsion requires two independent findings" → ALL must pass).  
  - **If Unresolvable:** Motion is void for ambiguity. **Stop.**  
  - **Gaming Alert:** If mover changes logic after debate, rule it out of order (prevents bait-and-switch).

  #### **Step 3: Choose Voting Method**  
  - **Question:** "Is the group’s judgment on individual parts independently important?"  
  - **Sufficient Answer (Chair’s Values Call):**  
    - **Premise-Based (vote parts first) if:**  
      - Parts have standalone significance (e.g., findings in expulsion, policy clauses cited separately).  
      - Due process or transparency requires recording each part (e.g., member discipline, compliance).  
    - **Conclusion-Based (vote whole motion) if:**  
      - Only the final outcome matters (e.g., budget approval, procedural votes).  
      - Parts are trivial without the whole (e.g., event planning details).  
    - **Neither (rewrite motion) if:**  
      - Logic is complex (e.g., mixed AND/OR) or time is short. Chair may split motion.  
  - **Default:** Premise-based for discipline/policy; conclusion-based for budgets/operations.  
  - **Gaming Alert:** If someone pushes a method that benefits their side, ignore tactics and apply values.

  #### **Step 4: Execute Vote**  
  - **Premise-Based (for "ALL" logic):**  
    - Vote parts sequentially.  
    - Outcome: Whole passes only if all parts pass.  
  - **Premise-Based (for "ANY" logic):**  
    - Vote parts sequentially.  
    - Outcome: Whole passes if any part passes.  
  - **Conclusion-Based:**  
    - Vote entire motion only. No part votes.  
  - **Time Saver:** Use voice votes unless a member demands roll call.

  #### **Step 5: Record Minutes to Avoid Incoherence**  
  - **Premise-Based Example:**  
    > "Voted on Motion X: Part A (Condition 1) adopted 8–3; Part B (Condition 2) rejected 6–5. Per the motion’s logic (both required), Motion X fails."  
  - **Conclusion-Based Example:**  
    > "Voted on Motion Y as a whole: rejected 7–4."  
  - **If Paradox Occurs:** Add this note:  
    > "The outcome reflects the voting method chosen to prioritize [transparency/efficiency]. No further vote is in order."  
  - **Key:** Never record part votes in conclusion-based minutes (avoids contradiction).

  #### **Step 6: Handle Challenges**  
  - **If Member Calls Result Contradictory:** Chair says:  
    > "The result follows the procedure we use to balance thoroughness and efficiency. It is final."  
  - **If Gaming Suspected:** Parliamentarian notes in minutes: "Member [Name] requested [method] contrary to Step [X]."  
  - **Appeals:** A 2/3 vote can override chair’s Step 3 ruling (rare; use only if values call is egregious).

  ---

  ### **Worked Examples**

  #### **Case 1: Expelling a Member (You Like the Outcome)**  
  - **Motion:** "Expel Member Doe for: (A) Theft, and (B) Harassment." Rules require both findings.  
  - **Step 1:** Rules specify premise-based (two findings). **Stop.** Vote parts.  
  - **Votes:** A passes 7–4; B passes 6–5. Outcome: Expulsion passes.  
  - **Minutes:** "Finding A (theft) adopted 7–4; Finding B (harassment) adopted 6–5. Member Doe expelled per Rule 4.1."  
  - **Why It Works:** Rules forced premise-based, avoiding paradox.

  #### **Case 2: Policy Resolution (You Dislike the Outcome)**  
  - **Motion:** "Adopt policy: (A) Ban fossil fuels, (B) Mandate offsets, (C) Fund renewables." No rules.  
  - **Step 2:** Mover says all clauses interdependent (ALL must pass).  
  - **Step 3:** Chair rules parts are independently important (future citations). → **Premise-based.**  
  - **Votes:** A passes 6–5, B passes 6–5, C fails 4–7. Outcome: Whole policy fails.  
  - **You Dislike This:** You supported the policy, but C failed. Outcome is binding.  
  - **What You Do:** Execute impartially. Minutes: "Clause A adopted 6–5; Clause B adopted 6–5; Clause C rejected 4–7. Policy fails as all clauses required."  
  - **Chair’s Script for Challenges:** "We voted on clauses to record our stance on each. The result stands."

  #### **Case 3: Budget Line (Paradox Risk)**  
  - **Motion:** "Approve $10k for training if: (A) Funds available, (B) Trainer qualified, (C) Alignment with goals." No rules.  
  - **Step 2:** Mover says ALL must pass.  
  - **Step 3:** Chair rules conditions are procedural → **Conclusion-based.**  
  - **Vote:** Whole motion passes 7–6.  
  - **Minutes:** "Motion to approve training budget line: adopted 7–6."  
  - **Paradox Averted:** If done premise-based, A/B might pass but C fail, sinking a popular item. Chair’s call prevented this.

  ---

  ### **What the Procedure Can’t Do (Limitations)**  
  1. **Complex Logic:** Fails for nested conditions (e.g., "A AND (B OR C)"). Rewrite the motion or use conclusion-based.  
  2. **Strategic Voting:** Won’t stop members from lying about preferences to manipulate outcomes.  
  3. **Tiebreaking:** If votes tie, standard rules apply (e.g., motion fails).  
  4. **Post-Hoc Fixes:** Cannot resolve paradox after votes; prevention is key.  
  5. **Subjectivity:** Chair’s Step 3 call may feel arbitrary if values clash. Appeal is the only recourse.  
  6. **Time Overruns:** If debate resumes after starting the checklist, restart the process.  

  **Final Advice:** Train the chair on this checklist before meetings. In 90% of cases, Step 1 (rules) or Step 3 defaults (premise for discipline, conclusion for budgets) will apply. When the paradox appears, minutes phrasing is your best defense against claims of incoherence.
