  The three classic methods are:
  1. Random endpoints: Choose two random points on the circumference and draw the chord between them.
  2. Random radial point: Choose a random radius and a random point on that radius, then draw the chord perpendicular to the radius at that point.
  3. Random midpoint: Choose a random point inside the circle (the midpoint of the chord) and then draw the chord that has that midpoint.

  For each method, the probability that the chord is longer than the side of the equilateral triangle is:
  1. 1/3
  2. 1/2
  3. 1/4

  We want the participants to generate chords by these methods, measure the chord lengths, compare to the side of the triangle, and then pool their data to see the discrepancy.

