  ### Structured Activity: Bertrand's Paradox Exploration

  #### **Goal**: Participants discover that different "reasonable" methods for generating "random chords" yield different probabilities for the chord being longer than the side of an inscribed equilateral triangle, revealing the ambiguity in the principle of indifference.

  #### **Materials** (per group of 3–4 participants):
  - **Circle template**: A printed circle (radius 10 cm) with a visible center. Templates differ by method:
    - **Method 1**: Circle *without* inner markings.
    - **Method 2**: Circle with a **concentric inner circle** of radius 5 cm.
    - **Method 3**: Circle with **grid lines** (1 cm grid) and a concentric inner circle of radius 5 cm.
  - **Random generation tools**:
    - **Method 1**: Two spinners (marked 0°–360°) or a list of pre-generated random angle pairs.
    - **Method 2**: One spinner (0°–360°) and a bag of numbered tokens (0–100, representing % of radius).
    - **Method 3**: A bag of coordinate pairs (pre-generated random points inside the circle).
  - **Measuring tools**: Ruler, compass, string cut to the **reference length** (side of triangle = \(10\sqrt{3} \approx 17.3\) cm).
  - **Recording sheet**: Tally for "long" chords (longer than 17.3 cm).
  - **Whiteboard** for pooling results.

  ---

  ### **Timeline** (90 minutes total):
  1. **Introduction (10 min)**:
     - State the question: *"What’s the probability that a random chord is longer than the side of an inscribed equilateral triangle?"*
     - Show the circle, triangle, and reference length (17.3 cm). Explain "chord."
     - Split into 3 groups (one per method). Do **not** reveal methods differ.

  2. **Activity: Generate and Measure Chords (40 min)**:
     - **Groups work independently** (12–15 min per method, 10 chords per group).
     - **Rules for each method** (give written instructions; groups don’t see others’ methods):

  | Method | How to Generate a Chord | How to Check "Long" Chord |
  |--------|--------------------------|----------------------------|
  | **1: Random Endpoints** | Spin twice to get angles \(A\) and \(B\). Mark points on circumference. Draw chord between them. | Measure chord length with string/ruler. Compare to 17.3 cm. |
  | **2: Random Radius + Point** | Spin once for angle (direction). Draw radius. Pick token (e.g., 70) → mark point 7 cm from center. Draw perpendicular chord at that point. | If marked point is **inside inner circle** (≤5 cm from center), chord is long. |
  | **3: Random Midpoint** | Pick random \((x, y)\) from bag (e.g., (2.1, -1.3)). Plot as midpoint. Draw chord perpendicular to the radius through that point. | If midpoint is **inside inner circle** (≤5 cm from center), chord is long. |

     - **Groups record**: For each chord, note if it’s longer than 17.3 cm.

  3. **Pool Results (10 min)**:
     - Groups report tallies on whiteboard:
       - Method 1: X long / 10 chords
       - Method 2: Y long / 10 chords
       - Method 3: Z long / 10 chords
     - Calculate proportions (e.g., 5/10 = 0.5).

  4. **Debrief (30 min)**:
     - **Reveal the divergence** (5 min):  
       *"Look at these numbers. We all answered the same question, but got different results: [cite proportions]. Why?"*
     - **Map activity to the paradox** (15 min):
       - Have each group explain their method.
       - Write methods on the board:
         - Method 1: **Random endpoints** (uniform on circumference).
         - Method 2: **Random point on radius** (uniform along radial distance).
         - Method 3: **Random midpoint** (uniform over area).
       - Highlight the **principle of indifference**:  
         *"Each method assumed something was 'uniformly random': angles, radial distance, or area. Each seems equally reasonable! But they lead to different probabilities."*
       - Connect to theoretical results:
         - Method 1: \(\sim \frac{1}{3}\) (central angle > 120°).
         - Method 2: \(\sim \frac{1}{2}\) (distance from center < \(\frac{R}{2}\)).
         - Method 3: \(\sim \frac{1}{4}\) (midpoint in inner circle of radius \(\frac{R}{2}\)).
     - **Conceptual punchline** (10 min):
       - *"The paradox shows 'random chord' is underspecified. The principle of indifference doesn’t tell us which 'symmetry' to use—it’s not a neutral default, but a choice."*
       - Relate to prior puzzles: *"Like Monty Hall, the mechanism matters. Here, the 'how' changes the answer."*
       - Conclusion: *"Probability isn’t just about outcomes; it’s about the process that generates them."*

  ---

  ### **What Will Go Wrong (Predictable Issues)**:
  1. **Sampling noise**: With 10 chords, proportions may not perfectly match theory (e.g., Method 3 could yield 2/10 or 3/10 vs. ideal 2.5/10).  
     - **Mitigation**: Stress trend over exact numbers. Use whiteboard to average if multiple groups use same method.

  2. **Measurement errors**: String comparison may be imprecise (Method 1).  
     - **Mitigation**: Use stiff string and rulers. For Methods 2/3, inner circle avoids measurement.

  3. **Midpoint generation (Method 3)**: Drawing chords from midpoints is time-consuming.  
     - **Mitigation**: Pre-generated points and grid lines speed up plotting. Skip drawing chords after 1–2 examples.

  4. **The activity cannot reproduce**:  
     - **The infinite limit/measure theory**. Participants see *empirical* divergence, but you must *verbally explain* that with infinite trials, probabilities converge to \(\frac{1}{3}\), \(\frac{1}{2}\), \(\frac{1}{4}\)—no "right" answer.

  ---

  ### **One-Sentence Takeaway for Participants**:  
  > *"The same question—'What is the probability of a random chord?'—yields different answers depending on how you define 'random,' revealing that probability is inseparable from the mechanism of choice."*
