prompt: |-
  Hey — I wanted to get a careful philosophical read on something that's been bugging me at work. I'm a software engineer, and over the past year or so our team has settled into this workflow where a big chunk of the code we ship gets drafted by an AI assistant. The norm that's grown up is basically: it's fine to merge the AI's code as long as the tests pass, you've read through the diff, and you can give a rough one-paragraph summery of what it does and where the risky parts are. Nobody has to be able to rewrite the tricky parts from scratch, or say why a particular locking strategy got chosen over the alternatives, as long as the summary is at the level of "it caches lookups and retries on failure." A few of us have noticed that we're loosing the ability to write some of this stuff without the assistant, and that our explanations of our own code are getting shallower. But the code ships and it works, and management is happy.

  I'm taking an epistemology class right now, and it made me wonder what view of understanding — or knowledge, or epistemic dependence — this practice actually presupposes. Does it presuppose that understanding is just having a reliable-enough ability to produce correct output, or a reliable-enough ability to supervise something that produces correct output, rather than grasping why the thing works? Is the practice even coherent — does it treat the AI as a tool, a source of testimony, a colleague, or something else? And would the practice have to change if you held a view on which understanding requires something like grasping the explanatory structure of the code?

  You're a professional philosopher working on epistemology and the philosophy of technology. Take your time, maybe brainstorm two or three candidate readings of the practice before settling on the one you think is best. Please answer in American English. One thing I'd especially appreciate: separate what's actually settled from what's genuinely contested among people who work on understanding and epistemic dependence, and don't present a contested view as the consensus. If the practice is philosophically underdetermined — several theories would license it — say that too.
