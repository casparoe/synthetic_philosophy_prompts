prompt: |-
  I'm a PhD student in political philosophy working on precommitment and democratic theory, and I've been trying to get clear on what I actually think by working through cases. I'd like you to look at my verdicts and tell me what principle, if any, captures the pattern — or whether some of my verdicts need to go.

  Here are the cases:

  1. **Ulysses.** Ulysses instructs his crew to tie him to the mast and to ignore any contrary orders until they have sailed past the sirens. When they pass the sirens, he begs to be released. The crew refuses. I think the crew acts rightly, and Ulysses' earlier instruction is binding on his later self.

  2. **Advance directive.** A woman in her fifties, in excellent mental health, signs an advance directive stating that if she develops severe dementia, she refuses antibiotics for life-threatening pneumonia. At seventy, she has moderate dementia. She seems content, enjoys visits from her grandchildren, and when asked, says she wants to live. She contracts pneumonia. Her family wants antibiotics administered. I think the advance directive should be honored — the treatment should be withheld.

  3. **Legislative entrenchment.** A legislature passes a statute requiring a two-thirds supermajority to repeal certain environmental protections. The statute explicitly says these provisions are binding on future legislatures. The next legislature, controlled by a different party, has a simple majority and votes to repeal the protections without meeting the supermajority threshold. I think the repeal is invalid — the supermajority requirement binds the later legislature.

  4. **Constitutional eternity clause.** A constitution contains an eternity clause stating that certain principles — say, the federal structure of the state — can never be amended, not even by the ordinary amendment procedure. Three generations later, a broad democratic movement, supported by a strong majority, seeks to amend those principles. I think the eternity clause is not binding on the later generation, however noble its intentions were.

  5. **No-divorce contract.** A couple, both competent adults, signs a legally binding agreement not to divorce for twenty years, waiving their right to petition for divorce during that period. After ten years, one spouse becomes emotionally abusive — not physically violent, but controlling and demeaning. The other spouse wants to divorce. I think the contract is not binding under these circumstances, and the divorce should be granted.

  6. **Ulysses with a release valve.** Suppose Ulysses had instead instructed his crew: "If I beg to be untied, keep me tied for one hour, and then untie me." He begs, and after one hour the crew unties him. I think this precommitment is binding, and the crew acts rightly — and moreover, this is a better precommitment than the original, precisely because it includes a built-in release condition.

  7. **Amendment of the amendment procedure.** A constitution specifies that it can be amended by a three-fourths majority. A later generation, with a simple majority but not three-fourths, wants to amend the amendment procedure itself to require only a simple majority. I think the amendment is invalid — they must follow the existing procedure even to change it.

  I'm fairly confident about cases 1, 5, 6, and 7. I'm less confident about 3. And I keep going back and forth on whether 2 and 4 can be reconciled — I feel the pull of treating them alike, since both involve a past agent trying to bind a future agent on a matter of deep importance, but my verdicts go in opposite directions.

  What I'm hoping you can do: state a principle (or a small set of candidate principles) that captures as many of these verdicts as possible, explain which cases motivate which clauses of the principle, and tell me honestly which verdicts the principle cannot accommodate. If your principle forces me to overturn one of my verdicts, say which one and why. Also, please say what your principle predicts about a case I haven't listed: a person who, while sober, hands their car keys to a friend and says, "Don't give these back to me tonight no matter what I say." Later, drunk, they demand the keys back, insisting they are fine to drive.

  Please write your answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in political philosophy working on precommitment theory, presenting seven cases with their intuitive judgments and seeking a unifying principle. 

  First, I need to understand the core tension they're wrestling with - particularly their conflicting intuitions about binding future selves (strong in Ulysses/advance directives) versus rejecting such binds for future generations (as in eternity clauses). The key cases demanding reconciliation are 2 (binding dementia patient) and 4 (rejecting constitutional eternity clause).

  Looking for patterns across all cases:
  - Temporal proximity matters: Ulysses (1) binds minutes later, dementia directive (2) binds years later, eternity clause (4) is rejected generations later
  - Harm thresholds appear crucial: divorce contract (5) becomes non-binding when abuse occurs despite waiver
  - Procedural legitimacy surfaces in legislative/amendment cases (3,7) where formal processes seem binding
  - Release mechanisms (6) are praised as superior design

  The user's "pull" to treat 2 and 4 similarly makes sense - both involve profound value commitments binding future agents. But their divergent verdicts suggest an implicit distinction between individual autonomy over one's future self (binding) versus collective self-determination across generations (not binding).

  For the drunk driving case they mentioned: the precommitment should bind because it lacks the harm threshold breach (no equivalent to dementia patient's suffering or abusive marriage) and has clear temporal limitation.

  I'll formulate a principle with three core conditions: Authority (who binds whom), Conditions (substantive limits), and Procedure (how binding occurs). This explains their judgments well except possibly case 3 (legislative entrenchment), which might require emphasizing procedural legitimacy even when substance is contested.

  Cases resisting easy reconciliation:
  - Why honor dementia directive (2) but reject eternity clause (4)? The principle distinguishes individual identity persistence (dementia patient as same "self") versus collective identity change (generations as distinct "self")
  - Legislative entrenchment (3) is tricky - is it more like Ulysses (binding) or eternity clause? I lean binding due to institutional continuity

  The exercise reveals that precommitment validity depends on whether the later agent remains recognizably the same autonomous entity - whether psychologically (individual) or politically (collective).
answer: |-
  Based on your verdicts, a principle capturing the pattern emerges, grounded in **autonomy, harm prevention, and procedural legitimacy across time**. Here's the candidate principle:

  **The Precommitment Binding Principle:**  
  *A precommitment is binding on a future self or agent if and only if:*  
  **(A)** *The precommitor had rational decision-making capacity and relevant information at the time of commitment;*  
  **(B)** *The precommitment (i) aims to prevent significant harm to the agent or others, or (ii) sustains a fundamental condition for collective self-governance; and*  
  **(C)** *The later agent (i) remains substantially the same autonomous entity (psychologically or politically), and (ii) enforcing the precommitment does not cause comparable or greater harm than it prevents.*

  ---

  ### How the Principle Explains Your Verdicts
  1. **Ulysses (Binding):**  
     - (A) Ulysses was competent/informed.  
     - (B) Prevents severe harm (death/destruction).  
     - (C) Later Ulysses is same psychological agent; harm caused (temporary distress) is lesser than harm prevented.  

  2. **Advance Directive (Binding):**  
     - (A) Woman was competent/informed.  
     - (B) Prevents harm (prolonged life against prior values). *Motivates clause (B)(i).*  
     - (C) Dementia self is not the *same autonomous agent* (identity/personhood altered); **but** harm prevented (violating core prior autonomy) outweighs harm caused (death aligned with prior wishes).  

  3. **Legislative Entrenchment (Binding):**  
     - (A) Legislature had authority.  
     - (B) Sustains collective self-governance (environmental stability). *Motivates (B)(ii).*  
     - (C) Later legislature is same *political entity*; repeal without procedure undermines governance.  

  4. **Constitutional Eternity Clause (Not Binding):**  
     - (A) Original framers were competent.  
     - (B) Aims to preserve governance structure.  
     - (C) **Fails (C)(i):** Later generation is a distinct *political agent* (demographic/cultural change); binding them violates present self-determination. *This clause forces your verdict reversal for Case 4.*  

  5. **No-Divorce Contract (Not Binding):**  
     - (A) Couple was competent.  
     - (B) No significant harm prevented initially.  
     - (C) **Fails (C)(ii):** Enforcement causes severe harm (abuse) greater than harm prevented (broken promise).  

  6. **Ulysses with Release Valve (Binding):**  
     - (A) Competent/informed.  
     - (B) Prevents harm (siren-induced death).  
     - (C) Later self remains same agent; release valve avoids disproportionate harm (permanent restraint).  

  7. **Amendment Procedure (Binding):**  
     - (A) Original procedure legitimately enacted.  
     - (B) Sustains self-governance (stability of rules).  
     - (C) Later actors are same political entity; circumventing procedure undermines collective autonomy.  

  ---

  ### Verdicts the Principle Cannot Accommodate
  - **Case 4 (Eternity Clause):** Your verdict (not binding) conflicts with the principle.  
    - **Why?** The principle’s clause (C)(i) treats later generations as distinct political agents. Eternity clauses deny their right to self-constitution, violating core democratic legitimacy. Your intuition here is correct—permanent binds undermine intergenerational sovereignty.  
    - **Solution:** Uphold your verdict and accept that eternity clauses are invalid.  

  - **Case 2 (Advance Directive) vs. Case 4 Tension:**  
    The principle resolves this by distinguishing:  
    - *Case 2:* The dementia patient is not a *new agent* but a diminished version of the same self. Honoring the directive respects her enduring prior autonomy.  
    - *Case 4:* Later generations are *new collective agents* with their own autonomy. Binding them prioritizes past sovereignty over present self-rule.  

  ---

  ### Prediction: Drunk Driving Precommitment
  - **Scenario:** Sober person gives keys to a friend: "Don’t return them tonight no matter what." Later, drunk, they demand keys back.  
  - **Principle’s Verdict:** **Binding.**  
    - (A) Sober person is competent/informed.  
    - (B) Prevents severe harm (DUI, injury, death).  
    - (C) Later self is same psychological agent; harm caused (inconvenience) is lesser than harm prevented.  
  - *Matches your Ulysses verdicts (1 & 6).*

  ---

  ### Why Case 3 (Legislative Entrenchment) Might Feel Shaky
  The principle supports your binding verdict, but democratic theory has counterarguments:  
  - If entrenchment lacks broad consensus (e.g., passed by slim majority), it may fail (A) *procedural legitimacy*.  
  - If the policy isn’t truly fundamental to governance (e.g., niche environmental rule), it may fail (B)(ii).  
  Your verdict holds if the supermajority rule protects a *foundational* public good and was enacted legitimately.

  ### Summary
  Your pattern prioritizes:  
  1. **Harm prevention** over mere preference stability.  
  2. **Identity persistence** (psychological/political) for binds.  
  3. **Procedural integrity** in collective decisions.  
  The only forced reversal is **rejecting eternity clauses (Case 4)**, which aligns with intergenerational autonomy. If you keep all other verdicts, this principle captures your core commitments.
