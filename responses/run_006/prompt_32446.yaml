prompt: |-
  I'm putting together a unit on intention and practical rationality, and I keep coming back to Kavka's toxin puzzle as the one case that actually separates serious theories from hand-wavy ones. For the handout I want the full spec: what any adequate theory of intention has to deliver if it's going to handle the toxin puzzle and the surrounding phenomena. Don't just give me the familiar points — give me the requirements list: the cases it has to get right (the basic toxin case, plus the variants where you can hire someone to force you to drink, or precommit, or where the money is contingent on *believing* you'll drink rather than intending, or where the drink is harmless but you've sworn you won't), the distinctions it can't afford to colapse (intending vs. wanting, intending vs. predicting, intending vs. being disposed, intending vs. hoping), and the results from decision theory or folk psychology it can't flatly contradict. For each requirement, say why it's a requirement — what breaks if a theory drops it. Then flag which ones are non-negotiable and which are just the prejudices of particular camps (the belief-first people, the desire-first people, the planning theorists, the anti-reductivists). The part I most want to see: whether any pair of requirements can't be jointly satisfied — e.g., can a theory both explain why you can't intend to drink the toxin (given that you're certain you won't) and allow intentions to respond to incentives the way they obviously do in ordinary precommitment cases? And which single requirement knocks out the most popular accounts. A table is fine for the scorecard part, but the weight should be on the requirements and the reasoning behind them.
reasoning: |-
  Okay, the user is putting together a unit on intention and practical rationality centered around Kavka's toxin puzzle. They want a comprehensive requirements list for any adequate theory of intention that can handle this puzzle and its variants. Let me start by recalling the toxin puzzle basics. The core issue is that an agent can't form an intention to drink a harmless toxin just because they'll get rewarded for intending, even though they know they won't drink it later. 

  First, I need to outline all the cases the theory must address: the original scenario, hiring someone, precommitment devices, belief contingencies, and harmless drink scenarios. Each variant tests different aspects of intention. For example, hiring someone tests if external mechanisms bypass the core problem, while the belief contingency variant checks if intention is distinct from belief.

  Next, the distinctions that shouldn't collapse. Intending vs. wanting is crucial because one can want the reward without intending the act. Intending vs. predicting ties into whether the agent believes they'll act. The disposition vs. intention distinction matters because dispositions might not involve commitment. And hoping is different since it lacks resolve.

  Then, constraints from decision theory and folk psychology. Decision theory requires intentions to be action-guiding and responsive to incentives, but folk psychology sees them as distinct from predictions. The challenge is reconciling these when incentives conflict, like in precommitment vs. toxin cases.

  The user wants to know which requirements are non-negotiable. Core ones include the toxin impossibility (1a), which is a litmus test. If a theory can't explain why forming the intention is impossible here, it fails. Also, the distinction between intending and believing (3b) is essential; collapsing them leads to contradictions in the toxin case where you can't believe you'll drink but are supposed to intend.

  Possible conflicts between requirements are key. For instance, incentive responsiveness (2a) and toxin impossibility (1a) clash. How can intentions respond to incentives in precommitment but not in the toxin case? Theories need to differentiate between resoluteness and mere incentives. The disposition vs. intention distinction (3c) might also conflict with toxin, as some theories reduce intention to dispositions.

  Highlighting which requirement knocks out popular theories. Belief-first theories fail because they conflate intention with belief, which the toxin case disproves. Desire-based theories can't explain why strong desires don't form intentions. Humean theories struggle with the toxin case since incentives don't translate into intention.

  The user might have deeper needs: a structured framework to evaluate theories, identifying which aspects are debated vs. consensus. They might also want to expose students to the nuances of intention, showing where theories fall short. Emphasizing the conflicts between requirements will help students critically assess different approaches.

  I should ensure each requirement is clearly explained with why it's necessary and what breaks without it. Non-negotiables are those that directly address the toxin puzzle's core challenge. Highlighting trade-offs between requirements shows the complexity of developing a coherent theory. Finally, summarizing in a table helps visualize which theories meet which requirements, aiding teaching.
answer: |-
  Here’s a comprehensive requirements list for theories of intention facing Kavka’s toxin puzzle and its variants, structured for clarity and depth. I’ll break it down into **Cases to Handle**, **Distinctions to Preserve**, **Constraints to Satisfy**, **Conflicts/Trade-offs**, and a **Scorecard** of major theories.

  ---

  ### **I. Cases Any Adequate Theory Must Handle**
  *(Why: Failure to explain any breaks the puzzle’s core challenge)*

  1.  **The Basic Toxin Puzzle (Non-Negotiable):**
      *   **Requirement (1a):** Explain why a rational agent *cannot form the intention* to drink the toxin at T2 when offered a reward *only* for forming that intention at T1 (knowing they can freely abandon it at T2 with no penalty).  
      *   **Why:** The core paradox. If a theory allows this intention formation, it trivializes intention (collapses into wishful thinking). If it forbids it but cannot explain *why*, it’s ad hoc.
      *   **What breaks if dropped:** The entire puzzle becomes irrelevant; intention loses its action-guiding/normative force.

  2.  **The Hired Enforcer Variant:**
      *   **Requirement (1b):** Explain why hiring a third party at T1 to *force* you to drink at T2 *is* rationally permissible and allows you to collect the reward.  
      *   **Why:** Shows intention isn't magic; external causal mechanisms can achieve the outcome where "pure" intention formation fails. A theory must distinguish internal commitment from external coercion.
      *   **What breaks if dropped:** Collapses the distinction between *intending* and *being caused to act*. Fails to explain precommitment.

  3.  **The Precommitment Device Variant (e.g., locking yourself in):**
      *   **Requirement (1c):** Explain why using a *self-binding mechanism* at T1 (that makes drinking inevitable at T2) is rationally permissible and allows reward collection.  
      *   **Why:** Similar to (1b), but highlights that intention can *initiate* self-binding actions *now*, even if the intended act *later* isn't directly intended *now*.
      *   **What breaks if dropped:** Undermines the planning/action-initiating role of intention. Severs link between intention and rational planning.

  4.  **The Belief Contingency Variant (Reward for *Believing* you'll drink):**
      *   **Requirement (1d):** Explain why it might be *possible* (though difficult) to cultivate the *belief* that one will drink at T2 to get the reward, even while recognizing it’s impossible to form the *intention* to drink.  
      *   **Why:** Crucially distinguishes *intention* from *belief* or *prediction*. A theory must not reduce intention to a belief about future action.
      *   **What breaks if dropped:** Collapses intention into belief/prediction (fatal for anti-reductivists and planning theories).

  5.  **The Harmless Drink + Oath Variant (You swore never to drink X):**
      *   **Requirement (1e):** Explain why, even if the drink is harmless, a prior solemn oath *not* to drink it might prevent forming the intention to drink it *for the reward alone*, despite strong incentive.  
      *   **Why:** Tests the *normative/resoluteness* aspect of intention against mere incentive. Intention isn't just about maximizing utility; it involves consistency with prior commitments/identity.
      *   **What breaks if dropped:** Reduces intention to a purely calculative disposition. Ignores the stability/planning role.

  ---

  ### **II. Distinctions Any Adequate Theory Must Preserve**
  *(Why: Collapsing these distinctions makes the puzzle unsolvable or trivial)*

  6.  **Intending vs. Merely Wanting/Desiring (Non-Negotiable):**
      *   **Requirement (3a):** The agent *wants* the reward and *wants* (instrumentally) to drink the toxin *if necessary* to get it, but cannot *intend* to drink it.  
      *   **Why:** Collapsing this (e.g., strong desire = intention) makes the toxin intention possible. Intention involves *commitment/resolution* beyond desire.
      *   **What breaks if dropped:** Desire-based theories (Humean) fail the basic puzzle (1a).

  7.  **Intending vs. Predicting/Believing (Non-Negotiable):**
      *   **Requirement (3b):** An agent can predict/believe they *won’t* drink the toxin while simultaneously (failing to) *intend* to drink it.  
      *   **Why:** Core to the puzzle. If intending entails believing you will do it, then in the basic case, you *cannot* form the intention *because* you know you won't do it. But this must be a *consequence* of the theory, not its definition (or 1d becomes impossible).  
      *   **What breaks if dropped:** Belief-first theories fail (1d & potentially 1a). Makes intention formation dependent on epistemic uncertainty in a problematic way.

  8.  **Intending vs. Being Disposed:**
      *   **Requirement (3c):** An agent might have a *disposition* to drink in some counterfactual scenarios (e.g., if forced) without *intending* to drink *now*.  
      *   **Why:** Reductive dispositional accounts struggle with (1a). Intention is an *active commitment state*, not just a passive disposition.
      *   **What breaks if dropped:** Reductivist dispositional accounts might allow the toxin intention incorrectly.

  9.  **Intending vs. Hoping/Wishing:**
      *   **Requirement (3d):** The agent can *hope* they form the intention or *wish* they could drink, without actually intending.  
      *   **Why:** Highlights the *practical* nature of intention – it involves settling on a plan, not just favorable contemplation.
      *   **What breaks if dropped:** Blurs the line between practical reasoning and fantasy. Fails (1a).

  ---

  ### **III. Constraints from Wider Frameworks**
  *(Why: A theory can't be isolated or contradict established rationality/psychology)*

  10. **Incentive-Responsiveness (Decision Theory):**
      *   **Requirement (2a):** Intentions must generally be *responsive to incentives* (e.g., forming precommitment intentions in 1b/1c).  
      *   **Why:** Explains ordinary precommitment. If intentions *weren't* responsive, planning would be irrational.
      *   **What breaks if dropped:** Makes precommitment (1b/1c) inexplicable. Severs link between rationality and intention formation.

  11. **Action-Guidance & Stability (Folk Psychology/Planning):**
      *   **Requirement (2b):** Intention must *causally dispose* the agent towards the intended action and *resist reconsideration* without new reason.  
      *   **Why:** Core functional role of intention in explaining/predicting behavior and enabling planning.
      *   **What breaks if dropped:** Intention becomes inert. Fails to explain how intentions guide action (e.g., in precommitment cases).

  12. **Consistency with Self-Prediction (Folk Psychology):**
      *   **Requirement (2c):** Forming an intention typically licenses self-prediction ("I will φ"), but this prediction isn't *constitutive* of the intention (per 3b).  
      *   **Why:** Captures the commonsense link between deciding and expecting to act, without collapsing the distinction.
      *   **What breaks if dropped:** Creates a disconnect between practical reasoning and self-knowledge.

  ---

  ### **IV. Key Conflicts & Trade-offs**
  *   **The Core Tension:** **Incentive-Responsiveness (2a) vs. Toxin Impossibility (1a):** How can intentions respond to incentives in precommitment (1b/1c) but *not* in the basic toxin case?  
      *   **Resolution Requirement:** A theory must distinguish cases where forming an intention *directly* causes the beneficial outcome (toxin: reward for intention *itself*) vs. cases where forming the intention *initiates a causal chain* leading to the outcome (precommitment: intention causes setup, which causes action, which causes reward). Intention formation must be responsive to the *expected consequences of the intended action*, not (directly) to rewards *for having the intention*. (This knocks out simple evidential decision theory).

  *   **Disposition vs. Commitment (3c vs. 1a/1e):** Can a disposition robust enough to guarantee action in the toxin case *be* the intention? Or is something more (normative commitment, plan endorsement) required? Anti-reductivists argue the latter.

  *   **Belief Constraint (3b) vs. Belief Contingency (1d):** If intention requires belief (strong belief-constraint), (1d) is impossible. If it doesn't, how does the belief-constraint *arise* in the toxin case? Theories must explain *why* knowing you won't act *prevents* intention formation without defining intention as belief.

  ---

  ### **V. The Requirement That Eliminates the Most Theories: Requirement 1a + 3b (Toxin Impossibility + Intention ≠ Belief)**
  *   **Knocks Out:**
      *   **Strong Belief-First Theories (e.g., Velleman, early Harman):** If intending *is* believing you will act, you cannot intend to drink because you know you won't. But this makes (1d) impossible and struggles to explain how precommitment intentions *are* formed (you *can* believe you'll set up the lock, even if unsure about the later action).
      *   **Simple Desire-Based/Dispositional Theories (Humean):** If intention is just the strongest current desire or a disposition to act, the massive incentive *should* create the intention/disposition. They cannot explain its impossibility.
      *   **Evidential Decision Theory (EDT):** EDT might recommend "deciding" to drink to *evidence* your toughness to the benefactor. Fails (1a) spectacularly.

  ---

  ### **VI. Theory Scorecard: Who Meets Which Requirements?**

  | Theory Type              | Core Mechanism                     | Handles 1a (Basic Toxin) | Handles 1b/1c (Enforcer/Precommit) | Handles 1d (Belief Contingent) | Preserves 3a (≠Wanting) | Preserves 3b (≠Belief) | Satisfies 2a (Incentive Resp.) | Satisfies 2b (Action Guidance) | Major Weakness |
  | :----------------------- | :--------------------------------- | :-----------------------: | :---------------------------------: | :-----------------------------: | :---------------------: | :---------------------: | :-----------------------------: | :----------------------------: | :------------ |
  | **Strong Belief-First**  | Intention = Belief you will act      |          ✅ (Trivially)         |                 ❌                  |                ❌               |           ⚠️           |      ❌ (Collapses)      |                ❌               |               ⚠️               | Fails 1d, 3b, 2a |
  | **Planning Theory (Bratman)** | Intention as plan commitment element |            ✅             |                 ✅                 |                ✅               |           ✅            |           ✅            |                ✅               |               ✅               | Needs supplement for toxin resistance? |
  | **Anti-Reductive (e.g., Anscombe)** | Intention as distinctive practical knowledge |            ✅             |                 ✅                 |                ✅               |           ✅            |           ✅            |                ⚠️              |               ✅               | Incentive-responsiveness (2a) less explicit |
  | **Causalist (e.g., Searle)** | Intention-in-action vs. prior       |            ✅             |                 ✅                 |                ✅               |           ✅            |           ✅            |                ⚠️              |               ✅               | Prior intention status less clear |
  | **Humean/Desire-Based**  | Intention = Strongest current desire |            ❌             |                 ✅                 |                ✅               |      ❌ (Collapses)     |           ✅            |                ✅               |               ⚠️              | Fails 1a, 3a (core) |
  | **Dispositionalist (Reductive)** | Intention = Robust disposition      |            ❌             |                 ✅                 |                ✅               |           ⚠️           |           ✅            |                ✅               |               ✅               | Fails 1a, 1e (oath) |
  | **Evidential Decision Theory** | Choose act that best signals desired outcome |            ❌             |                 ⚠️                 |                ⚠️              |           ❌           |           ❌           |                ❌               |               ❌               | Fails most requirements |

  **Key:** ✅ = Generally Satisfies, ❌ = Generally Fails, ⚠️ = Problematic/Contested

  ---

  **Conclusion for Your Handout:** The toxin puzzle demands a theory where intention is a **distinct, committal, action-guiding mental state**, **responsive to the expected outcomes of the intended action**, but **not directly responsive to rewards for having the intention itself**. It must be **sharply distinguished from belief, desire, prediction, and mere disposition**, while explaining how it **enables stable planning and precommitment**. The **core non-negotiables** are explaining the basic toxin impossibility (1a) while preserving the intention/belief distinction (3b) and incentive-responsiveness in precommitment (2a). **Planning theories (Bratman) and sophisticated anti-reductivist views currently handle the matrix best**, while **belief-first and desire-based theories are fundamentally undermined**. The unresolved tension lies in precisely **how the norm of intention stability/resoluteness** interacts with incentives in hard cases like the oath variant (1e). This puzzle remains the crucible for separating substantive theories from elegant but inadequate ones.
