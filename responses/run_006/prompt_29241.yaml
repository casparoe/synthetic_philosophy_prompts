prompt: |-
  I sit on my university's Senate committee on records and memorials, and I have been asked to draft the short opinion for a case the committee must decide next month. Two final-year students were expelled in 1963 under Regulation 14(2), which prohibited what the university then called conduct unbecoming a member of the University and was, in practice, used only against students known or suspected to be gay. The regulation had been lawfully enacted by the University Council, was published in the Calendar, and the disciplinary hearing followed the procedures then in force; it was repealed in 1974, but the expulsion still stands on the two students' academic records. The motion before us asks the committee to declare the expulsions void from the outset and to confer the degrees the students would otherwise have earned. I am a relatively new member of the committee, and I read Hart and Fuller as a law student years ago without expecting to meet them in a records committee.

  The committee is split. Some members argue that the expulsions were lawful under the university's own regulations as they then stood, and that we should expunge the records and award the degrees as a present-day act of reparation, without pretending that the 1963 decision was invalid. Others reply that a rule whose sole function was the persecution of a class of students was so defective as an exercise of law-making that it was never university law at all, and that honesty requires us to say so outright. I would like the opinion to take the Hart–Fuller debate seriously. The Hart side would caution us not to blur the question whether this was valid university law with the question whether it was abhorrent, and not to rewrite the past merely to spare ourselves the discomfort of admitting that valid law can be wicked. The Fuller side would answer that law-making is a purposive enterprise subject to an internal morality, and that a provision of this kind is not merely bad law but a failure of legality itself.

  The opinion should be something the committee could genuinely act on: a clear recommendation, the reasoning for it, and an honest treatment of the strongest consideration on the losing side. Please write the body of the opinion as exactly five numbered items, each no more than two sentences, with no introduction, headings, or sign-off; begin directly with the first numbered item. One of the five items should state what would change your recommendation — which argument or consideration, if it could be established, would lead you to a different outcome, or where your reasoning is most likely to fail. Use British English throughout.
reasoning: |-
  Hmm, the user describes a complex ethical and legal dilemma involving their university committee. They're drafting an opinion on whether to retroactively void two 1963 expulsions under a homophobic regulation. The committee is split between Hartian legal positivism (valid law even if unjust) and Fuller's natural law perspective (fundamentally unjust rules lack legal validity). 

  The constraints are challenging: a strict five-point British English format without introductions, with one point dedicated to what could change the recommendation. The user clearly wants to honor both philosophical positions while reaching a practical resolution. 

  I note the historical context matters deeply here - this isn't just about legal theory but real students whose lives were disrupted by institutional homophobia. The university's current desire for reparative justice must be balanced against historical procedural accuracy. 

  For the structure: Point 1 should establish the facts neutrally. Point 2 can frame the philosophical tension. Point 3 needs to land the recommendation decisively - I'm leaning toward voiding the expulsions under Fuller's reasoning, as it aligns better with restorative justice. Point 4 should acknowledge the Hartian counterargument respectfully. Point 5 (the contingency point) must identify a genuine weak spot - perhaps if new evidence showed the regulation wasn't exclusively applied to gay students.

  The language must remain precise yet accessible for committee members who aren't legal philosophers. British English phrasing like "university law" and "duly enacted" maintains formal tone. Most importantly, the recommendation should feel actionable while honoring the gravity of correcting historical injustice.
answer: |-
  1.  The expulsions in 1963 were procedurally correct under Regulation 14(2), a duly enacted university rule published in the Calendar and applied according to then-existing procedures; however, the rule's sole practical application targeted students based on sexual orientation, a purpose fundamentally incompatible with the university's core mission of fostering an intellectual community based on merit and dignity.  Applying Lon Fuller's principles, this rule failed the internal morality of law due to its inherent injustice and discriminatory purpose, rendering it substantively void *ab initio* as university law, regardless of its formal enactment.
  2.  While H.L.A. Hart's positivism correctly emphasises that validly enacted rules are law even if morally repugnant, and cautions against retrospectively invalidating past decisions merely because we now find them abhorrent, this case presents a unique failure of the rulemaking process itself; Regulation 14(2) was not merely a bad law, but one so devoid of congruence with the essential purposes of university governance and so abusive in its singular application that it never attained the character of genuine university law.
  3.  The committee therefore declares the 1963 expulsions void from the outset, as they were predicated on a non-existent legal rule; consequently, the university recognises that these students fulfilled the academic requirements for their degrees in 1963 and directs the conferral of those degrees *in absentia*, with the records amended to reflect this.
  4.  We acknowledge the Hartian counterargument that this approach risks rewriting history by denying the formal validity Regulation 14(2) possessed in 1963, and that reparative justice could instead be achieved by acknowledging the past wrong while explicitly awarding the degrees now as an act of atonement; however, honesty about the past requires recognising that certain exercises of power, though formally enacted, are so antithetical to legality's fundamental aspirations that they cannot be accorded retrospective legitimacy.
  5.  Our recommendation would change if compelling historical evidence demonstrated that Regulation 14(2) was applied neutrally for genuine breaches of academic integrity or community welfare unrelated to sexual orientation, thereby undermining the finding that its sole purpose and effect was discriminatory persecution; without such evidence, the rule's inherent failure of legality stands.
