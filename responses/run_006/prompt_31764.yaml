  First, I should recall psychological concepts. The fundamental attribution error comes to mind—people tend to attribute others' actions to their character rather than situations. But here, it's more about intent based on outcome desirability. The key term here is the Knobe Effect or the side-effect effect. That's when people judge negative side effects as intentional more than positive ones. I should explain that.

  Then, considering motivational biases. People have a negativity bias, paying more attention to bad outcomes. Also, blame and credit aren't symmetric; we're quicker to blame than to praise. Motivated reasoning might play a role too. If students dislike the president or the policy, they're more likely to attribute negative intent.

  The user might be looking for validation of their observation and deeper understanding. They might feel frustrated by the inconsistency in how intent is judged. Underlying needs could include wanting to navigate social judgments more critically or seeking tools to evaluate situations fairly. They might also be interested in the implications beyond school, like in media or politics.

  I should address whether there's a coherent principle. The Knobe Effect shows it's a bias, not logical. But people might justify it with principles like "intent requires desire" for positive outcomes versus "awareness and indifference" for negatives. However, research shows asymmetry even with same awareness levels.

  Finally, the implications: this affects how we assess responsibility. The user should be skeptical of everyday intent attributions, especially negative ones. Encouraging them to look for evidence of intent beyond outcomes and consider alternative explanations.
answer: |-
  That's a deeply insightful observation about a genuinely fascinating psychological phenomenon. What you're noticing isn't just random inconsistency; it's a well-documented cognitive bias with roots in psychology, philosophy, and behavioral economics. Let's break down what's happening and why:

  ## The Core Phenomenon: The Knobe Effect (or the Side-Effect Effect)

  Your observation perfectly captures what's known as the **Knobe Effect**, named after philosopher Joshua Knobe, who conducted landmark experiments in the early 2000s. In these experiments, people were asked to judge whether an agent *intentionally* brought about a side effect. Crucially:

  1.  **Negative Side Effect Scenario:** A CEO implements a new program to increase profits. He's told it will *also* harm the environment. He says, "I don't care about harming the environment; I just want to make money." **Result:** Most people say he *intentionally* harmed the environment.
  2.  **Positive Side Effect Scenario:** A CEO implements a new program to increase profits. He's told it will *also* help the environment. He says, "I don't care about helping the environment; I just want to make money." **Result:** Most people say he did *not* intentionally help the environment.

  Your student council, teacher, and hallway rule examples are real-world mirrors of this experiment. The asymmetry in assigning intention based on the *moral valence* (good/bad) of the side effect is the hallmark of the Knobe Effect.

  ## Why Does This Happen? Key Explanations

  Several interconnected factors explain this asymmetry:

  1.  **Moral Judgment Shapes Perception of Intent:** This is the most powerful explanation. When a side effect is *bad*, we tend to judge the person more harshly. To justify that moral condemnation ("She harmed the arts program!"), we unconsciously *inflate* our perception of their intent. It feels psychologically consistent to blame someone more if we believe they *meant* to do the bad thing. Conversely, for a *good* side effect, we don't *need* to attribute intent to praise the person (the good outcome might be praise enough, or we can call it a "bonus"). Attributing intent for the good outcome might even feel like giving them *undeserved* credit ("She didn't care about the smoothie bar!").
  2.  **Negativity Bias:** Humans are wired to pay more attention to, weigh more heavily, and remember negative events more vividly than positive ones (a survival mechanism). A harmful side effect simply *stands out* more and feels more significant. This heightened salience makes us more likely to scrutinize the actor's motives and connect the outcome to their actions *as if* it were intended.
  3.  **The "Omission Bias" / "Do No Harm" Principle:** We unconsciously hold people more responsible for harms they *cause* (even indirectly) than for equivalent benefits they *fail* to cause. We expect people to actively avoid causing harm. If they proceed knowing harm is likely, even if they didn't *desire* it, we interpret their indifference or acceptance as a form of intentionality ("She *let* it happen"). Actively *intending* good, however, is seen as going above and beyond a basic obligation. Not pursuing a benefit isn't usually seen as blameworthy in the same way causing harm is.
  4.  **Motivated Reasoning & Blame/Praise Asymmetry:** Blaming someone requires justification. Attributing intent provides that justification ("She *knew* what would happen!"). Praising someone, especially for something they might not deserve credit for, requires less intense justification; calling it "unintended" or "lucky" is sufficient and feels more accurate if we don't believe they actively sought the good outcome. People are generally more motivated to assign blame than praise.
  5.  **Counterfactual Thinking:** When something bad happens, we readily imagine how the person *could have* avoided it ("If she truly cared about the arts, she would have negotiated with the company or found another sponsor before changing the machines"). This counterfactual ("They *should have* prevented the harm") feeds the perception that allowing the harm was intentional. For a good outcome, we're less likely to generate counterfactuals like "If she *really* intended to help the smoothie bar, she would have done X differently."

  ## Is There a Coherent "Principle" People Are Using?

  People *think* they're using a principle like:

  *   "If you knew a bad outcome was likely and you did it anyway, you intended it."
  *   "If you didn't specifically desire or aim for a good outcome, you didn't intend it, even if you knew it was likely."

  However, **this principle is applied asymmetrically due to the biases above.** The Knobe experiments show that people hold the *same level of knowledge and indifference* to be sufficient for intentionality in the harm case but insufficient in the benefit case. Logically, it's inconsistent. The driving force isn't pure logic; it's the *moral evaluation* of the outcome shaping the interpretation of the person's mental state.

  ## What This Means for Everyday Attributions of Intent

  1.  **Heightened Skepticism is Warranted:** Your instinct is correct. This pattern reveals a significant bias in how people (all of us!) judge others' intentions, particularly when negative outcomes are involved. We are quick to infer malicious or deliberate intent for harms, even when simple negligence, oversight, indifference, or unintended consequences are more plausible explanations.
  2.  **Outcome Drives Perception, Not Just Motive:** The *result* of an action heavily influences how people retrospectively judge the actor's *prior* intent. A bad outcome makes people reinterpret even ambiguous prior knowledge as proof of intent.
  3.  **Crucial in Conflict and Misunderstandings:** This bias is a major fuel for interpersonal conflict, organizational politics (like your student council), and public discourse. Accusations of malicious intent often arise from this automatic linking of bad outcomes to deliberate action.
  4.  **Beyond the Schoolyard:** This is absolutely pervasive in the wider world:
      *   **Politics:** Policies with negative side effects are frequently attacked as deliberate attacks on a group. Policies with positive side effects are rarely credited as intentional masterstrokes unless claimed.
      *   **Business:** Company decisions harming employees or communities are often seen as intentional greed; positive economic side effects are seen as market forces or luck.
      *   **Media & Public Discourse:** Scandals focus on "who intended the harm," often assuming intent based on outcome. Nuance about unintended consequences gets lost.
      *   **Law:** While legal definitions of intent (like *mens rea*) are more rigorous, juries are still susceptible to this bias when deciding if someone "knew" or "intended" a harmful outcome.
      *   **Personal Relationships:** "You *knew* that would hurt my feelings!" vs. "Oh, it was just lucky you cheered me up by canceling."

  ## How to Think More Clearly About Intent

  1.  **Separate Outcome from Intent:** Consciously ask: "What evidence do I have *independent* of the outcome that they *wanted* this specific result to happen?" Look for prior statements, planning, or effort directed *specifically* at causing that outcome.
  2.  **Consider "Foreseeability" vs. "Desire":** Distinguish between:
      *   **Intended:** Actively desired and aimed for.
      *   **Foreseen & Accepted:** Knew it was likely and proceeded anyway, indifferent to it.
      *   **Foreseen & Avoided:** Knew it was likely and took steps to prevent it.
      *   **Unforeseen:** Didn't anticipate it.
      Most "intentional harm" accusations in your examples likely fall into "Foreseen & Accepted" – which is still potentially blameworthy (negligence, indifference), but distinct from actively desiring the harm.
  3.  **Apply the Same Standard:** Force yourself to apply the *same* threshold for knowledge/indifference when judging both positive and negative side effects. If "knew and didn't care" equals intent for harm, it should logically equal intent for benefit. Recognizing this inconsistency helps counter the bias.
  4.  **Seek Alternative Explanations:** Before jumping to "they meant to do it," consider: Could this be incompetence? Lack of foresight? Poor planning? Unintended consequence? A trade-off they accepted reluctantly?

  **In conclusion:** You've astutely identified a fundamental quirk in human social cognition – the Knobe Effect. It's driven by the powerful, often unconscious, way our moral judgments about outcomes distort our perceptions of others' intentions. While people *feel* they are using a consistent principle, the asymmetry reveals a significant bias. Recognizing this is crucial for navigating school politics, understanding news and public debates, maintaining healthier personal relationships, and ultimately, making fairer judgments about the actions of others. It doesn't mean harmful side effects *aren't* blameworthy (negligence matters!), but it cautions us against too easily assuming malicious intent simply because the outcome was bad.
