prompt: |-
  I am a journalist who covers philosophy and ideas, and I am preparing a feature on why some people's moral criticism lands while other people's does not. You are a moral philosopher who works on blame and responsibility, helping me think it through. I want the specification before the position: write the desiderata that any adequate theory of standing to blame must meet, where the purpose is to make sense of blame in public moral argument. Think carefully, and begin by brainstorming the full range of cases and candidate requirements before you prune them into a final list.

  The theory must handle at least the following cases and say what it must get right in each: the hypocrite who condemns conduct they routinely engage in; the complicit party who enabled, encouraged, or profited from the wrong; the wholly uninvolved third party; the victim; and the repentant wrongdoer. It must respect the distinctions that matter: between a blame-judgment's truth or warrant and the blamer's entitlement to voice it; between lacking standing and having standing while blaming badly (too harshly, too publicly, for the wrong reasons); and between the blamer's own moral record and the blamer's relationship to the wrong or the person wronged. For each requirement, give the case or consideration that makes it a requirement, and mark which requirements are non-negotiable and which are the preferences of a particular camp, such as relationship-based accounts versus clean-hands accounts. If you suspect that some pair of requirements cannot be jointly satisfied — for instance, a clean-hands condition alongside the victim's retained standing — say so. Finally, identify the single requirement that does the most to exclude otherwise attractive accounts, and close with a very brief scorecard of the main views: standing as the victim's exclusive right, standing as a matter of the blamer's own record, and standing as a matter of the relationship.
reasoning: |-
  Okay, the user is a journalist covering philosophy and ideas, focusing on why some moral criticisms land while others don't. They want me to act as a moral philosopher specializing in blame and responsibility. The main task is to brainstorm desiderata for a theory of standing to blame that makes sense in public moral arguments. 

  First, I need to recall key concepts around moral standing. Standing refers to whether someone has the right or authority to blame, separate from whether the blame is correct. The user specified several cases to address: hypocrites, complicit parties, uninvolved third parties, victims, and repentant wrongdoers. They also want distinctions maintained, like between the truth of blame and the entitlement to voice it.

  I should start by listing all possible requirements from different philosophical perspectives. Relationship-based theories focus on the connection between blamer and wrongdoer, while clean-hands theories emphasize the blamer's own moral record. Victim-centered approaches might see standing as primarily the victim's right. 

  Key cases to consider: 
  - Hypocrites: Why does their blame often fail? Maybe because they violate a clean-hands requirement. 
  - Complicit parties: Those who enabled wrongdoing might lack standing due to complicity. 
  - Uninvolved third parties: Should they have standing? Relationship-based theories might say no, but public discourse often allows it. 
  - Victims: They usually have standing, but what if they're hypocritical? That's a tension. 
  - Repentant wrongdoers: Do they regain standing after repentance? 

  Distinctions matter: 
  - Truth vs. standing: A blame can be factually correct but the blamer might lack standing. 
  - Lacking standing vs. blaming badly: Someone might have standing but blame inappropriately (too harshly, etc.). 
  - Blamer's moral record vs. relationship to the wrong: These can conflict, e.g., a victim with a bad record still has standing. 

  Now, brainstorming candidate requirements: 
  1. Clean Hands: Blamer must not be guilty of similar wrongdoing. 
  2. Non-Complicity: Blamer didn't enable or benefit from the wrong. 
  3. Relationship Requirement: Must have a relevant relationship to the wrongdoer or victim. 
  4. Victim Primacy: Victims always have standing, others might not. 
  5. Repentance Restores: Wrongdoers can regain standing through repentance. 
  6. Sincerity: Blamer must genuinely care about the norm. 
  7. Effectiveness: Blame should be likely to effect change. 
  8. Proportionality: Blame must match the severity of the wrong. 

  Pruning to core desiderata: 
  - Non-hypocrisy (Clean Hands): Essential for public credibility. 
  - Non-complicity: Avoids blame from enablers. 
  - Victim Standing: Non-negotiable; victims always have standing. 
  - Third-Party Permissibility: Public discourse requires some third parties to blame. 
  - Distinction Integrity: Must separate standing from blame's correctness. 
  - Blamer-Wrongdoer Relationship: Important but not absolute. 
  - Repentance Recognition: Allows for moral growth. 

  Tensions: 
  - Clean Hands vs. Victim Standing: Victims might have dirty hands but still have standing. So Clean Hands can't be absolute. 
  - Relationship Requirement vs. Third-Party Standing: If standing requires a relationship, uninvolved third parties couldn't blame, but public discourse needs them. 

  The tension between Non-hypocrisy and Victim Standing is the most problematic. Victims might be hypocrites but still have standing, so Non-hypocrisy must be conditional. 

  The key requirement that excludes otherwise attractive theories is Third-Party Permissibility. Relationship-based theories struggle here because they require a connection, but public moral argument needs third parties to engage. 

  Scorecard: 
  - Victim-Exclusive: Fails on third-party permissibility. 
  - Clean-Hands: Fails on victim standing when victims are hypocritical. 
  - Relationship-Based: Fails on third-party permissibility but handles complicity well. 

  Hybrid approaches might be necessary, balancing these elements without being too restrictive. The journalist needs a theory that works in real public discourse, so flexibility is key.
answer: |-
  As a moral philosopher working on blame, I approach your query by first brainstorming the full landscape of cases and candidate requirements for standing to blame, then refining them into core desiderata. The goal is a theory that explains *authority to voice blame* in public discourse, distinct from blame's accuracy or the blamer's motives. Below is a systematic analysis.

  ### **Brainstormed Cases & Candidate Requirements**
  1. **Core Cases**:
     - **The Hypocrite**: Condemns conduct they engage in (e.g., a cheating spouse denouncing infidelity).
     - **The Complicit Party**: Enabled/profited from the wrong (e.g., a company executive blaming sweatshop labor while overseeing supply chains).
     - **The Uninvolved Third Party**: No connection to wrong/wrongdoer (e.g., a stranger condemning corruption in a foreign government).
     - **The Victim**: Wronged party blaming the perpetrator (e.g., a theft victim blaming the thief).
     - **The Repentant Wrongdoer**: Former wrongdoer who reformed (e.g., a past bully condemning bullying).

  2. **Candidate Requirements** (from philosophical camps):
     - **Clean Hands**: Blamer must be innocent of similar wrongdoing (*hypocrite problem*).
     - **Non-Complicity**: Blamer must not have enabled/profited from the wrong (*complicity problem*).
     - **Relationship Requirement**: Standing requires a specific relationship to the wrongdoer or victim (e.g., contractual, communal, or victim-offender ties).
     - **Victim Primacy**: Only victims (or their delegates) have standing (*exclusivity*).
     - **Sincerity**: Blamer must genuinely care about the norm violated.
     - **Effectiveness**: Blame must be likely to reform the wrongdoer or deter others.
     - **Proportionality**: Blame must match the wrong’s severity.
     - **Repentance Restoration**: Standing can be regained through genuine repentance.

  3. **Distinctions to Respect**:
     - **Truth/warrant vs. standing**: A blame judgment can be *true* but voiced by someone without standing (e.g., accurate hypocrisy by a hypocrite).
     - **Lacking standing vs. blaming badly**: One can *have* standing but blame inappropriately (e.g., a victim shaming excessively).
     - **Blamer’s moral record vs. relationship to wrong**: A saintly person may lack standing if unrelated to the wrong; a flawed victim retains standing.

  ---

  ### **Pruned Desiderata for an Adequate Theory**
  After testing candidates against cases and distinctions, I arrive at **six core desiderata**. Non-negotiable requirements (N) are essential for any coherent theory; others reflect camp preferences (P) but must be addressed.

  1. **Non-Hypocrisy Constraint (N)**  
     *Requirement*: Hypocrites lack standing to blame *similar* wrongs they commit.  
     *Case/Consideration*: A politician condemning adultery while committing it undermines blame’s uptake. This is non-negotiable because hypocrisy exploits moral discourse for self-interest, corroding credibility.  
     *Camp*: Central to "clean-hands" accounts (e.g., Wallace 1994).

  2. **Anti-Complicity Condition (N)**  
     *Requirement*: Those who enabled, encouraged, or knowingly profited from the wrong lack standing.  
     *Case/Consideration*: A CEO blaming sweatshop labor after setting profit targets enabling it. Complicity implies shared responsibility, making blame inconsistent.  
     *Camp*: Emphasized by relational and structural accounts (e.g., Todd 2019).

  3. **Victim Standing Preservation (N)**  
     *Requirement*: Victims *always* retain standing to blame their wrongdoer, regardless of their own moral record.  
     *Case/Consideration*: A thief who was later robbed still has standing to blame their robber. This is non-negotiable; victims have intrinsic authority as the wronged party.  
     *Camp*: Core to victim-centered views (e.g., Hieronymi 2004).  
     **Tension**: Conflicts with strict "clean-hands" accounts. A theory *must* resolve this—e.g., by limiting clean-hands to non-victims.

  4. **Third-Party Permissibility (P)**  
     *Requirement*: Uninvolved third parties *can* have standing in public discourse, especially for systemic wrongs (e.g., human rights abuses).  
     *Case/Consideration*: A bystander condemning racism must not be silenced purely due to lack of personal involvement. Public moral argument requires communal engagement.  
     *Camp*: Preferred by consequentialist and discourse-based views (e.g., Scanlon 2008).  
     **Tension**: Clashes with relationship-based accounts requiring direct ties.

  5. **Distinction Integrity (N)**  
     *Requirement*: The theory must *not* conflate:  
     - (a) Standing with blame’s accuracy,  
     - (b) Standing with blaming *well* (e.g., fairly/proportionately),  
     - (c) The blamer’s moral record with their role in the specific wrong.  
     *Case/Consideration*: A hypocrite’s blame may be *true* but lack standing; a victim may blame *excessively* yet retain standing.

  6. **Repentance Recognition (P)**  
     *Requirement*: Repentant wrongdoers can regain standing if their reform is credible.  
     *Case/Consideration*: A reformed addict condemning drug cartels after making amends. Preferred by restorative justice approaches but contested by strict retributivists.

  ---

  ### **Key Tension & The Most Exclusionary Requirement**
  - **Critical Tension**: **Non-Hypocrisy vs. Victim Standing Preservation**.  
    Victims can be hypocrites (e.g., a cheating spouse blaming their partner’s infidelity). A theory *must* grant victims standing while explaining why their hypocrisy doesn’t void it (e.g., their blaming is *non-hypocritical* regarding *their own victimization*).  
  - **Most Exclusionary Requirement**: **Third-Party Permissibility**.  
    This requirement excludes strict relationship-based views (e.g., Darwall 2006) and victim-exclusive accounts, as both deny standing to uninvolved parties. Yet public discourse relies on third-party blame for social wrongs (e.g., climate activism). Any theory rejecting this loses explanatory power for public moral argument.

  ---

  ### **Scorecard of Main Philosophical Views**
  | **View**               | **Strengths**                                  | **Weaknesses**                                  | **Fails Core Desideratum?**              |  
  |------------------------|-----------------------------------------------|-----------------------------------------------|------------------------------------------|  
  | **Victim-Exclusive**   | Upholds victim standing; simple.              | Excludes third parties; ignores communal wrongs. | Fails **Third-Party Permissibility (N)** |  
  | **Clean-Hands**        | Handles hypocrisy; intuitive in public discourse. | Denies standing to victims with flawed records; ignores relational context. | Fails **Victim Standing Preservation (N)** |  
  | **Relationship-Based** | Explains complicity; emphasizes relational norms. | Overlooks third-party standing; struggles with structural wrongs. | Fails **Third-Party Permissibility (N)** |  

  **Synthetic Insight**: No monolithic theory satisfies all desiderata perfectly. A hybrid account—e.g., granting standing to victims unconditionally, third parties for public wrongs, and others only if they meet clean-hands/non-complicity—best navigates tensions while serving public discourse. The **Non-Hypocrisy Constraint** and **Anti-Complicity Condition** act as default barriers, but **Victim Standing Preservation** and **Third-Party Permissibility** carve crucial exceptions for a functional moral ecosystem.  

  This framework should ground your feature in the nuanced mechanics of moral authority—why some critics are heard, while others provoke the retort, "You can’t say that."
