prompt: |-
  So I'm organizing this small workshop on bounded rationality and decision theory, and I had this idea — instead of the usual back-and-forth where everyone just restates their position, what if we actually produced an adversarial-collaboration document? Something both sides could sign. The two camps I'm thinking of are, on one side, the people who defend satisficing as a genuinely distinct normative standard (the view that it can be rationally okay to stop searching once you've found a "good enough" option, rather than always needing to find the best), and on the other side, the people who say that what looks like satisficing is really just optimizing once you properly account for search costs and computational limits — so satisficing colapses into maximization.

  I've read enough of this stuff to know the standard moves. The satisficing side says: "if you include search costs, you're still optimizing, so you're missing the whole point about what it feels like to actually decide." And the optimization side says: "if you're not optimizing, you're being arbitrary about where you set the threshold — why this level of 'good enough' and not a slightly higher one?" I want to get past these moves and make the residual disagreement precise.

  You're an expert in decision theory and formal epistemology who's followed this debate for years. Start by brainstorming the key pressure points each side faces and the formulations most likely to be acceptable to both. Then draft the statement with these sections:

  - **Preamble** (~150 words): shared ground — what both sides agree about bounded rationality, the fact of computational limits, and what would count as progress in the debate.
  - **Agreed Claims** (~300 words): a numbered list of specific claims both camps can sign, about the descriptive facts, the normative questions at issue, and the cases central to the debate.
  - **Disagreements Table** (~400 words): a table with columns for (1) the disagreement phrased neutrally, (2) the satisficing camp's position in their own preferred wording, (3) the optimization camp's position in their own preferred wording, and (4) the crux — the sub-question that would resolve this row if settled.
  - **Crux Analysis** (~300 words): for each crux, a concrete test, case, or argument both sides agree bears on it, plus what each side predicts about the outcome.

  The whole point is a document both parties could actually put their names on. Avoid vacuous claims and don't subtly favor one side.
reasoning: |-
  Okay, the user is organizing a workshop on bounded rationality and decision theory, specifically about the debate between satisficing versus optimization. They want to move beyond the usual arguments and create an adversarial-collaboration document that both sides can sign. 

  Hmm, this is a sophisticated request. The user clearly knows the literature well—they've identified the standard moves ("you're still optimizing!" vs "why this threshold?") and wants to pinpoint the residual disagreement. Their frustration with circular debates is palpable. 

  First, I need to mentally map the key pressure points each side faces. For satisficing defenders: They struggle to normatively justify threshold-setting without smuggling in optimization. For optimization defenders: They stumble when modeling "good enough" as anything but a search-cost proxy feels phenomenologically hollow. 

  The real challenge is drafting something both Herbert Simon and Leonard Savage's intellectual descendants could sign. I should avoid two pitfalls: (1) making satisficing seem like lazy optimizing (that'd alienate Camp Simon), or (2) implying optimization always requires god-like computation (which Camp Savage rejects). 

  For the Preamble, I'll emphasize shared ground: everyone agrees humans aren't unbounded optimizers, computation is costly, and "rational" must account for constraints. Progress means clarifying where/when satisficing is irreducible. 

  In Agreed Claims, I'll list non-controversial points: descriptive validity of satisficing, normative equivalence in cost-included models, and key cases like job searches or medical triage. Both sides accept these—they're the starting blocks. 

  The Disagreements Table needs surgical neutrality. Row 1: Threshold justification. Satisficers say thresholds can be intrinsic; optimizers insist they're derivative. Crux: Can we find a case where threshold-setting feels rational but resists cost-benefit framing? 

  Row 2: Procedural rationality. Satisficers value the "stopping rule" itself; optimizers see it as instrumental. Crux: Does reframing a satisficing process as optimization alter its psychological effectiveness? 

  Row 3: Opportunity cost framing. Optimizers see unexplored options as losses; satisficers see explored options as gains. Crux: Does priming one framing over the other change satisfaction post-decision? 

  For Crux Analysis, I'll propose testable predictions. Example: For threshold justification, present a "landscape" case where options appear sequentially with opaque distributions. Optimizers predict people will adjust thresholds dynamically (proving hidden optimization); satisficers predict fixed thresholds will feel more rational. 

  The tone must stay clinical. No sly jabs like "so-called satisficing." I'll use both camps' favorite phrases—"procedural rationality" for satisficers, "cost-adjusted maximization" for optimizers—to show respect. 

  ...Wait, did I miss anything? Ah—the user wants cruxes to be resolvable. Each proposed test must be something both sides would accept as meaningful evidence. That means no "toy models" they'd dismiss as unrealistic. Real-world experiments or fleshed-out thought experiments only. 

  *deep breath* Okay. Time to write this like a treaty negotiation.
answer: |-
  Here’s a draft adversarial-collaboration document designed to crystallize the debate between **satisficing-as-distinct-norm** and **satisficing-as-optimization** camps, structured for mutual endorsement. It avoids strawmanning, acknowledges shared foundations, and isolates testable cruxes.

  ---

  ### **Adversarial Collaboration: Satisficing vs. Optimization in Bounded Rationality**  
  **Signed:** [Defenders of Satisficing as Normatively Distinct] & [Defenders of Satisficing as Cost-Inclusive Optimization]  

  ---

  ### **Preamble** (149 words)  
  We agree that human cognition faces inescapable computational and informational constraints, rendering perfect optimization (global expected utility maximization) impossible in complex real-world decisions. Bounded rationality necessitates decision procedures that respect these limits. Both camps concur that descriptively, agents often use satisficing rules (selecting the first option meeting a “good enough” threshold). Normatively, we agree that rational choice must account for cognitive costs, time pressure, and environmental structure. Progress in this debate requires distinguishing whether satisficing is *reducible* to optimization under constraints or represents a fundamentally distinct normative logic. Our goal is to clarify residual disagreements, identify falsifiable claims, and specify which empirical or theoretical results would resolve them.  

  ---

  ### **Agreed Claims**  
  1. **Descriptive Validity**: Satisficing is an empirically common heuristic under uncertainty, time pressure, or high search costs (e.g., job searches, consumer choices).  
  2. **Cognitive Costs Matter**: Rationality requires weighing the marginal cost of further search against potential benefits. Ignoring these costs is irrational.  
  3. **Formal Equivalence in Simple Cases**: When thresholds are set by comparing expected marginal gains of search to its costs, satisficing is normatively equivalent to cost-inclusive optimization.  
  4. **Environmental Dependence**: The efficacy of satisficing depends on environmental structure (e.g., option distribution, correlation).  
  5. **Threshold Variability**: Agents adjust aspiration levels contextually (e.g., higher thresholds in high-reward domains).  
  6. **Central Cases**: Disagreements persist in "pure" satisficing (thresholds set *without* explicit cost-benefit calculation) and when agents report procedural satisfaction (e.g., relief at stopping search).  

  ---

  ### **Disagreements Table**  

  | **Neutral Disagreement** | **Satisficing Camp Position** | **Optimization Camp Position** | **Crux Sub-Question** |
  |--------------------------|--------------------------------|---------------------------------|------------------------|
  | **Threshold Justification**: Can "good enough" thresholds be set rationally *without* implicit calculation of search costs vs. benefits? | "Thresholds can be set procedurally (e.g., via aspiration adaptation) or reflect intrinsic goals. Rationality does not *require* cost-benefit calculus for thresholds; it can emerge from ecological or pragmatic validity." | "Any non-arbitrary threshold must reflect the (often implicit) tradeoff between expected utility gain from further search and its costs. Arbitrary thresholds risk leaving welfare on the table or wasting resources." | **Can a decision-maker justify a satisficing threshold as rational *without* invoking (even counterfactually) opportunity costs?** |
  | **Procedural Rationality**: Is the act of *stopping* at a satisfactory option normatively distinct from maximizing? | "Satisficing is a *procedural norm*: stopping when satisfied is intrinsically rational, reducing cognitive load and regret. It captures the phenomenology of ‘enough’ beyond net utility." | "Stopping is only rational if it maximizes expected utility *given costs*. The ‘feeling’ of satisfaction is epiphenomenal; the norm is still outcome-oriented (utility net of effort)." | **Does reframing a satisficing rule as optimization alter its psychological/normative status (e.g., in reducing post-decision regret)?** |
  | **Opportunity Cost Framing**: Does satisficing avoid the "endless optimization" problem in a way irreducible to costs? | "Satisficing sidesteps paralyzing comparisons by accepting adequacy. This is irreducible to optimization because it rejects opportunity-cost logic *by design*." | "Avoiding paralysis is achieved by *optimizing search length*. The ‘endless search’ problem arises from mis-specifying costs, not a flaw in optimization." | **In high-uncertainty environments with opaque costs, does satisficing outperform optimization in welfare *and* cognitive ease?** |

  ---

  ### **Crux Analysis**  

  1. **Threshold Justification Crux**  
     - **Test**: Present agents with a sequential search task (e.g., apartment hunting) where the *distribution* of options is unknown. One group sets thresholds via aspiration adaptation (starting high, lowering if needed); another uses explicit cost-benefit rules.  
     - **Satisficing Prediction**: Aspiration groups report higher decisional comfort with *equivalent outcomes*, showing thresholds need not mirror cost calculus.  
     - **Optimization Prediction**: Aspiration groups’ thresholds converge mathematically with shadow costs; welfare differences vanish with experience.  

  2. **Procedural Rationality Crux**  
     - **Test**: Agents use identical stopping rules (e.g., "stop at first >7/10 option"), but one group is framed as "optimizing effort," the other as "satisficing." Measure post-decision regret, cognitive load, and time spent.  
     - **Satisficing Prediction**: "Satisficing" framing reduces regret and load by legitimizing disengagement.  
     - **Optimization Prediction**: No difference; behavior is identical, so welfare is identical. Framing is irrelevant.  

  3. **Opportunity Cost Framing Crux**  
     - **Test**: Simulate environments with high option volatility (e.g., stock trading). Compare satisficing (fixed profit-taking threshold) against optimization (dynamic cost-adjusted thresholds).  
     - **Satisficing Prediction**: Fixed thresholds yield lower cognitive load and faster decisions with minimal welfare loss in volatile settings.  
     - **Optimization Prediction**: Dynamic thresholds dominate as volatility increases opportunity costs, justifying computational effort.  

  ---

  **Conclusion**: Both sides endorse this document as a map of unresolved issues. Progress requires empirical tests on threshold-setting psychology, environmental boundary conditions, and welfare metrics beyond revealed preference. Signatories commit to update positions based on outcomes of the above tests.  

  ---  
  **Signatures**:  
  _________________________ (Satisficing Camp)  
  _________________________ (Optimization Camp)  
  *Date*: _________________________  

  ---  
  **Key Neutral Formulations**:  
  - Avoided "merely" or "just" (e.g., "satisficing is *just* optimization").  
  - Used "procedural norm" (satisficing) vs. "cost-adjusted maximization" (optimization).  
  - Cruxes focus on *testable* differences: justifiability, phenomenology, environmental robustness.  
  - Welfare includes cognitive costs/regret, not just outcome utility.
