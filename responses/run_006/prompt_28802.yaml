prompt: |-
  I'm a clinical ethics consultant at a large teaching hospital. My team gets called to evaluate whether a patient's consent to a procedure is valid maybe three or four times a week — often cases where the patient has mild cognitive impairment, or the family is applying heavy pressure, or the attending physician hasn't been fully forthcoming about risks and alternatives. We have no standardized framework; each consultant runs their own mental checklist, and the variation is starting to cause problems in both directions — we've had consents waved through that probably shouldn't have been, and consents blocked that a more careful analysis would have upheld. I want a decision procedure grounded in the philosophical literature on what makes consent valid — the work on deception, coercion, and competence — but translated into something a clinician can actually use at the bedside in under thirty minutes without a philosophy background. The procedure should be a sequence of questions to ask in order, with clear stopping rules: at what point do you conclude consent is invalid and stop, at what point do you conclude it's valid and sign off, and at what point do you hand the case to someone else (a judge, a guardianship hearing, the full ethics committee) because the procedure cannot settle it. Be honest about which steps are judgment calls dressed up as mechanical tests. Then run the procedure on three cases to show how it works: (1) a seventy-year-old patient with early-stage Alzheimer's who says she wants a risky elective surgery her adult children oppose; (2) a thirty-year-old patient in severe pain who agrees to an amputation after the surgeon says "this is really your only option" when in fact a limb-salvage procedure exists but the surgeon doesn't perform it; and (3) a twenty-year-old who consents to a lumbar puncture for a research study after the study coordinator, who is also her cousin, recruited her at a family gathering.

  Please give me exactly five steps, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a clinical ethics consultant dealing with consent evaluations. They need a standardized framework because their current approach is inconsistent, leading to problems like invalid consents being approved or valid ones blocked. They want something grounded in philosophy but practical for bedside use under 30 minutes without requiring philosophy expertise.

  The core requirements are: a five-step sequential procedure with clear stopping rules, honesty about judgment calls, and demonstration on three cases. The philosophical anchors should cover deception, coercion, and competence, which are key to valid consent.

  I recall that valid consent hinges on four pillars: competence, voluntariness, disclosure, and understanding. I'll build the steps around these, mirroring the user's focus on deception (disclosure issues), coercion (voluntariness), and competence. The steps must be actionable and flow logically.

  I'll structure the five steps: Start with competence as it's foundational—if the patient can't decide, the rest doesn't matter. Then move to voluntariness to check for coercion or pressure. Next, assess disclosure completeness, focusing on whether key information was omitted. After that, evaluate understanding to ensure the patient grasps the decision. Finally, end with a recommendation step that includes stopping rules for validity, invalidity, or referral.

  For each step, I'll be honest about judgment calls. For example, competence assessment isn't purely mechanical; it involves clinical judgment. I'll specify clear stopping points: stop if competence is absent (step 1), stop if coercion is found (step 2), and so on. Referral cases should go to judges, guardianship hearings, or ethics committees when things are ambiguous.

  Now, for the case applications: Case 1 (Alzheimer's patient wanting elective surgery with family opposition) will test competence and voluntariness. I'll show how the procedure flags competence as uncertain, leading to referral. Case 2 (pain patient misled about amputation being the only option) highlights disclosure failures, making consent invalid at step 3. Case 3 (young adult recruited by cousin for research) involves voluntariness concerns due to familial pressure, requiring careful evaluation.

  I need to ensure the steps are concise—one or two sentences each—with no intros or conclusions. The language must be clinician-friendly, avoiding jargon. By demonstrating on cases, I'll prove the procedure's utility and address the user's pain points around variability and errors.
answer: |-
  **Step 1: Assess Decision-Making Capacity:** Can the patient demonstrate understanding of the relevant medical facts (diagnosis, proposed procedure), appreciation of the situation's significance and consequences for them, reasoning about options in relation to their values, and communication of a choice? *(Stopping Rule: If clearly absent, consent is invalid - stop. If clearly present, proceed. Significant uncertainty requires referral to specialists/guardianship process.)*

  **Step 2: Evaluate Voluntariness:** Is the patient's decision free from controlling influences like coercion (threats of harm), manipulation (distorting information), or significant undue pressure (intense persuasion exploiting vulnerability) from family, clinicians, or others? *(Stopping Rule: If clear, significant coercion/manipulation exists, consent is invalid - stop. If mild pressure or no concerns, proceed. Ambiguous high-pressure situations may require committee/judge referral.)*

  **Step 3: Verify Adequate Disclosure:** Did the clinician disclose material information a reasonable person would need (nature/purpose of procedure, reasonably foreseeable risks/benefits, alternatives including no treatment, prognosis without treatment) without materially deceptive statements or significant omissions? *(Stopping Rule: If material deception or omission is confirmed, consent is invalid - stop. If disclosure seems adequate, proceed. Debates over materiality or adequacy often need committee input.)*

  **Step 4: Assess Understanding:** Does the patient's articulation of the decision reflect comprehension of the key information disclosed in Step 3, specifically regarding risks, benefits, and alternatives? *(Stopping Rule: If the patient demonstrably misunderstands core risks/benefits/alternatives despite disclosure, and this isn't due to correctable impairment, consent may be invalid - consider stopping or referral. If understanding aligns with disclosure, proceed to Step 5.)*

  **Step 5: Make Recommendation & Document:** Based on Steps 1-4, conclude if consent is valid (proceed), invalid (halt procedure), or requires external resolution (refer to committee, legal). Document the specific basis for the conclusion (e.g., "Competence confirmed via understanding X, Y; no undue pressure identified; disclosure included A, B, C; patient articulated understanding of key risk Z"). *(Stopping Rule: Final step - make the call based on assessment.)*

  **Case Applications:**

  1.  **70yo w/ Alzheimer's, elective surgery (family opposes):** Step 1: Capacity assessment is crucial & complex; likely significant uncertainty due to Alzheimer's. *Stopping Rule: Refer to neuropsych testing/guardianship process.* (Steps 2-4 paused pending capacity resolution).
  2.  **30yo in pain, "only option" amputation (salvage exists):** Step 1: Capacity likely intact. Step 2: Voluntariness initially unclear. Step 3: **Invalid Consent** - Material omission/deception confirmed (alternative limb-salvage not disclosed, misrepresented as only option). *Stopping Rule: Stop at Step 3 - Consent invalid.*
  3.  **20yo LP for research, recruited by cousin/coordinator:** Step 1: Capacity likely intact. Step 2: **Focus on Voluntariness** - Potential undue pressure/manipulation due to familial relationship & recruitment setting. Requires probing if "no" feels possible without relational fallout. *(Judgment Call)*. Step 3: Disclosure adequacy needs verification. If Step 2 reveals significant pressure undermining free choice, consent is invalid. If pressure is minimal/navigable and disclosure/understanding (Steps 3 & 4) are adequate, consent may be valid. Ambiguity might require committee review.
