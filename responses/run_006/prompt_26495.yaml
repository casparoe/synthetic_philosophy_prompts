  - Quantifier domain restriction (limiting "no one" to actual rather than possible knowers)
  - Modal collapse approaches (denying that unknown truths exist in all possible worlds)

  Each solution has costs. Denying the knowability principle entirely is the most straightforward but abandons the roommate's core thesis. Other approaches might preserve knowability but require modifying logic or semantics in ways that feel ad hoc.

