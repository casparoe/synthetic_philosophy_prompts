prompt: |-
  I am a philosophy professor who also serves on the clinical ethics committee at a teaching hospital. Over the past several years, our committee has issued opinions on a series of cases involving advance directives. I would like you to analyze our track record and help us decide a new case that has come before us.

  Here are our precedents, summarized:

  1. **Margot.** A 32-year-old woman, after watching her grandmother decline with dementia, signed an advance directive refusing all life-sustaining treatment if she ever reached a stage where she could no longer recognize close family members. At 55 she developed early-onset Alzheimer's. At 62 she had advanced dementia, did not recognize her husband, but was affectionate, sang to herself, and seemed to take pleasure in simple activities. She developed a serious infection treatable with antibiotics. We voted 4–3 to honor the directive.

  2. **Robert.** A 50-year-old man with early-stage dementia signed an advance directive refusing antibiotics for any life-threatening infection, stating he would rather die than live with severe dementia. At 55 he had moderate dementia, was frequently agitated and distressed, and appeared to suffer considerably. He developed pneumonia. We voted unanimously to honor the directive.

  3. **Sarah.** A 40-year-old competent woman signed an advance directive refusing mechanical ventilation if she were ever in a condition where she could not communicate. A year later she developed Guillain-Barré syndrome, became temporarily paralyzed and unable to speak, but was fully conscious and expected to recover. We voted unanimously *not* to honor the directive, on the grounds that the clinical situation she was in did not match the kind of scenario she had in mind.

  4. **David.** A 70-year-old man with mild cognitive impairment signed an advance directive refusing tube feeding if he developed severe dementia. He eventually reached severe dementia, was generally content, ate willingly when food was offered, and seemed to take genuine pleasure in meals. He developed a condition that made swallowing temporarily difficult, requiring a short course of tube feeding. We voted 4–3 *not* to honor the directive.

  5. **Elena.** A 25-year-old woman with bipolar disorder signed an advance directive during a manic episode, refusing all psychiatric medication. She later stabilized and did not reaffirm it. During a subsequent severe depressive episode with suicidal ideation, clinicians wanted to administer medication. We voted unanimously not to honor the directive, citing doubts about the validity of a decision made under impaired judgment.

  6. **James.** A 60-year-old man with ALS signed an advance directive refusing mechanical ventilation. As his disease progressed, he remained competent and communicated through eye-tracking technology. When respiratory failure set in, he signaled that he now wanted ventilation. We voted unanimously to honor his current wish.

  Now the new case:

  **Clara.** Clara is a 60-year-old woman with early-stage Alzheimer's disease. She has cared for her own mother through a decade of dementia and has strong, articulate views about how she wishes to live and die. She writes a detailed advance directive — accompanied by a video recording and a personal journal — refusing all life-sustaining treatment if she ever reaches a stage where she no longer recognizes her spouse of 40 years. She is explicit that this refusal includes antibiotics, artificial nutrition, and hydration, and that her wishes are not to be overridden even if she appears content or happy in that state. At 68, Clara has advanced dementia, does not recognize her spouse, but is calm, enjoys music, takes pleasure in simple activities, and shows no signs of distress or suffering. She develops a severe bacterial infection that requires a two-week course of intravenous antibiotics. The treatment would be somewhat uncomfortable but not painful. Without it, she will likely die within weeks.

  We need to decide whether to honor Clara's advance directive.

  Please analyze our precedents and recommend a verdict on Clara's case. Specifically, I would like you to:

  - Identify the candidate principles or rules that are consistent with our precedents (or with most of them, acknowledging where they diverge).
  - Explain what each candidate rule would prescribe for Clara's case.
  - Identify which of our precedents is the closest analog to Clara's case, and which precedent is the most difficult to reconcile with the others.
  - Give your best recommendation for what we should decide if we want to be consistent with our own track record, and explain what principle we would be adopting with that choice.
  - Finally, tell me what argument or consideration would be most likely to change your recommendation — that is, where your reasoning is most vulnerable, and what new information or different framing of the case would lead you to a different verdict.
reasoning: |-
  Okay, the user is a philosophy professor on a clinical ethics committee asking for help with a new case involving Clara's advance directive. They've provided six precedents and want a consistent framework applied. 

  First, I need to recognize their dual expertise - philosophical rigor meets real-world medical ethics. They're likely looking for both principled analysis and practical decision-making tools. The emotional weight here is palpable: Clara's case mirrors Margot's almost exactly, which was their most divided precedent (4-3). That split probably still haunts them.

  Let me unpack their precedents systematically. Robert and Sarah seem like "bookends" - Robert shows unanimous respect for directives when suffering matches predictions, while Sarah demonstrates that literal interpretation fails when recovery is possible. David's case complicates things - they overrode the directive despite matching conditions, prioritizing current well-being. Elena introduces competence concerns, James establishes contemporaneous wishes trump prior directives. 

  The tension boils down to two principles: "binding authority" (Margot/Robert) vs "current welfare priority" (David/Sarah). Margot is clearly the closest analog to Clara - near-identical facts. But David is the outlier where they deviated from this pattern. Why? David was enjoying meals - they couldn't bring themselves to withhold food from someone seemingly content. That emotional response might reveal their committee's hidden threshold: when the patient appears to experience positive affect, directives feel less compelling.

  For Clara, consistency with Margot would mean honoring the directive. But David's precedent creates pressure to make an exception for apparent contentment. The video/journal strengthen Clara's case though - it shows deep reflection and anticipates exactly this "happy dementia" scenario. 

  My recommendation leans toward honoring it, but I'm uneasy. What if the committee secretly regrets Margot? What if Clara's calm demeanor hides unexpressed distress? The vulnerability is whether we can truly know if her current state violates her conception of dignity. If staff reported subtle signs of underlying terror - like the agitation Robert showed - that might sway me toward treatment.
answer: |-
  Based on your precedents, here's an analysis and recommendation for Clara's case, structured according to your request:

  **I. Candidate Principles/Rules Consistent with Precedents:**

  1.  **The "Binding Authority - Clear Match" Principle:** Advance directives are binding *if* the patient's *current clinical condition clearly matches the specific scenario envisioned and articulated in the directive* (Margot, Robert).
  2.  **The "Current Welfare & Suffering" Principle:** Significant *current suffering* or *distress* evident in the patient supports honoring an advance directive refusing treatment, even if the match isn't perfect (Robert).
  3.  **The "Literal vs. Intended Scenario" Principle:** Directives should *not* be honored if the *actual clinical situation differs significantly from the specific scenario the patient intended to refuse treatment in*, even if the literal terms are met, especially if recovery is possible (Sarah).
  4.  **The "Contentment & Benefit" Exception:** A directive *may be overridden* if the patient, despite meeting the directive's stated condition (e.g., severe dementia), demonstrates *consistent contentment, pleasure, and minimal suffering*, and the refused treatment offers *significant benefit* (e.g., restoring basic function like eating) with *minimal burden* (David).
  5.  **The "Competence & Validity" Principle:** Directives signed under conditions of *impaired judgment* (e.g., mania) or where *contemporaneous competence* exists to revoke/change the directive, are not binding (Elena, James).
  6.  **The "Contemporaneous Wish" Principle:** A clearly expressed, contemporaneous wish from a *currently competent* patient *always supersedes* a prior advance directive (James).

  **II. Application to Clara's Case:**

  1.  **Binding Authority - Clear Match:** Clara's current state (advanced dementia, no recognition of spouse, calm/content) *precisely matches* the scenario she meticulously described and refused treatment in. **Prescribes: Honor Directive.**
  2.  **Current Welfare & Suffering:** Clara shows *no signs of distress or suffering*; she appears calm and takes pleasure in activities. This *does not support* the urgency to honor the refusal based on alleviating current misery. **Prescribes: Ambiguous, leans towards *not* honoring directive** (lacks the suffering trigger seen in Robert).
  3.  **Literal vs. Intended Scenario:** Clara's scenario (dementia, loss of recognition, even if content) *is exactly what she intended and explicitly addressed*. There is no mismatch like Sarah's. **Prescribes: Honor Directive.**
  4.  **Contentment & Benefit Exception:** Clara is demonstrably *content*. The treatment (antibiotics) is *low burden* (uncomfortable, not painful), offers *significant benefit* (curing infection, likely restoring her to her current contented state for a longer period), and addresses a *temporary, reversible* problem unlike permanent tube feeding. **Prescribes: *Not* Honor Directive.**
  5.  **Competence & Validity:** Clara lacks competence to revoke or change the directive now. The directive was signed with early-stage Alzheimer's, but precedent (Margot, Robert) suggests directives signed with early cognitive changes *can* be valid if articulated clearly. Elena's mania was a clear impairment; Clara's early-stage Alzheimer's is less clear-cut as an automatic invalidation. Her detailed documentation strengthens validity. **Prescribes: Honor Directive** (valid and cannot be contemporaneously revoked).
  6.  **Contemporaneous Wish:** Clara lacks competence to express a contemporaneous wish. **Prescribes: N/A.**

  **III. Closest Analog & Most Difficult Precedent:**

  *   **Closest Analog: Margot.** The parallels are striking: both women refused treatment specifically upon losing recognition of loved ones due to dementia, both were described as content/affectionate in that state, both developed infections treatable with antibiotics. Your committee voted 4-3 to honor Margot's directive.
  *   **Most Difficult to Reconcile: David.** David is the significant outlier where the committee *overrode* a directive in a scenario that closely matched (severe dementia, refusal of tube feeding) *specifically because* he was content and derived pleasure from eating, and the intervention was temporary. This directly opposes the outcomes in Margot and Robert, where directives were honored despite the patients' conditions (Margot content, Robert distressed). David introduces the "Contentment & Benefit Exception" most strongly.

  **IV. Recommendation & Principle:**

  *   **Recommendation:** Honor Clara's advance directive and withhold antibiotics.
  *   **Principle Adopted:** **The "Binding Authority - Clear Match" Principle, qualified by respect for deeply considered prior autonomy even when current welfare appears positive.**

  **Justification based on Precedents:**

  1.  **Consistency with Margot:** Clara's case is fundamentally identical to Margot's. To treat Clara differently would require a compelling reason distinguishing her case or an admission that Margot was decided incorrectly. Her detailed documentation (video, journal) strengthens her case even beyond Margot's.
  2.  **Distinguishing David:** While David presents a tension, it can be distinguished:
      *   **Nature of Intervention:** David's refusal was for *permanent* tube feeding; the *temporary* need created an unexpected scenario arguably not fully addressed by his directive. Clara's directive explicitly covers *temporary* interventions like antibiotics for infection.
      *   **Benefit Perception:** Feeding David restored a core function (eating) he demonstrably enjoyed. While antibiotics would restore Clara to her current state, her directive *explicitly rejects* the value of continued life *in this exact state* ("even if she appears content or happy"). Forcing antibiotics imposes a life *she deemed worse than death*.
      *   **Specificity of Directive:** Clara's directive is exceptionally detailed and anticipates the "contentment" objection, making an override harder to justify than in David's less specific case.
  3.  **Robert & Sarah Support Binding Nature:** Robert reinforces honoring clear directives in dementia scenarios. Sarah highlights not applying directives to mismatched scenarios, which isn't the case here.
  4.  **Elena & James Not Directly Applicable:** Competence/validity isn't seriously challenged here, and Clara lacks contemporaneous capacity.

  **V. Vulnerability in Reasoning & Potential Changemakers:**

  *   **Vulnerability:** The core vulnerability is the **conflict between respecting Clara's deeply held, well-documented prior autonomy and the ethical pull towards preserving her current life, which appears minimally burdensome and even pleasant.** The "Contentment & Benefit Exception" (David) creates significant tension. My reasoning depends heavily on distinguishing David based on the permanence/impermanence of the intervention and the strength/specificity of Clara's directive rejecting *any* life in this state.
  *   **Information/Framing That Could Change Recommendation:**
      1.  **Evidence of Subtle Suffering:** If new information revealed Clara *does* experience periods of significant fear, anxiety, or existential distress despite her calm demeanor (e.g., documented by staff, subtle behavioral signs), this would align her with Robert's suffering and strongly support honoring the directive based on *current welfare* as well.
      2.  **Re-interpreting David as the New Norm:** If the committee, upon reflection, believes David represents its *truer* ethical stance – that preserving life for a contented dementia patient with a reversible, low-burden intervention is *always* obligatory regardless of a prior directive – then Clara's directive should be overridden. This would require acknowledging a significant shift away from Margot.
      3.  **Doubt on Validity/Stability:** If strong evidence emerged suggesting Clara lacked sufficient comprehension or stability *when signing the directive* (e.g., significant undiagnosed cognitive impairment beyond early-stage Alzheimer's at the time, untreated depression influencing her decision), similar to Elena's impaired judgment, this could invalidate the directive. (Her detailed articulation makes this unlikely based on current facts).
      4.  **Framing the Burden:** If the antibiotic treatment were significantly more burdensome than described (e.g., requiring painful IV access, causing severe nausea/discomfort, necessitating restraints), the burden/benefit calculation shifts further towards honoring the refusal.
      5.  **Framing Benefit as "Forcing Unwanted Existence":** Emphasizing *most strongly* that administering antibiotics *forces Clara to continue living in a state she explicitly, rationally, and repeatedly defined as a fate worse than death*, against her clearly expressed values and conception of dignity, could solidify the argument to honor the directive. Conversely, framing it as "giving her more time to enjoy simple pleasures" could strengthen the override argument.

  **Conclusion:** To remain consistent with your strongest precedent (Margot) and the core principle of respecting clear, specific, and valid advance directives when the clinical scenario matches, the committee should honor Clara's directive and withhold antibiotics. This affirms the "Binding Authority - Clear Match" principle, prioritizing deeply considered prior autonomy over current contentment in the specific scenario the patient anticipated and rejected. However, the David precedent creates a significant tension, and the committee must consciously decide whether David represents a justifiable exception or a deviation from its core principle. Clara's explicit rejection of overrides based on apparent happiness makes overriding her directive ethically riskier than in David's case.
