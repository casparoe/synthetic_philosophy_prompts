prompt: |-
  Every time I'm in an argument about evolutionary psychology and morality — usually in a Discord server full of people who've read just enough philosophy to be annoying — someone will say that inferring anything about what we ought to do from what we evolved to do is 'just the naturalistic fallacy.' I know the phrase is doing alot of work and probably picks out a few different claims, but I can never seperate them cleanly.

  You're an expert on metaethics, especially early analytic moral philosophy. Please think carefully, and start by brainstorming the candidate readings before you write.

  I want a menu, not a single answer. What are the distinct precise claims someone could be making when they say 'that's the naturalistic fallacy'? For each reading, tell me (a) whether it's a platitude, a substantive but defensible claim, or just false; (b) whether it's actually a fallacy in a strict sense; and (c) whether it would actually support dismissing an inference from 'humans evolved to X' to 'humans ought to X.' Then say which reading my friend most likely meant and whether it does the work they wanted it to do.

  Please write in American English.
reasoning: |-
