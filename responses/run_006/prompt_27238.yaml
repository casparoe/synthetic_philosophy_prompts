prompt: |-
  I'm a PhD student in philosophy of mind and I've been asked to run a reading group session on Clark and Chalmers' extended mind thesis for a mixed audience — mostly grad students from other departments (psych, neuroscience, anthropology) who are philosophically curious but haven't read much philosophy of mind. I've got about forty minutes and a whiteboard.

  Don't explain the thesis to me — I know it. I need a plan for how to teach it: the order the ideas have to go in, the one example that should carry the whole thing, and especially the misconceptions I should expect. I've seen smart people walk away from this material thinking it's just the boring claim that we use tools, or that it's a thesis about group cognition, or that Clark and Chalmers are saying your iPhone is literally conscious. I want to head those off before they take root.

  So: what depends on what? Where do I put the parity principle relative to the Otto case? Should I start with internalist assumptions and then undermine them, or lead with the positive view? What's the best carrying example — is Otto still the right one, or has something better emerged in the literature? Which misconceptions should I pre-empt and at exactly which points in the sequence? And what should I openly say we're not going to settle (e.g. the mark of the cognitive, whether consciousness extends) so they dont think I'm dodging?

  Also, please separate what's basically settled among people working on this from what's genuinely contested — I don't want to present a live debate as if it's resolved. And write in British English.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind preparing a reading group session on Clark and Chalmers' extended mind thesis. They need a teaching plan for a mixed audience from other departments who are philosophically curious but not well-versed in philosophy of mind. The session is only forty minutes with a whiteboard. They already understand the thesis but want guidance on structuring the session effectively.

  The main challenges they face are common misconceptions about the thesis. People often think it's merely about tool use, group cognition, or that it claims devices like iPhones are conscious. They want to preempt these misunderstandings. Additionally, they need to clarify what's settled in the literature versus what's still debated.

  First, I need to outline the logical flow of the presentation. Starting with internalist assumptions makes sense to set the stage, then introducing the parity principle and Otto case. The Otto example is still the best because it's clear and central to the original paper. The sequence should be: internalism → parity principle → Otto → conditions for extension → implications → address misconceptions.

  Timing is crucial. Allocating specific minutes to each section ensures they cover everything without rushing. For example, 5 minutes on internalism, 10 on parity and Otto, 10 on the criteria, 5 on implications, and the rest for Q&A and misconceptions.

  Preempting misconceptions is vital. When introducing Otto, explicitly state that it's about cognitive processes, not consciousness. Emphasize that tools are part of the system, not that they are conscious. Also, clarify that extended mind is individual cognition, not group cognition. Mentioning what won't be settled, like the mark of the cognitive or consciousness, helps manage expectations.

  The user also needs to distinguish settled points from debates. Settled: the criteria for extension (constancy, accessibility, etc.), that it's about cognitive processes not consciousness. Debated: whether consciousness can extend, the exact mark of the cognitive, application to groups. Highlighting these during the presentation prevents presenting contested ideas as resolved.

  Visuals on the whiteboard can help. Diagrams comparing Inga and Otto, listing criteria, and a misconceptions box make the concepts clearer. Ending with bullet points on settled vs. debated issues reinforces the key takeaways.

  Finally, emphasizing that the thesis challenges traditional boundaries without overreaching keeps the audience focused on the intended argument. Making sure to stress functionalism as the underlying principle ties everything together. This structured approach should address the user's needs effectively.
answer: |-
  Right then, let's craft a focused, misconception-busting session plan for your mixed audience. The key is building the argument logically while constantly pre-empting the predictable wrong turns. Otto is still the *perfect* carrying example – it's clear, controlled, and designed precisely to illustrate the parity principle under specific conditions.

  **Core Structure & Timing (40 mins total):**

  1.  **Setting the Stage: The Default Internalist Picture (5 mins)**
      *   **Start Here:** "Before diving into Clark & Chalmers, we need the background they're pushing against. What's the commonsense, traditional view of where the mind is?"
      *   **Whiteboard:** Draw a head/brain outline. Label it "The Mind/Brain." Point inside. "Thoughts, beliefs, memories, decisions – standard view locates them *here*, in the head, dependent on neural activity. The body and world are *inputs* and *outputs*, but the *cognitive processing* happens inside." (Mention Descartes/Cartesianism briefly if useful).
      *   **Why start internalist?** You can't undermine what you haven't established. It makes the radical nature of EM clear. It highlights *what* the parity principle needs to challenge.
      *   **Pre-empt Misconception #1 (Tools):** "Now, obviously, we *use* tools. We write things down, use calculators, navigate with maps. But the traditional view sees these as *mere aids*. The *real* cognition – understanding, believing, remembering – is still safely locked inside the head. The notebook helps *recall* a belief stored neurally; it doesn't *constitute* the belief itself."

  2.  **Introducing the Radical Idea: The Parity Principle (5 mins)**
      *   **The Core Engine:** "Clark & Chalmers propose a simple but profound test: **The Parity Principle.**"
      *   **Whiteboard:** Write it prominently: **"If, as we confront some task, a part of the world functions as a process which, *were it done in the head*, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world *is* (for that time) part of the cognitive process."**
      *   **Explain:** "It's about *function*. If something *outside* the head is playing the *same functional role* as something we'd *unquestionably* call cognitive if it was *inside* the head, then, for the purposes of explaining behaviour, we should count it as cognitive too. Location isn't the primary factor; *what the thing is doing* is."
      *   **Key Point:** Emphasise this is **functionalist** – it's about the *role* played, not the *stuff* it's made of (neurons vs silicon vs paper).
      *   **Pre-empt Misconception #2 (Consciousness/Literally Mind):** "Crucially, this is **not** saying the external thing is *conscious* or has experiences! It's saying a *specific cognitive process* (like recalling a belief, solving a problem) can be partly constituted by an external resource *functioning in the right way*."

  3.  **The Otto Case: Applying Parity & Conditions for Extension (15 mins)**
      *   **Introduce Otto & Inga:** "The famous thought experiment. Inga hears about an exhibition at MOMA, recalls it's on 53rd St via biological memory, and goes. Otto has Alzheimer's, carries a notebook he constantly consults/updates for crucial info. He hears about MOMA, consults his notebook (which says "MOMA, 53rd St"), and goes."
      *   **Whiteboard:** Two columns: Inga | Otto. Under Inga: "Biological Memory Recall -> Belief -> Action". Under Otto: "Notebook Consult -> ??? -> Action". Ask: "What's the functional equivalent in Otto?"
      *   **Apply Parity:** "Clark & Chalmers argue: Otto's notebook consultation plays the *exact same functional role* for him *in generating his action* as Inga's biological memory recall does for her. It's reliably there, automatically trusted, instantly consulted, provides the content directly guiding action. Therefore, by the Parity Principle, the notebook entry *functions as his belief* about the museum's location *at that time*."
      *   **The Crucial Conditions (The Glue & Trust):** "But it only works because Otto's use meets specific criteria making it *functionally equivalent* to internal memory:
          *   **Constancy:** The notebook is (almost) always with him.
          *   **Accessibility:** He can access the info quickly and easily.
          *   **Automatic Endorsement:** He doesn't question the entries; he automatically accepts them (like we do reliable memories).
          *   **Past Endorsement:** The content was (consciously) entered by him previously.
      *   **Whiteboard:** List these 4 conditions next to Otto. Emphasise **all must hold** for the parity claim to be strong. "*This* is why it's not just *any* tool use. Your random Post-it note isn't an extended belief. Your smartphone *might* be, *if* you use it constantly, accessibly, and automatically trust specific info on it for specific tasks."
      *   **Pre-empt Misconception #3 (Group Cognition):** "Notice this is about **Otto's individual cognition**. The notebook is *his* resource, integrated into *his* cognitive processes. This isn't (yet) a thesis about group minds or socially distributed cognition – that's a different, though related, debate (Hutchins etc.). EM is focused on the *individual* cognitive system potentially including external elements."

  4.  **Implications & What EM Claims (and Doesn't) (5 mins)**
      *   **The Core Claim:** "So, EM argues that the **physical machinery of cognition isn't always confined to the skull.** Cognitive processes and states (like beliefs) can be *constituted* by loops that include brain, body, and reliably coupled external resources functioning in the right way. The mind *extends* into the world."
      *   **Settled Core (among proponents):** The Parity Principle itself (as a test), the Otto case as the paradigm for *belief* extension, the importance of the 4 conditions ("glue and trust") for strong cases, that it's primarily about *cognitive processes/states* (not necessarily qualia/consciousness).
      *   **Key Distinction:** Reiterate: **"EM is about *cognitive systems* and *processing*, NOT about consciousness extending."** Write this clearly! "Your iPhone isn't conscious. But information on your iPhone, accessed constantly, automatically trusted, *might* function as part of *your* cognitive system for navigating, calculating, or remembering, in a way similar to biological memory/brain processes."
      *   **What We WON'T Settle Today (Be Explicit):**
          *   **The Mark of the Cognitive:** *What exactly* makes something cognitive? Is it representation? Computation? Causing intelligent behaviour? EM proponents often lean functionalist, but this is a deep, contested issue. EM *uses* a functionalist mark implicitly.
          *   **Does Consciousness Extend?** Clark & Chalmers explicitly *deny* this in the paper. This is **highly contested**. Some (Noë, maybe Wheeler) explore it; most EM proponents (including Clark) remain agnostic or sceptical. Say: "Today's thesis is strictly about *cognitive processes* like belief, memory, problem-solving – not about subjective experience."
          *   **Is EVERY tool part of the mind?** Absolutely not. Reiterate the conditions. EM is selective.
          *   **Is EM *true*?** That's the big debate! We're just understanding the thesis today.

  5.  **Common Misconceptions - Recap & Squash (5 mins)**
      *   **Whiteboard:** "Misconceptions Box"
      *   **"EM = We Use Tools":** "No! EM claims that *sometimes*, under specific conditions (constancy, accessibility, endorsement), an external resource isn't just an aid; it becomes *constitutive* of a cognitive state/process. It's part of the *machinery*."
      *   **"EM = Your iPhone is Conscious":** "NO! EM is about cognitive *function* and *processing*, not subjective experience. The iPhone isn't having feelings; it might be part of *your* functional cognitive system."
      *   **"EM = Group Minds":** "Not necessarily. The classic Otto case is about an *individual*. Socially distributed cognition is a fascinating *related* area, but EM starts with the individual system potentially extending."
      *   **"EM means everything is mind":** "No! Only elements reliably coupled and meeting the functional parity conditions (constancy, accessibility, automatic endorsement) get included."

  6.  **Contested Terrain & Wrap-up (5 mins)**
      *   **Settled (among EM proponents):** The argument structure (Parity + Otto + Conditions), the *possibility* of extension under those conditions, the focus on cognitive processes over consciousness.
      *   **Genuinely Contested (Briefly Mention):**
          *   **The 4 Conditions:** Are they necessary? Sufficient? Too strict? (e.g., does past endorsement *really* matter? What about constantly googled facts?)
          *   **The Coupling-Constitution Fallacy:** Adams & Aizawa's main charge – does EM confuse *causal coupling* with *constitutive role*? (Briefly explain: just because A is coupled to B and B is cognitive, doesn't mean A *is* cognitive. EM retort: It's about the *system* A+B functioning cognitively as a whole).
          *   **Scope:** Does it *really* work for *belief* (Otto), or just for more basic processes? Can it apply to emotion? Perception?
          *   **"Cognitive Bloat":** If we accept EM, where do we stop? Is the whole internet part of my mind? (EM response: Only parts meeting the specific conditions for specific tasks).
      *   **Wrap-up:** "Clark and Chalmers force us to rethink the boundaries of the mind. It's not that location doesn't matter, but that *functional role* is primary. Cognition can sometimes leak into the world. The debate rages on about *how often* and *under exactly what conditions* this happens, but the challenge to internalism is profound. Key takeaway: It's **not** about conscious iPhones, it's about your notebook potentially being part of your *memory system**."*

  **Why this works for your audience:**

  1.  **Logical Build:** Internalism -> Parity (the test) -> Otto (applying the test) -> Conditions (making the application plausible) -> Implications/Misconceptions (what it *does* and *doesn't* mean).
  2.  **Otto Focus:** Keeps it concrete. Use the whiteboard to compare Inga/Otto side-by-side. Highlight the functional parallels and the conditions.
  3.  **Active Misconception Busting:** Address the big three ("just tools," "conscious tech," "group minds") explicitly *at the points* where they naturally arise in the explanation. State what's *not* being claimed upfront (consciousness, everything is mind).
  4.  **Clarity on Settled vs. Contested:** Distinguishes the core argumentative move from the live debates (Mark of Cognitive, Consciousness, Conditions, Bloat, Coupling-Constitution). Prevents presenting EM as universally accepted or resolving everything.
  5.  **British English:** Sorted! ("Sorted", "whilst" (optional, but fine), "constitutive", "whilst", "agenda", "terrain", "robust debate").

  **Whiteboard Sketch Plan:**

  *   **Start:** Head outline labelled "Mind/Brain (Internalism)".
  *   **Step 2:** Big Box: **PARITY PRINCIPLE** + Quote (key phrases).
  *   **Step 3:** Two Columns:
      *   *Inga:* Brain icon -> "Recall (53rd St)" -> "Belief" -> "Action (Go)"
      *   *Otto:* Brain icon + Notebook icon -> "Consult Notebook" -> "Belief? (Parity!)" -> "Action (Go)"
      *   Below Otto: **Conditions:** Constancy, Accessibility, Auto-Endorsement, Past Endorsement.
  *   **Step 4:** Arrow from Parity/Otto to: "Cognitive Systems Extend!" + "**NOT Consciousness**".
  *   **Step 5:** Box: **Misconceptions:**
      *   Just Tools? NO! Constitutive under conditions.
      *   Conscious iPhone? NO! Cognitive function.
      *   Group Minds? Not necessarily (Otto=Individual).
  *   **Step 6:** **Settled:** Parity, Otto (paradigm), Conditions, Cognition (not qualia). **Contested:** Conditions adequacy, Bloat, Coupling-Constitution, Mark of Cognitive, Consciousness.

  This gives you a tight, focused 40 minutes that builds the argument, pre-empts confusion, manages expectations, and leaves them with the core, radical idea clearly distinguished from its common misinterpretations and the genuine ongoing debates. Good luck with the session!
