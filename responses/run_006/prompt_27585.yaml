answer: |-
  Here’s a targeted Q&A prep sheet for your metaphysics workshop, structured by likely objector, objection phrasing, damage assessment, strategic concessions, key holds, and a concise reply with vulnerability flags. The objections are ordered by anticipated sequence.

  ---

  ### **Q&A Prep Sheet: Identity View of Constitution**  
  **Core Thesis:** Statue/lump identity; modal conflicts resolved via sortal-qualified predicates.  
  **Key Defense:** Sortal-relativity of de re modals preserves absolute identity & Leibniz’s Law.

  ---

  #### **1. Objection from Pluralists (Coincidence Theorists)**  
  **Likely Phrasing:**  
  *"If the statue and lump are identical, how can one *survive squashing* while the other doesn’t? This violates Leibniz’s Law—unless you’re smuggling in relative identity."*  

  **Damage Level:** 🔥🔥🔥 (High—targets core coherence)  
  **Concede:** Leibniz’s Law *must* hold for identicals; no relative identity.  
  **Hold:** Modal predicates are *incomplete* without a sortal. "Survives squashing" isn’t a monadic property but *sortal-indexed*.  

  **Two-Minute Reply:**  
  > "Leibniz’s Law applies only to *non-sortal-relative* properties. ‘Can survive squashing’ isn’t a fundamental property; it’s elliptical for ‘can survive squashing *as a lump*’ or ‘*as a statue*’. When we specify the sortal, we see the object has the property under ‘lump’ but lacks it under ‘statue’. No contradiction, no relativism—just semantic context-dependence. The *one object* has different modal profiles under different conceptual lenses."  
  **Soft Spot:** "Why treat ‘lump’ and ‘statue’ as equally valid sortals if there’s only one object? Don’t sortals track objecthood?"  

  ---

  #### **2. Objection from Four-Dimensionalist (Perdurantist)**  
  **Likely Phrasing:**  
  *"Isn’t this just a verbose way to say what perdurantism says cleanly? The ‘statue’ and ‘lump’ are temporal parts of the same spacetime worm. Your sortal semantics obscures the real solution: parthood over time."*  

  **Damage Level:** 🔥🔥 (Medium—undermines novelty)  
  **Concede:** Perdurantism *also* resolves the puzzle via temporal parts.  
  **Hold:** Your view is more ontologically parsimonious (no temporal parts) and avoids arbitrating which slices are "statue-like."  

  **Two-Minute Reply:**  
  > "Perdurantism solves the problem but commits to controversial temporal parts. My view achieves parity without that ontology. The sortal-relativity I propose is a *semantic* feature of modal discourse, not a metaphysical posit. It’s compatible with endurantism and avoids slicing objects across time. For those skeptical of temporal parts, this is a leaner solution."  
  **Soft Spot:** "If your semantics mirrors perdurantism’s output, why isn’t it just a linguistic variant?"  

  ---

  #### **3. Objection from Finean Essentialist (Graduate Student)**  
  **Likely Phrasing:**  
  *"Sortal-relativity kicks the can down the road. *Which object* has which essence? If there’s only one object, we still need an account of why it satisfies ‘is essentially statue-shaped’ under ‘statue’ but not under ‘lump’. Isn’t this just essentialism in disguise?"*  

  **Damage Level:** 🔥🔥🔥 (High—questions foundations)  
  **Concede:** Sortals *do* track essential properties.  
  **Hold:** Essences aren’t absolute but *sortal-relative*. The object’s modal profile is fixed by the sortal context.  

  **Two-Minute Reply:**  
  > "Essences *are* sortal-relative. The object doesn’t have an essence *simpliciter*; it has ‘statue-essence’ when described as a statue and ‘lump-essence’ when described as a lump. This avoids Fine’s rigid essentialism while respecting that modal claims are always made under a sortal. We pick the essence by picking the sortal—there’s no deeper ‘metaphysical essence’ beyond this."  
  **Soft Spot:** "Doesn’t this make essence *conventional*? What grounds sortal correctness?"  

  ---

  #### **4. Objection from Identity Skeptics (Sympathetic but Wary)**  
  **Likely Phrasing:**  
  *"This smells like relative identity (*a* and *b* are the same lump but different statues). How is substituting ‘statue’ for ‘lump’ in modal contexts different from saying ‘*a* is the same L as *b* but not the same S’?"*  

  **Damage Level:** 🔥🔥🔥 (Critical—threatens view’s legitimacy)  
  **Concede:** Relative identity is unacceptable.  
  **Hold:** Identity is absolute; sortals are *modes of presentation* for predicates, not relativized identity conditions.  

  **Two-Minute Reply:**  
  > "Absolute identity is untouched: there’s one object, full stop. Sortals govern *predication*, not identity. When we say ‘it survives as a lump but not as a statue’, ‘it’ refers rigidly to the same entity. The difference lies in *how we describe it*, not *what it is*. Leibniz’s Law holds because no property is both affirmed and denied of the object *under the same qualification*."  
  **Soft Spot:** "Why can’t we substitute sortals *salva veritate* in modal contexts if identity is absolute?"  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Likely Phrasing:**  
  *"If sortals are just pragmatic tools for predicate qualification, what *metaphysically* distinguishes cases of constitution (e.g., statue/lump) from uncontroversial identities (e.g., Hesperus/Phosphorus)? Why isn’t this linguistic deflationism?"*  

  **Why You Fear It:**  
  This exposes the **Achilles’ heel** of your view. It forces you to either:  
  1. **Admit conventionalism:** Sortals are human-dependent, making modal properties "shallow" (risking anti-realism), or  
  2. **Posit metaphysical grounds for sortals:** This invites questions about what *makes* ‘statue’ a valid sortal (e.g., Finean hylomorphism), undermining your lightweight semantics.  

  **Strategic Reply (If Cornered):**  
  > "The difference is *explanatory role*: in constitution cases, distinct sortals track distinct *causal-historical roles* (e.g., ‘statue’ implies artist intentions). But this doesn’t multiply objects—it reflects how one object inhabits multiple causal narratives. This avoids deflationism without reifying sortals."  
  **Vulnerability:** Opens the door to "So are sortals grounded in mind-independent facts?"—a rabbit hole.  

  ---

  ### **Summary Defense Strategy**  
  - **Against pluralists:** Hammer sortal-relativity as *semantic*, not metaphysical.  
  - **Against perdurantists:** Stress ontological economy.  
  - **Against essentialists:** Embrace sortal-relative essence.  
  - **Against relativism:** Insist on rigid reference + predicate qualification.  
  - **General Tip:** Preempt relative identity suspicions by explicitly denying it in your talk.  

  Good luck—your move is elegant but lives in a minefield!  
  *P.S. If pressed on the "feared question," pivot to the statue’s intentional history as grounding ‘statue’ without substance dualism.*
