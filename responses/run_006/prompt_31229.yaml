  *considers revision options* The cleanest fix would be softening content determinacy to allow degrees of naturalness among representations - like how "chair" is a more natural concept than "green things heavier than 2kg". But that costs some metaphysical certainty. Alternatively, they could restrict pluralism to coarse-grained decompositions... but that feels ad hoc. 

