  *scratches virtual head* Interesting how they've structured the dependencies: causal interventions (2) as the antidote to decodability skepticism (3), superposition (4) explaining why we need better methods than neuron labeling... it's elegant but fragile. The user might be underestimating how much pluralism undermines determinacy.

