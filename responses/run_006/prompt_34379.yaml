prompt: |-
  So I just spent like three hours at a bar arguing with a friend who's a law lecturer about whether a manager at her university actually fired someone or not. The guy said "I think we're done here, clear out your desk" during a heated meeting, but then the provost says no, the firing wasn't official because it wasn't in writing and the manager didn't have sign-off. My friend was like "speech act theory says he fired him, the words did the thing" and I was like "but the felicity conditions weren't met" and we went in circles. I realized I dont actually have a systematic way to think about this even though I deal with it all the time.

  I work in HR operations for a decent-sized nonprofit and I'm the person who writes the scripts and templates for managers doing terminations, disciplinary meetings, promotions, performance reviews — all the conversations where the words are supposed to actually DO something, not just describe something. And Ive been winging it. What I want is a proper procedure I can use to audit our scripts: a checklist or decision tree that tells me, for any piece of scripted language, whether it's performative or constative, whether it actually performs the act it's supposed to, and what conditions would cause it to fail.

  Specifically I need it to cover: (a) is this utterance even trying to be performative, (b) what felicity conditions does it need — authority, sincerity, correct procedure, uptake, all of that, (c) which conditions are binary pass/fail and which are matters of degree, and (d) where the procedure has to throw up its hands and say "this is a judgment call, ask a lawyer or a more senior HR person."

  Then I want you to run it on three of our actual scripts. One: a termination meeting opener — "I'm terminating your employment effective immediately." Two: a verbal warning — "This is a formal verbal warning and will be documented in your file." Three: a promotion conversation — "I'm pleased to tell you we're promoting you to senior program manager." For each one, tell me: if all the conditions are met, does the utterance actually perform the act (fire, warn, promote) or is it just reporting a decision that happened somewhere else? And flag the cases where the utterance is performative but some condition is borderline and the procedure can't resolve it — like, the manager has delegated authority to fire but the employee handbook says termination requires VP approval, and the manager said the words before the VP weighed in.

  Be straight with me about where the philosophy gives clear answers and where it doesn't. And if the procedure spits out something I don't want to hear — like "your promotion script isn't actually performative, it's just describing what HR already decided" — dont sugarcoat it.
reasoning: |-
  Okay, let's tackle this user's problem. They work in HR operations and need a systematic way to audit scripts for performative utterances. They mentioned a bar argument about speech act theory, which tells me they have some background in Austin's ideas but need practical application. 

  First, I need to recall Austin's distinction between performative and constative utterances. Performatives do something by being said, like firing someone, while constatives describe a state. But as Austin later realized, it's more complex. The user needs a checklist to determine if their scripts actually perform the intended actions.

  The user's deeper need is to ensure legal and procedural compliance in HR scripts. They don't want ambiguous language that could lead to disputes, like their bar argument example. Their role involves creating templates for terminations, warnings, and promotions, so accuracy is crucial to avoid lawsuits or internal issues.

  Breaking down their request: they want a procedure covering four aspects—identifying performative intent, necessary felicity conditions, pass/fail vs. gradient conditions, and when to escalate. Then applying this to three scripts. 

  Starting with the termination script: "I'm terminating your employment..." This is clearly performative. Key conditions include the manager's authority, proper procedure (like VP approval), and uptake. If the manager lacks authority or skips steps, the act misfires. The user's example of missing VP approval is a red flag—here, the procedure would flag it as a judgment call for legal.

  Next, the verbal warning: "This is a formal verbal warning..." This is also performative. Conditions involve authority, correct procedure (documenting in the file), and sincerity. If documentation doesn't happen, it's a misfire. The gradient issue here is whether the employee understands the seriousness, which affects uptake but doesn't invalidate the act if documented.

  Promotion script: "I'm pleased to tell you we're promoting you..." This is tricky. It might be constative if HR already decided, making the manager just a messenger. To be performative, the manager needs authority to finalize the promotion. If not, it's a report, not the act itself. The user might need to adjust the script to clarify when the decision is made.

  The user might not realize that some scripts, like promotions, may not be performative unless the speaker has final authority. Highlighting this is essential, even if it means reworking their templates. Also, borderline cases like incomplete approvals require legal input, which the checklist should clearly indicate.

  Underlying all this is the user's need for reliability. They've been "winging it," so providing a clear, step-by-step tool reduces their legal risk. Emphasizing where philosophy gives clear answers (like authority requirements) versus where legal judgment is needed (procedural gaps) helps them know when to seek help. No sugarcoating—if a script isn't performative, stating that outright lets them fix it proactively.
answer: |-
  Here's a systematic procedure based on Austin's speech act theory, refined for HR operational use. I've designed it as a decision tree/checklist, followed by an analysis of your three scripts.

  **HR Speech Act Audit Procedure**

  1.  **Determine Performative Intent:**
      *   **Question:** Is the utterance structured as an explicit performative formula (using verbs like "I warn," "I terminate," "I promote," "I apologize," "I promise") or a performative equivalent ("You're fired," "This is your warning," "Congratulations on your promotion")?
      *   **Yes:** Proceed to Step 2. (Likely Performative)
      *   **No:** The utterance is likely **constative** (describing a state or reporting a prior action/decision). Audit focus shifts to accuracy and clarity of reporting, not performative force.
      *   **Borderline:** If the utterance *implies* action but lacks explicit formula (e.g., "Your services are no longer required"), it *might* be performative in context, but requires careful legal review (escalate). *Default to constative without explicit formula or strong context.*

  2.  **Identify & Verify Felicity Conditions (A-I):**
      *For each condition, determine: (a) Is it required? (b) Is it verifiable objectively? (c) Is it Pass/Fail or Gradient?*
      *   **A. Accepted Conventional Procedure Exists:** Is there a recognized process (company policy, handbook, law) for this act?
          *   *Pass/Fail:* Yes/No. *Failure = Misfire (Act void/defective).*
      *   **B. Appropriate Persons & Circumstances Exist:** Are the speaker and hearer the correct parties? Is the context appropriate (e.g., formal meeting, not a joke)?
          *   *Pass/Fail:* Yes/No. *Failure = Misfire.*
      *   **C. Speaker's Authority:** Does the speaker have the institutional authority to perform this act *at the moment of speaking*? (Delegated, role-based, final vs. recommending).
          *   *Pass/Fail (Core):* Possesses final authority? *Failure = Misfire.*
          *   *Gradient:* Level/source of authority. *Note:* Lacking *final* authority = Misfire.
      *   **D. Correct & Complete Execution:** Does the utterance follow the prescribed procedure *fully*? (Includes required steps *before* utterance? Required witnesses? Required specific phrasing?).
          *   *Pass/Fail (Core):* Were mandatory *pre-requisite* steps completed? *Failure = Misfire.*
          *   *Gradient:* Precision of phrasing if specified. *Slight deviation may not void if intent/understanding is clear.*
      *   **E. Speaker Sincerity:** Does the speaker possess the requisite thoughts/feelings? (e.g., belief in grounds for termination/warning, genuine intent to promote).
          *   *Gradient:* Hard to prove objectively. *Lack of sincerity generally does NOT void the act institutionally, but can create legal risk (bad faith, discrimination). Focus on documented justification.*
      *   **F. Uptake:** Does the hearer understand the utterance as performing the intended act? Does the relevant audience (e.g., HR system) recognize it?
          *   *Gradient:* Understanding can vary. *Lack of clear uptake doesn't usually void the act if other conditions are met, but creates confusion and risk. Crucial for warnings.*
      *   **G. Binding Nature:** Are the consequences of the act clear and enforceable? (Especially for promises, offers).
          *   *Pass/Fail (Implied):* For core HR acts (term, warn, promote), binding nature is inherent if act is successful. *Failure here usually stems from failure of A, C, or D.*
      *   **H. Correct Form:** Is the utterance delivered in the prescribed *form*? (Verbal only? Requires writing? Specific format?).
          *   *Pass/Fail:* If form is mandated (e.g., "Termination must be in writing"), *Failure = Misfire.* If not mandated, verbal can be sufficient.
      *   **I. No Vitiation:** Is the act free from duress, fraud, or fundamental mistake?
          *   *Pass/Fail:* Presence of vitiating factors? *Failure = Act potentially voidable (legal escalation essential).*

  3.  **Assess Felicity & Outcome:**
      *   **All A-D, H Pass?** → Performative utterance **successfully executed** the act *at the moment of speaking* (assuming I passes). The words *did* the thing.
      *   **Any Failure in A, B, C, D, H?** → **Misfire.** The act was *attempted* but is **void or defective**. It did *not* successfully execute the intended institutional act. *Escalate for legal/HRBP review.*
      *   **Issues only with E, F, G?** → Act is **successful but potentially flawed/risky.** (E: Risk of bad faith claim; F: Risk of misunderstanding/ineffectiveness; G: Usually covered by policy). *Flag for process improvement/training, potentially escalate F if severe.*
      *   **Issue with I?** → **Act potentially voidable.** *Immediate legal escalation required.*

  4.  **Borderline/Escalation Flags:**
      *   **Escalate Immediately:** Failure of A, C, D, H, or presence of I. Ambiguity on speaker's *final* authority (C). Significant deviation from procedure (D). Mandated form not used (H).
      *   **Flag for Review/Training:** Issues with E (sincerity - ensure robust documentation), F (uptake - ensure clarity, confirmation of understanding), minor deviations in D/Gradient.
      *   **Judgment Call (Philosophy/Law Intersection):** Whether borderline phrasing constitutes the performative (Step 1 borderline). Severity of procedural deviations (D - Gradient). Impact of partial authority (C - Gradient). Degree of defective uptake (F) that might undermine the act (rare for core HR acts, more common for contracts/promises). *When in doubt, escalate.*

  **Analysis of Your Scripts**

  **1. Termination Meeting Opener: "I'm terminating your employment effective immediately."**

  *   **Step 1 (Performative Intent):** **YES.** Explicit performative verb "terminating".
  *   **Step 2 (Felicity Conditions):**
      *   **A (Procedure):** *Pass/Fail.* Requires verification. *Audit:* Does policy exist? (Assume yes). *Key Risk:* Does it require steps *before* this meeting (e.g., PIP, review, VP sign-off)?
      *   **B (Appropriate Persons):** *Pass/Fail.* Assumed correct parties in meeting.
      *   **C (Authority):** *Pass/Fail (Core).* **CRITICAL.** Does *this manager* have *final, unilateral* authority to terminate *at this moment*? Or is VP/HR approval required *first*? (*Your example case: If VP approval required first, FAILURE - misfire*).
      *   **D (Execution):** *Pass/Fail (Core).* Were all pre-meeting steps (investigation, approval, decision) completed? *Gradient:* Is "effective immediately" correct per policy/context?
      *   **E (Sincerity):** *Gradient.* Manager must believe there are grounds. Institutional act succeeds even if insincere, but lack of grounds = legal risk.
      *   **F (Uptake):** *Gradient.* Understanding is likely ("you're fired" is clear), but confirmation is good practice.
      *   **G (Binding):** *Pass/Fail (Implied).* Inherent if successful.
      *   **H (Form):** *Pass/Fail.* **CRITICAL.** Does policy require *written* notice to be effective? If yes, *saying this alone FAILS - misfire*. If verbal suffices until written confirmation follows, PASS.
      *   **I (Vitiation):** *Pass/Fail.* Assumed absent.
  *   **Step 3 (Outcome):**
      *   **If A, B, C (FINAL authority present), D (pre-steps done), H (form ok) PASS:** **SUCCESS.** The words *terminated* the employee *at that moment*. The Provost is wrong about the writing *if policy doesn't mandate writing for effectiveness*. The manager's authority and procedure are key.
      *   **If C FAILS (lacks final authority) or H FAILS (writing mandated) or D FAILS (pre-approval missing):** **MISFIRE.** Utterance was *attempted* termination but is **void.** Employee is *not* officially terminated by this utterance. Provost is correct *if* policy requires writing or specific approval. Outcome depends on *policy*.
  *   **Step 4 (Flags):** **C (Authority)** and **H (Form)** are **BINARY PASS/FAIL ESCALATION POINTS.** Verifying the manager's *actual final authority at that moment* and the *mandated form of notice* is crucial. **D (Execution - pre-requisites)** is also critical. Borderline on C (e.g., "usually needs VP sign-off but not strictly required") is a **JUDGMENT CALL - ESCALATE.**

  **2. Verbal Warning: "This is a formal verbal warning and will be documented in your file."**

  *   **Step 1 (Performative Intent):** **YES.** Explicit formula "This is a... warning".
  *   **Step 2 (Felicity Conditions):**
      *   **A (Procedure):** *Pass/Fail.* Requires verification. *Audit:* Is there a policy defining verbal warnings? (Assume yes).
      *   **B (Appropriate Persons):** *Pass/Fail.* Assumed correct.
      *   **C (Authority):** *Pass/Fail.* Does the manager have authority to issue formal warnings? (Usually yes, but verify policy).
      *   **D (Execution):** *Pass/Fail (Core).* **CRITICAL.** Was due process followed *before* the meeting (investigation, chance to respond)? *Gradient:* Precision of description of issue. **CORE PASS/FAIL:** *"and will be documented"* - **Documentation MUST happen.** Failure to document = Failure of D. The act isn't complete until documented.
      *   **E (Sincerity):** *Gradient.* Must believe issue occurred. Documentation provides evidence.
      *   **F (Uptake):** *Gradient.* **CRITICAL.** Does the employee understand this is formal, documented, part of disciplinary process? Crucial for the warning to have effect. Should be confirmed.
      *   **G (Binding):** *Pass/Fail (Implied).* Inherent if successful.
      *   **H (Form):** *Pass/Fail.* Does policy require writing *for the warning itself*? If "verbal warning" is defined as *spoken but documented*, this suffices (PASS). If policy requires a *written warning letter* even for the first step, this FAILS.
      *   **I (Vitiation):** *Pass/Fail.* Assumed absent.
  *   **Step 3 (Outcome):**
      *   **If A, B, C, D (incl. documentation!), H PASS:** **SUCCESS.** The words *issued* the formal warning *at that moment*, contingent on the *necessary act of documentation*. The warning exists once documented.
      *   **If D FAILS (documentation doesn't happen) or H FAILS (written notice required):** **MISFIRE.** No valid warning was issued.
  *   **Step 4 (Flags):** **D (Execution - Documentation)** is a **BINARY PASS/FAIL ESCALATION POINT.** Script *must* ensure documentation happens promptly. **F (Uptake)** is a **GRADIENT RISK POINT.** Script should include manager confirmation of understanding. **H (Form)** needs verification against policy. Borderline on D (e.g., documented vaguely/in wrong file) is a **JUDGMENT CALL - ESCALATE.**

  **3. Promotion Conversation: "I'm pleased to tell you we're promoting you to Senior Program Manager."**

  *   **Step 1 (Performative Intent):** **NO.** This is **CONSTATIVE.** Key verbs: "tell you", "we're promoting". It *reports* a decision made elsewhere. It does not *perform* the promotion. The speaker is a messenger.
  *   **Step 2 (Felicity Conditions):** (Not strictly needed as constative, but for completeness)
      *   **C (Authority):** *Pass/Fail.* Does the speaker have authority to *communicate final decisions*? (Usually yes). **BUT:** They lack authority to *decide/promote* via this utterance.
      *   **D (Execution):** *Pass/Fail.* Must accurately report the *already-made* decision. Did HR/leadership *actually* decide this promotion before this meeting?
      *   **F (Uptake):** *Gradient.* Important for morale/understanding, but doesn't change the nature of the act (reporting).
  *   **Step 3 (Outcome):** The utterance **does NOT perform the promotion.** It *reports* a promotion decision that **must have been finalized previously** (e.g., by HR, senior leadership, compensation committee). The promotion happened when the final authority approved it, not when the manager spoke.
  *   **Step 4 (Flags):** **This script is fundamentally constative, not performative.** The **CRITICAL RISK** is **D (Execution):** If the manager says this *before* final approvals are complete (e.g., budget sign-off, formal offer accepted), it's a *misrepresentation* of a non-final decision. **Key Audit Question:** Does the script accurately reflect that the decision is final and fully approved *before* this conversation? If not, the script is dangerous. **Recommendation:** Rewrite to clarify source/status: "On behalf of [Department/Leadership], I'm delighted to officially confirm your promotion to Senior Program Manager, effective [date], as approved by [Entity]."

  **Key Takeaways & Philosophy vs. Practice:**

  1.  **Philosophy's Clarity:** Austin provides a brilliant framework (Intent, Felicity Conditions, Misfires) for understanding *how* words do things. The core distinctions (performative/constative, successful/misfire) are clear *in theory*.
  2.  **Philosophy's Limits / Law's Domain:** **Authority (C)** and **Procedure (A, D, H)** are where philosophy hands off to institutional rules and law. Austin says an act requires authority and procedure, but *what constitutes sufficient authority/procedure* is defined entirely by the institution/law, not philosophy. This is where your bar argument got stuck.
  3.  **HR Reality Check:**
      *   **Termination:** Can be performative *if* the speaker has *immediate final authority* and *policy allows verbal notice*. However, most robust policies require written notice *for effectiveness* (H), making the verbal utterance preparatory or reportive, not performative. Delegated authority without final sign-off (C) is the most common misfire trigger.
      *   **Warning:** Can be performative (verbal step documented), but **documentation (D)** is non-negotiable for the act's completion. Uptake (F) is crucial for fairness/process.
      *   **Promotion:** Manager conversations are almost *always* constative reports of decisions made by higher authority (compensation, HR, senior leadership) based on process (budget, calibration). Framing them as performative by the manager is legally risky.
  4.  **Your Audit Power:** This procedure gives you a rigorous way to dissect your scripts. Focus relentlessly on:
      *   **Is the verb actually performing?** (Step 1 - Promotion script fails here).
      *   **Does the speaker have FINAL AUTHORITY RIGHT NOW?** (Step 2C - Termination/Warning key).
      *   **Are MANDATORY PRE-REQUISITES COMPLETE?** (Step 2D - Termination approval, Warning investigation).
      *   **Is the MANDATED FORM used?** (Step 2H - Especially writing requirements).
      *   **Are POST-UTTERANCE ACTIONS REQUIRED?** (Step 2D - Documentation for Warning).

  **Recommendation:** Revise your promotion script to be explicitly constative/reportive. For termination and warning scripts, embed strong reminders/checkpoints within the manager guidance (not necessarily the spoken script) to verify **C (Authority - Final? Now?)** and **D (Execution - Pre-approvals done? Documentation WILL happen)** *before* the performative utterance is spoken. Always know your policy's **H (Form)** requirement. Where C, D, or H are complex or conditional, **ESCALATE** – that's the procedure throwing up its hands rightly.
