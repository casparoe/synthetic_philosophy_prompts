  First, the "narrowest class" approach. The user might be imagining a neat statistical solution, but the problem is that "adequate statistics" is vague. What counts as adequate? 30 samples? 1000? More fundamentally, even with infinite data, if the class is defined by accidental properties, the probability might not reflect the actual causal tendencies. And narrowing the class arbitrarily could lead to singleton sets where frequentism breaks down completely. 

  Then there's the causal relevance idea. The user is smart to bring this up—it's what we intuitively want in probability assignments. But frequentism can't handle causation by definition. It's about long-run frequencies in defined populations, not underlying mechanisms. If we smuggle in causation, we're abandoning pure frequentism for something else. 

