  The part where I'd be most open to pushback is whether this is truly a death blow. Maybe a sophisticated frequentist could argue that all probabilities are inherently conditional, and the "real" probability just is the one relative to the chosen reference class. But that feels like surrendering objectivity. Alternatively, maybe in scientific practice we avoid the worst cases by using well-defined populations. Still, the philosophical wound remains. 

