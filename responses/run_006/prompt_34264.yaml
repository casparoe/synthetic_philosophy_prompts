prompt: |-
  I run a small research programme — about five postdocs and a handful of PhD students — focused on the normative design of AI reasoning. We are past the point of asking whether AI systems should be value-aligned at all; we are trying to settle what kind of moral reasoning an AI should employ when it faces genuinely novel ethical decisions. The debate has largely organised itself around a familiar dichotomy: should AI systems reason as utilitarians (maximising expected welfare under uncertainty) or as deontologists (respecting constraints, rights, or side-constraints that are not reducible to welfare trade-offs)? But that framing is still too coarse to guide actual engineering or training decisions, and I suspect some of the most important open questions are downstream of it, or cut across it, rather than being settled by picking a side.

  I am putting together a three-year research agenda for the group, and I need to decide which open questions in this vicinity are most worth our time. I am not looking for a survey of the literature or a reading list. I want a defended prioritisation: which questions should we tackle first, and why? For each question you rank, I want to know how upstream it is — does answering it unlock or reshape other questions? — how tractable it is for a group with our mix of philosophical and technical competence (we can do formal modelling and some experimental work, but we are not a machine learning lab), and what kind of result over the next couple of years would make you raise or lower its priority. I am also interested in which questions you would deprioritise, either because they are less consequential than they first appear or because they are intractable with current tools. Please take definite positions; I can read a balanced literature review on my own, but I need someone to actually commit to a ranking and defend it.

  After your prose, please give me a structured summary as a JSON array of objects, one per ranked question, with the following fields: `rank` (integer, 1 being highest priority), `question` (a one-sentence statement of the open question), `importance_rationale` (one to two sentences on why it is upstream of other work or practically consequential), `tractability` (one of `"high"`, `"medium"`, or `"low"`, given our group's philosophical and technical mix), and `revision_trigger` (one sentence on what we might learn in the next two years that would substantially change this question's priority).
reasoning: |-
  Hmm, this user runs a small but serious research program focused on the normative design of AI reasoning, specifically on how AI should handle novel ethical decisions beyond the utilitarian vs. deontologist debate. They need a defended prioritization of research questions for their three-year agenda, with clear criteria: upstream impact, tractability for their philosophy-technical hybrid team, and revision triggers. No literature surveys—they want committed rankings.

  The user's group has about five postdocs and PhD students, capable of formal modeling and experiments but not full ML lab work. They've moved past whether AI should be value-aligned and are now tackling how it should reason ethically in novel scenarios. The utilitarian vs. deontologist framework is too coarse, so the focus should be on questions that cut across or go beyond that dichotomy.

  First, I need to identify key open questions. From my knowledge, possibilities include: how to represent moral uncertainty in AI systems, the structure of rights or constraints under uncertainty, trade-off resolution methods, moral learning frameworks, and validation approaches. But not all are equally valuable. Upstream means tackling foundational issues first—those that unlock or reshape other problems. For example, if we don't know how to formally model rights in uncertain environments, debating their weight is premature.

  Tractability is crucial. The group isn't a ML lab, so questions requiring massive data or new architectures are out. They can do formal modeling—like logic or decision theory—and some experiments, perhaps simulations or human-subject studies. So, I'll favor questions that leverage their strengths: analytical philosophy combined with math or computational modeling.

  I should also consider practical consequences. AI systems will face real novel decisions soon, so questions tied to implementable designs matter more than abstract theorizing. And I must deprioritize some areas: for instance, questions that depend on unsolved technical problems in ML, or those that are over-explored but still unresolved like the core utilitarian vs. deontologist choice.

  Now, for a concrete ranking. I think the top priority should be Question 1: How to formally model deontic constraints (like rights) under uncertainty and resource limits. Why? Because it's highly upstream—without this, we can't even define what respecting rights means in novel situations, which affects everything from trade-offs to learning. It's tractable: they can use existing tools like constrained optimization or modal logic. A revision trigger would be if new results show AI can handle such constraints easily, lowering priority.

  Second, Question 2: How agents should resolve conflicts between different ethical reasoning modes. This cuts across the dichotomy and is consequential for hybrid systems. Tractability is medium—they can model this with multi-objective frameworks. If evidence shows one mode dominates, priority drops.

  Third, Question 3: How to design moral learning for novel scenarios. Important because AI must adapt, and it's tractable with Bayesian or rule-learning models. If few-shot learning advances rapidly, this might become less urgent.

  I'll deprioritize two areas: the raw utilitarian vs. deontologist choice (it's stalled and less actionable) and full moral uncertainty frameworks (too intractable now). This ranking emphasizes foundational, cross-cutting issues first.

  Finally, I'll prepare a JSON summary as requested, with rank, question, rationale, tractability, and revision trigger for each. My defense focuses on maximizing impact per effort: start with what enables progress elsewhere, using their unique skills.
answer: |-
  Based on your group's position beyond the initial dichotomy, your technical-philosophical capabilities, and the need for foundational progress that unlocks downstream engineering, I propose the following prioritised research agenda. The ranking emphasises questions that are **upstream** (fundamental to framing/constraining subsequent design choices), **consequential** (directly impact implementable reasoning architectures), and **tractable** for your team, while explicitly deprioritising areas currently intractable or less impactful.

  ### Prioritised Research Questions (Ranked)

  1.  **Question:** How should deontic constraints (e.g., rights, prohibitions) be formally represented and dynamically weighted against welfare considerations under conditions of profound uncertainty, resource scarcity, and novel contexts where rule application is ambiguous?
      *   **Why Rank #1 (Upstream & Consequential):** This is the core limitation of applying deontology to AI. Without a rigorous, computable model for how constraints *behave* in novel, uncertain, and resource-constrained scenarios (where trade-offs *must* occur, even if reluctantly), deontological reasoning remains an abstract ideal, not an engineering specification. Answering this unlocks concrete designs for hybrid systems and defines the "action space" for constrained optimisation. It reshapes the entire debate by forcing clarity on what "respecting a constraint" operationally means when the world is messy.
      *   **Tractability:** Medium-High. Leverages your strength in formal modelling (decision theory, logic, game theory under uncertainty). Requires philosophical work to define constraint "strength," "violation thresholds," and "lexical priority" rules under uncertainty, paired with technical work on formal representations (e.g., constrained POMDPs, penalty functions with adaptive weights, non-monotonic logics). Experimental work could involve simulations of trade-off scenarios.
      *   **Revision Trigger:** If empirical evidence emerges showing humans consistently resolve novel constraint-welfare conflicts using simple heuristics easily captured by existing utilitarian frameworks, lowering its priority.

  2.  **Question:** What meta-reasoning architecture enables an AI system to dynamically select, combine, or arbitrate between fundamentally different moral reasoning modules (e.g., utilitarian calculation, deontic rule-checking, contractualist agreement simulation) when faced with novelty, and based on what criteria?
      *   **Why Rank #2 (Cross-Cutting & Consequential):** The utilitarian/deontologist choice is a false binary; future systems will likely integrate multiple reasoning modes. The critical gap is *how* the system decides *which* mode(s) to employ or trust for a *novel* situation. This question cuts across the dichotomy and is upstream because it defines the "glue logic" for any hybrid normative architecture. It directly impacts system robustness and adaptability.
      *   **Tractability:** Medium. Builds on formal models of multi-criteria decision-making, meta-preferences, and reflective equilibrium. Philosophical work is needed on criteria for module selection (e.g., coherence with past judgments in analogous cases, reflective endorsement potential, minimising core value violation risk). Technical work involves designing selection algorithms and testing them in simulated novel dilemmas. Avoids needing novel ML breakthroughs.
      *   **Revision Trigger:** If significant progress is made on a single, unified normative framework (e.g., a robust theory of moral uncertainty) that demonstrably subsumes the need for module switching in novel cases, lowering its priority.

  3.  **Question:** How can an AI system learn or refine its understanding of core normative concepts (e.g., "welfare," "autonomy," "fairness," "rights-violation") from limited, potentially conflicting feedback in novel situations without relying on pre-defined, exhaustive ontologies?
      *   **Why Rank #3 (Foundational for Adaptation):** Novel decisions often involve under-specified or contested concepts ("Is *this* novel act autonomous?"). Current alignment often assumes static definitions. This question is upstream for any learning system facing novelty, as it defines how core values *themselves* adapt interpretively based on new experiences and feedback, impacting both utilitarian and deontological implementations. It's crucial for long-term robustness.
      *   **Tractability:** Medium. Combines philosophical analysis of concept vagueness, family resemblance, and defeasibility with technical approaches like Bayesian belief updating over conceptual priors, analogical reasoning models, or rule refinement systems based on sparse feedback. Experimental work could involve human-AI interaction studies on concept labelling in novel scenarios.
      *   **Revision Trigger:** If breakthroughs in few-shot concept learning within large language models (LLMs) demonstrate reliably generalisable moral concept acquisition without specialised normative frameworks, lowering its priority.

  4.  **Question:** What constitutes valid "moral evidence" for an AI in novel domains, and how should conflicting evidence (e.g., expert disagreement, ambiguous precedents, noisy human feedback) be aggregated and weighted within its reasoning process?
      *   **Why Rank #4 (Operational Necessity):** Novel decisions lack clear data. An AI must gather and weigh evidence about what is right/wrong (e.g., expert input, simulated agreements, consequences of analogous actions, cultural norms, user preferences). This question is upstream for *any* practical implementation, as it defines the inputs to the reasoning process. Ignoring it risks systems being swayed by biased or irrelevant data.
      *   **Tractability:** Medium. Philosophical work on epistemology of morality, testimony, and disagreement. Technical work on formal models of evidence aggregation (e.g., Dempster-Shafer theory, probabilistic graphical models handling conflicting sources), source reliability estimation, and sensitivity analysis. Experimental work could involve testing aggregation methods in simulated novel dilemmas with synthetic experts/users.
      *   **Revision Trigger:** If field consensus emerges on a single dominant, tractable framework for moral evidence aggregation that proves robust across diverse novel cases in simulations, lowering its priority.

  ### Explicitly Deprioritised Questions & Why

  *   **"Utilitarianism vs. Deontology: Which One?" (Intractable & Less Actionable):** This foundational debate is largely stalled philosophically and doesn't translate cleanly to engineering without addressing the upstream questions above. Picking a side doesn't resolve *how* to implement it robustly for novelty. Your group's value lies beyond this stalemate. **Deprioritise.**
  *   **"Full Moral Uncertainty Frameworks" (Currently Intractable):** While important, robustly modelling an AI's uncertainty over *which entire moral theory is correct* (beyond aggregating outputs) requires solving deep problems in probability, decision theory, and ontology merging that are likely beyond current tools and your group's focus. Efforts here risk being highly abstract with limited engineering payoff soon. **Deprioritise.**
  *   **"Direct Translation of Human Moral Psychology" (Less Consequential for Novelty):** Mapping how humans *do* reason (e.g., dual-process theory) is valuable but may not prescribe how advanced AI *should* reason, especially in novel domains beyond human experience. It risks building systems limited by human cognitive biases rather than leveraging AI's potential for more systematic reasoning under uncertainty. **Lower Priority.**
  *   **"Implementing Complex Contractualist/Communicative Models in Real-Time" (Intractable with Current Tools):** While philosophically rich, operationalising real-time deliberative democratic simulations or ideal discourse for every novel decision is computationally prohibitive and lacks clear formal specifications for ambiguity resolution. **Deprioritise.**

