prompt: |-
  I'm a novelist, not a philosopher, but I've been reading around in eliminative materialism — the view that everyday talk of beliefs and desires is really a theory (folk psychology) whose posits a mature neuroscience will replace rather than reduce, the way phlogiston got replaced rather than discovered. My working vocabulary is all character and cause: motivation, want versus need, interiority, free indirect discourse, unreliable narration, the workshop note that 'I don't buy her motivation,' the sense that a scene only works if you can say what a character believes and wants at each beat. Restate eliminative materialism in that vocabulary as faithfully as you can — not as an analogy but as a translation — and then give me the residue report: wich claims translate cleanly into craft terms, which ones you had to bend or fudge, and which ones have no expression at all in the way I think about fiction. And flag the reverse too: is there anything I lean on as a novelist (the way a character 'takes over,' or the fact that I can't draft a scene without positing beliefs and desires) that the eliminativist picture has no room for — and is that a point against the view or just a fact about my job? I especialy want your honest read on whether the untranslatable stuff is a gap in my vocabulary or a sign that the eliminativists are leaning on something they haven't made clear. One formatting rule: continuous prose only, like an email — no headings, no bullet points, no bold, no tables.
