  Now, the residue report. Some claims translate cleanly: the idea that folk psychology is a *theory* maps neatly to "craft toolkit." Novelists already treat motivation and desire as constructs to manipulate plot and character, just like eliminativists see them as theoretical posits. The critique of incoherence ("I don't buy it") also fits—both demand internal consistency, whether in neural causation or narrative logic.  

  But there's bending required. Eliminativism's *total replacement* of beliefs/desires has no direct parallel. Novelists can't ditch motivation; it's oxygen for narrative. Instead, I fudged it by comparing it to how characters "take over," implying subconscious neural processes beyond the author's control—but that's more reduction than elimination. The claim that beliefs/desires *don't exist* is untranslatable; you can't write a scene without them. It's like asking a painter to avoid color.  

  Reverse gaps stand out too. The novelist's reliance on "character takeover" or the necessity of positing beliefs/desires has no room in eliminativism. The philosophy can't explain why these constructs feel indispensable, or why authors experience characters as autonomous. That might be a point against eliminativism—if a tool is pragmatically vital, dismissing it as "false" could be missing its function—or it could just highlight that fiction operates at a different level of explanation.  

  The untranslatable elements—especially the *nonexistence* of intentional states—suggest a gap in eliminativism, not the user's vocabulary. It hasn't clarified how high-level phenomena (like narrative coherence) emerge from neural mechanics, or why folk psychology works so well in practice. The user might sense eliminativists leaning on unspoken intuitions about causation or agency while denying them.  

