prompt: |-
  I co-run a small grantmaking org in the AI safety space, and we keep hitting a pattern where I'm pretty sure evidential cooperation in large worlds is relevant but I have no idea how to actually operationalize it.

  The situation: we're evaluating a proposal, and we know there are a couple other funders also looking at the same thing—either the same team shopped it around, or different teams are independently working on the same problem. The naive approach is "evaluate the marginal impact of our dollar and decide." But the ECL-shaped voice in my head says: if we fund it, we should reason as though other funders who think like us will make the same call, and if we all fund it we get wasteful duplication. But if we all think that way, nobody funds it and the thing dies even though one funder would've been plenty.

  I want a reusable decision procedure—a checklist, a flowchart in words, whatever—that tells me when ECL reasoning should actually override a straightforward cost-effectiveness analysis. It needs to handle: how similar do the other agents have to be for ECL to bite? What if we have private info they don't? What if the world isn't "large" enough in the relevant sense? Where's the line between "just pick up the phone and coordinate causally" and "the evidential link is the only thing doing work here"?

  Run it on two cases: (1) Three funders all got pitched the same $50k academic workshop on alignment benchmarks; any one of us could cover it. (2) We're considering funding a new interpretability research group, but we've heard through the grapevine that two other orgs are thinking the same thing—the field probably needs one such group, not three.

  I especially want the procedure to flag where it's genuinely ECL doing the work vs. where it's just bog-standard coordination dressed up in jargon. If the answer is "you're overthinking this, just email the other funders," I want to know why that's the right answer and when it stops being the right answer.
reasoning: |-
  We are dealing with a situation where multiple funders are considering the same project, and we want to avoid both overfunding (if we all fund) and underfunding (if none funds). The core idea of Evidential Cooperation in Large Worlds (ECL) is that we should condition our decision on the assumption that other similar agents (in this case, funders) are using the same decision procedure. This can lead to a situation where we all decide not to fund because we fear duplication, but then the project doesn't get funded at all. Alternatively, if we all fund, we get duplication.

  The goal is to create a decision procedure that helps us decide when to use ECL reasoning and when to just coordinate directly.

  Key elements to consider:
  1. **Similarity of agents**: How similar are the other funders to us? Do they use the same decision procedure? Are they reasoning about the same things?
  2. **Private information**: Do we have information that others don't? If so, we might be in a better position to fund (or not) because we have unique insight.
  3. **Size of the world**: How many funders are there? Is the world "large" in the sense that the actions of one don't affect the others causally, but only evidentially (via the similarity of decision-making)?
  4. **Cost of coordination**: Sometimes it's easy to coordinate (e.g., pick up the phone), and sometimes it's hard (e.g., many funders, anonymous, etc.). We want to know when coordination is the better approach.

  We'll design a reusable decision procedure in the form of a flowchart in words.

  ---

  **Decision Procedure for Grantmakers Facing Potential Duplication**

  **Step 1: Assess the feasibility of causal coordination**
     - Can you easily communicate and coordinate with the other funders? (e.g., via a quick email or call to avoid duplication)
     - If **yes**, then **coordinate causally** (e.g., talk and decide who funds) and exit the procedure. This is because causal coordination is more robust and avoids the pitfalls of ECL reasoning.
     - If **no**, proceed to Step 2.

  **Step 2: Determine the similarity of the other funders**
     - Are the other funders likely using a similar decision procedure to yours? (e.g., they are also thinking about ECL, or they are similarly mission-aligned and rational)
     - If **no**, then ECL reasoning does not apply because your decision doesn't provide evidence about what they will do. Proceed with straightforward marginal cost-effectiveness analysis (CEA) and fund if the marginal impact is positive.
     - If **yes**, then proceed to Step 3.

  **Step 3: Consider private information**
     - Do you have significant private information that the other funders likely do not have? (e.g., unique expertise about the project, or non-public information about the team)
     - If **yes**, then your decision is less about what others will do and more about your unique knowledge. Proceed with marginal CEA, but adjust for the fact that others might not have this information (so they might not fund even if you don't, leading to underfunding). This might push you to fund if you think the project is good and others might not fund because they lack your information.
     - If **no**, then proceed to Step 4.

  **Step 4: Assess the criticality of funding and the risk of duplication**
     - What is the risk of duplication? (i.e., if multiple funders fund the same project, how wasteful is it? Is the project something that only needs one funder, or can it absorb multiple and still be useful?)
     - How critical is the project? (i.e., if no one funds it, what is the cost?)
     - Consider the following:
          - If the project is **highly critical** (i.e., the cost of underfunding is high) and the risk of duplication is **low** (i.e., even if duplicated, it's still worth it, or the project can use extra funds productively), then fund it (using marginal CEA without ECL adjustment).
          - If the project is **not critical** and the risk of duplication is **high**, then don't fund (to avoid waste).
          - If it's **critical** and the risk of duplication is **high**, then we are in a classic ECL situation. Proceed to Step 5.

  **Step 5: Apply ECL reasoning (for the critical and high duplication risk case)**
     - In ECL, we condition on the fact that other similar funders are making the same decision. We want to avoid the situation where we all decide not to fund because we fear duplication, leading to underfunding. The ECL solution is to use a decision rule that, if adopted by all, would lead to the best outcome.
     - One common approach is the "threshold rule": we fund if we think the project is sufficiently valuable that it would be worth funding even if we had to cover the entire cost (or a share corresponding to the expected number of funders). Alternatively, we can use a randomized strategy (e.g., fund with probability p) to break the symmetry.
     - However, note that in practice, for a small number of funders, we might instead try to coordinate (even if it's harder) because ECL reasoning can be fragile.

     Given the complexity and potential fragility of ECL reasoning, and the fact that we are in a small world (with only a few funders), we might try to coordinate again (if possible, even if it requires more effort) or use a simple heuristic:

     - If the project is critical and the risk of duplication is high, and if there are N similar funders, then we might decide to fund with probability 1/N (so that in expectation, one funder funds). Alternatively, we might decide to fund only if we are the "designated" funder by some arbitrary rule (e.g., we were the first to be approached, or we have the most expertise).

     But note: implementing a randomized strategy in practice might be difficult. In many cases, it might be better to try harder to coordinate.

     **Therefore, in Step 5, we recommend:**
        - If coordination is difficult but not impossible (e.g., you haven't tried very hard yet), then make an effort to coordinate (e.g., reach out to the other funders and set up a call). If coordination fails, then use a randomized strategy or a threshold rule.
        - If coordination is truly impossible (e.g., anonymous funders, or too many), then use the ECL threshold rule: fund if the expected value of the project divided by the expected number of funders (if they all followed the same rule) is still above your cost-effectiveness threshold.

     However, note that in the real world, with a small number of funders, coordination is often possible and preferable.

  ---

  **Applying the procedure to the two cases:**

  **Case 1: Three funders and a $50k academic workshop on alignment benchmarks**

  - Step 1: Coordination is easy (it's a small community, you know the other funders). So we coordinate causally. We pick up the phone and decide that one of us will fund it. No need for ECL.

  **Case 2: Funding a new interpretability research group, with two other orgs considering the same.**

  - Step 1: Coordination is feasible? Probably yes, but let's say we haven't done it yet and we are considering whether to fund without talking. But we should first try to coordinate. However, the problem states we are "considering" and we've heard through the grapevine. So let's assume we haven't coordinated yet.

     We go through the steps:

     - Step 1: We can coordinate? Yes, we can reach out. But for the sake of the exercise, let's assume we don't want to because we don't have a direct relationship? Or we are concerned about revealing our interest? Actually, in the AI safety space, funders often talk. So **coordination is recommended**. But let's see what the procedure says if we skip coordination.

     If we skip coordination (or if we try and fail), then:

     - Step 2: Similarity? The other orgs are likely similar (they are in the same space, thinking about the same problems). So yes.

     - Step 3: Private information? We may have some, but probably not a lot. The grapevine suggests we are all hearing similar things. So no significant private information.

     - Step 4: Criticality and duplication risk:
          - Criticality: The field probably needs one such group, so if no one funds, that's bad. Critical? Yes.
          - Duplication risk: If three groups are funded, that's wasteful (only one needed). So duplication risk is high.

          We are in the critical and high duplication risk case. Proceed to Step 5.

     - Step 5: We are in an ECL situation. But note: there are three funders (including us). We can try to coordinate (even if we skipped Step 1 initially, we can go back and try). If coordination is possible, we should do it and decide who funds. If not, we might use a randomized strategy: we fund with probability 1/3. But in practice, we might not want to randomize. Alternatively, we might use a threshold: we fund if we think the group is at least 3 times as valuable as our cost threshold? But that might be too high.

     However, note that funding a research group is a big commitment and duplication would be very wasteful. Therefore, we should make a strong effort to coordinate. If coordination fails, then we might consider not funding to avoid the risk of duplication (but then we risk underfunding). Alternatively, we might fund and hope that the others don't? But that's not ECL.

     The ECL approach would be to condition on the fact that the others are like us. If we fund, then they likely fund too (because they are similar and the project looks good to us, so it looks good to them). So we expect duplication. Therefore, we should not fund to avoid waste. But then we all do that and no one funds.

     This is the problem. So the ECL solution is to use a symmetric strategy that breaks the tie. The best symmetric strategy might be for each to fund with probability p such that the probability that exactly one funds is maximized? Or we might use a threshold that depends on the perceived value.

     However, given the complexity and the fact that we are only three, we strongly recommend coordination.

     **Conclusion for Case 2**: The procedure flags that we are in a situation where ECL reasoning is relevant, but the best course of action is to coordinate causally. If coordination fails, then we might use a randomized strategy (e.g., flip a coin with 1/3 probability to fund) or a threshold rule (fund only if our estimate of the project's value is more than 3 times the cost). However, note that the threshold rule might be too strict and lead to underfunding. Given the stakes, we should really coordinate.

  ---

  **When is it genuinely ECL?**
  - ECL is genuinely doing the work when:
     - Causal coordination is not feasible (e.g., too many agents, anonymous, or communication is impossible).
     - The agents are similar enough that your decision provides evidence about theirs.
     - The situation is symmetric and the criticality and duplication risk are both high.

  In the two cases above, coordination was feasible and recommended. So the ECL reasoning was not the primary tool because causal coordination was available.

  **When does coordination stop being the right answer?**
  - When coordination costs are too high (e.g., you have to coordinate with hundreds of funders).
  - When the act of coordination itself is problematic (e.g., revealing your interest might lead to adverse effects, or you are in a competitive situation).
  - When the coordination might fail (e.g., you don't trust the other agents to follow through, or you can't reach an agreement).

  In these cases, ECL becomes a fallback.

  **Final Thought**: In practice, for a small grantmaking organization in a relatively small field like AI safety, causal coordination should be the first resort. ECL is a theoretical framework for when coordination is not possible. Therefore, the reusable procedure should start with: "Try to coordinate. If you can, do it. If not, then go through the ECL steps."

  We can summarize the entire procedure in one sentence: **"Coordinate if you can; if not, then use ECL reasoning for similar agents in critical high-duplication-risk situations, and in such cases consider a symmetric strategy (like random assignment) to break the deadlock."**
answer: |-
  Below is a reusable decision procedure for handling situations where Evidential Cooperation in Large Worlds (ECL) might apply to grantmaking decisions. It addresses your core concerns: when ECL should override cost-effectiveness analysis (CEA), how to handle agent similarity, private information, world size, and the coordination-vs-ECL tradeoff. I'll first present the procedure as a flowchart in words, then apply it to your two cases, and finally clarify where ECL is genuinely doing the work.

  ---

  ### **Decision Procedure: When to Use ECL in Grantmaking**
  *(Use this when evaluating proposals where other funders might fund the same thing)*

  1. **Start: Is this a "threshold-dependent" project?**  
     - **Yes**: Proceed if the project is "all-or-nothing" (e.g., one funder is sufficient) or has steeply diminishing returns (e.g., second funder adds little value). *If not, use standard CEA and fund if marginal impact is positive.*  
     - **No**: Use standard CEA. Stop.  

  2. **Can you causally coordinate?**  
     - **Easily possible** (e.g., known funders, low trust barriers, quick call/email): → **Coordinate directly**. Assign roles (e.g., primary funder, backup), share intel, and exit. *ECL isn't needed here.*  
     - **Impossible or costly** (e.g., anonymous funders, competitive dynamics, high effort): → Proceed to Step 3.  
     - **Uncertain**: → Attempt lightweight coordination (e.g., 1-hour email effort). If fails, proceed to Step 3.  

  3. **Are other funders "similar agents"?**  
     - **Definition**: They share your:  
       - Core values (e.g., AI safety priorities).  
       - Decision-making process (e.g., they also consider counterfactual impact).  
       - Information (no major private asymmetries; see Step 4).  
     - **Yes** (≥2 funders are similar): → Proceed to Step 4.  
     - **No** (most others are dissimilar): → **Use standard CEA**. Fund if your marginal impact is positive. Stop.  

  4. **Do you have significant private information?**  
     - **Yes** (e.g., proprietary data, confidential expertise about the team/project): → **Discount ECL**. Favor standard CEA, but adjust for:  
       - *If your intel suggests the project is underrated*: Fund aggressively (others may reject it).  
       - *If your intel suggests overrated*: Avoid funding (others may overfund).  
     - **No** (public info only): → Proceed to Step 5.  

  5. **Is the world "large" and symmetric?**  
     - **Large world**: Many independent funders (>5) or decisions are "anonymous" (your choice doesn't affect others' behavior causally).  
     - **Symmetric**: All funders have similar resources, priorities, and decision rules.  
     - **Yes to both**: → **Use ECL reasoning**. Proceed to Step 6.  
     - **No** (small world, asymmetric): → **Favor coordination**. Re-attempt Step 2 with higher effort. If impossible, use hybrid approach (Step 6).  

  6. **Apply ECL override to CEA**:  
     - Compute the **ECL-adjusted value**:  
       ```
       Let N = Estimated number of "similar" funders (from Step 3).
       Base Value = Counterfactual impact if only you fund.
       ECL-Adjusted Value = Base Value / N
       ```  
     - **Decision rule**:  
       - Fund if: `(ECL-Adjusted Value) > Cost`  
       - Exception: If `N` is highly uncertain, use a **randomized strategy** (e.g., fund with probability `1/N`).  
     - *Why this works*: By conditioning on other funders reasoning identically, this avoids overfunding (if all fund) or underfunding (if none fund).  

  ---

  ### **Why This Works**
  - **ECL’s role**: Steps 5–6 handle true ECL situations—where coordination fails *and* your decision provides evidence about identical agents. This overrides CEA by internalizing the group-level impact.  
  - **Coordination first**: Steps 2–3 explicitly prioritize causal coordination. ECL is a fallback for large/anonymous worlds.  
  - **Boundary clarity**: ECL bites when similarity/largeness force you to "simulate" others' decisions. Coordination handles the rest.  
  - **Safety nets**: Private info (Step 4) and small-world asymmetry (Step 5) prevent over-reliance on ECL.  

  ---

  ### **Case Applications**
  **Case 1: $50k academic workshop on alignment benchmarks**  
  - **Step 1 (Threshold-dependent)**: Yes. One funder suffices; extra funders add little value.  
  - **Step 2 (Coordinate?)**: Easy. Known funders, low trust. → **Coordinate directly**. Email others: "Who covers this?" Result: One funds it.  
  - *Why not ECL?* Coordination is trivial. ECL adds no value.  

  **Case 2: New interpretability research group (potential for three groups)**  
  - **Step 1 (Threshold-dependent)**: Yes. Field likely needs one group; duplicates are wasteful.  
  - **Step 2 (Coordinate?)**: Possible but non-trivial ("grapevine" intel). → Attempt coordination. Email others: "We’re considering this—can we align?"  
    - *If coordination succeeds*: Assign one lead funder. Done.  
    - *If coordination fails*: Proceed.  
  - **Step 3 (Similar agents?)**: Assume yes (e.g., all are AI safety-focused, rational altruists).  
  - **Step 4 (Private info?)**: Assume no. Public info on need for interpretability research.  
  - **Step 5 (Large/symmetric world?)**: **No**. Small world (3 funders), asymmetric (e.g., your org might have unique capacity). → **Re-attempt coordination** with high effort (e.g., shared call).  
    - *If still impossible*: Proceed to ECL (Step 6) as fallback.  
  - **Step 6 (ECL override)**:  
    - `N = 3` (similar funders).  
    - Base Value = Value of one group existing (e.g., $1M impact).  
    - ECL-Adjusted Value = $1M / 3 ≈ $333k.  
    - Cost to you = $X.  
    - **Decision**: Fund only if $333k > $X. If uncertain, randomize (33% chance to fund).  
  - *Why ECL here?* Coordination failed, and evidence suggests others will mirror your reasoning. ECL prevents all-three-fund or none-fund outcomes.  

  ---

  ### **When ECL Is Genuinely Doing the Work vs. Coordination-in-Disguise**
  - **Genuine ECL applies when**:  
    - You’re in a **large/anonymous world** (Step 5), making coordination impossible.  
    - Agents are **truly similar** (Step 3), so your decision is strong evidence of theirs.  
    - You **lack private info** (Step 4), so no asymmetry breaks symmetry.  
    - *Example*: Funding a public good with 100+ anonymous donors who share your values.  

  - **Coordination is better when**:  
    - Few funders are involved (<5).  
    - Trust/communication is feasible (Step 2).  
    - Asymmetries exist (e.g., private info, capacity differences).  
    - *Example*: Your Case 1 (workshop)—coordination is easy and superior.  

  - **Key takeaway**: ECL is a **second-best solution for failures of causal coordination**. Use it only when:  
    - Coordination is prohibitively costly.  
    - The world is large/symmetric.  
    - Your decision affects others evidentially (not causally).  

  In your work, default to coordination. Reserve ECL for edge cases like large-scale, anonymous funding where your grant is a "vote" in a sea of similar agents. For most small-scale AI safety grants, a 1-hour email effort will outperform ECL gymnastics.
