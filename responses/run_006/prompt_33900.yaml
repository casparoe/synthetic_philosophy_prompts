answer: |-
  1. The disagreement is substantive, centering on conflicting conceptions of rationality: one prioritizes formal coherence (avoiding demonstrable inconsistency/exploitation) as constitutive of rationality, while the other prioritizes instrumental effectiveness (achieving ends) and questions whether formal proofs capture real-world reasoning vulnerabilities.
  2. The two sides implicitly answer different questions under the umbrella of "justifying EU maximization": one asks "What ensures consistent, unexploitable preferences?", the other asks "What makes an agent reliably successful at achieving their goals?".
  3. A core point of contention is the normative weight given to highly stylized, sequential choice scenarios (like money pumps): proponents see them as revealing fundamental flaws, while critics see them as artificial traps irrelevant to competent, foresighted agents acting in realistic contexts.
  4. Progress requires addressing the underyling conflict over the "ground" of rationality: either embedding the formalism within a richer account of instrumental success (e.g., incorporating resource constraints, learning, or cognitive limitations) or explicitly defending formal coherence as the primary normative standard.
  5. The stalemate persists partly due to a lack of decisive empirical evidence or compelling new formal arguments that bridge the gap; progress might involve demonstrating concrete, non-artificial failures of non-EU preferences or developing alternative, empirically validated models of successful decision-making.
