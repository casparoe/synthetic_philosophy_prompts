prompt: |-
  I'm giving a talk at a philosophy of mind workshop next month, and I'm defending a pretty specific claim: that Dennett's multiple drafts model isn't just a negative thesis (there's no Cartesian theater) but that it makes a positive empirical prediction — namely, that if you look for a single moment or locus where consciousness "comes together" in the brain, you'll keep finding temporal smearing and distributed processing, and that this pattern is actually a feature of conscious experience, not a bug in our measurement methods. My audience is a mix: about half are philosophers of mind who lean toward illusionism or eliminativism about consciousness (they basically like Dennett but think he didn't go far enough), and the other half are neuroscientists who work on consciousness and mostly use integrated information theory or global workspace theory frameworks. The neuroscientists in particular tend to think the multiple drafts model is just hand-waving — not a real theory you can test, more like a vibe.

  I need a Q&A prep sheet. Give me the eight or so objections I'll actually get from this audience, ordered by how much damage they'd do to my argument, each phrased the way that particular subgroup would phrase it. For each objection, give me a two-minute reply and an honest note on where the reply is weakest. Include the question I'm really hoping nobody asks. And don't just lay out the options for me — take a definite stance on what I should concede, what I should hold firm on, and why. I want a committed prep sheet, not a menu of possibilities.
