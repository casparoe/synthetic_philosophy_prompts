  First, I need to recall the core concepts. The units of selection debate centers on what entities are directly acted upon by natural selection. The user is likely preparing for critical reading of papers, so they need a clear framework to test each theory against. Their mention of selfish genetic elements and cancer suggests they're interested in conflicts between different levels of selection, like gene vs. organism or cell vs. organism.

  The user explicitly asked for non-negotiable requirements versus camp preferences. That means I have to distinguish universal criteria from those specific to certain schools of thought. For example, accommodating selfish genetic elements is probably non-negotiable because they're clear examples of selection at the gene level. But how multilevel selection theory handles them might be a point of contention.

  The test cases are crucial. Segregation distorters, like the t-allele in mice, show selection favoring genes that harm the organism. Transposable elements replicate independently, causing mutations. Cancer illustrates selection within an organism, where mutant cells outcompete healthy ones. Eusocial colonies, like ant colonies, challenge whether selection acts on the colony or individual insects. Species-level traits, such as extinction rates, push the debate to macroevolutionary scales.

  Key distinctions: Replicators (entities that copy themselves), vehicles (entities that interact with the environment), and interactors (a synonym for vehicles in some frameworks). Selection of a trait (what's selected) vs. for it (the reason). Levels vs. units: levels are where selection acts (gene, cell, etc.), units are the entities at those levels. Genuine group adaptations require group-level selection, not just side effects of individual traits.

  Formal decompositions, like the Price equation, break selection into within-group and between-group components. This is essential for quantifying selection at different levels. Major transitions in individuality, like the evolution of multicellularity, involve shifts in the dominant unit of selection.

  I need to list requirements. Start with non-negotiables: Accommodate selfish genetic elements, transposable elements, cancer, eusociality, and species-level traits. Distinguish replicators and interactors since selfish genes are replicators without being interactors. Handle selection of vs. for a trait to explain cases like sickle cell anemia. Keep levels and units distinct to avoid confusion. Recognize genuine group adaptations versus statistical artifacts. Integrate formal decompositions and major transitions.

  For camp preferences, genic selectionism might downplay group adaptations, while multilevel selection emphasizes them. The replicator/interactor framework focuses on the roles rather than levels.

  Conflicts: Accommodating gene-level selection and higher-level adaptations might be tricky. For example, genic selectionism reduces group traits to gene-level actions, which might not satisfy the requirement for genuine group adaptations. Multilevel selection might struggle with selfish elements if it overemphasizes higher levels.

  Self-criticism: The requirement to accommodate species-level selection might be the first to demote. The argument against it is that species sorting isn't Darwinian selection but drift or constraints. If empirical studies show species selection driving adaptations, like prolonged stasis, it would strengthen the requirement. Adding a requirement for emergent fitness at higher levels could be necessary if new transitions are observed.
answer: |-
  Here is a precise specification for evaluating theories of the units of selection, derived from core phenomena, necessary distinctions, formal constraints, and critical test cases. Requirements are categorized as **Non-Negotiable** (NN - essential for any empirically adequate theory) or **Camp Preference** (CP - reflects specific theoretical commitments). Conflicts and a scorecard follow.

  ### I. Non-Negotiable Requirements (NN)
  1.  **Accommodate Selfish Genetic Elements (SGEs):** The theory must explain how selection favors genetic elements (e.g., segregation distorters, B-chromosomes) that increase their own transmission *despite* reducing organismal fitness (e.g., t-allele in mice causing sterility in homozygotes). *Forced by:* The existence of traits beneficial to a gene but detrimental to the organism/group.
  2.  **Accommodate Sub-Organismal Lineages:** The theory must account for selection acting within organisms, where cellular lineages compete (e.g., cancer metastasis, cheater mitochondria in cytonuclear conflicts). *Forced by:* Somatic evolution and intragenomic conflict.
  3.  **Distinguish Selection *of* vs. Selection *for*:** The theory must differentiate between the entity/trait that is *correlated* with fitness differences (selection *of*) and the property *causing* the fitness difference (selection *for*). *Forced by:* Spurious correlations (e.g., selection *of* moth color due to industrial melanism is selection *for* camouflage, not the color itself as an intrinsic property). (Hull/Sober distinction)
  4.  **Handle Multi-Level Conflicts & Synergies:** The theory must explain cases where selection at one level opposes (e.g., SGEs vs. organisms) or aligns with (e.g., sterile workers in eusocial insects) selection at other levels. *Forced by:* The fundamental hierarchical organization of life and conflicts like cancer/SGEs.
  5.  **Integrate Formal Decomposition:** The theory must be consistent with or incorporate formal decompositions of evolutionary change (e.g., Price Equation, Contextual Analysis) that partition selection into *within-group* and *between-group* components across levels. *Forced by:* The need for quantitative rigor and isolating causal contributions.
  6.  **Accommodate Major Transitions:** The theory must explain how new units of selection (e.g., chromosomes, cells, eusocial colonies) arise through the suppression of lower-level conflict and evolution of higher-level individuality (e.g., uniparental mtDNA inheritance, policing in insect colonies). *Forced by:* The evolutionary origin of complexity and new levels of organization.

  ### II. Distinctions That Must Be Maintained (NN)
  7.  **Replicators ≠ Interactors/Vehicles:** The theory must distinguish entities *differentially copied* (replicators - genes, memes) from entities whose *interaction with the environment* causes differential replication (interactors/vehicles - organisms, groups). *Forced by:* SGEs (replicators selected *despite* interactor detriment) and group selection (interactor-level fitness). (Hull/Dawkins distinction)
  8.  **Levels of Selection vs. Units of Selection:** The theory must distinguish the *level* at which fitness differences causally operate (e.g., gene, cell, organism, group) from the specific *entity* acting as the unit (e.g., *this* gene, *this* cell lineage, *this* colony). *Forced by:* Precision in causal claims (e.g., selection acts at the *level* of the gene *on the unit* "t-allele").
  9.  **Genuine Group Adaptation vs. Statistical Side Effect:** The theory must distinguish traits evolved because they benefit the group *per se* via group selection (e.g., reduced virulence in phages, colony-level division of labor) from traits that are merely statistical byproducts of individual selection (e.g., "herd immunity" arising purely from individual immune responses). *Forced by:* Avoiding the "averaging fallacy" and identifying true group-level functions.

  ### III. Camp Preference Requirements (CP)
  10. **Accommodate Species-Level Selection (CP - MLS):** The theory *should* explain traits like broad geographic range or high speciation rate as potential adaptations arising from species-level selection (differential speciation/extinction). *Preferred by:* Multilevel Selection (MLS) theorists. *Forced by:* Paleobiological patterns (e.g., punctuated equilibria, species selection in Volutospina snails).
  11. **Parsimony/Gene-Centrism (CP - Genic):** Explanations *should* reduce higher-level phenomena to the actions of genes where possible, minimizing appeal to higher-level selection. *Preferred by:* Genic Selectionists. *Forced by:* Success of gene-centric models in population genetics and explaining conflicts.
  12. **Functional Integration Defines Units (CP - Interactor Focus):** The *unit of selection* (interactor) *should* be defined by functional integration and alignment of fitness interests (e.g., organism due to germ-soma separation). *Preferred by:* Mayr, Gould, some MLS theorists. *Forced by:* Major transitions and the cohesion of higher-level individuals.

  ### IV. Key Test Cases & How They Force Requirements
  *   **Segregation Distorters:** Force NN1, NN4, NN7 (gene as replicator/interactor vs. organism as interactor).
  *   **Transposable Elements:** Force NN1, NN4 (parasitic replicators vs. host fitness).
  *   **Cancer:** Force NN2, NN4, NN6 (within-organism lineage selection, conflict with organism).
  *   **Eusocial Colonies:** Force NN4, NN6, NN9 (potential group adaptation vs. kin selection debate, major transition).
  *   **Species-Level Traits:** Force CP10, NN9 (is geographic range an adaptation or side-effect?).

  ### V. Conflicts Between Requirements
  *   **NN1 (SGEs) & CP12 (Functional Integration):** Genic selection easily handles SGEs (NN1) but struggles with CP12's requirement for functional integration defining "true" units. MLS/Interactor theories using CP12 risk downplaying SGEs or seeing them as pathological exceptions.
  *   **CP10 (Species Selection) & CP11 (Parsimony/Gene-Centrism):** Genic selectionists (CP11) argue species "selection" is usually drift or a side-effect of organismal traits. MLS proponents (CP10) argue it's a distinct level requiring its own explanatory framework. This is a core philosophical divide.
  *   **NN6 (Major Transitions) & CP11 (Gene-Centrism):** Explaining the *origin* of new units (NN6) often requires acknowledging emergent fitness at higher levels during transitions, challenging strict gene-centrism (CP11).

  ### VI. Scorecard of Major Frameworks
  *(NN = Satisfies Non-Negotiable, CP = Satisfies Camp Preference, ~ = Partial/Ambiguous, X = Fails)*

  | Requirement                     | Genic Selectionism                  | Multilevel Selection (MLS)         | Replicator/Interactor Framework    |
  | :------------------------------ | :---------------------------------- | :--------------------------------- | :--------------------------------- |
  | **NN1: SGEs**                   | **NN** (Core strength)              | ~ (Often subsumes into kin/genetic) | **NN** (Replicator focus)          |
  | **NN2: Sub-Organismal**         | **NN** (Treats as lineages)         | **NN** (Recognizes levels)         | **NN** (Replicators/Interactors)   |
  | **NN3: Of/For Distinction**     | ~ (Focuses on "for" replicators)    | **NN** (Explicit in trait focus)   | **NN** (Core to definitions)       |
  | **NN4: Multi-Level Conflicts**  | **NN** (Via gene's-eye view)        | **NN** (Via partitioning)          | **NN** (Defines conflict levels)   |
  | **NN5: Formal Decomposition**   | ~ (Uses models, less emphasis)      | **NN** (Core methodology)          | **CP** (Compatible, not inherent)  |
  | **NN6: Major Transitions**      | ~ (Explains via gene interests)     | **NN** (Core focus)                | **NN** (Framework explains shifts) |
  | **NN7: Replicator≠Interactor**  | **X** (Conflates gene as both)      | **NN** (Usually maintains)         | **NN** (Core distinction)          |
  | **NN8: Level vs. Unit**         | **X** (Level=gene)                  | **NN** (Explicitly hierarchical)   | **NN** (Clear distinction)         |
  | **NN9: Genuine Group Adapt.**   | **X** (Reduces to individual/gene) | **NN** (Seeks evidence for it)     | **NN** (Requires interactor level) |
  | **CP10: Species Selection**     | **X** (Rejects as causal level)     | **CP** (Embraces)                  | **CP** (Possible if interactor)    |
  | **CP11: Parsimony/Gene-Centrism** | **CP** (Core tenet)                 | **X** (Embraces higher levels)     | ~ (Focuses on roles, not reduction)|
  | **CP12: Functional Integration**| **X** (Not defining)                | **CP** (Often used)                | **CP** (Defines "interactor")      |

  ### VII. Self-Criticism & Potential Revisions
  *   **First Requirement to Demote:** **CP10 (Accommodate Species Selection)**. While fascinating, the empirical case for *bona fide* species-level *adaptation* (vs. sorting) is weakest. Many patterns can be explained by organism-level traits + drift/constraints.
      *   **What Could Change My Mind:** Strong evidence that specific, complex traits (beyond simple size/range) evolved *primarily because* they increased speciation rates or decreased extinction rates *in a way decoupled from organismal fitness* (e.g., a trait costly to individuals but beneficial to species persistence identified via phylogenetic comparative methods).
  *   **Requirement Most Likely to Need Adding:** **Emergent Fitness at Higher Levels.** The specification focuses on existing biological levels. A new requirement could be: "The theory must account for the *emergence* of fitness as a property of new collective entities during major transitions (e.g., how does a group acquire heritable fitness variation distinct from its parts?)."
      *   **What Would Force This:** Theoretical work demonstrating that existing decompositions fail to capture the origin of higher-level fitness without new primitives, or empirical discovery of a novel transition in progress (e.g., synthetic multicellular systems evolving de novo reproductive specialization with fitness decoupled from cell fitness).
  *   **Ambiguity in Distinctions:** The **Replicator/Interactor (NN7)** distinction, while crucial, can be blurry (e.g., are prions replicators? Are chromosomes interactors?). The specification relies on paradigmatic cases (genes, organisms) but the boundaries need careful handling.

  This specification provides a rigorous testing ground. A strong theory will satisfy all NN requirements, handle the test cases cleanly, maintain the key distinctions, integrate with formalism, and offer insights into major transitions. Camp preferences highlight genuine philosophical and explanatory differences that likely cannot be fully resolved empirically alone. Use this list to ask: "How does *this* theory handle segregation distorters? Does it conflate replicators and interactors? Can it formally decompose group selection? Does it reduce group adaptation or take it seriously?"
