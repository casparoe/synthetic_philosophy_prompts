answer: |-
  ## Twin Chambers of the Tongue

  **First Speaker (Believes falsehood, states falsehood - No Lie):**
  "The moon is made of cold, green cheese, I swear!"
  He points aloft, his eager face aglow.
  "Those craters mark the holes where mice dare go!
  No finer truth beneath the evening air!"

  **Second Speaker (Believes falsehood, states truth - A Lie):**
  "The storm approaches, see the gulls take flight,"
  She murmurs, watching ships strain at the chain.
  "Seek harbour now, avoid the coming pain."
  (She knows it veers; she wills them towards the night.)

  **Volta**
  The first sees cheese—though rock fills space instead;
  His mind holds only wonder, strange but bright.
  *This* heart, though wrong, beats as a single thread.
  But *hers*: a poisoned well, a hidden blight.
  She *sees* the west wind push the clouds aside,
  Yet *wills* the drowned to sink within the tide.
  One heart deceived; the other, split to hide.

  ---

  **Notes on Execution:**

  1.  **Structural Duplicity:** The octave presents two distinct voices/speakers, each occupying a quatrain (ABBA ABBA), embodying the "double heart" outwardly through their contrasting utterances and intentions.
  2.  **Speaker 1 (Octave Q1):** States a falsehood (moon=cheese) with absolute, earnest belief ("I swear!", "No finer truth"). This aligns with Augustine: *"He utters what he thinks; he thinks what he utters."* (De mendacio 3.3). His error is intellectual, not moral.
  3.  **Speaker 2 (Octave Q2):** States a truth (storm approaches, gulls fly, harbour advice) but *believes* it false (knows the storm veers away) and *intends* to deceive (wills ships towards danger). This is the lie: *"He utters what he thinks not; he thinks not what he utters."* (Ibid).
  4.  **Volta & Sestet (CDECDE):** The turn explicitly shifts focus inward ("The first sees...", "His mind holds...", "But *hers*...") to expose the hidden thought versus spoken word. The CDECDE scheme formally departs from the octave's ABBA ABBA, mirroring the shift to internal duplicity.
  5.  **Moral Weight:** The sestet contrasts the states:
      *   **Speaker 1:** "His mind holds only wonder, strange but bright" – single intention, though mistaken. "*This* heart... beats as a single thread."
      *   **Speaker 2:** "*hers*: a poisoned well, a hidden blight" – the divided will. The final couplet crystallizes the Augustinian distinction: "She *sees*... Yet *wills*..." (knowledge vs. deceptive intent) and the concluding line: "One heart deceived; the other, split to hide." The weight falls entirely on the *division* and *intent* within the second speaker.
  6.  **Augustinian Recognition:** The poem hinges on the precise distinction Augustine makes: the moral fault lies not in the factual error of the statement, but in the speaker's knowledge and *will to deceive*. The scholar will recognize the core argument of *De mendacio* rendered poetically.
  7.  **Standalone Poem:** The imagery (cheese moon, storm, gulls, ships, harbour, poisoned well, tide) creates a vivid scene. The contrast between the earnest (if foolish) first speaker and the calculating, dangerous second speaker is clear without needing the treatise. The sestet's introspective revelation provides the necessary moral framework.
