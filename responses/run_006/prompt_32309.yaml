  ### Constructed Thought Experiment: The Rare Medical Breakthrough

  **Scenario:**  
  You are a public health official deciding whether to fund a small-scale pilot study for a potential treatment for a rare but devastating disease. The disease affects approximately 1 in 10,000 people in the population, and without treatment, it is always fatal. The pilot study costs $100,000 to conduct. If successful (which would require a specific genetic marker to be present and responsive, something that can only be confirmed through the study), the treatment would be developed and rolled out, saving all current and future victims of the disease. Based on detailed epidemiological data and genetic databases, the probability of success is precisely calculable at 1 in 1,000. The payoff is saving 100 lives, as there are exactly 100 current victims, and the treatment would prevent all future cases (but for simplicity, we consider only the immediate 100 lives saved, as future cases are negligible in this timeframe). The cost is funded from a limited health budget, so the $100,000 could alternatively save 10 lives through conventional treatments (e.g., malaria bed nets, which cost $10,000 per life saved on average). The decision must be made now, with no opportunity for repeated trials.

  - **Cost:** $100,000 (utility loss equivalent to 10 lives, since $10,000 per life saved).
  - **Probability of success (p):** 1/1,000 = 0.001 (well-defined from genetic frequency data, not based on trust).
  - **Payoff if successful:** 100 lives saved (concrete health benefit).
  - **Bounded utility cap:** To block Pascal's mugging, we set a cap at the utility of saving 100 lives (a high but finite maximum, e.g., because human empathy or societal resources diminish beyond this scale). This cap is plausible—saving 101 lives isn't infinitely better than saving 100 to a typical decision-maker—but it is low enough that in the original Pascal's mugging (e.g., a stranger claiming to save 3↑↑↑↑3 lives for $5), the bounded utility calculation would recommend against paying due to the tiny probability.

  **Intuition Check:**  
  - Expected-utility (unbounded) recommends paying the cost because the expected lives saved (0.001 × 100 = 0.1) outweighs the cost of 10 lives in utility terms (0.1 lives saved net vs. 10 spent, but see calculations below). Intuitively, this feels correct: a 0.1% chance to save 100 lives is worth a $100,000 gamble when the alternative use of funds saves only 10 lives directly. It's like buying a lottery ticket with positive expected value—the small cost for a tiny chance of a large health gain seems rational.
  - Bounded utility recommends against paying because the utility of saving 100 lives is capped. With the cap at 100 lives, the potential gain is truncated, making the expected utility negative. Intuitively, this feels wrong: ignoring the 100-life payoff due to the cap means dismissing a real, high-stakes opportunity that could dramatically reduce suffering. It feels overly cautious, like refusing to invest in a promising medical trial because of arbitrary limits on hope.

