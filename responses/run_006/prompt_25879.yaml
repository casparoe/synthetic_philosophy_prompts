  I'll start ranking. Reasons-based and dual deontology seem strongest because they directly redefine obligation structures. Virtue ethics shifts focus, which sidesteps Dave's point but doesn't engage it head-on. Satisficing is tricky—it's elegant but might collapse under "why not best?" Cost-based is weak because Dave would argue cost doesn't negate obligation if the act is better. 

