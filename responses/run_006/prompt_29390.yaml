answer: |-
  Here's the Mencius vs. Xunzi debate translated into your developmental psychology framework, followed by the residue report and analysis of the empirical core:

  **The Debate in Your Vocabulary:**

  1.  **Mencius (Mengzi):**
      *   **Starting-State Capacities:** Humans are born with innate, domain-specific capacities ("sprouts" - *duan*) for core prosocial/moral tendencies (e.g., compassion, shame, deference, sense of right/wrong). These are **innate constraints** predisposing us towards prosociality.
      *   **Default Developmental Trajectory:** The inherent developmental pathway, if provided with minimally adequate environmental support (nurturing, basic security), is towards the expression and maturation of these prosocial tendencies. Virtuous behavior is the **canalized** outcome under normative conditions.
      *   **Role of Environment:** Environment acts primarily as a support structure. Nurturing, education (especially moral exemplars), and ritual (*li*) provide the necessary **environmental scaffolding** to strengthen, refine, and channel these innate sprouts towards their mature, culturally appropriate **phenotype**. Deprivation or extreme negativity can stunt or distort this growth, but the underlying capacity remains.
      *   **Prepared Learning:** Humans are **prepared to learn** prosocial norms, moral reasoning, and ritual behaviors because they resonate with and build upon the existing innate sprouts. Learning virtue feels "natural" when the environment aligns with this predisposition.
      *   **Mature Phenotype:** Fully developed virtue is the realization of the innate potential present in the starting state, shaped and expressed through cultural forms.
      *   **Analogy:** Think of the "sprouts" as domain-relevant **prepared learning mechanisms** for prosociality, activated by relevant cues (like distress), and whose development is **canalized** towards prosocial outcomes with basic environmental input. The child-at-the-well reaction is an early, automatic expression of this innate constraint.

  2.  **Xunzi:**
      *   **Starting-State Capacities:** Humans are born with powerful, innate self-oriented drives and desires (for survival, gratification, status, etc.) – the raw material of human nature (*xing*). There are **no innate domain-specific constraints** predisposing us towards prosociality or morality. The core drives are fundamentally **recalcitrant** to social order.
      *   **Default Developmental Trajectory:** The inherent, uncultivated developmental pathway leads inevitably to conflict, competition, and disorder as individuals seek unrestrained satisfaction of their desires. The "natural" endpoint without intervention is social chaos, not virtue.
      *   **Role of Environment (Crucial):** Virtue is entirely **artifice** (*wei*). It is imposed *from the outside* through deliberate, intensive, and often effortful cultural engineering. The primary mechanisms are **ritual (*li*)** and **righteousness (*yi*)**, transmitted via teachers, sages, and cultural traditions. This is **environmental scaffolding** of the highest order, actively suppressing the default trajectory and constructing a new, socially functional **phenotype**.
      *   **Prepared Learning:** Humans may possess general learning capacities, but they are **not specifically prepared** to learn prosociality or morality. Learning virtue feels *unnatural* initially; it requires overcoming innate predispositions through conscious effort and habituation. It's the opposite of prepared learning for this domain.
      *   **Mature Phenotype:** Virtue is a constructed **phenotype** radically different from the starting state. It's a cultural achievement, not a biological unfolding. It represents the successful **overriding** of innate defaults by external structures.
      *   **Analogy:** Think of the innate drives as powerful, domain-general motivational systems lacking prosocial constraints. The **default trajectory** is anti-social. Virtue requires a massive, sustained **environmental intervention** (ritual as social technology) to **canalize** development *away* from the innate default and *towards* a socially constructed ideal. It's like intensive behavioral shaping against a strong innate bias.

  **Residue Report: What Doesn't Translate Cleanly**

  1.  **"Nature" (Xing) Itself:**
      *   **Mencius:** Xing is inherently good *potential* – the sprouts *are* the moral nature. It's teleological; the end (virtue) is inherent in the beginning (sprouts). Your "starting-state capacities" captures the potential aspect well, but the teleology ("this *will* grow into virtue with minimal support") is stronger than typical developmental models.
      *   **Xunzi:** Xing is the raw, uncultivated state – desires and emotions *before* any moral shaping. Calling it "bad" is less about inherent sin and more about its fundamental *incompatibility* with social order *as it exists*. Your "recalcitrant starting-state capacities" captures the resistance, but not necessarily the strong normative judgment ("bad").
      *   **Distortion Risk:** Mapping both to "starting-state capacities" slightly blunts the radical difference in how they conceptualize *what the starting state fundamentally is* (moral potential vs. asocial raw material).

  2.  **Qi (Vital Energy/Breath - Mencius):** Mencius uses *qi* to explain the physical/psychological force behind moral feelings and resolve (e.g., "flood-like *qi*"). This holistic concept of a moral-psycho-physical force has no direct parallel in modern cognitive/developmental science. Your terms capture the cognitive/behavioral level but miss this embodied, vitalistic aspect important to Mencius's mechanism.

  3.  **The Role of Ritual (Li):**
      *   **Mencius:** Ritual refines and expresses innate tendencies. It's scaffolded learning aligning with prepared capacities. Translates reasonably well to environmental scaffolding/cultural learning.
      *   **Xunzi:** Ritual is *constitutive*. It doesn't just shape; it *creates* the moral mind and social order *ex nihilo* from the raw material. It's less "scaffolding" and more "mold" or even "prosthetic." The emphasis on ritual as *the* primary technology for moral transformation is more central and potent in Xunzi than typical modern concepts of "environmental input" or "learning."

  4.  **Teleology & Sagehood:**
      *   Both philosophers see the goal as becoming a Sage. Mencius sees this as the natural flowering of innate potential. Xunzi sees it as the pinnacle of artifice. This strong normative endpoint ("Sagehood is the telos of human development") isn't part of empirical developmental psychology's descriptive framework. Your "mature phenotype" captures the endpoint descriptively but misses the prescriptive, idealized nature of "Sage."

  5.  **Effort & "Heart-Mind" (Xin):** Both emphasize conscious effort and the role of the "heart-mind" (*xin*) – the seat of thought, feeling, and intention. While modern psychology addresses executive function and self-regulation, the specific Confucian focus on deliberate cultivation/purification of *xin* as the *locus* of moral struggle/achievement doesn't have a single perfect equivalent.

  **The Core Empirical Question: Is There a Disagreement Science Could Address?**

  **Yes, but with crucial caveats due to differing definitions of *xing*.**

  1.  **The Testable Core:** The fundamental empirical disagreement lies in the **initial directionality of the default developmental trajectory for prosociality under minimally adequate conditions.**
      *   **Mencius's Prediction:** Infants and young children, in non-deprived environments, should display **early, spontaneous, cross-culturally robust precursors** to core prosocial behaviors (helping, comforting, sharing, aversion to unfairness, perhaps early forms of "white lies" to spare feelings) *without explicit training*. These behaviors should emerge readily, supported by **prepared learning mechanisms** sensitive to relevant social cues (distress, need, inequity). Evidence for inequity aversion in young children or spontaneous helping in toddlers would support this.
      *   **Xunzi's Prediction:** Early behavior in non-deprived environments should be dominated by **self-oriented desires** (possessiveness, competition for resources, self-comfort seeking). Any prosociality observed would be either:
          *   Simple mimicry or conditioned responses.
          *   Strategically self-interested (e.g., helping to gain reward/avoid punishment).
          *   The *very earliest results* of pervasive cultural conditioning already present in the infant's environment (e.g., parental reactions shaping behavior from day one). Genuine, disinterested prosociality or aversion to unfairness *against one's own favor* should be absent or very rare early on and emerge only later with explicit moral instruction/internalization of cultural norms.

  2.  **The Definitional Caveat (Dissolving the Conflict?):** The translation *does* highlight that they define *xing* differently:
      *   Mencius defines *xing* as the *inherent potential for goodness*.
      *   Xunzi defines *xing* as the *raw, uncultivated state*.
      *   **Does this dissolve the conflict? Partially, but not entirely.** While they are arguing past each other *semantically* about what "nature" means, their **descriptions of observable, early human behavior and its developmental trajectory under normative conditions are genuinely opposed.** Mencius *does* claim observable early prosocial tendencies exist spontaneously; Xunzi *does* claim they do not and that early behavior is fundamentally self-oriented. *This is an empirical claim about development.*

  **Conclusion for Your Field:**

  *   There **is** a genuine, empirically addressable core: **Does spontaneous, untrained prosociality (helping, comforting, sharing, inequity aversion) emerge readily in early development under normative conditions, suggesting innate constraints/prepared learning (Mencius)? Or is early behavior fundamentally self-oriented, with prosociality being a later product of intensive cultural shaping overriding innate defaults (Xunzi)?**
  *   Modern developmental psychology provides strong evidence favoring Mencius on this specific empirical point: early spontaneous helping, empathy-driven comforting, and sensitivity to fairness emerge remarkably early, cross-culturally, without explicit training. However, Xunzi's emphasis on the massive role of culture in shaping the *specifics* of moral reasoning, the *channels* of prosocial behavior, and the need for effortful self-cultivation to achieve complex moral judgments remains highly relevant.
  *   The residue (teleology, *qi*, the constitutive power of ritual in Xunzi's sense) represents philosophical/metaphysical commitments beyond the scope of empirical adjudication.
  *   **In essence:** Your field largely supports Mencius's claim about *starting-state capacities* and the *default trajectory* leaning towards prosociality, while acknowledging Xunzi's profound insight into the power of culture and effort required to shape the *mature phenotype* into its complex, culturally embedded forms. The debate highlights the interplay between innate predispositions and the essential, transformative role of the social environment.
