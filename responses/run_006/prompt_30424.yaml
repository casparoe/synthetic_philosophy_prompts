prompt: |-
  I work on the safety team at an AI lab. We review research proposals for new training setups and architectures, and one of our evaluation criteria is whether the system implements factored cognition — the idea that sophisticated reasoning can be produced by composing many short, bounded-context cognitive operations rather than relying on a single long sequential process. We treat HCH (Humans Consulting HCH) as our reference idealization for what factored cognition looks like in the limit. I need a reusable evaluation procedure my team can apply to a proposal: a set of questions to ask in order, what counts as a passing answer to each, where the procedure stops and flags a proposal as not satisfying factored cognition, and where it hands off to judgment because the idealization itself doesn't settle the matter. The procedure should be usable by someone who understands the broad idea but hasn't worked through the formal details — no more than a page, something we can run in a thirty-minute meeting. Then apply it to two proposals: (1) a chain-of-thought system where the model generates a long reasoning trace before answering, and (2) a debate setup where two models cross-examine each other's claims with a human judge. Flag the cases the procedure cannot decide and say what additional information would be needed. Please begin with the procedure itself, with no preface or commentary.
reasoning: |-
  We are creating a reusable evaluation procedure for factored cognition. The procedure is a sequence of questions. For each question, we note what counts as a passing answer and when to stop (flagging as not satisfying factored cognition) or hand off to judgment.

  **Factored Cognition Evaluation Procedure**

  1. **Does the system explicitly break down the reasoning process into multiple, distinct steps?**
     - *Passing Answer:* Yes, the system design includes multiple, distinct steps (or operations) that are intended to be performed in sequence or in a structured manner. Each step is bounded in context (i.e., limited in the amount of information it considers at once).
     - *Stop and Flag:* If the answer is no, then the system does not satisfy factored cognition. Flag as "Not Satisfying".
     - *Hand Off to Judgment:* If the answer is ambiguous, or the steps are not clearly distinct or bounded, hand off to judgment with the note: "Unclear decomposition. Need more details on step boundaries and context limits."

  2. **Are the steps (or operations) bounded in context? Specifically, does each step receive only a limited, well-defined set of inputs and produce a well-defined output without relying on an unbounded amount of context?**
     - *Passing Answer:* Yes, each step has clearly defined inputs and outputs, and the context (information available) for each step is limited and well-specified (e.g., by a fixed context window, explicit input/output schema, or a structured communication protocol).
     - *Stop and Flag:* If the answer is no (i.e., steps have unbounded context or the inputs/outputs are not well-defined), then stop and flag as "Not Satisfying".
     - *Hand Off to Judgment:* If the boundedness is achieved but in a non-standard way (e.g., through a learned compression mechanism) or if the context bounds are very large (but fixed) and there is concern about the practical limits, hand off to judgment with the note: "Context bounds present but may be too large. Evaluate whether the bounds are acceptable for factored cognition."

  3. **Does the system compose the steps in a way that the output of one step can become the input to another? (Compositionality)**
     - *Passing Answer:* Yes, the system explicitly defines how the outputs of one step are used as inputs to subsequent steps (or to a final aggregation step). The composition is structured (e.g., via a predefined workflow, a program, or a recursive process).
     - *Stop and Flag:* If the answer is no (i.e., steps are independent and not composed to build upon each other), then stop and flag as "Not Satisfying".
     - *Hand Off to Judgment:* If the composition is present but the mechanism is unclear or potentially error-prone (e.g., the composition relies on an unconstrained model call), hand off to judgment with the note: "Composition present but mechanism may be weak. Need evidence of robust composition."

  4. **Is the system designed to handle complex tasks by leveraging the composition of these steps (i.e., does it aim to solve problems that are too difficult to solve in one step)?**
     - *Passing Answer:* Yes, the system is explicitly intended for complex tasks that require multiple steps of reasoning, and the breakdown is designed to manage complexity.
     - *Stop and Flag:* If the answer is no (i.e., the system is only for simple tasks that don't require decomposition, or the decomposition does not aim to manage complexity), then stop and flag as "Not Satisfying".
     - *Hand Off to Judgment:* If the tasks are complex but it is unclear if the decomposition is necessary or sufficient, hand off to judgment with the note: "Decomposition for complexity management is claimed but not demonstrated. Need evidence of scaling."

  5. **Does the system include mechanisms for verifying, critiquing, or refining the outputs of steps? (Optional but desirable for HCH-like robustness)**
     - *Note:* This is not strictly required for factored cognition but moves toward HCH ideals. We do not stop or flag here if the answer is no. Instead, we note it for overall evaluation.
     - *Passing Answer (for robustness):* Yes, there are mechanisms for verification, critique, or refinement (e.g., cross-checking, voting, or iterative improvement of step outputs).
     - *Hand Off to Judgment:* If the answer is no, then we note that the system does not have built-in robustness mechanisms. This doesn't stop the procedure but may affect the overall assessment.

  **Final Assessment:**
  - If the system passes all of the first four questions without hand-off, it satisfies factored cognition. 
  - If at any point the procedure stops and flags, the system does not satisfy factored cognition.
  - If there is a hand-off at any question, then the proposal requires further judgment. The hand-off notes should guide the additional information needed.

  ---

  **Applying the Procedure to Proposal 1: Chain-of-Thought (CoT) System**

  - **Question 1:** Does the system break down reasoning into multiple distinct steps?
    - *Answer:* Yes. Chain-of-thought breaks down reasoning into a sequence of intermediate steps (the "chain").
    - *Result:* Pass.

  - **Question 2:** Are the steps bounded in context?
    - *Answer:* No. In a typical CoT setup, the entire chain is generated in a single model call. The context for each step is the entire preceding chain (which can be arbitrarily long) and the original input. The model has access to an unbounded context (within the model's context window, which may be large and fixed, but the chain can be long enough to push the limits). However, note that the model is generating the next token in the chain based on the entire context so far. Thus, each step (each token or each sentence) does not have a bounded context because it can see the entire history.
    - *Result:* Stop and Flag as "Not Satisfying". (We stop here.)

  **Conclusion for Proposal 1:** The chain-of-thought system does not satisfy factored cognition because the steps are not bounded in context (each step has access to the entire history).

  ---

  **Applying the Procedure to Proposal 2: Debate Setup (two models cross-examine each other with a human judge)**

  - **Question 1:** Does the system break down reasoning into multiple distinct steps?
    - *Answer:* Yes. The debate involves multiple rounds of cross-examination, each round being a distinct step (e.g., one model makes a claim, the other critiques, then the first responds, etc.).
    - *Result:* Pass.

  - **Question 2:** Are the steps bounded in context?
    - *Answer:* In a debate, each step (each round) typically has a bounded context. For example, each round might be limited to a fixed number of tokens, and the judge (or the models) may only see the most recent exchanges and the initial question. However, sometimes the entire debate history is provided. We must check the design.
      - If the proposal explicitly states that each round is bounded (e.g., each speech is limited to 200 tokens and only the last two speeches are shown, or a fixed context window is used), then it passes.
      - If the proposal allows the entire debate history to be included in every round (and the history can be long) then the context is unbounded.
    - *Handling:* Without explicit bounds, we hand off to judgment.
    - *Result:* Hand Off to Judgment. (We need more information: What is the context provided for each round? Is there a fixed window or truncation? If the design uses a fixed context window that is sufficiently small, then it might pass. Otherwise, it fails.)

    *Note for Hand-off:* If the proposal does not specify, we need to know: How is context managed per round? Is there a fixed context window? If so, how large? If the context window is fixed and reasonably small (e.g., only the last exchange and the question) then it may be bounded. If the entire debate is included and can be long, then it is unbounded.

  - **Question 3 (if passed Question 2):** Compositionality.
    - *Answer:* The steps are composed: each round builds on the previous ones to form the overall debate. The judge uses the entire debate to make a decision.
    - *Result:* Pass (if we assume bounded context in Question 2).

  - **Question 4 (if passed Question 3):** Designed for complex tasks?
    - *Answer:* Yes, debate is intended for complex tasks that require careful reasoning and where multiple perspectives help.
    - *Result:* Pass.

  - **Question 5:** Verification mechanisms?
    - *Answer:* The debate itself is a form of critique and cross-examination, and the human judge provides verification. So, yes.
    - *Result:* Pass (for robustness).

  **Conclusion for Proposal 2:** 
  - If the design for debate ensures bounded context per round (e.g., by using a fixed context window that is not too large and truncates old exchanges), then it would pass the procedure and satisfy factored cognition. 
  - However, without knowing the context management, we hand off at Question 2. We require additional information on how context is bounded per step (round) in the debate.

  **Final Note:** The procedure is applied as above. For the debate, we cannot decide without knowing the context bounds per round. We need the proposal to specify the context limits for each step (round) in the debate.
answer: |-
  ### Factored Cognition Evaluation Procedure

  1. **Does the system decompose reasoning into multiple discrete steps?**  
     - **Passing:** Explicitly defines ≥2 distinct, named steps (e.g., "generate subquestion," "verify claim").  
     - **Stop & Flag:** Single monolithic step (e.g., "direct answer generation").  
     - **Handoff:** Steps are vaguely defined (e.g., "iterative refinement" without specifics). *Need step descriptions.*

  2. **Is each step context-bounded?**  
     - **Passing:** Inputs/outputs per step are strictly limited (e.g., fixed token windows, structured data slots).  
     - **Stop & Flag:** Steps access unbounded global state (e.g., full conversation history).  
     - **Handoff:** Bounds exist but are ambiguously enforced. *Need input/output schemas.*

  3. **Does composition replace long serial chains?**  
     - **Passing:** Steps are short (<1 min human-equivalent effort) and can be parallelized/verified independently.  
     - **Stop & Flag:** Requires long sequential dependencies (e.g., 10+ minute unbreakable chains).  
     - **Handoff:** Step length/dependencies unclear. *Need task duration estimates.*

  4. **Can steps be audited/corrected mid-process?**  
     - **Passing:** Explicit error-handling (e.g., reverting flawed steps, external validation).  
     - **Not Required:** HCH-like robustness isn’t mandatory, but note gaps.  
     - **Handoff:** Partial error recovery. *Need failure mode analysis.*

  **Final Decision:**  
  - **Pass:** Clears all questions without handoffs.  
  - **Fail:** Any "Stop & Flag."  
  - **Judgment Needed:** Any handoff. Resolve via specified info.  

  ---

  ### Application to Proposals

  **Proposal 1: Chain-of-Thought (CoT) System**  
  1. **Discrete steps?**  
     - *Answer:* Yes (e.g., "step 1: extract facts," "step 2: infer implications").  
     - *Result:* Pass.  
  2. **Context-bounded steps?**  
     - *Answer:* No. Each step accesses the entire preceding chain (unbounded context).  
     - *Result:* **Stop & Flag → FAIL.** Reasoning: CoT accumulates unchecked context, violating boundedness.  

  **Proposal 2: Debate Setup**  
  1. **Discrete steps?**  
     - *Answer:* Yes (e.g., "affirm claim," "cross-examine evidence").  
     - *Result:* Pass.  
  2. **Context-bounded steps?**  
     - *Answer:* **Handoff.** Debate rounds *could* bound inputs (e.g., "respond only to last counterargument") but often allow full history access. Unclear from proposal.  
     - *Judgment Needed:* Require context rules per round (e.g., "Each response capped at 200 tokens referencing only the prior turn").  
  3. **Composition replaces long chains?**  
     - *Answer:* **Handoff.** Steps are short (single arguments), but parallelization depends on implementation.  
     - *Judgment Needed:* Require max step duration and parallelizability proof (e.g., "No round >30s; judge can evaluate claims separately").  
  4. **Auditing mid-process?**  
     - *Answer:* Partial (judge intervenes at end, not mid-debate).  
     - *Result:* Pass (not required but note vulnerability to persistent errors).  

  **Verdict for Debate:**  
  - **Judgment Needed** at Q2 and Q3. Requires:  
    (a) Context bounding specifications per debate round.  
    (b) Step timing/parallelism guarantees.  
  - *If bounds/timing confirmed:* PASS.  
  - *If unbounded/serial:* FAIL.
