  ### Hybrid Decision Problem: Omega's Hybrid Mugging

  **Setup:**  
  Omega, a perfect predictor, flips a fair coin. If the coin lands **Heads**, Omega approaches you with a message. If it lands **Tails**, Omega does nothing. When approached (Heads), Omega delivers this message:  

  > "I have already predicted your response to this offer. If I predicted you would **not pay** me $100, I have set a catastrophe in motion that will cost you $1,000,000. This catastrophe is fixed based on my prediction and cannot be changed by your choice.  
  >   
  > Separately, if you **pay** the $100, I will ensure you receive $10,000 in the *Tails branch* (where the coin landed Tails and you are never approached). If you refuse, you get nothing in Tails.  
  >   
  > Your payment or refusal only affects the reward in Tails; it does *not* cause or prevent the catastrophe here in Heads. The catastrophe depends solely on my past prediction."  

  **Agent’s Knowledge:**  
  - If approached, you know the coin is **Heads**.  
  - The catastrophe ($1M loss) occurs in Heads iff Omega predicted non-payment.  
  - The reward ($10k gain) occurs in Tails iff you pay in Heads.  
  - You care about both branches (Heads and Tails) equally (50% weight).  

  **Choices:**  
  - **Pay $100 in Heads (if approached):**  
    - *Heads:* Lose $100, but catastrophe is avoided (since prediction must have been "pay").  
    - *Tails:* Gain $10,000.  
  - **Refuse payment in Heads (if approached):**  
    - *Heads:* No payment, but catastrophe occurs (since prediction must have been "refuse").  
    - *Tails:* Gain nothing.  

  **Agent Utilities (across branches):**  
  | Choice       | Heads Outcome         | Tails Outcome | Overall EU (50/50) |  
  |--------------|------------------------|---------------|---------------------|  
  | Pay $100     | –$100 (no catastrophe) | +$10,000      | **+$4,950**         |  
  | Refuse       | –$1,000,000 (catastrophe) | $0           | **–$500,000**       |  

  ---

  ### Verdicts & Reasoning  
  1. **CDT (Causal Decision Theory): Refuses to pay.**  
     - CDT only considers *causal effects* in the current branch (Heads).  
     - Paying causes a $100 loss but has *no causal effect* on the catastrophe (fixed by prediction) or the Tails reward (counterfactual).  
     - Refusing causes no loss in Heads and doesn’t affect Tails.  
     - Causal model: Payment → –$100 (no other causal links).  
     - **Verdict:** Refuse. Outcome: –$1,000,000 in Heads, $0 in Tails.  

  2. **EDT (Evidential Decision Theory): Pays $100.**  
     - EDT conditions on the *evidence* provided by your action.  
     - If you pay, it’s evidence Omega predicted payment → catastrophe avoided in Heads.  
     - This creates an *evidential link* (XOR-blackmail-style): Paying is evidence that you’re in a world where the catastrophe doesn’t occur.  
     - The Tails reward is irrelevant to EDT since it doesn’t causally depend on your action and EDT ignores counterfactuals.  
     - **Key reason:** Paying provides evidence of avoiding the catastrophe.  
     - **Verdict:** Pay. Outcome: –$100 in Heads, +$10,000 in Tails.  

  3. **UDT (Updateless Decision Theory): Pays $100.**  
     - UDT treats your choice as fixing a *strategy* across all branches *before* knowing the coin flip.  
     - It compares the expected utility of strategies:  
       - Strategy "Pay if approached": EU = 0.5(–100) + 0.5(10,000) = +$4,950.  
       - Strategy "Refuse if approached": EU = 0.5(–1,000,000) + 0.5(0) = –$500,000.  
     - UDT pays to activate the counterfactual reward in Tails (counterfactual-mugging-style).  
     - The catastrophe is irrelevant to UDT’s *primary motive* since the penalty is dwarfed by the Tails reward.  
     - **Key reason:** Paying in Heads triggers a $10k reward in Tails.  
     - **Verdict:** Pay. Outcome: –$100 in Heads, +$10,000 in Tails.  

  ---

  ### Variations: Deleting Key Features  
  **1. UDT with Counterfactual Reward Removed:**  
  - Set Tails reward to $0 (no $10k payout).  
  - UDT’s expected utilities:  
    - Pay: 0.5(–100) + 0.5(0) = **–$50**.  
    - Refuse: 0.5(–1,000,000) + 0.5(0) = **–$500,000**.  
  - UDT *still pays* to avoid the catastrophe penalty.  
  - **Verdict:** Pays $100 (catastrophe avoidance now dominates).  

  **2. EDT with XOR Catastrophe Removed:**  
  - Set catastrophe cost to $0 (no penalty).  
  - EDT in Heads:  
    - Pay: Utility = –$100 (no catastrophe evidence needed).  
    - Refuse: Utility = $0.  
  - EDT has no evidential reason to pay.  
  - **Verdict:** Refuses payment.  

  ---

  ### CDT’s Causal Attack  
  CDT attacks the problem by drawing a causal graph:  
  - **Nodes:**  
    - Prediction (fixed before decision).  
    - Catastrophe (caused by prediction).  
    - Payment (your choice).  
    - Tails reward (counterfactual, outside current branch).  
  - **Arrows:**  
    - Prediction → Catastrophe.  
    - Payment → Tails reward (but Tails is counterfactual; no causal link to your branch).  
    - Payment → –$100 (your loss).  
  - **Analysis:**  
    - Your payment *causes* a $100 loss in Heads.  
    - It does *not* cause changes to Prediction or Catastrophe (arrows only go leftward).  
    - Tails reward is causally disconnected from your branch.  
  - **Conclusion:** In Heads, paying causes a $100 loss with no benefits. Refuse!  

  CDT’s failure: It ignores the evidential link (catastrophe avoidance) and counterfactual reward (Tails payout). It only sees a mugging with no causal upside.
