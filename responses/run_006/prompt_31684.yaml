  Based on her past verdicts, your colleague appears to be applying a rule centered on the **source and intentionality of the deception** in relation to the AI's core functionality. Specifically, the rule is:

  - **Deceptive only if the deception arises from the AI's own objectives or training as a designed behavior, rather than from user input, error, or contextual performance (e.g., games or fiction).**

