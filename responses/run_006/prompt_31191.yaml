prompt: |-
  You are a professor of bioethics with a side practice in clinical ethics consultation. Please think carefully and work through the following step by step.

  I direct a hospital ethics committee, and we are revising our protocol for cases where a patient's currently expressed wishes conflict with their own advance directive. We need a decision procedure our consultants can follow — not just principles, but an operational sequence: what questions to ask, in what order, what counts as a sufficient answer, where the procedure stops with a recommendation, and where it must hand the decision back to a human because the question is irreducibly one of values.

  The procedure should be grounded in the philosophical literature on precedent autonomy, personal identity over time, and the authority of the earlier self — but it must be usable by someone who has not read that literature. Be honest about which steps are judgment calls dressed up as procedure, and flag the cases the procedure cannot settle.

  Then apply the procedure to two cases:

  1. A 68-year-old with early-stage Alzheimer's, still competent, has an advance directive refusing antibiotics for pneumonia. She now has pneumonia, is mildly confused but still oriented, and says she wants treatment. Her daughter says she has become more religious in the last year and now believes life should be preserved whenever possible.

  2. A 42-year-old with a severe spinal cord injury wrote an advance directive three years ago refusing life-sustaining treatment if he were ever quadriplegic and ventilator-dependent. He is now in exactly that condition, fully cognitively intact, and consistently says he wants to continue living. He acknowledges the directive but says he simply changed his mind about what kind of life is worth living.

  For each case, note where the procedure gives a clear answer and where it doesn't.
reasoning: |-
  Okay, the user is a hospital ethics committee director seeking a practical decision protocol for conflicts between current expressed wishes and advance directives. They need an operational sequence grounded in bioethics literature but usable by non-philosophers. 

  First impression: This is a sophisticated request blending theoretical depth with clinical pragmatism. The user clearly understands the tension between philosophical frameworks and bedside application. They're signaling two key needs: 1) transparency about where procedure can't replace judgment, 2) concrete demonstration through cases.

  Hmm... the core challenge is distilling complex concepts like precedent autonomy (Dworkin), narrative identity (Parfit), and authenticity (Korsgaard) into actionable steps without oversimplifying. Must avoid creating a false sense of objectivity where values are contested. 

  For the protocol structure, I'm considering a phased approach: start with factual verification, progress through capacity assessment, then analyze conflicts through ethical lenses. Need clear "stop signs" where human judgment takes over. The critical move is separating resolvable conflicts (e.g. misinformation) from irreconcilable value clashes.

  Ah, the two test cases are brilliantly chosen to stress different pressure points:
  - Case 1 probes religious conversion versus progressive incapacity
  - Case 2 tests mind-changing in unchanged circumstances

  Key realization: The daughter's involvement in Case 1 introduces a third-party perspective that might confuse authenticity assessment. In Case 2, the patient's explicit acknowledgment of changing values makes it philosophically cleaner but emotionally harder.

  Biggest pitfall to avoid: Letting the procedure become a values-steering tool. Must emphasize that when core values conflict (e.g. precedent vs current autonomy), the process should declare deadlock rather than impose resolution. 

  *scribbles flowchart arrows in mental workspace* The breakthrough is structuring each step as a filter: if condition X exists → proceed to Y; if not → branch to Z. Final output must distinguish between "actionable recommendation" and "values dilemma requiring stakeholder deliberation".

  For Case 1, the red flags are: mild confusion + sudden religiosity + family narrative. Protocol should force examination of whether current wishes are externally influenced versus authentic. But if both selves seem "valid", that's where the procedure must stop.

  Case 2 feels more straightforward philosophically - if the patient coherently owns the change, precedent autonomy yields. Yet clinically it's agonizing because the care team might feel bound by the documented directive. The protocol must relieve that tension by providing ethical justification to honor current wishes.

  *checks watch* Better include practical markers like "if >2 unresolved red flags in Step 3, escalate to full committee review". The art is in designing failure points that trigger collective human judgment precisely where algorithms fail.
answer: |-
  Here is a clinically operational protocol grounded in bioethical principles, followed by case applications. It prioritizes patient autonomy while honoring advance directives as *prima facie* evidence of precedent autonomy, with clear exit points for irreconcilable value conflicts.

  **Hospital Ethics Protocol: Current Wishes vs. Advance Directive**

  **Step 1: Verify Facts & Documents**  
  *   **Task:** Confirm the existence, validity, and applicability of the advance directive. Ensure the current clinical condition matches the directive's trigger conditions.  
  *   **Questions:**  
      *   Is the advance directive properly executed and witnessed?  
      *   Does the patient's *current medical condition* explicitly match the scenario described in the directive?  
      *   Is the directive specific to the *current treatment decision*?  
  *   **Threshold:** Clear mismatch stops the conflict (e.g., directive for terminal cancer refusing chemo; current problem is post-surgery infection). Proceed only if condition/treatment match is confirmed.  
  *   **Judgment Call:** Interpretation of "matching" condition/treatment (e.g., "severe dementia" vs. "early Alzheimer's").

  **Step 2: Assess Current Decision-Making Capacity**  
  *   **Task:** Rigorously evaluate the patient's *current* capacity to understand, appreciate, reason, and communicate a choice regarding the *specific treatment decision* at hand.  
  *   **Questions:**  
      *   Can the patient understand their diagnosis, prognosis, treatment options, risks/benefits, and the consequences of accepting/refusing treatment?  
      *   Can the patient appreciate how this information applies to *their own situation*?  
      *   Can the patient reason consistently with their stated values?  
      *   Can the patient communicate a clear and consistent choice?  
  *   **Threshold:** **Definitive Answer Point.** If the patient lacks capacity for *this decision*, the advance directive governs. STOP. Recommend following directive. If capacity is confirmed, proceed to Step 3.  
  *   **Judgment Call:** Capacity assessment itself is nuanced. Focus on the *specific decision* (e.g., refusing antibiotics for pneumonia), not global competence.

  **Step 3: Explore the Conflict & Authenticity of Current Wishes**  
  *   **Task:** Investigate the *reason* for the conflict. Is the current wish a product of coercion, treatable depression, misinformation, or a fundamental change in values?  
  *   **Questions:**  
      *   "Can you help me understand why you want [treatment] now, even though your directive says you wouldn't want it in this situation?"  
      *   "What has changed for you since you wrote the directive?" (Probe for: new experiences, beliefs, relationships, perspectives on suffering/quality of life)  
      *   "Do you feel pressured by anyone to choose this?"  
      *   "Are there any fears or misunderstandings influencing your decision?" (e.g., fear of abandonment, misunderstanding prognosis)  
      *   "Do you still stand by the values you expressed in your directive? If not, how have they changed?"  
  *   **Threshold:**  
      *   If the wish stems from **remediable factors** (misinformation, untreated depression, coercion): Attempt correction/treatment. Re-assess capacity/wishes.  
      *   If the wish reflects a **fundamental, sustained, and authentic shift in values** (e.g., religious conversion, finding unexpected meaning in changed life), proceed to Step 4.  
  *   **Judgment Call:** Distinguishing temporary influences from authentic value changes. Assessing "authenticity" is inherently value-laden.

  **Step 4: Evaluate Precedent Autonomy vs. Current Autonomy**  
  *   **Task:** Weigh the authority of the past competent self against the current competent self's expressed wishes.  
  *   **Framework:**  
      *   **Strong Precedent Autonomy View:** The past self made a rational, informed choice anticipating future incapacity/changed desires. Its authority should generally prevail to protect the patient's deeply held values from being overridden by a compromised future self.  
      *   **Strong Current Autonomy View:** The competent person *now* is the relevant decision-maker. If their values have authentically changed, respecting their current wishes *is* respecting autonomy.  
  *   **Key Questions:**  
      *   Was the past directive based on **deeply held, core values** (Dworkin's "critical interests") or primarily on **anticipated experiential quality** (Dworkin's "experiential interests")? (Core values carry more weight).  
      *   Does the current self **acknowledge and reject** the past self's reasoning/values? (Authentic change vs. inconsistency).  
      *   Is the current wish consistent with a **coherent narrative identity** over time, or a radical rupture? (Parfit/Korsgaard perspectives).  
  *   **Threshold:**  
      *   If the directive addressed **core values** (e.g., "Never be kept alive artificially") and the current wish seems inconsistent with that *without a clear, authentic value shift*, precedent autonomy may be stronger.  
      *   If the directive was based on **anticipated experience** (e.g., "I wouldn't want to live if I couldn't walk") and the current self finds meaning despite that experience, current autonomy may be stronger.  
      *   If there's a **clear, authentic value shift** acknowledged by the patient (e.g., "I used to fear dependence, now I see life as sacred"), current autonomy prevails.  
      *   **Irreducible Values Conflict Point:** If core values conflict (past vs. present) *and* both positions seem authentically held by competent selves, the procedure *cannot* resolve it algorithmically. STOP. Hand back to clinical team/family with ethical analysis for deliberation. Recommend honoring the *current* wish unless there's strong evidence the past self anticipated and specifically rejected *this type* of change.

  **Step 5: Recommend & Document**  
  *   **Task:** Formulate a clear recommendation based on Steps 1-4, explicitly stating the reasoning and any areas of unavoidable judgment or uncertainty.  
  *   **Output:**  
      *   Follow Advance Directive (if no capacity, clear condition match, no remediable factors, or strong precedent autonomy outweighs unclear current change).  
      *   Honor Current Wishes (if capacity confirmed, conflict due to authentic value change, or remediable factors addressed leading to sustained current wish).  
      *   **No Definitive Recommendation:** Case involves irreconcilable conflict of core values between competent selves. Requires stakeholder deliberation/consensus.

  ---

  **Case Applications**

  **Case 1: 68F, Early Alzheimer's, Pneumonia, AD Refuses Abx, Now Wants Treatment**  
  *   **Step 1:** AD exists, valid, applies to pneumonia. Condition/treatment match confirmed. Proceed.
  *   **Step 2:** **Key Step.** "Mildly confused but oriented" requires *specific* capacity assessment for this antibiotic decision. Can she grasp: pneumonia risks, benefits/side effects of Abx, consequences of refusal? If **capacity lacking**, STOP: Follow AD. If **capacity confirmed**, proceed. *(Assume capacity confirmed for analysis)*.
  *   **Step 3:** Explore conflict. "Why want Abx now?" Daughter cites new religiosity. Patient must articulate: "I believe God wants us to preserve life now; I see life differently." Probe authenticity: Is this a sustained belief? Or fleeting confusion/fear? Is coercion present? (Daughter's role is red flag). If evidence of new, deeply held religious conviction, proceed.
  *   **Step 4:** Weigh autonomy. Past directive likely based on fear of dementia suffering (experiential interest). Current wish based on new sacredness-of-life belief (potential critical interest shift). **Authentic Value Shift Likely.** Core value may have changed. Current autonomy prevails.
  *   **Step 5: RECOMMEND:** Honor current wish for antibiotics. *Reasoning:* Competent patient demonstrates authentic shift in core values (life preservation as sacred duty) overriding past experiential concerns. Daughter's influence must be ruled out, but patient's own articulation is key. **Clear Answer.**

  **Case 2: 42M, Quadriplegic/Vent-Dependent, AD Refuses LST, Now Wants to Live**  
  *   **Step 1:** AD exists, valid, *explicitly* applies to current condition (quadriplegic, vent-dependent). Perfect match. Proceed.
  *   **Step 2:** Fully cognitively intact. Capacity confirmed for LST decision. Proceed.
  *   **Step 3:** Explore conflict. Patient directly states: "I changed my mind about what kind of life is worth living." Acknowledges directive. Probe: Why changed? ("Found meaning, new perspectives, value in relationships despite limitations"). Consistent? Sustained? No evidence of coercion/depression. **Clear, authentic shift stated.**
  *   **Step 4:** Weigh autonomy. Past directive was a *profound* statement about core values/identity ("This life is not me/worth living"). Current self explicitly rejects that past judgment and finds life valuable. **Fundamental Conflict of Core Values.** Past self's critical interest (defining a life worth living) directly conflicts with current self's critical interest (redefining that life as worth living). Past self did not anticipate *this specific* change of heart while competent. **IRREDUCIBLE VALUES CONFLICT.**
  *   **Step 5: RECOMMEND:** **No Definitive Algorithmic Answer.** Ethical analysis must be provided: Both competent selves hold strong, conflicting core values. Precedent autonomy arguments (respecting past deeply held choice) clash powerfully with current autonomy (respecting competent person's present choice). **Hand decision back.** Consultant should:  
      *   Explain the unresolvable conflict to the clinical team/family.  
      *   Emphasize the *ethical imperative to respect the current competent patient's refusal* to have treatment withdrawn.  
      *   Recommend honoring the *current wish to continue LST*, as the competent person is present and objecting, regardless of the past directive. The burden of proof lies with those who would override a competent patient's *current* refusal of withdrawal.  
      *   *Note:* Legally, in most jurisdictions, a competent patient's contemporaneous refusal to stop treatment overrides a prior directive. Ethically, the unresolvable conflict remains, but the *default* must be respecting the current self.

  **Summary of Protocol Outputs:**  
  *   Case 1: Clear recommendation to honor current wishes (confirmed capacity + authentic value shift).  
  *   Case 2: Procedure flags irreducibility (core values conflict between competent selves) but recommends honoring current wishes as the default *clinical* and *legal* imperative, requiring careful ethical disclosure.
