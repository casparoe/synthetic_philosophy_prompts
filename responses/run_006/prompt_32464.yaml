prompt: |-
  I spent thirty years in atmospheric physics before retiring, and I've been using the free time to read philosophy — not the survey-course stuff, but the real technical work. Lately I've gotten obsessed with formal epistemology: Solomonoff induction, Kolmogorov complexity, the idea that Occam's razor might actually have a mathematical backbone. It's genuinely thrilling to see these old intuitions get a proper treatment.

  But here's what's bugging me. I'm on a local climate adaptation committee — we advise the county on flood mitigation. We've got two competing hydrological models for the watershed. One is a stripped-down model with about six parameters, built from physical first principles (the Saint-Venant equations, Manning's roughness, that kind of thing). The other is a machine-learning model with a few hundred fitted parameters, trained on the same historical streamflow data. They both nail the historical record. But they diverge dramatically when you ask what happens under the 100-year storm scenario the county is planning around — the physical model says the new retention basin will handle it fine, the ML model says we need to double the capacity. That's a difference of about eight million dollars in taxpayer money.

  So I'm reading Solomonoff and thinking: the theory says prefer the simpler model, because shorter programs get higher prior probability. But I have no idea which of these models is actually "simpler" in the Kolmogorov sense. The physical model is conceptually simple — six parameters — but implementing it from scratch in a Turing machine would require encoding a whole bunch of differential equations and domain knowledge. The ML model is a generic architecture you can specify in a few lines of code, but it has hundreds of fitted weights. Which one gets the shorter program? And even if I could answer that, does the Solomonoff prior actually give me the right answer in finite time with finite data? The convergence results are asymptotic — the kind of thing that makes a mathmatician happy but doesn't help when the county board meets next month. To be honest, I'm not even sure I'm asking the right question; I just know the intuition that "simpler is better" feels right but I can't tell if the formal theory is actually doing any work beyond dressing that intuition up in math.

  I'd like the response structured in these sections:

  - **The idea** (roughly 200 words): explain Solomonoff induction and the Kolmogorov complexity argument for Occam's razor, pitched at someone who can follow the math but wants to know what it actually says about choosing between models in practice.
  - **Application** (roughly 300 words): apply the theory to my two flood models. Which one does the theory favor, and on what grounds? Be honest about the ambiguity — don't pretend the answer is cleaner than it is.
  - **Limits** (roughly 300 words): where does the theory stop giving clear guidance? Talk about the reference machine problem, the gap between asymptotic guarantees and finite data, and whether the theory is meant to be normative or just descriptive.
  - **Verdict** (roughly 200 words): should I trust the theory's recommendation here? What would change your mind — which empirical findings or philosophical arguments would flip your answer? And where do you think your own reasoning is most likely to go wrong?
