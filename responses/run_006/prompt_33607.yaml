prompt: |-
  I keep noticing a pattern in moral arguments that I don't have a word for. Someone makes a true moral accusation against another person — a manager who padded his own expense reports denouncing a colleague for doing the same, or a politician who dodged taxes condemning a rival for tax evasion — and the accusation is accurate, and the target really is at fault. Yet everyone says the accuser is in no position to talk, and I share the feeling that something is wrong, not with what is said, but with that person saying it. It isn't the familiar move of dismissing a charge because the accuser did the same thing and therefore the charge is false; I don't think the charge is false. And it doesn't seem to be only that hypocrisy is an unpleasant character trait, because the defect attaches specifically to the act of accusing. I'm looking for the concept, if one exists, for whatever a person must have in order to be entitled to make a true moral accusation — the thing a hypocrite lacks even while speaking the truth. Does this have an established name? How exactly does it differ from the you-did-it-too fallacy and from hypocrisy as a mismatch between word and deed? And what removes it: must the accuser have done the very same deed, or do other kinds of involvement — having benefited from the wrong, having failed to stop it, having once done something similar and since reformed — remove it too, or leave it intact?
reasoning: |-
  Okay, the user is asking about a specific pattern in moral arguments where someone makes a true accusation but is seen as not having the standing to do so because they've committed the same wrong. They want to know the concept behind this, how it differs from hypocrisy and the tu quoque fallacy, and what factors affect whether someone can legitimately make such an accusation.

  First, I need to recall if there's a term for this. Hypocrisy comes to mind, but the user already distinguishes that. They mention it's not about the accusation being false, but about the right to accuse. The term "standing" in legal contexts might apply. In moral philosophy, "moral standing" or "moral authority" could fit. Then there's "clean hands doctrine" from equity law. Also, "hypocrisy" in the deeper sense of lacking integrity when speaking. But the user wants precision.

  The user's deeper need seems to be understanding why valid criticism from a hypocrite feels wrong. They might be grappling with integrity in discourse or seeking ways to address wrongdoing without hypocrisy undermining their position. Maybe they want to know how to legitimately call out others without being dismissed. Or they could be involved in debates where this pattern occurs and need strategies to navigate it.

  Breaking down the differences: Tu quoque fallacy is dismissing the argument because the accuser is hypocritical, which is a logical error. But here, the accusation is accepted as true, yet the accuser is criticized for speaking. Hypocrisy typically means preaching without practicing, but the issue is the act of accusing, not just the inconsistency. So the key is the lack of moral authority to accuse, which ties to standing.

  Factors affecting standing: Same deed? Repentance? Complicity? Benefit? The user mentions reformation, benefiting, or failing to stop the wrong. Repentance might restore standing, while benefiting or complicity could still undermine it. Each factor needs examples to clarify.

  I should structure the answer by naming the concept, distinguishing it from related terms, and explaining the factors that affect standing. Emphasize that it's about the speaker's legitimacy, not the truth of the claim. Address all parts of the query to ensure clarity. The user likely wants practical applications, so providing clear examples and conditions where standing is lost or regained would be helpful.
answer: |-
  You've identified a sophisticated and philosophically rich concept that goes beyond simple hypocrisy or fallacy. The principle you're grappling with is **moral standing** or **standing to blame/criticize**. It addresses the question: "Even if what you say is *true*, do *you* have the right to say it?"

  **The Name:** This concept is most commonly referred to as:

  1.  **Standing (Moral Standing):** This is the most direct term. It asks whether a person possesses the requisite position, relationship, history, or character to legitimately level a particular moral accusation against another.
  2.  **Moral Authority:** A related concept emphasizing the credibility and legitimacy derived from one's own moral consistency and integrity, which is necessary for one's moral pronouncements to carry weight.
  3.  **Clean Hands Doctrine (Analogy):** Borrowed from equity law, where a plaintiff seeking relief must not have acted unethically regarding the subject matter of the lawsuit. It directly translates to the moral sphere: you cannot credibly demand moral rectitude from others regarding an act if your own hands are dirty with the same or a relevantly similar act.
  4.  **Hypocrisy (in a specific, deeper sense):** While hypocrisy generally means *saying* one thing and *doing* another, the specific defect you identify is the *act of accusing while being guilty* – a performative hypocrisy that undermines the legitimacy of the accusation itself. It's hypocrisy *as it invalidates the speaker's position to speak*.

  **Distinguishing from Related Concepts:**

  *   **Tu Quoque ("You Too") Fallacy:** This is a *logical error* where someone argues that an accusation is *false* simply because the accuser is also guilty. ("You say I stole, but you stole too, therefore I didn't steal!" - which is nonsense). **Your observation is fundamentally different:** You *accept the accusation is true*. The problem isn't the truth of *what* is said, but the *legitimacy* of *who* is saying it. It's about the speaker's position, not the logical validity of the claim.
  *   **Hypocrisy (as inconsistency):** Simple hypocrisy focuses on the *inconsistency* between word and deed as a character flaw. It might make someone *unpleasant* or *untrustworthy* generally. **The concept you describe is a specific *consequence* of that hypocrisy:** it renders the hypocrite *unable to legitimately perform the specific act of accusing others* of that particular wrong. It attaches the defect directly to the speech act of accusation itself, making it inappropriate or illegitimate *for that person, at that time, about that issue*.

  **The Core Idea:** The power of moral condemnation derives not just from the truth of the statement, but also from the perceived integrity and relational position of the speaker. To have standing to blame someone for X, you generally need:

  1.  **Clean Hands:** You must not be actively guilty of X yourself (or a sufficiently similar wrong) *without appropriate acknowledgment and amendment*.
  2.  **Integrity:** There should be no fundamental inconsistency between your condemnation of X and your own values/actions *regarding X*.
  3.  **Appropriate Relationship:** You usually need some relevant connection to the wrongdoer or the wrong (e.g., being affected by it, having a duty to uphold the norm, being part of the same community). Strangers condemning minor infractions might lack standing simply due to lack of relationship.

  **What Removes the Lack of Standing? (Factors Affecting Restoration of Standing):**

  The hypocrisy doesn't necessarily make the accusation *false*, but it does undermine the *speaker's right to make it*. This lack of standing *can* be overcome, but it requires work:

  1.  **Repentance & Reform:** This is the most powerful restorer. If the manager who padded expenses genuinely acknowledges his past wrongdoing, makes amends (e.g., repaid the money, faced consequences), demonstrates sustained change, *and then* calls out the colleague, his standing is significantly restored. His past act becomes a basis for credibility ("I know this trap, I fell into it, here's why you shouldn't"). The key is demonstrating the hypocrisy has been *addressed*.
  2.  **Acknowledgment & Apology:** Even without full reformation yet (if the change is recent), openly acknowledging one's own past wrongdoing *before* or *while* making the accusation can mitigate the lack of standing. ("Look, I know I did this too in the past, and it was wrong. I regret it deeply. Because I know how damaging it is, I have to say..."). This shows self-awareness and removes the *deceptive* element of hypocrisy.
  3.  **Different Kind of Involvement:** Other involvements might *also* undermine standing, but differently:
      *   **Benefiting from the Wrong:** Someone who knowingly profited from the colleague's expense padding but stayed silent lacks standing to condemn the *colleague alone*. Their accusation ignores their own complicity (a different kind of dirty hands). To speak credibly, they might need to condemn the *system* or *their own role* too.
      *   **Failing to Stop It (When Able & Obligated):** A manager with oversight who ignored clear signs of padding lacks standing to suddenly condemn a subordinate for doing it. Their failure is a relevant wrong that undermines their position. Standing might require acknowledging their failure first.
      *   **Having Done Something Similar (but not identical/reformed):** This is nuanced. Condemning tax evasion when you once shoplifted as a teen likely doesn't damage standing significantly. Condemning financial fraud when you engaged in aggressive but legal tax avoidance *might* damage standing in the eyes of some, especially if the underlying values seem inconsistent. Repentance for the *similar* act helps.
  4.  **Speaking as a Reformed Sinner:** If standing has been restored through repentance, the speaker can *leverage* their past failure as a source of insight and credibility, explicitly framing their condemnation through that lens of hard-earned understanding.

  **What Does NOT Remove the Lack of Standing:**

  *   **The Accusation Being True:** As you noted, this is central to your observation. Truth is necessary but not sufficient for legitimate condemnation.
  *   **The Target Being Worse:** The accuser's guilt isn't erased because the target's actions were more egregious.
  *   **Silence About One's Own Guilt:** Ignoring or hiding one's own relevant wrongdoing while condemning another *exacerbates* the lack of standing by adding dishonesty.
  *   **Claiming "I'm Just Stating Facts":** Moral accusations are performative speech acts; they inherently carry a judgment about right and wrong. The speaker's own relationship to that moral norm is unavoidably relevant.

  In essence, you've pinpointed the crucial difference between the *truth* of a moral claim and the *legitimacy* of the person uttering it as a condemnation. **Moral standing** is the missing concept – the prerequisite of integrity and appropriate relationship that allows a true moral accusation to be not just correct, but also rightful and effective. A hypocrite, even when speaking truth, lacks the moral authority to perform the act of condemnation credibly.
