  Hmm... the real challenge here is avoiding binary thinking. Chesterton would absolutely savage EA's blind spots, but he'd also recognise its moral seriousness. The key is finding where he'd grant points (maybe cause prioritisation?) versus where he'd drop the rhetorical hammer (probably on dehumanising metrics). 

