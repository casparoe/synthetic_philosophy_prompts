  The user's closing question is crucial: is this just a provenance-chain problem? My instinct says no - the moment you introduce "admiration collapse," you've crossed into territory where Merkle trees can't follow. The engineers might call this "out-of-band data," but philosophers would argue it's central to the artifact's existence.

