  Interesting challenge: how much of this is just imperfect identity binding? If we had perfect PKI for artists (like SSL certs for websites), would that resolve it? Probably not - because the issue isn't just *who* signed it, but *what* we believe we're engaging with when we experience art. The "Mona Lisa by Leonardo" mental construct carries layers of cultural significance beyond its SHA-256 hash.

