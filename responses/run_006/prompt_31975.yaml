  ok so i just had this two-hour argument with a friend about epistemic akrasia and i'm still annoyed about it. his position is that you literally cannot be in a state where you believe P while also believing your total evidence doesn't support P — not just that it's irrational, but that it's impossible, like a conceptual impossibility. he kept bringing up this idea that if you're genuinely reflecting on whether your evidence supports P, that reflection just is the process of belief-revision, so you can't stably occupy both states. i think he's wrong but i kept getting tangled up in his moves.

  can you play him? like, take his exact position and defend it. i want a sharp version, not a strawman. don't concede the main point. keep replies to a paragraph. stay in character.

  here's my opening: look, if epistemic akrasia is genuinely impossible, then every single person who says "i know i shouldn't believe this but i still do" — which people say all the time — is either misdescribing their own mental state or is just wrong about what they believe. that's a huge bullet to bite. you're basically saying ordinary introspection is massively unreliable on this one specific question. so what's your account of what's actually going on when people make those reports?
