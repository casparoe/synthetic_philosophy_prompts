  ### Maxwell's Demon Activity: "The Entropy Ledger"

  #### **Activity Goal**  
  Participants experience how information-driven sorting *seems* to violate the second law, then discover that **erasing the demon's memory** imposes an unavoidable entropy cost that restores balance. The core tension emerges when they realize their "profit" from sorting is offset by "debt" from erasure.

  ---

  ### **Rules and Setup**  
  **Materials**:  
  - Two colors of tokens (e.g., 40 red/blue poker chips) representing "fast" (red) and "slow" (blue) molecules.  
  - A divider (e.g., a book) splitting the table into LEFT/RIGHT chambers.  
  - Blank index cards (memory register) and a marker.  
  - A coin (to randomize token selection).  

  **Setup (5 min)**:  
  1. Place tokens randomly on LEFT/RIGHT (20 each side, equal red/blue mix).  
  2. Designate 2–4 "demons" (others observe). Demons get index cards and marker.  

  **Core Rules**:  
  1. **Sorting Phase**:  
     - Flip coin: HEADS = select token from LEFT, TAILS = from RIGHT.  
     - Demons observe token color.  
     - **Rule**: If RED (fast) from LEFT, move to RIGHT. If BLUE (slow) from RIGHT, move to LEFT. *Otherwise, leave it.*  
     - **Record**: Demons write the token’s origin/color/action (e.g., "LEFT-RED → moved") on a card. Place card face up.  
     - Repeat for 10–12 turns.  

  2. **Erasure Phase**:  
     - Demons must erase memory to continue.  
     - **Rule**: To erase one card, draw a token *blindly* from either side and move it to the *opposite* side. Discard the card.  
     - Repeat until all cards are erased.  

  **Goal**: "Extract work" by concentrating red tokens on RIGHT (hot side) and blue on LEFT (cold side).  

  ---

  ### **Timeline (40 min)**  
  | Phase              | Duration | Key Steps                                                                 |
  |--------------------|----------|---------------------------------------------------------------------------|
  | **Setup**          | 5 min    | Distribute tokens, explain rules, assign roles.                          |
  | **Sorting Phase**  | 15 min   | Demons sort tokens, record actions. Group tallies tokens per side.       |
  | **Erasure Phase**  | 10 min   | Demons erase memory via random moves. Group tallies again.               |
  | **Comparison**     | 10 min   | Compare pre/post-erasure distributions. Discuss emerging frustration.    |

  ---

  ### **Predictable Failures & Remedies**  
  1. **Failure**: Demons skip recording to "save memory."  
     **Remedy**: Gently enforce: "No record, no decision. The demon *must* log actions."  
  2. **Failure**: Group focuses on "work extraction" (sorting) but ignores erasure cost.  
     **Remedy**: Ask: "What happens when the demon’s memory fills up? Can it run forever?"  
  3. **Failure**: Random erasure moves accidentally *improve* order.  
     **Remedy**: Highlight: "This is statistical! Do more rounds—cost *averages* out."  

  ---

  ### **What the Activity Cannot Show**  
  **The physical independence of the memory system**. The activity ties erasure cost directly to the gas (via random moves). In reality, Landauer’s principle requires heat dissipation in the *memory device itself*, not necessarily the gas. **Debrief honestly**: "The cost is paid in the demon’s environment when resetting memory—a separate system."

  ---

  ### **Success Indicator**  
  Watch for: **Audible frustration during erasure** (e.g., "We worked so hard to sort, and now we’re ruining it!"). This signals they grasp the trade-off: information-driven order requires disorder elsewhere.

  ---

  ### **Debrief Bridge (Post-Activity)**  
  Map the experience to theory:  
  1. **Correlation**: Demon’s memory correlated with gas state during sorting.  
  2. **Gas Entropy Reduction**: Sorting created order (imbalanced sides).  
  3. **Erasure Cost**: Resetting memory to "zero" *required* entropy export (random moves).  
  4. **Net Increase**: System (gas + memory) entropy rose, satisfying the second law.  

