answer: |-
  ## Joint Statement on Death in Damascus: CDT vs. EDT Consensus Points & Disagreements

  **Preamble:** We, a committed Causal Decision Theorist (CDT) and a committed Evidential Decision Theorist (EDT), have engaged in adversarial collaboration to clarify the nature of our disagreement specifically regarding the Death in Damascus (DiD) problem. We agree DiD is a critical case study revealing our fundamental divergence, distinct in structure from both Newcomb's Problem (where the predictor's action is causally prior) and the Smoking Lesion (where a hidden common cause exists). DiD isolates the core tension between causal structure and evidential correlation when a predictor is perfect and contemporaneous. This document outlines our points of agreement, precise disagreements, and the cruxes separating our views.

  **1. Agreed Claims:**

  1.  **Death's Perfection:** Death is a perfect predictor. Its prediction (Damascus or Aleppo) is guaranteed to match the agent's actual choice.
  2.  **Decision Dependence:** The agent's choice *depends* on Death's prediction only in the informational sense (the agent might try to use their knowledge of the prediction mechanism to reason). *Causally*, Death's prediction is made first and is fixed before the agent decides; the agent's choice does not causally influence the prediction.
  3.  **Symmetric Dominance (Causal):** *Causally*, neither choice dominates the other. Choosing Damascus does not cause Death to have predicted Damascus; choosing Aleppo does not cause Death to have predicted Aleppo. The causal structure is symmetric.
  4.  **Evidential Asymmetry:** Choosing a city provides *perfect evidence* that Death predicted that city. P(Death Predicted Damascus | I choose Damascus) = 1, P(Death Predicted Aleppo | I choose Damascus) = 0 (and vice versa for Aleppo).
  5.  **Preference Nuance:** The agent has a slight preference for dying in Damascus over Aleppo (e.g., family reasons). This breaks the strict symmetry of outcomes *given* the prediction, but not the causal symmetry.
  6.  **CDT Recommendation:** CDT recommends treating the choice as causally independent of the prediction. It calculates expected utility assuming the probability of Death being in a city is fixed regardless of the agent's choice. Given the causal symmetry and the slight preference for Damascus, CDT recommends choosing Damascus. CDT sees this as the only rational choice given the causal structure.
  7.  **EDT Recommendation:** EDT recommends conditioning on the choice. It calculates expected utility using the probabilities updated by the evidence provided by the choice itself. Choosing Damascus provides perfect evidence Death predicted Damascus, leading to death in Damascus. Choosing Aleppo provides perfect evidence Death predicted Aleppo, leading to death in Aleppo. EDT sees no difference in expected utility (EU(Damascus) = Death in Damascus; EU(Aleppo) = Death in Aleppo) and therefore deems the choices equally good (or bad). The slight preference for Damascus death is irrelevant to the expected utility calculation *between the options* because conditioning on different choices yields different certain outcomes. EDT thus sees no reason to prefer one city over the other based on decision theory alone.
  8.  **Core Disagreement Manifest:** DiD cleanly demonstrates the central difference: CDT ignores the evidential link (Death's prediction) when it is not causally influenced by the decision, focusing only on the causal consequences *of* the decision. EDT incorporates the evidential link as diagnostically valuable information about the state of the world relevant to outcomes, regardless of causal influence *by* the decision.
  9.  **Distinction from Newcomb:** We agree DiD differs from Newcomb's Problem because in Newcomb, the predictor's action (placing the money) is causally prior and independent of the agent's *later* choice. In DiD, the prediction is prior, but the outcome (Death's location) is directly determined by the *match* between prediction and choice, creating a unique dependence structure.
  10. **Distinction from Smoking Lesion:** We agree DiD differs from the Smoking Lesion because the Smoking Lesion posits a hidden common cause (the lesion) causing both the desire to smoke and cancer. DiD has no hidden common cause; the correlation arises solely from Death's perfect prediction and the decision rule linking prediction and outcome.

  **2. Disagreements Table:**

  | Question                                                                                                | CDT Answer                                                                                                                                                            | EDT Answer                                                                                                                                                                 |
  | :------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **What is the rational choice in Death in Damascus?**                                                   | Choose Damascus. The slight preference for dying there makes it the better option, and my choice doesn't cause where Death is.                                         | There is no uniquely rational choice. Choosing either city results in death there with certainty. My preference for Damascus death doesn't make *choosing* it better.       |
  | **Why is the other theory's recommended action irrational?**                                            | EDT is irrational because it bases its evaluation on a correlation (my choice evidence for Death's prediction) that my choice doesn't *cause*. This leads to paralysis. | CDT is irrational because it ignores the perfect diagnostic information my choice provides about where Death is *right now*, which directly determines my outcome.        |
  | **What probability should be assigned to "Death predicted Damascus" when calculating the utility of *choosing* Damascus?** | The base rate probability, prior to my decision (e.g., 0.5). My choice doesn't affect it.                                                                             | 1.0. Choosing Damascus provides certain evidence that Death predicted Damascus.                                                                                          |
  | **Does the agent have any "control" over where Death is via their choice?**                             | **No (Causal Control).** My choice does not causally affect Death's location or prediction. Any perceived control is illusory.                                         | **Yes (Informational Control).** By choosing a city, I definitively learn (and thus "control" in the sense of determining *for myself*) where Death is and will be.        |
  | **What is the key mistake the other theory makes in DiD?**                                              | EDT mistakenly treats the evidential link between choice and prediction as if it were a causal link that the choice can break.                                         | CDT mistakenly treats the evidential link as irrelevant to predicting the outcome, ignoring that the choice perfectly diagnoses the state (Death's prediction) that dooms me. |

  **3. Cruxes:**

  1.  **Crux: Relevance of Perfect Evidence**
      *   **Sub-Question:** Is information that is perfectly diagnostic of the state determining the outcome, but *not causally influenced* by the current decision, relevant to calculating the expected utility of that decision?
      *   **Concrete Test (Prediction Token):** Modify DiD: Just before deciding, a sealed envelope is delivered containing Death's prediction. The agent *must* choose a city *without opening the envelope*. Both agree no information is gained *by the choice itself*; the agent should choose Damascus based on preference. **CDT Predicts:** This scenario is fundamentally *different* from standard DiD. The sealed envelope breaks the evidential link *during the decision*. Choosing Damascus now carries no evidence about the prediction (it's sealed). CDT recommends Damascus. **EDT Predicts:** This scenario is *equivalent* to standard DiD. The sealed envelope doesn't change the fact that *actually choosing* Damascus still perfectly correlates with Death having predicted Damascus (and being there). EDT still sees no difference between choices. The act of choosing provides the evidence, regardless of other sealed information.

  2.  **Crux: Ratification & Self-Fulfilling Prophecies**
      *   **Sub-Question:** Is it rational to "ratify" a perfect predictor's expectation when doing so causes the predicted outcome, even if not causally influencing the predictor?
      *   **Concrete Test (Two Identical Agents):** Two agents face identical, simultaneous DiD scenarios in separate rooms. They share the same slight preference for Damascus. They can communicate before deciding but cannot coordinate actions. **CDT Predicts:** Each agent, reasoning causally and independently, chooses Damascus. Both die in Damascus. CDT views this as rational for each individually. **EDT Predicts:** Each agent reasons that their choice provides perfect evidence about *their own* Death's prediction/location. EDT sees no reason for either to choose one city over the other. If both happen to choose Damascus, EDT considers that rational *for each* given their situation, even though the outcome matches the CDT-symmetry-break outcome. EDT doesn't see a coordination problem here; each agent only controls/learns about their own fate.

  3.  **Crux: The Nature of "Doing Better"**
      *   **Sub-Question:** Can an agent "do better" by choosing one option over another when the causal structure between choice and outcome is symmetric, but evidential links differ?
      *   **Concrete Argument:** CDT argues that choosing Damascus strictly leads to a preferred outcome (death in Damascus) *compared to what would happen if they chose Aleppo*, holding the prediction fixed. EDT argues this counterfactual is incoherent/invalid because the prediction isn't fixed independently of the choice – the choice reveals what the prediction was. **CDT Predicts:** The counterfactual is valid and shows Damascus is better. **EDT Predicts:** The counterfactual is misleading; "holding the prediction fixed while changing the choice" describes an impossible world given the perfect prediction link. There is no coherent sense in which choosing Aleppo *instead* leads to a different outcome *for the agent making the choice*; it inevitably leads to death in Aleppo.

  **4. Potential Verbal Dispute:**

  *   **"Control":** We identify potential verbal disagreement around the term "control." CDT uses it strictly to mean *causal influence* – the ability to change an outcome via physical causation. EDT often uses it to mean *informational determination* – the ability to learn or guarantee an outcome through one's action, even if not causing it. When CDT says "You have no control over Death's location," they mean causal control. When EDT says "By choosing, you control *which* city you die in," they mean informational control/guarantee. Recognizing this distinction in terminology can prevent unnecessary confusion, though the underlying disagreement about the relevance of evidence remains substantive.

  **Signatories:**
  *   [Committed Causal Decision Theorist]
  *   [Committed Evidential Decision Theorist]

  ---
  **Design Notes for LessWrong Posting:**
  *   **Tone:** Strictly descriptive, avoids evaluative language ("right," "wrong," "superior").
  *   **Charitability:** Presents each view in its strongest, most defensible form as articulated by its proponents. Avoids strawmen.
  *   **Precision:** Uses specific, technical language agreed upon by both parties during collaboration (e.g., "causal structure," "evidential link," "diagnostic information," "ratify").
  *   **Focus:** Stays rigorously on DiD. References to Newcomb/Smoking Lesion are brief and only for agreed-upon contrast.
  *   **Cruxes:** Focuses on concrete, operationalizable disagreements where predictions diverge.
  *   **Verbal Flag:** Explicitly labels and defines the potential ambiguity around "control."
  *   **Outcome:** Does *not* declare a winner. Aims to make the remaining disagreement transparent and focused.
