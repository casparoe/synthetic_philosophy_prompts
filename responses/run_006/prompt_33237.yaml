prompt: |-
  My friend is doing a PhD on religion as a natural phenomenon — she's interested in what kind of thing religion is, not whether any of it is true. As a party trick she sorts things into "religion" and "not religion," and she's been pretty consistant about it. So far:

  - Christianity: religion.
  - Theravada Buddhism: religion (she's adamant you don't need a creator god).
  - Confucianism: religion (ancestor rites and Heaven count, she says).
  - Scientology: religion (being recent, secretive, and a bit rediculous doesn't disqualify it).
  - a Melanesian cargo cult: religion.
  - a football supporters' club with chants, scarves, match-day rituals, and real collective emotion: not religion.
  - a model railway society that meets weekly and has its own jargon and traditions: not religion.

  I want to know what she'd say about two new cases. First: a small revolutionary political group, decades after losing power, whose members meet weekly, venerate the movement's founders almost as saints, treat certain texts and dates as inviolable, and say the movement is what gives their lives meaning — but they explicitly reject anything supernatural. Second: a solitary person with elaborate private beliefs and daily practices directed at spirits and an afterlife, but no community, no shared texts, and no rituals anyone else participates in.

  More important than the verdicts: what rule or rules is she actually running? I can think of at least two rules that fit everything she's said so far, and I want them laid out, with what each predicts for the two new cases, your best guess at her verdicts, and the one further case you'd want to run by her to settle which rule she's using.
reasoning: |-
  Okay, the user's friend has this party trick where she categorizes things as "religion" or "not religion" based on what seems like a consistent pattern. The examples given show that supernatural elements aren't necessary—Theravada Buddhism and Confucianism count without a creator god, and even Scientology and cargo cults are included despite their recent origins or perceived ridiculousness. The football supporters' club and model railway society aren't considered religions, even though they have rituals and traditions.

  Now, the user presents two new cases: a political group that venerates founders, has sacred texts/dates, and gives life meaning but explicitly rejects the supernatural; and a solitary individual with private spiritual beliefs and practices but no community or shared rituals. The user wants to know what rules the friend is using, how each rule would classify these cases, what the friend might actually say, and a test case to distinguish between the two rules.

  First, I need to figure out the underlying rules. From the examples, it's clear that the friend isn't requiring the supernatural. The political group has structure and meaning but no supernatural elements, while the solitary person has supernatural beliefs but no community. The existing examples that weren't classified as religion (football club, model railway) both have community aspects but lack supernatural elements. But since supernatural isn't necessary, community might be key. 

  Possible rules: Rule A might require both a community and transcendent meaning, regardless of supernatural elements. Rule B might require beliefs/practices oriented toward the supernatural/transcendent, regardless of community. 

  For the political group: Under Rule A, they have a community and the movement gives transcendent meaning, so it's religion. Under Rule B, they reject the supernatural, so not religion. The friend might call it religion because it resembles Confucianism, which has rites but not necessarily supernatural.

  For the solitary person: Rule A lacks community, so not religion. Rule B has supernatural beliefs, so it is religion. The friend might say not religion because she emphasized community in the other examples.

  The test case should pit community against supernatural. A group with shared rituals focused entirely on worldly goals, like a self-help group with intense practices but no transcendent claims. If she calls it not religion, she's using Rule B. If she calls it religion, she's using Rule A.

  Need to check if Confucianism fits—it has community and transcendent "Heaven." The political group is similar. Solitary person lacks community, like the model railway but with supernatural, which isn't covered in examples. The friend's consistency suggests community is crucial, so she'd likely say not religion for solitary. For political group, yes because of community and meaning. The test case clarifies if transcendent meaning alone without supernatural suffices.
answer: |-
  Based on the patterns in your friend's classifications, she's likely operating with one of two core rules focused on **community + transcendent meaning** or **orientation toward the supernatural/transcendent**, regardless of specific content. Here's the breakdown:

  ### The Two Likely Rules

  1.  **Rule A (Community + Transcendent Meaning):**
      *   **Definition:** Something is a religion if it involves **a sustained community** bound together by **shared beliefs, practices, rituals, or symbols** that explicitly address **fundamental questions of existence, purpose, morality, or ultimate meaning (transcendent concerns)**, providing a framework for understanding the human condition *beyond the purely mundane or instrumental*.
      *   **Key Features:** Community is essential. The focus is on addressing "big questions" (life/death, meaning, good/evil, origins/destiny) with a depth that goes beyond everyday practicalities. Supernatural elements are *not* required, but the concerns addressed must feel "ultimate" or "transcendent" within the context.
      *   **Why it fits her examples:**
          *   Christianity, Buddhism, Confucianism, Scientology, Cargo Cult: All involve communities bound by practices/beliefs addressing ultimate meaning, morality, origins/destiny, or humanity's place in a larger order (even Confucian "Heaven" or Cult ideas of transformative salvation).
          *   Football Club & Model Railway: Strong communities and rituals exist, but the focus is overwhelmingly instrumental (supporting the team, building models, socializing) and mundane. The emotions and traditions don't address *fundamental human questions* in a sustained, transcendent way. It's passion/hobby, not ultimate meaning.

  2.  **Rule B (Orientation Toward Supernatural/Transcendent):**
      *   **Definition:** Something is a religion if it involves **beliefs and/or practices oriented toward explaining, interacting with, or deriving meaning from forces, entities, realities, or states of being perceived as fundamentally beyond the ordinary, natural, observable world and human control** (e.g., gods, spirits, karma, ultimate reality, salvation, mystical experiences, ancestral realms, supernatural causation).
      *   **Key Features:** The *orientation* towards the supernatural or transcendent is paramount. Community is common but *not strictly necessary* (solitary practice could fit). The core is about engaging with a perceived "more-than-natural" reality. "Transcendent" here specifically means *beyond the natural order*.
      *   **Why it fits her examples:**
          *   Christianity, Buddhism (karma, rebirth, nirvana), Confucianism (Heaven, ancestral spirits), Scientology (thetans, past lives, OT levels), Cargo Cult (supernatural causation of cargo): All centrally involve beliefs/practices directed at non-natural forces, entities, or states.
          *   Football Club & Model Railway: Activities are entirely within the natural, observable, social world. Rituals are about group cohesion and enthusiasm within a shared *human* interest, not appeasing spirits, achieving salvation, or interacting with cosmic forces.

  ### Predictions for the New Cases

  1.  **Revolutionary Political Group (Community, Meaning, NO Supernatural):**
      *   **Rule A Prediction: RELIGION.** It has a sustained community with shared practices (veneration, meetings), inviolable texts/dates (sacred canon/calendar), and explicitly provides ultimate meaning. It directly addresses fundamental questions of purpose, morality (their ideology), and humanity's potential future, even without the supernatural. It mirrors Confucianism's focus on societal order and meaning derived from tradition/ancestors, just substituting political founders/history.
      *   **Rule B Prediction: NOT RELIGION.** They explicitly reject the supernatural. Their beliefs and practices are oriented towards human history, political ideology, and social change within the natural world. Veneration is symbolic/historical, not directed at transcendent entities or states. Meaning is derived from human action and ideals, not interaction with the supernatural.
      *   **Your Friend's Likely Verdict:** **RELIGION.** Confucianism is her key precedent here. Ancestor rites and "Heaven" (which can be somewhat naturalistic/ethical) counted. This group's founder-veneration, sacred texts/dates, and provision of ultimate meaning through a comprehensive worldview fit Rule A perfectly. She's consistently included systems where the transcendent meaning is societal/cosmic order without *requiring* personalized gods (Buddhism, Confucianism).

  2.  **Solitary Practitioner (Supernatural Beliefs/Practices, NO Community):**
      *   **Rule A Prediction: NOT RELIGION.** Lacks the essential element of a *sustained community* with shared beliefs, texts, or rituals. Private belief/practice alone doesn't constitute the social-institutional dimension Rule A requires (like how the model railway club *has* community but lacks meaning; this *has* meaning but lacks community).
      *   **Rule B Prediction: RELIGION.** The beliefs and practices are explicitly oriented toward spirits and an afterlife – realities fundamentally beyond the natural world. The *orientation* is there, even if practiced alone.
      *   **Your Friend's Likely Verdict:** **NOT RELIGION.** Her inclusions all involve social structures (churches, sanghas, lineages, cult groups). The exclusions (football, model trains) highlight the importance of shared social practice, even when meaning is absent. Solitary practice, no matter how elaborate, likely lacks the communal, institutional, tradition-bearing aspect she seems to deem essential. It resembles intense personal spirituality or even delusion, but not "a religion" as a social phenomenon.

  ### The Crucial Test Case to Distinguish Rule A vs. Rule B

  To definitively determine which rule she's using, you need a case that separates **Community + Transcendent Meaning (Rule A)** from **Orientation to Supernatural/Transcendent (Rule B)**. Specifically, you need a strong community with deep, shared meaning focused *entirely* on worldly goals.

  **The Test Case:**
  "A highly disciplined, tightly-knit environmental activist group. They live communally, hold daily meetings structured like rituals (chanting slogans, reading foundational eco-philosophy texts), deeply venerate historical environmental heroes, treat certain ecological principles as sacred, find profound meaning and purpose in their struggle to 'save the Earth', and believe their actions are crucial for the ultimate fate of humanity and life itself. They explicitly reject any supernatural forces, spirits, or afterlife, focusing solely on the natural world and human responsibility."

  *   **Rule A Prediction: RELIGION.** Strong community? Check. Shared rituals/practices? Check. Sacred texts/figures? Check. Explicitly provides ultimate meaning and purpose? Check (fate of humanity/Earth!). Addresses fundamental questions of existence, morality, and humanity's place? Check. Transcendent meaning is found in the cosmic significance of their earthly struggle. Supernatural rejection is irrelevant (like the political group).
  *   **Rule B Prediction: NOT RELIGION.** They explicitly reject the supernatural. Their beliefs and practices are oriented toward the natural world and human action within it. While meaning is profound and "ultimate" in a humanistic sense, it's not derived from or directed at forces *beyond* the natural order. They are engaging with politics, science, and ethics, not spirits, gods, or salvation in a supernatural realm.
  *   **What Her Verdict Reveals:**
      *   If she says **RELIGION**, she's almost certainly using **Rule A (Community + Transcendent Meaning)**. The environmental group fits perfectly alongside the political group and Confucianism.
      *   If she says **NOT RELIGION**, she's prioritizing **Rule B (Orientation Toward Supernatural/Transcendent)**. The lack of supernatural belief/practice disqualifies it, regardless of the community depth or perceived ultimate meaning. It would be analogous to the football club's passion, just scaled up to a cosmic level but still naturalistic.

  **Conclusion:** Based on her adamant inclusion of non-theistic systems like Buddhism and Confucianism, and her exclusion of intensely social but ultimately mundane groups, **Rule A (Community + Transcendent Meaning)** seems the stronger fit for her pattern. Her likely verdicts are **Religion** for the political group and **Not Religion** for the solitary practitioner. Running the environmental activist group test case by her will provide the clearest confirmation of which rule drives her classifications.
