prompt: |-
  I'm on the ethics advisory board of a fertility clinic network, and we're stuck on whether to start offering preimplantation genetic testing for a condition that causes moderate but chronic pain throughout life — not so severe that life isn't worth living, but enough that we'd all agree it's a harm if you have it. The board is split right down the middle. One camp says we have a clear duty to help parents avoid bringing a child into a life of suffering, even if that life is still net-positive overall. The other camp says that's incoherent: if the life is worth living, there's no harm in bringing it about, and we shouldn't be in the business of acting as if there is. The chair asked me to draft a memo laying out a concrete recommendation — approve the testing service, reject it, or approve with conditions — and she specifically wants me to engage with the philosophical puzzle underneath the disagreement, which she called the procreation asymmetry, or something like the asymmetry of harms and benefits in procreation. I'm not a philosopher, just an OB-GYN who got roped into this committee, so I need the memo to actually make the philosophy usable for a clinical policy decision. The strongest argument on the losing side has to be taken seriously, not just dismissed, and the bottom line should be something the board can vote on. I keep going back and forth myself — sometimes I think the asymmetry is obviously right and we'd be reckless to ignore it, and sometimes I think it collapses under its own weight the moment you try to operationalize it in a clinical guideline. Help me sort this out.
reasoning: |-
  Okay, the user is on an ethics advisory board for a fertility clinic and they're stuck on whether to offer preimplantation genetic testing for a condition causing moderate chronic pain. The board is split, and the chair wants a memo with a concrete recommendation that addresses the underlying philosophical puzzle—procreation asymmetry.

  First, I need to unpack the procreation asymmetry. It's the idea that while we have a duty to avoid creating a child with a harmful condition, we don't have a duty to create a child just because they might have extra benefits. The two camps in the board are divided: one says preventing suffering is key even if life is net-positive, the other argues that if life is worth living, there's no harm in creating it.

  The user is an OB-GYN, not a philosopher, so the memo needs to make the philosophy practical for a clinical policy. They need to engage with the strongest opposing argument and provide a clear recommendation—approve, reject, or approve with conditions.

  I should start by breaking down the philosophical concepts into clinical terms. The asymmetry debate is central here. The main concern is whether preventing a life with suffering is obligatory or if it's acceptable since the life is still worth living. 

  The user mentioned that sometimes the asymmetry makes sense, other times it feels shaky when applied to guidelines. So the recommendation needs to navigate this tension. Practical considerations like patient autonomy, clinic liability, and resource allocation are also important. 

  The strongest losing argument is that if the life is net-positive, not creating it denies a potential person a worthwhile life. But the winning argument emphasizes preventing harm when possible. Conditions like moderate chronic pain are different from severe disabilities, so setting thresholds is crucial. 

  The memo should recommend approving the service with strict conditions. That way, the clinic offers the test but ensures thorough counseling to avoid devaluing lives with disabilities. Including conditions like validated pain levels, mandatory counseling, and transparency addresses ethical concerns while respecting patient choice. 

  Need to make sure the memo acknowledges both sides but provides actionable steps. Highlighting that the clinic isn't judging life worth but enabling informed decisions shifts focus to patient autonomy. Also, emphasizing that the condition is non-trivial and chronic justifies intervention. 

  The user's role as an OB-GYN means practical examples and clear guidelines are essential. Using terms like "non-trivial suffering" and "clinical thresholds" makes it tangible. The bottom-line vote should be straightforward for the board to decide, like "Approve PGT-M for Condition X with Conditions 1-4."
answer: |-
  Here’s a draft memo that navigates the philosophical tension, engages both arguments fairly, and delivers a concrete, vote-ready recommendation—grounded in clinical practicality while respecting the ethical complexity.

  ---

  **MEMORANDUM**  
  **TO:** Ethics Advisory Board, [Clinic Network Name]  
  **FROM:** Dr. [Your Name], OB-GYN, Ethics Advisory Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Offering PGT for [Condition Name] – Resolving the Procreation Asymmetry Dilemma  

  ### I. Background & Core Ethical Conflict
  The board is divided on offering PGT (preimplantation genetic testing) for [Condition Name], a genetic disorder causing lifelong moderate chronic pain. Key facts:  
  - Life expectancy is normal; intellectual function is unaffected.  
  - Pain is manageable but persistent, requiring daily intervention (e.g., medication, physiotherapy).  
  - Affected individuals consistently self-report *net-positive* life satisfaction, but cite pain as a significant burden.  

  **The Philosophical Puzzle (Procreation Asymmetry):**  
  - **Camp A ("Prevent Suffering"):** *Even if a life is net-positive, we have a moral duty to prevent avoidable suffering. Choosing an embryo without this condition avoids imposing harm.*  
  - **Camp B ("No Harm in Net-Positive Life"):** *If a life is worth living (net-positive), creating it cannot be a harm. Denying potential parents PGT for this condition respects the equal moral worth of affected lives. Offering it implies such lives are less valuable.*  

  ### II. Engaging the Asymmetry – Making Philosophy Clinically Operational
  The procreation asymmetry (from philosopher Jan Narveson) states:  
  - **We have obligations to *avoid harming* future people (e.g., by preventing serious suffering), but no obligation to *benefit* them by bringing them into existence solely for extra advantages.**  

  **Why Camp B’s Argument is Strong (and Must Be Taken Seriously):**  
  Camp B correctly notes that if [Condition Name] truly results in a net-positive life, selecting *against* an affected embryo does **not** "rescue" a suffering child—it replaces it with a *different* child without the condition. Calling this "harm avoidance" seems incoherent: *the affected child who would have existed is not deprived of a better existence if they are never conceived.* This asymmetry challenges the intuition that we always "help" by selecting embryos without disabilities.  

  **Why Camp A’s Argument Prevails in *This* Clinical Context:**  
  The asymmetry **breaks down** when applied to **preventable, non-trivial suffering** within a net-positive life. Here’s why:  
  1.  **"Harm" is Clinically Actionable Here:** While creating a net-positive life isn’t a *moral wrong*, the *chronic pain itself* constitutes a *clinical harm*. PGT allows us to prevent *that specific harm* for *the child who will exist*. The asymmetry doesn’t negate the duty to minimize suffering when possible; it only questions whether *non-existence* is better. We agree it *isn’t*—but preventing suffering *within existence* remains a core medical ethic.  
  2.  **Parental Autonomy & Reproductive Goals:** Fertility patients seek PGT to have *healthy* children. "Healthy" includes minimizing preventable suffering. Denying access to PGT for a medically significant condition **overrides parental judgment** about what constitutes an acceptable burden for *their* child, contradicting reproductive autonomy.  
  3.  **Operationalizing "Net-Positive":** A "net-positive" life can still contain severe burdens. If we only avoided conditions making life "not worth living," PGT would be limited to extremes incompatible with survival or minimal consciousness. [Condition Name]'s chronic pain is a *medically objective harm* – validated pain scales, treatment burden, and impact on function demonstrate this.  
  4.  **The Slippery Slope is Manageable:** Concerns about devaluing disability are valid but mitigated. This is **not** about selecting for traits like intelligence or height. [Condition Name] causes **moderate chronic pain** – a concrete medical pathology. Clear guidelines prevent scope creep.  

  ### III. Recommendation: APPROVE Offering PGT for [Condition Name] WITH STRICT CONDITIONS
  **VOTE PROPOSAL:** Approve the implementation of PGT-M for [Condition Name] in our clinics, contingent on the following conditions:  

  1.  **Rigorous Patient Counseling Protocol:** Mandatory pre-test counseling must:  
      *   Explicitly state that individuals with [Condition Name] lead fulfilling, net-positive lives.  
      *   Focus on **preventing the child’s pain burden**, not "avoiding a life not worth living."  
      *   Involve a genetic counselor *and* a clinician experienced in managing [Condition Name] to discuss realistic disease impact.  
      *   Include discussion of the embryo selection process and the nature of the decision.  
  2.  **Clear Clinical Inclusion Criteria:** Limit testing to conditions with **objective, documented medical impact** equivalent to or greater than [Condition Name] (e.g., validated pain severity scores, functional impairment metrics, daily treatment burden). A standing committee reviews future conditions against this threshold.  
  3.  **Explicit Non-Directiveness:** Counseling must emphasize that selecting an embryo *with* [Condition Name] is a valid, respected choice. The clinic supports all parental decisions post-testing.  
  4.  **Transparency & Audit:** All counseling materials and decision pathways will be documented and reviewed annually by the Ethics Board to prevent discriminatory practices or mission creep.  

  ### IV. Why This Recommendation Resolves the Asymmetry Conflict
  *   **Honors Camp B’s Insight:** By mandating counseling that affirms the worth of lives with [Condition Name] and focusing on preventing *suffering within life* (not avoiding "wrongful life"), we respect the core of the asymmetry argument.  
  *   **Empowers Camp A’s Core Principle:** It enables parents to act on their legitimate desire to prevent a significant, lifelong medical burden for their child, fulfilling medicine's duty to prevent harm where possible.  
  *   **Provides Clinical Guardrails:** Conditions ensure decisions are based on medical impact, not subjective preferences for "enhancement," directly addressing operational concerns.  

  **Bottom Line for Vote:** This policy allows us to offer a clinically meaningful service that reduces preventable suffering, respects parental autonomy, and affirms the value of all lives, while containing the ethical risks through robust safeguards. It translates complex philosophy into actionable, ethical clinical practice.

  ---

  **Key Strengths of this Approach for Your Board:**
  1.  **Philosophy Made Practical:** It directly confronts the asymmetry debate but pivots to a clinical framework ("preventing suffering within life" vs. "judging life worth").
  2.  **Respects Both Sides:** Camp B's deepest concern (devaluing disability) is addressed via counseling and non-directiveness. Camp A's core goal (preventing harm) is achieved.
  3.  **Actionable & Vote-Ready:** Clear "Approve WITH Conditions" structure provides a concrete policy outcome.
  4.  **Mitigates Your Concerns:** Avoids the "collapse" of the asymmetry by not relying on it *alone* – it integrates medical ethics, autonomy, and clinical reality.
  5.  **Reduces Liability:** Clear protocols and documentation protect the clinic.

  **Recommendation:** Present this memo, emphasizing the **conditional approval** as the bridge between the two camps. Focus the board's vote on the *package*: the service is approved *only if* the stringent conditions are implemented. This turns philosophical stalemate into actionable policy.
