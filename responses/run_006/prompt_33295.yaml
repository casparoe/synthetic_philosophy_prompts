answer: |-
  The late afternoon sun slanted through the tall windows of the university common room, catching dust motes dancing in the air. Dr. Aris Thorne, leaning forward intently, set his teacup down with a soft clink. "Professor Voss, the fundamental flaw in the traditional doctrine is its wilful blindness to the *reason* one fights. How can we possibly say a soldier advancing an unjust aggression – invading a peaceful neighbour, say – occupies the same moral ground as the defender repelling that invasion, simply because both avoid targeting civilians? The defender kills to protect their home, a proportionate response to imminent harm. The aggressor kills to impose an unjust occupation. Their act of killing *cannot* be proportionate, because it serves no legitimate end that could outweigh the terrible cost of taking a life."

  Professor Lena Voss adjusted her glasses, her expression calm but firm. "Aris, I understand the intuitive pull of your position. It feels deeply wrong to equate the defender with the invader. But the symmetry of *jus in bello* exists precisely to prevent wars from descending into total annihilation, regardless of who started it. By insisting the unjust combatant is inherently a murderer, you dissolve the crucial distinction between combatant and civilian *for the unjust side*. If their killing is always illegitimate, why should the just side *ever* refrain from targeting them? More terrifyingly, what prevents the unjust side, believing *they* are just, from reciprocating? Your revisionism risks eroding the very conventions that mitigate suffering in war."

  Thorne acknowledged the point with a nod. "A grave concern, Lena, and one I take seriously. But I believe you conflate moral judgment with practical rules. Granting that an unjust combatant commits a wrong by killing does *not* mean they lose their own right not to be killed indiscriminately, or that they become legitimate targets for any means whatsoever. Their action is wrongful because it lacks a justifying cause, not because they suddenly cease being human beings deserving of basic protections. Indeed, the revisionist position *strengthens* the demand to protect civilians, precisely because it highlights that *only* combatants actively pursuing an unjust cause are potentially liable to defensive harm – but even then, within strict limits."

  Voss countered swiftly. "You place an impossible burden on the individual soldier. How is a conscript, fed state propaganda, possibly equipped to judge the macro-level justice of their nation's cause? The traditional view offers clear, operationalizable rules: follow the laws of armed conflict. Your view demands soldiers become moral philosophers in the fog of war, potentially refusing lawful orders based on a contested judgment about the war's overall justice. Isn't this a recipe for chaos and selective conscientious objection that undermines military discipline and the very possibility of restraint?"

  "Chaos already exists," Thorne replied quietly. "It's called war. The traditional view *doesn't* absolve that conscript; it merely shifts the blame entirely to the leaders. But morality isn't so easily compartmentalized. Pulling the trigger isn't a neutral act. We accept that a civilian who kills an intruder in self-defence acts justly, while the intruder committing murder acts wrongly. Why should a uniform magically erase that fundamental moral asymmetry? The conscript fighting for aggression *is* doing moral wrong, even if coercion or ignorance mitigates their *culpability*. Recognizing this doesn't require perfect knowledge, but it does require acknowledging that fighting for an unjust cause transforms the nature of the act."

  Voss leaned back, steepling her fingers. "But that’s where the practical danger lies, Aris. By denying moral equality, you implicitly license the *just* side to view the *unjust* combatants not just as enemies, but as criminals. History shows this perception quickly dehumanizes the opponent. If they are 'wrongdoers' rather than 'fellow soldiers', doesn't that lower the barrier to harsher treatment, summary execution, or refusing quarter? The traditional symmetry forces both sides to see the other as soldiers bound by shared rules, creating a reciprocal basis for restraint."

  "Does it?" Thorne challenged. "Or does that very symmetry *enable* unjust wars by sanitizing the killer's role? Your doctrine effectively tells the aggressor: 'As long as you kill cleanly, your killing for conquest is morally equivalent to the defender killing for survival.' That's not restraint; that's a moral blank check for aggression. It licenses killing in the service of manifestly evil ends, provided the technicalities of *jus in bello* are followed. Doesn't *that* erode the fundamental moral prohibition against killing?"

  Voss met his gaze steadily. "The prohibition isn't absolute; we accept killing in self-defence. The traditional view locates the deep injustice in the *decision to wage unjust war* – a decision made by states and leaders. Holding individual soldiers, caught in that machinery, morally responsible for the macro-cause risks absolving the true architects while punishing the pawns. Worse, it potentially justifies any brutality against those pawns. My fear is that abandoning symmetry won't stop aggression, but it *will* make the wars we inevitably have far more savage. The symmetry is a tragic necessity born of war's inherent hellishness, a firewall against it becoming infinitely worse."

  Thorne sighed. "A tragic necessity? Perhaps. But I see it as a profound moral evasion. We cannot build a firewall on a foundation that ignores the fire's origin. Yes, holding soldiers accountable for their leaders' sins is complex. Yes, maintaining *jus in bello* rules is paramount. But we must find a way to condemn the act of killing for injustice *without* abandoning those vital constraints. To say the defender protecting their home and the invader seizing it are moral equals, simply because both wear uniforms and follow targeting protocols, is to drain the very concept of justice of its meaning. It confuses procedural adherence with moral innocence."

  The silence stretched between them, filled only by the distant sounds of the university. Voss finally spoke, her voice softer. "And I fear, Aris, that insisting on that moral inequality in the crucible of conflict will inevitably corrode the procedures that offer the only shred of humanity left. We may want a world where only just warriors fight cleanly, but we live in a world where unjust warriors fight too, and restraining *them* requires rules they believe apply equally."

  Thorne offered a weary smile. "Then we remain at an impasse, Lena. You see symmetry as the practical shield against barbarity. I see it as a moral capitulation that licenses too much. Both paths are fraught. The ethics of war, it seems, offers no easy answers, only hard choices between terrible alternatives." The dust motes continued their dance in the fading light, indifferent to the weight of the argument hanging in the air.
