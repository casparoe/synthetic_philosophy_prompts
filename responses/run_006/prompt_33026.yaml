  ## Eulogy for Martin

  **One:**  
  Fifteen years ago, Martin walked away. He left his home, his wife, his young daughter – everything that looked, from the outside, like a good and settled life. To most, it was inexplicable. A betrayal. A fracture that never healed. He knew it would look that way. He knew the cost, counted it in advance, and still walked through that door. He didn’t offer explanations then, and rarely defended himself afterwards. The silence wasn’t indifference; it was part of the terrible calculus. He understood why his family, why anyone, would see only abandonment. That pain is real, and it sits here with us today. He wouldn’t ask you to forget that. He wouldn’t dare.

  **Two:**  
  Martin believed, profoundly, in something Kierkegaard called the ‘teleological suspension of the ethical’. Not as an academic theory to be debated over sherry, but as a terrifying, lived possibility. He taught *Fear and Trembling* for thirty years, wrestling with Abraham’s awful journey up Mount Moriah. Martin genuinely held that a moment might come – a stark, solitary imperative – where the usual rules, the universal ‘right’, must be set aside for the sake of something higher. Something absolute, personal, and utterly beyond explanation. He didn’t claim this lightly. For him, caring for his dying former student, that person utterly alone and facing the abyss, wasn’t merely a kindness. He saw it as that suspension. A dreadful duty laid upon *him*, specifically, that outweighed the ethical demands of family and society.

  **Three:**  
  So he went. He moved countries. He bathed, fed, comforted, and bore witness to the long, grim unraveling of a degenerative disease. Day after day, year after year. It wasn’t glorious. It was bedpans and bureaucracy, exhaustion and helplessness, the grinding labour of presence when hope is gone. He did it without fanfare, without expecting understanding, certainly without forgiveness. He did it because he believed, in the marrow of his bones, that failing to do it would be a deeper betrayal – a betrayal of that inexplicable, absolute demand he felt placed upon him. His faith wasn’t in reward or recognition; it was in the necessity of the act itself, however costly, however misunderstood.

  **Four:**  
  And the cost was immense. Paid first and most bitterly by his wife and daughter, who lost a husband and father. Paid by the life he left behind, the career assumptions he shattered, the friendships strained by his silence and absence. Paid by Martin himself, living with the consequences, the isolation, the judgment. He knew the ledger wasn’t balanced. He didn’t believe his higher purpose erased the devastation left in its wake. He carried that knowledge heavily. The man who did this wasn’t ‘nice’. Nice men don’t shatter lives on principle. He was, as he asked me to convey, something far more uncomfortable: a man who acted from a conviction so absolute it overrode every other claim, including his own happiness, his reputation, and the bonds he cherished most.

  **Five:**  
  So what are we left with? Not a comfortable legacy. Not a neatly resolved story. We have a brilliant scholar who lived the most challenging idea he taught, not in metaphor, but in flesh and consequence. We have a man who chose a path of radical, isolating responsibility, believing it was demanded of him by something beyond society’s ethics. And we have the undeniable wreckage of that choice – hearts broken, relationships severed, a lifetime of anger and confusion. Martin wouldn’t ask for your absolution. He wouldn’t expect his daughter’s anger to soften. He asked only for something harder: for us to stand here, looking at the whole, terrible paradox of his life and his choice, and perhaps – just perhaps – begin to understand the terrifying weight of the conviction that drove him, even if we can never agree with the cost. That was Martin. Uncompromising, difficult, and utterly committed to the terrifying call he believed he heard.
