answer: |-
  This is a brilliantly articulated impasse, and your suspicion about its deeper nature is perceptive. You're not stuck on the *exegesis* of Peirce and James; you're stuck on fundamentally different **philosophical projects** for a theory of truth. This is a **meta-philosophical disagreement about the explanatory goals and scope of a theory of truth itself.** Here's the structural diagnosis:

  1.  **The Core Disagreement: Two Irreconcilable Projects:**
      *   **Camp 1 (James Distorted Peirce):** Their implicit project is **defining the metaphysical nature** or **ideal normative standard** of truth. They seek a *guarantee of objectivity* and a *bulwark against relativism*. For them, truth *must* be:
          *   **Mind-independent:** Existing regardless of what any individual or even current community believes.
          *   **Convergent:** Anchored in a process that *would* lead all rational inquirers to the same conclusion.
          *   **Normative:** Providing a standard *against which* current beliefs and practices can be judged.
          *   **Counterfactual:** Defined by an ideal limit, not contingent on actual human limitations or successes.
          *   Peirce's "fated agreement" satisfies this project. James's "expediency" and "cash-value," focusing on individual/present satisfaction, seem to abandon these crucial features, reducing truth to mere subjective utility.
      *   **Camp 2 (James Operationalized Peirce):** Their implicit project is **providing an epistemological criterion** or **practical guide for inquiry and belief**. They seek something *actionable* and *verifiable in experience*. For them, a theory of truth *must*:
          *   **Be applicable *now*:** Tell us when we are *warranted* in calling a belief true *in practice*, not just in some idealized future.
          *   **Explain belief fixation:** Account for how beliefs *actually* become accepted as true and function successfully in our lives.
          *   **Demystify:** Avoid empty abstractions ("fated agreement") that cannot be cashed out in terms of concrete consequences or experiences.
          *   **Be pluralistic:** Account for the diverse ways beliefs function as "true" in different domains (science, morality, religion) without requiring identical convergence mechanisms.
          *   Peirce's "fated agreement" is seen as an unhelpful abstraction without James's operationalization. James's "works" *is* the practical meaning of Peirce's ideal – it's how the "fated agreement" manifests *for us, now*, in successful guidance.

  2.  **Why It's Not Primarily Verbal, Substantive (in the simple sense), or Underdetermined:**
      *   **Not (Just) Verbal:** Both sides *are* talking about the same concept – truth as a property of beliefs. The disagreement isn't about the *word* "truth" meaning different things, but about *which features* of that concept are essential and which project (metaphysical definition vs. practical criterion) takes priority.
      *   **Not (Simply) Substantive:** It's not that one side is clearly "wrong" about what truth *is* in a vacuum. The disagreement stems from prioritizing different *desiderata* for a *theory* of truth. Camp 1 thinks Camp 2 sacrifices objectivity; Camp 2 thinks Camp 1 offers an unusable abstraction. Each side sees the other as failing at what *they* consider the core task of a truth theory.
      *   **Not (Merely) Underdetermined by Peirce:** While Peirce's texts *can* support both readings, the *intensity* of the disagreement arises because each camp interprets him *through the lens of their own preferred project*. Camp 1 sees Peirce prioritizing the ideal norm; Camp 2 sees him gesturing towards the practical criterion (which James developed). The texts aren't silent, but they don't *force* one project over the other. Peirce *was* doing both to some degree, but the tension within his own thought is amplified into a chasm between your camps.

  3.  **The Nature of the Impasse: Divergent Explanatory Desiderata:**
      This is the crux. **The disagreement is fundamentally about the *explanatory priorities* for a theory of truth.** They don't share the same standards of success:
      *   **Camp 1's Success Criteria:** Does the theory secure objective validity? Does it prevent truth from collapsing into subjective preference? Does it define an ideal standard?
      *   **Camp 2's Success Criteria:** Does the theory provide a usable guide for inquiry? Can it explain how beliefs *actually* become true *for us*? Does it avoid empty metaphysical promises?
      *   Arguments from one side *will not* convince the other because they are judged irrelevant to the *real* job of a truth theory, as defined by the opposing camp. Camp 1 sees Camp 2 as dangerously relativistic; Camp 2 sees Camp 1 as offering a useless fiction. Appeals to the texts bounce off because each side finds evidence supporting *their* prioritized project.

  **Moving the Debate (or Clarifying the Stuckness):**

  Forcing agreement is unlikely. The goal should shift to **mutual understanding of the meta-philosophical divide** and appreciating why the other side values what they do. Here's how to try:

  1.  **Explicitly Name the Projects:** State the two projects clearly: "Project Normative Ideal" vs. "Project Practical Criterion." Ask members to articulate *why* their chosen project is more important/central to the *concept* or *function* of truth. What does the other project *fail* to provide that is essential?
  2.  **Apply the Theories to Concrete Cases:** Pick specific, difficult examples (e.g., a scientific theory superseded after centuries; a deeply held religious or moral belief; a historical claim where evidence is lost; a successful practical belief based on incomplete information). Ask:
      *   How would Peirce's "fated agreement" apply here? *Can* it be applied meaningfully *now*? What work does it *do*?
      *   How would James's "works" apply? Does it capture the sense in which we want to say the belief is "true"? Where does it potentially lead us astray?
      *   Which theorist provides the more *useful* or *insightful* framework for *understanding this case*? Why?
      This exposes the strengths and weaknesses of each project in practice.
  3.  **Interrogate "The Community":** Both Peirce and James use "community," but differently. For Peirce, it's the *ideal* community of inquirers over the *long run*. For James, it's often the *actual* community whose needs and experiences validate an idea *now*. Explore this difference: Is the "community" a regulative ideal or a concrete social group? How does this difference relate to the two projects?
  4.  **Consider Peirce's Later Self-Correction:** Introduce Peirce's 1908 critique of James ("pragmaticism"). He explicitly rejects making "satisfaction" the *definition* of truth, reaffirming convergence as the ideal limit. Ask Camp 2: Does this invalidate the "operationalizing" reading, or is Peirce just retreating from the full practical implications? Ask Camp 1: Does this settle the issue definitively in their favor, or is it just Peirce doubling down on *his* preferred project?
  5.  **Accept the Duality (and Tension):** Conclude that pragmatism, even within Peirce, *contains* this tension. Peirce offers a powerful regulative ideal for scientific inquiry (Project Normative Ideal). James offers a radical account of how beliefs function meaningfully in human life (Project Practical Criterion). They are not *simply* compatible, nor is one simply a distortion of the other. They represent different, valuable, but ultimately competing philosophical emphases within the pragmatic tradition. Recognizing this tension *is* a significant philosophical insight.

  **Conclusion:**

  Your group is experiencing the **inherent creative tension at the heart of pragmatism.** It's not a textual puzzle to solve but a fundamental philosophical choice about what a theory of truth is *for*. Moving the debate means shifting from "Who's right about Peirce/James?" to "What *should* a theory of truth prioritize, and why?" This won't necessarily resolve the disagreement, but it will transform it from a frustrating stalemate into a clearer, more productive exploration of the deep meta-philosophical commitments driving the interpretations. The "stuckness" itself reveals something crucial about the nature of truth and the tasks of philosophy. Clarifying *why* you're stuck is, in this case, genuine progress.
