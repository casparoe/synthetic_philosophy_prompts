  Okay, let me start by unpacking the user's query. They’re designing a grad seminar on social norms, pairing Lewis's "Convention" with Golding's "Lord of the Flies." The core idea is using the island as a natural experiment to observe how social order forms and collapses. The user is stuck on two main theoretical issues: the normative dimension of conventions and the collapse due to shifting preferences.

  First, I need to recall Lewis's definition of convention. He sees it as a solution to coordination problems—arbitrary but mutually beneficial when everyone follows it. The conch in the novel is a perfect example: it coordinates speaking turns. But the user points out that the conch quickly gains normative weight. When Jack smashes it, it's not just a coordination failure but a moral violation. Lewis mentions sanctions as a way norms emerge, but the user feels this misses the boys' internal sense of obligation. They follow the conch because it feels right, not due to fear of punishment. So, is Lewis overlooking moral psychology?

  Next, the collapse. Lewis assumes stable preferences, but in the novel, the boys' desires change due to fear, hunger, and lack of authority. Their shift from wanting order to embracing savagery undermines the convention. How does Lewis account for such motivational shifts?

  The user wants a reading that uses Lewis but lets the novel challenge the theory. Where does "Lord of the Flies" confirm Lewis, and where does it complicate his model? They might need to highlight these tensions to spark class discussion.

  Digging deeper, the user’s unspoken needs might include wanting to show students how literature can test philosophical theories. They probably aim to explore the limitations of rational-choice models in explaining real human behavior. The seminar’s success hinges on presenting both alignment and friction between the texts, encouraging critical thinking about social norms' fragility.

  For the normative aspect, Bicchieri's work on normative vs. empirical expectations could bridge Lewis’s gaps. The boys start with empirical expectations (others follow the conch) which evolve into normative ones (they ought to). The sacredness of the conch ties to collective rituals, something Lewis doesn’t address. The collapse part needs examining preference transformation—how primal needs override cooperative preferences. Lewis's static model doesn’t handle this, so theorists like Brennan et al. on corrosive effects might help.

  The user might also appreciate discussing how conventions gain moral weight through internalization and group identity. Jack's rebellion isn’t just preference shift; it’s a rejection of the group’s identity tied to rules. Golding’s pessimism about human nature versus Lewis’s rationalism could be a rich debate point.

  In conclusion, the seminar can use Lewis to frame initial convention formation but use the novel to push beyond, exploring moral psychology and preference instability. Highlighting where the texts align and diverge will deepen students' understanding of social norms’ complexity.
answer: |-
  This is an *excellent* pairing and precisely highlights the fascinating tensions between Lewis's elegant, rational-choice framework and the messy, morally charged reality of norm formation and collapse depicted by Golding. Here's how Lewis helps analyze the novel, where the novel pushes back against Lewis, and what theoretical additions might be necessary:

  ## Where Lewis Illuminates "Lord of the Flies" & Confirms Convention

  1.  **The Conch as a Textbook Coordination Solution:** As you note, the conch rule perfectly fits Lewis's core definition:
      *   **Recurrent Coordination Problem:** Taking turns speaking effectively in a group meeting.
      *   **Arbitrary Regularity:** The conch itself is arbitrary (stick, rock, hat could work).
      *   **Conditional Preference:** Each boy prefers to speak only when holding the conch *if* others are also silent and waiting for the conch. Chaos is worse than waiting your turn.
      *   **Alternative Possible:** They explicitly discuss other rules ("Hands up!") but settle on the conch. It *works* initially, allowing order and collective decision-making.

  2.  **Emergence of Sanctions:** Lewis does discuss how conventions become norms through sanctions. We see this nascently:
      *   Ralph's early authority stems partly from initiating the conch rule and enforcing it ("I got the conch!").
      *   Piggy is the most vocal enforcer, becoming the "sanctioning mechanism" (calling out violators, appealing to the rule's sacredness).
      *   Social disapproval exists for minor breaches before the descent.

  3.  **Common Knowledge Requirement:** Lewis emphasizes the importance of *common knowledge* for conventions to stabilize. The initial assembly explicitly establishes the rule ("I'll give the conch to the next person to speak"). Everyone sees everyone else seeing the rule being established and followed initially.

  ## Where "Lord of the Flies" Complicates and Challenges Lewis

  This is where things get really interesting for your seminar:

  1.  **The Normative Weight: Beyond Conditional Preference & Sanctions:**
      *   **Sacralization:** The conch isn't just a tool; it becomes a *symbol* of order, legitimacy, and civilization itself. Golding imbues it with almost mystical significance ("the fragile shining beauty of the shell"). Smashing it isn't just breaking a rule; it's destroying the *idea* of order and shared humanity. Lewis's model explains *why* the rule is followed, not *why* it feels morally binding or sacred.
      *   **Internalization:** The boys (especially Piggy, Ralph, Simon) don't just follow the rule because others do and it's useful; they believe *it is right*. They experience a sense of duty or propriety attached to it. Lewis largely bypasses this internal moral psychology of obligation.
      *   **Group Identity & Ritual:** The conch ritual creates a sense of group identity ("the tribe"). Following it signifies belonging to the "civilized" group. Violating it isn't just inefficient; it's *disloyal* or *barbaric*. Lewis focuses on individual preferences coordinating, not the role of norms in constituting group identity.

      ***Lewisian Gap:*** Lewis provides a functional explanation for the *emergence* and *stability* of conventions but lacks a robust account of how they acquire *intrinsic normative force* – the sense that "this is *our* way" or "this is *just how things are done*" beyond pure utility or sanction-fear. The novel demands an account of **internalization, symbolic meaning, and the role of norms in constructing social reality and identity.**

  2.  **The Collapse: Shifting Preferences & the Fragility of Conventions:**
      *   **Preference Transformation:** Lewis assumes relatively stable underlying preferences ("everyone prefers to conform conditional on others conforming"). Golding shows these preferences *radically changing*:
          *   **Fundamental Needs vs. Coordination:** Immediate survival needs (hunger, fear of the beast) overwhelm the preference for orderly meetings. Hunting provides tangible, immediate rewards (meat, excitement, dominance) that speech coordination cannot match.
          *   **Shift in Values:** The desire for order, fairness, and rescue (embodied by Ralph/Piggy) is supplanted by the desire for power, release, violence, and primal belonging (embodied by Jack). The *preference conditional on others conforming* evaporates for Jack's faction. They *prefer* a different state – one of dominance and fear – which isn't an alternative coordination equilibrium but a breakdown of coordination itself.
          *   **Erosion of Common Knowledge:** Fear fragments the group. Trust evaporates. Jack's tribe no longer recognizes the conch's legitimacy or Ralph's authority. The common knowledge underpinning the convention dissolves – they don't all know that others know the rule still applies or should be followed.
      *   **From Equilibrium to Anti-Equilibrium:** Lewisian conventions shift between stable equilibria. The descent into savagery isn't a shift to an alternative *coordination* equilibrium (like using a stick instead of a conch). It's a collapse into a **non-cooperative, conflictual state** driven by fear, primal impulses, and a new, brutal hierarchy enforced by violence, not mutual agreement. This state *doesn't solve coordination problems*; it eliminates the *desire* for the kind of coordination the conch represented. The problem becomes dominance/submission, not turn-taking.

      ***Lewisian Gap:*** Lewis's model assumes **stable, underlying preferences** focused on solving coordination problems. It struggles with scenarios where:
          *   Fundamental needs destabilize the context for coordination.
          *   Preferences *themselves* are transformed by fear, scarcity, or social dynamics (like the thrill of power or groupthink).
          *   The "problem" ceases to be seen *as* a coordination problem requiring mutual solution, replaced by a zero-sum power struggle.
          *   **External Shocks & Motivational Instability:** Lewisian conventions exist in a kind of motivational vacuum. The novel screams that context matters *dramatically* – hunger, fear, absence of ultimate sanctions (adults), isolation, and the specific psychological makeup of the boys (children, not fully socialized adults) are *essential* to understanding why the convention collapses. Lewis doesn't provide tools to model how external pressures or group composition can corrode the very preferences that sustain conventions.

  ## How Lewis Might Respond & Necessary Additions

  *   **Lewis's Possible Defense:** Lewis might argue that the normative weight *is* explained by sanctions, just internalized ones (guilt, shame) and social exclusion. He might also say that the shift in preferences *is* the key – the convention collapsed because the conditional preferences supporting it vanished. The boys' "preference for order" was always fragile and conditional on other needs being met. Once those needs weren't met, the convention became unstable.
  *   **Necessary Additions to the Lewisian Framework for the Novel:**
      *   **Moral Psychology & Internalization:** Theories like Cristina Bicchieri's work on **normative vs. empirical expectations** are crucial here. Boys initially follow the conch based on *empirical expectations* (they see others doing it and expect them to continue). But Golding shows this evolving into *normative expectations* (they believe others *think they should* follow it, and they *themselves* feel they *should* follow it). Understanding *how* empirical expectations become normative, and the role of identity and symbolic meaning in this process (e.g., **Brennan, Eriksson, Goodin, & Southwood** on the "normative grip"), is essential.
      *   **Symbolism & Ritual:** Incorporating insights from anthropology/sociology (e.g., **Durkheim** on the sacred/profane, collective effervescence) helps explain why the conch becomes more than a tool. Rituals (assemblies) imbue objects/rules with meaning.
      *   **Preference Endogeneity & Context:** Lewis needs supplementing with theories acknowledging that preferences aren't static but are shaped by social context, biological drives, emotions (fear!), and power dynamics. The work of **Jon Elster** on emotions and rationality, or **Robert Frank** on passions within rationality, is relevant. Models incorporating how scarcity or threat **corrodes cooperative preferences** (e.g., **Brennan & Pettit** on the "economy of esteem" being fragile) are needed.
      *   **Power & Conflict:** Lewis focuses on mutual benefit. Golding shows power dynamics (Jack vs. Ralph) and conflict as fundamental drivers of collapse. Integrating how conventions can be tools of dominance or sites of contestation (e.g., **Marxist** or **Foucauldian** critiques) provides a necessary counterpoint.
      *   **Developmental Psychology:** The fact they are *children* matters. Their capacity for self-regulation, internalization of norms, and susceptibility to fear/group pressure is different from adults. Lewis's model is agnostic to this.

  ## Conclusion & Seminar Direction

  *   **Lewis Confirmed:** The novel brilliantly illustrates the *initial emergence* of a Lewisian convention to solve a clear coordination problem, showing its functionality and arbitrary nature.
  *   **Lewis Challenged:** The novel powerfully demonstrates:
      *   How conventions rapidly acquire *normative weight* and *symbolic meaning* that Lewis's functional/sanction-based account struggles to explain.
      *   How the *fragility* of conventions stems not just from coordination failure within stable preferences, but from the *transformation of preferences themselves* under pressure (fear, hunger, power lust).
      *   How the collapse isn't a shift to a new convention but a descent into a state where the *desire for cooperative coordination dissolves*, replaced by conflict and dominance hierarchies.

  **For Your Seminar:** Frame the discussion around these tensions. Use Lewis to analyze the *establishment* of the conch rule. Then use the novel's depiction of its normative force and eventual collapse to push students to ask:

  1.  *Where does the "ought" come from?* How does a tool become sacred? (Explore internalization, identity, symbolism).
  2.  *How stable are our preferences really?* What happens to conventions when fundamental needs are threatened or primal fears take hold? (Explore preference endogeneity, context-dependence, the role of emotion/fear).
  3.  *Is Lewis's model sufficient to explain norm collapse, or just norm formation?* Does it capture the descent into non-cooperative states, or only shifts between equilibria?
  4.  *What does the boys' age tell us?* Does Lewis assume fully formed rational agents, ignoring developmental stages crucial for norm internalization?

  This pairing forces a confrontation between the elegance of rational-choice models and the messy, affect-laden reality of human sociality. Golding shows that conventions aren't just solutions; they are fragile vessels of meaning and order, easily shattered when the darker, more fundamental layers of human motivation are exposed. Lewis gives you the blueprint for the initial construction; Golding shows the explosive forces that can bring it down and why the wreckage feels so profoundly wrong. Your seminar will be richer for grappling with both perspectives.
