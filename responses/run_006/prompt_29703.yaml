prompt: |-
  In my reading group on Integrated Information Theory, someone keeps saying "consciousness is integrated information" as if that settles things, most recently to shut down a question about whether a system could have high Φ and no experience at all, or low Φ and some faint something-it's-like. I can't tell exactly what work its doing. What are the distinct precise claims that one sentence could be making — from a weak correlation claim to a strict identity claim to an explanatory claim about the structure of experience? Lay out the readings as a menu, say for each whether it's trivial, substantive-but-defensible, or false, and tell me which reading the dismissal actually needs. Please structure the response as: "Readings" (4-6 bulleted claims, a sentence or two each, roughly 300 words total), "Verdicts" (one or two lines per reading, roughly 200 words total), and "What the dismissal needs" (a short paragraph, roughly 150 words).
