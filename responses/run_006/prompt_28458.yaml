answer: |-
  Here are seven desiderata for an adequate scientific realist position:

  1.  **Explain Empirical Success:** Must explain why successful theories produce accurate predictions and novel discoveries. Motivated by the 'No-Miracles Argument' – it would be miraculous if false theories were consistently empirically successful. **Non-negotiable** for core realism.

  2.  **Withstand Pessimistic Meta-Induction (PMI):** Must explain why past successful theories being discarded doesn't entail current successful theories are also false. Motivated by Laudan's list of once-successful, now-rejected theories. **Non-negotiable** to avoid refutation by historical record.

  3.  **Resolve Underdetermination:** Must address the problem that multiple distinct theories can be compatible with all available empirical data. Motivated by cases like Descartes vs. Newton on gravity. **Non-negotiable** to show evidence uniquely supports realist commitments.

  4.  **Account for Theory Change:** Must explain how belief revision and theory replacement can be rational progress rather than anarchic replacement, without assuming convergence to a final truth. Motivated by historical cases like the phlogiston-oxygen transition. **Non-negotiable** to avoid naïve convergence realism.

  5.  **Accommodate Idealization:** Must reconcile the pervasive use of false or distorting assumptions (e.g., frictionless planes, point masses) with commitments to truth. Motivated by the indispensability and productivity of idealizations in science. **Non-negotiable** for realism about actual scientific practice.

  6.  **Demonstrate Continuity:** Must show a substantive connection between successive theories, preserving some referential or structural elements across theory change. Motivated by the need to see science as cumulative rather than disconnected revolutions. **Strong preference**, but **eliminates many positions** (e.g., entity realism often fails here if entities are abandoned).

  7.  **Specify Commitments:** Must provide clear criteria for *what* aspects of theories (e.g., entities, structures, specific claims, mechanisms) we are committed to as approximately true. Motivated by the need to avoid vacuous commitments and answer selective skepticism. **Non-negotiable** for a defined position; **serious tension** with **Explain Empirical Success** as robust commitments aid explanation but clash with **Withstand PMI** which forces weaker, more selective commitments, risking explanatory power.
