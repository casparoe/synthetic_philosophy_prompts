  The user wants a strict sonnet structure: octave establishing complete physical knowledge, volta at the moment of seeing color, sestet showing genuine epistemic gain. Key challenge: show it's not just emotional but a cognitive revelation. Must satisfy philosophy-savvy readers while moving lay readers.

