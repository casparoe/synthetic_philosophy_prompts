  Then Waterloo. The rain delaying the battle—fortuna. Grouchy not engaging Blücher—fortuna, but also Napoleon's misallocation of resources. Blücher's arrival is fortuna, but Napoleon didn't adapt. 

  The user asks if Waterloo refutes Machiavelli's idea that impetuous leaders are better. Here, Napoleon was impetuous but failed. Maybe it's because he lacked adaptability, a key part of virtù. His earlier successes were due to adapting, but in 1815, he was rigid. So it's not that impetuousness is bad, but without adaptability, it fails.

