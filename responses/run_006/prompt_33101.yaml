answer: |-
  ## Proposal: The Dual Demands of Frege-Geach: Compositional Success vs. Attitudinal Failure in Expressivism

  **1. Research Question:** Can expressivist metaethical theories satisfy the *compositional demand* of the Frege-Geach problem (providing a uniform semantics for normative sentences in embedded contexts) while failing to satisfy the distinct *attitudinal demand* (explaining the genuine inconsistency and entailment relations holding between the non-cognitive attitudes expressed by those sentences, particularly regarding negation)?

  **2. Core Thesis & Motivation:** The standard presentation of the Frege-Geach problem as a monolithic challenge for expressivism obscures a crucial distinction. There are two logically separable demands:
      *   **The Compositional Demand (CD):** Provide a semantic account that assigns plausible meanings (or contributions to truth-conditions/assertability-conditions) to normative sentences (e.g., "Murder is wrong") when they appear in logically complex contexts (negation, conditionals, disjunctions, etc.), ensuring syntactic well-formedness and accounting for the surface validity of arguments like modus ponens involving them.
      *   **The Attitudinal Demand (AD):** Explain why the *specific non-cognitive mental states* expressed by atomic normative sentences (e.g., disapproval of murder for "Murder is wrong") and their complex counterparts (e.g., the state expressed by "Murder is not wrong" or the premise-states in a modus ponens inference) genuinely stand in relations of *inconsistency* and *entailment* that mirror the logical relations of the sentences expressing them. The core challenge is explaining *why* accepting "Murder is wrong" and "Murder is not wrong" involves a rationally criticizable inconsistency *at the level of the speaker's attitudes* (Schroeder's "Negation Problem").

  I suspect that prominent expressivist solutions primarily address CD, offering formally adequate compositional semantics that mimic logical relations syntactically or via complex state specifications. However, they often *presuppose* or *stipulate* the required inconsistency/entailment relations at the attitudinal level (AD) without providing a deep, satisfying explanation grounded in the nature of the attitudes themselves. The project aims to demonstrate this gap and argue that solving CD does not entail solving AD.

  **3. Why Existing Positions Leave the Question Open:**
  *   **Blackburn's Quasi-Realism (Projectivism/Expressivism):** His "attitude calculus" (e.g., HORBIs) provides a sophisticated way to *represent* complex commitments and their logical relations, satisfying CD for many contexts. However, the inconsistency between "boo murder" and "not boo murder" (or "tolerance") is often *defined by* the logical system rather than emerging from a prior, independently plausible account of attitude conflict. Does the attitude expressed by "not boo murder" *intrinsically* conflict with "boo murder," or is conflict merely stipulated by the semantic rules?
  *   **Gibbard's Planning-State Expressivism:** Gibbard provides a detailed compositional semantics using sets of world-plan pairs, adeptly handling CD. The inconsistency between plans is defined set-theoretically (non-overlapping hyperplans). The key AD question is: Does this set-theoretic definition *explain* why holding the mental state expressed by "Murder is wrong" (ruling out all hyperplans that permit murder) is genuinely *rationally inconsistent* with holding the state expressed by "Murder is not wrong" (ruling out all hyperplans that forbid murder)? Or is the inconsistency relation merely *built into the model* without grounding it in the psychology of planning?
  *   **Schroeder's Being For:** Schroeder explicitly targets AD ("the negation problem") by defining a single, committal attitude ("being for") and complex attitudes built compositionally from it. While offering a novel compositional semantics (CD), his solution to AD relies on the specific, stipulated logical properties of the "being for" relation and the definition of inconsistency between attitudes as the impossibility of their joint possession. The question remains: Does this formal definition of attitude-inconsistency adequately capture a *genuine, rationally compelling psychological conflict*? Or is it another formal stipulation?
  *   **Hybrid Views:** Hybrid theories often combine expressive elements with minimal representational components. They frequently leverage the representational component to handle compositionality (CD) more straightforwardly. However, AD becomes potentially *more* complex: How do the representational and non-cognitive components *interact* to generate genuine inconsistency between the attitudes expressed by, say, "Not wrong" and "Wrong"? Does the representational element do all the logical work, undermining pure expressivism, or is the inconsistency genuinely located in the non-cognitive attitudes?

  **4. Methodology & Scope:**
  *   **Conceptual Analysis:** Precisely articulate the distinct criteria for satisfying CD and AD. Define key concepts: "compositional semantics," "genuine attitudinal inconsistency/entailment," "formal adequacy," "psychological/rational grounding."
  *   **Critical Examination:** Analyze how specific, representative versions of the above theories (focusing on core texts) purport to solve the Frege-Geach problem. Systematically disentangle their strategies for CD and AD.
      *   **Core Test Case:** Negation. Examine each theory's account of the attitude expressed by "~Wrong" and its proposed explanation for the inconsistency between the attitudes expressed by "Wrong" and "~Wrong." Is the inconsistency explained by the *nature of the attitudes themselves* or *stipulated by the compositional rules*?
      *   **Secondary Test Case:** Modus Ponens (e.g., "If murder is wrong, then stealing is wrong; Murder is wrong; Therefore, stealing is wrong"). Assess how the theory explains the *entailment* relation between the premise-states and the conclusion-state at the attitudinal level (AD), beyond just validating the inference syntactically or set-theoretically (CD).
  *   **Formal Analysis (Limited):** Employ a simple propositional framework to formalize:
      *   The core theories' semantic clauses for atomic normative sentences, negation, and the conditional.
      *   Their definitions of the mental states expressed.
      *   Their definitions of inconsistency between states.
      *   The goal is to clarify the *structure* of the proposed solutions and pinpoint *where* the explanation for inconsistency/entailment originates (e.g., within the attitude specification itself, or within the compositional rules defining complex states). No complex model theory or possible worlds semantics beyond basic set operations (as used by Gibbard/Schroeder) will be required.

  **5. Expected Results & Significance:**
  *   **Successful Result:** A demonstration that at least one major expressivist approach (and likely several) provides a formally adequate solution to CD for negation and modus ponens, but fails to provide a satisfying, non-circular, psychologically plausible explanation for AD. The explanation for inconsistency/entailment will be shown to rely either on (a) stipulation within the compositional rules, (b) definitions within the formal model that lack clear psychological grounding, or (c) implicitly borrowing logical properties from representational elements (in hybrids) without explaining the non-cognitive attitude's contribution to inconsistency. This would show that "solving Frege-Geach" is not a unitary achievement and that AD remains a distinct, potentially harder challenge.
  *   **Significance:** Reframes the evaluation of expressivist programs, highlighting AD as a critical, underappreciated hurdle. Forces greater clarity on what constitutes a *genuine* explanation of logical relations for non-cognitive attitudes. Suggests that expressivism's core commitment to a distinct, non-representational psychology of normativity faces a deeper challenge than often acknowledged, even after compositional success.
  *   **Failure Conditions:** The project fails if:
      *   The distinction between CD and AD proves incoherent or insignificant.
      *   A close analysis reveals that a prominent theory (e.g., Gibbard's or Schroeder's) *does* provide a compelling, non-stipulative explanation for AD grounded solely in the nature of the proposed attitudes.
      *   The limited formalization proves insufficient to make the intended distinctions clear.
      *   The scope is too broad for one semester; this will be mitigated by focusing primarily on negation across 2-3 core theories, with modus ponens as a secondary check.

  **6. Feasibility (One Semester, 6000 words):** This project is highly feasible. It centers on conceptual analysis and close reading of primary texts within a focused scope (core Frege-Geach, primarily negation, in 2-3 major expressivist paradigms). The limited formal component uses tools familiar to a metaethics PhD student. The core task is careful philosophical dissection, not developing a new model or conducting empirical research. The dual demands thesis provides a clear, original, and manageable lens for re-examining well-trodden ground.
