  Okay so I'm a metaethics PhD student and I need to put together a one-page proposal for a term paper (6000 words, one semester), and I want it to be on the Frege-Geach problem but not the version everyone writes about. My half-formed idea is this: people talk about 'the Frege-Geach problem' as if it were one demand — explain how expressivists can handle normative sentences in embedded contexts — but I think there are really two seperate demands that get run together. One is compositional: give a semantics for 'murder is wrong' under negation, inside conditionals, in modus ponens arguments, and so on. The other is attitudinal: explain why the mental states expressed by premises and conclusion genuinely stand in relations of inconsistency and entailment — most sharply, why 'murder is wrong' and 'murder is not wrong' are inconsistent, which is the negation problem Schroeder pushes. I suspect a view can satisfy the compositional demand while quietly failing the attitudinal one, and that a lot of expressivists pass off a solution to the first as if it solved the second. Can you turn this into a proposal? State the question precisely enough that it has a determinate answer; say why existing positions (Blackburn-style quasi-realism, Gibbard-style planning-state views, Schroeder's being-for, maybe hybrid views) leave it open; describe what I'd actually do — I can handle careful conceptual analysis and some formal work in a simple propositional framework, but not full model theory; say what a result would look like and what would count as the project failing; and keep it realistic for one semester. Don't add a bibliography, I'll fill in the citations myself.
