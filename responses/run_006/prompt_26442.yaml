  I'm a retired physicist and I've been reading philosophy for a couple years now — mostly phil science but I've also been trying to get my head around Wittgenstein, which I find maddning but fascinating.

  Here's my situation. My younger sister, always been pretty secular and science-minded, got involved with a traditional church about a year ago. Not anything weird, just regular Sunday services, prayer, the works. I've tried talking with her about it — I bring up the lack of evidence for supernatural claims, the problem of evil, naturalistic explanations of religious experience, all the standard moves. And she doesn't really push back. She kind of nods and says I might be right about the evidence, but it doesn't seem to touch her belief at all. She still goes to church. The arguments just slide off.

  She's not dumb — she's a vet, she reasons fine about everything else. So I'm starting to think I'm making some kind of category error. I vaguely remember Wittgenstein saying something about how religious belief isn't a matter of evidence or probability at all, that it's more like a picture you live by or a framework that gives shape to your life — something along those lines, I don't got the text handy and I'm probably garbling it.

  But if that's right, what do I do with that? If religious belief isn't the kind of thing evidence touches, then my whole approach to talking with her is wrong-headed. But I also don't want to end up at "well it's just a different language game" and act like truth doesn't matter. Is there a way to take Wittgenstein's point seriously without ending up in a kind of relativism where nobody's religious beliefs can ever be criticized?
