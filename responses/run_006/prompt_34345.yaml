answer: |-
  ### Decision Procedure for Evaluating High-Upside Proposals  
  This procedure combines expected value (EV) reasoning with pragmatic adjustments for overconfidence, tractability, and "fanaticism" risks. It should take ~30 minutes per proposal. Use it *after* initial alignment/feasibility checks.

  ---

  #### **Step 1: Extract Core Parameters (5 mins)**  
  Ask:  
  - **Probability of success (p):** What is the applicant’s estimate? What key assumptions underlie it?  
  - **Benefit if successful (B):** Quantified in your foundation’s core metrics (e.g., lives saved, DALYs averted, income boosts). If B involves speculative impacts (e.g., "saving future civilizations"), require the applicant to justify the conversion rate (e.g., 1 existential risk averted = X lives saved).  
  - **Cost (C):** Total funding requested.  
  - **Neglectedness:** How many others are working on similar solutions? (Low neglectedness reduces marginal impact.)  

  **Output:** Raw \( p \), \( B \), \( C \).

  ---

  #### **Step 2: Adjust for Overconfidence (10 mins)**  
  Applicants’ estimates are often inflated. Adjust probabilites aggressively—benefits less so (if B is well-defined).  

  - **Probability adjustment:**  
    - If \( p < 0.1 \) **and** relies on novel/unvalidated mechanisms: Apply a **confidence discount factor (CDF)**.  
      - **CDF = 0.1** if no peer-reviewed evidence or real-world analogs.  
      - **CDF = 0.3** if preliminary lab/field data exists.  
      - **CDF = 0.6** if robust evidence but scalability untested.  
    - Adjusted \( p' = p \times \text{CDF} \).  
    - *Exception:* If \( p \) is based on established statistics (e.g., Phase III trial success rates), use \( p' = p \).  

  - **Benefit adjustment:**  
    - Discount B only if it depends on multiplicative assumptions (e.g., "Our tech will scale globally and be adopted by governments"). Apply **B' = B × 0.5** in such cases.  
    - If B involves existential risk, use the applicant’s conversion (e.g., 1% extinction risk averted = 80M lives saved) but flag for committee review.  

  - **Never treat \( p < 10^{-9} \) as a "real" probability:** Such estimates are indistinguishable from noise. Automatically downgrade to \( p' = \min(p, 10^{-7}) \) for EV calculation.  

  **Output:** Realistic \( p' \), \( B' \).

  ---

  #### **Step 3: Calculate Expected Value (2 mins)**  
  \[
  \text{EV} = p' \times B' \quad \text{(absolute impact)}  
  \]  
  \[
  \text{EV per dollar} = \frac{\text{EV}}{C} \quad \text{(efficiency)}  
  \]  
  *Note: EV is useful but not decisive—proceed to Step 4.*

  ---

  #### **Step 4: Address Fanaticism vs. Risk Aversion (10 mins)**  
  High EV driven by tiny \( p' \) and huge \( B' \) may signal *fanaticism*. Reject if **any** of these apply:  

  1. **"Pascal’s Mugging" test:**  
     - Is \( p' < 10^{-6} \) **and** \( B' \) relies on >10 speculative assumptions?  
     - Does the EV depend entirely on an unsupported chain of cause/effect (e.g., "This quantum device might prevent AI takeover")?  
     - → **Reject if "yes."** (Genuine fanaticism: EV is not meaningful.)  

  2. **Tractability test:**  
     - Would our funding change the probability of success by <10% (e.g., due to low neglectedness)?  
     - → **Reject if "yes."** (Marginal impact is low.)  

  3. **Risk aversion check (personal bias):**  
     - Are you hesitant *only* because \( p' \) is small, even if all tests above pass?  
     - → **Proceed** if EV per dollar > foundation benchmark. (This is your bias; override it.)  

  ---

  #### **Step 5: Compare to Benchmarks & Hand Off (3 mins)**  
  - **If EV per dollar < 50% of your foundation’s average grant:** Reject.  
  - **If EV per dollar > 200% of average:** Strong case to fund.  
  - **Values calls (hand off to committee):**  
    - When B involves controversial conversions (e.g., valuing animal vs. human lives).  
    - When the proposal has high EV but potential negative externalities (e.g., accelerating risky AI).  
    - When intergenerational equity is contested (e.g., weighting future lives vs. present).  

  **Final Output:** Recommend "Fund," "Reject," or "Hand off with notes."  

  ---

  ### Case Applications  
  **Foundation Benchmark Assumption:**  
  - Your average grant yields ~1 DALY (disability-adjusted life year) per $100.  
  - Existential risk conversion: 1% extinction risk averted = 80M lives saved (standard in longtermist work).  

  ---

  #### **Case 1: 0.01% chance of preventing existential catastrophe**  
  - **Raw:** \( p = 0.0001 \), \( B = \text{prevent extinction (≡ 80M lives)} \), \( C = \$2\text{M} \).  
  - **Adjust:**  
    - \( p' = 0.0001 \times 0.1 \) (CDF for novel mechanisms) \( = 10^{-5} \).  
    - \( B' = 80\text{M} \) lives (no discount; standard conversion).  
  - **EV:** \( 10^{-5} \times 80\text{M} = 800 \) lives saved. EV per dollar = \( 800 / 2\text{M} = 0.0004 \) lives/$.  
  - **Fanaticism tests:**  
    - \( p' = 10^{-5} \) (> \( 10^{-6} \)), and B is defined via accepted conversion. → Not fanaticism.  
    - Assume neglectedness is high → tractable.  
  - **Benchmark:** 0.0004 lives/$ = 400 lives/$. Your benchmark: 1 life/$100 = 0.01 lives/$. **EV per dollar is 40,000× higher!**  
  - **Decision:** **Fund.** EV is compelling despite low probability.  
  - *You won’t like this:* It feels wrong to bet on tiny odds, but the math overrides risk aversion here.  

  ---

  #### **Case 2: 1-in-a-million chance of curing a rare disease (affects 500/year)**  
  - **Raw:** \( p = 10^{-6} \), \( B = \text{cure for 500 people/year} \). Assume 50 years of benefit → \( B = 25,000 \) life-years (≡ 25,000 DALYs), \( C = \$500\text{K} \).  
  - **Adjust:**  
    - \( p' = 10^{-6} \times 0.1 = 10^{-7} \) (CDF: no evidence).  
    - \( B' = 25,000 \) DALYs (no discount).  
  - **EV:** \( 10^{-7} \times 25,000 = 0.0025 \) DALYs. EV per dollar = \( 0.0025 / 500,000 = 5 \times 10^{-9} \) DALYs/$.  
  - **Fanaticism tests:**  
    - \( p' < 10^{-6} \) **and** disease affects only 500/year → B is not "astronomical." → **Reject** (fanaticism: EV is noise).  
  - **Benchmark:** \( 5 \times 10^{-9} \) DALYs/$ vs. your $0.01$/DALY benchmark (10,000× worse).  
  - **Decision:** **Reject.** Probability is too small to take seriously, and EV is trivial.  

  ---

  #### **Case 3: 10% chance of doubling income for 1M people**  
  - **Raw:** \( p = 0.1 \), \( B = \text{doubled income for 1M people} \). Assume:  
    - Doubling income for 1 person for 1 year ≈ 0.1 DALYs (based on income-DALY conversions).  
    - Benefit lasts 10 years → \( B = 1\text{M} \times 0.1 \times 10 = 1\text{M DALYs} \), \( C = \$10\text{M} \).  
  - **Adjust:**  
    - \( p' = 0.1 \times 0.3 \) (CDF: preliminary data) \( = 0.03 \).  
    - \( B' = 1\text{M} \times 0.5 = 500,000 \) DALYs (discount for scalability risk).  
  - **EV:** \( 0.03 \times 500,000 = 15,000 \) DALYs. EV per dollar = \( 15,000 / 10\text{M} = 0.0015 \) DALYs/$.  
  - **Fanaticism tests:**  
    - \( p' = 0.03 \) is tangible; no fanaticism.  
  - **Benchmark:** 0.0015 DALYs/$ = 1,500 DALYs/$. Your benchmark: 0.01 DALYs/$ (from $100/DALY). **EV per dollar is 150× higher.**  
  - **Decision:** **Fund.** High EV with moderate risk.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Moral weight disagreements:** e.g., How to value future vs. current lives, humans vs. animals.  
  2. **Ambiguity aversion:** When \( p \) is not just low but *unknowable* (e.g., predicting AI timelines).  
  3. **Hidden downsides:** e.g., A tech that could be weaponized. Requires committee judgment.  

  ### Key Takeaways  
  - **Reject** when \( p' \) is infinitesimal (< \( 10^{-6} \)) **and** B isn’t world-changing.  
  - **Fund** high-EV proposals even with low \( p' \) if they pass fanaticism tests.  
  - **Adjust probabilities aggressively**—your gut is right about overconfidence.  
  - **Hand off** values calls; don’t let math override ethics.  

  This system forces rigor on "why" low-probability bets feel wrong—without abandoning EV. Use it to justify decisions to yourself and your committee.
