answer: |-
  Here’s a systematic breakdown of desiderata for a contractualist solution to the aggregation problem, prioritized by non-negotiables, tensions, and the key conflict driver. I’ll commit to a specific list and defend it, drawing on Scanlon but acknowledging where constraints push beyond his framework.

  ---

  ### **Core Non-Negotiable Desiderata**  
  *(Essential for any minimally adequate Scanlonian account)*

  1. **Individualist Restriction (IR)**  
     - **Requirement**: Moral reasoning must treat individuals as the fundamental unit of justification. You cannot aggregate harms/benefits *across* persons to override a distinct individual’s complaint.  
     - **Case**: *Taurek’s Rescue Case* (save 1 vs. save 5). IR forbids summing the five’s claims to "outweigh" the one’s claim.  
     - **Why Non-Negotiable**: Scanlon’s core thesis: Wrongness = failure to justify to others *one by one*. Sacrificing an individual for aggregate gain is paradigmatically unjustifiable *to them*.  

  2. **Relevance of Numbers (RN)**  
     - **Requirement**: Numbers *must* matter in some cases (i.e., saving more lives isn’t always optional).  
     - **Case**: *1000 vs. 1 Rescue Case*. Any theory permitting saving 1 over 1000 is implausible.  
     - **Why Non-Negotiable**: Intuition of moral catastrophe avoidance. Scanlon concedes contractualism must accommodate this.  

  3. **No Intransitive Verdicts (NIV)**  
     - **Requirement**: Outcomes must be transitive (if A > B and B > C, then A > C). Intransitivity implies irrationality or arbitrariness.  
     - **Case**: *Spectrum Cases* (e.g., saving 1 over 1 is neutral, but slight differences in harm lead to cyclical preferences).  
     - **Why Non-Negotiable**: A theory producing "A > B > C > A" is practically unworkable and undermines rational decision-making.  

  ---

  ### **Strongly Aspirational Desiderata**  
  *(Widely shared but occasionally contested within Scanlonianism)*

  4. **Small-Loss Accommodation (SLA)**  
     - **Requirement**: Many small harms can override one large harm if the burden per person is minor.  
     - **Case**: *Transmitter Room/World Cup Case* (one person suffers paralysis vs. millions missing a game). Allowing paralysis to prevent mass minor frustration seems required.  
     - **Tension**: IR appears to block this (no aggregation across persons to "outweigh" paralysis).  

  5. **Same-Kind/Different-Kind Distinction (SK/DK)**  
     - **Requirement**: Aggregation easier for same-kind claims (e.g., lives vs. lives) than different-kind (e.g., life vs. limb).  
     - **Case**: *Deafness vs. Death*: Saving one from death may trump saving many from deafness.  
     - **Status**: Scanlonians (e.g., Kumar, Otsuka) use this to limit aggregation, but it’s contested *how* to define "kind."  

  6. **Non-Anti-Egalitarian (NAE)**  
     - **Requirement**: Should not systematically favor benefiting the worse-off unless justified by their stronger claim.  
     - **Case**: *Health Resource Allocation*: Saving one terminally ill person vs. five with moderate injuries. Pure aggregation might favor the five, but IR + claims-strength may not.  

  ---

  ### **The Tension Cluster: Where Theories Break**  
  **The Jointly Unsatisfiable Trio**:  
  - **Individualist Restriction (IR)** + **Relevance of Numbers (RN)** + **Small-Loss Accommodation (SLA)**.  

  **Why Unsatisfiable?**  
  - **IR** forbids cross-person aggregation.  
  - **RN** requires saving 1000 over 1.  
  - **SLA** requires preventing paralysis over minor losses to millions.  
  But SLA *and* RN both demand *some* aggregation, which IR explicitly prohibits. No existing theory satisfies all three without cheating:  
  - *Taurek*: Rejects RN and SLA (saves 1 over 5; paralysis over World Cup).  
  - *Pure Aggregation*: Rejects IR (sums harms arbitrarily).  
  - *Scanlon’s "Greater Burden"*: Struggles with SLA (Scanlon bites the bullet on transmitter room).  
  - *Otsuka/Kumar’s "Competing Claims"*: Allows RN (saves 5 over 1) but struggles with SLA (different-kind claims block transmitter room).  

  **The Most Damaging Requirement: Individualist Restriction (IR)**  
  IR is the primary constraint ruling out most solutions:  
  - It blocks straightforward aggregation (e.g., utilitarianism).  
  - Forces complex workarounds like "closest competitor" (Otsuka) or "comparative strength" (Kumar) that still fail SLA.  
  - Creates paradoxes: *Paralysis vs. Headaches*—if 1 person’s paralysis can’t be outweighed by *any* number of minor headaches (per IR), we get absurdity.  

  ---

  ### **The Real Sticking Point: Transmitter Room as Litmus Test**  
  - **Case**: Choose between:  
    - (A) One person paralyzed.  
    - (B) Millions miss World Cup broadcast (minor frustration).  
  - **IR says**: You can’t justify paralyzing one person by aggregating millions’ tiny frustrations; the paralyzed person has an unanswerable complaint.  
  - **SLA says**: The paralysis is so terrible we *must* prevent it, even via small burdens on many.  
  - **Resolution?** Only by:  
    - Abandoning IR (non-Scanlonian), or  
    - Redefining "burden" holistically (e.g., "frustration of a collective interest"), which violates Scanlon’s individualism.  

  ---

  ### **Conclusion: The Contractualist Trilemma**  
  Any adequate account must:  
  1. **Satisfy**: IR + RN + NIV (non-negotiables).  
  2. **Struggle with**: SLA + SK/DK (aspirational but critical for realism).  
  3. **Recognize**: SLA is the sacrificial lamb in strict Scanlonianism.  

  **My Verdict**:  
  The *individualist restriction* (IR) is the primary obstacle. Theories that relax it slightly (e.g., allowing aggregation for "irrelevant claims" or "same-kind trivial burdens") fare best on SLA (e.g., Frick 2015). But if you hold IR sacred, you must reject SLA in cases like transmitter room—which is the cost of being Scanlonian. The subset {IR, RN, SLA} is logically incoherent; you can pick any two, but not all three. For PhD work: **Start by deciding whether to abandon SLA or revise IR**. Everything else follows.

  **Key References**:  
  - Scanlon (*W&D* Ch.5) – IR, RN, but rejects SLA.  
  - Otsuka ("Saving Lives") – RN via competing claims, weak SLA.  
  - Kumar ("Contractualism on Saving the Many") – SK/DK defense.  
  - Frick ("Contractualism and Social Risk") – Aggregation-lite.  
  - Taurek ("Should the Numbers Count?") – Anti-RN, anti-SLA.
