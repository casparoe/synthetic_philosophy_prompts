answer: |-
  Here's a breakdown of desiderata for updating on uncertain evidence, categorized and analyzed for non-negotiability vs. optionality, followed by the crucial trade-offs:

  **I. Non-Negotiable Requirements (Core Rationality):**

  1.  **Probabilistic Coherence (Post-Update):**
      *   **Desideratum:** The posterior belief state `P_new` must be a valid probability distribution (non-negative, sums/integrates to 1, satisfies Kolmogorov axioms).
      *   **Motivation:** Foundational requirement for representing degrees of belief rationally. An incoherent `P_new` is meaningless for decision-making or further reasoning.
      *   **Status:** **Non-Negotiable.** Violating this disqualifies the rule as a rule for probabilistic belief.

  2.  **Respect for Certain Evidence (Limiting Case):**
      *   **Desideratum:** If the evidence `E` is learned with certainty (`P_new(E) = 1`), then the update rule must reduce to strict conditionalization: `P_new(H) = P_old(H | E) = P_old(H ∧ E) / P_old(E)` for all propositions `H`.
      *   **Motivation:** Strict conditionalization is the uncontroversial, demonstrably rational rule when evidence is certain. Any rule for uncertain evidence must generalize this core case. Failure means the rule is fundamentally flawed.
      *   **Status:** **Non-Negotiable.** A rule failing this contradicts the bedrock of Bayesian updating.

  3.  **Compatibility with the Principle of Total Evidence:**
      *   **Desideratum:** The update rule must be defined such that `P_new` incorporates *all* the relevant evidence available at the time of the update, including the specific uncertainty of the evidence partition. The agent cannot arbitrarily ignore parts of their evidential input.
      *   **Motivation:** Rational belief must be based on the totality of what is known. Ignoring available evidence leads to potentially avoidable inaccuracy. The rule must provide a mechanism for the *uncertain* evidence itself to be the input driving the update.
      *   **Status:** **Non-Negotiable.** Violating this allows irrational cherry-picking of evidence. The rule *must* take the uncertain evidential constraints as its direct input.

  **II. Structural Requirements & Limiting Cases (Often Non-Negotiable or Highly Desirable):**

  4.  **Handling Partitional Evidence:**
      *   **Desideratum:** The rule must be able to update beliefs based on evidence that directly specifies new probabilities over a *partition* of the possibility space (e.g., `{E1, E2, ..., En}` where `Ei` are mutually exclusive and exhaustive). Input is `P_new(Ei) = q_i` for all `i`. The rule should specify `P_new(H)` for any `H`.
      *   **Motivation:** Uncertain evidence often directly constrains probabilities over a set of alternatives (e.g., "I'm 70% sure the light was red," "The test is 90% likely positive if diseased, 5% if not").
      *   **Status:** **Effectively Non-Negotiable.** This is the *defining problem* the rule aims to solve. A rule incapable of handling partitional inputs fails its primary purpose.

  5.  **Invariance to Partition Refinement (Context Independence):**
      *   **Desideratum:** Suppose evidence specifies probabilities for a coarse partition `{C1, C2}`. Refining `C1` into `{C1a, C1b}` should not change the posterior probabilities for propositions *logically independent* of the refinement, *if* the evidential input over the coarse partition remains consistent (`P_new(C1) = P_new(C1a) + P_new(C1b)`, etc.).
      *   **Motivation:** Beliefs about unrelated propositions (e.g., `H`) shouldn't depend on how finely we describe the *source* of the evidence if the *directly relevant* evidential constraints are identical. Failure indicates the rule is sensitive to arbitrary descriptive choices.
      *   **Status:** **Highly Desirable / Often Implicitly Required.** Violations seem pragmatically irrational. This is a key criticism of some rules (e.g., Minimum Cross-Entropy can violate it without extra constraints). Jeffrey Conditionalization satisfies it.

  **III. Substantive Constraints & Properties (Often Framework-Dependent or Debated):**

  6.  **Jeffrey's Rigidity Condition (Minimal Revision):**
      *   **Desideratum:** Conditional probabilities given elements of the evidential partition remain unchanged: `P_new(H | Ei) = P_old(H | Ei)` for all `H` and all `i`.
      *   **Motivation:** Represents the idea that the evidence *only* directly impacts the probabilities of the `Ei` themselves; the evidential *relationship* between `Ei` and other propositions `H` (captured by `P(H|Ei)`) remains fixed. Assumes the mechanism generating the evidence is understood and stable. Embodies a principle of minimal belief revision.
      *   **Status:** **Optional Commitment.** Defining feature of **Jeffrey Conditionalization (JC)**. Other rules (like Adams Conditioning) explicitly reject it. Motivates the JC formula: `P_new(H) = Σ_i [P_old(H | Ei) * P_new(Ei)]`.

  7.  **Commutativity (Order Independence):**
      *   **Desideratum:** The final posterior belief state should be the same regardless of the order in which two *logically independent* pieces of uncertain evidence (over different partitions) are applied. `Update_A then Update_B` should equal `Update_B then Update_A`.
      *   **Motivation:** Intuitively, the order in which we receive unrelated evidence shouldn't affect our final beliefs about the world. Failure can seem irrational or lead to Dutch books if the order is chosen adversarially.
      *   **Status:** **Highly Desirable, but Often Sacrificed.** **Jeffrey Conditionalization generally violates commutativity.** Rules designed for commutativity (like Adams Conditioning, Linear Pooling) often require specific constraints on the evidence partitions or sacrifice rigidity/total evidence compatibility.

  8.  **Successive Application Consistency:**
      *   **Desideratum:** Applying the update rule successively with new evidence should yield coherent results consistent with applying a single update incorporating all evidence (if possible). The rule shouldn't generate pathologies or inconsistencies under iteration.
      *   **Motivation:** Agents receive evidence sequentially. The rule must be usable dynamically without leading to internal contradictions or violations of core requirements over time.
      *   **Status:** **Highly Desirable / Quasi-Negotiable.** Most serious rules aim for this, but achieving it robustly, especially with commutativity and rigidity, is difficult. JC satisfies it if rigidity holds for each step, but order matters.

  9.  **Superconditioning as a Norm:**
      *   **Desideratum:** There should exist *some* probability space and *some* event `E` learned via strict conditionalization such that the posterior `P_new` obtained from the uncertain update is identical to `P(· | E)`. The update is "as if" some specific event `E` was learned with certainty.
      *   **Motivation:** Connects uncertain updates back to the standard Bayesian model. Suggests the uncertain evidence can be interpreted as definitive evidence about some more complex event.
      *   **Status:** **Optional / Constraining.** **Jeffrey Conditionalization satisfies superconditioning** (the `E` is the disjunction over the evidential partition weighted by the new probabilities). Rules violating rigidity (like Adams Conditioning) typically do not satisfy superconditioning. It's a strong constraint limiting the range of possible posteriors.

  **The Fundamental Trade-off: Rigidity vs. Commutativity (& Partition Invariance)**

  *   **The Conflict:** It is **impossible** for an update rule for uncertain evidence to simultaneously satisfy **all** of the following:
      *   Jeffrey's Rigidity (`P_new(H|Ei) = P_old(H|Ei)`)
      *   Commutativity for logically independent evidence over *arbitrary* partitions.
      *   Full Invariance to Partition Refinement (for unrelated propositions).
      *   Consistent handling of partitional evidence and the Principle of Total Evidence.
  *   **Why?:** Rigidity pins conditional probabilities to the *specific* partition used to describe the evidence. Commutativity requires that updates based on different partitions mesh perfectly regardless of order. Invariance requires the partition description itself to be irrelevant. These pull in conflicting directions. Forcing commutativity under rigidity requires very specific relationships between the partitions involved (e.g., being conditionally independent given some common variable), which generally don't hold. Relaxing rigidity allows more flexibility to achieve commutativity or invariance.

  **How Major Approaches Navigate the Trade-off:**

  1.  **Jeffrey Conditionalization (JC):**
      *   **Sacrifices:** Commutativity (generally). Partition Refinement Invariance for propositions *related* to the partition is inherently constrained by rigidity, but it satisfies invariance for *unrelated* propositions.
      *   **Upholds:** Rigidity, Superconditioning, Non-Negotiables, Partition Handling, Successive Application (though order-dependent), Total Evidence.
      *   **Rationale:** Prioritizes minimal revision (rigidity) and connection to strict conditionalization (superconditioning). Accepts that order matters as a feature reflecting the context-dependence imposed by rigidity.

  2.  **Adams Conditioning / Logical Conditionalization (for "Expert" Probabilities):**
      *   **Sacrifices:** Rigidity (generally), Superconditioning (generally).
      *   **Upholds:** Commutativity (under specific conditions, e.g., evidence on distinct variables in a Bayesian network), Partition Refinement Invariance (often), Non-Negotiables, Partition Handling, Total Evidence.
      *   **Rationale:** Prioritizes commutativity and partition invariance. Achieves this by interpreting the new probabilities `q_i` as direct constraints *not* requiring the preservation of old conditionals (`P(H|Ei)`). Instead, it often assumes the new probabilities come from a reliable source ("expert") whose judgment directly sets `P_new(Ei) = q_i`, potentially overriding old relationships.

  3.  **Minimum Relative Entropy (MRE) / Kullback-Leibler Updating:**
      *   **Sacrifices:** Rigidity (generally - unless constraints match rigidity conditions), Commutativity (generally), sometimes Partition Refinement Invariance (unless constraints are linear).
      *   **Upholds:** Non-Negotiables, Partition Handling, Total Evidence. *Minimizes* the informational "distance" (KL divergence) between `P_old` and `P_new` subject to the evidential constraints `P_new(Ei)=q_i`. Can satisfy rigidity or commutativity only if the constraints happen to force it.
      *   **Rationale:** Prioritizes minimal *overall* change in the probability distribution relative to the constraints. It's very general but doesn't inherently prioritize rigidity *or* commutativity. Its behavior depends heavily on the *form* of the constraints.

  4.  **Linear Pooling / Opinion Pooling:**
      *   **Sacrifices:** Rigidity, Superconditioning, often Total Evidence (if used naively).
      *   **Upholds:** Commutativity (by design), Partition Invariance (often).
      *   **Rationale:** Primarily used for aggregating opinions from multiple sources (`P_new(H) = Σ w_k * P_k(H)`). While sometimes adapted, it doesn't naturally fit the "updating with uncertain evidence" paradigm. It violates the Principle of Total Evidence unless the weights `w_k` are derived from the evidence itself in a specific way. Prioritizes simplicity and commutativity.

  **In Summary:**

  *   **Non-Negotiables:** Probabilistic Coherence, Reduction to Strict Conditionalization, Principle of Total Evidence, Handling Partitional Evidence.
  *   **Core Trade-off:** **Rigidity vs. Commutativity.** You cannot have both universally, along with full partition refinement invariance.
      *   **JC** chooses Rigidity (and Superconditioning), sacrificing Commutativity.
      *   **Adams Conditioning** chooses Commutativity (and Partition Invariance), sacrificing Rigidity.
      *   **MRE** is a constraint-based approach that can be tuned but generally sacrifices both unless constraints align.
  *   **Superconditioning** is a strong optional constraint naturally satisfied by JC but often incompatible with approaches sacrificing rigidity.

  Your choice depends on which principles you prioritize: minimal belief revision under the partition (JC) vs. order independence and descriptive invariance (Adams), or minimal overall information change subject to constraints (MRE). The non-negotiables provide the essential baseline that any adequate rule must meet.
