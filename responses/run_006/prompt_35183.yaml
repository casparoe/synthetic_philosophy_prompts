  I'm constructing a theory of rational belief revision and I want to get clear on what any adequate rule for updating on uncertain evidence must achieve before I evaluate candidates. Please set out the desiderata: the structural requirements, limiting cases, and substantive constraints that a rule for updating on uncertain evidence must satisfy to count as adequate — covering at least the handling of partitional evidence, the behavior under successive updates, the relationship to strict conditionalization, and the demands imposed by the principle of total evidence. For each desideratum, give the case or consideration that motivates it. Then identify which are non-negotiable requirements on any such rule and which are optional commitments of particular frameworks (Jeffrey's rigidity condition, commutativity, superconditioning as a norm, sensitivity to the choice of partition, and so on). What I most want to know is whether any subset of these desiderata is jointly unsatisfiable — whether the landscape itself forces a trade-off such that no single updating rule can meet them all. If so, articulate the trade-off explicitly and indicate which desiderata each major approach (Jeffrey conditionalization, Adams conditioning, minimum-information updating, etc.) sacrifices.
