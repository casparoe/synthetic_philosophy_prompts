prompt: |-
  Before I assess the three main contenders for the metric of distributive justice — welfarist, resourcist, and capability accounts — I want the specification against which they should be judged. Write the desiderata that any adequate answer to 'equality of what?' must meet. Give exactly five. For each, state the requirement, the concrete case or consideration that forces it (such as expensive tastes, adaptive preferences, or unequal capacities to convert resources into functionings), and whether it is negotiable or non-negotiable; flag any two that cannot be jointly satisfied. Do not simply reproduce the familiar list from the literature — take a view on which demands are genuine and which are only one camp's preference. Answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion, in British English.
reasoning: |-
  Hmm, the user wants me to specify five desiderata for assessing theories of distributive justice. They're asking for criteria to judge welfarist, resourcist, and capability approaches to "equality of what?" They want exactly five requirements, each with a concrete case that motivates it (like expensive tastes or adaptive preferences), and I need to indicate whether each is negotiable or not. They also want me to flag if any two are incompatible.

  I need to approach this as a philosophy expert. The user seems knowledgeable about distributive justice - they mentioned expensive tastes (from Ronald Dworkin) and adaptive preferences (Amartya Sen), so they're probably familiar with the literature. I should avoid just repeating standard lists and take a clear stance on what makes a theory genuinely adequate.

  For the desiderata, I should identify core demands that any plausible theory must meet. The concrete cases should highlight real-world problems that expose weaknesses in certain approaches. For negotiability, I'll distinguish between fundamental constraints (non-negotiable) and debatable priorities (negotiable). And I need to point out where trade-offs exist - probably between sensitivity to individual variation and avoiding paternalism.

  Let me outline five robust desiderata:

  1. **Non-arbitrariness**: Theories shouldn't create inequalities based on random factors like brute luck. The case of expensive tastes (where someone's high-cost preferences aren't their fault) shows why this is non-negotiable.

  2. **Responsiveness to need**: Must account for different conversion abilities - e.g., a disabled person needing more resources for mobility. This is non-negotiable for basic fairness.

  3. **Non-paternalism**: Should respect individual autonomy, especially regarding adaptive preferences (like oppressed groups scaling down desires). Non-negotiable to avoid imposing external values.

  4. **Feasibility**: Practical constraints matter - we can't achieve perfect equality if some variations (like innate talents) are unobservable. This is negotiable depending on context.

  5. **Recognition of agency**: People aren't just passive recipients; they make choices (e.g., someone who cultivates expensive tastes). This is negotiable as theories can emphasize outcomes over processes.

  For incompatibility, I'll note that non-paternalism (#3) clashes with responsiveness to need (#2) when we try to help people without overriding their preferences. Also, non-arbitrariness (#1) might conflict with agency (#5) regarding responsibility for choices.

  I'll phrase this in British English as requested, using terms like "whilst" instead of "while", and keep it concise - just numbered items without intros or conclusions.
answer: |-
  1.  Non-arbitrariness: Distinctions in treatment must not rest on morally arbitrary brute luck differences. The case of expensive tastes unchosen by the individual (e.g., someone naturally finding only champagne palatable whilst others are satisfied with water) forces this requirement to avoid penalising individuals for circumstances beyond their control; this is non-negotiable.
  2.  Responsiveness to heterogeneous conversion abilities: The metric must account for significant interpersonal variations in the capacity to transform resources into valued states. The concrete case of disability (e.g., a wheelchair user needing a ramp to achieve the mobility an able-bodied person gains from stairs) compels this to prevent resource equality masking capability deprivation; it is non-negotiable for fundamental fairness.
  3.  Non-paternalism regarding subjective valuations: The metric must respect individuals' own assessments of their good, not imposing external valuations. Adaptive preferences (e.g., the resigned contentment of the chronically deprived who scale down their desires) force this to avoid denying agents' authority over their conception of the good; this is non-negotiable for respecting autonomy.
  4.  Practical feasibility: The metric must be amenable to plausible assessment and implementation within societal constraints. The difficulty (and potential intrusiveness) of perfectly discerning internal states like welfare or complex capabilities forces this consideration; whilst important, it is negotiable as the weight given to feasibility against ideal justice can vary.
  5.  Recognition of responsible agency: The metric must acknowledge that individuals are responsible agents whose choices legitimately affect outcomes. The case of cultivated expensive tastes (e.g., someone deliberately developing a taste for vintage wine) forces this requirement to distinguish choice from circumstance; its weight is negotiable, reflecting differing views on the scope of responsibility in egalitarianism.

  *   Desiderata 2 (Responsiveness) and 3 (Non-paternalism) cannot be jointly satisfied perfectly, as responsiveness might require interventions based on observed disadvantage which the individual subjectively denies due to adaptation.
  *   Desiderata 1 (Non-arbitrariness) and 5 (Recognition of agency) also exhibit tension, as non-arbitrariness focuses on unchosen disadvantages, whilst agency emphasises chosen outcomes; reconciling their demands is central yet problematic.
