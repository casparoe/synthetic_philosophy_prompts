prompt: |-
  Before I read further in Bayesian confirmation theory, I want the specification: what must any adequate account of confirmation deliver, given that old evidence poses the hardest test? The problem is that a fact known before a hypothesis is formulated — the standard illustration is the anomalous advance of Mercury's perihelion, known long before general relativity — can nevertheless confirm the new hypothesis, even though an evidence statement with probability one leaves P(H|E) equal to P(H). Give me exactly five desiderata for an adequate theory in this area. For each desideratum, state the requirement, the case or consideration that makes it a requirement, and whether it is non-negotiable or merely one camp's preference; where a standard Bayesian fix fails it, say so in the same item. Flag any pair of desiderata you suspect cannot be jointly satisfied, and tell me which single desideratum does the most to exclude existing accounts. Format the response as exactly six numbered items — the five desiderata, then a final item stating how confident you are in the list and which desideratum you are least sure about — each item a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking about Bayesian confirmation theory, specifically focusing on the problem of old evidence. This is a classic issue in philosophy of science, where evidence already known before a hypothesis is formulated (like Mercury's perihelion advance for general relativity) should still confirm that hypothesis. But since P(E) = 1 for known evidence, Bayes' theorem makes P(H|E) equal to P(H), showing no confirmation. The user wants exactly five desiderata for an adequate theory of confirmation that handles this, with specific details for each.

  I need to recall the core problem: confirmation requires increasing probability, but old evidence has max probability. Various solutions have been proposed, like counterfactual probability assessments or appealing to logical omniscience, but they all have flaws. The user wants me to identify five key requirements, explaining why each is necessary and whether it's mandatory or debatable. I should also note if any pair conflicts and which desideratum is most exclusionary.

  For the desiderata, I should cover the essential aspects from literature. First, an account must allow old evidence to confirm hypotheses—this is non-negotiable because ignoring it undermines scientific history. Second, it must maintain the core Bayesian idea that confirmation depends on probability-raising; without that, it's not Bayesian anymore. Third, it should avoid ad hoc fixes, like arbitrarily lowering P(E), which is a common but unsatisfying workaround. Fourth, it must account for the agent's epistemic state at the time, as confirmation is subjective and contextual. Fifth, it should ideally integrate with other Bayesian tools, like decision theory, for coherence—this might be more flexible, though.

  Now, for conflicts: I suspect desiderata 2 (probabilistic relevance) and 4 (epistemic dependence) might clash. Emphasizing the agent's state could lead to relativism that undermines objective relevance, or vice versa. Also, desideratum 3 (non-ad-hoc-ness) does the most to exclude existing accounts because many solutions, like Garber's approach, involve artificial probability adjustments that feel contrived.

  Finally, I need a sixth item on confidence. I'm fairly confident overall, having studied this, but I'm least sure about desideratum 5 (holistic integration) because it's more aspirational and might not be strictly necessary for solving the core problem.

  I'll structure the response as six numbered items: five for desiderata with the specified details, and the last for confidence. Each item will be concise—one or two sentences—with no intro or conclusion, as per the query.
answer: |-
  1. **Desideratum 1: Accommodate Old Evidence Confirmation** - The account must permit evidence known prior to a hypothesis's formulation (e.g., Mercury's perihelion advance) to confirm that hypothesis. This is non-negotiable because the history of science shows such evidence *does* support novel theories (like GR), and failing this renders the account descriptively inadequate. Standard Bayesianism fails this, as P(E)=1 implies no boost from P(H|E) to P(H).
  2. **Desideratum 2: Retain Probabilistic Relevance as Core** - Confirmation must fundamentally involve raising the probability of H, i.e., P(H|E) > P(H) when E confirms H. This is non-negotiable; abandoning probabilistic relevance severs confirmation from Bayesian foundations, reducing it to mere qualitative association. Counterfactual approaches often violate this by using non-actual probabilities to define confirmation.
  3. **Desideratum 3: Avoid Ad Hoc Probability Manipulations** - The solution must not rely on artificially lowering P(E) (e.g., by pretending the agent didn't know E) solely to manufacture confirmation. This is non-negotiable; such fixes (e.g., standard counterfactual "forgetting") are epistemically unjustified and undermine the objectivity of confirmation. Many Bayesian "fixes" (like Garber's) fail this by stipulating P(E)<1 in hypothetical priors.
  4. **Desideratum 4: Respect Epistemic Dependence** - The account must be sensitive to the agent's epistemic state *at the time of hypothesis adoption*, including their knowledge of E and the logical/evidential connections they grasp. This is non-negotiable; confirmation is agent-relative and context-dependent (e.g., Mercury confirmed GR for Einstein *when he derived it*). Approaches ignoring this (e.g., logical omniscience models) fail by making confirmation static and ahistorical.
  5. **Desideratum 5: Maintain Holistic Integration** - The account should integrate coherently with other Bayesian norms (e.g., decision theory, updating). This may reflect one camp's preference (non-negotiable for purists, negotiable for revisionists); fragmentation risks theoretical inconsistency. Most specialized fixes (e.g., deviation from strict conditionalization) sacrifice this integration, weakening Bayesianism's unified framework. *Desiderata 2 and 4 may conflict if emphasizing agent-relative states undermines objective probabilistic relevance.*

  6. **Confidence**: I am highly confident in desiderata 1-4 as non-negotiable core requirements; desideratum 5 (integration) is the least certain, as it prioritizes theoretical unity over solving the specific problem, and its necessity is debated among Bayesians. Desideratum 3 (non-ad-hoc-ness) does the most to exclude existing accounts.
