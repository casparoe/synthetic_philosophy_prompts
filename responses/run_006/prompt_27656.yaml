prompt: |-
  I serve on the Governance Committee of my university's Faculty Senate. We are in the midst of a comprehensive revision of the Senate's bylaws, and we have hit a procedural puzzle that has split the committee into three camps.

  The current bylaws include Article XII, which reads: "These bylaws may be amended by a majority vote of the Senate." One of the revision proposals would replace Article XII with a new provision requiring a two-thirds supermajority for any future amendment. The proposal's advocates argue that the bylaws are presently too easy to alter and that a higher threshold would lend stability to the Senate's governance structure. The proposal has considerable support, and we expect it to reach the Senate floor.

  The puzzle is this: under what voting threshold should the Senate itself vote on this proposal? If we apply the existing majority-vote rule, then a bare majority could enact a supermajority requirement — which appears to let a transient majority entrench a rule that future majorities cannot undo. If we instead require a two-thirds vote to adopt the proposal (on the grounds that the proposal concerns the amendment rule itself), we are applying a rule that has not yet been adopted, which seems circular. A third faction argues that Article XII cannot be amended at all — that the amendment rule is in some sense unrevisable — but the bylaws contain no entrenchment clause to that effect, and it is unclear where such a prohibition would come from.

  The Committee Chair has asked me to draft a short written opinion, to be circulated before our next meeting, recommending how to resolve this. The opinion should propose a concrete procedure for the Senate to follow, explain the reasoning behind it, and address the strongest considerations on the losing sides. Please draft this memo.
reasoning: |-
  Okay, the user is part of a Governance Committee revising their Faculty Senate bylaws and they're stuck on a procedural puzzle about changing the amendment rule. Let me break this down.

  First, the current bylaws allow amendments by simple majority. Now there's a proposal to require two-thirds majority for future amendments. The conflict is over what threshold should apply to vote on this proposal itself. Three factions: one says use current majority rule, another says apply the proposed supermajority now, and a third thinks the amendment rule can't be changed at all. 

  Hmm, this is a classic constitutional paradox. The user needs a memo recommending a concrete procedure that addresses all three viewpoints. The key tension is between procedural legitimacy (following current rules) versus preventing self-entrenchment (a majority locking in stricter rules).

  Let me consider legal philosophy here... Hart's rule of recognition comes to mind. The existing bylaws are the operative framework, so any change must flow from that. But there's also the "amendment power is plenary" principle - meaning unless limited, the current body has full authority. 

  The third faction's "unamendable" argument seems weakest since there's no entrenchment clause. But their underlying concern about stability is valid. Maybe I should acknowledge that while rejecting their legal conclusion.

  For the memo structure: start by stating the recommended procedure (use current majority vote), then explain why it's legitimate, then address counterarguments. Need to show why applying the not-yet-adopted supermajority is circular, and why entrenchment concerns are political rather than procedural.

  Also important to emphasize this isn't about policy wisdom but proper process. The committee can separately debate whether supermajority is good policy, but procedure must follow existing rules.

  Should probably flag that if they want future entrenchment, they should explicitly state it in the new provision - but that's for after this vote. For now, strict adherence to current Article XII avoids self-dealing.

  The tone needs to be diplomatic since factions are split. Present this as principled but not dogmatic. Maybe add that if members feel strongly about supermajority, they're free to voluntarily apply it as a courtesy - but not required.
answer: |-
  **MEMORANDUM**  
  To: Governance Committee, Faculty Senate  
  From: [Your Name], Committee Member  
  Date: October 26, 2023  
  Subject: Recommended Procedure for Voting on Proposed Amendment to Article XII  

  ### I. Recommended Procedure
  The Senate should vote on the proposal to replace Article XII (requiring a majority vote for amendments) with a supermajority requirement **using the existing majority-vote threshold** under current Article XII. A simple majority of senators present and voting suffices to adopt the amendment.  

  ### II. Reasoning  
  The rationale for this recommendation rests on three pillars of governance:  

  1. **Procedural Legitimacy**:  
     The current bylaws constitute the sole valid framework for Senate action. Article XII explicitly governs amendments and imposes no restrictions on *what* may be amended (including itself), nor does it prescribe special thresholds for "meta-amendments." To impose an unratified supermajority requirement *in advance* of its adoption lacks legal basis under existing rules and creates a circularity (i.e., applying a rule that does not yet exist).  

  2. **Sovereignty of the Current Senate**:  
     The Senate possesses plenary authority to revise its governing instruments under the rules in force at the time of decision. A future Senate retains equivalent authority to amend these same rules (including any new supermajority requirement) using *whatever procedure is in effect at that future time*. If a future Senate operates under a supermajority rule, it may amend or repeal that rule by the same supermajority—or by a majority if it first amends Article XII back to majority rule. No "entrenchment" is absolute.  

  3. **Avoiding Self-Imposed Deadlocks**:  
     Requiring a supermajority to *adopt* a supermajority rule risks permanent stagnation. If the proposal lacks two-thirds support but has majority support, rejecting it solely due to an inapplicable threshold subverts the democratic will of the current Senate and undermines the amendment process itself.  

  ### III. Addressing Counterarguments  
  **A. Camp 1: "Apply the Proposed Two-Thirds Threshold Now"**  
  *Strongest Consideration*: Failing to "bootstrap" the higher threshold legitimizes a bare majority’s power to entrench rules against future majorities.  
  *Response*: While this concern is philosophically valid, it confuses policy with procedure. The fear of "entrenchment" is mitigated by the fact that future Senates retain full agency to amend the rules under whatever procedure they inherit. Applying a not-yet-adopted rule violates the principle of procedural regularity and risks governance paralysis. The Senate may always choose *as a matter of political practice* to apply a higher threshold for significant changes, but this is a norm, not a legal requirement.  

  **B. Camp 2: "Article XII Is Unamendable"**  
  *Strongest Consideration*: Amendment rules are foundational and must be immutable to prevent self-serving manipulation.  
  *Response*: This view finds no support in the current bylaws, which contain no entrenchment clause. Absent explicit language barring amendment (e.g., "Article XII shall never be amended"), all provisions remain revisable under Article XII itself. Constitutional theory recognizes that amendment powers are inherently flexible unless expressly limited. To hold otherwise would freeze governance structures without textual justification.  

  ### IV. Practical Guidance  
  If the Senate wishes to ensure broad consensus for foundational changes, I recommend:  
  1. **Adopt this amendment under the current majority rule**.  
  2. **Accompany the new supermajority rule with a transitional clause**:  
     *"This amendment to Article XII shall take effect immediately upon adoption. Any future amendment to Article XII shall require a two-thirds majority vote of the Senate."*  
  3. **Record in meeting minutes**: Explicitly note that adoption by majority vote reflects the Committee’s interpretation of procedural legitimacy.  

  This approach honors the Senate’s present authority while allowing it to establish a higher threshold for future amendments—a threshold future Senates may revise using the rules in place at their time.  

  Respectfully submitted,  
  [Your Name]  

  ---  
  **Key Takeaways for Committee Discussion**:  
  - **Current rules govern current actions**. No procedural bypasses exist without explicit textual authority.  
  - **Future Senates are not powerless**. They operate under the rules they inherit but may amend them using those same rules.  
  - **Stability vs. flexibility is a policy debate, not a procedural trap**. The Senate should debate the merits of the supermajority proposal itself—not be paralyzed by a theoretical dilemma.
