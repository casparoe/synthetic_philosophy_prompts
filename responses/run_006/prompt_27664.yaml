prompt: |-
  I've just spent the evening arguing with a friend about the principle of indifference, and now I can't tell which of my own gut verdicts survive. A machine cuts cubes: if the side length is uniformly drawn from 0 to 1 metre, I'm happy saying the probability the side is under half a metre is 1/2. But if I'm told instead the volume is uniformly drawn from 0 to 1 cubic metre, I also want to say the probability the side is under half a metre is 1/8 — and those can't both be right. Chords in a circle: picking two points on the circumference gives me 1/3 for the chord being longer than the side of the inscribed equilateral triangle; picking the chord's midpoint by its distance from the centre gives me 1/2; picking the midpoint uniformly inside the disk gives me 1/4. And I'm perfectly fine saying a random point on the Earth's surface is as likely to land in any two equal-area patches, but I'd balk at saying its as likely to be at latitude 80 as at the equator. Is there one principle — or a small set of candidates — that captures which of these to keep and which to drop? What does it predict for a case I haven't listed, and which of my verdicts does it force me to give up? Please write the answer in British English.
reasoning: |-
  Okay, let me try to work through this user's query step by step. The user is clearly grappling with the principle of indifference and its paradoxes, having debated it with a friend. They've presented several classic probability scenarios where applying uniform distributions to different parameters leads to contradictory results. 

  First, the cube-cutting example stands out. If side length is uniform from 0-1m, P(length<0.5m)=0.5 seems reasonable. But if volume is uniform, the same event becomes P(volume<0.125m³)=0.125. The mathematical inconsistency here is stark - the user recognises these can't both be true.

  Then the circle chord problems appear even more troubling. Three different "natural" ways to define randomness yield three different probabilities (1/3, 1/2, 1/4) for the same geometric event. The user seems particularly unsettled by how equally plausible approaches contradict each other.

  The Earth latitude example adds another dimension. While equal-area patches having equal probability feels intuitive, applying uniformity to latitude itself (rather than surface area) would absurdly concentrate probability at the poles. The user's intuition correctly rejects this, but why?

  Hmm... what connects all these? The core issue seems to be that "random" isn't defined until we specify what's being randomized. The principle of indifference asks us to treat unspecified parameters equally - but which parameters? Length vs volume? Endpoint coordinates vs midpoint position? Latitude vs surface element?

  I recall Bertrand's paradox was explicitly designed to expose this flaw. The different chord methods correspond to different natural parameterizations, and the indifference principle gives different answers because it's applying uniformity to different underlying spaces. 

  For the Earth, the key insight is that latitude lines aren't equal-area - near poles they squeeze together. So uniform probability per unit area doesn't imply uniform latitude. The user's intuition here is physically sound.

  So what resolves this? The principle needs an invariant basis. Probability measures should be uniform with respect to the natural measure of the space - like surface area on a sphere, or arc length on a circle. But how to identify the "natural" measure? Often it comes from symmetry or physical constraints.

  For the cube, if the machine cuts randomly, does it control side length or volume? The problem doesn't say! Without knowing the actual random process, both answers are defensible but mutually exclusive. The indifference principle alone can't choose between parameterizations.

  Perhaps the deeper lesson is that probability requires specifying a sample space and measure. The user's "gut verdicts" work when they implicitly choose the right measure (area for Earth, arc length for chords via endpoints) but fail otherwise. They'll need to abandon either the side-length uniformity or volume uniformity in the cube case - can't keep both.

  For a new case: say "random triangle" on a circle. If uniform via vertices, P(acute) is about 0.25; if uniform via side lengths, it's different. Again, no single "correct" answer without specifying the random process.

  The user seems mathematically sophisticated but frustrated by contradictions. They might appreciate Jaynes' invariance principles - like demanding rotational symmetry for chords. That surprisingly recovers the 1/3 answer. But not all cases have such symmetries.

  Ultimately they must accept that "random" isn't absolute. Their Earth intuition survives because area measure is physical; their chord endpoint method survives via rotational symmetry; but the cube side/volume conflict requires choosing one actual process. A valuable if uncomfortable lesson about probability's foundations.
answer: |-
  Ah, the Principle of Indifference – a seductive siren leading one onto the rocks of paradox! Your gut verdicts clash precisely because the principle, applied naively to different *parameterizations* of the same underlying uncertainty, leads to contradictions. There isn't one single principle that always works, but a *set of considerations* helps us navigate when to keep which intuition:

  1.  **Specify the Underlying Random Process:** The core issue. "Random" is meaningless without defining *how* the selection occurs. What machine mechanism cuts the cube? How *exactly* is the chord "randomly" chosen? How is the point "randomly" placed on Earth?
  2.  **Invariance & Symmetry:** Which parameterization respects the inherent symmetries of the problem? What transformations should leave the probability distribution unchanged?
  3.  **Natural Measure:** Apply uniformity with respect to the *natural measure* of the space involved (e.g., length, area, volume).

  Let's apply this to your cases, identify which verdicts survive, and see what must be dropped:

  1.  **The Cube:**
      *   **Scenario A (Uniform Side Length `l ~ U(0,1)`):** `P(l < 0.5) = 0.5`. This implies the volume `V = l³` has a non-uniform distribution: `f_V(v) = (1/3)v^{-2/3}` for `0 < v < 1`.
      *   **Scenario B (Uniform Volume `V ~ U(0,1)`):** `P(V < 0.125) = 0.125`. This implies the side length `l = V^{1/3}` has a non-uniform distribution: `f_l(l) = 3l²` for `0 < l < 1`.
      *   **The Conflict:** Both *cannot* be true descriptions of the *same* random process. The Principle of Indifference gives different answers depending on whether you naively apply it to `l` or `V`.
      *   **Resolution:** You **must give up one** of these gut verdicts. Which one survives depends *entirely* on the actual machine:
          *   If the machine selects side length uniformly (e.g., a setting on a dial from 0 to 1m), keep `P(l < 0.5) = 0.5`.
          *   If the machine selects target volume uniformly (e.g., fills a mold to a random volume between 0 and 1m³), keep `P(l < 0.5) = P(V < 0.125) = 0.125`.
          *   Without knowing the *physical mechanism*, neither application of the Principle of Indifference is justified. The principle itself doesn't tell you *which* parameter to apply uniformity to.

  2.  **Chords in a Circle (Bertrand's Paradox):**
      *   **Method 1 (Uniform Endpoints):** `P(chord > side) = 1/3`. This applies uniformity to the *circumference* (a 1D measure).
      *   **Method 2 (Uniform Distance from Centre):** `P(chord > side) = 1/2`. This applies uniformity to a *linear distance* within a fixed range.
      *   **Method 3 (Uniform Midpoint in Disk):** `P(chord > side) = 1/4`. This applies uniformity to the *area* (a 2D measure).
      *   **The Conflict:** Three different, seemingly "indifferent" ways to define "random chord" yield three different probabilities.
      *   **Resolution:** This is the canonical paradox exposing the flaw in the naive Principle of Indifference. Symmetry arguments are key:
          *   **Rotational/Rotoreflectional Invariance:** A truly random chord's distribution shouldn't change if you rotate or flip the circle. Method 1 (endpoints) satisfies this completely. Method 3 (midpoint) satisfies rotational symmetry but not necessarily all reflections *in the same way*. Method 2 (distance) breaks rotational symmetry.
          *   **Scale Invariance:** The probability shouldn't depend on the circle's size. All three methods satisfy this.
          *   **Natural Measure:** The circle's symmetry group acts most naturally on the circumference itself. Picking points uniformly on the circumference (Method 1) aligns with this.
      *   **Verdict:** **Keep 1/3 (Method 1)**. It respects the rotational and scale invariance of the circle most fundamentally. You must **give up the 1/2 (Method 2)** and **1/4 (Method 3)** as definitions of a "random chord" *if* we require full rotational invariance. Method 3 is valid *if* we define randomness by throwing darts uniformly at the disk, but this corresponds to a different physical process than "random chord" typically implies.

  3.  **Point on Earth:**
      *   **Gut Verdict 1 (Equal-Area Patches):** Correct. This applies uniformity with respect to the *natural measure* of the *surface* – its *area*.
      *   **Gut Verdict 2 (Balk at `P(Latitude 80°) = P(Equator)`):** Correct. Latitude lines are *not* equal area. A band near the pole has much less surface area than an equal-latitude-width band near the equator.
      *   **The Conflict:** Naively applying indifference to the *parameter* "latitude" (`ϕ ~ U(-90°, 90°)`) would imply `P(80° < ϕ < 81°) = P(0° < ϕ < 1°)`, which is wrong.
      *   **Resolution:** **Keep both gut verdicts.** Uniformity must be applied to the *surface area element* `dA = R² cos(ϕ) dϕ dθ`, not to the latitude `ϕ` directly. The probability density is proportional to `cos(ϕ)` (for uniform `θ`), reflecting the decreasing circumference of latitude lines towards the poles. The Principle of Indifference only works here if applied to the *area*, not the latitude coordinate.

  **The Core Principle(s):**

  1.  **The Principle of Insufficient Reason (Refined):** Only apply indifference between outcomes that are truly symmetric *given the specified random process and the natural structure of the sample space*. Outcomes must be *indistinguishable* except for their labels, *relative to the underlying symmetries*.
  2.  **Respect the Natural Measure:** Apply uniformity with respect to the intrinsic geometric measure of the sample space (length for curves, area for surfaces, volume for solids, arc length for angles).
  3.  **Invariance Under Symmetry:** The probability distribution should be invariant under the natural symmetry transformations of the problem (e.g., rotation, translation, scaling).

  **A New Case: Random Point on a Sphere (Revisited with Longitude)**

  *   **Scenario:** We agree a random point is uniform w.r.t. surface area. What is `P(0° < Longitude (θ) < 30°)`?
  *   **Naive Indifference:** `θ ~ U(0°, 360°)` suggests `P = (30-0)/360 = 1/12`.
  *   **Correct Application:** Longitude lines (like latitude bands) *are* equal in *total length* (they are all great semicircles). Crucially, the *density* of points is constant along any line of constant latitude. The symmetry group includes rotation around the polar axis. This means longitude *is* uniformly distributed: `θ ~ U(0°, 360°)`. **Keep `P = 1/12`.** This works because rotating the sphere around its axis leaves the distribution invariant *and* corresponds to shifting longitude uniformly. The natural measure (area) decomposes as `dA = R² cos(ϕ) dϕ dθ`, and for a fixed `ϕ`, the density in `θ` *is* uniform.

  **What You Must Give Up:**

  1.  **Cube:** You *must* give up **either** the `1/2` **or** the `1/8`. You cannot keep both. Which one depends entirely on whether the machine randomizes side length or volume.
  2.  **Chords:** You *must* give up **1/2 (uniform distance from center)** and **1/4 (uniform midpoint in disk)** as definitions of a "random chord" *if* you require the distribution to be invariant under all rotations of the circle. Keep **1/3 (uniform endpoints)** as the solution satisfying the strongest symmetry requirements.
  3.  **Earth (Latitude):** You *must* give up the idea that indifference applied to the latitude *coordinate* gives the correct probability for latitude bands. Keep indifference applied to *surface area*.

  **In essence:** The naive Principle of Indifference is unreliable. Your surviving gut verdicts are those that respect the *underlying physical process* (if known) or the *natural geometric measure and symmetries* of the sample space (when the process is abstract). Probability distributions live on sample spaces with structure; indifference must be applied to outcomes that are truly equivalent *within that structure*. Always ask: "Uniform with respect to *what measure*?" and "Invariant under *which symmetries*?"
