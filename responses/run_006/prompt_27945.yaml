answer: |-
  Below is a comprehensive simulation game for your socialist calculation debate unit, designed for a 90-minute session with 16 students. The activity uses only paper, index cards, markers, and a whiteboard. It emphasizes **local knowledge dispersion**, **incentive misalignment**, and the **role of prices as information carriers** without pre-teaching theory. Theoretical connections (Mises, Hayek, Lange) are reserved for the debrief.

  ---

  ### **Game Overview**
  - **Economy Setup**: 5 goods (G1, G2, G3, G4, G5). G5 is the "priority good" (final consumption good).  
  - **Goal**: Maximize G5 production.  
  - **Rounds**:  
    - **Round 1 (Central Planning)**: No prices for inputs (G1–G4). Central Planners allocate resources.  
    - **Round 2 (Market Exchange)**: Inputs are traded using student-negotiated prices.  
  - **Key Learning**: Students experience why centralized allocation fails without prices and how markets transmit dispersed knowledge.  

  ---

  ### **Roles & Materials**  
  **Roles (16 Students)**:  
  1. **Central Planning Board (CPB)** (3 students):  
     - Allocate resources, set production targets.  
     - *Materials*: Master input-output table (Table 1), resource cards, marker, whiteboard.  
  2. **Enterprise Managers** (5 students):  
     - Each produces one good (Manager 1 → G1, ..., Manager 5 → G5).  
     - Know their **own** production function and local constraints.  
     - *Materials*: Production card (Table 2), 2 local knowledge cards.  
  3. **Local Informants** (8 students):  
     - Each holds 1–2 pieces of **specific, dispersed knowledge** (e.g., "G3 factory has broken machinery").  
     - *Materials*: Knowledge cards (see examples below).  

  **Materials**:  
  - **Resource Cards**: 50 total (e.g., 10 cards each for G1, G2, G3, G4).  
  - **Production Cards**: For Enterprise Managers (Table 2).  
  - **Knowledge Cards**: For Local Informants (examples):  
    - "Manager 3’s factory can only produce 50% output due to machine failure."  
    - "G4 requires 2x more G1 in humid conditions (it’s humid today)."  
    - "Manager 2 can substitute G3 for G4 at a 1:1 ratio."  
    - "Transporting G2 to Manager 5 takes 2 days (unusable this round)."  
  - **Whiteboard**: Track allocations (Round 1) and prices (Round 2).  
  - **Timer**: Strict timekeeping for each phase.  

  ---

  ### **Production Setup**  
  **Input-Output Relationships (Simplified for Game)**:  
  *Table 1: Master Table (Visible to CPB Only)*  
  | Good | Inputs Needed to Produce 1 Unit | Max Output per Round |  
  |------|----------------------------------|----------------------|  
  | G1   | 2 G2 + 1 G3                     | 10 units             |  
  | G2   | 1 G1 + 1 G4                     | 10 units             |  
  | G3   | 1 G2 + 2 G4                     | 8 units              |  
  | G4   | 3 G1 + 1 G3                     | 6 units              |  
  | G5   | 1 G1 + 1 G2 + 1 G3 + 1 G4       | 5 units              |  

  *Table 2: Enterprise Manager Card (e.g., Manager 1 for G1)*  
  ```  
  GOAL: Produce G1  
  INPUTS NEEDED: 2 G2 + 1 G3 → 1 G1  
  MAX OUTPUT: 10 units  
  LOCAL CONSTRAINTS:  
  - [REDACTED: On your Knowledge Cards]  
  ```  
  *(Each Manager has 2 knowledge cards revealing local constraints, e.g., "Max output reduced to 5 due to maintenance.")*  

  **Initial Resources (CPB starts with)**:  
  - G1: 0, G2: 10, G3: 10, G4: 10, G5: 0.  
  *(G2, G3, G4 are inputs; G1 and G5 must be produced.)*  

  ---

  ### **Rules & Payoff Structure**  
  **Payoffs (No Real Money):**  
  - **Round 1**:  
    - CPB: 1 point per unit of G5 produced.  
    - Managers: 3 points for meeting ≥90% of target, 1 point for ≥50%, 0 otherwise.  
  - **Round 2**:  
    - CPB: 1 point per unit of G5 produced.  
    - Managers: Points = (Units sold × Price) − (Input costs).  
    - *Prices set in tokens (1 token = 1 point). CPB buys G5 for 10 tokens/unit.*  
  - **Informants**: 2 points if their knowledge is **used correctly** by their Manager or CPB.  

  **Round 1 Rules (Central Planning - 30 mins)**:  
  1. **Planning Phase (15 mins)**:  
     - CPB interviews Managers/Informants to gather info.  
     - Managers/Informants:  
       - May only speak when asked.  
       - Cannot share unsolicited info or talk to other Managers.  
       - Must answer truthfully but **only if asked the right question** (e.g., "What is your max output?" triggers a knowledge card).  
     - CPB allocates resources and sets targets on whiteboard.  
  2. **Production Phase (5 mins)**:  
     - Managers calculate output based on allocated inputs and their knowledge cards.  
     - Report actual output to CPB.  
  3. **CPB Adjustment (10 mins)**:  
     - CPB reallocates surplus resources based on shortages.  
     - Managers produce again (no new targets).  

  **Round 2 Rules (Market Exchange - 30 mins)**:  
  1. **Setup (5 mins)**:  
     - CPB sets **initial prices** for G1–G4 (e.g., G1=5 tokens, G2=4 tokens, etc.).  
     - Each Manager gets **20 tokens** (seed money).  
     - CPB auctions initial resources (G2, G3, G4) at set prices.  
  2. **Trading Phase (15 mins)**:  
     - Managers buy/sell inputs **freely** with tokens.  
     - Prices negotiable (record final prices on whiteboard).  
     - Informants may be consulted (Managers now actively seek knowledge to cut costs).  
  3. **Production & Sale (10 mins)**:  
     - Managers produce G1–G5.  
     - Sell G5 to CPB for 10 tokens/unit. Intermediate goods (G1–G4) sold to other Managers.  

  ---

  ### **Timeline (90 Mins Total)**  
  **0:00–0:05**: Introduction (Goal: "Maximize G5 production") + Role Assignment.  
  **0:05–0:10**: Distribute materials + Explain Round 1 rules.  
  **0:10–0:40**: **Round 1** (Planning 15 mins, Production 5 mins, Adjustment 10 mins).  
  **0:40–0:45**: Reset + Explain Round 2 rules.  
  **0:45–1:15**: **Round 2** (Setup 5 mins, Trading 15 mins, Production/Sale 10 mins).  
  **1:15–1:30**: **Debrief** (Script below).  

  ---

  ### **Debrief Script (15 Mins)**  
  **Step 1: Elicit Student Observations (5 mins)**  
  - "What frustrated you in Round 1?"  
    *(Expected: CPB couldn’t get the right info; Managers couldn’t share knowledge; unused resources; G5 underproduced.)*  
  - "What changed in Round 2?"  
    *(Expected: Trading revealed scarcity; prices reflected local knowledge; Managers innovated to cut costs.)*  

  **Step 2: Map to Theory (7 mins)**  
  - **Mises’ Point**: "In Round 1, there were no **market prices for inputs** (G1–G4). How did the CPB decide whether to allocate G2 to Manager 1 or Manager 3? *(They guessed or used arbitrary math.)* Mises argued that without ownership and exchange, you can’t generate prices to compare alternative uses rationally. You experienced this as chaos or waste."  
  - **Hayek’s Point**: "What happened to the Informants’ knowledge in Round 1? *(It was dispersed and often went unused.)* Hayek said this knowledge is **concrete, local, and undiscoverable by planners**. In Round 2, when you traded, prices **revealed** this knowledge—e.g., a high G4 price signaled scarcity from that humidity constraint. Prices aren’t just numbers; they’re a discovery process."  
  - **Lange’s Point**: "In Round 2, the CPB set initial prices and adjusted based on shortages/surpluses. This mirrors Lange’s ‘trial-and-error’ model: planners simulate a market by tweaking prices. But did it work perfectly? *(Likely not—adjustments were slow.)*"  
  - **Hayek vs. Lange**: "Hayek would say Lange solved an easier problem. Round 2 prices emerged from **real exchange**, not just CPB fiat. The CPB could adjust prices, but could they ever know about the broken machine or humidity? Hayek said only decentralized trade reveals this."  

  **Step 3: Lange’s Rebuttal (3 mins)**  
  - "Lange could reply: ‘In Round 2, CPB-set prices still improved allocation. Planners don’t need perfect knowledge—they just need prices to guide managers, who know local conditions.’ But did your Managers have the **incentive** to share truthfully in Round 1? Lange assumed managers follow rules, but in reality, incentives matter."  

  ---

  ### **Predictable Challenges & Limitations**  
  **What Will Go Wrong**:  
  - **Round 1 Chaos**: CPB may freeze from information overload. Managers might not ask Informants key questions.  
  - **Round 2 Trading Bottlenecks**: Negotiations could stall; dominant students may control prices.  
  - **Time Crunch**: Strict timekeeping is essential. Cut phases at 80% if needed.  

  **Limitations of the Activity**:  
  1. **No Capital Goods**: The game uses producer goods only (no Mises-style capital valuation).  
  2. **Simplified Incentives**: Real profit motives are crudely mimicked with points.  
  3. **Static Knowledge**: Informants’ cards are fixed; real-world knowledge is dynamic.  
  4. **Lange’s Iterations**: No time for multiple CPB price adjustments (key to his model).  

  **Mitigations**:  
  - Assign a confident student as CPB facilitator.  
  - Pre-write knowledge cards to ensure interdependence (e.g., "Manager 4’s constraint affects Manager 2").  
  - Emphasize during debrief: "This is a toy economy—real debates involve scale, innovation, and politics."  

  ---

  This simulation forces students to confront Hayek’s knowledge problem viscerally while setting up Lange’s model as a counterpoint. The payoff system creates light stakes, and the debrief links gameplay to theory explicitly. Let me know if you need adjusted materials or role cards!
