prompt: |-
  Before I engage further with the growing literature on inferring human preferences from behavior — spanning inverse reinforcement learning, revealed preference theory in economics, and recent work in AI alignment on value learning — I want the specification first. Write the desiderata that any adequate theory of preference inference must meet. I need: the cases it must handle correctly (single-shot versus repeated choices, stochastic behavior, multi-agent settings, situations involving weakness of will or self-deception, behavior under false beliefs or incomplete information), the distinctions it must respect and not collapse (inferred versus actual preferences, what an agent wants versus what it is merely disposed to do, revealed versus normative preferences, preferences versus constraints), and the empirical results from psychology and behavioral economics it must accommodate (framing effects, time inconsistency, social preferences, context-dependence of choice). For each requirement, give the case or consideration that motivates treating it as a requirement rather than an optional feature. Flag any pairs of desiderata you suspect cannot be jointly satisfied, and identify which single requirement does the most work in excluding popular approaches. A table for the desiderata is fine; I will evaluate particular theories against the list myself.
reasoning: |-
  Okay, the user is diving deep into preference inference across multiple fields—AI, economics, psychology. They want a rigorous specification of desiderata before engaging with the literature. This is clearly a preparatory step for critical analysis, likely for academic research or high-stakes AI alignment work.  

  First, I need to map the scope:  
  - **Cases to handle**: They listed single-shot/repeated choices, stochastic behavior, etc. Each needs justification. For example, weakness of will is non-negotiable because ignoring it conflates accidental actions with true intent (like someone dieting but grabbing cake).  
  - **Distinctions to respect**: The inferred vs. actual preferences gap is crucial—robots misinterpreting human preferences could lead to harmful AI actions. Revealed vs. normative matters for ethics (e.g., should a smoking habit be "respected"?).  
  - **Empirical must-accommodate**: Framing effects break rational choice axioms, so any theory dismissing them fails empirically. Time inconsistency isn't just noise; it's fundamental to how humans discount future rewards.  

  The user’s phrasing suggests they’ve seen superficial treatments of these topics and want armor against flawed assumptions. They’re likely building a framework to dissect papers. The demand to flag incompatible desiderata is especially telling—they anticipate trade-offs.  

  Biggest tension I see: **Revealed preference purity vs. psychological realism**. If you strictly equate choices with preferences (as economists often do), you can’t explain weakness of will. But if you overcorrect by adding "true preferences" unmoored from behavior (like some cognitive models), inference becomes unfalsifiable. This conflict alone disqualifies most classical approaches.  

  The user didn’t mention meta-preferences (wanting to want differently), but I’ll sneak it into the "normative preferences" distinction—it’s ethically relevant for AI systems that might "nudge" behavior.  

  For the table, I’ll cluster desiderata by domain but cross-reference conflicts. The "key exclusion" column will highlight how empirical findings (like framing effects) torpedo revealed preference theory. Time inconsistency as a requirement specifically filters out naive rational agent models.  

  Most exclusionary item? Probably **D3 (inferred ≠ actual)**. It forces models to handle self-deception/false beliefs, which rules out:  
  - Inverse RL (assumes actions reflect true rewards)  
  - Standard revealed preference (choices = preferences)  
  - Simple Bayesian preference learning  

  This one requirement pushes us toward messy, layered models of mind—exactly what the user seems prepared for.
answer: |-
  Below is a structured specification of desiderata for a theory of preference inference, with justifications for each requirement, flagged conflicts, and identification of the most exclusionary requirement.  

  ---

  ### **Desiderata for a Theory of Preference Inference**  
  | **Category**               | **Desideratum**                                                                 | **Motivation for Requirement**                                                                                                | **Key Conflicts?**                     |  
  |----------------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|----------------------------------------|  
  | **Cases to Handle**        | **C1. Single-shot vs. repeated choices**                                        | *Motivation:* Must distinguish one-off decisions (e.g., emergency actions) from habitual behavior (e.g., addiction cycles). Ignores dynamics if only one is handled. | None evident                           |  
  |                            | **C2. Stochastic behavior**                                                     | *Motivation:* Real agents exhibit probabilistic choices (e.g., exploration in RL). Deterministic models fail empirically.      | None                                   |  
  |                            | **C3. Multi-agent settings**                                                    | *Motivation:* Preferences shift in social contexts (e.g., bargaining, altruism). Single-agent theories misread strategic acts. | With C7 (weakness of will)             |  
  |                            | **C4. Weakness of will / self-deception**                                       | *Motivation:* Agents act against self-professed goals (e.g., procrastination). Ignoring this conflates error with preference. | With D6 (revealed=normative collapse) |  
  |                            | **C5. False beliefs / incomplete information**                                  | *Motivation:* Choices based on misinformation (e.g., buying "fake" medicine) shouldn’t infer true preferences. Essential for robust alignment. | With D1 (inferred=actual collapse)    |  
  | **Distinctions to Respect**| **D1. Inferred ≠ actual preferences**                                           | *Motivation:* Agents mask true intent (e.g., diplomacy). Collapsing these risks adversarial manipulation (e.g., in AI systems). | Conflicts with C5                     |  
  |                            | **D2. Wants ≠ dispositions**                                                    | *Motivation:* Reflexes (e.g., flinching) aren’t preferences. Vital for physical AI to avoid misattributions.                  | None                                   |  
  |                            | **D3. Revealed ≠ normative preferences**                                        | *Motivation:* Revealed preferences may reflect oppression (e.g., resigned choices). Normative ideals guide ethical AI design. | Conflicts with C4                     |  
  |                            | **D4. Preferences ≠ constraints**                                               | *Motivation:* Budget-limited choices (e.g., famine food) don’t indicate liking. Essential for economic fairness.              | None                                   |  
  | **Empirical Accommodations**| **E1. Framing effects**                                                         | *Motivation:* Choices reverse under equivalent frames (e.g., 90% lean vs. 10% fat meat). Challenges rational choice axioms. | With D6 (revealed=normative)          |  
  |                            | **E2. Time inconsistency**                                                      | *Motivation:* Hyperbolic discounting (e.g., procrastination) contradicts exponential models. Central to behavioral economics. | Conflicts with D3                     |  
  |                            | **E3. Social preferences**                                                      | *Motivation:* Inequity aversion (e.g., rejecting unfair splits) requires non-selfish utility functions. Ignored by classical IRL. | With C3 (multi-agent)                |  
  |                            | **E4. Context-dependence**                                                      | *Motivation:* Menu-dependence (e.g., decoy effects) violates IIA. Real choices are reference-sensitive.                       | With E1 (framing)                     |  

  ---

  ### **Key Notes:**  
  1. **Flagged Conflicts**:  
     - **C4 (Weakness of will) vs. D3 (Revealed ≠ Normative)**: If preferences are defined *only* by choices, normative critiques (e.g., "should want health") become incoherent.  
     - **C5 (False beliefs) vs. D1 (Inferred ≠ Actual)**: Theories assuming actions reveal "true" preferences (e.g., classical IRL) fail when beliefs are wrong.  
     - **E1 (Framing) vs. D6 (Revealed=Normative)**: Framing shows choices aren’t stable, undermining revealed preference as a normative guide.  

  2. **Most Exclusionary Requirement**:  
     - **D1 (Inferred ≠ Actual Preferences)**. This excludes:  
       - **Classical Revealed Preference Theory**: Assumes choices directly reveal ordinal preferences.  
       - **Naive Inverse RL**: Treats observed behavior as optimal for a true reward function.  
       - **Simple Behavioral Models**: Equate actions with "preferences" without mental state attribution.  
       *Reason:* Forces models to incorporate theory of mind, belief inference, and deception robustness.  

  3. **Critical Trade-off**: Accommodating **E2 (Time Inconsistency)** while respecting **D3 (Revealed ≠ Normative)** requires separating "current self" preferences from "planned self" ideals—a challenge for axiomatic approaches.  

  ---

  ### **Why These Requirements?**  
  - **Non-optionality**: Each is grounded in real-world failures:  
    - Ignoring **C4/C5** lets AI systems exploit human vulnerabilities (e.g., addiction to engagement).  
    - Collapsing **D3** justifies harmful status quos (e.g., "users *want* addictive features").  
    - Dismissing **E1/E4** invalidates models in marketing, policy, or AI alignment where framing matters.  
  - **High-Stakes Exclusion**: **D1** alone rules out most economics-derived methods for safety-critical AI, demanding richer cognitive models.  

  Use this table to stress-test theories: e.g., standard IRL fails **C4, C5, E1, E2**; revealed preference fails **C4, C5, E1–E4**.
