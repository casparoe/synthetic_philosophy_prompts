prompt: |-
  I am a PhD student in philosophy of science, currently completing a twelve-month policy fellowship embedded in the modeling and risk-assessment division of a national public health agency. The division produces probabilistic forecasts across several streams: infectious-disease outbreak trajectories, heat-mortality projections under climate scenarios, and post-market vaccine effectiveness estimates. The forecasts arrive from distinct modeling teams who operate within different statistical frameworks, often without making their interpretive commitments explicit. Some outputs are frequentist confidence bounds derived from surveillance time series. Some are Bayesian posterior probabilities incorporating structured expert elicitation. Some are weighted ensemble outputs from multi-model simulation pipelines in which the meaning of the output probability is itself ambiguous — the number behaves like a credence in some respects, a long-run frequency in others, and neither cleanly. Meanwhile, the communications office must translate these numbers into plain-language briefings for ministry officials and press releases for the public, routinely collapsing distinct kinds of probability into a single "percent chance" statement. On at least two occasions in the past year, a policy decision turned on whether to treat a probability as a stable feature of the world or as a summary of current ignorance, and the disagreement was never surfaced because no one had a shared vocabulary for it.

  I have been asked to produce an internal guidance document: a decision procedure that any staff member — an epidemiologist, a risk communicator, a policy officer — can apply to a probability claim to determine (1) which interpretation of probability (frequentist, subjective/Bayesian, propensity, or hybrid) is operative, (2) whether that interpretation matters for the decision or the communication at hand, and (3) where it does matter, how to translate or reframe the claim for the target audience without misrepresenting what is known.

  The procedure should take the form of a step-by-step questionnaire or a flowchart in words, something a user with basic statistical literacy but no formal philosophy background can complete in under fifteen minutes for a single claim. It must handle the following hard cases:

  - Probabilities that mix interpretations (e.g., a Bayesian update on a prior derived from observed frequencies; a propensity model fed into a subjective decision threshold).
  - Situations where two defensible interpretations yield the same numerical value but support different actions or different levels of confidence in the number.
  - Cases where no single interpretation fits cleanly, and the user must decide which aspects of the claim to prioritize.
  - Cases where the communication consequence of switching interpretations is politically or ethically loaded (e.g., a frequentist framing suggests we lack enough data to act, while a Bayesian framing licenses action on the same evidence).

  The procedure must flag the points at which judgment cannot be eliminated and the question must be escalated to a senior analyst. It should be honest about which steps involve value judgments dressed as technical choices.

  Please illustrate the procedure by working it through on two realistic cases drawn from the agency's actual work:

  (a) A forecast stating that there is a 23% probability of a measles outbreak exceeding 500 cases in a specified region over the next quarter, generated by fitting a stochastic compartmental transmission model to the previous five years of weekly case counts, with no expert priors incorporated. The communications office proposes reporting this as "about a one-in-four chance."

  (b) A claim that a newly introduced vaccine against a mosquito-borne virus has a 92% probability of being at least 80% efficacious, derived from a Bayesian analysis of a single-season trial, where the prior on vaccine efficacy was explicitly elicited from a panel of twelve experts using a structured protocol. The communications office proposes reporting this as "the vaccine is 92% likely to be highly effective."

  For each case, show what the procedure outputs at each step, whether it flags an escalation point, and what communication guidance it ultimately recommends — including whether it endorses or revises the proposed language. Ideally, the two cases should illustrate places where the procedure recommends different communication treatments despite superficial similarities in the numbers.

  Finally, identify what the procedure cannot do: the kinds of probability-involving decisions or disputes it will not resolve, the audiences for whom it will be inadequate, and the conditions under which it is likely to misfire.
reasoning: |-
  We are designing a decision procedure in the form of a flowchart or questionnaire. The goal is to help staff determine:
  1. The interpretation of probability (frequencies, Bayesian, propensity, hybrid) in a given claim.
  2. Whether the interpretation matters for the decision or communication.
  3. How to translate or reframe the claim appropriately when it does matter.

  The procedure must handle hard cases and flag points for escalation.

  We'll outline the steps:

  Step 1: Identify the source of the probability claim.
  - What kind of model or analysis produced it? (e.g., frequentist confidence interval, Bayesian posterior, ensemble model, etc.)
  - What inputs were used? (e.g., data only, expert priors, multiple models, etc.)

  Step 2: Determine the dominant interpretation(s) of probability in the claim.
  - If the model is based on long-run frequencies (e.g., from historical data) without priors, it leans frequentist.
  - If it incorporates prior beliefs (expert or otherwise) and updates with data, it is Bayesian/subjective.
  - If it is about a single-case chance (like a physical propensity), it might be propensity (but note: in practice, these are often modeled with Bayesian or frequentist methods).
  - If it mixes (e.g., uses frequentist data as prior in Bayesian update), note the hybrid nature.

  Step 3: Assess if the interpretation matters.
  - Does the decision or communication hinge on how we interpret the probability? Consider:
    - Is the probability being used for a one-off decision (where subjective Bayesian might be more natural) or for long-run calibration (where frequentist properties matter)?
    - Is there a risk of misinterpretation because the number could be seen as a fixed property vs. a state of knowledge?
    - Are there two defensible interpretations that yield the same number but suggest different actions? (e.g., a Bayesian might act on a 70% probability while a frequentist might want more data because the confidence interval is wide)

  Step 4: If the interpretation matters, determine how to reframe for the audience.
  - For the public: avoid technical terms. Use clear language about what the probability represents (e.g., "based on historical patterns" for frequentist, "based on current evidence and expert judgment" for Bayesian, or "based on a combination of data and expert opinion" for hybrid).
  - For policy officials: be more explicit about the nature of the uncertainty and the limitations.

  Step 5: Flag for escalation when:
  - There is a mix of interpretations and the dominant one is unclear.
  - The decision has high stakes and the interpretation leads to conflicting actions.
  - The communication has ethical/political implications that require senior input.

  Now, we design the procedure as a questionnaire:

  **Procedure: Interpreting and Communicating Probability Claims**

  **Step 1: Source Analysis**
  - Q1.1: How was the probability generated?
    - (a) From a model using only observed data (with no prior distributions) -> frequentist.
    - (b) From a model that explicitly used a prior distribution (expert-elicited or otherwise) -> Bayesian.
    - (c) From a model that combines multiple models or sources (including expert judgment and data) -> hybrid.
    - (d) Other (specify) -> may require escalation.

    If (a), go to Step 2 with frequentist as primary.
    If (b), go to Step 2 with Bayesian as primary.
    If (c), go to Step 2 with hybrid and note components.

  **Step 2: Interpretation Check**
  - Q2.1: Does the probability claim refer to a long-run frequency (e.g., if we could repeat the situation many times, this is the proportion of times the event would occur) OR to a degree of belief given current evidence?
    - If long-run frequency, then frequentist or propensity (if about a single case with inherent chance) but note: in public health, propensity is rare without data.
    - If degree of belief, then Bayesian.
    - If both, then hybrid.

    However, note that the source analysis in Step 1 is primary. This step is to check if there might be ambiguity.

    Q2.2: If the model is hybrid, can you disentangle the contributions? (e.g., the prior came from frequentist data, the update is Bayesian) -> If no, flag for escalation.

    Q2.3: Is the probability about a specific one-time event (like an outbreak in the next quarter) or about a general property (like vaccine efficacy)? 
    - One-time event: Bayesian or propensity might be more natural, but frequentist can be used for predictions too (if they are thought of as a long-run frequency of similar predictions).
    - General property: can be either.

    Output: The primary interpretation (frequentist, Bayesian, hybrid) and any secondary aspects.

  **Step 3: Relevance Assessment**
  - Q3.1: Is the probability being used for a decision that depends on the interpretation? Consider:
    - If the same number was obtained by a different method (e.g., Bayesian vs. frequentist) would it change the decision? (e.g., because the frequentist interval is wider or the Bayesian result is more optimistic)
    - Is there a disagreement among team members about how to interpret the probability?
    - Are there high stakes (e.g., policy, ethical, or political implications) that might make the interpretation matter?

    Q3.2: For communication: will the audience (public or officials) misinterpret the probability if we don't clarify the interpretation? (e.g., if we present a Bayesian probability as a long-run frequency, we might be overstating the evidence.)

    If yes to any, the interpretation matters -> go to Step 4.
    If no, then the interpretation may not matter and you can communicate the number without clarification about the interpretation (but still with context about what the event is). However, note: even if not critical, it's good practice to be clear.

  **Step 4: Reframing and Communication Guidance**
  - Based on the interpretation and the audience:

    For frequentist probabilities:
      - Public: "Based on historical patterns, we expect that in situations like this, ..."
      - Officials: "This confidence interval reflects the variability we would expect if we could repeat the data collection many times."

    For Bayesian probabilities:
      - Public: "Based on the current evidence and expert judgment, we estimate ..."
      - Officials: "This posterior probability represents our updated belief after incorporating the data and prior knowledge."

    For hybrid:
      - Public: "Based on a combination of past data and expert assessment, ..."
      - Officials: "This probability combines historical data with expert judgment in a Bayesian framework."

    Also, avoid phrases that imply the probability is a fixed property of the world (like "the chance is") when it is Bayesian (which is about knowledge). Instead, use "we estimate the chance" or "our assessment is that there is a ... chance".

    Q4.1: Are there ethical/political implications of the framing? (e.g., a Bayesian framing might justify action with less data, which could be seen as more proactive or as less rigorous.) 
      - If yes, flag for escalation and do not finalize communication without review.

  **Step 5: Final Check and Escalation**
  - Review: Does the recommended communication accurately reflect the source and interpretation without overstating?
  - If at any step you were unsure or if there is a mix that cannot be resolved, or if there are high stakes and conflicting interpretations, escalate to senior analyst.

  Now, let's apply this to the two cases.

  **Case (a): Measles outbreak forecast**
  - Step 1: Generated by fitting a stochastic compartmental model to five years of weekly case counts, no expert priors. -> This is frequentist (long-run frequency from data).
  - Step 2: The probability is about a one-time event (outbreak in the next quarter), but the model is based on historical frequencies. Interpretation: frequentist (as a long-run frequency of such outbreaks in similar conditions? Note: stochastic models often generate probabilities by simulation, which are frequentist in nature because they are based on many simulated runs). 
    - Q2.3: It's a one-time event, but the model treats it as a frequency over many simulations. So we can say: the 23% is the proportion of simulations in which the outbreak exceeds 500 cases. That's frequentist.
  - Step 3: Does it matter? For communication, if we say "one-in-four chance" without context, the public might think it's a fixed chance (like a coin toss). But since it's based on historical data, it's not a state of knowledge but a projection from patterns. However, for a one-time event, we can't observe the long run. So there might be a subtlety. Also, note that the model doesn't account for current conditions that might be different. But the procedure doesn't ask about model validity. We are only on interpretation of probability. Since it's purely frequentist, and the event is a future one-time event, we might need to explain that it's based on what we've seen in the past. 
    - Decision: if the policy is about preparing for an outbreak, the frequentist probability is a valid measure. But note: the same number from a Bayesian model might be interpreted differently. Here, since it's frequentist, it's not about current state of knowledge but about what the model (calibrated on past data) projects. 
    - However, the model is for the future, so it's predictive. In predictive modeling, frequentist probabilities are often interpreted as the long-run frequency of the event under the model. So for communication, we should note the basis.

    We decide that the interpretation matters because it's a prediction and we want to be clear about the basis (data only, no expert judgment). So go to Step 4.

  - Step 4: 
    - Recommended public communication: "Based on historical patterns of measles and our disease model, we estimate there is a 23% chance (about 1 in 4) of an outbreak exceeding 500 cases in the region over the next quarter."
    - This revises the proposed "about a one-in-four chance" by adding the basis (historical patterns and model). It avoids misrepresenting as a fixed chance.

    Check for ethical/political implications: The frequentist nature might be seen as more objective, but also might be challenged if conditions have changed. However, no strong ethical loading in the framing itself. No escalation needed.

  **Case (b): Vaccine efficacy claim**
  - Step 1: Derived from a Bayesian analysis with a prior elicited from experts. -> Clearly Bayesian.
  - Step 2: Interpretation: the 92% is a Bayesian posterior probability. It represents the degree of belief that the vaccine efficacy is at least 80%, given the trial data and the prior from experts.
  - Step 3: Does it matter? Yes, because the prior was elicited from experts. If we communicate without mentioning the expert input, we might imply the 92% is solely from the trial. Also, note that the claim is about a general property (vaccine efficacy) but the Bayesian result is conditional on the prior. 
    - For decision: a frequentist might compute a confidence interval and see if it lies mostly above 80%, which might give a different level of confidence. The Bayesian result might be more optimistic if the prior was optimistic. So the interpretation matters.

    Go to Step 4.

  - Step 4: 
    - Proposed public communication: "The vaccine is 92% likely to be highly effective" is not ideal because it doesn't mention the role of expert judgment and the data. Also, "highly effective" is vague (we know it means at least 80% efficacious, but the public might not). 
    - Revised public communication: "Based on the trial data and expert assessment, we estimate there is a 92% chance that the vaccine is at least 80% effective."

    But note: the original proposal said "the vaccine is 92% likely to be highly effective." We are adding the basis and the definition of "highly effective". Also, we are using "chance" but qualifying it with the basis.

    However, the phrase "the vaccine is 92% likely" is a bit misleading because it implies a property of the vaccine, but the probability is about our knowledge. We could say: "We estimate a 92% probability that the vaccine is at least 80% effective, based on the trial and expert judgment."

    Ethical/political implications: Using expert judgment might be seen as less objective. In a context where trust in experts is low, this could be an issue. Also, if the trial data alone would have given a lower probability, then the expert prior has increased it. This might be seen as over-optimism. Therefore, flag for escalation: the communication office should be aware of the sensitivity and might need to discuss with senior analysts whether to disclose the role of the prior.

    But note: the procedure says to flag when there are ethical/political implications. We do so.

    After escalation, the senior analyst might decide to be transparent about the method: "Using a statistical method that combines the trial results with expert opinion, we estimate a 92% probability that the vaccine is at least 80% effective."

  **Comparison of Cases**
  - Case (a): We recommended adding the basis (historical patterns and model) to the communication, but didn't require a major change. The interpretation was frequentist and we made that clear by the basis.
  - Case (b): We recommended being explicit about the use of expert judgment and the data, and flagged for escalation because of the potential sensitivity.

  **Limitations of the Procedure**
  - Cannot resolve disputes about the appropriateness of the model or the quality of the data.
  - Not designed for audiences with deep statistical knowledge (e.g., academic researchers) who might require more detail.
  - May misfire when the model is highly complex and the interpretation is genuinely ambiguous (e.g., ensemble models that are not clearly frequentist or Bayesian). In such cases, escalation is necessary but the procedure might not provide a clear path.
  - Does not address when the probability value itself is uncertain (e.g., wide confidence intervals on the probability estimate).
  - Cannot resolve value-laden disagreements about risk tolerance (e.g., how high a probability is needed to act) that might be conflated with the interpretation of probability.
  - May not be adequate for communicating with the public in crisis situations where simplicity is paramount and nuances must be sacrificed.
  - Might misfire if the user lacks even basic statistical literacy (as assumed) or if they rush through the steps.

  **Final Note**: The procedure is a tool to prompt reflection and standardize the consideration of probability interpretations. It cannot replace expert judgment in complex cases.
answer: |-
  Below is a step-by-step decision procedure designed for your agency. It takes the form of a structured questionnaire with branching logic, optimized for clarity and efficiency. The procedure focuses on three core outputs: (1) identifying the interpretation of probability, (2) assessing if it matters for decisions/communication, and (3) providing reframing guidance. It flags escalation points where judgment is unavoidable and highlights value-laden choices. I'll first present the procedure, then apply it to your two cases, and finally outline its limitations.

  ---

  ### **Decision Procedure: Interpreting and Communicating Probability Claims**  
  *Purpose: To consistently evaluate probability claims for internal clarity and public communication.*  
  *Time: <15 minutes per claim. Users: Staff with basic stats literacy (e.g., understands confidence intervals, priors).*  

  #### **Step 1: Source Analysis**  
  *Identify how the probability was generated.*  
  - **Q1.1: What is the primary input for the probability?**  
    - *Data only (e.g., surveillance, trials):* → Go to Q1.2.  
    - *Expert judgment/priors only:* → Interpret as **subjective Bayesian**.  
    - *Mix of data and experts/models:* → Interpret as **hybrid**. Flag for Step 3.  
    - *Simulation/ensemble model:* → Go to Q1.3.  

  - **Q1.2: Was a prior distribution explicitly used?**  
    - *Yes:* → **Bayesian** (if prior was elicited) or **hybrid** (if prior was data-derived).  
    - *No:* → **Frequentist** (if based on long-run frequencies) or **propensity** (if modeling inherent randomness).  

  - **Q1.3: For simulations/ensembles, is the probability based on observed frequencies?**  
    - *Yes (e.g., 23% of model runs hit threshold):* → **Frequentist**.  
    - *No (e.g., weighted average of model outputs):* → **Hybrid**. Flag for Step 3.  

  *Output 1: Dominant interpretation (frequentist, Bayesian, propensity, hybrid).*  

  #### **Step 2: Interpretation-Relevance Check**  
  *Determine if the interpretation affects decisions or communication.*  
  - **Q2.1: Is the probability about a specific event (e.g., outbreak) or a general property (e.g., vaccine efficacy)?**  
    - *Specific event:* → More weight to **Bayesian/propensity** (actionable uncertainty).  
    - *General property:* → More weight to **frequentist** (stable feature).  

  - **Q2.2: Could the same numerical value support different actions?**  
    - *Consider: Would a frequentist vs. Bayesian reading change urgency?*  
      - *Yes (e.g., Bayesian licenses action with sparse data; frequentist demands more evidence):* → **Interpretation matters**. Flag for escalation if stakes are high.  
      - *No:* → Interpretation may not matter.  

  - **Q2.3: Does the claim mix interpretations ambiguously?**  
    - *Yes (e.g., Bayesian update on frequentist prior):* → **Hybrid**. Go to Q2.4.  
    - *No:* → Proceed.  

  - **Q2.4: For hybrids, is the dominant interpretation clear?**  
    - *Yes (e.g., expert prior overshadows data):* → Use dominant interpretation.  
    - *No (e.g., equal weight to data and experts):* → **Escalate to senior analyst**.  

  *Output 2: Decision on relevance:*  
  - **Irrelevant**: Interpretation doesn’t affect use (e.g., number is stable across frameworks).  
  - **Relevant**: Interpretation changes decisions/communication.  
  - **Critical**: High stakes + ambiguous interpretation → **Escalate**.  

  #### **Step 3: Communication Reframing**  
  *Translate the claim for the audience. Always: (1) Clarify the event, (2) Disclose key inputs, (3) Avoid “percent chance” without context.*  
  - **Q3.1: Audience type?**  
    - *Public:* Use plain language, analogies, focus on actionability.  
    - *Policy officials:* Add nuance (e.g., “model-based estimate”).  

  - **Q3.2: Reframing rules based on interpretation:**  
    - **Frequentist/Propensity**: Emphasize *stability*.  
      *Template: “Based on historical/experimental data [specify], this outcome is expected in [X]% of similar situations.”*  
    - **Bayesian**: Emphasize *uncertainty*.  
      *Template: “Based on current evidence and [expert judgment/data], we estimate a [X]% chance.”*  
    - **Hybrid**: Acknowledge *both inputs*.  
      *Template: “Based on a combination of data and expert assessment, we estimate a [X]% chance.”*  

  - **Q3.3: Does reframing have ethical/political risks?**  
    - *Yes (e.g., frequentist framing implies inaction; Bayesian implies premature action):* → **Escalate for senior review**.  
    - *No:* → Proceed with reframing.  

  *Output 3: Recommended communication text + escalation flags.*  

  ---

  ### **Application to Case Studies**  
  **Case (a): Measles Outbreak Forecast**  
  - **Probability claim**: 23% probability of >500 measles cases in Region X next quarter.  
  - **Source**: Stochastic model fit to 5 years of case counts; no priors.  
  - **Proposed public comms**: “About a one-in-four chance.”  

  | **Step** | **User Response** | **Output/Next Step** |  
  |----------|-------------------|----------------------|  
  | **Step 1** | Q1.1: Data only → Q1.2: No prior → **Frequentist** (model simulates frequencies). | Interpretation: **Frequentist** |  
  | **Step 2** | Q2.1: Specific event → Q2.2: Frequentist framing may demand more data for action; Bayesian might support preparedness. **Relevant** (but low stakes). Q2.3: No mix. | Interpretation **matters** for communication clarity. |  
  | **Step 3** | Q3.1: Public audience. Q3.2: Use frequentist template. Q3.3: No political risks. | **Revised comms**: “Based on historical outbreak patterns, our models project a 23% chance (about 1 in 4) of exceeding 500 measles cases in Region X next quarter.”<br>**Escalation?** None. |  

  **Verdict**: Rejects “one-in-four chance” alone. Adds “historical patterns” to emphasize data-dependence. Endorses numerical value but clarifies context.  

  ---

  **Case (b): Vaccine Efficacy Claim**  
  - **Probability claim**: 92% probability vaccine is ≥80% efficacious.  
  - **Source**: Bayesian trial analysis with expert-elicited prior.  
  - **Proposed public comms**: “The vaccine is 92% likely to be highly effective.”  

  | **Step** | **User Response** | **Output/Next Step** |  
  |----------|-------------------|----------------------|  
  | **Step 1** | Q1.1: Mix of data and experts → **Hybrid** (but expert prior dominant). | Interpretation: **Bayesian** (expert prior central). |  
  | **Step 2** | Q2.1: General property → Q2.2: Frequentist might require larger trials; Bayesian allows earlier action. **Relevant** (high stakes: vaccine rollout). Q2.3: Mix → Q2.4: Dominance clear (experts shape prior). | Interpretation **critically matters** (trust in experts). |  
  | **Step 3** | Q3.1: Public audience. Q3.2: Use Bayesian template. Q3.3: **Ethical risk**: Framing as “the vaccine is 92% likely” implies inherent property (misleading); downplaying expert role may erode trust. → **Escalate**. After escalation: Senior analyst approves transparency. | **Revised comms**: “Based on trial data and expert assessment, we estimate a 92% chance the vaccine is highly effective (at least 80% efficacious).”<br>**Escalation?** Yes (Q3.3). |  

  **Verdict**: Rejects “the vaccine is 92% likely” (implies inherent property). Adds “estimate” and discloses expert role. Escalation forced transparency.  

  **Key Contrast**:  
  - Case (a) prioritizes **data-stability** (frequentist); communication adds historical context.  
  - Case (b) prioritizes **knowledge-uncertainty** (Bayesian); communication forces disclosure of expert influence.  
  - Both cases share numerical similarity (∼20–25% and ∼90%), but the procedure yields distinct treatments due to source and stakes.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve deep methodological disputes**:  
     - Cannot arbitrate between equally valid interpretations (e.g., when frequentist and Bayesian analyses conflict philosophically but agree numerically).  
     - Fails if model outputs are fundamentally uninterpretable (e.g., ensemble probabilities with no coherent basis).  

  2. **Handle all audiences**:  
     - **Inadequate for experts**: Academics or modelers need technical details (e.g., prior sensitivity, model structure).  
     - **Public crises**: Under time pressure (e.g., emerging outbreak), nuanced reframing may be impractical.  

  3. **Eliminate value judgments**:  
     - **Q2.2 (actionability) and Q3.3 (ethical risks)** involve implicit values (e.g., risk tolerance). The procedure surfaces but doesn’t resolve these.  
     - Cultural/political factors (e.g., public distrust of experts) may override technical guidance.  

  4. **Address quality issues**:  
     - Cannot validate data/priors (e.g., biased experts, poor model calibration).  
     - Siloed teams may resist interpretation transparency.  

  5. **Edge cases likely to misfire**:  
     - **Propensity-heavy claims** (rare in public health) may confuse users.  
     - **Hybrids with no dominant interpretation** (e.g., ensemble models) often require escalation but may still lack resolution.  
     - **Low-stakes decisions**: Procedure may overcomplicate simple cases.  

  ### **Final Recommendations**  
  - **For your document**: Frame this as a “living tool” — emphasize that it clarifies ambiguity but requires training and senior oversight for high-stakes cases.  
  - **In practice**: Pair with a 30-minute agency workshop to address recurrent issues (e.g., expert priors in Bayesian models).  
  - **Philosophical note**: The procedure operationalizes *pluralism* — it doesn’t force a single “correct” interpretation but mitigates miscommunication.  

  This procedure meets your requirements: it’s actionable in <15 minutes, handles hard cases, flags escalation points, and delivers case-specific outputs. Its strength lies in making implicit commitments explicit, but its limits remind us that probability in policy is as much about values as about math.
