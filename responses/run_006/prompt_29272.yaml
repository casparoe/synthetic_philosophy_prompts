prompt: |-
  I'm trying to work out what I actually think about moral worth — when an action is creditworthy in a way that reflects well on the agent, not merely right by coincidence. Here are my verdicts on a set of cases, and I'd like to know what principle, if any, captures them.

  1. A shopkeeper gives a child the correct change. He does it because he believes honesty is his duty, and he wants to do his duty. The fact that honesty is good for business never crosses his mind. Verdict: the action has moral worth.

  2. A different shopkeeper gives a child the correct change, but he does it solely because he believes a reputation for honesty will bring repeat customers. He doesn't care about duty one way or the other. Verdict: the action lacks moral worth, even though it's the right thing to do.

  3. A passerby sees a stranger collapse on the sidewalk. She rushes over, calls an ambulance, and stays until help arrives. She acts out of immediate sympathy and concern for the person's suffering. The thought "this is my duty" never occurs to her. Verdict: the action has moral worth — and I find myself wanting to say it has at least as much as the first shopkeeper's.

  4. A different passerby sees the same collapse. He feels no sympathy at all — he finds the stranger somewhat repellent. But he believes firmly that one has a duty to help those in need, and he acts solely from that belief. Verdict: the action has moral worth, but it feels somehow thinner than the sympathetic helper's, though I can't articulate why.

  5. A third passerby sees the collapse. She helps, but her motivation is that onlookers will think badly of her if she doesn't. She correctly judges that helping is the right thing to do, but that judgment plays no role in moving her. Verdict: the action lacks moral worth, or at best has very little.

  6. Someone wants to poison his business rival. He puts what he believes is arsenic in the rival's coffee. Unbeknownst to him, the substance is a life-saving antidote to a rare condition the rival has, and the rival recovers fully. Verdict: no moral worth whatsoever. He didn't perform the act of saving a life; he performed the act of attempted murder.

  7. Someone volunteers at a homeless shelter every week. She does it partly because she cares about the guests and partly because she believes she has a duty to help the disadvantaged. Either motive on its own would have been sufficient to get her to volunteer. Verdict: the action has moral worth, and the presence of the duty motive doesn't diminish it.

  8. A father believes, on the basis of what he takes to be sound moral reasoning, that he ought to push his child toward a high-status career. But whenever he tries, he finds he can't bring himself to do it — something in him recoils. Instead he supports his child's choice to study poetry. As it happens, supporting the child's autonomy is the right thing to do, though the father doesn't believe this. Verdict: I want to say the action has some moral worth — his emotional responsiveness is tracking something real — but I'm uneasy, because he's acting against his own best judgment.

  Is there a single principle of moral worth that delivers all or most of these verdicts? If not, which verdicts would you overturn, and what's the best principle that handles the rest? I'm especially interested in what the principle says about a case I haven't listed: someone who acts rightly from a settled disposition of character — say, honesty — that was itself cultivated for purely self-interested reasons long ago, but now operates without any thought of self-interest. Does that action have moral worth?
reasoning: |-
  Hmm, the user is grappling with the concept of moral worth - what makes an action not just right, but creditworthy to the agent. They've presented eight detailed cases with their own verdicts and want to know if there's a unifying principle that explains all of them. They're also curious about an unstated case involving character dispositions cultivated for self-interested reasons.

  Looking at their cases, I notice some patterns. Cases 1 and 2 show the classic Kantian distinction - acting from duty versus self-interest. Their verdict that only the former has moral worth aligns with Kant. But then cases 3 and 4 complicate things - they give moral worth to both sympathy-driven and duty-driven helping, but sense more worth in the sympathetic case. Case 5 again denies worth to externally motivated action. Case 6 is straightforward - intention matters more than outcome. Case 7 allows for mixed motives without diminishing worth. Case 8 is tricky - they grant some worth to an action that goes against the agent's judgment but aligns with emotion.

  The user seems torn between Kantian and sentimentalist approaches. They recognize duty as important (cases 1,4) but also value emotional motivation (case 3). Their unease in case 4 suggests they sense a hierarchy of motives. The case they didn't list about character dispositions is fascinating - it tests whether moral worth depends on original motivation or current motivation.

  I think a pluralistic principle would serve them best. Moral worth requires that the agent: (1) performs the right action, (2) for reasons that capture why it's right, and (3) these reasons must be among their motives. This explains all cases except perhaps case 8 where they feel conflicted. For their unstated case, I'd argue the action has moral worth since current motivation matters, not historical cultivation reasons. The character is now "authentically" honest.

  The user is clearly deeply engaged with this - their examples show sophisticated understanding of moral philosophy nuances. I should acknowledge where their intuitions might conflict (like case 8) rather than forcing consistency. The key is helping them see that moral worth isn't monolithic - different motivations can confer it to different degrees.
answer: |-
  Based on your carefully considered verdicts, a single principle capturing them *almost* all is possible, but requires acknowledging a hierarchy within "right-making reasons." Here's the principle that best fits your core intuitions:

  **Principle of Moral Worth:**  
  An action has moral worth when the agent performs the right action *because* they are directly responsive to (motivated by) the **primary, non-instrumental right-making features of the act itself**, *and* this responsiveness constitutes a significant part of their motivation.

  **Explaining the Key Terms:**

  1.  **"Primary, Non-Instrumental Right-Making Features":** These are the fundamental reasons *why* the act is morally right.
      *   For giving correct change: Honesty, fairness, respecting others' property.
      *   For helping the collapsed stranger: Alleviating suffering, preserving life, compassion (as the ground for duty).
      *   For supporting autonomy: Respecting the personhood and agency of the child.
      *   *Contrast* with instrumental reasons: Reputation, reward, avoiding blame, business gain, fulfilling a duty *detached* from its underlying purpose. These are secondary; they aren't *why* the act is right, they are *why the agent does it*.

  2.  **"Directly Responsive To":** The agent's motive must track or be grounded in these primary features. They act *because* they recognize (even if implicitly) that the act involves honesty, alleviates suffering, respects autonomy, etc.

  3.  **"Significant Part of Motivation":** The responsiveness to the primary right-making features must be a genuine driver of the action. It can coexist with other motives (like duty *grounded* in these features), as long as the primary features themselves are motivating.

  **Applying the Principle to Your Cases:**

  1.  **Shopkeeper (Duty):** **Has MW.** He acts *because* of honesty (the primary right-making feature), which he conceptualizes as his duty. He is directly responsive to the core reason the act is right (honesty/fairness).
  2.  **Shopkeeper (Business):** **Lacks MW.** He acts *only* for an instrumental reason (business gain), not because of the primary right-making feature (honesty/fairness). He's unresponsive to the moral feature itself.
  3.  **Passerby (Sympathy):** **Has MW (High).** She acts *directly* and powerfully *because* of the primary right-making feature (alleviating suffering/preserving life), manifest as sympathy. This is highly responsive to the core moral reality.
  4.  **Passerby (Duty Alone):** **Has MW (Lower).** He acts *because* of a duty to help those in need. This duty *is* linked to the primary right-making feature (alleviating suffering/preserving life). However, his motivation is mediated through the *concept* of duty rather than a direct emotional responsiveness *to the suffering itself*. He *is* responsive to the primary feature *via* duty, hence MW, but the mediation makes it feel "thinner" than the direct sympathy in Case 3. The primary feature motivates him indirectly.
  5.  **Passerby (Reputation):** **Lacks MW.** She acts *only* for an instrumental reason (avoiding blame/reputation), not because of the primary right-making feature (alleviating suffering/preserving life). Unresponsive to the moral feature.
  6.  **Poisoner:** **Lacks MW.** He didn't perform the act *of saving a life* (the only act with potential MW here). He performed *attempted murder*. His motivation was entirely responsive to a *wrong-making* feature (harming/killing). The outcome is irrelevant to MW, which concerns the act performed *under its intentional description*.
  7.  **Volunteer (Mixed Motives):** **Has MW.** She acts *partly* because she cares about the guests (direct responsiveness to the primary right-making feature: alleviating suffering/need) and *partly* because of a duty *to help the disadvantaged* (which is grounded in that same primary feature). Both motives involve responsiveness to the core moral reason for volunteering. The duty motive here isn't detached; it's *about* helping the disadvantaged, which *is* the primary feature. The presence of the care motive enhances it, but the duty motive doesn't diminish the MW as long as it tracks the primary feature.
  8.  **Father (Against Judgment):** **Has Some MW (Ambiguous).** **This is the hardest fit, and the principle above might suggest less MW than you feel.** He acts *against* his best judgment about what is right (pushing for status). However, he acts *because* of an emotional responsiveness – likely to the child's autonomy, needs, or well-being (the *actual* primary right-making feature, though he doesn't recognize it *as* such). He *is* directly responsive to a feature that *is* morally relevant and makes the action right, even though he misidentifies the "duty." This grants *some* MW, as his character is responsive to a genuine moral reality. However, acting against his sincere (though mistaken) judgment about duty *does* diminish the MW significantly compared to Case 3 or 4, explaining your unease. He lacks "integrity" in his moral agency.

  **The Unlisted Case: Cultivated Character**

  *   **Action:** Giving correct change from a settled, non-self-interested disposition of honesty.
  *   **History:** Honesty cultivated long ago for purely self-interested reasons (e.g., avoiding punishment).
  *   **Current Motivation:** Honesty operates automatically, without thought of duty or self-interest. The agent simply sees keeping the money as "not an option" or "just wrong."
  *   **Verdict by Principle:** **The action has moral worth.**
  *   **Reasoning:** The agent is *currently* directly responsive to the primary right-making feature (honesty/fairness) through their character. Their motivation *now* is non-instrumental and tracks the moral feature itself. The *historical origin* of the disposition is irrelevant to the *current* responsiveness that constitutes MW. They act *because* it's honest, even if they don't articulate it. The character trait itself embodies responsiveness to the right-making reason. (This aligns with Aristotle's view of virtue).

  **Strengths of this Principle:**

  1.  **Explains Cases 1-7 clearly.**
  2.  **Explains the hierarchy between Case 3 and Case 4:** Direct responsiveness (sympathy) to the primary feature (suffering) has higher MW than mediated responsiveness (duty) to that same feature.
  3.  **Handles Case 7 (Mixed Motives):** As long as one motive tracks the primary feature, MW is present. Duty grounded in the primary feature *is* a valid source of MW.
  4.  **Handles the Cultivated Character case:** Current responsiveness matters, not historical origin.
  5.  **Distinguishes Right Action from Moral Worth:** Clearly explains Cases 2 & 5.

  **Weakness/Ambiguity:**

  1.  **Case 8 (Father):** The principle grants *some* MW due to responsiveness to the *actual* primary feature (autonomy/well-being), but the active *rejection* of what he believes is his duty creates significant tension and diminishes the MW, aligning with your unease. A stricter Kantian view might deny MW entirely here due to acting against conscience. Your intuition leans towards granting *some* credit for the underlying responsiveness, which the principle accommodates, albeit uneasily.

  **Conclusion:**

  Your verdicts are best captured by a principle focusing on **motivational responsiveness to the primary, non-instrumental reasons that make the action right**. This principle explains your core distinction between acting *from* the moral reason versus acting *in accordance* with it for other reasons (Cases 1 vs 2, 3/4 vs 5). It explains the difference in "thickness" between sympathy and detached duty (Cases 3 vs 4) and accommodates mixed motives (Case 7). It correctly denies MW for the poisoner (Case 6) and grants MW to the cultivated character disposition. Case 8 remains the most challenging, but the principle accommodates your intuition of *some* worth due to underlying responsiveness, while acknowledging the significant diminishment caused by acting against judgment.

  This principle aligns most closely with a sophisticated **Kantian-informed, but reason-responsive and character-sensitive** view of moral worth, incorporating elements of sentimentalism (valuing direct emotional responsiveness).
