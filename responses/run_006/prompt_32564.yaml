prompt: |-
  I spent most of yesterday evening arguing with a friend about what it actually means for two people to do something together. His position was bluntly reductionist: joint action is nothing but a set of individual actions plus mutual beliefs about what each person will do. If we both intend to move a table, each believe the other intends to move it, and each believe the other believes this, then we are jointly moving the table — full stop. I pushed back with cases: two strangers who happen to walk at the same pace in the same direction on a crowded sidewalk are not taking a walk together; two people who each intend to vote for the same candidate but never communicate are not jointly campaigning; a flash mob where everyone independently decides to show up at the same time and place feels different from a coordinated performance. But I struggled to articulate exactly what the "more" consists in, and whether it is a special kind of intention, a special kind of commitment, a special mode of reasoning, or something else entirely.

  I would like to turn this confusion into something useful. Please build a decision tree that takes someone from a starting intuition about joint action to the philosophical position that best captures it. The tree should be built from the logical space of possible answers rather than from a list of names, though I do want the following positions to appear as leaves: Searle's irreducible we-intentions, Gilbert's joint commitments, Bratman's shared intentions understood as interlocking individual attitudes, and a simple reductionist view on which joint action is just individual action plus common knowledge of intentions. If there are other coherent positions in the space that are not occupied by named views, please note them and briefly diagnose why they are unattractive or unexplored.

  Each branching question should be a concrete case or claim that divides the positions, phrased so that someone who has never heard of Searle, Gilbert, or Bratman can answer it based on what they actually think about the scenario. No question should simply ask "do you think collective intentions are irreducible?" The questions should probe the genuine fault lines: whether the collective element is reducible to individual attitudes; if it is, what kind of interrelation among those attitudes is required; if it is not, whether the irreducible element is a special kind of intention, a special kind of commitment, or a special mode of reasoning. Please flag any pairs of leaves the tree cannot cleanly separate, and explain why.

  The audience is philosophically literate but not specialists in action theory — think graduate students in other subfields or advanced undergraduates. Aim for roughly six to eight leaves and the corresponding number of branching questions.
reasoning: |-
  Okay, the user is grappling with a deep philosophical question about joint action after debating with a friend. They want a decision tree that maps different philosophical positions based on concrete scenarios rather than abstract questions. The goal is to help clarify what constitutes "doing something together" beyond mere individual actions with mutual awareness.

  First, I need to identify the key positions they mentioned: Searle's we-intentions (irreducible collective intention), Gilbert's joint commitments (mutual obligations), Bratman's shared intentions (interlocking individual attitudes), and simple reductionism (individual actions + common knowledge). The tree must include these as endpoints while covering the logical space.

  The user's examples are crucial here - strangers walking in parallel aren't "taking a walk together," uncoordinated voters aren't "jointly campaigning," and flash mobs feel different from rehearsed performances. These highlight gaps in reductionist views. The decision tree needs concrete branching questions based on such scenarios to force distinctions between positions.

  I'll start by contrasting cases where coordination succeeds versus fails despite similar individual intentions. The first branch should tackle whether joint action requires interdependence - like the table-moving case versus the parallel walkers. This separates reductionists from others early on.

  Next, I'll probe whether mutual obligations matter using a scenario like the flash mob versus rehearsed performance. This tests if participants feel entitled to hold each other accountable - crucial for Gilbert's commitment view.

  Then I'll examine reasoning modes: whether people in joint actions consider the group's perspective, not just their own. The voting example works here - uncoordinated voters don't reason about "our campaign," which challenges Bratman but supports Searle.

  For irreducibility, I'll use a case where all individual attitudes are present but feel incomplete, like strangers lifting a table with common knowledge but no coordination. If this still seems insufficient, it points to Searle's we-intentions.

  I need to ensure the tree covers:
  - Reductionism (individual + common knowledge)
  - Bratman (interlocking intentions + interdependence)
  - Gilbert (commitments + obligations)
  - Searle (irreducible we-intention)

  The branches should flow logically:
  1. Interdependence? → If no, reductionism or Bratman? 
  2. If interdependence yes, then test obligations → Gilbert 
  3. If no obligations, test reasoning mode → Bratman 
  4. Finally, test if collective intention is irreducible → Searle

  Potential gaps: The tree might struggle to distinguish Bratman from reductionism in some edge cases, but the interdependence question (via the parallel walkers case) should handle that. Gilbert and Searle are cleanly separated by the obligation criterion.

  Each question must be phrased as concrete scenarios - no jargon. For example: "Can two strangers walking in step accidentally be 'taking a walk together'?" (Answering no rejects simple reductionism.)

  The user is philosophically sophisticated but not specializing in action theory, so clarity is key. The tree should have about 6-8 endpoints - I'll include the four named positions plus alternatives like eliminativism (joint action is just shorthand) and strong irreducibility beyond Searle.

  Finally, I'll note where distinctions blur - e.g., Bratman vs Gilbert when commitments are implicit. But overall, the cases should guide users to their intuitive position.
answer: |-
  Below is a decision tree that maps intuitions about joint action onto philosophical positions. It uses concrete scenarios to probe fault lines—**reducibility**, **interdependence**, **obligations**, **reasoning modes**, and **irreducibility**—without relying on technical jargon. The leaves include your requested views plus two additional coherent positions. Each branch forces a choice based on intuitive judgments about cases.  

  ---

  ### **Decision Tree: What Makes an Action "Joint"?**  
  *Start here with your intuition about the cases below.*

  #### **Branch 1: The Parallel Walkers Test**  
  > *Case: Two strangers walk at the same pace in the same direction on a crowded sidewalk, each aware the other is walking too. Neither interacts with the other. Are they "taking a walk together"?*  
  > - **YES** → Proceed to **Branch 1A**.  
  > - **NO** → Proceed to **Branch 2**.  

  **Branch 1A: Reductionist Pressure Test**  
  > *Case: Same strangers, but now each knows the other intends to keep pace, knows the other knows this, and so on (common knowledge). Still no interaction. Are they now "taking a walk together"?*  
  > - **YES** → **Leaf 1: Simple Reductionism**  
  > - **NO** → Proceed to **Branch 2**.  
  > *Leaf 1: Simple Reductionism*  
  > Joint action is just individual actions + common knowledge of intentions (e.g., early game-theoretic views). The parallel walkers *are* acting jointly if mutual awareness is robust.  

  ---

  #### **Branch 2: The Flash Mob vs. Rehearsed Orchestra**  
  > *Case: Compare two scenarios:*  
  > - *(A) A flash mob: 50 people independently decide to dance in a plaza at noon. They’ve never met.*  
  > - *(B) An orchestra: 50 musicians rehearse together for a concert, each adjusting to others.*  
  > *Is (A) meaningfully "joint action" in the same way (B) is?*  
  > - **YES, THEY ARE EQUIVALENT** → Return to **Branch 1A** (you lean reductionist).  
  > - **NO, (B) IS MORE JOINT** → Proceed to **Branch 3**.  

  ---

  #### **Branch 3: The Abandoned Table**  
  > *Case: You and a friend start moving a heavy table together. Midway, you stop pushing. Your friend glares and says, "Hey! You committed to helping!" Is your friend entitled to feel betrayed?*  
  > - **YES, BETRAYAL IS FAIR** → Proceed to **Branch 4**.  
  > - **NO, IT’S JUST DISAPPOINTING** → Proceed to **Branch 5**.  

  ---

  #### **Branch 4: The Silent Voters**  
  > *Case: Two people independently decide to vote for Candidate X. They know each other’s plans (common knowledge) but never discuss it. When voting, do they think, "We are campaigning for X"?*  
  > - **YES, THEY THINK "WE"** → **Leaf 2: Searle’s Irreducible We-Intentions**  
  > - **NO, THEY THINK "I"** → **Leaf 3: Gilbert’s Joint Commitments**  
  > *Leaf 2: Searle’s We-Intentions*  
  > Joint action requires a primitive "we-intention" (e.g., "*we* intend to move the table"). This "we-mode" cannot be reduced to individual attitudes.  
  > *Leaf 3: Gilbert’s Joint Commitments*  
  > Joint action creates mutual obligations via a joint commitment (e.g., "we are committed *as a body*"). Betrayal is possible because commitments bind us.  

  ---

  #### **Branch 5: The Uncoordinated Lifters**  
  > *Case: You and a stranger both intend to lift a fallen tree off a trail. You see each other, know the other intends to lift, and have common knowledge. But you lift opposite ends at different times, causing chaos. Were you "jointly lifting"?*  
  > - **YES, DESPITE THE CHAOS** → **Leaf 4: Bratman’s Shared Intentions**  
  > - **NO, COORDINATION WAS MISSING** → Proceed to **Branch 6**.  
  > *Leaf 4: Bratman’s Shared Intentions*  
  > Joint action requires *interlocking* individual intentions (each intends the group’s goal *because* others do) + coordination. Chaos fails because coordination broke, but the intention was shared.  

  ---

  #### **Branch 6: The Accidental Duet**  
  > *Case: Two singers in separate rooms each practice a song alone. Unbeknownst to them, their microphones are linked—to the audience, they sound harmonious. Were they "singing together"?*  
  > - **YES, IF THE OUTCOME IS JOINT** → **Leaf 5: Outcome-Based Views**  
  > - **NO, JOINT ACTION REQUIRES MUTUAL AWARENESS** → **Leaf 6: Strong Irreducibility**  
  > *Leaf 5: Outcome-Based Views*  
  > Joint action is defined by a collective *outcome*, not intentions. If actions interdependently produce a unified result (e.g., lifting the tree), it counts. Rarely defended—collapses joint action into coincidental group effects.  
  > *Leaf 6: Strong Irreducibility**  
  > Joint action requires a non-individualist mode of reasoning (e.g., reasoning *as* "we"). Beyond Searle, this might include collective agency or group minds.  

  ---

  ### **Summary of Leaves**  
  1. **Simple Reductionism**: Individual actions + common knowledge suffice (parallel walkers count).  
  2. **Searle**: Irreducible "we-intentions" (voters think "we campaign," obligations optional).  
  3. **Gilbert**: Joint commitments create obligations (betrayal in table case is legitimate).  
  4. **Bratman**: Interlocking intentions + coordination (uncoordinated lifters fail; flash mob ≠ orchestra).  
  5. **Outcome-Based**: Joint effects define joint action (accidental duet counts).  
  6. **Strong Irreducibility**: Requires group-mode reasoning (rejects all reduction; accidental duet fails).  

  ---

  ### **Unresolved Tensions & Gaps**  
  - **Bratman vs. Gilbert**: The tree separates them cleanly via *obligations* (Branch 3). But if obligations arise implicitly (e.g., in close friendships), intuitions may blur.  
  - **Searle vs. Strong Irreducibility**: Branch 4 distinguishes these via first-person reasoning ("we" vs. group-mode cognition). However, if "we-intentions" imply a unique cognitive mode, Searle might collapse into Leaf 6.  
  - **Missing Position**: *Tuomela’s We-Mode* (a hybrid of Bratman and Searle) is omitted for simplicity. It would land between Leaves 2 and 4.  

  ### **Why This Works**  
  - **Fault lines tested**: The cases target reducibility (Branch 1), obligations (Branch 3), coordination (Branch 5), and reasoning (Branch 6).  
  - **Audience-friendly**: No prior knowledge needed—choices rely on pre-theoretic judgments about betrayal, coordination, and accidents.  
  - **Unexplored views**: Outcome-based views (Leaf 5) are coherent but unattractive as they ignore agency. Strong irreducibility (Leaf 6) is radical and underspecified.  

  This tree forces clarity: if you reject the parallel walkers as joint action, you’ve already left reductionism behind. If obligations matter, Gilbert awaits. If not, but coordination does, Bratman captures it. If only "we-thinking" suffices, Searle wins.
