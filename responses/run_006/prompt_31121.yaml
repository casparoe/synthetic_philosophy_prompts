answer: |-
  The replication crisis serves as a profound natural experiment in statistical epistemology. A scientific community relying overwhelmingly on Null Hypothesis Significance Testing (NHST), with its ritualized reliance on p < 0.05, produced a body of literature where a startling proportion of findings evaporated upon rigorous retesting. A Bayesian diagnosis dissects this failure not merely as misuse, but as a consequence of foundational mismatches between NHST’s logic and the inferential needs of science.

  Bayesians pinpoint several core pathologies. First, **base-rate neglect**—the tendency to ignore plausible prior probabilities—is endemic in NHST interpretation. A striking p-value for an implausible claim (e.g., precognition) is often hailed as strong evidence, despite vanishingly low prior odds. Bayesian reasoning insists that evidence strength (the Bayes Factor) depends crucially on the prior. The OSC's low replication rate reflects this: many original findings addressed inherently unlikely hypotheses where even a "significant" p-value provided only weak evidence easily overturned by replication. Second, the **likelihood principle**—which states all evidence is contained in the likelihood function—is violated by NHST. P-values incorporate data *not* observed (more extreme hypotheticals under H0). This violation enables **p-hacking** and selective reporting: by trying multiple analyses or stopping data collection based on interim results, researchers exploit the non-likelihood nature of p-values to artificially inflate "significance." HARKing (Hypothesizing After Results are Known) similarly exploits the disconnect, presenting post-hoc patterns as if they were predicted, capitalizing on the flexibility NHST offers to manufacture low p-values from unplanned looks. The **stopping-rule problem** is a direct manifestation: NHST’s results depend on *when* you stop collecting data, violating the likelihood principle. Bayesian inference, conditioned *only* on the actual data observed, renders the stopping rule irrelevant, eliminating this particular avenue for bias. Finally, the **incoherence of p-values as evidence measures** becomes starkly evident. A p=0.049 result is barely distinguishable from p=0.051 in evidential weight, yet one leads to publication and the other the "file drawer." Bayesians argue the p-value exaggerates evidence against H0, failing to quantify relative support for H1 versus H0 coherently, leading to overconfidence in fragile findings.

  This diagnosis cleanly explains the epidemic of false positives driven by flexible analysis and selective reporting. It clarifies why surprising findings with low priors failed replication so often. It directly maps the mechanics of p-hacking and the file-drawer problem to NHST’s violations of core inferential principles Bayesians hold dear.

  However, reversing the lens, the crisis also interrogates Bayesianism’s promise as a panacea. Does it strengthen the Bayesian case? Partially. Its emphasis on prior probabilities provides a natural safeguard against overinterpreting unlikely findings. Its adherence to the likelihood principle inherently discourages p-hacking based on stopping rules. Yet, the crisis starkly reveals that **no inferential framework is immune to gaming under strong incentives**. Bayesianism replaces the degrees of freedom in NHST (data dredging, multiple testing, optional stopping) with degrees of freedom in **prior specification**. Researchers could strategically choose overly optimistic priors to boost apparent evidence for desired findings or defensively skeptical priors to dismiss unwelcome results. The crisis exposes that the core pathology is sociological: the incentive structure rewarding novelty, positive results, and publishability over truth. Bayesian methods, without accompanying cultural and structural reforms (preregistration, open data, open code, emphasis on effect sizes), could simply relocate the arena for bias rather than eliminate it. The replication crisis highlights that methodological rigor depends on transparency and constraint, regardless of the underlying statistical philosophy.

  This leads to the deeper, unresolved philosophical chasm illuminated but not settled by the crisis: the nature of probability itself. Frequentists view probability as a long-run frequency in the world (e.g., the repeated sampling properties of a procedure). Bayesians view it as a degree of belief in the mind, quantified and updated by evidence. The replication crisis, showing high failure rates, directly challenges the reliability of frequentist procedures (like NHST) *as implemented* in common practice. It lends weight to the Bayesian critique that p-values are poor measures of evidential strength. However, it doesn't definitively prove the Bayesian interpretation of probability correct. A frequentist can argue the crisis resulted from *misuse* of NHST (ignoring assumptions, multiple testing, lack of power) rather than inherent flaws in frequentist probability, advocating for improved NHST practices (pre-registration, alpha adjustment, equivalence testing) rather than abandoning the framework. Conversely, Bayesians argue the crisis stems from NHST’s inherent conceptual confusions (e.g., p-values not being error probabilities for the specific hypothesis tested). Replication rates alone cannot adjudicate this metaphysical divide about where probability "lives." They demonstrate the practical consequences of flawed *applications* of inference under uncertainty, but the underlying philosophical disagreement persists.

  Therefore, the replication crisis should shift our credences about *practice* more decisively than it settles the theoretical debate. It unequivocally demonstrates that standard, unconstrained NHST is dangerously fragile under the pressures of modern science. It strengthens the case for Bayesian *principles*—like explicitly considering prior odds and demanding robust evidence—as essential correctives. It validates the Bayesian critique of specific NHST pathologies. However, it also reveals that adopting Bayesian methods alone, without changing the incentive structures that fostered the crisis, risks new forms of manipulation. The lasting lesson is the critical importance of methodological reforms that constrain researcher degrees of freedom and promote transparency—preregistration, open data, replication emphasis, reporting effect sizes and confidence/credible intervals—which benefit *both* frequentist and Bayesian approaches by making inference more robust and honest. The old arguments about the nature of probability remain, but the crisis provides overwhelming empirical evidence that the *way* NHST was practiced was catastrophically flawed, while underscoring that any statistical framework requires institutional scaffolding to function reliably in the real world of motivated scientific inquiry.
