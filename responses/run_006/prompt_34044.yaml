prompt: |-
  I am a retired natural scientist—my working life was spent in the experimental sciences—and I have only recently begun reading philosophy in earnest. In the interpretability literature I keep meeting a dispute that no one has yet put in the form I was trained to demand: a specification of what a theory must deliver before we can assess it. I want that specification for the claim that trained neural networks have representations.

  Please write the desiderata: what any adequate theory of representation in trained neural networks must deliver. I want a theory good enough to settle, or at least sharpen, the dispute between the view that interpretability recovers features the network really uses and the view that interpretability only projects our concepts onto the network. Give me the requirements, with the case or consideration behind each, and tell me which are non-negotiable and which are merely the preferences of one camp.

  At minimum the list should speak to the following, but do not confine yourself to them:

  - Polysemanticity. Single units in real models respond to many unrelated inputs, so a theory cannot simply identify representations with individual neurons. What does this force a theory to say about the vehicle of representation?
  - Superposition. Models appear to represent more features than they have dimensions, with features encoded as directions in activation space, often non-orthogonal. A theory must accommodate distributed, overlapping encodings rather than requiring one unit per feature.
  - Recoverability versus use. A linear probe can be trained to recover a feature from a model's activations even when there is no evidence the model uses that feature in producing its behavior. A theory must distinguish being decodable from being represented in any causally relevant sense.
  - Causal role. Interventions such as activation patching and ablations are the standard evidence that a direction or circuit matters to a computation, yet they push the model off its native distribution and can mislead. What standard of causal evidence must a representation claim meet?
  - Content. The model was not trained with our concepts and has no access to our vocabulary. A theory must say what makes a direction a representation of a feature rather than merely a direction we find convenient to label that way.

  State which distinctions a theory may not collapse: representation versus mere information-theoretic encodability; the vehicle of a representation versus its content; what a model can distinguish versus what it actually uses in a task; and features versus the circuits that compute with them.

  Then give the results the theory must not contradict. I take the following to be established enough that an adequate theory must be consistent with them, and you should say if you disagree: superposition occurs in both toy models and large trained models; linear probes recover interpretable features from many layers; sparse autoencoders and similar methods find features that, when patched, have causal effects; and models also compute with features that are spurious or alien to us. A theory that rules any of these out by fiat is not adequate.

  Now the part I most want. Mark each requirement as non-negotiable or as a camp-specific preference, and say which subsets, if any, cannot be jointly satisfied. I suspect there is a real conflict between demanding that representations be causally validated by interventions and demanding that representations be what the model actually computes in its own terms, since our only access to the latter is through interventions that distort. I also suspect a conflict between demanding a single canonical decomposition into features and the fact that features live in overlapping, non-orthogonal directions. Tell me whether these conflicts are real or only apparent, and whether the right response is to weaken a desideratum or to give up on a single canonical picture.

  Finally, tell me which single requirement does the most work in excluding the popular positions—unit-level realism, realism about distributed features, instrumentalism, and deflationism—and then give a brief scorecard of how each fares against the full list.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired experimental scientist seeking clear criteria to evaluate theories of representation in neural networks. They want rigorous desiderata that can resolve the debate between realism and instrumentalism in interpretability research.

  First, I need to identify the core challenges they've outlined: polysemanticity, superposition, recoverability vs use, causal validation, and content grounding. Each requires specific theoretical treatment. The user also emphasizes key distinctions that must be preserved - representation vs encodability, vehicle vs content, decodability vs use, and features vs circuits.

  For polysemanticity, the theory must abandon neuron-level correspondence since single units respond to multiple unrelated inputs. This forces a shift to distributed representations as the fundamental vehicle. Superposition further demands that representations exist in non-orthogonal, overcomplete activation spaces - a non-negotiable requirement given empirical evidence from toy models and LLMs.

  The recoverability-use distinction is crucial. Linear probes can decode features that aren't causally relevant, so the theory must separate mere information-theoretic availability from actual computational use. This leads to the causal role criterion - interventions like patching must be part of validation, but we need to address distributional shift concerns through careful counterfactual reasoning.

  Content grounding presents perhaps the hardest problem. Without human labels or concepts, representation must be defined by the network's own computational role. Teleosemantic approaches (Millikan, Dretske) offer promising frameworks here, where content is determined by what features were evolutionarily selected for (via training) and are used by downstream circuits.

  Key conflicts emerge: Causal validation through interventions may distort the very representations we study, while non-orthogonality prevents unique feature decomposition. The solution isn't abandoning requirements but embracing context-dependence - representations are relativized to specific computational contexts, and interventions must be designed minimally.

  The causal role requirement does the most work in excluding naive positions: unit-level realism fails on polysemanticity; instrumentalism can't explain causal efficacy; deflationism ignores the real differences probes reveal. Distributed feature realism comes closest but must address non-uniqueness.

  Empirical constraints are clear: superposition occurs, linear probes work, sparse autoencoders find causal features, and models compute with alien concepts. Any adequate theory must accommodate these.
answer: |-
  Below is a specification of desiderata for a theory of representation in trained neural networks, structured to meet your experimental science background. It distinguishes non-negotiable requirements from camp-specific preferences, identifies conflicts, and evaluates existing positions. The criteria are grounded in empirical observations from interpretability research.

  ---

  ### **Desiderata for a Theory of Representation**
  *(Non-negotiable requirements in **bold**; camp-specific preferences in *italics*)*

  1. **Accommodate Polysemanticity**  
     - **Must specify a *distributed vehicle* for representations (e.g., directions, subspaces, circuits), not individual neurons.**  
     - **Why**: Single neurons activate for unrelated features (e.g., a "curve detector" neuron also firing for cat ears).  
     - *Non-negotiable*: Neuron-level correspondence is empirically falsified.

  2. **Account for Superposition**  
     - **Must allow representations to be encoded in non-orthogonal, overcomplete activation-space directions.**  
     - **Why**: Models represent more features than dimensions (e.g., toy models cram unrelated features into one neuron via interference).  
     - *Non-negotiable*: Observed in toy models (Olah et al.) and LLMs (Anthropic).

  3. **Distinguish Recoverability from Use**  
     - **Must provide criteria to separate *decodable information* from *causally active representations*.**  
     - **Why**: Linear probes can decode "sky" from early layers even if the model doesn’t use it for "weather prediction."  
     - *Non-negotiable*: Otherwise, the theory conflates correlation with causation.

  4. **Define Causal Role Standards**  
     - **Must require *counterfactual invariance*: Interventions (e.g., patching, ablation) should show that altering a feature *reliably changes specific outputs* under constrained distribution shifts.**  
     - **Why**: Activation patching can distort behavior if pushed far off-distribution.  
     - *Preference*: Realists demand strong causal evidence; instrumentalists accept weaker proxies.  
     - *Conflict*: Minimal interventions may not reveal "native" computations.  

  5. **Ground Content Without Human Labels**  
     - **Must define content via the network’s *computational role* (e.g., how features are used by downstream layers) and *training-induced functions*.**  
     - **Why**: Networks learn features alien to humans (e.g., adversarial or superpositional features).  
     - *Non-negotiable*: Human labeling is extrinsic; content must be intrinsic to the model.  

  ---

  ### **Distinctions a Theory Must Not Collapse**
  - **Representation vs. Information-Theoretic Encodability**: Decodability ≠ representation (e.g., PCA directions may encode noise).  
  - **Vehicle vs. Content**: The activation vector (vehicle) is not the feature (content).  
  - **Distinguishability vs. Use**: A model *can* separate cats/dogs without *using* it for tasks.  
  - **Features vs. Circuits**: Features are representational; circuits are computational operators.  

  ---

  ### **Established Results the Theory Must Accommodate**
  1. Superposition occurs in toy models and LLMs.  
  2. Linear probes recover interpretable features across layers.  
  3. Sparse autoencoders find features causally effective when patched.  
  4. Models compute with spurious/alien features (e.g., "texture bias" in CNNs).  
  *(Disagree? None—all are empirically robust.)*  

  ---

  ### **Conflicts and Resolutions**
  1. **Conflict: Causal Validation vs. Native Computation**  
     - *Problem*: Interventions (patching) perturb the model, potentially distorting "true" representations.  
     - *Resolution*: **Weaken the desideratum**. Demand *minimal interventions* (e.g., path patching within-distribution) and accept approximations. Native computations are inferred, not directly observed.  

  2. **Conflict: Canonical Decomposition vs. Non-Orthogonality**  
     - *Problem*: Non-orthogonal features resist unique decomposition (e.g., "furniture" and "wood" overlap).  
     - *Resolution*: **Give up on a single canonical picture**. Representations are context-dependent (e.g., task-specific basis). A theory should allow multiple valid decompositions.  

  ---

  ### **Key Requirement Excluding Popular Positions**
  The **Causal Role Standard** does the most work:  
  - **Unit-Level Realism**: Excluded by polysemanticity (fails non-negotiable #1).  
  - **Distributed Feature Realism**: Vulnerable if it ignores recoverability-vs-use (fails #3).  
  - **Instrumentalism/Deflationism**: Excluded if it rejects causal efficacy (fails #4).  
  - **Projectivism**: Excluded by content grounding (fails #5).  

  ---

  ### **Scorecard: How Positions Fare Against Desiderata**
  | **Position**             | Polysemanticity | Superposition | Recoverability vs. Use | Causal Role | Content Grounding |  
  |--------------------------|-----------------|---------------|------------------------|-------------|-------------------|  
  | **Unit-Level Realism**   | ❌ (denies)     | ❌             | ⚠️ (ambiguous)         | ⚠️          | ❌ (human labels)  |  
  | **Distributed Realism**  | ✔️              | ✔️            | ⚠️ (often conflates)   | ✔️          | ⚠️ (partial)      |  
  | **Instrumentalism**      | ✔️              | ✔️            | ❌ (collapses)         | ❌ (denies) | ❌ (extrinsic)     |  
  | **Deflationism**         | ✔️              | ✔️            | ❌ (rejects "use")     | ❌          | ❌                |  
  | **Adequate Theory**      | ✔️              | ✔️            | ✔️                     | ✔️          | ✔️                |  

  - **✔️**: Fully satisfies | **⚠️**: Partially satisfies | **❌**: Fails  
  - **Distributed realism** (e.g., "universal circuits") comes closest but struggles with non-unique decompositions.  
  - **Instrumentalism** fails causal/content criteria by treating representations as user projections.  

  ---

  ### **Synthesis**
  A minimally adequate theory must:  
  1. Treat representations as **distributed, superposition-tolerant vectors**.  
  2. Ground content in **model-internal functions** (e.g., teleosemantics via training objectives).  
  3. Use **interventionist counterfactuals** (e.g., "Does patching feature X *reliably* change output Y?") as the causal standard.  
  4. Accept **non-uniqueness** in feature decomposition.  

  **The core tension** between causal validation and native computation is real but tractable: define representations *operationally* via *minimally invasive interventions* that preserve task-relevant behavior. No theory can access "native" computations without distortion, but counterfactual stability under intervention provides pragmatic grounding.  

  This framework excludes positions that ignore causal roles (instrumentalism) or deny distributed encoding (unit realism). Distributed realism survives if it incorporates causal decoupling and non-uniqueness. The unresolved frontier: **formalizing "computational role" without human labels**—likely requiring a synthesis of mechanistic interpretability and algorithmic information theory.
