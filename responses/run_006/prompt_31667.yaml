prompt: |-
  My neighbourhood association runs an annual fundraising campaign for the local park. The target is £20,000, and roughly 2,000 households are asked for £20 each. If the target is met, the park stays well-maintained; if we fall well short, it deteriorates. I know my individual £20 is vanishingly unlikely to be the deciding contribution that tips the total over the threshold. But I also know I am not special: roughly two thousand other people are in my position, looking at the same numbers and asking themselves the same question. If I decide not to give because my £20 doesn't matter, and everyone sufficiently similar to me reasons the same way, we collectively guarantee the park's decline. Does the fact that I cannot causally control what my neighbours do settle the question of whether I should contribute? Or should my decision take into account that it provides evidence about what people like me will do, even though we never interact? Please answer in British English, and keep your response to no more than 400 words.
reasoning: |-
  Okay, the user is presenting a classic collective action problem involving a fundraising campaign for their local park. They're torn between recognizing that their individual £20 contribution seems insignificant against the £20,000 target, yet aware that if everyone with similar reasoning abstains, the park will deteriorate. 

  The core tension lies in whether they should act based on causal impact (their donation directly tipping the scales) or evidential reasoning (their choice signaling what others might do). I need to address both angles while keeping it practical.

  First, the causal argument: statistically, one £20 donation among 2,000 households is indeed vanishingly unlikely to make the difference. If that were the only consideration, withholding might seem rational. But this ignores how individual actions aggregate.

  Then the evidential perspective: their decision isn't made in a vacuum. By contributing, they implicitly endorse the norm that "people like us" support communal goods. Even without direct coordination, their choice subtly influences the collective outcome by reinforcing social expectations. If all "marginal thinkers" defect, failure becomes self-fulfilling.

  The park's state also creates path dependence - once maintenance lapses, restoring it costs more than sustained upkeep. So current contributions prevent future collective losses.

  I should emphasize that community participation relies precisely on people acting against strict individual cost-benefit calculations. The "I'm not special" realization cuts both ways: if their reasoning leads to inaction, it likely does for others too. But conversely, choosing to contribute supports the shared understanding that keeps such systems functioning.

  The response must reject the idea that lack of causal control settles the matter. Evidence-sensitive reasoning shows how individual choices scale to collective outcomes, even without interaction. And it should affirm that contributing is the ethically coherent position when generalised.
answer: |-
  This presents a classic collective action problem. While you're correct that your single £20 is vanishingly unlikely to be the *causal* factor that tips the total over £20,000, focusing solely on causal control misses a crucial aspect: evidential reasoning.

  Your decision isn't made in isolation. It provides evidence about how people *like you* – those aware of the logic and the stakes – are likely to act. If you decide not to contribute based on the reasoning "my £20 won't make the difference," you recognise that others employing the same logic would also abstain. If everyone sufficiently similar to you uses *only* this causal reasoning, collective failure is guaranteed. Your inaction becomes evidence of, and contributes to, a pattern of inaction.

  Therefore, your decision *should* take into account this evidential perspective. Contributing £20:

  1.  **Rejects the self-defeating logic:** It signals a refusal to be part of the pattern where everyone's individual reasoning leads to a collectively worse outcome.
  2.  **Supports the cooperative norm:** It acts as a small but tangible commitment to the shared goal and the principle of contributing towards communal goods, even when the direct personal causal impact is small.
  3.  **Averts the 'sure loss':** While your £20 won't *cause* success alone, widespread withholding *will* cause failure. Contributing helps avoid this definite negative outcome for the park and community you value.

  The fact that you cannot causally control your neighbours doesn't settle the question. It highlights that the problem requires thinking beyond direct causation. Recognising that your action provides evidence about the likely actions of similar others – and that acting cooperatively helps sustain the necessary collective effort – gives a strong reason to contribute. Failing to do so, while tempting individually, risks ensuring the collective failure you wish to avoid. The coherent choice is to contribute.
