answer: |-
  Here is a structured set of desiderata for a theory of market boundaries, incorporating your specific requirements and addressing potential tensions:

  **Core Desiderata for a Theory of Market Boundaries (The Permissibility/Obligation of Markets)**

  1.  **Consent & Benefit Insufficiency (Non-negotiable):**
      *   **Requirement:** Must explain why market exchange can be morally objectionable *even when* all parties genuinely consent (without coercion, deception, or severe cognitive impairment) and perceive themselves as benefiting ex-ante.
      *   **Motivating Cases:** Kidney sales (especially in contexts of poverty), post-disaster price gouging for essentials (water, shelter), certain forms of high-interest lending (payday loans), potentially commercial surrogacy under duress.
      *   **Why Non-negotiable?** This is the core puzzle challenging purely efficiency/consent-based justifications of markets. A theory that cannot handle this fails at its primary task.

  2.  **Distinction: Moral Objection vs. Legal Prohibition (Non-negotiable):**
      *   **Requirement:** Must clearly distinguish the *moral status* of a market transaction (objectionable/permissible) from the *legal status* (prohibited/regulated/permitted). Must provide principled reasons why some morally objectionable markets might nonetheless be legally permissible (or even required), and vice-versa.
      *   **Motivating Cases:** Prostitution (arguably morally objectionable to some but legally permitted/regulated in some jurisdictions); Price gouging (often morally condemned but difficult to legally define/enforce without unintended harms); Certain risky but consensual activities (e.g., extreme sports markets - morally contested for some, legally permitted). Must explain "regulatory triage" - why resources focus on *some* objectionable markets.
      *   **Why Non-negotiable?** Conflating morality and legality oversimplifies governance and ignores pragmatic concerns (feasibility, unintended consequences, paternalism).

  3.  **Commodification & Value Corruption (Potentially Contestable):**
      *   **Requirement:** Must account for the intuition/phenomenon that market exchange *can* (but does not necessarily) degrade, corrupt, or express inappropriate valuation of certain goods, services, or relationships. Must explain the *asymmetry* - why this applies to some things (surrogacy, organs, certain intimate services) but not others that seem similar (paid childcare, plasma, housecleaning). If denying corruption, must explain the *persistence and pattern* of the intuition without merely dismissing it as irrational bias.
      *   **Motivating Cases:** Commercial surrogacy vs. paid childcare; Altruistic blood donation vs. paid plasma markets; Markets for votes, military service, religious indulgences; Arguments against markets in sexual services or adoption.
      *   **Why Contestable?** Commensurability theorists (e.g., strict consequentialists, some economists) may argue the intuition *is* mistaken or rooted in status quo bias/irrational disgust. However, explaining the *pattern* of intuitions is crucial even for these theories.

  4.  **Motivational Crowding-Out & Mechanism Specificity (Non-negotiable):**
      *   **Requirement:** Must incorporate and explain the empirical phenomenon of motivational crowding-out (intrinsic/social motivations undermined by extrinsic/market incentives). Must specify the *mechanisms* (e.g., signaling, preference transformation, norm erosion) and the *conditions* under which crowding-out (or potentially crowding-*in*) occurs. Must account for why it happens for some goods/services (blood donation, volunteering) but not others (most wage labor).
      *   **Motivating Cases:** Introduction of payments for blood donation reducing altruistic supply; Performance-based pay undermining intrinsic work motivation in certain professions (care work, education); Payments for environmental conservation altering community norms.
      *   **Why Non-negotiable?** This is a key empirical finding with significant normative implications for market design. A theory ignoring it or treating crowding-out as automatic/universal is empirically inadequate.

  5.  **Source of Objection: What vs. Who/Background (Non-negotiable):**
      *   **Requirement:** Must distinguish between objections based on the *nature of the good/service* itself (e.g., "votes shouldn't be sold") and objections based on the *background conditions* of buyers/sellers (e.g., "selling kidneys is wrong *because* it exploits the desperate") or the *identity of participants* (e.g., "only citizens should buy land"). Crucially, must also explain *interactions* where the "what" objection is contingent on the "who/how" (or vice-versa).
      *   **Motivating Cases:**
          *   *What:* Selling citizenship, sacred artifacts, fundamental rights.
          *   *Who/Background:* Sweatshop labor, kidney sales driven by poverty.
          *   *Interaction:* Pollution permits/Carbon offsets (objectionable if permits are too cheap/allow the rich to pollute *or* if the very act of commodifying pollution is wrong); Regulated vs. unregulated surrogacy markets; Military service (mercenaries vs. citizens).
      *   **Why Non-negotiable?** Different policy remedies flow from different sources of objection. A theory collapsing this distinction cannot guide nuanced regulation.

  6.  **Pluralism about Values (Contestable, but Highly Desirable):**
      *   **Requirement:** Must acknowledge that multiple, potentially incommensurable values (autonomy, fairness, community, sanctity, equality, welfare) are relevant to judging markets. Cannot simply reduce all concerns to a single metric (e.g., welfare, autonomy, efficiency) without justifying *why* that metric overrides others in the contested cases.
      *   **Motivating Cases:** Arguments against organ markets often invoke dignity/sanctity *alongside* exploitation; Surrogacy debates involve autonomy, commodification, and women's welfare; Price gouging involves fairness, community solidarity, and efficiency.
      *   **Why Contestable?** Monist theories (e.g., certain forms of utilitarianism or libertarianism) explicitly reject this. However, a theory ignoring pluralism struggles to explain the multifaceted nature of real-world debates.

  7.  **Empirical Responsiveness & Falsifiability (Non-negotiable):**
      *   **Requirement:** Normative claims must be linked to testable empirical predictions. Must specify what kinds of evidence would count for/against the theory (e.g., studies on well-being after kidney sale, effects of regulated surrogacy markets on participants/children, behavioral experiments on crowding-out, historical analysis of abolished markets). Must specify potential *falsifying conditions* – e.g., if a theory predicts harm X from market Y, but robust evidence shows X doesn't occur under conditions Z, the theory must be revised or abandoned.
      *   **Motivating Cases:** Debates over legalized prostitution's impact on trafficking/violence; Effects of paid plasma collection on supply and safety vs. voluntary systems; Impact of school voucher programs (marketization) on educational equity/quality.
      *   **Why Non-negotiable?** A purely armchair theory risks irrelevance. Normative claims about the *effects* of markets require engagement with reality.

  **Potential Tensions Between Desiderata:**

  1.  **Pluralism (6) vs. Commensurability (Implied rejection by 3 & 6):** A theory embracing strong value pluralism (and thus potentially incommensurability) struggles to provide a clear, decisive answer on market permissibility when values conflict (e.g., autonomy vs. commodification in surrogacy). Conversely, a theory insisting on full commensurability (e.g., via a single metric) struggles to genuinely explain the intuitions motivating desiderata 3 and 6 without dismissing them.
  2.  **Non-Commodification (3) vs. Motivational Crowding-Out (4):** While related, these are distinct. A theory focused on inherent corruption (3) might see crowding-out (4) as merely a symptom, but risks ignoring cases where crowding-out happens without inherent corruption (e.g., paying kids to read) or vice-versa. A theory focused *only* on crowding-out (4) might permit markets in "sacred" goods if no crowding-out occurs, contradicting intuitions motivating 3.
  3.  **Consent/Benefit Insufficiency (1) vs. Background Conditions (5):** A theory heavily emphasizing background injustice (5) as the *sole* source of objection risks implying that markets in *any* good would be permissible under ideal conditions, potentially clashing with intuitions motivating desiderata 1 and 3 (e.g., "Even in a just society, should we sell votes?"). Conversely, a strong "what" objection (3/5) might downplay the critical role of background injustice in cases like organ sales.

  **The Most Exclusionary Requirement: Consent & Benefit Insufficiency (1)**

  *   **Why it does the most work:** This requirement directly and fundamentally challenges the core justification of markets within mainstream economics and libertarian political philosophy: that voluntary, mutually beneficial exchanges are presumptively permissible and welfare-enhancing. Major existing views (Pareto efficiency criteria, Coase theorem applications, libertarian rights-based approaches) often build upon this foundation. Desideratum 1 forces a theory to explain why this foundation is *insufficient* for establishing permissibility, demanding a significant departure from or major complication of these dominant frameworks. It excludes views that cannot move beyond consent/benefit as the primary criteria.
  *   **What would change my mind about this judgement?**
      1.  **A Convincing Argument that Consent/Benefit *is* Sufficient:** If someone could demonstrate that *all* apparent counter-examples (kidneys, gouging, surrogacy) are *either* (a) not genuinely consensual/beneficial (collapsing into a background justice issue - desideratum 5), or (b) that the objections are based on empirically false premises or irrational biases that should be disregarded (challenging desiderata 3, 6, 7), then desideratum 1 might be seen as less fundamental or even unnecessary. This would require successfully rebutting the core moral intuitions behind the cases.
      2.  **A Theory Reconciling Consent/Benefit with Objection:** If a novel theory emerged that *within a framework fundamentally grounded in consent/benefit/welfare* could coherently explain why these specific exchanges are objectionable *without* invoking qualitatively different principles (like commodification or plural values), it might lessen the exclusive power of desideratum 1. For example, a highly sophisticated welfare-economic model incorporating long-term, social, or preference-formation effects that show net harm could potentially satisfy (1) while remaining within a broadly consequentialist/consent paradigm, though this seems challenging for cases like kidneys where individual benefit seems clear-cut.

  **On Non-Negotiable vs. Contestable:**

  *   **Non-Negotiable (1, 2, 4, 5, 7):** These address the core phenomena identified (insufficiency of consent/benefit, law/morality distinction, empirical crowding-out, source of objection, empirical grounding) and the basic requirement for a theory to be relevant and testable. A theory ignoring these fails to engage with the essential problems or the real world.
  *   **Contestable (3, 6):** These reflect substantive philosophical commitments. A theorist could reasonably argue:
      *   **(3 Commodification):** That "corruption" is illusory/mistaken, or reducible to harm/crowding-out/exploitation (thus covered by 1,4,5).
      *   **(6 Pluralism):** That one supreme value (e.g., welfare, autonomy) *should* override others, providing a monist foundation. However, such theories *must still* convincingly explain the *apparent* force of the other values/intuitions (the "persistent intuition" from 3) to be adequate.

  This framework provides a rigorous checklist. The significant tensions highlight why developing a fully satisfying unified theory is exceptionally difficult. A strong theory will need to navigate these tensions explicitly, perhaps by prioritizing some desiderata, offering nuanced explanations for interactions, or clearly delimiting its scope. Good luck with your chapter!
