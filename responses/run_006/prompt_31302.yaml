  Below is a decision tree designed to guide readers from their reaction to spectrum arguments (e.g., life quality from barely worth living to flourishing, or discomfort from mild to torture) to a named position on the transitivity of "all-things-considered better than." Each branch point is a concrete question answerable without prior knowledge of position labels. The tree includes seven branch questions and leads to six distinct leaves, covering the required positions and flagging incoherent or underexplored combinations. Positions are separated cleanly except where noted.

  ---

  ### Decision Tree: Resolving Spectrum Arguments

  **Start:** You encounter a spectrum argument: a chain of items (e.g., lives from barely worth living to flourishing) where:
  - The first item (A₀) is clearly better than the last (Aₙ).
  - No single adjacent pair (Aᵢ and Aᵢ₊₁) seems worse than its predecessor—each step appears non-worsening (or trivially different).

  This generates tension: if A₀ is better than Aₙ, but no step is a worsening, how can the whole chain be a worsening? Which judgment gives way?

  #### Q1: Could the meaning of "better than" or "not worse than" shift across the spectrum?  
     - **Yes** → **Contextualism/Equivocation**  
       *Why?* Standards for "better than" change with context. Adjacent comparisons use local standards (finding no difference), but A₀ vs. Aₙ uses global standards (revealing a large difference). The argument equivocates, so both judgments hold.  
       *Position:* Contextualism.  
       *Branch end.*

     - **No** → Proceed to Q2.

  #### Q2: Is "not worse than" transitive? (If A is not worse than B, and B is not worse than C, must A be not worse than C?)  
     - **No** → **Intransitivism**  
       *Why?* "Not worse than" (or even "better than") is intransitive. The chain’s non-worsening steps don’t force A₀ to be not worse than Aₙ, avoiding contradiction. Adjacent judgments hold; A₀ > Aₙ stands.  
       *Position:* Intransitivism.  
       *Branch end.*

     - **Yes** → Proceed to Q3.

  #### Q3: Are some adjacent pairs incomparable or "on a par"? (i.e., neither better, worse, nor equal, but related in a fourth way.)  
     - **Yes** → **Parity or Incomparability**  
       *Why?* Adjacent items are incomparable or on a par, so "not worse than" doesn’t imply equality or improvement. The chain breaks, blocking transitivity. Both judgments hold.  
       *Position:* Parity or Incomparability (e.g., Ruth Chang).  
       *Branch end.*

     - **No** (all adjacent pairs are comparable) → Proceed to Q4.

  #### Q4: Must at least one adjacent pair show strict improvement? (Aᵢ better than Aᵢ₊₁? If not, all are equal, implying A₀ = Aₙ, contradicting A₀ > Aₙ.)  
     - **No** (all adjacent pairs are equal) → **Incoherent**  
       *Why?* If all steps are equal, A₀ must equal Aₙ—but A₀ > Aₙ. Rejecting this requires denying A₀ > Aₙ or the non-worsening judgments, but both are intuitive.  
       *Status:* Incoherent.  
       *Branch end.*

     - **Yes** (at least one strict improvement) → Proceed to Q5.

  #### Q5: For strict-improvement pairs, is the value difference due to crossing a threshold or lexical priority? (i.e., does a tiny change cause a discontinuous value jump?)  
     - **Yes** → **Thresholds/Lexical Priorities**  
       *Why?* A small change at a critical point (e.g., crossing a welfare threshold) causes a large drop in value. Adjacent judgments hold (the jump is "trivial" in underlying properties but not value), and transitivity is preserved.  
       *Position:* Transitivity preserved by thresholds/lexical priorities (e.g., lexical views in population ethics).  
       *Branch end.*

     - **No** (differences are proportional/continuous) → Proceed to Q6.

  #### Q6: Can value differences be too small to notice in isolation?  
     - **No** → **Sharp Cutoff (Knowable)**  
       *Why?* Strict improvements must be noticeable if value is proportional and continuous. We likely misjudged some adjacent pair (e.g., overlooking a small worsening). Transitivity holds, but (J2) fails for that pair.  
       *Position:* Transitivity preserved by sharp cutoff.  
       *Status:* Coherent but unattractive—requires epistemic failure in pairwise judgments.  
       *Branch end.*

     - **Yes** → Proceed to Q7.

  #### Q7: Is the cumulative value loss from many tiny changes intuitive?  
     - **Yes** → **Sharp Cutoff (Unknowable)**  
       *Why?* Each strict improvement is too small to notice, but they accumulate. We cannot identify where worsenings occur ("unknowable cutoff"), but transitivity holds. Adjacent judgments hold; A₀ > Aₙ stands.  
       *Position:* Transitivity preserved by sharp cutoff (e.g., John Broome).  
       *Branch end.*

     - **No** → **Unexplored**  
       *Why?* Denying both noticeable jumps and cumulative small losses makes it unclear how A₀ > Aₙ arises. This may require new models (e.g., holistic value).  
       *Status:* Coherent but underexplored.  
       *Branch end.*

  ---

  ### Notes on the Tree
  1. **Flagged Combinations:**  
     - *Incoherent (Q4 → No):* Assumes all adjacent pairs are equal but A₀ > Aₙ. Contradicts transitivity and basic logic.  
     - *Unattractive (Q6 → No):* Sharp cutoff with knowable differences implies we "should have noticed" a worsening step. Epistemically uneasy but logically possible.  
     - *Unexplored (Q7 → No):* No existing position neatly fits; may involve emergent properties or scalar shift (e.g., "better than" becomes vague in long chains).  

  2. **Unclean Separation:**  
     - *Intransitivism (Q2) vs. Parity (Q3):* These are separated cleanly in the tree (intransitivity denies transitivity of relations; parity denies comparability). However, *in practice*, some theorists blend these (e.g., parity as a basis for intransitivity). The tree splits them at Q2/Q3 for clarity.  
     - *Thresholds (Q5) vs. Sharp Cutoff (Q6/Q7):* Sharp cutoff positions are split into "knowable" (unattractive) and "unknowable" (standard), but both preserve transitivity. Thresholds are separated by appealing to discontinuous value jumps.

  3. **Tree Coverage:**  
     - **Leaves:** Contextualism, Intransitivism, Parity/Incomparability, Thresholds/Lexical Priorities, Sharp Cutoff (Unknowable), Sharp Cutoff (Knowable), and Unexplored.  
     - **Omissions:** No position combines, e.g., intransitivism with thresholds (logically odd but unexplored). The tree covers all requested leaves and highlights gaps.

  This tree maps the logical space of responses, allowing readers to identify their position without labels. It emphasizes concrete distinctions (e.g., comparability vs. transitivity) and avoids jargon until conclusions.
