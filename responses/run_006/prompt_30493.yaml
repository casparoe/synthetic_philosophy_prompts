prompt: |-
  I've somehow ended up giving a talk at our local EA meetup next month, and its turned into a whole thing. The title is something like "Why Kelly betting, not EV maximisation, should be our default for repeated decisions under uncertainty." I got into this after a long arguement with a friend about why we shouldn't just take every positive-expected-value bet we're offered, even when the stakes are small — I kept saying the log of your bankroll is what you actually care about if you plan to keep playing, and he kept saying that's just risk aversion with a utility function you don't have. The talk is a cleaned-up version of that: for repeated bets, maximising expected log wealth beats maximising expected wealth over time, the time-average growth rate is the thing that actually compounds, and a policy of taking all positive-EV bets is eventually ruinous, so Kelly (or fractional Kelly) is the sensible default, with geometric rationality as the underlying norm.

  The audience is mostly hardcore expected-value maximisers — the kind of people who'll say the St Petersburg paradox isn't a paradox and you just pay the expected value — plus a couple of people who are into the ergodicity/geometric-rationality literature and will be sympathetic but picky, and one philosopher who keeps asking what the long run even means when you only live once. I want a Q&A prep sheet, not a talk outline. What are the eight or so objections I'll actually get, roughly in the order they'll come, phrased the way this audience would phrase them? For each: how much damage it does, what I should concede, what I should hold, and a reply I can actually deliver in two minutes. Include the question I'm hoping nobody asks — I have a feeling it's about whether Kelly gives any guidance at all when the probabilities are made up, but maybe it's something worse. And please write the whole thing in British English.
reasoning: |-
  Alright, the user is preparing for a talk at an EA meetup on why Kelly betting should be the default over EV maximization for repeated decisions. They need a Q&A prep sheet with eight objections, responses, and the dreaded question. Let me start by understanding their scenario.

  The audience is mostly hardcore EV maximizers who dismiss the St. Petersburg paradox, some ergodicity enthusiasts, and a philosopher questioning the long run. The user's core argument is that maximizing expected log wealth prevents ruin and optimizes growth over repeated bets. They want objections phrased as the audience would, with responses that are concise and effective.

  First, I should list common objections. The obvious one is that EV maximization is rational for single bets. Then, the risk aversion argument—that log utility is arbitrary. Practical issues like non-repeated bets and unknown probabilities are key. The philosopher's "you only live once" point is crucial. Also, handling non-financial outcomes and the complexity of fractional Kelly.

  The dreaded question might be about applying Kelly with subjective probabilities. The user fears this because EA often deals with uncertain estimates. Another angle: does Kelly work with correlated bets or changing bankrolls? Or maybe the moral implications—should we apply Kelly to altruistic funds?

  I need to ensure each objection is realistic. Order matters—start with foundational critiques, then practical ones. The philosopher's point should come mid-Q&A. For responses, concede where necessary (e.g., single bets), but hold firm on repeated scenarios. Emphasize that Kelly minimizes ruin and maximizes median outcomes, which is practical.

  For the dreaded question, admit that Kelly relies on probability estimates but argue it's a structured approach. Stress that it prevents overbetting even with uncertainty. Also, highlight fractional Kelly as a buffer against estimation errors.

  Check British English: "maths", "behaviour", "practise". Avoid American spellings. Keep responses under two minutes—concise with clear takeaways. Make sure the user has rebuttals that align with geometric rationality principles without getting too technical.
answer: |-
  Here's your Q&A prep sheet, crafted for that specific EA crowd. Anticipate scepticism, nitpicking, and the spectre of the philosopher.

  **Objection 1 (First, from the Hardcore EV Maxers): "This is just risk aversion masquerading as rationality. My utility function *is* linear in wealth for these stakes. Why should I arbitrarily adopt log utility? You're smuggling in your own preferences."**
  *   **Damage:** Medium-High. Attacks the foundational axiom.
  *   **Concede:** Yes, *if* utility is linear and *if* bets are truly one-off, maximising EV is correct. Log utility *is* a specific choice.
  *   **Hold:** But for *repeated*, multiplicative growth scenarios (like investing, repeated small bets), linear utility leads to ruin with probability 1 given enough time and any edge, however small. Log utility emerges naturally as the function whose expectation maximises the long-run *growth rate* of capital. It's not arbitrary preference; it's the consequence of wanting your wealth to compound optimally over many plays. It prevents self-sabotage.
  *   **Reply (2 min):** "Fair point on single bets. But crucially, we're talking *repeated* decisions where outcomes compound multiplicatively. Maximising expected wealth (linear utility) *ignores* the path dependence of compounding. It systematically overbets, guaranteeing eventual ruin even with a positive edge. Maximising expected log wealth isn't about my 'fear', it's about recognising the mathematical reality of multiplicative growth: it maximises the *geometric mean* growth rate, which is what compounds. Ignoring this path leads to \$0, guaranteed, eventually. Is maximising the probability of going bankrupt rational, even with a linear utility?"

  **Objection 2 (Another EV Maxer): "The St. Petersburg paradox shows humans are irrational, not that EV is wrong. If I can afford the expected value price, I *should* pay it for the lottery, and similarly, I should take *every* positive EV bet offered, regardless of size or bankroll."**
  *   **Damage:** Medium. Challenges the core example.
  *   **Concede:** If you have truly infinite resources and infinite time, EV maximisation avoids ruin. The St. Petersburg paradox *is* resolvable under those assumptions.
  *   **Hold:** But no one has infinite resources or time. In the real world of finite bankrolls and finite lifetimes, blindly applying EV maximisation to repeated bets, especially those large relative to your bankroll, *is* ruinous. Kelly provides the optimal strategy for finite beings engaging in repeated multiplicative gambles.
  *   **Reply (2 min):** "Absolutely, with infinite wealth and time, play St. Petersburg at its EV! But we operate under severe constraints. For finite bankrolls and repeated bets, applying St. Petersburg logic universally – taking every +EV bet regardless of size or odds – is disastrous. Betting half your bankroll on a 51% coin flip is +EV, but doing it repeatedly guarantees ruin. Kelly tells you the fraction that *avoids* this self-destruction while maximising growth. It's EV maximisation *adapted* to our finite reality."

  **Objection 3 (Ergodicity Enthusiast): "Isn't this just a special case of the ergodicity argument? You're maximising the time-average growth rate because wealth multiplication is non-ergodic – the ensemble average (EV) doesn't equal the time average."**
  *   **Damage:** Low. Actually supportive framing.
  *   **Concede:** Yes, precisely! The Kelly criterion is a direct application of optimising for the time-average growth rate in a non-ergodic multiplicative process. The ensemble average (expected wealth) diverges from the individual time-average experience.
  *   **Hold:** Kelly provides the *specific, calculable* optimal betting fraction for many common bet types, making the ergodicity economics insight actionable.
  *   **Reply (2 min):** "Spot on. That's exactly the underlying framework. Wealth growth over time through multiplicative bets is a classic non-ergodic process. Maximising the ensemble average (EV) doesn't maximise – or often even correspond to – the time-average growth rate experienced by an individual agent. Kelly gives us the concrete policy to maximise that crucial time-average growth rate \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\). It operationalises geometric rationality."

  **Objection 4 (Pragmatic EV Maxer): "This seems far too sensitive to probability estimates. In the real world, my probabilities are fuzzy guesses, often biased. Won't slight overestimation of my edge using Kelly lead me to bet far too much and blow up? EV is more robust to bad estimates."**
  *   **Damage:** High. Major practical concern.
  *   **Concede:** Absolutely. Kelly is optimal only if your probability estimates are *perfect*. Overbetting due to overconfidence is a significant risk and can be more harmful than slightly underbetting. Kelly *is* sensitive.
  *   **Hold:** This is the strongest argument *for* fractional Kelly (e.g., 1/2 Kelly, 1/4 Kelly) as the sensible default. It explicitly builds in robustness against estimation error and model uncertainty. It acknowledges the sensitivity and mitigates it while *still* capturing the core benefit of position sizing based on edge and odds. Ignoring the Kelly logic entirely (i.e., betting like probability estimates are perfect for EV max) is *even more dangerous*.
  *   **Reply (2 min):** "You've hit the nail on the head – estimation error is the Achilles' heel. This is precisely *why* I argue for *fractional Kelly* as the default, not pure Kelly. Pure Kelly is the theoretical optimum under perfect knowledge, which we never have. Fractional Kelly (betting a fraction of the Kelly stake) significantly reduces the risk of ruin and drawdowns due to overestimation errors while still harnessing most of the growth benefit compared to naive full-portfolio bets or EV-maximising ruin. It’s a robust compromise acknowledging our epistemic limitations."

  **Objection 5 (The Philosopher): "What does 'the long run' even mean for a mortal? I only live once. My sequence of bets is one single, unique path. Why optimise for an average over infinite hypothetical paths I'll never see?"**
  *   **Damage:** High. Attacks the relevance of the asymptotic result.
  *   **Concede:** The strict mathematical "long run" (\(\lim T \to \infty\)) is indeed a fiction for individuals. Our lives are finite sequences.
  *   **Hold:** Kelly isn't *just* about the infinite limit; it optimises the *distribution* of outcomes over *finite* horizons too. It maximises the *median* outcome and minimises the probability of severe drawdowns or ruin over relevant timeframes. It provides the highest probability of reaching ambitious wealth goals within a given number of bets. EV maximisation, in contrast, often leads to high-variance strategies with a significant chance of poor outcomes ("gambler's ruin") even over moderate horizons.
  *   **Reply (2 min):** "You're right, immortality is off the table! But the 'long run' principle illuminates the *properties* of the strategy over finite sequences. Kelly doesn't just win in infinity; over finite sequences of repeated bets, it outperforms EV maximisation in key ways: it offers the highest *median* terminal wealth, the highest chance of beating any given wealth target, and crucially, the *lowest* probability of catastrophic loss or ruin within that timeframe. It gives you the best shot at achieving your goals *within* your finite betting lifetime while protecting your downside."

  **Objection 6 (Practical EA): "Most impactful EA decisions aren't repeated financial bets! They're one-off donations, policy choices, or research directions with highly uncertain, often non-fungible, non-monetary outcomes. How is Kelly relevant here?"**
  *   **Damage:** Medium-High. Questions applicability.
  *   **Concede:** Kelly is not a universal decision theory. Applying it directly to large, one-off, non-fungible bets with poorly defined probabilities and non-monetary payoffs is often inappropriate or impossible.
  *   **Hold:** The *underlying geometric rationality principle* is crucial: when facing repeated opportunities under uncertainty with multiplicative consequences (e.g., allocating funds across multiple grants/investments over time, choosing research paths with sequential learning), sizing your "bets" proportionally to your confidence/edge and your total "bankroll" (fund size, attention) is vital for sustainability and growth. Ignoring position sizing (betting the whole fund on one high-EV gamble) is reckless.
  *   **Reply (2 min):** "Direct application can be tricky, yes. But the core insight – that you must consider the *multiplicative impact on your capacity to act* over time – is vital. Suppose you're managing a fund making many grants. Betting your entire fund on one high-EV but uncertain project risks destroying your capacity entirely. The Kelly intuition pushes you towards diversified, proportionally sized allocations based on your estimated edge and impact potential, protecting your fund's longevity and ability to compound impact. It's a mindset against 'putting all your eggs in one basket' on steroids, even when baskets aren't dollars."

  **Objection 7 (Complexity Critic): "Kelly seems computationally demanding and restrictive. It requires precise probabilities, known odds, and assumes independent bets. The real world is messy – correlated risks, changing bankrolls, undefined odds. Isn't EV maximisation simpler and good enough?"**
  *   **Damage:** Medium. Practicality and complexity.
  *   **Concede:** Calculating the exact Kelly fraction for complex, correlated bets with uncertain probabilities is difficult or impossible. Simple EV calculations are often easier.
  *   **Hold:** The core heuristic – *don't overbet* – is powerful and simple. Fractional Kelly provides a robust framework. Saying "good enough" ignores the systematic ruin inherent in naive EV max for repeated bets. Even rough heuristics based on Kelly principles (e.g., "never bet more than X% on a single idea", "size positions roughly proportional to your estimated edge") are vastly superior to no sizing discipline. Simpler ≠ better when simpler leads to ruin.
  *   **Reply (2 min):** "You're right, pure maths models often don't fit perfectly. But the key takeaway isn't complex calculation; it's the *principle of proportional betting based on edge and bankroll*. Even a crude heuristic like 'Limit any single bet to 1-5% of your fund' or 'Reduce your bet size when uncertainty is high' embodies Kelly wisdom better than 'bet it all if EV > 0'. Fractional Kelly formalises this robustness. It's about disciplined position sizing to avoid blowing up, which naive EV maximisation utterly fails at. Simplicity that leads to ruin isn't virtuous."

  **Objection 8 (The "So What?" EV Maxer): "Fine, maybe for repeated gambling. But for small-stakes positive EV bets in daily life – like buying a slightly discounted raffle ticket where I estimate +EV – why *shouldn't* I just take it? The risk of ruin from one small ticket is negligible, and Kelly would say bet zero if the odds aren't hugely in my favour!"**
  *   **Damage:** Low-Medium. Tests the boundary.
  *   **Concede:** For truly negligible-stakes, one-off +EV opportunities where the bet size is microscopic relative to your bankroll and there's no repetition pattern implying future similar bets, taking it won't harm growth.
  *   **Hold:** 1) Many "small" bets add up psychologically and financially if they become habitual. 2) Kelly *doesn't* always say bet zero for small edges with finite odds; it says bet a small *fraction* proportional to edge/odds. For a tiny raffle ticket cost, that fraction might be de minimis, but the principle holds. 3) The danger is letting this logic justify *any* +EV bet regardless of size relative to bankroll. The raffle is harmless; betting 10% of your net worth on a 50.1% coin flip because it's +EV is reckless Kelly-violating madness.
  *   **Reply (2 min):** "If the cost is truly trivial relative to your wealth and it's genuinely a one-off, go ahead, enjoy the raffle! The Kelly fraction might be tiny but positive. The crucial point is the *principle for consequential, repeatable decisions*. Using the 'it's small +EV' logic to justify bets that *are* significant relative to your bankroll, or a pattern of many small -growth-rate bets, is where the danger lies. Kelly provides the guardrail against that slippery slope. The raffle isn't the problem; forgetting the principle when stakes are higher is."

  **The Question You're Hoping Nobody Asks (But Probably Will, Likely from the Philosopher or a Deeply Skeptical EV-er):**
  **"If Kelly is so sensitive to probability estimates, and our estimates in crucial EA domains (like x-risk reduction or speculative research) are often little more than made-up numbers reflecting deep uncertainty and biases, doesn't Kelly become entirely arbitrary? What genuine guidance does it offer beyond the trivial 'don't bet everything', when the key input (p) is essentially unknowable?"**

  *   **Damage:** Very High. Strikes at the heart of applying Kelly to EA's hardest problems.
  *   **Concede:** This is a profound challenge. With Knightian uncertainty or subjective probabilities spanning orders of magnitude, calculating a precise "edge" is impossible. Kelly *cannot* give a single magic number.
  *   **Hold:** Kelly's value in these scenarios isn't providing *the* number, but providing the *structure* and *intuition* for how to think about resource allocation under deep uncertainty:
      1.  **It Quantifies Conservatism:** It formalises *why* and *how much* you should discount your best-guess probabilities. Fractional Kelly (e.g., 1/10th or 1/100th) becomes a necessary safeguard against overconfidence. It forces explicit acknowledgement of estimation risk.
      2.  **It Highlights Fragility:** It shows how growth/impact potential collapses if you overbet relative to your true (but unknown) edge. It argues for robustness.
      3.  **It Demands Scenario Analysis:** Instead of one p, consider a *range* of p. What Kelly fractions does that imply? How does the growth rate curve look? This reveals the sensitivity and helps identify bets that are only attractive under overly optimistic assumptions.
      4.  **It Enforces Diversification Logic:** The multi-asset Kelly framework, though complex, reinforces that you shouldn't concentrate resources on one highly uncertain bet, even if its subjective EV is stellar, if others offer better risk-adjusted growth potential. It pushes towards portfolios resilient across probability distributions.
      5.  **"Don't bet everything" is NOT trivial:** In high-stakes, high-uncertainty domains (like x-risk), the naive "if EV>0, do it" logic *could* justify betting civilisation's future on a single, highly uncertain strategy. Kelly screams that this is insane unless your confidence is astronomically high (which it rarely is). It provides the *mathematical underpinning* for extreme conservatism in the face of existential uncertainty.
  *   **Reply (2 min - Deep breath):** "This is the crux, isn't it? You're absolutely right; plugging made-up numbers into the Kelly formula is worse than useless. But dismissing Kelly misses its deeper value here. Its power lies in the *framework it imposes*:
      *   It **forces us to confront estimation risk explicitly**. We *must* use fractional Kelly – perhaps betting 1/100th of what a naive best-guess p might suggest – as a buffer against our ignorance and bias.
      *   It **mathematically demonstrates the catastrophic cost of overbetting** under uncertainty, justifying extreme conservatism for existential stakes. 'Don't bet everything' becomes a quantified imperative based on potential growth collapse, not just a platitude.
      *   It **guides scenario planning** – exploring growth implications across *ranges* of p reveals fragility and helps identify robust strategies.
      *   It **reinforces the critical need for diversification** across uncertain bets to protect our 'impact bankroll'.
      So, while it won't spit out 'bet 3.7%', Kelly provides the rigorous language and logic for *why* and *how* to be profoundly cautious and diversified when facing deep uncertainty with multiplicative consequences. That's the crucial guidance."

  **Key Delivery Tips:**
  *   **Acknowledge the Objections:** "That's a really good point..." shows you've thought about this.
  *   **Concede Clearly:** Builds credibility. Don't fight unwinnable battles.
  *   **Bridge to Your Core:** "But the crucial point for *repeated decisions* is..." or "Where this really bites is..."
  *   **Use Their Language:** "Ensemble average," "time-average growth," "multiplicative process," "ruinous strategy," "fragility."
  *   **Focus on Ruin:** This is Kelly's strongest suit against naive EV max. Hammer the "guaranteed eventual bankruptcy" point.
  *   **Push Fractional Kelly:** Frame it as the robust, practical default acknowledging uncertainty.
  *   **Keep it Punchy:** Two minutes means one core concession, one core counter, one key takeaway per reply.
  *   **British Phrasing:** "Maths," "behaviour," "whilst," "amongst," "practise" (verb), "sceptical," "favourable," "maximise," "recognise," "colour" (if needed!), "brilliant point," "spot on," "precisely," "sceptical," "whinge" (maybe avoid that one!).

  Good luck with the talk! Expect lively debate – that's the point. The Philosopher's question is the hardest; lean hard on the "framework for conservatism under deep uncertainty" angle.

  > Drafted in British English, as requested. Focusing on the EA context, repeated bets, ruin risk, and practicality of fractional Kelly as default. Includes the dreaded probability-estimation question.
