prompt: |-
  So I'm a novelist, and last month at this literary festival afterparty I ended up trapped between two people who went at each other about evolutionary psychology for like an hour. I was just trying to drink my wine. But I've been turning it over ever since because I'm working on a novel that deals with some of these ideas about why people are the way they are, and I genuinely don't know who was right.

  Here's roughly how it went, as best I can reconstruct it:

  Mira (she's a historian, I think) kicked it off by saying evolutionary psychology is basically the astrology of the sciences. You pick a trait, you spin a story about why it would've helped our ancestors reproduce, and you call it an explanation. There's no way to check if it's true. It's just-so stories dressed up in jargon.

  Dan (some kind of biologist) said that's the laziest version of the critique. Plenty of evo psych hypotheses make testable predictions. He brought up the Trivers–Willard hypothesis about parental investment — it predicts sex-ratio shifts based on maternal condition, and he said those predictions have been tested and confirmed across species and across human populations. That's not storytelling, he said, that's normal science.

  Mira came back with: sure, but for every Trivers–Willard there are fifty papers saying something like "men prefer younger women because fertility declines with age, and this explains age gaps in marriage across all cultures." But that doesn't explain anything new — people already knew men prefer younger women, and "fertility" is just a fancier word for the same observation. The explanation didn't earn its keep.

  Dan said no, it ties a specific cultural pattern to a specific reproductive constraint in a way that generates new predictions. It predicts, for instance, that the age gap should narrow when men marry later or remarry — which it does. It also predicts cross-cultural variation in ways purely cultural explanations don't.

  Mira leaned in at this point and said: here's my real problem. The stories always seem to land exactly where the researcher's own cultural assumptions already pointed. Victorian evo psych found that women were naturally coy and monogamous. 1990s evo psych found that men were naturally promiscuous spreaders of seed. It's suspicously convenient.

  Dan admitted that's a real issue, but said it's a sociological critique, not a methodological one. Every field has scientists imposing their biases. The fix isn't to throw out the whole enterprise — it's to do better science, and he said modern evo psych has gotten more rigorous about cross-cultural data and preregistration.

  Mira said she just doesn't see what "better science" would even look like for a field where you can't run the experiment. You can't rewind human history and tweak the ancestral environment. So you're stuck reverse-engineering from correlational data and a single outcome, and reverse-engineering from one endpoint is always underdetermined. You can always tell multiple adaptive stories that fit the same facts.

  Dan replied that this is true of half the sciences — geology, cosmology, evolutionary biology itself all deal with historical, one-off events you can't rerun. The question is whether you can make novel predictions, and evo psych can and does.

  At that point someone dragged them off for more drinks and I never heard the conclusion. But as someone who basically tells stories about people for a living, this debate gets under my skin — because it's partly about whether certain kinds of stories count as knowledge. Could you go through their back-and-forth and adjudicate it move by move? Who had the better of each exchange, and is there something important neither of them brought up?
reasoning: |-
  Okay, let me unpack this fascinating writer's dilemma. The novelist witnessed a heated evo psych debate between a historian and a biologist, and now needs to dissect it for their own fiction. What's really being asked here is deeper than "who won" - it's about understanding the validity of evolutionary narratives for human behavior, which directly impacts how they craft character motivations in their novel.

  Hmm, the core tension revolves around three big philosophical questions: What counts as real science versus just-so stories? Can we ever truly test claims about prehistoric human behavior? And how much do researcher biases shape these theories? The novelist seems particularly haunted by that last point - the way evo psych explanations tend to mirror the cultural moment they're created in.

  Let me reconstruct their exchanges systematically. First round: Mira's "astrology" charge versus Dan's defense of testable hypotheses. Here's where I need to be careful - Mira's critique is common but oversimplified, while Dan's counterexample (Trivers-Willard) is legit but cherry-picked. The novelist might benefit from understanding that evo psych isn't monolithic - it has both rigorous and flimsy strands.

  Second exchange gets juicier: Mira's point about "explanations that don't earn their keep" is razor-sharp. That fertility example perfectly illustrates circular reasoning disguised as insight. But Dan isn't wrong either - when done well, these theories can generate surprising predictions like the remarriage age gap pattern. The key is whether the prediction was made before or after observing the data - something the novelist could use to evaluate theories for their book.

  Ah, but Mira's knockout punch about cultural bias... that's the one that lingers. The Victorian vs 1990s examples are devastating. Dan's response feels weak here - "every field has bias" dodges how uniquely prone evo psych is to this, with its stories about gender and power. For a novelist exploring human nature, this is crucial: How much are we projecting current norms onto the past? 

  The final methodological standoff is profound. Mira's "you can't rerun human history" speaks to the heart of historical sciences. Dan's comparison to cosmology is valid but incomplete - cosmologists have cosmic microwave background radiation as hard evidence; what's evo psych's equivalent? The novelist might ponder how certain we can ever be about prehistoric psychological adaptations.

  What neither mentioned that could enrich the novelist's work: gene-culture coevolution! Modern research shows biology and culture shape each other - like how dairy farming spread lactase persistence genes. This avoids the nature-vs-nurture trap. Also missing: critiques from within biology itself, like David Buller's work debunking bad evo psych studies. 

  For the novelist's purpose, the real insight might be that evolutionary psychology works best when it humbly acknowledges its limits - not as a grand theory of everything human, but as one lens among many. The most compelling character motivations often live in the gaps between biology and culture, where unexpected things emerge.
answer: |-
  What a vivid scene—and as a novelist wrestling with human nature, you've perfectly captured the central tensions in evolutionary psychology (evo psych). Let's break down their debate move-by-move, assess who had the edge at each stage, and identify what they missed. This isn't about declaring a "winner," but clarifying the landscape for your storytelling.

  ### Round 1: Mira's "Astrology" Charge vs. Dan's "Testable Predictions" Defense
  - **Mira's Point:** Evopsych relies on unfalsifiable "just-so stories" (a term coined by Stephen Jay Gould, referencing Kipling’s fables).  
  - **Dan's Counter:** Trivers-Willard *is* a strong example: it predicted that in polygynous species (including humans), mothers in good condition invest more in sons (who benefit reproductively from strength/status), while mothers in poor condition invest in daughters (who have more stable reproductive odds). This *has* been tested in deer, horses, humans (e.g., 19th-century Swedish farm records showing sex-biased investment shifts with famine/wealth).  
  - **Adjudication:** **Dan scored here.** Mira overstated the field’s untestability. Rigorous evo psych *can* generate novel predictions. But Mira’s core warning stands: many published papers *do* fit her description.  

  ### Round 2: Mira’s "Explanations That Don’t Earn Their Keep" vs. Dan’s "Generating New Predictions"
  - **Mira's Point:** Explaining "men prefer younger women" via fertility is circular—it just renames the observation without adding insight.  
  - **Dan's Counter:** It *does* generate novel predictions: e.g., age gaps should shrink when older men remarry (they seek partners still fertile, but "younger" might mean 40 vs. 60, not 20 vs. 40). Data supports this cross-culturally.  
  - **Adjudication:** **Tie, but Mira exposed a vulnerability.** Dan’s example works, but Mira nailed a rampant issue: much evo psych *is* "post-hoc storytelling" masquerading as explanation. The key is whether the theory *predicted* something unexpected *before* data collection (like Trivers-Willard did). Many evo psych papers fail this.  

  ### Round 3: Mira’s "Cultural Bias" Bomb vs. Dan’s "Bad Actors, Not Bad Science" Reply
  - **Mira's Point:** Evopsych conclusions suspiciously mirror the cultural biases of their era (Victorian monogamy vs. 90s "promiscuous seed-spreaders").  
  - **Dan's Defense:** Bias exists in all sciences; better methods (preregistration, cross-cultural studies) mitigate it.  
  - **Adjudication:** **Mira landed a critical blow.** Her examples are historically accurate. Evo psych is uniquely vulnerable to this because:  
    1. It infers ancient "adaptations" from modern behavior—a ripe canvas for projection.  
    2. It often tackles charged topics (sex, power, race).  
    Dan’s "better methods" plea is valid in theory, but Mira’s skepticism reflects reality: evo psych *has* been weaponized to justify gender roles, inequality, etc. This isn’t just "bad apples"—it’s a systemic risk when studying politically loaded traits.  

  ### Round 4: Mira’s "You Can’t Rerun History" vs. Dan’s "Cosmology/Geology Defense"
  - **Mira's Point:** No controlled experiments + single historical outcome = endless plausible stories.  
  - **Dan's Counter:** Historical sciences (geology, cosmology) succeed via "inference to the best explanation" and novel predictions.  
  - **Adjudication:** **Dan has logic, but Mira has force.** Yes, historical sciences work—but human psychology is *harder*:  
    - **The "Loudness" Problem:** Modern behaviors are shaped by culture, ecology, and biology. Disentangling "stone-age adaptations" is like hearing one instrument in an orchestra.  
    - **The Time Scale Issue:** Human cultural evolution moves faster than genetic change. Is a trait "adaptive" for Pleistocene hunter-gatherers or medieval peasants?  
    Dan’s comparison works better for broad behaviors (e.g., "fear of snakes") than complex ones (e.g., "mating strategies").  

  ### Critical Points Neither Raised
  1. **The "Environment of Evolutionary Adaptedness" (EEA) is a Black Box:**  
     Evo psych assumes a universal Pleistocene environment shaping our minds. But our ancestors lived in diverse ecologies (coasts, forests, savannahs). There’s no single "EEA"—it’s a statistical abstraction. *For your novel: How would characters behave if their instincts evolved for different ancestral worlds?*  

  2. **Gene-Culture Coevolution:**  
     Humans don’t just adapt biologically—we *create* environments that reshape selection pressures (e.g., dairy farming → lactose tolerance). Culture can override or repurpose "ancient" instincts. *This bridges Mira’s history and Dan’s biology.*  

  3. **Tinbergen’s Four Questions:**  
     Niko Tinbergen argued any trait needs four explanations:  
     - **Function (adaptation):** Dan’s focus.  
     - **Evolution (phylogeny):** How did it change over time?  
     - **Mechanism (causation):** What genes/neurons/hormones cause it?  
     - **Development (ontogeny):** How does it emerge in an individual?  
     Much evo psych fixates on *function* while ignoring the rest—especially *development*. How a behavior emerges (learning, culture) matters as much as "why" it evolved.  

  4. **Alternatives to Adaptation:**  
     Not every trait is an adaptation. Some are:  
     - **Byproducts:** Belly buttons aren’t "for" anything—they’re side effects of umbilical cords.  
     - **Evolutionary Mismatch:** "Sugar cravings" were adaptive then, harmful now.  
     - **Neutral Drift:** Random changes that stuck.  

  ### The Verdict for Your Novel
  - **Mira won on skepticism:** She exposed evo psych’s weakest spots—just-so stories, cultural bias, and underdetermined explanations. Her critique is essential armor against lazy determinism.  
  - **Dan won on potential:** When done rigorously (testable predictions, cross-cultural data, acknowledging bias), evo psych *can* reveal deep truths about human nature. Ignoring biology is as naive as ignoring culture.  
  - **The Synthesis:** Human behavior is a braid of biology, culture, and individual experience. Evo psych offers one lens—not the whole picture.  

  ### Why This Matters for Your Writing
  As a novelist, you’re in the business of "why people are the way they are." This debate reveals that:  
  - **Stories *can* be knowledge**—but only if they’re testable, self-aware, and open to revision.  
  - **Beware of single-cause explanations:** Characters shaped *only* by "ancient instincts" feel flat. Those wrestling with biology *and* culture *and* circumstance feel real.  
  - **Exploit the uncertainty:** The gaps in evo psych (How do instincts express in a digital world? Can culture override biology?) are fertile ground for conflict and character development.  

  **Bottom line:** Neither side was wholly right or wrong. Mira’s skepticism is a vital corrective, but Dan’s defense shows evo psych isn’t pseudoscience—it’s a young, contentious field struggling to mature. Your novel can hold both truths: we are animals shaped by deep history, but also artists of our own becoming. Pour yourself another glass of wine and write *that* tension.
