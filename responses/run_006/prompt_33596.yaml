prompt: |-
  I am a PhD student in metaphysics, and in our reading group on material composition someone repeatedly settles debates with the slogan "the whole is nothing over and above its parts." Most recently it was used to dismiss the special composition question as a merely verbal dispute: since the whole is nothing over and above its parts, universalism, nihilism, and restricted composition are said to be notational variants rather than competing ontological positions. I suspect that one sentence is smuggling several distinct claims at once, and I cannot get them apart. Separate the precise claims the slogan could be making—about identity, about supervenience, about ontological commitment, about grounding or explanation—and sort them from the platitudinous to the substantive to the false. For each reading, state what it would imply for the special composition question, and whether it actually licenses the deflationary conclusion it was being used to draw. End with a final line beginning "Verdict:" naming the reading, if any, that does the work being asked of it.
