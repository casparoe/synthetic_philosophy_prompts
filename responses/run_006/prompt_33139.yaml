answer: |-
  Your snap judgments reveal fascinating nuances that hyperbolic discounting alone can't capture. Let me synthesize a unified principle that fits your intuitions, then test it against your cases and extensions:

  **The Principle of Identity-Constrained Hyperbolic Discounting with Commitment Layers:**  
  *Choices reflect hyperbolic time preference, but are modulated by:  
  (1) The degree of *identity investment* in the commitment ("Is this core to who I am?"),  
  (2) The *contextual immediacy* of the temptation ("Is it in my face *now*?"),  
  (3) The *pre-commitment architecture* ("Are there barriers or identity costs to breaking it?").*

  Now, applying this to your cases:

  ### Your Verdicts Explained:
  1. **$100 vs $120:**  
     ✓ Classic hyperbolic discounting. But note: *Contextual immediacy* explains why impatience only erupts when "now" is truly present. The 11 vs 12 month gap lacks visceral urgency.

  2. **Gym membership:**  
     ✓ Not akrasia. You're paying for *identity exploration* ("chance to become someone who works out"). Low sunk cost + low identity investment ("quitter" isn't core identity) makes abandonment painless.

  3. **Failed morning run:**  
     ✓ Not weakness of will. At 6 AM, *contextual immediacy* of sleep need overwhelms abstract commitment. Your sleepy self isn't "you" making a choice—it's a different state with altered valuations.

  4. **Dentist appointment:**  
     ✓ Resolution works because:  
     - High *pre-commitment architecture* (scheduled, paid, social expectation)  
     - No *contextual immediacy* of temptation (dread ≠ craving; you don't *want* to cancel)  
     - *Identity investment* ("responsible adult" identity overrides discomfort)

  5. **Colloquium talk:**  
     ✘ **Tension resolved:** September-you *does* have authority—if April-you benefits from professional identity ("reliable academic"). But if the work feels *genuinely* pointless in April, breaking it isn't akratic—it's rational updating. Akrasia would be canceling *despite* believing the talk has value.

  6. **Smoking vs. Sugar:**  
     ✓ Difference is *identity investment*:  
     - Smoking: "Quitter" identity is salient; breaking pledge feels like self-betrayal (akrasia)  
     - Sugar: Diet isn't identity-defining; revision feels like preference adjustment  

  ---

  ### Testing the Principle on New Cases:
  - **Locked savings account (fee for withdrawal):**  
    → *Should feel non-akratic.* High pre-commitment architecture + "financially disciplined" identity make early withdrawal unthinkable. Fee raises the identity cost ("I'd be an idiot to pay $20 for $100 now!").

  - **Pill removing temptation (e.g., anti-craving medication):**  
    → *Not willpower—it's engineering.* Avoids the identity conflict entirely by eliminating the visceral tension. Feels like "cheating" only if you value struggle as identity-defining.

  ---

  ### Verdicts You Might Need to Drop:
  1. **"September me had no business signing up April me":**  
     Your principle forces conceding that future-oriented commitments *are* legitimate when tied to identity (e.g., professional reputation). Drop the intuition that April-you is "trapped"—instead, frame it as intertemporal cooperation.

  2. **"Dentist isn't a struggle":**  
     Your theory *requires* acknowledging it *is* resolution—but precisely because identity/pre-commitment overpower dread. The "no drama" is a feature of successful willpower, not its absence.

  ---

  ### Why This Works:
  Hyperbolic discounting is the engine, but your judgments reveal three critical modulators:  
  - **Identity** turns abstract goals into self-defining projects (smoking vs. sugar).  
  - **Context** determines when hyperbolic curves steepen (now vs. future money; 6 AM sleepiness).  
  - **Pre-commitment** layers (appointments, sunk costs) create friction against impulses.

  **One gap:** Your gym membership case (*paying for potential*) suggests an "option value" beyond standard models. This might require adding:  
  > *"We sometimes pay for the right to *attempt* identity change, valuing the *possibility* of transformation over expected utility."*

  This system explains why some broken promises feel like weakness (identity violation) and others like reasonable updates (low identity stakes). It honors your intuition that willpower isn't just about desire battles—it's about *who we think we are* when temptation strikes.
