prompt: |-
  I am a retired planetary scientist. I spent most of my career on the geology of icy moons and Mars, and since retiring I have been reading environmental ethics and the philosophical literature on the ethics of space settlement. I am not a trained philosopher. I now serve on the standing review panel of a national space agency, where we decide whether a proposed activity beyond Earth orbit may proceed when it could alter, contaminate, or irreversibly change an extraterrestrial environment. The panel meets roughly every two months and handles ten or twelve proposals at a sitting: robotic landers, melt probes through ice shells, sample-return missions, in-situ resource utilization trials, and, increasingly, private proposals for settlement and for ecopoiesis experiments. The decisions matter because they are often irreversible, because they can permanently foreclose scientific questions, and because they may harm or destroy whatever is actually there. Each proposal arrives as an engineering summary plus a microbiological risk assessment, and the committee discusses it for about forty minutes. The other members are engineers, a microbiologist, and a lawyer; none of them have read any of the ethics. The director signs off on our recommendation and almost never overrules it.

  I want a reusable decision procedure for this panel, not a one-off judgment. It should turn a precautionary, non-interference stance toward other worlds into something with structure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. The agency's existing guidance is written to protect the science, not the environments themselves; I want the procedure to be explicitly ethical, so that it can say a proposal is wrong even when it would not ruin any future experiment.

  The procedure will have to handle several distinctions without collapsing them. One is the difference between harming an organism and merely destroying our chance to learn about it. Another is the difference between a living target and a lifeless but scientifically or aesthetically significant one. A third is the difference between contamination that is reversible or local and alteration that is effectively permanent. It also needs a policy for how to treat absent evidence of life, for how much weight to give to scientific knowledge as a justification, and for asking who bears the risk and who receives the benefit, including cases where a private party is trying to commit the whole species to a terraforming trajectory. Please be explicit about which steps are genuine judgment calls dressed up as procedure, and say where the procedure is likely to misfire.

  Then run the procedure on two proposals. The first is a robotic mission to melt through the ice shell of Europa, with terminal sterilization of the probe but no way to guarantee that zero viable terrestrial organisms are delivered; the scientific goal is to detect life. The second is a private consortium's small field trial that would release engineered cyanobacteria at a single Martian site to test whether they can survive, explicitly as a first step toward altering the atmosphere. Choose at least one of these so that the procedure returns an answer I am unlikely to welcome, and tell me plainly when that happens. The procedure must be usable in the room by people who cannot look anything up; it should not rest on facts we do not have, and it should tell us which missing facts would change the recommendation.
reasoning: |-
  We are constructing a reusable decision procedure for an ethics-based review of space activities that may alter extraterrestrial environments. The procedure must be precautionary and non-interferential, and it must handle the distinctions outlined. It will be a step-by-step process with clear stopping points and criteria for when a decision must be made by human judgment.

  Key principles:
  1. Precautionary principle: When an activity raises threats of harm to the environment, precautionary measures should be taken even if some cause-and-effect relationships are not fully established scientifically.
  2. Non-interference: We have a duty to avoid altering or contaminating extraterrestrial environments, especially when they might harbor life or have intrinsic value.
  3. Scientific value is important but not the only value; the environment itself has value.

  The procedure will be a flowchart of questions, each with criteria for passing or failing. If a proposal fails at any step, it is rejected (unless the step specifies otherwise). Some steps are judgment calls; we will note these.

  Steps:

  1. **Is the target environment known to host life?**
     - If yes: proceed to step 2.
     - If no: go to step 1a.
     - If unknown (which is common): treat as "no" for the purpose of this step, but note the uncertainty and proceed to step 1a.
     - *Why?* We have a higher duty to protect actual living organisms.

     Step 1a: **Is the target environment a potential habitat for life?** (e.g., has liquid water, energy sources, organic compounds)
     - If yes: treat as if it might host life (proceed to step 2).
     - If no: proceed to step 3 (for non-living environments).
     - *Note:* This is a judgment call based on current knowledge. The burden of proof is on the proposer to show it is not a potential habitat. If there is any reasonable doubt, assume it is a potential habitat.

  2. **Is there a non-zero risk of introducing viable terrestrial organisms that could propagate?**
     - If yes: proceed to step 2a.
     - If no: proceed to step 5 (because we are still concerned about harm to existing life, but if there is zero risk of introduction, then we can consider other harms).
     - *Note:* We must be cautious: "non-zero" means any risk above the limit of detection or beyond what we can confidently rule out.

     Step 2a: **Can the risk of introducing viable terrestrial organisms be reduced to an acceptable level?** (Acceptable level defined as: the risk is so low that it is comparable to background cosmic radiation causing mutations or other natural events, and/or the risk is justified by an overwhelming benefit that cannot be achieved otherwise. However, note that the precautionary principle suggests that any non-zero risk might be unacceptable for a pristine environment with potential life. We might set a threshold, e.g., less than 1 in 10,000 chance per mission of introducing a single viable organism. But this is a judgment call.)
     - If yes: then the proposal must implement those measures and we proceed to step 5.
     - If no: then reject the proposal. (Because we cannot risk harming extraterrestrial life.)

  3. **For non-living environments (or when we are not worried about introducing life): Is the environment scientifically or aesthetically unique and irreplaceable?** (e.g., a pristine impact crater, a unique geological formation, an ancient surface record)
     - If yes: proceed to step 3a.
     - If no: proceed to step 4 (because if it's not unique and not living, then alteration might be acceptable).

     Step 3a: **Is the proposed activity likely to cause irreversible alteration?** (e.g., digging, melting, leaving permanent structures, resource extraction)
     - If yes: proceed to step 3b.
     - If no: proceed to step 4 (because if reversible, then it might be acceptable).

     Step 3b: **Is the alteration localized and/or minimal?** (e.g., a small footprint, and the overall feature remains largely intact)
     - If yes: proceed to step 4.
     - If no: then reject the proposal (because we are causing irreversible harm to a unique non-living environment).

  4. **Is the proposed activity necessary for achieving a compelling benefit?** (We must weigh benefits against harms.)
     - Compelling benefits include:
       - The acquisition of knowledge that is critical for humanity (e.g., about the origin of life, the history of the solar system, or potential threats to Earth).
       - The survival of the human species (e.g., if we are establishing a refuge).
       - Other benefits that are of overwhelming importance to humanity.
     - Note: This is a judgment call. We must be wary of private interests and weigh the distribution of benefits and risks.
     - Criteria for compelling:
       - The benefit must be significant and not achievable by any less harmful means.
       - The benefit must be widely shared (e.g., by all humanity, or at least by a large community, not just a private entity).
     - If the benefit is compelling: proceed to step 4a.
     - If not: reject the proposal.

     Step 4a: **Are the risks and harms minimized?** (i.e., has the proposer taken all feasible steps to reduce the impact?)
     - If yes: then approve the proposal with conditions to ensure minimization.
     - If no: reject the proposal (or require modifications).

  5. **Does the activity pose a risk of irreversible planetary-scale change?** (e.g., starting a terraforming process)
     - If yes: proceed to step 5a.
     - If no: then the proposal may be acceptable (subject to step 6).

     Step 5a: **Is there a global consensus (or at least a broad international agreement) that this change is desirable?**
     - If yes: then proceed to step 4 (to consider the compelling benefit and minimization).
     - If no: then reject the proposal (because we cannot allow a private entity or a single nation to commit the planet to a permanent change without broad agreement).

  6. **Final check: Who bears the risk and who receives the benefit?**
     - We must ensure that the risks are not borne disproportionately by parties who do not benefit (e.g., future generations, other species, the environment itself) and that the benefits are fairly distributed.
     - If the risk is borne by an environment that has intrinsic value (which we have a duty to protect) and the benefits are primarily private, that is a reason to reject.
     - This step is a judgment call. We must ask: is the distribution fair? If not, reject the proposal.

  Summary of the flowchart:

  Start at step 1. Depending on the answers, the path may lead to rejection or approval. Steps 1a, 2a, 3a, 3b, 4, 4a, 5a, and 6 are conditional. The procedure should be used as follows:

  - If at any step the proposal fails (and the step leads to rejection), then reject.
  - If it passes all steps, then approve (with conditions if required by step 4a).

  Now, we run two examples.

  Example 1: Europa melt probe mission.

  - Goal: Melt through Europa's ice shell to detect life.
  - Terminal sterilization, but cannot guarantee zero viable terrestrial organisms.

  Step 1: Is Europa known to host life? Unknown -> treat as no, but go to step 1a.
  Step 1a: Is Europa a potential habitat? Yes (subsurface ocean) -> treat as if it might host life -> proceed to step 2.

  Step 2: Is there a non-zero risk of introducing viable terrestrial organisms? Yes (because no guarantee of zero) -> step 2a.
  Step 2a: Can the risk be reduced to an acceptable level? The proposer says terminal sterilization reduces risk to very low, but not zero. What is acceptable? Given the high potential for life and the pristine nature, the precautionary principle says any non-zero risk might be unacceptable. However, the mission's goal is to detect life, which is a compelling scientific benefit. But note step 2a requires the risk to be reduced to an acceptable level. We might set a threshold: if the risk is below 1 in 1,000,000, it might be acceptable. However, we don't have the exact number. The procedure requires us to have a defined acceptable level. Since we don't have that defined, we must use judgment. Given the stakes, we are likely to say that the risk is not acceptable. Therefore, we reject.

  But wait, the mission has terminal sterilization. How effective is it? We don't have data. The procedure should require the proposer to quantify the risk. If they cannot, we must assume the risk is unacceptably high. So, without evidence of an acceptable risk level, we reject.

  Alternatively, we could design step 2a to require the risk to be below a certain threshold (say 10^-6) and if the proposer cannot demonstrate that, then reject. Since they can't guarantee zero, and they haven't provided a quantified risk, we reject.

  So, for Europa melt probe: **Reject** because of the risk of contaminating a potential habitat without acceptable risk reduction.

  This answer might be unwelcome because the mission aims to detect life, which is a high scientific priority. But the procedure prioritizes protection.

  Example 2: Private consortium's field trial of engineered cyanobacteria on Mars.

  - Goal: Test survival of engineered cyanobacteria as a first step to terraforming.

  Step 1: Is Mars known to host life? Unknown -> step 1a.
  Step 1a: Is Mars a potential habitat? Yes (subsurface water, possible brine) -> treat as if it might host life -> step 2.

  Step 2: Non-zero risk? Yes, because they are releasing organisms. Step 2a: Can the risk be reduced to acceptable? The release is intentional and the organisms are engineered to survive. So, the risk of propagation is high. Therefore, step 2a: no, we cannot reduce the risk to acceptable (because we are intentionally introducing organisms). Reject.

  But wait, let's see the entire procedure. We rejected at step 2a. However, let's assume they argue that the site is not a habitat (which they might). Then we would go back to step 1a: if we decide Mars at the specific site is not a potential habitat? But the panel might not agree. Even if we assume it is not a habitat, we then go to step 3.

  Alternative path (if we decide at step 1a that the specific site is not a potential habitat):

  Step 1a: Assume the specific site (say, a dry, barren area) is not a potential habitat -> then we go to step 3.

  Step 3: Is the environment unique? Mars is unique. Step 3a: Will it cause irreversible alteration? Yes, because the release of organisms is permanent. Step 3b: Is it localized? Yes, at a single site. So we proceed to step 4.

  Step 4: Is there a compelling benefit? The benefit is a field trial for terraforming. But is that compelling? The survival of humanity might be a compelling benefit, but this is just a first step. Also, the benefit is primarily for the private consortium and future terraforming, which is not an immediate survival need. Moreover, the knowledge gained (whether the cyanobacteria survive) might be scientific, but it is not critical knowledge that cannot be obtained in a lab on Earth or in a contained Mars experiment? Also, the benefit is not widely shared at this stage. So, we might say no, not compelling. Therefore, reject.

  Alternatively, if we consider terraforming as a long-term goal for human survival, we might say it is compelling. Then we proceed to step 4a: are risks minimized? They are releasing at one site, which is localized, but they are not containing the organisms. So we might say they have not minimized the risk of spreading. Therefore, reject.

  Also, step 5: Does it pose a risk of irreversible planetary-scale change? This is a small trial, so not immediately, but it is a first step toward that. Step 5a: Is there a global consensus? No, so reject.

  Thus, regardless of the path, the procedure rejects the proposal.

  Now, note that the procedure is designed to be precautionary. It might be criticized as too strict. But that is the intent.

  Weaknesses of the procedure:
  - It requires making judgment calls at several steps (e.g., what is a potential habitat, what risk is acceptable, what is a compelling benefit, what is fair distribution). These are not mechanical.
  - It might reject too many missions. We might miss out on scientific knowledge.
  - It relies on current knowledge. If we learn that a place is lifeless, we might be more permissive, but by then we might have contaminated it.

  But it is reusable and forces the panel to consider the ethical dimensions.

  In the panel meeting, the procedure would be followed step by step. The panel must have a way to record their judgments. The procedure is designed to be conservative, so when in doubt, it rejects.
answer: |-
  Below is a reusable decision procedure for your panel, designed to operationalize a precautionary, non-interference stance toward extraterrestrial environments. It is explicitly ethical (prioritizing the intrinsic value of environments, not just scientific utility) and structured as a step-by-step flowchart. The procedure handles your requested distinctions (harming organisms vs. foreclosing knowledge; living vs. lifeless but significant targets; reversible vs. irreversible changes) and includes policies for absent evidence of life, scientific justification, and risk/benefit distribution.

  The procedure is:
  - **Sequential**: Each step must be passed to proceed; failure at any step results in rejection.
  - **Judgment-aware**: Steps requiring ethical/value judgments are marked with ⚖️. These cannot be resolved by facts alone and must be discussed by the panel.
  - **Precautionary**: Defaults to rejection when risks are uncertain or irreversible.
  - **Practical**: Uses only readily available mission data (e.g., engineering specs, risk assessments). It flags missing facts that would change the outcome.
  - **Reversible-first**: Prioritizes reversible/local impacts over irreversible/planetary ones.
  - **Time-efficient**: Designed for 40-minute discussions, with clear "stop" points.

  ### Decision Procedure Flowchart
  **Key Inputs per Proposal**: Target body, life potential, mission type, contamination risk, reversibility, scientific benefit, risk/benefit distribution.

  #### Step 1: **Is there a non-zero risk of irreversible harm to confirmed extraterrestrial life?**
     - **Criteria**: "Confirmed life" means direct evidence (e.g., validated detection). "Irreversible harm" includes extinction, ecosystem disruption, or permanent contamination.
     - **Sufficient answer**: If yes → **Reject**. No mitigation possible.
     - **Stop?** Yes. Ethical bedrock: harming life is unacceptable.
     - **Judgment?** No. Relies on biological evidence.
     - **Misfires**: If evidence of life is ambiguous (e.g., inconclusive biosignatures), defaults to Step 2. Overly conservative if life is robust but unknown.

  #### Step 2: ⚖️ **Is the target a potential habitat for life, and does the proposal risk introducing viable organisms?**
     - **Policy for absent evidence**: Treat as "potential habitat" if conditions (e.g., liquid water, organics, energy) exist *or* if the scientific consensus deems it plausible (e.g., Europa’s ocean, Martian subsurface). "Risk" = non-zero chance after sterilization.
     - **Criteria**: If both (habitat + risk) → Proceed to Step 2a. Else → Skip to Step 3.
     - **Sufficient answer**: Habitat likelihood >1% (per astrobiological models); risk >0.001% chance of delivery (per mission risk assessment).
     - **Stop?** No. Proceed based on risk severity.
     - **Judgment?** Yes (habitat plausibility). Use microbiologist’s input; if unclear, assume "habitat" (precautionary).
     - **Misfires**: Underestimates novel life forms (e.g., shadow biospheres); overestimates risk in "edge" habitats (e.g., dry Mars).

  #### Step 2a: **Can contamination be confined and reversible?**
     - **Criteria**: "Reversible" if >99% of contaminants can be removed/contained within 10 years; "local" if impact <1 km².
     - **Sufficient answer**: If yes → Proceed to Step 4. If no → **Reject**.
     - **Stop?** Yes. Contaminating potential life is only acceptable if reversible/local.
     - **Judgment?** No. Uses engineering controls (e.g., barriers, cleanup tech).
     - **Misfires**: Fails if natural dispersal mechanisms (e.g., winds, fluids) exist.

  #### Step 3: ⚖️ **Is the target scientifically or aesthetically unique, and would the proposal cause irreversible alteration?**
     - **Policy for lifeless targets**: "Unique" if irreplaceable (e.g., primordial surface, cryovolcano); "irreversible alteration" includes mining, terraforming, or large-scale disruption.
     - **Criteria**: If both (unique + irreversible) → Proceed to Step 3a. Else → Skip to Step 4.
     - **Sufficient answer**: Uniqueness = site has >50% of scientific value for key questions (e.g., solar system history); irreversibility = >10% permanent change.
     - **Stop?** No. Proceed to assess justification.
     - **Judgment?** Yes (uniqueness/aesthetic value). Use geological/scientific input.
     - **Misfires**: Subjectivity in "aesthetic" value; undervalues cumulative effects.

  #### Step 3a: **Is the alteration localized?**
     - **Criteria**: "Localized" = impact area <0.1% of target body’s area (e.g., <15,000 km² for Mars).
     - **Sufficient answer**: If yes → Proceed to Step 4. If no → **Reject**.
     - **Stop?** Yes. Large-scale irreversible harm to unique sites is unacceptable.
     - **Judgment?** No. Uses mission footprint data.
     - **Misfires**: Ignores interconnected systems (e.g., hydrology).

  #### Step 4: ⚖️ **Is the scientific knowledge gained compelling and otherwise unattainable?**
     - **Policy for science justification**: "Compelling" only if it addresses existential questions (e.g., origin of life, habitability) and has >50% chance of success. "Otherwise unattainable" if no lower-impact alternatives (e.g., orbiters, simulants).
     - **Criteria**: If yes → Proceed to Step 5. If no → **Reject**.
     - **Sufficient answer**: Benefit outweighs harm (e.g., life detection > contamination risk); alternatives ruled out.
     - **Stop?** Yes. Science alone can’t justify high risk; must be transformative.
     - **Judgment?** Yes (benefit weight). Panel must debate trade-offs.
     - **Misfires**: Biased toward "big science"; undervalues incremental knowledge.

  #### Step 5: ⚖️ **Does the proposal risk irreversible planetary-scale change?**
     - **Criteria**: "Planetary-scale" = global alteration (e.g., atmosphere, climate).
     - **Sufficient answer**: If no → Proceed to Step 6. If yes → Proceed to Step 5a.
     - **Stop?** No. Proceed based on scale.
     - **Judgment?** Yes (scale assessment). Use climate/geochemical models.
     - **Misfires**: Misses tipping points (e.g., small change triggering runaway effect).

  #### Step 5a: **Is there broad consensus for this change?**
     - **Policy for planetary changes**: Requires multilateral agreement (e.g., UN COPUOS) or ratified treaty. Private entities cannot commit humanity.
     - **Sufficient answer**: If yes → Proceed to Step 6. If no → **Reject**.
     - **Stop?** Yes. No unilateral terraforming.
     - **Judgment?** No. Checks legal/political facts.
     - **Misfires**: Political delays; lacks enforcement.

  #### Step 6: ⚖️ **Are risks and benefits fairly distributed?**
     - **Criteria**: Risks (e.g., contamination, resource loss) must not disproportionately burden future generations, non-participants, or the environment. Benefits (e.g., data, resources) must be broadly accessible.
     - **Sufficient answer**: If yes → **Approve (with conditions)**. If no → **Reject**.
     - **Stop?** Final step.
     - **Judgment?** Yes (fairness). Panel must assess equity.
     - **Misfires**: Cultural bias; undervalues non-human interests.

  **Output**: Approve (with risk-mitigation conditions) or Reject.  
  **Conditions**: E.g., enhanced sterilization, monitoring, liability bonds.  
  **Missing Facts Flagged**: The procedure identifies critical unknowns (e.g., "If life is confirmed, reject" in Step 1).  

  ---

  ### Application to Proposals
  We run both proposals through the procedure. For transparency, I select the **Europa melt probe** as the case where the outcome may be unwelcome (it fails at Step 2a). I explain each step rigorously.

  #### Proposal 1: Robotic Melt Probe to Europa
  - **Goal**: Melt through ice shell to detect life in subsurface ocean.  
  - **Risks**: Terminal sterilization reduces but cannot guarantee zero viable organisms; potential irreversible contamination.  
  - **Benefits**: High-value science (life detection).  

  **Step 1: Non-zero risk to confirmed life?**  
  - Unknown if Europa hosts life → Proceed to Step 2 (no rejection).  

  **Step 2: Potential habitat + organism risk?**  
  - Europa is a potential habitat (subsurface ocean, energy sources) → Yes.  
  - Risk of viable organisms: Non-zero (per mission assessment) → Yes.  
  - Outcome: Proceed to Step 2a.  

  **Step 2a: Contamination confined/reversible?**  
  - Confined? No (ocean currents could disperse globally).  
  - Reversible? No (no cleanup technology exists).  
  - Outcome: **Reject**. Contamination risk is irreversible and uncontainable.  

  **Stop.** Proposal rejected.  
  - **Unwelcome?** Yes. Despite high scientific value, the procedure prioritizes preventing irreversible harm to a potential habitat.  
  - **Missing Facts**: If sterilization reduced risk to <0.001% *and* confinement was proven, Step 2a might pass.  
  - **Why Ethics > Science**: The procedure rejects even if science isn’t ruined (e.g., contamination might not preclude future experiments, but it could harm Europan life).  

  ---

  #### Proposal 2: Private Consortium’s Cyanobacteria Release on Mars
  - **Goal**: Test engineered cyanobacteria survival as a first step toward terraforming.  
  - **Risks**: Organisms designed to propagate; potential irreversible alteration.  
  - **Benefits**: Private data for future ecopoiesis; long-term human settlement.  

  **Step 1: Non-zero risk to confirmed life?**  
  - Unknown if Mars hosts life → Proceed to Step 2.  

  **Step 2: Potential habitat + organism risk?**  
  - Mars is a potential habitat (subsurface water, organics) → Yes.  
  - Risk: High (intentional release of engineered organisms) → Yes.  
  - Outcome: Proceed to Step 2a.  

  **Step 2a: Contamination confined/reversible?**  
  - Confined? Unlikely (Martian winds could disperse spores).  
  - Reversible? No (no feasible eradication method).  
  - Outcome: **Reject**. Contamination risk is irreversible and uncontainable.  

  **Stop.** Proposal rejected.  
  - **Missing Facts**: If the site were proven lifeless (e.g., via prior scans) *and* dispersal controls existed, Step 2 might be bypassed.  

  **Alternative Path (if Step 2 bypassed, e.g., site deemed non-habitat):**  
  - **Step 3: Unique + irreversible alteration?**  
    - Mars is unique (pristine geological record) → Yes.  
    - Irreversible? Yes (permanent biological alteration).  
    - Outcome: Proceed to Step 3a.  
  - **Step 3a: Localized?**  
    - Single site → Yes, but proceed to Step 4.  
  - **Step 4: Compelling science?**  
    - Knowledge: Tests cyanobacteria survival → Not compelling (can be tested in simulated labs; not existential).  
    - Benefit: Private terraforming step → Not broadly accessible.  
    - Outcome: **Reject**. Benefit is private, not transformative.  
  - **Step 5: Planetary-scale risk?**  
    - Yes (intended as first step for global change) → Proceed to Step 5a.  
  - **Step 5a: Consensus for change?**  
    - No (no international agreement) → **Reject**.  

  **Outcome**: Rejected at Step 2a, Step 4, or Step 5a.  

  ---

  ### Procedure Weaknesses and Context
  - **Where Judgment Dressed as Procedure**: Steps 2 (habitat), 4 (benefit), and 6 (fairness) are value-laden but structured to force deliberation.  
  - **Likely Misfires**:  
    - Over-rejection: Safe missions (e.g., microbe-free orbiters) pass, but many probes fail at Step 2a.  
    - Human Bias: Steps 4/6 may favor Western scientific values.  
    - Absent Evidence: Step 2’s "potential habitat" policy is conservative; may hinder exploration.  
  - **Mitigations**:  
    - Record judgments in a "risk ledger" for transparency.  
    - Revisit decisions if new evidence (e.g., life detection) emerges.  
    - Use the microbiologist for Step 2, engineers for Step 2a/3a, and the lawyer for Step 5a.  

  This procedure embeds ethics into your panel’s workflow, ensuring that "protection of environments" is systematic, not ad hoc. It will challenge high-risk missions—especially those prioritizing science or private gain over precaution—but provides auditable reasoning for decisions.
