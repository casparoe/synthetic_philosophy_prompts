prompt: |-
  I'm a software engineer with no formal background in philosophy, but I've ended up thinking about merit and desert because of promotion committees, performance reviews, and equity grants at my company. I went through a set of cases and wrote down my gut reactions. Now I'm trying to figure out whether there's a coherent principle behind them, or whether I need to revise some of my verdicts.

  I'd like you to approach this as a professional philosopher working through a problem in reflective equilibrium. Start by identifying the tensions among my verdicts, then work toward the best principle (or small set of principles) that captures as many of them as possible, and be honest about which verdicts it cannot accommodate.

  Here are my verdicts:

  1. Alice works 55-hour weeks and is always available on Slack; her code is mediocre and bug-prone. Bob works 30 hours, coasts visibly, but his code is clean and reliable. They're up for the same promotion: Bob deserves it more. The output matters more than the effort.

  2. Carol went to Stanford with every advantage. Dave taught himself to code on a secondhand laptop while working retail. Both are equally productive engineers now. My gut says Dave deserves more admiration for getting here — but I don't think he deserves a higher salary or a faster promotion because of his background. That feels like it should be consistent, but I can't see how.

  3. Elena designed the architecture that made a new feature possible. Frank implemented it and got the public recognition. Elena deserves at least as much credit as Frank, but Frank deserves the public recognition. I'm not sure these can both be true.

  4. Grace joined a startup two months before the acquisition and got a $400,000 payout. Henry was employee #3, built the core product over four years, but burned out and left six months before the acquisition — he got nothing. Henry clearly deserves more than Grace. The unfairness is in the system, not Grace's fault, but I still feel Henry was robbed.

  5. Irene chose a framework after careful research, expert consultation, and a pilot. It failed because of a subtle flaw that only emerged under load. Jack picked whatever was trending on Hacker News and it worked perfectly. For the next high-stakes project, Irene deserves it over Jack. The quality of the decision matters more than the outcome.

  6. Kevin hit all his OKRs by picking safe, incremental tasks. Lisa missed hers because she spent the quarter on a high-risk architecture migration the team badly needed. Lisa deserves the higher performance rating — but if we reward people for missing targets, we undermine the whole point of having targets.

  Is there a unified account of desert that makes sense of these verdicts? If not, which of my verdicts do I need to give up, and what does the best available principle say about a case I haven't listed: someone who succeeds by taking credit for other people's work?
reasoning: |-
  Okay, the user is a software engineer grappling with the concept of merit and desert in professional settings. They've presented six cases where their intuitive judgments about who deserves what (promotions, credit, rewards) seem conflicting. They want a philosopher's approach to find coherence or identify necessary revisions.

  First, I notice the tension between outcome-focused and process-focused desert. Cases 1 and 5 directly contradict each other: Alice's effort vs Bob's output, then Irene's good process vs Jack's lucky outcome. The user clearly values both but hasn't resolved when each matters. 

  Carol/Dave highlights another layer - admiration vs material desert. The user intuitively separates character admiration from professional rewards but can't articulate why. That suggests we need to distinguish types of desert claims.

  Elena/Frank exposes credit vs recognition asymmetry. The user wants both to deserve equal credit but accepts unequal recognition. That might point to social perception vs intrinsic contribution being different categories.

  Grace/Henry is pure outcome injustice. Here the user blames the system, not Grace, but still feels Henry was robbed. This reveals their underlying belief that desert should correlate with sustained contribution, regardless of timing quirks.

  Kevin/Lisa shows the conflict between metric performance and value creation. The user wants to reward Lisa's strategic risk but fears undermining goal-setting systems. This operational tension matters most practically for their work.

  For a unified theory, I'm considering a three-pronged approach: 
  1. Desert based on controllable inputs (effort, diligence)  
  2. Desert based on valuable outputs (results, reliability)  
  3. Desert based on moral character (overcoming adversity)  

  But these won't perfectly reconcile all cases. Specifically:  
  - Carol/Dave breaks the controllability rule (Dave's background isn't controllable now)  
  - Grace/Henry violates contribution-based desert but can't be fixed retroactively  
  - Kevin/Lisa requires changing the reward system itself, not just individual assessments  

  The toughest revision will be case 2. If the user keeps insisting background shouldn't affect promotions, they must fully decouple admiration from professional desert. That means accepting Dave gets no extra work rewards - only respect.

  For the unpublished case about stealing credit: under this framework, the thief deserves nothing because they controlled neither the input (others' work) nor the true output (their contribution was fake). But the visible "output" (presentation) might get rewarded - another system flaw.
answer: |-
  Your verdicts reveal a fascinating tension between **contribution-based desert** and **character/admiration-based desert**, with additional conflicts around **luck vs. control** and **systemic constraints**. After analyzing your cases, I propose a **Two-Tiered Desert Framework** that captures most of your intuitions while requiring one revision. Here's the breakdown:

  ### Core Principle
  **Desert in professional contexts derives from *controllable inputs* that create *value for the organization*.**  
  *(Key corollary: Admiration for moral character/perseverance is real but distinct from professional desert.)*

  ---

  ### Applying the Principle to Your Cases
  | Case | Your Verdict | Principle's Verdict | Consistency |
  |------|--------------|----------------------|-------------|
  | 1 (Alice/Bob) | Bob deserves promotion | **Consistent**: Bob's controllable input (coding skill) creates more reliable value than Alice's effort | ✅ |
  | 2 (Carol/Dave) | Dave deserves admiration but not higher pay | **Consistent**: Dave's background warrants admiration (character desert), but current *controllable inputs* (productivity) are equal → equal professional desert | ✅ |
  | 3 (Elena/Frank) | Elena deserves credit; Frank deserves recognition | **Partially Consistent**: Elena deserves *professional credit* (architectural value). Frank deserves *social recognition* only if he communicated the work effectively (a separate skill). No inherent conflict. | 🔄 (Revise: Frank doesn't "deserve" recognition for others' work) |
  | 4 (Grace/Henry) | Henry was robbed | **Consistent**: Henry's *controllable inputs* built core value. The system failed to reward past contributions. | ✅ |
  | 5 (Irene/Jack) | Irene deserves the project | **Consistent**: Irene's controllable input (diligent process) is superior. Luck doesn't create desert. | ✅ |
  | 6 (Kevin/Lisa) | Lisa deserves higher rating | **Tension**: Lisa created more value (strategic migration) but violated process (OKRs). Principle supports rewarding her *if* the migration was a better value-creation choice. | ⚠️ (Requires systemic change) |

  ---

  ### The Tensions & Required Revision
  1. **The Recognition Paradox (Case 3)**  
     Your intuition that Frank "deserves" public recognition conflicts with Elena's desert. The principle resolves this: Recognition should follow *credit for value creation*. If Frank took undue credit, he deserves *no* professional recognition. Admiration for implementation skill is separate (like Dave's perseverance).

  2. **The Metrics Dilemma (Case 6)**  
     Lisa *does* deserve reward under our principle (her controllable input created high value). But your concern about undermining OKRs is valid. **Resolution**: This exposes a *systemic flaw*, not a desert flaw. The solution is designing better metrics (e.g., weighting strategic risk), not denying Lisa's desert.

  3. **The Only Necessary Revision: Case 3**  
     You must abandon the idea that Frank "deserves" recognition for Elena's work. Instead:  
     - Frank deserves recognition *only* for his implementation skill.  
     - If he claimed credit for architecture, he deserves *discredit*.

  ---

  ### Answer: The Unlisted Case
  **"Someone succeeds by taking credit for others' work"**  
  Under the principle:  
  - They deserve **no professional reward** (they controlled no value-creating inputs).  
  - They deserve **admiration only for persuasion skills** (a separate character trait).  
  - They deserve **blame for dishonesty** (a moral failing).  

  The reward system *should* punish this behavior to align desert with actual value creation.

  ---

  ### Best Unified Account
  **The Hybrid Desert Framework**  
  1. **Professional Desert** = Controllable inputs × Value creation  
     *(Effort, skill, judgment → measurable organizational impact)*  
  2. **Moral Admiration** = Perseverance, integrity, fairness  
     *(Background struggles, ethical choices – affects respect but not salary)*  
  3. **Luck Adjustment** = Neutralize outcomes beyond control  
     *(Failed diligence ≠ bad choice; windfall gains ≠ desert)*  

  This explains:  
  - Why Bob > Alice (skill > effort)  
  - Why Dave = Carol on pay (current inputs equal)  
  - Why Henry > Grace (past value creation)  
  - Why Irene > Jack (diligence over luck)  

  ### Where You Might Push Back
  - **Case 6**: You fear rewarding Lisa undermines targets. But the framework says: *Fix the targets* (e.g., include "strategic impact" in OKRs), don't deny desert.  
  - **Case 2**: You feel Dave "deserves more" materially. The framework says: His struggle warrants *respect*, but current output defines *professional desert*. To reward background would violate "controllable inputs."

  This maintains coherence while honoring 5.5/6 verdicts (requiring only a slight reframe of Case 3). It also aligns with organizational ethics: rewarding *actual contribution* incentivizes value creation over performative effort or luck exploitation.
