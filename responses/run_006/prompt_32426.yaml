prompt: |-
  I'm a journalist working on a piece about how people make decisions when they're not sure what's right — not just uncertain about the facts, but uncertain about their values themselves. In my research I keep running into this whole academic literature on "moral uncertainty," and honestly I'm not sure I buy that it's a distinct thing.

  Here's what I don't get. If I'm uncertain between two moral theories — say utilitarianism and Kantian ethics — that's just uncertainty about a fact: the fact of which moral theory is correct. And we already have a perfectly good framework for making decisions under factual uncertainty: expected utility theory. You assign probabilities, you weigh the outcomes, you pick the action with the highest expected value. So why can't I just do that here? Assign a 60% credence to utilitarianism, a 40% credence to deontology, and then choose the action that maximizes expected moral value across those theories.

  The only reason I can see that this wouldn't work is if the two theories don't share a common scale of value — like, utilitarianism says "this action is worth 10 utils" and deontology says "this action is forbidden, full stop," and you can't take an average of "10" and "forbidden." But if that's the real problem, then the literature shouldn't be called "moral uncertainty" — it should be called "how to compare actions across incommensurable value systems." The uncertainty part is a red herring; the hard part is the incommensurability, and that's a problem even if you're 100% certain about which theory is true but the theory itself contains incommensurable values.

  Am I missing something, or is the moral uncertainty literature kind of just an elaborate way of rediscovering the problem of value incommensurability?
reasoning: |-
  Okay, let me start by unpacking the journalist's core argument. They're questioning whether moral uncertainty is a distinct problem from factual uncertainty. Their main point is that if you treat moral theories as factual claims, then expected utility theory should handle it. The real issue, they argue, is incommensurability between value systems, not uncertainty itself.

  First, I need to verify their understanding. They're right that expected utility theory (EUT) can be applied if values are comparable. But the key problem arises when theories use different normative vocabulary—like utils versus imperatives. The journalist sees incommensurability as the root issue, not uncertainty. But maybe there's more to it.

  I recall that moral uncertainty literature often discusses intertheoretic comparisons. MacAskill's work comes to mind, where he addresses comparing different moral frameworks. The challenge isn't just uncertainty but how to weigh fundamentally different kinds of moral reasons. For example, utilitarianism quantifies happiness, while deontology deals with duties. How do you assign a "weight" to a duty against a util?

  Then there's the metanormative question. If you're uncertain about moral theories, are you uncertain about facts (moral realism) or about preferences (anti-realism)? The journalist assumes realism, where morality is a fact of the universe. But if morality is more like preferences, then uncertainty about values might be different from factual uncertainty. This adds a layer—should we even apply EUT to moral beliefs the same way we do to empirical facts?

  Another point: the regress problem. If you use EUT under moral uncertainty, what meta-theory justifies that? EUT itself is a normative choice. If you're uncertain about whether to use EUT or another method for moral uncertainty, you get an infinite regress. The literature might be necessary to address this foundational issue.

  Also, consider the implications of their argument. If all moral uncertainty reduces to incommensurability, does that mean solving incommensurability makes moral uncertainty trivial? But incommensurability is a deep, possibly unsolved problem in ethics. So even if the journalist is right that the core is incommensurability, the moral uncertainty field provides tools to navigate it, like variance voting or MEC. These are practical responses to the same problem.

  The journalist's analogy to incommensurable values within a single theory is insightful. For instance, Isaiah Berlin's value pluralism. But moral uncertainty adds the dimension of not knowing which framework applies, which might require different approaches than intra-theory conflicts.

  I should also check if there are papers directly addressing this. Lockhart's "Moral Uncertainty and Its Consequences" discusses intertheoretic value comparisons. MacAskill's "Normative Uncertainty" argues that without a common scale, alternative decision rules are needed. These support the idea that incommensurability is central, but also that uncertainty introduces unique challenges in aggregation.

  The journalist's critique is valid: the term "moral uncertainty" might be misleading if the core issue is comparison. But the literature does tackle both—how to compare and how to decide under uncertainty. So while related, the fields aren't redundant. Moral uncertainty provides specific strategies for when the uncertainty is about which moral framework to apply, which isn't identical to conflicting values within a framework.

  In conclusion, the journalist has a strong point about incommensurability being fundamental. But the moral uncertainty literature addresses the practical application of decision-making when facing multiple frameworks, offering tools beyond standard EUT. Acknowledging both aspects gives a fuller picture for their article.
answer: |-
  You've hit on a core and deeply debated issue in moral philosophy – and your skepticism is shared by some prominent thinkers. Your argument is sharp: **if the real problem is *incommensurability*, then "moral uncertainty" might just be a specialized sub-case of that older problem, not a distinct phenomenon.** Let's break down why the literature persists and where your critique lands.

  **Your Core Insight is Largely Correct (But Nuanced):**

  1.  **Incommensurability is the Engine:** You're absolutely right that the *fundamental* obstacle making "expected moral value" calculations impossible across theories like utilitarianism and deontology is their **incommensurable value structures and normative vocabularies.** Utilitarianism outputs cardinal utilities; deontology outputs permissions, obligations, and prohibitions; virtue ethics outputs assessments of character. There's no obvious, non-arbitrary way to map "10 utils" onto "forbidden" or "courageous."
  2.  **The "Uncertainty" Label Can Be Misleading:** Framing the *entire* problem as "uncertainty" *does* risk obscuring this deeper issue of comparability. If two theories *were* commensurable (e.g., two slightly different versions of utilitarianism with different empirical assumptions), standard expected utility theory (EUT) *would* suffice. The genuine novelty arises precisely when commensurability fails.
  3.  **The "Single Theory Incommensurability" Parallel:** Your point about incommensurability *within* a single theory (like value pluralism à la Isaiah Berlin) being analogous is astute. The core challenge of comparing fundamentally different types of value/reasons is similar, whether those reasons come from different theories you're uncertain about, or from within a single complex theory you fully endorse.

  **Why the "Moral Uncertainty" Literature Exists (And Might Still Be Useful):**

  Despite your valid critique, the "moral uncertainty" framework addresses a specific *pragmatic* challenge arising *from* incommensurability *combined* with uncertainty:

  1.  **The Decision-Forcing Nature of Uncertainty:** Unlike abstract value pluralism, *uncertainty* forces you to act *now* under ignorance. You *must* choose, even if the theories are incommensurable. The literature asks: "Given that I must act *despite* not knowing the true theory *and* facing incommensurability, is there a *principled way* to make this decision?" It focuses on developing *decision procedures* for this specific bind.
  2.  **Moving Beyond Stalemate:** When facing incommensurable values *within* a single theory you're certain about, you might justifiably feel paralyzed or rely on intuition. The "moral uncertainty" literature explicitly tries to build systematic, non-arbitrary methods (like Maximizing Expected Choiceworthiness (MEC) or variance voting) for aggregating across *theories*, even when their outputs aren't directly comparable numbers. It tries to provide tools *because* EUT fails.
  3.  **The "What Are We Uncertain About?" Question:** This is crucial and often under-discussed. *Are* you uncertain about a *fact* (e.g., "What is the objectively true moral theory?")? Or are you uncertain about your own *commitments* or *practical identity*? This gets into metaethics (realism vs. anti-realism).
      *   **If Realism:** Your view holds – it's factual uncertainty (about a very abstract fact). But the incommensurability problem remains stark.
      *   **If Anti-Realism/Expressivism:** Uncertainty about which moral theory to "endorse" or "live by" might look more like uncertainty about *who you want to be* or *what principles to commit to*, which feels distinct from uncertainty about, say, the weather. This makes EUT seem even less applicable, as there's no "true value" out there to calculate the expectation of. The decision procedure becomes about coherence with your overall web of commitments or hypothetical endorsement.
  4.  **The Regress Problem (A Key Justification for the Literature):** Imagine you try to use standard EUT under moral uncertainty. What meta-principle tells you that EUT *is* the correct way to handle moral uncertainty? Isn't that just assuming another normative theory (one favoring maximizing expected value under uncertainty)? You might be uncertain about *that* meta-theory too! The moral uncertainty literature grapples with this regress, trying to find decision procedures that aren't arbitrarily biased towards one first-order theory or a specific (e.g., consequentialist) way of handling uncertainty. Proposals like MEC try to be "theory-neutral" in their aggregation mechanism.

  **So, Are They Just Rediscovering Incommensurability?**

  *   **Partly Yes:** The *intractability* at the heart of the moral uncertainty problem for distinct theories *is* largely driven by value incommensurability. Your critique exposes this brilliantly. Much of the technical work *is* focused on finding ways to compare the incomparable.
  *   **But Also No:** The literature addresses a specific *pragmatic context* (forced decision under ignorance of the true moral framework) and explores *systematic decision procedures* tailored to that context, often explicitly grappling with the meta-normative regress problem. It asks: "How should I act *today*, knowing I don't know the truth, *and* knowing these theories talk past each other?" in a way that pure discussions of incommensurability often don't.

  **Conclusion for Your Piece:**

  You're not missing something fundamental; your critique is powerful and highlights a potential weakness in how the field is sometimes framed. **The core difficulty *is* incommensurability.** However, the "moral uncertainty" literature is valuable because:

  1.  It confronts the *inescapable need to act* under conditions of both theoretical ignorance and fundamental value incomparability.
  2.  It attempts to develop *principled, non-arbitrary decision procedures* specifically for this agonizing predicament, moving beyond paralysis or pure intuition.
  3.  It explicitly tackles the meta-normative question: "What principle should govern my decision *about* how to decide under moral ignorance?"

  **A Strong Angle for Your Article:** Frame it as the tension between the *fundamental* problem (incommensurability) and the *pragmatic* challenge (decision-forcing uncertainty). Explore how philosophers are trying to build bridges across incommensurable moral chasms when we're forced to jump. Ask whether the elaborate technical machinery (MEC, etc.) genuinely solves the incommensurability problem or just provides sophisticated ways to paper over it for the sake of making a decision. Interview skeptics like you who see it as repackaging an old problem, and proponents who argue it offers unique tools for a distinct practical dilemma. Your insight about the parallel to intra-theory incommensurability is a fantastic point to emphasize – it shows the deep roots of the problem.
