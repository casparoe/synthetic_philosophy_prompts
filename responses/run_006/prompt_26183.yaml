answer: |-
  Your frustration is deeply understandable, and your intuition that something more significant than a mere preference has been violated is philosophically sound. The core issue revolves around the nature of informal, collaborative human action and the obligations that arise from it, even without formal agreements. Here’s a breakdown of the relevant philosophical concepts and practical implications:

  ### 1. **The Philosophical Foundation: Beyond Contracts**
      *   **Social Ontology & Collective Intentionality:** Philosophers like John Searle and Margaret Gilbert argue that social reality is constructed through shared intentions and commitments. Your garden wasn’t just six individuals gardening side-by-side; it was a *collective project* defined by a shared goal: "We are growing food together." This "we-intention" created a *social fact* – the garden as a community food project – with its own norms and expectations.
      *   **Emergent Norms & Implicit Commitments:** Through repeated collaboration, you developed "constitutive rules" (Searle) for the garden: shared labor, consensus decision-making, and a focus on food production. These weren't arbitrary preferences; they were the very *structure* that defined the shared enterprise. By participating for years, all members implicitly endorsed and committed to these norms.
      *   **The Wrong: Violation of Joint Commitment:** Gilbert’s theory of "joint commitment" is crucial here. By acting together based on a shared goal and established practices, you formed a "plural subject." Unilaterally destroying the shared object (the food-producing garden) without consensus fundamentally violates this commitment. It treats the collective project as mere individual property, ignoring the *relational* obligations created through joint action. The wrong isn't just about vegetables; it's a betrayal of the shared understanding that constituted the group's identity and purpose.

  ### 2. **Why "No Formal Rules" Doesn't Absolve Them**
      *   **The "Rules Exist" Argument:** While unwritten, the norms *did* exist. The rhythm of work, seed buying, watering, and consensus decision-making *were* the rules. Claiming "no rules" ignores the lived reality of how the garden functioned successfully for years. Formalization isn't the only source of obligation; social practice is.
      *   **The Labor Argument Fallacy:** Their claim that equal labor grants absolute individual rights over any part of the plot misunderstands the nature of the project. Labor wasn't invested in *individual plots* owned by each person; it was invested collectively into a *single shared enterprise* defined by its food-growing purpose. Their labor entitled them to a share *within the framework of that enterprise*, not a right to unilaterally repurpose the enterprise itself.
      *   **The "Walk Away" Fallacy:** Suggesting you can simply walk away if unhappy frames this as a purely transactional arrangement. It ignores the relational harm: the destruction of something built together through trust and collaboration. It forces you to abandon the collective project you helped create and sustain.

  ### 3. **Your Legitimate Claims**
  Based on the above, you have strong non-legal but morally/socially legitimate claims:
      *   **The Claim to the Integrity of the Joint Project:** You have a claim that the shared purpose and the norms that sustained it be respected. Unilateral action destroying the core purpose violates this integrity.
      *   **The Claim to Due Process/Consensus:** You have a claim that any fundamental change to the nature or significant portions of the shared resource *must* follow the established (albeit informal) decision-making procedure: conversation aiming for consensus. They bypassed this completely.
      *   **The Claim Against Destruction of Collective Effort:** You have a claim against the destruction of the *collective* asset (the established garden beds, the shared understanding) that your labor helped create, especially since it wasn't failing or causing harm.

  ### 4. **What Follows: Practical Steps Grounded in Philosophy**
  The philosophy provides a framework for action, not an easy solution:
      1.  **Articulate the Shared Project:** Frame the conversation around the *nature of what you built together*. "For years, we all acted based on a shared understanding: this was a collaborative project to grow food. Our routines, decisions, and labor were all oriented around that goal. This wasn't just land; it was our *community food garden*."
      2.  **Highlight the Violation of Commitment:** "What feels wrong isn't just differing preferences about fire pits. By unilaterally destroying the vegetable beds – the core output of our shared goal – without even attempting consensus as we always have, you've broken the implicit commitment we all made to this joint project and to each other as collaborators. You're treating your share as private property within a collective endeavor, which wasn't the agreement."
      3.  **Reject the "No Rules" Argument:** "While we never wrote rules down, we absolutely had rules: we made decisions together by consensus, we focused on growing food, we shared the labor for the common good. Ignoring those rules now because they weren't formalized is disingenuous and ignores how we actually functioned successfully."
      4.  **Propose Solutions Grounded in Legitimacy:**
          *   **Cease & Desist:** Demand they immediately stop destroying existing beds. This is the minimum recognition of the shared nature of the asset.
          *   **Mediated Dialogue:** Propose a facilitated discussion (perhaps with the "indifferent" member or a neutral community figure) focused on:
              *   Acknowledging the shared history and purpose.
              *   Agreeing that major changes *must* follow the consensus process.
              *   Discussing the fire pit idea *as a proposal for the entire group*, evaluating its merits and impact on the garden's core identity.
          *   **Seek Compromise (Carefully):** Could a *much smaller*, mutually agreed-upon social area be integrated *without* destroying half the productive space? Could it be seasonal? Compromise must respect the core purpose and be genuinely consensual.
          *   **Invoke the "Indifferent" Member:** Appeal to her sense of fairness regarding process: "Even if you don't care about vegetables vs. fire pit, do you believe it's fair for two people to unilaterally dismantle half of what we built together over years without even talking to us first?"
      5.  **Consequences (The Hard Part):**
          *   If they refuse dialogue or compromise, your legitimate claim doesn't vanish, but enforcing it becomes practically impossible without legal standing. Your options narrow:
              *   **Withdraw Under Protest:** Make it clear you are leaving because the foundational trust and shared purpose have been destroyed by their unilateral actions, not because you accept their right to do so.
              *   **Document & Publicize:** Share the story within the wider community. While not forcing change, it upholds the principle of your claim and may influence social pressure.
              *   **Accept the Loss:** Continue gardening in the diminished space, but recognize the original collaborative spirit is likely irreparably damaged.

  ### Conclusion
  Your feeling is coherent: the violation is of the *social reality* you collectively created – a reality built on shared intention, emergent norms, and implicit commitments. The obligation they ignore is the obligation inherent in being part of a "we" engaged in a joint project. While you lack legal recourse, you possess significant moral and social legitimacy. Use the language of the shared project, the broken commitment, and the violation of your established (informal) process to challenge their actions and seek a resolution that respects the collective endeavor you all built. The path forward depends on whether the two members can be brought to recognize the deeper obligations inherent in what you created together.
