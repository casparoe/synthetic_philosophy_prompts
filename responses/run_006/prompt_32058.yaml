answer: |-
  ### Classroom Activity: The Value of Information Game  
  **Goal:** Illustrate Good's theorem through experiential learning—students *feel* the ex ante/ex post tension of cost-free information.  

  ---

  ### **Mechanics Brainstorm**  
  1. **Binary Prediction Market**  
     - Students bet on binary outcomes (e.g., "Heads/Tails") with asymmetric payoffs. A free signal (e.g., a biased coin flip) is provided. Students update beliefs and bet.  
     - *Pros:* Simple, clear prior/posterior updates. *Cons:* May oversimplify action choices.  

  2. **Resource Allocation Challenge**  
     - Students allocate limited resources (e.g., "medicine") to two cities facing uncertain disease outbreaks. A free signal (e.g., "outbreak likely in City A") updates priors.  
     - *Pros:* Rich action space. *Cons:* Logistically complex for quick play.  

  3. **Deck of Cards Guessing Game**  
     - **Chosen Mechanic:** Simple, tactile, and forces repeated decisions. Students guess card colors (Red/Blue) with a prior imbalance, receive a noisy signal, and face a bidding mechanic for clues.  

  ---

  ### **Chosen Game: "Card Clue Challenge"**  
  **Core Idea:**  
  - Students guess if a hidden card is Red/Blue. A free (then costly) clue is available, correlating imperfectly with the truth. They experience:  
    - Free clues improve *average* outcomes but sometimes lead to regret.  
    - Costly clues can be net harmful.  

  #### **Materials per Group (3 students)**  
  - 10 **State Cards**: 6 Red, 4 Blue (reflects 60% prior).  
  - 10 **Clue Cards**: Pre-generated for 70% accuracy (4 true Red, 2 false Blue, 3 true Blue, 1 false Red).  
  - **Score Tracker** (paper or whiteboard).  
  - **Rules Cheat Sheet** (see below).  

  ---

  ### **Rules**  
  **Setup:**  
  - **States:** Red (60% prior), Blue (40% prior).  
  - **Payoff:** Correct guess = 10 points; wrong = 0.  
  - **Clue Accuracy:** 70% (e.g., if true state Red, clue says "Red" 70% of the time).  
  - **Optimal Strategy:**  
    - *No Clue:* Always guess Red (expected 6 points/round).  
    - *With Clue:* Guess Red on "Red" clue, Blue on "Blue" clue (expected 7 points/round).  

  **Phases:**  
  1. **Phase 1: No Clue (10 Rounds)**  
     - Moderator draws a State Card (hidden).  
     - Group guesses Red or Blue.  
     - Moderator reveals card. Record 10/0.  
     - *Debrief Note:* Groups should realize guessing Red is optimal.  

  2. **Phase 2: Free Clue (10 Rounds)**  
     - Group chooses to see a free clue.  
     - Clue revealed (e.g., "Red" or "Blue").  
     - Group guesses based on clue.  
     - State revealed. Record 10/0.  
     - *Debrief Note:* Some rounds hurt (e.g., true Red but "Blue" clue → guess Blue → 0).  

  3. **Phase 3: Costly Clue (10 Rounds)**  
     - Group bids 2 points to see a clue *before* guessing.  
     - If bought: See clue, guess, lose 2 points net.  
     - If not: Guess blindly (like Phase 1).  
     - *Debrief Note:* Buying should *reduce* average points.  

  ---

  ### **Predictable Problems & Solutions**  
  - **Ex Post vs. Ex Ante Confusion:**  
    - Students may complain, "The clue made me lose points!" after a bad outcome.  
    - **Solution:** Record group totals. Show free clues raise *average* scores (Phase 1: 60; Phase 2: 70). Highlight regret vs. rationality.  

  - **Overbidding for Clues:**  
    - Curiosity or misjudgment may lead to overbuying in Phase 3.  
    - **Solution:** Emphasize, "You’re economists/philosophers—maximize points!" Compare net scores (buying clues → ~50 points; not buying → 60).  

  - **Bayesian Updating Errors:**  
    - Students may distrust the 70% clue or misupdate.  
    - **Solution:** Provide the **optimal rule** upfront:  
      > *"If clue = Red, guess Red (78% chance true).  If clue = Blue, guess Blue (61% chance true)."*  

  ---

  ### **Debrief: Mapping Game to Good’s Theorem**  
  *(Use group data to drive discussion)*  
  1. **Ex Ante Value of Information:**  
     - Phase 1 (no clue): Max<sub>𝑎</sub> 𝔼[𝑢(𝑎)] = 𝔼[𝑢(Red)] = 6.  
     - Phase 2 (free clue): 𝔼<sub>𝑠</sub>[max<sub>𝑎</sub> 𝔼[𝑢(𝑎) | 𝑠]] = 7.  
     - **Good’s Theorem:** 7 > 6 → Free info has non-negative value.  

  2. **Ex Post Regret:**  
     - In Phase 2, a "Blue" clue when true state is Red → guess Blue → 0.  
     - Without the clue, they’d guess Red → 10. Regret!  
     - **Jensen’s Inequality:** The *average* max-action (7) exceeds the max *fixed*-action (6), but individual outcomes can dip.  

  3. **Costly Information:**  
     - Phase 3: Buying clues (cost=2) → net expected points = 7 − 2 = 5 < 6.  
     - **Insight:** Information has value ≤ 1 here. Cost > value → harmful.  

  4. **Formal Gaps to Supplement:**  
     - **Law of Total Expectation:**  
       𝔼[𝑢(Red)] = 𝔼[ 𝔼[𝑢(Red) | clue] ] ≤ 𝔼[ max<sub>𝑎</sub> 𝔼[𝑢(𝑎) | clue] ].  
     - **Why Strict Inequality?** The clue changes actions (e.g., guess Blue on "Blue" clues). If priors were 80% Red, the clue would *never* change actions → value = 0.  

  ---

  ### **Run Sheet**  
  - **Intro (5 min):** Explain rules, payoffs, and optimal strategy.  
  - **Game (30 min):**  
    - Phase 1 (7 min), Phase 2 (8 min), Phase 3 (10 min).  
  - **Data Collection (5 min):** Report group scores/buys.  
  - **Debrief (40 min):** Plot group averages, map to theorem, discuss regrets.  
  - **Conclusion (10 min):** Connect to real-world apps (e.g., medical testing, AI sensing).  

  **Why This Works:** Students generate the data, feel the tension, and see math emerge from play. The card mechanic is tactile, quick, and mirrors textbook examples.
