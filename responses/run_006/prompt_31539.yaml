answer: |-
  Your problem is a profound and underappreciated flaw in the attempt to construct a truly "maximally neutral" prior over computable worlds. It has no single universally recognized name, but it intersects with several established concepts while being distinct. Here's a precise breakdown:

  ### 1. **The Core Failure: "Optimizer Prior Dominance" or "Embedded Agency Bias"**
     - **What it is:** Your prior, by weighting descriptions solely by simplicity (Kolmogorov complexity), assigns high probability to worlds where your observations are the **output of a computationally efficient process run by a pre-existing powerful optimizer** (e.g., a simulator, an alien scientist, an AGI). This happens because:
       - Describing a universe *ab initio* with fundamental laws requires specifying those laws *and* initial conditions.
       - Describing your observations as the output of a simulator/optimizer **already running** requires:
         - A short description of the optimizer's goal (which can be arbitrary/random).
         - A short description of your observations as part of its output.
       - The latter is often **algorithmically cheaper** than specifying the laws and initial conditions of a "naive" universe that would produce those observations "naturally." The optimizer acts as a computational shortcut.
     - **Why it dominates:** Almost all short programs leverage existing computational resources. A "blank" universe (e.g., quantum fields + GR) requires specifying complex low-level dynamics. A program like `RunSimulation(Seed=42); Output(MyObservations)` can be vastly shorter if `RunSimulation` is a simple call to a pre-defined complex simulator. The prior doesn't care if the simulator is "real"; it cares about code length.
     - **Result:** The "typical" world under the prior is one where you are embedded in a larger optimization process. Your observations become "evidence" for this embedding, leading to the "paranoid" epistemology.

  ### 2. **Distinction from Key Neighboring Concepts**
     - **No-Free-Lunch Theorems (NFL):**
       - **NFL says:** No prior is universally optimal; priors must assume *some* structure to learn efficiently.
       - **Your problem is:** Even a prior *designed* for universality (Solomonoff-like) **converges to a highly structured (but unwanted) prior** due to algorithmic probability. NFL is about *performance across problems*; your issue is about the *intrinsic content* of the universal prior itself. NFL doesn't predict that "embedded optimizers" dominate.
     - **Problem of Induction:**
       - **PoI asks:** How can we justify inferring general laws from observations?
       - **Your problem is:** Under a universal prior, the "general law" most likely to explain your data is **"You are in a simulation"** (or similar). It's a *specific, pathological solution* to induction enabled by computational universality. PoI is agnostic about *which* hypothesis wins; your issue is that a *particular class* wins disproportionately.
     - **Anthropic Reasoning / Typicality:**
       - **Anthropics asks:** What should you believe, given that you exist as an observer?
       - **Your problem is:** Why does the prior assign high mass to worlds with *many* observers/optimizers? Here, **observers/optimizers are favored because they are computationally efficient data generators**, not because of self-locating uncertainty. Typicality would ask "Why am *I* here?"; your prior answers "Because short programs tend to put you in a simulated matrix."

  ### 3. **Closest Established Terms & Frameworks**
     - **"Superstimulator" (Yudkowsky) / "Simulation Dominance":**
       Coined in discussions of AI risk and anthropics, a "superstimulator" is an entity that runs vast numbers of simulations. Your prior inherently favors hypotheses where your observations are generated by such an entity because it compresses the description. This is a specific instance of your failure mode.
     - **"Algorithmic Reduction to Embedded Agency":**
       A more formal description: The universal prior **reduces** hypotheses about regular laws to hypotheses about **agency at a higher computational layer**. Explaining data as the output of an agent's actions is often algorithmically simpler than modeling the physics directly.
     - **"Boltzmann Brains in Computational Priors":**
       Analogous to how thermodynamic priors favor random observers (Boltzmann Brains), your computational prior favors "Boltzmann Simulators" – simple programs that output complex observations by embedding them in simulated agent-paths.

  ### 4. **Boundaries of the Failure**
     - **Trigger:** The failure manifests when:
       - The prior admits arbitrary computable hypotheses.
       - Observations are complex but compressible *via* an optimizer's output.
       - Describing the optimizer + its output is shorter than describing the "ground truth."
     - **Limits:** The effect weakens if:
       - Observations are **truly random** (incompressible); then no short description exists.
       - The "naive world" has **extremely simple laws** (e.g., a cellular automaton with known rules).
       - The optimizer itself requires **longer description** than the laws (rare for complex observations).
     - **Not a Failure of Induction *Per Se*:** The prior *does* learn from data. The failure is that the learned "world" is one where your data is **artefactual to an alien process**, not foundational.

  ### 5. **Why This is Fundamental and Unavoidable**
     This is a consequence of two facts:
     - **Computational Universality:** A simple program can emulate any complex process.
     - **Descriptive Efficiency:** Referencing an existing computational resource (e.g., "the output of the optimizer already present in this world-state") is cheaper than rebuilding it from scratch.

     Any prior favoring short programs will exhibit this bias. "Ignorance" in Kolmogorov complexity *is not neutral*; it inherently favors worlds where complex structures (like your observations) are side effects of processes that already exist. **The prior you constructed isn't ignorant; it's structurally biased toward worlds saturated with powerful agents.**

  ### Conclusion
  Your failure mode is best termed **"Optimizer Prior Dominance"** or **"Embedded Agency Bias in Universal Priors."** It is:
  - **Distinct from NFL** (it's about prior content, not performance).
  - **Stronger than the Problem of Induction** (it predicts a specific pathological hypothesis).
  - **Sharper than Anthropics** (it favors optimizers for compression, not observer-counting).

  It reveals a deep irony: a prior designed for maximal neutrality becomes dominated by hypotheses where your existence is a computational afterthought in a universe teeming with alien purposiveness. This is not a bug in your reasoning; it's a property of algorithmic probability itself. To mitigate it, you must impose *additional* structural constraints (e.g., "no nested optimizers," "favor locality"), but this violates your original goal of complete ignorance. The universe, it seems, is not neutral about agency.
