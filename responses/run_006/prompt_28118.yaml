prompt: |-
  Okay so I just spent like three hours arguing with a friend about whether rational people with the same evidence have to end up agreeing, and we kept going in circles about the common prior assumption in Aumann's agreement theorem. I'm a Bayesian who thinks the common prior assumption is basicaly just a regulative ideal — like, if you and I both update rationally on all the same stuff, any remaining disagreement has to trace back to different priors, and those priors themselves should be justifiable by something. My friend thinks that's way too strong: she says priors can differ for perfectly good reasons (different inductive biases, different ways of carving up hypothesis space, whatever) and that the common prior assumption is just a modeling convenience that nobody should take as a normative claim about real agents.

  We realized we were talking past each other on a bunch of sub-questions and neither of us could quite state the other's view in a way the other would endorse. So we want to do a proper adversarial collaboration.

  Draft the joint statement we would produce. I want:

  1. **Agreed Claims** (maybe 400–500 words): numbered claims both sides can sign. These should include what Aumann's theorem actually says and doesn't say, what "common prior" means operationally, what the theorem rules out and what it leaves open, and any points about real-world disagreement that both camps accept.

  2. **Disagreements Table** (maybe 300–400 words): a table with rows for each point of disagreement. For each row, give the neutral statement of the question, then the common-priorian answer and the non-common-priorian answer, each phrased so its own side would say "yeah, that's what I think."

  3. **Cruxes** (maybe 300 words): the sub-questions where if we could settle them, at least one side would change its mind. Don't just list topics — explain why each is a crux.

  4. **Tests and Predictions** (maybe 300 words): for each crux, describe a concrete argument, case, or (if possible) empirical result that both sides agree bears on it, and record what each side predicts. Be honest if some cruxes don't have agreed-upon tests.

  Also: at the end, add a short note saying how confident you are in your characterizations of both positions and which part of the joint statement you're least sure about. If you think some of the disagreement might be verbal rather than substantive, say so and say where.
