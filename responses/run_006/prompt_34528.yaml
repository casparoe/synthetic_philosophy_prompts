      - If he is at the second exit (prob 1/2), then continuing leads to the payoff 1.

    Therefore, the expected payoff of continuing is 1.

    The expected payoff of exiting is 2 (as above). Since 2 > 1, the driver would prefer to exit. But if he exits, he gets 0 if at the first or 4 if at the second. On average 2, which is better than the 1 from continuing. Therefore, the driver at an exit would want to exit. But the strategy of always continuing (p=0) would have him continue. So the strategy is not self-enforcing: at the exit, he would rather exit.

    Sarah's point is that the strategy of always continuing is not self-enforcing because, when at an exit, the driver would prefer to exit.

