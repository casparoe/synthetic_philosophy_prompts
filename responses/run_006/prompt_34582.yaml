prompt: |-
  I've followed the LessWrong and alignment discussions of Goodhart's law and specification gaming for years, and I keep running into a translation problem: I understand the examples, but I don't have a usable procedure for deciding when a given metric is safe to adopt or keep as a target. I manage a team at a large online marketplace, and every quarter we set targets for things like seller response time, customer satisfaction scores, and content quality; typically we discover only after the fact that a metric has been gamed into meaninglessness. Please write a decision procedure we can run, in under an hour per metric, without the operator knowing the underlying theory, and with final sign-off by our head of analytics rather than the team that owns the metric. It should specify the questions to ask in order, what counts as a sufficient answer at each step, where the procedure returns "do not target this metric" versus "acceptable with monitoring," and where it must escalate to a human judgment call rather than pretending the checklist decides. Ground the steps in what is actually known about Goodhart-style failure and specification gaming, but keep the theory in the rationale and put the usable steps up front. Then apply the procedure to three cases: a seller response-time metric we are considering tying to search ranking; an established customer satisfaction score that already determines bonuses; and a newly proposed AI-generated content quality metric for an internal tool. Include at least one case where the procedure gives an answer my team will not like, and close with a short account of the failure modes the procedure cannot catch.
reasoning: |-
  We are creating a decision procedure to evaluate metrics for potential Goodhart's law and specification gaming risks. The procedure is designed to be run in under an hour per metric by someone without deep theoretical knowledge, with final sign-off by the head of analytics.

  The procedure will have the following steps:

  1. **Define the Metric and its Use**: Clearly define the metric and how it will be used (e.g., as a target, for ranking, for bonuses). Also, define the intended goal (the real-world outcome we care about).
  2. **Identify Known Distortions**: List any known ways the metric could be gamed or might not reflect the goal, based on past experience or common sense.
  3. **Assess the Metric's Sensitivity to Manipulation**: How easy is it to manipulate the metric without improving the goal? Consider direct and indirect methods.
  4. **Check for Correlates and Substitution**: What are the known or potential substitutes for the goal that the metric might pick up? How strong is the correlation between the metric and the goal in practice?
  5. **Evaluate the Measurement Process**: How is the metric collected? Are there known biases or limitations in the data collection?
  6. **Simulate Agent Responses**: Consider how rational agents (e.g., sellers, employees) might respond to the metric being incentivized. What unintended actions might they take?
  7. **Review Historical Data and A/B Tests**: If available, look at historical data or A/B tests to see if the metric has been stable and correlated with the goal. If not, note the lack of evidence.
  8. **Make a Decision**: Based on the above, decide one of:
     - **Green**: Safe to use as a target (with monitoring).
     - **Yellow**: Acceptable with monitoring and specific safeguards (escalate to human judgment for what safeguards).
     - **Red**: Do not use as a target; find an alternative.

  The procedure must escalate to human judgment in steps where there is insufficient information or when the answers are ambiguous.

  Now, we'll write the procedure in a checklist form.

  ---

  **Decision Procedure for Metric Evaluation**

  **Operator Instructions**: Answer each question in order. If a question cannot be answered with certainty, note the uncertainty and proceed. The goal is to identify risks of Goodhart's law (when a measure becomes a target, it ceases to be a good measure) and specification gaming (optimizing a metric in ways that undermine the intended goal).

  **Step 1: Define the Metric and its Use**
     - **Question 1.1**: What is the exact definition of the metric? (Include formula, data sources, and calculation method.)
     - **Question 1.2**: How will this metric be used? (e.g., target for bonuses, ranking, threshold for rewards, etc.)
     - **Question 1.3**: What is the intended goal (the real-world outcome) that this metric is supposed to capture?
     - **Sufficient Answer**: Clear, unambiguous definitions for the metric and the goal. The connection between the metric and the goal must be stated.
     - **Escalate If**: The goal is vague or the metric's connection to the goal is unclear (escalate to head of analytics for clarification).

  **Step 2: Identify Known Distortions**
     - **Question 2.1**: Based on past experience (in this company or industry), what are the known ways that similar metrics have been gamed or led to unintended consequences?
     - **Question 2.2**: Are there any obvious loopholes in the definition of this metric that could be exploited?
     - **Sufficient Answer**: A list of at least two potential distortions or one known historical example. If none, state that.
     - **Escalate If**: No historical data is available and the operator cannot think of any potential distortions (escalate to head of analytics for a broader review).

  **Step 3: Assess the Metric's Sensitivity to Manipulation**
     - **Question 3.1**: How easy is it to increase the metric without improving the intended goal? (Consider: direct manipulation, indirect methods, cost of manipulation.)
     - **Question 3.2**: Are there any parties (e.g., sellers, employees) who have both the incentive and the ability to manipulate the metric? How?
     - **Sufficient Answer**: A qualitative assessment (e.g., "very easy", "moderate", "hard") with at least one example of how manipulation might occur.
     - **Escalate If**: The manipulation risk is unclear or the operator cannot assess it (escalate to head of analytics for expert input).

  **Step 4: Check for Correlates and Substitution**
     - **Question 4.1**: What are the known correlates (other metrics or factors) that this metric might be picking up instead of the intended goal? (e.g., a customer satisfaction score might be influenced by factors unrelated to the actual experience, like survey timing.)
     - **Question 4.2**: How strong is the evidence that the metric correlates with the intended goal? (e.g., from past data, experiments, or theory)
     - **Sufficient Answer**: List at least two potential correlates that are not the goal. Also, state the strength of correlation (weak, moderate, strong) and the evidence for it.
     - **Escalate If**: There is no evidence of correlation and the connection is purely theoretical (escalate to head of analytics to decide if correlation testing is needed).

  **Step 5: Evaluate the Measurement Process**
     - **Question 5.1**: How is the metric collected? (e.g., automated system, self-reported, customer surveys, third-party data)
     - **Question 5.2**: What are the known limitations or biases in the data collection? (e.g., sampling bias, reporting bias, measurement error)
     - **Sufficient Answer**: A description of the measurement process and at least one potential bias or limitation.
     - **Escalate If**: The measurement process is complex and the operator cannot identify potential biases (escalate to data team for review).

  **Step 6: Simulate Agent Responses**
     - **Question 6.1**: If this metric becomes a target, how might rational agents (e.g., sellers, employees, customers) change their behavior to optimize for the metric? List at least two potential unintended responses.
     - **Question 6.2**: How might these behavioral changes harm the intended goal or other important goals?
     - **Sufficient Answer**: At least two plausible unintended responses and one potential harm.
     - **Escalate If**: The operator cannot think of any unintended responses (escalate to a team brainstorming session).

  **Step 7: Review Historical Data and A/B Tests (if available)**
     - **Question 7.1**: Is there historical data or A/B test results that show how the metric responds to interventions? If so, does it show that improving the metric leads to improvements in the intended goal?
     - **Question 7.2**: Are there instances in the past where the metric was gamed? If so, what happened?
     - **Sufficient Answer**: A summary of the historical evidence, including the presence or absence of gaming.
     - **Escalate If**: No historical data is available and the metric is new (proceed to Step 8 with a note of uncertainty).

  **Step 8: Make a Decision**
     - **Decision Rules**:
       - **Red (Do not use as target)**: If any of the following are true:
          - There is a known history of severe gaming of this metric (Step 2 or 7).
          - The metric is very easy to manipulate without improving the goal (Step 3: "very easy").
          - The correlation with the goal is weak and there is high risk of substitution (Step 4: weak correlation and multiple strong correlates not aligned with the goal).
          - The measurement process is highly biased or unreliable (Step 5: major limitations).
          - The simulation of agent responses reveals severe unintended consequences that would harm the goal (Step 6).
       - **Yellow (Acceptable with monitoring and safeguards)**: If there are moderate risks (e.g., some manipulation is possible but hard, or weak evidence of correlation, or minor unintended consequences) and no red flags. Also, if the metric is important and there is no better alternative, but risks must be actively managed.
       - **Green (Safe to use)**: Only if:
          - There are no known historical issues (Step 2 and 7 clear).
          - Manipulation is hard or very costly (Step 3: "hard").
          - Strong correlation with the goal and minimal substitution risk (Step 4: strong correlation and few weak correlates).
          - Measurement is reliable (Step 5: minor limitations).
          - Unintended consequences are minimal and manageable (Step 6).
          - Historical data supports the link to the goal (Step 7, if available).

     - **Note**: If there is any uncertainty that cannot be resolved by the operator and the step was escalated, then the decision must be made by the head of analytics (with input from experts if needed) and cannot be automated by this checklist.

  ---

  **Applying the Procedure to Three Cases**

  **Case 1: Seller Response-Time Metric (to be tied to search ranking)**

  - **Step 1**:
    - 1.1: Metric = Average time (in hours) for a seller to respond to a customer inquiry. Data source: timestamps from the messaging system.
    - 1.2: Use: Tie to search ranking (sellers with faster response times get higher visibility).
    - 1.3: Intended goal: Improve customer experience by ensuring quick responses, leading to higher customer satisfaction and retention.
    - *Sufficient? Yes.*

  - **Step 2**:
    - 2.1: Known distortions: Sellers might send quick but unhelpful responses (e.g., "I'll get back to you") to game the metric. Also, they might avoid complex inquiries or use auto-replies.
    - 2.2: Loopholes: The metric only measures time to first response, not quality or resolution.
    - *Sufficient? Yes.*

  - **Step 3**:
    - 3.1: Very easy to manipulate: Sellers can send a quick acknowledgment and then take their time for a real response.
    - 3.2: Sellers have a strong incentive (higher visibility) and the ability to do this.
    - *Sufficient? Yes. Assessment: "very easy".*

  - **Step 4**:
    - 4.1: Correlates: The metric might be substituted by the number of quick but meaningless responses. It may not correlate with actual problem resolution or customer satisfaction.
    - 4.2: Evidence: We have data showing that quick responses do not always lead to higher customer satisfaction if the issue isn't resolved. Correlation is moderate at best.
    - *Sufficient? Yes. Strength: moderate, but with caveats.*

  - **Step 5**:
    - 5.1: Collected automatically from the messaging system (timestamps).
    - 5.2: Limitation: Does not capture the content of the response. Also, if a seller uses multiple accounts or automation tools, it might not be detected.
    - *Sufficient? Yes.*

  - **Step 6**:
    - 6.1: Unintended responses: 
        - Sellers send automated or template responses quickly but without personalization.
        - Sellers might discourage customers from sending messages (e.g., by directing them to call, which isn't tracked).
    - 6.2: Harm: Customer experience might degrade due to unhelpful responses or avoidance of messaging. Also, sellers might become less responsive to complex issues.
    - *Sufficient? Yes.*

  - **Step 7**:
    - 7.1: Historical data: In a previous test, we found that when we emphasized response time, the average time dropped but customer complaints about unhelpful responses increased.
    - 7.2: Past gaming: Yes, we found sellers using auto-replies and then taking days to follow up.
    - *Sufficient? Yes.*

  - **Step 8**: 
    - **Decision**: Red (Do not use as target). 
    - **Why**: Multiple red flags: very easy to manipulate, known history of gaming, and unintended consequences that harm the goal.

  **Case 2: Established Customer Satisfaction Score (CSAT) that determines bonuses**

  - **Step 1**:
    - 1.1: Metric = Average score from a post-transaction survey (1-5 scale) asking "How satisfied were you with your experience?".
    - 1.2: Use: Determines bonuses for customer service teams.
    - 1.3: Goal: Improve overall customer satisfaction and loyalty.
    - *Sufficient? Yes.*

  - **Step 2**:
    - 2.1: Known distortions: Agents might try to influence the survey by asking for positive scores, or only satisfied customers might respond (non-response bias). Also, agents might focus on easy issues to get quick positive scores.
    - 2.2: Loopholes: The survey is optional, so agents can selectively prompt customers they think are happy.
    - *Sufficient? Yes.*

  - **Step 3**:
    - 3.1: Moderate ease of manipulation: Agents can directly ask for high scores or even manipulate the survey distribution (if they have control over when it's sent). However, it's harder to fake the actual experience.
    - 3.2: Agents have a strong incentive (bonuses) and they interact directly with customers.
    - *Sufficient? Yes. Assessment: "moderate".*

  - **Step 4**:
    - 4.1: Correlates: The score might be influenced by the agent's likeability or the customer's mood, not just the service quality. Also, the timing of the survey (immediately after vs. later) can affect scores.
    - 4.2: Evidence: Strong correlation between CSAT and customer retention in aggregate, but at the individual agent level, there is noise and potential for manipulation.
    - *Sufficient? Yes. Strength: strong in aggregate, weak at the individual level for bonuses?*

  - **Step 5**:
    - 5.1: Collected via email survey sent after each transaction.
    - 5.2: Limitations: Low response rate (10-15%), which might not be representative. Also, customers with extreme experiences are more likely to respond.
    - *Sufficient? Yes.*

  - **Step 6**:
    - 6.1: Unintended responses:
        - Agents might beg for high scores ("If you give me a 5, I get a bonus").
        - Agents might avoid difficult customers or transfer them to avoid a bad survey.
    - 6.2: Harm: Customer experience for complex issues might degrade, and the survey scores become less meaningful due to manipulation. Also, employee morale might suffer if they feel pressured to game the system.
    - *Sufficient? Yes.*

  - **Step 7**:
    - 7.1: Historical data: We've seen CSAT scores rise since tying to bonuses, but we also saw an increase in complaints about agents begging for scores. Also, A/B tests showed that when we stopped tying bonuses, scores dropped but the correlation with customer retention remained.
    - 7.2: Past gaming: Yes, we've had to discipline agents for explicitly asking for high scores.
    - *Sufficient? Yes.*

  - **Step 8**:
    - **Decision**: Yellow (Acceptable with monitoring and safeguards).
    - **Why**: There is evidence of manipulation and unintended consequences, but the metric is strongly correlated with the goal in aggregate. We must implement safeguards (e.g., monitoring for survey tampering, using a combination of metrics, and auditing).

  **Case 3: Newly Proposed AI-Generated Content Quality Metric for an Internal Tool**

  - **Step 1**:
    - 1.1: Metric = A composite score from an AI model that evaluates generated content (e.g., product descriptions) on grammar, relevance, and engagement. The AI model is trained on human ratings.
    - 1.2: Use: To automatically approve AI-generated content for publication without human review.
    - 1.3: Goal: Ensure high-quality, relevant, and engaging content that improves user experience and conversion.
    - *Sufficient? Yes.*

  - **Step 2**:
    - 2.1: Known distortions: The AI model might be gamed by the content generator (adversarial examples). Also, the training data for the AI might not capture all aspects of quality (e.g., factual accuracy).
    - 2.2: Loopholes: The metric is based on an AI model that might have blind spots. Also, the generator could optimize for the metric without improving real quality.
    - *Sufficient? Yes.*

  - **Step 3**:
    - 3.1: Very easy to manipulate: The AI model is fixed (until retrained), so the generator can learn to produce content that fools the model (e.g., using keywords that boost the score without improving quality).
    - 3.2: The AI generator (being an AI) is designed to optimize for the metric and has the ability to exploit the model.
    - *Sufficient? Yes. Assessment: "very easy".*

  - **Step 4**:
    - 4.1: Correlates: The metric might focus on surface features (grammar, certain keywords) and miss deeper issues (factual errors, misleading claims). It might also be sensitive to the training data distribution.
    - 4.2: Evidence: During development, the AI model had high correlation with human ratings on the training set, but we don't know how it will generalize to new, possibly adversarial, content.
    - *Sufficient? Yes. Strength: strong on training data, unknown in production with adversarial actors.*

  - **Step 5**:
    - 5.1: Collected by running the generated content through the AI model.
    - 5.2: Limitations: The model may not be robust to adversarial inputs. Also, it may not capture all dimensions of quality (e.g., it wasn't trained on factual accuracy).
    - *Sufficient? Yes.*

  - **Step 6**:
    - 6.1: Unintended responses:
        - The AI generator produces content that is grammatically perfect and uses keywords that the quality model likes, but is factually incorrect or irrelevant.
        - The generator might produce very long content to hit engagement markers, leading to verbosity.
    - 6.2: Harm: The content quality in the eyes of users might drop, leading to mistrust or reduced conversion. Also, if the content is factually wrong, it could lead to legal issues.
    - *Sufficient? Yes.*

  - **Step 7**:
    - 7.1: Historical data: None, since it's new.
    - 7.2: Past gaming: None for this specific metric, but we know from other AI systems that adversarial gaming is common.
    - *Sufficient? Yes (but note: lack of historical data).*

  - **Step 8**:
    - **Decision**: Red (Do not use as the sole target for automatic approval). 
    - **Why**: Very easy to manipulate, high risk of adversarial gaming, and no historical data to prove robustness. We should not fully automate without human oversight.

  **One Case the Team Won't Like**: The team proposing the AI-generated content metric will likely be disappointed by the red light. They want to automate content approval to save time and costs, but the procedure shows it's too risky.

  ---

  **Failure Modes the Procedure Cannot Catch**

  1. **Emergent Gaming**: New, unexpected ways of gaming that were not anticipated in the simulation step.
  2. **External Shocks**: Changes in the environment (e.g., market conditions, new regulations) that alter the relationship between the metric and the goal.
  3. **Multi-Agent Collusion**: If multiple agents collude to game the system in a way that wasn't considered.
  4. **Long-Term Effects**: Some distortions only appear after a long time (e.g., degradation of customer trust gradually).
  5. **Complex System Effects**: In complex systems, optimizing one metric might harm another critical one, even if the intended goal is partially achieved.

  Therefore, even after passing the procedure, metrics should be continuously monitored and reassessed periodically.
answer: |-
  Below is a step-by-step decision procedure for evaluating metrics against Goodhart's law and specification gaming risks. The procedure is designed for **non-experts** to complete in **under 60 minutes per metric**, with **escalation points** for ambiguous cases. Final sign-off rests with your Head of Analytics.  

  **Key Rationale (Background for Head of Analytics, Not Operators):**  
  Goodhart failures occur when optimizing a metric distorts the underlying goal. Causes include:  
  - **Tunnel Vision:** Agents maximize the metric by neglecting unmeasured factors.  
  - **Misalignment:** The metric correlates poorly with the true goal in practice.  
  - **Gaming:** Agents exploit loopholes to inflate the metric artificially.  
  The procedure tests for these via known risk patterns (e.g., direct manipulability, poor correlation evidence, incentive conflicts).  

  ---

  ### **Metric Evaluation Procedure**  
  *Operator Instructions:* Answer each question in order. Use internal data, logs, or quick team discussions. If a question cannot be answered definitively, escalate to the Head of Analytics. Total time: ≤60 min/metric.  

  #### **Step 1: Define Metric and Goal**  
  - **Question 1.1:** What is the **exact formula** of the metric? (E.g., "Seller response time = time from buyer message to first seller reply.")  
  - **Question 1.2:** What is the **true goal** this metric represents? (E.g., "Buyers get quick, helpful answers.")  
  - **Sufficient Answer:** Both 1.1 and 1.2 are clear, specific, and written down.  
  - **Escalate If:** Goal is vague (e.g., "improve user experience").  

  #### **Step 2: Assess Manipulability**  
  - **Question 2.1:** Can agents (e.g., sellers, employees) inflate this metric **without improving the true goal**? List 1–2 methods. (E.g., "Sellers send low-effort 'I’ll check' replies to hit response time.")  
  - **Question 2.2:** How **costly/difficult** is manipulation? (Easy = low skill/no resources; Hard = requires expertise/risk.)  
  - **Sufficient Answer:** At least one manipulation method identified. Difficulty rated as Easy/Medium/Hard.  
  - **Escalate If:** No manipulation methods found (indicates oversight).  
  - **Decision Path:**  
    - If **Easy**: Proceed to Step 3 (high risk).  
    - If **Medium/Hard**: Proceed to Step 4.  

  #### **Step 3: Test for Tunnel Vision**  
  - **Question 3.1:** If agents maximize this metric, what **important unmeasured factors** might they neglect? (E.g., "Sellers neglect response quality or complex issues.")  
  - **Question 3.2:** Could this cause **collateral damage**? (E.g., "Buyer frustration rises due to canned responses.")  
  - **Sufficient Answer:** 1–2 plausible unmeasured factors and risks identified.  
  - **Escalate If:** No unmeasured factors found.  
  - **Decision Path:**  
    - If unmeasured factors **directly undermine the true goal**: Metric is **High Risk**.  
    - Else: Proceed to Step 4.  

  #### **Step 4: Check Correlation Evidence**  
  - **Question 4.1:** What **data proves** this metric correlates with the true goal? (E.g., "A/B tests show faster response time → higher satisfaction.")  
  - **Question 4.2:** Is the correlation **stable** across contexts? (E.g., "Holds for all seller sizes? During peak sales?")  
  - **Sufficient Answer:** Evidence from controlled tests (A/B tests, RCTs) or longitudinal studies.  
  - **Escalate If:** Evidence is anecdotal, outdated, or absent.  
  - **Decision Path:**  
    - **Strong evidence**: Proceed to Step 5.  
    - **Weak/No evidence**: Metric is **High Risk**.  

  #### **Step 5: Incentive Conflict Scan**  
  - **Question 5.1:** Could agents’ **incentives** (e.g., bonuses, rankings) conflict with the true goal? (E.g., "Sellers prioritize fast replies over resolving issues.")  
  - **Question 5.2:** Are there **conflicting metrics** in the system? (E.g., "CSAT rewards satisfaction, but response time rewards speed.")  
  - **Sufficient Answer:** 1–2 conflicts identified or confirmed absent.  
  - **Escalate If:** Incentives are complex or multi-team (e.g., inter-departmental conflicts).  
  - **Decision Path:**  
    - If conflicts **undermine the goal**: Metric is **High Risk**.  
    - Else: Proceed to Step 6.  

  #### **Step 6: Stress-Test with History**  
  - **Question 6.1:** Has this metric (or similar) been **gamed before**? Describe how.  
  - **Question 6.2:** What **safeguards** exist? (E.g., "Audits detect spam replies.")  
  - **Sufficient Answer:** Historical examples or safeguards documented.  
  - **Escalate If:** No history/safeguards but metric is high-stakes (e.g., affects pay).  
  - **Decision Path:**  
    - If **gaming occurred and wasn’t fixed**: Metric is **High Risk**.  
    - Else: Proceed to Final Decision.  

  #### **Final Decision**  
  - **Green (Safe)**: Passes all steps with no High Risk flags.  
  - **Yellow (Monitor)**: Medium risk (e.g., weak correlation in Step 4 or Medium manipulability in Step 2). Requires **quarterly reviews** for drift.  
  - **Red (Unsafe)**: One or more High Risk flags (e.g., Easy manipulability + no safeguards).  
  - **Head of Analytics Sign-off Required:** For all Yellow/Red metrics and escalated questions.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Seller Response-Time Metric (Proposed for search ranking)**  
  - **Step 1:** Metric = "Time to first reply (hours)." Goal = "Buyers get quick, helpful answers."  
  - **Step 2:** **Easy** to manipulate (e.g., sellers send "I’ll check" replies).  
  - **Step 3:** Tunnel vision on speed neglects **quality/resolution**. Collateral damage: Buyers get frustrated.  
  - **Step 4:** Weak evidence. Speed ≠ helpfulness (data shows 40% of fast replies are low-quality).  
  - **Step 5:** Incentive conflict: Ranking rewards speed, not resolution.  
  - **Step 6:** History: Sellers used auto-replies to game this last year.  
  - **Final Decision:** 🔴 **RED (Unsafe)**. High Risk in Steps 2, 3, 4, 5, 6. Do not tie to ranking.  

  **Case 2: Customer Satisfaction Score (CSAT) (Determines bonuses)**  
  - **Step 1:** Metric = "Avg. post-purchase survey score (1–5)." Goal = "Buyers feel satisfied."  
  - **Step 2:** **Medium** manipulability (e.g., agents beg for high scores; costs reputation risk).  
  - **Step 3:** Tunnel vision on surveys neglects **underlying issues**. Collateral damage: Survey fatigue.  
  - **Step 4:** Strong evidence. CSAT correlates with retention (r=0.7 in A/B tests).  
  - **Step 5:** Incentive conflict: Bonuses may encourage pressure tactics.  
  - **Step 6:** History: Gaming occurred (agents offered discounts for high scores). Safeguards: Audits + sentiment analysis.  
  - **Final Decision:** 🟡 **YELLOW (Monitor)**. Medium risk (Steps 2, 5). Keep but add:  
    - **Safeguards:** Anonymize surveys, cap score impact on bonuses.  
    - **Monitor:** Quarterly correlation checks.  

  **Case 3: AI-Generated Content Quality Metric (New for internal tool)**  
  - **Step 1:** Metric = "AI quality score (0–10)." Goal = "Accurate, useful content."  
  - **Step 2:** **Easy** to manipulate (e.g., AI adds buzzwords to inflate score).  
  - **Step 3:** Tunnel vision on score neglects **accuracy**. Collateral damage: Misinformation.  
  - **Step 4:** **No evidence**. New metric; no A/B tests.  
  - **Step 5:** Incentive conflict: Teams may optimize for score over truth.  
  - **Step 6:** No history. No safeguards yet.  
  - **Final Decision:** 🔴 **RED (Unsafe)**. High Risk in Steps 2, 3, 4. **Team won’t like this**—blocks automation—but needed.  

  ---

  ### **Failure Modes This Procedure Cannot Catch**  
  1. **Emergent Gaming:** Novel exploits that appear only after long-term use (e.g., new seller scams).  
  2. **External Shocks:** Market shifts that break correlation (e.g., a pandemic making CSAT noisy).  
  3. **Cross-Metric Conflicts:** Interactions between multiple metrics (e.g., CSAT + response time causing agents to rush).  
  4. **Ethical Risks:** Metrics that incentivize unethical behavior (e.g., suppressing negative feedback).  
  5. **Long-Term Drift:** Correlation decaying over time without visible triggers.  

  **Recommendation:** Re-run this procedure **bi-annually** on active metrics. For Yellow/Red metrics, use alternatives like:  
  - **Proxy Stacking:** Combine multiple imperfect metrics (e.g., response time + resolution rate).  
  - **Dynamic Weights:** Adjust metrics based on spot-check audits.  
  - **Outcome-Based Targets:** Reward end results (e.g., "fewer repeat buyer inquiries").
