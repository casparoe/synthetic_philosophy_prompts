prompt: |-
  I'm a psychiatrist in a group practice, and last night I had a long argument with a friend who teaches epistemology. The argument was about epistemic akrasia — roughly, whether it can ever be rational to hold a belief while also believing that your evidence does not support it, or to fail to believe what you take your evidence to support. She defended the position that epistemic akrasia is never rational: if you genuinely judge that your first-order evidence points to P, you ought to believe P, full stop — even if you also possess higher-order evidence that you are sleep-deprived, emotionally compromised, or otherwise unreliable in forming that very judgment. I pushed back with examples from my own clinical experience, times I have caught myself settling on a diagnosis while knowing I was too exhausted to trust the reasoning that produced it, and she did not budge. We did not resolve the argument, but it made me realize that I have no systematic way of handling these conflicts in my daily work.

  I want a decision procedure I can use when I face a conflict between my first-order clinical judgment and higher-order evidence about my own reliability as a diagnostician. The procedure should tell me, for a given clinical decision — diagnosis, treatment plan, risk assessment, or disposition — whether to go with my first-order judgment, to revise that judgment in light of the higher-order evidence, or to escalate by seeking a second opinion or deferring the decision. It needs to be something I can actually run in the five or ten minutes I have between patients, without special training in formal epistemology. It should distinguish among different kinds of higher-order evidence — physiological state (fatigue, hunger, illness), emotional state (irritability, countertransference, mood), known personal or demographic biases, and statistical evidence about error rates for clinicians in circumstances like mine — and say whether these call for different responses or collapse into a single rule. It should also distinguish between decisions where the cost of a false positive and the cost of a false negative are very different, since that seems to matter for whether you should override your own judgment. Flag the points where the procedure cannot eliminate judgment and I simply have to make a call, and be honest about which steps are dressed-up intuition.

  Then run the procedure on three cases from my practice:

  1. I have formed a provisional diagnosis of borderline personality disorder after a single intake session with a new patient. I am aware that I am running on four hours of sleep and that the clinical literature documents a tendency to over-diagnose BPD when clinicians are fatigued or when they have had minimal exposure to the patient. My first-order read of the presentation genuinely feels like BPD to me.

  2. I am about to discharge a patient whom I assess, on the basis of a standard suicide risk assessment and clinical interview, as being at low risk for a suicide attempt in the near term. I then learn that clinicians at my experience level miss approximately 15 percent of eventual suicide attempts in patients with presentations similar to this one — a finding from a large outcome study our practice reviewed last month.

  3. I am evaluating an adult woman for ADHD. My first-order assessment of the evidence — clinical history, symptom inventories, collateral report — points toward a negative diagnosis. But I know I have a documented and persistent tendency to under-diagnose ADHD in adult women, a bias I have been aware of and trying to correct for several years, with mixed success. I cannot tell whether my negative assessment is sound or just the same bias operating again.

  Finally, tell me honestly: are there cases where this procedure will instruct me to do something that, as an experienced clinician, feels wrong? Are there situations where following it would make me a worse doctor rather than a more rational one? I want to know where the epistemology breaks against the reality of clinical practice, and I would rather hear that now than discover it with a patient.
reasoning: |-
  Okay, let me start by really unpacking the user's query. They're a psychiatrist who had an argument about epistemic akrasia with a friend who teaches epistemology. The core issue is whether it's rational to hold a belief while knowing the evidence doesn't support it, or vice versa. The friend says it's never rational; the psychiatrist thinks there are clinical situations where higher-order evidence (like fatigue or bias) should override first-order judgment. 

  The user wants a practical decision procedure they can use between patients—something quick, without needing formal epistemology training. They need it to handle different types of higher-order evidence: physiological states (fatigue), emotional states (countertransference), biases, and statistical error rates. It should also account for varying costs of false positives vs. false negatives. Plus, they want it tested on three real cases and want to know where the procedure might clash with clinical intuition.

  First, I need to break down the components. The decision procedure must be structured but fast. A flowchart or checklist approach makes sense. It should start by identifying the clinical decision type and the higher-order evidence. Then assess the reliability of that evidence. Next, evaluate the stakes—cost of being wrong. Finally, decide among four actions: trust judgment, revise judgment, defer decision, or escalate. 

  For the higher-order evidence types, each might require different handling. Physiological states like fatigue could be more straightforward—if you're exhausted, deferring might be best. Emotional states like countertransference might need more introspection. Known biases are trickier because they're persistent. Statistical evidence (like error rates) introduces base rates that might conflict with personal judgment.

  The cost asymmetry is crucial. In suicide risk assessment (case 2), a false negative could be fatal, so even a small statistical risk might warrant escalation. For ADHD diagnosis (case 3), under-diagnosis due to bias might mean revising the judgment despite first-order evidence pointing negative.

  Testing the three cases will show how the procedure works. In case 1 (BPD diagnosis while fatigued), the steps would flag high fatigue and literature on over-diagnosis, suggesting deferral. Case 2 (suicide risk with 15% miss rate) has high stakes, so escalating makes sense despite low first-order risk. Case 3 (ADHD bias) involves a known persistent bias, so revising or seeking consultation is indicated.

  But where might this break? The procedure relies on self-assessment, which is fallible. If a clinician is too tired to recognize their fatigue, the procedure fails. Also, persistent biases might not be fully correctable, leading to repeated revisions that undermine confidence. There's also the risk of over-reliance on statistics, ignoring nuanced clinical judgment.

  The user’s deeper needs: They want to minimize errors in high-stakes decisions, maintain professional integrity, and reconcile epistemology with real-world constraints. They might fear that following the procedure could make them less effective, especially if it overrides hard-earned intuition. So, honesty about limitations is key—admitting where steps are "dressed-up intuition" and where judgment is unavoidable.
answer: |-
  Here's a practical, time-boxed decision procedure designed for clinical use, followed by its application to your cases and an honest assessment of limitations.

  **The EPISTEME Procedure (5-10 Minute Protocol)**

  1.  **E: Establish the Stakes (1 min)**
      *   What are the *consequences* of a **false positive**? (e.g., unnecessary medication, stigma, incorrect treatment path)
      *   What are the *consequences* of a **false negative**? (e.g., untreated illness, safety risk, deterioration)
      *   **Triage:** Is this a high-stakes asymmetry? (e.g., suicide risk = massive cost to FN; mild adjustment disorder Dx = lower stakes). *Flag: Cost-benefit analysis here requires clinical judgment.*

  2.  **P: Pinpoint the Higher-Order Evidence (HOE) Type (1 min)**
      *   **Physiological State:** (Fatigue, illness, hunger, intoxication?) → *Generally transient, impairs cognition broadly.*
      *   **Emotional State:** (Strong countertransference, intense mood, acute stress?) → *Can distort perception/reasoning specifically.*
      *   **Known Personal/Demographic Bias:** (Documented tendency like under-Dx ADHD in women, racial/gender bias?) → *Persistent, often unconscious, affects specific judgments.*
      *   **Statistical Evidence:** (Known error rate in this situation, base rates?) → *Objective but impersonal, may not capture nuance.*

  3.  **I: Interrogate the HOE's Strength & Specificity (2 min)**
      *   **How severe/direct is the impairment?** (Mild fatigue vs. severe exhaustion? Fleeting annoyance vs. blinding rage? General bias awareness vs. specific audit showing 30% under-dx?)
      *   **How relevant is the HOE to *this specific* judgment?** (Fatigue might impair all complex Dx; countertransference might distort *this* patient interaction; ADHD bias directly targets *this* Dx).
      *   **Is the HOE *conclusive* or merely *cautionary*?** (Is it "I am definitely impaired *right now*" or "This is a general risk factor"?)
      *   **Flag:** *This step is inherently judgment-based. Honesty about self-perception is crucial.*

  4.  **S: Synthesize & Decide Action (3-5 min)**
      *   **Trust Judgment:** *Only if ALL are true:*
          *   Stakes are relatively symmetric *or* low.
          *   HOE is weak/non-specific OR conclusively addressed/mitigated.
          *   No known strong, specific bias directly applies.
          *   *Action:* Proceed as planned.
      *   **Revise Judgment:** *If:*
          *   HOE points to a *specific, directional* error (e.g., known bias to under-dx ADHD).
          *   Stakes are asymmetric *against* the direction of the likely bias (e.g., cost of FN is high for the condition you tend to under-dx).
          *   Revision feels plausible upon reflection (not forced).
          *   *Action:* Actively adjust your conclusion (e.g., lean towards diagnosis you tend to miss).
      *   **Defer Decision:** *If:*
          *   HOE indicates *general, significant impairment* (severe fatigue, acute emotional dysregulation) likely impacting *this* judgment.
          *   Specific bias is strong *but* directional correction feels too uncertain.
          *   Stakes are high *and* HOE is significant *but* doesn't suggest a clear revision.
          *   Time allows safe delay (e.g., not an acute crisis).
          *   *Action:* Postpone final decision until impairment passes (sleep, eat, calm down) or schedule follow-up specifically to reassess.
      *   **Escalate (Seek 2nd Opinion/Consult):** *If:*
          *   Stakes are *highly asymmetric* (especially high cost to FN).
          *   HOE indicates *significant, specific risk of error* (strong known bias, high statistical error rate *in this context*, severe impairment).
          *   Revision is impossible/unwise (e.g., suicide risk assessment with known miss rate).
          *   Deferral is unsafe or impractical for high-stakes decision.
          *   *Action:* Consult colleague *before* finalizing action, framing the HOE clearly ("I'm concerned about X bias/fatigue/stat here").

  **Key Differentiations:**
  *   **Physiological/Emotional:** Often call for **Deferral** (impairment) or **Escalation** (if high-stakes/can't defer). Less often specific Revision.
  *   **Known Bias:** Often calls for **Revision** (if directional) or **Escalation** (if pervasive/high-stakes). Requires active counter-action.
  *   **Statistical Evidence:** Primarily impacts **Escalation** (high base rate miss in high-stakes) or **Trust** (if low/stakes symmetric). Less about Revision.

  **Running the Cases:**

  1.  **Provisional BPD Dx (Fatigued, Literature on Over-Dx)**
      *   **E (Stakes):** High. False Positive (FP): Stigma, inappropriate therapy focus, missed alternative Dx. False Negative (FN): Delay in effective treatment. *Moderate asymmetry (FP risk higher initially due to stigma)*.
      *   **P (HOE Type):** Physiological (Severe fatigue) + Statistical (Lit on over-Dx when fatigued/minimal exposure). *Strong, specific, directional HOE.*
      *   **I (Interrogate):** Severe fatigue (4hrs sleep) directly impairs complex Dx formation. Literature provides strong, relevant statistical HOE suggesting over-Dx risk *in this exact scenario*. High specificity.
      *   **S (Synthesize):** High stakes + Strong, specific HOE indicating significant risk of directional error (over-Dx) → **Defer Decision.** *Action: Do NOT finalize BPD Dx. Note as "provisional, requires reassessment when rested & after more sessions." Schedule follow-up soon.*

  2.  **Discharge with Low Suicide Risk (15% Miss Rate Known)**
      *   **E (Stakes):** Extreme Asymmetry. FP (Overly cautious): Minor inconvenience. **FN (Missed attempt): Catastrophic - Death.** *Highest possible stakes for FN.*
      *   **P (HOE Type):** Statistical (Known 15% miss rate for clinicians like me in similar cases). *Objective, highly relevant HOE.*
      *   **I (Interrogate):** 15% is a *significant* base rate error. Directly applies to *this exact decision point* (discharge assessment). Conclusive evidence that my judgment class has non-trivial error rate here.
      *   **S (Synthesize):** Extreme stakes (Catastrophic FN cost) + Strong, specific statistical HOE indicating significant risk → **Escalate.** *Action: Do NOT discharge solely on my assessment. Immediately seek urgent second opinion/consult from senior colleague or crisis team, explicitly citing the 15% miss rate study as the reason. Frame it as "Given the known stats, I need another set of eyes before discharge."*

  3.  **ADHD Negative Dx in Adult Woman (Known Under-Dx Bias)**
      *   **E (Stakes):** Moderate Asymmetry. FP: Unnecessary stimulants, missed alternative Dx. **FN: Continued impairment, distress, missed effective treatment.** *Cost of FN often higher long-term.*
      *   **P (HOE Type):** Known Personal Bias (Persistent tendency to under-diagnose ADHD in adult women). *Strong, specific, directional HOE.*
      *   **I (Interrogate):** Bias is documented, persistent ("several years, mixed success correcting"). Directly targets *this specific* diagnostic question. High strength and specificity for directional error (under-Dx).
      *   **S (Synthesize):** Moderate stakes + Strong, specific, directional HOE indicating risk of under-Dx → **Revise Judgment.** *Action: Actively re-examine the evidence *assuming my initial negative assessment might be wrong*. Look for points I might have minimized. Lean towards diagnosing ADHD if *any* plausible evidence exists, acknowledging the bias. If genuinely uncertain after this, **Escalate** (Seek consult) to counter the bias.*

  **Honest Assessment: Where Epistemology Might Break Against Clinical Reality**

  1.  **The "Dressed-Up Intuition" Problem:** Steps P (Pinpointing HOE) and I (Interrogating Strength/Specificity) rely heavily on *self-awareness* and *honest self-assessment*, which are vulnerable to the very impairments/biases you're trying to assess. The procedure assumes you can accurately perceive your fatigue level or bias activation *in the moment* – which is often the core challenge of akrasia. **This is the biggest weakness.**
  2.  **Time & Complexity in Synthesis (S):** High-stakes decisions under pressure (like the suicide risk case) demand quick action. Running through EPISTEME rigorously in 5 mins for complex cases can feel rushed. The synthesis step is inherently judgment-laden ("Is this HOE *conclusive* or just *cautionary*?").
  3.  **Overriding Strong Gut Feel:** Following this procedure *will* sometimes feel wrong. Escalating the suicide case ("But I *really* think he's low risk!") or revising the ADHD diagnosis ("But the evidence *doesn't* support it!") can feel like ignoring your clinical intuition and expertise. It requires humility that feels counter to confident practice.
  4.  **Potential for Paralysis or Over-Correction:** Constantly deferring or escalating due to awareness of fatigue/bias/stats could lead to indecision, slower care, and burdening colleagues. Conversely, constantly revising judgments against your read of the evidence (e.g., always diagnosing ADHD in women due to bias fear) risks creating new diagnostic errors (false positives).
  5.  **Limits of "Revision":** Directionally revising a judgment (Case 3) is epistemologically sound but clinically tricky. *How much* do you revise? It risks replacing one bias (under-dx) with another (over-dx driven by guilt). It relies on the ability to artificially shift perspective, which may not be fully possible.
  6.  **Ignoring Nuance for Statistics:** Relying heavily on statistical HOE (Case 2) can feel like ignoring the *specific* patient presentation you just assessed. The procedure prioritizes base rates over individual judgment in high-stakes FN scenarios, which might grate against the clinician's sense of knowing *this* patient.
  7.  **Resource Constraints:** "Escalate" assumes colleagues/resources are available for timely consultation. In overburdened systems, this isn't always feasible.

  **Conclusion:** This procedure provides a structured, epistemologically informed way to navigate conflicts between first-order judgment and HOE. It explicitly weights stakes and differentiates HOE types. **It will make you *more rational* by systematically incorporating evidence about your own reliability, especially in high-stakes situations where intuition is demonstrably fallible (like suicide risk).**

  However, **it will sometimes make you feel like a *worse doctor* in the moment.** Overriding a strong clinical conviction (even when rationally justified by HOE) is uncomfortable. It requires acknowledging fallibility constantly. The steps involving self-assessment (P, I) are vulnerable to the blind spots they aim to address. Use EPISTEME as a crucial safety net and bias-correction tool, especially when stakes are high or HOE is strong and specific. Recognize that Steps P and I involve significant judgment ("dressed-up intuition"). In lower-stakes situations with weak HOE, trusting your hard-earned clinical expertise (Step S: Trust) remains rational and appropriate. The goal isn't eliminating akrasia or intuition, but managing its risks systematically.
