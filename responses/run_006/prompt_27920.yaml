   Then we introduce the concept of strategy-proofness: a voting rule is strategy-proof if there is no situation where a voter can get a better outcome by lying about their preferences.

   We then state the Gibbard-Satterthwaite theorem: For three or more candidates, there is no voting rule that is non-dictatorial, onto (every candidate can win), and strategy-proof.

   We map the activity:

     - Non-dictatorial: In our activity, no single voter always gets their way. We had 18 voters, and no one was a dictator.
     - Unrestricted domain: In the activity, we allowed any preference ranking, and we assigned a variety.
     - At least three outcomes: we had three candidates.
     - Failure of strategy-proofness: in every voting rule we tried, we found at least one situation (the preference profile we used) where some voter had an incentive to manipulate.

