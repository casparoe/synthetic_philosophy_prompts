     We should fill that gap by explaining that the theorem guarantees that for any rule we might design (that is non-dictatorial and onto), there will be at least one situation (a preference profile) where manipulation is possible.

   Conclusion:

   This activity should make the theorem visceral by letting the students experience the temptation to manipulate in every voting system they try.
