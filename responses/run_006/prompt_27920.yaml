  ### Classroom Activity: Discovering Strategic Voting  
  **Objective:** To create an intuitive, visceral understanding of the Gibbard-Satterthwaite theorem through hands-on voting rounds where students discover strategic manipulation without explicit prompting.

  ---

  ### 1. **Setup and Materials**  
  - **Candidates & Theme:**  
    The department is voting on the theme for the annual party:  
    - **A: "Jazz Night"** (sophisticated, live music)  
    - **B: "GameFest"** (board games, video games)  
    - **C: "Tropical Luau"** (beach party, mocktails)  
    *(Avoids political/cultural sensitivity; focuses on lighthearted, relatable choices.)*  

  - **Preference Distribution (18 students):**  
    Assign private preference orders via index cards. Use a profile designed to create cyclical majorities and incentivize manipulation:  
    - **6 students:** A > B > C *(Prefers Jazz, then GameFest, then Luau)*  
    - **5 students:** B > C > A *(Prefers GameFest, then Luau, then Jazz)*  
    - **4 students:** C > A > B *(Prefers Luau, then Jazz, then GameFest)*  
    - **3 students:** C > B > A *(Prefers Luau, then GameFest, then Jazz)*  

    **Why this profile?**  
    - **Cycle:** A beats B (10–8), B beats C (11–7), C beats A (12–6).  
    - **Plurality loser:** A (6 first-place votes) loses to C (7 votes), incentivizing A-supporters to manipulate.  
    - **Close margins:** Small shifts in votes alter outcomes, making manipulation tempting.  

  - **Materials:**  
    - Index cards with assigned preferences (one per student).  
    - Paper ballots for each round.  
    - Whiteboard for public tallying.  

  ---

  ### 2. **Rules for Each Round**  
  Run all rounds **simultaneously** with **secret ballots**. Reveal full tallies (but not individual votes) after each round. Repeat each rule twice:  
  - **First run:** Students vote "honestly" (no instructions on strategy).  
  - **Second run:** Say: *"Same preferences, but you may vote differently if you wish."*  
  **(Sequence designed to escalate manipulation opportunities.)**  

  | Rule            | Ballot Instructions                                                                 | Why This Order?                                                                 |  
  |-----------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|  
  | **Round 1: Plurality** | *"Vote for **one** candidate. Most votes wins."*                                  | Simplest rule; exposes "lesser evil" incentives.                                |  
  | **Round 2: Runoff**    | *"Vote for one candidate. Top two advance. Revote for one of the two finalists."* | Shows manipulation in sequential stages (e.g., blocking a finalist).            |  
  | **Round 3: Borda Count**| *"Rank all candidates (1st=3 pts, 2nd=2 pts, 3rd=1 pt). Most points wins."*       | Demonstrates point-tweaking; easy to manipulate rankings.                       |  
  | **Round 4: IRV**       | *"Rank all candidates. If no majority, eliminate last place and redistribute votes."* | Highlights instant-runoff vulnerabilities (e.g., burying a threat).           |  

  ---

  ### 3. **The Pivot Moment**  
  - **Expected Realization:**  
    - **Round 1 (Plurality, second run):** After C wins honestly (A:6, B:5, C:7), A-supporters see C as their worst outcome. If 2+ switch to B, B wins (e.g., A:4, B:7, C:7 → tie broken alphabetically as B). Students discover voting for their **second choice (B)** yields a better outcome than their last choice (C).  

  - **Structuring for Discovery:**  
    - **Psychological nudge:** After the honest tally, ask: *"Are you satisfied? Could the outcome be better for you?"* (No direct strategy talk).  
    - **Repeated exposure:** Running each rule twice normalizes "changing your vote," reducing hesitation.  
    - **Peer influence:** Public tallies let students infer group behavior (e.g., seeing B’s votes rise).  

  - **If No One Discovers It:**  
    After Round 1, say: *"Some of you might have noticed C won, but what if you voted differently? Let’s rerun."* If still no action, post-round debrief: *"What if A-voters all chose B instead?"*  

  ---

  ### 4. **Debrief: Connecting to Gibbard-Satterthwaite**  
  After Round 4, facilitate discussion:  
  1. **Ask:** *"When did voting honestly backfire? When did ‘gaming the system’ work?"*  
  2. **Map Conditions of the Theorem:**  
     | **Theorem Condition**    | **Activity Moment**                                                                 |  
     |--------------------------|-------------------------------------------------------------------------------------|  
     | **Non-Dictatorship**     | No single student always got their way (e.g., 6 A-lovers lost honestly).            |  
     | **Unrestricted Domain**  | Any preference order was allowed (students had diverse rankings).                   |  
     | **≥3 Outcomes**          | Three party themes ensured cyclical conflicts.                                       |  
     | **Failure of Strategy-Proofness** | Every rule had a round where lying improved outcomes for some (e.g., A>B>C voters supporting B). |  

  3. **Formalize the Theorem:**  
     - *"No voting system with 3+ options can be both strategy-proof and non-dictatorial. Today, you experienced why: each rule had a flaw someone could exploit."*  

  ---

  ### 5. **What Will Go Wrong (and How to Fix It)**  
  1. **Problem: No one manipulates.**  
     - **Why:** Students may fear chaos or distrust peers.  
     - **Fix:** After first-run losses, say: *"You’re competing for your ideal party—play to win!"* Use humorous stakes (e.g., *"No one wants a lame party!"*).  

  2. **Problem: Manipulation backfires or causes ties.**  
     - **Why:** Coordinating without communication is hard.  
     - **Fix:** Highlight partial successes (e.g., *"B almost won because two of you switched—what if more did?"*). Normalize ties as learning moments.  

  3. **Unavoidable Gap: Individual vs. Group Manipulation**  
     - **Gap:** Gibbard-Satterthwaite addresses **individual** manipulation, but students may only see **group** efforts (e.g., 2+ A-voters switching to B).  
     - **Fill the Gap:** Post-activity, clarify:  
       *"Today, you saw groups manipulate, but the theorem is stronger: even one person can sometimes tip outcomes. In IRV, one A>B>C voter switching to B>A>C made B win. No system is safe from this."*  

  ---

  **Tone & Flow:**  
  - **Playful framing:** *"Let’s throw the best party and outsmart the voting rules!"*  
  - **Time per round:** 10 min (vote + tally). Total activity: 50–60 min.  
  - **Final note:** Students leave feeling they "cracked the code," setting up the theorem as the explanation for their frustration.
