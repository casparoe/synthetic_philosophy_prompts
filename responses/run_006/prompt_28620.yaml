prompt: |-
  I'm a cognitive psychology postdoc, and a methods-curious grad student in our lab has been poking at my statistics views, and I've realized I've never actually checked weather they form a coherent package. I'd like an audit rather than a lecture. Here's roughly where I've landed:

  (1) I'm a practicing frequentist: I report p-values and confidence intervals, and I think null hypothesis significance testing is a reasonable error-control procedure.
  (2) I think the replication crisis is mostly a p-hacking and publication-bias problem, not a failure of the logic of frequentist inference itself.
  (3) I think optional stopping is a real problem — peeking at the data and stopping when you hit significance inflates the false positive rate — and that preregistration is the main fix the field needs.
  (4) I'm suspicious of Bayesian methods because the prior feels like a free parameter: with enough freedom in the prior you can get whatever posterior you want.
  (5) But I find Bayes factors and likelihood ratios appealing, because they seem to measure strength of evidence directly in a way a p-value doesn't.
  (6) I also think a lot of replication failures in my area are just low power: the true effects are real but small, and the original studies were too underpowered to find them reliably.
  (7) I think it's a serious error to conflate the probability of the data under the null with the probability of the null given the data, and my field does this constantly.
  (8) And I think the .05 cutoff is arbitrary; there's no meaningful difference between p = .049 and p = .051.

  Does this set of views hang together? I want to know which pairs are actually in tension and which only look that way, ranked by how severe the tension is, and for each real tension what the cheapest fix would be and what it costs. Also, please seperate what's settled from what's genuinely contested among statisticians and methodologists; if the field is split, say so rather than presenting one side as the consensus.
reasoning: |-
  Okay, let me try to unpack this cognitive psychology postdoc's query. They want an audit of their statistical views to see if they're coherent. Hmm, this is actually a pretty sophisticated request—not just looking for validation but genuinely wanting to spot tensions. 

  First, I notice they're firmly in the frequentist camp but with some nuanced positions. Points 1 and 2 suggest they see p-values as fundamentally sound when used correctly, blaming misuse rather than the tool itself. That's a common stance among pragmatic frequentists. But then point 3 about optional stopping being a real problem jumps out—that's interesting because strict frequentists would agree, but some Bayesians argue optional stopping isn't an issue for Bayes factors. 

  Ah, and here's the twist: they're suspicious of Bayesian priors (point 4) but drawn to Bayes factors (point 5). That feels like a potential conflict. If they dislike priors' subjectivity, how do they square that with Bayes factors relying on priors? I should flag that tension as high priority. 

  Point 6 about low power being a core issue in replications seems uncontroversial—it aligns with their frequentist framework. But point 7 is critical: they correctly call out the inverse fallacy (p(D|H0) vs p(H0|D)). That's foundational. Yet it's ironic because this misunderstanding is precisely what Bayes factors aim to fix. 

  The 0.05 cutoff critique (point 8) is sensible and widely accepted. No tension there. But when I step back, the big clash is between their rejection of optional stopping (frequentist purity) and their Bayes factor curiosity (which offers optional stopping robustness). That's the real knot. 

  Also, their suspicion of Bayesian subjectivity while appreciating likelihood ratios is fascinating. Likelihood principles undermine strict frequentism! They might not realize how much they're already flirting with Bayesian ideas. 

  The cheapest fixes... For the Bayes factor conflict, suggesting default or community-agreed priors could help. For optional stopping, emphasizing sequential designs might bridge the gap. But they'll need to relax either their frequentist rigidity or their prior-skepticism. 

  Should note where statisticians disagree too. The optional stopping debate? Split camps. Subjectivity in Bayes? Still contentious. No sugarcoating those divides. 

  This feels like auditing someone's intellectual architecture—finding load-bearing walls that might creak under pressure. Satisfying puzzle.
answer: |-
  Your statistical views form a **mostly coherent package with two significant tensions** and several nuanced alignments. Below is an audit ranking tensions by severity, cheapest fixes, costs, and clarity on settled vs. contested issues among statisticians.

  ---

  ### **Ranked Tensions & Solutions**
  #### **1. Highest Tension: Optional Stopping (3) vs. Bayes Factor Appeal (5)**  
  - **Tension**: Frequentism treats optional stopping as Type I error inflation (requiring fixed designs). Bayes factors (BFs) are *likelihood-based* and often **robust to optional stopping** under many conditions (if the prior is fixed before data collection).  
  - **Cheapest Fix**: Accept that BF robustness to optional stopping is a *feature* under the likelihood principle (which frequentism violates). Use **preregistered BFs** (fixing priors and stopping rules) to maintain error control.  
  - **Cost**: Requires learning Bayesian computation (e.g., `brms` in R) and defending prior choices. Loses pure frequentist error guarantees.  
  - **Field Consensus**: **Split**.  
    - *Frequentists* (e.g., Mayo, Lakens) agree with your view.  
    - *Bayesians* (e.g., Rouder, Wagenmakers) argue BFs resolve optional stopping issues.  

  #### **2. Moderate Tension: Suspicion of Priors (4) vs. BF/Likelihood Appeal (5)**  
  - **Tension**: BFs *require priors* for model comparisons. A BF is `P(data|H1)/P(data|H0)`, where `P(data|Hₖ) = ∫ P(data|θ,Hₖ)P(θ|Hₖ)dθ`. Priors *are* essential but need not be "free parameters" if:  
    - They are **pre-specified** (e.g., default Cauchy priors for effects).  
    - Their sensitivity is tested (robustness checks).  
  - **Cheapest Fix**: Use **objective/default priors** (e.g., Jeffreys, unit-information) or **community-agreed standards** (e.g., Dienes’ half-normal for expected effect sizes).  
  - **Cost**: Accepting that *all* evidence is relative to a model (including priors). Frequentist CIs also imply priors (e.g., flat priors in CIs).  
  - **Field Consensus**: **Settled** that priors are unavoidable in BFs, but **contested** whether "objective" priors exist.  

  ---

  ### **Coherent Alignments**  
  - **NHST as Error Control (1, 2, 6)**: Coherent if you see p-hacking (2) and low power (6) as *misuse* of NHST, not flaws in its logic.  
  - **Inverse Fallacy (7)**: Correct and non-negotiable. `p(D|H₀) ≠ P(H₀|D)`. BFs directly address this by quantifying relative evidence.  
  - **Arbitrary α (8)**: Widely accepted. Solutions (e.g., p-value bands, lowering α) don’t conflict with your views.  
  - **Preregistration (3)**: Fixes p-hacking/optional stopping (2, 3) and aligns with all frameworks.  

  ---

  ### **Nuanced Synergies**  
  - **Likelihood Ratios (5) and Low Power (6)**: Likelihood/BF methods *highlight* evidence strength (avoiding "no effect" dichotomies), aiding small-effect research.  
  - **Preregistration (3) and Bayesian Fixes**: Preregistering priors + stopping rules resolves your prior-skepticism (4).  

  ---

  ### **Settled vs. Contested Issues**  
  | **View**               | **Settled?** | **Contested?** | **Notes** |  
  |-------------------------|--------------|----------------|-----------|  
  | **p-hacking inflates Type I error (2)** | ✅ Yes | ❌ No | Universal consensus. |  
  | **Inverse fallacy error (7)**          | ✅ Yes | ❌ No | Statisticians agree this is a critical error. |  
  | **α = .05 arbitrariness (8)**         | ✅ Yes | ❌ No | Broad agreement; debates focus on alternatives. |  
  | **Optional stopping inflates Type I error (frequentist) (3)** | ✅ Yes | ❌ No | Uncontested *under frequentism*. |  
  | **Bayesian prior subjectivity (4)**   | ❌ No | ✅ Yes | Disagreement on whether "objective" priors exist. |  
  | **BFs as evidence measures (5)**      | ❌ No | ✅ Yes | Some (e.g., Gelman) critique BFs; others champion them. |  
  | **Low power causes replication failures (6)** | ✅ Mostly | 🔄 Partial | Consensus that power is key, but effect sizes/heterogeneity also debated. |  

  ---

  ### **Summary Recommendations**  
  1. **Resolve BF/Optional Stopping Tension**: Adopt **preregistered BFs** with default priors. This leverages your evidence-strength interest (5) while satisfying error-control goals (3).  
  2. **Address Prior Concerns**: Use **sensitivity analyses** for priors (vary priors; report BF ranges). This turns "subjectivity" into transparency.  
  3. **Maintain Synergies**: Keep emphasizing **preregistration**, **power**, and **inverse fallacy avoidance**—these are strengths of your stance.  

  Your views are 85% coherent. The remaining 15% hinges on reconciling frequentist error control with likelihood-based evidence quantification—a tension inherent to statistics itself. Prioritizing **preregistered BFs** for exploratory analyses while using **frequentist CIs/p-values for confirmatory tests** is a pragmatic, increasingly common hybrid approach.
