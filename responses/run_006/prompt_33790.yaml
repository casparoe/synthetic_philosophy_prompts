prompt: |-
  Okay here's one I keep going back and forth on. In Bayesian confirmation theory, the old-evidence problem goes like this: if some observation E was already known before a hypothesis H was formulated, then relative to any background that includes E, P(E) = 1, so H can't be confirmed by E — Bayes' theorem just gives P(H|E) = P(H). But that seems to badly misdescribe actual science: the anomalous precession of Mercury's perihelion was known long before general relativity, yet it's standardly treated as evidence for it. What's your actual credence that this is a real problem for Bayesianism — that it shows the standard Bayesian account of confirmation is missing something structural — rather than just an artifact of how we choose the background knowledge? I don't want 'it depends how you model it'; I want a number and the reasoning decomposed. What sub-questions does the number ride on — for instance, whether any of the proposed fixes (counterfactual likelihoods, dropping E from the background, treating confirmation as a three-place relation) actually works, whether the Mercury case is really confirmation rather than post-hoc explanation, whether the problem generalizes beyond a few stock examples — and what rough probability do you put on each? Show how they combine into the final number, then tell me which sub-question you're least confident about, and which one moving would shift the final credence most.
