  Read No Country for Old Men (the Coen brothers film, not the book) through Galen Strawson's Basic Argument against moral responsibility. I know the obvious move is to talk about Chigurh and the coin toss, but I want to focus on Llewelyn Moss and Sheriff Bell. Strawson's argument says you can't be ultimately responsible for anything you do because you can't be ultimately responsible for the way you are — you didn't create yourself, and who you are determines what you choose. Moss keeps making choices that dig him in deeper — taking the money, going back with water, and so on — but the film also makes it feel like he can't help himself, like his whole character is a kind of trap he was born into. Bell, meanwhile, is watching all this and feeling like the world has outpaced him, and he retires and tells that dream about his father carrying fire in a horn through the snow. I want to know: does the film endorse something like Strawson's view, or does it push back? Is Bell's dream a vision of some kind of responsibility or meaning that survives Strawson's argument, or is it the opposite — an acceptance that you just play out the hand you were dealt? And if Strawson is right, what happens to the moral seriousness of the film — does it collapse into nihilism, or does the film show us something about why we still can't let go of responsibility even if we can't ground it philosophically? I need a reading that's faithful to both the film and the argument, and doesn't just turn the movie into a handy illustration. And please, no formatting — just continuous prose, like an email. No headings, no bullet points, no bold, no tables.
