prompt: |-
  I'm a philosophy professor and I sit on the graduate admissions committee for our PhD program, and we've been stuck for weeks on a fight about recommendation letters. The background is this: over the past decade letters have ballooned from a page to three or four pages, and every one of them now says the candidate is among the top one percent the writer has ever taught and shows unusual originality, and so on. Nobody on the committee actually believes any of it anymore, but the trouble is that if any individual advisor writes a short, sober, comparative letter, their student reads as weak next to the pile of superlatives coming out of other programs—so no one dares stop. A few of us have started calling it a Moloch problem or a race to the bottom. There's a proposal on the table that our department should unilaterally adopt a hard cap of, say, 500 words and a standard format for letters, and maybe include a line in each letter saying our department has a policy of calibrated, non-inflated language. The other camp thinks this is naive: if we disarm while everyone else keeps inflating, we just tank our own students' chances, and the honest move is to wait for a field-wide norm or push the disciplinary association to act. I need to circulate a short written opinion before Thursday's meeting. Could you draft the memo? It should recomend a concrete course of action with a time frame—adopt, reject, or adopt with conditions—and it should engage the strongest consideration on the losing side seriously, rather than just insisting that short letters are more honest. I'd especially like it to address whether a single department's norm can do anything at all when the trap operates at the level of the whole field, and what we should tell faculty who worry they'll be personally blamed if a student doesn't get in.
reasoning: |-
  Okay, the user is a philosophy professor on a graduate admissions committee dealing with recommendation letter inflation. They described how letters have become excessively long and full of hyperbolic praise, making it hard to distinguish truly exceptional candidates. The committee is divided: some want their department to adopt strict letter limits and calibrated language, while others worry this would disadvantage their students if other programs don't follow suit. The user needs a memo recommending a course of action by Thursday, addressing key concerns like whether unilateral action can work and how to handle faculty fears of blame.

  First, I need to understand the core problem. The letter inflation is a classic collective action problem—like a prisoner's dilemma. Each advisor feels pressured to exaggerate to avoid their student looking worse, but if everyone does it, the letters lose meaning. This is similar to Moloch, where individual incentives lead to worse outcomes for all. The memo has to propose a solution that addresses this dynamic.

  The user mentioned two main proposals: unilateral policy vs. waiting for field-wide action. The memo must pick one and address counterarguments. The losing side's strongest point is that unilateral disarmament might hurt their students. I need to acknowledge that risk but argue why the policy is still worth trying.

  Also, faculty fear being blamed if a student fails. The memo should include mitigation strategies, like departmental support and clear communication about the policy. Highlighting that calibrated letters might actually stand out positively could help.

  Looking deeper, the professor might want to restore integrity in admissions without disadvantaging students. They might also need to build consensus in the committee. The memo should aim to persuade by showing that their department can lead change and influence others, turning a risk into an opportunity.

  Time frame is important. The proposal should include immediate adoption with a review period. Suggest a pilot year with evaluation. This shows action but allows adjustments if needed.

  Key elements: concrete word limit (500), standard format, mandatory disclosure. Emphasize that concise letters force writers to be specific with examples, which admissions committees might appreciate more than vague superlatives.

  Addressing field-wide concerns: Argue that change starts somewhere. By adopting the policy, they set an example, which could inspire other departments. Plus, the disclosure statement educates others about the issue, potentially sparking broader reform.

  Finally, structure the memo clearly: problem statement, recommendation, implementation steps, counterarguments addressed, and faculty reassurance. Keep it concise since it's for a committee meeting.
answer: |-
  **MEMORANDUM**  
  **TO:** Graduate Admissions Committee  
  **FROM:** [Your Name], Philosophy Department  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation Letter Inflation – Proposed Policy & Implementation Plan  

  ### I. Problem Statement  
  As documented, recommendation letter inflation has rendered comparative assessment nearly impossible. Hyperbolic language ("top 1%," "unprecedented genius") and excessive length (3–4 pages) now dominate, eroding trust while creating a collective action problem ("Moloch trap"). If we continue, letters lose all discriminative value. If we unilaterally disarm, our students risk looking weaker. Both paths are unsustainable.  

  ### II. Recommendation: ADOPT the Policy (with Conditions & Time Frame)  
  I propose we adopt a **500-word limit**, **standardized format** (see Appendix A), and **mandatory disclosure statement** in all our PhD recommendation letters, effective **July 1, 2024** (for Fall 2025 admissions cycle).  

  **Core Policy Components:**  
  1. **500-word hard cap** (excluding disclosure statement).  
  2. **Standard format**:  
     - Relationship context (courses taught, supervision duration).  
     - Comparative assessment (e.g., "Top 5% in my 20-year career").  
     - Specific examples of originality/resilience (no vague praise).  
     - Constructive limitations (if applicable).  
  3. **Mandatory disclosure statement**:  
     > *"This letter adheres to [University] Philosophy Department’s policy of calibrated, non-inflated language. We believe concise, evidence-based evaluations best serve candidates and committees."*  

  **Time Frame & Conditions:**  
  - **Immediate adoption (July 2024)** for all PhD applicants.  
  - **Pilot evaluation** after 2025 admissions cycle (assess impact via committee feedback, placement rates).  
  - **Conditional sunset clause**: Policy expires in 3 years unless renewed by vote, incentivizing field-wide coordination.  

  ---

  ### III. Engaging the Strongest Counterargument: "Unilateral Disarmament Tanks Our Students"  
  The losing side rightly notes: if only *we* adopt restraint while others inflate, our students may suffer. This is the core Moloch dilemma. **Rebuttal:**  

  1. **Strategic Reframing**:  
     - Short, calibrated letters will *stand out* in a sea of noise. Committees increasingly distrust inflated letters; ours will signal **credibility**.  
     - Example: "Top 5% over 20 years" (with evidence) is more believable than "Top 1% ever."  

  2. **Leveraging Institutional Prestige**:  
     - As a top program, our policy signals leadership. Adcoms at peer institutions will recognize our letters as "ground truth" benchmarks.  

  3. **Catalyzing Field-Wide Change**:  
     - The disclosure statement forces committees to confront the inflation problem. We attach a **cover letter to all applications** explaining our policy and inviting collaboration.  
     - Simultaneously, we **formally petition the APA/ACPA** (cc: all Top-20 programs) to establish field-wide standards by 2026, using our policy as a template.  

  4. **Mitigating Short-Term Risk**:  
     - We **highlight exceptional students via supplementary materials** (e.g., writing samples, research statements) to compensate for letter brevity.  

  ---

  ### IV. Addressing Faculty Concerns: "Will I Be Blamed?"  
  To preempt individual blame:  
  - **Departmental Shield**: The Chair will issue a memo taking ownership of the policy, stating: *"This is a collective strategy to restore integrity to admissions. Outcomes reflect departmental policy, not individual letter-writer restraint."*  
  - **Transparency with Students**: Advisors must explain the policy to advisees upfront: *"We use precise language so committees trust our praise. This protects your achievements from being discounted."*  
  - **Data Tracking**: Monitor placement rates pre/post-policy. If short-term dips occur, we adjust tactics (e.g., intensified advocacy), but do not abandon principle.  

  ---

  ### V. Why Unilateral Action *Can* Work  
  Collective traps are broken by *focal points*—clear, credible actions that shift expectations. By acting first:  
  - We create a Schelling point ("If [Elite Program] does it, maybe we can too").  
  - We force committees to question inflated letters from *other* programs ("Why no disclosure?").  
  - We protect our epistemic integrity while strategically pressuring the field.  

  ---

  ### VI. Action Items for Committee Vote  
  1. Adopt 500-word policy + disclosure statement (effective July 1, 2024).  
  2. Task Chair with formalizing APA/ACPA coordination by August 2024.  
  3. Approve standardized format (Appendix A) and applicant cover letter template.  

  **Appendix A: Standard Format Outline**  
  - **Context** (50 words): Relationship to candidate.  
  - **Intellectual Strengths** (150 words): Specific examples (e.g., "Paper X refuted Smith’s thesis by...").  
  - **Comparative Ranking** (100 words): Explicit cohort/quantile.  
  - **Limitations** (50 words, if applicable): Constructive critique.  
  - **Fit for PhD** (100 words): Suitability for rigorous research.  
  - **Mandatory Disclosure** (attached).  

  ---  
  **Signed,**  
  [Your Name]  
  *Professor of Philosophy*  

  *This memo balances principle with pragmatism: we act unilaterally to break the inflation cycle while mitigating risks through transparency, data, and aggressive field-wide coordination. Credibility is our currency—let’s spend it wisely.*
