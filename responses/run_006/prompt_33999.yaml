prompt: |-
  I'm teaching a unit on the ethics of consent in an upper-division applied ethics course, and I want to give students a diagnostic instrument that sorts them into positions based on what they say about cases, not on which label they instinctively prefer. Please write a decision tree (or taxonomy in tree form) of the main positions on what makes consent morally valid. The tree should be built from the logical space of possible answers to diagnostic questions, not from a pre-existing list of named positions.

  Each branch node should be a concrete case or a sharply stated claim that positions genuinely come apart on, phrased so that a student can answer it without knowing the terminology. The cases should span the central dimensions of the debate: deception (about the nature of the act, about its consequences, about the identity of the partner), coercion (threats, offers one cannot refuse, background structural pressure), and competence (intoxication, cognitive disability, age, temporary emotional distress). Make sure at least one case involves deception about something other than the partner's identity, and at least one involves a hard-to-classify pressure that is neither a paradigmatic threat nor a paradigmatic offer.

  The leaves should carry the name of the position if it has a standard name in the literature, and one sentence identifying its most awkward commitment — the case it struggles with or the implication its defenders least want to admit. If there are logically possible combinations of answers that no one defends, mark those leaves as unoccupied and briefly diagnose whether the position is incoherent, merely unattractive, or simply unexplored.

  Flag any pair of positions your tree cannot separate, and explain why the diagnostic questions fail to pull them apart.

  The audience is philosophy majors who have read some applied ethics but not the specialist consent literature. Aim for roughly six to eight leaves, including both occupied and unoccupied positions.
reasoning: |-
  Okay, the user is teaching an applied ethics course on consent and needs a diagnostic tool to sort students into ethical positions based on case judgments rather than labels. Let me unpack their request.

  First, they want a decision tree built from concrete cases and claims, not pre-named theories. The key dimensions are deception, coercion, and competence - with specific requirements: non-identity deception and ambiguous pressure cases. Leaves should name positions (if existent) plus their "awkward commitments," and mark unexplored branches. Target is 6-8 leaves for philosophy majors.

  Hmm... the real challenge is designing diagnostic questions that cleanly separate positions. I recall the core debates: is consent about will or understanding? Does coercion require threats versus exploiting circumstances? How much impairment voids consent?

  For deception, I'll need cases where: 
  - Partner lies about STI status (non-identity deception)
  - Fake doctor procedure (nature-of-act deception) 
  Identity deception is more straightforward with impersonation cases.

  For coercion, the tricky part is that "hard-to-classify pressure" case. Maybe an economic desperation scenario - like accepting dangerous work due to poverty. Not a threat, not an offer, but clearly problematic.

  Competence needs range: drunken hookups, developmental disability, grief-induced decisions. Age is simpler but important for completeness.

  The branching should first split will-based vs understanding-based theories. Then within will-based: threats vs offers vs background pressures. Within understanding-based: strict vs contextual knowledge requirements.

  I'm noticing possible gaps. For example, is there a position that accepts background coercion but rejects desperate offers? Probably not defended, but I should flag it as "unoccupied - empirically unattractive." Similarly, a theory requiring perfect understanding might be logically possible but absurd in practice.

  Watch out for indistinguishable positions! Voluntarism vs contextual will theories might collapse if we only use threat-based coercion cases. Need that ambiguous economic pressure scenario to separate them.

  For the leaves:
  - Autonomy Voluntarism's awkwardness: saying yes to danger due to poverty isn't coerced
  - Contextual Voluntarism struggles with "voluntary" self-harm
  - Strict Attitudinal says drunk regret doesn't invalidate consent
  - Etc.

  Must include at least one unoccupied node. The "full contextualism + hard voluntarism" combo seems incoherent - you can't simultaneously require perfect understanding AND ignore competence impairments.

  ...this feels robust. The tree starts simple (will vs understanding), gets nuanced with edge cases, and exposes how theories handle pressure vs deception tradeoffs. Perfect for sparking debate in class.
answer: |-
  Here is a diagnostic decision tree isolating core positions on morally valid consent, built from concrete cases and claims. It identifies 7 leaves (5 occupied, 2 unoccupied) and flags 1 indistinguishable pair.

  **Diagnostic Decision Tree: What Makes Consent Morally Valid?**

  **Start: Case 1 - The Desperate Job (Structural Pressure)**
  > *Alex, deeply impoverished and facing eviction, agrees to participate in a medically risky drug trial for a large sum of money offered by a powerful corporation. The risks are fully disclosed. Alex says, "I hate this, but it's my only real option." Is Alex's consent morally valid?*
  *   **If YES (Consent Valid despite desperation)** → Go to Case 2.
  *   **If NO (Consent Invalid due to desperation)** → Go to Case 3.

  **Branch 1A: Case 2 - The Withheld Consequence (Deception - Consequences)**
  > *Brendan consents to sex with Casey. Casey knows they have a highly contagious, non-life-threatening but unpleasant infection (like a bad strain of flu), but deliberately does not disclose this, knowing Brendan would refuse if they knew. Brendan contracts the infection. Was Brendan's consent to sex morally valid?*
      *   **If YES (Consent Valid; deception about minor consequence irrelevant)** → **Position: Autonomy Voluntarism**  
          *Most Awkward Commitment:* Argues consent is valid even if obtained through significant deception about *consequences* the deceiver knows are deal-breakers, as long as the core act description wasn't false.
      *   **If NO (Consent Invalid; deception about consequence invalidates)** → Go to Case 4.

  **Branch 1B: Case 3 - The Unrefusable Offer (Ambiguous Pressure)**
  > *Delta is drowning. Victor, a strong swimmer nearby, says: "I'll save you only if you agree to sign over ownership of your house to me right now." Terrified, Delta agrees. Is Delta's consent to the property transfer morally valid?*
      *   **If YES (Consent Valid; offer accepted under duress)** → **Position: Strict Attitudinal Voluntarism**  
          *Most Awkward Commitment:* Maintains consent is valid if the agent *subjectively* assented, even under extreme, exploitative pressure ("offers one cannot refuse") or significant impairment, focusing purely on the "yes" moment.
      *   **If NO (Consent Invalid; exploitation invalidates)** → Go to Case 5.

  **Branch 1C: After Case 2 (NO): Case 4 - The Grieving Decision (Competence - Emotional State)**
  > *Eli, experiencing intense, paralyzing grief hours after a partner's sudden death, agrees to sell their cherished family heirloom for a fraction of its value to a persistent dealer who presses them while they are sobbing uncontrollably. Is Eli's consent morally valid?*
      *   **If YES (Consent Valid; grief doesn't destroy competence)** → **Position: Contextual Will Theory**  
          *Most Awkward Commitment:* Allows consent despite severe emotional distress potentially clouding judgment, as long as no explicit coercion or deception occurred and a "choice" was made.
      *   **If NO (Consent Invalid; severe distress impairs competence)** → **Position: Hybrid Competence-Knowledge Theory**  
          *Most Awkward Commitment:* Can struggle to define a clear, non-arbitrary threshold for when emotional distress (or intoxication, etc.) becomes sufficiently impairing to invalidate consent.

  **Branch 1D: After Case 3 (NO): Case 5 - The Misrepresented Procedure (Deception - Nature of Act)**
  > *Dr. Finch tells Gail she needs a "standard diagnostic procedure" involving internal examination, implying it's medically necessary. In reality, it's purely for Finch's prurient interest. Gail consents to the "diagnostic procedure." Was Gail's consent morally valid?*
      *   **If YES (Consent Valid; Gail consented to the physical act performed)** → **Unoccupied Position: Act-Fetishism**  
          *Diagnosis:* Logically possible but practically incoherent/unattractive; reduces consent to mere physical permission, utterly divorcing it from the agent's understanding or purpose, making deception about the *nature* of the act irrelevant. No serious defense.
      *   **If NO (Consent Invalid; deceived about the act's fundamental nature/purpose)** → **Position: Substantive Knowledge Theory**  
          *Most Awkward Commitment:* Must define the precise "core features" of an act that must be understood (e.g., purpose, identity, *key* consequences), potentially leading to line-drawing problems (e.g., is failing to disclose *one* specific risk deception about nature?).

  **Branch 1E: After Case 3 (NO) & Case 5 (NO): Case 6 - The Intoxicated Hookup (Competence - Intoxication)**
  > *Jamal and Kai, both heavily intoxicated at a party (BAC ~0.15%), mutually initiate and enthusiastically agree to sex. Neither is incapacitated (can walk/talk), but neither would have done this sober. Was their consent morally valid?*
      *   **If YES (Consent Valid; mutual, enthusiastic assent despite impairment)** → **Position: Contextual Voluntarism**  
          *Most Awkward Commitment:* Argues consent can be valid under significant impairment (intoxication, potentially emotional states) if assent seems genuine in the moment, raising concerns about true voluntariness and vulnerability.
      *   **If NO (Consent Invalid; intoxication impairs competence below threshold)** → **Position: Strict Competence Theory**  
          *Most Awkward Commitment:* Risks invalidating vast amounts of common sexual activity (e.g., sex after a few drinks) by setting a high bar for cognitive competence, potentially infantilizing agents.

  **Indistinguishable Pair:**
  *   **Contextual Voluntarism (Branch 1E - YES)** and **Contextual Will Theory (Branch 1C - YES)** cannot be reliably separated by this tree.
  *   **Why?** Both are contextual and focus on the presence/absence of coercion/deception in the specific situation, downplaying the role of competence impairments like significant intoxication or severe temporary distress. They converge on "YES" for Case 6 (Intoxicated Hookup) *and* Case 4 (Grieving Decision), as both view the core issue as whether the agreement was forced or tricked, not primarily the internal cognitive state. Distinguishing them requires finer-grained questions about *how* they weigh internal states vs. external pressures in borderline impairment cases, which is difficult to isolate with broad diagnostic cases.

  **Summary of Leaves:**
  1.  **Autonomy Voluntarism** (Occupied)
  2.  **Strict Attitudinal Voluntarism** (Occupied)
  3.  **Contextual Will Theory** (Occupied)
  4.  **Hybrid Competence-Knowledge Theory** (Occupied)
  5.  **Act-Fetishism** (Unoccupied - Incoherent/Unattractive)
  6.  **Substantive Knowledge Theory** (Occupied)
  7.  **Contextual Voluntarism** (Occupied) - *Indistinguishable from Contextual Will Theory here*
  8.  **Strict Competence Theory** (Occupied)

  **How to Use:**
  1.  Present Case 1 to all students.
  2.  Based on their answer, direct them to Case 2 or 3.
  3.  Continue through the tree based on their answers to each case.
  4.  Their path determines the leaf position(s) they most align with.
  5.  Highlight the "awkward commitment" to spark discussion.
  6.  Discuss the indistinguishable pair and unoccupied positions to illustrate the conceptual landscape and boundaries of the debate.
