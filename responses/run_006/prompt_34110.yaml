  ### Brainstorm: Pitfalls in Updating on Conditionals
  1. **Misapplying Conditionalization**: Treating "if A, then B with probability p" as learning the event "A→B" or "A⊃B" leads to errors. Standard Bayesian updating doesn't directly apply.
  2. **Ignoring Antecedent Uncertainty**: Conditional reports (e.g., "if A, then B") may indirectly affect P(A), even though they say nothing explicit about when A is false. Minimizing relative entropy (MRE) can cause P(A) to change—a key insight from the Judy Benjamin problem.
  3. **Inconsistent Ratios**: MRE preserves probability ratios within the antecedent (A) scenarios and within the non-antecedent (~A) scenarios. Failing to enforce this causes incoherent updates.
  4. **Ambiguous Inputs**: Vague conditionals (e.g., "likely if A") or non-exhaustive partitions force analysts to make judgment calls that must be flagged.
  5. **Judy Benjamin Paradox**: MRE can reduce P(A) after learning "if A, then probable B" (e.g., in Judy Benjamin, learning "if in Red territory, 75% chance in Red 2nd" lowered P(Red territory)). Analysts may resist this.

  ---

  ### Procedure: Updating on Conditional Reports  
  **Input**: Prior probabilities over a partition (must include A, B, and their complements).  
  **New Information**: "If A, then probability of B is p."  
  **Output**: Defensible posterior probabilities.  

  #### Step 1: Clarify the Conditional  
  - **Ask**: "What are the **antecedent (A)** and **consequent (B)**? What is the **reported probability p**?"  
  - **Good-enough answer**:  
    - A and B are specific, mutually exclusive events.  
    - p is a number (convert odds to probabilities; e.g., "2:1" → p≈0.67).  
    - If vague (e.g., "likely"), analyst assigns p (e.g., 0.7) and **flags as judgment**.  
  - **Stop if**: A or B is undefined.  

  #### Step 2: Verify the Partition  
  - **Ask**: "Does the partition include **A∩B, A∩~B, ~A∩B, ~A∩~B**? If not, can ~A be treated as a single event?"  
  - **Good-enough answer**:  
    - Partition covers all possibilities (e.g., convoy routes: north/south; ambush locations: pass/bridge/etc.).  
    - If ~A has subcases (e.g., Blue1/Blue2 in Judy Benjamin), aggregate into **~A** for simplicity.  
  - **Stop if**: Partition is incomplete or non-mutually exclusive.  

  #### Step 3: Check Priors  
  - **Ask**: "What are P₀(A), P₀(B), and P₀(B|A)?"  
  - **Good-enough answer**:  
    - P₀(B|A) = P₀(A∩B) / P₀(A) (ensure consistency).  
    - If P₀(B|A) ≈ p, **no update needed**.  
  - **Flag as judgment if**: Priors are estimated from sparse intelligence.  

  #### Step 4: Apply Minimizing Relative Entropy (MRE) Update  
  - **Rule**:  
    - Preserve ratios within A and within ~A.  
    - Set P₁(B|A) = p.  
    - Adjust P₁(A) as needed (may decrease/increase!).  
  - **Procedure**:  
    1. Calculate scaling factors:  
       - Let \( r = \frac{p}{P_0(B|A)} \) (if P₀(B|A) ≠ 0).  
       - Let \( s = \frac{1-p}{P_0(\neg B|A)} \) (if P₀(~B|A) ≠ 0).  
    2. Update probabilities:  
       - \( P_1(A∩B) = P_0(A∩B) \times r \)  
       - \( P_1(A∩\neg B) = P_0(A∩\neg B) \times s \)  
       - \( P_1(\neg A) = P_0(\neg A) \) (unchanged)  
    3. Normalize:  
       - Sum = \( P_1(A∩B) + P_1(A∩\neg B) + P_1(\neg A) \).  
       - Divide all by Sum.  
  - **Good-enough answer**: Posterior probabilities sum to 1.  
  - **Flag as judgment if**: ~A has subcases (use aggregated ~A; full MRE for refined ~A is too slow).  
  - **Analyst resistance expected when**: P₁(A) < P₀(A) despite no direct evidence against A (Judy Benjamin effect).  

  #### Step 5: Sanity Checks  
  - **Ask**: "Does P₁(B|A) ≈ p? Do ratios within ~A match priors?"  
  - **Stop if**:  
    - P₁(B|A) ≠ p (tolerate ±0.05 for estimation error).  
    - Ratios within ~A changed (indicates partition error).  
  - **Document**: All inputs, judgments, and deviations from priors.  

  ---

  ### Worked Examples  
  #### Example 1: Convoy Ambush  
  - **Prior**:  
    - P₀(Convoy north) = 0.6, P₀(Ambush at pass | north) = 0.5.  
    - Partition: north∩pass (0.3), north∩~pass (0.3), south (0.4).  
  - **Report**: "If north, odds of pass ambush are 2:1" → p = 2/3 ≈ 0.67.  
  - **Update**:  
    - r = (0.67) / (0.5) = 1.34, s = (1-0.67)/(0.5) = 0.66.  
    - P₁(north∩pass) = 0.3 × 1.34 ≈ 0.402  
    - P₁(north∩~pass) = 0.3 × 0.66 ≈ 0.198  
    - P₁(south) = 0.4  
    - Sum = 0.402 + 0.198 + 0.4 = 1.0 → **no normalization needed**.  
  - **Posterior**:  
    - P₁(north) = 0.402 + 0.198 = 0.6 (unchanged).  
    - P₁(pass | north) = 0.402 / 0.6 ≈ 0.67 (matches report).  

  #### Example 2: Judy Benjamin Problem (Simplified)  
  - **Prior**: Equiprobable territories (0.25 each): Red1, Red2, Blue1, Blue2.  
  - **Report**: "If in Red (Red1∪Red2), 75% chance in Red2" → p = 0.75.  
  - **Aggregate ~A**: Treat Blue1+Blue2 as ~A (P₀(~A) = 0.5).  
  - **Update**:  
    - P₀(Red2 | Red) = 0.25 / (0.25+0.25) = 0.5.  
    - r = 0.75 / 0.5 = 1.5, s = (1-0.75)/0.5 = 0.5.  
    - P₁(Red2) = 0.25 × 1.5 = 0.375  
    - P₁(Red1) = 0.25 × 0.5 = 0.125  
    - P₁(Blue) = 0.5  
    - Sum = 0.375 + 0.125 + 0.5 = 1.0.  
  - **Posterior**:  
    - P₁(Red) = 0.375 + 0.125 = 0.5 (unchanged).  
    - P₁(Red2 | Red) = 0.375 / 0.5 = 0.75 (matches report).  
    - **Analyst judgment**: Blue1 and Blue2 remain equiprobable (0.25 each).  

  #### Example 3: Analyst-Resisted Update (Judy Benjamin Effect)  
  - **Prior**:  
    - P₀(Enemy attack) = 0.4.  
    - If attack, P₀(Decoy maneuver) = 0.3.  
    - Partition: attack∩decoy (0.12), attack∩~decoy (0.28), no attack (0.6).  
  - **Report**: "If attack, 90% chance of decoy" → p = 0.9.  
  - **Update**:  
    - r = 0.9 / 0.3 = 3.0, s = (1-0.9)/0.7 ≈ 0.1429.  
    - P₁(attack∩decoy) = 0.12 × 3.0 = 0.36  
    - P₁(attack∩~decoy) = 0.28 × 0.1429 ≈ 0.04  
    - P₁(no attack) = 0.6  
    - Sum = 0.36 + 0.04 + 0.6 = 1.0.  
  - **Posterior**:  
    - P₁(attack) = 0.36 + 0.04 = 0.4 (unchanged!).  
    - But wait: **Normalize**? Sum is already 1.0.  
    - P₁(decoy | attack) = 0.36 / 0.4 = 0.9 (correct).  
  - **Analyst resistance**: "Why doesn't P(attack) decrease? A decoy is risky!"  
    - **Procedure response**: Conditional only constrains attack scenarios. MRE preserves ratios within ~A (no attack), so P₁(no attack) remains 0.6. To lower P(attack), **judgment is required** (flag it).  

  ---

  ### What the Procedure **Cannot** Do  
  1. **Handle vague inputs**: Requires precise p; judgment needed for conversion.  
  2. **Update on multiple conditionals**: Use one conditional at a time; iterate if independent.  
  3. **Refine ~A subcases in MRE**: Aggregating ~A is necessary for speed; full MRE is NP-hard.  
  4. **Resolve contradictions**: If reports conflict (e.g., P(B|A)=0.8 and P(~B|A)=0.9), stop.  

  ### What **Never** to Infer from a Conditional  
  - **Never assume P(~A) changes directly**: The report says nothing explicit about ~A.  
  - **Never treat as material conditional**: "If A, then B" ≠ "~A or B".  
  - **Never ignore Judy Benjamin effect**: P(A) can decrease under MRE, even if unintuitive.  

  ---  
  **Time Estimate**: 10-15 minutes per update (after training).  
  **Why Defensible?**: Grounded in MRE (standard for constraint-based updating), transparent judgments, and sanity checks.
