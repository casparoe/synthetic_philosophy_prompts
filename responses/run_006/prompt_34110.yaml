  We are dealing with the problem of updating on conditional information, which is a central challenge in formal epistemology. The classic example is the Judy Benjamin problem. The main issue is that when we get a conditional report (like "If A, then B with probability p"), it doesn't fit neatly into standard Bayesian conditionalization because we are not learning that a particular event occurred. Instead, we are learning a constraint on our credences.

  Key pitfalls:
  1. **Misapplying conditionalization**: Treating the conditional as if it were a material conditional or trying to condition on the truth of the conditional statement. This can lead to violations of the principle of total evidence and other issues.
  2. **Forgetting that the antecedent might be false**: The conditional report only gives information about situations where the antecedent is true. It doesn't directly say anything about when the antecedent is false. However, in some updating rules (like minimizing relative entropy), it can indirectly affect the probability of the antecedent.
  3. **The Judy Benjamin problem**: This highlights that there are multiple ways to update on conditionals and that minimizing relative entropy (which is a common approach) can lead to counterintuitive results. In Judy Benjamin, after learning "if you are in Red territory, then the probability you are in the Red 2nd company area is 3/4", the probability that she is in Red territory actually goes down (which seems odd because the report is only about what happens in Red territory).
  4. **Non-uniqueness of the update rule**: There isn't one universally accepted rule for updating on conditionals. Different rules (like Jeffrey conditionalization, minimizing relative entropy, or others) can lead to different updates.

  The procedure I propose is based on minimizing relative entropy (MRE) because it is a principled method that generalizes Bayesian conditionalization and is widely used in information theory. However, we must be cautious of the Judy Benjamin problem and note that sometimes MRE leads to a decrease in the probability of the antecedent. The procedure will allow for analyst judgment at critical points.

  **Procedure for Updating on Conditional Information**

  **Inputs**:
  - Prior probability distribution P over a partition of events (which should include the antecedent and consequent).
  - The conditional statement: "If A, then B with probability p" (or similar forms).

  **Step 1: Clarify the Conditional**
  - Ask: "What is the antecedent (A) and consequent (B)?"
  - Ask: "What is the conditional probability being reported? (i.e., P(B|A)=p)"
  - *Good-enough answer*: Clear definitions of A and B, and a precise probability value p (or odds, which can be converted to probability). If the report is vague (e.g., "likely"), the analyst must assign a probability (e.g., 0.7) and note that this is an interpretation.

  **Step 2: Check the Partition**
  - Ask: "Does the partition we are working with include A and B? Are there any other events that are relevant and mutually exclusive with A and B? (We need a complete partition to use MRE.)"
  - *Good-enough answer*: The partition should be expanded to include all relevant possibilities. At minimum, we need:
     - A & B
     - A & ~B
     - ~A (but note that ~A might be further divided if there are other relevant events)
  - If the partition is not exhaustive or mutually exclusive, stop and fix it.

  **Step 3: Prior Consistency Check**
  - Ask: "What are the prior probabilities for A, B, and B given A? (i.e., P_old(A), P_old(B), P_old(B|A))"
  - *Good-enough answer*: These probabilities must be consistent (i.e., P_old(B|A) = P_old(A&B) / P_old(A) if P_old(A) > 0). If the prior conditional probability is already p, then no update is needed.

  **Step 4: Choose an Update Rule**
  - We will use MRE (minimizing relative entropy) as the default rule because it is conservative in the sense of changing the prior as little as possible (in terms of Kullback-Leibler divergence) while satisfying the constraint P_new(B|A)=p.
  - However, note that MRE leads to a unique update that:
     - Sets P_new(B|A) = p.
     - Preserves the ratios of probabilities of events within A (i.e., P_new(A&B)/P_new(A&~B) = P_old(A&B)/P_old(A&~B)) and also preserves the ratios within ~A (i.e., P_new(~A & E) / P_new(~A & F) = P_old(~A & E) / P_old(~A & F) for any events E, F in ~A). This means that the relative probabilities of events in ~A remain unchanged, and similarly for events in A (except that we adjust the conditional probability of B given A to p).
