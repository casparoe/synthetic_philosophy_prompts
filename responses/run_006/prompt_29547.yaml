answer: |-
  Your diagnosis of the conceptual roots of the stalemate is astute. The debate isn't primarily stalled by empirical disagreements or formal ignorance, but by **divergent criteria for what it means to "be a computer"** and **differing conceptions of explanation in cognitive science**. Here's a structural breakdown:

  ### The Structure of the Disagreement
  1.  **Verbal/Definitional Core:**
      *   **"Computation" is Polysemous:** The camps use the term with fundamentally different success conditions:
          *   **Strong Computationalism (Fodor/Pylyshyn):** Requires *semantically interpretable*, syntactically structured representations manipulated by rules. Success = *content-carrying symbolic vehicles* causally engaged.
          *   **Implementation Skepticism (Searle/Putnam):** Requires an *observer-independent, intrinsic* mapping from physical states to computational states. Success = objective, non-arbitrary computational description *of the system itself*. Their "triviality" argument targets this criterion.
          *   **Mechanistic Computationalism (Piccinini/Shagrir/Milkowski):** Requires a *physical mechanism* whose components' functions are defined by rules over *vehicle properties* (structural/functional, not necessarily semantic). Success = a *causal structure* matching the computational architecture, independent of observer interpretation (aiming to block triviality mechanistically).
      *   **"Representation" is Contested:** Is it essential? Is it inherently semantic or purely functional/structural? The camps disagree on whether computation necessitates representation at all, and if so, what kind.

  2.  **Substantive Disagreement about Explanation:**
      *   **What Constitutes an Explanatory "Level"?** Classical computationalists see the symbolic level as genuinely explanatory. Skeptics see it as merely descriptive. Mechanists see the mechanistic-computational level as the genuine causal story.
      *   **The Primacy of Mechanism vs. Description:** Skeptics (& some mechanists) demand physical implementation details. Strong computationalists often argue the computational *description* is explanatorily autonomous (cf. Marr's computational level). Mechanists argue computation *is* mechanistic.
      *   **The Role of Content:** Is explaining cognition *fundamentally* about content manipulation (strong comp), or can it be explained mechanistically without intrinsic content (mechanistic comp), or is content-talk *always* observer-relative/illusory (some skeptics)?

  3.  **Clash of Foundational Intuitions:**
      *   **The Literalness Intuition:** Skeptics hold that calling the brain a computer must be more than metaphor; it must literally compute like a designed artifact. Mechanists agree but argue their account satisfies this. Strong comp often emphasizes functional isomorphism.
      *   **The Autonomy of Mind Intuition:** Strong comp is motivated by preserving the distinctiveness of mental phenomena (intentionality, rationality) via symbolic representation. Skeptics see this as dualistic/mysterious. Mechanists aim for physicalist reduction.
      *   **The Triviality Intuition:** Skeptics find it deeply counterintuitive that a rock "computes WordStar." Mechanists/Strong comp find this intuition misleading, arguing their constraints block it.

  ### The Hidden Empirical Question (Limited Role)
  While the core is conceptual, your intuition about neural dynamics is partially correct:
  *   **Empirical Constraint:** The *feasibility* of satisfying the *mechanists'* account (stable, functionally discrete vehicles, clear rule-defined state transitions) is empirical. If future neuroscience reveals brain processes are fundamentally continuous, highly context-dependent, or lack stable functional vehicles, the mechanistic account would face significant challenges. **However:** This wouldn't resolve the debate for the other camps. Strong comp might shift to more connectionist-like representations; skeptics would say "told you so"; mechanists might adapt their vehicle criteria. The core conceptual disagreements (about representation, content, observer-relativity) would persist.

  ### What Would Count as Progress?
  The impasse won't resolve via a single knockout punch. Progress likely requires:
  1.  **Conceptual Refinement & Distinctions:** Sharpening terms like "implementation," "representation," "mechanism," "content." Explicitly distinguishing types of computation (digital vs. analog, symbolic vs. subsymbolic, classical vs. connectionist) and their success conditions. Clarifying the *explanatory goals* (predict behavior? reveal causal structure? capture normative inferences?).
  2.  **Meta-Theoretical Work:** Articulating the *criteria for success* explicitly and arguing for why one set of criteria is preferable for cognitive science. Is it empirical adequacy? Predictive power? Unification? Causal depth? Intuitive satisfaction? This forces confrontation about the aims of the field itself.
  3.  **Novel Formal Constraints:** A formal result providing non-trivial, observer-independent constraints on implementation that are both plausible for biological systems and satisfy key intuitions (e.g., blocking rock-as-WordStar) would be significant, especially for the mechanistic/skeptic axis. However, consensus on its *interpretation* might remain elusive.
  4.  **Successful Mechanistic Modeling:** Concrete examples where the mechanistic computational account provides genuinely novel, empirically validated explanations that seem *causally adequate* in a way descriptions satisfying only the skeptic's minimal criteria do not. This would lend pragmatic weight to the account.
  5.  **Reframing the Question:** Moving beyond "Is the brain a computer?" (which invites definitional stalemate) towards questions like: "Under what specific interpretations of 'computation' and 'representation' do computational models provide genuine explanatory purchase for specific cognitive phenomena at specific levels of analysis?" or "What minimal mechanistic conditions allow us to *treat* a system *as* computing X for explanatory purpose Y?"

  ### Should We Expect Resolution?
  Complete consensus is unlikely. The questions touch on deep philosophical divides (intentionality, reduction, the nature of explanation). However, **productive dissolution or reframing is possible.** The debate can evolve beyond the current stalemate by:
  *   Accepting pluralism: Different computational descriptions serve different explanatory purposes.
  *   Focusing on specific cognitive phenomena and asking which computational framework best explains *them*, rather than seeking a universal answer.
  *   Integrating computational talk more tightly with dynamical systems or embodied/enactive approaches.

  ### What Would Change My Diagnosis?
  My reasoning prioritizes conceptual divergence over empirical blockage. Here's where it could be wrong and what would change it:

  1.  **Empirical Knock-Down:** If decisive neuroscience revealed brain processes fundamentally *cannot* support stable functional vehicles or rule-like transitions (even under the mechanists' broad criteria), it would shift the balance. While the conceptual debate might persist, the *feasibility* of the core computationalist project (strong or mechanistic) would be empirically undermined, making the skeptic's position more salient. This would push my diagnosis towards acknowledging a *hidden empirical constraint* as more central than I currently do.
  2.  **Formal Breakthrough:** If a rigorous formal result (e.g., in complex systems theory, information geometry) provided universally accepted, non-arbitrary criteria distinguishing "genuine" computation from merely describable physical processes *in a way that satisfied all major intuitions*, it would significantly resolve the implementation/triviality axis. This would push me towards seeing the stalemate as more fundamentally *formal* than conceptual/verbal.
  3.  **Revealed Shared Intuition:** If a compelling argument showed that all camps implicitly rely on the *same* core intuition about computation (e.g., information processing for adaptive control), despite their surface disagreements, and that their differences stemmed merely from misunderstandings of that core, it would push me towards seeing the stalemate as more purely *verbal*.
  4.  **Where My Reasoning is Vulnerable:** I might be underestimating the extent to which the *mechanists' empirical criteria* are already being *tested* by modern neuroscience (e.g., debates about neural coding, discrete vs. continuous dynamics, spike timing). If progress here clearly validated or falsified key predictions of the mechanistic account *independently* of the deeper philosophical disputes, it would force me to integrate the empirical dimension more centrally into the diagnosis.

  **In essence:** The debate is primarily a conceptual tangle over definitions, success conditions, and explanatory norms, fueled by deep-seated intuitions. Progress requires untangling these threads through clarification, meta-theory, and pragmatic application, rather than expecting a definitive empirical or formal resolution. The impasse reflects the profound difficulty of fitting the concepts of computation and representation, born in engineering and logic, onto the messy reality of biological cognition.
