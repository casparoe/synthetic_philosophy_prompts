  I'm a CS PhD student working on feedback loops in deployed classifiers—performative prediction, label shift, that whole area. I keep running into philosophers of psychiatry citing Hackings idea that psychiatric classifications change the people they classify (looping effects), and that human kinds are different from natural kinds for exactly this reason. Restate Hackings looping effects and the human-kind/natural-kind distinction in the vocabulary I actually work with: labels, training distributions, concept drift, feedback loops, performativity, distribution shift. Be honest: which parts map cleanly, which need fudging, and what has no counterpart at all in how ML people talk about these loops? Then give me the residue report—is my vocabulary missing something that matters, or is the philosophical point mostly a fancier version of what we already model? Lead with your bottom line in the first sentence, then give the reasoning; no preamble, no restating the question.
