answer: |-
  1.  **Precisely why does hypocrisy negate standing, even when the blame is accurate?** Focus on isolating the necessary and sufficient conditions: is it the blamer's past violation, current disposition, or the communicative act's incoherence? This is the core puzzle; resolving it clarifies the standing/content distinction and is tractable through conceptual analysis and counterexamples. If within a year, plausible models emerge where hypocrisy doesn't undermine standing (e.g., repentant hypocrites), demote it and prioritize complicity (Item 4).
  2.  **Does the hypocrite's lack of standing invalidate the act of blaming itself, or merely render it ineffective or inappropriate?** This targets the nature of standing's effect: is hypocritical blame morally impermissible, pragmatically self-defeating, or merely lacking normative force? It's upstream of blame's function and tractable via analyzing blame's constitutive aims. Difficulty establishing clear disproof for any account within a year suggests prioritizing the function of blame (Item 5).
  3.  **When, if ever, does the absence of a specific relationship negate standing independently of hypocrisy?** Investigate the "meddling" case: is standing inherently relational, requiring authority or direct stake? This tests if "relationship" is a distinct factor and is tractable by mapping boundary cases (e.g., blaming distant wrongs). If relational considerations consistently reduce to hypocrisy or norm-authority issues within a year, demote it for the norm-endorsement question (implied in Item 1).
  4.  **Are the standing defects from hypocrisy, complicity, and meddling fundamentally the same phenomenon or distinct?** Compare mechanisms: does complicity negate standing via shared guilt (distinct from hypocrisy) or also via inconsistency? This taxonomy clarifies if "standing" is unitary and is tractable by contrasting cases. If complicity/hypocrisy defects prove inseparable early on, refocus effort on the core hypocrisy mechanism (Item 1).
  5.  **How does the proposed function or point of blame constrain the conditions for possessing standing?** Examine if accounts linking blame to reciprocity, moral community repair, or protest better explain standing loss (e.g., hypocrisy violates reciprocity). This is meta but crucial for unifying explanations; tractability depends on defining blame's function. If blame's function remains deeply contested early, prioritize refining the hypocrisy mechanism (Item 1) or validity question (Item 2).
