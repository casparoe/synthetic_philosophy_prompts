answer: |-
  Right then, let's get this sorted. Here’s the scenario, crafted to spec:

  **The Indistinguishable Chairs:**  
  Imagine two Windsor chairs, sat side-by-side in a showroom. They are utterly identical in every current, non-historical respect: same precise dimensions, same density of oak grain, same pattern of minute scratches on the seat from identical usage, identical fading of the varnish under the same lamp, even the same faint scent of beeswax polish. Material composition? Atom-for-atom type-identical oak and hide glue. Temperature? Identical. Any intrinsic property you could measure *right now* is shared. However, their origins differ: Chair Alpha was crafted entirely by Alf in his York workshop, using oak from Tree A in the Yorkshire Dales. Chair Beta was crafted entirely by Beth in her Exeter workshop, using oak from Tree B in Dartmoor (though both trees were the same species, age, and grew in geologically identical soil). The *only* discernible difference lies in their causal histories – *who* made them, *where*, and from *which specific source trees*.

  **The Dialectic:**

  1.  **Defender of the Identity of Indiscernibles (IoI):**  
      "Ah, but they *are* discernible! Chair Alpha has the property *being crafted by Alf*, while Chair Beta has the distinct property *being crafted by Beth*. Alpha has *being made from Tree A*, Beta has *being made from Tree B*. These are genuine, individuating properties of the chairs *themselves*, albeit historical ones. Therefore, they don't share *all* properties – they differ in their historical properties – so the Principle of Identity of Indiscernibles stands vindicated. History matters; it's part of what makes an object *this* object rather than *that* one. The case shows we must include an object's causal origin in the set of properties relevant for individuation."

  2.  **Opponent of IoI:**  
      "Nonsense, that’s a cheat! Those so-called 'historical properties' are just sneaky relational properties. Saying 'Alpha was made by Alf' isn't really a monadic property intrinsic to Alpha *now*; it's shorthand for 'Alpha *stands in the having-been-crafted-by relation* to Alf'. It's fundamentally about Alpha's relation to Alf, who exists *outside* Alpha. Similarly, 'being made from Tree A' means standing in a specific causal relation to a past state of Tree A. Black already showed us relational properties cause trouble for IoI – each sphere has the relational property *being two feet from the other sphere*, a property the other lacks precisely because they are distinct. Your 'historical properties' are just relations to *past* particulars (Alf, Beth, Tree A, Tree B). Admitting them doesn't *save* IoI; it either renders it trivial (because *any* two distinct objects will *always* have different relational/historical properties) or simply shifts the problem. The chairs, *considered solely in terms of their current, intrinsic, non-relational state*, are perfect qualitative duplicates. Their distinctness is primitive and brute, not grounded in current qualitative differences. IoI is refuted."

  **The Heavy Lifting: The Commitment to "Pure" Haecceities vs. Property-Bundles**  
  The core dispute hinges entirely on **whether individuation requires non-qualitative 'thisness' (haecceity) or can be achieved purely by qualitative properties (including relational/historical ones).**

  *   **Opponents of IoI (and defenders of primitive identity/haecceity):** Argue that objects possess a primitive, non-qualitative identity ('thisness') that transcends their properties. Properties (especially intrinsic, current ones) describe *what* an object is like, but not *which* particular object it is. Historical/relational properties might *track* distinctness but don't *constitute* it; the distinctness comes first. Including historical properties smuggles in this primitive identity via the back door by referencing other particulars (Alf, Tree A).
  *   **Defenders of IoI (often bundle theorists or those rejecting primitive haecceity):** Argue that an object *just is* the sum total of its properties, qualitative *and* relational, across time. There is no 'bare particular' underneath. Therefore, *any* difference in properties – including historical/relational ones – suffices for discernibility and distinctness. To say the chairs have different historical properties *is* what their distinctness consists in.

  **The Kick: Stripping History & Black's Spheres**  
  If we completely stripped out the historical difference – not just ignoring it, but stipulating that the chairs *also* shared an identical origin (somehow both emerged from the exact same workshop, craftsman, and source timber at the same instant, yet are still numerically two) – then the scenario **collapses structurally into Black's spheres**. We'd have two objects qualitatively identical in every conceivable intrinsic *and* relational/historical respect at the time of consideration. The *only* difference would be their primitive numerical distinctness. This is precisely the situation Black describes: two indiscernible yet distinct objects in a symmetrical universe. The *only* thing distinguishing them would be the brute fact that one is *this one* and the other is *that one* – the very primitive haecceity the opponent of IoI posits, and the defender seeks to avoid.

  **In Summary:**  
  The indistinguishable chairs case highlights the stalemate. The defender uses historical properties to save IoI, claiming they are genuine individuating properties. The opponent cries foul, arguing historical properties are merely relational and thus either trivialise IoI or fail to address the core issue of primitive identity revealed by Black. The battle lines are drawn over whether individuation requires irreducible 'thisness' (haecceity) or can be fully captured by qualitative properties (broadly construed to include history and relations). Without history, the chairs become a classic Black's spheres scenario, forcing the question: are two absolutely indiscernible objects possible? Your mate's seminar debate is essentially wrestling with that foundational metaphysical commitment. Cheers for the puzzle—properly brain-tickling!
