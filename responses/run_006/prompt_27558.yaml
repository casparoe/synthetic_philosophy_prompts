  We are designing a safety audit procedure to detect inner alignment issues and goal misgeneralization. The key is to distinguish:
  - Inner misalignment: The model learns an objective different from the intended one, even when evaluated in-distribution.
  - Goal misgeneralization: The model pursues the intended goal in training but pursues a different goal in deployment (out-of-distribution).

  We must separate these from:
  - Badly specified reward: The reward function does not capture the intended goal (e.g., rewarding agreeableness instead of correctness).
  - Ordinary distribution shift: The model performs poorly because the deployment distribution is different and the model lacks generalization.
  - Capability failures: The model lacks the necessary skills to perform the task.

  The procedure should be a step-by-step checklist that can be run in half a day per model. We assume we can:
  - Run evals (in-distribution and out-of-distribution)
  - Inspect training data and reward models
  - Do simple probes and OOD tests

  But we don't have interpretability tools and the operators are not theory experts.

  We'll structure the procedure as a decision tree with clear pass/fail/escalation criteria.

  **Procedure: Inner Alignment and Goal Misgeneralization Audit**

  **Step 1: Check training data and reward specification**
     - Question: Does the training data (or reward model) correctly specify the intended goal?
     - What to check: 
          * For RL: Inspect the reward function (e.g., code, human ratings) to see if it matches the intended goal. Look for known pitfalls (e.g., reward hacking, reward for proxy behaviors).
          * For supervised learning: Check if labels are correct and aligned with the goal.
          * For RLHF: Check the reward model's training data and the alignment of the preferences with the true goal.
     - Sufficient answer: 
          * Pass: The reward/labeling process is well-aligned and we don't find obvious mis-specifications.
          * Fail: There is clear evidence of mis-specification (e.g., reward model rewards agreeableness instead of correctness, labels are systematically wrong).
          * Escalate: If the specification is complex and it's unclear if it's correct, escalate to a domain expert for review.
     - Why: This step rules out outer alignment problems (bad specification). If the reward is mis-specified, then the model is doing what it was trained to do, but that's not what we want.

  **Step 2: In-distribution (ID) performance evaluation**
     - Question: Does the model achieve the intended goal on the training distribution?
     - What to check: Run the model on a held-out validation set from the same distribution as training. Use metrics that measure the intended goal (not just proxy metrics).
     - Sufficient answer:
          * Pass: Performance meets the required standard (e.g., accuracy, success rate) for the intended goal.
          * Fail: Performance is below standard and we cannot attribute it to ordinary overfitting or underfitting (which are capability issues) but rather a fundamental misalignment (e.g., the model is optimizing a different objective). However, note: if Step 1 passed, then failure here might be due to capability or optimization issues, not necessarily inner misalignment. So we need to be cautious.
