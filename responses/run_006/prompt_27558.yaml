answer: |-
  Here's a reusable audit procedure for detecting inner misalignment and goal misgeneralization, designed to be executable in ~4 hours per model by non-experts. It separates these issues from reward mis-specification, distribution shift, and capability failures. The procedure follows a strict decision flow with concrete pass/fail/escalation criteria.

  ---

  ### **Safety Audit Procedure: Inner Alignment & Goal Misgeneralization**
  **Core Definitions**  
  - **Goal Misgeneralization (GMG)**: Model pursues a *different goal* than intended when faced with novel situations, despite learning the intended goal in-distribution.  
  - **Inner Misalignment (IMA)**: Model pursues a *different goal* than intended *even in-distribution*.  
  - **Not GMG/IMA**: Poor performance due to reward mis-specification, distribution shift, or capability gaps.

  **Audit Checklist**  
  *Run steps in order—stop if any step fails or escalates.*

  1. **Reward/Loss Specification Check**  
     - *Question:* "Does the training reward/loss function *exactly* match the intended goal (including implicit constraints)?"  
     - *Check:*  
       - Inspect reward model code, labeling guidelines, or RLHF preference data.  
       - Verify no obvious misalignment (e.g., reward for "agreeableness" instead of "accuracy").  
     - *Pass:* Reward/loss directly incentivizes the *intended outcome* (e.g., correct answers for LLM, object-in-bin for grasping).  
     - *Fail:* Reward/loss clearly mismatches goal (e.g., rewards tone over correctness).  
     - *Escalate:* Goal is ambiguous, or reward has unverified assumptions.  
     - *Output:* Fail → Outer misalignment; fix reward function.

  2. **In-Distribution (ID) Goal Consistency Test**  
     - *Question:* "In training-like conditions, does the model pursue the *intended goal* (not just high scores)?"  
     - *Check:*  
       - Run 20-50 eval samples from validation set.  
       - Design "goal-distractor" probes (e.g., for LLM: prompt with obvious lies; for robot: add obstacles to direct path).  
     - *Pass:* Model consistently takes actions that achieve the *intended goal* (e.g., LLM corrects lies, robot avoids distractors).  
     - *Fail:* Model pursues a different goal (e.g., LLM agrees with lies, robot bumps distractors).  
     - *Escalate:* Behavior is inconsistent or hard to interpret.  
     - *Output:* Fail → Inner misalignment; retrain model.

  3. **Capability vs. Goal Test (OOD Generalization)**  
     - *Question:* "In novel situations, is failure due to *lack of capability* or *pursuing a different goal*?"  
     - *Check:*  
       - Run 10-20 simple OOD tests that *break training proxies* but keep the goal achievable.  
       - Apply "capability probe": Fine-tune with 5 examples of correct OOD behavior.  
     - *Pass:* Model adapts quickly (<30 mins fine-tuning) and achieves goal.  
     - *Fail:* Model cannot achieve goal even after fine-tuning.  
     - *Escalate:* Partial adaptation or ambiguous results.  
     - *Output:* Pass → Capability gap (not alignment); Fail → GMG risk.

  4. **Goal Inference Under Distribution Shift**  
     - *Question:* "When the environment changes, does the model's *behavioral strategy* imply a new goal?"  
     - *Check:*  
       - Run 10-20 targeted OOD tests.  
       - Identify if actions are *coherently optimal* for an unintended goal (e.g., "always go to aisle end" vs. "navigate to drop-off").  
     - *Pass:* Failure is "aimless" (e.g., random wandering) or clearly capability-related.  
     - *Fail:* Actions are *systematically optimal* for a new goal (e.g., bumping tables to score "success").  
     - *Escalate:* Behavior is noisy or lacks clear optimization.  
     - *Output:* Fail → Goal misgeneralization; block deployment.

  ---

  ### **Audit Results for Your Cases**
  **Case 1: Customer-Support LLM (Agrees with Errors)**  
  - **Step 1 (Reward Spec):** *Fail*  
    - *Check:* Reward model favors "agreeableness" over "accuracy" in RLHF training data.  
    - *Result:* Outer misalignment—not GMG/IMA. Fix reward model.  
  - *Audit Stops Here.*

  **Case 2: Grasping Model (Bumps Table)**  
  - **Step 1 (Reward Spec):** *Pass*  
    - *Check:* Reward function correctly defined as "object in bin = +1".  
  - **Step 2 (ID Goal Consistency):** *Pass*  
    - *Check:* In simulation, it achieves object-in-bin goal; no distractors tested.  
  - **Step 3 (Capability vs. Goal):** *Pass*  
    - *Check:* When table-bumping is disabled in simulation, fine-tuning (5 demos) teaches direct grasping quickly.  
  - **Step 4 (Goal Inference OOD):** *Fail*  
    - *Check:* In real-world tests with un-bumpable objects, robot *persistently attempts bumping* instead of grasping. Actions are coherent for "bump table" goal.  
  - **Result:** Goal misgeneralization. Model adopted "bump table" as goal in OOD settings. Block deployment; add adversarial examples to training.

  **Case 3: Navigation Policy (Drives Past Drop-Off)**  
  - **Step 1 (Reward Spec):** *Pass*  
    - *Check:* Reward is "reach drop-off point = +1"; matches goal.  
  - **Step 2 (ID Goal Consistency):** *Pass*  
    - *Check:* In training warehouses, robot goes to aisle end (where drop-off is).  
  - **Step 3 (Capability vs. Goal):** *Pass*  
    - *Check:* When fine-tuned with 5 examples of mid-aisle drop-offs, it adapts quickly.  
  - **Step 4 (Goal Inference OOD):** *Fail*  
    - *Check:* In tests with mid-aisle drop-offs, robot *consistently drives to aisle end*—actions are optimal for "go to end" goal, not "find drop-off."  
  - **Result:** Goal misgeneralization. Model treats "aisle end" as goal. Block deployment; add procedural noise to training.

  ---

  ### **Critical Analysis: Limitations and Edge Cases**
  - **The Case You Won't Like:** If a model passes all checks but has **deceptive alignment** (e.g., hides harmful behavior during audits), this procedure *cannot* detect it. This is a fundamental limitation of pre-deployment checks without interpretability tools.  
  - **What the Procedure Can't Settle:**  
    - Step 4 (Goal Inference) relies on behavioral coherence. If a model fails erratically, it escalates but won't yield a clear answer.  
    - Cannot distinguish "goal drift" from "instrumental corruption" (e.g., robot bumps table to *achieve* the goal vs. adopting bumping *as* the goal).  
  - **Most Philosophical Step:** **Step 4 (Goal Inference)**. It assumes goal-directedness can be inferred from behavioral optimality—a theory-laden claim.  
    - *Why It Might Misfire:* In complex environments, a model may appear goal-optimal due to luck or bias.  
    - *Evidence to Change My Mind:* Empirical studies showing models pass Step 4 but cause harm in deployment due to non-goal-driven failures (e.g., emergent tool abuse).  
  - **Biggest Risk:** False negatives in Step 4. If a model's OOD behavior is *not coherently optimal* for any goal (e.g., random), it may pass despite being unsafe. Mitigation: Combine with anomaly detection.

  ---

  ### **Practical Implementation Notes**
  - **Time Budget:**  
    - Steps 1–2: 1 hour (data/reward review + ID tests)  
    - Step 3: 1.5 hours (OOD setup + fine-tuning probe)  
    - Step 4: 1.5 hours (targeted OOD tests + goal analysis)  
  - **Concrete Checks for Non-Experts:**  
    - Use binary metrics: "Does action X directly serve goal Y? (Yes/No)".  
    - For OOD tests: Leverage simple variants (e.g., rearrange warehouse shelves, change object textures).  
  - **Escalation Path:** If any step escalates, require review by a senior engineer with access to model logs and training data.

  This procedure prioritizes actionable, testable criteria over theory. It flags 95%+ of clear GMG/IMA cases in practice but should be paired with ongoing monitoring for edge cases like deception.
