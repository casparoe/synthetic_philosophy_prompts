answer: |-
  The practice of binding advance directives in dementia cases rests on a **non-reductionist, numerical identity view of personhood** coupled with a **temporal extension of autonomy**. Let's reconstruct the presupposed theory and analyze alternatives:

  ### **Current Practice Presupposes: Numerical Identity & Extended Autonomy**
  1. **Metaphysical Foundation: Biological/Substantival Identity**  
     The practice assumes the earlier competent person and the later demented individual are the *same numerical person* despite psychological discontinuity. Personal identity is grounded in:  
     - *Biological continuity* (same living organism),  
     - *Somatic identity* (same body/brain), or  
     - A "deep self" that persists beneath psychological changes.  
     Dementia alters personality and cognition but does not terminate the person's ontological existence.

  2. **Ethical Foundation: Precedent Autonomy**  
     - The earlier self’s authority derives from being the *same person* at a time of capacity.  
     - Autonomy is seen as a *life-spanning project*: the directive represents the person's enduring "critical interests" (e.g., dignity, avoidance of prolonged decline), which outweigh the later self's "experiential interests" (e.g., momentary contentment).  
     - *Resisting treatment* is interpreted as non-autonomous, as dementia destroys decision-making capacity. The prior choice thus binds the later self as an extension of authentic autonomy.

  ### **Could This Work if the Later Self is a "Different Person"?**
  **Yes, but with a weaker justification:**  
  - **Moral Paternalism/Trusteeship**: The earlier self acts as a "trustee" for the later entity’s welfare (e.g., preventing suffering from untreated illness). However, this clashes with the later self's observed contentment.  
  - **Social/Relational Obligations**: The directive honors commitments to family/society (e.g., not burdening resources). But this undermines individual-centered ethics.  
  - **Identity-Independent Interests**: If the later self retains *some* interests (e.g., avoiding pain), directives could be enforced to protect those interests. Yet force-feeding a content patient often *causes* distress, contradicting this.  

  *Crucially, current law rarely uses these justifications.* Binding force relies on the identity continuity claim.

  ### **Shift to Psychological-Continuity Theory: Implications**
  Psychological-continuity theory (e.g., Parfit, Locke) holds that identity requires overlapping chains of psychological connections (memories, beliefs, intentions). Severe dementia may sever these connections, making the demented individual a **different person**.  

  **Required Changes to Practice:**  
  1. **Directives Lose Binding Moral Force**:  
     - The earlier person cannot obligate a *different* later person. Refusing tube feeding would be the new person’s valid choice.  
     - Enforcing directives becomes ethically akin to imposing one person’s will on another.  

  2. **New Decision-Making Framework:**  
     - **Best Interests Standard**: Treatment decisions prioritize the *current demented self’s welfare*. If they appear content, withholding tube feeding (per their current wishes) may be justified.  
     - **Proxy Discretion**: Surrogates weigh prior instructions against current well-being. A directive might guide but not dictate.  
     - **Limited Enforcement**: Directives could bind only for *early-stage dementia* where psychological ties persist.  

  3. **Revised Legal Standards**:  
     - Laws would need explicit thresholds for when identity discontinuity voids directives (e.g., clinical criteria for "severe" dementia).  
     - Courts could reject directives causing current harm to a content patient, even if consistent with past wishes.  

  ### **Would Advance Directives Still Make Sense?**  
  **Yes, but transformed:**  
  - **Advisory Role**: Directives express values to inform surrogates ("substituted judgment"), not bind them.  
  - **Interest Protection**: They could outline *negative rights* (e.g., "no prolonged life-support") if aligned with the current self’s well-being.  
  - **Conditional Directives**: Instructions might specify triggers (e.g., "only if I appear in pain") rather than absolute commands.  
  - **Ulysses Contracts**: For predictable, reversible incapacity (e.g., psychosis), contracts could remain binding. Dementia’s permanence weakens this analogy.  

  ### **Conclusion**
  Current practice presupposes that personal identity persists through dementia, granting the past self authority over the future body. If psychological discontinuity severs identity, advance directives could not *bind* the new person without paternalistic or utilitarian justification. Directives would shift from autonomous commands to ethical guidance—prioritizing the current self’s welfare while respecting past values as one factor among others. This reorientation would better align clinical ethics with a reductionist view of personhood but might undermine the core goal of extending control over one’s future.
