  ## Joint Statement: Adversarial Collaboration on Consciousness  
  **Participants:**  
  - **Dr. Eva Rostova** (Cartesian Materialist)  
  - **Dr. Leo Finch** (Multiple-Drafts Theorist)  

  After a year of rigorous debate, we agree on core empirical facts and theoretical constraints while retaining fundamental disagreements about the architecture of consciousness. Below, we outline shared ground, clarify points of contention, and identify empirical cruxes that could resolve our dispute.  

  ---

  ### 1. Agreed-Upon Claims  
  *Both parties endorse the following substantive claims:*  

  1. **The brain processes information in parallel, distributed networks.** Sensory inputs, memory, and cognition involve asynchronous, decentralized neural activity.  
  2. **No homuncular observer exists.** Conscious experience does not require a "little person in the head" observing a unified display.  
  3. **Neural correlates of consciousness (NCCs) are discoverable.** Specific patterns of neural activity are necessary for conscious states, though their nature is disputed.  
  4. **Phenomenology is not infallible.** Subjective reports of experience can be inaccurate (e.g., change blindness, illusions), and timing judgments are often retrospective reconstructions.  
  5. **Binding occurs without a spatial "theater."** Feature integration (e.g., color and shape) is solved by neural synchronization or predictive coding, not a central physical locus.  
  6. **Consciousness serves functional roles.** It enables global access for report, memory, planning, and behavioral control.  
  7. **We reject ontological dualism.** Consciousness is entirely physical and emergent from neural processes.  
  8. **We reject epiphenomenalism.** Conscious states causally influence behavior.  

  ---

  ### 2. Disagreements Table  
  *Key questions, answers, and classification of disagreements:*  

  | (a) Question at Issue                                                                 | (b) Cartesian Materialist Answer                                                                                               | (c) Multiple-Drafts Theorist Answer                                                                                                | (d) Substantive or Verbal? | Justification                                                                                                                                 |  
  |---------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|----------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Q1: Is there a discrete functional stage where distributed information becomes conscious?** | Yes. A threshold exists: when information is globally integrated into a unified representation, it becomes conscious. This stage is the "finish line" for subjective experience. | No. Consciousness is a distributed process of content fixation. There is no single moment of "becoming conscious"; multiple drafts compete for influence without a threshold. | **Substantive** | Disagreement centers on functional architecture. CM posits a critical transition; MDT denies transitions are discrete.                          |  
  | **Q2: Is the content of consciousness at any given moment unified and determinate?**  | Yes. At each moment, consciousness presents a single, coherent scene. Apparent fragmentation (e.g., inattentional blindness) reflects failures to *reach* the integrative stage. | No. The "unity" of consciousness is illusory and retrospective. Parallel, inconsistent drafts coexist; what we call "now" is a narrative reconstruction. | **Substantive** | CM requires a definite "now" with fixed content; MDT treats unity as a post hoc attribution.                                                    |  
  | **Q3: Does consciousness require a privileged neural substrate?**                     | Yes. A specific network (e.g., prefrontal-parietal "global workspace") is necessary to broadcast integrated content to consuming systems. | No. No substrate is privileged. Consciousness arises from coalitions of specialized processors, with no central broadcaster. | **Partly Verbal** | Verbal: "privileged" conflates functional role (CM) with spatial centrality (MDT critique). **Remaining substantive disagreement:** CM insists on a *functional* hub; MDT denies hierarchical access. |  
  | **Q4: Are qualia intrinsic properties?**                                             | Yes. Conscious states have intrinsic phenomenal properties (e.g., the redness of red) that must be explained.                    | No. Qualia are not intrinsic; they are extrinsic dispositions shaped by behavior, memory, and environment. Phenomenology is relational. | **Substantive** | CM invokes intrinsic qualities; MDT reduces phenomenology to functional relations.                                                             |  
  | **Q5: Can the timing of consciousness be objectively defined?**                      | Yes. The moment information enters the integrative stage defines when it becomes conscious, even if reported later.             | No. Timing is always retrospective. The brain assigns timestamps based on utility; there is no "real" time of consciousness.      | **Substantive** | Disagreement hinges on temporal metaphysics: CM accepts "consciousness time"; MDT sees time as a constructed judgment.                           |  

  ---

  ### 3. Cruxes  
  *Empirical tests that could decisively shift one or both positions:*  

  1. **Crux: The Temporal Binding Window**  
     - **Question:** Can the brain simultaneously maintain conflicting conscious contents without integration?  
     - **Test:** Binocular rivalry with variable stimulus onset asynchrony (SOA). Present incompatible images (e.g., face/house) to each eye with delays from 0–100ms. Measure neural (EEG/MEG) signatures of integration vs. competition and subjective reports.  
     - **CM Prediction:** Delays >50ms cause a single integrated percept (e.g., fused face-house). Rivalry occurs only when stimuli *simultaneously* reach the integrative stage.  
     - **MDT Prediction:** Delays up to 100ms produce rivalry (alternating percepts), as drafts compete without mandatory integration.  
     - **Concession:** If rivalry vanishes with minor delays, MDT concedes integration is obligatory. If rivalry persists despite delays, CM concedes no discrete stage forces unity.  

  2. **Crux: The Role of the Prefrontal Cortex (PFC)**  
     - **Question:** Is the PFC necessary for consciousness, or just access/report?  
     - **Test:** Inhibit PFC via TMS in subjects viewing masked stimuli near the detection threshold. Use indirect measures (e.g., priming, pupil dilation) to assess "unreportable" consciousness.  
     - **CM Prediction:** PFC inhibition abolishes *all* conscious perception. Indirect measures will show no trace of stimulus processing.  
     - **MDT Prediction:** PFC inhibition impairs reporting but preserves indirect signs of consciousness (e.g., priming effects).  
     - **Concession:** If indirect effects persist without PFC, CM concedes consciousness can exist without the putative integrator. If all effects vanish, MDT concedes PFC is functionally unique.  

  3. **Crux: Illusory Filling-In**  
     - **Question:** Does the brain generate positive representations for illusory content (e.g., the Kanizsa triangle)?  
     - **Test:** High-resolution fMRI of V1/V2 during illusory contour perception. Search for neural activity matching the illusory edges.  
     - **CM Prediction:** Activity in early visual cortex will spatially map the illusory contours, confirming "filling-in" at the conscious stage.  
     - **MDT Prediction:** No such activity; illusory edges are inferred by higher areas without lower-level reconstruction.  
     - **Concession:** If V1/V2 activity mirrors the illusion, MDT concedes intrinsic representations exist. If not, CM concedes consciousness requires no "rendering" of absent features.  

  4. **Crux: Postdiction vs. Real-Time Consciousness**  
     - **Question:** Is the perceived timing of events determined during initial processing or after delays?  
     - **Test:** The "cutaneous rabbit" illusion (taps on the arm perceived as hopping). Vary inter-tap intervals while recording EEG and measuring perceived location/timing.  
     - **CM Prediction:** The illusion arises *during* somatosensory integration; neural markers of the illusory hop will align with early latency (≤100ms).  
     - **MDT Prediction:** The illusion is postdictive; neural markers will emerge later (200–300ms) as drafts reconcile inputs.  
     - **Concession:** If early neural activity matches the illusion, MDT concedes temporal content can be fixed rapidly. If late activity correlates with reports, CM concedes timing is retrospective.  

  ---

  ### Conclusion  
  We agree on the brain’s parallel architecture and reject dualism, homunculi, and epiphenomenalism. Our residual disagreements are primarily substantive, hinging on:  
  - Whether consciousness requires discrete integration (**Q1, Q2**),  
  - The nature of qualia (**Q4**),  
  - Temporal metaphysics (**Q5**).  

  The verbal disagreement over "privileged substrates" (**Q3**) dissolves when "privileged" is clarified as *functional* (CM) vs. *spatial* (MDT), but the functional hierarchy debate remains. The cruxes above offer concrete paths to resolution. We commit to designing experiments targeting these cruxes, accepting that outcomes could force concessions from either side.  

  ---  
  **Signed,**  
  Dr. Eva Rostova (Cartesian Materialist)  
  Dr. Leo Finch (Multiple-Drafts Theorist)  
  Date: October 26, 2023
