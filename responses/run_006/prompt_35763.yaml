  Let me start by recalling Lewis's actual theory from "Convention: A Philosophical Study." Lewis defines convention as a solution to coordination problems, emphasizing common knowledge and mutual expectations. Coordination games can have multiple equilibria, and conventions stabilize around one of them. Importantly, Lewis doesn't require that conventions be collectively beneficial or egalitarian—just that they solve coordination problems.

  Now, looking at the textbook's first sentence: it accurately captures Lewis's core conditions—regularity, common knowledge, mutual expectations, conditional preference, and arbitrariness. This seems solid.

  The second sentence claims conventions are equilibria in coordination games, which Lewis would accept. But then it says conventions are "always collectively beneficial" and "cannot persist if it systematically favors some." This is where the textbook overreaches. Lewis explicitly discusses cases like driving on the left/right where conventions aren't inherently beneficial but solve coordination. He also acknowledges conventions can be exploitative, like in Schelling's bargaining examples.

  The third sentence about "tacit agreement" is also problematic. Lewis avoids "agreement" language to distance himself from social contract theories. He focuses on behavioral regularities sustained by expectations and preferences, not any form of acceptance.

  The user is right to question the textbook's claims. The collective benefit conclusion doesn't follow from Lewis's actual premises. The textbook seems to be importing normative assumptions that Lewis carefully avoided. I'll need to highlight these discrepancies clearly, showing where the summary drifts from Lewis's precise framework.
answer: |-
  Based on David Lewis's seminal work *Convention: A Philosophical Study* (1969), here's a sentence-by-sentence audit of the textbook paragraph:

  1.  **Textbook Sentence:** "For Lewis, a convention is a regularity in the behavior of a population such that it is common knowledge that everyone conforms to it, that everyone expects everyone else to conform, that each person prefers to conform on condition that the others do, and that some alternative regularity could have served in its place."
      *   **Lewis's View:** **This is largely accurate and captures the core definition.** Lewis defines convention as a regularity R in the behavior of members of a population P when they are agents in a recurrent coordination problem situation S, if and only if it is true that, and it is common knowledge in P that:
          *   Everyone conforms to R.
          *   Everyone expects everyone else to conform to R.
          *   Everyone has approximately the same preferences regarding all possible combinations of actions.
          *   Everyone prefers that *everyone* conform to R, *on condition* that at least all but one conform to R (this is the conditional preference for conformity given others' conformity).
          *   R is not the *only* possible regularity meeting the previous conditions (this is the requirement of arbitrariness/alternatives).
      *   **Minor Nuance:** Lewis emphasizes this occurs within the context of a recurrent *coordination problem*. The "common knowledge" requirement is also central and complex in Lewis's account.

  2.  **Textbook Sentence:** "Because a convention is an equilibrium of a coordination game, each person is at least as well off conforming as not, given what the others do;"
      *   **Lewis's View:** **Lewis would accept the first clause and the core of the second clause.** Lewis explicitly frames conventions as solutions to coordination problems, which are modeled as games with multiple equilibria. In a coordination equilibrium, *given what others are doing*, no single individual can improve their outcome by unilaterally changing their behavior. Therefore, "each person is at least as well off conforming as not, given what the others do" is a correct description of the equilibrium property. Conforming is a best response to others conforming.

  3.  **Textbook Sentence:** "it follows that a convention is always collectively beneficial,"
      *   **Lewis's View:** **Lewis would strongly reject this inference.** This is the critical overstatement.
          *   **Why it's wrong:** Lewis's definition centers on solving a *coordination problem*, not necessarily maximizing collective benefit or achieving Pareto efficiency. A convention ensures coordination, avoiding the *worst outcomes* of miscoordination (e.g., driving on the same side avoids crashes). However, the *particular* coordinated outcome chosen might be far from optimal for the group.
          *   **Lewis's Examples:** He explicitly discusses conventions that are *arbitrary* and not necessarily beneficial in an absolute sense (e.g., driving on the left vs. right; using "Hello" vs. "Ahoy" as a phone greeting). The benefit is primarily *relative to the chaos of miscoordination*, not necessarily an absolute collective gain. A convention could stabilize a suboptimal but coordinated outcome when a better coordinated outcome was possible.

  4.  **Textbook Sentence:** "and that a convention cannot persist if it systematically favors some members of the population over others."
      *   **Lewis's View:** **Lewis would reject this claim.** His theory allows for conventions that are systematically exploitative or unequal.
          *   **Why it's wrong:** Lewis discusses coordination problems embedded within larger strategic contexts. A convention could stabilize an equilibrium where one group consistently gets a worse payoff than another *within the coordination itself*, as long as it's still an equilibrium *for each individual* given the others' actions and expectations. Each member still prefers to conform (to avoid miscoordination penalties) given that others conform, even if their payoff is lower than others'. Persistence relies on the equilibrium property and common knowledge, not on fairness. Schelling's bargaining conventions (e.g., "split the difference") often involve asymmetries.

  5.  **Textbook Sentence:** "What distinguishes a convention from a mere behavioral regularity, on Lewis's view, is that it rests on tacit agreement: the parties must at some level have accepted the rule together, even if no explicit bargain ever took place."
      *   **Lewis's View:** **Lewis would reject the characterization using "tacit agreement" or "accepted the rule together".**
          *   **Why it's wrong:** Lewis is very careful to *avoid* notions of agreement, contract, or obligation in his analysis. He explicitly contrasts his account with social contract theories. What distinguishes convention for Lewis is precisely the complex structure of *common knowledge*, *mutual expectations*, and *conditional preferences* playing out within a recurrent coordination problem. The regularity persists because everyone expects everyone else to follow it, knows everyone expects this, and prefers to follow it themselves given those expectations. It's a self-perpetuating pattern of behavior and belief, *not* based on any prior or implicit collective acceptance or agreement in the usual sense. The "tacit agreement" language smuggles in normative or intentional concepts Lewis deliberately excluded.

  **Conclusion on Collective Benefit:**

  *   The conclusion that "a convention is always collectively beneficial" **does not follow** from the accurate parts of Lewis's definition.
  *   The accurate core (sentences 1 & 2a) establishes that a convention is a self-sustaining equilibrium in a coordination problem. This guarantees coordination, which is *mutually advantageous compared to miscoordination*. **However:**
      *   It does *not* guarantee that the specific coordinated outcome is the best *possible* one for the group. A suboptimal convention can persist.
      *   It does *not* imply that the convention provides some absolute collective benefit beyond avoiding the costs of miscoordination. The benefit is fundamentally *relational* to the coordination problem context.
      *   It explicitly *allows* for conventions that systematically favor some over others, contradicting the claim that such conventions couldn't persist.

  **Summary of Lewis's Position (Based on Audit):**

  1.  Conventions are regularities solving recurrent coordination problems.
  2.  They are defined by common knowledge of conformity, mutual expectations of conformity, and conditional preferences for conformity given others' conformity.
  3.  They are arbitrary (alternatives exist).
  4.  They are Nash equilibria (each person is at least as well off conforming given others' conformity).
  5.  **They are NOT necessarily collectively beneficial in an absolute or optimal sense.**
  6.  **They CAN systematically favor some members over others and persist.**
  7.  **They are distinguished from mere regularities by the structure of common knowledge, expectations, and preferences, NOT by tacit agreement or collective acceptance.**

  The textbook correctly summarizes the core defining conditions but significantly overstates the implications regarding benefit and fairness, and mischaracterizes the grounding mechanism as "tacit agreement." Your suspicion that the second and third sentences slide between distinct claims and overstate a modest thesis is well-founded. Lewis's account is descriptive and game-theoretic, carefully avoiding normative claims about benefit or fairness, and explicitly rejecting agreement-based explanations.
