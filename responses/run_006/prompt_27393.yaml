prompt: |-
  I'm giving a department colloquium in three weeks at a place with a strong philosophy of mind group, and I'm defending a version of disjunctivism about perceptual experience — specifically, the claim that the argument from illusion doesn't actually force us off naive realism, and that the standard disjunctivist move (genuine perception and illusion/hallucination are different *kinds* of mental state) can handle the really sticky cases without collapsing into representationalism. The sticky cases I'm focusing on are the speckled hen (where you seem to see determinately many speckles without counting them) and the Müller-Lyer illusion (where the lines keep looking unequal even after you know they're the same length).

  The audience: two faculty who are committed representationalists and think disjunctivism is just redescribing the same facts with fancier vocabulary; one older guy who still defends sense-datum theory and thinks both sides are making things too complicated; a couple of epistemologists who don't care much about the metaphysics but care a lot about whether disjunctivism actually delivers better epistemic goods (like reflective access to reasons); and about a dozen grad students, half of whom have read the recent back-and-forth between disjunctivists and representationalists in Phil Studies and Mind. 

  I need a Q&A prep sheet. Not the objections I'd get at a perception conference — the objections I'll actually get from *this* room. Please order them roughly by how likely they are to come up and how much damage they'd do if I handle them badly. For each one, phrase it the way that audience member would actually phrase it, give me a two-minute reply, and flag where the reply is softest. Also tell me which objection I should be praying nobody thinks to ask.

  Please think like an expert philosopher of perception who knows the disjunctivism literature cold — the McDowell line, the Martin line, the recent epistemological disjunctivism stuff from Pritchard, all of it. Start by brainstorming the fault lines in my position that each faction in the audience would naturally zero in on, then build the prep sheet from that. And when you give me the replies, be honest about where my position is weakest: I need to know what I should concede up front and what I need to hold the line on. At the end, tell me how confident you are in the overall analysis and single out the point you're least sure of — I want to know where your read of the room might be off.
