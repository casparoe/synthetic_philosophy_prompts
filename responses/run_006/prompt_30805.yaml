  - Calculate initial I-count (MI has 1)
  - Analyze each rule's effect: Rule 1 (unchanged), Rule 2 (doubles), Rule 3 (reduces by 3), Rule 4 (unchanged)
  - Note that modulo 3 is invariant
  - Show start value 1 mod 3 = 1
  - Prove all reachable strings have I-count ≡ 1 mod 3
  - State MU has I-count 0 ≡ 0 mod 3 → contradiction

  The student nails this perfectly. Their invariant analysis is airtight, and they correctly handle edge cases like Rule 3 affecting substrings. Full marks here.

  For the JOOTSing explanation (8 points), a perfect answer should:
