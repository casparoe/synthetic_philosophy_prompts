  > *"The system cannot internally refute MU (i.e., prove ¬MU), but your claim that it 'can neither prove nor refute' MU incorrectly implies formal undecidability. The invariant argument is a meta-level proof of underivability, not a limitation of internal refutation mechanisms—this is why it models Gödelian incompleteness."*  

