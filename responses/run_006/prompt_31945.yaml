  First, I need to recall the key points of situationism from Harman and Doris. Situationism argues that behavior is largely determined by context, not stable character traits. Examples like the Milgram experiment show people obeying authority even when it conflicts with their morals. In Breaking Bad, Walt's transformation could be seen as a result of his circumstances—cancer diagnosis, financial stress, entering the meth trade. Each step escalates his actions, seemingly driven by the situation.

  On the other hand, virtue ethics emphasizes character traits. Walt's pride, ego, and resentment might have been latent. His choices, like rejecting help from Gretchen and Elliot, could indicate deep-seated traits. The show contrasts Walt with Jesse, Mike, and Gus, who react differently to similar situations. Jesse refuses to kill Gale despite pressure, showing character might influence actions.

