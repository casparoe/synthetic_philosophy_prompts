  Also, address the philosophical tension. Situationism downplays character, but the show gives depth to characters' backgrounds and choices. Virtue ethics might struggle with Walt's complexity—he's not wholly corrupt initially, nor does he lack agency. The show presents moral deterioration as a feedback loop: choices reshape character, which influences future choices.

