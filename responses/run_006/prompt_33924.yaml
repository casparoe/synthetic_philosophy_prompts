answer: |-
  ## Self-Portrait with the Interior Judge

  I did what circumstance demanded then,
  When options withered like a blighted vine.
  My motive, clear – to shield from greater pain,
  A lesser hurt inflicted, stark but mine.
  The reasons coil like roots beneath the stone:
  Self-preservation's grit, a debt called due,
  The sharp, swift cut where kindness might have grown,
  Yet blunt necessity insisted *through*.
  I plead the weight of pressures unforeseen,
  The tangled path where mercy lost its light.
  My conscience whispers, *Justified, though keen*
  *The wound you dealt in reason's partial night.*

  Then *he* arrives. The act is seen anew,
  Not through my need, but clear, objective air.
  His gaze, a lens where every shading's true,
  Reveals the bruise I claimed was just to bear.
  Not "shield," he notes, but "strike"; not "less," but "harm";
  A selfish edge gleams where I saw pure steel.
  The narrative I clutched, my fragile charm,
  Unravels as his silent thoughts congeal.

  **He stands apart, yet sculpted by my hand,**
  **This blindfolded statue I pretend is free.**
  **The voice that damns across the gulf I planned**
  **Is but my shadow, cast accusingly.**
  **The judge who holds the mirror to my flaw,**
  **His stern rebuke, his cold, impartial word,**
  **Is artifice I drafted without flaw,**
  **A phantom scale my anxious mind conferred.**

  **This inner arbiter, so stark, so dread,**
  **Who finds the guilt my pleading would erase,**
  **Is yet my own invention overhead –**
  **My crafted jury in this mirrored space.**
  **And on this giddy ledge of self-despair,**
  **I watch the judge condemn… and know my own hand placed him there.**

  ---

  **Notes on the Execution:**

  *   **Octave:** The first eight lines present the speaker's self-justification using first-person perspective ("I did," "My motive," "I plead"). Language like "lesser hurt," "necessity," "partial night," and "plead" underscores the defensive, constructed narrative.
  *   **Volta:** Line 9 ("Then *he* arrives.") marks the sharp turn. The shift to third person ("he," "his gaze") and passive voice ("is seen") immediately objectifies the speaker's action. Words like "objective air," "true," "notes," "reveals," and "unravels" establish the spectator's dispassionate analysis, contrasting the octave's pleading.
  *   **Sestet & Tension:** The sestet (lines 9-14) explicitly holds the contradiction. The impartial spectator ("he," "judge," "arbiter") is depicted as separate and condemning ("damns," "rebuke," "condemn," "guilt"). Yet, simultaneously, the poem relentlessly exposes his constructed nature ("sculpted by my hand," "artifice I drafted," "phantom scale," "my own invention," "crafted jury," "my own hand placed him").
  *   **Closing Couplet:** The final two lines land on the vertigo of this realization. The speaker *watches* the condemnation ("condemn") while simultaneously acknowledging agency in creating the condemning figure ("know my own hand placed him there"). "Giddy ledge" captures the unsettling instability of this self-reflective paradox.
  *   **Smithian Recognition:** Key Smithian concepts are integrated poetically: the external perspective ("clear, objective air," "lens"), the revelation of self-deception ("narrative... unravels," "selfish edge gleams"), and the core paradox of the self-created judge ("sculpted by my hand," "artifice I drafted," "phantom scale... conferred," "my own invention").
  *   **Poetic Integrity:** The language employs metaphor ("blighted vine," "lens," "sculpted," "blindfolded statue," "phantom scale," "giddy ledge," "mirrored space"), enjambment, and strong imagery to convey the psychological struggle without resorting to dry exposition. The form (Petrarchan sonnet with ABBA ABBA CDCDCD rhyme scheme) provides the required structure.
