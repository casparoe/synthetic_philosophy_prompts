    - A: Costly signal to predator (Zahavi)
    - B: Index of fitness (index view)
    - C: Sensory exploitation? Not really. Or maybe: the cheetah has a preexisting bias to notice high jumps? That seems forced. Instead, let's do:

    - A (Zahavi): The stotting is a costly and risky display that only the fittest gazelles can perform, which honestly signals to the predator that they are too fast to catch.
    - B (Index): The stotting is a direct and automatic manifestation of the gazelle's physical condition, so it honestly indicates speed and stamina without being an evolved cost.
    - C (Common-interest? Not applicable. Instead, perhaps a view that it's not a signal at all, but that's not in our theories. Alternatively, we can have an option that it is a signal to other gazelles to follow, which would be common interest among gazelles. But the original example is for the predator. Let's stick to the predator and note that common-interest doesn't apply. Instead, we can have an option that it's a signal of vigilance or to deter pursuit by making the gazelle appear more difficult to catch (which might be a form of index). 

  Alternatively, we can skip stotting for now and come back.

  Question 3: Honeybee waggle dance
  - Bees communicate the location of food sources by dancing.
    - This is a classic case where common-interest is strong because the colony shares the same goal.
    - Also, it's relatively cheap and honest.
    - However, there can be some conflict (e.g., if a bee finds a private food source, but in general, the colony is cooperative).
