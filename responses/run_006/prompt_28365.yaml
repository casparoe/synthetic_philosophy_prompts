  3. Index signal view: Signals are honest because they are physically tied to the trait (no strategic cost required).
  4. Common-interest view: When interests align, signals can be cheap and honest.
  5. Sensory exploitation view: Signals evolve to exploit receiver biases; honesty is a side effect.

  We also note that some positions (like thinking all signals are costly handicaps, including honeybee dances) are not defended by anyone and why.

