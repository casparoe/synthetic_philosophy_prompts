answer: |-
  Below is a complete "Which Signaling Theory Do You Hold?" quiz designed for your science blog. It uses concrete cases to sort readers into one of five positions without requiring prior knowledge of the theories. Each question has three intuitive answer options that tease apart different theoretical commitments. I've included a scoring key and a note on limitations.

  ---

  ### **Quiz: Which Signaling Theory Matches Your Intuitions?**
  **Instructions:** For each scenario, pick the answer that *most closely* aligns with your intuition. Don't overthink it—go with your gut!

  #### **Question 1: Peacock Tails**  
  *Peahens prefer males with large, colorful tails, even though these tails make it harder for the peacock to escape predators. Why might this preference exist?*  
  - **A**: The tail is a heavy burden—only truly healthy males can survive despite it, proving their fitness.  
  - **B**: The tail’s size/color directly reflects the male’s diet and parasite load, making it a reliable health gauge.  
  - **C**: Peahens naturally love flashy displays; the tail evolved to hijack this preference, with cost being irrelevant.  

  #### **Question 2: Gazelle Stotting**  
  *When a gazelle spots a cheetah, it sometimes jumps high in the air ("stotting") instead of fleeing. Why would it do this?*  
  - **A**: Stotting wastes energy and time—only gazelles fit enough to escape *despite* this cost can afford it, signaling they’re not worth chasing.  
  - **B**: Stotting is a physical display of the gazelle’s speed/stamina, which is impossible to fake.  
  - **C**: Stotting exploits the cheetah’s instinct to pause at sudden movements, buying escape time.  

  #### **Question 3: Honeybee Waggle Dances**  
  *Honeybees perform "waggle dances" to direct hive-mates to food. How is this signal reliable?*  
  - **A**: The dance is cheap to perform, and bees share a goal (colony survival), so there’s no incentive to lie.  
  - **B**: The dance’s duration/angle automatically mirrors the bee’s flight path, requiring no strategic cost.  
  - **C**: Dancing is exhausting—only bees finding high-quality food will pay this cost, keeping it honest.  

  #### **Question 4: Nestling Begging**  
  *Baby birds beg loudly for food, even though this can attract predators. Why do parents respond?*  
  - **A**: Begging is risky and energy-intensive—only truly hungry chicks can bear this cost, proving their need.  
  - **B**: Parents/chicks both want the chick to survive, so begging can be honest without needing costs.  
  - **C**: Begging calls/gapes exploit parents’ preexisting sensitivity to loud sounds and bright colors.  

  #### **Question 5: Frog Calls**  
  *Male frogs call to attract females, even though calling makes them vulnerable to predators. Why are females drawn to louder calls?*  
  - **A**: Calling is dangerous and draining—only high-quality males can afford it, signaling their fitness.  
  - **B**: Call pitch/volume is physically tied to the male’s size and health, making it unfakeable.  
  - **C**: Females have an innate bias for loud sounds; calls evolved to exploit this, with cost as a byproduct.  

  #### **Question 6: Human Luxury Goods**  
  *Why might someone buy a $10,000 watch that tells time no better than a $20 one?*  
  - **A**: The watch is a financial burden—only the wealthy can afford it, proving their status.  
  - **B**: The cost is in money (the same currency as wealth), so it reliably separates rich from poor.  
  - **C**: Luxury items tap into our innate desire for prestige; cost isn’t what makes them effective.  

  #### **Question 7: Anglerfish Lures**  
  *Anglerfish dangle a fleshy lure that mimics prey to attract smaller fish, which they eat. How does this work?*  
  - **A**: The lure is costly to grow/maintain—only healthy anglerfish can afford it, honestly signaling their hunting skill.  
  - **B**: The lure’s movement/smell is physically tied to the fish’s vitality, making it a reliable index.  
  - **C**: The lure exploits the prey’s instinct to chase small, wiggling objects; honesty is irrelevant.  

  ---

  ### **Scoring Key**  
  Tally how often you chose each letter below. Your dominant letter (with the highest count) maps to a theory. If tied, read the descriptions to see which resonates most.  

  - **Mostly A**: **Strong Zahavi View**  
    You see signals as "handicaps": honesty comes from costs (energy, risk, resources) that only high-quality individuals can afford. Weak or dishonest signalers can’t fake it because the burden would break them.  
    *Example match: Gazelle stotting (Q2A)*  

  - **Mostly B**: **Index Signal View**  
    You think signals are honest because they’re physically/physiologically linked to the trait (e.g., tail brightness reflects immune health). Costs might exist but aren’t *strategically* necessary—it’s about automatic, unfakeable ties.  
    *Example match: Peacock tails (Q1B)*  

  - **Mostly C**: **Sensory Exploitation View**  
    You believe signals work by "hijacking" receivers’ preexisting biases (e.g., attraction to bright colors). Honesty is coincidental or irrelevant—manipulation is key. Costs may arise but aren’t the driver.  
    *Example match: Anglerfish lures (Q7C)*  

  - **If A/B tied (or mixed)**: **Grafen Strategic Equilibrium View**  
    You emphasize that costs must be paid in the *same currency* as the advertised trait (e.g., wealth signals require financial costs). Unfit individuals *could* try to cheat, but the cost would disproportionately burden them, creating a "separating equilibrium."  
    *Example match: Human luxury goods (Q6B)*  

  - **If A/B tied (or mixed with Q3A/Q4B)**: **Common-Interest View**  
    When senders/receivers share goals (e.g., hive survival), signals can be cheap and honest without costs. Conflicts (e.g., parent-offspring) might introduce costs, but cooperation reduces them.  
    *Example match: Honeybee dances (Q3A)*  

  ---

  ### **What This Quiz Can and Can’t Do**  
  - **Blurred Lines**:  
    - **Grafen vs. Zahavi**: These often overlap intuitively (e.g., both explain peacock tails with costs). Grafen’s "same currency" idea (Q6B) is the clearest separator, but in practice, they’re hard to split.  
    - **Common-Interest vs. Index**: Both downplay costs, but common-interest (Q3A/Q4B) focuses on shared goals, while index (Q1B/Q2B) focuses on physical constraints.  
  - **"Empty" Positions Not Included**:  
    - "All signals are costly handicaps" (e.g., "Honeybee dances must be exhausting to be honest") ignores cases like bee dances, where low cost + shared goals ensure reliability.  
  - **Why It Works for Non-Experts**:  
    Questions avoid jargon and use relatable cases (e.g., luxury goods). Intuitions about "burdens," "automatic ties," or "exploiting biases" cleanly map to the theories.  

