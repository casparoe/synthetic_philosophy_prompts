    - Answer B (Index): The tail size and brightness are directly linked to the peacock's health and parasite resistance, so they don't require additional costs to be honest.
    - Answer C (Sensory exploitation): The tail evolved because peahens have a preexisting preference for bright, moving objects, and the cost is irrelevant.

  But note: Grafen and Zahavi might be similar here. We might need to separate them in a different question.

