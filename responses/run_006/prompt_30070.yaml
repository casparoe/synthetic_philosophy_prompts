prompt: |-
  I am a doctoral student in moral philosophy, and I have been trying to determine when, if ever, it is legitimate for me to take another person's word for a moral judgment. I do not mean moral advice, where someone offers considerations I can assess for myself, nor empirical information that bears on a moral question. I mean deference: adopting a moral verdict on another's say-so, roughly as I would adopt a factual report. My spontaneous reactions to cases have come out unevenly, and I would like to know whether any principled account unifies them.

  Here are the cases. (a) A friend who knows football well tells me a tackle in a match I did not see was a foul; I accept that immediately. When she adds that the tackle was cowardly, I refuse to endorse the moralized description until I have watched the clip. (b) A colleague sends me a careful account of why our department's new grading policy is unfair to first-generation students, and I adopt her verdict almost at once. (c) My partner, who knows me unusually well, tells me I was unfair to a student in office hours. I accept the factual details, but I resist making the judgment that I was unfair my own until I have gone over the exchange myself. (d) An aid worker with many years in refugee camps tells me that a well-intentioned practice common among visiting volunteers is degrading to the people it is meant to help; I defer to her verdict without hesitation. (e) A friend from a marginalized group tells me a joke I made at dinner was offensive; I accept this immediately and apologize, even though I cannot yet say what made it offensive. (f) A hospital triage committee on which I do not sit issues a report concluding that a certain protocol for allocating ventilators is just. I am willing to vote for the protocol and to cite the report, but I do not feel that I know the protocol is just.

  The pattern I cannot see is this. I resist my partner's verdict about my own conduct in (c), yet I defer in (d) to a verdict about conduct I have never witnessed and in (e) to a verdict about a joke I myself made. Is there one principle about moral deference—about when another person's moral say-so suffices for me to adopt the judgment as my own—that captures all six reactions, or nearly all of them? If the best principle forces me to revise some of my verdicts, which should I give up, and why? Finally, what does that principle say about a further case I have not settled: a moral philosopher whose work I admire tells me, without offering an argument, that a certain kind of political compromise is morally impermissible. Should I take that on trust?
reasoning: |-
  Okay, I need to help this doctoral student in moral philosophy figure out when it's legitimate to defer to others' moral judgments. They've provided six cases with different reactions and are looking for a unifying principle. Let me start by understanding each case again.

  In case (a), the person accepts a factual foul call from a football expert but hesitates on the moral judgment of "cowardly." That makes sense because moral terms like "cowardly" carry evaluative weight. Case (b) involves accepting a colleague's detailed analysis on a grading policy being unfair. The key here is the thoroughness of the colleague's account, which provides context and reasoning. 

  Case (c) shows resistance to the partner's judgment about the user's own unfairness. People often feel they need to personally evaluate their own actions. Case (d) is deferring to an aid worker's expertise about a degrading practice. The aid worker's experience in refugee camps gives them epistemic authority on what's degrading in that specific context. 

  Case (e) involves immediate acceptance of a marginalized friend's claim that a joke was offensive. This seems tied to the friend's lived experience. Case (f) is about accepting a triage committee's report for practical purposes but not feeling internal conviction. Here, the user is trusting the process rather than the moral judgment itself.

  Hmm, the main conflict is between resisting the partner's judgment in (c) but deferring in (d) and (e). What's the difference? The aid worker has contextual expertise, and the friend in (e) has experiential authority. The partner might have personal insight, but the user feels the need for self-assessment when it's their own actions. 

  So a possible principle could be that moral deference is legitimate when the other person has superior access to either the relevant facts or the evaluative framework. In (d), the aid worker understands the cultural context; in (e), the friend understands the offensive impact due to their identity. In (c), the user might think they have equal access to the evaluative framework. 

  But wait, why defer in (b)? The colleague's thorough analysis provides both facts and the application of fairness principles. The user trusts the colleague's ability to apply those principles. In (f), the committee's structured process is trusted for decision-making, but not for personal moral knowledge. 

  The user also asks about a moral philosopher's verdict. The principle here might depend on whether the philosopher is an expert in the specific domain. If it's their area of specialization, deference could be legitimate, but if not, maybe not. 

  The revised cases: (a) and (c) resistance is appropriate because moral terms need personal evaluation, especially for one's own actions. The outlier is (c) where the partner's deep personal knowledge might justify deference, but the user's instinct to self-reflect is understandable. 

  So the core principle is epistemic authority in the specific context versus the need for personal moral understanding. Deference is legitimate when the other has superior epistemic access due to experience, expertise, or context, except when personal moral agency is at stake, like in self-assessment.
answer: |-
  Your case reactions reveal a coherent pattern grounded in **epistemic access and moral agency**. The unifying principle is:

  **Moral deference is legitimate when the other person possesses superior epistemic access to either:  
  (a) the non-moral facts that morally determine the case (factual grounding), OR  
  (b) the relevant moral framework/lens required to interpret those facts (evaluative authority),  
  AND where personal moral agency isn't directly compromised.**

  This principle accounts for your reactions:

  ### Case Analysis
  1. **Football foul (a)**:  
     - *Accept factual "foul"*: Expert has superior access to rule-based facts.  
     - *Reject "cowardly"*: Requires moral interpretation of intent/character. No evidence your friend has superior evaluative access here. ✅ Consistent.  

  2. **Grading policy (b)**:  
     - *Defer*: Colleague has superior access to *structural facts* (policy impact on first-gen students) that determine unfairness. Fairness here is factually grounded. ✅  

  3. **Your office conduct (c)**:  
     - *Resist*: While your partner knows the facts, *you* have equal/better access to your intentions/context. Deferring would surrender core moral agency over self-evaluation. ✅  

  4. **Aid worker (d)**:  
     - *Defer*: The worker has unique evaluative authority—they understand the *cultural context and lived experience* that determine "degradation." You lack this lens. ✅  

  5. **Marginalized friend & joke (e)**:  
     - *Defer*: Your friend has superior epistemic access to the *social meaning and harm* of the joke due to lived experience. Their evaluative authority is irreplaceable. ✅  

  6. **Triage committee (f)**:  
     - *Accept procedurally but not personally*: The committee has superior access to medical/operational facts, but justice requires weighing values *you* must own. Delegating the *decision* ≠ adopting the *judgment*. ✅  

  ### Resolving the Apparent Conflict (c vs. d/e)
  - In (c), **no unique epistemic advantage** exists for your partner; moral agency dominates.  
  - In (d) and (e), the speakers **possess irreplicable epistemic access** (cultural context/lived experience). Deference doesn't violate agency because you *couldn't* fully access the relevant moral lens alone.  

  ### Revised Verdicts
  Your intuitions are largely sound, but **revise (c)**:  
  - If your partner *truly* has deeper insight into your implicit biases or blind spots (superior access to facts about *your conduct*), deference *can* be legitimate. Resisting purely because it's "your" action confuses moral ownership with epistemic independence.  

  ### The Philosopher Case
  For the moral philosopher claiming a political compromise is impermissible:  
  - **Do NOT defer blindly**. Ask:  
    - Is this their **specialized domain** (e.g., political philosophy vs. metaethics)?  
    - Are there **shared moral frameworks** (e.g., you both accept deontology)?  
  - **Principle application**:  
    - If they have deep expertise in *this specific issue* (e.g., compromise in transitional justice), AND their judgment relies on nuanced facts/frameworks you can't access alone → *Deference may be legitimate*.  
    - If it's a general verdict without context → **Reject**. Moral philosophy requires engagement with reasons, not authority.  

  ### Why This Works
  - **Epistemic humility** (acknowledging others' superior access) balances **moral autonomy**.  
  - **Factual grounding** (b, f) and **evaluative authority** (d, e) are distinct pathways to legitimacy.  
  - **Moral agency** is preserved when deference is epistemically required, not just convenient.  

  This framework justifies your instincts while offering a principled basis for moral deference—one that avoids both rigid self-reliance and uncritical reliance on others.
