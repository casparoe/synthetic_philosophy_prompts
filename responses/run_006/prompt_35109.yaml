answer: |-
  ## Joint Statement on Cognitive Penetrability of Perception  
  *(Following Adversarial Collaboration Workshop)*  

  We, undersigned proponents and skeptics of cognitive penetrability (CP), having engaged in sustained good-faith collaboration, hereby affirm substantial common ground while clarifying the nature and locus of our persisting disagreements. This statement reflects concessions made by both sides and identifies the precise empirical and conceptual questions requiring resolution.

  **Common Ground:**  
  We concur that perception is an active, inferential process shaped by prior expectations and experience, implemented through hierarchical neural architectures with robust top-down signaling. Cognition, broadly construed as beliefs, concepts, goals, and knowledge states, demonstrably influences *where* we attend and *how* we interpret sensory input. Attention—whether driven exogenously or endogenously—is a crucial interface mechanism, demonstrably modulated by cognitive states and capable of altering the input to perceptual systems and subsequent processing stages. Methodologically, we agree that establishing genuine CP requires stringent controls to eliminate confounds from: (a) post-perceptual judgment or response bias (e.g., via indirect measures, stimulus degradation, or criterion-free paradigms); (b) shifts in attentional allocation *preceding* the perceptual act; and (c) strategic task demands altering reporting rather than experience itself. Both sides accept that failures to control for these in past studies weaken many claims on both sides. Critically, we agree that perceptual experience possesses a distinctive *phenomenal character* (the "what it's like" of seeing red, hearing a tone) and that the core dispute concerns whether cognition can alter *this character itself*, not merely the judgments based upon it.

  **Precise Remaining Disagreement:**  
  *Proponents of CP* maintain: **Cognitive states (e.g., beliefs, desires, conceptual knowledge) can directly alter the *phenomenal content* of perceptual experience (e.g., the experienced color, shape, or loudness of a stimulus), not solely by directing attention to different stimuli or features, nor solely by influencing post-perceptual judgment, but by modulating the perceptual processing stream itself in a content-specific manner.**  
  *Skeptics of CP* maintain: **While cognition profoundly influences attention, interpretation, and judgment, the *phenomenal content* of perceptual experience is determined solely by the sensory input interacting with dedicated, domain-specific perceptual modules and learned perceptual priors. Cognitive states can only influence perception indirectly via attention (selecting the input) or by biasing post-perceptual processing; they do not penetrate the core processes generating the experiential qualities themselves.**

  **Cruxes and Agreed-Upon Tests:**  
  Our disagreement hinges on resolving the following specific questions. For each, we outline an experimental paradigm both sides accept as probative and record our pre-registered predictions:

  1.  **Crux 1: Does Conceptual Priming Alter Low-Level Sensory Phenomenology Under Strict Response Bias Controls?**  
      *Paradigm:* Use Continuous Flash Suppression (CFS) with ambiguous stimuli (e.g., Rubin Vase/Faces) rendered consciously invisible. Prime participants with a congruent or incongruent concept (e.g., "vase" vs. "faces"). Employ a criterion-free task like stimulus detection latency upon breakthrough from suppression (where faster detection indicates stronger initial unconscious processing). Crucially, include a post-perceptual discrimination task with identical stimuli to measure and factor out any pure response bias.  
      *Pro-CP Prediction:* Congruent primes will significantly reduce breakthrough times compared to incongruent primes, even after controlling for measured response bias, indicating altered phenomenal processing strength *before* conscious access.  
      *Anti-CP Prediction:* Any priming effect on breakthrough times will be fully accounted for by measured response bias in the discrimination task; no significant residual effect on detection latency will remain.

  2.  **Crux 2: Do High-Level Beliefs Systematically Alter Veridical Low-Level Percepts in Non-Ambiguous Scenarios?**  
      *Paradigm:* Present physically identical stimuli (e.g., a specific shade of green) under two conditions: one where subjects believe it is "organic" paint, another where they believe it is "toxic synthetic" paint (verified belief manipulation). Use a direct, non-comparative perceptual matching task (e.g., adjust a color wheel to match the *appearance* of the stimulus) and a separate affective rating scale. Control for mood/affect confounds.  
      *Pro-CP Prediction:* The adjusted color match will systematically differ (e.g., rated "more vibrant" for "organic") between belief conditions.  
      *Anti-CP Prediction:* Perceptual matches will be identical across belief conditions. Beliefs will only affect the affective ratings, not the perceptual match itself.

  3.  **Crux 3: Does Cognitive State Modulate Early Sensory Neural Activity in a Content-Specific Way?**  
      *Paradigm:* Utilize high-resolution neuroimaging (e.g., MEG or high-density EEG) while participants view stimuli whose interpretation can be cognitively biased (e.g., a Necker cube with instruction to see one perspective). Employ multivariate pattern analysis (MVPA) to decode the perceived orientation/content from early (e.g., <150ms) sensory cortex activity (e.g., V1-V3).  
      *Pro-CP Prediction:* MVPA decoding of the perceived orientation will be significantly above chance in early visual cortex based solely on neural activity *before* the typical onset of reported conscious percept switches, and this decoding will correlate with the cognitive instruction.  
      *Anti-CP Prediction:* While later activity (e.g., in parietal/frontal areas) will decode the instructed percept, early sensory activity (V1-V3) will primarily reflect the physical stimulus and show no reliable content-specific modulation by cognitive instruction before conscious report. Any early effects will correlate with micro-saccades or attentional shifts, not content-specific phenomenal states.

  **Addressing the Verbal Dispute:**  
  A significant portion of historical disagreement stems from *boundary drawing*. Skeptics often define "perception" narrowly as early, stimulus-driven, modular processing yielding phenomenal character, labeling later, more interpretative stages as "cognition" or "judgment." Proponents often adopt a broader view, encompassing more stages of processing as genuinely perceptual. **The verbal element lies specifically in deciding *where* to draw the line between "perceptual experience" and "perceptual judgment."** Our collaboration clarifies that the *substantive* disagreement survives this clarification: it concerns whether cognitive states directly influence the processes generating the core sensory qualities (e.g., hue, pitch, basic shape) that both sides agree constitute the phenomenal bedrock of perception, *irrespective* of whether one labels slightly later interpretative stages as perceptual or cognitive. Our agreed tests (Cruxes 1 & 2) focus precisely on altering this bedrock phenomenology. The neural crux (3) targets the specific mechanisms involved.

  **Conclusion:**  
  We affirm that resolving the CP debate requires not just new experiments, but experiments designed to decisively test these specific, pre-agreed cruxes under mutually accepted stringent controls. The core disagreement is empirical: Does cognition directly shape the fundamental qualities of our sensory experience, or are these qualities generated by cognitively impenetrable processes, with cognition acting only before (via attention) or after (via judgment) the core perceptual act? We commit to accepting the outcomes of well-executed tests of these cruxes as bearing directly on the viability of our respective positions. This joint statement reflects a significant narrowing of the debate onto empirically tractable ground.
