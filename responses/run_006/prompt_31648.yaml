  The dust still hung thick in the Emergency Hub, tasting of concrete and dread. Finn wiped grit from his eyes, the beam of his helmet lamp jerking wildly as he scanned the schematics projected onto the cracked wall. His hands trembled, a tremor that started deep in his gut and vibrated outwards.

  "Finn! Talk to me!" The voice crackled in his earpiece, strained, urgent. Tom, his friend and shift supervisor, was topside coordinating the chaos.

  "They're both unstable, Tom," Finn rasped, his throat raw. "East Wing, Basement Lab: five researchers. Structural collapse imminent. Heat signatures fading. West Wing, Sub-Level Storage: one. Maya. Maintenance tech. Trapped behind a collapsed coolant pipe. Pressure building."

  He didn't need to add the rest. The coolant was inert, but the pressure... if it blew before they got her out, the force would be catastrophic for her confined space. The researchers were pinned under debris in a larger chamber – critically injured, dying, but the space itself *might* hold a little longer. Resources were stretched thin. He had his team, but only one set of heavy rescue cutters and the specialized plasma torch needed for Maya's pipe. Only one could be done *now*. The other… would have to wait. Maybe too long.

  Tom’s voice was clipped, devoid of the pub-brawl passion from last night. "East Wing, Finn. Five lives. Five families. The research data in there could save thousands more. You know the numbers. Do the math."

  *The math.* Last night’s argument flooded back – the clink of glasses, Tom’s face flushed with conviction: *"One life versus five? It’s arithmetic, mate! Done!"* Finn had argued back, voice tight with frustration, invoking Scanlon: *"It’s not just adding! What reason could you possibly give to the one person you leave to die? 'Sorry, pal, but five is bigger than one'? That’s not justification, that’s brutal accounting!"*

  Now, the brutal accounting was real. Five brilliant minds, crucial work, five beating hearts. Against one. Maya. She fixed the coffee machine when it broke. She always had a packet of those awful licorice sweets she’d offer with a shy smile. Last week, she’d nervously asked Finn to check a rattling pipe in Sector 7, worried it might be unsafe for others. He’d reassured her. Now *she* was the one in the unsafe pipe.

  His boots crunched on debris as he moved towards the fork in the ruined corridor. Left: a steep, treacherous climb down rubble towards the groaning, dust-shrouded entrance to the East Wing basement. Right: a jagged crawlspace leading towards the ominous hiss and metallic creak emanating from Sub-Level Storage.

  His team stood behind him, waiting for the order. Jax held the heavy cutters, face grim. Lena gripped the plasma torch, her knuckles white.

  **"Finn! Status!"** Tom barked.

  Finn stopped. He looked left. He could picture the researchers – Dr. Aris, who lectured on ethics; young Ben, barely out of grad school; the others. Their faces blurred into a collective weight. *Five.* The greater good. The utilitarian imperative screamed in his ear.

  Then he looked right. Down the dark crawlspace. He remembered Maya’s voice, crackling over the comms before it cut out: *"Finn? It's... it's getting tight. The pipe... it sounds bad. Please..."* He saw her face, not blurred, but sharp: the worry lines around her eyes, the way she bit her lip when concentrating. What could he possibly say to her? *"Sorry, Maya. We had to prioritize the five. Your life was worth less."* Could he look her in the eye, even in his imagination, and offer *that* as a reason she could reasonably reject? The sheer, brutal unfairness of it choked him. Scanlon’s question echoed: *What principle could you justify to each person affected?* To the researchers: *"We came for you first because there were more of you."* Was that a principle? Or just a count? To Maya: *"We let you die because... numbers."* That wasn't justification; it was a sentence. An abandonment.

  "Finn!" Lena prompted, her voice tight with fear. "The pipe… it won't hold!"

  The East Wing groaned, a deep, ominous shudder vibrating through the floor. Dust rained down. Time was collapsing in on itself.

  He opened his mouth. The words ‘East Wing’ formed on his tongue. The logical choice. The choice that saved the most. The choice Tom demanded. The choice his training almost dictated.

  But the image of Maya, alone in the dark, waiting for a justification that would never come, wouldn't leave him. The principle he needed – one he could defend to *her* – remained agonizingly elusive. "What could I say?" he whispered, the words lost in the creaking ruin.

  He didn't give the order. His hand, acting almost independently, pointed the beam of his lamp down the right-hand crawlspace, towards Maya. Towards the one.

  Jax shifted the heavy cutters, confusion warring with obedience on his face. Lena started forward with the torch, relief and terror mingling in her eyes.

  **"FINN! WHAT ARE YOU DOING? EAST WING! NOW!"** Tom’s voice was a roar of static and disbelief.

  Finn didn't answer. He took a step towards the crawlspace, then another. The weight of the five pressed on him like the mountain above, a suffocating avalanche of consequence. The tremor in his hands became a violent shake. He knew, with icy certainty, that whichever path he took, the justification would crumble like the concrete around him. Saving the five wouldn’t absolve him before Maya’s ghost. Saving Maya wouldn’t silence the cries of the five, or Tom’s condemnation, or the relentless arithmetic echoing in his own skull.

  He reached the crawlspace entrance. The hiss of the stressed pipe was louder, a serpent's breath in the dark. Lena scrambled past him, torch flaring to life.

  Finn paused, one hand on the jagged rock edge. He looked back, just once, towards the groaning darkness where the five waited. His breath hitched. No principle felt strong enough to bear the weight of either choice. Only the terrible, immediate demand of the person in front of him, and the echoing, unanswerable accusation from those left behind. The math was clear. The justification was ash in his mouth. He crawled into the dark after Lena, the screams of the five silent in the crumbling rock, but deafening inside his head. The tension didn't resolve; it tightened like a vice, leaving only the dust, the hiss, and the unbearable, unshared weight of the choice.
