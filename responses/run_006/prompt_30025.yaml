answer: |-
  Consider an office scenario where a critical server must be cooled to avoid overheating. The server has two independent cooling systems: a primary system activated by a manual switch (event c: an employee flipping the switch at 9:00 AM) and a secondary system that automatically initiates at 9:00 AM daily via a preset timer. Both systems run concurrently once started. The secondary system has a flaw causing it to crash five minutes after activation (at 9:05 AM) unless intercepted by a repair protocol. This repair protocol activates automatically only if the secondary system crashes *and* the primary system is inactive. In the actual world, the employee flips the switch (c), activating the primary system. The secondary system starts automatically at 9:00 AM but crashes at 9:05 AM. Since the primary system is active, the repair protocol does not trigger, and the primary system alone completes its cooling cycle by 9:10 AM, preventing overheating (event e: the server’s temperature remains safe at 9:15 AM).  

  For Woodward’s interventionist account, c is a cause of e. The relevant causal path runs directly from c (switch activation) to the primary system’s operation, culminating in e (successful cooling). Off-path variables—such as the secondary system’s automatic start, its crash at 9:05 AM, and the non-activation of the repair protocol—are held fixed at their actual values (started, crashed, and not triggered, respectively). Under an intervention where c is set to "off" (switch not flipped), with these off-path variables fixed, the primary system remains inactive. The secondary system still crashes at 9:05 AM, and with the repair protocol held fixed as "not triggered," it remains inoperative. Consequently, no cooling occurs, and overheating results (e fails). Thus, changes to c alter e when off-path conditions are fixed, satisfying Woodward’s conditions.  

  For Lewis’s original counterfactual analysis (without influence), e does not counterfactually depend on c. If c had not occurred (switch not flipped), the secondary system would still start automatically at 9:00 AM and crash at 9:05 AM. However, with the primary system inactive, the repair protocol would activate (as its activation depends counterfactually on c’s absence), restarting the secondary system, which then completes cooling by 9:10 AM, ensuring e still occurs. Thus, ~c □→ ~e is false. Moreover, no chain of stepwise dependence exists. Take the intermediate event d: the primary system completing cooling at 9:10 AM. If d had not occurred (e.g., due to an unrelated fault), the repair protocol would activate (as the primary’s failure mimics c’s absence), restarting the secondary system, and e would still occur. Hence, d does not satisfy ~d □→ ~e, and no other intermediates bridge dependence.  

  The critical feature is the repair protocol’s conditional activation: it triggers only if the primary system is inactive *and* the secondary crashes. This creates a preempted backup that becomes effective in c’s absence. If removed (e.g., no repair protocol exists), the secondary would crash irreparably without c, making e depend on c, and Lewis’s account would align with Woodward’s.  

  An unmodified Lewisian might reply by arguing that the repair protocol’s activation is not independent of c and that holding fixed "laws and past" implicitly requires fixing the protocol’s triggering condition. Since the protocol activates only when the primary is inactive, and c’s absence directly enables this, the counterfactual ~c □→ ~e might be defended by insisting that the protocol’s triggering is "too distant" from c to be relevant. However, this fails: Lewis’s semantics permit changes after c if they arise from lawful differences (like the protocol’s conditional response), and the past (including the secondary’s crash) is fixed. The repair is a post-c event, so its activation in ~c worlds is legitimate.  

  The case survives this reply. The repair protocol’s behavior is a lawful consequence of c’s absence, not an ad hoc modification. Thus, Woodward correctly identifies c as a cause, while Lewis’s unmodified account does not, fulfilling your specifications. Verdict: the case robustly demonstrates the intended divergence.
