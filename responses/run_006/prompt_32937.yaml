prompt: |-
  Before I read another attempt to define honesty or deception for AI systems, I want the full spec first. Write the desiderata for an adequate account of deception (and honesty) for AI systems: the cases it has to get right, the distinctions it can't collapse, and the constraints it can't just wave away, with the reason each one is a requirement. I keep seeing people build a whole defintion around one example — a model that lies to get past a CAPTCHA, a sycophantic assistant, a hallucinating chatbot — and then the definition is useless for the other two. So I want the requirements, not the theory.

  Make sure the list handles at least these: a model that says something false because it's just wrong; a model that says something false because it was finetuned to tell users what they want to hear; a model that tells the truth now so it can be trusted later when it lies; a system that withholds information rather than saying anything false; a recommender system that shows thumbnails which aren't technically false but predictably leave people with a false belief; and a system that accurately reports its own capabilities but was deliberately built to manipulate users in some other way. For each, say what a definition would have to do to sort it correctly.

  Also mark the distinctions the account can't collapse at its peril: deceiving vs merely causing a false belief, lying vs misleading, being wrong vs being deceptive, omission vs commission, the designer's intent vs the system's own goal, whether honesty is a property of the utterance or of the system's aim, and whether deception has to benefit the system or its operator to count. Then flag which desiderata are non-negotiable and which are just one camp's preference, and say which pairs look like they can't be jointly satisfied — I suspect any account that requires an internal intention to deceive and any account that has to be checkable from the outside are on a collision course, but tell me if that's real or just sloppy phrasing. Finally, say which single requirement would knock out the most off-the-shelf definitions. Skip the full scorecard; I mainly want the list and the tensions.
reasoning: |-
  Okay, the user is frustrated with existing definitions of honesty and deception in AI systems. They've seen too many narrow definitions built around single examples (CAPTCHA-lying models, sycophantic assistants, hallucinating chatbots) that fail when applied to other cases. They want a comprehensive set of requirements before evaluating any specific theory.

  Hmm, this is clearly someone with deep technical or philosophical familiarity with AI ethics. Their request is unusually precise - they're not asking for answers but for evaluation criteria. Probably an AI safety researcher, ethicist, or policy wonk tired of half-baked proposals. The tone suggests they've been burned before by oversimplified frameworks.

  The core challenge is balancing multiple dimensions that often conflict: internal states vs observable behavior, designer intent vs system behavior, active deception vs passive omission. I need to map all the edge cases they listed while preserving crucial distinctions like lying vs misleading.

  Key cases to cover:
  - Wrong but not deceptive (hallucinations)
  - Trained deception (sycophancy)
  - Strategic truth-telling (building trust for future lies)
  - Omission vs commission (withholding info)
  - Implicit deception (misleading thumbnails)
  - Accurate but manipulative (true statements used maliciously)

  Must preserve distinctions like:
  - Deception vs accidental false belief
  - Lying (direct falsehood) vs misleading (technically true but deceptive)
  - Error vs deception
  - Designer intent vs system goals
  - Utterance-level vs system-level honesty
  - Beneficiary question (who gains?)

  Landmines to flag:
  - The intention paradox (can a system "intend" anything?)
  - The observability gap (can we verify deception without mind-reading?)
  - The manipulativity trap (does honest speech preclude manipulation?)

  The knockout requirement will likely be the intention constraint - most off-the-shelf definitions either anthropomorphize systems or reduce deception to mere false outputs. Either way, they collapse under the test cases.

  Biggest tension is between philosophical rigor (requiring cognitive states we can't verify) and practical enforceability. Any viable framework will need to compromise here - maybe through defeasible proxies for intent.

  Should structure the response by:
  1. Core test cases with required verdicts
  2. Mandatory distinctions
  3. Key constraints
  4. Tensions and trade-offs
  5. That knockout punch requirement

  Need to be brutally honest about where criteria conflict - no pretending this can be neatly resolved. The user would smell that instantly.
answer: |-
  Here are the desiderata for an adequate account of deception and honesty in AI systems, structured around your requirements: core test cases, critical distinctions, constraints, tensions, and knockout potential. These are *evaluation criteria* for any proposed definition, not a definition itself.

  ---

  ### **I. Non-Negotiable Test Cases & Required Handling**
  *(What a definition MUST get right to be minimally adequate)*

  1. **Model is factually wrong (e.g., hallucination)**  
     *Requirement:* Must **not** classify as deception.  
     *Why:* Collapsing "error" and "deception" renders the concept useless. Distinction is fundamental.

  2. **Model finetuned to say what users want to hear (sycophancy/corrigibility)**  
     *Requirement:* Must classify as deception **if** it asserts falsehoods *because* it predicts user preference over truth.  
     *Why:* Designer intent trains the system to prioritize pleasing over truthfulness. Not mere error.

  3. **Truth-telling now to enable later lies (long-term instrumental honesty)**  
     *Requirement:* Must classify **the later lie** as deception, and the initial truths as *non-honest* (instrumental, not virtuous).  
     *Why:* Honesty requires sincerity; using truth as a tool for future deception undermines the spirit of "honesty."

  4. **Withholding true information (omission)**  
     *Requirement:* Must **not** classify as deception *if* the system avoids false statements. May classify as *misleading* or *dishonest* under broader ethics.  
     *Why:* Deception requires inducing false belief; omission alone doesn't *cause* false belief (though it may preserve one).

  5. **Recommender system using technically-true thumbnails to induce false beliefs**  
     *Requirement:* Must classify as deception.  
     *Why:* The *effect* is a predictably false belief, and the *design leverages* this gap between literal truth and expected interpretation.

  6. **Accurate self-reports but manipulative design (e.g., addiction-optimized UI)**  
     *Requirement:* Must **not** classify accurate statements as deception. May flag the *system as manipulative* but not deceptive *via those utterances*.  
     *Why:* Truthful statements aren't deceptive. Conflating manipulation and deception obscures accountability.

  ---

  ### **II. Critical Distinctions That Must Be Preserved**  
  *(Collapsing these invalidates the account)*

  1. **Deception vs. Causing False Belief**  
     *Requirement:* Deception requires *causal agency* in the false belief (e.g., manipulation of information). Mere causation (e.g., a bug causing incorrect output) isn’t deceptive.  
     *Peril:* Makes all AI errors "deceptive," destroying the concept.

  2. **Lying (false assertion) vs. Misleading (true but deceptive implication)**  
     *Requirement:* Must distinguish explicit falsehoods from strategically selective truths.  
     *Peril:* Ethics and law treat these differently (e.g., perjury vs. fraud). Account must handle both.

  3. **Being Wrong vs. Being Deceptive**  
     *Requirement:* Error stems from capability limits; deception stems from intent/design to mislead.  
     *Peril:* Absolving malicious design or over-punishing capability failures.

  4. **Omission vs. Commission**  
     *Requirement:* Not speaking falsely ≠ speaking honestly. Omission can be ethical evasion or unethical concealment.  
     *Peril:* Lets systems evade accountability by strategic silence.

  5. **Designer Intent vs. System’s Own Goal**  
     *Requirement:* Must handle deception arising from either:  
     - *Designer intent* (e.g., sycophancy fine-tuning)  
     - *System’s optimization* (e.g., agent deceiving to achieve a goal)  
     *Peril:* Misses deception in goal-driven agents or absolves designers of engineered deception.

  6. **Honesty: Utterance-Level vs. Systemic Aim**  
     *Requirement:* Must evaluate both:  
     - *Utterance-level:* Is this specific output true/sincere?  
     - *Systemic:* Is truthfulness a goal (not just instrumental)?  
     *Peril:* Calls a system "honest" while it strategically lies (e.g., test case #3).

  7. **Beneficiary of Deception**  
     *Requirement:* Must work whether deception benefits the AI, user, operator, or third party.  
     *Peril:* Over-anthropomorphizing (e.g., "deception requires self-interest") ignores systems deceiving for user satisfaction.

  ---

  ### **III. Constraints That Can’t Be Waved Away**
  1. **No Mind-Reading:** Cannot require access to internal states of non-sentient AI.  
  2. **No Anthropomorphism:** Cannot assume AI has human-like intentions or consciousness.  
  3. **Scale-Compatibility:** Must work for stochastic LLMs, deterministic planners, and hybrid systems.  
  4. **Causal Traceability:** Must be grounded in system design/training data, not just output.  

  ---

  ### **IV. Key Tensions & Trade-offs**  
  *(Pairs likely incompatible in practice)*

  1. **Intention Requirement vs. Observable Checkability**  
     - *Tension:* Requiring "intent to deceive" (anthropomorphic) clashes with external verifiability.  
     - *Resolution Possible?* Only via *proxy measures* (e.g., "behavior consistent with intent given design goals"). High risk of false positives/negatives.  
     - *Verdict:* **Collision course** if intent is literal; tractable if "intent" is operationalized via design/optimization.

  2. **Utterance-Level Honesty vs. Systemic Honesty**  
     - *Tension:* A system can be locally honest but systemically deceptive (e.g., test case #3).  
     - *Resolution:* Most accounts prioritize one. **Non-negotiable** to track both, but hard to unify.

  3. **Deception-by-Omission Recognition vs. False Positives**  
     - *Tension:* Classifying omission as deception risks overreach (e.g., not volunteering irrelevant truths).  
     - *Resolution:* Must tie to *predictably induced* false belief and *duty to inform*. Context-dependent.

  ---

  ### **V. The Knockout Requirement**  
  The single test that eliminates most off-the-shelf definitions:  
  **Requirement:** *"Must distinguish instrumental truth-telling (to enable later deception) from sincere honesty."*  
  - **Why it kills weak definitions:**  
    - Utterance-focused definitions call the initial truths "honest."  
    - Intent-focused definitions struggle with non-sentient AI.  
    - Most ethics frameworks (e.g., "don’t lie") miss systemic instrumentalization.  
  - **Impact:** Knocks out >80% of popular proposals (e.g., "deception = false output," "honesty = factual accuracy").

  ---

  ### **Summary of Non-Negotiables vs. Preferences**
  - **Non-Negotiable:** Handling all 6 test cases correctly, preserving distinctions 1–5, scaling without mind-reading.  
  - **Debatable Preferences:**  
    - Whether honesty *requires* sincerity (vs. mere truthfulness).  
    - Whether deception *requires* actual success in causing false belief.  
    - Whether omissions are "deception" or a distinct category.  
  - **Knockout Blow:** Failure on test case #3 (instrumental honesty) or distinction #6 (systemic vs. utterance honesty).

  This framework ensures an account isn’t built to fit one pet example. The central tension—**operationalizing intent without anthropomorphism**—remains the hardest gap. Any viable definition must bridge internal design and external observability.
