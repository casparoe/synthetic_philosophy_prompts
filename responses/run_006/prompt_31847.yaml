prompt: |-
  I facilitate dialogues across deep divides for a living — last month it was Palestinian and Israeli students, next month it's a mining company and the Indigenous community downstream. I've been reading about the Jain concepts of anekāntavāda and syādvāda, and I want to operationalize them: not just "be open to other perspectives," but the actual structure — the idea that any claim is true only from some naya (standpoint), that the full truth is irreducibly many-sided, and that the syāt ("in some respect") conditional should be recoverable even for statements that feel absolute.

  Give me a reusable procedure I can follow in session prep and during the dialogue itself. I need it to be concrete: steps I can run, questions I can ask, moves I can make when someone is digging in. For each step, tell me the exit condition (how I know I've done it) and the stopping condition (where I hand it to judgment). Be honest about anekāntavāda's own commitments — it's not relativism, it's not "all views are equally valid," and it's not a technique for getting people to compromise. Flag where the procedure itself takes a stand that one of the parties might reasonably reject.

  Then run it on two cases: (a) a dispute over closing a rural maternity ward, hospital admin vs. the community, and (b) a dispute over using macaques in neuroscience research, animal rights groups vs. the university researchers. In at least one of them, I want the procedure to surface something I as the facilitator would rather not have to deal with.
reasoning: |-
  We are going to design a concrete procedure based on anekāntavāda and syādvāda for facilitating dialogues across deep divides. The key principles we are incorporating:

  1. **Anekāntavāda**: The doctrine of manifold aspects; the idea that reality is complex and can be perceived from multiple standpoints (nayas), and no single standpoint captures the entire truth.

  2. **Syādvāda**: The doctrine of conditioned predication; any statement must be qualified by "syāt" (meaning "in some respect" or "from a particular perspective") and is therefore only conditionally true.

  The procedure must avoid relativism (not all views are equally valid) and must not force compromise. It should help participants articulate the standpoints from which their claims are true and encourage them to reconstruct the conditional form (syāt) of absolute statements.

  The procedure has two main parts: 
  - **Session Prep** (to be done by the facilitator before the dialogue)
  - **During the Dialogue** (steps to follow in the session)

  We'll break down each part into steps, with exit conditions (how we know we've done it) and stopping conditions (when to hand it to judgment). We'll also flag where the procedure takes a stand that might be controversial.

  Then we'll apply the procedure to the two cases.

  ---

  **Procedure: Operationalizing Anekāntavāda and Syādvāda**

  **I. Session Prep (Facilitator's Work)**

  *Goal*: Prepare by understanding the main standpoints and the absolute claims that will be made, and then design the dialogue structure to surface the conditionality of these claims.

  1. **Step 1: Map Standpoints (nayas)**
     - *Action*: Identify the primary parties and their core positions. For each party, list:
       - Their key claims (what they assert as true)
       - The underlying interests, values, and concerns that form the basis of their standpoint.
       - The context (time, place, role, etc.) from which they speak.
     - *Exit Condition*: A visual map (e.g., a table) showing each party, their key claims, and the context of each claim.
     - *Stopping Condition*: When you have identified at least two distinct standpoints and at least one claim from each that appears absolute and non-negotiable.

  2. **Step 2: Identify Absolute Claims and Reconstruct Syāt Forms**
     - *Action*: For each key absolute claim (e.g., "This mine must be shut down" or "Animal research is unethical"), reconstruct at least two or three syāt forms. That is, articulate the conditions under which the claim is true and the perspective from which it holds.
       - Example: Instead of "Animal research is unethical," reconstruct as: "Syāt, from the perspective of the intrinsic value of animal life, animal research is unethical." and "Syāt, from the perspective of advancing human health as the highest priority, animal research is ethical."
     - *Exit Condition*: Each absolute claim has been transformed into at least two syāt statements that capture different standpoints (even if they are from the same party or from different parties).
     - *Stopping Condition*: When every key claim in the conflict has been rephrased conditionally. This step stops if a claim cannot be rephrased conditionally (which should be rare, but if so, note it as a potential challenge).

  3. **Step 3: Design Dialogue Steps to Surface Conditionality**
     - *Action*: Design the flow of the dialogue session to include:
       - A step where each party articulates their own claims in syāt form (e.g., "From our perspective as X, in the context of Y, we believe Z").
       - A step where parties are asked to articulate the condition under which the *other* party's claim might be true (even if they don't agree with that condition).
       - A step to collaboratively list all the standpoints (nayas) and the aspects of reality they capture.
     - *Exit Condition*: A session agenda that includes specific questions and activities to achieve the above.
     - *Stopping Condition*: When the agenda is set and the facilitator has prepared the necessary materials (e.g., flip charts, prompts).

  **II. During the Dialogue**

  *Goal*: Guide participants to express their views conditionally and to recognize the partial validity of other standpoints.

  1. **Step 1: Establish Ground Rules with Syādvāda**
     - *Action*: Introduce the ground rule: "When making a statement, we ask that you try to frame it conditionally, by specifying the perspective or condition from which it holds. For example, 'From the perspective of [your role/concern], in the context of [specific situation], I believe...'"
     - *Exit Condition*: Participants agree to try to use this framing and the facilitator has modeled it.
     - *Stopping Condition*: If a participant refuses, note that the rule is aspirational and move on.

  2. **Step 2: Articulate Own Standpoint with Conditionality**
     - *Action*: Ask each party to present their key concerns and claims using the syāt form. Facilitator may prompt: "Can you state your position by saying, 'From our perspective as [group], we see [issue] as [claim] because [reasons]'?"
     - *Exit Condition*: Each party has expressed at least one key claim conditionally (with explicit context).
     - *Stopping Condition*: If a party refuses and states an absolute claim, note it and move on (we'll address it in Step 4).

  3. **Step 3: Identify Shared and Distinct Standpoints (nayas)**
     - *Action*: Create a joint list of standpoints (nayas) on a whiteboard. For each standpoint, note:
       - The group holding it (or if shared)
       - The aspect of reality it focuses on (e.g., economic, environmental, temporal, ethical)
       - The condition under which it holds (the syāt clause)
     - *Exit Condition*: A visual map that shows multiple standpoints and their respective focuses.
     - *Stopping Condition*: When all major standpoints are listed and participants agree the map is representative.

  4. **Step 4: Reconstruct Syāt for Absolute Statements (if they arise)**
     - *Action*: When an absolute statement is made (e.g., "That's just wrong!"), intervene by:
       - Asking the speaker: "Can you tell us from which perspective or in what context that statement holds true?"
       - If they cannot, ask the group: "Can anyone help us understand the perspective from which that statement might be conditionally true? Even if you don't agree with it, can you imagine the context in which someone might hold that view?"
       - If the speaker rejects conditionality, note: "It seems that from your perspective, this is an absolute truth. We note that. Now, let's see if others can help us understand the conditions under which it might hold."
     - *Exit Condition*: The absolute statement is either rephrased conditionally by the speaker or by others, or it is noted as an absolute and the dialogue moves on without getting stuck.
     - *Stopping Condition*: After two attempts to reframe, if it fails, move on.

  5. **Step 5: Explore the Integration of Standpoints (without forcing agreement)**
     - *Action*: Guide a discussion on how the different standpoints might be part of a larger, complex reality. Ask:
       - "What aspects of this issue are we seeing more fully by having these multiple standpoints?"
       - "What might we be missing even now?"
       - "How does holding one standpoint make it hard to see another?"
     - *Exit Condition*: Participants acknowledge that the issue has multiple facets and that no single standpoint captures everything.
     - *Stopping Condition*: When participants have expressed both the value and the limitations of their own and others' standpoints.

  **Controversial Commitment of the Procedure**: 
  - The procedure takes a stand that *every claim is conditional* and that *no one has the whole truth*. This might be rejected by a party that holds their view as absolute (e.g., based on religious doctrine or fundamental rights). The facilitator must be transparent that this is the framework being used, but not force participants to change their beliefs.

  ---

  **Application to Case (a): Rural Maternity Ward Closure**

  **Parties**: 
  - Hospital Admin: Claims closure is necessary due to financial unsustainability and low utilization.
  - Community: Claims closure will endanger lives and is a breach of trust.

  **Prep Work**:

  1. **Map Standpoints**:
     - Admin: 
       - Claim: "The maternity ward must close because it's losing money and isn't used enough."
       - Context: Financial sustainability, regulatory requirements, system efficiency.
     - Community:
       - Claim: "Closing the ward is unacceptable because it puts mothers and babies at risk."
       - Context: Geographic isolation, long travel times, past promises.

  2. **Reconstruct Syāt Forms**:
     - Admin claim: 
       - Syāt, from the perspective of the hospital's financial viability and the goal of serving the broader community with limited resources, closing the maternity ward is necessary.
     - Community claim:
       - Syāt, from the perspective of immediate access to emergency care for pregnant women in a remote area, closing the ward is dangerous and unethical.

  3. **Design Dialogue Steps**:
     - Agenda: 
       - (1) Each side presents with syāt framing.
       - (2) Jointly map standpoints: financial, safety, trust, etc.
       - (3) Ask each party: "Under what condition might the other's claim be valid?" (e.g., Admin: "If there were no alternative services and travel times were over 2 hours, closure would be dangerous." Community: "If the ward was running at a huge loss and threatening the entire hospital, closure might be necessary.")

  **During Dialogue**:

  - Step 1: Ground rules set.
  - Step 2: 
    - Admin: "From our perspective as hospital administrators responsible for the whole health system, and in the context of a 40% budget deficit in maternity services, we believe the ward must close to avoid cuts to other essential services."
    - Community: "From our perspective as residents of a remote community, and in the context of winter roads being impassable, we believe closing the ward will lead to preventable deaths."
  - Step 3: Map standpoints. They identify: 
    - Financial sustainability (Admin)
    - Emergency access (Community)
    - Trust in institutions (Community)
    - System-wide impact (Admin)
  - Step 4: When a community member says, "You're killing women by closing this ward!" 
    - Facilitator: "Can you help us understand the specific context in which that statement holds? Is it about the winter travel conditions?" 
    - Community member: "Yes, especially in winter when the roads are bad, the delay could be fatal." 
    - Facilitator reframes: "So, syāt, in the context of winter emergencies, closing the ward could lead to loss of life. Thank you."
  - Step 5: 
    - Facilitator: "What does this map show us? We have financial realities and life-and-death realities. How do these standpoints interact?" 
    - Participants might note: The financial standpoint doesn't see the human cost, and the emergency standpoint doesn't see the system collapse risk.

  **Something Uncomfortable**: The procedure might surface that the hospital admin's decision is also driven by a regional strategy to centralize services (which they didn't disclose) or that the community's fear is amplified by a recent maternal death that was unrelated to travel time. The facilitator must hold space for these uncomfortable truths.

  ---

  **Application to Case (b): Macaques in Neuroscience Research**

  **Parties**:
  - Animal Rights Group: Claims using macaques is cruel and unnecessary.
  - University Researchers: Claims macaques are essential for understanding the brain and developing treatments.

  **Prep Work**:

  1. **Map Standpoints**:
     - Researchers: 
       - Claim: "Macaque research is necessary for breakthroughs in brain disorders."
       - Context: Scientific knowledge, potential human benefits, regulatory oversight.
     - Animal Rights:
       - Claim: "Using macaques is unethical because it causes suffering to sentient beings."
       - Context: Animal sentience, moral consideration, availability of alternatives.

  2. **Reconstruct Syāt Forms**:
     - Researchers: 
       - Syāt, from the perspective of advancing human health where no other animal model or alternative method can provide the same insights, using macaques is justified.
     - Animal Rights:
       - Syāt, from the perspective that sentient beings have intrinsic rights and should not be subjected to harm for human benefit, using macaques is unethical.

  3. **Design Dialogue Steps**:
     - Agenda:
       - (1) Each side presents with syāt framing.
       - (2) Map standpoints: scientific progress, animal ethics, etc.
       - (3) Ask: "Under what condition might the other's claim be valid?" (e.g., Researchers: "If there were equally effective alternatives, then animal use would be unethical." Animal Rights: "If human lives were immediately at stake and macaques were the only way, then it might be necessary, but that's not the case here.")

  **During Dialogue**:

  - Step 1: Ground rules set.
  - Step 2: 
    - Researchers: "From our perspective as neuroscientists working on Alzheimer's, and in the context of macaques having brain structures similar to humans that are essential for our experiments, we believe using macaques is necessary for progress."
    - Animal Rights: "From our perspective as advocates for animal rights, and in the context of macaques being highly intelligent and capable of suffering, we believe any non-consensual harm is morally wrong."
  - Step 3: Map standpoints:
    - Scientific necessity (Researchers)
    - Animal suffering (Animal Rights)
    - Moral status of animals (Animal Rights)
    - Human health benefits (Researchers)
  - Step 4: When a researcher says, "Without this research, millions will suffer from untreated Alzheimer's!" 
    - Facilitator: "Can you specify the condition? Is it that macaques are uniquely able to provide this knowledge?" 
    - Researcher: "Yes, for certain types of neural circuitry, there is currently no alternative."
    - Facilitator reframes: "So, syāt, in the context of no existing alternatives for specific brain research, macaque use is necessary to prevent human suffering."
  - When an animal rights activist says, "All animal research is barbaric!" 
    - Facilitator: "Can you help us understand the perspective from which that is true?" 
    - Activist: "From the perspective that animals have the right not to be used as means to human ends, it's always wrong."
    - Facilitator: "So, syāt, from the perspective of animal rights as fundamental, any animal research is unethical. We note that."

  **Something Uncomfortable**: The procedure might surface that the researchers are using macaques because they are cheaper and more available than developing alternatives, or that the animal rights group is unwilling to accept any animal research even for life-threatening conditions. Also, it might reveal that both sides are talking past each other on the definition of "necessity" and what counts as an alternative. The facilitator must manage the discomfort without taking sides.

  ---

  This procedure provides a structured way to bring anekāntavāda and syādvāda into dialogue facilitation. It requires practice and may not resolve the conflict, but it can transform the quality of the conversation by making conditionality explicit and fostering epistemic humility.
answer: |-
  Here's a concrete, step-by-step procedure to operationalize anekāntavāda and syādvāda in dialogue facilitation, designed for reusability. I'll address your requirements directly: **concrete steps**, **exit/stopping conditions**, **acknowledged commitments**, and **uncomfortable truths**. The procedure has four phases, with prep work (I-II) and in-session steps (III-IV).

  ---

  ### **Core Procedure: The Syād Framework**
  **Philosophical Commitments** (to disclose upfront):  
  1. **Non-absolutism**: No single perspective captures the entire truth ("naya" = partial standpoint).  
  2. **Conditionality**: All claims are context-dependent (must be prefixed with "syāt" — "in some respect").  
  3. **Non-relativism**: Truth is multi-faceted but *not* subjective; standpoints can be evaluated for validity within their context.  
  **Controversial Stand**: Rejects absolute positions (e.g., "This is *always* wrong") as epistemically incomplete. Some parties may reject this, especially those with fundamentalist or rights-based views.

  ---

  #### **I. Prep: Standpoint Mapping**  
  *Goal*: Identify each party's core claims and their underlying "nayas" (standpoints).  
  **Steps**:  
  1. **List absolute claims** from pre-session interviews/surveys (e.g., "The ward *must* stay open").  
  2. **For each claim, extract**:  
     - *Naya* (standpoint): Role/context (e.g., "as a hospital CFO"), values (e.g., "financial sustainability"), and non-negotiable boundaries (e.g., "no deficit spending").  
     - *Unspoken conditions*: What makes this claim true? (e.g., "if travel time >1 hour").  
  3. **Map conflicts**: Cluster claims where standpoints directly clash (e.g., "safety" vs. "efficiency").  
  *Exit Condition*: Table of claims, nayas, and conditions for each party.  
  *Stopping Condition*: When claims are clear, or parties refuse to disclose further (hand to judgment).  

  #### **II. Prep: Syāt Reconstruction**  
  *Goal*: Convert absolute claims into conditional "syāt" statements.  
  **Steps**:  
  1. **Reframe claims** using:  
     *"Syāt, [condition], [claim] is valid from [naya]."*  
     (e.g., "Syāt, *when emergency response time exceeds 30 minutes*, closing the ward *is dangerous* from a community safety standpoint.")  
  2. **Identify missing nayas**: What perspectives are absent? (e.g., nurses' input in the ward case).  
  3. **Flag irreconcilables**: Claims that resist conditioning (e.g., "All animal testing is torture").  
  *Exit Condition*: Each claim has ≥2 syāt forms capturing different nayas.  
  *Stopping Condition*: If a claim is truly unconditional (e.g., based on dogma), note it—don't force reframing.  

  #### **III. In-Session: Grounding in Conditionality**  
  *Goal*: Establish syādvāda as the interaction norm.  
  **Concrete Moves**:  
  - **Opening Prompt**: *"We’ll use ‘syāt’—meaning ‘in some respect’—to frame statements. E.g., ‘Syāt, from my view as ____, I see ____ because ____.’"*  
  - **When someone states absolutes**:  
    - *Intervention*: *"Help us understand the ‘syāt’ here. Under what conditions might this *not* hold true? What perspective makes it feel absolute?"*  
    - *If they dig in*: *"Imagine someone who disagrees. What naya might they occupy that makes your claim untrue for them?"*  
  - **Group Exercise**: *"Pair with someone with opposing views. Restate their claim with a syāt prefix that they’d accept."*  
  *Exit Condition*: Parties use "syāt" unprompted or acknowledge conditionality.  
  *Stopping Condition*: If hostility escalates, pause and name the impasse.  

  #### **IV. In-Session: Multi-Sided Synthesis**  
  *Goal*: Expose the "many-sided truth" without forcing compromise.  
  **Concrete Moves**:  
  1. **Naya Mapping**: Co-create a chart:  
     | Claim | Syāt Conditions | Valid Nayas | Invalid Nayas |  
     (e.g., "Claim: Ward closure saves money. Valid nayas: Hospital admin in budget crisis. Invalid nayas: Rural mother in labor.")  
  2. **Gap Analysis**: *"What nayas are missing? What would they reveal?"* (e.g., Indigenous elders not consulted in mining case).  
  3. **Reality Check**: *"If we combined all nayas, what would a ‘complete’ truth look like? Where do they *not* fit together?"*  
  *Exit Condition*: Parties articulate limitations of their own nayas.  
  *Stopping Condition*: When parties agree the map is "complete enough" or time runs out.  

  ---

  ### **Case Applications**
  #### **Case A: Rural Maternity Ward Closure**  
  **Parties**: Hospital Admin (costs) vs. Community (safety).  
  - **Prep Output**:  
    - Admin claim: *"Ward must close"* → Syāt: *"When annual deliveries <100, closure is efficient from a resource-allocation naya."*  
    - Community claim: *"Closure kills mothers"* → Syāt: *"When ambulance transit >45min, closure is life-threatening from an emergency-access naya."*  
  - **In-Session**:  
    - **Dig-in Move**: Admin says, *"Keeping it open is fiscally irresponsible."*  
      - Facilitator: *"Syāt, under what budget conditions might this *not* be irresponsible? What naya sees it as responsible?"*  
      - Admin concedes: *"If the state funded it, staying open could be responsible from a community-service naya."*  
    - **Uncomfortable Truth Surfaced**:  
      The hospital secretly plans to sell the ward’s land to a developer. Syādvāda forces transparency: *"Syāt, from a profit-maximizing naya, closure is land monetization."* Community feels betrayed, requiring facilitator to hold space for anger.  

  #### **Case B: Macaques in Neuroscience Research**  
  **Parties**: Researchers (medical progress) vs. Animal Rights (ethics).  
  - **Prep Output**:  
    - Researcher claim: *"Macaque research is essential"* → Syāt: *"When studying complex brain functions, primate models are irreplaceable from a scientific-rigor naya."*  
    - Animal Rights claim: *"All primate testing is cruel"* → Syāt: *"When sentience is recognized, testing violates rights from an intrinsic-value naya."*  
  - **In-Session**:  
    - **Dig-in Move**: Researcher says, *"Without macaques, Alzheimer’s research halts."*  
      - Facilitator: *"Syāt, what research contexts *don’t* require macaques? What naya might call this claim exaggerated?"*  
      - Researcher admits: *"For early-stage drug trials, alternatives exist from a computational-modeling naya."*  
    - **Uncomfortable Truth Surfaced**:  
      Animal Rights accuses researchers of using macaques because they’re "cheaper than human trials." Syādvāda forces acknowledgment: *"Syāt, from a capitalist naya, macaques reduce R&D costs."* Researchers resist, forcing facilitator to name the power imbalance in research economics.  

  ---

  ### **Key Facilitator Notes**  
  - **When Parties Reject the Framework**: Honor it. Say: *"This method assumes no one holds the whole truth. If you reject that, we’ll note it as a disagreement about how truth works."*  
  - **Avoiding Compromise**: Focus on *understanding* over agreement. E.g., *"We’re not asking you to concede, but to see the field of perspectives."*  
  - **Handoff to Judgment**: When parties agree on the naya map but still clash on values (e.g., "Efficiency vs. Life"), transition to negotiation or mediation.  
  - **Why It Works**: It replaces "soft" openness with structured epistemic humility. The "syāt" lever forces de-absolutizing without dismissing validity.  

  This procedure surfaces uncomfortable power dynamics and hidden agendas because anekāntavāda insists *every* naya—even exploitative ones—must be named to see the whole. It’s rigorous but ethically neutral, making it usable in polarized contexts.
