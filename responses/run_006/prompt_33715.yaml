prompt: |-
  I'm putting together a grant app for a summer research stipend and I need a two-page proposal. My half-baked idea is this: the Sleeping Beauty debate has been stuck for twenty years because both sides keep appealing to the same Bayesian machinery—conditionalization, the Principal Principle, Dutch books—and getting different answers. I suspect the real disagreement isn't about credences at all but about what makes a credence *correct* in the first place: halfers are covertly committed to an accuracy-first or alethic picture (your credences should track the world), and thirders are committed to something more like a pragmatic or decision-theoretic picture (your credences should guide action well). And these two pictures usually coincide, which is why the problem is hard—Sleeping Beauty is one of the rare cases where they come apart. So the project would be: articulate these two pictures of what makes a credence correct, show that they pull apart exactly in self-locating cases, and argue that the Sleeping Beauty problem isn't a paradox to be solved but a diagnostic tool for telling you which picture you were already committed to. Turn this into a proper proposal: the question stated precisely, why existing positions haven't settled it, the method (what I actually do over the summer, week by week), what a successful outcome looks like, and what would count as the project failing. I'll add citations later, don't worry about those.
