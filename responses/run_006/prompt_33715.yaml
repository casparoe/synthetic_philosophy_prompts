answer: |-
  Here’s a structured, two-page grant proposal draft based on your insightful core idea. It’s designed to be rigorous, focused, and persuasive for a summer research stipend:

  ---

  **PROJECT TITLE:**  
  **Diagnosing the Sleeping Beauty Paradox: Credence Correctness Beyond Bayesian Formalisms**

  **PRINCIPAL INVESTIGATOR:**  
  [Your Name], [Your Program/Department], [Your Institution]

  ### RESEARCH QUESTION & OBJECTIVES
  **Central Question:** *Why has the Sleeping Beauty problem resisted consensus for decades despite exhaustive Bayesian analysis?*  
  **Hypothesis:** The halfer/thirder disagreement stems not from miscalculation within *shared* Bayesian norms (conditionalization, Principal Principle), but from deeper, unarticulated divergences about what *makes* a credence correct—specifically, a conflict between **alethic** (accuracy/world-tracking) and **pragmatic** (action-guidance) conceptions of credence normativity. These conceptions coincide in most cases but pull apart in essential self-locating uncertainty, making Sleeping Beauty a diagnostic tool.  

  **Key Objectives:**  
  1. Articulate two distinct philosophical accounts of credence correctness:  
     - **Alethic Picture (Accuracy-First):** A credence is correct iff it minimizes expected inaccuracy (e.g., Brier score) relative to the agent’s evidence.  
     - **Pragmatic Picture (Decision-Theoretic):** A credence is correct iff it rationally guides action under plausible decision rules (e.g., expected utility maximization).  
  2. Map existing halfer/thirder positions onto these meta-normative commitments.  
  3. Demonstrate that Sleeping Beauty’s awakenings create conditions where these pictures *necessarily* diverge.  
  4. Argue that Sleeping Beauty is not a solvable paradox but a litmus test for one’s prior commitment to alethic vs. pragmatic norms.  

  ### BACKGROUND & GAP ANALYSIS
  The Sleeping Beauty problem (Elga 2000; Lewis 2001) is notorious: Beauty learns she will be woken twice if a coin lands Heads, once if Tails, with memory wiped between awakenings. Upon waking, what should her credence be that the coin landed Heads?  
  - **Halvers (1/2):** Emphasize temporal reference classes, no new *uncentered* evidence (Elga 2000; Lewis 2001).  
  - **Thirders (1/3):** Emphasize centered evidence, betting intuitions, or indifference over awakenings (Dorr 2002; Titelbaum 2013).  

  **Why Existing Approaches Fail:** Both sides deploy the *same* formal tools (conditionalization, Dutch books, Principal Principle) yet reach incompatible conclusions. This suggests the debate is underdetermined by Bayesian machinery and hinges on unstated assumptions about *what credences are for*. Current literature treats this as a technical dispute about self-locating beliefs (e.g., Arntzenius 2003; Bradley 2011) but neglects the **meta-epistemological foundations** of credence correctness.  

  ### METHODOLOGY & TIMELINE (5 Weeks)
  **Week 1: Foundational Analysis**  
  - Systematically catalogue halfer/thirder arguments, isolating their implicit appeals to alethic (e.g., "no new relevant evidence") vs. pragmatic (e.g., "betting odds favor 1/3") norms.  
  - Identify core texts: Elga (2000), Lewis (2001), Titelbaum (2013), Pettigrew (2016) on accuracy, Briggs (2010) on decision theory.  

  **Week 2: Articulate the Alethic Picture**  
  - Formalize the accuracy-first account: derive halver-compatible credences via *strict conditionalization* on uncentered evidence + minimization of expected inaccuracy.  
  - Show why Beauty’s centered evidence ("I am awake now") is irrelevant to truth-tracking about *Heads*.  

  **Week 3: Articulate the Pragmatic Picture**  
  - Formalize the decision-theoretic account: derive thirder-compatible credences via *evidential decision theory* applied to Beauty’s actions (e.g., accepting bets).  
  - Demonstrate that pragmatic success requires weighting centered possibilities equally.  

  **Week 4: Map Divergence Conditions**  
  - Prove that alethic and pragmatic pictures coincide in non-self-locating cases but diverge under:  
    (a) Indexical uncertainty ("where/when am I?")  
    (b) Evidence erasure (memory loss)  
    (c) Multiple possible "centers" (awakenings).  
  - Generalize to other puzzles (e.g., the Doomsday Argument).  

  **Week 5: Reframe Sleeping Beauty as Diagnostic Tool**  
  - Synthesize Weeks 2–4: Show halfer/thirder stances track prior commitments to alethic/pragmatic norms.  
  - Argue that "solving" the paradox is impossible without first choosing a normative picture—SB reveals pre-theoretic intuitions about credence *purpose*.  
  - Draft paper sections addressing implications for epistemology and decision theory.  

  ### EXPECTED OUTCOMES & DELIVERABLES
  - **Primary Deliverable:** A draft journal article (e.g., *Philosophy of Science*, *Mind*) demonstrating that SB’s persistence stems from meta-normative divergence.  
  - **Key Contributions:**  
    - A novel taxonomy of credence normativity (alethic vs. pragmatic).  
    - A proof that self-locating uncertainty creates systematic divergence between these norms.  
    - A paradigm shift: SB as a diagnostic tool, not a paradox.  
  - **Broader Impact:** Reshapes debates in formal epistemology, self-locating belief, and normative decision theory.  

  ### CRITERIA FOR SUCCESS & FAILURE
  **Success Looks Like:**  
  1. Coherent articulation of alethic/pragmatic accounts satisfying proponents of both positions.  
  2. Formal demonstration of their convergence/divergence conditions.  
  3. Persuasive argument that SB disagreement maps cleanly onto these accounts.  
  4. Draft paper accepted for presentation at a major philosophy conference (e.g., PSA, APA).  

  **Failure Looks Like:**  
  1. Alethic/pragmatic accounts fail to align with halfer/thirder intuitions.  
  2. No clear divergence conditions identified.  
  3. SB remains reducible to technical disagreements (e.g., about conditionalization).  
  4. No novel philosophical insight generated beyond existing literature.  

  ### CONCLUSION
  This project resolves a 20-year stalemate by exposing Sleeping Beauty's core tension: not *how* to calculate credences, but *why* we value them. By reframing SB as a litmus test for meta-epistemological commitments, it transforms an intractable debate into a tool for clarifying the foundations of rational belief.  

  ---

  **Key Strengths of This Structure:**  
  - **Problem-Centric:** Starts with SB’s unresolved status to justify novelty.  
  - **Clear Gap:** Identifies neglect of meta-normative foundations.  
  - **Methodical:** Week-by-week breakdown shows feasibility.  
  - **Measurable Outcomes:** Success/failure criteria are specific and academic.  
  - **Broader Appeal:** Connects to decision theory, epistemology, and philosophy of science.  

  **Tips for Filling In:**  
  - Add citations where indicated.  
  - Specify your department/institution’s resources (e.g., faculty mentors, workshops).  
  - In the "Broader Impact" section, note how this advances your PhD research.  
  - Use bold/headings for readability (avoid in final submission if prohibited).  

  This framework turns your "half-baked" insight into a rigorous, fundable project by focusing on *why* the debate persists—not just rehashing it. Good luck!
