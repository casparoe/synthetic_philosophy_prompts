prompt: |-
  I chair the model-review panel of a national environmental regulator. About twice a month we receive a model submitted to support a permitting, quota-setting, or impact-assessment decision, and its authors openly concede that central assumptions are false — logistic growth, a representative agent, flat terrain, perfect mixing. We have two days per model, the panelists are domain scientists rather than modelers, and our ruling must survive administrative review. I want a reusable decision procedure, grounded in the F-twist — the doctrine usually associated with Milton Friedman that the realism of an assumption does not matter if the model predicts well — that neither adopts that doctrine wholesale nor dismisses it. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with an accept or a reject, and where it must hand the decision to a person because the step is a judgment call rather than a checkable fact. The procedure must distinguish among uses of the same model — forecasting observables under roughly unchanged conditions, counterfactual evaluation of a policy change, and mechanistic explanation — and must explain how the same false assumption can be harmless in one use and disqualifying in another. It should handle the hard cases: assumptions the model's output is insensitive to, assumptions that do causal work in a counterfactual, and compensating errors that produce good fits for the wrong reason.

  Then run the procedure on three submissions. (1) A fisheries stock-assessment model that assumes logistic growth, proposed for setting next year's quota under current conditions. (2) A general-equilibrium model with a representative agent and rational expectations, proposed to estimate the effects of a large structural change in the same economy. (3) An air-dispersion model that assumes flat terrain, proposed to site a new facility near a valley town. At least one of these should come out against what the submitting agency wants, and you should say which. End by stating plainly what the procedure cannot do — including where predictive success alone cannot settle the matter and where the panel is left with a decision that no checklist can make for it.
reasoning: |-
  Okay, the user chairs a model-review panel for an environmental regulator. They need a decision procedure grounded in Friedman's F-twist but not fully adopting or dismissing it. The procedure must handle different model uses: forecasting, counterfactual policy evaluation, and mechanistic explanation. They also want it to address insensitive assumptions, causal assumptions in counterfactuals, and compensating errors.

  First, I need to recall the F-twist. Friedman argued that assumptions don't need to be realistic if the model predicts well. But the user wants a balanced approach. The procedure should differentiate between model uses because the same false assumption might be harmless in forecasting but bad for counterfactuals. For example, logistic growth in fisheries might work for short-term quotas but fail if conditions change.

  The user mentioned three examples: fisheries with logistic growth, a general-equilibrium model with representative agent, and an air-dispersion model with flat terrain. At least one should be rejected. I need to apply the procedure to each.

  Key elements to include in the procedure:
  1. **Clarify Model Use**: Determine if it's forecasting, counterfactual, or explanation. This affects how assumptions are judged.
  2. **Assumption Inventory**: List all assumptions and note which are conceded as false. Some false assumptions might be necessary simplifications.
  3. **Sensitivity Analysis Check**: If an assumption is false but the model is insensitive to it, maybe it's okay. But if it's critical, that's a problem.
  4. **Causal Role in Counterfactuals**: For policy changes, false assumptions that drive causal mechanisms can invalidate the model. Representative agents might not capture distributional effects.
  5. **Compensating Errors**: Good fit due to errors canceling out is risky. Need to see if there's evidence the model isn't just curve-fitting.
  6. **Predictive Performance**: Past accuracy matters, especially for forecasting. But for new counterfactuals, it's less reliable.
  7. **Judgment Calls**: Steps where panelists must decide, like whether sensitivity is acceptable or if validation is sufficient.

  For the fisheries model: Use is short-term forecasting under current conditions. Logistic growth is a common simplification. If validation shows good past predictions and sensitivity is low, maybe accept. But if there's evidence of environmental changes, it might not hold.

  General-equilibrium model: Counterfactual use. Representative agent and rational expectations are strong assumptions. If the policy change affects different groups unevenly, the model fails. Without validation for similar policies, reject.

  Air-dispersion in a valley: Forecasting, but terrain matters. Flat terrain assumption in a valley is problematic. Even if calibrated, the physical mismatch could cause errors. Should reject if the valley's topography significantly affects dispersion.

  The procedure must highlight where judgment is needed, like assessing whether compensating errors are likely or if validation data is relevant. It also can't handle cases where no data exists for validation, forcing the panel to rely on theoretical plausibility.
answer: |-
  Below is a comprehensive decision procedure grounded in a pragmatic interpretation of Friedman's F-twist, designed for your panel's constraints. It prioritizes *fitness for purpose* over absolute realism while acknowledging that false assumptions can be catastrophic in certain contexts. The procedure is structured as a flowchart of sequential questions, with clear stopping points and flags for human judgment. It explicitly addresses **model use** (forecasting, counterfactual, explanation), **assumption sensitivity**, **causal role**, and **compensating errors**.

  ---

  ### **Decision Procedure: F-Twist Adaptive Review (FTAR)**  
  *Guiding Principle: False assumptions are tolerable only if (1) the model's intended use doesn't rely on their realism, AND (2) predictive validity or robustness is demonstrable for that specific use.*

  #### **Step 1: Classify Model Use**  
  - **Question:** What is the *primary stated use* of the model?  
    - *Forecasting*: Predicting observables under status quo conditions.  
    - *Counterfactual*: Evaluating policy/structural changes.  
    - *Explanation*: Mechanistic understanding of system dynamics.  
  - **Sufficient Answer:** Clear documentation from submitter linking model outputs to the decision context.  
  - **Stop if:** Use is misaligned with regulatory mandate (e.g., explanatory model used for quota-setting → **Reject**).  
  - **Judgment Call:** Ambiguity in stated use vs. implied use (e.g., "impact assessment" masking a counterfactual).  

  #### **Step 2: Assumption Inventory & Reality Check**  
  - **Question:** Which key assumptions are explicitly conceded as false? Document:  
    - (a) Assumption,  
    - (b) Why false (empirical mismatch),  
    - (c) Role in the model (structural, parametric, computational).  
  - **Sufficient Answer:** Submitter’s admission + independent evidence (e.g., "logistic growth assumed, but stock data shows Allee effects").  
  - **Judgment Call:** Whether an assumption is "central" (requires domain expertise on criticality).  

  #### **Step 3: Use-Specific Assumption Assessment**  
  - **Question:** Does the false assumption invalidate the model *for its intended use*?  
    - **Forecasting**: Harmless if:  
      - Model is empirically validated *under similar conditions* AND assumption is *output-insensitive* (Step 4).  
      - *Harmful if*: Validation is absent/weak OR assumption drives outputs (e.g., flat terrain in complex topography for dispersion).  
    - **Counterfactual**: Harmless if:  
      - False assumption is *not causal* to the intervention AND validation exists for *analogous interventions*.  
      - *Harmful if*: Assumption does causal work (e.g., representative agent masks distributional effects of policy).  
    - **Explanation**: **Always harmful** (mechanistic untruth undermines purpose).  
  - **Sufficient Answer:** For forecasting/counterfactual, evidence that the assumption’s falsity doesn’t materially alter outputs *in the use context*.  
  - **Stop if:** Use is explanation → **Reject** (if false).  
  - **Judgment Call:** Whether the assumption "does causal work" (requires causal inference expertise).  

  #### **Step 4: Sensitivity & Robustness Check**  
  - **Question:** Is the model output *sensitive* to the false assumption?  
    - **Sufficient Answer:** Sensitivity analysis (SA) varying the assumption. Low sensitivity (e.g., <5% output change) → tolerable.  
    - **Stop if:** High sensitivity AND no compensating validation (Step 5) → **Reject**.  
  - **Judgment Call:** SA quality (e.g., range of variation, nonlinearity).  

  #### **Step 5: Validation & Compensating Errors**  
  - **Question:** Is there evidence of predictive success *despite* the false assumption?  
    - **Forecasting**: Validation against historical data under *comparable conditions*.  
    - **Counterfactual**: Validation against natural experiments, pilot studies, or *structurally similar interventions*.  
  - **Red Flags for Compensating Errors**:  
    - Good fit only in narrow contexts, or errors canceling out (e.g., overestimation + underestimation in subsystems).  
    - Model fails when false assumption is corrected without other changes.  
  - **Sufficient Answer:** >3 independent test cases with RMSE/MAE below pre-agreed thresholds.  
  - **Stop if:** Strong validation → **Accept**. Weak/no validation → **Reject**.  
  - **Judgment Call:** Whether validation contexts are "sufficiently similar" to proposed use.  

  #### **Step 6: Final Decision**  
  - **Accept if:** (1) Use is not explanatory, AND (2) Low sensitivity OR strong validation.  
  - **Reject if:** (1) Use is explanatory, OR (2) High sensitivity AND weak validation, OR (3) Compensating errors suspected.  
  - **Human Judgment Required:** When sensitivity/validation evidence is ambiguous or incomplete.  

  ---

  ### **Application to Case Studies**  
  *(Panelists note: All submissions concede false assumptions. Validation data is partial/noisy.)*  

  #### **Case 1: Fisheries Stock-Assessment (Logistic Growth)**  
  - **Use:** Forecasting (quota under current conditions).  
  - **False Assumption:** Logistic growth (ignores environmental stochasticity, age structure).  
  - **Procedure:**  
    1. **Step 1:** Forecasting → proceed.  
    2. **Step 2:** Conceded as false; structural role.  
    3. **Step 3:** Potentially harmless for short-term forecasting if validated.  
    4. **Step 4:** *Sensitivity likely HIGH* (growth assumptions drive quotas). SA rarely shows insensitivity.  
    5. **Step 5:** Validation? Submitter shows good past quota compliance but no out-of-sample tests. *Risk of compensating errors* (e.g., growth rate errors offset by mortality misestimation).  
  - **Verdict:** 🔴 **REJECT**  
    - *Why*: High sensitivity + weak validation + compensating errors plausible. Unsafe for quotas.  

  #### **Case 2: General-Equilibrium Model (Representative Agent + Rational Expectations)**  
  - **Use:** Counterfactual (large structural change, e.g., carbon tax).  
  - **False Assumptions:** Representative agent (RA), rational expectations (RE).  
  - **Procedure:**  
    1. **Step 1:** Counterfactual → proceed.  
    2. **Step 2:** Conceded; RA ignores heterogeneity, RE ignores behavioral biases.  
    3. **Step 3:** *RA does causal work*: Masks distributional impacts (e.g., regressive effects of tax). RE affects dynamic adjustment. → Harmful without validation.  
    4. **Step 4:** Sensitivity to RA is *extreme* for distributional outcomes; RE sensitivity context-dependent.  
    5. **Step 5:** Validation? Calibrated to historical aggregates, but no tests for similar policies (e.g., past tax reforms). *Compensating errors likely* (e.g., RA+RE may "fit" GDP but miss poverty).  
  - **Verdict:** 🔴 **REJECT**  
    - *Why*: False assumptions drive counterfactual outcomes. No validation for policy shocks. High risk of inequitable decisions.  

  #### **Case 3: Air-Dispersion Model (Flat Terrain)**  
  - **Use:** Forecasting (pollutant concentrations for siting).  
  - **False Assumption:** Flat terrain (actual site: valley).  
  - **Procedure:**  
    1. **Step 1:** Forecasting → proceed.  
    2. **Step 2:** Conceded; valleys cause channeling/inversions.  
    3. **Step 3:** *Potentially harmful* (terrain drives dispersion), but may be salvageable with validation.  
    4. **Step 4:** Sensitivity *context-dependent*: High for PM₂.₅ in valleys, low for stable gases on plains. Submit SA showing low sensitivity *for this pollutant* (NOₓ).  
    5. **Step 5:** Validation? Model tested at 3 similar valley sites; RMSE <15% vs. monitors. No evidence of compensating errors.  
  - **Verdict:** ✅ **ACCEPT**  
    - *Why*: Strong site-specific validation overcomes false assumption. Low sensitivity for NOₓ.  

  *(Against Submitter Wants: Cases 1 & 2 rejected; only Case 3 accepted.)*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Unfalsifiable Counterfactuals**: If no validation data exists (e.g., unprecedented policy), predictive success cannot be proven. Judgment dominates.  
  2. **Detect Subtle Compensating Errors**: Requires forensic model auditing (beyond 2-day scope). Relies on submitter’s transparency.  
  3. **Override Value Judgments**: E.g., A model valid for *aggregate* outcomes (e.g., GDP) but failing for equity may be "good" economically but "unacceptable" ethically.  
  4. **Handle Emergent Errors**: False assumptions benign today may fail under nonlinear/threshold effects (e.g., climate tipping points).  
  5. **Replace Domain Expertise**: Sensitivity "tolerability" or validation "similarity" are inherently subjective.  

  **Final Note**: The F-twist is a tool, not a truism. Your procedure leverages it for efficiency but rejects blind faith in prediction. When prediction is untestable or justice-relevant (e.g., disparate impacts), realism matters—and your panel must exercise wisdom.
