prompt: |-
  I'm drafting a novel whose protagonist, Elena, is a morally reflective person who works out her positions through concrete cases rather than by articulating abstract principles. Over the course of the manuscript, she has expressed the following verdicts:

  - When a friend serves her factory-farmed chicken, she quietly declines and later reflects that eating it would have been wrong, even though her single meal wouldn't have changed how many chickens are raised.
  - During an election chapter, she doesn't vote. When challenged, she says she lives in a district that isn't competitive; her vote wouldn't decide anything, so skipping it isn't wrong.
  - She confronts a neighbor who dumps used motor oil down a storm drain, calling it wrong even though one more quart in an already-degraded watershed makes no measurable difference.
  - She throws a plastic bottle in the trash rather than walking it to the recycling bin, and when a friend calls her on it she says it isn't wrong — one bottle is a rounding error.
  - She refuses to cross a picket line to shop at a grocery store whose workers are striking, saying it would be wrong even though her single purchase wouldn't affect the strike's outcome.
  - On a weekend away, she takes a very long shower in a region under drought restrictions, and when her host mentions it she says it isn't wrong — her shower isn't what's draining the reservoir.

  In the chapter I'm drafting now, she's traveling and wants to buy a bar of chocolate. She learns that the brand uses child labor in its cocoa supply chain. The chocolate is already on the shelf; her individual purchase won't change the company's practices or affect any specific child's working conditions.

  I need to know what Elena would say. I'm less interested in the answer itself than in the rule or rules that could jointly explain her earlier verdicts, which of those rules would say what about the chocolate, and which one best captures who she is. If her earlier verdicts genuinely underdetermine the answer, I'd like to know what principle I'd be committing her to with each choice — and what further case I could write into a later chapter that would settle which rule she's actually running.
reasoning: |-
  Okay, the user is writing a novel and has this character, Elena, who makes moral decisions based on specific situations rather than abstract principles. They've listed several instances where Elena judged actions as right or wrong, and now they want to know what Elena would do when faced with buying chocolate from a company that uses child labor. The key is to find a consistent rule that explains all her past decisions and apply it to this new scenario.

  First, I need to look at all the cases they provided. Let me list them out again:

  1. Declining factory-farmed chicken: She thinks it's wrong even though her single meal doesn't change anything.
  2. Not voting: Skipping isn't wrong because her vote wouldn't affect the outcome.
  3. Confronting the neighbor dumping oil: Wrong even though one quart won't make a measurable difference.
  4. Throwing plastic in trash: Not wrong because one bottle is insignificant.
  5. Not crossing picket line: Wrong even though her single purchase doesn't affect the strike.
  6. Taking a long shower during drought: Not wrong because her shower alone isn't depleting the reservoir.

  Hmm, some of these seem inconsistent at first glance. For example, why is not eating chicken wrong but not recycling a bottle okay? Both seem like individual actions with negligible impact. The same with not crossing the picket line (wrong) vs taking a long shower (not wrong). So there must be an underlying principle that differentiates these cases.

  The user mentioned that Elena works through concrete cases rather than abstract principles. So I need to find a pattern or rule that fits all these decisions. Let me group them:

  In cases where she thinks it's wrong (chicken, oil, picket line), there's a direct participation in harm or injustice. Refusing the chicken avoids complicity in factory farming. Confronting the oil dump addresses direct harm to the environment. Not crossing the picket line avoids undermining the workers' strike. 

  In cases where she doesn't think it's wrong (not voting, not recycling, long shower), the actions are more about inefficiency or non-participation rather than direct harm. Her vote not mattering, the bottle being a drop in the ocean, the shower not draining the reservoir.

  But wait, the chocolate case involves child labor. If the principle is about direct participation in harm, buying the chocolate would make her complicit in child exploitation. Even if her single purchase doesn't change anything, she's directly contributing to the system that uses child labor. That aligns with her refusal to eat the chicken (complicity in factory farming) and not crossing the picket line (complicity in undermining the strike).

  However, the recycling and shower cases don't involve direct harm in the same way. Throwing away a bottle is wasteful, but it's not actively participating in exploitation. Similarly, the long shower during a drought is inefficient, but she's not directly causing harm in the same manner as buying the chocolate.

  The voting case is tricky. She didn't vote because her vote wouldn't matter. But voting is about participation in a democratic process. Maybe she sees it as a duty only if it has impact? Or perhaps she doesn't view abstaining as complicity. Whereas with the chocolate, purchasing it is an active support of the company's practices.

  The user wants to know which rule best captures who Elena is. The complicity rule seems strong because it explains her strong stance against actions that involve direct participation in harm systems. Her character is morally reflective, so consistency in her reasoning is key.

  But the underdetermined part: if the chocolate case could go either way, what additional scenario could clarify? Maybe a situation involving indirect harm versus direct action. For example, if she learns about a company exploiting workers, but buying a product isn't directly linked (like a commodity vs a branded item). Or a case where her action could set an example for others, influencing beyond the immediate impact.

  Another idea: in the oil dumping case, she confronts the neighbor because the harm is direct and immediate. For the chocolate, the child labor is far removed in the supply chain. But she refused the chicken, which is also part of a larger system. So proximity might not be the factor.

  I think the complicity rule fits best. So for the chocolate, Elena would refuse to buy it, seeing it as participating in child exploitation, similar to the chicken and picket line cases. This makes her character consistent in rejecting complicity with harmful systems, regardless of individual impact.
answer: |-
  Based on Elena's pattern of judgments, her decision hinges on whether the action constitutes *complicity in an ongoing harm/injustice*, regardless of individual impact. Here's the breakdown:

  **The Key Principle: Complicity vs. Mere Inefficiency**
  Elena consistently condemns actions where she would be **actively participating in or benefiting from a harmful system/injustice**, even if her individual contribution is negligible. She excuses inaction or inefficiency when her action is merely a **drop in an ocean** without direct participation in harm.

  1.  **Wrong (Complicity):**
      *   *Eating factory chicken:* Participates in the system of factory farming.
      *   *Confronting oil dumping:* The neighbor is actively causing harm (pollution).
      *   *Refusing to cross picket line:* Crossing would be participating in undermining the workers' strike/justice effort.
  2.  **Not Wrong (Mere Inefficiency/No Direct Harm):**
      *   *Not voting:* Her inaction doesn't *actively* cause harm or support injustice; it's a failure to contribute to a solution in a situation where contribution is meaningless.
      *   *Not recycling the bottle:* Her inaction is wasteful/inefficient but doesn't *directly* participate in a specific harmful act.
      *   *Taking a long shower:* Her action is inefficient/selfish during scarcity but doesn't *directly* cause the drought or harm others *in that moment*; it's a failure to conserve.

  **Applying to the Chocolate:**

  *   **Buying the chocolate:** This is **active participation in and financial support of a system relying on child labor.** Elena is directly engaging with and benefiting from the exploitative supply chain. Her money flows into that system.
  *   **Conclusion:** Elena would **refuse to buy the chocolate.** Her refusal aligns with declining the factory chicken (participating in animal exploitation) and refusing to cross the picket line (participating in undermining workers). The negligible individual impact doesn't absolve her from being complicit in the underlying injustice.

  **Why this rule best captures Elena:**
  This principle of "Avoid Complicity in Harm/Injustice" defines her moral core. She is deeply sensitive to being an *agent* within a harmful system, even a minuscule one. It reflects a sense of personal integrity and a refusal to have her actions tainted by association with wrongdoing. It explains her willingness to confront the oil dumper (direct harm) while excusing her own shower (inefficiency). This principle makes her a character motivated by **clean hands and non-participation in evil**, rather than consequentialist impact or abstract duty.

  **If Underdetermined? Clarifying Scenarios:**

  While the complicity rule provides the strongest fit, one could argue the picket line case (direct local harm) feels different from the chocolate case (distant systemic harm). To definitively settle which rule she follows:

  1.  **Potential Rule 1: Complicity in Harm/Injustice (As Above)**
      *   Chocolate Verdict: **Refuse to buy.**
      *   Defining Character: **Integrity-focused: "My actions must not support evil."**
      *   *Clarifying Scenario:* Elena learns a local charity she volunteers for gets a small portion of funding from an unethical source (e.g., a fossil fuel company). The funding is already secured; her volunteering doesn't increase the funding. Does she quit? **Complicity Rule:** She likely *would quit* – her labor is supporting an organization tainted by the funding source, making her complicit. This mirrors the chocolate refusal.

  2.  **Potential Rule 2: Direct/Immediate Harm vs. Distant/Systemic Harm**
      *   Chocolate Verdict: **Might buy it?** (Distant harm, negligible impact).
      *   *Fits:* Oil dumping (direct, immediate harm - wrong), Shower (direct use but not immediate *harm* - okay), Voting (distant systemic - okay), Recycling (distant systemic - okay), Picket line (direct local harm - wrong).
      *   *Doesn't Fit as Well:* Factory chicken (distant systemic harm - yet she refuses). This is the major clash.
      *   Defining Character: **Locality/Immediacy Focused: "I act against clear, present harm I can see."**
      *   *Clarifying Scenario:* A friend buys clothes from a brand known for sweatshops overseas. It's already bought; not buying it wouldn't change anything. Does Elena criticize the purchase? **This Rule:** She likely *wouldn't* criticize strongly (distant harm), contrasting with her confrontation over the *direct* oil dumping.

  **Recommendation for the Chocolate Chapter:**
  Have Elena **refuse to buy the chocolate.** This is the most consistent choice based on her refusal of the factory chicken and the picket line crossing. It reinforces her defining trait of refusing complicity.

  **To Solidify the Rule in a Later Chapter:**
  Introduce the **Charity Funding Scenario**:
  *   Elena volunteers at a homeless shelter. She discovers 5% of its funding comes from a corporation notorious for exploitative labor practices in another country. The funding is a fixed annual grant; her volunteering doesn't affect the amount they receive. Her work directly helps local people in need.
  *   **If she struggles but ultimately quits:** Confirms the **Complicity Rule**. Her labor supports the tainted organization.
  *   **If she decides to stay:** Suggests the **Direct Harm Rule** is stronger. The good she does *here and now* outweighs the distant, indirect association. This would require revisiting the factory chicken verdict as an inconsistency or a special case (perhaps tied to personal consumption?).

  The Complicity Rule provides the most coherent and character-defining explanation for Elena's existing judgments, making refusal the compelling choice for the chocolate.
