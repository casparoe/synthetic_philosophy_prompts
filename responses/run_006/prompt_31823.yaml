answer: |-
  You've identified a profound and underappreciated pattern in complex systems! This **endogenous erosion of collective capacity** is a distinct and critical twist on standard coordination problems. While no single term is universally established, several concepts capture aspects of it:

  1.  **Collective Action Trap with Endogenous Capacity Decay:** The most direct description. It explicitly names the core mechanism: the trap itself actively degrades the prerequisites for escape (trust, institutions, resources, political will).
  2.  **Capability Trap (or Collective Capability Trap):** Adapted from development/organizational theory (e.g., Lant Pritchett, Michael Woolcock). It describes situations where persistent failure undermines the very capabilities needed to succeed. Your pattern is a specific type focused on *collective* capabilities.
  3.  **Erosion Trap / Capacity Cannibalism:** Highlights the *process* – the bad equilibrium "eats away" at the resources needed for its solution. "Cannibalism" is evocative of the self-consuming nature.
  4.  **Second-Order Collective Action Problem:** The initial coordination failure (1st order) creates a *new*, harder problem: rebuilding the eroded capacity *for* coordination (2nd order). Solving the 2nd order is a prerequisite for solving the 1st order.
  5.  **Systemic Institutional Decay:** Emphasizes the institutional dimension – failed coordination leads to the breakdown of the formal/informal rules and organizations needed for future coordination.
  6.  **Adaptation Debt (in Resilience/Sustainability contexts):** The longer adaptation (coordinated action) is delayed, the greater the accumulating costs (disasters, resource depletion, social conflict), which then consume the resources needed for adaptation, creating a debt spiral. Climate change is a prime example.

  **Distinguishing it from Standard Models:**

  *   **Standard Collective Action Problems (Olson, Ostrom):** Focus on overcoming free-riding, transaction costs, or preference heterogeneity *given* existing levels of trust, institutional strength, and resources. Capacity is assumed fixed or exogenous.
  *   **Tragedy of the Commons (Hardin):** Focuses on individual incentives leading to resource depletion despite collective detriment. It often assumes actors *could* coordinate *if* they overcame incentives, but doesn't inherently model the *erosion* of that capacity over time due to the tragedy itself.
  *   **Moloch / Multipolar Traps:** Describe how competitive pressures force agents into mutually destructive behaviors, even against their own interests. While related, Moloch often focuses on the *competitive dynamic forcing suboptimal choices*, not necessarily the *degradation of the capacity to choose collectively* as a *result* of the trap.

  **Key Differentiators of Your Pattern:**

  1.  **Endogenous Capacity Degradation:** This is the core. The *problem itself* actively consumes/destroys the resources (social, institutional, material, cognitive) needed for its solution.
  2.  **Dynamic Feedback Loop:** It's not static. The *longer* the bad equilibrium persists, the *worse* the capacity becomes, making escape *exponentially harder* over time. Time is a crucial dimension.
  3.  **Path Dependency:** Past failures actively constrain future possibilities by destroying options. History matters profoundly.
  4.  **Capacity as the Crucial Variable:** Success hinges not just on aligning incentives *now*, but on having sufficient residual collective capacity (trust, functional institutions, resources) *left* to even attempt alignment.

  **Why Your Examples Fit Perfectly:**

  *   **Price War:** The war (bad equilibrium) burns cash (material resource) and destroys trust (social capital), making negotiation (collective action) impossible. Capacity eroded *by* the problem.
  *   **Climate Change:** Failure to mitigate (coordination failure) leads to disasters (material resource drain) and political polarization/conflict (erosion of social cohesion and political will), crippling the capacity for the large-scale, long-term cooperation needed for mitigation/adaptation. The problem actively consumes the solution's fuel.

  **Conclusion:**

  While terms like "Collective Action Trap with Endogenous Capacity Decay" or "Collective Capability Trap" are descriptive, "**Capacity Cannibalism Trap**" or "**Collective Capacity Erosion Loop**" could serve as evocative, concise names. The critical insight is recognizing the **dynamic, self-reinforcing destruction of collective problem-solving capacity by the very problem it needs to solve**. This distinguishes it sharply from static models of coordination failure. It's a crucial concept for understanding the deepening intractability of systemic crises like climate change, institutional collapse, or prolonged social conflict. Scholars in institutional economics, complex systems, resilience theory, and political science are increasingly grappling with this dynamic.
