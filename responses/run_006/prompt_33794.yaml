answer: |-
  Your diagnosis of the population axiology impasse is astute. The core issue isn't primarily factual disagreement or irreconcilable "brute" intuitions, but a **clash of meta-ethical priorities regarding formal adequacy conditions**. Here’s a structural breakdown:

  ### 1. **Divergent Formal Constraints as Non-Negotiable Axioms**  
     Each theory prioritizes different axioms, treating them as foundational:
     - **Total Utilitarianism**: Prioritizes *Dominance* (if everyone in A is better off than in B, A is better) and *Non-Anti-Egalitarianism* (avoiding outcomes where equality is dispreferred to inequality). Sacrifices avoidance of the Repugnant Conclusion (RC).
     - **Averagism/Critical-Level Views**: Prioritize *Avoiding RC* and *Neutrality* (adding a life above a threshold doesn’t harm, below doesn’t benefit). Sacrifice *Dominance* (e.g., adding excellent lives can lower average welfare, making the outcome "worse").
     - **Person-Affecting Views**: Prioritize *Actualism* (only acts affecting existing people matter) and *Asymmetry* (avoiding suffering outweighs creating happiness). Sacrifice *Completeness* (cannot rank all populations) and *Transitivity* in trade-offs.

     These axioms are treated as **bedrock commitments**, making compromise impossible.

  ### 2. **Different "Data" as Litmus Tests**  
     Each theory uses distinct intuitive cases to invalidate rivals:
     - **Pro-RC Avoiders**: Treat the *Repugnant Conclusion* as an unacceptable reductio. If a theory implies RC, it’s falsified.
     - **Pro-Dominance Advocates**: Treat cases like *Mere Addition* (adding good lives shouldn’t make things worse) or *Dominance Violations* (e.g., rejecting a world with 1 billion happy people + 1 extra happy life because it lowers average welfare) as decisive refutations.
     - **Person-Affecters**: Use *Non-Identity Problems* (choices affecting future identities) or *Asymmetry Cases* (no obligation to create happy lives, but obligation to avoid miserable ones) to challenge impersonal views.

     These cases function as **incommensurable empirical "data"** for each camp.

  ### 3. **Conceptual Schisms: One Label, Different Questions**  
     Under "population ethics," theorists answer fundamentally distinct questions:
     - **Impersonal Welfare Aggregation**: "Which state of affairs has the most value?" (Total/Average views).
     - **Obligation to Possible Beings**: "Do we harm someone by creating them?" (Person-affecting views).
     - **Decision-Making Under Uncertainty**: "How do we choose when future identities/lives are unknown?" (e.g., probabilistic critical levels).

     Conflating these questions under "axiology" obscures incompatible goals.

  ### 4. **Bedrock Intuitions Beyond Argument**  
     Some intuitions resist further justification:
     - The visceral revulsion toward RC.
     - The conviction that *adding a blissful life* must improve the world (Dominance).
     - The intuition that nonexistent beings cannot be "harmed" by not being created.
     These are **axiomatic starting points**—not conclusions of reasoning.

  ---

  ### **Pathways to Progress (and Limits)**  
  True consensus is unlikely, but progress can occur through:

  1. **Mapping the Axiomatic Trade-offs**:  
     Rigorously formalize the incompatibilities (e.g., prove that avoiding RC + satisfying Dominance requires intransitivity). Accept that no theory satisfies all intuitions, forcing explicit prioritization.

  2. **Contextual Domain Restriction**:  
     Acknowledge different principles for different domains:
     - *Actual Populations*: Person-affecting principles may dominate.
     - *Future/Large-Scale Choices*: Critical-level views may be pragmatic.
     - *Idealized Comparison*: Total views apply if RC is ignored.

  3. **Weakening Axioms**:  
     Develop theories with *less demanding* constraints (e.g., "moderate dominance" or "probabilistic neutrality"). Accept "good enough" coherence over universal validity.

  4. **Shifting Focus to Decision Procedures**:  
     Bypass axiology by focusing on *procedural rules* (e.g., maximin for catastrophic risks, ex ante Pareto under uncertainty) rather than "best outcome" rankings.

  5. **Metaphysical/Epistemic Grounding**:  
     Investigate whether the impasse stems from unexamined assumptions (e.g., the nature of well-being, moral status of possible beings). If, for example, well-being is relational or identity-dependent, person-affecting views gain ground.

  ---

  ### **Conclusion: The Limits of Expectation**  
  The impasse is **structural and persistent**—it arises from incommensurable moral axioms and irreducible intuitive bedrock. Progress won’t yield a universal solution satisfying all constraints, but can clarify trade-offs, contextualize theories, and refine the debate. Expecting resolution misunderstands the nature of normative ethics: these disagreements reflect deeper pluralism in value commitments. The viable path forward is **diagnostic clarity**, not theoretical conquest.
