prompt: |-
  I retired a few years ago from a career in quantitative genetics, and I have recently been reading moral philosophy, largely for the pleasure of watching careful people argue about matters I once took for granted. A family matter has now brought one of those arguments into my own house, and I find that I do not know how to advise the people involved.

  My daughter and her husband are going through in vitro fertilization. Because my daughter is thirty-nine, the clinic recommended preimplantation genetic testing, which at first covered only chromosomal abnormalities and a small number of severe single-gene disorders; that seemed unremarkable to me. The clinic, however, now offers a further screen: polygenic risk scores for conditions such as schizophrenia, type 2 diabetes, and major depression, and, more disconcertingly, scores for complex traits such as body mass index and predicted educational attainment. The couple has seven viable embryos, and the reports rank them. My daughter is torn. She says that if she is going to bring one of these possible children into the world in any case, it would be almost negligent not to choose the one with the best prospects for a good life. Her husband replies that selecting on such scores treats their future child as a product to be optimized, and that there is something troubling about ranking one's own possible children by a polygenic number. They have asked me, as someone who once worked with exactly this kind of data, whether the act of selection itself is morally objectionable, or whether, once the decision to have a child has been made, it is not only permissible but perhaps even required to choose the embryo with the best expected life.

  I am pulled in both directions. As a scientist, I am inclined to think that if information exists and is relevant to a decision, it would be irrational simply to ignore it. As a parent, I flinch at the thought of choosing a child the way one would select a line in a breeding program. There is also a further puzzle: the embryos not chosen would never have become anyone at all, so it is not obvious that anyone is harmed by the choice. I would be grateful for a clear way of thinking about this. Is there a defensible principle to the effect that we ought to select the possible child with the best chance of the best life, and if so, where does that principle run into difficulty once the traits in question go beyond the prevention of disease?
reasoning: |-
  Okay, the user is a retired quantitative geneticist who's now dealing with a personal ethical dilemma involving his daughter's IVF process. He's torn between his scientific background and moral concerns about embryo selection using polygenic risk scores (PRS). Let me unpack his situation.

  First, his daughter and son-in-law have seven viable embryos. The clinic offers PRS for conditions like schizophrenia and diabetes, but also traits like BMI and educational attainment. The couple is conflicted: the daughter sees not selecting the "best" embryo as negligent, while the husband feels it's treating their child like a product. They've asked him for advice, given his genetics expertise.

  The user's internal conflict is clear. Scientifically, he believes in using available data rationally. But as a parent, the idea of "optimizing" a child feels dehumanizing, reminiscent of breeding programs. He also raises a key point: since unchosen embryos won't develop, is anyone actually harmed? He wants a principled way to navigate this, especially when traits go beyond disease prevention.

  Deeper needs emerge here. He's not just seeking an ethical framework; he's looking for reconciliation between his professional identity and newfound philosophical concerns. His mention of "watching careful people argue" suggests he values nuanced debate but now needs actionable clarity for his family. There's also an unspoken emotional layer—grandparental responsibility and fear of influencing his daughter's decision poorly.

  The core tension is between two ethical principles: well-being maximization (selecting the embryo with best life prospects) versus anti-commodification (not reducing children to optimization projects). The harm question is tricky—unchosen embryos aren't "harmed" since they never exist, but societal consequences might arise if such selections normalize.

  For traits beyond health, issues intensify. Educational attainment PRS, for example, reflects current societal biases. Selecting based on this could reinforce inequities. The gap between prediction and lived outcomes is another scientific concern: PRS have limited accuracy for individuals, especially for complex traits.

  He might also worry about unintended effects on parenting. Choosing an embryo for "high education potential" could create unrealistic expectations, affecting parent-child dynamics. And while the clinic presents scores as objective, they're probabilistic and context-dependent—a high BMI risk score might mean nothing with a healthy environment.

  To address his request for a "defensible principle," I should emphasize that disease prevention is widely accepted, while non-health traits enter murkier territory. A possible boundary is selecting only for conditions that guarantee severe suffering or prevent a fulfilling life. Beyond that, the moral risks outweigh benefits.

  He'd benefit from practical advice too: urging the couple to discuss what "good life" means beyond genetics, questioning clinic marketing pressures, and considering future regret. Highlighting PRS limitations might help them weigh the data's true value.

  Ultimately, his role isn't to decide but to equip his daughter with balanced perspective—honoring both his scientific rigor and humanistic concerns. That bridge is what he's really seeking.
answer: |-
  Your situation touches on profound ethical tensions at the intersection of science, parenthood, and human dignity. There is no universally agreed-upon answer, but we can analyze this through several philosophical lenses to provide clarity. Below is a framework for thinking about the core dilemmas:

  ### 1. **The "Non-Identity Problem" (Harm to Whom?)**
     - **The Issue**: As you note, unchosen embryos never become persons—so no *specific individual* is harmed by not being selected. This distinguishes embryo selection from harming an existing person.
     - **Counterargument**: Philosophers like Derek Parfit argue that while no *particular* child is harmed, we might still have a duty to create the child (among possible children) with the "best chance of the best life." This is the **"Principle of Procreative Beneficence"** (proposed by Julian Savulescu).
     - **Your Dilemma**: This principle seems compelling when selecting against severe genetic disorders (e.g., Tay-Sachs). But does it extend to polygenic scores for traits like BMI or educational attainment? Where do we draw the line?

  ### 2. **The Moral Limits of Selection: Disease vs. "Enhancement"**
     - **Disease Prevention**: Selecting against embryos with high genetic risk for schizophrenia or severe diabetes aligns with medical ethics—it prevents suffering without fundamentally altering identity.
     - **Non-Medical Traits**: Traits like BMI or educational attainment are:
       - **Probabilistic, Not Deterministic**: PRS predict *relative risk*, not destiny. Environment, upbringing, and randomness play larger roles.
       - **Value-Laden**: "High educational attainment" reflects societal preferences, not intrinsic "goodness." Prioritizing it could reinforce class or ability biases.
       - **The Slippery Slope**: If we select for educational potential today, what about selecting for height, personality, or appearance tomorrow? This risks reducing children to engineered products.

  ### 3. **Commodification vs. Parental Love**
     - **Commodification Concern**: Your son-in-law’s unease echoes Kantian ethics: treating a future child as an object to optimize violates human dignity. Selection for non-health traits instrumentalizes the child, making parental love conditional on genetic "quality."
     - **Parental Love Argument**: The philosopher Michael Sandel warns that genetic selection could undermine the "gifted" nature of life—replacing unconditional acceptance with a mindset of control. Parents may feel pressured to "maximize" their child, breeding resentment if traits don’t manifest.
     - **Counterpoint**: Parents already optimize environments (e.g., choosing schools). Is genetic selection meaningfully different?

  ### 4. **Scientific Limitations & Practical Risks**
     - **Accuracy of PRS**: As a geneticist, you know PRS for complex traits:
       - Explain only 5–20% of variance (e.g., educational attainment PRS captures ~10–15% of heritability).
       - Are population-level statistics, not precise individual predictions.
       - Interact unpredictably with environment (e.g., a "high BMI risk" embryo raised healthily may never develop obesity).
     - **Unintended Consequences**: Selecting for one "desirable" trait could inadvertently select for undesirable ones (e.g., genes linked to high educational attainment correlate with higher autism risk).

  ### 5. **A Defensible Middle Ground?**
     While absolute principles are elusive, these guidelines may help:
     - **The "Severe Suffering" Threshold**: Select only against conditions guaranteeing profound suffering (e.g., lethal childhood disease). PRS for schizophrenia may approach this threshold; BMI or education do not.
     - **Reject Non-Medical Traits**: Traits like educational attainment are ethically distinct from disease. Prioritizing them risks eugenic logic and misinterprets "best life" as a genetic scorecard.
     - **Respect Autonomy Over Optimization**: The clinic’s offer frames selection as a moral obligation. Reframing it as a *personal choice*—where *either* decision (using or ignoring non-medical PRS) is valid—reduces pressure.
     - **Focus on What Matters**: A "good life" isn’t reducible to genetics. Resilience, relationships, and purpose matter more than polygenic scores. As Viktor Frankl wrote, "Between stimulus and response there is a space… in that space is our power to choose."

  ### What to Advise Your Daughter
  1. **Acknowledge Validity of Both Views**:  
     *"Your feelings reflect a real tension: wanting the best for your child vs. honoring their intrinsic worth. Neither position is irrational."*  
  2. **Highlight Scientific Uncertainty**:  
     *"PRS for non-disease traits are probabilistic and limited. Selecting an embryo for 'high education potential' is like choosing a stock based on a 10% predictive model—fraught with unknowns."*  
  3. **Question the Clinic’s Framing**:  
     *"Calling selection 'non-negligent' pressures parents into optimization. But rejecting non-medical PRS isn’t negligence—it’s refusing to reduce your child to data."*  
  4. **Suggest a Compromise**:  
     *"Use PRS only for conditions causing severe impairment (e.g., schizophrenia risk), then select randomly among remaining embryos. This balances precaution with humility."*  

  ### In Summary
  The principle *"select the embryo with the best chance of the best life"* runs into moral difficulty when **non-essential traits** are involved. Beyond preventing severe suffering, selection risks:
  - Commodifying human life,
  - Mistaking probabilistic scores for destiny,
  - Imposing narrow societal values on a future person.

  Your instinct as a scientist—to use relevant data—is sound for **health-related risks**. Your instinct as a parent—to reject "optimization" of complex human traits—guards against deeper harms. In this case, wisdom lies in distinguishing between preventing profound suffering and pursuing genetic perfection. The latter may promise control but costs us our humanity.
