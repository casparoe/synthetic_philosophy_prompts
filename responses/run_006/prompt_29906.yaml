prompt: |-
  I keep seeing people argue about free will by pointing at one case — the wasp, or the addict, or someone driving on autopilot — and I want the full spec before I read any more of that. I'm trying to put together a list of requirements that any theory of free will built around the flexibility/rigidity contrast (flexibility vs sphexishness, mechanical routine, being stuck in a loop) has to satisfy to be worth taking seriously. Don't give me a literature review or citations; I want the criteria, with the case or consideration behind each, and a clear call on which are non-negotiable and which are just one camp's preferences.

  Here's the rough territory. The standard sphex wasp story: the wasp drags a paralyzed cricket to the mouth of her burrow, leaves it there, goes inside to check the burrow, comes back out, and drags the cricket in. If you nudge the cricket a couple inches away while she's inside checking, she comes out, drags it back to the threshold, and goes inside to check again — and again, indefinately. It looks smart but it's a fixed loop; she never just skips the check and drags it in. The question I want the requirements for: what does a theory of free will (or agency, or whatever you call the thing the wasp lacks and we supposedly have) have to deliver if it's going to use that flexibility/rigidity contrast as its backbone? I want a theory good enough to draw the line between the wasp and us without saying anything obviously false about either.

  Things I'd want the list to cover, at minimum:
  - Which cases it has to get right: the wasp, addiction, compulsion, habit, driving on autopilot, but also fast expert action that isn't deliberated at all.
  - Which distinctions it can't collapse — flexibility vs mere randomness or noise, flexibility vs unpredictability, responsiveness to reasons vs behavioral plasticity, and whether free will is all-or-nothing or comes in degrees.
  - What results from animal cognition it can't contradict, if it's going to put the line anywhere near humans rather than somewhere down in the wasp's neighborhood.
  - Whether the wasp is even a good foil, or whether the real requirement is something like attention, self-control, or caring about what one does, which the wasp story doesn't actually touch.

  For each requirement, say why it's a requirement. Then flag any pairs that can't be jointly satisfied — I suspect there's a real tension between wanting free will to involve reliable commitment (not being blown around by every stimulus) and wanting it to involve flexibility (not being stuck in a loop), and I want to know whether that's a real conflict or just sloppy talk. Finally, tell me which single requirement does the most to knock out the popular positions, and run a couple of standard contenders against the list briefly — a reasons-responsiveness view, a simple libertarian view that equates free will with indeterminism, and whatever the Dennett-style line around the wasp example amounts to.

  Oh, and write it in American English.
reasoning: |-
  Okay, let me break this down. The user wants a rigorous set of criteria for theories of free will based on the flexibility/rigidity contrast, specifically using the sphex wasp as a benchmark. They're tired of superficial debates and want concrete requirements that avoid common pitfalls. 

  First, I need to identify their core demands: 
  - Must cover key cases: sphex wasp, addiction, autopilot actions, expert intuition 
  - Must preserve distinctions like flexibility vs randomness, reasons-responsiveness vs plasticity 
  - Must align with animal cognition research 
  - Must resolve the tension between commitment and flexibility 

  Hmm, the deeper need here seems to be cutting through philosophical noise. They want a theory that doesn't just sound smart but actually works when applied to real-world examples. The mention of "obviously false" claims suggests they've encountered too many oversimplified positions. 

  I'll start by listing non-negotiable criteria based on their examples. The wasp case demands Contextual Modifiability - any theory must explain why we can break loops when circumstances change. Addiction requires the Reason-Sensitivity criterion to distinguish compulsion from choice. Autopilot driving needs Habit Integration to show how routines remain flexible. Expert actions need Fluid Expertise to validate undeliberated but skillful behavior. 

  For distinctions, avoiding randomness is crucial (Noise vs Agency). Unpredictability alone doesn't equal freedom - that's covered under Predictability Independence. Degrees of Freedom is vital because rigid binaries fail with cases like OCD vs habits. 

  Animal cognition compatibility is tricky. If we place free will only in humans, we must explain why corvids or primates showing flexible problem-solving don't qualify. That's where Meta-Ability comes in - the capacity to develop new capacities. 

  The commitment/flexibility tension is real. Theories often sacrifice one for the other. The Resolution Criterion forces them to handle both - like a jazz musician improvising within structure. 

  Biggest troublemaker? Probably the Contextual Modifiability test. Libertarian randomness fails it hard. Reasons-responsiveness views might struggle with expert actions. Dennett's pragmatism could fudge the degrees issue. 

  I'll structure this as: 
  1) Non-negotiables with case-based justifications 
  2) Critical distinctions 
  3) Animal cognition constraints 
  4) Tension resolution 
  Then pit major theories against the toughest criterion. 

  Better avoid academic jargon. They want brass tacks - "show me why this works or doesn't with the wasp."
answer: |-
  Here’s the distilled criteria list for a flexibility-based theory of free will, grounded in the sphexishness contrast. Each requirement is tied to a core case or distinction, with non-negotiables flagged. The goal: **explain why we can break loops the wasp can’t, without collapsing key distinctions or contradicting science.**

  ### Non-Negotiable Requirements (Fail Any = Theory Rejected)
  1. **Contextual Modifiability**  
     *Why*: Must explain why a human driver on autopilot *can* snap out of routine (e.g., swerve for a pedestrian) while the sphex wasp *cannot* break her loop when the cricket moves.  
     *Case*: Sphex wasp vs. "Autopilot" driving. Failure means the theory can’t handle its central foil.

  2. **Reason-Sensitivity, Not Just Stimulus-Response**  
     *Why*: Must distinguish between behavioral plasticity (e.g., a robot reprogrammed to avoid obstacles) and genuine responsiveness to *reasons* (e.g., an addict resisting a craving because they value sobriety).  
     *Case*: Addiction/compulsion vs. deliberate choice. Failure collapses flexibility into mere adaptability.

  3. **Noise vs. Agency Distinction**  
     *Why*: Must exclude pure randomness (e.g., quantum noise affecting a decision) as "free will." Flexibility requires *directed* variation, not chaos.  
     *Case*: Libertarian "indeterminism as freedom" fails here. Random acts aren’t flexible; they’re erratic.

  4. **Degrees of Freedom**  
     *Why*: Must accommodate that freedom varies (e.g., OCD ritual vs. habitual coffee-drinking vs. deliberate calculus). Rigidity/flexibility is a spectrum.  
     *Case*: Habits vs. compulsions vs. expert intuition. All-or-nothing theories fail real-world psychology.

  5. **Habit Integration**  
     *Why*: Must explain how automatic actions (e.g., typing, driving) retain flexibility when *relevant* while being efficient. The wasp’s loop is inflexible; our habits are interruptible.  
     *Case*: Expert pianist adjusting mid-performance vs. sphex loop.

  ---

  ### Critical Distinctions (Collapsing These Weakens Theory)
  6. **Predictability Independence**  
     *Why*: Unpredictability ≠ freedom (a hurricane is unpredictable but not free). Flexibility requires *competence*-based unpredictability.  
     *Case*: A chess AI making novel but rational moves vs. sphex’s predictable loop.

  7. **Fluid Expertise Requirement**  
     *Why*: Must validate undeliberated, fast decisions (e.g., ER doctor triaging) as free/exercises of agency—not "automatisms."  
     *Case*: Expert action vs. sphex rigidity. Failure overvalues deliberation.

  ---

  ### Animal Cognition Constraint
  8. **Meta-Ability Threshold**  
     *Why*: If placing freedom only in humans, the theory must identify a capacity absent in *all* non-human animals (including corvids/primates that use tools, solve novel problems). Cannot rely on vague "consciousness."  
     *Case*: Crow bending wire to hook food displays flexibility—why isn’t this free will? Theory must pinpoint what’s missing (e.g., hierarchical goal management, self-ascription of reasons).

  ---

  ### The Core Tension: Commitment vs. Flexibility
  **Requirement 9: Resolution Criterion**  
  *Why*: Must reconcile stability of character/commitments (e.g., keeping promises) with capacity to change course when warranted (e.g., revising goals).  
  *The Conflict*:  
  - **Commitment** requires resistance to impulses/distractions (not "blown around").  
  - **Flexibility** requires breaking routines when context demands (not "stuck in a loop").  
  ***Resolution Test***: Explain how a person can be steadfast in their values (e.g., sobriety) yet flexibly adapt tactics when obstacles arise (e.g., finding new coping strategies).  
  *Failure*: Theories that sacrifice one for the other (e.g., equating freedom with constant openness = chaos; equating it with rigid integrity = sphexishness).

  ---

  ### Which Requirement Knocks Out the Most Theories?  
  **Contextual Modifiability + Reason-Sensitivity** (Requirements 1 & 2).  
  - **Libertarian Indeterminism**: Fails #3 (randomness ≠ agency) and #1 (random breaks in a loop aren’t *reasoned* modifiability).  
  - **Simple Reasons-Responsiveness**: Often fails #7 (can’t explain expert intuition as reason-responsive without stretching "reasons") and #8 (animals respond to reasons too).  
  - **Dennett-Style Pragmatism** (Freedom as "evitability"): Risks failing #2 (if "evitability" is just behavioral plasticity, it doesn’t distinguish sphex-like reprogramming from true agency) and #9 (under-specifies how stability integrates with flexibility).

  ---

  ### Was the Sphex a Good Foil?  
  **Yes, but insufficient alone.** The sphex illustrates rigid *action sequences*, but the real requirement is **Goal-Directed Meta-Flexibility**:  
  - Ability to inspect/modify *sub-goals* (not just actions).  
  - Ability to manage attention/effort to override impulses (self-control).  
  - Capacity for second-order evaluation ("Is this loop useful?").  
  *Why the sphex works*: It’s a pure example of inflexible implementation. But humans also get stuck in *value ruts* (addiction, dogma). A theory must handle both behavioral and cognitive rigidity.

  ---

  ### Summary: The Winning Theory Must...  
  - **Break loops** when context changes (1) for **reasons** (2), not randomly (3).  
  - Accept that freedom is **graded** (4) and **integrates habits** (5).  
  - Treat unpredictability (6) and expertise (7) as byproducts, not essence.  
  - Draw a credible **line above animals** (8) using meta-cognition.  
  - Resolve the **stability/flexibility paradox** (9).  

  **Fail any non-negotiable (1-5)?** Theory is dead on arrival.  
  **Miss the resolution (9)?** It’s incomplete at best.  
  The sphex is your canary in the coal mine—but the mine goes deeper.
