prompt: |-
  Im putting together a handout for a grad reading group on infinite ethics (ranking worlds with infinitely many people, roughly the Bostrom discussion) and I want a decision tree that sorts a reader into a named position. Build it from the logical space, not from a list of names: each branch node should be one of the claims the positions actually split on, phrased as a question someone could answer without already knowing the literature. The distinctions I want doing the work are: whether adding one extra happy life to an otherwise identical world makes it strictly better; whether a world where every person is better off than every person in another must rank above it (Pareto); whether merely permuting which person lives which life can change the value (anonymity); whether you'll only compare worlds that differ in finitely many lives; whether you'll rank worlds by taking limits over expanding finite regions; and whether infinite or infinitesimal differences in value are allowed to count instead of cancelling out. Leaves should include total utilitarianism (and how it breaks down in the infinite case), average utilitarianism, limit/catching-up and overtaking views, hyperreal or infinitesimal value approaches, person-affecting or finite-difference views, and infinitarian paralysis as a diagnosis rather than a positive view. Flag any combination of answers that has no occupant and say whether its empty because incoherent, unattractive, or just unexplored; also flag which pairs of leaves your tree cant actually separate. Aim for about six branch questions and seven or eight leaves, no more.

  Give me the response in this order:

  1. The tree — the actual decision structure, as text or an indented flowchart, 300-500 words.
  2. Branch questions unpacked — one or two sentences each on what the question is really testing and why it cuts, ~200 words.
  3. Leaf positions — one sentence each naming the view and its most awkward commitment in the infinite case, ~200 words.
  4. Empty cells and near-misses — unoccupied answer combinations and why they're empty, plus pairs of leaves the tree fails to separate, ~150 words.
