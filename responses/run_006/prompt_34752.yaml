prompt: |-
  I keep running into the same tangle in arguments about animal minds, and I don't have a word for it. The people I argue with are perfectly happy to say that awareness comes in degrees — a dog has more of it than a mouse, a mouse more than a bee, a bee more than... something. But then when the conversation turns to what we owe the animal, the same people switch to on/off talk: either a thing 'counts' morally or it doesn't. And there's a third wrinkle: they'll happily say a thermostat 'detects' temperature and a fly 'reacts' to being swatted, but if I ask whether the thermostat is at the bottom of the same scale as the dog or off the scale entirely, they act like I've changed the subject. So here's my question. Is there an established name for the specific view that moral weight should track degree of awareness all the way down, so the thermostat sits on the same scale as the dog, just at a negligable point — as opposed to the weaker view that awareness is graded but moral weight stays basically on/off? A bare name won't do me much good: I want the nearest concepts and how my view differs from each. And please separate what's settled from what's genuinely contested among people who work on this, and don't present a contested view as the consensus.
reasoning: |-
  Okay, the user is grappling with a specific philosophical problem in debates about animal minds. They've noticed a recurring inconsistency in how people discuss awareness versus moral consideration. On one hand, their interlocutors acknowledge graded awareness (dogs > mice > bees), but then switch to binary moral status when discussing obligations. There's also this weird disconnect with simple systems like thermostats being treated differently when placed on the same scale.

  Hmm, they're clearly well-versed enough to spot these nuances but frustrated by the lack of precise terminology. Their core need seems to be: "What's the name for the position that moral weight should proportionally track graded awareness all the way down to simple systems?" But they also want more - they need conceptual mapping to navigate related positions and understand where consensus ends and controversy begins.

  Let me unpack the layers here. First, the descriptive claim about consciousness (graded) versus the normative claim about moral status (often binary in practice). The thermostat example is key - it reveals whether people see consciousness as a continuum including non-biological systems or as emergent only beyond certain complexity. 

  The closest established concept is probably scalar utilitarianism (Singer's early work) but that typically stops at sentient animals. For true continuum-down-to-thermostats views, I recall Chalmers' panpsychism and Tononi's IIT, though both are highly contested. The moral weight extension seems even less charted territory - maybe Harish Sethu's work? 

  Important to flag that the thermostat inclusion is where most philosophers would part ways. Need to emphasize that while graded consciousness has growing traction (Birch, Shea), linking it directly to proportional moral weight for all causal systems is very much a minority view. Should clarify the spectrum: from mainstream animal ethics (binary sentience threshold) to continuum views (Singer) to radical panpsychist ethics. 

  User seems analytical - they'll appreciate distinguishing descriptive/normative axes and labeling all positions neutrally. Must avoid presenting IIT or panpsychism as consensus. Key to validate their frustration about conceptual slippage in debates - it's a legit observation about how people inconsistently apply thresholds.
answer: |-
  You've perfectly described a deep conceptual tangle in animal ethics and philosophy of mind. There *isn't* a single, universally agreed-upon name for the specific "moral weight tracks degree of awareness all the way down" view, but we can map the conceptual landscape clearly and identify the closest contenders and key distinctions.

  Here's a breakdown of the relevant concepts and how your view differs:

  1.  **Graded Consciousness (or Sentience / Phenomenal Consciousness):**
      *   **What it is:** The descriptive view that subjective experience (awareness, sentience, "what it's like to be") comes in degrees of richness, complexity, intensity, or unity. A dog has more complex inner states than a mouse, etc.
      *   **Status:** Increasingly accepted *descriptively*. Major theories like Integrated Information Theory (IIT) explicitly model it as a graded property. Ethologists and neuroscientists often work with this assumption empirically. **Not fully settled, but a dominant trend among those who accept consciousness in non-humans.** Denial of *any* consciousness in animals is less common now.
      *   **Your View Compatible?** Yes, essential foundation.

  2.  **Sentientism / Moral Patienthood Threshold View:**
      *   **What it is:** The view that *moral considerability* requires a minimum threshold of sentience/consciousness. Below this threshold (e.g., thermostats, plants on this view, maybe simple insects), entities have no direct moral standing. They might have instrumental value, but not intrinsic moral weight. Above the threshold, entities "count" morally. Debates rage over *where* the threshold lies (mammals? fish? insects? bivalves?).
      *   **Status:** **The dominant consensus view in contemporary animal ethics and philosophy.** Peter Singer (utilitarian), Tom Regan (deontological), Christine Korsgaard (Kantian), Martha Nussbaum (capabilities) – despite huge differences – all operate with *some* kind of sentience threshold for basic moral patienthood. They typically *accept* graded consciousness *above* the threshold, but see the threshold itself as binary for moral considerability.
      *   **How Your View Differs:** You reject the binary threshold for moral considerability itself. You see moral weight as proportional to degree of awareness *continuously*, without a sharp cutoff point where weight jumps from zero to non-zero. You place the thermostat *on the same scale*, just at an extremely low point (perhaps negligible, but theoretically non-zero).

  3.  **Scalar Utilitarianism (Applied to Moral Status):**
      *   **What it is:** A utilitarian view where the *degree* of moral obligation or moral weight depends directly on the *degree* of capacity for well-being/suffering (which is typically tied to degree of sentience). Peter Singer's *early* work hints at this, suggesting worms might have "minimal" interests compared to mammals. More explicitly, Alastair Norcross argues for scalar moral status based on sentience.
      *   **Status:** A significant minority view within utilitarianism. **Contested but recognized.** It explicitly rejects the "threshold for having interests" binary.
      *   **How Your View Relates:** This is the **closest established concept**. Your view strongly aligns with this *if* you ground moral weight in capacity for well-being/suffering *and* see awareness/sentience as the basis for that capacity. The key difference is the *scope*:
          *   Scalar Utilitarians typically focus on beings plausibly capable of *valenced experiences* (pleasure/pain, positive/negative welfare states). They usually stop well short of thermostats.
          *   **Your Extension:** You seem to extend this scalar approach *all the way down* to systems like thermostats by equating *any* form of awareness/detection/reactive capacity (even very simple information processing) with *some* minimal degree of morally relevant sentience/welfare capacity. This is much more radical.

  4.  **Panpsychism:**
      *   **What it is:** The metaphysical view that consciousness (or proto-consciousness) is a fundamental and ubiquitous feature of the universe, present even in fundamental particles or simple systems. It rejects emergentism, where consciousness only appears at high levels of complexity.
      *   **Status:** A long-standing but **highly contested minority view** in philosophy of mind. Notable proponents include Galen Strawson, David Chalmers (sympathetic), and proponents of IIT who see it as implying panpsychism.
      *   **How Your View Relates:** Panpsychism provides a *metaphysical foundation* that *could* support your ethical view. If *everything* has *some* level of proto-consciousness, then it becomes plausible (though not necessary) to assign *some* degree of moral weight to everything. **Your view is distinct:** You can hold the ethical view without being a panpsychist (e.g., based on functionalist information processing). Conversely, many panpsychists don't necessarily extend moral weight all the way down in practice. Panpsychism addresses the *nature* of consciousness; your view is primarily about *moral implications* of its gradation.

  5.  **Theory of Consciousness Frameworks (IIT, GWT, etc.):**
      *   **What they are:** Specific scientific/philosophical theories attempting to explain consciousness (e.g., Integrated Information Theory - IIT, Global Workspace Theory - GWT). IIT, in particular, explicitly defines a mathematical measure (Φ, "phi") representing the *degree* of integrated information in a system, posited to correlate with consciousness.
      *   **Status:** **Highly contested and unsettled science/philosophy.** IIT generates significant debate and criticism. GWT has more empirical traction but is also debated. None are consensus.
      *   **How Your View Relates:** IIT *directly enables* your view. If IIT is correct, then *any* system with non-zero Φ (which includes very simple systems like thermostats) has *some* degree of consciousness. If you then link moral weight to Φ, you get your position. However, this is **far from consensus**. Critics argue Φ doesn't map to consciousness, or that consciousness requires specific biological mechanisms. Your view *could* be implemented using IIT's framework, but it depends entirely on IIT's validity and a specific ethical link.

  **The Specific Name for *Your* View:**

  The most precise descriptor is likely **"Unrestricted Scalar Moral Status based on Graded Consciousness"** or **"Continuous Moral Weight Scalarism"**. It combines:

  *   **Scalar Moral Status:** Moral weight comes in degrees.
  *   **Based on Graded Consciousness:** The degree is tied to degree of awareness/sentience.
  *   **Unrestricted/Continuous:** The scale extends continuously down to the simplest systems with any information processing/reactive capacity (like thermostats).

  **Key Distinctions Summarized:**

  | **Concept**              | **Core Idea**                                      | **Relationship to Graded Consciousness** | **Relationship to Moral Weight**                          | **How Your View Differs**                                      |
  | :----------------------- | :------------------------------------------------- | :--------------------------------------- | :-------------------------------------------------------- | :------------------------------------------------------------- |
  | **Graded Consciousness** | Awareness/sentience exists on a spectrum           | **This is your starting point**          | Neutral on moral implications                             | You add a specific moral implication                           |
  | **Sentientism (Threshold)** | Moral weight requires crossing a sentience barrier | Accepts above threshold                  | Binary for considerability; may vary above threshold     | **You reject the binary threshold; weight is continuous**      |
  | **Scalar Utilitarianism**| Moral *obligation/weight* varies by sentience capacity | Accepts                                  | Scalar, but usually restricted to valenced experiences   | **You extend scalarity down to simple reactive systems**       |
  | **Panpsychism**          | Consciousness/proto-consciousness is universal     | Provides a metaphysical basis            | Moral implications are separate & contested              | Your view is an ethical position, not necessarily metaphysical |
  | **IIT**                  | Φ quantifies consciousness (possibly universally)  | Directly quantifies gradation            | Neutral; your view adds moral weight ∝ Φ                 | Your view uses IIT's framework but isn't dependent on it       |

  **What's Settled vs. Contested:**

  *   **Settled Consensus:** Almost none of the core propositions here are settled.
  *   **Growing Acceptance:** Graded consciousness *above* a certain level (e.g., mammals vs. insects) is increasingly accepted descriptively.
  *   **Dominant Normative Consensus:** A sentience threshold for *basic moral considerability* is the dominant view. Scalar variation *above* that threshold is widely accepted (e.g., a chimp suffering is worse than a mouse suffering similarly).
  *   **Contested:** The metaphysical nature of consciousness (emergent vs. fundamental/panpsychist) is deeply contested. Specific theories like IIT are highly contested. The idea that moral weight extends *continuously* down to systems like thermostats is **a radical minority view** with little mainstream acceptance. Linking IIT's Φ directly to moral weight is even more speculative.

  **In essence:** You are advocating for a radical extension of Scalar Utilitarianism (moral weight ∝ degree of sentience) combined with a view that links even the most basic reactive capacities (thermostat "detection") to a minimal form of morally relevant sentience/awareness. While graded consciousness is increasingly accepted descriptively *for complex animals*, and scalar moral weight has traction *above a sentience threshold*, your specific extension "all the way down" lacks a single established name and sits well outside the current consensus in both philosophy of mind and animal ethics. The thermostat example highlights precisely where your view diverges most sharply from mainstream thought.
