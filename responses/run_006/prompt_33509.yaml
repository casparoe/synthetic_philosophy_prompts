prompt: |-
  I've been roped into giving a 45-minute session at our department's weekly methods seminar. The brief: explain how the replication crisis connects to the frequentist-vs-Bayesian debate, for an audience of working social-science researchers. These are clever people who run regressions every day but have never really been asked to think about what a p-value *is* — they just know p < .05 means publishable. Don't explain the content to me; I need a teaching plan. What has to come first in the sequence and why? What's the one worked example that should carry the whole session? What misconceptions will they walk in with, what new ones will emerge halfway through, and at exactly which points should I head each off? What should I deliberately leave out or flag as 'beyond today's scope'? And what's the one question I should ask at the end to see whether they've actually understood rather than just nodded politely?
reasoning: |-
  Okay, this is a sharp request. User is a social scientist prepping a 45-min methods seminar for colleagues who are statistically operational but philosophically unexamined. They've identified the core tension: these researchers treat p<0.05 as a ritualistic publishability toggle without understanding its machinery. 

  First, unpacking user's explicit asks: They want sequencing logic, one anchoring example, misconception mapping, scoping boundaries, and an understanding-check question. But reading between lines - they're likely time-pressed (departmental obligation), slightly anxious (roped into it), and need armor against skeptical audiences who might dismiss foundational critique as impractical navel-gazing. 

  The real challenge is epistemic surgery: extracting deeply embedded null ritual practices without triggering defensiveness. Must avoid "you've been doing stats wrong" framing. Instead, position this as "here's why our collective replication crisis is happening, and how both frequentist/Bayesian tools offer complementary damage control." 

  Key traps to anticipate:
  - Their audience will conflate "Bayesian" with "subjective" early on
  - They'll hear "prior" and think "bias" rather than "explicit assumption"
  - Any mention of Bayes factors might derail into rabbit holes
  - Halfway through, someone will mutter "but we can't do this with observational data"

  Structural priorities:
  1. Must first make them feel the replication crisis in their bones - not as abstract academia drama but as direct consequence of p-value misunderstanding. Lindley's paradox example later will land only if they're already uneasy about NHST.
  2. The worked example needs visceral impact - something where p=0.04 and p=0.06 swap "significance" based solely on stopping rules. Social science context essential (no coin flips!).
  3. Deliberate omissions: MCMC mechanics, conjugate priors, anything requiring calculus. Flag these as implementation details beyond scope.
  4. The killshot question must force synthesis: "What would change if reviewers demanded posterior distributions instead of p-values?" Answers revealing they still want binary decisions would mean failure.

  Biggest risk is overambition. In 45 mins, success isn't teaching Bayes; it's making them leave distrusting p=0.05 as a standalone metric. The rest is bonus.
answer: |-
  Here’s a battle-tested teaching plan focused on *conceptual leverage* over technical depth, designed for time-pressed researchers. Prioritize **cognitive dissonance** and **practical implications**.

  ---

  ### **Teaching Plan: Sequence & Rationale**  
  **Total: 45 mins (Strict timing essential!)**

  1. **The Replication Crisis Punch (5 mins)**  
     - *Start with:* 3-4 stark examples from social sciences (e.g., ego depletion, priming, ESP replications).  
     - *Key point:* "We’re wasting resources chasing noise. Why?"  
     - *Why first?* Creates urgency. Anchors the session to their reality, not abstract stats.

  2. **What *Is* a p-value? (The Misconception Unpacking) (10 mins)**  
     - *Audience misconception walking in:* "p < 0.05 = true effect" or "probability the null is true."  
     - *Do this:* Simulate a simple coin flip (e.g., 14 heads in 20 flips). Calculate p-value live.  
       - **Define rigorously:** "Probability of seeing data *this extreme or more*, **IF** the null (e.g., fair coin) is true."  
       - **Emphasize:** It says *nothing* about the probability of hypotheses!  
     - *Head-off tactic:* Show how stopping rules (peeking at data) invalidate p-values. Ask: "Is 14/20 flips significant? What if I stopped *because* I hit 14?"

  3. **NHST’s Replication Woes (5 mins)**  
     - *Connect:* Why p-values exacerbate replication crisis:  
       - **Fragility:** p-values dance with sample size and hidden tests (p-hacking).  
       - **Binary thinking:** "Significant" ≠ "replicable" or "important."  
     - *New misconception forming:* "So p-values are useless?" → **Intercept here:** "No, but *misused* they’re dangerous."

  4. **Bayesian Core Idea: What Changes? (10 mins)**  
     - *Contrast:* "Bayes answers the question you *wish* NHST did: Probability a hypothesis is true given data."  
     - *Key concepts in 2 slides:*  
       - **Prior:** What we know *before* the study (e.g., "Effect sizes in social psych rarely exceed Cohen’s d=0.5").  
       - **Posterior:** Updated belief after seeing data.  
     - *Analogy:* "NHST is a snap verdict. Bayes is updating a balance of evidence."  
     - *Head-off tactic:* "Priors aren’t ‘cheating’—they’re explicit. Would you trust a study finding cats can read minds without strong prior evidence?"

  5. **The One Worked Example: Lindley’s Paradox (10 mins)**  
     - **The Anchor:** A scenario where NHST and Bayes *contradict*.  
       - *Setup:* Large sample (n=10,000). Tiny effect (e.g., r=0.02). p ≈ 0.04 (significant!).  
       - *Bayes:* Use a skeptical prior (e.g., "Most effects this tiny are flukes"). Show posterior probability for H1 remains low.  
     - *Why it carries the session:*  
       - Visually shocking (p<.05 but Bayes says "no").  
       - Explains why large-n "trivial" findings replicate but are meaningless.  
       - Forces confrontation: "Do you care about *statistical* or *practical* significance?"

  6. **Reconciliation & Takeaways (5 mins)**  
     - *Not* "Bayes good, Frequentism bad." Instead:  
       - **Frequentist fixes:** Pre-registration, equivalence testing, focus on CIs.  
       - **Bayesian strengths:** Quantifies evidence, incorporates context, handles small samples better.  
     - *Replication crisis link:* Both approaches demand rigor: Better methods, not just better stats.

  ---

  ### **What to Deliberately Omit**  
  - **Math details:** No integrals, no Bayes’ theorem derivation.  
  - **Software how-tos:** Mention Stan/JASP, but no demos.  
  - **Philosophy deep dives:** Skip objectivity/subjectivity debates.  
  - **Advanced topics:** Hierarchical models, Bayes factors.  
  - **Flag:** "We’re skipping computational nuts/bolts—focus is on *why* this matters for your research integrity."

  ---

  ### **Critical Misconception Management**  
  - **Walking in:** "Bayes is subjective = unscientific."  
    - *Counter:* "All analyses have assumptions. Bayes makes them explicit."  
  - **Mid-session spike:** "P-values are broken → I should switch to Bayes and be done."  
    - *Interrupt:* "Bayes *also* requires care! Garbage priors → garbage posteriors."  
  - **Post-Lindley:** "So huge samples are useless?"  
    - *Clarify:* "No—but they reveal trivial effects. You need *domain expertise* to interpret."

  ---

  ### **The One Understanding-Check Question**  
  > **"If a study finds p=0.04 with a large sample (n=2,000) but a tiny effect (e.g., β=0.01), why might you still be skeptical? What tool would help you quantify that skepticism?"**  
  - *Signals understanding:*  
    - Recognizes p-value fragility/non-informative effect size.  
    - References priors/posteriors (Bayes) or equivalence testing (Frequentist).  
  - *If they only say "p-hacking," probe deeper—they missed the Bayes/Frequentist synthesis.*

  ---

  ### **Why This Works**  
  - **Flow:** Crisis → Diagnosis (p-values) → Alternative (Bayes) → Synthesis.  
  - **Sticks to one vivid example** (Lindley) to avoid cognitive overload.  
  - **Preempts tribal warfare:** Positions both approaches as tools needing careful use.  
  - **Ends on empowerment,** not despair: "You have options to do better science."  

  **Final tip:** Bring receipts—use real social science papers in your examples. The closer to their work, the louder the penny drops. Good luck!
