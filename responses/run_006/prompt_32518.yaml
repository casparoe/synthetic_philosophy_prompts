  I'm a science journalist and I've been asked to give a 40-minute talk at a small ideas festival to a general audience—smart people but no philosophy background. The topic is the underdetermination of theory by evidence. I don't want to give them a lecture *about* the idea; I want them to actually get it, to feel the force of it.

  So: plan how I should structure this. I need the dependency map—what concept has to be in place before the next one can land. I need one central example that carries the whole thing (I'm guessing the old curve-fitting demo is a bit tired, but maybe it's the right one? If not, what instead?). I need to know which misconceptions are going to crop up—I'm already worried about "so you're saying we can't know anything" and "but some theories are just obviously better"—and exactly where in the 40 minutes I should head each one off. And I want one question I can ask the room near the end that tells me whether they actually understood the idea rather than just nodding along.
