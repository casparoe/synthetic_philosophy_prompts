  Then, the issue of moral understanding without reasons. Some might argue that testimony can provide understanding if it includes context or narratives, not just bare claims. The user's concession here could be that rich testimony with explanations can help, but it's still not the same as personal engagement. 

  The "pray nobody asks" question might be about cases where marginalized people rely solely on testimony and whether the user's view implies they lack real knowledge. This directly challenges the inclusivity of their position. The reply needs careful handling, acknowledging systemic barriers while maintaining the epistemic distinction.

