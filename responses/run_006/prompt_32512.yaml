  ### Classroom Game: **The Cascade of Rationality**

  #### **Activity Name:**  
  Mixed-Strategy Domination Cascade  

  #### **Learning Goal:**  
  To demonstrate that:  
  1. Mixed strategies can dominate pure strategies even when no pure strategy does.  
  2. Iterated elimination of dominated strategies requires common knowledge of rationality.  
  3. Eliminating a mixed-dominated strategy enables new eliminations.  

  #### **Materials:**  
  - 22 strategy cards (11 labelled "Player A", 11 "Player B").  
  - Projector/whiteboard displaying payoffs.  
  - Tally sheet for facilitator.  
  - Sweets/points for rewards.  

  #### **Setup:**  
  - Split students into 11 pairs. In each pair, assign one as **Player A** (strategies: X, Y, Z) and one as **Player B** (strategies: P, Q, R).  
  - Display the payoff matrix (symmetric for simplicity):  

  | A \ B | P   | Q   | R   |  
  |-------|-----|-----|-----|  
  | **X** | 1,1 | 0,0 | 0,0 |  
  | **Y** | 0,0 | 3,3 | 0,4 |  
  | **Z** | 0,0 | 4,0 | 5,5 |  

  **Rationale for payoffs:**  
  - **X** is not dominated by any pure strategy: It beats Y against P (1>0) but loses to Z against Q (0<4).  
  - **X** is dominated by a 50-50 mix of Y and Z:  
    - Against P: (0.5×0 + 0.5×0) = 0 ≥ 0 (X’s payoff)  
    - Against Q: (0.5×3 + 0.5×4) = 3.5 > 0  
    - Against R: (0.5×0 + 0.5×5) = 2.5 > 0  
  - After eliminating X, **P** becomes dominated by Q (for Player B): Against Y, Q gives 3>0 (P’s payoff); against Z, Q gives 0=0.  

  #### **Phases:**  

  | Phase                | Duration (min) | What Happens                                                                 | Facilitator Does                                                                 |  
  |----------------------|----------------|------------------------------------------------------------------------------|----------------------------------------------------------------------------------|  
  | **1. Introduction**  | 5              | Explain rules, roles, and payoffs. Emphasise: "Maximise your points."        | Display payoff matrix; answer questions.                                         |  
  | **2. Round 1 (Pure)**| 10             | All choose pure strategies secretly. Reveal in pairs; record payoffs.        | Collect choices; tally public frequency of X, Y, Z, P, Q, R. Highlight X’s usage.|  
  | **3. Round 2 (Pure)**| 10             | Repeat. Students notice X underperforms.                                   | Ask: "Did anyone regret X? Why?" Show average payoffs: X vs. Y/Z.                |  
  | **4. Round 3 (Mixed)** | 15           | Allow mixed strategies. Players specify probabilities (e.g., 50% Y, 50% Z). | Help compute expected payoffs. Compare: Mixers (Y+Z) vs. X-users.                |  
  | **5. Round 4 (Post-X)** | 10         | Ban X (simulate elimination). Play with Y/Z (A) and P/Q/R (B).             | Tally P usage. Ask B: "Is P safe now? Will others avoid X?"                       |  
  | **6. Round 5 (Cascade)** | 10       | Play again. Most B players abandon P (dominated by Q in X-free game).      | Highlight P’s decline. Ask: "Why did P become worse *after* X was eliminated?"    |  
  | **7. Debrief**       | 20             | Connect gameplay to theory.                                                | Use tally data; scaffold Socratic discussion.                                    |  

  #### **Payoff Scheme:**  
  Points awarded as per the matrix. At the end, top 3 point-earners win sweets. No real money.  

  #### **Debrief:**  

  | Activity Moment         | Formal Idea                          | How to Draw It Out                                                                 |  
  |-------------------------|--------------------------------------|------------------------------------------------------------------------------------|  
  | High X usage in Round 1 | Pure-strategy dominance              | "X isn’t beaten by Y or Z alone. But why did it feel risky?"                       |  
  | X’s poor avg. (Round 2) | Mixed-strategy dominance             | Show calculation: Mixing Y/Z gives 3.5>0 against Q, while X gives 0.              |  
  | Mixers outperform (R3)  | Rationality & expectations           | "Even if you avoid X, others might not. Mixing protects you."                      |  
  | P still used (R4)       | L1 rationality (no common knowledge) | "Player Bs: Did you expect X to vanish? Without this, P isn’t dominated."          |  
  | P abandoned (R5)        | Iterated elimination & L2 knowledge  | "After X is eliminated, P is dominated by Q. But you needed others to *know* X is irrational." |  

  #### **Predictable Failures:**  

  | Failure                                   | Symptom                                  | Fix                                                                 |  
  |-------------------------------------------|------------------------------------------|---------------------------------------------------------------------|  
  | Students ignore mixing (R3)               | "Why bother? Pure feels safer."          | Show side-by-side: Mixer’s avg. points vs. X-user’s. Award sweets to a mixer. |  
  | No cascade (P persists in R4/R5)          | "P gives 1 sometimes, Q gives 0 sometimes." | Ask: "If *no one* plays X, is P ever better than Q? Compute together."        |  
  | Confusion over probability (R3)           | "How do I mix?"                          | Simplify: Offer 2-3 pre-set mixes (e.g., 50-50, 70-30). Use coins/dice.        |  

  #### **Cannot Reproduce:**  
  The activity simplifies **full rationalisability**:  
  - **Infinite iterations**: We only simulate 2 steps (X→P), not infinite chains.  
  - **Belief precision**: Real rationalisability requires players to form beliefs about *all higher-order knowledge*. Here, we approximate with "X is gone, so P is bad".  
  - **Equilibrium concepts**: Nash isn’t reached; we focus solely on dominance.  

  ### **Facilitator Script Snippets:**  
  - **After Round 2:** *"X wasn’t dominated by Y or Z alone. But look: Y+Z mixers averaged 3.5 points against Q, while X gave 0. If you expect B to play Q, mixing dominates."*  
  - **After Round 5:** *"When X vanished, P became dominated—but only because you knew others knew X was irrational. That’s common knowledge! It’s why eliminations cascade."*  

  This design forces students to *experience* the cascade, making abstract concepts visceral. The JSON summary below structures this for quick reference.  

