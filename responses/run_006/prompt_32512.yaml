  Then mixture (1/2,1/2):
  against L: 5>4
  against C: 5>4
  against R: 10>4
   so strictly dominates B.

  Then remove B.

  Now reduced game:
  Player 1 \ Player 2 | L     | C     | R
  -------------------|-------|-------|-------
  T                  | 10,0  | 0,10  | 10,0
  M                  | 0,10  | 10,0  | 10,0

  Now, for Player 2, we can see that strategy R is now strictly dominated by a pure strategy? For Player 2, the payoffs are:
  - L: (0,10,0) for the three strategies of Player 1? No, Player 2's payoffs are:
   When Player 2 plays L: gets 0 from T, 10 from M -> so if Player 1 plays T, they get 0, if M, they get 10.
   When Player 2 plays C: 10 from T, 0 from M.
   When Player 2 plays R: 0 from T, 0 from M.

  So for Player 2, R gives (0,0) in the reduced game, while L gives (0,10) and C gives (10,0). So R is strictly dominated by any mixture of L and C? Actually, by any pure strategy? Because L gives at least 0 and sometimes 10, similarly for C. In fact, R is strictly dominated by both L and C because:
  - L vs R: when Player 1 plays T: 0>0? no, equal. When Player 1 plays M: 10>0 -> so not strict domination by L in all cases.

  But wait, for Player 2, against Player 1's T:
  - if Player 2 plays L: 0
  - plays C: 10
  - plays R: 0
   so R is not dominated by L (because against T: 0=0) but is dominated by C (because against T: 10>0, against M: 0=0? -> not strict in M).

   However, a mixture of L and C ( say, with any positive probability) won't help because against T: if you play L with prob p and C with 1-p, you get p*0 + (1-p)*10 = 10-10p, which is >=0 (strictly if p<1) and against M: p*10 + (1-p)*0 = 10p >=0 (strictly if p>0). So compared to R (0,0), the mixture is (10-10p, 10p) which is >0 in both if 0<p<1. So strictly dominates R.

   So in the reduced game, R is strictly dominated by a mixed strategy of L and C.

   Then we can remove R.

   Then the game reduces to:

  Player 1 \ Player 2 | L     | C
  -------------------|-------|-------
  T                  | 10,0  | 0,10
  M                  | 0,10  | 10,0

   which is a matching pennies.

  So the iterated elimination goes:
  1. B is strictly dominated by a mixture of T and M -> remove B.
  2. In the reduced game, R is strictly dominated by a mixture of L and C -> remove R.
  3. Then we are left with a 2x2 game.

   This is perfect.

   So let's use this game.

   But note: the payoffs for Player 2 are not symmetric. We can make it symmetric if we want, but for the purpose of the activity, we can have two roles: Player 1 and Player 2 with different payoff matrices.

   To make it easier, we will have two roles: Row players and Column players.

   So here is the game:

   For a Row player (Player 1):
  - Strategies: T, M, B
  For a Column player (Player 2):
  - Strategies: L, C, R

   Payoff matrices:

  Row\Col | L       | C       | R
  -------|---------|---------|---------
  T      | 10,0    | 0,10    | 10,0
  M      | 0,10    | 10,0    | 10,0
  B      | 4,0     | 4,0     | 4,0

   and we see:
  - B is strictly dominated for Row by any mixture of T and M (e.g., 50-50: against L: 5>4, against C: 5>4, against R: 10>4).
  - After removing B, for Column, R is now (0,0) in the reduced game (only T and M for Row), while L is (0,10) and C is (10,0). But note: against T, R gives 0, against M, R gives 0. Meanwhile, L gives 0 against T and 10 against M, and C gives 10 against T and 0 against M. So R is strictly dominated by any mixture of L and C (e.g., 50-50: against T: 5>0, against M: 5>0).

   So cascade.

   Now, for the classroom activity:

   We will have 11 pairs (22 students). In each pair, one is Row and one is Column.

   We will play the game repeatedly for several rounds (say 5 rounds). In each round, players choose a strategy (pure or mixed? But we want them to experience that mixing might be better, but for simplicity, we might allow mixed strategies or not. But the activity is to see that B is bad, so we hope that Row players learn not to play B, and then Column players learn not to play R.

   However, in a one-shot, if a Row player plays B, they get 4 for sure, while if they play T or M, they might get 0 or 10. But if they play a mixture, they get more than 4 on average.

   To facilitate, we might not allow mixed strategies in the first few rounds, then allow them.

   Alternatively, we can have them submit their strategies in advance and then compute payoffs.

   Given time, we can do it as follows:

   - Round 1: Players choose pure strategies. We then pair them and compute payoffs.
   - Round 2: Again pure.
   - Then we allow mixed strategies.

   But we want to illustrate the dominance and cascade.

   Alternatively, we can have them play in groups of 6 (3 Row and 3 Column) but that might be complicated.

   I think the best is to have each pair play multiple rounds, and then we aggregate.

   However, to see the cascade, we need to show that after many pairs stop playing B, then R becomes bad.

   So we will collect statistics.

   Activity: "The Cascade Game"

   Materials:
   - Strategy cards for each player: for Row players: T, M, B; for Column players: L, C, R. (Optional: to prevent changing, they submit a card)
   - Payoff tables for each player (or displayed for all to see).
   - A way to record choices and payoffs.

   Setup:
   - Divide the class into 11 pairs. In each pair, randomly assign one as Row player and one as Column player.
   - Display or distribute the payoff matrix (Row's payoffs and Column's payoffs separately).

   Rules:
   - We will play 5 rounds.
   - In each round, each player independently chooses one of their strategies (pure for now).
   - Then within the pair, they reveal and compute payoffs.
   - Payoffs are in points, and at the end, points might be converted to sweets or just for ranking.

   Payoff matrix (for the pair to see):

   For the Row player (and Column player's payoffs are in the second number of the tuple):

   When Row plays T and Column plays L: Row gets 10, Column gets 0.
   When Row plays T and Column plays C: Row gets 0, Column gets 10.
   When Row plays T and Column plays R: Row gets 10, Column gets 0.

   When Row plays M and Column plays L: Row gets 0, Column gets 10.
   When Row plays M and Column plays C: Row gets 10, Column gets 0.
   When Row plays M and Column plays R: Row gets 10, Column gets 0.

   When Row plays B and Column plays L: Row gets 4, Column gets 0.
   When Row plays B and Column plays C: Row gets 4, Column gets 0.
   When Row plays B and Column plays R: Row gets 4, Column gets 0.

   So Column player's payoffs are:
   - If they play L: 0 if Row plays T, 10 if Row plays M, 0 if Row plays B.
   - If they play C: 10 if Row plays T, 0 if Row plays M, 0 if Row plays B.
   - If they play R: 0 in all cases.

   After a few rounds, we allow mixed strategies. How? We can ask players to specify a probability distribution over their strategies. But this might be too complex for a first activity.

   Alternatively, we can have them play many rounds and we do not allow mixed explicitly, but then after seeing the data, we can show that on average, mixing would have been better.

   Given the time, we might do:

   - Rounds 1-3: Pure strategies only.
   - After round 3, aggregate the results and show the class the frequency of choices.
   - Then, allow players to use mixed strategies in rounds 4 and 5 (by having them submit a probability distribution and then we simulate one outcome for them).

   But then the cascade might not happen naturally.

   Alternatively, we can run many rounds (say 10) and after each round, show the distribution but that takes time.

   Given the time constraint (80 minutes), we can do:

   - 5 minutes: explain the rules and assign roles.
   - 15 minutes: play 5 rounds of pure strategies. In each round, players choose, then we quickly (or they in pairs) calculate.
   - 10 minutes: aggregate and discuss after 5 rounds.

   But then, to see the cascade, we need to show how the distributions change.

   We can do:

   - After each round, the facilitator asks: 
     - How many Row players played B? 
     - How many Column players played R?
     - And then we might see a decrease.

   But in round 1, many might play B because it gives a safe 4. Then Row players might learn that if they play T or M, they can get 10, but sometimes 0. Column players might learn that R is always 0, while L and C can give 10.

   But the cascade is: once B is gone, then R becomes obviously bad.

   So we might not see it in 5 rounds.

   To force the issue, after round 3, we can say: "From the data, we see that B is not a good choice for Row players. In fact, we can show that any mixture of T and M gives more than 4 in expectation. So from now on, Row players are not allowed to play B." 

   Then in round 4 and 5, we play without B. Then we see that for Column players, R is now strictly dominated by mixtures of L and C. 

   Then in round 5, we disallow R.

   So the activity becomes:

   Phases:
   1. Explain the game and assign roles. (5 minutes)
   2. Play three rounds with pure strategies, allowing all strategies. After each round, collect and display the number of B's chosen by Row and R's by Column. (15 minutes)
   3. After round 3, discuss with the class: what did they observe? Some Row players might say that when they played B, they got 4, but when they played T or M, they sometimes got 0 and sometimes 10. But on average, if they knew the distribution, might be better. Show that if a Row player believes that Column is equally likely to play L, C, R, then:
     - T: (10+0+10)/3 = 20/3 ≈6.67
     - M: (0+10+10)/3 = 20/3 ≈6.67
     - B: 4
     So indeed, T or M is better on average.

   But more importantly, for any belief about Column's strategy (as long as there is not too much weight on one strategy), T and M are better. And in fact, any mixture of T and M will give at least 4 and often more.

   Announce: "Given that B is dominated by mixtures of T and M, we will now remove B. Row players can only play T or M."

   4. Play two more rounds. In these rounds, Row players choose T or M. Column players choose L, C, or R. (10 minutes)
      After each round, collect the frequency of R by Column players.

   5. After round 5, show that for Column players, R is now dominated by mixtures of L and C. For example, if they believe Row players are equally likely to play T or M:
        L: (0 with T, 10 with M) -> expected 5
        C: (10 with T, 0 with M) -> expected 5
        R: 0
      So a mixture of L and C (50-50) gives 5 in expectation, which is better than 0.

   6. Then we can say that in further play, Column players should not play R.

   Debrief:
   - In the first phase, many Row players played B because it's safe. But it is dominated by any mixture of T and M.
   - After removing B, we saw that R became a bad choice for Column players, because it always gives 0, while L and C can give 10. But note: against a particular Row player's choice, L or C might give 0, but on average or with mixing, they can get more. And in the reduced game, R is dominated by mixtures of L and C.
   - This is iterated elimination of dominated strategies (by mixed strategies).

   Now, to the JSON.

