prompt: |-
  I am taking a course on social choice and collective decision-making, and we have just worked through the discursive dilemma. Before I read any more proposals for aggregating individual judgments into collective ones, I want the specification they will be tested against. Write the desiderata: what any adequate theory of how a group should form a collective judgment on a set of logically connected propositions has to deliver, assuming the group is supposed to be able to act as a coherent agent over time, not merely to tally independent votes. For each requirement, give the case or consideration that makes it a requirement, and say whether it is non-negotiable or a preference of a particular camp.

  Make sure the list includes at least: universal domain; collective consistency and completeness; deductive closure; consensus preservation; propositionwise independence, and the stronger systematicity condition; anonymity; non-dictatorship; monotonicity or responsiveness; and premise-sensitivity or reason-tracking. Use the doctrinal paradox — three judges deciding whether a defendant is liable, where liability requires both breach and a valid contract, and the majority holds breach, holds valid contract, and denies liability — as the central case for the inconsistency problem, but do not stop there: give the consideration behind each criterion, not just a label.

  Then the part I most want. Given the impossibility theorems in the judgment-aggregation literature, tell me which subsets of these desiderata cannot be jointly satisfied, and lay out the real options: weaken collective rationality by allowing incompleteness rather than inconsistency, drop independence or systematicity, restrict the admissible agendas, or accept something dictatorial. Say which single requirement does the most work in excluding otherwise attractive rules, and why. Finally, in a paragraph or a small table, score premise-based voting, conclusion-based voting, and a distance-based rule against the list — but keep that brief; the criteria are the point.
reasoning: |-
  We are discussing desiderata for a theory of collective judgment aggregation. The goal is to specify the criteria that any adequate theory must meet, especially for a group that aims to act as a coherent agent over time. We are to consider the doctrinal paradox as a central case but not limit ourselves to it.

  The desiderata and their justifications:

  1. **Universal Domain (UD)**: 
     - *Requirement*: The aggregation rule should be able to handle any logically possible combination of individual judgments on the propositions. 
     - *Justification*: Groups should be able to form collective judgments regardless of the diversity of opinions among members. This is non-negotiable for ensuring that the group doesn't break down when faced with disagreement.
     - *Status*: Non-negotiable for most camps because without it, the rule would be inapplicable in some real-world situations.

  2. **Collective Consistency and Completeness (CCC)**:
     - *Requirement*: The collective judgment set must be consistent (no contradictions) and complete (for every proposition on the agenda, the collective either accepts or rejects it).
     - *Justification*: Without consistency, the group would hold contradictory beliefs, which would prevent coherent action (as in the doctrinal paradox: majority says breach and valid contract, but denies liability, which contradicts the rule that breach and valid contract imply liability). Without completeness, the group would be indecisive on some propositions, which might hinder action. 
     - *Status*: Consistency is non-negotiable for the requirement that the group acts as a coherent agent. Completeness may be negotiable in some contexts (e.g., allowing abstention) but is often required for decisive action.

  3. **Deductive Closure (DC)**:
     - *Requirement*: If the collective judgment set entails a proposition on the agenda, then that proposition must be part of the collective judgment (i.e., accepted if the entailing set is accepted).
     - *Justification*: Without deductive closure, the group might fail to recognize the logical consequences of its own judgments, leading to irrationality. For example, in the doctrinal paradox, if the group accepts breach and valid contract, then it must accept liability (if the rule is part of the agenda). 
     - *Status*: Non-negotiable for groups that aim for rational agency. However, it might be relaxed if the agenda is restricted.

  4. **Consensus Preservation (CP)**:
     - *Requirement*: If all individuals agree on a proposition, then the collective judgment must reflect that agreement.
     - *Justification*: This is a minimal condition of respect for unanimous views. If everyone in the group believes a proposition, it would be perverse for the group to reject it. 
     - *Status*: Non-negotiable for most theories.

  5. **Propositionwise Independence (PI)**:
     - *Requirement*: The collective judgment on each proposition should depend only on the individual judgments on that proposition, not on how individuals judge other propositions.
     - *Justification*: This ensures that the collective judgment on a given proposition is not influenced by irrelevant considerations (i.e., judgments on other propositions). It also makes the aggregation rule transparent and resistant to strategic manipulation. 
     - *Status*: This is a preference of the camp that values independence of issues (like in voting on propositions separately). It is negotiable in other camps (e.g., those that allow holistic judgment aggregation).

  6. **Systematicity (S)**:
     - *Requirement*: A stronger version of independence: the collective judgment on each proposition is determined by the individual judgments on that proposition in the same way, i.e., by the same function for every proposition.
     - *Justification*: This ensures uniformity in the treatment of all propositions. It is motivated by fairness and neutrality: no proposition is treated differently.
     - *Status*: This is a strengthening of PI and is more controversial. It is a preference of some camps but not non-negotiable.

  7. **Anonymity (A)**:
     - *Requirement*: All individuals are treated symmetrically by the aggregation rule. That is, permuting individual judgments does not change the collective outcome.
     - *Justification*: This is a basic democratic requirement: each member's input has equal weight.
     - *Status*: Non-negotiable for egalitarian theories, but negotiable in some contexts (e.g., weighted voting).

  8. **Non-Dictatorship (ND)**:
     - *Requirement*: There is no individual whose judgments always become the collective judgment, regardless of others.
     - *Justification*: This is a minimal condition for collective decision-making: the group's view should not be determined by a single member.
     - *Status*: Non-negotiable for democratic aggregation.

  9. **Monotonicity (M)**:
     - *Requirement*: If a proposition is collectively accepted, and then some individual changes their judgment to accept that proposition (while nothing else changes), then the proposition should still be collectively accepted.
     - *Justification*: This ensures that the aggregation rule is responsive to increased support for a proposition. Without it, the rule might be arbitrary or perverse.
     - *Status*: Often considered non-negotiable for reasonable rules.

  10. **Premise-Sensitivity or Reason-Tracking (PS)**:
      - *Requirement*: The collective judgment should be sensitive to the reasons (premises) that lead to the conclusion, not just the conclusion. In the doctrinal paradox, this might mean that the group should base its decision on the premises (breach and valid contract) rather than directly on the conclusion (liability).
      - *Justification*: This is important for the group's ability to give reasons for its actions and to learn from its decisions. It also helps in ensuring that the collective judgment is based on the relevant evidence.
      - *Status*: This is a preference of a particular camp (e.g., those advocating premise-based procedures) and is negotiable.

  Now, the impossibility results:

  The most famous impossibility theorem in judgment aggregation (generalizing Arrow's theorem) shows that for agendas with a minimal amount of logical structure (like the one in the doctrinal paradox, where the propositions are connected by a conjunction), there is no aggregation rule that satisfies UD, CCC (at least consistency and completeness), PI, and ND. 

  Specifically, the **List-Pettit theorem** (and similar results) show that if the agenda is "non-trivial" (in particular, if it contains at least one proposition and its negation, and a connected set of propositions that are minimally complex, e.g., with a conjunction), then the only aggregation rules satisfying UD, PI, and CCC (with deductive closure) are the dictatorships. 

  Thus, the main conflict is between:
  - Collective Rationality (which includes CCC and DC) and 
  - Propositionwise Independence (or Systematicity) and Non-Dictatorship.

  The requirement that does the most work in excluding otherwise attractive rules is **Propositionwise Independence (PI)**. Why? Because without PI, we can use holistic methods (like the premise-based or conclusion-based methods) that respect collective rationality and non-dictatorship. However, with PI, we are forced to treat each proposition independently, which in the presence of logical connections, leads to inconsistencies (as in the doctrinal paradox) unless we have a dictatorship.

  Real options to avoid impossibility:

  1. **Weaken Collective Rationality**: Allow incomplete collective judgments (so we don't require completeness) but maintain consistency. This is the approach of the conclusion-based procedure: we only vote on the conclusion and leave the premises undecided. However, this might prevent the group from acting on the reasons.

  2. **Drop Independence or Systematicity**: This allows the aggregation to consider the judgments on multiple propositions together. The premise-based procedure is an example: we vote on the premises and then derive the conclusion. This satisfies collective rationality (if the premises are voted consistently and the logic is applied) but violates PI because the conclusion is not independently voted.

  3. **Restrict the Admissible Agendas**: If the agenda has a simple structure (e.g., no logical connections beyond what is allowed in the impossibility theorem), then aggregation rules might satisfy all conditions. But many real-world agendas (like the doctrinal paradox) are complex.

  4. **Accept Something Dictatorial**: This is generally unacceptable for democratic groups.

  Scoring of rules:

  We briefly evaluate three rules against the criteria:

  - **Premise-Based Voting (PBV)**:
    - UD: Yes.
    - CCC: Yes (if the premises are logically independent and we derive the conclusion, then the set is consistent and complete for the premises and the conclusion, provided the agenda includes the premises and the conclusion and the rule).
    - DC: Yes (by construction).
    - CP: Yes (if there is consensus on the premises, the conclusion follows; if consensus on the conclusion, but not premises, it might not be preserved if the conclusion is not voted independently).
    - PI: No (because the conclusion is not independently voted).
    - S: No (same reason).
    - A: Yes (if the premise voting is by majority and anonymous).
    - ND: Yes.
    - M: Yes (if the premise voting is monotonic).
    - PS: Yes (by design).

  - **Conclusion-Based Voting (CBV)**:
    - UD: Yes.
    - CCC: Incomplete on the premises (so fails completeness and deductive closure for the entire agenda). Only the conclusion is decided.
    - DC: Only for the conclusion? But the premises are left open, so if the agenda includes premises, it fails completeness and hence DC for the whole set.
    - CP: Only for the conclusion? If there is consensus on a premise, it might be ignored because we don't vote on premises.
    - PI: N/A because we don't vote on premises? Actually, we only vote on the conclusion, so for the conclusion it is independent? But the agenda is restricted.
    - S: Only one proposition (the conclusion) is voted, so trivially systematic? But the premises are not voted.
    - A: Yes (if the conclusion is by majority).
    - ND: Yes.
    - M: Yes.
    - PS: No (because we don't track the reasons; we only look at the conclusion).

  - **Distance-Based Rule (e.g., Hamming distance minimization)**:
    - This rule selects a consistent and complete collective judgment set that minimizes the total number of disagreements with individual judgments (across all propositions and individuals).
    - UD: Yes.
    - CCC: Yes (by design, we pick a consistent and complete set).
    - DC: Yes (because we require consistency and completeness).
    - CP: Yes (if there is a consensus, that set will have minimal distance).
    - PI: No (because it looks at the entire set of judgments; the collective judgment on one proposition can depend on judgments on others).
    - S: No (the same function is used for all, but the minimization is over the entire set, so the treatment of a proposition depends on the entire profile).
    - A: Yes (if we use symmetric distance).
    - ND: Yes (if the group has at least two members and there is disagreement, the collective set is not necessarily one individual's).
    - M: Not necessarily (but often yes; however, it might be non-monotonic in some cases because changing one vote might lead to a different global solution).
    - PS: Not necessarily (it depends on the agenda; it might sometimes choose a set that ignores the reasons).

  In summary, the main tension is between collective rationality and propositionwise independence. The premise-based and distance-based rules sacrifice independence to achieve rationality, while the conclusion-based rule sacrifices completeness (on the entire agenda) to avoid inconsistency. The choice among these depends on which desiderata are prioritized.
answer: |-
  ### Desiderata for Collective Judgment Aggregation  
  For a group to act as a coherent agent over time, any theory of collective judgment aggregation must satisfy core requirements. Below, each desideratum is defined, justified by a case or consideration, and classified as **non-negotiable** (essential for coherence) or a **preference** (specific to certain approaches). The doctrinal paradox (three judges deciding liability, where liability requires breach and a valid contract; majority judges affirm breach and valid contract but deny liability) illustrates the central inconsistency problem, but broader considerations apply.  

  1. **Universal Domain (UD)**  
     - **Requirement**: The rule must accept *any* logically possible profile of individual judgments (e.g., all combinations of beliefs on premises/conclusions).  
     - **Justification**: Groups face unpredictable disagreements (e.g., judges may hold paradoxical beliefs). Without UD, the rule fails in real-world scenarios.  
     - **Status**: Non-negotiable.  

  2. **Collective Consistency and Completeness (CCC)**  
     - **Requirement**: Collective judgments must be logically consistent (no contradictions) and complete (every proposition is accepted/rejected).  
     - **Justification**: Inconsistent judgments (e.g., affirming breach and valid contract but denying liability in the doctrinal paradox) prevent coherent action (e.g., enforcing contradictory laws). Completeness ensures decisiveness.  
     - **Status**: Consistency is non-negotiable; completeness may be relaxed to avoid inconsistency.  

  3. **Deductive Closure (DC)**  
     - **Requirement**: If the group accepts premises entailing a conclusion, it must accept the conclusion (e.g., affirming breach and valid contract requires affirming liability).  
     - **Justification**: Groups must respect logic to avoid self-defeating decisions (e.g., a legislature passing laws that implicitly conflict).  
     - **Status**: Non-negotiable for rational agency.  

  4. **Consensus Preservation (CP)**  
     - **Requirement**: Unanimous individual judgments must become collective judgments (e.g., if all judges agree on liability, the group must too).  
     - **Justification**: Rejecting unanimity undermines group legitimacy (e.g., overriding universal expert agreement).  
     - **Status**: Non-negotiable.  

  5. **Propositionwise Independence (PI)**  
     - **Requirement**: The collective judgment on each proposition depends *only* on individual judgments on that proposition.  
     - **Justification**: Prevents strategic manipulation (e.g., judges misrepresenting beliefs on premises to sway conclusions).  
     - **Status**: **Preference** of liberal-individualist camps; negotiable if reason-tracking is prioritized.  

  6. **Systematicity (S)**  
     - **Requirement**: Strengthens PI: the *same* voting rule applies to all propositions (e.g., majority vote on every issue).  
     - **Justification**: Ensures uniform treatment of propositions (e.g., no ad hoc rules for "important" issues).  
     - **Status**: **Preference** of procedural formalists; conflicts with premise-sensitivity.  

  7. **Anonymity (A)**  
     - **Requirement**: All individuals have equal influence; outcomes are invariant to identity swaps.  
     - **Justification**: Democratic equality (e.g., rotating committees must not privilege members).  
     - **Status**: Non-negotiable for egalitarian groups.  

  8. **Non-Dictatorship (ND)**  
     - **Requirement**: No single individual dictates collective judgments.  
     - **Justification**: Collective agency requires genuine aggregation (e.g., a board cannot delegate all decisions to its CEO).  
     - **Status**: Non-negotiable.  

  9. **Monotonicity (M)**  
     - **Requirement**: Increased support for a proposition should not harm its collective acceptance (e.g., if liability wins, and a judge switches to support it, liability still wins).  
     - **Justification**: Ensures responsiveness; avoids perverse incentives (e.g., hiding support to trigger a rule change).  
     - **Status**: Non-negotiable for dynamic coherence.  

  10. **Premise-Sensitivity/Reason-Tracking (PS)**  
      - **Requirement**: Collective judgments should reflect the most reliable/reasoned premises (e.g., deciding liability based on premises like breach/contract, not direct votes on conclusions).  
      - **Justification**: Promotes epistemic quality and accountability (e.g., courts must justify verdicts via facts, not intuitions).  
      - **Status**: **Preference** of epistemic camps; negotiable for proceduralists.  

  ### Impossibility Theorems and Trade-offs  
  **Key Impossibility**: The **List-Pettit theorem** (generalizing Arrow) shows that for agendas with non-trivial logical connections (e.g., the doctrinal paradox):  
  > *No rule satisfies UD, CCC (consistency + completeness), PI, CP, and ND simultaneously.*  

  #### Which desiderata conflict?  
  - **PI does the most damage**: It prevents rules from "seeing" logical connections between propositions, forcing inconsistencies (like the doctrinal paradox) or dictatorship. PI is the linchpin of impossibility; dropping it enables coherent solutions.  
  - **Systematicity (S) worsens conflicts**: S implies PI, multiplying constraints (e.g., forcing majority votes on all propositions guarantees inconsistency in connected agendas).  

  #### Realistic Options to Resolve Impossibility:  
  1. **Weaken Collective Rationality**:  
     - Allow **incompleteness** (relax CCC completeness) but keep consistency.  
     - *Example*: Conclusion-based voting (only decide conclusions; leave premises undecided).  
     - *Cost*: Undermines reason-giving and long-term coherence.  

  2. **Drop PI or S**:  
     - Reject independence to track logical dependencies.  
     - *Example*: Premise-based voting (vote on premises; derive conclusions).  
     - *Cost*: Vulnerable to strategic voting.  

  3. **Restrict Admissible Agendas**:  
     - Limit agenda complexity (e.g., only "safe" logical structures).  
     - *Example*: Ban agendas with conjunctive connections (like liability rules).  
     - *Cost*: Unrealistic for real-world decisions.  

  4. **Accept Dictatorship**:  
     - *Cost*: Abandons collective agency.  

  ### Scoring Key Aggregation Rules  
  | **Criterion**          | **Premise-Based** | **Conclusion-Based** | **Distance-Based**<sup>†</sup> |  
  |------------------------|-------------------|----------------------|-------------------------------|  
  | Universal Domain       | Yes               | Yes                  | Yes                           |  
  | Collective Consistency | Yes               | Yes<sup>‡</sup>      | Yes                           |  
  | Completeness           | Yes               | **No**<sup>§</sup>   | Yes                           |  
  | Deductive Closure      | Yes               | **No**               | Yes                           |  
  | Consensus Preservation | Yes               | Yes                  | Yes                           |  
  | Propositionwise Indep. | **No**            | **No**               | **No**                        |  
  | Systematicity          | **No**            | **No**               | **No**                        |  
  | Anonymity              | Yes               | Yes                  | Yes                           |  
  | Non-Dictatorship       | Yes               | Yes                  | Yes                           |  
  | Monotonicity           | Yes               | Yes                  | **Usually**                   |  
  | Premise-Sensitivity    | **Yes**           | **No**               | Variable                      |  

  <sup>†</sup> *Distance-based rules* (e.g., minimize Hamming distance to individual judgments).  
  <sup>‡</sup> Conclusion-based rules avoid inconsistency by ignoring premises.  
  <sup>§</sup> Conclusion-based rules are incomplete on premises.  

  #### Summary of Trade-offs:  
  - **Premise-based voting** excels at reason-tracking and coherence but violates independence.  
  - **Conclusion-based voting** avoids inconsistency but sacrifices completeness, deductive closure, and reason-tracking.  
  - **Distance-based rules** optimize global coherence but violate independence/monotonicity and lack clear reason-tracking.  

  **The core tension**: **PI** is the primary obstacle to coherent aggregation. Dropping PI enables premise-based or distance-based rules, which prioritize rationality over procedural independence. Restricting completeness (conclusion-based) is a stopgap but undermines the group’s capacity for reasoned action. Choose based on whether epistemic quality (PS) or procedural fairness (PI) is paramount.
