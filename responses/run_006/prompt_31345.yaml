answer: |-
  Here are five open questions or implications of the Hart-Fuller debate, prioritized and framed for contemporary relevance:

  1.  **How should emerging regimes reconcile the demands of justice with the formal validity of oppressive prior laws during transitions?** This drives urgent dilemmas in transitional justice, reparations, and constitutional reform globally, moving beyond abstract natural law vs. positivism by confronting practical strategies for societal healing after atrocity within (or despite) inherited legal frameworks.
  2.  **To what extent can procedural requirements (Fuller's "inner morality") constrain state power or algorithmic governance when substantive injustice persists within formally valid rules?** This matters critically for evaluating algorithmic decision-making, emergency powers, and illiberal democracies that exploit legal forms, shifting focus from law's *existence* to its *quality* and *abuse* in modern regulatory and technological contexts.
  3.  **Does the authority of international human rights law depend primarily on its formal sources (treaties, custom) or its congruence with fundamental principles of human dignity, especially when states violate it?** This is central to debates on humanitarian intervention, universal jurisdiction, and the enforcement gap, transforming the debate into a concrete struggle over the foundations of global legal order against state sovereignty and cultural relativism.
  4.  **How should courts and legal systems handle "wicked legal problems" – conflicts between valid legal rules and overwhelming moral imperatives (like climate catastrophe or extreme inequality) – without collapsing into pure discretion or undermining the rule of law?** This moves beyond punishing past evils to proactively navigating systemic crises where existing legal frameworks seem inadequate, testing the limits of both positivist adherence and natural law adjudication in unprecedented circumstances.
  5.  **Can the concept of law meaningfully incorporate non-state normative orders (e.g., Indigenous law, corporate governance, digital communities) without sacrificing either analytical clarity (Hart) or the link to fundamental purpose (Fuller)?** This challenges traditional state-centric views in our pluralistic world, demanding new theoretical models for understanding legal authority and legitimacy arising from diverse sources beyond sovereign command.
