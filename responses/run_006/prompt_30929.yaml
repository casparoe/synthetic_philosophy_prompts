prompt: |-
  I'm a department head at a mid-size architecture firm, managing about thirty-five people across four project teams. Over the past eighteen months I've found myself repeatedly in the same uncomfortable position: a team member raises a complaint about a colleague's conduct — missing deadlines without notice, speaking over others in client meetings, claiming credit for collaborative design work — and the colleague deflects not by denying the facts but by challenging the complainant's standing: "He's done the same thing," "She's not my supervisor," "That's rich, coming from her." I've handled these inconsistently. Sometimes I've dismissed the complaint because the complainant seemed hypocritical; other times I've insisted that a true criticism doesn't become false just because of who says it. Neither approach has felt satisfactory, and my inconsistency is starting to affect team morale. People are beginning to game it — preemptively digging up dirt on anyone who might criticize them.

  I've since learned that philosophers have written extensively on what they call the "standing to blame" — roughly, the conditions under which a person is entitled to issue a moral criticism, considered separately from whether the criticism itself is accurate. I don't have the bandwidth to read the literature, but I need something I can use. Please adopt the role of a moral philosopher specializing in responsibility and blame. Your task is to design a decision procedure I can run, in under fifteen minutes, whenever a standing challenge comes up in my team. The procedure should be a sequence of questions I ask myself about the situation, ordered so that earlier questions screen out the clearest cases. For each question, tell me what a "yes" or "no" answer implies for how I proceed. Flag any steps where the procedure cannot eliminate judgment and I simply have to exercise discretion. The procedure should be usable by someone without philosophical training and should be honest about its own limitations — where it will misfire, what it cannot settle.

  Then run the procedure on two cases:
  (1) A project lead who has a pattern of interrupting colleagues during internal meetings criticizes a junior architect for interrupting a client during a presentation.
  (2) A senior designer criticizes a peer for presenting a shared design concept to the partners as though it were solely her own work; the critic herself did something similar three years ago, formally apologized to the team at the time, and has not repeated the behavior since.

  Please deliver your response as exactly five numbered items, each two to four sentences, with no introduction or conclusion. Items 1 through 3 should present the decision procedure — the ordered questions, their implications, and the judgment calls. Items 4 and 5 should be the worked applications to the two cases. Think carefully through the underlying philosophical distinctions before constructing the procedure; I need this grounded in the actual literature on standing and hypocrisy, not in workplace folk wisdom. Write in American English.
reasoning: |-
  Hmm, the user is a department head at an architecture firm facing a common workplace challenge: colleagues deflecting criticism by attacking the complainant's standing. They've tried inconsistent approaches and want a philosophical framework to handle "standing to blame" issues quickly. 

  The core tension here is between maintaining moral accountability and preventing hypocrisy-fueled chaos. They need a practical tool grounded in real philosophy (Wallace, Watson, etc.), not HR platitudes. Key distinctions to incorporate: ongoing vs. reformed misconduct, institutional roles, and whether the criticism serves corrective purposes. 

  For the decision procedure, I'll structure it as a triage system:
  First question filters out clear cases where the critic lacks moral standing due to identical ongoing behavior (hypocrisy trap). 
  Second question assesses if the critic has institutional authority despite personal flaws (role legitimacy). 
  Third question handles gray areas where standing might be contested but correction is necessary (moral necessity override). 

  Important to flag where judgment is unavoidable - especially in assessing "identical" misconduct or "sufficient distance" from past errors. The procedure must acknowledge its own failure modes, like when both parties have legitimate grievances that require mediation rather than blame-assessment. 

  Applying to the cases: 
  For (1), the project lead's ongoing identical misconduct voids standing - the junior's interruption needs addressing but not by this hypocrite. 
  For (2), the senior's reformed behavior and apology restore standing - especially since the peer's current action is materially similar. 

  The user's hidden struggle is likely preserving team trust while avoiding endless "whataboutism." By separating standing from truth, this tool forces focus on whether criticism functions constructively rather than settling interpersonal scores.
answer: |-
  Here is the decision procedure and its application:

  1.  **Is the critic currently engaging in the *exact same* misconduct they are criticizing?** If yes, they lack standing due to *active hypocrisy*; dismiss the standing challenge but address the underlying misconduct separately. If no, proceed. Judgment call: determining whether the misconduct is "exact same" (e.g., severity, context). The procedure misfires if behaviors are superficially similar but materially different.

  2.  **Does the critic have a specific institutional role or responsibility that grants them authority over the conduct in question?** If yes (e.g., a supervisor addressing missed deadlines), they likely retain standing despite potential personal flaws; proceed to evaluate the complaint's substance. If no, proceed to Question 3. Judgment call: interpreting the scope of institutional roles. This step cannot settle standing disputes between peers lacking formal authority.

  3.  **Is the critic's own relevant past misconduct sufficiently distant (time, pattern, acknowledgment) that blaming now serves a legitimate corrective purpose?** Consider: Has the misconduct stopped? Was it acknowledged/apologized for? Is it significantly in the past? If yes, standing is likely intact; evaluate the complaint's substance. If no (ongoing pattern, unacknowledged, very recent/repeated), standing may be compromised; address the underlying misconduct but consider the criticism tainted. Judgment call: weighing "sufficient distance" and "legitimate purpose." The procedure struggles when past wrongdoing is acknowledged but recent.

  4.  **Case 1 (Project Lead Criticizing Junior):** (Q1) Yes, the lead *is* currently engaging in the exact same misconduct (interrupting colleagues). Standing is denied due to active hypocrisy. Dismiss the standing challenge regarding *who* delivered the criticism. However, the junior's interruption of the client remains misconduct needing separate correction, potentially by someone else. The lead's hypocrisy must also be addressed.

  5.  **Case 2 (Senior Designer Criticizing Peer):** (Q1) No, she is not currently claiming sole credit. (Q2) No specific institutional role over credit assignment is implied. (Q3) Yes, her past similar misconduct (3 years ago) was formally acknowledged/apologized for and not repeated, creating sufficient distance. Her criticism serves a legitimate corrective purpose for current team dynamics. Standing is intact; evaluate the substance of her complaint against the peer.
