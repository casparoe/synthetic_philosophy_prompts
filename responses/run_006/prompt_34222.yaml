prompt: |-
  I'm trying to figure out what principle I actually hold about consent, starting from my gut reactions to a set of cases rather than from a theory. I'd like you to extract the principle that best captures my verdicts, state it precisely, tell me which of my verdicts it cannot accommodate (if any), and apply it to a case I'm still uncertain about.

  Here are the cases and my verdicts:

  1. A lies to B about being unmarried. B sleeps with A on that basis. Verdict: B's consent is invalid.
  2. A knows they have an STD, B asks directly, and A denies it. B sleeps with A. Verdict: invalid.
  3. A knows they have an STD, B doesn't ask, and A says nothing. Verdict: invalid, though I'm less confident.
  4. A tells B "I'm a record producer" when in fact A works retail. B sleeps with A partly because of the claimed career. Verdict: I don't think this invalidates consent, but it makes me uneasy.
  5. A threatens to fire B from their job unless B sleeps with A. Verdict: invalid.
  6. A says to B, "I'll be really sad and disappointed if you don't." B sleeps with A to avoid hurting A's feelings. Verdict: valid, though manipulative.
  7. B is blackout drunk. Verdict: invalid.
  8. B has had two glasses of wine and is slightly tipsy but knows what they're doing. Verdict: valid.
  9. A is B's identical twin and pretends to be B's spouse in a dark room. Verdict: invalid.
  10. A tells B they're on birth control when they're not. Verdict: invalid.
  11. A tells B they love B when they don't, in order to get B to sleep with them. Verdict: valid, though A is contemptible.

  The case I keep going back and forth on: A and B meet on a dating app. A's profile says they're looking for a serious relationship. A is actually only looking for casual sex and knows this, but says whatever gets matches. B sleeps with A believing this might lead to a relationship. Is B's consent valid?

  Please give me the best principle you can that captures my verdicts, explain which of my verdicts (if any) it forces me to overturn, and tell me what it says about the dating app case. If there's a simpler principle that captures most but not all of them and a more complex one that captures all of them, please give me both and let me choose. Keep the response to at most 500 words.
reasoning: |-
  Okay, let me approach this systematically. The user wants me to extract their underlying consent principle from specific case judgments, identify any inconsistencies, and apply it to their unresolved dating app scenario.

  First, analyzing the verdicts:
  - Cases 1-3 and 10 involve deception about fundamental facts (marital status, health risks, contraception) where consent is invalidated
  - Case 5 shows threats invalidate consent
  - Case 9 involves identity fraud
  - Case 7 involves incapacitation
  - But cases 4 (career lie) and 11 (false love) are deemed valid despite deception
  - Case 6 (emotional manipulation) is valid but sketchy

  Noticing a pattern: deception only invalidates consent when it concerns "material facts directly relevant to physical/health consequences or fundamental identity." This explains why the record producer lie (case 4) doesn't invalidate - it's not fundamental to bodily safety. 

  The tricky part is reconciling case 11 (false love) being valid with case 1 (marital lie) being invalid. Here the principle must distinguish deception about relational context (marriage as existing bond) versus emotional claims. 

  For the dating app case: If the principle requires deception about "core terms of the encounter," pretending to seek relationships when only wanting sex likely violates this as it misrepresents the fundamental nature of the interaction. But if the principle only covers immediate physical/health risks, it might not.

  The user's hesitation in case 3 (undisclosed STD) suggests they intuitively want disclosure duties beyond explicit lies. This supports the "material facts" framing over narrower "fraud" definitions.

  The "core terms" principle accommodates all verdicts except possibly case 11 - but since false love doesn't alter the encounter's fundamental terms, it holds. For the dating app, this principle clearly invalidates consent due to intentional misrepresentation of relationship intent.
answer: |-
  Based on your verdicts, the principle that best captures your stance is:

  **Consent is invalid if obtained through deception, coercion, or incapacity concerning a *material fact* or *core term* of the sexual encounter that directly impacts bodily autonomy, health, fundamental identity, or the basic nature of the act itself.**

  **Analysis:**
  1.  **Material Facts/Core Terms:** Your invalid verdicts (1, 2, 3, 5, 7, 9, 10) involve deception/threats/incapacity about facts central to the encounter's fundamental nature or risks: marriage status (relational context), STDs/contraception (health risks), identity, job threat (coercion), incapacity. Case 5 (threat) directly coerces the act.
  2.  **Non-Material Deception/Manipulation:** Your valid verdicts (4, 6, 11) involve deception/manipulation about peripheral aspects (career, feelings, emotional commitment) that don't alter the core act's nature or inherent risks. Case 8 (tipsy) shows capacity isn't inherently lost.
  3.  **Tension:** Case 3 (Undisclosed STD, no ask) is accommodated because the STD is a material health risk, creating a duty to disclose regardless of asking. Your unease in Case 4 (record producer) stems from the lie, but it doesn't impact material facts/core terms. Case 11 (false love) is valid because emotional state, while significant, isn't a *core term* defining the act itself (like health risk or identity).
  4.  **Accommodation:** This principle **fully accommodates all your verdicts** without forcing an overturn. It explains why Case 11 is valid (emotional deception ≠ material fact/core term) and Case 3 is invalid (material health risk requires disclosure).

  **Dating App Case (A lies about seeking relationship):**
  *   **Application:** A intentionally deceived B about the *fundamental nature and purpose* of the encounter (a potential relationship vs. purely casual sex). This misrepresents a **core term** of B's agreement. B consented to sex *within the context of* exploring a relationship, not purely casual sex.
  *   **Verdict by Principle:** **Invalid consent.** The deception pertains directly to the core understanding and relational context under which B agreed to the physical act, impacting B's autonomous decision about the nature of the interaction.

  **Simpler Alternative (Captures Most, Not All):**
  *   **Principle:** Consent is invalid if obtained through deception about facts directly impacting health risks, identity, or relational status (like marriage), or through coercion/incapacity.
  *   **Issue:** Forces you to overturn **Case 3 (Undisclosed STD, no ask)** as there was no deception (only omission) and no explicit asking. It doesn't capture your intuition about the duty to disclose material health risks regardless. Case 11 remains valid.

  **Conclusion:** Your core principle emphasizes the invalidity of consent when deception, coercion, or incapacity distorts the *essential nature or fundamental risks* of the sexual act itself or the immediate relational context defining it (like marriage). The dating app lie falls squarely under this, invalidating consent.
