  The tension hinges on *spatial disconnect*: the group impacted isn’t bound by the jurisdiction. If commuters lived there, both views align. Without this, they split. 

  For the rebuttal, the subject-to-the-laws defender would argue slippery slopes and administrative chaos. Affected-interests counters with proportionality—not all affected groups get votes, just those *centrally* impacted. Prioritizes harm prevention over procedural purity. 

