  ## Ethics Committee Pre-Meeting Memo: Ulysses Contract Enforcement Recommendation  
  **Patient:** Bipolar I Disorder, currently manic, refusing lithium per Ulysses directive  
  **Date:** [Thursday's Date]  

  ### I. Recommendation  
  **Enforce the Ulysses contract for a defined 72-hour stabilization period**, then immediately reassess capacity and preferences. Treatment should be the minimally necessary intervention (lithium only) to resolve acute mania sufficient to restore decision-making capacity. *Cease involuntary treatment if she regains capacity and maintains refusal after stabilization.*  

  ### II. Steelmanning the Patient’s Position (No Strawman)  
  Her argument is philosophically and legally substantive:  
  1. **"Identity Discontinuity"**: She asserts her manic self is a distinct agent from her stable self, rejecting the moral authority of a "past stranger" over her current conscious experience. Forcing treatment treats her as a mere vessel for another’s will, violating her *present* autonomy.  
  2. **Capacity Threshold**: She correctly notes she understands lithium’s purpose, risks, and alternatives. Her refusal stems not from incapacity but from a coherent (if contestable) worldview: that manic euphoria is preferable to stability, and that future well-being shouldn’t override current self-determination.  
  3. **Contract Invalidity**: She challenges whether a prior self can ethically bind a future self with diametrically opposed values. If we accept her identity-shift claim, the contract may be void *ab initio*—a foundational consent issue.  
  4. **Coercion & Bodily Integrity**: Enforcing the contract against a coherent refusal instrumentalizes her body for a goal she now rejects, echoing historic psychiatric abuses where "best interests" overrode dissent.  

  **This is not psychosis-driven anosognosia; it’s a values-based rejection of her past self’s hierarchy of goods.**  

  ### III. Why I Recommend Rejecting Her Position (Despite Its Strength)  
  1. **Temporal Autonomy & Authentic Self Argument**: Her stable self enacted the directive precisely *because* mania distorts her core values (relationships, health, stability). To disregard this is to privilege the epistemically compromised manic state over her reflective, values-constitutive self. Ulysses contracts exist to protect *extended* autonomy.  
  2. **Precommitment Rationality**: During stability, she recognized mania’s impairing effect on judgment. Honoring this precommitment respects her longitudinal rationality, akin to honoring advance directives in dementia.  
  3. **Harm Threshold**: Without intervention, she risks catastrophic consequences (financial ruin, self-harm, permanent relational damage) she explicitly sought to prevent. Allowing this violates beneficence *as defined by her own prior wishes*.  
  4. **Capacity Nuance**: While she understands *facts*, mania impairs *appreciation* and *reasoning*:  
     - **Appreciation**: She cannot internalize that her current "wellness" is pathological (a core DSM-5 capacity criterion).  
     - **Reasoning**: She dismisses prior evidence of post-manic regret as irrelevant to her "current self."  
     - **Value Stability**: Her rejection of lithium contradicts her lifelong value of stability, indicating impairment in consistent valuation.  

  ### IV. Key Uncertainties & Concerns  
  - **❗Identity Discontinuity**: Is her "different person" claim a symptom (indicating incapacity) or a valid philosophical stance? **This keeps me up at night.**  
  - **❗Capacity Lens Limitation**: This case exposes flaws in binary capacity assessments. A richer "value stability" framework may be needed for psychiatric advance directives.  
  - **Duration Justification**: Why 72 hours? It’s clinically pragmatic but arbitrary; reassessment should be *symptom-driven* (e.g., until YMRS ≤ 20).  
  - **Slippery Slope**: Could enforcing this normalize overriding capacitated refusals? We must insist on strict criteria: (a) Clear prior directive, (b) Active mania/depression, (c) Documented history of impaired judgment in episodes.  

  ### V. Conclusion  
  **Enforce the directive temporarily**, not because she lacks capacity *simpliciter*, but because acute mania undermines her ability to evaluate long-term values—a lapse her past self anticipated. However, this imposition must be:  
  - **Minimal**: Lithium only; no additional interventions without separate justification.  
  - **Time-Limited**: 72 hours (or until acute symptom resolution), then reassess.  
  - **Recursive**: If she *still* refuses post-stabilization, her capacitated choice must prevail.  

  Her argument forces us to confront psychiatry’s deepest tension: between respecting present autonomy and protecting identity over time. While her perspective is formidable, honoring her Ulysses contract best respects *both* her autonomy-as-planning and her well-being.  

