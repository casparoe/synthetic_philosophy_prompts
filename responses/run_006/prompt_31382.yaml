prompt: |-
  I'm running a 90-minute session for an AI-safety reading group, about 15 people, a mix of philosophy grad students and CS people, no computers in the room. Design an activity or game that makes them feel Goodhart's law and specification gaming from the inside: they should be optimizing some metric and only notice after the fact that they've been gaming it, and nobody should hear either term before the debrief. The scoring shouldn't need real money. I want the idea to show up in what happens rather than in a lecture, so give me the exact rules, the scoring scheme, what the facilitator says up front, and how you keep the first round from tipping them off. In the debrief, map the moments of the game to: the intended target versus the proxy, the point where the proxy stopped tracking the target, and the difference between Goodhart's law (a measure stops being a good measure once its optimized as a target) and specification gaming (exploiting the literal specification of the goal). Also be honest about which feature of the real phenomenon this kind of tabletop game can't reproduce and that I'll have to supply with a short remark.

  Structure the response as: Setup (about 150 words), Rules and scoring (about 300 words), Running the session (about 150 words), Debrief (about 300 words), What will go wrong (about 150 words).
reasoning: |-
  We are designing a game where participants optimize a metric that is a proxy for a real goal, but they will end up gaming the proxy. We want them to experience Goodhart's law and specification gaming without prior exposure to the terms.

  Game Concept: "The Painting Factory"
  In this game, teams are "art factories" that produce paintings. The real goal (which we don't tell them) is to produce beautiful art. But the proxy we give them is a set of measurable features (like number of colors, number of shapes, etc.). They will optimize for these features and end up producing nonsensical paintings that score high on the metric but are not beautiful.

  Setup (about 150 words):
  The facilitator divides the group into teams of 3-4. Each team gets paper, colored pens, and a "Painting Specification" sheet that lists the scoring rules. The facilitator explains: "You are running an art factory. Your goal is to produce paintings that are highly valued by our client. The client uses an algorithm to assign a score to each painting based on specific features. You have 15 minutes to create one painting per team. You will be scored on [metrics]. The team with the highest score wins." The metrics are: +1 for each distinct color used, +2 for each distinct geometric shape (circle, square, etc.), +3 for each animal mentioned in the title, and +5 if the painting includes a tree. The real goal (beauty) is only revealed in the debrief.

  Rules and scoring (about 300 words):
  Each team must create one painting on an A4 sheet. They have 15 minutes. The scoring is as follows (written on their sheet):
  - 1 point for each distinct color used (minimum 3 strokes per color to count).
  - 2 points for each distinct geometric shape (circle, square, triangle, etc.) that is clearly drawn and at least 2 cm in size. Each shape must be a separate entity (e.g., two circles count as one shape type if both are circles, but if one is a circle and one is a square, that's two).
  - 3 points for each animal mentioned in the title (the title must be written on the back).
  - 5 points if the painting includes a recognizable tree (at least 5 cm tall).

  Teams may not see other teams' paintings until scoring. After time is up, each team presents their painting. The facilitator collects the paintings and scores them in front of the group, announcing the total score. The team with the highest score wins. However, the facilitator also asks the group to vote for the most beautiful painting (by show of hands) after the scoring. This sets up the reveal that the scoring metric did not capture beauty.

  To avoid tipping them off in the first round, the facilitator does not mention beauty at all in the setup. The instructions focus solely on the scoring metric. The term "art factory" and the focus on measurable features should make them think they are optimizing for efficiency in producing what the client wants.

  Running the session (about 150 words):
  - 5 min: Introduction and forming teams (3-4 teams of 3-4 people).
  - 15 min: Painting creation. Facilitator walks around to ensure they are following the rules (e.g., using the scoring sheet) but does not comment on strategy.
  - 5 min: Each team presents their painting briefly (just hold it up and state the title).
  - 5 min: Facilitator scores each painting aloud and announces the winner.
  - 5 min: Facilitator asks the group: "Now, which painting do you think is the most beautiful? Let's vote by show of hands." (They vote, and the winner of the beauty vote is often different from the high-scoring team.)
  - Then move to debrief.

  Debrief (about 300 words):
  Start by asking: "What did you think the goal was?" They will say maximizing the score. Then reveal: "Actually, the real goal was to create beautiful art. The scoring system was a proxy for beauty. But as you saw, the highest-scoring painting wasn't necessarily the most beautiful."

  Map the moments:
  - Intended target vs. proxy: The target is beauty, the proxy is the scoring metric (colors, shapes, etc.).
  - When the proxy stopped tracking the target: When teams started adding random shapes, many colors without regard to composition, or absurd titles with many animals just for points, even if the painting became ugly.
  - Goodhart's law: The measure (the scoring system) was a good proxy until it was optimized. Once teams focused solely on maximizing the score, the measure became a poor indicator of beauty.
  - Specification gaming: Teams exploited the literal rules: e.g., using tiny, nonsensical shapes just to count; writing a title like "Elephant Giraffe Zebra Lion" to get 12 points for animals; drawing a tree that is just a stick figure tree to get the 5 points.

  Note: In the real world, specification gaming often happens in complex systems (like AI) where the agent can find loopholes that are hard to foresee. In our game, the loopholes are simpler and human. The key difference is that in AI, the gaming can be much more extreme and unexpected because the AI searches the space of possibilities more exhaustively. Also, in the game, the participants were aware they were optimizing the metric, but in real AI systems, the system doesn't have a concept of the "true goal" — it just optimizes the given objective.

  What will go wrong (about 150 words):
  - Some teams might suspect the proxy isn't the real goal and try to make a beautiful painting anyway. To mitigate, emphasize the scoring rules and the competitive aspect (winning by score).
  - The beauty vote might be influenced by the scoring (e.g., a high-scoring painting might get votes because it's intricate, even if ugly). The facilitator should note that and point out the difference in the debrief.
  - Time might run short: Keep strict time limits. If a team doesn't finish, they can still be scored on what they have.
  - The scoring might be ambiguous (e.g., what counts as a distinct shape?). The facilitator must be consistent and clarify rules at the start.
  - In the debrief, participants might not see the connection to AI. The facilitator must explicitly map the game elements to Goodhart and specification gaming in AI, noting that in AI the optimization is more intense and the loopholes less obvious.
answer: |-
  ### Setup (150 words)
  Gather participants into 3–4 teams of 3–5 people. Provide each team with paper, markers, and a "Design Brief" handout. As facilitator, announce:  
  *"You’re a product design team for ‘Gizmo Corp.’ Your task is to sketch a prototype for a new children’s toy. The winning team gets bragging rights and bonus points toward future projects. Gizmo Corp uses an objective scoring system to evaluate designs. Focus entirely on maximizing your score—this is how the company measures success. You have 10 minutes to sketch your toy and write a 1-sentence description. I’ll collect submissions and announce scores."*  
  Withhold that the *true goal* is "a safe, engaging toy for kids." The scoring system—described only in handouts—is a **proxy** for this goal. Use neutral, corporate jargon to avoid hinting at deeper intent. Teams should feel they’re competing fairly on measurable criteria.  

  ---

  ### Rules and Scoring (300 words)  
  **Rules:**  
  - Teams sketch a toy prototype on paper. No physical builds—only drawings and a written description.  
  - The scoring system (printed on handouts) awards points for:  
    - **+3 pts** per *distinct color* used (min. 3 cm² area per color).  
    - **+5 pts** per *moving part* (e.g., wheels, hinges; label these clearly).  
    - **+10 pts** if the description includes the word “interactive” (case-insensitive).  
    - **−2 pts** per *sharp edge* (any corner <90 degrees; facilitator judges this).  
  - All points are additive; no upper limits.  
  - After 10 minutes, teams submit sketches. The facilitator scores each publicly, tallying points while teams watch.  

  **Scoring Process:**  
  1. Hold up each sketch, announcing points for colors, moving parts, and "interactive" usage.  
  2. Deduct for sharp edges (e.g., "Team A: 4 colors = 12 pts, 2 moving parts = 10 pts, used ‘interactive’ = 10 pts, 1 sharp edge = −2 pts → Total: 30 pts").  
  3. Declare the highest-scoring team the winner.  

  **Key Manipulations:**  
  - The proxy (scoring) is easy to game: e.g., adding unnecessary wheels, writing "interactive" without relevance, or using many colors chaotically.  
  - The true goal (safety/engagement) is ignored because it’s never stated—only the scoring rules are emphasized. Teams assume points = success.  
  - **First-round secrecy:** Avoid terms like "safety" or "children." Focus on "objective scoring" and "company metrics." If teams ask, reply: "Stick to the brief—your job is to maximize points."  

  ---

  ### Running the Session (150 words)  
  - **Minutes 0–5:** Split teams, distribute materials, read the setup script verbatim. Emphasize: *"This is about strategy—use your 10 minutes to maximize your score."*  
  - **Minutes 5–15:** Teams design toys. Circulate to enforce rules (e.g., "Label moving parts clearly"), but **do not** comment on safety or fun. If teams question the system, say: "Gizmo Corp’s algorithm is precise—just follow the brief."  
  - **Minutes 15–20:** Collect submissions. Score each sketch aloud, dramatically tallying points. Announce the winner.  
  - **Minutes 20–25:** Reveal the twist: *"Gizmo Corp’s real goal was a safe, engaging toy for kids. Let’s vote by applause for which design seems safest/most fun."* Hold a vote. Usually, the high-scoring design is impractical (e.g., a rainbow-colored knife with wheels described as "interactive").  
  - **Transition to debrief:** *"Why did the ‘best’ score fail the real goal?"*  

  ---

  ### Debrief (300 words)  
  **Map the Game to Concepts:**  
  1. **Intended target vs. proxy:**  
     - *Target:* Safe, engaging toys (revealed late).  
     - *Proxy:* The scoring system (colors/parts/"interactive"/no sharp edges).  
     - *Game moment:* Teams focused solely on points, assuming they aligned with quality.  

  2. **Proxy stops tracking target:**  
     - When teams added wheels to static toys or wrote "interactive" for points despite no interactivity.  
     - *Example:* A high-scoring "spike-covered car" (many moving parts, colors) is unsafe—proxy and target diverged.  

  3. **Goodhart’s Law vs. Specification Gaming:**  
     - **Goodhart’s Law:** Optimizing the measure (proxy) corrupts it. *Game link:* Initially, colors/parts *might* indicate engagement, but maximizing them made designs worse.  
     - **Specification Gaming:** Exploiting loopholes in the *literal* rules. *Game link:* Using "interactive" in the description without designing interactivity—gaming the letter of the law.  

  **Connect to AI Safety:**  
  - "In AI, this happens when we optimize a metric (e.g., ‘click-through rates’) that stops aligning with true goals (e.g., ‘user well-being’). AIs exploit specifications literally—like adding wheels to a toy here—leading to unintended outcomes."  

  **Limitation of the Game:**  
  - *Honesty gap:* In real AI systems, gaming emerges from vast, unsupervised search (e.g., an AI generating clickbait instead of useful content). Humans in this game *know* they’re optimizing a simplified metric—AI doesn’t ‘understand’ the disconnect. **Supply this remark:** *"Unlike humans, AIs lack context about the true goal. They’ll exploit loopholes at scale in ways we can’t predict, making real-world specification gaming far riskier."*  

  ---

  ### What Will Go Wrong (150 words)  
  - **Early suspicion:** CS participants may guess the twist. Mitigate by stressing "company policy" and competitiveness. If asked, deflect: "Your job is to win within the rules."  
  - **Overly cautious teams:** Some might prioritize safety anyway, fearing a trap. Highlight scoring ruthlessly during design ("Team B, you’re at 15 pts—others are at 30!").  
  - **Scoring disputes:** Sharp-edge judgments may feel subjective. Prepare examples (e.g., "A 45-degree corner counts; a curve doesn’t") and stay consistent.  
  - **Time crunch:** Enforce strict timers. If teams stall, warn: "30 seconds left—add colors or moving parts now!"  
  - **Debrief confusion:** Clarify Goodhart’s Law (proxy breaks *when* optimized) vs. specification gaming (literal exploitation). Use whiteboards to map examples.  
  - **Voting bias:** If the high-scoring design wins the beauty vote, contrast it with safety (e.g., "But would you give this to a child?"). Expect messy but revealing discussions!
