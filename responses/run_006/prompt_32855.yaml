answer: |-
  ## Joint Statement on the Euthyphro Dilemma: Adversarial Collaboration

  We, the undersigned members of the Metaethics Reading Group, recognizing our prolonged and fruitful engagement with the Euthyphro dilemma and the fundamental divide between Theological Voluntarism (TV) and the Autonomy of Ethics (AE), embark on this adversarial collaboration. Our shared goal is not to achieve immediate consensus, but to precisely map our disagreement, identify the underlying cruxes, and clarify the points where future inquiry or argument might decisively shift the debate. We seek to produce a document that accurately represents both positions in terms their proponents accept, isolates the genuine substantive disagreements, and distinguishes them from potential verbal misunderstandings. We affirm our mutual commitment to rigorous philosophical inquiry concerning the nature of moral facts, the relationship between morality and the divine, and the structure of grounding relations.

  1.  We jointly affirm that the Euthyphro dilemma presents a genuine and profound challenge concerning the relationship between divine commands and moral facts, specifically moral obligation. It forces a choice between two horns: either (a) the moral rightness of an act depends upon its being commanded by God (raising concerns about arbitrariness and the loss of moral objectivity), or (b) God commands acts because they are antecedently morally right (raising concerns about the independence of morality from divine will and the nature of divine sovereignty).
  2.  We jointly affirm that the dilemma primarily concerns the *metaphysical grounding* or *explanation* of moral facts, particularly moral obligation ("ought"), rather than merely epistemic access to them or semantic analysis of moral terms. It asks *why* acts are obligatory, not merely how we know they are or what our words mean.
  3.  We jointly affirm that the dilemma rules out positions that attempt to assert both that God's commands *constitute* moral obligation and that God is *bound* by an independent moral standard in issuing those commands, without providing a coherent account of how these can be simultaneously true without circularity or infinite regress. It also rules out positions that deny the existence of moral facts altogether (moral nihilism) within this specific debate context.
  4.  We jointly affirm that resolving the dilemma satisfactorily requires providing a coherent metaphysical account of the relationship between divine commands and moral facts that avoids the perceived pitfalls of both horns – specifically, avoiding making morality arbitrary (if grounded solely in divine will) or making God subject to an external standard (if morality is fully independent). A successful resolution must explain how God relates to morality in a way that preserves divine sovereignty without sacrificing moral objectivity and normativity.
  5.  We jointly affirm that both TV and AE aim to provide accounts of moral realism – the view that moral facts are objective and mind-independent in a significant sense. TV locates this mind-independence in the divine mind/will, while AE locates it in necessary moral truths. Both positions reject subjectivism and relativism concerning fundamental moral obligations.
  6.  We jointly affirm that the intelligibility of religious discourse praising God as "good" or "just" is a crucial desideratum for any metaethical position seeking to accommodate theistic commitments. Both TV and AE claim to satisfy this desideratum, albeit through different explanations.

  Despite these significant areas of agreement, our fundamental disagreement centers on the nature of the relationship between divine commands and moral obligation. This disagreement manifests in two core, interrelated points:

  **First Disagreement: The Grounding of Moral Obligation.**  
  The Theological Voluntarist affirms that an act's property of *being morally obligatory* is constituted by, and metaphysically dependent upon, its being commanded by God. Without a divine command, there exists no such property instantiated; God's commanding an act is what *makes* it obligatory. The proponent of the Autonomy of Ethics affirms that moral obligations exist necessarily and independently of any will, including God's. Acts possess the property of *being morally obligatory* in virtue of their intrinsic nature or necessary moral principles. God, being perfectly good and rational, commands acts *because* they possess this independent obligatory property. The Voluntarist thus accepts the first horn of the dilemma as correctly describing the grounding relation, while the Autonomist accepts the second horn.

  *   **The Crux:** Can moral obligation coherently be conceived as existing independently of any authoritative command or legislating will? Or is the very concept of "obligation" logically tied to the existence of a commander whose authority generates the obligation?
  *   **Test Case & Predictions:** Consider the scenario where God, hypothetically, commands nothing. The Voluntarist predicts that in this scenario, *no moral obligations exist whatsoever*. The concept "morally obligatory" would have no instances; there would be nothing one *ought* to do in the moral sense. The Autonomist predicts that even in this scenario, certain acts (e.g., refraining from torturing innocents for fun) would *still be morally obligatory*. The property exists necessarily, and while God's commands might inform us or motivate compliance, they do not create the obligation itself. Both sides agree that the coherence and implications of this thought experiment bear directly on the crux. The Voluntarist sees the Autonomist's prediction as rendering "obligation" meaningless without a commander, while the Autonomist sees the Voluntarist's prediction as reducing obligation to mere power.

  **Second Disagreement: The Evaluability of Divine Commands.**  
  The Theological Voluntarist affirms that the statement "God commands X" entails "X is morally obligatory (good/right)" as a matter of meaning or metaphysical necessity. Consequently, it is incoherent or necessarily false to say "God commanded X, but X is morally wrong"; God's command *defines* moral rightness for obligatory acts. Divine commands are not subject to evaluation against an independent moral standard concerning obligation; they *constitute* that standard. The proponent of the Autonomy of Ethics affirms that the statement "God commands X" and "X is morally obligatory (good/right)" are distinct, albeit necessarily co-instantiated in the actual world due to God's essential perfect goodness. It remains coherent to state "God commanded X *because* X is morally obligatory," meaning God recognizes and responds to the independent standard. Asserting "God commanded X, but X is morally wrong" is seen as a contradiction only because God's nature makes it impossible, not because "wrong" is defined as "not commanded by God."

  *   **The Crux:** Is the connection between "commanded by God" and "morally obligatory" analytic/constitutive (true by definition or metaphysical constitution) or synthetic/necessary-but-explanatory (true necessarily because of God's nature responding to independent facts)?
  *   **Test Case & Predictions:** Analyze the statement: "If God commanded the torture of innocents for fun, it would be morally obligatory." The Voluntarist predicts this statement is *necessarily true*; it follows directly from the meaning of "morally obligatory" within TV. Denying it reveals a misunderstanding of the theory. The Autonomist predicts this statement is *necessarily false*; it misrepresents the concept of moral obligation, which inherently rules out such acts being obligatory regardless of any command. God's essential goodness makes commanding such an act impossible, but the *reason* it couldn't be obligatory is grounded in the independent moral repugnance of the act itself, not merely the lack of a command. Both sides agree that intuitions and analysis concerning such counterpossibles reveal the underlying commitments about the relationship between the concepts.

  **Verbal Clarification:** We note that some apparent disagreement may stem from differing uses of "because." The Voluntarist typically uses it in a *constitutive* or *causal* sense (God's command *makes* it right). The Autonomist typically uses it in an *explanatory* or *rationale* sense (God's command is *motivated by* its rightness). While this difference in usage is important to recognize to avoid talking past each other, we agree it does not eliminate the substantive metaphysical disagreement about grounding and dependence outlined above. The core dispute remains whether the moral property ontologically depends on the divine command.

  This statement represents our best collaborative effort to pinpoint the locus of our disagreement, identify the crucial questions (cruxes) whose resolution would significantly impact the debate, and propose thought experiments where our predictions diverge in testable ways. We sign below, acknowledging the depth of the disagreement while affirming our shared commitment to understanding the Euthyphro dilemma and its implications for metaethics and philosophical theology.

  [Signatures: Theological Voluntarists]
  [Signatures: Proponents of the Autonomy of Ethics]
