  We are given a problem from the philosophy of science: the problem of old evidence in Bayesian confirmation theory. The core issue is that if evidence E is already known (so that P(E)=1), then by Bayes' theorem, P(H|E) = P(H), meaning that E cannot confirm H. Yet in scientific practice, old evidence (like the precession of Mercury's perihelion) is used to confirm new theories (like General Relativity). 

  We are to translate the problem and the main proposed solutions into the vocabulary of a Bayesian statistician. The key terms we are to use include: priors, posteriors, likelihoods, Bayes factors, prior/posterior predictive checks, model comparison, etc.

  We will consider the main families of solutions:

  1. Counterfactual approach (e.g., Howson, Garber): The idea is to consider a counterfactual prior in which the evidence E is not known. Then we compute the posterior of H given E in that counterfactual scenario.

  2. Logical-learning approach (e.g., Jeffrey, Wagner): The idea is that learning E is not the issue; rather, we learn a logical or mathematical relation between H and E (e.g., that H entails E). Thus, we update on the logical truth H→E (or on the fact that H entails E) rather than on E itself.

  3. Other approaches? We might also consider the "new hypothesis" approach (where the introduction of a new hypothesis changes the relevance of old evidence) and perhaps the "partial knowledge" approach (where we didn't know the evidence with certainty, but had a high probability).

  We are to express each of these in statistical terms and then provide a residue report.

  Let's break it down.

  ### 1. Counterfactual Approach

  In the counterfactual approach, we imagine a situation in which we do not know E. We then compute the posterior of H given E using a prior that does not condition on E. 

  **Translation to statistical practice:** We replace our actual prior (which has P(E)=1) with a counterfactual prior that does not condition on E. Then we condition on E to get a counterfactual posterior.

  In practice, this might look like:

  - We have a model with parameters (and possibly hyperparameters) and data. The evidence E is part of the data. But in the counterfactual scenario, we pretend we haven't seen E. We then compute the posterior for H (which might be a parameter or a model) given the entire data including E, but with a prior that does not have E baked in.

  However, note that in standard Bayesian updating, we condition on data sequentially. So if E is old, we might think of the prior we had before learning E. But often in hierarchical models, we have a prior that is specified without reference to specific data. So we can compute:

    Counterfactual prior: π(θ)   [without conditioning on E]
    Likelihood for E: p(E | θ)
    Counterfactual posterior: π(θ | E) ∝ p(E | θ) π(θ)

  Then we can see if the posterior probability of H (which is a subset of θ or a model) is increased by E.

  In model comparison, we might compute the Bayes factor for two models using the counterfactual prior and the evidence E:

    BF_{12} = [p(E | M1)] / [p(E | M2)]

  where p(E | Mi) = ∫ p(E | θ_i, Mi) π(θ_i | Mi) dθ_i   [with the counterfactual prior]

  This is the standard way of computing Bayes factors. So in a sense, when we compute a Bayes factor for model comparison, we are already using a counterfactual prior? Not exactly: we are using the prior that we have specified without including E. But if E is old, then our current prior (which has E) is different. However, in practice, when we compute Bayes factors for a new model, we often do it with the entire dataset, including old evidence. The key is that the prior for the new model is specified without conditioning on E.

  So the counterfactual approach in philosophy maps to the standard Bayesian model comparison using the marginal likelihood of the evidence under the model with the prior that does not condition on E.

  ### 2. Logical-Learning Approach

  The idea here is that when we learn a new hypothesis H, we also learn that H entails E (or that H implies E). We then update on the logical truth of H→E (or on the proposition that H entails E) rather than on E itself.

  **Translation to statistical practice:** This is trickier. In standard statistical models, we don't usually update on logical truths about the model. The model is fixed and we condition on data.

  However, we can think of the model as being incomplete until we realize that H entails E. So we might adjust the model to account for this logical relation.

  One way to express this is to note that in the likelihood function, if H entails E, then p(E | H) should be 1. But if we didn't know that H entailed E, we might have assigned p(E | H) < 1. So we are updating the likelihood function.

  Alternatively, we can think of introducing a new model that has a different likelihood. For example, we might have:

    Original model M0: p(E | H, M0) = some value less than 1.
    New model M1: p(E | H, M1) = 1 (because we have learned that H entails E).

  Then we update by comparing M0 and M1? But note that M1 is a degenerate model: it assigns probability 1 to E if H is true. We might then compute the posterior for H in M1.

  But note: the evidence E is already known. So in M1, if H is true, then E is certain. But we also have to consider the probability of E under the alternative hypothesis (not H). 

  Alternatively, we can update the likelihood for H without changing the model? This doesn't fit neatly.

  Another idea: we can condition on the proposition L: "H entails E". Then we update our prior for H by conditioning on L. But note that L is a logical truth, so it should have probability 1. But if we didn't know it, then we might have had P(L) < 1. So we are updating on L.

  In Bayesian terms, we might have:

    Prior: P(H), P(L) [with P(L) < 1], and we assume that H and L are not independent? Actually, if H is true, then L must be true? So we might have:

    P(L | H) = 1, and P(L | not H) = q (some value).

  Then by Bayes theorem:

    P(H | L) = P(L | H) P(H) / P(L) = 1 * P(H) / P(L) = P(H) / P(L)

  Since P(L) < 1, P(H | L) > P(H). So learning L (that H entails E) increases the probability of H.

  But note: we also know E. So we must condition on both E and L? This becomes complex.

  Alternatively, we can note that conditioning on L (that H entails E) and on E, then if H were false, E would not be entailed by H? But that might not be true because E might be true for other reasons.

  A better way: once we know L (H entails E), then the probability of E given H is 1, so:

    P(H | E, L) = P(E | H, L) P(H | L) / P(E | L) = 1 * P(H | L) / P(E | L)

  But note that P(E | L) = P(E | H, L) P(H | L) + P(E | not H, L) P(not H | L) 
                     = 1 * P(H | L) + P(E | not H, L) * (1 - P(H | L))

  We know E, so P(E | not H, L) is the probability of E given not H and that H entails E. This is tricky because if not H, then the entailment L doesn't help. We must have a model for how E might occur even if not H.

  But note: in the logical-learning approach, the key is that we are updating on the logical relation, not on E. However, we already know E. So we might consider:

    We have two pieces of information: E and L (the fact that H entails E). We update our belief in H on both.

  So:

    P(H | E, L) = [P(E | H, L) P(H | L)] / P(E | L) 
                 = [1 * P(H | L)] / P(E | L)

  But we also have:

    P(H | L) = P(H) / P(L)   [as above, because P(L|H)=1 and P(L)=P(L|H)P(H)+P(L| not H)P(not H), but note we don't know P(L| not H)]

  Actually, we need a full model for L and H. This approach requires that we model the probability of the logical truth L. This is problematic because logical truths are usually assigned probability 1. But if we did not know L, we might assign it a probability less than 1.

  In statistical practice, we don't usually assign probabilities to logical truths. So this approach requires a non-standard extension of the Bayesian framework to include uncertainty about logical and mathematical truths.

  ### 3. Other Approaches

  #### a. New Hypothesis Approach

  Sometimes the old evidence is used to confirm a new hypothesis that was not previously considered. In this case, we are comparing a new model (that includes H) to old models. The old evidence E is then used to compute the marginal likelihood of the new model.

  This is straightforward: we are doing model comparison. We compute the Bayes factor for the new model against the old model using the evidence E. Since the new model might predict E better, we get confirmation.

  This is similar to the counterfactual approach, but note: we are not counterfactually removing E from the prior. Instead, we are introducing a new model and then evaluating the evidence E under that model. The prior for the new model does not condition on E. So in effect, we are using the counterfactual prior for the new model.

  This is standard statistical practice.

  #### b. Partial Knowledge Approach

  The idea is that we did not know E with certainty. We might have had a high probability for E, but not 1. Then we update on E (which we now know with certainty) and get a small boost for H.

  In statistical terms: our prior for E is not 1. So we have P(E) < 1. Then we update:

    P(H | E) = P(E | H) P(H) / P(E)

  If P(E | H) is larger than P(E), then H is confirmed.

  This is the standard updating. However, for old evidence, we might have learned E long ago and set P(E)=1. But perhaps we can remember the time when we did not know E. Then we can compute the boost that E would have given at that time.

  But note: the problem arises because at the current time, P(E)=1. The partial knowledge approach says: at the time when we first learned E, we updated on it. Now we have a new hypothesis. How do we account for the fact that E supports H? We can do so by recalling our state of knowledge before we learned E.

  This is essentially the counterfactual approach again.

  ### Residue Report

  We now assess which parts of the debate map cleanly to statistical practice, which are forced, and which are missing.

  #### Clean Mappings

  1. **Counterfactual Approach**: This maps very cleanly to standard Bayesian model comparison and inference. When we introduce a new model (or hypothesis), we compute its marginal likelihood for the old evidence using a prior that does not condition on that evidence. This is exactly how Bayes factors are computed. Similarly, for parameter estimation in a new model, we condition on old evidence with a prior that is specified without that evidence. So the counterfactual prior is just the prior we would have used if we hadn't seen E. This is standard.

  2. **New Hypothesis Approach**: This is the same as above. It is standard practice to evaluate new models on existing data. We do this all the time in cross-validation, prior predictive checks, and model comparison.

  #### Forced or Distorted Mappings

  1. **Logical-Learning Approach**: This approach requires us to assign probabilities to logical and mathematical truths. In standard statistical practice, we do not do this. We assume that the model (including the likelihood) is known and fixed. The idea of updating the model because we have learned a logical relation between H and E is not part of standard Bayesian statistics. 

     We might try to force it by introducing a new model that has a different likelihood (one that sets p(E|H)=1) and then comparing it to the old model. But then we are back to model comparison. Alternatively, we might try to update within the same model by changing the likelihood function. But that is not standard: the likelihood is part of the model specification.

     This approach feels forced in statistical practice because we don't usually treat the model itself as uncertain in this way. We might have model uncertainty, but that is typically handled by model comparison, not by updating the likelihood function for a fixed model.

     Moreover, the idea of having a prior probability for a logical truth (like "H entails E") is alien to statistical practice. We take the model (and hence the logical implications) as given.

  #### Missing Moves?

  The main move that does not map well is the logical-learning approach. But is this because our framework is missing something? Or is the philosophical problem less substantive?

  In statistical practice, we don't have a problem with old evidence because we are always free to evaluate a new model on old data. The key is that the model is new, so we haven't conditioned on the evidence in the prior for that model. Therefore, the old evidence can confirm the new model.

  So the problem of old evidence does not arise in the same way for a statistician because we are constantly building new models and testing them on existing data. The counterfactual approach is built into our workflow.

  However, there is a potential issue: when we have a very large amount of old evidence, and we want to test a model that is built with knowledge of that evidence, we might overfit. This is addressed by methods like cross-validation and prior predictive checks. But note: prior predictive checks require that we specify a prior and then generate data without conditioning on the old evidence. So again, we are using a counterfactual prior.

  ### Conclusion

  The problem of old evidence, when translated into statistical practice, largely dissolves. The counterfactual approach is standard: we use the prior that does not condition on the old evidence when evaluating a new model or hypothesis. The new hypothesis approach is the same. 

  The logical-learning approach, while interesting, does not map neatly onto standard Bayesian statistical practice. It requires an extension of the framework to include uncertainty about logical relations. This extension is not part of the working statistician's toolkit, and it is unclear whether it is necessary.

  Therefore, the difficulty does not survive translation: it dissolves because in the actual practice of Bayesian statistics, we are always able to evaluate old evidence in light of new models by computing the marginal likelihood (or Bayes factor) with a prior that is appropriate for the model (i.e., not conditioning on the evidence). Thus, the problem of old evidence is not a problem for the working statistician.

  However, note: if we are forced to work within a single fixed model that has already conditioned on the old evidence, then we cannot use that same evidence again to confirm a hypothesis within that model. But in practice, when a new hypothesis comes along, we often introduce a new model that can be tested against the old evidence without having conditioned on it.

  So the residue is that the logical-learning approach remains a philosophical curiosity without a clear counterpart in statistical practice. But the other approaches are well covered.
answer: |-
  ### Restatement of the Problem in Statistical Vocabulary  
  The problem of old evidence arises when evidence \(E\) is already known, so the current prior assigns \(P(E) = 1\). By Bayes' theorem, for hypothesis \(H\), the posterior \(P(H \mid E)\) equals the prior \(P(H)\), implying \(E\) cannot confirm \(H\). However, in scientific practice (e.g., Mercury's perihelion supporting GR), old evidence *does* confirm new hypotheses. This creates tension:  
  - **Statistical translation**: If \(E\) is in the conditioning set of the prior, the likelihood \(p(E \mid H)\) does not update the posterior for \(H\) (since \(E\) is fixed). Model comparison metrics (e.g., Bayes factors) computed *after* \(E\) is known cannot use \(E\) to favor \(H\) over alternatives, as \(p(E \mid M)\) is identical for all models \(M\) when \(P(E) = 1\).  

  ---

  ### Major Solutions Translated to Statistical Practice  
  #### **1. Counterfactual Approach (e.g., Howson, Garber)**  
  **Core idea**: Assess confirmation by comparing the actual posterior to a *counterfactual prior* that does not know \(E\).  
  **Statistical translation**:  
  - Replace the actual prior \(\pi(\theta \mid E)\) with a counterfactual prior \(\pi_{\text{cf}}(\theta)\) where \(E\) is *not* conditioned upon.  
  - Compute the counterfactual posterior:  
    \[
    \pi_{\text{cf}}(\theta \mid E) \propto p(E \mid \theta) \cdot \pi_{\text{cf}}(\theta).
    \]  
  - Confirmation occurs if \(\pi_{\text{cf}}(H \mid E) > \pi_{\text{cf}}(H)\).  
  - **Model comparison**: Compute the Bayes factor for \(H\) vs. an alternative \(H'\) using the counterfactual prior:  
    \[
    \text{BF}_{HH'} = \frac{\int p(E \mid \theta_H, H) \pi_{\text{cf}}(\theta_H)  d\theta_H}{\int p(E \mid \theta_{H'}, H') \pi_{\text{cf}}(\theta_{H'})  d\theta_{H'}}.
    \]  
    This is identical to standard Bayes factor calculation when introducing a new model to existing data.  

  #### **2. Logical-Learning Approach (e.g., Jeffrey, Glymour)**  
  **Core idea**: Old evidence confirms by revealing a *logical connection* (e.g., \(H \vdash E\)) rather than \(E\) itself.  
  **Statistical translation**:  
  - **Not conditioning on \(E\)**: Instead, condition on the proposition \(L\): "\(H\) entails \(E\)" (or \(H \rightarrow E\)).  
  - Update beliefs using the likelihood of \(L\), not \(E\):  
    \[
    P(H \mid L) \propto P(L \mid H) \cdot \pi(H).
    \]  
    If \(H \vdash E\), then \(P(L \mid H) = 1\), but \(P(L \mid H') < 1\) for alternatives \(H'\) not entailing \(E\).  
  - **Practical implementation**:  
    - Introduce a binary latent variable \(L\) with \(P(L = 1 \mid H) = \mathbb{1}_{[H \vdash E]}\).  
    - Compute posterior \(P(H \mid L=1)\) (not \(P(H \mid E)\)).  
    - **Example**: In a model-comparison setting, \(H\) and \(H'\) now include probabilistic predictions of \(L\), and \(E\) is replaced by \(L=1\).  

  #### **3. New Hypothesis Approach (e.g., Zellner)**  
  **Core idea**: Old evidence confirms a *newly proposed* hypothesis \(H_{\text{new}}\) not considered when \(E\) was first observed.  
  **Statistical translation**:  
  - **Model expansion**: Embed \(H_{\text{new}}\) in a larger model space. Compute its marginal likelihood for \(E\):  
    \[
    p(E \mid H_{\text{new}}) = \int p(E \mid \theta_{\text{new}}, H_{\text{new}}) \pi(\theta_{\text{new}})  d\theta_{\text{new}},  
    \]  
    using a prior \(\pi(\theta_{\text{new}})\) that does not condition on \(E\).  
  - Compare to existing models via Bayes factors (BF). If \(\text{BF}_{H_{\text{new}}, H_{\text{old}}} > 1\), \(E\) confirms \(H_{\text{new}}\).  
  - **Posterior predictive checks (PPC)**: If \(H_{\text{new}}\) was constructed *using* \(E\), simulate new data \(E'\) from the posterior predictive of \(H_{\text{new}}\) and check consistency with \(E\) (addressing circularity).  

  #### **4. Partial Knowledge Approach (e.g., Jeffrey)**  
  **Core idea**: Even "known" evidence has residual uncertainty (e.g., measurement error).  
  **Statistical translation**:  
  - Treat \(E\) as uncertain: Replace \(P(E) = 1\) with a prior \(\pi(E)\) reflecting imperfect knowledge.  
  - Update using the likelihood:  
    \[
    \pi(H \mid E) \propto p(E \mid H) \cdot \pi(H).  
    \]  
  - **Implementation**: Use a hierarchical model where \(E\) is observed with error, and the true value \(E^*\) is inferred. Then \(p(E^* \mid H)\) can confirm \(H\).  

  ---

  ### Residue Report  
  #### **Clean Mappings to Statistical Practice**  
  - **Counterfactual priors and Bayes factors**: Directly align with standard model comparison. When statisticians test a new model on existing data, they implicitly use a counterfactual prior (no conditioning on that data).  
  - **New hypothesis approach**: Matches how Bayes factors are used to evaluate novel models against old data (e.g., in grant proposals or publications).  
  - **Partial knowledge**: Fits naturally into hierarchical models with measurement error (e.g., \(E\) as a noisy observation).  
  - **PPC for model criticism**: Addresses concerns that \(H_{\text{new}}\) overfits \(E\) by simulating new data.  

  #### **Forced or Distorted Mappings**  
  - **Logical-learning approach**:  
    - **Forced**: Requires conditioning on a proposition \(L\) about logical entailment, which is not part of standard Bayesian inference. Statisticians specify \(p(E \mid \theta)\) *deterministically*; "learning \(H \vdash E\)" is not a data-updating step.  
    - **Distortion**: In practice, discovering \(H \vdash E\) leads to model specification (setting \(p(E \mid H) = 1\)), not updating within a fixed model. This blurs the line between model building and inference.  
  - **Counterfactual approach**:  
    - **Forced**: Choosing \(\pi_{\text{cf}}\) involves subjective "what if I didn't know \(E\)" reasoning, which lacks formal guidance. Statisticians often avoid this by pre-registering priors.  

  #### **Gaps: Philosophical Moves with No Statistical Counterpart**  
  - **Logical entailment as evidence**: The idea that learning "\(H \vdash E\)" (not \(E\)) confirms \(H\) has no direct analog. Statisticians don't assign probabilities to logical propositions (e.g., \(P(L)\)). This is **not a failure of statistics**—it reflects a disconnect: philosophers treat logic as dynamic; statisticians treat models as static.  
  - **Non-counterfactual solutions**: Proposals like "de-idealizing" probability (allowing \(P(E) < 1\) even for known evidence) are rejected in statistics. Probability is epistemic; if \(E\) is known, \(P(E) = 1\) is non-negotiable.  

  #### **Does the Problem Dissolve in Practice?**  
  **Yes, for three reasons**:  
  1. **Model comparison dominates**: Statisticians use old evidence to test *new models* with priors not conditioned on \(E\). This is the counterfactual approach—standard and uncontroversial.  
  2. **Predictive workflows**: Prior/posterior predictive checks separate model building (using \(E\)) from validation (testing on new or held-out data).  
  3. **No need for exotic fixes**: Logical-learning adds no practical value beyond counterfactual BF. Hierarchical models handle partial knowledge without revising probability axioms.  

  **Conclusion**: The problem dissolves when viewed through a statistician's lens. The core issue—updating on known evidence—is circumvented by standard workflows: new models are evaluated on old data using counterfactual priors, and predictive checks guard against overfitting. Philosophical nuances (e.g., logical entailment) do not map to essential tools, suggesting they reflect metaphysical concerns, not statistical limitations.
