prompt: |-
  I've become convinced by expressivism about moral language: the view that when someone says "lying is wrong," they aren't reporting a fact but are expressing a non-cognitive attitude — something like disapproval or endorsement. I understand that the Frege–Geach problem is the central challenge: moral sentences embed in conditionals, negations, and other complex constructions where they don't seem to express the attitudes expressivism says they do, yet the complex sentences are still meaningful and can figure in valid reasoning. I want to know what would count against expressivism as a research program — not just a list of objections, but a map of what would have to be shown or discovered for the view to be false or abandoned. I'm looking for the defeaters organized by how damaging they are, from fatal to merely awkward; which of them a committed expressivist would honestly concede as genuine counterevidence, as opposed to dismissing as question-begging or as problems for everyone; whether the view has been qualified over time in ways that make it harder to falsify, and if so, whether that is a problem for a theory of this kind; and what expressivism predicts that its rivals don't, and vice versa — the places where the views actually make contact with evidence rather than just talking past each other. I'm a software engineer and I think about compositionality in terms of how expressions systematically combine to yield the meaning of larger expressions. I'd like the analysis to take that perspective seriously rather than treating it as a loose analogy.
reasoning: |-
  Okay, the user is diving deep into expressivism in moral language, specifically concerned with the Frege-Geach problem and what could falsify expressivism. They’re a software engineer, so they value compositionality—how smaller parts combine systematically into larger meanings. They want a structured analysis of defeaters, ranked by severity, and how expressivists might respond.  

  First, I need to unpack their request. They’re not just asking for objections; they want a falsification roadmap. That means organizing counterevidence by how damaging it is, from fatal to awkward. They also want to know if expressivism has been modified to avoid falsification and if that’s a problem. Plus, they care about empirical predictions where expressivism and its rivals (like realism or hybrid theories) clash.  

  The user’s background in software engineering is key. They’ll appreciate precise, compositional thinking—like how moral sentences function in logical structures (conditionals, negations) akin to code modules. I should avoid vague analogies and instead treat moral language like a formal system.  

  Core challenges:  
  - **Frege-Geach**: Expressivism must explain how non-cognitive attitudes (e.g., disapproval) compose in complex sentences. If "lying is wrong" expresses disapproval, what does "if lying is wrong, then getting your friend to lie is wrong" express? It doesn’t make sense to disapprove of a conditional.  
  - **Falsification criteria**: What evidence would make expressivists abandon ship? For example, if neuroscience showed moral judgments activate *only* fact-tracking brain regions (not attitude-expressing ones), that’d be a heavy blow.  
  - **Moving goalposts**: Expressivists like Blackburn and Gibbard refined the theory (quasi-realism, norm-expressivism) to handle compositionality. But if every fix makes the theory more convoluted and less testable, that’s a problem—it risks becoming unfalsifiable.  
  - **Predictive differences**: Where do expressivism and realism empirically clash? Example: Expressivism predicts moral disagreements feel like clashing attitudes, not factual errors. If studies showed people treat moral truths as objective as math, that’d contradict expressivism.  

  Now, structuring the response:  
  1. **Fatal flaws**: Evidence proving moral judgments *always* track mind-independent facts (e.g., via neuroscience or linguistics). Or if expressivist compositional rules become incoherent under pressure.  
  2. **Major challenges**: Failure to explain logical validity without borrowing realist machinery. If moral reasoning *requires* truth-conditional semantics, expressivism might collapse.  
  3. **Awkward gaps**: Poor handling of moral epistemology (how we refine attitudes) or cross-cultural objectivity.  

  For the software angle:  
  - Compare moral compositionality to function composition in programming. If expressivism can’t define a "disapproval" function that composes logically (e.g., `NOT(disapprove(lying))` meaning permission), it fails. Quasi-realism tries to fake truth-conditions—like a wrapper function that mimics logical operators but might be a hack.  

  Finally, the user wants honesty about what expressivists would concede. Most would dismiss "But morality feels objective!" as question-begging, but neural evidence of fact-tracking could unsettle them. And if rivals (e.g., contextualism) explain the data more cleanly, expressivism loses traction.
answer: |-
  Here's a systematic analysis of defeaters for expressivism, organized by severity, incorporating your software engineering/compositionality lens and addressing your specific queries. Think of this as a "falsification test suite" for the expressivist research program.

  **Core Metaphor: The Compositionality Engine**
  Expressivism posits a specific type of "semantic compiler":
  *   **Input:** Atomic moral sentences (e.g., `"Lying is wrong"`).
  *   **Output (Expressivist Compiler):** Non-cognitive mental state expressions (e.g., `BOO(lying)`).
  *   **Challenge:** This compiler must handle complex expressions (conditionals `IF(P, Q)`, negations `NOT(P)`, disjunctions `OR(P, Q)`, embeddings `BELIEVE(Alice, P)`) where `P`/`Q` are moral sentences. The output (`BOO`, `HURRAY`) must compose systematically so the complex expression has a coherent, non-truth-conditional meaning *and* validates logical inferences (e.g., modus ponens: `IF(P, Q)` + `P` → `Q`).

  **Defeaters: From Fatal Flaws to Awkward Glitches**

  1.  **Fatal Flaws (Compiler Catastrophe - Breaks Compositionality/Logic):**
      *   **The Uncomposable Attitude (Frege-Geach++):** Discovery that *no* plausible, non-truth-conditional mental state (`BOO`, `HURRAY`, `PLAN`, `COMMIT`) can be defined such that its compositional rules for logical operators (`NOT`, `IF`, `AND`, `OR`) simultaneously:
          *   Preserve the intuitive *meaning* of complex moral sentences (e.g., `IF(BOO(lying), BOO(getting_friend_to_lie))` meaning a commitment conditional, not disapproval of lying or of getting-friend-to-lie).
          *   Validate *all* core logical inferences involving moral vocabulary (modus ponens, negation elimination, disjunctive syllogism) *without* implicitly relying on truth-conditional semantics.
          *   **Why Fatal?** If expressivism *cannot* generate a coherent, logically valid "meaning" for embedded moral sentences under a non-cognitive semantics, it fundamentally fails as a theory of moral *language*. It's like proving no function `f` exists that maps `BOO(x)` inputs to `f(BOO(x))` outputs satisfying the logical constraints for `NOT`, `IF`, etc.
      *   **Neural Semantics Mismatch:** Strong, replicated neuroscience/cognitive science evidence showing that processing *atomic* moral judgments (e.g., "Lying is wrong") activates *exclusively* the same core neural substrates and cognitive processes as paradigmatic *fact-reporting* statements (e.g., "Grass is green") and *fundamentally different* processes from paradigmatic *expression* statements (e.g., "Ouch!" or "Yuck!"), *and* that processing *embedded* moral sentences activates compositional semantic networks indistinguishable from factual discourse.
          *   **Why Fatal?** Expressivism makes a core claim about the mental state expressed. If the brain treats "Lying is wrong" like "Grass is green" at both atomic and compositional levels, the expressivist compiler is running the wrong program. A committed expressivist would struggle to dismiss this without special pleading.
      *   **The Universal Truth-Aptness Intuition:** Discovery that competent speakers *universally* (cross-linguistically, cross-culturally) treat simple moral claims *solely* as truth-apt assertions in all linguistic contexts (including metalinguistic reflection like "What she said was true"), with no significant variation or evidence of a distinct expressive force, *despite* variation in specific moral norms.
          *   **Why Fatal?** Expressivism predicts moral language functions differently *at its core*. If this core functional difference is empirically absent, the theory is incorrect about language use. (Note: Expressivists like Blackburn *do* try to explain truth-talk quasi-realistically, but if the intuition is bedrock and universal, it becomes a heavy burden).

  2.  **Major Challenges (Compiler Runs, But Output is Garbled or Inefficient):**
      *   **The Logic Hack:** Demonstrating that successful expressivist solutions (e.g., Gibbard's plan-laden worlds, Blackburn's quasi-realism) achieve logical validity *only* by implementing a full truth-conditional semantics "under the hood," mapping attitudes onto abstract "truth-like" properties or possible worlds, purely to satisfy logic. The non-cognitive element becomes epiphenomenal to the compositional machinery.
          *   **Why Major?** It suggests expressivism solves the compositionality problem by *becoming* a type of realism/cognitivism for logical purposes, undermining its core motivation. A committed expressivist might argue the "hack" is necessary and the non-cognitive core remains, but it weakens the position significantly. It's like your compiler outputs an intermediate representation indistinguishable from a truth-conditional one before final "expression" – is it really expressivist anymore?
      *   **Indispensable Truth in Reasoning:** Proof that robust moral deliberation and disagreement *necessarily* require treating moral claims *as* truth-apt propositions within the reasoning process itself (not just as a useful fiction). For example, if modeling another agent's moral reasoning *requires* assigning truth values to their moral beliefs to predict their inferences.
          *   **Why Major?** Expressivism aims to explain reasoning without truth. If truth is indispensable *within* the reasoning engine, not just in reporting outputs, expressivism fails to capture the phenomenology and practice of moral thought. The compiler *requires* truth-conditional intermediate steps.
      *   **The Attitude Mismatch Problem:** Clear evidence that the specific attitudes expressivists propose (disapproval, planning states, commitments) *do not* align with the psychology of moral judgment. E.g., people confidently judge moral claims while reporting no felt disapproval/endorsement; moral judgments guide behavior in ways unlike other expressions; or moral "disagreement" feels fundamentally different from clashing preferences.
          *   **Why Major?** While expressivism might adapt its core attitude, repeated mismatches suggest it's fundamentally misidentifying the mental state. If `BOO(x)` doesn't resemble the actual psychological output for `"x is wrong"`, the compiler specification is wrong. A committed expressivist would need to concede significant counterevidence here.

  3.  **Awkward Problems (Compiler Works, But With Glitches/Ugly Code):**
      *   **Moral Perception/Discovery:** Difficulty explaining phenomenology where moral truths feel *discovered* (e.g., in complex dilemmas) rather than merely *expressed*. Expressivism struggles with "moral learning" or "moral error" beyond consistency with existing attitudes.
          *   **Why Awkward?** It forces expressivists into contortions (e.g., "refining plans under consistency constraints") that feel less natural than a realist "discovering facts" story. It's a usability/UX problem for the theory, not a core crash.
      *   **Thin Moral Concepts:** Explaining the meaning and function of very abstract moral terms ("good," "right," "ought") purely expressively is notoriously difficult, often feeling vacuous or circular compared to accounts invoking reasons or natural properties.
          *   **Why Awkward?** It highlights potential limitations in the expressive resources or suggests the compiler handles complex types poorly. It doesn't break, but the output is unsatisfying.
      *   **Degree and Vagueness:** Expressivism has a harder time than descriptivist theories accounting for the *degree* of wrongness/goodness or the *vagueness* of moral terms. How does `BOO` come in intensities that compose systematically?
          *   **Why Awkward?** It points to potential gaps in the expressive/compositional framework. Like a compiler lacking good support for floating-point numbers.
      *   **Cross-Domain Composition:** Problems explaining how moral and non-moral vocabulary compose seamlessly (e.g., "Lying to save a life is sometimes courageous but still wrong"). Does `BOO(lying)` compose with descriptive `courageous(lying_to_save_life)`? How?
          *   **Why Awkward?** Shows potential limitations in the scope of the expressivist compiler when interfacing with other "semantic modules." Requires ad-hoc bridging principles.

  **Expressivist Responses & Theory Evolution:**
  *   **Concessions:** Committed expressivists would likely concede **Attitude Mismatch** findings as genuine counterevidence requiring theory adjustment (e.g., switching from simple `BOO` to Gibbard's complex `PLAN` states). They would concede **Moral Perception/Awkward Problems** as genuine difficulties needing work.
  *   **Dismissals (as Question-Begging/Shared Problems):** They would dismiss demands to explain moral language *as if it were descriptive* from the outset. They argue **Universal Truth-Aptness** ignores the *function* of language. They see **Logic Hack** accusations as misunderstanding their project – building a logic for attitudes *is* the point, and if it resembles truth-conditions, it's a success, not a failure. **Indispensable Truth** claims are seen as assuming realism.
  *   **Evolution & Falsifiability:** Expressivism *has* evolved dramatically (Simple Emotivism → Blackburn's Quasi-Realism → Gibbard's Norm-Expressivism → Schroeder's Being For) primarily to solve compositionality (Frege-Geach). This *does* make it harder to falsify, as the core claim ("moral language is expressive") gets embedded in increasingly complex and flexible frameworks. This is a common problem in philosophy – the core idea becomes insulated by auxiliary hypotheses. However, the **Fatal Flaws** above target the *necessity* of these auxiliary hypotheses or their failure to deliver genuine compositionality without collapse. A theory becoming more complex to handle data isn't inherently bad, but if it loses parsimony, predictive power, or its original motivation (e.g., the **Logic Hack** concern), it becomes less viable.

  **Predictive Differences (Where Theories Collide with Evidence):**
  Expressivism and its main rival (Robust Moral Realism/Cognitivism) make different predictions in key testable domains:

  1.  **Psychology of Judgment:**
      *   **Expressivism Predicts:** Neural/cognitive processing of atomic moral judgments should resemble processing of other expressive speech acts (commands, exclamations) or preference expressions more than factual assertions. Moral disagreement should feel like/involve clashing attitudes/plans, not like conflicting factual beliefs.
      *   **Realism Predicts:** Processing should resemble factual assertion processing. Disagreement should feel like/involve conflicting beliefs about objective properties.
      *   **Evidence Contact:** Neuroscience (fMRI, EEG), reaction time studies, phenomenology surveys, behavioral studies of disagreement resolution strategies.

  2.  **Linguistic Behavior:**
      *   **Expressivism Predicts:** Patterns of use/embedding *might* show subtle differences from paradigmatic factual discourse (e.g., in presupposition failure, scope ambiguities, metalinguistic negation). Reluctance to attribute moral truth to radically different frameworks *might* be higher than factual truth.
      *   **Realism Predicts:** Moral discourse patterns should be indistinguishable from factual discourse patterns regarding embedding, truth attribution, etc.
      *   **Evidence Contact:** Corpus linguistics, experimental semantics (testing speaker intuitions on embeddings, truth ascriptions, presuppositions), cross-cultural studies of truth attribution.

  3.  **Moral Motivation (Internalism):**
      *   **Expressivism Predicts:** A strong connection between sincere moral judgment (`BOO(x)`) and motivation to act accordingly (perhaps constitutive). Amoralism (sincere judgment + no motivation) should be rare/paradoxical.
      *   **Realism Predicts:** Motivation is contingent (externalism is possible). Amoralism is conceptually coherent and potentially observable.
      *   **Evidence Contact:** Psychological studies on psychopaths, "burnout," akrasia, and cross-cultural motivational differences tied to moral belief. (Note: Both sides can qualify their positions, making this less decisive).

  4.  **Moral Progress/Error:**
      *   **Expressivism Predicts:** Progress is improved consistency, coherence, or sensitivity to relevant non-moral facts within an attitude framework. Error is inconsistency, ignorance of facts, or irrationality.
      *   **Realism Predicts:** Progress is better approximation of mind-independent moral truths. Error is failing to track these truths.
      *   **Evidence Contact:** Historical/sociological analysis of moral change – does it look more like refining plans under pressure (expressivism) or discovering facts (realism)? Are there plausible convergence mechanisms for realism?

  **Conclusion: The Viability Test**
  Expressivism is falsifiable *in principle* through failures of its core compositional engine under logical or empirical pressure (**Fatal/Major Flaws**). Its evolution reflects attempts to pass the compositionality unit test (Frege-Geach). While auxiliary hypotheses shield the core, they risk turning it into a cognitivist theory in disguise (**Logic Hack**) or making it inelegant (**Awkward Problems**). The research program survives if it can:
  1.  Provide a compositional semantics for attitudes (`BOO`, `PLAN`) that is both logically robust and psychologically plausible.
  2.  Explain the phenomenology of objectivity, discovery, and truth-talk without collapsing into realism.
  3.  Make unique, testable predictions (especially in psychology/linguistics) that hold up better than rival theories.

  Its fate hinges on whether the "attitude compiler" can genuinely process the complex syntax of moral language and produce valid reasoning outputs, or whether the system logs fatal errors demanding a rewrite using a truth-conditional architecture.
