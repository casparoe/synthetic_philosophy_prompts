prompt: |-
  I've been working through an argument that seems to prove that if you accept moral luck in even one domain, you're committed to the view that no one ever deserves blame for anything. I don't believe the conclusion, but I can't locate the mistake.

  (1) Two drivers, A and B, both drive home equally drunk. A hits and kills a child who runs into the road; B makes it home without incident. The only difference between them is luck.

  (2) If the only difference between two cases is luck, then A and B are equally deserving of moral blame. Call this the Luck-Neutrality Principle (LNP).

  (3) So A does not deserve more blame than B.

  (4) Now consider two people, C and D, with identical genetic predispositions. C grows up in a loving, stable home; D grows up in an abusive, chaotic one. D develops a violent temper; C does not. The only difference in their formative circumstances is luck.

  (5) If LNP applies to circumstantial luck as it does to resultant luck, then C and D are equally deserving of blame for the characters they develop. Since C did nothing blameworthy, D does not deserve blame for his character either.

  (6) Now consider a violent act D commits. It flows from his violent character, for which (by (5)) he does not deserve blame. But if someone does not deserve blame for the character that produced an action, can they deserve blame for the action itself? The action is just the character expressing itself in circumstances D did not choose.

  (7) So D does not deserve blame for his action.

  (8) But every action anyone performs flows from their character in circumstances they did not choose, and every character is shaped by factors ultimately outside the person's control.

  (9) Therefore, no one ever deserves blame for anything.

  (10) But some people do deserve blame. If you deny this, you must abandon resentment, indignation, gratitude, and the entire fabric of interpersonal moral life — which seems impossible.

  So LNP, which seemed modest when applied to resultant luck in premise (2), turns out to be a universal solvent. Where does the argument go wrong? I can see a few possible exits — restrict LNP so it doesn't apply across different kinds of luck, deny the move from character-blame to action-blame in (6), or bite the bullet on (10) and try to reconstruct moral life on purely forward-looking grounds — but each seems to cost more than I want to pay.

  Lead with your bottom line: which step you reject, stated in the first sentence, and then give your reasoning. No preamble, no restating the question.
reasoning: |-
  Okay, let me tackle this moral luck problem. The user presents a logical argument that seems to prove moral responsibility is impossible if we accept any form of moral luck. They want to know which step is flawed and why. 

  First, I need to map the core structure: Premise (2) establishes the Luck-Neutrality Principle (LNP), which claims luck shouldn't affect blameworthiness. This leads to step (5) applying LNP to circumstantial luck in character formation, concluding D isn't blameworthy for his violent character. Step (6) then extends this to actions flowing from that character. Step (8) universalizes this to all actions. The conclusion (9) denies all moral responsibility, which clashes with our intuitions in (10).

  Hmm... the user already suspects potential escape routes but finds them costly. Restricting LNP feels ad hoc, denying the character-to-action link seems counterintuitive, and accepting the conclusion requires overhauling moral practices. 

  I think the critical flaw is in step (6). The user might be missing that "character" isn't a monolithic entity but a dynamic set of dispositions shaped by ongoing choices. Even if initial character formation involves luck (step 5), what matters for blame is whether D *reinforces* that character through subsequent choices. 

  For example, when D commits violence, we're not blaming him for his abusive childhood (which was luck), but for failing to resist his temper *despite knowing it's wrong*. This preserves LNP in steps (2)-(5) while blocking the universal solvent. The drunk drivers (A/B) remain equally blameworthy for reckless decisions regardless of outcomes, but D's blameworthiness hinges on his present agency over his dispositions. 

  This avoids biting bullets on moral responsibility (step 10) without arbitrary restrictions on LNP. It also explains why we intuitively hold D accountable: we're responding to his choices *within* his circumstances, not the circumstances themselves. 

  *checks consistency* Does this undermine resultant luck examples? No—A and B both chose to drive drunk; the child's presence was pure luck. But for D, the violence isn't luck; it's a choice he made despite alternatives (e.g., seeking help). The key is distinguishing between luck in *formation* vs. *exercise* of agency. 

  User seems philosophically sophisticated—they recognize the stakes (interpersonal moral life) and want a principled solution. My response should precisely target step (6) while honoring their discomfort with "costly" exits. No need to rehash their setup; dive straight into the rebuttal.
answer: |-
  I reject step (6), as it equivocates between character formation and action.

  While D may not deserve blame for the *formation* of his violent character (due to constitutive/circumstantial luck), he can still deserve blame for *specific actions* flowing from that character. Blameworthiness attaches to the exercise of agency in the moment, not solely to the origins of dispositions. When D commits a violent act, we blame him for *choosing* to act violently *despite knowing alternatives exist*, not merely for possessing a violent character. This choice reflects a failure of practical reasoning or volitional control that D, as a moral agent, retains *even with* his disadvantaged character. The action is not "just the character expressing itself" passively; it involves D’s active engagement with reasons and circumstances at the time of action. Thus, premise (6) falsely assumes that if the character’s origin is blameless, the action must be blameless, ignoring the agent’s real-time responsibility for how they deploy their character in concrete decisions. This preserves LNP for resultant luck (steps 1-3) and acknowledges constitutive luck (steps 4-5) without collapsing all blame (steps 8-9).
