  I've been going back and forth with my advisor about Henry Sidgwick, and we keep ending up with different numbers but no shared picture of what's behind them. I'm writing a paper on whether his long involvement with the Society for Psychical Research was a weird Victorian blindspot or a defensible extension of his actual philosophical commitments. My credence that a careful, intellectually honest person in Sidgwick's position — same evidence, same standards, same ethical framework — would have been epistemically rational to take the SPR's reported findings seriously enough to keep investigating, rather than dismissing them as fraud or wishful thinking, is about 0.6; my advisor is at 0.2. I want your number, but more than that I want the decomposition. How much of the question is really about whether late-Victorian investigation methods (seances, testimony, correspondence, controls that look weak to us now) were respectable by the best standards available then, how much about whether the residual phenomena actually resisted normal explanation given what was known, how much about whether Sidgwick's utilitarian project gave him a non-epistemic stake in survival or some cosmic moral order that biased him, and how much about whether it's even meaningful to ask whether a historical figure was rational by our lights versus theirs. Assign each sub-question a rough probability, show how they combine into your overall number, and tell me which one you're least confident in and what historical evidence would move it most. Also tell me where the 0.6 and 0.2 disagreement most likely lives.
