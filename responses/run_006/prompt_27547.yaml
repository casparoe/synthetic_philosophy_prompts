prompt: |-
  I write about biology and the philosophy of science for a general-interest magazine, and I am preparing a feature on why the species count keeps shifting — why a single population of birds or orchids gets split into three species and then re-lumped, and why two competent systematists can disagree about where one species ends and another begins without either having made a factual error. Before I present the rival species concepts to my readers, I want the specification first: what would any adequate account of what a species is have to deliver in order to count as adequate at all, where the point of the account is to let an intelligent nonspecialist understand what taxonomists are doing and why their classifications change.

  Produce the desiderata list. It should include the cases an adequate account must handle honestly — asexual and parthenogenetic lineages, ring species, hybrid zones and introgression, fossil chronospecies for which only morphology survives, bacteria and archaea with horizontal gene transfer, and populations too poorly studied for breeding or genomic data — and the phenomena it must explain rather than explain away, such as why some groups form discrete-looking clusters while others grade into one another. It should include the distinctions the account may not collapse: between the species category and a particular species taxon, between a diagnostic trait and the thing being diagnosed, and between a species being real and a species being a convenient unit. It should include the results from evolutionary biology it cannot contradict, such as population thinking, gene flow, and incomplete lineage sorting. For each desideratum, give the case or consideration that makes it a requirement rather than a preference.

  Then mark which requirements are non-negotiable and which are commitments of a particular school; flag any subsets that look jointly unsatisfiable, and say whether that forces pluralism about species concepts or a more deflationary conclusion; and identify the single requirement that does the most work in excluding the familiar candidates. A sentence or two on how each major contender fares against the list is welcome, but keep the weight on the criteria and their motivating cases.
reasoning: |-
  Okay, the user writes for a general-interest magazine about biology and philosophy of science. They're preparing a feature on why species counts change—like why one bird population splits into three species then gets lumped back, or why experts disagree without factual errors. Before explaining rival species concepts to readers, they want a list of what any adequate species definition must deliver. The goal is to help nonspecialists understand what taxonomists do and why classifications shift. 

  The user wants a "desiderata list"—criteria for a good species account. It must handle tricky cases: asexual organisms, ring species, hybrid zones, fossils, bacteria with horizontal gene transfer, and poorly studied groups. It should explain why some species look discrete while others blend, without dismissing these phenomena. It must preserve key distinctions: the species category vs. individual taxa, diagnostic traits vs. the thing diagnosed, and "real species" vs. "convenient units." It can't contradict evolutionary principles like population thinking, gene flow, or incomplete lineage sorting. For each criterion, I need to specify which case or consideration makes it necessary, not optional. 

  Then, I should categorize requirements as non-negotiable (universal) vs. school-dependent, flag any conflicting sets that might force pluralism or deflationism, and pinpoint the most exclusionary criterion. A brief note on how major contenders (like Biological, Phylogenetic, or Ecological Species Concepts) fare against the list would help, but the focus stays on the criteria themselves. 

  The user's deeper need is clarity amid complexity. They're translating expert debates for laypeople, so the list must demystify why taxonomy is fluid—not just list dry requirements. Their examples (birds splitting/re-lumping, systematists disagreeing) show they want to highlight science-in-action, where uncertainty is normal. Philosophically, they might be nudging readers toward pluralism or pragmatism without saying it outright. 

  For structure, I'll draft the desiderata in order: first coverage of cases, then explanatory duties, distinctions to maintain, and evolutionary constraints. Each gets a "because" tying it to real biology. Non-negotiables are basics like handling reproduction/morphology; school-dependent ones like strict reproductive isolation. Conflicts arise between discreteness demands and continuity cases—forcing pluralism. The heaviest lift is "explaining diversity without explaining away," as it challenges all major concepts. 

  Contenders: Biological Species Concept (BSC) excels at sexual organisms but fails asexuals/ring species. Phylogenetic (PSC) handles fossils/bacteria but struggles with hybridization. Ecological (ESC) explains niche divergence but ignores gene flow. None ace the list, proving why taxonomy stays dynamic. The conclusion should stress that criteria aren't flaws—they're why science evolves. That’s the hook for the magazine feature.
answer: |-
  Here's a desiderata list for an adequate account of "species," designed to illuminate taxonomic practice for a general audience, derived directly from the complexities of biology and the goals of systematics:

  1.  **Handle Asexual/Parthenogenetic Lineages:** Must provide non-arbitrary criteria for grouping and delimiting lineages reproducing without sex. *Requirement because:* Many organisms (e.g., bdelloid rotifers, some lizards, plants, microbes) lack sexual recombination. Defining species solely by interbreeding potential is impossible here. *(Non-negotiable)*
  2.  **Handle Ring Species:** Must account for populations where adjacent demes interbreed, but terminal demes do not, forming a ring of connectivity around a barrier. *Requirement because:* They exemplify speciation-in-progress and challenge simple "yes/no" species boundaries. *(Non-negotiable)*
  3.  **Handle Hybrid Zones & Introgression:** Must explain stable zones of interbreeding and gene flow between distinct populations/species without collapsing them into one. *Requirement because:* Hybridization is common and evolutionarily significant (e.g., many plants, birds like Audubon's vs. Myrtle Warblers), showing species boundaries can be permeable yet real. *(Non-negotiable)*
  4.  **Handle Fossil Chronospecies:** Must allow species delimitation based solely on morphological change over time in a lineage. *Requirement because:* For extinct species, morphology (bones, shells, pollen) is often the *only* data available. *(Non-negotiable)*
  5.  **Handle Microbes (Bacteria/Archaea) with Horizontal Gene Transfer (HGT):** Must accommodate organisms where genetic material is frequently exchanged across vast phylogenetic distances, blurring clear lineages. *Requirement because:* HGT is fundamental to microbial evolution; tree-like models often fail. *(Non-negotiable)*
  6.  **Handle Poorly Studied Populations:** Must provide operational criteria usable with limited data (e.g., only morphology, geography, or limited genetics). *Requirement because:* Most biodiversity is undescribed; taxonomy can't wait for perfect data. *(Non-negotiable)*
  7.  **Explain Continuum vs. Discreteness:** Must explain *why* some groups form sharp clusters (e.g., lions and tigers) while others grade continuously (e.g., some oaks, willows, or geographically variable birds) without dismissing either pattern. *Requirement because:* Both patterns exist in nature; an account must reflect this biological reality. *(Non-negotiable)*
  8.  **Distinguish Species Category vs. Taxon:** Must clarify the difference between the abstract concept ("species" as a rank/category) and specific instances (e.g., *Homo sapiens*, *Panthera leo*). *Requirement because:* Confusing the definition of the category with the reality of a specific taxon leads to circular reasoning. *(Non-negotiable)*
  9.  **Distinguish Diagnostic Trait vs. Diagnosed Entity:** Must not conflate the *criteria* used to identify species (e.g., DNA barcode, plumage color, mating call) with the *definition* of what a species *is*. *Requirement because:* Different traits can diagnose the same entity; no single trait is definitional. *(Non-negotiable)*
  10. **Distinguish "Real" vs. "Convenient":** Must address whether species are discovered fundamental units of nature or constructed human categories for utility. *Requirement because:* This philosophical distinction underpins debates about splitting/lumping and the reality of species. *(Non-negotiable - must address it honestly)*
  11. **Comply with Population Thinking:** Cannot treat species as immutable types; must recognize variation within populations as fundamental. *Requirement because:* Modern evolutionary biology rejects essentialism; individuals within a population vary. *(Non-negotiable)*
  12. **Acknowledge Gene Flow:** Must incorporate the evolutionary role of genetic exchange within and between populations/species. *Requirement because:* Gene flow connects populations, prevents divergence, or introduces novelty. *(Non-negotiable)*
  13. **Acknowledge Incomplete Lineage Sorting (ILS):** Must account for why gene trees (histories of specific genes) can conflict with the species tree (history of population divergence). *Requirement because:* ILS is a common outcome of the coalescent process during speciation, creating messy genetic signals. *(Non-negotiable)*
  14. **Explain Taxonomic Stability & Instability:** Must illuminate *why* classifications change (new data, new concepts, inherent biological complexity) without portraying it as mere error. *Requirement because:* This is the core phenomenon the feature aims to explain to readers. *(Non-negotiable)*

  **Analysis:**

  *   **Non-Negotiable (Universal):** 1-9, 11-14. These stem from unavoidable biological realities (asexuality, hybridization, fossils, microbes, variation, gene flow, ILS) or fundamental logical/philosophical distinctions (category/taxon, trait/entity, real/convenient) necessary to accurately describe the natural world and taxonomic practice.
  *   **School-Dependent Commitments:** Item 10 ("Real" vs. "Convenient") reflects deep philosophical commitments. Monists (e.g., strict BSC or PSC adherents) often lean towards "real" discovered units. Pluralists or pragmatists lean towards "convenient" categories reflecting different evolutionary processes. Operational concepts prioritize utility over ontology.
  *   **Jointly Unsatisfiable Subsets & Implications:**
      *   **The Core Tension:** Demanding clear discreteness (#7) conflicts directly with handling ring species (#2), hybrid zones/introgression (#3), clinal variation (#7), chronospecies (#4), and microbes with HGT (#5). Biology exhibits both distinct clusters *and* continuity.
      *   **Implication:** This tension is **the primary driver forcing pluralism**. No single concept universally satisfies all non-negotiable requirements. Different concepts (BSC, PSC, ESC, Morphological) emphasize different properties (interbreeding, lineage divergence, ecological adaptation, diagnosability) relevant in different biological contexts. A deflationary conclusion ("species are just useful human constructs") is also possible but often less satisfying for explaining biological patterns.
  *   **The Most Exclusionary Requirement:** **Handling Microbes with HGT (#5).** This requirement fundamentally challenges tree-like models of ancestry and descent central to the Biological Species Concept (reproduction irrelevant), many Phylogenetic Species Concepts (coherent monophyletic lineage difficult), and the Ecological Species Concept (niche coherence amidst rampant gene swapping). It starkly highlights that no concept developed primarily for macrobes works perfectly across all life.

  **How Major Contenders Fare (Briefly):**

  *   **Biological Species Concept (BSC - Interbreeding):** Excels for many sexual animals (#2, #3 partially, #7 discreetness). Fails catastrophically on #1, #4 (no breeding test), #5, and struggles with #3 (hybrid zones), #7 (continuums), #14 (instability in complex cases). Violates #11 if applied rigidly.
  *   **Phylogenetic Species Concepts (PSC - Monophyly/Diagnosability):** Handles #1, #4 (morph diagnosability), #6 (diagnostic traits), #14 (instability due to new data). Struggles profoundly with #2, #3 (gene flow breaks monophyly/diagnosability), #5 (HGT shatters monophyly), #7 (arbitrary cutoff on continuums), #13 (ILS causes non-monophyly). Risks conflating #8 and #9.
  *   **Ecological Species Concept (ESC - Niche Occupation):** Handles #1, #7 (explains clusters/dispersal), potentially #5 (if niche defined broadly). Very difficult to apply operationally (#4, #6), struggles with #2, #3 (niches can overlap/gene flow), #13. Heavily reliant on correctly defining "niche".
  *   **Morphological Species Concept (MSC - Phenotypic Cluster):** Pragmatic for #4, #6. Fails on #1 (asexuals similar ≠ related), #2, #3, #5, #7 (subjectivity on clusters/grades), #13. Prone to essentialism (#11) and conflating #8/#9. Explains much historical instability (#14).

  This list reveals that species delimitation is inherently complex because evolution produces diverse patterns of divergence and cohesion. The changing counts reflect scientists applying different conceptual tools, discovering new data (especially genetic), and wrestling with a biological reality that doesn't always fit neatly into discrete boxes. The desiderata show *why* the debate persists and why pluralism often emerges as the most pragmatic and biologically honest approach.
