  ok so we're doing Kant in my philosophy class and the whole never-lie thing is messing with my head. i went through a bunch of cases just going with my gut and here's where i landed:

  - lying to nazi officers about hiding jews in the basement: obviously fine, like not even a question
  - telling my mom i finished my homework when i actually spent the whole afternoon on tiktok: not fine, i feel guilty about this one
  - my friend is about to go on stage for a talent show and asks if she sounds good, she really doesn't but i say yeah: fine, i'd be a jerk otherwise
  - lying on a resume about having a degree i never got: not fine, feels like fraud
  - my grandma has dementia and keeps asking where my grandpa is (he died six years ago), and i tell her he's just gone to the store: this one i genuinely cannot figure out, i flip back and forth every time
  - lying to my girlfriend about texting my ex: not fine, even if nothing happened
  - some random guy on the street asks for my phone number and i give him a fake one: fine, he's being creepy
  - lying under oath about something i saw: not fine, like this feels like the worst one on the whole list
  - telling my seven-year-old cousin that santa is real: fine, it's not even really lying

  so is there a principle that actually gets all of these? and if there is, what does it say about the grandma case? also if you have to overturn one of my verdicts to make things consistent, tell me which one and why. cause right now i feel like i'm just making it up as i go.
