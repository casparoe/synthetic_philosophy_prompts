  Now, for the three positions: Computational functionalism should treat both as morally equivalent since they're functionally identical. Biological naturalism would only grant moral status to biological systems, so neither qualifies here. Integrated Information Theory (IIT) would likely see higher Φ in System A due to its dense integration, while System B might have low Φ because its components are spread out and causally sluggish.

  The key feature creating the asymmetry is probably the spatial proximity and causal immediacy in System A versus the spatial separation and mediated causality in System B. If I remove that—say, by making both systems equally compact—the intuition might collapse, making it harder to deny sentience in System B, which would challenge biological naturalism but support computational functionalism.

