  ### 3. Payoff Divergence and Sensitivity
  **Exact Feature Causing Divergence**:  
  The key is the **high payoff for Bob at Node 4 (20)** compared to Node 2 (8) and the **moderate payoff for Alice at Node 4 (6)** compared to Node 1 (4). This creates asymmetric incentives:
  - In backward induction, Alice fears Bob will take at Node 2 (giving her 2), forcing her to take at Node 1.
  - In level-k, Alice (L1) believes Bob (L0) will pass at Node 2, letting the game reach Node 4 where she gets 6 > 4. Bob (L1) passes at Node 2 because he believes passing will yield 20 (at Node 4) > 8 (taking at Node 2).

  **Sensitivity Analysis**:  
  If we **reduce Alice’s payoff at Node 4 (Take) from 6 to 3**, the concepts converge:
  - **Level-k (L1)**: Alice at Node 1 compares taking (4) vs. passing (now gets 3). Since 4 > 3, she takes.
  - **Backward induction**: Unchanged (still takes at Node 1).  
  *Why?* Alice’s incentive to pass disappears if Node 4 gives her less than Node 1. The divergence relies on Node 4 offering Alice more (6 > 4) to justify risking a pass.

