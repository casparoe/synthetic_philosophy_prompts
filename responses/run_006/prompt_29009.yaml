    - **Node 2 (Bob, L1)**:
      - If Bob takes, he gets 8. 
      - If he passes, he expects Alice (L0) to pass at Node 3 (since L0 only takes at Node 4), then Bob (L0) will take at Node 4, giving him 20. 
      - Since 20 > 8, he **passes**.
    - **Node 1 (Alice, L1)**:
      - If Alice takes, she gets 4. 
      - If she passes, she expects Bob (L0) to pass at Node 2 (L0 passes everywhere except Node 4), then Alice (L0) to pass at Node 3, then Bob (L0) to take at Node 4, giving her 6. 
      - Since 6 > 4, she **passes**.

