answer: |-
  That's a brilliant observation, and you've perfectly dissected a fascinating philosophical and conversational tension. Yes, there **is** an established concept for this, primarily discussed in philosophy (especially aesthetics) and linguistics/pragmatics:

  1.  **The Core Concept: The Acquaintance Principle (or Requirement)**
      *   **Definition:** This principle states that judgments concerning the *intrinsic, experiential qualities* of something – especially its aesthetic value, beauty, sensory qualities, or experiential worth – cannot be properly made or held *as one's own genuine judgment* without first-hand experience of the thing itself.
      *   **Key Proponents:** The term is most strongly associated with philosophers like **Frank Sibley** and **Richard Wollheim**, building on ideas traceable back to **Bertrand Russell's** distinction between "knowledge by acquaintance" vs. "knowledge by description."
      *   **Why it applies to taste/art:** The argument is that the *essential* properties being judged (beauty, deliciousness, emotional impact, thrillingness) are directly experiential and subjective. You can't *truly know* the *sensation* of the taste, the *emotional resonance* of the film, or the *visual impact* of the sunset through description alone. You need the direct encounter to form the basis for the judgment *itself*.

  2.  **What it Covers vs. What it Doesn't (The Edges):**
      *   **Covers (Requires Acquaintance):**
          *   **Core Aesthetic Judgments:** "This film is beautiful/moving/profound." "This wine is delicious/balanced/complex." "This music is sublime/energetic/boring." "This hike offers stunning views/a sense of peace."
          *   **Intrinsic Experiential Value:** "It's worth seeing/doing/eating for the experience itself." (e.g., "The hike is worth the drive *for the views and feeling*.")
          *   **Personal Preference Statements:** "I love/hate this painting." (Implies direct experience).
      *   **Does NOT Cover (Can Be Based on Testimony/Description):**
          *   **Factual Properties:** "The restaurant is overpriced" (comparable prices/menus exist). "The car is reliable" (based on statistics, repair records). "The film is historically inaccurate" (verifiable facts). **"The wine is corked" (TCA taint is a detectable chemical fault, an objective fact an expert can diagnose and describe reliably).**
          *   **Instrumental Value:** "Studying this piece is useful for technique" (a teacher can know this based on score analysis, pedagogical goals, without needing the *aesthetic* experience *at that moment*). "This hike is 5 miles long with 1000ft elevation gain."
          *   **Reputational/Consensus Statements:** "It's widely considered a masterpiece." "Critics raved about it." "My friend loved it." (This is what licenses "I've heard it's good").
          *   **Predictions Based on Track Record:** "Given the director's past work and the cast, it's *likely* to be good." (Based on inference, not direct judgment *of this thing*).

  3.  **The Wine Expert & Music Teacher Examples:**
      *   **Wine Expert - "This bottle is corked":** This is **NOT** an aesthetic judgment requiring acquaintance *with this specific bottle* for *you* to believe the expert. "Corked" refers to a specific, objective chemical fault (TCA). An expert can detect it reliably and describe the symptoms (musty, wet cardboard smell/taste). You believe them based on their expertise in identifying an objective flaw, just like believing a mechanic about a faulty engine. **Acquaintance principle doesn't apply.**
      *   **Music Teacher - "This piece is worth studying":** This is **MURKY and DEPENDS.** If they mean "worth studying *because it effectively teaches X technique or illustrates Y harmonic principle*" (instrumental value), then acquaintance isn't strictly needed for *you* to accept their pedagogical judgment based on the score and curriculum. If they mean "worth studying *because it's profoundly beautiful and experiencing that beauty is essential*" (intrinsic aesthetic value), then the acquaintance principle *would* apply – they are making an aesthetic claim that *you* can't fully grasp without experiencing the piece yourself. The teacher, however, *can* hold that opinion *because they have experienced it*.

  4.  **Is it About Knowledge or Conversation?**
      *   **Primarily Epistemic (Knowledge):** At its philosophical core, the Acquaintance Principle argues that genuine *knowledge* or *justified belief* about the *intrinsic experiential qualities* requires first-hand experience. You simply *cannot know* what the chocolate tastes like, or how the film *feels*, without tasting/seeing it. Testimony gives you knowledge *that others had an experience*, but not the experiential knowledge itself.
      *   **Manifested as a Conversational Norm:** This epistemic principle strongly shapes how we talk. Saying "It's good" typically *implies* you have direct experience and are reporting your own judgment. Saying "I've heard it's good" accurately reflects that your belief is based on testimony, not direct acquaintance. Violating this norm (saying "It's good" without seeing it) often feels misleading or even dishonest, as it pragmatically implies first-hand knowledge you don't possess. Your friend is reacting to this conversational implication.

  5.  **The Asymmetry You Noticed:**
      This is the crux! We constantly rely on testimony for *predictions* and *instrumental judgments* ("Friend X says Restaurant Y is overpriced, so I'll avoid it"). We also use testimony to *decide what to experience* ("Friend Z loved the film, so I'll see it"). **The Acquaintance Principle kicks in specifically when we try to *appropriate* the judgment *as our own* ("It *is* good") *before* having the experience.** We outsource the *recommendation to experience*, but we cannot outsource the *experience itself* or the judgment *based solely on that experience*.

  **Confidence Assessment & Uncertainties:**

  *   **Confident (8/10):** That the Acquaintance Principle is a well-established and descriptively accurate concept explaining the norm your friend invoked and the asymmetry you observe. It effectively distinguishes judgments requiring direct phenomenal experience from those based on testimony/facts.
  *   **Confident (7/10):** About the core examples (pure aesthetic judgments vs. objective facts). The wine "corked" example is a clear case where it doesn't apply.
  *   **Less Confident (5/10):** About precisely where the line falls in **hybrid judgments** like the music teacher's "worth studying." Does "worth" imply instrumental or intrinsic value, or both? Context matters hugely. The principle itself is clear, but categorizing *specific utterances* can be ambiguous.
  *   **Least Confident / Most Debated (4/10):** The **absolute necessity** of acquaintance in *all* cases. Could incredibly detailed VR or neural data someday convey the experience sufficiently? Are there edge cases where profound expertise allows a critic to *infer* the aesthetic quality reliably without *current* direct experience (e.g., knowing a composer's style intimately)? Most philosophers defend the principle, but these challenges exist. Furthermore, the *strength* of the norm varies culturally and contextually.

  **In short:** Your friend invoked the **Acquaintance Principle**. It's the idea that you need direct "acquaintance" (experience) to legitimately hold or express judgments about the *intrinsic, experiential value* of things like art, food, or nature, distinguishing them from factual or instrumental judgments. This underpins the conversational norm preventing you from saying "It's good" without seeing it, while happily letting you say "I've heard it's good" or believe him about the restaurant's price. The principle holds strong water, though its application to mixed judgments (like "worth studying") can be fuzzy at the edges.
