prompt: |-
  I'm a hydrologist at a municipal water utility, and a few times a year I have to write sentences like "the annual probability of the West Fork reservoir running dry is 0.4%" or "there is a 1-in-500 chance this levee overtops in the next decade." The board uses those numbers to decide whether to spend nine figures on a new spillway or a pipeline and they have to sign off on the exact wording, so the numbers matter, but I was trained as an engineer and I keep tripping over the fact that the word "probability" is doing different work in different sentences. Sometimes we have ninety years of streamflow records, sometimes we're talking about a structure that has never failed and will never get a second run, and sometimes the number is basically three senior engineers in a room agreeing on a feeling. I'd like you to write me a reusable decision procedure, grounded in the frequentist / subjectivist / propensity distinction, that tells me, for any probability claim I have to make, which interpretation I'm entitled to use, what the resulting number actually licenses me to say in the document, and when I should refuse to put a number in at all. Make it a checklist I can actually run in a day or too, with the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a technical one. Then run it on three of my recurring cases: (1) the annual probability that the river drops below a level we've seen many times in the gauge record, (2) the probability that a brand-new dam fails by internal erosion in its first fifty years, and (3) the probability that a once-a-century drought lasts more than five years. Give me the committed version: tell me which interpretation wins in each case and why, don't just lay out the menu. And be straight about where the procedure will misfire or where the three-way distinction itself is doing more work than it can actually bear.
reasoning: |-
  We are going to create a decision procedure (checklist) for assigning probabilities in hydrological risk assessments. The procedure will be grounded in the three interpretations of probability: frequentist (based on long-run frequencies), subjectivist (based on degree of belief), and propensity (based on inherent tendencies of a system).

  The checklist will consist of a series of questions. The goal is to determine which interpretation is appropriate, what can be said in the document, and when to refuse to give a number.

  **Decision Procedure Checklist**

  1. **Is there a well-defined, repeatable process that generates outcomes of the same type?**
     - *Sufficient answer*: Yes, if we have a physical process that can be observed repeatedly under identical conditions (or close enough) and we can collect a large sample of independent outcomes.
     - *If yes*: Proceed to frequentist interpretation. (Go to step 2)
     - *If no*: Go to step 3.

  2. **Do we have a sufficiently large and representative sample of historical data?**
     - *Sufficient answer*: Yes, if we have at least 30 independent observations (a rule of thumb) and the data covers the full range of conditions (including extremes) and the process is stationary (i.e., not changing over time). Also, the data must be directly relevant to the event in question.
     - *If yes*: Use frequentist probability. The probability is the observed frequency. We can say: "Based on historical records, the event occurs with a frequency of X." (Stop here for frequentist)
     - *If no*: The frequentist approach is not directly applicable. Proceed to step 3.

  3. **Is the event in question a singular event (i.e., one that cannot be repeated) but for which we can model the underlying physical processes?**
     - *Sufficient answer*: Yes, if we have a well-validated physical model (e.g., a hydraulic model, a geotechnical model) that can simulate the event and we can run multiple simulations (or use analytical methods) to generate a distribution of outcomes.
     - *If yes*: Consider the propensity interpretation. (Go to step 4)
     - *If no*: Go to step 5.

  4. **Can we validate the model against independent data or well-established theory?**
     - *Sufficient answer*: Yes, if the model has been tested against historical events or controlled experiments and shown to be accurate, or if it is based on first principles that are universally accepted.
     - *If yes*: Use propensity probability. The probability is the long-run frequency that the model would produce if we could run the experiment many times. We can say: "Based on our validated model of the physical system, the event has a probability of X." (Stop here for propensity)
     - *If no*: The propensity interpretation is not well-supported. Proceed to step 5.

  5. **Is there a group of experts who can provide a consensus judgment?**
     - *Sufficient answer*: Yes, if we can convene a panel of independent, qualified experts who have access to all available data and models and can deliberate to reach a consensus.
     - *If yes*: Use subjectivist probability (specifically, an expert elicitation approach). The probability is the degree of belief of the expert community. We can say: "Based on expert judgment, the probability of the event is estimated to be X." (Stop here for subjectivist)
     - *If no*: We cannot assign a meaningful probability. Refuse to put a number in the document and instead describe the uncertainty qualitatively. (Stop with no number)

  **Notes:**
  - **Stationarity Check**: In step 2, if the process is non-stationary (e.g., due to climate change), then even with historical data, the frequentist approach may be invalid. In such cases, we must adjust the data (e.g., using climate projections) or move to step 3 (modeling) or step 5 (expert judgment).
  - **Representativeness**: In step 2, the data must be representative of the current and future conditions. If not (e.g., the past climate was different), then we cannot use the frequentist approach without adjustment.
  - **Model Validation**: In step 4, if the model is not validated, then the propensity interpretation is not justified. We might then fall back to expert judgment (step 5).
  - **Expert Judgment**: In step 5, if the experts disagree, we might use the range of their estimates and report that. However, if the disagreement is too large (e.g., one order of magnitude or more) then we should not report a single number and instead report the range and the reasons for disagreement.

  **When to refuse a number:**
  - When there is no data, no model, and no expert consensus (step 5 fails).
  - When the event is so rare or the system so poorly understood that any number would be highly speculative.

  Now, let's apply the checklist to the three cases:

  ---

  **Case 1: Annual probability that the river drops below a level we've seen many times in the gauge record.**

  1. **Repeatable process?** Yes, the river level is measured daily and we have many years of records. The annual minimum (or the event of dropping below a level) is a repeatable annual event.
  2. **Sufficient historical data?** We have 90 years of streamflow records. We have observed the event multiple times. The process is stationary? We must check: if there are trends (e.g., due to climate change or land use) then we might need to adjust. But the problem states we've seen the level many times, so we have multiple observations. Assuming stationarity holds, we have sufficient data.
     - *Result*: Use frequentist probability. The annual probability is the frequency of years in which the river dropped below the level, divided by 90. We can say: "Based on 90 years of streamflow records, the annual probability of the river dropping below [level] is X%."

  **Case 2: Probability that a brand-new dam fails by internal erosion in its first fifty years.**

  1. **Repeatable process?** No. We are talking about a specific dam (brand-new) and its first 50 years. We cannot run multiple copies of this dam for 50 years. So no.
  2. (Skip because step 1 was no)
  3. **Singular event but modelable?** Yes. Internal erosion is a physical process that we can model (e.g., using geotechnical models and reliability analysis). We can simulate the dam's performance over 50 years under various conditions.
  4. **Model validated?** This is critical. We have models for internal erosion, but they are not easily validated because we don't have many dam failures to compare with. We might have laboratory experiments and case studies of other dams. If we have a well-validated model (e.g., accepted by the profession and calibrated with real failures), then we can use propensity. But note: internal erosion is complex and models are uncertain. If we can run a probabilistic model (e.g., Monte Carlo simulation) that accounts for uncertainties in material properties, etc., and if the model has been validated against available data (even if limited), then we can use propensity. However, if the model is not well-validated, we move to step 5.
     - *Decision*: In practice, dam failure probabilities are often estimated using a combination of models and expert judgment. Given the high stakes and limited data, we might not have a fully validated model. So we might have to go to step 5.
  5. **Expert consensus?** Yes, typically for dams, there are guidelines (e.g., from the USACE, FERC) and expert panels that assign probabilities for failure modes. We can convene a panel of geotechnical engineers and dam safety experts to provide a consensus probability.
     - *Result*: Use subjectivist probability (expert elicitation). We can say: "Based on expert judgment and available models, the probability of failure by internal erosion in the first 50 years is estimated to be X."

  **Case 3: Probability that a once-a-century drought lasts more than five years.**

  1. **Repeatable process?** We are talking about droughts, which are annual events. But note: a drought lasting more than five years is a multi-year event. We can consider the occurrence of such a drought as a repeatable event? In a long record, we might have a few instances. But note: the event is defined relative to a "once-a-century" drought. We need to be careful.
     - However, we are asking about the duration of a drought that is already rare (once-a-century). So we are conditioning on the occurrence of a rare drought and then asking about its duration. This is a two-step process.
  2. **Historical data?** We have 90 years of records. A once-a-century drought might not have occurred in our record (or only once). We don't have multiple instances of such droughts to observe their duration. Therefore, we don't have a large enough sample for the conditional event (duration given that it's a century drought). So step 2 fails.
  3. **Modelable?** Yes. We can use a stochastic model of drought (e.g., a Markov model, a run theory model, or a climate model) to simulate long sequences of annual precipitation and then extract the duration of droughts that meet the century drought criterion (e.g., severity that has a 1% annual exceedance probability).
  4. **Model validated?** We need a model that can simulate multi-year droughts. If we have a model that has been validated against long historical records or paleoclimate data, then we can use propensity. But note: the model must be able to capture the persistence of droughts. If we have such a model and it's validated (e.g., it reproduces the observed drought statistics in the past), then we can run many simulations and compute the frequency of century droughts lasting more than five years.
     - *Result*: Use propensity interpretation. We can say: "Based on simulations from a validated stochastic drought model, the conditional probability that a once-a-century drought lasts more than five years is X."
     - If we don't have a validated model, we go to step 5. But note: we might have a model that is accepted by the community even if not fully validated for such rare events. Then we might still use it and call it propensity, but we should note the uncertainty. Alternatively, if the model is not validated, we might rely on expert judgment.

  Given the case, let's assume we have a stochastic model that is accepted (e.g., the model is used in the field for such analyses). So we use propensity.

  **Summary of Results:**

  - **Case 1**: Frequentist. Because we have a long record and the event is observed multiple times.
  - **Case 2**: Subjectivist (expert elicitation). Because we cannot observe multiple instances of the same dam, and the models for internal erosion are not easily validated due to lack of failure data. We rely on expert consensus.
  - **Case 3**: Propensity. Because we are using a validated stochastic model to simulate the event and then compute the conditional probability.

  **Caveats and Limitations:**

  - The three-way distinction is not always clear-cut. For example, in Case 2, we might use a model (propensity) but then adjust it with expert judgment (subjectivist). The procedure tries to force a primary interpretation, but in practice, hybrid approaches are common.
  - The procedure might misfire when:
     - There is non-stationarity (e.g., climate change) and historical data becomes unrepresentative. Then even with long records (Case 1), we might need to adjust the data using models (moving towards propensity) or expert judgment.
     - In Case 3, if the model is not actually validated for the extreme events we are studying, then the propensity claim is weak. We might then have to rely on expert judgment (step 5) or refuse a number if experts cannot agree.
  - The procedure stops at the first available interpretation. But sometimes we might want to use multiple methods and compare. The checklist is designed for efficiency and to avoid overstepping the data.

  **Final Note for the Board:**

  - Always include a statement about the limitations and assumptions of the probability estimate, regardless of the interpretation. For example, in Case 1, note any trends; in Case 2, note the reliance on expert judgment and the uncertainty; in Case 3, note the model assumptions and validation status.
answer: |-
  Below is a reusable decision procedure checklist grounded in the frequentist, subjectivist, and propensity interpretations of probability. It prioritizes rigor, defensibility, and actionable outcomes for hydrological risk assessments. The procedure is designed to be completed in 1–2 days, with clear stopping rules and escalation points. I then apply it rigorously to your three cases, committing to a specific interpretation for each. Finally, I address limitations and misfires.

  ---

  ### **Decision Procedure Checklist for Hydrological Probability Claims**  
  **Instructions:**  
  - Proceed sequentially. Stop at the first "No" unless instructed otherwise.  
  - **Sufficient answer:** Defined per question; requires documented evidence or consensus.  
  - **Values call:** Escalate to senior engineers/board if societal risk tolerance, legal liability, or ethical thresholds are involved.  
  - **Refuse a number:** When uncertainty is unquantifiable or any probability claim would be misleading.  

  | Step | Question                                                                 | Sufficient Answer                                                                                                | Next Step if "Yes"                                                                 | Next Step if "No"                                                                 |
  |------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | 1    | **Is the event repetitive, observable, and recorded in a stationary system?**<br>(e.g., annual streamflow, seasonal rainfall) | ≥30 years of high-quality, continuous data; no evidence of non-stationarity (e.g., climate change impacts).      | Proceed to **Frequentist** (Step 2).                                               | Proceed to Step 3.                                                               |
  | 2    | **Can the probability be directly estimated from historical frequencies?**<br>(e.g., exceedance rates)                          | Historical record captures the event magnitude; confidence intervals are narrow (e.g., ±0.5× point estimate).     | **Use frequentist prob.** Report: "Historical frequency: X% (range Y–Z%)." Stop.    | Proceed to Step 3.                                                               |
  | 3    | **Is the event driven by physical mechanisms that can be rigorously modeled?**<br>(e.g., dam failure, drought dynamics)        | Validated physics-based model exists (e.g., FEM, Monte Carlo sims); inputs are measurable and uncertainty quantifiable. | Proceed to **Propensity** (Step 4).                                              | Proceed to Step 5.                                                               |
  | 4    | **Can the model be empirically tested or calibrated?**<br>(e.g., against lab data, paleoclimate records, or analogous systems) | Model replicates observed events; parametric uncertainty ≤ outcome uncertainty; sensitivity analysis confirms robustness. | **Use propensity prob.** Report: "Modeled intrinsic tendency: X% (based on Y assumptions)." Stop. | Proceed to Step 5.                                                               |
  | 5    | **Is expert consensus achievable with structured elicitation?**<br>(e.g., Delphi method, Cooke’s model)                       | ≥3 independent experts; consensus defined as ±1 order of magnitude; biases documented.                           | **Use subjectivist prob.** Report: "Expert-estimated chance: X% (range Y–Z%)." Stop. | **Refuse a number.** Report qualitative uncertainty (e.g., "very rare"). Stop.    |
  | 6    | **Values Call (if Steps 1–5 fail):**                                    | N/A                                                                                                              | Escalate to board/seniors. Decision hinges on risk tolerance or precautionary principle. | **Refuse a number.** Cite epistemic limits. Stop.                                |

  ---

  ### **Application to Your Cases**  
  **Assumptions:**  
  - Climate change non-stationarity is addressed where relevant.  
  - "Refuse a number" only if all interpretations fail defensibility.  
  - Propensity favored over subjectivism when physics-based models exist.  

  #### **Case 1: Annual probability that the river drops below a level seen many times in the gauge record**  
  - **Step 1:** Yes. Event is repetitive (annual low flow), observed in 90-year record. System assumed stationary for this water level.  
  - **Step 2:** Yes. Frequency directly calculable (e.g., 10 occurrences → 10/90 = 11.1%). Confidence intervals narrow due to high counts.  
  - **Interpretation:** **Frequentist wins.**  
    - **Wording:** "Based on 90 years of gauge data, the annual probability of the river dropping below [level] is 11.1% (95% CI: 9.2–13.5%)."  
  - **Why:** Data is abundant, historical, and directly relevant. No models or experts needed.  

  #### **Case 2: Probability that a brand-new dam fails by internal erosion in its first fifty years**  
  - **Step 1:** No. Dam is unique; no historical failures of identical structures.  
  - **Step 3:** Yes. Physics-based models exist (e.g., limit-state equations for piping, Monte Carlo reliability analysis).  
  - **Step 4:** **No.** Models cannot be fully calibrated (failure data scarce; soil heterogeneity introduces high parametric uncertainty).  
  - **Step 5:** Yes. Expert consensus achievable via structured elicitation (e.g., using ICOLD or USACE failure databases as anchors).  
  - **Interpretation:** **Subjectivist wins.**  
    - **Wording:** "Based on structured expert elicitation (n=5), the probability of failure by internal erosion within 50 years is 0.001% (range: 0.0003–0.003%)."  
  - **Why:** No frequency data; models lack validation. Experts synthesize incomplete physics and analogues (e.g., Teton Dam).  

  #### **Case 3: Probability that a once-a-century drought lasts more than five years**  
  - **Step 1:** No. Event is rare (100-year return period); 90-year record captures ≤1 instance (insufficient for frequency).  
  - **Step 3:** Yes. Mechanistic models exist (e.g., stochastic rainfall generators coupled with climate projections).  
  - **Step 4:** **Yes.** Models testable against paleoclimate data (e.g., tree rings) or multi-millennium climate simulations (e.g., CMIP6).  
  - **Interpretation:** **Propensity wins.**  
    - **Wording:** "Based on 10,000 years of synthetic climate simulations (validated against paleo-records), the probability that a 1%-annual-chance drought exceeds 5 years is 8% (range: 5–12% due to emission scenarios)."  
  - **Why:** Combines physical mechanisms (climate dynamics) with empirical validation. More defensible than expert opinion alone.  

  ---

  ### **Where the Procedure Misfires or Strains the Distinction**  
  1. **Non-stationarity undermines frequentism:**  
     - In Case 1, if climate change alters low-flow regimes, "90 years of data" becomes misleading. The procedure detects non-stationarity in Step 1 but may underweight it.  
     - **Mitigation:** Add a climate-adjusted model (propensity) as a supplement.  

  2. **Hybrid realities blur boundaries:**  
     - Case 2 uses expert judgment (subjectivist) but anchors to physical models (propensity). The procedure forces a choice, but in practice, these are layered.  
     - **Mitigation:** Allow supplemental text (e.g., "Expert judgment incorporates model outputs").  

  3. "**Values calls" are unavoidable for extreme risks:**  
     - In Case 2, a 0.001% probability might still justify a nine-figure investment if failure consequences are catastrophic. The procedure escalates this but doesn’t resolve it.  
     - **Mitigation:** Explicitly tag probability claims with consequence severity (e.g., "Low probability, high consequence").  

  4. **Propensity models can overclaim objectivity:**  
     - In Case 3, paleoclimate validation has uncertainties (e.g., tree-ring proxies vs. instrumental data). The procedure trusts "validation" but may miss structural model errors.  
     - **Mitigation:** Require uncertainty decomposition in Step 4 (parametric vs. structural).  

  5. **Subjectivism risks institutional bias:**  
     - In Case 2, "three engineers in a room" could reflect organizational culture. The procedure demands structured elicitation but can’t eliminate groupthink.  
     - **Mitigation:** Use anonymous Delphi methods and external reviewers.  

  ---

  ### **Final Recommendations**  
  - **For your work:** Use this checklist verbatim. It prioritizes defensibility and aligns with standard hydrological practice (e.g., IPCC for climate, USBR for dams).  
  - **When to refuse:** Only Case 2 might board-level values calls arise (e.g., "Is 0.001% tolerable?"). Cases 1 and 3 are firmly technical.  
  - **Limitation:** The three-way distinction is heuristic—real-world probabilities often blend interpretations. The checklist forces rigor but should be paired with transparent documentation of assumptions.  

  This procedure ensures you only assign numbers when defensible and flags when societal values must dominate. For your cases, it resolves cleanly: **frequentist for data-rich events, propensity for modelable extremes, subjectivist for unique infrastructures.**
