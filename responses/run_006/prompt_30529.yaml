answer: |-
  Here’s a distilled set of desiderata for theories of action under moral uncertainty, grounded in concrete failure cases, with a verdict on their status and trade-offs. I’ll then score major approaches against them.

  ---

  ### **Core Desiderata & Failure Cases**  
  *(Genuine = unavoidable structural flaw; Preference = contingent on values)*  

  | **Desideratum**                         | **Concrete Failure if Violated**                                                                 | **Status**       |
  |-----------------------------------------|--------------------------------------------------------------------------------------------------|------------------|
  | **1. Comparability**                    | **Paralysis:** Utilitarianism says save 100 lives, deontology forbids violating one. No common "currency" → no basis for comparison. | **Genuine**      |
  | **2. Non-Fanaticism**                   | **Pascalian Madness:** 0.0001% credence in a theory with infinite stakes (e.g., "torturing 1 person damns ∞ souls") dominates all other moral concerns. | **Preference**<sup>†</sup> |
  | **3. Normative Relevance**              | **Pointlessness:** Decisions ignore uncertainty (e.g., 99% credence in utilitarianism vs. 1% in egoism; egoism never affects choice). | **Genuine**      |
  | **4. Dynamic Consistency**              | **Self-Sabotage:** Committing to an option now that you’d reject with more information (e.g., refusing to learn which theory is true). | **Genuine**      |
  | **5. Avoidance of Strictly Dominated Acts** | **Guaranteed Wrongness:** Choosing an act that every live theory agrees is worse than another (e.g., killing 10 vs. saving 10). | **Genuine**      |
  | **6. Regress Resistance**               | **Infinite Regress:** Needing a "meta-theory" to choose how to act under moral uncertainty, then needing a meta-meta-theory, etc. | **Genuine**      |
  | **7. Robustness to Theory Specification** | **Arbitrariness:** Changing how theories are formulated (e.g., splitting utilitarianism into sub-theories) drastically alters verdicts. | **Preference**   |

  **<sup>†</sup>Non-Fanaticism**: While rejecting it leads to *implausible* outcomes (e.g., ignoring near-certain genocide for a 1/10¹⁰⁰ chance of infinite utility), it’s *conceptually coherent* to accept fanaticism. Thus, a **preference**, but one most find compelling.

  ---

  ### **Key Tensions & Incompatibilities**  
  - **Comparability vs. Non-Fanaticism**: Fixing comparability (e.g., via intertheoretic value comparisons) enables fanaticism by allowing tiny probabilities of infinite stakes to dominate. Reject comparability → paralysis; accept it → risk fanaticism.  
  - **Regress Resistance vs. Normative Relevance**: Any rule for moral uncertainty (e.g., "maximize expected choiceworthiness") is itself a norm you could be uncertain about → regress. Avoiding regress requires dogmatism.  
  - **Robustness vs. Dynamic Consistency**: Fine-grained theory specifications improve robustness but make learning (e.g., updating credences) computationally intractable → violates dynamic consistency.  

  **Result**: **No theory satisfies all desiderata simultaneously.** Trade-offs are unavoidable.

  ---

  ### **Scorecard of Major Approaches**  
  *(✓ = Satisfies ~fully, ~ = Partially, ✗ = Fails)*  

  | **Criterion →**<br>**Theory ↓**          | **Comparability** | **Non-<br>Fanaticism** | **Normative<br>Relevance** | **Dynamic<br>Consistency** | **Avoids<br>Dominated Acts** | **Regress<br>Resistance** | **Robustness** |
  |------------------------------------------|-------------------|------------------------|----------------------------|----------------------------|------------------------------|---------------------------|----------------|
  | **Expected Choiceworthiness**<br>(EC)    | ✗<sup>1</sup>     | ✗<sup>2</sup>          | ✓                          | ~<sup>3</sup>              | ✓                            | ✗                         | ✗<sup>4</sup>  |
  | **Maximalism**<br>(M)                    | ✓<sup>5</sup>     | ✓                      | ✗<sup>6</sup>              | ✓                          | ✓                            | ✓                         | ~<sup>7</sup>  |
  | **Bargaining**<br>(B)                    | ~<sup>8</sup>     | ~                      | ~                          | ✗<sup>9</sup>              | ~<sup>10</sup>               | ✗                         | ✗              |

  ---

  ### **Explanations**  
  1. **EC**: Requires ad hoc value comparisons; fails without them.  
  2. **EC**: Vulnerable to fanaticism via unbounded utilities.  
  3. **EC**: Consistent only with specific updating rules (e.g., Bayesian).  
  4. **EC**: Sensitive to theory-splitting (e.g., adding "utilitarianism-v2" changes weights).  
  5. **M**: Avoids paralysis by only ruling out strictly dominated acts.  
  6. **M**: Ignores *degree* of uncertainty (e.g., 99% utilitarianism vs. 1% deontology treated same).  
  7. **M**: Some specifications avoid splitting issues, but ambiguity in what counts as a "live theory".  
  8. **B**: Bargaining solutions (e.g., Nash, Kalai-Smorodinsky) impose comparability.  
  9. **B**: Bargaining axioms (e.g., symmetry) are themselves norms subject to uncertainty → regress.  
  10. **B**: May permit weakly dominated acts if theories "trade off" wrongs.  

  ---

  ### **The Bottom Line**  
  - **Maximalism** excels at avoiding disaster (fanaticism, paralysis, regress) but fails to leverage normative relevance. Ideal for risk-averse agents.  
  - **Expected Choiceworthiness** handles uncertainty precisely but collapses under fanaticism or comparability failures. Requires contentious assumptions.  
  - **Bargaining** is theoretically elegant but regress-prone and computationally unworkable.  
  - **Trade-off Central**: You **cannot** have comparability, normative relevance, *and* non-fanaticism. Choose two.  
  - **Regress is the Guillotine**: All theories fail regress resistance if scrutinized, suggesting moral uncertainty may require pragmatic (not foundational) solutions.  

  For your partiality to maximalism: it’s the most robust to "moles" (fanaticism, comparability) but at the cost of ignoring *how* uncertain you are. EC is precise until the wheels fall off; bargaining is a philosopher’s mirage.
