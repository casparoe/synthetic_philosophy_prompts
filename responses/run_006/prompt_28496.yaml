answer: |-
  ## The Principal Principle: Genuine Exceptions or Illuminating Refinements?

  The Principal Principle (PP) stands as a cornerstone of our understanding of objective chance, elegantly capturing its normative force: upon learning that the objective chance of some outcome A is *x*, one's rational credence in A should be set to *x* (conditional on that chance information, and no other "inadmissible" information). This principle seems fundamental – it arguably *defines* what objective chance *is*, the kind of thing that should rationally guide our beliefs. Yet, purported exceptions like crystal balls and undermining futures threaten to undermine its universal validity. Do these cases reveal fatal flaws demanding abandonment or severe restriction, or do they instead illuminate necessary refinements in how we conceptualize chance and admissibility? I argue that while these cases expose genuine complexities, they primarily demand a more careful articulation of the relationship between chance, evidence, and possibility, rather than the abandonment of the core intuition embodied by the PP.

  The **crystal ball case** presents the first challenge. Imagine you learn that the chance of a fair coin landing heads is 0.5. According to the PP, your credence in heads should be 0.5. But now suppose you also possess a perfectly reliable crystal ball showing you the coin lands tails. Intuitively, your credence in heads should be 0, *despite* knowing the chance is 0.5. Lewis's solution was the introduction of an **admissibility clause**: the PP holds only if the total evidence E (which includes the chance information) is *admissible* with respect to A. Information about the *actual future outcome* (like the crystal ball vision) is paradigmatically inadmissible. The PP becomes: Cr(A | ch(A)=x & E) = x, provided E is admissible with respect to A.

  This move saves the PP from the crystal ball but raises the critical question: **Can admissibility be defined non-circularly?** Skeptics argue that defining admissibility as "information that doesn't require deviation from PP" renders the principle vacuous. Lewis himself suggested admissibility relative to a time: information about events *after* the time of the chance outcome's occurrence is inadmissible. While intuitive for crystal balls, this temporal approach faces its own hurdles, particularly when combined with the deeper problem of **undermining futures**.

  The undermining future problem arises most acutely within **Humean accounts of chance** (like Lewis's own Best System Analysis), where chances supervene on the entire pattern of particular events throughout space-time. Consider a simple chance theory T: the chance of a radioactive atom decaying in the next hour is 0.5, and the chances are determined by the global frequency. Now, a specific future F where, say, only 40% of such atoms decay *in this world* is possible. Crucially, the actual truth of T *depends* on the entire future history F. There is a possible future F' compatible with the chances *according to T* up to now, but which, if it occurred, would make T *false* (because F' contains a frequency incompatible with T). T *undermines* its own possible future truth.

  Here's the conflict for PP:
  1.  You know the *true* chance theory is T (ch(decay) = 0.5 at t0).
  2.  You also know that if T is true, then the actual future F does *not* contain undermining frequencies (by definition).
  3.  However, the *possibility* of an undermining future F' (which would make T false) seems relevant. Shouldn't your credence in T itself be less than 1?

  The original PP seems to demand Cr(F' | ch(F')=x & T) = x. But if F' is an undermining future, ch(F') *according to T* might be >0, yet if T is true, F' is impossible (because T's truth requires F' doesn't happen). Assigning positive credence to F' conditional on T seems irrational. Lewis concluded the original PP was untenable under Humeanism and proposed the **New Principle (NP)**: Cr(A | H & T) = ch_T(A | H), where H is the complete history of the world up to the time of the chance, and T is the complete true chance theory. The NP sets credence equal to the chance *conditional on the entire past history and the chance theory itself*. This cleverly avoids the undermining problem by conditioning on T, ensuring that only futures compatible with T are considered possible. Your credence in F' conditional on T is zero, matching the fact that ch_T(F' | H) = 0 (as F' is incompatible with T).

  **Weighing the Options:**

  1.  **Abandon the PP?** This seems drastic. The core intuition – that known objective chances rationally constrain degrees of belief – is immensely powerful and arguably captures the very essence of what chance *is for*. Neither the crystal ball nor undermining directly refutes this core normative role in standard situations. Abandoning it leaves a significant explanatory gap.
  2.  **Restrict the PP?** Lewis's move to the NP *is* a restriction, applicable only when one knows the *complete* chance theory T. It handles undermining at the cost of making the principle less generally applicable (can we ever be certain of T?) and arguably less intuitive. Admissibility clauses restrict the *evidence* the PP applies to. Both are forms of restriction, acknowledging the PP isn't universally applicable in its simplest form.
  3.  **Refine our Understanding of Chance?** This is the most compelling path forward. The exceptions don't show the PP's core idea is wrong; they show that its simplistic formulation presupposes a specific, perhaps naive, metaphysics of chance.

  *   **Crystal Ball:** This highlights that chance is *future-directed* and *incomplete*. It governs possibilities, not certainties. Chance is the guide when we *lack* direct knowledge of the future. Admissibility isn't circular if understood temporally or modally: information that *settles* the outcome, bypassing its chancy nature, is inadmissible. Defining this precisely is challenging but not necessarily impossible (e.g., information about events at or after the chance event's time).
  *   **Undermining:** This problem is deeply tied to **Humeanism**. It arises precisely because Humean chances depend on the *total* future. The undermining future isn't a flaw in the PP *per se*, but a consequence of defining chance as a summary of the entire world pattern, including the future. The NP is essentially the correct formulation *for Humean chance*. However, for **non-Humean** accounts (e.g., chances as irreducible propensities or nomological necessities), undermining often doesn't arise. If chances are primitive and govern future events without logically depending on the entire future pattern, then the original PP might remain viable. The "exception" here is less about the PP and more about the specific demands of the Humean metaphysics of chance.

  **Conclusion:**

  The crystal ball and undermining cases are not fatal exceptions justifying the abandonment of the Principal Principle. Instead, they are powerful diagnostics, revealing essential features of objective chance and the context in which it rationally guides belief. The crystal ball forces us to recognize that chance is fundamentally *prospective* and that its normative force is suspended by evidence that directly reveals outcomes. Defining admissibility non-circularly remains a challenge, but framing it in terms of temporal or modal priority (information that preempts chance's role) offers a viable, non-vacuous path. The undermining future, while deeply problematic for the *original* PP under *Humeanism*, primarily demonstrates that the correct formulation of the chance-credence link depends on one's metaphysics of chance. For Humeanism, the New Principle is likely the necessary refinement, explicitly incorporating the dependence of chance on the global pattern. For non-Humean views, the original PP may stand unmodified.

  Therefore, these cases do not show the PP needs abandonment. They show it needs careful handling. They demand that we be explicit about the temporal nature of chance and admissibility, and they crucially reveal that the precise relationship between chance and credence is sensitive to the underlying metaphysics of what chance *is*. The enduring power of the PP's core intuition – that rational belief defers to known objective probability – survives these challenges, but its precise formulation must be refined in light of them. The exceptions are genuine in exposing the limits of the simple formulation, but they illuminate the path towards a more sophisticated and metaphysically aware understanding of chance and its rational authority.
