prompt: |-
  I'm in a metaethics seminar and we've spent the last three weeks on the Frege–Geach problem. Last session I tried to reconstruct the objection to expressivism as cleanly as I could, and I ended up with an argument that seems to have a much wider scope than I intended. I'm worried I've made a mistake somewhere, but I can't locate it, and the seminar discussion didn't settle things.

  Here's the argument as I laid it out:

  (1) According to expressivism, the meaning of a moral sentence like "Lying is wrong" is constituted by the non-cognitive attitude (e.g., disapproval of lying) that it conventionally expresses.

  (2) In a conditional like "If lying is wrong, then getting your brother to lie is wrong," the antecedent "lying is wrong" occurs unasserted — the speaker does not express disapproval of lying in uttering it.

  (3) If the antecedent does not express the attitude, then by (1) its meaning in the conditional context is not the same as its meaning when it stands alone as an assertion.

  (4) If "lying is wrong" means one thing in the antecedent and another thing in the standalone premise, then the following argument commits the fallacy of equivocation: "If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong."

  (5) That argument is a valid instance of modus ponens and does not commit any fallacy.

  (6) Therefore, expressivism cannot account for the validity of simple moral reasoning, and is false.

  So far this is just the standard objection. But here's what's bothering me. The argument's structure doesn't seem to turn on any feature specific to moral language. You could run the same argument against imperatives: "If it rains, shut the window. It's raining. So shut the window." If imperatives express directives rather than propositions, then "shut the window" in the consequent of the conditional is not issued as a directive, so it means something different, and the inference equivocates — which is absurd, because we all recognize that inference as valid. The same goes for interrogatives in disjunctions, optatives embedded under negation, and so on. So the argument I've constructed, if sound, would prove that no non-propositional semantics can work for any domain of discourse — imperative logic, erotetic logic, the whole lot. That seems like a wildly excessive conclusion, and it makes me suspect that something has gone wrong in the way I've set the argument up, even though each step felt plausible as I wrote it.

  Which premise or step in (1)–(6) should a defender of expressivism reject, and why? In your answer, explain why that step looked plausible in the first place, what rejecting it costs, and whether the cost is unique to moral expressivism or is shared by non-propositional theories of imperatives, questions, and other non-assertoric speech acts. End with \answer{the number of the premise you think should be rejected, or 'none' if you think the argument is sound and the conclusion must be accepted}.
reasoning: |-
  We are given an argument (1)-(6) against expressivism, but the worry is that the same argument would rule out any non-propositional semantics (for imperatives, questions, etc.). The goal is to identify which premise the expressivist should reject.

  Let me restate the argument:

  (1) Expressivism: The meaning of a moral sentence is constituted by the non-cognitive attitude it conventionally expresses.

  (2) In a conditional, the antecedent (e.g., "lying is wrong") is unasserted, so the speaker does not express the attitude of disapproval.

  (3) Therefore, in the conditional, the antecedent does not have the same meaning as when asserted (because meaning is the attitude expressed, and in the conditional no attitude is expressed).

  (4) If the meaning changes between the conditional antecedent and the standalone assertion, then an argument that uses both (like modus ponens) would commit the fallacy of equivocation.

  (5) But that modus ponens argument is valid and does not equivocate.

  (6) Therefore, expressivism is false.

  The problem is that the same argument seems to apply to imperatives:

  - (1') For imperatives, the meaning of "Shut the window" is constituted by the directive (command) it expresses.

  - (2') In a conditional like "If it rains, shut the window", the consequent "shut the window" is unasserted (not issued as a command at that moment).

  - (3') Therefore, in the conditional, "shut the window" does not mean the same as when used alone.

  - (4') Then the modus ponens argument: "If it rains, shut the window. It is raining. Therefore, shut the window." would equivocate.

  - (5') But this inference is valid.

  - (6') Therefore, a non-propositional account of imperatives is false.

  But we know that there are accounts of imperative logic that try to make sense of such conditionals without equivocation. Similarly for questions: "If it rains, should we shut the window?" and then "It is raining" implies "Should we shut the window?" without equivocation.

  So the expressivist (or any non-propositional theorist) must reject one of the steps.

  The key is to see that the expressivist can reject premise (3). Premise (3) says that if the antecedent (or in the imperative case, the consequent) does not express the attitude, then its meaning is different.

  But the expressivist might argue that the meaning of a sentence is not the act of expressing an attitude on a particular occasion, but rather the type of attitude that it is conventionally used to express. That is, meaning is given by the conventional expressive role, not by whether on a particular occasion the attitude is expressed.

  In the case of the conditional, the antecedent "lying is wrong" still has the same conventional expressive role: it is the kind of sentence that, when asserted, expresses disapproval of lying. But in the conditional, it is not being used to express that attitude. However, its meaning (its conventional expressive role) remains the same.

  Similarly, for imperatives: "shut the window" in the conditional consequent still has the same conventional meaning (it is a directive to shut the window) even though in the conditional it is not being used to issue a directive at that moment. The meaning is the same because the conventional role is the same.

  So, in step (3), the expressivist can say that the antecedent in the conditional does not express the attitude, but that does not mean its meaning changes. The meaning is the same because the sentence retains its conventional expressive potential. The meaning is not identified with the act of expression on an occasion, but with the expressive potential that is part of the sentence's conventional role.

  Therefore, step (3) is the one to reject.

  Why did it look plausible? Because in a standalone assertion, the sentence is used to express the attitude, but in the conditional it is not. So one might think that the meaning (being the attitude expressed) is absent in the conditional. But the expressivist can (and must) distinguish between the meaning (conventional expressive role) and the use on an occasion. The meaning is what is conventional and invariant, while the expression of the attitude is a matter of use.

  What is the cost? The expressivist must provide a semantics for complex sentences that explains how the expressive roles of parts combine. This is a challenge, but there are expressivist attempts to do so (e.g., by using a propositional surrogate or by developing a logic of attitudes). Similarly, for imperatives, there are accounts of conditional commands that do not require the consequent to be issued as a command in isolation.

  The cost is shared by all non-propositional theories. They must explain how embedded occurrences of their sentences (in conditionals, disjunctions, etc.) can have the same meaning as when unembedded. This is the heart of the Frege-Geach problem. But it does not mean it's impossible. There are expressivist and non-propositional accounts that attempt to solve this by a more sophisticated semantics.

  So, the expressivist should reject premise (3).

  Let me check the other premises:

  (1) is the expressivist thesis, so they accept it.

  (2) they accept: in the conditional, the antecedent is not asserted, so the attitude is not expressed.

  (3) they reject: the meaning is not the same only if the attitude is expressed; the meaning is the conventional expressive role, which is present even when the attitude is not expressed.

  (4) then does not follow because the meaning is the same.

  (5) they accept.

  (6) then does not follow.

  Thus, the answer is to reject (3).

  Now, to confirm: is there a unique cost to moral expressivism? No, the same issue arises for imperatives, questions, etc. So the cost is shared. But that does not mean it cannot be borne. The non-propositional theorist must develop a semantics that accounts for embedding without changing meaning. This is a challenge, but not necessarily a fatal one.

  Therefore, the premise to reject is (3).
answer: |-
  The argument you've reconstructed does indeed have a wider scope than just moral expressivism, as it threatens any non-propositional semantics (e.g., for imperatives, interrogatives, or optatives) by suggesting that embedded occurrences of sentences must change meaning, leading to equivocation in inferences like modus ponens. However, a defender of expressivism (or any non-propositional theory) should reject **premise (3)**. Here's a detailed explanation:

  ### Why Premise (3) Should Be Rejected
  Premise (3) states: "If the antecedent does not express the attitude, then by (1) its meaning in the conditional context is not the same as its meaning when it stands alone as an assertion." This premise assumes that the meaning of a sentence is identical to the act of expressing an attitude on a particular occasion of use. However, expressivists (and non-propositional theorists more broadly) can and do reject this by distinguishing between:
  - **The conventional expressive role of a sentence**: This is the sentence's invariant, context-independent meaning, defined by the type of mental state it is conventionally used to express (e.g., disapproval for moral sentences, a command for imperatives).
  - **The act of expressing an attitude on a specific occasion**: This is a context-dependent speech act that may or may not occur when the sentence is embedded (e.g., in a conditional, the antecedent is not used to express disapproval or issue a command).

  On this view, the meaning of a sentence is constituted by its conventional expressive role, not by whether an attitude is actively expressed in every utterance. Thus, in a conditional like "If lying is wrong, then getting your brother to lie is wrong," the antecedent "lying is wrong" retains its conventional role of expressing disapproval of lying, even though no disapproval is actively expressed in that context. Its meaning remains the same as in a standalone assertion; only its use (and thus the speaker's act) differs.

  ### Why Premise (3) Initially Seems Plausible
  Premise (3) appears plausible because expressivism is often introduced by emphasizing the connection between moral utterances and the expression of attitudes. For example:
  - In a standalone assertion of "Lying is wrong," the speaker clearly expresses disapproval, making it easy to conflate the meaning with the act of expression.
  - When a sentence is embedded (e.g., in a conditional), the absence of an expressed attitude (e.g., no disapproval is felt or conveyed) creates an intuitive contrast. This invites the mistaken inference that if the attitude isn't expressed, the meaning must be different.

  This conflation between meaning and speech act is natural but not necessary. Expressivists can argue that meaning is a property of the sentence type (based on its conventional role), not a property tied to every token use.

  ### The Cost of Rejecting Premise (3)
  Rejecting (3) comes with a significant cost: Expressivists must develop a compositional semantics that explains how sentences with non-propositional meanings embed in complex contexts without changing meaning. Specifically, they need to:
  - **Account for logical validity**: Provide a theory of how inferences like modus ponens work when the components express attitudes rather than truth-conditions. For example, they might appeal to the consistency or inconsistency of attitudes (e.g., in modus ponens, accepting the conditional and the antecedent commits one to the consequent's attitude).
  - **Handle embedding generally**: Explain how unasserted occurrences (e.g., in disjunctions, negations, or questions) retain their conventional expressive role. This requires constructing a systematic framework where the meaning of complex sentences is built from the expressive roles of their parts.

  This challenge is not unique to moral expressivism—it is shared by all non-propositional theories:
  - **Imperatives**: A theory of imperatives must explain why "shut the window" in "If it rains, shut the window" has the same meaning (directive role) as when used alone, even though no command is issued in the conditional. Solutions might involve defining validity in terms of commitment to actions (e.g., if you accept the conditional command and the factual premise, you are committed to obeying the command).
  - **Interrogatives and others**: For questions in disjunctions (e.g., "Is it raining, or should we leave?"), the interrogative must retain its questioning role without being actively posed. Erotetic logic addresses this by defining validity through answerhood conditions.

  The cost is thus a theoretical burden: Non-propositional theories must provide a robust semantics for embedding, which is complex and less straightforward than truth-conditional approaches. However, this is not a fatal flaw—expressivists like Allan Gibbard and Simon Blackburn have developed such accounts (e.g., using norm-acceptance or higher-order attitudes). Similarly, dynamic semantics for imperatives (e.g., by Julia Portner) shows how embedded commands can retain their meaning.

  ### Why Other Premises Are Less Problematic
  - **(1)**: Expressivists accept this as a core tenet, but they interpret "meaning" as conventional expressive role, not token expression.
  - **(2)**: Everyone accepts that embedded clauses are unasserted (no attitude is expressed in that context).
  - **(4) and (5)**: If (3) is rejected, (4) no longer follows—there is no equivocation because meaning remains constant. (5) is uncontroversial.
  - **(6)**: If (3) is rejected, the conclusion does not follow.

  ### Conclusion
  Rejecting premise (3) allows expressivism (and other non-propositional theories) to avoid the charge of equivocation by decoupling meaning from the act of expression in specific contexts. The cost—developing a compositional semantics for embedded contexts—is shared across all non-propositional domains but is not insurmountable. Your argument's wide scope reveals a general challenge for non-propositional semantics, but it does not prove them impossible; instead, it highlights the need for sophisticated accounts of embedding.

  \answer{3}
