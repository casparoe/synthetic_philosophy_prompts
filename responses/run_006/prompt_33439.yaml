prompt: |-
  I'm a software engineer with no formal background in philosophy, and I keep getting stuck on the inefficacy objection to individual contributions to collective harms: if the flight departs or the animal is killed no matter what I do, then (the objection says) my action makes no difference, so it isn't wrong. I think about this the way I think about two systems with identical observable state but different hidden causal paths, and I'd like a thought experiment built to isolate one variable: whether we assess an action by its actual consequences or by its expected consequences given the agent's evidence. Construct two cases to the following specification. The collective harm is a single threshold outcome: it either occurs or does not occur. Both cases are ordinary consumer choices with identical options, identical payoffs, identical evidence for the agent, and the same ex ante probability that the agent's choice is pivotal; the two cases are indistinguishable from the agent's point of view. In Case A, the agent's choice in fact crosses the threshold and triggers the harm. In Case B, the harm is overdetermined: enough other people have already acted that the harm would occur whether or not this agent acts. In both cases, the action has no effect on anyone else's behavior — no signaling, no norm-setting, no influencing others. Then walk through the verdicts. Show that an actual-consequence (ex post) act-consequentialist must condemn Case A but not Case B, while an expected-value (ex ante) consequentialist must give the same verdict in both cases, whichever verdict that is given the shared probabilities. Identify the structural feature that does the work, explain what happens to the pair if each agent knows their causal role in advance, and say how a defender of the actual-consequence view would attack the case. The point of the pair is to test whether the inefficacy objection gets its force from an ex post standard of actual difference, so the cases must generate the verdicts from the two standards rather than stipulating them. After the walkthrough, give a brief table with these columns: Case; Causal structure; Ex post verdict and reasoning; Ex ante verdict and reasoning; Feature responsible for any divergence.
reasoning: |-
  We are constructing two cases that are indistinguishable to the agent but differ in the hidden causal structure. The key is that in both cases, the agent has the same evidence and the same ex ante probability of being pivotal. However, in Case A the agent is actually pivotal (their action triggers the harm), while in Case B the harm is overdetermined (the agent's action does not cause the harm because the harm would have happened anyway).

  Specifications:
  - Collective harm: single threshold outcome (e.g., 100 units of harm-causing actions trigger the harm).
  - Agent's options: either to perform the harm-causing action (e.g., buy a product that contributes to the harm) or not.
  - Payoffs: identical in both cases for the agent (e.g., they get a benefit from acting, and no direct harm to themselves).
  - Evidence: the agent knows the threshold and the current state (but in Case B, the threshold has already been reached by others, and in Case A, the agent's action is the one that reaches the threshold). However, from the agent's perspective, they cannot tell whether the threshold has already been reached or not. So they assign the same probability (say p) to being pivotal in both cases.

  Let's define the cases:

  **Case A: Pivotal Action**
  - The threshold for the harm is 100 units (e.g., 100 flights must be booked for a harmful project to proceed, or 100 animals must be ordered for a slaughter to occur).
  - Currently, 99 units have been committed by others.
  - The agent's action (booking one flight) would bring the total to 100, triggering the harm.
  - If the agent does not act, the total remains at 99 and the harm does not occur (at least not from this collective action).

  **Case B: Overdetermined**
  - The threshold for the harm is 100 units.
  - Currently, 100 units have already been committed by others (so the harm will occur regardless of what the agent does).
  - The agent's action (booking one flight) would make the total 101, but the harm has already been triggered by the first 100.
  - If the agent does not act, the total is 100 and the harm occurs.

  But note: in Case B, the agent does not know that the threshold has already been reached. They only know that the current count is either 99 or 100? Actually, we need to design the evidence so that the agent cannot distinguish between the two cases.

  How about we set up the evidence as follows: the agent knows that the current count is either 99 or 100, and they assign a 50% probability to each. Then:

  - In Case A, the actual current count (before the agent acts) is 99.
  - In Case B, the actual current count is 100.

  But note: in Case B, if the current count is 100, then the harm is already triggered and will occur regardless. The agent's action (or inaction) does not change that.

  Now, the agent's evidence: they are told that the current count is either 99 or 100, and they think each is equally likely. Therefore, the ex ante probability that the agent is pivotal (i.e., that the current count is 99 and their action would trigger the harm) is 50%. Similarly, the probability that the harm is already overdetermined (current count 100) is 50%.

  In both cases, the agent has two choices: Act (contribute) or Not Act.

  Let the harm be a bad outcome that we want to avoid (e.g., an animal is killed, or a harmful project proceeds). We assume that the harm is bad and we want to prevent it. The agent's action (if pivotal) causes the harm, which is bad. If not pivotal, then acting doesn't cause the harm (but also doesn't prevent it). We also assume that acting gives the agent a personal benefit (say, +10 units of utility) and, if the harm occurs, it causes a large disutility (say, -1000 units) to some victim. However, note that the agent does not experience the disutility of the harm; only the victim does. So the agent's personal payoff from acting is +10, and from not acting is 0 (we assume). But the consequentialist evaluation considers the total utility.

  Now, the harm is a collective harm. We must consider the total consequences.

  **Verdicts by Actual-Consequence (Ex Post) Consequentialism:**

  - **Case A (Pivotal):**
    - If the agent acts: harm occurs (which wouldn't have occurred otherwise). The agent gets +10, but the victim suffers -1000. Total: -990.
    - If the agent does not act: harm does not occur. Agent gets 0, victim is fine. Total: 0.
    - Therefore, acting causes a net harm. The actual consequence of acting is bad. So the act is wrong.

  - **Case B (Overdetermined):**
    - If the agent acts: harm occurs (but it would have occurred anyway). The agent gets +10. The victim suffers -1000 (but this would have happened regardless). So total: -990? But note: the harm was going to happen regardless. So the agent's action only adds the benefit for themselves and does not change the victim's fate. Therefore, the actual consequence of acting is: the world has an extra +10 (from the agent) and the same harm, so compared to not acting (where the agent doesn't get the +10 and the harm still occurs) the difference is +10. Alternatively, we can compare:
        - Acting: agent +10, victim -1000 -> total -990
        - Not acting: agent 0, victim -1000 -> total -1000
        - So acting leads to -990, which is better than not acting (-1000). Therefore, acting is actually beneficial? But note: the harm is fixed. So the agent's action only brings about the benefit without causing any extra harm. Therefore, the actual consequence of acting is better than not acting.

    However, wait: the harm is a threshold event. In both scenarios (acting and not acting) the harm occurs. The only difference is that when acting, the agent gets +10. So the net effect of acting is +10 (compared to not acting). Therefore, according to actual-consequence consequentialism, acting in Case B is actually good (or at least better than not acting) because it increases total utility by 10.

    But note: the agent's action does not cause the harm. It only adds a benefit. Therefore, the action is permissible (or even required if we are maximizing utility).

  So for Case B, the actual-consequence consequentialist says: acting is not wrong (in fact, it is good).

  **But note the inefficacy objection:** The inefficacy objection typically says that when your action doesn't make a difference (as in Case B), it isn't wrong. And that is what we see: in Case B, acting isn't wrong because it doesn't cause the harm and it gives the agent a benefit.

  However, in Case A, it is wrong because it does cause the harm.

  So the actual-consequence consequentialist gives different verdicts for the two cases: condemns A, permits B.

  **Verdicts by Expected-Value (Ex Ante) Consequentialism:**

  The agent must choose based on the expected consequences given their evidence. The agent knows:
  - With 50% probability, the current count is 99 (so they are pivotal).
  - With 50% probability, the current count is 100 (so their action is overdetermined).

  If the agent acts:
    - In the pivotal state (50%): they cause the harm (disutility -1000) and get +10. So net: -990.
    - In the overdetermined state (50%): they get +10 and the harm occurs regardless (so no additional harm caused). The harm is already happening, so the net effect of acting (compared to not acting) is +10 (because without acting, the harm still happens and they don't get the benefit). So the outcome in this state is: total utility -1000 (from the harm) plus +10 (from the agent) = -990? But note: without the agent's action, the total utility would have been -1000 (harm occurs and agent gets 0). With the agent's action, it's -1000 (harm) +10 (agent) = -990. So the net change from acting in this state is +10.

  But wait, we are comparing the state of the world if the agent acts vs. if the agent does not act. In the overdetermined state, the harm occurs regardless. So:

  - If the agent does not act: utility = 0 (agent) + (-1000) (harm) = -1000.
  - If the agent acts: utility = +10 (agent) + (-1000) (harm) = -990.

  Therefore, acting in the overdetermined state leads to a utility of -990, which is 10 higher than not acting (-1000). So the net effect of acting in that state is +10.

  Now, the expected utility of acting:
    - 50% chance: state pivotal -> utility -990
    - 50% chance: state overdetermined -> utility -990? Wait, no: in the overdetermined state, the utility of acting is -990, but note that the utility in the overdetermined state if the agent doesn't act is -1000. However, for the expected value of the *act*, we only care about the outcome of the act.

  Actually, we should compute the expected utility of acting and the expected utility of not acting.

  Let:
  - State Pivotal (prob=0.5): 
      - Act: harm occurs -> agent gets +10, victim -1000 -> total -990
      - Not act: harm does not occur -> agent 0, victim 0 -> total 0
  - State Overdetermined (prob=0.5):
      - Act: harm occurs (anyway) -> agent +10, victim -1000 -> total -990
      - Not act: harm occurs -> agent 0, victim -1000 -> total -1000

  Therefore:

  Expected utility of acting:
    = (0.5 * (-990)) + (0.5 * (-990)) 
    = 0.5 * (-990) + 0.5 * (-990) 
    = -990

  Expected utility of not acting:
    = (0.5 * 0) + (0.5 * (-1000))
    = 0 + (-500) 
    = -500

  Therefore, the expected utility of not acting (-500) is higher than the expected utility of acting (-990). So the expected-value consequentialist would say that acting is wrong because it leads to a lower expected utility.

  Alternatively, note that the difference in expected utility between acting and not acting is:
    = [ -990 ] - [ -500 ] = -490

  So acting reduces expected utility by 490.

  Therefore, the expected-value consequentialist condemns acting in both cases because the expected utility of acting is lower than not acting.

  Alternatively, we could compute the expected utility of each act:

  Act: 
    In pivotal state: -990
    In overdetermined: -990
    Expected: 0.5 * (-990) + 0.5 * (-990) = -990

  Not act:
    In pivotal: 0
    In overdetermined: -1000
    Expected: 0.5*0 + 0.5*(-1000) = -500

  So not acting has an expected utility of -500, which is greater than -990. Therefore, the agent should not act.

  Hence, the expected-value consequentialist says: in both Case A and Case B, the agent should not act. Therefore, the verdict is the same for both cases: acting is wrong.

  **Summary of Verdicts:**

  - **Actual-Consequence (Ex Post) Consequentialism:**
    - Case A: Wrong (because it causes the harm)
    - Case B: Not wrong (because it doesn't cause the harm and it provides a benefit)

  - **Expected-Value (Ex Ante) Consequentialism:**
    - Both cases: Wrong (because the expected utility of acting is lower than not acting)

  **Structural Feature Responsible for Divergence:**

  The divergence arises because the actual-consequence view looks at the actual causal role of the action in the particular world, while the expected-value view looks at the probabilities at the time of decision. In Case B, the actual causal role is non-pivotal, so the action does not cause harm and only brings a benefit. But the expected-value view sees a 50% chance of being pivotal (and causing a large harm) and only a 50% chance of being non-pivotal (and getting a small benefit). The harm is so bad that it swamps the benefit, making the expected utility of acting negative.

  **What if the agent knows their causal role in advance?**

  If the agent knows in advance whether they are in Case A or Case B:

  - In Case A (pivotal): They know that acting will cause the harm. Then both actual-consequence and expected-value consequentialists would condemn acting (because they know the actual consequences in Case A, and the expected consequences are the same as the actual).
  - In Case B (overdetermined): They know that acting will not cause the harm and will only bring a benefit. Then:
      - Actual-consequence: acting is good (as above).
      - Expected-value: since they know they are in Case B, the expected utility of acting is just the utility in Case B: -990? But wait, in Case B, acting leads to -990 and not acting leads to -1000. So acting is better. Therefore, they would permit (or require) acting.

  So if the agent knows, then both views align with the actual causal structure.

  **How a defender of the actual-consequence view would attack the case:**

  A defender of the actual-consequence view might argue that the case setup is unfair because it requires the agent to act under uncertainty. They might say that the actual-consequence view is not meant to be a decision procedure but rather a criterion of rightness. That is, the rightness of an action is determined by its actual consequences, not by what the agent could have foreseen. Therefore, the actual-consequence view is correct in giving different verdicts in the two cases because the actual consequences are different. They might also point out that in Case B, the agent's action does not cause the harm and in fact makes the world better (by +10), so it is permissible. The inefficacy objection, they would say, is correct in Case B: the agent's action doesn't cause the harm and is therefore not wrong.

  However, the actual-consequence view might be criticized for not providing guidance in decision-making under uncertainty. The defender might respond that the view is not intended for that; it is a theory about what makes an act right or wrong, not about how to decide. They might then advocate for a two-tier system: use expected utility as a decision procedure, but judge the act by its actual consequences.

  **Table:**

  | Case | Causal structure        | Ex post verdict and reasoning                                                                 | Ex ante verdict and reasoning                                                                                                | Feature responsible for divergence |
  |------|-------------------------|-----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|-----------------------------------|
  | A    | Pivotal: agent triggers the harm | Wrong: because the action causes the harm (leads to -990 vs. 0 if not acting)                 | Wrong: because the expected utility of acting (-990) is less than not acting (-500)                                         | The ex post view looks at actual causal role in the specific world, while the ex ante view averages over possible worlds given the evidence. |
  | B    | Overdetermined: harm occurs regardless | Not wrong: because the action does not cause the harm and brings a benefit (acting: -990, not acting: -1000; so acting is better by 10) | Wrong: same as Case A, because the expected utility of acting (-990) is less than not acting (-500) | Same as above. In Case B, the actual causal role is non-pivotal, but the ex ante view must consider the risk of being pivotal. |

  Note: In the ex ante reasoning, the expected utility of acting is the same in both cases because the agent doesn't know which case they are in. So the verdict is the same for both cases. The ex post view, however, can only be applied after the fact and thus depends on the actual causal structure.

  This pair of cases shows that the inefficacy objection (which says that if your action doesn't make a difference then it isn't wrong) is compelling for the actual-consequence consequentialist in Case B. But the expected-value consequentialist must condemn the action in both cases because of the risk of being pivotal. Therefore, the force of the inefficacy objection comes from the ex post standard of actual difference.
answer: |-
  Below is a structured thought experiment designed to isolate the variable of whether moral assessment is based on actual consequences or expected consequences, addressing the inefficacy objection in collective harm cases. The cases are constructed to be indistinguishable from the agent's perspective but differ in hidden causal structures, ensuring identical evidence, options, payoffs, and ex ante pivotality probabilities.

  ### **Case Specifications**
  - **Collective Harm**: A single threshold outcome (e.g., a harmful event occurs if ≥100 units of a harmful action are performed; otherwise, it does not).
  - **Agent's Choice**: Act (contribute 1 unit) or Not Act (contribute 0 units).
  - **Payoffs** (identical in both cases):
    - **Act**: Agent gains +10 utility (e.g., personal benefit from consumption).
    - **Not Act**: Agent gains 0 utility.
    - **Harm Occurrence**: Causes -1000 utility to victims (e.g., environmental damage or animal suffering). This disutility is independent of the agent’s personal payoff.
  - **Evidence for Agent** (identical in both cases):
    - Agent knows the threshold is 100 units.
    - Agent knows current contributions are *either* 99 or 100 units (50% probability each), but not which.
    - Thus, ex ante probability of being pivotal (i.e., current state is 99, so acting triggers harm) is 50%.
  - **No Signaling/Influence**: Actions have no effect on others' behavior—no norm-setting, imitation, or coordination.

  #### **Case A: Pivotal Action**
  - **Hidden Causal Structure**: Current contributions are at 99 units.  
    - If agent **Acts**: Total = 100 → harm occurs.  
    - If agent **Does Not Act**: Total = 99 → harm does not occur.  
  - **Actual Consequence**: Agent’s action crosses the threshold and causes harm.

  #### **Case B: Overdetermined Harm**
  - **Hidden Causal Structure**: Current contributions are already at 100 units (harm occurs regardless of agent’s choice).  
    - If agent **Acts**: Total = 101 → harm occurs (but agent does not cause it; harm was inevitable).  
    - If agent **Does Not Act**: Total = 100 → harm occurs.  
  - **Actual Consequence**: Agent’s action has no effect on harm occurrence.

  ---

  ### **Verdicts and Reasoning**
  #### **1. Actual-Consequence (Ex Post) Consequentialism**  
  Assessment based on **realized outcomes** in the actual world.  
  - **Case A (Pivotal)**:  
    - **Verdict**: Wrong.  
    - **Reasoning**: Acting causes harm (utility: +10 agent −1000 harm = −990). Not acting prevents harm (utility: 0). Difference: Acting vs. not acting changes outcome from 0 to −990. Agent’s action is causally responsible for the harm.  
  - **Case B (Overdetermined)**:  
    - **Verdict**: Not wrong (permissible, even beneficial).  
    - **Reasoning**: Harm occurs regardless. Acting adds +10 utility (utility: +10 −1000 = −990) vs. not acting (utility: 0 −1000 = −1000). Difference: Acting improves utility by +10. Agent’s action causes no harm and provides a net benefit.  

  #### **2. Expected-Value (Ex Ante) Consequentialism**  
  Assessment based on **expected utility** given the agent’s evidence at decision time.  
  - **Both Cases** (identical evidence → identical calculations):  
    - **Verdict**: Wrong to Act.  
    - **Reasoning**:  
      - **Expected Utility of Acting**:  
        - 50% chance pivotal (Case A): Utility = −990.  
        - 50% chance overdetermined (Case B): Utility = −990 (same harm occurs, but agent gains +10).  
        - **Total**: 0.5(−990) + 0.5(−990) = −990.  
      - **Expected Utility of Not Acting**:  
        - 50% chance pivotal (Case A): Utility = 0 (harm prevented).  
        - 50% chance overdetermined (Case B): Utility = −1000 (harm occurs).  
        - **Total**: 0.5(0) + 0.5(−1000) = −500.  
      - Acting has lower expected utility (−990 vs. −500). Risk of causing harm (if pivotal) outweighs guaranteed personal gain.  

  #### **Structural Feature Responsible for Divergence**  
  - **Divergence Trigger**: The ex post view depends on the **actual causal role** (pivotal vs. overdetermined) revealed in hindsight. The ex ante view depends on the **risk-weighted expected outcome** given uncertainty.  
  - **Why Divergence Occurs**:  
    - In Case B, the actual consequence is benign (+10 utility), but the ex ante view must account for the 50% risk of being pivotal (Case A), where acting would cause catastrophic harm. The ex post view ignores this counterfactual risk once the outcome is known.  

  ---

  ### **Effect of Knowing Causal Role in Advance**  
  If the agent knows their role *before* acting:  
  - **Case A (Knows Pivotal)**:  
    - **Ex Post**: Condemns acting (would cause harm).  
    - **Ex Ante**: Condemns acting (certain to cause harm; expected utility = −990 vs. 0).  
    - **Verdict Alignment**: Both condemn acting.  
  - **Case B (Knows Overdetermined)**:  
    - **Ex Post**: Permits acting (adds +10 utility, no harm caused).  
    - **Ex Ante**: Permits acting (no risk; expected utility = −990 vs. −1000).  
    - **Verdict Alignment**: Both permit acting.  
  **Key Insight**: With perfect information, both standards align because uncertainty (the source of divergence) is removed. The inefficacy objection’s force relies on hidden causal information.  

  ---

  ### **How an Actual-Consequence Defender Attacks the Case**  
  A defender of the ex post view would argue:  
  1. **Moral Luck Critique**: The cases involve "outcome luck"—Case A’s agent is unlucky to be pivotal, but this doesn’t make their act *intrinsically* worse than Case B’s. Ex post consequentialism correctly "screens off" luck by judging only what *actually* happened.  
  2. **Causal Responsibility Focus**: In Case B, the agent’s action is causally irrelevant to the harm—it only adds a benefit. Blaming them ignores the real-world outcome (no harm caused).  
  3. **Decision vs. Criterion Distinction**: Ex post consequentialism is a criterion of *rightness*, not a decision procedure. Agents should use ex ante rules (e.g., expected utility) *when ignorant*, but rightness depends on actual outcomes.  
  4. **Problem of Over-Demandingness**: Ex ante views condemn Case B’s harmless act due to mere risk, violating the inefficacy intuition. If collective harms are structured to be overdetermined (e.g., industrial meat production), individual acts are blameless.  

  ---

  ### **Summary Table**
  | Case | Causal Structure      | Ex Post Verdict & Reasoning                                      | Ex Ante Verdict & Reasoning                                     | Feature Responsible for Divergence                     |
  |------|-----------------------|------------------------------------------------------------------|-----------------------------------------------------------------|--------------------------------------------------------|
  | A    | Pivotal               | **Wrong**: Act causes harm (−990 vs. 0 if not acting).           | **Wrong**: Expected utility of act (−990) < not act (−500).     | **Hidden causal role**: Actual consequence view sees causal responsibility; expected view sees risk. |
  | B    | Overdetermined        | **Not wrong**: Act adds +10 utility (−990 vs. −1000 if not acting; no harm caused). | **Wrong**: Same expected utility calculation as Case A (risk dominates). | **Uncertainty**: Ex post view ignores ex ante risk once outcome is known; ex ante view cannot distinguish cases. |

  ### **Conclusion**  
  The thought experiment demonstrates that the inefficacy objection derives its intuitive force from the **ex post standard**: when an action *actually* causes no harm (Case B), it seems blameless. However, the ex ante standard condemns both cases due to the **risk of being pivotal**, which is equally probable in both scenarios. This divergence hinges on whether moral assessment is grounded in **actual outcomes** (ex post) or **anticipated outcomes under uncertainty** (ex ante). The cases isolate this variable, showing that the inefficacy objection is compelling only if we adopt an ex post lens—highlighting a core tension in consequentialist ethics.
