  ### Activity: Discovering Closed Timelike Curves in a Gödel-Inspired Universe  
  **Objective:** Students will actively discover closed timelike curves (CTCs) on a simplified grid representing Gödel's rotating universe, confront the paradox of revisiting their own past, and grapple with Gödel’s claim that this undermines the reality of time.  

  **Materials:**  
  - Grid worksheets (1 per group)  
  - Colored pencils/pens (2 colors per group)  
  - Timer  
  - Rules handout (see below)  

  **Grid Setup (Worksheet):**  
  - A **2D cylindrical grid** (space periodic, time linear):  
    - **X-axis (space):** 0–7 (wrap around; 0 connects to 7).  
    - **Y-axis (time):** 0–20 (increasing downward; 0 = "start," 20 = "future").  
  - **Light-cone tilting rule:** At position **x**, the light cone tilts by **k \* x** (where **k = 0.25**).  
    - Future-directed moves must stay within the tilted cone:  
      - **Right move (→):** (x+1, y + 1 - k\*x)  
      - **Left move (←):** (x-1, y + 1 + k\*x)  
  - *Example:* At **x=4**, k\*x=1. Moves:  
    - →: (5, y + 1 - 1) = (5, y)  
    - ←: (3, y + 1 + 1) = (3, y+2)  
    *(Tilt allows "slower" time to right, "faster" to left.)*  

  **Rules Handout (Student-Friendly):**  
  1. Start at **(x, y) = (0, 0)**.  
  2. On each turn, choose **→** or **←** and update position using the rules.  
  3. **Goal:** Reach **y=20** (the "future").  
  4. Track your path with color **A**.  
  5. If you return to a **past event (y < current y)**, mark it with color **B** and stop.  

  **Timeline (90 Minutes):**  
  1. **Intro (5 min):**  
     - *Instructor:* "You’re astronauts in a rotating universe. Plot paths to y=20 using the rules. If something odd happens, record it."  
     - Distribute materials. No lecture—students dive in.  

  2. **Activity Part 1: Plotting Paths (25 min):**  
     - Groups (3–4 students) plot paths from (0,0) to y=20.  
     - **Prompt:** *"Reach y=20. If you cross your own path, stop and discuss: What happened?"*  
     - Most groups will accidentally loop and return to a past event (CTC).  
     - *Example CTC Path:*  
       - Start: (0,0)  
       - → to (1, 1 - 0) = (1,1)  
       - → to (2, 1 + 1 - 0.25) = (2,1.75)  
       - ... → to (7, y ≈ 5)  
       - Wrap to (0, y ≈ 5)  
       - ← to (7, 5 + 1 + 0.25*0) = (7,6)  
       - ← to (6, 6 + 1 + 0.25*7) = (6, 8.75)  
       - ... ← to (0, y ≈ 15)  
       - **CTC:** Path crosses (0,5) at y=15 → back to (0,5)!  

  3. **Activity Part 2: Intentionally Seeking CTCs (15 min):**  
     - **New goal:** *"Start at (0,0). Can you return to your own past? Plot a CTC on purpose."*  
     - Groups use color **B** to mark the loop.  
     - **Prompt:** *"How much proper time (y-steps) did you experience? What ‘year’ (y-value) did you return to?"*  

  4. **Group Discussion (30 min):**  
     - **Share findings:** Groups describe CTC paths.  
       - *Key realization:* "We returned to (x,y) we visited earlier, but our proper time advanced."  
     - **Philosophical prompts:**  
       - *"If you meet your past self, is time linear? What is ‘now’?"*  
       - *"Does this mean time is an illusion? Or just weird physics?"*  
       - *"Why might this ‘kill the reality of time’ (à la Gödel) instead of being a quirk?"*  
     - **Map to Gödel’s argument:**  
       - In Gödel’s model, CTCs allow events to be self-caused, violating **objective becoming** (time’s flow).  
       - If time were real, "past/present/future" must be absolute—but CTCs make them observer-dependent.  
       - Gödel: Time loses meaning if the universe allows "history edits."  

  5. **Debrief (15 min):**  
     - **Connect to Gödel:**  
       - Gödel’s CTCs show Einstein’s equations permit universes where time has no global order.  
       - Thus, time can’t be a fundamental reality—it’s ideal (mind-dependent) or emergent.  
     - **Distortions in the activity:**  
       - *Oversimplified metric:* Real Gödel universes require curved spacetime; our grid is flat with artificial tilt.  
       - *No dynamics:* Real CTCs involve geodesics; we used discrete moves.  
       - *No causality stress-test:* We avoided paradoxes (e.g., killing your past self) to focus on time’s ideality.  
     - **Final reflection:** *"Did this feel like a ‘vertigo’? Why might this shake a physicist’s view of time?"*  

  **Why This Works:**  
  - Students **stumble into CTCs** organically, creating "aha!" moments.  
  - The grid **gamifies light-cone tilting**, making CTCs tactile.  
  - By plotting loops, they **feel the paradox**—proper time advances, yet they revisit the "past."  
  - Discussion links the game to Gödel’s radical conclusion: **time isn’t real** if physics allows self-visitation.  

  **Expected Outcomes:**  
  - Students move from "weird physics" to grasping why CTCs threaten **time’s objectivity**.  
  - They experience Gödel’s "vertigo" by confronting a universe where time has no arrow.  
  - The activity primes deeper debate: *Is time a human construct if spacetime permits loops?*
