      - Distortion note (5 minutes): 
            - In our model, we explicitly had a move that decreased the global time coordinate. In the actual Gödel universe, the closed timelike curves are future-directed at every point (according to the local light cone) and do not involve any explicit backward step in a preferred time coordinate. The global time coordinate in the Gödel solution is not a physical time function. Also, our model has a non-homogeneous feature: the time coordinate is not on equal footing at every point? Actually, in our model it is, but the moves are defined globally. In the actual Gödel solution, the metric is the same everywhere. Our activity also used a discrete space and time, while the real universe is continuous. But the activity captures the emergence of CTCs and the challenge to the reality of time.

