    Revised rules for the activity (simple version):

      - The grid is a circle of 4 points: A, B, C, D.
      - Two moves:
          CW: (x -> next CW, coordinate time t -> t+1), proper time +1.
          CCW: (x -> next CCW, coordinate time t -> t-1), proper time +1.

      - Task: 
          Part 1: Start at A, t=0. Can you return to A at a coordinate time before you left? How many moves does it take? What is your age when you arrive?
          Part 2: Can you return to the exact same event (A,0)? 
            - In this model, to return to the same event, you need to be at A, t=0. If you start at (A,0) and move CCW 4 times, you end at (A,-4). 
            - Then, can you travel back to (A,0) from (A,-4)? 
                  You are at (A,-4). You can move CW 4 times: 
                      (A,-4) -> (B,-3) -> (C,-2) -> (D,-1) -> (A,0). 
                  So you arrive at (A,0) having aged 8 minutes. 
                  But note, at (A,0) there is your younger self (who is about to start the trip). So you meet yourself.

          Part 3: Imagine you are at A at t=0 and you decide to move as follows: 
                  Move CCW 4 times: you are at (A,-4) and have aged 4 minutes.
                  Then move CW 4 times: you arrive at (A,0) and have aged 8 minutes.
                  So you are 8 minutes older than when you started. 
                  But at the starting event (A,0), there are now two versions of you: the one about to start and the one who has just returned.

          This is the grandfather paradox? Not exactly, but it's a self-encounter.

    Timeline for the activity (90 minutes):

      - Introduction (5 minutes): 
