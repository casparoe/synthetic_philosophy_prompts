prompt: |-
  Hi, so I work at a mid-sized family foundation. We fund stuff across a bunch of different areas — arts education, environmental restoration, legal aid for tenants, a summer camp for kids with disabilities, you get the idea. My job is to evaluate grant proposals and recommend which ones to fund, and our board basically rubber-stamps whatever I bring them.

  The problem is we get way more good proposals than we can fund, and I keep hitting a wall where I'm trying to compare things that don't seem comparable. Like, how do I weigh a program that teaches music to incarcerated teenagers against a wetlands restoration project against a free clinic? They're all good in totaly different ways. My board chair just says "go with your gut," but my gut feels like it's making arbitrary calls dressed up as judgment.

  I know philosophers have thought about this — incommensurable values, hard choices, stuff from Isaiah Berlin, Ruth Chang, people like that. I don't need a seminar on it. What I need is an actual procedure I can follow when I have to put five wildly different proposals in front of me and pick two. Something step-by-step that doesn't pretend the incommensurability away (like "just monetize everything" or "use a forced ranking") but that helps me make a defensible choice without fooling myself about what I'm doing.

  The procedure has to be something I can actually run in a couple hours per batch, it should flag the points where I'm making a value judgment rather than applying a rule, and it should be honest about what kinds of proposals it'll fail on. Once you've laid out the procedure, walk me through applying it to three proposals: (1) a legal aid clinic that keeps families from being wrongfully evicted, (2) an after-school music program in a low-income neighborhood, and (3) a project to restore a polluted urban creek. Then show me a case where the procedure gives me an answer I'm not going to like — where it points in a direction that feels wrong but the logic holds up and I'd have to override it explicitly. Finally, tell me what the procedure can't handle and where I should just stop and call a board meeting instead.
reasoning: |-
  Okay, the user works at a family foundation evaluating diverse grant proposals and struggles with comparing incommensurable values. They need a practical, step-by-step procedure that acknowledges the incomparability but still allows defensible decisions. 

  First, I need to understand their pain points: They reject simplistic methods like monetization or forced ranking, want transparency about value judgments, and need efficiency (couple hours per batch). Their examples—legal aid, music program, creek restoration—are intentionally disparate to test the method. 

  The core challenge is designing a framework that doesn't fake objectivity but structures subjectivity. I recall Ruth Chang's "hard choices" work where values aren't better/worse but "on a par," requiring commitment rather than calculation. But they explicitly want tactics, not theory. 

  Hmm... a three-stage process might work: 
  1) **Threshold filtering** (practical viability) to eliminate non-starters fast. 
  2) **Value mapping** (qualitative assessment across dimensions like impact scale, foundation fit, innovation etc.), but with clear "judgment flags" where subjectivity enters. 
  3) **Comparative deliberation** focused on trade-offs rather than scores, using pairwise questions like "Which loss would we regret more?" to force explicit value confrontations. 

  For the examples: The legal aid clinic has high urgency (prevents homelessness), music program builds long-term community capital, creek restoration offers environmental legacy. The procedure might surprisingly deprioritize the clinic if impact depth outweighs urgency—a result that'd feel counterintuitive but logically consistent if the foundation values generational change over immediate crisis response. 

  Red flags for board escalation would include ties after deliberation, proposals involving irreversible commitments, or anything crossing ethical boundaries. The key is making the "why" transparent so the board understands the trade-offs baked into the recommendation. 

  ...Wait, did I just reinvent multi-criteria decision analysis but with philosophical honesty? Maybe, but the judgment flags and deliberate omission of numerical aggregation feel crucial for their anti-reductionism stance. Let me stress-test it with the "uncomfortable outcome" case...
answer: |-
  Here's a practical, values-explicit procedure designed for exactly your dilemma. It forces you to confront the incommensurability head-on and makes your value judgments transparent. It's called the **Value-Weighted Threshold & Trade-off Procedure (VWTTP)**.

  **Core Principles:**
  1.  **Thresholds First:** Eliminate non-starters quickly based on basic feasibility and fit.
  2.  **Map Value Dimensions:** Assess proposals across distinct, non-reducible value categories relevant to *your foundation*.
  3.  **Weight by Strategic Emphasis (Judgment Flag #1):** Explicitly state *which* value dimensions matter most *right now* for *this funding cycle*.
  4.  **Flag Outliers:** Identify proposals that are exceptionally strong/weak on *any* key dimension.
  5.  **Forced Trade-off Deliberation (Judgment Flag #2):** Compare proposals *pairwise* on the *weighted dimensions*, forcing explicit choices about "what kind of good" you prioritize.
  6.  **Document the "Why":** Record the key trade-offs made and value judgments applied.

  **The VWTTP Procedure (2-3 Hours/Batch):**

  1.  **Define Scope & Weights (15 mins - *Judgment Flag #1*):**
      *   Review your foundation's mission and any current strategic priorities (e.g., "focus on urgent needs this year," "build long-term capacity," "address systemic inequity," "maximize geographic reach").
      *   **Define 3-5 Value Dimensions:** What kinds of "good" matter? Examples:
          *   **Urgency/Preventing Harm:** How immediate and severe is the negative consequence if not funded? (e.g., homelessness, irreversible environmental damage, loss of critical service)
          *   **Impact Depth:** How significantly does this change lives/conditions for the *direct beneficiaries*? (e.g., transformative vs. incremental)
          *   **Impact Scale:** How many people/natural units are directly affected? (Be realistic!)
          *   **Leverage/Catalysis:** Does this unlock other resources, change systems, or build lasting capacity?
          *   **Foundation Fit:** How closely does this align with our specific mission, history, geographic focus, or donor intent? How strong is the relationship?
          *   **Innovation/Uniqueness:** Does this fill a critical gap or offer a novel solution others aren't providing?
      *   **Assign Current Weights:** For *this specific batch*, assign weights to your dimensions (e.g., Urgency 40%, Impact Depth 25%, Leverage 20%, Foundation Fit 15%). *This is your major, explicit value judgment.* Write it down.

  2.  **Initial Threshold Screening (15-30 mins):**
      *   Apply basic, non-negotiable filters concurrently:
          *   **Feasibility:** Is the organization capable? Budget realistic? Timeline sensible?
          *   **Compliance:** Does it meet legal/regulatory requirements for our grants?
          *   **Basic Alignment:** Is it even vaguely within our stated funding areas? (Don't waste time on clear misfits).
      *   **Result:** A shortlist of viable proposals that passed the threshold. Focus only on these.

  3.  **Value Dimension Mapping (60-75 mins):**
      *   For each shortlisted proposal, assess it *qualitatively* against each value dimension. Use a simple scale (e.g., Low/Medium/High/Exceptional) *or* brief descriptive notes. **Crucially:**
          *   **Do NOT add scores.** Keep dimensions separate.
          *   **Flag Outliers:** Note if a proposal is *Exceptional* on any dimension or *Low* on a dimension weighted above, say, 15%. (e.g., "Music Program: *Exceptional* on Impact Depth (transformative for participants)")

  4.  **Comparative Trade-off Deliberation (30-45 mins - *Judgment Flag #2*):**
      *   **Pairwise Comparison:** Take the top contenders (based on initial mapping/outliers) and compare them **two at a time**.
      *   **Focus Question:** *"Given our current weights (Urgency 40%, Depth 25%, etc.), if we could ONLY fund ONE of these two, which would we choose, and WHY based on the weighted dimensions?"*
      *   **Force the Trade-off:** Articulate the specific sacrifice: "We'd fund A over B because preventing immediate harm (Urgency 40%) outweighs B's larger scale but less transformative impact (Scale vs. Depth)."
      *   **Document the Why:** For each pairwise decision, note the key 1-2 dimensions driving the choice *and* the value judgment inherent in prioritizing that dimension over the other's strengths.
      *   **Iterate:** Compare winners until you have your ranked list.

  5.  **Review & Document (15 mins):**
      *   Review the ranked list. Does it feel consistent with the weights and trade-offs documented?
      *   **Final Documentation:** For the board packet (even if they rubber-stamp):
          *   Shortlist proposals considered.
          *   Defined Value Dimensions & **Weightings Used (Highlighted as Key Judgment)**.
          *   Brief mapping summary (e.g., "Legal Aid: High Urgency, High Impact Depth (for families), Med Scale, High Fit").
          *   **Key Trade-offs Made:** Summarize the 1-3 most critical pairwise decisions and the reasoning (e.g., "Prioritized Legal Aid over Creek Restoration due to higher weighting on Urgency (preventing eviction) vs. Leverage (potential ecological catalyst)").
          *   **Outliers Noted:** (e.g., "Music Program flagged as Exceptional on Impact Depth").

  ---

  **Applying VWTTP to Your Three Proposals:**

  1.  **Define Scope & Weights (Judgment #1):** Assume your Board Chair subtly hinted they're worried about immediate community crises this year.
      *   Value Dimensions & Weights:
          *   Urgency/Prevent Harm: **40%** (High Weight)
          *   Impact Depth: **25%**
          *   Leverage/Catalysis: **20%**
          *   Foundation Fit: **15%** (Assume all fit reasonably well)
      *   (Scale omitted for simplicity; assume all have moderate scale relative to their domain).

  2.  **Threshold Screening:** All three proposals are from reputable orgs, feasible, compliant, and fit your areas. All shortlisted.

  3.  **Value Dimension Mapping:**
      *   **Proposal 1: Legal Aid Clinic (Prevent Wrongful Evictions)**
          *   Urgency/Prevent Harm: **High** (Imminent risk of homelessness for families)
          *   Impact Depth: **High** (Preventing homelessness is deeply transformative for a family)
          *   Leverage: **Medium** (Helps individual families, may set precedents but systemic change is slow)
          *   Fit: **High**
      *   **Proposal 2: After-School Music Program**
          *   Urgency/Prevent Harm: **Low** (Important, but harm prevented is less immediate/severe - e.g., lack of enrichment vs. homelessness)
          *   Impact Depth: **Exceptional** (Can be profoundly transformative for individual children's development, confidence, future)
          *   Leverage: **Medium** (Builds skills/community, but direct systemic change is limited)
          *   Fit: **High**
          *   **Outlier Flag:** *Exceptional Impact Depth*
      *   **Proposal 3: Polluted Urban Creek Restoration**
          *   Urgency/Prevent Harm: **Medium-High** (Ongoing ecological damage, public health risks might exist, but not *imminent* crisis for individuals like eviction)
          *   Impact Depth: **Medium** (Significant ecological improvement, benefits many species and residents *over time*)
          *   Leverage: **High** (Can catalyze further restoration, boost property values, community engagement, significant environmental benefit)
          *   Fit: **High**

  4.  **Comparative Trade-off Deliberation (Judgment #2):**
      *   **Pair 1: Legal Aid vs. Music Program**
          *   *Question:* Only fund one?
          *   *Trade-off:* Legal Aid has **High Urgency (40%)** vs. Music's **Exceptional Impact Depth (25%)**.
          *   *Decision & Why:* **Fund Legal Aid.** Preventing immediate, severe harm (homelessness) aligns strongly with the high weight on Urgency. Music's exceptional depth is compelling, but Urgency is weighted nearly double Depth. *Sacrifice:* Profound individual transformation for children (Depth) to prevent catastrophic harm (Urgency).
      *   **Pair 2: Legal Aid vs. Creek Restoration**
          *   *Question:* Only fund one?
          *   *Trade-off:* Legal Aid **High Urgency (40%)** & **High Depth (25%)** vs. Creek **Medium-High Urgency (40%)**, **Medium Depth (25%)**, but **High Leverage (20%)**.
          *   *Decision & Why:* **Fund Legal Aid.** While the Creek has good Urgency and strong Leverage, Legal Aid scores higher on the top-weighted dimension (Urgency - preventing individual family crises vs. ongoing ecological damage). Depth is also stronger for Legal Aid. Leverage (20%) isn't enough to overcome this. *Sacrifice:* Potential catalytic environmental/systemic benefits (Leverage) for preventing acute human harm (Urgency/Depth).
      *   **Pair 3: Music Program vs. Creek Restoration** (To complete the ranking)
          *   *Question:* Only fund one?
          *   *Trade-off:* Music **Exceptional Depth (25%)** but **Low Urgency (40%)** vs. Creek **Medium-High Urgency (40%)**, **Medium Depth (25%)**, **High Leverage (20%)**.
          *   *Decision & Why:* **Fund Creek Restoration.** Creek scores significantly better on the highest-weighted dimension (Urgency: Medium-High vs. Low) and better on Leverage. Music's Exceptional Depth (25%) is powerful, but Urgency (40%) is weighted much higher. *Sacrifice:* Exceptional individual transformative potential (Depth) for addressing more urgent ecological concerns and higher catalytic potential (Urgency/Leverage).
      *   **Resulting Rank:** 1. Legal Aid, 2. Creek Restoration, 3. Music Program

  5.  **Review & Document:**
      *   Summary: Legal Aid funded due to highest priority on Urgency. Creek over Music due to better Urgency/Leverage combo outweighing Exceptional Depth. Music's Exceptional Depth noted but insufficient to overcome low Urgency with current weights.
      *   **Key Trade-off Notes:** "Prioritized preventing imminent human harm (eviction) over profound individual transformation (music) and significant catalytic environmental restoration, based on 40% Urgency weighting."

  ---

  **The Uncomfortable Case: Where Logic Holds but Feels Wrong**

  *   **Scenario:** Next funding cycle. Weights shift slightly based on "building long-term community resilience": Urgency 30%, Impact Depth 25%, **Leverage 30%**, Fit 15%. Creek Restoration now has **High Leverage (30%)**.
  *   **New Proposal:** "Community Land Trust Startup" (Prevents long-term displacement by creating permanently affordable housing). Mapping:
      *   Urgency: **Medium** (Addresses chronic, not acute, crisis)
      *   Impact Depth: **High** (Security for families long-term)
      *   Leverage: **Exceptional** (Creates a permanent asset, changes housing dynamics, model for others)
      *   Fit: **High**
      *   **Outlier Flag:** *Exceptional Leverage*
  *   **Comparison vs. Legal Aid Clinic (same mapping as before):**
      *   *Trade-off:* Legal Aid: **High Urgency (30%)**, **High Depth (25%)**. Land Trust: **Medium Urgency (30%)**, **High Depth (25%)**, **Exceptional Leverage (30%)**.
      *   *VWTTP Logic:* Land Trust wins. While Urgency is lower (Medium vs. High), it's only weighted 30%. Depth is equal (High). Land Trust dominates massively on Leverage (Exceptional vs. Medium), the highest-weighted dimension at 30%. Preventing *future* displacement systemically (Leverage) is prioritized over preventing *imminent* displacement for fewer families (Urgency) under these weights.
  *   **Why it feels wrong:** The immediate, visceral human crisis of eviction tugs at the heartstrings more than the systemic, future-focused land trust. Letting a family become homeless *now* feels worse than creating a tool to prevent it *later*, even if the latter helps more people long-term.
  *   **Why logic holds:** The weights explicitly valued systemic change (Leverage 30%) slightly higher than immediate crisis response (Urgency 30%) for this cycle. The Land Trust is objectively stronger on the highest priority dimension. The procedure surfaces the conflict: Urgency vs. Leverage.
  *   **What you must do:** Acknowledge the discomfort. Explicitly *override* the procedure only if you fundamentally disagree with the weights *now*, or accept that this is the consequence of the strategic shift you articulated. Document the override and reason clearly for the board ("While VWTTP recommended Land Trust based on Leverage priority, we override due to overwhelming immediate need reflected in eviction case surge"). This is far better than an arbitrary gut call.

  ---

  **When VWTTP Fails (Call the Board):**

  1.  **True Ties After Deliberation:** If after rigorous pairwise trade-offs, two proposals feel genuinely indistinguishable *given the weights and dimensions*, and both are fund-worthy. Don't force a false choice; present both to the board with the dilemma.
  2.  **High-Stakes Irreversible Decisions:** Proposals involving massive multi-year commitments, selling an asset, or fundamental mission shifts. VWTTP is for *grant selection*, not existential strategy. The board needs direct involvement.
  3.  **Ethical Red Flags or Major Reputational Risk:** If a proposal passes thresholds but raises serious ethical concerns (e.g., conflicts of interest, potential harm, controversial partnerships) that aren't captured in your dimensions. Escalate.
  4.  **Radically Novel or Unforeseen Proposals:** If a proposal doesn't fit *any* of your predefined value dimensions well, or represents a completely new direction, it needs board-level strategic discussion.
  5.  **Significant Disagreement on Core Weights:** If you fundamentally cannot set coherent weights for the cycle because board priorities are contradictory or unclear, you need the board to resolve that ambiguity first.

  **In essence:** VWTTP makes your value conflicts explicit, structures the comparison of incomparables without reducing them to a single metric, documents your reasoning, and flags where true board-level decisions are needed. It replaces an opaque "gut feeling" with a transparent, defensible, and efficient process grounded in your foundation's stated values and current priorities. The discomfort you feel during trade-offs isn't a bug; it's the procedure working, forcing you to confront the real cost of choosing one good over another.
