  In the 1986 Space Shuttle Challenger launch decision, engineers at Morton Thiokol recommended against launching in the unusually cold temperatures expected at the pad, citing the behavior of the O-ring seals; after pressure from NASA and from their own management, the recommendation was reversed and the launch proceeded, with the loss of the vehicle and crew. Analyze this episode through the lens of Good's theorem on the value of information. Begin by stating what the theorem actually licenses and under what assumptions, then reconstruct the launch/no-launch decision as a decision problem to which it might be applied: who is the agent, what are the options and payoffs, and what exactly was the information at issue? Then say where the mapping breaks down—for instance, whether the relevant information was "free" in the theorem's sense, whether there was a single decision-maker maximizing a coherent utility function, and whether the theorem has anything to say about how a rational agent should weigh an engineering judgment that is not accompanied by a quantified likelihood. Finally, tell me what the episode shows about the theorem itself: is Challenger a violation of Good's theorem, a case where its assumptions failed to hold, or a case the theorem simply cannot speak to?
