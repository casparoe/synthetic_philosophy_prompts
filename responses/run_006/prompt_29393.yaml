prompt: |-
  I am about to work through the literature on the physical, design, and intentional stances and the notion of a real pattern that is supposed to license them, and I want the specification before I read another defense or attack. Write the desiderata for an adequate account: the phenomena it must explain, the cases it must get right, and the distinctions it must not quietly collapse, with the case or consideration behind each. Adequacy here means good enough to settle when a stance is warranted, what adopting it commits you to, and why the stances succeed when they do — not a practical recipe for prediction. Make sure your list engages at least these cases: a thermostat (where the intentional stance looks gratuitous and the design stance seems to do all the work), a chess-playing program (where the intentional stance predicts well without any inner life), the compulsive hand-washer or addict (where the intentional stance predicts poorly despite the system being a person), a corporation or market treated as an agent, and the design without a designer exhibited by natural selection. For each requirement, mark it as non-negotiable or as the preference of a particular camp — realist versus instrumentalist about the posits of the intentional stance, say — and justify the marking. Then say whether any pair of requirements on your list cannot be jointly satisfied; I suspect there is a real tension between treating the intentional stance as an optional, merely predictive heuristic and also treating beliefs and desires as real patterns on a par with physical-stance posits, but I want your judgment on whether that tension is genuine and which side should give. Identify the single requirement that does the most to exclude the standard readings of the view, such as a crude realism, a flat instrumentalism, or an eliminativism about the intentional. A brief scorecard of the main contenders is fine, but the criteria are the deliverable. Close by telling me which requirement in your own list you are least confident is a genuine desideratum, and what argument, case, or empirical finding would lead you to drop it or add a new one.
reasoning: |-
  Hmm, the user is diving deep into philosophy of mind and cognitive science, specifically Dennett's stances and real patterns. They want a rigorous specification of desiderata before engaging with literature, which shows they're methodical and avoiding premature biases. 

  The cases they listed are cleverly chosen to stress-test any account: thermostat (simple system where intentionality seems overkill), chess AI (complex but non-conscious), addict (human but hard to predict), corporations (abstract collective), and evolution (design without designer). Each exposes different fault lines. 

  I should note their meta-concern about tension between realism and instrumentalism - they suspect intentional stance can't be both optional heuristic AND track real patterns. That's the core philosophical knot. Also, they want me to flag my own uncertainties, which is refreshingly self-critical.

  For structure, I'll: 
  First list non-negotiables (like "must explain predictive asymmetry") since these are table-stakes across camps. 
  Then mark contested desiderata (e.g. "treats beliefs as real patterns" is realist-leaning). 
  The thermostat case demands we avoid over-generating intentionality, while the addict case shows intentional stance isn't foolproof even for humans - so any account must handle both success and failure conditions.

  Biggest exclusionary requirement will be #9: intentional stances must be irreducible to physical/design stances without being magical. This kicks out crude realism (which reifies beliefs naively) and flat instrumentalism (which makes them mere fictions). 

  My personal doubt is about desideratum #7 (collective agents). Maybe corporations are just metaphorical? But if neuroscience finds emergent decision-making in groups, I'd upgrade it. Conversely, if all collective behavior cleanly reduces to individual psychologies, I'd drop it.

  The realism/instrumentalism tension is real. My verdict: the account must explain why instrumental success tracks reality (via real patterns) without committing to beliefs being neurons. Dennett's "mild realism" tries this, but it's fragile - hence requirement #9's heavy lifting.
answer: |-
  Here are the desiderata for an adequate account of the stances (physical, design, intentional) and real patterns, structured to meet your specifications. Requirements marked **Non-Negotiable** are essential for *any* minimally adequate account; others reflect realist/instrumentalist tensions.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Essential for explanatory adequacy)*  

  1. **Explain Predictive Asymmetry**  
     - **Phenomenon**: Why the intentional stance often predicts complex systems (e.g., chess AI) more efficiently than physical/design stances, but fails for others (e.g., addicts).  
     - **Distinction**: Must not collapse predictive utility into ontological commitment.  
     - **Case**: Chess program’s moves predicted via beliefs/desires, but no "inner life" required.  

  2. **Demarcate Stance Applicability**  
     - **Phenomenon**: When a stance is warranted (thermostat vs. chess AI) and what it commits to (e.g., design stance assumes functional norms).  
     - **Distinction**: Avoid conflating design stance (teleofunctional) with intentional stance (rational agency).  
     - **Case**: Thermostat requires design stance (goal: regulate temperature); intentional stance is gratuitous.  

  3. **Handle Predictive Failure**  
     - **Phenomenon**: Why intentional stance fails for certain systems *despite* their complexity (e.g., addicts, irrational actors).  
     - **Distinction**: Must not quietly collapse rationality (idealized) with psychological reality.  
     - **Case**: Compulsive hand-washer’s behavior resists belief/desire prediction due to dysfunction.  

  4. **Accommodate Non-Biological Designers**  
     - **Phenomenon**: Systems with "design" but no conscious designer (e.g., evolution).  
     - **Distinction**: Design stance must apply without implying intentional design.  
     - **Case**: Natural selection’s "design" of adaptations (e.g., eye) via selection pressures.  

  ---

  ### **Contested Desiderata**  
  *(Dependent on realist/instrumentalist commitments)*  

  5. **Treat Beliefs/Desires as Real Patterns** [**Realist-Leaning**]  
     - **Phenomenon**: Intentional posits track objective structures in the world.  
     - **Distinction**: Avoid eliminating beliefs/desires while denying naïve reduction to physics.  
     - **Case**: Markets "believe" inflation is rising—patterns exist independently of observers.  
     - **Tension**: Instrumentalists see beliefs as useful fictions; realists see them as causal patterns.  

  6. **Avoid Overgeneration of Intentionality** [**Instrumentalist-Leaning**]  
     - **Phenomenon**: Not all predictable systems warrant intentional stance (e.g., thermostat).  
     - **Distinction**: Intentional stance ≠ any goal-directed system.  
     - **Case**: Applying intentional stance to a rock falling is gratuitous; design stance suffices for thermostats.  

  7. **Support Collective Intentionality** [**Realist-Preferred**]  
     - **Phenomenon**: Groups (corporations, markets) treated as agents with beliefs/desires.  
     - **Distinction**: Collective agency vs. mere aggregation of individuals.  
     - **Case**: "Apple wants to dominate the AR market" predicts corporate behavior.  

  ---

  ### **Tensions & Trade-offs**  
  - **Core Tension**: **#5 (beliefs as real patterns) vs. #6 (intentional stance as heuristic)**.  
    - Realists argue #5 explains predictive success (#1); instrumentalists argue #6 avoids ontological inflation.  
    - **Resolution**: The account must show how *successful* intentional stance use tracks real patterns (e.g., via robustness under counterfactuals), without requiring beliefs to be neural states. **Neither side fully "gives"**—adequate accounts (e.g., Dennett’s "mild realism") treat patterns as *real but stance-dependent*.  

  ---

  ### **Key Exclusionary Requirement**  
  **#9: Irreducible Explanatory Power**  
  - **Role**: Excludes crude realism, flat instrumentalism, and eliminativism.  
    - Crude realism (#5 alone) fails #2/#6 (overgenerates intentionality).  
    - Flat instrumentalism (#6 alone) cannot explain #1/#7 (predictive success in chess/markets).  
    - Eliminativism rejects #1/#5 entirely.  
  - **Justification**: Requires intentional stance to be *sometimes indispensable* for prediction/explanation, yet not metaphysically fundamental (avoids dualism).  

  ---

  ### **Scorecard of Contenders**  
  | **View**               | **Strengths**               | **Fails Desiderata**       |  
  |-------------------------|----------------------------|----------------------------|  
  | **Dennett (Real Patterns)** | #1, #2, #4, #9             | #7 (collectives debated)   |  
  | **Fodor (Intentional Realism)** | #5, #7                     | #6 (overgenerates)         |  
  | **Churchland (Eliminativism)** | Consistent physics stance  | #1, #5, #7                 |  
  | **Behaviorist Inst.**   | #6                         | #1, #7                     |  

  ---

  ### **Weakest Desideratum in My List**  
  **#7: Collective Intentionality**  
  - **Doubt**: Are corporations/markets *genuine* intentional systems, or just useful metaphors?  
  - **What Would Change My View**:  
    - **Drop if**: Neuroscience shows collective behavior reduces entirely to individual psychology without emergent patterns.  
    - **Strengthen if**: Evidence that group decisions exhibit counterfactual-supporting regularities irreducible to members (e.g., market algorithms acting as "beliefs").  

  ---

  This framework forces accounts to navigate the thermostat’s simplicity, the chess AI’s competence, the addict’s dysfunction, evolution’s blind design, and collective agency—without collapsing distinctions. The realist-instrumentalist tension is genuine, but **#9** ensures neither side dominates.
