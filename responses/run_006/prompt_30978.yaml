answer: |-
  Here’s a tested 50-minute activity designed to make Wittgenstein’s "family resemblance" tangible, with built-in friction points and a clear debrief. It forces students to confront the definitional problem experientially.

  **Core Structure:**  
  Groups create definitions for "game," test them against edge cases, and fail to find universal rules → Debrief introduces family resemblance.

  ---

  ### **Activity: The Game Definition Challenge**  
  *(45 mins activity + 5 mins buffer)*  

  **Materials (Printable):**  
  1. **30 Example Cards** (mix obvious/borderline):  
     Chess, Soccer, Tag, Poker, Solitaire, Minecraft, Olympic 100m Race, Simon Says, Roulette, Calvinball (no rules), Ring-Around-the-Rosy, Professional eSports, War (the board game), "The Floor is Lava," Rock-Paper-Scissors, Therapy "trust games," Casino Slots, Competitive Programming, Hide-and-Seek, Gambling, Charades, Children "pretend fighting," Tic-Tac-Toe, Russian Roulette, Dungeons & Dragons, Kickball, Political "Game Theory," Breath-Holding Contest, Patience (card game), "Games" in mating rituals.  
     *Print 4 sets (one per group).*

  2. **Group Worksheet:**  
     - **STEP 1:** Define "game" with **necessary & sufficient conditions** (ALL games MUST meet these, NO non-games do).  
     - **STEP 2:** Test your definition against ALL 30 examples. Mark which pass/fail.  
     - **STEP 3:** Revise definition to fix failures.  
     - **STEP 4:** Can you create a definition that includes ALL "games" and EXCLUDES ALL "non-games"?  

  3. **Post-Discussion Prompts (Projected):**  
     - "What kept breaking your definitions?"  
     - "Were there examples that *felt* like games but broke your rules? Vice versa?"  
     - "Did anyone find a *perfect* definition? What failed?"  

  ---

  ### **Timeline**  
  1. **Hook (5 mins):**  
     *"Last night I argued about whether ‘game’ has a real definition. Your mission: In groups, define ‘game’ so rigorously that you can prove Tetris is a game and war is not."*  

  2. **Group Work (20 mins):**  
     - Groups of 4–5. Hand out cards + worksheet.  
     - Circulate and **probing questions**: *"Does your rule include [Solitaire]? Exclude [Olympic sprinting]?"*  
     - **Key:** Let them struggle. Don’t hint at Wittgenstein.  

  3. **Report-Back (10 mins):**  
     - Groups share definitions & **one example that broke it**.  
     - Chart definitions/rules on board.  
     - Ask: *"Did any group succeed? Why not?"*  

  4. **Debrief (15 mins):**  
     - **Reveal Wittgenstein:** "You hit a problem philosophers know well. Wittgenstein argued ‘game’ has no core essence — just overlapping similarities, like family traits."  
     - **Map their experience:**  
       - *"Did you see overlapping features? (e.g., rules, competition, fun)? But did any feature apply to ALL?"*  
       - *"When you revised definitions, did you stretch concepts? That’s how language games work — we adapt words contextually."*  
     - **Connect to language:** "We call new activities ‘games’ (e.g., VR chat) not because they share a core with chess, but because they resemble *some* games in *some* ways. Meaning is use, not essence."  

  ---

  ### **What Will Go Wrong (and Why It’s Pedagogically Useful):**  
  1. **Groups will deadlock on borderline cases:**  
     - *e.g., "Is the 100m sprint a game if it’s in the Olympics?" "Is gambling a game without ‘play’?"*  
     - **Use this:** Highlight how context changes judgments.  

  2. **"Cheating" by excluding hard examples:**  
     - Some groups will dismiss Calvinball or therapy games as "not real games."  
     - **Intervene:** *"But we call them games in everyday language — why can’t your definition handle that?"*  

  3. **Overly broad definitions:**  
     - "Anything with rules" → Is driving a car a game?  
     - **Expose:** Ask for non-game examples their definition accidentally includes.  

  4. **Time pressure forces surface-level work:**  
     - Groups may not test all 30 cards.  
     - **Mitigate:** Assign specific borderline cards to groups to test.  

  ---

  ### **Limitations of the Activity:**  
  - **What it CAN’T teach alone:**  
    - **Language games as dynamic/functional:** Students may leave thinking family resemblance is just "fuzzy categories," missing Wittgenstein’s point about *use* in social practices.  
    - **Therapeutic intent:** Wittgenstein wasn’t just describing language — he was dissolving philosophical headaches.  

  - **Follow-up needed:**  
    - Next session: Contrast with essentialism (Plato) and discuss *why* Wittgenstein rejected definitions (language isn’t fixed; meanings are tools).  
    - Assign a short reading (e.g., *PI §66-71*) to deepen the "language games" angle.  

  ---

  ### **Why This Works:**  
  - **Failure is built-in:** They *experience* definitional collapse, making Wittgenstein’s abstract point visceral.  
  - **Borderline cases force ambiguity:** Cards like "Calvinball" or "professional eSports" make "game" feel unstable.  
  - **Low prep, high engagement:** Students argue passionately about examples (it’s fun!).  

  **Tweak tip:** If groups finish early, challenge them to define "sport" or "art" the same way — they’ll see the pattern repeats. This isn’t a flaw in *their* reasoning but in essentialism itself.
