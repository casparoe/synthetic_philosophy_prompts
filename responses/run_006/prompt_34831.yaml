  Here’s a focused, one-page proposal structured to meet your requirements. It emphasizes philosophical precision, clear methodology, and fundability:

  ---

  **Workshop Proposal: Disaggregating Pure Time Preference—An Ethical Stress Test for Intergenerational Climate Policy**  

  **Core Question:**  
  *When pure time preference (PTP) is disaggregated into three distinct components—(1) individual impatience, (2) generational partiality, and (3) uncertainty about future persons/states—which components (if any) survive Ramsey’s ethical objection that discounting future utility *solely because it is future* is indefensible?*  

  **Problem & Gap in Existing Debate:**  
  Current climate policy debates treat PTP as a monolithic discount rate (δ), obscuring ethically distinct justifications for valuing the present over the future. Economists and philosophers routinely clash over whether δ > 0 is permissible, but this stalemate arises because both sides conflate:  
  - **Impatience (I):** A person’s preference for immediate over deferred benefits to *themselves*.  
  - **Generational Partiality (GP):** Prioritizing currently living people over future people *simply because they exist now*.  
  - **Existential Uncertainty (EU):** Discounting due to non-identity problems or the chance that future persons/states won’t exist.  
  By treating PTP as a single "number," the debate fails to isolate which rationale(s) might withstand Ramsey’s critique that temporal location is morally irrelevant. This conflation paralyzes policy—e.g., whether a 1.5°C target requires δ=0.  

  **Methodology: Philosophical Disaggregation via Constrained Thought Experiments**  
  We will test each component’s ethical defensibility using **normative reasoning** applied to stylized cases isolating one factor at a time:  
  1. **I vs. Ramsey:** *Case:* You must choose between receiving $1000 today or $1100 in 10 years (with guaranteed survival/consumption). Does preferring today violate "equal concern for all temporal parts of a life"?  
  2. **GP vs. Ramsey:** *Case:* Society must allocate a fixed vaccine dose between a current child (saves 50 life-years) or an identical future child (saves 50 life-years in 2124). Does favoring the current child reflect unjust bias?  
  3. **EU vs. Ramsey:** *Case:* A policy benefits people in 2200 *only if* civilization exists then (e.g., nuclear waste storage). Does discounting due to extinction risk conflate probability with ethical weight?  
  **Approach:** Treat Ramsey’s principle ("temporal neutrality") as a fixed benchmark. Assess whether each component can be justified *without* appealing to temporal location per se (e.g., GP as "proximity bias" akin to nationalism). Use climate/pension cases (e.g., Social Security vs. carbon sequestration) to ground abstractions.  

  **Why Philosophy? Why Fund This?**  
  IAMs (Integrated Assessment Models) embed δ-values that implicitly resolve ethical questions. Philosophy makes these choices explicit, exposing value-laden assumptions that drive trillion-dollar decisions. If only *some* PTP components survive scrutiny (e.g., EU but not GP), policymakers could adopt discount rates that reflect defensible ethics rather than conflation. This enables more legitimate, politically sustainable climate governance.  

  **Deliverable & Timeline:**  
  A 6,000-word paper (workshop-ready in 6 months part-time) delivering:  
  1. A rigorous taxonomy of PTP components.  
  2. Normative assessment of each against Ramsey’s principle.  
  3. Implications for discounting in climate policy/pension justice.  

  **Failure Conditions:** The project fails if:  
  - Disaggregation reveals no meaningful distinctions (all components reduce to the same ethical flaw).  
  - All components collapse under Ramsey’s objection, leaving no defensible basis for δ > 0.  
  - The thought experiments cannot isolate components, resulting in indeterminate conclusions.  

  **Impact:** Clarifies the "black box" of discounting in intergenerational policy, transforming a technical debate into an accountable ethical inquiry. Outputs will equip economists, policymakers, and ethicists to design models and policies that distinguish between defensible and indefensible forms of time preference.  

  ---

  **Key Strengths for Fundability:**  
  1. **Precision:** Targets a specific, unresolved problem in policy-relevant philosophy.  
  2. **Novelty:** Moves beyond "is δ ethical?" to "which δ-components are ethical?"  
  3. **Efficiency:** Scope fits a workshop paper; methodology requires no empirical data.  
  4. **Policy Leverage:** Shows how philosophy can resolve deadlocks in climate economics.  
  5. **Accountability:** Explicit failure conditions demonstrate testable hypotheses.  

  **To customize:** Add 1-2 bullet points under "Methodology" with your preferred cases (e.g., pension reforms vs. glacier loss mitigation). For citations, insert key sources (e.g., Ramsey 1928, Stern vs. Nordhaus, Parfit) in the "Problem" section where bracketed.
