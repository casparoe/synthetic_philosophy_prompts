  Okay, the user is a journalist diving deep into typography and cognitive science. They're stuck on what makes every 'a' recognizable as an 'a' across different fonts, handwriting, and scripts. They've collected various examples and their own gut reactions but feel their intuitions are inconsistent. They want five candidate principles that explain their verdicts, each principle showing which cases it handles and which it doesn't. Plus, they want a fifth principle to predict a new case: an experimental typeface 'a' that's unrecognizable until explained.

  First, I need to parse their verdicts. They have several examples: standard double-story 'a' (yes), single-story 'a' (yes), capital 'A' (yes but different), sloppy handwritten 'a' with unclosed bowl (context-dependent), Cyrillic 'а' (no, different alphabet), @ symbol (no despite history), rotated 'a' (no), Fraktur 'a' (intellectually yes, perceptually no), minimalist logo 'a' (context-dependent), Greek alpha (no despite ancestry). 

  The key challenges are the role of context, historical descent, shape similarity, and cognitive categorization. The user admits that context affects their judgment, like with the sloppy 'a' or minimalist logo. They also note that descent matters for capital 'A' but not for Greek alpha, which is confusing. 

  For principles, I need to cover different angles: perceptual, contextual, categorical, etc. Let me brainstorm. One principle could be about perceptual prototypes, like a mental template. That would handle standard and single-story 'a's but struggle with rotated shapes or Fraktur since those deviate too much. Another principle might emphasize functional role in a writing system, explaining why Cyrillic 'а' isn't an 'a' even if identical. Contextual recognition could explain why sloppy handwriting or minimalist designs work only in context. Historical descent might matter for some cases like capital 'A' but not others, so maybe it's inconsistent. Finally, a principle about learned categories could address the experimental typeface case—once you learn it, it becomes fixed.

  Now, mapping each principle to their verdicts. For example, a prototype theory would handle standard 'a's and capital 'A' as separate prototypes but fail on rotated 'a' since the shape is the same. Functional role would explain Cyrillic as not part of the Latin system but might force abandoning the historical @ symbol. Contextual recognition covers sloppy handwriting and minimalist logos but struggles with isolated cases. Descent principle works for capital 'A' and Fraktur but not for Greek alpha. The fifth principle, category membership, would predict that the experimental 'a' becomes unshakeable once learned, even if initially unrecognizable.

  I need to ensure each principle clearly states which verdicts it handles and which it forces abandoning. Also, for the fifth principle, applying it to the experimental typeface case: once told, people can't unsee it, meaning the category is learned and fixed. That aligns with cognitive science on perceptual learning and categorization.

  The user's deeper needs might include understanding how cognition and perception interact in reading, possibly for their article. They might also seek a framework to resolve their conflicting intuitions, which could be frustrating. By providing structured principles, I help them organize thoughts and identify which intuitions to reconsider, like relying too much on context or history in some cases.
answer: |-
  Here are five candidate principles addressing your query, each with its verdict matches and forced abandonments:

  1. **Perceptual Prototype Principle**: Recognition relies on a mental template of the most common form (e.g., the double-story or standard single-story 'a').  
     *Handles*: Standard 'a', single-story 'a', capital 'A' (as a distinct prototype).  
     *Forces abandonment*: Rotated 'a' (same shape but rejected), Fraktur 'a' (prototype mismatch causes perceptual resistance).  

  2. **Functional Role Principle**: A shape is an 'a' if it functions as the first vowel grapheme in the Latin alphabet within a specific writing system.  
     *Handles*: Cyrillic 'а' (rejected—wrong system), capital 'A' (accepted—same system role).  
     *Forces abandonment*: Greek alpha (despite ancestral role), historical @ (despite origin).  

  3. **Contextual Recognition Principle**: Ambiguous shapes are categorized as 'a' only when contextual cues (e.g., surrounding letters) enable fluent reading.  
     *Handles*: Sloppy handwritten 'a', minimalist logo 'a' (context-dependent acceptance).  
     *Forces abandonment*: Rotated 'a' (context rarely fixes orientation), isolated Fraktur 'a' (context may not override resistance).  

  4. **Historical Descent Principle**: A shape is an 'a' if it demonstrably evolved from the Latin 'a' glyph, regardless of current perception.  
     *Handles*: Fraktur 'a' (intellectual acceptance), capital 'A' (accepted via Greek ancestry).  
     *Forces abandonment*: Greek alpha (rejected despite descent), @ symbol (rejected despite origin).  

  5. **Learned Category Membership Principle**: A shape belongs to the 'a' category once learned as such within a script, overriding initial perception.  
     *Handles*: All cases where knowledge overrides intuition (e.g., Fraktur after learning).  
     *Prediction for experimental 'a'*: Once taught, it becomes an unshakeable member of the 'a' category—perception irrevocably shifts to align with the learned label, fulfilling your "can’t unsee it" scenario.  

  **Key Trade-offs**:  
  - **Principle 1** abandons the rotated 'a' despite identical shape.  
  - **Principle 2** abandons Greek alpha despite its historical role.  
  - **Principle 3** abandons stand-alone recognition of minimalist/Fraktur 'a's.  
  - **Principle 4** abandons the @ symbol’s legitimacy as an 'a'.  
  - **Principle 5** best explains the experimental typeface case via cognitive re-categorization.
