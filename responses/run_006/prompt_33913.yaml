answer: |-
  ## Dialogue: The Boundaries of the Demos

  **Characters:**
  *   **Dr. Elara Aris:** Advocate for the **All-Affected Interests Principle**.
  *   **Ms. Tessa Vale:** Advocate for the **All-Subjected Principle**.

  **Setting:** A quiet corner of a university library common room.

  **(The dialogue begins after initial pleasantries and establishing the topic.)**

  **Dr. Aris:** Tessa, the fundamental flaw of the all-subjected principle is its moral blindness. Why should being legally coerced within a territory be the *only* thing that grants someone a say? Consider our coastal city, Seaview. They build a massive sea wall. Wonderful for them, but it deflects storm surges *directly* into Marshland, the adjacent rural district, flooding farms and homes. The Marshlanders are devastated – their *interests* are profoundly affected. Yet, under your principle, because Marshland is a separate jurisdiction and its residents aren’t subject to Seaview’s *laws* or direct coercion *by Seaview*, they have no claim to participate in Seaview’s decision. That’s unjust! They bear the cost without voice.

  **Ms. Vale:** Elara, I understand the moral pull. But your principle dissolves any workable boundary. *How* affected must they be? A Marshland farmer loses crops – clearly affected. But what about the grain merchant in a third city who relies on those crops? His prices rise. Is he affected "meaningfully"? What about the insurance company headquartered overseas that now pays out more for Marshland flood claims? Where does it end? The demos becomes global for every local decision, making collective action impossible. Practicality demands a sharper line. The Marshlanders *are* subject to the coercive power of *their own* district government. That government should represent them in negotiations or legal challenges *against* Seaview. The line of coercion defines the community bound by the *shared* legal order responsible for the action.

  **Dr. Aris:** You dismiss the moral claim too quickly! That Marshland farmer isn't just subject to *his own* government; he's subject to the *consequences* of Seaview's coercively enforced decision – the floodwaters destroying his land. He suffers a harm directly caused by Seaview's exercise of power, even if their police don't arrest him. Your line privileges legal formality over moral substance. As for overbreadth, we *can* define thresholds: "Meaningfully affected" means suffering significant, direct, and non-speculative harm. The grain merchant faces a diffuse market effect; the farmer faces inundation. We distinguish core victims from peripheral effects.

  **Ms. Vale:** But who defines "significant," "direct," and "non-speculative," Elara? That’s precisely the regress problem! *Before* we can decide who votes on the sea wall, we need to decide who gets to define who is "affected." Does Seaview get to decide unilaterally? Do we need a global meta-demos? My principle avoids this. The "who decides" question has a prior answer: the existing legal order defines its own subjects. The line of coercion is observable – who lives under the rules enforced by this specific state's monopoly of force? The Marshlander is subject to Marshland's laws, not Seaview's. His claim is against his *own* government for failing to protect him or negotiate effectively. Coercion creates a distinct relationship of authority and obligation.

  **Dr. Aris:** Your reliance on the *existing* legal order is deeply conservative and potentially oppressive. Imagine a wealthy state, Nordhaven, imposing a steep carbon tax to fund its green transition. This drastically increases energy costs for its own citizens, sure. But it also makes Nordhaven's factories uncompetitive. Cheaper, coal-heavy factories in the developing nation of Sunaria boom to fill the gap, worsening local pollution and health for Sunarian workers. Nordhaven's policy *directly* harms those workers' health and environment – significant, direct harm! Yet, under your principle, those Sunarian workers aren't subject to Nordhaven's legal coercion, so they have no standing. Their own government, likely weak or corrupt, won't effectively represent them against this external harm. Your "sharp line" excludes those bearing the brunt!

  **Ms. Vale:** Nordhaven's policy *influences* global markets and Sunaria's *choices*, but it doesn't *coerce* Sunarians. Sunaria's government chooses its own energy and industrial policies. The workers are subject to Sunaria's coercive legal order and its decisions (or failures). Blaming Nordhaven entirely ignores Sunaria's agency and responsibility. Including every worker potentially affected by global economic ripples makes the demos for Nordhaven's tax policy impossibly vast and indeterminate. How could they possibly deliberate effectively? My principle ensures the demos is constituted by those who will live under the *direct, enforceable rules* created by the decision – Nordhaven's citizens bound by the tax law. The Sunarian workers' plight is real, but the remedy lies in strengthening *their* democratic institutions or international agreements, not dissolving Nordhaven's democratic boundaries.

  **Dr. Aris:** You make agency sound so clear-cut! Nordhaven, wealthy and powerful, shifts the economic landscape. Sunaria, struggling, has constrained choices – the "choice" to poison its workers isn't a free one. Your principle lets powerful democracies externalize harm onto the unrepresented. Coercion isn't the only source of political obligation; causation and harm matter morally. And what about people *subjected* but *unaffected*? Consider a tourist visiting Seaview when the sea wall vote happens. She's subject to Seaview's laws coercively while there – she must obey traffic laws, pay local taxes on her hotel. But the sea wall decision doesn't affect her interests at all; she leaves next week. Why should she have a vote? Your principle grants her standing purely based on location during coercion, which seems arbitrary.

  **Ms. Vale:** The tourist point is fair; it highlights that subjection is usually tied to residence or enduring ties, not fleeting presence. Laws often define the franchise based on residency, not mere presence, precisely to capture enduring subjection. As for Nordhaven and Sunaria, I agree the outcome can be unjust. But the solution isn't to make Nordhaven responsible for democratically representing Sunarian workers – that's impractical and undermines Sunaria's self-determination. We need better *international* democratic mechanisms or norms, built by states representing their *subjected* populations. The all-subjected principle provides the stable, bounded units necessary for that larger project. Your principle, however well-intentioned, risks making every local democracy paralyzed by global consultation or arbitrary lines drawn around "significance."

  **Dr. Aris:** And your principle, Tessa, risks legitimizing islands of democratic decision-making that casually drown their neighbors. Stability shouldn't trump basic justice. Perhaps the answer isn't a single principle but recognizing that *both* subjection and affected interests generate claims, demanding different institutional responses – local democracy for the core subjected group, but robust representation or veto rights for those externally harmed in specific, severe ways. The Marshlanders shouldn't get to vote in Seaview elections, but they should have a guaranteed seat and strong voice on the coastal management board.

  **Ms. Vale:** That’s a practical accommodation, Elara, but it sidesteps the foundational question: *Who fundamentally constitutes the demos with final authority?* My answer remains: those bound together by the shared framework of coercive law. Your "accommodations" are essential supplements born of moral necessity, but they don't replace the need for a clear, primary boundary based on subjection. Without that anchor, we drift into an ocean of affectedness with no shore in sight.

  **Dr. Aris:** And without acknowledging affectedness, we build democracies on shores protected by walls that drown others. The search for a single, perfectly sharp boundary may be as futile in politics as finding a perfect fault line is in geology. Perhaps the ground itself is more complex.

  **(They both pause, the unresolved tension hanging in the air, reflecting the enduring difficulty of the problem.)**
