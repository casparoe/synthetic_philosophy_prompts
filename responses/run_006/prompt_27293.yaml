answer: |-
  Your intuitive principle aligns closely with **symmetric team reasoning**: in symmetric games with identical rational players, choose the strategy that maximizes your expected payoff if all players adopt the same strategy (including mixed strategies). This principle prioritizes Pareto-optimal symmetric equilibria and avoids outcomes where individual dominance leads to collective failure. Below, I formalize the principle, apply it to your cases, and address the variants.

  ---

  ### **Formal Principle: Symmetric Team Reasoning (STR)**
  - **Scope**: Applies to symmetric games (all players have identical strategy sets and payoffs, and the game is invariant under player permutation) where everyone is rational, knows the setup, and knows others are identically rational.
  - **Rule**: Choose a strategy (pure or mixed) that, if adopted by all players, maximizes your individual expected payoff. Equivalently, solve:
    - Maximize \( \mathbb{E}[u_i \mid \text{all use } \sigma] \)
    - where \( \sigma \) is a symmetric strategy profile, and \( u_i \) is your payoff.

  This selects the symmetric strategy profile that is collectively rational. It often justifies mixed strategies in coordination games and cooperation in social dilemmas under symmetry.

  ---

  ### **Analysis of Your Cases**
  I evaluate your verdicts against STR, indicating matches (✓) or overrides (✗).

  1. **Platonia Dilemma** (20 players, send telegram to win $1B iff unique sender)  
     - Your verdict: Randomize with \( p = 1/20 \) (send on 1 of 20 die rolls).  
     - STR analysis:  
       - Pure strategies: All sending (payoff $0$) or all silent (payoff $0$) are worse.  
       - Mixed strategy: Let \( p \) be the probability of sending. Your expected payoff is \( p(1-p)^{19} \times 10^9 \).  
       - Maximized at \( p = 1/20 \), yielding \( \approx \$1.85 \times 10^7 \) expected.  
     - **STR match (✓)**: Randomizing at \( p = 1/20 \) is optimal under symmetry.  
     - Why not send? Sending is weakly dominant *individually*, but if all send, everyone gets $0$. STR avoids this by enforcing symmetry.

  2. **Luring Lottery** (Prize = $1M / total entries; win prob = your entries / total)  
     - Your verdict: Randomize with \( p = 1/n \) (send 1 entry on a die roll of 1, else 0).  
     - STR analysis:  
       - Pure strategies: If all send \( e \) entries, payoff \( \approx \frac{10^6}{n^2 e} \). Maximized at \( e = 1 \) (payoff \( \frac{10^6}{n^2} \)).  
       - Mixed strategies: Let \( p \) be the probability of sending 1 entry (0 otherwise). Your expected payoff is \( p \times 10^6 \times \mathbb{E}\left[\frac{1}{(1 + X)^2}\right] \), where \( X \sim \text{Binomial}(n-1, p) \).  
       - Optimal \( p \) maximizes this expression. For large \( n \), \( p \approx 1.5/n \) (not \( 1/n \)):  
         - E.g., for \( n = 20 \), optimum at \( p \approx 0.075 \) (expected payoff \( \approx \$37,\!000 \)) vs. your \( p = 0.05 \) (expected payoff \( \approx \$24,\!000 \)).  
     - **STR override (✗)**: Your \( p = 1/n \) is a good heuristic but suboptimal. STR requires \( p \approx 1.5/n \) to maximize expected payoff under symmetry.  
     - Key insight: STR doesn't just "prevent explosion"; it actively maximizes your expected winnings.

  3. **Newcomb's Problem** (Near-perfect predictor, both boxes in front of you)  
     - Your verdict: Take both boxes (two-box), knowing the predictor likely left the opaque box empty.  
     - STR analysis:  
       - **Original (fixed predictor)**: Not symmetric (predictor isn’t a player with identical incentives). STR doesn’t apply. Weak dominance (two-boxing) holds.  
       - **Variant (predictor is a simulation of you)**: Now symmetric (you and your "simulation" are identical rational agents). STR applies:  
         - If all versions of you one-box, payoff = $1,000,000.  
         - If all two-box, payoff = $1,000.  
         - One-boxing maximizes symmetric payoff.  
     - **Result**:  
       - Original: STR doesn’t apply → your two-box verdict stands (✓).  
       - Simulation variant: STR overrides to one-box (✗). Your gut might resist, but symmetry changes the game.

  4. **Prisoner's Dilemma (PD)**  
     - **With identical twin**:  
       - Your verdict: Cooperate.  
       - STR analysis: If both cooperate, payoff = 3 (mutual cooperation). If both defect, payoff = 1. STR chooses cooperation.  
       - **Match (✓)**: Cooperation is optimal under symmetry.  
     - **With stranger**:  
       - Your verdict: Defect.  
       - STR analysis: Not symmetric (no reason to assume identical reasoning). Defection is dominant.  
       - **Match (✓)**: STR doesn’t apply; defection is rational.  

  5. **Stag Hunt** (All get $1000 if all hunt stag; you get $900 if you chase rabbit; others get nothing if you chase rabbit)  
     - **With identical reasoners**:  
       - Your verdict: Hunt stag.  
       - STR analysis: If all hunt stag, payoff = $1000. If all chase rabbits, payoff = $900. STR chooses stag hunting.  
       - **Match (✓)**: Stag hunting is symmetric and Pareto-superior.  
     - **With strangers**:  
       - Your verdict: Hunt stag but less confidently.  
       - STR analysis: Not symmetric → no STR mandate. Depends on risk tolerance.  
       - **Match (✓)**: STR doesn’t apply; stag hunting is riskier but potentially optimal.  

  ---

  ### **Platonia Variant: Sending Costs $1**
  - **Setup**: Sending costs $1 (win or lose). Win $1B iff you are the unique sender.
  - **STR analysis**:  
    - Expected payoff for mixed strategy \( p \):  
      \[
      \text{Payoff} = p(1-p)^{19} \times (10^9 - 1) + [1 - (1-p)^{19}] \times (-1)
      \]
    - Maximized at \( p \approx 1/20 \) (slightly lower than original due to cost, but negligible for large prizes).  
  - **STR verdict**: Still randomize at \( p \approx 1/20 \). The cost doesn’t change the optimal strategy meaningfully.  

  ---

  ### **Key Conclusions**
  - **Your principle is well-defined**: STR formalizes your intuition for symmetric games. It resolves conflicts by optimizing the symmetric outcome, often justifying mixed strategies or cooperation.
  - **Saves most verdicts**: STR matches your calls in Platonia, PD (twin), stag hunt (symmetric), and Newcomb’s (fixed predictor).
  - **Overrides two cases**:  
    1. **Luring Lottery**: Use \( p \approx 1.5/n \), not \( 1/n \), to maximize expected winnings.  
    2. **Newcomb’s (simulation variant)**: One-box, as symmetry forces alignment with the predictor.  
  - **Why symmetry matters in Newcomb’s?** With a fixed predictor, dominance rules. With a simulation (symmetry), STR prioritizes the coordinated high-payoff outcome. This mirrors PD: symmetry flips defection to cooperation.
  - **Strength of STR**: It avoids collective disasters (e.g., everyone sending in Platonia) and exploits symmetry for mutual gain. Weakness: It assumes perfect symmetry and common knowledge of rationality, which may not hold in practice.

  STR captures your core insight: when everyone is "you," optimize for the team-as-yourself. It’s game theory’s answer to the question: "What if everyone did that?"
