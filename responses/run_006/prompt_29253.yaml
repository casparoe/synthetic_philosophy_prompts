answer: |-
  This fascinating asymmetry you've observed has a well-established name in philosophy and cognitive science: the **Knobe Effect** (also known as the **Side-Effect Effect**), named after the philosopher Joshua Knobe who first experimentally demonstrated it in 2003.

  Here's a breakdown of the key points:

  1.  **The Knobe Effect Defined:** It describes the phenomenon where people are significantly more likely to judge an unintended but foreseen side effect as brought about *intentionally* if it is **morally bad** (e.g., harming the environment) than if it is **morally good** (e.g., helping the environment), *even when the agent's awareness, desires, and primary goals are held constant*.

  2.  **It's Primarily About Moral Judgment Influencing Intentionality Ascription:** While the debate is ongoing, the prevailing view is that this effect reveals how **people's moral judgments fundamentally shape their application of seemingly non-moral concepts like "intentional action"**. It's not primarily about:
      *   **The concept of intentional action itself being flawed:** Philosophers generally agree on the core components of intentional action (desire, belief, skill, awareness). The effect shows how moral valence *biases* the application of these criteria.
      *   **Simply "coloring what they report" (pure reporting bias):** While reporting plays a role, experiments suggest the moral judgment actually alters people's underlying *cognitive assessment* of whether the action was intentional. It's not just that people *say* it was intentional to assign blame; they genuinely *judge* it to be intentional *because* it's bad.

  3.  **Mechanisms (The Debate):** *Why* does this happen? There are several prominent theories:
      *   **Moral Bias Account:** Moral judgments directly and asymmetrically influence the cognitive processes used to determine intentionality. Bad outcomes trigger blame, which makes us see the action as more agential (intentional).
      *   **Skill/Competence Account:** Performing a bad action is seen as revealing a character flaw or lack of skill ("a good manager wouldn't let that happen"), making the outcome seem more attributable to the agent's competence (and thus intentionality). Good side effects might be seen as lucky or incidental, requiring less skill.
      *   **Deep Self Concordance Account:** Bad side effects are seen as revealing the agent's "true" (immoral) values deep down, even if they claim not to want them, thus making the action intentional. Good side effects don't reveal hidden moral virtues in the same way.
      *   **Norm Violation Account:** Intentionality judgments track whether a norm was violated. Harming the environment violates a norm, so the agent is judged as intentionally violating it. Helping doesn't violate a norm, so intentionality isn't attributed for the help.

  4.  **Distinguishing from Related Concepts:**
      *   **Moral Luck:** Moral luck concerns how luck in the *outcome* (e.g., whether the bullet hit the civilian or missed) affects the *degree of praise or blame* assigned for an action *that was equally risky/reckless/intended*. The Knobe Effect is about how the *valence* of the outcome (good/bad) affects the fundamental judgment of whether a *foreseen side effect* was brought about *intentionally* in the first place. Moral luck asks "How much blame/praise *despite* the luck?" The Knobe Effect asks "Was it even intentional *because* it was bad?"
      *   **Halo Effect:** The halo effect is a general cognitive bias where our overall impression of a person (positive or negative) influences our judgments of their specific traits (e.g., thinking a likeable person is smarter). The Knobe Effect is much more specific: it's about how the moral valence of a *specific outcome* influences the judgment of intentionality *for that specific action/side effect*, often independently of a pre-existing overall impression of the agent.
      *   **Outcome Bias:** Outcome bias is the tendency to judge the *quality* of a decision based on its outcome rather than the decision process itself. While related, the Knobe Effect is specifically about the ascription of *intentionality* for foreseen side effects based on their valence, not just the overall judgment of the decision's quality or the agent's competence.
      *   **Fundamental Attribution Error (FAE):** FAE is the tendency to over-attribute others' behavior to their internal dispositions (personality, intentions) and underestimate situational factors. The Knobe Effect *could be seen as a specific manifestation* of FAE *amplified by moral valence* – when the outcome is bad, we're more likely to attribute it strongly to the agent's intentional action (disposition) rather than the situation or mere side-effect status.

  **What to Call It & Summary:**

  *   **Established Name:** Knobe Effect or Side-Effect Effect.
  *   **Best Understood As:** A discovery demonstrating that **moral judgments asymmetrically influence the cognitive processes underlying ascriptions of intentionality** for foreseen side effects. People don't neutrally assess intentionality and *then* apply moral judgment; the badness of the outcome actively shapes the intentionality judgment itself, making harmful side effects seem more intentional than helpful ones.
  *   **How to Separate It:** Focus on the core elements:
      *   An agent acts with a primary goal.
      *   A foreseen side effect occurs.
      *   The *valence* (good/bad) of the side effect determines whether people say the agent brought it about *intentionally*.
      *   It's distinct because it targets the specific concept of *intentionality* for *side effects* based on *moral valence*, unlike the broader scope of moral luck (outcomes affecting blame/praise), halo effect (global impressions affecting traits), or outcome bias (outcomes affecting decision quality judgments).

  The Knobe Effect is a cornerstone finding in experimental philosophy and moral psychology, highlighting the deep and often surprising entanglement of moral evaluation and folk concepts of agency and intention. Your manager, soldier, and drug examples are perfect illustrations of this pervasive cognitive phenomenon.
