  ## Adjudication of the White Horse Dialogue Dispute

  This is a rich and nuanced debate reflecting deep tensions in interpreting early Chinese philosophical texts through modern lenses. Both Eleanor and Marcus offer defensible readings, but their arguments contain weaknesses, and neither fully captures the radical nature of the School of Names project. I'll adjudicate move-by-move, then synthesize.

  **Move 1: Eleanor's Initial Semantic Reading**
  *   **Claim:** The dialogue is about the non-identity of *names* ("white horse" vs. "horse"), shown by differing satisfaction conditions (seeking a horse vs. seeking a white horse). The conclusion is rhetorical, not denying biological kind membership.
  *   **Evaluation:** **Partially Correct, but Incomplete.** Eleanor correctly identifies the *linguistic mechanism* (satisfaction conditions) as the core argumentative tool and rightly notes the conclusion isn't denying extensional inclusion in a biological kind. Her framing avoids an absurd literal reading. **However,** she underestimates the text's ambition. The advocate *doesn't* retreat to "just words" after the objector's extensional point ("if there’s a white horse, we can’t say there’s no horse"). He doubles down on the *ontological implications* of the naming difference.

  **Move 2: Marcus's Initial Metaphysical/Objection**
  *   **Claim:** Eleanor is too tame/modern. The objector already makes the extensional point, and the advocate persists, separating colour and shape ("what names colour is not what names shape"). This aligns with the School of Names' interest in aspect separation (hard/white). It's about the thing itself, not just usage.
  *   **Evaluation:** **Largely Correct.** Marcus is right that the text pushes beyond mere semantics. The advocate's persistence after the extensional challenge (Gongsun Longzi: "To have a horse does not mean to have a yellow or black horse...") demands an ontological dimension. His connection to the School of Names' broader project (e.g., "Jianbailun" - Hard & White) is crucial context Eleanor initially neglects. The focus *is* on how names partition reality.

  **Move 3: Eleanor's Reply (Salt Water & Hyponymy)**
  *   **Claim:** The seeking example only shows differing desires/satisfaction conditions, not kind exclusion (salt water is still water). The advocate conflates appropriateness with membership. The charitable reading is hyponymy (white horse ⊂ horse), groping towards sense/reference.
  *   **Evaluation:** **Partially Correct on Counterexample, Incorrect on Charitability.** Her salt water analogy effectively shows that differing satisfaction conditions *do not* entail kind exclusion. **However, her "charitable" hyponymy reading is *uncharitable* to the text.** The dialogue *explicitly rejects* the subsumption logic ("A white horse is a horse. To use a white horse for a horse is... permissible? Why is it impermissible?"). The advocate's argument *depends* on resisting the reduction of "white horse" to merely a type of "horse." Imposing hyponymy/Sense-Reference flattens the radical challenge.

  **Move 4: Marcus's Reply (Aspectual Separation & Mohists)**
  *   **Claim:** Eleanor assumes the challenged kind-membership theory. "Horse" names shape, "white" names colour. The compound "white horse" has distinct criteria. The later Mohists grappled with similar compound name problems. It's a metaphysical claim about naming partitioning things.
  *   **Evaluation:** **Strong.** Marcus correctly identifies the crux: the dialogue challenges the *presupposed ontology* where "horse" unproblematically denotes a unified kind subsuming its coloured instances. His "aspectual separation" captures the text's core move: "horse" picks out *only* the shape-aspect, "white horse" picks out the *concretion* of shape and colour. Invoking the Mohists (e.g., Canons A70-A71 on compound names like "ox-horse") provides vital historical context showing this *was* a live ontological/linguistic issue.

  **Move 5: Eleanor's Collapse Objection & Third Way (Sense/Reference)**
  *   **Claim:** If metaphysical, it's either trivial (words differ) or false (exclusion). The only viable third way is semantic sense/extension difference.
  *   **Evaluation:** **Weak.** This is a false dilemma. Marcus *has* offered a third option: aspectual non-identity. "Horse" names a shape-aspect; "white horse" names a compound object. The compound is not identical to one of its constitutive aspects. This is neither trivial word-difference nor biological kind-exclusion. Her insistence on sense/reference as the *only* alternative ignores the text's explicit framing in terms of naming *functions* ("names shape/colour") and its resistance to subsumption.

  **Move 6: Marcus's Aspectual Whole vs. Aspect**
  *   **Claim:** The third option is aspectual separation: "white horse" names the whole compound, "horse" names one aspect. A whole ≠ its aspect. Fits the Gongsun Longzi better than anachronistic Fregeanism.
  *   **Evaluation:** **Strongest Interpretation So Far.** This coherently explains the advocate's persistence, the seeking argument (seeking the shape-aspect alone vs. seeking the compound), and avoids both triviality and absurdity. It aligns with the text's terminology ("names shape," "names colour") and the broader School of Names project of analyzing objects into distinct, nameable "stuff" (zhi 質) or aspects.

  **Overall Verdict on Reading:**
  *   **Marcus's aspectual separation reading is the best defended.** It accounts for the text's structure (persistence after extensional objection), its key terminology, its place within the School of Names corpus, and relevant historical context (Mohist debates). It takes the radical claim seriously without rendering it absurd.
  *   **Eleanor's semantic reading is valuable but insufficient.** It correctly identifies the *linguistic trigger* (satisfaction conditions) but misdiagnoses the *philosophical target*. The dialogue uses linguistic phenomena to probe ontology, not to articulate a proto-Fregean theory of meaning. Her reading domesticates the text.

  **Crucial Elements Both Are Missing:**
  1.  **The Radical Nominalism/Conventionalism:** Both underplay the *constructive* power of naming implied. "Horse" doesn't merely *refer* to a pre-existing aspect; naming *creates* the aspect as a distinguishable entity within conventional discourse. The dialogue demonstrates how names dissect reality.
  2.  **The Performative Dimension:** The dialogue isn't just stating a theory; it's *performing* the separation. The argumentative moves *show* how naming can isolate aspects ("horse" as pure shape, stripped of colour in the seeking scenario) in a way that challenges intuitive holism.
  3.  **The Target: Common-Sense Holism & Mohist Realism:** The dialogue likely targets the implicit holism of common sense (where a white horse is *simply* a horse) and perhaps Mohist realism about compound names/objects. The aspectual separation is a direct challenge to these views. Eleanor misses the target; Marcus hints at it (mentioning Mohists) but doesn't fully develop the polemical context.
  4.  **"Horse" as Abstraction:** Marcus's "aspect" needs refinement. "Horse" here functions more like an *abstracted universal* (the shape-function, independent of any particular instance or colour) than a concrete aspect like the hardness of *this* stone. The seeking argument highlights this abstractness (any horse satisfies, regardless of colour).

  **Confidence & Least Certain Point:**
  *   **Overall Confidence: 70%.** The aspectual separation reading is the most coherent and contextually grounded. The text's compression and potential corruption leave some ambiguity, but Marcus's framework provides the best fit.
  *   **Least Certain Point:** The precise ontological status of the aspect named by "ma" (horse). Is it a Platonic form-lite, a functional abstraction, a conventional fiction, or something else? The text offers hints but no definitive answer. Marcus leans towards a quasi-realist aspect, but the radical conventionalism of the School of Names suggests it might be more constructed. This point remains philosophically tense and textually underdetermined.

  **In essence:** The White Horse Dialogue uses a linguistic argument (satisfaction conditions) not merely to make a semantic point about terms, but to demonstrate a profound ontological claim: names dissect reality into distinct, non-identical aspects (shape, colour). "Horse" names the abstract shape-aspect; "white horse" names the concrete compound. The compound is not identical to the abstract aspect alone. Marcus correctly identifies this core metaphysical move and its context, while Eleanor's semantic reduction, though insightful on the mechanism, fails to capture the text's philosophical ambition and resistance to familiar subsumption logics. Both, however, could better acknowledge the radical role of naming in *constituting* these aspects within the discourse.
