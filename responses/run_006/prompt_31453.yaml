answer: |-
  ### The pattern
  You're noticing how we selectively attribute causal power to absences or failures: a neighbor's *omission* to water plants gets blamed for their death, whereas your own identical inaction that week wouldn't. Similarly, a specific missing bolt is cited as causing a bridge collapse, while countless other absent bolts aren't considered causes. The distinction hinges on expectations—what someone *should have done* or what *should have been present*—rather than the physical absence alone.

  ### What this is usually called
  This is most commonly discussed under **"omission"** (when tied to agency) or **"causation by absence"** (broader, including non-agential cases). In philosophy of action, it's linked to **"negative actions"** (failing to act). Legal theory uses **"culpable omission"** when duties exist. However, these terms often blur key nuances: "omission" implies agency, ignoring cases like the missing bolt (which lacks intent); "causation by absence" is overly broad, as not all absences are treated as causal (e.g., your own plant-watering inaction). **"Negative causation"** is sometimes used but controversially, as absences aren't events in standard causal models. Each term captures part—duty, absence, or norm violation—but none fully integrates the *expectation-dependent selectivity* you're observing.

  ### Where the real dividing line is
  The core divider is **context-dependent normative expectations**. We treat an absence as causal only when it violates a *presupposed duty, role, or normal function* within a specific frame. Your neighbor’s failure counts because her *promise* created an expectation of action; the missing bolt matters because maintenance protocols *obligated* its replacement. Conversely, your own inaction or other absent bolts lack this normative layer—no duty was breached relative to the salient context. The causal attribution isn't about the absence itself but the *breach of a background condition* deemed necessary for the expected outcome (plant survival, bridge integrity).

  This framework stumbles at the edges. First, **overdetermination cases**: if *both* your neighbor and a hired gardener separately promised to water the plants, and neither did, which omission "caused" the death? We might blame both, but the causal link feels diluted. Second, **ambiguous expectations**: if a passerby *could* have easily saved a drowning child but had no explicit duty, is their inaction causal? We might call it morally culpable but hesitate to say it "caused" the death—highlighting the line between moral and causal blame. Third, **non-agential systems**: in ecology, the "absence of predators" might be cited as causing prey overpopulation. Here, the "norm" is ecological balance, a fuzzy, non-contractual expectation. These edges reveal that the dividing line is less about metaphysics and more about *pragmatic human attribution* based on salience, responsibility, and counterfactual reliance ("if only X had acted...").

  ### A name, if there isn't one
  While existing terms like "normatively constrained omission" or "expectation-relative causation" are descriptive, they’re clunky. A precise yet accessible name could be **normative causation**—emphasizing that the causal status of the absence derives from violated norms, not the absence itself. This centers the phenomenon’s core: *expectations transform inert absences into active causes*.
