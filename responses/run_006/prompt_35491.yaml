  I'm taking a course called "Causation and Theodicy in Medieval Thought," and we've just finished a unit on al-Ghazālī's occasionalism — his view, developed in The Incoherence of the Philosophers, that God is the sole and direct cause of every event, that what we call natural causes are merely occasions on which God creates effects, and that there are no genuine secondary causal powers in created things. We've discussed the standard example: cotton does not burn because of fire; God creates the burning at the moment of contact with fire. The professor has emphasized that this is not merely a theological claim but a metaphysical one about what causation is.

  I'm now working on a paper that brings this framework into conversation with a later European episode I studied in a previous course: the intellectual fallout from the 1755 Lisbon earthquake. The earthquake struck on All Saints' Day, destroyed much of the city, and killed tens of thousands — and it triggered a famous philosophical exchange. Voltaire argued in his Poem on the Lisbon Disaster (and later in Candide) that the catastrophe was a devastating counterexample to Leibnizian optimism, the view that this is the best of all possible worlds and that apparent evils are necessary parts of a harmonious whole. Rousseau responded — in his letter to Voltaire of August 1756 — that the disaster was not a refutation of providence, because most of the suffering was caused not by God or nature but by human choices: dense urban construction, the refusal to evacuate, and so on. The underlying debate was about whether suffering is attributable to divine agency, to natural laws, or to human freedom.

  I want to analyze the Lisbon earthquake debate through the lens of al-Ghazālī's occasionalism, as a kind of thought experiment: what would the occasionalist say about this episode, and what does the episode reveal about occasionalism? I'm not asking for a historical claim about influence — al-Ghazālī was not part of the 18th-century European conversation. Rather, I want you to treat occasionalism as an analytical framework and apply it to the episode, running the analysis in both directions: the framework illuminating the episode, and the episode testing the framework.

  Specifically, please address the following. (1) How would an occasionalist assess the respective positions of Voltaire, Rousseau, and Leibniz? Does occasionalism cut in favor of any of them, or does it reframe the debate in a way that makes their disagreement look mis-posed? (2) One might think occasionalism makes the problem of evil worse than Leibnizianism, because on occasionalism every death is a direct divine act rather than a consequence of natural laws God established for good reason. But Rousseau's argument — that human choices are causally responsible for the scale of the suffering — interacts oddly with occasionalism, since on occasionalism human choices are themselves divinely caused. Walk through that interaction carefully. (3) Identify two features of the Lisbon debate that occasionalism illuminates well, and two that it either misdescribes or cannot speak to. (4) What does the episode, treated as a test case, suggest about occasionalism as a live philosophical position? Does it reveal a hidden strength, an unrecognized weakness, or a limitation of scope — that occasionalism was never meant to address questions like this?

