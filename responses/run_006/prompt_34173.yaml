answer: |-
  Below is the final exam question, a model answer, and a detailed marking scheme designed to test deep understanding of the tension between prioritarianism and egalitarian intuitions.

  ---

  **Essay Question**

  "Prioritarianism avoids the leveling-down objection by denying that equality has intrinsic value. However, this very denial appears to undermine prioritarianism’s ability to explain why it is objectionable when one person is worse off than another through no fault of their own, even in cases where no welfare transfer is possible. Does this objection reveal prioritarianism as a superior theory of distributive justice, or merely force egalitarians to refine their view? In your answer, you should:  
  (i) Explain the leveling-down objection and clarify how a leveled-down outcome could be ‘better’ in one respect yet worse all things considered;  
  (ii) Identify the specific premise of telic egalitarianism rejected by prioritarianism;  
  (iii) Assess whether prioritarianism can coherently explain the ‘comparative unfairness’ of unchosen inequality without implicitly relying on the idea of equality’s intrinsic value;  
  (iv) Defend a reasoned conclusion on the implications of this problem for both theories."

  ---

  **Model Answer (Approx. 800 words)**

  Prioritarianism’s appeal rests significantly on its elegant evasion of the leveling-down objection—a problem that plagues telic egalitarianism. Yet this evasion generates a deeper tension: by severing its connection to the intrinsic value of equality, prioritarianism risks losing grip on the core intuition that unchosen inequality is *unfair*, not merely suboptimal. This essay argues that while prioritarianism succeeds in avoiding incoherent policy prescriptions, it fails to fully capture the moral distinctiveness of comparative unfairness, thereby compelling egalitarians toward deontic or pluralist refinements rather than establishing prioritarianism’s superiority.  

  **(i) Leveling-Down and Partial vs. All-Things-Considered Betterness**  
  The leveling-down objection exposes a paradox in telic egalitarianism. Consider two outcomes: A (Welfare: 10, 5) and B (5, 5). Telic egalitarianism judges B as better *in one respect* because it achieves equality. Yet B is Pareto-inferior: no one gains, and the first person loses. Thus, while B is better regarding equality, it is worse *all things considered* because welfare is reduced overall with no compensating benefit. The objection highlights that valuing equality intrinsically forces adherents to endorse outcomes that are impartially worse, violating the Pareto principle and common-sense morality. Prioritarianism avoids this by evaluating outcomes solely based on the *weighted sum* of welfare, prioritizing gains to the worse off. Leveling down never increases weighted welfare, so it is never recommended.  

  **(ii) The Rejected Premise: Intrinsic Value of Equality**  
  Prioritarianism rejects the *foundational premise* of telic egalitarianism: that equality is intrinsically valuable. Telic egalitarians hold that an equal distribution is better *as such*, even absent instrumental benefits. Prioritarianism, conversely, is strictly *non-relational* and *person-affecting*: it cares only about individuals’ absolute welfare levels, weighted by priority to the worse off. Equality matters only derivatively—when it raises weighted welfare. This divergence explains prioritarianism’s immunity to leveling-down: without intrinsic egalitarian value, reducing welfare to achieve equality cannot be a gain.  

  **(iii) Prioritarianism and Comparative Unfairness: A Failure of Explanation?**  
  Prioritarianism’s rejection of intrinsic equality, however, weakens its ability to explain the intuition that unchosen inequality is unfair. Suppose two siblings inherit resources: one gains a windfall through sheer luck, the other suffers chronic illness through no fault of their own. No transfers are feasible. Telic egalitarians deem this unfair because equality is intrinsically violated; prioritarians can only say the worse-off sibling deserves priority in future allocations. But this fails to address the *comparative complaint*: why is it unjust that *this person* is worse off than *that person* through brute luck? Prioritarianism evaluates states serially (each person’s welfare weighted), not relationally (the gap itself). The theory thus reduces unfairness to absolute disadvantage—losing the distinct wrong of *arbitrary disparity*.  

  Attempts to rescue prioritarianism often smuggle in egalitarianism. One might argue weighting the worse off highly *reflects* unfairness. But this confuses symptom with cause: weighting responds to absolute deprivation, not relational unfairness. If the well-off sibling’s advantage were deserved (e.g., via effort), prioritarianism still weights the ill sibling’s welfare more heavily—but the unfairness vanishes if the inequality is chosen. Prioritarianism lacks the conceptual tools to distinguish deserved from undeserved inequality, as its metric is strictly welfare-based and non-comparative. It thus cannot explain why the *relational* aspect—being worse off *than another* due to luck—matters uniquely.  

  **(iv) Verdict: Prioritarianism Exposed, Egalitarianism Refined**  
  This objection does not establish prioritarianism’s supremacy but reveals its limitations and pushes egalitarians toward refinement. Prioritarianism excels as a theory of *allocative efficiency* under welfare constraints but falters as a full account of distributive *justice* because it cannot articulate why arbitrary inequality is a distinct moral harm. Its escape from leveling-down is purchased by abandoning the relational core of unfairness. Egalitarians, however, can refine their view: by adopting *deontic* rather than telic foundations (e.g., unfairness as a wrongful act, not a bad state), or by embracing *pluralism* (e.g., Parfit’s "egalitarian prioritarianism"). These approaches retain the intuition that arbitrary inequality is unfair while avoiding leveling-down—for instance, by forbidding discrimination rather than mandating equal outcomes.  

  In sum, prioritarianism avoids incoherence but at the cost of moral adequacy. Its inability to capture comparative unfairness suggests that distributive justice requires either a relational element prioritarianism excludes or a hybrid framework. The objection thus ultimately vindicates the egalitarian impulse—demanding its rearticulation, not its abandonment.  

  ---

  **Marking Scheme (25 Marks Total)**  
  **A (21–25 marks):**  
  - **Distinction (i):** Clearly contrasts "better in one respect" (equality) with "worse all things considered" (Pareto/welfare loss).  
  - **Precision (ii):** Identifies rejection of *intrinsic value of equality* (not merely inequality aversion).  
  - **Critical Assessment (iii):** Explains why prioritarianism’s non-relational structure cannot ground *comparative* unfairness (e.g., ignores relational luck/arbitrariness).  
  - **Verdict (iv):** Concludes prioritarianism is *incomplete*, not superior; notes deontic/pluralist egalitarian refinements.  
  - **A+ Hallmarks:** Uses original examples; anticipates objections (e.g., "deserved inequality"); cites key thinkers (e.g., Parfit, Temkin, Lippert-Rasmussen).  

  **B (16–20 marks):**  
  - Covers all four tasks but with minor errors or superficiality.  
  - **Limits to B+:** Confuses Pareto with utilitarianism; vaguely labels prioritarianism "weighted equality."  
  - **Limits to B–:** Omits "through no fault of their own" in unfairness cases; suggests prioritarianism fully explains unfairness.  
  - **Critical Error:** Claims leveling-down objection *defeats* egalitarianism entirely (capped at 18).  

  **C (11–15 marks):**  
  - Addresses 2–3 tasks incompletely.  
  - **Common Errors:**  
    - Equates leveling-down with "equality is bad" (misunderstands telic egalitarianism).  
    - Assumes prioritarianism values equality instrumentally (misreads priority weighting).  
    - Treats unfairness as synonymous with low absolute welfare (ignores relational element).  

  **D (6–10 marks):**  
  - Only addresses 1–2 tasks; serious misunderstandings.  
  - **Common Errors:**  
    - Confuses prioritarianism with utilitarianism (e.g., "cares about total welfare").  
    - Claims leveled-down outcome is better all things considered (misreads the objection).  

  **E (0–5 marks):**  
  - Fails to engage the question; misdefines core terms.  

  **Common Errors & Underlying Misunderstandings:**  
  - **"Prioritarianism avoids leveling-down because equality isn’t a goal"**: Misses that it rejects *intrinsic* value, not pursuit of equality.  
  - **"Unfairness is just low welfare"**: Reduces comparative injustice to absolute disadvantage.  
  - **"Egalitarians must accept leveling-down"**: Ignores deontic/pluralist alternatives.  
  - **"Weighting the worse off makes prioritarianism egalitarian"**: Equates priority with relational equality.  

  --- 

  This question forces students to confront prioritarianism’s trade-off: its coherence requires sacrificing the moral vocabulary to articulate comparative unfairness, revealing its limits rather than its triumph. The model answer and scheme reward students who see that the dispute pushes both theories toward refinement.
