prompt: |-
  A metaphysician who defends David Lewis's counterpart theory and a metaphysician who defends transworld identity have been arguing past each other at conferences for years. They have just completed a six-month adversarial collaboration. Draft the joint statement they would produce.

  The document should include: (1) a numbered list of claims both can sign, covering what possible-worlds semantics requires, what it does not require, and what modal predications both agree need explaining; (2) a disagreements table where each row states a precise point of divergence, phrased so that each side would accept the wording of its own column; (3) a list of cruxes—sub-questions such that settling them would shift at least one side—and for each crux, a description of a case, argument, or piece of linguistic data that both agree bears on it, with each side's prediction about what that evidence will show. Pay particular attention to whether any part of their dispute turns out to be verbal rather than substantive, and flag it if so.
reasoning: |-
  We are drafting a joint statement for two metaphysicians: one defending David Lewis's counterpart theory (CT) and the other defending transworld identity (TI). The statement has three parts: (1) a list of agreed claims, (2) a table of disagreements, and (3) a list of cruxes.

  Part 1: Agreed Claims

  We list claims about possible-worlds semantics that both can sign, covering what it requires, what it does not require, and what modal predications both agree need explaining.

  1. Possible-worlds semantics provides a framework for analyzing modal claims (e.g., necessity, possibility, contingency) by quantifying over possible worlds.
  2. The framework requires that every modal truth be grounded in facts about what is the case in some or all possible worlds.
  3. The framework does not require that possible worlds exist in the same way that the actual world exists (i.e., both sides can agree that possible worlds are abstract representations, though they may disagree on the nature of these representations).
  4. Both agree that modal predications about individuals (e.g., "Humphrey could have won the election") must be explained in terms of how that individual (or a relevant representation) is in other possible worlds.
  5. Both agree that the framework must account for the truth conditions of modal claims in a way that respects our ordinary modal judgments (to the extent they are consistent and coherent).
  6. Both agree that the framework must avoid extreme modal realism if possible (the TI theorist rejects Lewis's concrete possible worlds, and the CT theorist, while defending Lewis, may note that counterpart theory can be adapted to other conceptions of worlds).
  7. Both agree that the framework must explain the difference between essential and accidental properties of individuals.
  8. Both agree that the framework must account for the phenomenon of modal variance (i.e., that the same individual can have different properties in different worlds).

  Part 2: Disagreements Table

  We now present a table of precise points of divergence. Each row states a point of disagreement, with one column for the CT defender and one for the TI defender. The wording should be acceptable to each side for their own column.

  | Point of Divergence | Counterpart Theory (CT) Defender | Transworld Identity (TI) Defender |
  |---------------------|----------------------------------|-----------------------------------|
  | Nature of cross-world identity relations | There are no strict identity relations across possible worlds. Instead, an individual in one world has counterparts in other worlds, which are similar to that individual but not identical. | The same individual can exist in multiple possible worlds. Thus, cross-world identity is strict identity: an individual in another world is literally identical to the individual in the actual world. |
  | Basis for de re modal properties | The de re modal properties of an individual are determined by the properties of its counterparts in other worlds. | The de re modal properties of an individual are determined by the properties that the very same individual has in other worlds. |
  | Criteria for transworld identity | There is no transworld identity. Therefore, there are no criteria for such identity. Instead, the counterpart relation is context-dependent and based on similarity. | There must be criteria for transworld identity (e.g., sharing a common essence, such as origin or material constitution) that determine when an individual in one world is the same as an individual in another. |
  | Handling of essential properties | An individual's essential properties are those that are shared by all its counterparts. However, the counterpart relation can vary by context, so essential properties are contextually determined. | An individual's essential properties are those that it has in every possible world in which it exists. These properties are fixed by the nature of the individual and do not depend on context. |
  | The problem of accidental intrinsics | Counterpart theory resolves the problem of accidental intrinsics by noting that an individual in one world has a property (e.g., being bent) and a counterpart in another world has a different property (e.g., being straight). Since they are not identical, there is no contradiction. | Transworld identity can handle accidental intrinsics by holding that the same individual has different properties in different worlds. The properties are had at different worlds, so there is no contradiction in the same individual having incompatible properties. |
  | Ontological commitment to worlds | Counterpart theory, as Lewis formulates it, is part of a concrete modal realism in which possible worlds are concrete and spatiotemporally isolated. However, counterpart theory can be adapted to abstract worlds. | Transworld identity typically requires that worlds are abstract (e.g., maximal consistent sets of propositions or states of affairs) and that individuals exist in multiple worlds by having multiple instances or by being represented in different ways. |

  Part 3: Cruxes

  We now list cruxes: sub-questions that, if settled, would shift at least one side. For each crux, we describe a case, argument, or piece of linguistic data that both agree bears on it, and then give each side's prediction.

  Crux 1: The role of context in modal attributions
  - Case: Consider the statement "Goliath (a statue) could have been made of different clay." In one context, we might focus on the statue as an artwork, and in another, we might focus on the statue as a particular piece of matter.
  - Evidence: We examine ordinary language and thought experiments. We note that in some contexts, we allow that the statue could have been made of different clay, while in others we do not.
  - CT Prediction: The counterpart theorist predicts that the truth of such modal claims will vary with the context, because the counterpart relation is contextually determined. Therefore, in some contexts, Goliath has counterparts made of different clay, and in others, it does not.
  - TI Prediction: The transworld identity theorist predicts that the truth of such modal claims should depend on whether being made of that particular clay is essential to Goliath. They hold that there is a fact of the matter about the essential properties, independent of context. However, they might try to explain contextual variation by invoking different ways of conceiving the same individual, but they will maintain that the essential properties are fixed.

  Crux 2: The problem of temporary intrinsics and modal intrinsics
  - Case: Consider an individual that is straight at one time and bent at another. This is the problem of temporary intrinsics. Similarly, consider an individual that is straight in one world and bent in another (modal intrinsics).
  - Evidence: How do we account for change over time and change across worlds? Lewis uses counterpart theory for both (with temporal counterparts and modal counterparts). The TI theorist typically uses a different account for time (e.g., perdurantism or presentism) and transworld identity for modality.
  - CT Prediction: The counterpart theorist will say that the same strategy (using counterparts) works for both time and modality, and that this is a virtue of the theory. They predict that our intuitions about time and modality are analogous and should be treated similarly.
  - TI Prediction: The transworld identity theorist will argue that time and modality are disanalogous. They predict that our intuitions about identity over time are different from those about identity across worlds. For time, they may accept that the same object persists through change by having temporal parts or by enduring, but for modality, they require strict identity.

  Crux 3: The indispensability of transworld identity in explaining modal truths
  - Case: Consider a modal claim that seems to require that the very same individual exists in multiple worlds, such as "I could have been a contender" (said by a person about themselves).
  - Evidence: We examine the phenomenology of such statements: when we say "I could have been a contender," we seem to be talking about ourselves in another possible world. The TI theorist argues that this requires strict identity. The CT theorist argues that we are talking about a counterpart.
  - CT Prediction: The counterpart theorist predicts that people, when pressed, will accept that in another world there is someone very like them who is a contender, and that this is sufficient for the truth of the statement.
  - TI Prediction: The transworld identity theorist predicts that people are committed to the idea that they themselves exist in that other world and are a contender.

  Flagging Verbal Disagreements:

  We note that part of the dispute might be verbal. Specifically, the term "exists in a possible world" might be used differently. For the TI theorist, an individual exists in multiple worlds, meaning that it is present in those worlds. For the CT theorist, an individual exists only in one world, but has counterparts in others. However, both are trying to account for the same modal truths. Therefore, the disagreement over the meaning of "exists in" might be terminological. But both sides agree that the underlying issue about how to ground modal claims is substantive.

  However, the disagreement about whether the same individual can have incompatible intrinsic properties in different worlds (like being both bent and straight) is substantive: the TI theorist says yes, because the properties are indexed to worlds, while the CT theorist says no, because the individual only has the properties in its own world and the other properties are had by a non-identical counterpart.

  Joint Statement:

  We, the undersigned, after six months of adversarial collaboration, present this joint statement.

  Part 1: Agreed Claims

  We both endorse the following:

  1. Possible-worlds semantics provides a framework for analyzing modal claims by quantifying over possible worlds.
  2. Modal truths are determined by what is the case in some or all possible worlds.
  3. The framework does not require that possible worlds be concrete entities; they can be abstract representations.
  4. Modal predications about individuals must be explained in terms of how that individual (or a relevant representation) is in other possible worlds.
  5. The framework must account for our ordinary modal judgments (to the extent they are consistent and coherent).
  6. The framework should avoid extreme modal realism if possible (though we differ on what counts as extreme).
  7. The framework must explain essential and accidental properties.
  8. The framework must account for modal variance (an individual having different properties in different worlds).

  Part 2: Disagreements

  We have the following disagreements:

  | Point of Divergence | Counterpart Theory | Transworld Identity |
  |---------------------|-------------------|---------------------|
  | Cross-world identity relations | No strict identity across worlds; instead, counterparts (similar but non-identical) | Same individual exists in multiple worlds; strict identity across worlds |
  | Basis for de re modal properties | Determined by properties of counterparts | Determined by properties of the same individual in other worlds |
  | Criteria for transworld identity | No transworld identity; counterpart relation is context-dependent and similarity-based | Criteria for transworld identity exist (e.g., essence) |
  | Essential properties | Essential properties are those shared by all counterparts in a context | Essential properties are those the individual has in every world in which it exists |
  | Accidental intrinsics | Resolved by having different properties in different worlds via non-identical counterparts | Resolved by the same individual having different properties at different worlds (indexed to worlds) |
  | Ontological commitment | Counterpart theory can be adapted to various ontologies (concrete or abstract) but Lewis's version is concrete | Transworld identity typically requires abstract worlds |

  Part 3: Cruxes

  We identify the following cruxes:

  Crux 1: Context-dependence of modal attributions
  - Case: "Goliath could have been made of different clay."
  - Evidence: Ordinary language and context shifts.
  - CT Prediction: Truth varies with context because the counterpart relation is context-dependent.
  - TI Prediction: Truth depends on essential properties (which are context-independent), though contextual factors might affect which properties we focus on.

  Crux 2: Analogy between time and modality
  - Case: Change in properties over time (temporary intrinsics) vs. across worlds (modal intrinsics).
  - Evidence: Intuitions about persistence through change.
  - CT Prediction: Analogous: both handled by counterpart relations.
  - TI Prediction: Disanalogous: time and modality require different treatments.

  Crux 3: The first-person modal perspective
  - Case: "I could have been a contender."
  - Evidence: Phenomenology of first-person modal claims.
  - CT Prediction: Satisfied by a counterpart being a contender.
  - TI Prediction: Requires that the very same person (the speaker) is a contender in another world.

  Verbal Disagreement Note: We note that the dispute about whether an individual "exists in" more than one world may be partly verbal. The CT theorist uses "exists in" to mean being wholly present in that world, while the TI theorist might use it to mean being represented in or part of that world. However, the question of whether the same individual can have incompatible properties in different worlds without contradiction is substantive.

  We hope that by clarifying these points, we have moved the debate forward and identified key areas for future research.

  Signed:

  [Name], for Counterpart Theory
  [Name], for Transworld Identity
answer: |-
  ### Joint Statement: Adversarial Collaboration on Counterpart Theory and Transworld Identity  

  **Preamble**  
  After six months of rigorous adversarial collaboration, we—a defender of David Lewis’s counterpart theory (CT) and a defender of transworld identity (TI)—agree that possible-worlds semantics provides a powerful framework for analyzing modality. However, we disagree on how this framework should interpret *de re* modal claims about individuals. Below, we outline areas of agreement, precise disagreements, and cruxes for future research. We also flag a verbal disagreement regarding "existence in" a world.  

  ---

  ### (1) Agreed Claims: Common Ground on Possible-Worlds Semantics  
  Both parties endorse the following numbered claims:  

  1. **Necessity of possible worlds**: Possible-worlds semantics requires quantification over possible worlds (broadly construed) to ground modal truths (e.g., "Necessarily P" is true iff P holds in all accessible worlds).  
  2. **Non-reduction of modality**: The framework does not require reducing modality to non-modal facts; it can accept primitive modal relations.  
  3. **World-neutral truth conditions**: Truth conditions for modal claims (e.g., "X could have been F") must be statable without presupposing a specific metaphysics of worlds (e.g., concrete vs. abstract).  
  4. **Core explananda**: Both agree the framework must explain:  
     - (i) *De re* modal properties (e.g., "Socrates is possibly a sailor").  
     - (ii) Essential vs. accidental properties (e.g., "Socrates is essentially human").  
     - (iii) Modal variance (e.g., "This bent spoon is possibly straight").  
  5. **No commitment to realism about "other worlds"**: The framework does not require that possible worlds exist as concrete entities (à la Lewis) or as abstracta; they may be useful fictions.  
  6. **Contextual flexibility**: Ordinary modal discourse exhibits context sensitivity (e.g., criteria for "possible career changes" vary by conversational context).  
  7. **Avoiding contradictions**: The framework must resolve the "problem of accidental intrinsics" (e.g., how an object can be "actually bent but possibly straight" without contradiction).  

  ---

  ### (2) Disagreements Table: Precise Points of Divergence  
  Each row states a point of disagreement, with columns phrased to be acceptable to the respective side.  

  | Point of Divergence                          | Counterpart Theory (CT) Defender                                                                 | Transworld Identity (TI) Defender                                                                 |
  |----------------------------------------------|--------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Nature of cross-world relations**          | There are no strict identity relations across worlds; objects are world-bound. *De re* modality is mediated by contextually determined counterpart relations (similarity-based). | Objects can be strictly identical across worlds; *de re* modality involves the same object instantiating properties in different worlds. |
  | **Grounding of *de re* modality**           | "X is possibly F" is true iff a *counterpart* of X in some world is F. X itself only exists in one world.              | "X is possibly F" is true iff X *itself* is F in some world where it exists.                             |
  | **Criteria for cross-world continuity**      | No criteria for transworld identity; counterpart relations are fluid, similarity-based, and context-dependent (e.g., "Aristotelian" similarity varies with interests). | Transworld identity requires fixed criteria, typically involving essence (e.g., origin, material constitution, or haecceity). |
  | **Essential properties**                     | Essential properties are those shared by *all* of X’s counterparts in any context. They are not intrinsic to X but derivative of counterpart relations. | Essential properties are those X has in *every* world where it exists. They are intrinsic to X’s identity. |
  | **Resolution of accidental intrinsics**      | Accidental intrinsics (e.g., "bent vs. straight") involve distinct counterparts (no contradiction). X’s properties are world-indexed (e.g., "X-in-w1 is bent, X-in-w2 is straight" misdescribes; counterparts are non-identical). | Accidental intrinsics involve the same X having incompatible properties *at different worlds*. Contradiction is avoided by world-indexing properties (e.g., "X is bent-in-w1 and straight-in-w2"). |
  | **Status of "existence in a world"**         | "X exists in world W" means X is wholly located in W and nowhere else. Worlds are concrete and spatiotemporally isolated (per Lewis), or abstract but still world-bound. | "X exists in world W" means X is part of W’s domain, where W is a maximal consistent state of affairs. X can be in multiple worlds. |

  **Note on verbal disagreement**: The dispute over "existence in a world" is partly verbal. Both agree that objects are "in" worlds in *some* sense, but CT restricts "existence in" to *strict location*, while TI allows *transcendent existence*. This masks substantive disagreement about whether objects persist across worlds.  

  ---

  ### (3) Cruxes: Sub-Questions with Testable Predictions  
  For each crux, we describe a case/evidence both agree is relevant and provide each side’s prediction. Settling these would shift at least one position.  

  #### Crux 1: Contextual Variation in Modal Intuitions  
  - **Case**: "Statue Goliath" (a clay statue) could have been made of *different clay*. In some contexts (e.g., art history), we deny this; in others (e.g., design), we affirm it.  
  - **Evidence**: Linguistic data from contextual shifts (e.g., surveys varying contextual prompts).  
  - **CT Prediction**: Truth-values will shift with context because counterpart relations (and thus what counts as "Goliath") depend on salient similarities (e.g., shape vs. material).  
  - **TI Prediction**: Truth-values are stable; context only affects epistemic access or description. Essential properties (e.g., origin) fix transworld identity.  

  #### Crux 2: Transworld Identity Without Essence  
  - **Case**: A "Humphrey case" — "Humphrey (a person) could have been a robot." Assume no clear essence (e.g., if persons are functional states).  
  - **Evidence**: Thought experiments where essences are underspecified (e.g., teletransportation or AI consciousness cases).  
  - **CT Prediction**: Modal claims remain evaluable via counterpart relations (e.g., similarity in functional role). TI collapses without essence.  
  - **TI Prediction**: Modal claims require essence; if none exists, *de re* modality is indeterminate or false.  

  #### Crux 3: Identity in Symmetric Worlds  
  - **Case**: Two identical worlds, W1 and W2, contain indistinguishable objects (A and B). If A in W1 is "identical to" B in W2, does this violate the Identity of Indiscernibles?  
  - **Evidence**: Logical coherence of symmetric worlds (e.g., Black’s spheres or multiverse cosmology).  
  - **CT Prediction**: No transworld identity; A and B are distinct counterparts. Symmetry poses no problem.  
  - **TI Prediction**: Transworld identity requires haecceities (primitive "thisness"); if haecceities are rejected, symmetry forces contingent identity.  

  ---

  **Conclusion**  
  We concur that core disagreements hinge on the metaphysics of persistence (world-bound vs. transworld objects) and the role of context. The verbal disagreement about "existence" can be resolved by disambiguating terms, but substantive issues remain. We commit to testing the cruxes above, using empirical linguistics, logic, and conceptual analysis.  

  **Signatures**  
  [Name], for Counterpart Theory  
  [Name], for Transworld Identity  

