  I keep seeing Nozick's tracking theory introduced mainly as the view that preserves ordinary knowledge by giving up closure under known entailment, and I want a standard of success in place before I read the theories in full. Write the desiderata that any adequate theory of knowledge must meet on the question of closure: the cases it has to get right, the distinctions it cannot collapse, and the costs it must either pay or explain away. For each desideratum, give the case or consideration that makes it a requirement, and say whether it is non-negotiable or a commitment of a particular camp, such as sensitivity, safety, contextualism, or Mooreanism. Where two of the desiderata cannot be jointly satisfied, flag that under the relevant item. Please answer as exactly five numbered desiderata, each a sentence or two, with no introduction or conclusion.
