answer: |-
  Here are five desiderata for theories of knowledge regarding closure under known entailment:

  1.  **Preserve Ordinary Knowledge:** The theory must accommodate the strong intuition that we possess everyday empirical knowledge (e.g., "I have hands," "That's a zebra") without requiring us to know the denial of every conceivable skeptical hypothesis (e.g., "I am not a handless brain in a vat"). This is non-negotiable for anti-skeptical theories (e.g., Mooreanism, most Contextualism, Tracking) but rejected by skepticism.
  2.  **Respect the Closure Principle (or Explain Failure):** The theory must either validate the principle that knowledge is closed under known entailment (if S knows P and knows P entails Q, then S knows Q) or provide a compelling explanation for why it *seems* valid yet fails in specific cases. Classical Invariantism typically holds this non-negotiable; Tracking, Dretske, and some versions of Reliabilism explicitly reject it.
  3.  **Handle Skeptical Hypotheses:** The theory must account for the powerful intuition that we *cannot* know we are not in skeptical scenarios (e.g., not a brain in a vat (BIV)). This is a key commitment of Sensitivity theories (like Tracking) and Contextualism (in high-standards contexts), often conflicting with desiderata 1 & 2 – if closure holds and we have ordinary knowledge, we *could* know we're not BIVs, contradicting this intuition.
  4.  **Address the Moorean Shift:** The theory must explain the apparent force of the Moorean argument (using closure to move from "I know I have hands" to "I know I'm not a BIV") *and* explain why it remains philosophically unsatisfying despite its logical structure. Theories accepting closure (like Classical Invariantism) must explain the persistent doubt; theories rejecting closure (like Tracking) must explain why the argument seems compelling initially.
  5.  **Distinguish Lottery & Preface Cases:** The theory must explain why we intuitively lack knowledge in Lottery cases (I don't *know* my ticket will lose, despite overwhelming odds) but often attribute knowledge in structurally similar Preface cases (an author knows their book contains some error, despite each claim being individually well-supported). This distinction challenges simple probabilistic accounts of knowledge and closure; Safety theories often handle lottery cases better than Sensitivity. *Conflict Flag:* Rigidly applying closure to lottery cases (if I know *this* ticket will lose, I know *no* ticket will win) leads to skepticism about future events, conflicting with desideratum 1.
