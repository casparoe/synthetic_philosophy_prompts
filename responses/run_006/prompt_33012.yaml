prompt: |-
  I direct communications for a state public health agency. We design campaigns to shift behavior—vaccination uptake, smoking cessation, opioid awareness—and we routinely use framing, social-norms messaging, emotional appeals, and defaults. We are also regularly accused of manipulation. I need a decision procedure my team can run on a proposed technique before a campaign launches: a sequence of questions that distinguishes legitimate persuasion from manipulation, with clear stopping rules and guidance on what counts as a sufficient answer to each. It should draw on the best philosophical work on this distinction but be usable by a communications professional without a philosophy background. Flag every step where the procedure hands off to human judgment rather than delivering a mechanical result. Then run the procedure on two cases: (1) a campaign that uses graphic images of diseased lungs to deter teen smoking, and (2) a campaign that frames vaccine refusal as letting down your community. For at least one of these, make sure the procedure returns an answer my team might resist. Close by saying what the procedure cannot handle—what kinds of cases it will misclassify or leave unsettled. Throughout, indicate how confident you are in each key claim and single out the point you are least sure of.
reasoning: |-
  Okay, the user works in communications for a state public health agency and faces accusations of manipulation when running campaigns. They need a decision procedure to distinguish legitimate persuasion from manipulation, drawing on philosophical concepts but usable by non-philosophers. 

  First, I need to unpack what makes this request complex. The line between persuasion and manipulation is notoriously fuzzy in philosophy - there's no universal definition. The user needs something practical, not theoretical. They're dealing with real-world campaigns about smoking, vaccines, opioids - high-stakes public health issues where ethical missteps could erode public trust.

  Hmm... the user mentions specific techniques: framing, social norms, emotional appeals, defaults. That's helpful. I should build the procedure around evaluating these. The key philosophical anchors seem to be autonomy (does it respect choice?), transparency (is the mechanism hidden?), and benefit (does it serve genuine welfare?). 

  For the procedure design, I'm considering a flowchart-style checklist with clear stopping rules. But it must flag where human judgment is needed - that's crucial. The user wants operational clarity, not academic debate. Let me structure it as a series of yes/no gates where any "no" triggers a manipulation warning.

  Wait - the test cases! The diseased lungs campaign is classic fear appeal. Philosophy is divided here: some say it's manipulative if it bypasses reason, others argue it's legitimate warning. The "letting down community" framing plays on social pressure - that could be tricky. I should make sure one outcome challenges their assumptions to prove the tool's rigor.

  Biggest challenge: what this tool CAN'T handle. Some cases will be edge cases - like nudges exploiting cognitive biases without deception. Also, cultural differences in what counts as manipulation. And intention matters - but we can't mind-read. I'll need to admit these limitations upfront.

  Least confident point? Probably the "proportionality" assessment in Step 4. It's so subjective - one person's reasonable emotional appeal is another's manipulation. But we have to include it because impact matters ethically. I'll note low confidence there.

  The user's deeper need seems to be maintaining ethical integrity while doing effective work. They want to push boundaries without crossing lines - that's smart. My procedure should empower them to innovate responsibly.
answer: |-
  Here’s a decision procedure based on philosophical frameworks (e.g., autonomy-based theories, Kantian ethics, and Nudge Theory critiques), distilled into a 7-step checklist with stopping rules. Steps requiring human judgment are flagged (**⚖️ JUDGMENT**). Confidence levels (High/Medium/Low) reflect philosophical consensus and empirical applicability.

  ---

  ### **Decision Procedure: Legitimate Persuasion vs. Manipulation**  
  *(Run sequentially — a "NO" at any step halts the campaign for revision.)*

  1. **TRANSPARENCY TEST**  
     *"Would the target audience recognize the persuasive intent and mechanism if explained plainly?"*  
     - **Sufficient Answer:** YES if the technique is openly describable without undermining its effect (e.g., "We’re showing graphic health consequences to discourage smoking").  
     - NO if success depends on hiding the intent (e.g., covertly using peer pressure).  
     **Stopping Rule:** STOP if NO (manipulative).  
     **⚖️ JUDGMENT:** Assessing "recognizability" requires cultural/contextual insight.  

  2. **AUTONOMY CHECK**  
     *"Does this technique preserve the audience’s ability to make a reasoned choice?"*  
     - **Sufficient Answer:** YES if it provides accurate information, appeals to rational faculties, or leverages emotions *without* overriding decision-making capacity.  
     - NO if it exploits cognitive biases to bypass reflection (e.g., using subconscious triggers unrelated to the issue).  
     **Stopping Rule:** STOP if NO.  
     **⚖️ JUDGMENT:** Determining "bypassing reason" is context-dependent (e.g., urgency in emergencies may justify strong emotions).  

  3. **BENEFICENCE ASSESSMENT**  
     *"Is the campaign’s primary goal aligned with the audience’s best interests, based on robust evidence?"*  
     - **Sufficient Answer:** YES if the behavior change clearly improves health outcomes (e.g., vaccination reduces disease risk), supported by scientific consensus.  
     - NO if benefits are speculative or prioritize institutional interests over individual welfare.  
     **Stopping Rule:** STOP if NO.  
     **Confidence: High** (aligns with public health ethics).  

  4. **PROPORTIONALITY REVIEW**  
     *"Is the technique’s intensity proportionate to the harm it addresses?"*  
     - **Sufficient Answer:** YES if the emotional/psychological weight matches the severity of the issue (e.g., graphic images for life-threatening risks).  
     - NO if the technique is excessively shocking or coercive relative to the problem (e.g., extreme fear tactics for minor risks).  
     **Stopping Rule:** STOP if NO.  
     **⚖️ JUDGMENT:** Balancing harm/response is inherently subjective.  

  5. **RESPECT FOR AGENCY**  
     *"Does the technique avoid exploiting vulnerabilities (e.g., trauma, insecurity, social isolation)?"*  
     - **Sufficient Answer:** YES if it empowers or educates without targeting transient states (e.g., using pride in community, not shame).  
     - NO if it weaponizes audience fragility (e.g., inducing panic in anxiety-prone groups).  
     **Stopping Rule:** STOP if NO.  
     **Confidence: Medium** (vulnerability is situational).  

  6. **TRUTHFULNESS VERIFICATION**  
     *"Is the message factually accurate and non-deceptive?"*  
     - **Sufficient Answer:** YES if all claims are evidence-based and contextually honest.  
     - NO if it uses exaggeration, misleading statistics, or omitted counter-evidence.  
     **Stopping Rule:** STOP if NO.  
     **Confidence: High** (objective standard).  

  7. **REVERSIBILITY TEST**  
     *"Would we accept this technique if used on us for a cause we oppose?"*  
     - **Sufficient Answer:** YES if the method respects universal ethical norms (e.g., "Would I accept graphic images warning about climate change if I were a skeptic?").  
     - NO if it relies on tactics we’d condemn in adversarial hands.  
     **Stopping Rule:** STOP if NO.  
     **⚖️ JUDGMENT:** Requires empathetic perspective-taking.  

  ---

  ### **Case Analyses**  
  **Case 1: Graphic images of diseased lungs to deter teen smoking**  
  1. **Transparency:** YES (intent is clear).  
  2. **Autonomy:** YES (appeals to health consequences; doesn’t bypass reason).  
  3. **Beneficence:** YES (smoking causes lung disease).  
  4. **Proportionality:** ⚖️ DEBATABLE (teens may process shock differently; assess audience research on trauma triggers).  
  5. **Respect for Agency:** YES (if not targeting pre-existing trauma).  
  6. **Truthfulness:** YES (images reflect medical reality).  
  7. **Reversibility:** YES (if images are clinically accurate).  
  **VERDICT:** **Legitimate persuasion** *if* proportionality concerns are addressed (e.g., pairing with resources/support).  

  **Case 2: Framing vaccine refusal as "letting down your community"**  
  1. **Transparency:** YES (social norms are explicit).  
  2. **Autonomy:** ⚖️ RISKY (may evoke guilt that overrides personal risk assessment).  
  3. **Beneficence:** YES (herd immunity benefits community).  
  4. **Proportionality:** YES (pandemic-level threat justifies communal appeal).  
  5. **Respect for Agency:** ⚖️ NO if targeting isolated/elderly (exploits fear of exclusion); YES if general audience.  
  6. **Truthfulness:** YES (refusal *does* increase community risk).  
  7. **Reversibility:** ⚖️ NO (e.g., would we accept "not donating to X cause = failing your community"?).  
  **VERDICT:** **Potentially manipulative** (fails Autonomy/Reversibility if guilt is weaponized). *This may challenge your team* — social-norms framing is common but risks coercion if communal pressure overrides individual consent.  

  **Confidence Key:**  
  - Highest in Truthfulness/Beneficence (objective criteria).  
  - **Least Confident in Proportionality** (cultural/individual variation in emotional tolerance).  

  ---

  ### **What the Procedure Cannot Handle**  
  1. **Cultural Relativism:** A technique acceptable in one group (e.g., direct communal appeals) may manipulate another.  
  2. **Unconscious Nudges:** Defaults (e.g., opt-out organ donation) pass all checks but are still contested as "coercive" in philosophy.  
  3. **Long-Term Effects:** Repeated exposure to guilt/fear appeals may erode trust, but this is hard to pre-assess.  
  4. **Ambiguous Intent:** Campaigns with mixed motives (e.g., political pressure alongside health goals).  

  **Recommendation:** Pair this with diverse focus groups to stress-test judgment steps. Philosophical tools flag risks but can’t replace contextual wisdom.  

  > "Ethics is not an algorithm. This procedure illuminates cliffs but doesn’t build guardrails — your team must drive carefully."
