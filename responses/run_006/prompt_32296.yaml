prompt: |-
  I'm a philosophy PhD student working on the ethics of intellectual property, and I'm trying to work out what I actually think about when one person may use another's ideas or creative work without permission. Going by my reactions to particular cases: posting a non-commercial fan fiction story online using a living author's characters and setting seems fine to me, but publishing an unauthorized commercial sequel using those same characters seems wrong. Sampling a two-second drum break from an old record without clearance and building an otherwise new track around it seems fine, but lifting another song's chorus, melody and lyric, into a new song seems wrong. Reverse-engineering a restaurant's signature sauce and selling a near-identical sauce under one's own label seems fine. Hearing a colleague's unpublished experimental design at a colloquium and then running and publishing the study first seems wrong. Independently proving a theorem that someone else proved a year earlier, without knowledge of the earlier proof, seems fine. And a company sequencing a naturally occurring gene and patenting the isolated sequence so that it can charge diagnostic labs license fees seems wrong.

  My working principle is that one can have rights in particular expressions and in confidential information, but not in ideas, methods, or facts themselves. That fits the sequel, the chorus, the sauce, the colloquium case, the theorem, and the gene. But it seems to condemn the fan fiction and the drum break, which I don't want to condemn, and it gives no account of why the fan fiction and the commercial sequel differ when both use the same protected expression. Is there a principle that captures all or most of these verdicts, which of them would it force me to abandon, and what would it say about a designer who copies the cut and construction of a couture dress and sells a lower-priced version?
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're a philosophy PhD student focusing on the ethics of intellectual property. They've listed several scenarios where using someone else's ideas or creative work without permission seems either acceptable or wrong to them. Their working principle is that rights apply to expressions and confidential info, but not to ideas, methods, or facts. However, this principle doesn't fully align with their intuitions, especially regarding fan fiction and drum sampling. They also mention a new scenario about copying a couture dress design.

  First, I need to break down each case they provided. They have clear intuitions about each one, so identifying the underlying factors is key. Let me list them out:

  1. Non-commercial fan fiction: Okay
  2. Commercial sequel: Not okay
  3. Two-second drum break sampling: Okay
  4. Lifting a chorus: Not okay
  5. Reverse-engineering sauce: Okay
  6. Using a colleague's unpublished design: Not okay
  7. Independent theorem proof: Okay
  8. Patenting a gene: Not okay

  Their principle about expressions vs. ideas works for most cases except fan fiction and drum sampling. Why? Fan fiction uses characters and settings (expressions), so by their principle, it should be wrong, but they feel it's fine. Drum sampling uses a snippet of a recording (expression), yet they're okay with it. The commercial sequel, which also uses expressions, is not okay. So the difference might be commercial vs. non-commercial use? But the drum sampling case might be commercial if it's in a new track, but they still think it's okay. Hmm, maybe the amount used matters? Two seconds vs. a whole chorus.

  Also, the sauce reverse-engineering: that's a method or idea, so under their principle, it's not protected, which aligns. The colleague's experimental design—unpublished, so confidential? That fits. Independent theorem: facts/methods, no protection. Gene patenting: facts of nature, so wrong to patent.

  But the fan fiction and drum break are the outliers. Maybe the distinction is about transformation? Fan fiction creates something new using the characters, and the drum sample is a small part of a new track. The commercial sequel is derivative without significant transformation. The chorus lifting is direct copying without transformation. 

  So perhaps a better principle involves transformation and market substitution. If the use is transformative and doesn't replace the original, it's okay. Fan fiction adds new stories, doesn't replace the original book. The drum sample is transformed into a new genre. The commercial sequel directly competes with the author's potential sequel. The chorus copy competes with the original song. 

  The sauce case: reverse-engineered but sold as a different product. Does it compete directly? Maybe not if it's under a different brand, but the original restaurant might lose sales. But the user thinks it's okay. So maybe the effort in reverse-engineering justifies it? Or the fact that the recipe isn't protected as expression. 

  The couture dress scenario: copying the cut and construction. That's about design, which could be seen as a method. But fashion designs aren't strongly protected. The user might think it's okay because it's making high fashion accessible, but it could harm the original designer's market. However, if the copy is sold at a lower price point, it might not directly compete with the couture market. 

  So the key factors are: transformation, market harm, effort, and nature of the IP. Also, confidences and labor investment. For the colleague's idea, it's stolen labor because the colleague hasn't published yet. The gene patenting is monopolizing a natural fact, which is wrong. 

  The user needs a principle that accounts for all these. Maybe a combination of Lockean labor-desert, avoiding free-riding, and promoting progress. Also, consider transaction costs: clearing a two-second sample might be too costly versus the value, making it impractical. 

  For the couture dress, if the copy is transformative or targets a different market, it might be okay. But direct copying without adding new elements might be seen as free-riding on the designer's labor. However, the fashion industry often allows such copying, arguing it drives innovation. 

  So the refined principle could be: Permissible use when it's transformative, doesn't cause market harm, or the cost of permission is prohibitive relative to the use. But this might still have gray areas. The user might need to accept that some intuitions don't fit perfectly or adjust their stance on fan fiction as a special case due to cultural practices.
answer: |-
  Your intuitions reveal a sophisticated ethical framework that *mostly* aligns with core IP principles but highlights tensions around **transformation, market harm, free-riding, and practical norms**. Here's a principle that captures most of your verdicts, along with its implications:

  ---

  ### **Proposed Principle:**
  **"Unexpressed ideas, facts, and functional methods belong to the commons. Control over expressions, labor-intensive compilations, or confidential insights is justified only to prevent *market-substituting appropriation* or *unfair free-riding on another's significant labor*, provided this control doesn't stifle transformative reuse or lock up foundational knowledge."**

  ---

  ### **How This Principle Explains Your Cases:**
  1. **Non-commercial fan fiction**:  
     - **Permissible**: Transformative reuse (new story/meaning), non-substitutive (doesn't replace the original), minimal market harm. Free-riding is offset by cultural participation norms.

  2. **Commercial unauthorized sequel**:  
     - **Wrong**: Direct market substitution (competes with authorized sequels), exploits the original's labor and goodwill without consent. Pure free-riding.

  3. **Two-second drum break sampling**:  
     - **Permissible**: De minimis use (functionally a "fact"/raw material), highly transformative in new context, no market substitution. Licensing impractical.

  4. **Lifting a chorus**:  
     - **Wrong**: Non-transformative copying of core expressive "heart," directly substitutable, free-riding on original's creative labor.

  5. **Reverse-engineered sauce**:  
     - **Permissible**: Functional method/unprotected recipe. No confidential breach; labor invested in reverse-engineering. Market competition is legitimate.

  6. **Stealing unpublished experiment**:  
     - **Wrong**: Confidential information + unfair free-riding on labor-intensive design. Deprives colleague of first-mover credit/benefits.

  7. **Independent theorem proof**:  
     - **Permissible**: Facts/methods are unownable. No free-riding (independent labor). "Priority" claims limited to publication context.

  8. **Patenting a gene sequence**:  
     - **Wrong**: Facts of nature belong to commons. Patent locks up foundational knowledge, enabling rent-seeking without ongoing labor.

  ---

  ### **Where Your Initial Principle Falters (and Why):**
  - **Fan fiction & drum breaks** *use protected expression* but are permissible under the proposed principle due to:  
    - **Transformation**: Repurposing creates new value.  
    - **Non-substitution**: Doesn't usurp the original's market.  
    - **Norms/Practicality**: Fan fiction sustains fandom; sampling treats short sounds as raw material.  
  - **Commercial vs. non-commercial fan fiction**: The key distinction is **market harm/free-riding**. Commercial use directly monetizes another's world-building without consent.

  ---

  ### **The Couture Dress Case:**
  Applying the proposed principle:  
  - **Copying cut/construction of a couture dress for a cheaper version**:  
    - **Likely Permissible**:  
      - **Functional method**: Garment construction is utilitarian (not purely expressive).  
      - **Labor justification**: The copier invests labor in reverse-engineering/production.  
      - **Market differentiation**: Targets a distinct price segment (non-luxury buyers), minimizing substitution.  
    - **But Potential Concerns**:  
      - If the design is **highly distinctive** (e.g., iconic silhouette protected by design patent/trade dress), it might constitute expressive appropriation.  
      - If marketed as a "dupe" capitalizing on the original's prestige, it edges toward unfair free-riding.  

  *Your intuition likely aligns with permissibility*—fashion thrives on iterative copying, and construction techniques are functional knowledge.

  ---

  ### **Tensions and Edge Cases:**
  - **The Drum Break Paradox**: Why is a 2-second sample "raw material" while a chorus isn't? Rooted in **proportionality** and **recognizability**. The chorus is the expressive core; the drum break is a granular component.  
  - **Fan Fiction's Special Status**: Socially embedded practice with **implied consent** from authors who benefit from fandom. Rejected by some authors (e.g., Anne Rice), highlighting contextual norms.  
  - **Gene Patents**: The real wrong is **monopolizing discovery**, not the sequencing labor. Reward should attach to *applications* (e.g., novel diagnostics), not the gene itself.

  ---

  ### **Philosophical Foundations:**
  This principle blends:  
  1. **Lockean Labor-Desert**: Rights stem from labor, but only when appropriation doesn't harm others.  
  2. **Utilitarian Progress**: Protect only where needed to incentivize creation, not where it stifles reuse.  
  3. **Non-Alienation of Commons**: Facts/nature/ideas cannot be justly enclosed.  
  4. **Anti-Free-Riding**: Prevent parasitism on another's labor when it undermines their return.

  ---

  ### **Conclusion:**
  Your core intuition—**control should attach to expressions/confidences but not ideas/facts**—is sound but needs refinement for *transformative, non-rivalrous uses*. The proposed principle:  
  - **Vindicates**: All your cases except possibly fan fiction (which it excuses via transformation/norms).  
  - **Clarifies**: The commercial/non-commercial distinction via market harm/free-riding.  
  - **Resolves**: The couture case as permissible functional competition.  

  This framework positions IP ethics as balancing **desert, autonomy, and the commons**—a rich vein for PhD exploration! Would testing cases like open-source software or AI training data further refine this?
