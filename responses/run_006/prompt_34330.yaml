answer: |-
  **Single sentence takeaway:**  
  "A letter’s identity isn’t defined by fixed visual features, but by its functional relationships within a writing system’s network of conventions."

  ---

  ### Lesson Plan (75 Minutes)  
  **GOAL:** Shatter the "ideal form" assumption → Reveal the insufficiency of feature checklists → Establish "family resemblance" via constraints → Prevent relativism.

  ---

  **1. Provoke Dissonance with Extreme Contrast (15 min)**  
  - **ACTION:** Project 5 wildly different "a"s: Blackletter, single-story (e.g., Futura), double-story (e.g., Garamond), kid’s scribble, a non-Latin character (e.g., Greek alpha, *α*). Ask: *"Which of these is NOT an 'a'? Why?"*  
  - **WHY START HERE:** Forces immediate confrontation with visual chaos. Students will dismiss the Greek alpha (correctly) but struggle to articulate why. Prevents premature theorizing.  
  - **MISCONCEPTION HANDLED:** Lets the "Platonic ideal" surface naturally ("The kid’s ‘a’ is messy but we *know* it’s an ‘a’ because it tries to copy the real one!").

  **2. Dissect the Failed Checklist (20 min)**  
  - **ACTION:**  
    - *Group Task:* "List essential features ALL ‘a’s share." (They’ll suggest: bowl, stem, counter, terminal, etc.)  
    - *Counterexamples:* Show a single-story ‘a’ with no counter (e.g., tightly kerned script), a Blackletter ‘a’ with no discernible bowl. Ask: *"Does this break your rules? Is it still an ‘a’?"*  
  - **WHY NOW:** After seeing visual extremes, students default to checklist thinking. Breaking their own rules reveals its futility.  
  - **MISCONCEPTION HANDLED:** Directly attacks "feature checklist" retreat. Shows no universal physical traits exist.

  **3. Introduce Constraints, Not Shapes (20 min)**  
  - **ACTION:**  
    - *Concept:* "Letters are defined by constraints: What an ‘a’ *cannot* look like in its system."  
    - *Demo:* Project a grid of glyphs from ONE typeface (e.g., Helvetica): a, o, e, c, d. Ask: *"What relationships must ‘a’ maintain to avoid being ‘o’ or ‘e’?"* (e.g., open counter vs. closed, stem direction).  
    - *Key Shift:* "The ‘a’ isn’t a shape—it’s a role: *Distinguisher from similar forms*."  
  - **WHY NOW:** After checklist failure, students crave structure. Constraints focus on systemic function, not isolation.  
  - **CARRYING EXAMPLE:** **Use a single typeface’s glyph set.** Isolating a system (e.g., Helvetica) makes relational roles tangible. Single vs. double-story is a distraction here—it’s about *intra-system* differentiation.

  **4. "Family Resemblance" as a Network (15 min)**  
  - **ACTION:**  
    - *Metaphor:* Show overlapping circles labeled "contrast," "axis," "counter," "terminals." No circle covers all ‘a’s, but every ‘a’ shares some circles.  
    - *Critical Nuance:* "Resemblances aren’t arbitrary—they’re historically anchored by utility. A ‘usable’ a must: (1) Be distinct from other glyphs in its system, (2) Reference prior ‘a’s enough to be legible."  
  - **WHY NOW:** Prevents "anything goes" relativism by tethering resemblance to function and legacy.  
  - **REFUSE TO EXPLAIN:** Wittgenstein’s philosophy or semiotics. Stick to typographic pragmatism.

  **5. Closing Question (5 min)**  
  - **ASK:** *"In a new typeface, what’s the riskier change: altering how the ‘a’s bowl connects to its stem, or giving the ‘a’ two vertical stems? Why?"*  
  - **WHY THIS WORKS:** Tests grasp of systemic relations. Correct answer (two stems risk confusion with ‘u’/‘n’) proves they prioritize *differentiation* over isolated aesthetics.

  ---

  ### Why This Sequence Works  
  1. **Visual shock** disrupts complacency → 2. **Checklist failure** creates intellectual need → 3. **Constraints** offer a functional solution → 4. **Anchored resemblance** prevents relativism.  
  The single-typeface deep dive (#3) is crucial—it moves the discussion from shapes to *systems*. Students leave seeing type design as managing relationships, not chasing ideals.
