prompt: |-
  I cover the science of mind for a general-interest magazine, and the piece I am planning turns on a puzzle one level up from the usual consciousness debate. It is not the hard problem itself — how physical processes give rise to experience — but what has come to be called the meta-problem of consciousness: why we so readily judge that there is a hard problem, why the explanatory gap feels unbridgeable even to people who accept a physicalist metaphysics, and why that conviction survives increasingly detailed neural explanation. I do not want a survey of proposed solutions. I want the specification against which any proposed solution should be judged: the desiderata for an adequate theory of the meta-problem.

  Write that specification. For each requirement, give the case or consideration that makes it a genuine requirement rather than a preference of one camp, and say which requirements are non-negotiable and which are contested. The purpose I am fixing for adequacy is this: a theory good enough to let an educated lay reader see which proposed explanations are doing real work and which are only relabeling the phenomenon.

  The list should go beyond the obvious. It should, for example, distinguish explaining a subject's verbal problem report from explaining the underlying problem intuition; explaining why the intuition arises from explaining why it persists after physicalism is accepted; and explaining why it attaches to sensory and affective experience rather than to, say, syntactic processing or the regulation of blood glucose. It should also say which empirical constraints a theory must respect — developmental, clinical, or comparative — and flag where the empirical record genuinely constrains the options rather than merely decorating them.

  The part I most want is the diagnosis of internal tension. I suspect there is a conflict between explaining the intuition in fully mechanistic terms and preserving its claim to point at a genuine explanatory gap, but I want to know whether that conflict is real or merely apparent, and whether it is the deepest one. Are any two or three requirements jointly unsatisfiable, such that no theory can meet the entire list and the list itself becomes the finding? If a short scorecard of the main existing approaches sharpens the criteria, include it; otherwise keep the weight on the requirements.
reasoning: |-
  Okay, the user is writing an article on the meta-problem of consciousness. They don't want a survey of solutions but rather the criteria for evaluating any proposed theory. Let me start by understanding their request thoroughly. 

  First, they want desiderata that are non-negotiable versus contested. The criteria should help readers distinguish between theories that address the core issues and those that just relabel the problem. The user mentioned internal tensions between requirements, like explaining the intuition mechanistically while preserving the sense of a genuine gap. I need to explore if that conflict is real.

  The user emphasized distinguishing between explaining verbal reports versus the intuition itself, why the intuition arises versus persists, and why it's tied to sensory/affective experiences. Also, empirical constraints from development, clinical cases, and comparative studies are crucial. They want to know where data actually limits options, not just decorates theories.

  I should list key requirements. Start with the distinction between phenomenology and report. Then address the intuition's persistence despite physicalist beliefs. Next, the specificity to sensory/affective domains. The universality across cultures and development is important too. Empirical constraints need concrete examples, like developmental milestones or clinical cases like blindsight.

  Non-negotiable points might include separating reports from intuitions and the necessity of empirical constraints. Contested areas could be whether physicalism is assumed or if the gap's validity is addressed. The internal tension: if a theory explains the intuition mechanistically, it might undermine the gap's reality. But perhaps the meta-problem can explain the intuition without resolving the hard problem itself. That distinction is key.

  I need to ensure each requirement has a rationale. For example, developmental data shows kids as young as 4-5 grasp the mind-body divide, so theories must account for early emergence. Blindsight shows dissociation between function and awareness, which any theory must handle. Also, cross-cultural similarities in dualism suggest a cognitive universal.

  The user’s deeper need is to provide readers with a framework to critically assess theories. They want clarity on what makes a theory robust versus superficial. Highlighting tensions helps readers see why the meta-problem is challenging. Including a scorecard of approaches might help, but the user prefers focusing on requirements unless it sharpens the criteria. Maybe a brief mention of illusionist vs non-illusionist approaches to illustrate the tension.

  Finally, ensure the response is structured with clear sections: requirements, non-negotiable vs contested, internal tensions, and empirical anchors. Avoid jargon where possible for the lay audience. Make sure each requirement directly addresses the user's examples and unpacks the underlying conflicts they suspect exist.
answer: |-
  Here is a specification of desiderata for an adequate theory of the meta-problem of consciousness, designed for your purpose. It emphasizes the distinctions you requested, identifies non-negotiable and contested elements, highlights the crucial internal tension, and anchors requirements in empirical constraints.

  **Core Purpose of the Specification:** To provide a rigorous benchmark for evaluating proposed solutions to the meta-problem, enabling readers to discern whether a theory genuinely *explains* the core intuition or merely redescribes it, respects crucial empirical realities, and confronts the inherent tensions within the phenomenon.

  **The Desiderata:**

  1.  **Distinguish Phenomenology from Report:**
      *   **Requirement:** The theory must explain the *intuition* or *feeling* of an explanatory gap itself (the "what it's like" seeming inexplicable), not merely the verbal report "There's a hard problem."
      *   **Rationale (Non-Negotiable):** People report the gap *because* they have the intuition. Explaining only the report (e.g., via cultural memes or linguistic confusion) risks bypassing the core phenomenon – the pre-verbal, compelling sense of mystery. It must target the underlying cognitive/affective state.
      *   **Case:** A child or someone unfamiliar with philosophy can still express profound puzzlement about how "red" or "pain" arises from the brain, indicating the intuition precedes sophisticated reporting.

  2.  **Explain Persistence Despite Physicalism:**
      *   **Requirement:** The theory must explain why the explanatory gap intuition *persists* even in individuals who intellectually endorse physicalism (the view that everything is physical).
      *   **Rationale (Non-Negotiable):** This is the defining characteristic of the meta-problem. If the intuition vanished upon accepting physicalism, the meta-problem wouldn't exist. The theory must identify cognitive mechanisms robust enough to withstand intellectual belief.
      *   **Case:** Neuroscientists or philosophers committed to physicalism still readily admit the *feeling* that consciousness is uniquely hard to explain physically.

  3.  **Target Phenomenal Specificity:**
      *   **Requirement:** The theory must explain why the intuition of an explanatory gap attaches so strongly to *phenomenal consciousness* (sensory qualia, affective states - "what it's like") and not to other complex cognitive functions (syntax, memory, glucose regulation).
      *   **Rationale (Non-Negotiable):** The intuition's selective focus is a key feature. A theory explaining a *general* tendency towards explanatory gaps fails unless it specifically accounts for why phenomenality feels uniquely resistant.
      *   **Case:** We readily accept computational or mechanistic explanations for vision *processing* (edge detection) but balk at explaining the *redness* of red. We don't feel the same gap for how the pancreas regulates sugar.

  4.  **Account for Cross-Cultural & Developmental Robustness:**
      *   **Requirement:** The theory must be compatible with the apparent cross-cultural prevalence and early developmental emergence of intuitions suggestive of an explanatory gap or mind-body duality.
      *   **Rationale (Non-Negotiable):** If the intuition were purely a cultural construct or late-learned philosophical concept, its universality and persistence would be less puzzling. Evidence suggests deeper roots.
      *   **Empirical Constraint:** Developmental psychology shows children as young as 4-5 exhibit intuitive dualism (e.g., believing thoughts continue after death, separating mental from physical properties). Cross-culturally, variations of mind-body dualism are widespread, suggesting a cognitive universal underpinning the gap intuition.

  5.  **Mechanistic Explanation (Without Presupposing Gap's Validity):**
      *   **Requirement:** The theory must provide a *mechanistic explanation* – describing the cognitive, neurobiological, and/or evolutionary processes – that reliably *produce* the intuition, regardless of whether the hard problem is ultimately real or illusory.
      *   **Rationale (Contested - Illusionist vs. Non-Illusionist):** This is the core methodological demand of the meta-problem approach. However, it's contested *whether* such an explanation can be fully satisfying if one believes the gap is real (see Internal Tension below). Non-negotiable for the meta-problem *as defined*.
      *   **Case:** The theory should explain *how* specific cognitive architectures or perceptual processes generate the *feeling* of ineffability or ontological separation for phenomenality.

  6.  **Address the Dissociation Constraint:**
      *   **Requirement:** The theory must be compatible with empirical evidence showing dissociations between consciousness and report, or between function and phenomenology.
      *   **Rationale (Non-Negotiable):** Clinical and experimental data show consciousness isn't always directly tied to verbal report or cognitive function. A meta-theory must respect this.
      *   **Empirical Constraint:** Blindsight patients can visually discriminate without conscious awareness. Subliminal priming shows information processing without conscious access. Any theory suggesting the intuition arises *solely* from the inability to report or understand function fails here.

  7.  **Explain the "Gappiness" Itself:**
      *   **Requirement:** The theory must explain the specific *quality* of the intuition – why the gap feels *explanatory* and *ontological* (a fundamental lack, not just complexity), rather than merely epistemic (we just don't know enough yet).
      *   **Rationale (Crucial for Adequacy):** This captures the core "puzzlement" characteristic. A theory explaining only why consciousness is *mysterious* or *complex* misses the specific sense of an *explanatory chasm* concerning subjective experience.
      *   **Case:** We acknowledge the complexity of protein folding but don't feel an *explanatory gap* in the same way as for the smell of coffee. The meta-theory must explain this difference in felt resistance.

  8.  **Respect the Evolutionary/Functional Profile (Contested Scope):**
      *   **Requirement:** The theory should provide a plausible account of why the cognitive mechanisms producing the gap intuition would have evolved or persisted, considering their potential functional benefits or costs.
      *   **Rationale (Contested Necessity):** Some argue this is essential for a complete naturalistic explanation. Others argue it's secondary; the mechanism exists, and its evolutionary history is a separate (though interesting) question. Non-negotiable for *completeness* in a scientific account, but the core mechanism might stand without it.
      *   **Empirical Constraint:** The theory shouldn't posit mechanisms that would be overwhelmingly maladaptive or lack any plausible selective pressure, given their apparent universality.

  **The Core Internal Tension:**

  *   **The Tension:** Requirement 5 (Mechanistic Explanation) fundamentally clashes with the *intuition's own content* (Requirement 7 - "Gappiness"). If a theory successfully provides a *complete mechanistic explanation* for why we *feel* there's an unbridgeable explanatory gap concerning phenomenality, it **seems to demonstrate that the feeling itself is a cognitive illusion** – a product of how our cognitive systems work, not a direct insight into an actual ontological gap. This potentially *vindicates* illusionist/physicalist solutions to the hard problem.
  *   **Is it Real?** Yes, the tension is real and deep. It stems directly from the goal of the meta-problem project.
  *   **Is it Fatal?** Not necessarily, but it shapes the landscape:
      *   **Illusionist/Fulfillment Theories:** Embrace this tension. A successful meta-theory *is* the solution to the hard problem – it explains why the *illusion* of a hard problem arises. (Chalmers' "Fulfillment Strategy").
      *   **Non-Illusionist Theories:** Must navigate this tension carefully. They must argue that the meta-theory explains the *intuition's origin and persistence* without thereby *explaining away* the reality of the gap it points to. This often involves arguing that the mechanisms identified *generate the intuition precisely because* they cannot access or represent the actual (non-physical?) nature of consciousness, thus preserving the gap's reality. This is inherently more challenging and risks circularity or explanatory failure.
  *   **The Deepest Tension?** Likely yes. It reflects the core clash between the third-person, scientific perspective (demanding mechanistic explanation) and the first-person perspective (generating the intuition of an irreducibly first-person phenomenon).

  **Non-Negotiable vs. Contested Summary:**

  *   **Non-Negotiable:** 1 (Phenomenology vs. Report), 2 (Persistence), 3 (Phenomenal Specificity), 4 (Developmental/Cross-Cultural Robustness), 5 (Mechanistic Explanation - *as the goal*), 6 (Dissociation Constraint).
  *   **Contested:** The *implications* of successfully fulfilling Requirement 5 (Does it dissolve the hard problem?). Requirement 8 (Evolutionary Necessity). Requirement 7's *specific* explanation might vary in emphasis.

  **Empirical Anchors - Where Data Bites:**

  *   **Developmental:** Early emergence of intuitive dualism (~4-5 years) constrains theories. They cannot rely solely on late-acquired cultural or philosophical concepts.
  *   **Clinical:** Dissociations (blindsight, neglect, locked-in syndrome) constrain theories. They cannot rely solely on perfect correlation between function/report and phenomenology.
  *   **Comparative:** Evidence for precursors of self-awareness, theory of mind, and perhaps phenomenal states in non-human animals (though contested) constrains overly human-specific linguistic or cultural explanations. Simpler mechanisms must be plausible.
  *   **Cognitive:** Universal cognitive biases (e.g., hyperactive agency detection, essentialism) are candidate mechanisms but must be shown to specifically target *phenomenality*.

  **Short Scorecard (Illustrating Requirements):**

  1.  **Cognitive Limitation Theories (e.g., "Ignorance"):** Focus on Requirement 5. Often **fail** Requirements 2 (persistence despite knowledge) & 7 (don't explain the specific *gappy* quality), and struggle with 6 (dissociations).
  2.  **Illusionist Theories (e.g., Graziano, Dennett, Frankish):** Directly target Requirements 1, 2, 5, 7. Embrace the internal tension. **Challenge:** Fully satisfying Requirement 3 (why *only* phenomenality?) and Requirement 4 (early development) can be difficult. Requirement 8 is often a strength.
  3.  **Dualist-Leaning Meta-Theories (e.g., some interpretations of Chalmers):** Attempt Requirements 1-4, 6-7. **Struggle profoundly** with Requirement 5 and the Internal Tension – how can a mechanistic explanation *not* undermine the reality of the gap?
  4.  **Evolutionary Mismatch/Introspective Opacity (e.g., Humphrey, some predictive processing):** Target Requirements 1, 2, 3, 5, 7, 8. Explain intuition as a byproduct of how perception/attention works (introspection doesn't reveal neural mechanisms). **Strength:** Addresses specificity (3) and "gappiness" (7). **Challenge:** Fully explaining Requirement 2 (why doesn't *knowing* the mechanism dissolve the feeling?) and Requirement 4 (developmental trajectory).

  This specification provides the critical lens your readers need. A strong theory will convincingly address the non-negotiable requirements, navigate the internal tension explicitly, and respect the empirical anchors. Theories failing key non-negotiables or ignoring the tension are likely incomplete or merely relabeling the problem.
