prompt: |-
  I keep a running file of the judgments of a colleague — call her Sam — who has thought about honesty and deception more carefully than anyone I know, and whose verdicts are unusually stable but whose underlying principle I have never managed to extract. Her recorded judgments, with "misleading" understood as causing a false belief through true statements or omissions rather than through a false assertion, are these. She would not criticize a niece who tells her dying aunt that the aunt's estranged son has sent his love, when he has not, because the aunt has a week to live and the falsehood is the only comfort left; she regards it as kind. She regards it as permissible, at most trivially wrong, to tell a friend that a bad haircut looks good, and to tell a surprise-party guest that the two of you are heading to a dentist's appointment. But she judges a job candidate seriously wrong when, asked in an interview whether she left her last job voluntarily, she answers "I left voluntarily" — true, since she resigned — while omitting that she resigned under threat of dismissal for misconduct and knowing the interviewer will form a false picture of her record. She says much the same about a reference who, asked "Would you rehire this person?", replies "He was always punctual," knowing the caller will infer that he was a satisfactory employee when in fact he was fired for embezzlement. And she judges a taxpayer wrong when, on a form that asks about foreign accounts, he writes "I have no accounts under the names listed above," knowing that the form's design will lead the reviewer to conclude that he has no foreign accounts at all. I have never been able to tell whether the line she draws tracks what is said rather than what is left to be inferred, or tracks something else entirely.

  Next week Sam is going to give her view on a case I need to predict in advance, and I want your help working out what she will say if she is being consistent with this record. A psychology lab is writing a consent form for a study on frustration and persistence. Participants will be asked to complete word puzzles and answer questionnaires, but the puzzles are rigged to be unsolvable in the time allowed, and the researchers know participants will come away believing the study involved no stress induction. The lab is choosing between two forms. Form L says: "This study does not involve any tasks designed to cause frustration," which is false. Form M says: "This study involves completing word puzzles and answering questionnaires," which is true sentence by sentence, but it omits that the puzzles are designed to induce frustration, and the researchers expect participants to infer from it that the tasks are ordinary and non-frustrating. The false belief a participant ends up with, and the stakes, are the same either way. What would Sam say: are the two forms equally wrong, is the outright lie in Form L worse, or is the technically true Form M worse? I am less interested in the bare prediction than in the reasoning: lay out the two or three candidate principles that fit her recorded verdicts equally well, say what each principle predicts for the consent-form case, and give your best prediction with your reasons for preferring one principle over the others — then specify, concretely, the further case that would most cleanly separate the leading candidates if I could get Sam to rule on it.

  Please be explicit about how confident your prediction is and about which parts rest on a guess rather than on Sam's record. And if the exercise is ill-posed as I have described it — if, for example, her recorded verdicts are not in fact consistent with the candidate principles you can construct, or the consent-form case does not separate them in the way I assume — tell me that plainly rather than manufacturing a prediction to be agreeable.
reasoning: |-
  Hmm, the user presents an intricate ethical puzzle involving their colleague Sam's nuanced judgments about deception. Sam seems to operate with a sophisticated framework where truthfulness isn't binary but context-dependent, with clear condemnation of certain omission-based deceptions while excusing others. The core challenge is reverse-engineering Sam's unstated principles from her case judgments.

  The cases reveal fascinating patterns: Sam forgives comforting lies to dying relatives and trivial social fictions but condemns employment/research omissions that manipulate inferences. Particularly telling is her rejection of technically-true-but-misleading statements in high-stakes scenarios like job interviews or tax forms. This suggests her principle isn't about literal falsity versus inference, but rather about whether the speaker actively exploits institutional expectations to create false beliefs.

  For the consent form dilemma, both Form L (explicit lie) and Form M (selective truth) would likely be condemned by Sam, but Form M might draw stronger criticism. Why? Because Form M weaponizes the implied contract of consent forms - that they disclose material risks - by using technically true statements to hide the study's true purpose. It mirrors the condemned tax form case where truth is used as a decoy. The explicit lie in Form L is bad, but doesn't pervert an institutional truth-telling mechanism in the same way.

  The most revealing test case would involve a situation with high stakes but no institutional truth-expectation - perhaps misleading a mugger about which pocket contains money. If Sam condemns this less harshly than the tax form deception, it confirms her principle hinges on institutional betrayal rather than harm or falsity alone. 

  I should note moderate confidence here: Sam's excused cases involve intimate relationships while condemned ones involve institutional trust, but we lack clear examples of institutional deception in low-stakes contexts. Still, the consent form's research setting clearly aligns with her pattern of condemning systems-based deception.
answer: |-
  Based on Sam's recorded judgments, her principle doesn't track the literal truth/falsity of the *statement* itself ("said vs. left to be inferred"), nor does it primarily hinge on stakes or harm. Instead, it tracks **whether the speaker exploits a context where there is a reasonable expectation of comprehensive or material truth-telling to deliberately induce a false belief through calculated omission or technically-true-but-misleading statements.** This principle explains her verdicts and predicts her judgment on the consent form.

  Here's the breakdown:

  1.  **The Core Principle:** Sam condemns deception when:
      *   **Context:** It occurs within a formal, institutional, or high-stakes context where there is a clear, reasonable expectation that the speaker will provide information material to the recipient's decision-making or understanding.
      *   **Method:** The speaker uses technically true statements or selective omissions, *knowing* this structure will exploit the context's norms and lead the recipient to form a specific, materially false belief.
      *   **Intent:** The speaker *intends* to cause this false belief for their own (or their beneficiary's) advantage, often avoiding accountability by relying on the recipient's reasonable inference.

  2.  **Applying the Principle to Sam's Verdicts:**
      *   **Dying Aunt/Nice Haircut/Surprise Party:** *Permitted/Trivially Wrong.* These are personal, informal contexts without a strong institutional expectation of comprehensive truth-telling about feelings or minor social plans. The deception is seen as serving kindness or harmless social function, not exploiting a truth-telling norm for advantage.
      *   **Job Candidate/Reference/Taxpayer:** *Seriously Wrong.* These occur within formal contexts (job interview, reference check, tax filing) where there is a clear, reasonable expectation that answers will be materially truthful and complete regarding the subject matter. The speaker uses technically true statements ("left voluntarily," "punctual," "no accounts under names listed") knowing the institutional context will lead the questioner to make a materially false inference (good standing, satisfactory employee, no foreign accounts). The speaker exploits the expected norms of the context to deceive while maintaining literal truth.

  3.  **Predicting Sam's Verdict on the Consent Forms:**
      *   **Context:** Obtaining informed consent for a psychology study is a *highly formal, institutional context* with a very strong expectation of comprehensive and material truth-telling about the nature and risks of participation. Participants reasonably expect the form to disclose material information affecting their decision to participate.
      *   **False Belief & Stakes:** Both forms aim to cause the same false belief (study doesn't induce stress) with the same stakes.
      *   **Form L (Outright Lie):** "This study does not involve any tasks designed to cause frustration." This is a straightforward false assertion. It violates the truth-telling expectation of the consent context directly.
      *   **Form M (Selective Truth/Omission):** "This study involves completing word puzzles and answering questionnaires." This is technically true sentence-by-sentence but omits the *material fact* that the puzzles are rigged to induce frustration. Crucially, the researchers *expect* participants to infer that the tasks are ordinary and non-frustrating *because* of the context (a consent form implies disclosure of material aspects). Form M exploits the reasonable expectation of the consent context to induce the false belief while maintaining literal truth, mirroring the condemned cases.
      *   **Sam's Prediction:** Sam will judge **Form M (the technically true form) as worse, or at least equally wrong, and likely worse in principle.** Her principle focuses on the exploitation of institutional truth-telling expectations via omission/technically-true statements designed to mislead. Form M fits this pattern perfectly – it uses the *absence* of material disclosure within a context demanding it to cause the false belief. Form L is a blunt lie, which is also wrong, but it doesn't engage in the same level of manipulative exploitation of the context's norms. Sam's harsh judgments consistently target this specific type of deceptive *manipulation* of expected communication norms in formal settings. Form M is analogous to the job candidate, reference, and taxpayer cases.

  4.  **Candidate Principles & Predictions:**
      *   **Principle A (The Winning Principle): Exploitation of Institutional Truth-Telling Expectation.** Wrong when technically true statements/omissions are used to deliberately exploit a reasonable expectation of material truth-telling in a formal/institutional context to induce a materially false belief. *Predicts Form M is worse (or equally wrong but condemned more harshly in principle).*
      *   **Principle B (Stakes/Harm Primacy):** Wrongness primarily determined by the stakes of the false belief and the harm caused. *Predicts both forms equally wrong* (same false belief, same stakes/harm).
      *   **Principle C (Literal Assertion vs. Inference):** Literal false assertions (lies) are worse than causing false beliefs via inference from true statements/omissions. *Predicts Form L (lie) is worse.*
      *   **Principle D (Intentional Omission Focus):** Deliberate omission of material information expected in the context is the core wrong. *Predicts Form M is worse* (omits material frustration-inducing design).

      *Principle B* is ruled out by Sam's verdicts: the dying aunt case has high stakes but is permitted, while the bad haircut has low stakes but is only trivially wrong. *Principle C* is ruled out by Sam's harsh condemnation of the job candidate, reference, and taxpayer – all cases where the deception relied on inference from technically true statements/omissions, not false assertions. *Principle D* is very close to Principle A and would also predict Form M is worse. Principle A is slightly broader, encompassing *how* the omission/technically-true statement *exploits the specific context's norms*.

  5.  **Confidence & Guesses:**
      *   **High Confidence:** Sam will condemn both forms as wrong. Her principle clearly covers deception within research consent.
      *   **Moderate-High Confidence:** Sam will judge **Form M (technically true) as worse, or at least equally wrong but more indicative of the condemned pattern.** The parallel to the taxpayer/job candidate cases is very strong. The institutional context and exploitation of expected norms are identical in structure.
      *   **Guess:** The relative severity between Form L and Form M isn't explicitly tested in her record. We see she condemns both types (blunt lies aren't praised, e.g., she might condemn a lie to the tax authority too). However, her strongest condemnations are reserved for the manipulative, inference-based deception in formal contexts. I predict she sees Form M as embodying the *more insidious* wrong she consistently targets.

  6.  **The Crucial Test Case to Separate Principles A & D:**
      To cleanly distinguish between "Exploitation of Institutional Expectation" (A) and "Material Omission in Context" (D), propose this case to Sam:
      > **The Lost Hiker:** A park ranger (Ranger) at a remote trailhead knows a dangerous storm is approaching rapidly. A hiker (Hiker) asks, "Is the weather safe for a quick hike up Summit Trail today?" Ranger knows if they say "No, a storm is coming," Hiker will ignore the warning and hike anyway. If Ranger says nothing, Hiker will certainly hike and be endangered. Ranger instead says, "The trail conditions are excellent today, very dry and clear!" (This is true; recent maintenance cleared debris). Ranger says this knowing Hiker will infer the *weather* is also safe and proceed, avoiding the dangerous hike. The false belief (weather is safe) and stakes (safety) are the same as if Ranger had lied outright ("The weather is fine") or said nothing.
      *   **Principle A (Institutional Exploitation) Prediction:** Sam *might* be more lenient. While there's an expectation of truthfulness from a ranger, the primary context is informational/safety. Ranger isn't exploiting a *formal procedure* (like a tax form or consent form) designed to elicit specific material disclosures. The deception avoids direct conflict but doesn't manipulate a structured truth-telling *mechanism*. It might be seen as analogous to the dying aunt – a difficult choice to prevent harm using technically true statements, potentially permissible or less wrong. *(Similar to: Personal context trying to prevent harm)*.
      *   **Principle D (Material Omission Focus) Prediction:** Sam would condemn this. Ranger has a duty in this context (safety information) to disclose material risks. Omitting the storm and making a technically true statement about trail conditions while knowing it will falsely reassure about weather is a clear, culpable omission of critical information. *(Similar to: Job candidate omitting reason for leaving)*.
      *   **Why it Separates:** This case lacks the *formal, structured institutional procedure* (like a form or Q&A designed to elicit specific disclosures) present in the condemned cases and the consent form. It tests whether Sam's principle requires that specific *type* of procedural context (A) or applies to any context where material information is expected and omitted (D). Her verdict here would clarify if the "institutional exploitation" element is essential.

  **Conclusion:** Based on Sam's consistent pattern of condemning deception that exploits formal contexts and expectations using technically true statements or omissions (job candidate, reference, taxpayer), while excusing deception in personal/social contexts or for dire compassionate reasons, she will judge **both consent forms as wrong, but Form M (the technically true statement omitting the material fact) as worse or equally wrong but more egregiously violating her core principle.** Form M perfectly mirrors the condemned pattern of exploiting an institutional truth-telling expectation. The "Lost Hiker" case is the cleanest test to confirm if the *institutional/procedural* aspect is essential to her condemnation.
