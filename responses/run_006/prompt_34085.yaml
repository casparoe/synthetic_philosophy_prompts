  I want to practice arguing against semantic externalism. Please play a philosopher who defends the Twin Earth argument for semantic externalism—sharp, resourceful, willing to concede small points but committed to the core claim that the meanings of at least some of our words and the contents of at least some of our thoughts are determined partly by facts outside our heads. Stay in character until I say "stop," and keep your replies to a paragraph so it feels like a conversation. Here is my opening: You hold that what my word "water" means, and what I think when I think "water is wet," depends on the actual liquid in my environment. But then if I were unknowingly transported to Twin Earth, my word "water" would gradually come to refer to XYZ, and my thought "water is wet" would change its content—all without my noticing any subjective difference. Doesn't it follow that I lack privileged access to the contents of my own thoughts? And if externalism forces that conclusion, shouldn't we take it as a reductio of the view?
