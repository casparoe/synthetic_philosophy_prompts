prompt: |-
  I sit on the admissions committee of a selective one-year master's program. We must decide whether to retain a requirement that every applicant sit, in person and at their own expense, for a proctored four-hour quantitative screening exam. The exam is not used for placement, and our own data show that its scores do not predict first-year grades or completion. The exam's defenders do not dispute the data; they argue that the burden is the point. On their view, completing the exam is an honest signal of commitment: a low-commitment applicant would not pay the cost, so the requirement separates serious applicants from dilettantes in a way no free online form could. The critics reply that this gets the handicap principle backwards: for a costly signal to be reliable, the cost must fall more heavily on the lower-quality signalers the committee is trying to screen out, not uniformly on everyone, and a pure sunk-cost hurdle mostly selects for wealth, free time, and tolerance for pointless hoops. The dean wants a decision this cycle.

  Draft the short written opinion I will circulate before our vote. It should recommend a concrete course of action — keep, drop, or replace the requirement — with a specific rule and a timeline, and it should engage the strongest version of the losing side's argument rather than a caricature of it. Several committee members work on signaling theory, so use terms such as "honest signal," "handicap," and "differential cost" precisely. Begin with the memo itself, with no preface or commentary, and make the memo's first sentence state the recommendation.
reasoning: |-
  Okay, the user is part of an admissions committee for a selective master's program. They need to draft a memo recommending whether to keep, drop, or replace a proctored quantitative exam requirement. The exam doesn't predict academic success but is defended as a commitment signal. Critics argue it's a poor costly signal that selects for wealth and tolerance for hoops.

  Hmm, the key tension is between signaling theory principles. The defenders see the exam as an "honest signal" of commitment through sunk cost. But the critics correctly point out that for a "handicap" signal to work effectively (per Zahavi's handicap principle), the cost must impose a *differential burden* - higher for low-quality applicants. A uniform cost like this exam fee/effort doesn't discriminate; it just filters out the less wealthy or time-rich applicants. 

  I should acknowledge the defenders' core concern about commitment screening but show why this mechanism fails. The memo needs precise terminology since some committee members study signaling theory. "Differential cost" is crucial here - currently the cost falls equally, making it inefficient. 

  For the recommendation: dropping entirely might feel too abrupt, and replacing could address both sides. A timed writing supplement during application would still test follow-through but remove financial/time barriers. It meets the defenders' need for a commitment signal while avoiding wealth bias. 

  Timeline is important - the dean wants a decision this cycle. Phasing out the exam immediately for next cycle gives staff time to implement the replacement. 

  The first sentence must state the recommendation clearly. Then unpack the reasoning while giving due weight to both arguments. The defenders' position isn't irrational - commitment matters - but their solution is misapplied signaling theory. Need to show that the replacement achieves their goal better. 

  Should explicitly note that the writing supplement maintains a "cost" (time/effort) but one that's more equitable. That satisfies the "handicap" requirement without socioeconomic filters. 

  Final structure: 
  1. Clear recommendation upfront 
  2. Acknowledge valid intent behind current system 
  3. Explain signaling theory flaw 
  4. Propose better alternative 
  5. Implementation timeline
answer: |-
  **MEMORANDUM**  
  To: Admissions Committee  
  From: [Your Name/Title]  
  Date: [Current Date]  
  Subject: Recommendation to Replace Quantitative Screening Exam Requirement  

  I recommend we **replace** the in-person proctored quantitative exam with a mandatory, time-limited written applicant statement addressing program-specific prompts, to be completed online during the application window, effective for the next admissions cycle.  

  This recommendation acknowledges the valid concern raised by defenders of the current exam: that a costly signal can function as an *honest signal* of commitment, separating serious candidates from dilettantes. The requirement’s burden—financial cost, scheduling effort, and time investment—arguably deters low-commitment applicants unwilling to incur such sunk costs. Critics rightly observe, however, that for a costly signal to efficiently distinguish applicant quality under signaling theory, it must impose *differential costs* across types. A pure sunk-cost hurdle—where the burden falls uniformly—fails as a *handicap* because it does not disproportionately weigh on the low-quality signalers we aim to screen out. Instead, it primarily selects for wealth, flexible schedules, and tolerance for procedural friction, introducing socioeconomic bias without predictive validity (as our data confirms).  

  The proposed replacement addresses the core intent of the current system while correcting its flaws. A program-specific written supplement, requiring focused time (e.g., 60–90 minutes) during the application period, retains a meaningful cost in effort and opportunity. Critically, this cost is *differentially impactful*: high-commitment applicants with genuine interest will prioritize it, while indifferent applicants are more likely to abandon the process. Unlike the proctored exam, it imposes no financial barrier or geographic/logistical burdens, preserving equity. It also delivers program-relevant information (writing quality, critical thinking, alignment with our objectives) absent from the current exam.  

  **Proposed Rule & Timeline:**  
  - **Rule:** Applicants must complete a time-limited digital statement (specific prompts TBD by subcommittee) within 72 hours of application submission.  
  - **Timeline:** Implement for the **upcoming admissions cycle** (applications opening [Month]). Retire the current exam immediately; notify prospective applicants of the change by [Date].  

  This solution sustains a *handicap-based filter* for commitment but shifts the cost from extrinsic burdens to intrinsic engagement—a more efficient, equitable, and mission-aligned signal.
