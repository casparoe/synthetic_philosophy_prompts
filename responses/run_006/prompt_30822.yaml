prompt: |-
  As a doctoral student in philosophy of language, I keep encountering the slogan 'assert only what you know' deployed as though it settled arguments about whether a particular utterance was permissible. Most recently, in a graduate seminar on testimony, I defended a speaker who asserted a proposition that was true and supported by strong evidence, but whose evidence was in fact misleading in the familiar way in which a justified true belief can fail to amount to knowledge. A colleague dismissed the speaker's assertion as improper on the grounds that she did not know the proposition; when I pressed him, he simply repeated the slogan.

  I want to be able to answer him precisely, rather than either conceding or pushing back vaguely. Please lay out the distinct principles that 'assert only what you know' could be used to express, as a menu of readings rather than a single reconstruction. For each reading, specify the content of the norm being proposed (truth, belief, justification, knowledge, certainty, or something else), its force (a necessary condition on permissible assertion, a sufficient condition, or both), its status (constitutive of assertion, merely conversational, or ethical), and its plausibility. Then indicate which of these readings would actually license the conclusion that the true, justified, but non-knowledgeable assertion in my example was improper, and which would not. I am especially interested in where the slogan turns out to be near-trivial, where it is substantive and defensible, and where it is false or unsupported. Please write your answer in British English.
reasoning: |-
  Okay, the user is a doctoral student in philosophy of language dealing with the slogan "assert only what you know" in debates about permissible assertion. They described a scenario where a speaker made a true and justified assertion that wasn't knowledge due to misleading evidence. Their colleague dismissed it as improper solely based on the slogan. The user wants a precise breakdown of possible interpretations of this slogan to counter such arguments.

  I need to approach this systematically. The user wants distinct principles that the slogan could express, examining each for its content, force, status and plausibility. Then I should identify which interpretations would condemn their example assertion and which wouldn't. 

  The user's scenario involves a Gettier-style case: true belief with strong justification that fails to be knowledge. So I'll need to consider norms based on truth, belief, justification, knowledge, and possibly certainty. For each, I should specify whether it's necessary, sufficient, or both; whether it's constitutive, conversational, or ethical; and assess its plausibility.

  I recall Williamson's knowledge norm is influential but controversial - he argues knowledge is both necessary and constitutive. But there are alternatives like the truth norm (Unger), justification norms (Lackey), and reasonable belief norms (Douven). I should present these as distinct options rather than ranking them, per the user's "menu" request.

  For the analysis: 
  - Truth norms would permit the user's example since it was true
  - Belief norms would permit it if the speaker believed it (which they likely did)
  - Justification norms would permit it given the strong evidence
  - Knowledge norms would prohibit it (since it's Gettiered)
  - Certainty norms would prohibit it too

  The user specifically wants to know where the slogan is trivial (e.g., weak belief norm), substantive (e.g., knowledge norm), or unsupported. I should note that on strong readings it's contentious, while weaker readings don't support their colleague's dismissal.

  Ethical dimensions are worth mentioning too - Goldberg's work on testimony shows knowledge norms might serve reliability purposes. But in casual contexts, weaker norms may apply.

  The key is showing that only stringent knowledge norms condemn their example, and those are precisely the ones under debate. Their colleague's slogan-use assumes without argument the most controversial interpretation. Pointing this out gives the user precise rebuttal tools.
answer: |-
  Here is a breakdown of the distinct principles that the slogan "assert only what you know" might express, analysed along the dimensions you requested. This demonstrates that your colleague's dismissal relies on a specific, substantive, and contested interpretation, while weaker readings either permit your speaker's assertion or render the slogan near-trivial.

  ### The Menu of Readings

  1.  **The Strong, Constitutive Knowledge Norm (KN-C)**
      *   **Content:** Knowledge.
      *   **Force:** Necessary *and* sufficient condition for permissible assertion. One must *know* P to be epistemically permitted to assert P; knowing P is enough to be epistemically permitted to assert P.
      *   **Status:** Constitutive of the speech act of assertion itself (i.e., what it *is* to assert is to represent oneself as knowing).
      *   **Plausibility:** Highly substantive and influential (e.g., Timothy Williamson), but also highly contested. Defended as explaining patterns of challenge ("How do you know?") and criticism ("You didn't know that!"). Criticised for being too demanding (ruling out reasonable assertions based on statistical evidence, Gettier cases, some testimony) and for potential circularity in defining assertion.
      *   **Verdict on Your Case:** **Improper.** Precisely because the speaker lacks knowledge (Gettiered), KN-C deems the assertion impermissible. This is the reading your colleague likely assumes.

  2.  **The Necessary Knowledge Norm (KN-N)**
      *   **Content:** Knowledge.
      *   **Force:** Necessary condition for permissible assertion (but *not* sufficient). One must know P to be epistemically permitted to assert P, but knowing P might not be *enough* (e.g., relevance, Gricean maxims, ethical concerns might also apply).
      *   **Status:** Usually proposed as constitutive of assertion, or as a fundamental epistemic/conversational norm.
      *   **Plausibility:** Substantive but slightly less demanding than KN-C. Still faces the core objections regarding demandingness (Gettier cases, statistical evidence). Defended on similar grounds as KN-C, focusing on the *commitment* inherent in asserting.
      *   **Verdict on Your Case:** **Improper.** Same core reason as KN-C: lack of knowledge. This is the minimal reading needed for your colleague's dismissal.

  3.  **The Sufficient Knowledge Norm (KN-S)**
      *   **Content:** Knowledge.
      *   **Force:** Sufficient condition for permissible assertion (but *not* necessary). Knowing P is *enough* to be epistemically permitted to assert P, but one might sometimes be permitted to assert P *without* knowing P (e.g., if justified and true, or in certain contexts).
      *   **Status:** Conversational or epistemic norm (less commonly proposed as constitutive).
      *   **Plausibility:** Relatively plausible but weak. Few would deny that knowing P licenses assertion. The slogan "assert only what you know" doesn't naturally express this, as it suggests a *restriction* (only knowledge), not a permission (knowledge is sufficient). It doesn't settle debates about permissibility in non-knowledge cases.
      *   **Verdict on Your Case:** **Permissible (or Silent).** KN-S doesn't require knowledge for permissibility; it only says knowledge is *sufficient*. It doesn't rule out the permissibility of your speaker's assertion. The slogan is largely trivial on this reading.

  4.  **The Justification/Reasonable Belief Norm (J-N)**
      *   **Content:** Justification/Warrant/Reasonable Belief. The speaker must have adequate epistemic support for P, even if it falls short of knowledge (e.g., in Gettier cases) or if P is false.
      *   **Force:** Necessary condition (often proposed as sufficient as well, or with caveats).
      *   **Status:** Conversational, epistemic, or sometimes proposed as constitutive (though less commonly than knowledge norms).
      *   **Plausibility:** Highly substantive and defensible (e.g., Jennifer Lackey, Igor Douven). Avoids the demandingness problem of knowledge norms. Explains why we criticise assertions based on guesswork or insufficient evidence. Criticised by knowledge norm proponents for not capturing the specific *force* of assertion or the appropriateness of "How do you know?" challenges.
      *   **Verdict on Your Case:** **Permissible.** Your speaker *has* strong justification/reasonably believes P. J-N explicitly allows assertions in Gettier cases. The slogan "assert only what you know" *misstates* this norm.

  5.  **The Truth Norm (T-N)**
      *   **Content:** Truth.
      *   **Force:** Necessary condition (sometimes proposed as sufficient, or necessary and sufficient).
      *   **Status:** Conversational, epistemic, or constitutive (e.g., Peter Unger's early work).
      *   **Plausibility:** Faces the "Moore's Paradox" challenge (asserting "P but I don't believe P" is absurd, but not necessarily false). Also seems too weak; one can blamelessly assert a falsehood based on excellent evidence, and culpably assert a truth based on terrible evidence. Primarily criticised for lacking a *subjective* component. Defended for its simplicity and connection to the aim of assertion.
      *   **Verdict on Your Case:** **Permissible.** Your speaker asserted a *truth*. The slogan "assert only what you know" is a distinct principle.

  6.  **The Belief Norm (B-N)**
      *   **Content:** Belief (that P).
      *   **Force:** Necessary condition (often proposed as sufficient as well).
      *   **Status:** Conversational, epistemic, or constitutive (e.g., Bach & Harnish).
      *   **Plausibility:** Explains the absurdity of "P but I don't believe P". Criticised as too weak; one can believe P based on awful reasons and assert it culpably. Also, one might reasonably assert what one merely accepts for practical purposes without full belief. Defended as capturing the sincerity condition of assertion.
      *   **Verdict on Your Case:** **Likely Permissible.** Assuming your speaker *believed* P (as justified true belief cases typically involve belief), B-N permits the assertion. The slogan replaces belief with knowledge.

  7.  **The Weak Belief/Sincerity Norm (WB-N)**
      *   **Content:** Belief (that P) OR Lack of belief (that ~P) / Sincerity. One shouldn't assert P if one believes ~P or is insincere.
      *   **Force:** Necessary condition.
      *   **Status:** Primarily ethical or conversational (Gricean Quality).
      *   **Plausibility:** Highly plausible, perhaps trivial. Lying or deliberately misleading is widely condemned. Doesn't address cases where the speaker believes P but has no justification.
      *   **Verdict on Your Case:** **Permissible.** Assuming sincerity, WB-N permits it. The slogan is far stronger than this near-trivial norm.

  8.  **The Certainty Norm (C-N)**
      *   **Content:** Certainty / Subjective Indubitability / Maximum Confidence.
      *   **Force:** Necessary (and often sufficient) condition.
      *   **Status:** Conversational or epistemic (sometimes proposed in specific contexts like legal testimony).
      *   **Plausibility:** Generally seen as implausibly demanding for ordinary assertion. We constantly assert propositions we are not absolutely certain about. Defended only in highly specific, high-stakes contexts.
      *   **Verdict on Your Case:** **Likely Improper.** If your speaker wasn't *certain* (which is typical in Gettier cases and most assertions), C-N would condemn it. However, the slogan says "know," not "be certain," and knowledge is generally not equated with Cartesian certainty.

  ### Summary & Answering Your Colleague

  *   **Which readings condemn your speaker's assertion?** Only readings that make **knowledge a necessary condition** for permissible assertion (KN-C and KN-N) condemn it. These are the **substantive and contested** interpretations (KN-C being the strongest).
  *   **Which readings permit your speaker's assertion?** Truth Norm (T-N), Justification Norm (J-N), Belief Norm (B-N), Weak Belief/Sincerity Norm (WB-N), and the Sufficient Knowledge Norm (KN-S) all permit the assertion. J-N is particularly **substantive and defensible** while explicitly accommodating cases like yours.
  *   **Where is the slogan near-trivial?** As the **Sufficient Knowledge Norm (KN-S)** ("if you know, you may assert"), it's plausible but weak and doesn't restrict non-knowledge assertions. As the **Weak Belief/Sincerity Norm (WB-N)**, it's a near-trivial ethical minimum that the slogan vastly overstates.
  *   **Where is it false or unsupported?** Critics argue it's false/unsupported *as a necessary condition* (KN-N, KN-C) because it incorrectly rules out intuitively permissible assertions like those in **Gettier cases** (your example) or based on **strong statistical evidence** (where knowledge is often denied). The **Certainty Norm (C-N)** is also generally seen as false for ordinary assertion, though the slogan doesn't directly express this.

  **Precise Response to Your Colleague:** "When you invoke 'assert only what you know' to dismiss my speaker, you are relying on a specific interpretation: that **knowledge is a necessary condition for permissible assertion** (KN-N or KN-C). This is a substantive and contested position in the literature. Alternative, well-defended norms – notably the **Justification Norm (J-N)** – hold that strong, non-misleading evidence (like my speaker had) is sufficient for permissibility, *even if* a Gettiered belief falls short of knowledge. The slogan doesn't *settle* the issue; it presupposes one controversial resolution of it. To defend your dismissal, you need to argue *for* the knowledge norm as necessary and *against* rivals like the justification norm, rather than merely repeating the slogan which begs the question against these alternatives."

  This analysis shows your colleague is conflating the *slogan* with one specific, debatable *theoretical commitment* (KN-N/KN-C). The burden is on them to defend that specific norm against compelling counterexamples like your Gettiered speaker and against alternative norms like J-N. The slogan alone lacks the precision to settle the matter.
