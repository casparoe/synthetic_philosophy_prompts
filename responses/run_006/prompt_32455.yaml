  First, the speaker's career centers on this idea. Darwin inverted the need for a designer by showing mindless natural selection creates complexity. Turing did the same for intelligence, proving computation can produce competence without comprehension. The challenge is to connect this to the graduates' four years and their future without turning into a lecture. 

  The audience includes graduates, families, and faculty. The speech needs humor, heartfelt moments, and avoid being a TED talk. Aim for 12 minutes, so around 1200-1500 words. 

  Key points to cover: 
  - Relate the inversions to the liberal arts education. Students might have felt they were just going through the motions (mindless processes) but actually gained deep understanding (competence with comprehension). 
  - Highlight how their education wasn't about memorizing facts but learning to think, adapt, and solve problems. This mirrors Darwin and Turing’s ideas—structure emerging from iterative processes. 
  - Future advice: They might not have life figured out, but the mindless steps (jobs, experiences) will build competence. Trust the process. 

  Humor: Self-deprecating jokes about philosophers, dad jokes, maybe poke fun at the ambiguity of liberal arts degrees. 

  Emotional moments: Celebrate the community, the unseen growth, the bittersweet transition. Acknowledge families' support. 

  Structure: 
