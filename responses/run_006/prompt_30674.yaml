prompt: |-
  I've been reading about Han van Meegeren, the Dutch forger who painted fake Vermeers in the 1930s and 40s — his Supper at Emmaus was hailed as a masterpiece by the top Vermeer expert of the day, and years later he got arrested for selling a 'Vermeer' to Göring and only admitted the whole thing was a con to save himself from a collaboration charge. The bit I can't shake: the same canvases went from being worth a fortune and praised to the skies to being a punchline, and the paint hadn't changed one bit.

  I want you to use the van Meegeren case as a test for theories about why originals are supposed to matter more than forgeries. Map it carefully: what actually changed when the attribution flipped — the object itself, its history, what people knew, how they looked at it, the market — and which accounts of the value of originals can explain that change and which ones struggle. The ones I've come across are: the achievement view (what matters is the artist's creative act, and a forger didn't do that), the provenance or 'actual history' view (the object's causal link to the artist is part of the work, so a forgery is literally a different work), the Goodman-style view (knowing it's a fake would eventually change how you see it, even if you can't spot the difference now), and the cynical one that it's all just snobbery and market branding.

  Then run it the other way: what does this episode actually show about those theories? Does van Meegeren confirm that authorship is a genuine part of a work's value, or does it expose the whole original/copy distinction as a status game? Where do the theories go silent or have to stretch?

  Also tell me how confident you are in your overall verdict, and single out the point your least sure of. Keep it under 450 words, and write in British English.
reasoning: |-
  Okay, the user is really diving deep into the philosophical and practical implications of art forgery through the Han van Meegeren case. They want a structured analysis of how different theories of artistic value hold up when tested against this real-world scenario where perception flipped dramatically without physical changes to the work. 

  Hmm, they've clearly done their homework - referencing Goodman, provenance theories, and even the cynical "snobbery" view. The challenge is unpacking all four perspectives concisely while showing where van Meegeren's case becomes a stress test. The word limit means I'll need to be surgical.

  First, the achievement view seems strongest initially - the forgery lacks Vermeer's creative act. But does that fully explain why people initially adored it? Not quite, because they thought it was Vermeer's achievement. The value collapse was about shattered belief, not suddenly noticing inferior technique.

  Ah, the provenance view has a similar issue - the physical link didn't change, only their knowledge of it. Yet this theory insists the object's history defines it, so the moment attribution flipped, it became ontologically different. That feels a bit metaphysical for a practical case like this.

  Goodman's perceptual theory is fascinating here - he'd argue the knowledge fundamentally alters aesthetic experience. Van Meegeren proves this dramatically: once known as fake, people started seeing it as "kitsch" rather than "sublime." But is that inherent or learned snobbery? 

  Which brings us to the cynical view... the market branding angle. The identical canvas becoming worthless overnight screams manufactured value. But this overlooks genuine reverence for artistic genius - people weren't just buying a label, they believed in Vermeer's vision.

  The real test is the reversal: what does this episode reveal? It devastates simplistic "inherent value" claims, yet the cynical view can't explain why Vermeer originals retained value while forgeries crashed. The theories stretch most at explaining how perception reshapes the object itself - not just its price, but its felt presence.

  My weakest point? Probably overstating Goodman's perceptual claim. Do we truly see differently, or just judge differently? The line between aesthetic experience and social performance feels blurry here. Confidence overall? Medium-high - the case brilliantly exposes tensions, but no theory emerges unscathed.
answer: |-
  Here's how van Meegeren's *Supper at Emmaus* tests theories of originality, mapped against the attribution flip:

  1.  **What Changed:** The physical object (paint, canvas) remained identical. What changed was the *knowledge* of its creation (van Meegeren, not Vermeer), its *provenance* (20th-century forgery, not 17th-century masterpiece), its perceived *historical significance*, how people *interpreted* its style (suddenly seen as clumsy pastiche, not revolutionary genius), and its *market value* (crashing from priceless to near-worthless).
  2.  **Testing the Theories:**
      *   **Achievement View (Creative Act):** **Struggles.** The perceived creative act *was* Vermeer's until exposure. The *actual* achievement (van Meegeren's forgery) was never valued. Value hinged entirely on *belief* about authorship, not the inherent creative quality demonstrably present in the object when it was admired.
      *   **Provenance/Actual History View:** **Explains well.** The object's causal history *is* fundamentally different. Once proven to lack a causal link to Vermeer, it became ontologically a different entity – a van Meegeren forgery, not a Vermeer masterpiece. Its value evaporated because its defining history was false.
      *   **Goodman-style View (Perception Shift):** **Explains well.** Knowing it was a forgery drastically altered perception. Details once seen as profound (light, emotion) were reinterpreted as clichéd or artificial. The knowledge fundamentally changed the aesthetic experience, confirming Goodman's idea that authenticity affects how we *see*.
      *   **Cynical View (Snobbery/Branding):** **Explains superficially.** The market collapse looks like pure brand loyalty crashing. However, it struggles to explain the profound *aesthetic* disappointment experts felt and the shift in *interpretation*. The Vermeer "brand" wasn't arbitrary; it represented unique historical artistic achievement people genuinely revered.
  3.  **What the Episode Shows:**
      *   **Confirms:** Authorship and provenance are *crucial* constituents of an artwork's identity, value, and how it's perceived (supporting Provenance & Goodman). It devastates the notion that aesthetic value resides *solely* in the object's immediate perceptible properties.
      *   **Exposes:** The Achievement view, if focused only on the *inherent* quality of the act, struggles when perception of that act is false. The cynical view underestimates the genuine weight placed on historical connection and artistic intention.
      *   **Silences/Stretches:** None fully reconcile *why* the physical object, unchanged, can inspire awe as one thing and derision as another *while still possessing the same visual properties*. The Provenance view relies on metaphysics (the object's "essence" changes). Goodman explains the perceptual shift but less so the *ontological* claim that it's now a fundamentally different work. The Achievement view must stretch to say the valuable act *never existed* for this object, even when perceived.

  **Overall Verdict (Medium-High Confidence):** Van Meegeren powerfully demonstrates that authorship and provenance are not *just* snobbery or branding, but integral to an artwork's identity and the aesthetic experience it affords, supporting Provenance and Goodman views most strongly. It exposes the limitations of purely formalist (object-only) or simplistic achievement-based valuations.

  **Least Sure Point:** Whether the Provenance view's claim that the work becomes *ontologically different* is truly distinct from the Goodman view's claim that *only our perception and categorization* change. The line feels philosophically fuzzy.
