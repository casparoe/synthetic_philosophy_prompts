  Thesis 3 is about computational accuracy. Again, Simpson's paradox isn't about calculation mistakes, so it's safe to concede. 

  Thesis 4 states data contains objective facts. This is where it gets interesting. Simpson's paradox shows that aggregate data can mask subgroup trends. The numbers are objective, but their meaning isn't self-evident. This thesis is plausible in a narrow sense but becomes problematic when used to imply that data interpretation is straightforward. 

