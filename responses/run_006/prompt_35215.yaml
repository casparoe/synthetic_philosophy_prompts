answer: |-
  Here's a structured analysis of the no-truth-value view for indicative conditionals, addressing your questions and highlighting key uncertainties:

  ### 1. What the No-Truth-Value View Claims (Adams, Edgington)
  - **Core Thesis**: Indicative conditionals (e.g., "If it rains, the match is canceled") **do not express propositions** and thus **lack truth conditions**. They are devices for *conditional assertion*.
  - **Positive Commitment**: 
    - Their *assertability* is governed by the conditional probability of the consequent given the antecedent: Assert "If P, Q" iff P(Q|P) is high.
    - Probability of the conditional *is* conditional probability: P(If P, Q) = P(Q|P).
  - **What It Denies**:
    - No truth-apt content: They cannot be true/false in any standard sense.
    - No contribution to truth conditions of complex sentences (e.g., negation, disjunction).
  - **What It Doesn't Claim**: 
    - Counterfactuals *do* have truth conditions (e.g., Stalnaker-Lewis). 
    - Truth conditions for non-conditional sentences remain intact.

  ### 2. Strongest Arguments *For* the View
  - **Lewis's Triviality Results (1976)**:
    - **Core Result**: If P(If P, Q) = P(Q|P) for all probability distributions, and conditionals have truth values, **then P(Q|P) must equal P(Q)** – trivializing conditionals. 
    - **Implication**: Conditional probability *cannot* be the probability of a *truth-bearing* proposition. Thus, conditionals aren't truth-apt.
  - **The Direct Argument**: 
    - We don't assess "If P, Q" by asking if it matches the world; we assess by supposing P and judging Q under that supposition (Ramsey Test). This aligns with assertability, not truth.
  - **Lack of Truth-Conditional Content**:
    - "If I sneeze, the match won't be canceled" is absurd (low P(cancel|sneeze)) but *could* be true (if the match is canceled anyway). Truth conditions seem irrelevant.

  ### 3. Strongest Arguments *Against* the View
  - **The Embedding Problem**:
    - **Negation**: "It's not true that if P, Q" doesn't mean "If P, not-Q". The no-truth-value view struggles to explain this.
    - **Consequents of Conditionals**: "If (if P, Q), then R" (e.g., "If the vase broke if dropped, then it was fragile"). Requires compositional truth conditions.
    - **Belief Reports**: "Mary believes that if P, Q" attributes a belief *state*, but standard semantics treats "that"-clauses as propositional.
  - **Logical Inferences**:
    - Patterns like *Or-to-If* (From "Not-P or Q", infer "If P, Q") seem valid but resist explanation without shared truth conditions.
  - **Loss of Compositionality**: 
    - If conditionals lack truth values, how do they contribute to the meaning of complex sentences? Ad-hoc solutions (e.g., Edgington's "logical compounds of conditionals") are complex and non-standard.

  ### 4. Interaction with Indicative/Counterfactual Distinction
  - **No-Truth-Value Favors Deep Distinction**:
    - If indicatives lack truth conditions but counterfactuals have them (via possible worlds), the split is **semantic and fundamental**.
  - **Alternative Views & Shallow Distinction**:
    - **Stalnaker's Unified Account**: *Both* express propositions. Indicatives use the *actual* world's similarity metric; counterfactuals use a *shifted* one. Distinction becomes **pragmatic** (context of supposition).
    - **Material Implication**: Both reduce to ¬P ∨ Q, making the distinction purely linguistic/syntactic.
  - **Survival of Distinction**:
    - Even if *both* have truth conditions, the distinction survives if they rely on *different kinds* of truth conditions (e.g., indicative = epistemic, counterfactual = metaphysical).

  ### 5. Current State of the Debate
  - **No Consensus**:
    - Triviality results are mathematically robust but interpretatively contested.
    - Embedding problems remain the Achilles' heel for no-truth-value views.
  - **Viable Positions**:
    1. **No-Truth-Value (Adams/Edgington)**: Dominant in Bayesian epistemology. Viable if embedding issues can be resolved pragmatically.
    2. **Contextualist Truth Conditions (Stalnaker, Gibbard)**: Conditionals express propositions relative to contexts/suppositions.
    3. **Dynamic Semantics (Gillies, Starr)**: Conditionals update context or information states (blurs assertability/truth).
    4. **Restricted Truth-Conditional (e.g., Kratzer)**: All conditionals are quantificational; differences stem from modal bases/ordering sources.
  - **Ruled Out?**:
    - **Simple Material Implication**: Fails "paradoxes" (e.g., high P(¬P) makes "If P, Q" "true" but unassertable).
    - **Unrestricted Conditional Probability = Probability of Conditional**: Mathematically impossible per triviality.

  ---

  ### Load-Bearing Uncertainties & Revisable Assumptions
  1. **Embedding Under Negation**:
     - *My leaning*: This strongly favors truth conditions.  
     - *Uncertainty*: Can a sophisticated suppositional logic (e.g., Edgington's "not" as rejection of conditional assertion) fully capture natural language intuitions?  
     - *What would change my mind*: A formal system handling embeddings as elegantly as truth-conditional semantics.

  2. **The Scope of Triviality**:
     - *My leaning*: Triviality shows conditionals can't be *ordinary* propositions, but they might be *non-classical* propositions.  
     - *Uncertainty*: Do triviality results apply to *all* truth-conditional accounts, or only those assuming classical probability?  
     - *What would change my mind*: A truth-conditional model that non-trivially satisfies P(If P, Q) ≈ P(Q|P) in natural contexts.

  3. **Unified vs. Dichotomous Accounts**:
     - *My leaning*: The indicative/counterfactual distinction is too systematic to be purely pragmatic.  
     - *Uncertainty*: Can a unified semantics (e.g., dynamic or contextualist) explain the *felt difference* without bifurcation?  
     - *What would change my mind*: Evidence that "counterfactuality" reduces to known pragmatic mechanisms (e.g., presupposition failure in indicatives with false antecedents).

  **Key Frontier**: Developments in dynamic semantics (e.g., using discourse representation theory) offer promising ways to preserve Ramsey Test insights *while* handling embeddings, potentially reconciling the best aspects of both views. If successful, this could make the "no-truth-value" label obsolete without conceding to classical truth conditions.
