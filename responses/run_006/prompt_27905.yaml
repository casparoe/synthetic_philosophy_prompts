  The student mentions specific examples they want covered: protected category proxies, identical individuals treated differently, group harms. They also name formal concepts like equalized odds vs demographic parity. This suggests they've done some preliminary reading already.

  Hmm... the challenge is balancing depth with accessibility. Need to: 
