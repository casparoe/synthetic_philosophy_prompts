answer: |-
  Here's a set of desiderata for a theory of algorithmic fairness, structured as requested. These criteria stem from real-world concerns, theoretical limitations, and ethical debates.

  ### I. Core Requirements (Non-Negotiables)
  1.  **Prevent Direct Discrimination:** Must correctly classify the use of a *protected category* (e.g., race, gender) as unfair in decisions where it is irrelevant (e.g., loan approval based *directly* on race). *Why:* Legally prohibited (e.g., Civil Rights Act), ethically repugnant. *Status:* Non-negotiable.
  2.  **Prevent Proxy Discrimination:** Must correctly classify the use of *neutral-seeming proxies* for protected categories as unfair (e.g., zip code as proxy for race in credit scoring). *Why:* Perpetuates historical bias covertly. *Status:* Non-negotiable (widely accepted core harm).
  3.  **Prevent Unjustified Individual Disparity:** Must correctly classify unfairness when *two otherwise identical individuals* receive different outcomes solely due to algorithmic bias (e.g., same qualifications, but different hiring scores). *Why:* Violates fundamental notions of equality and merit. *Status:* Non-negotiable (core of individual fairness).
  4.  **Acknowledge & Address Group Harms:** Must correctly identify and provide tools to mitigate *aggregate harms* that manifest only at the group level (e.g., systemic underinvestment in minority neighborhoods via biased loan algorithms). *Why:* Historical injustice often operates structurally; ignoring groups perpetuates inequity. *Status:* Non-negotiable (necessary for societal impact analysis).
  5.  **Respect Impossibility Results:** Must not contradict established *mathematical impossibility theorems* (e.g., Kleinberg, Chouldechova, Barocas & Selbst). *Why:* Theories demanding mutually exclusive criteria (like calibration + equalized odds + demographic parity simultaneously) are incoherent except in trivial cases. *Status:* Non-negotiable (mathematical constraint).

  ### II. Essential Distinctions (Must Not Collapse)
  6.  **Group vs. Individual Fairness:** Must preserve the distinct concepts of fairness for *statistical groups* (e.g., equal approval rates) and *specific individuals* (e.g., similar people treated similarly). *Why:* Solutions for one can violate the other (COMPAS case: group parity achieved while individuals with similar risk scores received different bail decisions). *Status:* Non-negotiable distinction (collapsing leads to incoherence).
  7.  **Process vs. Outcome Fairness:** Must distinguish between fairness in the *decision-making procedure* (e.g., using unbiased data, transparent rules) and fairness in the *end results* (e.g., equitable distribution of benefits/harms). *Why:* A fair process can yield unfair outcomes (e.g., unbiased model trained on biased world data), and vice versa. *Status:* Distinction is critical (negotiable focus, but not the distinction itself).
  8.  **Bias Source Distinction:** Must differentiate *bias in the training data* (e.g., historical discrimination reflected in loan repayment data) from *bias introduced by the decision rule* itself (e.g., an algorithm amplifying small disparities). *Why:* Remediation strategies differ fundamentally (data repair vs. algorithm redesign). *Status:* Non-negotiable distinction (practical necessity).

  ### III. Contextual Requirements (Often Camp-Specific Preferences)
  9.  **Account for Legitimate Factors:** Must allow for justified use of *relevant factors* correlated with protected attributes if causally linked to the outcome (e.g., pregnancy status in disability coverage). *Why:* Avoiding all correlates is often impractical and can harm accuracy/utility. *Status:* Preference (Accuracy/Utility camp vs. Anti-Classification camp).
  10. **Sensitivity to Decision Context:** Must adapt requirements based on the *stakes and purpose* (e.g., criminal justice vs. movie recommendations). *Why:* Rigid universal rules fail in diverse real-world scenarios. *Status:* Preference (Pragmatic/Contextual camp).
  11. **Causal Insight:** Should ideally provide mechanisms to reason about *causal pathways* of bias. *Why:* Proxies and harms often stem from underlying causal structures. *Status:* Preference (Causal Fairness camp).

  ### IV. Conflicts & Exclusivity
  *   **Jointly Unsatisfiable Subsets:** The core impossibility theorems show that **Demographic Parity (DP) + Equalized Odds (EO) + Calibration (Cal)** are mutually exclusive except under very specific conditions (e.g., equal base rates, perfect prediction). Requiring all three simultaneously is generally impossible.
  *   **Most Exclusionary Requirement:** **Preventing Unjustified Individual Disparity (Requirement #3)** does the most to exclude standard *group-based* proposals. Strict individual fairness (Dwork et al.) is very demanding and often incompatible with achieving statistical group parity (DP) or high utility.

  ### V. Scoring Major Families (Briefly vs. Criteria)
  *   **Statistical Parity (Demographic Parity):** Strong on Group Harms (#4) & Proxy Discrimination (#2), but ignores Legitimate Factors (#9), violates Individual Disparity (#3) and Calibration (#5), often conflicts with utility.
  *   **Equalized Odds/Opportunity:** Strong on preventing unjustified differences in error rates *conditional* on qualification (#3 partially, #4), respects calibration better than DP. Violates Demographic Parity (#5 Impossibility), weak on Proxy Discrimination (#2) if proxies define "qualified".
  *   **Calibration-Based Views:** Strong on aligning predictions with observed outcomes (#9 Utility), often seen as "fair" in risk assessment. Ignores Group Harms (#4), Individual Disparity (#3), and Proxy Discrimination (#2); conflicts with DP & EO (#5 Impossibility).
  *   **Individual Fairness:** Strongest on Individual Disparity (#3), forces similarity reasoning. Extremely difficult to define/operationalize similarity metrics fairly (#8 Bias Source, #2 Proxies); weak on Group Harms (#4); often incompatible with group metrics (#6 Distinction).
  *   **Causal Approaches:** Strong on Proxy Discrimination (#2), Bias Source (#8), and potentially Legitimate Factors (#9) via causal graphs. Can address Group Harms (#4) & Individual Disparity (#3) depending on definition. Highly sensitive to model specification; computationally/data intensive; avoids some but not all impossibilities (#5).

  **Key Takeaway:** An adequate theory must navigate these non-negotiable requirements (#1-#8), respect the mathematical constraints (#5), and explicitly acknowledge the trade-offs inherent in the conflicting desiderata, especially between individual and group fairness and within the impossibility trilemma. The choice among negotiable requirements (#9-#11) often defines the "camp" and the context of application. No single proposal satisfies all desiderata universally.
