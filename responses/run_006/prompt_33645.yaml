prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've been trying to get clear about what I think about moral conflicts: situations where it seems like I can't do everything I ought to do. I have strong reactions to a set of cases, but I can't see the principle behind them. I'd like you to help me find it, or tell me which of my reactions I should give up.

  Here are the cases and my verdicts.

  1. Double-booked promises. Last week I promised a friend I'd help them move on Saturday, and then forgot and promised another friend I'd review a critical pull request at the same time. I can only do one. Verdict: this isn't a genuine dilemma. The mess traces back to my carelessness; at the moment of choice I should pick the weightier commitment, do it, and apologize to the other person. Being in a bind now doesn't mean I face two real obligations at once.

  2. The student in wartime. A student must choose between staying to care for his mother, who depends on him and will likely not survive without him, and leaving to join the resistance against an occupying army. Both strike me as weighty obligations, and neither seems to override the other. Verdict: a genuine dilemma. Whichever he does, he fails at something he genuinely owed; there is no fully right option.

  3. The runaway vehicle. A runaway vehicle is heading toward five workers. I can throw a switch that diverts it to a side track where it will hit one worker. Verdict: not a genuine dilemma. Diverting is the right thing to do, even though the death of the one worker is terrible and I should feel awful about it. I don't think I wrong the one worker, all things considered, even though I deeply regret the harm.

  4. Forced choice between children. An official tells a parent to choose which of their two children will be taken away to be killed; if the parent refuses, both will be taken. Verdict: I keep going back and forth, but my strongest reaction is that this is a genuine dilemma. Whichever child the parent names, the parent has done something wrong to the unchosen child, even though the official is the one doing the killing. There is no right answer.

  5. Clear override. I promised a colleague I'd review their code tonight, and separately promised my child I'd attend their school performance. I can't do both. Verdict: not a dilemma. The performance clearly overrides the code review; I break the promise to the colleague, apologize, and reschedule. The conflict is real but resolvable.

  6. Two drowning strangers. I see two strangers drowning. I can save only one, and there is no relevant difference between them. Verdict: not a dilemma. I ought to save one of them, and if I save one I haven't violated a duty to the other; the duty was to save as many as I could, which I did. The other's death is a tragedy but not a wrong I did.

  7. Ordered to do wrong. A soldier is ordered to carry out an attack that will kill civilians. If he refuses, he will be punished and the unit may fail. Verdict: not a dilemma. Whatever obligation he has to follow orders is clearly overridden by the obligation not to kill civilians. The right choice is to refuse.

  I notice that two of these sit badly together. In case 6, I think saving one stranger and letting the other die is not a wrong, because I did all I could. In case 4, I think the parent does wrong no matter which child they choose, even though the parent is also forced and cannot save both. I can't tell what principle makes case 4 a genuine dilemma but case 6 not, and I can't tell whether I should keep both verdicts.

  Is there a principle, or a small set of principles, that captures all of these verdicts, or close? Please state it precisely enough that I could apply it to new cases. Tell me what it says about a case I haven't listed: a doctor with one ventilator and two patients who will die without it, equally likely to survive with it, where the doctor must choose and has no tie-breaker. Also be explicit about which of my verdicts, if any, your principle forces me to overturn, and why you would overturn those rather than complicate the principle to keep them.

  Please also separate what is settled from what is genuinely contested among people who work on this, and don't present a contested view as the consensus.
reasoning: |-
  Alright, the user is a software engineer trying to understand moral conflicts, specifically why some situations feel like genuine dilemmas while others don't. They've provided seven cases with their own verdicts and are particularly struggling with the inconsistency between Case 4 (forced choice between children) and Case 6 (two drowning strangers). 

  First, I need to unpack their core confusion: why does choosing one child to die feel like a moral failure ("wronging" the unchosen child), but saving one stranger doesn't feel like wronging the other? Both involve unavoidable sacrifice due to external constraints. 

  Hmm... their examples reveal hidden patterns. Cases they consider non-dilemmas (1,3,5,6,7) all involve either: 
  - Clear overrides (promise vs. child's performance) 
  - No prior obligation to the sacrificed party (runaway vehicle) 
  - Maximal effort fulfilling a general duty (two drowning) 
  Whereas dilemmas (2,4) involve deep, irreplaceable roles (son/caregiver, parent/child) where the agent is uniquely positioned to fulfill an obligation. 

  Ah! The key might be "role-generated duties" versus "general duties." In Case 4, the parent has a specific, non-transferable duty to protect *each* child individually. Choosing one violates the direct obligation to the other. But in Case 6, the duty to save drowning strangers is general ("save whom you can")—saving one satisfies that duty fully. 

  Wait, but Case 2 also fits this. The student's duty to his mother arises from their unique relationship, just like parental duties. Neither can be delegated. That's why both 2 and 4 feel like true dilemmas—failing a role-bound duty leaves a moral residue. 

  For the ventilator case: the doctor’s duty is professional (save lives impartially), not personal. Choosing Patient A doesn't violate a unique obligation to Patient B, so it aligns with Case 6. No dilemma. 

  The user might resist giving up their verdict on Case 4. I should acknowledge that while my principle suggests it shouldn't be a dilemma, their intuition reflects real philosophical weight (Williams' "moral remainder"). But for systematicity, adjusting Case 4 to match Case 6 is cleaner. 

  Also noting: their distinction between "tragedy" (Case 6) and "wrong" (Case 4) is perceptive but needs grounding. Role duties explain it. 

  Lastly, I should flag where philosophers disagree—e.g., whether "moral residue" exists even in resolvable conflicts (Case 3). The user values clarity, so separating consensus from controversy is key.
answer: |-
  Based on your cases and verdicts, your intuitions align closely with a **Role-Obligation Principle** combined with **Agent-Neutral vs. Agent-Relative Duties**. Here’s a precise formulation capturing your judgments:

  ### The Principle
  **1. Role-Obligation Asymmetry**:  
     - Duties arising from *specific roles or relationships* (e.g., parent-child, caregiver-dependent) generate *non-transferable obligations* to *each individual* in that role. Failing one individual constitutes a moral failure *to them*, even if unavoidable.  
     - General duties (e.g., saving strangers, maximizing utility) are *agent-neutral* and satisfiable by acting optimally given constraints. Failing to aid someone due to impossibility isn’t a wrong *to that person* if you fulfilled the duty’s scope (e.g., saving whom you could).  

  **2. Override Condition**:  
     - Conflicts between duties are resolvable (not dilemmas) if:  
       (a) One duty *clearly outweighs* the other (e.g., child’s performance > colleague’s code review), OR  
       (b) The conflict stems from *prior fault* (e.g., double-booking), OR  
       (c) The "sacrificed" party has *no valid claim against you* (e.g., strangers in symmetrical peril).  

  **3. Dilemma Condition**:  
     - A genuine dilemma exists only when:  
       (a) Two *role-based obligations* to *specific individuals* conflict,  
       (b) Neither overrides the other,  
       (c) Fulfilling one *directly fails* the other, and  
       (d) The failure isn’t mitigated by external forces (e.g., the aggressor in Case 4).  

  ---

  ### Application to Your Cases
  | Case               | Your Verdict       | Principle’s Verdict     | Consistency Check |  
  |--------------------|--------------------|-------------------------|-------------------|  
  | 1. Double-booked   | Not a dilemma      | **Matches** (Override Condition b) | ✓ |  
  | 2. Student         | **Genuine dilemma** | **Matches** (Dilemma Condition a,b,c) | ✓ |  
  | 3. Runaway Vehicle | Not a dilemma      | **Matches** (Override Condition c) | ✓ |  
  | 4. Forced Choice   | **Genuine dilemma** | **Clashes** (Dilemma Condition not fully met; see below) | ✗ |  
  | 5. Clear Override  | Not a dilemma      | **Matches** (Override Condition a) | ✓ |  
  | 6. Drowning Strangers| Not a dilemma      | **Matches** (Override Condition c) | ✓ |  
  | 7. Soldier         | Not a dilemma      | **Matches** (Override Condition a) | ✓ |  

  **Inconsistency Explained**:  
  - **Case 4 (Forced Choice)** clashes with **Case 6 (Drowning Strangers)** under your verdicts.  
  - The principle resolves this:  
    - In Case 6, you have a *general duty* to save lives. Saving one satisfies the duty’s scope ("save whom you can"). The unchosen stranger has no *personal claim* against you.  
    - In Case 4, the parent has *identical role-obligations* to each child. Choosing Child A *directly violates* the duty to protect Child B *as an individual*, even if forced.  

  **Your Dilemma**: You initially saw Case 4 as a dilemma but Case 6 as not. The principle forces you to **revise Case 4** to match Case 6:  
     - *Why?* The aggressor’s coercion *externalizes* the harm. The parent doesn’t fail their role-duty by choosing; they fulfill it *as best possible* (saving one child). The wrong is solely the aggressor’s.  
     - *Consequence*: Case 4 becomes **not a genuine dilemma** (like Case 6). Choosing a child is tragic but not a moral failure *to the unchosen child*.  

  ---

  ### Ventilator Case (New Example)
  - **Scenario**: Doctor with one ventilator for two identical patients.  
  - **Principle’s Verdict**: **Not a dilemma**.  
    - *Why?* The doctor’s duty is *agent-neutral* (save lives impartially). Choosing Patient A doesn’t violate a duty *to Patient B*, as the duty was "save whom you can." No role-obligation exists to each *as individuals* (unlike parenting). The doctor acts correctly by choosing randomly.  

  ---

  ### What’s Settled vs. Contested  
  **Settled Consensus**:  
  - Not all conflicts are dilemmas (e.g., resolvable overrides).  
  - Moral dilemmas require *incommensurable obligations* with *no optimal solution*.  
  - Agent-relative duties (e.g., parental obligations) are stricter than agent-neutral ones.  

  **Contested Issues**:  
  1. **Existence of Genuine Dilemmas**:  
     - Some (e.g., Kantians) deny dilemmas exist: a "duty" must be overrideable.  
     - Others (e.g., Williams) argue dilemmas leave "moral residue" (regret isn’t enough; the unchosen act remains a wrong). *Your Case 2/4 intuitions lean here*.  
  2. **Role-Obligation Strength**:  
     - How far do role-duties extend? (e.g., Is the student’s duty to his mother stronger than to society?). *This underpins your Case 2 verdict*.  
  3. **Forced Choices**:  
     - Whether coercion absolves the agent (e.g., Case 4). *This is the crux of your inconsistency*.  

  ### Recommendation  
  - **Revise Case 4** to align with Case 6: The parent *does not wrong* the unchosen child. The moral failure lies entirely with the aggressor.  
  - **Keep Case 2** as a dilemma: The student’s obligations to his mother (role-duty) and to resist oppression (quasi-role duty as a citizen) are incommensurable and agent-relative.  
  - **Principle Strengths**: Explains why the drowning/ventilator cases lack dilemmas (general duties) and why the student case *is* one (competing role-duties).  

  This system maintains your core intuition about *relationships* generating irreducible obligations while resolving the forced-choice inconsistency. If you retain Case 4 as a dilemma, you’d need to accept that *external coercion* doesn’t mitigate role-duties—a minority view with steep costs (e.g., condemning victims of coercion).
