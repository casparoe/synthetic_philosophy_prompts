prompt: |-
  I keep noticing a pattern in EA and rationalist discussions about the far future and I don't know if it has a name. Someone argues we should prioritize reducing extinction risk because if humanity survives there could be trillions of future lives, and losing all that value would be an astronomical waste. Then someone else points out the same reasoning cuts the other way: if we're not sure the future will be net positive, then the sheer number of future lives multiplies the possible downside too, and we might actually have an astronomical reason to prevent the future from happening — or at least to focus on making sure it's good rather than just making sure it happens. The structure seems to be: you take an argument that uses "enormous number of future lives" to justify priority X, and then someone points out the enormous number is symmetric between positive and negative scenarios, so the argument doesn't pick out X unless you've already assumed the sign. I see this move made in a bunch of places — not just about extinction risk, but also about AI alignment, whether to accelerate growth, etc. Is there an established name for this specific argumentative move or the symmetry it points to? And if there is, how precisely is it defined — does it require that the original arguer actually overlooked the symmetry, or does it also apply when they're aware of it but think the sign is clear? If there's no name, what would you call it and how would you draw the boundaries? Also tell me how confident you are in your answer and what the point you're least sure about is.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've noticed a recurring pattern in EA and rationalist discussions about the far future. Specifically, when someone argues for reducing extinction risk based on the vast number of potential future lives, another person counters by pointing out that if the future could be negative, that same vast number amplifies the downside. The user wants to know if this argumentative move has a name, how it's defined, and whether it applies even when the original arguer is aware of the symmetry.

  First, I need to recall relevant concepts in philosophy and ethics. The symmetry between positive and negative outcomes in utilitarianism reminds me of the "Pascal's Mugging" problem, but that's more about small probabilities. The user's scenario involves the sign of the future's value. Then there's the "veil of ignorance" from Rawls, but that's about fairness, not this symmetry.

  The closest term seems to be "sign uncertainty." It's used in longtermism discussions to address uncertainty about whether the future will be net positive or negative. The user's description matches this: the move highlights that without knowing the sign, the expected value calculation doesn't inherently favor existence. 

  But I should check if there's a more established term. "Value ambiguity" or "value sign symmetry" come to mind, but they aren't standardized. "Symmetry objection" is another possibility, as it directly points out the overlooked symmetry. However, "sign uncertainty" is more specific to the context of future value uncertainty.

  The user also asks whether the term applies if the original arguer is aware of the symmetry but believes the sign is clear. The move itself can still be used to challenge the certainty of that sign. So the objection is valid in questioning the assumption, regardless of the arguer's awareness.

  I need to ensure the boundaries are clear. The core is the symmetry between positive and negative outcomes multiplied by large numbers. It's distinct from general risk aversion or probability weighting. Examples like AI alignment and growth acceleration fit here because they involve uncertain future impacts.

  The user's deeper need might be to understand this dialectic to better engage in these discussions. They might want to identify the weakness in arguments that prioritize certain interventions without considering value uncertainty. Naming the concept helps in referencing it efficiently in debates.

  I should also address confidence levels. I'm confident about "sign uncertainty" being the closest term, but less so about whether it's universally accepted. The point about the move applying even with awareness is solid, as the objection targets the assumption's justification.
answer: |-
  Based on your description, this is a **core dialectic within longtermist ethics**, specifically addressing **value uncertainty about the far future**. The most precise and established name for the *move itself* is the **"Sign Uncertainty" objection** or the **"Value Sign Symmetry" point**.

  Here's the breakdown and answers to your specific questions:

  1.  **The Established Name & Definition:**
      *   **Primary Term: Sign Uncertainty.** This is the most common and recognized term within EA/rationalist longtermist discourse (e.g., in academic papers, blog posts, forum discussions). It directly refers to the uncertainty about whether the long-term future will be net positive or net negative in value.
      *   **The Argumentative Move:** Pointing out that the "astronomical scale" argument for prioritizing X (e.g., reducing extinction risk) only holds under the assumption that the future's expected value is positive. If the sign is uncertain or negative, the same scale magnifies the potential disvalue. This move highlights the **symmetry** inherent in multiplying expected value by vast numbers when the sign (positive/negative) itself is uncertain.
      *   **Precise Definition:** The Sign Uncertainty objection argues that interventions justified by the vast scale of the potential future *depend critically* on resolving the prior question of whether the expected value of that future is positive or negative. It demonstrates that scale alone is insufficient to determine priority without establishing the expected sign of value.

  2.  **Scope: Does it require the original arguer overlooked the symmetry?**
      *   **No.** The move is valid *regardless* of the original arguer's awareness.
      *   **If overlooked:** The objection exposes a critical flaw or oversight in the original argument, showing it implicitly assumed a positive sign without justification.
      *   **If aware but think the sign is clear:** The objection serves to **challenge the justification for assuming a positive (or negative) sign**. It forces the original arguer to defend *why* they believe the sign is sufficiently clear/positive to warrant the scale-based priority. The objection highlights that the burden of proof lies on establishing the sign, and that the scale argument is contingent on winning that prior argument. It shifts the debate to the more fundamental question of value expectation.

  3.  **Boundaries of the Concept:**
      *   **Core:** The specific symmetry between potential astronomical future value and potential astronomical future disvalue *when the sign is uncertain*, used to challenge interventions justified primarily by scale.
      *   **Included:** Arguments about extinction risk, AI alignment strategy (e.g., "pause development" vs. "accelerate carefully" vs. "prevent entirely"), space settlement, accelerating/reducing economic growth rates for long-term effects, interventions focused purely on increasing the *duration* of civilization vs. improving its *quality*.
      *   **Excluded:**
          *   Arguments about *probabilities* alone without the value sign component (e.g., "The risk is too small to worry about" isn't directly about sign symmetry).
          *   Arguments about *distribution* within the future (e.g., average vs. total utilitarianism) without focusing on the net sign uncertainty.
          *   Near-term suffering-focused arguments not primarily based on the scale of the *far* future.
          *   General risk aversion arguments not specifically tied to the *sign* of the outcome multiplied by vast numbers.

  4.  **Alternative/Descriptive Names (Less Standardized):**
      *   **The Symmetry Objection:** Highlights the core symmetry point.
      *   **Value Ambiguity Leverage:** Emphasizes using the ambiguity to counter the scale argument.
      *   **The Conditional Scale Argument:** Emphasizes that the scale argument is conditional on sign.
      *   **The Net Value Burden:** Emphasizes shifting the burden to proving net positive value.

  5.  **Confidence & Uncertainty:**
      *   **Confidence Level:** **High (85%)** that "Sign Uncertainty" is the established and most accurate term for the *phenomenon* and the core of the dialectic within this specific community.
      *   **Confidence Level:** **Medium-High (75%)** that applying the term to the *argumentative move* itself is appropriate and widely understood in context.
      *   **Point of Least Certainty:** Whether "Sign Uncertainty" is universally considered *the name of the move* vs. the name of the *problem* the move addresses. The move is often *described* using the term "sign uncertainty" even if it's not formally named as "The Sign Uncertainty Move." The distinction is subtle, but within the discourse, saying "this runs into sign uncertainty" or "you need to address sign uncertainty" is the common way to invoke this objection.
      *   **Other Minor Uncertainty:** Whether alternative names like "Value Sign Symmetry" are gaining enough traction to be primary contenders. Currently, "Sign Uncertainty" dominates.

  **In essence:** You're observing the recurring "Sign Uncertainty" objection in action. It's a powerful and necessary counterpoint within longtermism, forcing proponents of scale-based arguments (like extinction risk reduction) to explicitly grapple with the fundamental and deeply uncertain question of whether the potential future is, on expectation, worth creating or preserving at all. The symmetry highlighted is the core of its strength.
