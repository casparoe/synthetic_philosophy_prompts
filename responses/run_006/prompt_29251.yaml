prompt: |-
  Alright, here's one. I want you to build me a thought experiment that puts pressure on the simple counterfactual theory of causation by omission. You know the view: an omission causes an outcome iff had the omitted event occurred, the outcome wouldn't have. The problem everyone points to is overgeneration — the Queen of England's failure to water my plant comes out as a cause of its death. But the standard move is to add some kind of normality or relevance constraint, and then the counterfactual theorist says "sure, fine, I'll build that in."

  What I want is more specific. Construct a case with two omissions, both of which straightforwardly satisfy the counterfactual condition, but where one of them also satisfies a plausible normative constraint (the omitted act was required by a duty, a role, a reasonable expectation, somethig like that) and the other doesn't. The bare counterfactual theory should say both are causes. The norm-constrained theory should say only the normatively backed one is. And — here's the key — I want the norm-constrained theory's verdict to be the intuitive one, but not in a cheap way where the normative difference is just obviously morally loaded. The normative constraint should be thin: a professional role, a customary practice, a coordination scheme — not a moral obligation. The point is to test whether the "selection problem" for omissions really is about norms all the way down, or whether the counterfactual theorist can solve it with something thinner.

  Constraints: the scenario should be ordinary — a workplace, a household, a school, something like that. No more than a paragraph. And don't let the two omissions differ in their spatial or temporal proximity to the outcome; I don't want the counterfactual theorist to say "well, one is just more proximate, that's all I need."

  After the scenario, walk me through: what each theory says and why, which feature of the case is doing the work, and what the counterfactual theorist's best response is — can they earn the intuitive verdict without going normative?

  Start with the scenario itself, no preface or commentary, and then walk through the analysis.
reasoning: |-
  We are in a hospital setting. Nurse A is responsible for administering medication to Patient P at 10 AM. Doctor B is in the hospital but has no direct responsibility for P's medication; she is, however, capable of administering it. Both Nurse A and Doctor B fail to administer the medication. Due to this omission, Patient P suffers a preventable complication.

  Counterfactual condition for causation by omission:
  - For Nurse A: Had Nurse A administered the medication, the complication would not have occurred. True.
  - For Doctor B: Had Doctor B administered the medication, the complication would not have occurred. True.

  The bare counterfactual theory says both omissions are causes.

  Now, we add a normative constraint: only omissions that violate a relevant norm (such as a duty, role, or reasonable expectation) count as causes. Here, Nurse A has a professional duty to administer the medication as part of her assigned role. Doctor B does not have such a duty; she is not assigned to this patient and her role does not require her to step in when the nurse fails. There might be a general moral duty to help, but we are avoiding thick moral norms. The norm here is thin: a professional role within an institutional structure.

  The norm-constrained theory says only Nurse A's omission is a cause because it violates a role-based duty. Doctor B's omission, while counterfactually sufficient, does not violate a relevant norm in the institutional setting.

  Intuitive verdict: In this context, we would typically say that Nurse A's failure caused the harm, but not Doctor B's. It was Nurse A's job, and we don't ordinarily blame the doctor for not stepping in when there is a nurse assigned and responsible.

  What feature is doing the work? The institutional role assignments. The norm is about the division of responsibilities in the hospital.

  Can the counterfactual theorist earn the intuitive verdict without going normative?

  Possible non-normative moves:

  1. **Proximity**: We ruled out spatial or temporal proximity. Both are in the hospital and could have acted at the same time.

  2. **Probability**: It might be argued that it is more expected (probable) for the nurse to administer the medication than the doctor. But the counterfactual theory doesn't typically use probability. Moreover, the counterfactual condition is satisfied by both.

  3. **Dependence**: The outcome counterfactually depends on Nurse A's omission, but it also depends on Doctor B's. So that doesn't help.

  4. **Preemption**: The counterfactual theorist might try to say that if Nurse A had acted, then Doctor B's omission would not have mattered, but that doesn't change the fact that in the actual world, both omissions are present and both counterfactuals hold. Also, note that we are considering each omission separately.

  5. **Intermittent Omissions**: The counterfactual theorist might argue that the doctor's omission is not a cause because there was an independent omission (the nurse's) that would have caused the harm anyway. But that would be a preemption move. However, in this case, if we consider the doctor's omission, the counterfactual is: if the doctor had acted, the harm would not have occurred (because the nurse didn't act). So the harm does counterfactually depend on the doctor's omission. Similarly for the nurse.

  Alternatively, the counterfactual theorist might try to use a contrastive approach. They might say that we are comparing the actual world (where both omit) to a world where the nurse acts (and the outcome doesn't occur) and a world where the doctor acts (and the outcome doesn't occur). But without a norm, why prefer one contrast over the other?

  But the counterfactual theorist might introduce a default. For example, the nurse's action is the default, so the nurse's omission is a deviation. The doctor's non-interference is the default. However, what determines the default? It seems that the default is set by the institutional roles. Without the norm, it's arbitrary.

  The counterfactual theorist might try to use a notion of "normal" conditions that is non-normative. For example, normally, the nurse administers the medication and the doctor does not. So the nurse's omission is abnormal, but the doctor's omission is normal. Therefore, only the nurse's omission is a cause.

  But is "normal" here non-normative? It could be statistical: most of the time, the nurse does it and the doctor doesn't. However, in this scenario, the norm-constrained theorist would argue that the statistical normality is grounded in the institutional norm. Without the norm, why would we care about statistical normality? Moreover, it might be that in a particular hospital, the nurse forgets 10% of the time, and the doctor never intervenes. Then the nurse's omission is statistically abnormal (only 10%) and the doctor's omission is normal (100%). But that doesn't change the intuition that the doctor's omission isn't a cause.

  Alternatively, the counterfactual theorist might say that the nurse's omission is a cause because it is the closest possible world where the medication is administered. But the closest world where the medication is administered is one where the nurse does it (because that's her job) rather than the doctor. This again invokes the role.

  It seems difficult for the counterfactual theorist to avoid the normative constraint without smuggling in the norm via concepts like default, normal, or closest.

  Therefore, the counterfactual theorist's best response might be to bite the bullet and say that both are causes, but then explain why we only hold the nurse responsible: because of her role. But that would be to concede that causation by omission is overgenerated and then we use norms to select which ones matter for responsibility. However, the original question was about causation, not responsibility.

  But the norm-constrained theory is precisely about causation: it says that the doctor's omission is not a cause at all.

  Conclusion: The case seems to show that the counterfactual theory overgenerates causes by omission and that a normative constraint (even a thin one) is needed to get the intuitive verdict. And the counterfactual theorist cannot easily avoid it without invoking a norm-laden notion of normalcy or default.
answer: |-
  ### Scenario
  In a factory, Worker A is assigned to check and refill the coolant in Machine X every morning at 8 AM, as per her explicit job description. Supervisor B, who oversees multiple machines, has no direct responsibility for Machine X’s coolant but is physically able to refill it. On a particular day, both Worker A and Supervisor B fail to refill the coolant. As a result, Machine X overheats and breaks down at noon. Worker A’s omission violates her role-based duty; Supervisor B’s omission does not, as factory protocols assign coolant checks only to designated workers, not supervisors.

  ### Analysis
  **Bare Counterfactual Theory of Causation by Omission**  
  - **Worker A’s omission**: Had Worker A refilled the coolant (at 8 AM), the breakdown would not have occurred. The counterfactual condition is satisfied.  
  - **Supervisor B’s omission**: Had Supervisor B refilled the coolant (e.g., at any point before noon), the breakdown would not have occurred. The counterfactual condition is also satisfied.  
  - **Verdict**: Both omissions are causes of the breakdown. The theory treats them symmetrically since both satisfy the counterfactual dependency.  

  **Norm-Constrained Counterfactual Theory**  
  - **Worker A’s omission**: This omission violates a thin normative constraint—a role-based duty explicitly defined in the factory’s division of labor. The constraint is non-moral; it arises from institutional roles and customary practices (like job descriptions).  
  - **Supervisor B’s omission**: This omission satisfies the counterfactual condition but lacks a normative backing. Supervisor B has no assigned duty, expectation, or coordination-based obligation to refill the coolant. General ability alone is insufficient.  
  - **Verdict**: Only Worker A’s omission is a cause. The normative constraint filters out Supervisor B’s omission, aligning with the intuition that Worker A’s failure caused the breakdown, while Supervisor B’s inaction is merely a background condition.  

  **Feature Doing the Work**  
  The key feature is the **institutional role assignment**, a thin normative constraint based on organizational structure rather than morality. Worker A’s duty stems from her job description—a concrete, context-specific expectation. Supervisor B’s lack of duty reflects the factory’s coordination scheme, which deliberately limits responsibilities to avoid overlap. This norm is "thin" because it involves no moral evaluation (e.g., it isn’t about fairness or blame); it’s purely functional, akin to a rule in a manual. Crucially, spatial/temporal proximity is identical: both could have acted in the same location during the same timeframe (e.g., either could have refilled coolant between 8 AM and noon).  

  **Counterfactual Theorist’s Best Non-Normative Response**  
  The counterfactual theorist might appeal to **statistical typicality** to avoid norms:  
  - **Argument**: In the factory, Worker A’s refilling is statistically typical (it happens routinely), while Supervisor B’s intervention is atypical (it rarely or never occurs). Thus, only Worker A’s omission "breaks the pattern," making it a cause. Supervisor B’s omission is part of the normal background, so it isn’t causal.  
  - **Strength**: This uses a descriptive (non-normative) notion of "typicality" to mirror the intuitive verdict.  
  - **Weakness**: Statistical typicality often derives from normative roles (e.g., Worker A’s actions are typical *because* of her duty). If typicality is purely frequency-based, it collapses in edge cases (e.g., if Worker A often forgets, her omission becomes "typical," absurdly making it non-causal). It also fails to explain why we care about typicality—without a norm, why privilege frequency over other factors? Ultimately, this response risks covertly relying on the normative structure it aims to avoid.  

  **Conclusion**  
  The norm-constrained theory delivers the intuitive verdict (only Worker A’s omission causes the breakdown) using a thin institutional norm. The counterfactual theorist’s non-normative response (e.g., statistical typicality) is unstable and may implicitly depend on norms. This suggests the selection problem for omissions cannot be fully solved without some normative element, even a minimal one.
