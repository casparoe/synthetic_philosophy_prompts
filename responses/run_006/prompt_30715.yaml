  Functional roles: one could be consummatory, like eating, and the other achievement-based, like solving a problem. Brain-wise, involve different systems—sensory vs. reward pathways. Causes: external stimulus vs. internal realization. 

  The chocolate example is sensory, involving taste buds and immediate gratification. The puzzle solution is cognitive, involving the prefrontal cortex. Different brain areas, different functions. Chocolate is about immediate pleasure, puzzle solving about accomplishment. 

  Now, checking hedonist responses. Felt-quality view: they argue for a common feel. But these two don't feel the same. Attitudinal view: both are wanted for their own sake, but that might be circular. Functional: both reinforce behavior, but the mechanisms differ. Brain state: no overlap in neural activity. 

