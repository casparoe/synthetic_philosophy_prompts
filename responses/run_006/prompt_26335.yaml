prompt: |-
  I'm taking a political philosophy course and we've been discussing egalitarianism. My friend who's not in the course got interested and went off and read some stuff online, and came back with this summary of luck egalitarianism that he's been confidently repeating to anyone who'll listen:

  "Luck egalitarianism is basically the idea that all inequalities are unjust unless they come from your own choices. If you're worse off because of brute luck — like a birth defect or a natural disaster — society has to compensate you back to equality. But if you're worse off because you took a gamble, like you quit your job to start a business and it tanked, that's on you and society doesn't owe you anything. The theory draws a bright line between brute luck (unchosen) and option luck (chosen risks), and the whole point is to figure out which inequalities the state should fix. Under this view, universal healthcare would cover congenital conditions but not smoking-related cancer, and unemployment benefits would cover layoffs but never voluntary quits. The big problem everyone agrees on is that the view is way too harsh — it basically says people who make bad choices deserve to suffer the consequences, which is why most philosophers have abandoned it in favor of relational egalitarianism."

  Something about the way he summarizes it feels off to me — especially the "deserve to suffer" part, which sounds more like a desert theory than an egalitarian one. But I don't know the view well enought to pinpoint exactly where he's getting it wrong vs. right. Could you go through his summary and give me an accuracy audit? I'd like the response in a table with these columns: "Claim in summary," "Accuracy (accurate / simplification / misleading / false)," "What's correct," and "What a luck egalitarian would push back on." And then after the table, a short paragraph with your overall verdict on whether the summary is fair to the view.
