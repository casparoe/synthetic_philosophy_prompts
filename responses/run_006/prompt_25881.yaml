  The rationality point (e) is particularly delicate. If religious beliefs aren't evidentiary yet aren't irrational, what epistemological category do they occupy? This needs careful framing to avoid special pleading.

  I recall Wittgenstein's language-games concept helps with (a)/(b)/(f), but his quietism might resist (d)'s truth claims. Maybe Phillips' non-realist reading could mediate this? Though the user seems to want some truth-aptness given (d).

  For the audit, I should:
