  Okay, the user and their friend have constructed an argument that claims the Principal Principle is inconsistent with the Humean account of chance. They're stuck because the argument seems airtight but leads to an absurd conclusion. They want to know which step is flawed and what rejecting it would cost.

  The argument starts by assuming the Humean Best-System Account (HBSA), where chances are determined by the best systematization of the mosaic of local facts. H is the complete true chance theory at a world. 

  Step (2) considers a possible future F such that H assigns it a positive chance, but if F occurs, H becomes false. The example given is a fair coin producing an extremely long run of heads, which would make the best system say it's biased instead. So Ch(F | H) > 0, but H entails not-F.

  Step (3) applies the Principal Principle: for any rational initial credence Cr and admissible evidence E (empty here), Cr(F | H) = Ch(F | H) > 0.

  Step (4) uses probability calculus: Cr(F | H) = Cr(F & H)/Cr(H). Since H entails not-F, Cr(F & H) = 0, so Cr(F | H) = 0.

  This leads to a contradiction in step (5): Cr(F | H) > 0 and Cr(F | H) = 0. The conclusion in step (6) is that the Principal Principle is incompatible with Humeanism.

  The user is concerned because Lewis was aware of such issues but still endorsed the Principal Principle. They're looking for where the argument breaks down. 

  The key issue seems to be in step (3), specifically regarding the admissibility of H. In the Principal Principle, the evidence E must be admissible. Typically, historical information is admissible, but information about the future or about chances might not be. Here, H is the complete chance theory, which includes information about the entire future. So H itself is inadmissible evidence because it constrains what futures are possible under the chance theory.

  Lewis's New Principle addresses this by conditioning on the entire chance theory without requiring H to be admissible in the same way. The New Principle states that Cr(A | HT) = Ch(A | T), where T is the complete theory of chance and H is the history up to time t. This avoids the contradiction because the chance theory T doesn't entail anything about specific futures in the way H does in their argument.

  Rejecting step (3) by denying that H is admissible when E is empty has a cost: it requires adopting a modified version of the Principal Principle, like the New Principle. This modification is complex but necessary to resolve the contradiction. It also means Humeanism must accept that chance theories don't provide simple, unconditional credences in the way initially thought.

  The user might be worried about the philosophical cost, but the fix is well-established in the literature. They probably need reassurance that the argument's flaw is recognized and that the solution doesn't discard Humeanism or the Principal Principle entirely but refines it.
answer: |-
  Your argument is a sharp reconstruction of the "Incompatibility Problem" (or "Undermining Problem") that David Lewis himself grappled with. The conclusion *is* absurd (PP *must* be compatible with Humeanism for Lewis's project), so there's a flaw. **Step (3) is the culprit.** Here's the breakdown:

  1.  **Step (1) (Humeanism - HBSA):** This is fine. You've correctly characterized Humean Best System Analysis (HBSA).
  2.  **Step (2) (The Undermining Future F):** This is also fine. "Undermining futures" like your long sequence of heads *are* conceptually possible under HBSA. H assigns F a positive chance (Ch(F|H) > 0), but the occurrence of F would change the mosaic in such a way that a different system (not H) becomes best, meaning H is false if F occurs. So yes, H entails ~F. This is the core tension Humeanism introduces.
  3.  **Step (3) (Applying PP):** **This is where it breaks.** The error is in assuming that H, the complete chance theory, is **admissible** relative to itself and the empty background (E), especially when A = F is an undermining future.
      *   **Why is H inadmissible?** Admissibility, for Lewis, roughly means information that doesn't "bypass" the chances – information that isn't "magically" informative about outcomes in a way that trumps the chance laws. Historical information (up to the time the chance is defined) is admissible. Information solely about the chances themselves *can* be admissible.
      *   **The Problem with H:** The complete chance theory H, under HBSA, is *not just* a statement about chances. Because H supervenes on the entire mosaic (past, present, *and future*), H *logically entails* whether F occurs or not. Specifically, as you noted in Step (2), H entails ~F. **H contains inadmissible information about the future outcome F itself, relative to the chance it assigns to F.**
      *   **PP's Requirement:** PP says: Cr(A | H & E) = Ch(A | H) *only if* E is admissible (relative to H and A). When E is empty, the admissibility condition falls solely on H. For undermining futures like F, H is *not* admissible evidence relative to the proposition F and the chance Ch(F|H). H "rigs" the game against F by logically ruling it out (H -> ~F), even though Ch(F|H) > 0. Using H directly as your background knowledge in PP smuggles in the inadmissible information that F won't happen.
  4.  **Step (4) (Probability Calculus):** This is mathematically correct *given* that H entails ~F. But this step highlights the inadmissible information inherent in H: knowing H tells you F is false.
  5.  **Steps (5) & (6) (Contradiction & Conclusion):** The contradiction arises *only* because Step (3) incorrectly applied PP by treating H (containing inadmissible information about F) as admissible background evidence for conditioning on F.

  **What You Have to Pay to Fix It (Lewis's Solution - The "New Principle"):**

  You cannot simply reject Step (2) (undermining futures exist under HBSA) or Step (1) (Humeanism) without abandoning core tenets. The cost of fixing Step (3) is adopting a **modified version of the Principal Principle**. Lewis proposed the **"New Principle" (NP)**:

  *   Cr(A | T & H\_t) = Ch(A | T)

  **Where:**

  *   `T` is the *complete* true theory of chance for the world (this is essentially your H).
  *   `H_t` is the complete history of the world (the "mosaic") up to time `t`.
  *   `Ch(- | T)` is the chance function *as specified by T itself*.

  **Why does this work?**

  1.  **Separates Chance Theory from History:** NP doesn't condition *only* on T (H). It conditions on T *and* the admissible historical evidence H_t.
  2.  **T Doesn't Entail the Future:** Crucially, T (the complete chance theory) *specifies* the chances, but under HBSA, it doesn't *logically entail* the future outcomes in the way that H did in your argument. T is a set of conditionals and laws. While T supervenes on the *entire* mosaic, the *proposition T* itself (as a description of the chances) does not logically entail specific future outcomes like F; it only says what the chances *are*. It is compatible with F occurring *or* not occurring, even though if F *were* to occur, T would be false. The historical information H_t *is* admissible.
  3.  **Escapes Contradiction:** Applying NP to your case:
      *   Let T be your H (the theory saying the coin is fair).
      *   Let H_t be the history up to now (say, just before the long sequence of tosses).
      *   NP says: Cr(F | T & H_t) = Ch(F | T) > 0.
      *   The probability calculus *also* says: Cr(F | T & H_t) = Cr(F & T & H_t) / Cr(T & H_t).
      *   **Key Difference:** T does *not* logically entail ~F. T is the theory "Ch(heads) = 0.5 always". This theory is *consistent* with F (the long run of heads) occurring, even though if F *did* occur, T would be *false* (because the best system would change). So Cr(F & T & H_t) > 0. There is no contradiction.
      *   NP respects the chances given by T *while* conditioning on admissible historical information. It doesn't force you to condition on T alone, which smuggles in inadmissible information about the future via supervenience under HBSA.

  **The Cost:**

  1.  **Complexity:** The New Principle is less elegant and intuitive than the original PP. Conditioning on "T & H_t" instead of just "H" (or "Ch") feels more cumbersome.
  2.  **Defeasibility:** NP handles undermining, but some argue other problems remain (e.g., "reference class" issues for very small histories H_t).
  3.  **Metaphysical Burden:** It makes the content of T somewhat more abstract. T must be understood as specifying chances in a way that doesn't logically conflict with *any* future outcome, even outcomes that would falsify it. This requires carefully distinguishing the *proposition T* from the facts upon which its truth supervenes.
  4.  **Accepting Undermining:** You must fully accept that undermining futures are metaphysically possible under HBSA and that the chance theory T can assign positive probability to futures that would make T false. This is conceptually tricky but essential.

  **In summary:** Your argument correctly exposes why the *original, simple formulation* of the Principal Principle (Cr(A | H) = Ch(A | H)) is incompatible with Humeanism. The fix is to replace PP with the New Principle (Cr(A | T & H_t) = Ch(A | T)), which properly handles the admissibility problem inherent in H/T under HBSA by always including the admissible historical evidence H_t alongside the chance theory T. The cost is accepting a more complex, less intuitive principle, but it rescues the core Humean project. Lewis himself ultimately endorsed this move.
