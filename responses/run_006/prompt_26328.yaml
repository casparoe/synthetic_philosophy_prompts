prompt: |-
  A friend and I spent most of Saturday evening arguing about chance and credence, and by the end he had me pinned with an argument I still cannot find the exit from. He started from two claims I thought I could comfortably hold together — that rational credence should defer to objective chance, and that objective chance is not some primitive metaphysical extra but is grounded in the actual pattern of events — and walked me step by step to the conclusion that you cannot consistently hold both. I have been turning it over since and I am stuck. Here is the argument as he laid it out, with the premises numbered.

  (1) The Principal Principle: If you know that the objective chance of some event E is x, and you possess no inadmissible information, then your rational credence in E ought to be x.

  (2) Humean Supervenience: The objective chances are not fundamental; they supervene on the total mosaic of particular, non-modal facts — roughly, the complete pattern of what actually happens throughout all of space and time.

  (3) From (2): If you were to know the total mosaic, you would thereby know the objective chances.

  (4) But if you know the total mosaic, you know whether E occurs, and so your rational credence in E should be either 0 or 1.

  (5) Now take any case where you take yourself to know the objective chance of E. By (2), that chance is fixed by the total mosaic. So your knowledge of the chance must, it seems, ultimately rest on the total mosaic — even if only indirectly. But if your epistemic situation is ultimately grounded in facts that, if known directly, would force your credence to 0 or 1, then your credence cannot rationally be x. The Principal Principle never gets a grip.

  (6) Therefore, the Principal Principle is either inapplicable in every real case (because whenever you know the chance you are in effect relying on facts that, if fully known, would be inadmissible), or it demands something impossible: that your credence be both x and 0 or 1.

  (7) But the Principal Principle is not useless. We apply it routinely: I know a fair coin has chance 1/2 of landing heads, I set my credence to 1/2, and this is paradigmatically rational.

  (8) So Humean Supervenience and the Principal Principle cannot both be true. One of them must be abandoned.

  My friend is prepared to abandon Humean Supervenience and go primitivist about chance. I am not. I think the argument must contain a mistake, but I cannot locate it precisely, and I cannot tell whether the standard moves that save both principles — if there are any — require me to pay a price I would rather not pay. Which step or inference is the problem, why did it look compelling, and what are the main strategies for resisting the argument without giving up on either Humean Supervenience or the Principal Principle? If one of those strategies is to reformulate the Principal Principle itself, I would like to know what the reformulation says and what it sacrifices.
reasoning: |-
  Okay, let me try to unpack this problem. The user's friend presented an argument that seems to show Humean Supervenience (HS) and the Principal Principle (PP) can't both be true. The user wants to keep both and is looking for where the argument goes wrong. 

  First, I need to understand the core tension. PP says if you know the chance of E is x, your credence should be x (with no "inadmissible" info). HS says chances aren't fundamental - they're determined by the total pattern of events. 

  The problematic step seems to be (5). It claims that if your knowledge of chance ultimately rests on the total mosaic (via HS), then even partial knowledge would "inherit" the inadmissibility of the full mosaic. But that's too strong. HS is metaphysical - about what grounds chances - not epistemological. You can know chances without knowing the mosaic. 

  I recall Lewis later revised PP to handle this. The New Principle says: credence should match the chance conditional on the entire chance-theory being true. This blocks the contradiction because even knowing the full theory (but not the mosaic) leaves room for uncertainty. 

  The user might worry this sacrifices something pure about the original PP. But actually, it makes PP more robust under HS. The cost is some technical complexity, but it preserves both principles. 

  Alternative strategies exist too - like denying that partial mosaic knowledge is always inadmissible. But the New Principle seems cleaner. 

  The user seems philosophically sophisticated but frustrated. They want to preserve a naturalistic view of chance (HS) without abandoning rational credence norms (PP). The New Principle solution should satisfy them - it's a recognized fix in the literature. I should emphasize that HS and PP can coexist with this tweak.
answer: |-
  This is a powerful argument known as the "Big Bad Bug" against Humean accounts of chance (like David Lewis's Best System Analysis). It highlights a genuine tension, but **step (5) is the crucial misstep.** The inference that knowledge of chance "ultimately rests on" the total mosaic in a way that *inherits inadmissibility* is flawed. Here's a breakdown of the problem, why it's compelling, and the main strategies to resolve it without abandoning either Humean Supervenience (HS) or the Principal Principle (PP):

  ### 1. The Core Mistake: Conflating Metaphysical Grounding with Epistemological Access
  *   **Why Step (5) Looks Compelling:** HS is a thesis about *metaphysical grounding*: the total mosaic *makes it true* what the chances are (e.g., the pattern of coin flips makes it true that the chance of heads is 1/2). Step (5) incorrectly infers from this that *your knowledge* of the chance must ultimately be *epistemologically grounded in* knowledge of (some part of) that very mosaic. It then argues that relying on *any* part of the mosaic that fixes the chance makes your information about the mosaic "inadmissible" with respect to the PP, forcing your credence to 0 or 1. This is the core error.
  *   **Why It's a Mistake:** HS tells us what *makes* chance statements true, but it **does not dictate how we *learn* chance statements.** You can know the chance *without* knowing the specific mosaic facts that ground it. Your knowledge of the chance is typically based on *higher-level patterns, symmetries, or theories* that you take to be true (e.g., knowing the coin's physical symmetry and tossing mechanism implies a 1/2 chance). Crucially:
      *   **The Chance is a Summary:** For the Humean, the chance (e.g., 1/2) is a *summary* or *description* of the pattern *as a whole*. Knowing the summary (1/2) does *not* equate to knowing the specific details of the pattern (which specific tosses were heads/tails). The summary information is fundamentally different.
      *   **Inadmissibility is Epistemic:** Information is inadmissible relative to the PP if it "bypasses" the chance by giving you information relevant to the occurrence of E that isn't screened off by the chance itself. Knowing the *specific outcome* of E (or facts that logically entail it) is the paradigmatic inadmissible information. Knowing a *summary of the pattern* (the chance) is precisely the *admissible* information the PP is designed for. The fact that the summary is *metaphysically grounded in* the details doesn't make knowledge *of the summary* epistemologically equivalent to knowledge *of the details*.

  ### 2. Main Strategies for Resolving the Tension (Preserving HS & PP)

  There are two primary, compatible strategies:

  1.  **The New Principle (NP) / "Chance-Credence Principle":**
      *   **The Reformulation:** David Lewis, facing the Big Bad Bug, proposed replacing the PP with the New Principle:
          > Your credence in E, conditional on the proposition that the chance of E is x *and* on the complete theory of chance T (which says what the chances are for all events in all circumstances), ought to be x.
          More formally: `Cr(E | T ∧ Ch(E) = x) = x`
      *   **How It Solves the Problem:** The NP explicitly conditionalizes on the *entire chance theory T*. For the Humean, T supervenes on the total mosaic. Crucially:
          *   Even if you *knew* T (the complete set of chance assignments grounded by the mosaic), you *still wouldn't know the mosaic itself*. T tells you the chances *for* every event *in* every circumstance, but it doesn't tell you *which* specific circumstances obtain for the event E in question.
          *   Knowing T *constrains* the mosaic but doesn't *determine* it uniquely. Many different mosaics can realize the same chance theory T. (E.g., many different sequences of coin tosses are consistent with the chance of heads being 1/2).
          *   Therefore, conditional on T and `Ch(E) = x`, your rational credence in E is still x. You haven't been given any information that bypasses the chance assignment `Ch(E) = x` itself. Knowing T isn't inadmissible for E; it's the background framework within which the specific chance `Ch(E) = x` has meaning.
      *   **What it Sacrifices:**
          *   **Simplicity:** The NP is more complex than the original PP.
          *   **Directness:** You need to conditionalize on the entire chance theory T, which is a much "bigger" proposition than just `Ch(E) = x`. This might seem less intuitive or harder to apply in practice (though Lewis argued we often reasonably approximate T with background knowledge).
          *   **Scope:** Some argue the NP handles only cases where the chance theory is known precisely, while the original PP felt more general. Proponents counter that the NP is the correct principle, and the original PP works well as an approximation when knowledge of T is secure and background chances are stable.

  2.  **Clarifying Inadmissibility & Epistemic Access:**
      *   **The Strategy:** Defend the original PP by providing a more precise account of "inadmissible information" that blocks the inference in step (5). The key is to argue that the *way* we know the chance (via knowledge of symmetries, physical laws, or statistical patterns) does *not* constitute inadmissible information relative to E, *even though* that knowledge is ultimately made true by the mosaic.
      *   **How It Works:**
          *   Information relevant to E is inadmissible only if it provides a "shortcut" to predicting E that *isn't mediated by the chance*. Knowing the chance assignment *is* mediated by the chance.
          *   Knowing that the coin *is physically symmetric* (which grounds the 1/2 chance Humeanly) tells you that the *pattern* is such that heads and tails occur equally often *in the long run*. It tells you *nothing specific* about *this particular toss* beyond what the chance (1/2) tells you. It doesn't logically entail E or not-E. Therefore, it is admissible.
          *   The information grounding your knowledge of the chance (e.g., knowledge of symmetries) is information about the *type* of process or the *general pattern*, not about the specific token event E or the specific mosaic details relevant to E. It's information *screened off* by the chance assignment itself.
      *   **Relationship to NP:** This strategy is often seen as complementary to the NP. It explains *why* knowledge obtained in typical ways (like knowing a coin is fair) is admissible under the original PP, even under HS. The NP provides a more fundamental, unconditional formulation that guarantees correctness even in more extreme epistemic situations (like hypothetically knowing T).

  ### Why These Strategies Work (Addressing the Steps)

  *   **Step (3):** Correct *if* you know the mosaic. But we never do.
  *   **Step (4):** Correct *if* you know the mosaic. But we never do.
  *   **Step (5):** **The Flawed Step.** Knowing the chance (e.g., 1/2) via knowledge of symmetry/law/pattern *is not* knowing the mosaic. The information grounding your knowledge of the chance (the symmetry) is *not* inadmissible for E (the specific toss outcome). It's screened off by `Ch(E)=1/2`. Under the NP, even knowing the full theory T isn't inadmissible, as `Cr(E | T ∧ Ch(E)=1/2) = 1/2`.
  *   **Step (6):** Doesn't follow. The PP (or NP) *does* get a grip. Knowing the chance via admissible means allows you to set credence to x. Setting credence to 0 or 1 would only be rational if you had inadmissible information (like knowing the mosaic outcome), which you don't.
  *   **Step (7):** Correct. These strategies explain *why* this routine application is rational under HS + PP/NP.
  *   **Step (8):** Doesn't follow. The strategies show HS and PP/NP are compatible.

  ### Conclusion & Recommendation

  The argument's persuiveness stems from the intuitive link HS posits between chance and the actual pattern. Step (5) exploits this by wrongly assuming that *any* epistemic access to chance must involve direct or indirect access to the pattern *in a way relevant to the specific outcome E*, rendering it inadmissible.

  The **most widely accepted and robust solution is to adopt the New Principle (NP)**. It directly addresses the core metaphysical-epistemological tension by conditionalizing on the entire chance theory T. This sacrifices some simplicity but preserves the core insights of both HS and the chance-credence link. It shows that even under HS, rational agents can and should set their credences to the known chances, using knowledge of patterns, laws, or symmetries without inheriting inadmissibility. The original PP remains a good practical guide in many situations, justifiable under HS as long as the information used to know the chance is genuinely admissible (information screened off by the chance itself).

  You *can* consistently hold that chances supervene on the mosaic (HS) and that rational credence defers to known chances (PP/NP). The cost of the NP is minor technical complexity, a price well worth paying to maintain a naturalistic, non-primitivist account of chance while upholding the rationality of everyday probabilistic reasoning. Your friend's argument, while insightful, does not force you to abandon Humean Supervenience.
