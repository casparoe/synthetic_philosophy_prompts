prompt: |-
  In my country's public healthcare system, a government agency decides which treatments to fund by calculating how many "quality-adjusted life years" (QALYs) each treatment would produce. A year of life in full health counts as 1 QALY; a year with a serious condition counts as a fraction of that. The agency then funds the treatments that produce the most QALYs per dollar. This seems to involve two different kinds of comparison. On the one hand, the system treats a QALY as interchangeable across people — a QALY gained by one patient counts the same as a QALY gained by another, which looks like an interpersonal comparison of well-being. On the other hand, the system assigns QALY weights by asking samples of the general public how they would rate hypothetical health states, rather than by looking at how actual patients experience those states — which looks like an attempt to avoid relying on the subjective experiences of particular individuals.

  What theory of welfare, and of interpersonal comparability, does this practice presuppose? Does it coherently combine the claim that we can compare well-being across people with the claim that we should not ask those people directly? And what would have to change in the agency's methodology if we adopted a view that interpersonal utility comparisons are impossible, or a view that only the individual's own report of their well-being is authoritative?
reasoning: |-
  Okay, the user is asking about the theoretical underpinnings of QALYs in healthcare funding. They've noticed a tension between the system's reliance on interpersonal comparisons (by treating all QALYs equally) and its avoidance of individual patient experiences (using general public surveys). 

  Hmm, this is actually quite sophisticated. The user clearly understands the practical mechanism but is probing the philosophical coherence. They might be a policy student, healthcare professional, or someone interested in ethics - their use of terms like "interpersonal comparability" suggests formal exposure to welfare economics. 

  The core tension they identified is real: QALYs implicitly assume both that well-being is comparable across people AND that we shouldn't trust individuals' self-reports about their own well-being. That's philosophically messy. 

  Let me unpack this layer by layer. First, the welfare theory: QALYs fit best with preference-satisfaction utilitarianism. The "quality adjustment" comes from societal preferences (the surveys), not hedonistic experience. But then they universalize these preferences across all patients - that's the interpersonal leap. 

  The methodology reveals deeper assumptions: (1) Well-being is measurable cardinally through QALYs, (2) These measurements are comparable across persons, (3) Society knows better than patients what constitutes "good health" for those patients. Point 3 is especially paternalistic. 

  If we took interpersonal comparability off the table (like ordinalists), the whole system collapses - you couldn't say treatment A produces "more" welfare than B across different people. If we privileged self-reports, we'd need to survey patients in each health state, but that brings methodological nightmares: adaptation effects, cognitive biases, etc. 

  The user's last question is sharp: they're asking how alternative philosophical positions would break the current model. That's the sign they really get it. I should emphasize that moving to either extreme (full comparability or radical subjectivism) would require fundamentally redesigning the system - there's no easy patch. 

  ...I wonder if they're wrestling with discomfort about the system's cold efficiency? The subtext might be ethical concern about discounting disabled lives when QALY weights are low. That's the elephant in the room with QALYs - but since they didn't raise it explicitly, I'll stick to their framing.
answer: |-
  This practice reflects a **preference-based utilitarian** theory of welfare with **cardinal interpersonal comparability**, combining societal valuation with a paternalistic distrust of individual reports. Let's break down the philosophical foundations, tensions, and alternatives:

  ### 1. **Theory of Welfare & Interpersonal Comparability Presupposed**
     - **Welfare Theory: Preference-Satisfaction Utilitarianism**  
       QALY weights are derived from *societal preferences* (public surveys) about hypothetical health states. This assumes:
       - Welfare is defined by satisfying *preferences* (what people *would choose*), not by subjective experiences (hedonic states) or objective capabilities.
       - These preferences are aggregated into a "social welfare function" (via averaging survey responses), prioritizing treatments that maximize total preference satisfaction across society.
     - **Interpersonal Comparability: Cardinal and Universal**  
       The system treats 1 QALY as identical in value regardless of who receives it. This presupposes:
       - Well-being can be measured cardinally (quantified in units).
       - These units are comparable across individuals (a QALY for a 20-year-old = a QALY for an 80-year-old).
       - **Source of Comparability:** Values come from a "veil of ignorance" (public respondents imagine themselves in any health state), allowing impartial comparisons.

  ### 2. **Coherence of Combining Interpersonal Comparison with Avoidance of Self-Reports**
     - **Why It Seems Coherent:**  
       The agency avoids relying on *actual patients* because:
       - **Adaptation Concerns:** Patients may adapt to poor health (e.g., a paraplegic reporting high well-being), "underweighting" their QALY loss from society's perspective.
       - **Cognitive Bias:** The public’s ex ante judgments (from ignorance of future health) are seen as more "rational" than patients' ex post reports.
       - **Paternalism:** Society claims authority to define "objective" welfare (e.g., severe pain *should* reduce QALYs, even if a patient tolerates it).
     - **The Tension:**  
       While claiming to respect preferences (via public surveys), the system overrides *actual* patient preferences. This creates a contradiction:
       - If welfare is preference-based, why discount the revealed preferences of those experiencing the health states?
       - The "public" is treated as an oracle of "true" preferences, but their hypothetical judgments may not reflect reality (e.g., healthy people overestimate the disutility of disability).

  ### 3. **Alternative Philosophical Views & Required Changes**
     - **View 1: Interpersonal Utility Comparisons Are Impossible**  
       (e.g., Ordinalism in welfare economics, influenced by Robbins)  
       - **Implication:** We cannot compare welfare gains across individuals. A QALY for person A ≠ a QALY for person B.  
       - **Required Changes:**  
         - Abandon QALY maximization entirely.  
         - Switch to:  
           (a) **Cost-effectiveness per patient group** (e.g., separate budgets for cancer vs. diabetes), or  
           (b) **Egalitarian rules** (e.g., fund treatments for the worst-off first), or  
           (c) **Procedural fairness** (e.g., lottery systems for contested treatments).  
       - **Outcome:** Prioritization becomes arbitrary or politically determined without interpersonal comparisons.

     - **View 2: Only Individual Self-Reports Are Authoritative**  
       (e.g., Subjective Well-Being approaches, Experientialism)  
       - **Implication:** Patients' lived experiences trump hypothetical public judgments.  
       - **Required Changes:**  
         - **Methodology Shift:** Base QALY weights on surveys of *actual patients* in each health state (e.g., "Rate your quality of life from 0–1").  
         - **Adjust for Adaptation:** Use longitudinal data tracking how self-reports change after diagnosis.  
         - **Accept Higher QALYs for Disabilities:** If patients report high well-being (e.g., with Down syndrome), their QALY weights increase, making treatments more "cost-effective."  
       - **Challenges:**  
         - Risk of undervaluing conditions with cognitive impairment (e.g., dementia patients may not report accurately).  
         - Political resistance (e.g., funding "low-priority" treatments if patients report high well-being).

  ### Key Philosophical Trade-Offs
  | **Aspect**               | **Current QALY Practice**                     | **Self-Report Alternative**               |
  |--------------------------|----------------------------------------------|------------------------------------------|
  | **Source of Values**     | General public (hypothetical)                | Actual patients (experienced)            |
  | **Welfare Definition**   | Preference-based (ex ante)                   | Experiential/subjective (ex post)        |
  | **Paternalism**          | High (society defines "good health")         | Low (individuals define their own good)  |
  | **Adaptation Handling**  | Ignored/discounted                           | Incorporated into QALY weights           |
  | **Disability Ethics**    | Risks discrimination (low weights)           | More inclusive (respects patient voice)  |

  ### Conclusion
  The QALY system presupposes **cardinal, interpersonally comparable welfare** based on aggregated societal preferences, not individual experiences. It combines interpersonal comparability with distrust of self-reports by asserting that the public’s "veil of ignorance" judgments are more objective and impartial. While coherent within its utilitarian framework, it faces criticism for paternalism and potential bias against disabled/chronically ill people.  

  If interpersonal comparisons were rejected, the system would collapse into group-specific or non-utilitarian allocation. If self-reports were authoritative, QALY weights would shift toward patient experiences, challenging societal intuitions about "severe" conditions. Both alternatives expose the current model’s core tension: **it claims to measure individual welfare while denying individuals epistemic authority over their own well-being.**
