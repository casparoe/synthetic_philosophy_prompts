  9. **Imprecise probabilism with E-admissibility/maximality (convex sets)** (from Q8A).  

  **Indistinguishable pairs**:  
  - **E-admissibility vs. maximality** (in convex and non-convex leaves) cannot be separated with these cases. A further question about *weakly dominated acts* (e.g., whether choosing a weakly dominated act is irrational) would split them: maximality forbids strict dominance; E-admissibility allows weak dominance if a prior justifies it.  
  - **Choquet vs. Dempster-Shafer** (Q6) requires an update-conditioning question.  

  **Unexplored combinations**:  
  - Non-additive (Q3B) + convex (Q5A) is incoherent: non-additivity implies violations of linear mixing (convexity).  
  - Permissive Bayesianism (Q4B) + Ellsberg preferences is irrational: no single prior justifies both Ellsberg choices.
