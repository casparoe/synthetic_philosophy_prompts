  For structure: I'll open by diagnosing why the current 3.5% is problematic, then analyze both camps' best arguments before recommending the split-rate approach. Key moves:
  - Acknowledge that observed savings behavior doesn't cleanly reveal societal PTP
  - Stress that near-zero PTP still allows growth/risk terms to anchor rates reasonably
  - Specify the risk premium should cover "statistically non-forecastable" catastrophes
  - Propose declining then flat schedule (1.8% at 100yr -> 1.5% after 300yr) to balance intergenerational equity with computability

  The tone must stay diplomatic but decisive—this group clearly respects rigor. I'll explicitly rebut the "unmoored from capital costs" worry by showing how growth/risk components maintain economic realism. And I'll emphasize that separating PTP clarifies ethical choices rather than hiding them.
answer: |-
  ## MEMORANDUM  
  **To:** Interagency Working Group on Social Discounting  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Pure Time Preference (PTP) Component for Revised Discount Rate Guidance  

  ### 1. Context & Core Conflict
  The current 3.5% real discount rate conflates distinct elements: pure time preference (PTP), the wealth effect (η·g), and an implicit risk premium. Revisions must disentangle these. While consensus exists on maintaining a wealth effect (η ~1.0-1.5) and explicitly modeling risk, the PTP component is ethically and operationally contentious.  

  *   **Camp A (PTP = 0%)** argues discounting future welfare based solely on birthdate is indefensible. They advocate a Ramsey formula with **declining long-term rates** to prevent distant generations from being effectively ignored.  
  *   **Camp B (PTP ~1%)** contends a positive PTP is essential for:  
      *   **Behavioral/Market Consistency:** Aligning with observed savings behavior and risk-free rates.  
      *   **Avoiding Hidden Assumptions:** Preventing low rates from implicitly assuming unrealistic future growth or understating risk.  
      *   **Policy Credibility:** Ensuring guidance reflects the real-world opportunity cost of capital.  

  **Camp B's strongest point deserves serious engagement:** A zero PTP *does* risk obscuring profound uncertainty and anchoring rates unrealistically low if not paired with robust, independent adjustments for risk and growth uncertainty.  

  ### 2. Recommended Approach: Near-Zero PTP + Explicit Long-Term Risk Premium + Declining-Then-Flat Schedule
  Neither a rigid 0% nor a fixed 1% PTP fully resolves the dilemma. I propose a structured compromise that upholds ethical imperatives while addressing practical concerns:  

  *   **a) Set Pure Time Preference (ρ) to 0.1%.**  
      *   **Why Near-Zero?** A rate indistinguishable from zero in most analyses satisfies the ethical imperative against arbitrary birthdate discrimination. It acknowledges future welfare matters intrinsically.  
      *   **Why Not Strictly Zero?** A token 0.1% functionally achieves the ethical goal while:  
          *   Providing a minimal buffer against computational instabilities in very long-run models.  
          *   Symbolically acknowledging *some* irreducible existential uncertainty about the far future, distinct from quantifiable risks.  
          *   Mitigating concerns about appearing entirely detached from revealed preference *without* conceding the core ethical argument.  

  *   **b) Introduce an Explicit, Separately Justified Long-Term Catastrophe Risk Premium (RP).**  
      *   **Purpose:** Directly addresses Camp B's legitimate concern that a near-zero base rate might understate tail risks. This *replaces* the implicit risk premium muddled within the current 3.5%.  
      *   **Magnitude:** Calibrate **RP = 0.4% - 0.8%** based on:  
          *   Evidence on probability and impact of global catastrophes (pandemic, climate tipping points, nuclear conflict).  
          *   Asset pricing models for very long-duration, low-probability risks.  
          *   Should be *transparently documented and periodically reviewed*, distinct from PTP or the wealth effect.  

  *   **c) Adopt a Declining-Then-Flat Ramsey Schedule.**  
      *   **Structure:**  
          *   **Years 0-100:** Apply full Ramsey formula: **r(t) = ρ + η·g(t) + RP**  
              *(ρ = 0.1%, η ≈ 1.2, g(t) = projected per capita consumption growth, RP = risk premium)*.  
          *   **Years 100-300:** Gradually decline η towards 0.8 (or equivalent decline in `g` projection) to reflect increasing uncertainty over distant growth.  
          *   **Years 300+:** Fix rate at **r(long) = ρ + RP = 0.1% + RP (0.5% - 0.9% range)**.  
      *   **Rationale:**  
          *   **Declining Rate:** Acknowledges diminishing confidence in projecting growth (`g`) and marginal utility (η) over centuries.  
          *   **Flat Floor:** Avoids rates approaching zero asymptotically (problematic for cost-benefit), anchors on the near-zero PTP + explicit risk premium, and ensures distant futures are valued meaningfully but cautiously.  

  ### 3. Proposed Central Estimate Schedule
  *   **PTP (ρ):** 0.1%  
  *   **η (Elasticity):** 1.2 (Years 0-100), declining linearly to 0.8 (Years 100-300)  
  *   **g (Projected Growth):** [Agency Consensus Projection, e.g., 1.5% near-term, declining]  
  *   **RP (Risk Premium):** 0.6% (Central estimate, subject to sensitivity analysis ±0.2%)  
  *   **Implied Rates (Illustrative):**  
      *   Year 50: ~ 0.1% + (1.2 * 1.2%) + 0.6% = **2.14%**  
      *   Year 150: ~ 0.1% + (1.0 * 0.8%) + 0.6% = **1.50%**  
      *   Year 500+: 0.1% + 0.6% = **0.7%**  

  ### 4. Why This Addresses Concerns
  *   **Camp A:** Achieves near-ethical purity on PTP (0.1%) and guarantees meaningful valuation of the long term via a flat floor (~0.7%).  
  *   **Camp B:** Retains critical links to:  
      *   **Market Realism:** Near-term rates (e.g., ~2-2.5%) align better with low-risk public borrowing costs than a strict 0% PTP would imply.  
      *   **Risk Transparency:** The explicit, justified RP directly confronts catastrophe risk instead of burying it.  
      *   **Growth Uncertainty:** The declining η/g projection explicitly models increasing doubt about distant futures.  
      *   **Computational Stability:** Avoids near-zero rates for decision-relevant horizons (next 300 years).  
  *   **Overall:** Separates ethical choice (ρ≈0), empirical uncertainty (η, g), and deep uncertainty (RP) transparently. Provides a stable long-term anchor while respecting near-term economic realities.

  **Recommendation:** Adopt a near-zero PTP (0.1%), mandate a separately documented long-term risk premium (~0.6%), and implement a declining-then-flat Ramsey schedule as outlined. This framework honors ethical obligations to the future while grounding the rate in defensible economic principles and confronting long-term risks head-on. Let's refine the specific parameters (η glide path, RP level) on Thursday.
