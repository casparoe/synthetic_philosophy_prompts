  The user questions the asymmetry. If both truth-telling and lying could lead to harm, why is only lying wrong? Kant's point hinges on the difference between causation and duty. When you tell the truth, you're not responsible for the murderer's actions. But lying makes you part of the causal chain, making you accountable for unforeseen consequences. 

  I should consider the empirical versus formal argument. The formal aspect seems stronger. Kant isn't saying trust erodes over time but that lying makes the concept of truth in declarations meaningless. Without truthful declarations, the system of rights collapses. This fits better with his deontological stance where duties are absolute regardless of consequences.

  The user also brings up whether this is about public justice or ethics. Kant's distinction between duties of justice and duties of virtue is relevant. Truthfulness here is a duty of right, enforceable by law. But his argument in this passage is both legal and ethical, as vitiating the source of right affects the foundation of both.

