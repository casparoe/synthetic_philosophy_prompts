prompt: |-
  I have been struggling with a sentence in Kant's On a Supposed Right to Lie from Philanthropy. The sentence, as I find it in the translation I am using, reads: "A lie always harms another; if not some human being, then it nevertheless does harm to humanity in general, inasmuch as it vitiates the very source of right." The surrounding passage is part of Kant's response to the murderer-at-the-door case. In the same discussion he appears to claim that truthfulness in one's declarations is a strict duty of right rather than a duty that could be weighed against benevolence, and that if you answer truthfully when a murderer asks whether his intended victim is hiding in your house, you have done nothing wrong, whereas if you lie and some unforeseen consequence follows, you are answerable for that consequence.

  What I do not understand is the precise argument behind this sentence. When Kant says a lie harms humanity in general because it vitiates the very source of right, is he making a claim about the empirical erosion of trust, or is he making a more formal point about the conditions under which any right could be instituted? And how is that supposed to connect to the asymmetry he asserts between truthfully telling the murderer where his victim is and lying? In particular, I do not see how Kant can maintain both that the truthfully given answer does no wrong and that the lie does, if both are chosen with the same benevolent intention and both may have the same fatal result. Is the passage better read as a claim about what public justice can punish, rather than about what ethics can evaluate? Or as a claim that a lie is wrong independently of consequences, while truthfulness is a perfect duty that never involves wrongdoing at all? I would like the answer to walk through the possible readings and say which one best fits the quoted sentence in context.

  When you answer, please say how confident you are in what you claim and single out the point you are least sure of. Also, please write in continuous prose only, without headings, bullet points, bold text, or tables, as you would in an email or a letter.
