prompt: |-
  I'm giving a paper next month at a workshop that's half philosophers of social science and half evolutionary game theorists. The thesis is that Lewis basically got the content of a convention right — an arbitrary but self-perpetuating equilibrium in a recurring coordination problem — but his mechanism for how conventions get started (precedent, common knowledge, a standing preference for conformity) can't do the origin work, so I add an evolutionary story where norms begin as local regularities that spread by imitation and payoff advantage and only later pick up the common-knowledge structure Lewis describes. My argument sketch: (1) set up a simple 2x2 coordination game with multiple equilibria; (2) argue that the Lewisian selection story already presupposes a history of interaction, so it can't explain the first run; (3) simulate a population under a replicator dynamic with local interaction and show a stable convention emerging without anyone representing the whole equilibrium; (4) claim the resulting regularity counts as a Lewis convention once agents form the relevant expectations; (5) conclude that the evolutionary process is the origin story and Lewis's account is the mature-state description, not the selection mechanism. The room includes two hardcore rational-choice people who think an evolutionary explanation either reduces to individual incentives or changes the subject, and a few modelers who think common knowledge is unfalsifiable and philosophers use the word norm too loosely. Give me a Q&A prep sheet: the objections I'll actually get, in roughly the order they'll come, phrased the way these people would put them, which ones have real force, what I should concede up front, the weakest part of my argument I should prepare to defend rather than hope they miss, and the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a workshop presentation where they'll present a paper critiquing David Lewis's theory of conventions and proposing an evolutionary alternative. Their audience is a mix of philosophers of social science and evolutionary game theorists, with some rational-choice purists and skeptical modelers in attendance.

  Hmm, I need to understand their core thesis first. They're arguing that Lewis correctly described what conventions *are* (arbitrary self-perpetuating equilibria) but got the origin story wrong. Lewis relied on precedent and common knowledge, which can't explain the very first coordination. Instead, they propose an evolutionary process where local behavioral regularities spread through imitation and payoff advantages, only later developing into full Lewis-style conventions.

  The user wants me to simulate the Q&A session - predicting objections in the order they'll likely come, phrasing them how these academics would speak, identifying which objections are strong, what to concede, what weak point to defend, and what question they fear most.

  Breaking this down: First, the rational-choice folks will probably attack immediately. They'll claim evolutionary explanations either reduce to individual rationality ("it's just incentives!") or change the subject entirely. Then the modelers will jump in about common knowledge being unfalsifiable. The philosophers will worry about definitions - when exactly does a regularity become a "norm"? 

  The strongest objections will likely be: 
  - The "reduction to incentives" argument (if it walks/quacks like rational choice...)
  - The definitional ambiguity about when expectations become "common knowledge"
  - Whether their model truly avoids any cognitive presuppositions

  They should concede upfront that mature conventions *do* involve common knowledge and that rational choice explanations work well for established norms. The weak spot to defend fiercely is their claim that the initial emergence requires no cognitive representations - they'll need concrete simulation details showing this.

  The nightmare question? Probably something exposing that their "local regularities" still require some baseline cognition about imitation or payoffs, which sneaks rationality back in. Or perhaps showing their model can't produce genuinely arbitrary conventions without some prior asymmetry.

  I'll structure this as a battle-tested Q&A prep sheet: opening salvos from rational-choice critics, modeler skepticism about epistemology, philosopher concerns about definitions, then deeper challenges. For each, I'll give the academic phrasing, assess its validity, and provide rebuttal strategies. The goal is to make the user feel armored but not dogmatic - ready to concede where needed but defend their core innovation.
answer: |-
  Here’s a battle-tested Q&A prep sheet tailored to your audience and argument, ordered by likely sequence and intensity of objections:

  ---

  ### **Opening Salvo (Rational-Choice Hardliners)**
  1. **Objection**: "Your 'evolutionary' story is just individual rationality in disguise. Agents imitate successful strategies because it’s payoff-maximizing. This reduces to rational choice with learning over time—you haven’t replaced Lewis, you’ve just stretched out his timeline."  
     *(Force: High)*  
     - **Concession**: Agree that payoff advantages drive imitation, but emphasize:  
       - Rational choice requires agents to *represent* equilibria and incentives. Your model shows convergence *without* agents recognizing the game structure or equilibrium concept.  
       - Lewis demands *ex ante* common knowledge of preferences/expectations; evolution works with *ex post* reinforcement.  

  2. **Objection**: "If norms start as 'local regularities,' what’s the difference between a convention and a herd behavior? Lewis’s account explains *why* we *ought* to conform—your story can’t distinguish normativity from mere habit."  
     *(Force: Medium)*  
     - **Rebuttal**: Argue that normativity emerges with expectations:  
       - "Once agents expect others to follow the regularity *and* prefer conformity conditional on those expectations, they’re in Lewis-land. Evolution bootstraps the *descriptive* pattern; rationality explains the *prescriptive* shift."  

  ---

  ### **Modeler Skepticism (Epistemology/Mechanics)**
  3. **Objection**: "Common knowledge is unfalsifiable, but so what? Lewis uses it to explain stability, not origins. Your simulation 'solves' a problem nobody has—Lewis *assumes* a history; he doesn’t explain it."  
     *(Force: Medium-High)*  
     - **Concession**: Admit Lewis isn’t *trying* to explain origins. But stress:  
       - Philosophers often misapply Lewis’s model to origins (cite examples). Your work clarifies a *distinct problem*: how conventions emerge *de novo*.  

  4. **Objection**: "Replicator dynamics are unrealistic. Who updates strategies synchronously? Why imitate neighbors? You’ve swapped Lewis’s demanding cognition for arbitrary biology."  
     *(Force: Medium)*  
     - **Defense**:  
       - Cite empirical work on social learning (e.g., Boyd & Richerson).  
       - "This is a *minimal model* showing that even simple mechanisms can converge. Add heterogeneity/aspiration learning later—the core point stands."  

  ---

  ### **Philosopher Concerns (Definitions/Scope)**
  5. **Objection**: "You call this a 'convention,' but Lewis requires *arbitrariness*. If your simulation converges to the payoff-dominant equilibrium, isn’t it just selection for efficiency?"  
     *(Force: High – **WEAKEST PART OF YOUR ARGUMENT** ⚠️)**  
     - **Prepare to defend**:  
       - Show runs where suboptimal conventions emerge (e.g., via drift/network effects).  
       - "Arbitrariness is *path-dependent*: the *same* game can settle on different equilibria under small perturbations. Mature conventions *become* arbitrary once entrenched."  

  6. **Objection**: "When exactly do 'expectations' become common knowledge? You handwave this transition—but if agents never represent the group state, how does common knowledge emerge?"  
     *(Force: High)*  
     - **Strategy**:  
       - "Common knowledge is a *post hoc rationalization* of stabilized patterns. Agents develop ‘local’ common knowledge (e.g., ‘Everyone *I interact with* does X’) first. Full common knowledge is a theorist’s gloss."  

  ---

  ### **Fusion Objections (Both Camps)**
  7. **Objection**: "Why call this 'evolutionary'? It’s just stochastic best-response with noisy information. You’ve reinvented learning theory."  
     *(Force: Medium)*  
     - **Rebuttal**:  
       - Distinguish biological evolution (reproduction) from cultural evolution (imitation). Highlight *population-level* dynamics (e.g., diffusion, drift) absent in individual learning models.  

  ---

  ### **The Nightmare Question (Pray They Don’t Ask)**
  **Q**: "Your model assumes agents recognize 'success' (payoffs) and 'neighbors.' Doesn’t this presuppose a *prior convention* for measuring success/defining social proximity? How do those emerge without circularity?"  
  - **Why it’s deadly**: It threatens to collapse your account into infinite regress or hidden rational-choice presuppositions.  
  - **Salvage Plan**:  
    - "Success can be hardwired (evolution) or perceptual (e.g., copying visibly thriving agents). ‘Neighbors’ can be spatial, not cognitive. But yes—this shows *all* models rest on primitives. Lewis’s primitives (common knowledge) are *more* demanding than mine."  

  ---

  ### **Strategic Summary**
  - **Concede Early**:  
    - Lewis explains mature conventions; you’re supplementing, not replacing him.  
    - Payoffs matter in both models—but cognition differs radically.  
  - **Defend Relentlessly**: The arbitrariness-to-efficiency transition (Objection #5). Have simulation visuals ready.  
  - **Reframe**: Position your work as *complementary*: "Evolution as the origin, Lewis as the equilibrium."  
  - **Disarm Critics**: Acknowledge hardcore rational-choice as a limiting case ("When cognition is unbounded, we recover Lewis"), but argue most real-world norms emerge "bottom-up."  

  **Final Tip**: When pressed, quote Lewis himself (*Convention*, p. 42): "Conventions may have begun as *accidents*." Your model formalizes the accident.  

  Good luck—this is a sharp crowd, but your argument is robust!
