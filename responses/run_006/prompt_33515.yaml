  Okay, the user is tackling a fascinating but tricky problem at the intersection of academic philosophy and real-world student group logistics. They're in a fourth-year moral uncertainty course but also sit on their uni's Effective Altruism committee, and they're struggling with how to evaluate "moral trade" proposals from other societies. 

  First, let's unpack their core need: they want a practical decision procedure grounded in philosophy (specifically the moral trade literature) but usable by undergrads in 30-minute meetings. The examples given—Catholic society fundraiser and animal rights society catering deal—are clearly pain points they've faced. 

  Hmm... the underlying tension here is between philosophical rigor and operational simplicity. They need to avoid both unprincipled "vibes" and paralyzing academic debates. The mention of "selling out vs reasonable pluralists" suggests internal factional conflicts too. 

  Key philosophical anchors to include:
  - Will MacAskill's ex ante Pareto principle (does the trade make everyone *expect* to be better off?)
  - Deontological constraints (are they compromising core prohibitions?)
  - Epistemic considerations (is this just moral compromise or actual uncertainty?)

  For the decision procedure, it should probably flow: 
  1. Verify it's a true moral trade (both sides genuinely value different causes)
  2. Check for red flags (coercion, deception, etc.)
  3. Assess whether the "goods" are commensurable 
  4. Evaluate if it passes the "ex ante Pareto" test
  5. Consider symbolic/slippery slope risks

  The two test cases are perfect because they stress different aspects:
  - The pro-life/global health one hits deontological boundaries (some EA members likely see abortion access as a fundamental right)
  - The vegan catering one is more about commensurability (is attendance drop equivalent to animal suffering reduction?)

  Biggest theoretical wobble: The ex ante Pareto criterion feels essential but... what if members have lexical preferences (e.g. "no abortion restrictions ever, full stop")? The procedure should flag that as a judgement call. 

  Also noting their request for British English - will replace "check" with "tick" and "organization" with "organisation" throughout. Must remember "proceeds" not "profits" for charities. 

  Confidence level: Medium-high on the framework structure, but low on whether it'll resolve their Catholic society dilemma cleanly. That one might end in a "vote with discomfort" outcome which won't please everyone. The animal rights case seems more straightforward. 

  Final thought: Should emphasize that this isn't an algorithm but a deliberation scaffold. The real value is forcing explicit discussion of the tradeoffs they're already wrestling with implicitly.
answer: |-
  Here’s a practical decision procedure for evaluating moral trade proposals, grounded in philosophical literature (primarily Will MacAskill, Toby Ord, and Jacob Barrett’s work on moral uncertainty and trade), designed for committee use in ≤30 minutes. The framework prioritises **ex-ante Pareto improvement**, **non-violation of deontic constraints**, and **pragmatic feasibility**.

  ---

  ### **Moral Trade Evaluation Checklist**  
  *(Answer sequentially; stop and reject if any "NO" before Step 4)*  

  1. **IS THIS A GENUINE MORAL TRADE?**  
     - ✔️ *Do both parties genuinely hold different moral priorities?*  
     - ✔️ *Would both parties *expect* to achieve more of their own goals via trade than alone?*  
     - 🚩 *Red flags*: Coercion, deception, or one side exploiting the other’s ignorance.  

  2. **DOES IT VIOLATE CORE CONSTRAINTS?**  
     - ✔️ *Does the trade force you to directly violate a non-negotiable principle?*  
       *(e.g., funding human rights abuses, accelerating existential risks)*.  
     - 🚩 *Key test*: "Would we feel culpable if this action directly caused harm we deem unconscionable?"  

  3. **ARE THE "GOODS" TRADABLE?**  
     - ✔️ *Are resources fungible?* (e.g., money, volunteer time).  
     - ❌ *Avoid*: Trading symbolic endorsements or legitimising harmful ideas.  
     - 🚩 *Test*: "If we describe this deal publicly, would reasonable observers see us as complicit in wrongdoing?"  

  4. **EX-ANTE PARETO TEST (PRAGMATIC):**  
     - ✔️ *After trade, will both sides likely achieve more net-good *by their own lights*?*  
     - ✔️ *Is the cost/benefit ratio clear?* (e.g., £10k for a plant-based policy vs. £5k raised for animals).  
     - ⚠️ *Uncertain?* Quantify best-guess impacts (use simple +/- scales).  

  5. **DOWNSTREAM RISKS:**  
     - ✔️ *Could this set a damaging precedent?*  
     - ✔️ *Might it fracture trust within our group or with allies?*  
     - ✔️ *Does it align with our institutional role?* (e.g., as a uni society).  

  **OUTPUT:**  
  - ✅ **ACCEPT** if all steps 1–4 are ✔️ and no major risks at Step 5.  
  - ❌ **REJECT** if any 🚩 or ❌ in Steps 1–3, or if Step 5 risks outweigh benefits.  
  - ⚖️ **VOTE** if Steps 1–4 pass but Step 5 is contested or trade-offs are ambiguous.  

  ---

  ### **Applied to Your Cases**  
  **(British English/phrasing used throughout)**  

  #### **Proposal 1: Catholic Society Joint Fundraiser**  
  *(50% Global Health / 50% Pro-Life Pregnancy Centre)*  

  1. **Genuine Trade?**  
     - ✔️ Yes. They prioritise anti-abortion work; you prioritise global health.  
     - ✔️ Both gain resources for their causes vs. acting alone.  
  2. **Core Constraints?**  
     - ❌ **NO, BUT RED FLAG**: If your members view the pregnancy centre as materially reducing reproductive rights (e.g., counselling against abortion), this may violate deontic constraints against harming autonomy. *Judgement call needed: Is this "funding harm" or "funding a service you deem suboptimal"?*  
  3. **Tradable Goods?**  
     - ✔️ Money is fungible.  
     - ❌ **RISK**: Co-branding may imply endorsement. If the centre engages in misinformation, you risk complicity.  
  4. **Ex-Ante Pareto?**  
     - ⚠️ Uncertain. Your members might value global health gains LESS than the moral cost of funding anti-abortion work.  
  5. **Downstream Risks?**  
     - ❌ High: Alienates pro-choice members; legitimises groups restricting reproductive rights. EA reputation risk.  

  **VERDICT: ❌ REJECT**  
  *Rationale*: Fails Step 2 (core constraints for many EAs) and Step 5 (reputational/social risks). *This is the answer your group may dislike—but the literature suggests trades violating deeply held principles are rarely justifiable.*  

  ---

  #### **Proposal 2: Animal Rights Society Partnership**  
  *(They help your fundraiser if you adopt plant-based catering for a year)*  

  1. **Genuine Trade?**  
     - ✔️ Yes. They prioritise animal welfare; you prioritise global health impact.  
     - ✔️ Both gain: You get more donations; they reduce animal product use.  
  2. **Core Constraints?**  
     - ✔️ No violation. Plant-based catering doesn’t inherently harm human rights.  
  3. **Tradable Goods?**  
     - ✔️ Yes (labour for policy change).  
     - ✔️ Low complicity risk—catering isn’t a symbolic endorsement of AR ideology.  
  4. **Ex-Ante Pareto?**  
     - ✔️ **YES**: Estimate:  
       - *Their gain*: ~500 meals plant-based → significant animal suffering reduction.  
       - *Your gain*: Their help boosts donations → more global health impact.  
       - *Your cost*: Potential attendance drop (but quantifiable: e.g., if 10% leave, is new funding >10% extra?).  
  5. **Downstream Risks?**  
     - ⚠️ Moderate: Some members may dislike "activist" alignment; could deter new members.  

  **VERDICT: ✅ ACCEPT**  
  *Rationale*: Clears all steps. Pragmatic, non-violating trade with net-positive expected outcomes.  

  ---

  ### **Confidence & Caveats**  
  - **Overall Confidence: 7/10**  
    Framework synthesises key criteria from MacAskill/Barrett on moral uncertainty and trade. It’s robust for "fungible goods" trades but murkier for symbolic/constraint-heavy cases.  
  - **Least Confident Step: Step 2 (Core Constraints)**  
    Philosophers debate *which* constraints are absolute (e.g., is funding anti-abortion work like funding torture?). This relies on your group’s moral intuitions—**flag this for committee debate**.  
  - **Key Judgement Calls**:  
    - What counts as "harm" (Step 2).  
    - Whether reputational risks (Step 5) outweigh Pareto gains.  
  - **British English Check**: Prioritise "organisation," "labour," "centre," "legitimise," "pragmatic," "tick/cross" for checklist.  

  ### **Why This Works**  
  - Fits in 30 mins: Focuses debate on red flags (Steps 1–3) before cost-benefit (Step 4).  
  - Grounded in EA philosophy: Avoids "vibes" by using ex-ante Pareto and deontic screens.  
  - Forces quantification: Even rough estimates ("low/moderate/high risk") improve rigour.  

  Use this, and you’ll at least replace circular arguments with structured trade-off analysis. When in doubt, default to **Step 2 → "Could we defend this to someone who shares our principles but disagrees on this issue?"**
