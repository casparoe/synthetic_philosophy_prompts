answer: |-
  Here’s a prioritization of open questions on the unilateralist's curse, balancing theoretical depth, policy urgency, and tractability, followed by reasoning for the ranking and a stance on the model-vs.-remedies debate. The focus is on **maximizing real-world impact per unit of research effort** given the 5 person-year constraint.

  ### **Higher-Level Stance**  
  **The distinction between model refinement and institutional design breaks down under scrutiny.** Effective remedies *require* more realistic models, but current models already show clear risks. The priority should be **model refinements that directly enable or invalidate institutional remedies**, avoiding purely abstract extensions. Urgent work must:  
  - Address **critical gaps in existing models** that block actionable solutions (e.g., correlated signals, dynamics).  
  - Test **robustness of proposed remedies** under realistic conditions.  
  - **Bridge formal theory with empirical tractability** (e.g., using domain case studies).  

  ---

  ### **Prioritized Research Questions (Ranked)**  
  **1. How do correlated signals (non-independence) change the curse’s severity and optimal remedies?**  
     - **Why upstream?**  
       If signals are correlated (e.g., AI labs drawing from similar publications), the curse might *worsen* (herding on false beliefs) or *weaken* (shared cautious norms). Remedies change radically:  
       - High correlation → "Diversity mandates" for decision-makers (e.g., require dissenting review).  
       - Low correlation → Information-pooling (e.g., shared risk assessments).  
     - **Tractability:**  
       - **Moderate-high.** Extend Bayesian network/game-theoretic models (e.g., Olszewski & Sandroni 2009). Use agent-based modeling for correlation structures.  
       - Needs integration with empirical data on real-world expert disagreement (e.g., climate engineering).  
     - **What would shift ranking?**  
       - **Up:** New studies showing strong signal correlation in AI/gain-of-function (e.g., via publication analysis).  
       - **Down:** Proof that independence is realistic in key domains.  

  **2. How do sequential/multi-stage decisions alter curse dynamics?**  
     - **Why upstream?**  
       Most high-stakes domains (e.g., AI deployment) involve sequential actions where early movers constrain others. This could:  
       - **Exacerbate the curse:** First-mover advantage incentivizes rushing.  
       - **Mitigate it:** Late actors learn from early mistakes.  
       Remedies depend on this: sequentiality favors "cooling-off periods" or reversible actions; irreversibility demands strict thresholds.  
     - **Tractability:**  
       - **Moderate.** Build on extensive-form game theory (e.g., preemption games) and real options theory. Case studies (e.g., ozone regulation vs. AI race dynamics) can ground models.  
     - **What would shift ranking?**  
       - **Up:** Evidence of harmful racing (e.g., AI labs accelerating timelines after competitor announcements).  
       - **Down:** Findings that actors consistently wait for proof of safety.  

  **3. Under what conditions do "deference norms" or veto powers reduce the curse without creating paralysis?**  
     - **Why upstream?**  
       Deference (e.g., "If >X% of experts object, hold off") is a leading proposal, but risks:  
       - Veto abuse by outliers.  
       - Gridlock if thresholds are too high.  
       Remedies must balance false positives vs. false negatives. Answering this directly informs:  
       - Optimal threshold design (e.g., flexible quorums based on risk level).  
       - Delegation rules (e.g., who counts as a "veto player"?).  
     - **Tractability:**  
       - **High.** Use mechanism design + behavioral experiments (e.g., simulated labs with veto power). Political philosophy on legitimate authority (e.g., Weber) provides normative guardrails.  
     - **What would shift ranking?**  
       - **Up:** Failed real-world deference (e.g., breakdown of gene-editing moratoria).  
       - **Down:** Success of nascent norms (e.g., in AI safety consortia).  

  **4. How does asymmetry in costs/benefits across actors affect remedy effectiveness?**  
     - **Why upstream?**  
       Actors face different stakes (e.g., a state funding geoengineering may bear less climate risk). This could:  
       - Invalidate symmetric models (e.g., wealthy actors ignore thresholds).  
       - Favor targeted remedies: Subsidies for restraint, liability schemes, or asymmetric voting weights.  
     - **Tractability:**  
       - **Moderate.** Incorporate asymmetric game theory (e.g., Stackelberg models). Empirical calibration via domain data (e.g., gain-of-function funding sources).  
     - **What would shift ranking?**  
       - **Up:** Evidence of high-stakes free-riding (e.g., small states pursuing risky geoengineering).  
       - **Down:** Uniform cost distributions observed in key domains.  

  **5. Which remedies are most robust to irrational or malicious actors?**  
     - **Why upstream?**  
       Existing models assume rationality/altruism, but real actors may be biased or selfish. If remedies fail under slight realism shifts, they’re useless.  
       - Example: Malicious actors could game threshold rules by stacking review boards.  
       - Forces design toward "adversarial robustness" (e.g., randomizing decision panels).  
     - **Tractability:**  
       - **Low-moderate.** Requires behavioral game theory + robustness analysis (e.g., minimax regret). Less empirically tractable—prioritize after foundational work.  
     - **What would shift ranking?**  
       - **Up:** Surge in observed bad-faith actions (e.g., corporate sabotage of AI regulations).  

  ---

  ### **Why This Ranking?**  
  1. **Correlation (#1)** and **sequentiality (#2)** are force multipliers: They reshape the curse’s very structure and determine if popular remedies backfire. Without these, institutional designs are built on sand.  
  2. **Deference norms (#3)** are the most promising near-term remedy but require immediate refinement to avoid symbolic fixes.  
  3. **Asymmetry (#4)** and **robustness (#5)** are critical for real-world application but depend on prior insights.  
  4. **Tractability sequence:** Starts with feasible theory-empirical hybrids (#1–3), then advances to harder gaps (#4–5).  

  ### **Avoided Questions & Why**  
  - **Continuous action spaces:** Less urgent—binary models capture core incentives, and remedies (e.g., thresholds) map cleanly to discrete decisions.  
  - **Pure model extensions** (e.g., exotic equilibrium concepts): Low policy relevance per effort.  
  - **Broad ethical frameworks:** Out of scope—focus on institutional mechanics, not value debates.  

  This plan leverages 5 person-years to produce **actionable theory** within 2–3 years (Q1–3) while leaving capacity for **applied testing** (e.g., simulations with policymakers). The goal: Move the curse from an abstract warning to a design toolkit for AI labs, bioethics boards, and climate governance bodies.
