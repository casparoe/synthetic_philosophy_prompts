prompt: |-
  I'm a machine learning researcher who has spent years working on AI alignment, and I've been reading the philosophical literature on pure time preference — the question of whether it is rationally defensible to care less about a future good solely because it lies further away in time. I keep noticing that the philosophers' arguments seem to have close counterparts in the vocabulary I use every day: the discount factor γ in MDPs and POMDPs, the distinction between discounting rewards during credit assignment and discounting values during planning, the fact that hyperbolic discounting leads to time inconsistency while exponential discounting does not, the way we handle non-stationary reward functions, and the standard alignment argument that we should not build agents that discount at all because the future contains vastly more moral weight than the present. But I suspect the mapping is not clean, and I want to know where it breaks.

  Restate the debate about pure time preference — specifically, the question of whether there is any rational justification for caring less about a future good merely because it is temporally distant — in the vocabulary of reinforcement learning and AI alignment, as faithfully as you can. I am fluent in that vocabulary: you can assume I know about Markov decision processes, value functions, discount factors, the difference between episodic and continuing tasks, reward shaping, time consistency and stationarity, and the standard arguments in alignment about why discounting is dangerous.

  Then give me the residue report. Which claims from the philosophical debate map cleanly onto distinctions we already make in RL? Which claims translate only if you fudge something — and what did you have to fudge? Which claims have no expression at all in the RL vocabulary? And, most importantly: is the residue a sign that the RL vocabulary is missing something important about the normative question, or is it a sign that some of the philosophers' claims are less substantive than they appear once you try to operationalise them in a framework that has to specify an objective function and actually run?

  Please write in British English, and separate what is genuinely settled — among people who know both the philosophical literature and the RL literature — from what remains actively contested. Do not present a contested view as though it were the consensus.
reasoning: |-
