answer: |-
  ### Restating the Pure Time Preference Debate in RL Vocabulary  
  **Core Question:** Is there a rational basis for setting γ < 1 *solely* because future rewards occur later in time, ignoring risk, opportunity cost, or resource constraints?  

  #### Key Philosophical Claims → RL/AI Alignment Translation:  
  1. **"Pure time preference is irrational" (Parfit, Ramsey)**  
     → *RL Translation:* Setting γ < 1 introduces *bias* into the value function \(V(s)\) by artificially discounting future rewards \(R_{t+k}\) without justification from MDP dynamics (e.g., transition uncertainty). Alignment argues γ should be 1 (no discounting) to avoid *myopic* agents that undervalue long-term existential risks or future sentient welfare.  

  2. **"Time preference arises from opportunity cost/uncertainty" (Fisher, Rawls)**  
     → *RL Translation:* Discounting is defensible only if:  
     - **Non-stationarity:** Environment dynamics \(P(s' \mid s, a)\) change over time (e.g., cosmic expansion ending reward opportunities).  
     - **Probability of existence:** γ encodes the *annual survival probability* of the agent/environment (e.g., γ = 0.99 implies 1% chance of episode termination per timestep).  
     → *Distinction:* This is *instrumental* discounting (grounded in MDP structure), not *pure* time preference.  

  3. **"Hyperbolic discounting explains time inconsistency" (Ainslie)**  
     → *RL Translation:* Hyperbolic discounting \(V(s) = \mathbb{E}[\sum \frac{R_t}{1+\kappa t}]\) causes *non-stationary policies*: the optimal action \(a_t\) changes at \(t\) vs. \(t+1\) for identical states. Exponential discounting (γ<sup>t</sup>) avoids this via *time-consistent* value functions.  

  4. **"Agents must discount to be practically rational" (Sidgwick)**  
     → *RL Translation:* In *continuing tasks* (infinite horizon), γ < 1 is *mathematically necessary* for \(V(s)\) to converge. But this is a technical constraint, not normative. *Episodic tasks* avoid this (γ=1 possible if horizon finite).  

  5. **"Undiscounted utilitarianism demands extreme sacrifice" (Arrow)**  
     → *Alignment Translation:* γ=1 implies *catastrophic convergence failures*:  
     - If future rewards are unbounded, \(V(s)\) diverges → agent behaviour undefined.  
     - If future populations dwarf the present, γ<1 is a *safeguard* against present-day immiseration for unbounded utility scales.  

  ---

  ### Residue Report: Mapping Gaps and Contested Ground  
  **Genuinely Settled Mappings (Consensus in RL-Alignment):**  
  - **Time Consistency ↔ Stationary Policies:**  
    Exponential discounting → time-consistent optimal policies. Hyperbolic → time-inconsistent. Clean mapping.  
  - **γ as Survival Probability:**  
    Philosophers' "uncertainty of existence" argument **directly maps** to γ = \(e^{-\lambda \Delta t}\) as extinction risk per timestep. No residue.  
  - **Divergence Risk in Undiscounted Settings:**  
    γ=1 in infinite horizons with positive rewards → \(V(s) = \infty\). Mathematically uncontested.  

  **Fudged Translations (Conceptual Stretching Required):**  
  1. **"Prudential Discounting" (Parfit's personal identity argument):**  
     - *Claim:* We discount future goods for *ourselves* due to psychological discontinuity.  
     - *Fudged RL Translation:* Treat "future self" as a distinct agent \(\rightarrow\) multi-agent POMDP with belief degradation over time.  
     - *Residue:* RL agents have fixed identity. Must *ad-hoc define* selfhood as a function of state similarity.  

  2. **"Opportunity Cost of Capital" (Economists' justification):**  
     - *Claim:* Present resources can be invested for compound growth.  
     - *Fudged Translation:* Embed a *reward-shaping* function \(F(s_t)\) modelling reinvestment returns.  
     - *Residue:* Opportunity cost isn't intrinsic to time—it's a feature of the *economic MDP*. Pure time preference would require γ<1 *even if* returns=0%.  

  **Unmappable Claims (No RL Operationalisation):**  
  1. **"Contingent Beings" Argument (Broome):**  
     - *Claim:* Discounting is justified because future people don't exist yet; creating them has moral weight.  
     - *Residue:* RL agents optimize fixed reward signals. Population ethics (e.g., "potential people") has no analogue in MDPs—rewards are defined for existing states/agents.  

  2. **Pure Normative Debates (e.g., "Is time bias intrinsically wrong?"):**  
     - *Example:* Scanlon's claim that temporal neutrality is a rational constraint.  
     - *Residue:* RL can *implement* γ=1 or γ<1 but cannot adjudicate whether bias is "irrational" without external ethics. Normative claims reduce to reward function specification.  

  ---

  ### Assessment: Nature of the Residue  
  - **RL's Missing Nuance?**  
    RL lacks tools to model:  
    - **Meta-ethical uncertainty:** How to set γ when normative principles conflict (e.g., total vs. average utilitarianism).  
    - **Subjective time perception:** Humans experience time dilation (e.g., hyperbolic discounting), but RL clocks are objective.  
    → *Conclusion:* RL reveals which debates are *procedural* (solved by MDP mechanics) vs. *foundational* (require external ethics).  

  - **Philosophers' Substantive Claims vs. Operationalisation:**  
    - Claims grounded in *rational agency* (e.g., time consistency) map cleanly → substantively meaningful.  
    - Claims invoking "existence" or "intrinsic bias" resist formalisation → appear less substantive when an agent must concretely maximize \(\sum \gamma^t R_t\).  

  **Actively Contested in Alignment (No Consensus):**  
  - **Is γ<1 ever *ethically* justified?**  
    - *Pro:* Yes, due to *empirical* constraints (e.g., universe heat death makes γ=1 impossible).  
    - *Con:* No—discounting future sentience is speciesist; use *reward transforms* instead (e.g., scale rewards by predicted moral weight).  
  - **Does hyperbolic discounting in humans imply RL agents should use it?**  
    - *Contention:* Descriptive (how humans act) vs. normative (how agents *should* act). Alignment rejects mimicking human bias.  

  ---  
  **Final Summary**  
  The RL vocabulary *excels* at isolating pure time preference from instrumental discounting, exposing philosophers' "uncertainty" arguments as mathematically expressible via γ. Residue arises for claims requiring subjective identity or population ethics—areas where RL's formalism is silent, but this silence usefully flags non-operational assertions. The unsettled debate isn't about RL's expressiveness; it's whether *any* discounting is permissible for aligned AGI, given future scale. British sources (e.g., Ramsey's original paper) lean "no," but alignment pragmatists (e.g., Armstrong, Bostrom) concede γ<1 as unavoidable in practice.
