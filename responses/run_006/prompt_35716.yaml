  First, I need to restate the pure time preference debate using RL terms. The core question is whether discounting future rewards merely due to temporal distance is rational. In RL, discount factors (γ) are standard, but their justification is often practical rather than normative.

  Key philosophical positions to map:
  - Derek Parfit's view: Pure time preference as irrational bias → corresponds to γ=1 in infinite horizons, but requires careful handling of convergence
  - Frank Ramsey's position: Discounting as "ethically indefensible" → aligns with AI alignment concerns about undervaluing future sentience
  - Arguments for time preference: Uncertainty, opportunity cost → map to RL concepts like non-stationarity, probability of existence

  The residue analysis should highlight:
  - Clean mappings: Time consistency ↔ stationary policies, hyperbolic discounting ↔ preference reversal
  - Fuzzy translations: "Prudential" discounting (self vs future self) doesn't cleanly map to single-agent RL
  - Unmappable concepts: Contingent being arguments and pure normative claims about intrinsic value

  Important distinctions:
  - Episodic vs continuing tasks fundamentally change how we handle discounting
  - Reward function specification vs discounting mechanism
  - Empirical vs normative claims about discounting

  The user likely wants this analysis to:
  1. Clarify theoretical foundations for their alignment work
  2. Identify potential blind spots in RL frameworks
  3. Assess whether philosophical debates offer actionable insights for AI design

  I should be careful to:
