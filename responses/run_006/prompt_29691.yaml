answer: |-
  This is a beautifully observed and fundamental problem in collective decision-making! You've described a classic phenomenon with an established name and significant literature. Here's a breakdown:

  1.  **The Name:**
      *   **Doctrinal Paradox (or Doctrinal Dilemma):** This is the most common and specific term for the situation you describe, especially in legal contexts. It highlights the conflict between the legal doctrine (the rule requiring both conditions) and the outcome of the vote aggregation.
      *   **Discursive Dilemma:** This is a broader, more general term coined by social choice theorists (notably Christian List and Philip Pettit). It encompasses the Doctrinal Paradox but also applies to any situation where collective judgments on interconnected propositions lead to inconsistency, even outside strict legal rules (e.g., hiring criteria). It emphasizes the problem of aggregating judgments (beliefs/reasons) rather than just preferences.
      *   **Conjunction Paradox:** This term focuses on the specific logical structure: the group collectively affirms the premises (conjuncts) but denies the conclusion (the conjunction).

  2.  **The Core Problem:**
      You've nailed it. The issue arises because **majority voting applied issue-by-issue does not guarantee logical consistency in the collective outcome**, even when every individual voter is perfectly rational and consistent. The aggregation mechanism itself is the source of the inconsistency. This highlights a deep problem in social choice theory: how to aggregate individual judgments on logically connected propositions into a coherent collective set.

  3.  **Main Positions on Resolution:**
      There's no universally agreed-upon "solution," as each approach has advantages and drawbacks. The debate centers on *how* to aggregate the votes/judgments:

      *   **Premise-Based Procedure (Issue-by-Issue Voting):**
          *   **Process:** Vote separately on each premise/fact/condition. Apply the rule to the collectively decided premises.
          *   **Pro:** Respects the group's majority view on the underlying facts/conditions. Often seen as more transparent and modular.
          *   **Con:** Leads to the paradox/inconsistency you described (as in your example: Contract Yes, Breach Yes, Liability No).
          *   **Justification:** "The rule is clear; if the group finds the facts exist, the conclusion *must* follow logically." The inconsistency is an artifact of the aggregation method, not a true logical contradiction *if* the rule is applied to the collective findings.

      *   **Conclusion-Based Procedure (Holistic Voting):**
          *   **Process:** Vote directly on the final conclusion (e.g., "Liable: Yes/No" or "Hire: Yes/No") without voting on the premises. Alternatively, use the premise votes only *if* a conclusion vote is tied.
          *   **Pro:** Avoids the logical inconsistency. The group's decision on the outcome is clear and direct.
          *   **Con:** Ignores the group's majority view on the underlying reasons/premises (e.g., in your example, the group *would* find liability if voting only on liability, 2-1 against). Can feel arbitrary or mask the reasons for the decision. Doesn't provide guidance on *why* the conclusion was reached.
          *   **Justification:** "The ultimate question is the conclusion. We care about whether the defendant is liable or the candidate is hired, not necessarily the exact path each judge took to get there, as long as a majority agrees on the bottom line."

      *   **Sequential Voting:**
          *   **Process:** Vote on premises in a specific order, with the outcome of one vote potentially constraining later votes or the conclusion.
          *   **Pro:** Can sometimes avoid inconsistency, depending on the order and the rule.
          *   **Con:** The outcome can be highly sensitive to the voting order (another form of agenda manipulation). Doesn't guarantee consistency or fairness. Can be procedurally complex.

      *   **Deliberation and Consensus/Re-vote:** The group discusses the inconsistency after the initial votes and attempts to reach a coherent collective judgment through discussion, potentially changing votes or finding common ground.
          *   **Pro:** Can lead to a fully reasoned and consistent outcome. Respects both logic and collective will.
          *   **Con:** Time-consuming, may not always resolve the disagreement, vulnerable to group dynamics and persuasion biases.

      *   **Super-Majority or Unanimity Requirements:** For premises or the conclusion.
          *   **Pro:** Reduces the likelihood of the paradox occurring.
          *   **Con:** Makes it harder to reach *any* decision, potentially leading to gridlock. Doesn't eliminate the possibility.

  4.  **Dependence on Group Type:**
      Absolutely. The appropriate procedure often depends on the group's purpose, norms, and values:

      *   **Courts/Legal Panels:** Often strongly favor the **Premise-Based** approach. Legal reasoning heavily emphasizes applying rules to established facts. Judges are expected to reason independently on the facts and law. The "inconsistency" is seen as less problematic than overriding the majority's factual findings. Deliberation is also a key part of the process to resolve differences *before* voting. Recording dissents allows minority views on premises to be documented.
      *   **Hiring/Promotion Committees:** Tend to lean towards **Conclusion-Based** or **Deliberation**. The primary goal is reaching a decision on the candidate. While criteria are important, committees often value the "overall picture" and holistic judgment. Deliberation is crucial to discuss how criteria were met or not. Strict premise-based voting can feel overly mechanistic for complex human judgments.
      *   **Boards of Directors:** Often use **Conclusion-Based** voting on major decisions (e.g., "Approve the merger?") but might delve into premise-based voting on specific aspects during deliberation. Efficiency and clear accountability for the final decision are priorities.
      *   **Legislatures:** Primarily use **Conclusion-Based** voting on bills (Yea/Nay). While debates involve premises/reasons, the final vote is on the entire package. Amendment processes allow for premise-based voting on specific parts *before* the final vote.
      *   **Faculty Curriculum Committees:** Can vary. May use **Premise-Based** for specific requirements within a proposal but **Conclusion-Based** for adopting the whole change. **Deliberation** is often extensive.

  **In Summary:**

  You've identified the **Doctrinal Paradox** or **Discursive Dilemma**, a fundamental challenge in collective decision-making on interconnected issues. The core tension is between respecting majority views on individual premises (Premise-Based) vs. respecting the majority view on the final conclusion (Conclusion-Based). There is no perfect resolution, as each method has trade-offs between logical consistency, respect for reasons, efficiency, and procedural fairness. The best approach often depends heavily on the context and priorities of the specific group: courts prioritize factual findings and rule application, hiring committees prioritize holistic judgment, legislatures prioritize decisive action on final proposals, and all benefit from careful deliberation. The existence of this paradox reminds us that aggregating individual rationality doesn't automatically guarantee collective rationality when judgments are logically connected.
