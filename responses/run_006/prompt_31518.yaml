prompt: |-
  I'm presenting a paper next month defending Galen Strawson's Basic Argument against moral responsibility to a workshop of criminal law theorists and legal philosophers. Most of them are compatibilists who think the real questions are about the conditions of legal culpability—mens rea, duress, insanity—not the metaphysics of free will. I just got back from a long dinner with a friend who works on sentencing guidelines, and the conversation left me with a sharp sense of the resistance the argument meets from people whose starting point is the courtroom rather than the seminar room. Draft my Q&A prep sheet: the six or seven objections I'll actually get from this audience, ordered by how much damage they'd do to my case, each phrased the way a legal philosopher would put it, with a two-minute reply and a note on where the reply is weakest. Include the question I'm hoping nobody asks, and take a committed position throughout—I want to know which objections you think are genuinely dangerous and how best to handle them, not a menu of options.
