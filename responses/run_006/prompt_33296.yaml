prompt: |-
  so i was reading this behavioral econ book (don't remember which one, it was a library copy) and the author gave this summary of information cascades that i wanted to run by someone who knows the litterature:

  "An information cascade is what happens when people stop thinking for themselves and just copy the crowd. Say there are two restaurants on a street, one empty and one with a few diners. The next person assumes the busy one must be better, so they go in. The next person sees even more people there and does the same, and soon everyone's packed into one place while the other is deserted. The wild thing is that this can happen even if the first few people just picked randomly—the whole cascade is built on nothing. This is why markets fail: people herd because they're afraid of being wrong alone, and the result is bubbles, fads, and groupthink that nobody privately endorses."

  now i've read a bit about cascades on lesswrong and i know theres a distinction between rational herding (where you're correctly inferring from others' actions) and social conformity (where you're worried about looking dumb). this summary seems to mush them together? and the "markets fail" conclusion feels like a leap. but i'm not confident i can separate what's accurate from what's sloppy. can you go sentence by sentence and tell me what an actual information cascade theorist would nod at vs. wince at? and specifically, does the claim that cascades show markets are inefficient follow from the accurate parts, or is that a separate argument that needs a lot more steps?
