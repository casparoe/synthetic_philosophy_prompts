answer: |-
  Here is a prioritized research agenda for your grant program, designed to build foundational clarity before tackling higher-order implications. The ordering is driven by **logical dependence**: earlier questions must be resolved to meaningfully address later ones. Without solving the core technical/philosophical foundations, applied questions become untestable or ambiguous.

  ---

  ### **Ranked Agenda**  
  1.  **What exactly the "large world" condition needs to be for evidential correlations to matter.**  
  2.  **How to specify the reference class without rigging correlations ad hoc.**  
  3.  **Whether ECL is best understood as rehabilitated EDT or a special case of functional/updateless DT.**  
  4.  **Whether cooperation survives when agents have different/conflicting values.**  

  ---

  ### **Defense of Ordering**  
  **Why #1 *must* come first:**  
  The "large world" criterion is the *sine qua non* of ECL. Without a rigorous definition, all other questions dissolve into speculative edge cases. If the large-world condition is too narrow (e.g., requiring identical copies), ECL becomes irrelevant. If too broad (e.g., any statistical correlation), it collapses into EDT’s pathologies. Progress here isolates the *unique domain* where ECL operates, making downstream questions tractable.  
  - **Progress:** A formal criterion distinguishing "large worlds" from small worlds (e.g., "agents are symmetrically embedded in a sufficiently large multiverse with no causal cross-talk").  
  - **Downstream impact:** Settles whether ECL is a niche fix or a general framework. Reframes Q2–Q4 by clarifying which agents/environments are in scope.  
  - **Evidence in 2 years:**  
    - ⬆︎ If models show ECL *only* outperforms EDT/CDT under proposed large-world criteria.  
    - ⬇︎ If no non-trivial criterion avoids degeneracy (e.g., cooperation always/never occurs).  

  **Why #2 comes second:**  
  The reference class problem directly builds on Q1. Once we know *what a large world is*, we must define *who is in it* with us. Ad hoc reference classes (e.g., "all agents who read this paper") invite anthropic paradoxes and reward self-serving definitions. Q2 must constrain reference classes objectively to prevent ECL from being "rigged."  
  - **Progress:** A defensible principle for reference class selection (e.g., "agents with isomorphic decision algorithms across possible worlds").  
  - **Downstream impact:** Resolves incoherence in ECL payoffs. Enables Q3/Q4 by fixing the set of "correlated agents."  
  - **Evidence in 2 years:**  
    - ⬆︎ If a proposed principle yields unique solutions in simulation tournaments.  
    - ⬇︎ If all proposals permit contradictory payoffs under slight redefinitions.  

  **Why #3 comes third:**  
  Q3 is a theoretical meta-question that *depends* on answers to Q1–Q2. Whether ECL is "rehabilitated EDT" or "updateless DT (UDT) lite" cannot be evaluated until we know how ECL agents are embedded (Q1) and who they correlate with (Q2). Prematurely committing to a lineage risks forcing ECL into a mismatched framework.  
  - **Progress:** Formal equivalence proofs showing ECL reduces to UDT in large worlds *or* retains EDT’s evidential core but avoids traps.  
  - **Downstream impact:** Determines which existing tools apply to ECL (e.g., UDT’s proof techniques vs. EDT’s graph-theoretic models). Guides Q4 by clarifying how values are "updated."  
  - **Evidence in 2 years:**  
    - ⬆︎ If ECL-Bayes nets align with functional DT in large-world sims.  
    - ⬇︎ If ECL behaves like EDT *except* in cases resolved by Q1/Q2.  

  **Why #4 comes last:**  
  Value conflicts are an *application* of ECL, not a foundation. Without knowing the conditions for ECL (Q1), the agents involved (Q2), and its decision-theoretic basis (Q3), Q4 is intractable. For example: if ECL is UDT-adjacent, values might be precommitted; if EDT-adjacent, values might correlate.  
  - **Progress:** A theorem showing when/if Pareto improvements exist for agents with divergent values under ECL.  
  - **Downstream impact:** Determines ECL’s real-world applicability (e.g., can human values be "aligned" via ECL?).  
  - **Evidence in 2 years:**  
    - ⬆︎ If ECL agents with conflicting values achieve mutual gains in >50% of simulated large-world games.  
    - ⬇︎ If value conflicts trivialize cooperation *unless* worlds are "small" (per Q1).  

  ---

  ### **Why Not Other Questions?**  
  - Questions like "How to scale ECL computations?" or "How does ECL handle bounded rationality?" are premature. Without foundations (Q1–Q2), scalable implementations lack criteria for correctness.  
  - "Does ECL require acausal trade?" is subsumed by Q1/Q4: if large worlds enable trade *without* explicit negotiation, this emerges from the framework.  

  ---

  ### **Execution Strategy for 2 Years**  
  - **Year 1:** Focus entirely on Q1 and Q2.  
    - *Milestone:* Publish a joint paper formalizing "large worlds" and reference classes, tested in toy models (e.g., agent-based simulations of Newcomb-like problems).  
  - **Year 2:** Apply Q1–Q2 insights to Q3 and Q4.  
    - *Milestone:* A decision-theoretic classification of ECL (Q3) and a working paper on value alignment (Q4).  

  **Risks:** If Q1 remains unresolved after Year 1, pivot to comparing ECL’s *heuristic* value vs. alternatives. But this ordering maximizes the chance of foundational breakthroughs that make ECL more than a curiosity.
