prompt: |-
  Suppose you are advising a small grant program that can fund two researchers for two years to work on evidential cooperation in large worlds. The group has a formal background (decision theory, probability, some philosophy) and is choosing among open questions such as: what exactly the "large world" condition needs to be for evidential correlations to do real decision-theoretic work; how to specify the reference class of agents one takes oneself to be correlated with, without rigging the correlations ad hoc; whether evidential cooperation in large worlds is best understood as a rehabilitated evidential decision theory or as a special case of functional or updateless decision theory; and whether the cooperation it recommends survives when the correlated agents have different or conflicting values. Give a definite agenda: rank these (or replace them with better questions) in the order the group should tackle them, and defend the ordering. For each item, say what would count as progress, which downstream debates it would settle or reframe, and what evidence over the next two years would move it up or down the list. I want a committed prioritization with reasons, not a survey of the field; if one question should clearly come first, say so rather than hedging.
