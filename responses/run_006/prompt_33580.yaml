answer: |-
  ### Joint Statement on Wrong-Kind Reasons  
  *After a year of adversarial collaboration between the State-Given Reasons (SGR) advocate and Object-Given-Only (OGR) advocate*  

  #### **1. Agreed Claims**  
  We jointly affirm the following substantive claims. These are not merely terminological and would be rejected by slanted versions of either view:  

  1. **The Demon Case Core**: In the demon scenario (where a demon threatens punishment unless you admire him), the threat provides a decisive reason to *bring it about* that you admire the demon (e.g., via pill-taking, self-conditioning, or other means). It does not, however, make the demon admirable.  
  2. **Distinction Significance**: The object/state distinction is normatively critical. Object-given reasons are grounded in features of the object of an attitude (e.g., a demon’s cruelty or a joke’s wit). State-given reasons are grounded in consequences of holding the attitude (e.g., rewards/punishments). This distinction:  
     - Explains why the demon’s threat cannot alter the demon’s admirability.  
     - Clarifies why state-given reasons (if valid) are "wrong-kind": they bear on the *state* of holding an attitude, not the object’s properties.  
  3. **Reasons for Action vs. Attitude**: Both object-given and state-given reasons can be genuine reasons for *action* (e.g., taking a pill to induce admiration). The dispute is solely about whether state-given reasons are genuine reasons for the *attitude itself* (e.g., admiration).  
  4. **Non-Transferability**: State-given reasons (e.g., a threat) cannot create object-given reasons. For example, the demon’s threat cannot generate features that make the demon admirable.  
  5. **Attitude-Specificity**: The distinction applies uniformly to all pro-attitudes (e.g., admiration, amusement, desire) and cognitive attitudes (e.g., belief). Disagreements about belief (e.g., threatened belief) are not fundamentally different from disagreements about admiration.  
  6. **Asymmetry in Cost Cases**: In scenarios where an object is genuinely admirable but admiring it is costly (e.g., punishment), the cost does not diminish the object’s admirability. The dispute centers on whether the cost constitutes a reason *against admiration itself* or merely a reason to *avoid being in the state* of admiration.  

  #### **2. Disagreements Table**  
  Each view is stated verbatim as insisted upon by its advocate. No neutral compromise is imposed.  

  | **State-Given Reasons (SGR) Advocate’s View**                                                                                                                                 | **Object-Given-Only (OGR) Advocate’s View**                                                                                                                               |  
  |-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | "The demon’s threat provides a genuine normative reason *to admire the demon*. This is a wrong-kind reason because it does not bear on the demon’s admirability, but it is still a direct reason *for the attitude of admiration itself*." | "The demon’s threat provides *no normative reason whatsoever to admire the demon*. It only provides a reason *to bring it about that you admire him*. Reasons for an attitude must exclusively derive from features of the object." |  

  #### **3. Cruxes**  
  We identify three substantive cruxes (non-verbal disagreements where resolving one would shift at least one advocate’s view) and one verbal dispute:  

  - **Crux 1: Rational Authority of State-Given Reasons**  
    *Question*: Can state-given reasons alone make it rational to hold an attitude when there are no object-given reasons (or when object-given reasons oppose it)?  
    *Why non-verbal*: Bears on whether rationality of attitudes is governed solely by object features (OGR) or can include state-based considerations (SGR).  

  - **Crux 2: Deliberative Role of State-Given Reasons**  
    *Question*: In first-person deliberation about whether to hold an attitude (e.g., "Should I admire the demon?"), must state-given reasons be weighed as inputs to the attitude itself?  
    *Why non-verbal*: Tests whether state-given reasons function as direct normative forces in attitude-formation (SGR) or only as reasons for meta-actions (OGR).  

  - **Crux 3: Asymmetry with Belief Attitudes**  
    *Question*: Is the impermissibility of state-given reasons for belief (e.g., in threatened belief cases) evidence that such reasons are invalid for all attitudes?  
    *Why non-verbal*: If belief is shown to be fundamentally analogous to admiration, OGR must either accept state-given reasons for belief or SGR must abandon them for admiration.  

  - **Verbal Dispute: "Reason for an Attitude"**  
    *Description*: Part of the disagreement is terminological. SGR uses "reason for an attitude" broadly (including state-given). OGR uses it restrictively (object-given only).  
    *Why verbal*: Both agree state-given reasons exist (e.g., as reasons for action). The conflict arises from OGR’s stipulative definition of "reason for an attitude." Resolving terminology would not alter substantive positions but would clarify where genuine disagreement lies (Cruxes 1–3).  

  #### **4. Cases, Predictions, and Resolutions**  
  For each crux, we present a case both sides agree is relevant. Predictions are recorded in advance.  

  - **Crux 1: Rational Authority of State-Given Reasons**  
    *Case: Paid-to-Be-Amused*  
    You are offered $1 million to be amused by a blank wall for 10 seconds. You take a pill causing genuine amusement.  
    - **SGR Prediction**: You are *rational* in being amused. The reward provides a state-given reason that makes amusement fitting despite the wall’s dullness.  
    - **OGR Prediction**: You are *irrational* in being amused. Amusement is only rational if the wall is funny; the reward is a reason to *act* (take the pill), not a reason for amusement.  
    *Resolution Test*: If empirical psychology shows that such amusement feels rationally compelled (SGR) or persistently incongruous (OGR), it would shift views.  

  - **Crux 2: Deliberative Role of State-Given Reasons**  
    *Case: Demon Threat*  
    The demon threatens torture unless you admire him. You deliberate: "Should I admire him?"  
    - **SGR Prediction**: You *must* weigh the threat as a reason for admiration in deliberation (even if overridden by the demon’s unadmirability).  
    - **OGR Prediction**: The threat is *excluded* from deliberation about admiration. It is only weighed when considering actions (e.g., "Should I take a pill to admire him?").  
    *Resolution Test*: If deliberation studies show ordinary people intuitively cite the threat as a "reason to admire" (SGR) or solely as a "reason to force admiration" (OGR), it would move one side.  

  - **Crux 3: Asymmetry with Belief Attitudes**  
    *Case: Threatened Belief*  
    A demon threatens torture unless you believe 2+2=5. You know 2+2=4.  
    - **SGR Prediction**: The threat provides a *weak reason to believe 2+2=5*, outweighed by evidence.  
    - **OGR Prediction**: The threat provides *no reason to believe 2+2=5*; it only provides a reason to *cause yourself to believe* it.  
    *Resolution Test*: If epistemic norms (e.g., from philosophy of science) treat state-given reasons as categorically distinct from evidence-based reasons for belief, OGR gains ground for all attitudes.  

  - **Crux 4: Costly Admiration of a Worthy Object**  
    *Case: Persecuted Saint*  
    A genuinely admirable humanitarian (e.g., a saint) works in a tyrannical regime. Admiring her will cause the regime to imprison you.  
    - **SGR Prediction**: You have *conflicting reasons*: an object-given reason *to admire* (her admirability) and a state-given reason *against admiring* (imprisonment risk).  
    - **OGR Prediction**: You have *no reason against admiring*; the saint’s admirability gives a reason to admire. The imprisonment risk is only a reason to *prevent yourself from admiring* (e.g., avoid her).  
    *Resolution Test*: If linguistic analysis shows "I shouldn’t admire her because I’ll be jailed" is interpreted as a reason against admiration (SGR) or against being in the state (OGR), it would expose an asymmetry in how costs factor into attitudes.  

