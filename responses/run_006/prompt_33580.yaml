reasoning: |-
  We are drafting a joint statement for two philosophers who have been engaged in adversarial collaboration for a year on the "wrong kind of reasons" problem. One is a "state-given-reasons-are-real" (SGR) advocate, the other an "object-given-only" (OGR) advocate.

  The document will have four parts:

  1. **Agreed Claims**: Substantive agreements that both can endorse, including about the demon case and why the object/state distinction matters. They must be non-trivial and such that a slanted version of either side would refuse to sign.

  2. **Disagreements Table**: Each view stated in the proponent's own insisted wording.

  3. **Cruxes**: The sub-questions that are substantive (i.e., settling one would move at least one side). We separate these from merely verbal disputes. If part is about the word "reason", we note that.

  4. **Cases and Predictions**: For each crux, at least one concrete case both agree bears on it, with each side's prediction recorded. We must include:
     - The demon case (threat to admire)
     - Paid-to-be-amused case
     - Threatened-belief case
     - One more case: genuinely admirable person but admiring them is costly.

  Let's build each part.

  ---

  **Part 1: Agreed Claims**

  We need substantive agreements. Both sides agree:

  - There is a distinction between reasons that are about the object of the attitude (e.g., features of the demon) and reasons that are about the state of having the attitude (e.g., consequences of admiring the demon). 
  - The demon case: a demon threatens to punish you unless you admire him. Both agree that you have a strong reason to *bring it about* that you admire the demon (e.g., by taking a pill, or by whatever means). 
  - Both agree that the demon's threat does not make the demon admirable. The demon is not made more worthy of admiration by his threat.
  - Both agree that the distinction matters because it affects how we understand the rationality of attitudes (like admiration, belief, fear, etc.). For instance, if reasons for attitudes were only about the object, then it might be irrational to form an attitude based on state-given reasons. Conversely, if state-given reasons are genuine, then we might have to account for how they can be weighed against object-given reasons.
  - Both agree that in the demon case, the threat provides a reason to *want* to admire the demon and to *try* to bring about that admiration.
  - Both agree that if there were no distinction between object-given and state-given reasons, then we would lose an important conceptual tool for understanding why the demon's threat doesn't make the demon admirable.

  We might also add:

  - Both agree that there are cases where we can have reasons to have an attitude that are not grounded in the object's properties (like the pill case or the threatened-belief case) but they disagree on whether these are genuine reasons for the attitude itself.

  But note: the OGR person denies that the threat gives a reason *for admiration*; they say it only gives a reason to bring about admiration. The SGR person says it does give a reason for admiration. So we must be careful.

  Let me draft:

  1. We agree that in the demon case, the demon's threat provides a strong pragmatic reason to bring it about that one admires the demon, and that this reason is distinct from any reason that might be provided by the demon's own features (which, in this case, are not admirable).
  2. We agree that the demon's threat does not make the demon admirable; the demon remains unadmirable.
  3. We agree that the distinction between reasons that are about the object of an attitude (object-given) and reasons that are about the state of having the attitude (state-given) is important for understanding the structure of practical and theoretical rationality.
  4. We agree that there are cases (like being paid to be amused) where one has a state-given reason to be in a mental state but no object-given reason, and that in such cases the state-given reason does not make the object amusing (or worthy of amusement).
  5. We agree that if state-given reasons were genuine reasons for the attitude, they would have to be weighed against object-given reasons in a way that might sometimes lead to a conflict in what attitude one ought to have. Conversely, if state-given reasons are not genuine reasons for the attitude, then the attitude's rationality is solely determined by the object's features.

  These are substantive enough that a slanted version of either side would balk? 

  - The OGR side might be okay because we don't say state-given reasons are genuine for the attitude, only that they are reasons to bring about the state.
  - The SGR side might be okay because we note that if state-given reasons are genuine, they must be weighed, but we don't commit to them not being genuine.

  But wait: we have to avoid claims that one side rejects. The OGR side rejects that state-given reasons are reasons for the attitude. The SGR side affirms. So we cannot say they are reasons for the attitude in the agreement. We can only say they are reasons to bring about the state.

  So:

  1. We agree that in the demon case, the demon's threat provides a strong reason to want to have the attitude of admiration toward the demon and to take steps to cause oneself to admire the demon.
  2. We agree that the demon's threat does not make the demon admirable; the demon remains unadmirable.
  3. We agree that the distinction between reasons that are grounded in the features of the object (object-given) and reasons that are grounded in the consequences of having the attitude (state-given) is a real and important distinction for understanding the rationality of attitudes.
  4. We agree that in the paid-to-be-amused case (where you are offered money to find a dull thing amusing), the offer of money provides a reason to bring it about that you are amused by the dull thing, but does not make the dull thing amusing.
  5. We agree that the threatened-belief case (a demon threatens you unless you believe that 2+2=5) is analogous: the threat gives a reason to bring about the belief, but does not make 2+2=5 true, and does not provide evidence for that belief.

  Now, both sides can sign this. The OGR side would not want to say the threat gives a reason *for admiration* (only for bringing it about). The SGR side would not want to say that the threat gives no reason at all for admiration. But we haven't said either. We've said it gives a reason to want to have the attitude and to take steps to cause it. That is neutral: the SGR side might think that this reason to cause it is also a reason for the attitude (because they think state-given reasons are reasons for the attitude) but they can agree that it is a reason to cause it. The OGR side can agree that it is a reason to cause it without agreeing it is a reason for the attitude.

  So that should work.

  ---

  **Part 2: Disagreements Table**

  We need to state each view in the exact wording the proponent would insist on.

  For the SGR (state-given-reasons-are-real) person:

  > **State-Given-Reasons View (SGR):** The demon's threat gives you a genuine normative reason to admire the demon. This reason is a wrong-kind reason because it does not bear on the admirability of the demon, but it is nonetheless a reason for the attitude of admiration itself. 

  For the OGR (object-given-only) person:

  > **Object-Given-Only View (OGR):** The demon's threat gives you no normative reason whatsoever to admire the demon. It only gives you a reason to want to admire the demon and to cause yourself to admire the demon. Reasons for an attitude must be grounded in features of the object of that attitude.

  We might also include a more general statement:

  SGR: For any attitude that is in principle responsive to reasons, state-given reasons (reasons that concern the consequences or context of having the attitude) can be genuine reasons for that attitude.

  OGR: For any attitude, the only genuine reasons for that attitude are object-given reasons (reasons that concern the properties of the object of the attitude). State-given reasons are only reasons to bring about the attitude, not reasons for the attitude.

  But let's stick to the demon case for the table.

  ---

  **Part 3: Cruxes**

  We need to identify the substantive disagreements that are not merely verbal. We also note if part is verbal.

  Possible cruxes:

  1. **The Nature of Reasons for Attitudes**: 
     - Is the concept of a "reason for an attitude" such that it must be grounded in the object? 
     - This might be verbal in part: what do we mean by "reason for an attitude"? But it might also be substantive: what makes an attitude rational?

  2. **The Weight of State-Given Reasons in Deliberation**:
     - If state-given reasons are reasons for the attitude, then when we deliberate about whether to admire the demon, we must weigh the threat (as a reason) against the lack of admirability (as a reason against). But if they are not, then in the deliberation about admiration, only the object's features matter.

  3. **The Connection to Belief**:
     - In the threatened-belief case, the OGR view says: the threat gives no reason to believe 2+2=5. The SGR view might say: it does give a reason to believe, but it's a wrong-kind reason and is outweighed by the overwhelming evidence against. But the OGR view says: it gives no reason to believe at all.

  We must separate verbal from non-verbal.

  Verbal aspect: The word "reason". Both sides might agree that the threat gives a reason of some kind, but they disagree about whether it is a reason *for the attitude* or only *for bringing about the attitude*. But the SGR side thinks that "reason for the attitude" includes state-given reasons, while the OGR side restricts "reason for the attitude" to object-given reasons. So part of the dispute is about the extension of the term "reason for an attitude". However, there is a substantive issue: can state-given considerations ever make it rational (or irrational) to have an attitude? For example, if you have a state-given reason to admire and no object-given reason, is it irrational to admire? The OGR side might say: yes, because you have no reason from the object. The SGR side might say: no, because you have a state-given reason that can make it rational.

  So let's list the cruxes:

  Crux 1: Can state-given considerations ever make it rational to form an attitude when there are no object-given reasons (or even when there are object-given reasons against)?

  Crux 2: In deliberation about an attitude, must one consider state-given reasons as reasons bearing on the attitude itself?

  Crux 3: Is there an asymmetry between attitudes like admiration and belief? (For belief, state-given reasons are widely rejected as reasons for belief, but for admiration, the SGR view holds they can be reasons.)

  But note: the threatened-belief case is a key test.

  We also need to include the case of a genuinely admirable person but admiring them is costly (e.g., because it will cause you pain, or because others will punish you for admiring them). This might show an asymmetry: the OGR view says you have a reason to admire (because the person is admirable) but also a reason to avoid admiring (because of the costs). But the reason to avoid admiring is a reason to bring it about that you don't admire, not a reason against admiration? Or is it a reason against admiration? The OGR view would say: the cost is not a reason against admiration (because it doesn't bear on the object) but a reason to get rid of the admiration. So they might say you ought to admire (because the object is admirable) but also ought to take steps to stop admiring (because of the costs). This seems conflicted. The SGR view can say: you have a state-given reason against admiration (the cost) that weighs against the object-given reason for admiration.

  So:

  Crux 4: In the case of a genuinely admirable object but with costs associated with having the attitude, do the costs provide a reason against the attitude itself (so that one might not have all-things-considered reason to have the attitude) or only a reason to bring it about that one does not have the attitude?

  Now, for each crux, we will have a case and predictions.

  But first, let's list the cruxes:

  1. **Rationality of Attitudes without Object-Given Reasons**: Can state-given reasons alone make it rational to form an attitude? (e.g., in the paid-to-be-amused case, if you manage to be amused by the dull thing, is that rational? Or is it irrational because there's nothing amusing about it?)

  2. **Deliberative Role**: When you are deciding whether to admire the demon, should you take the threat into account as a reason bearing on the attitude of admiration? Or is it only a reason to try to bring about the attitude?

  3. **Asymmetry with Belief**: Is the case of belief different? (Both might agree that in the threatened-belief case, the threat provides no reason to believe. But the SGR view might say that it does provide a reason, just one that is massively outweighed. The OGR view says it provides no reason at all. So the question is: does the threatened-belief case show that state-given reasons are not reasons for belief? And if so, why should admiration be different?)

  4. **Costly Admiration of a Worthy Object**: If there is a genuinely admirable person, but admiring them causes you great harm, do you have a reason against admiring them? Or only a reason to avoid being in the state of admiration?

  Now, note that the verbal dispute: what is meant by "reason for an attitude"? We can say that the cruxes above are substantive and not merely verbal.

  But we might note:

  Verbal Aspect: The parties agree that the term "reason for an attitude" is sometimes used in a way that includes state-given reasons and sometimes in a way that excludes them. However, they disagree about which usage better captures the normative and deliberative role of reasons. The substantive cruxes concern whether state-given considerations can affect the rationality of the attitude and how they should figure in deliberation.

  ---

  **Part 4: Cases and Predictions**

  We have four cruxes and we must cover the four cases: demon, paid-to-be-amused, threatened-belief, and costly admiration of a worthy object.

  We can assign:

  - Crux 1: Paid-to-be-amused case
  - Crux 2: Demon case
  - Crux 3: Threatened-belief case
  - Crux 4: Costly admiration of a worthy object

  For each crux, we present a case, and then each side's prediction about what the case shows.

  We are to record the predictions in advance.

  **Crux 1: Rationality without Object-Given Reasons**

  *Case: Paid-to-be-amused*  
  You are offered a large sum of money to be amused by a particular dull and unfunny thing (e.g., a blank wall) for the next minute. You take a pill that causes you to be amused by the wall. Question: In that minute, are you being rational in being amused by the wall?  

  - OGR Prediction: No, you are not rational. The attitude of amusement is not fitting because the wall is not amusing. The fact that you are paid does not make the attitude rational; it only makes taking the pill rational.  
  - SGR Prediction: Yes, you are rational. The monetary reward provides a state-given reason that makes it rational to be amused by the wall, even though the wall is not inherently amusing.

  **Crux 2: Deliberative Role**

  *Case: Demon Threat*  
  A demon threatens to torture you unless you admire him. He has no admirable qualities. You are now deliberating about whether to admire him. Question: Should you, in your deliberation about admiring, take the threat into account as a reason for admiration?  

  - OGR Prediction: No. The threat is not a reason for admiration. It is only a reason to try to cause yourself to admire him. In the deliberation about admiration, only the demon's qualities matter, and they give no reason to admire.  
  - SGR Prediction: Yes. The threat is a reason for admiration (albeit of the wrong kind) and must be weighed in deliberation. However, it is outweighed by the lack of admirable qualities, so you should not admire him, but the threat is still a reason that bears on the attitude.

  **Crux 3: Asymmetry with Belief**

  *Case: Threatened Belief*  
  A demon threatens to torture you unless you believe that 2+2=5. You know that 2+2=4 and have overwhelming evidence for it. Question: Does the threat provide any reason to believe that 2+2=5?  

  - OGR Prediction: No, the threat provides no reason at all to believe that 2+2=5. It only provides a reason to cause yourself to have that belief (e.g., by taking a belief-altering pill).  
  - SGR Prediction: Yes, the threat provides a reason to believe that 2+2=5, but it is a very weak reason compared to the overwhelming evidence against it, so it is massively outweighed. Nonetheless, it is a reason for that belief.

  **Crux 4: Costly Admiration of a Worthy Object**

  *Case: Costly Admiration*  
  There is a truly admirable person (e.g., a saintly figure who has done great good). However, admiring this person is very costly for you: if you admire them, a powerful tyrant will punish you severely. Question: Do you have a reason against admiring the saint?  

  - OGR Prediction: No, you do not have a reason against admiring the saint. The saint is admirable, so you have a reason to admire. The cost (punishment) is not a reason against admiration; it is only a reason to bring it about that you do not admire (e.g., by avoiding the saint or taking a pill to suppress admiration).  
  - SGR Prediction: Yes, the threat of punishment provides a state-given reason against admiring the saint. This reason weighs against the object-given reason to admire. Therefore, you have conflicting reasons: a reason to admire (because of the saint's admirability) and a reason against admiring (because of the punishment). The all-things-considered judgment might be that you should not admire, or that you should, depending on the weights.

  Now, we have included all required cases.

