  I want the document two people who've spent a year fighting about the wrong kind of reasons problem could both sign at the end of a good-faith adverserial collaboration. One is a state-given-reasons-are-real person: the demon's threat gives you a genuine reason to admire him — a wrong-kind reason, but still a reason for that very attitude. The other is an object-given-only person: the threat gives you no reason to admire him at all, only a reason to bring it about that you admire him, and reasons for an attitude have to come from features of the object. Write their joint statement.

