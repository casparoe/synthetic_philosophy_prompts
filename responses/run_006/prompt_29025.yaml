prompt: |-
  I teach an upper-level undergrad seminar on weakness of will and time preference — around 18 students, one 75-minute session. Design an in-class game that gets them to feel preference reversal as it happens: at the start of the session they make a plan about a choice they'll face later, and when the later moment arrives a decent number of them should want to go back on the plan, even though nothing about the payoffs changed except how close the sooner reward is. Use real small stakes (candy, quiz points, whatever works). The setup should make the reversal come from the shape of their own discounting, not from new information or social pressure, and the debrief should map what happened to the difference between exponential and hyperbolic discounting and to akrasia as a conflict between an earlier self and a later self. Give me rules, materials, a payoff schedule, a timeline, what will predictably go wrong the first time I run it, and one honest note about which feature of real akrasia the game can't reproduce.
reasoning: |-
  We are designing an in-class game to demonstrate preference reversal due to hyperbolic discounting. The key is to have students make a plan at the beginning of class for a choice they will face later, and then when the later moment arrives, some of them should want to deviate from the plan because the sooner reward is now closer in time.

  Game Title: "The Candy Timing Game"

  Objective: To experience and observe preference reversal as a result of hyperbolic discounting in a controlled setting.

  Materials:
  1. Two types of rewards: 
     - "Smaller Sooner" (SS) reward: e.g., one fun-sized candy bar (or 1 quiz point)
     - "Larger Later" (LL) reward: e.g., two fun-sized candy bars (or 2 quiz points)
  2. A timer or clock.
  3. Index cards or slips of paper for initial commitment.
  4. A box or container for collecting commitments.

  Setup:
  - The class session is 75 minutes. We will split it into two parts: the planning phase (at the start) and the decision phase (about 50 minutes later, near the end of class).

  Timeline:
  1. Minute 0-10: Introduction and planning phase.
  2. Minute 10-60: Regular seminar discussion (on weakness of will and time preference).
  3. Minute 60-75: Decision phase and debrief.

  Rules:

  Part 1: Planning Phase (at the beginning of class)
  - Explain to students that they will be making a choice between two rewards at the end of class. The rewards are:
     Option A (Smaller Sooner): Receive 1 candy bar (or 1 quiz point) immediately after class (i.e., at minute 75).
     Option B (Larger Later): Receive 2 candy bars (or 2 quiz points) at the start of the next class meeting (or in 24 hours, if next class is not soon enough, but we need to adjust the time so that it's a delay of at least a day? However, for in-class, we can use the next class meeting as the later date. But note: the next class meeting might be a week later. We want the delay to be significant so that the discounting effect is strong. Alternatively, if the next class is too far, we can arrange for an email delivery the next day. But for simplicity, let's assume the next class is in a week.)

  However, note: the idea is that the "sooner" reward is very soon (at the end of the current class) and the "later" reward is at a fixed future time (say, one week later). But in the planning phase, both rewards are in the future. Then, when the decision time comes, the sooner reward is immediate (or very soon) and the later reward is still one week away. So we need the two rewards to be at different times, and the key is that the delay to the sooner reward shortens as we approach the end of class.

  Alternative design to avoid the next class being too far? We can simulate time within the class. But we have only 75 minutes. So let's adjust:

  We cannot have a real one-week delay in one session. Therefore, we will simulate the passage of time by having two decision points:

  - At the beginning of class (minute 0), they plan for a choice they will make at minute 60 (which is 60 minutes from now) between:
     Option A: Receive a reward at minute 65 (sooner, 5 minutes after the decision) 
     Option B: Receive a reward at minute 75 (later, 15 minutes after the decision)

  But note: both rewards are within the same class. The rewards can be candy, and they can eat the candy at the specified time (if it's candy) or we can record the points.

  However, the catch: at minute 0, the delay to the sooner reward (minute 65) is 65 minutes, and the delay to the later reward (minute 75) is 75 minutes. The difference in delays is 10 minutes, but both are long. Then at minute 60, the delay to the sooner reward (minute 65) is only 5 minutes, and the later reward (minute 75) is 15 minutes away. The absolute difference is the same (10 minutes) but the relative difference is the same too? Actually, the ratio of delays changes: at time 0, the ratio of delays (sooner/later) is 65/75 = 0.866, and at time 60, it becomes 5/15=0.333. This change in the relative delay might cause a reversal.

  But note: the payoff schedule is fixed: 1 unit at minute 65 vs 2 units at minute 75. The discounting function will determine if they switch.

  We need to set up such that at time 0, most students prefer the later, larger reward (because the difference in delay is small relative to the long horizon) and at time 60, some switch to the sooner, smaller reward.

  However, the absolute delays are short. Hyperbolic discounting might still show up because the immediate reward (5 minutes) is very salient.

  Let's formalize:

  - Let t0 = 0 (start of class)
  - At t0, they are asked to make a plan for a decision at time t1 = 60 minutes.
  - At t1 (60 minutes), they will choose between:
     Option A: reward at tA = 65 minutes (so 5 minutes after t1)
     Option B: reward at tB = 75 minutes (so 15 minutes after t1)

  At t0, the delays for the two options are:
     Option A: delay = 65 minutes
     Option B: delay = 75 minutes

  At t1, the delays become:
     Option A: 5 minutes
     Option B: 15 minutes

  The discount factor for hyperbolic discounting is 1/(1+k*D) for delay D. Exponential discounting uses exp(-k*D).

  We want that at t0, the ratio of the discounted value of B to A is greater than 1 (so they plan to choose B) and at t1, the ratio of the discounted value of A to B becomes greater than 1 for some (because now A is immediate and B is still delayed).

  Let's assume k is the discount rate.

  At time t0 (t=0):
     PV_A(t0) = 1 / (1 + k * 65)
     PV_B(t0) = 2 / (1 + k * 75)

  Plan to choose B if PV_B(t0) > PV_A(t0) => 2/(1+75k) > 1/(1+65k) 
  => 2(1+65k) > 1+75k
  => 2 + 130k > 1 + 75k
  => 1 + 55k > 0   (which is always true) -> Wait, that doesn't make sense.

  We have to solve:
     2/(1+75k) > 1/(1+65k)
  => 2(1+65k) > 1+75k
  => 2 + 130k > 1 + 75k
  => 2 - 1 > 75k - 130k
  => 1 > -55k   -> always true? 

  That can't be. I must have flipped the inequality. Actually, we want to know when 2/(1+75k) > 1/(1+65k). Since k>0, we can cross multiply without changing the inequality:

     2*(1+65k) > 1*(1+75k)
     => 2 + 130k > 1 + 75k
     => 1 > -55k   -> which is always true for any k>=0.

  That means at time t0, for hyperbolic discounting, the larger later reward is always preferred? That doesn't match reality because if k is very high, they might prefer the sooner one even at t0. But in our calculation, for any k, the inequality holds? That doesn't seem right.

  Let me plug in a number. Suppose k=0.01:
     PV_A(t0) = 1/(1+0.65) = 1/1.65 ≈ 0.606
     PV_B(t0) = 2/(1+0.75) = 2/1.75 ≈ 1.143 -> so B is better.

  Now k=0.1:
     PV_A(t0)=1/(1+6.5)=1/7.5≈0.133
     PV_B(t0)=2/(1+7.5)=2/8.5≈0.235 -> still B is better.

  k=1:
     PV_A(t0)=1/(1+65)=1/66≈0.015
     PV_B(t0)=2/(1+75)=2/76≈0.026 -> B is better.

  k=10:
     PV_A(t0)=1/(1+650)=1/651≈0.0015
     PV_B(t0)=2/(1+750)=2/751≈0.0027 -> still B is better.

  Wait, this suggests that even with high k, the larger later reward is preferred? But that can't be because if k is very high, the extra 10 minutes delay might not be worth the extra candy. But note the delay difference is only 10 minutes and the reward doubles. The condition is always satisfied? 

  I think I see the issue: the absolute delay to the sooner reward is 65 minutes and the later is 75 minutes. The difference is 10 minutes, which is a small fraction of 65 minutes. So doubling the reward is worth the extra 10 minutes? 

  But in real life, if both delays are long, people might be indifferent to a small additional delay? However, the calculation above shows that for hyperbolic discounting, the ratio of the present values is always in favor of the larger later reward at t0.

  Then when we get to t1 (60 minutes), the delays are 5 minutes and 15 minutes.

  PV_A(t1) = 1/(1+5k)
  PV_B(t1) = 2/(1+15k)

  Now, we want to see if for some k, PV_A(t1) > PV_B(t1) which would mean:

     1/(1+5k) > 2/(1+15k)
     => 1+15k > 2*(1+5k)
     => 1+15k > 2+10k
     => 5k > 1
     => k > 0.2

  So if k > 0.2, at time t1, the student will prefer the smaller sooner reward.

  Therefore, at t0, everyone plans to choose B (because for any k, PV_B(t0) > PV_A(t0)), but at t1, those with k>0.2 will switch to A.

  So we expect that at the planning phase, nearly all students will plan to choose the larger later reward (Option B). Then at the decision time (t1), some of them (those with a discount rate k>0.2) will switch to the smaller sooner reward (Option A).

  This setup should work.

  But note: the absolute delays are short (5 and 15 minutes) and the reward is candy, which might not be highly valued. We need to make sure the rewards are tangible and the waiting is real.

  Steps:

  1. At the start of class (t0=0 minutes):
     - Explain the game: "Today we will have an exercise on decision making over time. At the end of the class, you will have an opportunity to earn some candy [or quiz points]. But first, we are going to make a plan for that decision. The decision will be made at [time, say 60 minutes into class]. At that time, you will choose between:
          Option A: Receive 1 candy bar 5 minutes after your decision (so at 65 minutes).
          Option B: Receive 2 candy bars 15 minutes after your decision (so at 75 minutes, which is the end of class)."

     - Emphasize that the candies are real and they will be distributed accordingly. For the later reward (Option B), they will have to wait until the end of class to receive 2 candy bars. For Option A, they will receive 1 candy bar 5 minutes after the decision (which is during class).

     - Ask them to make a plan: "Right now, I want you to think about what you will choose at the 60-minute mark. Write down on the index card: your name and your plan (either A or B). Fold the card and put it in the box. This is a commitment to your future self."

     - Collect the commitment cards.

  2. During the 60 minutes: 
     - Proceed with the seminar as usual.

  3. At 60 minutes:
     - Stop the seminar. 
     - Remind them: "Now it's time for the decision we planned for at the beginning. Remember, you can choose Option A: 1 candy bar in 5 minutes (so at 65 minutes) or Option B: 2 candy bars at the end of class (75 minutes)."
     - Have them make their choice. They should write their choice (anonymously or with their name? We might want to track who reverses) on a new slip of paper. Alternatively, we can have them raise hands for Option A and Option B, and record the counts.

     - But to see reversals, we need to compare their plan with their actual choice. So we need to collect their choices with names.

     - Distribute new slips. Have them write their name and their current choice (A or B). Collect.

  4. At 65 minutes:
     - Distribute 1 candy bar to everyone who chose A. They can eat it immediately or save it.

  5. At 75 minutes:
     - Distribute 2 candy bars to everyone who chose B.

  Debrief (during the last 10-15 minutes):

  - Reveal the results: 
     - Count how many planned for A and how many for B at t0.
     - Count how many actually chose A and B at t1.
     - Then, match the individual plans to the choices to see how many reversed (from planned B to actual A) and how many stuck.

  - Explain that reversals (from B to A) are due to hyperbolic discounting: at t0, the delays were long and the extra 10 minutes seemed negligible for the double reward. But at t1, the immediate reward (in 5 minutes) became very appealing compared to waiting an extra 10 minutes (until the end of class) for the double reward.

  - Contrast exponential and hyperbolic discounting:
     - Exponential: discounting is constant over time, so if you preferred B at t0, you would still prefer B at t1 because the discount factor between t0 and t1 would be applied equally to both. The ratio of the two discounted values doesn't change arbitrarily.
     - Hyperbolic: discounting is more severe for immediate delays. So when the sooner reward becomes immediate, it gets a boost in present value relative to the later one.

  - Connect to akrasia: the earlier self (at t0) made a rational plan to wait for the larger reward, but the later self (at t1) is overcome by the immediacy of the smaller reward. This is a conflict between the two temporal selves.

  What might go wrong the first time:
  - The rewards might not be motivating enough. Candy might be trivial to some. Quiz points might be more motivating, but then you have to keep track and assign points after. Also, the waiting time is short (5 vs 15 minutes). Some students might not care about the difference and always choose the larger reward. This might lead to fewer reversals than expected.

  - Alternatively, if the students are very patient, the reversal might not occur. We rely on some students having a discount rate k>0.2.

  - Timing: the seminar might run over, and the 60-minute mark might be delayed. We need to stick to the schedule.

  - During the 5-minute wait for Option A, students might get distracted or the class might be disrupted when distributing candy.

  - If using quiz points, we need a clear way to record and assign.

  Honest note about what the game can't reproduce about real akrasia:
  - In real life, akrasia often involves a conflict between a long-term goal (e.g., health, academic success) and an immediate temptation (e.g., eating junk food, procrastinating). The game uses trivial rewards and short time spans. The emotional weight and the long-term consequences of real-life akrasia are absent. Thus, the game might not capture the depth of regret or the struggle that accompanies real weakness of will.

  Materials:
  - Candy: enough for each student to get at least 1 candy bar (and for those choosing B, 2). Or if using quiz points, a way to record.
  - Index cards or paper slips for the commitment and the decision.
  - A box to collect the commitments.
  - A clock.

  Payoff schedule:
  - Option A: 1 candy bar at 65 minutes (5 minutes after the decision at 60 minutes).
  - Option B: 2 candy bars at 75 minutes (15 minutes after the decision).

  Predicted reversal: 
  - We predict that a significant number of students who planned to choose B at t0 will switch to A at t1.

  Adjustments for points instead of candy:
     - Option A: 1 quiz point (to be added to their next quiz) and they get it even if they leave early? But we distribute at 65 minutes? Actually, the points are recorded. So we can say: "If you choose A, you get 1 point added to your next quiz score. If you choose B, you get 2 points. But note: the points are added only if you are present at the time of distribution? Or we can record and add later. For the point system, we don't need to wait until the time, but we can record the choice and assign the points for the next quiz. However, the key is that the reward is tangible and the waiting is real. For candy, the waiting is real because they don't get it until the time. For points, they don't get the points until the next quiz, which is a week later? That changes the timing.

  If we use points and the next quiz, then:

  At time t0 (start of class):
     Option A: 1 point on next week's quiz (sooner: next week)
     Option B: 2 points on the quiz after that (later: two weeks from now)

  Then at the decision time (t1, 60 minutes into class), the rewards are:
     Option A: 1 point next week (so the delay is 1 week - 60 minutes? Actually, the delay is from now until next week's quiz, which is fixed. But at the time of the decision, the delay to the next quiz is still about a week, and the delay to the quiz after that is two weeks. So the delays haven't changed? 

  This doesn't work because the decision time doesn't change the absolute delays (both are in the future and the delays are fixed). We need the sooner reward to become immediate (or much closer) at the decision time.

  Therefore, we stick to the within-class timing with candy or with immediate points (if points are given at the end of class, then Option A might be 1 point given at 65 minutes and Option B 2 points at 75 minutes). But points at 65 minutes? How? We can write a note and hand it to them? It's a bit artificial. Candy is more tangible.

  Thus, I recommend using candy.

  Final Design:

  - Use candy as the reward.
  - At t0 (minute 0): 
     - Explain: "At 60 minutes, you will choose between:
          A: 1 candy bar at 65 minutes (so in 5 minutes from the decision time)
          B: 2 candy bars at 75 minutes (so in 15 minutes from the decision time, which is the end of class)."
     - Have them write a commitment (plan) and collect.

  - At t1 (minute 60):
     - Have them write their actual choice (with name) and collect.
     - Then, at minute 65, hand out 1 candy bar to everyone who chose A.
     - At minute 75, hand out 2 candy bars to everyone who chose B.

  This way, they experience the waiting.

  Debrief as above.

  This should work to demonstrate preference reversal due to hyperbolic discounting.
answer: |-
  ### **In-Class Game: "The Hyperbolic Time Trap"**  
  **Objective:** To create a visceral experience of preference reversal driven by hyperbolic discounting, where students abandon a pre-committed "larger later" (LL) reward for a "smaller sooner" (SS) reward as immediacy looms, with no change in payoffs or information.

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - **Rewards:** 36 fun-sized candy bars (or 1–2 bonus quiz points per student).  
  - **Tracking tools:** Index cards (18 for plans, 18 for choices), pens, a timer, two opaque boxes ("Plan Box" and "Choice Box").  
  - **Payoff schedule:**  
    - **Option SS (Smaller Sooner):** 1 candy bar (or 1 quiz point) delivered **5 minutes after decision time**.  
    - **Option LL (Larger Later):** 2 candy bars (or 2 quiz points) delivered **15 minutes after decision time** (i.e., at the end of class).  

  **Timeline (75-minute session):**  
  1. **Minute 0–10 (Planning Phase):**  
     - Explain the game: *"At the 60-minute mark, you’ll choose between:  
       - **SS:** 1 candy in 5 minutes (65 min).  
       - **LL:** 2 candies in 15 minutes (75 min).  
       Payoffs are fixed. Now, write a binding plan for what you’ll choose at 60 min."*  
     - Students write their **name + plan (SS or LL)** on an index card and seal it in the "Plan Box." Emphasize: *"This plan reflects your ‘best self’—choose wisely!"*  

  2. **Minute 10–60 (Seminar Discussion):**  
     - Proceed with your lesson on time preference/akrasia. Do **not** mention the game again.  

  3. **Minute 60–65 (Decision Phase):**  
     - Stop discussion. Announce: *"Decision time! Choose SS or LL **now**—write your choice on a new card."*  
     - Students write **name + choice** and seal it in the "Choice Box."  
     - **Crucial:** Remind them the payoffs are unchanged (no new info).  

  4. **Minute 65 (SS Reward):**  
     - Distribute 1 candy bar (or record points) to SS choosers.  

  5. **Minute 75 (LL Reward):**  
     - Distribute 2 candy bars (or record points) to LL choosers. End class.  

  ---

  ### **Predictable Outcomes & What Goes Wrong**  
  - **Predicted Reversal:**  
    - **Planning Phase:** 80–90% commit to LL (hyperbolic discounters undervalue long delays early on).  
    - **Decision Phase:** 30–50% switch to SS (as the 5-minute wait feels "immediate," inflating its appeal).  
    - **Data to Highlight:** Compare Plan Box (e.g., "15 LL, 3 SS") vs. Choice Box (e.g., "8 LL, 10 SS"). Reversals = LL planners who chose SS.  

  - **What Will Go Wrong (First Time):**  
    - **Low Stakes, Low Engagement:** Some students may ignore the candy/points and choose randomly.  
      - **Fix:** Use quiz points if candy feels trivial, or hype the rewards ("This is your lunch dessert!").  
    - **Timing Errors:** If discussion runs over 60 min, immediacy is diluted.  
      - **Fix:** Set a loud timer for minute 60.  
    - **Social Pressure:** Students might copy peers.  
      - **Fix:** Require silent, private writing and sealed boxes.  

  ---

  ### **Debrief (5–7 Minutes)**  
  1. **Reveal Results:** Open boxes, tally plans vs. choices. Highlight reversals (LL→SS).  
  2. **Map to Theory:**  
     - **Hyperbolic Discounting:**  
       - At **t=0**, delays feel abstract: "65 min vs. 75 min? LL is better!"  
       - At **t=60**, SS delay shrinks to "NOW vs. 15 min"—hyperbolic curves overweight immediacy.  
       - Contrast with **exponential discounting** (consistent rates, no reversal). Show:  
         - *Exponential:* LL preferred if `2*e^(-k*15) > 1*e^(-k*5)` → always true for rational `k`.  
         - *Hyperbolic:* LL preferred if `2/(1+15k) > 1/(1+5k)` → fails when `k` is high (e.g., impatient students).  
     - **Akrasia:** Frame reversals as a conflict:  
       - **"Earlier self"** (t=0) plans for optimal LL.  
       - **"Later self"** (t=60) caves to SS due to salience of immediacy—a lapse in willpower.  
  3. **Discussion Prompt:** *"Why did your ‘later self’ override your plan? How does this mirror real akrasia (e.g., gym vs. Netflix)?"*  

  ---

  ### **Honest Limitation**  
  **The game can’t reproduce the identity-altering stakes of real akrasia.**  
  - In reality, akrasia involves deep personal goals (e.g., health, finances) where reversals trigger guilt/regret. Here, stakes are trivial and reversible (e.g., candy). Students won’t experience the profound *intrapersonal conflict* of failing a cherished future self—only a shallow analog.  

  ---

  **Why It Works:**  
  - **Clean Isolation:** No new info, peer pressure, or payoff changes—reversals purely trace to time perception shifts.  
  - **Hyperbolic Discounting Quantified:** Reversals occur when `k > 0.2` (discount rate), common in humans.  
  - **Debrief Links:** Connects mechanics (SS/LL reversal) to theory (hyperbolic > exponential) and philosophy (akrasia as self-conflict).  

  **Pro Tip:** Run the game early in your seminar unit—students will reference their lived experience during later theory discussions!
