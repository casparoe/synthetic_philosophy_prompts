  The disagreements table is crucial. Each entry needs to capture the essence without caricature. Main fault lines: what counts as a cognitive process, whether coupling equals constitution, the role of reliability in extension. For each, the crux should isolate the make-or-break issue - like whether biological continuity is necessary for cognition.

  Test cases must be designed so both sides accept their relevance. The Alzheimer's notebook example is perfect because it's Clark/Chalmers' own thought experiment. Each side's prediction reveals their fundamental assumptions - intracranialists would say recall becomes different when externalized, extended mind theorists would insist it's the same process.

