prompt: |-
  Over the course of a reading group on the Frege–Geach problem for expressivism, a colleague has defended an expressivist account of moral language and has committed herself to the following positions. (1) An atomic moral sentence such as 'Stealing is wrong' is not truth-apt, that is, not the kind of sentence that is true or false; it conventionally expresses disapproval of stealing. (2) 'Stealing is not wrong' is likewise not truth-apt, and it expresses a distinct attitude rather than the mere absence of the disapproval expressed by the unnegated sentence. (3) A conditional such as 'If stealing is wrong, then getting your little brother to steal is wrong' does not express disapproval of stealing or of the brother's act; it expresses an attitude whose content concerns the relationship between the attitudes expressed by its parts. (4) The argument from 'Stealing is wrong' and 'If stealing is wrong, then getting your little brother to steal is wrong' to 'Getting your little brother to steal is wrong' is valid, and someone who accepts the premises while denying the conclusion is thereby inconsistent. (5) 'It is not the case that stealing is wrong' and 'Stealing is not wrong' are equivalent. Next week the group will consider the sentence 'Either stealing is wrong, or the sky is blue.' Predict what she will say about whether this disjunction is truth-apt and what attitude, if any, it expresses. I am less interested in the bare prediction than in the reasoning: identify the semantic program or programs consistent with her five positions, say what each candidate program predicts about the disjunction, give your best guess with reasons, and specify a further sentence whose treatment would best discriminate among the surviving candidates. Please write your answer in continuous prose, as you would a letter, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user has presented a detailed scenario involving an expressivist account of moral language, specifically focused on the Frege-Geach problem. They want me to predict how a colleague would analyze the disjunction "Either stealing is wrong, or the sky is blue" based on her five stated positions, while emphasizing the reasoning process and suggesting a discriminating further sentence.

  First, I need to fully grasp the colleague's commitments. Her five positions outline a non-truth-apt expressivist framework where moral sentences express attitudes rather than truth values. Position (1) establishes that atomic moral sentences express disapproval; (2) clarifies that negation expresses a distinct attitude; (3) shows conditionals express higher-order attitudes about attitude relationships; (4) maintains logical validity despite non-truth-aptness; and (5) equates two forms of negation.

  The core challenge here is how expressivism handles mixed disjunctions containing both moral and descriptive components. Since "the sky is blue" is truth-apt while "stealing is wrong" isn't, this creates tension. I recall two main expressivist approaches to such embeddings: Gibbard's normative/systematic account (where disjunctions express contingency plans) and Blackburn's minimalist/quasi-realist account (using attitudinal qualifiers).

  For Gibbard's approach, the disjunction would express a complex attitude - something like "disapprove of stealing unless believing the sky is blue." This would make the disjunction non-truth-apt since it's still fundamentally attitudinal. For Blackburn's approach, the disjunction might be truth-apt if we interpret it as expressing a disjunctive attitude toward truth conditions, though this risks compromising expressivist foundations.

  Considering position (4)'s emphasis on logical validity and inconsistency, Gibbard's framework seems more consistent as it preserves non-truth-aptness across embeddings while maintaining logical relations. Position (5)'s equivalence claim also suggests a unified treatment of negation that Gibbard provides.

  My prediction leans toward the colleague adopting a Gibbard-like position: the disjunction is non-truth-apt and expresses a complex contingency attitude. To confirm this, I'd want to test with a sentence like "Either stealing is not wrong, or the sky is blue" - how she treats negation in mixed contexts would discriminate between the frameworks.

  I'm structuring this as continuous prose, maintaining an academic tone while addressing the user's focus on reasoning over bare prediction. The response will first analyze the positions, then evaluate candidate programs, make a prediction with justification, and finally propose a discriminating test sentence.
answer: |-
  My dear colleague,

  Given the fascinating commitments our mutual colleague has staked out in her expressivist defense, predicting her stance on the disjunction "Either stealing is wrong, or the sky is blue" requires careful navigation through the implications of her five positions and the available expressivist strategies for handling such mixed embeddings. Her positions clearly rule out truth-aptness for purely moral sentences and their negations (1 & 2), establish a distinct, higher-order attitude for conditionals connecting moral attitudes (3), insist on the validity of modus ponens involving these non-truth-apt elements (4), and demand equivalence between sentential and predicate negation for moral vocabulary (5). The critical challenge for any expressivist program consistent with these is accounting for complex sentences embedding both non-truth-apt (moral) and truth-apt (descriptive) components, like our disjunction, while preserving logical relations like disjunction introduction and maintaining non-truth-aptness for the moral parts.

  Two main expressivist semantic programs seem broadly consistent with her commitments thus far:

  1.  **Gibbardian Normative/Plan-Theoretic Expressivism:** This program, exemplified by Allan Gibbard's work, treats moral judgments as expressions of plans or norms. Crucially, it provides a *unified*, non-truth-conditional semantics for all sentences, including descriptive ones. Descriptive sentences express states of *belief*, while moral sentences express states of *planning* or *norm-acceptance*. Complex sentences express complex states involving both belief and plan components. Crucially, *all* sentences are non-truth-apt in the traditional sense; validity is defined in terms of consistency of the expressed mental states across contexts.
      *   **Prediction for the Disjunction:** On this view, "Either stealing is wrong, or the sky is blue" expresses a complex state of mind. It expresses *planning to disapprove of stealing or believing that the sky is blue*. It is a state of contingency planning: you are committed to disapproving of stealing *unless* you believe the sky is blue. This is a distinct, higher-order attitude, not simply the expression of disapproval or belief. Crucially, **it would *not* be truth-apt**. Its acceptance is a matter of having the right contingent plan/belief state, not representing a fact that could make it true or false.

  2.  **Blackburnian Quasi-Realism/Minimalism:** Simon Blackburn's approach often leans towards minimalism about truth for descriptive discourse while maintaining expressivism for the moral. He sometimes uses the device of "attitudinative" or "boo/hooray" operators. The key move is to treat the logical operators (like 'or') as operating on the *propositional contents* towards which attitudes are held, even though those contents aren't fundamentally representational for the moral case. Moral sentences express attitudes (*boo!* for stealing) directed towards a propositional content (that stealing is wrong). The logical form is something like H!(that p), where H! is the attitude. Operators like 'or' then combine these propositional contents (p OR q), and the attitude expressed towards the *whole* complex content depends on the context and the operator.
      *   **Prediction for the Disjunction (Plausible Quasi-Realist Version):** "Either stealing is wrong, or the sky is blue" expresses an attitude (perhaps a kind of endorsement or commitment) towards the *propositional content* [that stealing is wrong OR that the sky is blue]. Crucially, because one disjunct ("the sky is blue") *is* straightforwardly truth-apt and representational, the quasi-realist might argue that the whole disjunction *inherits* truth-aptness. The attitude expressed would be something like *endorsing the truth of the disjunction* – agreeing that at least one of these things is the case. This seems necessary to preserve the validity of disjunction introduction: if "The sky is blue" is true (and truth-apt), then "p OR the sky is blue" must also be true (and truth-apt), regardless of what 'p' is. Therefore, **it *would* be truth-apt**.

  **My Best Guess and Reasoning:**

  I strongly suspect our colleague will adopt a position akin to **Gibbard's normative/plan-theoretic expressivism** and declare that the disjunction **is *not* truth-apt**, expressing a complex contingency plan involving both disapproval and belief.

  My reasons stem primarily from the constraints imposed by positions (4) and (5), and the overall spirit of her commitments:

  1.  **Preserving Non-Truth-Aptness & Attitudinal Expression (Positions 1 & 3):** Position (3) explicitly states that the conditional expresses a distinct, higher-order attitude *about* the relationship between the attitudes of its parts, *not* disapproval of the acts mentioned. This shows a commitment to complex sentences expressing fundamentally distinct attitudes, not inheriting the attitudes of their components. Position (1) firmly denies truth-aptness to the atomic moral sentence. A Gibbardian approach extends this non-truth-aptness and distinct-attitude-expressing feature systematically to *all* complex sentences, including mixed ones. The quasi-realist move towards truth-aptness for the mixed disjunction feels like a significant concession away from core expressivism, undermining the fundamental distinction between descriptive and moral discourse that positions (1) and (2) establish. Allowing "the sky is blue" to confer truth-aptness on the whole disjunction risks making the moral content quasi-representational by association.
  2.  **Validity and Inconsistency (Position 4):** Gibbard's framework defines validity directly in terms of inconsistency in the expressed states of mind, without needing truth-aptness. Someone who accepts "Stealing is wrong" (expressing disapproval) but denies "Either stealing is wrong, or the sky is blue" (expressing the contingency plan) *would* be inconsistent on Gibbard's account: denying the disjunction means *not* planning to disapprove of stealing if one doesn't believe the sky is blue, which clashes directly with actually disapproving of stealing. The quasi-realist can also explain validity (via truth-preservation if the disjunction is truth-apt), but the Gibbardian approach does it *without* compromising the non-truth-apt status of the moral components or the disjunction itself, aligning better with the radical spirit of positions (1) and (2).
  3.  **Equivalence of Negations (Position 5):** Position (5) demands a robust treatment of negation where sentential and predicate negation are equivalent. Gibbard provides a clear account within his plan-theoretic semantics for negation as the rejection of a plan or norm. It's less clear how the quasi-realist, if they make the disjunction truth-apt, would maintain a purely expressivist, non-truth-conditional account of negation within complex moral sentences that avoids collapsing into a representational semantics.

  **Discriminating Further Sentence:**

  To definitively distinguish between these two candidate programs consistent with her prior commitments, we should ask her about the sentence:

  **"Either stealing is *not* wrong, or the sky is blue."**

  *   **Gibbardian Prediction:** This would express a complex contingency plan: *planning to tolerate stealing (or reject the norm against it) or believing the sky is blue*. Crucially, **it would *not* be truth-apt**.
  *   **Quasi-Realist/Minimalist Prediction:** This would express endorsement of the propositional content [that stealing is not wrong OR that the sky is blue]. Since "stealing is not wrong" is presumably also non-truth-apt on her view (Position 2), but "the sky is blue" is truth-apt, the quasi-realist might *still* argue the whole disjunction is truth-apt (as one disjunct is truth-apt) and expresses endorsement of its truth. Alternatively, if they treat the moral negation as inherently non-truth-apt and resist inheritance, this might force them towards the Gibbardian view for consistency. How she handles the negation *within* the disjunct and its impact on the whole sentence's status will be highly revealing.

  I look forward to a stimulating discussion next week and hearing her resolution to this classic expressivist puzzle.

