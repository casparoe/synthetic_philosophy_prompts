prompt: |-
  A piece I read in a popular science and technology magazine summarised the AI alignment distinction between 'inner alignment' and 'goal misgeneralisation' roughly as follows:

  'Inner alignment is the problem of making sure an AI actually does what we want rather than what we literally told it to do. Since neural networks are opaque, we cannot rule out that they harbour hidden goals quite different from the ones we specified. Goal misgeneralisation is related: it describes what happens when a system trained on a narrow set of tasks encounters a new situation and its performance collapses—much like a student who has only memorised practice problems and cannot handle an unfamiliar exam question.'

  Something about this feels as though it might mix up several distinct ideas, but I lack the technical background to pinpoint the errors. Could you go through the summary sentence by sentence and tell me what an alignment researcher would endorse, what they would qualify or correct, and whether the two concepts as described here have the relationship the author implies?
