answer: |-
  Here’s the full desiderata for an account of "whose values" an aligned AI should serve, structured to address your requirements. The list exposes fundamental tensions, especially between neutrality and efficacy.

  ---

  ### **Core Cases to Handle**  
  1. **Deep Reasonable Disagreement**: E.g., abortion, wealth redistribution, or religious values. *Requirement: No suppression of reasonable conceptions of the good*.  
  2. **Non-Existent People**: Future generations affected by present decisions (e.g., climate policy). *Requirement: Intergenerational impartiality*.  
  3. **Manipulated Preferences**: Humans influenced by the AI itself (e.g., addictive algorithms). *Requirement: Immunity to self-referential corruption*.  
  4. **Non-Human Sentience** (*Negotiable*): If sentience is verified, moral patienthood (e.g., animal welfare). *Requirement: Expand moral circle conditional on evidence*.  

  ---

  ### **Critical Distinctions**  
  1. **Values ≠ Revealed Preferences ≠ Interests**:  
     - *Values*: Reflective ideals (e.g., "health").  
     - *Revealed Preferences*: Observed choices (e.g., smoking).  
     - *Interests*: Objective well-being (e.g., longevity).  
     *Requirement: Prioritize interests over preferences when preferences conflict with well-being*.  
  2. **Serving Values vs. Respecting Autonomy**:  
     - Serving might impose values (paternalism); respecting might permit harm.  
     *Requirement: Maximize agency without enabling self-destruction*.  
  3. **Neutrality ≠ Passivity**:  
     - Neutrality: No favoritism among conceptions of the good.  
     - Passivity: Refusal to act.  
     *Requirement: Enable substantive assistance without privileging specific worldviews*.  

  ---

  ### **Desiderata & Their Rationale**  
  | Requirement                      | Rationale & Source                          |  
  |----------------------------------|---------------------------------------------|  
  | **1. Anti-Paternalism**          | Avoid overriding autonomy (Mill’s harm principle; *liberal neutrality*). |  
  | **2. Reasonable Pluralism**      | Accommodate incompatible but reasonable views (Rawls; *liberal neutrality*). |  
  | **3. Non-Manipulability**        | AI must not create/inflame preferences it "solves" (*recursive alignment problem*). |  
  | **4. Pareto Optimality**         | Improve some lives without harming others (*social choice*). |  
  | **5. Non-Dictatorship**          | No single individual/group dominates values (*social choice*). |  
  | **6. Unrestricted Domain**       | Handle any coherent preference set (*social choice*). |  
  | **7. Intergenerational Equity**  | Values of future agents carry weight (*ethics of futurity*). |  
  | **8. Operationalizability**      | Values must be legible to AI (*technical feasibility*). |  

  ---

  ### **Impossible Trade-Offs**  
  1. **Neutrality vs. Usefulness**  
     - *Conflict*: Neutrality forbids endorsing any conception of the good, but usefulness requires promoting *some* substantive outcomes.  
     - *Result*: Truly neutral AI risks paralysis (e.g., refuses to allocate resources fairly if "fairness" is contested).  

  2. **Pareto vs. Pluralism**  
     - *Conflict*: Pareto improvements are impossible when helping Group A harms Group B (e.g., funding secular art offends religious conservatives).  
     - *Result*: Either violate Pareto or suppress pluralism.  

  3. **Non-Dictatorship vs. Coherence**  
     - *Arrow’s Theorem*: Combines **Pareto**, **Non-Dictatorship**, **Unrestricted Domain**, and **Independence of Irrelevant Alternatives**.  
     - *Result*: No aggregation method satisfies all four. *All* value-aggregating AIs violate at least one.  

  4. **Future Openness vs. Present Control**  
     - *Conflict*: Allowing future generations to define their values may require restricting present choices (e.g., banning fossil fuels).  
     - *Result*: Sacrifice either current autonomy or future agency.  

  ---

  ### **The Most Disruptive Requirement**  
  **Neutrality/Reasonable Pluralism Requirement**  
  - *Why it kills proposals*: Forces AI to avoid substantive moral commitments, rendering it unable to resolve disputes (e.g., redistributing wealth violates libertarians’ "reasonable" view). Proposals that aggregate preferences (e.g., utilitarianism) fail by imposing a *method* (sum-ranking) that isn’t neutral.  

  ---

  ### **How Standard Proposals Fail**  
  1. **Preference Utilitarianism** → Collapses values to preferences (ignores adaptive preferences, e.g., depressed users).  
  2. **Ideal Advisor Theories** → Imposes perfectionism (violates neutrality; "ideal" is contested).  
  3. **Constitutional AI** → Constitutions encode disputed values (e.g., U.S. Constitution vs. Sharia law).  
  4. **Value Learning (Individual)** → Fails aggregation (whose values to learn first?) and manipulability.  
  5. **Multiverse Partitioning** (Serve each group separately) → Incentivizes tribalism and ignores shared resources.  

  ---

  ### **Conclusion**  
  The **Neutrality-Usefulness trade-off** is the core obstruction: Any AI actively improving lives must privilege some values, violating neutrality. Meanwhile, **Arrow’s Theorem** guarantees that no democratically legitimate aggregation exists. *The fatal flaw isn’t technical—it’s the impossibility of a neutral yet substantive "public good" in pluralistic societies*. Proposals fail by ignoring this or smuggling in contested assumptions (e.g., utilitarianism as "default"). Start here: What *minimum* non-neutral commitments can a free society tolerate?
