prompt: |-
  alright, here's what I want. people in AI safety keep saying we should align systems to human values as if that settles it, but a lot of the hard part is the political philosophy: in a free society people reasonably disagree about what a good life is, and any AI that acts for a whole public has to do something with that disagreement. before I read another proposal for aggregating everyone's values into an objective function, give me the full desiderata for an account of whose values an aligned AI should serve. for each requirement give the case or consideration behind it. I want: the cases it has to handle (deep but reasonable disagreement, people who dont exist yet, people who are being manipulated by the system itself, maybe nonhuman animals — tell me if that one's negotiable), the distinctions it can't collapse (values vs revealed preferences vs interests; serving someone's values vs respecting their autonomy; being neutral vs being useless), and which requirements are forced by liberal neutrality and which are just demands from social choice theory. then flag the pairs you think can't be jointly satisfied — like, can you be neutral between reasonable conceptions of the good and still actually help anyone in a substantive way? is there an arrow-style impossibility result hiding in the list, where pareto, non-dictatorship, unrestricted domain, and independence can't all hold? tell me which single requirement does the most to knock out the usual proposals. that part matters more to me than any scorecard. if you want, one line each on how the standard moves (preference utilitarianism, ideal advisor, constitutional AI-ish stuff, whatever) fail the list, but keep it short.
