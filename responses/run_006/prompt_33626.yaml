answer: |-
  ## Dialogue: The Assertion Norms Debate

  **Setting:** A university common room after a philosophy seminar. Coffee mugs clutter the table. **Naomi** (Knowledge Norm advocate) and **Thomas** (Truth Norm advocate) continue their discussion.

  **Naomi:** ...so that's why I think the Gettier example sinks the Truth Norm, Thomas. If Sarah *truly believes* she sees a sheep in the field because of a realistic sheep-shaped rock, and there *happens* to be a real sheep hidden behind it, her assertion "There's a sheep in the field" is *true*. But she didn't *know* it! She was just lucky. Under your norm, her assertion was perfectly proper. That feels deeply wrong. She shouldn't have asserted it with such confidence; she lacked adequate grounds.

  **Thomas:** I see why it *feels* wrong, Naomi. Luck bothers us. But the norm governs the *assertion itself* – its relationship to the world. Sarah *said* something true. The fact that her evidence was misleading isn't her fault *in that moment of assertion*. The Truth Norm focuses on the *content*: did she speak truly? Yes. The problem arose *later*, when we discovered the rock and the hidden sheep. That's when we say, "Ah, your evidence was flawed," not necessarily, "You violated the norm *by speaking*."

  **Naomi:** But consider an ordinary case. Imagine our friend Ben, rushing to catch the bus. He glances at the timetable pinned haphazardly on the board – it *says* 7:15 PM for the last bus. He tells us, "Last bus is at 7:15!" We all relax, finish our drinks. Turns out, the timetable was outdated; the last bus is actually 7:00. We missed it.

  **Thomas:** Classic. Ben asserted something false: "The last bus is at 7:15." The Truth Norm says he shouldn't have asserted that because it wasn't true. His assertion misled everyone. Fault lies *in the falsity*.

  **Naomi:** Hold on. What if Ben *knew* the timetable was often wrong, or saw it was faded and torn? He didn't *know* the bus time. He just had a belief based on shaky evidence. Under the Knowledge Norm, he *shouldn't* have asserted it as settled fact. He should have said, "I *think* it's 7:15, based on this old timetable, but we should check." The problem starts *before* the bus leaves – it starts when he asserts without knowing. The falsity is the *consequence* of asserting improperly.

  **Thomas:** But what if Ben *did* have excellent evidence? Suppose he checked the official transit app *yesterday*, and it clearly said 7:15. He asserts confidently. Unbeknownst to him, the schedule changed *this morning* due to unforeseen construction. His assertion is false. Under your norm, Naomi, Ben violated the Knowledge Norm because, tragically, he *didn't* know (due to the unexpected change). But that seems harsh! He did everything right. He was epistemically diligent. The Truth Norm simply says he asserted something false – which he did – but it doesn't condemn his *action* of asserting given his excellent position at the time. The wrongness is purely in the mismatch with reality, not in his epistemic state.

  **Naomi:** You're right, that case pulls me. Ben *was* responsible. But does the Truth Norm let Sarah (the Gettier sheep-spotter) off too easily? Or worse, consider someone who makes a wild, unjustified guess that happens to be true. "The meeting is in Room 203!" they blurt, having no idea. It *is* in 203. Truth Norm: fine! Knowledge Norm: improper assertion! And I think our *practice* agrees with me: we'd reproach the guesser, "Why did you say that? You didn't *know*! You just got lucky!"

  **Thomas:** Do we? Or do we reproach them for being *reckless*, which is different? We might say, "You had no business asserting that so confidently!" That's about the *manner* or the *lack of justification*, not necessarily the *norm of assertion itself*. The Truth Norm can accommodate that critique through ancillary norms about justification or responsibility. Its core claim is simpler: the *fundamental* wrong in assertion is asserting falsehood. Now, consider this: the *misleading truth*. Suppose Lisa knows the client *verbally* approved the design to her, but she also knows the client is notorious for changing their mind after seeing printed copies. She tells the team, "Client approved the design!" It's *true* – they verbally did. But it’s highly misleading; the team assumes finality. Under the Truth Norm, her assertion is proper. Under the Knowledge Norm... well, she *knows* they verbally approved. But did she assert *only what she knew*? Or did she imply more?

  **Naomi:** Ah, tricky! The Knowledge Norm might say she *knew* the approval happened, but she also knew it was potentially unstable. A truly proper assertion might require qualifying it: "Client gave verbal approval, but you know how they are with prints..." The norm governs *what is conveyed*, not just the literal words. She asserted something true *literally*, but perhaps implied a false sense of security she *knew* was unwarranted. The Knowledge Norm might capture the *communicative fault* better – she asserted more than she knew about the *stability* of the approval.

  **Thomas:** But the Truth Norm can say she asserted *the truth* ("approved"), but violated a different norm about *being misleading* or *withholding relevant context*. It separates the core condition (truth) from other conversational virtues (completeness, non-misleadingness). Isn't that cleaner? It doesn't overload the assertion norm itself.

  **Naomi:** Perhaps. But look at how we *hold people accountable*. When someone says something false, we often demand, "How did you *know* that?" If they admit they didn't really know, we feel doubly wronged – not just by the falsity, but by the *presumption* of asserting without knowledge. "You didn't even know? Why did you say it?" Conversely, if someone has impeccable evidence but is foiled by fluke – like Ben and the bus – we focus on the unfortunate falsity, not usually blame *them* for asserting. We say "Bad luck!" or "The info was wrong!", not "You violated the norm by speaking!" Doesn't this *pattern of reproach* suggest the Knowledge Norm reflects our deeper intuitive standard? We get angrier at the reckless asserter than the diligent-but-unlucky one, even when both result in falsity.

  **Thomas:** You have a point about the *anger* differential. We do often feel the reckless asserter is more *culpable*. But is that about the *assertion norm* itself, or about a broader norm of epistemic responsibility? The Truth Norm condemns the *falsehood* equally in both cases. The reckless asserter might *also* be condemned for irresponsibility, which is a separate failing. The diligent-but-unlucky asserter is only condemned for the falsehood (which was unavoidable). The pattern you see might be us applying *two* norms: one against falsity (the core assertion norm), and one against irresponsible belief formation/assertion.

  **Naomi:** Maybe. But it feels intertwined. Saying "You shouldn't have said it because you didn't know" bundles the reproach. It makes the *act* of asserting without knowledge the primary wrong, from which the risk (or actuality) of falsity flows. The Truth Norm makes the actual falsity the necessary condition for the primary wrong, which feels... contingent. Like the wrong only *happens* if the world doesn't cooperate, not inherent in the speaker's act.

  **Thomas:** And your norm makes the wrong depend entirely on the speaker's internal, often inaccessible, epistemic state. How can we *ever* truly hold someone accountable under the Knowledge Norm? We can only ever judge their *claimed* justification or evidence. The Truth Norm relies on something more objective: was what they said true or false? That seems more practical for everyday accountability.

  **Naomi:** Practicality isn't everything, Thomas. Maybe the norm *is* demanding. But it sets an ideal standard for responsible communication: only put forward as fact what you are in a position to guarantee. It discourages guesswork and gossip masquerading as knowledge.

  **Thomas:** And the Truth Norm sets an ideal standard for fidelity to reality. It reminds us that even the most justified belief can be wrong, and we are responsible for the truth of what we *say*, regardless of how carefully we formed the belief. We see the difference most clearly in the unlucky but diligent speaker – condemned by you, excused (for the assertion itself) by me.

  **Naomi:** And in the reckless guesser who gets lucky – excused by you, condemned by me. I suspect we're circling the core difference: is the fundamental wrong in asserting located in the *speaker's relationship to the content* (knowing/not knowing), or in the *content's relationship to the world* (true/false)? Our practices hint at both, but lean towards the speaker's responsibility, I think.

  **Thomas:** And I think they prioritize the outcome. We care most about being misled by falsehoods, regardless of intent. Neither concession seems forthcoming, Naomi. Shall we grab another coffee and find a less responsible asserter to observe in the wild?

  **Naomi:** (Smiling) Only if you *know* where the coffee shop is. I wouldn't want you merely asserting its location based on a hunch.

  **Thomas:** Touché. Let's go find out *for sure*. Evidence first, assertion later. Maybe our norms agree on that much.
