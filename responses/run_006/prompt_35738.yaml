  1.4. By the equivalence condition, since H1 and H2 are logically equivalent, any evidence that confirms H2 also confirms H1. Thus, the green apple confirms the ravens hypothesis (H1).

  1.5. The above derivation (1.1-1.4) leads to the paradoxical result that a green apple confirms that all ravens are black.

  1.6. A theory of confirmation must explain the strong intuitive difference in confirmatory impact between observing a black raven (which is clearly confirmatory) and observing a green apple (which seems irrelevant).

  **2. Disagreements:**

  The following table summarizes our residual disagreements:

  | Issue | Hempelian Position | Selective-Confirmation Position | Crux |
  |-------|-------------------|--------------------------------|------|
  | Nature of Confirmation | Confirmation is a purely logical relation between evidence and hypothesis, defined by formal conditions (e.g., Nicod's condition and the equivalence condition). | Confirmation is not a purely syntactic matter; it must be relativized to a reference class, background knowledge, or a sampling procedure. | Whether confirmation is a purely logical relation or is relative to contextual factors. |
  | Equivalence Condition | The equivalence condition is an adequacy constraint that cannot be restricted without undermining the logical structure of confirmation. | The equivalence condition, while logically valid, can be overridden in contexts of inquiry where evidence is gathered in a non-representative way. | Whether the equivalence condition must hold without exception. |
  | Intuition about Irrelevance | The intuition that a green apple is irrelevant is a bias to be explained away by psychological or pragmatic factors, not a datum that a logic of confirmation must accommodate. | The intuition that a green apple is irrelevant is a datum that a theory of confirmation must preserve. | Whether the intuition of irrelevance is a pre-theoretic datum or a bias. |
  | Relation between Probabilistic and Syntactic Confirmation | Incremental probabilistic support and syntactic instance confirmation are rival explications of the same pre-theoretic notion of confirmation; the former must be subordinated to the latter to preserve logical structure. | Incremental probabilistic support and syntactic instance confirmation are distinct; the former is primary and the latter is a special case that only holds under ideal conditions. | Whether the two concepts are rival explications of one notion or distinct notions. |

  **3. Tests for Cruxes:**

  For each crux, we have designed the following test and recorded our predictions:

  **Crux 1: Whether confirmation is a purely logical relation or relative to contextual factors.**

  *Test Case*: Consider two pieces of evidence for the ravens hypothesis:
  - Evidence A: A black raven observed in an ornithological survey (targeting ravens).
  - Evidence B: A green apple observed in a fruit market (targeting fruits).

  Both agree Evidence A confirms. The question is whether Evidence B also confirms.

  - Hempelian Prediction: Evidence B does confirm the hypothesis because it satisfies the contrapositive instance and the equivalence condition holds, regardless of the context of observation.
  - Selective-Confirmation Prediction: Evidence B does not confirm the hypothesis because the sampling procedure (in a fruit market) is not relevant to the domain of ravens.

  **Crux 2: Whether the equivalence condition must hold without exception.**

  *Test Case*: We have H1 and H2 (as above). We observe a non-black non-raven (e.g., a red apple). 

  - Hempelian Prediction: The observation confirms both H1 and H2 equally because of logical equivalence.
  - Selective-Confirmation Prediction: The observation may confirm H2 (if the sampling is appropriate for non-black things) but does not confirm H1 because the sampling procedure (e.g., looking at fruit) is not relevant to the domain of ravens. Thus, the equivalence condition does not hold in this context.

  **Crux 3: Whether the intuition of irrelevance is a datum or a bias.**

  *Test Case*: Conduct a survey of laypeople and scientists, presenting the green apple as evidence for the ravens hypothesis and asking if it provides any support.

