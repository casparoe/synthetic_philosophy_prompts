  We are writing a joint statement after an adversarial collaboration on Hempel's raven paradox. The document should reflect both agreed claims and disagreements in the specified format.

  Agreed Claims:
  1. The hypothesis that all ravens are black (∀x (Raven(x) → Black(x))) is logically equivalent to the hypothesis that all non-black things are non-ravens (∀x (~Black(x) → ~Raven(x))).
  2. A green apple is an instance of a non-black (green) thing that is a non-raven (since it is an apple). Therefore, it satisfies both the antecedent (~Black) and the consequent (~Raven) of the contrapositive form.
  3. Nicod's condition (also called the Nicod criterion) states that an observed instance that is both F and G (e.g., a raven that is black) confirms the generalization that all F are G. Similarly, an observed non-black non-raven (like a green apple) would, by the same condition applied to the contrapositive hypothesis, confirm that all non-black things are non-ravens.
  4. By the equivalence condition (which says that logically equivalent hypotheses are confirmed by the same evidence), the green apple must also confirm the original hypothesis that all ravens are black.
  5. The above derivation (from points 1-4) leads to the paradoxical result that a green apple confirms that all ravens are black.
  6. A theory of confirmation must explain why observing a black raven feels strongly confirmatory of the ravens hypothesis, while observing a green apple (or any non-black non-raven) does not feel confirmatory at all, or at least feels much less so.

  Disagreements Table:

  We present a table with four columns: Issue, Hempelian Position, Selective-Confirmation Position, and Crux.

  | Issue | Hempelian Position | Selective-Confirmation Position | Crux |
  |-------|-------------------|--------------------------------|------|
  | The nature of confirmation | Confirmation is a purely logical relation between evidence and hypothesis, defined by formal conditions such as Nicod's condition and the equivalence condition. | Confirmation is not a purely syntactic matter; it must be relativized to a reference class, background knowledge, or a sampling procedure. | Whether confirmation is a purely logical relation or is relative to contextual factors such as a sampling procedure or background knowledge. |
  | The status of the equivalence condition | The equivalence condition is an adequacy constraint on any logic of confirmation that cannot be restricted without undermining the logical structure of confirmation. | The equivalence condition, while logically valid, can be restricted or overridden in contexts of inquiry where the evidence is not gathered in a way that is representative of the domain. | Whether the equivalence condition must hold without exception or whether it can be restricted in light of how evidence is collected. |
  | The intuition about the green apple | The intuition that a green apple is irrelevant to the ravens hypothesis is a bias to be explained away by psychological or pragmatic factors, not a datum that a logic of confirmation must accommodate. | The intuition that a green apple is irrelevant is a datum that a theory of confirmation must preserve, and a theory that fails to do so is inadequate. | Whether the intuition of irrelevance is a pre-theoretic datum that a theory of confirmation must account for or a bias that the theory should correct. |
  | The relation between incremental probabilistic support and syntactic instance confirmation | Incremental probabilistic support (e.g., in Bayesian terms) and syntactic instance confirmation (e.g., via Nicod's condition) are rival explications of the same pre-theoretic notion of confirmation, and the former must be subordinated to the latter to preserve logical structure. | Incremental probabilistic support and syntactic instance confirmation are distinct concepts; the former is the primary notion of confirmation, while the latter is at best a special case that holds only under ideal conditions (e.g., random sampling). | Whether the two concepts are rival explications of one notion or distinct notions that may diverge. |

  Cruxes with Tests:

  For each crux, we design a test that both sides agree bears on the crux, and record each side's prediction.

  Crux 1: Whether confirmation is a purely logical relation or is relative to contextual factors.

  Test Case: Consider a scenario where we are testing the hypothesis that all ravens are black. We have two pieces of evidence: 
  - Evidence A: A black raven observed in a controlled ornithological survey of ravens.
  - Evidence B: A green apple observed in a fruit market.

  Both sides agree that Evidence A confirms the hypothesis. The question is whether Evidence B also confirms it in the same logical sense.

  Hempelian Prediction: Evidence B does confirm the hypothesis, because it satisfies the contrapositive instance and the equivalence condition holds.

  Selective-Confirmation Prediction: Evidence B does not confirm the hypothesis because it was not sampled from a context relevant to ravens (e.g., it was sampled from fruit, not birds). The confirmation is relative to the sampling procedure.

  Crux 2: Whether the equivalence condition must hold without exception.

  Test Case: Suppose we have two logically equivalent hypotheses: 
  H1: All ravens are black.
  H2: All non-black things are non-ravens.

  Now, we observe a non-black non-raven (e.g., a red apple). 

  Hempelian Prediction: The observation confirms both H1 and H2 equally because they are logically equivalent.

  Selective-Confirmation Prediction: The observation may confirm H2 (if the sampling procedure is appropriate for non-black things) but does not confirm H1 because the sampling procedure (e.g., looking at fruit) is not relevant to the domain of ravens. Thus, the equivalence condition fails in this context.

  Crux 3: Whether the intuition of irrelevance is a datum or a bias.

  Test Case: Conduct a survey of laypeople and scientists, presenting them with the green apple and asking if it provides any support for the ravens hypothesis. 

  Hempelian Prediction: The theory predicts that the green apple does provide support, so the intuition of irrelevance is a bias (e.g., due to focusing on the raven category or neglecting logical equivalence). The survey will show that people do not recognize the logical support, which is a mistake to be explained by psychological factors.

  Selective-Confirmation Prediction: The intuition of irrelevance is correct and should be preserved. The survey will show that people do not consider the green apple as evidence, which aligns with the theory's claim that without appropriate sampling, the green apple is irrelevant.

  Crux 4: Whether incremental probabilistic support and syntactic instance confirmation are rival explications or distinct notions.

  Test Case: Consider a Bayesian model where the prior probability of the ravens hypothesis is low and the prior probability of non-black things being non-ravens is high (because non-black things are abundant and mostly non-ravens). Then, observing a green apple (a non-black non-raven) would only negligibly increase the probability of the hypothesis (since we already expected non-black things to be non-ravens). In contrast, observing a black raven (which was not certain) would significantly increase the probability.

  Hempelian Assessment: This probabilistic account is not the correct explication of confirmation because it violates the equivalence condition and Nicod's condition. The syntactic conditions (Nicod and equivalence) must hold regardless of probabilistic considerations.

  Selective-Confirmation Assessment: This probabilistic account captures the true notion of incremental confirmation. The syntactic conditions are at best a rough heuristic that fails in cases like the raven paradox.

  Verbal Disagreement:

  Part of the dispute is verbal. The Hempelian uses "confirmation" in a syntactic, instance-based sense, where any instance of the generalization (or its contrapositive) counts as confirmation. The selective-confirmation theorist uses "confirmation" to mean an increase in the probability of the hypothesis given the evidence, which is context-sensitive. However, the substantive disagreement remains: whether the syntactic conditions (Nicod and equivalence) are necessary constraints on a theory of confirmation.

  Thus, we issue the following joint statement:

  ---

  **Joint Statement on the Raven Paradox**

  We, a Hempelian confirmation theorist and a selective-confirmation theorist, after a good-faith adversarial collaboration, issue the following statement.

  **1. Agreed Claims:**

