prompt: |-
  I teach a bioethics seminar, and every year we hit the same wall with the therapy/enhancement distinction. The thought is that medical interventions aimed at restoring normal human functioning—vaccines, insulin, prosthetic limbs—are morally unproblematic or even obligatory in ways that interventions aimed at surpassing normal functioning—cognitive enhancers, genetic engineering for height or IQ, mood brighteners for the already-well—are not. But every attempt to draw the line seems to either collapse under pressure or smuggle in normative assumptions it was supposed to ground. Species-typical functioning sounds biological until you ask whether it means the statistical norm (in which case curing aging would become an enhancement once most people are old), or an idealized notion of proper function (in which case you've already decided what a human being ought to be like). Evolutionary accounts face the problem that evolution has no purposes, only history. And even if you could draw the line cleanly, it's not obvious why it should matter: if an intervention is safe and improves someone's life, why should it matter whether it restores or surpasses?

  I'd like your credence that the therapy/enhancement distinction can be drawn in a principled, non-arbitrary way that does genuine normative work. By "genuine normative work" I mean: there exists some formulation of the distinction that (a) is extensionally adequate—it classifies the cases most people feel sure about in the way they feel sure about them, (b) does not simply encode prior moral judgments under a different description, and (c) can bear the weight of differential moral evaluation that its defenders want to place on it—it's not just a label but a reason. Please decompose this: what probability do you assign to there being a defensible account of normal human functioning, to that account successfully distinguishing paradigm cases of therapy from paradigm cases of enhancement, to the distinction tracking anything of moral relevance even if it can be drawn, and to the possibility that the whole framing is a mistake and we should evaluate interventions on entirely different grounds? Give a number and a sentence of reasoning for each term, show how they combine, and tell me which term you'd most want to see further philosophical or empirical work on before updating substantially.
reasoning: |-
  Okay, the user is a bioethics professor who's been grappling with the therapy-enhancement distinction in their seminar. They're frustrated because every attempt to define this distinction seems to either collapse logically or sneak in hidden value judgments. They want to know if a principled, non-arbitrary line can be drawn that actually does normative work - meaning it can justify treating therapies and enhancements differently morally.

  I need to break this down into components and assign probabilities. The user wants four specific probabilities: (1) defensible account of "normal functioning," (2) that account successfully distinguishing paradigm cases, (3) the distinction tracking moral relevance even if drawn, and (4) the whole framing being mistaken. Then I need to show how they combine and identify which area needs most research.

  For the first term - a defensible account of normal functioning. The species-typical functioning approach seems biological but runs into problems with statistical norms versus idealized functions. Evolutionary accounts face the is-ought problem. Maybe something like Boorse's biostatistical theory? But that still has issues when applied to things like aging. I'll give this about 35% - possible but unlikely.

  Second term - distinguishing paradigm cases. This seems more achievable. Most people agree that restoring vision is therapy while adding night vision is enhancement. The core cases might hold even if boundary cases are messy. I'll go with 70% here.

  Third term - moral relevance. This is the toughest part. Even if we can draw the line, why should it matter morally? The user's point about safe interventions that improve lives is compelling. Maybe concerns about fairness or coercion? But those seem separable. Only 20% here.

  Fourth term - whole framing being mistaken. Given all these problems, it's quite plausible we should evaluate interventions based on risk-benefit profiles, justice concerns, etc. rather than this distinction. I'll say 65%.

  Combining these: The probability of all three positive conditions being met is 0.35 * 0.7 * 0.2 = 4.9%. That's low but not zero. The probability of the framing being mistaken is higher at 65%.

  The area most needing research is clearly moral relevance. We could have the clearest distinction possible, but if it doesn't actually track anything morally important, the whole exercise is pointless. Empirical work on societal consequences of enhancement and philosophical work on why "normal" matters would be most valuable.

  I should emphasize that while the distinction might work for core cases, it fails at moral heavy lifting. The user seems sympathetic to this view given their frustration. Maybe suggest shifting focus to concrete ethical concerns rather than maintaining this problematic dichotomy?
answer: |-
  Based on your critique and the persistent challenges in bioethics, I assign the following credences to the components of the therapy/enhancement distinction problem:

  1.  **Defensible account of "normal human functioning" (NF):**  
      **Probability: 35%**  
      *Reasoning:* While concepts like Boorse's "species-typical functioning" or adaptive "normalcy" grounded in evolutionary biology have theoretical traction, they are vulnerable to objections about statistical drift (e.g., aging becoming "normal"), teleology (evolution lacks purpose), and sociocultural bias masking as biology. A truly principled, non-arbitrary NF account is possible but faces significant hurdles.

  2.  **NF account successfully distinguishes paradigm cases (Therapy vs. Enhancement):**  
      **Probability: 70%**  
      *Reasoning:* Even flawed NF accounts often correctly classify *paradigm* cases (e.g., antibiotics for infection = therapy; steroids for athletic advantage = enhancement). Core intuitions about restoring baseline health vs. exceeding it are robust enough that a workable NF definition *could* align with these, even if boundary cases (e.g., "normal" mood vs. "brightened") remain contentious.

  3.  **Distinction tracks morally relevant differences (if drawn):**  
      **Probability: 20%**  
      *Reasoning:* This is the crux. Even if a clean NF-based distinction exists, it's unclear why *restoring* NF is inherently morally distinct from *exceeding* it when both are safe, effective, and welfare-improving. Potential moral concerns (e.g., fairness, coercion, authenticity, resource allocation) often attach to specific *contexts* or *consequences* of interventions, not the therapy/enhancement label itself. The distinction likely lacks *independent* moral weight.

  4.  **The framing is mistaken; we need entirely different grounds:**  
      **Probability: 65%**  
      *Reasoning:* The persistent conceptual failures and the weak link to moral relevance strongly suggest that focusing on **risk-benefit profiles, autonomy, justice (access/inequality), societal pressures, and the specific goals/contexts of interventions** is more fruitful than the therapy/enhancement dichotomy. This framing directly addresses the moral concerns often mistakenly routed through the distinction.

  **Combined Probability (for a distinction doing "genuine normative work"):**  
  The probability that **all three positive conditions hold** (Defensible NF + Extensionally Adequate + Morally Relevant) is the product of the first three probabilities:  
  **0.35 (NF) * 0.70 (Distinction) * 0.20 (Moral Relevance) = 0.049 or 4.9%**

  **Key Takeaway & Recommendation for Further Work:**  
  Your core intuition is well-founded. The combined probability of the therapy/enhancement distinction achieving its intended normative work is very low (**~5%**), primarily because the **moral relevance term (20%) is the weakest link**. Even if a defensible line *could* be drawn (35%), and even if it sorted paradigms (70%), it provides little *reason* to treat the categories differently morally.

  **Therefore, the term I'd most want to see further work on before substantially updating is:  
  Moral Relevance (Term 3).**

  *   **Why?** Philosophical work needs to rigorously establish *if and how* "normal functioning" itself carries intrinsic moral significance (e.g., does it protect authenticity? define human dignity? ground rights?) independent of consequences. If this fails, the distinction collapses normatively regardless of its descriptive clarity. Empirical work could explore societal impacts of widespread enhancement adoption (e.g., on cohesion, inequality, motivation) to test if crossing the "normal" threshold reliably predicts harm – but this would link relevance to consequences, not the distinction itself. Focusing here directly challenges the distinction's core justification and may validate your suspicion that the framing itself is flawed (Term 4: 65%).

  **Conclusion:** While a descriptively adequate line *might* be drawn (35% NF, 70% distinction), its inability to bear normative weight (20%) makes the distinction largely ineffective for bioethical evaluation. Shifting focus to context-specific risks, benefits, justice, and autonomy is likely a more robust approach, as your skepticism suggests.
