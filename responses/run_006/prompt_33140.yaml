  First, I should outline the common ground. Both sides accept empirical data from neuroscience and psychology. Things like inattentional blindness or neural correlates of consciousness are probably shared. They'd agree that any theory must explain phenomena like the unity of consciousness, subjective reports, and the role of attention. Methodologically, they both likely commit to naturalism and avoiding dualism.

  For the disagreements, I need clear, non-caricatured statements. For example, the workspace proponent might say, "Conscious access requires integration into a global neuronal workspace," while the multiple-drafts advocate would argue, "No privileged integration site is necessary; consciousness arises from parallel processes." I should ensure each point directly contrasts without misrepresenting either side.

  Next, the cruxes. These are key sub-questions where resolving them could shift opinions. One crux might be whether discrete neural events correlate with conscious reports. If experiments show sharp transitions in brain activity during perception, it might support the workspace model. The multiple-drafts proponent would predict gradual changes. Both sides would need specific predictions here.

  Terminological issues are important. For instance, "conscious content" might differ: workspace theorists might tie it to global access, while multiple-drafts could see it as any content processed to a certain degree. Clarifying this could dissolve some conflicts, but the core disagreement about centrality might remain substantive.

  For empirical tests, binocular rivalry is a good example. Workspace theory predicts synchronized activity in frontal-parietal networks when a stimulus becomes conscious. Multiple drafts might expect shifts in rivalry without central synchronization. Results showing either pattern would support one model over the other.

  I need to structure each part clearly, using sections for agreements, disagreements, cruxes, and tests. Ensuring predictions are falsifiable is key. Also, highlighting where terminology differs and adjusting for that will prevent verbal disputes. Finally, making sure the document facilitates collaboration by focusing on resolvable issues through experiments or data.
answer: |-
  ## Adversarial Collaboration: Global Workspace vs. Multiple Drafts Models of Consciousness

  **Parties:**
  *   **Proponent of Global Workspace Theory (GWT):** Argues conscious experience involves the integration of information into a limited-capacity, global neuronal workspace, making it accessible to a wide range of cognitive systems (e.g., attention, memory, decision-making, verbal report). This workspace functions as a functional "stage" for conscious content.
  *   **Proponent of Multiple Drafts Model (MDM):** Argues there is no central place or time ("Cartesian Theater") where consciousness "happens." Instead, consciousness is the result of multiple, parallel streams of content processing ("drafts") distributed across the brain. No single draft is definitive; conscious report reflects the content of the most successfully promoted draft *at that moment* for that particular task.

  **(1) Shared Ground: Points of Agreement**

  We, the undersigned proponents of GWT and MDM, agree on the following foundational points:

  1.  **Naturalism:** Consciousness is a natural phenomenon arising from the physical processes of the brain.
  2.  **Empirical Basis:** Any viable theory of consciousness must be grounded in, and constrained by, empirical evidence from neuroscience, psychology, psychophysics, and related fields.
  3.  **Rejection of Cartesian Substance Dualism:** Consciousness does not require an immaterial soul or non-physical substance.
  4.  **Functional Role of Report:** Verbal reports (and other behavioral indicators) are the primary *data* for scientific investigation of conscious contents in others, even if they are not the *essence* of consciousness itself.
  5.  **Phenomena Requiring Explanation:** Any adequate theory must account for:
      *   **Reportability:** The ability to verbally report or otherwise indicate awareness of specific contents.
      *   **Access Consciousness:** The availability of information for guiding rational thought and action.
      *   **Phenomenal Character:** The subjective "what it's like" aspect of experience (though we may differ on its ultimate nature and how it arises).
      *   **Selectivity/Limited Capacity:** The fact that only a subset of available information is experienced at any given moment (e.g., attentional blink, inattentional blindness).
      *   **Integration/Unity:** The experience of a coherent scene, even though processing is distributed (the "binding problem").
      *   **Temporal Dynamics:** The flow of consciousness over time.
  6.  **Distributed Processing:** A vast amount of neural processing occurs unconsciously, in parallel, across specialized brain regions.
  7.  **Revision and Competition:** Neural representations are dynamic, subject to revision, and compete for influence on behavior and report.

  **(2) Disagreements Table**

  | Point of Disagreement                                                                 | Global Workspace (GWT) Position                                                                 | Multiple Drafts (MDM) Position                                                                 |
  | :------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **1. Central Functional Hub for Conscious Access?**                                   | Conscious access *requires* the transient integration of information into a specific, global neuronal workspace architecture (e.g., involving fronto-parietal networks), making it available to diverse cognitive systems. | Conscious access is a *distributed* functional property emerging from the successful competition and influence of specific content-processes ("drafts") across the brain; no single anatomical hub or privileged functional architecture is necessary. |
  | **2. The Nature of the Conscious "Moment" / Temporal Discreteness?**                  | While processing is continuous, the *entry* of content into the global workspace, and thus conscious access, exhibits a degree of temporal discreteness or rhythmicity (e.g., linked to oscillatory phases). | There is no discrete temporal "moment" of consciousness; conscious content is continuously updated and revised. Reports sample an ongoing, asynchronous flux of competing content-processes. |
  | **3. Is There a "Final" or "Definitive" Conscious Content?**                          | At any given time relevant for report or action, there is a specific, integrated content represented within the global workspace that constitutes the current conscious state. | There is no single "final draft." Different content-processes may be dominant (and thus reportable) for different purposes at slightly different times; consciousness is inherently "fragmentary" and task-dependent. |
  | **4. Role of the Workspace/Stage Metaphor:**                                          | The "global workspace" is a valid and necessary functional description of the neural architecture enabling the *broadcasting* of information essential for conscious access and report. | The "Cartesian Theater" metaphor (implying a single locus/stage and audience) is fundamentally misleading. Consciousness is better described as "fame in the brain" – content is conscious when it achieves widespread influence, not when it's "on stage." |
  | **5. Relationship Between Phenomenal Character and Access:**                          | The phenomenal character of an experience (the "what it's like") is intimately tied to, and arises from, the specific information achieving global broadcast and the consequent widespread recurrent processing it undergoes. | While reportability ("access consciousness") requires widespread influence, phenomenal character may be a more distributed property, potentially arising from lower-level, specialized processes *before* or even *without* full global access. |

  **(3) Cruxes: Key Sub-Questions**

  1.  **Crux: Neural Signatures of Conscious Access: Is there a distinct, late-stage neural event (signature) specifically correlated with conscious reportability that is not present for equally complex unconscious processing?**
      *   **Why it's a Crux:** GWT predicts a specific, relatively late (e.g., ~300ms post-stimulus), widespread, and potentially oscillatory (e.g., gamma-band synchrony across fronto-parietal networks) neural signature *specifically* marking the transition to conscious access. MDM predicts that reportability correlates with the *influence* of a content-process, which could be achieved by various neural means in different contexts or brain regions; there should be no *single*, privileged signature *defining* conscious access beyond the functional outcome (report).
      *   **Concessions:**
          *   If a *consistent*, late-stage signature is found across diverse paradigms: MDM proponent must concede a specific, privileged functional process akin to global broadcasting exists.
          *   If no consistent signature is found, but reportability correlates reliably with diverse, context-dependent neural patterns matching the specific task/influence: GWT proponent must concede the MDM view of distributed influence without a central hub is more parsimonious.

  2.  **Crux: Temporal Grain of Consciousness: Does conscious perception exhibit a fundamental temporal grain (e.g., discrete snapshots) reflecting workspace dynamics, or is it continuous and asynchronous?**
      *   **Why it's a Crux:** GWT suggests conscious access has a temporal resolution limited by workspace update cycles (e.g., phases of alpha/beta oscillations). MDM suggests consciousness is a continuous stream where temporal order and simultaneity are judgments made by processing streams, not dictated by a central clock.
      *   **Concessions:**
          *   If temporal illusions and report precision demonstrably align with specific oscillatory phases (e.g., conscious perception is periodically "gated"): MDM proponent must concede a rhythmic, quasi-discrete aspect central to conscious access.
          *   If temporal judgments are highly flexible, context-dependent, and don't reliably lock to specific neural oscillations: GWT proponent must concede the temporal structure of consciousness is less rigid and central than the workspace metaphor implies.

  3.  **Crux: Micro-Consciousness & Partial Report: Can highly specific, unreportable phenomenal content exist ("micro-consciousness") without global access?**
      *   **Why it's a Crux:** GWT typically posits that phenomenal character requires global availability. MDM allows for the possibility that localized, specialized processing can generate phenomenal properties ("qualia") which might only become *reportable* upon winning broader influence.
      *   **Concessions:**
          *   If robust empirical evidence demonstrates vivid, specific subjective content (e.g., color, shape) that subjects reliably experience but *cannot* report due to attentional/access constraints (beyond simple signal detection limits): GWT proponent must concede that phenomenal character can exist without full global access/broadcasting.
          *   If all evidence for unreportable phenomenal content can be explained by degraded signals, vague feelings, or post-perceptual confabulation: MDM proponent must concede that reportable access and phenomenal character are tightly coupled via the global workspace mechanism.

  **(4) Empirical Tests & Predictions**

  1.  **Test for Crux 1 (Neural Signatures):** Use high-density EEG/MEG and intracranial recordings during a binocular rivalry paradigm combined with a graded perceptual awareness scale. Look for neural activity patterns specifically correlating with the *transition* between perceptual states (rivalry switch) and the *stable report* of a conscious percept. Analyze spatial distribution, latency, oscillatory power, and phase synchrony.
      *   **GWT Prediction:** A consistent, late (~200-400ms), high-frequency (gamma) synchrony burst across fronto-parietal regions will be the clearest neural correlate of the *onset* of a stable conscious percept, distinct from activity patterns during ambiguous or suppressed states.
      *   **MDM Prediction:** Perceptual transitions and stable reports will correlate with shifts in dominance patterns within sensory areas and varying patterns of connectivity/influence between sensory and frontal areas. No single, late, widespread oscillatory signature will be necessary and sufficient across all trials/participants.
      *   **Evidence For GWT:** Finding the predicted late, widespread synchrony signature reliably at the moment of perceptual report across diverse stimuli and tasks.
      *   **Evidence For MDM:** Finding that reportability correlates best with context-specific patterns (e.g., sensory activation strength combined with variable fronto-sensory connectivity profiles), without a consistent late-stage signature, or that signatures appear earlier in sensory cortex without requiring late fronto-parietal synchrony.

  2.  **Test for Crux 2 (Temporal Grain):** Use a rapid serial visual presentation (RSVP) task with masked targets presented at varying stimulus onset asynchronies (SOAs), while simultaneously recording neural oscillations (e.g., alpha phase). Probe for the dependence of target detection/report accuracy and subjective visibility ratings on the phase of ongoing oscillations *at the time of target presentation*.
      *   **GWT Prediction:** Target detection and visibility will show periodic fluctuations tightly locked to the phase of specific oscillations (e.g., alpha), demonstrating that conscious access is rhythmically sampled/gated.
      *   **MDM Prediction:** Performance and visibility will show smooth, non-oscillatory dependencies on SOA, reflecting continuous processing limitations (e.g., masking strength, attentional dwell time). Any phase-locking will be weak, task-dependent, or reflect sensory entrainment rather than a central conscious gating mechanism.
      *   **Evidence For GWT:** Strong, consistent phase-dependent modulation of report accuracy and visibility ratings, peaking for targets presented at the "optimal" phase of a specific oscillation (e.g., alpha trough).
      *   **Evidence For MDM:** Visibility and accuracy depend primarily on SOA (continuous function), with weak or inconsistent phase effects, or phase effects confined to early sensory processing without impacting the conscious report stage.

  3.  **Test for Crux 3 (Micro-Consciousness):** Use a dual-task paradigm combining a primary central task (e.g., working memory letter task at fixation) with a secondary peripheral task involving highly salient but task-irrelevant stimuli (e.g., colored Gabor patches). After the trial, use a surprise probe asking for detailed phenomenal properties of the peripheral stimulus (color, orientation) *only if it was seen*, using methods like the Perceptual Awareness Scale (PAS) and/or forced-choice discrimination *after* subjective report. Crucially, ensure the primary task loads attention sufficiently to prevent reliable overt report *during* the trial.
      *   **GWT Prediction:** Subjects will either fail to report *any* specific phenomenal detail of the unattended peripheral stimulus (reporting only "something was there" or nothing at all), or their detailed reports will be at chance level. Phenomenal detail requires attentional resources for global broadcast.
      *   **MDM Prediction:** A subset of subjects, on a subset of trials, will report experiencing specific, vivid phenomenal details (e.g., "bright red vertical lines") of the peripheral stimulus *despite* being unable to report it during the trial due to the attentional bottleneck, and their forced-choice performance on the probed details will be above chance *specifically on trials where they report such vivid unreportable experiences*.
      *   **Evidence For Micro-Consciousness (MDM):** Above-chance forced-choice discrimination on probed details *specifically correlated* with high PAS ratings for unreportable peripheral detail (e.g., "Clear image" rating) and *uncorrelated* with performance on the central task (showing it's not just guessing or partial central report).
      *   **Evidence Against Micro-Consciousness (GWT):** PAS ratings for peripheral detail are low/vague ("Something was there") and forced-choice performance on probed details is at chance *even when subjects report some sense of presence*, or performance is only above chance when central task performance drops, indicating leakage of attentional resources.

  **Terminological Clarifications and Substantive Residue:**

  *   **"Conscious Content":** Both agree it refers to the specific information subjects report experiencing. GWT links it intrinsically to information *within the global workspace*. MDM links it to information *in a sufficiently influential draft*. The disagreement is whether achieving this state *requires* a specific functional architecture (the workspace) or can be achieved through distributed influence without a central hub. This is substantive.
  *   **"Access Consciousness":** Both agree it refers to reportability and availability for global control. GWT sees this as the *core mechanism defining* phenomenal consciousness. MDM sees it as a *consequence* of a draft's influence, potentially separable (at least conceptually, and perhaps empirically - see Crux 3) from localized phenomenal properties. This difference in the relationship between access and phenomenality is substantive.
  *   **"Workspace/Stage":** GWT proponent emphasizes this as a functional description of a specific neural *mechanism* (broadcasting). MDM proponent objects primarily to the *Cartesian Theater* interpretation (a single locus/stage and time where "it all comes together" for an inner observer). The substantive disagreement is whether the broadcasting mechanism requires a specific, privileged anatomical-functional hub (GWT) or can be realized in a more distributed, variable manner (MDM). The MDM objection to the *theater metaphor* itself is partly terminological/metaphorical caution, but the core claim about the necessity of a central hub is substantive.

  This document represents our current best effort to delineate the agreements, disagreements, and crucial tests distinguishing the Global Workspace and Multiple Drafts models. We commit to revising our positions based on the outcomes of the proposed empirical investigations and ongoing dialogue.

