  If they reject step 1, they're saying propositions don't need "real" unity—maybe truth is just about correspondence or coherence without metaphysical glue. But that might feel unsatisfying because it dodges the "how do parts combine?" question. It could lead to deflationary theories of truth, where "truth" isn't a deep property but just a linguistic device. The cost? They lose a robust explanation of propositional unity, which might matter if they care about metaphysics.

