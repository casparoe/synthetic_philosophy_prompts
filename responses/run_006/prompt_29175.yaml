prompt: |-
  I've been trying to sort out what I actually think about trolley-ish cases, and I've found that my gut is more stable than my ability to say why. Here are the verdicts I keep landing on.

  A runaway trolley is heading toward five workers; I can pull a switch and send it onto a side track where one worker is. I think pulling the switch is fine.

  Same setup, but I'm on a footbridge and the only way to stop the trolley is to shove a large man off the bridge into it's path. I think shoving him is not fine — not even close.

  Now the side track loops back onto the main line before the five; the one worker on the loop is heavy enough that his body would stop the trolley. I think pulling the switch here is not fine, or at least it feels much worse than the plain switch case, even though the body count is the same.

  A pregnant woman has uterine cancer; a hysterectomy will save her and the fetus will die as a side effect. I think the hysterectomy is permissible. But a craniotomy — crushing the fetus's skull so she can survive an obstructed labor — I think is not permissible, even though again, one dies and one lives.

  In war, a pilot bombs a munitions factory knowing some civilians next door will be killed: I think that's permissible if the number isn't huge. A pilot bombs a civilian neighborhood precisely to break the enemy's will to fight: not permissible, even if the civilian death toll is identical.

  I expected the doctrine of double effect to capture all this — bad effect foreseen but not intended, and not the means to the good. But then I hit a snag. A doctor gives a dying patient a big dose of morphine to relieve pain, knowing it will also depress her breathing and may hasten death. I think that's permissible. But the analgesia and the respiratory depression come from the same drug doing the same thing, and I can't tell whether the hastening of death is a side effect or part of the mechanism. If it's part of the mechanism, DDE seems to condemn it, and I don't want to condemn it.

  And there's a case I can't settle at all. Suppose the one worker on the side track is someone I personally assured the side track would be clear — I'm the site safety officer. Does my assurance make the switch wrong, or does it just mean I should feel terrible afterward while having done the right thing? What does the principle that handles the other cases say about that one?

  So: is there one principle — double effect, or a using-as-a-means vs. allowing-foreseen-harm distinction, or maybe just a killing vs. letting-die asymmetry in a nicer suit — that gets all or nearly all of these verdicts? State it precisely, tell me which of my verdicts it can't accommodate, and apply it to the morphine case and the safety-officer case.
reasoning: |-
  Okay, let's tackle this user's ethical dilemma. They've presented a series of trolley problem variations and medical scenarios where their gut reactions are consistent but they're struggling to articulate a unifying principle. The user clearly has a strong grasp of ethical nuances, given how they've structured their examples and identified the weak points in existing frameworks like DDE.

  First, I notice the user has already identified the Doctrine of Double Effect (DDE) as a candidate framework but found it inadequate for the morphine case. That's a sharp observation - the morphine case really does expose a flaw in traditional DDE formulations because the mechanism of pain relief and respiratory depression are pharmacologically intertwined. The user isn't just looking for textbook answers; they want a principle that actually matches their considered judgments.

  The war examples show the user intuitively grasps the distinction between strategic targeting (acceptable) and terrorism (unacceptable) even with identical body counts. This suggests their moral framework heavily weights intentionality beyond just outcomes. The safety officer case is particularly interesting - it introduces a promise-keeping element that doesn't fit neatly into standard consequentialist or deontological boxes.

  Hmm... what the user really needs isn't just a principle but one that can handle:
  1. Means vs. side-effect distinctions (footbridge vs. switch)
  2. Act descriptions (loop case vs. direct switch)
  3. Professional obligations (safety officer case)
  4. Causal ambiguity (morphine case)

  The tripartite framework I'm considering addresses these by separating intention, means, and special obligations. For the morphine case, the key insight is that the death isn't functionally necessary for pain relief - it's an independent effect of the same substance. The safety officer case introduces role-based duties that override general utilitarian calculus.

  What's impressive is how the user's examples systematically test different pressure points in ethical theories. They've essentially created a complete test suite for moral frameworks. The frustration they express about not finding a perfect theory is understandable - no existing framework handles all these cases flawlessly. But their intuitions are remarkably consistent across domains, suggesting a coherent underlying moral sensibility even if it's hard to articulate.

  The loop case is particularly clever because it looks identical to the standard switch but feels different - showing that how we conceptualize the act matters (crushing someone with the trolley vs. diverting it). The medical cases parallel this with the craniotomy feeling like direct killing versus the hysterectomy being indirect.

  I should emphasize that while the tripartite framework covers most cases, the safety officer scenario requires acknowledging that moral principles exist in social contexts - promises and roles create special duties that can make otherwise permissible acts impermissible. That's not a flaw in the principle but a feature of real-world morality.
answer: |-
  Your intuitions form a remarkably coherent pattern that no single existing principle perfectly captures, but a **tripartite framework** combining revised Double Effect (DDE) with a robust "using as a means" prohibition and special obligations handles nearly all cases. Here's the principle and its application:

  **The Principle:**
  An act is permissible *only if*:
  1.  **Intent:** The agent intends only the good effect(s); the bad effect(s) are neither intended as an end nor *as a means* to the good end.
  2.  **Means:** The bad effect is *not caused by* using a person (or their body) *as a direct instrument or physical means* to achieve the good effect.
  3.  **Proportionality:** The good effect sufficiently outweighs the bad effect, considering all relevant factors (including special obligations).

  **How it captures your verdicts:**

  1.  **Standard Switch:** *Permissible.*
      *   *Intent:* You intend to save five; the one's death is a foreseen side effect, not intended.
      *   *Means:* You divert a threat (trolley) *away* from five *onto* one. You aren't *using* the one worker's body as a physical tool to stop the trolley for the five; you're redirecting the threat itself. The one is harmed by the threat's new path, not used as a literal instrument.
      *   *Proportionality:* Saving 5 > Sacrificing 1.

  2.  **Footbridge:** *Impermissible.*
      *   *Intent:* Saving five is intended. The man's death is *intended as the means* to stop the trolley (you need him crushed to stop it).
      *   *Means:* You *use* the large man's body *as a physical instrument/tool* (a human speed bump) to physically stop the trolley. This is a paradigmatic case of using someone as a mere means.
      *   *Proportionality:* (Irrelevant because 1 & 2 fail).

  3.  **Loop Track:** *Impermissible (feels worse than standard switch).*
      *   *Intent:* Saving five is intended. The one's death is *intended as the means* to stop the trolley (you need his body crushed to physically stop it so it won't roll back).
      *   *Means:* You are *using* the one worker's body *as a direct physical instrument/obstacle* to stop the trolley, just like the fat man. Diverting the trolley *onto him* with the *specific purpose* of his body acting as the brake constitutes using him as a tool. The loop *makes* his body the instrument.
      *   *Proportionality:* (Irrelevant because 1 & 2 fail).

  4.  **Hysterectomy:** *Permissible.*
      *   *Intent:* You intend to save the woman's life by removing the diseased uterus. The fetus's death is a foreseen, unintended side effect of removing the organ it depends on. You don't need the fetus dead to save her; you need the uterus gone.
      *   *Means:* The fetus's death results from removing its life-support system (the uterus), not from using the fetus *as a direct instrument* to achieve the cure. The fetus isn't the tool; the diseased organ is removed.
      *   *Proportionality:* Saving one life > Foreseen death of fetus.

  5.  **Craniotomy:** *Impermissible.*
      *   *Intent:* Saving the mother is intended. The fetus's death is *intended as the means* to save her (you *must* kill/destroy the fetus to create space for delivery/survival).
      *   *Means:* You are *using* the destruction of the fetus *as the direct physical instrument* to achieve the good effect (creating passage). The fetus is literally the obstacle being destroyed to save the mother.
      *   *Proportionality:* (Irrelevant because 1 & 2 fail).

  6.  **Munitions Factory:** *Permissible.*
      *   *Intent:* You intend to destroy the military target. Civilian deaths are foreseen but unintended side effects. You don't *need* them dead to destroy the factory.
      *   *Means:* Civilians are killed as *collateral damage* from the attack on the factory. They are not *used as shields or instruments* to destroy the factory; the factory is the target.
      *   *Proportionality:* Significant military advantage > Foreseen civilian deaths (assuming precautions taken).

  7.  **Terror Bombing:** *Impermissible.*
      *   *Intent:* You intend the civilian deaths *as the means* to break enemy morale (terror is the mechanism).
      *   *Means:* Civilians are *used as instruments/targets* to inflict terror and achieve the military goal. Their deaths *are* the weapon.
      *   *Proportionality:* (Irrelevant because 1 & 2 fail).

  **Where it Stumbles Slightly & Clarifications:**

  *   **The "Using as a Means" Criterion:** This is the crucial addition to standard DDE. It forbids *instrumentalizing* a person – making them or their body a direct physical component of your causal plan to achieve the good end. This clearly distinguishes the Switch (redirect threat) from Footbridge/Loop (use body as tool) and Hysterectomy (remove diseased organ) from Craniotomy (destroy fetus as obstacle).
  *   **"Not Caused By Using...":** This phrasing emphasizes that the bad effect isn't *brought about through* the instrumental use of the person.

  **Application to Your Problem Cases:**

  1.  **Morphine Case:**
      *   *Intent:* The doctor intends pain relief. The hastening of death is foreseen but *not intended*. The doctor doesn't *need* the patient to die sooner to relieve pain; they would prefer the patient lived comfortably.
      *   *Means:* Respiratory depression is a direct pharmacological effect of the morphine, *not* the result of *using the patient's body as an instrument*. The patient isn't being instrumentalized; the drug is acting on their physiology in its normal way to achieve the intended good effect (analgesia). The bad effect (respiratory depression/death) is an *unavoidable side effect* of the mechanism causing the good effect, not the mechanism *itself* being the bad effect used instrumentally.
      *   *Proportionality:* Alleviating severe suffering justifies the risk/possibility of hastening death.
      *   **Verdict:** *Permissible.* The framework accommodates this by focusing on *instrumentalization*, not merely causal mechanism. Death isn't the tool; it's an unintended consequence of the tool (morphine) working normally. Revised DDE often handles this by stressing the absence of *intent* for death and proportionality.

  2.  **Safety Officer Case:**
      *   *Intent:* You intend to save the five. The death of the one worker is foreseen but not intended (if you could save him too, you would).
      *   *Means:* Same as the Standard Switch. You are redirecting the threat (trolley), not using the worker's body as a physical instrument to stop it.
      *   *Proportionality:* **This is where the framework *needs expansion*.** While saving 5 > sacrificing 1 generally satisfies proportionality, your *special obligation* as the safety officer who gave a personal assurance creates a *significant additional negative factor*. You have a duty *specifically to that worker* based on your promise and role.
      *   **Analysis:** The principle (especially proportionality) must weigh *all* relevant factors, including special duties, promises, and relationships. Your assurance creates a powerful *pro tanto* duty (a duty that has genuine weight but can be overridden) not to harm *that specific worker* through your action. Pulling the switch violates this specific duty *to him*.
      *   **Verdict:** The principle *can* accommodate condemning the act by recognizing this special obligation as a major factor in proportionality. While saving five strangers might outweigh sacrificing one stranger, saving five strangers *does not necessarily outweigh* violating a solemn promise and duty of care *to the specific person you are sacrificing*, especially when that promise induced his reliance (being on the side track). Your gut feeling that it's wrong, or at least that you should feel terrible, is justified. The framework suggests: **Pulling the switch is likely *impermissible* due to the violation of your special obligation to that worker, making the act disproportionate *in this specific context*.** It's not *just* a numbers game anymore.

  **Conclusion:**

  Your intuitions align best with a principle combining **revised Double Effect (focusing on intention and proportionality)** with a **strong prohibition against using a person as a mere means/instrument** (emphasizing direct instrumentalization). This framework captures:

  *   Switch vs. Footbridge/Loop (instrumentalization)
  *   Hysterectomy vs. Craniotomy (instrumentalization)
  *   Munitions vs. Terror Bombing (intent and instrumentalization)
  *   Morphine (lack of intent for death, lack of instrumentalization, proportionality)

  It struggles slightly with the **Safety Officer case** precisely because standard proportionality often focuses on numbers, while this case introduces a **special obligation** creating a significant non-quantitative negative factor. However, by incorporating special obligations into the proportionality assessment, the framework *can* condemn the act in that scenario, matching your intuition that the promise makes a decisive difference. Your "gut" is tracking a sophisticated interplay of intention, instrumentalization, proportionality, and role-based duties.
