prompt: |-
  Alright so I got roped into leading a session on teleosemantics for our department's philosophy of mind reading group. Most people there do ethics or history, not mind, so they're smart but this isnt their area. I have about forty minutes to get the basic picture across before we dive into the Millikan reading. I don't need you to explain teleosemantics to me — I need a teaching plan. What order do the pieces have to go in? My instinct is you can't even start without motivating why anyone would want to naturalize content, but I'm not sure how much time to spend on that before it becomes a distraction. Then there's the teleology part: I know people are going to hear "function" and think conscious purpose or just causal role, and I need to know exactly when to head that off. What's the best single example to carry the whole thing — the bee dance seems standard but maybe there's something cleaner? And what does that example need to lack (e.g., it shouldn't involve learning, right?) so it doesn't introduce confusions you then have to clean up? Also, where in the sequence do I deal with the obvious objection — "this tells you what the representation is supposed to do, not what it actually represents"? And give me one question I can ask at the end that'll tell me whether they understood the view rather than just memorized a slogan. Keep it under 350 words.
