  Okay, the user is leading a session on teleosemantics for a philosophy reading group. They need a teaching plan that fits into forty minutes before discussing Millikan. The audience is smart but not specialized in philosophy of mind—they're more into ethics or history. 

  First, I need to prioritize clarity and avoid technical jargon. The user's instinct to start with motivation is spot-on—without understanding why naturalizing content matters, the whole discussion might feel arbitrary. But I must keep it brief; maybe 5 minutes max. The "why" hook should show how intentionality is the last frontier of naturalism, using examples like belief-desire explanations feeling "spooky" without grounding.

  Next, the teleology trap. The word "function" will immediately trigger everyday associations (conscious purposes, causal roles). I should block that misconception upfront by distinguishing Darwinian functions from intentions. The frog's fly-snapping mechanism is perfect here—it's simple, biological, and clearly shows failure states (snapping at BBs). Crucially, it lacks learning/culture to avoid sidetracks. 

  Timing breakdown: motivation (5 min), teleology (15 min), then teleosemantics itself (15 min). The frog example carries both parts: first establishing proper function (snapping evolved to catch flies), then linking it to content (the neural state "means" flies because that's what it was selected for). 

  The "swampman" objection must be addressed explicitly—it's the obvious gap between function and actual content. Dedicating 5 minutes to it shows intellectual honesty and reinforces how teleosemantics ties meaning to evolutionary history, not current dispositions. 

  For the checkpoint question, I want something that tests functional understanding, not parroting. Asking how the frog's state would represent differently if it evolved in another environment forces them to apply the theory—if they grasp that content depends on selection history, they've got it. 

  Notable exclusions: I'm avoiding bee dances because symbolism introduces unnecessary complexity. Also skipping learning/cultural examples—time is tight, and those require additional layers (derived intentionality) that would derail beginners. 

  The user's anxiety about tangents is valid. Every example choice must preempt misunderstandings: the frog lacks consciousness, learning, and has clear malfunction cases. I'll structure transitions to repeatedly emphasize "selection history, not current use." 

  Final thought: They'll need to stress that this is about *naturalizing* meaning, not analyzing ordinary language. That frame justifies why we care about frogs instead of human beliefs initially.
answer: |-
  Here’s a streamlined teaching plan for a 40-minute intro to teleosemantics, optimized for non-specialists:

  1.  **Motivation: Why Naturalize Content? (7 mins)**  
      Start with the "problem": intentionality (aboutness) in nature. Beliefs *represent* things (e.g., "water is wet"). How can physical brains do this? Contrast with easier-to-naturalize concepts (causation, computation). Frame it as completing the naturalistic project: **"If minds are part of nature, 'meaning' must be too."** Avoid deep metaphysics; focus on the explanatory gap.

  2.  **Teleology ≠ Purpose (15 mins)**  
      **CRUCIAL:** Head off "function" misconceptions *immediately* after introducing the term.  
      - **Mistake 1:** "Function" as *conscious intention* (a watchmaker). **Block:** "Evolution isn't a designer."  
      - **Mistake 2:** "Function" as *current causal role* (what something *does*). **Block:** "Broken hearts still pump blood poorly, but their function is pumping."  
      - **Core Concept:** Introduce **Proper Function (Millikan)**: What a trait was *selected for* by evolution/natural selection. *Why* does the trait exist? (e.g., the heart *exists because* ancestors pumped blood successfully).  
      - **Key Example: Frog Tongue-Snap Mechanism:**  
          *   Trait: Neural mechanism triggering tongue-snap at small, dark, moving dots.  
          *   Proper Function: Catch flies (nutritious food). *Why?* Ancestors catching flies reproduced better.  
          *   **Malfunction Highlight:** Frog snaps at BB pellets (fails function). **This shows function ≠ current causal role.**

  3.  **Teleosemantics: Linking Function to Content (10 mins)**  
      - Apply proper function to *representations* (e.g., neural states).  
      - **The Core Thesis:** What a representation is *supposed to map to* (its **content**) is determined by **what its successful use historically corresponded to, enabling the performance of its proper function.**  
      - **Frog Example Extended:**  
          *   Representation: Neural state triggered by small, dark, moving dots.  
          *   Proper Function of *using* this state: Cause successful fly-catching.  
          *   **Content:** The state *represents* FLY (or "food here!"). *Why?* The mechanism producing it was selected *because* ancestors' states co-occurred with flies, and snapping *at flies* led to success.  
      - **Address "Supposed to Do vs. Represents" Objection HERE:**  
          *   "Isn't this just what it's *supposed* to do, not what it *means*?"  
          *   **Response:** For teleosemantics, the *meaning just is* what it's supposed to correspond to for the system to function properly as selected. The successful mapping *is* the representational content. (Mention Millikan's "Normal Conditions" briefly if needed).

  4.  **Transition to Millikan (3 mins)**  
      Summarize: Teleosemantics naturalizes meaning via evolutionary proper function. Millikan provides the rigorous framework for this. Pose your...

  5.  **Understanding Check Question (End, or seed for discussion):**  
      **"Imagine the frog's tongue-snap mechanism actually evolved because its ancestors lived near pebbles rolling down slopes, and snapping at them helped dislodge nutritious lichen. What would the neural state triggered by small, dark, moving dots represent *now*, and why?"**  
      *(Correct Answer: Pebbles/Lichen. Because the selection history determines the content, not the current environment or disposition.)*

  **Why the Frog (Not Bee Dance) is Ideal:**  
  *   **Biologically Basic:** Innate, not learned (avoids derived intentionality).  
  *   **Clear Malfunction:** Snapping at BBs shows function ≠ causal role.  
  *   **Direct Sensing:** Avoids symbolic complexity (like bee dance patterns).  
  *   **Intuitive Selection History:** Easy to grasp why catching flies was selected for.

  **Timing Buffer:** Stick to these time limits rigidly. Cut elaboration for Q&A/discussion. Focus on the frog example relentlessly to carry the load.
