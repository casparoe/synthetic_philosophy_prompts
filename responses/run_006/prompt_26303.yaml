prompt: |-
  My mate's doing a PhD on analogical reasoning and she's been sorting analogies into "deep" and "shallow" for some project. I've been keeping track of her classifications and they're:

  - Heart is a pump → deep
  - Clouds are cotton wool → shallow
  - A computer virus is like a biological virus → deep
  - Electric current is like water flowing through pipes → deep
  - A nation is like a person → shallow
  - DNA is like a language → deep
  - An atom is like a tiny solar system → shallow
  - Natural selection is like a sieve → deep

  She's about to classify "a society is like an organism," and I want to guess what she'll say before she tells me. I reckon there are at least two different rules she could be running that fit all her verdicts so far, and they'd come apart on this new case. What are the candidate rules, what does each one predict for the society/organism case, which rule do you think she's actually using and why, and what's one more case I could give her that would settle which rule it is for good?

  (And if you can write the answer in British English that'd be ideal, cheers.)
