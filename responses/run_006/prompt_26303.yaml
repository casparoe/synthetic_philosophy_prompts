  - Heart is a pump → deep
  - Clouds are cotton wool → shallow
  - A computer virus is like a biological virus → deep
  - Electric current is like water flowing through pipes → deep
  - A nation is like a person → shallow
  - DNA is like a language → deep
  - An atom is like a tiny solar system → shallow
  - Natural selection is like a sieve → deep

  Now, I need to predict how she'll classify "a society is like an organism." The key is that there are at least two possible rules that fit all the past classifications but might diverge here.

  Looking at the deep analogies:
  - Heart/pump: Both involve moving fluids (blood/water) through systems.
  - Computer virus/biological virus: Both replicate and spread, causing harm to their hosts.
  - Electric current/water flow: Both deal with flow dynamics, pressure/voltage, resistance/friction.
  - DNA/language: Both store and transmit complex information via codes.
  - Natural selection/sieve: Both filter based on specific traits/survivability.

  Shallow ones:
  - Clouds/cotton wool: Superficial similarity in appearance (fluffy, white).
  - Nation/person: Likely based on anthropomorphism without deeper structural parallels.
  - Atom/solar system: Outdated model; electrons don't orbit like planets; focuses on visual similarity.

  Candidate Rule 1: **Functional/Structural Similarity**
  - Deep analogies share underlying functions or structures (e.g., mechanisms, processes).
  - Shallow analogies are based on surface features (appearance, basic metaphors).

  Candidate Rule 2: **Explanatory Power in Science**
  - Deep analogies are those used productively in scientific explanations (even if simplified).
  - Shallow analogies are either misleading or abandoned in scientific contexts.

  Now, applying these to "society as organism":
  - Rule 1: Societies and organisms both have interdependent parts (organs/institutions), growth, and metabolism (economy). Likely **deep**.
  - Rule 2: The organismic analogy in sociology (e.g., Spencer) is largely outdated and criticized for being reductive. Likely **shallow**.

  Her past classifications align with scientific validity:
  - Deep: Pump (physiology), viruses (cybersecurity), electricity (physics), DNA (molecular biology), natural selection (evolution).
  - Shallow: Atom/solar system (replaced by quantum models), nation/person (anthropomorphism without mechanism).

  Thus, Rule 2 seems more consistent. A society/organism analogy would be **shallow** under this rule.

  To test this, propose: **"A brain is like a computer."**
  - Rule 1: Functional parallels (processing, memory) → deep.
  - Rule 2: The computational brain metaphor is contested in neuroscience (oversimplifies neural processes) → shallow.

  Her response would clarify the rule: if shallow, she's likely using Rule 2.
answer: |-
  Right, I'll break this down for you step by step, just like we're having a proper chinwag over a cuppa. Your mate's classifications so far are a fascinating mix, and you're spot-on that there are at least two distinct rules that could explain her "deep" versus "shallow" calls—both fitting all her past verdicts but potentially diverging on "a society is like an organism." I'll outline the candidate rules, predict what each says for the new case, take a stab at which one she's *actually* using based on the patterns, and suggest a killer test case to settle it. I'll keep it in British English, no worries—cheers for asking.

  ### Step 1: The Candidate Rules
  From her classifications, two plausible rules emerge. Both focus on *why* an analogy is useful or insightful, but they prioritise different things:

  - **Rule 1: Functional/Causal Mechanism Focus**  
    An analogy is "deep" if it maps *underlying functional or causal mechanisms* (e.g., how things work, processes, or systems) between domains. It's "shallow" if it relies on superficial, structural, or descriptive similarities (e.g., appearance, basic properties, or anthropomorphism) without capturing deeper mechanics.  
    - *Why it fits the data*:  
      - Deep: "Heart is a pump" shares pressure/flow mechanics; "computer virus like biological virus" shares replication/infection processes; "electric current like water flow" shares resistance/pressure dynamics; "DNA like a language" shares encoding/transmission; "natural selection like a sieve" shares filtering/selection.  
      - Shallow: "Clouds are cotton wool" is visual fluff; "nation like a person" anthropomorphises without mechanics; "atom like tiny solar system" is structural but misleading on forces.  

  - **Rule 2: Scientific Utility and Validity**  
    An analogy is "deep" if it has been *productively used or validated in scientific contexts* to explain, predict, or guide research, even if simplified. It's "shallow" if it's misleading, outdated, or primarily poetic/metaphorical without robust scientific grounding.  
    - *Why it fits the data*:  
      - Deep: Pump analogy is core in physiology; virus analogy drives cybersecurity; water flow is standard in teaching circuits; DNA-language is key in genomics; sieve analogy is common in evolutionary biology.  
      - Shallow: Clouds-cotton wool is artistic; nation-person is social metaphor with little science; atom-solar system is an abandoned model in physics (quantum theory superseded it).  

  Both rules cover all eight cases perfectly, but they’re philosophically different—Rule 1 cares about *how* the analogy works mechanistically, while Rule 2 cares about *whether science has endorsed it*.

  ### Step 2: Predictions for "A Society is Like an Organism"
  Now, for your new case—"a society is like an organism" (e.g., society has "organs" like institutions, "health" like stability, etc.). The rules split here:
  - **Rule 1 (Functional Mechanism) predicts DEEP**:  
    Societies and organisms both involve interdependent parts (e.g., institutions/organs serving functions), homeostasis (e.g., economy regulating like metabolism), and growth/adaptation. This maps causal mechanisms—how systems sustain themselves—making it "deep" by functional standards.  
  - **Rule 2 (Scientific Utility) predicts SHALLOW**:  
    While this analogy was pushed by thinkers like Herbert Spencer (social Darwinism), it's largely discredited in modern social science. It's seen as reductive, biologically deterministic, and not empirically useful—more a poetic metaphor than a tool for testable theories. So, it's "shallow" for lacking scientific validity.  

  ### Step 3: Which Rule is She Likely Using? (And Why)
  Based on her classifications, I reckon she's using **Rule 2 (Scientific Utility)**. Here's why:
  - **Patterns in her "deep" calls**: All are well-established in their fields. For instance:  
    - "Heart is a pump" is textbook medicine.  
    - "Computer virus like biological virus" is foundational in IT security (inspired by real biology).  
    - "Natural selection like a sieve" is a standard teaching tool in biology.  
    - Even "DNA is like a language" is central to genetics (e.g., the "genetic code").  
  - **Patterns in her "shallow" calls**: Both are scientifically problematic:  
    - "Atom like tiny solar system" was discarded with quantum mechanics.  
    - "Nation like a person" is a metaphor, not a mechanistic model (e.g., no credible theory treats nations as biological entities).  
  - **Why Rule 1 doesn't fit as neatly**:  
    - "Clouds are cotton wool" could *mechanically* map to fluid dynamics (e.g., both involve soft, dispersed materials), but she called it shallow—suggesting she values scientific rigour over potential mechanistic links.  
    - Conversely, "nation like a person" has some functional parallels (e.g., decision-making like a brain), but she dismissed it, implying she prioritises whether science actually uses it.  

  Her PhD likely involves analogies in *explanatory science*, so Rule 2 makes sense—it's about utility in knowledge-building, not just abstract mappings.

  ### Step 4: A Test Case to Settle It for Good
  To crack this, you need a case where Rule 1 and Rule 2 give opposite verdicts. Try this:  
  **"A brain is like a computer."**  

  - **Rule 1 (Functional Mechanism) says DEEP**:  
    It maps mechanistic parallels: both process information (neurons/transistors), store memories (synapses/memory), and run "programmes" (e.g., neural networks/algorithms).  
  - **Rule 2 (Scientific Utility) says SHALLOW**:  
    While popular in early cognitive science, this analogy is now contentious. Neuroscience shows brains aren't "computational" like digital devices—they're messy, analogue, and context-dependent. It's seen as an oversimplification that misleads research (e.g., ignoring embodied cognition).  

  **How it settles things**:  
  - If she calls it **deep**, she’s likely using Rule 1 (functional mechanisms).  
  - If she calls it **shallow**, she’s likely using Rule 2 (scientific utility).  
  This works because it directly pits mechanism against scientific validity—and her verdict would align with one rule while contradicting the other.  

  ### Final Thoughts
  My money’s on her choosing **shallow for "society like an organism"** based on Rule 2. But give her the test case to be sure—it’s a belter for exposing her rule. If you’re nattering about this over a pint, let me know how it goes. Good on you for helping out with her PhD grind!
