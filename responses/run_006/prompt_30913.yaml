prompt: |-
  I've been teaching a grad seminar on late nineteenth-century philosophy and the rise of professionalized psychical research, and I want to give my students a puzzle about Sidgwicks evidential standards — not the metaphysics, just the way he treated cases. No sources needed, just think it through.

  Here's the track record, as I've reconstructed it. I'm not quoting anyone, just summarizing what the man actually did, according to the standard story anyway.

  - In 1863, Sidgwick and a friend messed around with table-turnings and got raps and movements that Sidgwick was convinced weren't caused by anyone present. He thought the phenomena were real but didn't take them as evidence of spirits.
  - In the mid-1870s he and Eleanor sat with a bunch of professional mediums and came away largely disillusioned: most of it looked like fraud or self-deception, and they rejected those particular sittings.
  - But he was impressed by Crookes's reports on D.D. Home, who produced strong physical phenomena under Crookes's observation; Sidgwick seems to have thought at least some of Home's stuff was probably genuine.
  - When William Barrett and others started reporting thought-transference experiments, Sidgwick took them seriously and ended up convinced that telepathy between living persons is real, at least under some conditions.
  - At the 1895 Cambridge sittings with Eusapia Palladino, the phenomena were caught out as trickery under tightened controls, and Sidgwick judged her fraudulent.
  - With Leonora Piper, the American trance medium, he thought the data were genuinely impressive and hard to explain by ordinary means — she kept producing veridical information about dead people known to the sitters — but he still wouldn't infer survival, because telepathy from the sitters (or from living sources nearby) seemed like a live alternative.

  Now suppose a new case lands on my desk. A trance medium gives a sitting to a sitter who never met the deceased and knows almost nothing about them. The medium produces a detailed statement about a specific event in the deceased's life. The event was never told to anyone while the deceased was alive, and no living person knew of it. The day before the sitting, the deceased, while alive, had written the memory down and sealed it in an envelope, but the envelope stayed in a safe deposit box until after the sitting, when it was opened and the details matched. The medium had no access to the box, and fraud seems out.

  My question is: given Sidgwick's earlier rulings, what should he say about this? I'm less interested in the final answer than in the implicit rule he's running. What other rule fits his verdicts just as well? What does each rule predict about the sealed-envelope case? Give me your best guess about which rule is really his and why, and then give me a further case — a hypothetical or real one — that would cleanly distinguish the two.
reasoning: |-
  Okay, let me think through this Sidgwick puzzle step by step. The professor wants to understand Sidgwick's implicit evidential standards through this sealed-envelope medium case.

  First, I need to recall all the historical cases mentioned. Sidgwick consistently rejected spirit explanations even when phenomena seemed genuine: table-turning (1863) - real but not spirits; professional mediums (1870s) - mostly fraud; Crookes/Home - possibly genuine phenomena but not proof of spirits; thought-transference - accepted telepathy but still not spirits; Palladino - fraud; Piper - impressive but telepathy alternative exists.

  Now this new case seems designed to block the telepathy explanation. No living person knew the event, and it was physically sealed away. But Sidgwick would probably still reject it as spirit evidence. Why? Because his pattern suggests he requires not just ruling out fraud and telepathy, but also some positive evidence that uniquely points to spirits. Telepathy between the medium and the deceased before death? Or some other naturalistic explanation we don't know yet? 

  The sealed-envelope case actually highlights his core principle: survival claims require eliminating all conceivable natural explanations, not just known ones. His bar is impossibly high because he's fundamentally committed to methodological naturalism - spirits can't be the default explanation even when natural explanations seem exhausted. 

  To test this, I could propose a variation: what if multiple mediums independently describe the same sealed event? Or if the event involves future contingencies? But Sidgwick would likely still reject it, clinging to unknown natural laws. His true rule seems to be "spirit explanations are categorically inadmissible regardless of evidence." The sealed-envelope case wouldn't change his mind - it would just make him dig harder for alternative explanations.
answer: |-
  Based on Sidgwick's pattern of adjudicating psychical cases, here's the analysis of the sealed-envelope case and the implicit rules at play:

  **Sidgwick's Likely Verdict on the Sealed-Envelope Case:**  
  He would **reject** it as evidence for survival. Despite the apparent impossibility of telepathy or fraud, he would likely invoke an alternative naturalistic explanation:  
  - **Cryptomnesia or Super-ESP:** The information *could* have been telepathically extracted from the deceased *while they were still alive* (before sealing the envelope), and retained by the medium until the sitting.  
  - **Unknown Natural Law:** He might posit an undiscovered form of psychometry (object-reading) or temporal telepathy allowing access to the written record despite physical barriers.  

  **The Implicit Rule Sidgwick Follows (Rule A):**  
  ***"Survival can only be inferred if a phenomenon is (1) genuinely paranormal, (2) *impossible* to explain by telepathy or other known/plausible natural mental faculties of the living, *and* (3) displays characteristics *unique* to discarnate intelligence (e.g., purpose, identity, knowledge beyond any living mind's access)."***  

  **Alternative Rule That Also Fits His Verdicts (Rule B):**  
  ***"Survival can be inferred only if a phenomenon demonstrates information or agency that *could not* have been sourced from *any* living mind (via telepathy or super-ESP) *at any time* before or during the sitting."***  

  ---

  **How Each Rule Handles the Cases:**  
  | **Case**               | **Sidgwick's Verdict** | **Rule A Prediction** | **Rule B Prediction** |  
  |-------------------------|------------------------|------------------------|------------------------|  
  | **Table-Turning (1863)**| Real, not spirits      | ✓ (No unique agency)  | ✓ (No inaccessible info) |  
  | **Professional Mediums**| Fraud/deception        | ✓ (Not genuine)        | ✓ (Not genuine)        |  
  | **D.D. Home**           | Genuine, not spirits   | ✓ (No unique agency)  | ✓ (Info possibly from living) |  
  | **Thought-Transference**| Telepathy real         | ✓ (Natural faculty)    | ✓ (Natural faculty)    |  
  | **Eusapia Palladino**   | Fraudulent             | ✓ (Not genuine)        | ✓ (Not genuine)        |  
  | **Leonora Piper**       | Impressive, not survival | ✓ (Telepathy alternative exists) | ✓ (Info from living possible) |  
  | **Sealed-Envelope**     | ? (Likely reject)      | ✗ (Fails 3: no unique agency) | **✓** (Meets criterion: no living source possible) |  

  **Rule B** *would* accept the sealed-envelope case as survival evidence, as no living mind ever accessed the information. **Rule A** rejects it because the phenomenon lacks "discarnate signatures" (e.g., interactive identity, purpose) and could still be explained by expanded telepathy.  

  ---

  **Why Rule A is Likely Sidgwick's True Rule:**  
  1. **Telepathy as a Moving Goalpost:** He consistently allowed telepathy/ESP to expand to cover gaps (e.g., Piper’s dead-specific info was attributed to telepathy from distant living relatives). The sealed-envelope case doesn’t force him to abandon this strategy.  
  2. **Demand for Discarnate Agency:** He sought phenomena that *behaved* like a spirit (e.g., intent, personal identity, interactive knowledge) – not just inaccessible information. The sealed envelope provides data, not agency.  
  3. **Philosophical Caution:** Sidgwick treated survival as an extraordinary claim requiring extraordinary evidence *beyond* mere anomaly. Rule A reflects his Humean skepticism about inferring unseen entities without positive markers of their identity.  

  ---

  **A Case to Distinguish Rule A vs. Rule B:**  
  **The "Interactive Anomaly" Hypothetical:**  
  > *A medium produces verifiable, specific details about a deceased person’s unpublished childhood diary (destroyed decades earlier with no witnesses). Crucially, the medium* interacts *with the sitter: correctly answers novel questions about the diary’s content, critiques the sitter’s mistaken beliefs about the deceased, and references a* current event *unknown to the sitter but later verified (e.g., "Tell my sister I saw her drop her ring in the garden yesterday – it’s under the rosebush"). No living person could know these details.*  

  - **Rule A Prediction:** Accepts as survival evidence. It satisfies all criteria:  
    - Genuine paranormality (inaccessible info + real-time interaction).  
    - Telepathy/super-ESP excluded (novel information generated *during* sitting).  
    - Unique discarnate signatures (interactive intent, identity, knowledge of post-mortem events).  
  - **Rule B Prediction:** Rejects. Rule B only requires *inaccessible information*, not agency. This case adds no *new* informational barriers beyond the sealed-envelope – it just adds behavior. Rule B would demand a sealed envelope *plus* interaction, but still reject without unique agency.  

  **Why this distinguishes them:**  
  - Rule A demands *performance* that mimics a conscious discarnate entity.  
  - Rule B only demands *information* with no living source.  
  Sidgwick (Rule A) would accept the Interactive Anomaly case due to its agential qualities, despite Rule B deeming it redundant after the sealed envelope. His treatment of Piper’s "personation" (which he found impressive but insufficient) aligns with this – he wanted the *persona* to demonstrate independent cognition, not just accurate data.
