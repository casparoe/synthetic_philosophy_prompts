prompt: |-
  I'm a systems designer at a mid-size game studio. My job involves designing mechanics and the systems that teach players how to use them — tutorials, difficulty curves, feedback loops, the whole onboarding pipeline. Over the years I've developed a working vocabulary for a distinction I don't have a proper name for. On one side, there's the knowledge you can put in a tooltip or a tutorial pop-up: "pressing L1 at the right moment parries the attack, leaving the enemy staggered for 1.2 seconds." A player can read that, understand it, and repeat it back. On the other side, there's the knowledge that only comes from doing: the feel of the parry window, the ability to read an enemy's wind-up animation and react in time, the judgment to know whether parrying or dodging is the right call in a chaotic fight. You can explain the first kind perfectly and the player still won't have the second. I've been trying to design a game where the onboarding is as smooth as possible, and I keep running into the same wall: some things simply will not transmit through text, diagrams, or video, no matter how clear you make the explanation.

  A friend who studied philosophy told me that a philosopher named Gilbert Ryle wrote about exactly this in the 1940s. He called it the difference between "knowing how" and "knowing that," and he argued that knowing-how is not just a matter of having a stock of true propositions in your head that you then somehow execute. He had a regress argument: if every intelligent action required first consulting an internal proposition about how to act, you'd need a further skill to know how to apply that proposition to the situation at hand, and so on infinitely. That stopped me short, because it sounds like something I've observed in playtesting: you can give a player a perfect written breakdown of boss patterns and they'll still freeze up, because reading the breakdown and using it in real time are two different capacities, and the second one can't itself be supplied by another written breakdown.

  I'd like you to take on the role of someone who is both a professional philosopher and fluent in game design thinking. Restate Ryle's knowing-how / knowing-that distinction — and his argument that the former cannot be reduced to the latter — entirely in the vocabulary I work with: explicit vs. implicit tutorials, declarative knowledge vs. procedural skill, knowledge checks vs. execution checks, skill floors and ceilings, the difference between consulting frame data and having the muscle memory to act on it, and anything else in that neighborhood you find useful. Be as precise and honest as you can. Then give me what I'll call the residue report: which parts of Ryle's position translate cleanly into that vocabulary, which parts you had to stretch or distort to make fit, and which parts seem to have no expression in game-design terms at all. Finally, tell me what you make of the residue: does it point to something game design is missing conceptually, or does it suggest that Ryle's argument is less airtight than it looks once you try to operationalize it in a concrete domain?
reasoning: |-
  Okay, the user is a systems designer at a mid-size game studio. They're dealing with the challenge of designing tutorials and onboarding systems that effectively teach players both explicit knowledge (like tooltips) and implicit skills (like timing a parry). They mentioned Gilbert Ryle's "knowing that" versus "knowing how" distinction, which their philosopher friend pointed out. 

  The user wants me to role-play as someone who's both a professional philosopher and fluent in game design. I need to restate Ryle's concepts using game design terminology like explicit vs. implicit tutorials, declarative vs. procedural knowledge, skill floors/ceilings, etc. Then I have to analyze how well Ryle's ideas map to these terms, pointing out where they fit cleanly, where they're stretched, and where there's no equivalent. Finally, I should discuss the "residue" and what it means for game design or Ryle's argument.

  First, I recall Ryle's core argument: "knowing that" (propositional knowledge) can't be reduced to "knowing how" (practical skill) because that would lead to an infinite regress. If every action required consulting a rule, you'd need another rule for applying the first rule, and so on. This resonates with the user's experience where players understand a tooltip but can't execute the action in real-time.

  In game design terms:
  - Explicit tutorials cover "knowing that" - the declarative knowledge you can state verbally or in text.
  - Implicit tutorials aim to build "knowing how" - the procedural skills developed through practice.
  - Skill floor represents the minimum ability needed to perform a basic action (where "knowing how" begins).
  - Skill ceiling is mastery level, where the procedural knowledge becomes fluid and automatic.

  The clean mappings:
  - Declarative knowledge = "knowing that" (both about facts and rules)
  - Procedural skill = "knowing how" (both require practice to develop)
  - Execution barrier = the gap between understanding a rule and being able to apply it, which aligns with Ryle's regress argument.

  The strained mappings:
  - Feedback loops might help build "knowing how," but Ryle's point is more fundamental - no amount of feedback can directly implant a skill; the player must develop it through practice.
  - Frame data is "knowing that," but muscle memory is "knowing how." However, in fighting games, top players blend both, which Ryle might not fully account for.

  The residue (where Ryle doesn't map cleanly):
  - Ryle rejects the "intellectualist legend" that all knowledge is propositional. Game design doesn't have an equivalent concept; it's more pragmatic about using multiple methods to teach skills.
  - Ryle's regress argument is theoretical, while game design focuses on observable player behavior. The infinite regress doesn't manifest in practice because players build skills incrementally.
  - Game design sees knowledge as layered (e.g., frame data informs practice), whereas Ryle treats "knowing how" as distinct.

  What the residue means:
  - Game design isn't missing concepts; it's more applied. Designers use scaffolding (like visual cues) to bridge the gap between "knowing that" and "knowing how," which addresses Ryle's regress practically.
  - Ryle's argument holds that skills can't be reduced to facts, but in games, declarative knowledge can accelerate skill acquisition. His absolute separation might be too rigid.
  - The key takeaway: Designers can't bypass the need for practice, but they can create better implicit tutorials that guide players toward developing procedural skills naturally.

  The user might be looking for validation of their design challenges and practical insights to improve tutorials. They probably want to know how to better bridge the gap between explicit explanations and implicit skills without expecting text/video to do the impossible. Emphasizing iterative practice and feedback loops would be helpful.
answer: |-
  ### Ryle's Distinction in Game Design Vocabulary
  As a philosopher embedded in game systems design, let's reframe Ryle's "knowing-that" (propositional knowledge) vs. "knowing-how" (procedural skill) using your operational toolkit:

  - **Explicit Tutorials (Knowing-That)**  
    *What they deliver:* Declarative knowledge. Facts, rules, relationships.  
    *Examples:* Tooltips ("Parry window = 8 frames after L1 press"), boss pattern diagrams, damage multipliers in menus.  
    *Design function:* Establishes the **skill floor**—the minimum knowledge threshold for attempting an action.  
    *Limitation:* Pure information transfer. Like reading frame data without the muscle memory to act on it.  

  - **Implicit Tutorials (Knowing-How)**  
    *What they build:* Procedural skill. Embodied timing, pattern recognition, adaptive decision-making.  
    *Examples:* Gradual enemy attack telegraphing, dynamic difficulty tuning, fail-states with embedded feedback (e.g., a 0.5s slow-mo on failed parry to highlight mistiming).  
    *Design function:* Creates **skill ceilings**—the mastery curve where knowledge becomes intuition.  

  - **The Execution Barrier**  
    Ryle's regress argument maps cleanly to your playtesting observation:  
    *Declarative knowledge* (boss pattern spreadsheet) → *requires* → *Procedural skill* (executing dodge/parry decisions in real-time) → *which requires* → *Meta-skill* (adapting to animation quirks, input lag, stress).  
    **Game design translation:** No amount of "knowing-that" (tutorial pop-ups) can bypass the **execution check**—the moment where cognitive load shifts from recall to reflex. This is where your players freeze.  

  - **Feedback Loops as Anti-Regress Tools**  
    Ryle’s infinite regress ("How do you apply the rule for applying rules?") is countered by iterative feedback:  
    - A well-timed parry → screen shake + sound → dopamine hit → **reinforcement without cognition**.  
    - A mistimed parry → enemy counterattack → respawn closer to boss → **error-driven calibration**.  
    This transforms declarative knowledge into embodied skill through failure recovery cycles.  

  - **The Muscle Memory Gap**  
    "Knowing-that" L1 parries is useless without:  
    - **Temporal embodiment**: Feeling the 8-frame window in your synapses.  
    - **Contextual judgment**: Recognizing when parrying *this* enemy in *this* combo is riskier than dodging.  
    This is why video demonstrations fail: They show *what* success looks like, not *how* to achieve it under pressure.  

  ---

  ### The Residue Report: Where Ryle and Game Design Diverge  

  | **Concept**               | **Translation Cleanliness** | **Notes**                                                                 |
  |---------------------------|-----------------------------|---------------------------------------------------------------------------|
  | **Knowing-That ≠ Knowing-How** | ★★★★★                       | Perfect fit for explicit vs. implicit knowledge. Core distinction holds.  |
  | **Ryle’s Regress Argument** | ★★★★☆                       | Cleanly explains execution barriers, but games *scaffold* the regress via tiered challenges (e.g., parry trainer dummies → mobs → bosses). |
  | **"Intellectualist Legend" Critique** | ★★☆☆☆ | Ryle’s claim that Western philosophy overvalues "knowing-that" doesn’t map—game design *embraces* procedurality. |
  | **Skill as Non-Intellectual** | ★☆☆☆☆                     | Ryle treats "knowing-how" as fundamentally non-cognitive. But games blend cognition/reflex (e.g., reading tells *while* executing). |
  | **Anti-Reductionism**     | ★★★☆☆                       | Knowing-how can’t be *reduced* to facts, but game data (frame counts, hitboxes) *scaffolds* skill acquisition. Partial stretch. |

  **Key Residual Elements with No Game Design Equivalent:**  
  1. **Ryle’s Metaphysical Claim**: That "knowing-how" is ontologically primitive (i.e., not derived from facts). Game design is pragmatic: We don’t care *why* skill develops, only *how to foster it*.  
  2. **The Ghost in the Machine Critique**: Ryle attacked Cartesian dualism (mind vs. body). Games functionally bypass this via sensorimotor loops (controller vibrations → neural adaptation).  
  3. **Infinite Regress as Abstraction**: Ryle’s regress is logical, not temporal. In games, players *do* build meta-skills incrementally (e.g., practicing parry timing before layering decision-making).  

  ---

  ### What the Residue Tells Us  
  **Where Game Design Is Conceptually Thin:**  
  Ryle exposes a blind spot: We lack a rigorous vocabulary for **embodied cognition**—*how* sensory feedback (e.g., controller haptics, animation fluidity) converts rules into intuition. We call it "feel," but it’s under-theorized.  

  **Where Ryle’s Argument Frays in Practice:**  
  His absolute "no reduction" claim stumbles when faced with modern learning systems:  
  - **Scaffolded Hybridization**: A player studies frame data (knowing-that) → practices against a slowed-down enemy (bridging gap) → internalizes timing (knowing-how).  
  - **Predictive Analytics**: Tools like heatmaps show *where* players fail execution checks, letting us tweak implicit tutorials. Ryle couldn’t foresee data-driven skill mapping.  

  **The Pragmatic Takeaway:**  
  Ryle was right that you can’t *replace* procedural skill with declarative knowledge. But he underestimated how intelligently designed systems can **accelerate the conversion** of one into the other. Your "wall" isn’t a failure—it’s the natural boundary between information and embodiment. The solution lies not in clearer explanations, but in *orchestrated failure states* that make mistiming *teach* faster than success.  

  **Design Directive:** Stop trying to "explain" parry timing. Instead, engineer scenarios where:  
  1. The *first* enemy attack has a 400ms telegraph (visually exaggerated wind-up).  
  2. On failure, the game slows to 50% speed for 1 retry.  
  3. On success, the next attack shortens the telegraph by 50ms.  
  This compresses Ryle’s regress into a feedback spiral—**knowing-how emerges through calibrated friction**.
