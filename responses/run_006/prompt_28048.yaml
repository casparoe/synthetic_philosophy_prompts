  Hmm, this is a classic ethics dilemma with layers. First, I need to carefully reconstruct both arguments. Marcus is strictly adhering to Augustinian internal consistency: soul-corruption as the primary harm, distinction between act and consequence, and technical truth-telling as escape hatch. Jenna's critique has four prongs: definitional (1), empirical (2-3), and meta-ethical (4). 

  Interesting how Jenna's first point exposes a circularity risk in Augustinian definitions - if "lie" is defined as "wrongful deception" by default, it pre-judges the moral analysis. Her second point about variable harm to the soul seems particularly strong against rigid universalism. But Marcus is right that within Augustine's framework, consequence-blindness is the whole point - it's about maintaining moral purity regardless of outcomes.

  The practical dimension (point 3) feels crushing though. Marcus's "just be evasive" solution collapses under real-world pressure: Nazis weren't parsing semantic nuances. This reveals a tension in absolutist positions - they often rely on hypothetical scenarios where clever phrasing works, unlike actual genocidal emergencies. 

  Theology looms large (point 4). Jenna correctly notes Augustine prioritizes infinite soul-value over finite lives, but Marcus counters that this makes his position coherent within Christianity. The user's request for a non-theological resolution is key here. Maybe consequentialism offers one path? But even utilitarians debate whether lying in extremis erodes general truth-trust. 

