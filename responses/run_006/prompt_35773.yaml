  Okay, the user is an ethics professor designing a final exam question. They need a sophisticated essay prompt on moral worth and acting for the right reasons, specifically targeting the tension between motivating reasons versus right-making reasons. 

  Hmm, their core pedagogical challenge is avoiding rote answers—this needs to force original thinking. The crux they described is razor-sharp: the identity/coincidence problem of reasons, plus the moral description requirement, all tested against a hard case of "right act, wrong belief." 

  *Scratching head* Better make the case vivid. The "racist rescue" scenario seems perfect—objectively right action (saving life) done for objectively right-making reason (preventing harm) but with subjectively awful motivation (racist hierarchy). It crystallizes all three layers: agent's motive (preserve racial order), actual right-maker (preserve life), agent's moral view (thinks it's wrong to save them). 

  *Checking notes* The prompt must explicitly demand: 
  1. Distinguish motivating reason vs right-making reason vs agent's moral belief 
  2. Analyze whether motivating reason must match right-making reason 
  3. Debate the "moral description" requirement 
  4. Apply to the hard case 
  5. Take a clear stance 

  For the model answer... *tapping pen* Should demonstrate how to wrestle with Kantian vs coincidence views without regurgitating. Key moves: reject simple views, dissect the hard case, propose "recognition-but-not-necessarily-endorsement" via Arpaly. Save the "moral description" nuance for last—that's the killer point. 

  Marking scheme needs surgical precision. Five 4-point criteria: 
  - Separation of concepts (students often conflate them) 
  - Identity/coincidence debate (they'll oversimplify Kant) 
  - Hard case application (might dodge the tension) 
  - Stance-taking (could be wishy-washy) 
  - Moral description analysis (most will miss the non-endorsement twist) 

  *Pausing* User's clearly expert—no need to dumb down. Just deliver the philosophical scalpel they asked for. The racist rescue case might ruffle feathers, but it's ethically sterile (no real harm) and philosophically fertile. Alternative was "saving rival out of spite," but this has sharper moral dissonance. 

  Final sanity check: Does this answer in 75 minutes? With prep, yes—it's dense but focused. Model answer at 700 words keeps it tight. Marking scheme rewards depth, not length. 

  *Nodding* All boxes checked. Time to write.
answer: |-
  Here is the exam question, model answer, and marking scheme designed to meet your specifications:

  **Exam Question**  
  "Many philosophers hold that an action has moral worth only if it is done for the right reasons. However, significant disagreement exists about what this entails. Carefully distinguish between (a) the reason that *motivates* the agent, (b) the reason that *actually makes the action right*, and (c) the agent’s *own understanding* of why the action is right (if they believe it is right).  

  Evaluate whether moral worth requires the *motivating reason* to be *identical* to the *right-making reason*, or whether mere *coincidence* suffices. Then, apply your view to the following hard case:  

  > *Estelle sees a child drowning in a lake. The child belongs to a racial group Estelle believes is ‘inferior.’ She saves the child solely because she thinks ‘People like me must demonstrate our superiority through heroic acts.’ Unbeknownst to Estelle, her action is objectively right because it prevents a grievous harm. However, Estelle sincerely believes saving the child is* morally wrong *overall, as she thinks it ‘misguidedly undermines natural hierarchy.’*  

  Does Estelle’s action have moral worth? Defend your position by addressing the relationship between her motivating reason, the right-making reason, and her moral beliefs."  

  ---

  **Model Answer (Approx. 700 words)**  

  The question of moral worth hinges on whether an agent’s motivating reason aligns with the reason that actually makes their action right. I argue that moral worth requires the motivating reason to *track* the right-making reason under a morally salient description, but not necessarily that the agent *endorses* it as morally right. Mere coincidence is insufficient; the agent must be responsive to the right-making property, even if they misinterpret its moral significance.  

  First, we must distinguish three elements:  
  1. **Motivating Reason (Estelle’s: "demonstrate racial superiority")**: The psychological ground for the agent’s action.  
  2. **Right-Making Reason (Preventing grievous harm)**: The objective feature that confers moral rightness.  
  3. **Agent’s Moral Understanding (Estelle’s: "undermines natural hierarchy")**: The agent’s belief about why the act is right/wrong.  

  For moral worth, Kantians insist the motivating reason must be *identical* to the right-making reason under a moral description (e.g., "I ought to prevent harm"). Conversely, coincidence views (e.g., some consequentialists) hold that any motivation triggering the right act suffices. Both extremes fail. Kantians overintellectualize by requiring explicit moral framing, while coincidence views ignore the agent’s moral responsiveness.  

  A middle position is preferable: moral worth demands that the agent’s motivating reason *non-accidentally connects* to the right-making reason. As Arpaly argues, the agent must be motivated by the *same considerations* that make the act right, even if not under a moral label. This ensures the action expresses good will toward the right-making feature. Coincidence (e.g., saving a life to win a bet) lacks this connection; the agent isn’t responsive to the *moral* property.  

  Now consider Estelle:  
  - Her *motivating reason* ("demonstrate superiority") coincides with the *right-making reason* (preventing harm) because saving the child objectively prevents harm.  
  - Yet her *moral understanding* is inverted: she believes saving the child is *wrong*.  

  Crucially, Estelle’s motivating reason is *not* responsive to the right-making reason. She acts to affirm hierarchy, not to alleviate suffering. The harm-prevention is an unintended side effect; she would abandon the act if it didn’t serve her supremacist goal. Thus, her reason fails to track the right-making property. Even though her action is right, and her motivation references a fact (the child’s vulnerability) tangentially related to harm, her *conception* of that fact ("inferior person needing rescue by superiors") actively distorts its moral significance. Her psychology is hostile to the right-making reason.  

  One might object that since "saving a life" features in both her motivation and the right-making reason, she qualifies under a "coincidence-plus" view. But this ignores that moral worth requires sensitivity to the *moral salience* of the reason. Estelle sees the child’s distress only as a *tool* for dominance, not as a *claim* for aid. Her belief that saving the child is morally wrong further severs her motivation from moral recognition. She acts *despite* believing it wrong, not *because* it is right.  

  Thus, Estelle’s action lacks moral worth. Her case reveals that moral worth requires:  
  1. **Non-accidental alignment**: The motivating reason must be counterfactually sensitive to the right-making property (unlike Estelle).  
  2. **No requirement for moral self-awareness**: Agents need not conceptualize their reason *as* moral (contra Kant), but they must not *repudiate* its moral content (as Estelle does).  

  In conclusion, moral worth demands that the agent’s motivating reason functionally engages with the right-making property, even if imperfectly understood. Estelle fails because her motivation is alienated from—and antagonistic to—the very reason that makes her act right.  

  ---  

  **Marking Scheme (Total: 20 marks)**  
  **A (17–20)**: Hits all 5 criteria below. **B (13–16)**: Hits 3–4 criteria but omits/mishandles 1–2 key nuances.  

  | **Criterion**                                                                                              | **Marks** | **Common Pitfalls (Lowers Score)**                          |
  |------------------------------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------|
  | **1. Clearly distinguishes motivating reason, right-making reason, and agent’s moral understanding.**      | 4         | Conflating motivation with right-making reason or agent’s belief. |
  | **2. Critically evaluates "identity vs. coincidence" debate, rejecting simplistic views.**                 | 4         | Stating a position without engaging counterarguments (e.g., ignoring Kant). |
  | **3. Applies framework to Estelle, addressing ALL elements (motive, right-maker, her belief).**            | 4         | Ignoring her belief it’s wrong or misrepresenting her motive. |
  | **4. Takes a coherent stance on Estelle’s moral worth, justified by the framework.**                       | 4         | Asserting a verdict without linking to prior analysis.      |
  | **5. Addresses whether the agent must "see the reason under a moral description" (e.g., via Estelle’s beliefs).** | 4         | Overlooking her anti-moral self-conception.                 |

  ---

  **Design Rationale**  
  - **The Hard Case**: Estelle forces students to confront whether the *content* of the motivating reason (racial superiority) can "coincide" with the right-maker (preventing harm) while being morally inverted. Her sincere belief that the act is wrong intensifies the tension.  
  - **Anti-Rote Design**: The question avoids named theories (Kant, consequentialism), requiring synthesis. Estelle’s case isn’t covered in standard readings, preventing regurgitation.  
  - **Time Management**: Focused sub-questions (distinction → general framework → application) streamline 75-minute responses.  
  - **Marking Precision**: Criteria isolate distinct philosophical moves, with pitfalls reflecting frequent student errors (e.g., conflating reasons, neglecting counterarguments).
