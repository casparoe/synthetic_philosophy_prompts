prompt: |-
  I run procurement for a mid-size city government and I keep seeing projects turn into dollar auctions — a contractor underbids, we're locked in, change orders pile up, and by year three we're paying double because pulling out would mean paying someone else to redo the work from scratch. I need a procedure my team can use at the RFP stage to flag which procurements are structurally vulnerable to escalation traps, not just which bids look suspiciously low. It should be something we can run in an afternoon for a given RFP, it should distinguish between ordinary competitive pressure and genuine trap structure, and it should be honest about when the procedure says "don't structure the procurement this way" and my boss won't like the answer. Apply it to two cases: a custom software migration where the vendor will have all the institutional knowledge by month six, and a bridge repair where the contractor who does the initial assessment is also bidding for the work.
reasoning: |-
  We are going to design a procedure to flag procurements that are structurally vulnerable to escalation traps (like dollar auctions). The procedure should be efficient (run in an afternoon) and distinguish between ordinary competitive pressure and genuine trap structures.

  Key characteristics of an escalation trap:
  1. High switching costs: Once a vendor is engaged, it becomes very expensive to switch to another vendor because of sunk costs, specialized knowledge, or integration.
  2. Information asymmetry: The vendor gains information or control that the buyer doesn't have, making it hard to monitor or control the vendor.
  3. Lock-in: The procurement structure creates dependencies that make it difficult to change vendors without significant loss.

  Procedure Steps for a Given RFP:

  Step 1: Identify High Switching Costs
     - Ask: "If we have to switch vendors mid-project, what would be the cost compared to the original contract value?"
     - Consider:
          a. Are there significant setup or initial costs that would be duplicated?
          b. Is there vendor-specific knowledge or customization that is not transferable?
          c. Are there interdependencies with other systems or processes that would require rework?
     - Score: High (if switching cost > 50% of original contract value), Medium (20-50%), Low (<20%)

  Step 2: Assess Information Asymmetry
     - Ask: "Will the vendor develop or control information that we cannot easily access or replicate?"
     - Consider:
          a. Does the vendor create custom code, designs, or processes that are not fully documented and handed over periodically?
          b. Does the vendor conduct assessments or analyses that form the basis of the work and are not independently verifiable?
          c. Is the vendor the sole source of expertise for a critical component?
     - Score: High (if critical information is exclusively held by vendor and hard to replicate), Medium (if partially), Low (if information is transparent and regularly shared)

  Step 3: Evaluate Lock-in Mechanisms
     - Ask: "Are there structural elements in the RFP that create dependency on the initial vendor?"
     - Consider:
          a. Is the same vendor performing both assessment and execution?
          b. Does the RFP allow for change orders without competitive bidding?
          c. Are there penalties for switching vendors (e.g., license fees, proprietary technology)?
     - Score: High (if 2 or more lock-in mechanisms), Medium (1 mechanism), Low (none)

  Step 4: Total Risk Assessment
     - If any two of the three categories (Switching Costs, Information Asymmetry, Lock-in) are scored as High, then the procurement is structurally vulnerable to an escalation trap.
     - If one category is High and another Medium, then it is moderately vulnerable and requires mitigation.

  Step 5: Mitigation Strategies (if vulnerable)
     - For High Switching Costs: Require detailed documentation and regular knowledge transfer; phase the project to allow off-ramps.
     - For Information Asymmetry: Require third-party validation, escrow of code/designs, or split the assessment and execution phases to different vendors.
     - For Lock-in: Prohibit the same vendor from doing both assessment and execution; use fixed-price change orders; include exit clauses.

  Now, apply the procedure to two cases:

  Case 1: Custom Software Migration (vendor has all institutional knowledge by month six)

  Step 1: Switching Costs
     - After month six, the vendor has deep knowledge of the legacy system and the migration plan. Switching would require a new vendor to learn from scratch (which is costly and time-consuming). 
     - Switching cost: High (easily over 50% of contract value to restart).

  Step 2: Information Asymmetry
     - The vendor will have developed a custom migration plan and tools, and will understand the legacy system intricacies. Without proper documentation and knowledge transfer, the city may not have access to this knowledge.
     - Score: High (if the RFP doesn't mandate ongoing documentation and transfer).

  Step 3: Lock-in Mechanisms
     - The RFP may not have explicit lock-in, but the nature of the project (custom migration) creates inherent lock-in. Also, if change orders are allowed without competition, that adds to lock-in.
     - We note that the RFP doesn't necessarily have the same vendor doing assessment and execution, but the vendor gains knowledge that locks them in.
     - However, note that the problem states the vendor will have all institutional knowledge by month six. This is a form of lock-in.
     - Score: High (because of the knowledge lock-in and potential for change orders).

  Total Risk: 
     - All three are High? Actually, let's break down:
          Switching Costs: High
          Information Asymmetry: High
          Lock-in: High (due to the institutional knowledge and the fact that the vendor is the only one with the knowledge to continue) 
     - Therefore, this procurement is structurally vulnerable to an escalation trap.

  Mitigation for Case 1:
     - Break the project into phases with clear deliverables and off-ramps at each phase.
     - Require detailed documentation and regular knowledge transfer sessions with city staff.
     - Consider having a second vendor on retainer for knowledge transfer or as a backup.
     - Use a fixed-price contract for each phase, with penalties for non-delivery.

  Case 2: Bridge Repair - Contractor who does the initial assessment is also bidding for the work.

  Step 1: Switching Costs
     - After the initial assessment, the contractor has specific knowledge about the bridge's condition. If they win the bid and then we have to switch, the new contractor would need to redo the assessment (or rely on the first one, which might be biased). 
     - However, the assessment might be reusable? But if the first contractor is the one who did the assessment and then we switch, the new contractor might not trust the assessment and would want to do their own (at additional cost).
     - Switching cost: Medium to High (if the assessment is not done in a way that is fully independent and reusable, then duplication of assessment is needed).

  Step 2: Information Asymmetry
     - The contractor doing the assessment has an information advantage: they know the true condition and can design a bid that is profitable for them (e.g., by underbidding knowing that change orders will be needed). The city does not have independent information.
     - Score: High.

  Step 3: Lock-in Mechanisms
     - The same vendor is doing the assessment and bidding for the work. This is a structural lock-in because the vendor can design the assessment to favor their bid (e.g., by overstating some risks that they then "solve" in their bid, or understating risks to underbid and then change order).
     - Score: High (because of the conflict of interest).

  Total Risk:
     - Switching Costs: Medium/High (let's say High, because redoing the assessment is costly and time-consuming)
     - Information Asymmetry: High
     - Lock-in: High
     - Therefore, this procurement is structurally vulnerable.

  Mitigation for Case 2:
     - Split the assessment and the repair into two separate contracts. The assessment should be done by an independent firm that does not bid on the repair.
     - If splitting is not possible, have the assessment deliverables (data, reports) independently verified by a third party and require that they be detailed enough for any contractor to use.
     - Use the assessment to create a detailed scope of work and then have a fixed-price bid for the repair.

  Conclusion of the Procedure:

  The procedure flags both cases as structurally vulnerable. The city should restructure the procurements to avoid the escalation traps. The procedure requires an honest assessment and may lead to recommendations that are initially unpopular (like splitting contracts or adding more oversight, which may seem to slow down the process). However, it will prevent long-term costs and inefficiencies.
answer: |-
  ### Procurement Escalation Trap Flagging Procedure

  This procedure evaluates RFPs for structural vulnerabilities to escalation traps (dollar auctions) in 3 sequential steps. It requires 2 hours per RFP and focuses on **lock-in risk drivers**, not bid prices. Outcomes are binary: "Safe Structure" or "Restructure Required" (with clear risk explanations).

  ---

  #### **Step 1: Lock-in Point Identification** (30 mins)  
  *Identify irreversible dependencies by asking:*  
  - "At what project stage would switching vendors incur >40% cost duplication?"  
  - "What unique assets/knowledge would the vendor control by Month 6?"  

  | **Risk Threshold** | **Flag If...** |
  |--------------------|----------------|
  | High Risk          | Point occurs before 50% completion OR knowledge is undocumented |
  | Low Risk           | Point occurs after 80% completion AND assets are transferable |

  ---

  #### **Step 2: Asymmetry Assessment** (45 mins)  
  *Evaluate three risk multipliers:*  

  1. **Knowledge Asymmetry**  
     - *Check:* "Does the vendor become the sole keeper of critical institutional knowledge?"  
     - *Red Flag:* Knowledge can't be validated until post-implementation (e.g., legacy system dependencies).

  2. **Control Asymmetry**  
     - *Check:* "Does the vendor self-assess problems/solutions without oversight?"  
     - *Red Flag:* Single vendor handles diagnostic + remedial work (e.g., bridge assessment → repair).

  3. **Switching Cost Profile**  
     - *Calculate:* `(Cost to restart with new vendor) / (Original contract value)`  
     - *Red Flag:* Ratio >1.5x at lock-in point.

  ---

  #### **Step 3: Trap Confirmation** (45 mins)  
  *Trigger "Restructure Required" if ANY condition exists:*  
  - 🔴 Knowledge + Control asymmetries BOTH present  
  - 🔴 Switching cost ratio >1.5x AND lock-in before 50% completion  
  - 🔴 Vendor can influence scope definition (e.g., via unfalsifiable assessments)

  ---

  ### Case Applications

  #### **Case 1: Custom Software Migration**  
  - **Step 1:** Lock-in at Month 6 (vendor controls legacy system knowledge). *High Risk* - undocumented knowledge.  
  - **Step 2:**  
    - *Knowledge Asymmetry:* 🔴 (vendor-only understands legacy customizations)  
    - *Control Asymmetry:* 🔴 (vendor designs migration approach)  
    - *Switching Cost:* 2.5x (re-start requires new discovery phase)  
  - **Step 3:** 🔴 **Restructure Required** - Dual asymmetries + 2.5x switching cost.  
    *Structural Fixes:*  
    - Split contract: Phase 1 (knowledge capture by neutral vendor) → Phase 2 (migration)  
    - Mandate daily documentation in escrow  
    - Penalize late-stage change orders at 200% cost  

  #### **Case 2: Bridge Repair (Same Contractor for Assessment & Bid)**  
  - **Step 1:** Lock-in at assessment completion. *High Risk* - vendor defines repair scope.  
  - **Step 2:**  
    - *Knowledge Asymmetry:* 🔴 (vendor monopolizes bridge condition data)  
    - *Control Asymmetry:* 🔴 (self-assessed "problems" justify change orders)  
    - *Switching Cost:* 1.8x (re-inspection + delays)  
  - **Step 3:** 🔴 **Restructure Required** - Inherent conflict of interest in scope control.  
    *Structural Fixes:*  
    - Hire independent engineer for assessment (paid by city, not contractor)  
    - Fixed-price bids ONLY based on third-party specs  
    - Require bidders to fund an escrow account for dispute inspections  

  ---

  ### Delivering Unpopular Outcomes  
  When the procedure demands restructuring:  
  1. **Quantify Trap Costs:** Show 3-year cost projections comparing:  
     - *Current structure:* Base bid + 70-120% change orders  
     - *Restructured:* Higher base cost but capped fees  
  2. **Offer Alternatives:** Present two compliant options (e.g., phase splits, third-party oversight)  
  3. **Invoke Precedent:** Cite examples like *Denver ERP Project* ($45M overrun from similar trap).  

  This method forces objective risk recognition—blaming the *structure*, not people—making rejections defensible.
