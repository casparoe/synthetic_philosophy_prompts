prompt: |-
  I'm a postdoc in logic, and in three weeks I'm running a single two-hour session to introduce intuitionistic logic to a dozen mathematics PhD students. They are fluent in classical logic, have never worked constructively, and most of them assume constructivism is either a historical curiosity or classical mathematics with arbitrary restrictions. Don't explain intuitionistic logic to me; plan how I should teach it.

  By the end of the session they should be able to state the BHK interpretation in their own words, see why it does not license excluded middle or double-negation elimination, and distinguish proof of a negation from proof by contradiction. What has to be in place before the BHK clauses can do any work for them? Give me the sequence of moves and, for each, say what it depends on and what it buys; I want the dependency structure, not just a list.

  What single example should carry the session, and why that one rather than the usual suspects (say, the classical proof that there exist irrationals a and b with a^b rational, or a standard failed appeal to excluded middle)? What must the example have, and what must it not have, if it is to carry the conceptual distinction between a construction and a mere guarantee of existence?

  Which misconceptions will they arrive with or form partway through, and at exactly which point in the sequence should I head each one off? I'd expect at least these: that intuitionists assert that excluded middle is false rather than declining to assert it; that "constructive" just means "no proof by contradiction," when proving a negation by assuming the proposition in question and deriving a contradiction is a constructive rule, and what is rejected is concluding a positive proposition from the contradiction derived from its negation; that intuitionistic mathematics is just classical mathematics with theorems deleted; and that the BHK interpretation is a psychological account of certainty rather than a specification of what counts as evidence for a proposition. Are there others I should plan for, and where in the sequence does each belong?

  What should I explicitly leave out at this level (for example, Kripke semantics, realizability, or the embedding of intuitionistic logic into classical modal logic), and why would including it do more harm than good?

  Finally, give me one question or small task for the last ten minutes whose answer would show me whether they have grasped the difference between having a construction and having a classical existence proof, rather than merely having learned the rules. I want a plan for the explanation, not a survey and not a reading list.
reasoning: |-
  We are introducing intuitionistic logic to classical mathematicians. The goal is to have them understand BHK, see why LEM and DNE fail, and distinguish proof of negation from proof by contradiction.

  Key misconceptions to address:
  1. Intuitionists do not assert that LEM is false; they just don't assert it for all propositions.
  2. "Constructive" does not mean "no proof by contradiction": proving a negation by contradiction is allowed (and is the definition of negation), but proving a positive statement by contradiction (by assuming its negation and deriving a contradiction) is not allowed in general (unless we have double-negation elimination, which we don't).
  3. Intuitionistic mathematics is not just classical mathematics with deletions; it has its own structure and interpretations.
  4. BHK is about what counts as evidence (proof) for a proposition, not about psychological certainty.

  Sequence of moves:

  1. Start by challenging the assumption that "truth" in mathematics is always about a static, bivalent reality. Instead, present the view of mathematics as an activity of construction and verification. This sets the stage for the idea that a proof is a construction that can be followed to verify the claim.

     - Dependency: This move depends on their familiarity with classical proofs and the idea that a proof is a certificate of truth. It buys the idea that we are shifting from truth to evidence.

  2. Introduce the BHK interpretation as a way to assign meaning to logical connectives in terms of what counts as a construction (or proof) for a given proposition. State the clauses:

     - A proof of A ∧ B is a pair (a, b) where a is a proof of A and b is a proof of B.
     - A proof of A ∨ B is either (0, a) for a proof of A or (1, b) for a proof of B (the tag tells us which and then the proof).
     - A proof of A → B is a method that transforms any proof of A into a proof of B.
     - A proof of ¬A is a method that transforms any proof of A into a proof of a contradiction (e.g., 0=1). Thus, ¬A is defined as A → ⊥.
     - There is no proof of ⊥ (absurdity).

     - Dependency: Step 1. It buys the precise meaning of the connectives in terms of constructions.

  3. Discuss the meaning of quantifiers (if time permits, but they are important for examples):

     - A proof of ∀x P(x) is a method that for any given object c (in the domain) produces a proof of P(c).
     - A proof of ∃x P(x) is a pair (c, p) where c is an object and p is a proof of P(c).

     - Dependency: Step 2. It extends the interpretation to quantifiers, which are needed for mathematical examples.

  4. Now, we need to show why LEM (A ∨ ¬A) is not accepted. We do this by showing that for an arbitrary proposition A, we do not have a method to either produce a proof of A or a method that would turn any proof of A into a contradiction.

     - Example: Let A be a statement that is not known to be decidable (e.g., the Goldbach conjecture). We cannot currently produce a proof of Goldbach or a proof that Goldbach is contradictory. But note: that example is contingent. We want a principled reason.

     - Better: Show that accepting LEM for all propositions would require that every proposition is either proven or refuted, which we cannot guarantee because we do not have a decision procedure for every mathematical statement. But this is still a bit vague.

     - Instead, use an example that is undecidable in principle? But we don't want to get into the technicalities of specific undecidability. So we can use a simple example that they can compute with.

  5. The example to carry the session: 

     I propose the following: the existence of two irrational numbers a and b such that a^b is rational. This is a standard example, but we are going to do it both classically and constructively and then compare. However, note that there is a constructive version of this proof. So we can show:

     - Classical proof: 
          Consider √2^√2. If it is rational, we are done (take a = √2, b = √2). If it is irrational, then take a = √2^√2 and b = √2. Then a^b = (√2^√2)^√2 = √2^(√2*√2) = √2^2 = 2, which is rational.

       This proof uses LEM on the proposition "√2^√2 is rational".

     - Constructive proof: 
          We can explicitly choose a = √2 and b = log₂9. Note that b is irrational (because if it were rational, say p/q, then 2^(p/q)=3, so 2^p=3^q, which is impossible for integers p,q>0). Then a^b = (√2)^(log₂9) = (2^(1/2))^(log₂9) = 2^((1/2)*log₂9) = 2^(log₂3) = 3, which is rational.

       This proof gives explicit witnesses and does not use LEM.

     Why this example?
     - It has a classical proof that uses LEM in a way that is not constructive because the witness depends on the case.
     - It has a constructive version with explicit witnesses.
     - The constructive version shows that we can have a construction without LEM.

     However, note that the classical proof does not actually construct the witness: in one case it gives (√2, √2) and in the other (√2^√2, √2). But we don't know which case holds. The constructive proof gives a fixed pair (√2, log₂9) without branching.

     What must the example have?
     - It must have a classical proof that uses LEM (or a non-constructive principle) in an essential way to prove an existential claim.
     - It must have a constructive version that provides an explicit witness.

     What must it not have?
     - It should not be an example that is too complicated so that we spend too much time on the mathematics rather than the logic.

     However, note that the standard example I just gave for the constructive proof uses a logarithm base change. We can simplify:

     Alternative constructive proof: 
          Take a = √2 and b = 2·log₂3 (which is irrational, because if it were rational then log₂3 would be rational, which it isn't). Then a^b = (√2)^(2·log₂3) = (2^(1/2))^(2·log₂3) = 2^((1/2)*2·log₂3) = 2^(log₂3) = 3.

     But note: we are using the fact that log₂3 is irrational. We can prove that: if log₂3 = p/q, then 2^p = 3^q, which is impossible for positive integers p,q.

     This example is mathematically simple enough.

     But note: the question asks for a single example to carry the session. We want to use the same example throughout to illustrate multiple points.

     Another candidate: the intermediate value theorem. But that requires more infrastructure and is more complex.

     I think the irrational power example is good because it is a discrete, algebraic statement.

  6. Sequence of moves with the example:

     a. Present the statement: There exist irrational numbers a and b such that a^b is rational.

     b. Show the classical proof that uses LEM. Point out that we have two cases, and in each case we get a pair, but we don't know which one to choose. Therefore, we don't have a specific witness.

     c. Now, ask: what would a constructive proof require? It would require an explicit pair (a, b) of irrationals and a proof that a^b is rational.

     d. Give the constructive proof: choose a = √2, b = 2·log₂3 (which is irrational because if it were rational then log₂3 would be rational, which we can prove is not). Then compute a^b = 3.

     e. Compare: the classical proof does not give a construction (it gives two possibilities but no way to decide which one works) while the constructive proof gives a definite pair.

     f. Now, relate to BHK: 
          The existential quantifier in the constructive proof is witnessed by a specific pair and a proof that the pair satisfies the condition. In the classical proof, we have a guarantee that a pair exists but we don't have a specific pair.

     g. Then, go back to LEM: the classical proof uses LEM on the proposition "√2^√2 is rational". Why is this problematic from BHK? Because to have a proof of A ∨ ¬A for that proposition, we would need either a proof that √2^√2 is rational or a proof that it is irrational. We don't have either (or at least, we didn't at the time the classical proof was given; actually now we know it is irrational by the Gelfond-Schneider theorem, but that's advanced). But even without knowing the current status, the point is: the classical proof does not provide a witness for the existential statement because it uses LEM on an undecided proposition.

     h. Now, we can also use this to explain proof by contradiction versus proof of negation:

          - Proof of negation: To prove ¬A, we assume A and derive a contradiction. This is allowed by BHK because ¬A is defined as A → ⊥. So if we can show that A leads to ⊥, then we have a function that transforms any proof of A into a proof of ⊥.

          - Proof by contradiction (for a positive statement): To prove A, we assume ¬A and derive a contradiction. This is not generally allowed because from ¬¬A we cannot get A (we don't have double negation elimination). 

          Example: In the classical proof, we did not use proof by contradiction for a positive statement; we used LEM. But let's also give a separate example of proof by contradiction.

          For instance, consider the statement "there are infinitely many primes". A classical proof by contradiction: assume there are finitely many, then build a prime not in the list. But wait: that is actually a constructive proof! Because it gives a method to produce a prime not in the list. So that doesn't illustrate the non-constructive part.

          Better example: the claim that "there exist irrationals a, b such that a^b is rational" can also be proved classically by contradiction: assume that for all irrationals a, b, a^b is irrational. But then ... [this would be messy]. 

          Instead, consider a simpler example: the claim that "P or not P" for a specific P that we don't know. We cannot prove it by contradiction: assume not (P ∨ ¬P). But classically, that would be a contradiction because LEM is true. However, in intuitionistic logic, we cannot derive a contradiction from ¬(P∨¬P)? Actually, we can: 
              ¬(P∨¬P) → ¬P ∧ ¬¬P, which is a contradiction? Not exactly: ¬¬P is not a contradiction. 

          Actually, we can derive a contradiction: 
              Suppose ¬(P∨¬P). 
              Now, if we had P, then we would have P∨¬P, which contradicts ¬(P∨¬P). Therefore, we have ¬P. 
              But then we have P∨¬P (because we have ¬P). Again, contradiction. 
              So ¬(P∨¬P) leads to a contradiction. Therefore, we have ¬¬(P∨¬P). 

          But that does not give us P∨¬P. So we have proved that LEM is not refutable, but we haven't proved it. 

          This is a bit abstract. 

          Instead, use the following: 

          Let P be the Goldbach conjecture. We cannot prove P ∨ ¬P because we don't have a proof of Goldbach and we don't have a proof that Goldbach is false. Therefore, we cannot use proof by contradiction to prove P: 
              If we assume ¬P and derive a contradiction, then we would have ¬¬P. But without double negation elimination, that doesn't give P.

          However, note: if we had a proof that ¬P leads to a contradiction, then we would have ¬¬P, but that is not the same as P. In BHK, a proof of ¬¬P is a method that transforms any proof of ¬P into a contradiction. But that doesn't give a proof of P.

          So the point is: we cannot use the rule of double negation elimination.

  7. Now, the sequence of moves:

     Step 0: (Prerequisite) They know classical logic and classical proofs.

     Step 1: Motivation: What is wrong with classical logic? Nothing is "wrong", but we are interested in a mathematics where a proof of existence provides an actual witness. We are not rejecting classical logic as false, but we are exploring a different way of doing mathematics that is more informative.

     Step 2: Introduce BHK for connectives (without quantifiers initially? but we need quantifiers for the example). So we might do quantifiers early.

     Step 3: State the existential example and ask: how would we prove this classically? Show the classical proof.

     Step 4: Then, ask: what would a constructive proof require? (They should see: an explicit pair and a proof that they are irrational and that the power is rational.)

     Step 5: Give the constructive proof.

     Step 6: Compare the two: the classical proof does not give a specific pair, the constructive does.

     Step 7: Now, why did the classical proof fail to give a witness? Because it used LEM on a statement that we don't have a decision for. Then, explain why LEM is not acceptable by BHK: because we don't have a method to decide an arbitrary proposition.

     Step 8: Then, discuss the rules that are allowed: proof of negation (which is the definition of ¬) is allowed. Proof by contradiction (for a positive statement) is not allowed because it would require double negation elimination, which we don't have.

     Step 9: To illustrate proof of negation, we can prove that √2 is irrational. That proof is constructive: assume √2 is rational, then derive a contradiction. That is a proof of the negation of "√2 is rational", i.e., ¬(√2 is rational). This is fine.

     Step 10: Now, what about a proof by contradiction for a positive existential? For example, to prove that there exists an even prime, we cannot do: assume there isn't one, then derive a contradiction. But actually, we can: because we have a candidate (2) and we can check 2 is prime and even. But that is constructive because we have a witness.

     The problem is when we don't have a witness. For example, consider the statement "either Goldbach is true or Goldbach is false". Classically, we can prove this by LEM. Constructively, we cannot. But if we try to prove it by contradiction: assume it is not the case that (Goldbach or not Goldbach). Then we get a contradiction (as we saw above) so we have ¬¬(Goldbach ∨ ¬Goldbach). But that does not give us Goldbach ∨ ¬Goldbach.

     Step 11: Therefore, we cannot use proof by contradiction to prove a positive statement for which we do not have a direct proof.

     Step 12: Summarize: 
          - Constructive mathematics requires explicit evidence for existential claims and for disjunctions.
          - The BHK interpretation tells us what evidence is required.
          - LEM is not used because we don't always have the required evidence for A∨¬A.
          - Proof of negation (proving ¬A by showing A leads to contradiction) is allowed because it matches the definition of ¬.
          - Proof by contradiction for a positive A (proving A by showing ¬A leads to contradiction) is not allowed because it only gives ¬¬A, and we don't have ¬¬A → A.

  8. Misconceptions and when to address them:

     - That intuitionists assert that LEM is false: 
          Address when introducing the rejection of LEM: we are not saying LEM is false, we are saying that we don't have a justification for it in terms of constructions. So we don't include it as an axiom.

     - That "constructive" just means "no proof by contradiction": 
          Address when discussing the rules: point out that proof of negation (a form of contradiction) is allowed. The issue is the use of contradiction for positive statements without a construction.

     - That intuitionistic mathematics is just classical mathematics with theorems deleted: 
          Address in the motivation: we are not deleting theorems arbitrarily; we are requiring more informative proofs. Moreover, sometimes we get different theorems (like every function on the reals is continuous) that are not classically true.

     - That BHK is psychological: 
          Address when introducing BHK: this is about mathematical evidence, not about what one feels certain of. A proof is a mathematical object that can be checked.

     - Another possible misconception: that constructive proofs are always harder or longer. 
          We see in the example that the constructive proof is actually shorter and more direct (if we have the witness) than the classical one that branches.

     - That intuitionistic logic is just a subsystem of classical logic: 
          While it is true that every intuitionistic theorem is classically valid, the converse is not true. Moreover, the meaning of the connectives is different.

  9. What to leave out:

     - Kripke semantics: It is a model theory for intuitionistic logic, but at this stage we are focusing on the proof interpretation (BHK). Introducing models might distract from the computational meaning.

     - Realizability: This is a way to interpret intuitionistic logic in computable functions, but it is more advanced and not needed for the basic concepts.

     - Embedding into modal logic: Again, that is a technical device and not necessary for understanding the core ideas.

     - The formal system of natural deduction: They are logicians, so they know natural deduction. We can refer to it if necessary, but we don't need to spend time deriving basic rules.

     - The historical development or different schools (Brouwer, Heyting, etc.): Focus on the logical ideas.

     - The details of how to do mathematics constructively (like analysis or algebra) beyond the example.

  10. Final task for the last ten minutes:

      Task: Consider the following two statements and proofs:

      Statement 1: There exist two distinct irrational numbers a and b such that a^b is rational.

      Statement 2: Either the Euler-Mascheroni constant is rational or it is irrational.

      Proof A (for Statement 1): 
          We know that √2 is irrational. Consider the number √2^√2. If it is rational, then take a=√2 and b=√2. If it is irrational, then take a=√2^√2 and b=√2. Then a^b = (√2^√2)^√2 = √2^(√2*√2)= √2^2=2, rational. In either case, we have such a pair.

      Proof B (for Statement 2): 
          We know that every real number is either rational or irrational. Therefore, the Euler-Mascheroni constant is rational or irrational.

      Proof C (for Statement 1): 
          Take a=√2 and b=log₂9. We know that √2 is irrational. Also, b=log₂9=2·log₂3 is irrational because if it were rational, then log₂3 would be rational, say p/q, and then 2^p=3^q, which is impossible. Then a^b= (√2)^(log₂9) = (2^(1/2))^(log₂9) = 2^((1/2)*log₂9) = 2^(log₂3) = 3, which is rational.

      Proof D (for Statement 2): 
          Assume that the Euler-Mascheroni constant is not rational and not irrational. This is impossible because by definition every real number is either rational or irrational. Therefore, the assumption is false, so it is either rational or irrational.

      Questions:

      a. Which of these proofs are constructive? Why?
      b. Which of these proofs provide a witness? For which statement?
      c. Which proofs use LEM? Where?
      d. Which proofs use proof by contradiction? For what?

      Expected answers:

      - Proof A: not constructive for Statement 1 because it doesn't give a specific witness. It uses LEM on "√2^√2 is rational".
      - Proof B: not constructive for Statement 2 because it doesn't tell us which disjunct holds. It uses LEM (implicitly) on the property of the constant.
      - Proof C: constructive for Statement 1 because it gives an explicit witness and a proof that it works.
      - Proof D: uses proof by contradiction to prove a disjunction. But note: the disjunction is actually a classical tautology. However, constructively, we cannot prove Statement 2 because we don't have a decision procedure for the rationality of the Euler-Mascheroni constant. Proof D is not constructive because it uses proof by contradiction to prove a positive disjunction. In fact, it ends with ¬¬(P∨¬P), but we need P∨¬P.

      This task should reveal whether they understand the need for witnesses and the rejection of non-constructive principles.

  Plan:

  0. Introduction (5 min): 
     - We are going to look at a different way of understanding mathematical proofs: intuitionistic logic, which focuses on constructions.
     - Goal: understand the BHK interpretation, see why LEM and DNE are not used, and distinguish proof of negation from proof by contradiction.

  1. BHK Interpretation (15 min):
     - Explain the clauses for connectives and quantifiers (with examples).
     - Emphasize: evidence is required (a proof is a mathematical object).

  2. The Example (20 min):
     - Statement: There exist irrationals a, b such that a^b is rational.
     - Present the classical proof (using LEM) and the constructive proof (with explicit witnesses).
     - Compare: the classical proof does not give a witness, the constructive does.

  3. Why LEM fails under BHK (10 min):
     - For an arbitrary proposition A, we don't have a method to produce either a proof of A or a proof of ¬A.
     - Therefore, we cannot assert A∨¬A for arbitrary A.

  4. Proof of Negation vs Proof by Contradiction (15 min):
     - Proof of negation: to prove ¬A, show that A leads to contradiction. This is allowed because it is the definition of ¬A.
     - Proof by contradiction: to prove A, show that ¬A leads to contradiction. This is not allowed because it only gives ¬¬A, and we don't have ¬¬A→A.
     - Example: proving that √2 is irrational (allowed) vs trying to prove the Riemann hypothesis by contradiction (not allowed constructively because we don't have a direct proof).

  5. Addressing Misconceptions (10 min):
     - We do not assert that LEM is false; we just don't have evidence for it for every A.
     - Constructive does not mean no contradiction ever: proof of negation is fine.
     - Intuitionistic mathematics is not just classical with deletions; it has its own structure and sometimes more informative results.

  6. Final Task (10 min): 
     - Hand out the task with the four proofs and four questions. Have them discuss in pairs and then share.

  7. Wrap-up (5 min):
     - Recap the key points.

  Total: 80 min, but we have 120 min? Adjust: we can spend more time on the example and discussion.

  Adjustments for 120 minutes:

  - Step 1: BHK (20 min)
  - Step 2: Example (30 min): include time for them to think about the classical proof and why it fails to construct.
  - Step 3: LEM failure (15 min)
  - Step 4: Proof of negation vs contradiction (20 min)
  - Step 5: Misconceptions (15 min)
  - Step 6: Task (15 min)
  - Step 7: Wrap-up (5 min)

  Total: 120 min.

  But note: the task is for the last 10 minutes? Actually, we can give 15 minutes and then discuss for 5 minutes.

  Alternatively, we can have the task as a group activity.

  I think this plan should work.
answer: |-
  ### Plan for Teaching Intuitionistic Logic to Classical Mathematicians  
  **Goal:** By the end, students can state BHK, explain why excluded middle (LEM) and double-negation elimination (DNE) fail under BHK, and distinguish proof of negation from proof by contradiction.  
  **Core Example:** The existence of irrational numbers \(a, b\) such that \(a^b\) is rational.  
  **Why this example?**  
  - **Must have:** A classical proof relying on LEM without providing an explicit witness, and a constructive proof delivering a specific witness.  
  - **Must not have:** Complex mathematical machinery (e.g., topology) or ambiguity in witness construction (e.g., the usual \(\sqrt{2}^{\sqrt{2}}\) case-splitting hides the witness).  
  - **Why not the usual suspects?** The classic proof for \(a^b\) often uses LEM obscurely; the constructive version with \(\sqrt{2}^{\log_2 9}\) is explicit, intuitive, and contrasts "guarantee" vs. "construction."  

  ---

  ### Sequence of Moves, Dependencies, and Payoffs  
  **Total Time:** 110 minutes (10 minutes buffer).  
  *Format: Interactive lecture with Socratic questioning.*  

  #### **1. Motivate the Need for Constructions (15 min)**  
  - **Move:** Contrast classical existence proofs (e.g., "there exists \(x\) such that \(P(x)\)" proven by contradiction) with the desire for explicit, computable witnesses. Ask: *"What does a classical existence proof actually give us? Can we extract an example?"*  
  - **Depends on:** Their fluency in classical logic.  
  - **Buys:** Awareness that classical proofs may guarantee existence without providing a "recipe." Seeds the idea that constructivism is about *evidence*, not arbitrary restrictions.  
  - **Head off:** "Constructivism deletes classical theorems." Emphasize that it’s about *reinterpretation*: theorems requiring constructions may hold, while non-constructive ones (e.g., LEM) are rejected.  

  #### **2. Introduce BHK Interpretation (20 min)**  
  - **Move:** Define BHK clauses for \(\land, \lor, \to, \neg, \bot, \forall, \exists\). Use simple examples:  
    - Proof of \(A \to B\): A *method* converting proof of \(A\) to proof of \(B\).  
    - Proof of \(\neg A\) (\(A \to \bot\)): A method turning proof of \(A\) into absurdity.  
    - Proof of \(\exists x P(x)\): A pair \((c, p)\) where \(p\) proves \(P(c)\).  
  - **Depends on:** Step 1 (need for explicit evidence).  
  - **Buys:** BHK as a specification of evidence (not psychology!). Students can state: "Proofs are programs/certificates, not truth-ghosts."  
  - **Head off:** "BHK is about subjective certainty." Clarify: BHK defines mathematical evidence ("what counts as a proof?"), not mental states.  

  #### **3. Analyze the Core Example Classically (20 min)**  
  - **Move:** Present the classical proof:  
    > *"Either \(\sqrt{2}^{\sqrt{2}}\) is rational (then \(a = b = \sqrt{2}\)) or irrational (then \(a = \sqrt{2}^{\sqrt{2}}, b = \sqrt{2}\)). In both cases, \(a^b\) is rational."*  
  - **Ask:** *"What witness \((a,b)\) does this give? Is it computable?"*  
  - **Depends on:** Step 2 (BHK for \(\exists\): need a specific witness).  
  - **Buys:** Realization that LEM hides the witness. Students see LEM enables a non-constructive existence proof.  
  - **Head off:** "Intuitionists think LEM is false." Correct: LEM isn’t *false*; we lack evidence for it universally.  

  #### **4. Analyze the Core Example Constructively (15 min)**  
  - **Move:** Give the constructive proof:  
    > *Let \(a = \sqrt{2}, \ b = \log_2 9\). Both irrational (prove briefly: if \(\log_2 9 = p/q\), then \(2^p = 9^q\), impossible). Then \(a^b = \sqrt{2}^{\log_2 9} = 2^{\log_2 3} = 3\), rational.*  
  - **Contrast:** Explicit witness \((a,b)\) vs. classical "guarantee."  
  - **Depends on:** Step 2 (BHK for \(\exists\)) and Step 3 (weakness of classical proof).  
  - **Buys:** Students articulate: Constructive proofs supply data; classical proofs may not.  

  #### **5. Why BHK Rejects LEM and DNE (15 min)**  
  - **Move:** Revisit BHK for \(A \lor \neg A\) (proof must decide: left/right). Use the core example:  
    - *"To prove \(\sqrt{2}^{\sqrt{2}} \text{ is rational} \lor \neg(\sqrt{2}^{\sqrt{2}} \text{ is rational})\), BHK requires evidence for one disjunct. Do we have it?"*  
  - **DNE failure:** Show \(\neg \neg A \to A\) fails. Example: \(A =\) "Goldbach’s conjecture." \(\neg \neg A\) means "\(A\) isn’t absurd," but gives no proof of \(A\).  
  - **Depends on:** Step 2 (BHK for \(\lor, \neg\)) and Step 3 (classical LEM usage).  
  - **Buys:** Students see LEM/DNE aren’t justified by BHK—they demand undecidable evidence.  
  - **Head off:** "Constructive = no proof by contradiction." Clarify: Proof of *negation* (assume \(A\), derive \(\bot\)) is valid; proof by *contradiction* (assume \(\neg A\), derive \(\bot\) to prove \(A\)) is not (it only proves \(\neg \neg A\)).  

  #### **6. Proof of Negation vs. Proof by Contradiction (15 min)**  
  - **Move:** Side-by-side examples:  
    - **Proof of negation (valid):** Prove \(\sqrt{2}\) is irrational. Assume \(\sqrt{2} = p/q\), derive contradiction.  
    - **Proof by contradiction (invalid):** Prove "Goldbach’s conjecture" by assuming it’s false and deriving absurdity.  
  - **Ask:** *"Which provides evidence for a positive claim?"*  
  - **Depends on:** Step 2 (BHK for \(\neg\)) and Step 5 (DNE failure).  
  - **Buys:** Students distinguish: Proof of negation constructs evidence for \(\neg A\); proof by contradiction attempts (and fails) to construct evidence for \(A\).  
  - **Head off:** "Intuitionism bans all contradiction." Correct: Only bans contradiction for *positive* claims.  

  #### **7. Final Task: Test Conceptual Grasp (10 min)**  
  - **Task:** *"Consider: 'There exist irrationals \(x, y\) such that \(x^y\) is rational.'*  
    - *Proof 1: Let \(x = \sqrt{2}, y = 2\log_2 3\) (≈2.75). Both irrational; \(x^y = 3\).*  
    - *Proof 2: Assume no such pair exists. But \(\sqrt{2}^2 = 2\) is rational—contradiction. So such a pair exists.*  
    - *Which proof is constructive? Why? What evidence does each provide for \(\exists\)?"*  
  - **Expected Answer:**  
    - Proof 1 is constructive: Gives witness \((x,y)\). Matches BHK for \(\exists\).  
    - Proof 2 is classical: Proves existence by contradiction. Only gives \(\neg\neg\exists\), no witness.  
  - **Why this task?** Isolates the core distinction: Construction vs. guarantee. Forces students to apply BHK to evidence, not just recite rules.  

  ---

  ### What to Exclude and Why  
  - **Kripke semantics, realizability, modal embeddings:** These model theory tools shift focus from *meaning* (BHK) to *truth conditions*. At this stage, they obscure the computational interpretation and invite "classical baggage" (e.g., "Kripke models use classical metalogic!"—distracting).  
  - **Formal systems (e.g., sequent calculus):** They know natural deduction; focus on *why* rules change, not derivations.  
  - **Advanced topics (e.g., continuity axioms):** Too specific; distracts from logic fundamentals.  

  ---

  ### Expected Misconceptions and Intervention Points  
  1. **"Intuitionists assert LEM is false."**  
     - **When:** Step 5 (discussing LEM failure).  
     - **Intervention:** *"Rejecting LEM isn’t saying it’s false—it’s saying we lack evidence for it universally. BHK doesn’t make LEM false; it just doesn’t justify it."*  

  2. **"Constructive = no proof by contradiction."**  
     - **When:** Step 6 (contrasting negation/contradiction).  
     - **Intervention:** *"Proof of negation is constructive! What’s rejected is using contradiction to prove positive claims without evidence."*  

  3. **"BHK is about psychological certainty."**  
     - **When:** Step 2 (defining BHK).  
     - **Intervention:** *"BHK isn’t about feelings—it’s about what mathematical evidence you can write down, like a program or a witness."*  

  4. **"Intuitionistic math is classical math with deletions."**  
     - **When:** Step 1 (motivation) and Step 4 (constructive example).  
     - **Intervention:** *"It’s a reinterpretation: some classical theorems hold with stronger premises, some aren’t used, and new theorems arise (e.g., all functions are continuous)."*  

  5. **"Disjunction is exotic/weak."**  
     - **When:** Step 5 (LEM failure).  
     - **Intervention:** *"Disjunction isn’t weakened—it’s strengthened! To prove \(A \lor B\), you must decide and prove one."*  

  ---

  ### Summary Flow  
  1. **Problem:** Classical existence proofs may lack witnesses. (15 min)  
  2. **Solution:** BHK defines proofs as constructions. (20 min)  
  3. **Classical Failure:** Core example with LEM exposes non-constructiveness. (20 min)  
  4. **Constructive Success:** Core example with witness satisfies BHK. (15 min)  
  5. **Why LEM/DNE Fail:** BHK demands undecidable evidence. (15 min)  
  6. **Contradiction Nuance:** Proof of negation vs. proof by contradiction. (15 min)  
  7. **Test:** Apply to proofs of existence. (10 min)  

  **End State:** Students see intuitionism as a mathematics of evidence, not restrictions—BHK redefines "proof" to require data, not just guarantees. The core example crystallizes this, and the final task checks deep understanding.
