  I am preparing a two-page research proposal for a postdoctoral fellowship application. My half-formed idea concerns the special composition question — roughly, Peter van Inwagen's question about when some things compose a whole. The literature has almost uniformly treated this as a question about composition: given a plurality of objects, under what conditions do they compose something? But I suspect the direction of the question matters more than has been recognized. If we instead asked the decomposition question — given a whole, under what conditions does it decompose into proper parts? — would we get the same answer? On the face of it, composition and decomposition are converses, so one might expect symmetry. But there are reasons to doubt this. If priority monism is true, the whole is prior to its parts, and decomposition might be the more fundamental question. Even for those who reject monism, the formal properties of parthood do not obviously guarantee that an answer to the composition question yields an answer to the decomposition question, or vice versa. Turn this half-formed idea into a proposal with a precise statement of the question, an explanation of why existing positions in the literature leave it open, a method (what I would actually do, month by month), and an honest account of what would count as the project failing. Do not worry about supplying citations; I will add those myself.
