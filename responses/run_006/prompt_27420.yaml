  Biggest challenge: balancing the AI-safety members who want stronger rules vs. product managers fearing delays. The reply to their "too weak" critique must show this is a first step, not the ceiling. But that might not satisfy them. 

  Final thought: the user’s "existing practice" argument is clever but could backfire if someone argues security flaws are more knowable than AI harms. Need a comeback that stresses "mechanism we can spell out"—no handwaving allowed. 

