prompt: |-
  I'm the director of individual giving at a mid-size human rights nonprofit. Every campaign we run involves some mix of email subject lines, donation page design, suggested gift amounts, and canvasser scripts, and I keep having the same argument with my team: someone proposes a technique, someone else says it's manipulative, and the first person says "it's true and the donor can always say no, so its just persuasion." We already have a rule against outright lies and fake match offers. What I need is a decision procedure we can run in a planning meeting — under an hour, no philosopher in the room, ideally one page — to decide whether a technique is manipulation or legitimate persuasion. I sign off on every campaign, and the board's development committee reviews the big ones, so I need something I can defend to them in plain English. Donor trust is the main asset, and we also have to stay inside state fundraising rules and platform policies.

  Please write the procedure as a checklist or ordered set of tests. For each step: the question we ask, what counts as a sufficient answer to move on, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a factual one. Ground it in whatever the philosophy of manipulation and persuasion actually has to say, but keep the theory in the background; tell us which distinctions you're treating as load-bearing and which you're dropping for usability. Be honest about where the procedure will misfire.

  Then run the procedure on these three:
  1. A donation page where "give monthly" is pre-checked and "give once" is grayed out, with a real but time-limited match and a photo chosen because it's upsetting.
  2. An email with the subject line "We need you" and a message built around guilt — people will suffer if we miss the goal — that contains no new information about the work.
  3. A canvasser script that opens by asking the person to sign a small petition, then pivots to a donation ask, and tells canvassers to mirror the person's body language and use flattery.

  I want to know which of these the procedure flags, which it lets through, and at least one case where it gives an answer my team won't like. And tell me what the procedure can't settle — the cases where two reasonable versions of it come apart.
reasoning: |-
  Okay, let me tackle this user's problem. They're the director of individual giving at a human rights nonprofit, constantly dealing with debates over whether fundraising tactics are manipulative or legitimate persuasion. They need a practical decision procedure—a checklist—that can be used in meetings under an hour, without needing a philosopher. The goal is to protect donor trust, comply with regulations, and have something defensible to the board.

  First, I need to recall the philosophical distinctions between manipulation and persuasion. Manipulation involves deceptive, coercive, or exploiting tactics that bypass rationality, while persuasion is about presenting truthful information and allowing autonomous decisions. The challenge is translating this into actionable steps without theory jargon.

  Key distinctions to include: truthfulness, autonomy, emotional exploitation, and donor benefit. But I should drop finer points like intent vs. outcome for simplicity. For each step in the checklist, I'll frame it as a question with clear pass/fail criteria and note where it's a values call.

  Now, structuring the checklist. I'll start with legal compliance since it's non-negotiable. Then move to truthfulness—no lies or omissions of key facts. Next, autonomy: are donors making informed choices without undue pressure? After that, emotional exploitation: does it weaponize emotions? Finally, donor benefit: is the tactic in their interest beyond just extracting money?

  I should also consider where the procedure might misfire. For example, emotionally charged images in human rights work could be necessary but might exploit emotions. The procedure should flag this for discussion, not automatically reject it. Also, pre-checked boxes—while common—might infringe on autonomy if not obvious. The team needs to debate the gray areas.

  Testing the three examples:
  1. The pre-checked monthly donation with a time-limited match and upsetting photo. The match is real, so truthful. But the photo might exploit emotions, and the pre-checked option could hinder autonomy. The procedure flags it for team discussion on the photo and pre-checked box.

  2. The guilt-tripping email with "We need you" subject line. It's truthful but uses guilt without new info. This exploits emotions, so it fails the exploitation test and gets rejected.

  3. The canvasser script with petition pivot, mirroring, and flattery. The petition pivot is acceptable if transparent, but mirroring and flattery might bypass rationality. It gets flagged for discussion on whether the flattery is authentic or manipulative.

  Cases where the procedure might misfire: Upsetting photos in human rights contexts could be justified as truthful storytelling. The procedure flags it, requiring the team to weigh necessity against exploitation. Also, emotional appeals that are genuine but intense might be caught, needing human judgment.

  Unsettled cases: Reasonable people might disagree on what counts as "undue pressure" or "exploitation." For instance, urgency tactics could be seen as motivating or pressuring. The procedure requires documenting the rationale for these judgment calls.
answer: |-
  Here’s a **Decision Procedure for Fundraising Ethics**, designed as a 5-step checklist. It’s grounded in core philosophical distinctions:  
  **Manipulation** *bypasses rational choice* (via deception, emotional exploitation, or pressure) or *treats donors as mere means*.  
  **Legitimate persuasion** *appeals to reason/values* with truth, preserves autonomy, and respects donors as ends in themselves.  

  **Key Load-Bearing Distinctions**:  
  ✅ **Truthfulness** (vs. deception)  
  ✅ **Autonomy** (vs. coercion/exploitation)  
  ✅ **Donor Benefit** (vs. pure extraction)  
  ⛔ *Dropped*: Intent (hard to prove), cultural relativity (stick to universal norms).  

  ---

  ### **The Checklist**  
  *For each step: Stop if "No." Escalate to team vote if "Unclear." Document answers.*

  1. **LEGAL & PLATFORM COMPLIANCE**  
     *Question:* Does this violate any *specific* fundraising law (e.g., state disclosure rules) or platform policy (e.g., Meta’s donation flow requirements)?  
     - **Pass:** Confirmed legal/secure platform; no known violations.  
     - **Fail:** Violates clear rule (e.g., fake urgency, undisclosed fees).  
     - **Escalate:** Gray area (e.g., new policy interpretation).  

  2. **TRUTHFULNESS**  
     *Question:* Is *all* factual content accurate, and are material omissions avoided? (E.g., match details, fund usage).  
     - **Pass:** Claims are verified; fine print covers key terms.  
     - **Fail:** False stats, misleading deadlines, or omitted fees/conditions.  
     - **Escalate:** "Spin" without falsehood (e.g., cherry-picked data).  

  3. **AUTONOMY**  
     *Question:* Does the donor have a *clear, unpressured choice*? (No design/script tricks that obscure options or exploit irrationality).  
     - **Pass:** Defaults are neutral; opt-outs are easy; no manufactured urgency.  
     - **Fail:** Dark patterns (e.g., hidden cancel buttons), coercive language ("Children will die if *you* don’t act").  
     - **Escalate:** Emotional framing or mild pressure (e.g., "Match ends soon!").  

  4. **EXPLOITATION**  
     *Question:* Does this *weaponize* emotions (guilt, fear) or vulnerabilities (loneliness, cognitive bias) *without purpose*?  
     - **Pass:** Emotions connect to the cause; no psychological tricks.  
     - **Fail:** Leverages shame/panic unrelated to impact; preys on bias (e.g., "95% of neighbors donated").  
     - **Escalate:** Disturbing imagery/strong guilt appeals tied to mission. *Values call: Does the emotional cost justify the impact?*  

  5. **DONOR BENEFIT**  
     *Question:* Could a reasonable donor feel this respects their dignity/supports their values *beyond extracting money*?  
     - **Pass:** Offers agency, impact clarity, or genuine gratitude.  
     - **Fail:** Treats donors as ATMs (e.g., flattery to obscure low impact).  
     - **Escalate:** High-pressure asks with intangible rewards.  

  ---

  ### **Applied to Your Examples**  
  **1. Donation Page (Pre-checked monthly, time-limited match, upsetting photo)**  
  - Step 1: **Pass** (If match is real).  
  - Step 2: **Pass** (If deadlines/terms are clear).  
  - Step 3: **Fail** (Pre-checked/grayed-out options restrict autonomy; dark pattern). ✋ **STOP: REJECT**.  
  - *Note:* Upsetting photo goes to Step 4 (Escalate: team debates if it’s educational vs. exploitative).  

  **2. Email ("We need you" + guilt-based, no new info)**  
  - Step 1: **Pass**.  
  - Step 2: **Pass** (If "people will suffer" is factually true).  
  - Step 3: **Escalate** (Urgency may pressure; team votes on acceptability).  
  - Step 4: **Fail** (Guilt absent new info = exploitation; no rational appeal). ✋ **STOP: REJECT**.  

  **3. Canvasser Script (Petition pivot, mirroring, flattery)**  
  - Step 1: **Pass**.  
  - Step 2: **Pass** (If pivot is transparent).  
  - Step 3: **Escalate** (Mirroring may feel manipulative; team votes).  
  - Step 4: **Fail** (Flattery to build compliance = exploitation). ✋ **STOP: REJECT**.  
  - *Exception:* If flattery is authentic praise (e.g., "I admire your engagement") → **Pass**.  

  ---

  ### **Where the Procedure Misfires or Splits**  
  - **False Negatives (Allows manipulative tactics):**  
    - *Example:* A technically truthful but highly exaggerated story ("This child will be trafficked TOMORROW") passes Step 2 but may exploit fear (Step 4). *Mitigation:* Step 4 forces debate on proportionality.  
  - **False Positives (Blocks benign tactics):**  
    - *Example:* Urgent emails about genuine emergencies (e.g., sudden refugee crisis) may fail Step 3 if worded strongly. *Mitigation:* Document "crisis exception" in guidelines.  
  - **Unresolvable Disagreements:**  
    - **Cultural norms:** A guilt appeal acceptable in one donor cohort may alienate another.  
    - **Emotional rawness:** Graphic imagery in human rights work (e.g., war zones) is defensible but risks exploitation. *The procedure flags it for human judgment.*  
  - **What It Can’t Settle:**  
    - **"Soft" manipulation:** E.g., suggesting $100 when $50 is typical. Step 3/4 may approve if options are visible, but some teams see it as undue influence.  
    - **Donor benefit tradeoffs:** A tactic that works (e.g., pre-checked recurring gifts) but erodes trust long-term. *Procedure forces explicit discussion at Step 5.*  

  **Output for Your Team**:  
  - Flagged: #1 (Autonomy fail), #2 (Exploitation fail), #3 (Exploitation fail).  
  - Team Vote Needed: Emotional intensity in #1’s photo, wording in #2/3 if revised.  
  - Likely Unpopular Answer: Rejecting industry-standard practices like pre-checked boxes (#1) or petition pivots (#3). Defend using "Autonomy" and "Exploitation" tests.  

  **Final Defense to Board**:  
  *"We reject tactics that trick donors or use psychological exploitation. Our procedure prioritizes truth, choice, and dignity—because trust is irreplaceable."*
