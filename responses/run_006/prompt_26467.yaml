  Ah, but the user also wants sensitivity analysis. If forced to resolve one sub-question, self-location would shift my credence most dramatically (from 0.65 to near 1 if confirmed, or to 0.3 if refuted). Whereas I'm least sure about the Principles conflict - Elga's diachronic consistency arguments could plausibly tip it either way. 

