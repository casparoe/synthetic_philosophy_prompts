prompt: |-
  Hi — I'm taking an ethics of war class this semester and we just finished a unit on pacifism, mostly the absolute vs contingent distinction and the free-rider objection (that pacifists get the benefits of security without doing the dirty work). I'm writing my final paper on Hacksaw Ridge (the Mel Gibson film) and I want to read it through that lens. Desmond Doss refuses to even touch a rifle but still enlists as a combat medic, and the film obviously wants us to see his refusal as heroic — the ridge scenes are all about him lowering wounded soldiers down the cliff while everyone else is shooting. But i can't tell whether the movie is actually endorsing pacifism or quietly showing why it can't work: his nonviolence only matters because other soldiers are killing all around him, and the Japanese soldiers are mostly filmed as a faceless enemy for the Americans to mow down. Also the battle sequences are shot in a way that feels almost thrilling, which seems to glorify the exact violence the film says Doss is right to reject. Can you help me work out a reading that takes both sides seriously? I don't want the film reduced to a pro- or anti-pacifism illustration, and I want to be honest about the places where it resists a pacifist reading. And if you can, say what the film adds to the philosophical debate that the seminar readings don't.
