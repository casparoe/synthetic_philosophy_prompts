prompt: |-
  Been chewing on an argument a friend dropped in a Discord server and I can't find the exit. It's about old evidence, and it seems to prove way too much — like, if it works, then basically none of the actual history of science counts as confirmation, which can't be right. Here's the argument as he laid it out:

  (1) On Bayesianism, evidence E confirms a hypothesis H just in case P(H|E) > P(H).
  (2) If E is old evidence, you already knew E before H was ever on the table, so your P(E) = 1.
  (3) Bayes' theorem says P(H|E) = P(E|H)P(H)/P(E).
  (4) Plug in P(E)=1 and you get P(H|E) = P(E|H)P(H).
  (5) In the interesting cases, H was built precisely to entail E (or at least P(E|H)=1 once H is around), so P(H|E) = P(H).
  (6) Therefore old evidence can never confirm a theory.
  (7) But that's absurd: Mercury's perihelion precession was known for decades and then got treated as confirming general relativity; same story with Brownian motion, the photoelectric effect, you name it.
  (8) So either Bayesianism is false, or "confirmation" isn't the same thing as probability-raising.

  I'd much rather keep Bayesianism and keep the idea that old evidence can confirm. Wich step do you reject, and what does rejecting it actually cost the standard Bayesian picture? I keep feeling like the slide is somewhere around (2) or (5), but every time I try to deny one of them the whole rest of the epistemology starts sagging, so I want to know what I'm buying.
reasoning: |-
  Okay, let me unravel this Bayesian puzzle about old evidence. The user's friend claims that in Bayesian terms, old evidence can't confirm new theories because its probability is already 1. But that clashes with real scientific history where known phenomena like Mercury's orbit did confirm theories like relativity. 

  Hmm, the core tension is between Bayesian formalism and scientific practice. The user wants to preserve both but feels stuck. They're hinting at doubts about premises (2) and (5) but worry about downstream effects. Smart - they recognize rejecting a premise might have broader epistemological costs.

  First, premise (2) feels slippery. Assigning P(E)=1 to old evidence is like fossilizing your knowledge. But scientists don't do that - when proposing radical new theories, they temporarily "unlearn" E to test if H predicts it. That's not irrational; it's counterfactual reasoning. Still, is this cheating? The user might worry this makes probabilities too subjective.

  Premise (5) is also problematic. Assuming P(E|H)=1 ignores how theories actually explain evidence. Relativity didn't just entail Mercury's precession; it gave a precise mathematical account. The confirmation came from the exact fit, not mere entailment. But quantifying that precision is tricky - Bayesianism struggles with why some entailments feel more "impressive" than others.

  The user's deeper concern seems to be: if we bend Bayesian rules to handle old evidence, does the whole framework become unmoored? Good news: solutions like Garber's focus on learning logical relationships rather than E itself. This keeps probabilities between 0 and 1 while allowing confirmation. The cost? We must formalize "learning that H entails E" - which gets messy with complex theories.

  Alternative approaches like comparing to rival hypotheses might help, but they feel less Bayesian. The user clearly values Bayesian coherence, so I'll emphasize solutions that preserve the probability calculus. 

  Biggest takeaway for the user: rejecting P(E)=1 for old evidence doesn't collapse Bayesianism; it reveals how we model belief revision during scientific revolutions. The cost is accepting that probabilities reflect epistemic states - including hypothetical ones - not just clockwork updating.
answer: |-
  You've hit on one of the deepest and most debated problems in Bayesian confirmation theory—the **Problem of Old Evidence** (POE), first rigorously formulated by Clark Glymour. Your friend's argument is a classic presentation, and your intuition that (2) or (5) is the culprit is spot on. **I reject premise (2)** as an oversimplification of how rational agents handle old evidence in scientific contexts. Here's why, what it costs, and how it preserves both Bayesianism and the confirmation of theories by old evidence:

  ---

  ### **Why Premise (2) is Problematic: P(E) = 1?**
  Premise (2) claims that if you already know E, then your credence P(E) must be 1. While this seems intuitive, it misrepresents how Bayesian agents model **counterfactual reasoning** in scientific discovery. When evaluating whether a *new* hypothesis H confirms *known* evidence E, you aren't reasoning from your *current* epistemic state where E is fixed. Instead, you're asking:
  > *"How much would learning H increase my credence in E* ***if I didn't already know E?"***

  This is a subtle but crucial shift. In practice, scientists temporarily "bracket" their knowledge of E to assess H's explanatory power. Formally, we use a **counterfactual probability function** (e.g., your credence function *before* you learned E, or one where E's truth is temporarily ignored).

  ---

  ### **The Solution: Counterfactual Bayesianism**
  1. **Step Rejected**: (2) P(E) = 1.  
     - Instead, we use a probability function **P*** representing your beliefs *before* learning E (or a state where E's status is uncertain).  
     - In P*, P*(E) < 1 (you haven't "processed" E yet).  
     - *Example*: Before Einstein, Mercury's precession (E) was known, but a Bayesian agent assessing GR (H) would reason: "If I didn't know E, would H predict it?"  

  2. **Revised Calculation**:  
     - P*(H|E) = P*(E|H) · P*(H) / P*(E)  
     - Since H entails E (or makes it very probable), P*(E|H) ≈ 1.  
     - Thus, P*(H|E) > P*(H) as long as P*(E) < 1 → **confirmation occurs**.  

  3. **Why (5) Fails Too**:  
     - Premise (5) assumes P(E|H) = 1. But even if H entails E, the key is whether H *best explains* E compared to alternatives. If H is the *only* hypothesis that fits E perfectly (e.g., GR's precise prediction of Mercury's precession), then P*(E|H) >> P*(E|¬H), making confirmation strong.  

  ---

  ### **What Does This Cost the Standard Bayesian Picture?**
  Rejecting (2) isn't cost-free, but it strengthens Bayesianism against fatal objections. The trade-offs:
  - **Cost 1: Idealization**. We must invoke counterfactual credences (P*), which aren't directly observable. Critics argue this is "cheating" by changing the rules mid-game.  
  - **Cost 2: Subjectivity**. P* relies on reconstructing an agent's past beliefs, which can be arbitrary. *Response*: Use **rational reconstructions** (e.g., what a scientist *should* believe before E).  
  - **Cost 3: Non-Uniqueness**. There's no single "correct" P*. *Response*: Focus on the *direction* of confirmation (P*(H|E) > P*(H)) rather than exact values.  

  These costs are accepted by most Bayesians (e.g., Howson & Urbach, Earman) as necessary to save the framework from POE. Alternatives (e.g., abandoning Bayesianism) are viewed as more expensive.

  ---

  ### **Real Scientific Cases Explained**
  - **Mercury's Precession & GR**:  
    Before GR, Newtonian mechanics (N) *failed* to fully explain E. Scientists knew E but had P*(E) < 1 because it was anomalous. GR gave P*(E|H) ≈ 1 and P*(E|N) ≈ 0 → strong confirmation.  
  - **Brownian Motion & Atoms**:  
    Einstein derived a precise quantitative prediction from atomic theory. Old evidence (Brownian motion) became confirming because the *specific fit* (P*(E|H)) was unexpected under alternative hypotheses.  

  ---

  ### **Other Solutions (Briefly)**
  - **Garber's Approach**: Learn not E, but *"H entails E"*. Then P(H | H⊢E) > P(H) if P(H⊢E) < 1.  
  - **Objective Bayesians**: Use priors that don't assign P(E)=1 (e.g., Jaynes' maximum entropy principle).  
  - **Non-Bayesian Workarounds**: E confirms H if H *best explains* E (e.g., IBE), but this abandons Bayesian probabilities.  

  ---

  ### **Conclusion**
  Reject **premise (2)** by adopting counterfactual credences (P*). This keeps Bayesianism intact, allows old evidence to confirm (as science demands), and only costs us a bit of idealization. The alternative—denying that Mercury's precession confirmed GR—would sink Bayesianism entirely. As Clark Glymour quipped: *"If the Bayesian wishes to be a complete account of science, he must solve this problem. If he cannot, he must surrender."* Fortunately, counterfactual Bayesianism provides the escape hatch you need.

  If you’d like to dive deeper into formal models (e.g., Garber’s solution) or historical cases, I’m happy to expand!
