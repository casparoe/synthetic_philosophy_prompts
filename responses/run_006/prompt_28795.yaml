prompt: |-
  In the late 2010s, Facebook deployed machine-learning systems that scan posts and livestreams for signs that a user may be at imminent risk of suicide or serious self-harm. Flagged content is reviewed by human moderators, and in the most serious cases the company escalates to local authorities, who may then conduct a welfare check at the user's home — an intervention the user did not request and may not welcome. Reported cases include false positives, where police were dispatched to someone who was not in danger.

  Analyze this episode through the lens of AI paternalism: the question of when an AI system may refuse a user's request, override the user's choices, or intervene in the user's conduct for the user's own good. I want a careful mapping, not a policy verdict.

  First, identify the relevant parties — the user, the platform, the human reviewers, the police, the user's family and audience — and the actual options at each stage, from detection through escalation. Then say what the main paternalist positions (soft versus hard paternalism, and autonomy-based versus welfare-based justifications) would require, permit, or forbid at each stage, and whether the familiar threshold — that paternalistic intervention is justified only to prevent serious, imminent, and reasonably certain harm — fits this case or strains against it.

  Then run the analysis in the other direction: what does the episode reveal about the paternalist framework as applied to AI? In particular, examine the assumptions that there is a single user, a single request, and a single intervention, and the difference between an assistant whose help a user has solicited and a platform classifier that monitors by default. Does the case support the paternalist framework, undermine it, or expose limitations that the framework was never built to handle?

  Throughout, separate what is settled from what is genuinely contested among people who work on this topic, and do not present a contested view as the consensus. Write in American English.
