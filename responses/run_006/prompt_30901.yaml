prompt: |-
  You're a political philosopher who specializes in democratic theory and populism. Think carefully, and start by brainstorming candidate rules before you commit to one.

  My friend is a political theorist who works on populism, and whenever I ask her whether some particular thing counts as the will of the people she gives these sharp yes/no verdicts. I've kept a list:

  - Yes to a referendum that passed 63–37 with 79% turnout, after an 18-month campaign with wall-to-wall coverage.
  - No to a politician who lost a presidential election by six points but said his mass rallies showed the real people were with him.
  - Yes to a climate law that passed the legislature 82–18 after a two-year public consultation, and that has polled between 66% and 71% approval every quarter for three years.
  - No to a general strike and street blockades demanding that the government reverse a policy, when every poll over the last year showed 57–61% of the public actually supporting the policy.

  Next week her state votes on a ballot meausre to repeal a housing law. It got almost no media coverage, most voters told exit pollsters they'd only heard of it in the final week, and it passed 50.4 to 49.6 with 38% turnout. A poll two weeks before the vote showed 52% planning to vote no.

  I'm less interested in the bare answer than in the rule she seems to be running, so don't just give me a yes or no. What are the candidate rules that fit her four earlier verdicts equally well? What does each candidate rule say about the ballot measure? What's your best guess about how she'll call it, and why? And what further case would most cleanly seperate the remaining candidate rules from each other?
reasoning: |-
  Okay, let me tackle this problem step by step. The user presents a scenario involving their friend, a political theorist specializing in populism, who gives clear yes/no verdicts on whether certain events represent the "will of the people." They've provided four examples and want to know what implicit rule their friend is using, how that rule would apply to a new ballot measure case, and how to further test the rule. 

  First, I need to analyze the four given verdicts to identify patterns. The friend approved a referendum with high turnout (79%) and clear majority (63-37) after extensive public debate. They rejected a politician claiming popular support despite losing an election by 6 points. They approved a climate law with legislative supermajority (82-18), long consultation, and sustained high public approval (66-71%). They rejected protest actions when polls showed consistent majority support for the opposed policy.

  These examples suggest several possible rules. The friend seems to value both formal democratic processes and substantive evidence of majority support, while dismissing claims based on intensity or self-proclaimed representation. The key factors appear to be: decision-making through proper institutional channels, sustained majority preferences reflected in voting or polling, and rejection of claims that bypass established processes.

  For the ballot measure case, the low turnout (38%), razor-thin margin (50.4-49.6), minimal media coverage, and last-minute voter awareness all raise questions. The pre-vote polling (52% against) adds another layer. If the friend prioritizes decisive majority expressions, this might be a "no." If they value formal processes regardless of quality, it might be a "yes."

  To distinguish between possible rules, a hypothetical case could be designed: a referendum with high turnout but very close result after excellent public deliberation. Would the friend accept this as legitimate? Their answer would reveal whether they require substantive decisiveness or just procedural correctness.

  The user's deeper interest seems to be understanding how democratic theorists draw boundaries around "the people's will" - an important question given current debates about populism and democratic legitimacy. By clarifying the implicit rules, we help illuminate the theoretical underpinnings of such judgments.
answer: |-
  Based on your friend's four verdicts, here's an analysis of candidate rules, their application to the ballot measure, the most probable verdict, and a critical test case:

  **Core Patterns from Verdicts:**
  1.  **Values Formal Authorization:** She respects outcomes from official decision-making processes (referendum, legislature).
  2.  **Requires Robust Majority Support:** Approval margins are decisive (63-37, 82-18) and/or sustained over time (polling). She rejects claims lacking this.
  3.  **Rejects Intensity & Self-Proclamation:** A politician claiming support based on rallies, or protesters claiming to *be* "the people," is insufficient without formal, broad authorization.
  4.  **Values Deliberation/Information:** Explicit mentions of long campaigns/consultations and polling suggest the "will" requires an informed public.
  5.  **Polls as Evidence (not Authority):** Polling matters when confirming sustained support for *existing* policy (*No* on protests) or showing lack of support for a *claim* of popular will (*No* on politician). Polls *before* a vote seem less decisive than the vote itself (*Yes* to referendum despite likely earlier polls).

  **Candidate Rules & Application to Ballot Measure:**

  1.  **The "Clear Mandate via Formal Process" Rule:**
      *   **Definition:** The "will of the people" is expressed *only* through formal democratic processes (elections, referenda, legislative votes) *and* requires a decisive margin (>~55%) *or* high turnout *or* evidence of sustained deliberation/information.
      *   **Fits Verdicts:** Yes (clear ref), No (no formal win), Yes (clear leg. vote + polls), No (no formal process for protesters).
      *   **Ballot Measure:** Likely **NO**. Fails decisiveness test (50.4% is razor-thin), fails turnout test (38% is low), fails information/deliberation test (low awareness, short notice). The prior poll showing opposition weakens the legitimacy claim.

  2.  **The "Sustained, Informed Majority Preference" Rule:**
      *   **Definition:** The "will" requires evidence of a stable majority preference, informed by adequate deliberation and public discourse, *expressed through or confirmed by* formal processes. Formal processes lacking these elements are insufficient.
      *   **Fits Verdicts:** Yes (ref: deliberation + majority), No (no sustained evidence), Yes (leg.: deliberation + sustained polls), No (protests: polls show opposite preference).
      *   **Ballot Measure:** Likely **NO**. Fails the information/deliberation test (low awareness, minimal coverage). The thin margin and low turnout further undermine it. The pre-vote poll showing opposition *before* minimal information spread suggests the "yes" vote doesn't reflect a considered, stable preference.

  3.  **The "Formal Authorization Plus" Rule:**
      *   **Definition:** Formal processes are necessary but not sufficient. The outcome must also align with evidence of *actual* majority preference (polls) *or* demonstrate robustness through high turnout/decisive margin *or* be preceded by significant deliberation. Contradiction between formal result and other evidence invalidates the claim.
      *   **Fits Verdicts:** Yes (ref: formal + decisive/high turnout), No (formal loss + no counter-evidence), Yes (formal + sustained polls), No (no formal + polls contradict protest claim).
      *   **Ballot Measure:** Likely **NO.** While formally passed, the low turnout, razor-thin margin, lack of deliberation, *and* the pre-vote poll showing opposition create significant doubt that the result reflects a genuine, considered majority preference. The formal win is too weak/compromised.

  4.  **The "Anti-Populist Institutional Legitimacy" Rule:**
      *   **Definition:** The "will" is expressed *only* through authorized institutional channels following established rules. Claims bypassing or undermining these channels (politicians declaring victory, protests claiming sole legitimacy) are rejected. The *quality* of the institutional process (deliberation, information, turnout) heavily weights the legitimacy of the outcome.
      *   **Fits Verdicts:** Yes (proper ref), No (bypassing election result), Yes (proper legislative process), No (bypassing legislature/polls via protest).
      *   **Ballot Measure:** Likely **NO.** While the ballot measure *is* a formal channel, the process was deeply flawed: minimal information, low awareness, low turnout, razor-thin margin. This fails the "quality" threshold for the institutional process to reliably express the popular will.

  **Best Guess for Her Verdict: NO**

  *   **Why:** All plausible candidate rules point towards rejection. The ballot measure fails every robustness test she implicitly values: decisiveness, turnout, deliberation, information, and alignment with prior preference evidence. It embodies the *thinness* of democratic legitimacy she rejected in the politician's rally claim and the protesters' assertions. The combination of low turnout, negligible information, a razor-thin win, and contradictory prior polling is fatal to its claim of representing "the will of the people" under any interpretation consistent with her past verdicts.

  **Critical Test Case to Separate Rules:**

  The most revealing case would pit procedural legitimacy against substantive robustness and deliberation:

  *   **Scenario:** A national referendum on a major constitutional amendment.
      *   **Process:** Extensive, well-funded public information campaign lasting 12 months, multiple televised debates, high media coverage. Voters demonstrably well-informed.
      *   **Turnout:** Very high (e.g., 85%).
      *   **Result:** Passes 50.5% to 49.5%.
      *   **Polling:** Consistently showed a dead heat (48-52% range) throughout the campaign, with significant shifts in the final week.

  **How this Separates Rules:**

  1.  **"Clear Mandate via Formal Process" Rule:** Likely **YES.** Formally passed via proper referendum, extremely high turnout. Decisive margin isn't met, but high turnout might compensate. (*Ambiguous* - rule prioritizes formality/turnout over margin).
  2.  **"Sustained, Informed Majority Preference" Rule:** Likely **NO.** Despite excellent deliberation, the result is *not* a stable majority preference; it's a statistical tie reflecting deep division. No evidence of a sustained "will." (*Clear NO*).
  3.  **"Formal Authorization Plus" Rule:** Likely **NO.** Formally passed with high turnout, but the razor-thin margin and lack of demonstrable stable majority (pre-vote polls showed dead heat) undermine the claim. The "plus" (robust majority) is missing. (*Likely NO, but close call*).
  4.  **"Anti-Populist Institutional Legitimacy" Rule:** Likely **YES.** The process was exemplary: high quality information, high engagement (turnout), proper formal channel. The close result is a legitimate outcome of a high-functioning democratic process. The rule values the *process* as the expression of will, even when the outcome is contested. (*Clear YES*).

  Your friend's verdict on this test case would be highly revealing:
  *   A **Yes** strongly favors the **Anti-Populist Institutional Legitimacy** rule or a lenient **Formal Authorization** rule.
  *   A **No** strongly favors the **Sustained, Informed Majority Preference** rule or a strict **Formal Authorization Plus** rule.
