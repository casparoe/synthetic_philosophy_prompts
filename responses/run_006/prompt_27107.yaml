answer: |-
  ### Joint Statement: Adversarial Collaboration on the Platonia Dilemma

  **Parties:**  
  - **Superrationalist Camp** (in the tradition of Douglas Hofstadter): Asserts that in symmetric dilemmas, rational players should adopt the strategy they would universally will, as their reasoning is the common output of a single symmetric situation.  
  - **Causal Decision Theorist Camp**: Asserts that rational players must maximize expected utility based on causally independent acts of others; symmetry cannot override causal isolation.  

  **Shared Case (Platonia Dilemma):**  
  - \(N\) players, symmetrically situated, unable to communicate.  
  - Each independently chooses to **Send** or **Not Send**.  
  - Prize is won if and only if **exactly one player Sends**.  
  - If zero or multiple players Send, no one wins.  
  - Both camps accept this description as neutral. The *Luring Lottery* (a variant where a fixed prize is divided among entrants via random draw) may be referenced for contrast, but Platonia is primary.  

  ---

  ### (1) Agreed Claims  
  Both camps jointly affirm:  

  1. **Weak Dominance**: For any individual player, **Sending** weakly dominates **Not Sending**. If all others **Not Send**, Sending wins the prize; otherwise, both actions yield nothing.  
  2. **Expected Payoff under Symmetric Randomization**: If each player independently Sends with probability \(p\), a player’s expected payoff is \(p(1-p)^{N-1} \times \text{Prize}\). This is maximized at \(p = 1/N\), yielding approximately \(\frac{\text{Prize}}{N \cdot e}\) for large \(N\).  
  3. **Nash Equilibria**:  
     - The only symmetric pure Nash equilibrium is **all Send**, yielding payoff zero.  
     - Pure Nash equilibria where someone wins exist only if **exactly one player Sends** (and others do not), but symmetry precludes selecting *which* player Sends.  
  4. **Superrational Mixture is Not Nash**: The symmetric mixed strategy \(p = 1/N\) is not a Nash equilibrium. If others play \(p = 1/N\), a player gains higher expected payoff by deviating to **always Send**.  
  5. **Symmetry and Coordination Failure**: The dilemma reveals:  
     - Individual rationality (via dominance) leads to the Pareto-worst outcome (all Send, payoff zero).  
     - Collective rationality (via \(p = 1/N\)) yields positive expected payoff but is unstable under individual deviation.  
  6. **No Symmetric Pure-Strategy Solution**: No symmetric pure strategy yields positive payoff.  
  7. **Role of Communication**: With communication, players could coordinate (e.g., randomly select one sender) for optimal payoff.  
  8. **Limitation of Standard Game Theory**: The dilemma exposes gaps in Nash equilibrium for symmetric one-shot dilemmas without communication:  
     - Efficient symmetric mixtures are unstable.  
     - Stable symmetric equilibria are inefficient.  

  ---

  ### (2) Disagreements Table  
  Each camp accepts its column’s phrasing as fair.  

  | Disagreement | Superrationalist View | Causal Decision Theorist View |
  |--------------|------------------------|--------------------------------|
  | **(a) Object of Rational Choice** | Rationality requires choosing the *common strategy* all players would will universally. Each player’s act is determined by symmetric reasoning, making individual and collective perspectives identical. | Rationality requires choosing the *individual act* maximizing expected utility given causal independence. No player’s choice influences others, so symmetry cannot substitute for causal/strategic links. |
  | **(b) Normative Force of Weak Dominance** | Weak dominance loses force when universal compliance yields Pareto-worst outcomes (all Send) while a symmetric non-equilibrium mixture (\(p = 1/N\)) yields positive payoff. Rationality overrides dominance via symmetry. | Weak dominance retains full normative force: each player’s choice is causally independent, so Sending remains optimal *regardless* of others’ acts. The efficiency of \(p = 1/N\) is irrelevant without coordination. |
  | **(c) Equivalence to Algorithm-Selection Case** | The original dilemma is equivalent to players selecting a *common decision algorithm* (taking game description/random seed as input). Transparency affects degree, not substance. | The original dilemma lacks the *causal link* of a shared algorithm. Algorithm-selection creates interdependence; the original does not. |
  | **(d) Substantive vs. Verbal Dispute** | The dispute is substantive: prescriptions differ (mixed strategy vs. always Send), leading to distinct outcomes. | The dispute is substantive: it concerns whether rationality permits symmetry to override causal independence. |

  ---

  ### (3) Cruxes and Predictions  
  For each crux, both camps accept the case/argument as bearing on the disagreement. Predictions are concrete and testable.  

  #### Crux 1: Algorithm-Selection Case  
  - **Case**: Players are told all run *identical decision algorithms* (same code, private random seeds).  
  - **Superrationalist**:  
    - Claim: Superrational strategy (\(p = 1/N\)) is rationally mandatory.  
    - Diagnosis: Original dilemma differs only in transparency; symmetry implies identical reasoning.  
  - **Causal Decision Theorist**:  
    - Claim: Algorithm-selection creates logical interdependence; original dilemma has none.  
    - Diagnosis: \(p = 1/N\) is rational here *only* due to the algorithm link; original prescribes always Send.  

  #### Crux 2: Sealed-Choice Case  
  - **Case**: Players are told others’ choices are *already sealed and unalterable*.  
  - **Superrationalist**:  
    - Claim: Player should **Send** (dominance applies; symmetry is broken).  
    - Diagnosis: Original dilemma’s simultaneity enables superrationality; sealed choices negate symmetry.  
  - **Causal Decision Theorist**:  
    - Claim: Player should **Send** (dominance holds; no causal link to others).  
    - Diagnosis: Agreement here reveals superrationality relies on equivocating between individual and collective agency.  

  #### Crux 3: Iterated Dilemma  
  - **Case**: Same players face Platonia repeatedly with full feedback.  
  - **Superrationalist Prediction**: Players converge to **turn-taking** (one Sends per round) or **symmetric mixtures** (\(p ≈ 1/N\)). Dispute dissolves with learning.  
  - **Causal Decision Theorist Prediction**: Players may converge to all-Send (Nash) or inefficient mixtures. Dispute survives: superstition isn’t needed for learning; causal reasoning persists.  

  #### Crux 4: Luring Lottery Variant  
  - **Case**: Prize is awarded by random draw to one entrant; expected payoff for an entrant is \(\frac{\text{Prize}}{k}\) if \(k\) enter.  
  - **Superrationalist**:  
    - Claim: Superrationality applies: symmetric mixture (e.g., \(p\) optimizing \(E[U]\)) is rational.  
    - Diagnosis: Payoff structure changes, but symmetry reasoning transfers.  
  - **Causal Decision Theorist**:  
    - Claim: **Entering** dominates **Not Entering**, but outcome (all enter, \(E[U] = \text{Prize}/N\)) is less dire than Platonia’s zero. Superrationality remains causally baseless.  
    - Diagnosis: Objection shifts in severity (CDT outcome is suboptimal but not catastrophic) but not kind.  

  ---

  ### (4) Closing Note: Verbal vs. Substantive  
  - **Verbal Disagreement**: None. Both camps use "rational" consistently within their frameworks. No portion hinges on semantics.  
  - **Substantive Disagreement**: Entire dispute concerns *what players should do*. Even if vocabulary were swapped:  
    - Superrationalists would still insist symmetry mandates \(p = 1/N\).  
    - Causal decision theorists would still insist dominance mandates always Send.  
  The core divide—whether rationality permits symmetry to override causal isolation—remains unresolved and empirically testable (e.g., via predictions in Crux 3).  

