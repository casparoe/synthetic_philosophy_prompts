prompt: |-
  I have been trying to understand how climate economists choose the discount rate for the social cost of carbon, and I keep running into the Ramsey rule. As I understand it, the rule sets the discount rate on future consumption equal to the pure rate of time preference plus the product of the elasticity of the marginal utility of consumption and the growth rate of per capita consumption. Since both of those terms are positive in the calibrations economists actually use, the rule appears to imply that future climate damages should be discounted at a substantial positive rate. Yet philosophers who work on intergenerational justice often say that the welfare of future people should count exactly as much as the welfare of people alive today. I cannot see how to hold both positions at once. If the Ramsey rule itself says that future welfare matters less, then is the philosophical demand for equal consideration of future generations just a refusal to accept the arithmetic of standard welfare economics? What would one have to reject in the Ramsey framework, and on what grounds, to make the equal-consideration view more than a slogan? Please answer in continuous prose, in the manner of an email, without headings, bullet points, bold text, or tables.
