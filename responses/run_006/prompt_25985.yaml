  Okay, the user runs a metaethics reading group and wants an activity that makes participants feel the problem of distinguishing moral preferences from biases. They're aiming for genuine uncertainty about their own moral convictions after facing debunking challenges. Let me unpack their request.

  First, they need an experiential exercise, not just discussion. The key is visceral engagement—participants should confront their intuitions being challenged. The proposed structure involves private judgments on cases, then revealing debunking info, followed by reevaluation. That makes sense for creating personal doubt.

  Considering their constraints: 90-minute session, 12 people (mix of grads/faculty). Need strict timing. Materials should be concise—maybe 4 cases max to allow depth. Handouts with cases and reflection prompts would work best. 

  For philosophical coverage, the activity must tie into evolutionary debunking, reliability of intuitions, explain vs explain away distinction. The debrief is crucial here. I'm thinking of cases that showcase framing effects (like the surgeon/butcher dilemma), cultural variation (disgust reactions), emotional contagion (empathy manipulation), and evolutionary mismatches (incest intuitions). 

  Potential pitfalls: People might dig in defensively when their views are challenged. Need to emphasize this isn't about being wrong but exploring epistemic uncertainty. Also, group dynamics—faculty might dominate, so private reflection first is essential. Skepticism bias is real; I'll suggest flagging this upfront and noting moral realism escape routes.

  Logistics: 5-min intro, 15-min private judgment, 30-min reveal/reevaluation, 30-min debrief, 10-min buffer. Cases must be provocative but not extreme—nothing that triggers real trauma. Handout design should scaffold the "why" for each judgment shift. 

  What this can't do: Resolve the metaethical debate, simulate all bias types, or address structural oppression adequately. Should explicitly state these limits. 

  Biggest risk is people feeling attacked. Mitigation: Stress personal reflection over debate, use neutral language ("consider" not "you're biased"), and focus on the philosophical puzzle rather than individual judgments. 

  Modified surgeon case could work well—revealing framing effects after initial disgust reaction. Cultural variation example with honor/shame vs dignity cultures would highlight relativity. For evolutionary mismatch, a harmless incest scenario where intuition persists despite no risk. 

  Debrief structure should move from personal experience to theory: Start with participant reactions, then map to concepts like reliability challenges, then discuss philosophical responses. Ending with Metzinger's quote reinforces productive uncertainty. 

  Need to predict time sinks: Case discussions running long, philosophical debates hijacking reflection time. Clear timekeeping and redirecting to the experiential goal will be key. Also prepare for the "but my intuition is different" responses by normalizing varied reactions. 

  Finally, materials should include facilitator talking points to ensure consistent framing of debunking info as neutral challenges rather than attacks. Participant handout needs clear sections for initial/revised judgments and reasoning. 

  This feels robust—creates the uncertainty they want while staying within time limits. The balance is making it personal enough to feel unsettling but academic enough to remain productive.
answer: |-
  Here’s a structured 90-minute activity designed to make participants **viscerally experience** the slipperiness of distinguishing moral preferences from biases, grounded in your requirements. It uses reflection, gradual debunking, and guided discussion to foster epistemic unease.

  ---

  ### **Activity: "Intuition Under the Microscope"**
  **Goal:** Induce uncertainty about whether deeply held moral convictions are preferences or biases by confronting participants with personalized debunking pressures.

  #### **Materials Needed**
  1.  **Participant Booklet** (1 per person):
      *   Page 1: Introduction & Instructions.
      *   Pages 2-3: 4 Moral Cases + Space for Initial Judgment & Brief Reason.
      *   Pages 4-5: "Revelation" Information for each case + Space for Revised Judgment & Reason.
      *   Page 6: Reflection Prompts for Debrief.
  2.  **Facilitator Notes:** Key talking points, timings, debunking info for each case.
  3.  **Whiteboard/Flipschart:** For debrief mapping.
  4.  **Timer.**

  #### **The 4 Cases (Select for potency & diverse debunking angles)**
  1.  **The "Disgusting" Surgeon:** *A highly skilled surgeon has saved countless lives using organs harvested from patients who died naturally. It's recently revealed she secretly eats a small, non-essential piece of tissue from each donor after removal, finding it deeply meaningful and pleasurable. No harm is caused; donors consented to organ donation, not this specific act. Is her action morally wrong?*  
      *   **Debunking Revelation:** Studies show moral judgments about harmless but "disgusting" acts (e.g., eating a sterilized cockroach, consensual sibling incest with contraception) are heavily influenced by incidental feelings of disgust, which can be manipulated by bad smells or messy rooms. Your judgment here likely tracks evolved disgust sensitivity more than harm.

  2.  **The "Unfair" Bargain:** *Two travelers, Alice and Ben, lose identical antique watches ($100 value) on a trip. Later, a stranger finds both watches. He returns Alice's watch to her intact. He tells Ben: "I found your watch, but I'll only return it if you pay me $90." Ben, desperate for his heirloom, pays. Is the stranger's action toward Ben morally wrong?*  
      *   **Debunking Revelation:** Cross-cultural data shows judgments about "fairness" in bargaining scenarios vary wildly. In some honor-based societies, exploiting a position of temporary power like this is seen as shrewd, not wrong. Your judgment likely reflects culturally acquired norms about reciprocity and "fair price," not universal moral truth.

  3.  **The "Loyal" Whistleblower:** *Sam works for a company dumping toxic waste, secretly poisoning a poor community. Sam anonymously leaks the documents, stopping the poisoning but causing the company to collapse, resulting in thousands of unrelated employees losing their jobs. Was Sam's whistleblowing morally obligatory?*  
      *   **Debunking Revelation:** Psychological research (e.g., Greene's dual-process theory) suggests judgments about causing large, impersonal harms (like layoffs) vs. preventing direct, personal harms (like poisoning) activate different brain systems. Emotional proximity to the victims (the poisoned community) often drives the sense of obligation more than the net harm/benefit calculus. Framing the harm as "collateral damage" vs. "direct poisoning" flips many people's judgments.

  4.  **The "Violated" Corpse:** *With *explicit, documented consent* given before death, a medical researcher uses a recently deceased body in a public educational demonstration involving procedures some might find disturbing or disrespectful (e.g., demonstrating rare surgical techniques on the face). No laws are broken. Is this morally permissible?*  
      *   **Debunking Revelation:** Evolutionary psychology suggests deep-seated intuitions about bodily integrity and respect for the dead (the "Hazard Precaution System") evolved to avoid disease and maintain social cohesion, not to track objective moral facts about consenting acts after death. Your discomfort may be a biological misfire in a context of informed consent and sterile conditions.

  ---

  #### **Timeline (90 Minutes Total)**

  1.  **Introduction (5 mins):**
      *   Frame the goal: "Today, we're not just talking *about* debunking challenges; we're going to *feel* them. The aim is uncertainty about our own intuitions, not conversion to skepticism."
      *   Explain the structure: Private judgments -> Revelations -> Re-evaluation -> Discussion.
      *   Emphasize honesty & introspection: "This is about your personal, private reflection. There are no 'right' answers."
      *   Distribute booklets.

  2.  **Private Initial Judgments (15 mins):**
      *   Participants read each case **individually and silently**.
      *   They record in their booklet: **1. Is it Wrong/Permissible/Obligatory? (Circle)** **2. Brief Reason (1-2 sentences).** *Stress brevity.*
      *   *Facilitator: Circulate quietly, ensure people are working independently.*

  3.  **Revelations & Re-evaluation (30 mins):**
      *   **Case-by-Case Walkthrough:** Facilitator introduces each case *briefly*, then reveals the "Debunking Revelation" information (verbally & participants read it in booklet).
      *   **Private Reflection:** After *each* revelation, give participants 2-3 minutes to privately answer in their booklet: **"Knowing this, do you STILL endorse your initial judgment? (Yes/No/Unsure) WHY or WHY NOT? (Be honest about your reasoning process)."**
      *   *Facilitator: Keep pace brisk. Don't allow discussion yet. Model neutral, curious tone when revealing info: "Research suggests..." "Cross-cultural data indicates..."*

  4.  **Structured Small Group Discussion (15 mins):**
      *   Divide into groups of 3-4.
      *   **Prompt:** "Share *only* your **process**, not necessarily your judgments. For which case did the revelation shake your confidence the *most*? Why was that one particularly potent *for you*? Did any revelation feel like it genuinely *explained away* your intuition, not just explained it? How did you decide?"
      *   *Focus on the experience of doubt and reasoning under pressure.*

  5.  **Full Group Debrief & Philosophical Mapping (25 mins):**
      *   **Start with Feelings:** "What was that experience like? Where did you feel genuine uncertainty arise?" (Gut responses: discomfort, surprise, defensiveness, fascination).
      *   **Map to Philosophy (Use Whiteboard):**
          *   **The Debunking Challenge:** "You just simulated an *individualized* debunking pressure. How does this connect to arguments like Street's Darwinian Dilemma or Joyce's evolutionary debunking?" (Highlight: Explaining the *origin* of an intuition vs. showing it's *unreliable*).
          *   **The Reliability Challenge:** "What makes an intuition a reliable 'preference' vs. an unreliable 'bias'? Did any of you feel you had a clear test during the activity?" (Lead into: Lack of independent access to moral truth; circularity problems).
          *   **Explain vs. Explain Away:** "When does an explanation (e.g., disgust, cultural learning) *vindicate* an intuition (it's tracking something real via that mechanism) and when does it *debunk* it (it's *only* tracking that mechanism)? How did you navigate this ambiguity?"
          *   **The Slippery Distinction:** "Why is there no easy, agreed-upon test? What are the implications for moral realism, constructivism, skepticism?" (Link back to their felt uncertainty).
      *   **Connect to Readings:** Briefly reference key texts discussed previously (e.g., Street, Joyce, Sinnott-Armstrong on moral intuition, Enoch on third-factor accounts).

  ---

  ### **What This Activity CAN'T Capture (Be Transparent)**

  1.  **Resolution is Impossible:** It's designed to *induce* doubt, not resolve it. It doesn't prove skepticism correct, nor does it provide a way out. It makes the *problem* vivid.
  2.  **Skepticism Tilt:** Yes, the activity inherently creates pressure toward skepticism. **Mitigation:** Explicitly state this upfront and in debrief: "This exercise *emphasizes* the challenge. Strong realist or constructivist responses exist (e.g., third-factor accounts, refined intuitionism, coherentism). The point is to feel the *force* of the challenge, not conclude it's insurmountable."
  3.  **Limited Bias Types:** Focuses primarily on psychological/cultural/evolutionary "noise" biases. It doesn't deeply address:
      *   **Structural/Systemic Biases:** (e.g., racism, sexism embedded in institutions/socialization). *Note:* Cases 2 & 3 can lightly touch on this, but it's not the focus.
      *   **Self-Interest/Cognitive Dissonance:** Biases protecting one's ego or lifestyle.
      *   **Full Relativism:** Cultural variation is used as a *challenge* to reliability, not necessarily as proof of relativism.
  4.  **Simplified Intuitions:** Real moral reasoning is complex; these cases isolate specific intuitions under lab-like conditions.

  ---

  ### **What Will Predictably Go Wrong & How to Handle It**

  1.  **Defensiveness/Digging In:** Some will resist changing judgments or downplay revelations.
      *   **Handle:** Normalize this! "Resistance is a natural part of this process. Notice if you felt it. That feeling *is* the data – it shows how deep the intuition runs. The point isn't to force change, but to notice the *friction* the revelation causes."
  2.  **Over-Intellectualizing:** Participants (especially faculty/grads) might leap to abstract defenses immediately.
      *   **Handle:** Enforce the structure. "Hold that thought for the debrief. Right now, focus on your *immediate, personal reaction* in the booklet." Redirect abstract debates in small groups back to "What did *you* experience?"
  3.  **Dominating Voices:** Some may monopolize discussion.
      *   **Handle:** Use structured small groups first. In full debrief, call on quieter members: "X, you looked thoughtful during Case 3, what was your experience?" Use the "process over conclusions" prompt.
  4.  **"But My Intuition is Different!":** Someone might claim a revelation doesn't apply to *them*.
      *   **Handle:** Acknowledge: "Absolutely, individual variation exists! The point isn't that *everyone* is fooled by disgust. The point is that this mechanism *can* and *often does* distort judgments, and it's incredibly hard for *anyone* to be *sure* it's not distorting *this specific judgment* right now. The challenge is *epistemic* – how can you *know* your intuition here is pure preference?"
  5.  **Time Crunch:** 90 minutes is tight.
      *   **Handle:** **STICK TO TIME RELIGIOUSLY.** Cut full-group sharing if needed; prioritize private reflection and small groups. The visceral *experience* is more important than covering every philosophical nuance in the debrief. Have a clear "parking lot" for tangential points.
  6.  **Emotional Discomfort:** Confronting core intuitions can be unsettling.
      *   **Handle:** Acknowledge this in intro/debrief. Frame it as intellectually valuable discomfort: "It's unsettling precisely because it matters. That unease is the engine of metaethics." Maintain a supportive but intellectually rigorous tone.

  ---

  **Key to Success:** Your role is **facilitator**, not lecturer. Prioritize creating space for personal reflection and the *feeling* of uncertainty. Use the revelations not as "gotchas" but as neutral data points prompting introspection. By ending in a state of productive uncertainty, you'll have achieved the core goal: making the abstract philosophical problem of distinguishing moral preferences from biases a deeply felt, personal puzzle. As Thomas Metzinger might suggest, the goal is to induce a state of *epistemic vigilance* about one's own moral mind.

  Good luck! This sounds like a fantastic group activity.
