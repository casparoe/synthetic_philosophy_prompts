prompt: |-
  I've been trying to work out what I think about moral worth — when a right action is done for the right reasons, such that the agent deserves credit. I've collected my verdicts on a set of cases, but I can't find a principle that gets all of them, and I suspect at least one of my verdicts has to go. I'd like you to help me extract the principle, test it, and tell me where I need to revise.

  Here are the cases and my verdicts.

  1. **The reluctant son.** A man visits his mother in the hospital every day. He finds it draining, gets no satisfaction from it, and resents the disruption to his life. But he goes anyway because he believes it is his duty. He would not go if he didn't believe it was his duty. Verdict: his action has moral worth.

  2. **The impulsive rescuer.** A woman sees a child struggling in a pond and immediately jumps in to save her. She doesn't deliberate; she later says she just saw a child in danger and acted. Verdict: her action has moral worth.

  3. **The tax-dodge donor.** A man writes a large check to a homeless shelter solely because he wants the tax deduction. He would not have donated otherwise. The shelter does excellent work. Verdict: his action lacks moral worth.

  4. **Huck Finn.** Huck helps the enslaved Jim escape. Huck has been raised to believe that helping a slave escape is theft and therefore morally wrong. He believes, sincerely, that he is doing something wrong. He does it anyway because he cares about Jim. Verdict: his action has moral worth.

  5. **The overdetermined volunteer.** A woman volunteers at a food bank both because she genuinely enjoys helping and because she believes she has a duty to help. If either motive were absent, she would still volunteer. Verdict: her action has moral worth.

  6. **The principled disaster.** A man believes, on sincere Kantian grounds, that one must never lie. A murderer comes to his door asking where his friend is hiding. The man tells the truth, and his friend is killed. He acted from a genuine commitment to moral principle. Verdict: his action lacks moral worth.

  7. **The lucky egoist.** A business owner treats his employees generously — good wages, reasonable hours, genuine respect — solely because he believes happy employees are more productive. He has no concern for their welfare as such. Verdict: his actions lack moral worth.

  8. **The Kantian saint.** Someone who has, over time, lost all natural sympathy for other people and finds human company burdensome. Nevertheless, he acts beneficently toward others solely from the motive of duty. Verdict: I am genuinely torn. Part of me says this must have moral worth — he's doing the right thing from duty, and what more could we ask? But another part finds something missing, something colder than what I want to credit.

  The tensions I can already see: Cases 4 and 6 seem to pull in opposite directions. In both, the agent acts from a sincere moral psychology, but in one the action is right and in the other it's wrong — so maybe the verdicts just track objective rightness plus the right kind of motive? But then Case 1 and Case 8 should be parallel, and I'm torn on one but not the other. And Case 2, the impulsive rescuer, seems to have moral worth without any thought about duty at all, which sits uneasily with Case 1.

  Please structure your response as follows.

  - **The pattern** (~250 words). State the best candidate principle you can find that captures as many of my verdicts as possible. Give the principle precisely enough that it yields determinate verdicts on new cases.

  - **Fit with the cases** (~400 words). Walk through each case and say whether the principle gets it right, strains to accommodate it, or flatly contradicts it. Flag the cases where the fit is worst.

  - **Verdicts to reconsider** (~200 words). Tell me which of my verdicts the principle forces me to drop or revise, and why those are the ones to give up rather than others. If you think a different principle saves more verdicts at an acceptable cost in complexity, say so.

  - **New cases** (~200 words). Give me two or three cases I haven't considered and say what the principle predicts for them. Pick at least one that you think will genuinely test my commitment to the principle.

  - **What's really at stake** (~150 words). Step back and say what deeper disagreement about moral worth my pattern of verdicts reveals — what I seem to care about, and what I might be getting wrong about it.
reasoning: |-
  Okay, let me approach this systematically. The user presents eight complex moral scenarios with their verdicts and seeks a unifying principle for moral worth - a challenging philosophical task that requires careful analysis.

  First, I need to understand the core tensions in their judgments:
  - Their approval of Huck Finn acting against his moral beliefs (Case 4) but rejection of the Kantian truth-teller (Case 6) creates a paradox
  - The discomfort with the Kantian saint (Case 8) contrasts sharply with approving the reluctant son (Case 1)
  - Impulsive rescuer (Case 2) gets credit without duty-consciousness, complicating motive-based theories

  The key insight appears to be that moral worth requires responsiveness to moral reasons. This explains:
  1) Why Huck deserves credit (he responds to Jim's humanity despite false beliefs)
  2) Why the Kantian disaster fails (rigid principle ignores moral consequences)
  3) Why impulsive rescuer succeeds (immediate recognition of moral demand)

  Cases 3 and 7 show moral worth can't be reduced to good outcomes - motives matter. Case 5 demonstrates that mixed motives don't undermine worth if moral reasons are engaged.

  For the Kantian saint case, I'll argue the user's discomfort stems from conflating moral worth with moral virtue - the saint still deserves credit even if we wish he had warmer feelings. This principle forces revising Case 6's verdict since the truth-teller is responsive to his moral reason (duty to truth).

  I'll test with new cases: one where someone does right for aesthetic reasons (should fail) and another where false beliefs lead to right action (should succeed if morally responsive). The deeper stake is whether moral worth tracks moral psychology or objective moral reasons - the user's pattern suggests the latter, even if it challenges some initial intuitions.
answer: |-
  ### The Pattern
  Your verdicts suggest a **Moral Reasons Responsiveness Principle (MRRP)**: An action has moral worth iff the agent performs the right action *because* they recognize and respond to the morally relevant features of the situation that make it right, regardless of their explicit moral beliefs or emotional state. 

  Key components:
  1. **Rightness**: The action must be objectively morally right.
  2. **Recognition**: The agent must accurately perceive the morally salient facts (e.g., suffering, injustice, need).
  3. **Response**: The motivating reason must be to address those facts *as moral demands*, even if not framed as "duty." Non-moral motives (e.g., tax breaks) or rigid principles that ignore context void moral worth.

  This avoids requiring "duty" as a motive (accommodating Case 2) while excluding actions driven by non-moral incentives (Cases 3, 7) or principles detached from moral reality (Case 6).

  ---

  ### Fit with the Cases
  - **Case 1 (Reluctant Son)**: **Fits**. He recognizes his mother’s need and responds to it as a moral demand (duty), despite reluctance.
  - **Case 2 (Impulsive Rescuer)**: **Fits**. She responds directly to the moral emergency (child’s danger) without needing "duty" as a conscious motive.
  - **Case 3 (Tax-Dodge Donor)**: **Fits**. His motive (tax deduction) ignores the moral reason (alleviating suffering); he’s unresponsive to moral features.
  - **Case 4 (Huck Finn)**: **Fits**. Huck responds to Jim’s humanity/suffering (moral reason) despite false beliefs; his *true* motive aligns with moral reality.
  - **Case 5 (Overdetermined Volunteer)**: **Fits**. Her enjoyment doesn’t negate her responsiveness to the moral reason (hunger/need).
  - **Case 6 (Principled Disaster)**: **Contradicts**. MRRP says *no moral worth*: He ignores the moral salience of saving a life, rigidly prioritizing abstract truth. But you say it lacks worth—**your verdict aligns with MRRP** (see "Verdicts to Reconsider").
  - **Case 7 (Lucky Egoist)**: **Fits**. He’s unresponsive to moral reasons (employee welfare); productivity is his sole motive.
  - **Case 8 (Kantian Saint)**: **Fits with tension**. MRRP says he *has* moral worth: He acts from duty *as* a response to moral demands (e.g., others’ needs). Your discomfort may stem from conflating worth with moral virtue—MRRP separates them.

  **Worst Fit**: Case 6 is the only direct contradiction. Your verdict rejects his worth, but MRRP *agrees* (see below). Case 8 highlights tension between worth and emotional engagement, but MRRP resolves it by prizing responsiveness over feeling.

  ---

  ### Verdicts to Reconsider
  **Revise Case 6 (Principled Disaster)**: Your verdict says the action *lacks* moral worth—**MRRP agrees**, but you initially listed it as a tension. Reconcile this: Huck (Case 4) responds to moral reality (Jim’s humanity) despite false beliefs, while the Kantian (Case 6) *ignores* moral reality (life-saving) for dogma. Both act "sincerely," but sincerity without moral responsiveness is insufficient. Drop the tension—your verdict here is consistent with MRRP.

  **Revise Case 8 (Kantian Saint)**: Your torn verdict should resolve to **moral worth**. MRRP clarifies that coldness is a defect in *virtue* (e.g., empathy) but doesn’t negate worth. He responds to moral reasons via duty—what "more we could ask" is Aristotelian virtue, but worth is narrower. Reject the intuition that warmth is necessary; it confuses two moral concepts.

  **Alternative Principle?** A "Hybrid Virtue-Worth" principle (e.g., requiring empathy + duty) would save your Case 8 discomfort but wreck Cases 1 (no empathy) and 2 (no duty). MRRP saves 7/8 cases cleanly, with only Case 8 requiring conceptual adjustment.

  ---

  ### New Cases
  1. **The Aesthetic Altruist**:  
     *A musician funds a school in a war zone solely because she finds children’s suffering "ugly" and disruptive to her artistic sensibilities. She cares nothing for their welfare.*  
     **MRRP Prediction**: *No moral worth*. She ignores the moral reason (alleviating suffering); her motive is aesthetic, not moral responsiveness.  

  2. **The Misanthropic Lifesaver**:  
     *A doctor loathes humanity but works in a pandemic because he believes "even worthless humans don’t deserve pointless pain." He correctly identifies reducing suffering as the moral demand.*  
     **MRRP Prediction**: *Moral worth*. His misanthropy doesn’t negate responsiveness to the moral reason (preventing suffering). Tests your commitment: if Case 8 has worth, so should this.  

  3. **The Accidental Advocate**:  
     *A CEO promotes workplace equity solely to attract talent. Unknown to him, his policy corrects a systemic injustice he’s oblivious to (e.g., gender pay gaps).*  
     **MRRP Prediction**: *No moral worth*. He’s unresponsive to the moral reason (injustice); his motive (talent acquisition) is non-moral.  

  ---

  ### What’s Really at Stake  
  Your verdicts prioritize **moral responsiveness to concrete reality** over abstract principles (Huck vs. Kantian) and reject instrumental motives (tax dodge, egoist). But you seem tempted to demand **emotional engagement** (Case 8 discomfort) or **duty-consciousness** (Case 1 vs. 2 tension). MRRP exposes a deeper divide: you value *why* agents act (their reasons) more than *how* they feel (sentiment) or *what* they believe (doctrine).  

  The risk? Over-intellectualizing worth. Case 2 (impulsive rescuer) shows responsiveness doesn’t require deliberation. Case 8 reveals that your hesitation might conflate moral worth with praiseworthiness *as a person*. MRRP cleanly separates the act’s worth from the agent’s virtue—letting you credit the Kantian saint’s actions while lamenting his character.
