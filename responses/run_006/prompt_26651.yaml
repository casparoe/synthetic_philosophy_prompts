prompt: |-
  I serve on the standards committee of a professional accreditation body. We design requirements—examinations, supervised practice hours, continuing education—meant to signal practitioner competence to the public. We have no systematic way to distinguish a requirement that actually screens for quality from one that merely imposes costs every candidate must bear. Please write a decision procedure, grounded in costly signalling theory and the handicap principle, that our committee can use to evaluate any proposed accreditation requirement. The procedure should be a sequence of questions with criteria for what counts as a sufficient answer, clear stop points, and explicit flags for where judgement cannot be eliminated. Run it on three proposals: (1) a 2,000-hour supervised practice requirement; (2) a difficult closed-book examination with a low pass rate; (3) a substantial accreditation fee. Include at least one case where the procedure returns an answer the committee will find unwelcome, and state what the procedure cannot handle. After the prose, supply a structured summary as a JSON object with fields for each step: the question, the criterion for yes, the criterion for no, whether the step requires judgement, and the next action. Please write in British English. Also indicate which empirical finding or theoretical challenge would most alter the procedure's recommendations—where the reasoning is most vulnerable.
reasoning: |-
  We are designing a decision procedure based on costly signalling theory and the handicap principle. 
   The core idea: a signal (here, an accreditation requirement) must be costly in a way that is more burdensome for low-quality individuals than high-quality ones. 
   This ensures that only genuinely competent individuals are willing to undertake the cost, making the signal honest.

   Steps in the procedure:

   1. **Is the requirement costly?** 
      - If not, then it cannot be a signal (because even low-quality individuals could easily acquire it). 
      - If it is costly, proceed.

   2. **Is the cost correlated with the underlying quality?** 
      - Specifically, does the requirement impose a higher cost (in time, effort, money, etc.) on low-quality individuals than on high-quality individuals? 
      - If the cost is the same regardless of quality, then it doesn't screen for quality (it's just a barrier that everyone must bear equally). 
      - If the cost is higher for low-quality individuals, then it can act as a signal.

   3. **Is the requirement strategically difficult to fake?** 
      - Even if costly, if low-quality individuals can easily mimic the signal (e.g., by cheating, or by bearing the cost without having the underlying quality), then it fails. 
      - We need to ensure that the requirement is not only costly but also that the cost cannot be avoided by low-quality individuals without actually acquiring the competence.

   4. **Is the requirement necessary and sufficient for signalling?** 
      - We must consider if there are alternative, less costly signals that could achieve the same goal (to avoid imposing unnecessary burdens). 
      - Also, we must ensure that the requirement does not exclude competent individuals who cannot bear the cost for reasons unrelated to quality (e.g., financial barriers for talented but poor candidates).

   5. **Does the requirement align with the public interest?** 
      - The signal must be interpretable by the public and must genuinely reflect competence that the public cares about. 
      - If it is too obscure or not clearly linked to the quality of service, then it might not serve its purpose.

   We'll structure the procedure as a sequence of questions with clear criteria and stop points.

   Proposed Procedure:

   Step 1: **Cost Question**
     - **Question:** "Does fulfilling this requirement impose a significant cost (in time, money, effort, or opportunity) on the candidate?"
     - **Yes criterion:** The requirement clearly requires resources that a candidate would prefer not to expend (e.g., time, money, effort). 
     - **No criterion:** The requirement is trivial or costless to fulfil (e.g., a simple form that takes 5 minutes to complete). 
     - **Judgement required?** Minimal. We can usually observe the cost.
     - **Next action if Yes:** Proceed to Step 2.
     - **Next action if No:** Reject the requirement. It fails the basic condition of being a costly signal.

   Step 2: **Differential Cost Question**
     - **Question:** "Is the cost of fulfilling the requirement substantially higher for candidates who lack the underlying competence (quality) than for those who possess it?"
     - **Yes criterion:** There is a plausible mechanism by which the competent candidate can achieve the requirement with less cost (e.g., because they learn faster, are more efficient, or have a natural advantage). 
     - **No criterion:** The cost is the same (or even higher) for competent candidates (e.g., a requirement that is equally burdensome for all, or one that competent candidates might find more onerous due to opportunity costs). 
     - **Judgement required?** High. We must reason about how the requirement affects different types of candidates.
     - **Next action if Yes:** Proceed to Step 3.
     - **Next action if No:** Reject the requirement. It imposes a uniform cost and thus does not screen for quality.

   Step 3: **Forgery Resistance Question**
     - **Question:** "Is it difficult for a candidate who lacks the underlying competence to fake or circumvent the requirement without bearing the full cost?"
     - **Yes criterion:** The requirement is structured so that the only way to meet it is to genuinely bear the cost and thereby acquire or demonstrate the competence (e.g., because of supervision, verification, or the nature of the task). 
     - **No criterion:** There are known or likely ways to avoid the cost without having the competence (e.g., cheating on an exam, falsifying hours, or paying someone else to do the work). 
     - **Judgement required?** Moderate to high. We must consider potential loopholes and enforcement.
     - **Next action if Yes:** Proceed to Step 4.
     - **Next action if No:** Reject the requirement. It is vulnerable to forgery and thus does not ensure honest signalling.

   Step 4: **Efficiency and Fairness Question**
     - **Question:** "Is the requirement the least costly (to both candidates and the accrediting body) effective signal available that achieves the desired level of screening? And does it avoid creating unfair barriers to entry for otherwise competent candidates?"
     - **Yes criterion:** We have considered alternatives and found this requirement to be the most efficient (i.e., imposes the least deadweight loss) and fair (does not systematically exclude competent candidates for reasons unrelated to the quality of their practice, such as socioeconomic status). 
     - **No criterion:** There is a less costly or more fair alternative that would achieve the same screening, or the requirement creates significant unfair barriers without a compensating increase in signalling value.
     - **Judgement required?** High. Requires weighing alternatives and ethical considerations.
     - **Next action if Yes:** Proceed to Step 5.
     - **Next action if No:** Reject the requirement. It is inefficient or unfair.

   Step 5: **Public Interpretability Question**
     - **Question:** "Is the requirement clearly linked to the competence that the public cares about, and will the public understand the signal?"
     - **Yes criterion:** The requirement is directly related to the skills or knowledge that define a competent practitioner in the public eye, and the public (or their agents, such as employers) will recognize the requirement as a meaningful indicator of quality.
     - **No criterion:** The requirement is tangential, overly technical, or not clearly connected to the public's conception of quality, so that the signal is not interpretable or may be misinterpreted.
     - **Judgement required?** Moderate. Requires understanding of public perception.
     - **Next action if Yes:** Accept the requirement as a valid signal.
     - **Next action if No:** Reject the requirement. It fails to serve the public interest.

   Now, we run the procedure on three proposals.

   Proposal 1: A 2,000-hour supervised practice requirement.

   Step 1: **Cost Question**
     - Clearly, 2,000 hours is a significant time cost. **Yes**.

   Step 2: **Differential Cost Question**
     - For a low-competence candidate, these hours might be very burdensome because they may struggle to learn and require more effort to achieve competence. A high-competence candidate might learn more quickly and find the hours less burdensome (though still costly). However, note that the requirement is supervised and structured, so it may force even high-competence candidates to spend the full time. 
     - **Judgement**: It's plausible that the cost is higher for low-competence candidates because they may need more time to achieve the same level. But it's also possible that the requirement is equally time-consuming for all. We might say **Yes** because low-competence candidates are more likely to fail or be held back, thus incurring extra costs.

   Step 3: **Forgery Resistance Question**
     - Supervision is key. If supervision is rigorous and prevents falsification, then it's hard to fake. But if supervision is lax, then candidates might log hours without learning. We must assume proper supervision. **Yes** (with good supervision).

   Step 4: **Efficiency and Fairness Question**
     - Is there a less costly alternative? Perhaps a shorter period combined with an assessment? Also, this requirement may exclude candidates who cannot afford to work for low pay during the supervised hours (if it's effectively an internship). **Judgement**: It may be inefficient if a shorter period with rigorous assessment would suffice. It may be unfair to those with financial constraints. **No** if we have evidence that a shorter period is equally effective, or if the financial barrier is too high. But without such evidence, we might accept it. **This step may return an unwelcome answer**: The committee might be attached to the 2,000-hour standard, but the procedure might flag it as inefficient or unfair.

   Step 5: **Public Interpretability Question**
     - The public understands that hands-on experience is valuable. **Yes**.

   Proposal 1 Conclusion: It passes Steps 1-3 and 5, but may fail Step 4. We must investigate alternatives and fairness. If we find that it is the most efficient and fair option, then we accept. Otherwise, we reject.

   Proposal 2: A difficult closed-book examination with a low pass rate.

   Step 1: **Cost Question**
     - Preparing for a difficult exam requires significant effort. **Yes**.

   Step 2: **Differential Cost Question**
     - A high-competence candidate will find it easier to study and pass because they have a stronger foundation and learn more efficiently. A low-competence candidate must invest much more time and effort to have a chance. **Yes**.

   Step 3: **Forgery Resistance Question**
     - Closed-book and proctored conditions make cheating difficult. However, some candidates might use brain dumps or other shortcuts. If the exam is well-designed and secure, then it's hard to fake. **Yes** (assuming good security).

   Step 4: **Efficiency and Fairness Question**
     - Exams are relatively efficient because they directly test knowledge and can be administered at scale. But they may disadvantage candidates who are poor test-takers or from educational backgrounds that don't teach exam techniques. Also, if the exam is not well-aligned with practice, it may be inefficient. **Judgement**: If the exam is valid (tests relevant knowledge) and there are accommodations for test-taking conditions, then it can be fair. **Yes** if well-designed.

   Step 5: **Public Interpretability Question**
     - The public understands exams and pass rates as signals of competence. **Yes**.

   Proposal 2 Conclusion: Accept.

   Proposal 3: A substantial accreditation fee.

   Step 1: **Cost Question**
     - A substantial fee is clearly costly. **Yes**.

   Step 2: **Differential Cost Question**
     - The fee is the same for everyone. However, it might be relatively less burdensome for a high-quality candidate because they are more likely to have the resources (e.g., they may already be earning more). Conversely, a low-quality candidate might be less able to pay. But note: the fee does not directly test competence. The problem is that the fee is not correlated with the underlying quality but with wealth. **No** because a high-quality candidate from a poor background might find it harder to pay than a low-quality candidate from a wealthy background.

   Step 3: **Forgery Resistance Question**
     - It's easy to pay the fee without having the competence. **No**.

   Step 4: (We don't reach this step because Step 2 is No) but even if we did, the fee is not a direct signal of competence and may be unfair to the less wealthy.

   Proposal 3 Conclusion: Reject at Step 2.

   What the procedure cannot handle:
     - It relies on judgements about differential cost and forgery resistance. These are not always empirically established.
     - It does not account for dynamic effects (e.g., how the requirement might change the pool of candidates over time).
     - It does not quantify the level of cost required to achieve separation between high and low types.

   Empirical finding or theoretical challenge that would most alter the procedure:
     - If research showed that a requirement thought to have differential cost actually does not (e.g., that supervised practice hours are equally burdensome for high and low competence candidates), then Step 2 would change.
     - Also, if we found that a requirement is vulnerable to forgery in practice (e.g., widespread cheating in exams) then Step 3 would be affected.

   Now, the JSON summary.
answer: |-
  ### Decision Procedure for Accreditation Requirements

  Based on costly signalling theory and the handicap principle, this procedure evaluates whether a requirement functions as an honest signal of competence by imposing costs that are differentially burdensome for low-competence individuals. The procedure consists of five sequential questions. A "No" at any step rejects the requirement. Judgement is required where empirical evidence is ambiguous.

  ---

  #### **Step 1: Cost Existence Check**  
  **Question:** "Does the requirement impose a non-trivial cost (time, effort, financial, or opportunity cost) that would deter candidates from pursuing accreditation if they could avoid it?"  
  - **Yes criterion:** The cost is substantial enough that rational candidates would weigh it against the benefits of accreditation (e.g., 2,000 hours represents >1 year of full-time work; a £1,000 fee is material for early-career professionals).  
  - **No criterion:** The cost is negligible (e.g., a 1-hour online module).  
  - **Requires judgement?** Minimal. Cost magnitude can be objectively assessed.  
  - **Next action:**  
    - Yes → Proceed to Step 2.  
    - No → **Reject requirement.** It fails as a signal (no cost barrier).  

  #### **Step 2: Differential Burden Assessment**  
  **Question:** "Is the cost disproportionately higher for low-competence individuals than for high-competence individuals, making completion harder without genuine competence?"  
  - **Yes criterion:** Competence reduces the cost burden (e.g., skilled candidates complete tasks faster, pass exams with less study, or offset fees through higher earnings).  
  - **No criterion:** Cost is uniform or inversely correlated with competence (e.g., fees burden competent low-income candidates more; memorisation-heavy exams favour poor practitioners who "cram").  
  - **Requires judgement?** High. Relies on theoretical reasoning or indirect evidence (e.g., pass rates by skill level).  
  - **Next action:**  
    - Yes → Proceed to Step 3.  
    - No → **Reject requirement.** It imposes deadweight costs without screening (e.g., arbitrary barrier).  

  #### **Step 3: Forgery Resistance Test**  
  **Question:** "Can low-competence individuals easily fake compliance or circumvent the requirement's intent without bearing the full cost?"  
  - **Yes criterion:** The requirement has safeguards against gaming (e.g., supervision prevents falsifying hours; exam security deters cheating).  
  - **No criterion:** Circumvention is likely (e.g., fees can be paid by third parties; unsupervised hours can be logged fraudulently).  
  - **Requires judgement?** Moderate. Assess design robustness and historical fraud rates.  
  - **Next action:**  
    - Yes → Proceed to Step 4.  
    - No → **Reject requirement.** It allows dishonest signalling.  

  #### **Step 4: Efficiency and Necessity Evaluation**  
  **Question:** "Is this the least costly effective signal available? Does it avoid excluding competent candidates for reasons unrelated to competence (e.g., socioeconomic factors)?"  
  - **Yes criterion:** No less burdensome alternative achieves equivalent screening (e.g., a shorter practicum or lower fee would admit unqualified candidates). The requirement minimises false exclusions of competent individuals.  
  - **No criterion:** Alternatives exist (e.g., skills assessments replace hours; income-based fee waivers). The requirement creates inequitable barriers (e.g., fees exclude talented low-income candidates).  
  - **Requires judgement?** High. Balances signalling efficacy against social equity and efficiency.  
  - **Next action:**  
    - Yes → Proceed to Step 5.  
    - No → **Reject requirement.** It is inefficient or unfair.  

  #### **Step 5: Public Interpretability Verification**  
  **Question:** "Will the public reliably interpret this requirement as a valid indicator of competence, and does it align with societal expectations of professionalism?"  
  - **Yes criterion:** Laypeople intuitively link the requirement to competence (e.g., exams signal knowledge; supervised hours signal experience).  
  - **No criterion:** The requirement is opaque or misleading (e.g., fees may be seen as "pay-to-play"; obscure tests lack face validity).  
  - **Requires judgement?** Moderate. Requires market research or precedent.  
  - **Next action:**  
    - Yes → **Accept requirement.**  
    - No → **Reject requirement.** It fails public transparency.  

  ---

  ### Application to Proposals  
  **Proposal 1: 2,000-hour supervised practice requirement**  
  - **Step 1 (Cost):** Yes (substantial time cost).  
  - **Step 2 (Differential Burden):** Yes. Low-competence individuals require more repetition/feedback, making hours costlier. High-competence candidates learn efficiently.  
  - **Step 3 (Forgery):** **Judgement call.** With rigorous supervision, yes. With lax oversight, no (risk of fraudulent logging). *Assumed rigorous*.  
  - **Step 4 (Efficiency):** **Unwelcome answer: No.** Alternatives exist (e.g., competency-based assessments). Hours may exclude caregivers or part-time workers—unfair if competence isn't time-dependent.  
  - **Verdict:** **Reject** unless redesigned for flexibility.  

  **Proposal 2: Difficult closed-book exam with low pass rate**  
  - **Step 1 (Cost):** Yes (high effort to prepare).  
  - **Step 2 (Differential Burden):** Yes. Competent candidates pass with less study; incompetent ones invest heavily or fail.  
  - **Step 3 (Forgery):** Yes (closed-book/proctored design deters cheating).  
  - **Step 4 (Efficiency):** Yes. Efficiently tests knowledge; alternatives (e.g., open-book exams) may be less secure.  
  - **Step 5 (Public):** Yes. Exams are widely accepted as competence signals.  
  - **Verdict:** **Accept.**  

  **Proposal 3: Substantial accreditation fee**  
  - **Step 1 (Cost):** Yes (financial burden).  
  - **Step 2 (Differential Burden):** **No.** Fees burden low-income candidates equally regardless of competence. Wealthy but incompetent candidates pay easily.  
  - **Verdict:** **Reject at Step 2.** A pure cost with no differential link to competence.  

  ---

  ### Limitations and Vulnerabilities  
  - **What the procedure cannot handle:** Dynamic market effects (e.g., requirements altering candidate pools over time) or non-linear cost-competence relationships.  
  - **Critical vulnerability:** **Empirical evidence on correlation between cost and competence.** If research shows competent candidates bear *higher* opportunity costs (e.g., skipping lucrative work for practicums), Step 2 logic reverses—invalidating the entire procedure. Theory assumes competence reduces costs; real-world data could refute this.  

  ---

