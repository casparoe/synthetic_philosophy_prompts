  4. **Participation Duties:** Even if marginal impact is zero, does participation in a harmful system create an obligation? I'd say 40-60%, acknowledging the debate here.

  Combining these: Multiplying the probabilities for the causation and expected impact parts, then adding the participation aspect. The key sensitivity is around marginal causation—whether individual actions can actually influence production. That's where empirical evidence is crucial.

