  Next, participation-based duties. This is about being part of a harmful system. Even if my individual action doesn't change anything, am I still complicit? Similar to voting or paying taxes in an unjust system. There's also expressive value and integrity, but the user specified to focus on expected impact, so maybe set that aside.

