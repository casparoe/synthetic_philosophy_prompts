answer: |-
  Here's a defended agenda for your dissertation, prioritizing open questions on expected value fanaticism based on your constraints. I'll cut through the noise: the field is **stuck in a loop** between technical patches (e.g., bounded utility) and dismissals (e.g., "just Pascal's mugging"), while core philosophical and structural issues remain unresolved. Your formal background is a strength—this is a battle fought with theorems, not data. Below are the top open questions, ranked by upstream impact, tractability, and neglected urgency. I'll explain why common "solutions" are band-aids and why two questions deserve your focus.

  ### The Core Dysfunction
  Expected utility (EU) fanaticism arises because EU is linear in probabilities but *can be* superlinear in outcomes. Standard fixes fail because:
  - **Bounded utility** feels arbitrary without justification for *where* bounds exist or *why* they’re necessary (e.g., why bound at 10^100 utils?).
  - **Thresholds** (ignore probabilities below ε) are ad hoc and vulnerable to *parameterization attacks* (e.g., why ε = 10^-100?).
  - **Pascal’s mugging dismissals** ignore that real longtermist cases (e.g., existential risk mitigation) involve structurally uncertain, non-gamed probabilities.

  The open questions aren’t about tweaking EU—they’re about **reconciling rationality with cosmic-scale uncertainty**. Prioritization depends on:
  - **Upstreamness**: Does it force reframing the problem?
  - **Tractability**: Can formal tools crack it in 3 years?
  - **Leverage**: Will progress here constrain other solutions?
  - **Neglect**: Is it buried under overrated distractions?

  ### Top Priority Open Questions (Ranked)
  #### **1. Structural Uncertainty and the Impossibility of Well-Defined Probabilities**  
  **Question**: *How should agents make decisions when probabilities cannot be coherently defined over high-stakes outcomes (e.g., "probability of a technological singularity") due to model ambiguity, cluelessness, or undefined measure spaces?*  
  - **Why it’s upstream**: Fanaticism collapses if probabilities aren’t additive or aren’t defined at all. EU assumes a sigma-algebra over outcomes, but in longtermism, the event space may be non-measurable (e.g., "all possible futures post-singularity"). Solving this could replace probability-driven fanaticism with a framework for *radical uncertainty*.  
  - **Tractability**: High for you. Use tools from:  
    - Imprecise probability (e.g., Levi-admissibility)  
    - Ambiguity aversion (e.g., smooth ambiguity models)  
    - Algorithmic information theory (to formalize "unknowable" events)  
    Formalize a decision rule that doesn’t require precise probabilities for extremal outcomes.  
  - **Why prioritize?**  
    - **Downstream impact**: Reshapes how we model uncertainty in fanaticism-prone cases. If successful, thresholds/bounds become unnecessary.  
    - **Leverage**: Forces longtermists to justify probability models, not just utilities.  
    - **Neglect**: Overrated work focuses on *how to bound utilities* (downstream) or *dismissing small probabilities* (naive). This is underexplored because it’s metaphysically uncomfortable.  
    - **Risk factor**: If evidence grows that key longtermist probabilities are truly undefined (e.g., via no-free-lunch theorems for prediction), this becomes urgent.  
  - **What success looks like**: Axiomatize a decision theory for "deep uncertainty" that avoids fanaticism without arbitrary parameters.  

  #### **2. Justifying the Shape of Utility Functions from First Principles**  
  **Question**: *Can we derive functional forms for utility (e.g., boundedness, risk-sensitivity) from axiomatic principles that reflect agents' epistemic or resource constraints?*  
  - **Why it’s upstream**: Fanaticism vanishes if utility is bounded, but *why should it be?* Current justifications are circular ("to avoid fanaticism") or aesthetic ("infinite utils are weird"). A derivation from decision-theoretic axioms (e.g., computational limits, finite information) would make bounded utility non-arbitrary.  
  - **Tractability**: Moderate. Build on:  
    - Resource-rationality models (e.g., cost of computing utilities)  
    - Axiomatic approaches to risk (e.g., weighting functions from rank-dependent utility)  
    - Entropic regularization (e.g., utility as bounded by information capacity)  
    Prove that rational agents with finite resources *must* have utility functions that saturate.  
  - **Why prioritize?**  
    - **Downstream impact**: If you succeed, bounded utility stops being a hack and becomes a consequence of rationality. This would shut down fanaticism at the source.  
    - **Leverage**: Upstream of threshold approaches (which assume bounded utility).  
    - **Neglect**: Overrated work tweaks existing bounds (e.g., "harmonic" bounds) without foundational justification. This is underexplored because decision theorists avoid metaphysics.  
    - **Risk factor**: If AI alignment or climate modeling hits a fanaticism wall, demand for non-arbitrary bounds spikes.  
  - **What success looks like**: An impossibility theorem showing that unbounded utility violates rationality axioms for finite agents.  

  #### **Question I’d Deprioritize (But Monitor)**  
  **Intertheoretic Value Comparisons**: *How to weigh conflicting utilities across ethical frameworks (e.g., total vs. average utilitarianism) in fanaticism-prone cases?*  
  - **Why skip it?** It’s downstream. Fanaticism arises *within* a single utility function—if you solve structural uncertainty or utility shaping, intertheoretic issues become modular add-ons. It’s also intractable without empirical anchors (which you lack).  
  - **Overrated because**: Papers like "Fanaticism in Moral Uncertainty" (MacAskill) are important but don’t resolve the core EU failure. Answers here won’t change if EU itself is flawed.  

  ### Why This Ranking?  
  - **Structural uncertainty (#1)** because it attacks the problem’s root: EU’s reliance on precise probabilities in domains where they don’t exist. With your tools, it’s actionable and revolutionary.  
  - **Utility shaping (#2)** because it’s the strongest counter to fanaticism *if* you can ground it axiomatically. It’s slightly less upstream than #1 but more formal.  
  - **Tractability balance**: Both questions use your DT strengths. #1 leverages uncertainty modeling; #2 uses axiomatic derivation. No lab needed.  
  - **Overrated work to ignore**:  
    - **Pascal’s mugging "solutions"** (e.g., tiered voting) are toy models that don’t scale to cosmic stakes.  
    - **Infinity ethics** (e.g., Bostrom’s infinite ethics) is mathematically interesting but often assumes the problem away (e.g., measure problems).  
    - **Regret bounds** (e.g., minimizing worst-case regret) feel like surrendering to fanaticism.  

  ### What Would Change the Ranking?  
  - **Push #1 higher**: If new results show longtermist probabilities are *provably* incoherent (e.g., from complexity theory), this becomes urgent.  
  - **Push #2 higher**: If a major paper (e.g., in Econ or Phil Science) derives bounded utility from physical constraints.  
  - **Abandon both for**: A breakthrough in **context-dependent utility aggregation** (e.g., "utils per unit compute"), but this needs empirical work.  

  ### Your Path Forward  
  **Year 1**: Formalize structural uncertainty. Start with an impossibility theorem: "Under axioms X, no EU-maximizer can assign coherent probabilities to outcomes beyond complexity threshold Y."  
  **Year 2**: Attack utility shaping. Show that resource constraints (e.g., finite memory) imply risk-sensitive utility functions.  
  **Year 3**: Synthesize. Prove that structural uncertainty + resource-bounded utility dissolve fanaticism without thresholds.  

  This agenda makes you the person who **replaced evasion with engineering**. The field is confused because it treats fanaticism as a bug in EU—but it’s a stress test revealing EU’s metaphysical naivete. Your goal: Build decision theory for a universe too big for tidy probabilities.
