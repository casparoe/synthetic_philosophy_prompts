  The ethical dimension matters too. Calling this a "disease" justifies aggressive interventions with side effects, while calling it a "risk factor" might lead to monitoring without immediate treatment. The doctor's stance reflects medicine's increasing focus on pathological processes over lived experience - what sociologists call "bureaucratic diagnosis."

  I should emphasize that both frameworks have validity. The biological abnormality exists (supporting early intervention), but absence of impairment warrants caution about overmedicalization. The resolution might lie in recognizing disease as occurring at the intersection of biology and experience - what Boorse called "biological dysfunction" combined with Wakefield's "harmful dysfunction" theory.

