prompt: |-
  ok so in my philosophy class we read this debate between Daniel Dennett and Gregg Caruso about free will and punishment. Dennett basically says we can still have moral responsibility and deserve punishment even if determinism is true, because we evolved to be reason-responsive and that's enough to ground desert. Caruso says nah, if determinism is true then the whole idea of basic desert moral responsibility is a myth and we should replace punishment with a public health/quarantine model. what I'm stuck on is how they each handle the concept of "desert" specifically. Dennett seems to think you can have a kind of desert that doesn't require libertarian free will, and Caruso thinks that's just watering down the concept until it's empty. Can you compare their accounts of what desert amount to, and then tell me which one actually captures what we mean when we say someone "deserves" punishment? I want a committed answer — take a side and defend it, don't just give me a tie.
