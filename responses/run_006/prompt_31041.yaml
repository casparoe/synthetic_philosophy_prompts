prompt: |-
  been trying to get my views on hard choices and incommensurability into a coherent package for a post, and I'd like a consistency check before I hit publish. here's where I've landed:

  (a) i'm pretty commited to expected utility reasoning, and in practice I treat my preferences over concrete outcomes as complete: for any two options, one's better, the other's better, or they're exactly equal.
  (b) but I also think some choices are hard in Ruth Chang's sense — career vs. relationship, say — where it's not that I'm missing information, the options aren't equal, but neither is better than the other.
  (c) i think money-pump arguments are a good reason to keep preferences transitive, but I don't buy them as arguments for completeness; indecision isn't the same as a preference cycle.
  (d) when I actually make a hard choice, I don't think I'm discovering a hidden ranking. I treat the choice as settling it, and afterwards I can say the chosen option was better for me without thinking I was wrong before.
  (e) at the same time, I think 'incommensurable values' is usually an excuse for not doing the math, and for policy tradeoffs — statistical lives, time, money — I'm fine assigning numbers even when it feels gross.

  which of these are actually in tension, which only look like they are, and how would you rank the tensions? for each real tension, what's the cheapest revision and what does it cost me? I genuinely can't tell whether (a) and (b) are fine together or whether one of them has to go.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're trying to reconcile their views on hard choices and incommensurability with their commitment to expected utility theory. The key points they listed are (a) to (e). I need to check for internal consistency and identify tensions.

  First, the main conflict seems between (a) and (b). (a) insists on complete preferences, meaning any two options can be compared. But (b) accepts Ruth Chang's hard choices where options aren't comparable even with full information. That's a direct contradiction. The user treats preferences as complete in practice but acknowledges cases where neither option is better. That's a problem because completeness requires a determinate ranking. 

  Then looking at (c), they reject money-pump arguments for completeness but accept them for transitivity. That makes sense because indecision doesn't necessarily lead to cycles. But this doesn't resolve the (a)-(b) clash. 

  Point (d) is about choice creating preference post-decision. Chang's position fits here, but it's at odds with (a)'s completeness. If preferences are complete before choice, why would choosing create the ranking? 

  Point (e) criticizes using incommensurability as an excuse, especially in policy contexts. The user is comfortable with quantification there, which contrasts with personal hard choices. This situational approach might work, but it doesn't solve the core tension.

  The user might be using different frameworks for different contexts. Personal decisions allow for incomparability, while policy requires quantification. But they need to acknowledge this explicitly. The cheapest fix is to limit completeness (a) to contexts where quantification is possible, accepting incompleteness elsewhere. That costs some theoretical purity but saves their practical approach.

  They might also be conflating epistemic limitations with ontological incomparability. But they state in (b) it's not about missing info. So they need to bite the bullet on incompleteness. 

  Another angle: maybe they treat preferences as complete by stipulation for decision purposes, knowing some values are incommensurable. But that risks inconsistency. Admitting incompleteness in (a) seems necessary. The cost is moving away from strict expected utility theory, which assumes completeness.

  I should also consider their deeper needs. They want both rationality (expected utility) and authenticity in hard choices. They might fear that admitting incompleteness undermines decision-making. But Chang's framework allows commitment without discovery, which preserves agency. Highlighting that could help them reconcile.

  Potential revisions: clarify domains where completeness holds, accept incompleteness in personal choices, or reframe choice as commitment. The cheapest is domain-specific completeness, maintaining EU in quantifiable areas while accepting hard choices elsewhere. Cost: a bit of inconsistency but pragmatically workable.
answer: |-
  Based on your points, here's a breakdown of the tensions and how to resolve them:

  **Core Tension: (a) vs. (b)**
  *   **The Conflict:** This is the fundamental tension. (a) demands *completeness*: for any two options A and B, your preferences must satisfy exactly one of A>B, B>A, or A=B. (b) explicitly describes a situation (hard choices) where none of these hold: A is not better than B, B is not better than A, and A is *not* equal to B. Ruth Chang defines this fourth relation as "on a par." Completeness excludes this possibility.
  *   **Why it Looks Like It Might Not Be:** You might be *treating* preferences as complete *in practice* (a) for calculable decisions, while *theorizing* that some underlying values are incomparable (b) in ways that *could* manifest as hard choices. But (b) directly contradicts the core axiom of (a) for those specific choices.
  *   **Cheapest Revision & Cost:**
      1.  **Revise (a) to allow incompleteness:** Acknowledge that your preferences are *not* always complete. You treat them as complete *where possible* (especially with quantifiable outcomes), but accept that genuine hard choices represent incomparability/incommensurability.
          *   **Cost:** Requires stepping slightly outside the strictest interpretation of Expected Utility Theory (EUT), which assumes completeness. You must accept that your preference relation is sometimes incomplete. EUT reasoning still applies *when* preferences *are* comparable.
      2.  **Refine (b):** Argue that hard choices *only feel* like neither is better, but upon deeper reflection or commitment (as per (d)), a true strict preference *does* exist, even if latent or constructed. The "on a par" feeling is epistemic, not ontological.
          *   **Cost:** This abandons Ruth Chang's core insight about the nature of hard choices. It makes (d) ("settling it") a process of *discovering* a hidden preference, rather than *creating* it through commitment. It undermines the distinct phenomenology of hard choices you describe.
  *   **Recommendation:** **Revise (a) to allow incompleteness.** This preserves the core insight of (b) and fits perfectly with (d). It's the cheapest revision philosophically, costing only adherence to the strictest EUT axioms in *all* cases. Your practical use of completeness for calculable decisions remains intact.

  **Significant Tension: (a) vs. (d)**
  *   **The Conflict:** If preferences are complete (a), then *before* you make a choice, one option *was* better, they *were* equal, or you simply didn't *know* the ranking. (d) explicitly denies this: you weren't wrong before; the choice *settled* the matter, making the chosen option better *after* the choice.
  *   **Why it Looks Like It Might Not Be:** You might argue the preference existed but was indeterminate or unformed until acted upon.
  *   **Resolution:** Revising (a) to allow incompleteness **resolves this tension completely.** If A and B were genuinely on a par (incomparable), then *before* the choice, neither *was* better. Your commitment *creates* the reason why the chosen option is now better for you. (d) becomes the natural consequence of accepting (b) and rejecting completeness for these cases.

  **Minor Tension / Clarification Needed: (b) vs. (e)**
  *   **Potential Conflict:** (b) endorses genuine value incomparability in personal hard choices. (e) criticizes appeals to "incommensurable values" as often being an excuse for not quantifying in policy contexts.
  *   **Resolution:** This is likely **not a true tension, but a domain distinction.** You can consistently hold:
      *   Personal, identity-constituting choices involving deep values (career vs. relationship) *can* involve genuine incomparability ("on a par") that resists quantification (b).
      *   Societal policy tradeoffs involving fungible goods (money, statistical lives, time) *should* be quantified whenever possible, and appeals to incommensurability here are often lazy or obstructive (e).
  *   **Action:** **Clarify this domain distinction** in your post. Explicitly state that your acceptance of hard choices/incomparability applies primarily to deeply personal, value-laden decisions, not to policy tradeoffs of broadly commensurable resources.

  **No Significant Tension:**
  *   **(c) vs. Everything Else:** Your position on (c) is sound and compatible. Money pumps strongly argue for transitivity but are weak arguments for completeness, precisely because indecision/incomparability doesn't create the cyclical preferences that make you exploitable. Accepting incompleteness (as suggested for revising (a)) aligns perfectly with (c).
  *   **(d) and Revised (a):** As resolved above, accepting incompleteness makes (d) the natural mechanism for resolving hard choices through commitment. They become complementary.
  *   **(e) and Revised (a/b):** Distinguishing domains resolves this. You can use EU reasoning with quantified preferences/completeness *in policy domains* (e) while accepting incompleteness and commitment for *personal hard choices* (revised a, b, d).

  **Ranking of Tensions:**

  1.  **(a) vs. (b):** **High Severity** - Direct logical contradiction on the axiom of completeness. Requires revision.
  2.  **(a) vs. (d):** **Medium Severity** - Contradiction if completeness is held strictly, resolved by revising (a). Highlighted by the resolution of (a) vs. (b).
  3.  **(b) vs. (e):** **Low Severity** - Potential appearance of conflict easily resolved by clarifying the domain of application for each point.
  4.  **(c) vs. Others:** **No Significant Tension** - Position is compatible with all others.

  **Conclusion & Recommendation:**

  Your most significant tension is between your practical commitment to completeness (a) and your belief in genuine hard choices/incomparability (b). **The cheapest and most coherent revision is to relax (a), allowing your preference relation to be incomplete.** This:

  1.  Preserves the core insight of (b) and Chang's work.
  2.  Perfectly explains and validates (d) - choice as commitment creating reasons.
  3.  Is fully compatible with (c) - indecision ≠ cyclic preferences vulnerable to money pumps.
  4.  Allows you to maintain (e) by distinguishing domains - quantification is crucial and possible for policy tradeoffs, even while acknowledging genuine incomparability exists in personal spheres.
  5.  Lets you keep using EU reasoning *whenever preferences are comparable/complete*, which covers most calculable decisions and all policy work.

  **Cost:** You step slightly outside the strictest axiomatic foundation of Expected Utility Theory by rejecting the Completeness axiom *in principle* for *all possible choices*. However, you retain EU as an incredibly powerful tool for the vast majority of decisions *where* comparability holds. This cost is minimal compared to sacrificing the phenomenological reality of hard choices or making (d) merely a discovery mechanism.

  **Before Publishing:** Add a sentence or two explicitly acknowledging this relaxation of completeness for hard choices and clarifying the domain distinction between personal incomparability and policy commensurability (resolving b vs. e). This package then becomes highly coherent.
