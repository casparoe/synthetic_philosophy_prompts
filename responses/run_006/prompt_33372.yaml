  The user's clearly time-pressed and needs battle-tested pedagogy. Their advisor's absence adds pressure. The "grieving friend" example instinct is pedagogically sound but they're right to worry about pity associations - that exact misconception is why students derail. Need to replace it with something emotionally neutral but morally unambiguous.

  Dependency structure is critical. The whole edifice collapses if sympathy-as-mirroring isn't cemented first. Must sequence: 1) Sympathy as resonance, 2) Sympathy's corrective function, 3) THEN spectator as internalized process. Downstream failures look like "spectator=conscience" or "just imagine others' opinions" if step 2 is skipped.

  For the worked example, choosing "shared dessert" strategically: no pity connotations, clear emotional mirroring (disappointment), and scalable to introduce spectator's correction. Bonus: visceral enough for undergrads but complex enough for moral negotiation.

  Misconception timing is everything. Must preempt "sympathy=pity" during the dessert mirroring demo, kill "spectator=public opinion" when adding the distance layer, and murder "tiny judge" fallacy during the internalization transition. Each has a 30-second intervention window before metastasizing.

  The diagnostic question must force operationalization. "Would the spectator approve?" fails - they'll just parrot approval. "What would change about your reaction?" exposes whether they grasp the standpoint transformation.

  Openly refusing "spectator vs conscience" comparisons is necessary. Also banning utilitarian/deontological framing - this is pure meta-ethics groundwork. Save normative applications for next week.
answer: |-
  Here’s your tactical teaching plan for Smith’s impartial spectator, optimized for 50 minutes and designed to prevent the "sympathy = pity" collapse. Prioritize conceptual dependencies and preemptive strikes against misconceptions.

  ---

  ### **I. Dependency Structure (Non-Negotiable Sequence)**
  1. **Sympathy as Resonance (NOT Pity)**:  
     *Must precede everything*. If students confuse sympathy with pity, the spectator becomes externally focused ("feeling bad for others") rather than a mechanism for *internal calibration*.
     
  2. **Sympathy as Corrective Mirror**:  
     How sympathy *fails* when perspectives diverge → creates need for adjustment. Without this, the spectator seems redundant ("just ask others!").

  3. **Spectator as Internalized Correction Process**:  
     Built *from* sympathy’s failure. Skip Step 2, and the spectator reduces to "imagining others’ opinions" (public opinion fallacy).

  4. **Impartiality via Distance**:  
     Spectator’s "impartiality" emerges from *correcting* biased perspectives, not innate neutrality. Skip prior steps → "tiny neutral judge" fallacy.

  ---

  ### **II. The Worked Example: ABANDON "GRIEVING FRIEND"**  
  **Problem:** Pity connotations + emotional rawness obscures sympathy’s *mirroring* function.  
  **Replacement: Share a Dessert**  
  - **Scenario:** You and a friend split the last slice of cake. Your friend cuts it unevenly, giving you the smaller piece while taking the larger.  
  - **Why it works:**  
    - Emotionally neutral (no pity trigger).  
    - Clear self-interest vs. others’ perspective.  
    - Sympathy failure is obvious (you both see the situation differently).  
    - Scalable to spectator’s correction.

  ---

  ### **III. Teaching Sequence & Misconception Kill-Switches**

  | Time  | Step                                                                 | Example Deployment                                                                                                | Misconception Preemption                                                                                                |
  |-------|----------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|
  | 0-10m | **SYMPATHY = RESONANCE**                                             | "When you see your friend take the larger cake, you *mirror* their satisfaction. That’s sympathy: sharing emotions." | **KILL "SYMPATHY = PITY" NOW:** <br> *"Sympathy isn’t compassion. It’s the *automatic* resonance we feel when we see someone’s joy, anger, or fear—even if we don’t endorse it."* |
  | 10-20m| **SYMPATHY FAILURE → NEED FOR CORRECTION**                           | "You feel resentment (smaller slice). Your friend feels justified (they’re hungry). Your perspectives clash—sympathy *fails*." | **PREVENT "JUST ASK OTHERS":** <br> *"If you poll the room, some will side with you, some with your friend. Public opinion is biased. We need a *standard*."* |
  | 20-35m| **SPECTATOR AS CORRECTIVE TOOL**                                     | "To judge fairly: (1) Imagine your friend’s view *fully*; (2) Ask if a neutral observer *in their shoes* would approve their action." | **CRUSH "SPECTATOR = PUBLIC OPINION":** <br> *"The spectator isn’t what people *do* think. It’s what a *hypothetical* observer *would* think after correcting for bias."* |
  | 35-45m| **IMPARTIALITY VIA PERSPECTIVE-SHIFTING**                            | "The spectator says: 'A truly neutral person, knowing both sides, would say your friend’s greed violates mutual respect.'" | **SABOTAGE "TINY JUDGE":** <br> *"The spectator isn’t a voice in your head. It’s a *process*—you mentally simulate and correct perspectives until they align."* |

  ---

  ### **IV. Diagnostic Question (Final 5 mins)**  
  **Ask:** *"If your friend had *apologized* for taking the larger slice, how would the impartial spectator change your initial resentment? Not whether you’d forgive them—but how your *judgment of the act itself* shifts."*  

  - **Why it works:**  
    - Tests if they grasp the spectator as a *corrector of standpoint* (resentment → objective wrongness).  
    - Wrong answer: "I’d feel better" (focuses on emotion, not judgment calibration).  
    - Right answer: "The spectator focuses on the *breach of fairness*, not my hurt feelings."  

  ---

  ### **V. Openly Refuse to Cover**  
  1. **Spectator vs. Conscience/God/Superego**:  
     "Today, we’re *only* mapping Smith’s machinery. Don’t assimilate it to other frameworks."  
  2. **Full Normative Implications**:  
     "We’re not asking if the spectator is *right*, just *how Smith constructs it*."  
  3. **Sympathy in *Wealth of Nations***:  
     "That’s a different book. Here, ‘sympathy’ is purely from *Moral Sentiments*."  

  ---

  **Execution Tip:** Use the cake example relentlessly. At each stage, ask:  
  - *"Where’s the sympathy here?"* (Step 1)  
  - *"Why does it fail?"* (Step 2)  
  - *"How would the spectator fix it?"* (Step 3)  
  - *"What makes this *impartial*?"* (Step 4)  

  This forces iterative reconstruction of the concept. By hour’s end, "sympathy" will be locked as *mirroring*, and the spectator as *perspective-correction*—not pity or public opinion.
