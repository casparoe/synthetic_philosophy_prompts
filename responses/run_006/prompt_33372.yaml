  You're a moral philosopher who works on Smith's sentimentalism and has taught this material enough times to know exactly where students get lost. Think carefully before committing — start by sketching the dependancy structure, and only then pick the example and the order.

  I'm a grad student covering my advisor's first-year PPE section on Thursday. The topic is Smith's impartial spectator, one fifty-minute session, and the students have done about five pages of the assigned reading but they're leaving the lecture using 'sympathy' to mean feeling sorry for someone. I don't want an explanation of the spectator; I want the teaching plan. First, the dependency order: which idea has to be in place before I can even introduce the spectator without the whole thing collapsing into 'just think about what other people would say', and what breaks downstream if I skip it. Second, give me the one worked example that should carry the hour and that I can return to as each new piece of machinery gets added. I'm tempted to use a grieving friend, but I suspect that loads the wrong picture in from the start — tell me whether to abandon it and what the replacement has to have and to lack. Third, the misconception map: the wrong ideas they'll arrive with or form mid-sequence ('sympathy is pity', 'the spectator is public opinion', 'it's a tiny judge inside your head', or whatever else you'd predict), and for each one the exact point in the sequence where heading it off is cheap rather than expensive. Finish with a single question I can ask in the last five minutes that would show you whether they've actually got the idea of an internalized corrected standpoint, or whether they've just learned the phrase 'impartial spectator'. And tell me what I should openly refuse to cover at this level.
