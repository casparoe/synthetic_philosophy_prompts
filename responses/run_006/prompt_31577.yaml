  The user's suspicion about verbal disagreement seems spot-on regarding "experience" - Malcolm uses it strictly verifiable, Dennett more phenomenologically. But it's also about evidentiary standards: whether memory alone can timestamp mental events. And fundamentally, it's about bedrock intuitions concerning consciousness - is it always "online" or can it be "buffered"?

