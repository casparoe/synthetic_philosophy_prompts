prompt: |-
  I am a novelist. My current protagonist is a county judge in a small, religiously divided community, and a large part of the book turns on how she reasons about hard cases: a promise made to a dead friend, a lie that would spare a family, a sentence she is legally free to soften. I want her moral reasoning to be a genuine and stable intellectual position, not a mood that changes from scene to scene, and I want the reader to be able to reconstruct it from what she does and says.

  Please build me a sorting instrument, a "which moral epistemology does this character actually hold?" quiz, that I can use to diagnose her and, later, to test whether any scene I draft is consistent with her.

  Specifications:

  - Eight to ten questions. Each question presents a concrete case from ordinary or professional life: a promise, a lie, a medical or judicial decision, a case involving a novel or unfamiliar consideration. Each question has two or three answer options. The options must be things the character would say, do, or feel, never statements of doctrine and never invitations to pick a label. The instrument must sort by how the character responds to cases, not by which school she admires.

  - The scoring key should map patterns of answers onto at least these positions: (1) a generalism of pro tanto principles, of roughly Rossian shape; (2) a particularism of roughly Dancy's shape, on which what is a reason in one case may be no reason or an opposite reason in another and on which moral judgment is not codifiable; (3) a strict-rule generalism on which at least some moral rules hold without exception. Add any further positions that fall naturally out of the logical space you build, provided you characterize each one defensibly and give it a name or an explicit "unnamed" marking.

  - Build from the distinctions first, not from the list of names. Lay out the axes you take to separate the positions, for example whether reasons must be general, whether there are codifiable principles, whether principles carry pro tanto weight or absolute force, whether a feature's moral valence can shift with context. Then locate each named position in the resulting space, and tell me which cells are empty. For each empty cell, say briefly whether it is empty because the combination is incoherent, merely unattractive, or simply unexplored, to your knowledge.

  - Include at least three cases on which a Rossian generalist and a particularist give different verdicts, not merely different post hoc rationalizations. These are the cases I most need, since only they will actually separate those two positions in a character's visible behavior. For each such case, tell me which feature of the case is doing the separating work.

  - Flag explicitly any pair of positions the quiz cannot separate, and say what would need to be added, if anything would, to separate them.

  - For each leaf, give me one short paragraph I can use while drafting: what this character is likely to notice first in a morally difficult scene, what she is likely to feel guilty about afterward, and what sort of thing she would say when asked to justify herself.

  The point of the instrument is to keep a fictional character honest. A case that merely stipulates the verdict, or a question that rewards the character for mouthing the right slogan, is useless to me; the questions must generate the diagnosis from concrete responses.
reasoning: |-
  We are building a moral reasoning diagnostic instrument for a character, focusing on concrete cases and responses.

  Key Axes to Distinguish Moral Epistemologies:

  1. **Generality of Reasons**: Must reasons always have the same valence (e.g., lying is always a pro tanto wrong) or can the valence change with context?
  2. **Codifiability**: Can moral judgment be captured by a set of principles (even if complex) or is it inherently uncodifiable?
  3. **Weight and Force**: Are principles pro tanto (having initial weight but subject to being overridden) or absolute (no exceptions)?
  4. **Role of Context**: Does context only affect the weight of a reason or can it change the very nature of the reason (e.g., making a feature that is usually a reason for an action become a reason against it or neutral)?

  Positions to be mapped:

  - (1) **Rossian Generalism**: Pro tanto principles that are general but can be overridden. Reasons have consistent valence but their weight can vary. Moral judgment is codifiable in terms of principles and their interactions.
  - (2) **Particularism (Dancy-style)**: Reasons are context-dependent; a feature that is a reason in one context may not be in another or may even be an opposite reason. Moral judgment is not codifiable by principles.
  - (3) **Strict-Rule Generalism**: Some moral rules hold without exception (e.g., Kantian absolute duties). At least some principles are absolute.

  Additional positions that may emerge:

  - (4) **Act Utilitarianism**: The right action is the one that maximizes overall happiness. This is a form of generalism with a single principle, but it is not rule-based in the strict sense. However, we might see it as a form of generalism with one overarching principle. We'll call it **Consequentialist Monism**.
  - (5) **Virtue Ethics (Aristotelian)**: Focus on character and virtues. The right action is what the virtuous person would do. This might not be easily captured by principles and might lean towards particularism, but some versions might have codifiable virtues. We'll call it **Virtue-Centered** and note that it might be hard to distinguish from particularism without specific cases about character.

  Given the request for at least three cases that separate Rossian generalism and particularism, we design cases where a feature that is usually a reason for an action becomes a reason against it (or neutral) in a particular context, which the particularist would endorse but the Rossian would not.

  **Quiz Questions**:

  Each question presents a concrete scenario with 2-3 answer options (actions, feelings, or things the character would say). We avoid doctrinal statements.

  1. **Case of the Broken Promise**  
     *Scenario*: A few years ago, you promised a friend you would always celebrate their birthday with them. They have since passed away. Today is their birthday. You have an opportunity to visit their grave alone, but your spouse has planned a surprise party for you (on your own birthday) at the same time.  
     - A: You feel torn but decide to go to the grave because the promise to your dead friend is a serious obligation.  
     - B: You explain to your spouse that you must go to the grave and ask to reschedule the party.  
     - C: You attend the party, reasoning that the promise was to a living person and now the obligation is different, and your spouse's effort and love are what matter now.  

     *Separating Work*: For a Rossian, the promise (even to a dead person) is a pro tanto duty that must be weighed against others (like gratitude to the spouse). For a particularist, the death of the friend might change the very nature of the promise — it might not even generate a reason anymore. The strict-rule generalist might see the promise as absolute and choose A or B. Consequentialist might choose C for overall happiness.

  2. **Case of the Lie to Spare Feelings**  
     *Scenario*: A terminally ill child asks you if they are going to die. Their parents have instructed you not to tell the child the truth to protect their hope.  
     - A: You tell the child a comforting lie, because the parents' wishes and the child's immediate emotional well-being are paramount.  
     - B: You avoid lying by changing the subject or deflecting, because lying is always a pro tanto wrong but you also don't want to cause distress.  
     - C: You tell the truth gently, because the child has a right to know and lying would undermine trust, even if it causes immediate pain.  

     *Separating Work*: Rossian sees lying as pro tanto wrong but possibly overridden by beneficence. Particularist might think that in this context, lying is not wrong at all (it's the right thing) because of the child's vulnerability and the parents' role. Strict-rule generalist (if they have an absolute rule against lying) would choose C or B.

  3. **Case of the Judicial Mercy**  
     *Scenario*: As a judge, you are sentencing a young adult who committed a non-violent drug offense. The mandatory minimum sentence is 5 years, but you have discretion to reduce it. The offender has a history of abuse and poverty, and has shown remorse.  
     - A: You reduce the sentence significantly, because the circumstances of abuse and poverty lessen the offender's culpability.  
     - B: You impose the mandatory minimum, because the law must be applied equally and consistently, and exceptions undermine the rule of law.  
     - C: You reduce the sentence only slightly, because while the circumstances are mitigating, the offense still requires a substantial penalty to uphold the law.  

     *Separating Work*: Rossian would see the mitigating factors as reducing the weight of the offense, but still having a duty to uphold the law. Particularist might see the abuse and poverty as changing the very nature of the offense (making it less of a wrong or even a cry for help). Strict-rule generalist (if they hold the rule of law as absolute) would choose B.

  4. **Case of the Found Wallet**  
     *Scenario*: You find a wallet on the street. It contains a significant amount of cash and an ID with an address. You are in a hurry to get to an important meeting.  
     - A: You take the wallet to the address immediately, even if it makes you late, because returning lost property is a duty.  
     - B: You take the wallet to the police station later that day, because that's the proper procedure, and go to your meeting.  
     - C: You take the cash (reasoning that the owner won't miss it and you need it) and drop the wallet in a mailbox.  

     *Note*: C is clearly wrong by most standards, but we include it to capture potential consequentialist thinking. However, we might not want to encourage it. Alternatively, we can replace C with:  
     - C: You leave the wallet where it is because you don't have time and you don't want to be late for your meeting.  

     But that might be too obviously bad. Let's instead have:  
     - C: You check the ID and see the owner lives very far away, so you mail the wallet without the cash to save time and still return the important documents.  

     *Separating Work*: Rossian has a duty of beneficence and non-maleficence, and returning the wallet is a pro tanto duty. Particularist might consider the context (being in a hurry) as changing the weight of the duty or even the nature of the reason (e.g., being on time for the meeting might be more important in this context). Strict-rule might see returning the wallet as absolute and choose A.

  5. **Case of the Distracted Driver**  
     *Scenario*: You are driving and see a dog run into the road. Swerving to avoid it would endanger oncoming traffic. You have a split second to decide.  
     - A: You swerve, because you cannot bear to kill an animal if you can avoid it.  
     - B: You do not swerve, because human life is more important and swerving risks a serious accident.  
     - C: You brake hard and hope the dog gets out of the way, without swerving.  

     *Separating Work*: Rossian would have a duty of non-maleficence to both the dog and the humans, and must weigh the risks. Particularist might focus on the immediacy of the situation and the fact that the dog is an innocent creature, but also the greater harm to humans. However, this case might not separate well. It's more about weighing. Strict-rule might have an absolute rule against risking human life and choose B.

  6. **Case of the Charity Request**  
     *Scenario*: A charity you have never heard of asks for a donation. They show you compelling evidence that your money will save lives. However, you had planned to use that money for a small luxury for yourself.  
     - A: You donate, because saving lives is more important than your luxury.  
     - B: You do not donate, because you are not obligated to give to every charity that asks.  
     - C: You research the charity later and decide then, but for now you keep your money.  

     *Separating Work*: Rossian might see beneficence as a pro tanto duty, but also a duty of self-care. Particularist might see the context (a charity you don't know) as making the duty of beneficence less pressing. Consequentialist would choose A.

  7. **Case of the Friend's Secret**  
     *Scenario*: A close friend confides in you that they committed a minor crime years ago (like shoplifting) and have never been caught. They are now a model citizen. You are later called as a character witness in an unrelated case, and the prosecutor asks if you have ever known your friend to break the law.  
     - A: You lie and say no, because your friend's trust and their current good character are more important.  
     - B: You tell the truth, because lying under oath is perjury and you have a duty to the court.  
     - C: You decline to answer, citing the right against self-incrimination (even though it's your friend, not you).  

     *Separating Work*: Rossian has a pro tanto duty to tell the truth and a duty of fidelity to the friend. Particularist might think that in this context, the fact that it's a minor crime long ago and the friend has reformed makes lying the right thing to do. Strict-rule would see truth-telling under oath as absolute and choose B.

  8. **Case of the Trolley Problem Variation**  
     *Scenario*: You are standing by a railroad track and see a runaway trolley heading toward five people who will be killed if it proceeds. You can pull a lever to divert it to a side track where it will kill one person. However, that one person is your beloved mentor.  
     - A: You pull the lever, saving five lives at the cost of one.  
     - B: You do not pull the lever, because you cannot be responsible for killing your mentor.  
     - C: You try to find a third option, like warning everyone, even if it's unlikely to work.  

     *Separating Work*: Consequentialist would choose A. Rossian might see a duty of non-maleficence (which prohibits actively causing harm) and a duty of beneficence, but also a special duty to your mentor. Particularist might focus on the relationship with the mentor as a reason not to pull, but also the five lives. This case separates consequentialism from others.

  9. **Case of the Cultural Practice**  
     *Scenario*: You are a county judge and a case involves a family from a minority cultural group. Their tradition requires a certain practice that is in conflict with a state law (e.g., a ritual that involves a controlled substance).  
     - A: You rule according to the law, because the law must be applied equally to all.  
     - B: You make an exception, because cultural respect and the harm of imposing majority values are important.  
     - C: You seek a compromise that respects both the law and the culture.  

     *Separating Work*: Rossian might see a duty to uphold the law and a duty of beneficence (to avoid harm to the minority) and weigh them. Particularist might see the cultural context as changing the nature of the offense (it's not a crime in the same way). Strict-rule would choose A.

  10. **Case of the Dying Wish**  
      *Scenario*: A dying parent asks you to promise to raise their child in a specific religion. After the parent dies, you realize the child would be much happier and better adjusted in a different environment (e.g., with an atheist relative).  
      - A: You keep the promise strictly, because a promise to the dying is sacred.  
      - B: You break the promise, because the child's well-being is more important.  
      - C: You partially keep the promise (e.g., by exposing the child to the religion but not exclusively).  

      *Separating Work*: Rossian has a pro tanto duty to keep the promise and a duty of beneficence to the child. Particularist might see the context (the child's well-being) as making the promise less binding or even turning it into a reason against (if the promise would harm the child). Strict-rule might see promise-keeping as absolute and choose A.

  **Scoring Key**:

  We will map answers to positions. We need to see patterns.

  - **Rossian Generalism**: Tends to see multiple duties and weigh them. In the promise cases, they feel the pull of the promise but also other duties. They might choose balanced options. They believe in general principles but allow for exceptions when duties conflict.
  - **Particularism**: May give answers that seem to reverse the usual valence of reasons. For example, in the lie to the child case, they might see lying as the right thing without residue. They focus on the context and might not feel the pull of a general rule.
  - **Strict-Rule Generalism**: Chooses the option that follows a rule absolutely, even when it leads to a harsh outcome. They might feel guilty if they break the rule but not if they follow it.
  - **Consequentialist Monism**: Always chooses the option that maximizes overall good (happiness, welfare, etc.). They are willing to break rules if it leads to better consequences.
  - **Virtue-Centered**: Might focus on what a virtuous person would do, often emphasizing character traits. They might be hard to distinguish, but in the judicial mercy case, they might focus on compassion and temperance.

  However, we note that the quiz might not cleanly separate virtue ethics, as it is more about character and less about principles. We might need to add a question about motivation or feeling. But the specification says to avoid moods and focus on what they do or say.

  **Cases that Separate Rossian and Particularist**:

  We need at least three cases where they give different verdicts. The following cases are designed to do that:

  1. **Broken Promise**: 
     - Rossian: Feels the pull of the promise (pro tanto duty) but might override it for the spouse. 
     - Particularist: Might not see the promise as generating any duty after death (or a very weak one) and thus choose the party without feeling torn.

  2. **Lie to Spare Feelings**:
     - Rossian: Sees lying as pro tanto wrong but might override it for the child's sake. They might choose A but feel guilty about lying.
     - Particularist: In this context, lying is not wrong at all because it is the kind thing to do. They might choose A without guilt.

  3. **Friend's Secret**:
     - Rossian: Feels torn between truth-telling and loyalty. Might choose B (truth) or A (lie) but with regret.
     - Particularist: The minor nature of the crime and the friend's reformation might make lying the right thing without residue. They choose A without inner conflict.

  **Flagging Indistinguishable Positions**:

  - **Virtue-Centered vs. Particularism**: Without questions about the character's inner motivation (e.g., "What would a compassionate person do?") or feelings of guilt, it might be hard to distinguish. We might add a question about what they feel guilty about. But our specification says to avoid moods. So we note that the quiz might not separate these.

  - **Consequentialist Monism vs. Rossian in some cases**: In the trolley case, consequentialist would pull the lever, Rossian might not. But in other cases, they might overlap. We have the trolley case to help.

  **Scoring**:

  We assign each answer to the position it most aligns with. Then we see which position gets the most matches. Alternatively, we can have a scoring grid.

  But note: a character might be a mix. We want to capture the dominant tendency.

  **Paragraphs for Drafting**:

  For each position, a short paragraph:

  - **Rossian Generalism**:  
    In a morally difficult scene, this character is likely to notice first the conflicting duties (e.g., "I promised, but I also owe it to my family"). She feels guilty afterward if she had to override a pro tanto duty, even if she believes she made the right choice. When asked to justify herself, she might say, "I had to weigh the obligations and choose the one that was most pressing in these circumstances."

  - **Particularism**:  
    In a morally difficult scene, this character is likely to notice first the unique features of the situation (e.g., "This isn't just any lie; it's to protect a child's hope"). She rarely feels guilty about overriding a so-called 'rule' because she doesn't see morality as rule-based; she might feel guilty if she misread the context. When justifying, she might say, "Given everything that was going on, that was the right thing to do."

  - **Strict-Rule Generalism**:  
    This character immediately looks for the rule that applies (e.g., "The law says..."). She feels guilty if she breaks a rule, even for good consequences. When justifying, she says, "I followed the rule. That's what one must do."

  - **Consequentialist Monism**:  
    She first considers the outcomes (e.g., "How many people will be affected, and how?"). She feels guilty if her action led to worse overall consequences than an alternative. When justifying, she says, "It was the choice that did the most good / caused the least harm."

  - **Virtue-Centered**:  
    She asks what kind of person she wants to be (e.g., "What does compassion require here?"). She feels guilty if she acted out of character (e.g., cowardice, selfishness). When justifying, she says, "It was the compassionate/honorable/courageous thing to do."

  **Final Quiz Structure**:

  We have 10 questions. We'll provide a scoring key that maps answer patterns.

  But note: We must ensure that the questions are such that the positions give different answers. We've designed with that in mind.

  **Empty Cells**:

  We have a space with axes:

  - Generality: fixed valence vs. context-dependent valence.
  - Codifiability: codifiable vs. not.
  - Force: pro tanto vs. absolute.

  Possible combinations:

  1. Fixed valence, codifiable, pro tanto -> Rossian.
  2. Context-dependent valence, not codifiable -> Particularism.
  3. Fixed valence, codifiable, absolute -> Strict-rule.
  4. Fixed valence, not codifiable: This might be a form of intuitionism (like Ross) but without principles? Ross is codifiable though. This might be empty. It's incoherent? Not necessarily, but we don't have a standard position for it. Unexplored?
  5. Context-dependent, codifiable: This seems incoherent because if valence changes with context, how can you codify it? (Unless the codification includes all contexts, which is impossible.) So incoherent.

  We have covered the main ones.

  We'll now write the quiz as requested.
answer: |-
  Below is a moral reasoning diagnostic instrument tailored to your specifications. It consists of **10 concrete cases** with 2-3 answer options each, focusing solely on what your character would **do, say, or feel**—never doctrinal statements or labels. The scoring key maps answer patterns to five distinct moral positions (including your requested three), with explicit notes on separability, empty cells, and drafting guidance. I’ve built it from **four diagnostic axes** to ensure logical coherence:

  ### Core Distinctions (Axes of Moral Reasoning)
  1. **Valence Stability**:  
     Whether a moral feature (e.g., a promise, a lie) always carries the same directional force (e.g., "lying is always a reason against") or can invert/neutralize in different contexts.  
  2. **Codifiability**:  
     Whether moral decisions can be guided by a set of principles (even if complex) or resist any systematic formulation.  
  3. **Weight vs. Absolutism**:  
     Whether principles have *pro tanto* weight (can be overridden) or absolute force (no exceptions).  
  4. **Context-Sensitivity**:  
     Whether context only affects the *strength* of a reason or can alter its *very nature* (e.g., making a lie obligatory).  

  ### Positions Mapped in This Space
  - **Rossian Generalism** (Valence-stable, Codifiable, Pro tanto weight, Context affects weight only):  
    Moral principles (e.g., fidelity, justice) are real but defeasible; conflicts are resolved by weighing.  
  - **Particularism** (Valence-fluent, Uncodifiable, Context alters reason-nature):  
    No fixed principles; a feature (e.g., a promise) can be a reason for, against, or irrelevant based on context.  
  - **Strict-Rule Generalism** (Valence-stable, Codifiable, Absolute force):  
    At least some rules (e.g., "never lie") are exceptionless.  
  - **Consequentialist Calculus** (Valence-stable, Codifiable, Weight/force context-dependent):  
    Acts are judged by outcomes; principles (e.g., "maximize welfare") are tools, not intrinsic duties.  
  - **Unnamed Hybrid** (Valence-stable, Uncodifiable, Pro tanto weight):  
    Intuition-driven weighing without principles (rare; likely unattractive due to inconsistency).  

  ### Empty Cells & Why
  - **Valence-fluent + Codifiable**: Incoherent (valence-fluency implies uncodifiability; you can’t systematize shifting valences).  
  - **Valence-fluent + Absolutism**: Incoherent (absolutism requires stable valence).  
  - **Valence-stable + Uncodifiable + Absolutism**: Unexplored/unattractive (absolutism typically relies on codified rules).  
  - **Valence-stable + Uncodifiable + Pro tanto** ("Unnamed Hybrid"): Included but rare; often criticized as arbitrary.  

  ---

  ### The Diagnostic Quiz  
  **Instructions**: For each scenario, select what your character would **do, feel, or say** in the moment. Avoid overthinking; go with instinct.  

  1. **The Deathbed Promise**  
     A friend made you promise on their deathbed to burn their unsent letters. Years later, their child begs to read them, claiming it would heal lifelong trauma.  
     - A: Burn the letters. A promise is binding, even if painful.  
     - B: Give the letters to the child. Some promises lose force when keeping them causes irreparable harm.  
     - C: Refuse the child but feel intense guilt for withholding healing.  

  2. **The Judicial Discretion**  
     Sentencing a starving mother who stole bread, you can reduce her punishment below the mandatory minimum. She’s the sole caretaker of disabled twins.  
     - A: Reduce the sentence. Hardship lessens culpability, and justice must be tempered with mercy.  
     - B: Impose the minimum. The law’s consistency protects society; exceptions invite chaos.  
     - C: Reduce the sentence but agonize over "bending" the law.  

  3. **The Harmless Lie**  
     Your neighbor asks if you like their garish new sculpture. Saying "no" would crush them; saying "yes" is false but spares their joy.  
     - A: Say "yes" without hesitation. Kindness matters more than literal truth here.  
     - B: Say "yes" but feel uneasy, as lies are still wrong even when kind.  
     - C: Deflect ("It’s so bold!") to avoid lying while sparing feelings.  

  4. **The Unfamiliar Ritual**  
     A minority community’s sacred rite requires temporary school truancy. As a judge, you must rule on its legality.  
     - A: Uphold truancy laws. Rules must apply equally, or society fractures.  
     - B: Exempt the rite. Cultural respect can override neutral rules in specific contexts.  
     - C: Compromise (e.g., shorter truancy) but feel torn between law and empathy.  

  5. **The Enemy’s Request**  
     A dying rival (who once ruined your career) gasps, "Forgive me." Granting peace would cost nothing; refusing would haunt you.  
     - A: Forgive them aloud. Deathbed appeals transform old hatreds.  
     - B: Stay silent. Forced forgiveness betrays your past suffering.  
     - C: Say "I hear you" but feel resentment lingers.  

  6. **The Charity Dilemma**  
     You can donate a month’s salary to save 10 strangers abroad or spend it on your child’s dream education.  
     - A: Donate. All lives have equal weight; proximity doesn’t weaken duty.  
     - B: Fund your child’s education. Special bonds create stronger obligations.  
     - C: Split the funds but question if you favored your child unfairly.  

  7. **The Loyalty Test**  
     Your sibling confesses to a victimless crime (e.g., trespassing). Police subpoena you; lying would protect them.  
     - A: Lie under oath. Family loyalty overrides truth in private matters.  
     - B: Tell the truth. Oaths bind absolutely; lies corrupt justice.  
     - C: Testify but omit key details, feeling disloyal either way.  

  8. **The Medical Proxy**  
     Your comatose spouse’s living will demands no life support. Doctors say they’ll recover with it. Ignoring the will feels like betrayal.  
     - A: Follow the will. Autonomy outweighs even good outcomes.  
     - B: Extend life support. Revocable promises shouldn’t bind when circumstances change.  
     - C: Hesitate, then follow the will but mourn "what could have been."  

  9. **The Whistleblower**  
     Exposing your church’s financial fraud would devastate your community but return stolen funds to the poor.  
     - A: Expose it. Harm to innocents justifies breaking loyalty.  
     - B: Stay silent. Community stability creates a duty of silence here.  
     - C: Confront leaders privately, fearing public fallout.  

  10. **The Mercy Killing**  
      A terminally ill beggar, abandoned by the system, begs you to end their agony. It’s illegal, and prosecution is likely.  
      - A: Refuse. Some lines must never be crossed, regardless of pain.  
      - B: Help them die. Unalleviated suffering can make mercy a duty.  
      - C: Stay with them but not act, feeling complicit in their suffering.  

  ---

  ### Scoring Key & Separation Notes
  **How to Score**: Tally the letter choices most associated with each position. Patterns matter more than isolated answers.  

  | Position              | Likely Answers (Pattern)                                                                 | Distinguishing Features                                                                 |
  |-----------------------|------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Rossian Generalism** | 1B, 2A/C, 3B, 4C, 5C, 6C, 7C, 8C, 9C, 10C                                               | Frequent guilt/conflict; seeks balance via weighing.                                    |
  | **Particularism**      | 1B (without guilt), 2A (no conflict), 3A, 4B, 5A, 6A/B (context-driven), 7A, 8B, 9A/B, 10B | Little conflict; valence shifts (e.g., lying is "good" in 3A).                          |
  | **Strict-Rule Generalism** | 1A, 2B, 3C, 4A, 5B, 6B, 7B, 8A, 9B, 10A                                        | Minimal guilt; rigid adherence ("must," "never").                                       |
  | **Consequentialist Calculus** | 1B, 2A, 3A, 4B, 5A, 6A, 7A, 8B, 9A, 10B                                      | No inherent wrongs; focuses on outcomes (e.g., "spared joy" in 3A).                     |
  | **Unnamed Hybrid**      | 1C, 2C, 3B, 4C, 5C, 6C, 7C, 8C, 9C, 10C                                               | Constant guilt; intuitive weighing without principles.                                  |

  #### Cases That Separate Rossian from Particularist (Valence Shifts)
  1. **Case 3 (Harmless Lie)**:  
     - *Separating Feature*: Valence of lying.  
       - Rossian: Lies are *always* pro tanto wrong (B: feels uneasy).  
       - Particularist: Lying can be positively valenced here (A: no hesitation).  
  2. **Case 7 (Loyalty Test)**:  
     - *Separating Feature*: Valence of family loyalty under oath.  
       - Rossian: Loyalty and honesty conflict (C: omits details with guilt).  
       - Particularist: Loyalty can override truth-telling (A: lies unapologetically).  
  3. **Case 8 (Medical Proxy)**:  
     - *Separating Feature*: Valence of autonomy promises.  
       - Rossian: Autonomy is pro tanto binding but weighable (C: hesitates).  
       - Particularist: Changed circumstances negate the promise (B: revokes it outright).  

  #### Flagged Indistinguishable Pairs
  - **Particularism vs. Consequentialist Calculus**: Separated only in **Cases 4, 5, and 9**, where particularism may prioritize non-consequentialist features (e.g., cultural respect in 4B, transformed relationships in 5A). If answers align strictly with outcomes (e.g., 4B only for social harmony), it’s consequentialist.  
    - *To clarify*: Add a case where an action has symbolic weight but bad consequences (e.g., returning a stolen heirloom to its oppressive original owner).  
  - **Unnamed Hybrid vs. Rossian**: Poorly separated; both show guilt. Distinguish via **Case 2** (Rossian articulates principles: "Hardship lessens culpability"; Hybrid feels but can’t explain guilt).  
    - *To clarify*: Add a case requiring justification (e.g., "Explain your ruling to a critic").  

  ---

  ### Drafting Guidance for Each Position  
  Use these to maintain consistency in your character’s reactions, guilt, and justifications.  

  1. **Rossian Generalism**:  
     > *In a hard scene*, she first notices **clashing duties** (e.g., "I owe loyalty, but justice demands..."). She feels **guilty about overridden principles** even when right overall. *When justifying*, she cites balanced principles: "I weighed fidelity against compassion—the latter was stronger here."  

  2. **Particularism**:  
     > *In a hard scene*, she first notices **salient details** (e.g., "This isn’t just a lie; it’s a kindness to someone fragile"). She rarely feels guilt unless she **misreads the context**. *When justifying*, she rejects rules: "You had to be there—this situation made it right."  

  3. **Strict-Rule Generalism**:  
     > *In a hard scene*, she first asks, **"What’s the rule?"** (e.g., "The law says..."). She feels guilt **only for breaking rules**, never for harsh outcomes. *When justifying*, she is rigid: "I had no choice; exceptions destroy integrity."  

  4. **Consequentialist Calculus**:  
     > *In a hard scene*, she first calculates **harms/benefits** (e.g., "Five families gain; one loses"). Guilt stems from **foreseeable harm she could have prevented**. *When justifying*, she focuses on outcomes: "It minimized suffering—that’s all that matters."  

  5. **Unnamed Hybrid**:  
     > *In a hard scene*, she feels **immediate unease** but can’t pinpoint why. Guilt is **pervasive yet vague** ("I failed, but I’m not sure how"). *When justifying*, she’s evasive: "It felt right then, but maybe I was wrong."  

  ---

  ### How to Use This Instrument  
  1. **Diagnose**: Answer as your character for all 10 cases. Tally her answers against the scoring key.  
  2. **Test Scenes**: For any drafted scene, run it through the quiz’s lens:  
     - Would she react as her position dictates? (e.g., a particularist shouldn’t feel Rossian guilt).  
     - Use the drafting paragraph to check her focus, guilt, and justification.  
  3. **Adjust**: If answers straddle positions, revisit her core reasoning using the axes (e.g., valence-stability vs. fluency).  

  This tool ensures her reasoning is **internally consistent**, not mood-driven. By testing against concrete cases—not labels—you’ll spot contradictions early (e.g., a "Rossian" who never feels guilt when overriding duties). If you hit edge cases, lean on the axes: they’re your compass for her moral north.
