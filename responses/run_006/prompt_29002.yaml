prompt: |-
  I keep running into the same disagreement in interpretability work, and I can't tell whether it has an established name. One side talks as if a model has learned a concept when a direction in activation space can be read off with a linear probe and steering that direction changes the model's outputs in the expected way — I've seen this argued for board-state directions in game-playing models and for sentiment or truthfulness directions in language models. The other side says this shows only that the model's internal state is predictable and manipulable, not that the model itself has the representation: the concept is ours, projected onto the network. The two sides seem to use 'representation' for different things, and I can't articulate exactly where they come apart. Is there a settled name for this fault line, or for each of the two positions? More importantly, how should the phenomenon be carved: what would have to be true for a decodable, steerable structure to count as something the network genuinely represents, as opposed to something an interpreter can exploit? I want the boundary cases, not just a label — features that are decodable but causally inert, features that are causally effective but not human-interpretable, features that appear only under certain inputs or at certain stages of training. Which of those are hard cases for each side, and which nearby positions are easy to conflate with either?
reasoning: |-
  Okay, the user is dealing with a recurring disagreement in interpretability work. They're trying to understand the distinction between two perspectives on whether a model truly "represents" a concept when linear probes and steering work. One side sees it as genuine representation, while the other views it as projection by the interpreter. They want to know if there's a name for this debate and, more importantly, how to delineate when such features count as genuine representations versus exploitable artifacts.

  First, I need to recall the key terms from interpretability literature. The positions here align with functionalism versus interpretivism or instrumentalism. Functionalism argues that if a feature plays a causal role in the model's computations, it's a representation. The other side sees probes as tools for interpretation without implying the model internally uses that structure.

  The user's deeper need seems to be a practical framework to evaluate these cases. They mention boundary cases like causally inert but decodable features, or effective but not interpretable ones. These are crucial for testing each position. For instance, causally inert features challenge functionalism since they don't impact outputs. Features that are effective but not interpretable might support interpretivism, as the model uses them but they aren't human-aligned.

  I should outline the necessary conditions for genuine representation. Causal integration is key—does the feature affect downstream layers? Robustness across contexts and training stages matters too. If a direction only appears late in training, it might be an emergent representation. Counterfactual invariance is another factor: does steering produce consistent changes?

  The user might also be conflating correlation with causation. Probes can find correlations without causation, like detecting board states from artifacts. Highlighting experiments like ablation or path patching could help distinguish this. They need concrete tests to apply in their work.

  They might not realize that both positions can coexist depending on the context. Some features are genuinely represented, others are artifacts. Providing boundary cases helps them navigate this spectrum. Also, clarifying terms like "representation" versus "latent variable" could reduce ambiguity in their discussions.

  In summary, the user needs a structured approach with examples and tests to apply in their interpretability research, moving beyond labels to practical evaluation. Addressing the boundary cases they mentioned will strengthen their argument and clarify the debate for their peers.
answer: |-
  This is a **foundational and unresolved debate** in interpretability, touching on core questions of what "representation" means in deep learning. While no single settled term exists, here's how to understand the fault line, the positions, and how to carve the phenomenon:

  ## Core Positions & Terminology

  1.  **The Functionalist/Internalist/Mechanistic View (Pro-"Representation"):**
      *   **Core Claim:** If a linear direction reliably correlates with a concept *and* steering it causes predictable, consistent changes in the model's outputs/behavior relevant to that concept *in a way that integrates with the model's computation*, then that direction **is** (or strongly indicates) a representation of the concept *used by the model itself*.
      *   **Key Metaphor:** The network is a computational engine; these directions are levers or variables within its machinery.
      *   **Terms Used:** "Learned representation," "internal representation," "causal feature," "concept direction," "mechanistic interpretability."
      *   **What "Representation" Means:** A state or structure internal to the model that (a) causally mediates between inputs and outputs, and (b) carries semantic content relevant to the task.

  2.  **The Interpretivist/Instrumentalist/Projectivist View (Anti-"Representation"):**
      *   **Core Claim:** Linear probes and steering demonstrate a *correlation* or a *latent variable* that *we* can exploit and interpret, but they do not necessarily reveal how the model *internally uses* information to perform computations. The "concept" is imposed by the interpreter; the model might achieve its function using different, less human-aligned structures.
      *   **Key Metaphor:** The network is a black box; probes are sensors we stick on it, steering is hacking an input signal, but neither tells us *how* the box works internally. We are projecting our semantics onto its states.
      *   **Terms Used:** "Interpretable artifact," "decodable correlate," "latent variable," "probe-induced feature," "superficial pattern," "instrumental use."
      *   **What "Representation" Means (Stricter Sense):** Requires the structure to play an explicit, identifiable role within the model's *algorithmic* computations, not just be correlated with inputs/outputs or manipulable externally.

  ## The Crux: What Makes it "Genuine" Representation?

  For the Functionalist, a decodable/steerable structure counts as a "genuine" representation used by the network **if and only if it is causally integrated into the model's computational pathway.**

  ### Key Criteria for "Genuine" Representation (Functionalist View)

  1.  **Causal Efficacy:** Perturbing the direction (e.g., via activation addition/editing) *directly* and *robustly* alters the model's subsequent computations and final outputs in ways semantically consistent with the concept, **without** simply overriding downstream layers. It shouldn't just be injecting an external signal; it should be modulating an *internal* variable the model relies on.
  2.  **Computational Integration:** The direction should demonstrably be *used* by later layers in their calculations. Evidence includes:
      *   **Ablation:** Removing or scrambling this specific direction significantly degrades performance on tasks involving the concept, but not necessarily unrelated tasks.
      *   **Path Patching:** Showing that information from earlier layers relevant to the concept flows *through* this specific direction to influence later layers/critical outputs.
      *   **Downstream Linearity:** Demonstrating that later layers use this direction linearly in their own computations.
  3.  **Robustness & Invariance:**
      *   **Context Robustness:** The direction's meaning and effect hold across diverse inputs and contexts where the concept is relevant (not just cherry-picked examples).
      *   **Counterfactual Invariance:** Steering the direction produces changes that make sense counterfactually (e.g., making a positive sentiment text more negative *in a coherent way*, not just garbling output).
      *   **Training Robustness:** The direction emerges reliably during training and stabilizes, rather than being a transient artifact of a specific checkpoint or random seed.
  4.  **Specificity:** The effect of steering is specific to the intended concept and its logical consequences, not causing broad, unpredictable changes or degrading overall capability indiscriminately.

  ### Boundary Cases & Hard Problems

  These cases expose the tension between the positions:

  1.  **Decodable but Causally Inert (Hard for Functionalists, Easy for Interpretivists):**
      *   **Phenomenon:** A linear probe achieves high accuracy on a concept, but ablating or perturbing that specific direction has *no measurable impact* on model outputs or performance. The information is present *as a correlate* but not used in computation.
      *   **Interpretivist Take:** Proof the "representation" is an epiphenomenal artifact. The model computes the output using different pathways; the probe found a side-effect.
      *   **Functionalist Challenge:** Does *any* intervention work? Is the probe direction *truly* the most aligned? Maybe it's redundant or the model has multiple pathways (resilience). Requires careful ablation studies.

  2.  **Causally Effective but Not Human-Interpretable (Hard for Interpretivists, Ambiguous for Functionalists):**
      *   **Phenomenon:** A direction has a strong, specific causal effect on outputs (e.g., always increases verbosity, always flips output class A to B), but no human can assign a clear, consistent *semantic concept* to it. Probes or human inspection yield low accuracy or conflicting interpretations.
      *   **Functionalist Take:** This *is* a genuine internal representation/variable used by the model, even if we don't understand its "meaning." Its causal role defines it. "Interpretability" != "Human-Aligned Semantics."
      *   **Interpretivist Take:** This demonstrates the core point: the model's internal states are computational tools, not bearers of human-like concepts. Effectiveness != representation *of a concept we recognize*. It's a mechanism, not a symbol.

  3.  **Context-Dependent or Sparse Activation (Hard for Both):**
      *   **Phenomenon:** A direction is strongly decodable and causally effective *only* for specific subsets of inputs (e.g., only when discussing politics, only in layer 15, only for certain syntactic structures) and silent otherwise.
      *   **Functionalist Challenge:** Does it represent the concept generally, or a highly contextualized sub-feature? Is it a core representation or a specialized circuit component? Requires mapping its scope.
      *   **Interpretivist Challenge:** Does its sporadic use mean it's less "real," or just part of a complex, distributed system? Its effectiveness *in context* might still indicate a functional role.

  4.  **Emergent Late in Training (Hard for Interpretivists, Supportive for Functionalists):**
      *   **Phenomenon:** A clear, robust, causally effective concept direction *only emerges* late in training after the model has mastered related tasks.
      *   **Functionalist Take:** This is evidence the model *developed* a more abstract, efficient representation as it refined its capabilities. It's a learned computational primitive.
      *   **Interpretivist Skepticism:** Does late emergence imply it's a byproduct of optimization pressure rather than a fundamental building block? Is it truly necessary or just an efficient encoding found late?

  5.  **"Superposition" / Polysemantic Neurons (Hard for Simple Probes):**
      *   **Phenomenon:** A single direction/neuron encodes multiple unrelated concepts (as revealed by non-linear probes or context). Linear probes might average these or pick a dominant one.
      *   **Functionalist Take:** The representation might be genuinely multiplexed. Steering might affect *all* concepts in superposition non-specifically. Requires more sophisticated techniques (e.g., sparse probing, contextual steering) to isolate concepts.
      *   **Interpretivist Take:** Highlights the limitations of linear probes. The "direction" found is a crude approximation of the underlying complex, non-human-aligned encoding.

  ### Conflated Positions & Nuances

  *   **Conflation 1:** "Decodable = Causal." The biggest mistake. High probe accuracy is necessary but *far* from sufficient evidence for causal efficacy/internal representation.
  *   **Conflation 2:** "Steering Works = Representation." Steering could be acting like an external override signal (e.g., adding "positive sentiment noise") rather than modulating an internal variable. Path patching/ablation is needed to distinguish.
  *   **Conflation 3:** "Representation = Symbolic." Functionalists don't necessarily claim neural representations are like symbols in a classical AI system; they can be distributed, continuous, and subsymbolic, but still causally functional.
  *   **Nuance:** Interpretivists often don't deny the *existence* of internal states; they deny that probe-found directions *reliably correspond* to the *human-intended concepts* used in the model's *core algorithms*.
  *   **Nuance:** Functionalists acknowledge the "Clever Hans" problem (spurious correlations). Their criteria (causal efficacy, integration) are attempts to rule this out.

  ## Conclusion & Moving Forward

  The debate centers on **causal integration versus correlational exploitability**. There is no settled resolution because deep learning models are complex, opaque dynamical systems.

  *   To argue for genuine representation, focus on **causal experiments**: ablation, path patching, counterfactual steering effects across contexts, and demonstrating integration into the computational flow. Show necessity and sufficiency.
  *   To argue against, focus on **explanatory gaps**: show the probe/steering works *despite* the model using different pathways (e.g., via circuit analysis), demonstrate spurious correlations, highlight non-robustness, or emphasize the lack of a clear algorithmic role matching the human concept.

  The boundary between "exploitable structure" and "genuine representation" is defined by **whether the structure is a causally active component within the model's own computational machinery for performing its task, rather than merely a predictable side-effect or a latent variable we can manipulate externally.** The hard cases test the robustness, specificity, and necessity of this causal role.
