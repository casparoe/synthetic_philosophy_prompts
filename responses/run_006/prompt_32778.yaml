prompt: |-
  Right, so I just had this massive argument with a friend about information cascades — you know, when it's rational to follow the crowd even if your own private information points the other way. He's fully on team "the crowd is always right if the crowd is large enough," and I kept finding myself saying "yeah but not in *that* case." By the end of it I realised my intuitions are all over the place and I genuinly don't know what principle I'm operating with. I'd like you to work it out for me.

  Here are my gut verdicts on a bunch of cases. I'm not saying they're all correct — some of them might be wrong, and I'm fine with you telling me which ones have to go. I just want to know what principle (if any) captures the pattern, and what it says about the case I'm stuck on.

  Case A: I'm walking down a street in a city I don't know, looking for dinner. Two restaurants side by side. One has a queue of fifteen people waiting for a table. The other is completely empty. I've read exactly one review of the empty one, from a critic I trust, saying it's the best meal they've had all year. I join the queue. That feels right to me.

  Case B: I'm at work, and there's a meeting about which supplier to go with. Twelve people have spoken, and all twelve say Acme Corp is the clear choice. I've done a detailed cost analysis beforehand that shows Beta Ltd is about 30% cheaper for the same quality. I speak up and argue for Beta. That also feels right.

  Case C: I'm walking through a park and I see about thirty people all looking up at the sky, pointing. I look up, and I genuinely can't see anything unusual — no plane, no bird, no weird cloud. I keep looking for a good twenty seconds, and so does everyone else. I don't think I'm being irrational here. I'd do the same thing every time.

  Case D: I'm scrolling through an online marketplace and I see a product with over a thousand five-star reviews. My brother bought the same product last month and told me it's a piece of junk that fell apart in a week. I buy it anyway. I figure my brother probly got a dud. This feels basically fine.

  Case E: It's 2007, and every single person I know in finance is telling me the housing market is solid and I should invest. I've read a few analyses saying mortgage-backed securities are dangerously overleveraged. The analyses are technical and I only half understand them, but they're written by people who seem to know what they're talking about. I stay out of the market. That feels right, and in retrospect I'm smug about it.

  Case F: I'm at a conference and a speaker makes a claim that everyone in the room seems to accept as obviously true. I'm pretty sure it's false — it contradicts something I read in a paper a while back. But I'm not 100% sure, and the room is full of people who work on this exact topic. I stay quiet. This one I feel conflicted about. Half of me thinks I was being sensible; the other half thinks I chickened out.

  Case G: The one I can't settle. I'm hiking with a group and we come to a fork. The map says go left. Everyone else in the group — six people — says the map is outdated and we should go right. I've used this map before, two years ago, and it was accurate then. It's a popular trail and the map was published by the park service last year. What should I do?

  Please work out what principle or small set of principles captures these verdicts as well as possible. State the principle precisely, and tell me which of my verdicts it has to overturn — if any. Then apply it to Case G. I want the answer as exactly five numbered points, each one or two sentences, with no introduction or conclusion. Think of yourself as a professional epistemologist who specialises in social epistemology and rational choice. Think carefully, and if you need to, start by brainstorming what features might matter across these cases. Please write in British English.
reasoning: |-
  Hmm, the user is presenting a fascinating puzzle about information cascades and social epistemology. They've described seven scenarios where their intuitive judgments about whether to follow the crowd conflict with their friend's view that large crowds are always right. The user admits their intuitions feel inconsistent and wants me to extract the underlying principle.

  Looking at these cases, several factors seem to be at play:
  - In Case A (restaurants), they follow the crowd despite contradictory private information because their single review seems outweighed by fifteen people's implied judgments.
  - In Case B (supplier meeting), they trust their own detailed analysis over twelve unanimous colleagues.
  - Case C (park sky-gazers) shows them joining the crowd when they have no contradictory private information.
  - Case D (product reviews) has them discounting a trusted brother's firsthand experience in favor of mass reviews.
  - Case E (2007 finance) involves trusting niche expert analyses over industry consensus.
  - Case F (conference) creates conflict when their private knowledge challenges domain experts.
  - Case G (hiking fork) is the unresolved case with conflicting cues about map reliability versus group consensus.

  The key differentiators appear to be:
  1) Quality of private information (detailed analysis vs vague recollection)
  2) Credibility of dissent sources (domain experts vs personal contacts)
  3) Plausibility of crowd being misled (restaurant queues vs financial bubbles)
  4) Stakes involved (business decisions vs casual observations)

  For Case G, the map's recency and official source might outweigh the group's claim about its obsolescence, especially if the user has recent positive experience with it. The group's "outdated" claim requires scrutiny - do they have evidence?

  The principles should probably prioritize:
  - Expertise-weighted evidence over raw numbers
  - Direct experience over hearsay
  - Consideration of incentive structures (e.g. in finance vs hiking)
  - Distinction between ambiguous situations (sky-gazing) and verifiable claims

  The user's willingness to discard their brother's experience in Case D while trusting their own analysis in Case B suggests they intuitively weight methodological rigor highly. Their conflict in Case F indicates awareness of expertise hierarchies. For Case G, the map's institutional authority and their personal verification history might reasonably override six people's unsupported claims.
answer: |-
  Here are five numbered points capturing your epistemic principle, based on analysis of your verdicts and features like information quality, source credibility, and stakes:

  1.  **Prioritise private information when it is high-quality, specific, and directly relevant to the decision**, especially if contrary public information lacks clear expertise or verifiable basis (e.g., Case B: your detailed cost analysis trumps group consensus; Case E: niche expert analyses trump widespread industry optimism).
  2.  **Discard private information when it is low-quality, ambiguous, or easily explained away by alternative hypotheses**, particularly against a large, seemingly informed crowd without obvious misalignment (e.g., Case A: one trusted review is outweighed by visible crowd preference; Case D: a single anecdote is discounted against overwhelming positive reviews).
  3.  **Defer to the crowd when private information is absent or entirely neutral**, as observing others' actions provides new information worth investigating (e.g., Case C: looking up when others do, despite seeing nothing initially).
  4.  **Resist deference when the crowd's epistemic position is suspect**, such as potential groupthink, misaligned incentives, or lack of access to your private evidence (e.g., Case E: finance crowd's optimism vs. critical analyses; Case F conflict arises partly from uncertainty about the room's critical thinking).
  5.  **Apply Principle 1 to Case G:** Trust the map (your high-quality, recent, authoritative, and previously verified information) over the group's unsupported claim of obsolescence; their number doesn't outweigh the map's credibility without specific evidence of changes. *This overturns your conflicted feeling in Case F if you felt you should have spoken, as Principle 1 would support speaking if your paper evidence was strong, but your verdict described uncertainty.*
