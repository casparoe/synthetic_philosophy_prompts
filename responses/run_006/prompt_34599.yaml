prompt: |-
  I'm a PhD student in philosophy of cognitive science and I've been wrestling with Dennett's tower of generate-and-test from *Darwin's Dangerous Idea* and *Kinds of Minds*. The Darwinian → Skinnerian → Popperian → Gregorian progression is supposed to track how the selectional mechanism gets internalized at each step. But here's the thing I keep tripping over: what's the actual difference between a Popperian creature and a Gregorian one, *in terms of the selectional architecture*?

  A Popperian creature has an inner environment where hypotheses can die instead of the creature. A Gregorian creature imports mind-tools — language especially — from the cultural environment. But if a Popperian creature is already running internal simulations and discarding bad ones, what does language add that isn't already there? Is it that Popperian simulations are somehow sub-propositional — like imagistic or motoric — and language gives you structured, composable thoughts? Or is the point that Gregorian creatures can offload the selection itself onto public representations (arguing, writing, checking each other's work) rather than doing it all in their heads?

  Basically I'm trying to figure out whether "Gregorian" is a genuinely new kind of selectional architecture or just "Popperian plus a bigger toolbox." If the latter, why is it a seperate rung on the tower and not just Popperian creatures with better inputs?

  Give me your clearest take, and keep it under 400 words — I'm not looking for a summary of the book, I want the conceptual diagnosis.
