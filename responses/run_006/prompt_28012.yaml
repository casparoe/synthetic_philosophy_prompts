  First, I need to recall the core of the Frege-Gach problem. Expressivism says moral statements express non-cognitive attitudes, but when embedded in complex sentences like conditionals, they seem to contribute to truth conditions. The challenge is explaining how the same content works in both asserted and embedded contexts without changing meaning.

  The user wants every embedding type, logical properties to preserve, and consistency of attitudes. They also want motivating cases for each requirement and to know which one is the biggest killer. Plus, any potential conflicts between requirements.

  Starting with embeddings: conditionals are classic. Geach's example with modus ponens is key. If "lying is wrong" in the antecedent doesn't express an attitude, how does the conditional work? Same for negation. "Lying is not wrong" – if the negated sentence expresses disapproval, negation should cancel that, but what attitude does that correspond to?

  Attitude reports are tricky. "Bob believes lying is wrong" – expressivism must explain what Bob's belief state is without invoking propositions. Quantifiers too, like "All lies are wrong," which requires generalizing attitudes beyond specific instances.

  Logical properties: modus ponens must hold. Consistency matters for moral dilemmas – if someone says both "lying is wrong" and "lying is not wrong," that's inconsistent. But expressivism needs to explain inconsistency without truth. Also, logical validity, like the inference from A to ~~A, should hold even with moral predicates.

  The attitude assigned to the moral predicate must remain constant whether asserted or embedded. So "wrong" in "Lying is wrong" vs. "If lying is wrong..." should involve the same attitude type. Otherwise, it's an ad hoc solution.

  Now, which requirement kills the most proposals? Probably conditionals. Many solutions handle simple cases but fail when embedded in conditionals or negation. Attitude reports and quantifiers are also tough. The combination of compositionality and consistency is a major graveyard.

  Conflict points: Compositionality vs. Expressivist Attitude Assignment. Combining moral and descriptive content without losing the expressivist stance. Also, Logical Properties without Truth-Conditions – explaining validity without truth is hard. Quantifiers and Attitude Reports add complexity that can break systems.

  The user might be looking for where to focus their reading. Highlighting the graveyard areas (conditionals, attitude reports) and the conflicts (compositionality vs attitude consistency) would help them evaluate proposals more critically. They might also want reassurance that a solution is possible, or if not, where the boundaries lie.
answer: |-
  Here's the full specification for solving the Frege-Geach problem, detailing the non-negotiable requirements, their motivating cases, logical properties, and the treacherous terrain where proposals often fail.

  **Core Problem Recap:** Expressivism claims moral sentences (e.g., "Lying is wrong") primarily express **non-cognitive attitudes** (e.g., disapproval of lying) rather than reporting beliefs about objective moral facts. Frege-Geach points out that these sentences function identically to descriptive sentences when **embedded** in complex constructions (conditionals, negations, etc.) and participate in **logical inferences** (modus ponens, etc.). A solution must explain *how the same meaning* (contributing to truth-conditions and logic) can be maintained in embedded contexts *while preserving the expressivist core* (attitude expression in assertion).

  **The Non-Negotiable Desiderata:**

  1.  **Compositionality of Meaning:**
      *   **What:** The meaning of a complex sentence must be systematically determined by the meanings of its parts *and* the way they are combined (the syntactic structure).
      *   **Motivating Case:** "If lying is wrong, then getting your little brother to lie is wrong." Here, "lying is wrong" appears unasserted in the antecedent. Its contribution to the *truth-conditions* of the whole conditional cannot be the *expression of actual disapproval* (since it's not being asserted). The meaning "lying is wrong" contributes must be stable and combine predictably with "if...then..." to form the meaning of the conditional.
      *   **Why Not Negotiable:** Without compositionality, we have no systematic account of how language works. Any semantic theory, expressivist or not, must account for how complex meanings are built.

  2.  **Logical Embeddings - Conditionals:**
      *   **What:** Must provide a plausible account of the meaning and truth-conditions of moral conditionals.
      *   **Motivating Case (Geach's Original):**
          *   P1. If lying is wrong, then getting your little brother to lie is wrong. (Seemingly true)
          *   P2. Lying is wrong. (Asserted)
          *   C. Therefore, getting your little brother to lie is wrong. (Valid inference via Modus Ponens)
          The expressivist must explain what attitude is expressed by asserting the *conditional* P1, and crucially, how the *same "lying is wrong"* in P1 and P2 can play the role required for the inference to be valid.
      *   **Why Not Negotiable:** Conditionals are fundamental to reasoning and logic. Failing here means failing the core challenge.

  3.  **Logical Embeddings - Negation:**
      *   **What:** Must provide a plausible account of the meaning and truth-conditions of negated moral sentences.
      *   **Motivating Case:**
          *   "Lying is not wrong." This cannot simply be the *absence* of disapproval of lying (one might not disapprove of lying but not *approve* of it either). It seems to express a positive attitude (e.g., tolerance, permission, or rejection of disapproval). Further, it must embed: "Is it the case that lying is not wrong?" and participate in inferences: "Lying is wrong" and "Lying is not wrong" are inconsistent.
      *   **Why Not Negotiable:** Negation is a fundamental logical operator. Inconsistency relies on negation.

  4.  **Logical Embeddings - Attitude Reports:**
      *   **What:** Must provide a plausible account of the meaning of sentences reporting beliefs, desires, doubts, etc., about moral propositions.
      *   **Motivating Case:** "Bob believes that lying is wrong." This reports a cognitive state *about* the moral claim. The expressivist cannot say Bob is *actually disapproving of lying right now* (he might be asleep). They need to characterize the *content* of Bob's belief in expressivist terms. What state of mind does "believes that lying is wrong" report?
      *   **Why Not Negotiable:** We constantly attribute moral beliefs to others. A semantic theory must account for this.

  5.  **Logical Embeddings - Quantifiers (Universal & Existential):**
      *   **What:** Must provide a plausible account of quantified moral sentences.
      *   **Motivating Cases:**
          *   Universal: "All lies are wrong." Cannot be explained as disapproval of every *specific* lie (there might be infinitely many, or unknown lies). Requires a general attitude.
          *   Existential: "Some lies are not wrong." Expresses something more complex than disapproval of a specific lie.
          *   Embedded: "If any lie is wrong, then lying to save a life is wrong." Quantifiers must compose with other operators.
      *   **Why Not Negotiable:** Quantified moral claims are common and crucial for moral principles and reasoning.

  6.  **Preservation of Logic - Modus Ponens:**
      *   **What:** The standard inference pattern `If P then Q; P; Therefore Q` must be valid for moral `P` and `Q`.
      *   **Motivating Case:** The Geach example above (P1, P2, C). If modus ponens fails for moral arguments, expressivism invalidates the most basic form of moral reasoning.
      *   **Why Not Negotiable:** Modus ponens is fundamental to all rational discourse, including moral debate. Rejecting it is catastrophic.

  7.  **Preservation of Logic - Consistency:**
      *   **What:** Sentences `P` and `Not-P` must be inconsistent. Asserting both must be irrational or express incompatible attitudes.
      *   **Motivating Case:** "Lying is wrong" and "Lying is not wrong." Intuitively, one cannot rationally assert both. The expressivist must explain the nature of this inconsistency without appealing to truth-conditional contradiction. What makes the *attitudes* expressed incompatible?
      *   **Why Not Negotiable:** Logic and rational discourse rely on the concept of inconsistency. Moral dilemmas involve conflicting *oughts*, not flat contradictions.

  8.  **Preservation of Logic - General Logical Validity:**
      *   **What:** Logically valid forms involving moral vocabulary must remain valid. E.g., `P; Therefore P`, `P; Therefore Not(Not-P)`, `If P then Q; Not-Q; Therefore Not-P` (Modus Tollens), `P or Q; Not-P; Therefore Q` (Disjunctive Syllogism), `All F are G; a is F; Therefore a is G`.
      *   **Motivating Cases:**
          *   Double Negation: "Lying is wrong. Therefore, it's not the case that lying is not wrong." Should be valid.
          *   Modus Tollens: "If lying is wrong then telling the truth is obligatory. Telling the truth is not obligatory. Therefore, lying is not wrong." Should be valid.
          *   Disjunctive Syllogism: "Either stealing is wrong or charity is pointless. Stealing is not wrong. Therefore, charity is not pointless." (Moral + Descriptive mix).
      *   **Why Not Negotiable:** Morality isn't logically isolated. We use standard logic constantly in moral reasoning mixed with descriptive claims. A solution cannot make valid inferences involving morals suddenly invalid.

  9.  **Attitude Uniformity:**
      *   **What:** The core non-cognitive attitude type expressed by a simple moral predicate (e.g., disapproval for "wrong") must be *the same component* involved in the meaning of that predicate *when it appears embedded*. The *attitude-expressing potential* must be present in the meaning contributed to complex contexts, even if not actively expressed there.
      *   **Motivating Case:** The word "wrong" in "Lying is wrong" (asserted: expresses disapproval) and in "If lying is wrong..." (embedded) must contribute the *same fundamental attitude-relevant meaning*. You cannot say "wrong" means disapproval-in-isolation but means something completely different (e.g., a truth-conditional property) when embedded – that's the "change of meaning" cheat Frege-Geach targets.
      *   **Why Not Negotiable:** This is the heart of the problem. Solving embeddings by changing the *meaning* of the moral term defeats the expressivist project. The attitude must be part of the *semantic content* available for composition.

  **The Graveyard & Conflict Zones:**

  1.  **The Biggest Killer: Compositionality + Attitude Uniformity + Conditionals/Negation.** This is the core nexus. Proposals often founder by:
      *   **"Bifurcation"**: Assigning moral terms a different meaning in embedded contexts (violates Attitude Uniformity).
      *   **"Expression in Embedding"**: Claiming complex sentences express higher-order attitudes (e.g., disapproving of disapproving of lying while not disapproving of getting your brother to lie) but failing to provide a systematic, compositional account of *which* complex attitude is expressed by *which* complex structure, especially for deeply nested embeddings or quantifiers. This often leads to...
      *   **"Explosion of Attitudes"**: Generating implausibly complex, ad hoc attitudes for relatively simple embeddings. (What attitude does "Bob doubts that if lying isn't wrong, then stealing is permissible" express?).
      *   **Failure to Ground Logic:** Even if attitudes are assigned, failing to explain *why* modus ponens preserves "correctness" or "rationality" in terms of those attitudes, especially across mixed moral/descriptive sentences.

  2.  **The Treacherous Swamp: Attitude Reports.** Giving a plausible, expressivist-friendly account of *what it is* to *believe that* lying is wrong (without collapsing into cognitivism) is extremely difficult. Many proposals either resort to quasi-cognitive "propositions" of attitudes or offer accounts that seem psychologically implausible.

  3.  **The Scaling Problem: Quantifiers.** Combining the expressivist attitude story with quantification (especially universal generalization) in a way that captures the meaning of "All lies are wrong" without invoking truth-conditions for the embedded moral claim or requiring attitudes towards non-existent or unknown instances is a major challenge. This often interacts badly with attempts to handle conditionals and negation.

  4.  **Potential Joint Unsatisfiability? Compositionality + Attitude Uniformity + Non-Cognitivism.** This is the existential threat. The core tension is:
      *   **Compositionality** demands that meanings combine in a truth-conditional way to form the meaning of the whole.
      *   **Attitude Uniformity** demands that the non-cognitive attitude is part of the meaning of the atomic moral component.
      *   **Non-Cognitivism** insists that the fundamental meaning *isn't* truth-conditional/representational.
      How can a fundamentally non-truth-conditional meaning component (the attitude) contribute systematically to the truth-conditions of complex sentences? Successful expressivist semantics (e.g., Gibbard's plan-based semantics, Blackburn's quasi-realism developed with minimal truth, Chrisman's inferentialist expressivism) attempt to bridge this gap by:
      *   Re-defining "truth-conditions" in expressivist terms (e.g., as plans or norms of attitude).
      *   Using sophisticated logical frameworks (possible worlds, intensions) where the "truth-condition" is built from the constraints on attitudes or commitments.
      *   Denying the need for robust truth-conditions, focusing instead on inferential role within a practice.
      The success of these maneuvers in fully satisfying all desiderata without residual cognitivism or artificiality is the central debate in contemporary expressivism.

  **In Summary:** An adequate solution must provide a **systematic, compositional semantics** where:
  1.  Atomic moral sentences express non-cognitive attitudes.
  2.  The *same attitude-relevant content* is contributed by the moral vocabulary when embedded in **conditionals, negations, attitude reports, and quantifiers**.
  3.  The resulting meanings for complex sentences allow **truth-conditions** to be assigned (or a suitable expressivist surrogate like "correctness-conditions").
  4.  These truth/correctness-conditions preserve **standard logical properties** (Modus Ponens, Consistency, Double Negation, etc.) for inferences involving moral vocabulary, both pure and mixed with descriptive vocabulary.
  5.  The account of **attitude reports** is psychologically plausible without collapsing into cognitivism.

  The graveyard is littered with proposals that handle simple embeddings but fail on complex ones, or preserve logic but sacrifice attitude uniformity, or handle uniform attitudes but can't ground logic. The battleground is Conditionals and Attitude Reports, and the deepest conflict is between Compositionality, Attitude Uniformity, and the core Non-Cognitivist thesis. When reading proposals, scrutinize *exactly* how they handle deeply nested conditionals/negations, mixed moral/descriptive quantifiers, and attitude reports, and whether their account of validity for mixed inferences is genuinely grounded in their expressivist foundations.
