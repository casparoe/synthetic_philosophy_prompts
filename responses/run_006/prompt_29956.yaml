  ## The DSM-III Homosexuality Revision: Naturalism vs. Normativism

  The American Psychiatric Association's (APA) 1973 decision to remove homosexuality from the DSM-II serves as a pivotal case study illuminating the tensions between naturalist and normativist conceptions of disease. Analysed through these lenses reveals the strengths and limitations of each approach.

  **(1) The Naturalist Verdict (Boorse's Biostatistical Theory)**

  *   **Pre-1973 Status:** A thoroughgoing naturalist, applying Boorse's criteria strictly, would likely conclude homosexuality **was not a disease** even before 1973. Boorse defines health as statistically normal functional ability relative to a reference class (age/sex), and disease as a statistically subnormal part-function impairing survival or reproduction.
      *   Homosexuality does not inherently impair basic survival functions (e.g., respiration, circulation). Homosexual individuals live full lifespans.
      *   Crucially, while homosexuality *can* reduce *biological* reproduction rates compared to heterosexuals within the same reference class, it is not a *functional impairment* of the reproductive system itself. The biological capacity for reproduction is typically intact; the reduction stems from behavioural preference, not organ dysfunction. Statistically, it represents a variation in sexual *behaviour* or *object choice*, not a pathological failure of a species-typical part-function like kidney filtration or cardiac output.
  *   **Grounds for Change:** The naturalist would argue the APA **had strong scientific grounds** for removal based on empirical evidence available even before 1973. Research failed to demonstrate homosexuality as a statistically subnormal part-function causing biological dysfunction or impairing survival/reproduction *due to inherent biological failure*. The reclassification corrected a scientific error, aligning the classification with biological facts about human functional variation. The pressure from activists and sympathetic psychiatrists, while politically significant, merely accelerated the recognition of pre-existing scientific evidence.

  **(2) The Normativist Interpretation**

  *   **Reclassification Process:** The normativist sees the 1973 decision as a paradigm case of **social values reshaping disease concepts**. Homosexuality was classified as a disorder primarily because it violated prevailing social, moral, and religious norms concerning "proper" sexuality and gender roles. The removal signified a major shift in societal values: the growing rejection of homosexuality *as inherently immoral or harmful* and the acceptance of sexual diversity as compatible with a "good life". The activism was instrumental in forcing psychiatry to confront the value-laden nature of its classification.
  *   **Retention of Distress Category:** The normativist argues the creation of "Sexual Orientation Disturbance" (later "Ego-dystonic Homosexuality") **explicitly demonstrates values still doing the work**. This category pathologised not the orientation itself, but the *distress* associated with it. Normativism highlights that:
      *   **The Harm Criterion is Value-Laden:** What constitutes "distress" warranting medical attention is inherently evaluative. Is the distress caused by internal conflict, or by external societal oppression and internalised homophobia? Labelling the distress as a disorder implicitly medicalises the *social* problem of stigma.
      *   **Defining the "Good Life":** The retention signalled that while a homosexual orientation wasn't inherently disordered, *failing to accept* one's homosexuality (according to prevailing social/clinical ideals of self-acceptance) *was* problematic. The value judgement shifted from condemning the orientation to pathologising the lack of congruence between orientation and self-concept.

  **(3) Explaining the Episode: Strengths and Weaknesses**

  *   **Naturalism's Performance:**
      *   **Explains Well:** The core scientific justification for removal – lack of evidence for inherent biological dysfunction impairing survival/reproduction – aligns perfectly with naturalism. It explains why the change was scientifically *correct* and could be grounded in biological evidence (e.g., Kinsey's work on prevalence, studies showing lack of inherent psychopathology). It readily justifies the outcome.
      *   **Misdescribes/Strains:** It struggles profoundly to explain:
          *   **The Original Classification:** Why was homosexuality ever classified as a disorder if it wasn't biologically dysfunctional? Naturalism must attribute this to scientific error or ignorance, but the *persistence* of the diagnosis despite counter-evidence suggests the influence of non-scientific (normative) factors was paramount.
          *   **The Retention of Distress:** Why create "Ego-dystonic Homosexuality"? If distress isn't caused by a biological dysfunction (but by societal oppression), why is it a *medical* disorder? Naturalism struggles to pathologise distress without demonstrating an underlying biological dysfunction causing it. It appears ad hoc.
          *   **The Role of Politics:** It downplays the essential role of activism and shifting social values in driving the change, portraying it as purely scientific progress rather than a value-driven renegotiation.
  *   **Normativism's Performance:**
      *   **Explains Well:** The entire arc of classification, declassification, and residual categorisation is readily explained as reflecting changing social values and negotiations about harm and acceptable ways of life. It powerfully accounts for the role of activism and the APA's framing of the decision as involving both science *and* societal concerns. The retention of the distress category is easily seen as a compromise reflecting ongoing value judgements about what constitutes problematic suffering warranting psychiatric attention.
      *   **Misdescribes/Strains:** It struggles to explain:
          *   **Why Retain *Any* Category?** Why didn't the APA simply declare homosexuality entirely non-psychiatric? Normativism struggles to provide a principled *medical* reason for retaining the distress category beyond "it's disvalued". It risks collapsing medicine into pure social control, failing to demarcate distress caused by internal conflict (potentially within psychiatry's remit) from distress caused solely by external oppression (arguably a social/political problem). The APA likely retained it partly due to residual clinical belief in treating *suffering*, attempting (however imperfectly) to distinguish internal psychological conflict from the orientation itself – a distinction normativism blurs.
          *   **The Appeal to Science:** Normativism can dismiss the APA's scientific justifications as mere window dressing for value shifts. However, this overlooks the genuine role empirical evidence (e.g., prevalence, lack of inherent impairment) played in undermining the *scientific credibility* of the old diagnosis, providing crucial ammunition for the normative argument.

  **(4) What the Episode Reveals: Refining Naturalism, Exposing Normativism's Demarcation Problem**

  The 1973 episode **refutes a simple, purely descriptive naturalism** like Boorse's early formulations. It demonstrates that:

  1.  **Value-Laden Selection of Functions:** Deciding which functions are "species-typical" and relevant to "survival/reproduction" involves value judgements. Why is heterosexual procreation privileged as the "normal" function for sexuality? Homosexuality's prevalence itself challenges the "statistical subnormality" claim within specific reference classes.
  2.  **Non-Biological Harms Matter:** The primary "harm" historically associated with homosexuality was social ostracism and internalised shame – harms rooted in social norms, not biological dysfunction. Naturalism struggles to incorporate these without distortion.
  3.  **Social Forces Shape Classification:** The persistence of the diagnosis despite weak biological evidence of dysfunction, and its removal driven significantly by social pressure, shows that disease classification is not immune to societal values. Naturalism needs refinement to acknowledge how values influence *which* biological variations get labelled pathological.

  However, the episode **simultaneously exposes a critical weakness in normativism: its difficulty in demarcating medicine from politics.** The retention of the distress category highlights this:

  *   **The Normativist Dilemma:** If disease is *only* a disvalued state, why is homophobic distress *not* also a disorder? Why pathologise the distress of the minority individual but not the prejudice causing it? Normativism struggles to provide a non-arbitrary reason why one form of suffering (internal conflict over orientation) is "medical" while another (distress caused by societal bigotry) is "political".
  *   **The APA's Implicit Demarcation Attempt:** By retaining *only* the distress category, the APA implicitly appealed to a distinction between the *orientation* (no longer seen as inherently dysfunctional/harmful) and the *individual's psychological suffering* related to it (seen as a potential object of clinical intervention). Normativism struggles to ground this distinction without smuggling in some concept of internal dysfunction or "abnormal" psychological response, edging back towards naturalist concerns. It fails to explain why *this particular* distress belongs in the medical domain rather than being addressed solely through social change.

  **Definite Position:** The case **forces a refinement of naturalism** by demonstrating that purely value-free biological classification is impossible; social values inevitably influence which statistically atypical functions are labelled diseases. However, it **reveals normativism's core problem**: without *some* anchor in biological or psychological dysfunction, it cannot adequately distinguish medical disorders from social problems or unpopular conditions, risking the politicisation of medicine. The APA's retention of the distress category reflects an unstable attempt to navigate this tension, acknowledging shifting social values while trying to preserve psychiatry's focus on internal suffering.

  **Strongest Objection & Defence:**

  *   **Objection (from Naturalism):** "The distress category *can* be naturalised. Ego-dystonic homosexuality involved genuine psychological conflict – a dysfunction in self-concept integration or identity formation – causing harm (distress). This *is* a value-free dysfunction."
  *   **Defence:** This defence relies on the contestable assumption that conflict between sexual orientation and self-concept is *inherently* dysfunctional. Why isn't it a rational response to societal oppression? The "dysfunction" identified is inseparable from the social context and value judgements about what constitutes a congruent identity. Defining the "proper" integration of sexual identity into the self is inherently normative. The naturalist struggles to define the "normal" psychological function for identity integration without reference to social norms about acceptable identities.

  **Contestable Assumption Underpinning Verdict:** My analysis hinges on the contestable assumption that **disease concepts serve a dual purpose:** they aim to track objective biological/psychological dysfunction *and* to identify states warranting medical intervention due to the harm they cause individuals within their social context. The 1973 episode shows these purposes can conflict, and neither pure naturalism nor pure normativism fully captures the complex interplay required for a workable medical taxonomy. The unresolved tension in the distress category exemplifies this ongoing challenge.
