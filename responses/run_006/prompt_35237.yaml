prompt: |-
  I recently spent several months on a hospital ethics committee during a period in which a scarce treatment had to be allocated among more patients than could receive it, and I keep turning over a pattern of reasoning I encountered there, for which I have never found a satisfactory name.

  The pattern concerns forced choices between saving some number of people and saving a larger number. Almost everyone on the committee agreed, in the abstract, that if one had to choose between saving one patient and saving five equally needy patients, one should save the five. But a substantial minority of my colleagues denied this when the cases were made concrete. They did not claim that the single patient mattered more, or that we owed him special loyalty, or that the comparison was impossible. Their claim was that each of the six patients has a separate claim to be saved, and that these claims do not combine into a larger claim on one side of the ledger. The presence of five other patients, they argued, does not weaken or cancel the one patient's claim. From this they concluded that the bare fact that more people stand on one side does not settle what we should do. Some of them thought the only defensible procedure was a lottery giving each patient an equal chance; others thought any choice was permissible as long as we did not pretend that five equal claims added up to five times the weight of one.

  I later recognized the same pattern in a dispute about clearing a road after a storm, where some residents argued that the fact that one road contained more stranded people did not decide which road to clear first, because each stranded person's claim stood separately.

  I do not think this is the ordinary utilitarian view, and I do not think it is simply the familiar tendency to be moved more by an identified victim than by a statistical one, since the people who argued this way applied it to complete strangers and offered it as a principle. I also do not think it is the claim that lives are incommensurable, since they were willing to compare and choose. But I have no name for it, and I am not sure whether it is one position or a family of positions. What I would like to know is whether this stance — the refusal to let the number of separate claims settle a forced choice about who is saved — is a recognized position, and if so what it is called. I am equally interested in how it should be distinguished from nearby views, and where its boundaries lie: the same people who refused to count heads in the rescue case were often willing to approve public-health measures expected to save a larger number of statistical lives, and I cannot tell whether that combination is consistent or whether it marks the edge of the concept.
reasoning: |-
  Okay, the user describes a fascinating ethical dilemma they encountered on a hospital ethics committee. They're struggling to name a reasoning pattern where some members refused to aggregate individual claims when allocating scarce resources, despite accepting abstract utilitarianism. 

  Hmm... This feels deeply philosophical yet practical. The core tension is between aggregative ethics (like utilitarianism) and non-aggregative approaches. The user specifically notes it's not about identifiability or incommensurability - those are important distinctions. 

  First thought: This echoes John Taurek's "Should the Numbers Count?" argument from 1977. Taurek famously claimed that saving one stranger vs five doesn't morally compel choosing the five, since each person's loss is separate. The user's colleagues sound like Taurekians! 

  But wait - the user mentions these same people supported public health measures saving statistical lives. That creates tension. Is this inconsistent? Not necessarily. Public health operates at population level where aggregation might feel different than individual rescue cases. Maybe it's about proximity? 

  Also interesting how the lottery solution emerges as a compromise - giving equal respect without aggregation. Reminds me of Scanlon's contractualism too, where we justify choices based on what no one could reasonably reject. 

  The road-clearing example confirms this isn't just medical ethics. It's a broader pattern of resisting "counting heads" in rescue scenarios. User wants boundaries: where does this principle start/stop? Why accept aggregation for vaccines but not ventilators? 

  Key distinctions needed: 
  1) Individual vs statistical lives 
  2) Concrete vs abstract reasoning 
  3) Whether claims conflict directly (zero-sum) 
  4) If the decision-maker bears personal responsibility 

  The user's frustration is palpable - they've clearly wrestled with this. Their academic tone suggests they want precise philosophical labeling, not just practical solutions. "Family of positions" is astute - it's not one monolithic view. 

  Final note: The public health exception might reveal that even non-aggregationists allow aggregation when consequences are sufficiently large or probabilistic. That's the boundary they're groping toward.
answer: |-
  This reasoning pattern is indeed a recognized and significant position in moral philosophy, most prominently associated with **non-aggregative approaches to distributive justice or rescue ethics**. Here's a breakdown:

  ### 1. **Core Position: Non-Aggregationism**
     - **Name**: The position is most famously articulated in **John Taurek’s 1977 essay "Should the Numbers Count?"** It’s often called **Taurekian non-aggregationism** or the **separateness-of-persons objection to aggregation**.
     - **Key Argument**: 
       - Each individual has a separate, non-fungible claim to be saved.
       - These claims cannot be summed or aggregated into a "greater total claim."
       - The loss suffered by one person (e.g., death) is not morally compensated by saving others. As Taurek wrote: *"When I am moved to rescue A from some threat, my primary thought is to aid him. The fact that there are others I might also aid does not strengthen my reason for aiding him."*
       - Choosing whom to save thus cannot be resolved by "counting heads." Instead, fairness requires giving each person an **equal chance** (e.g., via a lottery) or seeking another non-aggregative justification.

  ### 2. **Distinguishing It from Nearby Views**
     - **Vs. Utilitarianism**: Rejects the core utilitarian premise that moral weight is additive ("5 lives > 1 life").  
     - **Vs. Identifiable Victim Effect**: Not about psychological bias toward "known" individuals; your colleagues applied it impartially to strangers.  
     - **Vs. Incommensurability**: Unlike true incommensurabilists, non-aggregationists accept comparability (e.g., both patients need the same treatment) but deny *summability*.  
     - **Vs. Deontology**: While sharing a focus on individual claims, it doesn’t invoke duties/loyalty (as you noted).  
     - **Vs. Rawlsian Fairness**: Rejects maximizing the "greater good" even behind a veil of ignorance.

  ### 3. **Boundaries and Tensions**
     The tension your colleagues displayed—rejecting aggregation in rescue cases but accepting public-health policies—is a major point of debate. Possible resolutions:
     - **Scale/Impersonal Context**: Non-aggregationists may accept aggregation for large-scale, statistical decisions (e.g., vaccination policies) where no *specific individual* is denied a claim in a zero-sum conflict. The "separateness" concern fades when choices are systemic and probabilistic.
     - **Probability vs. Certainty**: In rescue cases (1 life vs. 5), someone *certainly dies* due to your choice. Public health often involves *risk reduction* for many without directly sacrificing identified individuals.
     - **Duty to Aid vs. Institutional Obligation**: Your colleagues might distinguish between *personal moral responsibility* in direct rescues (where non-aggregation applies) and *institutional efficiency* in population health (where aggregation is pragmatic).
     - **Consistency?** Philosophers like Derek Parfit argued this combination is inconsistent. Others (e.g., Alex Voorhoeve) defend "hybrid" theories allowing aggregation only above a threshold of harm severity.

  ### 4. **Variants Within Non-Aggregationism**
     - **Strong Taurekism**: Never aggregate; always use a lottery or equal chance.  
     - **Moderate Non-Aggregation**: Aggregate only when numbers are very large (e.g., 1 vs. 1000), or when harms are unequal.  
     - **Contractualist Versions** (e.g., T.M. Scanlon): Ask which principle no one could reasonably reject. Saving one random person versus five might be rejectable by the five, but if the one has a stronger claim (e.g., greater need), non-aggregation could hold.

  ### 5. **Why This Matters Clinically**
     Your committee’s experience reflects a real-world clash:
     - **Abstract vs. Concrete**: In theory, saving more lives seems obvious. Facing actual patients, the moral residue of ignoring one claim feels intolerable.  
     - **Lottery as Compromise**: The lottery solution respects each claim equally without aggregation, explaining its appeal to your colleagues.  
     - **Emotional vs. Rational**: The stance isn’t merely emotional—it’s a principled rejection of consequentialism when individual fates are directly decided.

  ### Key References:
  - Taurek, J. (1977). ["Should the Numbers Count?"](https://www.jstor.org/stable/2264947)  
  - Scanlon, T.M. (1998). *What We Owe to Each Other* (Ch. 5).  
  - Voorhoeve, A. (2014). ["How Should We Aggregate Competing Claims?"](https://philpapers.org/rec/VOOHSW)  

  This view remains contentious but highlights a fundamental tension: **Can the moral urgency of multiple claims ever outweigh the finality of sacrificing one life?** Your colleagues' stance insists the answer is "no," demanding humility in the face of irreplaceable loss.
