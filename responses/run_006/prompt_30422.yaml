prompt: |-
  I'm trying to sort out when I actually trust the inside view versus the outside view, because my gut seems to switch depending on whose project it is. Here are my verdicts, as honestly as I can report them.

  - A friend opens a restaurant. I know most independent restaurants close within a few years, and even though she's talented and the menu is good, I'd quietly bet against it. Outside view.
  - My own PhD: the cohort completion rate in my department is about 60%, but my supervisor is attentive, I've got two papers out, and the project is moving. I don't think the 60% tells me much about me. Inside view.
  - A colleague's startup: she shows me traction metrics and enthusiastic customer interviews. I've seen to many startups with good early signals fail, so I'd predict it fails. Outside view.
  - But if it were my startup with the same early signals, I'd trust the specifics — I can tell which customers are genuinely enthusiastic and which metrics are vanity metrics. Inside view.
  - Poker: against an unknown player I play population tendencies; against someone I've watched for an hour I trust my read. That feels right, and I don't think those two are in tension.
  - My friend's whirlwind engagement: the base rates aren't great, and even though I like them both and they seem well-suited, I'd privately give it lower odds then they do. Outside view.

  People talk about epistemic modesty as if it just meant deferring to base rates, but my poker case makes me think it's really about whether I've earned the inside view. Is there one principle that captures when I go inside and when I go outside? In particular, is the self/other asymmetry defensible, or does a coherent principle force me to drop at least one of these verdicts? And I suspect the real issue is reference classes: I trust a base rate when the class is obvious, but I don't trust myself to pick the class when it isn't. Is that the principle, or just another way of dressing up the same asymmetry? Please also say what the principle predicts about the case I keep avoiding — predicting how my own relationship will go, where I know the inside details as well as I know anything. Answer in British English.
reasoning: |-
  Alright, let me unpack this user's query. They're struggling with when to trust the inside view versus the outside view, and they've given several examples showing a pattern. First, I need to identify the common thread in their cases. 

  The user mentions their friend's restaurant and colleague's startup—both cases where they lean on base rates (outside view). But for their own PhD and hypothetical startup, they focus on specifics (inside view). The poker example stands out because it switches based on information: population tendencies vs. personal observation. 

  Hmm, the key here seems to be whether they feel they have sufficient specific information to override general statistics. The self/other asymmetry is noticeable. They trust their own judgment when it's personal but doubt others' specifics. Is that defensible? Maybe, if they genuinely have more detailed knowledge about their own situations. But the relationship case they avoid is tricky—knowing both inside details and base rates could create conflict.

  The user suspects reference classes are the core issue. When the reference class is clear (like restaurant failure rates), they defer. When it's fuzzy (their PhD progress), they dismiss the base rate. The principle might be about earned knowledge: have they gathered enough specific data to justify deviating from the general stats?

  For their own relationship, the principle would require brutal honesty. They must assess whether their insider knowledge is truly relevant to longevity or just wishful thinking. The outside view (divorce rates) must be weighed against specific factors like conflict resolution skills. The tension here is real—self-awareness is hard, but necessary for a balanced prediction.
answer: |-
  Your instinct about "earned knowledge" is spot on, and your poker example brilliantly illustrates the core principle. The self/other asymmetry *can* be defensible, but only if it genuinely reflects a difference in the *quality and depth* of your specific information, not mere wishful thinking or proximity. Here's the principle distilled:

  **The Earned Specifics Principle:**  
  Trust the **inside view** only when you possess **deep, relevant, specific knowledge about the *causal mechanisms* at play in *this particular instance*** that demonstrably differentiates it from the base rate population in ways materially impacting the outcome. Otherwise, default to the **outside view** (base rates).

  Now, applying this to your cases:

  1.  **Friend's Restaurant (Outside View):** You lack deep, specific knowledge of their operational efficiency, cash flow management, local market saturation, or landlord terms. You see the menu and talent, but these are insufficiently differentiating causal factors against the brutal base rate. *Correct application.*
  2.  **Your PhD (Inside View):** You possess granular, causal knowledge: *your* supervisor's attentiveness (not just "a" supervisor), *your* publication record proving progress, *your* project's specific momentum. This differentiates you from the cohort base rate in ways *directly causal* for completion. *Defensible inside view, provided your assessment is realistic.*
  3.  **Colleague's Startup (Outside View):** Traction metrics and customer interviews are early signals, but notoriously noisy and prone to misinterpretation *without deep context*. You haven't seen their burn rate, unit economics, competitive moat, or team dynamics. You know the base rate of early-signal failures. *Correct application.*
  4.  **Your Startup (Inside View - Hypothetical):** Crucially, you claim the ability to *discern genuine enthusiasm from vanity and identify truly causal metrics*. This is the "earned" knowledge – deep, specific understanding of the *causal mechanisms* (customer sincerity, metric relevance) unavailable to an outsider. *Defensible IF your discernment is truly earned and accurate, not overconfidence.*
  5.  **Poker (Perfect Hybrid):** Against an unknown player, no earned specifics exist – default to population tendencies (outside view). After an hour of focused observation, you've *earned* specific knowledge about *this player's* tells, tendencies, and decision patterns – allowing a (cautious) inside view. *Exemplifies the principle.*
  6.  **Friend's Engagement (Outside View):** You see surface compatibility ("well-suited," "like them both"), but lack deep, specific knowledge of their conflict resolution under stress, financial alignment, long-term goal compatibility, or family pressures – the real causal factors in marriage success/failure. The base rate speaks louder. *Correct application.*

  **The Self/Other Asymmetry:** This *is* often defensible under the Earned Specifics Principle, *because you inherently possess vastly more detailed, granular, causal knowledge about your own projects, efforts, and situation than you ever could about someone else's*. You see the daily grind, the near-misses, the internal dynamics. The key is brutally honest self-assessment: *Is my insider knowledge truly deep, causal, and differentiating, or is it just my hopes, fears, and proximity?* Your PhD case likely passes this test; blindly assuming your startup would, might not.

  **Reference Classes:** Your suspicion is insightful. The challenge isn't just whether a reference class exists, but whether you can *reliably identify a narrower, more relevant reference class based on your specifics*. For your PhD, you implicitly argued the department cohort *isn't* the right class; your specific progress defines a narrower, more favourable class (e.g., "students with 2 papers by year X and an engaged supervisor"). The principle demands: *Have you earned the right to define that narrower class?* ("Earning it" means having causal knowledge justifying the reclassification). When the class *is* obvious and broad (restaurants, marriage), and you lack specifics to justify narrowing it, the outside view dominates.

  **Your Own Relationship (The Avoided Case):** This is the crucible for the Earned Specifics Principle.

  1.  **The Outside View (Base Rates):** Must be acknowledged. Divorce/separation rates for first marriages, cohabitation trends, age brackets, etc., provide a powerful statistical prior. Ignoring this is folly.
  2.  **The Inside View (Earned Specifics):** You possess unparalleled specific knowledge: communication patterns during conflict, values alignment on core issues (kids, money, location, careers), sexual compatibility, family dynamics, mutual support during crises, *demonstrated* conflict resolution skills, shared life goals, and resilience under shared stress.
  3.  **Applying the Principle:** You *only* get to favour the inside view if:
      *   You can identify *specific, causal factors* in your relationship that demonstrably mitigate known failure risks (e.g., "We have a proven, effective method for de-escalating arguments that most couples lack," or "Our values alignment on all critical life aspects is exceptionally rare and robustly tested").
      *   You can honestly argue that the broad base rate reference class (e.g., "all marriages") is *less relevant* than a narrower class defined by *your earned specifics* (e.g., "couples who cohabited successfully for 5+ years pre-marriage, underwent pre-marital counselling addressing X,Y,Z, and demonstrated resilience through specific shared adversity A").
      *   Critically, you avoid the "special snowflake" fallacy – assuming uniqueness without concrete, causal justification.

  **Prediction:** A coherent prediction under the Earned Specifics Principle **forces integration, not choosing one view**:

  *   Start with the outside view as the anchor (base rates give the prior probability).
  *   Rigorously audit your "earned specifics": Which factors *truly, causally* impact long-term relationship success? How robustly have they been tested? Are you *sure* they differentiate you favourably from the base rate population? (This is brutally hard self-honesty).
  *   Adjust the base rate prediction *modestly* based *only* on the strongest, most causal, best-evidenced specifics. Avoid large adjustments based on feelings, fleeting happiness, or superficial compatibility.
  *   **Result:** Your prediction should likely be *less optimistic* than your unmoderated inside view ("We're soulmates, of course forever!") but *potentially more optimistic* than the raw, undifferentiated base rate ("50% of marriages fail"), *if and only if* you can point to genuinely earned, causal specifics that warrant it. The size of the adjustment depends entirely on the strength and relevance of those specifics.

  **In essence:** Epistemic modesty isn't *always* deferring to base rates. It's about *knowing when you haven't earned the right to overrule them*. Your poker intuition is the model: use the population stats until you've gathered enough high-quality, instance-specific data to make a *justifiably* different call. Apply that same ruthless honesty to your PhD, your hypothetical startup, and especially your relationship. The self/other difference is often justified by access to data, but beware the siren call of self-deception masquerading as insider knowledge.
