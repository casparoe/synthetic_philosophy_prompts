answer: |-
  Your pairing of *Memento* with Dennett's "center of narrative gravity" (CNG) is brilliant. The film doesn't just illustrate the concept; it subjects it to intense pressure, revealing both its explanatory power and its potential perils in a way Dennett's own examples often avoid. Here's a reading balancing vindication, complication, and danger:

  **Vindication: The CNG Made Literal & Necessary**

  1.  **Literally Constructed from Narrative Props:** Leonard's entire sense of self and purpose *is* externally scaffolded. His tattoos ("FACT 1: JOHN G. RAPED AND MURDERED MY WIFE," "FACT 6: CAR LICENSE SG13 7IU"), Polaroids with captions ("Natalie - She will help you out of pity"), and handwritten notes ("DON'T ANSWER THE PHONE") are pure narrative devices. They *are* his memory, his past, his present identity, and his future goal. **Scene:** The opening sequence where he methodically reviews photos and notes, literally assembling his current state and purpose. This *perfectly* literalizes Dennett's abstract idea: Leonard's "self" at any moment is the story assembled from these artifacts.
  2.  **Coherence Through Narrative:** Without these props, Leonard would be utterly fragmented, lost in a perpetual, terrifying present. The CNG, however unstable, provides essential coherence and a driving purpose (finding John G). **Scene:** His frantic searching for a pen to write down the license plate number Teddy gives him – the narrative *must* be captured immediately or the "self" (the mission, the identity as avenger) dissolves.
  3.  **The Narrative Defines Identity:** His identity *is* "the man hunting John G." This narrative organizes his actions, his interpretations of others (Natalie, Teddy), and his sense of self-worth. **Scene:** His monologue about Sammy Jankis, defining himself *against* Sammy ("I have a system") – his narrative positions him as the capable avenger, not the helpless victim.

  **Complication: The CNG as Unreliable, Contested, and Fictional**

  1.  **Externally Manipulated:** Leonard's CNG is highly vulnerable to manipulation by others who understand his condition. They literally rewrite his story. **Scenes:**
      *   **Teddy:** Feeding Leonard false information ("John G is Jimmy Grantz"), manipulating him into killing targets Teddy wants gone, and later revealing the "truth" about Sammy Jankis and Leonard's own past actions. Teddy actively authors parts of Leonard's narrative.
      *   **Natalie:** Exploiting his condition after he attacks her, manipulating his notes and Polaroids to turn him against Teddy ("DON'T BELIEVE HIS LIES") and use him to deal with Dodd. She weaponizes his narrative construction.
  2.  **Internally Unreliable / Self-Deception:** The Sammy Jankis story is the core complication. **Scenes:**
      *   **Teddy's Revelation:** The bombshell that Sammy Jankis never had a wife who died from insulin injections; it was *Leonard's* wife. Leonard's own condition (or guilt) prevented him from administering her insulin. He projected his own tragedy onto Sammy, creating a cautionary tale that absolves him of responsibility and reinforces his identity as the victim/avenger.
      *   **The Final Choice:** The climax isn't just Teddy's murder; it's Leonard *choosing* to forget Teddy's revelation. He burns the photo of Jimmy Grantz (proof he already got revenge), selects the Polaroid of Teddy labeled "DON'T BELIEVE HIS LIES," and writes "FACT 6" (the license plate Teddy gave him for the *next* "John G") on his body. He *actively manufactures* a new, more palatable narrative center that reinstates his mission and identity as the avenger. This isn't passive forgetting; it's active, willful self-deception embedded in the CNG construction.
  3.  **The Fiction is Fragile & Contested:** The film constantly shows the narrative being challenged, rewritten, and proven false. The "facts" tattooed on his body are demonstrably unreliable or manipulated. The CNG isn't a stable, unified story; it's a battleground.

  **Showing the Danger: The CNG as a Harmful Fiction**

  This is where *Memento* goes significantly beyond Dennett's generally benign "useful fiction" view:

  1.  **Fuel for Violence:** Leonard's meticulously constructed CNG ("avenger hunting John G") directly drives his violent actions. He kills Jimmy Grantz and Teddy based on narratives fed to him or self-constructed. The narrative isn't just useful; it's destructive. **Scene:** The cold, methodical killing of Teddy, driven entirely by the narrative Leonard has chosen to reinforce.
  2.  **Self-Imprisonment:** His CNG traps him in a cycle of violence and self-deception. The "useful fiction" becomes a harmful, self-perpetuating loop. He *cannot* move on because his identity and purpose depend on the unresolved quest. **Scene:** The final moments where he deliberately sets himself up to hunt another "John G," discarding the evidence that would shatter his narrative.
  3.  **Epistemological Nightmare:** *Memento* highlights the *dangers* of relying solely on narrative coherence without reliable memory or verifiable facts. Dennett acknowledges the fictional aspect but often emphasizes its functional benefits. *Memento* shows how easily such a fiction, especially when externally manipulable or built on denial, can lead to profound error and harm.

  **What *Memento* Adds to Dennett's Debate:**

  1.  **Visceral Stakes & Vulnerability:** Dennett's examples (e.g., fictional characters, historical figures) are abstract. *Memento* makes the CNG tangible, fragile, and *painful*. We see the desperate *need* for the narrative and the devastating *cost* when it's manipulated or built on lies. It adds emotional and ethical weight.
  2.  **Explicit Manipulation & Power Dynamics:** Dennett focuses on the individual constructing their narrative. *Memento* forces us to confront how *others* can hijack and weaponize someone's CNG, especially when vulnerabilities exist (like Leonard's amnesia, but arguably applicable to cognitive biases or trauma in "normal" selves).
  3.  **The Will to Deceive Oneself:** Dennett's CNG is usually portrayed as a largely unconscious, functional process. *Memento*'s climax shows a stark, conscious *choice* to embrace a self-serving fiction. It emphasizes the *active role* the self (or what remains of it) plays in maintaining a harmful narrative, highlighting agency within the fiction.
  4.  **The Danger of Narrative Closure:** Leonard's narrative *requires* an open loop – the hunt for John G. Closure would collapse his identity. *Memento* suggests that the very structure of a narrative self, especially one built on trauma or denial, might *resist* resolution in harmful ways, turning the "useful fiction" into a dangerous trap.

  **Conclusion:**

  *Memento* powerfully **complicates and darkens** Dennett's center of narrative gravity concept. It brilliantly **vindicates** the core idea by showing a self utterly dependent on external narrative scaffolding for coherence and purpose. However, it **complicates** it by exposing the CNG's profound vulnerability to external manipulation and internal self-deception (epitomized by the Sammy Jankis projection). Crucially, it **shows the danger** Dennett often underplays: this narrative fiction isn't just useful; it can be a self-imposed prison, a fuel for violence, and a tool for others to exploit, especially when built on denial and actively maintained against contradictory evidence. The film adds a crucial layer of ethical urgency and visceral vulnerability to the philosophical debate, forcing us to confront not just how the narrative self *works*, but how it can *fail* catastrophically. Leonard isn't just Dennett's idea made literal; he's a stark warning about the potential toxicity of the stories we tell ourselves.
