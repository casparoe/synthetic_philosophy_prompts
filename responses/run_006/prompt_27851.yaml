answer: |-
  Here's a move-by-move adjudication, followed by overall assessment and key insights:

  ### Move-by-Move Adjudication
  1. **Marcus (Partially Right, but Overstated):**  
     *Right:* Kelly *does* maximize long-run geometric growth for repeated identical bets. For a 60% edge on even money, 20% is correct.  
     *Wrong:* "Almost surely" and "any fixed fraction... gets left behind" is too strong. Fractions *near* Kelly will grow comparably over realistic horizons. Fractions slightly above Kelly only guarantee ruin with infinite bets and no fractional betting—real poker games avoid this.  

  2. **Dana (Partially Right, but Misapplies):**  
     *Right:* Kelly maximizes *log utility*. For a single bet, max EV *does* imply betting all you can. Risk aversion (e.g., concave utility) justifies smaller bets.  
     *Wrong:* Calling anything less than max EV "just risk aversion" dismisses valid long-term growth goals. Kelly isn’t arbitrary—it’s the optimal trade-off for repeated play.  

  3. **Marcus (Mostly Right):**  
     *Right:* Betting far above Kelly (e.g., >2x) risks near-certain ruin even with an edge, due to volatility drag. Sequence risk matters—a bad run can destroy capacity to benefit from future edges.  
     *Weakness:* "Far enough above" is vague. Slightly above Kelly (e.g., 1.1x) doesn’t guarantee ruin and may outperform in finite sequences with high edge certainty.  

  4. **Dana (Largely Right):**  
     *Right:* Real-world constraints break Kelly’s assumptions:  
     - **Finite, lumpy bets:** Full Kelly can cause severe drawdowns (e.g., 50% loss with 2 consecutive losses at 20% stake), altering future stakes.  
     - **Uncertain edge:** Estimated edges are noisy; betting full Kelly on a misestimated 60% edge (when true is 55%) leads to overbetting and ruin risk. Half-Kelly reduces volatility and estimation error sensitivity.  
     *Wrong:* Calling half-Kelly "more robust" isn’t arbitrary—it’s mathematically defensible under uncertainty and finite sequences.  

  5. **Marcus (Partially Right, but Dogmatic):**  
     *Right:* Kelly is *defined* as the log-utility optimizer. Deviations *should* be justified by explicit utility (e.g., CRRA utility with γ≠1).  
     *Wrong:* Dismissing half-Kelly as "just scared" ignores its optimization under realistic uncertainty. Half-Kelly often maximizes median wealth or survival probability when edge is uncertain.  

  ### Overall Assessment  
  **Dana is more right for the practical context.**  
  - Marcus correctly defends Kelly’s theoretical optimality but underweights real-world constraints: edge uncertainty, finite bets, and bankroll path-dependence.  
  - Dana’s emphasis on robustness (half-Kelly) aligns better with actual poker games: edges are estimated, sessions are finite, and players care about drawdowns.  

  ### Key Missing Pieces  
  1. **Bankroll Integration:** Neither addresses how side bets interact with the main poker bankroll. Kelly assumes a dedicated bankroll—commingling risks overbetting if edge estimates don’t account for total exposure.  
  2. **Correlated Risks:** Bad runs in poker + side bets may correlate (e.g., tilt), amplifying sequence risk.  
  3. **Rebalancing:** Kelly assumes continuous rebalancing. Infrequent games may warrant lower stakes to avoid large interim losses.  
  4. **Utility Goals:** Both imply growth maximization, but players may prioritize survival (minimize ruin risk) or lifestyle stability (limit drawdowns).  

  ### What Would Change the Verdict?  
  - **Infinite identical bets with known edge:** Marcus wins (Kelly is objectively optimal).  
  - **Perfect edge certainty:** Half-Kelly becomes overly conservative.  
  - **High risk tolerance (e.g., venture capital):** Dana’s max-EV stance gains merit for single opportunities.  

  ### Where Reasoning Could Fail  
  - **Edge Estimation:** If edges *can* be precisely known (e.g., arbitrage), Dana’s uncertainty argument weakens.  
  - **Bankroll Flexibility:** If players can replenish funds, full Kelly becomes more viable.  
  - **Time Horizon:** Ultra-long horizons favor Marcus; short horizons favor Dana.  

  **Verdict:** For real poker side bets, Dana’s caution wins.
