prompt: |-
  I'm taking a graduate seminar on fairness in machine learning, and we've spent three weeks on the impossibility results — the ones showing that calibration across groups, equal false positive rates, and equal false negative rates cannot all hold simultaneously when base rates differ and the predictor is imperfect. My professor keeps pressing us with the same question: "Fine, you can't have everything. So what do you actually want?" And I've realized I don't have a clear answer, because I don't have a clear list of what a fairness criterion is supposed to do in the first place.

  I want you to write the desiderata for a criterion of algorithmic fairness, taking the impossibility results as fixed constraints on the space of possible criteria. Not a list of the statistical properties people have proposed — calibration, demographic parity, equalized odds, and so on are candidates, not desiderata. I want the deeper requirements that would let us evaluate those candidates: what must any adequate fairness criterion achieve, what trade-offs is it allowed to make, and what would disqualify it from counting as a fairness criterion at all? For each requirement, give the motivating case or consideration that makes it a requirement, and say whether it is non-negotiable or merely a preference of one camp. Then identify which subsets of your desiderata cannot be jointly satisfied given the impossibility results — that is the analytical core of the exercise. Finally, score the major families of criteria (demographic parity, equalized odds, calibration-based views, and any others you think are contenders) against your list, but keep the scoring brief — the weight belongs on the desiderata themselves.
reasoning: |-
  Okay, the user is in a graduate seminar on fairness in machine learning, specifically stuck on the professor's recurring question about what they actually want from a fairness criterion given the impossibility results. They need desiderata—core requirements—not just a list of existing criteria.

  First, I need to unpack their request. They want the fundamental principles that any fairness criterion should meet, considering the constraints from impossibility theorems. The impossibility results show you can't have calibration, equal FPR, and equal FNR all at once when base rates differ and the predictor is imperfect. So, the desiderata must acknowledge these trade-offs.

  The user mentioned they don't have a clear answer, which suggests they need a structured framework to evaluate fairness criteria beyond surface-level definitions. Their deeper need is to understand the philosophical and ethical underpinnings that justify choosing one criterion over another in different contexts.

  I should start by defining what desiderata are: they're not the criteria themselves but the goals those criteria aim to achieve. For example, avoiding harm or ensuring accountability. Each desideratum needs a rationale—why it's important—and whether it's non-negotiable or a preference. 

  Key considerations: 
  - **Non-negotiable vs. contextual**: Some requirements, like non-categorization harm, are essential to prevent discrimination, while others, like allocation efficiency, might depend on the domain (e.g., healthcare vs. lending).
  - **Trade-offs**: The impossibility theorems mean some desiderata conflict. For instance, error rate balance and base rate sensitivity can't both be fully satisfied. I need to map which subsets are incompatible.
  - **Scoring criteria**: Briefly evaluate major approaches (demographic parity, equalized odds, etc.) against the desiderata. Highlight strengths and weaknesses without going too deep.

  Motivating cases for each desideratum are crucial. For example, using the loan approval scenario to show how base rate differences lead to real-world disparities. That makes the abstract concepts concrete.

  I should also consider the user's identity: a grad student needing to articulate a defense in class. They need a comprehensive yet clear framework to structure their arguments. The professor is pushing them to move beyond theory to practical decision-making.

  Potential desiderata:
  1. **Harm Mitigation**: Core to fairness. Preventing discrimination is non-negotiable. Example: Biased hiring tools excluding qualified candidates.
  2. **Contextual Responsiveness**: Fairness isn't one-size-fits-all. Healthcare vs. criminal justice might prioritize different things.
  3. **Base Rate Sensitivity**: Ignoring base rates can lead to absurd outcomes, like equalizing admission rates regardless of qualification.
  4. **Error Rate Balance**: Important where mistakes have asymmetric impacts, like false positives in bail decisions.
  5. **Transparency & Justifiability**: Needed for accountability, especially in regulated domains.
  6. **Allocation Efficiency**: Balancing fairness with utility, but this is contextual.

  For the analytical core, I'll reference the impossibility results. For example, satisfying error rate balance and base rate sensitivity together is impossible when base rates differ—that's the conflict at the heart of the trade-offs.

  Scoring the criteria briefly:
  - **Demographic Parity**: Ignores base rates, so fails there, but simple to implement.
  - **Equalized Odds**: Balances error rates but ignores calibration, which might be problematic in risk assessments.
  - **Calibration**: Matches probabilities but allows different error rates, which can be harmful in high-stakes decisions.

  Finally, I'll emphasize that the choice depends on the context and values involved, which answers the professor's challenge: you have to prioritize based on what's most important for the specific application.
answer: |-
  Here is a systematic framework for evaluating fairness criteria, grounded in ethical and functional imperatives rather than existing statistical definitions. The desiderata are derived from core objectives of fairness, with the impossibility theorems (e.g., Kleinberg, Chouldechova, Barocas-Hardt) as fixed constraints. I distinguish **non-negotiable requirements** (violations undermine fairness) from **contextual priorities** (domain-dependent trade-offs).

  ---

  ### **Desiderata for Algorithmic Fairness Criteria**
  1.  **Harm Mitigation**  
      - **What**: The criterion must prevent *direct, disproportionate harm* to protected groups arising from systematic error disparities (e.g., higher false positives for one group).  
      - **Motivation**: A loan approval system that wrongly denies credit to Group A 5× more often than Group B entrenches economic inequality. Fairness must rectify unjust harm.  
      - **Status**: Non-negotiable. If a criterion permits or exacerbates group-differentiated harm, it fails as fairness.  

  2.  **Contextual Responsiveness**  
      - **What**: The criterion must adapt to the *stakes of the decision* and *societal context* (e.g., criminal justice vs. advertising).  
      - **Motivation**: Equal FPR might be critical in bail decisions (false positives=jail) but irrelevant in movie recommendations. Fairness isn't one-size-fits-all.  
      - **Status**: Non-negotiable. Rigid criteria ignoring context risk irrelevance or harm.  

  3.  **Base Rate Sensitivity**  
      - **What**: The criterion must *acknowledge inherent differences* in outcome prevalence (base rates) across groups when justified (e.g., disease incidence).  
      - **Motivation**: Forcing equal admission rates for two colleges if one attracts more qualified applicants (differing base rates) distorts merit. Ignoring base rates incentivizes "fairness through blindness."  
      - **Status**: Contextual priority. Essential in meritocratic/medical settings; less so if base rates reflect bias.  

  4.  **Error Rate Balance (where consequential)**  
      - **What**: The criterion should control *asymmetric errors* (FPR/FNR) when their impacts differ significantly across groups.  
      - **Motivation**: In criminal sentencing, false positives (innocent jailed) harm marginalized groups more severely. Fairness requires balancing these errors when stakes are high.  
      - **Status**: Contextual priority. Critical for high-stakes decisions; negotiable otherwise.  

  5.  **Transparency & Justifiability**  
      - **What**: The criterion must be *explainable* to stakeholders and *auditable* for compliance.  
      - **Motivation": A "fair" hiring algorithm rejected by HR for opaque reasons undermines trust. Legally (e.g., EU AI Act), fairness must be defensible.  
      - **Status**: Non-negotiable. Uninterpretable criteria lack legitimacy.  

  6.  **Allocation Efficiency**  
      - **What**: The criterion should minimize *avoidable utility loss* (e.g., accuracy, revenue, health outcomes) when trading off fairness.  
      - **Motivation**: A healthcare triage system that sacrifices overall survival rates to meet group parity may harm all groups. Fairness shouldn't demand irrational trade-offs.  
      - **Status**: Contextual priority. Weight varies by domain (critical in resource allocation).  

  ---

  ### **Analytical Core: Conflicts Under Impossibility Constraints**
  The impossibility theorems prove **no criterion can jointly satisfy**:  
  - (A) Calibration (predictions match actual probabilities per group),  
  - (B) Equal FPR,  
  - (C) Equal FNR,  
  ...when base rates differ and the predictor is imperfect.  

  **Desiderata conflicts implied by this**:  
  - **Harm Mitigation + Base Rate Sensitivity + Error Balance** are **incompatible** under differing base rates.  
    - *Example*: If Group A has a higher disease rate (base rate), forcing equal FNR (to avoid harm via missed diagnoses) requires higher FPR for Group A (harming them via false alarms), violating base rate sensitivity.  
  - **Trade-off space**: You can satisfy:  
    - Harm Mitigation + Error Balance (via Equalized Odds) *or*  
    - Harm Mitigation + Base Rate Sensitivity (via Calibration) *or*  
    - Base Rate Sensitivity + Error Balance (impossible—hence the theorem).  

  ---

  ### **Scoring Major Fairness Criteria Against Desiderata**
  | **Criterion**          | Harm Mitigation | Contextual Responsiveness | Base Rate Sensitivity | Error Rate Balance | Transparency | Allocation Efficiency |  
  |-------------------------|-----------------|---------------------------|-----------------------|--------------------|--------------|-----------------------|  
  | **Demographic Parity**  | ⚠️ (Ignores harm from base rates) | ❌ (Assumes equality optimal everywhere) | ❌ (Forces equal rates) | ❌ (Ignores errors) | ✅ (Simple)  | ❌ (Often costly) |  
  | **Equalized Odds**      | ✅ (Balances FPR/FNR) | ⚠️ (Assumes error symmetry matters) | ❌ (Ignores base rates) | ✅ (Core goal)      | ⚠️ (Moderate) | ⚠️ (Accuracy loss possible) |  
  | **Calibration**         | ⚠️ (Allows unequal errors) | ⚠️ (Useful for risk scores) | ✅ (Honors base rates) | ❌ (Ignores errors) | ✅ (Clear)    | ✅ (Maximizes utility) |  
  | **Predictive Parity**   | ⚠️ (Harm depends on FDR/FOR) | ⚠️ (Use-case specific) | ⚠️ (Indirectly) | ❌ | ⚠️ | ✅ |  
  | **Causal Fairness**     | ✅ (Targets root causes) | ✅ (Context-aware) | ✅ (If base rates causal) | ⚠️ | ❌ (Complex) | ❌ (Data-intensive) |  

  **Key**: ✅ = Strong, ⚠️ = Partial/Context-Dependent, ❌ = Weak  

  ---

  ### **Conclusion: What Makes a Criterion "Fair"?**
  - **Non-negotiable**: A fairness criterion must **mitigate harm** (1), be **contextually responsive** (2), and **transparent** (5). Failure here disqualifies it.  
  - **Negotiable trade-offs**: Between **base rate sensitivity** (3), **error balance** (4), and **efficiency** (6). The choice depends on:  
    - *Stakes*: High-impact errors (e.g., jail, loans) demand error balance.  
    - *Base rate justification*: If base rates reflect bias (e.g., historical discrimination), override them; if biological (e.g., disease), honor them.  
  - **The impossibility results formalize a truth**: Fairness requires **deliberate, context-driven prioritization**—not a mathematical universal. Your professor’s question is answered by **specifying which harms matter most in a given domain**.
