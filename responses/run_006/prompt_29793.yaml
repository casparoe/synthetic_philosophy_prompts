answer: |-
  ## The Buck-Passing Impasse: A Dialogue on WKRs

  **Characters:**
  *   **Alex:** Defends the object-given/state-given distinction as sufficient to solve the WKR problem for reductive buck-passing.
  *   **Sam:** Argues the distinction either relies on circularity or undermines the reductive project.

  **(Setting: A philosophy department common room, coffee cups in hand.)**

  **Alex:** Sam, I’ve been wrestling with the WKR problem again. I still think the buck-passer can hold their ground. The key is rigorously distinguishing *object-given* reasons – reasons grounded in features of the very thing the attitude is about – from *state-given* reasons – reasons grounded in the *consequences* of having the attitude itself. WKRs are just state-given reasons masquerading as reasons to value the object. We exclude them; the genuine reasons left define the value.

  **Sam:** Alex, I admire your tenacity, but I think that distinction smuggles in the very evaluative notions we’re trying to analyze reductively. You say object-given reasons are grounded in "features of the object that *make admiration appropriate*" or something similar. But "appropriate" or "fitting" here *just is* the evaluative predicate we’re trying to analyze in terms of reasons! If we need to rely on the concept of the attitude *being fitting* to identify which features provide object-given reasons, we’re going in a circle. We haven’t reduced value; we’ve presupposed it in drawing the distinction.

  **Alex:** That’s a fair push. But I think we *can* characterize object-given reasons neutrally. Take admiration. An object-given reason to admire X is a feature of X that is *constitutive* of admirable things, like remarkable achievements or exceptional character. It’s not that we invoke ‘admirability’ first; we identify features that, in virtue of the *nature* of admiration itself, are its proper grounds. Admiration is an attitude *responsive* to such features. State-given reasons bypass this constitutive link.

  **Sam:** Let’s test that constitutive link with the demon. Suppose a powerful demon threatens to torture everyone unless I admire a saucer of mud. There’s a massive reason *to bring it about* that I admire the mud – the prevention of torture. But intuitively, this isn’t a reason *for* the mud being admirable – it’s the Wrong Kind of Reason to admire it. How does your distinction handle this?

  **Alex:** Precisely. The demon’s threat provides a *state-given* reason: a reason to *bring about the state* of admiring, because of its desirable consequences (avoiding torture). It’s not grounded in any feature *of the mud itself* that makes admiration fitting. The mud lacks the constitutive features admiration tracks.

  **Sam:** But here’s the rub. How is this different from a case where the *evidence* that a feature is present provides a reason? Imagine I see someone smiling warmly, which is evidence they are kind. The smile gives me a reason to admire them *because* it’s evidence of kindness, a genuine object-given reason. The demon’s threat isn’t evidence *about the mud*; it’s a reason *to make myself admire*, period. But can we *state* this difference using *only* reasons-theoretic vocabulary? Your distinction relies on *what the reason is about* – the object vs. the state. But in both the evidence case and the demon case, the reason seems to be *about the state*: one provides evidence the state is fitting, the other provides a desirable consequence of the state existing.

  **Alex:** I see the pressure. But the evidence case is derivative. The reason provided by the smile is *parasitic* on the existence of a *potential* object-given reason (the kindness). If I discovered the smile was fake, the reason vanishes. The smile isn’t intrinsically reason-providing for admiration; it points to a feature that is. The demon’s threat, however, provides a reason *intrinsically* linked to *having the state*, independent of whether the state is fitting. It’s a reason *to cause* admiration, not a reason *manifested by* admiration being a fitting response.

  **Sam:** But doesn’t this "intrinsically linked to having the state" sound suspiciously like you’re invoking the *value* of the state? You’re saying the demon provides a reason *because* bringing about admiration has good consequences (avoiding suffering). But "good" here is the very target of analysis! If we need to identify which states it’s "good" to bring about to distinguish WKRs, we’re relying on an antecedent notion of value, undermining the reduction. The buck-passer wanted to analyze "good" solely in terms of "reasons for pro-attitudes." Now we seem to need "good" to filter the reasons.

  **Alex:** Hmm. Perhaps the buck-passer needs to shift ground slightly, without abandoning the core insight. Maybe the fundamental normative notion isn’t *reasons* simpliciter, but *fittingness*. We analyze value in terms of the *fittingness* of certain attitudes, not directly in terms of reasons *for* those attitudes. WKRs are reasons *to bring about* or *cause* an attitude, but they don’t bear on whether the attitude *fits* its object. The demon gives me a reason to *make myself admire* the mud, but it doesn’t make admiration *fitting* as a response *to the mud itself*. The fittingness relation remains primitive, but value (e.g., admirability) is analyzed as the property of making admiration fitting.

  **Sam:** That’s a significant retreat, Alex! You’ve conceded the initial reductive ambition – analyzing value purely in terms of normative reasons – has failed. Now you’re positing a primitive, unanalyzable normative relation: fittingness. But doesn’t this just relocate the WKR problem? What makes an attitude fitting? If we try to analyze *fittingness* in terms of reasons, we’re back in the same swamp. If we leave it primitive, haven’t we abandoned the core buck-passing motivation – to ground value in something more fundamental and unified (reasons)? Now we have two primitives: reasons and fittingness. Worse, the "reasons for pro-attitudes" analysis of value *has* been abandoned; value is analyzed via fittingness, which we haven’t analyzed in terms of reasons at all. The buck-passer’s original thesis is defunct.

  **Alex:** It’s a strategic retreat, not a surrender of the spirit. The core insight remains: value isn’t a simple, unanalyzable non-natural property. It’s analyzed as a complex property – the property of making certain responses *fitting*. While fittingness might be primitive, it seems more basic and unified than a plethora of distinct value properties. And we haven’t *needed* to invoke any *other* value properties in the analysis. Value (admirability, desirability) is still being explained in normative, but non-evaluative, terms – the fittingness of attitudes. The "reasons for attitudes" language might be best seen as a sometimes-imprecise way of gesturing towards this more fundamental fittingness relation.

  **Sam:** But the specter of circularity doesn’t vanish. How do we know *which* attitudes are the relevant ones for analyzing *which* values? Why is admirability the property that makes *admiration* fitting, rather than, say, desire? Presumably, because admiration is the *appropriate* or *correct* response to the admirable. But "appropriate" or "correct" here seems synonymous with "fitting" – we’re still stuck with a primitive normative relation that must be *matched* to the evaluative property it’s supposed to analyze. And without analyzing fittingness *in terms of reasons*, the original buck-passing reduction is gone. You’ve replaced one primitive (value) with another (fittingness), while conceding that the apparatus of reasons alone couldn’t do the job without smuggling in that primitive. The reductive ambition, as initially conceived, *is* abandoned.

  **Alex:** Perhaps the reduction was always overly ambitious. Maybe the best we can do is show how evaluative concepts like ‘good’ and ‘admirable’ are systematically linked to deontic concepts like ‘reason’ and ‘fittingness’, even if we can’t eliminate one in favor of the other entirely without residue. The object-given/state-given distinction, coupled with a primitive fittingness relation, still gives us a powerful, structured account of value that avoids the pitfalls of simple subjectivism or non-naturalism. It clarifies *why* WKRs are the wrong kind – they don’t bear on fittingness.

  **Sam:** It’s a coherent position, Alex, I’ll grant you that. But it’s a significant departure from the original buck-passing promise of a *reductive analysis of value in terms of reasons*. You’ve traded that promise for a two-pronged primitivism (reasons and fittingness) and a complex property analysis. The WKR problem forced your hand, revealing that reasons alone, without either circularity or a prior notion of fittingness/value, couldn’t bear the full weight. The buck, as it were, couldn’t be passed *all* the way down without hitting bedrock that looks suspiciously value-like. So, no, I don’t think the problem is resolved *within* the strict reductive framework. It requires a fundamental shift.

  **Alex:** ...Perhaps. But I still think the shift is *within* the spirit of understanding value through the normative landscape of responses. The dialogue continues, Sam. The coffee, however, is gone. Another pot?

  **Sam:** (Smiling wryly) Always. The need for caffeine, at least, is a reason we can both recognize as genuine – and of the right kind, I presume? No demons involved.

  **Alex:** (Laughing) Object-given, my friend. Object-given. The caffeine’s chemical properties *warrant* my desire for it. Let’s brew.
