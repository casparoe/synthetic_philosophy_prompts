answer: |-
  ## The Persistent Equation

  We start with Dawkins' cold, bright **gene**,  
  The selfish cipher in the **body**'s thrall.  
  But why then sacrifice for whole **group** needs?  
  A puzzle for the calculus of **fitness**.  
  Williams scorns such tales from higher **level** –  
  Just bookkeeping, not a causal **story**.

  The altruist defies the simple **story**  
  Where benefit accrues to just one **gene**.  
  Sober insists we see another **level**:  
  Cooperation shielding fragile **group**  
  Can lift its mean, complex **fitness**  
  Beyond the cost paid by the giving **body**.

  Does selection sculpt the struggling **body**,  
  Or trace a wider, cooperative **story**?  
  The Price equation splits the **fitness**  
  Gain – part particle, the drifting **gene**,  
  Part pattern woven through the social **group**,  
  A formal dance on every **level**.

  Is there a fundamental, truest **level**?  
  The replicator? Vehicle? The **body**  
  As transient home? Or stable **group**  
  That crafts a lasting, shared survival **story**?  
  The "selfish" metaphor belies the **gene**'s  
  Dependence on the holist **fitness**.

  What measures ultimate, inclusive **fitness**?  
  The gaze shifts, dizzying, through **level**  
  After **level**. Can the lonely **gene**  
  Explain the ant that dies for queen and **body**  
  Colony? Or is that grander **story**  
  Told only where selection binds the **group**?

  Revivalists reclaim the choosing **group**  
  As crucible where net **fitness**  
  Emerges. Not just metaphor's **story**,  
  But cause located at that **level**.  
  The cost extracted from the individual **body**  
  Feeds the whole – a challenge to the **gene**.

  The **gene**'s-eye view; the struggling **body**'s plight;  
  The **group**'s cohesion; shifting scales of **fitness** –  
  Each **level** spins its partial, vital **story**.

  **(Envoi)**

  No single **level** claims the causal **story**;  
  The **gene**, the **group**, the sacrificial **body**  
  See **fitness** shift – one process, endless **story**.

  ---

  **Notes on Execution:**

  1.  **End-Word Selection & Justification:**
      *   `gene`: Central to Dawkins; the replicator unit.
      *   `body`: The classic "vehicle" or individual organism level.
      *   `group`: Focus of the group selection debate/revival.
      *   `fitness`: The core currency of selection, defined differently at different levels (individual, inclusive, group).
      *   `level`: Directly addresses the "units" or hierarchical nature of the debate.
      *   `story`: Captures the narrative framing inherent in causal explanations (genic narrative vs. group selection narrative) and the "bookkeeping" critique. Replaces "perspective" for greater poetic resonance and thematic weight on the *telling* of evolution.

  2.  **Mirroring the Debate in Form:**
      *   **Stanza 1:** Starts Dawkins/genic ("selfish cipher").
      *   **Stanza 2:** Introduces the altruism problem motivating group selection.
      *   **Stanza 3:** Invokes the Price equation ("splits the fitness gain") and the replicator/vehicle distinction.
      *   **Stanza 4:** Poses the fundamental question of the "truest level," highlighting the core tension.
      *   **Stanza 5:** Represents the Sober & Wilson multi-level revival ("Revivalists reclaim the choosing group").
      *   **Stanza 6:** Synthesizes the perspectives, emphasizing the "partial, vital story" each level tells.
      *   **Envoi:** Explicitly denies a single causal level ("No single level claims the causal story"), shows gene/group/body as descriptions of "one process," and ends on "endless story," emphasizing the debate's persistence and the narrative nature of explanation. The vertigo of shifting gaze is implied in "See fitness shift".

  3.  **Accuracy & Conceptual Integration:**
      *   Altruism as motivator for group selection (Stanza 2).
      *   Replicator/Vehicle distinction (Stanza 3: "replicator? Vehicle?").
      *   Formal equivalence (Price equation invoked in Stanza 3, Envoi: "one process").
      *   Different causal narratives ("genic narrative" implied in Stanza 1, "grander story" for group in Stanza 4, "partial, vital story" for each level in Stanza 6).
      *   Bookkeeping critique ("Just bookkeeping..." in Stanza 1, countered by revivalists in Stanza 5).
      *   The core question ("at what level does selection act?") as central theme, shown as ill-posed by the Envoi.

  4.  **Poetic Flow:**
      *   End-words are woven into natural syntax and imagery (e.g., "selfish cipher in the body's thrall," "cooperation shielding fragile group," "dizzying, through level / After level," "spins its partial, vital story").
      *   The rotation creates genuine shifts: Stanza 1 focuses on the gene within the body; Stanza 2 questions this with altruism; Stanza 3 zooms out formally; Stanza 4 questions foundations; Stanza 5 zooms in on group causality; Stanza 6 pulls back to see all levels contributing narratives.
      *   "Story" as the anchor end-word in the Envoi reinforces the central theme of narrative framing.
