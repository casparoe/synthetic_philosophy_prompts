      - 1:40-2:10: Debrief (30) -> total 120 minutes.

      But note: the debrief is critical. So we might go over a bit.

  11. **What the Activity Leaves Out:**
      - In the MU-puzzle, the invariant is relatively simple and the jump is to a very basic mathematical concept (modular arithmetic). In Gödel's theorem, the jump is to a meta-system that can encode self-referential statements and talk about provability. This requires a much more elaborate encoding (Gödel numbering).
      - The MU-puzzle only shows that one particular string cannot be derived. Gödel's theorem shows that for any consistent and sufficiently powerful system, there will always be such unprovable statements.
      - The activity doesn't capture the idea of self-reference, which is central to Gödel's proof.

      In the debrief, you can mention these points and bridge the gap: "In this puzzle, we saw that reasoning about the system from outside let us prove something impossible. Gödel did something similar but much more profound: he turned the system's own language against itself to create a statement that says 'I am unprovable'. And then showed that if the system is consistent, this statement must be true but unprovable."

