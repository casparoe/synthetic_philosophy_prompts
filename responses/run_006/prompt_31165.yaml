  We are given a task to create a reusable decision procedure for the tenants' union committee to evaluate proposed single-winner voting methods. The procedure must address four points and handle hard cases. We then apply the procedure to three methods: Instant-Runoff Voting (IRV), Borda Count, and Approval Voting.

  The Gibbard-Satterthwaite (GS) theorem states that for any ordinal, deterministic, single-winner voting rule with at least three possible outcomes (candidates), and which is not a dictatorship, it is impossible to have both strategy-proofness (voters cannot benefit by misrepresenting their preferences) and universal domain (every possible preference ordering is allowed). The theorem applies to social choice functions that are surjective (every candidate can win) and defined for every possible preference profile.

  The decision procedure:

  1. **Check Applicability of GS Theorem**:
     - Is the method ordinal? (i.e., only the ranking of candidates matters, not cardinal intensities)
     - Is it deterministic? (the winner is uniquely determined from the ballots, though ties may occur; if ties are broken by a fixed rule, then it is deterministic)
     - Is it single-winner? (only one winner is chosen)
     - Are there at least three possible outcomes (candidates)? (if the election has at least three candidates, then the condition holds; if the election has only one or two candidates, the theorem does not apply because there are not three outcomes. However, note that the rule must be defined for at least three outcomes even if in a particular election there are fewer. But typically, the theorem requires at least three outcomes in the entire set of possible outcomes. So if the rule is designed for at least three candidates, even if in a particular instance there are two, the theorem still applies to the rule in general. We assume the rule is intended for elections with at least three candidates. If the rule is intended for any number of candidates, then we consider the case with at least three. But note: if the rule is only used for two candidates, then the theorem does not apply. However, the problem states that the committee holds elections for officers and other issues, and it is implied that there are often more than two candidates. We assume the rule is being considered for elections with at least three candidates.)

     However, note that the GS theorem requires the rule to be defined for at least three outcomes and to be surjective (each candidate must be able to win in some profile). Also, the domain must be unrestricted (any strict preference ordering is allowed). If the method restricts the domain (e.g., requires complete rankings) then the GS theorem still applies as long as the domain is sufficiently rich. But note: the theorem requires the social choice function to be defined for every possible strict preference profile (over at least three alternatives). If the method does not allow voters to express every strict ordering (for example, if it requires complete rankings but does not allow ties, then every strict ordering is allowed) then the domain condition is met. However, if the method allows for incomplete preferences (truncation) or ties, then the domain is expanded to include weak orders, and the GS theorem in its classic form (which assumes strict preferences) does not directly apply. But there are extensions to weak orders.

     However, the classic GS theorem assumes strict preferences. If the method allows for weak preferences (ties) or truncated ballots, then we may be outside the classic GS framework. But note: the theorem can be extended to some cases with weak orders, but it is more complex. We will consider the method as defined for a domain that includes strict preferences (which is a subset of weak orders) and then note if the method also allows more.

     Steps for point 1:
     - If the method is cardinal (like score voting) then GS does not apply because it is not ordinal.
     - If the method is not deterministic (e.g., random tie-breaking) then note that the theorem requires the rule to be deterministic? Actually, the classic GS theorem is for deterministic rules. If there is randomness, then it is a probabilistic rule and the theorem does not apply. But note: tie-breaking by a fixed rule (like alphabetical order) is deterministic. So we consider the rule deterministic if ties are broken by a predetermined, fixed rule.
     - If the method does not have at least three outcomes (i.e., if the rule is only defined for two candidates, but we are considering it for three or more, then it does have at least three outcomes) then the theorem applies. But if the rule is only defined for two candidates and we are using it for two, then the theorem does not apply. However, the problem states that the rule is for single-winner elections and we are to consider it for officer elections which we assume have at least three candidates.

     So for a given method and a given election (with at least three candidates) we check:
     - Ordinal: yes if only the order of candidates matters (like in ranked methods) and no if it uses cardinal information (like scores or approvals, which are not ordinal because the same ranking can be represented in multiple ways but with different scores).
     - Deterministic: yes if the rule always produces a unique winner (with a fixed tie-breaking rule) for any ballot profile.
     - Single-winner: yes.
     - At least three outcomes: yes (because there are at least three candidates).

     If all these are true, then the GS theorem applies. Otherwise, we note which condition fails.

  2. **Conclusion when GS applies**:
     - The theorem forces that the method is either a dictatorship (which we are not considering) or it is manipulable. That is, there exists at least one situation (a profile of other votes) in which at least one voter can benefit by misrepresenting their true preferences (i.e., by voting strategically).

  3. **When GS does not apply**:
     - We must check whether the failed assumption actually protects from manipulation or just moves it. For example, if the method is not ordinal (like approval or score voting) then the GS theorem does not apply, but these methods are still manipulable (just in a different way). Similarly, if the method allows truncated ballots, then voters might manipulate by truncating (which is a form of dishonesty). So the absence of an assumption does not necessarily mean strategy-proofness.

  4. **Specific distortions**:
     - We must identify the kinds of strategic voting the method invites. Common strategies:
       * Burying: In ranked methods, ranking a strong opponent lower than one's true preference to help a more preferred candidate.
       * Compromising: Voting for a less preferred but more viable candidate to prevent an even worse outcome.
       * Pushover: In IRV, ranking a weak candidate high to create a situation that helps the favorite in a later round.
       * Truncation: Not ranking all candidates to avoid helping some of them.
       * Insincere ties: Expressing equal preference when there is a strict preference to avoid helping a candidate.
       * Strategic scoring: In cardinal methods, giving a candidate a score that does not reflect true intensity to help or hurt that candidate.

     We must express these in concrete guidance.

  Hard cases:
  - Methods that permit tied rankings or truncated ballots: We note that the classic GS theorem assumes strict preferences. If the method allows weak orders, then there might be more ways to manipulate (like insincere ties) but the theorem does not directly cover that. However, the method may still be manipulable.
  - Elections where the candidate set is not fixed: This is unusual and might break the standard setup. But we assume the candidate set is fixed for the election.
  - Small electorate and open secrets: The GS theorem is about the existence of a manipulation in some profile. Even in small electorates, the theorem applies. But note: in practice, with known preferences, the strategic behavior might be more predictable.

  Now, we run the procedure on the three methods:

  **1. Instant-Runoff Voting (IRV)**:
     - Ordinal: Yes, because it uses ranked ballots and the order matters.
     - Deterministic: Yes, with a fixed tie-breaking rule (e.g., eliminate the candidate with the lowest rank in the first round, and if tie in the elimination, use a fixed rule like alphabetical order).
     - Single-winner: Yes.
     - At least three outcomes: Yes (assumed at least three candidates).

     Therefore, the GS theorem applies.

     Conclusion: IRV is susceptible to strategic voting. There are situations where a voter can change the outcome in their favor by misrepresenting their preferences.

     Specific distortions:
     - Burying: A voter might rank a strong candidate lower to get them eliminated earlier.
     - Compromising: A voter might not rank their true favorite first if they think that candidate cannot win, and instead rank a viable candidate first.
     - Pushover: A voter might rank a weak candidate first to create a situation where that candidate is eliminated and their second choice then gets that candidate's votes and can beat a strong opponent.

     Concrete guidance: Voters in IRV may need to consider the viability of candidates and might not be able to honestly rank their favorite first if they believe that candidate is not popular. They might also try to manipulate the elimination order by ranking candidates insincerely.

  **2. Borda Count**:
     - Ordinal: Yes, because the Borda count assigns points based on the rank of each candidate. However, note: the same ranking always gives the same points, so it is ordinal? Actually, the Borda count is an ordinal method because it only uses the ranking (not cardinal utilities). But note: the GS theorem applies to ordinal methods that only use the order, even though the Borda count aggregates the ranks. So the method is ordinal and deterministic.
     - Deterministic: Yes, the candidate with the highest total score wins (with a fixed tie-breaking rule).
     - Single-winner: Yes.
     - At least three outcomes: Yes.

     Therefore, the GS theorem applies.

     Conclusion: Borda count is susceptible to strategic voting.

     Specific distortions:
     - Burying: A voter might rank a strong opponent last (or as low as possible) to reduce their score.
     - Compromising: A voter might rank a less preferred but viable candidate higher than their true preference to help that candidate win.
     - Truncation: If the method allows incomplete rankings, a voter might not rank all candidates to avoid giving points to candidates they don't like. But in the standard Borda, if the ballot requires a complete ranking, truncation is not allowed. However, if the method allows truncated ballots, then truncation is a form of strategy.

     Concrete guidance: Voters in Borda might be tempted to rank candidates they perceive as threats lower than they truly deserve and to elevate candidates that are more viable but not their top choice.

  **3. Approval Voting**:
     - Ordinal: No. Approval voting is a cardinal method because voters do not rank candidates but instead indicate approval for each candidate (binary: approve or not). The same voter's preferences can be represented in different ways (e.g., approving only the top candidate or approving several) so it does not rely solely on the order. Therefore, the GS theorem does not apply because it is not ordinal.

     However, we must check the other conditions for completeness:
     - Deterministic: Yes, the candidate with the most approvals wins (with a fixed tie-breaking rule).
     - Single-winner: Yes.
     - At least three outcomes: Yes.

     Since it is not ordinal, the GS theorem does not apply.

     Now, does the failed assumption (not ordinal) protect us from manipulation? No. Approval voting is known to be vulnerable to strategic voting. The manipulation takes the form of setting an approval threshold insincerely. For example:
     - A voter might "bullet vote" (approve only their favorite) if they think their favorite is viable, to avoid helping a less preferred candidate.
     - Or, a voter might approve a candidate they do not like as much to prevent a worse candidate from winning (compromising) but in approval, this is done by including that candidate in the approval set.

     Specific distortions:
     - Insincere approval threshold: Voters have to decide where to draw the line of approval. They might not approve a candidate they moderately like in order to help their favorite (if they think the moderate candidate is a threat to the favorite) or they might approve a candidate they moderately dislike to prevent a candidate they strongly dislike.

     Concrete guidance: Voters in approval voting must strategically decide which candidates to approve, and they may not approve all candidates they prefer over the likely winner. They might also approve candidates they don't truly support to block a worse candidate.

  **Summary for the Committee**:

  For each method:

  - **IRV**: The GS theorem applies. It is manipulable. Watch for burying, compromising, and pushover strategies.
  - **Borda**: The GS theorem applies. It is manipulable. Watch for burying and compromising.
  - **Approval**: The GS theorem does not apply (because it is not ordinal). However, it is still manipulable. The manipulation comes from setting the approval threshold insincerely.

  The procedure tells us that all three methods are vulnerable to strategic voting, though the nature of the manipulation differs. The theorem does not say that any of these methods are entirely without merit, but it does force us to acknowledge that they are not strategy-proof.

  Additionally, note that the GS theorem does not provide a complete theory of fair elections. It only addresses the inevitability of strategic voting. Other criteria (like Condorcet consistency, monotonicity, etc.) are also important.

  Finally, we note that in small electorates where preferences are known, strategic voting might be more prevalent and easier to compute. But the GS theorem's existence result holds regardless of the electorate size.
answer: |-
  ### Reusable Decision Procedure for Evaluating Voting Methods

  Below is a step-by-step procedure grounded in the Gibbard-Satterthwaite (GS) theorem and strategy-proofness research. It evaluates any proposed single-winner voting method for your tenants' union elections. The procedure answers your four requirements and handles hard cases (e.g., tied rankings, truncated ballots, non-fixed candidate sets, small electorates with known preferences). Each step includes concrete guidance for lay committee members.

  ---

  #### **Step 1: Check Applicability of Gibbard-Satterthwaite**  
  *Goal: Determine if GS applies and which condition fails if not.*  
  - **1.1. Is the method ordinal?**  
    - *Definition:* Only the **order** of candidates matters (e.g., rankings). Cardinal information (e.g., scores, approval thresholds) is ignored.  
    - *Test:* If the ballot allows voters to express intensity (e.g., scores) or binary approvals, it fails.  
    - *Lay Guidance:* "Does the ballot ask voters to rank candidates (A>B>C) or to rate them (e.g., A=10, B=7, C=0)?"  

  - **1.2. Is the method deterministic?**  
    - *Definition:* The winner is uniquely determined from ballots (e.g., fixed tie-breaking rules like "alphabetical order" are allowed).  
    - *Test:* If winners are randomly selected (e.g., lottery systems) or ties are resolved by unpredictable means, it fails.  
    - *Lay Guidance:* "Is there a clear, automatic rule to pick a single winner, even if votes are tied?"  

  - **1.3. Is it single-winner?**  
    - *Definition:* Exactly one candidate wins.  
    - *Test:* If the method can produce multiple winners (e.g., multi-seat elections), it fails.  
    - *Lay Guidance:* "Does the election always choose one person/option?"  

  - **1.4. Are there ≥3 possible outcomes?**  
    - *Definition:* At least three distinct candidates can win under different vote profiles.  
    - *Test:* If the candidate set is fixed and has <3 options, GS fails. If candidates can be added/removed dynamically, assume ≥3 unless proven otherwise.  
    - *Lay Guidance:* "Could there ever be three or more candidates/choices on the ballot?"  

  - **Conclusion for Step 1:**  
    - If **all conditions hold (ordinal, deterministic, single-winner, ≥3 outcomes)**, GS applies → Proceed to Step 2.  
    - If **any condition fails**, GS does not apply → Note which condition(s) failed and proceed to Step 3.  

  ---

  #### **Step 2: Conclusion When GS Applies**  
  *Goal: State what GS forces about honesty and manipulation.*  
  - **2.1. GS Theorem Conclusion:**  
    - The method **cannot be strategy-proof** (i.e., immune to tactical voting).  
    - There will always be scenarios where a voter can achieve a better outcome by lying about their preferences.  
    - *Lay Guidance:* "This method is mathematically guaranteed to allow cheating in some elections. No matter how you design it, voters will sometimes gain by voting dishonestly."  

  ---

  #### **Step 3: Analysis When GS Does Not Apply**  
  *Goal: Determine if the failed assumption prevents manipulation or shifts it elsewhere.*  
  - **3.1. Ordinal Condition Fails (e.g., cardinal methods):**  
    - Manipulation **shifts to strategic expression of intensity** (e.g., exaggerating scores, adjusting approval thresholds).  
    - *Lay Guidance:* "Voters can’t cheat by changing rankings, but they’ll cheat by changing ratings (e.g., scoring a candidate lower to hurt them)."  

  - **3.2. Deterministic Condition Fails (e.g., random tie-breakers):**  
    - Manipulation **shifts to exploiting randomness** (e.g., voting to force a tie, hoping randomness favors them).  
    - *Lay Guidance:* "Voters might try to engineer ties to ‘gamble’ on a better outcome."  

  - **3.3. Single-Winner or <3 Outcomes Fail:**  
    - GS does not apply, but manipulation may still exist in simpler forms (e.g., strategic voting in 2-candidate races).  
    - *Lay Guidance:* "Cheating might still happen, but it’s not covered by the theorem."  

  ---

  #### **Step 4: Identify Specific Distortions**  
  *Goal: List tactical behaviors the method invites, with concrete voter guidance.*  
  - **4.1. Common Distortions (see table below)**  
    - *Burying:* Ranking a strong rival lower than true preference to help a preferred candidate.  
    - *Compromising:* Boosting a less-preferred but viable candidate to avoid a worse outcome.  
    - *Pushover:* Ranking a weak candidate high to manipulate elimination order (IRV-specific).  
    - *Truncation:* Not ranking candidates below a certain point to avoid influencing later choices.  
    - *Insincere Thresholds (approval/score):* Approving/scoring a candidate higher/lower than true preference to manipulate outcomes.  

  | Distortion       | Likely When?               | Voter Guidance (What to Watch For)                          |  
  |------------------|----------------------------|-----------------------------------------------------------|  
  | **Burying**      | Ranked methods (e.g., Borda) | "Voters demote strong rivals to help their favorite."     |  
  | **Compromising** | Most non-plurality methods  | "Voters abandon their true favorite to support a ‘lesser evil’." |  
  | **Pushover**     | IRV                         | "Voters rank weak candidates high to rig the elimination order." |  
  | **Truncation**   | Methods allowing incomplete ballots | "Voters stop ranking after their favorite to avoid helping others." |  
  | **Insincere Thresholds** | Approval/Score        | "Voters approve candidates they dislike to block worse ones, or withhold approval from liked candidates to help their favorite." |  

  - **4.2. Hard Cases:**  
    - **Tied Rankings/Truncation:** Permitting ties/truncation expands strategic options (e.g., insincere ties to avoid helping a candidate).  
      *Lay Guidance:* "Allowing ties/truncation lets voters ‘half-lie’ by not fully ranking candidates."  
    - **Non-Fixed Candidate Set:** If candidates join/leave late, manipulation increases (e.g., burying newcomers).  
      *Lay Guidance:* "Voters may cheat if candidates change mid-election."  
    - **Small Electorates with Known Preferences:** GS still applies, but manipulation becomes predictable (e.g., voters collude based on known alliances).  
      *Lay Guidance:* "In small groups, voters can precisely calculate how to cheat."  

  ---

  ### Application to Proposed Methods  
  *Assumptions:*  
  - Elections have ≥3 candidates (e.g., officer elections with multiple nominees).  
  - Tie-breaking is deterministic (e.g., alphabetical order).  
  - Voters may have any preference order (universal domain).  

  #### **1. Instant-Runoff Voting (IRV)**  
  - **Step 1 (GS Applicability):**  
    - Ordinal? **Yes** (ranked ballots).  
    - Deterministic? **Yes** (eliminates lowest-ranked candidates sequentially).  
    - Single-winner? **Yes**.  
    - ≥3 outcomes? **Yes**.  
    → **GS applies.**  
  - **Step 2 (GS Conclusion):**  
    - **Manipulation is inevitable.** Voters can sometimes achieve better outcomes by lying.  
  - **Step 4 (Distortions):**  
    - **Pushover:** Voters rank weak candidates high to eliminate centrists early.  
      *Example:* A voter ranks a spoiler candidate #1 to get their moderate rival eliminated, helping their true favorite win.  
    - **Burying/Compromising:** Voters demote strong rivals or compromise on moderates.  
    - **Truncation:** Voters omit lower rankings to avoid helping disliked candidates.  
    - *Lay Guidance:* "IRV lets voters rig eliminations by ranking candidates insincerely. Watch for ‘pushover’ tactics where weak candidates get artificial support."  

  #### **2. Borda Count**  
  - **Step 1 (GS Applicability):**  
    - Ordinal? **Yes** (ranked ballots, points assigned by rank).  
    - Deterministic? **Yes** (highest points wins).  
    - Single-winner? **Yes**.  
    - ≥3 outcomes? **Yes**.  
    → **GS applies.**  
  - **Step 2 (GS Conclusion):**  
    - **Manipulation is inevitable.** Voters can sometimes achieve better outcomes by lying.  
  - **Step 4 (Distortions):**  
    - **Burying:** Voters rank strong rivals last to minimize their points.  
      *Example:* A voter ranks a popular rival at the bottom, even if they moderately like them, to help their preferred candidate win.  
    - **Compromising:** Voters boost moderate candidates to avoid polarized outcomes.  
    - *Lay Guidance:* "Borda encourages voters to bury strong opponents. The claim it ‘rewards consensus’ is misleading—it rewards strategic dishonesty."  

  #### **3. Approval Voting**  
  - **Step 1 (GS Applicability):**  
    - Ordinal? **No** (voters approve/disapprove each candidate; no rankings).  
    → **GS does not apply.**  
  - **Step 3 (Why GS Fails & Implications):**  
    - Failed assumption: **Not ordinal** (uses cardinal approvals).  
    - Does this prevent manipulation? **No—it shifts it.** Voters manipulate by setting insincere approval thresholds.  
      *Example:* A voter with preferences A>B>C might only approve A ("bullet voting") if B is a threat to A, or approve A and B to block C.  
  - **Step 4 (Distortions):**  
    - **Insincere Thresholds:** Voters approve candidates they dislike to block worse ones, or withhold approval from liked candidates to boost their favorite.  
    - *Lay Guidance:* "Approval lets voters cheat by misrepresenting their approval cutoff. A voter might ‘over-approve’ a moderate to stop a rival or ‘under-approve’ to help their favorite."  

  ---

  ### Key Takeaways for the Committee  
  1. **All three methods fail strategy-proofness:**  
     - IRV and Borda are **vulnerable per GS theorem** (manipulation guaranteed).  
     - Approval avoids GS but **shifts manipulation to threshold dishonesty**.  

  2. **No method is "safe" from strategy:**  
     - The theorem cannot decide which method is "fairest"—it only confirms all are manipulable.  
     - Trade-offs exist:  
       - IRV avoids vote-splitting but invites pushover/burying.  
       - Borda claims to reward consensus but invites burying.  
       - Approval is simple but invites threshold games.  

  3. **Recommendation strategy:**  
     - **Plain-language defense:** Explain distortions using the voter guidance above (e.g., "Borda encourages burying strong opponents").  
     - **Highlight non-GS factors:** Discuss other priorities (simplicity, Condorcet efficiency, resistance to specific distortions).  
     - **Emphasize GS limitations:** The theorem doesn’t address proportionality, monotonicity, or real-world frequency of manipulation—it only proves dishonesty *can* occur.  

  This procedure ensures your committee can rigorously evaluate any proposal in ≤1 week, even without social choice expertise. It confronts uncomfortable truths (e.g., Borda’s burial vulnerability) while clarifying what the theorem *cannot* resolve (e.g., which method is "least manipulable" in practice).
