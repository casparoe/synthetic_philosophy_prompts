  In my Leibniz seminar there's a guy who answers every objection to his theodicy with 'best of all possible worlds', as if that settles the matter. Last week I asked whether God couldn't have made a world with all the same goods but slightly less childhood leukaemia, and he just repeated the phrase, slower. I want to come to the next session with a proper breakdown of the different precise claims that slogan could be making, from the boring ones to the wild ones, and for each say wether it's trivial, substantive, or just false, and whether it would actually answer my leukaemia question or just change the subject. Could you write that out for me as continuous prose, like an email, with no headings, bullet points, bold text or tables.
