answer: |-
  Here’s a reusable editorial decision procedure for framing classification changes in medicine/psychiatry, designed for journalistic use under tight deadlines. It prioritizes pragmatic thresholds over philosophical purity.

  **Classification Framing Decision Procedure**  
  *For science journalists assessing medical/psychiatric classification changes*

  **Step 1: Establish Baseline Legitimacy**  
  *Question:* Is this change endorsed by a major professional body (e.g., APA, WHO) or published in a canonical reference (e.g., DSM, ICD)?  
  - *Sufficient answer:* Official documentation of approval/publication.  
  - *Stop if "No":* Frame as **controversy/advocacy** (not yet institutionalized).  
  - *Proceed if "Yes"* → Go to Step 2.

  **Step 2: Identify Primary Driver**  
  *Question:* Was the change primarily driven by (a) new reproducible evidence, or (b) advocacy/policy concerns?  
  - *Sufficient answer:* Authoritative source (e.g., committee report, white paper) stating rationale.  
  - *Stop if clear (a):* Temporary **discovery framing** (proceed to Step 3 to stress-test).  
  - *Stop if clear (b):* **Decision-and-values framing**.  
  - *Unclear/contested* → Go to Step 3.

  **Step 3: Check Mechanistic Consensus**  
  *Question:* Is there a documented, replicable biomarker, pathological process, or deviation from species-typical functioning?  
  - *Sufficient answer:* Systematic review/meta-analysis establishing mechanism, OR animal model with face validity.  
  - *Stop if "Yes" + uncontested*: **Discovery framing** (emphasize biological evidence).  
  - *Stop if "No" or heavily contested*: **Decision-and-values framing** (note biological ambiguity).  
  - *Mixed/developing* → Go to Step 4.

  **Step 4: Assess Harm Threshold**  
  *Question:* Is the associated harm (mortality, morbidity, functional impairment) consistent across cultures/settings without medicalization?  
  - *Sufficient answer:* WHO Global Burden of Disease data or multi-country cohort studies.  
  - *Stop if "Yes"**: Discovery framing** (harm as objective anchor).  
  - *Stop if "No" (harm context-dependent)*: **Decision-and-values framing** (note cultural relativity).  
  - *Insufficient data* → Go to Step 5.  
  *(Judgement call warning: "Harm" definitions involve norms)*

  **Step 5: Evaluate Evidence Robustness**  
  *Question:* Is the evidence base dominated by (a) controlled studies, or (b) clinical surveys/stakeholder input?  
  - *Sufficient answer:* >70% of cited evidence in classification docs falls clearly into (a) or (b).  
  - *Stop if (a)**: Lean discovery framing** (qualify with Step 3/4 limitations).  
  - *Stop if (b)**: Lean decision-and-values framing**.  
  - *50/50 or unclear* → **Declare evidentiary stalemate** (frame as "expert disagreement").

  **Step 6: Gatekeeper Check (For Removal/Normalization Cases)**  
  *Question (Only for retiring diagnoses):* Does the condition show persistent diagnostic reliability (kappa >0.6) OR iatrogenic harm (e.g., overtreatment)?  
  - *Sufficient answer:* Reliability studies or iatrogenic harm data from clinical registries.  
  - *Stop if "No" to both**: Discovery framing** ("science evolved").  
  - *Stop if "Yes" to either**: Decision-and-values framing** ("pragmatic trade-off").

  **Step 7: Stakeholder Pressure Test**  
  *Question:* Are major patient groups/payors actively lobbying for/against this change?  
  - *Sufficient answer:* Public position papers from 3+ major advocacy groups/payors.  
  - *Never stops procedure:* Overlay findings onto prior conclusion (e.g., "Despite advocacy pressure, evidence shows..." OR "Values debate amplified by stakeholder campaigns").

  ---

  **Application to Cases**  

  **Case A: New diagnosis with disputed biomarkers (e.g., Long COVID in early ICD-11)**  
  - Step 1: *Yes* (ICD-11 inclusion)  
  - Step 2: *Mixed* (Some evidence + advocacy) → Step 3  
  - Step 3: *Contested biomarkers* → **Decision-and-values framing**  
  - *Weight carried by:* Step 3 (mechanistic ambiguity forces values acknowledgment)

  **Case B: Removing diagnosis as normal variation (e.g., proposed removal of "Gender Identity Disorder")**  
  - Step 1: *Yes* (DSM-5 change)  
  - Step 2: *Primarily (b) advocacy* → **Decision-and-values framing**  
  - *Weight carried by:* Step 2 (driver analysis suffices)  
  - *Editorial resistance likely:* Framing emphasizes values despite institutional endorsement.

  **Case C: Patient campaign for disease status (e.g., chronic fatigue syndrome/ME)**  
  - Step 1: *No* (hypothetical: not yet in manuals) → **Controversy/advocacy framing**  
  - Step 3: *Mixed biomarkers* → Would lean decision framing  
  - Step 4: *Harm inconsistent* (varies by disability support systems) → **Decision-and-values framing**  
  - *Where verdict declined:* Step 4 (insufficient harm universality flags normative element)

  ---

  **What This Procedure Cannot Do**  
  1. **Resolve philosophical disputes:** It flags *when* values are in play but can’t adjudicate if naturalism/normativism is "correct."  
  2. **Override power dynamics:** Professional bodies' decisions may reflect authority, not truth—procedure notes this but can’t neutralize it.  
  3. **Handle frontier science:** Emergent fields (e.g., microbiome research) may lack "sufficient" evidence but still warrant coverage.  
  4. **Eliminate journalist bias:** Choosing sources for Steps 3-5 involves curation (e.g., which meta-analysis to trust).  
  5. **Predict consequences:** How framing impacts stigma/funding is context-dependent and unrecoverable from documents.

  **Procedure's Edge:** Forces explicit justification when defaulting to "science settled" framing. Most defensible when highlighting *why* evidence meets or fails operational thresholds under deadline pressure.
