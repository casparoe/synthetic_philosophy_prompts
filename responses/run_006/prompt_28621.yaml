  "Scientists setting up camera traps in a vast rainforest to find a rare animal. After years of monitoring, they have not detected the animal. This null result suggests the animal is rare or avoids the traps, but not that it doesn't exist. However, if they had covered a large fraction of the forest with sensitive traps and still found nothing, that would be stronger evidence of absence."

  But note: we haven't covered a large fraction of the galaxy.

  Alternatively, for the Fermi paradox, we might expect that advanced civilizations would be visible across the galaxy (e.g., by colonizing it or emitting strong signals). So:

