  Given the above, we'll go with:

  better_analogy: "A team of astronomers using the best available telescopes to search for city lights on planets in our galaxy. They see no such lights. This could be because there are no alien cities, or because the cities are too small or use different technology, or because the telescopes aren't sensitive enough. The null result is not proof of absence, but it does provide some evidence that galaxy-spanning civilizations with conspicuous energy usage are rare."

