  Group A and Group B must fill out the form together. They cannot agree on the numbers.

  **Resolution:** They realize that Group B can answer the question "How many holes are in the cheese?" by saying "There are 10 cavities." And Group A can agree that there are 10 cavities. They can then put for the hole count: 10 cavities. But the form says "holes", not "cavities". 

