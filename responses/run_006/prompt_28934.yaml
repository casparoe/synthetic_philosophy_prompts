  Alternatively, they might try to redefine 'hole'. But the grant committee might not accept that.

  They then see that the dispute is about the word 'hole'. They can then propose to the committee to clarify the term? But the exercise is about them reaching an agreement on the form.

  **Translation:** 
  Group A and Group B can agree that there are 10 cavities. But the form says 'holes'. However, if they can convince the instructor (acting as the grant committee) that by 'holes' they mean cavities, then they can both sign off on "10" for Q2. But then Q1 is still in dispute.

  For Q1, they might agree to list the number of physical objects in the exhibit (excluding holes) as 1, and then in an addendum note that there are 10 cavities. But the form doesn't have an addendum.

  This might be messy.

  **Exercise: The Repair Budget for a Wall with Holes**

  A better scenario: A building has a wall with 10 bullet holes. The university is allocating funds for repairs. The repair cost depends on the number of holes (each hole costs $100 to fix). But also, the facilities department has a policy: if there are more than 10 objects in the room, they must do an expensive safety inspection ($500) before any repairs.

