  - Group A (Hole-Counters): There are 11 objects (the wall and 10 holes), so safety inspection is needed. Plus 10 holes to repair -> total cost $500 + $1000 = $1500.
  - Group B (Hole-Deniers): There is 1 object (the wall) and 0 holes. But they see the bullet damage. They might say there are 10 damaged regions. Each damaged region costs $100 to repair. And there is only 1 object, so no safety inspection. Total cost: $1000.

  But the repair policy says: "Each hole must be repaired at $100 per hole." 

  Group B does not believe in holes, so they will not say there are holes. They might say there are 10 damages, but the policy requires counting holes.

  **The Deadlock:** They must agree on a single repair budget request.

  **Resolution:** They realize that they can describe the damage as 10 areas that need repair, and the cost is $100 per area. Then both can agree. Group A can say: "We call those areas 'holes', but you can call them 'damaged regions'." Then they can submit: "10 damaged regions requiring repair at $100 each, total $1000." And for the safety inspection: only if the room has more than 10 objects. Group B says 1 object (the wall), Group A says 11. But if they agree to describe the wall as the only object (and they can say the damages are not objects), then they can avoid the safety inspection.

  This works.

  **Final Exercise Design: The Wall Repair**

  **Setup:**
  - The university's historic wall has been vandalized with 10 bullet holes.
  - Two groups must agree on a repair budget request form to submit to the administration.

  **Roles:**
  - Group A (6-7 students): Represent the "Safety and Objects" committee. They believe:
     - Holes are real objects (immaterial ones).
     - The room contains: the wall (1 object) and 10 holes (10 objects), so 11 objects in total.
  - Group B (6-7 students): Represent the "Materialists" committee. They believe:
     - There are no such things as holes. There is only the wall and its material.
     - The bullet holes are just absences of wall material in 10 regions.
     - So there is only 1 object (the wall) and 0 holes.

  **Rules and Stakes:**
  - The repair cost is $100 per hole (as per university policy). 
  - Additionally, if there are more than 10 objects in the room, a safety inspection is required at a cost of $500.
  - The total cost will be: (number of holes * $100) + (if objects>10, then $500 else $0).
  - They must fill out a form that states:
     - Number of holes to repair: _____
     - Number of objects in the room: _____
     - Total cost: _____
  - They have 20 minutes to agree on the numbers and submit the form. If they do not submit by then, the repair is delayed by a year (which is bad for the historic wall).

  **Materials:**
  - Role cards for Group A and Group B explaining their ontology and the stakes.
  - A budget request form with the three blanks.
  - A picture of a wall with bullet holes (optional).

  **Predicted Timeline (90 minutes total):**

  1. **Introduction (5 minutes):** 
     - Explain the scenario and the two committees. 
     - Assign roles (randomly or by counting off).

  2. **Group Preparation (15 minutes):**
     - Each group meets separately to understand their ontology and strategy. They should plan how to argue for their counts.

  3. **Deliberation (30 minutes):**
     - The two groups meet together to fill out the form. They must reach consensus.
     - The instructor circulates and listens but does not intervene.

  4. **Deadlock and Resolution (10 minutes):**
     - If they are deadlocked, the instructor may prompt: "Can you find a way to translate your counts into the other group's terms?"
     - The resolution should involve them agreeing to use neutral terms: e.g., "10 damaged regions" for the holes, and for objects, they might agree that there is only the wall (if Group A can be persuaded to not count holes as objects for the purpose of the safety inspection rule).

  5. **Debrief (30 minutes):**
     - Discuss what happened. Ask students:
       - What was the initial disagreement about?
       - How did they resolve it?
       - Did the disagreement feel substantive? Why?
       - What was the role of language in the dispute?
     - Then introduce the metaontological concepts:
          - Quantifier variance: The two groups have different criteria for what exists (what the quantifier ranges over).
          - Translation: They found a neutral way to describe the situation that both can accept (the 10 damaged regions).
          - Verbal dispute: The dispute was about the meaning of 'hole' and 'object', not about the physical facts.
          - But also, the dispute had practical consequences (safety inspection cost) that depended on their language choice.
     - Finally, note the limit: In real ontology, we don't have a practical form to fill out. We are seeking the truth about what exists, and it's not clear that a translation deflates the dispute because we care about which language is correct.

  **What Might Go Wrong:**
  - The groups might not engage in the role-play and just argue as themselves.
     - Mitigation: Emphasize the roles and the ontology they must defend.
  - They might resolve too quickly by compromising without a translation.
     - Mitigation: The instructor can remind them of their ontological commitments during the group prep.
  - They might not see the connection to ontology.
     - Mitigation: In the debrief, explicitly map their arguments to the ontological positions.

  **Limit of the Exercise:**
  The exercise makes it seem that any ontological dispute can be resolved by finding a translation. But in real philosophy, some argue that there is a fact of the matter about what exists, and the dispute is not merely verbal. Also, the exercise has a practical resolution, while ontology is often seen as theoretical and not driven by practical concerns. In the closing discussion, you will have to emphasize that in the real debate, the choice of language might be driven by theoretical virtues (simplicity, explanatory power) and not just practical convenience.

  This design should create the experience of a merely verbal dispute and set the stage for your lecture on quantifier variance and its critics.
answer: |-
  Below is a structured role-play exercise designed for your 90-minute undergraduate metaontology seminar. The exercise simulates a "merely verbal" ontological dispute by forcing two groups with rival counting languages to resolve a shared practical problem. I've chosen a **museum inventory and insurance claim scenario** involving a damaged clay statue, as it cleanly maps onto debates about statues/lumps and composite objects while creating tangible stakes.

  ---

  ### **Exercise Title:** *The Claymore Museum Incident*

  #### **Core Dispute**
  - **Group A (Statue-Priority Language):** Recognizes both the statue (*David*) and the lump of clay as distinct entities. The statue exists only when the clay is arranged statue-wise (per its original artistic form). Damage destroying this form annihilates the statue but leaves the lump intact.
  - **Group B (Lump-Priority Language):** Only recognizes the lump of clay as a persistent object. The "statue" is a temporary phase of the lump. Damage only alters the lump’s properties, not its existence.

  #### **Practical Problem**  
  The museum must submit an insurance claim and updated inventory after a leak causes a clay statue (*David*) to deform into an amorphous lump. The insurance payout and inventory accuracy affect the museum’s funding and reputation.  
  - **Insurance Rules:**  
    - Payout for a "destroyed artwork": **$10,000**.  
    - Payout for "damaged base material": **$500** (only if the material isn’t part of an artwork *at the time of damage*).  
    - **Catch:** An object cannot be claimed as *both* an artwork and base material. The insurance form requires unambiguous counts.  
  - **Inventory Rules:**  
    - The post-incident exhibit inventory must list all "artworks" and "base material objects" separately.  
    - The museum’s annual grant requires inventory consistency with insurance claims.  

  #### **Stakes & Pressure**  
  - **No real money**, but groups must submit a **single claim form and inventory** within 20 minutes.  
  - If they fail, the museum loses funding and faces a "reputation penalty" (e.g., mocked in a fictional news headline: "*Claymore Museum Botches Insurance Claim!*").  
  - Groups are **penalized for inconsistency** (e.g., claiming a statue was destroyed in insurance but listing it in the inventory).  

  ---

  ### **Materials Needed**
  1. **Role Cards** (printed for each student):  
     - **Group A (7 students): "Statue Guardians"**  
       *"You defend the Statue-Priority Language:  
       - The statue (David) and the lump are distinct objects.  
       - David exists only when the clay has its original shape.  
       - The leak destroyed David (artwork), leaving only the lump (base material).  
       - **Your goal:** Maximize insurance payout by claiming $10,000 for David’s destruction and $500 for the damaged lump. Ensure the inventory lists only the lump post-incident."*  
     - **Group B (7 students): "Lump Loyalists"**  
       *"You defend the Lump-Priority Language:  
       - Only the lump exists. ‘David’ is just a phase of the lump.  
       - The leak damaged the lump but didn’t destroy it.  
       - **Your goal:** Avoid insurance fraud. Claim $500 for the damaged lump (base material) since it was ‘art’ at the time of damage. Ensure the inventory lists only the lump post-incident."*  
  2. **Insurance Claim Form** (projected or printed):  
     - Number of artworks destroyed: _____  
     - Number of base material objects damaged: _____  
     - Total payout: _____  
  3. **Inventory Form** (projected or printed):  
     - Pre-incident objects: _____ artworks, _____ base materials.  
     - Post-incident objects: _____ artworks, _____ base materials.  
  4. **Timeline Slide** (keeps the exercise on track).  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Setup (10 min)**  
     - Introduce the scenario: *"A leak at the Claymore Museum deformed the statue ‘David’ into a lump. You must settle the insurance claim and inventory."*  
     - Split students into Group A (Statue Guardians) and Group B (Lump Loyalists). Give role cards.  
     - Clarify rules:  
       - They must submit **one set of forms** with consensus.  
       - Inconsistent claims (e.g., claiming a destroyed artwork in insurance but listing it in inventory) void payout.  
       - No "splitting the difference"—answers must reflect their ontology.  

  2. **Group Prep (15 min)**  
     - Groups meet separately to:  
       - Understand their ontology and strategy.  
       - Prepare arguments for their counts (e.g., Group A: *"Two objects existed pre-incident!"*).  
       - Anticipate the other group’s objections.  

  3. **Joint Deliberation (30 min)**  
     - Groups debate to fill out the forms. **Instructor silently observes.**  
     - **Predicted deadlock:**  
       - **Insurance:** Group A demands $10,500 ($10k for David + $500 for lump). Group B insists on $500 (only lump damaged).  
       - **Inventory:** Both agree post-incident has no statue, but Group A lists "1 base material," while Group B lists "1 lump (base material)."  
       - **Key conflict:** Group A sees two pre-incident objects (statue + lump); Group B sees one (lump). This blocks consensus on insurance destruction counts.  
     - **Pressure:** Announce time warnings (e.g., *"10 minutes left—reputation penalty imminent!"*).  

  4. **Forced Translation & Resolution (15 min)**  
     - If deadlocked, intervene: *"Propose a joint statement translating your claims into the other group’s language."*  
     - **Predicted resolution:** Students realize:  
       - Group A can say: *"In your language, we’re claiming $10,000 for the destruction of the statue-phase."*  
       - Group B can say: *"In your language, we’re denying the statue existed separately."*  
       - They compromise by redefining terms:  
         - **Insurance:** *"One artwork phase destroyed: $10,000"* (satisfies A as statue-destruction; satisfies B as phase-change of the lump).  
         - **Inventory:** *"Pre-incident: one object (lump) in artwork phase. Post-incident: one object (lump) in base material phase."*  

  5. **Debrief (20 min)**  
     - **Guided discussion (without naming metaontology concepts yet):**  
       - *"What caused the deadlock? Was it about facts (e.g., the clay’s state) or something else?"*  
       → Students note: Dispute was about *what counts as an object*, not clay/water.  
       - *"Did the resolution feel satisfying? Why/why not?"*  
       → Students admit the compromise "works" but feels ontologically uneasy.  
       - *"Would this dispute matter if not for the insurance forms?"*  
       → Highlights that practical stakes made language choices urgent.  
     - **Map to Metaontology (5 min):**  
       - Reveal this mirrors **quantifier variance**: Both languages are coherent, but quantifiers range over different entities (statues vs. lumps).  
       - **Translation argument** resolved it by showing claims can be restated without losing content.  
       - **But limit:** Not all disputes are verbal—e.g., if Group A said, *"The lump is imaginary,"* that would be factual. The exercise shows language *choice* has consequences, but doesn’t deflate all ontology.  

  ---

  ### **What Will Predictably Go Wrong (and How to Handle It)**  
  1. **Premature Compromise:**  
     - Students may abandon their ontology early to "get it done."  
     - **Fix:** Remind groups during prep: *"Your funding depends on adhering to your role’s ontology."* Penalize inconsistent forms.  

  2. **Ignoring Inventory Rules:**  
     - Groups might focus only on insurance, missing how inventory consistency affects the grant.  
     - **Fix:** Void a team’s form mid-deliberation for inconsistency (e.g., *"Your insurance claims David is destroyed, but your inventory lists it—penalty applied!"*).  

  3. **Over-Intellectualizing:**  
     - Philosophy students may jump to metaontology instead of role-playing.  
     - **Fix:** Emphasize immersion: *"You’re museum staff, not philosophers—fight for your funding!"*  

  4. **Skimpy Translation:**  
     - Groups may produce a shallow translation (e.g., *"Call it a ‘thingy’"*).  
     - **Fix:** Challenge them: *"Translate without changing your ontology. How would Group B describe your claim?"*  

  ---

  ### **What the Exercise Cannot Reproduce (to Address in Closing)**  
  **The Normative Stakes of Ontology:**  
  - The exercise resolves the dispute pragmatically (via translation), but **real metaontology debates aren’t settled by practical needs**. Philosophers care about which language *corresponds to reality* or has *theoretical virtues* (simplicity, explanatory power).  
  - **Closing Point:** *"Translation shows disputes can be verbal, but we still need criteria to choose between languages. Is one ontology ‘truer’? Does it matter if both work? That’s where quantifier variance critics like Sider enter, arguing for a ‘joint-carving’ ontology."*  

  This exercise forces students into a visceral deadlock, making quantifier variance feel urgent and tangible. By grappling with translation under pressure, they’ll grasp both its power (as a resolver) and limits (as a deflator).
