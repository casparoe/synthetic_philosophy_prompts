  **Roles:**
  - Group A: Hole-Counters (they believe holes are objects)
  - Group B: Hole-Deniers (they believe there are no such things as holes; there are only the cheese and its cavities as properties)

  **Materials:**
  - A picture of Swiss cheese with visible holes (say 10 holes).
  - Grant application form with:
     - Question 1: How many objects are in the exhibit? (The exhibit is the cheese on a plate.)
     - Question 2: How many holes are in the cheese?
