  I'm a novelist, not a philosopher, but I've gotten myself into a philosophical knot with my current book and I'd like you to write me an essay to help me think it through. My protagonist is a historian who starts off deeply skeptical of a new political-religious movement her brother joins. At a certain point she becomes able to predict, with something close to certainty, that within a year she will have joined it too and will believe its central claims with high confidence. I want to understand whether her present self is rationally required to defer to that future self. This seems to connect to Van Fraassen's Reflection principle — roughly, the idea that your current credence in a proposition should equal the weighted average of the credences you expect to have later, so that if you're sure you'll believe P at 0.9 tomorrow, you should believe it at 0.9 today.

  So here's what I'd like: an essay on whether Reflection is a real constraint on rational belief. Weigh the main considerations on both sides — on one side the diachronic Dutch book arguments and the thought that my future self is a kind of expert about what my evidence will support; on the other side cases where I expect to be brainwashed, drunk, exhausted, or to have lost information, where deferring to my later self seams absurd. Also keep two questions apart that I keep conflating: whether she should already believe what her future self will believe, and whether she should take steps now to constrain or outsource her decisions to that future self. Don't end on a fence. Reach a conclusion about how much of the principle survives, and say explicitly what it implies about my historian. I don't need footnotes or citations, just the argument. Keep it sharp; I've been going back and forth on wether she's being irrational or not for weeks.
