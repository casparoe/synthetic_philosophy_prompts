  Below is a complete, runnable 90-minute session plan designed to help a general audience intuitively grasp why maximizing expected value can lead to ruin in repeated bets, while optimizing for geometric growth (via fractional betting) leads to sustainable wealth. The activity uses a coin-flip game with tokens, emphasizes experiential learning, and concludes with a debrief connecting the dots to logarithmic utility and the Kelly criterion.

  ---

  ### **Core Lesson**
  Participants will discover through play:
  1. **Positive expected value ≠ long-term success**: A bet with favorable odds can still bankrupt you if overbet.
  2. **Bet size is critical**: Small fractional bets compound; large bets risk ruin.
  3. **Wealth compounds multiplicatively**: Maximizing geometric mean (via log wealth) is key for repeated bets.

  ---

  ### **Brainstormed Mechanics & Trade-offs**
  I considered three designs before selecting the final one:

  1. **Double-or-Nothing Dice**  
     - **Mechanics**: Roll a die; bet on high (4–6, 60% win). Win: double bet. Lose: lose bet.  
     - **Strengths**: Simple odds. Clear positive EV (+20% per bet).  
     - **Weaknesses**: Less intuitive compounding. Bankruptcies are rare (only with 100% bets).  
     - **Why rejected**: Fails to highlight fractional betting nuances; too forgiving for 50%+ bets.

  2. **Asymmetric Stock Simulation**  
     - **Mechanics**: "Invest" in a volatile asset. 70% chance of +50% return, 30% chance of -40% loss.  
     - **Strengths**: Real-world relevance. Dramatic growth/ruin divergence.  
     - **Weaknesses**: Complex calculations. Participants confuse arithmetic/logarithmic scales.  
     - **Why rejected**: Math overhead distracts from core insight. Hard to run with tokens.

  3. **Coin Flip with 2:1 Payout** (✔️ **Selected**)  
     - **Mechanics**: Fair coin, win 2× bet on heads, lose bet on tails (50% win probability).  
       - EV per bet = (0.5 × 2) + (0.5 × -1) = +0.5 (positive).  
       - Kelly fraction = (0.5 × 2 - 0.5) / 2 = 0.25 (25% optimal bet).  
     - **Strengths**:  
       - High stakes: 100% bettors go bust fast; 25% thrive.  
       - Simple math (whole-number tokens).  
       - Clear divergence between strategies.  
     - **Weaknesses**: Noisy short-term results (fixed via pre-set sequence).  
     - **Why chosen**: Maximizes emotional impact. Minimal math. Perfectly illustrates geometric vs. arithmetic growth.

  ---

  ### **Final Game Design: The Compounding Coin Flip**
  **Objective**: Grow token wealth over 20 rounds of betting.  
  **Core Insight**: Betting too much (even on +EV bets) destroys wealth; fractional betting compounds.

  #### **Materials**  
  - **Tokens**: 100 tokens per player (start), extras for rebuys (none allowed).  
  - **Betting Chips**: Colored chips (e.g., red=10%, blue=25%, green=50%, black=100%) to enforce strategies.  
  - **Outcome Sequence**: Pre-generated coin-flip sequence (10 heads, 10 tails) with 3+ consecutive losses (e.g., `T,H,T,T,H,T,H,H,T,H,T,T,H,T,H,H,T,H,T,T`).  
  - **Tracking**:  
    - Paper worksheets (columns: Round, Wealth, Bet Size, Outcome, New Wealth).  
    - Shared spreadsheet (projected) for group totals.  
  - **Timekeeping**: Timer (2 min/round).

  #### **Rules**  
  1. **Starting Wealth**: 100 tokens per player.  
  2. **Bet Strategies** (assigned secretly):  
     - **Group A (100%)**: Bet all wealth every round.  
     - **Group B (50%)**: Bet half wealth every round.  
     - **Group C (25%)**: Bet quarter wealth every round.  
     - **Group D (10%)**: Bet 10% wealth every round.  
  3. **Bet Resolution**:  
     - **Win (Heads)**: Get bet + 2× bet = +2× net gain.  
       - *Example*: Bet 20 tokens → win 40 → new wealth = 100 - 20 + 40 = 120.  
     - **Lose (Tails)**: Lose entire bet.  
  4. **Bankruptcy**: Players at ≤0 tokens sit out.  
  5. **Rounds**: 20 rounds. Announce outcomes in sequence (e.g., "Round 1: Tails!").

  #### **Timeline** (90 Min Total)  
  - **Intro** (10 min):  
    - Explain rules, EV (+0.5/bet), and betting strategies.  
    - Emphasize: "Goal is to grow wealth. Stick to your strategy."  
  - **Gameplay** (35 min):  
    - 20 rounds × 1.5 min each. Players record wealth on worksheets.  
    - **Facilitator Actions**:  
      - Announce outcomes.  
      - Track 1 player per strategy on the shared spreadsheet.  
      - Warn near-bankrupt players: "You can’t recover if you lose!"  
  - **Data Collection** (10 min):  
    - Survey final wealth by strategy. Record:  
      - % bankrupt.  
      - Median wealth (robust against outliers).  
  - **Debrief** (35 min): See below.

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem**: 100% bettors go bust early → disengagement.  
    - **Fix**: Assign only 4/18 to 100% group. Let them help track data post-bust.  
  - **Problem**: Fraction bet math slows play (e.g., 25% of 73 tokens).  
    - **Fix**: Use tokens; round bets to whole numbers (e.g., 73 → bet 18).  
  - **Problem**: Outliers skew perceptions (e.g., one 100% bettor survives and wins big).  
    - **Fix**: Focus on **medians** and **bankruptcy rates** in debrief.  
  - **Problem**: Misunderstanding EV ("I had good odds but still lost!").  
    - **Fix**: Use debrief to separate single-bet math from long-term growth.

  ---

  ### **Debrief Script**  
  **Goal**: Link gameplay to arithmetic vs. geometric growth and log wealth.  

  1. **Observations** (10 min):  
     - Ask: "What happened to the all-in bettors? Why did some 25% bettors pass 100% bettors?"  
     - Show data:  
       | Strategy | % Bankrupt | Median Wealth |  
       |----------|------------|--------------|  
       | 100%     | ~100%      | 0            |  
       | 50%      | ~30%       | 80–120       |  
       | 25%      | 0%         | 250–400      |  
       | 10%      | 0%         | 150–200      |  
     - Key point: "Bankruptcies clustered with big bets, even with good odds."  

  2. **The Math** (15 min):  
     - **Arithmetic Expectation (EV)**:  
       - "EV = average outcome if you could play once with infinite parallel clones."  
       - Calculate together: EV = (0.5 × 2) + (0.5 × -1) = +0.5 tokens/bet.  
       - "EV says ‘bet big’—but you saw why this fails when you’re one person over time."  
     - **Geometric Expectation**:  
       - "Wealth multiplies: Win? Wealth × (1 + 2f). Lose? Wealth × (1 - f)."  
       - Show growth factors:  
         - *100% bettor*: Lose once → ×0 (dead).  
         - *25% bettor*: Lose → ×0.75; win → ×1.5.  
       - "Your median wealth grew fastest at 25% because it balances win/loss impacts."  
     - **Log Wealth = Growth Rate**:  
       - Sketch: *After 2 rounds, 1 win + 1 loss*:  
         - 25% bettor: ×1.5 × 0.75 = 1.125 → **log(1.125) ≈ +0.12**  
         - 50% bettor: ×2.0 × 0.5 = 1.0 → **log(1.0) = 0**  
       - "Sum of logs = geometric growth rate. Maximize this to avoid ruin and compound."  

  3. **The Big Picture** (10 min):  
     - **Philosophy**: "Money compounds. A 100% loss destroys future opportunity. A 50% loss requires a 100% gain to recover!"  
     - **Kelly Criterion**: "Bet a fraction = (edge/odds). Here, (0.5)/2 = 25%."  
     - **Real World**: "Stock investing, startups, poker—all punish overbetting. Win by surviving to compound."  

  ---

  ### **What the Activity Can’t Teach**  
  - **Ergodicity**: The difference between ensemble averages (EV) and time averages (growth rate) is abstract. You must explain:  
    > "EV is like averaging all players’ outcomes at the *end* of the game. But you’re a single player living through *all rounds*. Ruin resets your growth to zero—and EV ignores this. Maximizing log wealth protects your future."  
    Use the spreadsheet’s "group averages vs. individual paths" to clarify.  

  - **Uncertain Probabilities**: The game assumes known odds. In reality, edge estimation is hard (mention overconfidence).  

  - **Correlated Bets**: Real portfolios have correlated risks (e.g., stocks crash together). The game uses independent bets.  

  ---

  ### **Why This Works**  
  - **Gut-Level Impact**: Players *feel* the despair of bankruptcy and the thrill of compounding.  
  - **Clear Archetypes**: 100% = reckless, 25% = optimal, 10% = overcautious.  
  - **No Math Dependency**: Outcomes speak for themselves; debrief formalizes intuition.  

  This plan turns abstract theory into visceral experience. Participants leave remembering that "betting it all" is a recipe for ruin—and that true growth is a marathon, not a sprint.
