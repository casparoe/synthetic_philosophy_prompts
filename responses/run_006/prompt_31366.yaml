     - 0-10 min: Introduction and rules. Assign strategies.
     - 10-40 min: Play 20 rounds. We announce each outcome, they compute their new wealth. We walk around to help with calculations.
     - 40-50 min: Collect results. On a board, for each group, list the final wealth of each participant. Compute the number bankrupt, average, and median.
     - 50-85 min: Debrief. Discuss observations. Then explain the math. Show the expected value per bet and why it's positive. Then explain the growth rate and the Kelly criterion. Use the example of the 50% bettor having zero growth in the long run. Show the log growth function. Connect to the results they saw.

  3. **Handling potential issues:**
     - **Calculation errors:** Have facilitators walk around to help. Or provide calculators.
     - **Time:** If time runs short, reduce the number of rounds? But 20 rounds is ideal. We can skip the last few rounds if necessary and extrapolate? Not ideal. We can do 15 rounds and still see the effect.
     - **Unengaged participants:** Encourage them to track their wealth and compare with neighbors.

  **Alternative if time is short:** Use a spreadsheet for everyone. We can have a shared Google Sheet where each participant has a row and we pre-program the calculations. Then we just input the outcomes and their fraction and it auto-computes. But that might require computers.

  Given the setting (science festival), we'll go with the worksheet method.

  This design should achieve the goal: the participants will see that the all-in bettors go bankrupt, the 50% bettors might not grow, and the 25% bettors grow the most. They will feel the risk of overbetting and the power of compounding with fractional betting.
