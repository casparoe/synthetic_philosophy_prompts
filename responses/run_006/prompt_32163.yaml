prompt: |-
  I'm running a session for a legal philosophy reading group—mostly grad students and a couple practicing lawyers, but nobody with formal logic background. We're using Nomic (the game where you can change the rules as part of playing) as a way into the problem of self-amendment in law. The one thing I want them to come away with is that self-referential legal rules can generate genuine paradoxes, not just practical annoyances, and that you can't dissolve them by just saying "well, rules exist at different levels."

  I've got forty minutes. Don't explain the paradox to me; plan how I should structure the session. What needs to be in place before the paradox even has bite? What's the one example—from Nomic or from an actual legal system—that should carry the whole discussion, and what features does it absolutely need to have? What misconceptions are they going to walk in with (I'm betting "why not just add a rule that says no rule can amend itself" and "isn't this just the liar paradox with a gavel") and at exactly what point in the sequence do I head each one off? And what's a question I can ask at the end that tells me whether they actually got it rather than just nodded along?
