  Timing is tight: 40 minutes. I'll break it into phases: setup (10 mins), paradox demonstration (15 mins), misconceptions (10 mins), and assessment (5 mins). The setup must establish rule hierarchy and amendment mechanics without logic jargon. Using a simple rule change in Nomic as an example can illustrate how rules modify other rules.

  For misconceptions, preempt the "just ban self-amendment" by showing that such a ban itself requires amendment, leading to the same paradox. Clarify that it's not just the liar paradox by highlighting the practical consequence—paralysis in legal systems. 

