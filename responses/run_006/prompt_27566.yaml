  ### Scoring Key  
  Compare your answers to the patterns below. Each pattern corresponds to a named position or signals **Brutal Composition**.  

  | Position                   | Pattern (Q1–Q9)       | Notes                                                                 |  
  |----------------------------|-----------------------|-----------------------------------------------------------------------|  
  | Mereological Nihilism      | B, C, C, B, B, B, B, B, B | Denies composites entirely.                                          |  
  | Universalism               | C, B, A, A, A, A, A, A, A | Accepts composites in all cases.                                      |  
  | Contact View               | A, B, A, A, A, A, B, A, B | Composites only when parts are in contact.                            |  
  | Fastening View             | B, B, A, C, C, A, B, A, B | Composites only when parts are fastened (e.g., glued, interlocked).   |  
  | Cohesion View              | B, B, A, C, B, A, B, B, B | Composites only when parts are bonded (e.g., chemically or biologically). |  
  | Organicist View            | B, A, C, B, B, B, B, B, B | Composites only when activity constitutes life (van Inwagen).         |  
  | **Brutal Composition**     | *Any other pattern*   | Composition is a brute fact with no general principle.                |  

  #### Notes on the Key  
  - **Unattractive/Incoherent Patterns**: Patterns like [A, A, A, B, B, B, B, B, B] (accepts handshake/tree/arm composites but rejects all others) are rare and typically unattractive due to inconsistency. They default to Brutal Composition.  
  - **Underseparated Positions**: The quiz cleanly separates all six systematic views. No two views share the same pattern.  
  - **Brutal Composition Special Rule**: If your answers don’t match any systematic view *or* you believe composition facts lack an informative explanation, you are sorted here.  

  #### Why These Cases?  
  - The flock of birds (Q9) and jigsaw (Q8) were added to separate Cohesion/Fastening (Q8: cohesion rejects jigsaw; fastening accepts) and Universalism/Contact (Q9: universalism accepts flocks; contact rejects).  
  - If the quiz couldn’t separate two views (it does), one additional case (e.g., *a disassembled engine with parts in a box*) would distinguish them.  

  **Next Steps**: Use your result to anchor discussions. For example, if you sorted to *Organicism*, your arguments should start from "life" as the criterion—without assuming others share it.
