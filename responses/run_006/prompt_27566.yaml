  ### Composition Quiz: Locating Your View  
  **Gloss:** A "composite object" is a single thing made up of other things.  

  Answer each scenario with one of the three fixed options. Do not reference any theories—rely solely on your intuition about the cases.  

  ---

  1. **Two people shake hands and then let go.**  
     - (A) A composite exists only while they are in contact.  
     - (B) No composite exists at any point.  
     - (C) A composite exists and persists after they separate.  

  2. **A living tree and that same tree immediately after it dies (no decomposition; parts identically arranged).**  
     - (A) A composite exists only while the tree is alive.  
     - (B) A composite exists both when alive and just after death.  
     - (C) No composite exists at any point.  

  3. **A human arm immediately after being severed from the body (tissues intact; not decomposing).**  
     - (A) The arm is a composite object.  
     - (B) The arm was a composite when attached but is not now.  
     - (C) The arm is never a composite object.  

  4. **A pile of dry sand (grains touching but not stuck together).**  
     - (A) The pile is a composite object.  
     - (B) The pile is not a composite object.  
     - (C) The pile would be a composite only if the grains were stuck together.  

  5. **Two bricks stacked stably (not glued or fastened).**  
     - (A) The bricks compose a composite object.  
     - (B) They do not compose a composite.  
     - (C) They compose a composite only if fastened together.  

  6. **A wooden chair with parts glued together.**  
     - (A) The chair is a composite object.  
     - (B) The chair is not a composite object.  
     - (C) The chair is a composite only if it is alive.  

  7. **A cloud of water droplets (droplets not touching, held by air currents).**  
     - (A) The cloud is a composite object.  
     - (B) The cloud is not a composite object.  
     - (C) The cloud is a composite only if the droplets are touching.  

  8. **Two jigsaw puzzle pieces interlocked (not glued; fitted snugly).**  
     - (A) The pieces compose a composite object.  
     - (B) They do not compose a composite.  
     - (C) They compose a composite only if glued or bonded.  

  9. **A flock of birds flying in formation (not touching).**  
     - (A) The birds compose a composite object.  
     - (B) They do not compose a composite.  
     - (C) They compose a composite only if touching.  

