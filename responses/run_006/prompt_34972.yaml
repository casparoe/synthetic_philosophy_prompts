  They might also need to consider if there's a meta-theory here, like second-order rationality, where deferring is rational because current conditions are suboptimal. But that could be circular. The most plausible alternative is splitting by domain, as each has different stakes and methods. For example, moral constructivism vs. epistemic idealization. 

