  Someone in my metaphysics reading group has started using 'conceivability is a guide to possibility' as a conversation-ender. His move is that he can clearly conceive of a zombie, meaning a being physicaly identical to a person but with no conscious experience at all, so zombies are possible, and that alone supposedly sinks physicalism about consciousness. I'm not convinced, but the slogan is slippery enough that I can't pin down where the argument goes wrong. I want a menu I can bring to the next meeting: what are the distinct precise claims that one-liner could be making, where the readings differ on what counts as 'conceiving' (offhand imagining versus some idealized rational conceivability, positive versus negative) and on what kind of 'possibility' is being claimed (logical, metaphysical, physical, epistemic)? For each reading, tell me whether it's trivial, substantive but defensible, or outright false, and whether that reading would actually get him from 'I can conceive of zombies' to 'physicalism is false'. Which reading is he probably leaning on, and which is the strongest one he could lean on without begging the question?
