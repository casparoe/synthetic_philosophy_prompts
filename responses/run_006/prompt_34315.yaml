prompt: |-
  my epistemology prof keeps saying that higher-order evidence is just like finding out your measuring instrument is miscalibrated — if you learn your scale adds three pounds, you stop trusting the numbers it gives you, and likewise if you learn you're sleep-deprived or biased you should stop trusting the conclusion you reached. he uses this to argue that epistemic akrasia — believing P while also believing your evidence doesn't support P — is always irrational, because it's like staring at a scale that says 150 while believing it's broken and still writing down 150.

  i'm not convinced but i can't articulate why. can you audit this analogy? give me the correspondence table (what maps to the scale, the calibration knowledge, the reading, the act of writing down the number), then the places the mapping breaks. i especially want to know whether the disanalogies matter for his conclusion — i.e., does the irrationality of the scale case actually transfer to the epistemic case, or does the analogy quietly import features of instruments that minds don't have? and if the analogy is misleading, what's a better one?

  for the response format: after whatever prose you need, give me a json object with fields: "mapping" (an array of objects with keys "source", "target", and "fits_well" as a boolean), "breaks" (an array of objects with keys "disanalogy", "matters_for_conclusion" as a boolean, and "why"), "verdict" (a string: whether the conclusion survives and in what form), and "better_analogy" (a short description or null if none).
reasoning: |-
  Hmm, the user is grappling with an epistemology problem about higher-order evidence and epistemic akrasia. Their professor uses a scale calibration analogy to argue that akrasia is always irrational, but they feel unconvinced and want me to audit the analogy systematically. 

  First, I need to unpack the professor's argument. The analogy maps perfectly: the scale is your mind, calibration knowledge is higher-order evidence, the reading is your first-order belief, and writing down the number is endorsing that belief. The professor claims that just as it's irrational to record a scale's reading while knowing it's broken, it's irrational to hold a belief while knowing your evidence doesn't support it. 

  But the disanalogies are crucial here. When a scale is miscalibrated, it's globally unreliable—every reading is off by 3 pounds. But minds aren't like that. Higher-order evidence (like learning you're sleep-deprived) might create local unreliability—maybe you're bad at math problems now but fine at recalling facts. Also, scales can't self-correct, but minds can meta-reflect: "I know I'm biased about politics, but this climate change data seems solid regardless." This is why akrasia might sometimes be rational—your higher-order doubt doesn't necessarily poison every first-order belief. 

  The user's deeper struggle seems to be about the mind's complexity. The scale analogy reduces epistemology to instrument reliability, ignoring that beliefs can be compartmentalized or resilient. For their essay, they need to show that the professor's conclusion doesn't fully survive because minds have dynamic, content-sensitive reliability. 

  A better analogy might be a biased judge: even if you know Judge X favors the prosecution, you might still accept their verdict on a case with overwhelming evidence. This captures the nuance—higher-order evidence should shift your credence but not always destroy belief. 

  Structurally, I'll map the analogy point-by-point, flag where it breaks and why it matters, then give a verdict that akrasia isn't always irrational. The JSON format they requested will help them plug this directly into their argument.
