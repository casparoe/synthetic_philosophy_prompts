  David Benatar's position relies on this asymmetry, but critics like David DeGrazia point out that non-existence isn't a state that can possess value properties. Saying the absence of pain is "good" in non-existence is misleading because there's no subject to benefit. Similarly, the absence of pleasure isn't bad because no one is deprived. So premise (3) might be the weak point. Instead of calling it "good," we can say it's not bad, which is different. That way, preventing suffering is still important because it avoids harm to actual beings, not because non-existence has inherent goodness.

