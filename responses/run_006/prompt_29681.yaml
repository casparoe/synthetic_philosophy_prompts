  ### Decision Tree for the Units of Selection Debate  
  *Based on causal commitments in evolutionary processes. Answer each question with concrete cases in mind, not terminology.*

  ---

  #### **Branch 1: Gene-Level Selection**  
  **Question 1:** A "segregation distorter" allele spreads by over-representing itself in gametes but lowers the organism's survival/reproduction. Is this an instance of natural selection?  
  - **Yes** → Proceed to Branch 2.  
  - **No** → Proceed to Branch 3.  

  ---

  #### **Branch 2 (Gene-Level Accepted)**  
  **Question 2:** Altruism (e.g., a trait costly to an individual within its group but increasing group persistence/reproduction) evolves in a population. Must group-level selection explain this?  
  - **Yes** → Proceed to Branch 4.  
  - **No** → Proceed to Branch 5.  

  #### **Branch 3 (Gene-Level Rejected)**  
  **Question 2:** Altruism (same as above) evolves. Must group-level selection explain this?  
  - **Yes** → Proceed to Branch 4.  
  - **No** → Proceed to Branch 6.  

  ---

  #### **Branch 4 (Group-Level Accepted)**  
  **Question 3:** A species-level trait (e.g., broad geographic range, emergent and irreducible to individual traits) lowers extinction rates. Does this cause natural selection?  
  - **Yes** → **Multilevel Selection (Group + Species)**  
  - **No** → **Multilevel Selection (Group Only)**  

  #### **Branch 5 (Gene-Level Accepted, Group-Level Rejected)**  
  **Question 3:** Does the irreducible species-level trait (as above) cause natural selection?  
  - **Yes** → **Gene’s-Eye View + Species Selection** (Unattractive: Incoherent to accept gene/species but reject intermediate group level)  
  - **No** → **Gene’s-Eye View** (Selection primarily at gene level; higher levels reducible)  

  #### **Branch 6 (Gene/Group-Level Rejected)**  
  **Question 3:** Does the irreducible species-level trait (as above) cause natural selection?  
  - **Yes** → **Species Selection Only** (Unoccupied: Theoretically possible but unexplored; rejects group selection while accepting species)  
  - **No** → **Organism-Level Selection** (Selection acts solely on individual organisms; higher levels are epiphenomena)  

  ---

  ### Key Positions in the Tree  
  | Leaf Position                     | Description                                                                 |
  |-----------------------------------|-----------------------------------------------------------------------------|
  | **Gene’s-Eye View**               | Gene-level selection explains evolution; altruism reducible to kin/gene dynamics. |
  | **Organism-Level Selection**      | Only organismic traits (e.g., size, speed) are targets of selection.        |
  | **Multilevel Selection (Group)**  | Group traits (e.g., altruism frequency) cause selection irreducible to individuals. |
  | **Multilevel Selection (Group + Species)** | Group *and* species traits (e.g., geographic range) are irreducible causal levels. |
  | **Species Selection Only**        | Species traits cause selection, but group selection is rejected (unexplored). |
  | **Gene’s-Eye View + Species**     | Gene *and* species selection accepted, but group selection rejected (incoherent). |

  ---

  ### Diagnoses of Unoccupied/Unattractive Combinations  
  - **Gene’s-Eye View + Species Selection** (`Branch 5 → Yes`):  
    *Incoherent* — Accepts irreducible selection at gene and species levels but denies group selection, violating hierarchical causality.  
  - **Species Selection Only** (`Branch 6 → Yes`):  
    *Unexplored* — Theoretically possible (species as units without groups) but unsupported; no major theory defends this.  

  ### Ambiguity Flag  
  - **Multilevel Selection (Group)** vs. **Species Selection Only**:  
    The tree cleanly separates these (via Q3). However, **Multilevel (Group)** and **Multilevel (Group + Species)** are distinguished by whether species traits are causal.  

  ---

  ### Design Notes  
  - **Branch Questions** track causal commitments:  
    1. Gene-level causality (segregation distorter).  
    2. Group-level causality (altruism evolution).  
    3. Species-level causality (emergent traits).  
  - **Species Selection** requires irreducibility (Q3), distinguishing it from group selection.  
  - All major positions (gene/organism/group/species) are captured, with unexplored/incoherent leaves diagnosed.  
  - Tree depth: 3 questions → 6 leaves (within 8-leaf limit).
