  **Key Delivery Advice:**
  *   **Clarify "Non-Outcome-Based":** Emphasize this means agents that don't treat the *shutdown signal* as just another state variable to be optimized within a utility function over world-states. Frame it as "agents with interruptible optimization" or "agents using modal reasoning."
  *   **Acknowledge EU's Strengths:** Don't dismiss EU maximization entirely; frame it as brilliantly competent for pure goal achievement, but possessing this specific safety flaw.
  *   **Stress the "Who Decides" Point:** Corrigibility is about the agent ceding control *to the human* immediately upon request, not making a calculated decision about the optimal shutdown timing, even if that calculation uses the 'right' values.
  *   **Be Honest About Solution Maturity:** Present alternative architectures as promising research directions, not solved problems. Acknowledge the deep challenges (especially the dangerous question).
  *   **Use Concrete Analogies:** The "employee following a stop command" analogy is valuable.
