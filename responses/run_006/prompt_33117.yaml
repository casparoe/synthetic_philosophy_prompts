prompt: |-
  I'm preparing a workshop presentation at a major AI lab on the corrigibility / shutdown problem, and I need a Q&A prep sheet. My thesis is:

  > The shutdown problem is not reducible to reward misspecification. Standard reward-learning approaches assume the agent is trying to maximize some function of world-states, and corrigibility failures (e.g., resisting shutdown, manipulating the off-switch) are treated as errors in what was rewarded. But the shutdown problem is deeper: an agent that is an expected utility maximizer over outcomes has a convergent instrumental incentive to prevent its own shutdown *regardless of what its utility function says about shutdown*, because shutdown prevents it from achieving whatever goals it has. Solving this requires building agents that are not expected utility maximizers over outcomes — agents whose decision rule treats "I am being shut down" as a special kind of information that shouldn't be optimized against, not just another world-state to be assigned a utility.

  The audience is roughly forty researchers at an industry AI lab: about two-thirds are ML engineers and applied RL researchers who work on training large models, designing reward functions, and RLHF; they tend to think corrigibility is an overhyped problem that will dissolve once we get reward specification right. The remaining third are from the lab's safety team — they take alignment seriously but are internally divided on whether the shutdown problem is a genuine conceptual challenge or a special case of reward misspecification. A few of them have read the original Soares et al. corrigibility paper and are familiar with the utility-indifference formulation; most have not.

  I'll be presenting the argument in three steps: (1) a clean statement of the shutdown problem for expected utility maximizers, (2) why reward misspecification cannot capture it — because the problem arises from the structure of the decision rule, not the content of the reward, and (3) a sketch of what a non-outcome-based agent architecture might look like, drawing on the idea that the agent should treat evidence of shutdown as a reason to stop pursuing goals rather than as a world-state to be avoided.

  Prepare my Q&A prep sheet. For each objection, give me:

  - The objection phrased the way this audience would actually put it (an engineer's objection should sound like an engineer, not a philosopher).
  - Who is most likely to raise it (e.g., "an RL engineer," "a safety researcher familiar with the corrigibility literature").
  - A rating of how damaging it is: high / medium / low.
  - A two-minute reply I can give.
  - A note on where the reply is weakest — what I should hope they don't press on.
  - Whether I should concede anything up front, and if so, what.

  Order the objections by roughly the sequence they're likely to come up in Q&A (which is usually: the most obvious challenges first, then the ones that take more setup). Include the question I'm hoping nobody asks, and explain why it's the dangerous one.

  If the whole framing of my talk is confused — if, for example, the shutdown problem really is just reward misspecification under another name, and I'm setting up a false dichotomy — I want the response to say so plainly rather than help me defend a broken position. Don't be polite at the expense of accuracy.

  After the full prep sheet, give me a structured summary as a JSON object with the following schema:

  {
    "talk_framing_assessment": "string: whether the thesis is defensible as stated, defensible with modifications, or fundamentally confused — and why",
    "objections": [
      {
        "order": "number: position in Q&A sequence",
        "objection": "string: the objection as the audience member would phrase it",
        "raised_by": "string: audience role",
        "damage": "string: high | medium | low",
        "concede": "string: what to concede, or 'none'",
        "reply_summary": "string: one-sentence summary of the two-minute reply",
        "weak_point": "string: where the reply is most vulnerable to follow-up"
      }
    ],
    "dangerous_question": {
      "question": "string: the question I'm hoping nobody asks",
      "why_dangerous": "string: why it's the one that could unravel the talk"
    }
  }
