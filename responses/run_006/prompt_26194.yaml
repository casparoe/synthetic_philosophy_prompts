prompt: |-
  I'm in a philosophy of logic course and we've just finished a unit on the Liar paradox. Before I start weighing Tarskian hierarchies against Kripke's fixed-point theory, revision theories, paraconsistent approaches, and the rest, I want to nail down what the job description actually is. What must an adequate theory of truth deliver?

  I'm asking for the desiderata: the phenomena it has to explain, the cases it has to classify correctly, the logical principles it must preserve or at least explain the loss of, and the expressive resources it must secure. For each desideratum, give the consideration or example that makes it a genuine requirement rather than a camp preference. Then flag any subsets that are known to be jointly unsatisfiable — where results in the literature show you cannot have them all at once. Which desiderata are negotiable, and why? And finally: which single requirement does the most to narrow the field, and what makes it so restrictive?

  Please end with a one-sentence summary as the last line.
