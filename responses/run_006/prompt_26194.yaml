answer: |-
  Here’s a systematic breakdown of the desiderata for an adequate theory of truth, grounded in logical phenomena and paradoxes, with key conflicts highlighted:

  ### **Core Desiderata**
  1. **Capture Ordinary Truth Ascriptions**  
     *Requirement:* Classify non-paradoxical sentences correctly (e.g., "Snow is white" is true iff snow is white).  
     *Justification:* Without this, the theory fails its basic purpose — explaining truth in natural language and science.  
     *Example:* "Grass is green" must be true.

  2. **Handle Pathological Sentences**  
     *Requirement:* Assign coherent status (true/false/undefined) to paradoxes like the Liar ("This sentence is false").  
     *Justification:* The Liar exposes contradictions in naïve truth theories; ignoring it is ad hoc.  
     *Example:* Liar sentence (L) and Truth-Teller (T: "This sentence is true").

  3. **Preserve Classical Logic (where possible)**  
     *Requirement:* Maintain bivalence, excluded middle, non-contradiction, and valid inferences for non-semantic discourse.  
     *Justification:* Classical logic underpins mathematics and science; abandoning it incurs high costs (e.g., for arithmetic).  
     *Example:* "Snow is white or snow is not white" must be true.

  4. **Satisfy the T-Schema (Disquotation)**  
     *Requirement:* Accept instances of **"⌜φ⌝ is true iff φ"** for a broad range of sentences.  
     *Justification:* Truth is fundamentally disquotational (Tarski’s Convention T). Rejecting this severs truth from meaning.  
     *Example:* " 'Snow is white' is true iff snow is white" must hold.

  5. **Avoid Revenge Paradoxes**  
     *Requirement:* Prevent strengthened paradoxes using the theory’s own resources (e.g., "This sentence is false or undefined").  
     *Justification:* Revenge sentences (e.g., Kripke’s "This sentence is not true in any fixed point") collapse ad hoc solutions.  
     *Example:* Revenge Liar against partial-truth theories.

  6. **Expressive Completeness**  
     *Requirement:* Allow truth to apply to its own theory (self-reference) and semantic vocabulary (e.g., "Everything Kant said is true").  
     *Justification:* Natural language permits unrestricted truth ascriptions; artificial restrictions cripple expressiveness.  
     *Example:* Generalizations like "All logicians’ axioms are true".

  ---

  ### **Known Conflicts (Jointly Unsatisfiable Desiderata)**  
  - **Montague’s Theorem (1963):** *Classical logic + Full T-Schema + Non-hierarchical truth → Inconsistency.*  
    → Forces choice: weaken logic (Kripke), restrict T-schema (Tarski), or accept inconsistency (paraconsistency).  
  - **Tarski’s Undefinability Theorem:** *Expressive completeness + Classical logic → Truth cannot be defined within the language.*  
    → Mandates hierarchies (Tarski) or truth-value gaps (Kripke).  
  - **Revenge Trade-off:** *Handling all Liar variants + Classical logic → Triggers revenge paradoxes.*  
    → E.g., Kripke’s fixed points classify Liar as undefined but can’t express "is undefined" without revenge.

  ---

  ### **Negotiable Desiderata**  
  - **Pathological Sentence Status:** Whether Liar is *false*, *undefined*, or *both true and false* depends on the approach.  
    → *Why negotiable?* No consensus on the "correct" status; theories choose based on broader costs (e.g., paraconsistency tolerates contradictions).  
  - **Strength of Classical Logic:** Weakening to paraconsistent (LP), substructural, or intuitionistic logic is viable if it preserves key reasoning.  
    → *Why negotiable?* Logical orthodoxy isn’t sacred if alternative systems handle core inference (e.g., for empirical science).  
  - **Universality vs. Hierarchy:** Accepting a Tarskian hierarchy sacrifices self-applicability but avoids inconsistency.  
    → *Why negotiable?* Hierarchies may be "good enough" for formal languages (cf. Tarski) but not for natural language (cf. Kripke).

  ---

  ### **Most Restrictive Requirement**  
  **Disquotation (T-Schema)**  
  - *Why it narrows the field:*  
    Montague’s theorem shows that **full disquotation + classical logic + non-hierarchical truth is impossible**. This forces every theory to:  
    - Restrict the T-schema (e.g., Tarski’s hierarchical metalanguages),  
    - Abandon classical logic (e.g., Kripke’s strong Kleene logic), or  
    - Embrace inconsistency (e.g., paraconsistent LP).  
    No approach satisfies all three simultaneously — disquotation is the pivot on which the Liar’s blade turns.

  ---

  ### **One-Sentence Summary**  
  An adequate theory must explain ordinary truth, tame pathologicality, minimize logical revision, and resist revenge — yet no approach achieves all without sacrificing disquotation, universality, or classicality.
