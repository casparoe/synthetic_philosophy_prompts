  I need to recall Williams's original example: a man saves his drowning wife instead of a stranger. Williams argued that if the man stops to think about impartial morality or justifications before acting, that would be "one thought too many" - suggesting that genuine personal relationships should motivate action directly, without moral calculation.

  Let me analyze each reconstruction:

  (1) Unreflective thought ("it's my wife"): This seems closest to Williams's ideal - immediate recognition without moral deliberation. Should be least vulnerable.

  (2) First judges general permission: Actively applying a moral principle before acting. This is precisely what Williams criticized - turning personal commitment into a calculated moral decision. Most vulnerable.

  (3) Adopted policy of special weight: Similar to (2) but more habitual. Still involves prior moral framing of the relationship, so quite vulnerable.

  (4) Acts immediately but justifies later: Action itself is spontaneous, but justification invokes impartial rule afterwards. The defect isn't in the motivation but in how he understands his action post-factum.

  (5) Acts immediately, says "she's my wife": Both action and explanation reference the relationship directly without moral principles. Very similar to (1).

  Key distinctions: The "one thought too many" specifically targets moral reasoning intruding on personal motivations, not principles per se. Post hoc justification doesn't corrupt the motivation itself but reflects a flawed understanding of why the action was proper.

  My ranking should be: (2) most vulnerable (explicit moral calculation at decision point), then (3) (habitual moral framing), then (4) (correct motivation but flawed retrospective analysis), then (5) and (1) as least vulnerable (both preserve immediate relational motivation).

  For post hoc: No, it doesn't create the same defect as a motivating thought because it doesn't contaminate the action's spontaneity - though it still reveals problematic moral understanding.
answer: |-
  Here is the ranking from most to least vulnerable to Williams's "one thought too many" objection, with the core vulnerability lying in moral reasoning *mediating* or *replacing* direct personal motivation at the moment of action. The objection targets the *intrusion of impartial moral justification into the agent's immediate motivation*, not moral principles as such. Post hoc justification creates a distinct defect (misunderstanding the reason's nature) but not the same motivational defect as a contemporaneous thought.

  1.  **(2) He first judges that the situation falls under a general permission to favor one's spouse.**  
      *This is most vulnerable because the agent explicitly employs an impartial moral principle (the general permission) as the necessary *mediating justification* for acting on his personal commitment, directly inserting the "one thought too many" at the point of decision.*
  2.  **(3) He saves her because he has adopted a policy of giving special weight to his personal commitments.**  
      *This is highly vulnerable because the agent relies on a pre-meditated, principle-like *policy* (a form of impartial framework) to motivate the action, making the personal commitment secondary to a general rule.*
  3.  **(4) He acts immediately but later justifies his action by invoking an impartial rule.**  
      *This is moderately vulnerable because while the *motivation* is direct (avoiding the contemporaneous defect), the *post hoc justification* reveals a fundamental misunderstanding of the genuine, non-impartial reason ("she's my wife"), substituting an impartial principle where it doesn't belong.*
  4.  **(5) He acts immediately and, when pressed, says only that she is his wife.**  
      *This is minimally vulnerable because both the action and the explanation appeal directly to the personal relationship itself, without invoking any mediating moral principle, either during the act or afterwards.*
  5.  **(1) The man acts on the unreflective thought that it is his wife.**  
      *This is least vulnerable (essentially immune) because the motivating thought is solely the direct recognition of the personal relationship, with no intrusion of impartial moral reasoning or justification at any stage.*  

  **Distinction & Post Hoc Justification:** The "one thought too many" objection specifically criticizes the *motivational role* of impartial moral reasoning *at the time of action*, arguing it corrupts the directness and integrity of personal relationships; it is not a general rejection of all moral principles. **Post hoc justification creates a different defect:** it shows the agent misconstrues the *nature* of their reason (mistaking a personal fact for an impartial moral reason), but it does *not* create the same motivational defect as having that impartial thought *drive the action*, as the action itself sprang from an unmediated personal response.
