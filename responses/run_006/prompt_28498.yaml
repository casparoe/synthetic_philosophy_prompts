prompt: |-
  Before I commit to any particular formalization of common knowledge in interactive epistemology, I want a clear statement of what the notion is supposed to do. I am working on a paper that argues the standard iterative hierarchy—everyone knows, everyone knows that everyone knows, and so on—is too demanding to ground real coordination among agents who do not share a complete model of each other's reasoning, but I want to be sure I am not setting up a straw man by ignoring what a more flexible account could deliver.

  Write the desiderata: what must an adequate theory of common knowledge—one suitable for use in epistemic game theory and the analysis of coordination—get right? For each requirement, give the case or puzzle that motivates it, and state whether it is non-negotiable (any theory that fails it is not a theory of common knowledge at all) or whether it reflects a parochial commitment of a particular research program (the syntactic versus semantic approach, the Bayesian versus knowledge-first camp, and so on).

  In particular, I want the list to speak to at least the following, but you are not limited to them:

  - The coordinated-attack problem and Lewis's observation that common knowledge enables forms of coordination that iterated mutual knowledge cannot deliver.
  - Rubinstein's electronic mail game and the fragility of equilibrium predictions when common knowledge is merely approximate: does the theory require exact common knowledge, and if so, what does that imply about its applicability to real strategic settings?
  - The tension between the infinite hierarchy and finite agents: can common knowledge be approximated without collapsing into something weaker, or does approximation amount to abandoning the concept?
  - The distinction between common knowledge and common belief, and whether the latter is the more useful primitive for agents whose reasoning is probabilistic rather than certain.
  - The relationship between common knowledge of rationality and equilibrium concepts: how much common knowledge—and of what exactly—do Nash equilibrium, rationalizability, and correlated equilibrium actually require? Which equilibrium concepts survive under weaker epistemic conditions?
  - The Aumann agreement theorem: is recovering the theorem a genuine desideratum, or is the theorem better understood as revealing a pathology of the common-knowledge idealization—a sign that the standard notion is too strong to model real agents?
  - The problem of how common knowledge is established in the first place: public signals, shared language, conventions, and the possibility of generating common knowledge from private information.

  Flag any pair of desiderata you suspect cannot be jointly satisfied. I expect the list itself may contain tensions—for example, between the demand that common knowledge ground equilibrium predictions and the demand that it be achievable by finite agents—and uncovering those tensions is what I most want to see.
reasoning: |-
  We are listing desiderata for an adequate theory of common knowledge, especially for use in epistemic game theory and coordination analysis. For each, we provide:
  - The requirement (desideratum)
  - The motivating case or puzzle
  - Whether it is non-negotiable (essential to common knowledge) or reflects a parochial commitment

  We also flag tensions between desiderata.

  Desideratum 1: Common knowledge must enable coordination that iterated mutual knowledge cannot.
  - Motivating case: Coordinated attack problem (also known as the Two Generals problem). Two armies must attack simultaneously to succeed. They can send messengers, but messengers might be captured. Without common knowledge of the attack time, coordination fails. Lewis (1969) observed that any finite level of mutual knowledge (e.g., "we both know the plan", "we both know that we both know", up to n levels) is insufficient for coordination, but common knowledge (the infinite hierarchy) suffices.
  - Status: Non-negotiable. This is a core function of common knowledge.

  Desideratum 2: The theory should explain the fragility of coordination under approximate common knowledge.
  - Motivating case: Rubinstein's electronic mail game. Two players must coordinate on playing a Pareto-dominant equilibrium. They receive private signals (emails) about the state of the world. The probability of the favorable state is high, but the players never attain common knowledge of the state. The unique equilibrium is the inefficient one. This shows that even very high orders of mutual knowledge (but not common knowledge) can lead to coordination failure. The theory must account for why common knowledge is distinct and how its absence can break coordination.
  - Status: Non-negotiable for a theory that aims to explain coordination. However, the requirement to handle approximation might be parochial to Bayesian or probabilistic frameworks.

  Desideratum 3: Common knowledge must be compatible with finite agents.
  - Motivating case: The infinite hierarchy (everyone knows, everyone knows that everyone knows, ad infinitum) seems to require agents with unbounded reasoning capacity. But real agents are finite. Can common knowledge be approximated by finite levels of mutual knowledge? Or is there a way to represent common knowledge without an explicit infinite hierarchy?
  - Status: Non-negotiable for applicability to real agents. However, the standard definition is the infinite hierarchy. A theory must either show that the infinite hierarchy is not required in practice (e.g., by a fixed point definition) or provide a finite approximation that does not collapse to a finite level of mutual knowledge.

  Desideratum 4: The theory must distinguish between common knowledge and common belief, and account for probabilistic reasoning.
  - Motivating case: In many real settings, agents have beliefs with probabilities less than 1. Common belief (with probability 1) might be sufficient for some coordination, but common knowledge (with absolute certainty) is stronger. For example, in Bayesian games, common knowledge of the game and rationality is often assumed, but common belief might be more realistic. The theory should clarify whether common knowledge requires certainty or if common belief (with probability 1) is enough for coordination.
  - Status: Parochial to the choice between syntactic (logical) and semantic (possible worlds) approaches, and to the Bayesian camp. But it is non-negotiable that the theory must be clear about the role of certainty.

  Desideratum 5: The theory must clarify the epistemic conditions for equilibrium concepts.
  - Motivating cases:
      - Nash equilibrium: Requires that each player knows the strategy of the others and that each is rational (and that the game is common knowledge). But does it require common knowledge of rationality (CKR) or just mutual knowledge?
      - Rationalizability: Requires common knowledge of rationality (CKR) and the structure of the game, but not that players know each other's strategies. It is the set of strategies that survive iterative deletion of dominated strategies.
      - Correlated equilibrium: Requires common knowledge of rationality and a common prior over a correlating device.
  - Requirement: The theory must specify what common knowledge is required for each equilibrium concept. In particular, it is known that common knowledge of rationality and the game (and sometimes common priors) are required for these concepts. But we must also see which concepts survive under weaker conditions (e.g., finite levels of mutual knowledge).
  - Status: Non-negotiable for the application to game theory.

  Desideratum 6: The theory must account for the Aumann agreement theorem and its implications.
  - Motivating case: Aumann's theorem states that if two agents have common knowledge of each other's posterior probabilities of some event and they update via the same prior, then their posteriors must be equal. This seems to show that common knowledge of disagreement is impossible. But in reality, disagreement is common. Is this a pathology of the common knowledge idealization? The theory must either recover the theorem (if we are to take it as a desideratum) or explain why it fails in practice (if we take the theorem as showing that the idealization is too strong).
  - Status: Parochial to the Bayesian approach with a common prior. But it is non-negotiable that the theory must engage with this result.

  Desideratum 7: The theory must explain how common knowledge is established.
  - Motivating case: How do we ever achieve common knowledge? Lewis (1969) suggests public events: if an event is public (and it is common knowledge that it is public), then it can generate common knowledge. But what constitutes a public event? Shared language and conventions might rely on pre-existing common knowledge. Is there a way to bootstrap common knowledge from private information? (This is impossible in the coordinated attack problem because of the possibility of message loss.) The theory must provide an account of the sources of common knowledge.
  - Status: Non-negotiable for a complete theory.

  Flagged tensions:

  1. Tension between Desiderata 1 and 3: 
     - Desideratum 1 requires that common knowledge (infinite hierarchy) is necessary for coordination (as in coordinated attack). 
     - Desideratum 3 requires that common knowledge must be compatible with finite agents. 
     - How can finite agents possess an infinite hierarchy? This tension is central.

  2. Tension between Desiderata 2 and 5:
     - Desideratum 2 (from Rubinstein) shows that without exact common knowledge, coordination can break down (so equilibrium concepts requiring common knowledge might be fragile). 
     - Desideratum 5 requires that the theory grounds equilibrium concepts (which are central to game theory). 
     - If common knowledge is unattainable, then equilibrium concepts that require it might not be applicable. But we observe coordination in practice. So the theory must either show that common knowledge is attainable or that the equilibrium concepts do not require it.

  3. Tension between Desiderata 4 and 6:
     - Desideratum 4 asks for a distinction between common knowledge and common belief (with probability 1). 
     - Desideratum 6 (Aumann) relies on common knowledge (or common belief with probability 1) and a common prior. 
     - If we weaken to common belief, does the agreement theorem still hold? (It does, because the theorem uses common knowledge in the sense of common belief with probability 1.) But the theorem is often seen as counterintuitive. If we abandon the common prior, the theorem fails. The tension is whether the theory should require the common prior.

  4. Tension between Desiderata 1 and 7:
     - Desideratum 1 says common knowledge is necessary for coordination (as in coordinated attack). 
     - Desideratum 7 requires an account of how common knowledge is established. 
     - But the coordinated attack problem shows that common knowledge cannot be established by unreliable communication channels. So how is it established in real life? The theory must provide a way (e.g., via a public event) that bypasses the coordinated attack impossibility.

  Conclusion: The list of desiderata reveals that the core tension is between the infinite and unattainable nature of common knowledge (as per the standard definition) and the need to explain real-world coordination and equilibrium behavior. A theory that aims to be applicable must either provide a finite foundation for common knowledge or show that a weaker notion (like common belief or finite mutual knowledge) suffices for some coordination. However, the coordinated attack problem and Rubinstein's email game show that finite mutual knowledge is not enough. This is the central challenge.
answer: |-
  Below is a structured list of desiderata for an adequate theory of common knowledge, tailored to epistemic game theory and coordination analysis. Each item includes:  
  **(i)** the requirement, **(ii)** the motivating case/puzzle, **(iii)** its status (non-negotiable vs. parochial), and **(iv)** tensions with other desiderata. I flag irreconcilable tensions explicitly.  

  ---

  ### **Desideratum 1: Enable Coordination Beyond Finite Mutual Knowledge**  
  **Requirement:** Common knowledge must explain why coordination succeeds when finite mutual knowledge fails.  
  **Motivation:** *Coordinated Attack Problem* (aka Two Generals Problem). Two armies must attack simultaneously to succeed. Messengers can be intercepted, preventing certainty beyond finite mutual knowledge. Lewis (1969) showed that finite mutual knowledge (e.g., "we both know \(p\)" up to level \(n\)) cannot guarantee coordination, but common knowledge can.  
  **Status:** **Non-negotiable.** Any theory failing this cannot explain coordination under uncertainty.  

  ### **Desideratum 2: Robustness to Approximations**  
  **Requirement:** The theory must clarify whether exact common knowledge is essential or if approximations suffice for coordination.  
  **Motivation:** *Rubinstein’s Electronic Mail Game*. Players coordinate inefficiently despite near-certainty about each other’s knowledge because common knowledge is absent. Exact common knowledge yields efficient coordination; approximations do not.  
  **Status:** **Parochial** (reflects Bayesian/quantitative approaches). Non-Bayesian theories (e.g., syntactic) may reject approximations.  
  **Tension:** Conflicts with *Desideratum 1* if approximations collapse coordination.  

  ### **Desideratum 3: Compatibility with Finite Agents**  
  **Requirement:** Common knowledge must be attainable by bounded agents without invoking infinite regress.  
  **Motivation:** Finite agents cannot compute infinite hierarchies ("I know you know I know..."). Does approximation preserve the concept, or does it reduce to mutual knowledge?  
  **Status:** **Non-negotiable** for empirical applicability. Theories must address how finite minds represent/achieve common knowledge (e.g., via fixed-point semantics or public events).  
  **Tension:** Directly opposes *Desideratum 1*, which demands an infinite hierarchy.  

  ### **Desideratum 4: Distinguish Knowledge from Belief**  
  **Requirement:** The theory must specify whether common knowledge (certainty) or common belief (probability 1) is fundamental.  
  **Motivation:** In probabilistic settings (e.g., Bayesian games), common belief suffices for equilibrium play (e.g., correlated equilibrium). However, knowledge-based theories (e.g., Aumann structures) require truth and introspection.  
  **Status:** **Parochial.** The "knowledge-first" camp (e.g., epistemic logic) requires certainty; Bayesian frameworks treat common belief as sufficient.  
  **Tension:** None severe, but affects *Desideratum 6* (Aumann’s theorem assumes common knowledge).  

  ### **Desideratum 5: Ground Game-Theoretic Equilibria**  
  **Requirement:** The theory must specify the *minimal* common knowledge needed for key equilibria:  
  - **Nash equilibrium:** Common knowledge of rationality (CKR) *and* strategies.  
  - **Rationalizability:** CKR *without* strategy knowledge.  
  - **Correlated equilibrium:** Common knowledge of rationality *and* the correlating device.  
  **Motivation:** Epistemic foundations program (e.g., Aumann-Brandenburger). Weakens to mutual knowledge in some cases (e.g., \(n\)-level mutual knowledge yields \(n\)-round rationalizability).  
  **Status:** **Non-negotiable** for game-theoretic relevance.  
  **Tension:** Conflicts with *Desideratum 2* (Rubinstein shows fragility) and *Desideratum 3* (infinite CKR for Nash).  

  ### **Desideratum 6: Recover or Reject Aumann’s Agreement Theorem**  
  **Requirement:** The theory must either validate Aumann’s theorem or explain its failure as a pathology.  
  **Motivation:** Aumann’s theorem states that common knowledge of posteriors implies agreement. Real agents disagree persistently. Is this due to unrealistic common knowledge/common prior assumptions?  
  **Status:** **Parochial.** Bayesian frameworks demand recovery; critics view the theorem as revealing idealization flaws.  
  **Tension:** Conflicts with *Desideratum 4*: If common belief suffices, the theorem holds under common priors.  

  ### **Desideratum 7: Explain Attainability**  
  **Requirement:** The theory must explain how common knowledge is generated (e.g., public events, conventions).  
  **Motivation:** *Bootstrapping problem*: Can common knowledge arise from private signals? Lewis (1969) argues public events (e.g., a loud announcement) are necessary. Shared language/conventions may presuppose prior common knowledge.  
  **Status:** **Non-negotiable** for completeness.  
  **Tension:** Conflicts with *Desideratum 3* (finite attainability) and *Desideratum 2* (public events imply exactness).  

  ---

  ### **Flagged Irreconcilable Tensions**  
  1. **Infinite Hierarchy vs. Finite Agents (Desiderata 1 vs. 3):**  
     - *Conflict:* Desideratum 1 demands an infinite hierarchy for robust coordination; Desideratum 3 requires finite realizability.  
     - *Resolution?* Only if common knowledge is redefined (e.g., as a fixed point) or if finite agents approximate it via conventions.  

  2. **Exactness vs. Empirical Applicability (Desiderata 1/7 vs. 2/3):**  
     - *Conflict:* Desiderata 1 and 7 require exact common knowledge for coordination/bootstrapping; Desiderata 2 and 3 show it is unattainable in practice.  
     - *Resolution?* Theories must either weaken "common knowledge" (e.g., to common belief) or accept idealized abstraction.  

  3. **Coordination vs. Fragility (Desiderata 1 vs. 2):**  
     - *Conflict:* Desideratum 1 claims common knowledge enables coordination; Desideratum 2 (Rubinstein) shows that near-common knowledge fails catastrophically.  
     - *Resolution?* Common knowledge must be binary—either fully present or absent—with no "graceful degradation."  

  ---

  ### **Conclusion**  
  A theory of common knowledge must reconcile three core tensions:  
  - The **infinite-regress problem** (how bounded agents attain it),  
  - The **binary threshold** (why approximations fail for coordination),  
  - The **bootstrapping paradox** (how it arises without prior common knowledge).  

  No existing account satisfies all desiderata perfectly. Syntactic (logical) approaches excel at *Desiderata 1 and 5* but fail *3 and 7*. Semantic (possible worlds) and Bayesian approaches address *3 and 4* but struggle with *2 and 6*. Your critique of the iterative hierarchy should target these tensions—especially the incompatibility of *exact infinite common knowledge* with *finite, fallible agents*.
