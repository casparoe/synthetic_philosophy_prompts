   Principle 1: The act of lawbreaking must be aimed at preventing or protesting a grave injustice or harm (the injustice need not be the law being broken, but the act must be in response to an injustice).
   Principle 2: The act must minimize harm to innocent people (or at least not cause disproportionate harm). This includes considering foreseeable consequences and avoiding unnecessary harm.
   Principle 3: The act should be the least harmful or disruptive means reasonably available to achieve the just end (proportionality of means).
   Principle 4: Openness and nonviolence are preferred, but secrecy may be justified when necessary to protect vulnerable individuals (as in the asylum case) or when openness would cause disproportionate harm. However, nonviolence is essential unless in self-defense or defense of others against imminent harm.

   But note: the user distinguishes between the abortion doctor (open) and the restaurant owner (not justified). Why?
