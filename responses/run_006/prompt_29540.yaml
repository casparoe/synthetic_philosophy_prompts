answer: |-
  Maya swirls the dregs of her IPA. "Okay, so I finally finished that Ole Peters paper on ergodicity and the Kelly criterion. Jordan, it's wild. It feels like it completely flips decision theory on its head. It’s not just *what* you maximize, it’s *how* you even conceptualize the average outcome."

  Jordan sets down his whiskey sour. "Maya... come on. Peters is charismatic, I'll give him that. But Samuelson dismantled this whole 'geometric mean maximization is fundamentally different' thing back when bell-bottoms were cool. Kelly is literally just maximizing the expected value of a *logarithmic* utility function. It *is* expected utility theory (EUT)!"

  "But that's *exactly* the point!" Maya leans forward, tapping the coaster. "You're starting from the EUT framework and *stipulating* log utility. Peters is saying the *principle* is different: you care about the *time-average* growth rate of your wealth in a single realized path – because most economic processes are multiplicative and non-ergodic. EUT cares about the *ensemble average* over all possible paths *right now*. That’s a fundamentally different normative stance about what 'rational' even means!"

  Jordan raises an eyebrow. "Hold on. So you're saying the geometric rationality crowd derives Kelly *without* assuming a preference for log? How?"

  "By focusing on the long-run multiplicative growth!" Maya explains. "If you're reinvesting wealth over many periods, the thing that matters for your final wealth isn't the arithmetic average return, it's the geometric average. Kelly maximizes the *growth rate*. EUT maximizes an expectation defined *now*, over possible future states. The ensembles are different! EUT averages over possible worlds at a single time-slice; geometric rationality averages over time in *one* world."

  "Fine," Jordan concedes, "I get the *descriptive* point about multiplicative processes and non-ergodicity. If you're playing repeated identical gambles with reinvestment, sure, Kelly gives you the optimal long-run growth. But that's a *specific context*. Samuelson's point was precisely that this doesn't translate to a *general normative principle*. What about a genuinely one-shot decision? Terminal gamble? No future reinvestment possible. What does 'geometric rationality' prescribe then? You can't time-average a single point!"

  Maya nods slowly. "That's the sharp edge, isn't it? Peters would argue that most significant real-world decisions *aren't* truly terminal one-shots; they happen in the context of an ongoing multiplicative process – life itself, essentially. Your wealth compounds. But okay, grant the pure one-shot. In that *specific* case, maybe the prescriptions converge, or the geometric principle doesn't directly apply. But that doesn't invalidate the principle for the vastly more common case of repeated exposure. The *normative force* of Kelly comes from recognizing that context matters – that the *structure of the gamble over time* dictates what you should care about."

  "See, that's where I think it gets sneaky," Jordan counters, leaning in. "You're smuggling in a preference! By privileging the long-run time-average growth in multiplicative settings as the 'rational' thing to care about, you're *already* making a value judgment. You're *assuming* that maximizing the growth rate of wealth in a single path is the normative goal. EUT is more general – it lets *you* specify your utility function. If you care about terminal wealth in a one-shot, use linear utility. If you care about growth over repeated plays, sure, use log. The principle is the same: maximize expected utility. Peters hasn't found a *new* principle; he's just *derived* why log utility makes sense in multiplicative, repeated settings. He's confusing a *derived implication* for a *fundamental axiom*."

  "But that's circular!" Maya fires back. "You're saying EUT is more general because it lets you choose *any* utility function. But *why* is maximizing the expectation over possible worlds the 'rational' thing to do in the first place? What's the normative justification for aggregating across worlds you'll never experience via an arithmetic average? Peters forces us to confront that. He's saying that for multiplicative processes unfolding over time, the rational thing is to care about the outcome *along the path you actually live*, aggregated multiplicatively. The ensemble average is mathematically convenient but normatively arbitrary in non-ergodic systems. EUT just *stipulates* that ensemble averaging is the way, without deeper justification beyond coherence axioms."

  Jordan drains his glass. "The coherence axioms *are* the justification! Avoiding sure losses, having consistent preferences across gambles... that *is* the bedrock of rationality. Peters hasn't shown those axioms lead to contradictions in non-ergodic settings; he's just saying you might *prefer* a different outcome measure. But preference isn't the same as rationality. The EUT framework *contains* the geometric solution when the utility function and the context align. It doesn't need a new 'ism'."

  Maya sighs. "I think you're missing the reorientation. It flips the perspective: start from the agent experiencing a single sequence over time in a non-ergodic world, *then* derive what makes sense. Don't start from an abstract ensemble of possible worlds and assume averaging them is rational. The lesson *is* deeper: it tells us *when* to use ensemble averages (ergodic systems) and when to use time averages (non-ergodic multiplicative systems). That's a fundamental insight about how to model decisions correctly."

  "So your 'genuinely different normative principle'," Jordan summarizes, "boils down to: 'Care about the time-average growth rate when facing long sequences of multiplicative gambles in non-ergodic systems.' Which, I maintain, is perfectly captured by EUT with log utility. The 'deeper lesson' feels like repackaging."

  "And I maintain," Maya retorts, "that seeing *why* log utility emerges from focusing on the time-average in that specific context reveals that the ensemble-average perspective isn't the only possible, or even always the appropriate, normative foundation. It highlights a potential flaw in EUT's *default* aggregation method."

  **Summary:** They fundamentally disagree on whether the Kelly criterion reveals a new normative principle (geometric rationality) anchored in caring about realized time-averages in non-ergodic systems, or whether it's merely the expected utility solution using a logarithmic utility function, leaving EUT's ensemble-averaging foundation unchallenged.
