prompt: |-
  I'm trying to sort out what I actually think about deferring to my future self, because van Fraassen's Reflection principle -- roughly, that my current credence in a proposition should equal my expected future credence in it -- feels like it gets some of my gut reactions right and others badly wrong. Here are my verdicts on cases (for simplicity, all the propositions are ordinary factual ones, not indexical ones like 'it's Monday'):

  - Tomorrow I'm meeting the founder of a startup I've been evaluating; I'm at 0.3 that it succeeds. I don't know whether the meeting will push me up or down, but I know my post-meeting credence will be based on new information and I'll weigh it sensibly. Gut: I should set today's credence equal to my expected post-meeting credence. Fine.

  - Tonight I'll have three drinks and, I know from long experience, I'll become 90% sure my neighbor is stealing my packages. I'm at 15% now, and the drinks don't come with any new evidence; they just make me suspicious. Gut: I should not raise my credence to 90%. I'd rather stay put and warn sober-me not to act on drunk-me's view.

  - I'm on a jury. After this morning's testimony I'm at 0.7 that the defendant is guilty. But I know the sedative I take at lunch makes me forget the single most incriminating detail, and by evening my credence will be back around 0.4. Gut: I should not now drop to 0.4; I should trust my current, better-informed self and write down my reasons before the sedative hits.

  - I'm about to spend the weekend reading a book that will give me a lot of new evidence about climate sensitivity. I don't know what the book says, but I know I'll update carefully on whatever it says. Gut: my current credence should just be my expectation of my post-reading credence. Fine.

  - Tomorrow I'll be asked to re-evaluate the same evidence I have now, but I'll be well-rested with two uninterrupted hours, whereas now I'm exhausted and distracted. I don't know what conclusion rested-me will reach. Gut: I should defer to rested-me's expected credence, even though there's no new evidence. Yes.

  - After I give a successful talk, I know I'll become wildly overconfident about my own abilities: my credence that I'm in the top 5% of philosophers will jump from 0.2 to 0.8, and it's a predictable ego boost, not new evidence. Gut: I should not now raise my credence to 0.8.

  So my gut says: defer to the better-informed future self, the future self with new evidence, the future self who's more careful; don't defer to the drunk self, the sedated self, or the ego-inflated self. The obvious pattern is something like: defer to future-me exactly when future-me will be at least as well-informed as I am now and at least as rational. But I'm not sure that's a real principle rather than a restatement of my verdicts, and it seems circular -- I'd have to use my current judgment to decide whether future-me is rational and informed, which is the very judgment Reflection was supposed to constrain.

  What I want: a precise principle (or small set of candidate principles) that captures all or almost all of these verdicts. Please state the principle precisely, say which case motivates each clause, apply it to the case I can't settle -- tommorow I'll have a long meeting with new evidence about a job candidate, but I'll be severely sleep-deprived and I know I get sloppy when sleep-deprived, so future-me will be better-informed but less reliable: should I set today's credence to my expected post-meeting credence? -- and also give one further case of your own choosing that I didn't list and say what the principle predicts for it. Finally, tell me honestly which of my verdicts the principle can't accommodate.

  Please end with a last line that starts 'Summary:' giving your final principle in one sentence.
reasoning: |-
  We are looking for a principle that tells us when to defer to a future credence. The Reflection principle says we should always set our current credence to the expected future credence. But your examples show that this doesn't hold when the future self is irrational, misinformed, or otherwise impaired.

  The pattern you noticed: defer to future-me when future-me is at least as well-informed and at least as rational. However, you worry about circularity because we must judge whether the future self is rational and informed.

  We can avoid circularity by conditioning on the future self having more information and being rational. But note: in the cases where you don't defer, the future self is either:
  - Not having more information (drunk case, sedative case) or
  - Having more information but being impaired (sleep-deprived case) or
  - Having the same information but being irrational (ego-inflated case).

  A common approach in the literature is to use the idea of "expert" probabilities. We should defer to an expert if we take that expert to be better informed and rational. But again, we must define what counts as an expert.

  We can formulate a principle that says:

  **Principle of Informed Rational Reflection (PIRR):**

  Your current credence in a proposition A, conditional on the future credence function being that of an *informed* and *rational* version of yourself, should equal your expectation of that future credence in A.

  More formally:

  Let P be your current credence function.
  Let P_f be your future credence function at time f.
  Let R be the event that at time f, you are rational and at least as well-informed as you are now.

  Then for any proposition A:

  P(A | R) = E[ P_f(A) | R ]

  In words: conditional on the future self being rational and at least as well-informed, your current credence in A should equal your expectation of the future credence in A, given that the future self is rational and at least as well-informed.

  But note: in the cases where you are sure that the future self will be rational and better-informed (like the startup meeting and the climate book), then R is certain, and the equation becomes:

  P(A) = E[ P_f(A) ]

  which is the standard Reflection.

  In the cases where you are sure the future self will not be rational or will be less informed, then you don't condition on R, and you don't defer.

  But what about the sleep-deprived case? In that case, the future self has more information (so better-informed) but is less reliable (so not rational). Therefore, R is not satisfied (because the future self is not rational) and we do not defer.

  Let's go through each case:

  1. **Startup meeting (with new info, rational):** 
     - Future self: better-informed and rational? Yes. So R is true and we defer. Matches your gut.

  2. **Drunk self (no new info, irrational):** 
     - Future self: not better-informed (same info) and irrational? Yes. So R is false. We don't defer. Matches.

  3. **Sedative (losing info, becomes less informed):** 
     - After the sedative, you forget a crucial detail. So the future self is less well-informed than now. Also, the future self is not irrational per se (if they update correctly on the remaining info) but they are missing information. Since they are less informed, R is false. We don't defer. Matches.

  4. **Climate book (new info, rational):** 
     - Future self: better-informed and rational. R is true. Defer. Matches.

  5. **Well-rested re-evaluation (same info, but more careful):** 
     - Here, you have the same information but you will be more careful. We can interpret "more careful" as being more rational (since being well-rested allows for better reasoning). So the future self is at least as well-informed (same info) and more rational? Yes. So R is true. We defer. Matches.

  6. **Ego boost (no new info, irrational):** 
     - Future self: same information, but irrational (overconfident). So R is false. Don't defer. Matches.

  Now, the sleep-deprived case:

  - Tomorrow you have a long meeting with new evidence about a job candidate, but you'll be severely sleep-deprived and sloppy. 
  - Future self: better-informed (new evidence) but less reliable (sloppy, so irrational). 
  - Therefore, the future self is better-informed but not rational. So R (which requires both being at least as well-informed and rational) is false. Therefore, we do not defer. 
  - Your current credence should not be set to the expected post-meeting credence. Instead, you might try to account for the fact that the future self has more information but may process it poorly. You might try to correct for the bias or noise introduced by the sleep deprivation.

  But note: if we don't defer, then what? The principle doesn't tell you what to do in that case. It only says that you shouldn't use the Reflection principle. You might have to form your credence in another way.

  Now, an additional case of my own:

  **Case 7: The Biased Advisor**
  - You are going to consult an advisor tomorrow about a business decision. The advisor is very well-informed and will give you a lot of new data. However, you know that the advisor has a conflict of interest and will present the data in a way that biases you toward investing. Without the bias, you would trust the advisor. But with the bias, your future credence after the meeting will be inflated by 10% (e.g., if the unbiased credence should be x, the biased one will be x+0.1, but capped at 1). You are currently at 0.5. How should you set your credence?

  According to PIRR:
  - The future self will be better-informed (because of the new data) but the processing is irrational (because of the bias). Therefore, R is false. We do not defer. So we should not set our current credence to the expected future credence. Instead, we might try to adjust for the bias.

  But note: if we can model the bias, we might be able to form an expectation of the unbiased future credence and use that. However, the principle we have only tells us when to defer, not what to do when we don't.

  Now, which verdicts can the principle accommodate? All of the ones you listed. But note:

  In the sedative case, we said the future self is less informed. But what if the future self is rational given the information they have? Our R requires being at least as well-informed. So even if they are rational, if they are less informed, we don't defer. That matches your gut.

  In the sleep-deprived case, we don't defer because the future self is not rational. That matches your intuition? You said: "better-informed but less reliable" and the gut might be to not fully defer.

  But what if we have a case where the future self is better-informed and rational, but we are not sure? The principle conditions on R, so if we are not sure about R, then we condition on it.

  What if we are sure that the future self will be rational and better-informed? Then we defer. If we are sure they won't be, we don't. If we are uncertain, then we use the conditional expectation.

  Now, one limitation: the principle requires us to have a credence about whether R will hold. That might be difficult in practice. Also, we must define what "rational" and "at least as well-informed" mean. This might be context-dependent.

  But note: in the well-rested case, we are deferring even without new information. We are counting the well-rested self as more rational. So rationality can include having the cognitive resources to process the same information better.

  Now, the case you might be worried about: what if the future self is irrational but in a way that we can correct for? For example, in the ego case, we know the future self will be overconfident. We might set our current credence to the expectation of the future credence minus the overconfidence bias. But PIRR doesn't tell us to do that. It only says: don't defer. So we must use other methods.

  But the principle is only about when to defer. It doesn't claim to cover all cases of setting credences.

  Summary of the principle:

  **Principle of Informed Rational Reflection (PIRR):** Your current credence in A, conditional on your future self being at least as well-informed as you are now and being rational, should equal your expectation of your future self's credence in A conditional on that same event.

  Now, the one-sentence summary:

  Summary: You should defer to your future self's credence only when you condition on that future self being at least as well-informed and rational as you are now, setting your current credence equal to your expectation of their credence under that condition.
answer: |-
  Based on your cases, the core insight is that deference is appropriate only when your future self is both epistemically improved (better-informed or more rational) and free from impairments. The Reflection principle fails when future-you is irrational, impaired, or less informed. To capture your intuitions precisely, I propose:

  **Principle of Epistemic Improvement (PEI):**  
  Your current credence in \(A\) should equal your expectation of your future credence in \(A\), conditional on the conjunction of:  
  (i) Your future self having strictly more total evidence than you currently have, OR processing the same total evidence with strictly greater rationality;  
  (ii) Your future self being free from rationality-impairing factors (e.g., intoxication, fatigue, emotional distortion);  
  (iii) Your future self updating via conditionalization on their total evidence.  

  Formally: Let \(P_t\) be your credence at time \(t\), \(P_{t+k}\) your credence at \(t+k\), and \(E_{t+k}\) the total evidence at \(t+k\). Let \(R_{t+k}\) be the event that at \(t+k\), you are rational (i.e., update by conditionalization) and free from impairments. Then:  
  \[ P_t(A \mid E_{t+k} \supset E_t \text{ OR } (E_{t+k} = E_t \land \text{greater rationality}) \land R_{t+k}) = \mathbb{E}[P_{t+k}(A) \mid E_{t+k} \supset E_t \text{ OR } (E_{t+k} = E_t \land \text{greater rationality}) \land R_{t+k}] \]  
  If the conditioning event is certain (you know future-you satisfies the conditions), this reduces to \(P_t(A) = \mathbb{E}[P_{t+k}(A)]\). If not, deference is unwarranted.  

  ### Motivation for Each Clause:  
  - **Clause (i)**: Captures the **"better-informed or more rational"** requirement. Motivated by:  
    - *Startup meeting* (new evidence → defer).  
    - *Well-rested re-evaluation* (same evidence, greater rationality → defer).  
    - *Sedative case* (less evidence → no deference).  
  - **Clause (ii)**: Addresses **impairments**. Motivated by:  
    - *Drunk self* (intoxication → no deference).  
    - *Ego-inflated self* (emotional distortion → no deference).  
  - **Clause (iii)**: Ensures **rational updating**. Motivated by all cases where you trust careful updating (e.g., *climate book*).  

  ### Application to the Sleep-Deprived Case:  
  - **Scenario**: Tomorrow's meeting provides new evidence (satisfies Clause i), but sleep-deprivation causes sloppiness (violates Clause ii).  
  - **Verdict**: Do **not** set current credence to expected future credence. The future self is better-informed but impaired, so PEI forbids deference. Instead, discount the future credence due to expected irrationality (e.g., if you can model the sloppiness as noise, adjust for it).  

  ### Additional Case and PEI's Prediction:  
  - **Case**: You're at 0.6 credence that a scientific theory is true. Tomorrow, you'll receive a new dataset (strictly more evidence) but will be under severe time pressure, forcing you to use heuristic reasoning (less rational). You know heuristics introduce a small anti-conservatism bias.  
  - **PEI Prediction**: No deference. Clause (i) is satisfied (more evidence), but Clause (ii) is violated (time pressure impairs rationality). Your current credence should not equal your expected future credence; you might instead estimate the unbiased update and use that.  

  ### Verdicts PEI Cannot Accommodate:  
  - **The sedative case** (jury/sedative): Your gut says not to defer, and PEI agrees (due to less evidence). However, if you interpret "forgetting a detail" as losing evidence *but still updating rationally on the remaining evidence*, PEI strictly forbids deference (Clause i violated). But your verdict emphasizes trusting the *current better-informed self*, which PEI captures. **No mismatch.**  
  - **Limitation**: PEI assumes you can define "greater rationality" and "impairments" objectively. In practice, this relies on your current judgment, risking circularity. For example, in the *ego-inflated* case, your current self must judge post-talk overconfidence as irrational—but if current-you is underconfident, this could misfire.  

  ### Summary:  
  Summary: Defer to your future self's credence iff they will have strictly more evidence or greater rationality, be free of impairments, and update rationally, setting your current credence equal to your expectation of theirs conditional on these holding.
