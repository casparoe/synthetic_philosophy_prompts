answer: |-
  As a fellow philosopher immersed in decision theory, I appreciate the nuance of your question. The distinction between synchronic and diachronic money pumps cuts deep into our understanding of rationality, agency, and time. Let me work through this carefully, as I would in my own reflections.

  Begin with the classic synchronic money pump. The agent possesses simultaneous, intransitive preferences: A ≻ B, B ≻ C, and C ≻ A. A bookie, exploiting this structure, proposes a series of trades: starting from A, they offer to swap A for C plus a small payment ε. Given C ≻ A, the agent accepts, paying ε to hold C. Next, the bookie offers to swap C for B plus another ε. With B ≻ C, the agent pays again. Finally, the bookie offers to swap B for A plus yet another ε. Since A ≻ B, the agent pays a third time, returning to A but poorer by 3ε. The cycle can repeat indefinitely. The normative target here is the synchronic preference ordering itself. The argument assumes that preferences are stable and action-guiding at the moment of choice, and it concludes that intransitivity is inherently exploitable because it violates a structural axiom necessary for coherent choice. The defect is logical: the set of preferences cannot be jointly satisfied without cyclical dominance.

  The diachronic money pump operates differently. Consider an agent who, at t₁, prefers saving money for the future but knows that at t₂, when tempted by immediate gratification, they will prefer spending. At t₁, they might pay for a commitment device (e.g., locking funds in a term deposit) to prevent spending at t₂. Yet, when t₂ arrives, their preferences shift: they now value immediate consumption highly enough to pay a fee to break the commitment. After paying to access the funds, they spend. The bookie profits twice: first from selling the commitment, then from releasing it. The normative target shifts to the inconsistency across time. The argument assumes predictable preference reversals and concludes that such dynamic inconsistency makes the agent vulnerable to exploitation. Crucially, it highlights a failure of planning: the agent’s t₁ plan for t₂ is overturned by their t₂ self.

  Now, comparing the two: Both share a core mechanism—sequential trades exploiting preference-driven choices to extract money cyclically. Both pressure agents toward consistency norms. But the differences are profound. The synchronic argument targets a logical property of the preference relation itself—transitivity as a formal requirement. The diachronic argument targets a temporal pathology: the inability of an agent to align their future actions with their prior plans and evaluations. The synchronic case assumes a single evaluative standpoint; the diachronic case involves multiple temporal standpoints with conflicting evaluations. This introduces new philosophical dimensions: Does the t₁ self have legitimate authority over the t₂ self? What constitutes rational resolve in the face of changing desires? These questions of intertemporal authority and identity have no analogue in the synchronic pump.

  This brings us to reducibility. Can we reframe the diachronic pump as synchronic by indexing outcomes to time? For example, treat "saving-at-t₁" and "spending-at-t₂" as distinct objects in a grand synchronic preference ordering. Formally, we might construct a cycle: the agent prefers "commit-at-t₁-and-save-at-t₂" to "no-commitment-and-save-at-t₂," prefers "no-commitment-and-spend-at-t₂" to "commit-at-t₁-and-save-at-t₂" (modeling their t₂ preference reversal), and so on. Superficially, this mirrors synchronic intransitivity. But this reduction loses something essential: the diachronic flow of agency. In the indexed model, all choices are "now," collapsing the temporal distance that defines the problem. The agent doesn’t experience indexed outcomes simultaneously; they live through time, with later selves inheriting decisions made by earlier ones. The indexed approach obscures the dynamic process of regret, reconsideration, and the struggle to bind one’s future self. More critically, it sidesteps the normative heart of the diachronic pump: the question isn’t just about preference ordering, but about whether an agent can—or should—enforce past decisions against present contrary desires. The reduction turns a problem of diachronic self-governance into a static puzzle, ignoring the phenomenology of time and the ethics of commitment.

  My assessment, then, is that we have two distinct arguments sharing a name and a superficial mechanism, but differing fundamentally in their targets and implications. The synchronic pump exposes a defect in the static structure of preference. The diachronic pump exposes a defect in the diachronic structure of agency—the failure to coordinate selves across time. Treating the latter as merely an application of the former risks neglecting the unique temporal dimensions of identity, authority, and resolve that animate discussions in dynamic choice theory. While both argue for consistency, the nature of that consistency differs: logical coherence versus narrative coherence of the self over time. The diachronic pump isn’t just the synchronic argument stretched over time; it’s an argument about time itself and what it demands of us as temporally extended agents. If I were presenting this seminar, I would frame them as siblings—sharing family resemblances but addressing different ailments of rational agency. The synchronic pump cements transitivity as a cornerstone of rational preference; the diachronic pump compels us to confront how we might, or might not, hold together as persons across the flux of time.
