answer: |-
  You've hit on one of the **most fundamental and fiercely debated distinctions in the philosophy of mind and consciousness science:** the split between **phenomenal consciousness (P-consciousness)** and **access consciousness (A-consciousness)**. This terminology was introduced by philosopher **Ned Block** in his highly influential 1995 paper "On a Confusion about a Function of Consciousness."

  Here's the breakdown of your query:

  1.  **The Distinction You're After:**
      *   **Phenomenal Consciousness (P-consciousness):** This is the "what it's like" aspect. It's the subjective, qualitative feel of an experience – the redness of red, the painfulness of pain, the sound of a trumpet. *This is the side you feel people often collapse when they focus only on reportability.* Blindsight patients lack P-consciousness for stimuli in their blind field.
      *   **Access Consciousness (A-consciousness):** This is the "availability for global control" aspect. Information is A-conscious if it's poised for direct rational control of thought and action, available for verbal report, and usable by the "global workspace" of the mind (the system that integrates information for widespread use). Blindsight patients *do* have A-consciousness for the information in their blind field – they can act on it (guess) and report *that* they are guessing, even though they lack the phenomenal experience.

  2.  **Why Your Intuition is Spot On:**
      You're absolutely right that many researchers (especially in cognitive science and neuroscience) often operationalize "consciousness" *solely* in terms of **reportability**, **availability for decision-making**, or **global broadcast** (e.g., Global Workspace Theory - Baars, Dehaene). This *does* effectively collapse the distinction into just A-consciousness. Block argues this is a mistake, as it ignores the core "hard problem" of subjective experience (P-consciousness), which blindsight so clearly highlights.

  3.  **Is the Split Real?**
      This is **the** central controversy.
      *   **Proponents (like Block, Chalmers):** Argue the split is real and essential. Blindsight is the prime evidence: information is accessed (A) without being experienced (P). They point to other phenomena like masked priming (information influences behavior without conscious awareness) and potentially rich experiences in dreams or altered states that are hard to report upon waking.
      *   **Opponents (like Dennett, O'Regan, Noë, many GWT proponents):** Argue that "consciousness" *just is* access. They contend:
          *   Phenomenal consciousness *is* a matter of information being globally available (A-consciousness).
          *   Blindsight demonstrates *partial* access, not a complete absence of consciousness for that information. The patient reports *something* (the urge to guess, maybe some vague feeling of presence).
          *   The idea of rich phenomenal experience without *any* access (reportability, influence on thought/action) is incoherent or untestable. How could you ever know it exists? If it has no functional consequence, it might not even be a meaningful concept.

  4.  **Edge Cases & The Reverse Direction (P without A?):**
      This is where things get really contentious. Finding pure P-consciousness without *any* A-consciousness is incredibly difficult, as any evidence for it requires some form of report or behavioral trace, which implies access. However, proponents point to phenomena suggesting a *dissociation* where phenomenal experience might be richer or different than what can be reported or accessed in the moment:
      *   **Fringe Consciousness / Inattentional Blindness:** You might have a vague, peripheral sense of something (P?) without being able to report details or even its presence until attention is directed (A). (Debated: Is this weak P/A or something else?)
      *   **Subliminal Perception (Masked Priming):** While the prime is typically considered unconscious, some argue very weak phenomenal fragments might exist without sufficient access for report or identification. (Highly debated).
      *   **Richness of Visual Experience:** Does your visual field contain a detailed, stable, high-resolution panorama (rich P), or is only the attended center detailed, with the periphery filled in based on expectations and sparse input (implying less P than we think)? Experiments like "change blindness" suggest we don't have as rich a *accessible* representation as we feel we do. Is the *feeling* of richness itself part of P-consciousness?
      *   **Tip-of-the-Tongue State:** You have a strong feeling (P) of knowing a word, knowing its properties, even "hearing" part of it, but cannot access the word itself for production (lack of full A).
      *   **Charles Bonnet Syndrome:** Vivid, complex visual hallucinations experienced by people with vision loss. Patients know they aren't real but experience the phenomenal qualities vividly. Reportability is high *after* the experience, but *during* it, the content might not be controllable or influence beliefs in the same way as veridical perception (a potential subtle dissociation).
      *   **Dreams:** Upon waking, we often recall vivid phenomenal experiences (P) that we had little to no ability to rationally access, report, or control *during* the dream (reduced A). The experience itself might be phenomenally rich while the dreamer lacks meta-cognitive access.
      *   **Anesthesia & Epileptic Auras:** Reports of vague, ineffable feelings or sensations during states where full access consciousness is impaired.

  **Key Controversies Around "P without A":**

  *   **The Reportability Problem:** How can you demonstrate the existence of phenomenal experience *without* some form of report (which requires access)? Proponents argue for indirect evidence (neural correlates, retrospective reports under specific conditions, behavioral priming even without subjective report) or conceptual necessity.
  *   **Grain of Access:** Is access all-or-nothing, or graded? Opponents argue that cases of "P without A" are actually cases of *partial* or *degraded* access, not a complete absence.
  *   **The "Hard Problem":** Proponents argue that even if access is necessary for report, it doesn't explain *why* access is accompanied by subjective feel. The core mystery of P-consciousness remains distinct.

  **In Summary:**

  *   **The Name:** The distinction is **Phenomenal Consciousness (P-consciousness) vs. Access Consciousness (A-consciousness)** (Ned Block).
  *   **The Status:** It's a highly influential and widely discussed framework, considered essential by many philosophers and some scientists to capture the core intuition driving the "hard problem" of consciousness. However, it is **not universally accepted**, with many cognitive scientists and neuroscientists viewing consciousness primarily through the lens of access/reportability/global availability.
  *   **The Reverse Edge Cases:** Finding pure P without *any* A is extremely difficult and controversial. The main battlegrounds involve phenomena like fringe consciousness, richness of experience, dreams, altered states, and cases where phenomenal qualities seem present but inaccessible for full report or rational control at the moment (Tip-of-the-tongue, Charles Bonnet, some auras). Opponents argue these always involve *some* form of access.

  Block's P/A distinction is precisely the conceptual tool you need to carve consciousness at the joint you're perceiving. Delving into his work and the subsequent debates (especially responses from Dennett and Global Workspace theorists like Dehaene) will give you the deep dive you're looking for.
