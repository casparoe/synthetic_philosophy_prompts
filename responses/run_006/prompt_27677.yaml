  In previous cases, no branching. Mars: original destroyed, one copy. Transplant: one person. Injury: one person, but no continuity. So branching is new. She might reject both as the original because identity can't split.

  But she could say both are the original, but that would be a new situation. The user's friend might be uncomfortable with that, leading her to say neither is truly the original.

