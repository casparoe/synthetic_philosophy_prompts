answer: |-
  Based on your description, your friend has a fascinatingly consistent pattern of intuitions about personal identity. Her verdicts prioritize psychological continuity over physical continuity *in most cases*, but with a subtle twist that reveals a deeper rule. I'll break this down step by step: the implied rule, alternative rules that *also* fit her past judgments, predictions for the split-brain case, and a follow-up scenario to pinpoint her exact rule.

  ### Her Likely Rule: Non-Branching Psychological Continuity
  - **What it means**: A person survives if there's unbroken continuity of memories, personality, and consciousness from their past self to a future self—*as long as this continuity doesn't split into multiple branches*. Physical continuity (e.g., the same brain or body) is neither necessary nor sufficient on its own. What matters is the preservation of psychological traits *without duplication*.
  - **Why it fits her past verdicts**:
    - **Mars copy**: The copy has identical psychology (memories, personality), and since the original is destroyed, there's no branching. Continuity is linear → survival.
    - **Brain transplant**: The same brain (with its psychology intact) moves to a new body. No branching occurs → survival.
    - **Brain injury**: The psychology is erased/altered, so there's no continuity of the "self" → no survival, even with the same brain and body. Physical continuity alone isn't enough.

  This rule emphasizes psychological connectedness but treats branching (e.g., two copies claiming to be "you") as a dealbreaker for identity. It's a hybrid view inspired by philosophers like Derek Parfit, but your friend seems to apply it intuitively.

  ### Alternative Rules That Also Fit Her Past Verdicts
  Surprisingly, two other rules could explain her judgments just as well—*until* the split-brain case forces a divergence. Here's how they stack up:

  1. **Psychological Continuity (No Branching Requirement)**  
     - **What it means**: Survival requires preserved memories, personality, and consciousness, regardless of physical continuity. Branching is acceptable—multiple copies could *all* be "you."  
     - **Fits past cases? Yes**:  
       - Mars copy: Psychology preserved → survival.  
       - Brain transplant: Psychology preserved → survival.  
       - Brain injury: Psychology destroyed → no survival.  
     - **Weakness**: It can't explain why she *might* reject survival in branching cases (like the split-brain scenario). If she accepts branching, this rule holds; if not, it fails.

  2. **Brain Continuity (with Psychological Threshold)**  
     - **What it means**: Survival requires the *same physical brain* to persist, but *only if* it retains enough psychology (e.g., memories/personality). If the brain is destroyed or loses psychology, identity ends.  
     - **Fits past cases? Yes**:  
       - Mars copy: No original brain → no survival? *Wait—this seems to clash, but it doesn't:* She might view the copy as having a "new" brain, so survival shouldn't occur. *But she said it does*. To reconcile, we add a twist: if the original brain is destroyed *and* replaced by an identical one, it "counts" as continuous through replication.  
       - Brain transplant: Same brain → survival.  
       - Brain injury: Same brain but psychology lost → no survival.  
     - **Weakness**: It's messy. Why accept the Mars copy (no physical brain) but reject a brain-damaged person (same physical brain)? The rule must arbitrarily treat "exact replication" as equivalent to physical continuity.

  ### Prediction for the Split-Brain Case
  - **What she'll likely say**: *Neither* of the two resulting people is truly the original "you." They're both entirely new people, or at best, imperfect copies. The original person is gone.  
  - **Why?**  
    Her rule (non-branching psychological continuity) treats the split as a fatal violation. Even though both halves inherit the original's psychology, the branching itself destroys identity. There are now *two* streams of consciousness, neither uniquely continuous with the past "you." This avoids the paradox of two people claiming to be one.  
  - **What alternatives would say**:  
    - **Psychological Continuity (branching allowed)**: Both people are equally "you."  
    - **Brain Continuity**: Neither is "you" because the original brain is destroyed (split ≠ intact brain). If she accepts replication (like Mars), *one* might be "you" if she arbitrarily picks a hemisphere as "primary"—but this feels inconsistent.  

  **Why I bet on non-branching psychological continuity**:  
  - It perfectly captures her Mars copy verdict (psychology matters more than physics) *and* her brain injury verdict (psychology is necessary). The branching issue is the only thing that explains her likely discomfort with the split case. She seems to value the *uniqueness* of identity, which branching violates.  

  ### Follow-Up Scenario to Settle the Rule
  To confirm whether she uses non-branching psychology or one of the alternatives, propose this:  
  - **"The Star Trek Transporter Glitch"**: A machine scans your brain, creates an exact copy on Mars, *but fails to destroy the original*. Now there are two of you—one on Earth (original body/brain) and one on Mars (copy). Both have identical memories up to the scan and both insist they're "you." Who survives?  

  - **How this settles the rules**:  
    - **If she says only the Earth original survives**: She's using **non-branching psychological continuity**. Branching (two copies) breaks identity, so the Mars copy is a new person. Earth "you" survives because continuity was never interrupted.  
    - **If she says both survive as "you"**: She's using **psychological continuity (branching allowed)**. Identity can multiply.  
    - **If she says only the Mars copy survives (or neither)**: She's likely using **brain continuity with replication quirks**. This would be inconsistent unless she adds caveats (e.g., "the copy inherits identity if the original is meant to be destroyed").  

  This scenario isolates branching as the key variable, making her underlying rule obvious. If she rejects *both* copies in the glitch case, she might have a more exotic view (e.g., "you" only exist in the moment), but her past focus on "survival" makes this unlikely.  

  ### Final Thoughts
  Your friend's intuitions are sharp—she's intuitively landed on a position close to Parfit's "reductionist" view, where identity isn't a deep fact but a matter of psychological connectedness. If she rejects survival in the split-brain and transporter-glitch cases, it suggests she values narrative coherence: a person's story must have a single "thread." If you test this, report back—I'd love to hear if the prediction holds!
