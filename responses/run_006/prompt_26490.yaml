  Action vs. omission distinction. Legal and everyday views treat them differently. The theory must clarify if this is metaphysical or pragmatic. Important to handle, but maybe some flexibility here since pragmatics might suffice.

  Preemption with omissions. Two failures, either sufficient but neither necessary. Classic case like two assassins not acting. The theory must handle overdetermination without making causation redundant. Non-negotiable for robustness.

  Compatibility with general causation theories like counterfactual or process. Whatever the correct theory, omissions must fit within it. Non-negotiable for coherence.

  Now, deeper needs. The user might be looking for whether a unified theory is possible. Tensions between desiderata, like proliferation vs. norm-dependence, could show inherent contradictions. Highlighting joint unsatisfiability is crucial here. Also, they might need this for academic work, so clarity and rigor are essential. Ensuring each desideratum is well-motivated with cases and priorities. Flagging conflicts will help them decide which trade-offs are acceptable. Their unspoken need is likely to determine if causation by omission is feasible or if it's better to treat omissions differently.
answer: |-
  Here is a comprehensive list of desiderata for a theory of causation by omission, structured around your pressure points, with justifications, priority assessments, and flags for tensions:

  **Core Desiderata for a Theory of Causation by Omission**

  1.  **Avoid Proliferation / Prevent Vacuity (Proliferation Problem):**
      *   **Requirement:** The theory must not imply that *every* possible omission that could have prevented an outcome is a cause of that outcome. It must provide principled criteria to distinguish relevant, "true" causal omissions from the infinite irrelevant background of non-occurrences.
      *   **Case:** Not watering the plant. The theory must explain why the neighbor (who promised) caused the death by omission, but the Queen of England (who had no connection) did *not* cause it, despite both failing to water it.
      *   **Priority:** **Non-Negotiable.** Failure here renders causation meaningless.
      *   **Tension Flag:** Directly conflicts with overly simplistic counterfactual analyses (if causation is *only* defined as counterfactual dependence).

  2.  **Resolve Norm-Dependence Objectively (Norm-Dependence Problem):**
      *   **Requirement:** The theory must either (a) explain how norms, expectations, or duties *genuinely constitute part of the causal relation* itself in an ontologically robust way, or (b) provide a completely non-normative (e.g., physical, probabilistic, dispositional) basis for distinguishing causal omissions that does not covertly rely on norms.
      *   **Case:** Why is the lifeguard's failure to save the drowning swimmer a cause, but a random passerby's failure isn't? Intuition points to duty. The theory must explain this without making causation fundamentally subjective or context-dependent in an unacceptable way.
      *   **Priority:** **Non-Negotiable.** Causation is widely held (and often required for moral/legal responsibility) to be an objective feature of the world.
      *   **Tension Flag:** Tensions with purely descriptive, physical-process theories of causation; also tensions with avoiding proliferation without norms.

  3.  **Account for the Action/Omission Distinction:**
      *   **Requirement:** The theory must explicitly address the intuitive and practical distinction between *causing harm by acting* (e.g., pushing someone) and *causing harm by omitting to act* (e.g., failing to save them). It must clarify whether this distinction is:
          *   (a) A fundamental metaphysical difference in the causal relation itself.
          *   (b) A difference in the *type of event* (positive action vs. absence/omission) that causally relates, but with the causal relation being the same kind.
          *   (c) Primarily a pragmatic, moral, or legal distinction not grounded in the metaphysics of causation.
      *   **Case:** Legal doctrines (murder vs. manslaughter by omission), moral intuitions (killing vs. letting die).
      *   **Priority:** **Non-Negotiable.** Any adequate theory must engage with this pervasive and practically significant distinction.
      *   **Tension Flag:** Process theories often struggle to equate actions and omissions causally; counterfactual theories may struggle to explain the moral/legal weight difference if the causal relation is the same.

  4.  **Handle Preemption and Overdetermination by Omission:**
      *   **Requirement:** The theory must correctly resolve cases where multiple omissions are each independently sufficient to cause an outcome, but neither omission is necessary (since the other would have caused it anyway). It must avoid implying that no omission caused the outcome (the "problem of redundant causation").
      *   **Case:** Bodyguard A *and* Bodyguard B independently decide not to save the VIP from an assassin. Each omission alone is sufficient for death; neither is necessary (because the other would have sufficed). Intuition: Both caused the death by omission.
      *   **Priority:** **Non-Negotiable.** A theory of causation must handle standard causal structuring problems like preemption, including omission variants.
      *   **Tension Flag:** Challenges simplistic counterfactual necessity (NCC) accounts. Process theories may struggle to find a physical "process" for an omission.

  5.  **Consistency with a General Theory of Causation:**
      *   **Requirement:** The account of causal omissions must be compatible with, and ideally derivable from, a plausible general theory of causation (be it counterfactual, process, probabilistic, interventionist, dispositional, etc.). It cannot be an ad-hoc addition.
      *   **Case:** Whatever the correct analysis of positive causation (e.g., Suzy's rock causing the window to break), the analysis of omissions (e.g., Billy's failure to catch the rock causing the break) should follow the same fundamental principles without contradiction.
      *   **Priority:** **Non-Negotiable.** Causation by omission must be a genuine *species* of causation, not a different phenomenon entirely.
      *   **Tension Flag:** Major source of difficulty. Each general theory faces unique challenges integrating omissions (e.g., counterfactuals face proliferation; process theories struggle with absences; interventionism needs to define interventions on omissions).

  **Additional Important Desiderata (Highly Desirable, Potentially Negotiable):**

  6.  **Explain Causal Relevance / Salience:**
      *   **Requirement:** Provide a basis for why we *select* certain omissions as causes in explanation/practice, even if others are technically causal (especially if proliferation is somewhat constrained but not eliminated).
      *   **Case:** In the plant death, we focus on the neglecting neighbor, not the uninvolved Queen, even if both satisfy minimal causal criteria. This relates to norms, interests, and explanatory goals.
      *   **Priority:** Highly Desirable, but potentially handled by pragmatics *after* the core causal relation is established. Negotiable if core desiderata are met.
      *   **Tension Flag:** Risks blurring the line between metaphysics and pragmatics.

  7.  **Allow for Degrees of Causation / Contribution:**
      *   **Requirement:** Accommodate the intuition that some omissions contribute more strongly to an outcome than others, or that omissions can be partial causes alongside positive events.
      *   **Case:** The plant's death was caused *partly* by lack of rain (omission) and *partly* by overly hot sun (positive event). The security guard's momentary distraction (omission) contributed less to the theft than the thief's sophisticated tools (positive event).
      *   **Priority:** Highly Desirable, especially for nuanced moral/legal reasoning. Negotiable if a binary theory is otherwise compelling.

  8.  **Avoid Commitment to Negative Events (if possible):**
      *   **Requirement:** Provide an account without ontologically committing to absences/omissions as genuine "negative events" in the world's fundamental ontology, if this clashes with a preferred sparse ontology. Alternatively, justify such entities robustly.
      *   **Case:** Metaphysical concerns about the reality of "non-waterings" or "non-savings" as concrete existents alongside rocks and atoms.
      *   **Priority:** Desirable for ontological parsimony, but potentially Negotiable if the best theory requires negative events.

  **Analysis of Tensions and Joint Unsatisfiability:**

  *   **The Core Trilemma:** The most significant tension lies between **Avoiding Proliferation (1)**, **Resolving Norm-Dependence Objectively (2)**, and **Consistency with a General Theory (5)**.
      *   *Tension (1) & (5):* Simple counterfactual theories (Lewisian) satisfy (5) but notoriously fail (1) – they imply massive proliferation. Fixing (1) within counterfactualism (e.g., adding norms, salience constraints) often violates (2) or makes the theory ad-hoc, compromising (5).
      *   *Tension (2) & (5):* Process theories (e.g., Salmon/Dowe) offer strong objectivity (2) via physical processes but struggle profoundly with omissions (5 & 1) because absences aren't physical transfers. Making them consistent might require stretching "process" beyond recognition or abandoning physicalism.
      *   *Tension (1) & (2):* Objectively avoiding proliferation without norms is incredibly difficult. Attempts using probabilities, dispositions, or capacities face challenges distinguishing the relevant probabilities/dispositions of the neighbor from those of the Queen.

  *   **Action/Omission Distinction (3):** This desideratum intensifies the core trilemma. If the theory equates actions and omissions causally (metaphysically same relation), it struggles to explain the intuitive/moral distinction without resorting to pragmatics (which might feel unsatisfying). If it posits a metaphysical difference, it becomes harder to satisfy Consistency (5) with a *unified* general theory.

  *   **Preemption (4):** While a specific technical hurdle, resolving it often pushes theories towards specific structures (e.g., production-based accounts, specific variants of counterfactuals like "actual difference makers") that may conflict with other desiderata, particularly parsimony or consistency.

  **Conclusion: The Likely Outcome**

  Your intuition that the list reveals deep problems is correct. **Satisfying all non-negotiable desiderata (1-5) simultaneously with a single, elegant theory appears highly unlikely, if not impossible, given the fundamental tensions identified, particularly within the Core Trilemma (1, 2, 5).**

  *   **Counterfactual Theories:** Struggle most with proliferation (1) and struggle to achieve true objectivity (2) without smuggling in norms. Handle preemption (4) with tweaks. Action/omission distinction (3) is often treated as pragmatic.
  *   **Process/Production Theories:** Struggle fundamentally with omissions (5 & 1) due to lack of physical process/transfer. Excel at objectivity (2). Action/omission distinction (3) is forced to be metaphysical.
  *   **Interventionist/Manipulationist Theories:** Can potentially handle proliferation (1) via context/contrast classes and objectivity (2) by focusing on invariant relationships, but defining interventions on omissions is non-trivial. Consistency (5) is a goal. Distinction (3) often becomes pragmatic.
  *   **Normative/Duty-Based Theories:** Directly tackle (2) and (1) by building norms/duties into the causal relation itself. But this severely compromises objectivity (2) if norms are non-objective, and clashes dramatically with Consistency (5) for general causation involving positive events. May handle (3) easily.

  **Result:** Adopting a theory of causation by omission likely involves significant **trade-offs**. You will need to prioritize which desiderata are *most* important to *you* (e.g., is avoiding norms paramount? Is ontological parsimony critical? Must causation be purely physical?) and which tensions you are willing to accept. The list itself strongly suggests that no theory currently achieves full satisfaction of all core demands without significant cost or controversy. The pressure points reveal deep fault lines in our concept of causation itself when applied to absences.
