prompt: |-
  i'm a backend engineer on a fraud-detection team, and i keep running into these "dutch book" arguments in the rationalist-adjacent parts of the internet. as far as i can tell the claim is: if your probabilities don't obey the usual rules, someone can offer you a bunch of bets that each look fine on their own but guarantee you lose no matter what happens. i dont have any formal philosophy background, but that sounds like it should cash out as a concrete bug check for a system like ours. we run several models plus a couple of human reviewers, each outputs a probability that a transaction is fraud or something adjacent, and we combine those into a single score we auto-block on. the stakes are real (false blocks cost us merchants, missed fraud costs us chargebacks) and we ship weekly.

  please write me a decision procedure my team could actually run on our outputs, like an hour on a friday, nobody on the team has read any of this stuff. give me the checks in order, what exactly counts as a pass or fail for each, what to do when we can't get a clean number (sometimes a model only gives a ranking or a one-sided risk score, and sometimes the events aren't exact logical complements — one model says "fraud", another says "abuse", another says "chargeback risk"), and which steps are real checks versus judgment calls dressed up as checks.

  then run the procedure on three cases: (1) two models give 0.65 and 0.45 for "fraud" and "not fraud" on the same transaction; (2) a model gives probabilities over four mutually exclusive, exhaustive outcomes and they sum to 1.15; (3) our final outputs are always coherent because we clip and renormalize everything at the end, even though the raw model outputs are all over the place. and be honest about what the procedure can't catch — i suspect it can't tell us whether our numbers are actually right in the long run. include the case where the procedure tells us something we won't want to hear, like our headline score isn't a probability at all and we should stop calling it one.
reasoning: |-
  We are creating a decision procedure for checking the coherence of probability outputs from a fraud detection system. The goal is to detect situations where the probabilities might be "dutch bookable" (i.e., violating the rules of probability in a way that allows a sure loss).

  The basic rules of probability that we care about for coherence:
  1. Probabilities should be between 0 and 1.
  2. For mutually exclusive and exhaustive events, the probabilities should sum to 1.
  3. For any two events A and B, P(A or B) = P(A) + P(B) - P(A and B). However, we might not always have joint probabilities, so we focus on simpler checks.

  Given the constraints (time, expertise, and data limitations), we design a procedure that can be run in about an hour on a Friday. We will break it down into steps.

  Step 0: Preparation
  - Gather the outputs for a set of transactions (a sample, e.g., from the last week) for which we have the raw model outputs and the final combined score. We need the outputs for the same set of transactions from all models and the final score.

  Step 1: Check for basic probability range
  - For each output that is claimed to be a probability (for a specific event, e.g., "fraud"), check that it lies in [0,1].
  - If an output is not in [0,1], it fails.
  - How to handle non-probability outputs? If a model gives a score that is not a probability (like a ranking or a one-sided risk score) but we are using it as if it were a probability, then we need to flag that. We might need to recalibrate or stop interpreting it as a probability.

  Step 2: Check for complementarity (if applicable)
  - For events that are logical complements (like "fraud" and "not fraud"), check that for the same transaction, the probabilities for the event and its complement sum to 1 (within a tolerance, e.g., 0.01 to account for rounding).
  - If we have two outputs for complementary events and they don't sum to 1, that's a fail.
  - However, note: sometimes models might not output both. We only check when both are present.

  Step 3: Check for mutual exclusivity and exhaustiveness (if applicable)
  - If we have a set of outcomes that are mutually exclusive and exhaustive (e.g., fraud types that cover all possibilities and don't overlap), then the probabilities for a transaction should sum to 1 (within a tolerance).
  - If they don't, that's a fail.

  Step 4: Check for coherence in conditional probabilities (if available)
  - This is more advanced and might be skipped in the one-hour check. But if we have models that output conditional probabilities (e.g., P(A|B)) and we also have P(B) and P(A and B), we can check if P(A|B) * P(B) ≈ P(A and B). However, this requires joint events and might be rare.

  Step 5: Check the final combined score
  - The final score should also be a probability in [0,1]. Check that.
  - Also, if the final score is derived from multiple models, we might check if it is coherent with the inputs. However, this is complex and might be beyond the scope. Instead, we can do a sanity check: if the inputs are probabilities and we are combining them (like averaging or a weighted sum), then the output should be in [0,1] and, if the inputs are coherent, the output should be too. But note: even if inputs are coherent, a bad combination might break coherence.

  Step 6: Handling non-probabilistic outputs
  - If a model only gives a ranking or a one-sided score, then we cannot run the above checks. We must note that this model is not producing probabilities and might require calibration. We should not treat its output as a probability without calibration.

  Step 7: Judgment calls
  - Some steps are real checks (like Step 1, Step 2, Step 3) because they are mathematical requirements.
  - Step 6 is a judgment call: we are flagging that a model doesn't output a probability and we are using it as one? That's a problem.

  Now, we run the procedure on the three cases:

  Case 1: Two models give 0.65 and 0.45 for "fraud" and "not fraud" on the same transaction.
  - Step 1: Both are in [0,1] -> pass.
  - Step 2: They are complementary events? We assume they are. Then 0.65 + 0.45 = 1.10, which is not 1.00. So we fail. This means these two outputs are incoherent together.

  What to do? We might have to investigate why they don't sum to 1. Maybe they are from different models and not designed to be complementary? Or maybe one model outputs P(fraud) and the other outputs P(not fraud) but they are independent models? In that case, we shouldn't treat them as a pair for complementary events. But if the system is designed such that for the same transaction, we have two outputs that are supposed to be complementary, then this is a problem.

  Case 2: A model gives probabilities over four mutually exclusive, exhaustive outcomes and they sum to 1.15.
  - Step 1: Check each is in [0,1]. We assume they are (if one were above 1, step1 would fail). But even if each is in [0,1], step3: they are mutually exclusive and exhaustive? We assume yes. Then the sum is 1.15, which is not 1 -> fail.

  Case 3: Our final outputs are always coherent because we clip and renormalize everything at the end.
  - Step 1: After clipping and renormalization, they are in [0,1] -> pass step1.
  - Step 2: If the final output includes complementary events, they should sum to 1 (because of renormalization). But note: if we are only outputting one probability (say, P(fraud)) and then P(not fraud) is 1 - P(fraud), then step2 is satisfied by construction. Similarly, for multiple categories, if we renormalize to sum to 1, then step3 is passed.

  But note: The raw model outputs might be incoherent (as in case1 or case2). The procedure might flag the raw outputs, but the final output is fixed. So we should run the checks on the raw outputs and the final outputs separately.

  What the procedure can't catch:
  - It doesn't tell us if the probabilities are calibrated (i.e., when we say 70%, does fraud happen 70% of the time?).
  - It doesn't catch if the models are using the wrong features or if there's data drift.
  - It doesn't catch if the events are not correctly defined (e.g., if "fraud" and "abuse" are not mutually exclusive but we treat them as such).

  Now, the procedure in a step-by-step list for the team:

  **Fraud Detection Probability Coherence Check (Friday One-Hour Procedure)**

  1. **Gather Data**: Collect a sample of recent transactions (e.g., 1000) with raw model outputs and the final score. Ensure we have the same set of transactions for all models.

  2. **Step 1: Check [0,1] Bounds**:
     - For every probability output (from each model and the final score), check that it is between 0 and 1 (inclusive, with tolerance for floating point: e.g., if it's 1.0000001, that's a fail).
     - If any value is outside, flag the model and the transaction. Count the number of failures.
     - **Pass**: All outputs in [0,1]. **Fail**: At least one output outside.

  3. **Step 2: Check Complements**:
     - For each transaction, if a model (or the system) outputs both an event and its complement (e.g., "fraud" and "not fraud"), then check that the two probabilities sum to 1 ± 0.01 (to allow for rounding).
     - If they don't, flag the transaction and model.
     - **Pass**: All such pairs in the sample sum to 1±0.01. **Fail**: At least one pair does not.

  4. **Step 3: Check Mutual Exclusive & Exhaustive Sets**:
     - For each transaction, if a model (or the system) outputs a set of probabilities for events that are supposed to be mutually exclusive and exhaustive (e.g., four fraud types that cover all possibilities and no overlap), then check that the probabilities sum to 1 ± 0.01.
     - If they don't, flag the transaction and model.
     - **Pass**: All such sets in the sample sum to 1±0.01. **Fail**: At least one set does not.

  5. **Step 4: Advanced Checks (Skip in one-hour version)**:
     - Optional: If we have conditional probabilities and the joint events, we can check the multiplication rule. But skip for now.

  6. **Step 5: Final Score Check**:
     - Ensure the final score is in [0,1] (same as Step1) and if the final score is part of a set (e.g., multiple categories) then also check Step3 for the final output.

  7. **Step 6: Non-Probability Outputs**:
     - For any model that does not output a probability (e.g., only a score without calibration, or a rank), note that we are using it as a probability. This is a judgment call: we must decide if we are misusing the model. If we are, then we must either calibrate it or stop treating it as a probability.

  8. **Step 7: Handling Incoherent Raw Inputs**:
     - Even if the final score is coherent (because of clipping/renormalization), if the raw inputs are incoherent (like in Case1 or Case2), we should log that. It might indicate a problem with the individual models.

  **What to do with fails?**
  - For Step1, Step2, Step3 fails: Investigate the model and the transactions. It might be a bug in the model or a misconfiguration.
  - For Step6: Have a discussion about whether to calibrate the model or change how we use it.

  **Run on Cases (with sample data):**

  Case 1: Two models give 0.65 and 0.45 for "fraud" and "not fraud" on the same transaction.
  - Step1: Both in [0,1] -> pass.
  - Step2: They are complements? We assume yes. Sum=1.10 -> not in [0.99,1.01] -> fail.

  Case 2: Model gives four probabilities: say [0.3, 0.4, 0.3, 0.15] for four outcomes. Sum=1.15.
  - Step1: All in [0,1] -> pass.
  - Step3: They are mutually exclusive and exhaustive? We assume yes. Sum=1.15 -> fail.

  Case 3: Final outputs are coherent by design (clipped and renormalized). So:
  - Step1: Final scores in [0,1] -> pass.
  - Step2: If we have a complement, it will pass by construction.
  - Step3: If we have a set, they will sum to 1 (because of renormalization) -> pass.

  But note: The raw outputs (before clipping/renormalization) might fail Step1, Step2, or Step3. So we should run the checks on the raw outputs too.

  **Honest Limitations**:
  - This procedure only checks internal coherence (avoiding dutch books). It does not check calibration (agreement with long-run frequencies). A model can be coherent but poorly calibrated (e.g., always output 0.5 for fraud, and if fraud happens 50% of the time, it's calibrated, but if not, it's not).
  - It also doesn't check for other performance metrics (discrimination, AUC, etc.).
  - It might flag a model that is not meant to output probabilities (like a ranking model) if we are misusing it.

  **Unwanted News**:
  - If we are calling a score a "probability" but it fails Step1 (e.g., sometimes outside [0,1]), then we must fix that or stop calling it a probability.
  - If we are using a model that outputs a non-probability (like a raw score) as a probability without calibration, then we are at risk of incoherence. We should either calibrate it or use it in a way that doesn't require a probability interpretation.

  By running this weekly, we can catch incoherence early, which might indicate model degradation or configuration errors.
answer: |-
  Below is a practical decision procedure for your team to check probability coherence, designed to run in ~1 hour/week with no prior philosophy background. It focuses on **avoiding "Dutch book" vulnerabilities** by enforcing basic probability rules. The procedure is split into sequential checks with clear pass/fail criteria, handling instructions for ambiguous cases, and real-world examples.

  ---

  ### **Probability Coherence Check Procedure**
  **Time Budget**: 1 hour/week (run on a sample of 100–500 recent transactions)  
  **Inputs**: Raw model outputs + final combined score per transaction  
  **Output**: Report of coherence violations, broken down by model/step  
  **Key Principle**: Failures indicate your system is vulnerable to guaranteed-loss exploits ("Dutch books").

  #### **Step 0: Preparation (5 mins)**
  - **Action**: Sample 100–500 transactions from the past week. For each, gather:  
    (a) Raw outputs from all models (even non-probabilistic ones),  
    (b) Final combined score (e.g., your "headline fraud probability").  
  - **Handling Ambiguity**:  
    - If a model outputs a non-probability (e.g., "risk score", "ranking", "confidence"), **flag it** and skip checks for it.  
    - If event definitions clash (e.g., "fraud" vs. "chargeback risk"), **group by logical equivalence** (e.g., treat "fraud" and "chargeback risk" as the same event if they overlap in practice).  
  - **Judgment Call**: Event grouping requires domain knowledge. Default to your team's internal labels.

  #### **Step 1: Check Probability Bounds (10 mins)**  
  - **What to Check**: Every numeric output labeled "probability" (or treated as one) must be in `[0, 1]`.  
  - **Pass/Fail**:  
    - **Pass**: All values ≥0 and ≤1 (allow rounding errors, e.g., 1.0001 → fail).  
    - **Fail**: Any value <0 or >1.  
  - **Action if Fail**:  
    - Clip out-of-bounds values to `[0,1]` and note the frequency.  
    - If >1% of outputs fail, **stop calling it a "probability"** (use "score" instead).  
  - **Real Check?**: YES. Values outside `[0,1]` are mathematically invalid and trivially exploitable.

  #### **Step 2: Check Complements (15 mins)**  
  - **What to Check**: If two models (or one model) output probabilities for complementary events (e.g., "fraud" and "not fraud"), they must sum to ~1.0.  
  - **Pass/Fail**:  
    - **Pass**: Sum = 1.0 ± 0.05 (allow for rounding/model noise).  
    - **Fail**: Sum <0.95 or >1.05.  
  - **Handling Ambiguity**:  
    - Skip if events aren’t complements (e.g., "fraud" and "abuse" are not complements).  
    - If models disagree on definitions (e.g., one says "fraud", one says "not fraud"), **force-align events** using your internal fraud taxonomy.  
  - **Action if Fail**: Reconcile definitions or recalibrate models.  
  - **Real Check?**: YES. Complementary probabilities ≠1 allows guaranteed-profit bets against you.

  #### **Step 3: Check Mutual Exclusivity (15 mins)**  
  - **What to Check**: If probabilities are assigned to ≥2 mutually exclusive outcomes (e.g., fraud types), their total must sum to ≤1.0.  
  - **Pass/Fail**:  
    - **Pass**: Sum ≤1.0 ± 0.05.  
    - **Fail**: Sum >1.05.  
  - **Handling Ambiguity**:  
    - If events aren’t mutually exclusive (e.g., "fraud" and "account takeover" can co-occur), **skip or re-label**.  
    - If outputs are one-sided (e.g., only "fraud risk"), skip.  
  - **Action if Fail**: Cap the sum at 1.0 and investigate overconfident models.  
  - **Real Check?**: YES. Sum >1 implies you’d overpay on bets across outcomes.

  #### **Step 4: Check Exhaustiveness (10 mins)**  
  - **What to Check**: If probabilities cover all possible outcomes (e.g., "fraud", "not fraud", "suspicious"), their total must sum to ~1.0.  
  - **Pass/Fail**:  
    - **Pass**: Sum = 1.0 ± 0.05.  
    - **Fail**: Sum <0.95 or >1.05.  
  - **Handling Ambiguity**:  
    - Skip if outcomes aren’t exhaustive (e.g., missing "inconclusive" category).  
    - If a model omits an outcome, **infer its probability** (e.g., 1−sum of others).  
  - **Action if Fail**: Add missing categories or renormalize.  
  - **Real Check?**: PARTIAL. Sum ≠1 is exploitable, but defining exhaustiveness is a judgment call.

  #### **Step 5: Final Score Sanity Check (5 mins)**  
  - **What to Check**: Your headline score (used for blocking) must behave like a probability:  
    (a) Bounded to `[0,1]` (Step 1),  
    (b) Increases with fraud risk (e.g., higher for fraud than non-fraud transactions).  
  - **Pass/Fail**:  
    - **Pass**: (a) Score in `[0,1]`, (b) Score correlates with actual fraud (e.g., AUC >0.5).  
    - **Fail**: (a) Out of bounds, or (b) No correlation (AUC ≤0.5).  
  - **Action if Fail**:  
    - If (a): Renormalize the score.  
    - If (b): **Stop calling it a probability** (use "risk index" instead).  
  - **Real Check?**: PARTIAL. Bounds are mandatory; correlation is a weak sanity test.

  ---

  ### **What This Catches vs. What It Misses**
  - **Catches**:  
    - Mathematical incoherence (Dutch book vulnerabilities).  
    - Misaligned event definitions (e.g., "fraud" vs. "abuse").  
    - Overconfident models (probabilities summing >1).  
  - **Misses**:  
    - **Calibration**: A "0.6 probability" doesn’t guarantee 60% of these are fraud.  
    - **Accuracy**: Coherent probabilities can still be wrong (e.g., always 0.5).  
    - **Model drift**: Degradation over time due to data shifts.  
    - **Edge cases**: Probabilities for non-independent events (e.g., P(A and B)).

  ---

  ### **Example Checks on Your Cases**
  #### **Case 1: Two models give 0.65 and 0.45 for "fraud" and "not fraud"**  
  - **Step 1**: Both in `[0,1]` → **Pass**.  
  - **Step 2**: Sum = 0.65 + 0.45 = 1.10 → >1.05 → **Fail**.  
  - **Diagnosis**: Incoherent complements. You’d accept two bets: one paying $0.65 on fraud, another paying $0.45 on non-fraud. You pay $1.10 upfront but win max $1.00 → guaranteed loss.  
  - **Action**: Reconcile models or average their outputs.

  #### **Case 2: Four mutually exclusive outcomes sum to 1.15**  
  - **Step 1**: All in `[0,1]` → **Pass** (assuming no bounds breach).  
  - **Step 3**: Sum = 1.15 > 1.05 → **Fail**.  
  - **Diagnosis**: Mutual exclusivity violation. You’d overpay for covering all outcomes.  
  - **Action**: Renormalize probabilities to sum to 1.0.

  #### **Case 3: Final outputs are coherent (clipped/renormalized), but raw outputs are not**  
  - **Final Score (Step 5)**: Bounded and correlated → **Pass**.  
  - **Raw Outputs (Steps 1–4)**: Likely failures (e.g., Case 1/2).  
  - **Diagnosis**: Your **headline score is safe**, but upstream models are incoherent.  
  - **Action**: Monitor raw models weekly—incoherence may mask deeper issues (e.g., overfitting).  
  - **Hard Truth**: If raw models are arbitrary scores, **stop interpreting them as probabilities**. Use quantiles or calibrate.

  ---

  ### **When the Procedure Tells You Uncomfortable Truths**  
  - **Example**: Your headline score has AUC = 0.52 (barely better than coin flips).  
    - **Step 5 fails** → Stop calling it a "probability". Admit it’s a heuristic score.  
  - **Why This Matters**: Calling a weak score a "probability" creates false confidence. Dutch books are the **minimal standard**—failing them means your system is mathematically exploitable, regardless of accuracy.  
  - **Mitigation**: Use non-probabilistic language (e.g., "risk score") and focus on ranking (e.g., block top 10% of scores).

  ---

  **Final Tip**: Automate Steps 1–3 as unit tests in your pipeline. For calibration (what this doesn’t cover), run monthly checks: bucket scores into deciles and verify fraud rates align (e.g., transactions scored 0.6–0.7 should be fraud 60–70% of the time).
