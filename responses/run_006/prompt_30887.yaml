  so me and a friend just had a long argument about whether Harsanyi's aggregation theorem is actually a proof of utilitarianism or just a bit of maths that depends on how you scale everyone's utility functions. Compare Harsanyi's aggregation theorem with Arrow's impossibility theorem for me. They look like they're pulling in opposite directions about whether individual preferences can be aggregated at all, and I can't work out what exactly Harsanyi is assuming that Arrow isnt. Does Harsanyi's theorem give a genuine argument for utilitarianism, or does the extra machinery just smuggle in the conclusion? Lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question. Use British English.
