answer: |-
  **Harsanyi's theorem does not definitively prove utilitarianism but shows that additive aggregation follows logically from its specific, demanding assumptions—assumptions Arrow deliberately avoids, particularly regarding cardinal utility and interpersonal comparability, explaining their seemingly opposite conclusions.**

  Here's the reasoning:

  1.  **Core Difference in Assumptions: Utility vs Preference:** Arrow's Impossibility Theorem operates purely on **ordinal preferences**. It asks: can we aggregate individual *rankings* of social states into a consistent social *ranking*, satisfying minimal fairness conditions (like non-dictatorship and Pareto efficiency)? Arrow proves this is impossible under ordinalism. Crucially, it forbids interpersonal utility comparisons and assumes only preference *orderings* are known, not intensity. Harsanyi's Aggregation Theorem, in contrast, assumes **cardinal, interpersonally comparable utilities**. Individuals can express not just *which* state they prefer, but *how much* better it is for them (cardinal), and these differences can meaningfully be compared *across* individuals.

  2.  **Harsanyi's Machinery:** Harsanyi assumes:
      *   Individual preferences satisfy the von Neumann-Morgenstern axioms (implying cardinal utility functions unique up to positive affine transformations).
      *   Social preferences also satisfy these axioms (implying a social vNM utility function).
      *   A strong **Pareto principle**: If everyone is indifferent between two social states, so is society; if at least one individual strictly prefers state A to B and no one prefers B to A, then society strictly prefers A to B.
      *   Harsanyi often uses the "impartial observer" thought experiment (behind a veil of ignorance) to *motivate* the interpersonal comparability assumption.

  3.  **Harsanyi's Conclusion:** Given these assumptions, Harsanyi proves that the social utility function *must* be a **weighted sum** of the individual cardinal utility functions: U_social = a1*U1 + a2*U2 + ... + an*Un, where the weights ai are positive constants. If the "impartial observer" setup is used and individuals are treated symmetrically, the weights become equal, leading to classical **sum-total utilitarianism**: U_social = U1 + U2 + ... + Un.

  4.  **The Scaling Issue & "Smuggling":** The criticism about utility scaling is valid and central. Cardinal utilities (u_i) are only unique up to positive affine transformations (u_i' = c_i * u_i + d_i, c_i > 0). The conclusion that *summing* these utilities yields a meaningful social welfare function *depends entirely on the specific scales chosen*. Harsanyi's theorem shows that *if* you have chosen scales where interpersonal comparisons are meaningful (so the zero points and units are comparable), *then* the social welfare function must be additive. But **the theorem itself does not, and cannot, tell you how to choose those scales or establish the meaningfulness of interpersonal comparisons**. This requires *additional ethical judgements* (like those potentially motivated by the impartial observer). The "machinery" (cardinality, interpersonal comparability, strong Pareto) is not neutral; it effectively builds the possibility of utilitarianism into the premises. The theorem proves coherence *given those premises*, not that the premises are objectively true or the only reasonable ones.

  5.  **Comparison with Arrow:**
      *   **Arrow:** Ordinal preferences, no interpersonal comparisons. Conclusion: *Impossible* to aggregate consistently and fairly.
      *   **Harsanyi:** Cardinal, interpersonally comparable utilities, strong Pareto. Conclusion: *Possible* to aggregate consistently and fairly *only* via a weighted sum (utilitarianism).
      *   **Opposite Directions?** They aren't truly contradictory because they address fundamentally different questions under different informational assumptions. Arrow shows the impossibility under very weak information (ordinal preferences alone). Harsanyi shows a specific possibility *if* you assume much richer, ethically loaded information (cardinal, comparable utilities). Arrow denies the possibility of a universally "fair" aggregation method under ordinalism; Harsanyi derives a specific aggregation method under cardinalism.

  **In essence:** Harsanyi provides a powerful *coherence argument* for utilitarianism *if* you accept cardinal, interpersonally comparable utilities and the strong Pareto principle. It demonstrates the logical link between these assumptions and additive aggregation. However, it does not constitute an irrefutable "proof" of utilitarianism because the validity and ethical justification of interpersonal utility comparisons (the required scaling) remain external premises, not conclusions of the theorem. Arrow highlights the profound difficulties that arise precisely when you *lack* that richer utility information that Harsanyi assumes.
