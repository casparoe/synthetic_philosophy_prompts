prompt: |-
  A friend of mine has been reading about value theory and summarised the position like this: 'Some philosophers, notably Joseph Raz, argue that many of the values we care about most are incommensurable — they cannot be measured on a common scale the way we can rank objects by weight or length. This means that when you face a hard choice — say, between a career in law and a career in music — there is no fact of the matter about which option is better, and they are not equally good either. Reason cannot guide you here; it simply runs out. That is why hard choices feel so difficult: we keep looking for reasons where there are none. Any decision we eventually make is, at bottom, arbitrary — a matter of picking rather than choosing — and this is why no one can be criticised for choosing either way.'

  I suspect this overstates things, but I am not sure exactly where. Could you go through this summary and tell me which parts a philosopher working on incommensurability and hard choices would accept, which parts they would push back on, and whether the conclusion that hard choices are arbitrary follows from the accurate parts? Please answer in British English.
reasoning: |-
  Okay, the user's friend has been reading about value theory, specifically Joseph Raz's ideas on incommensurability. They've summarised it, but the user suspects it might overstate things. Let me break this down step by step.

  First, I need to assess which parts of the summary are accurate. The friend mentions that Raz argues some values are incommensurable—meaning they can't be measured on a common scale. That's correct. Raz indeed uses examples like careers in law versus music to illustrate this. The point about hard choices lacking a fact of the matter regarding which is better, and them not being equally good, aligns with Raz's incommensurability concept. So far, so good.

  But then the summary claims that reason "runs out" completely, that decisions are arbitrary, and no one can be criticised for their choice. Here's where philosophers would push back. Ruth Chang's work on hard choices comes to mind. She argues that even without a common scale, reason isn't useless. Values might be comparable through "covering values" or by creating reasons through commitment. This challenges the idea that choices are purely arbitrary.

  The user is likely looking for clarification on whether hard choices are truly beyond rational deliberation. They might be wrestling with personal decisions and seeking philosophical insight to reduce anxiety about "arbitrary" choices. The deeper need could be understanding how to approach life decisions without feeling paralysed by the lack of a single right answer.

  I should highlight the nuances: reason doesn't vanish but operates differently. Commitment adds a layer of rationality beyond mere measurement. Also, while choices might not have a single correct answer, they aren't immune to criticism. Factors like self-knowledge or alignment with deeper values matter. Concluding that decisions in hard choices involve personal agency rather than randomness could address the user's concern about arbitrariness.
answer: |-
  A philosopher working on incommensurability and hard choices (like Joseph Raz himself, Ruth Chang, or James Griffin) would likely accept *parts* of your friend's summary but push back significantly on the interpretation and, crucially, on the conclusion that the choice is ultimately arbitrary and beyond criticism. Here's a breakdown:

  **Parts Generally Accepted:**

  1.  **Core Claim of Incommensurability:** Philosophers would agree that Raz (and others) argue many important values (like career fulfilment, artistic expression, family commitments, moral duties) are **incommensurable**. They lack a common metric (like weight or length) for precise comparison. You can't say "law is worth 7.3 units of goodness and music is worth 7.4".
  2.  **No Fact of the Matter & Not Equal:** They would accept that in such hard choices, it's often **not the case that one option is determinately better** *and* it's **not the case that they are equally good**. This captures the core idea of "incomparability" or "parity" (a term Ruth Chang uses) that defines many hard choices.
  3.  **Traditional Ranking Fails & Reason "Runs Out" in a Specific Sense:** Philosophers agree that **traditional comparative reasoning** (aiming to discover which option has *more* of a single, measurable value like "goodness") **falters or "runs out"**. You cannot *discover* a fact of the matter about which is better using that method.
  4.  **The Search for Absent Reasons:** They would concur that part of the difficulty and anxiety in hard choices stems from **frustration at the lack of conclusive, comparative reasons** of the type we often expect or desire – reasons that would definitively settle "which is better".

  **Parts Pushed Back On:**

  1.  **Reason Wholly "Runs Out":** This is the most significant pushback. While *traditional comparative reasoning* fails, philosophers like **Ruth Chang** argue powerfully that **reason does not simply vanish**. She contends that when options are on a par (a specific form of incomparability), reason operates differently:
      *   **Creating Reasons:** Your choice isn't just *found* by reason; it can *create* reasons through commitment. Choosing music *makes* reasons for being a musician salient and important (e.g., developing your musical talent, contributing to art) that weren't decisive beforehand. Your commitment *rationalises* the choice post-hoc in a way that isn't arbitrary.
      *   **Covering Values/Will-Based Reasons:** You might decide based on a "covering value" (e.g., "authenticity," "challenge," "serving others") that provides a rationale, even if it doesn't *measure* the options against each other on a single scale. Your will – your character, commitments, and deepest concerns – provides reasons that aren't arbitrary but are expressive of *who you are*.
      *   **Deliberation Still Matters:** Reason is crucial in understanding the *nature* of the choice (is it really hard? are the values incommensurable?), clarifying what each option entails, understanding your own values and potential commitments, and ruling out options that *are* worse or involve violating important constraints (e.g., choosing a career that actively harms others).
  2.  **Decision is "Arbitrary" / "Picking rather than Choosing":** This is strongly contested.
      *   **Not Random:** An arbitrary choice implies flipping a coin or choosing at random. Philosophers argue a **well-considered choice between incommensurable options is anything but random**. It involves deep reflection on what matters to you, your identity, your potential futures. It's an exercise of agency, not chance.
      *   **"Choosing" vs. "Picking":** While Raz himself might use similar language ("picking"), even he wouldn't see it as *merely* arbitrary. The choice reflects the agent's stance. Chang explicitly rejects this dichotomy, arguing that a commitment-based choice *is* a full-blooded act of "choosing" guided by reason and the will.
  3.  **No One Can Be Criticised:** This is generally seen as an overstatement.
      *   **Process Can Be Criticised:** Someone might be criticised for a **defective deliberative process** – failing to understand the options, ignoring relevant consequences, being wilfully blind to moral constraints, acting out of weakness of will contrary to their deepest values, or failing to commit properly after choosing.
      *   **Substance Can *Sometimes* Be Questioned:** While the core value comparison might not yield criticism, the *reasons* for the choice might. If someone chooses law solely because they believe it's inherently "superior" to music in a way that denies the incommensurability, that belief could be challenged. If the choice involves neglecting fundamental duties (even for a competing value), criticism might be warranted. Furthermore, if the commitment made doesn't genuinely reflect the person's values or character (is in "bad faith"), that could be criticised.
      *   **Commitment Matters:** How you *pursue* your choice – your dedication, integrity, and responsiveness to the reasons created by your commitment – is certainly open to evaluation.

  **Does the Conclusion Follow?**

  **No, the conclusion that hard choices are ultimately arbitrary does *not* follow from the accurate parts.**

  The accurate parts establish that:
  *   Values are often incommensurable.
  *   This means one option isn't determinately better, nor are they equal.
  *   Traditional comparative reasoning seeking that "better than" fact fails.

  However, this **does not entail** that the *only alternative* is arbitrariness. The pushback points show a robust alternative:

  *   **Reason operates differently:** Through understanding the choice, clarifying values, considering commitments, and exercising the will.
  *   **Commitment creates reasons:** The choice itself generates new normative landscapes.
  *   **Agency is central:** The decision is an expression of the self and its commitments, not random selection.

  Therefore, while a hard choice lacks a single, discoverable "best" answer dictated by pre-existing comparative facts, it **can still be a deeply reasoned, non-arbitrary exercise of practical rationality and agency.** The lack of a common scale doesn't doom us to randomness; it shifts the focus of reason from *discovery* to *creation* and *commitment*. As Chang argues, hard choices are often where we define ourselves and our values most profoundly.
