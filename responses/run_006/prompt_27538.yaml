prompt: |-
  You're an expert on philosophical decision theory and embedded agency — please think carefully about this and don't just throw a label at me, because I've already tried googling and none of the standard terms quite fit.

  Here's the pattern I keep tripping over. I'm an engineer who got into philosophy of AI through the alignment problem, and I've been stuck on this for weeks. You're an agent trying to decide what to do. To evaluate your options, you build a model of the world and simulate the consequences of different actions. But you yourself are part of the world — your decision process is a physical thing that other agents can observe, predict, and respond to. So your world-model needs to include a model of you. But that self-model lives inside you (it's a substructure of your own reasoning), so it has to be simpler than you are — it's a compressed, lossy version. And here's the kicker: other agents in the world might be modeling you at a higher resolution than your own self-model can capture, and their behavior depends on details of your decision process that you are structurally unable to include in your world-model. So there are causal pathways determining the consequences of your actions that you cannot, even in principle, fully track — not because you lack data about the external world, but because you can't fit a full-detail model of yourself inside yourself.

  It's not quite the halting problem, and it's not quite the map-territory distinction, and it's not just that self-reference creates paradoxes. It's specifically about the necessary compression loss when an embedded agent models itself as part of the environment. I know people like Demski and Garrabrant have written around this, and it's clearly related to why Cartesian boundaries don't work, but I'm looking for the name of this specific thing — the structural blind spot that comes from your self-model having to be lower-resolution than you are. Does this have an established name in the literature? If not, what would you call it, and how would you distinguish it from nearby concepts like reflective inconsistency, the Löbian obstacle, or the problem of self-reference in decision theory?
