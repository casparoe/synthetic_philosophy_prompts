  ### The Grue Sonnet
  We find each emerald in our sight surveyed  
  Displays but green; thus, "All are green," we claim.  
  But Goodman's riddle wields a grue-blade:  
  *Green if by time t examined, else blue's aim*.  
  Since every stone was viewed ere t arrived,  
  They’re grue as well—both predicates align.  
  Why then does grue feel oddly contrived?  
  What law decrees which projectable line?  

  *Now speak in bleen*: if seen by t, it’s blue;  
  If after, green. Then green? It fractures too—  
  Defined as *grue before t, bleen beyond*.  
  See green dismembered, gerrymandered hue!  

  No hue-facts change; the threat’s to reason’s bond:  
  Why *green* projects, while *grue* stays unentrenched,  
  Demands what mere induction won’t retrench.  

  ---

  ### Key Features:  
  1. **Octave (Lines 1-8)**:  
     - Emeralds observed green (line 1-2).  
     - Grue defined as *green if examined before t, blue otherwise* (line 4).  
     - Observed emeralds are both green and grue (line 5-6), highlighting the symmetry.  
     - Grue's artificiality ("contrived," line 7) and the projection dilemma (line 8).  

  2. **Volta & Sestet (Lines 9-14)**:  
     - Line 9: Shifts to bleen (*blue if examined before t, green otherwise*).  
     - Lines 10-11: Green redefined as *grue before t, bleen after t*.  
     - Line 12: Green now appears equally gerrymandered.  

  3. **Couplet (Lines 13-14)**:  
     - Emphasizes that colors aren’t at stake—it’s about *why* entrenched predicates (green) project while non-entrenched ones (grue) fail.  

  ### Notes:  
  - **Meter**: Iambic pentameter.  
  - **Rhyme Scheme**: ABBA ABBA (octave), CDE CDE (sestet).  
  - **Goodman-Accurate**: Uses *examination-based* definitions (not simplified "blue after t"), and the bleen-ese reversal mirrors *Fact, Fiction, and Forecast*.  
  - **Philosophical Punch**: The couplet stresses that the riddle exposes induction’s dependence on entrenchment, not empirical facts.  

  This should resonate with Goodman readers while delivering the paradox’s core challenge. Hand it out after your discussion to crystallize the tension!
