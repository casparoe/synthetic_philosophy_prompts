     The issue is that standard game theory (Nash) in a symmetric game might not have a symmetric equilibrium in pure strategies, but it does in mixed? Actually, for the Platonia dilemma, there is no symmetric pure strategy equilibrium. For mixed strategies, we look for a p such that each player is indifferent? But as above, if all others use p, then the player strictly prefers to send (unless p=1, then if all others send for sure, then if I send I get 0, if I don't I get 0 -> indifferent). So the mixed strategy equilibrium is p=1? But then everyone sends and gets 0. Alternatively, if p=0, then if one player deviates and sends, they win. So p=0 is not an equilibrium. So the only symmetric Nash equilibrium is p=1? But that gives 0 to everyone. There are asymmetric equilibria: one player sends and the others don't. But then we need to coordinate who that one is. Without communication, that seems impossible.

     This is the problem: standard game theory doesn't give a satisfactory solution for the Platonia dilemma. We need a theory that can prescribe a symmetric mixed strategy that leads to a positive probability of winning.

  3. **Luring Lottery**:
     - Each player can submit k entries (nonnegative integer) on one postcard. The prize is $1,000,000 divided by the total number of entries (T) and awarded to a randomly chosen entry. So if a player submits k entries, their expected payoff is (k / T) * (1000000 / T) = 1000000 * k / T^2.
     - The total T includes the entries of all players. Let there be n players. Let the other players submit a total of S. Then T = k + S. The player's payoff is 1000000 * k / (k+S)^2.
     - In standard game theory, if we assume that other players are fixed, then the player maximizes k/(k+S)^2. The derivative w.r.t. k is [ (k+S)^2 - k * 2(k+S) ] / (k+S)^4 = [ (k+S) - 2k ] / (k+S)^3 = (S - k) / (k+S)^3. Setting to zero: S-k=0 -> k=S. But S depends on what others do. In a symmetric game, if all others are playing the same strategy, then S = (n-1) * k_others. But if we are symmetric, k_others = k? Then S = (n-1)*k, so T = nk. Then the payoff is 1000000 * k / (n^2 k^2) = 1000000/(n^2 k). To maximize, the player would want k as small as possible (k=1). But if k=1, then each player gets 1000000/(n^2 *1). However, if one player deviates and increases k, then they get more? Let's check: if all others play k=1, then S = n-1. The deviating player chooses k. Their payoff is 1000000 * k / (k + n-1)^2. The derivative as above: ( (n-1) - k ) / (k+n-1)^3. Setting to zero: k = n-1. Then the payoff becomes 1000000 * (n-1) / ( (n-1)+n-1 )^2 = 1000000 * (n-1) / (2(n-1))^2 = 1000000 * (n-1) / (4 (n-1)^2) = 1000000/(4(n-1)). For n>2, this is more than 1000000/(n^2) (if n=2, then 1000000/(4*(1)) = 250000, and 1000000/(2^2)=250000, same). For n=3, 1000000/(9) ≈111111, while deviating to k=2 gives 1000000/(4*2)=125000. So the symmetric k=1 is not a Nash equilibrium.

     The Nash equilibrium in symmetric mixed strategies? Actually, it's a continuous action space. But note: the payoff when all play the same k is decreasing in k, so each player would want to unilaterally reduce k? But then we get a race to the bottom? Actually, no: if everyone else sets k, then the best response is to set k = S, where S is the total of others. But S = (n-1)*k_others. In a symmetric equilibrium, k_others = k. Then we require k = (n-1)*k -> k=0. But k=0: then if all set 0, then if one player sets k>0, they get 1000000 * k / (k)^2 = 1000000/k. They can set k very small? But k has to be an integer? Actually, no, we can consider real numbers? Then as k->0+, the payoff -> infinity? That doesn't work because the prize is 1000000/k (if only one player enters k) but then we have to account for the fact that the player is the only one? But in equilibrium, if all set 0, then a player can set k=ε and get 1000000/ε. So k=0 is not an equilibrium. There is no symmetric pure strategy Nash equilibrium? 

     The superrational approach: assume that all players reason the same and choose the same k. Then the payoff per player is 1000000 * k / (n k)^2 = 1000000/(n^2 k). To maximize the group's total payoff? Or per player? The group total payoff is 1000000 * (sum of probabilities) = 1000000 (since one winner). So the total is fixed. But per player? Each wants to maximize their own. But if they choose k, then the per player payoff is 1000000/(n^2 k). The higher k, the lower the payoff. So they should choose k as small as possible? But k must be at least 1? But if k=1, then each gets 1000000/(n^2). But note: if they choose k=0, they get 0. So k=1 is the best? But then why would they not choose k=0? Because if they choose k=0, then if everyone does that, no one wins. But if one player chooses k=1, then they win 1000000. So the symmetric k=1 is not stable. 

     Superrationality: Hofstadter's idea is that in symmetric games, players should consider that they are all using the same reasoning and hence will choose the same action. Then they should choose the action that, if all choose it, leads to the best outcome for each. In the luring lottery, if all choose k, then each gets 1000000/(n k * n) = 1000000/(n^2 k) [because the total entries is nk, and the chance of winning for a given player is k/(nk)=1/n, and the prize is 1000000/(nk), so the expected prize is (1/n) * (1000000/(nk)) = 1000000/(n^2 k)]. To maximize this, they want k as small as possible. But k must be at least 1? So k=1. Then each gets 1000000/(n^2). 

     But is that stable? If one player deviates and sets k=2, then the total entries becomes (n-1)*1 + 2 = n+1. The prize becomes 1000000/(n+1). The deviating player's expected payoff is (2/(n+1)) * (1000000/(n+1)) = 2000000/(n+1)^2. Compare to the original 1000000/n^2. For n=2: original: 1000000/4=250000. Deviation: 2000000/(3^2)=2000000/9≈222222 < 250000. For n=3: original: 1000000/9≈111111. Deviation: 2000000/(4^2)=2000000/16=125000>111111. So for n=3, the symmetric k=1 is not stable against a deviation to k=2.

     Therefore, the superrational solution (k=1) is not a Nash equilibrium? Then why would rational players stick to it? Hofstadter's superrationality requires that they all reason that they will all do the same, and that any deviation is not considered because if one deviates, then they all would deviate? That is, they assume that whatever they do, the others will do the same. So if they choose k=2, then all choose k=2, and each gets 1000000/(n^2 * 2) = 1000000/(2 n^2) which is worse than k=1. So they stick to k=1.

     But that requires that the players are "clones": they all do the same because they all reason the same. And they know that.

  4. **Types of Players**:
     - We have to consider the type of players:
       (a) Players who reason exactly like you (so they will choose the same action).
       (b) Players who are rational in the usual Nash sense (best respond to others).
       (c) Ordinary humans (who might not follow either).

     In the actual luring lottery, some submitted very large numbers (like a googolplex) because they thought that if they submitted a huge number, then even if others also submitted large numbers, the total would be huge and the prize would be tiny, but their chance of winning would be high. However, if everyone does that, the prize becomes negligible. The superrational solution is k=1, which gives a reasonable payoff.

  5. **No Communication and No Causal Influence**:
     - Players cannot communicate and their choices do not causally influence each other.

  Now, we write the desiderata:

  **Desiderata for the theory:**

  1. **Symmetric Prescription**: In symmetric games, the theory should prescribe the same action (or the same mixed strategy) to every player. 
     - Why: The games are symmetric. Without any distinguishing feature, each player should do the same.
     - Non-negotiable? Yes, for symmetric games.

  2. **Positive Probability of Success in Platonia**: The theory should prescribe a strategy in the Platonia dilemma that yields a positive expected payoff (i.e., avoids the outcomes of everyone sending or no one sending with probability 1).
     - Why: The outcomes of all sending or none are both bad (payoff 0). We need a chance of winning.
     - Non-negotiable? For the Platonia dilemma, yes, because otherwise we are stuck at 0.

  3. **Finite Entries in Luring Lottery**: For the luring lottery, the theory should prescribe a finite number of entries (and specifically, k=1 in the symmetric case with identical reasoners).
     - Why: The naive approach leads to an "arms race" of more and more entries, which reduces the prize. The superrational solution (k=1) is simple and yields a positive payoff.
     - Non-negotiable? Not absolutely, but without it we get an unbounded number of entries which is absurd.

  4. **Handling Different Types of Players**: The theory should be able to account for different assumptions about the opponents: (a) identical reasoners (they will do the same as me), (b) standard rational players (best responders), and (c) a population of ordinary humans.
     - Why: In the real world, we might face a mix. The theory should clarify the assumption. The superrationality approach relies heavily on (a).
     - Non-negotiable? No, but the theory should be explicit about the assumption.

  5. **No Communication or Causal Influence**: The theory must not rely on communication or causal influence between players. The solution must be based solely on reasoning about the game structure and the opponents.
     - Why: The problem statement rules out communication and causal influence.
     - Non-negotiable? Yes.

  6. **Rational Justification**: The theory must explain why the prescribed action is rational for the individual, not just that it leads to a good outcome for the group. It should be individually rational.
     - Why: We are looking for individual rationality.
     - Non-negotiable? Yes.

  Additionally, we might add:

  7. **Efficiency (Pareto Optimality)**: The prescribed outcome should not be Pareto-dominated by another outcome. For example, in the luring lottery, k=1 for all is better than k>1 for all, and in Platonia, having exactly one sender is the best outcome and the symmetric mixed strategy with p=1/20 is the best symmetric way to achieve it with positive probability.
     - Why: We want to avoid outcomes that are collectively bad (like everyone submitting huge k in the lottery).
     - Non-negotiable? Not strictly, but desirable.

  Now, which desideratum does the most work separating superrationality from standard game theory?

  The key one is: **Handling the case of identical reasoners (desideratum 4a)**. Superrationality assumes that all players are identical reasoners and hence will choose the same action. This leads to:

  - In Platonia: Each player sends with probability p. The probability that exactly one sends is 20 * p * (1-p)^19. To maximize the chance of winning (which is the same for each since symmetric), we set p to maximize p*(1-p)^19. The maximum is at p=1/20. Then the probability of exactly one sender is 20*(1/20)*(19/20)^19 ≈ (19/20)^19 ≈ e^{-19/20} ≈ 0.386, so about 38.6% chance that someone wins. Each player's chance of being the sole sender is (1/20)*(19/20)^19 ≈ 0.0193, but note that if they win they get 1e9, so expected payoff is about 19.3 million. This is positive.

    Why is this rational? Because the players, being identical, all use the same p. They know that if they all use p=1/20, then the chance of the good outcome is maximized, and each gets a positive expected payoff. But note: is it individually rational? If the others are using p=1/20, then the best response for a player is to send with probability 1? Because then their chance of winning is (19/20)^19 * 1e9 ≈ 0.386 * 1e9 / 20? Wait, no: if they send with probability 1, then the expected payoff is the probability that no one else sends: (19/20)^19 * 1e9 ≈ 0.386 * 1e9 ≈ 386 million. Whereas if they use p=1/20, they get (1/20)*(19/20)^19 * 1e9 ≈ 0.0193 * 1e9 = 19.3 million. So they are better off sending for sure. 

    Therefore, the superrational mixed strategy (p=1/20) is not a best response to others using p=1/20. So why would they do it? Because they are committed to the symmetric reasoning: if they decide to send for sure, then they must assume that everyone else will also decide to send for sure, leading to 0. So they must choose the same p that they want everyone to choose. And they want a p that if all choose it, they get a good outcome. That p=1/20 maximizes the chance of exactly one sender.

    This is the crux: the identical reasoning assumption forces them to choose the same action, and they choose the one that is best when all choose it.

    In standard game theory, without the identical reasoning assumption, we don't get a satisfactory solution for Platonia (only asymmetric pure strategies, which require coordination, or the bad symmetric pure strategy).

  8. **The requirement of identical reasoning**: This is the core of superrationality. The theory must assume that all players are identical reasoners and hence will choose the same action. Then the rational move is the one that, when chosen by all, gives each the best outcome (or at least a good outcome).

     This is the key desideratum that separates superrationality from standard game theory.

  Can any pair of desiderata not be jointly satisfied?

  Consider: 
  - Desideratum 2 (positive payoff in Platonia) and desideratum 6 (individual rationality without identical reasoners). Without identical reasoners, standard game theory fails to achieve a positive payoff in Platonia (except by asymmetric equilibria, which require coordination). So if we drop the identical reasoners assumption, we cannot get a symmetric positive payoff in Platonia? Therefore, without identical reasoners, we might have to give up on desideratum 2? Or we have to accept that the solution is not symmetric? But desideratum 1 requires symmetry.

  So the pair that might be in conflict without identical reasoners is:
  - Symmetry (1) and Positive payoff in Platonia (2) and Individual rationality (6).

  But note: with identical reasoners, we can have all three.

  Is identical reasoning a false assumption? It breaks if there is any doubt that others might not reason identically. For example:

  - In the luring lottery, if you are not sure that others are identical reasoners, then you might fear that they will submit more than 1. Then your best response might be to submit more to increase your chance. But then the race starts.

  - In Platonia, if you are not sure that others are using p=1/20, then you might be tempted to send for sure if you think others are sending with low probability. But then if everyone does that, we get the bad outcome.

  So the superrationality solution is fragile when there is heterogeneity in reasoning.

  Verdict:

  The most important desideratum that separates superrationality from standard game theory is the **assumption of identical reasoners** (that the players are all using the same reasoning and hence will choose the same action). This is the core of Hofstadter's superrationality.

  And without this assumption, the theory cannot satisfy all the desiderata (in particular, for Platonia, we cannot get a symmetric strategy that yields a positive expected payoff and is individually rational in the standard sense). But with it, we can.

  However, the identical reasoners assumption is strong and might not hold in practice. But in the context of these symmetric games, it is a way to break the deadlock.

  Finally, note that the identical reasoners assumption is not a red herring; it is the defining feature of superrationality. Without it, we are back to standard game theory, which fails to provide a satisfactory solution for these games.

  So the desiderata are jointly satisfied only under the identical reasoners assumption. And the key work is done by that assumption.
answer: |-
  ### Desiderata for a Theory of Individual Rationality in Symmetric One-Shot Games

  Below are the core requirements for a theory prescribing rational actions in symmetric, one-shot, no-communication games like the Platonia Dilemma and Luring Lottery. Each desideratum is grounded in specific challenges from these games, with annotations for negotiability and rationale. The verdict identifies the key separator from standard game theory and assesses coherence.

  ---

  #### **1. Symmetry-Preserving Prescription**  
  **Description**: The theory must prescribe identical actions (or symmetric strategies) to all players, reflecting the game's inherent symmetry.  
  **Case for Requirement**: In the Platonia Dilemma, asymmetric solutions (e.g., "only player X sends") are inaccessible without communication. Deterministic symmetry fails (all/none send → payoff 0), so symmetry must allow mixed strategies.  
  **Non-Negotiable**: Yes. Asymmetry requires coordination, violating no-communication constraints.  

  #### **2. Non-Degenerate Outcomes**  
  **Description**: The theory must avoid outcomes where payoffs are universally zero or negative due to coordination failure.  
  **Case for Requirement**: In Platonia, "all send" or "none send" yield $0. A theory must enable positive expected payoffs (e.g., via mixed strategies with \(p > 0\) and \(p < 1\)).  
  **Non-Negotiable**: Yes. A theory permitting guaranteed $0 is practically irrational.  

  #### **3. Justified Uniqueness in Mixed Strategies**  
  **Description**: If mixed strategies are prescribed, the theory must uniquely determine the probability (e.g., \(p = 1/n\)) and justify why it is rational, not arbitrary.  
  **Case for Requirement**: In Platonia, symmetric mixed strategies must maximize the probability of exactly one sender. Naive symmetry fails—pure strategies guarantee 0 or 20 senders.  
  **Non-Negotiable**: Partly. Standard game theory accepts any equilibrium probability; here, uniqueness is a superrationality commitment.  

  #### **4. Stability Under Strategic Reasoning**  
  **Description**: The prescription must hold under iterative reasoning about others' actions, avoiding infinite regress or contradictions.  
  **Case for Requirement**: In the Luring Lottery, naive EV maximization leads to unbounded entries (if you submit \(k\), I submit \(k+1\), ad infinitum), destroying the prize. A theory must halt this regression.  
  **Non-Negotiable**: Yes. Instability implies no actionable solution.  

  #### **5. Type-Specific Recommendations**  
  **Description**: The theory must adjust prescriptions based on assumptions about opponents:  
  - **(a) Identical reasoners**: Opponents think identically to you.  
  - **(b) Standard rationalists**: Opponents best-respond conventionally.  
  - **(c) Empirical humans**: Opponents behave descriptively (e.g., submit googolplexes).  
  **Case for Requirement**: The Luring Lottery yields different solutions under (a) "submit 1 entry" (superrationality) vs. (b) no pure-strategy Nash equilibrium. Humans' googolplex submissions require empirical handling.  
  **Non-Negotiable**: Yes. Rationality depends on opponent models.  

  #### **6. No Causal Influence**  
  **Description**: The theory must not rely on players causally affecting others' choices (e.g., via signaling).  
  **Case for Requirement**: Both games forbid communication/correlation. Superrationality’s "same action" must arise from reasoning, not causation.  
  **Non-Negotiable**: Yes. Violates the problem setup.  

  #### **7. Individual Rationality Justification**  
  **Description**: The prescribed action must be explictly rational *for the individual*, not just collectively optimal.  
  **Case for Requirement**: Superrationality’s Platonia solution (\(p = 1/20\)) must defend why a player should accept \(1.93\)% win chance instead of defecting to \(p = 1\).  
  **Non-Negotiable**: Yes. Purely collective reasoning is insufficient for individual choice.  

  ---

  ### **Verdict**  
  #### **Key Separator from Standard Game Theory**  
  **Desideratum 5a (Identical Reasoners)** does the most work. Superrationality assumes players are "clones" who will necessarily choose the same action because they share identical reasoning. This explains:  
  - **Platonia**: All use \(p = 1/20\) to maximize collective success, accepting lower individual EV than defection, because defection implies *all* defect → payoff 0.  
  - **Luring Lottery**: All submit 1 entry because (1) identical reasoning forces symmetry, and (2) \(k=1\) maximizes individual payoff *if all do it* (payoff = \(\$1M / n^2\)), while \(k \to \infty\) crashes the prize.  

  Standard game theory rejects identical reasoning, treating players as independent agents. Thus:  
  - Platonia has no symmetric Nash equilibrium (only asymmetric ones, e.g., one predetermined sender).  
  - Luring Lottery has no pure-strategy Nash equilibrium; mixed strategies or irrationality result.  

  #### **Can All Desiderata Be Jointly Satisfied?**  
  **No**—without identical reasoners (5a), desiderata 1–4 and 7 conflict. For example:  
  - In Platonia, symmetry (1) and non-degeneracy (2) require mixed strategies (3). But standard rationality (5b) makes symmetric mixed strategies unstable: if others use \(p = 1/20\), your best response is \(p = 1\) (win chance ≈38.6% > 1.93%). Thus, individual rationality (7) breaks symmetry.  
  - Only identical reasoners (5a) resolve this by linking decisions: defection fails because *if you defect, all defect*.  

  **Identical reasoning is not "sneaked in"—it is explicit and necessary**. It breaks when:  
  1. **Heterogeneous reasoners exist**: If some players are standard rationalists or humans (e.g., Luring Lottery googolplex-submitters), superrational prescriptions fail.  
  2. **Uncertainty about opponents**: If you doubt others are identical reasoners, defection becomes rational (e.g., submit \(k=2\) in Luring Lottery if \(n=3\)).  

  #### **Conclusion**  
  Superrationality’s innovation is **Desideratum 5a (identical reasoners)**, which satisfies 1–4 and 7 by making collective optimization individually rational. Without 5a, standard game theory cannot achieve non-degenerate symmetric outcomes (e.g., Platonia’s positive payoffs or Luring’s finite entries). However, 5a is fragile—it fails under opponent heterogeneity, making superrationality domain-specific. An adequate theory must therefore incorporate 5a as a **non-universal but powerful tool** for symmetric games with shared epistemic assumptions.
