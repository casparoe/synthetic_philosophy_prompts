  We are looking for desiderata (requirements) for a theory of individual decision-making in symmetric, one-shot, no-communication games. The theory should prescribe an action (or a probability distribution over actions) for each player and explain why that is rational, beyond just being an equilibrium.

  We'll consider the following cases:

  1. **Platonia Dilemma**: 
     - 20 players. Each can choose to "send" a telegram or not. If exactly one player sends, that player wins a billion. Otherwise, no one wins.
     - Problems: 
       - If everyone sends, then no one wins (too many senders).
       - If no one sends, then no one wins (no sender).
       - Any deterministic symmetric strategy (everyone does the same) leads to either 0 or 20 senders, both of which yield 0. So we need a mixed strategy.

