  ## Joint Statement: Adversarial Collaboration on Updating Conditional Probability Constraints in the Judy Benjamin Problem

  **Parties:**  
  - **MRE Proponent**: Holds that the unique rational posterior minimizes KL-divergence (relative entropy) from the prior, subject to the constraint.  
  - **Underdetermination Proponent**: Holds that learning a bare conditional probability constraint underdetermines the posterior; rational updating requires protocol/provenance information.  

  **Test Case:** The Judy Benjamin problem.  
  - **Prior**: Uniform over four states:  
    - \( \text{RH} \) (Red, Headquarters), \( \text{RS} \) (Red, Second Company),  
    - \( \text{BH} \) (Blue, Headquarters), \( \text{BS} \) (Blue, Second Company).  
    Thus: \( P_0(\text{RH}) = P_0(\text{RS}) = P_0(\text{BH}) = P_0(\text{BS}) = 0.25 \).  
  - **Constraint**: A fully reliable source reports \( P(\text{H}|\text{R}) = q \) (with \( q \neq 0.5 \)).  

  ---

  ### (1) Agreed-Upon Claims  
  1. **Inapplicability of Standard Rules**:  
     - Bayes conditioning cannot be directly applied, as the update is not triggered by a learned event (e.g., "R is true").  
     - Jeffrey conditioning cannot be directly applied, as the constraint is conditional (\( P(\text{H}|\text{R}) = q \)), not marginal (e.g., \( P(\text{R}) \)).  

  2. **Constraint Scope**:  
     - The constraint \( P(\text{H}|\text{R}) = q \) **entails**:  
       - \( P(\text{RH}) / P(\text{R}) = q \) (where \( P(\text{R}) = P(\text{RH}) + P(\text{RS}) \)).  
     - The constraint **does not entail**:  
       - Any direct restriction on \( P(\text{B}) \), \( P(\text{H}|\text{B}) \), or the joint probabilities in Blue territory.  
       - A unique posterior; additional assumptions are needed for uniqueness.  

  3. **MRE Solution for Judy Benjamin**:  
     - The MRE update yields:  
       \[
       P_{\text{MRE}}(\text{RH}) = \frac{q}{1+q}, \quad 
       P_{\text{MRE}}(\text{RS}) = \frac{1-q}{1+q}, \quad 
       P_{\text{MRE}}(\text{BH}) = P_{\text{MRE}}(\text{BS}) = \frac{q}{2(1+q)}.
       \]
     - Key properties:  
       - \( P_{\text{MRE}}(\text{R}) = \frac{1}{1+q} \) (decreases if \( q > 0.5 \)).  
       - \( P_{\text{MRE}}(\text{B}) = \frac{q}{1+q} \) (increases if \( q > 0.5 \)).  
       - \( P_{\text{MRE}}(\text{H}|\text{B}) = 0.5 \) (matches the prior).  

  4. **Underdetermination Without Provenance**:  
     - Absent protocol information, multiple distinct posteriors satisfy \( P(\text{H}|\text{R}) = q \) and coherence. Examples:  
       - **MRE posterior** (as above).  
       - **Marginal-preserving posterior**:  
         \[
         P_{\text{MP}}(\text{RH}) = \frac{q}{2}, \quad 
         P_{\text{MP}}(\text{RS}) = \frac{1-q}{2}, \quad 
         P_{\text{MP}}(\text{BH}) = P_{\text{MP}}(\text{BS}) = 0.25.
         \]
         (Retains \( P_{\text{MP}}(\text{R}) = 0.5 \) and \( P_{\text{MP}}(\text{B}) = 0.5 \).)  

  ---

  ### (2) Disagreements Table  
  | Issue | MRE Position | Underdetermination Position | Disagreement Type |  
  |-------|--------------|------------------------------|-------------------|  
  | **Uniqueness of rational posterior** | The MRE posterior is uniquely rational. Minimizing KL-divergence is a norm of epistemic conservatism. | No unique rational posterior exists without protocol information. KL-minimization is one heuristic among many. | **Substantive** |  
  | **Role of \( P(\text{B}) \) change** | The change in \( P(\text{B}) \) is a rational consequence of minimizing unnecessary information loss. The constraint *indirectly* affects Blue. | \( P(\text{B}) \) should not change without evidence about Blue. The MRE change is an artifact of its assumptions, not rationality. | **Substantive** |  
  | **Epistemic status of KL-minimization** | KL-minimization is a fundamental rational requirement for updating under constraints. | KL-minimization is permissible but not obligatory. Rationality permits other updates (e.g., marginal-preserving) absent provenance. | **Substantive** |  
  | **Interpretation of "no evidence about Blue"** | "No evidence about Blue" means no *direct* constraint, but indirect effects via KL-minimization are rational. | "No evidence about Blue" implies \( P(\text{B}) \) must be conserved; any change requires evidence tied to Blue. | **Verbal** (partly) |  

  ---

  ### (3) Cruxes  
  Cruxes are sub-questions whose resolution would significantly sway one or both parties. Each crux includes a test case and advance predictions.  

  #### **Crux 1: Does protocol information determine the rational update?**  
  **Test Case**: *Source Protocol Transparency*  
  - **Protocol A (Always Report)**: The source always reports \( P(\text{H}|\text{R}) \) truthfully, regardless of the agent’s location.  
  - **Protocol B (Report Only in Red)**: The source reports \( P(\text{H}|\text{R}) \) *only* if the agent is in Red territory. If in Blue, the source is silent.  

  | Position | Prediction |  
  |----------|------------|  
  | **MRE** | The rational update is identical in both protocols: \( P_{\text{MRE}} \). Protocol is irrelevant; only the constraint matters. |  
  | **Underdetermination** | The update differs by protocol:  
    - **Protocol A**: \( P_{\text{MP}} \) (no change to \( P(\text{B}) \)), as the report is insensitive to Blue.  
    - **Protocol B**: Condition on \( \text{R} \) being true (since report implies \( \text{R} \)), yielding \( P(\text{RH}) = q \), \( P(\text{RS}) = 1-q \), \( P(\text{B}) = 0 \). |  
  **Resolution**: If empirical/normative analysis shows that rational agents update differently across protocols, Underdetermination is favored. If updates are protocol-invariant, MRE gains support.  

  ---

  #### **Crux 2: Is the change in \( P(\text{B}) \) in MRE a normative error?**  
  **Test Case**: *Betting on Blue*  
  After updating on \( P(\text{H}|\text{R}) = q \), the agent is offered a bet on being in Blue territory at pre-update odds (1:1). Which update rule leads to better long-run calibration?  

  | Position | Prediction |  
  |----------|------------|  
  | **MRE** | Agents using \( P_{\text{MRE}} \) avoid exploitable losses. The change in \( P(\text{B}) \) reflects indirect evidence; betting at 1:1 odds is exploitable. |  
  | **Underdetermination** | Agents using \( P_{\text{MP}} \) (unchanged \( P(\text{B}) \)) perform optimally. MRE agents over-adjust and incur losses when Blue is statistically independent of the report. |  
  **Resolution**: Simulate agents in repeated Judy Benjamin problems with ground-truth states. Track which update rule yields better betting success under protocols like **A** or **B**.  

  ---

  #### **Crux 3: Does KL-minimization handle sequential updates consistently?**  
  **Test Case**: *Sequential Reports*  
  First, learn \( P(\text{H}|\text{R}) = q \). Then, learn \( P(\text{H}|\text{B}) = 0.5 \) (the prior value) from an independent source.  

  | Position | Prediction |  
  |----------|------------|  
  | **MRE** | The final posterior matches the MRE solution for joint constraints \( (P(\text{H}|\text{R}) = q, P(\text{H}|\text{B}) = 0.5) \), regardless of update order. |  
  | **Underdetermination** | Final posterior depends on the first update:  
    - If first update is \( P_{\text{MP}} \), then \( P(\text{H}|\text{B}) = 0.5 \) leaves probabilities unchanged.  
    - If first update is \( P_{\text{MRE}} \), the second update alters Blue probabilities.  
    Order-dependence reveals MRE’s path-sensitivity as a flaw. |  
  **Resolution**: If sequential MRE updates match the joint solution, MRE gains support. If order-dependence leads to arbitrariness, Underdetermination is favored.  

  ---

  ### Special Analysis: The \( P(\text{B}) \) Change Disagreement  
  The dispute centers on whether MRE’s change to \( P(\text{B}) \) violates "having no evidence about Blue."  
  - **MRE View**: "No evidence about Blue" means no *explicit* constraint on Blue events. The change in \( P(\text{B}) \) arises from minimizing epistemic costs, not evidence about Blue.  
  - **Underdetermination View**: "No evidence about Blue" implies conservation of \( P(\text{B}) \). The change is irrational without provenance justifying indirect effects.  

  **Verdict**: A **substantive disagreement** with a verbal component. The core issue is whether rationality *allows* indirect probability shifts absent direct evidence. Crux 2 (betting calibration) is decisive here. If MRE agents are consistently exploitable when the report is independent of Blue, Underdetermination prevails; if not, MRE’s view of "evidence" gains credence.  

