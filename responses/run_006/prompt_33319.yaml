  ### Special Attention: Change in P(Blue) and "No Evidence"

  We both agree that the constraint P(H|R)=q provides no evidence about Blue territory in the sense that it does not provide information that directly bears on the events in Blue. However, the MRE update changes P(Blue). The MRE position argues that this change is not due to evidence about Blue but is a consequence of minimizing information loss while respecting the constraint. The underdetermination position counters that if there is no evidence about Blue, then the probability of Blue should not change.

  The disagreement is substantive: it turns on whether rationality requires conservation of marginal probabilities in the absence of evidence about that margin. The MRE position says no; the underdetermination position says yes.

  We agree that resolving this requires clarifying what counts as "evidence about Blue." The underdetermination position defines evidence about Blue as information that would be generated by a process that is sensitive to the state of Blue territory. The MRE position defines evidence more broadly: any information that, when processed in a way that minimizes unnecessary information loss, might indirectly affect the probability of Blue.

