  | Role of KL-minimization | KL-minimization is a fundamental rationality requirement for updating under constraints. | KL-minimization is one possible rule among many, and its application depends on assumptions about the information-generating process. It is not universally mandated by rationality. | Substantive |
  | Change in P(Blue) | The decrease in P(Blue) (from 1/2 to q/(1+q)) is a rational requirement because it minimizes information loss while respecting the constraint. | The change in P(Blue) is not rationally required. It is an artifact of the MRE rule. In some reporting protocols, P(Blue) should remain unchanged; in others, it might change. The constraint P(H|R)=q alone does not provide evidence about Blue. | Substantive (but see cruxes below for whether it's about evidence) |
  | Interpretation of "no evidence about Blue" | The MRE update does not assume evidence about Blue; the change in P(Blue) is a byproduct of minimizing information loss while satisfying the constraint. | The constraint P(H|R)=q provides no evidence about Blue territory, so P(Blue) should remain unchanged unless the reporting protocol indicates otherwise. The MRE rule implicitly makes an assumption about the protocol. | Substantive (with a verbal component about what "no evidence" entails) |

  ### (3) Cruxes

  We identify the following cruxes. For each, we describe a test case (a scenario with specified provenance) and our advance predictions.

  **Crux 1: Does the rational update depend on the reporting protocol?**
    - **Test Case**: Consider a variant of the Judy Benjamin problem where the reporting protocol is specified. 
      - *Protocol A*: The source always reports the conditional probability P(H|R) truthfully, regardless of whether the agent is in Red or Blue. (But if the agent is in Blue, the source might not say anything? We need to specify.)
        Actually, to be precise: The source is asked: "If the agent is in Red territory, what is the probability she is in Headquarters?" The source knows the entire situation and reports q truthfully. But note: this q is the true conditional probability in the world. So the report is always the true P(H|R). This protocol does not give any information about Blue because the report is only about Red.
      - *Protocol B*: The source is only activated if the agent is in Red territory. If the agent is in Blue, the source remains silent and no report is issued. In this case, the fact that a report was issued implies that the agent is in Red territory.

    - **MRE Prediction**: 
        The MRE position holds that the same update (the MRE posterior) is rational regardless of the protocol. The constraint P(H|R)=q is the same, so the update should be the same.
        Therefore, in both protocols, the rational posterior is the MRE solution (with P(B)=q/(1+q)).

    - **Underdetermination Prediction**:
        The update should depend on the protocol:
          - For Protocol A: The report provides only the constraint P(H|R)=q and nothing else. Since the report is issued regardless of the territory, it does not provide evidence about the territory. Therefore, the marginal P(R) should remain 1/2. The update should set P(RH)=q/2, P(RS)=(1-q)/2, and leave P(BH)=P(BS)=1/4? But then the total probability would be 1, and the constraint is satisfied. This is one permissible update (and in fact, it is the one that minimizes the change in the marginal P(R)).
          - For Protocol B: The report is only issued in Red territory, so the fact that a report was issued means that the agent is in Red. Therefore, the update should condition on R: set P(R)=1, and then set P(H|R)=q. So P(RH)=q, P(RS)=1-q, and P(BH)=P(BS)=0.

    - **Resolution**: If it turns out that rational agents using Protocol A should not change P(B) (i.e., keep it at 1/2), then the underdetermination position gains support. If they must change P(B) to q/(1+q) regardless of the protocol, then MRE gains support.

  **Crux 2: Is the change in P(Blue) a violation of "no evidence about Blue"?**
    - **Test Case**: Consider a scenario where there is a second, independent source that can provide information about Blue territory. We ask: does the report about the conditional in Red territory change the agent's beliefs about what the second source would say? Specifically, we compare the prior and posterior probabilities of the event that the second source would report "High probability of H in Blue".
      - Setup: The agent is about to receive a report from a second source that is known to report the true conditional probability P(H|B). But before receiving that report, the agent first receives the report about Red (with constraint P(H|R)=q). We then ask for the agent's posterior probability that the second source will report a specific value, say P(H|B)=0.6.

    - **MRE Prediction**:
        The MRE update does not change the conditional probability P(H|B) (it remains 0.5). However, the marginal P(B) changes. Therefore, the agent's belief about the event that the second source will report 0.6 might change? 
        But note: the second source reports the true P(H|B). The agent's belief about the true P(H|B) is fixed by the prior and the update. In the prior, the agent knows that the true P(H|B) is 0.5 (because the prior is known to be the true distribution? but wait, the agent has a prior and then updates). 

        Actually, in the Judy Benjamin setup, the agent starts with a prior that is uniform (so she believes the true P(H|B) is 0.5). The report about Red does not provide any information about the true distribution in Blue? The MRE update does not change the conditional distribution for Blue: it remains 0.5. Therefore, the agent's posterior belief about what the second source will report remains concentrated on 0.5. So no change.

    - **Underdetermination Prediction**:
        In the underdetermination view, one permissible update (like the one that keeps the marginal P(R) unchanged) does not change the conditional distribution for Blue either. However, another update (like the MRE update) changes the marginal but not the conditional. But note: the underdetermination position does not require that the conditional for Blue remains unchanged. It could change if the protocol suggests so. But in the absence of protocol information, they might say that the agent may choose an update that leaves the conditional for Blue unchanged (and thus the belief about the second source's report remains the same). 

