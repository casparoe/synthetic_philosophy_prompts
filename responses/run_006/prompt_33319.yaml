    We need a world where the true P(H|R) varies. Let's consider a meta-world: we have many pairs of (territory, company) but generated from a distribution. We can consider a world with a fixed true distribution that is not uniform. But then the agent's prior might be different.

    This crux might be hard to test empirically.

    Instead, we might use a symmetry argument: 
        Consider learning the reverse constraint: P(R|H)=q'. Should that change P(Blue)? The MRE update for P(R|H)=q' would be different. The underdetermination position might similarly argue that P(Blue) should not change. But note: P(R|H)=q' does provide evidence about Blue? Because if H is true, then the probability of R is q', so the probability of B given H is 1-q'. 

    This might not be symmetric.

  Given the complexity, we leave the resolution of the change in P(Blue) as an open issue that requires further investigation.

  ### Conclusion
  We have laid out points of agreement and disagreement, and identified key cruxes. We hope that future work on specific test cases with well-specified protocols will help resolve these issues.
