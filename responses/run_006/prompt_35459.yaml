  been rereading the genealogy and this one's been bugging me. suppose nietzsche could scroll through twitter in 2024. he'd see people putting their pronouns in bios, calling each other out for 'harm,' and a whole discourse around trauma and safety that treats psychological vulnerability as something that gives you moral standing. in the genealogy, he argues that the slave revolt in morality turned weakness into virtue — the powerless couldn't get revenge in the real world so they invented a moral system where being powerless made you good. but the modern version seems different: people don't just claim to be good *despite* being vulnerable, they claim moral authority *because* of it. you're supposed to defer to someone's account of their own harm. would nietzsche see this as a straightforward extension of the slave revolt, or would he have to revise his analysis? and here's the part i really can't figure out: in the genealogy he's pretty clear that the slave revolt worked through *ressentiment* — the weak *hate* the strong but can't act on it, so they imagine a future where the strong get punished. but a lot of the modern discourse seems to be about *demanding* things in the here and now, getting people fired, deplatforming them. that's not imaginary revenge, that's real power. so would nietzsche say the slaves have actually *won* — that they've figured out how to excercise real power while still calling themselves the oppressed — and if so, what does that do to the whole genealogy framework? i'd also like you to say how confident you are in your answer and flag the point you're least sure about.
