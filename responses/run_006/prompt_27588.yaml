  The user's confusion seems to stem from applying a physical artifact (a drawing) to abstract systems. In the drawing, Escher is clearly external. But in consciousness, is there an equivalent "external" entity? The mind trying to explain itself is part of the system. Similarly, a constitution is created by people within a legal tradition, not outside it. The user is questioning if the inviolate level is truly external or part of the system itself.

