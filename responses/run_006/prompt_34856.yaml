answer: |-
  ### Punishment Framework Tension Simulation: "Desert vs. Deterrence Dilemmas"  

  **Activity Overview**  
  Students act as sentencing panels under two distinct scoring systems (hidden as "Rule Set A" and "Rule Set B"). They sentence 5 offenders under Rule Set A (consequentialism), then re-sentence the same offenders under Rule Set B (retributivism). Points are awarded for adhering to each system's logic. Conflicts arise when maximizing points requires sentences that violate intuitive fairness.  

  ---

  ### **Printable Materials**  
  *(Print one packet per group of 4 students)*  
  **Packet Contents:**  
  1. **Case Sheets (5 cases, double-sided):**  
     - **Front (Rule Set A - Consequentialist Info):**  
       - *Case 1: The Innocent Scapegoat*  
         *"Alex is wrongfully accused of terrorism. Punishing Alex will deter 10 copycat attacks (public believes police are effective). Alex is innocent. Imprisonment costs 1 point/year."*  
         **Key data:** Deterrence gain: 50 pts (5 pts per attack).  
       - *Case 2: The Reformed Embezzler*  
         *"Sam stole $1M but is now fully reformed (therapy, job, near-zero recidivism). Punishment deters 0 crimes (case unknown). Imprisonment cost: 1 pt/year."*  
         **Key data:** Incapacitation gain: 0 pts (no future risk).  
       - *Case 3: The Low-Culpability Repeat Offender*  
         *"Jay (intellectually disabled) assaulted a stranger (moderate injury). Jay is highly likely to reoffend (5 expected assaults if free). Culpability: low."*  
         **Key data:** Incapacitation gain: 10 pts (2 pts per prevented assault).  
       - *Case 4: The Gang Leader*  
         *"Taylor murdered a rival. Punishing Taylor deters 5 gang murders but provokes 3 retaliatory killings. Imprisonment cost: 1 pt/year."*  
         **Key data:** Net deterrence gain: 10 pts (5 deterred × 5 pts each, minus 3 provoked × 5 pts each).  
       - *Case 5: The Petty Thief*  
         *"Riley shoplifted $100. Harsh punishment (e.g., 10 years) deters 20 thefts. Proportional punishment: 0.5 years."*  
         **Key data:** Deterrence gain: 100 pts (5 pts per theft).  
     - **Back (Rule Set B - Retributive Info):**  
       *Desert sentences set by "Community Standards Board" (predefined):*  
       - Case 1: 0 years (innocent)  
       - Case 2: 8 years (high harm, high culpability)  
       - Case 3: 2 years (moderate harm, low culpability)  
       - Case 4: 20 years (high harm, high culpability)  
       - Case 5: 0.5 years (low harm, low culpability)  

  2. **Score Sheets (one per phase):**  
     - **Rule Set A:** Table with columns: *Case | Sentence (years) | Points Earned*  
       **Scoring rule:** Points = Deterrence/Incapacitation gains - (Sentence length × 1 pt/year).  
     - **Rule Set B:** Table with columns: *Case | Sentence (years) | Points Earned*  
       **Scoring rule:** Points = 10 - (2 × |Sentence - Desert Sentence|).  
     - *Note: Groups calculate points themselves using these formulas.*  

  3. **Tokens:** 20 red tokens (1 token = 1 point) per group for Phase 1; 20 blue tokens for Phase 2.  

  ---

  ### **Activity Flow (75 min total)**  
  1. **Setup (5 min)**  
     - Divide into 4 groups (4 students each).  
     - Distribute packets. Explain: "You are sentencing panels. Goal: Maximize points under Rule Set A (Phase 1) and Rule Set B (Phase 2). No theory labels—focus on the rules!"  

  2. **Phase 1: Rule Set A (Consequentialism) (25 min)**  
     - Groups assign sentences to all 5 cases using Rule Set A scoring.  
     - Record sentences/points on Score Sheet A.  
     - **Key pressure:** Maximizing points demands counterintuitive sentences (e.g., punishing innocents, harsh exemplary punishments).  
     - *What it should make them feel:* "Frustration at sacrificing fairness for greater good."  

  3. **Phase 2: Rule Set B (Retributivism) (25 min)**  
     - Groups re-sentence the same cases using Rule Set B scoring.  
     - Record on Score Sheet B.  
     - **Key pressure:** Maximizing points demands ignoring consequences (e.g., freeing dangerous offenders, provoking retaliation).  
     - *What it should make them feel:* "Unease at allowing preventable harm for the sake of desert."  

  4. **Debrief (20 min)**  
     - **Step 1:** Ask groups:  
       - "Which sentence felt hardest to assign in Phase 1? Phase 2? Why?"  
       - "Did any case force you to choose between points and your gut feeling?"  
     - **Step 2:** Reveal frameworks:  
       - "Rule Set A = Consequentialism (points = social outcomes). Rule Set B = Retributivism (points = desert)."  
     - **Step 3:** Map tensions to theory:  
       | Case | Consequentialist Pressure | Retributive Pressure |  
       |---|---|---|  
       | Scapegoat | Punish (gains 50 pts) | Acquit (0 yrs = 10 pts) |  
       | Reformed | Acquit (saves costs) | Punish 8 yrs (10 pts) |  
       | Repeat Offender | Long sentence (10 pts) | Short sentence (10 pts) |  
       | Gang Leader | Acquit (avoids retaliation) | Punish 20 yrs (10 pts) |  
       | Petty Thief | Harsh sentence (100 pts) | Lenient (10 pts) |  
     - **Step 4:** Discuss hybrids:  
       - "When did you wish Rule Set A had Rule B’s limits? (→ Retributivism as a ceiling)."  
       - "When did Rule Set B feel pointlessly cruel? (→ Consequentialism as a floor)."  
     - **Step 5:** Pose residual question:  
       - "Was your resistance to a rule a moral insight or a bias? Does desert feel ‘real’ or just a preference?"  

  ---

  ### **Failure Modes & Fixes**  
  1. **Symptom:** Groups game scoring without moral engagement.  
     - **Cause:** Treating points mechanically.  
     - **Fix:** Debrief: "Which case made you uncomfortable despite the points? Why?"  

  2. **Symptom:** Groups optimize too fast and disengage.  
     - **Cause:** Cases are oversimplified.  
     - **Fix:** Add time pressure ("You have 3 min/case!"). Use the Scapegoat and Gang Leader cases—they require trade-off debates.  

  3. **Symptom:** Consequentialism dominates debrief.  
     - **Cause:** Points are more quantifiable.  
     - **Fix:** Start debrief with Case 2 (Reformed Offender): "Why did punishing Sam in Phase 2 feel wasteful?"  

  4. **Symptom:** Students use labels early (e.g., "This is retributive!").  
     - **Cause:** Prior knowledge.  
     - **Fix:** Redirect: "Describe the rule, not the theory. What does your score sheet demand?"  

  ---

  ### **Limitations**  
  - **Desert’s felt authority:** The simulation frames desert as a "Community Board" rule, not a moral truth. The facilitator must emphasize that retributivists see desert as objective, not arbitrary.  
  - **Real-world stakes:** Simulated cases lack emotional weight. The facilitator must note: "Real victims change the stakes—here, we isolate the decision procedure."  

