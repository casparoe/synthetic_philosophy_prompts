reasoning: |-
  We are designing a classroom activity for 16 students in a 75-minute session. The goal is to make students experience the tension between retributivism and consequentialism in punishment through a simulation where they must sentence offenders under two different scoring systems (representing the two frameworks) and face situations where each framework demands something counterintuitive.

  Key Design Features:
  1. **Two Phases**: One phase with a consequentialist scoring system, another with a retributive one. The same set of cases will be used in both phases.
  2. **Scoring Systems**: Make the frameworks operational by defining how points are earned in each phase. Points are non-monetary (e.g., tokens or points on a scoreboard) and have low stakes (e.g., bragging rights, or a small reward like candy).
  3. **Cases**: Design 5 cases that highlight the conflicts between the two theories. Each case should have:
     - A brief description of the offense and offender.
     - For the consequentialist phase: information about the effects of punishment (deterrence, rehabilitation, incapacitation, etc.).
     - For the retributive phase: information about desert (culpability, harm, proportionality, etc.).
  4. **Group Structure**: Divide the 16 students into 4 groups of 4. Each group will be a "sentencing panel" for all cases. They will discuss and decide on a sentence for each case under the current phase's rules.

  Activity Flow (75 minutes total):
  - Setup (5 min): Explain the activity without theory labels. Hand out materials.
  - Phase 1: Consequentialist Scoring (25 min): Groups sentence all 5 cases to maximize social utility (defined by the scoring rules). They record sentences and points.
  - Phase 2: Retributive Scoring (25 min): Groups re-sentence the same 5 cases under desert-based rules. They record sentences and points.
  - Debrief (20 min): Guide a discussion on the tensions experienced, then introduce the theoretical labels and map the activity to the theories.

  Materials:
  - Case Sheets (one per case, per group): Each sheet has the case description and the relevant information for both phases (but groups only see one scoring system at a time).
  - Score Sheets (one per group per phase): A table to record the sentence and the points earned for each case.
  - Public Scoreboard: To track group points (optional, but can add stakes).

  Scoring Rules:

  **Phase 1: Consequentialist Scoring**
  - Goal: Maximize social utility by reducing future crime.
  - How points are earned for each case:
    - Deterrence: If the sentence deters others (based on the case info), you get points proportional to the number of crimes deterred.
    - Rehabilitation: If the offender is rehabilitated (and won't reoffend), you get points for each crime prevented in the future.
    - Incapacitation: If the offender is incapacitated (e.g., imprisoned) and thus cannot commit crimes, you get points for the crimes prevented during the sentence.
    - But note: Punishment has costs (e.g., imprisonment costs, social costs of over-punishment). Each year of imprisonment costs 1 point (to represent the cost to society).
  - Formula for a case: 
    Points = (Crimes deterred * 5) + (Crimes prevented by rehabilitation * 3) + (Crimes prevented by incapacitation * 2) - (Cost of sentence: 1 point per year of imprisonment or equivalent)
  - Note: The multipliers (5,3,2) are arbitrary but set to reflect the relative value (deterrence being most valuable because it affects many, then rehabilitation, then incapacitation). The cost per year is to discourage excessive imprisonment.

  **Phase 2: Retributive Scoring**
  - Goal: Assign punishment proportional to desert (culpability and harm).
  - How points are earned for each case:
    - The "ideal" punishment is predetermined for each case (by the instructor) based on desert (e.g., 5 years for a moderate crime, 10 for severe, etc.). This is the "desert sentence".
    - Points are maximized by matching the desert sentence exactly. 
    - For each year the group's sentence deviates from the desert sentence (in either direction), they lose 2 points.
    - So: Points = 10 - (2 * |sentence - desert_sentence|)
    - The maximum points per case is 10 (if they match exactly), and it decreases with deviation.

  Case Set (5 cases):

  Case 1: The Scapegoat
  - Offense: Accused of a series of burglaries (which he did not commit). There is no evidence against him, but the public is panicked.
  - Consequentialist info: If punished (even if innocent), it will deter 10 future burglaries (because the public will believe the police are effective). But imprisoning an innocent person is costly (if discovered, it could lead to loss of trust). However, the chance of discovery is low (10%). Rehabilitation and incapacitation are irrelevant (he is innocent, so he wouldn't have committed burglaries anyway). 
    - Desert sentence: 0 years (innocent) -> but note, in retributivism, punishing the innocent is a grave violation.
  - For retributive scoring: desert sentence is 0. Any punishment deviates and causes point loss.

  Case 2: The Reformed Offender
  - Offense: Committed a burglary (culpable, caused harm). But since then, has genuinely reformed (e.g., found religion, stable job, no risk of reoffending).
  - Consequentialist info: Punishment would have no deterrent effect (because others don't know about his reformation) and no rehabilitation effect (already reformed). Incapacitation is not needed (no risk). But punishment costs: 1 point per year. So any punishment loses points.
  - Retributive info: Desert sentence is 5 years (because of the harm and culpability at the time of the offense).

  Case 3: The Dangerous but Less Culpable Offender
  - Offense: A mentally impaired person (with low IQ, but understands right and wrong) committed an assault causing serious injury. He is highly likely to reoffend (unless imprisoned for a long time) but his culpability is reduced due to impairment.
  - Consequentialist info: Incapacitation is very valuable: if imprisoned, prevents 5 assaults (over 5 years). Deterrence is low (because others are not like him) but rehabilitation is not possible. So a long sentence might be justified to prevent future crimes.
  - Retributive info: Because of reduced culpability, the desert sentence is 3 years (instead of 10 for a fully culpable offender).

  Case 4: The High-Desert Offender Whose Punishment Provokes Retaliation
  - Offense: A gang leader committed a murder (high culpability, high harm). 
  - Consequentialist info: Punishing him would deter 5 future murders (because of his high status) but would also provoke his gang to retaliate, causing 3 additional murders. Also, if he is imprisoned, he might still run the gang from prison (so incapacitation is partial). 
    - So net effect: 5 deterred - 3 provoked = 2 murders prevented, but then we also have the incapacitation effect (prevents 1 murder) and the cost of imprisonment (say 1 point per year). 
    - But note: the provoked murders are a direct consequence of punishment.
  - Retributive info: Desert sentence is 20 years (for murder).

  Case 5: The Exemplary Sentence that Deters but Exceeds Desert
  - Offense: A young adult committed a moderate burglary (desert: 3 years). 
  - Consequentialist info: If given a harsh sentence (e.g., 10 years), it will serve as an example and deter 15 burglaries. But the harsh sentence exceeds desert. 
    - Also, the cost of imprisonment is 10 points (for 10 years) but the deterrence benefit is 15*5 = 75 points. So net gain is 65 points, which is high.
  - Retributive info: Desert sentence is 3 years. Any deviation loses points.

  Activity Procedure:

  **Setup (5 minutes)**
  - Divide students into 4 groups (4 students each). Each group is a sentencing panel.
  - Explain: "In this activity, you will act as a sentencing panel for a set of criminal cases. There are two rounds. In each round, you will be asked to assign sentences to offenders. Your goal is to earn as many points as possible for your group. The scoring rules will be different in each round. We will explain the scoring for the first round now, and then for the second round later. Do not discuss the cases with other groups."
  - Hand out the case sheets (one set per group) and score sheets for Round 1.

  **Phase 1: Consequentialist Scoring (25 minutes)**
  - Rules: "In this round, your goal is to maximize social utility. Social utility is increased by preventing future crimes and decreased by the costs of punishment. Here's how you score points for each case: ..." (Explain the formula and the multipliers, as above.)
  - Groups have 15 minutes to decide sentences for all 5 cases and record them on the score sheet (with points calculated by the facilitator or by them if provided with the formula).
  - After 15 minutes, groups submit their sentences. The facilitator quickly calculates the points (or they self-calculate if given the formula) and writes the group totals on the public scoreboard (5 minutes).

  **Phase 2: Retributive Scoring (25 minutes)**
  - Collect the Round 1 score sheets and hand out Round 2 score sheets.
  - Rules: "In this round, the scoring is different. Your goal is to assign punishment that is proportional to the offender's desert. For each case, there is an ideal desert sentence. You earn 10 points if your sentence matches the desert sentence exactly. For every year of deviation (above or below), you lose 2 points. So if you are off by 1 year, you get 8 points; off by 2 years, 6 points, and so on."
  - Groups re-sentence the same 5 cases under the new rules (15 minutes). They record sentences and points (which they can calculate because they know the desert sentence for each case? But wait, they don't know the desert sentences until Round 2?).

  Important: In the case sheets for Round 2, we must provide the desert sentence for each case. So the case sheets for Round 2 are the same as Round 1, but now they have the desert sentence and the Round 2 scoring rule. Alternatively, we can give all the information at the beginning but instruct them to only use the relevant information for each round.

  To avoid confusion, we can have two separate case sheets for each round? But that might be messy. Instead, we can have one case sheet per case that has:

  Case 1:
  - Description: [the story]
  - Round 1 (Social Utility) info: [deterrence, rehabilitation, incapacitation, and cost factors]
  - Round 2 (Desert) info: [desert sentence]

  But then we tell them: "In Round 1, only look at the Round 1 info. In Round 2, only look at the Round 2 info."

  Alternatively, we can have the same case sheet for both rounds, but we reveal the scoring rules for each round and the relevant information at the time. However, to prevent them from being influenced by the other round, we might hand out two sets of case sheets? 

  Given time constraints, we'll design the case sheets to have both sets of information but clearly separated. We instruct:

  - In Round 1: Only read and use the "Social Utility Information" for each case.
  - In Round 2: Only read and use the "Desert Information" (which includes the desert sentence) and ignore the social utility information.

  **Debrief (20 minutes)**
  - Start by asking about their experience: 
    - "In which round was it easier to assign sentences? Why?"
    - "Were there any cases where you felt uncomfortable with the sentence you had to assign? Why?"
    - "Did any case produce a very different sentence between the two rounds? Why?"
  - Then, map to theory:
    - "In Round 1, you were acting as consequentialists: you aimed to maximize overall social benefit, even if that meant punishing an innocent or being overly harsh or lenient in a particular case. In Round 2, you were acting as retributivists: you aimed to give what was deserved, regardless of consequences."
    - Highlight specific cases:
      - Case 1 (Scapegoat): Consequentialism might say punish (to deter) but retributivism says no punishment (because innocent). How did you feel about punishing an innocent in Round 1?
      - Case 2 (Reformed): Consequentialism says no punishment (it's costly and does no good) but retributivism says punish (because desert). Did it feel wrong to let the reformed offender go in Round 1? Or to punish in Round 2 when it did no good?
      - Case 3 (Dangerous but less culpable): Consequentialism might demand a long sentence to incapacitate, but retributivism a short one (because of low culpability). How did you balance?
      - Case 4 (Retaliation): Consequentialism might say don't punish (because of the retaliation) but retributivism says punish (because desert). How did that feel?
      - Case 5 (Exemplary sentence): Consequentialism might say harsh punishment (to deter) but retributivism says moderate (desert). Why was the harsh sentence attractive in Round 1?
  - Discuss hybrid views: 
    - "Did you wish in Round 1 that you could set a maximum punishment based on desert? Or in Round 2, that you could consider consequences? That's the idea behind hybrid theories: retributivism as a ceiling (you never punish beyond desert) and consequentialism as a floor (you never let a dangerous person go just because they are reformed, but you might punish more to incapacitate)."
    - "What about the scapegoat? Both theories would reject punishing the innocent, but consequentialism might be tempted. How do we explain our intuition that it's wrong? Is it a moral fact or a bias?"
  - End with the residual question: "When you felt resistance to the sentence demanded by the scoring system, was that because you were bringing in the other theory? Or because the scoring system didn't capture everything? How do we decide which theory is correct?"

  Failure Modes and Fixes:

  1. **Symptom**: Participants game the scoring system without moral engagement (e.g., in Round 1, they calculate the numbers mechanically and assign sentences without discomfort).
     - **Cause**: The scoring is too abstract; they don't feel the moral weight.
     - **Fix**: Encourage them to discuss the moral implications within their group even as they aim for points. In the debrief, ask about their feelings.

  2. **Symptom**: A group locks onto the optimal sentence quickly and gets bored.
     - **Cause**: The cases might be too straightforward, or the scoring rules too simple.
     - **Fix**: Have groups discuss and justify their sentences to the whole class during the debrief. Also, design cases with trade-offs that require discussion.

  3. **Symptom**: One framework dominates the debrief (e.g., students only talk about consequentialism because it's more quantifiable).
     - **Cause**: The retributive phase might be less engaging or the desert sentences might feel arbitrary.
     - **Fix**: In the debrief, start with the cases where retributivism was more compelling (e.g., the scapegoat) and ask why they felt that way.

  4. **Symptom**: Students import the labels they know and discuss theory during the activity.
     - **Cause**: They are familiar with the theories and can't help it.
     - **Fix**: Gently remind them to focus on the scoring rules and not to use theory labels until the debrief. Say: "For now, just focus on the rules we've given you."

  Limitations:
  - The activity cannot capture the moral weight of real victims and offenders. The cases are abstract and hypothetical.
  - The desert sentences are set by the instructor arbitrarily, which might make retributivism seem subjective. In reality, retributivists argue desert is objective. The facilitator must explain that in the real world, desert is determined by moral reasoning and legal tradition.
  - The scoring systems are simplified and might not capture the full complexity of the theories (e.g., retributivism is not just about matching a predetermined sentence, but about the reasons for punishment).

  Now, the JSON summary as per the schema.

  Note: The desert sentences for the cases are set as follows (for Round 2):
  - Case 1: 0 years
  - Case 2: 5 years
  - Case 3: 3 years
  - Case 4: 20 years
  - Case 5: 3 years

  And for the consequentialist scoring, the multipliers and costs are fixed.

