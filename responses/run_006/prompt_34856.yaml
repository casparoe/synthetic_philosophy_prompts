prompt: |-
  I run an upper-level undergraduate seminar in moral and political philosophy — 16 students, one 75-minute session — and we are in the middle of the punishment unit. The students can rehearse the standard positions (deterrence, rehabilitation, desert, proportionality, the familiar counterexamples), but they still treat retributivism and consequentialism as two vocabularies you can attach to whatever sentence you already favor. I want a single session that makes them feel that these are genuinely different decision procedures that come apart under pressure, and that each one, followed honestly, leads somewhere its own adherents find hard to accept.

  Design a runnable classroom simulation, role-play, or game for this group. It should use small non-monetary stakes — points, tokens, role assignments, a public scoreboard — and it must make the participants themselves sentence a set of offenders under one framework's constraints, hit the point where that framework demands something they want to refuse, then switch to the other framework and hit a different wall. The two frameworks should be operationalized as different scoring functions rather than as different rhetoric, so the conflict shows up as a concrete tension between two procedures. The theoretical distinction should surface from the rules and the cases before it is named: no lecture up front, and no labels until the debrief.

  The activity must fit 16 students in 75 minutes including setup, play, and debrief. Provide: the roles and printable materials (case sheets, score sheets, any tokens); the exact scoring or payoff rules for each phase; and a concrete case set engineered so the two frameworks diverge in specific ways — for example, a scapegoat whose punishment would deter many others, a fully reformed offender whose desert is high but whose punishment does no future good, a dangerous but less culpable offender, a high-desert offender whose punishment would provoke retaliation, and an exemplary sentence that deters but exceeds desert. Then give a debrief that maps specific moments in play onto the theoretical distinctions, including hybrid positions (retributivism as a ceiling on consequentialist punishment, consequentialism as a floor beneath which retributivism becomes pointless cruelty, side constraints) and the residual question of whether the participants' refusal is a moral datum or a bias to be explained away.

  Also tell me what will predictably go wrong the first time I run it — for instance, participants gaming the scoring system instead of inhabiting the role, a group locking onto the optimal sentence too quickly and getting bored, one framework dominating the debrief, or students importing the labels they already know back into the cases — and say how to handle each failure without feeding them the point. Be explicit about which feature of the real debate the activity cannot reproduce and the facilitator must supply (for example, the felt authority of desert as something more than a preference, or the difference between a simulated society and real victims). No readings or citations; everything should be runnable from the prompt alone.

  After you have described the activity and debrief, close with a compact JSON summary using exactly this schema:

