  Hmm, the user's core tension is between philosophical rigor and journalistic practicality. They can't dive into epistemology on deadline but need something more substantive than "consensus = truth." The procedure must flag when PMI genuinely applies versus when it's overblown, and distinguish empirical red flags from philosophical gray zones.

  First, I should structure this as a flowchart-like Q&A. Start with basic empirical checks before tackling deeper uncertainties. The exit points need to be clear: stop for "low confidence" if evidence is weak, or hand off to editors when it's about interpretation. 

  For the empirical triggers: replication, methodology, and consensus strength are concrete. But "consensus dissensus" is trickier - that's where PMI bites hardest, like when past theories had unified support that later collapsed. For philosophical handoffs, questions about realism (e.g., can the claim even be falsified?) should go to editors since journalists aren't arbiters of metaphysics.

  Testing the procedure on their two cases will show how it works. The climate model should pass most checks (strong evidence, converging methods) despite PMI's general caution about models. The evolutionary psych claim likely fails at replication and methodology checks, plus its adaptationist narrative might need philosophical scrutiny - perfect example of where PMI's warning is relevant.

  Word count is tight. I'll keep explanations punchy, using their examples to demonstrate rather than theorize. The tone should be "here's your toolkit" not "here's a philosophy lecture." Key move: present PMI not as a blanket skeptic's club but as a specific lens for claims that resemble past fallen theories (overreach, circularity, etc.).
answer: |-
  Here’s a streamlined decision procedure grounded in scientific realism debates, designed for deadline use. Steps 1–3 are **empirical checks**; 4–5 are **judgment calls** (dressed as procedure); Step 6 flags **philosophical handoff**.

  ### The Procedure
  1. **Is there robust independent replication?**  
     *Sufficient answer:* Multiple independent teams (not collaborators) confirm core findings using varied methods/data.  
     *Stop if:* Single study, failed replications, or replication only by original team → **LOW CONFIDENCE**  
     *PMI status:* Bites hard here. Unreplicated claims resemble past abandoned theories.

  2. **Is the methodology resilient to bias?**  
     *Sufficient answer:* Pre-registered protocols, blinded analysis, open data, error margins quantified.  
     *Stop if:* High risk of p-hacking, undisclosed flexibility, or unquantified uncertainties → **LOW CONFIDENCE**  
     *PMI status:* Critical. Past theories often relied on malleable methods.

  3. **Is consensus broad and scrutinized?**  
     *Sufficient answer:* Active debate within a diverse field, with critiques addressed (not ignored).  
     *Stop if:* "Consensus" is enforced by gatekeepers or dissent is suppressed → **LOW CONFIDENCE**  
     *PMI status:* Bites when dissent exists but is marginalized (like past paradigms).

  4. **Does evidence converge across methods/fields?**  
     *Sufficient answer:* Findings supported by multiple disciplines (e.g., genetics + fossils + modeling).  
     *Proceed cautiously if:* Reliant on one technique; *handoff if* techniques share assumptions PMI warns about.  
     *PMI status:* Overblown for robust convergence; bites for mono-method claims.

  5. **Is the claim insulated from direct testing?**  
     *Sufficient answer:* Clear criteria for falsification exist (even if challenging).  
     *Handoff to editors if:* Claims are "unfalsifiable" (e.g., untestable historical narratives) → **PHILOSOPHICAL JUDGMENT**  
     *PMI status:* Central issue. Past theories often became unfalsifiable dogma.

  6. **Editorial handoff verdict:**  
     *Output:* "High confidence" (strong empirical checks), "Medium confidence" (passes 1–3 but concerns in 4–5), or "Contextual framing" (e.g., "leading model, but philosophical limits apply").

  ---

  ### Case Applications
  **Case 1: Climate model predicting regional rainfall (10-year forecast)**  
  1. **Replication:** Multiple independent modeling groups (e.g., CMIP) simulate similar patterns? *Likely YES for broad trends, but regional specifics vary → Proceed.*  
  2. **Methodology:** Models pre-registered (e.g., CMIP protocols), open code, quantified uncertainty? *YES, but regional precision limits acknowledged → Proceed.*  
  3. **Consensus:** Broad agreement on warming-driven rainfall *shifts*, but regional specifics debated? *YES → Proceed.*  
  4. **Convergence:** Models cross-validated with paleoclimate data, physics, observations? *YES → High confidence in directional changes.*  
  5. **Testability:** Forecasts checked against decadal observations? *YES (retrospectively), though lagged → High confidence.*  
  **Verdict:** **High confidence** in *mechanism* (e.g., "warmer atmosphere intensifies regional dry/wet extremes"), **medium confidence** in precise regional decadal forecasts (not PMI’s prime target).

  **Case 2: Evolutionary psychology claim (Pleistocene cognitive adaptation)**  
  1. **Replication:** Bias studied cross-culturally with consistent results? *Often NO (WEIRD samples) → LOW CONFIDENCE trigger.**  
  2. **Methodology:** Pre-registered, controls for cultural transmission? *Rarely; often post-hoc storytelling → LOW CONFIDENCE.**  
  3. **Consensus:** Heated debate within evo-psych, critiques from adjacent fields (e.g., anthropology)? *YES → Proceed, but caution.*  
  4. **Convergence:** Supported by genetics, neuroscience, archaeology? *Seldom; circular reliance on adaptive assumptions → Judgment call: weak convergence.**  
  5. **Testability:** Can Pleistocene origins be falsified? *Often no; alternative histories untestable → **HANDOFF to editors** (philosophical limits).*  
  **Verdict:** **Low confidence** (fails Steps 1–2). Even if passed, Step 5 requires framing like: "Proposed as adaptation, but untestable past causes remain speculative."

  ---

  ### Key Philosophy/Practical Notes
  - **Where PMI bites:** Claims failing Steps 1–3 (unreplicated, biased methods, enforced consensus) *exactly* mimic abandoned theories (e.g., phlogiston).  
  - **Where PMI is overblown:** Robustly converging evidence (Step 4) or testable mechanisms (Step 5) mitigate PMI (e.g., climate physics vs. historic untestable claims).  
  - **Judgment calls:** Steps 4–5 assess *resemblance to PMI’s historical targets* – not absolute truth.  
  - **Editorial role:** Step 5 flags when realism itself is contested (e.g., adaptationist claims). Frame as "This explains data, but origins remain debated due to epistemic limits."  

  This procedure prioritizes empirical triage (Steps 1–3) before tackling deeper uncertainty, ensuring PMI informs but doesn’t paralyze reporting.
