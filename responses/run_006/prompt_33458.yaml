prompt: |-
  I'm a journalist covering science and tech, and I keep running into the same pattern in differnt guises and I'm wondering if philosophy or cognitive science has a name for it.

  Here's the pattern. You have some agent — could be an animal, a person following a proceedure, an AI system, a bureaucracy — doing something that looks smart, adaptive, flexible. It's responding to its environment in ways that seem intelligent. But then you change one small thing about the situation, something that any creature that actually understood what it was doing would handle fine, and the whole thing goes off the rails. It doesn't degrade gracefully; it just keeps executing the same subroutine as if nothing changed, even when the subroutine now produces nonsense. And the moment you see that, you realize the apparent intelligence was an illusion — it was just a fixed routine that happened to be well-matched to the normal environment, and the "flexibility" was really just the environment's regularity, not the agent's.

  The classic example I've heard is a wasp that drags its prey to the entrance of its burrow, goes inside to inspect, comes back out, and drags the prey in — but if you move the prey a few inches while the wasp is inside, the wasp comes out, drags the prey back to the entrance, and goes inside to inspect again, and you can do this indefinitely. The wasp never thinks "hey, I just inspected." It's locked into a fixed sequence.

  But I've been seeing the same shape in much more modern contexts. A customer service chatbot that handles 90% of queries beautifully but then when you ask it something that's one step outside its training distribution it loops through the same script pages forever. A corporate policy that works great until some edge case hits and then the organization does something absurd because the policy has no exception-handling. The way some arguments play out online, where someone has a canned response that works against the standard version of an objection but when you tweak the objection slightly they just repeat the canned response as if you'd said the standard thing.

  What I'm after is: does this pattern have an established name? I know "brittleness" is in the ballpark but that feels too broad — brittleness is just the property of breaking, not the specific thing where the breaking reveals the underlying rigidity. I've heard the word "sphexish" or "sphexishness" floating around, from the wasp example, but I don't know if that's a real term of art or just a clever coinage, and if it is a term, I don't know whether it covers all the cases I'm describing or only the animal-behavior case. Also, I want to know what the edges of this concept are. Is it the same thing when a human does it (out of habit, or because they're following a procedure mindlessly) versus when an insect does it (because it's literally wired that way) versus when an AI does it (because it's trained on a distribution)? Or are those differnt phenomena that just look similar? And is there a precise way to define the pattern so you can tell whether a given failure is an instance of this thing or just a regular mistake?

  I'm not just looking for a label — I want the concept carved at the joints. If there's an established term, tell me what it covers and what it doesn't, and whether my examples all fit under it. If there isn't, coin one and define it precisely enough that I can use it in my writing without being sloppy. Take a definite position rather than just surveying what people have said. And write in American English.

  One last thing: could you put the bottom line in a machine-readable form at the very end? Something like \answer{the term} or if there's no good term, \answer{no established term, proposed: your-term-here}.
reasoning: |-
  Okay, the user is a science and tech journalist who keeps encountering a specific pattern where systems or agents appear intelligent until a small change causes them to fail rigidly. They want to know if there's a philosophical or cognitive science term for this. 

  First, I recall the classic wasp example they mentioned—the Sphex wasp behavior. That's often called "sphexish" or "sphexishness." But is that a recognized term? I think it originates from Douglas Hofstadter, but I'm not sure if it's widely adopted in academia. The user is skeptical about whether "sphexish" applies beyond animal behavior to things like AI or bureaucracies.

  Looking at their examples: customer service chatbots looping, corporate policies failing at edge cases, and people repeating canned arguments. These all share a core pattern: agents display apparent flexibility that's actually dependent on environmental regularity. When the environment changes slightly, they don't adapt—they rigidly follow the same routine, revealing the illusion of understanding.

  The user mentioned "brittleness," but they feel it's too broad. They want a term that specifically captures this rigidity-exposed-by-minor-change dynamic. They also want to know if the concept applies uniformly across animals, humans, AIs, and systems, or if these are distinct phenomena.

  In cognitive science, this relates to concepts like "fixed action patterns" in ethology, "brittle AI" in machine learning, and "procedural rigidity" in organizational behavior. But is there a unified term? "Goodhart's law" (when a measure becomes a target, it ceases to be a good measure) is relevant but not a perfect fit. "Overfitting" in AI describes poor generalization, but it's technical. "Illusion of explanatory depth" is about self-assessment, not system behavior.

  "Sphexishness" might be the closest existing term, especially since Hofstadter explicitly used it to describe humans and systems. However, its academic usage is limited. For a journalist, using a term that's recognizable but not overly technical could be effective. Alternatively, coining a new term like "contextual rigidity" or "procedural fixedness" might be clearer.

  The key elements are: 
  - Apparent intelligence in normal conditions
  - Failure due to minor, meaningful environmental changes
  - Rigid continuation of routine despite changed context
  - Revelation of lack of genuine understanding

  The user wants the concept "carved at the joints." They need a precise definition to apply consistently. They also requested a machine-readable answer at the end.

  Considering all this, "sphexishness" is the best existing candidate, especially as Hofstadter intended it broadly. But it needs disclaimers about its niche usage. For clarity in their writing, defining it upfront when used would help. The pattern is fundamentally the same across domains—it's about the lack of adaptive capacity revealing mechanistic processing.

  Bottom line: \answer{sphexishness} with the caveat that it requires explanation. Alternatively, proposing a new term like "contextual rigidity" might serve better for broader audiences.
answer: |-
  Based on your description and the core pattern you're identifying, the most precise established term is **sphexishness**. However, it requires careful framing because its academic usage is niche. Here's the definitive breakdown:

  ### The Term: Sphexishness
  1.  **Origin & Definition:** Coined by philosopher Douglas Hofstadter (in *Gödel, Escher, Bach* and *Metamagical Themas*) based on the *Sphex* wasp behavior you described. It specifically denotes:
      *   The **illusion of intelligence, agency, or understanding** arising from a rigid procedure perfectly matched to a stable environment.
      *   The **catastrophic, rigid failure** when a minor, semantically meaningful environmental change occurs – precisely because the agent lacks genuine understanding or flexible goal representation.
      *   The **revelatory nature** of the failure: it exposes the underlying mechanistic, rule-bound nature of the behavior.

  2.  **Coverage of Your Examples:**
      *   **Wasp:** The original archetype. Fits perfectly.
      *   **Chatbot:** Fits perfectly. The loop reveals its lack of semantic grounding/understanding; it's executing token sequences based on surface patterns.
      *   **Corporate Policy/Bureaucracy:** Fits perfectly. The "procedure" (policy/rules) works until a minor, contextually obvious deviation occurs, revealing the lack of higher-level goal comprehension ("Why does this policy exist?").
      *   **Canned Arguments:** Fits perfectly. The responder is locked into a stimulus-response pattern triggered by keywords/surface structure, unable to adapt to genuine semantic variation. The failure reveals they aren't truly engaging with the *meaning*.

  3.  **Edges & Distinctions:**
      *   **Shared Core Phenomenon:** The *core mechanism* is the same across insects, procedural humans, bureaucracies, and narrow AI: **fixed pattern matching without flexible goal-oriented reasoning or environmental model updating.** The failure mode (rigid continuation) is diagnostic.
      *   **Implementation Differences:** The *cause* of the rigidity differs:
          *   **Insects:** Hardwired fixed action patterns (FAPs) in neural circuitry (ethology).
          *   **Procedural Humans/Bureaucracies:** Habit, cognitive load, poor training, risk aversion, institutional inertia, or designed proceduralism overriding judgment.
          *   **Current AI:** Statistical pattern matching based on training data distribution (lack of world model, causal reasoning, true understanding). Overfitting is a *technical cause*, sphexishness is the *observable behavioral failure* revealing it.
      *   **Not Sphexishness:**
          *   **Simple Mistakes:** Errors made while demonstrably trying to adapt or understand (e.g., a human fumbling a new task, an AI hallucinating plausibly but incorrectly). Requires *evidence of attempted flexibility*.
          *   **Gradual Degradation:** Performance slowly worsening as conditions change (e.g., image classifier accuracy dropping with increasing noise). Sphexishness involves a *discrete, catastrophic switch* to nonsense behavior triggered by a minor but *meaningful* change.
          *   **Pure Physical Brittleness:** A glass shattering when dropped. No illusion of intelligence is shattered; there was no behavioral intelligence to begin with.
          *   **Goodhart's Law / Metric Gaming:** Optimizing a proxy so hard it breaks the real goal (e.g., teachers teaching to the test). Related, but distinct: Sphexishness is about *behavioral rigidity revealing lack of understanding*; Goodhart's is about *perverse incentives corrupting a goal*.
          *   **Overfitting (Alone):** A technical description of poor generalization in ML. Sphexishness is the *observable behavioral manifestation* of overfitting (or similar rigidity) in an agent *appearing* intelligent.

  ### Why "Sphexishness" is the Best Fit (Despite Limited Academia)
  *   **Specificity:** It directly names the *pattern* you describe, rooted in the canonical example. "Brittleness" is too broad; "lack of generalization" is descriptive but not evocative; "overfitting" is technical and ML-centric; "procedural rigidity" lacks the revelatory aspect.
  *   **Intentional Breadth:** Hofstadter explicitly coined it to apply beyond insects to humans, AI, and systems. He uses it for bureaucracies, grammar pedantry, and rigid thinking.
  *   **Diagnostic Power:** It captures the *duping* aspect (it looked smart!) and the *ah-ha!* moment when minor change triggers rigid, nonsensical persistence.

  ### Precise Definition for Your Use
  > **Sphexishness** (n.): The property of an agent (biological, human, artificial, or organizational) exhibiting behavior that appears intelligent, adaptive, or purposeful within a specific, stable context, but which is revealed to be a rigid, mechanistic procedure lacking genuine understanding or flexible goal pursuit when a minor, semantically significant change to the environment occurs. The resulting failure is characterized by the agent persisting inflexibly with the original procedure despite its now-obvious inappropriateness or absurdity, thereby demonstrating that the prior apparent intelligence was an illusion contingent on environmental predictability.

  ### Recommendation
  *   **Use "sphexishness"** in your writing. It's the term that most precisely carves the joint you're identifying.
  *   **Briefly define it** using the wasp example and/or the core concept ("the illusion of intelligence shattered by rigid failure upon minor change") upon first use. Explicitly state Hofstadter's intent for its broad application.
  *   **Acknowledge its niche status:** "While not a universal term of art in all relevant fields, philosophers and cognitive scientists (notably Douglas Hofstadter) use 'sphexishness' to describe this specific failure mode revealing mechanistic rigidity beneath apparent intelligence."

  ### Bottom Line
  \answer{sphexishness}
