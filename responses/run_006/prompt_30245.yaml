prompt: |-
  I'm the treasurer of my high school Key Club, and we have $2,000 from the fall fundraiser. Next week I have to send around a short written recommendation to the club about which of three proposals we should pick. The options are: (1) give it all to a charity that buys malaria bed nets, which our advisor loves because the cost-per-life-saved is well estimated and every other option is basically vibes; (2) put it into the tutoring program our club runs for the middle school, which people can tell is helping but we have no way to measure; (3) spend it on sending next year's officers to a leadership conference, on the theory that a better-run club will raise way more money later, so delaying the donation means we eventually give more. I need an actual bottom line and a time frame, and I have to treat the strongest argument for the options I'm not picking seriously instead of just knocking them down. The thing I keep coming back to is whether we're rigging the decision in favor of the bed nets, because its the only option where the effects are countable in the first place. Can you draft the memo I'll send to the club?
reasoning: |-
  Okay, the user is the treasurer of a high school Key Club with $2,000 to allocate. They need to draft a memo recommending one of three options: donating to a malaria bed net charity, funding their middle school tutoring program, or investing in a leadership conference for next year's officers. 

  The user's core tension is whether the measurable impact of bed nets unfairly dominates the decision. They're clearly thoughtful—acknowledging the advisor's data-driven preference while wrestling with intangible benefits of other options. The memo must treat all arguments fairly while landing on a practical recommendation.

  Hmm... the malaria nets have strong evidence (cost-per-life-saved), tutoring builds local relationships but lacks metrics, and the conference is speculative—it bets on future fundraising without guarantees. The user’s worry about "rigging" is valid: quantification bias is real, but it’s not the only factor here.

  Breaking it down:  
  - **Bed nets** win on immediacy and proven scale, but feel distant from the club’s hands-on work.  
  - **Tutoring** is locally impactful yet unmeasured; its value is in trust and visibility.  
  - **Leadership** could multiply funds, but $2,000 is a big gamble for high schoolers who might not even be officers next year.  

  The user needs a "bottom line" with a timeframe. For nets: lives saved now. For tutoring: help now with possible lasting local ties. For leadership: maybe help years later? The conference’s payoff is least certain—it’s the weakest option unless the club has a track record of scaling funds post-training.  

  I’ll structure the memo to:  
  1. Acknowledge all three sincerely (no strawmen).  
  2. Highlight nets’ strength without dismissing others’ merits.  
  3. Address the "rigging" concern head-on: yes, measurability matters, but it’s not the only reason—it’s also about guaranteed impact per dollar.  
  4. Recommend nets as the best use *now*, but suggest revisiting fundraising strategies later to address other goals.  

  Final note: Emphasize Key Club’s mission ("serving children") to justify prioritizing nets over leadership. And add a practical footnote—realistically, conference costs might exceed $2,000 anyway.
answer: |-
  **MEMORANDUM**  
  **TO:** Key Club Members  
  **FROM:** [Your Name], Treasurer  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Allocation of $2,000 Fundraiser Proceeds  

  ---

  ### **Background**  
  We have $2,000 to allocate from our fall fundraiser. After reviewing three compelling proposals, I’ve evaluated each against our mission: **service, leadership, and impact**. Below is a balanced analysis, followed by my recommendation. All three options align with Key Club values—this decision hinges on *how* we maximize our resources today.  

  ---

  ### **Option 1: Donate to Malaria Bed Nets Charity**  
  **Strengths:**  
  - **Highest measurable impact per dollar:** Evidence shows bed nets prevent malaria at ~$3,000–$5,000 per life saved. Our $2,000 could directly protect 500+ people and save 0.4–0.6 lives.  
  - **Immediate, irreversible good:** Addresses a urgent, solvable crisis.  
  - **Transparency:** Outcomes are trackable and globally validated.  

  **Considerations:**  
  - **Local disconnect:** Impact occurs overseas, not in our community.  

  ---

  ### **Option 2: Fund Our Middle School Tutoring Program**  
  **Strengths:**  
  - **Direct community impact:** Reinforces our local presence and builds relationships with students we mentor.  
  - **Tangible engagement:** Tutors see progress firsthand (e.g., confidence gains, grade improvements), even without formal metrics.  
  - **Sustains Key Club’s legacy:** Invests in a program we own and operate.  

  **Considerations:**  
  - **Unquantified outcomes:** Without data, we can’t compare its efficiency to other options.  
  - **Scalability:** $2,000 may not transform the program long-term.  

  ---

  ### **Option 3: Invest in Leadership Conference for Officers**  
  **Strengths:**  
  - **Potential for exponential impact:** Training could improve club efficiency, leading to larger fundraisers. A 20% increase in future fundraising could generate an extra $400+/year indefinitely.  
  - **Skill development:** Equips leaders to serve more effectively.  

  **Considerations:**  
  - **Delayed and uncertain returns:** Benefits rely on next year’s officers applying skills successfully.  
  - **Opportunity cost:** $2,000 spent now = $2,000 not serving immediate needs.  
  - **Risk:** No guarantee of increased fundraising.  

  ---

  ### **Key Tensions & Fairness**  
  I acknowledge concerns about "rigging" the decision in favor of bed nets simply because they’re measurable. Measurability *is* an advantage, but it’s not the only factor. The tutoring program’s local value is real, even if unquantified, and leadership development could yield future dividends. However:  
  - **Impactability** matters: Bed nets leverage our funds where they’re scarcest (low-income countries).  
  - **Timeframe** matters: Bed nets and tutoring help people *now*; leadership gains may take years to materialize.  
  - **Risk** matters: The conference is a bet on unpredictable human capital.  

  ---

  ### **Recommendation: Donate to Malaria Bed Nets**  
  **Bottom Line:** Allocate the full $2,000 to the bed nets charity.  
  **Time Frame:** Immediate transfer (1–2 weeks).  

  **Why?**  
  1. **Scale of Impact:** Evidence shows this saves/improves the most lives per dollar—a rare chance to create irreversible good.  
  2. **Alignment with Urgency:** Malaria kills a child every 2 minutes. Our $2,000 has concrete power here.  
  3. **Fits Key Club’s Scope:** "Serving children" (our pledge) includes global children.  

  **Addressing Alternatives Fairly:**  
  - **Tutoring:** We’ll seek low-cost ways to strengthen this program (e.g., volunteer drives, material donations).  
  - **Leadership:** We’ll pursue free/local training opportunities and prioritize officer development in next year’s budget.  

  ---

  ### **Next Steps**  
  - **Vote:** I’ll send a poll to finalize the decision by [Date].  
  - **Future Planning:** We’ll discuss measuring tutoring outcomes and budgeting for leadership development at our next meeting.  

  This recommendation prioritizes **immediate, high-certainty impact** without dismissing other worthy goals. Thank you for your service and thoughtful consideration.  

  —[Your Name]  
  Treasurer, Key Club
