  The user's step (5) generalization is where things get really problematic. If we accept this view, it would revolutionize legal doctrines of duress. But perhaps the flaw is in assuming coercion is solely about alternative possibilities. Traditional coercion theory has two components: the removal of alternatives AND the illegitimate pressure itself. Frankfurt cases only speak to the first component. 

  I should also consider whether the user is underestimating how radical their conclusion (6) actually is. It's not just counterintuitive - it would dismantle entire frameworks of criminal defense. That suggests something must be wrong with the parallel reasoning. 

