  Hmm, the user's own suggested asymmetry - that threats are communicative while Frankfurt interveners aren't - is promising but they're right to worry it might not bear the normative weight. After all, in both scenarios the actual causal history is identical: Smith acts solely on his pre-existing desire to divest. 

