          So the maximum is 62.

     So the optimal is A=4, I=6, H=8, E=2 -> well-being=62.

     But note: we found a better one than the one we thought at first.

     Now, the groups might not find this, but they can get close.

     Debrief points:

     - Map the activity to Dewey:
          Problematic situation: the resource allocation problem with partial information and interdependencies.
          Hypothesis: e.g., "If we increase Environment funding, we can reduce pollution and that will improve well-being." 
          Experimental testing: trying an allocation and getting a well-being score.
          Consequences: the score tells them how they did, and they revise.
          Free communication: they had to share their private information to understand the whole system.
          Diversity of standpoint: each sector had different information and interests.

     - What went wrong? Predictably:
          - Some groups might not share all information (e.g., a sector might hold back about their pollution because it's negative).
          - Some groups might vote without testing, or defer to a dominant person who pushes for a particular allocation without inquiry.
          - They might not test enough, or they might test randomly without forming hypotheses.
          - They might not notice the diminishing returns or the interactions.

     - How did the successful groups do it?
          - They shared information fully.
          - They formed hypotheses about how the system works and tested them.
          - They revised after each test.

     - What the activity can't capture:
          - Real social problems don't have a known optimal solution (the facilitator knows the model, but in reality, we don't).
          - In real life, the feedback is not immediate and clear (like a score) but messy and delayed.
          - The model is simplified: real-world problems are more complex and open-ended.

     - During the debrief, ask:
          - "What was the problematic situation? How did you define it?"
          - "What hypotheses did you form? How did you test them?"
          - "How did you revise your approach based on the results?"
          - "What role did communication play? Did everyone's information get heard?"
          - "How is this different from just voting on an allocation without testing?"

     - Highlight: 
          - Voting without inquiry would be like each person voting for their own desired allocation without understanding the system -> likely to be suboptimal.
          - The experimental method requires iteration and learning.

     Materials to prepare:
          - Handouts for each sector (Agriculture, Industry, Household, Environment) with their private information.
          - A public information sheet (or write on board).
          - Calculator or spreadsheet for the facilitator to compute well-being quickly.

     Time breakdown:
          - Setup: 5 min (explain the activity, form groups, hand out materials)
          - Group work: 35 minutes (5 min sector prep, 25 min group discussion and testing, 5 min final allocation)
          - Debrief: 25 minutes (5 min for group reports, 10 min for Dewey mapping, 10 min for discussion of what went wrong and what it teaches about democracy)

