  Activity Concept: "The Resource Allocation Challenge"

  Problematic Situation: The group represents a community that must decide how to allocate limited resources (e.g., water, funding, energy) among several competing needs (e.g., agriculture, industry, households) to maximize community well-being. The catch: each student has partial information about the needs and the effectiveness of resource allocation in their sector, and the situation is complex enough that no individual can solve it alone.

  Structure:
