          - Activity: 40 min (5 min sector prep, 30 min group work: 20 min for testing and 10 min for final, but in practice, we can be flexible)
          - Debrief: 35 min

     That's 80.

     But note: the testing might take time: each group might come up multiple times. The facilitator must be quick.

