  Looking at "Economic Possibilities": Dave is right about Keynes' disdain for money-love as pathology, and the explicit praise for art/life cultivation. But the user has a point about Keynes' tone—he describes capitalists with reluctant admiration ("they carry us") and frets about wealthy idlers failing at leisure. That "adjustment problem" section is crucial; Keynes doesn't dismiss it as mere transition pains but calls it "the permanent problem of the human race." 

  Now "My Early Beliefs": Dave tries to quarantine this as only about transition psychology, but Keynes' language cuts deeper. He calls the early Bloomsbury neglect of "the necessity of action" a "false religion"—strong words. When he says humans need "purposiveness" and "ordinary virtues," it sounds like a philosophical correction, not just tactical realism. 

