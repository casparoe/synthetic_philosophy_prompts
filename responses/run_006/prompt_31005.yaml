answer: |-
  As a metaethicist, I appreciate your perceptive engagement with this enduring puzzle. Your hypothesis touches a nerve in the debate. Let's dissect the impasse systematically.

  **Candidate Diagnoses & Their Costs:**

  1.  **Substantive Disagreement in Moral Psychology:**
      *   **Core Idea:** Expressivists (e.g., Ayer, Blackburn, Gibbard) genuinely hold that core moral judgments are constituted by conative states (disapproval, plans, commitments), fundamentally distinct from belief-states representing the world. Critics (e.g., Geach, Searle, later Schroeder) genuinely hold that the inferential integration *requires* cognitive, belief-like states playing the semantic role.
      *   **Costs:** This risks stalemate. Expressivists develop complex psychologies (e.g., Blackburn's "attitudes towards attitudes," Gibbard's "plan-laden states") to mimic logic, which critics find ad hoc or insufficiently belief-like. Critics insist moral judgments *must* be beliefs to explain embedding, which expressivists see as begging the question against their non-cognitivist starting point.

  2.  **Metatheoretical Divergence (Your Hypothesis):**
      *   **Core Idea:** The camps prioritize fundamentally different projects within "semantics." Expressivists (especially Blackburn, Gibbard, Chrisman) aim for a *functional* or *pragmatic* explanation: what mental states/acts does moral language conventionally express, and how does this explain its inferential role *for the agent*? Critics (e.g., Unwin, Dreier, Schroeder) demand a *representational* explanation: assigning truth-conditional content to explain validity as objective truth-preservation across contexts, independent of speaker attitudes.
      *   **Costs:** Each side judges the other's solutions by the wrong metric. Critics say expressivist accounts (e.g., Blackburn's projectivism explaining modus ponens via higher-order disapproval) fail as *truth-conditional* semantics. Expressivists retort that truth-conditional semantics mischaracterizes the *function* of moral discourse and that their accounts *do* explain inferential discipline *as practical consistency*. Progress seems impossible without agreement on the semantic project's primary goal.

  3.  **Verbal Dispute about "Belief," "Truth," or "Content":**
      *   **Core Idea:** The disagreement hinges on how broadly or narrowly key terms are defined. Expressivists (e.g., using deflationary truth, or Gibbard's "content" for plan-laden states) stretch "belief," "truth," or "propositional content" to cover conative states exhibiting inferential discipline. Critics (e.g., insisting on representational or "robust" truth-conditions) use stricter definitions requiring mind-to-world direction of fit. Hybrid expressivists (e.g., Ridge, Copp) explicitly introduce descriptive "belief-like" components alongside expressive ones.
      *   **Costs:** This diagnosis can feel like a dismissive cop-out. While terminological flexibility exists (e.g., minimalism about truth/propositions), the underlying disagreement about the *nature* of the mental state expressed seems persistent. Critics argue that even "quasi-realist" expressivists who embrace "truth" minimally defined haven't genuinely explained *why* the logic works without smuggling in robust content.

  4.  **Ill-Posed Question (Presupposing Cognitivism):**
      *   **Core Idea:** The Frege-Geach problem *assumes* that successful embedding *requires* truth-conditional content. If expressivism is correct, the problem itself is a category mistake – it demands that expressivism solve a problem only arising within a representational framework it rejects. The "failure" is an artifact of the question.
      *   **Costs:** This seems fatalistic and unhelpful. It ignores that expressivists themselves *accept* the challenge and try to meet it (e.g., explaining modus ponens without truth-conditions). It also dismisses the strong intuition that the validity of moral arguments *does* seem robustly logical, not merely a matter of practical consistency.

  **My Considered Diagnosis:**

  **The primary impasse stems from a Metatheoretical Divergence, deeply intertwined with a Substantive Disagreement in Moral Psychology, often exacerbated by terminological slippage.**

  *   **Support from the Debate:**
      *   **Expressivists:** Focus on *what speakers do*. Blackburn frames moral discourse as "projecting" attitudes onto the world. Gibbard analyzes it as "planning what to do." Their solutions (commitments, higher-order attitudes, plans) explicitly aim to explain inferential discipline *as a requirement of practical rationality or consistency in one's conative states*. For Gibbard, accepting "If lying is wrong, then getting your brother to lie is wrong" while accepting "Lying is wrong" *constitutes a plan* to disapprove of getting your brother to lie. Validity is about avoiding *inconsistency in one's planning state*. They argue this *is* a sufficient explanation of the logic, rejecting the need for truth-conditions beyond minimal deflationism. They see the critics' demand as imposing an alien standard.
      *   **Critics:** Focus on *what sentences represent*. They argue (e.g., Schroeder in *Being For*) that expressivist accounts fail *as compositional semantics*. They demand an explanation of why the sentence "Lying is wrong" *contributes the same semantic content* in asserted and embedded contexts, and how this content *combines* with logical operators to yield valid inferences *defined by truth-preservation*. They see expressivist accounts as changing the subject (to psychology) or providing only a partial explanation that fails to capture the objective, context-independent nature of validity. For them, Gibbard's planning states don't explain why the *sentence* "If lying is wrong..." has the *meaning* it does, independent of the speaker's current plan.

  *   **Intertwined Psychology:** The metatheoretical divergence reflects the substantive psychological claim. Expressivists *must* insist that a sufficiently complex conative state *can* underpin logical discipline without being a belief. Critics *must* insist that only a representational state *can* play the required semantic role in composition and truth-preservation. This core psychological/semantic commitment fuels the differing metatheoretical goals.

  *   **Terminological Issues:** The debate is muddied by disputes over "minimal" vs. "robust" truth/propositions/belief. Expressivists adopt minimalism to say "moral sentences are true/beliefs," satisfying some surface criteria. Critics argue this is semantic trickery that doesn't address the underlying compositional and psychological demands.

  **What Counts as Progress?**

  Given this diagnosis, progress is unlikely to be a single "solution" satisfying both camps. Meaningful progress would involve:

  1.  **Clarifying the Projects:** Explicitly distinguishing (and justifying) the *functional/pragmatic* project (explaining use and inferential discipline for agents) from the *representational/truth-conditional* project (explaining composition and objective validity). Acknowledging they are distinct, potentially complementary, but not reducible to each other.
  2.  **Advancing Formal Frameworks:** Developing more sophisticated formal semantics for expressivist ideas (e.g., further work inspired by Gibbard's planning semantics, or dynamic semantic approaches) that can handle composition and inference transparently, even if they don't appeal to truth-conditions. Demonstrating their internal coherence and explanatory power *for the functional project*.
  3.  **Refining Moral Psychology:** Providing deeper empirical or conceptual arguments about whether the mental states underlying moral judgment *can* exhibit the requisite logical structure without being representational beliefs. Or, conversely, demonstrating why they *must* be beliefs.
  4.  **Hybrid or Alternative Routes:** Exploring whether sophisticated hybrid theories (e.g., Ridge's "Ecumenical Expressivism") or wholly different frameworks (e.g., inferential role semantics not tied to expressivism) can bridge the gap by incorporating elements satisfying both functional and representational intuitions.
  5.  **Accepting Pluralism or Stalemate:** The honest conclusion might be that the two projects are legitimate but distinct, and expressivism succeeds on its own functional terms while failing the representationalist's test – and that this may be an acceptable outcome. Alternatively, conceding that within a dominant truth-conditional paradigm, expressivism faces an unresolved challenge.

  **Diagnosis:** The Frege-Geach impasse fundamentally arises from a metatheoretical divergence over the primary aim of semantic theory (functional explanation vs. truth-conditional representation), deeply entangled with a substantive disagreement about moral psychology and exacerbated by terminological disputes, leading each side to evaluate the other by incompatible standards.
