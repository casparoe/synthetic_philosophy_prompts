  The diagnosis needs to address multiple layers: First, the clash over "adaptation" is partly semantic (does it require genetic selection only?). Second, it's about units of selection—can groups be units, or only genes? Third, evidentiary standards diverge; adaptationists might accept indirect proxies (e.g., universality), while byproduct theorists demand stronger proof of fitness causality. 

  Progress would require tools to bypass these stalemates. Formal models could simulate how cognitive byproducts + cultural selection interact. New data—like epigenetic or ancient DNA studies—might reveal if religious practices altered survival. But crucially, conceptual clarity is key: defining "adaptation" to include/exclude cultural evolution, and specifying testable thresholds for "group benefits." 

  The user might also need frameworks to compare theories neutrally. For example, does religion show "design specificity" (e.g., only solves cooperation) or is it a "spandrel" repurposed from agency detection? That reframes the debate beyond circular arguing. 

  ... *pauses* ... The real itch here is likely meta-scientific: How do we resolve disputes when direct evidence is lost to time? The answer isn't just "more data"—it's sharper theory-building that forces predictions even from byproduct accounts. 

