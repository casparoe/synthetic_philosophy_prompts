answer: |-
  The core disagreement is primarily a **difference about levels and units of selection**, compounded by **divergent standards of evidence** and **semantic ambiguity around "adaptation."**  

  ### Reasoning:  
  1. **Levels/Units of Selection**:  
     - Adaptationists implicitly (or explicitly) argue for **cultural group selection** as a valid evolutionary mechanism. They claim religion is an adaptation *because* it enhanced group-level cooperation, survival, or reproduction—even if via cultural evolution.  
     - Byproduct theorists typically reject group selection, insisting adaptations must arise from **genetic selection at the individual level**. They view religion as a non-adaptive spandrel of cognitive traits (e.g., agency detection evolved for predator avoidance, not religion).  

  2. **Standards of Evidence**:  
     - Adaptationists accept **indirect evidence** (e.g., universality, prosocial effects) as sufficient to infer past selection.  
     - Byproduct theorists demand **direct evidence of ancestral fitness benefits** or domain-specific design—neither of which exists for religion—making adaptation claims "unfalsifiable."  

  3. **Semantic Dispute**:  
     - The term "adaptation" is equivocated. Adaptationists use it broadly (e.g., "cultural adaptation"); byproduct theorists use it narrowly (genetically selected traits with functional design). This masks substantive agreement on proximate mechanisms.  

  ### Path to Progress:  
  - **Formal Models**: Develop computational simulations of cultural group selection vs. byproduct accumulation to test whether observed religious features *require* group selection or emerge as byproducts.  
  - **Conceptual Distinction**: Explicitly separate:  
    - *Adaptation* (genetically selected trait)  
    - *Exaptation* (byproduct co-opted later)  
    - *Cultural adaptation* (selected via cultural evolution, regardless of genetic fitness).  
    This clarifies whether the debate is about mechanisms or definitions.  
  - **New Data**:  
    - **Historical/Archaeological**: Correlate religious practices with group survival (e.g., drought resilience) in ancient societies.  
    - **Cognitive Experiments**: Test if religious concepts *solve cooperation problems* better than secular alternatives (e.g., do MCI gods enhance trust more than abstract laws?).  
    - **Gene-Culture Coevolution**: Identify genetic markers linked to religious cognition (e.g., theory of mind genes) and assess if they show selection signatures.  

  Progress hinges on agreeing that "adaptation" can operate at multiple levels and that cultural group selection—if empirically demonstrable—is a legitimate evolutionary process. Without this, the debate reduces to circular definitions.
