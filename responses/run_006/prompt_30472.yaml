  The disagreements table needs razor-sharp formulations. For existence questions, presentists will insist only present exists while eternalists see all times equally real. For truthmakers, presentists need tensed facts while eternalists point to timeless relations. On temporal passage, presentists demand objective flow versus eternalists' indexical accounts. I'm making sure neither position sounds strawmanned by using their actual terminology.

  Now the cruxes - these are the make-or-break points. The truthmaker debate centers on whether "Caesar crossed the Rubicon" requires a present tensed fact or just a past event. The cross-temporal relations case examines whether my admiring Socrates needs both to exist or just a current psychological state. For temporal passage, we consider the "moving spotlight" thought experiment. Relativity gets a special section about foliation versus eternalist accommodation. Each test case includes both sides' predictions to lock them into falsifiable positions.

  Finally, the verbal concessions: both might agree "real" can be equivocal, and temporal parts language might be conventional. But ontological commitments remain non-negotiable. I'm adding workshop instructions to force engagement - no filibustering allowed!

  The tone stays rigorously neutral throughout. No sly favoring of either view, just creating the arena for their showdown. This document should either produce philosophical progress or reveal irreconcilable worldviews - either outcome valuable for the workshop.
answer: |-
  ## Joint Statement: Points of Convergence and Clarified Disagreements in the Metaphysics of Time

  **Authors:** [Dr. Persephone Presentist] & [Dr. Everett Eternalist]
  **Date:** October 26, 2023
  **Purpose:** To establish a foundation for constructive dialogue at the Workshop on the Metaphysics of Time by clarifying agreed-upon data and conceptual ground rules, precisely stating core disagreements, identifying genuine cruxes, and distinguishing substantive from potentially terminological disputes.

  ### Section 1: Agreed Foundations and Ground Rules

  We, the undersigned, agree on the following fundamental points concerning the phenomena any adequate metaphysics of time must address and the constraints on interpretation:

  1.  **The Phenomenology of Temporal Experience:** Humans experience the world as containing a unique, constantly changing present moment ("now"). We experience events as *presently occurring*, others as *just past* or *immediately future*, and yet others as *distantly past/future*. This "A-series" perspective (characterizing events by tense: past, present, future) is an undeniable feature of our conscious lives.
  2.  **The Data of Tense in Language:** Natural languages ubiquitously employ tense (past, present, future) and temporal indexicals ("now," "yesterday," "tomorrow," "then"). This linguistic structure reflects our phenomenological perspective and our need to locate events relative to the time of utterance. This linguistic data *must be accounted for* by any metaphysical theory of time; however, **its existence does not, by itself, entail any specific metaphysical ontology (e.g., presentism or eternalism).** Competent speakers use tense correctly without committing to a specific metaphysics.
  3.  **The Logical Grammar of 'Now':** The word 'now' functions as an *essential indexical*. Its reference depends entirely on the context of its utterance. To say "Event E is happening now" is logically equivalent to asserting "Event E is simultaneous with *this* utterance." **This indexical nature does not, by itself, imply that the present moment possesses any unique metaphysical status (e.g., being the only "real" time) or that it "moves."** Indexicality is a feature of language and thought, not necessarily of reality itself.
  4.  **Special Relativity (SR) - What It Shows:** SR definitively establishes that simultaneity is not absolute but is *frame-dependent*. Whether two spatially separated events occur "at the same time" depends on the inertial reference frame of the observer. **SR therefore rules out any notion of a *unique, universal, frame-independent "now"* slicing across all of space at a single instant.**
  5.  **Special Relativity - What It Does *Not* Show (Alone):** While SR constructures the geometry of spacetime profoundly, **it does not, by itself, uniquely determine the correct *ontology* of time (e.g., presentism vs. eternalism)**. Both theories can attempt to formulate interpretations compatible with the relativistic spacetime structure, though the challenges differ significantly. SR renders certain *versions* of presentism (especially those requiring a universal present) untenable, but does not automatically entail eternalism.
  6.  **Unhelpful Slogans:**
      *   **Presentism:** We reject the slogan "Only the present is real" *if* "real" is equivocally used to deny the *truth* of statements about the past/future or the *existence* of past/future entities simpliciter. Presentism offers a specific account of *how* such truths obtain or entities are grounded.
      *   **Eternalism:** We reject the slogan "Time is like space" *if* it implies the complete elimination of all dynamic or perspectival features of time. Eternalism acknowledges the unique causal structure (light cones) and experienced perspectival nature of time within the block universe.
      *   **Both:** We reject characterizations of the other view as "obviously false," "incoherent," or "denying the reality of time/change/experience."

  ### Section 2: Core Disagreements - Positions Stated at Full Strength

  | # | The Question                                                                                                                               | Presentist Position (Strong Formulation)                                                                                                                                                                                                 | Eternalist Position (Strong Formulation)                                                                                                                                                                                                 |
  | :-- | :----------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **What exists? (Fundamental Ontological Commitment)**                                                                                     | **Only presently existing entities (objects, events, properties, relations) fundamentally exist.** Past and future entities do not exist *simpliciter*. Talk about them must be grounded in the intrinsic properties of, or presently existing facts about, the current state of reality. | **All entities (objects, events, properties, relations) located at any temporal coordinate in the four-dimensional spacetime manifold fundamentally exist.** Existence is temporally unrestricted; past, present, and future entities are equally real parts of the universe's ontology. |
  | **2** | **Truthmakers for Past- and Future-Tensed Statements:**                                                                                    | **Truths about the past or future require *presently existing*, intrinsically *tensed truthmakers*.** These are facts or properties of the *present* world that ground the truth of claims about non-present times (e.g., the current state of the world containing traces, memories, laws, or primitive tensed facts like *its having been the case that P*). | **Truths about the past or future are made true by the existence of the relevant *tenselessly existing* entities and events located at the appropriate temporal coordinates within the spacetime manifold.** The truthmaker for "Caesar crossed the Rubicon" is the event <Caesar-crossing-Rubicon> located at t=49BC. |
  | **3** | **The Nature of Temporal Passage / The "Moving Now":**                                                                                     | **Temporal passage is a fundamental, objective, mind-independent feature of reality.** The "now" or present moment *objectively moves* or *becomes* along the series of times. This dynamic change is irreducible and constitutes genuine temporal becoming. | **Temporal passage is not an objective feature of the external world but is perspectival and indexical.** It arises solely from the conscious perspective of observers located at different points within the static four-dimensional spacetime manifold. There is no literal "movement" of a "now" through time. |
  | **4** | **Cross-Temporal Relations (e.g., Admiring Socrates):**                                                                                    | **Cross-temporal relations (where relata exist at different times) are reducible to, or analyzable in terms of, *presently existing*, *tensed monadic properties* of the later relatum.** "I admire Socrates" is made true by my *current*, intrinsic psychological state of admiration directed towards Socrates, where "Socrates" refers via a descriptive or causal chain grounded in present traces/historical facts. | **Cross-temporal relations are irreducible, genuine relations holding between entities located at different temporal coordinates within the spacetime manifold.** "I admire Socrates" is made true by a relation holding *tenselessly* between the entity <Me-at-t1> and the entity <Socrates-at-t2>, both existing parts of spacetime. |
  | **5** | **Accommodating Special Relativity:**                                                                                                      | **Special Relativity necessitates a dynamic view where the ontology is limited to events within the *past light cone* of the current point-event (or a similarly constrained "thick" present).** Simultaneity is frame-relative, but becoming is a local, physical process constrained by causality. The fundamental present is not global but tied to the perspective of a worldline or point-event. | **Special Relativity is most naturally accommodated by eternalism and the block universe view.** The frame-relativity of simultaneity shows there is no privileged present foliation; the complete, unchanging four-dimensional manifold provides the only ontology consistent with the relativity of simultaneity. Presentist attempts to salvage a "local" becoming remain ontologically extravagant and metaphysically dubious. |

  ### Section 3: Genuine Cruxes - Points Where Resolution Would Shift the Debate

  1.  **Crux: The Truthmaker Demand for Tensed Truths**
      *   **Question:** Must truths about the non-present (e.g., "The Battle of Hastings occurred in 1066") have truthmakers that are *presently existing* and *intrinsically tensed*?
      *   **Test Case:** Consider a hypothetical universe that sprang into existence 5 minutes ago, complete with all the current physical evidence (rocks with apparent age, fossils, written records, apparent memories) suggesting a long past history. *Is the statement "This universe is more than 5 minutes old" true or false?*
          *   **Presentist Prediction:** False. Since no past events or entities *exist*, the statement lacks a truthmaker. The *apparent* evidence is just that – apparent features of the *present* state. Truth requires correspondence to actual *existence* at the relevant time.
          *   **Eternalist Prediction:** True. The statement describes the actual temporal structure of the universe as it exists tenselessly. The evidence *is* evidence *of* that structure. The truthmaker is the tenseless fact about the universe's temporal extent.

  2.  **Crux: The Possibility of Genuine Cross-Temporal Relations**
      *   **Question:** Can relations like causation, memory, or admiration genuinely hold between entities that do not both exist *simpliciter* (in the presentist's sense), or must they be analyzed away as intrinsic properties of the later relatum?
      *   **Test Case:** Consider "Agent A, located at time t2, intentionally causes an effect on entity B that *only existed* at time t1 (and no longer exists at t2)." (E.g., A sets a time-delay device at t1 to destroy B's tomb at t2, knowing B is long dead but wanting to desecrate their memory).
          *   **Presentist Prediction:** A's action cannot be a *genuine causal relation* to the non-existent B. It must be analyzed as A causing an effect *on the present tomb* (which exists) *because of* A's present mental state *about* the non-existent B (grounded in present memories/traces), combined with the present state of the device.
          *   **Eternalist Prediction:** A genuine causal relation holds directly between the event <A-setting-device-at-t1> and the event <tomb-destruction-at-t2>, and A's intentional state at t1/t2 genuinely relates A to the tenselessly existing entity <B-at-t1>. The non-existence of B *at t2* is irrelevant to the tenseless existence of B and the causal/intentional relations spanning time.

  3.  **Crux: The Objectivity and Irreducibility of Temporal Passage**
      *   **Question:** Is the experience of temporal passage best explained as awareness of a fundamental, mind-independent feature of reality (objective becoming), or is it fully explicable as an indexical feature arising from an entity's location within a static temporal manifold?
      *   **Test Case:** Imagine a "Block Viewer" – a hypothetical being that perceives the entire four-dimensional spacetime manifold tenselessly "all at once," including the location of conscious experiences within it. *Would the Block Viewer perceive or understand the phenomenon of "temporal passage" or the "moving now" as an objective feature of the manifold itself?*
          *   **Presentist Prediction:** No. The Block Viewer would see a static structure. The experience of passage is something *additional* to the block – it *is* the objective becoming that the Block Viewer cannot perceive because it stands outside of time. The Viewer would see *when* experiences of passage occur within the block, but not the passage itself as a dynamic feature.
          *   **Eternalist Prediction:** Yes, but only as a perspectival feature. The Block Viewer would understand that entities *within* the manifold, due to their location and the nature of consciousness/process, experience a "moving now" relative to their position. The Viewer sees the entire sequence, including all experiences of "nowness" at their respective times. There is no extra "passage" beyond the manifold and the indexical perspectives within it.

  4.  **Crux: Relativity and Ontology**
      *   **Question:** Does the frame-relativity of simultaneity established by Special Relativity decisively favor eternalism by undermining the possibility of a metaphysically privileged present, or can presentism be coherently reformulated within a relativistic framework (e.g., using a "thick" present or light cone structure)?
      *   **Test Case:** Consider the development of a future theory of quantum gravity that successfully integrates gravity with quantum mechanics. *Would such a theory be more likely to posit a fundamental, dynamically evolving structure incompatible with a static block (favoring presentism/dynamical views), or would it be more likely to describe a complex but fundamentally static geometric structure (favoring eternalism)?*
          *   **Presentist Prediction:** A fundamental theory is likely to involve dynamics and evolution at its core (e.g., a wavefunction evolving on a configuration space, or discrete causal sets growing), which aligns more naturally with a dynamic temporal ontology like presentism or the growing block, even if the "present" is relativized.
          *   **Eternalist Prediction:** A fundamental theory is more likely to be formulated as a set of atemporal laws governing a fixed, four-dimensional geometric structure (e.g., a solution to the Wheeler-DeWitt equation in quantum cosmology, or a completed path integral), which aligns naturally with the eternalist block universe. Dynamics would be an emergent feature within this structure.

  ### Section 4: Verbal/Conceptual vs. Substantive Disagreements

  We are prepared to concede that **some aspects of the dispute may hinge on terminological preferences or conceptual framing rather than deep metaphysical disagreement:**

  1.  **The Word "Real":** We acknowledge that much confusion can arise from differing implicit definitions of "real," "existence," or "fundamental existence." The presentist typically uses "exists" to mean "exists *now*," while the eternalist uses it to mean "exists *at some time*" or "is part of the spacetime manifold." Clarifying this usage can prevent talking past each other, but the underlying ontological commitments regarding what there *is* remain genuinely different.
  2.  **"Temporal Parts":** The debate over whether objects persist by enduring (wholly present at each time) or perduring (having temporal parts) may be partially separable from the presentism/eternalism debate. While eternalism naturally accommodates perdurantism, it is logically possible (though perhaps less plausible) to combine eternalism with endurantism. Presentism is incompatible with perdurantism as standardly conceived. The core disagreement (Section 2.1, 2.2) persists regardless of the stance on persistence.

  **We maintain that the following disagreements are substantive and not merely verbal:**

  1.  **The Fundamental Ontology (Section 2.1):** Whether the totality of what exists is confined solely to the present moment (however defined relativistically) or encompasses past, present, and future equally.
  2.  **The Nature of Truthmakers for Non-Present Truths (Section 2.2):** Whether truth requires correspondence to presently existing tensed facts or to tenselessly existing entities/events.
  3.  **The Objectivity of Temporal Passage (Section 2.3):** Whether the "moving now" reflects an objective feature of reality itself or solely a perspectival feature of consciousness within a static manifold.
  4.  **The Irreducibility of Cross-Temporal Relations (Section 2.4):** Whether relations spanning different times are fundamental or reducible to properties of the later relatum within the present.
  5.  **The Ontological Implications of Relativity (Section 2.5):** Whether Special Relativity's structure decisively undermines the possibility of a metaphysically significant present or whether dynamic views can be coherently adapted.

  **Conclusion for the Workshop:** This document clarifies where our debate genuinely lies. We commit to focusing our discussion during the workshop on the substantive disagreements outlined in Sections 2 and 3, particularly the identified cruxes and the predictions associated with them. We aim to explore whether evidence, argument, or conceptual analysis concerning these cruxes can resolve the impasse or reveal new avenues for understanding time.

  Signed,

  _________________________  
  [Dr. Persephone Presentist]

  _________________________  
  [Dr. Everett Eternalist]

  ---
  **Workshop Moderator Note:** This document serves as the agreed-upon framework. Discussion should center on the disagreements (Section 2), rigorously examining the arguments for each position, and evaluating the cruxes (Section 3) – especially probing the predictions made. Participants are encouraged to propose additional tests or refine existing ones. The goal is not necessarily immediate agreement, but deeper mutual understanding and progress on the substantive issues. Time allocated for each crux and disagreement should be respected.
