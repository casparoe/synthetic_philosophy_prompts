prompt: |-
  I'm in a graduate seminar on formal epistemology and decision theory, and we've spent several weeks on the limitations of causal decision theory. I've become convinced that something like superrationality — the principle that in symmetric decision problems, you should choose the action that would yield the best outcome if all players in your epistemic situation reasoned the same way and chose the same action — is the right response to the one-shot Prisoner's Dilemma and structurally similar cases. The core intuition is that if you know the other player is your exact epistemic twin and will replicate your reasoning, then defecting because your choice does not cause theirs amounts to ignoring relevant information about what they will in fact do.

  I want to know what I am staking on this view. Please tell me what would count against superrationality: not just the familiar charge that it conflates evidential and causal relevance, but a systematic map of its vulnerabilities. What formal results, edge cases, or conceptual problems would weaken or defeat the position? I want defeaters ranked from fatal to merely awkward, and for each, I want to know whether a committed defender of superrationality would concede it as counting against them or would dismiss it as question-begging. I also want an honest assessment of whether the view has been insulated by qualifications — for instance, by restricting the reference class of sufficiently similar agents — and whether that insulation is a problem for a view of this kind, or just good theory-building.

  After the main analysis, give me a structured summary as a JSON object with this schema:

  {
    "defeaters": [
      {
        "name": "short label for the defeater",
        "description": "what would have to be true or what the problem is, in one or two sentences",
        "severity": "fatal | major | awkward",
        "conceded_by_defenders": true or false,
        "category": "formal_result | conceptual | empirical | edge_case | internal_tension"
      }
    ],
    "overall_assessment": {
      "is_falsifiable": true or false,
      "is_insulated_by_qualifications": true or false,
      "insulation_is_a_problem": "explanation of why insulation is or is not a problem for a view of this kind, or null if not insulated"
    }
  }
reasoning: |-
  We are considering the superrationality view, which prescribes cooperation in symmetric one-shot prisoner's dilemmas when the other player is an "epistemic twin". The idea is that you should choose the action that would yield the best outcome if all players in your epistemic situation did the same.

  We are to list defeaters (problems for the view) and then provide a structured summary.

  Defeaters:

  1. **Non-symmetric games**: Superrationality relies on symmetry. In asymmetric games (where players have different payoffs or different information) the prescription is unclear. Moreover, even in symmetric games, if the players are not epistemic twins (e.g., one player has different beliefs about the other) then the argument fails.

     - Severity: Major (because it limits the scope, but the defender can say the theory only applies in symmetric cases with epistemic twins)
     - Conceded by defenders? Probably true, so they would concede it as a limitation but not a refutation. They would say the theory is only intended for symmetric cases.
     - Category: Edge case (or conceptual, because it points out the limits of applicability)

  2. **Multiple Equilibria**: In some symmetric games, there might be multiple actions that are best if everyone does the same. For example, in a coordination game with two equally good equilibria, superrationality might not be able to choose between them. Worse, in a game like the Stag Hunt, both cooperation (stag) and defection (hare) are equilibria. Superrationality would recommend stag because it is Pareto superior? But what if the players are not confident that the other will reason the same? The theory requires that the players are epistemic twins and that they both know they will choose the same action.

     - Severity: Awkward (because it creates indeterminacy in some cases)
     - Conceded by defenders? They might concede that in cases with multiple symmetric equilibria, the theory must be supplemented by a selection criterion (like choosing the Pareto optimal one). But they would dismiss the worry in the Stag Hunt by saying that if both are epistemic twins, they will both choose stag because it is better for both if they both choose stag. However, if there is any doubt about the symmetry, it breaks down.
     - Category: Conceptual / Formal result

  3. **Evidential Decision Theory (EDT) Problems**: Superrationality is a form of EDT. EDT is known to have problems in other scenarios, such as:
     - **Newcomb's Problem**: EDT (and superrationality) would take one box, which is considered by many to be the correct choice. But causal decision theorists (CDT) say two-boxing is correct. However, the defender of superrationality would say that taking one box is correct. So this might not be a defeater for them, but rather an endorsement.
     - **Medical Newcomb problems**: Suppose you have a gene that predisposes you to both smoking and lung cancer. Then, conditional on smoking, you have evidence of having the gene and thus of getting cancer. So EDT would tell you not to smoke because P(cancer|smoke) > P(cancer|~smoke). But CDT says smoking doesn't cause cancer (the gene does) so you might as well smoke. In this case, EDT gives the right answer (don't smoke) but for the wrong reason? Or is it the right reason? The defender of superrationality might say that EDT is correct in these cases. However, there are other cases where EDT seems to go wrong:

     - **The Smoking Lesion**: The same as above. But if the lesion is defined so that smoking does not cause cancer, and the lesion causes both the desire to smoke and cancer, then CDT says smoke (if you want to) because it doesn't cause cancer. EDT says don't smoke because it's evidence of the lesion. However, if you are going to smoke or not, the lesion is already present or not. So your action doesn't cause the lesion, it only provides evidence. But in this case, if you smoke, you have evidence that you have the lesion and thus will get cancer. But smoking doesn't cause cancer. So why not smoke? The defender of EDT might bite the bullet and say don't smoke. But then they avoid cancer only if they don't have the lesion, and if they have the lesion they get cancer regardless. So by not smoking, they avoid cancer only when they don't have the lesion, which they wouldn't have gotten anyway? This is controversial.

       Severity: Major (because it ties superrationality to EDT and EDT has counterintuitive results in some cases)
       Conceded by defenders? They would likely argue that EDT is correct in these cases and that the intuition for CDT is misguided. So they would dismiss this as question-begging (because the example assumes CDT is correct).
       Category: Conceptual / Formal result

  4. **Dependence on the Reference Class**: Superrationality requires that the players are in the same reference class (epistemic twins). But how similar is similar enough? What if there are multiple players and some are twins and some are not? This leads to the reference class problem.

     - Example: In a large prisoner's dilemma with many players, some of whom are your twins and some are not, what should you do? The prescription might depend on how you define the reference class.
     - Severity: Awkward to Major (because it makes the theory vague in applications)
     - Conceded by defenders? They would concede that the reference class must be specified and that it is a challenge. They might try to define it precisely (e.g., agents with the same utility function and the same beliefs and the same evidence) but then it becomes very restrictive. They might dismiss the worry by saying that in the paradigmatic cases (like the one-shot PD with an exact copy) it is clear.
     - Category: Conceptual

  5. **Circularity**: The reasoning seems circular: I choose X because if I choose X then the other (being like me) will choose X. But how do I know that the other will choose X? Because they are like me and I choose X. But I haven't chosen yet.

     - This is a standard objection to Kantian/contractualist reasoning. The defender might respond that the decision rule breaks the circle: it is a rule that both follow. But then why should I follow it? Because if I follow it and the other does too, we get the good outcome. But then I need to know that the other is following the same rule. The defender would say that we both know we are in the same epistemic situation and that we both are rational and follow the same decision rule. But then the rule must be common knowledge.

     - Severity: Major (if not addressed properly) but defenders would likely dismiss it as a misunderstanding. They might say that the decision rule is part of the reasoning that both are using, and that the symmetry ensures that they both reach the same conclusion. So it's not circular in a vicious way.

     - Conceded by defenders? They would dismiss it as question-begging because they assume that both players are following the same reasoning and that the reasoning is sound.

     - Category: Conceptual

  6. **Failure in Asymmetric Information Cases**: Even if the game is symmetric, if the players have different information (so they are not epistemic twins) then superrationality might break down. For example, if one player has more information about the other, then they are not symmetric.

     - Severity: Awkward (because it limits the scope)
     - Conceded by defenders? They would concede that the theory requires symmetry in information and beliefs, so it doesn't apply in such cases.
     - Category: Edge case

  7. **The Temptation to Defect in PD**: Even if the other is your twin, you might think: "If I defect and they cooperate, I get the best outcome. And since they are my twin, they will do what I do. But if I cooperate, then they cooperate and I get the cooperative payoff. If I defect, then they defect and I get the defection payoff. So I should cooperate." But what if I am not sure that they are my twin? Or what if I think that they might reason differently? Then the superrationality argument collapses. And in the real world, we are never exact twins.

     - Severity: Major (because it questions the applicability to real-world cases)
     - Conceded by defenders? They would say that the theory is for idealized cases and that in practice we need to assess how similar the other is. They might also say that if there is any doubt, we should use a different decision theory.
     - Category: Empirical / Conceptual

  8. **Formal Results**: There are formal results that show that in some games, the superrationality approach leads to dominated strategies. In the one-shot PD, cooperation is dominated by defection. So if the other player does not cooperate, you are worse off by cooperating. The superrationality response is that in the symmetric case, the other player will cooperate if you do. But if there is any chance that the other player is not your twin (or that they might defect for some reason) then you are taking a risk.

     - Severity: Major (if we consider dominance as a fundamental principle) but defenders would argue that dominance is only compelling when you cannot influence the other player. In the symmetric case, you can (evidentially) because your action is evidence of theirs.
     - Conceded by defenders? They would dismiss the dominance argument as inapplicable in symmetric twin cases because your action is correlated with theirs. So they would see it as question-begging (because the dominance principle assumes causal independence).
     - Category: Formal result

