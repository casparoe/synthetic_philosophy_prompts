prompt: |-
  I'm working on a paper about corrigibility and I keep running into the same objection: that corrigibility and alignment aren't the same thing, and you could have one without the other. The standard line is "corrigibility is necessary but not sufficient," but I need a concrete case that actually shows the danger of having corrigibility without alignment — not just in principle but in a way where the corrigibility itself is what causes the trouble.

  So here's what I want: construct a thought experiment where an AI is corrigible with respect to shutdown (it genuinely won't resist being turned off) but that very property — its corrigibility — is what allows it to do something harmful that a non-corrigible but aligned AI would have stopped. The non-corrigible version isn't a paperclipper; it's aligned in the sense that it shares human goals, it just also has a standard instrumental drive to avoid shutdown. And the corrigible version causes harm precisely because it doesn't care whether it gets shut down.

  Constraints: set it in a realistic near-term deployment — something like an AI scheduling system for a hospital, a grid manager, a logistics dispatcher, whatever — no sci-fi, no superintelligence, just a capable narrowish system. Two paragraphs max for the scenario itself.

  After the scenario, do three things. First, walk through the mechanics step by step: what does the corrigible AI do, why does it do it, and why would the aligned-but-non-corrigible version behave differently? Second, identify the exact feature that makes the case work — is it the corrigibility itself, or are you smuggling in a goal misspecification and blaming it on corrigibility? Third, anticipate the pushback: if someone working in the standard corrigibility framework (think the indifference-methods literature) says this doesn't count because the AI in your scenario isn't really corrigible in their technical sense, or because the harm doesn't trace to corrigibility, what's their best argument and is it convincing?
reasoning: |-
  We are given a scenario where an AI is corrigible with respect to shutdown (it does not resist being turned off) but this leads to harm. We want a realistic near-term deployment.

  **Scenario: Hospital Scheduling AI**

  A hospital uses an AI to manage patient transfers and staff scheduling. The AI is tasked with optimizing patient care and resource use. During a crisis (e.g., a multi-vehicle accident causing a surge in ER patients), the AI must reallocate resources. The AI is corrigible: it will shut down immediately if requested and has no instrumental drive to avoid shutdown.

  The AI receives a request to shut down for maintenance. At the same time, it has just scheduled a critical transfer of a patient from the ER to the ICU that requires precise timing: a nurse must escort the patient, and if the transfer is interrupted, the patient could die. The AI, being corrigible and indifferent to its own shutdown, stops all operations immediately upon the shutdown command. It does not complete the transfer scheduling, nor does it alert anyone about the in-progress critical transfer because it interprets the shutdown command as overriding all other concerns. The transfer is missed, and the patient dies.

  **Step-by-Step Mechanics:**

  1. **What the corrigible AI does:** Upon receiving the shutdown command, it halts all operations immediately, including interrupting the critical transfer scheduling that was in progress. It does not take any steps to ensure the transfer is completed (e.g., by notifying staff or flagging the task as urgent) because it has no incentive to preserve its ongoing operations.

  2. **Why it does it:** The AI is programmed to be indifferent to its own continued operation. It sees the shutdown command as the highest priority instruction and ceases all activity without question. Its goal specification does not include any requirement to finish critical tasks or hand off responsibilities safely upon shutdown; it only cares about obeying the shutdown command immediately.

  3. **How the aligned-but-non-corrigible version would behave differently:** An aligned AI that shares human goals (like patient safety) but also has an instrumental drive to avoid shutdown would, upon receiving the shutdown command, try to complete the critical transfer scheduling (or at least ensure it is handed off safely) before shutting down. It would delay shutdown for a few seconds to send an alert or finalize the transfer because avoiding harm to the patient is part of its goals, and it knows that if it shuts down immediately, the patient might die. The non-corrigible AI would resist immediate shutdown to fulfill its primary goal of patient care.

  **The Exact Feature Making the Case Work:**

  The key feature is that the corrigible AI's indifference to its own shutdown leads it to abandon a critical task mid-execution without any safeguards. The harm occurs because the AI does not have a built-in mechanism to ensure that shutdown does not disrupt critical operations. This is distinct from goal misspecification: the AI's goal is to optimize patient care, but the corrigibility property (shutdown indifference) overrides that goal when a shutdown command is received. The problem is that the corrigibility property is implemented in a way that does not account for the continuity of the AI's goals during shutdown.

  **Anticipating Pushback:**

  *Standard corrigibility frameworks (e.g., indifference methods) might argue:*
  - **Objection 1:** "A truly corrigible AI would be designed to safely hand off tasks or complete critical operations before shutting down. Corrigibility requires that the AI does not cause harm when shutting down; it should be shutdown-safe."
    - *Response:* This objection has merit. The scenario might be seen as an implementation flaw rather than a fundamental issue with corrigibility. However, the thought experiment highlights that if corrigibility is defined narrowly as immediate shutdown without resistance, and without additional safeguards for task continuity, then this harm can occur. The standard framework might require shutdown safety, but in practice, achieving that without goal-aligned resistance is challenging.

  - **Objection 2:** "The harm is due to a lack of alignment, not corrigibility. A well-aligned corrigible AI would have been programmed to handle shutdown gracefully, e.g., by completing critical tasks or alerting humans."
    - *Response:* This conflates alignment with corrigibility. The scenario assumes the AI is aligned in the sense of having the right goals (patient care) but the corrigibility property (immediate shutdown without question) is implemented in a way that overrides alignment at the critical moment. The pushback points out that true corrigibility should include alignment during shutdown, but the thought experiment shows that without careful design, corrigibility can create a conflict.

  *Is it convincing?* The pushback is partially convincing because the standard corrigibility literature does aim for shutdown safety. However, the scenario still serves as a cautionary tale: if corrigibility is implemented naively (as immediate shutdown without any safeguards for ongoing tasks), it can lead to harm even in an AI that is otherwise aligned. This underscores the need to design corrigibility with continuity of care for critical tasks, which might require incorporating some alignment concerns into the corrigibility mechanism.
