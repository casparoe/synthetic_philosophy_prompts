   We can now write the tree with the above considerations.

   But we must also note that the boundaries are fuzzy:

     - Between Darwinian and Skinnerian: Some systems have very limited learning (e.g., sensitization in simple organisms). We classify them as Skinnerian if they have any learning, but if the learning is extremely constrained, it might be on the border.

     - Between Skinnerian and Popperian: The key is internal simulation. However, as noted, even in operant conditioning there might be an element of anticipation (e.g., Tolman's cognitive maps). So if a system uses internal states that predict outcomes, does that count as simulation? We require the ability to consider multiple candidate actions and their outcomes. If the system can only predict the outcome of one action at a time (or has a fixed set of responses), then it might be Skinnerian.

     - Between Popperian and Gregorian: The use of external tools that are not symbolic (like a crow using a stick) does not qualify for Gregorian. But if the tool is used in a way that involves representation (e.g., a chimp using a token to represent food) then it might be a gray area. However, Dennett's Gregorian category is defined by the use of linguistic and cultural tools that transform cognition. So nonhuman animals that use tools are still Popperian unless they use symbols in a human-like way (which is controversial).

   Therefore, we will structure the decision tree as follows, and then add notes about ambiguities and unoccupied regions.

   Decision Tree:

   1. **Does the system modify its behavior during its lifetime based on individual experience (i.e., does it learn from feedback)?**
       - NO → **Darwinian Creature**: "Hardwired by evolution; behavior is fixed and does not change with experience."
          - *Commentary: The hardest cases are organisms with very limited plasticity (e.g., some insects) that might show slight adjustments, raising the question of whether any behavior is truly fixed. This reveals that the Darwinian category is an idealization and that in nature, pure Darwinian creatures may be rare.*
       - YES → Go to 2.

   2. **Can the system internally generate and evaluate multiple candidate actions (without overt trial) and then select an action based on that internal process?**
       - NO → **Skinnerian Creature**: "Learns by real-world trial and error; behavior is shaped by reinforcement."
          - *Commentary: The hardest cases are systems that form internal expectations (e.g., Pavlovian conditioning) but still require overt trials for learning new behaviors. This reveals that the Skinnerian/Popperian boundary is fuzzy because even simple learning may involve some internal representation.*
       - YES → Go to 3.

   3. **Does the system use external symbolic structures (like language, writing, or mathematical notation) to perform cognitive tasks that it could not perform (or could not perform as well) without them?**
       - NO → **Popperian Creature**: "Uses internal models to simulate actions and outcomes, avoiding costly real-world trials."
          - *Commentary: The hardest cases are animals that use physical tools (e.g., crows bending wires) because the tool seems to extend cognition. However, without symbolic representation, these are still Popperian. This reveals that the framework distinguishes between physical and symbolic tools, and the latter is required for the Gregorian leap.*
       - YES → **Gregorian Creature**: "Uses external symbolic tools (especially language) to augment its cognitive capacities."
          - *Commentary: The hardest cases are AI systems that use symbols in a limited, non-linguistic way (e.g., a RL agent with a token-based memory) or nonhuman animals with symbolic abilities (e.g., sign-language-using apes). This reveals that the Gregorian category is defined by the transformative impact of culture and language, which may be uniquely human.*

   Additionally, we note that the tree might lead to ambiguous classifications in some cases. For example:

     - A system that sometimes uses internal simulation but mostly relies on trial and error? We classify it by its highest capability.

     - A system that uses external symbols only in a very limited way? We require that the external symbols are necessary for tasks that would be impossible otherwise. If the system can perform the task without the symbols (albeit less efficiently), then it might not be Gregorian.

   We also note the following unoccupied or rare regions:

     - **Darwinian with External Symbols**: A system with no lifetime learning that uses external symbols. This is theoretically possible (e.g., a pre-programmed robot that prints messages) but the symbols would be fixed and inflexible. It is rare because the power of symbols typically requires learning.

     - **Skinnerian with External Symbols**: A system that learns by trial and error but uses external symbols. However, if the symbols are used in a true symbolic manner (with compositionality and reference), then it would require internal modeling to manipulate them. So this region might be unoccupied because true symbol use requires internal simulation.

     - **Popperian without Lifetime Learning**: A system with an internal model but no ability to learn (i.e., the model is fixed). This is possible in artificial systems (e.g., a chess program with a fixed evaluation function) but in nature, internal models are typically acquired or refined by experience.

     - **Gregorian without Internal Simulation**: This seems impossible because the use of external symbols requires internal processes to interpret and manipulate them.

   Therefore, we can add a note:

