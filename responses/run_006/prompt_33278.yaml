answer: |-
  **The most decisive desideratum is accommodating selfless assertions, which forces rejection of the knowledge norm and belief norm, leaving justification-based norms as the strongest contenders.**

  Here's the full specification of desiderata for any adequate theory of the norm of assertion, categorized by non-negotiables and camp-specific goals, with explanations and their narrowing power:

  1.  **Explain Moorean Absurdity (Non-Negotiable):** The theory must explain why asserting "P, but I don't believe P" or "P, but I don't know P" is inherently absurd/paradoxical, even if P is true. *Consideration:* This is a core linguistic datum; any norm that doesn't render such assertions a violation is implausible.
  2.  **Explain Lottery Propositions (Non-Negotiable):** The theory must explain why it seems improper to assert "Your ticket lost" based *solely* on the long odds (e.g., 1 in a million), even if the ticket *did* lose and the odds are known. *Consideration:* Intuitions strongly suggest probabilistic justification alone is insufficient for proper assertion; the norm must demand something stronger than mere statistical likelihood.
  3.  **Accommodate Selfless Assertions (Non-Negotiable):** The theory must account for cases where an assertion seems proper despite the speaker lacking belief (and thus knowledge). *Example (Lackey):* A creationist teacher, who doesn't personally believe in evolution due to faith but possesses excellent scientific justification and understands it, asserts "Modern Homo sapiens evolved from Homo erectus" to her students. Intuition suggests this is proper. *Consideration:* This is a powerful counterexample against the knowledge and belief norms; a viable theory must handle this without implausibly denying the propriety.
  4.  **Account for Blameworthiness in False Assertions (Non-Negotiable):** The theory must explain why we often blame someone for asserting a falsehood, even if they had excellent justification. *Consideration:* This points to a component of the norm related to truth or accuracy; a theory making falsity irrelevant to impropriety is inadequate.
  5.  **Distinguish Blameworthiness from Propriety (Non-Negotiable):** The theory must explain the difference between an assertion being *blameworthy* (e.g., because false or unjustified) and it being *improper* due to violating the constitutive norm. *Consideration:* We can sometimes assert properly but unluckily (get Gettiered) and be blameless, yet the assertion might still violate the norm. The theory needs conceptual space for this.
  6.  **Respect Context-Sensitivity (Non-Negotiable):** The theory must explain how contextual factors (stakes, audience expertise, practical consequences) can affect the perceived propriety of an assertion. *Example:* Asserting "The bank is open Saturday" might require more justification if someone needs to deposit a life-saving cheque vs. just making idle chat. *Consideration:* Assertions don't occur in a vacuum; the norm must be sensitive to conversational contexts.
  7.  **Explain Warranted Assertions without Knowledge (Camp-Specific - Anti-Knowledge):** The theory must explain why assertions based on strong justification seem proper even in Gettier cases where the speaker has justified true belief without knowledge. *Consideration:* This is a key motivation for justification norms over knowledge norms; if such assertions seem proper, knowledge is too strong.
  8.  **Defend Against Lucky True Belief (Camp-Specific - Pro-Knowledge/Anti-Belief/Truth):** The theory must explain why asserting a true proposition based on a sheer guess or irrational hunch is improper. *Consideration:* Knowledge and justification norms handle this easily; belief and truth norms struggle. This motivates rejecting pure belief or truth norms.
  9.  **Maintain Truth as the Goal (Camp-Specific - Pro-Truth):** The theory should position truth as the fundamental aim of assertion, even if the norm isn't simply "assert only truths". *Consideration:* Defenders of truth norms argue assertion is constitutively aimed at truth; rival norms need to incorporate this aim meaningfully.
  10. **Avoid Over-Intellectualization (Camp-Specific - Pro-Belief/Truth):** The theory shouldn't require sophisticated epistemic concepts (like explicit justification or knowledge) for ordinary assertions. *Consideration:* Belief and truth norms argue knowledge/justification norms are too demanding for everyday speech.

  **Most Narrowing Desideratum:** **Accommodating Selfless Assertions (#3)** does the most work. It definitively rules out the **knowledge norm** (requires knowledge) and the **belief norm** (requires belief). Only **justification-based norms** (like the justification norm or reasonable-to-believe norm) and the **truth norm** (which doesn't require belief/knowledge) *prima facie* survive this test. However, the truth norm faces severe difficulties elsewhere (#2, #4, #5, #8).

  **Conflicting Pair:** **Explaining Lottery Propositions (#2)** and **Accommodating Selfless Assertions (#3)** cannot be *easily* jointly satisfied by the *same* simple norm. Justification-based norms handle #3 well but often struggle with #2, as the lottery case presents *strong probabilistic justification* which, if sufficient, should make the assertion proper – but intuition says it isn't. Knowledge norms handle #2 perfectly but fail #3. Resolving this tension requires significant theoretical work (e.g., contextualist justification standards, pragmatic encroachment, denying the intuition about lotteries or selfless cases). This clash lies at the heart of the debate's persistence.
