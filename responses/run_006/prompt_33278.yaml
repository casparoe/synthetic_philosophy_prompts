  I'm a journalist covering the philosophy of language for a general-interest ideas magazine, and I'm working on a piece about the norms-of-assertion debate — the question of what rule, if violated, makes a statement improper to say even when it's true. The main contenders are the knowledge norm, the truth norm, the belief norm, and justification-based norms, but each camp seems to build its case around its favorite examples and sidestep the awkward ones. Before I commit to a view, I want the full specification of what a theory here has to deliver. Give me the desiderata: what must any adequate theory of the norm of assertion get right — the cases and phenomena it must handle, the distinctions it must respect, the explanatory burdens it carries — with the consideration behind each. Flag which are non-negotiable and which are camp-specific. Then tell me which single desideratum does the most work to narrow the field, and whether any pair of them cannot be jointly satisfied. I want a committed answer that takes a definite position on the list. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
