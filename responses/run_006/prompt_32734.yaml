prompt: |-
  I've been trying to settle a recurring argument on rationalist-adjacent forums about whether a Bayesian agent should ever avoid information, and someone cited Good's theorem as though it closes the case. A blog post I found states the theorem like this:

  "Good's theorem is the formal result behind the slogan that information can't hurt a rational agent. If you're an expected-utility maximizer facing a decision and someone offers you a piece of evidence for free, you can always ignore it and choose the act you would have chosen anyway, so your expected utility after seeing the evidence can't be lower than before, and it might be higher. It follows that a Bayesian should never turn down free information, and should be willing to pay at least something for any information source, however noisy. It also follows that once you've seen the evidence you can't be worse off than if you'd never looked; if updating on the evidence led you to a worse outcome, that just means you updated wrong."

  I have a vague memory that Good's original point was narrower — roughly, that the expected value of costless information is nonnegative for an expected-utility maximizer — and I suspect the post is overreading the theorem, but I can't reconstruct exactly which parts are fair and which are overstatements. Could you audit the summary claim by claim: what a decision theorist would accept, what they would qualify, and what is simply wrong? Please lead with a one-sentence overall verdict, then work through the claims, and finish by saying which of the summary's practical conclusions survive once the errors are corrected. Keep the entire response under 400 words, and write in American English.
reasoning: |-
  Okay, the user is trying to settle an argument about whether a Bayesian agent should ever avoid information, and they've cited Good's theorem from a blog post that claims information can't hurt. The user suspects the post might be overstating the theorem. I need to audit the summary by identifying what's correct, what needs qualification, and what's wrong.

  First, I recall Good's theorem: it states that the expected value of information (EVI) is nonnegative before acquiring it, meaning a rational agent shouldn't turn down free information. But the blog post extends this to say agents should never avoid info and can't be worse off after seeing evidence, which might not hold in all cases.

  Key points to address: 
  - The claim that info can't hurt: This is only true in expectation before seeing it. After updating, outcomes can be worse due to bad luck with the evidence, even with correct updating. For example, in medical testing, a false positive might lead to unnecessary treatment.
  - Willingness to pay: The theorem supports paying for info if the expected net gain is positive, but agents might decline if costs exceed EVI or if there's no decision value.
  - Ignoring info: While agents can ignore free info, doing so might not be optimal since using it could improve decisions.
  - Worse off after evidence: The blog post argues this implies wrong updating, but actually, it can happen despite correct Bayesian updating due to stochastic outcomes.

  Practical conclusions that survive correction:
  - Free info should be accepted (qualified by no decision-irrelevance or costs).
  - Paying for valuable info is rational when EVI > cost.
  - But agents might rationally avoid info in cases like nuisance costs, self-deception, or when it triggers harmful actions.

  I need to structure the response with a one-sentence verdict upfront, then break down each claim, and end with surviving practical conclusions. Keep it under 400 words in American English.
answer: |-
  **Overall verdict:** Good's theorem correctly establishes that the *expected* value of costless information is nonnegative before acquisition, but the blog post overextends this to make overly broad and incorrect claims about outcomes after seeing evidence.

  **Claim Audit:**

  1.  **"Information can't hurt a rational agent." / "Your expected utility after seeing the evidence can't be lower than before."**
      *   **Accept:** True *in expectation before seeing the evidence*. The *expected* utility of receiving the information is at least as high as not receiving it.
      *   **Qualify/Wrong:** False for the *actual* utility *after* seeing specific evidence. Correct updating on unlucky evidence can lead to a worse *outcome* than if you never saw it (e.g., learning a misleading "fact" that leads you astray despite proper Bayesian updating). The theorem doesn't guarantee better actual outcomes, only nonnegative *expected* value beforehand.

  2.  **"A Bayesian should never turn down free information."**
      *   **Qualify:** Generally true *if* the information is genuinely costless, potentially relevant to some future decision, and acquisition imposes no other costs (like attention, distress, or triggering undesirable actions). Agents *can* rationally avoid *decision-irrelevant* information or information with nuisance costs.

  3.  **"Should be willing to pay at least something for any information source, however noisy."**
      *   **Qualify/Wrong:** True only if the information has *some* potential decision value (EVI > 0). An agent should be willing to pay *up to* the expected value of that information (EVI) for it, which could be zero for completely irrelevant or uselessly noisy information. They won't pay for negative-value info.

  4.  **"Once you've seen the evidence you can't be worse off than if you'd never looked." / "If updating... led you to a worse outcome, that just means you updated wrong."**
      *   **Wrong:** This is incorrect. Correct Bayesian updating on accurate but misleading evidence *can* lead to a worse final outcome due to the stochastic nature of the world and the evidence itself (e.g., a true but unrepresentative sample). Blaming "wrong updating" misattributes outcome bad luck to irrationality.

  **Surviving Practical Conclusions (Corrected):**

  *   A rational agent should generally accept genuinely *free* information potentially relevant to decisions (barring nuisance costs or strategic reasons like self-deception).
  *   An agent should be willing to pay for information, but *only* up to its Expected Value of Information (EVI), which must be positive and greater than the cost. EVI can be zero for useless information.
  *   Agents can rationally avoid information if it's irrelevant, too costly (including non-monetary costs), or strategically counterproductive.
