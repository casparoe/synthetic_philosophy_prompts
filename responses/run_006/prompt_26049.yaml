  ok so we did this thing in my psychology class where we had to pick between bets and now I'm proper confused about what rule I'm actually using. here are my choices:

  1. Urn A has 50 red and 50 blue balls. I'd happily bet a fiver on red to win £20. No issue.

  2. Urn B has 100 balls that are red or blue but I've got no clue the mix. I wouldn't take the same bet on red. Feels too muggy.

  3. Urn C has 30 red, 30 blue, and 40 that are either green or yellow (unknown split). I'd rather bet on red than on green. But then if the bet is "red or yellow" vs "green or yellow", I'd rather bet on "green or yellow". And that looks like I'm saying green is less likely than red in the first bet but "green or yellow" is more likely than "red or yellow" in the second, which can't both be right cos yellow's the same either way.

  4. Urn D is like C but I know the split: 30 red, 30 blue, 20 green, 20 yellow. Now I genuinely dont care which colour I bet on, and I dont care between the combo bets either.

  5. Urn E has 100 balls, completly unknown colours. I have to pick between betting on red or betting on blue for £20. I don't care which. But I also wouldn't care between red and blue in Urn A. So when both options are equally ambiguous I'm fine — it's only when one option is clear and the other isnt that I get squeamish.

  Is there a principle that captures all five of these, or do I need to ditch one of my verdicts? And what would the principle say about a case where I can pay to find out the mix before betting — how much should I pay?

  Give me your answer as exactly five numbered points, each a sentence or two, with no intro or conclusion.
