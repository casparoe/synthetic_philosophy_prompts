answer: |-
  1. Your choices in Urns A and B show **ambiguity aversion**: You prefer bets with known probabilities (Urn A's 50/50) over bets with unknown probabilities (Urn B's uncertain mix), even when potential payoffs are identical.  

  2. In Urn C, your preference for red over green (known 30% vs. ambiguous 0-40%) again reflects ambiguity aversion, but your switch to "green or yellow" over "red or yellow" occurs because "green or yellow" has a *known* 40% probability (as it covers all ambiguous balls), while "red or yellow" has an *ambiguous* 30-70% range.  

  3. Your indifference in Urn D aligns with **expected value maximization**: All single-color bets have identical 30% probabilities, and all two-color combos have identical 50% probabilities, eliminating ambiguity.  

  4. In Urn E, indifference between red and blue stems from **symmetry under ambiguity**: When both options are equally ambiguous (unlike Urn B, where only one is ambiguous), you treat them as equivalent, similar to Urn A’s known 50/50.  

  5. For paying to learn the mix (e.g., in Urn B), the maximum amount depends on ambiguity aversion strength: You should pay up to the value that makes the bet’s *certain equivalent* (e.g., £5 for Urn A) match the ambiguous bet’s perceived worth (e.g., £0 for Urn B if avoided entirely).
