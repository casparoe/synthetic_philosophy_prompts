prompt: |-
  Two people in my office got into an argument about how you should update your beliefs when evidence is less than certain, and neither would give ground.

  Maya: Take a radiologist who reads an X-ray and ends up 80% sure there's a tumour. Standard Bayesianism handles this fine: she conditions on the proposition describing what she actually saw—the shadow on the film, the pattern, whatever. Her new credence in 'tumour' is her old credence conditional on that observation.

  Dan: But that's exactly what she didn't learn for certain. She didn't become certain of some precise proposition about the film; she just found herself more confident that there's a tumour. If you force her to condition on 'I saw such-and-such a pattern,' you need likelihoods for that pattern given tumour and given no tumour, and those likelihoods are precisely the judgement the X-ray was supposed to supply. The honest move is to say her credence in the tumour moved straight from 0.2 to 0.8, while her credences conditional on 'tumour' and on 'no tumour' stayed fixed.

  Maya: But 'move straight to 0.8' isn't a rule, it's just a number pulled out of the air. Where does 0.8 come from if not from something she learned? And why should the conditional probabilities stay fixed? Sometimes an observation should change what you'd expect given a tumour, not just how likely a tumour is.

  Dan: The 0.8 is the input—the new state of uncertainty her experience puts her in—not something the rule has to derive. Strict conditionalisation also leaves its input unexplained: it tells you to hold everything else fixed when you learn a proposition, and that's a substantive assumption, not a theorem of probability. At least my story doesn't pretend the experience was a proposition she became certain of.

  Maya: Fine, but if your story just says 'set your credence over the tumour/no-tumour alternatives to whatever the experience dictates,' its not a theory of updating. It's a description of the problem. A theory should say which posterior is rational given a prior and an experience, and yours says nothing about that.

  Dan: Neither does yours, actually—strict conditionalisation only applies once you've already settled which proposition was learned with certainty. The question is which idealisation is less distorting for uncertain evidence, not which rule is provable.

  They never got past that. Please go through their exchange and adjudicate it move by move: who's right about which specific claim, who's wrong, and what are they both missing?
reasoning: |-
  Okay, I need to tackle this office debate between Maya and Dan about updating beliefs with uncertain evidence. Let me start by understanding their positions. Maya is advocating for standard Bayesian updating, where the radiologist conditions on the specific observation, like the shadow on the X-ray. Dan argues that the radiologist didn't become certain of a precise proposition; instead, her confidence in the tumor just jumped to 80%. He suggests updating the credence directly without conditioning on a specific observation.

  First, I should recall how Bayesian updating works. Normally, you start with a prior probability, say P(T) for the tumor. When you observe evidence E, you update to P(T|E) using Bayes' theorem. That requires knowing the likelihoods P(E|T) and P(E|~T). Maya's point is that the observation (the shadow) is E, and the radiologist's 80% certainty comes from conditioning on that.

  But Dan's counter is that the radiologist isn't certain about E. She just ends up with 80% confidence in T. If you force her to condition on E, you need the likelihoods for that specific E, which might not be available or might be what the evidence was supposed to provide. Instead, he proposes that the credence moves directly to 0.8, and the conditional probabilities remain fixed. That sounds like Jeffrey conditionalization. Jeffrey's rule allows updating on uncertain evidence by setting the posterior directly and preserving the conditional probabilities.

  Maya argues that just setting P(T) to 0.8 without a basis isn't a rule; it's arbitrary. She questions why conditional probabilities should stay fixed. Dan responds that the 0.8 is the input from the experience, similar to how strict conditioning takes the learned proposition as input. He says strict conditioning also assumes holding other things fixed, which isn't a theorem but an assumption.

  Maya then points out that Dan's approach doesn't provide a theory; it's just describing the problem. A theory should specify which posterior is rational given prior and experience. Dan retorts that strict conditioning also relies on specifying which proposition was learned, so both have inputs that aren't derived.

  Now, to adjudicate. Both have valid points. Maya is correct that standard Bayesianism uses conditioning on observations, but Dan is right that uncertain evidence isn't certain observation. Jeffrey conditionalization is designed for this. When evidence is uncertain, you directly assign probabilities to the partition (like tumor or not) and preserve conditional probabilities for other events. This avoids needing to specify likelihoods for a precise observation.

  However, Jeffrey's rule requires that the evidence affects the partition directly, and conditional probabilities given the partition remain unchanged. This might not always hold, as Maya noted. For example, if the observation changes what you expect under tumor or no tumor, those conditionals shouldn't stay fixed. But in cases like the radiologist, her expertise allows her to assign the 80% based on the evidence, implying she's internalized the likelihoods.

  Dan's approach isn't arbitrary if the 80% is based on the evidence. The radiologist's judgment comes from years of training, which encodes the likelihoods implicitly. So the 80% isn't pulled from thin air; it's derived from her observation, even if uncertain.

  Both miss that Jeffrey conditionalization formalizes Dan's idea. Also, strict conditioning is a special case of Jeffrey's when evidence is certain. The key is that for uncertain evidence, Jeffrey's rule is the standard extension. However, it still assumes that conditional probabilities are stable, which might not always be true. If the evidence changes the relationship between the tumor and other variables, the conditional probabilities might need adjustment. But in many cases, it's a reasonable assumption.

  Maya's point about a theory needing to derive the posterior from prior and experience is valid. But Bayesianism, including Jeffrey's, doesn't derive the inputs; it specifies how to update given those inputs. The inputs (observed evidence or direct probability shifts) come from the user's judgment, which is where the subjectivity lies.

  So, overall, Dan's intuition aligns with Jeffrey conditionalization, which is a legitimate method. Maya is correct that you need to base updates on evidence, but she doesn't account for uncertain evidence in her strict conditioning model. Both need to recognize that Jeffrey's rule bridges their views: it uses the evidence to set posterior probabilities directly while preserving conditionals, formalizing the update without certain observations.
answer: |-
  ### Adjudication of Maya and Dan's Exchange  
  **Core Issue:** How to update beliefs (credences) when evidence is uncertain—e.g., a radiologist is 80% confident in a tumor but not certain about the specific observation (e.g., a shadow).  

  ---

  ### **Move-by-Move Analysis**
  #### **1. Maya’s Opening Claim**  
  > *Maya:* Standard Bayesianism handles this by conditioning on the precise proposition describing what was observed (e.g., "I saw shadow X"). The radiologist’s new credence in "tumor" is her prior credence conditional on that observation.  

  - **What’s Right:**  
    - Maya correctly describes **strict conditionalization** (standard Bayesian updating): \( P_{\text{new}}(H) = P_{\text{old}}(H \mid E) \), where \( E \) is a specific, certain observation.  
    - This is mathematically rigorous and works when \( E \) is unambiguously learned with certainty.  
  - **What’s Wrong/Missing:**  
    - She assumes the radiologist *became certain of a precise proposition* (\( E \)). But as Dan notes, the radiologist only gained uncertain evidence (80% confidence in the tumor), not certainty about \( E \).  
    - Strict conditionalization **cannot directly handle uncertain evidence** because it requires \( E \) to be known with probability 1.  

  #### **2. Dan’s Counterclaim**  
  > *Dan:* Conditioning on "I saw shadow X" forces us to use likelihoods (\( P(\text{shadow} \mid \text{tumor}) \)) that the X-ray itself was meant to provide. Instead, the radiologist’s credence should move directly to 0.8 for "tumor," with conditional probabilities (e.g., \( P(A \mid \text{tumor}) \)) unchanged.  

  - **What’s Right:**  
    - Dan identifies a key flaw in Maya’s approach: **strict conditionalization requires pre-existing likelihoods** for \( E \) (e.g., \( P(\text{shadow} \mid \text{tumor}) \)). But in practice, the radiologist’s judgment *is* the output of evaluating \( E \), not an input.  
    - His solution mirrors **Jeffrey conditionalization** (a generalization of Bayesian updating for uncertain evidence). Here:  
      - Directly set \( P_{\text{new}}(\text{tumor}) = 0.8 \) (the "input" from experience).  
      - Preserve conditional probabilities: \( P_{\text{new}}(A \mid \text{tumor}) = P_{\text{old}}(A \mid \text{tumor}) \) for all \( A \).  
    - He correctly notes that strict conditionalization also relies on an unexplained input (which \( E \) was learned with certainty).  
  - **What’s Wrong/Missing:**  
    - He dismisses Maya’s rule as "distorting," but Jeffrey conditionalization *depends* on the assumption that conditional probabilities stay fixed—a substantive constraint Maya challenges.  
    - He doesn’t explain **why 0.8 is rational** or how it derives from the experience.  

  #### **3. Maya’s Rebuttal**  
  > *Maya:* "Moving straight to 0.8" is arbitrary. Where does 0.8 come from? Conditional probabilities shouldn’t always stay fixed. A theory must specify rational posteriors from priors + experience.  

  - **What’s Right:**  
    - She highlights a weakness in Dan’s view: **Jeffrey conditionalization treats the posterior as an unexplained input**, not derived from the evidence. The 0.8 *must* originate from *some* relationship between the observation and the tumor.  
    - She correctly notes that conditional probabilities **may not stay fixed** after evidence (e.g., if the observation changes expectations under "tumor").  
  - **What’s Wrong/Missing:**  
    - She underestimates that **strict conditionalization has the same flaw**: it requires specifying which \( E \) was learned, which is also subjective.  
    - She ignores that **Jeffrey conditionalization *can* formalize her intuition**: the 0.8 often comes from implicit likelihoods (e.g., the radiologist’s training links shadows to tumors).  

  #### **4. Dan’s Final Point**  
  > *Dan:* Both rules have inputs. The debate is about which idealization (certain vs. uncertain evidence) is less distorting.  

  - **What’s Right:**  
    - He correctly frames this as a **philosophical choice** between idealizations. Neither rule is "provable"; both depend on assumptions.  
    - Jeffrey conditionalization **avoids misrepresenting uncertain evidence as certain**.  
  - **What’s Wrong/Missing:**  
    - He doesn’t address when conditional probabilities *should* stay fixed or how to justify the 0.8.  

  ---

  ### **Who’s Right, Who’s Wrong, and What’s Missing**  
  | **Claimant** | **Key Claims** | **Verdict** |  
  |--------------|----------------|-------------|  
  | **Maya** | "Condition on the precise observation." | **Mostly wrong** for uncertain evidence. Strict conditionalization fails when evidence isn’t certain. |  
  | **Dan** | "Move credence directly to 0.8; keep conditionals fixed." | **Mostly right** for uncertain evidence. This *is* Jeffrey conditionalization. |  
  | **Maya** | "0.8 is arbitrary; conditionals may change." | **Partially right**. 0.8 needs justification; conditionals aren’t always stable. |  
  | **Dan** | "Inputs are unavoidable; focus on distortions." | **Right**. Both rules require inputs; Jeffrey’s is better for uncertain evidence. |  

  #### **What Both Miss**  
  1. **Jeffrey conditionalization formalizes Dan’s intuition**:  
     - It *is* a valid Bayesian method: \( P_{\text{new}}(H) = \sum_i P_{\text{old}}(H \mid E_i) \cdot P_{\text{new}}(E_i) \), where \( P_{\text{new}}(E_i) \) is the direct input (e.g., 0.8 for "tumor").  
     - The 0.8 isn’t "pulled from air"—it’s the radiologist’s **causal judgment** from the observation, distilled from experience.  

  2. **The stability of conditional probabilities is an assumption**:  
     - Jeffrey’s rule assumes \( P_{\text{new}}(A \mid H) = P_{\text{old}}(A \mid H) \). This holds if the evidence only affects credences in \( H \) (the "tumor"), not the relationship between \( H \) and other propositions.  
     - **When this fails** (e.g., the X-ray also reveals tumor traits affecting other beliefs), more nuanced methods (e.g., **Adams conditioning**) are needed.  

  3. **Neither "derives" the posterior**:  
     - **Strict conditionalization** requires choosing \( E \).  
     - **Jeffrey conditionalization** requires choosing \( P_{\text{new}}(H) \).  
     - Both rely on **subjective inputs** from the agent’s interpretation of evidence.  

  ---

  ### **Resolution: A Synthesis**  
  - **For uncertain evidence, Dan’s approach (Jeffrey conditionalization) is superior** to strict conditionalization. It avoids pretending evidence is certain when it isn’t.  
  - **But Maya is right that the 0.8 must be justified**: It should stem from the agent’s prior beliefs and the evidence (e.g., the radiologist’s training provides implicit likelihoods).  
  - **Key Insight**: The radiologist’s 80% confidence *is* the output of subconsciously processing the observation—it doesn’t bypass Bayes; it internalizes it. Jeffrey conditionalization externalizes this process mathematically.  

  **Final Advice for Maya and Dan**:  
  > Use **Jeffrey conditionalization** for uncertain evidence, but ensure inputs (like 0.8) are grounded in prior knowledge. If conditional probabilities aren’t stable (e.g., the X-ray changes expectations *given* a tumor), extend to **generalized conditioning** (e.g., Pearl’s causal networks). Bayesianism is a toolkit—choose the right tool for the evidence’s certainty.
