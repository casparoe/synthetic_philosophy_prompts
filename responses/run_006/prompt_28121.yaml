answer: |-
  ### Classroom Activity: The Oracle's Prediction Game

  #### **Objective**: 
  Simulate the Death in Damascus structure to illustrate the tension between evidential and causal decision theory. Students face a transparent predictor, fixed predictions, and payoffs where their choice is *evidence* of a bad outcome, yet the other option *would have* paid better conditionally.

  ---

  ### **Rules & Setup**
  1. **Materials**:
     - Two colored slips per student: **BLUE** and **RED**.
     - One sealed envelope per student (prepared in advance by you, the instructor).
     - Paper for recording choices and points.
     - A visible "Prediction Registry" (a box holding sealed envelopes).

  2. **Backstory (Share with students)**:
     - An infallible "Oracle" (you) predicted each student's choice between BLUE or RED in advance. Predictions are sealed in envelopes.
     - The Oracle is 90% accurate historically. Emphasize: **No rigging is possible**—predictions were made before class, envelopes were shuffled, and students can verify envelopes are sealed.
     - Payoffs depend on **both** your choice and the Oracle’s prediction.

  3. **Payoff Scheme**:
     - **Match (BAD)**: If your choice **matches** the Oracle’s prediction → **0 points**.
     - **Mismatch (GOOD)**: If your choice **differs** from the Oracle’s prediction → **100 points**.

     > *Example*:  
     > - Oracle predicted "BLUE." If you choose BLUE: 0 points.  
     > - Oracle predicted "BLUE." If you choose RED: 100 points.  

  4. **Key Constraints**:
     - Predictions are fixed and sealed **before** choices.
     - No one sees predictions until **after** all choices are made.
     - Students **cannot** change predictions—only their own choice.

  ---

  ### **Timeline (75 Minutes Total)**
  1. **Introduction (5 min)**:
     - Explain rules, payoffs, and the Oracle’s accuracy.  
     - Emphasize: "Your goal is to maximize points. The Oracle already recorded predictions—they’re fixed."

  2. **Choice Phase (15 min)**:
     - Distribute BLUE/RED slips to students.  
     - Students deliberate: *"Which color should I choose? How does the Oracle’s prediction affect me?"*  
     - Students submit their choice (write name and color on a paper slip). Collect all choices.

  3. **Revelation Phase (15 min)**:
     - Open the Prediction Registry box, shuffle envelopes, and reveal predictions one by one.  
     - For each student:  
       - Announce prediction (e.g., "Oracle predicted BLUE for Alex").  
       - Compare to student’s actual choice.  
       - Award points (0 or 100) based on match/mismatch.  
     - Record results on the board (e.g., "Alex: Predicted BLUE, Chose BLUE → 0 points").

  4. **Discussion & Debrief (40 min)**:
     - Guide students through reflections using questions (see below).

  ---

  ### **Debrief: Mapping to Decision Theory**
  1. **Review Results**:
     - Tally points: Most students will have 0 points (if predictions are accurate).  
     - Ask: *"Why did so many get 0 points? What does your choice reveal?"*

  2. **Evidential Reasoning (EDT)**:  
     - *"Choosing BLUE is* ***evidence*** *that the Oracle likely predicted BLUE. So you expect 0 points (BAD). Same for RED. Thus, both options seem equally bad—you’re trapped!"*  
     - **EDT Conclusion**: Act based on **evidence** (your choice signals the prediction). Avoid "cursed" options.

  3. **Causal Reasoning (CDT)**:  
     - *"The prediction is already fixed. Your choice* ***cannot change*** *it. If the Oracle predicted BLUE, you’d get 100 points by choosing RED. If RED, you’d get 100 by choosing BLUE. So why not pick one?"*  
     - **CDT Conclusion**: Ignore evidence—focus on **causal independence**. The other option *would* pay better *if* the prediction differs.

  4. **The Paradox**:  
     - EDT sees no escape (0 points either way).  
     - CDT sees a 50% shot at 100 points (if predictions are random).  
     - **Irony**: By trying to avoid the "cursed" option (e.g., BLUE), you reveal you’re the type of person the Oracle predicted correctly!

  ---

  ### **Expected Misconceptions & Responses**
  1. **"I’ll outsmart the Oracle by being unpredictable!"**  
     - *Response*: "The Oracle knows your tendencies *in advance*. If you ‘randomize,’ it predicts your randomization pattern (e.g., ‘70% BLUE’). You can’t fake unpredictability retroactively."

  2. **"I should choose the color I think the Oracle didn’t predict."**  
     - *Response*: "But if you avoid BLUE because you think it’s ‘cursed,’ that’s exactly what the Oracle expected. Your reasoning is part of what it predicted!"

  3. **"The prediction is fixed, so I’ll just pick randomly."**  
     - *Response*: "This aligns with CDT! But note: if everyone does this, the Oracle’s accuracy drops. Yet EDT still ‘sees’ your choice as evidence of the prediction."

  4. **"Can I switch choices last second?"**  
     - *Response*: "No—the prediction accounts for your decision process. A last-second switch is part of your disposition, which the Oracle predicted."

  ---

  ### **Honest Limitation**
  - **What This Activity Can’t Replicate**:  
    In the original Death in Damascus, the predictor is **infallible** (100% accuracy). Here, the Oracle is described as 90% accurate, but in practice, your predictions won’t be perfect. This dilutes the evidential "trap" (students might score points by luck).  
    - *Mitigation*: Stress that we’re simulating a **hypothetical** with a near-perfect predictor. The paradox is clearest under 100% accuracy, where EDT insists both options doom you, while CDT insists your choice is irrelevant to the fixed prediction.

  ---

  ### **Instructor Notes**
  - **Predictions Setup**: Before class, prepare envelopes with random predictions (e.g., 50% BLUE, 50% RED). Shuffle them to ensure anonymity.  
  - **Fairness**: Let students inspect sealed envelopes pre-game to trust the process.  
  - **Key Insight**: Highlight the **fixed past** (prediction) vs. **conditional future** (what-if). EDT conflates correlation with fate; CDT severs the link.  
  - **Clincher**: Ask *"If you could redo this, would you change your reasoning?"* to expose the conflict.

  By confronting the Oracle, students experience the paradox viscerally—setting the stage for deep theory discussion. Good luck!
