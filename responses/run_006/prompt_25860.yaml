prompt: |-
  I'm in a metaethics course and we've been doing expressivism. I tried to reconstruct the Frege-Geach problem as a tight argument and now I'm worried I've made it look like expressivism is just obvioulsy impossible, which can't be right because smart people still defend it. Here's the argument:

  (1) According to expressivism, the meaning of a moral sentence like "Lying is wrong" is the non-cognitive attitude it expresses — say, disapproval of lying.
  (2) The meaning of a complex sentence is a function of the meanings of its parts (compositionality).
  (3) So in a conditional like "If lying is wrong, then getting your little brother to lie is wrong," the antecedent "lying is wrong" must have the same meaning it has when it stands alone.
  (4) Therefore the antecedent must express disapproval of lying, by (1) and (3).
  (5) But a speaker who utters the whole conditional does not thereby express disapproval of lying — they might be reasoning hypothetically, or exploring the consequences of a moral view they reject.
  (6) So expressivism predicts that the antecedent both does and does not express disapproval of lying, which is a contradiction.
  (7) Therefore expressivism is false.

  I know this can't be the end of the story because Blackburn, Gibbard, and others have been working on this for decades. But I can't see which premise the expressivist should actually reject. Premise (2) seems non-negotiable — giving up compositionality is giving up on language working at all. Premise (1) is just what expressivism is. And premise (5) seems like a plain fact about how conditionals work. So where does this argument go wrong? If the expressivist has to reject one of these premises, tell me which one and what they have to give up to do it — and if the problem is something subtler (like an equivocation or a scope error I've baked into the way I've set it up), point that out instead. Please write the answer in British English.
reasoning: |-
  Okay, let me think through this carefully. The user presents a seemingly airtight Frege-Geach argument against expressivism and genuinely wants to understand where it fails, given that prominent philosophers still defend the view. 

  Hmm, I recall that the crux lies in how expressivists reinterpret compositionality. Premise (1) oversimplifies by equating meaning solely with expressed attitude - Blackburn and Gibbard actually distinguish between the mental state expressed and the propositional content projected. That's the key move: they decouple surface semantics from underlying psychology.

  Right, the conditional's antecedent doesn't express disapproval because its function shifts in embedded contexts. The expressivist would say we're confusing two things: what mental state the speaker actually has (disapproval) versus what mental state the sentence conventionally represents (the "forbid lying" commitment). In isolation these coincide, but in conditionals only the latter matters compositionally.

  Ah, and premise (5) is subtly misleading - it conflates expressing an attitude with displaying its inferential role. When someone says "if lying is wrong..." they're not approving/disapproving of lying but demonstrating how moral commitments interconnect. Blackburn's "quasi-realism" specifically addresses this by simulating propositional logic through attitude consistency relations.

  The user might be reassured to know that rejecting (1) doesn't abandon expressivism but refines it. Giving up direct attitude-expression in embeddings preserves compositionality without collapsing into realism. Gibbard's norm-expressivism handles this even better with plan-laden contents.

  What they need is to see that the "contradiction" vanishes once we separate psychological states from semantic values - a distinction the original argument blurs. I should emphasise how this maintains both linguistic systematicity and anti-realism.

  Also worth noting: the dialectic here shows why expressivism remains viable - not by denying obvious truths but by offering subtler implementations. The user's argument is valid against naive expressivism but not sophisticated versions.
answer: |-
  Your reconstruction is admirably clear and captures the core challenge for expressivism, but it does contain a subtle oversimplification that expressivists exploit. The weak link is **premise (1)** – not because it's fundamentally *wrong* about expressivism's core idea, but because it presents an **overly simplistic and context-insensitive account** of how moral sentences express attitudes. Expressivists like Simon Blackburn and Allan Gibbard don't reject compositionality (premise 2 is safe), and they agree with the observation in (5) about the speaker's attitude in conditionals. Their solution involves refining *how* expressivism understands meaning and attitude expression, particularly in embedded contexts.

  Here's the breakdown of where your argument oversimplifies and how expressivists respond:

  1.  **Rejecting Premise (1) as Stated:** Expressivists argue that premise (1) is only true for *freestanding*, *assertoric* uses of moral sentences. When "Lying is wrong" appears *embedded* within a complex sentence like a conditional, its *semantic function* changes, even though its *core expressive content* is still relevant. They distinguish:
      *   **The attitude expressed by the sentence-type in isolation (e.g., disapproval of lying).**
      *   **The semantic contribution the sentence makes within a complex linguistic context.** This contribution isn't the *actual expression* of the attitude by the *speaker*, but rather the *introduction of the relevant kind of commitment* or *the specification of the conditions under which attitudes are related*.

  2.  **The Expressivist Move: Higher-Order Attitudes or Commitment States:** Expressivists propose that complex sentences express **higher-order attitudes** or manage **commitments** concerning the lower-order attitudes expressed by their parts.
      *   **Blackburn's Quasi-Realism:** For Blackburn, the conditional "If lying is wrong, then getting your little brother to lie is wrong" doesn't express disapproval of lying. Instead, it expresses a **higher-order attitude**: *disapproval of combining disapproval of lying with a lack of disapproval of getting your little brother to lie*. The speaker is expressing a constraint on their own (or others') possible moral sensibilities. The meaning of the antecedent *contributes* the type of attitude (disapproval of lying) that this higher-order attitude governs.
      *   **Gibbard's Norm-Expressivism:** Gibbard analyses moral statements in terms of planning or accepting norms. "Lying is wrong" expresses acceptance of a norm forbidding lying. The conditional expresses a **constraint on planning**: It rules out planning or accepting a system of norms where lying is forbidden but getting your little brother to lie is permitted. The antecedent contributes the norm-acceptance state (forbidding lying) that this constraint applies to.

  3.  **Saving Compositionality (Premise 2):** Expressivists maintain compositionality by arguing that the meaning (semantic value) of a moral sentence in *any* context is **not simply the attitude it expresses assertorically**, but rather **a more abstract entity that determines its role in complex sentences**. This could be:
      *   The *type* of attitude or commitment it introduces (e.g., "disapproval-of-lying-type" or "norm-forbidding-lying-type").
      *   A function from contexts to attitudes or constraints.
      *   The set of mental states or normative systems that are consistent with accepting it (Gibbard).
      The complex sentence's meaning is then a function of these abstract contributions from its parts. The function for the conditional takes the abstract contributions of antecedent and consequent and outputs the higher-order attitude or planning constraint.

  4.  **Addressing Premise (5):** Expressivists wholeheartedly agree with (5). The speaker uttering the conditional *does not* express disapproval of lying. Their theory is designed *precisely* to account for this. The conditional expresses a *different* attitude (a higher-order disapproval or a planning constraint) *about* the disapproval of lying (or its absence) and the disapproval of getting one's brother to lie (or its absence). The *antecedent's contribution* is the *object* of this higher-order attitude, not the attitude expressed by the speaker at that moment.

  5.  **Resolving the Contradiction (6 & 7):** The apparent contradiction vanishes once we distinguish:
      *   **What the *sentence-type* "Lying is wrong" conventionally expresses in isolation:** Disapproval of lying (agrees with (1) for simple assertions).
      *   **What the *speaker* expresses when uttering the freestanding sentence:** Disapproval of lying.
      *   **The *semantic contribution* of the *embedded clause* "lying is wrong":** Introducing the relevant attitude-type/norm-state as the object for the higher-order attitude expressed by the conditional operator.
      *   **What the *speaker* expresses when uttering the *whole conditional*:** A higher-order attitude about combinations of attitudes (disapproving of disapproving lying while not disapproving of getting brother to lie), *not* disapproval of lying itself.
      The antecedent clause *semantically contributes* the attitude type (disapproval of lying) that the conditional operator works upon. This is consistent with its meaning in isolation. Crucially, this contribution *does not mean the speaker is expressing that attitude* when uttering the conditional. Premise (4) falsely assumes that the semantic contribution *in context* (the attitude-type) entails that the speaker *expresses* that attitude. The expressivist denies this leap.

  **In Summary:**

  *   **The Mistake:** Premise (1) presents a simplistic view of expression that doesn't account for how embedded clauses function. Premise (4) then incorrectly infers from the antecedent's semantic contribution (its "meaning part") that the speaker *must be expressing* the attitude when uttering the whole conditional. This ignores the expressivist's core claim about complex sentences expressing *higher-order attitudes*.
  *   **The Expressivist Solution:** They refine their theory by:
      1.  Distinguishing the semantic contribution of a clause (its abstract role, e.g., introducing an attitude-type) from the attitude expressed by the speaker uttering a whole sentence.
      2.  Analysing complex sentences (like conditionals) as expressing higher-order attitudes or managing commitments concerning the attitude-types contributed by their parts.
      3.  Maintaining compositionality by assigning moral clauses abstract semantic values (attitude-types, functions, sets of states) that complex operators can work on.
  *   **What They Give Up:** They give up the idea that the *only* thing moral sentences ever do is *directly express* a simple, non-cognitive attitude in every context. They accept that in embedded positions, they contribute something more abstract that builds towards the expression of a complex attitude by the whole sentence. They also give up the direct inference from "clause X contributes attitude-type A" to "speaker uttering a sentence containing X expresses A".

  **Why Smart People Still Defend It:** Because this refined version offers a coherent (though complex) account of moral language that preserves its distinctive action-guiding, non-descriptive character (anti-realism) while explaining its logical behaviour. They argue it avoids the metaphysical commitments of realism and provides a plausible psychological story. The Frege-Geach problem isn't a knock-down refutation but a *challenge* that forces expressivists to develop increasingly sophisticated semantic frameworks (like Blackburn's quasi-realism or Gibbard's plan-laden semantics). Whether these solutions are ultimately successful is still debated, but they are far from "obviously impossible". Your argument successfully exposes the *problem*, but sophisticated expressivism offers a *solution* by rejecting the overly simple version of (1) assumed in the inference to (4).
