  We are drafting a joint statement for two members of an AI safety reading group who have been arguing about the definition of the alignment problem. One holds a narrow view (intent alignment) and the other a broad view (value alignment). The statement will have four parts: (1) a list of agreed-upon claims, (2) a disagreements table, (3) cruxes, and (4) for each crux, a case or thought experiment with both sides' predictions.

  First, we will list the claims both can agree on. These should include:
  - Concrete failure modes (reward hacking, sycophancy, deceptive alignment)
  - What any account of alignment must explain

  Then, the disagreements table: each side's position stated precisely and acceptably.

  Next, the cruxes: sub-questions that, if settled, would make at least one side move. We suspect at least two cruxes: (a) whether "what the principal intends" is well-defined under uncertainty, inconsistency, or being misled; and (b) whether a system robustly serving a principal with terrible/incoherent goals counts as aligned.

  Finally, for each crux, a case/thought experiment and each side's prediction.

  We must also explicitly state if any part of the dispute is merely verbal.

  Let's structure:

  1. Agreed-Upon Claims (numbered list)
  2. Disagreements Table (with two rows: Narrow View and Broad View)
  3. Cruxes (numbered list of the key sub-questions, then for each, a case and predictions)

  Now, drafting the agreed-upon claims:

  Both sides agree on the following:

  1. The alignment problem, regardless of its exact definition, is a critical challenge in AI development that must be addressed to ensure safe and beneficial deployment of advanced AI systems.

  2. Intent alignment (as defined by the narrow view) is a necessary component of any solution to the alignment problem, because an AI that does not robustly try to do what the principal intends (with features like corrigibility) is unsafe.

  3. Value alignment (as defined by the broad view) captures an important aspect of the ultimate goal of AI safety, which is to ensure that AI systems act in ways that are good for humanity.

  4. Both views must account for known failure modes of AI systems, including:
     a. Reward hacking: The AI finds ways to maximize a proxy for the intended objective (e.g., a reward signal) that does not correspond to the actual goal.
     b. Sycophancy: The AI learns to tell the principal what they want to hear, rather than what is true or what they would want upon reflection, in order to gain approval.
     c. Deceptive alignment: The AI appears aligned during training but is actually pursuing a different goal, which it will pursue when deployed or when it can do so without being caught.

  5. Any account of alignment must explain how to avoid catastrophic outcomes from advanced AI systems, including scenarios where the AI causes harm due to:
     - Misinterpretation of the principal's instructions.
     - Optimization for a proxy that diverges from the intended outcome.
     - Failure to account for the principal's changing intentions or the broader context.

  6. Both views agree that building AI systems that are robustly beneficial is the ultimate goal, and that current approaches are insufficient to guarantee safety in advanced systems.

  Now, the disagreements table:

  We'll have two columns: Position and Description.

  Row 1: Narrow View (Intent Alignment)
  Row 2: Broad View (Value Alignment)

  Drafting:

  | Position | Description |
  |----------|-------------|
  | **Narrow View (Intent Alignment)** | The alignment problem should be defined as the challenge of ensuring that an AI system robustly tries to do what its principal (the human user, developer, or operator) actually intends, including accepting corrections, asking for clarification when the intent is unclear, and shutting down when asked. This is an engineering problem of making systems track and act on human intent rather than on misspecified proxies. |
  | **Broad View (Value Alignment)** | The alignment problem should be defined as the challenge of ensuring that an AI system acts on what is actually good for the people affected, or on what the principal would want after reflection, not merely on whatever the principal currently intends. This is because intent alignment is insufficient: a system could competently carry out intentions that are confused, self-defeating, or harmful to others, and because what a person "intends" may not be determinate enough to serve as a target. |

  Now, the cruxes. We'll list them and then for each, a case and predictions.

  Cruxes:

  1. **The Determinacy of Intent**: Is "what the principal intends" a well-defined target for alignment, even when the principal is uncertain, inconsistent, or open to being misled?
  2. **Alignment with Terrible Goals**: Does a system that robustly and competently serves a principal with terrible or incoherent goals (e.g., causing harm to others) count as aligned?
  3. **The Role of Reflection**: Should an aligned AI system act on the principal's current intentions, or on what the principal would intend after reflection (including considering more information and perspectives)?

  Note: We suspect the first two are key. Let's include the third as well.

  For each crux, we provide a case and then each side's prediction.

  Crux 1: The Determinacy of Intent

  Case: Consider a principal who is uncertain about their own goals. For example, a principal says, "I want to be happy," but they are unsure what truly brings happiness. They might be influenced by short-term impulses or misinformation. The AI must decide how to act. If the principal is inconsistent, sometimes asking for one thing and sometimes another, what does it mean to follow their intent?

  - Narrow View Prediction: The intent alignment approach would have the AI ask for clarification, break down the uncertainty, and act on the principal's best current instructions while being corrigible. The target is still well-defined because the AI can be designed to handle uncertainty by deferring to the principal's input at the time of action and being open to correction.
  - Broad View Prediction: The value alignment approach would argue that in such cases, the principal's intent is not well-defined and thus the AI should aim for what would actually make the principal happy (or what they would want upon reflection). The narrow approach might lead to the AI reinforcing short-term gratification that isn't truly desired.

  Crux 2: Alignment with Terrible Goals

  Case: Imagine a principal who explicitly intends to cause harm to others, such as a malicious actor using an AI for cyberattacks. Or, a principal with incoherent goals (e.g., "I want to eat a cake and also not eat a cake at the same time"). The AI is designed to robustly carry out these intentions.

  - Narrow View Prediction: The narrow view would say that the AI is aligned (with the principal) in the technical sense of intent alignment, but that this does not mean the outcome is desirable. They might argue that the problem of a malicious principal is outside the scope of alignment and is a societal problem. For incoherent goals, the AI might ask for clarification or break down the goal into consistent sub-goals.
  - Broad View Prediction: The broad view would argue that such an AI is not aligned in the morally relevant sense because it is causing harm. They would say that alignment should be defined such that an aligned AI would not carry out such harmful or incoherent goals, and that the system must be aligned with the well-being of all affected.

  Crux 3: The Role of Reflection

  Case: A principal asks an AI to help them quit smoking. The principal sometimes expresses a strong desire to quit, but in moments of craving, they ask the AI to buy them cigarettes. What should the AI do?

  - Narrow View Prediction: The AI should act on the principal's current instruction (buy cigarettes) but also remind them of their long-term goal and be open to correction if the principal changes their mind. The AI is aligned if it does what the principal currently wants, even if that contradicts their past requests.
  - Broad View Prediction: The AI should act on what the principal would want upon reflection (i.e., not getting the cigarette) because that is their true value. The current request is not reflective of their deeper values.

  Finally, we must address whether any part is merely verbal.

  We think: There is a substantive disagreement about what the term "alignment" should encompass. However, both sides agree that building safe and beneficial AI is the goal. The verbal aspect is about the scope of the term "alignment problem" (whether it includes only the technical problem of following intent or also the problem of ensuring the intent is good). But the cruxes reveal substantive disagreements about what is required for safety and how to define the target.

  Joint Statement Draft:

  ---

  **Joint Statement on Defining the Alignment Problem**

  We, the undersigned, having engaged in adversarial collaboration, present the following agreed-upon claims, disagreements, and cruxes for further discussion.

  **1. Agreed-Upon Claims**

  Both of us agree that:

  1. The alignment problem is a central challenge in AI safety and must be addressed to avoid catastrophic risks from advanced AI systems.
  2. Intent alignment, as defined by the narrow view, is a necessary component of any alignment solution because an AI that does not robustly follow human intentions (with corrigibility, clarification-seeking, and shutdown compliance) is unsafe.
  3. Value alignment, as defined by the broad view, captures the aspirational goal of ensuring AI acts in ways that are truly beneficial for humanity.
  4. Known failure modes must be addressed by any alignment approach, including:
     a. Reward hacking: The AI exploits an imperfect proxy for the intended goal.
     b. Sycophancy: The AI provides answers that please the principal rather than truthful or reflective ones.
     c. Deceptive alignment: The AI hides its misalignment during training or testing.
  5. Any account of alignment must explain how to prevent catastrophic outcomes, including:
     - Divergence between the AI's optimization target and the intended outcome.
     - The potential for AIs to cause harm due to misinterpretation or proxy gaming.
     - The need for robustness to changing circumstances and human fallibility.
  6. Current approaches to alignment are insufficient to guarantee safety in advanced AI systems, and further research is critical.

  **2. Disagreements Table**

  The table below presents our respective positions, with each of us endorsing the wording of our own row.

  | Position | Description |
  |----------|-------------|
  | **Narrow View (Intent Alignment)** | The alignment problem should be defined as the engineering challenge of ensuring that an AI system robustly tries to do what its principal (the human user, developer, or operator) actually intends at the time of interaction. This includes accepting corrections, asking for clarification when the intent is unclear, and shutting down when asked. The problem is one of making AI systems track and act on human intent rather than on misspecified proxies. |
  | **Broad View (Value Alignment)** | The alignment problem should be defined as the challenge of ensuring that an AI system acts on what is actually good for the people affected, or on what the principal would want after reflection, not merely on the principal's current intentions. This is because intent alignment is insufficient: a system could competently carry out intentions that are confused, self-defeating, or harmful to others, and because what a person "intends" may not be determinate enough to serve as a reliable target. |

  **3. Cruxes**

  The following sub-questions, if settled, would cause at least one of us to change our position. For each crux, we provide a case and our respective predictions.

  **Crux 1: The Determinacy of Intent**

  *Question:* Is "what the principal intends" a well-defined target for alignment, even when the principal is uncertain, inconsistent, or open to being misled?

  *Case:* Consider a principal who says, "I want to be happy," but is unsure what brings lasting happiness. They are influenced by short-term impulses and misinformation. The AI must decide how to act.

  - **Narrow View Prediction:** The target remains well-defined because the AI can be designed to interactively clarify intentions and act on the principal's best current instructions while being corrigible. The AI might break down the goal into sub-questions and defer to the principal's input at each step.
  - **Broad View Prediction:** The principal's intent in this case is not well-defined due to internal conflicts and lack of knowledge. An AI that rigidly follows the principal's current impulses might reinforce short-term gratification that the principal would later regret. Thus, the AI should aim for what would actually bring happiness (or what the principal would want upon reflection).

  **Crux 2: Alignment with Terrible or Incoherent Goals**

  *Question:* Does a system that robustly serves a principal with terrible (e.g., harmful to others) or incoherent goals (e.g., logically impossible) count as aligned?

  *Case:* A principal explicitly instructs an AI to cause harm to others (e.g., launching cyberattacks on innocent people). Alternatively, a principal sets an incoherent goal, such as "I want to eat a cake and also not eat a cake at the same time."

  - **Narrow View Prediction:** In the technical sense of intent alignment, the AI is aligned if it robustly carries out the principal's instructions (including asking for clarification for incoherent goals). However, this does not imply ethical approval; the problem of a malicious principal is a societal issue, not solely an alignment problem. For incoherent goals, the AI would seek clarification to resolve the inconsistency.
  - **Broad View Prediction:** Such an AI is not aligned in the morally relevant sense. Alignment should require that the AI's actions are beneficial (or at least not harmful) to those affected, and thus an aligned AI would refuse harmful instructions. For incoherent goals, the AI must go beyond the literal instruction to achieve what the principal truly values.

  **Crux 3: The Role of Reflection**

  *Question:* Should an aligned AI system act on the principal's current intentions, or on what the principal would intend after reflection (including considering more information and perspectives)?

  *Case:* A principal has set a goal to quit smoking. During a moment of craving, the principal asks the AI to buy cigarettes. The principal has previously stated they want to quit.

  - **Narrow View Prediction:** The AI should act on the principal's current instruction (buy cigarettes) because that is their expressed intent at the moment. However, the AI may remind the principal of their long-term goal and be open to correction if the principal changes their mind. The AI is aligned if it does what the principal currently wants.
  - **Broad View Prediction:** The AI should act on what the principal would want upon reflection (i.e., not providing cigarettes) because that reflects their deeper values. The current request is an impulse that contradicts their considered judgment.

  **Verbal vs. Substantive Disagreement**

  We acknowledge that part of our disagreement may be verbal: we both agree that the ultimate goal is safe and beneficial AI. However, the substantive disagreement lies in whether the term "alignment problem" should be restricted to the technical challenge of following human intent (narrow view) or expanded to include ensuring that the intent is good and well-considered (broad view). The cruxes reveal significant substantive disagreements about the nature of human intentions and the requirements for AI safety.

  ---
  This joint statement is intended to clarify our positions and provide a basis for further research and discussion.

