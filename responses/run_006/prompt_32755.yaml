  I need to recall Lewis's core framework: conventions as solutions to coordination problems with common knowledge of preferences. The user's cases challenge different aspects: case 1 tests accidental regularities, case 3 tests origins vs current function, case 4 questions whether a disliked norm still solves a coordination problem, case 5 probes group boundaries, and case 6 examines whether expectations are necessary.

