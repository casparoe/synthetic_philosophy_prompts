  First, I need to unpack why the two camps are stuck. The user suspects it's about different uses of "should." One side is giving a second-order, uncertainty-relative "should," while the other denies any external standpoint. The user also mentions possible underlying issues: intertheoretic comparability, fanaticism, or the uniqueness of rational verdicts.

  Looking deeper, the user's real struggle isn't just academic. They're facing life decisions—career, savings, helping strangers vs. loved ones. The paralysis here is personal and urgent. They need clarity to move forward, but the philosophical impasse is blocking them. Their unspoken need might be practical guidance amidst this theoretical chaos.

  The key disagreement is substantive and centers on whether rationality requires a single, overarching "should" for moral uncertainty. The formalist camp believes in a neutral framework for weighing theories, while the particularist camp sees this as impossible without a shared standard. This is a metaethical clash, not just technical.

  Fanaticism is a symptom, not the root. If a tiny credence in an extreme theory swamps others, it highlights the lack of a common scale. But the deeper issue is whether such a scale exists at all. The uniqueness question—whether rationality must give one answer—is tied to this. Formalists think yes; particularists accept that sometimes there's no single right answer.

  Progress won't come from more formal models. Instead, it requires tackling the metaethical question: Can there be a theory-neutral "should"? Particularists need to show why formal approaches fail inevitably, not just practically. Formalists must justify why their framework isn't just another moral claim. Distinguishing between structural rationality (consistency) and substantive moral truth might help, but it's thorny.

  For the user, this means accepting that philosophy might not resolve the deadlock soon. They might need a practical approach: perhaps using decision theory provisionally while staying aware of its limitations, or embracing moral dissonance without forcing a false unity. Their pain is real, but the answer lies in navigating uncertainty, not eliminating it.
answer: |-
  Your diagnosis is sharp and points to the heart of the impasse. I agree the disagreement is **substantive, not merely verbal**, and revolves around a **fundamental metaethical question about the nature and scope of practical rationality itself**. It's *not* primarily about comparability, fanaticism, or uniqueness in isolation. Those are symptoms or downstream consequences.

  **The Core Disagreement:**  
  **Does "rationality" (or "what you should do") under moral uncertainty require a single, second-order, theory-neutral decision procedure?**  

  1.  **The Formalist Camp (Maximize Expected Choiceworthiness - MEC):**  
      *   **What they say:** "Rational choice under uncertainty *always* requires maximizing expected value relative to your doxastic state. Moral uncertainty is just another form of uncertainty. Ignoring your credences in other plausible moral theories is epistemically irrational. Rationality provides a *structure* for managing uncertainty that is prior to, and binding upon, any particular substantive moral commitment."
      *   **Their "Should":** This is a **structural, procedural "should" of rationality-as-consistency**. It claims to stand outside first-order moral theories, providing a framework for adjudicating conflicts between them *given* the agent's credences. MacAskill, Bykvist, Ord, and Greaves argue this framework (even with refinements) is necessary for rationality. They see the lack of precise comparability as a *practical challenge* (solved by variance voting, range voting, etc.), not a *fatal objection*.

  2.  **The Particularist Camp ("My Favourite Theory" - MFT or "All-Things-Considered"):**  
      *   **What they say:** "There is no 'view from nowhere' for weighing moral theories. The 'should' of practical rationality *just is* the 'should' delivered by the correct (or your best) first-order moral theory. Attempting to weigh theories using a neutral procedure either (a) implicitly smuggles in a *particular* first-order moral commitment (e.g., consequentialism about decision procedures) or (b) relies on impossible intertheoretic comparisons. Rationality requires acting on what you believe is *actually right*, not a mathematical aggregation."
      *   **Their "Should":** This is a **substantive, first-order moral "should"**. They deny the existence or authority of a distinct, higher-order "should" of rationality that can adjudicate between fundamentally different moral frameworks. Hedden, Weatherson, and arguably Parfit (in spirit) lean here. For them, asking "What should I do, given my uncertainty?" collapses into "What does the best moral theory say I should do?" There is no extra, procedural layer.

  **Why Comparability, Fanaticism, and Uniqueness are Secondary:**

  *   **Comparability:** Formalists see it as a *technical hurdle* (solved by approximations) because they assume the *rational necessity* of aggregation. Particularists see the *impossibility* of true comparability as *evidence* that the formalist project is incoherent – it tries to quantify the unquantifiable, mistaking rationality for arithmetic.
  *   **Fanaticism:** This is a *reductio* for the formalist approach in the eyes of particularists: "See? Your 'rational' procedure forces you to do something absurd based on a tiny credence!" Formalists see it as a *puzzle* to be solved within their framework (e.g., bounded utility functions, lexical thresholds) precisely *because* they are committed to the necessity of aggregation. Fanaticism highlights the *consequences* of their metaethical commitment, not its core.
  *   **Uniqueness:** Formalists *need* uniqueness to validate their procedural "should" as decisive. Particularists may accept that rationality under deep uncertainty *can* sometimes fail to yield a unique verdict ("tragic dilemmas"), which they see as more honest than forcing a false precision via MEC. Uniqueness is a *desideratum* for formalists and a potential *stumbling block* for particularists, but not the core issue.

  **My Committed Diagnosis:** The **primary substantive disagreement** is the metaethical one described above: **Does practical rationality, in the context of moral uncertainty, demand a unique, second-order, procedural decision rule that operates across first-order moral theories?** Formalists say **yes**, grounding this in a universal conception of rational choice under uncertainty. Particularists say **no**, grounding rationality entirely within the first-order moral domain.

  **What Counts as Progress?**  
  Given this diagnosis, progress is difficult but possible:

  1.  **Clarifying the Metaethical Stakes:** Explicitly framing the debate around the *nature of rationality* rather than technical fixes. Formalists need to robustly defend the existence and authority of a theory-neutral procedural "should." Particularists need to explain *why* rationality can't extend beyond the first-order "should" without collapsing into incoherence or question-begging.
      *   *Progress would look like:* A compelling argument showing either (a) why structural rationality *must* include an uncertainty-relative procedure for moral theories (beyond just empirical uncertainty), or (b) why any such procedure inevitably depends on substantive moral assumptions, making it non-neutral.

  2.  **Tackling the "Smuggling" Charge Head-On:** Particularists often charge that MEC (especially utilitarian versions) smuggles in consequentialism at the meta-level. Formalists need to either:
      *   *Defend Neutrality:* Show how their framework genuinely doesn't presuppose a specific moral outcome (e.g., variance voting as a non-consequentialist aggregation method?).
      *   *Embrace Non-Neutrality:* Argue that the procedural "should" *is* a substantive but necessary meta-principle of rationality. This concedes ground but clarifies the nature of the disagreement.
      *   *Progress would look like:* Either a demonstrably non-question-begging formal framework, or a clear admission that the procedural "should" *is* a substantive commitment, shifting the debate to arguing for/against *that specific meta-principle*.

  3.  **Exploring Alternatives to "Should":** Perhaps the language of a unique, decisive "should" is part of the problem. Progress might involve developing frameworks for *managing* deep moral uncertainty that don't pretend to yield a single rational verdict, focusing instead on:
      *   Deliberative strategies (avoiding the worst, seeking overlap, building moral understanding).
      *   Acknowledging "moral remainders" – the sense that whichever choice you make, something of moral significance is lost.
      *   *Progress would look like:* A sophisticated account of rational *deliberation* and *agency* under deep moral uncertainty that doesn't rely on finding *the* optimal act, offering practical guidance without claiming a unique procedural "should."

  **Why No Quick Progress Should Be Expected:**  
  The disagreement cuts too deep. It reflects a fundamental schism in understanding practical reason: Is rationality primarily about *internal consistency of belief and desire* (formalists), or about *correctly apprehending and responding to normative reasons* (particularists)? Resolving *this* schism is a core, perennial task of philosophy, unlikely to be settled soon. Technical refinements (parliamentary models, fanaticism fixes) are valuable but treat symptoms; they don't address the underlying metaethical wound.

  **Your Path Forward (Practically):**  
  Acknowledge the philosophical stalemate. Given the depth of the split, neither approach commands universal rational assent. Your choice between MEC and MFT is itself a *moral* choice reflecting your stance on the nature of rationality. Consider:

  *   **Procedural Leaning:** If the *process* of weighing your credences feels crucial, provisionally adopt a MEC-inspired approach (e.g., range voting on core values) while being acutely aware of its limitations and the "smuggling" risk. Treat it as a deliberative tool, not an oracle.
  *   **Substantive Leaning:** If your core conviction is that morality is about getting the *answer* right, focus on rigorously defending your "best all-things-considered" theory. Accept that this might mean discounting theories you have credence in but deem fundamentally flawed in their structure.
  *   **Beyond the Binary:** Explore whether your two outlooks share any common ground or constraints. Can you act in ways that are *permissible* (or not *egregiously wrong*) on *both* views, even if not optimal on either? Can you sequence actions over time to honor different values? Can you "split the difference" in a meaningful way (e.g., dedicate 70% of resources to impartial causes, 30% to relationships)?

  The pain of your uncertainty is real, reflecting the profound difficulty of integrating fundamentally different ways of seeing the moral world. Philosophy provides frameworks for understanding the impasse but cannot, from its current vantage point, definitively resolve it for you. Your task becomes one of authentic commitment amidst irreducible complexity.
