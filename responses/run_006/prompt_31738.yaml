prompt: |-
  I've been puzzling over something I've observed across several different settings — hiring committees, online forums, and even casual decisions among friends — and I'm hoping there's a name and a literature for it, because my own attempts to look it up keep landing on concepts that are close but not quite right.

  Here are three instances. First: an eight-person hiring committee interviews five candidates. Everyone has read the same files, but each member also has private impressions from the interviews. The chair calls on people in a fixed order. The first two speakers express a preference for candidate A and give reasons. The third speaker, who privately preferred candidate B, says something like "I can see the case for A, and I don't feel strongly enough about B to push against the emerging consensus." By the time the fourth person speaks, the room is treating A as the settled choice. Later, I learn that five of the eight members privately preferred B, but each of the later speakers assumed the earlier ones must have had more compelling reasons, and their own doubts seemed insufficient to overturn what looked like a rational consensus. Second: an online forum for a niche hobby is discussing which brand of equipment is most reliable. The first three commenters recommend Brand X, citing various experiences. The fourth commenter has had terrible experiences with X but writes, "I might have just gotten a lemon, but for what it's worth I had issues with X." The comment is ignored. The thread solidifies around X. A year later, a survey reveals that a majority of the forum's members actually prefer Brand Y, but the archived threads overwhelmingly recommend X. Third: a group of friends is deciding where to eat. Three people immediately suggest a new Italian place. The fourth person, who ate there last week and found it mediocre, stays quiet, reasoning that the others must know something she doesn't — maybe she went on an off night. The group goes to the Italian place, and four people are quietly disappointed.

  What these cases seem to have in common: a group needs to make a decision; individuals have private information that, if aggregated, would point one way; but the sequential or semi-sequential nature of the discussion causes the group to converge on a different answer, because later participants rationally discount their own information in light of the expressed views of earlier participants. And this happens without intimidation, without anyone being irrational, and without anyone being insincere. I've looked at concepts like groupthink, the bandwagon effect, and pluralistic ignorance, but none of them captures the mechanism. Groupthink involves pressure to conform and a desire for group cohesion, which isn't driving these cases. The bandwagon effect is about wanting to be on the winning side, not about rationally inferring that others know more. Pluralistic ignorance is about everyone privately rejecting a norm while believing everyone else accepts it, which is different from everyone privately holding corrective information that gets lost in the sequence of discussion.

  Is there an established term for this specific phenomenon — the rational but self-defeating discounting of private information in sequential group decision-making? And if there is, what does the literature say about the conditions under which it produces errors rather than improving decisions? If there isn't a single term, what are the closest concepts, and how exactly does what I'm describing differ from each? I'm not satisfied with a bare label; I want to understand the boundaries of the phenomenon and whether the three cases I've given are really the same thing or different things that happen to look similar.
reasoning: |-
  Okay, the user has described three scenarios where group decisions go wrong despite members having private information that could lead to a better outcome. They've already ruled out groupthink, bandwagon effect, and pluralistic ignorance. I need to figure out what concept fits their description.

  First, the common thread: sequential sharing where later individuals suppress their private info because they assume earlier speakers had better reasons. It's a rational process based on inference, not social pressure. The key is the aggregation failure in sequential settings. 

  I recall information cascades from economics. That's when people ignore their own signals because they interpret others' actions as more informed. The hiring committee example is textbook: each member assumes prior speakers had compelling reasons, but actually, they just followed the trend. The forum and dinner cases show similar patterns. 

  But let me double-check if cascades fit perfectly. The user emphasized rationality—people aren't conforming due to pressure but due to Bayesian updating. Cascades cover that. Also, the conditions match: sequential decisions, binary choices (A/B, X/Y, Italian/not), and limited observation of predecessors' actions. 

  Now, about related concepts. Abilene Paradox involves miscommunication leading to decisions no one wants—similar outcome but different mechanism. Spiral of silence is about fear of isolation, which isn't present here. So cascades are the best fit. 

  The user also asked about conditions for errors. Cascades are fragile; they happen when early signals are wrong or unrepresentative. They're more likely in ambiguous situations with high uncertainty. The literature suggests solutions like simultaneous disclosure or anonymous input. 

  I should note that cascades can be beneficial if early signals are correct. But in the user's cases, they led to errors. The key factors are the order of speaking and the weight given to public vs. private information. 

  Finally, the three examples are indeed the same phenomenon. The mechanism is identical across them. I'll make sure to explain the boundaries clearly, distinguishing cascades from other effects they've already considered.
answer: |-
  Based on your detailed description and analysis, the phenomenon you're observing is most precisely captured by **Information Cascades** within the field of **social learning theory** (primarily in economics and behavioral science). Your cases are textbook examples, and your intuition about the mechanism—rational discounting of private signals in sequential settings—is exactly the core concept.

  ### Why Information Cascades Fit Perfectly
  1.  **Sequential Decision-Making:** Individuals make choices or express opinions one after another, observing predecessors' actions but not their *private reasons*.
  2.  **Rational Discounting:** Individuals rationally infer that predecessors acted based on *superior private information*. If predecessors' actions suggest a consensus, later individuals may override their own conflicting private signals, believing the group's signal is stronger.
  3.  **Self-Reinforcing but Potentially Wrong Consensus:** Once a few early individuals express a view, it can cascade, leading the group to converge on an option—even if the *aggregate private information* points elsewhere. The cascade is "fragile" – based on early, potentially unrepresentative signals.
  4.  **No Malice or Irrationality:** It arises purely from rational Bayesian updating under incomplete information, not social pressure, conformity desire, or fear. People are sincere but misinterpret the informational landscape.

  ### How it Differs from Your Rejected Concepts
  *   **Groupthink:** Involves *social pressure* for harmony, suppression of dissent to avoid conflict, and often irrational devaluation of alternatives. Your cases lack pressure; individuals rationally update beliefs based on perceived informational signals.
  *   **Bandwagon Effect:** Driven by a *desire to belong* to the perceived winning/majority side for social or emotional reasons. Your cases involve *informational inference* ("They must know something I don't").
  *   **Pluralistic Ignorance:** Focuses on *norms* – individuals privately reject a norm but publicly conform because they (mistakenly) believe *everyone else* accepts it. Your cases are about *factual information/private signals* about the *best option* (Candidate B, Brand Y, different restaurant) being suppressed due to sequential information aggregation, not norm misperception.
  *   **Abilene Paradox:** A specific type of groupthink where miscommunication leads a group to choose an outcome *every single member privately dislikes* due to fear of rocking the boat. While your Italian restaurant case *could* fit Abilene, the core mechanism in all your cases is informational (cascade), not primarily about conflict avoidance (though it can be a minor factor). Abilene usually implies everyone knows the outcome is bad *before* the decision is finalized, but stays silent.

  ### Key Literature & Core Insights on Information Cascades
  1.  **Seminal Work:** The concept was formalized by economists Sushil Bikhchandani, David Hirshleifer, and Ivo Welch in their 1992 paper "**A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades**" (*Journal of Political Economy*). This is the foundational text.
  2.  **Core Mechanism:**
      *   Individuals have a private signal (e.g., "Candidate B seems strong," "Brand Y failed for me") about the true state of the world.
      *   They observe the *actions* (choices, expressed opinions) of predecessors but *not* their private signals or reasoning.
      *   Individuals rationally combine their private signal with the information inferred from predecessors' actions using Bayes' rule.
      *   After a certain point, the public information (actions of predecessors) swamps the private signal. Even someone with a strong private signal contradicting the trend may rationally ignore it, believing the crowd's signal is more likely correct. They "follow the herd" based on information, not whim. *This is the cascade.*
      *   Cascades can start very early (e.g., just 2-3 signals) and be wrong if early signals were unrepresentative or misinterpreted.
  3.  **Conditions Producing Errors (vs. Improvement):** Cascades are *more likely to lead to errors* when:
      *   **Private Signals are Weak/Noisy:** Individuals have low confidence in their own information.
      *   **Complexity/Ambiguity is High:** The decision is difficult; signals are hard to interpret.
      *   **Early Signals are Unrepresentative:** Due to bad luck or biased selection of who speaks first.
      *   **Observations are Limited:** People only see actions, not the strength or reasoning behind predecessors' choices.
      *   **Homogeneity:** Group members assume others have similar priors and information processing abilities (which may not be true).
      *   **Costs of Going Against the Herd are (Perceived as) High:** While not social pressure, if being wrong alone is worse than being wrong with the group, it amplifies cascades.
  4.  **Cascades Can Be Correct Too:** If early signals are accurate, cascades rapidly aggregate information and lead to the correct decision efficiently. The problem is their *fragility* to early errors.

  ### Boundaries & Are Your Cases the Same?
  *   **The Three Cases are Fundamentally the Same Phenomenon:** They all exhibit the core mechanism of sequential rational inference leading to private signal suppression and potentially erroneous aggregation. The settings (formal committee, online forum, casual friends) differ, but the *informational dynamics* are identical.
  *   **Key Boundary:** The cascade mechanism relies on **inference from observed actions in sequence**. If decisions are made simultaneously (e.g., secret ballot), or if all private information is fully shared and debated before opinions are formed, cascades are less likely. The sequential revelation is crucial.
  *   **Distinguishing from Similar Concepts:**
      *   **Spiral of Silence (Political Science/Comm):** Focuses on *fear of isolation* leading to suppression of *minority opinions* on *controversial public issues*. Your cases lack fear; it's rational inference about objective quality. The restaurant case has a slight overlap, but the mechanism differs.
      *   **Common Knowledge Effect (Group Psych):** Groups overweight information that is publicly known/shared *before* discussion begins, neglecting unique private information. This is related but distinct. Cascades happen *during* the sequential revelation process itself.
      *   **Path Dependence (History/Econ):** Broader concept where early events lock in a trajectory. Cascades are a specific micro-mechanism causing path dependence in group decisions.

  ### Mitigation Strategies (from Literature)
  *   **Simultaneous Revelation:** Collect private opinions/votes *before* any discussion (e.g., Delphi method, pre-meeting polls).
  *   **Anonymous Input:** Use anonymous voting or feedback tools to reduce the influence of observing predecessors.
  *   **Structured Devil's Advocacy/Random Order:** Assign roles to actively argue against the emerging consensus or randomize speaking order.
  *   **Emphasize Unique Information:** Leaders can explicitly ask for dissenting views or information not yet shared ("What haven't we heard yet?" "Does anyone have a different perspective?").
  *   **Increase Private Signal Strength/Independence:** Ensure members have access to diverse information sources and time to form independent judgments.

  In conclusion, **Information Cascades** are the established framework explaining your observations. The literature confirms that this rational process, inherent in sequential group decision-making, can systematically lead groups astray by causing valuable private information to be discounted or ignored, even without any irrationality or social pressure. Your cases are classic illustrations of this phenomenon.
