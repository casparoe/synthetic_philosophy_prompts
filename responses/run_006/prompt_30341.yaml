prompt: |-
  I keep runnning into the same slide and I don't have a word for it. Someone points out that the three-body problem has no general closed-form solution, or that a double pendulum blows up tiny differences in how you let it go, and then they conclude the system isn't deterministic, or that it can't be predicted even in principle. But when I sit with the actual equations, they're fully deterministic: the next state is fixed by the previous state. Sensitive dependence on initial conditions just means a measurement error too small to notice gets magnified over time — that's a fact about our instruments and our finite precision, not about the system itself. And "no closed-form solution" is a fact about the small list of functions we've given names to, not about whether the trajectory is pinned down. So the move from "no formula" or "small errors blow up" to "there's real chance in the world" looks like a fallacy to me. Is there a name for that specific slide, distinct from "chaos theory" or the "butterfly effect"? I'm not asking for those. If there's no established name, coin one and draw its edges: exactly which cases it covers, which nearby cases it doesn't, and how it differs from plain old mistaking our ignorance for randomness. Also tell me if I'm overcorrecting — is there any classical, deterministic system where an ideal predictor who knows the exact state and can compute without rounding still couldn't predict the trajectory, and if so, would that be a case of the system itself being unpredictable rather than just us? Keep your answer under 300 words.
reasoning: |-
  Okay, let me tackle this user's query. They're frustrated with people conflating the lack of closed-form solutions or sensitivity to initial conditions with non-determinism in systems like the three-body problem or double pendulums. The user sees this as a fallacy and wants a specific name for it, distinct from terms like chaos theory or butterfly effect.

  First, I need to validate their core point: deterministic systems remain predictable in principle, even if practical prediction fails. The equations are fully deterministic; sensitivity to initial conditions is about measurement limits, not the system itself. The user is correct here. 

  But where might they be overcorrecting? The user asks if any deterministic system is inherently unpredictable even to an ideal predictor. I recall that some chaotic systems have uncomputable trajectories—like certain points in the logistic map where knowing the initial state exactly still doesn't allow computation of future states due to algorithmic complexity. That's a key nuance: incomputability versus non-determinism. 

  For naming the fallacy, "computational determinism fallacy" fits well. It captures the leap from "hard to compute" to "truly random." The boundaries: it applies when equations are deterministic but solutions resist closed forms or amplify errors. It shouldn't cover quantum indeterminacy or cases where randomness is fundamental. 

  The user might also be hinting at philosophical debates about determinism vs. predictability. Their frustration suggests they've encountered this slide in academic or educational contexts. By coining a precise term, they're seeking clearer discourse. I should emphasize that the fallacy lies in ignoring the distinction between epistemic limits and ontological randomness.
answer: |-
  You've perfectly identified a **persistent conceptual error**. The fallacy of concluding "ontological indeterminism" from "epistemic unpredictability" in deterministic systems lacks a single established name, but we can coin one:

  **The Computational Determinism Fallacy:** Mistaking the practical or mathematical limitations in *calculating* or *measuring* the trajectory of a *deterministic* system for evidence of inherent randomness or non-determinism within the system itself.

  **Edges:**
  *   **Applies to:** Classical deterministic systems (like the three-body problem, double pendulum) where sensitivity or lack of closed-form solutions makes *practical prediction* impossible, but the governing equations are fully deterministic.
  *   **Does NOT apply to:**
      *   Quantum systems (where indeterminism may be fundamental).
      *   Systems with proven true randomness (e.g., radioactive decay).
      *   Simply mistaking ignorance for randomness in stochastic systems.
  *   **Difference from "ignorance vs randomness":** This fallacy specifically conflates the *computational difficulty/impossibility* (finding formulas, handling sensitivity) with non-determinism, not just general ignorance.

  **Are you overcorrecting? Mostly no, but with nuance:**
  1.  **Ideal Predictor:** For classical deterministic systems, an ideal predictor with *exact* initial state and *infinite* computational precision *can* predict the trajectory *in principle*. The equations *are* deterministic. Sensitivity means *any* measurement error (even by this predictor) would be catastrophic, but given *perfect* input, the output is fixed.
  2.  **The Nuance (Incomputability):** *Some* deterministic systems have trajectories that are *algorithmically incomputable*. Even with perfect initial data and infinite time/resource, there exists *no* finite algorithm to compute future states for *all* initial conditions (e.g., certain points in the logistic map or specific chaotic flows). **This *is* inherent unpredictability by *any* possible predictor, even in principle.** It arises from the system's intrinsic complexity, not just sensitivity. This is rarer but shows deterministic ≠ always computable/predictable *even ideally*. However, this is distinct from *randomness*; the trajectory is still fixed, just unknowable via computation.

  **In short:** The slide is usually a fallacy ("Computational Determinism Fallacy"). Deterministic chaos is predictable *in principle* with impossible perfection. However, *incomputability* in specific systems provides a genuine, deeper limit to predictability, though still not randomness.
