prompt: |-
  I'm a curator at a mid-sized contemporary art museum, and we're overhalling our acquisition process. We've been burned — buying pieces that critics loved for five years then everyone decided were mediocre, and passing on things that later turned out to be important. I've read that Hume had this idea of a standard of taste: that even though judgments of beauty are subjective, the verdicts of ideal critics (people with delicacy of taste, practice, comparison, good sense, and freedom from prejudice) converge over time. Turn that into an actual acquisition procedure my committee can follow. Step-by-step: what questions to ask, what evidence to gather, where the procedure stops and says "wait and see," and where it hands off to a human judgment call. Be honest about which steps are just Hume's aesthetics dressed up as procedure and which are real operationalizations. Then run it on two hypothetical acquisitions: a technically brilliant but emotionally cold video installation by a young artist, and a painterly but derivative canvas by an artist in their 70s who's been overlooked their whole career.
reasoning: |-
  Okay, the user is a curator at a mid-sized contemporary art museum looking to overhaul their acquisition process. They've faced issues with buying pieces that lost critical favor over time and missing out on important works. They referenced Hume's idea of a "standard of taste" involving ideal critics. The challenge is to turn this philosophical concept into a practical, step-by-step acquisition procedure.

  First, I need to break down Hume's criteria for an ideal critic: delicacy of taste, practice, comparison, good sense, and freedom from prejudice. How can these be operationalized in a museum setting? The committee needs concrete steps to evaluate artworks, not just theoretical ideas. 

  The user wants a clear procedure with specific questions, evidence gathering, decision points, and where human judgment comes in. They also want honesty about what parts are directly from Hume versus practical adaptations. Then, applying it to two hypothetical cases: a technically brilliant but emotionally cold video by a young artist, and a painterly but derivative work by an overlooked older artist.

  I should start by mapping each Humean criterion to actionable steps. For delicacy of taste, that could involve sensory analysis and detailed documentation. Practice might require expert consultations and reviewing the artist's history. Comparison would involve contextualizing the work within art history and current trends. Good sense ties into thematic coherence and narrative, while freedom from prejudice needs bias checks and diverse perspectives.

  The procedure needs stages: initial assessment, evidence gathering, committee evaluation, and decision-making. Incorporating "wait and see" points is crucial where consensus isn't reached or risks are high. Also, identifying where human judgment is irreplaceable, like interpreting emotional resonance or historical significance.

  For the hypotheticals, the video installation's technical skill vs. emotional coldness raises questions about lasting impact versus current trends. The older artist's work being derivative yet overlooked involves reassessing historical context and potential reevaluation. Testing the procedure on these cases will highlight its strengths and limitations.

  Deep needs: The museum likely wants to balance prestige with collection longevity, avoid past mistakes, and justify acquisitions to stakeholders. They need a transparent process that mitigates subjective biases while acknowledging that art valuation isn't purely objective. The unspoken need might be for a defensible, systematic approach that still allows for curatorial intuition, especially in a field where trends shift rapidly.
answer: |-
  Here’s a step-by-step acquisition procedure based on Hume’s "standard of taste," designed to mitigate past mistakes. I'll flag Humean elements (**H**), operational steps (**O**), "wait and see" triggers (**W**), and human judgment calls (**J**). The procedure balances philosophical rigor with museum realities.

  ---

  ### **Humean Acquisition Procedure**
  #### **Phase 1: Preliminary Screening (Humean Criteria Setup)**
  1. **Declare Biases**  
     - *Question:* "What personal/cultural biases might affect our view of this work?"  
     - *Evidence:* Committee members submit written bias disclosures (e.g., aversion to digital art, affinity for underdog narratives).  
     - **H**: Freedom from prejudice operationalized.  
     - **J**: Final bias assessment requires honest self-reflection.  

  2. **Assess Artist/Work Against Hume’s "Ideal Critic" Traits**  
     - *Questions:*  
       - *Delicacy:* "Does the work reward sustained attention? What subtle details emerge?"  
       - *Practice:* "Is the artist technically proficient? (Review CV, past exhibitions, conservation report)"  
       - *Comparison:* "How does this work *meaningfully* engage with art history/contemporary discourse?"  
       - *Good Sense:* "Does it cohere conceptually? Is its message intelligible without being trite?"  
     - *Evidence:* Technical analysis, comparables list (similar artists/works), artist interviews.  
     - **H**: Direct application of Hume’s criteria.  
     - **O**: Use external conservators for technical reports; hire art historian for comparables.  

  #### **Phase 2: External Validation (Imitating Hume’s "Convergence")**  
  3. **Seek "Ideal Critic" Consensus**  
     - *Questions:* "Which critics/curators embody Hume’s traits? Do their views converge?"  
     - *Evidence:*  
       - Gather 5+ reviews from critics with 10+ years of specialization.  
       - Poll 3 senior curators from peer institutions (blind survey).  
       - Track gallery/institutional acquisition history (e.g., "Did MoMA/Serpentine pass? Why?").  
     - **W**: If reviews diverge wildly (>70% disagreement), flag for reassessment in 12 months.  
     - **O**: Use weighted scoring for critic credibility (experience + track record).  

  4. **Test Against Time**  
     - *Question:* "Has this work/artist maintained relevance beyond trend cycles?"  
     - *Evidence:*  
       - For emerging artists: Show history (>3 major shows in 5 years).  
       - For mid-career+: Auction results over 10 years, inclusion in academic syllabi.  
     - **W**: For artists <35 years old with <5-year exposure, auto-trigger 2-year "wait and see" period.  

  #### **Phase 3: Committee Deliberation (Human Judgment)**
  5. **Humean Debate**  
     - *Questions:*  
       - "Does disagreement stem from *reasonable* differences in delicacy (e.g., sensory preferences) or *prejudice*?"  
       - "Will this work expand our collection’s narrative without duplicating strengths?"  
     - *Evidence:* Collection gap analysis, visitor studies on similar works.  
     - **J**: Final vote requires supermajority (⅔) if external validation is weak.  

  6. **The "Mediocrity" Safeguard**  
     - *Question:* "Is there any risk this is 'fashionable but shallow'?"  
     - *Evidence:* Compare to past acquisitions that declined in reputation.  
     - **O**: Use AI tools (e.g., GPT art historical analysis) to flag derivative elements.  
     - **W**: If "yes," require 3+ dissenting critics to champion the work for override.  

  ---

  ### **Hyphetical Case Studies**
  #### **Case 1: Technically Brilliant but Emotionally Cold Video Installation (Young Artist)**  
  - **Preliminary Screening**:  
    - *Delicacy*: High (intricate code, 8K resolution).  
    - *Practice*: Medium (3 solo shows, but all recent).  
    - *Comparison*: Strong (extends Nam June Paik’s legacy).  
    - *Good Sense*: Low (concept: "alienation via AI" feels overfamiliar).  
  - **External Validation**:  
    - Critics: Tech-focused reviewers praise; traditionalists dismiss as "soulless." Divergence = **W trigger**.  
    - Time Test: Fails (artist only 28, career <4 years) → **Auto-wait 2 years**.  
  - **Outcome**: **Defer acquisition**. Revisit if critical convergence occurs post-"wait" period.  

  #### **Case 2: Painterly but Derivative Canvas (Overlooked 70 y/o Artist)**  
  - **Preliminary Screening**:  
    - *Delicacy*: Medium (rich texture, but palette mimics Diebenkorn).  
    - *Practice*: High (50+ years of output, archival stability confirmed).  
    - *Comparison*: Low (adds nothing to feminist abstraction discourse).  
    - *Good Sense*: Medium (theme: "memory" coherent but unoriginal).  
  - **External Validation**:  
    - Critics: Minor reappraisal by 2 feminist art historians; mainstream silence.  
    - Time Test: High relevance risk (market ignored for decades → why now?).  
  - **Committee Deliberation**:  
    - Bias check: "Rescue narrative" prejudice noted.  
    - Gap analysis: Fills "underrepresented 1970s female abstractionists" gap.  
  - **Outcome**: **Conditional acquisition** (⅔ vote). Requires:  
    - Curatorial essay recontextualizing derivative elements as "radical quietism."  
    - Commitment to display alongside Diebenkorn to highlight contrasts.  

  ---

  ### **Key Takeaways**  
  - **Hume’s Limits**: His "ideal critic" is mythical. This procedure *approximates* it via aggregated expertise but can’t guarantee timeless taste.  
  - **Operational Wins**: Bias declarations, weighted external validation, and "wait" triggers reduce impulsive decisions.  
  - **Human Judgment**: Crucial at final vote when data conflicts (e.g., Case 2’s historical gap vs. derivativeness).  
  - **Reality Check**: No procedure prevents all errors, but this systematizes *why* you acquired something—making future deaccessioning more defensible.  

  > "We’re not buying eternity; we’re betting on consensus. Hume gives us the criteria to bet wisely." — Adapt this mantra for committee buy-in.
