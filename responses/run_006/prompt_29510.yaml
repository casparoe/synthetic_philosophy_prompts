  Hmm, the user's context is important here. They're dealing with real-world school incentives where failed schemes damage credibility, but they lack resources for data collection. Their explicit need is a structured evaluation method, but deeper needs include preserving trust in the council and avoiding unintended consequences like gaming behaviors. They've smartly identified Goodhart's law as relevant but need it operationalized.

  Right, I'll design a two-stage procedure: Stage 1 for quick viability checks (goal alignment, resources), Stage 2 for gaming risk assessment (metric flaws, loopholes). Key questions will probe measurement validity, effort substitution, and unintended consequences. Crucially, I'll flag which steps are judgment calls - like weighing partial metrics - rather than pretending it's purely objective.

  For the worked examples: 
  - Reading time app (a) clearly fails due to easy falsification and distraction from actual reading. 
  - Litter reporting (b) gets rejected because it incentivizes under-reporting. 
  - Charity fundraising (c) is approved with caveats - it's imperfect but gaming aligns with the goal. This deliberately includes an "unwelcome" outcome where we accept a gameable metric when alternatives are worse.

  The limitations section will be upfront: the tool can't eliminate all risks, especially with clever gaming or when metrics are unavoidably partial. It's about reducing failure likelihood, not guaranteeing success. British English terms like "form class" and "house points" will be used throughout.

  The challenge is balancing rigor with practicality - keeping it under one hour while covering critical risks. The decision flow must have clear off-ramps (reject/revise) but also indicate when human judgment is needed. For instance, whether to proceed with a partially aligned metric depends on values about acceptable trade-offs.
answer: |-
  Below is a practical screening procedure based on Goodhart's Law and specification gaming risks, designed for your subcommittee. It follows a two-stage flow: **Stage 1** eliminates non-viable proposals quickly; **Stage 2** assesses gaming risks. Each step includes **key questions**, **red flags**, **decision points**, and explicit **judgement calls**.

  ---

  ### **Incentive Scheme Screening Procedure**  
  *(Based on Goodhart's Law & Specification Gaming Risks)*  

  **STAGE 1: VIABILITY CHECK** (10 mins)  
  *Goal: Weed out proposals with fundamental flaws.*  

  1. **Goal Clarity**  
     - *Question:* What specific outcome does this scheme aim to improve? (e.g., "increase reading comprehension" vs. "increase reading time").  
     - *Red Flag:* Vague/absent outcome (e.g., "promote kindness").  
     - *Decision:* Reject if no clear outcome.  

  2. **Metric-Outcome Link**  
     - *Question:* How directly does the rewarded metric (e.g., "books logged") track the true goal (e.g., "reading skills")?  
     - *Red Flag:* Metric is easily measurable but weakly linked to the outcome (e.g., "litter *reports*" vs. "actual litter reduction").  
     - *Decision:* Reject if link is *very* weak (e.g., rewarding "attendance" for "mental wellbeing").  
     - *Judgement Call:* "Weak" vs. "acceptable" link.  

  3. **Resource Feasibility**  
     - *Question:* Can staff/pupils realistically implement this without excessive time or cost?  
     - *Red Flag:* Requires new software, daily audits, or significant staff oversight.  
     - *Decision:* Reject if unmanageable.  

  **STAGE 2: GAMING RISK ASSESSMENT** (40 mins)  
  *Goal: Predict and mitigate specification gaming.*  

  4. **Measurement Flaws**  
     - *Question:* Can participants falsify or inflate the metric *without* contributing to the goal?  
       - *Sub-questions:* Is verification possible? How easy is cheating? (e.g., Can pupils log reading without reading?)  
     - *Red Flag:* Self-reported data with no verification.  
     - *Decision:* Reject if gaming is trivial and undetectable.  

  5. **Effort Substitution**  
     - *Question:* Could participants "hit the target" by diverting effort from related valuable activities?  
       - *Example:* Pupils clean *only* their form room but litter elsewhere.  
     - *Red Flag:* Metric narrows focus to the exclusion of broader goals.  
     - *Decision:* Revise if scope is too narrow (e.g., reward "whole-school cleanliness").  

  6. **Unintended Consequences**  
     - *Question:* What harmful behaviours might this incentivise?  
       - *Sub-questions:* Could it encourage sabotage? Reduce intrinsic motivation? Create unfairness?  
     - *Red Flag:* Competition breeds hostility (e.g., rivals hiding litter in other form rooms).  
     - *Decision:* Reject if risks outweigh benefits.  

  7. **Partial Metrics & Hard Cases**  
     - *Question (if metric is imperfect):* Is this the *least gameable* way to track the goal? Would having *no scheme* be worse?  
     - *Judgement Call:* Weigh gaming risk against potential gains. Accept if:  
       - Gaming still partly serves the goal (e.g., fundraising gaming = more money).  
       - No better metric exists, and the goal is critical.  

  **OUTPUT** (10 mins):  
  - **Recommend** if all Stages passed.  
  - **Revise & Resubmit** if fixable (e.g., narrow metrics, verification gaps).  
  - **Reject** if fundamental flaws or high gaming risk.  

  **LIMITATIONS:**  
  - Cannot prevent *novel* gaming methods.  
  - Cannot assess *quantitative* impact (e.g., "Will reading *actually* improve 10%?").  
  - Values-based decisions (e.g., "Is competition desirable?") require human judgement.  

  ---

  ### **Worked Examples**  
  *(Using British English spellings & terms)*  

  **Proposal (a): House points for every 20 mins of independent reading logged in an app.**  
  - **Stage 1:**  
    - Goal: Improve reading skills. Metric: Reading time. Link: **Weak** (time ≠ comprehension).  
    - Feasibility: Moderate (requires app access).  
  - **Stage 2:**  
    - *Measurement Flaws:* Pupils can log time without reading (e.g., app open while gaming). **Red flag.**  
    - *Effort Substitution:* Pupils may prioritise speed-reading over depth.  
    - *Unintended Consequences:* Punishes slow readers; may reduce reading enjoyment.  
  - **Verdict: REJECT.** Metric is easily gamed and poorly linked to goal.  

  **Proposal (b): Weekly prize for the form class reporting least litter in/around its form room.**  
  - **Stage 1:**  
    - Goal: Reduce litter. Metric: Litter reports. Link: **Very weak** (reports ≠ actual litter; may track *reporting* not *cleanliness*).  
  - **Stage 2:**  
    - *Measurement Flaws:* Classes under-report to win. No verification = **critical red flag.**  
    - *Effort Substitution:* Pupils hide litter in rival areas (e.g., loos or playground).  
    - *Unintended Consequences:* Sabotage; normalises lying.  
  - **Verdict: REJECT.** Fundamental mismatch between metric and goal. Gaming is inevitable and harmful.  

  **Proposal (c): Certificates + trip for the form raising most money in the charity drive.**  
  - **Stage 1:**  
    - Goal: Maximise charity funds. Metric: Funds raised. Link: **Direct.**  
    - Feasibility: High (uses existing drive).  
  - **Stage 2:**  
    - *Measurement Flaws:* Pupils could use own money (not fundraising) or pressure donors. **Moderate risk** but verifiable (track sources).  
    - *Effort Substitution:* Focus on fundraising over other charity activities (e.g., volunteering).  
    - *Unintended Consequences:* Inequality (wealthy pupils advantage); burnout.  
  - **Hard Case Handling:**  
    - Gaming (e.g., self-donation) still serves the goal (more funds).  
    - No perfect metric exists; no scheme = lower donations.  
  - **Verdict: RECOMMEND WITH CAVEATS**  
    - *Mitigations:* Require fundraising events (not self-donation); cap individual contributions.  
    - *Unwelcome Conclusion:* We accept gaming risk because the goal (charity income) justifies it, and alternatives are worse.  

  ---

  ### **What the Procedure Cannot Catch**  
  1. **Sophisticated gaming:** e.g., pupils colluding to exploit loopholes unseen by the committee.  
  2. **Erosion of intrinsic motivation:** e.g., pupils who once read for pleasure now *only* read for points.  
  3. **Long-term unintended effects:** e.g., a "cleanest room" prize may improve short-term tidiness but teach that cleanliness is only for rewards.  
  4. **Contextual flaws:** e.g., a reading app may worsen digital inequality if not all pupils have devices.  

  **Final Advice:** Pair this tool with a "sunset clause" for all schemes (e.g., automatic review after one term). Document predictions ("We expect pupils might fake reading logs") and compare them to outcomes. This turns every proposal into a learning opportunity – even when schemes fail.
