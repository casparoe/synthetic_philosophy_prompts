prompt: |-
  So my dad got diagnosed with early-onset Alzheimers last year, and I've been trying to figure out whether "he" is still going to be there as the memories go. My friend has read a ton of this stuff and she's weirdly consistent when I throw cases at her. Her track record so far:

  - Regular teletransporter (scan, destroy the body, rebuild an exact copy on Mars with all your memories, plans, quirks): she says you survive, no problem, it's basically a very expensive flight.
  - Whole-brain transplant into a different body: survives.
  - All your neurons gradually swapped out over ten years for artificial ones that do the same job: survives.
  - Total memory wipe and personality reset, but the same body and brain keep ticking: she says no, whatever mattered about you is gone.

  Now I found out the teletransporter company has a "safe mode" where the Mars copy is switched on three minutes before they destroy the Earth body, so for three minutes there are two of you walking around with the same memories. Then the Earth version is painlessly destroyed. I haven't asked her about this one yet.

  What should I expect her to say if she's being consistent? I can see at least a couple rules that fit all four of her earlier verdicts, and they come apart on the safe-mode case. Can you lay out the rules she might be running, what each one says about safe mode, which one you'd bet she's actually using and why, and what further case would seperate the rules her answer leaves open?
