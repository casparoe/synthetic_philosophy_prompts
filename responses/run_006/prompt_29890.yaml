  Okay, the user is a director of a health and social care commissioning board in England. They need a practical decision procedure based on prioritarianism that their team can use in monthly meetings. The key requirements are: it must avoid levelling down, separate factual and value judgements, work without numerical well-being scales, and be explainable to non-philosophers. 

  Hmm, the user clearly wants ethical rigour but also operational practicality. The levelling-down objection is a hard constraint - any procedure that allows making some worse off without benefiting others would violate core prioritarianism. The three test cases will be crucial for stress-testing.

  First, I need to design a step-by-step process that forces explicit separation of facts (how proposals change well-being) and values (how much priority to give worse-off groups). The "sufficient answer" thresholds must be clear enough for busy professionals to apply consistently. 

  For the non-numerical aspect... perhaps a comparative approach using categories like "significant deterioration" with defined thresholds? Staff will need concrete examples to calibrate what "moderate impact" means in their context. The value-weighting step is tricky - it requires pre-agreed societal preferences, which the board must define externally.

  The test cases: 
  (a) Levelling down must be rejected immediately at Step 2 - it fails the "no harm without benefit" rule. 
  (b) Unequal growth is interesting - it might pass if the worst-off gain sufficiently, forcing the board to accept some inequality. That'll be the unwelcome but necessary outcome. 
  (c) Priority transfer is straightforward with the given weights (3x multiplier), showing how pre-agreed values resolve trade-offs.

  Biggest limitation: the procedure can't set the priority weights itself. The board must grapple with that ethical judgement separately. Also, any proposal where harms and benefits are finely balanced might deadlock, requiring fallback human judgement.

  Better include clear rejection triggers - like if any group loses well-being without compensating gain, or if uncertainty about impacts is too high. And emphasise that equal distribution isn't a goal; only absolute gains for the worse-off matter.

  Right, the response will structure this as a numbered checklist with decision gates. Use plain language throughout - no philosophy jargon. For the finance director's benefit, explicitly state where proposals get "killed" versus where they proceed. And flag that Case B's approval might feel counterintuitive but is logically required...
answer: |-
  Here is a reusable decision procedure for your commissioning board, grounded in prioritarianism and designed for practical monthly use within a two-hour meeting. It uses plain British English and separates factual assessments from value judgments.

  ---

  **Prioritarian Commissioning Decision Procedure: Step-by-Step Checklist**

  **Purpose:** To consistently decide whether to shift spending between services, prioritising benefits to the worse off without valuing equality for its own sake, and avoiding levelling down.

  **Core Principle:** A unit of well-being improvement for a person matters more the worse off that person is. Reducing inequality *only* matters if it makes someone better off.

  **Who Does What:**
  *   **Steps 1-3:** Team assesses factual impacts (led by analysts/clinical leads).
  *   **Step 4:** Board applies pre-agreed societal value weights (led by Director/Chair).
  *   **Step 5:** Board makes final go/no-go decision.

  **The Procedure:**

  1.  **Identify Impacted Groups:** For the proposal, list *all* population groups whose *expected well-being* will likely change (e.g., severe/complex needs, moderate long-term conditions, comparatively well). Be specific.
      *   *Sufficient Answer:* Clear list of groups affected, defined by needs/conditions.
      *   *Stop if:* No groups are clearly identified or impacted. **Decision = NO.** (Unclear scope).

  2.  **Assess Well-Being Changes (Factual):** For *each* group identified in Step 1, describe the *direction* (better/worse/no change) and *scale* (using categories below) of the **expected change in well-being** due to the proposal. *Do not use numbers unless pre-calibrated scales exist.*
      *   **Scale Categories (Define examples for your context):**
          *   **Major Gain/Deterioration:** Significant, measurable impact on core health/social functioning, quality of life, or risk of severe decline (e.g., enabling independent living vs. risk of hospitalisation).
          *   **Moderate Gain/Deterioration:** Noticeable positive/negative change in daily life, symptoms, or support (e.g., reduced pain, improved access to community activities vs. increased anxiety, longer waiting times).
          *   **Minor Gain/Deterioration:** Slight positive/negative effect, unlikely to significantly alter overall well-being trajectory.
          *   **Negligible/No Change:** Impact too small to meaningfully assess or no expected change.
      *   *Sufficient Answer:* Documented assessment for *every* group using agreed categories, based on evidence (data, clinical expertise, service user feedback). State key assumptions/uncertainties.
      *   *Stop if:*
          *   Any group experiences a **Major, Moderate, or Minor Deterioration** AND no group experiences a **Major, Moderate, or Minor Gain**. **Decision = NO.** (This is levelling down - harm with no benefit).
          *   Uncertainty about impacts is too high to reasonably categorise. **Decision = NO.** (Insufficient evidence).

  3.  **Compare Gainers & Losers (Factual Summary):** Clearly state:
      *   Which group(s) gain well-being (and scale: Major/Moderate/Minor).
      *   Which group(s) lose well-being (and scale: Major/Moderate/Minor).
      *   Which group(s) are unaffected.
      *   *Sufficient Answer:* Clear summary table or statement based on Step 2.
      *   *Stop if:* Only gains OR only losses occur (check Step 2 stops covered this). Otherwise, proceed.

  4.  **Apply Priority Weighting (Value Judgment):** Compare the *gains of the better-off gainer(s)* against the *losses of the worse-off loser(s)*, applying **pre-agreed societal priority weights**.
      *   *Question:* "Given the board's prioritarian commitment, does the *priority-weighted gain* for the worse-off gainer(s) outweigh the *priority-weighted loss* for the better-off loser(s)?"
      *   **Using Categories:** Argue qualitatively. E.g., "A Major Gain for the severely ill (worst off) is judged to outweigh a Moderate Loss for the moderately ill (better off), based on our agreed principle that benefits to the worse-off matter much more." Use pre-agreed examples/scenarios for calibration.
      *   **Using Numbers (If available & pre-agreed):** Multiply gains/losses by pre-agreed priority weights for each group's well-being unit. Sum weighted gains and weighted losses. If Weighted Gains > Weighted Losses, proceed. If Weighted Gains <= Weighted Losses, stop.
      *   *Sufficient Answer:* A reasoned justification referencing pre-agreed weights/principles OR a clear numerical result (if using numbers).
      *   *Stop if:* The priority-weighted gains do **not** clearly outweigh the priority-weighted losses. **Decision = NO.** (Losses to better-off outweigh priority gains to worse-off, or net negative priority impact).
      *   *Proceed if:* Priority-weighted gains clearly outweigh priority-weighted losses. **Decision = PROVISIONAL YES.**

  5.  **Feasibility & Final Check:** Briefly confirm practical feasibility (finance, workforce, implementation timeline) and absence of major unintended consequences not captured in well-being impacts. No major ethical/legal red flags.
      *   *Sufficient Answer:* Brief confirmation from relevant leads (Finance, Ops).
      *   *Stop if:* Major feasibility/risk issues identified. **Decision = NO.**
      *   *Proceed if:* Feasible and acceptable. **Decision = YES.**

  ---

  **Application to Test Cases:**

  **(a) Levelling Down: Withdraw service from better-off group. They are worse off (Moderate Deterioration). No other group better off (No Gains). Inequality narrows.**

  *   **Step 1:** Identified Groups: Better-off group (loses), Others (no change).
  *   **Step 2:** Better-off group: **Moderate Deterioration**. Other groups: **No Change**.
  *   **Step 3:** Losers: Better-off group (Moderate Loss). Gainers: None. Unaffected: Others.
  *   **Stop at Step 2:** "Any group experiences a Major/Moderate/Minor Deterioration AND no group experiences a Major/Moderate/Minor Gain." -> **Decision = NO.**
  *   **Why:** This *is* levelling down. The narrowing gap is irrelevant under prioritarianism. Harm occurs with no offsetting benefit. The procedure blocks it as required.

  **(b) Unequal Growth: Substantially improves worst-off group (Major Gain), improves better-off group by even more (Major Gain). Inequality widens.**

  *   **Step 1:** Identified Groups: Worst-off group (gains), Better-off group (gains).
  *   **Step 2:** Worst-off group: **Major Gain**. Better-off group: **Major Gain**. Others: **No Change** (assumed).
  *   **Step 3:** Gainers: Worst-off (Major Gain), Better-off (Major Gain). Losers: None. Unaffected: Others.
  *   **Proceed through Steps 1-3:** No losses, only gains.
  *   **Step 4:** No priority weighting needed *between gainers* because **there are no losers**. The proposal only creates gains. Widening inequality is irrelevant under prioritarianism.
  *   **Step 5:** Assuming feasible. **Decision = YES.**
  *   **Why Unwelcome?** The board might dislike the widening inequality. However, prioritarianism values *absolute gains for the worse-off*, not equality. The worst-off gain substantially. Blocking this *because* a better-off group gains *more* would violate prioritarianism by denying a significant benefit to the worst-off for no prioritarian reason (no one is harmed). The procedure requires approval.

  **(c) Priority Transfer: Transfer resources. Moderately ill group loses 12 units. Severely ill group gains 9 units. Pre-agreed weight: 1 Severely Ill unit = 3 Moderately Ill units.**

  *   **Step 1:** Identified Groups: Severely Ill (gains), Moderately Ill (loses).
  *   **Step 2:** Severely Ill: Gain of 9 units (categorically **Major Gain**). Moderately Ill: Loss of 12 units (categorically **Major Deterioration**). Others: No Change.
  *   **Step 3:** Gainers: Severely Ill (Gain: 9 units). Losers: Moderately Ill (Loss: 12 units).
  *   **Step 4 (Using Numbers - Pre-agreed):**
      *   Priority-Weighted Gain = 9 units (Severely Ill) * 3 (Weight) = 27
      *   Priority-Weighted Loss = 12 units (Moderately Ill) * 1 (Weight) = 12
      *   Net Priority-Weighted Impact = 27 - 12 = +15 (Positive)
      *   Weighted Gains (27) > Weighted Losses (12) -> **Proceed.**
  *   **Step 5:** Assuming feasible. **Decision = YES.**
  *   **Why:** The pre-agreed weights explicitly value a unit of well-being for the severely ill (worse off) three times as much as for the moderately ill. The priority-weighted gain (27) significantly outweighs the priority-weighted loss (12), making this a net benefit under prioritarianism.

  ---

  **What the Procedure Cannot Do:**

  1.  **Define the Priority Weights:** The procedure *uses* pre-agreed societal weights (Step 4) but cannot *determine* them. This is the core value judgment the board must make externally, informed by ethics, public engagement, and policy goals. (E.g., deciding *how much more* a unit for the severely ill counts vs. the moderately ill).
  2.  **Resolve Deep Uncertainty:** If the factual impacts (Step 2) are highly uncertain or contested, the procedure defaults to "No" (Stop at Step 2). It cannot magically resolve poor evidence.
  3.  **Handle Perfect Ties:** If weighted gains *exactly equal* weighted losses (net zero) in Step 4, the procedure says "No". It offers no tie-breaker; the board must have an external policy for such rare cases (e.g., status quo bias).
  4.  **Account for All Non-Well-Being Factors:** It focuses solely on prioritarian well-being impacts. Factors like provider sustainability, political feasibility, or specific legal mandates might need separate consideration *after* or *alongside* this procedure, potentially overriding a "Yes" at Step 5.
  5.  **Value Equality Itself:** The procedure is blind to changes in inequality *unless* they directly result from changes in individual well-being. It cannot value a narrower gap if achieved through levelling down or if a wider gap occurs alongside gains for the worst-off.
  6.  **Make Judgments on Very Fine Margins:** The categorical approach (Major/Moderate/Minor) necessitates judgment calls at the boundaries. It works best for clear-cut differences. Very close calls might still require board discretion.

  **Where it Might Misfire:**

  *   **Over-Caution:** The requirement for clear evidence (Step 2) might block innovative proposals with high potential benefit but less certain evidence.
  *   **Categorisation Challenges:** Disagreement on whether an impact is "Moderate" or "Major" could lead to inconsistent decisions if calibration isn't maintained.
  *   **Ignoring Opportunity Costs:** The procedure assesses the *specific proposal*. It doesn't automatically compare it to *all* other possible uses of the resources. The board must ensure proposals represent the *best* prioritarian option available.
  *   **Group Definition:** Poorly defined population groups could mask impacts on vulnerable subgroups within a broader category.

  **Residual Judgments for the Board:**

  1.  **Setting Societal Priority Weights:** The most critical and fundamental value judgment. How much priority do we give to the worse-off? (Step 4).
  2.  **Calibrating Impact Categories:** Defining what constitutes a "Major" vs. "Moderate" impact for different groups in your local context (Step 2).
  3.  **Resolving Ambiguity:** Making final calls if factual assessments (Step 2) are borderline despite best efforts.
  4.  **Considering Overrides:** Deciding if non-prioritarian factors (e.g., urgent legal requirement, catastrophic provider failure) warrant overriding a procedural "No" or "Yes".

  This procedure provides a rigorous, consistent, and explainable framework for applying prioritarianism to your commissioning decisions, directly addressing levelling down and separating facts from values. Its success hinges on clear pre-agreement on priority weights and impact categories by the board.
