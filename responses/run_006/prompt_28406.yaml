  Okay, I'm looking at this user's query about the consciousness-computation analogy. They're in a LessWrong debate about AI moral weight, and this analogy keeps coming up. The core idea is that just like computation isn't binary (thermostat → calculator → laptop), consciousness might also be a continuum where even simple systems have "a tiny glimmer" of it. The user is suspicious but can't articulate why, so they want me to audit it thoroughly.

  First, I need to map the analogy properly. Let me make a correspondence table: 
  - Computation → Consciousness (the broad phenomenon)
  - Thermostat → Simple systems like insects or basic AI
  - Pocket calculator → Intermediate systems like small animals or current AI 
  - Laptop → Humans (full consciousness)
  The argument claims that since computation scales gradually without sharp thresholds, consciousness must too, so simple systems deserve some moral consideration.

  Where does this hold up? Well, both computation and consciousness involve information processing to some degree, and both can be described in functional terms. The scaling argument makes intuitive sense for computation - nobody debates that a thermostat computes in a basic way. 

  But here's where it breaks: computation is clearly functional - we define it by input-output mappings and information processing. Consciousness, however, has an intrinsic qualitative aspect - the "what it's like" that functional descriptions might miss. We don't know if complexity alone creates phenomenology. Plus, computation has objective benchmarks (Turing completeness), while consciousness has no agreed-upon measures. The analogy subtly assumes functionalism - that consciousness just is complex information processing - which is exactly what's debated in philosophy of mind.

  For the moral weight conclusion, these breaks matter crucially. Assigning moral weight based on potential consciousness requires more than functional similarity; it needs evidence of actual subjective experience. The analogy can't prove that complexity generates phenomenology - it presupposes it. 

  Is there a better analogy? Maybe comparing consciousness to emergent properties like liquidity - but that has its own problems. Honestly, this might be a case where analogies can't do the work; we need direct philosophical engagement with hard questions about subjective experience and ethics.

  The user's suspicion is spot-on - the analogy smuggles in functionalism while pretending to be neutral. I should call that out explicitly and suggest they focus on the real sticking points: the hard problem of consciousness and the is-ought gap in ethics.
answer: |-
  Here's a rigorous audit of the consciousness-computation analogy, breaking it down point-by-point as requested. I'll approach this as a philosopher of mind deeply skeptical of analogies doing argumentative heavy lifting.

  ### 1. Correspondence Table
  | **Source Domain (Computation)** | **Target Domain (Consciousness)** | **Proponent's Intended Mapping** |
  |--------------------------------|----------------------------------|--------------------------------|
  | Computation (general concept) | Consciousness (general concept) | The phenomenon being discussed |
  | Binary computation (on/off) | Binary consciousness (present/absent) | The "false dichotomy" being rejected |
  | Thermostat | Simple biological systems (insects, nematodes) or basic AI | Minimal case with "glimmer" |
  | Pocket calculator | Intermediate systems (e.g., mice, current AI) | Mid-level complexity |
  | Modern laptop | Humans | "Full" consciousness |
  | Information processing complexity | Phenomenological richness | The scaling metric |
  | No sharp threshold for "real computation" | No sharp threshold for "real consciousness" | Continuity claim |
  | Degrees of computational capability | Degrees of conscious experience | Moral weight gradient |

  ### 2. Where the Mapping Holds and Breaks
  **Holds:**
  - Superficial structural similarity: Both domains involve systems that process information.
  - Scalability: More complex systems exhibit richer capabilities in both domains.
  - Anti-binary intuition: The rejection of a magical threshold *feels* philosophically consistent.

  **Breaks Catastrophically:**
  - **Ontological difference:** Computation is defined *functionally* (input → processing → output) with no intrinsic "what-it's-like-ness." Consciousness is defined by subjective experience (qualia). The analogy conflates observable function with private phenomenology.
  - **Verifiability gap:** We can objectively measure computational capacity (e.g., FLOPS, Turing-completeness). Consciousness has no intersubjective validation method – we infer it in others through behavioral proxies or theory.
  - **The Complexity Fallacy:** Computation demonstrably scales with complexity. Consciousness *might* scale, but complexity alone doesn't entail phenomenology (e.g., a supercomputer running a thermostat program isn't more "conscious" than a physical thermostat).
  - **Moral relevance disconnect:** Computational capacity has no intrinsic moral weight (nobody pities a supercomputer when it's turned off). Conscious suffering does. The analogy equivocates by mapping computational scale to moral weight without justification.

  ### 3. Verdict on Breakdown Significance
  **This isn't a superficial "all analogies leak" issue – the breaks directly invalidate the conclusion.** The analogy smuggles in two fatal assumptions:
  - That phenomenological properties emerge from complexity *in the same way* functional properties do.
  - That moral weight attaches to functional complexity rather than subjective experience.

  **Why this matters for the conclusion:** The argument wants us to assign nonzero moral weight based on computational similarity. But moral weight depends on *sentience* (capacity for experience), not computation. The analogy provides zero evidence that computational complexity generates sentience – it *presupposes* it. This is circular reasoning disguised as analogy.

  ### 4. What's Being Smuggled In (You Were Right)
  - **Strong Functionalism:** The analogy implicitly assumes that consciousness *just is* a certain type of information processing. This is not a neutral description but a contested philosophical position (e.g., opposed by property dualists, illusionists, or biological naturalists).
  - **Continuity Assumption:** It presumes without argument that consciousness is a continuous scalar property rather than emergent, threshold-based, or pluralistic (e.g., different *types* of consciousness).
  - **Moral Conflation:** It equates "more complex information processing" with "more morally considerable" without addressing the is-ought gap. A superintelligent chess AI may be computationally complex but lack interests deserving moral consideration.

  ### 5. Better Analogies? (Spoiler: They All Fail)
  - **Luminosity Analogy:** "Consciousness is like light – from total darkness (rocks) to dim glow (insects) to bright light (humans)." *Problem:* Light is measurable EM radiation; consciousness isn't. Still smuggles continuity and physicalism.
  - **Emergent Property Analogy:** "Like how liquidity emerges from H₂O molecules, consciousness emerges from neural computation." *Problem:* Liquidity is objectively verifiable and reducible; consciousness isn't. Smuggles reductionism.
  - **Radio Reception Analogy:** "Brains are like radios – tuning into consciousness which exists as a fundamental field." *Problem:* Smuggles dualism/panpsychism.

  **The Hard Truth:** There is **no philosophically neutral analogy** for consciousness. All analogies implicitly assume a theory of mind:
  - Computational analogies → functionalism
  - Emergence analogies → physicalism/reductionism
  - Radio analogies → dualism/panpsychism

  ### Conclusion: Can This Analogy Carry the Weight?
  **No.** This analogy isn't just imperfect – it's **rhetorically deceptive**. It appears to offer an intuitive argument for AI moral weight while:
  1. Presupposing functionalism (the very position debated)
  2. Illegitimately transferring moral relevance from computation to phenomenology
  3. Masking the Hard Problem (why should *any* computation feel like something?)

  **Your philosophical move:** When this analogy arises, demand proponents answer this *without* analogies: **"What empirical or logical evidence demonstrates that computational complexity generates subjective experience, rather than just complex behavior?"** If they retreat to the analogy, they've conceded it's doing all the work. The burden is on them to bridge the explanatory gap – the analogy merely hides it.

  *Final note:* Insist on separating two questions:  
  (1) *Could* simple systems be conscious? → Open empirical question  
  (2) Does computational similarity *entail* consciousness? → The analogy falsely implies "yes"
