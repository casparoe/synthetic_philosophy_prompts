prompt: |-
  I am working through the value-of-knowledge literature and have reached the point where I need the criteria before I go any further. Write the desiderata: what any adequate account of why knowledge is more valuable than mere true belief must explain, the cases it must handle correctly, the distinctions it may not collapse, and the results from elsewhere in epistemology with which it must be consistent. For each requirement, give the consideration or case that motivates it, and mark whether it is non-negotiable or whether it reflects the commitments of a particular camp (reliabilist, virtue-theoretic, knowledge-first, and so on).

  I particularly want to know whether any subset of the non-negotiable desiderata is jointly unsatisfiable. If the swamping problem shows, for instance, that any theory which analyses knowledge into true belief plus a further condition whose value is merely instrumental with respect to truth will necessarily leave an unexplained value residual, then the desiderata themselves might rule out a whole family of candidate theories — and that is something I want flagged before I start evaluating individual views. More generally, if the landscape contains a tension between, say, explaining why knowledge is more valuable than any proper subset of its constituents and accommodating the fact that some knowledge seems trivial, I want to see that tension made explicit and assessed: can a theory honour both, or must one of those requirements be weakened?

  A brief scorecard against the list for virtue epistemology, process reliabilism, and the knowledge-first programme would be helpful, but the weight should stay on the desiderata and their internal tensions. If there is a single requirement that, taken seriously, knocks out the largest number of otherwise plausible theories, identify it and say why.
reasoning: |-
  Okay, the user is deep into the value-of-knowledge literature and needs a clear set of desiderata before proceeding. They want criteria that any theory explaining why knowledge is more valuable than mere true belief must satisfy. Their main concerns are the non-negotiable requirements versus camp-specific ones, potential tensions between desiderata, and which theories fail or succeed based on these.

  First, I need to recall the core issues. The Meno problem is central: Plato's question about why knowledge is better than true belief. The swamping problem is crucial too—Zagzebski's argument that if a property's value is only instrumental to truth, adding it to true belief doesn't add extra value. That's a big hurdle for reliabilism. Then there's Kvanvig's trivial knowledge challenge: if knowledge is always more valuable, why do we sometimes not care about trivial truths? 

  The user also wants to know if any desiderata conflict. For example, the universality of value (KNOW > TB always) clashes with trivial knowledge cases. Maybe strict universality isn't tenable. Also, the value must be distinct from the constituents—knowledge's value isn't just the sum of its parts. That's tough for analyses that add conditions instrumentally tied to truth.

  Next, theories. Virtue epistemology might handle the source of value by crediting the agent's competence. But trivial knowledge? Sosa's animal vs reflective knowledge could help there. Reliabilism struggles with swamping—Goldman's response about multiple values might be a dodge. Knowledge-first, like Williamson, avoids analysis but then explaining the value becomes mysterious. 

  The user's deeper needs: they want to avoid dead-end theories. Highlighting the swamping problem as a major blocker makes sense—it sinks any instrumentalist approach. Also, flagging the trivial knowledge tension shows that strict universality might need softening. They probably need a clear framework to evaluate theories efficiently, knowing which battles are worth fighting. 

  Scorecards: Virtue theory scores well on source and distinctiveness but wobbles on trivial cases. Reliabilism fails swamping unless it adopts extra values. Knowledge-first avoids some traps but struggles to explain distinct value. 

  Key takeaway: Swamping is the biggest killer. If a theory treats the extra factor in knowledge as only instrumentally valuable to truth, it's sunk. That's why hybrid theories or those with non-instrumental value might be necessary. The user should start by testing each candidate against swamping and trivial cases to quickly narrow the field.
answer: |-
  Here are the core desiderata for any adequate account of the value of knowledge over mere true belief (KNOW > TB), categorized by motivation, negotiability, and potential tensions. Key conflicts and the "theory-killer" desideratum are highlighted.

  ### Core Desiderata (Non-Negotiable)

  1.  **The Basic Asymmetry (Plato's Challenge):**
      *   **Requirement:** Explain why KNOWING that p is *systematically* more valuable (in at least *some* significant respect) than merely TRULY BELIEVING that p.
      *   **Motivation:** Rooted in Plato's *Meno* (97a-98b). True beliefs are valuable but "run away"; knowledge is "tied down" and thus superior. Any account failing this isn't addressing the core problem.
      *   **Negotiability:** **Non-Negotiable.** The *sine qua non* of the project.
      *   **Tensions:** Must be reconciled with "Trivial Knowledge" (#4).

  2.  **Value Beyond Constituent Parts (Anti-Conjunction / Anti-Swamping):**
      *   **Requirement:** Explain why KNOW is more valuable than the *mere conjunction* of (a) TB and (b) whatever further condition(s) F the theory posits as necessary for knowledge (e.g., justification, reliability, virtue). The value of KNOW cannot be *swamped* by the value of TB when F is present.
      *   **Motivation:** The Swamping Problem (Zagzebski, Kvanvig). If F's value is *purely instrumental* to achieving TB (e.g., reliability is good *only* because it causes TB), then once TB is present, adding F seems to add no *additional* value relevant to the cognitive state. KNOW = TB + F should be no more valuable than TB alone *if F's value is purely instrumental*. Yet KNOW *is* more valuable.
      *   **Negotiability:** **Non-Negotiable.** This is arguably the **single most consequential desideratum.** It eliminates all theories analyzing knowledge into TB + F *where F's value is solely instrumental to truth*. This is devastating for simple forms of **Process Reliabilism** and many traditional JTB+ analyses.
      *   **Tensions:** Forces theories to attribute *non-instrumental* value (or instrumental value w.r.t. a *further* valuable end) to F or to reject the standard analysis altogether.

  3.  **Source of Value (Distinctiveness):**
      *   **Requirement:** Identify the *source* or *nature* of the extra value in KNOW compared to TB. This value must be *distinctive* to knowledge or its essential components.
      *   **Motivation:** The extra value must be grounded in what *makes* knowledge knowledge, not some accidental feature. A lucky guess (TB) vs. understanding why the guess is right (KNOW) illustrates the difference needing explanation.
      *   **Negotiability:** **Non-Negotiable.** Without this, the explanation is vacuous or misattributed.
      *   **Tensions:** Must be consistent with the type of value claimed (e.g., if practical, explain impractical knowledge; if intrinsic, explain why).

  ### Important (Often Camp-Specific) Desiderata

  4.  **Universality / Scope:**
      *   **Requirement:** Explain why KNOW > TB holds for *all* (or almost all) instances of knowledge, including trivial or apparently worthless knowledge (e.g., knowing the number of dust specks on my desk right now).
      *   **Motivation:** Kvanvig's "Trivial Knowledge" challenge. If KNOW > TB is fundamental, it should hold even when the truth itself has negligible value. Failure suggests the extra value might be merely practical/contextual, not inherent to knowledge *as such*.
      *   **Negotiability:** **Negotiable/Contentious.** Some (e.g., **Pragmatists, some Contextualists**) deny KNOW *as such* has value beyond TB; value arises only in contexts where stability/justification/etc. *matters*. **Virtue Theorists** (Sosa, Zagzebski) often accept it. **Reliabilists/Knowledge-Firsters** struggle unless they build in a non-triviality condition or accept a minimal "cognitive achievement" value.
      *   **Tension:** Direct conflict with the intuition behind the **Basic Asymmetry (#1)** for trivial truths. If KNOW > TB *must* hold universally, it pressures theories towards minimal intrinsic value or achievement-value. Rejecting universality weakens the claim that KNOW > TB is an *essential* feature of knowledge.

  5.  **Kind of Value:**
      *   **Requirement:** Specify the *kind* of value KNOW has over TB (e.g., intrinsic, instrumental, constitutive, final, epistemic, practical, recognitional, achievement-based).
      *   **Motivation:** Different intuitions drive the value problem. Is knowledge better *in itself*? Is it better *for* pursuing further truths/practical goals? Is it better because it constitutes intellectual virtue/agency?
      *   **Negotiability:** **Highly Camp-Specific.**
          *   **Intrinsic Value:** Often claimed by **Virtue Epistemologists** (Zagzebski) – knowledge is intrinsically good as an achievement/virtuous state. Faces challenge from trivial knowledge (#4).
          *   **Instrumental Value (w.r.t. further truths/practical success):** Favored by some **Reliabilists** or **Pragmatists**. Must avoid the Swamping Problem (#2) for the *primary* KNOW vs. TB comparison (e.g., by claiming F is instrumentally valuable for *other* truths/ends beyond *this* TB).
          *   **Constitutive/Final Value:** Favored by **Aristotelian Virtue Theorists** (Sosa) – knowledge is constitutive of cognitive flourishing/agency, hence finally valuable. **Knowledge-First** (Williamson) might see knowledge as a fundamental mental state constitutive of agency.
          *   **Recognitional Value:** KNOW involves *appreciating/recognizing* the truth, which is valuable (Pritchard). Requires explaining why recognition itself is valuable.

  6.  **Compatibility with Epistemic Norms:**
      *   **Requirement:** The account must cohere with plausible views on justification, evidence, defeat, and the goal(s) of inquiry.
      *   **Motivation:** An account that makes KNOW > TB but implies justification is unimportant, or that truth isn't the primary epistemic goal, seems deeply flawed. E.g., if KNOW > TB stems *only* from practical value, it might undermine the distinctiveness of *epistemic* norms.
      *   **Negotiability:** **Broadly Non-Negotiable** (for coherence), but interpretations of norms vary significantly between camps.

  ### Key Tensions & The Theory-Killer

  *   **Tension 1: Universality (#4) vs. Basic Asymmetry Intuition in Trivial Cases (#1):** Explaining why knowing trivial truths is *inherently* better than merely truly believing them is notoriously difficult. Most people don't care about either state. *Resolution Attempts:* (1) Deny Universality (KNOW > TB only matters for non-trivial truths) - weakens the core claim. (2) Posit minimal intrinsic/achievement value even in trivial cases (Sosa's "animal knowledge") - requires accepting a very thin notion of value/achievement. (3) Argue trivial "knowledge" isn't genuine knowledge (strained).
  *   **Tension 2: Source (#3) & Kind of Value (#5) vs. Swamping (#2):** Identifying a source/value for the "F" condition that avoids instrumental value *only* w.r.t. *this specific truth* is essential to avoid swamping. This pushes theories towards non-instrumental value (intrinsic, constitutive, final) or instrumental value w.r.t. *further* valuable ends (e.g., future truths, intellectual flourishing).

  **The Theory-Killer Desideratum: Anti-Swamping (#2).** This is the most potent filter. It immediately eliminates:

  1.  **Naive Reliabilism:** If reliability's value is *solely* instrumental to producing true beliefs, its value is swamped by the presence of the true belief itself. KNOW (TB + reliable process) = TB in value. Goldman's response (invoking multiple values like power, speed) is often seen as changing the subject or insufficient for the core KNOW vs. TB comparison.
  2.  **Simple Instrumentalist JTB+:** Any view where justification's *only* value is its instrumental connection to truth falls prey. Adding J to TB doesn't increase value if TB is already present.
  3.  **Any Analysis where F's value is purely truth-conducive:** The analysis itself is undermined if adding F adds no value over TB.

  **Survivors** must either:
  *   Attribute non-instrumental value to F (e.g., **Virtue Epistemology** - credit to the agent's competence is valuable as an achievement).
  *   Attribute instrumental value to F w.r.t. a *further* valuable end beyond *this* truth (e.g., F is reliable for *future* inquiries; F is justification essential for *understanding* or *wisdom*).
  *   Reject the standard analysis (**Knowledge-First** - knowledge is prime, TB is a deficient state; value arises from knowledge's role as a fundamental norm/mental state).

  ### Brief Scorecard

  | Theory             | Basic Asymmetry (#1) | Anti-Swamping (#2) | Source/Distinct (#3) | Universality (#4) | Kind of Value (#5)              | Compatibility (#6) |
  | :----------------- | :------------------- | :----------------- | :------------------- | :---------------- | :------------------------------ | :----------------- |
  | **Virtue Epistem (Sosa)** | Strong ✓            | Strong ✓ (Achievement Value) | Strong ✓ (Agent's competence) | Mixed ✓ (✓ for animal kn, ? for trivial) | Final (Constitutive of flourishing) | Strong ✓           |
  | **Virtue Epistem (Zagzebski)** | Strong ✓            | Strong ✓ (Intrinsic Value of Virtue) | Strong ✓ (Motivation + Reliablity) | Weak ✗ (Intrinsic value hard for trivial) | Intrinsic                          | Moderate ✓         |
  | **Process Reliabilism (Basic)** | Strong ✓            | **Fails ✗** (Swamped by TB)   | ✓ (Reliable Process)          | ✓                 | Instrumental (Truth-Conducive)  | Weak ✗ (Ignores justification norms?) |
  | **Knowledge-First (Williamson)** | Strong ✓            | ✓ (Avoids Analysis)          | ? (Primitive State/Norm)      | ✓                 | Constitutive (of Agency/Mind?) | Strong ✓ (Fits primacy) |
  | **Hybrid/Other**   | ✓                    | Varies                      | Varies                      | Varies            | Varies                          | Varies             |

  **Conclusion:** The **Swamping Problem (#2)** is the most significant hurdle. It forces theories to move beyond purely instrumental (w.r.t. this specific truth) accounts of the "F" condition in knowledge. **Virtue Epistemology** (especially Sosa's performance normativity) handles swamping best by locating value in the agent's manifestation of competence. **Knowledge-First** avoids swamping by rejecting the TB+F analysis but struggles to *explain* the value primitively assigned to knowledge. **Process Reliabilism** fails the anti-swamping requirement in its basic form. The **Universality/Trivial Knowledge (#4)** requirement creates significant pressure, potentially forcing a weakening of the Basic Asymmetry claim for trivial cases or acceptance of very thin value. Start any theory evaluation by stress-testing it against Swamping and Trivial Knowledge.
