  **Phase 1: Counterfactual Mugging-like Game**
  - **Setup**: A predictor (facilitator) makes a prediction about a participant's action in a counterfactual branch. The actual branch is determined by a coin flip (or a random event). Only in one branch (e.g., tails) does the participant have to decide whether to pay. The predictor's policy is: if they predict the participant would pay in the counterfactual branch (heads), then in the tails branch the facilitator gives the participant a bonus. But if the participant is in the tails branch and refuses to pay, then they don't get the bonus. The twist: the participant in the tails branch must pay a cost that benefits the heads branch (which doesn't exist in reality) but gets a bonus from the predictor only if the predictor predicted they would pay.

  **Phase 2: XOR Blackmail-like Game**
  - **Setup**: Participants are paired. The predictor (facilitator) flips a coin for each pair to determine a state (good or bad). The predictor then sends a message to one participant in the pair (the "blackmailee") if the state is bad, unless that participant has committed to paying. The message is: "You are being blackmailed." But note: if the participant committed to pay, then even in the bad state they don't receive the message. The participant must decide whether to pay (which costs them) without knowing the state. Paying prevents the message from being sent in the bad state, but the participant doesn't know if the state is bad. The catch: paying does not change the state (which is already determined). The message is evidence of a bad state, but only if the participant didn't commit to pay.

