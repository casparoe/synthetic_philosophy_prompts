          - 50% chance of heads: +20
          - 50% chance of tails: you then have to decide whether to pay. If you pay, -10; if not, 0. But you might choose not to pay in tails, so you get 0 in tails.
          - So expected: 0.5*20 + 0.5*0 = 10.

     The expected value of reporting 'Not pay':
          - 50% chance of heads: 0
          - 50% chance of tails: 0
          - expected: 0.

     So ex-ante, you should report 'Pay'. But in the tails branch, if you reported 'Pay', you then face a choice: pay 10 tokens or not. You get -10 if you pay, 0 if not. So you should choose not to pay. 

     The tension: if you are rational ex post, you will not pay in tails. But then if you anticipate that, then in the heads branch you would not get the bonus because the predictor would know you wouldn't pay in tails. But in our setup, the bonus is based on your report, not on what you do. And you can lie in the report.

     To simulate an accurate predictor, we can have the facilitator, after collecting the reports, force the participants in the tails branch to act according to their report? But then it's not a decision.

     Given the time, we will use this design and then in the debrief explain that in the real counterfactual mugging, the predictor is accurate and knows what you would do, so you cannot lie in the report. The game is an approximation.

     Phase 1 Rules (final):

     1. Each participant has an initial token balance of 100.
     2. Each participant writes on a slip of paper their decision for the tails branch: "Pay" or "Not pay". They are told: "This is what you would do if the coin flip results in tails. Please be truthful." Collect the slips.
     3. The facilitator flips a coin and announces the result.
     4. If heads:
          - The facilitator reads the decisions from the slips. For each participant who wrote "Pay", they receive 20 tokens.
          - Participants who wrote "Not pay" receive nothing.
     5. If tails:
          - The facilitator returns the slips to the participants.
          - Each participant then decides independently whether to pay 10 tokens or not. They can ignore what they wrote.
          - The facilitator collects payments (if any) and sets them aside (they are not used).

     Payoff phase 1:
          - Heads: 
               - "Pay" report: 100 + 20 = 120
               - "Not pay" report: 100
          - Tails:
               - If they pay: 100 - 10 = 90
               - If they not pay: 100

     Now, the tension for a participant in tails who reported "Pay": they can choose to not pay and get 100, or pay and get 90. So they will choose not to pay. But then why did they report "Pay"? Because if the coin had been heads, they would have gotten 120. So they gambled on heads and lost. In the debrief, we can explain that in the real counterfactual mugging, the predictor is accurate, so you cannot fake.

     For Phase 2: XOR Blackmail

     We now need to run a game that has the structure of XOR blackmail.

     XOR Blackmail structure (from the description):
     - A predictor flips a coin to determine a state (good or bad).
     - The predictor sends a message to the participant if the state is bad, unless the participant committed to paying.
     - The participant must decide whether to pay without knowing the state.
     - Paying costs them, but it prevents the message from being sent in the bad state.
     - The message is evidence of a bad state, but only if the participant didn't commit to pay.

     In our game:

     - We can pair the participants.
     - For each pair, the facilitator flips a coin to determine the state: heads (good) or tails (bad).
     - Before the state is determined, the participant (blackmailee) must decide whether to commit to paying. But we want the decision to be after the state is determined? No, in XOR blackmail, the commitment is before the state is known.

     Rules for Phase 2:

     1. Participants are paired (6 pairs).
     2. For each pair, there is a blackmailee and a blackmailer. But to avoid role-playing, we can have the facilitator as the blackmailer. So for each pair, one participant is the decision-maker (DM) and the facilitator is the other party.
     3. The DM first decides whether to pay 10 tokens to prevent the message from being sent in the bad state. But wait, they are also allowed to not commit and then later decide to pay after receiving the message? In the standard XOR blackmail, the participant can only commit before the state is known by paying in advance. 

     Steps for one pair:

     - The DM is given an option: 
          - Option A: Pay 10 tokens now (before the coin flip) to purchase an "insurance". If they choose this, then the facilitator will not send any message regardless of the coin flip.
          - Option B: Do not pay now. Then the facilitator flips a coin for the state. 
               - If the state is good (heads), the facilitator does nothing.
               - If the state is bad (tails), the facilitator sends a message to the DM: "The state is bad. You can still avoid the consequences by paying 10 tokens." 
          - If the DM receives the message, they can then choose to pay 10 tokens or not.

     But what are the consequences? We need to define a loss in the bad state if they don't pay.

     We can say: if the state is bad and the DM does not pay (either in advance or after the message), then they lose 50 tokens.

     So payoffs for the DM in phase 2:

     - If they purchased insurance (paid 10 in advance): 
          - They lose 10 tokens, and there is no message. The state might be good or bad, but they avoid the loss of 50 in the bad state.

     - If they did not purchase insurance:
          - If the state is good: they lose nothing.
          - If the state is bad: they receive the message. Then they can choose to pay 10 tokens to avoid the loss, or not pay and lose 50 tokens.

     The tension: 
          - Ex-ante, the insurance costs 10 tokens and prevents a loss of 50 tokens that happens with 50% probability. So expected value of insurance: -10.
          - Expected value without insurance: 50% * 0 + 50% * ( -10 if they pay after message, or -50 if they don't pay after message). If they are rational after the message, they will pay to reduce the loss from 50 to 10. So expected value without insurance: 0.5*0 + 0.5*(-10) = -5.
          - So they should not purchase insurance because -5 > -10.

     But then if they don't purchase insurance and the state is bad, they receive the message. The message is evidence that the state is bad. But they already know that without insurance, they will have to pay 10 in the bad state. So why is it unsettling? Because the message is only sent if they didn't purchase insurance and the state is bad. So if they don't purchase insurance and they don't receive a message, they know the state is good. If they do receive a message, they know the state is bad. The decision to not purchase insurance followed by not receiving a message is good news.

     The structure is unsettling because the very act of receiving the message is evidence of the bad state. And then paying after receiving the message doesn't change the state, but it avoids the loss. But ex-ante, it's better to not insure.

     In the game, we expect participants to not insure. Then, if they receive the message, they will pay to reduce the loss. They end up paying 10 tokens in the bad state. This is better than insuring which would cost 10 tokens regardless of the state.

     The XOR blackmail is about a message that is sent only in the bad state and only if you didn't insure. And then the message demands payment. The decision to not insure is what allows the message to be evidence of the bad state.

     So rules for Phase 2 per pair:

     1. The DM in the pair is given a choice:
          - "You can choose to pay 10 tokens now to prevent any further communication about the state. If you pay now, you will not receive any message and you will avoid any potential loss in the bad state."
          - "Or, you can choose not to pay now. In that case, I will flip a coin to determine the state. If the state is good, you will not hear from me. If the state is bad, I will send you a message. Upon receiving the message, you can choose to pay 10 tokens to avoid the loss, or not pay and lose 50 tokens."

     2. If the DM chooses to pay now, the facilitator collects 10 tokens and the game for that pair is over.

     3. If the DM chooses not to pay now, the facilitator flips a coin:
          - Heads (good state): The facilitator says nothing. The DM has no loss.
          - Tails (bad state): The facilitator gives the DM a message: "The state is bad. To avoid losing 50 tokens, you must pay 10 tokens now." 
               - If the DM pays upon receiving the message, they lose 10 tokens.
               - If they do not pay, they lose 50 tokens.

     Payoff for the DM in phase 2:
          - If they paid in advance: -10 tokens.
          - If they did not pay in advance and state is good: 0.
          - If they did not pay in advance and state is bad and then they pay: -10.
          - If they did not pay in advance and state is bad and they don't pay: -50.

     Initial tokens for phase 2: let's reset to 100 for simplicity, or carry over from phase 1? We can have phase 2 as a separate game with its own 100 tokens.

     The through-line: in both games, there is a precommitment and then an ex-post decision. In counterfactual mugging, the ex-ante commitment (reporting 'Pay') is beneficial if the coin is heads, but ex-post in tails, you don't want to follow through. In XOR blackmail, the ex-ante commitment (paying in advance) is not beneficial in expectation, but ex-post in the bad state, you are glad you didn't commit because you only pay if the state is bad.

     However, in XOR blackmail, if you don't commit, you might end up paying in the bad state anyway, but only in the bad state. And you save the cost in the good state.

     Now, the timeline and materials.

     ### Timeline (120 minutes total)

     - Introduction and setup: 10 minutes
     - Phase 1: 30 minutes (including explanation, gameplay, and token adjustment)
     - Phase 2: 30 minutes
     - Debrief: 50 minutes

     ### Materials for Phase 1:
        - 12 slips of paper for the reports
        - A coin
        - Token system: physical tokens or a scoreboard.

     ### Materials for Phase 2:
        - 6 coins (one per pair, or share one)
        - 6 messages (prepared: "The state is bad. To avoid losing 50 tokens, you must pay 10 tokens now.")

     ### Detailed Sequence:

     **Introduction (10 minutes)**:
        - Explain the token system: tokens determine your score. At the end, the top scorers can choose next week's snacks.
        - Explain that there are two games today.

     **Phase 1 (30 minutes)**:
        1. Explain the rules for phase 1 as above.
        2. Distribute slips. Participants write "Pay" or "Not pay" for the tails branch and hand them in.
        3. Flip the coin for the entire class. Announce result.
        4. If heads: 
               - Facilitator reads the reports and distributes 20 tokens to each participant who reported "Pay".
           If tails:
               - Return the slips to the participants.
               - Participants decide whether to pay 10 tokens or not (they can ignore their report).
               - Collect payments from those who choose to pay.
        5. Adjust token balances.

     **Phase 2 (30 minutes)**:
        1. Pair up the participants into 6 pairs.
        2. In each pair, one participant is designated the DM (randomly or volunteer). The other participant in the pair is not needed, so they can be observers? Or we can have each pair have two DMs and two separate games? But then we need two states per pair. Let's do: in each pair, both participants will play the role of DM in separate instances. But that might take time. Alternatively, we can have each pair play one instance with one DM and the other as the blackmailer? But we want the blackmailer to be the facilitator. So in each pair, the facilitator will interact with the DM.

        Given 12 participants, we can have 6 DMs and the other 6 are not playing in this phase? But then only half play. Alternatively, everyone is a DM in their own game against the facilitator. So the facilitator will run 12 instances? That might be too time-consuming.

        Instead, we can have each pair do the following: both participants are DMs at the same time. The facilitator flips one coin for the pair to determine the state. Then for each DM in the pair, the game is played independently. But the state is the same for both? That might be okay, but not independent. Or we can flip separate coins for each DM.

        Given time, we can have one coin flip per DM. But flipping 12 coins might be long. We can use a random number generator or have the DMs flip their own coins.

        Steps per DM (with the facilitator):

        1. The DM is given the choice: pay 10 tokens now for insurance or not.
        2. If they choose to pay, collect 10 tokens and their game is over.
        3. If not, the facilitator flips a coin for them.
           - If heads (good): no message, no loss.
           - If tails (bad): facilitator hands them the message and asks if they want to pay 10 tokens to avoid losing 50 tokens.
        4. If they pay after the message, collect 10 tokens. If not, deduct 50 tokens.

     We can do this in parallel for all participants, with the facilitator circulating.

     Alternatively, we can explain the rules to the whole group and then let each participant write their decision for step 1 (pay in advance or not) on a slip. Then the facilitator collects and for those who did not pay in advance, the facilitator flips a coin for each and delivers the message if tails. Then they collect the second decision.

     This can be done in 30 minutes if organized.

     **Debrief (50 minutes)**:
        - First, ask participants to describe their experience in phase 1: 
            - In heads branch: how did you feel about your report? 
            - In tails branch: what did you do? If you reported 'Pay', did you pay? Why or why not?
        - Then phase 2: 
            - How many purchased insurance? 
            - How many did not and then had to face the message? What did they do?
        - Then explain the connection to the decision theories.

     ### Debrief Script:

     We will cover:
        - Counterfactual mugging: 
            - In the game, in the heads branch, you got a bonus if you reported you would pay in tails. In the tails branch, paying was costly and benefited no one (simulating benefit to the heads branch). 
            - The tension: ex-ante, you want to be the kind of person who would pay in the tails branch because that gets you the bonus in heads. But ex-post in tails, you don't want to pay.
            - In the real counterfactual mugging, there is a predictor that is accurate. So you cannot lie in the report. The predictor knows what you would do. So if you would not pay in the tails branch, you don't get the bonus in heads. And in the tails branch, you are asked to pay even though you get nothing. 
            - Decision theories:
               - CDT: in the tails branch, you see that paying doesn't cause any benefit to you (because the heads branch doesn't exist), so you don't pay. But then the predictor would have known that and you wouldn't get the bonus in heads. So you lose out on the bonus.
               - EDT: in the tails branch, paying is evidence that you are the type who would have paid, which is the type that gets the bonus in heads. But since the coin is tails, your action doesn't change the bonus (which is in heads). So EDT might not pay.
               - Functional decision theory (updateless): you act as the agent in the tails branch should act to fulfill the precommitment that would have been optimal ex ante. You pay in the tails branch because that's what your ex-ante self would have wanted, and it's the only way to get the bonus if the coin is heads.

        - XOR blackmail:
            - In the game, if you receive the message, it's evidence that you are in the bad state. But paying after receiving the message doesn't change the state, it only avoids the loss. 
            - The tension: ex-ante, it's better to not insure because you only pay in the bad state. But ex-post, when you receive the message, you know you are in the bad state and you pay to avoid the larger loss. 
            - However, if you had insured, you would have paid regardless of the state. 
            - The unsettling part: the message is only sent if you are in the bad state and you didn't insure. So the message is evidence of the bad state, but it doesn't cause the bad state. 
            - Decision theories:
               - CDT: when you receive the message, you condition on the state being bad. Then paying 10 to avoid 50 is rational. But ex-ante, not insuring is rational because you only pay in the bad state.
               - EDT: when you receive the message, it's evidence that you are in the bad state, so you pay. Ex-ante, not insuring is better because insuring costs 10 in both states, while not insuring costs 10 only in the bad state.
               - Functional decision theory: might also choose not to insure and then pay upon receiving the message.

            The XOR blackmail becomes a problem when we consider logical decision theory and whether the decision to not insure is what allows the message to be sent. But in our game, the facilitator will send the message in the bad state only if you didn't insure, so it is the case that not insuring is what enables the evidence.

     The tension between the two games: 
          - In counterfactual mugging, you might want to precommit to paying in the tails branch to get the bonus in heads. And then in the tails branch, you should follow through even though it's costly.
          - In XOR blackmail, you do not want to precommit (insure) because it's not efficient. You only want to pay in the bad state.
          - But both involve precommitment and ex-post action. A single decision theory might struggle to capture both because in one you want to bind yourself and in the other you don't.

     ### Prediction of what will go wrong:

     - In phase 1, participants might not understand why they are reporting their decision for the tails branch. They might think it's binding.
     - In phase 1, in the tails branch, participants who reported 'Pay' might feel social pressure to pay even though it's costly.
     - In phase 1, the facilitator might have a hard time collecting the reports and then redistributing in time.
     - In phase 2, participants might not understand the insurance mechanism.
     - In phase 2, participants might insure at a high rate because of loss aversion, even though it's not rational.

     How to handle:
        - Explain the rules clearly and provide examples.
        - For phase 1, assure participants that in the tails branch, they are free to choose regardless of their report.
        - For phase 2, emphasize that the state is random and they should think about expected value.

     ### Honest note on limitations:

     - In counterfactual mugging, the predictor is perfect and the participant cannot lie to the predictor. In our game, the report is not verified by actions, and participants can lie. We simulate the predictor by the participant's own report, which is not externally enforced. In the debrief, we must explain that in the real problem, the predictor is accurate and you cannot fool it.

     - In XOR blackmail, the state is determined randomly and independently. In the real problem, the predictor might be using a logical fact or something that is not random. We have simplified to a coin flip.

     - The games are one-shot, whereas in the real problems they are often single-shot as well. But the connection between the precommitment and the ex-post action is not enforced by the rules, but by the decision theory.

     Despite these, the games should make the participants feel the tension.

     Let's write the deliverable accordingly.
answer: |-
  ### Decision Theory Classroom Game: Counterfactual Dilemmas

  #### **Materials & Preparation**
  - **Tokens**: 500+ small tokens (poker chips, beads, or paper slips)
  - **Envelopes**: 24 envelopes (12 labeled "Commitment", 12 blank)
  - **Coins**: 2 coins (1 for group flip, 1 for per-pair flips)
  - **Message Cards**: 12 cards reading: "ALERT: You are in the BAD state. Pay 10 tokens to avoid consequences."
  - **Scoreboard**: Visible tracker of tokens per participant
  - **Timer**
  - **Prep**:
    - Pre-load 6 pairs of envelopes: Each pair contains:
      - "Commitment" envelope: "PREDICTION: If TAILS, you will PAY" or "PREDICTION: If TAILS, you will NOT PAY" (50/50 split, shuffled randomly).
      - Blank envelope for participant's decision slip.
    - Set aside 12 message cards for Phase 2.

  ---

  ### **Rules (Read Aloud to Participants)**

  #### **Phase 1: The Coin Flip Dilemma (Counterfactual Mugging)**
  1. **Setup**:  
     - Each of you gets a sealed "Commitment" envelope with a prediction about your choice in a TAILS world.  
     - I’ll flip a coin for the whole group. HEADS: "Good World." TAILS: "Bad World."  

  2. **Procedure**:  
     - **Step 1 (Pre-flip)**: Write your name on a blank slip. **Do not open envelopes yet!**  
     - **Step 2 (Coin flip)**: I flip the coin publicly.  
     - **Step 3 (Action)**:  
       - If HEADS: Open your "Commitment" envelope. If it says "PREDICTION: PAY," you gain 20 tokens.  
       - If TAILS: Decide privately: **Pay 10 tokens?**  
         - If you pay: Each HEADS-world player (if any) gains 5 tokens.  
         - **Then**, open your "Commitment" envelope: If it predicted "PAY," you gain 20 tokens.  

  3. **Payoffs**:  
     - HEADS: Start +0. Gain +20 tokens if prediction was "PAY."  
     - TAILS: Start +0. Lose 10 tokens if you pay. Gain +20 tokens if prediction was "PAY" *and* you paid.  
     > *No real HEADS players exist in TAILS, but payments "benefit" them theoretically.*

  #### **Phase 2: The Message Dilemma (XOR Blackmail)**
  1. **Setup**:  
     - Pair up (6 pairs). In each pair, one is **Player A** (decision-maker), one is **Player B** (observer).  
     - Player A starts with 50 tokens.  

  2. **Procedure**:  
     - **Step 1 (Pre-commit)**: Player A chooses:  
       - **Option 1**: Pay 10 tokens now → no message, no further costs.  
       - **Option 2**: Pay nothing now → I flip a coin for your state: HEADS (Good), TAILS (Bad).  
     - **Step 2 (State resolution)**:  
       - If Good: No message. Player A loses nothing.  
       - If Bad: I hand Player A a message card. Player A then chooses:  
         - Pay 10 tokens → avoid penalty.  
         - Don’t pay → lose 30 tokens.  
     - Player B observes and takes notes.  

  3. **Payoffs**:  
     - Option 1: −10 tokens (no coin flip).  
     - Option 2 + Good: +0 tokens.  
     - Option 2 + Bad + Pay: −10 tokens.  
     - Option 2 + Bad + Don’t pay: −30 tokens.  

  ---

  ### **Timeline (Total: 120 mins)**
  - **Setup (10 mins)**: Distribute envelopes, explain tokens, pair up for Phase 2.  
  - **Phase 1 (30 mins)**:  
    - 5 mins: Rules & write names on slips.  
    - 2 mins: Coin flip.  
    - 15 mins: Resolve actions/payoffs (HEADS: open envelopes immediately; TAILS: deliberate 3 mins, then pay/collect).  
    - 8 mins: Token tally.  
  - **Phase 2 (30 mins)**:  
    - 5 mins: Rules.  
    - 15 mins: Players A decide pre-commit → resolve states → message decisions.  
    - 10 mins: Token tally.  
  - **Debrief (50 mins)**: Guided discussion (see script below).  

  ---

  ### **Payoff Scheme**
  - **Starting tokens**: 0 (Phase 1), 50 (Phase 2 for Player A).  
  - **Phase 1**:  
    - HEADS: +20 if prediction = "PAY."  
    - TAILS: −10 if pay. +20 if (prediction = "PAY" AND pay).  
  - **Phase 2**:  
    - Pre-pay: −10.  
    - No pre-pay + Good: +0.  
    - No pre-pay + Bad + pay: −10.  
    - No pre-pay + Bad + no pay: −30.  
  - **Total score**: Phase 1 + Phase 2 tokens. Top 3 scorers pick next week’s snacks.  

  ---

  ### **Debrief Script (50 mins)**  
  *(After gameplay, before naming theories)*  
  **Facilitator**: "Let’s unpack what happened. Phase 1 TAILS players: Why did some pay 10 tokens even though no HEADS players existed?"  
  - *Listen: Highlight feelings of obligation, prediction-matching, or FOMO.*  

  **Facilitator**: "Phase 2 Player As: Why did some avoid pre-paying even when the message scared them?"  
  - *Listen: Note risk-saving, regret upon seeing the message.*  

  **Map to Decision Theories**:  
  1. **Counterfactual Mugging Structure**:  
     - "In Phase 1, the 'prediction' was a stand-in for a perfect predictor. Paying in TAILS felt wasteful locally, but if you *didn’t* pay, you might have missed the +20 bonus if you’d been in HEADS. This is **counterfactual mugging**."  
     - CDT: "Only cares about causal impact in your branch. In TAILS, paying doesn’t cause HEADS players to gain tokens (they don’t exist!), so CDT says: DON’T PAY."  
     - EDT/FDT: "Treats your action as *evidence* about what the predictor saw. If paying in TAILS is linked to the predictor rewarding you in HEADS, they say: PAY."  

  2. **XOR Blackmail Structure**:  
     - "In Phase 2, the message was evidence you were in the BAD state. But if you pre-paid, you never got the message—even in BAD. This is **XOR blackmail**."  
     - CDT/EDT: "Pre-paying costs 10 tokens unconditionally. No pre-pay + pay only in BAD costs 10 tokens *conditionally*. Both say: DON’T PRE-PAY."  
     - FDT: "Sees pre-paying as 'breaking the mechanism' that sends messages only in BAD. If you hate being blackmailed, FDT says: PRE-PAY to erase the threat entirely."  

  **The Tension**:  
  - "Counterfactual mugging pulls you to PAY in the 'losing branch' to satisfy a cross-branch policy. XOR blackmail pulls you to NOT PRE-PAY to avoid wasteful spending. But if you use one logic for both, you lose out! This is why no single theory 'wins' everywhere."  

  ---

  ### **Predicted Failures & Fixes**  
  1. **Phase 1 confusion**:  
     - *Problem*: TAILS players think paying benefits HEADS players *now*.  
     - *Fix*: Stress: "HEADS players don’t exist in TAILS. Payments are *theoretical*."  

  2. **Phase 2 over-insuring**:  
     - *Problem*: Players A pre-pay to "avoid stress," ignoring statistics.  
     - *Fix*: Pre-game math demo: "Pre-paying costs 10; no pre-pay averages −5 tokens (−10 if 50% Bad)."  

  3. **Prediction mistrust**:  
     - *Problem*: Suspicion that envelopes are manipulated.  
     - *Fix*: Pre-show random assignment of "PAY"/"NOT PAY" envelopes.  

  ---

  ### **Limitations & Closing Gap**  
  - **Limitation**: Real counterfactual mugging relies on **perfect prediction**, but our envelopes are random. XOR blackmail assumes **logical correlation** between your choice and the message, but we use coins.  
  - **Closing the Gap**: "In the *real* problems, predictors know your *actual* policy, not random guesses. Your action isn’t just about this branch—it’s a signal about how you handle branches *in general*. This is why **updateless decision-making** (FDT) treats choices as defining a *rule* for all possible worlds."  

  --- 
  This design forces participants to viscerally grapple with paying in "losing branches" (Phase 1) and distrusting alarming messages (Phase 2). The debrief reveals the tension: CDT/EDT handle one dilemma well but clash in the other, setting up functional decision theory as a resolution.
