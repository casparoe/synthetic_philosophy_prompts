answer: |-
  You've hit on a profound tension at the heart of democratic practice. The asymmetry between using sortition for juries and elections for legislatures rests on several interrelated presuppositions, though none are entirely airtight, and the rise of citizens' assemblies highlights this tension. Let's break it down:

  **The Presupposed Differences Legitimating the Asymmetry:**

  1.  **Nature of the Task (Application vs. Creation):**
      *   **Jury:** Primarily seen as *applying* pre-existing legal rules (law) to ascertained facts to determine guilt/innocence or liability. They interpret the law *as given* within a specific, bounded case.
      *   **Legislature:** Primarily seen as *creating* new legal rules, setting broad policy agendas, allocating vast resources, and making complex, forward-looking decisions affecting the whole society. They engage in normative choice and negotiation.
      *   **Justification:** Random selection is deemed sufficient for applying known rules to facts, requiring common sense and community morality ("the conscience of the community"). Creating complex, coherent, and effective laws governing diverse areas requires specialized knowledge, negotiation skills, political vision, and accountability for broad consequences – qualities elections are (theoretically) meant to incentivize and select for.

  2.  **Kind of Representativeness:**
      *   **Jury:** Needs to represent **"the conscience of the community"** or a **"cross-section"** of society. The goal is impartiality *within the case*, reflecting diverse community perspectives on the facts and the application of the law *to those facts*. Representatives *of the community's moral judgment* on a specific event.
      *   **Legislature:** Needs to represent **the political will, diverse interests, and identities** of the broader populace. This requires deliberation on conflicting values, bargaining, coalition-building, and being responsive to constituent needs and preferences *over time*. Representatives *as agents* acting *for* the people.
      *   **Justification:** Sortition achieves descriptive representativeness (mirroring society) well, ideal for the jury's impartial judgment role. Elections are seen as achieving *authorized* representativeness (principal-agent relationship) and *responsive* representativeness, crucial for continuous lawmaking and policy-setting where agents need a mandate and accountability.

  3.  **Epistemic Demands and Scope:**
      *   **Jury:** Focuses on a single, bounded case. Requires ordinary powers of observation, reason, judgment, and common sense. The evidence and law are presented *to* them; their task is deliberation *within that frame*. Specialized expertise is actively discouraged (hence exclusion of lawyers/judges in many cases).
      *   **Legislature:** Requires continuous engagement with vast, complex, and often technical domains (economics, environment, defense, social policy). Demands foresight, strategic thinking, negotiation, understanding systemic effects, and integrating diverse information streams. Needs specialized knowledge (or access to it) and political skill.
      *   **Justification:** Ordinary citizen competence is sufficient for the bounded jury task. The legislature's complex, ongoing, and knowledge-intensive work allegedly requires individuals with higher levels of expertise, experience, and political acumen, which elections (imperfectly) aim to select.

  4.  **Scale, Frequency, and Finality:**
      *   **Jury:** Small group (6-12), convened for *one* case, then dissolves. Decision is final (subject to appeal on procedure/law, not facts).
      *   **Legislature:** Large body (hundreds), permanent institution. Makes numerous, interlinked decisions continuously over years. Decisions are constantly revisited and amended.
      *   **Justification:** The ephemeral, case-specific nature of juries makes sortition practical. The permanence and complexity of the legislature necessitate continuity, institutional memory, and the development of expertise – harder to achieve with constantly rotating random members.

  **Internal Consistency and the Challenge of Hybrid Bodies (Citizens' Assemblies):**

  *   **The Blurred Line:** Your insight is crucial. The distinction between "applying" and "creating" norms is often fuzzy. Juries *do* interpret law, sometimes setting de facto precedents in their communities. Legislatures *do* apply broad principles to specific policy contexts. Citizens' assemblies explicitly blur this line: randomly selected citizens tasked with deliberating on complex policy or constitutional issues (e.g., abortion, electoral reform, climate policy) and *making recommendations* or even *drafting proposals* for lawmakers or the public.
  *   **Do Hybrid Bodies Undermine the Asymmetry? Yes, significantly.** Their existence and perceived legitimacy in tackling complex "lawmaking-adjacent" tasks directly challenge the presupposition that sortition is *only* suitable for bounded fact-finding/application. They demonstrate that:
      *   Ordinary citizens *can*, given adequate time, resources, balanced information, and facilitated deliberation, grapple with complex policy issues and develop sophisticated, widely-respected recommendations.
      *   Descriptive representativeness *can* be valuable for normative deliberation on fundamental societal choices, potentially offering greater legitimacy on divisive issues than elected bodies captured by partisanship or special interests.
      *   The epistemic demands of complex policy deliberation *can* be met through process design (expert testimony, learning phases, structured deliberation), not just pre-existing individual expertise.
  *   **The Counter-Argument:** Proponents of the asymmetry might argue citizens' assemblies are usually *advisory*, not sovereign. Their legitimacy stems from being well-designed deliberative processes focused on specific issues, not from wielding ongoing sovereign power. They supplement, rather than replace, elected bodies.

  **If the Presupposition is False: What Gives Way?**

  If we conclude the distinctions are insufficient to justify the asymmetry, and whatever legitimates sortition for juries *could* in principle legitimate it for legislatures, we face a fundamental choice:

  1.  **Radical Reform: Start Selecting (Some) Legislators by Lot:**
      *   **Models:** This could range from replacing the entire legislature (ancient Athenian model, but impractical at modern scale) to mixed models:
          *   A second chamber (e.g., a "Citizens' Senate") selected by lot, balancing the elected lower house.
          *   A significant proportion of seats in a unicameral legislature filled by lot.
          *   Sortition for specific legislative functions (e.g., oversight committees, constitutional conventions).
      *   **Implications:** This would profoundly reshape democracy. It would prioritize descriptive representativeness and deliberative democracy over electoral authorization and accountability. It would require massive investment in civic education and deliberation infrastructure. It challenges deeply held notions of political leadership and mandate.

  2.  **Conservative Reform: Stop Selecting Jurors by Lot:**
      *   **Models:** Move to professional juries, elected juries, or juries selected based on expertise relevant to the case.
      *   **Implications:** This would abandon a centuries-old cornerstone of common law justice. It risks undermining the perceived legitimacy and "common sense" foundation of jury verdicts. It increases the risk of professionalization bias or capture by special interests. It's politically and culturally unlikely.

  **The Most Likely Path: Neither Extreme, But Evolution**

  History and the rise of citizens' assemblies suggest neither extreme is likely. Instead:

  *   **Citizens' Assemblies Expand:** Their use for complex, values-based policy dilemmas and constitutional questions will likely grow, acting as influential advisory bodies *alongside* elected legislatures. This expands the domain of sortition without replacing elections for core lawmaking.
  *   **Jury Sortition Endures:** The symbolic and practical value of lay juries for criminal justice is deeply entrenched and unlikely to disappear.
  *   **The Asymmetry Softens:** The *strict* principled distinction between "application" and "creation" becomes harder to maintain. The justification shifts towards acknowledging differences in **scope, permanence, and the nature of accountability required**:
      *   Sortition is seen as uniquely legitimate for bounded, specific, impartial judgment tasks (juries, certain citizen panels).
      *   Elections are seen as necessary (if flawed) for bodies wielding broad, continuous, sovereign power requiring direct authorization and ongoing political accountability to the electorate.
  *   **Hybridity is Embraced:** Democratic systems become more complex, incorporating elements of both sortition (for deliberation, legitimacy on specific issues) and election (for authorization, accountability, and general governance), recognizing that different democratic goods (representativeness, accountability, deliberation, effectiveness) may be best served by different selection mechanisms for different tasks.

  **Conclusion:** The asymmetry rests on presuppositions about the nature of the tasks (application vs. creation), the type of representativeness needed (community conscience vs. political agency), and epistemic demands (common sense vs. expertise). While these distinctions have intuitive and historical weight, they are not watertight. Citizens' assemblies demonstrate that sortition *can* legitimately tackle complex normative deliberation, blurring the line. This doesn't mandate replacing legislatures with sortition, but it powerfully challenges the assumption that sortition is *only* for juries. It points towards a more pluralistic democratic future where different selection mechanisms are used for different purposes, based on a more nuanced understanding of the tasks and the democratic goods each mechanism best provides. The tension you identified is real, productive, and driving democratic innovation.
