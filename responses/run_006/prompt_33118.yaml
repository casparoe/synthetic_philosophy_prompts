answer: |-
  The tension you identify between the Outer Space Treaty (OST) and the Artemis Accords hinges on reconciling the prohibition of *national appropriation* with the permissibility of *resource extraction*. The Accords' coherence relies on an implicit theory of property that draws from **classical liberal conceptions of resource use**, primarily **Grotian usufructuary principles** blended with **Lockean labour theory**, while explicitly rejecting permanent sovereignty claims. Here’s the philosophical reconstruction:

  ### The Implicit Theory of Property in the Artemis Accords
  1. **Distinction Between Sovereignty and Usufruct Rights** (Grotian Influence):  
     - Hugo Grotius’ *Mare Liberum* (1609) argued that the sea could be *used* (e.g., fishing, navigation) without being *owned*. The Accords analogise space to this "commons" model: celestial bodies are *res communis* (common property of mankind), but their **resources are severable**.  
     - Extraction is framed as a *non-sovereign act*: a "use right" akin to harvesting fish from international waters. This avoids "appropriation" by limiting rights to *extracted resources only*, not the underlying land.  

  2. **Labour-Based Acquisition** (Lockean Proviso):  
     - John Locke’s theory holds that property rights arise when labour is mixed with unowned resources (*Two Treatises of Government*), provided "enough and as good" is left for others (the "proviso").  
     - The Accords imply that **extraction confers ownership** *only* over the specific resources removed through effort (e.g., mined ice). The proviso is satisfied by:  
       - **Non-interference clauses**: Prohibiting claims that obstruct others’ access.  
       - **Transparency**: Requiring public disclosure of operations to prevent monopolisation.  

  3. **Rejection of Permanent Control**:  
     - Unlike territorial property, Artemis signatories gain no *exclusive control* over extraction sites post-operation. Rights are **temporary, activity-specific, and non-exclusive** – aligning with OST’s ban on "occupation".  

  4. **The "Safety Zone" Fiction**:  
     - The Accords permit "safety zones" around operations to prevent harmful interference. Philosophically, this resembles **Robert Nozick’s "boundary crossing" principle**: temporary exclusion is justified only to prevent physical disruption, not to assert sovereignty.  

  ---

  ### Philosophical Underdetermination: Multiple Theories Could License Extraction  
  The practice *is* underdetermined. Rival property theories could justify resource use, but with divergent conditions:  

  | **Theory**               | **Basis for Extraction**                     | **Required Changes to Artemis Accords**          |  
  |--------------------------|---------------------------------------------|------------------------------------------------|  
  | **Lockean Labour Theory** | Labour mixing creates ownership              | Stricter "proviso" enforcement (e.g., resource caps or mandatory redistribution). |  
  | **Grotian Usufruct**     | Use without ownership of corpus             | Status quo – Accords already mirror this.       |  
  | **Common Heritage (CHM)**| Resources as collective inheritance          | **Major overhaul**: Benefit-sharing, moratorium on extraction until international regime exists, bans on private ownership. |  
  | **Utilitarian**          | Maximising human welfare through exploitation | Prioritise "efficient" use over equity – weak safeguards for equitable access. |  

  ---

  ### Implementing a Common Heritage Regime: Necessary Changes  
  A Common Heritage of Mankind (CHM) model (as in the Moon Agreement) would require radical revisions to the Accords:  

  1. **Mandatory Benefit-Sharing**:  
     - Replace voluntary "information sharing" with obligatory technology transfer or revenue-sharing (e.g., a percentage of profits to a global fund).  
     - **Philosophical shift**: Resources as collective property, not "finders-keepers".  

  2. **International Licensing Body**:  
     - Replace national authorisation with an ISA-style authority (modelled on the UN Convention on the Law of the Sea) to approve/regulate extraction.  

  3. **Moratorium on Exploitation**:  
     - Suspend extraction until equitable rules are established globally – contra Artemis' "go now, regulate later" approach.  

  4. **Non-Privatisation Clause**:  
     - Explicitly state that extracted resources remain international property until distributed under agreed rules.  

  5. **Redefine "Safety Zones"**:  
     - Limit zones to prevent de facto territorial claims; impose time-bound, renewable permits.  

  ---

  ### Conclusion: A Grotian-Lockean Hybrid  
  The Artemis Accords presuppose a **neo-Grotian framework**: space is an *impermanent commons* where use rights arise from labour and technology, constrained only by non-appropriation and non-interference. This sidesteps Locke’s proviso by assuming infinite resources (practically untenable) and ignores distributive justice.  

  A CHM regime would reject this, treating space resources as a *corpus* held in trust, requiring affirmative duties to mankind. The Accords’ philosophy is thus neither purely Lockean nor Grotian but a pragmatic, **neo-colonial interpretation of usufruct** – one that is legally plausible under the OST but philosophically contentious. Whether this "exploitation without appropriation" holds depends on whether states accept that **transient control ≠ property** – a fiction that may collapse as lunar stakes rise.
