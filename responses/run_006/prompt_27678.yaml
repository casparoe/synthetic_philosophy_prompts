  First, let me understand the core positions. Clara represents the traditional objection to expressivism: if moral language expresses attitudes rather than propositions, it can't explain how moral terms function identically in embedded contexts like conditionals. David defends expressivism by arguing that validity can be understood through consistency of attitudes rather than truth conditions, and that compositionality challenges affect all semantic theories.

  Breaking down the exchange chronologically:

  Clara's opening salvo is strong - she correctly identifies why embedding is problematic for expressivists. The equivocation concern when moving from asserted to unasserted contexts is indeed the heart of Frege-Geach. Her point about valid reasoning appearing to depend on uniform meaning is well-made.

  David's first counter has merit but overreaches. While it's true that realists also appeal to norms of reasoning, he misses that their account has a straightforward explanation for uniform meaning across contexts via propositions. His "metaphysical decoration" dismissal is too quick.

  When Clara distinguishes logical validity from psychological consistency, she scores a direct hit. David's attempt to reduce logic to attitude coherence fails to capture necessity and formality - logic should hold regardless of anyone's actual attitudes.

  David's response about "mysterious realist posits" is weaker. Rejecting propositions altogether leaves expressivism without adequate tools to explain logical relations. Blackburn's quasi-realism project acknowledges this by trying to reconstruct proposition-like entities.

  Clara's recursion objection is powerful. Higher-order attitudes for complex embeddings seem increasingly implausible and lack the systematicity that proposition-based accounts offer. This exposes a genuine weakness in expressivist approaches.

  David's compositionality defense is his strongest point. All semantic theories struggle with compositionality, and propositions don't automatically solve it. But he understates how much harder this is for expressivists without truth-conditional content.

  Overall, Clara lands more substantive blows. Her objections target expressivism's core weaknesses: explaining logical necessity without propositions, and handling complex embeddings systematically. David makes reasonable defensive moves but doesn't overcome the fundamental challenges. The burden remains on expressivists to provide a satisfactory solution to Frege-Geach.
answer: |-
  Here's a step-by-step adjudication of Clara and David's exchange, delivering a committed verdict on each move and the overall position:

  ### Round 1: Clara's Opening Argument
  **Clara's Point:** Expressivism cannot explain the uniform meaning of "wrong" in asserted vs. embedded contexts (e.g., the antecedent of a conditional). This leads to equivocation in inferences that *appear* logically valid.  
  **Verdict:** **Clara scores decisively.** She correctly identifies the core technical problem: expressivism must explain why "wrong" contributes the *same semantic content* in non-asserted contexts where no attitude is expressed. Her example of modus ponens demonstrates a valid inference that would collapse if "wrong" meant something different in the conditional premise versus the categorical premise. This isn't just a "technical challenge"—it exposes a foundational incoherence in early expressivism.

  ### Round 2: David's First Rebuttal
  **David's Point:** Realists also ground validity in normative claims about rational commitment (e.g., "you can't accept premises and reject conclusion"). Expressivists can similarly define validity as a prohibition against incoherent combinations of attitudes.  
  **Verdict:** **David scores partially, but misses the mark.** He's right that realists rely on normative norms of rationality, and that expressivists *can* define a notion of "inconsistency" for attitudes (à la Blackburn). However, this confuses two distinct issues:  
  - **Logical Validity:** Concerns *propositional structure* (e.g., "P & (P → Q) entails Q").  
  - **Psychological Consistency:** Concerns *mental state coherence*.  
  David fails to show how expressivism accounts for the *former* without smuggling in propositions. Validity depends on the *content* of the claims, not (just) the speaker's psychology. **Point still leans to Clara.**

  ### Round 3: Clara's Distinction
  **Clara's Point:** Validity is about logical structure, not psychological discomfort. It holds regardless of anyone's attitudes.  
  **Verdict:** **Clara lands a knockout punch.** She exposes David's conflation: logical validity is *necessary* and *formal* (if premises are true, conclusion *must* be true), whereas psychological consistency is contingent and subjective. An expressivist might define "incoherence" for attitudes, but this doesn’t explain *why* "If lying is wrong, then getting your brother to lie is wrong" has the *logical form* of a material conditional. Realists ground this in truth-conditional content; expressivists owe a parallel account. David hasn't provided it.

  ### Round 4: David's Appeal to Anti-Realism
  **David's Point:** "Logical structure of claims" is a mysterious realist posit. Blackburn explains validity via clashes in commitments.  
  **Verdict:** **David's weakest move.** Dismissing logical structure as "metaphysical decoration" ignores that *all* semantic theories (including expressivist ones) must explain compositional meaning. Blackburn’s quasi-realism *attempts* to reconstruct logical structure from attitudes, but this is precisely what’s contested. If "P → Q" isn’t a proposition with truth conditions, what *is* its semantic function? David offers rhetoric ("mysterious posit") where Clara demands explanation. **Clear win for Clara.**

  ### Round 5: Clara's Recursion Objection
  **Clara's Point:** Embedding problems recurse (e.g., conditionals within conditionals). Expressivism needs ever-higher-order attitudes without a uniform account of "wrong."  
  **Verdict:** **Clara devastates.** Complex embeddings (e.g., negations, disjunctions, nested conditionals) require a *systematic, compositional* semantics. Expressivism reduces "wrong" to a *speech act* (e.g., "boo!") in simple assertions, but in "If lying is wrong...," it must function as a *logical component*. Attitude hierarchies (e.g., "disapproving of not disapproving of lying") are ad hoc, lack uniformity, and struggle with quantification ("Something is wrong"). **This is the expressivist’s deepest wound.**

  ### Round 6: David's Compositionality Defense
  **David's Point:** Compositionality is hard for everyone. Realists "help themselves" to propositions without explaining how they compose.  
  **Verdict:** **David scores a minor point but loses the war.** He's correct that compositionality isn’t trivial for realists (e.g., possible worlds semantics face challenges). However, realists have a *unified framework*: "wrong" denotes a property across all contexts, composing via standard logic. Expressivists lack this. They must *reconstruct* compositionality from attitudes—a task no one has fully accomplished without approximating realism (e.g., Horgan and Timmons' "cognitive expressivism"). David’s equivalence ("realists haven’t solved it either") is false: realists have robust, widely accepted tools (propositions, functions, intensions); expressivists have contested workarounds. **Clara still dominates.**

  ---

  ### Final Verdict: **Clara Wins the Exchange**
  - **Why Clara Prevails:** She consistently forces expressivism to confront its core weakness: explaining logical and semantic phenomena *without propositions*. Her points about uniform meaning, formal validity, and recursive embedding are unanswered. David’s defenses either conflate logic with psychology (Round 2) or retreat to "all theories have problems" (Round 6), which doesn’t resolve expressivism’s *unique* deficiencies.
    
  - **David’s Fatal Flaw:** He assumes that mimicking realist *outputs* (e.g., "validity rules") suffices. But expressivism must also explain *how* moral language *systematically* generates those outputs from non-cognitive inputs. Blackburn’s project (e.g., *Spreading the Word*) tries this but ultimately relies on *simulating* propositional content—undermining expressivism’s anti-realist motivation.

  - **Overall:** The Frege-Geach problem remains a **devastating objection** to classical expressivism. Sophisticated quasi-realist versions (Blackburn, Gibbard) mitigate it but at the cost of complexity and creeping realism. Clara’s position—that embedding exposes a fatal discontinuity in expressivist semantics—is stronger. David’s counterarguments don’t overcome this; they highlight expressivism’s need to borrow realist tools while denying their foundation.
