  1. **Indexical Uncertainty and Bayesian Updating**: Both agree that in cases of indexical uncertainty (uncertainty about one's own identity or position in a universe), rational agents should update their beliefs using a form of Bayesian reasoning that accounts for the fact that they are observing the world from a particular perspective.

  2. **The Importance of Observer Counting**: Both agree that the number of observers in a possible world is a crucial factor in evaluating the probability of being in that world. However, they differ in how they incorporate these numbers.

  3. **The Sleeping Beauty Problem**: Both accept the setup of the Sleeping Beauty problem as a legitimate thought experiment for exploring self-locating beliefs. They agree that Beauty's credence in the coin being heads should be updated upon awakening, though they may differ on the exact update.

  4. **The Doomsday Argument Setup**: Both accept the basic setup of the Doomsday argument: we consider the total number of humans who will ever exist (N), and our birth rank (n). They agree that if we are selected randomly from all humans, then the posterior probability that N is small is higher than the prior. However, they disagree on whether this random sampling is appropriate.

  5. **The Presumptuous Philosopher Setup**: Both accept the thought experiment: two theories T1 and T2, where T1 predicts 1 trillion observers and T2 predicts 1 billion, and both fit the data equally well. They agree that the issue is how to assign prior probabilities to these theories and update upon finding that one is an observer, but they disagree on the outcome.

  6. **The Non-Indexical World Uncertainty**: Both agree that for non-indexical uncertainty (e.g., the outcome of a coin flip that has no bearing on the number of observers), standard Bayesian updating applies.

  7. **The Role of Physical Probability**: Both agree that in cases involving physical chances (like coin flips), the physical probability should be integrated with observer counting in the update.

  8. **Rejection of the Absolute Self-Indication Assumption in Extreme Forms**: Both reject the extreme form of SIA that would allow arbitrarily large universes to dominate regardless of prior probabilities. They agree that there must be a balance with the prior.

  9. **The Need for a Reference Class**: Both agree that we must specify a reference class of observers to which we belong. The choice of reference class (e.g., humans, conscious beings, etc.) is a common problem for both.

  10. **The Importance of Thought Experiments**: Both agree that thought experiments are a valid method for exploring the implications of different anthropic principles.

