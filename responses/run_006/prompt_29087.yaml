  I'm not an academic, I just fell down a rabbit hole reading about the concept of disease, and there's an argument that seems to have been going in circles forever. One side (I think they're called naturalists) says health and disease are real biological facts: roughly, your body is healthy when its parts are doing what they statistically normally do for your age and sex, and a disease is just a deviation from that. The other side says values always sneak into the definition: calling something a disease involves judging it bad or harmful, and what counts as bad shifts with culture and time. What confuses me is that both sides mostly agree on the actual cases, and they use the same examples (deafness, obesity, the blood pressure threshold that keeps moving, conditions that used to be diseases and aren't anymore), yet neither side budges. My working theory is that they're mostly talking past each other — one side doing biology, the other doing semantics — but I can't tell if that's right or if there's a real substantive core underneath. I don't want a verdict on who's correct; I want a diagnosis of the disagreement itself: is it a factual question about biology, a verbal dispute about the word 'disease', or a deeper standoff about wether values can be part of a definition of something real? What would have to change for the debate to actually move — a new empirical discovery, a conceptual distinction, or something else? Act as an expert in philosophy of medicine and philosophy of science, think carefully, and start by brainstorming the possible sources of the impasse before settling on a diagnosis. After your diagnosis, give me a brief structured summary as a JSON object with these fields: 'diagnosis' (one sentence on what kind of disagreement this is), 'camps' (array with each position in one short phrase), 'hidden_question' (the real question underneath, or null if there isn't one), 'what_progress_would_look_like' (given your diagnosis), and 'confidence' (low, medium, or high).
