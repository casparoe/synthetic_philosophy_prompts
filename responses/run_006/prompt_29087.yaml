  This is clearly a philosophical question about the nature of disease. The naturalist position sees disease as a value-free biological dysfunction, while the normativist view insists that calling something a disease always involves value judgments about harm or undesirability. What makes this tricky is that both positions can explain most real-world examples - they just interpret them differently. For instance, naturalists might see obesity as statistically abnormal function, while normativists focus on how we value certain body types.

