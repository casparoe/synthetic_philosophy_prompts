  The debate over Frankfurt cases and the principle of alternative possibilities has been running since 1969, and despite an enormous literature full of increasingly baroque counterexamples and replies, the core dispute feels frozen. Frankfurt's original move was to describe a case where an agent couldn't have done otherwise—a counterfactual intervener would have forced the same action—yet seems intuitively responsible. PAP-defenders replied with the flicker-of-freedom strategy: there is always some alternative possibility, however thin—a different neural event, a different facial expression, a different moment of decision. Frankfurt's side then built cases meant to eliminate even those flickers. At this point both sides agree on the case-descriptions and on the phenomenology of the examples; they disagree about whether the remaining alternatives matter for responsibility, and about what the cases are even supposed to test. My hypothesis is that the impasse reflects a deeper disagreement about the function of the concept of moral responsibility—whether it is fundamentally about the agent's actual quality of will at the moment of action, or about the agent's standing in a broader practice of holding answerable that requires genuine alternative pathways. Diagnose this debate: is it a substantive metaphysical disagreement, a verbal dispute about what we mean by "could have done otherwise," a clash of starting intuitions that neither side can argue for, or something else? Be specific about what each side's position commits it to, and then tell me what, if anything, would count as progress—a new kind of case, a formal result, a conceptual distinction, or an argument that the question is ill-posed.

  After your diagnosis, please provide a structured summary as a JSON object with the following fields:

  - `"diagnosis_type"`: one of `"substantive_metaphysical"`, `"verbal"`, `"intuition_clash"`, `"ill_posed"`, or `"other"` (with a brief explanation if `"other"`).
  - `"what_each_side_would_need_to_concede"`: an object with keys `"PAP_defenders"` and `"PAP_critics"`, each a string.
  - `"progress_possible"`: boolean.
  - `"if_progress_possible_how"`: a string describing what would move the debate, or `null` if progress is not possible.
