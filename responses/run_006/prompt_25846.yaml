  ### Diagnosis of the Frankfurt-PAP Debate

  The impasse in the Frankfurt-PAP debate is **not merely a verbal dispute or a clash of intuitions**, but a **substantive metaphysical disagreement** rooted in divergent conceptions of moral responsibility itself. Here’s why:

  1. **Substantive Metaphysical Disagreement**:  
     - The core conflict centers on the *necessary conditions for moral responsibility*. PAP defenders (e.g., libertarians, some compatibilists) argue that alternative possibilities (AP) are metaphysically required for responsibility because responsibility depends on an agent’s capacity to avoid an action. PAP critics (Frankfurtians) deny this, contending that responsibility is grounded solely in the agent’s actual sequence of mental states (e.g., intentions, values, quality of will) at the time of action.  
     - This disagreement is metaphysical because it concerns the nature of free will, causation, and the structure of agency. It is substantive because both sides agree on the empirical details of Frankfurt-style cases (e.g., neural processes, counterfactual interveners) but draw different conclusions about what those details imply for responsibility.  
     - The hypothesis about the "function of moral responsibility" highlights this divide: PAP critics see responsibility as **attributability** (an agent’s moral quality of will), while PAP defenders see it as **accountability** (an agent’s role in a practice of mutual answerability that requires avoidability). These are incompatible metaphysical stances about what responsibility *is*.

  2. **Why It’s Not Primarily Verbal or Intuitional**:  
     - **Not verbal**: Both sides largely agree on the meaning of "could have done otherwise" (e.g., as the presence of robust alternatives). Disagreements about "thin" flickers (e.g., neural flickers) are not semantic but about whether those flickers *matter* for responsibility.  
     - **Not just intuition-clash**: While initial intuitions diverge, the debate has evolved into structured arguments about necessity and sufficiency conditions (e.g., whether quality of will *alone* suffices for responsibility). Intuitions are now secondary to theoretical commitments.  
     - **Not ill-posed**: The question ("Does responsibility require AP?") is coherent and empirically relevant (e.g., to criminal law or AI ethics). The stalemate arises from deep theoretical fault lines, not confusion.

  3. **Commitments of Each Side**:  
     - **PAP defenders** must maintain that:  
       - Responsibility requires *some* robust alternative pathway (even if "flickers" exist).  
       - Eliminating all flickers would undermine responsibility, as accountability depends on avoidability.  
       - Consequence: They must deny that Frankfurt cases truly eliminate AP or insist that residual flickers (e.g., a different decision-timing) are responsibility-relevant.  
     - **PAP critics** must maintain that:  
       - Responsibility is determined *entirely* by the actual sequence (e.g., the agent’s reasons, intentions, or quality of will).  
       - Counterfactual interveners are irrelevant if they don’t affect the actual sequence.  
       - Consequence: They must argue that flickers are irrelevant to responsibility, even if present.  

  4. **Pathways to Progress**:  
     - **Progress is possible** but requires moving beyond case-crafting. The debate is frozen because both sides have exhausted the strategy of tweaking Frankfurt cases. Progress demands:  
       - **A conceptual distinction**: Clarifying the ambiguity in "moral responsibility" (e.g., distinguishing *attributability* from *accountability*). If PAP critics focus on attributability (agent’s character) and defenders on accountability (social practices), the dispute shifts to which concept is central.  
       - **A formal result**: Using causal modeling or decision theory to show whether avoidability is entailed by (or separable from) actual-sequence properties. For example, proving that certain modal properties (e.g., robustness to interventions) are necessary for responsibility.  
       - **Meta-ethical argument**: Resolving the deeper disagreement about the *function* of responsibility. If responsibility is primarily about desert (grounded in quality of will), Frankfurtians win. If it’s about fair social practices (requiring avoidability), PAP defenders win.  
     - **What would break the impasse**:  
       - PAP defenders must concede if a case with *zero* flickers (even irrelevant ones) still elicits near-universal intuitions of responsibility.  
       - PAP critics must concede if it can be shown that actual-sequence properties *depend* on alternative possibilities (e.g., if intentions require the ability to choose otherwise).  

