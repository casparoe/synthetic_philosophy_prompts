  Now, the limitation. The Hard Problem of Content comes to mind. How do we naturalize "indicating" without circularity? If indication relies on correlation, but correlation alone doesn't fix content, we might end up with indeterminacy. Also, if the consumer can't differentiate between causes, like flies vs. look-alikes, does that mean the content is disjunctive? But the theory says no, because success depends on the specific cause in Normal conditions.

