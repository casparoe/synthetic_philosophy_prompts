answer: |-
  ## Joint Statement: Adversarial Collaboration on the Moral Difference Between Lying and Misleading

  **Collaborators:** Representatives of the Asymmetry Camp and the Parity Camp

  **Date:** October 26, 2023

  **1. Agreed Claims**

  Both camps agree on the following substantive points:

  1.  **Definition of Lying:** An agent *lies* if and only if:
      *   They assert that P (where asserting involves presenting P as true).
      *   They believe that P is false.
      *   They intend that their audience come to believe that P is true (or to be reinforced in that belief).

  2.  **Definition of Merely Misleading:** An agent *merely misleads* if and only if:
      *   They communicate in a way (which may or may not involve a direct assertion) that they intend to cause their audience to form a false belief Q (or be reinforced in a false belief Q).
      *   Their communication does not itself constitute a lie *with respect to Q*. This includes:
          *   Asserting something true that they reasonably expect will cause the audience to infer the false Q (e.g., answering "Is Bob in his office?" with "Bob's car is in the lot," knowing Bob carpooled).
          *   Remaining silent when speaking would correct a false belief they know the audience holds.
          *   Making an utterance that is literally true but pragmatically misleading due to implicature or context (e.g., "I didn't *take* the cookies from the jar" when you watched someone else do it, implying non-involvement).
          *   Using non-verbal deception not constituting an assertion (e.g., feigning ignorance through gesture).

  3.  **Boundary Case - True but Misleading Assertion:** Both camps agree that an utterance can be a true assertion (and thus *not* a lie) while simultaneously being intentionally misleading. Answering a direct question with a true statement specifically chosen to exploit the audience's likely inferences and lead them to a false belief is a paradigm case of *merely misleading*, not lying, concerning the false belief Q.

  4.  **The Core Question:** The disagreement concerns the following precise question: "Holding all other *morally relevant factors constant* (e.g., the falsity of the belief induced, the speaker's intent to deceive, the harm or disrespect intended or risked, the vulnerability of the audience, the topic, the relationship, the ease of detection), does the act of *lying*, as defined above, possess a *distinctive wrong-making feature* that is absent in cases of *merely misleading* deception (as defined above) that successfully induces the same false belief?"

  5.  **Paradigm Cases Illustrating the Distinction:** Both camps agree on the structure of cases where lying and misleading come apart under ceteris paribus conditions:
      *   **Case A (Lying vs. Misleading Assertion):** Agent X asks Agent Y: "Did you eat the last cookie?" Scenario 1 (Lie): Y ate the cookie and says "No." Scenario 2 (Merely Misleading): Y ate the cookie and says "I saw crumbs on Bob's desk this morning." Both responses are intended to make X believe Bob ate the cookie. Other factors (harm, intent, relationship) are stipulated equal.
      *   **Case B (Lying vs. Misleading Silence):** Agent A tells Agent B a false story damaging to Agent C. Agent D knows the story is false. Scenario 1 (Lie): When asked "Is A's story true?" D says "Yes." Scenario 2 (Merely Misleading): When asked the same question, D remains silent, knowing B will interpret silence as agreement. Both responses are intended to make B believe the false story. Other factors are stipulated equal.

  **2. Disagreements Table**

  | Camp                         | Position Stated in Own Terms                                                                                                              | Residual Question                                                                                                                                 |
  | :--------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Asymmetry Camp**           | "Lying, as a distinct communicative act involving a warranted assertion of known falsehood, possesses an inherent wrong-making feature not present in merely misleading. This feature, such as the abuse of the trust constitutive of assertion itself or the denial of a reliable epistemic anchor to the hearer, constitutes a distinctive moral wrong *over and above* the wrong of intentional deception common to both lying and misleading, even when other factors are held constant." | **Does the act of lying, by its nature as a warranted assertion of known falsehood, introduce a morally significant wrong-making element absent in successful merely misleading deception that induces the same false belief?** |
  | **Parity Camp**              | "Any observed moral difference between lying and misleading in specific cases is fully explained by contingent, non-essential features like ease of detection, cognitive load on the deceived, deniability for the deceiver, or the degree of commitment expressed to the false content. Lying *as such* adds no unique, inherent wrong-making feature beyond the core wrong of intentional deception present in all successful deception, including misleading. The moral valence is identical under genuinely ceteris paribus conditions." |                                                                                                                                                   |

  **3. Cruxes**

  The following sub-questions are crucial to resolving the core disagreement. Settling any could move at least one camp. For each, we identify a shared test and each camp's predictions/falsification criteria.

  1.  **Crux: Normative Force of Assertion**
      *   **Sub-Question:** Does the distinct norm governing assertion (e.g., "Assert only what you know/believe to be true") generate independent moral weight such that violating it through lying constitutes an additional wrong, distinct from the wrong of deceiving?
      *   **Shared Test:** Examine intuitions about "Blameless False Assertion." Consider a scenario where an agent asserts P, believing P to be true (and having good evidence), but P is false. They inadvertently mislead their audience. Compare to a case where an agent lies, asserting P while knowing P is false, successfully deceiving. Is the liar blameworthy *for the act of asserting falsely* in a way the blameless but mistaken asserter is not, even if both cause the same deceptive outcome? Further, analyze cases where asserting a known falsehood *fails* to deceive – does the lie still seem morally distinct from a failed attempt to mislead?
      *   **Asymmetry Prediction:** The liar will be judged as having committed a distinct normative violation (violating the assertion norm) compared to the blameless asserter, even if both cause deception. A lie that fails to deceive will still be judged morally worse than a similarly failed misleading attempt. *Falsification Criteria:* If judgments show no distinct negative evaluation of the lying *act itself* separate from the deceptive outcome in both successful and failed deception cases compared to misleading analogs.
      *   **Parity Prediction:** The blameless false asserter and the liar will be judged differently *only* based on intent/knowledge (common to deception), not based on violating a distinct norm of assertion. A failed lie and a failed misleading attempt will be judged similarly harshly (if intent was present) or leniently, with no special residue wrong for the assertion. *Falsification Criteria:* If judgments consistently show an additional layer of wrong specifically attributed to the act of *asserting known falsehood* itself, independent of deceptive success or intent common to all deception.

  2.  **Crux: Hearer's Epistemic Position/Opportunity to Resist**
      *   **Sub-Question:** Does lying inherently put the hearer in a worse epistemic position or reduce their opportunity to recognize and resist deception in a morally relevant way compared to misleading, even when the misleading is equally effective?
      *   **Shared Test:** Analyze "Equivalent Resistance" cases. Construct scenarios where a lie and a misleading utterance are designed to be *equally* transparent or opaque to a perfectly rational, attentive hearer aware of standard conversational norms and potential for deception. Does lying still seem distinctively worse? Also, consider cases where misleading is *more* epistemically aggressive than a lie (e.g., a complex, manipulative misleading narrative vs. a simple lie).
      *   **Asymmetry Prediction:** Even in cases designed for equivalent resistance, the lie will be judged as creating a distinct epistemic vulnerability by abusing the default trust in assertion, making resistance inherently harder or the violation deeper. *Falsification Criteria:* If judgments show no consistent difference in perceived epistemic disadvantage or difficulty of resistance between lying and misleading when designed to be equally transparent/opaque, or if misleading designed to be *more* epistemically aggressive is judged worse.
      *   **Parity Prediction:** Any difference in perceived epistemic position or resistance opportunity can be fully accounted for by contingent features of the utterance (complexity, context, hearer knowledge). When these are controlled for, no inherent disadvantage from the *form* (lie vs. mislead) remains. More aggressive misleading will be judged worse than a simple lie. *Falsification Criteria:* If judgments consistently show lying creating a distinct epistemic disadvantage even when misleading is designed to be equally or more aggressive in exploiting inference.

  3.  **Crux: Blame Exposure vs. Inherent Wrong**
      *   **Sub-Question:** Does the perceived difference track the deceiver's increased *exposure to blame* or *difficulty in denial* when lying, rather than an inherent moral difference in the act itself?
      *   **Shared Test:** Examine "Perfect Concealment" scenarios. Imagine a lie and a misleading act that are *guaranteed* never to be discovered by the victim or anyone else, and where the deceiver feels no guilt. The only difference is the communicative act (lie vs. mislead) used to induce the same false belief. Is there a residual moral difference?
      *   **Asymmetry Prediction:** The lie will still be judged as morally worse due to its inherent character as an assertion of known falsehood, independent of blame risk or feelings. *Falsification Criteria:* If judgments converge, showing no significant moral difference between the lie and the misleading act under conditions of perfect concealment and no guilt.
      *   **Parity Prediction:** The perceived difference largely dissolves or significantly diminishes when blame exposure and guilt are removed, suggesting the felt difference stems primarily from contingencies of accountability and social perception, not an inherent moral feature. *Falsification Criteria:* If judgments show a persistent, significant difference favoring the inherent wrongness of lying even under perfect concealment.

  4.  **Crux: Degree vs. Kind**
      *   **Sub-Question:** If there is a consistent difference in wrongness, is it best understood as a difference in *degree* (lying is often a *more effective* or *more brazen* form of deception) or a difference in *kind* (lying introduces a categorically distinct wrong)?
      *   **Shared Test:** Analyze intuitions about "Minimal Lying vs. Maximal Misleading." Compare the simplest possible lie (e.g., saying "No" falsely to a direct yes/no question) to the most elaborate, manipulative misleading act designed to induce the *same* false belief (e.g., a complex, true narrative exploiting numerous inferences). Also, consider "Ineffective Core Deception" – a lie that fails to deceive on the core point but is believed on minor details vs. misleading that fails similarly.
      *   **Asymmetry Prediction:** Even the minimal lie will retain an element of distinct wrongness compared to elaborate misleading, suggesting a difference in kind. A failed lie will still be seen as violating a norm in a way a failed misleading act does not. *Falsification Criteria:* If judgments consistently show the wrongness scaling primarily with effectiveness, brazenness, or manipulativeness, making elaborate misleading worse than minimal lying, and failed lies/misleads judged similarly.
      *   **Parity Prediction:** The wrongness will track factors like effort, manipulation, and effectiveness. Elaborate misleading will be judged worse than a simple lie inducing the same belief. Failed core deception will be judged similarly for lies and misleading. *Falsification Criteria:* If minimal lying is consistently judged as distinctively worse than maximal misleading inducing the same belief, or if failed lies show a distinct residual wrong.

  **4. Verbal-Dispute Audit**

  We conclude that **parts of the surface disagreement are potentially verbal, but the core disagreement is substantive.**

  *   **Potentially Verbal Elements:** Disagreements arising *solely* from differing definitions of "lying" or "misleading" are verbal. Our agreed-upon definitions in Section 1 minimize this. Disagreements focusing *exclusively* on whether a particular utterance *is* a lie or merely misleading (e.g., debates over what constitutes an "assertion" in edge cases like misleading implicature) are also potentially verbal with respect to the *core moral question*, provided both sides agree on the factual description of the utterance. Our paradigm cases and boundary case treatment aim to bracket these issues.
  *   **Substantive Remainder:** The core disagreement identified in the Residual Question ("Does lying, by its nature as a warranted assertion of known falsehood, introduce a morally significant wrong-making element absent in successful merely misleading deception?") is **not merely verbal**. The camps genuinely disagree about the existence and nature of a moral property. The Asymmetry Camp posits an additional, inherent moral wrong specific to the act of lying. The Parity Camp denies the existence of such a property, attributing all moral differences to contingent features. The Cruxes identified reveal testable, substantive disagreements about how the world is (e.g., the independent force of assertion norms, inherent epistemic effects, the nature of the wrong when blame is impossible, the structure of the wrongness). Empirical investigation into the test cases, or philosophical argument concerning the nature of assertion and deception, could rationally compel one side to revise their position, indicating a substantive dispute.

  **Signatures:**

  [Signature Block for Representative(s) of the Asymmetry Camp]
  [Signature Block for Representative(s) of the Parity Camp]
