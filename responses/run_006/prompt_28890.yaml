prompt: |-
  I've been reading about how psychology experiments get approved and something's bugging me. My uni's research ethics committee makes researchers get informed consent before a study: participants are told what they're signing up for and sign a form. But the same committee also approves studies that involve deception — researchers lie about the purpose of the study, give fake feedback, or plant a confederate who pretends to be another participant. The participant signs a form saying they agree to be deceived, but they're obviously not told what the deception will actually be, becuase that would ruin the study. At most they're told in vague terms that they might be misled at some point. What theory of valid consent does this practice presuppose? Does it treat consent as a one-off thing at the start rather than something ongoing, and is it coherent to consent to being deceived when you don't know what you're agreeing to? And what about the fact that most participants are students earning course credit — does the committee's practice quietly presuppose that mild inducements don't undermine voluntariness? I want to know what this institutional practice implies about how deception, coercion, and competence each bear on consent, whether the practice is internally consistent, and what would have to change if the committee instead held that any deception at all invalidates consent. Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of the question. And write in British English please.
reasoning: |-
  Hmm, the user is asking about the ethics of deception in psychology experiments, focusing on informed consent. They're confused because their university's ethics committee requires consent but also approves studies that involve deception. The user questions how participants can truly consent to being deceived when they don't know what they're agreeing to. They also bring up concerns about voluntariness, especially with student participants who might be motivated by course credits. They want to know the underlying theory of consent, whether the practice is coherent, and what would change if deception were banned outright.

  First, I need to recall the key principles of research ethics: autonomy, beneficence, non-maleficence, and justice. Informed consent is central to autonomy, but deception complicates it. The user's query points to a tension: how can consent be "informed" if there's deception? The ethics committees typically rely on a two-stage process: initial broad consent plus post-study debriefing. This assumes consent is provisional and can be validated after the fact.

  The user mentions participants signing a form agreeing to potential deception without specifics. That's standard in some studies, but it raises philosophical questions. Is consent valid if it's based on incomplete information? The committee probably views it as a waiver, where participants accept uncertainty for the sake of science, but only if risks are minimal. I should explain that this presupposes a theory where consent isn't a one-time event but includes ongoing elements like the right to withdraw and debriefing.

  Another issue is voluntariness. The user notes that many participants are students earning credits. Does that constitute coercion? Ethics committees usually assess whether inducements are undue influences. Course credits might be seen as mild, not coercive, but it's debatable. I need to address how the committee likely assumes that such incentives don't override voluntariness unless they're excessive.

  The user asks about internal consistency. The practice might seem inconsistent: demanding consent but allowing deception. But committees argue that deception is permissible only when necessary, justified by the scientific value, and mitigated by debriefing. They probably see it as a balance, not a contradiction. If deception invalidated consent entirely, most social psychology research would stop, leading to a significant shift in methods. Alternatives like authorized deception or naturalistic studies might emerge, but that could limit certain types of research.

  I should also consider competence. Participants must be competent to consent, meaning they understand the general risks, even if not the specifics. The form they sign typically states there might be deception, which they acknowledge. Competence isn't questioned here unless the deception causes harm, but that's handled through debriefing and harm prevention measures.

  The user's deeper concern might be about trust in research institutions. They might feel that the current system prioritizes research goals over participant autonomy. It's important to acknowledge that while the system has safeguards, it's not perfect. Debates continue in ethics literature about whether post-hoc debriefing truly repairs autonomy. The committee's approach is pragmatic but relies on participants trusting the process. If that trust is broken, the whole system could be challenged.

  Finally, structuring the response: the user wants the bottom line first, then reasoning. Use British English. So, start with the key takeaway: the practice assumes a two-stage theory of consent with post-hoc validation. Then break down deception, voluntariness, competence, internal consistency, and the implications of banning deception.
answer: |-
  The ethics committee's practice presupposes a two-stage theory of valid consent where initial broad agreement, coupled with comprehensive post-study debriefing and the right to withdraw *during* the study, validates consent retroactively, treating it as an ongoing process rather than a single event.  

  Regarding deception, the practice assumes participants can validly consent *to the possibility of being misled* without knowing specifics, provided:  
  1.  The deception is disclosed as a potential general feature in the initial consent form (e.g., "this study may involve elements of deception about its true purpose").  
  2.  The deception is deemed necessary and justifiable for the scientific merit, with no reasonably feasible alternatives.  
  3.  The deception causes no foreseeable significant harm or distress (mitigated by rigorous risk assessment).  
  4.  Full disclosure occurs during mandatory debriefing immediately after participation, allowing participants to understand the true nature of the study and withdraw their data retrospectively.  

  Concerning voluntariness and inducements (like course credits), the committee implicitly assumes that *mild* inducements do not constitute undue coercion, provided:  
  1.  The inducement is not so excessive as to override free choice (e.g., credits are proportional to time/effort).  
  2.  Alternative ways to earn equivalent credit or compensation are realistically available.  
  3.  Participants are explicitly informed that participation is voluntary and refusal/withdrawal carries no penalty.  

  On competence, the practice assumes participants are competent to understand the *general nature* of their agreement (e.g., "I agree to take part, knowing I might be misled about some aspects, and I can stop anytime"), even if specific deceptions are withheld.  

  The practice maintains internal consistency only if:  
  1.  Deception is strictly limited to scenarios meeting the criteria above (necessity, low risk, debriefing).  
  2.  The debriefing genuinely restores participants' autonomy and understanding, retroactively fulfilling the "informed" element of consent. Critics argue this "authorised deception" model is fundamentally incoherent, as consenting to *unknowable* future actions challenges core notions of autonomy.  

  If the committee held that *any* deception invalidates consent, it would necessitate:  
  1.  Prohibiting virtually all deceptive methodologies common in social psychology (e.g., Milgram-style obedience studies, Asch conformity experiments).  
  2.  Mandating alternative research designs (e.g., naturalistic observation, fully transparent behavioural tasks, "authorised deception" where participants agree to specific deceptive scenarios in advance without knowing *when* they occur).  
  3.  Potentially limiting research into phenomena highly susceptible to demand characteristics or participant reactivity (e.g., prejudice, conformity, obedience).  
  4.  Requiring far more detailed initial consent for *all* aspects of the study, potentially reducing ecological validity or the ability to study spontaneous reactions.
