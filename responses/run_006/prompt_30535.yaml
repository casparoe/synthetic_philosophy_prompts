prompt: |-
  I work on the responsible-AI team at a large tech company, and we keep having the same fight: when is it okay for our product descriptions, blog posts, and model cards to say things like "the model understands context" or "the model believes the user is asking about X" or "the model wants to be helpful"? Half the engineers say this is all misleading anthropomorphism and we should never use mental-state language. The other half say that at some level of capability it becomes more misleading NOT to use it — like refusing to say a chess engine "wants to control the center" just because it's not conscious. I want to write a decision procedure our comms and product teams can actually use, grounded in Dennett's intentional stance, that tells them when mental-state attributions are defensible and when they're not. It needs to be something a non-philosopher can run in an afternoon, it should handle edge cases (what about "the model hallucinated" — is that a mental-state term?), and it should flag where the procedure bottoms out in a judgment call. Then run it on three examples: a model card description of a chatbot, a blog post about a coding assistant, and a press quote about a vision model that sometimes makes stuff up about images.
reasoning: |-
  We are going to create a decision procedure based on Dennett's intentional stance. Dennett's intentional stance is the strategy of interpreting the behavior of an entity (like a person, animal, or machine) by treating it as if it were a rational agent who has beliefs, desires, and intentions. According to Dennett, we take the intentional stance when it is the most effective and efficient way to predict and explain behavior.

  The key idea: We are allowed to use mental-state language (like "believes", "wants", "understands") for a system if and only if adopting the intentional stance towards that system provides predictive and explanatory power that is not practically achievable by the physical stance (describing the physical components) or the design stance (describing the functional design).

  The decision procedure:

  1. **Step 1: Define the Behavior**
     - Clearly state the behavior or capability of the model you are describing.

  2. **Step 2: Consider Alternative Stances**
     - **Physical stance**: Can we explain the behavior by referring to the physical components (transistors, voltages, etc.)? If yes, and if it is practical to do so in this context, then avoid mental-state terms.
     - **Design stance**: Can we explain the behavior by referring to the design and algorithms (e.g., "the model uses a transformer architecture with attention mechanisms to generate responses")? If yes and practical, avoid mental-state terms.
     - **Intentional stance**: If the behavior is complex and the alternative stances are too cumbersome or fail to capture the functional role of the behavior, then the intentional stance may be justified.

  3. **Step 3: Predictive/Explanatory Power**
     - Does using the intentional stance (attributing mental states) make the explanation significantly more efficient and effective for the intended audience? Does it help in predicting future behavior in a way that the other stances do not?
     - If yes, then mental-state terms are defensible.

  4. **Step 4: Guardrails**
     - **Avoid implying consciousness**: Ensure that the language does not imply the model has subjective experiences, feelings, or consciousness. We are only using the intentional stance as a tool for prediction and explanation.
     - **Context matters**: The audience and purpose matter. In technical documentation, the design stance might be more appropriate. For a general audience, the intentional stance might be necessary for clarity.
     - **Flagging as a tool**: Where appropriate, explicitly note that these attributions are a useful fiction (e.g., "we say the model 'understands' as shorthand for the complex process of pattern matching and generation").

  5. **Step 5: Judgment Call**
     - If after steps 1-4 the matter is still unclear, then it's a judgment call. The procedure should flag this and require a review by the responsible-AI team.

  Edge case: "The model hallucinated"
  - The term "hallucinate" is a mental-state term (derived from human perception). However, it has become a term of art in machine learning to describe when a model generates outputs that are not grounded in its training data or input. 
  - Apply the procedure:
    - Step 1: Behavior - generating a confident but factually incorrect response.
    - Step 2: Alternative stances: 
        - Physical stance: too low-level.
        - Design stance: we could say "the model generated an output with low probability or without sufficient evidence in the training data", but that is cumbersome and not as widely understood.
        - Intentional stance: using "hallucinate" is efficient and widely understood in the community.
    - Step 3: The term is efficient and has explanatory power in the AI context. It helps to quickly convey the idea of confident fabrication.
    - Step 4: We must be cautious not to imply the model has subjective experiences. We can note that this is a metaphor and in technical documents we might define it.
    - Conclusion: It is defensible, especially in contexts where the audience is familiar with the term.

  Now, let's run the procedure on the three examples:

  **Example 1: Model card description of a chatbot**

  Statement: "The model understands context and can maintain a conversation over multiple turns."

  - Step 1: Behavior - maintaining context in a multi-turn conversation.
  - Step 2: Alternative stances:
     - Physical stance: Not practical (neurons firing?).
     - Design stance: We could say "the model uses attention mechanisms over previous tokens to condition its responses". This is precise but might be too technical for a model card that is read by a broad audience.
     - Intentional stance: Saying the model "understands context" is a concise way to describe the capability.
  - Step 3: The intentional stance term "understands" is efficient and conveys the functional capability. It is widely used in the field and understood by the intended audience (which may include non-experts). It has predictive power: if you say the model understands context, then a user will expect it to remember previous parts of the conversation.
  - Step 4: We must avoid implying consciousness. The term "understand" in this context is a shorthand for the functional ability. We can add a note if needed: "Note: 'understands' here refers to the model's ability to use previous dialogue turns to generate relevant responses, without implying human-like comprehension."
  - Judgment: Defensible. But note: the model card should have a section that explains the model's limitations and that it does not possess true understanding.

  **Example 2: Blog post about a coding assistant**

  Statement: "The model believes the user is asking about a Python function and provides a code snippet."

  - Step 1: Behavior - the model correctly identifies a user's intent as about a Python function and generates code.
  - Step 2: Alternative stances:
     - Physical stance: Not practical.
     - Design stance: We could say "the model classifies the user input as a request about Python functions and generates a code snippet based on patterns in its training data". This is more accurate but less engaging for a blog post.
     - Intentional stance: Using "believes" is a natural way to describe the model's inference of the user's intent.
  - Step 3: The term "believes" is efficient and captures the idea of the model making an inference. It's more engaging for a blog post and helps the audience (developers) relate to the model's behavior.
  - Step 4: We must avoid implying the model has beliefs in the human sense. We can use the term in quotes or with a disclaimer: "we say the model 'believes' to describe its inference of the user's intent."
  - Judgment: Defensible in a blog post (which is less formal) but with caution. If the blog is for a technical audience, the design stance might be better. However, for a wider audience, the intentional stance is acceptable.

  **Example 3: Press quote about a vision model that sometimes makes stuff up about images**

  Statement: "The vision model sometimes hallucinates details that aren't in the image."

  - Step 1: Behavior - generating descriptions of image details that are not present.
  - Step 2: Alternative stances:
     - Physical stance: Not practical.
     - Design stance: "The model sometimes generates high-confidence predictions about image features that are not supported by the input pixels, due to overfitting to patterns in the training data." This is accurate but verbose for a press quote.
     - Intentional stance: The term "hallucinate" is widely used in machine learning for this behavior.
  - Step 3: The term is efficient and has become standard in the field. It conveys the idea quickly and is understood by the press and the public (with some context).
  - Step 4: Be cautious: "hallucinate" might imply the model has a mind. However, it has been adopted as a term of art. We can briefly explain: "In AI, 'hallucination' refers to when a model generates outputs that are not grounded in the input data."
  - Judgment: Defensible, but note it requires context. In a press quote, it might be better to use a more accessible term? However, if the term is already established, it's acceptable.

  Final Decision Procedure Document:

  # Decision Procedure: When to Use Mental-State Language for AI Systems

  ## Purpose
  To provide clear guidelines for when it is defensible to use mental-state language (e.g., "understands", "believes", "wants") in product descriptions, blog posts, and model cards, based on Dennett's intentional stance.

  ## Steps

  1. **Define the Behavior**: Clearly articulate the behavior or capability of the model that you wish to describe.

  2. **Consider Alternative Stances**:
     - **Physical stance**: Can the behavior be explained by referring to physical components (e.g., circuits, electricity)? If yes and practical, use this and avoid mental-state terms.
     - **Design stance**: Can the behavior be explained by referring to the model's design, architecture, or algorithms? If yes and practical (especially for technical audiences), use this and avoid mental-state terms.
     - **Intentional stance**: If the above are impractical or fail to capture the functional role efficiently, consider the intentional stance.

  3. **Assess Predictive/Explanatory Power**:
     - Does using the intentional stance make the explanation significantly more efficient and effective?
     - Does it help the intended audience predict how the model will behave?
     - If yes, then mental-state terms are defensible.

  4. **Apply Guardrails**:
     - **Avoid consciousness**: Never imply the model has subjective experiences, feelings, or consciousness.
     - **Context**: Adjust for the audience and medium. For technical documents, lean towards the design stance. For broader audiences, the intentional stance may be acceptable if it aids understanding.
     - **Flag as a tool**: Where necessary, explicitly note that mental-state terms are used as a shorthand for complex processes (e.g., "as shorthand for pattern matching", "without implying human-like understanding").

  5. **Judgment Call**:
     - If the answer is not clear after the above steps, flag it as requiring review by the responsible-AI team.

  ## Edge Cases
  - **"Hallucinate"**: This term is acceptable as a term of art in AI to describe confident generation of ungrounded outputs. However, provide a brief explanation for non-expert audiences to avoid anthropomorphic implications.

  ## Examples
  See above for three examples.

  ## Final Notes
  This procedure is a guideline. It is rooted in the idea that the intentional stance is a tool for prediction and explanation, not an assertion about the inner workings or consciousness of the model. Always err on the side of caution to avoid misleading anthropomorphism.
answer: |-
  ### Decision Procedure for Mental-State Language in AI Communications  
  Based on Dennett's **intentional stance** (treating systems as rational agents with beliefs/goals *if it yields useful predictions*), this procedure evaluates when mental-state terms (e.g., "understands," "believes," "wants") are defensible. It prioritizes **utility**, **audience clarity**, and **risk mitigation** against misleading anthropomorphism.  

  ---

  #### **Step-by-Step Procedure**  
  _Execute in order; stop if a step resolves the issue. Non-philosophers should complete within 1–2 hours._  

  1. **Define the Claim**  
     - Write the exact statement (e.g., "the model understands context").  
     - Identify the **observed behavior** (e.g., "responds coherently to multi-turn dialogue").  
     - Specify the **audience** (e.g., developers, general public).  

  2. **Apply the "Design Stance" Test**  
     - Can the behavior be accurately explained **without mental terms** using:  
       - Technical specifics? (e.g., "the model uses attention weights to reference prior tokens")  
       - Math/statistics? (e.g., "outputs maximize probability given input tokens")  
     - **If YES → Avoid mental-state terms.**  
       - *Exception*: Skip if the explanation is overly complex for the audience (e.g., a press release).  

  3. **Apply the "Intentional Stance Utility" Test**  
     - Does attributing a mental state:  
       - **Improve prediction?** (e.g., saying "the model wants to be helpful" predicts it will revise answers upon feedback).  
       - **Simplify communication?** (e.g., "understands context" is clearer than describing transformer attention for non-experts).  
       - **Align with community norms?** (e.g., "hallucinate" is standard in ML papers).  
     - **If ALL THREE → Mental-state terms are defensible.**  
     - **If NO → Revert to design stance.**  

  4. **Apply "Anthropomorphism Safeguards"**  
     - Flag if the term:  
       - **Implies consciousness** (e.g., "conscious," "feels," "experiences"). → **Never allow.**  
       - **Risks user deception** (e.g., implying the model has human-like intent/autonomy). → **Requires disclaimer.**  
       - **Is a term of art** (e.g., "hallucinate" in ML). → **Permit with a footnote.**  
     - Add disclaimers where needed (e.g., "metaphorically," "as an inference tool").  

  5. **Judgment Call Flag**  
     - If steps 2–4 are inconclusive (e.g., utility is debated), **flag the decision** for team review. Document:  
       - Why the intentional stance is useful.  
       - Why it might mislead.  

  ---

  ### **Edge Case: "The model hallucinated"**  
  - **Design Stance Test:**  
    - Alternative: "generates statistically plausible but unfounded outputs." → **Possible but cumbersome.**  
  - **Intentional Stance Utility:**  
    - **Improves prediction?** Yes (predicts confabulation in low-data scenarios).  
    - **Simplifies communication?** Yes (shorthand widely adopted in ML).  
    - **Aligns with norms?** Yes (industry standard).  
  - **Safeguards:**  
    - "Hallucinate" is a **term of art** → **Permit with footnote** (e.g., "In AI, ‘hallucinate’ describes pattern-matching errors, not subjective experience").  
  - **Verdict:** **Defensible** with context.  

  ---

  ### **Application to Examples**  

  #### **Example 1: Model Card Description for a Chatbot**  
  **Statement:** "The model understands context and wants to provide helpful responses."  
  - **Step 1 (Define):**  
    - Behavior: Maintains dialogue coherence; revises answers to user feedback.  
    - Audience: Researchers, regulators.  
  - **Step 2 (Design Stance):**  
    - Alternative: "The model uses attention mechanisms over previous tokens to maintain coherence; its RLHF training rewards responses rated ‘helpful’ by humans." → **Accurate and audience-appropriate.**  
    - **Verdict: Avoid mental-state terms.**  
  - **Judgment Call:** Not needed. Use the design-stance description.  

  ---

  #### **Example 2: Blog Post About a Coding Assistant**  
  **Statement:** "The model believes the user is asking about Python decorators and generates a relevant example."  
  - **Step 1 (Define):**  
    - Behavior: Correctly infers intent about Python decorators; outputs code.  
    - Audience: Developers (technical but non-ML experts).  
  - **Step 2 (Design Stance):**  
    - Alternative: "The model classifies the query as ‘Python decorators’ via fine-tuned intent detection and samples from a decorator-heavy training subset." → **Precise but verbose for a blog.**  
  - **Step 3 (Intentional Stance Utility):**  
    - **Improves prediction?** Yes (users expect intent-aware code generation).  
    - **Simplifies communication?** Yes ("believes" is intuitive for developers).  
    - **Aligns with norms?** Yes (common in developer-facing content).  
    - **Verdict: Defensible.**  
  - **Step 4 (Safeguards):**  
    - "Believes" risks mild anthropomorphism → **Add disclaimer**: "As shorthand for probabilistic intent inference."  

  ---

  #### **Example 3: Press Quote About a Vision Model**  
  **Statement:** "The model sometimes hallucinates objects in images, like claiming a dog is present when it’s not."  
  - **Step 1 (Define):**  
    - Behavior: Generates false positive object detections.  
    - Audience: General public, journalists.  
  - **Step 2 (Design Stance):**  
    - Alternative: "The model incorrectly assigns high confidence to object labels unsupported by pixel data." → **Accurate but opaque for non-experts.**  
  - **Step 3 (Intentional Stance Utility):**  
    - **Improves prediction?** Yes (users anticipate false positives).  
    - **Simplifies communication?** Yes ("hallucinates" is vivid and memorable).  
    - **Aligns with norms?** Yes (common in press coverage).  
    - **Verdict: Defensible.**  
  - **Step 4 (Safeguards):**  
    - "Hallucinates" is a term of art → **Add footnote**: "Note: ‘Hallucinate’ here means confident generation of unsupported details—a technical term, not literal experience."  

  ---

  ### **Procedure Summary**  
  | Step                  | Key Question                                  | Outcome                                  |  
  |-----------------------|----------------------------------------------|------------------------------------------|  
  | 1. Define Claim       | What’s the behavior/audience?                | Baseline for evaluation.                |  
  | 2. Design Stance Test | Can we explain without mental terms?         | If YES → **Avoid mental terms**.         |  
  | 3. Intentional Utility| Does it improve prediction/clarity/norms?    | If YES → **Permit with safeguards**.     |  
  | 4. Anthropo. Safeguards| Does it imply consciousness/deception?      | **Ban/Disclaim** risky terms.           |  
  | 5. Judgment Call      | Still unclear?                               | **Flag for review** + document tradeoffs.|  

  **Final Guidance:**  
  - Use mental-state terms **only when necessary for utility** (prediction/clarity).  
  - **Always caveat** in footnotes/disclaimers (e.g., "metaphorically," "as an inference tool").  
  - **Ban terms implying consciousness** (e.g., "feels," "conscious").  
  - **When in doubt, default to the design stance.**
