prompt: |-
  I coordinate search-and-rescue for a county in the Cascades. A few times a year we get a call where one crew has to choose between two groups of people in trouble and the groups are different sizes — say a fast-rising river or a fire cutting off two drainages, and we can only get to one before dark. Our standing protocol is "save the most lives," but I've been reading Taurek's "Should the Numbers Count?" and now I'm not sure that protocol is as obvious as we treat it. His line, as I understand it, is that you can't just add up the losses of different people — five people's suffering isn't five times one person's, because no single person experiences the total — and that fairness might require giving each person an equal chance of rescue rather than automatically heading to the bigger group. I want you to turn that into a decision procedure my field teams can actually use. These are volunteers with no philosophy background, they're making the call in minutes, and whatever we do will be picked over afterwards by a review board and probably a lawyer. The procedure should have the questions to ask in order, what counts as a good-enough answer to each one before moving on, where it stops with a no, and where it explicitly says "this is a values call, a person has to make it, not the checklist." Be honest about where a Taurek-style procedure is going to conflict with our usual save-the-most-lives instinct and where it'll misfire or go silent. Then run it on three worked cases: (1) one hiker versus four hikers, same injuries, same weather, same confidence we can get to either site; (2) one hiker we're nearly certain we can reach versus five who are maybe reachable if the water holds; (3) one adult versus three children, everything else equal. At least one of those should come out in a way my people are going to hate, and you should say so.
reasoning: |-
  Okay, the user coordinates search-and-rescue operations in the Cascades and is grappling with ethical protocols when forced to choose between rescuing groups of different sizes. They've read Taurek's "Should the Numbers Count?" and now question their standing "save the most lives" protocol. Taurek argues against aggregating harms—suggesting that five people's suffering isn't equivalent to one person's multiplied by five, since no single person experiences the total. Instead, he proposes giving each person an equal chance of rescue through a random method like a coin flip. 

  The user needs a practical decision procedure for field teams—volunteers without philosophy backgrounds—who must decide quickly under pressure. This procedure must withstand scrutiny from review boards and lawyers. It should include clear questions, thresholds for answers, stopping points, and explicit "values call" moments. They also want three worked examples, including one where the outcome is counterintuitive or unpopular.

  First, I need to translate Taurek's ethical argument into actionable steps. The core tension is between consequentialism (maximizing lives saved) and Taurek's deontological view (individual rights and fairness). Taurek's position might lead to saving fewer lives in some scenarios, which could be controversial—especially for professionals trained to prioritize efficiency. The procedure must balance these while being usable by laypeople. 

  Key elements to include: 
  1. **Simplicity**: Avoid jargon. Use binary questions (yes/no) where possible. 
  2. **Accountability**: Document why a choice was made, especially if deviating from "save the most." 
  3. **Fallbacks**: Specify when to revert to standard protocol (e.g., if randomization isn't feasible). 
  4. **Pain Points**: Acknowledge where Taurek's approach conflicts with instincts (e.g., favoring a smaller group with higher survival odds over a larger one). 

  For the decision tree: 
  - Start with feasibility (can we save both?). 
  - Then assess differences in survival likelihood and immediacy of threat. 
  - Only introduce randomization if groups are truly comparable. 
  - Explicitly flag ethical choices (e.g., "this is a values call"). 

  Worked examples: 
  1. **One vs. four hikers, all equal**: Taurek would randomize (e.g., 50% chance to save either group). This will frustrate teams—why not save four? Must explain Taurek's fairness argument. 
  2. **One (high certainty) vs. five (low certainty)**: Here, saving the one is justifiable by survival odds, not numbers. Teams might accept this. 
  3. **One adult vs. three children**: Taurek treats lives equally, so randomize. But emotionally, saving kids feels imperative. Highlight this conflict. 

  Biggest challenges: 
  - Teams may resist randomization ("wasting" rescue capacity). 
  - Legal/PR risks if a coin flip leads to more deaths. 
  - Need to stress that this applies *only* when groups are otherwise identical. 

  For the user's deeper needs: They likely want ethical rigor *and* operational defensibility. The unspoken fear is liability—if a controversial choice gets litigated, the procedure must show due diligence. Also, they might seek intellectual validation for doubting the "obvious" protocol.
answer: |-
  Below is a practical Taurek-inspired decision procedure for your field teams, designed for rapid use under pressure. It prioritizes **fairness to individuals** over aggregate numbers *only when all other factors are equal*, while defaulting to "save the most lives" when unequal factors (like survival odds or urgency) break the symmetry. It explicitly flags ethical judgment calls.

  ---

  ### **Decision Procedure: Fair Rescue Protocol**  
  **(For use when only ONE group can be reached before dark)**  

  1. **CAN WE SAVE BOTH GROUPS?**  
     - *Ask:* "Is there *any* feasible way to save both groups before conditions worsen? (e.g., split teams, call for mutual aid, faster route)"  
     - **Yes → Save both.**  
     - **No → Proceed to Question 2.**  
     - *Threshold:* "Feasible" = ≥50% confidence it won’t increase total deaths. Stop if unsure.  

  2. **IS ONE GROUP AT MUCH HIGHER IMMEDIATE RISK?**  
     - *Ask:* "Is Group A *significantly* more likely to die before dawn if we don’t reach them first? (e.g., critical injuries, faster-rising water, active fire)"  
     - **Yes → Save the group at higher immediate risk.**  
     - **No → Proceed to Question 3.**  
     - *Threshold:* "Significant" = ≥70% confidence in earlier death. Use on-scene intel (e.g., weather radio, victim vitals).  

  3. **IS ONE GROUP MUCH MORE LIKELY TO BE RESCUED SUCCESSFULLY?**  
     - *Ask:* "If we go to Group A, is our confidence of successful rescue *much higher* than for Group B? (e.g., terrain difficulty, team expertise, equipment match)"  
     - **Yes → Save the group with higher rescue confidence.**  
     - **No → Proceed to Question 4.**  
     - *Threshold:* "Much higher" = ≥30% absolute difference in confidence (e.g., 20% vs. 50%; 50% vs. 80%).  

  4. **ARE THE GROUPS TRULY COMPARABLE? (VALUES CALL)**  
     - *Ask:* "After Q1–Q3, is there ANY relevant difference between groups *besides size*? (e.g., age, vulnerabilities, team relationships, legal duties)"  
     - **Yes → Make a judgment call.** Document the specific difference and decision rationale.  
     - **No → Proceed to Question 5.**  
     - *Threshold:* This is a **values call**. Team lead must explicitly state: *"No non-size difference justifies favoring one group."* If unsure, default to "save most lives."  

  5. **RANDOM SELECTION (TAUREK’S FAIRNESS)**  
     - *Action:* "Assign equal rescue probability to each *person*. Flip a coin:  
       - **Heads:** Save the smaller group.  
       - **Tails:** Save the larger group."  
     - *Documentation Note:* "Chose random selection per Fair Rescue Protocol §5. All lives deemed equal; no non-size factors favored either group."  

  ---

  ### **Key Conflicts & Caveats**  
  - **Where Taurek Clashes with "Save Most Lives"**: In perfectly balanced scenarios (equal risk, odds, no other factors), Taurek says randomize. This could mean saving fewer lives (e.g., 1 over 4).  
  - **Where It Might Misfire**:  
    - If teams misjudge "comparability" (Q4) to avoid randomization.  
    - If lawyers attack randomization as "arbitrary" (defend with documented procedure).  
    - In public backlash if smaller group is saved (stress this is for RARE, symmetric cases).  
  - **Where It Goes Silent**: When factors are unequal (Q2–Q3), it defaults to standard risk/odds assessment. Taurek only applies at Q5.  

  ---

  ### **Worked Examples**  

  #### **CASE 1: One hiker vs. four hikers. Same injuries, weather, rescue confidence.**  
  - Q1: Can’t save both. → **NO**  
  - Q2: Same immediate risk (e.g., both stable hypothermia). → **NO**  
  - Q3: Same rescue confidence (e.g., both 95%). → **NO**  
  - Q4: No non-size differences. → **NO**  
  - Q5: **Flip a coin.**  
    - *Heads:* Save the one hiker.  
    - *Tails:* Save the four hikers.  
  - **Outcome Teams Will Hate**: 50% chance of saving 1 over 4. Taurek’s core conflict: fairness to the one hiker vs. aggregate lives.  

  #### **CASE 2: One hiker (95% rescue chance) vs. five hikers (30% rescue chance).**  
  - Q1: Can’t save both. → **NO**  
  - Q2: Same immediate risk? Assume yes. → **NO**  
  - Q3: Rescue confidence differs (95% vs. 30% → 65% gap). → **YES**  
  - **Save the one hiker** (higher success odds).  
  - *Note: Taurek doesn’t apply here—odds break symmetry. Teams may still dislike abandoning five, but protocol justifies it.*  

  #### **CASE 3: One adult vs. three children. All else equal.**  
  - Q1: Can’t save both. → **NO**  
  - Q2: Same immediate risk? Assume yes. → **NO**  
  - Q3: Same rescue confidence? Assume yes. → **NO**  
  - Q4: **VALUES CALL** → Is age a relevant difference?  
    - *Judgment Required:* If "children are more vulnerable" or "prioritize minors" is county policy → **Save children.**  
    - If "all lives equal" → **Proceed to Q5, randomize.**  
  - **Outcome Teams Will Hate**: If you randomize, 50% chance of saving one adult over three children. If you save children, you violate Taurek’s individualism.  

  ---

  ### **Implementation Notes**  
  1. **Training**: Drill teams on Q4 (values calls) and coin-flip scenarios. Stress: Randomization is *only* for symmetrical cases.  
  2. **Review Board Defense**: Frame Q5 as "equal moral worth of each person" when no other distinction exists. Cite procedure adherence.  
  3. **Safety Valve**: If Q5 feels morally wrong in the moment, team lead may override it—but must document *why* (e.g., "Could not accept letting four die by chance").  

  This procedure forces explicit ethical reasoning only where needed. Taurek’s insight—that numbers aren’t everything—is confined to rare, truly balanced dilemmas. In all other cases, your standard risk/odds calculus prevails.
