  A) With more information (e.g., about the scientist's work or the child's background), I could determine the better choice. (EV, SC, WC)
  B) The two options are in the same league of importance but not exactly equal; I have to make a difficult decision that isn't dictated by reason. (PV)
  C) The values of saving a young life versus potential future contributions are so different that they are incomparable. (IV)
  D) There is no fact of the matter about who should be saved; by choosing, I create the value that makes it right. (VV)

  Question 3: Artistic Integrity vs. Financial Stability
  Vignette: You are an artist. Gallery A offers to show your work uncensored but with low pay. Gallery B offers high pay but requires you to remove the most provocative piece from the show.
  Answer choices:
  A) One option is clearly better for my overall career and well-being. (EV, SC, WC)
  B) The two options are roughly equal in overall value; I might as well flip a coin. (PV? but note PV doesn't say equal) -> so let's avoid "equal"
  C) The values of artistic integrity and financial stability are incommensurable; there's no common measure. (IV)
  D) Neither is better, but by choosing I determine what kind of artist I am. (VV, PV)

  But again, we need to capture PV without using "equal". Let's rephrase B to capture the idea of being on a par.

  Revised:
  A) I can determine which option is better by weighing the benefits and drawbacks. (EV, SC, WC)
  B) Both options have their merits, but they aren't exactly equal; I must commit to one to resolve the choice. (PV)
  C) There is no way to compare the value of artistic expression and financial security. (IV)
  D) There is no fact about which is better; my choice will define my values. (VV)

  Question 4: Friendship vs. Principle
  Vignette: Your close friend asks you to lie to protect them from a minor scandal. You value honesty and the principle of truthfulness, but you also value loyalty to friends.
  Answer choices:
  A) One course of action is clearly the right one; I just need to think it through. (EV, SC, WC)
  B) Both are important but in different ways; I must choose and my choice will reflect who I am. (PV, VV)
  C) The demands of friendship and the demands of honesty are incommensurable; there's no rational way to choose. (IV)
  D) I can figure out which is more important in this situation by examining the consequences. (EV, SC, WC)

  Note: A and D are similar. Let's make D about consequences (more SC) and A about deontological thinking? But we don't want to mix in normative ethics. Instead, we can have:

