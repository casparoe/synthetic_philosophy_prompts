  C) These two values (honesty and loyalty) are so fundamentally different that they cannot be compared. (IV)
  D) Neither is objectively better; by choosing, I make one value more important for me in this context. (VV, PV)

  Question 5: Weird Tech Scenario
  Vignette: A new technology allows you to upload one of two value profiles into an AI that will guide your decisions. Profile Alpha maximizes happiness for the greatest number, but at the cost of individual rights. Profile Beta protects individual rights absolutely, even if it leads to less overall happiness. You must choose one to be your personal AI.
  Answer choices:
  A) One profile is clearly better; I just have to decide which one. (EV, SC, WC) [Note: SC might reduce to one metric, but here they are two different metrics. So maybe SC would say we can convert both to a common metric?]
  B) There is a fact about which profile is better, but I don't know what it is. (EV)
  C) These are two fundamentally different ways of valuing, and they cannot be compared. (IV)
  D) Neither is better; by choosing, I define the kind of moral agent I am. (VV, PV)

  Question 6: Perfect Information Case (to distinguish EV and PV)
  Vignette: You have two job offers in different cities. Job A is in a city with great career opportunities but a climate you hate. Job B is in a city with a perfect climate but fewer career opportunities. You have all the information you could possibly want: exact salary, career trajectory, climate data, etc. Still, you feel torn.
  Answer choices:
  A) Despite my feelings, one of these is objectively better for me; I just need to calculate properly. (EV, SC, WC)
  B) The two options are in the same neighborhood of value but not exactly equal; I must commit to one. (PV)
  C) There's no common measure between career and climate; they are incomparable. (IV)
  D) There is no fact of the matter; by choosing, I create the value. (VV)

  Question 7: Another Perfect Information Case (distinguish EV and PV)
  Vignette: You are buying a house and have two finalists. House A is a beautiful historic home but needs expensive repairs. House B is a modern, efficient home but lacks charm. You have complete information about costs, condition, and your own preferences. Yet you feel equally pulled in both directions.
  Answer choices:
  A) One house is better for me; I must be overlooking something. (EV)
  B) They are both good in different ways, and I must choose without there being a determinate better option. (PV)
  C) The value of historic charm and modern efficiency are incommensurable. (IV)
  D) My choice will make one set of values more central to my life. (VV, PV)

  But note: D is similar to B? We can merge PV and VV in this context? We'll flag that.

  Question 8: Vacation Choice
  Vignette: You are planning a vacation. Option A is a relaxing beach holiday. Option B is an adventurous mountain trek. You have the same cost and time for both. You have done both before and know exactly what they offer.
  Answer choices:
  A) One type of vacation is better for me at this moment; I just need to reflect. (EV, SC, WC)
  B) Both are appealing in different ways, and I must pick one without there being a fact about which is better. (PV, IV? But PV says they are comparable, IV says not) -> so we need to be careful.
  C) The joys of relaxation and adventure are so different that they cannot be compared. (IV)
  D) By choosing, I determine what kind of experience I want to have. (VV, PV)

  We can adjust B to capture PV and avoid IV: "Both are appealing in different ways, and they are comparable but neither is better, worse, or equal; I must commit to one." But that's wordy.

  Alternatively, let B be: "The two options are on a par; they are comparable but neither is better, so I must choose without being guided by which is better." (PV)

  And D: "There is no fact of the matter about which is better; my choice will make one better for me." (VV)

  Now, let's design 8 questions.

  Final set of 8 questions:

  1. Career Paths (as above)
  2. Medical Triage (as above)
  3. Artistic Integrity vs. Financial Stability (as above)
  4. Friendship vs. Principle (as above)
  5. Tech Scenario (as above)
  6. Job Offers in Different Cities (with perfect information)
