answer: |-
  ### Hard Choices & Incommensurable Values: Pre-Reading Position Quiz  
  **Instructions:** For each scenario, pick the answer that *best* reflects your intuitive reaction. Don’t overthink it—go with your gut. We’ll score it after the unit to reveal your implicit philosophical stance!  

  ---

  #### Question 1: Career Crossroads  
  *You’re offered two jobs:  
  - **Job A:** High salary, prestigious firm, but soul-crushing hours and moral compromises.  
  - **Job B:** Meaningful work, work-life balance, but modest pay and fewer long-term prospects.*  
  What do you conclude?  
  A) One is clearly better for my overall well-being—I just need to weigh the pros and cons.  
  B) They’re in the same ballpark of value, but neither is better or equal; I must commit to one path to make it "right."  
  C) These values (money vs. meaning) can’t be compared—it’s apples to oranges.  
  D) There’s no fact about which is better; by choosing, I define who I am.  

  #### Question 2: Medical Triage  
  *As a doctor, you have one dose of a lifesaving drug. Two patients need it:  
  - **Patient X:** A 10-year-old child.  
  - **Patient Y:** A 40-year-old scientist close to curing a pandemic.  
  Both will die without it, and both have the same survival odds with it.*  
  How do you decide?  
  A) More data (e.g., the scientist’s cure likelihood) would reveal the objectively better choice.  
  B) The values (a child’s life vs. potential global impact) are comparable but neither trumps; I must choose based on my commitment.  
  C) These stakes are incomparable—no rational decision is possible.  
  D) My choice creates the right answer; it expresses my core values.  

  #### Question 3: Artistic Integrity  
  *You’re an artist. Two galleries offer you a show:  
  - **Gallery A:** Shows your uncensored work, but pays little.  
  - **Gallery B:** Pays well but demands you remove your most provocative piece.*  
  What’s your take?  
  A) I can calculate which option maximizes my overall success (e.g., exposure + income).  
  B) Artistic integrity and financial stability are different but comparable; I must pick without one being better.  
  C) These values are incommensurable—no common scale exists.  
  D) By choosing, I make one value (art or money) primary for my identity.  

  #### Question 4: Friendship vs. Principle  
  *A close friend asks you to lie to cover their minor scandal. You value honesty deeply, but also loyalty.*  
  How do you resolve this?  
  A) I can determine the better choice by weighing outcomes (e.g., harm avoided vs. trust eroded).  
  B) Honesty and loyalty pull equally hard, but aren’t equal; I resolve it by committing to one.  
  C) These duties are incomparable—reason is silent here.  
  D) There’s no fact of the matter; my choice constitutes my values.  

  #### Question 5: Tech Dilemma  
  *A new AI lets you upload one of two value profiles to guide your life:  
  - **Profile Alpha:** Maximizes collective well-being, even if it violates individual rights.  
  - **Profile Beta:** Prioritizes individual rights absolutely, even if it reduces overall happiness.*  
  What do you think?  
  A) One profile is better—I can rank them by a higher standard (e.g., "human flourishing").  
  B) Both profiles are valuable in distinct ways, and I must choose without one being superior.  
  C) Rights vs. utility are fundamentally incomparable.  
  D) My choice defines what morality *is* for me.  

  #### Question 6: Perfect Information (Career)  
  *You have two job offers in different cities. You have **all possible data**: exact salaries, career trajectories, climate, social life, etc. Still, you feel torn.*  
  Why?  
  A) I must be missing something—one is objectively better.  
  B) The options are "on a par": comparable but neither better, worse, or equal.  
  C) Career growth and lifestyle are incommensurable—no common measure exists.  
  D) Only my choice will make one better.  

  #### Question 7: Perfect Information (House)  
  *You’re buying a house. **Complete data** on two options:  
  - **House A:** Historic charm, needs costly repairs.  
  - **House B:** Modern efficiency, but no character.  
  You’re equally drawn to both.*  
  What explains this?  
  A) There’s a fact about which suits me best—I need to reflect harder.  
  B) Charm and efficiency are comparable but neither wins; I must commit.  
  C) These values can’t be measured against each other.  
  D) The choice itself creates the value.  

  #### Question 8: Vacation Paradox  
  *You’re booking a vacation with **full knowledge** of two options:  
  - **Trip A:** Relaxing beach getaway.  
  - **Trip B:** Adventurous mountain trek.  
  Both equally appeal to different sides of you.*  
  Your reaction?  
  A) One *must* be better for me now—I’ll figure it out.  
  B) They’re on a par; I pick without a normative "nudge."  
  C) Relaxation vs. adventure are incomparable.  
  D) Choosing *makes* it the right trip for me.  

  ---

  ### Scoring Key & Position Descriptions  
  **How to score:**  
  - Tally how many times you picked each letter (A, B, C, D).  
  - Use the table below to map your answers to positions.  
  - Your dominant position (most matches) is your implicit stance.  

  | Answer | Strong Commens. (SC) | Weak Commens. (WC) | Parity View (PV) | Incomparability (IV) | Epistemic View (EV) | Voluntarist (VV) |  
  |--------|------------------------|--------------------|-------------------|----------------------|---------------------|------------------|  
  | A      | ✔️                    | ✔️                 |                   |                      | ✔️                 |                  |  
  | B      |                       |                    | ✔️                |                      |                    |                  |  
  | C      |                       |                    |                   | ✔️                   |                    |                  |  
  | D      |                       |                    | (See note)        |                      |                    | ✔️               |  

  **Notes on overlaps:**  
  - **B answers:** Always map to **Parity View (PV)**. PV sees options as comparable but not rankable (not better/worse/equal)—choice resolves via commitment.  
  - **D answers:** Always map to **Voluntarist (VV)**. VV says no fact of the matter exists; choice *creates* value.  
  - **PV and VV overlap** in some theories (e.g., commitment in PV is self-constitutive). If you scored high in both, you likely hold a hybrid "commitment-voluntarist" view.  
  - **A answers:** Map to **SC, WC, or EV**. These share the belief that options *can* be ranked.  
  - **C answers:** Map purely to **IV** (incomparability).  

  #### Positions Explained:  
  1. **Strong Commensurabilism (SC):** All values reduce to one "currency" (e.g., happiness). Hard choices are calculation problems.  
  2. **Weak Commensurabilism (WC):** Values are plural, but a covering standard (e.g., "reason") always ranks options.  
  3. **Parity View (PV):** Some options are "on a par"—comparable but neither better, worse, nor equal. Choice requires commitment.  
  4. **Incomparability (IV):** Some values (e.g., art vs. justice) are genuinely incomparable. No rational choice is possible.  
  5. **Epistemic View (EV):** There’s always a fact about which is better; hard choices stem from ignorance.  
  6. **Voluntarist (VV):** No fact of the matter exists in hard cases; choice constitutes the self.  

  #### Inconsistent Combinations (Explain these to students):  
  - **High A + High C (e.g., SC/WC/EV + IV):** You think values are rankable *and* incomparable—unstable! Do you believe comparison is always possible (A) or sometimes impossible (C)?  
  - **High A + High D (e.g., EV + VV):** You say there’s a fact of the matter (A) *and* no fact (D)—contradictory.  
  - **High SC + High IV:** SC claims one value currency; IV denies comparability—mutually exclusive.  
  - **PV and VV Hybrid:** Common and coherent! PV’s "commitment" often involves voluntarist self-constitution.  

  #### Design Notes for You (the TA):  
  - **PV vs. EV Distinction:** Built into Q6–Q8 (perfect info cases). EV insists one *is* better (A); PV says they’re on a par (B).  
  - **Unoccupied Leaves:** The quiz cleanly separates all positions *except* PV/VV overlap (noted above). SC/WC/EV are grouped under A but distinguished in position descriptions.  
  - **Why Embarrassing?** Reveals unexamined commitments (e.g., an EV believer who picked D in triage scenarios).  

  **Handout Tip:** Print the quiz + scoring key as a foldable pamphlet. Students unfold to score after the unit! 😊
