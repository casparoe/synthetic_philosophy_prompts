prompt: |-
  Two people in my programme got into a long argument about Kripke and I ended up as the designated referee, which I am not qualified for. It went roughly like this.

  Mara said she cant shake the feeling that 'water is H2O' has to be contingent. It was a discovery, she said: chemists had to run experiments on the actual stuff, and before they did, the watery stuff in lakes and rivers could, for all anyone knew, have turned out to be made of something else entirely. Sam said that only shows the sentence is a posteriori, not contingent. The word 'water', he said, names the actual watery stuff rigidly; since the actual watery stuff is H2O, there is no possible world where water is not H2O. The experiments just tell us which stuff our word was latched onto all along.

  Mara said that sounds like a nice picture, but it commits him to saying there are necessary truths you can only know by looking at the world, and she doesnt see how that's not a contradiction. Necessity is supposed to be the thing that holds no matter how the world is, so what is experience doing there? Sam said experience is only needed to fix the reference; once it's fixed, the necessity comes along for free, so no contradiction.

  Mara came back with: 'water is water' is the bit I know a priori. 'Water is H2O' involves two different ways of thinking about the same stuff, and whether those two ways line up is an empirical matter about our concepts and the world. If the identity is necessary, that just means the concepts co-refer; it doesn't mean the sentence expresses a necessary truth in the way 'water is water' does. Sam said now she's smuggling in Fregean senses, and in any case an identity between a thing and itself is necessary, full stop — the informativeness is a fact about us, not about the water.

  Mara said fine, then take 'the morning star is the evening star': it's informative, and before astronomy people would have called it contingent, yet it turns out to be necessary if both descriptions pick out the same planet. That's exactly what bothers her: the necessity is discovered empirically, and that leaves her with two possibilities — either the sentence really is contingent, or 'necessary' has come apart from 'knowable a priori' so completely that we can't trust our modal intuitions. Sam said the second is exactly right, and that's the whole point of the necessary a posteriori: the feeling of contingency is a fact about our ignorance, not about the worlds.

  Then Mara said he's just relabeled the mystery. If 'water is H2O' is necessary and a posteriori, there must be two different readings of the sentence: one that's about whatever plays the water-role in a world, which is a priori and genuinely contingent, and one that's about this actual stuff, which is necessary and a posteriori. So her original intuition that the sentence is contingent tracks something real, not an illusion. Sam said that's fine as a concession to him, because on the reading where it's about the actual stuff, the sentence is necessary and a posteriori, which is all he ever claimed. And around there they started repeating themselves.

  Please adjudicate this step by step: at each turn, who's right about what, where does each one overreach, and is there a stable position that respects Mara's intuition that the contingency-feeling tracks something real while still keeping Sam's rigid-designation point? And say who is more right overall, if either.
reasoning: |-
  Okay, let me tackle this Kripke debate between Mara and Sam. Mara feels that "water is H₂O" must be contingent because its discovery required empirical investigation—chemists had to run experiments, and it could have turned out differently. Sam argues that it's a posteriori but necessary because "water" rigidly designates H₂O.

  First, I need to recall Kripke's arguments from *Naming and Necessity*. He distinguishes between epistemic and metaphysical modalities. A posteriori knowledge comes from experience, while necessity is about truth in all possible worlds. Rigid designators pick out the same object in every possible world. So for Sam, once "water" refers to H₂O in the actual world, it must refer to H₂O in all worlds, making "water is H₂O" necessary.

  Mara's concern is that if something is necessary, it should hold regardless of experience, so how can experience be involved? Sam's point about reference-fixing addresses this. Experience tells us what "water" refers to, but once fixed, the identity is necessary. That makes sense to me. Mara's mistake here is conflating a priori knowledge with necessity.

  When Mara brings up Fregean senses, she's thinking that "water" and "H₂O" have different senses, so their identity is informative and contingent. Sam counters that the necessity is about the referent, not our concepts. Kripke rejects descriptive senses for natural kinds, supporting Sam here.

  Mara's morning star example is a classic case of the necessary a posteriori. Sam's right that the contingency intuition comes from ignorance, not actual possibility. But Mara has a point that the feeling of contingency isn't baseless—it reflects epistemic possibility. Kripke acknowledges this with the distinction between epistemic and metaphysical modalities.

  Mara's proposal of two readings—one contingent (water-role) and one necessary (actual stuff)—is insightful. Sam accepts this but insists the rigid designation reading is necessary. Both are partly right. Mara's intuition about contingency-feeling tracking epistemic possibility is valid, but Sam's rigid designation is correct metaphysically.

  Overall, Sam's position aligns with Kripke, but Mara's concerns highlight the nuance between epistemic and metaphysical necessity. A stable position would acknowledge both the necessary a posteriori status and that the contingency-feeling reflects our epistemic limitations. Neither is entirely wrong; they emphasize different aspects.
answer: |-
  Here's a step-by-step adjudication of the argument, drawing on Saul Kripke's framework in *Naming and Necessity*. I'll clarify who is right at each stage, where overreach occurs, and how to reconcile their intuitions.

  ### Step 1: Mara's Initial Claim  
  **Mara:** "Water is H₂O" *feels* contingent because its discovery was empirical. Chemists could have found water to be XYZ.  
  **Sam:** This only shows it's *a posteriori*, not contingent. "Water" rigidly designates actual H₂O, so it's necessary.  
  **Adjudication:**  
  - **Mara is right** that the discovery *feels* contingent and empirical, capturing a genuine epistemic intuition.  
  - **Sam is right** that this confuses epistemology (how we know) with metaphysics (modal status). Empirical discovery ≠ contingency.  
  - **Overreach:** Mara conflates "could have turned out otherwise" (epistemic possibility) with "could have been otherwise" (metaphysical contingency).  

  ### Step 2: Mara's Objection to Necessary A Posteriori  
  **Mara:** Necessary truths shouldn’t require empirical discovery – that seems contradictory.  
  **Sam:** Experience fixes reference; necessity follows automatically. No contradiction.  
  **Adjudication:**  
  - **Sam is correct.** Kripke’s key insight is that necessity and apriority are distinct axes:  
    - **Necessity:** Truth in all possible worlds (metaphysical).  
    - **Apriority:** Knowable independently of experience (epistemological).  
    "Water is H₂O" is **necessary a posteriori**: necessary once reference is fixed, but reference-fixing requires empirical work.  
  - **Mara’s overreach:** She assumes necessity *must* be knowable a priori, but Kripke shows this is false (e.g., "Hesperus is Phosphorus").  

  ### Step 3: Mara’s Fregean Move  
  **Mara:** "Water is water" is a priori/necessary, but "water is H₂O" involves two concepts lining up empirically.  
  **Sam:** That smuggles in Fregean senses. Identity is necessary; informativeness is psychological.  
  **Adjudication:**  
  - **Sam is largely correct.** Kripke rejects Fregean senses for natural kind terms like "water." "Water" and "H₂O" are rigid designators for the *same substance*, so "water = H₂O" is a necessary identity between the *referent*, not the concepts.  
  - **Mara has a point** about cognitive significance: "water" and "H₂O" have distinct modes of presentation (e.g., "water" via sensory properties, "H₂O" via chemical theory). But this doesn’t affect the *metaphysical* necessity of the identity.  
  - **Overreach:** Mara mistakes cognitive difference for metaphysical contingency.  

  ### Step 4: Mara’s Morning Star Example  
  **Mara:** "Morning star = evening star" feels contingent pre-discovery, yet it’s necessary. This threatens modal intuitions.  
  **Sam:** The feeling of contingency reflects ignorance, not genuine possibility.  
  **Adjudication:**  
  - **Sam is correct.** Pre-discovery, people *mistakenly* thought "morning star ≠ evening star" was possible. Empirical discovery revealed it was *impossible* for them to differ.  
  - **Mara’s insight:** The "feeling of contingency" isn’t baseless – it tracks **epistemic possibility** (consistent with prior knowledge). But epistemic possibility ≠ metaphysical possibility.  
  - **Overreach:** Mara conflates pre-discovery epistemic contexts with metaphysical truth.  

  ### Step 5: Mara’s Two-Readings Proposal  
  **Mara:** There are two readings:  
  1. Contingent: "Whatever plays the water-role is H₂O."  
  2. Necessary: "Actual water is H₂O."  
  **Sam:** Fine, but the rigid reading (2) is necessary a posteriori – which is my point.  
  **Adjudication:**  
  - **Both are partially correct here.**  
    - **Sam is right** that the rigid reading ("water" as actual H₂O) is necessary a posteriori.  
    - **Mara is right** that her "contingency-feeling" tracks the **non-rigid, descriptive reading** (e.g., "the watery stuff in lakes"). This reading *is* contingent: in some worlds, XYZ occupies the "water role."  
  - **Stable Position:**  
    - **Sentence Ambiguity:** "Water is H₂O" has two interpretations:  
      - *Rigid:* "This substance (H₂O) is H₂O" → **necessary a posteriori**.  
      - *Descriptive:* "The dominant clear, drinkable liquid in lakes is H₂O" → **contingent a posteriori**.  
    - Mara’s intuition tracks the descriptive reading. Sam’s rigid designation applies to the first reading.  
    - Kripke endorses this: we often confuse non-rigid descriptions (contingent) with rigid designators (necessary).  

  ### Overall Assessment  
  - **Sam is more right metaphysically.** His position aligns with Kripke’s core thesis: rigid designation makes identity statements like "water = H₂O" necessary, and the a posteriori status arises from reference-fixing.  
  - **Mara is more right epistemologically.** Her "contingency-feeling" isn’t an illusion; it reflects (a) the descriptive interpretation of natural kind terms pre-rigidification, and (b) the gap between epistemic and metaphysical possibility.  
  - **Reconciliation:**  
    - The sentence *is* necessary a posteriori on its rigid reading (Sam’s point).  
    - The "contingency-feeling" tracks the *non-rigid, role-based* interpretation, which *is* contingent (Mara’s intuition). It also reflects our inability to rule out alternatives *before* reference is fixed.  

  ### Key Takeaways  
  1. **Necessity ≠ Apriority:** Kripke decouples these. Necessary truths *can* be empirical.  
  2. **Rigid vs. Non-Rigid:** "Water" rigidly designates H₂O, but phrases like "the watery stuff" non-rigidly pick out whatever fits a description.  
  3. **Stable Position:** Both intuitions are valid:  
     - Sam wins on the *metaphysical status* of "water = H₂O" (necessary).  
     - Mara wins on *why it feels contingent* (descriptive reading + epistemic possibility).  

  **Verdict:** Sam’s rigid designation argument is technically correct per Kripke, but Mara’s intuition exposes a crucial nuance about language and cognition. Neither "wins" outright, but Sam’s position is more defensible within Kripkean metaphysics. The resolution lies in disambiguating the two readings of the sentence.
