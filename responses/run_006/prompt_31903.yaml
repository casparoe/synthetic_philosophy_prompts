prompt: |-
  I've spent the last couple of years reading political philosophy after a career in experimental physics, and I've arrived at a set of views that I think of as broadly conservative in a Burkean sense, but I'm not sure they all fit together. I'd like someone to audit them for consistency. Here they are:

  (1) I accept Chesterton's fence as a defeasible but strong presumption: you should not reform or abolish an inherited institution, practice, or norm unless you can articulate why it was established and what function it served.

  (2) I believe that the accumulated experience embedded in long-standing institutions constitutes a genuine form of knowledge — a kind of distributed wisdom — that is not fully available to any individual reasoner, no matter how intelligent.

  (3) I hold that some reforms are plainly justified, and that the case for them does not require reconstructing the original rationale for the institution they replace. For example, the abolition of chattel slavery did not require a nuanced account of the social function of slavery before one could judge it wrong.

  (4) I believe that the burden of proof in any proposed reform always falls on the reformer, never on the defender of the status quo.

  (5) I am committed to the view, partly from my scientific training, that the best way to learn about a complex system is to perturb it — that is, to experiment — and that this applies to social systems as well.

  (6) I think that the social world is significantly more complex and less predictable than most physical systems I worked with, and that the track record of top-down social engineering is poor enough to warrant a general skepticism toward it.

  I'd like you to go through these and identify which pairs or subsets are in genuine tension, which tensions are only apparent and dissolve on closer inspection, and how severe the remaining tensions are. Then tell me what the least costly revision would be to restore consistency, and what I'd lose by making it.
reasoning: |-
  Okay, the user comes from an experimental physics background and has spent years reading political philosophy, now identifying with Burkean conservatism. Their query presents six principles they've developed and seeks an audit for internal consistency. 

  Hmm, interesting hybrid perspective here - the rigor of physics meeting organic social philosophy. I notice they've already flagged potential tensions themselves (e.g. Chesterton's fence vs. slavery abolition). Smart framing. 

  First, let's map the fault lines. Principle 3 (slavery counterexample) clearly challenges principle 4 (burden of proof always on reformer). That's the loudest alarm bell. Then principle 5 (experimental perturbation) seems to clash with principle 6 (social complexity caution) - though maybe it's more of a productive tension? 

  *scratches head* The slavery example is tricky. It exposes how principle 4 could protect immoral institutions if applied rigidly. User probably knows this - their physics-trained mind wants systematic rules but their ethics won't ignore slavery's obvious wrongness. 

  Principle 2 (distributed wisdom) and principle 5 (experimentation) might actually complement if we view experiments as small-scale probes rather than revolutions. Burke wasn't against all change - just reckless demolition. 

  *checks notes* Ah! The key is distinguishing magnitudes. User's physics intuition should appreciate that: perturbing a system locally (principle 5) ≠ top-down overhaul (principle 6's concern). That resolves tension B. 

  For the slavery problem... maybe reframe "burden of proof" not disappearing but shifting when fundamental rights are violated? So reformer still carries burden but it lightens proportionally to the injustice. Losing some procedural purity but gaining ethical coherence. 

  User's background matters here. As a scientist, they'll understand tradeoffs - every consistency fix has costs. For principle 4 adjustment, cost is introducing moral judgment into what was a neutral procedural rule. Benefit? Avoids defending indefensible institutions. 

  *imagines user's perspective* They might worry this opens floodgates to subjective claims of "obvious injustice." Fair concern. But their own slavery example shows some cases truly are clear-cut - we don't need functional analysis to know owning people is wrong. 

  Final note: User's hybrid identity (physicist-turned-philosopher) is their superpower here. The experimental mindset (prin 5) actually saves Burkeanism from rigidity when balanced with their complexity awareness (prin 6). That's elegant. 

  Should end by honoring their intellectual journey - this isn't inconsistency but sophisticated tension management. Like physics, political philosophy needs complementary principles that constrain each other.
answer: |-
  Your views form a sophisticated synthesis of Burkean conservatism with scientific empiricism—a fascinating hybrid. While largely coherent, there are substantive tensions requiring attention. Let's analyze them systematically:

  ### Core Tensions & Their Severity
  1. **Tension A: (3) vs. (4) [High Severity]**  
     - **Conflict:** (3) asserts that some reforms (e.g., abolishing slavery) require no functional analysis of the institution being replaced. (4) insists reformers *always* bear the burden of proof against the status quo.  
     - **Why it matters:** (4) would force reformers to justify abolishing slavery *despite* its historical functions (e.g., economic stability), yet (3) correctly notes this is morally unnecessary. This risks protecting deeply unjust institutions under a procedural presumption.  

  2. **Tension B: (5) vs. (6) [Moderate Severity]**  
     - **Conflict:** (5) advocates social experimentation ("perturb complex systems to learn"), while (6) warns that social systems are too complex/unpredictable for engineering, favoring skepticism toward intervention.  
     - **Nature of tension:** (5) implies proactive, evidence-driven change; (6) implies restraint. However, this may be a *productive* tension if "perturbation" is confined to small-scale, reversible trials.  

  3. **Tension C: (1)/(2) vs. (3) [Resolvable]**  
     - **Apparent conflict:** (1)/(2) emphasize prudence and institutional wisdom, while (3) permits radical reform without historical analysis.  
     - **Resolution:** (3) applies to institutions violating fundamental moral principles (e.g., human dignity), overriding functionalist arguments. Burke himself accepted such exceptions (e.g., condemning slavery). **Tension dissolves** if (3) is treated as a moral override clause.  

  4. **Tension D: (5) vs. (1)/(4) [Moderate Severity]**  
     - **Conflict:** Experimentation (5) may require dismantling "fences" without full understanding of their function, contra (1) and (4).  
     - **Mitigation:** If experiments are *localized, incremental, and reversible* (e.g., policy pilots), they align with Burkean caution while generating knowledge. Large-scale experiments violate (1)/(4).  

  ---

  ### Least Costly Revision for Full Consistency  
  **Revise (4) to include a moral exception clause:**  
  *"The burden of proof in any proposed reform falls on the reformer, except when the status quo violates fundamental and widely recognized moral principles (e.g., basic human rights), in which case the burden shifts to defenders to justify its persistence."*  

  #### What You Gain:  
  - **Resolves Tension A:** Slavery abolition no longer requires functionalist justification; reformers can invoke moral urgency.  
  - **Preserves (3):** Explicitly codifies its core insight.  
  - **Retains Burkean core:** (1), (2), and (6) remain intact. Experimentation (5) can proceed cautiously within moral/empirical bounds.  

  #### What You Lose:  
  - **Procedural neutrality:** (4) originally imposed a uniform burden of proof, regardless of a reform's moral valence. The revision introduces subjective judgment ("fundamental principles").  
  - **Burkean purity:** Strict Burkeans might argue this opens the door to rationalist moralizing, which Burke distrusted.  

  ---

  ### Why Other Tensions Are Manageable  
  - **(5) vs. (6):** Not irreconcilable. Frame experimentation as *empiricism in service of tradition*: small perturbations (e.g., charter schools, UBI trials) test modifications without wholesale dismantling. This respects social complexity while enabling learning.  
  - **(1)/(2) vs. (5):** Chesterton’s fence need not forbid *all* experimentation—only reckless or large-scale change. Pilots that preserve core institutions are defensible.  

  ---

  ### Final Synthesis  
  Your framework is robust if:  
  1. **Moral crises override functionalism** (Revised (4) + (3)),  
  2. **Experimentation is hypothesis-driven & bounded** (5) constrained by (1)/(2)/(6), and  
  3. **Institutional wisdom is default but not indefeasible** (1)/(2) tempered by (3)/(5).  

  This positions you as a "Burkean experimentalist": skeptical of utopianism but committed to evidence-based, ethical evolution. The sole non-negotiable fix is qualifying (4)—without it, slavery-like cases expose a fatal flaw in procedural conservatism. With that revision, your physics-trained empiricism and Burkean respect for tradition cohere into a dynamic, principled worldview.
