prompt: |-
  Two people in my philsophy of language seminar got into it last week about expressivism and I've been turning it over ever since. They were arguing about whether the Frege-Geach problem is still a live issue.

  Dan said it's basically a knockout: if moral claims just express attitudes, then you can't explain what's going on when moral language shows up embedded in conditionals. Take "If lying is wrong, then getting your brother to lie is wrong." The speaker isn't expressing disapproval of lying in the antecedent—they're entertaining a hypothetical. So the meaning of "wrong" seems to shift between asserted and unasserted contexts. That's a compositionality failure, end of story.

  Mira said Dan was about thirty years behind. Blackburn showed you can treat the conditional as expressing a higher-order attitude: an attitude of disapproval toward the combination of disapproving of lying and not disapproving of getting your brother to lie. So "wrong" means the same thing throughout—it's just that the whole complex sentence expresses a more complicated attitude. No shift in meaning, no problem.

  Dan said okay, but then modus ponens breaks. If "If murder is wrong, then abortion is wrong" and "murder is wrong" are both just attitudes, then what makes the inference to "abortion is wrong" logically valid? You need truth conditions to underwrite logical consequence. Without them, anything goes.

  Mira said that's question-begging. Blackburn's whole move is to redefine validity in terms of clashes of attitudes, not truth-preservation. An inference is valid if you can't accept the premises and reject the conclusion without your attitudes clashing. And Blackburn shows there's a clash in the modus ponens case: approving of the conditional, approving of the antecedent, and disapproving of the consequent is an incoherent combination of attitudes. That's the constraint—it's not just "anything goes."

  Dan said that's not logic, it's psychology. You're telling me what attitudes I can coherently hold, not what follows from what. The whole point of logic is that it's topic-neutral and attitude-independent.

  Mira said that's the point Dan keeps missing: expressivism is a revisionary theory of moral language. Once you give up the idea that moral claims are truth-apt, you should expect the logic to look different. But it still constrains reasoning—incoherent combinations of attitudes are still something you should avoid, and that's normativity enough.

  Then Dan shifted ground. He said: fine, but what about mixed inferences? "If the cat is on the mat, then murder is wrong" is a mixed sentence with a descriptive antecedent and a moral consequent. What's the attitude there? You can't just say it's a higher-order attitude about combinations of descriptive beliefs and moral attitudes, because then you've got to explain how logical vocabulary works across the descriptive/normative divide without collapsing the distinction.

  Mira admitted mixed sentences are the hardest case but said both Gibbard and later Blackburn have accounts. Gibbard's norm-expressivism treats all normative language as expressing plans, and the logic of plans handles mixed contexts by treating factual-normative worlds as the objects of planning states. She said Dan was cherry-picking the earliest version of the view and acting like nobody's worked on it since 1984.

  Dan said Gibbard's solution is basically to build truth conditions back in through the back door—if you're treating normative statements as expressing plans plus factual beliefs with representational content, you're not really an expressivist anymore, you're a hybrid theorist.

  That's where they left it. Neither convinced the other. I'm not sure who's right. Can you go through their exchange and adjudicate each move? Who has the better of which specific arguments, and what, if anything, are both of them missing?
reasoning: |-
  Okay, I see the user is deeply engaged with a philosophy of language debate from their seminar. They've presented a detailed exchange between Dan (critic of expressivism) and Mira (defender), centered on whether the Frege-Geach problem still undermines expressivist accounts of moral language. The user wants a thorough adjudication of each argument.

  First, I need to unpack the core tension: Dan sees compositionality as expressivism's fatal flaw, while Mira insists contemporary developments (Blackburn, Gibbard) have solved it. The user seems philosophically sophisticated but wants clarity on who's winning which points - and perhaps whether there's a bigger picture they're missing.

  Breaking it down move by move:
  Dan's opening salvo about unembedded contexts is strong but basic - he's right that early emotivism failed here, but Mira correctly notes Blackburn's higher-order attitude solution addresses this. Where Dan scores is in pushing to modus ponens: his "that's not logic, it's psychology" objection cuts deep because it questions whether expressivism can preserve logic's normative force without truth-aptness.

  Mira's defense is nimble - she rightly frames expressivism as revisionary, not descriptive. But Dan's mixed inference challenge is devastatingly effective. The cat-on-mat example exposes expressivism's Achilles' heel: maintaining a unified logic across descriptive/normative divides. When Mira invokes Gibbard's planning semantics, Dan lands a final blow by accusing it of hybrid-theory backsliding - a charge that isn't entirely unfair.

  What both miss: Dan underestimates how radically expressivism redefines "logic," while Mira may overstate how solved these problems are. The deeper issue is metaontological - whether moral discourse requires representational semantics at all. The user might benefit from seeing this as a clash between descriptive and revisionary metaethics rather than a solvable puzzle.

  I'll structure my response to validate both debaters while showing why the disagreement persists: Dan wins on traditional logic preservation, Mira on internal coherence of revised frameworks, and the stalemate reveals fundamental divides in metaethics. The user's lingering doubt is philosophically warranted - this remains contested terrain.
answer: |-
  This is a rich dialectic that cuts to the heart of contemporary metaethics. Both Dan and Mira raise strong points, though neither lands a definitive knockout blow. Here's an adjudication of each move, highlighting strengths, weaknesses, and what they might be missing:

  **1. Dan's Opening: The Frege-Geach Problem (Compositionality)**

  *   **Argument:** Moral terms in unasserted contexts (like the antecedent of a conditional) don't express attitudes. If expressivism defines meaning *solely* as attitude-expression, it fails to explain the consistent meaning of "wrong" across asserted/unasserted contexts. This is a compositionality failure – meaning isn't built systematically.
  *   **Strength:** Perfectly captures the core challenge Frege-Geach poses for *simple* expressivism (e.g., Ayer's emotivism). It highlights the need for expressivists to explain how moral vocabulary functions logically, not just psychologically, when embedded.
  *   **Weakness:** Ignores sophisticated expressivist responses developed *specifically* to address this (like Blackburn's).
  *   **Verdict:** Dan scores the initial point against naive expressivism, but Mira is right that this isn't a "knockout" against contemporary versions.

  **2. Mira's Response: Blackburn's Higher-Order Attitudes**

  *   **Argument:** The *entire complex sentence* expresses a complex higher-order attitude. For the conditional, it's disapproval of a specific combination of attitudes (disapproving of lying while not disapproving of brother-lying). The word "wrong" retains its core attitude-expressing function throughout.
  *   **Strength:** Provides a plausible, purely expressivist account of the meaning and logical function of conditionals containing moral vocabulary. It directly addresses the compositionality concern by showing how the complex expression's meaning is built from the parts' core functions within an attitudinal framework.
  *   **Weakness:** It might seem psychologically strained or complex compared to truth-conditional accounts. Dan's next point targets whether this approach truly preserves *logic*.
  *   **Verdict:** Mira successfully counters Dan's initial compositionality charge against sophisticated expressivism (like Blackburn's quasi-realism). Blackburn's solution is widely seen as a significant advance, making F-G a "live issue" in the sense of requiring complex responses, not an insurmountable barrier.

  **3. Dan's Counter: Modus Ponens & Logic**

  *   **Argument:** If premises are *only* attitudes, how can an inference like modus ponens be *logically valid*? Validity requires truth-preservation. Without truth-aptness, you have no logic, just contingent psychological constraints ("anything goes").
  *   **Strength:** Hits a profound philosophical nerve. Expressivism *does* challenge the traditional, truth-conditional foundation of logic. Many share the intuition that logic's normativity feels different from mere psychological consistency. Dan forces expressivists to provide a *normative* account of logical consequence, not just a description of contingent psychological patterns.
  *   **Weakness:** Accuses expressivism of not providing "logic" while defining logic solely in terms of truth-preservation – which expressivism explicitly rejects! He risks begging the question against the expressivist's revisionary project.
  *   **Verdict:** Dan raises a deep and important challenge about the *nature* of logic and normativity. While forceful, his framing ("not logic, it's psychology") is question-begging against expressivism's revisionary aims.

  **4. Mira's Counter: Redefining Validity & Incoherence**

  *   **Argument:** Expressivism redefines validity as *consistency in attitudes*. Modus ponens is valid because simultaneously holding the attitudes expressed by the premises while rejecting the attitude expressed by the conclusion involves an *incoherent*, self-defeating state of mind. This incoherence provides the normative constraint ("should avoid").
  *   **Strength:** Provides a clear, expressivist-compatible account of logical consequence and its normative force. It shows how modus ponens *works* within the expressivist framework without appealing to truth. Blackburn *does* demonstrate the specific clash in the modus ponens case. This is the core expressivist response.
  *   **Weakness:** The worry remains: Is this *truly* logical normativity, or just a contingent psychological norm about avoiding discomfort or confusion? Can this account capture the necessary, topic-neutral, objective *feel* of logical validity? Can it handle complex logical reasoning as robustly as truth-based accounts?
  *   **Verdict:** Mira successfully provides the *standard* and internally coherent expressivist response to the logic challenge. She correctly identifies Dan's demand for truth-preservation as question-begging. However, Dan's deeper worry about the *kind* of normativity offered persists as a legitimate philosophical concern.

  **5. Dan's Shift: Mixed Inferences**

  *   **Argument:** Mixed sentences/conditionals (descriptive antecedent + normative consequent) pose a unique problem. How can logical vocabulary ("if...then") operate *uniformly* across descriptive (truth-apt) and normative (attitude-expressing) domains without collapsing the expressivist distinction? What is the single "thing" (belief? attitude?) that the conditional expresses?
  *   **Strength:** This is widely regarded as the *most difficult* outstanding problem for expressivism. It forces expressivists to show how their account of complex attitudes unifies logical operations over radically different types of content. It directly challenges the expressivist's ability to maintain a *single, unified* logic. Dan's point is potent and targets a major area of ongoing research and debate.
  *   **Weakness:** He minimizes the sophisticated efforts (like Gibbard's) to address this very issue.
  *   **Verdict:** Dan lands a significant blow. Mixed inferences remain a major challenge and a key reason why F-G is still a "live issue." Expressivist solutions here are complex and contested.

  **6. Mira's Response: Gibbard & Planning**

  *   **Argument:** Gibbard's norm-expressivism (later developments) treats normative claims as expressing *plans* or *plan-laden states*. The logic is handled by considering "factual-normative worlds" – combinations of how the world is and what plans apply. Logical operators work on these complex objects of thought.
  *   **Strength:** Acknowledges the difficulty and points to the most developed expressivist framework (Gibbard's) designed explicitly to handle this. Gibbard *does* offer a systematic account of mixed contexts within a broadly expressivist framework using the concept of *hyperplans* and worlds.
  *   **Weakness:** Dan's final retort highlights a genuine tension.
  *   **Verdict:** Mira is correct that sophisticated solutions exist *within the expressivist tradition*. Dismissing them as "cherry-picking" is unfair.

  **7. Dan's Final Retort: Hybrid Theory by Stealth?**

  *   **Argument:** If Gibbard's solution relies on "factual-normative worlds" as the objects of planning states, and factual components *do* have representational content/truth-conditions, then expressivism has smuggled in traditional representationalism for the descriptive parts. The view becomes a hybrid, not pure expressivism.
  *   **Strength:** Identifies a crucial ambiguity or tension in Gibbard's solution. Expressivists *insist* normative claims aren't truth-apt/belief-like, but need the *logical machinery* provided by representational elements. Does this undermine the core expressivist thesis? This is a major point of contention in interpreting Gibbard and assessing whether expressivism truly solves mixed inferences without compromise.
  *   **Weakness:** May overstate the case. Gibbard maintains that the *normative* component is still non-representational and plan-expressing; he's offering a *logical* framework for combining it with representational elements, not abandoning the core expressivist commitment for normative claims themselves.
  *   **Verdict:** Dan highlights a significant and unresolved debate *within* the expressivist camp and its critics. Whether Gibbard's solution is a brilliant unification or a problematic concession is actively debated. This keeps F-G very much alive.

  **Overall Adjudication & What's Missing:**

  *   **Mira's Strengths:** Successfully defends contemporary expressivism against the *initial, simple* F-G charge using Blackburn's higher-order attitudes. Correctly points out that expressivism offers a coherent, revisionary account of logic (attitude consistency), countering Dan's "anything goes" claim. Rightly notes that significant work (Gibbard, Blackburn) addresses mixed inferences.
  *   **Dan's Strengths:** Forcefully highlights the *fundamental challenge* expressivism poses to the traditional conception of logic and truth. Successfully argues that mixed inferences remain a serious, perhaps the most serious, hurdle. Raises a valid concern about whether Gibbard's solution compromises pure expressivism.
  *   **Who "Wins"?** Neither decisively. Mira shows expressivism isn't *destroyed* by F-G; sophisticated versions offer coherent responses. Dan shows F-G remains a *live issue* because those responses involve significant philosophical costs and unresolved challenges, particularly regarding logic's nature and mixed inferences. Expressivism survives, but under ongoing pressure.
  *   **What Both Might Be Missing:**
      *   **The Depth of the Revision:** Both might underplay how radically expressivism revises our understanding of language, logic, and reasoning. Accepting it requires accepting that moral "logic" is fundamentally different in kind from descriptive logic, rooted in attitude consistency rather than truth.
      *   **Internal Challenges for Expressivism:** Beyond F-G, expressivists grapple with other issues like the "Negation Problem" (distinguishing disapproving of X from not approving of X) and explaining the *phenomenology* of moral judgment (why moral claims *feel* belief-like and truth-apt).
      *   **Alternative Frameworks:** The debate sometimes assumes expressivism vs. realism is the main game. Other views (e.g., certain forms of contextualism, relativism, or hybrid theories) might offer different paths through the F-G thicket.
      *   **The Role of "Truth":** They touch on it, but the debate hinges profoundly on whether moral discourse *requires* robust truth-aptness to function logically, or whether expressivism's alternative account of normativity suffices. This is a deep meta-philosophical divide.

  **Conclusion:** The Frege-Geach problem is absolutely still a "live issue." It's not a knockout punch against expressivism thanks to the sophisticated responses from Blackburn, Gibbard, and others. However, it remains a powerful challenge that forces expressivists into complex theoretical maneuvers and raises persistent questions about the nature of logic, meaning composition, and the integration of normative and descriptive discourse. Dan is right that these challenges are deep and unresolved; Mira is right that expressivism has developed powerful, coherent responses that keep it a viable contender. The debate continues. Your seminar captured the essential, ongoing tension brilliantly.
