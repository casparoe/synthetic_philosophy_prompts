answer: |-
  This is a precisely framed inquiry into a remarkably persistent philosophical stalemate. Let's dissect the disagreement systematically before diagnosing its nature.

  ### Mapping the Logical Space
  **Core Commitments:**
  - *Intentionalist:* Meaning is *constituted* by communicative intention. The text is an extension of the author's agency. Linguistic conventions are tools for intention-realization.
  - *Anti-intentionalist:* Meaning is *constituted* by public linguistic conventions and contextual constraints. The text is an autonomous linguistic artifact. Authorial intention is evidence for meaning, not its source.

  **Points of Concession (Common Ground):**
  1. Biographical/contextual evidence is *relevant* to interpretation.
  2. Authors can fail to realize intentions (the "Gettier problem" of literature).
  3. Intention is sometimes inaccessible (requiring text-focused interpretation).
  4. Attributing historically impossible meanings is illegitimate.

  **Points of Tension (The Real Fracture Lines):**
  1. **Ontology of the Text:** Is the text fundamentally a *trace of agency* (intentionalist) or a *publicly available structure* (anti-intentionalist)?
  2. **Grounds of Constraint:** Why can't we attribute historically impossible meanings?  
     - Intentionalist: Because meaning *is* intention.  
     - Anti-intentionalist: Because such readings violate the text's *historical-linguistic possibility space*, not because they misreport mental states.
  3. **Nature of Failure:** When an author fails to realize intentions:  
     - Intentionalist: The text *fails to mean* what was intended (though it may convey something unintended).  
     - Anti-intentionalist: The text *means* what it conveys; the author's failure is psychological, not semantic.
  4. **Priority of Evidence:** When intention is known but conflicts with conventional meaning:  
     - Intentionalist: Intention overrides ("They meant 'X' but said 'Y'").  
     - Anti-intentionalist: The public meaning *is* the meaning ("They said 'Y', regardless of intent").

  ### Diagnosis

  **(1) Metaphysical vs. Verbal Dispute?**  
  It is **primarily metaphysical**, but *complicated by pragmatic entanglement*. Both sides use "meaning" to refer to the *primary object of literary interpretation*. The dispute is over what *kind of thing* that object fundamentally is:  
  - Intentionalist: Meaning is a *relational property* (author-text-reader).  
  - Anti-intentionalist: Meaning is an *emergent property* of the linguistic artifact in context.  

  **Why not obviously verbal?**  
  - Participants aren't simply talking past each other; they disagree on core cases (e.g., whether a Freudian reading of Shakespeare is *false* or merely *anachronistic*).  
  - The entanglement arises because both frameworks *use the same evidence* (text, context, biography) but assign it different *constitutive roles*. This creates the illusion of agreement at the evidentiary level while masking the deeper divergence in what evidence is *evidence for*.

  **(2) Normative Disagreement?**  
  Yes, **profoundly normative**, but *grounded in metaphysics*. The core question is: *What makes interpretation valuable?*  
  - Intentionalist: Value lies in recovering *communicative success* – understanding the author's act.  
  - Anti-intentionalist: Value lies in engaging with the *text's semantic potential* – its capacity to generate significance for readers.  

  This normative divergence explains why empirical concessions don't resolve the dispute: Agreement on *how we interpret* masks disagreement on *why we interpret*. The shared rejection of anachronism reflects a shared *epistemic norm* ("Respect historical context"), not agreement on what meaning *is*.

  **(3) Hidden Empirical Question?**  
  Empirical data (e.g., psycholinguistics of reading, ordinary language use of "means") is **relevant but insufficient**:  
  - **Ordinary Language:** Speakers *do* conflate "X meant Y" with "X intended Y" (e.g., "The dark clouds mean rain" vs. "She meant to insult you"). This ambiguity fuels the dispute but can't resolve it, as literary interpretation is a specialized practice.  
  - **Cognitive Science:** Evidence that readers *spontaneously construct authorial minds* during reading might comfort intentionalists, but doesn't prove such constructions *constitute* meaning. Anti-intentionalists can treat this as a psychological heuristic.  

  Empirics might shift burdens of proof (e.g., if readers consistently privilege intention in comprehension tasks), but cannot settle the *normative/metaphysical* core: "How *should* we conceptualize meaning in literary criticism?" isn't answerable by polls or fMRI.

  **(4) Paths to Progress**  
  The impasse persists because both positions capture *aspects* of textual engagement while ignoring their *domain-specific validity*. Progress requires:

  1. **Acknowledging Category Plurality:** "Meaning" in literature serves multiple functions:  
     - *Communicative* (author-focused)  
     - *Experiential* (reader-focused)  
     - *Culturally reflexive* (text as historical artifact)  
     No monolithic theory can cover all without distortion.  

  2. **Reframing the Question:** Instead of "What *is* meaning?", ask:  
     - *"Under which interpretive interests is authorial intention relevant/irrelevant?"*  
     - *"What do we lose/gain by privileging one conception of meaning over another in a given context?"*  

  3. **Developing a Pragmatic Framework:** Meaning could be modeled as *use-relative*:  
     - **For textual scholarship:** Intention is often primary (e.g., editing drafts).  
     - **For aesthetic appreciation:** Conventional meaning and readerly experience may dominate.  
     - **For cultural critique:** The gap between intention and reception becomes analytically fertile.  

  4. **Embracing Dynamic Artifacts:** Literary texts function as *institutional objects* whose meaning evolves through reinterpretation. Authorial intention anchors the *initial* act, but not the *career* of the work. A dual-aspect theory (intention at genesis; conventional meaning in reception) may resolve many pseudo-conflicts.

  **Conclusion:** The debate isn't solvable because it asks a false binary question ("What *is* meaning?") about a multifaceted phenomenon. Progress lies not in declaring a winner but in developing a *metatheory* that:  
  - Distinguishes *speaker meaning* (intention) from *sentence meaning* (conventions) from *work meaning* (literary significance),  
  - Recognizes that different interpretive projects legitimately prioritize different aspects,  
  - Accepts that texts, as cultural objects, accrue meanings beyond original contexts *without* denying the historical specificity of their production.  
  The persistence of the debate signals not futility but the irreducible complexity of engaging with human expression. Its value lies in sharpening our questions, not in delivering final answers.
