  Regarding the user's specific questions: The dispute appears to be both metaphysical and normative. While there are verbal elements (different conceptions of "meaning"), the persistence stems from deeper commitments. The metaphysical layer asks what meaning fundamentally is, while the normative layer concerns what we should value in interpretation. Empirical data about ordinary language use might help but wouldn't resolve the core philosophical divide.

