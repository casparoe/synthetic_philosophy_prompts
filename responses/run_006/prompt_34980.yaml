prompt: |-
  I'm teaching a two-hour seminar on risk-weighted expected utility theory to advanced philosophy undergraduates who have taken exactly one prior course in decision theory. They know the von Neumann–Morgenstern framework — they can state the axioms, work through simple expected-utility calculations, and recognize that the representation theorem says preferences satisfying the axioms can be represented as maximizing expected utility. They have not seen the Allais paradox or any generalization of expected utility theory. Don't explain REU to me; plan how I should teach it. I need the order in which the pieces must be introduced and why each depends on the one before it, the single example that should carry the entire session (and why that example rather than the Ellsberg paradox, if the Ellsberg paradox is not the right choice), the misconceptions students will predictably form — I am guessing at least "this is just diminishing marginal utility with extra steps" and "the risk function is just a transformed probability weighting like in prospect theory" — and at exactly what point in the sequence I should head each one off before it hardens. Also: what should I openly refuse to cover at this level, and what one question can I ask at the end to tell whether they have understood the structure of the view rather than merely memorized the formalism?
reasoning: |-
  Okay, the user is teaching a seminar on risk-weighted expected utility (REU) theory to advanced philosophy undergrads. They've had one course in decision theory, so they know the VNM framework: axioms, EU calculations, the representation theorem. No exposure to Allais or generalizations yet. The user wants a structured lesson plan focusing on sequencing, a central example, addressing misconceptions, and assessment.

  First, I need to recall REU theory basics. It's Buchak's approach where agents weight utilities by a risk function, not just probabilities. Unlike prospect theory, it's about attitude towards risk structure, not probability weighting. The key is the risk function applied to cumulative probabilities.

  The user mentioned possible student misconceptions: confusing REU with diminishing marginal utility (DMU) or prospect theory's probability weighting. These need to be addressed proactively. Also, Ellsberg vs. Allais: Ellsberg is ambiguity aversion, which REU doesn't cover, while Allais is risk attitude, so Allais is better here.

  Structuring the two-hour session: Start by reactivating VNM knowledge, then introduce a violation of independence via Allais Paradox. Present the paradox with specific choices to show inconsistency with EU. That leads to questioning the independence axiom.

  Next, explain REU as an alternative. Define the risk function r(p) that transforms cumulative probabilities. Use a simple choice problem (like the Allais numbers) to show how REU calculations work. Contrast with EU to highlight the role of risk attitude.

  For misconceptions: When introducing the risk function, explicitly distinguish it from probability weighting (it's applied to cumulative distro, not raw probs). When discussing utility transformation, clarify it's not DMU since DMU is about wealth levels, not structural risk.

  What to omit: Proofs of representation theorems, comparative risk attitudes, applications beyond the model. Focus on the core mechanics and philosophical implications.

  Assessment: Ask how REU and EU would rank two lotteries with the same mean but different spreads. This tests understanding of risk-weighted aggregation vs. linear probabilities.

  Timing is tight. Allocate time carefully: 15 mins VNM recap, 20 mins Allais setup, 25 mins REU mechanics, 15 mins misconceptions, 15 mins implications, 10 mins Q&A. The central example must be Allais throughout to maintain focus.
answer: |-
  Here’s a structured 2-hour lesson plan focused on **conceptual sequencing**, **preempting misconceptions**, and **assessment**, using the Allais Paradox as the anchoring example:

  ---

  ### **Why This Sequence & the Central Example**
  **Core Example: Allais Paradox (Not Ellsberg)**  
  Ellsberg tests *ambiguity aversion* (unknown probabilities); Allais tests *risk attitude* (known probabilities). REU targets the latter. Use Allais’ original numbers (simplified):  
  - **Choice 1:** A: $1M for sure vs. B: 89% $1M, 10% $5M, 1% $0  
  - **Choice 2:** C: 11% $1M, 89% $0 vs. D: 10% $5M, 90% $0  
  *Typical preference:* A > B and D > C. EU violates independence axiom.  

  **Why Allais?**  
  - Exposes **structural risk attitudes** (sure-thing preference vs. tail-risk seeking).  
  - Requires no new probability concepts (unlike Ellsberg).  
  - Forces confrontation with **independence axiom failure** → natural segue to REU.

  ---

  ### **Lesson Sequence (110 mins total)**
  1. **Reactivate VNM (15 mins)**  
     - *Activity:* Quick EU calculation (e.g., lottery: 50% $0, 50% $100).  
     - *Why:* Ensure fluency in EU formalism. Emphasize **independence axiom**: If L ≻ M, then pL + (1-p)N ≻ pM + (1-p)N.  
     - *Head off:* "EU is *only* about outcomes/probabilities, not *how risks are structured*."

  2. **Introduce Allais Paradox (20 mins)**  
     - *Activity:* Students choose A/B and C/D individually → tally class preferences.  
     - *Why:* Make conflict visceral. Show mathematically why A > B and D > C violates EU (compute 0.11u(1M) < 0.10u(5M) from A > B, but reverse from D > C).  
     - *Key insight:* "Independence feels irrational here. Maybe agents care about *dispersion of risk*."

  3. **REU Mechanics via Allais (25 mins)**  
     - *Concept:* "REU weights *cumulative probabilities* via a **risk function** r(p)."  
       - Rank outcomes worst-to-best (e.g., $0 → $1M → $5M).  
       - REU = Σ [u(x_i) * (r(1 - F_{i-1}) - r(1 - F_i))] where F is cumulative probability.  
     - *Allais Calculation:*  
       - For **B** ($0, $1M, $5M): r(0.01)u(0) + [r(0.90) - r(0.01)]u(1M) + [1 - r(0.90)]u(5M)  
       - Risk-averse r(p): concave (e.g., r(p) = p²). Show how this can yield A > B and D > C.  
     - *Why this order:* Students must *see the EU failure* before needing an alternative. Formalize REU only after intuition is established.

  4. **Risk Function vs. Misconceptions (15 mins)**  
     - *Misconception 1: "r(p) is like prospect theory's π(p)"*  
       - **Preempt during calculation:** "r(p) transforms *cumulative* probabilities, *not* raw probabilities. It encodes attitude toward *aggregate risk*, not probability distortion."  
     - *Misconception 2: "REU is just DMU in disguise"*  
       - **Contrast explicitly:** "DMU curves utility *of outcomes* (e.g., u($1000) vs. u($2000)). REU’s r(p) curves *probability weights* for fixed utilities. Show DMU *cannot* resolve Allais (use linear u for money)."  

  5. **Philosophical Implications (15 mins)**  
     - *Question:* "What does REU say about rationality? VNM axioms aren’t sacred!"  
     - *Key point:* REU satisfies *coherence* (transitivity, dominance) but rejects independence. Discuss **instrumental vs. structural rationality**.  

  6. **What to Omit (Explicitly State)**  
     - No comparative statics (e.g., Ross’s critique).  
     - No dynamic choice (tranquility, resolute choice).  
     - No technical proofs (e.g., representation theorem conditions).  
     - *Say:* "Today is about *why* REU exists and its core mechanics—not advanced extensions."

  ---

  ### **Assessment Question (Final 5 mins)**  
  **"Lottery X:** 50% chance $0, 50% chance $100.  
  **Lottery Y:** 50% chance $50, 50% chance $50.  
  Both have EU=50 (assuming u linear). How would a *risk-averse* REU agent (r(p) concave) rank them? Why?"**  

  - **Correct answer:** Y ≻ X.  
  - *Why it tests understanding:*  
    - EU indifferent → exposes REU’s focus on risk dispersion.  
    - Risk-averse REU dislikes outcome spread (r(p) concave weights bad outcomes more).  
    - Forces application of r(p) to cumulative distributions (X has extreme outcomes; Y is degenerate).  

  ---

  ### **Predictable Pitfalls & Fixes**  
  - **"r(p) is arbitrary—why not just change u?"**: Preempt in Step 4 by showing Allais preferences require *violating independence*, which DMU alone can’t fix.  
  - **"Is risk aversion just pessimism?"**: Clarify that r(p) encodes *attitude toward compounding risks*, not belief distortion (contrast with subjective probability).  
  - **Formalism without intuition**: Anchor every equation to the Allais example (e.g., "r(0.90) is the weight on the *worst 10% of cases*").

  This sequence mirrors how REU was motivated historically (axiom failure → new model), uses a single rich example to minimize cognitive load, and strategically dismantles misconceptions as they arise. The assessment question isolates comprehension of REU’s *structural* innovation: weighting risk, not outcomes or raw probabilities.
