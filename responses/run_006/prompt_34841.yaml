prompt: |-
  Hey, I'm a PhD student in formal epistemology and I keep running into the logical omniscience problem from the modeling side. Before I read one more paper on awareness semantics or impossible worlds, I want to get the spec straight: what does a theory of an agent's beliefs (or knowledge) actually have to deliver if it's meant to model a non-ideal reasoner rather than a logically perfect one? I'd like the desiderata list.

  Give me the requirements, each with the case or consideration behind it. The sort of thing I have in mind includes, but isn't limited to: an agent who believes the axioms of Peano arithmetic but hasn't derived some theorem from them; the explicit/implicit belief distinction; the difference between failing to believe q and believing not-q; whether a theory should be able to distinguish logically equivalent contents; whether consistency is a hard requirement or just an ideal; and how belief changes when the agent actually performs an inference rather than just sitting there. For each requirement say whether it's non-negociable or just a preference of one camp (the tractability people, the pure semanticists, the dynamic-logic people, etc.).

  Then flag any subsets of these that can't be jointly satisfied. My suspicion is that you can't keep a standard possible-worlds semantics, closure under your background logic, and non-omniscience all at once, so something has to give — I want to know exactly what and which trade-offs are forced. That's the part I most want.

  Then briefly score the usual approaches against the list: plain possible-worlds epistemic logic, awareness semantics, impossible-worlds models, and syntactic or resource-bounded accounts. Keep that part short; the desiderata are the point. And if any of the requirements I floated is really a prejudice of a particular camp rather than a genuine desideratum, say so.

  Write it in American English. No citations needed — I want the conceptual lay of the land.
reasoning: |-
  Okay, the user is a PhD student in formal epistemology grappling with the logical omniscience problem. They're frustrated with current approaches and want a clear set of desiderata for modeling non-ideal reasoners. Let me unpack their request carefully.

  First, their core need is a comprehensive list of requirements for belief models that avoid logical omniscience. They mentioned specific examples: Peano axioms without derived theorems, explicit vs implicit belief, not believing q vs believing not-q, distinguishing logically equivalent contents, consistency as optional, and belief dynamics during inference. 

  I notice they're suspicious about trade-offs - especially between possible-worlds semantics, closure, and non-omniscience. That's their burning question. They also want brief evaluations of existing approaches against the desiderata. 

  Hmm, as a PhD student, they likely want this for framing their research or identifying gaps. The "no citations" request suggests they need conceptual clarity before diving into literature. Their frustration with "one more paper" indicates they're overwhelmed by technical solutions without clear criteria.

  Let me structure this systematically. The desiderata should cover: 
  - Representation (how beliefs are stored)
  - Dynamics (how they change)
  - Epistemic attitudes (belief vs disbelief)
  - Constraints (consistency, closure)
  - Rationality ideals

  For each, I'll specify: 
  - The requirement 
  - Why it matters (their examples help here)
  - Whether it's essential or debatable
  - Which research camps prioritize it

  Then the trade-offs section must confirm their suspicion: possible-worlds semantics inherently conflicts with non-omniscience and non-closure. I'll explicitly list incompatible desiderata trios.

  Finally, I'll briefly score the four approaches against the list. Awareness semantics handles non-omniscience but loses closure; impossible worlds allow inconsistency but make dynamics messy; syntactic models capture inference steps but lack semantics. 

  Key nuance: Some "desiderata" like universal closure are actually ideals from perfect-reasoner models - I'll call out that bias. Also, distinguishing equivalent formulas might be unnecessary for some research goals.

  The conclusion should reinforce that trade-offs are unavoidable, so their framework choice depends on which desiderata they prioritize. That's probably the insight they need to navigate the literature.
answer: |-
  Here’s a structured breakdown of desiderata for modeling non-ideal belief, trade-offs, and a quick scorecard of approaches. The list prioritizes conceptual clarity over technical detail, per your request.

  ---

  ### **Core Desiderata for Non-Ideal Belief Models**  
  *(Non-negotiables marked with ★)*

  1.  **★ Non-Omniscience**  
      *Requirement:* Agents need **not believe all logical consequences of their beliefs**.  
      *Case:* An agent believes Peano axioms but hasn’t derived the Paris-Harrington theorem.  
      *Status:* Non-negotiable core of the problem. All camps accept this.

  2.  **★ Belief/Disbelief Distinction**  
      *Requirement:* Model must distinguish **failing to believe *q*** from **believing *¬q***.  
      *Case:* An agent hasn’t considered Goldbach’s conjecture (no belief) vs. believing it’s false.  
      *Status:* Non-negotiable. Essential for modeling ignorance.

  3.  **Explicit vs. Implicit Belief (Graded Importance)**  
      *Requirement:* Distinguish actively held "explicit" beliefs from those merely entailed by a background logic ("implicit").  
      *Case:* An agent explicitly believes Peano axioms; Fermat’s Last Theorem is only implicitly believed (if at all).  
      *Status:* Crucial for tractability/dynamics camps; less prioritized by pure semanticists.

  4.  **Non-Trivial Dynamics**  
      *Requirement:* Model belief change **during inference** (e.g., after deriving a new theorem), not just static states.  
      *Case:* Agent starts with axioms, performs a computation, adds a new belief.  
      *Status:* Non-negotiable for resource-bounded/dynamic camps; often ignored by static semantic approaches.

  5.  **Content Granularity (Contested)**  
      *Requirement:* Ability to **distinguish logically equivalent contents** (e.g., *p* vs. *¬¬p*).  
      *Case:* An agent might believe "it’s raining" without believing "it is not not raining" if they haven’t performed double-negation elimination.  
      *Status:* Preferred by syntactic/resource-bounded camps; rejected by possible-worlds purists as "not semantic."

  6.  **Consistency as Aspirational, Not Guaranteed**  
      *Requirement:* Agents can hold **locally consistent but globally inconsistent beliefs**; full consistency is an ideal, not a constraint.  
      *Case:* An agent believes *p*, *p→q*, but hasn’t noticed *q*, and may even believe *¬q*.  
      *Status:* Non-negotiable for most; hard consistency is seen as unrealistic.

  7.  **Tractability-Awareness (Resource Sensitivity)**  
      *Requirement:* Model should reflect **cognitive/computational limits** (time, memory, attention).  
      *Case:* An agent fails to derive a theorem requiring 10^6 inference steps.  
      *Status:* Core for resource-bounded camp; ignored or abstracted away by others.

  8.  **★ Non-Vacuity**  
      *Requirement:* Agents should be able to **have beliefs at all** without believing every tautology.  
      *Case:* An agent believes "snow is white" but doesn’t believe "(snow is white) ∨ (grass is purple)" unless they’ve considered it.  
      *Status:* Non-negotiable; follows from non-omniscience.

  ---

  ### **The Inevitable Trade-Offs**  
  **Your suspicion is correct: core conflicts exist.** These trios **cannot** be jointly satisfied:  

  | **Set**                          | **Conflict**                                                                 |
  |----------------------------------|-----------------------------------------------------------------------------|
  | **Possible Worlds Semantics** + <br> **Closure Under Background Logic** + <br> **Non-Omniscience** | Possible worlds + closure → logical omniscience. To avoid omniscience, you must sacrifice one. |
  | **Content Granularity** + <br> **Standard Possible Worlds** + <br> **Compositional Semantics** | Possible worlds identify logically equivalent formulas. Granularity requires syntactic or impossible worlds. |
  | **Full Dynamics** + <br> **Tractability** + <br> **Expressive Semantics** | Detailed dynamics (e.g., step-by-step inference) is computationally heavy; elegant semantics (e.g., possible worlds) struggles with stepwise change. |

  **What gives?**  
  - **Possible-worlds semantics** must be abandoned or modified (e.g., with impossible worlds) to avoid omniscience.  
  - **Closure under classical logic** must be restricted (e.g., to computable inferences, explicit beliefs).  
  - **Semantic purity** must be sacrificed for granularity/dynamics (e.g., using syntax).  

  ---

  ### **Quick Scorecard: Approaches vs. Desiderata**  
  *(✓ = Strong, ~ = Partial, ✗ = Weak/Fails)*

  | **Desideratum**               | **Possible Worlds** | **Awareness** | **Impossible Worlds** | **Syntactic/Resource-Bounded** |
  |-------------------------------|---------------------|---------------|------------------------|--------------------------------|
  | Non-Omniscience               | ✗                   | ✓             | ✓                      | ✓                              |
  | Belief/Disbelief Distinction  | ~ (via accessibility) | ✓             | ✓                      | ✓                              |
  | Explicit vs. Implicit Belief  | ✗                   | ✓             | ~                      | ✓                              |
  | Non-Trivial Dynamics          | ✗                   | ~ (limited)   | ✗                      | ✓                              |
  | Content Granularity           | ✗                   | ✓             | ✓                      | ✓                              |
  | Consistency Aspirational      | ✗ (global)          | ✓             | ✓                      | ✓                              |
  | Tractability-Awareness        | ✗                   | ~             | ✗                      | ✓                              |
  | Non-Vacuity                   | ✗                   | ✓             | ✓                      | ✓                              |

  **Why?**  
  - **Possible Worlds:** Fails almost all desiderata except in highly idealized form.  
  - **Awareness Semantics:** Adds an "awareness filter" to possible worlds. Good on non-omniscience/granularity but weak on dynamics/tractability.  
  - **Impossible Worlds:** Allows "incomplete" worlds. Good on non-omniscience/granularity, but dynamics are ad-hoc and consistency is too flexible.  
  - **Syntactic/Resource-Bounded:** Models beliefs as formulas + computation rules. Excels at dynamics/tractability/granularity but lacks semantic elegance.  

  ---

  ### **Contested "Desiderata": What's Really a Bias?**  
  - **"Closure under classical logic is necessary":** This is a **bias of the possible-worlds camp**. Non-ideal models must reject this.  
  - **"Belief must be deductively closed *in principle*":** A **soft idealization** (e.g., "implicit belief"). Rejected by radical anti-closure camps.  
  - **"Semantics must be non-syntactic":** A **pure semantics camp preference**. Granularity/dynamics often require syntax.  

  ---

  ### **The Lay of the Land**  
  **You must choose your poison:**  
  - Want **semantic elegance** and don’t mind static models? **Awareness/Impossible Worlds** (sacrifice dynamics/tractability).  
  - Care about **inference steps** and cognitive realism? **Syntactic/Resource-Bounded** (sacrifice compositional semantics).  
  - **Possible worlds** alone are a non-starter for non-ideal reasoners.  

  The trade-off between **closure**, **semantics**, and **non-omniscience** is fundamental: relaxing closure enables non-omniscience but forces syntactic or non-standard semantic tools. No approach satisfies all desiderata cleanly—your choice depends on which aspects of rationality you prioritize.
