answer: |-
  Your argument is insightful and touches on a foundational challenge, but it overgeneralizes due to a subtle misstep in **premise (5)**. Here's the diagnosis:

  ### Where the Argument Fails: **Premise (5)**
  - **Premise (5) claims**: The embedded occurrence of "lying is wrong" *does not have the meaning attributed to it by (1)* because it fails to express disapproval in the conditional context.  
  - **The mistake**: This conflates **meaning** with **actual speech-act performance**. Expressivism (and other use-based theories) need not claim that the meaning *is identical to* the act performed when uttered *assertorically*. Rather, they can hold that meaning is constituted by the **conventional role** the expression plays in language, which *includes* its behavior in embedded contexts.  

  ### The Expressivist Response: Attitude Roles in Composition
  Expressivists reject premise (5) by distinguishing:  
  - **Standalone meaning**: When unembedded, "lying is wrong" conventionally expresses disapproval.  
  - **Embedded meaning**: When embedded (e.g., in a conditional), it *contributes the same type of attitude* as part of a larger structure, but **without performing the speech act**.  
  The compositional function is defined over **attitudinal potentials**, not occurrent acts. For example:  
  - The conditional "If P, then Q" expresses a complex attitude: e.g., *disapproving of* (accepting P without accepting Q).  
  - Here, P ("lying is wrong") contributes its *characteristic attitude-type* (disapproval of lying) to this complex attitude, even if no disapproval is actually expressed.  

  **Cost to Expressivism**:  
  Expressivists must develop a **systematic account of how atomic attitude-expressions compose** in complex sentences (e.g., Blackburn’s "logic of attitudes" or Gibbard’s "world-norm pairs"). This requires substantive technical work, but it’s not impossible.  

  ---

  ### Why the Generalization (Step 7) Fails
  Your argument generalizes only against **naïve use-theories** that rigidly equate meaning with *occurrent speech acts*. Sophisticated use-based theories (like inferentialism or dynamic semantics) avoid this by defining meaning via **contextual roles** or **update potentials**:  

  1. **Inferentialism (e.g., Brandom)**:  
     - Meaning is determined by *inferential roles*, including **hypothetical** reasoning.  
     - Embedded clauses contribute their inferential potentials (e.g., "If P, then Q" licenses inferring Q from P), without asserting P.  

  2. **Dynamic Semantics (e.g., Veltman, Starr)**:  
     - Meaning is defined by how sentences *update information states*.  
     - An embedded "P" contributes its *update function* to the larger construction (e.g., a conditional tests if adding P leads to accepting Q).  

  3. **Speech-Act Pluralism (e.g., Searle)**:  
     - Sentences have a *dual structure*: locutionary content (proposition) + illocutionary force (act).  
     - Embedding suppresses force but preserves content.  

  **Crucial distinction**: These theories tie meaning to **conventional linguistic roles** (what an expression *can be used to do*), not to **actual utterance events**.  

  ---

  ### Why the Problem is Sharper for Expressivism
  - Expressivism uniquely faces a **type-mismatch problem**: Moral sentences express *non-cognitive attitudes* (desires, plans), while logical operators require *truth-apt contents*.  
  - This makes compositionality harder: How can a truth-functional connective ("if") operate on non-truth-apt attitudes?  
  - Inferentialism/dynamic semantics avoid this by treating all content as propositional/informational.  

  ---

  ### Conclusion
  - **Your argument’s error**: Premise (5) falsely assumes that if an embedded clause doesn’t perform its characteristic speech act, it cannot retain its meaning. Sophisticated theories reject this by decoupling *conventional role* from *occurrent use*.  
  - **Landscape assessment**: The embedding problem remains a **serious challenge for expressivism** (requiring complex semantics), but it does not refute all use-based theories. Inferentialism, dynamic semantics, and pragmatism thrive precisely because they handle embedding via abstracted roles or potentials.  
  - **Path forward**: For expressivism, solutions like Gibbard’s **norm-expressivism** (treating attitudes as components of structured contents) or **bifurcated attitude semantics** (distinguishing force and content) show the problem is technical, not fatal.  

  The bleakness you sense is real for *simple* expressivist theories, but the broader landscape is fertile—precisely because embedding challenges have spurred richer use-based frameworks.
