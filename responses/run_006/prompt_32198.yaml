answer: |-
  Below is a 10-question diagnostic sorting quiz designed to map beliefs about the inefficacy objection in collective action problems. Each question uses a concrete scenario to pull apart the key fault lines you specified. The answer options are crafted to reveal underlying principles without relying on labels. I’ve designed the scenarios to isolate the five fault lines, built a scoring key from the logical space of answer combinations, and located the six target positions within it. I’ll flag unoccupied cells and limitations afterward.

  ---

  ### **Collective Action Problems: Diagnostic Quiz**
  **Instructions:** For each scenario, select the answer that best reflects your intuitive judgment. There are no "right" answers—this is about capturing your reasoning.

  1. **Factory Farming Threshold**  
     A factory farm raises chickens in cruel conditions. The farm uses an automated system: for every 10,000 chickens sold, one extra chicken is added to an overcrowded pen. Your purchase has a 1 in 10,000 chance of triggering this addition. Should you buy the chicken?  
     - A) **No**—my purchase has a tiny risk of directly causing harm.  
     - B) **Yes**—the chance is too small to matter, and my action changes nothing.  

  2. **Mass Flight Emissions**  
     You’re considering a leisure flight. If everyone took such flights, climate change would accelerate catastrophically. But your one flight won’t affect emissions detectably. Should you take it?  
     - A) **No**—if everyone did this, it would be disastrous, so I shouldn’t.  
     - B) **Yes**—my individual flight doesn’t cause harm, so I’m not obligated to refrain.  

  3. **Cheap Meat Complicity**  
     You can buy inexpensive factory-farmed beef or costly ethical alternatives. You know the industry causes systemic harm, but your one purchase won’t affect demand. Should you buy the cheap beef?  
     - A) **No**—I don’t want to be complicit in an immoral system.  
     - B) **Yes**—without causing harm, I can prioritize my interests.  

  4. **Group Pledge for Farm Reform**  
     100 people pledge to boycott a farm. If ≥80 join, the farm will switch to humane practices. You’re asked to pledge. Should you?  
     - A) **Yes**—I should do my part, even if we might not reach 80.  
     - B) **Only if we’re likely to reach 80**—my action matters only if it helps achieve the threshold.  
     - C) **No**—unless the group succeeds, my action is pointless.  

  5. **Voting in a Toss-Up Election**  
     You’re in a large election where polls show a dead heat. Your vote has a tiny chance of breaking a tie. Should you vote?  
     - A) **Yes**—there’s a real chance my vote decides the outcome.  
     - B) **Yes**—voting is a civic duty, regardless of impact.  
     - C) **No**—one vote never changes anything.  

  6. **Universal Voting Abstention**  
     Suppose if no one voted, democracy would collapse. But since many vote, your abstention won’t matter. Should you vote?  
     - A) **Yes**—if everyone abstained, it would be catastrophic, so I must vote.  
     - B) **No**—in reality, my abstention changes nothing.  

  7. **Symbolic Protest Vote**  
     You strongly oppose a policy but know your vote won’t affect the outcome. Should you still vote against it?  
     - A) **Yes**—it expresses my integrity, even if futile.  
     - B) **No**—without impact, it’s a meaningless gesture.  

  8. **Collective Voting Reward**  
     Your town of 1,000 people will get a $100,000 grant if ≥800 vote. Voting is effortful. Should you vote?  
     - A) **Yes**—I should contribute to our collective goal.  
     - B) **Only if we’re likely to reach 800**—otherwise, my effort is wasted.  
     - C) **No**—my single vote won’t affect the grant.  

  9. **Market Harm vs. Voting**  
     Compare buying factory-farmed meat (negligible impact) and skipping a large election (negligible impact). Are they morally similar?  
     - A) **Yes**—both are harmless individually, so neither is wrong.  
     - B) **No**—buying meat supports a harmful system, while not voting is a passive omission.  
     - C) **No**—not voting undermines democracy, while buying meat is a market choice.  

  10. **Threshold-Free Pollution**  
      You pour a drop of pollutant into a lake. Each drop is harmless, but millions of drops cause damage. Your drop won’t be noticed. Should you refrain?  
      - A) **Yes**—if everyone did this, the lake would be ruined.  
      - B) **Yes**—I shouldn’t contribute to harm, even symbolically.  
      - C) **No**—my individual action changes nothing.  

  ---

  ### **Scoring Key: Mapping Answers to Positions**  
  I first defined the logical space based on the fault lines, then assigned positions to answer combinations. Each position has a "signature" pattern across questions. Hybrid views are possible, but the quiz prioritizes clean separation of the six core positions.  

  #### **Logical Space & Position Signatures**  
  | Position                                          | Signature Answers (Question: Answer)                                                                 | Notes on Fault Lines Covered                                                                 |
  |---------------------------------------------------|------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Causal-inefficacy skepticism** (No obligation) | Q1:B, Q2:B, Q3:B, Q4:C, Q5:C, Q6:B, Q7:B, Q8:C, Q9:A, Q10:C                                         | Rejects obligations without causal impact; ignores thresholds, universalizability, integrity. |
  | **Expected-utility threshold-triggering**        | Q1:A, Q2:B, Q3:B, Q4:B, Q5:A, Q6:B, Q7:B, Q8:B, Q9:A or C, Q10:C                                    | Grounds obligation in tiny probabilities of hitting thresholds (Q1, Q5). Skeptical elsewhere. |
  | **Kantian/Rule-consequentialist universalizability** | Q1:B, Q2:A, Q3:B, Q4:A, Q5:B, Q6:A, Q7:B, Q8:A, Q9:B or C, Q10:A                                  | Uses "what if everyone did it?" (Q2, Q6, Q10). Rejects complicity (Q3:B) and thresholds (Q1:B). |
  | **Integrity-based obligation**                   | Q1:B, Q2:B, Q3:A, Q4:A, Q5:B, Q6:B, Q7:A, Q8:A, Q9:B, Q10:B                                         | Focus on personal complicity (Q3:A) and symbolic integrity (Q7:A). Ignores thresholds/universality. |
  | **Complicity-based obligation**                  | Q1:B, Q2:B, Q3:A, Q4:A, Q5:B, Q6:B, Q7:A, Q8:A, Q9:B, Q10:B                                         | Overlaps heavily with integrity; distinguished only by Q9/Q10 emphasis on systemic harm. |
  | **Collective-obligation views**                  | Q1:B, Q2:B, Q3:A or B, Q4:A, Q5:B, Q6:A or B, Q7:A or B, Q8:A, Q9:C, Q10:A or B                    | Obligation is group-based; individual must "do their part" (Q4:A, Q8:A). Distinguishes voting (Q9:C). |

  #### **Unoccupied Cells in Logical Space**  
  - **"Strong threshold-rejecting universalizer"**: Someone who endorses universalizability (Q2:A, Q6:A) but rejects threshold-triggering (Q1:B) *and* complicity (Q3:B) is covered (Kantian view). No vacancy.  
  - **"Individualistic complicity skeptic"**: Rejects complicity (Q3:B) but endorses integrity in voting (Q7:A). This cell is **occupied** by expected-utility or skepticism, but not a named position—**surprisingly vacant**, as complicity/integrity often align.  
  - **"Market-harm exceptionalist"**: Sees market harms (Q3:A) as uniquely obligating but rejects voting obligations (Q5:C, Q6:B). This cell is **unoccupied**—no major position holds this, which is **unsurprising** as theorists rarely split these norms.  

  #### **Limitations: Pairs the Quiz Cannot Cleanly Separate**  
  1. **Integrity vs. Complicity**: Q3, Q7, and Q9 are designed to align these (both favor A answers). They are **indistinguishable in this quiz**—complicity is treated as a subset of integrity-based reasons.  
  2. **Rule-consequentialism vs. Kantian universalizability**: Both answer Q2:A and Q6:A. The quiz **cannot separate them** as they share the "what if everyone?" structure.  
  3. **Expected-utility vs. Collective-obligation in thresholds**: Q4 and Q8 force a choice between individual impact (B) and collective duty (A). In reality, some expected-utility views might blur into collective reasoning if thresholds are likely—this is a **false choice**.  

  #### **Design-Forced Simplifications**  
  - **Q4/Q8 (collective obligation)**: Options B/C artificially separate "conditional" and "no obligation" views. Some might see a spectrum, but the quiz bins them.  
  - **Q9 (market vs. voting)**: Forces a choice between equivalence (A), complicity (B), or systemic harm (C). This oversimplifies nuanced views (e.g., voting as less direct).  
  - **Q10 (threshold-free pollution)**: Universalizability (A) and complicity (B) are conflated; the quiz assumes A implies universalizability and B implies complicity.  

  ### **How to Use the Quiz**  
  1. **Administer**: Have participants answer all questions.  
  2. **Score**: Tally their answers and match to the position signatures above.  
  3. **Discuss**: Use discrepancies (e.g., hybrid views) to explore tensions (e.g., "You rejected thresholds in Q1 but accepted them in Q5—why?").  

  This quiz prioritizes real-world intuitions over theoretical purity, making it ideal for discussion groups. It reveals where participants stand on the inefficacy objection’s fault lines, even when their views don’t fit neatly into named positions.
