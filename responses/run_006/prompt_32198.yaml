  Let's design the questions:

  Question 1: Expected utility and threshold triggering
  Scenario: You are considering buying a chicken from a factory farm. The farm uses a system where, for every 10,000 chickens sold, an extra chicken is raised in worse conditions. Your purchase has a 1 in 10,000 chance of triggering this extra chicken's suffering. Should you refrain from buying?
  A) Yes, because there's a small chance my purchase causes real harm.
  B) No, because the chance is too small to matter.

  Question 2: Universalizability (market harm)
  Scenario: You are thinking about taking a flight for a vacation. If everyone took such flights, climate change would accelerate dramatically. But your one flight won't make a noticeable difference. Should you refrain?
