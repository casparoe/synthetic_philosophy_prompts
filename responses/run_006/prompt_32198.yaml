  B) Yes, because my purchase doesn't actually cause harm, and I'd save money.

  Question 4: Collective obligation (market harm)
  Scenario: A group of 100 people is organizing to reduce factory farming. They pledge to avoid factory-farmed meat for a year. If at least 80 people join, the reduction in demand will cause a local farm to switch to humane practices. You are asked to join. Should you?
