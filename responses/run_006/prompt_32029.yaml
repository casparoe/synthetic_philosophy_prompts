answer: |-
  Here is the exam question, model answer, and marking scheme as requested.

  **Exam Question (20 marks total):** Amartya Sen's liberal paradox demonstrates that no social decision function can simultaneously satisfy unrestricted domain, the weak Pareto principle, and minimal liberalism (understood as at least two individuals each being decisive over at least one pair of social states). While the proof and examples like Lewd/Prude are well-established, the *interpretation* of this paradox remains contested. Assess whether the paradox reveals a fundamental, practical problem for liberal political philosophy, or whether it primarily highlights problematic assumptions or limitations within Sen's specific formal framework for modelling rights and social choice. In your answer, you must engage substantively with at least one proposed response to or critique of the paradox (such as critiques of the decisiveness-over-states formulation, the game-form approach, or rights as agenda constraints). What, in your view, is the most significant philosophical upshot of Sen's result?

  **Model Answer (~600 words):**

  Sen's liberal paradox is undoubtedly a profound result in social choice theory, demonstrating a logical incompatibility between seemingly weak and desirable principles. However, interpreting it as a fundamental indictment of liberalism in practice is likely an overstatement. The paradox primarily exposes tensions inherent in Sen's specific formalization of rights within an Arrovian social choice framework, rather than an insurmountable flaw in liberal ideals themselves. The core issue lies in how "minimal liberalism" is modelled: as individual decisiveness over specific pairs of complete social states. This formulation, while mathematically elegant, imposes a problematic structure on what rights entail.

  The Lewd/Prude example starkly illustrates this. Sen frames the conflict as Mr. Lewd having the right to determine the social state regarding *who reads Lady Chatterley's Lover* (e.g., State A: Lewd reads vs. State B: Prude reads), and Mr. Prude having the right to determine the social state regarding *whether it is read at all* (e.g., State B: Prude reads vs. State C: No one reads). The paradox arises because their individual preferences over these state-pairs, combined with Pareto, lead to an intransitive cycle. The critical observation is that Sen's model requires individuals to exercise their rights by directly imposing their *preference ranking* over entire social states onto the social outcome. This bundles together many aspects (who reads, whether it's read, the associated feelings of others) into monolithic packages. Rights are reduced to dictatorial power over these complex, interdependent packages.

  This is where significant responses offer crucial insights. Allan Gibbard's game-form approach, for instance, fundamentally challenges Sen's outcome-oriented model. Gibbard argues that liberalism is not about dictating social states based on preferences, but about assigning individuals control over specific *actions* or *spheres* within a procedural framework (the game-form). In the Lewd/Prude case, Lewd's right might be to *choose to read or not read the book himself*, while Prude's right might be to *choose to read it or not himself*. The social outcome (who ends up reading) emerges from the exercise of these protected actions within the rules, not from imposing preferences over predefined states. Crucially, under this model, the Pareto-dominated outcome (Prude reading reluctantly) *can* occur without logical contradiction – it's a possible result of Prude freely choosing to read to prevent Lewd from reading. The "problem" vanishes because rights protect domains of action and choice, not the imposition of preference rankings over composite states. The paradox, therefore, stems from an impoverished model of rights that fails to capture the procedural and action-based nature of liberal freedoms.

  Other critiques, like viewing rights as constraints on the agenda (what states can even be considered for collective choice), also point towards the formalism being the culprit. These responses suggest the paradox is less about liberalism and more about the mismatch between the richness of liberal rights and the reductive way Sen formalizes them within his specific social choice function. The decisiveness-over-states approach forces rights to operate like miniature dictatorships over complex bundles, creating artificial conflicts that procedural or domain-based models avoid.

  The most significant philosophical upshot of Sen's paradox is thus not that liberalism is logically incoherent, but that it compels us to think more carefully about *how* we conceptualize and formalize rights within theories of collective decision-making. It highlights the dangers of oversimplification: modelling rights merely as decisive power over predefined global states fails to account for the separateness of persons, the context-sensitivity of actions, and the procedural autonomy central to liberalism. The paradox serves as a powerful diagnostic tool, revealing limitations in the Arrovian framework for capturing essential liberal concepts. While it underscores that protecting individual spheres *can* sometimes lead to outcomes others deem inefficient or undesirable (like Prude reading), Gibbard and others show this isn't a logical contradiction demanding the abandonment of either principle, but a feature of a world where individuals have genuine, protected freedom to act – even if their choices lead to outcomes others dislike. The paradox's true value lies in pushing us towards more nuanced and philosophically adequate models of rights.

  **Marking Scheme (Total 20 marks):**

  **A Grade (17-20 marks):** An A answer must clearly and accurately summarize the core incompatibility Sen demonstrates. Crucially, it must move beyond merely restating this to offer a sophisticated analysis of the *interpretation*. It must explicitly argue for a position on whether the paradox reveals a fundamental problem for liberalism or is primarily an artifact of the model. It must engage deeply and accurately with at least one major response/critique (e.g., Gibbard's game-forms, agenda constraints, critique of decisiveness-over-states) – not just describe it, but explain *how* this response addresses the perceived problem raised by the paradox and supports the student's interpretive argument. It must identify and discuss the specific problematic assumptions within Sen's formalization (e.g., decisiveness over complex global states bundling multiple aspects, ignoring procedural exercise of choice). It must articulate a clear, well-reasoned view on the most significant philosophical upshot, connecting it back to the analysis of the model and the response. Common errors avoided: Superficial engagement with the critique ("Gibbard changed the model"); failing to link the critique to the interpretive question; asserting an interpretation without supporting argument based on the model's features.

  **B Grade (13-16 marks):** A B answer will accurately summarize Sen's paradox and the Lewd/Prude example. It will recognize there is debate about the interpretation and attempt to discuss whether it's a fundamental problem or a modelling issue, though the analysis may lack depth or nuance. It will describe at least one proposed response/critique (e.g., the game-form approach) with reasonable accuracy. It will mention some limitations of Sen's model (e.g., decisiveness over states) but may not fully explore the implications. It will state a view on the upshot, but the reasoning connecting the parts (paradox -> model critique -> response -> upshot) may be less developed or explicit. Common errors: Treating the described response as simply "the solution" without analyzing its philosophical implications for interpreting the paradox; a vague or generic statement of the upshot ("it shows rights are complex"); not clearly differentiating between the paradox as a logical result and its philosophical significance.

  **C Grade (9-12 marks):** A C answer will provide a basic, largely accurate description of Sen's paradox and likely use the Lewd/Prude example. It will state the "tension between rights and Pareto" but show limited engagement with the deeper interpretive question. It may mention the existence of responses like the game-form approach but offer only a superficial or potentially inaccurate description. Discussion of Sen's model will be minimal or unclear; the focus remains on the logical incompatibility rather than its formal causes. Any statement about the upshot will be very general, undeveloped, or simply repeat the surface-level "tension" without insight into modelling assumptions. Common errors: Misstating the conditions or the example; failing to engage substantively with any specific critique/response; conflating the paradox itself with its interpretation; offering no real argument about the upshot beyond regurgitating the paradox statement. Answers below 9 marks demonstrate significant inaccuracies, omissions, or lack of engagement with the prompt.
