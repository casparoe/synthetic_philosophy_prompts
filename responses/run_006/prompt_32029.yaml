prompt: |-
  So I'm teaching this upper-level political philosophy seminar — about 15 students, mostly seniors — and we just spent two weeks on Sen's liberal paradox. I gave them a midterm question on it and the answers were… fine, but almost everyone just regurgitated the proof that you can't have both the Pareto principle and minimal liberalism. They can all reproduce the Lewd/Prude example. But when I asked them to say something about what the paradox actually shows — like, is it a real problem for liberalism, or is it just a quirk of the formal setup? — they had nothing. They all just said "Sen shows there's a tension between rights and efficiency" and moved on.

  So I'm rewriting the final exam question. I want something that forces them to engage with the interpretive question: what's the upshot here? Is the paradox a genuine problem for liberal rights, or does it just reveal something about how we're modelling rights in the first place? And I want them to grapple with at least one actual response to the paradox — like the idea that the problem is with the way Sen formalizes rights as decisiveness over social states, or the idea that liberalism should be about game forms rather than outcomes, or the idea that rights are constraints on what can be on the agenda rather than on the social decision function.

  Please write me the exam question, a model answer of about 600 words, and a marking scheme that separates an A from a B from a C answer. The total should be 20 marks. The marking scheme should name the specific moves each grade band must contain, and for each key point, give a one-line note on how students typically get it wrong.

  Please don't use any formatting in your response — no headings, no bullet points, no bold, no tables. Just continuous prose, like an email.
