  I need to provide a decomposition of my credence into key sub-questions. For each, I should give a rough probability or range, a single-sentence justification, and indicate how much a change in that term would shift my overall credence. Then I need to combine these terms, noting any dependencies, and identify which sub-question my credence is most sensitive to. Finally, I should address the tension between many civilizations requiring a strong filter versus us being alone requiring a vanishingly improbable step.

