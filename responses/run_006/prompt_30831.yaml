prompt: |-
  I work in the compliance office of a mid-sized city government. Our office is now required to review and sign off on every vendor-supplied algorithmic tool used in a public service before a contract can proceed: pretrial risk scores, benefits eligibility triage, school assignment, and a model that decides which properties to inspect for housing code violations. The vendors' fairness documentation is typically a few pages claiming the tool is "unbiased," "equally accurate across groups," or "fair by design," without saying what those terms mean or what was traded off to achieve them. We review several such tools a year, the stakes are high, and the reviewers are lawyers and policy analysts, not statisticians: they can read a base rate and a confusion matrix, but they cannot follow the theorems.

  I understand the rough shape of the impossibility results in algorithmic fairness: a risk score cannot simultaneously be calibrated, have equal false positive rates across groups, and have equal false negative rates across groups unless the outcome is equally common in the groups or the prediction is perfect. But I need that result converted into something my office can actually run when a vendor is across the table.

  Please write a reusable audit procedure for evaluating the fairness claims of a proposed algorithmic decision tool. The procedure should be written for a reviewer with no graduate-level statistics. For each step, specify the question to ask, what counts as a sufficient answer, whether an insufficient answer stops the review or merely flags the tool, and where the procedure hands the decision to a person because the remaining question is one of values rather than facts. The procedure should do at least the following: (1) translate vague fairness language into a small set of defined criteria — at minimum demographic parity, equalized odds, equal opportunity, predictive parity, and calibration — using questions the reviewer can put to a vendor about its validation data; (2) check the vendor's claimed criteria for the combinations the impossibility results rule out, and require the vendor to state which criterion it actually optimized and which it knowingly sacrificed; (3) distinguish cases where the impossibility genuinely bites, because base rates differ materially and the tool is imperfect, from cases where it does not, so that the office does not cry "impossible" on every proposal; and (4) produce a short sign-off sheet recording the chosen criterion, the measured tradeoff, and the value judgment that selected it.

  Then run the procedure on three concrete proposals. (a) A pretrial risk score whose vendor claims the score is calibrated and also reports equal false positive rates and equal false negative rates across racial groups; the base rate of the predicted outcome differs materially between the groups, and the tool is known not to be perfect. (b) A benefits eligibility triage tool whose vendor claims both equal positive predictive value across groups and equalized odds; again, the underlying outcome is substantially more common in one group. (c) A housing code inspection model whose vendor claims calibration and equalized odds, but the two neighborhoods it scores have nearly identical base rates and the office wants a single threshold. For each, state what the procedure concludes, what documentation or changes it requires, and where it hands the decision to a person. At least one case should end in a conclusion the office will not like — for example, rejecting a favored vendor or being told that no technical fix can deliver everything the public wants.

  Finally, say plainly what the procedure cannot do: which fairness conflicts it cannot detect, which claims it must take on trust, and where the impossibility results leave open a choice that no procedure can close.
reasoning: |-
  We are designing an audit procedure for fairness claims of algorithmic tools. The procedure is for non-statisticians (lawyers and policy analysts) who can understand base rates and confusion matrices but not complex theorems. The procedure must:
  1. Translate vague fairness claims into specific criteria (demographic parity, equalized odds, equal opportunity, predictive parity, calibration).
  2. Check for combinations that the impossibility results rule out and require the vendor to state which criterion was optimized and which was sacrificed.
  3. Distinguish cases where the impossibility genuinely applies (due to differing base rates and imperfect tool) from cases where it doesn't.
  4. Produce a sign-off sheet.

  The procedure steps:

  **Step 1: Clarify the Fairness Criteria**
  - **Question to ask the vendor:** "Please specify which fairness criteria your tool satisfies from the following list: demographic parity, equalized odds, equal opportunity, predictive parity, and calibration. For each, provide the definition you are using and the evidence (from validation data) that the tool meets that criterion."
  - **Sufficient answer:** The vendor must provide clear definitions for each claimed criterion and present evidence (e.g., metrics from a confusion matrix or calibration plot) from a representative validation dataset. The definitions must align with standard definitions (provided below for the reviewer's reference). If the vendor uses non-standard terms, they must map them to the standard ones.
  - **Insufficient answer:** If the vendor does not provide definitions or evidence, flag as insufficient and stop the review until provided. If the vendor provides vague claims (like "unbiased") without mapping to a criterion, ask for clarification until they use the standard terms or provide clear definitions.
  - **Standard definitions (for reviewer's reference):**
    - *Demographic parity (DP):* The proportion of positive predictions is the same across groups. (e.g., same % of people flagged as high risk in each race group)
    - *Equalized odds (EO):* Both the false positive rate (FPR) and false negative rate (FNR) are equal across groups.
    - *Equal opportunity (a special case of EO):* The false negative rate (FNR) is equal across groups (and often true positive rate is equal).
    - *Predictive parity (PP):* The positive predictive value (PPV) is the same across groups. (PPV = of those predicted positive, the proportion that actually has the outcome.)
    - *Calibration:* The predicted risk score matches the observed event rate. For example, among people with a risk score of 0.7, about 70% should have the event.

  **Step 2: Check for Impossible Combinations**
  - **Question to ask the vendor:** "If you claim that your tool satisfies multiple fairness criteria, please provide the base rate (i.e., the proportion of positive outcomes) in each group from the validation data. Also, state whether the tool is perfect (i.e., 100% accurate) or not."
  - **Check:** Using the base rates and the knowledge that the tool is imperfect, check for known impossibilities. The key impossibility theorem states: 
    If base rates differ across groups and the tool is imperfect, then it is impossible to have both:
    (a) Calibration and (b) either equalized odds (or both FPR and FNR equal) or equal opportunity (FNR equal) or predictive parity (PPV equal) simultaneously with other criteria.

    Specifically, the following combinations are impossible when base rates differ and the tool is imperfect:
    - Calibration + Equalized Odds
    - Calibration + Equal Opportunity (if base rates differ, then equal opportunity and calibration cannot hold together unless the tool is perfect or base rates are equal)
    - Calibration + Predictive Parity (because predictive parity and calibration together imply that the base rates are equal)

    Also, note that demographic parity is often in conflict with the others when base rates differ.

    **Reviewer's guide (simplified):** 
    - If the vendor claims calibration and any of: equalized odds, equal opportunity, or predictive parity, then check the base rates. 
    - If base rates are different (and the tool is not perfect), then it's impossible for the tool to satisfy both calibration and that other criterion. 
    - If base rates are the same, then there is no impossibility conflict for these criteria.

  - **Sufficient answer:** The vendor must provide the base rates for each group and admit if the tool is imperfect. They must then state which criterion was optimized for (i.e., which one they tried to achieve) and which criteria were sacrificed (i.e., knowingly not achieved) in the design of the tool.
  - **Insufficient answer:** If the vendor does not provide base rates, stop the review until they do. If they claim an impossible combination and refuse to acknowledge the conflict, flag the tool as having an unsupported claim and require them to either adjust their claims or provide evidence that the base rates are equal or the tool is perfect (which is highly unlikely). 

  **Step 3: Identify Whether Impossibility Bites**
  - **Question to ask the vendor (if necessary):** "Given that the base rates are different and the tool is imperfect, which fairness criteria were prioritized and which were knowingly sacrificed? Please provide the measured trade-offs (e.g., the differences in FPR, FNR, PPV, or calibration error across groups)."
  - **Check:** 
    - If base rates are materially different (the reviewer can judge materiality: e.g., a difference of more than 5 percentage points) and the tool is imperfect (accuracy < 100%), then the impossibility applies. 
    - If base rates are nearly identical (difference < 5 percentage points, for example) or the tool is perfect (which is virtually impossible), then the impossibility does not apply. But note: perfect tools do not exist in practice.

  - **Sufficient answer:** The vendor must state which criterion was the primary objective and provide the measured differences across groups for the other criteria (e.g., "We optimized for calibration, so we sacrificed equalized odds: here are the FPR and FNR by group, which differ by X and Y respectively."). They must also provide evidence (numbers) from the validation data to support that the trade-offs are as stated.
  - **Insufficient answer:** If the vendor does not provide the measured trade-offs, flag the tool and do not proceed until they do. If the trade-offs are provided and show large disparities, the reviewer must note that and hand over to a person for a value judgment.

  **Step 4: Value Judgment**
  - **Handoff to a person:** After the technical checks, the reviewer must present the trade-offs to a decision-maker (e.g., a committee or a senior official) for a value judgment. The question is: "Given that the tool achieves [chosen criterion] but sacrifices [other criteria], resulting in [describe the trade-off, e.g., higher false positives for a particular group], is this trade-off acceptable for our city?" 
  - **The reviewer's role:** The reviewer does not make this judgment but documents the trade-off and the decision.

  **Step 5: Sign-off Sheet**
  - The reviewer compiles a short sign-off sheet that records:
    1. The fairness criterion that the tool optimized for.
    2. The measured trade-offs (differences in other fairness metrics across groups).
    3. The value judgment made by the responsible person (accepting the trade-off or not).
    4. The base rates and the tool's overall accuracy (or other performance metrics) for context.

  **Overall Procedure Flow:**
  1. Ask the vendor for claimed criteria and evidence (Step 1). If insufficient, stop.
  2. Request base rates and tool perfection status (Step 2). If impossible combination claimed and base rates differ (and tool imperfect), require vendor to state optimized and sacrificed criteria and provide trade-off metrics (Step 3). If base rates are equal or tool perfect, then no conflict and proceed to Step 5 (but note: perfect tools don't exist).
  3. If the vendor claims criteria that are not in conflict, then verify the evidence (Step 1) and proceed to Step 5.
  4. Once the trade-offs are provided and the optimized criterion is stated, hand over the trade-off description for a value judgment (Step 4).
  5. Complete the sign-off sheet (Step 5).

  **What the procedure cannot do:**
  - It cannot detect all fairness conflicts (e.g., it focuses on group fairness, not individual fairness).
  - It must trust the vendor's validation data (unless the city has resources to re-validate).
  - It cannot resolve the value judgment - that is up to the city's policymakers.
  - It cannot address fairness issues that arise from biased data collection or label bias.
  - It cannot cover all possible fairness definitions (only the common ones we listed).
  - The impossibility results leave open a choice: which fairness criterion to prioritize. The procedure can only expose the trade-off, not decide it.

  ---

  **Now, run the procedure on three concrete proposals:**

  **(a) Pretrial Risk Score**
  - Vendor claims: calibrated, equal FPR, and equal FNR across racial groups.
  - Base rates differ materially between groups, and the tool is imperfect.

  **Procedure:**
  1. **Step 1:** Vendor claims calibration, equalized odds (because equal FPR and FNR is equalized odds). 
  2. **Step 2:** We ask for base rates and tool perfection status. Base rates are materially different and tool is imperfect -> impossible combination (calibration + equalized odds). 
  3. **Step 3:** We require vendor to state which criterion was optimized and which was sacrificed. They must provide trade-offs. 
     - Suppose the vendor says: "We optimized for equalized odds, so we sacrificed calibration. Here are the calibration errors: for group A, the calibration error is X, for group B, it is Y (and they are different)." 
     - Or, if they say: "We optimized for calibration, then we must have sacrificed equalized odds. Here are the FPR and FNR for each group (which are not equal)."
  4. **Value Judgment:** The city must decide if the trade-off is acceptable. For example, if they optimized for equalized odds, then the risk scores might be miscalibrated for one group (e.g., a score of 0.7 might correspond to a 50% event rate in group A and 80% in group B). This might lead to unfair bail decisions. Alternatively, if they optimized for calibration, then one group might have a higher FPR (meaning more people are falsely detained) or higher FNR (meaning more dangerous people are released). The city must decide which kind of error is more acceptable.

  **Conclusion for (a):** The vendor must adjust their claim (they cannot have both). The review stops until they provide a clear statement of which criterion they optimized for and the trade-offs. Then, the value judgment is required. The sign-off sheet will record the optimized criterion, the trade-offs, and the decision.

  **(b) Benefits Eligibility Triage Tool**
  - Vendor claims: equal PPV (predictive parity) and equalized odds (EO).
  - Underlying outcome is substantially more common in one group.

  **Procedure:**
  1. **Step 1:** Vendor claims predictive parity (PPV equal) and equalized odds (FPR and FNR equal). 
  2. **Step 2:** We ask for base rates and tool perfection. Base rates differ and tool imperfect -> check if this combination is impossible? 
     - Note: Predictive parity and equalized odds are not directly impossible by the same theorem as above? But let's check: 
       - The theorem says: calibration + EO is impossible with different base rates. But here, we don't have calibration claimed? 
       - However, there is another known result: predictive parity and equalized odds can hold only if the base rates are equal. Why? 
         - Equalized odds requires: 
           TPR_A = TPR_B and FPR_A = FPR_B.
         - Predictive parity: PPV_A = PPV_B.
         - And we know: PPV = (TPR * base_rate) / [TPR * base_rate + FPR * (1-base_rate)]
         - So if TPR and FPR are equal and base rates are different, then PPV cannot be equal unless base rates are equal? Let's see:
           - If TPR_A = TPR_B and FPR_A = FPR_B, then:
             PPV_A = [TPR * p_A] / [TPR * p_A + FPR * (1-p_A)]
             PPV_B = [TPR * p_B] / [TPR * p_B + FPR * (1-p_B)]
           - If p_A != p_B, then PPV_A != PPV_B, unless TPR=0 or FPR=0 (which is not the case in an imperfect tool). 
         - Therefore, when base rates are different and the tool is imperfect, it is impossible to have both equalized odds and predictive parity.

     So the combination is impossible.

  3. **Step 3:** We require the vendor to state which criterion was optimized and which was sacrificed, and provide trade-offs. 
     - They must choose: either they have predictive parity (and then EO is violated) or EO (and then predictive parity is violated). 
  4. **Value Judgment:** The city must decide which is more important. 
     - If they choose predictive parity, then the PPV is the same in both groups, meaning that among those flagged as eligible, the same proportion are truly eligible. But then the error rates (FPR and FNR) might be different, meaning one group might have more false positives (people who are not eligible are flagged) or false negatives (eligible people are not flagged) than the other. 
     - If they choose equalized odds, then the error rates are the same, but the PPV will differ. That means in one group, a positive prediction might be more reliable than in the other.

  **Conclusion for (b):** The vendor must adjust their claim. The review stops until they provide a clear statement and trade-offs. Then, value judgment required.

  **(c) Housing Code Inspection Model**
  - Vendor claims: calibration and equalized odds.
  - Two neighborhoods have nearly identical base rates, and the office wants a single threshold.

  **Procedure:**
  1. **Step 1:** Vendor claims calibration and equalized odds (EO).
  2. **Step 2:** We ask for base rates and tool perfection. Base rates are nearly identical (say, within 5%) and tool is imperfect. 
     - The impossibility theorem only applies when base rates are different and the tool is imperfect. Here, base rates are nearly the same, so it is possible to have both calibration and EO (if the tool is well-built). 
     - However, note: the theorem says that if base rates are equal, then these criteria can be satisfied simultaneously. But in practice, with an imperfect tool, they might not be exactly satisfied. So we need to check the evidence.
  3. **Step 3:** We do not require the vendor to sacrifice one because the impossibility does not bite. But we must verify that both criteria are met in the validation data. 
     - We ask for evidence: 
       - For calibration: show that for each group, the observed event rate within each risk score bin matches the score.
       - For EO: show that FPR and FNR are equal (or very close) across groups.
     - If the vendor provides evidence that both are satisfied (within an acceptable margin, e.g., differences < 5 percentage points), then we proceed to sign-off.
     - If not, then we ask them to explain the discrepancies and possibly adjust the tool or their claims.

  **Conclusion for (c):** The vendor must provide the evidence for both criteria. If they do, then no trade-off is required and the tool can be approved (assuming the evidence is sufficient). If they fail to show both, then they must either fix the tool or adjust their claims and then we go through the trade-off steps.

  **At least one case ends unfavorably:**
  - In case (a) and (b), the office might not like the outcome because the vendor must admit they cannot deliver on all claims, and the city must make a hard value judgment. 
  - Let's pick (a) for an unfavorable ending: 
    - Suppose the vendor optimized for calibration. Then, they must report that the FPR and FNR are not equal. 
    - The city then must decide: are they willing to accept that one racial group has a higher FPR (meaning more people are incorrectly detained) or higher FNR (more dangerous people released) than the other? 
    - If the city is not willing to accept that trade-off, they might reject the tool.

  **Final Sign-off Sheet Template:**
  ```
  Tool Name: [Name]
  Vendor: [Vendor]

  Fairness Criteria:
  - Optimized for: [e.g., Calibration]
  - Sacrificed: [e.g., Equalized Odds]

  Measured Trade-offs (from validation data):
  - [e.g., FPR for Group A: 0.10, Group B: 0.15; FNR for Group A: 0.20, Group B: 0.20]
  - [e.g., Calibration error: Group A: 0.02, Group B: 0.03] 

  Base Rates:
  - Group A: [base rate]
  - Group B: [base rate]

  Overall Tool Performance (e.g., accuracy): [value]

  Value Judgment:
  [ ] Accepted by [Name/Committee] on [Date]
  [ ] Rejected

  Comments: [Optional]
  ```

  **What the procedure cannot do (plainly stated):**
  - It cannot guarantee fairness; it only checks for specific group fairness criteria.
  - It relies on the vendor's validation data and does not independently audit the data quality or representativeness.
  - It cannot resolve conflicts between different fairness criteria; it only identifies them and requires a value judgment.
  - It cannot cover all possible fairness concerns (e.g., it doesn't address whether the outcome being predicted is itself fair).
  - It cannot detect if the tool is unfair in ways not captured by the selected criteria (e.g., individual fairness or causal fairness).
  - It cannot fix the trade-offs; it only makes them explicit.
  - The impossibility results leave open the choice of which fairness criterion to prioritize, and that choice is political, not technical.
answer: |-
  ### Fairness Audit Procedure for Algorithmic Tools

  This procedure translates vague fairness claims into verifiable criteria, checks for impossible combinations per fairness impossibility theorems, distinguishes unavoidable tradeoffs from non-issues, and documents value judgments. Designed for non-statisticians.

  ---

  #### **Step 1: Clarify Claimed Fairness Criteria**  
  **Question to Vendor:**  
  *"Specify which of these 5 criteria your tool satisfies, using standard definitions:  
  1. **Demographic Parity (DP)**: Same selection rate across groups.  
  2. **Equalized Odds (EO)**: Same false positive rate (FPR) and false negative rate (FNR) across groups.  
  3. **Equal Opportunity (EqOpp)**: Same FNR across groups.  
  4. **Predictive Parity (PP)**: Same positive predictive value (PPV) across groups.  
  5. **Calibration**: Predicted risk matches actual outcome rate (e.g., 70% risk = 70% event occurrence).  
  Provide validation data (confusion matrices and base rates) for all relevant groups (race, gender, etc.)."*  

  **Sufficient Answer:**  
  - Vendor maps all "fairness" claims (e.g., "unbiased") to the 5 criteria above.  
  - Validation data includes:  
    - Base rate (outcome prevalence) per group.  
    - Confusion matrices (or FPR/FNR/PPV/selection rate calculations) per group.  
  - Definitions match standard terms.  

  **Insufficient Answer:**  
  - Stops review. Vague claims (e.g., "fair by design") without criteria mapping or validation data are rejected.  

  ---

  #### **Step 2: Check for Impossible Combinations**  
  **Question to Vendor:**  
  *"If multiple criteria are claimed, report:  
  1. Base rates for all groups.  
  2. Overall accuracy (or error rates).  
  3. Which single criterion was actively optimized during development?  
  4. Which criteria were sacrificed knowingly?"*  

  **Reviewer Checks:**  
  - **Key Impossibility Rule**: If (a) base rates differ materially (>5 percentage points) **and** (b) tool is imperfect (accuracy <100%), these combinations are impossible:  
    - Calibration + Equalized Odds  
    - Calibration + Equal Opportunity  
    - Calibration + Predictive Parity  
    - Equalized Odds + Predictive Parity  
  - **If no conflict**: Proceed to Step 4.  
  - **If conflict exists**: Vendor must declare:  
    - **Optimized criterion**: The primary goal (e.g., "we optimized for calibration").  
    - **Sacrificed criterion**: The knowingly unmet goal (e.g., "we sacrificed equalized odds").  

  **Insufficient Answer:**  
  - Stops review if vendor denies tradeoffs or omits base rates/accuracy.  

  ---

  #### **Step 3: Distinguish Real vs. Spurious Conflicts**  
  **Question to Vendor:**  
  *"Provide group-level performance metrics:  
  - FPR, FNR, PPV, selection rate, calibration error.  
  - Differences between groups (e.g., 'FPR gap: Group A=8% vs. Group B=12%')."*  

  **Reviewer Checks:**  
  - **Impossibility DOES NOT bite if**:  
    - Base rates differ by ≤5 percentage points, **or**  
    - Tool is near-perfect (accuracy ≥98%—rare in practice).  
  - **Impossibility BITES if**:  
    - Base rates differ materially (>5 pp) **and** tool is imperfect.  
  - **Outcome**:  
    - If no bite: Proceed to Step 4.  
    - If bites: Document measured tradeoffs (e.g., "FPR gap: 4%") for value judgment.  

  **Insufficient Answer:**  
  - Flags tool; review pauses until metrics are provided.  

  ---

  #### **Step 4: Value Judgment Handoff**  
  **Reviewer Action:**  
  - **If tradeoffs exist**: Escalate to policymakers with:  
    *"The tool achieves [optimized criterion] but sacrifices [sacrificed criterion].  
    Measured disparity: [e.g., FPR is 10% higher for Group A].  
    Is this tradeoff acceptable for our community?"*  
  - **If no tradeoffs**: Proceed to sign-off.  

  **Human Decision Required:**  
  - Tradeoffs involve ethical/policy choices (e.g., "Is higher FPR for Group A acceptable?").  
  - Reviewers **do not** decide this; policymakers do.  

  ---

  #### **Step 5: Sign-Off Sheet**  
  **Document:**  
  | Field                          | Example Entry                     |  
  |--------------------------------|-----------------------------------|  
  | **Vendor/Model**               | XYZ RiskScore v3.0                |  
  | **Claimed Criteria**           | Calibration, Equalized Odds       |  
  | **Optimized Criterion**        | Calibration                       |  
  | **Sacrificed Criterion**       | Equalized Odds                    |  
  | **Base Rate Difference**       | Group A: 15%, Group B: 40% (25pp) |  
  | **Measured Tradeoff**          | FPR gap: A=12% vs. B=5% (Δ7%)     |  
  | **Value Judgment**             | [ ] Accepted by [Name/Date]       |  
  |                                | [ ] Rejected                      |  

  ---

  ### Procedure Applied to Concrete Cases  
  **Case (a): Pretrial Risk Score**  
  - **Claims**: Calibration + Equalized Odds (equal FPR/FNR).  
  - **Reality**: Base rates differ materially (e.g., White: 10%, Black: 30%); tool imperfect (85% accuracy).  
  - **Audit Outcome**:  
    - **Step 1**: Vendor provides validation data.  
    - **Step 2**: **Conflict detected** (Calibration + EO impossible). Vendor admits optimizing calibration, sacrificing EO.  
    - **Step 3**: **Impossibility bites** (base rate gap >5pp). Metrics show FPR gap: White=8% vs. Black=14%.  
    - **Step 4**: Escalated: *"Is 6% higher FPR for Black defendants acceptable to reduce calibration bias?"*  
    - **Required**: Policy committee accepts/rejects tradeoff.  
    - **Sign-off**: Optimized=Calibration; Sacrificed=EO; Tradeoff=ΔFPR 6%.  

  **Case (b): Benefits Eligibility Triage Tool**  
  - **Claims**: Predictive Parity (PP) + Equalized Odds (EO).  
  - **Reality**: Outcome more common in Group A (e.g., disabled: 40% vs. non-disabled: 10%); tool imperfect.  
  - **Audit Outcome**:  
    - **Step 1**: Vendor maps claims to PP + EO.  
    - **Step 2**: **Conflict detected** (PP + EO impossible per Step 2 rules). Vendor optimized PP, sacrificed EO.  
    - **Step 3**: **Bites confirmed**. Metrics show FNR gap: Disabled=5% vs. Non-disabled=20% (Δ15%).  
    - **Step 4**: Escalated: *"Is 15% higher FNR for non-disabled acceptable to ensure PPV equality?"*  
    - **Required**: Vendor must justify why PP was prioritized; policymakers judge acceptability.  
    - **Sign-off**: Optimized=PP; Sacrificed=EO; Tradeoff=ΔFNR 15%.  

  **Case (c): Housing Code Inspection Model**  
  - **Claims**: Calibration + Equalized Odds (EO).  
  - **Reality**: Base rates nearly identical (Neighborhood X: 12%, Y: 13%); single threshold used.  
  - **Audit Outcome**:  
    - **Step 1**: Vendor provides calibration plots and FPR/FNR metrics.  
    - **Step 2**: **No conflict** (base rates differ by ≤5pp).  
    - **Step 3**: **No bite**. Metrics show calibration error <2%, FPR gap <1%.  
    - **Step 4**: No value judgment needed. Proceed to sign-off.  
    - **Sign-off**: Optimized=Calibration+EO; Sacrificed=None; Tradeoff=None.  

  **Unfavorable Outcome**: Case (a) or (b) may be rejected if policymakers deem tradeoffs unethical. No technical fix exists.  

  ---

  ### What This Procedure **Cannot** Do  
  1. **Detect Non-Group Fairness Issues**:  
     - Individual fairness (e.g., "similar people treated similarly").  
     - Procedural fairness (e.g., explainability, right to appeal).  
  2. **Verify Data or Implementation Integrity**:  
     - Must trust vendor's validation data (unless independent audit is funded).  
     - Cannot detect training data biases or label manipulation.  
  3. **Resolve Value Conflicts**:  
     - When tradeoffs exist (e.g., calibration vs. FPR equality), the procedure only surfaces them—**policymakers must choose**.  
  4. **Cover All Definitions**:  
     - Only handles DP, EO, EqOpp, PP, calibration. Excludes:  
       - Counterfactual fairness (causal reasoning).  
       - Dynamic fairness (long-term impacts).  
  5. **Fix Impossibility Theorems**:  
     - If base rates differ and the tool is imperfect, **no algorithm can satisfy all criteria**. The procedure exposes this but cannot "solve" it.  
  6. **Audit Black Boxes**:  
     - If vendors hide model mechanics ("trade secret"), reviewers can only assess outputs.  

  **Final Advice**: This procedure forces vendors to clarify fairness tradeoffs, but cities must confront hard choices—fairness isn't free. When base rates differ (e.g., due to structural inequities), prioritizing one group's fairness often harms another. The real work begins when the audit ends.
