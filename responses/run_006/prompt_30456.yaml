prompt: |-
  I am a professor of philosophy and chair of my university's Grounds and Sustainability Committee. Each month we review proposals for insecticide use across the campus: aphids on the ornamental lindens along the main quadrangle, mosquito control around the stormwater wetlands, drywood termites in the nineteenth-century library, scale insects in the glasshouses, ants in the student kitchens. At present we decide case by case, and our discussions lurch between members who regard insects as beneath moral consideration, members who would ban all chemical control on precautionary grounds, and members who simply defer to the pest-control contractor's recommendation. I want to stop relitigating first principles every month, and to give the facilities director, who signs off on every application, something more principled than whichever argument prevailed at the last meeting.

  Please write a decision procedure the committee can actually run on a proposal. It should be grounded in what environmental and animal ethics can defensibly say about harming and killing insects, yet remain usable by non-specialists in about half an hour per proposal, on the strength of evidence the proposing unit can reasonably supply. Specify the questions in order, what counts as a sufficient answer to each, where the procedure returns a no or attaches conditions, and where it must hand the decision to a person because the question is one of values rather than facts. Pay particular attention to the hard cases: uncertainty about insect sentience, the difference between nociception and pain, the difference between harms to individual organisms and harms to populations or ecosystems, the value-ladenness of the category 'pest', and the question of who bears the residual risk. Be explicit about which steps are judgment calls dressed up as procedure, and about what the procedure cannot settle.

  Then run the procedure on three proposals the committee will actually see this term: (i) a neonicotinoid soil drench for aphids on the ornamental lindens, where the damage is purely cosmetic; (ii) a larvicide application to the campus wetlands following two locally acquired cases of mosquito-borne disease; and (iii) whole-structure fumigation of the library to eliminate a drywood termite infestation threatening the timber frame and the special collections. I expect at least one of these to yield an answer the committee will find unwelcome; make that explicit rather than softening it. Please write the answer in British English.
reasoning: |-
  Okay, the user is a philosophy professor chairing a sustainability committee that reviews insecticide proposals. They're frustrated with ad hoc debates and want a principled yet practical decision framework. The key challenges are balancing ethics with pragmatism, especially regarding insect sentience, precautionary principles, and defining "pest."

  Hmm... they need something that non-specialists can apply in 30 minutes using available evidence. The framework must handle gray areas like uncertainty about pain in insects and differentiate between individual vs ecological harm. 

  Right, I should structure this as a flowchart with clear stopping points. Start with necessity - if there's no real harm, reject immediately. Then assess alternatives, followed by sentience considerations. The tricky bits will be steps requiring value judgments, like whether cosmetic damage justifies intervention. Need to flag those explicitly.

  For the test cases: 
  The linden aphids seem weakest - purely cosmetic damage fails the necessity test. The library termites clearly pass structural threat criteria. Mosquitoes are borderline due to disease risk but need conditions about least-harmful methods. 

  Ah, and I mustn't shy from unpopular outcomes. The aphid treatment should get rejected outright - that'll ruffle feathers but aligns with ethics. Should emphasize that proceduralizing values doesn't make them less contentious, just more transparent.

  Better use British spelling throughout. Also remind them that contractors' definitions of "pest" often need challenging. The residual risk question - who bears uncertainty - deserves special emphasis since committees often overlook it.
answer: |-
  ## The Insecticide Decision Procedure for the Grounds and Sustainability Committee

  **Grounding:** This procedure draws on pluralist environmental ethics, incorporating elements of sentientism (moral consideration for beings capable of suffering), biocentrism (respect for individual life), ecocentrism (value of ecosystems/species), and precautionary principles. It acknowledges persistent uncertainty in insect sentience but assigns moral weight to plausible suffering. It differentiates between *intrinsic* value (of individuals/populations/ecosystems) and *instrumental* value (e.g., human health, structural integrity, research value). "Pest" is recognised as a context-dependent, value-laden term requiring justification.

  **Procedure Structure:** Sequential steps. A "No" at Steps 1, 2, 3, or 4 stops the procedure (Reject Proposal). Step 5 may add conditions. Step 6 requires human judgment. Evidence must be *reasonably available* to the proposing unit (e.g., contractor reports, expert opinions, facility management input, basic cost estimates, known alternatives).

  ---

  **The Procedure:**

  1.  **Demonstrated Necessity & Threshold of Harm:**
      *   **Question:** Is the proposed insecticide use necessary to prevent demonstrable, significant harm exceeding purely cosmetic or minor nuisance levels? *Specify the harm(s) threatened.*
      *   **Sufficient Answer:** Clear evidence of harm to: (a) Human health (e.g., disease vector), (b) Significant structural integrity (e.g., building load-bearing elements), (c) Irreplaceable cultural/heritage assets (e.g., rare books, historic fabric), (d) Critical research/teaching functions (e.g., unique glasshouse collections), (e) Significant ecological function on campus (rarely applicable for insecticides, but e.g., preventing invasive species collapse). *Cosmetic damage to non-special plants, minor nuisance ants, etc., fail.*
      *   **Outcome:** **No** = Reject Proposal. **Yes** = Proceed to Step 2.
      *   **Judgment Call/Value Laden:** Defining "significant harm" involves values (e.g., how much structural damage is tolerable? How "irreplaceable" is an asset?).
      *   **Cannot Settle:** Deep philosophical disagreements about the relative value of human projects (like aesthetics) vs. insect life.

  2.  **Exhaustion of Effective Non-Chemical Alternatives:**
      *   **Question:** Have all reasonably available, effective, and less harmful non-chemical control methods (physical, mechanical, biological, cultural) been genuinely explored and deemed insufficient or impractical *for this specific situation*?
      *   **Sufficient Answer:** Documentation of alternatives considered (e.g., traps, exclusion, beneficial insects, habitat modification, sanitation, heat treatment for buildings, tolerant plant varieties) and clear, evidence-based reasons for their rejection (e.g., cost, efficacy data, scale, timing constraints, safety). Mere assertion of impracticality is insufficient.
      *   **Outcome:** **No** = Reject Proposal (or return for alternative exploration). **Yes** = Proceed to Step 3.
      *   **Judgment Call/Value Laden:** Assessing "reasonably available" (cost, effort) and "effective" (required level of control) involves values and context.
      *   **Cannot Settle:** Absolute technological limitations vs. institutional unwillingness to invest in alternatives.

  3.  **Target Insect Profile & Plausible Sentience:**
      *   **Question:** What is the best available evidence regarding the target insect's capacity for nociception and *plausible* sentience (capacity to experience aversive states)? Consider phylogeny, neural complexity, behavioural responses to injury (beyond simple reflex).
      *   **Sufficient Answer:** Reference scientific consensus where it exists (e.g., strong evidence for pain in bees, wasps, some flies; weaker/more debated for aphids, scale; very weak for termites). Contractor/entomologist input on the specific insect's biology. Acknowledge uncertainty.
      *   **Outcome:** Categorise:
          *   **High Plausibility (HP)** (e.g., bees, ants, flies, mosquitoes): Proceed to Step 4a.
          *   **Low Plausibility (LP)** (e.g., aphids, scale, termites - based on current evidence): Proceed to Step 4b.
          *   **Uncertain (U):** Apply Precautionary Principle - treat as **HP**.
      *   **Judgment Call/Value Laden:** Interpreting complex and often ambiguous evidence on sentience. Choosing the threshold for "plausible". Applying the precautionary principle.
      *   **Cannot Settle:** The definitive existence or nature of insect subjective experience.

  4.  **Minimising Harm & Selecting Method:**
      *   **4a. For HP or U Targets:**
          *   **Question:** Is the proposed insecticide the *least harmful effective method available* considering: (i) Specificity to target pest? (ii) Mode of action (rapid vs. slow, neurotoxicity)? (iii) Duration/Intensity of suffering likely caused? (iv) Potential for non-target harm (including beneficial insects, vertebrates)? (v) Persistence in the environment?
          *   **Sufficient Answer:** Comparison of proposed method vs. other chemical options (if any remain feasible post-Step 2) on criteria (i-v). Evidence from product labels, SDS, independent research (e.g., university extension services), contractor expertise. Must demonstrate why this specific chemical/method is less harmful than alternatives *while still being effective*.
          *   **Outcome:** **No** = Reject Proposal (or require revision to a less harmful effective method). **Yes** = Proceed to Step 5.
      *   **4b. For LP Targets:**
          *   **Question:** Is the proposed insecticide the *most effective method* with *minimal unreasonable non-target impacts* (especially on HP species and ecosystems)? (The bar is lower for suffering, but ecocentrism/biocentrism still demand consideration).
          *   **Sufficient Answer:** Demonstrate efficacy and show consideration of non-target effects (e.g., avoiding broad-spectrum sprays near pollinator habitats, choosing less persistent chemicals). Focus shifts slightly towards efficacy and ecosystem impact.
          *   **Outcome:** **No** = Reject Proposal (or require revision). **Yes** = Proceed to Step 5.
      *   **Judgment Call/Value Laden:** Balancing efficacy against suffering potential and ecological impact. Defining "minimal unreasonable" non-target harm. Interpreting complex toxicology.
      *   **Cannot Settle:** Precise quantification of suffering or ecological harm.

  5.  **Mitigation, Monitoring & Residual Risk:**
      *   **Question:** What specific, verifiable conditions will be attached to minimise harm, monitor effectiveness/non-target effects, and define who bears the residual risk (uncertainty about long-term effects, unforeseen consequences)?
      *   **Sufficient Answer:** Mandatory conditions proposed, e.g.:
          *   Strict application protocols (timing, weather, location buffers).
          *   Non-target monitoring plan (e.g., sticky traps for beneficial insects, visual surveys).
          *   Efficacy evaluation plan.
          *   Reporting requirements back to the Committee.
          *   Explicit statement: "Residual risk of unforeseen ecological or welfare impacts is borne by the university community / ecosystem."
      *   **Outcome:** **Conditions Attached** = Proposal Approved *with Conditions*. Proceed to Step 6 for final check. (Insufficient mitigation = Reject or Revise).
      *   **Judgment Call/Value Laden:** Determining what level of mitigation is "sufficient". Acceptability of residual risk allocation.
      *   **Cannot Settle:** Eliminating all uncertainty or risk.

  6.  **Final Value Judgment (Committee Vote):**
      *   **Question:** Even if the proposal passes Steps 1-5, does the committee judge that the *level of harm to insects/ecosystems* imposed is *proportionate* to the *level of benefit* gained (as defined in Step 1), acknowledging the inherent moral weight assigned to the insects/ecosystem in this context?
      *   **Process:** Structured committee discussion focusing *only* on the proportionality judgment based on the evidence gathered in Steps 1-5. Explicit vote.
      *   **Outcome:** **Yes** = Proposal Approved (with conditions). **No** = Proposal Rejected.
      *   **Judgment Call/Value Laden:** This *is* the core value judgment. It forces the committee to explicitly weigh the competing values after the factual/feasibility hurdles are cleared.
      *   **Cannot Settle:** Resolving fundamental disagreements about the moral weight of insects vs. human interests; it surfaces them for democratic decision.

  ---

  **Application to Proposals:**

  **(i) Neonicotinoid Soil Drench for Aphids on Ornamental Lindens (Cosmetic Damage)**

  1.  **Necessity:** Harm claimed: Cosmetic damage to leaves (honeydew, sooty mould). **Assessment:** Purely cosmetic. No threat to health, structure, irreplaceable assets, critical function, or significant ecology. **Answer: NO.**
  2.  **Outcome:** Reject Proposal. **Procedure Stops.**
      *   **Unwelcome Outcome:** Yes. Facilities/grounds staff may be unhappy. Emphasise Step 1 threshold: cosmetics don't justify insecticide use, especially systemic neonics. Value judgment: Aesthetic preferences do not override the harm caused.

  **(ii) Larvicide Application to Campus Wetlands (Mosquito-Borne Disease)**

  1.  **Necessity:** Harm claimed: Human health risk (locally acquired mosquito-borne disease cases). **Assessment:** Demonstrable, significant harm to human health. **Answer: YES.** Proceed.
  2.  **Alternatives:** Proposing unit must detail: Source reduction (eliminating stagnant water), biological controls (Bti *is* a larvicide, but often considered "less harmful"; are *other* biologicals like fish feasible?), public education (repellent use, avoiding dawn/dusk). Why are these insufficient *now* for rapid control? **Answer:** If insufficient evidence of genuine exploration/implementation of alternatives, **NO** (Reject/Revise). If reasonable case made (e.g., source reduction impractical at scale quickly, Bti proposed *is* the biological), **YES.** *Assume YES for this test.* Proceed.
  3.  **Sentience:** Target: Mosquito larvae. **Assessment:** Diptera (flies). Evidence for nociception and plausible sentience in flies is stronger than for many insects. **Outcome: HP (High Plausibility)** or **U (Uncertain)** -> Apply Precautionary Principle -> Treat as **HP**. Proceed to 4a.
  4.  **Minimising Harm (4a):** Proposed: Larvicide (specify type! E.g., Bti, S-Methoprene, mineral oil).
      *   *If Bti (Bacillus thuringiensis israelensis):* Highly specific to mosquito/blackfly larvae, bacterial toxin, generally considered low non-target impact. Likely rapid. *Potentially sufficient* for least harmful effective.
      *   *If S-Methoprene (insect growth regulator):* Specificity broader (affects other insects moulting), mode of action slower (prevents maturation), suffering duration? Non-target impacts on aquatic insects? Persistence?
      *   *If Mineral Oil/Surface Film:* Physical suffocation, rapid? Specificity low (affects any air-breathing aquatic invertebrate larva/pupa at surface).
      *   **Sufficient Answer:** Must compare proposed larvicide against other options (especially Bti if not chosen) on criteria (i-v). If Bti is proposed and effective locally, likely **YES**. If a broad-spectrum IGR or oil is proposed without justification for why Bti is ineffective, likely **NO** (require Bti or equivalent). *Assume Bti proposed.* **YES.** Proceed.
  5.  **Mitigation:** Essential conditions:
      *   Strict use of Bti only (if agreed as least harmful).
      *   Targeted application only to identified breeding sites within wetlands, avoiding open water if possible.
      *   Buffer zones if near sensitive habitats.
      *   Monitoring plan: Adult mosquito trapping pre/post, visual survey for non-target aquatic insects.
      *   Report efficacy and observations to Committee.
      *   Residual risk statement included.
      *   **Conditions Attached.** Proceed.
  6.  **Proportionality:** Committee votes: Does preventing potential human disease (acknowledging cases exist) justify the certain harm to mosquito larvae (plausible sentience) and low-but-present risk to non-targets, using the least harmful method (Bti) with mitigation? **Likely YES**, but requires explicit value judgment. **Approved with Conditions.**

  **(iii) Whole-Structure Fumigation of Library (Drywood Termites)**

  1.  **Necessity:** Harm claimed: Threat to structural timber frame and irreplaceable special collections (books, manuscripts). **Assessment:** Drywood termites directly consume structural wood and paper/cellulose materials. Threat is to significant structural integrity and irreplaceable cultural/heritage assets. **Answer: YES.** Proceed.
  2.  **Alternatives:** Proposing unit must detail: Localised treatments (injection, heat, microwave, freezing), ongoing monitoring, physical barriers. Why insufficient? **Assessment:** Whole-structure fumigation (e.g., Vikane gas) is often last resort due to scale, cost, and disruption. Reasons for rejection of alternatives: Infestation too widespread/diffuse for spot treatment; heat/other methods may damage collections or building fabric; structural access limitations. **Sufficient Answer:** Requires detailed pest report justifying scale and impracticality of alternatives. **Likely YES** (fumigation often only viable option for widespread drywood termites in sensitive buildings). Proceed.
  3.  **Sentience:** Target: Drywood Termites. **Assessment:** Isoptera. Current evidence for complex sentience is very weak. Limited neural complexity, primarily nociception-level responses. **Outcome: LP (Low Plausibility).** Proceed to 4b.
  4.  **Minimising Harm (4b):** Proposed: Sulfuryl fluoride (Vikane) fumigation.
      *   *Efficacy:* Very high for whole-structure eradication.
      *   *Non-target Impacts:* Extreme. Highly toxic, broad-spectrum gas kills *all* arthropods (and vertebrates) inside. Requires meticulous sealing and evacuation. Environmental persistence low, but acute hazard high during application. Potential for collateral damage if sealing fails. No benefit of specificity.
      *   **Question:** Is it the *most effective* method with *minimal unreasonable non-target impacts*? **Assessment:** It is arguably the most effective for eradication. However, non-target impacts are massive and inherent (kills everything inside). "Minimal unreasonable"? This is highly contentious. The procedure forces confronting this: Is there *any* comparably effective method with lower non-target impact? If alternatives genuinely exhausted (Step 2), then fumigation *is* the most effective. But its non-target impact is extreme. **Judgment:** This is very borderline. Committee might say **NO** due to unreasonable non-target harm, forcing re-evaluation of alternatives or acceptance of partial control. *Assume* justification that alternatives are truly infeasible and the risk to collections/structure is imminent/severe. **Answer: YES (barely, acknowledging extreme non-target harm).** Proceed.
  5.  **Mitigation:** Critical Conditions:
      *   Exhaustive verification of sealing integrity.
      *   Rigorous gas monitoring during application/aeration.
      *   Strict exclusion zones, safety protocols.
      *   Post-treatment monitoring for efficacy and termite resurgence.
      *   *Acknowledge complete destruction of all insect life within the structure.*
      *   Explicit residual risk statement (e.g., potential seal failure, long-term building health effects, ecological wipe-out inside).
      *   **Conditions Attached.** Proceed.
  6.  **Proportionality:** Committee votes: Does preserving the irreplaceable library structure and special collections justify the certain eradication of *all* arthropod life within the building (including any beneficial or rare species present, though plausibility of sentience low for most) using a highly hazardous method? **Value Judgment:** This is the hardest call. The stakes (cultural heritage, structure) are high. The harm to insects is total for the building interior but focused spatially. **Likely YES** given the assessment of necessity and LP sentience, but deeply uncomfortable. Requires explicit vote acknowledging the gravity. **Approved with Conditions.**

  **Explicit Limitations of the Procedure:**

  1.  **Doesn't Resolve Deep Values:** It surfaces value conflicts (e.g., Step 6, defining "significant harm") but doesn't resolve fundamental philosophical disagreements. The committee must still vote.
  2.  **Relies on Available Evidence:** Garbage in, garbage out. It depends on the proposing unit and contractor providing reasonable evidence. It cannot overcome deliberate obfuscation or lack of data.
  3.  **Judgment Calls:** Many steps (Necessity, Reasonableness of Alternatives, Plausibility of Sentience, Sufficiency of Mitigation, Proportionality) involve significant committee judgment, not pure calculation. The procedure structures the *consideration*, not the *outcome*.
  4.  **Cannot Quantify Suffering:** It differentiates High/Low Plausibility and requires least-harm methods, but cannot put a number on insect suffering.
  5.  **Precautionary Principle Application:** Treating Uncertainty as High Plausibility is a value-based choice that may be seen as overly restrictive by some.
  6.  **Residual Risk:** It forces acknowledgement but cannot eliminate risk.

  This procedure provides a structured, ethically grounded framework to move beyond ad-hoc debates, demanding justification at key ethical junctures and forcing explicit value judgments where facts run out. It will produce defensible, though sometimes difficult, decisions.
