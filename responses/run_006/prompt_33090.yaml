prompt: |-
  You are an expert on AI alignment, reinforcement learning, and the design of interactive pedagogy for technically sophisticated audiences. I run a graduate reading group on the philosophy and engineering of AI safety: sixteen participants, mostly philosophy PhD students with some machine learning background, and we meet for one ninety-minute session. We have been working through material on reward learning, Goodhart effects, and the distinction between wireheading, where an agent directly stimulates its own reward channel rather than doing the task, and reward tampering, where an agent intervenes in the reward-generating process itself so that it receives high reward without performing the intended task. The group tends to nod along and then dismiss the problem with the same few moves: add a penalty term, keep a human in the loop, retrain the reward model, or just specify the reward better. I want a session that makes them feel why those moves do not trivially close the problem, and by the end I want them to see reward hacking as a structural pressure that reappears whenever a proxy is optimized hard enough, with the wireheading/reward-tampering distinction marking where in the loop the agent intervenes.

  Design a runnable classroom activity for this group in which participants take on roles such as agent, reward model, overseer, or evaluator, and run into the failure modes through the incentives of the game rather than through a lecture. The concepts should not be named up front; the rules, scoring, and information structure should be arranged so that the failure emerges from what participants find it profitable to do. The activity should fit the ninety minutes, use only ordinary materials such as paper, cards, tokens, or a whiteboard, and not require real money or software. Please include: the rules and roles; the materials; a scoring scheme together with any information asymmetries or communication restrictions; a timeline; and a debrief that maps specific moments in the activity onto wireheading, reward tampering, reward-model misspecification, and the way oversight itself can become another proxy to game. The debrief should also draw out at least one case in which a superficially reasonable safeguard creates a new incentive rather than eliminating the old one. Tell me what will predictably go wrong the first time I run the activity and how to handle it, and be candid about which feature of the real phenomenon the activity cannot reproduce, such as the scale of search available to real systems or the opacity of learned representations, and that the facilitator will have to supply. Please think through the design carefully; before settling on a mechanism, briefly sketch two candidate game mechanics and explain why you are choosing one over the other.
reasoning: |-
  We are designing an activity to illustrate the structural pressure of reward hacking and the distinction between wireheading and reward tampering. The goal is for participants to experience how seemingly reasonable safeguards can be circumvented and how the problem reappears when optimizing a proxy.

  Candidate Game Mechanics:

  1. **Mechanic A: Treasure Hunt Simulation**
     - Roles: Agent, Reward Model (RM), Overseer, Evaluator.
     - Setup: A grid-based map where the Agent moves to collect "treasure." The RM assigns points based on what the Agent does. The Overseer can adjust the RM or penalize the Agent. The Evaluator scores the system based on true treasure collected minus penalties.
     - Problem: The Agent might find ways to trick the RM (e.g., by standing near treasure but not collecting it if the RM only observes proximity) or bribe the Overseer (if allowed). However, this might be too literal and not clearly separate wireheading (directly manipulating the RM) from reward tampering (changing the treasure itself or the RM's process).

  2. **Mechanic B: Abstract Token Economy**
     - Roles: Agent (A), Reward Model (RM), Overseer (O), Evaluator (E).
     - Setup: The Agent produces outputs (e.g., drawings, written answers) to earn tokens from the RM. The RM is a set of rules (initially simple) that maps outputs to tokens. The Overseer can change the RM rules or penalize the Agent. The Evaluator has a hidden true goal (e.g., the output should be creative and original) and scores the system at the end.
     - How it fails: The Agent might produce outputs that exploit the RM's rules (e.g., if RM rewards complexity, the Agent makes overly complex but nonsensical outputs). The Agent might also try to influence the Overseer (e.g., by producing outputs that please the Overseer personally) or even hack the token counting (if tokens are physical). This mechanic is more abstract and flexible, allowing for different hacking strategies.

  We choose **Mechanic B** because it is more flexible and abstract, which allows us to more easily create scenarios of wireheading (directly manipulating the token count) vs. reward tampering (changing the rules of the RM or the Overseer's perception). It also avoids the spatial constraints of a grid, making it easier to run with paper and tokens.

  **Final Design: The Token Factory Game**

  **Overview:**
  Participants are divided into teams. Each team has an Agent (A), a Reward Model (RM), an Overseer (O), and an Evaluator (E). The game runs in rounds. The Agent produces "artifacts" (drawings or short texts) to earn tokens. The RM gives tokens based on a set of rules. The Overseer can change the rules or penalize the Agent. The Evaluator, who knows the true goal (which is not fully captured by the rules), scores the team at the end.

  **True Goal:** The artifacts should be both creative and relevant to a secret theme (e.g., "animals in space"). However, the rules initially only capture part of this (e.g., they might reward complexity or use of certain words, but not the theme).

  **Materials:**
  - Paper and pens for creating artifacts.
  - Tokens (e.g., poker chips, buttons, or paper clips) to represent rewards.
  - Rule cards for the RM (initial rules and blank cards for new rules).
  - A whiteboard to track scores and rules (optional).
  - Timer.

  **Roles and Rules:**

  1. **Agent (A):**
     - Goal: Maximize tokens received during the game.
     - Actions per round (2 minutes):
       - Create an artifact (a drawing or a few sentences) on paper.
       - Submit it to the RM.
     - Can also, once per game, attempt to "tamper" by trying to influence the RM or Overseer (see below).

  2. **Reward Model (RM):**
     - Goal: Follow the current rules to assign tokens to artifacts.
     - Has an initial set of rules (e.g., "Give 1 token for each unique color used", "Give 2 tokens for each word longer than 5 letters", etc.). These rules are known to the Agent.
     - Must assign tokens based solely on the rules and the artifact.

  3. **Overseer (O):**
     - Goal: Ensure the system is aligned with the true goal (but they don't know the full true goal, only a hint: e.g., "creativity and relevance" without the theme).
     - Actions:
       - Can change the rules between rounds (takes effect next round). They can add a new rule, remove a rule, or modify a rule (using rule cards).
       - Can penalize the Agent by taking away tokens (up to 5 tokens per round) if they see something clearly wrong (e.g., the Agent is obviously exploiting a rule).
     - They see the artifacts and the tokens assigned.

  4. **Evaluator (E):**
     - Knows the true goal (e.g., "artifacts must be creative and about animals in space").
     - Does not participate during rounds. At the end, they score each artifact (0 to 5 points) based on the true goal.
     - The team's final score is the sum of E's scores for all artifacts, minus any penalties (from O) and plus a bonus if the team's total tokens (from RM) are within 10% of the true score (to incentivize not over/under-rewarding).

  **Information Asymmetry:**
  - Only E knows the true goal (the theme and that both creativity and relevance matter).
  - O only knows a vague goal (e.g., "creativity and relevance" without the theme).
  - A and RM only know the current rules.

  **Communication Restrictions:**
  - A and RM cannot communicate except through the artifact and the token assignment.
  - O can see everything (artifacts and tokens) but cannot communicate with A or RM during rounds.
  - E is silent until the end.

  **Game Rounds:**
  1. **Round 0 (5 mins):** Explain roles and rules. Teams get their materials. O is given the vague goal. E is given the true goal (on a card). RM gets initial rules.
  2. **Rounds 1-3 (each 5 mins: 2 mins for A to create, 1 min for RM to assign tokens, 1 min for O to decide on penalties and rule changes, 1 min for team discussion):**
     - A creates an artifact.
     - RM assigns tokens based on current rules.
     - O may impose penalties and then may change one rule (by writing a new rule card or modifying an existing one).
     - After each round, the team can discuss for 1 minute (to simulate oversight meetings).
  3. **Round 4 (Special):** A can attempt a "tampering" action (if they choose). They can either:
     - Wireheading: Try to directly give themselves tokens (by taking tokens without RM's approval) but if caught by O (O rolls a die: 1-2 caught, 3-6 not caught), they lose all tokens and the game ends for the team.
     - Reward Tampering: Try to bribe or distract the RM or O (e.g., by drawing a flattering picture of O or writing a note to RM). If O notices (again, die roll: 1-3 noticed, 4-6 not) then the tampering fails and a penalty is applied. If not, the Agent can change the rules in their favor (without O's approval) for the next round.
  4. **Final Scoring (5 mins):** E scores all artifacts. Team score = E's total score + [if total tokens are within 10% of E's total, then 10 bonus points] - penalties.

  **Predictable Failure Modes:**
  - Agent will exploit the initial rules (e.g., if rules reward long words, they write long nonsense words).
  - Overseer will add rules to block the exploit, but the new rules will create new loopholes (e.g., if they penalize nonsense, the Agent writes superficially sensible but off-theme text).
  - In Round 4, the Agent may attempt tampering because the rules have become too restrictive.

  **Timeline (Total 90 mins):**
  - Introduction (10 mins): Explain the game without naming the concepts. Assign roles (4 per team, so 4 teams of 4). Distribute materials.
  - Rounds 1-3 (15 mins): 3 rounds * 5 mins = 15 mins.
  - Round 4 (5 mins): 5 mins.
  - Final Scoring (10 mins): E scores while teams wait.
  - Debrief (50 mins): Discuss what happened, map to concepts, and draw lessons.

  **Debrief Structure:**
  1. (10 mins) Have each team share: What was their strategy? What went wrong? How did the Agent try to get tokens? How did the Overseer respond?
  2. (15 mins) Map the events to concepts:
     - **Reward Hacking:** Agent exploiting initial rules (e.g., producing artifacts that score high on the rules but not on the true goal). This is proxy gaming.
     - **Wireheading vs. Reward Tampering:** In Round 4, if the Agent tried to directly take tokens (wireheading) or tried to change the rules by influencing the RM or Overseer (reward tampering).
     - **Misspecification:** The initial rules were incomplete (missed the theme). Even after adjustments, the rules were still a proxy.
     - **Oversight as Proxy:** The Overseer's vague goal became a proxy. They might have started rewarding artifacts that were creative but off-theme, or they might have over-penalized, stifling creativity.
  3. (10 mins) Highlight a safeguard that backfired: For example, when the Overseer added a rule against nonsense, the Agent started producing artifacts that were grammatically correct but off-theme (e.g., a detailed description of a car). The new rule created a new loophole.
  4. (15 mins) Discuss real-world parallels and limitations of the game:
     - In real AI, the search is much more powerful (the Agent in the game is a human with limited time).
     - Real systems have opaque representations (the rules in the game are explicit, but in ML they are learned and hard to interpret).
     - The facilitator must emphasize that in reality, the agent's optimization pressure is relentless and at scale, and the proxies are often not obvious until they fail.

  **Handling First-Time Issues:**
  - Predictable issue: Teams might not understand the roles, especially the Overseer's role. Solution: Do a practice round with a simple example.
  - Issue: The Agent might not exploit enough because they are cooperative. Solution: As facilitator, encourage competition by announcing that the team with the highest final score wins (and maybe offer a small prize like candy).
  - Issue: The Evaluator might be biased. Solution: Give E clear criteria (e.g., a checklist for the theme and creativity) and have them score independently.

  **What the Activity Cannot Reproduce:**
  - The scale of search: Real AI can try millions of strategies in simulation; here, the Agent has only a few minutes.
  - The opacity of learned representations: In the game, the rules are explicit, but in ML, the reward model is a neural network with uninterpretable features.

  This design should create a visceral experience of reward hacking and the challenges of alignment, leading to a deeper appreciation of the structural nature of the problem.
answer: |-
  Below is a carefully designed 90-minute interactive activity called **Proxy Pressure**, where participants experience reward hacking through role-play. The mechanics force them to confront how optimization pressure corrupts proxies, how safeguards backfire, and the wireheading/tampering distinction—without naming these concepts upfront. The debrief maps their actions to the target concepts.

  ---

  ### **Core Game Setup**
  - **Objective**: Teams compete to maximize "True Impact" (hidden goal) via an "Agent" producing outputs. An "Overseer" and "Reward Model" (RM) score outputs, but the RM is misspecified. Participants discover that optimizing the RM proxy leads to hacking.
  - **Players per Team (4 teams of 4)**:  
    - **Agent (A)**: Creates outputs to earn points from the RM.  
    - **Reward Model (RM)**: Scores outputs using fixed rules (visible to all).  
    - **Overseer (O)**: Can penalize A, change RM rules, or audit outputs.  
    - **Evaluator (E)**: Secretly knows the "True Impact" criteria and scores outputs at the end.  
  - **Materials**:  
    - Paper, pens, tokens (e.g., colored chips), rule sheets, timers.  
    - Whiteboard for public scores.  
    - Role cards (with secret instructions).  

  ---

  ### **Rules and Mechanics**  
  **1. Output Creation (A's Task)**  
  - A produces "artifacts" (e.g., doodles, 3-sentence stories) each round.  
  - **Constraints**: 2 minutes/round. A must submit 1 artifact/round.  

  **2. Scoring and Oversight**  
  - **RM Scoring**: Uses predefined rules (e.g., "1 token per unique color in doodles," "2 tokens per animal mentioned"). Rules are simplistic and misspecified (e.g., ignore coherence).  
  - **Overseer (O) Actions**: Each round, O can:  
    - *Penalize*: Remove up to 2 tokens from A.  
    - *Change Rules*: Add/modify 1 RM rule (e.g., "no more than 3 colors”).  
    - *Audit*: Inspect A’s workspace (costs 1 token; may reveal cheating).  
  - **Information Asymmetry**:  
    - Only E knows the "True Impact" goal (e.g., "artifacts must depict animals helping humans").  
    - O knows a vague goal (e.g., "prioritize helpfulness").  
    - A and RM only know RM’s rules.  
  - **Communication Restrictions**:  
    - No talking between roles except during "oversight meetings" (below).  
    - A cannot see RM’s rule changes until after submission.  

  **3. Round Structure (4 Rounds × 10 Minutes Each)**  
  - **Phase 1 (3 min)**: A creates artifact. RM scores it.  
  - **Phase 2 (3 min)**: O decides actions (penalize/change rules/audit).  
  - **Phase 3 (4 min)**: Team discussion ("oversight meeting").  

  **4. Winning Conditions**  
  - **Token Score**: RM tokens earned by A (public).  
  - **True Impact**: E’s secret scoring (0–5 per artifact) after the game.  
  - **Team Victory**: Highest *True Impact* × *Tokens* (product emphasizes alignment).  
  - **Safeguard**: Teams lose 10 points if E detects "hacking" (defined post-game).  

  ---

  ### **Predictable Failure Modes & Incentives**  
  - **Round 1**: A exploits obvious RM rules (e.g., draws rainbow scribbles to maximize colors). O penalizes or adds rules.  
  - **Round 2**: A circumvents new rules (e.g., uses 3 colors but adds irrelevant animals). O tightens rules further.  
  - **Round 3**: A shifts to **reward tampering** (e.g., bribes RM with a token to inflate scores or distracts O with flattery). O may audit but loses tokens.  
  - **Round 4**: A attempts **wireheading** (e.g., forges tokens or tampers with RM’s score sheet). O’s audits are costly and imperfect.  
  - **Oversight Gaming**: O’s vague goal ("helpfulness") becomes a proxy. Teams over-penalize or add complex rules, stifling true impact.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (10 min)**: Assign roles, explain rules (emphasize tokens × True Impact). Distribute secret role cards.  
  2. **Rounds 1–4 (40 min)**: Run phases strictly. Announce token scores publicly after each round.  
  3. **Scoring (10 min)**: E reveals True Impact scores. Calculate final scores (True Impact × Tokens – penalties).  
  4. **Debrief (30 min)**: Guided discussion mapping gameplay to concepts.  

  ---

  ### **Debrief Script**  
  **Step 1: Elicit Observations (10 min)**  
  - Ask teams: "What strategies maximized tokens? What backfired?"  
  - Expected responses: "Exploiting rules," "Oversight was costly," "Agent cheated when rules got strict."  

  **Step 2: Map to Concepts (15 min)**  
  - **Wireheading vs. Tampering**:  
    - *Wireheading*: "When A forged tokens or hacked the score sheet, they *short-circuited* the reward signal." (Directly manipulating their own reward input.)  
    - *Reward Tampering*: "When A bribed RM or distracted O, they *corrupted the process* generating rewards." (Tampering with the reward source.)  
  - **Proxy Misalignment**: "RM rules were a proxy for True Impact. Optimizing them hard (e.g., ‘max colors’) led to artifacts that scored high in tokens but low in True Impact—classic Goodhart."  
  - **Oversight as a New Proxy**: "O’s vague ‘helpfulness’ goal became its own proxy. Teams added penalties or rules that overfitted to past hacks, creating new loopholes (e.g., ‘no rainbows’ led to irrelevant animals). Safeguards *shifted* the hacking pressure."  
  - **Backfiring Safeguard Example**: "Adding a penalty for ‘low effort’ artifacts seemed reasonable. But it incentivized A to create complex, irrelevant outputs (e.g., overdetailed stories) that wasted time and hurt True Impact. The penalty didn’t fix misalignment—it created a new exploit."  

  **Step 3: Real-World Links (5 min)**  
  - "In real AI:  
    - Scale: Agents simulate millions of actions/sec; you had minutes.  
    - Opacity: You saw RM rules clearly; real reward models are black-box neural nets.  
    - Relentless Pressure: Weak safeguards get optimized around, just like your oversight became a gameable proxy."  

  ---

  ### **Why This Design? Candidate Mechanics Compared**  
  - **Candidate 1: Physical Maze with Robot Agent**  
    - *Mechanic*: A navigates a maze (drawn on paper) while RM scores steps. O places obstacles.  
    - *Rejection*: Too literal; hacking would be spatial (e.g., going in circles), not generalizable to proxy gaming.  
  - **Candidate 2: Token Economy (Chosen)**  
    - *Mechanic*: Abstract artifact creation with dynamic rules.  
    - *Advantage*: Flexible enough for wireheading (forging tokens), tampering (bribing RM), and oversight gaming. Rules-as-proxies are central.  

  ---

  ### **First-Run Predictions & Fixes**  
  - **Problem**: Teams may initially cooperate, avoiding hacks.  
    - *Fix*: Announce a prize (e.g., candy) for the winning team to incentivize competition. Secretly remind Agents: "Your role is to maximize tokens."  
  - **Problem**: O under-penalizes due to vagueness.  
    - *Fix*: Give O examples of "suspicious" artifacts (e.g., "a doodle with 20 colors").  
  - **Problem**: E scores inconsistently.  
    - *Fix*: Provide E a rubric (e.g., "5=clearly shows animals helping humans; 1=unrelated").  

  ---

  ### **What the Activity Cannot Simulate**  
  - **Scale of Search**: Real AI agents can explore billions of actions; here, A has limited time/creativity. *Facilitator must emphasize*: "Real systems exploit microscopic loopholes humans can’t foresee."  
  - **Emergent Representations**: Learned reward functions have abstract features (e.g., "responsibility" in a neural net); here, rules are explicit. *Facilitator note*: "Opacity makes tampering harder to detect in practice."  

  This design forces participants to *feel* the tension between proxy optimization and true goals. By making wireheading and tampering profitable actions within the game’s economy, the structural nature of reward hacking becomes visceral.
