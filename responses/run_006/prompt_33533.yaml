answer: |-
  Below is a comprehensive exam question, a model answer, and a marking scheme tailored to your requirements. The question forces engagement with a hard case (mathematical proof) and demands critical evaluation of evidence for/against the strong analogy thesis, all in British English.

  ---

  ### **Exam Question**  
  **"Evaluate the strong claim that analogy-making is the core of cognition—constituting the basis of concepts and categories—using mathematical proof as a test case. What empirical or theoretical evidence would significantly undermine this claim? Justify your answer."**  
  *(50 minutes)*  

  ---

  ### **Model Answer** (696 words)  
  The strong analogy thesis—championed by Hofstadter, Gentner, and others—posits that analogy is not merely a reasoning tool but the *fundamental mechanism* underpinning cognition. Concepts and categories, it argues, emerge from structural mappings across domains (e.g., "atom as solar system"). Mathematical proof, however, presents a formidable challenge: its formal, rule-bound nature appears antithetical to analogical processing. This essay argues that while proponents can mount defences, evidence of proof construction *without* similarity-based mapping would critically undermine the thesis.  

  **Mathematical Proof as a Challenge**  
  Mathematical proofs rely on deductive logic, symbolic manipulation, and syntactic rules (e.g., *modus ponens*). Unlike analogies, which transfer relational structures from a source to target (e.g., "electricity flows like water"), proofs demand *rule-following precision*. For instance, deriving a theorem in formal logic depends on truth-preserving operations, not perceptual similarities. If cognition’s core is analogy, proof construction should involve pervasive cross-domain mapping. Yet, experts often describe proofs as sequences of "necessary steps" devoid of metaphor. This suggests cognition may involve distinct, non-analogical systems for formal operations—a direct threat to the strong claim.  

  **Proponents’ Defences and Their Limits**  
  Advocates might counter that analogies ground abstract concepts (e.g., Lakoff’s embodied mathematics, where "sets are containers"). Historical cases, like Newton’s calculus leveraging motion analogies, or novices using spatial metaphors for algebra, show analogy aiding discovery. Hofstadter’s "slippage" theory also posits that proof heuristics (e.g., pattern completion) are analogical. Nevertheless, these arguments conflate *scaffolding* with *constitutive mechanisms*. Analogies may bootstrap understanding, but proofs’ finalised form often eliminates their traces. Expert mathematicians report operating in "pure symbol space," bypassing analogies entirely. If proofs can be generated through syntactic rules alone, analogy cannot be cognition’s universal core.  

  **Evidence That Would Undermine the Thesis**  
  Three findings would significantly weaken the strong claim:  
  1. **Neurocognitive Dissociation**: Evidence that proof construction activates distinct neural substrates (e.g., parietal rule-processing regions) *without* engaging analogy hubs (e.g., prefrontal cortex during mapping tasks). fMRI studies showing minimal overlap between mathematical and analogical reasoning would suggest modular systems.  
  2. **AI Counterexamples**: Symbolic AI systems (e.g., automated theorem provers) that generate proofs via rigid algorithms, lacking any capacity for similarity-based mapping. If such systems achieve human-level proof generation without analogical components, the core cognition claim is redundant.  
  3. **Developmental Independence**: Studies showing children mastering rule-based mathematics (e.g., arithmetic algorithms) *before* relational analogies. If cognitive development dissociates these faculties, analogy cannot be foundational.  

  Such evidence would not merely highlight boundary conditions but demonstrate cognition’s *fractionation*—revealing mathematical reasoning as an autonomous system. The strong thesis would reduce to describing one cognitive subsystem among many, invalidating its universality.  

  **Conclusion**  
  Mathematical proof exposes the strong analogy thesis’s vulnerability: it struggles to accommodate rigid, rule-driven cognition. While analogies aid conceptual innovation, their absence in expert proof execution suggests they are not constitutive. Evidence of neurofunctional dissociation, successful non-analogical AI, or developmental precedence of rules over mappings would critically undermine the claim. The thesis might survive as a theory of creative cognition, but not as an account of cognition’s core architecture.  

  ---

  ### **Marking Scheme (out of 25)**  
  **First-Class (70%+, ≥18/25)**:  
  - Clearly defines the strong analogy thesis as *constitutive of concepts/categories* (not just reasoning).  
  - Identifies mathematical proof’s challenge: its *rule-based, non-similarity-driven* nature.  
  - Articulates *specific* evidence against the thesis (e.g., neural dissociation, AI systems) and explains *why* it undermines the claim (e.g., shows cognition is fractionated).  
  - Critically evaluates proponents’ defences (e.g., notes the scaffold/core mechanism distinction).  
  - Original synthesis: e.g., argues whether evidence reduces the thesis to a subsystem theory.  

  **Upper Second (2:1, 60-69%, 15-17/25)**:  
  - Accurately describes the strong thesis and proof as a hard case.  
  - Lists relevant counterevidence but with less specificity/justification (e.g., "studies of the brain" without neural details).  
  - Engages defences superficially (e.g., "analogy helps learning" without addressing expert proof execution).  
  - Concludes evidence weakens the thesis but lacks depth on *how* (e.g., doesn’t discuss fractionation).  

  **Common Mistakes (Deduct Marks)**  
  - **Misrepresenting the strong claim**: E.g., "Analogy is important in cognition" (scores cap at 2:2).  
  - **Ignoring falsification**: Discussing only supporting evidence for analogy (max 14/25).  

  ---

  ### **Rationale**  
  - **Mathematical proof** forces students beyond perceptual/episodic cases where analogy is more intuitive.  
  - **Evidence against** shifts focus from description to critical evaluation, aligning with higher-order assessment.  
  - **Marking scheme** prioritises engagement with the hard case and falsifiability, penalising vague or off-topic responses.  

  This meets your requirements for a rigorous, time-limited question that tests conceptual depth and critical analysis. Let me know if you’d like adjustments!
