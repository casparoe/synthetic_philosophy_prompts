  In the min-RE approach, the probability of B increases because the constraint P(B|A)=1 and we are keeping P(B|¬A) fixed, but also the probability mass from the event (A,¬B) is moved to (A,B). Since P(A) is unchanged, and P(B|A) increases, P(B) increases.

