  We are translating concepts from speech act theory (specifically J.L. Austin and John Searle) into the vocabulary of programming languages. We'll break it down step by step.

  Key concepts in speech act theory:
  1. **Locutionary act**: The act of saying something with a particular meaning (the propositional content).
  2. **Illocutionary act**: The act performed in saying something (e.g., promising, ordering, asserting). This is the force of the utterance.
  3. **Perlocutionary act**: The effect the utterance has on the hearer (e.g., persuading, frightening).

  We are focusing on illocutionary acts and their felicity conditions.

  ### Felicity Conditions
  Austin and Searle identified conditions for a speech act to be felicitous (successful). These are:
  - **Propositional content conditions**: The content of the utterance must meet certain criteria (e.g., a promise must be about a future act of the speaker).
  - **Preparatory conditions**: Background circumstances must be appropriate (e.g., for a promise, the promised action must be something the hearer wants and the speaker believes it is not obvious they will do it).
  - **Sincerity conditions**: The speaker must be sincere (e.g., in a promise, the speaker must intend to do the action).
  - **Essential conditions**: The utterance counts as an undertaking of an obligation (e.g., by promising, the speaker commits to the action).

  If any condition fails, the speech act is infelicitous (but note: it is not false, because it's not a constative).

  ### Uptake
  Uptake refers to the hearer's understanding and recognition of the illocutionary force. Without uptake, the speech act may not be successful. For example, if the hearer does not recognize that the speaker is making a promise, then the promise might not take effect.

  ### Conventionalism vs. Intention-based accounts
  - **Conventionalism**: The force comes from social conventions (like rules in an institution). Example: In a game of chess, moving a piece in a certain way counts as a "castling" because of the rules of chess.
  - **Intention-based**: The force comes from the speaker's intention and the hearer's recognition of that intention (Gricean approach).

  Now, we map to programming concepts.

  ## Mapping

  ### Illocutionary Act
  An illocutionary act is an action performed by uttering words in a context. In programming terms, we can think of it as a **function that has side effects**. The function is not just computing a value (like a pure function) but is changing some state or performing an action. However, the illocutionary act is more than just a side effect: it has a conventional or intentional aspect that gives it a specific meaning (like a promise, command, etc.).

  We can model the illocutionary act as a **transaction** that updates a shared context (which represents the state of the conversation and the commitments of the participants). The shared context is like a global state that tracks the agreements, obligations, etc.

  Alternatively, we might think of it as an **assertion in a proof system** if we are in a formal setting (like a type system or a logic). However, note that in proof systems, assertions are typically constative (they state a fact) and don't have the same force as, say, a promise. So this mapping is less exact.

  **Best mapping**: 
  - An illocutionary act is a **state-changing operation** (with side effects) on a **shared context** (which is a data structure representing the mutual beliefs, commitments, etc. of the participants). The operation is governed by **rules** (conventions) or by **intentions** that must be recognized.

  But note: in programming, we often model such things as **transactions** in a distributed system? Not exactly, because in a distributed system, we are concerned with consistency and failure, but the "meaning" of the transaction is not inherent in the same way.

  **Exactness**: The mapping to a function with side effects is straightforward. However, the conventional or intentional aspect of the illocutionary force does not have a direct counterpart in typical programming. We can encode the rules (conventions) as preconditions and postconditions, but the intentional aspect (like the speaker's mental state) is not represented unless we model it explicitly.

  ### Felicity Conditions
  Felicity conditions are conditions that must hold for the speech act to be successful. In programming, we can map these to:

  - **Preconditions**: These are conditions that must be true before the function is called. They correspond to **preparatory conditions** and **propositional content conditions**. For example, the parameters passed to a function must be of the right type and within valid ranges (like the propositional content condition) and the system state must be in a valid configuration (preparatory).

  - **Sincerity conditions**: These are about the internal state of the speaker. In programming, we don't usually model the internal state (intent) of a function because functions don't have mental states. However, we can model it as an **invariant** that must be maintained by the system? Not exactly. Alternatively, we might think of it as a **runtime check** that the caller is "authorized" or that the action is consistent with prior commitments. But note: sincerity is about the speaker's intention, which is not represented in code. We might simulate it by having the function take an extra parameter representing the "intent", but that is not the same.

  - **Essential conditions**: These define the effect of the speech act. In programming, we can map this to the **postconditions** of the function. The function, if successful, will change the state in a specific way (e.g., adding a commitment to the shared context).

  However, note: felicity conditions are not just about the function's operation but also about the context and the participants. So we must also consider:

  - **Exception cases**: When a felicity condition fails, the speech act is infelicitous. In programming, we might throw an exception. The type of infelicity (misfire, abuse, etc.) might correspond to different exception types.

  **Mapping**:
  - Propositional content conditions: **Type well-formedness** (the types of the arguments) and **assertions on the arguments** (like preconditions on the values).
  - Preparatory conditions: **Preconditions** on the state of the system (e.g., a promise requires that the promised action is desired by the hearer and not already going to happen).
  - Sincerity conditions: This is the hardest. We might model it as a **runtime check that the speaker has the required intent**, but we don't have a way to represent intent in code. We might simulate it by having the function check that the speaker's history of actions is consistent with the intent? But that's an approximation. Alternatively, we might leave it out of the program and handle it at a higher level (e.g., in a reputation system). 
  - Essential conditions: **Postconditions** and **side effects** (the update to the shared context).

  **Exactness**: The mapping for propositional content, preparatory, and essential conditions is fairly exact (preconditions and postconditions). The sincerity condition does not have a direct counterpart because we don't model mental states. This is a stretch.

  ### Uptake
  Uptake is the hearer's recognition of the illocutionary force. Without uptake, the speech act is not successful. In programming, if we model the speech act as a function call that updates a shared context, then uptake might be:

  - **A return value**: The function returns an acknowledgement that the act was performed. But note: uptake is not just about the speaker getting a response, but about the hearer understanding and accepting the act.

  - **A state change visible to another process**: In a distributed system, we require that the state change is replicated or acknowledged by the other process. This is closer: the hearer process must update its own state to reflect the speech act. So uptake would be the **successful propagation and application of the state change to the hearer's state**.

  Alternatively, we can model it as a **two-phase commit**: the speaker proposes the speech act, and the hearer must acknowledge it before it is committed. This is a transaction.

  **Mapping**: Uptake is best mapped as **the successful completion of a transaction that updates a shared state, with the hearer's process acknowledging the update**. Without the acknowledgement, the transaction is rolled back (infelicity).

  **Exactness**: This is a good mapping if we are in a distributed system. In a single-threaded program, we don't have this issue because there is only one state. But in multi-agent systems (like distributed systems or concurrent programs), this is a natural fit.

  ## Residue Report

  ### What maps well?
  - **Illocutionary act**: A state-changing function (with side effects) on a shared context. The conventional rules can be encoded as the function's logic (preconditions, postconditions).
  - **Felicity conditions (propositional, preparatory, essential)**: Preconditions and postconditions of the function. Essential conditions also map to the function's side effects (post-state).
  - **Infelicity**: Exception cases (the function throws an exception when a precondition fails).

  ### What requires stretching?
  - **Sincerity conditions**: We don't model mental states. We can simulate by having the function check some token of intent (e.g., a digital signature or a history of honest behavior) but it's not the same. This is a stretch because in philosophy, sincerity is an internal state, while in programming, we can only check external evidence.
  - **Uptake in non-distributed systems**: In a single-threaded program, the state change is immediate and there is no separate hearer process. So uptake is automatic. But in speech acts, uptake is always required (even in a one-to-one conversation). We might say that in a single-threaded program, the entire state is under the control of one thread, so the hearer (if there is one) is part of the same state. But note: in a program, we can have multiple components (modules) that need to be notified? We might model it as an observer pattern. However, the philosophical concept of uptake requires understanding, which we don't model.

  ### What has no counterpart?
  - **The distinction between locutionary and illocutionary acts**: In programming, we don't usually separate the propositional content from the force in the same way. We have data and operations, but the force is embedded in the operation (the function we call). We don't have a separate representation for the force apart from the function name and its implementation.

  - **Perlocutionary acts**: The effect on the hearer (like persuading) is beyond what we model. We model the update to the shared state (illocutionary) but not the subsequent effects (perlocutionary). We might model it as further state changes triggered by the hearer, but that is not direct.

  - **Intention-based accounts**: In programming, we model the rules (conventions) explicitly. But the Gricean intention-based account relies on the hearer inferring the speaker's intention. We don't have a mechanism for that unless we build a complex inference engine (like in AI). So in standard programming, we don't have that.

  ## Is the failure to translate a symptom of an impoverished framework on the programming side or a less precise concept in philosophy?

  - **Sincerity conditions**: This is a gap in the programming model because we don't model internal mental states. But that is by design: programming languages are about computation and state, not about subjective intentions. So the programming framework is not impoverished for its purpose, but it is limited for modeling human communication. The philosophical concept is precise, but it is about something that is inherently unobservable (intent) and therefore hard to encode.

  - **Uptake as understanding**: In programming, we can model acknowledgement of receipt (like a network ack) but not understanding. Again, understanding is a cognitive state. So we can only simulate it with observable behavior. The philosophical concept is precise (it requires that the hearer recognize the speaker's intended force) but we cannot directly represent mental states in code. This is a limitation of the programming model for modeling human communication.

  ## Specific Questions

  ### Is illocutionary force anything over and above a program's effect on state plus a type?
  In a conventionalist account, the force is determined by the rules (conventions). In programming, we can encode these rules in the function that updates the state (and the type of the function might indicate the kind of act). So if we have a function `promise(speaker, hearer, action)` that updates a shared state by adding a commitment, then the force is captured by the function's name and its implementation. The type of the function (e.g., `(Speaker, Hearer, Action) -> CommitmentUpdate`) captures the structure. So in this case, the force is nothing more than the function's effect and type.

  But note: in the intention-based account, the force comes from the speaker's intention and the hearer's recognition. Then we would need to model the intention and the recognition process. In that case, the force is not just the effect and type, but also the intention and the inference. So if we are to model the intention-based account, we need more: we need to represent the intention and the hearer's reasoning.

  In a programming language without explicit representation of intentions, we are effectively using the conventionalist model. So for a conventionalist, the mapping is exact. For an intention-based account, we have to stretch by representing intentions as data and having the hearer run an inference algorithm.

  ### Is uptake a genuine ingredient or merely a runtime condition?
  Uptake is a genuine ingredient in speech act theory: without it, the illocutionary act is not successful. In programming, if we model the speech act as a distributed transaction, then the acknowledgement (uptake) is necessary for the transaction to commit. So we cannot ignore it. However, in a non-distributed system, we don't have the same issue. But note: even in a single system, if the hearer is a separate module, we might require that the module processes the message. So we can model it as a required step.

  But the philosophical concept of uptake includes understanding, which we cannot guarantee in a program. We can only guarantee that the message was received and processed according to the rules. So the runtime condition (acknowledgement) is a necessary but not sufficient condition for philosophical uptake. Therefore, in the programming-language view, we can only model the observable part of uptake (the acknowledgement). The rest (understanding) is beyond the scope.

  ## Conclusion

  We can map speech act theory to programming concepts in a way that captures the conventionalist account quite well. The intention-based account and the mental aspects (sincerity, understanding) are harder to map and require simulating mental states with data and inference, which is beyond typical programming. The residue (what doesn't map) is due to the fact that programming languages are designed for manipulating state and performing computations, not for modeling human cognition and social conventions in their full depth. However, for many practical purposes (like designing protocols or multi-agent systems), the mapping is sufficient.

  Final mapping:
  - **Illocutionary act**: A function that updates a shared state (with the type of the function indicating the kind of act).
  - **Felicity conditions**: Preconditions (for propositional content and preparatory), a simulation of sincerity (if possible), and postconditions (for essential conditions). Infelicities are exceptions.
  - **Uptake**: The successful acknowledgement of the state change by the hearer's process (in a distributed system) or the successful update of the hearer's part of the state (in a centralized system).

  The mapping is best suited for conventionalist accounts and distributed systems.
answer: |-
  ### Systematic Restatement in Programming-Language Vocabulary

  #### **Illocutionary Act as a State-Change Operation**
  - **Mapping**: An illocutionary act (e.g., promising, commanding) is analogous to a **stateful function or method** that modifies a **shared, mutable context**. This function has:
    - **Side effects**: It alters the state of a shared context (e.g., a global store of commitments, obligations, or institutional facts).
    - **Type signature**: Its type encodes the act's "force" (e.g., `Promise : (Speaker, Hearer, Action) -> CommitmentUpdate`).
    - **Conventional rules**: The function's behavior is defined by **constitutive rules** (e.g., "calling `promise(speaker, hearer, action)` adds `speaker` to a set of debtors if felicity conditions hold").
  - **Exactness**: The mapping is exact for **conventionalist accounts** (e.g., Searle), where social rules define the act. It is less exact for **intention-based accounts**, as speaker intent isn't directly represented in the function's code—only inferred from context or parameters.
  - **Stretching**: 
    - Philosophy: Intention-based theories require modeling mental states (e.g., intent recognition), which aren't native to PLs.
    - PL Vocabulary: Functions are rule-driven, not inherently "intentional." We approximate intent via parameters (e.g., `isSincere : Bool`).

  #### **Felicity Conditions as Preconditions and Exception Cases**
  - **Mapping**: Felicity conditions are **preconditions** for stateful operations, categorized as:
    - **Propositional content conditions**: **Type well-formedness** (e.g., `action` must be of type `FutureAction`).
    - **Preparatory conditions**: **Preconditions** on shared state (e.g., "`hearersDesires(action)` must be true").
    - **Sincerity conditions**: **Runtime assertions or invariants** (e.g., "`speaker.intent == action` must hold"; fails if `!isSincere`).
    - **Essential conditions**: **Postconditions** defining the state change (e.g., "post-state includes `commitment(speaker, action)`").
  - **Exactness**: Preparatory/content conditions map directly to preconditions. Sincerity conditions are approximated via invariants or checks but lack true "mental state" representation.
  - **Infelicity as Exceptions**: When conditions fail, the operation throws **custom exceptions** (e.g., `PreparatoryConditionFailure`, `InsincerityException`).

  #### **Uptake as State Synchronization**
  - **Mapping**: Uptake (hearer recognition) is **state synchronization in a distributed system**:
    - **A successful act**: Requires the state change to be **visible/acknowledged** by the hearer's process.
    - **Mechanism**: Like a **transaction commit** or **message acknowledgment** (e.g., the hearer sends an `ACK` message; absence triggers rollback).
  - **Exactness**: Direct for distributed systems. Uptake failure maps to **network partition** or **process unresponsiveness**.
  - **Stretching**: 
    - Philosophy: Uptake involves "understanding," which is cognitive. PLs only model observable behavior (e.g., message receipt).
    - PL Vocabulary: Uptake is a runtime condition, not a language primitive—handled via concurrency control (e.g., two-phase commit).

  ---

  ### **Residue Report: What Fails to Translate**
  #### **1. Locutionary/Perlocutionary Distinction**
  - **Issue**: 
    - **Locutionary act** (propositional content) maps to function parameters/input types.
    - **Perlocutionary act** (effect on hearer, e.g., persuasion) has no direct counterpart. It's an **emergent effect**, not a controlled state change.
  - **Symptom**: 
    - PL frameworks model *direct* effects (illocutionary), not indirect/perlocutionary ones. This reflects a **pragmatic limitation in PLs** for modeling complex human behavior.

  #### **2. Speaker Intent and Recognition (Intention-Based Accounts)**
  - **Issue**: 
    - Intention-based acts (Grice) require **inferring mental states** (e.g., "Did the speaker *intend* a promise?"). 
    - PLs lack primitives for intent modeling—only **proxies** (e.g., `sincerityFlag : Bool`).
  - **Symptom**: 
    - **Impoverished PL framework** for cognitive aspects. PLs handle explicit rules (conventionalism) well but not probabilistic/contextual intent.

  #### **3. "Understanding" in Uptake**
  - **Issue**: 
    - Uptake requires the hearer to *recognize* intent. PLs reduce this to **message delivery** (e.g., TCP ack), not comprehension.
  - **Symptom**: 
    - **Philosophical imprecision**: "Understanding" is underspecified in speech-act theory. PLs expose this by forcing an operational definition (e.g., "ack received").

  #### **4. Infelicity Types (Misfire vs. Abuse)**
  - **Issue**: 
    - Austin distinguishes **misfires** (act void; e.g., wrong procedure) from **abuses** (act valid but insincere). 
    - PLs collapse both into **exceptions**, losing the distinction.
  - **Symptom**: 
    - **Philosophical nuance** not captured by PLs. Misfires map to `PreconditionFailure`; abuses to `InvariantViolation`.

  ---

  ### **Key Questions Answered**
  #### **Q1: Is illocutionary force more than state change + type?**
  - **Answer**: 
    - **In conventionalist terms**: No. Force is **encoded in the function's type and side effects** (e.g., `promise(...)` vs. `command(...)`). 
    - **In intention-based terms**: Yes. Force relies on **unmodeled intent** (residue #2). PLs reduce this to "function selection," ignoring cognitive aspects.

  #### **Q2: Is uptake a genuine ingredient or ignorable runtime condition?**
  - **Answer**: 
    - **Genuine in distributed systems**: Uptake is **critical for consistency** (e.g., without ACK, the act isn't "felicitous"). 
    - **Ignorable in local state**: Single-process programs assume immediate visibility (no explicit uptake needed). 
    - **Verdict**: Uptake is a **runtime condition** but cannot be ignored in **concurrent/multi-agent systems**—it ensures state coherence.

  ---

  ### **Conclusion**
  - **Faithful Mappings**: 
    - Illocutionary acts ≈ stateful functions; felicity conditions ≈ preconditions/exceptions; uptake ≈ distributed acknowledgments.
  - **Gaps**: 
    - **PL limitations**: Cannot model intent, perlocutionary effects, or nuanced infelicity without extensions (e.g., probabilistic types for intent).
    - **Philosophical imprecision**: "Understanding," "intent," and "sincerity" are under-constrained. PLs force operationalization, exposing vagueness.
  - **Final Verdict**: Speech-act theory enriches PL design (e.g., for multi-agent systems) but requires **extending PL semantics** to handle intent and perlocution. The residue highlights **complementary weaknesses**: PLs lack cognitive primitives; philosophy lacks operational rigor.
