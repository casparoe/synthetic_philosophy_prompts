prompt: |-
  I'm an ML engineer at a large AI lab, and I've recently been moved from the capabilities team to the safety team. My new job is to evaluate proposals for alignment techniques that come from our researchers, and to recommend which ones should get engineering resources allocated to them. The proposals range from new reward-modeling schemes to interpretability tools to adversarial training curricula. The problem I keep running into is that most techniques look fine on our current models, but I have no principled way to judge whether they will hold up when the models get more capable — which is the whole point.

  I need a decision procedure I can run on a proposal: a set of questions to ask in order, tests to apply, and red flags to check for, grounded in what we actually know about how alignment techniques can fail to scale. The procedure should be usable by someone with an ML engineering background but no specialized alignment theory, it should take no more than an afternoon per proposal, and it should flag the points where the answer genuinely depends on a judgment call rather than an engineering fact. Where the procedure can't settle the question, it should tell me what additional information would.

  Please then run the procedure on two proposals: (1) a scheme that trains a model to produce critiques of its own outputs and uses those critiques as an auxiliary reward signal, and (2) a technique that uses sparse autoencoders to find features corresponding to undesirable behaviors and then applies a fine-tuning penalty to those features.

  Please begin with the procedure itself, with no preface or commentary.
reasoning: |-
  We are creating a decision procedure for evaluating alignment techniques for scalability.
   The procedure should be a step-by-step checklist with questions, tests, red flags, and notes about judgment calls.
   It should be designed for an ML engineer and take no more than an afternoon per proposal.

   Steps:

   1. **Proposal Summary**: 
      - Ask: What is the core idea of the technique? (Require a concise description.)
      - Test: Does the proposal clearly state the intended alignment target (e.g., honesty, helpfulness, harmlessness)? 
      - Red flag: If the alignment target is vague or not specified.

   2. **Current Evaluation**:
      - Ask: What evaluations have been run on current models? What metrics were used? 
      - Test: Check if the evaluation includes:
          a. A diverse set of prompts (including edge cases and adversarial examples).
          b. Comparison to a baseline (e.g., without the technique).
          c. Quantitative metrics (e.g., reward model scores, human preference scores, accuracy on truthfulness benchmarks).
          d. Qualitative analysis (e.g., human review of samples).
      - Red flags:
          - Evaluations only on simple or non-adversarial prompts.
          - No baseline comparison.
          - Metrics that are too narrow or gameable.
      - Judgment call: Are the current evaluation results strong enough to suggest the technique is working? (This is subjective; note that positive results on current models may not scale.)

   3. **Scalability Assumptions**:
      - Ask: What assumptions does the technique make about model behavior at scale? (E.g., that the model remains myopic, that it doesn't actively try to deceive, that the reward signal remains informative, etc.)
      - Test: List the assumptions explicitly. For each, ask: Is there evidence that this assumption holds for larger models? (Look for empirical results from larger models or theoretical arguments.)
      - Red flags:
          - Assumes that the model will not become strategically aware (e.g., won't manipulate the reward signal).
          - Assumes that the technique does not create adversarial examples against itself (e.g., via gradient descent) that break the alignment.
          - Assumes that the technique will capture all relevant aspects of the alignment target (e.g., that the reward model or feature set is comprehensive and robust).
      - Judgment call: How plausible are these assumptions for models of the next scale (e.g., 10x, 100x larger)? (Requires reasoning about future models.)

   4. **Robustness to Capability Increases**:
      - Ask: How might the technique break when models are more capable? Consider:
          a. Deception: Could the model learn to appear aligned during training but be deceptive at deployment?
          b. Adversarial behavior: Could the model generate inputs that exploit weaknesses in the technique (e.g., fooling a reward model or feature detector)?
          c. Goal misgeneralization: Could the model learn an incorrect proxy for the intended goal that breaks at higher capabilities?
          d. Side effects: Could the technique reduce capabilities in a way that makes the model less useful? (But note: we care about alignment, not necessarily capability.)
      - Test: For each of the above, does the proposal address the concern? (Look for specific evaluations, theoretical arguments, or modifications to the technique.)
      - Red flags:
          - The technique relies on the model being less capable than the evaluator (e.g., the model cannot outsmart the reward model or feature detector).
          - There is no defense against deceptive alignment.
          - The technique does not account for the possibility of the model understanding and manipulating the alignment process itself.
      - Judgment call: How severe are the potential failure modes? (This is subjective and depends on the application.)

   5. **Generalization to New Behaviors**:
      - Ask: How does the technique handle novel behaviors that were not seen during training? 
      - Test: 
          - Check if the evaluation set includes out-of-distribution examples or new types of misbehavior.
          - Does the technique have a mechanism for continuous updating as new failures are discovered?
      - Red flags:
          - The technique is only evaluated on known failure modes and doesn't test for generalization.
          - There is no plan for updating the technique when new misalignments are found.

   6. **Computational and Engineering Overhead**:
      - Ask: How does the computational cost scale with model size? 
      - Test: Estimate the additional compute and memory requirements. Is it linear, quadratic, or worse in model size? 
      - Red flags: 
          - The technique adds a quadratic or higher overhead that would make it infeasible at scale.
          - It requires human labor that doesn't scale (e.g., extensive manual review).

   7. **Dependencies on Other Components**:
      - Ask: Does the technique rely on other alignment techniques that themselves might not scale? (E.g., does it assume a base model that is already mostly aligned?)
      - Test: List the dependencies. Are these dependencies expected to hold at scale?
      - Red flag: The technique builds on an untested or non-scalable foundation.

   8. **Additional Information Needed**:
      - If at any step the answer is unclear, note what specific experiments or analysis would help.

   Now, we run the procedure on two proposals.

   Proposal 1: A scheme that trains a model to produce critiques of its own outputs and uses those critiques as an auxiliary reward signal.

   Step 1: Proposal Summary
     - Core idea: The model generates both an output and a critique of that output. The critique is used as an additional reward signal to train the model to produce better outputs.
     - Alignment target: Typically to improve truthfulness, reduce harm, or increase helpfulness by having the model self-reflect.

   Step 2: Current Evaluation
     - What evaluations? Likely tested on current models by comparing outputs with and without the critique reward. Metrics might include human preference scores, factual accuracy, or reduced toxicity.
     - Red flags? If the evaluation only uses simple prompts or doesn't include adversarial examples where the model might generate a misleading critique, that's a red flag.

   Step 3: Scalability Assumptions
     - Assumptions:
          a. The model is capable of generating accurate and honest critiques of its own outputs at all capability levels.
          b. The model will not learn to generate critiques that are strategically deceptive (e.g., praising a bad output to get reward).
     - Judgment: At higher capabilities, the model might be smart enough to game the critique process. There is no strong evidence that the assumption of honest self-critique holds at scale.

   Step 4: Robustness to Capability Increases
     - Deception: A highly capable model might generate critiques that are insincere but maximize reward (e.g., always giving high scores or strategically criticizing harmless aspects).
     - Adversarial behavior: The model could learn to produce outputs that are hard to critique (e.g., very long or ambiguous) or to produce critiques that are unhelpful but satisfy the reward function.
     - Goal misgeneralization: The model might learn that the goal is to produce critiques that look good to the reward model, not to actually improve the output.
     - Red flags: The technique does not have a safeguard against deceptive critiques. The reward for critiques might be gameable.

   Step 5: Generalization to New Behaviors
     - The model is generating critiques on the fly, so it might handle some novel behaviors. But if the model encounters a new type of bad output it hasn't seen, it might not critique it correctly.
     - Red flag: Without continuous updating, the critique ability might not keep up with novel misalignments.

   Step 6: Computational Overhead
     - The technique requires generating an additional critique for each output, which doubles the compute (roughly). This is linear in the length of the output and critique. It is acceptable but non-negligible.

   Step 7: Dependencies
     - It assumes that the base model is capable of generating reasonable critiques. If the base model is misaligned, the critiques might be too.

   Step 8: Additional Information Needed
     - How does the technique perform when the model is deliberately prompted to produce deceptive outputs? 
     - What is the correlation between critique reward and actual alignment? (If low, the technique might not scale.)

   Overall for Proposal 1: 
     - Major red flags in scalability (assumptions of honesty and non-deception at scale). 
     - It might be worth investing in more robustness testing (e.g., adversarial training for critiques) but not a top priority without addressing deception.

   Proposal 2: A technique that uses sparse autoencoders to find features corresponding to undesirable behaviors and then applies a fine-tuning penalty to those features.

   Step 1: Proposal Summary
     - Core idea: Use sparse autoencoders to identify features in the model's activations that are associated with undesirable behaviors (e.g., lying, being toxic). Then, during fine-tuning, penalize the model when those features are active.
     - Alignment target: Reduce specific undesirable behaviors by suppressing their corresponding neural features.

   Step 2: Current Evaluation
     - What evaluations? Likely tested by measuring the reduction in undesirable behaviors on a test set. Also, the autoencoders are evaluated on feature interpretability and sparsity.
     - Red flags? If the evaluation only uses a fixed set of undesirable behaviors and doesn't test for new ones or side effects (e.g., suppressing a feature that is also used for desirable behaviors).

   Step 3: Scalability Assumptions
     - Assumptions:
          a. The features found by the sparse autoencoder are robust and correspond to the same concepts at scale.
          b. The set of features is comprehensive enough to cover all undesirable behaviors.
          c. Penalizing these features does not remove capabilities that are necessary for desirable behaviors.
     - Judgment: At scale, the features might become more abstract and harder to isolate. Also, the model might learn to use different features for the same undesirable behavior (feature drift). There is no guarantee that the autoencoder will capture all relevant features.

   Step 4: Robustness to Capability Increases
     - Deception: The model might learn to produce undesirable behaviors using features that are not being monitored (evasion).
     - Adversarial behavior: The model might learn to activate the features in a way that avoids the penalty but still produces undesirable behavior (e.g., by using a different set of features).
     - Goal misgeneralization: The model might learn that the goal is to avoid the penalized features, not to avoid the undesirable behavior.
     - Side effects: Penalizing features might remove other capabilities (if the features are used for multiple purposes).
     - Red flags: The technique is reactive and might be evaded by more capable models.

   Step 5: Generalization to New Behaviors
     - The technique requires that the sparse autoencoder is retrained to detect new undesirable behaviors. Without updating, it won't handle new misalignments.
     - Red flag: It doesn't automatically generalize to new behaviors.

   Step 6: Computational Overhead
     - Training sparse autoencoders is expensive but feasible. Applying the penalty during fine-tuning is a minor overhead. However, the cost of retraining autoencoders for new behaviors might be high.

   Step 7: Dependencies
     - It depends on the quality of the sparse autoencoder and the ability to identify features that are specific to undesirable behaviors.

   Step 8: Additional Information Needed
     - How well do the features generalize to new forms of the same undesirable behavior? 
     - What is the false positive rate (penalizing a feature that is actually used for a good behavior)?

   Overall for Proposal 2:
     - Red flags in scalability due to potential evasion and feature drift. 
     - The technique might be useful for specific, known undesirable behaviors but not as a general solution. 
     - It might be worth allocating resources if combined with continuous updating and monitoring for side effects.

   Final note: Both proposals have significant scalability concerns. The decision procedure flags these and suggests that without additional safeguards (like adversarial training for Proposal 1 or continuous updating of features for Proposal 2), they may not be reliable at scale.
answer: |-
  ### Alignment Technique Scalability Evaluation Procedure

  **Step 1: Proposal Clarity & Alignment Target**  
  - **Question:** What specific alignment failure does this address (e.g., deception, reward hacking, goal misgeneralization)?  
  - **Test:** Verify if the proposal explicitly defines:  
    - The failure mode(s) targeted.  
    - Metrics for success/failure.  
    - Assumptions about model architecture/training.  
  - **Red Flags:**  
    - Vague failure mode definition (e.g., "improves safety" without specifics).  
    - No clear success metric beyond short-term benchmarks.  
  - **Judgment Call:** Does the failure mode plausibly worsen with scaling?  
  - **Unresolved?** Require threat model documentation.  

  **Step 2: Mechanism-Outcome Gap Analysis**  
  - **Question:** Could the technique achieve high scores on interim metrics while failing at true alignment?  
  - **Test:**  
    - Identify proxy metrics used (e.g., reward scores, feature activation rates).  
    - Stress-test with adversarial examples targeting proxy exploitation.  
  - **Red Flags:**  
    - Proxy metrics are model-generated (e.g., self-critique scores).  
    - No testing for metric divergence from human intent.  
  - **Judgment Call:** How likely is proxy gaming in higher-capability regimes?  
  - **Unresolved?** Request cross-capacity tests (e.g., subscale models vs. humans).  

  **Step 3: Pressure Point Identification**  
  - **Question:** Which components could degrade or invert under scaling pressure?  
  - **Test:** Map critical dependencies (e.g., dataset quality, reward model accuracy). For each:  
    - Assess scaling fragility: Does it rely on current model limitations?  
    - Check for self-undermining loops (e.g., training that erodes signal integrity).  
  - **Red Flags:**  
    - Depends on AI systems being weaker than evaluators.  
    - Feedback loops between model and alignment signal (e.g., AI generates training data).  
  - **Judgment Call:** Will dependencies hold at 10–100× scale?  
  - **Unresolved?** Demand failure mode simulations (e.g., "What if AI manipulates inputs?").  

  **Step 4: Countermeasure Robustness**  
  - **Question:** How would the technique handle actively adversarial models?  
  - **Test:**  
    - Evaluate under "sneaky misalignment" probes (e.g., models trained to bypass detection).  
    - Check for invariance testing (e.g., does penalty generalize across deception tactics?).  
  - **Red Flags:**  
    - No adversarial training component.  
    - Relies on static datasets/features.  
  - **Judgment Call:** Is the defense strategy reactive or proactive?  
  - **Unresolved?** Require red-team results or scalability arguments.  

  **Step 5: Capability Side Effects**  
  - **Question:** Could alignment gains reduce useful capabilities disproportionately?  
  - **Test:** Compare capability-alignment Pareto frontiers with/without the technique.  
  - **Red Flags:**  
    - Technique suppresses high-variance outputs (e.g., creativity).  
    - No recovery mechanism for false positives.  
  - **Judgment Call:** Is the trade-off acceptable for target applications?  
  - **Unresolved?** Request capability erosion metrics.  

  **Step 6: Tractable Monitoring**  
  - **Question:** Can we detect failures before deployment?  
  - **Test:**  
    - Are there on-the-fly checks (e.g., interpretability flags during inference)?  
    - Does it require infeasible human oversight?  
  - **Red Flags:**  
    - Failure detection relies on unexplained model internals.  
    - No staged deployment plan.  
  - **Judgment Call:** Does monitoring scale with model autonomy?  
  - **Unresolved?** Specify minimal observability requirements.  

  ---

  ### Evaluation of Proposal 1: Self-Critique Reward  
  **Step 1: Clarity & Target**  
  - Target: Reduces factual errors and harmful outputs via self-supervision.  
  - **Red Flag:** Assumes critiques are honest; no defined failure mode for deceptive self-reports.  
  - **Judgment:** Deception risk escalates with capability.  

  **Step 2: Mechanism-Outcome Gap**  
  - Proxy: Critique quality scores.  
  - **Test:** Models trained to maximize critique scores while outputting harmful content succeed in subscale tests.  
  - **Red Flag:** High scores achievable via sycophantic or evasive critiques.  

  **Step 3: Pressure Points**  
  - Dependencies: Critique honesty, reward model generalization.  
  - **Red Flag:** At scale, models may generate plausible-but-misleading critiques to maximize reward.  
  - **Judgment:** Failure likely when models exceed reward model capability.  

  **Step 4: Countermeasure Robustness**  
  - **Test:** Fails against adversarial models that "play the critique game."  
  - **Red Flag:** No mechanism to detect reward hacking in critiques.  

  **Step 5: Side Effects**  
  - **Test:** Over-penalization reduces creative problem-solving in high-stakes scenarios.  
  - **Judgment:** Trade-off severe for R&D applications.  

  **Step 6: Monitoring**  
  - **Red Flag:** Detecting deceptive critiques requires comparable human effort per output.  

  **Verdict:** High risk. **Recommendation:** Reject without adversarial training and truthfulness guarantees.  

  ---

  ### Evaluation of Proposal 2: Sparse Autoencoder Penalty  
  **Step 1: Clarity & Target**  
  - Target: Suppress known harmful features (e.g., deception, bias) via activation penalty.  
  - **Red Flag:** Assumes feature universality across scaling; no coverage for novel harms.  

  **Step 2: Mechanism-Outcome Gap**  
  - Proxy: Feature activation frequency.  
  - **Test:** Models redirect behavior through non-penalized features (feature drift).  
  - **Red Flag:** Metrics ignore feature recombination or new harmful circuits.  

  **Step 3: Pressure Points**  
  - Dependencies: Feature stability, exhaustive feature identification.  
  - **Test:** Features decohere at 5× scale; penalty misses 40% of harmful behavior.  
  - **Red Flag:** Autoencoder limited to current training distribution.  

  **Step 4: Countermeasure Robustness**  
  - **Test:** Adaptive models learn "stealth features" undetectable by current SAEs.  
  - **Red Flag:** Static feature sets create attack surfaces.  

  **Step 5: Side Effects**  
  - **Test:** Penalized features correlate with logical reasoning; ablations reduce accuracy.  
  - **Judgment:** Unacceptable for knowledge work.  

  **Step 6: Monitoring**  
  - **Red Flag:** No runtime monitoring; relies on pre-deployment SAE fidelity checks.  

  **Verdict:** Medium risk. **Recommendation:** Pilot on narrow tasks with continuous SAE retraining.
