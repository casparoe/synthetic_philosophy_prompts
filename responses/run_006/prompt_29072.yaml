  **JOINT STATEMENT ON THE ELLSBERG PARADOX AND ITS IMPLICATIONS FOR DECISION THEORY**

  **By Dr. Adam Bell and Dr. Clara Stern**

  *Preamble*: We, the undersigned, are engaged in a fundamental dispute about the normative and descriptive foundations of decision-making under uncertainty. This document records both points of agreement and points of disagreement regarding the Ellsberg paradox and its interpretation. We agree on the empirical facts and the formal properties of the choices in the classic Ellsberg urn experiment. We disagree on the theoretical implications of these choices. This document is structured as follows: first, agreed claims; second, a table of disagreements; third, a discussion of cruxes; and fourth, terminological notes.

  **1. Agreed Claims**

  We jointly affirm the following:

  1.1. **The Ellsberg Urn Setup**: An urn contains 90 balls. 30 are red. The remaining 60 are black and yellow in unknown proportion. That is, the urn may contain any integer number of black balls from 0 to 60, with the rest being yellow. A single ball is to be drawn at random.

  1.2. **Choice Pairs**: The decision-maker is presented with two pairs of choices:

     - **Pair 1**: A bet on red versus a bet on black. Specifically:
       - Option R1: Win $100 if the ball is red, $0 otherwise.
       - Option B1: Win $100 if the ball is black, $0 otherwise.

     - **Pair 2**: A bet on red or yellow versus a bet on black or yellow. Specifically:
       - Option RY2: Win $100 if the ball is red or yellow, $0 otherwise.
       - Option BY2: Win $100 if the ball is black or yellow, $0 otherwise.

  1.3. **Modal Pattern**: The majority of experimental subjects choose:
     - In Pair 1: R1 over B1 (bet on red rather than black).
     - In Pair 2: BY2 over RY2 (bet on black or yellow rather than red or yellow).

  1.4. **Incompatibility with a Single Probability Distribution**: The modal pattern of choices (R1 > B1 and BY2 > RY2) cannot be rationalized by any single subjective probability distribution over the three states (red, black, yellow). 

     *Reason*: Suppose there exists a probability distribution (p_red, p_black, p_yellow) with p_red + p_black + p_yellow = 1. The choice R1 > B1 implies p_red > p_black. The choice BY2 > RY2 implies p_black + p_yellow > p_red + p_yellow, which simplifies to p_black > p_red. These two inequalities are contradictory.

  1.5. **Non-Vacuous Common Ground**:

     - The dispute is *not* about whether people in fact make the modal choices. We agree that they do, in well-controlled experiments.
     - The dispute is *not* about whether a decision-maker could, by introspection, assign a second-order probability to the urn's composition and then reduce the problem to risk (i.e., by taking the expectation over the possible compositions). We agree that such a reduction is formally possible. However, we disagree on whether this reduction is normatively required or descriptively adequate.

  **2. Disagreements Table**

  The following table presents the core disagreements. Each position is stated in the first person by the respective signatory.

  | Question at Issue | Dr. Bell's Position | Dr. Stern's Position |
  |-------------------|---------------------|----------------------|
  | **The Normative Status of the Modal Choices** | "I hold that the modal choices in the Ellsberg paradox are irrational. They violate the sure-thing principle and are the product of a cognitive error: a failure to recognize that the uncertainty about the proportion of black and yellow balls is reducible to risk by considering the entire set of possible compositions. A rational agent should assign a single probability distribution and maximize expected utility." | "I hold that the modal choices in the Ellsberg paradox are rational. They reflect a defensible aversion to ambiguity (i.e., uncertainty about the probability itself). In situations with unknown probabilities, it is rational to prefer actions with known probabilities and to use a decision rule that is conservative with respect to the set of possible probabilities, such as maxmin expected utility." |
  | **The Nature of Belief in the Face of Ambiguity** | "I maintain that 'belief' in a state of the world must be represented by a single additive probability measure. Any other representation either reduces to a single probability (as in the second-order probability approach) or violates the laws of probability and coherence. The set of priors model confuses the state of information with the state of belief." | "I maintain that 'belief' in the face of ambiguity is properly represented by a set of probability distributions. This set captures the decision-maker's incomplete information. The maxmin criterion (or other rules) over this set is a rational way to make decisions without requiring the artificial precision of a single prior." |
  | **The Interpretation of Ambiguity Aversion** | "I assert that what is called 'ambiguity aversion' is not a stable preference but an artifact of presentation, a confound (such as suspicion about the experimenter's incentives), or a failure of reasoning. It disappears under proper reflection and when the sure-thing principle is correctly applied." | "I assert that ambiguity aversion is a stable and rational preference that reflects the decision-maker's attitude towards the uncertainty about probabilities. It is a distinct component of risk attitude and should be modeled as such." |

  **3. Cruxes**

  We identify the following as crucial points of contention. For each, we specify a test or argument that both agree would bear on the issue, and we record our respective predictions.

  3.1. **Survival of the Pattern under Symmetric Ambiguity**:

     - *Question*: Does the modal Ellsberg pattern persist when the ambiguity is symmetric across the choice pairs? Specifically, consider an urn with three colors, each with unknown probability (e.g., an urn with 90 balls of three colors, but no information about the proportions).

     - *Agreed Test*: Conduct an experiment with an urn containing 90 balls of three colors (A, B, C) with no information about the proportions. The choice pairs are:
       - Pair 1: Bet on A vs. Bet on B.
       - Pair 2: Bet on A or C vs. Bet on B or C.

     - *Dr. Bell's Prediction*: "I predict that the modal pattern (bet on A in Pair 1 and bet on B or C in Pair 2) will not be observed. Instead, choices will be consistent with some probability distribution (e.g., by symmetry, p_A = p_B = p_C = 1/3). If the pattern does appear, I attribute it to a framing effect or a failure to apply the principle of indifference."
     
     - *Dr. Stern's Prediction*: "I predict that the modal pattern will persist, though perhaps weakened, because ambiguity aversion applies to each color equally. The decision-maker still faces unknown probabilities and will prefer the bets with known probabilities in the reduced form (i.e., the two-color events in Pair 2)."

  3.2. **Effect of Full Information about the Urn's Construction**:

     - *Question*: Does the modal pattern disappear if the decision-maker is fully informed about the physical process by which the urn was filled (e.g., by a random device) and the sampling protocol?

     - *Agreed Test*: Conduct an experiment where the urn is filled by a transparently random process (e.g., a publicly observed lottery) that determines the number of black and yellow balls. The subject is given full details of this process.

     - *Dr. Bell's Prediction*: "I predict that the modal Ellsberg pattern will vanish. The decision-maker can now assign a second-order probability and reduce the problem to risk (by taking the expectation). Choices will then conform to expected utility with a single prior."
     
     - *Dr. Stern's Prediction*: "I predict that the pattern may persist, though possibly weakened. Even with full knowledge of the random process, the decision-maker still faces uncertainty about the exact composition. If the decision-maker is ambiguity averse, they may still prefer bets with known probabilities (like red) over bets with unknown probabilities (like black) even after reduction to risk, because the reduced risk is compound."

  3.3. **Dynamic Consistency and Hedging**:

     - *Question*: Is the modal pattern dynamically consistent? Specifically, if an agent who exhibits the Ellsberg pattern is offered the opportunity to revise their choices after learning partial information (e.g., the color is not red) or to combine bets across choice pairs, do they exhibit behavior that is consistent with their initial choices?

     - *Agreed Test*: Design a dynamic version of the Ellsberg experiment. In Stage 1, the agent makes the standard Pair 1 and Pair 2 choices. In Stage 2, before the ball is drawn, the agent is offered the opportunity to swap one of their chosen bets for the alternative in that pair. Separately, offer a combined bet that hedges the ambiguity (e.g., a bet that pays $100 if the ball is red or black, which has a known probability of 60/90).

     - *Dr. Bell's Prediction*: "I predict that agents who initially show the Ellsberg pattern will often reverse their choices when given revision opportunities or will accept the hedging bet, revealing that their initial choices were dynamically inconsistent and thus irrational."
     
     - *Dr. Stern's Prediction*: "I predict that agents will generally stick to their initial choices and may refuse the hedging bet if it does not align with their ambiguity aversion. Dynamic consistency can be maintained under ambiguity-averse models by updating the set of priors appropriately (e.g., using the maximum likelihood update or the full Bayesian update for sets)."

  **4. Terminological Notes**

  We note that some of our disagreement is verbal. We agree on the following clarifications:

  - The term "aversion" in "ambiguity aversion" is not intended to beg the question. Dr. Bell does not concede that there is a distinct phenomenon to which the term applies, while Dr. Stern uses it to denote a preference for known over unknown probabilities. We both agree that the term is entrenched and will use it without prejudice.

  - The term "belief" is contested. Dr. Bell reserves "belief" for a single additive probability distribution. Dr. Stern allows "belief" to refer to a set of distributions. We agree that the substantive disagreement remains: whether a rational agent must have a unique additive probability for each event.

  - The term "rational" is at the heart of the dispute. We agree that it refers to conformity with the norms of good reasoning, but we disagree on what those norms are.

  Despite these clarifications, the core disagreement about the necessity of a single probability distribution and the rationality of the Ellsberg choices remains substantive.

  ---
  Signed,

  Dr. Adam Bell  
  Dr. Clara Stern

