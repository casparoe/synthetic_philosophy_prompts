  For the exam, I want one essay question on the dogmatism paradox that forces students to do more than recite the closure principle and the red-table example. I want them to show they understand why the paradox is a real problem and not just a sloppy bit of reasoning. The question should make them engage with at least one serious attempt to resolve it — denying single-premise closure, going externalist, biting the bullet and saying we do know the denial of sceptical alternatives a priori, whatever.

  Please write the question, a model answer of about 700 words, and a marking scheme that separates a First (70+) from a 2:1 (60–69) by naming the specific moves each must contain.
