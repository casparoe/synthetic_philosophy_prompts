       2. (Objection 6) Frequentist: calibration -> likelihood: high, damage: high -> threat: high
       3. (Objection 2) Propensity theorist: unexplained agent -> likelihood: medium (only one person, but he will ask) but damage: high -> threat: high (but less likely? but we'll put it after the two high-likelihood high-damage ones? Actually, the first two are more likely because there are more frequentists. So we put the propensity one at 3? But note: the propensity theorist is a senior faculty, so his objection might be very damaging. We'll put:
          Order:
            1. Frequentist: coverage (likelihood: high, damage: high)
            2. Frequentist: calibration (likelihood: high, damage: high) -> but note: calibration is also about the long-run, so very important.
            3. Propensity theorist: unexplained agent (likelihood: medium, but damage: high) -> threat: high
            4. Frequentist: quantum/coin (likelihood: high, damage: medium) -> threat: medium-high
            5. Philosopher: dogmatic priors (likelihood: medium, damage: high) -> threat: medium-high
            6. Frequentist: arbitrary priors in applied work (likelihood: high, damage: medium) -> threat: medium
            7. Frequentist: clinical trials for populations (likelihood: high, damage: medium) -> threat: medium
            8. Philosopher: Dutch book alternatives (likelihood: low, damage: medium) -> threat: low

     But we need 7 to 9. We can do 8.

     Alternatively, we can combine or adjust. We'll stick to 8.

     Now, let's write the objections in that order.

   Summary of Q&A strategy:
     We'll hold the line that subjectivism provides a coherent foundation for probability that addresses the shortcomings of frequentism and propensity views, and that it can recover objectivity through convergence and constraints. In Q&A, we must emphasize that subjectivism does not abandon scientific rigor: it uses the same models and data, but interprets probability as rational belief. We'll concede that subjectivism requires careful handling of priors and that it doesn't guarantee short-run calibration, but hold that it is the only interpretation that works for single-case and that it can reproduce frequentist results in the long run.

   The one reply that must land: the reply to the coverage/error rates objection (objection 1) because if the audience leaves thinking that subjectivism undermines the reliability of scientific inference, the talk fails.

   The question I hope nobody asks: maybe one that challenges the very idea of an ideally rational agent in a way that we haven't explained, or one that points out a case where convergence fails and we have no way to choose between priors.

   Let's design:

     question_i_hope_nobody_asks: "If two rational agents with different priors see the same infinite sequence of data and assign probability 1 to two different limiting frequencies, doesn't that mean that convergence fails and that there is no objective basis for scientific knowledge?"

     Why dangerous: Because it directly challenges the convergence argument and the claim that priors wash out. The best response is to note that such agents would have to have priors that are dogmatic (assign zero probability to the true hypothesis) and that rationality requires not being dogmatic (via regularity). But this is a weak point because the requirement of regularity is not enforced by the probability axioms.

     Alternatively, we can say: "In practice, we use non-dogmatic priors and with enough data they converge. But the point of science is to use evidence to update, and if an agent is dogmatic, they are not being rational. However, the definition of rationality does not explicitly rule out dogmatism, which is a known issue."

