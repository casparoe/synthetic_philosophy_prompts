   We'll structure 7 objections, ordered by threat.

   Let's consider the audience and the thesis:

   Thesis: 
     Probability = degrees of belief of an ideally rational agent; no mind-independent chances for single-case.

   Claims defended:
     1. Single-case probabilities can't be frequencies (reference class problem) or propensities (unexplained values).
     2. Dutch book and accuracy-dominance arguments show rational credences must obey probability axioms.
     3. Objectivity via constraints on priors and convergence theorems.

   Audience:
     - Applied statisticians (frequentists): care about coverage, error rates, calibration, reproducibility.
     - Philosophers of science: may be more open to subjectivist view but critical of foundations.
     - One propensity theorist: defends single-case propensities.

   Potential objections:

   1. Frequentist: "In practice, we need error rates and coverage for reproducible science. How can your subjective credences, which vary by agent, ensure that a 95% credible interval has 95% coverage in repeated experiments? Without this, how can we trust scientific results?"

   2. Propensity theorist: "You dismiss propensities as unexplained, but your 'ideally rational agent' is just as unexplained. And propensities are grounded in physical symmetries and dispositions, which are real features of the world. How is your agent any less mysterious?"

   3. Frequentist: "But we use probability in settings where there is no rational agent, like quantum mechanics or coin flips. Are you saying that the probability of a fair coin landing heads isn't 0.5 until someone forms a belief about it?"

   4. Philosopher: "If two rational agents have different priors, they may never agree even with infinite data if their priors are dogmatic. How is this any better than the reference class problem? And doesn't this undermine the convergence you mention?"

   5. Frequentist: "Subjectivity seems to open the door to arbitrary priors. In applied work, we often have little prior information. How can we justify a prior without data, and how do we avoid introducing bias?"

   6. Frequentist: "Calibration is important. We know that if a weather forecaster says 30% chance of rain, it should rain about 30% of the time. How does your account ensure that the credences of an agent are calibrated to the actual frequencies?"

   7. Philosopher: "The Dutch book argument assumes that avoiding sure loss is the only criterion for rationality. But there are other decision theories (e.g., risk-sensitive ones) that don't require probabilities. Why should we accept that?"

   8. (If we need 8) Frequentist: "In clinical trials, we need to know the long-run frequency of a drug working to make a decision for a population. How does your single-case credence help with that?"

   9. (If we need 9) Philosopher: "Your convergence results require the true hypothesis to be in the prior support. But if the prior is zero on the true hypothesis, convergence fails. How can we set priors to avoid this?"

   We'll choose 7 to 9. Let's do 8.

   Ordering by threat: 
     Threat = likelihood and damage. We have mostly frequentists, so frequentist objections are more likely.

     High likelihood, high damage: 
        Objection 1: frequentist on coverage and error rates -> very likely and damaging because it challenges the practical utility.

