prompt: |-
  I lead the model-assessment unit at a public-health agency. Every quarter we choose which of several epidemiological models will underpin planning for vaccination, hospital surge capacity, and travel restrictions, so the choice determines how many ICU beds are planned for, how vaccines are allocated, and whether borders close. None of the candidate models is true: each simplifies transmission, idealizes contact structure, or omits variables we know matter. We nonetheless need to say which is closest to the truth, because the decisions are made downstream of that choice. Our current method is a mix of fit to recent data, institutional pedigree, and the director's instinct, and I want to replace it with something defensible.

  I am aware that philosophers of science have worked on this problem under the name of verisimilitude, or truthlikeness. The obvious proposal — that one false theory is closer to the truth than another when it entails more true statements and fewer false ones — was, as I understand it, shown to collapse for false theories, and later work has tried to build closeness-to-truth out of similarity to the complete true description of the world, with a standing worry about whether such comparisons are stable when the world is redescribed in a different vocabulary. I do not know how to turn any of that into a procedure my unit can run.

  Please write the decision procedure as something we can reuse each quarter. It should be a sequence of questions we ask about each candidate model, in order, with an account of what counts as a sufficient answer to each; it should say where the procedure stops with a no and where it hands the decision to a person because the question is one of values rather than facts. It must be usable in a week by modelers with no philosophical training, and our director will sign off only if the procedure marks clearly which steps are factual, which are conventional, and which are judgment. Then run the procedure on three cases: (1) an influenza model that adds realistic age structure but assumes homogeneous mixing within age groups, against a model without age structure that captures contact heterogeneity better; (2) a model that fits the most recent twelve months of data best but is known to misrepresent the biological mechanism of waning immunity; and (3) a deliberately simple SIR-style model that is false in its assumptions but keeps producing forecasts as good as the others. Include at least one case where the procedure returns a ranking the unit will not like, and close by saying explicitly what the procedure cannot tell us about closeness to the truth.
reasoning: |-
  We are designing a decision procedure for model assessment that balances the need for a defensible method with practical constraints. The procedure must be usable in a week by modelers without philosophical training and clearly mark steps as factual, conventional, or judgment-based.

  The procedure will be structured as a sequence of questions for each candidate model. We will consider multiple dimensions and aggregate the results. We aim to avoid the philosophical pitfalls of verisimilitude by focusing on measurable and operational criteria that are relevant to the decisions we support (vaccination, hospital capacity, travel).

  The procedure:

  1. **Preparatory Step**: Define the key outcomes of interest (e.g., ICU admissions, cases, deaths) and the time horizon for the decisions (e.g., next 3 months). Also, define the spatial and demographic scope (e.g., national, by age group). This step is conventional (we set the scope based on planning needs).

  2. **Step 1: Fit to Recent and Historical Data (Factual)**
     - **Question**: How well does the model fit the available data for the key outcomes over the past 12 months? (We choose 12 months to balance recency and having enough data, but this can be adjusted conventionally.)
     - **Assessment**: Use statistical measures (e.g., RMSE, MAE, interval coverage) for each outcome. Also, consider the model's ability to capture trends and turning points. We require at least two different measures to avoid over-reliance on one.
     - **Sufficiency**: The model must have been run on the same data set (with the same data preprocessing). We compare the metrics across models. If one model is clearly better (e.g., significantly better on at least two measures and not worse on any), then it passes. If not, we note the tie and move to the next step.

  3. **Step 2: Out-of-Sample and Out-of-Distribution Validation (Factual)**
     - **Question**: How well does the model predict outcomes for periods or populations not used in fitting?
     - **Assessment**: Use cross-validation (time-series or spatial) or hold-out data. Also, consider stress tests: e.g., what if a new variant emerges? We look at predictive performance on a held-out period (e.g., the last 3 months of data) or on data from a different region (if available). We also consider known past events (e.g., past waves) that the model wasn't calibrated on.
     - **Sufficiency**: The model must have been subjected to the same validation exercises. We compare performance. Again, if one model is clearly better, it passes. If not, we note the tie.

  4. **Step 3: Theoretical Plausibility and Mechanism (Judgment)**
     - **Question**: How well does the model represent known biological and social mechanisms? Are the assumptions consistent with current scientific understanding?
     - **Assessment**: We break this down:
       - *Biological plausibility*: e.g., does the model incorporate known pathways of transmission, immunity, etc.?
       - *Social/behavioral plausibility*: e.g., does it capture relevant contact patterns, interventions?
       - *Known limitations*: Are there known factors that are omitted but critical? How severe is the omission?
     - **Sufficiency**: We use a structured expert judgment. The assessment team (with domain experts) assigns scores (e.g., 1-5) for each aspect. We set thresholds (conventionally) for what counts as acceptable (e.g., average score >=3). If a model falls below, it fails. Otherwise, we note the scores and move to the next step.

  5. **Step 4: Robustness and Sensitivity (Judgment with Factual Elements)**
     - **Question**: How sensitive are the model's predictions to changes in assumptions or parameters? How robust is it to uncertainties?
     - **Assessment**: We require each model to have undergone sensitivity analyses (e.g., varying key parameters within plausible ranges). We look at the range of outcomes (e.g., the width of prediction intervals) and the stability of the conclusions. Also, we check for specific known weaknesses (e.g., if a model assumes homogeneous mixing, how does it perform when we force heterogeneity?).
     - **Sufficiency**: We compare the models on the basis of the magnitude of sensitivity (e.g., the coefficient of variation of key outputs) and the robustness of the qualitative conclusions. If one model is clearly less sensitive and more robust, it passes. If not, we note the tie.

  6. **Step 5: Decision-Relevant Performance (Judgment with Factual Elements)**
     - **Question**: How well does the model perform on the specific decisions we are supporting? (e.g., does it accurately forecast the outcomes that drive ICU planning or vaccine allocation?)
     - **Assessment**: We simulate the decision process for past periods (if possible) and see what decision would have been made and how it would have turned out. Alternatively, we compare the model's predictions for the key decision variables (e.g., peak ICU demand) to what actually happened. We also consider the model's ability to provide the required outputs (e.g., by age group for vaccine allocation).
     - **Sufficiency**: We require that the model provides the necessary outputs. We then compare the accuracy of these specific outputs. If one model is clearly better for the decisions at hand, it passes.

  7. **Step 6: Aggregation and Tie-Breaking (Conventional and Judgment)**
     - If one model has passed all steps without a tie and without failing, it is chosen.
     - If there are ties or mixed results, we create a scorecard (with weights set conventionally for each step) and compute an overall score. The weights are set by the agency in advance (e.g., Step 1 and 2 might be weighted more heavily than Step 3). The model with the highest overall score is chosen.
     - If there is still a tie, we break it by:
       - The model that is more parsimonious (simpler) is preferred (Occam's razor).
       - If still tied, the model that has been more reliable in past quarters (if available) is chosen.
       - If still tied, the decision is handed to the director (with a summary of the strengths and weaknesses of each).

  The procedure marks:
  - Factual: Steps 1 and 2 (based on data and calculations).
  - Conventional: The choice of time periods, scope, and the weights in Step 6.
  - Judgment: Steps 3, 4, and 5 (relying on expert assessment), and the tie-breaking by parsimony.

  Now, we run the procedure on the three cases:

  **Case 1: Influenza models**
  - Model A: Adds realistic age structure but assumes homogeneous mixing within age groups.
  - Model B: No age structure but captures contact heterogeneity better.

  - Step 1: Compare fit to recent data (e.g., age-stratified case data). Model A might fit age-specific data better, while Model B might fit overall data better. If age-specific outcomes are key (e.g., for vaccine allocation by age), we would focus on those. If Model A fits age-specific data better and that is a key outcome, it wins Step 1. Otherwise, tie.
  - Step 2: Out-of-sample validation. We might hold out a recent wave. Model B might do better in predicting overall cases if the heterogeneity is critical. If Model B wins, then Step 2 goes to Model B. Otherwise, tie.
  - Step 3: Theoretical plausibility. Age structure is known to be important, but so is contact heterogeneity. Both are plausible but incomplete. We might score both as 3 (adequate). Tie.
  - Step 4: Robustness. We might test by perturbing the mixing assumptions. Model A might be sensitive to within-group heterogeneity (which it ignores). Model B might be sensitive to not having age structure. We judge which is more critical. If we judge that contact heterogeneity is more variable and critical, then Model B is more robust? This is a judgment call. Let's say we score Model B higher. Then Step 4 to Model B.
  - Step 5: Decision-relevance. If the decisions require age-specific predictions (e.g., vaccine allocation by age), then Model A is necessary. If Model B cannot provide age-specific outputs, it fails Step 5. Otherwise, we compare accuracy on the required outputs. If the decision is about overall ICU capacity, then both might be acceptable. But if age-specific ICU risk is important, then Model A is needed. Let's assume the decisions require age-specific planning. Then Model A wins Step 5.

  Aggregate: Suppose Step 1: Model A (factual), Step 2: Model B (factual), Step 3: tie, Step 4: Model B (judgment), Step 5: Model A (factual/judgment). Then we go to Step 6: weighting. If we weight Step 5 (decision-relevance) highest, then Model A wins. If we weight Step 2 (out-of-sample) highest, then Model B wins. This is conventional. We must set weights in advance. Suppose we set weights as: Step 1: 20%, Step 2: 20%, Step 3: 10%, Step 4: 20%, Step 5: 30%. Then Model A: Step1 (20% of max), Step2 (0), Step3 (5% because tie counts half?), Step4 (0), Step5 (30%) -> total 55%. Model B: Step1 (0), Step2 (20%), Step3 (5%), Step4 (20%), Step5 (0) -> total 45%. Then Model A wins. But note: if Step 5 is critical and Model B cannot provide age-specific outputs, then Model B fails Step 5 and is eliminated. The procedure must be clear: Step 5 requires the model to provide the necessary outputs. So if Model B cannot, it fails and is out. Then Model A wins.

  **Case 2: Model fits recent data best but misrepresents waning immunity**
  - Model C: Fits the last 12 months best but has a flawed biological mechanism for waning immunity.
  - Model D: Fits less well but represents waning immunity correctly.

  - Step 1: Model C wins (factual).
  - Step 2: We test on a hold-out period that includes a time when waning immunity was critical (e.g., after a wave when immunity waned). If Model C fails to predict that period well because of its flawed mechanism, then Model D wins Step 2. Otherwise, tie.
  - Step 3: Model D is more biologically plausible. We score Model C low on biological plausibility (e.g., 2) and Model D high (e.g., 4). If we set a threshold of 3, Model C fails Step 3 and is eliminated. Then Model D wins.

  So the procedure might eliminate Model C at Step 3 because of low theoretical plausibility. This might be a ranking the unit does not like because they are used to relying on fit. But the procedure flags that the flaw in the mechanism is severe enough to reject the model.

  **Case 3: Simple SIR-style model with false assumptions but good forecasts**
  - Model E: Simple SIR, false assumptions, but forecasts as good as others.
  - Model F: More complex model with more realistic assumptions and similar forecast accuracy.

  - Step 1: Tie (both fit recent data similarly).
  - Step 2: Tie (both perform similarly on out-of-sample data).
  - Step 3: Model E has low theoretical plausibility (score 2) because of false assumptions (e.g., no age structure, no waning immunity). Model F has higher plausibility (score 4). If the threshold is 3, Model E fails and is eliminated. Then Model F wins.

  Again, the unit might not like this because the simple model has been working. But the procedure flags that the assumptions are too flawed and might break down in situations not yet tested.

  **What the procedure cannot tell us about closeness to the truth**:
  - It cannot guarantee that the chosen model is closer to the truth in all aspects. It focuses on practical performance and plausibility for our specific decisions.
  - It does not address whether the model is true in some deep sense, because we are using operational criteria and the models are known to be false.
  - The procedure is relative (comparing models) and context-dependent (tied to our decisions and data). A model that wins in one context might not in another.
  - It does not resolve the philosophical problems of verisimilitude, but it provides a structured, defensible way to choose among imperfect models for decision-making.

  By making the steps clear and marking the bases (fact, convention, judgment), we provide transparency and a basis for review and improvement.
answer: |-
  Below is a decision procedure for your model-assessment unit, designed as a reusable quarterly workflow. It is structured as a sequence of questions, with clear criteria for sufficient answers, and marks each step as **factual** (reliant on data/calculations), **conventional** (based on predefined rules or standards), or **judgment** (requiring expert interpretation). Steps that return a "no" eliminate a model from consideration; steps involving values or unresolvable ties escalate to a person (the director). The procedure prioritizes practical decision-relevance over abstract truthlikeness, using empirical performance, robustness, and plausibility checks. It can be executed in a week by modelers without philosophical training.

  ---

  ### **Model Assessment Procedure**  
  *Execute sequentially for each candidate model. Eliminate models that fail any step. Rank survivors by aggregate score (Step 7).*  

  1. **Step 0: Scope Definition (Conventional)**  
     - *Question:* Does the model output the required decision variables (e.g., ICU demand, vaccine efficacy, travel risk) for the planning horizon (e.g., 3–6 months)?  
     - *Sufficient Answer:* Yes, with outputs matching the spatial/demographic granularity needed (e.g., age-stratified ICU beds).  
     - *Failure:* No → Eliminate.  
     - *Notes:* Define scope quarterly (e.g., "ICU beds by region"). Conventional because granularity is set by policy needs.  

  2. **Step 1: Fit to Target Data (Factual)**  
     - *Question:* How well does the model fit the most recent 12 months of data for key outcomes (e.g., cases, hospitalizations)?  
     - *Sufficient Answer:* Quantitative comparison using ≥2 metrics (e.g., RMSE, MAE, interval coverage). Model must be within 10% of the best-performing model on all metrics.  
     - *Failure:* Outside 10% on any metric → Eliminate.  
     - *Notes:* Use agency-preprocessed data to ensure consistency. Factual because metrics are calculable.  

  3. **Step 2: Out-of-Distribution Validation (Factual)**  
     - *Question:* How well does the model predict outcomes during past "stress tests" (e.g., surges, variants) not used in fitting?  
     - *Sufficient Answer:* Test on 1–2 historical crises (e.g., Delta wave). Model predictions must have ≤20% error in peak magnitude/timing for key outcomes.  
     - *Failure:* >20% error → Eliminate.  
     - *Notes:* Predefine crises in agency database. Factual.  

  4. **Step 3: Mechanism Plausibility (Judgment)**  
     - *Question:* Are the model’s biological/social mechanisms (e.g., immunity waning, contact patterns) consistent with current scientific consensus?  
     - *Sufficient Answer:* Expert review (3+ modelers) scores mechanisms 1–5:  
       - 5: Aligns with all core evidence.  
       - 3: Minor omissions (e.g., simplifies known mechanisms).  
       - 1: Contradicts established evidence (e.g., ignores airborne transmission).  
       Model must average ≥3.  
     - *Failure:* Average <3 → Eliminate.  
     - *Notes:* Judgment because it requires interpretation of literature.  

  5. **Step 4: Sensitivity Robustness (Judgment)**  
     - *Question:* How sensitive are the model’s decision-critical outputs (e.g., peak ICU demand) to parameter uncertainty?  
     - *Sufficient Answer:* Expert review (3+ modelers) assesses sensitivity:  
       - Low: <10% output variation under parameter shocks.  
       - Medium: 10–25% variation.  
       - High: >25% variation.  
       Model must have low/medium sensitivity for ≥80% of key outputs.  
     - *Failure:* High sensitivity for >20% of outputs → Eliminate.  
     - *Notes:* Judgment because experts define "shocks" (e.g., ±20% transmission rate).  

  6. **Step 5: Decision Simulation (Conventional/Judgment)**  
     - *Question:* If used in past quarters, would the model have led to better decisions (e.g., fewer ICU shortages)?  
     - *Sufficient Answer:* Simulate past decisions (e.g., "If we allocated vaccines per Model X, would shortages decrease?"). Use agency-defined cost function (e.g., lives saved/economic cost). Model must be ≤10% worse than the best historical performer.  
     - *Failure:* >10% worse → Eliminate.  
     - *Notes:* Conventional (cost function set by agency); judgment if data is sparse.  

  7. **Step 6: Tie-Breaking and Ranking (Conventional/Judgment)**  
     - *For surviving models:* Aggregate scores from Steps 1–5.  
       - Scoring: Each step contributes 20% to total (100%). Steps 1–2: Use relative metric performance (e.g., 0–100 scale). Steps 3–5: Convert scores to 0–100 (e.g., Step 3 average = 60 if score 3/5).  
     - *Escalate if:*  
       - Models differ by <5 points → Director decides based on values (e.g., precaution vs. cost).  
       - No models survive → Director chooses based on crisis priorities.  
     - *Output:* Rank models by total score (highest = "best").  

  ---

  ### **Procedure Execution on Cases**  
  *Each case compares two models. We assume identical scope (Step 0 passed).*  

  **Case 1: Influenza Models**  
  - **Model A**: Realistic age structure, homogeneous mixing within groups.  
  - **Model B**: No age structure, captures contact heterogeneity.  
  - *Decision context:* Vaccine allocation requires age-group projections.  

  | Step | Model A                                     | Model B                                     | Outcome                                  |  
  |------|---------------------------------------------|---------------------------------------------|------------------------------------------|  
  | 1    | Good fit to age-stratified data (RMSE: 8%). | Poor fit to age data (RMSE: 25%).           | **A passes** (B fails → eliminated).     |  
  | End  | Only Model A survives → **Choose A**.       |                                             |                                          |  

  *Why the unit might not like this:* If contact heterogeneity is valued over age structure, but Step 1 (factual) forces elimination of B.  

  ---

  **Case 2: Fit vs. Biological Mechanism**  
  - **Model C**: Fits 12m data best; misrepresents waning immunity.  
  - **Model D**: Worse fit; accurate immunity mechanism.  
  - *Decision context:* Long-term immunity affects booster campaigns.  

  | Step | Model C                                                     | Model D                                                     | Outcome                                                      |  
  |------|-------------------------------------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|  
  | 1    | **Best fit** (RMSE: 5% vs. D’s 12%).                        | Worse fit → but within 10%? (7% gap <10%) → **passes**.     | Both pass.                                                  |  
  | 2    | Fails Omicron wave test (error: 30% → >20%).                | Passes (error: 15%).                                        | **C fails → eliminated**.                                   |  
  | 3    | Not tested (eliminated).                                    | Immunity mechanism: consensus-aligned (score 4/5).          | **D passes**.                                               |  
  | End  | Only Model D survives → **Choose D**.                       |                                                             |                                                             |  

  *Why defensible:* Step 2 (factual) exposes C’s flaw despite good fit.  

  ---

  **Case 3: Simple SIR Model**  
  - **Model E**: Simple, false assumptions, forecasts match others.  
  - **Model F**: Complex, realistic, forecasts similar.  
  - *Decision context:* Urgent surge-capacity planning.  

  | Step | Model E                                                      | Model F                                                      | Outcome                                                      |  
  |------|--------------------------------------------------------------|--------------------------------------------------------------|-------------------------------------------------------------|  
  | 1    | Good fit (RMSE: 9%).                                         | Good fit (RMSE: 8%) → both within 10% → **pass**.            | Both pass.                                                  |  
  | 2    | Passes (error: 12% in Delta wave).                           | Passes (error: 10%) → **pass**.                              | Both pass.                                                  |  
  | 3    | Assumptions contradict evidence (score 2/5 → average <3).    | Biologically plausible (score 4/5) → **pass**.               | **E fails → eliminated**.                                   |  
  | 4    | Not tested.                                                  | Medium sensitivity (15% variation) → **pass**.               |                                                             |  
  | End  | Only Model F survives → **Choose F**.                        |                                                              |                                                             |  

  *Why the unit might not like this:* E’s simplicity is appealing, but Step 3 (judgment) eliminates it for mechanistic implausibility, risking future failures.  

  ---

  ### **What the Procedure Cannot Tell Us About Closeness to Truth**  
  - **No access to "ground truth":** The procedure evaluates models for *practical utility* (fit, robustness, decision performance), not abstract verisimilitude. A model that scores highly may still be structurally wrong (e.g., right predictions for wrong reasons).  
  - **Vocabulary-dependence:** Comparisons are tied to our operational vocabulary (e.g., "ICU demand," "waning immunity"). Redescribing the world (e.g., focusing on socioeconomic drivers instead of biology) might alter rankings, but the procedure anchors to agency-defined outcomes.  
  - **Value neutrality:** Steps 6–7 incorporate values (e.g., via cost functions or director decisions), but the procedure cannot resolve whether a model is "objectively" closer to truth—only that it is *better for our specific decisions*.  
  - **Unseen failures:** A model may pass all checks but fail catastrophically in novel scenarios (e.g., a new transmission route). This is why mechanistic plausibility (Step 3) is included as a safeguard.  

  This procedure replaces instinct with structured, auditable steps. It defensibly ranks models for decision-making while transparently separating facts, conventions, and judgments—meeting your director’s requirements.
