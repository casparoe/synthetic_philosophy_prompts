prompt: |-
  I write about evolutionary biology for a general-interest magazine of science and ideas, and I have noticed a recurring failure in my own drafts and those of my colleagues: a trait will be described as having evolved "for the good of the species" in the headline, "for the good of the group" in the lede, and "because it benefits the individual" in the body, with the gene-level account appearing only inside a quotation from a researcher. My editor, who has to sign off on the final copy, favors the elevated, cooperative framing and pushes back when I try to make the language more austere, so I would like to stop settling these questions by feel and on deadline.

  Please write me a reusable decision procedure for deciding which level or levels of selection a sentence about an evolved trait is actually claiming, and whether that claim is defensible given the distinctions standard in the units-of-selection debate: replicators versus vehicles or interactors, individual selection versus group selection versus species selection, kin selection and inclusive fitness, and the conditions under which group-level or species-level talk is more than metaphor. The procedure has to be runnable by a nonspecialist journalist in about ten minutes, so give me the questions in order, say what counts as a sufficient answer to each, say where the procedure stops with "rewrite this," and mark the points where it hands the decision to a person because neither the biology nor the philosophy settles the wording. Then run it on three cases: a claim that lemmings disperse to avoid overgrazing "for the good of the species"; a claim that prairie dog alarm-callers are self-sacrificing sentinels acting "for the good of the group"; and a claim that a honeybee worker's sterility is a sacrifice "for the good of the colony." Arrange at least one worked example so the procedure returns an answer my editor would not like, and conclude by saying what the procedure cannot decide.
reasoning: |-
  Okay, the user is a science journalist writing about evolutionary biology for a general-interest magazine. They've noticed a recurring problem in their drafts and colleagues' work: inconsistent framing of evolutionary explanations across headlines, ledes, and body text. Specifically, they describe traits as evolving "for the good of" species, groups, or individuals inconsistently, with gene-level explanations often buried in quotes. Their editor prefers the more "elevated, cooperative" framing, making it hard to use precise scientific language.

  The core request is for a reusable decision procedure to determine which level of selection (gene, individual, group, species) a claim actually references, and whether it's defensible based on standard evolutionary biology concepts. This needs to be executable by a non-specialist in about ten minutes. They want clear questions, stopping rules, and guidance on when to defer to human judgment. Plus, they want three test cases analyzed, including one where the outcome would challenge their editor's preferences.

  First, I need to unpack the key concepts from the units-of-selection debate. The foundational ideas include:
  - Replicators (genes vs. vehicles/interactors)
  - The hierarchy: gene, individual, group, species selection
  - Kin selection/inclusive fitness
  - Conditions for group selection (e.g., trait-group models, MLS1/MLS2)
  - When group/species talk is more than metaphor

  The procedure must help journalists avoid these common pitfalls:
  - Anthropomorphic "for the good of" language
  - Confusing levels (e.g., group benefits vs. individual mechanisms)
  - Misapplying group selection where kin selection suffices
  - Treating species selection as equivalent to individual selection

  For the decision tree structure, I consider:
  1. Start with the explicit claim: what level is mentioned?
  2. Check if the trait could plausibly emerge from individual-level selection (inclusive fitness, etc.)
  3. Assess if group/species selection mechanisms are necessary/defensible
  4. Flag cases needing expert input

  The three test cases are perfect for demonstrating nuance:
  - Lemmings: classic "for the species" myth vs. individual dispersal drivers
  - Prairie dogs: apparent altruism explained by kin selection
  - Honeybees: eusociality where colony benefit aligns with inclusive fitness

  The honeybee case is ideal for showing the "editor wouldn't like" outcome because while "for the colony" is intuitive, the precise mechanism is gene-centered via kin selection. This creates tension with the preferred "cooperative framing."

  I need to ensure the procedure:
  - Is flowchart-like with binary stops
  - Defines "sufficient answer" clearly (e.g., "yes" requires specific evidence)
  - Marks irreconcilable philosophical debates (e.g., interpretation of kin selection)
  - Ends with "what it can't decide" to set realistic expectations

  Finally, I should emphasize that the procedure helps resolve scientific accuracy vs. narrative tension - exactly the journalist's struggle with their editor.
answer: |-
  Below is a reusable decision procedure for evaluating claims about evolved traits, designed for science journalists. It prioritizes biological accuracy while flagging editorial judgment calls. The procedure follows a **strict hierarchy of selection levels** (gene → individual → group → species) and stops early if a claim fails at higher-priority levels. It takes ~10 mins per claim if background research is prepped.

  ---

  ### **Decision Procedure: Levels of Selection**
  **Instructions:**  
  Answer questions in order. Stop at first "REWRITE" or "DEFER." Use reliable sources (e.g., peer-reviewed studies, consensus reviews) for evidence.  
  **Key Concepts:**  
  - **Replicator:** Gene (unit of inheritance). **Vehicle/Interactor:** Individual/group/species (unit of selection).  
  - **Group selection requires:** (1) Trait variation *between* groups, (2) Differential group survival/reproduction, (3) Limited migration (prevents selfish mutants from spreading).  
  - **Species selection requires:** (1) Speciation/extinction rates tied to traits, (2) Trait heritability *at species level* (e.g., body size).  
  - **Kin selection:** Altruism evolves if benefit to relative × relatedness > cost to actor (Hamilton’s rule: *rb > c*).  

  #### **Questions:**
  1. **Does the trait demonstrably increase the *individual’s* reproductive success?**  
     - *Yes:* Claim is defensible at individual level. **STOP: ACCEPT** "benefits the individual."  
     - *No* or *Unclear*: Go to Q2.  
     - *Sufficient evidence:* Data showing trait carriers have higher lifetime fitness.  

  2. **Is the trait *best explained* by kin selection (inclusive fitness)?**  
     - *Yes* (e.g., high relatedness, *rb > c*): **STOP: REWRITE** using "kin selection" or "inclusive fitness."  
     - *No*: Go to Q3.  
     - *Sufficient evidence:* Relatedness measured; Hamilton’s rule tested.  

  3. **Is there *strong evidence* for group selection (mechanics, not just outcome)?**  
     - *Yes* (all: trait variation between groups, group fitness differential, limited migration): **STOP: ACCEPT** "group benefit" **if** caveated (e.g., "under group selection").  
     - *No*: **STOP: REWRITE** to individual/gene level.  
     - *Mixed evidence:* **DEFER** to expert + disclose uncertainty.  

  4. **Is the claim about *species-level* benefit?**  
     - *Yes*: **DEFER** to expert. Species selection is rare and contentious (e.g., requires heritable species traits).  
     - *No*: **STOP: REWRITE** – species benefit is usually a byproduct.  

  **Where Biology/Philosophy Conflict:**  
  - Q3 (group selection): Philosophy debates if kin selection *is* group selection. Biology treats them as distinct. **DEFER if contested.**  
  - "Vehicle" vs. "replicator" framing: Gene-centric language is precise but often inaccessible. **HAND TO EDITOR** for audience adjustment.  

  ---

  ### **Worked Examples**
  #### **Case 1: "Lemmings disperse to avoid overgrazing for the good of the species."**  
  - **Q1:** Does dispersal increase individual success?  
    *Yes* – Dispersal avoids competition, finds new resources. High individual mortality is due to predation/starvation, not evolved sacrifice.  
    **STOP: REWRITE** as "Dispersal benefits individuals by reducing competition."  
    *Editor impact:* Rejects "species good" framing.  

  #### **Case 2: "Prairie dog alarm-callers are self-sacrificing sentinels for the good of the group."**  
  - **Q1:** Does calling increase individual success?  
    *Unclear* – Callers risk predation.  
  - **Q2:** Best explained by kin selection?  
    *Yes* – Prairie dogs live in kin groups; callers warn relatives (high *r*). Hamilton’s rule supported.  
    **STOP: REWRITE** as "Alarm calls evolve via kin selection, benefiting relatives."  
    *Editor impact:* Rejects "group good" and "self-sacrifice" without kin context.  

  #### **Case 3: "Honeybee workers' sterility is a sacrifice for the good of the colony."**  
  - **Q1:** Does sterility increase individual success?  
    *No* – Workers don’t reproduce.  
  - **Q2:** Best explained by kin selection?  
    *Yes* – High relatedness (*r*=0.75 in haplodiploid systems); worker sterility maximizes inclusive fitness by aiding the queen.  
    **STOP: REWRITE** as "Worker sterility evolves via kin selection to aid closely related queens."  
    *Editor impact:* **Editor-disliked outcome** – Rejects "colony good" as primary driver. Colony benefit is a consequence, not cause.  

  ---

  ### **What the Procedure Cannot Decide**  
  1. **Semantic compromises:** When an accurate explanation (e.g., gene-level) is too technical, and "group benefit" is used as shorthand. *Solution:* Add caveats ("while groups benefit, the mechanism is kin selection").  
  2. **Philosophical rifts:** e.g., Whether kin selection is a "type" of group selection. Default to biological consensus.  
  3. **Editorial tone:** "Sacrifice" vs. "adaptive behavior." Biology avoids agency metaphors; magazines may retain them for narrative. **HAND TO EDITOR.**  

  **Final Tip:** Preempt conflicts by structuring articles:  
  - **Headline/Lede:** Use outcome-focused language ("X sustains ecosystems").  
  - **Body:** Specify mechanism ("evolved via individual/kin selection").  
  - **Quotes:** Let experts articulate nuance.  

  This procedure prioritizes accuracy but flags where narrative needs override precision. Use it to negotiate with editors by showing the biological "chain of evidence" required for each claim.
