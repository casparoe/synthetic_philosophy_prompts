  - Stanza 3 (Popperian): Internal hypotheses. "Reinforced" becomes mental retention; "killed" is disconfirmation. Need epistemic tension—"doubt," "fragile thoughts."
  - Stanza 4 (Gregorian): Cultural tools. "Killed" shifts to social rejection of ideas/tools. Crucial: "cheaply" must echo Dennett's point about cognitive outsourcing. Final repetition of opening lines now implies ancestral trial-and-error embedded in tools.

