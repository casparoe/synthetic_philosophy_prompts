prompt: |-
  I keep flipping on whether supererogation is a real thing. By "supererogatory act" I mean an act that's morally good to perform but not morally required — going beyond duty, not just meeting it. What's your credence that at least one such act is genuinely possible? Decompose: what are the main sub-questions your number depends on, what rough credence do you have in each, and how do they combine? Then tell me which sub-question your final number is most sensitive to, and what evidence or argument would shift it most.
