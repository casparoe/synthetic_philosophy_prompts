prompt: |-
  I chair my university's rules and governance committee. Our faculty senate bylaws have a single amendment clause — Article XIV — which reads: "These bylaws may be amended by a two-thirds vote of the full senate." A group of senators has now proposed an amendment to Article XIV itself, changing it to require a four-fifths supermajority instead. They have the two-thirds votes to pass it under the current rule. The senate chair is unsure whether to rule the motion in order and has asked our committee for a written opinion.

  The opponents' argument is this: if the amendment passes, then the new rule says it takes four-fifths to amend the bylaws — but the amendment itself only got two-thirds. So the amendment was enacted by a procedure that, according to its own content, wasn't sufficient. That looks like a kind of self-undermining: the amendment can't consistently claim to be valid under the rule it creates. The proponents reply that this is just how amendment procedures work — you use the old rule to change the old rule, and the new rule governs going forward. That's the whole point of having an amendment clause.

  Draft me the memo I'll submit to the senate chair. Give me a definite recommendation: rule it in order or out of order. I want the reasoning to take the losing side's strongest point seriously, not just dismiss it. And don't appeal to case law or statutes — there isn't any that squarely addresses this, and I don't want a memo that pretends otherwise. I need a conceptual arguement, not a Westlaw search.
reasoning: |-
  Okay, the user chairs their university's rules and governance committee and needs a memo for the senate chair regarding a proposed amendment to the faculty senate bylaws. The amendment would change the voting threshold for future amendments from two-thirds to four-fifths. The current rule requires two-thirds for passage, and the proponents have that support. However, opponents argue that passing this with two-thirds is self-undermining because the new rule would require four-fifths, making the amendment itself seem insufficient under its own standard.

  First, I need to understand both sides. The opponents' strongest point is about self-consistency: if the amendment passes with two-thirds, but now requires four-fifths, it wasn't enacted under the rule it establishes. That creates a paradox. The proponents argue that amendment clauses inherently use the old rule to change to the new rule. So the key is whether the amendment process can bootstrap itself into a higher standard without meeting that higher standard at the time of change.

  The user wants a conceptual argument without citing case law or statutes. They need a clear recommendation: rule it in order or out of order. The memo should address the opponents' concern seriously, not dismiss it. So the reasoning has to acknowledge the validity of the consistency argument but then explain why it doesn't apply here.

  Looking at constitutional law concepts, amendments often follow existing procedures even if they change those procedures. For example, the U.S. Constitution's amendment process in Article V is used to amend itself. The original process required two-thirds of Congress and three-fourths of states. Any change to Article V would still follow that same procedure, even if it alters future requirements. That's the bootstrapping principle: the old rule governs until it's legitimately changed.

  The opponents' argument might stem from a misunderstanding of temporal application. Rules apply prospectively unless specified otherwise. The new four-fifths rule would only apply to future amendments, not retroactively to its own enactment. So the consistency issue is resolved by recognizing that the amendment is valid under the old rule and the new rule takes effect afterward.

  Another angle is sovereign power: the senate, as the governing body, has the authority under the current bylaws to amend them. By passing the amendment with two-thirds, they're exercising that authority. The new rule doesn't invalidate past actions; it sets a new standard moving forward. The memo should emphasize that the amendment is an act of the senate's current authority, not subject to future rules.

  Potential counterarguments: What if the amendment tried to make itself retroactive? But here, it's not. Or if it created an inconsistency in the bylaws? But changing the amendment clause is explicit and replaces the old rule. The memo should clarify that as long as the process is followed correctly under the existing rules, the outcome is valid, even if it changes those rules.

  Recommendation: Rule the motion in order. The reasoning should validate the opponents' concern about consistency but explain that procedural rules inherently allow self-amendment under the current terms. The key points are the temporal scope (prospective application) and the legitimacy of the existing amendment process to authorize changes, including to itself.
answer: |-
  **MEMORANDUM**  
  **TO:** Senate Chair  
  **FROM:** Rules and Governance Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposed Amendment to Article XIV  

  ---

  ### **I. Recommendation**  
  The Committee recommends that you **rule the motion in order**. The proposed amendment to Article XIV may proceed to a vote under the current two-thirds requirement.  

  ---

  ### **II. Summary of the Question**  
  Senators propose amending Article XIV (the bylaws’ amendment clause) to replace the current two-thirds voting threshold with a four-fifths supermajority. Proponents hold the two-thirds votes required under the existing rule. Opponents argue that the amendment is self-undermining: if enacted, it would retroactively render its own adoption procedurally insufficient under the new standard it creates.  

  ---

  ### **III. Analysis of Opponents’ Strongest Argument**  
  We take seriously the opponents’ claim that the amendment is self-invalidating. Their core concern is one of **logical consistency**:  
  - If the amendment passes with two-thirds support, it creates a new rule stating that four-fifths are required for validity.  
  - Thus, the amendment appears to violate the very rule it enacts. This creates a paradox: *How can a rule demand a four-fifths majority while owing its existence to a lower threshold?*  

  This argument is not merely technical; it speaks to the integrity of governance. If rules can be changed in ways that defy their own validity conditions, it risks eroding trust in the amendment process.  

  ---

  ### **IV. Conceptual Framework: Why the Amendment is Valid**  
  While the opponents’ logic is coherent, it misapplies the **temporal scope** of bylaws and conflates **creation** with **operation**. Our reasoning proceeds on three principles:  

  1. **The Bootstrapping Principle of Amendment Clauses**  
     An amendment clause is inherently self-referential. It must empower its own modification using the procedure *currently in force*. To amend Article XIV, one must follow Article XIV *as it exists at the time of amendment*. The new rule only becomes authoritative *after* the amendment is ratified. To require the new standard to govern its own adoption would create an infinite regress: no amendment could ever change the amendment threshold, as it would need to meet the future standard before that standard exists. This paralyzes the sovereign authority of the Senate to revise its own foundational rules.  

  2. **Prospective Application of Rules**  
     Bylaws operate prospectively unless explicitly stated otherwise. The proposed amendment does not declare that *past* amendments (including itself) require four-fifths support; it establishes a new procedure *for future amendments*. The two-thirds vote is legitimate under the rule that was operative *at the time of passage*. The new four-fifths rule binds subsequent actions, not prior ones.  

  3. **The Distinction Between Authority and Validity**  
     The Senate’s authority to amend derives from the *current* bylaws. A successful two-thirds vote under Article XIV is an exercise of that authority. The resulting amendment is valid because it complies with the procedural conditions in effect *during its enactment*. The substance of the amendment (including a stricter future threshold) does not retroactively void the process that created it. To hold otherwise would imply that all amendments altering procedural rules are void—a conclusion that would nullify the purpose of an amendment clause.  

  ---

  ### **V. Counterargument Addressed: The Consistency Paradox**  
  Opponents rightly fear that this creates two conflicting standards: one validating the amendment’s adoption (two-thirds) and another governing its future use (four-fifths). But this is not a contradiction; it is a **transition between legal regimes**. All amendments replace old rules with new ones. The “conflict” exists only in the instant the amendment passes—a transition inherent to any self-amendment. The Senate’s act remains coherent because:  
  - **Pre-amendment**: The two-thirds rule is binding.  
  - **Post-amendment**: The four-fifths rule is binding.  
  The amendment bridges these states *using the only mechanism available*: the rule in place before the change.  

  ---

  ### **VI. Conclusion**  
  The proposed amendment is procedurally sound. The opponents’ self-invalidation argument, while philosophically substantive, conflates the conditions for enacting a rule with the conditions the rule imposes thereafter. Amendment clauses must function as gateways to their own evolution; binding them to their future iterations would render self-amendment impossible. The Senate’s current authority under Article XIV permits this change, and the new rule will govern all subsequent amendments.  

  **Recommendation:** Rule the motion in order for a vote under the existing two-thirds threshold.  

  Respectfully submitted,  
  Chair, Rules and Governance Committee  

  --- 

  **Key Conceptual Takeaway:**  
  *An amendment rule is a vehicle for change, not a straitjacket. It must use today’s key to unlock tomorrow’s door.*
