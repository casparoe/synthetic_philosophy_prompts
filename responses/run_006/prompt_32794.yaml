     In game theory, we have the concept of a focal point (Schelling point) that allows coordination without communication, but that usually requires some common context. In this case, the focal point is the symmetric outcome.

     Also, note that in standard game theory, without any ability to communicate or commit, the prisoner's dilemma has a unique Nash equilibrium: (D, D). So why isn't that the case here?

