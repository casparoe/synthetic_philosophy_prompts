  We are going to break down the concept of acausal trade using the framework of mainstream game theory. The core idea of acausal trade is that two agents who cannot communicate or interact causally (i.e., they are in separate universes, beyond each other's light cones, etc.) can still "cooperate" by each choosing an action that benefits the other, based on the reasoning that the other agent is sufficiently similar and will reason symmetrically.

