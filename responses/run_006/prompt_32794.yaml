  In essence, acausal trade is an exotic restatement of the idea of cooperation by symmetry and reflection, but it is not something that game theorists already understand under a different name in the standard framework. There are some related concepts in the literature on team reasoning, or in the work on reflective decision making (e.g., in the work of Tennenholtz on program equilibrium or in the logic of mutual prediction), but these are not mainstream game theory.

