        - If I choose D, then with probability 1 the other chooses D so I get 0.

     Then the agent chooses C. But note that this requires the belief that the other agent will copy my action. How is this belief justified? By the symmetry and the common knowledge of rationality and similarity.

     This is similar to the concept of "reflection" in decision theory: an agent who knows that they are identical to another agent should expect the other agent to do the same as they do. But this is not part of standard game theory.

