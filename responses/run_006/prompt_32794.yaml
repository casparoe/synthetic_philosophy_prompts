  1. **The reasoning process**: We had to change the decision-making process of the agents. Instead of best-responding to the other's strategy (which leads to defection), we have the agents reasoning that the other will do the same as they do. This is not part of standard Nash equilibrium. We had to introduce a form of "symmetric reasoning" that is not standard.

  2. **Belief formation**: In standard game theory, beliefs about the other player's action are formed by considering the other player's incentives. Here, the belief is formed by the agent's own action: if I do X, then the other (being identical) will do X. This is a distortion of the standard belief formation.

  **Parts that have no expression in standard game theory at all:**

  1. **The lack of causal interaction**: Standard game theory assumes that players are in the same game and that the actions of one player affect the payoffs of the other (even if they are simultaneous). But in acausal trade, the agents are in separate universes and there is no causal interaction. However, the payoffs are defined in such a way that they depend on each other's actions. This is already a stretch because without causal interaction, how can the action of one agent in a separate universe affect the other? This is not addressed in game theory.

  2. **The justification for the symmetric belief**: The idea that because the agents are identical, they will choose the same action, and moreover, each agent can rely on this to choose the cooperative action, is not part of standard game theory. Game theory would instead require that each agent's action be a best response to the other's action, and the only best response in a prisoner's dilemma is to defect regardless of what the other does.

  3. **Counterfactual reasoning across universes**: The agents are reasoning about what would happen if they were in the other's position and making a decision that is based on that counterfactual. This is not part of standard game theory.

