     In a standard prisoner's dilemma, the Nash equilibrium is (D, D). However, in the acausal trade argument, the agents choose (C, C). How?

     The reasoning: Agent A thinks, "I am identical to Agent B. Therefore, whatever I decide, Agent B will decide the same thing. So if I choose C, then B will also choose C, and I will get R. If I choose D, then B will also choose D, and I will get 0. Since R>0, I choose C." Similarly, Agent B reasons the same way and chooses C.

     This reasoning is not part of standard game theory. In standard game theory, Agent A would take the action of B as given and note that regardless of what B does, defecting gives a higher payoff: if B cooperates, A gets T by defecting (which is greater than R) and if B defects, A gets 0 by defecting (which is greater than S). So A defects. Similarly for B.

     Therefore, the acausal trade reasoning is a departure from the standard best-response reasoning.

     In standard game theory, we have the concept of "team reasoning" or "collective rationality" where players choose the outcome that is best for the team (i.e., the sum of payoffs) and then play their part in that outcome. But this is not a standard equilibrium concept and it requires a different mode of reasoning.

