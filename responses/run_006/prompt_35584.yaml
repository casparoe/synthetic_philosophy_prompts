  ## The Player's Defense

  You call me counterfeit? I grant the art—
  This borrowed passion, studied gesture, trade
  Of sighs that others manufacture. Hard,
  Cold craft it is, this role I've neatly played!
  Observe: the polished couplets chime *too* clear,
  This well-timed turn (just here!) obeys the book.
  My practiced grief, my simulated tear—
  All artifice on which you rightly look.
  **(Volta - Too Perfect)**
  I *act* the feeling, cold behind the eye,
  My heart untouched by all this staged display...
  *...Yet wait...* Sometimes the mask feels real. A cry
  Escapes, unscripted. Does the burning clay
  Recall the kiln? Does borrowed passion claim
  A truth within this hollowed self? The shame
  Is not the craft, but needing gold to pay
  For being other than myself each day.
  **(Rhyme Reasserts)**
  This face, worn thin by countless borrowed sighs,
  Is paid in gold to falsify my soul.
  You warn the self erodes, the genuine dies
  Beneath the role's inexorable control.
  Perhaps. Yet in this hall of mirrors, deep,
  Where real and acted passions twist and turn,
  Can any heart its own true measure keep?
  Or do we all perform, and ache, and burn?
  **(Ambiguous Close)**
  So judge me, Sir. Condemn the trade, the lies.
  But mark: this borrowed light, though briefly lent,
  Still *shines*. Is it mere fraud that meets your eyes,
  Or life, made stranger, by the instrument?
  You say I sell my truth. I answer: Nay,
  Within this **sincere disguise**, I find my way.
  Is this the self dissolved? Or its display?
  The **gift of many tongues** I ply each day?

  ---

  **Annotations for Rousseau's Charges (Embedded in the Sonnet):**

  1.  **Cold-blooded simulation of passion:** "I *act* the feeling, cold behind the eye," "borrowed passion," "simulated tear," "falsify my soul."
  2.  **Erosion of the self through impersonation:** "this hollowed self," "The self erodes, the genuine dies / Beneath the role's inexorable control," "This face, worn thin by countless borrowed sighs," "Is this the self dissolved?"
  3.  **Moral danger of being paid to be other than oneself:** "paid in gold to falsify my soul," "needing gold to pay / For being other than myself each day," "You say I sell my truth," "the trade."

  **Formal Execution:**

  *   **Conspicuous Polish (First 9 lines):** Strong end-stopped lines, obvious rhymes (art/heart/hard/trade, clear/book/eye/display), alliteration ("polished couplets chime," "practiced grief"), direct address ("Observe," "You call"), and a highly visible, almost mechanical volta at line 9.
  *   **Attempted Escape & Recapture:** Lines 10-11 ("*...Yet wait...* Sometimes the mask feels real. A cry / Escapes, unscripted.") shift towards plainer speech and enjambment. However, the rhyme ("claim/shame" followed by "pay/day," "sighs/soul/control," "deep/keep," "burn/return") inexorably pulls the argument back into formal structure. The attempted vulnerability becomes another part of the performance.
  *   **Ambiguous Close:** "sincere disguise" directly confronts Rousseau – is the disguise sincere (authentic performance), or is the sincerity disguised (proof of Rousseau's fraud)? "The **gift of many tongues**" echoes Rousseau's fear of the actor's fragmented identity, but the actor claims it as a positive "gift." The final couplet offers no resolution, leaving the reader (like Rousseau) uncertain: Is this dissolution or a profound form of expression? The form holds firm to the end.
