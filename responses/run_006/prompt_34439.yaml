  3.  It clarifies why a convincing AI, a thermostat, a simple robot, or a lookup table lacks intrinsic moral status, as they lack biological consciousness, even if functionally identical.
  4.  It directly addresses the weather system case: identical formal computation implemented in non-biological matter (air, water) lacks moral significance, whereas the emulation, mimicking biological processes, possesses it.
  5.  This principle forces you to reconsider the vegetative state patient: if consciousness is irrevocably lost with *all* brain function ceasing, such a patient might lack intrinsic moral status, conflicting with your intuition that they still matter.
