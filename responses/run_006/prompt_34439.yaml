  I've been trying to get clear on which systems matter morally in their own right, not just as tools, and my gut keeps landing on a wierd pattern. A healthy adult matters. A patient in a vegetative state matters, though I can't say why. A worm matters a little. A locked-in patient who can't signal at all still matters. But a large language model that talks convincingly about being in pain doesn't matter in the least, and neither does a thermostat or a simple reinforcement-learning robot. A whole-brain emulation running on silicon matters. A lookup table with the same input-output behaviour as that emulation doesn't. And here's the one that bothers me: a weather system that happened to implement the same formal computation as a suffering brain for an hour wouldn't matter, even though the emulation would. Is there a principle that captures all or most of these? What does it say about a detailed simulation of an animal's nervous system, and about a brain under deep anaesthesia? And which of my verdicts does it force me to give up? Please answer in exactly five numbered points, one or two sentences each, no introduction or conclusion, in British English.
