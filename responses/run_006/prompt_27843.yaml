  ### Dialogue: CDT vs. FDT on Omega's Coin Toss

  **CDT**: Let’s be clear: the coin landed tails. Paying $100 now can’t retroactively change the coin flip or make Omega deposit $10,000 in a branch that doesn’t exist. My causal model shows paying only drains $100 with zero downstream benefits. Refusing costs nothing. Why pay?  

  **FDT**: Because your decision function—not this specific act—determined the outcome. Omega rewarded agents with a consistent policy of paying in all scenarios. If you defect now, you reveal you’d have defied Omega’s terms in the heads branch too, forfeiting $10,000 there.  

  **CDT**: But the heads branch is counterfactual! We’re in tails. Your "policy" talk is circular: you’re sacrificing $100 to satisfy a abstract identity. Causally, paying does nothing.  

  **FDT**: It’s not identity—it’s maximizing expected utility across all states your decision function influences. Pre-commit to paying, and Omega’s prediction locks in +$10,000 in heads. The ex ante expected value of that policy is 0.5×$10,000 − 0.5×$100 = $4,950. Defecting nets $0.  

  **CDT**: Ex ante reasoning is irrelevant post-coin-toss. Conditioned on tails, paying’s utility is −$100. You’re conflating worlds.  

  **FDT**: Conditioning on tails ignores how your decision function *created* this outcome. Omega predicted you’d pay here *because* you’re the type who pays—securing the heads payoff. Reneging now undermines the very function that made heads profitable.  

  **CDT**: Then consider XOR Blackmail: Omega says it mailed you iff exactly one of (termites, $1,000 paid) is true. You get the letter. If FDT urges paying here too, you’d lose $1,000 pointlessly—just like this $100.  

  **FDT**: Not analogous. In XOR Blackmail, paying *correlates* with lacking termites, saving you $1M. Here’s why: a payer only receives the letter if termites are absent (T XOR P = ¬T). So paying $1,000 implies ¬T, avoiding million-dollar damage. Refusing implies termites. Both theories agree: pay.  

  **CDT**: But in *this* coin-toss case, paying correlates with nothing beneficial! In tails, it’s pure loss.  

  **FDT**: Incorrect. In coin-toss, paying correlates with being the decision-type who *got* $10,000 in heads. FDT treats the $100 as the price of membership in that high-payoff class. XOR Blackmail lacks this cross-branch identity—paying there directly evidences low risk.  

