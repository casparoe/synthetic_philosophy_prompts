  ### Death Assessment Quiz: Is Death Bad for the Person Who Dies?

  **Instructions:** For each scenario, pick the answer that best reflects your intuition. Don't overthink it—go with your gut. There are no right or wrong answers!

  ---

  #### **Question 1: The Quiet End**  
  You could die painlessly in your sleep tonight or live 40 more ordinary (moderately happy) years.  
  - **A.** Dying tonight would be worse for me—I’d miss out on decades of life.  
  - **B.** Dying tonight isn’t bad for me—I wouldn’t feel or experience anything.  
  - **C.** Dying tonight might be worse if I had unfinished goals, but otherwise, it’s neutral.  

  #### **Question 2: The False Rumor**  
  After you die, someone spreads a vicious lie that ruins your reputation forever.  
  - **A.** This is bad for *me*—my legacy is destroyed.  
  - **B.** This isn’t bad for *me*—I’m gone and won’t experience it.  
  - **C.** This is only bad if I *cared* about my reputation while alive.  

  #### **Question 3: The Frozen Embryo**  
  You learn the embryo that became you was supposed to be implanted 10 years earlier but got frozen. Your life started later than possible.  
  - **A.** This is bad for me—I missed 10 years of existence.  
  - **B.** This isn’t bad for me—I didn’t exist back then.  
  - **C.** This isn’t bad, but dying 10 years *early* would be bad.  

  #### **Question 4: The Irreversible Coma**  
  You’re in an irreversible coma and will never regain consciousness.  
  - **A.** This is bad for me—I’m deprived of a future.  
  - **B.** This isn’t bad for me—I experience nothing.  
  - **C.** This is only bad if I *wanted* to live while conscious.  

  #### **Question 5: The Broken Promise**  
  Your best friend promises to scatter your ashes in your favorite place but dumps them in a landfill instead.  
  - **A.** This is bad for *me*—my wishes were violated.  
  - **B.** This isn’t bad for *me*—I’m dead and unaware.  
  - **C.** This is only bad if I *deeply cared* about it while alive.  

  #### **Question 6: The Immortality Pill**  
  A pill makes you immortal but leaves you permanently mildly bored (no joy, just tolerable dullness).  
  - **A.** I’d take it—living forever is better than death.  
  - **B.** I wouldn’t take it—endless boredom is worse than death.  
  - **C.** I wouldn’t take it—death isn’t bad, and immortality isn’t appealing.  

  #### **Question 7: The Slow Decline**  
  You develop dementia, slowly forgetting loved ones and losing joy, before dying years later.  
  - **A.** Dying *before* the dementia starts would be worse—I’d miss the good years left.  
  - **B.** Dying *before* the dementia starts would be *better*—I’d avoid suffering.  
  - **C.** Death itself isn’t bad, but the dementia is bad while I experience it.  

  #### **Question 8: The Painful Choice**  
  You can take a treatment for 5 more months of severe pain or choose a painless death tomorrow.  
  - **A.** I’d take the treatment—any life is better than death.  
  - **B.** I’d choose death—avoiding agony is better.  
  - **C.** Death isn’t bad, so I’d choose it to skip the pain.  

  #### **Question 9: The Unfinished Symphony**  
  You’ll finish your life’s masterpiece tomorrow, but you die painlessly tonight.  
  - **A.** Dying tonight is worse for me—my goal is thwarted.  
  - **B.** Dying tonight isn’t worse—I won’t know or feel the loss.  
  - **C.** Dying tonight is worse because I’d miss the happiness of finishing it.  

  #### **Question 10: The Symmetry Test**  
  Compare: (1) Dying 10 years early vs. (2) Being born 10 years later than possible.  
  - **A.** Both are equally bad—they deprive me of life.  
  - **B.** Only dying early is bad; being born late isn’t.  
  - **C.** Neither is bad—I didn’t exist in either "missing" time.  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a philosophical view. **Important:** Some patterns map to multiple views—this reflects real ambiguity (see "Weak Spots" below).

  | **Answer Pattern**       | **Philosophical View**                                                                                                                                 | Key Features                                                                                                |
  |--------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|
  | **Mostly Bs**            | **Hard Epicurean View**                                                                                                                                | Death is *never* bad for you. You cease to exist, so there’s no "you" to suffer loss.                       |
  | **Mostly As (Q1,4,6,9) + A in Q3 + A in Q10** | **Deprivation Account (Pleasure-Focused, Symmetric)**                                                                      | Death is bad because it deprives you of *future pleasures*. Prenatal non-existence is *equally bad*.        |
  | **Mostly As (Q1,4,6,9) + C in Q3 + B in Q10** | **Deprivation Account (Pleasure-Focused, Asymmetric)**<br>or<br>**Conditional Badness View**                                                         | Death is bad only if it deprives you of a *net-positive future*. Prenatal non-existence is *not bad*.       |
  | **Mostly Cs (Q1-5,9) + B in Q7,8**           | **Desire/Goal Deprivation View**                                                                                                                      | Death is bad if it thwarts your *desires/goals*. Posthumous harms matter *only if you cared*.               |
  | **Mix of Bs (Q1-5) + Bs in Q7,8 + B in Q6** | **Conditional Badness View**<br>(or **Asymmetric Deprivation** if combined with As in Q1,4,6,9)                                                      | Death is *good* if your future would be net-negative (e.g., pain, dementia).                                |

  #### How to Interpret Your Pattern:  
  - **Mostly Bs (≥6 Bs):** Hard Epicurean.  
  - **As in Q1,4,6,9 + A in Q3 + A in Q10:** Symmetric Deprivation (Pleasure).  
  - **As in Q1,4,6,9 + C in Q3 + B in Q10:** Asymmetric Deprivation (Pleasure) or Conditional Badness.  
  - **Cs in Q1-5,9 + B in Q7,8:** Desire/Goal Deprivation.  
  - **Bs in Q1-5 + B in Q6,7,8:** Conditional Badness.  

  ---

  ### Weak Spots & Self-Critique  
  This quiz has intentional gaps reflecting unresolved philosophical debates. Here’s where it’s shakiest:  

  1. **Q6 (Immortality Pill) Ambiguity:**  
     - **Problem:** Choosing **B** ("endless boredom is worse") maps to *both* **Conditional Badness** and **Asymmetric Deprivation**.  
     - **Why?** Both views agree death can be good if the alternative is worse, but they diverge on *why*. Deprivation focuses on lost *goods*; Conditional Badness weighs net *value*.  
     - **Fix needed?** Add a case contrasting "losing goods" vs. "avoiding bads" (e.g., *"Would you trade 1 year of joy for 10 years of boredom?"*).  

  2. **Desire View Under-Detected:**  
     - **Problem:** **Desire/Goal Deprivation** (mostly Cs) overlaps with **Epicurean** (Bs) if users pick C in Q2/Q5 for non-desire reasons.  
     - **Why?** Both deny inherent badness in death/posthumous events, but Desire theorists care about *antemortem intentions*.  
     - **Fix needed?** Add a case like: *"You die before opening a letter confirming your lifelong dream came true. Is this worse?"* (Desire: Yes; Epicurean: No).  

  3. **Q7/Q8 Assumes Net-Negative Futures:**  
     - **Problem:** **Asymmetric Deprivation** and **Conditional Badness** both map to B in Q7/Q8, but they might differ if the future is mixed (e.g., pain *with* meaning).  
     - **Why?** The quiz assumes dementia/pain are unambiguously bad. Realists might argue some would still value that time.  
     - **Fix needed?** Clarify scenarios (e.g., *"The 5 painful months include zero joy or meaning"*).  

  4. **Unmapped Combinations:**  
     - **Pattern: Mostly Cs but A in Q10.**  
       - **Why unattractive?** Claims prenatal non-existence *is* bad (like Symmetric Deprivation) but death’s badness depends on desires (like Desire View). No major theory holds this.  
     - **Pattern: Mostly As but C in Q10.**  
       - **Why incoherent?** Claims death is always bad (A in Q1,4,6,9) but prenatal non-existence isn’t (C in Q10), while also saying late birth isn’t bad (C in Q3). Inconsistent.  

  ---

  ### Why This Structure?  
  - **Concrete > Abstract:** Uses scenarios to bypass labels.  
  - **Distinctions First:** Questions designed to isolate intuitions about deprivation, experience, symmetry, and desire.  
  - **Honest Ambiguity:** Flags where views overlap (e.g., **Asymmetric Deprivation** vs. **Conditional Badness**) instead of forcing false splits.  
  - **For High Schoolers:** Avoids jargon; uses relatable cases.  

