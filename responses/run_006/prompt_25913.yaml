  ok so for my philosophy club i've been reading about consciousness and i've ended up with this set of views and i genuinely can't tell if they all fit together or if i'm holding something incoherent. here's what i think:

  (1) the physical world is causally closed — every physical event has a sufficient physical cause, no spooky stuff needed
  (2) consciousness is real, like there's definately something it's like to be me, qualia exist etc
  (3) conscious mental states don't cause physical events — they're epiphenomenal. this seems to follow from (1) plus the idea that if consciousness did cause physical stuff we'd have to either deny causal closure or say consciousness just IS physical, which i'm not sure about
  (4) i can know about my own conscious experiences and talk about them — i mean i'm doing it right now
  (5) knowledge requires some kind of causal connection between the thing known and my belief about it — otherwise it's just luck

  i feel like (3), (4), and (5) are maybe in trouble together? like if my conscious experiences don't cause anything, how do they cause me to form beliefs about them or say words about them? and if my beliefs about my own consciousness are caused entirely by brain processes that would happen regardless of whether the consciousness was there, then how can i know i'm conscious? that seems weird.

  but i'm not sure if i'm missing something that dissolves this, or if some of these are only apparently in tension. also maybe (1) and (2) are in tension in a way i haven't spotted. can you go through these and tell me which pairs are actually in tension, how bad each tension is, and what the cheapest fix would be? rank them by severity. and please write in british english.
