prompt: |-
  Right, I've been going round in circles on this and I want the full spec before I read any more opinions. Most people assume that destroying a habitat — draining a marsh, clearing a bit of woodland — is obviously bad for the animals, because animals get killed or pushed out. But the more I think about wild animal lives, the less obvious that is. Most of them die young, from starvation, disease, being eaten, parasites, cold; the average wild animal's life seems pretty grim. So it's not at all clear to me that a bigger habitat means more good lives on balance, rather than just more suffering packed in. I want to know what a theory would actually have to get right before it could tell me wether habitat destruction is good or bad overall for the animals themselves — not for biodiversity, not for the ecosystem as some abstract thing, just for the net suffering of the creatures that would live there.

  Give me the requirements list. What cases does it have to handle, what distinctions can't it collapse, what facts from ecology can't it just ignore? For each requirement, say why it's a requirement. For instance, I can see that animals killed now and animals that would have existed but never get born might be very different things, but I don't know whether a good theory has to treat them differently or whether that's a red herring. Then mark which requirements are non-negotiable and which are more like preferences that different people bring to the question. And if one requirement does the most to sort out the usual answers — leave nature alone, or less habitat is always better because fewer wild animals — tell me which one and why. I don't need a full scorecard of every position, just the spec and maybe how the two obvious ones do against it. A table is fine.
reasoning: |-
  Okay, the user wants a comprehensive spec for evaluating whether habitat destruction is good or bad for wild animals' net suffering. Let me start by understanding their main concern. They're skeptical about the assumption that destroying habitats is inherently bad because wild animal lives are full of suffering. They mention that most animals die young from harsh causes, so reducing their numbers might reduce overall suffering. But they want a rigorous framework to analyze this.

  First, I need to identify the core requirements for such a theory. The user emphasized focusing solely on net suffering, not biodiversity or ecosystems. So Requirement 1 is Non-Anthropocentrism: the theory must center on individual animals' experiences, not human-centric values like biodiversity. Ignoring this would miss the user's ethical focus.

  Next, considering both actual deaths and potential future lives. The user brought up animals killed now versus those never born. That's crucial. Requirement 2 is Differential Valuation: the theory must account for existing animals dying versus non-existent animals not being born. This is non-negotiable because conflating the two leads to incorrect ethical conclusions.

  Then, assessing the quality of life in habitats. The user mentioned varying conditions—some habitats are harsher than others. Requirement 3: Habitat Quality Variation. Without this, you couldn't compare different habitats' impact on suffering. This is also non-negotiable because habitats differ in resources and threats.

  Population dynamics is another key factor. Destroying a habitat affects not just immediate deaths but future population sizes. Requirement 4: Population Dynamics. The theory needs to model how populations rebound or stabilize after destruction. If ignored, you might underestimate long-term effects.

  The user also needs to consider density-dependent effects. Requirement 5: Density-Dependent Welfare. Higher density can increase suffering through competition. Destroying habitat might reduce density, improving welfare for survivors. This is essential as it directly influences suffering levels.

  Substitution effects (Requirement 6) are tricky. Animals might move to other habitats, affecting suffering there. Ignoring this could miss ripple effects. This might be less critical if migration is minimal, but it's still important.

  Timeframe (Requirement 7) matters because short-term deaths vs long-term population changes have different ethical weights. Non-negotiable since suffering impacts vary over time.

  Uncertainty (Requirement 8) must be addressed. Ecological systems are complex; models need to handle unknowns. This is non-negotiable to avoid overconfidence.

  Normative Framework (Requirement 9) involves ethical stances like total suffering vs average. The user needs to decide this, but the theory should accommodate different views.

  Now, which requirement challenges common positions? Requirement 5 (Density-Dependence) is key. "Leave nature alone" assumes habitats minimize suffering, but if density increases suffering, reducing habitat might help. Conversely, "less habitat is always better" ignores that some habitats have lower suffering. This requirement forces a nuanced analysis.

  The user might have deeper needs: seeking a structured way to evaluate ethical interventions in nature, possibly for practical decisions like conservation policies. They might also want clarity on moral responsibilities towards wild animals without relying on traditional ecological values.

  I should ensure each requirement is justified, highlighting non-negotiables. The table should contrast common positions. Also, emphasize that existing theories often fail on Requirements 2, 4, and 5, leading to oversimplified conclusions. The user needs this framework to cut through assumptions and address the core ethical dilemma.
answer: |-
  Here's the full specification for a theory evaluating whether habitat destruction reduces net wild animal suffering, structured as requested. The requirements focus on logical coherence, ecological reality, and ethical rigor.

  ### Core Requirements for a Net Suffering Theory

  | # | Requirement                  | Why It's Required                                                                                                                               | Non-Negotiable? |
  |---|-----------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|-----------------|
  | **1** | **Non-Anthropocentrism**     | Must evaluate outcomes *solely* from the perspective of wild animal welfare (suffering/flourishing), ignoring human values like biodiversity, "naturalness," or ecosystem health. | ✅ Yes          |
  | **2** | **Differential Valuation**   | Must distinguish between:<br>- **Existing animals** (killed/displaced by destruction)<br>- **Future potential animals** (never born due to reduced carrying capacity)<br>*Why*: Ethically, killing an existing sentient being is distinct from preventing a potential life. Ignoring this collapses crucial moral distinctions (e.g., is destruction more like murder or contraception?). | ✅ Yes          |
  | **3** | **Habitat Quality Variation** | Must account for differences in baseline welfare across habitats (e.g., resource-rich vs. barren, high-predation vs. low-predation).<br>*Why*: Destroying a high-suffering marsh might be net-positive; destroying a low-suffering woodland might be net-negative. "Average wild animal" metrics are insufficient. | ✅ Yes          |
  | **4** | **Population Dynamics**      | Must model how destruction affects *long-term population size and turnover rates*, not just immediate deaths.<br>*Why*: If destruction reduces carrying capacity by 50%, does the population stabilize at 50%? Or rebound via higher birth rates? This determines the scale of prevented future lives. | ✅ Yes          |
  | **5** | **Density-Dependent Welfare** | Must incorporate how population density affects individual welfare (e.g., competition for food/mates, disease spread, stress).<br>*Why*: A smaller habitat might sustain fewer animals, but if survivors experience *less* suffering due to lower density, net welfare could improve. | ✅ Yes          |
  | **6** | **Substitution Effects**     | Must consider if displaced animals migrate to other habitats, altering welfare there.<br>*Why*: Destruction might not eliminate suffering but merely relocate it, potentially increasing density/competition elsewhere. | ⚠️ Context-Dependent |
  | **7** | **Timeframe Consistency**    | Must specify the evaluation timeframe (short-term deaths vs. long-term population effects) and justify it.<br>*Why*: Suffering from immediate displacement differs ethically from suffering prevented over centuries. A theory must be temporally bounded. | ✅ Yes          |
  | **8** | **Uncertainty Integration**  | Must acknowledge and quantify key uncertainties (e.g., welfare weight of starvation vs. predation, population resilience).<br>*Why*: Ecological systems are complex and stochastic; false precision invalidates conclusions. | ✅ Yes          |
  | **9** | **Normative Framework**      | Must declare its stance on:<br>- **Total Suffering** (minimize aggregate suffering)<br>vs.<br>- **Average Suffering** (minimize suffering per individual)<br>*Why*: This dictates whether preventing future lives reduces net suffering (total view) or is neutral (average view). | △ Preference    |

  ---

  ### How Key Positions Fare Against Critical Requirements
  The most decisive requirement is **#5 (Density-Dependent Welfare)**. It exposes oversimplifications in both common positions:

  | Position                  | Failure on Requirement #5                                                                 | Overall Viability |
  |---------------------------|-------------------------------------------------------------------------------------------|-------------------|
  | **"Leave Nature Alone"**  | Assumes stable habitats minimize suffering, ignoring that high density *increases* suffering (e.g., starvation, infanticide). Ignores welfare gains from population reduction. | ❌ Incomplete     |
  | **"Less Habitat = Less Suffering"** | Assumes reducing population *always* reduces net suffering. Ignores that:<br>- Survivors may suffer *more* in degraded remnants.<br>- High-quality habitats might enable flourishing lives worth preserving. | ❌ Incomplete     |

  **Why #5 is pivotal**: Wild animal welfare is intensely density-dependent. If reducing population size via habitat loss *decreases* per-capita suffering (e.g., less resource competition), destruction could be net-positive. If it *increases* per-capita suffering (e.g., fragmentation exposes animals to predators), it’s net-negative. Neither default position engages with this complexity.

  ---

  ### Key Takeaways
  - **Non-Negotiables (✅)**: The theory **must** address #1–5, #7, and #8. Without these, it ignores fundamental ethical distinctions or ecological realities.
  - **Preference (△)**: #9 depends on whether "better" means *fewer total suffering experiences* or *less suffering per individual*.
  - **The Crux**: A credible theory must quantify how habitat loss changes **long-term population density** and **density-welfare relationships**. If density decreases and welfare improves for survivors, destruction *might* reduce net suffering—but only if the habitat’s baseline suffering is high (#3) and future lives are prevented (#2, #4).  
  - **No Free Pass**: Even a rigorous theory faces irreducible uncertainty (#8) about subjective animal experiences. Absolute conclusions are likely impossible; probabilistic ranges are essential.

  This spec forces engagement with the brutal arithmetic of wild animal existence: not just *how many* lives are affected, but *how well or poorly* those lives unfold under different ecological constraints.
