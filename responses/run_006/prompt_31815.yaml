prompt: |-
  Right, I keep going round in circles on consequentialist cluelessness, and before I read another response I want the full spec of what any adequate response has to do. You're a professional philosopher working on normative ethics and decision theory; take your time and think through the candidate criteria before you commit — maybe brainstorm first.

  The thing I want the desiderata for is this: a theory of how a consequentialist should choose, given that the long-run consequences of nearly any action ramify in ways nobody can actually track. By adequate I mean it should either tell an agent what to do, or give a principled explanation of why nothing can, and it should do that without quietly ceasing to be consequentialist. I dont just want a survey of positions; I want the requirements list first, with the case or consideration behind each requirement.

  In particular I want to know:

  - which requirements are non-negotiable and which are just one camp's preference (e.g., determinate guidance for every choice, or the demand that the theory make no empirical assumptions about how the world works);

  - whether the distinction between simple and complex cluelessness — roughly, cases where you have some probability distribution over outcomes versus cases where you cant even form one — forces different requirements, and whether a single theory can meet both;

  - how a theory can recover the cases where we're still confident despite cluelessness — e.g., that giving to a well-evidenced charity beats burning the money — without quietly helping itself to the empirical claim it's supposed to earn;

  - whether the split between a criterion of rightness and a decision procedure helps, or whether saying the right move is to adopt whatever rules have the best expected consequences is just dodging the question;

  - and most of all, whether some subset of the desiderata is jointly unsatisfiable. My own suspicion is that there's a trilemma here: you can't have (i) determinate action-guidance, (ii) a purely outcome-based criterion, and (iii) no unargued empirical claim that long-run effects wash out, all at once. I'd like that made precise, or shown to be false.

  Then, briefly, score the usual responses against the list — naive maximising consequentialism, the washing-out / expected-value line, indirect or sophisticated consequentialism, and satisficing or robust-choice views. But keep the weight on the criteria and their motivation, not the scorecard. No bibliography, please — I want the reasoning, not citations.

  One more thing: as you go, flag which criteria are settled among people who actually work on this and which are genuinely contested, and don't present a contested view as the consensus.
reasoning: |-
  Okay, the user is deep into consequentialist cluelessness and wants a clear set of criteria for evaluating solutions. They’re frustrated with circular debates and need a structured framework. Let me unpack their query.

  First, they want desiderata for a theory addressing how consequentialists should act given unpredictable long-term consequences. The theory must either guide action or explain why it can’t, without abandoning consequentialism. Key points:  
  - Non-negotiable vs. optional requirements (e.g., determinate guidance for every choice might be optional).  
  - Handling simple vs. complex cluelessness (probability distributions vs. total ignorance).  
  - Recovering intuitive judgments (e.g., donating > burning money) without smuggling in empirical assumptions.  
  - Whether separating criterion of rightness from decision procedures helps or dodges the issue.  
  - Their trilemma suspicion: can’t have guidance + pure outcome-based criterion + no "washout" assumption simultaneously.  

  I need to approach this systematically. The core tension in cluelessness is that consequentialism demands outcome optimization but we can’t access the relevant outcome knowledge. Any solution must navigate:  
  1. **Fidelity to consequentialism**: The theory must genuinely derive norms from outcomes, not covertly shift to deontology.  
  2. **Action-guidance**: Needs to either prescribe actions or justify why it can’t. This is likely contested—some ethicists insist on guidance, others accept indeterminacy.  
  3. **Epistemic humility**: Can’t assume unrealistic knowledge (e.g., "long-run effects cancel out" without proof). This feels non-negotiable; handwaving empirical claims would beg the question.  
  4. **Rescuing intuitions**: Must explain why obvious cases (donating > burning) hold despite cluelessness. A good theory shouldn’t collapse into paralysis.  

  For simple vs. complex cluelessness:  
  - **Simple**: We have probabilities but outcomes are too chaotic (e.g., climate policy impacts). Requires handling massive uncertainty.  
  - **Complex**: No sensible probability distribution (e.g., butterfly effect ethics). Might need different tools, like domain restrictions or heuristics.  
  A unified theory would be elegant but demanding—perhaps through multi-tiered approaches (e.g., expected value for simple, proxies for complex).  

  The criterion/decision-procedure split:  
  - Separating "what’s right" from "how to decide" helps conceptually (e.g., rules as proxies), but risks feeling evasive if it doesn’t ultimately connect to outcomes. Must show how rules reliably link to consequences.  

  The user’s trilemma is sharp. Let’s formalize it:  
  1. Determinate action-guidance (no paralysis).  
  2. Purely outcome-based criterion (no covert non-consequentialist elements).  
  3. No unjustified "washout" premise.  
  If these are jointly impossible, any solution must relax one. For example:  
  - **Relax guidance**: Accept indeterminacy sometimes (e.g., in complex cases).  
  - **Relax purity**: Allow proxies (e.g., rules) that *approximate* outcomes.  
  - **Relax no-washout**: Argue some empirical assumptions are justified (contested!).  

  Now, evaluating common responses against these criteria:  
  - **Naive maximization**: Fails epistemic humility (ignores cluelessness).  
  - **Expected value**: Struggles with complex cluelessness (no probabilities) and may need washout assumptions.  
  - **Indirect consequentialism**: Uses rules, but must prove they’re outcome-optimal without circularity.  
  - **Satisficing/robustness**: Avoids maximization but needs a non-arbitrary threshold.  

  Professional consensus notes:  
  - Most agree cluelessness is a real problem (non-negotiable).  
  - Guidance vs. purity tradeoff is contentious.  
  - Washout assumptions are widely viewed as suspect without evidence.  

  The user’s suspicion seems correct: the trilemma likely holds. Solutions involve prioritizing some criteria over others—e.g., indirect consequentialism relaxes purity for guidance, while expected value risks washout assumptions. A unified theory might tier approaches: expected value where possible, robustness elsewhere, while rigorously defending proxies. But the tension remains fundamental.
answer: |-
  Below is a structured desiderata list for an "adequate" response to consequentialist cluelessness, grounded in the core commitments of consequentialism and decision-theoretic coherence. I'll first define the criteria (including non-negotiables vs. contested preferences), then address your specific queries, including the trilemma. Finally, I'll briefly score major approaches against the criteria. I'll flag consensus/contested points throughout.

  ---

  ### **I. Desiderata for an Adequate Response**  
  *Non-negotiables* stem from consequentialism’s definition and the cluelessness problem itself. *Contested* items reflect methodological divides (e.g., practical vs. theoretical adequacy).  

  1. **Consequentialist Fidelity (Non-negotiable)**  
     - **Requirement**: The theory must ground norms *ultimately* in outcomes (value realized in the world). It cannot covertly revert to deontology, virtue ethics, or non-teleological constraints.  
     - **Why**: Consequentialism’s core is that rightness *is* a function of outcomes; abandoning this dissolves the view. Cluelessness must be solved *within* the framework.  

  2. **Epistemic Non-Arbitrariness (Non-negotiable)**  
     - **Requirement**: No unjustified empirical assumptions (e.g., "long-run effects cancel out," "causal chains are neutral"). Assumptions must be defensible or negligible; wishful thinking invalidates the solution.  
     - **Why**: Cluelessness arises *because* we lack knowledge; smuggling in assumptions ignores the problem.  

  3. **Action-Guidance Integrity (Contested)**  
     - **Requirement**: The theory must either (a) provide actionable guidance, or (b) explain why guidance is impossible in a principled way (e.g., via epistemic limitations).  
     - **Why**: Ethics must connect to practice. *Contested aspect*: Whether "indeterminacy" is acceptable (some demand universal guidance; others see cluelessness as legitimately paralyzing).  

  4. **Intuition Recovery (Non-negotiable)**  
     - **Requirement**: Must explain why we’re confident in clear cases (e.g., donating > burning money) *without* presupposing the empirical facts cluelessness problematizes (e.g., "donating clearly has better long-run effects").  
     - **Why**: If a theory can’t handle paradigmatic cases, it fails.  

  5. **Scope Generality (Non-negotiable)**  
     - **Requirement**: Must address *both* simple cluelessness (probabilities exist but are incalculable) and complex cluelessness (no sensible probability distribution).  
     - **Why**: Both types arise in real decisions; a solution ignoring one is incomplete.  

  6. **Theoretical Parsimony (Contested Preference)**  
     - **Requirement**: Avoid ad hoc or overly complex machinery (e.g., arbitrary thresholds, unexplainable priors).  
     - **Why**: Philosophical solutions should be principled. *Contested*: Some prioritize practicality over elegance.  

  ---

  ### **II. Addressing Your Specific Queries**  
  **Q1: Simple vs. Complex Cluelessness**  
  - **Distinction**:  
    - *Simple*: You have a probability distribution over outcomes, but it’s intractable (e.g., climate policy effects).  
    - *Complex*: No defensible distribution exists (e.g., butterfly-effect chaos).  
  - **Requirements**: A single theory *can* address both if it uses different *tools* for each (e.g., expected value for simple cases; heuristics/robustness for complex). But complex cluelessness demands stricter epistemic constraints (no probabilistic crutches).  

  **Q2: Recovering Clear Cases (e.g., Donating > Burning)**  
  - **How it must work**: Justification must derive from *structural* or *comparative* features, not empirical luck. Examples:  
    - **Dominance Reasoning**: Burning money *never* produces direct good, while donating *might* (even if long-run effects are unknown).  
    - **Proxy Reliability**: Donating leverages systems (charities) designed to optimize outcomes, making it *robustly* better absent defeaters.  
  - **Pitfall**: If the theory assumes "donating usually helps," it violates *Epistemic Non-Arbitrariness*.  

  **Q3: Criterion of Rightness vs. Decision Procedure**  
  - **Does it help?** Only superficially.  
    - *The split*: Criterion = "What makes acts right?" (e.g., maximizing actual value). Decision procedure = "How to choose?" (e.g., follow rules with best *expected* value).  
    - **Problem**: For consequentialists, the decision procedure must *track* the criterion. If cluelessness breaks this link (e.g., rules lack expected value due to chaos), the split merely relabels the problem. A rule like "give to effective charities" works only if we can know its *long-run* expected value—which cluelessness denies.  

  **Q4: The Trilemma (Precise Formulation)**  
  Your suspicion is correct. The three desiderata are:  
  > **(i) Determinate Guidance**: For any choice, the theory prescribes a non-arbitrary action (or inaction).  
  > **(ii) Pure Outcome-Based Criterion**: Rightness depends *only* on actual/expected outcomes, not intrinsic features.  
  > **(iii) No Unargued Washout**: No empirical assumption that distant effects net-neutralize or cancel.  

  **Proof of joint unsatisfiability**:  
  - To satisfy (i) and (ii), the theory must assign per-action evaluations (e.g., expected value).  
  - But cluelessness implies we cannot compute expected value for long-run outcomes—violating (i) or needing (iii).  
  - If we keep (i) by invoking washout (e.g., "long-run effects are random, so ignore them"), we violate (iii).  
  - If we keep (i) without washout, we must abandon (ii) (e.g., by using non-outcome factors like rules/virtues).  

  Thus, **any solution must drop one**:  
  - Abandon (i): Accept indeterminacy (e.g., "sometimes no best action exists").  
  - Abandon (ii): Allow non-outcome factors (e.g., "follow rules, even if untrackable to outcomes").  
  - Abandon (iii): Defend a washout premise (e.g., "causal networks are ergodic").  

  ---

  ### **III. Scoring Major Approaches Against Desiderata**  
  *(✔ = Satisfies; ✘ = Fails; ~ = Partially/Contested)*  

  | **Approach**                  | Fidelity | Epistemic Non-Arbitrariness | Guidance Integrity | Intuition Recovery | Scope Generality |  
  |-------------------------------|----------|-----------------------------|---------------------|---------------------|------------------|  
  | **Naive Maximizing**          | ✘        | ✘                           | ✔                   | ✘                   | ✘                |  
  | (Maximize expected value)     |          | *Assumes calculable EVs*    |                     | *Fails in chaos*    | *Only simple cases* |  
  | **Expected Value + Washout**  | ~        | ✘                           | ✔                   | ✔                   | ✔                |  
  | (Assume long-run effects net-neutral)| *If washout justified* | *Washout unargued* |                     | *Uses dominance*   |                  |  
  | **Indirect Consequentialism** | ~        | ~                           | ✔                   | ✔                   | ~                |  
  | (Follow best rules)           | *If rules track outcomes* | *Rules must be justified* |                     | *Via proxy success*| *Fails if rules break down* |  
  | **Satisficing/Robustness**    | ~        | ✔                           | ✔                   | ~                   | ✔                |  
  | (e.g., "Do robustly good enough")| *If threshold outcome-grounded* |                  | *May be arbitrary*  | *Via dominance*    | *Handles chaos*  |  

  #### **Key Takeaways**:  
  - **Naive Maximizing**: Fails *Fidelity* and *Epistemic Non-Arbitrariness* by ignoring cluelessness. Consensus: inadequate.  
  - **Washout Views**: Fail *Epistemic Non-Arbitrariness* unless washout is empirically defended (contested; most see it as circular).  
  - **Indirect Views**: Struggle with *Fidelity*—if rules can’t be outcome-justified due to cluelessness, they become deontic.  
  - **Satisficing/Robustness**: Best at *Epistemic Non-Arbitrariness* and *Scope*, but *Fidelity* contested: is "good enough" outcome-based?  

  #### Consensus Notes:  
  - **Non-negotiable**: All agree solutions need *Fidelity* and *Intuition Recovery*. *Epistemic Non-Arbitrariness* is near-universal.  
  - **Contested**: *Guidance Integrity* (must we always prescribe acts?) and *Scope Generality* (can one theory handle all cluelessness?).  
  - **Emerging View**: Many now accept the trilemma and drop pure outcome-guidance (e.g., use "cluelessness-adjusted" decision rules).  

  **Conclusion**: Your trilemma holds—consequentialist cluelessness forces trade-offs. The viable paths are: (1) defend washout (contested), (2) accept indeterminacy, or (3) adopt proxy-based guidance (e.g., robustness) while arguing it *indirectly* serves outcomes. No solution satisfies all desiderata without compromise.
