     - Round 2: Assign half the students (7) to a common group. Roll the die once for the common signal and give it to all 7. The other 7 get independent signals.
     - Round 3: Each student gets an independent signal (like Round 1) and then they discuss.
     - Round 4: Each of the 14 students gets an independent signal (like Round 1). Then the facilitator generates one signal for the 6 extra votes (using the same rule) and casts 6 votes for that signal.
     - Round 5: Designate one student as the expert. The expert gets a signal with p=0.9 (using the 10-sided die: 1-9 for correct, 10 for wrong). The others (13) get signals with p=0.6 (using 10-sided die: 1-6 for correct, 7-10 for wrong).

  3. **Voting**: 
     - Students vote by secret ballot (to avoid peer pressure in non-deliberation rounds). 
     - In Round 3, they vote after discussion.

  4. **Reveal and Scoring**: 
     - After voting, reveal the true state. 
     - Award 5 points to every student if the majority vote is correct. 
     - Award 1 point to each student whose individual vote was correct (regardless of the group).

  We hope this game will provide the experiential learning you are seeking.
answer: |-
  ### **Condorcet Jury Theorem Classroom Game: "Truth & Trust"**

  #### **Learning Objectives**
  - Experience why majority rule outperforms individuals when voters are mildly competent (>0.5) and independent.
  - Feel how **correlated errors** (common cause) or **non-independent deliberation** breaks this advantage.
  - Distinguish between **"majority beats any single voter"** (asymptotic CJT) vs. **"majority likely correct"** (finite groups) vs. **experts beating the majority**.

  #### **Materials**
  - **Hidden Fact Generator**: Two 10-sided dice (d10) or a RNG app.
  - **Voting Tokens**: Red/blue cards (or chips) for votes (1 set/student).
  - **Signal Cards**: Red/blue cards (or paper) for private signals.
  - **Public Signal Board**: Whiteboard or large paper.
  - **Scoreboard**: Tracks individual/group scores.
  - **Timer**: For rounds and deliberation.

  #### **Setup**
  - **Players**: 14 students + facilitator.
  - **Hidden Fact**: Binary state **S** (e.g., `S = RED` or `S = BLUE`). Determined secretly each round.
  - **Competence (p)**: Probability a voter receives the correct signal. Set initially at **p = 0.67** (mildly better than chance).
  - **Rounds**: 5 rounds (see below). Each round = new **S**.

  ---

  ### **Rules & Payoff Scheme**
  #### **Payoff Mechanics**
  - **Group Success**: Majority vote correct → **+5 points** for all.
  - **Individual Success**: Vote matches truth → **+1 point** (regardless of group outcome).
  - **Goal**: Maximize personal points. Emphasize: *"Your 1-point bonus rewards accurate voting, but the 5-point group bonus is larger. Strategize accordingly!"*

  #### **Voting Protocol**
  1. **Signal Revelation**: Students receive signals (private/public) based on round rules.
  2. **Voting**: Secret ballot using red/blue tokens. No abstentions.
  3. **Outcome**: Reveal **S** → update scores.

  ---

  ### **Round Timeline (80 Minutes)**
  #### **Round 0: Introduction (5 min)**
  - Explain rules, payoffs, and goals: *"We’ll simulate group decisions under varying conditions. Your job: Vote accurately to maximize points."*
  - Clarify: *"Signals are probabilistic. You might get it wrong even if you’re ‘competent’."*

  #### **Round 1: Baseline CJT (15 min)**
  - **Conditions**: Private signals, **p = 0.67**, independence.
  - **Mechanics**:
    - Set **S** (e.g., roll d10: 1–5 → RED, 6–10 → BLUE).
    - Each student gets a **private signal**:  
      - If **S = RED**, d10 roll: 1–7 → RED, 8–10 → BLUE (*p = 0.67*).  
      - If **S = BLUE**, d10 roll: 1–7 → BLUE, 8–10 → RED (*p = 0.67*).  
    - Students vote based *only* on their signal.  
  - **Debrief Prep**: Record votes and compute majority.  
  - **Expected Outcome**: Majority correct >90% of the time (n=14, p=0.67).

  #### **Round 2: Correlated Errors (15 min)**
  - **Conditions**: Introduce **common cause** (public signal + private signals).
  - **Mechanics**:
    - Set **S** (same as Round 1).
    - **Public Signal**: Roll d10 once (same competence: *p = 0.67*). Display result (e.g., "Public Signal: RED").
    - **Private Signals**: As in Round 1.
    - Students see *both* public and private signals → vote.
  - **Expected Outcome**: If public signal is wrong (≈33% chance), it biases votes → majority error likely.

  #### **Round 3: Deliberation (20 min)**
  - **Conditions**: Private signals + **open discussion** before voting.
  - **Mechanics**:
    - Set **S** (same as Round 1).
    - Private signals generated (p = 0.67).
    - **5-min discussion**: Students share signals/opinions (but *not* allowed to show signal cards).
    - Vote after discussion.
  - **Expected Outcome**: Herding/cascades likely → votes correlate even if signals differ.

  #### **Round 4: Adding Correlated Voters (10 min)**
  - **Conditions**: Add 4 voters with **identical correlated signals**.
  - **Mechanics**:
    - Set **S** (same as Round 1).
    - 14 students get independent private signals (p = 0.67).
    - **Facilitator adds 4 "phantom voters"**:  
      - Roll *one* d10 → same signal given to all 4 (p = 0.67).  
      - Cast 4 identical votes based on this signal.  
    - Total votes: 14 (students) + 4 (phantom) = 18. Majority from all 18.
  - **Expected Outcome**: If the phantom signal is wrong (≈33% chance), their 4 votes push majority toward error.

  #### **Round 5: Expert vs. Majority (10 min)**
  - **Conditions**: One **expert** (p = 0.90) + 13 **low-competence voters** (p = 0.55).
  - **Mechanics**:
    - Set **S** (same as Round 1).
    - **Expert**: Roll d10 → 1–9: correct signal, 10: wrong (*p = 0.90*).  
    - **Others**: Roll d10 → 1–6: correct signal, 7–10: wrong (*p = 0.55*).  
    - All vote. Compare expert’s vote vs. majority.
  - **Expected Outcome**: Expert often beats majority (expert ≈90% correct; majority ≈75% correct).

  ---

  ### **Debrief (15 min)**
  **Map game moments to CJT assumptions/failures**:  
  | **CJT Assumption**       | **Round 1 (Baseline)**         | **Failure Modes**                              |  
  |--------------------------|--------------------------------|------------------------------------------------|  
  | **Competence >0.5**      | p=0.67 >0.5 → works.           | –                                              |  
  | **Conditional Independence** | Private signals → independence. | **Round 2**: Public signal → common cause.<br>**Round 4**: Phantom voters → correlated errors. |  
  | **Sincere Voting**       | Voters use signals honestly.   | **Round 3**: Deliberation → herding/cascades.  |  
  | **Equal Competence**     | All p=0.67.                    | **Round 5**: Expert (p=0.90) vs. others (p=0.55). |  

  #### **Key Discussion Points**
  1. **Round 1**: *"Why did majority outperform individuals? Felt independence + mild competence."*  
  2. **Round 2 & 4**: *"How did a single public signal or phantom voters break independence? Felt like pooling one signal, not many."*  
  3. **Round 3**: *"Did deliberation pool information or create herd behavior? How did early speakers sway others?"*  
  4. **Round 5**: *"When does an expert beat the majority? CJT assumes equal competence. Experts break this."*  
  5. **Critical Distinctions**:  
     - *"Majority beats any single voter" ≠ "Majority always right"* (finite n).  
     - Independence is fragile (public signals/deliberation → common cause).  
     - Online crowds often ignore independence → "wisdom of crowds" fails.  

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Round 3 (deliberation) → students lie or dominate discussion.  
     **Fix**: Brief students: *"Share truthfully—your payoff depends on group success!"* Enforce time limits.  
  2. **Problem**: Randomness → majority wrong in Round 1 (low probability but possible).  
     **Fix**: *"CJT is probabilistic. One round ≠ theorem—focus on the design."* Use pre-rolled dice to ensure S ≠ majority if needed.  
  3. **Problem**: Round 5 confusion (expert vs. majority).  
     **Fix**: Clarify pre-round: *"Expert: high accuracy. Others: barely better than coin flips."*  

  ---

  ### **What the Game Cannot Reproduce (Facilitator Notes)**
  - **Asymptotic Behavior**: *"With large juries (n→∞), majority →100% correct. Our n=14 shows the trend, not the limit."*  
  - **True Independence**: *"In this room, votes aren’t perfectly independent—you see/sense others. Real independence requires isolation."*  
  - **Known Competence**: *"CJT assumes known p>0.5. In reality, we estimate competence—sometimes poorly (e.g., overconfident experts)."*  
  - **Strategic Voting**: *"We assumed sincere voting. In practice, incentives can distort votes (e.g., voting against signal to ‘swing’ outcomes)."*  

  ---

  ### **Post-Game Takeaways**
  - **CJT’s Power**: Independence + mild competence → majority excels.  
  - **CJT’s Fragility**: Common causes (public signals) or deliberation → correlation → failures.  
  - **Experts > Majority?**: When competence disparities exist, trust the expert.  
  - **Real-World Caution**: Online crowds often violate independence → question "wisdom of crowds" claims.  

  By experiencing CJT’s successes and failures **mechanically**, students will internalize its nuances—prepping them to dissect folk-theorem misuses in prediction markets, voting, and beyond.
