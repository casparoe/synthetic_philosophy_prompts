  1. **Baseline CJT**: Private signals, independent and identically distributed (i.i.d.), with p>0.5. This should show that the majority vote is more likely to be correct than any single voter.

  2. **Correlated Errors (Common Cause)**: In this round, we introduce a common cause that can lead to correlated errors. For example, we can have a public signal (which might be wrong) that all participants see in addition to their private signals. Alternatively, we can have a "rumor" that spreads to some participants and biases their signals.

  3. **Deliberation Round**: Participants are allowed to discuss before voting. This can lead to information cascades and correlated votes even without a common cause.

  4. **Adding Voters with Correlated Errors**: We add new voters (could be played by the same students or by the facilitator) who do not have independent signals. For example, they might all get the same signal (which is generated with the same competence as the others) but then their votes are perfectly correlated. We will show that adding such voters can reduce the group's accuracy.

