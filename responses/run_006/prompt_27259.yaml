prompt: |-
  I'm teaching a sophomore-level intro course and I want to do one 75-minute session on Hofstadter's 'A Person Paper on Purity in Language.' I dont need you to explain the piece to me — I know it. I need a plan for how to teach it. The students haven't read it and I'll have them read it in class, maybe 20 minutes. The thing I want them to come away with is not 'sexist language is bad' (they'll nod through that part) but how the satire actually does its work: the race-transposition, the default-generic mechanism (white standing in for man, whe/ble for he/she, chairwhite for chairman), the way the narrator's reasonable columnist voice does the heavy lifting, and why the piece doesn't argue 'racism is bad' but makes you feel the absurdity of the gender case by analogy. Plan the arc: what has to be in place before they read it and why they can't just be thrown in, the one example or moment in the text I should anchor the discussion on (I was thinking the moon-landing bit, but tell me if something else carries better), the misconceptions to expect — students thinking it's only about race, or taking the narrator at face value, or concluding sexist language and racist language are just the same thing — and exactly where in the session I should head each one off. Also say what to leave out at this level, and give me one final question or short in-class writing prompt that would show me whether they got the mechanism rather than just the moral. Keep the whole plan under 1,000 words.
reasoning: |-
  Okay, the user is teaching a sophomore-level intro course and wants a lesson plan for Hofstadter's "A Person Paper on Purity in Language." They don't need an explanation of the piece but a structured plan to teach it effectively. The key goal is for students to understand the satirical mechanism—how the race-gender analogy works, the default-generic concept, and the narrator's role—rather than just the surface message against sexist language.

  First, I need to consider the students' background. They haven't read the text yet, so pre-reading setup is crucial. The user mentioned potential misconceptions: students might think it's only about race, take the narrator at face value, or equate sexist and racist language structures. The plan must preempt these.

  The user suggested the moon-landing example as an anchor point. I agree it's effective because it's vivid and shows the absurdity through a historical reference. Other sections might not be as punchy. The challenge is ensuring students grasp the satire's construction without getting sidetracked by the race analogy alone.

  Breaking down the session: 75 minutes total. Allocate 20 minutes for reading, which is tight but feasible. Pre-reading setup should clarify key terms like "default generic" and establish the context of gender-neutral language debates in the 80s. This prevents students from missing the satire's foundation.

  During reading, guiding questions are essential. Asking students to note where they felt uncomfortable helps them engage emotionally, which is key to the satire's impact. Post-reading, starting with the moon-landing example makes the mechanism tangible. Highlighting specific terms like "chairwhite" versus "chairperson" illustrates the linguistic default.

  Addressing misconceptions: Early in the discussion, clarify that the race analogy is a tool, not the subject. When discussing the narrator, prompt students to question the reasonable tone. Later, differentiate between analogous structures and distinct societal contexts of racism vs. sexism.

  The final assessment—a writing prompt on why Hofstadter used race instead of directly arguing against sexist language—targets the mechanism. It requires understanding the analogy's effectiveness beyond moral preaching.

  What to omit: Hofstadter's technical terms like "tone argument" and deeper translation theory. Sophomores might get bogged down. Focus on the core satirical strategy.

  Timing each segment is vital. Buffer time for discussions that might run long, especially the initial reactions. Keeping summaries concise ensures covering all parts without rush. The user's emphasis on "feeling the absurdity" through analogy is central, so every element should scaffold that.
answer: |-
  Here’s a focused 75-minute lesson plan targeting the satirical mechanism:

  **Pre-Reading Setup (25 mins):**  
  *Crucial: Students need conceptual tools BEFORE encountering the text to see the machinery, not just the message.*  

  1.  **Hook & Context (5 mins):**  
      *   "How many ways can you refer to a single, unspecified person in English?" (Elicit: he, they, he/she, one, person, etc.)  
      *   "Why might someone in the 1980s argue *against* using 'he' as the default? What’s the problem?" (Establish: Exclusion, invisibility, reinforcing male-as-norm).  
      *   **Key Term Intro:** Define **"Default Generic"** clearly: "Using a specific group term (like 'he' or 'man') to represent *everyone*, making that group the invisible standard."  

  2.  **Introducing the Analogy Tool (15 mins):**  
      *   "Today we look at a famous satire that doesn't *argue* directly against sexist language. Instead, it makes you *feel* its absurdity by using a powerful analogy. What’s one area where language exclusion/invisibility has been highly visible and painful?" (Guide towards race).  
      *   **Explicit Setup:** "The author, Douglas Hofstadter, performs a **transposition**. He takes arguments *against* gender-neutral language (common then) and replaces gender terms with race terms: 'he' becomes 'white', 'she' becomes 'whe' or 'ble', 'man/men' becomes 'white/whites', 'chairman' becomes 'chairwhite'."  
      *   **Crucial Point:** "The narrator *sounds* perfectly reasonable while defending these racially exclusive terms. Pay attention to *how* that reasonable tone makes the underlying prejudice feel both shocking and illogical."  
      *   **Pre-empt Misconception #1 (It's only about race):** "Remember, the race terms are the *vehicle*. The *tenor*, the actual target, is gender. Don't get distracted by the surface layer."  

  3.  **Reading Task (20 mins):**  
      *   Distribute text.  
      *   **Guiding Questions (Write on Board):**  
          1.  Where did you physically wince or feel uncomfortable? *Why*?  
          2.  How does the narrator make the arguments *sound* logical? (Tone, examples, concessions).  
          3.  Find 1-2 examples where the "default generic" concept is most glaringly absurd when applied to race.  

  **Post-Reading Discussion (30 mins):**  
  *Focus relentlessly on HOW the satire works.*  

  1.  **Initial Reactions & Finding the Anchor (10 mins):**  
      *   Start with Guiding Q1: "Where did you wince? Why?" (Let them share visceral reactions – establishes the text's *effect*).  
      *   **Anchor on the Moon Landing (Crucial):**  
          *   "Let's look closely at the moon landing paragraph. Read it again silently."  
          *   "What specific phrase hits hardest? Why?" (Likely: "A whiteman's foot" / "It was a white man from white male America").  
          *   **Dissect the Mechanism:**  
              *   "What is the *literal* historical fact being described?" (A man landed).  
              *   "What does the narrator *do* with that fact using the transposed language?" (Turns descriptive fact into a claim of racial exclusivity/normativity).  
              *   "How does the *reasonable*, almost celebratory tone make this feel *more* absurd, not less?" (Highlight: Tone vs. Content clash).  
          *   *Why this anchor?* It's short, historically resonant, uses the default generic blatantly ("whiteman"), and the tone clash is stark.  

  2.  **Deconstructing the Machinery (15 mins):**  
      *   **Narrator's Voice:** "Find places where the narrator sounds reasonable, even conciliatory ('chairperson' concession), yet the underlying premise is horrifying. How does this mimic real arguments against gender-neutral language?" (Shows how prejudice hides behind 'logic' & 'tradition').  
      *   **Default Generic in Action:** "Find other examples like 'chairwhite', 'freshwhite', 'whiteslaughter'. How does simply swapping the terms expose the inherent exclusion in the original?"  
      *   **Pre-empt Misconception #2 (Taking Narrator Seriously):** "Could anyone actually believe the narrator's arguments *about race* as presented? Why not? What does that tell us about how we *should* read similar arguments about gender?" (Makes explicit: The narrator is the *satirical device* embodying bad faith arguments).  
      *   **Pre-empt Misconception #3 (Equating Sexism/Racism):** "Does the piece argue sexist language is *exactly the same* as racist language in all ways? Or is it using the *structure of the language argument* as an analogy? What's the difference?" (Emphasize: It shows the *logical absurdity* of the default generic mechanism is similar; it doesn't claim the social histories/impacts are identical).  

  3.  **The Core "Aha" (5 mins):**  
      *   "Hofstadter doesn't *tell* us 'sexist language is bad'. How does he *make* us feel its absurdity? What's the core mechanism?" (Force the answer: By using a jarring analogy (race) where we immediately recognize the prejudice and illogic, forcing us to see the same flaw in the gender argument we might have dismissed or accepted passively).  

  **Assessment & Wrap-up (5 mins):**  
  *   **Writing Prompt (3 mins):** "In 2-3 sentences, explain *why* Hofstadter used a race/gender transposition instead of writing a straightforward essay arguing against sexist language. What specific effect does this satirical strategy achieve that a direct argument might not?"  
  *   **Why this prompt?** It directly tests understanding of the analogical mechanism and its emotional/rhetorical power over direct moralizing. Collect or have 2-3 share.  

  **What to Omit:**  
  *   Deep dives into complex translation theory (Hofstadter's original context).  
  *   Extended debate *about* racism vs. sexism beyond the linguistic mechanism analogy.  
  *   Every single example in the text – use the anchor (Moon) plus 2-3 others.  
  *   Hofstadter's specific terms like "tone argument" unless a student raises it.  

  **Key to Success:** Rigorously frame EVERY discussion point around the *construction of the satire* ("How does X technique work here?") rather than the moral message ("Is this bad?"). Constantly loop back to the pre-reading concepts (Default Generic, Transposition, Narrator as Device). The Moon Landing anchor provides a concrete, powerful microcosm of the entire strategy.
