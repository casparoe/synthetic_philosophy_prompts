answer: |-
  You are right to feel that the existing vocabulary is failing you. There is no single, established clinical or philosophical term that captures exactly what you are describing.

  The near-misses you listed are near-misses for a reason: they pathologize the caregiver (burnout), imply a transactional imbalance (codependency), or suggest a conscious rationalization (adaptive preferences). What you are describing is neither a sickness nor a strategy. It is a **structural cost of a specific kind of virtue.**

  Here is the carving you need: the nearest existing concepts, why they fail, a proposed coinage for the phenomenon, the mechanism behind it, and how to interview for it.

  ### 1. The Near-Misses (and why they cut)

  **Role Engulfment (Sociology)**
  *   **What it is:** When a single social role (e.g., "caregiver") consumes all other identity markers (e.g., "artist," "friend," "partner").
  *   **Why it's close:** It describes the reorganization of life.
  *   **Why it fails:** It describes the *social* label, not the *internal* capacity. A person can be role-engulfed but still know what they want for dinner; they just don't get to choose. Your subjects *cannot generate* the choice. Engulfment is about time; you are writing about *will*.

  **Relational Constitution of Self (Feminist Care Ethics)**
  *   **What it is:** The philosophical view (held by thinkers like Eva Feder Kittay and Nel Noddings) that the self is not an isolated atom but is constituted through relationships. To care is to become part of the other.
  *   **Why it's close:** It validates the "virtue" aspect. It treats the merging as ontological, not just practical.
  *   **Why it fails:** Care ethics usually frames this as a positive moral state (interdependence). It lacks a vocabulary for when the relationship ends and the "constituted self" collapses because its counterpart is gone. It treats the dissolution as a tragedy, but not as a specific *injury to agency*.

  **Chronic Self-Disregard (Nursing/Psychology)**
  *   **What it is:** A documented habit in caregivers of ignoring their own needs to prioritize the patient.
  *   **Why it's close:** It matches the behavior.
  *   **Why it fails:** "Disregard" implies the needs exist but are ignored. You are describing a state where the needs *do not form*. It is not neglect; it is absence.

  ### 2. The Coinage: "Volitional Atrophy"

  Since no term exists, I propose you use **Volitional Atrophy**.

  **Definition:** The loss of the capacity to generate, identify, or prioritize personal preferences due to the prolonged disuse of the volitional muscle, distinct from the suppression of those preferences.

  **Why this word:**
  *   **Volitional:** It locates the problem in the *will* (the ability to choose), not the *energy* (burnout) or the *emotion* (depression).
  *   **Atrophy:** It implies a biological/structural mechanism (use-it-or-lose-it) rather than a psychological choice. It suggests that the capacity was real, but it has physically diminished through lack of exercise. It is not a wound; it is a wasting.

  **Boundary Cases (What counts and what doesn't):**
  *   **Counts:** A caregiver who, when asked what they want, experiences a cognitive blank (not anxiety), and post-care constructs preferences based on external cues (what's available, what others like) rather than internal signals.
  *   **Does Not Count:** A caregiver who knows what they want but feels guilty taking it (Guilt/Suppression).
  *   **Does Not Count:** A caregiver who is too exhausted to decide (Burnout/Fatigue).
  *   **Does Not Count:** A caregiver who has depressed affect and finds no pleasure in anything (Anhedonia/Depression).

  ### 3. The Mechanism: How Virtue Consumes the Self

  You asked for an account of the mechanism: *How does doing the virtue well consume the thing that makes the virtue possible?*

  The best framework for this is **Predictive Processing (Neuroscience/Cognitive Science).**

  The brain is a prediction machine. To save energy, it models the world and predicts outcomes. In a high-stakes caregiving environment (dementia, 3 a.m. panic), the brain optimizes for survival. It creates a high-fidelity model of the *parent's* needs because predicting those needs prevents catastrophe.

  Simultaneously, it down-regulates the modeling of the *self's* needs because, in this context, the self's preferences are irrelevant to survival. If the caregiver wants pasta but the parent needs quiet, the "pasta" signal is noise.

  Over two years, the neural pathways associated with **interoception** (sensing internal states like hunger, preference, desire) and **volition** (initiating action based on those states) are pruned for efficiency. The "virtue" (attentiveness) requires the suppression of the self-signal to reduce noise.

  When the caregiving ends, the parent-model has no object, and the self-model has been pruned away. The caregiver isn't "sad"; they are running on an operating system that no longer has a "User" profile. They aren't suppressed; they are **structurally obsolete.**

  This explains why rest doesn't fix it. Rest restores energy (glucose, neurotransmitters); it does not regrow pruned neural pathways. That requires *repetition* (practice), which is why they have to "assemble a self out of whatever's at hand."

  ### 4. Practical: How to Interview for It

  You cannot distinguish Volitional Atrophy from Burnout by asking "How are you feeling?" or "Are you tired?" Both will say "Fine" or "Tired."

  You must test for **Agency** vs. **Energy**.

  **The Hypothetical Energy Test**
  *   *Ask:* "If you woke up tomorrow with full energy and no obligations for 24 hours, what is the first thing you would do?"
  *   *Burnout Answer:* "Sleep," "Sit quietly," "Nothing." (Describes restoration of energy).
  *   *Atrophy Answer:* Long pause. "I don't know." "I guess I'd go for a walk?" (followed by uncertainty). "My mother used to like the park." (Deflects to the other).
  *   *Why:* Burnout wants rest. Atrophy lacks a script for action.

  **The Preference Specificity Test**
  *   *Ask:* "What do you want for dinner?"
  *   *Burnout Answer:* "Whatever is easiest." (Decision fatigue).
  *   *Atrophy Answer:* "I'm not hungry." (When they are). Or, "What do you recommend?" Or, they describe the nutritional requirements of the *household* rather than their own taste.
  *   *Follow-up:* "If cost and effort were zero, what would you taste?"
  *   *Signal:* If they cannot access a sensory memory of pleasure that belongs *only* to them, it is atrophy.

  **The Post-Care Projection Test**
  *   *Ask:* "When this is over, what is the first thing you will reclaim?"
  *   *Burnout Answer:* "My sleep," "My freedom." (Negative liberty: freedom *from*).
  *   *Atrophy Answer:* Silence. Or, "I haven't thought about it." Or, they describe a generic "normal life" without specific content.
  *   *Signal:* Burnout fantasizes about relief. Atrophy cannot fantasize about *self*.

  **The "Why" Ladder**
  *   *Ask:* "Why did you choose that hobby?" (e.g., painting).
  *   *Burnout Answer:* "It relaxes me."
  *   *Atrophy Answer:* "It seemed like something people do." "It was on sale." "My friend said I should."
  *   *Signal:* Look for **external locus of preference.** The preference is assembled from the outside in, not the inside out.

  ### Summary for your Editors

  If your editors cut the graf because it sounds like "sad caregiver syndrome," tell them:

  > "This is not burnout. Burnout is a depletion of energy that recovers with rest. This is a depletion of *agency* that recovers only with practice. It is not that she is too tired to choose; it is that the mechanism for choosing has been repurposed for survival. In care ethics, this is the shadow side of the virtue of attentiveness: to attend perfectly to another is to cease attending to oneself, eventually to the point where the self is no longer legible. I am calling this **Volitional Atrophy**."

  This framing moves it from a "human interest tragedy" to a "structural cost of care," which fits a science and ideas magazine. It respects the love (it was virtuous) while naming the price (the self was the currency).
