      *   No quotes/citations? Yes.

  7.  **Final Polish:** Check flow and ensure the voice is consistent. (Proceed to generate output).

  *(Self-Correction Note on "No Quotes"):* I must be very careful not to accidentally quote "In case I don't see you..." or "Good morning, neighbors." I will describe them.

  *(Self-Correction on "Argue for one"):* I will firmly take the position that Rousseau's diagnosis holds, but the film updates the *technology* of the diagnosis. The horror of Seahaven is that it proves Rousseau right about the impossibility of a "staged community."

