      *   **Students:** Read *Monadology* & *Discourse on Metaphysics*, read Hobbes. No prior reading on Leibniz's law/justice. One politics major prone to reducing normativity to power/self-interest.
      *   **Medium:** Whiteboard only.
      *   **Goal:** Establish Leibniz's account of justice (*benevolence of the wise*, grades of right/equity/piety, harmony/perfection) as a *substantive ethical position*, not just a corollary of monadology.
      *   **Constraints:**
          1.  Provide the *plan*, not the explanation.
          2.  Dependency Structure (presuppositions/availability).
          3.  Ordering Constraint (no front-loaded metaphysics; enter via juridical material; identify when harmony becomes load-bearing).
          4.  Carrying Case (one concrete dispute re-described across three grades; specific constraints on what it must exhibit/lack).
          5.  Misconception Map (pre-existing vs. sequence-generated; when to head off vs. leverage).
          6.  So-What Juncture (where obligation is questioned; close the gap there, not at the end).
          7.  Closing Question (distinguish landed vs. unlanded understanding).
          8.  Deliberate Omissions (what to cut and how to signal it).

  2.  **Deconstruct the Goal:**
      *   The core challenge is separating the *ethics* from the *metaphysics* initially, then showing how the metaphysics (specifically harmony) grounds the *highest grade* of ethics without reducing ethics to mere metaphysical description.
      *   The politics major is the adversary here. The argument must withstand "might makes right" or "interest convergence."
      *   Time management is critical (75 mins).

  3.  **Drafting Section 1: Dependency Structure:**
      *   Need to sequence the concepts: Definition of Justice -> Three Grades -> Harmony -> Metaphysical Grounding.
      *   *Component 1: Definition of Justice.* Presupposes: Nothing (start here). Available: A normative standard distinct from power.
      *   *Component 2: The Three Grades (Strict Right, Equity, Piety).* Presupposes: Def of Justice. Available: A hierarchy of moral obligation.
      *   *Component 3: The Carrying Case.* Presupposes: The Three Grades. Available: Concrete application showing the ascent.
      *   *Component 4: Harmony as Perfection.* Presupposes: Piety (highest grade). Available: The *reason* why piety is highest (ontological weight).
      *   *Component 5: The Wise/Benevolence.* Presupposes: Harmony. Available: The link between knowledge (wisdom) and will (benevolence).
      *   *Load-bearing:* Def of Justice, Three Grades, Harmony. Background: Monads (initially), Pre-established Harmony (initially).

  4.  **Drafting Section 2: Ordering Constraint (Metaphysics):**
      *   *Constraint:* Don't start with Monads. Start with Law/Justice.
      *   *When does Harmony become load-bearing?* At the transition from Equity to Piety. Equity is about equality/fairness (human-centric). Piety is about the universal good (God-centric/Cosmic).
      *   *Why not earlier?* If introduced earlier, it looks like "be nice because the universe is harmonious" (is-ought fallacy or decoration). It needs to be the *solution* to why Piety binds us.
      *   *Signal:* "We have reached the limit of human reciprocity. To understand the third grade, we must change our ontology."

  5.  **Drafting Section 3: The Carrying Case:**
      *   *Requirement:* One dispute, re-described at all three levels.
      *   *Constraints:* Not punishment (retributive vs. restorative complicates things). Not coinciding interests (must show conflict resolved by higher principle).
      *   *Idea:* Property/Contract dispute? Debt? Inheritance?
      *   *Selection:* A Debt/Contract dispute where strict enforcement causes ruin.
      *   *Why:*
          *   Strict Right: You owe me, pay me (no harm to third parties).
          *   Equity: Pay me, but not if it destroys you (modification based on circumstance).
          *   Piety: We both contribute to a common fund or forgive to maximize universal perfection (harmony).
      *   *Refinement:* Let's use a **Creditor/Debtor** case where the debtor's failure ruins a third party (e.g., family or employees).
      *   *Must Exhibit:* Conflict of interest (Creditor wants money, Debtor needs survival).
      *   *Must Lack:* Criminal element (punishment), accidental coincidence of interest (must require moral choice).
      *   *Board Description:* "A lends 100 to B. B cannot repay without starving B's family. A demands repayment."

  6.  **Drafting Section 4: Misconception Map:**
      *   *Pre-existing:*
          *   "Best world = Quietism": Head off at Piety stage. Intervention: "Perfection requires active benevolence, not passive acceptance."
          *   "Windowless Monads = No Relations": Head off at Definition of Justice. Intervention: "Justice is a relation of minds/wills, not physical causation."
          *   "God's Choice = Voluntarism": Head off at Harmony stage. Intervention: "God wills the best *because* it is best, not arbitrarily."
          *   "Harmony = Aesthetic/Suffering": Head off at Harmony stage. Intervention: "Harmony includes the mitigation of suffering as a dissonance to be resolved."
          *   "Maximize Happiness": Head off at Piety stage. Intervention: "It's about perfection/harmony, not just sum-total pleasure (utilitarianism)."
      *   *Sequence-Generated:*
          *   "Ethics is just applied Metaphysics": This is the main risk. Head off at the start. Intervention: "We are treating justice as a juridical concept first."
      *   *Leverage:* The Politics Major's "Power" objection. Use it at the Strict Right stage. "Is Strict Right just power?" No, it's *permission* without injury. Then show how Equity limits power.

  7.  **Drafting Section 5: So-What Juncture:**
      *   *Where:* After defining Piety/Harmony, before linking back to God/Monads.
      *   *Question:* "Even if harmony is perfect, why must *I* will it?"
      *   *Move:* The definition of *Wisdom*. To know the good is to will the good. Ignorance is the only reason not to will harmony. Therefore, obligation comes from the nature of rational agency, not external command. (Connects to *Benevolence of the Wise*).

  8.  **Drafting Section 6: Closing Question:**
      *   *Question:* "If God had not created this world, would justice still bind us?"
      *   *Landed Answer:* "Yes, because justice is grounded in eternal truths of harmony, not God's will." (Shows anti-voluntarism).
      *   *Unlanded Answer:* "No, because God commands it." OR "Yes, because it makes us happy." (Shows voluntarism or utilitarianism).

  9.  **Drafting Section 7: Deliberate Omissions:**
      *   *Omit:* Modal logic (necessity types), full Theodicy (origin of evil), Pufendorf/Hobbes detailed textual exegesis.
      *   *Signal:* "I am bracketing the modal status of these truths for today," "We are not solving the problem of evil, only the definition of justice," "I am setting aside the historical debate with Pufendorf to focus on the internal structure."

