      *Refining the So-What:* The prompt asks for the move that closes the gap *at that place*. The move is linking *Wisdom* to *Will*. If you understand harmony, you *must* love it.
      *Refining the Politics Major:* The politics major thinks normativity is power. Strict Right looks like power. Equity limits power. Piety transforms power into benevolence. Use the major as a foil.

      *Final Polish on Dependency:* Ensure the "Load-bearing" vs "Background" distinction is sharp. Monadology is background until the very end (or rather, Harmony is the bridge).

      *Final Polish on Omissions:* Be explicit about *how* to signal omission verbally.

      *Final Polish on Closing Question:* Make sure the distinction between the two answers is clear regarding the *source* of normativity.

