answer: |-
  BEFORE THE STATE GAMING COMMISSION
  In the Matter of the Pasadena Table Game
  Complaint for Declaratory Relief Regarding Expected Value Disclosure

  Complainant: Dr. Aris Thorne (Pro Se)
  Respondent: Golden Oakticks Casino & Resort

  1. Complainant, a professional decision theorist, files this complaint against Respondent regarding the marketing materials for the table game known as "The Pasadena." The game involves flipping a fair coin until heads appears on flip $n$. The patron wins $\$2^n/n$ if $n$ is odd and loses $\$2^n/n$ if $n$ is even. Respondent advertises the game's expected value as roughly 69 cents. This figure is derived from the series $1 - 1/2 + 1/3 - 1/4 \cdots$. While this series converges to $\ln(2)$, it does so only conditionally.

  2. The Commission has previously adjudicated games with infinite expected values, such as the classic St. Petersburg paradox. In those instances, the expected value exists but is unbounded. The Pasadena presents a more severe regulatory failure: the expected value does not exist. Because the series is not absolutely convergent, the Riemann Series Theorem dictates that its terms may be rearranged to sum to any real number, or to diverge. Respondent's advertised value rests on a typographical fact about the house's brochure rather than on any invariant fact about the gamble.

  3. This distinction undermines the entire disclosure regime. A cap on stakes or a limit on the house's bankroll cannot repair a quantity that has no value to consent to. An informed-consent signature requires a stable object of consent. When the expected value is undefined, the patron is not consenting to a risk premium but to a linguistic convention regarding the order of summation. The marketing department can raise the game's value by re-typesetting the pay table—a change requiring no new equipment, no new rules, and no new coin.

  4. Furthermore, the expected absolute payoff is the harmonic series $1 + 1/2 + 1/3 + \cdots$, which diverges. Consequently, the patron cannot be reassured that his running average will settle down over many plays. The Law of Large Numbers fails. A player may experience a positive drift for years followed by a catastrophic correction, not due to variance, but due to the fundamental instability of the expectation itself.

  5. Respondent's defense relies on standard actuarial orthodoxy. In a letter dated March 14, the Respondent's in-house actuary stated: "The complaint is frivolous. The outcomes occur in natural numerical order. The series converges to 0.693 in that order. To suggest otherwise is to deny the validity of standard calculus. The game pays according to the flip count, not according to a rearranged series. The expected value is simply the sum of the probabilities times the payoffs."

  6. This response conflates the physical sequence of flips with the mathematical definition of expectation. Expectation is an integral over the sample space. When the integral of the absolute value diverges, the expectation is undefined. The actuary's confidence is misplaced. Respondent has proposed a patch: truncating the game at twenty flips and publishing the value of the truncated version. This is insufficient. The truncated game is a different game whose value depends entirely on where the cut is made. Truncation at twenty flips yields one value; truncation at twenty-one yields another. The limit does not stabilize.

  7. Complainant requests that the Commission designate a canonical ordering of the terms for the purpose of disclosure. Let the Commission decide whether the wins should be summed before the losses, or interleaved by magnitude. This remedy inherits the disease. It makes legible that any such designation is arbitrary. A disclosure reading "this game's expected value is whichever real number you please" is not a disclosure at all. Yet, consistency demands it. The same remedy applied consistently beyond the casino would sweep in the Complainant's own foundation's cost-effectiveness estimates, which rely on similar conditional convergences.

  8. Complainant notes for the record that he has been playing The Pasadena all year under several competing orderings of the pay table. He arranged his bets to reflect different summation strategies mandated by different interpretations of the rules. He is currently ahead by an amount he is unable to state.

  **RELIEF REQUESTED**

  1. That the Commission declare the advertised expected value of The Pasadena misleading and undefined.
  2. That the Commission establish a canonical ordering for conditional series in gaming disclosures.
  3. That Respondent be barred from citing a single scalar expected value until such ordering is ratified.

  **EXHIBIT A**

  Described rather than reproduced: A copy of the Respondent's pay table, printed on card stock, listing outcomes $n=1$ through $n=10$ in natural order, with the footnote "Expected Return: 69%." The reverse side contains a blank space where alternative orderings might be typeset to demonstrate the variability of the sum.

  Respectfully submitted,

  Aris Thorne
  Complainant
