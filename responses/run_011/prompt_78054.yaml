          Ultimately, the resistance to these ideas stems from a discomfort with the idea that human behaviour is subject to the same cold laws as beetle horns or bird plumage. We want to believe our generosity is purely moral, not a calculated investment in social capital. But acknowledging the adaptive root of our virtues does not diminish them. It simply clarifies the architecture of our nature. We are not less human for having evolved; we are more understandable. I remain confident that once the dust settles, the utility of the signalling framework will be obvious to everyone, even those who currently claim it explains everything and therefore nothing.

