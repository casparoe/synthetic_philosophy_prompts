          It has become fashionable in certain corners of our discipline to dismiss functional explanations as mere storytelling, a critique that often feels less like scientific scepticism and more like a refusal to engage with the logical necessities of natural selection. When my colleagues suggest that my work on competitive provisioning signalling lacks empirical teeth, they are usually pointing to a perceived flexibility in how the data is interpreted. But flexibility is not vagueness; it is the capacity to recognise that selection pressures operate along a continuum. For instance, critics note that when men in high-resource environments share food generously, it confirms the signalling hypothesis, yet when men in scarce environments hoard resources, this is also claimed as confirmation. They call this unfalsifiable. I call it nuanced. If the cost of signalling exceeds the reproductive benefit, the optimal strategy shifts from display to conservation. The mechanism remains the same—maximising status relative to provisioning capacity—even if the behavioural output inverts. To demand a binary outcome is to misunderstand the economics of evolution.

