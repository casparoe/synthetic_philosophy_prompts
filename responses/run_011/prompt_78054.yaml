          Furthermore, the charge that I conflate contemporary hunter-gatherer ethnography with ancestral environments ignores the utility of the comparative method. If a behavioural regularity appears across disparate foraging societies—the !Kung, the Hadza, the Inuit—it is reasonable to infer that these groups retain the ecological constraints that shaped the human mind during its formative period. They are not perfect time machines, but they are the only mirrors we have. To refuse to look into them because the glass is slightly warped is to choose blindness over imperfect vision.

