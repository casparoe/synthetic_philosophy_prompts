  If Oswald did not fire the shot
  Then another hand was known
  To strike the president alone
  Since fate had tied the fatal knot
  We grant this truth without a plot
  The fact stands clear as cut in stone
  No hidden guilt we need to own
  The inference is clearly got
  But change the mood and shoot him not
  Would fate have spun a different lot?
  Deny the backup plan had grown
  No second gun was clearly shown
  One stays within the thinker's lot
  The other walks the world begot

  This sonnet commits to the suppositional theory of indicatives, aligning with Adams' Thesis that acceptability tracks conditional probability rather than truth conditions. The verse takes liberties by compressing the probabilistic nature of the supposition into the metrical constraint of "the thinker's lot," which risks sounding more like a fixed mental state than a dynamic degree of belief. The closing couplet survives the rival truth-conditional reading because locating the indicative within the "thinker's lot" can be interpreted as describing our epistemic access to truth conditions rather than denying their existence outright. By framing the counterfactual as walking "the world begot," the poem acknowledges the possible-worlds machinery required for the subjunctive without explicitly ruling out a similar machinery for the indicative. Thus, the poem illustrates the asymmetry in use and acceptance without delivering a final verdict on the metaphysical status of the indicative conditional.
