answer: |-
  **TAKE-HOME ASSIGNMENT: MARKETS AS KNOWERS**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Context**
  A regional paper starts an internal prediction market for staff. Contracts pay out on things like whether the mayor gets indicted, whether two hospital trusts merge, whether a named exec has left by the end of March.

  1. Everyone trading is a staffer at the same paper, with the same document access, the same contacts list and the same freedom to call people.
  2. The paper subsidises it — staff trade with a budget the paper gives them and don't lose their own money if they're wrong.
  3. Two of the reporters are both careful, both well-calibrated, both know the other is, and they have swapped every document either of them holds. They still bet against each other on the indictment. Repeatedly. Cheerfully.
  4. Volume is high, and prices reliably move before the public announcements do.
  5. The editors read the prices every morning and use them to decide what to assign that week.

  **Questions**

  (a) The **No-Trade Theorem** states that speculative trade should not occur between rational agents who share a **common prior** (initial belief) and know each other to be rational. Given Facts 1 to 3, explain what shouldn't be happening at Fact 3. Since Fact 1 rules out information asymmetry, which specific assumption in the theorem's setup must be the one giving way? Be precise.

  (b) Explain why Fact 4 does not justify the editors' belief that the market is a truth machine. You must address two points: first, that high volume and prescient prices can exist without information (e.g., risk transfer); second, that a market price is not identical to a probability once **risk premiums** and **favourite-longshot bias** are present.

  (c) Analyze the reflexive wrinkle created by combining Facts 2 and 5. If prices fully revealed reality, reporters wouldn't dig; if reporters dig because of prices, the prices measure the subsidy and assignment habits rather than the world. Does Fact 5 rescue the editors' claim or wreck it?

  ***

  **MODEL ANSWER**

  (a) The No-Trade Theorem (Milgrom-Stokey) implies that if two agents share a common prior and know each other to be rational, they cannot agree to disagree. If Reporter A wants to sell a contract on the indictment, they believe the probability is low. If Reporter B buys, they believe it is high. If both know the other is rational, A should infer that B knows something they don't, and update their own belief until trade stops. Fact 3 shows trade happening repeatedly despite Fact 1 confirming identical information access. Since information asymmetry is ruled out, the breaking assumption must be **Common Priors**. The reporters interpret the same documents differently due to subjective priors, or they are not purely profit-maximizing rational agents—they derive utility from the gamble itself (gambling preference), violating the standard rationality assumption.

  (b) Fact 4 shows correlation, not causation. High volume does not prove information aggregation; it can indicate **liquidity trading** or risk transfer. Staff might trade to hedge other exposures or simply to burn the subsidized budget (Fact 2), creating volume without insight. Furthermore, a market price is not a raw probability. It includes a **risk premium**—the extra return traders demand to hold risky assets. Additionally, prediction markets often exhibit **favourite-longshot bias**, where unlikely events (longshots) are overpriced relative to their true probability. Therefore, a price of 20% might reflect a true probability of 10% plus a risk premium and bias. Treating the price as a direct probability ignores these distortions.

  (c) Fact 5 wrecks the editors' claim via the **Grossman-Stiglitz Paradox**. This paradox states that if prices fully reveal information, no one has an incentive to pay the cost of gathering it, rendering prices uninformed. Here, the reflexivity is stronger: editors use prices to assign stories (Fact 5). If the market prices a mayor's indictment high, editors assign reporters to dig. The digging itself increases the likelihood of the indictment being found and published. Thus, the price is not predicting an external reality; it is triggering the newsroom machinery that creates the reality. The price becomes **endogenous**—determined by the system itself rather than outside facts. Fact 2 (subsidy) compounds this; traders know the paper pays for mistakes, altering risk behavior. Fact 5 confirms the market is not a passive mirror but an active engine. The editors cannot treat the price as an independent truth signal because their reaction to the signal helps determine the outcome.

  ***

  **MARKING SCHEME**

  **Total: 25 Marks**

  **1. The No-Trade Violation (6 Marks)**
  *   **2 Marks:** Correctly identifies that trade shouldn't happen if agents share common priors and know each other to be rational.
  *   **2 Marks:** Explicitly notes that Fact 1 rules out information asymmetry (different data).
  *   **2 Marks:** Identifies the breaking assumption as **Common Priors** (different interpretation of same data) OR **Utility/Rationality** (gambling preference).
  *   *Deduction:* -3 Marks if the student claims "they must have different information" (contradicts Fact 1).
  *   *Deduction:* -3 Marks if the student claims the No-Trade Theorem proves markets are always right (inverse of the theorem).

  **2. Volume and Price Distortion (6 Marks)**
  *   **2 Marks:** Explains that volume can be noise/liquidity/risk transfer (burning budget) rather than information.
  *   **2 Marks:** Defines/uses **Risk Premium** (price includes compensation for risk, not just probability).
  *   **2 Marks:** Defines/uses **Favourite-Longshot Bias** (prices distort on unlikely events).
  *   *Deduction:* -3 Marks if the student argues high volume is itself evidence of information aggregation.
  *   *Deduction:* -2 Marks if the student treats market price as identical to probability without qualification.

  **3. Reflexivity and Endogeneity (8 Marks)**
  *   **3 Marks:** Identifies the Grossman-Stiglitz dynamic (if prices reveal all, digging stops).
  *   **3 Marks:** Explains the feedback loop: Editors assigning stories based on prices changes the probability of the event.
  *   **2 Marks:** Concludes Fact 5 **wrecks** the claim (prices are endogenous, not independent signals).
  *   *Deduction:* -5 Marks if the student argues Fact 5 rescues the claim (e.g., "editors validate the market").
  *   *Deduction:* -3 Marks if the student misses the endogeneity argument entirely.

  **4. Terminology and Precision (5 Marks)**
  *   **1 Mark each:** Correct usage/definition of No-Trade Theorem, Common Priors, Risk Premium, Favourite-Longshot Bias, Endogenous.
  *   *Deduction:* -1 Mark per term used incorrectly or confused (e.g., conflating Efficient Market Hypothesis with No-Trade Theorem).
  *   *Deduction:* -2 Marks if "Overconfidence Bias" is used as a universal solvent without linking to specific mechanics.

  **Differentiation Guide: A vs. B**

  *   **B Grade (15-19 Marks):** The student gets the labels right. They define the No-Trade Theorem correctly. They mention risk premiums. They identify that Fact 1 rules out information asymmetry. However, they treat Fact 5 as a procedural detail rather than a structural flaw. They might say "editors should be careful" but miss that the editors' action *changes the truth condition*. They treat the market as imperfect but still fundamentally external.
  *   **A Grade (20-25 Marks):** The student identifies that Fact 5 makes the market **endogenous**. They understand that the price is not just predicting the news, but causing it. They explicitly state that Fact 5 wrecks the validity of the market as a measurement tool because the measurement affects the subject. They avoid all specific wrong turns listed above.
