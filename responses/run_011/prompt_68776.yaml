answer: |-
  # The Honesty Sorting Instrument

  *Instructions for use: Read the claim at each node. Present the case(s) underneath. Ask students to raise hands for Yes/No. Follow the path to the leaf. Read the "Awkward Commitment" aloud to the group that landed there.*

  *   **Node 1: The Literal Split**
      *   **Claim:** If you say something technically true but know it will create a false belief, is that just as bad as saying something false?
      *   **Case A (Used Car):** A seller is asked if the brakes have ever failed. He says, "I have never had a single complaint about this car." This is true, because the previous owner never complained, but the seller knows the brakes failed last month.
      *   **Case B (Drug Company):** A press release states, "No clinical trial has found this side effect." This is true, because every trial the company ran was too small to detect it, but they know the risk exists.
      *   **Yes (It's just as bad)** → Go to Node 2.
      *   **No (It's less bad)** → Go to Node 5.

      *   **Node 2: The Context Exception (Collapse Path)**
          *   **Claim:** Are there specific social games where deception is allowed even if it's usually wrong?
          *   **Case (Poker/Salary):** You are in a salary negotiation or a poker game. Everyone in the room knows the convention is to bluff about your bottom line or your hand. You make a false claim about your number.
          *   **Yes (Context excuses it)** → Go to Node 3.
          *   **No (Context never excuses it)** → **Leaf 1: The Absolutist**
              *   *Awkward Commitment:* You cannot bluff in poker or negotiate salary without violating a moral duty, regardless of the rules everyone agreed to.

      *   **Node 3: The Motive Exception (Collapse + Context)**
          *   **Claim:** Does saving someone from harm excuse deception even outside of games?
          *   **Case (Abusive Ex):** An abusive ex-partner tracks you down and asks where your roommate is living. You know if you tell the truth, she will be hurt. You tell him she lives in a different city.
          *   **Yes (Protection excuses it)** → **Leaf 2: The Consequentialist**
              *   *Awkward Commitment:* If lying to the abuser is okay because it prevents harm, you must also be okay with lying to a creditor if it prevents your family from losing their home.
          *   **No (Protection doesn't excuse it)** → **Leaf 3: The Contractualist**
              *   *Awkward Commitment:* You must tell the abusive ex the truth because you didn't sign a contract with him agreeing to a "deception allowed" zone like you did in poker.

      *   **Node 4: The Universal Rule (Collapse + No Context)**
          *   *Note: This node splits the Absolutists who might still waver on extreme cases.*
          *   **Claim:** Is the wrongness in the act itself, or in the damage it causes?
          *   **Case (Clumsy Lie):** You tell a lie so obviously fake that nobody believes you for a second. No one's beliefs are changed.
          *   **Yes (The act is wrong regardless)** → **Leaf 4: The Strict Deontologist**
              *   *Awkward Commitment:* You did something morally wrong even though the world ended up exactly as if you had said nothing at all.
          *   **No (The damage is what matters)** → **Leaf 5: The Harm Principle**
              *   *Awkward Commitment:* If you lie to someone who you know is hard of hearing and they don't hear it, you have done nothing wrong.

      *   **Node 5: The Accountability Split (Distinct Path)**
          *   **Claim:** If you mislead with the truth, is the main benefit that you can't be caught lying later?
          *   **Case (Paper Trail):** A candidate is asked if he dipped into campaign money. He says, "Every dollar went into the campaign." This is true of the invoices, but false of what he got out of the vendors. He leaves a paper trail that proves his statement literally true.
          *   **Yes (It's about avoiding being caught)** → **Leaf 6: The Legalist**
              *   *Awkward Commitment:* Morality is primarily about managing risk and deniability rather than ensuring the listener understands reality.
          *   **No (It's about the speaker's integrity)** → Go to Node 6.

      *   **Node 6: The Uptake Split (Distinct + Integrity)**
          *   **Claim:** If you mislead someone, does it matter whether they actually formed a false belief?
          *   **Case (Successful Misleading):** You use a literally true statement to mislead someone, and they definitely form a false belief.
          *   **Case (Clumsy Truth):** You use a literally true statement to mislead someone, but they see through it and form a true belief.
          *   **Yes (Belief formation matters)** → **Leaf 7: The Causal Theorist**
              *   *Awkward Commitment:* You can intend to deceive and try your hardest, but if the listener is too smart to be fooled, you haven't done the specific wrong of misleading them.
          *   **No (Intent matters more)** → Go to Node 7.

      *   **Node 7: The Entitlement Split (Distinct + Integrity + Intent)**
          *   **Claim:** Does a public official owe more clarity than a private citizen?
          *   **Case (Candidate):** The candidate from the Paper Trail case is running for office. Compare him to a private citizen selling a used car using the same technically true phrasing.
          *   **Yes (Officials owe more)** → **Leaf 8: The Civic Republican**
              *   *Awkward Commitment:* A private citizen is morally permitted to be more obscure and tricky with the truth than a politician, even in serious transactions.
          *   **No (Everyone owes the same)** → **Leaf 9: The Egalitarian**
              *   *Awkward Commitment:* There is no special moral duty attached to public office; lying to a voter is the same as lying to a neighbor.

  ***

  ### Analysis of Logical Space

  **Empty Combinations**
  The tree structure permits 64 theoretical paths (2^6), but we have pruned this down to 9 leaves. Here are three specific combinations of answers that the questions *permit* but that no coherent position occupies:

  1.  **The "Risk-Only" Collapse (Node 1: Yes, Node 5: Yes):**
      *   *Combination:* A student claims misleading is just as bad as lying (Node 1), but also claims the main value of misleading is avoiding a paper trail (Node 5).
      *   *Status:* **Incoherent.** If misleading is morally equivalent to lying, the ability to avoid a paper trail is irrelevant to the *wrongness*, only to the *punishment*. Holding both views suggests the student confuses prudence with morality.
  2.  **The "Poker-Only" Moralist (Node 2: Yes, Node 3: No):**
      *   *Combination:* A student claims deception is allowed in poker/negotiation (Node 2) but *not* allowed to protect a roommate from an abuser (Node 3).
      *   *Status:* **Unattractive.** This view privileges property games over human safety. While logically possible, it is rarely defended because it inverts the usual hierarchy of harms (financial loss vs. physical violence).
  3.  **The "Private Deceiver" (Node 6: No, Node 7: No):**
      *   *Combination:* A student claims intent matters more than uptake (Node 6), but that public officials don't owe more than private citizens (Node 7).
      *   *Status:* **Underexplored.** This position suggests a universal strictness on intent that ignores the structural power differences between a candidate and a car seller. It exists, but it struggles to explain why we feel more betrayed by the candidate.

  **Indistinguishable Leaves**
  *   **Leaf 3 (Contractualist) and Leaf 4 (Strict Deontologist):**
      *   The tree cannot fully separate these two. Both will likely answer "No" to the Context Exception (Node 2). The Contractualist says "No contract, no lie allowed." The Deontologist says "No lie allowed, period." In the context of the Abusive Ex case, both might struggle, but the tree forces them into different branches based on Node 3. In reality, their behavior will look identical in almost all standard cases.

  ***

  ### Instrument Evaluation

  **Confidence in Branch Independence**
  I am **moderately confident (65%)** that the branches are independent. The biggest risk is between Node 1 (Literal Split) and Node 5 (Accountability). A student who believes literal truth matters (Node 1: No) will almost naturally believe the paper trail matters (Node 5: Yes). It is difficult to consistently hold that "Literal truth makes it okay" but "The paper trail doesn't help you." The tree assumes these are separate features (one about the act, one about the consequence), but students often conflate them into a single "Technically True = Safe" heuristic.

  **The Weakest Discriminating Question**
  **Node 2 (The Context Exception/Poker Case)** is the least reliable splitter.
  *   *Reason:* Both the "Collapse" crowd (lying and misleading are the same) and the "Distinct" crowd (lying is worse) will overwhelmingly vote **Yes** on this node. Almost everyone agrees poker bluffs are permissible.
  *   *Risk:* This means Node 2 does not effectively sort the two main factions you identified in your lecture; it only sorts the Absolutists from everyone else. The "Collapse" and "Distinct" groups will walk right past this node together, nodding in agreement, which might give you false hope that they share more common ground than they actually do. The real friction won't appear again until Node 3 or Node 5.
