      *   No sources? Yes.

  8.  **Self-Correction during drafting:** I initially thought about suggesting a "Seed" analogy. But seeds grow into specific plants (oak acorn -> oak tree). That might actually support the PI too much (pre-determined outcome). A "Landscape" is better because the water (input) determines the river path, constrained by the slope (priors), but the river isn't "in" the hill beforehand. Actually, the **FPGA** is sharper for a lab context. It distinguishes architecture from program. Let's use the **Landscape** for intuition and mention **Architecture** for precision. I'll stick with the Landscape/Watershed analogy as the primary alternative because it handles the "stimulus" (rain) better.

