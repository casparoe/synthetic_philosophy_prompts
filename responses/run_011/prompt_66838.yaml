      *   *Idea:* A computer architecture? (Good, but abstract).
      *   *Idea:* A landscape/topography? (Water flows down, but path depends on rain).
      *   *Selected:* **The Circuit Board / FPGA (Field-Programmable Gate Array).**
          *   Hardware constraints exist (physics, logic gates).
          *   But the *function* is determined by the configuration (input/experience).
          *   Allows distinction between "architecture" (domain general) and "program" (domain specific).
          *   Avoids the "statue already exists" implication.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Direct, analytical, academic but conversational (matching the user's lab context).
