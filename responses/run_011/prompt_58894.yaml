answer: |-
  Here is a complete design for the session, optimized for your constraints (single whiteboard, index cards, no handouts) and your pedagogical goals (exposing the friction between formal causal tools and historical narrative).

  ### **Logistics & Prep (Before Class)**

  *   **Whiteboard:** Divide into three columns (Group 1, 2, 3). Reserve the bottom third for "Global Rules."
  *   **Index Cards (Instructor Prep):** You need to hand-write these before class.
      *   **3 Sets of Role Cards** (4 cards per set).
      *   **3 Sets of Round 1 Counterfactual Cards** (4 cards per set, sealed in envelopes).
      *   **3 Sets of Round 2 Interaction Cards** (2 cards per set, sealed).
      *   **3 Sets of Round 3 Endogeneity Cards** (1 card per set, sealed).
      *   **1 Deck of "Penalty/Bonus" Tokens** (small slips of paper) for the scoring scheme.
  *   **Markers:** 3 colors (e.g., Black for ledger, Red for revisions, Blue for totals).

  ---

  ### **Part 1: The Scenario (Written on Whiteboard Top)**

  **Case:** *The Siege of Port Vellum (1642)*
  **Outcome:** *Capitulation to Sea-Prince on Day 90.*
  **Task:** *Allocate 100% of Causal Responsibility for Capitulation.*

  **Candidate Factors:**
  1.  **Commander:** Ordered hold past granary empty-date.
  2.  **Defector:** Opened the North Gate.
  3.  **Relief Fleet:** Never sailed from Capital.
  4.  **Pathogen:** Enteric infection (Dysentery) in garrison.
  5.  **Drought:** 3-year rainfall deficit in hinterland.
  6.  **Volcano:** Eruption caused cold summer (Year 2).
  7.  **Fungus:** Ergot in stored grain reserves.

  ---

  ### **Part 2: Timing & Flow (80 Minutes)**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide into 3 groups. Assign Roles (via index cards). Explain "Causal Integrity Points" (CIP). |
  | **10-30** | **Round 1** | **Additivity.** Groups receive *Subset A* cards. Create Ledger (must sum to 100%). Auditor enforces "Removal Test." |
  | **30-50** | **Round 2** | **Interaction.** Groups receive *Interaction* cards. Revise Ledger. (Red marker). |
  | **50-65** | **Round 3** | **Endogeneity.** Groups receive *Endogeneity* card. Revise Ledger. (Red marker). |
  | **65-80** | **Debrief** | Collect Ledgers. Map phases to concepts. Address failure modes. Discuss epistemic limits. |

  ---

  ### **Part 3: Role Cards (Hand-written on Index Cards)**

  *Give one to each student in the group of four.*

  **CARD 1: The Ledger-Keeper**
  You manage the numbers. Your group's ledger must always sum to exactly 100%. You hold the marker. You may not argue for specific factors, only for mathematical consistency. If the sum breaks, you lose 5 CIP immediately.

  **CARD 2: The Factor-Advocate**
  You argue for the weight of specific factors. You want to maximize the explanatory power of the factors you favor. You must propose the initial percentages.

  **CARD 3: The Counterfactual Auditor**
  **Rule:** You do not accept "Importance Claims" (e.g., "This was very bad"). You only accept "Removal Claims" (e.g., "If removed, the outcome changes").
  **Power:** If a percentage is assigned, you must ask: *"In the absence of this factor, does the town still fall?"* If the group says "No," that factor gets 0%. If "Yes," it gets share. You hold the Rulebook.

  **CARD 4: The Genealogist**
  **Rule:** You are silent until Round 3.
  **Power:** In Round 3, you are the *only* person permitted to speak about the **Commander**. Your only permitted question is: *"What produced that decision?"* You cannot argue for the Commander's share; you can only trace the origin of the choice.

  ---

  ### **Part 4: The Sealed Card Set (The "Truth")**

  *These are the ground truths you reveal. They are written on index cards, sealed in envelopes labeled Round 1, 2, 3.*

  **ROUND 1 ENVELOPE (The Additive Baseline)**
  *Contains 4 Cards. Hand one to each group.*
  *   **Card A (Relief Fleet):** If the Fleet had sailed, Port Vellum holds. (Necessary Cause)
  *   **Card B (Pathogen):** If the Pathogen is removed, defenders have strength to repel the first assault, but starve later. (Contributing Cause)
  *   **Card C (Defector):** If the Defector stays loyal, the siege lasts 10 more days, but outcome is same. (Accelerant)
  *   **Card D (Drought):** If the Drought is removed, granaries are full. Commander does not order rationing. (Background Condition)

  **ROUND 2 ENVELOPE (The Interaction)**
  *Contains 2 Cards. Reveal after Round 1 Ledgers are posted.*
  *   **Card E (Fungus + Drought):** The Fungus alone is harmless. The Drought alone allows for imported grain. **Together**, they cause total caloric collapse. Neither is sufficient alone; both are necessary jointly.
  *   **Card F (Volcano):** The Volcano caused the Drought. (Chain of Dependence).

  **ROUND 3 ENVELOPE (The Endogeneity)**
  *Contains 1 Card. Reveal after Round 2 Ledgers are posted.*
  *   **Card G (Commander's Motive):** The Commander ordered the Hold *only because* the Drought made him expect a late harvest relief. No Drought = No Hold Order. The Human Decision is a function of the Environmental Variable.

  ---

  ### **Part 5: Scoring Scheme (Causal Integrity Points)**

  *Write this on the bottom of the Whiteboard.*

  **START:** 100 CIP per group.
  **PENALTIES:**
  *   Ledger does not sum to 100%: **-5 CIP**
  *   Allocation contradicts a revealed Card (e.g., giving Defector 50% when Card C says outcome is same without them): **-10 CIP**
  *   Ignoring the Auditor's Removal Test: **-5 CIP**
  **BONUS:**
  *   Correctly predicting a Card's content before reveal (write prediction on board): **+10 CIP**
  **WINNER:** Group with highest CIP chooses the reading topic for next week. (Or "The Golden Quill" bragging rights).

  ---

  ### **Part 6: Debrief Script & Conceptual Mapping**

  *Do not lecture until the CIP are tallied. Then, stand at the board.*

  **1. Mapping Round 1 (The Additive Trap)**
  *   **Observation:** "You likely treated the factors as independent slices of a pie. If Relief Fleet saves you, it gets 50%. If Pathogen weakens you, it gets 20%."
  *   **Concept:** This mirrors **linear regression** or **SHAP values**. It assumes causal additivity.
  *   **The Historian's Friction:** "Did anyone feel that summing these to 100% forced you to lie? That's the 'Joint Outcome' problem. History isn't a pie; it's a knot."

  **2. Mapping Round 2 (Interaction & Background)**
  *   **Observation:** "Card E broke your math. If Drought and Fungus are only deadly together, how do you split the 100%? If you split it 50/50, you imply either could kill alone. If you give one 0%, you ignore the synergy."
  *   **Concept:** **Interaction Terms / Non-linearity.**
  *   **The Contrast Class:** "Notice how Card D (Drought) shifted from 'Background' to 'Cause' only when we compared it to a wet year. Your ledger depends entirely on what you treat as the 'normal' state."

  **3. Mapping Round 3 (Endogeneity & Agency)**
  *   **Observation:** "The Genealogist asked: 'What produced the decision?' Card G said: 'The Drought.' Suddenly, the Commander's share collapses into the Drought's share."
  *   **Concept:** **Endogeneity / Structural Causation.**
  *   **The Evacuation:** "If you push the environmental explanation far enough, the 'Human Share' vanishes. This is the slip point of the formal tool. It grips the mechanism but slips on the *meaning* of agency."

  **4. Addressing Failure Modes (Without naming "Determinism")**
  *   **If they gave Pathogen 0% (Moral Blame):** "In Round 1, the Auditor's rule was 'Removal,' not 'Intent.' If removing the bug saves the town, it gets points. If you gave it zero because bugs don't 'choose,' you switched from a causal model to a moral one. The formal tool doesn't care about choice; it cares about dependence."
  *   **If they gave Drought 100% (Provocation):** "If you assigned 100% to Drought, Card A (Relief Fleet) should have penalized you. The Fleet *would* have saved them regardless of rain. The 100% claim assumes no other world was possible. That is a strong claim."

  **5. The Epistemic Limit (The "Counterfactual Luxury")**
  *   **The Note:** "Here is what this game lied to you about. I gave you the Counterfactual Cards. In real history, **you do not have these cards.**"
  *   **The Point:** "In this room, the counterfactual was data. In your research, the counterfactual is the *argument*. You have to build the card yourself. The friction you felt trying to sum to 100%? That's easy. The friction of proving what would have happened if the volcano didn't erupt? That's the job. This activity gave you the answer key to a test you have to write yourself."

  ---

  ### **Part 7: Instructor's Cheat Sheet (What Will Go Wrong)**

  **Prediction 1: The Moral Blame Error**
  *   **Symptom:** History majors assign 0% to Pathogen/Fungus because "they aren't agents."
  *   **Fix:** Do not correct them. Let the **Counterfactual Auditor** do it. The Auditor's card says: *"You must allocate based on Necessity, not Agency."* If the group resists, deduct 5 CIP for "Rule Violation." Let the game mechanics punish the intuition.

  **Prediction 2: The "Everything is Climate" Provocation**
  *   **Symptom:** One group assigns 100% to Drought/Volcano to make a point about deep history.
  *   **Fix:** Use **Card A (Relief Fleet)**. If the Fleet would have saved them *even with the drought*, the Drought cannot be 100%. Reveal Card A early to that group. Deduct CIP for "Ignoring Sufficient Alternative Causes." This forces them to acknowledge human contingency without you lecturing.

  **Prediction 3: The Genealogist is Ignored**
  *   **Symptom:** In Round 3, the group talks over the Genealogist.
  *   **Fix:** Enforce the Role Card. "The Genealogist is the only one permitted to speak about the Commander." Stop the discussion until they speak. This forces the endogeneity point to come from a peer, not you.

  **Prediction 4: The Summing Panic**
  *   **Symptom:** Groups get stuck on 95% or 105% and freeze.
  *   **Fix:** Allow them to create a category called "Unexplained Variance" or "Chance," but cap it at 10%. This acknowledges model error without breaking the 100% constraint.

  ### **A Note on the "Counterfactual Luxury"**

  You suspected that handing them sealed counterfactuals is the luxury no historian has. You are correct. In the activity, the counterfactual is **ontological** (it exists in the envelope). In historiography, the counterfactual is **epistemic** (it exists only in the argument).

  **What to say in the room to make up for it:**
  When you reveal the cards in the debrief, say this:
  *"I gave you the truth of the counterfactual. In your papers, you do not have this envelope. You have to convince me that the envelope *would have contained* this card. The difficulty isn't adding the numbers; it's justifying the existence of the numbers. When you write your essays, do not pretend you have my cards. Show me how you constructed them."*
