answer: |-
  1. The account must specify a physical justification for the coarse-graining used to define entropy, ensuring increase is not merely an artefact of human ignorance. Since fine-grained entropy is constant under Hamiltonian evolution, any account failing to ground the macrovariables in dynamics or interaction scales offers only a redescription of the puzzle. [non-negotiable] [decisive]

  2. The theory must demonstrate why velocity reversals and Poincaré recurrences do not occur within empirically accessible timescales. It cannot simply assert asymmetry but must show how the microscopic symmetry is broken or rendered irrelevant for macroscopic trajectories. [non-negotiable]

  3. The account must underwrite the asymmetry of records, explaining why physical states correlate reliably with the past rather than the future. A model that predicts entropy increase but implies we should possess records of the future fails to explain the epistemic conditions required to verify the model itself. [non-negotiable]

  4. The account must explain the uniformity of the temporal arrow across causally isolated systems, necessitating a privileged global initial condition. Localist appeals to boundary conditions and driving forces are insufficient to guarantee why distinct subsystems share the same temporal orientation without this global constraint. [camp prejudice]

  5. The account must accommodate the behaviour of small systems where entropy-decreasing fluctuations are routine rather than impossible. It must recover the Second Law as a high-probability limit without denying the validity of fluctuation theorems observed in single-molecule experiments. [non-negotiable]
