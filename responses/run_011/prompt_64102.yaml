answer: |-
  # The Weighting Schedule

  The stamp made a sound like a bone breaking. Elara pressed it into the ink pad, then onto the form, leaving a red circle around the authorization code. She slid the packet across the laminate counter. The waiting woman did not touch it.

  Mrs. Gable's hands were folded in her lap, white-knuckled. She looked at the envelope as if it might bite. "Is it him?"

  "It is a report on the closest counterpart satisfying the weights you signed on Form 104-B," Elara said. She kept her voice flat. The Bureau of Alternate Particulars did not offer comfort. It offered verification.

  "My husband," Mrs. Gable said. "Arthur."

  "The report describes an individual in a neighboring world who resembles Arthur Gable according to the parameters you selected. Biological continuity was weighted at forty percent. Psychological trajectory at thirty. Social attachments at thirty."

  "I checked the box for attachments," Mrs. Gable said. "I wanted to know if he stayed."

  Elara nodded. "Then the individual described remained in the marital home. He is alive. He is grieving."

  "Then it is him."

  "It is not." Elara tapped the envelope. "Arthur Gable is deceased in this world. No individual exists in more than one world. The man in that report is numerically distinct. He is a stranger who shares Arthur's history up to a divergence point."

  Mrs. Gable flinched. She had heard this during the intake interview, but hearing it again, with the paper between them, made it real. She picked up the envelope. Her thumb traced the edge. "My brother-in-law filed a petition last week. For the same Arthur."

  "He would have filed a separate weighting schedule."

  "He weighted Career higher. Ambition." Mrs. Gable's voice tightened. "His report says Arthur is a partner at a firm in Chicago. He says Arthur is happy. My report says Arthur is here, alone, playing the piano."

  "Both reports are accurate," Elara said. "Similarity is context-sensitive. Your brother-in-law asked what Arthur might have done if he pursued law. You asked what Arthur might have done if he pursued love. The Bureau returns the closest match for the question asked."

  "It's a trick."

  "It is a procedure."

  Mrs. Gable stood up. She clutched the envelope to her chest. "This paper tells me about a man who isn't my husband. It tells me he plays piano. Arthur couldn't play piano. He hated music."

  "In that world, he learned. The divergence occurred at age twelve. The piano lesson was the branch point."

  "So he is someone else."

  "Yes."

  "Then why do I care?" Mrs. Gable's voice cracked. "I don't grieve for a stranger. I don't love a stranger. This is worthless. You're selling me a biography of a ghost."

  Elara looked past her, to the queue behind. A man in a grey suit waited holding a number. "The report validates the truth of the counterfactual claim. It tells you what is possible. It does not restore the actual."

  "I wanted him back."

  "No crossing is permitted." Elara gestured to the sign above the counter. *NO TRANS-WORLD TRAFFIC. DESCRIPTIVE MATERIALS ONLY.* "We do not send messages. We do not open portals. We weigh resemblance. That is all."

  Mrs. Gable stared at her. The anger was there, but beneath it was a hollow exhaustion. She wanted a fight, but the Bureau was a wall. "You say both reports are true. My Arthur is alone. His Arthur is rich. They can't both be Arthur."

  "They are both counterparts. Neither is Arthur."

  Mrs. Gable turned away. She walked to the door, the envelope crumpled in her grip. She did not open it. She left the office without looking back.

  Elara exhaled. She pulled the next file from the stack. It was a thick manila folder labeled *Henderson, T. – Tie-Break Protocol*.

  She opened it. The deceased, Thomas Henderson, had died in a car accident at thirty-four. Two petitioners had filed: his mother and his wife. They had used identical weightings. Biological continuity, fifty percent. Psychological, fifty percent.

  The search algorithm had returned two candidates in the same alternative world. Candidate A was a teacher. Candidate B was a mechanic. Both matched the biological criteria perfectly. Both matched the psychological profile within margin of error. The similarity index was identical.

  This was the problem with the theory. Resemblance was not transitive. A might resemble B, and B might resemble C, but A might not resemble C. Sometimes, the chain broke. Sometimes, two strangers were equally close to the dead man.

  Elara picked up her pen. She had to break the tie. The manual said to prioritize the divergence point closest to the present.

  Candidate A diverged at age ten. Candidate B diverged at age twenty.

  Technically, Candidate B was closer. He had lived more of Thomas's life. But Candidate A had a daughter named Sarah. Thomas's wife was pregnant with a Sarah in this world.

  Elara hesitated. If she chose Candidate B, she honored the timeline of the body. If she chose Candidate A, she honored the trajectory of the attachments. The weights were equal. The choice was hers.

  She looked at the photo of Thomas Henderson in the file. He was smiling, holding a wrench. He looked like a mechanic.

  But the wife wanted to know about the child.

  Elara circled Candidate A. She wrote in the margin: *Salience of attachment outweighs temporal proximity of divergence.* She stamped the form.

  It was a lie, technically. The weights didn't say attachment outweighed time. She had decided it. The similarity relation was not a fact of nature; it was a fact of the form.

  She pushed the file aside. Her desk was clear except for one remaining folder. It was personal. Employees were allowed one petition per decade.

  Elara opened it. The name on the line was *Vance, J. – Father.*

  He had died five years ago. She had waited the full term to file.

  She looked at the Weighting Schedule. It was blank. She had to decide what made her father *him*.

  If she weighted Biological Continuity high, she would get a man with his face, his hands, his DNA. He might be cruel. He might be a stranger who happened to look like Dad.

  If she weighted Psychological Trajectory high, she would get a man with his kindness, his temper, his jokes. He might look like a stranger. He might be a different race, a different age.

  If she weighted Social Attachments high, she would get a man who stayed. Who didn't leave when she was ten.

  Elara picked up her pen. She hovered over the Biological box.

  If she checked it, she could see his face. She could see the way he tucked his napkin into his collar. She could see the scar on his chin.

  But she knew what the report would say. *Subject is alive. Subject is happy. Subject has no daughter.*

  In the world where he stayed, he never met her mother. In the world where he looked like himself, he never learned kindness. In the world where he was kind, he never looked like himself.

  There was no world where he was her father. That combination of matter and history and love existed only here, in this world, where he was dead.

  Mrs. Gable had understood, eventually. She hadn't opened the envelope. She knew that inside was a man who played piano and missed a wife who didn't exist in his world. Loving him would be a betrayal of the husband who died.

  Elara looked at the blank boxes.

  The Bureau's mandate was to fix the weights. To define the terms of the "might have". But the "might have" was always about someone else. It was always a report on a stranger who borrowed a name.

  If she filed this, she would get a report. It would be accurate. It would be true. It would be useless.

  Unless the point wasn't to see him.

  Unless the point was to acknowledge that he was gone, and that only fragments remained scattered across the possibilities. To see that no single world could hold him whole.

  Elara moved the pen. She did not check the boxes. Instead, she wrote in the margin where the weights were supposed to go.

  *Weight: Null.*

  She wrote a note below it. *Request denied by petitioner.*

  She understood now. The report was not a bridge. It was a boundary. It marked the edge of what was actual. To file the form was to admit that the person she wanted was not in the file. It was to admit that grief was the only thing that belonged to this world entirely.

  She closed the folder. She placed it in the outgoing tray, marked *Void*.

  The stamp sat on the desk. She picked it up. She pressed it onto the void form. The sound was like a bone breaking. It was final.

  Elara stood up. She walked to the window. Outside, the city was grey and solid. People walked on the sidewalks. They were themselves. They were dying here. They were not being born elsewhere.

  She turned back to the desk. She picked up Mrs. Gable's file copy. She added a note to the internal log. *Petitioner understood the distinction. Report unopened.*

  It wasn't true. Mrs. Gable hadn't understood. She had just given up.

  Elara sat down. She picked up the next file. *Henderson, T.* She began to draft the letter to the wife. She would tell her about the teacher. She would tell her about the daughter named Sarah. She would not tell her that it was a choice. She would not tell her that the teacher was a stranger who happened to fit the weights.

  She would send the paper. She would let the wife decide if a stranger was enough to love.

  Elara dipped her pen. The ink was black. It stayed on the page. It did not bleed through to the other side. There was no other side. There was only the weight, and the paper, and the silence.

  She began to write.
