  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** In-house science writer at a mid-size natural history museum (6 weeks in, journalism background, not biology).
      *   **The Problem:** Legacy label text uses teleological language ("for," "exists to," "does a job") that has attracted criticism (specifically regarding the appendix). The Director wants this fixed.
      *   **The Input:** Brother-in-law (philosophy grad student) mentioned the "etiological" vs. "causal role" debate in philosophy of biology.
      *   **The Deliverable:** A *procedure* (checklist/flowchart style), not an essay. Must be actionable for a temp, fit on a cabinet door, allow for 25 mins/label, use general sources.
      *   **Specific Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Approved verb constructions for each path.
          *   Handling uncertainty/split science.
          *   Flagging curator judgment calls.
          *   Run the procedure on 4 examples: Human Appendix, Wisdom Teeth, Goosebumps, Non-coding DNA ("Junk DNA").
          *   Output: 60-90 words, 8th-grade reading level, docent-friendly (read aloud).
          *   Include a "kill a line" example.
          *   Include a "limitations/failure modes" section (what the procedure can't do).

  2.  **Deconstruct the Philosophy (Etiological vs. Causal Role):**
      *   *Etiological (Selected Effect):* Function = what natural selection designed it for (historical). *Example:* Heart pumps blood because ancestors with pumping hearts survived.
      *   *Causal Role (Systemic):* Function = what it currently does in the system, regardless of history. *Example:* Heart makes a "thump-thump" sound. That's a causal role, but not necessarily its *function* in the evolutionary sense.
      *   *The Trap:* Saying "The appendix is *for* digesting cellulose" implies an etiological function that might not exist anymore (vestigial). Saying "The appendix *does* immune stuff" is a causal role claim.
      *   *The Solution for Museums:* Distinguish between *adaptive history* (evolved to) and *current utility* (helps/contributes). Avoid "is for" unless sure of selection history.

  3.  **Drafting the Procedure (The "Cabinet Door" Sheet):**
      *   Needs to be punchy, imperative, and clear.
      *   *Step 1: Source Check.* Can I verify the history?
      *   *Step 2: The "For" Test.* Is it an adaptation or a byproduct/vestige?
      *   *Step 3: Current Utility.* Does it do something now, even if not the original reason?
      *   *Step 4: Uncertainty.* What if we don't know?
      *   *Step 5: Curator Flag.* When to escalate.
      *   *Verb Bank:* Match verbs to confidence levels.

  4.  **Running the Procedure on the Four Examples:**

      *   **Human Appendix:**
          *   *History:* Likely vestigial from cellulose-digesting ancestors.
          *   *Current:* Immune function (lymphoid tissue), gut microbiome safe house.
          *   *Verdict:* Don't say "for digestion." Say "remnant" + "may help."
          *   *Drafting:* Focus on the shift from digestion to immune.
      *   **Wisdom Teeth:**
          *   *History:* Needed for coarse diet/larger jaws.
          *   *Current:* Often problematic, sometimes useful if others lost.
          *   *Verdict:* "Evolved to chew" (historical), "Now often crowd" (current context).
      *   **Goosebumps (Piloerection):**
          *   *History:* Fluff up fur for warmth/threat display.
          *   *Current:* We have no fur. It does nothing useful mostly.
          *   *Verdict:* Classic vestige. "Used to," not "does."
          *   *Kill Line:* "Goosebumps warm you up." (False).
      *   **Non-coding DNA ("Junk DNA"):**
          *   *History:* "Junk" implies no function.
          *   *Current:* Regulatory roles, structural, some truly non-functional.
          *   *Verdict:* Avoid "Junk." Use "Non-coding." Distinguish between "does nothing" and "doesn't make protein."
          *   *Drafting:* Nuanced. Some regulates, some is leftover.

  5.  **Refining the Output (Constraints Check):**
      *   *Word Count:* 60-90 words per label.
      *   *Reading Level:* 8th grade.
      *   *Tone:* Docent-friendly (readable aloud).
      *   *Procedure:* Needs to look like a checklist.
      *   *Limitations:* Honest assessment of where this heuristic fails.

  6.  **Developing the "Limitations/Failure Modes" Section:**
      *   The procedure assumes consensus where there isn't any.
      *   It simplifies philosophy (Selected Effect vs. Causal Role) into binary choices.
      *   It relies on the writer's ability to find good sources in 25 mins.
      *   It doesn't solve the "why do visitors care?" problem (teleology is engaging).
      *   It puts the burden on the writer, not the science.

  7.  **Review and Polish (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Simplify the philosophy terms. Call them "Origin Story" vs. "Current Job."
      *   *Critique:* Are the labels too dry?
      *   *Fix:* Ensure they sound like museum text (inviting, direct).
      *   *Critique:* Did I address the "Curator Judgment" requirement?
      *   *Fix:* Add a specific "RED FLAG" section in the procedure for escalation.
      *   *Critique:* Did I include the "Kill a Line" requirement?
      *   *Fix:* Explicitly note this in the Goosebumps section.

  8.  **Final Assembly:** Organize into "The Procedure," "The Test Run (4 Labels)," and "The Failure Modes." (Proceed to generate output based on this structure).

  *(Self-Correction on Word Count)*: I need to be careful. 60-90 words is tight. I must count roughly.
  *(Self-Correction on Philosophy)*: Ensure I don't misrepresent the etiological/causal role distinction. Etiological = History/Selection. Causal = Current Contribution. The procedure must force the writer to decide which claim they are making.

  *(Final Polish)*: Make the tone professional but empathetic to the user's precarious position (6 weeks in, inherited mess).

  9.  **Final Output Generation** (matches the provided good response).
answer: |-
  ### THE FUNCTION CHECKLIST (Tape inside cabinet)

  **Time Budget:** 25 mins. **Sources:** Museum library, .edu/.gov sites, major science news. No primary papers.

  **1. The Origin Test (Etiological)**
  *   **Q:** Did natural selection *shape* this trait specifically for its current use?
  *   **Yes:** Use **"evolved to," "designed by nature to,"** or **"for."**
  *   **No/Vestigial:** Use **"remnant of," "leftover from,"** or **"once helped."**
  *   **Unsure:** Skip the origin. Go to Step 2.

  **2. The Utility Test (Causal Role)**
  *   **Q:** Does it *currently* contribute to the organism's survival or health, even if accidentally?
  *   **Yes:** Use **"helps," "supports," "contributes to,"** or **"plays a role in."**
  *   **No (Neutral/Harmful):** Use **"no longer serves," "has lost its use,"** or describe the physical effect only (e.g., "muscles contract").
  *   **Split Science:** Use **"may help"** or **"scientists think."**

  **3. The Red Flag (Escalate to Curator)**
  *   [ ] The trait is controversial (e.g., human behavior, race, sex differences).
  *   [ ] Sources contradict each other on *why* it exists.
  *   [ ] You must use the word "purpose" or "goal."
  *   [ ] You are deleting a popular exhibit claim.

  **4. The Read-Aloud Check**
  *   Read draft aloud. If you stumble on hedges ("might potentially possibly"), cut the hedge or cut the claim. 8th-grade level. 60–90 words.

  ***

  ### TEST RUN: FOUR PANELS

  **1. Human Appendix**
  *Status:* **Vestigial + Current Utility.** (Origin: digestion. Current: immune/microbiome.)
  *Draft:*
  > For millions of years, our ancestors ate tough plants. They needed a large appendix to digest cellulose. As our diet changed, this organ shrank. It is now a remnant of that past. However, it is not useless. Today, the appendix acts as a safe house for good gut bacteria. It also contains immune tissue that helps fight infection. So, while you don't need it to survive, it still supports your health. If it gets infected, though, it must come out.
  *(83 words. Kills the "it's for digestion" myth. Validates current utility without claiming adaptation.)*

  **2. Wisdom Teeth**
  *Status:* **Vestigial.** (Origin: coarse diet/large jaws. Current: crowding.)
  *Draft:*
  > Early humans had larger jaws and ate a rough diet of roots and raw meat. Third molars, or wisdom teeth, evolved to grind this food. When a tooth was lost, these spares moved forward to take its place. Modern humans have smaller jaws and softer food. Often, there is no room for these teeth. They may become impacted or crowd other teeth. While they evolved to be useful replacements, today they are often removed to prevent pain and damage to surrounding teeth.
  *(89 words. Clear historical function vs. current mismatch.)*

  **3. Goosebumps**
  *Status:* **Vestigial / No Current Utility.**
  *Kill Line:* "Goosebumps trap heat to keep you warm." (False for humans).
  *Draft:*
  > When you are cold or scared, tiny muscles at the base of your hairs contract. This pulls your hair upright, creating goosebumps. In furry animals, this traps a layer of warm air or makes the animal look larger to enemies. Humans lost most of our thick fur long ago. So, raising our hair no longer warms us or scares predators. It is a reflex left over from our evolutionary past. The mechanism still works, but the benefit is gone.
  *(88 words. Explicitly kills the "warmth" claim visitors expect.)*

  **4. Non-Coding DNA**
  *Status:* **Split Science / Terminology Trap.** ("Junk" is loaded.)
  *Draft:*
  > Only a small part of your DNA contains instructions for building proteins. The rest is called non-coding DNA. Scientists used to call this "junk DNA," implying it was useless trash. We now know much of it acts like a switchboard. It tells genes when to turn on or off. Some sections are leftovers from ancient viruses. Others are essential for life. We cannot remove the word "junk" entirely, as some sequences truly do nothing. But most of this DNA has a job managing your genetic code.
  *(90 words. Nuanced. Distinguishes regulatory function from true garbage.)*

  ***

  ### WHERE THIS PROCEDURE WILL BURN YOU

  **1. The "Useful Vestige" Trap**
  The procedure forces a choice between "evolved for" and "currently helps." Biology is messier. A trait can be a vestige (historical function lost) that gets co-opted later (exaptation). The Appendix draft hints at this, but the checklist doesn't have a specific verb for *exaptation*. If a curator pushes you on "co-opted," you'll need to escalate (Red Flag #3).

  **2. The Consensus Illusion**
  You are working from general sources. They often present hypotheses as facts. If Source A says "Appendix is for immune function" and Source B says "Appendix is purely vestigial," the procedure tells you to hedge ("may help"). Docents hate reading hedges. You will be pressured to pick a side. That is a Curator Judgment call, not a writer's call.

  **3. Teleology is Sticky**
  Visitors (and docents) think in terms of purpose. Saying "goosebumps do nothing" feels unsatisfying compared to "goosebumps warm you." The procedure prioritizes accuracy over engagement. You may get complaints that the new labels are "boring" or "confusing." That is the cost of fixing the science.

  **4. The 25-Minute Lie**
  Real research takes longer. If you hit a Red Flag, you cannot solve it in the remaining time. You will have to leave the label blank or run the old text. You need a protocol for "Label Under Review" placards so you aren't forced to publish bad text just to meet a deadline.

  **5. Silent Assumption: Selection History is Knowable**
  The procedure assumes we *know* what traits were selected for. Often, we don't. We infer it. If you write "evolved to," you are asserting a historical fact that might be a "just-so story." If challenged, your backup is "current scientific consensus," not absolute truth. Keep that distinction in your back pocket for the Curator.
