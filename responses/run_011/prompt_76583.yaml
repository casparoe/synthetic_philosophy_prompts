answer: |-
  **The Hippo Shepherd: Counsel on the Tongue**
  *From the Desk of Bishop Valerius*

  **Q:** *I sell oil. An amphora has a hairline crack, invisible unless held to the sun. Must I proclaim it?*
  **A:** Beloved, truth resides in the will, not merely the market. To say "This is sound" when you know it is not is to have one thing in the heart and another on the tongue. This is a lie, and every lie wounds the soul. However, you are not compelled to speak all you know. Offer the jar without comment, or price it as "unexamined." Silence is not falsehood. Sell the goods, but keep your conscience whole. The loss of coin is preferable to the ruin of the inner man.

  **Q:** *A violent man seeks my guest with a sword. He asks me where my guest hides. If I speak truth, my friend dies. If I lie, my soul dies. What must I do?*
  **A:** You owe no debt of truth to violence. To answer is to become an instrument of murder; to lie is to become an instrument of the Devil. There is a third way: refuse the tongue's service. Say, "I know where he is, but I will not tell you." This is the truth of your heart spoken aloud. If the pursuer strikes, the blood is on his hands, not yours. Better a dead body than a dead conscience. Guard the guest with silence, not deceit.

  **Q:** *I wish to expose a heretical sect. May I feign adherence to enter their meetings?*
  **A:** To affirm error is to deny Christ. You may attend as an inquirer, for all seek truth. But if they demand you swear to their dogma, you cannot. Say, "I am yet learning." If they press for a lie, depart. It is better they remain in error than you join them in it. Gather your evidence through observation, not participation. Do not let your zeal for the Church become a wound against your own soul.

  **Q:** *Did not Rahab lie to the King of Jericho to save the spies? Is she not praised in Scripture?*
  **A:** Rahab is commended for her faith and hospitality, not her falsehood. As a catechumen knows, some sins are remitted due to great charity, but they remain sins. We honor her salvation, not her deception. Do not imitate the fault because God pardoned the penitent. To lie for a good end is to do evil that good may come. Trust that God can save the innocent without requiring you to corrupt your tongue.

  **Q:** *Excellency, rumors say a fugitive priest sleeps in your episcopal house. The Magistrate asks me to ask you: Is he there? I await your reply to print.*
  **A:** ...

  *[The column ends abruptly here.]*
