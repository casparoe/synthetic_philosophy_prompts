answer: |-
  Your "physics sniff test" is spot on. You have identified exactly where a populariser has taken a dynamic process with specific boundary conditions and flattened it into a static law. The author of that chapter has taken Hume's long-run equilibrium conclusions and presented them as if they were the whole story, erasing the short-run mechanics that Hume actually thought were more important for policy.

  Here is the line-by-line breakdown, followed by your four specific verdicts.

  ### Line-by-Line Analysis

  **1. "Hume's political essays of the early 1750s contain, in miniature, the monetary theory that the classics would later get the credit for."**
  *   **Verdict:** Fair.
  *   **Comment:** This is standard historiography. Smith and Ricardo did systematize what Hume sketched. No foul play here.

  **2. "Money, he writes, is not one of the wheels of trade but 'the oil which renders the motion of the wheels more smooth and easy'; consequently the quantity of money a nation holds is of no consequence to its wealth, which depends entirely on the number and the industry of its people."**
  *   **Verdict:** Accurate quote, misleading consequence.
  *   **Comment:** The "oil" metaphor is genuine Hume. The claim that wealth depends on "number and industry" (labour and goods) is also genuine Hume. The word "consequently" is where the sleight of hand happens. It implies that *because* money is just oil, the quantity *never* matters. Hume argues the quantity doesn't matter *in the long run*, but he spends considerable effort explaining why it matters a great deal in the short run.

  **3. "Hence his famous thought experiment: annihilate four-fifths of all the coin in Britain overnight and nothing real has been lost."**
  *   **Verdict:** Accurate.
  *   **Comment:** This is the famous "four-fifths" scenario from the essay *Of Money*. Hume does argue that real wealth (goods/people) remains, even if nominal prices crash.

  **4. "Prices sink in proportion, British labour and manufactures become the cheapest anywhere, the money flows back in, and the nation is restored to its level."**
  *   **Verdict:** Simplification that hides the mechanism.
  *   **Comment:** This describes the *Price-Specie-Flow Mechanism*. It is technically correct as a summary of the equilibrium outcome. However, it describes the adjustment as automatic and proportional. Hume's actual description involves a lag: prices don't sink instantly, and labour doesn't become cheap instantly. There is a period of distress. More importantly, when he describes the *reverse* (money increasing), he emphasizes that prices do *not* rise immediately, which allows for a temporary boost in employment. This sentence erases that time lag.

  **5. "This is the price-specie-flow mechanism, as later writers named it, and disposed of mercantilism: a surplus is self-correcting, so there is no balance of trade worth defending and no need for the state to manage the money supply."**
  *   **Verdict:** Half-right, half-wrong.
  *   **Comment:** It did dispose of the idea that hoarding gold makes a nation rich. However, "no need for the state to manage the money supply" is problematic. Hume explicitly argued the state *should* manage the supply of paper credit (by restricting it). He wasn't a modern central banker, but he wasn't a "hands-off" absolutist either.

  **6. "For the same reason Hume was hostile to paper credit — multiplying bank notes adds nothing to the stock of labour and commodities, it only makes prices higher."**
  *   **Verdict:** Wrong reasoning.
  *   **Comment:** This is a major distortion. Hume's hostility to paper money was not simply that it was "neutral" (adds nothing). He admitted paper money *could* stimulate industry in the short run (just like gold). His hostility was based on financial stability, the risk of bubbles, and the fear that excessive paper would drive up prices *faster* than gold, making British goods uncompetitive and driving the actual gold out of the country.

  **7. "His outlook was accordingly cosmopolitan rather than national: he could say that he prayed for the flourishing commerce of Germany, Spain, Italy, and even France itself, since one nation's gain is never another's loss."**
  *   **Verdict:** Fair simplification on trade, wrong on absolute principle.
  *   **Comment:** Hume did argue against the "jealousy of trade." However, the word "never" is too strong. Hume allowed that a neighbour's growth could threaten your security (naval power), even if it helped your trade.

  **8. "What Hume had discovered, in short, was the neutrality of money, and the laissez-faire that goes with it."**
  *   **Verdict:** Anachronistic import.
  *   **Comment:** "Neutrality of money" is a modern term applied retrospectively. "Laissez-faire" is a label from a later generation of economists. Hume was a moderate institutionalist, not a dogmatic libertarian. He believed in laws, regulations, and state action where necessary to maintain stability.

  ---

  ### The Four Verdicts

  **1. Is the reason given for Hume's hostility to paper credit his actual reason?**
  **No.** The chapter claims Hume hated paper credit because it "adds nothing... only makes prices higher" (i.e., because it is neutral and inflationary).
  **Hume's actual view:** He hated it primarily because it was unstable and dangerous. In his essay *Of Paper Money*, he admits that increasing paper credit *can* stimulate industry in the short term (contradicting the chapter's claim that it adds "nothing"). However, he argued it tends to raise prices too quickly, which drives away gold and leaves the nation vulnerable to financial panics. He wanted to restrict paper money to prevent instability, not merely because he thought it was economically pointless.

  **2. Does "no need for the state to manage the money supply" survive contact with Hume's proposals?**
  **No.** This is the biggest policy error in the summary. While Hume argued against the mercantilist state *hoarding* gold, he explicitly proposed that the state *should* regulate banks. He suggested laws to restrict the issuance of small banknotes and to ensure banks held sufficient reserves. That is a form of managing the money supply. The summary paints him as a "hands-off" theorist; in reality, he wanted a legal framework to keep the money supply (specifically paper) from expanding too fast.

  **3. Is the claim that "one nation's gain is never another's loss" something Hume held without exception?**
  **No.** You were right to have a vague memory of a carve-out. In *Of the Jealousy of Trade*, Hume argues that generally, trade is positive-sum. However, he acknowledges a geopolitical exception: if a rival nation becomes too powerful militarily (specifically naval power), their gain *can* be your loss in terms of security. He distinguishes between economic rivalry (which he dismisses) and power rivalry (which he accepts as real). The summary removes this nuance to make him sound like a modern globalist.

  **4. Does the conclusion about "neutrality and laissez-faire" follow from the accurate parts, or is it imported?**
  **It is imported.** The "neutrality of money" is a long-run conclusion that Hume reached, but it is not the *only* thing he discovered. As your underlined quote from *Of Interest* proves, Hume placed massive importance on the *non-neutrality* of money during the transition period (the "progress towards these changes"). He believed a gradual increase in money was beneficial precisely because it *wasn't* neutral in the short run—it woke up industry. The "laissez-faire" label is a 19th-century stamp placed on an 18th-century thinker who was actually quite comfortable with state regulation of banking.

  ### The "Price Story" Flag

  You asked to flag if the chapter describes the adjustment as purely a price story when Hume's version is doing something else.

  **Yes, it does.**
  The summary describes the mechanism as: Money changes $\rightarrow$ Prices change $\rightarrow$ Trade flows adjust.
  Hume's mechanism is: Money changes $\rightarrow$ **Incomes and Spending change** $\rightarrow$ Industry is stimulated $\rightarrow$ Prices eventually change $\rightarrow$ Trade flows adjust.

  The summary skips the "Incomes and Spending" phase. This is the "progress towards these changes" you underlined. For Hume, the most vital part of the theory was that when new money enters, it doesn't raise prices instantly. It goes into the pockets of workers and merchants first. They spend it while prices are still low. This increases demand and stimulates production. *Then* prices rise. By skipping this, the summary makes Hume look like a pure Quantity Theorist (prices move instantly with money), whereas Hume was actually describing a transmission mechanism where money has real effects on output before it has effects on prices.

  ### Final Verdict

  The chapter is not "invented," but it is a caricature. It takes Hume's long-run equilibrium results and presents them as his entire philosophy, stripping out the short-run dynamics that he considered practically useful.

  It treats him as a precursor to 19th-century laissez-faire liberalism, whereas he was actually an 18th-century moderate who believed in the utility of money growth (in moderation) and the necessity of banking regulation. Your intuition regarding the *Of Interest* quote was the key: the author dropped the "short-run" condition to make the theory look cleaner, but in doing so, they removed the part of Hume's theory that explained how economies actually grow.

  You are not misreading it. The author has smoothed over the friction that Hume thought was the engine.
