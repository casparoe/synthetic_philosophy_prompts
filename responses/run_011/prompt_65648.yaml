answer: |-
  Your hunch is correct, and it aligns with a specific, well-established tension in political philosophy and behavioral science. You have identified that the practice of nonpartisan turnout work operates on two different philosophical registers simultaneously: one for the *organization* (aggregative utility) and one for the *agent* (individual efficacy). The coherence of the enterprise depends on keeping these two registers distinct, even when they contradict one another.

  Here is a reconstruction of the practice, followed by the summary table you requested.

  ### The Reconstruction

  To understand what your practice takes for granted, we must separate the **metric of success** from the **mechanism of action**.

  **1. The Metric: Aggregative Legitimacy**
  At the organizational level, the practice rejects *instrumentalism* (the idea that a vote is only valuable if it changes the winner). If the organization were strictly instrumentalist, it would not exist, because, as your materials admit, the probability of a single vote deciding a national election is effectively zero. Instead, the organization operates on a view of **procedural value**. It assumes that an election with higher turnout is intrinsically more legitimate, more stable, or more representative, regardless of who wins. This is a settled premise for the organization: the total number of ballots ($N$) has value independent of the direction ($D$). If you adopted the view that *only* the causal contribution of an individual act matters, the organization would cease to knock on doors. It would instead lobby for systemic changes (automatic registration, compulsory voting) where one unit of effort changes $N$ by thousands rather than one. The very existence of door-knocking presupposes that marginal increases in $N$ are worth the cost, even without causal decisiveness.

  **2. The Mechanism: Conditional Cooperation**
  This is where your hunch lands. You asked if the practice commits us to the idea that "one person's decision gives others like them a reason to decide the same way." The data you cited (the neighbor letter) confirms this. In political science, this is known as **conditional cooperation** or **social norm enforcement**. The practice presupposes that voting is not an isolated atomic act but a social signal. When the letter shows a household their neighbors' voting record, it leverages the assumption that humans are motivated to conform to local norms to avoid social sanction or to maintain self-image.

  This resolves the paradox you noted between the predictive model and the rhetoric of free will. The model treats voting as *determined* by peer behavior because, empirically, it is. The rhetoric treats voting as *free* because the mechanism only works if the voter feels agency. If you tell a voter, "You are statistically programmed to vote," they may not vote. If you tell them, "Your neighbors are watching," they feel the weight of a choice. The practice, therefore, requires a **pragmatic fiction of agency**. It rules out the view that voters are purely rational calculators of cost/benefit (the "Downsian" model), because if they were, the "duty" and "shame" letters would not work, and the "one vote doesn't matter" calculation would prevail.

  **3. The Tension: Duty vs. Pressure**
  You noted that the "civic duty" script moves turnout less than the "social pressure" script, yet volunteers are trained to use the duty script. This is not an accident; it is an ethical containment strategy. The "neighbor letter" (social shaming) is highly effective but controversial; it can feel coercive. The "civic duty" script is less effective but socially permissible. The practice presupposes that **moral suasion is the acceptable face of behavioral nudging**. It rules out the honest admission that the organization is relying on conformity and shame, because that admission might reduce trust in the electoral process itself.

  **4. What Would Change under Pure Aggregation?**
  If you adopted the view that *only* the total number of ballots has value and no individual act carries weight beyond its causal contribution, the practice would transform radically.
  *   **Volunteers:** You would not tell volunteers "your vote counts." You would tell them, "we are buying 500 votes for $5,000." The moral recruitment of volunteers would vanish, replaced by transactional labor.
  *   **Voters:** You would stop asking individuals to vote for the sake of democracy. You would focus entirely on reducing friction (rides to polls, mail ballots) rather than increasing motivation.
  *   **Messaging:** The "neighbor letter" would likely be discarded or modified, because if individual acts don't matter, social signaling doesn't matter. You would focus only on logistical removal of barriers.
  *   **Coherence:** The current practice *needs* the individual to feel their act matters. A pure aggregation view kills the volunteer motivation that fuels the low-cost labor required to make the aggregation cheap.

  **5. Settled vs. Contested**
  It is **settled** in political science (the "Paradox of Voting") that a single vote is causally negligible in large elections. It is **settled** in experimental literature (Gerber, Green, Larimer) that social pressure mailers outperform duty-based appeals.
  It is **contested** whether high turnout actually improves governance outcomes (some argue it introduces less informed voters). It is **contested** whether it is ethical to use social pressure (shame) to mobilize voters who may not wish to participate. It is **contested** whether the "expressive" value of voting (your hunch) is a sufficient justification for the cost, or if it is merely a psychological trick to overcome rational apathy.

  ### Summary Table

  | presupposition | where it shows up | what it rules out | strength | reservation |
  | :--- | :--- | :--- | :--- | :--- |
  | **The total volume of voting has value independent of the outcome.** | The organization's nonpartisan mission; spending money to generate ballots without caring who wins. | **Strict Instrumentalism:** The view that voting is only valuable if it changes the election winner. | strictly required | Settled for the org, but contested in political science whether high turnout actually improves policy outcomes. |
  | **Voting behavior is malleable through contact.** | The existence of the canvass itself; measuring success by "votes per dollar spent." | **Hard Determinism:** The view that voting is entirely fixed by demographics/economics and cannot be changed by persuasion. | strictly required | Settled by field experiments (Green & Gerber), though the *duration* of the effect is debated. |
  | **Voters are motivated by social norms, not just civic duty.** | The "neighbor letter" mailer; the predictive model based on peer behavior. | **Atomized Rationality:** The view that voters decide in isolation based purely on self-interest or abstract duty. | strongly suggested | The data is robust (social pressure works best), but it is contested whether this is ethical to leverage. |
  | **Volunteers require a belief in individual efficacy to function.** | The script ("your vote counts") contradicts the internal data (one vote rarely decides). | **Radical Honesty:** Telling volunteers the statistical truth that their individual causal impact is near-zero. | strongly suggested | Live dispute among organizers: some argue volunteers stay longer if treated as professionals who know the stats; others say they quit. |
  | **Voting is an expression of identity, not just a policy lever.** | Your hunch ("visible sample of a pattern"); the focus on "people like you." | **Purely Causal View:** The idea that a vote is only a tool to select a candidate. | merely compatible | This is the "Expressive Voting" theory (Brennan/Lomasky). It explains the behavior well, but the org does not explicitly commit to it. |

  ### Notes on the Table
  *   **Strength:** "Strictly required" means if this premise is false, the practice is irrational or impossible. "Strongly suggested" means the data points this way, but the practice could theoretically survive without it (e.g., you could mobilize via duty, just less efficiently). "Merely compatible" means the practice works with this view, but doesn't need it.
  *   **Reservation:** This column highlights where the consensus breaks down. For example, while the *data* on social pressure is settled, the *ethics* of using it are not. Similarly, while the org *acts* as if turnout improves democracy, political scientists dispute whether higher turnout actually leads to better governance.
