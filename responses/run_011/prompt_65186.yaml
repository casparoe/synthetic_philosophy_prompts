  9.  **Self-Correction/Nuance Check during drafting:**

      *   *Case 2 Nuance:* If I say "Amend to include in-kind," admitting Case 2 now looks hypocritical. I need to frame it as "Current policy stands for him because he complied; future policy closes gap."
      *   *Case 1 Nuance:* The ledger subtracts from the *grant*. If she got \$180k, she's disqualified completely under current rules. My recommendation must be to allow an exemption for "dissipated assets due to hardship."
      *   *Case 3 Nuance:* Remainder interests are tricky. Standard financial aid (FAFSA) often excludes them. Housing should too.
      *   *The "Audit" Worry:* Make sure to distinguish between "policing families" and "measuring economic advantage."

