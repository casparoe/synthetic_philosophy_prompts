answer: |-
  In a mid-sized homeowners association, the President, Alice, diverts reserve funds to renovate her own driveway, violating the financial bylaws. The Vice-President, Bob, discovers the breach and publicly demands Alice's immediate removal, citing the specific statute she violated. Bob has never mishandled funds himself, did not encourage or assist Alice's action, and consistently enforces financial rules against all board members equally. However, Article 5, Section 2 of the association bylaws stipulates that if the President is removed for cause, the Vice-President automatically assumes the office for the remainder of the term without a new election. Bob knows this succession rule applies, and while he makes no secret of it, he proceeds with the accusation anyway, positioning himself as the guardian of the association's integrity while standing directly in line to inherit the power he seeks to wield through the sanction.

  1.  **The Four Accounts:**
      *   **Hypocrisy:** Bob is blameless regarding the specific wrong (financial misuse); he has not diverted funds himself. The hypocrisy account returns *standing intact* because he is not guilty of the same transgression.
      *   **Complicity:** Bob did not aid, abet, or benefit from the *wrongdoing itself* (the diversion of funds); his benefit arises only from the *sanction* (removal). The complicity account returns *standing intact* because he is not causally or intentionally linked to the violation.
      *   **Meddling:** As Vice-President, Bob has a fiduciary duty to oversee finances; this is explicitly his business. The meddling account returns *standing intact* because he holds a relevant relational role.
      *   **Selective Enforcement:** Bob enforces the financial bylaws equally against all other members. The selective enforcement account returns *standing intact* because he is not discriminating in his application of the norm.

  2.  **The Feature and the Edit:**
      *   **Feature:** **Structural Conflict of Interest (Direct Beneficiary of Sanction).** The defeater is not Bob's moral record but his structural position relative to the outcome of the blame; he stands to gain authority directly from the successful imposition of the sanction.
      *   **Minimal Edit:** Change Article 5, Section 2 so that if the President is removed, a neutral third party or elected successor assumes the office, leaving Bob in the Vice-President role with no personal promotion at stake.
      *   **Intuition Flip:** The intuition flips sharply. With the edit, Bob is viewed as a principled whistleblower fulfilling his duty. Without the edit, he is viewed as a usurper whose blame is normatively inert, regardless of its truth. The loss of standing is immediate and structural, not gradual.

  3.  **Steelman Objection and Evaluation:**
      *   **Objection:** This isn't a standing problem; it's an epistemic or prudential one. We distrust Bob's *motives* (he wants the job), so we discount his testimony, or we think blaming is *imprudent* because it looks bad. If Bob transparently admits the conflict and is truthful, his blame is morally permissible, just politically risky. Therefore, "standing" here is just a label for credibility loss.
      *   **Evaluation:** The objection does not win. Standing is about normative *authority*, not merely credibility or prudence. Consider a judge who recuses themselves due to a conflict: even if the judge is perfectly honest and the defendant is clearly guilty, the judge lacks the *authority* to issue the verdict. The verdict would be void *ab initio*, not just "discounted." Similarly, Bob's blame fails to function as legitimate accountability because the normative channel is corrupted by the incentive structure. Transparency fixes hypocrisy (moral record), but it does not fix structural disqualification. Therefore, this case identifies a distinct, non-record-based condition of standing: **Normative Disqualification via Conflict of Interest.**
