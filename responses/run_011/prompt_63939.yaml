answer: |-
  ### The Implicature Audit: A 20-Minute Workflow

  **Discarded Distinctions & Justification**
  To fit a 20-minute review by a non-specialist, we compress Gricean theory. The following distinctions are discarded:
  *   **Flouting vs. Violating:** We do not care if the writer *intended* to mislead (violation) or expected the reader to read between the lines (flouting). Liability arises from the reader's inference, not the writer's intent. **Discard.**
  *   **Generalized vs. Particularized Implicature:** Whether an inference is standard (generalized) or context-dependent (particularized) is academic. We only care if the inference is *actionable*. **Discard.**
  *   **Maxims of Relation and Manner:** In safety documentation, relevance is assumed (if it's in the bulletin, it matters) and clarity is enforced by standard style guides. These do not generate unique liability risks compared to Quantity and Quality. **Discard.**

  **Surviving Distinctions**
  *   **Quantity (Completeness):** The assumption that you have said everything required. This is our primary liability vector.
  *   **Quality (Evidence):** The assumption that you have evidence for what you say.
  *   **Actionable vs. Inert:** An implicature is **Actionable** if a reasonable technician would change their behavior based on it (e.g., skip a check, touch a live wire). It is **Inert** if it affects their opinion of the company but not their physical interaction with the machine. **Keep.**

  ---

  ### The Procedure

  **Step 1: The Isolation Test (Constraint 1)**
  *   **Question:** If this sentence were read aloud over a noisy radio, with no access to the rest of the document, what is the single strongest claim a listener would take away?
  *   **Sufficient Answer:** A one-sentence paraphrase of the *implication*, not the literal text. (e.g., Text: "Tested on Model 7." Implication: "Safe for all Model 7s.")
  *   **Branching:**
      *   If the implication relies on seeing a figure, footnote, or previous paragraph: **REVISE** (Move critical info into the sentence).
      *   If the implication is clear: **Proceed to Step 2.**

  **Step 2: The Silence Test (Constraint 2)**
  *   **Question:** Given that readers treat this bulletin as the *complete* answer, what does the *omission* of [X] tell them? (Where [X] is a known variable: firmware version, configuration, environment).
  *   **Sufficient Answer:** "They assume [X] is not a factor" or "They assume we checked [X]."
      *   *Estimating the Prior:* Ask: "If I were a technician and this was the only email I received today, would I assume the unmentioned cases are safe?" Acknowledge this is **50% guesswork** based on reviewer experience. If the reviewer cannot decide, treat the risk as **High**.
  *   **Branching:**
      *   If silence implies safety/coverage that does not exist: **REVISE** (State limits explicitly).
      *   If silence is inert (e.g., office hours): **Proceed to Step 3.**

  **Step 3: The Hedge Test (Constraint 3)**
  *   **Question:** Does adding a qualifier (e.g., "recommend," "may," "to our knowledge") make the sentence sound like we are hiding a known failure?
  *   **Sufficient Answer:** "Yes, it sounds like we know more than we are saying" or "No, it accurately reflects uncertainty."
  *   **Branching:**
      *   If a hedge creates a "concealment" implicature: **Delete the sentence** or **State the stronger fact outright**. Do not patch with a cancellation clause.
      *   If the hedge is factually required (e.g., genuine uncertainty): **Proceed to Step 4.**

  **Step 4: The Harm Triage**
  *   **Question:** If the inference from Step 1 is false, will a technician get hurt or damage the machine?
  *   **Sufficient Answer:** "Yes" (Actionable) or "No" (Inert).
  *   **Branching:**
      *   If Actionable + False Implicature: **REVISE** or **ESCALATE**.
      *   If Inert + False Implicature: **SHIP** (Note the inaccuracy for future correction, but do not delay release).

  **Step 5: The Recursion Stop (Constraint 3)**
  *   **Question:** Does the *revised* sentence generate a new actionable implicature?
  *   **Sufficient Answer:** "Yes" or "No."
  *   **Branching:**
      *   If **Yes**: **ESCALATE**. Do not attempt a second revision.
      *   If **No**: **SHIP**.
  *   **Justification:** This is a **policy choice**, not a linguistic fact. Infinite iteration leads to "design by committee" and unreadable text. We accept residual risk to maintain workflow velocity.

  ---

  ### Draft Analysis

  #### Draft A
  *"The revised brake-hold routine has been validated on all Model 7 configurations. No unexpected motion has been observed in the field since firmware 4.2."*

  1.  **Isolation:**
      *   *Inference:* "All Model 7s (including mine) are safe. The field is safe."
      *   *Branch:* Clear implication. Proceed.
  2.  **Silence:**
      *   *Inference:* Omission of "lab-only" implies "customer configs included." Omission of "survey" implies "passive monitoring confirmed safety."
      *   *Estimate:* High confidence technician assumes this covers their specific cell. (50% guesswork, but erring on safety).
      *   *Branch:* Silence implies coverage we don't have. **REVISE.**
  3.  **Hedge:**
      *   *Check:* No hedges used. Strong claims made.
      *   *Branch:* Proceed.
  4.  **Harm:**
      *   *Check:* If brake fails on unvalidated config, technician is crushed.
      *   *Branch:* Actionable. **REVISE.**
  5.  **Recursion:**
      *   *Proposed Fix:* "Validated on standard lab configurations. No field failures reported to support."
      *   *New Implicature:* "There might be unreported failures." (True, but safer).
      *   *Branch:* No new *false* actionable implicature. **SHIP** the revision.

  *   **Belief Check:** We do not believe the original implication (we didn't test all configs).
  *   **Revised Text:** "The revised brake-hold routine has been validated on standard lab configurations of Model 7. No field failures have been reported to us since firmware 4.2."

  #### Draft B
  *"Install the guard extension shown in Figure 3. The light curtain continues to provide its intended protective function."*

  1.  **Isolation:**
      *   *Inference:* "The light curtain works everywhere as intended."
      *   *Branch:* Clear implication. Proceed.
  2.  **Silence:**
      *   *Inference:* Omission of "except crouching" implies "no exceptions." Omission of firmware implies "all versions."
      *   *Estimate:* Technician assumes full protection.
      *   *Branch:* Silence implies safety we know is false. **REVISE.**
  3.  **Hedge:**
      *   *Check:* Adding "in most cases" sounds like we know it fails sometimes.
      *   *Branch:* Hedge creates concealment implicature. **State Stronger Fact.**
  4.  **Harm:**
      *   *Check:* Curtain failure = crushing hazard.
      *   *Branch:* Actionable. **ESCALATE.** (Admitting a known defect in writing is a business liability decision, not just comms).
  5.  **Recursion:**
      *   *Stop:* We are not writing the defect admission here. We are flagging the liability.

  *   **Belief Check:** We know the inference is false (crouching operator risk).
  *   **Revised Text:** (Requires Engineering/Legal decision). Draft for escalation: "Install the guard extension. Note: Light curtain does not detect crouching operators in Cell Geometry X. Fix valid for Firmware 5.0+."
  *   **Preference Conflict:** This forces us to state a known defect in writing. My preference might be to stay vague to avoid lawsuits; the procedure forces truth to avoid physical injury.

  #### Draft C
  *"We recommend that replacement of the interlock be considered."* (Changed from "The interlock must be replaced")

  1.  **Isolation:**
      *   *Inference:* "Replacement is optional. The machine can operate safely without it."
      *   *Branch:* Clear implication. Proceed.
  2.  **Silence:**
      *   *Inference:* Omission of "mandatory" implies "not mandatory."
      *   *Estimate:* Technician will skip replacement to save time.
      *   *Branch:* Silence implies optionality. **REVISE.**
  3.  **Hedge:**
      *   *Check:* "Recommend" is a hedge.
      *   *Branch:* Hedge creates "not required" implicature. **State Stronger Fact.**
  4.  **Harm:**
      *   *Check:* If interlock is safety-critical, skipping it = hazard.
      *   *Branch:* Actionable. **ESCALATE.** (Overruling Regulatory/Legal on safety mandate).
  5.  **Recursion:**
      *   *Stop:* Legal requested the change. Comms cannot override Legal without higher authority.

  *   **Belief Check:** If Engineering says it *must* be replaced, we do not believe the implication that it is optional.
  *   **Revised Text:** "The interlock must be replaced."
  *   **Preference Conflict:** Regulatory prefers "recommend" to reduce contractual liability. The procedure identifies this as a safety hazard requiring escalation to overrule Legal.

  ---

  ### Honest Limits

  1.  **The "Actionable" Guess:** Step 4 relies on the reviewer's ability to predict technician behavior. Two competent reviewers may disagree on whether a specific inference leads to physical harm or just operational annoyance. This is unavoidable without field observation.
  2.  **The Prior Estimate:** Step 2 admits to 50% guesswork. We are simulating a reader's mind without data. If the reviewer is too close to the product, they will fail this test (the "Curse of Knowledge").
  3.  **Substitution:** This procedure cannot substitute for Engineering truth. It can only flag when language *diverges* from truth. If Engineering lies to Comms, this workflow will still produce a "SHIP" verdict on a dangerous document. It audits coherence, not reality.

  Verdict: A=REVISE, B=ESCALATE, C=ESCALATE
