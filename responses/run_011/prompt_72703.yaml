  The pen decides who was Admitted.
  The column waits for who got Discharged.
  The black mark shows where someone Died.
  The state requires the total Cost.
  The county pays for Keeping.
  The ledger counts the daily Rations.

  Subtract the bread from the weekly Rations.
  A new name is Admitted.
  Charge the township for Keeping.
  Never ask why they were Discharged.
  Calculate the burial Cost.
  Record the date they Died.

  Law saves the books where someone Died.
  It ignores the price of Rations.
  It mandates the sum of Cost.
  It cares not who was Admitted.
  Unless none were Discharged.
  The state pays for Keeping.

  Box four contains the Keeping.
  Line item: where a pauper Died.
  Box five lists the Discharged.
  No mention of the Rations.
  Just the year they were Admitted.
  And the final Cost.

  The evidence shows the Cost.
  The text defines the Keeping.
  The register marks Them Admitted.
  The margin marks Where They Died.
  The inventory counts Rations.
  The status reads Discharged.

  Her Rations note was Discharged.
  No voice Admitted to the Keeping.
  Where the volume Died there is no Cost.
