prompt: |-
  I work in a behavioral science department where the heuristics-and-biases people and the fast-and-frugal people share a hallway and have been having the same arguement since roughly the mid-90s. On paper it's settled. Everyone now concedes the Kahneman/Tversky line was too quick to label something a bias, everyone concedes the Gigerenzer line is right that context matters, so we all agree it depends on the environment and then go back to our own labs. In practice nothing has changed. Linda-type tasks still get published as evidence of a conjunction error, the natural-frequency reformulation still gets published as evidence there was never an error to begin with, and neither side cites the other. There's now a third group saying people are approximately sampling from a probabilistic model, which somehow makes both older camps angrier.

  My hypothesis, offered as a hypothesis: this isn't a disagreement about whether human judgment is rational, and it isn't even a disagreement about the normative notion of rationality at work (coherence vs. correspondence). It's a disagreement about what counts as *the environment* — a hidden reference-class problem. To say that take-the-best or the recognition heuristic is ecologically rational you have to fix an ecology, but the ecology can be carved as finely or as coarsely as you like, and for pretty much any heuristic you can find a redescription of the environment that licenses it. If that's right, no single experiment can falsify the ecological claim, and the truce isn't a resolution, it's a mutual agreement to stop asking.

  Is my hypothesis right? Diagnose the actual structure of the stall from what each side does when it runs an experiment — what counts as data, what the comparison is, whether they care about process (which cues the person looked at) or only accuracy against a benchmark, and how they treat the objection that the interesting question is *who* fails, since failure tracks cognitive ability. Sort out how much is verbal, how much is a real methodological split about representative versus adversarially-chosen task design, and how much is bedrock neither side can argue for. Then tell me what would count as progress: some distinction, a formal result, or a type of experiment that actually pins down the environment parameter — or should I accept that the truce is permanent and stop trying to get my two postdocs in the same room?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works in a behavioral science department. There's a long-standing feud between the "Heuristics-and-Biases" (H&B, Kahneman/Tversky) camp and the "Fast-and-Frugal" (F&F, Gigerenzer) camp.
      *   **Observation:** On paper, there's a truce (context matters, biases aren't universal). In practice, nothing has changed (same tasks, same conclusions, no cross-citation). A third camp (probabilistic sampling) annoys both.
      *   **User's Hypothesis:** The core disagreement isn't about rationality (coherence vs. correspondence) but about *what counts as the environment* (a hidden reference-class problem). Any heuristic can be licensed by redescribing the environment. Therefore, ecological rationality claims are unfalsifiable. The truce is a mutual agreement to stop asking.
      *   **Task:**
          1.  Diagnose the actual structure of the stall (what counts as data, comparison, process vs. accuracy, individual differences).
          2.  Sort out the nature of the split (verbal, methodological, or bedrock).
          3.  Define what would count as progress (distinction, formal result, experiment) or advise accepting the permanent truce.

  2.  **Analyze the User's Hypothesis:**

      *   *Is it right?* It's insightful and captures a major source of friction, but it might be slightly too cynical or reductive. It identifies the "reference class problem" in ecological rationality, which is a known critique. However, the split is also deeply methodological and philosophical regarding the *goal* of the research (normative critique vs. descriptive/adaptive modeling).
      *   *Nuance:* The H&B side cares about *internal coherence* violations (logic/probability laws) regardless of environment. The F&F side cares about *external correspondence* (accuracy in specific environments). The "environment" argument is the battleground, but the war is about the *purpose* of cognitive psychology.

  3.  **Diagnose the Structure of the Stall:**

      *   **What counts as data?**
          *   H&B: Choice proportions, deviation from normative axioms (e.g., $P(A \& B) > P(A)$).
          *   F&F: Performance accuracy in real-world simulations, speed, information search costs.
          *   Sampling/Process models: Reaction times, eye-tracking, trial-by-trial variability.
      *   **Comparison:**
          *   H&B: Against logic/probability theory (The "Ideal Observer" in a vacuum).
          *   F&F: Against optimal statistical models *in that specific environment* (The "Ideal Observer" in the wild).
          *   Sampling: Against the output of a computational process model.
      *   **Process vs. Accuracy:**
          *   H&B: Traditionally outcome-focused (the error is the data), though process tracing exists now.
          *   F&F: Heavily process-focused (which cue did you check first?).
          *   Sampling: Process *is* the model.
      *   **Individual Differences ("Who fails"):**
          *   H&B: Increasingly interested (Cognitive Reflection Test, numeracy). High ability = less bias.
          *   F&F: Less interested in "ability," more in "adaptive toolbox." A smart person uses the right tool for the environment.
          *   Sampling: Variability is noise or feature of the sampler.

  4.  **Sort Out the Split (Verbal vs. Methodological vs. Bedrock):**

      *   *Verbal:* Yes, "rationality" is defined differently.
      *   *Methodological:* Huge split. H&B uses stylized, adversarial tasks to break the system. F&F uses representative design (Brunswik) to test the system in its natural habitat.
      *   *Bedrock:* The goal of the field. Is psychology about finding bugs (H&B) or understanding functions (F&F)? This is Kuhnian incommensurability.

  5.  **Address the "Environment Parameter" (The User's Core Insight):**

      *   The user is right that "environment" is the slippery variable. F&F can always say "You tested it in the wrong environment." H&B can always say "Logic holds in all environments."
      *   To pin this down, we need *independent measurement of the environment* not derived from the subject's performance.

  6.  **Define Progress:**

      *   What would break the deadlock?
      *   *Not* more Linda tasks.
      *   *Not* more simulations of Take-The-Best.
      *   *Yes:* Pre-registered competitive testing in *novel* environments.
      *   *Yes:* Measuring the environment independently (e.g., statistical structure of the world) before testing the agent.
      *   *Yes:* Integrating individual differences (adaptive intelligence).
      *   *Advice:* Don't try to merge them philosophically. Merge them methodologically.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, academic, empathetic to the frustration, rigorous.
      *   *Structure:*
          1.  Validate the hypothesis (it's strong, but incomplete).
          2.  Diagnostic breakdown (Data, Benchmark, Process, Individual Differences).
          3.  The Nature of the Split (Verbal, Methodological, Bedrock).
          4.  The "Environment" Problem (Reference class issue).
          5.  Path to Progress (Concrete suggestions).
          6.  Advice on the Postdocs.

      *   *Refining the "Environment" point:* The user calls it a "hidden reference-class problem." I should connect this to the *Reference Class Problem* in probability (Hájek) and Brunswik's *Representative Design*. The F&F defense is that H&B uses *systematic* design (biasing), while F&F claims *representative* design. The stalemate is that H&B says "We are testing competence, not performance," and F&F says "Competence is ecological."
      *   *Refining the "Third Camp":* The probabilistic sampling people (e.g., Tenenbaum, Griffiths, or maybe the "rational analysis" crowd like Anderson). They annoy H&B because they say biases are optimal sampling, and annoy F&F because they assume heavy computation (Bayesian) rather than frugal heuristics.
      *   *Advice:* The truce isn't permanent, but the philosophical reconciliation is dead. The way forward is *computational adjudication*.

