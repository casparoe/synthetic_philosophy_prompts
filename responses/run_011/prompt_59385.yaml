      *   *Does the language collapse the distinction?* Yes. To a reinsurer, if you can't price it, it's risk. Whether it's "true randomness" or "ignorance" doesn't change the capital charge.
      *   *Is this a blind spot?* It's a feature, not a bug. The job is solvency, not truth. But for the *philosophical* question of free will, it's a category error.
      *   *Pushback:* The user asked to translate "freedom." Actuarial language *cannot* translate "freedom" because freedom implies an agent outside the risk model. If the agent is inside the model, it's just another variable. If outside, it's exogenous shock.

