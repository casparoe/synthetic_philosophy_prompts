      *   **The Three Practices:**
          1.  Homology-based annotation transfer (assigning function based on sequence similarity to characterized genes in other organisms).
          2.  Pseudogene labeling (labeling DNA as functionless despite transcription/protein binding, based on relaxed selection).
          3.  ENCODE's "80% functional" claim (biochemical activity = function, contested by evolutionary biologists).
      *   **Theoretical Framework:** Sort these into "Selected-Effects/Etiological" (SE) vs. "Causal-Role/Dispositional" (CR) vs. "Other."
      *   **Specific Questions to Answer:**
          *   Can one database coherently house both SE and CR functions?
          *   Does annotating a pseudogene's transcript as functional contradict the pseudogene label?
          *   What must be true about function for homology transfer to be legitimate (not just fiction)?
          *   What practice would change if we switched uniformly to Causal-Role?
          *   **Self-Correction/Reflexivity:** Flag where my reconstruction is most likely wrong (which practice would push back, and why).

  2.  **Analyze the Three Practices through the Lens of Function Theories:**

      *   **Practice 1: Homology Transfer (Sequence Similarity).**
          *   *Observation:* Gene X in Mouse has Function F. Gene Y in Human is similar. Gene Y is annotated with Function F.
          *   *Underlying Logic:* Evolution conserves function. If the sequence is conserved, the *selected effect* is likely conserved.
          *   *Theory:* This is deeply **Selected-Effects (SE)**. It assumes the reason the gene exists *now* is because of what it did *then* (in the ancestor). It's an inference about evolutionary history and maintenance.
          *   *Nuance:* The prompt notes the annotator has no evidence about what the molecule *does* in the new organism, only about ancestors. For this to be legitimate, function must be a stable property inherited through lineage, not just a context-dependent activity.

      *   **Practice 2: Pseudogene Labeling.**
          *   *Observation:* DNA is transcribed/bound (activity exists), but labeled "pseudogene" (functionless) because of relaxed selection (mutations accumulate without penalty).
          *   *Underlying Logic:* Activity $\neq$ Function. Function requires evolutionary maintenance (selection). If selection is relaxed, the activity is noise or spandrel, not "function."
          *   *Theory:* This is classic **Selected-Effects (SE)**. It explicitly rejects Causal-Role (activity) as sufficient for "function" in the biological sense.
          *   *Conflict:* The prompt notes they are "demonstrably transcribed and bound." Under CR, they *have* a function (e.g., producing RNA, binding protein). Under SE, they lack a function (no contribution to fitness maintained by selection).

      *   **Practice 3: ENCODE's 80% Claim.**
          *   *Observation:* Biochemical activity (transcription, binding, chromatin structure) = Function.
          *   *Underlying Logic:* If it does something biochemical, it has a function.
          *   *Theory:* This is pure **Causal-Role (CR)**.
          *   *Conflict:* Evolutionary biologists shouted at them. Why? Because evo-bio usually operates on SE. Junk DNA can have biochemical activity without being selected for.

  3.  **Address the Specific Questions:**

      *   **Sorting:**
          *   Homology Transfer: SE (mostly), relies on conservation of selected effect.
          *   Pseudogene Labeling: SE (explicitly prioritizes selection over activity).
          *   ENCODE: CR (prioritizes activity over selection).
      *   **Coherent Database:** Can one house both? Yes, *if* the fields are distinct (e.g., "Molecular Activity" vs. "Evolutionary Function"). Conflict arises if they claim the same column means the same thing.
      *   **Pseudogene Contradiction:** Do they contradict? No, they answer different questions. "Pseudogene" = No SE function (not maintained by selection). "Transcript" = CR function (has biochemical capacity). The contradiction is linguistic/pragmatic, not logical, provided definitions are clear.
      *   **Homology Transfer Legitimacy:** For this to be legitimate, function must be **conserved**. The SE of the ancestor must map to the SE of the descendant. It assumes the "reason for being" is stable across speciation. If function were purely CR (context-dependent), homology transfer would be risky because the cellular context might differ.
      *   **Uniform Causal-Role Shift:** If we went all CR:
          *   Pseudogenes would often be reclassified as functional (if transcribed).
          *   Homology transfer would become riskier/less meaningful (knowing what Mouse Gene does doesn't tell you what Human Gene *can* do in the human context without empirical testing).
          *   ENCODE would be vindicated.
          *   *Practice Change:* We would stop using "relaxed selection" as the primary criterion for "non-functional." We would catalog activities, not evolutionary reasons.

