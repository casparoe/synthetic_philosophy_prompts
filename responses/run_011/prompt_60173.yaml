      *   *Pushback:* A bioinformatician might say, "We aren't making evolutionary claims; we're making structural predictions." If structure determines function (CR), and structure is conserved, then function (CR) is conserved. So Homology Transfer might actually be a bridge: using SE logic (conservation) to predict CR outcomes (activity).
      *   *Pseudogenes:* Some pseudogenes *are* selected (e.g., regulatory RNAs derived from pseudogenes). The definition is shifting.
      *   *ENCODE:* The 80% figure was criticized not just on SE grounds, but on the definition of "biochemical function" (noise vs. signal).
      *   *Biggest Risk:* The Homology Transfer classification. It looks SE, but it's used to populate CR fields. I need to acknowledge this duality.

