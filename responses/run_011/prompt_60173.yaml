answer: |-
  Here is an analysis of the three practices through the lens of the philosophy of biology, specifically the debate between **Selected-Effects (SE)** and **Causal-Role (CR)** accounts of function.

  ### 1. Sorting the Practices

  To sort these, we must distinguish the two dominant notions of function:
  *   **Selected-Effects (SE) / Etiological:** A trait has a function if it was naturally selected for that specific effect. Function is historical and explanatory (it explains *why* the trait is there).
  *   **Causal-Role (CR) / Dispositional:** A trait has a function if it contributes a specific capacity to the containing system. Function is ahistorical and descriptive (it describes *what* the trait does).

  **The Sort:**

  1.  **Pseudogene Labeling:** **Pure Selected-Effects.**
      The practice explicitly decouples activity from function. By defining a pseudogene as a locus under "relaxed selection" despite biochemical activity (transcription/binding), the annotator is asserting that without evolutionary maintenance, there is no function. Activity is noise; selection is signal.

  2.  **ENCODE's 80% Claim:** **Pure Causal-Role.**
      ENCODE defined function as "biochemical activity." If a stretch of DNA is transcribed or bound by a protein, it is doing *something* to the system. This ignores whether that activity was selected for or whether it benefits the organism. It is a inventory of capacities, not evolutionary reasons.

  3.  **Homology Transfer:** **Selected-Effects Justification for Causal-Role Prediction.**
      This is the hybrid case. The *annotation* being transferred is usually a Causal-Role description (e.g., "ATP binding," "kinase activity"). However, the *warrant* for the transfer is Selected-Effects logic. The annotator assumes that because the sequence was conserved across speciation, the *selected effect* was conserved, and therefore the *causal role* remains the same. It relies on the SE theory to validate a CR claim.

  ### 2. Database Coherence and the Pseudogene Contradiction

  **Can one database house both?**
  Yes, but only if the schema distinguishes between *Evidence* and *Claim*.
  Databases like the Gene Ontology (GO) already attempt this. They allow annotations of "Molecular Function" (CR) but attach "Evidence Codes" (e.g., IEA for Inferred from Electronic Annotation, or TAS for Traceable Author Statement). Coherence breaks down only if the database treats an SE-based inference as empirically equivalent to a CR-based measurement. If the database column is "Verified Activity," SE inclusions are contaminants. If the column is "Probable Role," they are acceptable.

  **Does annotating a pseudogene's transcript as functional contradict the pseudogene label?**
  No, they are answering different questions, but the terminology creates a pragmatic collision.
  *   **The Pseudogene Label (SE):** Answers "Is this locus maintained by natural selection?" (Answer: No).
  *   **The Transcript Annotation (CR):** Answers "Does this molecule have a biochemical capacity?" (Answer: Yes).

  The contradiction is linguistic, not logical. It arises because biologists use the word "function" to mean both "selected purpose" and "biochemical activity" interchangeably. If the database used distinct headers—e.g., "Evolutionary Status" (Pseudogene) vs. "Biochemical Activity" (Transcribed)—the contradiction vanishes. The conflict exists because "Pseudogene" carries the implicature of "Junk," while "Transcribed" carries the implicature of "Functional," and the community refuses to agree on which implicature wins.

  ### 3. The Homology Transfer Warrant

  You asked what has to be true about function for homology transfer to be legitimate rather than fiction.

  For homology transfer to be valid, **function must be an intrinsic, conserved property of the sequence structure, rather than a relational property of the organismal context.**

  If function were purely Causal-Role (context-dependent), homology transfer would be illegitimate. A kinase in yeast might interact with Substrate A, while its homolog in humans, due to different cellular networking, interacts with Substrate B. They have the same structure (capacity) but different systemic roles.
  For the transfer to hold, we must assume that the **Selected Effect is stable across deep time.** We are betting that the reason the sequence survived the speciation event was that it continued to perform the *same* causal role that contributed to fitness in the ancestor.

  Therefore, the legitimacy of homology transfer rests on the **Conservation of Function Hypothesis:** Evolution conserves sequences *because* it conserves their specific contributions to fitness. If function were volatile or if neutral drift accounted for most sequence conservation, homology transfer would indeed be "convenient fiction."

  ### 4. The Uniform Causal-Role Shift

  If we mandated that all genome annotation adhere strictly to a **Causal-Role** definition of function:

  1.  **Pseudogenes would largely cease to exist as a category.** If a locus is transcribed and bound, it has a causal role (e.g., "produces RNA," "binds Protein X"). It might be a *deleterious* role, or a *neutral* role, but it would not be "functionless." The term "pseudogene" would be replaced by "non-selected transcribed element."
  2.  **Homology Transfer would lose its evidentiary weight.** Knowing what a mouse gene does tells you what a human gene *might* do structurally, but it tells you nothing about its actual role in the human system without empirical verification. Annotations would require organism-specific biochemical evidence. Confidence codes based on phylogeny would be invalid.
  3.  **ENCODE would be vindicated, but the data would become less biologically actionable.** We would have a massive map of everything that happens, but no filter for what matters to the organism's survival. Distinguishing "signal" from "noise" would require a separate, non-functional metric (like selection pressure).

  ### 5. Reflexivity: Where This Reconstruction is Likely Wrong

  My sorting of **Homology Transfer** is the most vulnerable to pushback.

  **The Pushback:**
  A practicing bioinformatician would argue that homology transfer is **not** relying on Selected-Effects theory at all. They would argue it relies on **Structural Conservation**.
  *   *Argument:* "I don't care about selection. I know that protein folding is determined by sequence. If the sequence is 90% identical, the fold is identical. If the fold is identical, the active site is identical. Therefore, the *chemical capacity* (CR) is identical. I am inferring CR from Structure, not SE from History."

  **Why this makes me wrong:**
  If this is true, then homology transfer is actually a **Causal-Role** practice disguised in evolutionary clothing. It assumes that biochemical capacity is determined by physical structure, which is determined by sequence. The evolutionary history is just the explanation for *why* the sequence is similar, not the justification for the *function*.

  **The Consideration for Re-sorting:**
  If we discovered that **convergent evolution** was the primary driver of functional similarity (i.e., different sequences evolving to do the same job), homology transfer would fail. But if we discovered that **neutral drift** preserves sequence without preserving function (e.g., the sequence is conserved for structural reasons unrelated to the annotated activity), then my SE classification holds.

  However, the strongest challenge is the rise of **moonlighting proteins** (one protein, multiple unrelated functions). If a gene is conserved for Function A, but in the new organism it is primarily used for Function B, homology transfer annotates A (based on ancestry/SE) while the reality is B (current context/CR). If databases began prioritizing organism-specific context over ancestral annotation, homology transfer would shift from an SE-justified inference to a low-confidence structural prediction, collapsing my distinction between Practice 1 and Practice 3.
