answer: |-
  # Q&A PREP SHEET: Visitor Obligations & Local Conventions

  **Status:** Work-in-Progress
  **Audience:** 12 Colleagues (Mixed fields, no convention specialists)
  **Goal:** Damage control and clarity, not victory.

  ---

  ### 1. The Anthropologist (Empirical Foundation)
  **The Objection:** "You're treating 'the locals' as a monolith with a single voice. In my fieldwork, 'conventions' are often sites of internal contestation—subcultures, class divides, generational splits. If the locals disagree on the rule, who is the visitor free-riding on, and whose contempt are they risking?"
  **Damage Level:** **Critical.** If the object of the obligation (the convention) doesn't exist as a stable entity, the obligation dissolves.
  **Concession:** You are right that conventions are rarely as uniform as philosophers prefer them to be.
  **2-Minute Reply:** I am not claiming the convention must be unanimous, only *salient*. The obligation attaches to the *focal point* that coordinates behavior, even if a minority dissent. If the queue is the focal point, joining it respects the coordination effort of the majority who sustain it. The expressive harm is avoided by aligning with the dominant coordinating signal, not by satisfying every sub-group.
  **Honest Weakness:** This relies on a "salience" threshold I haven't defined. If the room is split 50/50 on a norm, my account creates a contradiction (obligation to follow both?), and I don't have a clean tie-breaker other than "don't make a scene."
  **Pre-emptive Plant:** *"When I say 'local convention,' I mean a salient focal point that successfully coordinates behavior, not a unanimous cultural consensus."*

  ### 2. The Scanlonian Contractualist (Normative Foundation)
  **The Objection:** "What is the principle here that nobody could reasonably reject? Is it 'Visitors must do as locals do'? That seems to smuggle in a practice-relative version of contractualism where the 'practice' does all the work and the 'contract' is just a label."
  **Damage Level:** **Critical.** Challenges the moral machinery. If this isn't contractualist, what is it?
  **Concession:** I am not offering a free-standing principle of universal scope.
  **2-Minute Reply:** The principle is: *One must not free-ride on cooperative schemes one benefits from, nor express disregard for one's cooperators.* The "local" element enters as a parameter of the scheme, not the source of the norm. Nobody could reasonably reject a principle requiring coordination and non-free-riding in temporary contexts, provided the scheme itself is just (hence the defeater).
  **Honest Weakness:** I am leaning heavily on the "free-riding" prong here. If the Scanlonian presses that "predictability" isn't a *good* worth moralizing (see Rawlsian objection below), the contractualist justification loses its grip.
  **Pre-emptive Plant:** *"The obligation stems from a general duty against free-riding and expressive disrespect, applied to the specific context of temporary visitation."*

  ### 3. The Defeater Clause (Epistemic Burden)
  **The Objection:** "Your defeater clause requires the visitor to judge whether a norm is an 'instrument of domination.' You're asking a tourist to be a sociologist. If they get it wrong, are they morally culpable for complying with oppression?"
  **Damage Level:** **High.** Makes the theory impractical and potentially dangerous.
  **Concession:** The epistemic burden on the visitor is a genuine difficulty I need to address.
  **2-Minute Reply:** The standard is not expert sociological knowledge, but *reasonable visibility*. If the domination is structural but hidden (e.g., wage structures behind tipping), the visitor is not culpable for complying. If it is overt (e.g., segregated queues), the duty lapses. The obligation is to be attentive, not omniscient.
  **Honest Weakness:** "Reasonable visibility" is doing a lot of heavy lifting. In many cases (like the tipping example I use), the exploitation is structural and invisible to a short-term visitor, which means my theory might inadvertently validate compliance with exploitative norms too often.
  **Pre-emptive Plant:** *"The defeater applies when the oppressive nature of the convention is reasonably visible to a careful observer, not when it requires structural analysis."*

  ### 4. The Rawlsian (Public Good Status)
  **The Objection:** "Is queueing or jaywalking really a 'scheme of cooperation' producing a public good? It sounds more like a series of individual habits. If there's no joint intention, there's no free-riding."
  **Damage Level:** **Medium-High.** Attacks Justification 1.
  **Concession:** These are thin schemes of cooperation compared to a legal system or a union.
  **2-Minute Reply:** They are *thin*, but they produce the public good of predictability. Locals incur a cost (time, inconvenience) to maintain the pattern. When a visitor steps out of line without cause, they reap the benefit of the others' restraint (the clear path, the orderly bus stop) without paying the cost. That fits the structural definition of free-riding, even if the stakes are low.
  **Honest Weakness:** If they press that "predictability" is a *byproduct* and not an *intended good*, the free-riding argument weakens. I might have to pivot entirely to the Expressive argument here.
  **Pre-emptive Plant:** *"Predictability is a public good maintained by mutual restraint, even in low-stakes contexts."*

  ### 5. The Error Theorist (Categorization) **[MISREAD OBJECTION]**
  **The Objection:** "Why is this a *moral* obligation? It sounds like prudence (don't get yelled at) or etiquette (don't be rude). Where is the categorical normativity?"
  **Damage Level:** **Medium.** Challenges the category, but often a semantic block.
  **Concession:** The stakes are lower than paradigmatic moral duties like non-maleficence.
  **2-Minute Reply:** It is moral because it concerns how we treat others (respect/contempt) and how we relate to cooperative structures (fairness). Prudence is about *my* outcome; this obligation is about *our* interaction. Even if the harm is small, the *kind* of reason is moral.
  **Honest Weakness:** I am relying on a "wide" view of morality. If they hold a "narrow" view (only serious harms count), we talk past each other. I can't prove them wrong, only show my usage is consistent.
  **Pre-emptive Plant:** *"I am treating this as a moral obligation because it concerns fairness and respect, distinct from mere prudence or etiquette."*

  ### 6. The Law Professor (Bindingness Threshold)
  **The Objection:** "In customary international law, you need state practice plus *opinio juris* (belief that it's law). Here you have practice, but do the locals believe it's *binding*? Or do they just do it because it's habit?"
  **Damage Level:** **Medium.** Analogical challenge.
  **Concession:** I am not claiming these norms are legal, only morally binding.
  **2-Minute Reply:** The *opinio juris* equivalent here is the reactive attitude. When someone breaks the queue, locals don't just notice; they feel entitled to complain. That normative expectation signals the binding nature of the convention without requiring a legal belief.
  **Honest Weakness:** This conflates "social pressure" with "moral obligation." Just because people *feel* entitled to complain doesn't mean they *are* morally entitled to. I'm inferring morality from sociology.
  **Pre-emptive Plant:** *"The binding nature is signaled by the normative expectation of compliance, not just the regularity of behavior."*

  ### 7. The Expressive Argument (Semantics) **[MISREAD OBJECTION]**
  **The Objection:** "What if I don't *mean* contempt? If I jaywalk on an empty street, I'm just saving time. Why does your interpretation of my action override my intent?"
  **Damage Level:** **Low-Medium.** Standard intent vs. impact dispute.
  **Concession:** Your personal intent matters, but it doesn't control the social meaning.
  **2-Minute Reply:** Actions have conventional meanings independent of private intent. Smoking a cigarette in a non-smoking section expresses disregard for the rule even if you "didn't mean anything by it." The obligation is to manage the expression your action sends, not just the thought in your head.
  **Honest Weakness:** This risks making the obligation too demanding (I must police all possible interpretations of my acts). I need to limit this to *conventional* signals, not open-ended ones.
  **Pre-emptive Plant:** *"The expressive content is determined by the local convention, not the visitor's private intent."*

  ### 8. The Scope Question (Boundaries) **[MISREAD OBJECTION]**
  **The Objection:** "How temporary is 'temporary'? If I stay for six months, am I still a visitor? If I move next door, does the obligation vanish?"
  **Damage Level:** **Low.** Boundary problem, doesn't break the core.
  **Concession:** There is a gray zone between visitor and resident.
  **2-Minute Reply:** The obligation tracks *integration*. As you gain the capacity to influence the norm and participate in its maintenance, the duty shifts from "compliance" to "stewardship." The visitor duty lapses when you become a stakeholder in the convention itself.
  **Honest Weakness:** "Stakeholder" is vague. I don't have a bright line, and this question exposes that the "visitor" category is a spectrum, not a binary.
  **Pre-emptive Plant:** *"The obligation tracks the degree of integration; as you become a stakeholder, the duty shifts from compliance to stewardship."*

  ---

  ### THE ONE QUESTION I'M HOPING NOBODY ASKS

  **The Question:** **"If the obligation is generated by the local fact, does that mean morality is locally valid? Are you a relativist?"**

  **My Guess at Why:**
  This is the "silent killer" because it threatens to categorize your entire project as a version of metaethical relativism, which two Rawlsians and a Scanlonian will find deeply suspect. If the *source* of the obligation is "what they do here," it looks like the *force* of the obligation is also limited to "here."

  **Why it's dangerous:**
  If you say "Yes," you lose the universalists in the room. If you say "No," you have to explain how a locally-generated fact creates a universally-binding moral duty without contradiction. You haven't explicitly bridged the gap between *local convention* (contingent) and *moral obligation* (necessary/universal) in a way that satisfies non-relativists.

  **Preparation:**
  Be ready to distinguish between the *source* of the specification (the local convention) and the *source* of the normativity (the universal duty not to free-ride/express contempt). The local fact triggers the universal duty; it does not create the duty ex nihilo.
