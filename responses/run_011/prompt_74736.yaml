  Just spent about four hours going round the houses with Naomi about qualia and I'm too wired to sleep, so I want a second opinion — specifically, I want you to predict what she'd say about a case I put to her and she stonewalled.

  Background: Naomi thinks qualia are an incoherent posit. Fully paid-up quining-qualia type, the coffee taster stuff, the inverted spectrum, all of it. Her verdicts on the cases we went through, as best I can reconstruct them. The taster who says his usual blend tastes different to him now but who still tells it from every other blend exactly as before and drinks it the same way: his judgement changed, not his taste. The taster who swears it tastes the same as ever but can no longer pick it out from a cheaper one he used to spot instantly: a real loss, but a loss of an ability, not of a taste. A man born with an inverted spectrum who has learned all the colour words and passes every test you can devise: coherent, harmless, completely idle, nothing anyone could mean by it. A woman whose emotional response to a piece of music has flipped entirely, used to weep and now is bored, while her discrimination and her account of how it sounds stay put: something real changed there, and its the change worth caring about. A neuron-by-neuron silicon replacement where the subject reports at the end that everything seems the same: no fact of the matter, the case is rigged, "seems" has been cut loose from every use it ever had.

  Here's the one she clammed up on. A tea blender — call her Ruth — goes on a medication for a year. Over that year she passes every discrimination test she passed before, same thresholds, blind, repeated; she reports that nothing has changed, and she isn't a confabulator, she's the sort who'd notice and say; her liking is the same, her skin conductance is the same, her face is the same; you cannot describe to her in advance any situation in which she'd now behave differently than she would have a year ago. But we've imaged her, and her responses to the same infusion are measurably different now, and last month someone gave her a task nobody had thought to give her before: build, out of a new set of components, a blend that tastes the way a certain blend used to taste. She reliably builds a different blend from the one she built on that same instruction a year ago, and afterwards says without hesitation that the new one is the match. Did her tastes change? And if so when — when her brain changed, or last month, or is that the wrong shape of question altogether?

  Three readings of what she's doing, and I genuinely can't tell between them. One: she's a functionalist, and the taste just is the profile of discriminative and affective dispositions, with reports counted as judgements rather than as tasting. Two: she's a pluralist, and "what it's like" is a job description rather than a property, so every question has to arrive with the job attached or it's empty. Three: she's a real quiner, and there's never a fact of the matter about the phenomenal, so her "something real changed" remark about the music was just loose talk about functions. All three seem to fit everything above, which is what's maddening.

  So: which of them is she, what does each predict she'll say about Ruth, and what's your best guess at her actual answer, with the reasons for preferring it? Then tell me whether there's a fourth rule that fits her verdicts just as well that I've missed entirely, and what further case I should have put to her that would have separated the readings cleanly.

  Please write it as continuous prose, like an email — no headings, no bullet points, no bold, no tables. I've been staring at formatted text all day and I can't take any more of it.
