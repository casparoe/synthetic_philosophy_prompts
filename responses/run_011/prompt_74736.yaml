answer: |-
  I know exactly that feeling, the kind of mental static that happens when you have pushed a concept until it dissolves and then tried to push it some more. It is late, you are tired, and Naomi has effectively walked you into a Dennettian funhouse where the mirrors are made of language. You want to know where she stands on Ruth, and you want to know which of the three labels sticks to her, but before I get to the prediction I should tell you that your third reading is almost certainly wrong based on the evidence you provided. If she were a hard quiner who believes there is never a fact of the matter about the phenomenal, she would not have told you that something real changed in the music case. She would have called that a change in disposition or attitude and denied the reality of the emotional flip just as she denied the reality of the taste flip in the first coffee case. The fact that she granted reality to the music shift suggests she is not an eliminativist about internal states per se, but only about intrinsic, ineffable qualia. She is a realist about functional and affective roles, which makes her a functionalist, but the stonewalling on Ruth suggests she is a sophisticated one who knows where the bodies are buried.

  If she were purely the first reading, a strict functionalist who equates taste with the profile of discriminative and affective dispositions, she would have a clear answer for Ruth. She would say that yes, the taste changed, and it changed when the brain changed, because the disposition to construct a specific blend is part of the functional profile of tasting. The fact that Ruth reports no change is just another behavior to be weighed against the blending behavior, and since the blending behavior diverged from the baseline, the functional state has shifted. She would likely say Ruth is wrong about her own taste because the third-person data reveals a functional drift that the first-person report is lagging behind. This fits the coffee taster cases where she privileged the ability over the report, but it risks contradicting her hesitation here. If she were the second reading, the pluralist who sees what it is like as a job description, she would refuse to answer the question as phrased. She would say that asking if the taste changed is like asking if the bank changed without specifying if you mean the river bank or the financial institution. She would tell you that discrimination taste stayed the same, affective taste stayed the same, but constructive taste changed, and that there is no master taste that encompasses all three. This fits the stonewalling perfectly because it dissolves the binary choice. If she were the third reading, the hard quiner, she would say there is no fact of the matter and that your question presupposes a ghost in the machine, but as I said, this clashes with her verdict on the music.

  My best guess is that she is the second reading, the pluralist, but motivated by the first reading's insights. She clammed up on Ruth because the case is designed to force a divergence between the subject's authority and the functional data in a domain where we usually expect them to align. In the coffee cases, the divergence was clear: either the judgement changed or the ability changed. In the music case, the affect changed. In Ruth, everything stays the same except a specific constructive output that nobody thought to test until later. This makes it hard to say when the change happened. If she says it happened when the brain changed, she validates the neural data over the subject's life experience. If she says it happened last month, she validates the task over the history. If she says the question is wrong, she protects the subject but risks sounding evasive. I think she will ultimately say that the question is the wrong shape, echoing her verdict on the inverted spectrum. She will likely argue that taste is not a single state that can change or stay the same, but a cluster of competencies. Since most competencies stayed stable and only one obscure one shifted, there is no single moment of change. She will probably say that nothing important changed until the new task was introduced, because until then the difference made no difference to anyone, including Ruth. This aligns with her view on the inverted spectrum being idle.

  There is however a fourth rule that fits her verdicts just as well as the pluralist reading, and it might be the actual engine driving her intuitions. I would call it the rule of pragmatic significance. On this view, a change is real only if it alters the subject's practical engagement with the world in a way that matters for prediction or interaction. The inverted spectrum is idle because it changes nothing practical. The music response is real because it changes weeping to boredom, which matters. The coffee ability loss is real because it affects picking out blends. The silicon replacement is indeterminate because the subject reports the same and functions the same. On this rule, Ruth is a borderline case. The blend change is a practical difference, but it was latent for a year. She might say the change existed potentially but became actual only when the task arose. This fits her verdicts because it explains why she cares about the music affect but not the inverted spectrum, and why she is hesitant on Ruth where the practical impact was dormant.

  To separate the pluralist reading from the pragmatic significance reading, you need a case where the job description is clear but the practical impact is negligible. You should put to her a case where Ruth's discrimination threshold shifts by a measurable fraction that never affects her blending, buying, or drinking, and she never notices. The functionalist would say the taste changed because the disposition changed. The pluralist would say it depends on which job you ask about, but if the job is discrimination, it changed. The pragmatic significancer would say nothing real changed because it made no difference to anyone's life. If Naomi says that such a micro-shift is real, she is a functionalist. If she says it is idle, she is a pragmatist. If she says the question depends on whether you are hiring her for threshold testing or blending, she is a pluralist. I suspect she will call it idle, which would confirm that her quining of qualia is driven by a desire to clear out differences that make no difference, rather than a strict functionalist ontology. Go get some sleep, because chasing these distinctions without rest is the best way to start seeing inverted spectra yourself.
