answer: |-
  **MEMORANDUM**

  **TO:** Methods Committee
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on Reference Case Scoring Rule (Rule A vs. Rule B)
  **DATE:** October 26, 2023

  **Purpose**

  This memo recommends the adoption of **Rule A** (weighted sum of expected utilities) for the new reference case. While Rule B offers a compelling intuitive appeal regarding catastrophic risk, Rule A provides the stability, transparency, and theoretical consistency required for a national funding agency. Below I clarify the technical disagreements among us, define the ethical trade-off at stake, and outline the political risk of this recommendation.

  **Assessment of Committee Views**

  We have three interpretations of the theoretical landscape. None are entirely correct, but one is closest to the truth.

  1.  **The Econ View (Harsanyi's Theorem makes Rule B inadmissible):** This is too dogmatic. Harsanyi's Aggregation Theorem proves that social welfare must be a weighted sum of individual *expected* utilities *only if* we accept specific axioms, most notably the "Ex Ante Pareto" principle (if every individual prefers Lottery X to Lottery Y, society must too). Rule B violates this principle. That does not make Rule B "inadmissible"; it makes it incompatible with that specific axiom. We are entitled to reject the axiom if we have ethical reasons to do so.
  2.  **The "Disguise" View (Rule B is just Rule A with different weights):** This is mathematically incorrect. In Rule A, the weight assigned to an individual is fixed up front (e.g., based on baseline health). In Rule B, the weight depends on the specific outcome realized (e.g., where you land in the distribution *in that scenario*). Rule B is state-dependent; Rule A is not. They will produce different rankings, as the pilot proved.
  3.  **The Skeptic View (Theorem is question-begging; interpersonal comparison is impossible):** This member is right that the theorem assumes what it proves regarding unanimity. However, they are wrong that Rule A uniquely requires interpersonal comparison. Both rules require us to compare wellbeing across people. Rule A needs it to apply baseline weights; Rule B needs it to rank people within an outcome. We cannot avoid this difficulty by switching rules.

  **The Core Conflict: Ex Ante vs. Ex Post**

  The disagreement is not about math; it is about whether we value fairness of *opportunities* or fairness of *outcomes*.

  *   **Rule A (Ex Ante):** We evaluate the proposal based on the chances it gives people before the uncertainty resolves. If two people have the same expected health gain, they contribute equally to the score, regardless of whether one is guaranteed a moderate gain and the other faces a 1% chance of a miracle cure. This respects individual sovereignty over risk.
  *   **Rule B (Ex Post):** We evaluate the proposal based on the distribution of health in each possible world, then average those scores. This privileges the "rescue" scenario. In the pilot case, Rule B favored the screening program because in the unlikely state where the catastrophe occurs, the rescued few are at the very bottom of the distribution and receive massive weight. Rule A dilutes this weight by the low probability of that state occurring.

  **Our Agency's Stance**

  We should adopt the **Ex Ante perspective (Rule A)**.

  As a public payer, we budget and plan based on expectations, not realized states. Rule B introduces volatility into our decision-making that is difficult to justify to stakeholders. Under Rule B, a proposal's value changes depending on how we slice the "states of the world," creating ambiguity in the reference case. Rule A allows us to incorporate equity concerns explicitly through the fixed baseline weights (tilting toward the worse off initially) without conflating equity with risk attitudes.

  Regarding Harsanyi's assumption: Are we giving something up by dropping the Ex Ante Pareto principle? Yes. We lose the guarantee that if every single citizen prefers one proposal over another, our agency will agree. However, we are entitled to reject this assumption. In health policy, unanimous preference can sometimes drive inequitable outcomes (e.g., a majority preferring to ignore a small, severely ill minority). By choosing Rule A, we are not rejecting equity; we are choosing to measure equity based on *baseline status* rather than *outcome luck*.

  **The Strongest Case Against This Recommendation**

  If we adopt Rule A, we must be prepared to defend the following scenario to the Minister's Office:

  *We may reject a program that prevents a catastrophic, life-ruining event for a small group because the probability is low, even if the moral urgency of that rescue feels overwhelming, provided the expected health gain is lower than a competing program that offers modest benefits to many.*

  Rule A treats a 1% chance of saving a life as exactly 1% of a certainty. To the public, and potentially to a Minister facing a grieving family, this can look like cold calculus. Rule B captures the intuition that "saving a life when things go wrong" has a moral value disproportionate to its probability. By choosing Rule A, we are effectively saying that the *risk* of catastrophe is what matters for funding, not the *severity* of the catastrophe in isolation.

  The dissent should argue that this fails the "rescue principle." If our mandate includes prioritizing the severely ill, Rule B does this more robustly in the face of uncertainty. Rule A only prioritizes them if they are severely ill *on average* (baseline), not if they are about to become severely ill due to bad luck in a specific state.

  **Motion**

  I move that the committee adopt **Rule A** for the reference case, with the instruction that the fixed weights be calibrated to reflect baseline health severity, thereby capturing equity concerns within an Ex Ante framework.

  This approach ensures our rankings are stable, transparent, and defensible as a matter of public finance, even if it requires us to withstand pressure when low-probability catastrophic risks materialize.
