answer: |-
  **TO:** Board of Examiners, Department of Mathematics
  **FROM:** Chair, Undergraduate Assessment Appeals Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Appeal Case 23-MATH-04 (Undergraduate Analysis II)

  **Decision**

  The Panel has concluded its review of the appeal regarding the examination script for the third-year Analysis II module. We have **upheld the appeal in part**. The original mark of 40% is adjusted to 52%. This grade reflects a passing demonstration of technical competence and analytical depth, while recording that the specific learning outcome regarding the Classical Intermediate Value Theorem (IVT) was not satisfied. The examiner's original assessment correctly identified that the required theorem was not proved; however, the mark awarded failed to recognize the mathematical validity of the alternative derivation provided.

  **Mathematical Assessment**

  The core dispute concerns whether the student proved the theorem set. The examination question required a proof that a continuous function $f$ on $[a,b]$, with $f(a)<0$ and $f(b)>0$, possesses a point $c \in [a,b]$ such that $f(c)=0$. The student constructed a sequence of points $(x_n)$ such that $|f(x_n)| < 2^{-n}$. In classical analysis, the completeness of the reals ensures this sequence converges to a limit $c$, and continuity ensures $f(c)=0$. The student explicitly declined to infer the existence of this limit $c$ without additional hypotheses.

  Consequently, the student proved a strictly weaker theorem: the existence of an approximate root sequence, not an exact root. In the constructive framework she adopted, the statement "there exists a root" is not equivalent to "it is impossible that there is no root." Her reliance on the negative translation to claim consistency with the classical reading is misplaced in this context. The negative translation preserves provability of negative statements, but the IVT is an existential claim. Translating her proof classically recovers the classical IVT, but her script did not perform this translation; it asserted the constructive limitation as a final conclusion. Thus, she did not answer the question asked.

  Furthermore, her framework contains internal tensions. She operates primarily within a Bishop-style constructive setting (regular Cauchy sequences) but invokes Brouwer's Fan Theorem to derive uniform continuity. In standard constructive analysis, uniform continuity on a compact interval is typically derived from the definition of continuity and compactness without the Fan Theorem, which is an intuitionistic principle often rejected in Bishop's framework to maintain computational interpretability. Additionally, her bisection step relies on the "locatedness" of the range to compare the midpoint value against zero. For an arbitrary continuous function, locatedness is not guaranteed constructively without further assumptions. By importing the Fan Theorem while retaining Bishop-style sequence definitions, she utilized a hybrid system that complicates the examiner's ability to verify correctness against a single standard.

  **The Syllabus Contract**

  The module descriptor specifies "Real Analysis," which in this department and across the majority of the undergraduate sector presupposes classical logic, including the Law of Excluded Middle. The assessment regulations require candidates to demonstrate the learning outcomes of the module. The learning outcome here is the mastery of classical analysis techniques. Allowing a candidate to substitute the learning outcome with a different theorem from a different logical framework, without prior agreement, undermines the comparability of degrees. If every candidate could select their logical axioms, the examination would cease to measure mastery of the syllabus and would instead measure philosophical preference.

  **The Counter-Argument**

  The Panel acknowledges the strongest case for the appellant. Our regulations require candidates to demonstrate the theorem, but they do not explicitly legislate the metaphysics of the real number. By marking down the student for declining the Law of Excluded Middle, we effectively charge her with a philosophical error the paper never announced it was testing. If the syllabus relies on classical logic, that assumption should be explicit. To stop legislating metaphysics by silence, the department would need to revise module descriptors to state "Classical Logic" explicitly, rather than assuming it as background. The student's work was internally consistent and mathematically sophisticated; penalizing it heavily suggests that only one ontological view of the continuum is permissible in mathematics, which is pedagogically contentious. The original mark of 40% implied a lack of understanding, whereas the script demonstrated a understanding deeper than the syllabus required, albeit directed elsewhere.

  **Forward-Looking Rule on Frameworks**

  To prevent recurrence, the Panel establishes the following standard for framework-relative submissions:

  1.  **Declaration:** Candidates intending to work outside the classical framework (e.g., constructive, intuitionistic, or non-standard analysis) must declare this in writing to the module coordinator at least two weeks prior to the examination.
  2.  **Examiner Duty:** Upon declaration, the examiner must verify that the alternative framework allows for the derivation of equivalent learning outcomes. If the framework precludes the classical result (as constructive analysis does with the exact IVT), an alternative question of equivalent difficulty and scope must be provided.
  3.  **Admissibility:** Undeclared framework shifts will be treated as errors in the demonstration of the required learning outcome. The class of admissible frameworks is bounded by the module's learning outcomes; a framework that prevents the proof of a core theorem without additional hypotheses is inadmissible for that theorem.

  **Action Plan**

  1.  **Board of Examiners:** Ratify the adjusted mark of 52% at the meeting in three weeks.
  2.  **Teaching Committee:** Draft explicit "Classical Logic" statements for all Analysis module descriptors by the start of the next academic year.
  3.  **Assessment Office:** Update examination cover sheets to include a checkbox for "Non-Standard Logical Framework," requiring prior authorization.

  This decision balances the integrity of the syllabus with the recognition of mathematical rigour. We cannot accept answers that contradict the course's foundational assumptions, but we must not penalize sophistication as if it were ignorance.

  **Signed,**

  Chair, Undergraduate Assessment Appeals Panel
