answer: |-
  (a) Candidate rules fitting the precedents

  Four distinct rules emerge from the six precedents. None fits perfectly without strain, but one accounts for the nuance better than the others.

  **1. The Aggregation Rule (Sum or Average)**
  *Hypothesis:* The board sums the three scores and funds applications above a threshold.
  *Fit:* Case 3 (18 points, Funded) and Case 4 (19 points, Refused) are close, suggesting a threshold around 19. However, Case 2 (21 points, Refused) breaks this cleanly: it has the highest total score of the set but was refused "at any price". Case 5 (16 points, Funded) is lower than the refused Case 1 (19 points).
  *Verdict:* This rule fails. The board is not doing simple arithmetic on the header scores.

  **2. The Tractability Veto**
  *Hypothesis:* Any score of 3 or below on Tractability results in automatic refusal.
  *Fit:* This explains Case 2 (T=3, Refused) perfectly. It creates tension with Case 6 (T=4, Funded), suggesting a cliff-edge at 3.
  *Strain:* It cannot explain Case 5 (N=2, Funded) unless Neglectedness has no veto, which is plausible. However, it struggles with Case 7's specifics: if the veto applies to the *programme* score (3), Case 7 must be refused. If it applies to the *activity* score (measurement is straightforward), it might pass. The rule is too blunt to account for the "at any price" note in Case 2 versus the "ratio" note in Case 6.

  **3. The Budget-Capacity Rule**
  *Hypothesis:* No single grant may exceed a certain percentage of the annual budget (e.g., 10–20%), and the portfolio must be diversified.
  *Fit:* This explains Case 1 (50% budget, Refused) and Case 6 (5% budget, Funded). It aligns with the refusal of Case 2 if that request was also "large" (as stated).
  *Strain:* It does not explain Case 4 (modest top-up, Refused) or Case 5 (size unspecified, but likely modest given the nature of dataset creation). The note in Case 2 ("would not have funded... at any price") explicitly contradicts a purely budgetary constraint; if it were only size, a smaller version might have passed.

  **4. The Counterfactual Impact Rule**
  *Hypothesis:* The board funds grants where the money changes the outcome (high counterfactual value), regardless of the raw scores, provided the risk is proportional to the information gained.
  *Fit:* This explains the most complex cases.
  *   **Case 4:** Refused because the money would not change whether the work happened (effective Neglectedness = 2).
  *   **Case 5:** Funded despite low Neglectedness (2) because the *specific activity* (dataset) would not otherwise exist.
  *   **Case 6:** Funded despite low Tractability (4) because the cost was low relative to the value of the decision informed (information value).
  *   **Case 2:** Refused because the money could not make the unproven technical route tractable enough to justify the risk ("at any price").
  *   **Case 1:** Likely refused because, for an "established" intervention, other capital might have been available, or the concentration risk outweighed the counterfactual gain.
  *Verdict:* This is the strongest fit. It treats the scores as inputs to a model of *what happens if we pay*, rather than as attributes of the problem in isolation.

  (b) Prediction for the seventh case

  **Verdict:** Funded.
  **Confidence:** Moderate-High (approx. 75%).

  **Reasoning:**
  The tension lies between Case 2 (T=3, Refused) and Case 6 (T=4, Funded). Case 2 establishes that the board will not bet on an intractable programme. Case 6 establishes that the board *will* bet on a small amount of money to resolve uncertainty about a difficult problem.

  Case 7 is structurally identical to Case 6, not Case 2. In Case 2, the money was for the *programme* itself (the unproven technical route). In Case 7, the money is for the *measurement exercise* that settles the contest. The prompt states the measurement is "straightforward". Therefore, the effective Tractability of the *grant* is high, even if the Tractability of the *field* is low.

  Furthermore, the counterfactual leverage in Case 7 is exceptionally high: if the measurement succeeds, another donor funds the full programme; if it fails, the field closes. This mirrors the logic in Case 6 ("ratio between the amount at risk and the size of the decision"). The board rewards grants that purchase information to trigger larger downstream capital or prevent waste. Since the request size is the same as Case 6 (one-twentieth of the budget), the portfolio risk is identical to a precedent they accepted.

  The board will likely treat the Tractability score of 3 as applying to the *field*, but override it based on the *activity* Tractability, just as they overrode the Neglectedness score in Case 4 (from 6 down to 2) and Case 5 (funded despite N=2).

  (c) Where the archive's silence is doing the real work

  The critical silence concerns the **unit of analysis for the scores**.

  In Case 4, the file score for Neglectedness was 6, but the board note recalculated it as "effectively a two". In Case 5, the Neglectedness was 2 (crowded field), yet it was funded because the *specific output* was neglected. In Case 7, the Tractability is 3 (the programme), but the *specific activity* (measurement) is straightforward.

  The archive does not record whether the staff are instructed to score the **Problem** (e.g., "How tractable is this global risk?") or the **Project** (e.g., "How tractable is this specific grant's work plan?").
  *   If they score the **Problem**, the Board must mentally adjust the score to assess the Grant (as they did with N in Case 4).
  *   If they score the **Project**, the T=3 in Case 7 is a contradiction, as the measurement exercise is not intractable.

  This silence matters because if the Board assumes the header scores reflect the *Project*, Case 7 looks like Case 2 (a T=3 refusal). If they assume the scores reflect the *Problem*, Case 7 looks like Case 6 (a small bet to solve a big uncertainty). The files do not tell us which mental model the Board adopted when voting on Cases 2 and 6.

  (d) Decision based on consistency

  **Closest Analogue:** Case 6.
  **Breakdown:** Case 6 was a pilot of the intervention itself; Case 7 is a measurement of feasibility *before* intervention. Case 6 had a Tractability score of 4; Case 7 has a score of 3.

  **Principle if Funded:**
  "We fund high-leverage information gathering that resolves uncertainty on intractable problems, provided the cost is limited and the result dictates future capital allocation (ours or others')."
  *Commitment:* The Board commits to looking past the 'Tractability' header score when the grant is specifically for measurement or de-risking, prioritising the value of information over the probability of the ultimate goal's success.

  **Principle if Refused:**
  "We do not fund work associated with a problem graded as Tractability 3, regardless of whether the specific grant is for measurement. A low Tractability score on the problem vetoes the grant."
  *Commitment:* The Board commits to the header scores as binding constraints. This would create an inconsistency with Case 6 (where T=4 was accepted) unless they argue T=3 is a hard cliff-edge while T=4 is permissible. It would also ignore the counterfactual leverage (the other donor waiting in the wings).

  To remain consistent with its own record of rewarding counterfactual impact (Case 4, 5, 6) over raw scores (Case 2, 5), the Board should **Fund**.

  (e) Further evidence to settle the matter

  To resolve the tension between Case 2 and Case 6 without making a new decision, I would search for the **Board Minutes** corresponding to the dates of decisions 2 and 6. The prompt states the *reasoning* does not go into the *grant files*, but it may exist in the corporate minute book.

  Specifically, I would look for:
  1.  **In Case 6's minutes:** Any discussion distinguishing between "funding the pilot" and "funding the research". If the minutes record a director saying, "We are not funding the intervention, we are funding the *decision*," it confirms the Information Value rule, supporting Case 7.
  2.  **In Case 2's minutes:** Whether the refusal was due to the *technical risk* or the *cost*. The file note says "at any price", but the minutes might reveal if a smaller measurement grant was proposed and rejected at that time. If a smaller measurement grant was rejected in Case 2, Case 7 should be refused. If no such option was presented, Case 7 is distinguishable.
  3.  **Staff Scoring Rubric:** If a copy of the instructions given to the programme staff exists in the files, it would clarify whether they are told to score the "Field" or the "Application". If they are told to score the "Field", the Board is accustomed to adjusting the scores (as in Case 4), which supports funding Case 7 despite the T=3 header.
