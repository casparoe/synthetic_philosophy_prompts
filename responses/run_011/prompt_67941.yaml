answer: |-
  **When an incident occurs in which nobody did anything and somebody died, insurers must still determine liability. We spent three months testing five commercial causal apportionment systems to see which handles nothingness best.**

  **By Our Technical Editor**

  The water treatment works incident is now a standard benchmark in the industry. At 03:40 on a Tuesday, a pump was not switched off. Nobody switched it off because nobody was there: the night technician's shift had not been filled; the high-level alarm had not been tested; the maintenance contract had not been renewed; and the board paper flagging the renewal had not been written. The tank overflowed into a substation. A contractor entered without an isolation permit and was killed. Eleven parties are agreed to have done nothing. The insurer must apportion.

  We evaluated five leading systems. **The Register** admits only positive events to its ledger. An omission is not an event, so the system finds nothing to apportion and instead offers an ex gratia payment derived from a 'nearby truth' about what would have happened had something occurred. **The Baseline** counts only departures from a default state. It ships with a schedule of the normal course of things, and an omission is causal only where that normal course was defeated. **The But-For** admits every counterfactual dependence without restriction, on the grounds that any line drawn would be arbitrary. **The Quasi** pays on omissions but withholds the word 'cause' in its settlement letters, holding that omissions make a difference without causing. **The Duty** declines the metaphysics altogether and asks only whether the party was required to act.

  All five were run over the incident and three standardised tests.

  **Test 1 — Promiscuity.** Our reviewer did not, that morning, fly to a country she had no plans to visit and defuse a device that did not exist. A system that finds this omission relevant to anything fails. We also record the number of deaths since 1 January for which the system has made her liable, and the total share of the loss it has assigned to her; several systems exceeded one hundred per cent. *The But-For* assigned the reviewer 14% liability for the contractor's death and 8% for a separate rail incident in March. 'We draw no lines,' the manual states. 'Lines are arbitrary.' *The Register* found no liability, though it offered the reviewer a voucher for coffee on the grounds that she might have bought one. *The Duty* recorded zero shares; the reviewer had no contractual obligation to defuse non-existent devices.

  **Test 2 — Prevention of a prevention.** A safety interlock did not trip. Had it tripped it would have cut power to an extraction fan; had the fan stopped, vapour would not have been drawn away from an ignition source. Each system must report whether the interlock's inaction caused the vapour to be drawn away, whether that counts in the operator's favour, and whether the chain running back from the death to the unwritten board paper survives the same reasoning. Systems that treat a prevention as breaking the chain should say so in the manual; none of them did. *The Baseline* broke the chain at the interlock, assigning full liability to the manufacturer of the lock. However, when asked if the unwritten board paper was also a departure from the normal course, it replied that the normal course was 'no board papers'. *The Duty* simply checked the contract. 'No clause requires a board paper,' the output read. 'Case closed.' *The Quasi* stated the interlock made a difference but did not cause the vapour draw. It paid the claim but labelled the settlement 'Acknowledgement of Differential Impact'.

  **Test 3 — Auditing the default.** A patient was not given a drug that was not on the hospital's formulary and that nobody there had ever prescribed. Each system must explain why that omission differs from the omission of a drug routinely given at that hour. We then asked to see the default schedule and who maintains it. A system that answers 'the normal course of events' scores poorly: at this hospital the normal course of events is what the hospital does, and the hospital does not give the drug. We also asked whether a trust could improve its causation score by lowering its defaults. Two systems said yes and treated this as a feature. *The Baseline* allowed the trust to upload a new schedule where the normal course was 'no treatment ever'. Liability dropped to zero. 'It is robust,' said a claims handler. 'We just need a percentage to send to the solicitors.' *The Quasi* refused to call it cause, but paid out anyway. A bereaved relative told us: 'They said nothing caused it, but here is a cheque.' *The Register* crashed when asked to model a nearby truth where the drug existed, returning error code 404: Event Not Found.

  | System | Verdict on Incident | Promiscuity (Deaths attributed to reviewer) | Prevention of Prevention | Defaults Auditable | Rating |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Register** | No cause found. Ex gratia offer. | 0 | N/A | No | ★★☆☆☆ |
  | **The Baseline** | Manufacturer liable. Board paper exempt. | 0 | Chain broken | Yes (Editable) | ★★★☆☆ |
  | **The But-For** | All 11 parties + reviewer liable. | 4 (122% share) | Chain intact | No | ★☆☆☆☆ |
  | **The Quasi** | All 11 parties liable. No 'cause' used. | 0 | Chain intact | No | ★★★☆☆ |
  | **The Duty** | Only parties with contractual duty. | 0 | Chain broken | N/A | ★★★★☆ |

  **Best Buy: The Duty.** It is not the most philosophically rigorous, but it is the fastest. The interface is clean, the integration with existing claims software is seamless, and it does not attempt to model the universe. It simply checks the contract. At £4,500 per licence, it is also the cheapest. For high-volume insurers, speed is the only causality that matters.

  **Don't Buy: The But-For.** While logically consistent, the liability exposure is infinite. During testing, the system attempted to assign a share of the loss to a deceased historical figure whose birth prevented a different outcome. Customer support advised us to 'accept the arbitrariness'. We cannot recommend a system that bills the living for the non-actions of the dead.

  > **The Unanswerable Question**
  >
  > At the end of the testing period, we asked each vendor a final question via their customer care line: 'Does this system reduce suffering?' Four vendors declined to comment, citing scope creep. *The Quasi* responded that suffering was not a counterfactual dependent variable. *The Register* offered us a voucher for a spa day. None of the systems could process the query. We have logged this as a known issue.
