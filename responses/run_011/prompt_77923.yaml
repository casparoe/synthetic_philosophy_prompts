answer: |-
  (a)
  In 1998, the Metrology Lab operated a high-pressure gas calibration manifold constructed of 316 stainless steel, used to certify gravimetric standards against manometric references. The design included a 3-meter coiled restrictor tube submerged in a glycol bath before the critical flow nozzle, specified in the 1992 build protocol without explicit justification. Marcus, the shift lead, replaced the coil with a straight 0.5-meter tube during a maintenance cycle to reduce equilibration time, citing laminar flow efficiency and reduced dead volume. The system passed all contemporary quality checks; pressure transducers (±0.05% accuracy) and thermal couples (±0.5K) showed no deviation from specification during validation. However, six years later, laser-induced fluorescence imaging revealed that the straight tube allowed adiabatic cooling at the nozzle inlet sufficient to induce micro-condensation of heavy hydrocarbons, skewing molar fractions. The original coil's residence time prevented this thermal drop, a fact unmeasurable with 1998 instrumentation. Marcus's modification was logged and approved; no one consulted thermodynamics simulations, as computational fluid dynamics was not standard practice for this apparatus then.

  (b)
  **Rationale:** To prevent phase separation in certified gas standards, the flow path must ensure thermal equilibration prior to adiabatic expansion.
  **Prediction:** A heated straight tube of 0.5 meters would have functioned correctly (a design never built or considered).
  **Criticism:** Marcus's decision was incorrect because it violated the thermal stability requirement necessary for the certificate's validity. This is criticism rather than a hypothetical imperative because the normativity derives from the constitutive aims of metrology (truthful certification), which bind the agent regardless of their immediate operational aims or epistemic access; he failed the practice, not just his own goals.

  (c)
  **Dennett:** The rationale is a "free-floating rationale" attributed by the *interpreter* (the later discoverer), not the agent. Dennett's Design Stance usually implies a designer's intent, but here the intent is absent. Dennett would say the reason belongs to *us* who adopt the stance to predict system behavior, not to Marcus or the original builders. The case shows intentionality can be derived without being held.
  **Millikan:** No genuine reason exists. Millikan's "proper function" requires a history of reproduction selected for that specific effect. Since the thermal benefit was undetectable and unselected (Spec 7), the coil's thermal capacity is merely a causal disposition, not a normative function. The case shows her account cannot capture functional explanations in static engineering contexts.
  **Scanlon:** A genuine normative reason exists objectively. It is no one's reason psychologically, but it is a truth about what there is reason to do. Marcus acted contrary to a normative truth. The case confirms Scanlon's view that reasons are relations between facts and agents, not mental states.
  **Fischer & Ravizza:** No genuine reason *for Marcus*. Reasons-responsiveness requires the agent to be capable of recognizing the reason in the actual sequence. Since the data was unavailable (Spec 6), Marcus was not responsive to this reason. The case shows their view cannot ground technical criticism where epistemic access is lacking.

  (d)
  **Load-bearing feature:** The epistemic inaccessibility of the thermal drop (Spec 6).
  **Ablation:** If the thermal drop were detectable with 1998 instruments, Marcus could have known. Dennett would assign the reason to the designer/operator; Millikan might argue selection pressure existed; Scanlon's reason remains objective but becomes agent-accessible; Fischer & Ravizza would assign responsibility. The "free-floating" nature collapses into ordinary negligence or design intent, removing the tension between normativity and psychology.

  (e)
  **Objection (Millikan):** "You describe a causal necessity, not a rationale. Without a selection history linking the trait to the effect, there is no normativity, only physics. To call it a 'mistake' is to project human interests onto causal regularities."
  **Assessment:** This is a concession about the position, not a challenge to the case. It admits that Millikan's account excludes standard engineering explanations where functions are assigned based on physical requirements rather than evolutionary history. This supports your thesis that functional explanation commits us to rationales exceeding etiological accounts.

  (f)
  **Verdict:** Feasible, but Specification 5 (Criticism) and Specification 6 (Undetectability) are in high tension.
  **Tension:** Criticism typically implies 'ought implies can'; if the reason was undetectable, Marcus could not have acted on it.
  **Resolution:** Relax the notion of "criticism" from "blame attributable to the agent" to "identification of error relative to constitutive norms."
  **Loss:** Relaxing this weakens the link between rationality and agency. If we criticize agents for violating inaccessible norms, we sever the connection between reasons and motivation, which some philosophers argue is essential to the concept of a reason. However, for your essay's purpose (showing functional explanation exceeds agent-centric views), this tension is the desired feature, not a bug.
