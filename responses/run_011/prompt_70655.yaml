prompt: |-
  I direct the research unit of a national truth commission charged with establishing the facts about a period of military rule roughly forty years ago. The registry files from that period were largely destroyed, so most of our case files rest on survivor testimony, a small number of surviving administrative documents from the regime itself, contemporaneous press coverage, and memoirs and human-rights reports written years afterwards. Our founding statute provides that a finding of fact must be corroborated by at least two independent sources, and that provision is breaking down in practice: read strictly it establishes almost nothing, and read loosely it admits testimony that turns out to be one account arriving three times.

  My assessment officers — eight of them, none trained as historians — each work through twenty to thirty case files a week. Every file must end with one of three labels, established / probably occurred / not established, before legal counsel signs off and the label is printed in the public report.

  Write a decision procedure an officer can run on a single file in about thirty minutes. It should give the questions to ask in order, what counts as a sufficient answer to each, and above all a workable test for when two sources are independent enough to corroborate — including the partial-overlap case, where sources may share a provenance for some details of an account and not for others. It must say explicitly what to do when provenance cannot be determined at all, and it must keep separate the two different reasons for downgrading a file: that a source is biased, and that a source is not independent. Ground it in what the craft of source criticism actually offers rather than in the wording of our statute, and mark clearly which steps are judgment calls dressed up as procedure. Also mark the points at which the question stops being evidential and becomes one of mandate — for instance, whether a perpetrator may be named in a file that ends up labelled not established.

  Then run the procedure on three files:

  (a) Three witnesses give closely matching accounts of a killing at a bridge outside a provincial town. All three were held in the same detention facility during the same months; two subsequently lived in the same exile community and were interviewed together by an NGO in the 1990s. A newspaper of the period reported only that there had been security operations in the region. This is a case the commission's chair very much wants established.

  (b) A single memoir, written thirty years after the events by a former conscript, describes the transfer of prisoners from one facility to another. It is matched in detail by a surviving transport log from the Interior Ministry — a document the regime produced for its own administrative purposes, which records movements but says nothing about what happened to the people moved.

  (c) A claim appears first in a 1986 article in an exile newspaper, then in two academic histories that both cite that article, and then in the statement of a witness who confirms having read the article as a young man.

  Finish by stating what this procedure cannot settle, and where its labels will be systematically misleading.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Director of a Research Unit for a National Truth Commission.
      *   **Context:** Military rule 40 years ago. Registry files destroyed. Evidence: survivor testimony, scarce admin docs, press, memoirs, HR reports.
      *   **Constraint:** Statute requires "corroboration by at least two independent sources."
      *   **Problem:** Strict reading = nothing established. Loose reading = one account counted three times (echo chamber).
      *   **Task:** Write a 30-minute decision procedure for Assessment Officers (8 officers, non-historians, 20-30 files/week).
      *   **Requirements:**
          *   Questions in order.
          *   Sufficient answers for each.
          *   Workable test for independence (including partial overlap).
          *   Explicit instruction for undetermined provenance.
          *   Distinguish *bias* vs. *lack of independence*.
          *   Grounded in source criticism craft, not just statute wording.
          *   Mark judgment calls dressed as procedure.
          *   Mark evidential vs. mandate questions (e.g., naming perpetrators in "not established" files).
          *   Apply procedure to three specific cases (a, b, c).
          *   Conclude with limitations and systematic misleading aspects of the labels.

  2.  **Deconstruct the Core Problem (Independence vs. Corroboration):**
      *   The statute says "two independent sources."
      *   *Independence* means the generation of the information in Source A did not depend on Source B.
      *   *Corroboration* means they agree on the specific fact in question.
      *   *The Trap:* Three witnesses who talked to each other or were interviewed together are *one* source genealogically, even if there are three physical documents/bodies.
      *   *The Solution:* A "Genealogical Tree" approach adapted for quick triage. Focus on the *origin* of the specific claim, not just the physical medium.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Time Limit:* 30 minutes. Needs to be streamlined, not a PhD thesis.
      *   *Structure:* Step-by-step flow.
      *   *Key Distinction:* Bias (motivation to lie) vs. Independence (mechanism of transmission).
      *   *Judgment Calls:* Must be flagged. Officers aren't historians, so they need heuristics.
      *   *Mandate vs. Evidence:* When do we stop looking at truth and start looking at policy?

      *   *Step 1: Claim Isolation.* What exactly are we proving? (e.g., "X was killed at Y bridge on Z date" vs. "X disappeared").
      *   *Step 2: Source Inventory.* List every piece of paper/statement.
      *   *Step 3: Genealogical Mapping (The Independence Test).* This is the crux.
          *   Did Source A know Source B's account before creating their own?
          *   Did both drink from the same well (e.g., same NGO interview session)?
          *   *Partial Overlap:* If they were in the same cell, they share knowledge of *being* in the cell, but not necessarily *who* shot whom outside. Need to separate "shared experience" from "shared narrative."
      *   *Step 4: Bias/Reliability Check.* Separate from independence. Even independent sources can lie.
      *   *Step 5: The Verdict.* Established / Probably / Not Established.
      *   *Step 6: Mandate Check.* Naming names?

  4.  **Refining the Independence Test (The "Common Origin" Rule):**
      *   To count as two sources, they must diverge *before* the specific claim is generated.
      *   *Heuristic:* If you remove the link between them, does the claim still exist in both?
      *   *Partial Overlap:* If Witness A and B were in the same cell, their testimony about *guard shifts* might be dependent (they saw the same thing at the same time), but their testimony about *what happened before arrest* is independent.
      *   *Undetermined Provenance:* Default to "Dependent" if the link is plausible and unverifiable (Precautionary Principle).

  5.  **Drafting the Case Studies:**

      *   *Case (a):* Three witnesses, same detention, same exile, interviewed together.
          *   *Analysis:* Genealogically one source (contamination/collusion risk). Press report is too vague ("security operations" $\neq$ "killing at bridge").
          *   *Verdict:* Not Established (statutorily), though likely true.
          *   *Pressure:* Chair wants it established. Procedure must resist this.

      *   *Case (b):* Memoir (30 yrs later) + Transport Log (Contemporaneous).
          *   *Analysis:* Log proves movement. Memoir proves *what* happened to prisoners. Do they corroborate the *transfer*? Yes. Do they corroborate the *fate*? No.
          *   *Independence:* High. Admin log didn't read the memoir; memoirist likely didn't see the log.
          *   *Verdict:* Transfer = Established. Fate = Probably/Not Established.

      *   *Case (c):* Exile Article -> Academic Histories -> Witness (who read article).
          *   *Analysis:* This is the "Echo Chamber." The witness confirms the *article*, not the event. The academics cite the *article*.
          *   *Independence:* Zero. All stem from the 1986 article.
          *   *Verdict:* Not Established.

  6.  **Addressing the "Limitations" Section:**
      *   What does this procedure miss?
      *   *Systemic Truth:* Focusing on individual cases misses the pattern.
      *   *Power Imbalance:* The state destroyed records; requiring "two sources" penalizes the victim.
      *   *The Labels:* "Not Established" sounds like "Didn't Happen." It actually means "We can't prove it under these rules."
      *   *Judgment Calls:* Officers will inevitably drift.

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Professional, directive, empathetic but rigorous.
      *   *Formatting:* Clear headings, bold text for critical instructions.
      *   *Constraint Check:* Did I mark judgment calls? Yes. Did I separate bias/independence? Yes. Did I handle the mandate question? Yes.
      *   *Time Management:* Is this doable in 30 mins? It needs to be a checklist, not an essay. I will structure it as a "Workflow Protocol."

  8.  **Final Polish:**
      *   Ensure the distinction between "Probably Occurred" and "Established" is clear based on the source weight.
      *   Make sure the "Partial Overlap" instruction is practical (split the claim).
      *   Ensure the "Chair's pressure" in Case A is addressed by the procedure's rigidity.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "be careful." I need to give a specific test. *Test:* "The Silencing Test." If Source A were silenced, would Source B still contain this specific detail? If no, they are dependent.

  *(Refining the Mandate Point)*: The prompt asks about naming perpetrators in "Not Established" files. This is a legal/policy decision, not evidential. I need to mark that boundary clearly.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # RESEARCH UNIT PROTOCOL 04-B: SOURCE CORROBORATION AND INDEPENDENCE
  **To:** Assessment Officers
  **From:** Director of Research
  **Subject:** Decision Procedure for Case File Classification
  **Time Allocation:** 30 Minutes per File

  ## PURPOSE
  This protocol operationalizes the statutory requirement for "two independent sources." It is designed to prevent the "echo chamber" effect (counting one narrative multiple times) while acknowledging the scarcity of records. It distinguishes between **Independence** (genealogy of information) and **Reliability** (bias/truthfulness).

  **WARNING:** This procedure contains **Judgment Calls** (marked **[JC]**) where your professional discretion is required, and **Mandate Boundaries** (marked **[MB]**) where evidential questions end and policy decisions begin.

  ---

  ## PHASE 1: CLAIM ISOLATION (5 Minutes)
  *Do not evaluate the whole file. Evaluate specific factual claims.*

  1.  **Extract the Core Claim:** Write down the specific fact requiring corroboration (e.g., "Victim X was executed at Y Bridge on Z Date," not "Victim X disappeared").
  2.  **Inventory Sources:** List every document or testimony containing this claim.
      *   *Example:* Witness A Statement, Witness B Statement, NGO Report, Press Clip.

  ## PHASE 2: THE INDEPENDENCE TEST (15 Minutes)
  *Independence is about the origin of the information, not the physical medium. Two documents are not two sources if they drink from the same well.*

  **Step 1: The Genealogy Check**
  For every pair of sources supporting the Core Claim, ask:
  *   "If Source A had never existed or never spoken, would Source B still contain this specific detail?"
  *   **Sufficient Answer for Independence:** Yes. The creation of Source B did not rely on knowledge of Source A's account.
  *   **Insufficient Answer:** No, or "Unsure."

  **Step 2: The Common Context Filter (Partial Overlap)**
  *Sources often share a context but differ in knowledge.*
  *   **Scenario:** Two witnesses were in the same cell.
  *   **Procedure:** Split the claim.
      *   *Claim:* "We were in Cell 4." -> **Dependent.** (Shared sensory experience).
      *   *Claim:* "I was arrested at my home." -> **Independent.** (Separate prior experiences).
      *   *Claim:* "We were taken to the bridge and shot." -> **Dependent** *IF* they could only know this by talking to each other or seeing the same moment together. **Independent** *IF* one saw the shooting and the other heard the orders separately.
  *   **[JC]:** You must decide if the shared context makes the specific detail unavoidable collateral knowledge or a shared narrative constructed later. When in doubt, classify as **Dependent**.

  **Step 3: The Publication Chain**
  *   Check dates. If Source B is published after Source A, does Source B cite Source A?
  *   Check intermediaries. Did an NGO interviewer summarize Witness A and Witness B in the same report? If the Report is the source, the Witnesses are the *origin*. If the Report merges their stories, the Report counts as **One Source**, regardless of how many witnesses it quotes.

  **Step 4: Undetermined Provenance**
  *   **Rule:** If you cannot determine if two sources influenced each other (e.g., two memoirs published same year, no contact records), apply the **Precautionary Principle**.
  *   **Action:** Treat them as **Dependent**.
  *   **Rationale:** In a climate of fear and exile communities, information flows invisibly. We cannot afford false positives.

  **Step 5: Counting**
  *   **Established:** Requires **Two Independent Sources** (per Statute).
  *   **Probably Occurred:** Requires **One Strong Source** (e.g., contemporaneous admin doc) + **No Contradictory Evidence**, OR **Two Dependent Sources** + High Plausibility.
  *   **Not Established:** **Zero Sources** or **Only Dependent Sources** without supporting admin evidence.

  ## PHASE 3: RELIABILITY VS. INDEPENDENCE (5 Minutes)
  *Do not conflate "lying" with "copying."*

  1.  **Bias Check:** Does the source have a motive to fabricate? (e.g., compensation claims, political vengeance).
      *   *Note:* A biased source can still be **Independent**. (Two enemies can independently tell the truth about a third party).
  2.  **Downgrading Logic:**
      *   If sources are **Dependent**: Downgrade from *Established* to *Probably* or *Not Established*.
      *   If sources are **Biased**: Downgrade from *Established* to *Probably* (if corroborated) or *Not Established* (if uncorroborated).
      *   **[JC]:** You must weigh whether bias destroys credibility entirely or merely requires corroboration.

  ## PHASE 4: MANDATE BOUNDARY & LABELING (5 Minutes)
  *Evidence ends here. Policy begins.*

  1.  **Assign Label:** (Established / Probably Occurred / Not Established).
  2.  **[MB] Naming Perpetrators:**
      *   If Label is **Established**: Perpetrators may be named if identified in the sources.
      *   If Label is **Probably** or **Not Established**: **DO NOT NAME PERPETRATORS.**
      *   *Reasoning:* Naming implies a level of proof the label explicitly denies. This is a legal safeguard, not an evidential conclusion.
  3.  **Final Review:** Does the label reflect the *evidence*, or does it reflect what the Commission *wishes* were true? If the latter, revert to Phase 2.

  ---

  # APPLICATION OF PROTOCOL TO SAMPLE FILES

  ## CASE (a): The Bridge Killing
  **Evidence:**
  1.  Witness A (Detainee, Exile Community)
  2.  Witness B (Detainee, Exile Community)
  3.  Witness C (Detainee, Exile Community)
  4.  Newspaper (Period, "Security Operations")
  5.  NGO Report (1990s, Interviewed A & B together)

  **Procedure Run:**
  1.  **Claim:** "Killing at bridge outside provincial town."
  2.  **Genealogy:**
      *   Witnesses A, B, C: Same detention, same exile. High risk of narrative alignment.
      *   NGO Report: Interviewed A & B *together*. This merges A and B into **One Source**.
      *   Witness C: If C was not in the joint interview, C is physically separate. However, same exile community implies high probability of shared narrative. Under **Precautionary Principle (Phase 2, Step 4)**, treat A, B, C as **One Genealogical Source**.
      *   Newspaper: Reports "Security Operations." Does not corroborate "Killing at Bridge." Too vague. **Zero Corroborative Value.**
  3.  **Independence Count:** 1 (The Witness Cluster).
  4.  **Reliability:** Witnesses may be biased (survivors), but independence is the blocker.
  5.  **Verdict:** **NOT ESTABLISHED.**
  6.  **Mandate Check:** Chair wants this established. **Protocol Override:** The procedure forbids upgrading based on desire. To label *Established* violates the Statute's definition of independence.
  7.  **Outcome:** File labeled *Not Established*. Narrative can describe the *allegation* in the general report, but no specific finding of fact.

  ## CASE (b): The Transport Log
  **Evidence:**
  1.  Memoir (Former Conscript, 30 years later).
  2.  Transport Log (Interior Ministry, Contemporaneous).

  **Procedure Run:**
  1.  **Claim Split:**
      *   Claim 1: "Prisoners were transferred from Facility X to Y."
      *   Claim 2: "Prisoners were abused/killed during transfer."
  2.  **Independence:**
      *   Log is administrative; Memoir is personal recollection. No evidence Conscript saw Log. Log did not read Memoir. **Independent.**
  3.  **Corroboration:**
      *   Claim 1: Log records movement. Memoir records movement. **Match.**
      *   Claim 2: Log is silent on fate. Memoir describes abuse. **No Match.**
  4.  **Verdict:**
      *   Claim 1 (Transfer): **ESTABLISHED** (2 Independent Sources).
      *   Claim 2 (Fate/Abuse): **PROBABLY OCCURRED** (1 Source, uncontradicted, plausible).
  5.  **Mandate Check:** Can we name the Conscript? Yes, he is the source. Can we name the officers listed on the Log? Yes, for the transfer. Not for the abuse.

  ## CASE (c): The Exile Article Echo
  **Evidence:**
  1.  Exile Newspaper Article (1986).
  2.  Academic History 1 (Cites Article).
  3.  Academic History 2 (Cites Article).
  4.  Witness Statement (Confirms reading Article).

  **Procedure Run:**
  1.  **Claim:** "Event X happened."
  2.  **Genealogy:**
      *   Article: Origin point.
      *   History 1 & 2: Derivative of Article. **Dependent.**
      *   Witness: Explicitly confirms knowledge comes from Article. **Dependent.**
  3.  **Independence Count:** 1 (The 1986 Article).
  4.  **Verdict:** **NOT ESTABLISHED.**
  5.  **Analysis:** This is a classic "Echo Chamber." Four physical documents, one source of information. The Witness is not corroborating the *event*, but the *circulation of the story*.
  6.  **Outcome:** File labeled *Not Established*.

  ---

  # LIMITATIONS AND SYSTEMATIC BIASES OF THIS PROCEDURE

  As Director, I must inform the Commission that this procedure, while necessary for statutory compliance, produces specific distortions in the historical record.

  **1. The "State Advantage" Bias**
  The procedure privileges written, administrative records (like Case B's Log) over oral testimony. Because the regime destroyed its own files, the State's surviving bureaucracy is often more "independent" than the victims' networks, which were necessarily clandestine and interconnected for survival. This procedure will systematically **under-count** atrocities that left no paper trail, even if survivor testimony is truthful.

  **2. The "Not Established" Fallacy**
  The label *Not Established* will be read by the public and media as *Did Not Happen*. It actually means *Cannot be proven under Statute 4-B*. This creates a false negative history. We are building a record of what we can *prove*, not necessarily what *was*.

  **3. The Judgment Call Variance**
  Despite the protocol, the **[JC]** markers on "Partial Overlap" and "Bias" introduce human variance. Officer 1 may treat two detainees from the same cell as independent regarding guard brutality; Officer 2 may not. Over 2,000 files, this creates inconsistency. We cannot eliminate this without halting production for historical peer review, which we cannot afford.

  **4. The Mandate Boundary Blur**
  In Case (a), the Protocol forbids naming perpetrators in a *Not Established* file. However, the public may perceive the Commission's silence on names as exoneration. The procedure protects the Commission from libel, but it may fail the victims' need for acknowledgment. This is a legal shield, not a truth-seeking tool.

  **5. Structural Silence**
  This procedure evaluates cases in isolation (20-30 per week). It cannot easily detect **Pattern Evidence**. If 50 files are all labeled *Probably Occurred* because they lack a second source, the *pattern* establishes the fact of systematic abuse, even if individual files do not meet the "Established" threshold. The officers are trained to look at trees; the Commission must ensure the Directors look at the forest.

  **Final Instruction:** Follow the protocol. It is imperfect, but it is the only barrier between us and the fabrication of history, whether by the State's silence or our own desire for closure.
