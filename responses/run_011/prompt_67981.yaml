  **MEMORANDUM**

  **TO:** Judges Miller and Chen
  **FROM:** Judge [Your Name]
  **RE:** *State v. Paddleboard Defendant* – Statutory Interpretation Conference

  **Recommended Disposition:** Reverse the conviction.

  We face a close question, but our recent record commits us to a rule of legislative supremacy that forbids expanding penal statutes beyond their enacted text, particularly when the legislature has amended neighboring provisions without touching the one at issue. Below I outline the interpretive commitments evident in our last six cases, apply them to the watercraft appeal, and propose a path forward.

  **(a) Candidate Interpretive Commitments**

  Three distinct approaches account for our precedents, though each strains against at least one decision.

  1.  **Original Meaning Static Textualism:** Statutory meaning is fixed at enactment. Subsequent amendments to neighboring sections imply exclusion for the unamended section (*expressio unius*). Courts cannot update statutes to match technology or better safety devices.
      *   *Support:* Cases 2 (Fireworks), 4 (Hearing Request), 6 (Kitchen Equipment).
      *   *Tension:* Cases 1, 3, and 5. Case 1 (Refund) allowed a practical exception to text. Cases 3 (Presence) and 5 (Residence) expanded liability/eligibility based on legal reality rather than physical text.
      *   *Reconciliation:* Cases 3 and 5 can be saved if we treat "presence" and "resided" as legal terms of art (like "domicile") rather than plain text. Case 1 remains a narrow impossibility exception.

  2.  **Functional Purposivism:** Statutes are interpreted to achieve their obvious legislative goal unless the text expressly forbids it.
      *   *Support:* Cases 1 (Fairness), 3 (Child Safety), 5 (Veteran Benefit).
      *   *Tension:* Cases 2 and 6. In Case 2, we ignored the safety purpose of the fireworks act because the text said "sell." In Case 6, we ignored the superior safety of the fixed system because the text said "portable."
      *   *Outlier:* To maintain this rule, we must treat Case 6 as poorly reasoned or admit that regulatory specificity trumps general purpose.

  3.  **Hybrid Lenity Rule:** Penal statutes are strictly construed against the state unless the text is genuinely ambiguous after considering legal definitions.
      *   *Support:* Case 2 (Fireworks) and arguably Case 3.
      *   *Accommodating Case 3:* This commitment accommodates Case 3 if we view "presence" as legally ambiguous (perceptual vs. physical), allowing purpose to resolve the tie. In Case 2, "sell" was unambiguous (exchange for value), so lenity dictated reversal.
      *   *Outlier:* Case 6 is not penal, so this rule doesn't govern it. However, Case 4 (non-penal) suggests a strict textualism that conflicts with the "purpose resolves ambiguity" wing of Case 3.

  **(b) Application to the New Case**

  *   **Original Meaning Static Textualism:** Yields **Reversal**. In 1994, "motorized watercraft" implied combustion engines, not electric-assist paddleboards. The 2009 amendment defining "vessel" elsewhere suggests the legislature knows how to include electric craft but chose not to amend Section 12.
  *   **Functional Purposivism:** Yields **Conviction**. The purpose is protecting swimmers from powered craft closing faster than a swimmer can clear. The board fits this hazard profile.
  *   **Hybrid Lenity Rule:** Yields **Reversal**. "Motorized" is not genuinely ambiguous in a penal context when weighed against the 2009 amendment's silence on Section 12. Lenity breaks the tie for the defendant.

  *Missing Input:* The record supplies no method for fixing the level of generality for Section 12's purpose. Is it "protecting swimmers from powered craft" (supports Conviction) or "stopping fast boats near beaches" (supports Reversal)? Our precedents split on this: Case 3 used a high-level purpose (perception), while Case 6 used a low-level purpose (specific device). Without a rule for selecting the level of generality, Purposivism is indeterminate.

  **(c) Recommendation and Analogs**

  I recommend we **reverse**. The closest analog is **Case 4 (Hearing Request)**. Like Case 4, we have a statute enacted in one era (1994/1987) and a later amendment to a neighboring section (2009/2011) that updated definitions elsewhere but left the operative provision untouched. In Case 4, we held the email insufficient because the legislature knew how to authorize electronic filings and didn't do it here. Here, the legislature defined "vessel" to include electric craft in 2009 but did not touch Section 12. We should respect that choice.

  The strongest consideration for the losing side (the State) is **Case 3 (Enhanced Penalty)**. The State will argue that just as "presence" was defined by perception rather than physical location to protect children, "motorized" should be defined by propulsion capability rather than engine type to protect swimmers. Both are safety statutes where the harm is real regardless of the technicality.

  The hardest precedent to distinguish if we rule for the State (Affirmance) is **Case 4**. To affirm, we would have to explain why the 2009 amendment to the registration section does not trigger the same negative implication we relied on in Case 4. Distinguishing "vessel" from "watercraft" is possible but thin given the contextual overlap.

  **(d) General Principle and Legislative History**

  If we reverse, the panel adopts this principle: **Where a penal statute's text is specific, courts will not expand it to cover new technologies or devices absent clear legislative authorization, even if the new device poses similar risks.** This commits us to requiring legislative updates for technological shifts, placing the burden on the state to seek amendment rather than judicial expansion.

  Regarding the legislative history: The 2009 amendment defines "vessel" for registration, not "watercraft" for safety. However, under Case 4, this amendment does work here: it shows the legislature considered electric craft and chose where to include them. The negative-implication inference is available only if the phrase "motorized watercraft" did not already cover the device. If we hold the phrase *already* covered it, the amendment was clarifying, not expanding. But given the 1994 enactment date, we should presume the original text did not cover electric-assist boards. The failed bill from last session is weak evidence; it may mean the legislature thought the change unnecessary, but combined with Case 4, it supports waiting for successful enactment.

  **(e) Future Case Variant**

  Consider a case involving a **kayak equipped with a battery-powered bilge pump and GPS unit, but no propulsion motor**. The defendant is charged under Section 12.

  *   **Original Meaning Textualism:** Predicts **Reversal**. No motor for propulsion means not "motorized."
  *   **Functional Purposivism:** Splits. If the purpose is "preventing collision," a non-propelled kayak poses less risk (Reversal). If the purpose is "regulating any machinery near swimmers" (noise/sparks), it might qualify (Conviction).
  *   **Hybrid Lenity:** Predicts **Reversal**. Ambiguity resolved for defendant.

  This variant would eliminate the Functional Purposivism commitment unless we can agree on whether "motorized" implies *propulsion* specifically. It forces us to decide if the hazard is the *machine* or the *movement*. Our current record does not decide this, as Case 3 involved perception (movement-independent) and Case 6 involved a specific safety tool (movement-independent). This case would require us to choose between the "propulsion" limit and the "machinery" limit.

  **Conclusion**

  Reversing aligns best with Case 4 and Case 2, preserving legislative supremacy in penal definitions. Affirming requires us to treat Case 4 as an outlier or distinguish it on fragile grounds. I look forward to discussing this at conference.
