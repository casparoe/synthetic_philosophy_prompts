answer: |-
  1. You argue that when a demon threatens you unless you admire him, he isn't giving you a reason to admire, but a reason to think admiring him is beneficial. If reasons for attitudes are strictly about the object's merits, how do you explain the intuitive pull that the threat *does* speak to the attitude itself?
  **Follow-up:** Consider a spouse paying their partner to feel genuine jealousy over a fictional rival. Is the payment a reason to feel jealous, or just a reason to pretend?

  2. In cases like a coach believing in a rookie to boost performance, or hoping your partner pulls through to aid recovery, the benefit of believing seems to guarantee the truth. Doesn't this fuse the question of whether it's good to believe with whether it's true?
  **Follow-up:** Imagine a diplomat who must believe peace is achievable to negotiate successfully, where doubt ensures failure. Is her reason for belief evidence of peace, or evidence of the benefit?

  3. If belief is analytically tied to truth rather than goodness, does this make the pragmatist view that we should believe what works literally unintelligible rather than just false?
  **Follow-up:** Think of a patient who adopts a sunny outlook to speed healing, knowing statistics are against them. Is she believing she will recover, or merely believing optimism helps?

  4. You suggest we cannot believe or intend simply because a reward is offered. Does your framework explain why we lack this capacity, or does it just redefine the activity so the incapacity disappears by stipulation?
  **Follow-up:** Picture a spy paid to intend to defect, where real intent would trigger surveillance but fake intent would not. Can he intend for the money, or must he simulate intent?

  5. Even if the demon's threat isn't a reason to admire, surely it creates an all-things-considered obligation to admire to avoid punishment. Why does denying it status as a reason block this obligation?
  **Follow-up:** Consider a juror who knows acquitting a guilty defendant will prevent a riot. Is there an obligation to believe him innocent, or just to vote for acquittal?

  6. You claim putative reasons for grief or fear are actually reasons to cultivate or display those feelings. But since emotions often arise involuntarily, how can we have reasons to do what we cannot directly control?
  **Follow-up:** Think of a mourner who feels relief instead of sadness at a relative's passing and tries to force tears. Is she failing to grieve, or failing to display grief?

  7. By making evidentialism true by analysis, you protect it from counterexamples, but does this risk making the theory trivial and unable to guide actual inquiry where stakes matter?
  **Follow-up:** Imagine a scientist who ignores a risky hypothesis because funding depends on safe results. Is she violating a reason to believe, or a reason to investigate?
