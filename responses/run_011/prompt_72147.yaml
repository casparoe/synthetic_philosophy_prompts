      *   *No Named Philosophers:* Refer to "Consent Theorists," "Surplus Theorists," etc.
      *   *Flag Incompatible Requirements:* Make sure this is clear.
      *   *Close with Alienation:* One line.

  11. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't validate Marx's LTV as fact, but present it as a requirement *if* you go that route.
      *   *Correction:* Ensure the "Trap" section directly addresses the user's suspicion about fairness baselines.
