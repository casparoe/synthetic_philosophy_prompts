answer: |-
  Here is the specification sheet for a theory of exploitation. This breaks down the mechanical requirements any account needs to function, separating the universal problems from the ideological battlegrounds between your teacher's structural view and your dad's voluntarist view.

  ### I. The Test Cases (The "Must-Haves")
  Any robust theory has to explain why these specific scenarios feel different from one another. If a theory calls all of them "exploitation" or none of them "exploitation," it is usually too blunt to be useful.

  **1. The Desperate Factory Worker**
  *   **The Case:** A worker takes a dangerous, low-paying job. She admits she'd be starving without it. The owner makes a profit off her labor.
  *   **The Requirement:** **The Benefit Constraint.** The theory must explain how a transaction can be *mutually beneficial* (she gets wages, he gets profit) and yet still be exploitative.
  *   **Status:** **Universal Problem.** Both sides must address this. Your dad's side usually fails here (arguing benefit precludes exploitation); your teacher's side usually passes here (arguing benefit is irrelevant to surplus extraction).

  **2. The Hurricane Water Seller**
  *   **The Case:** A guy sells cases of water for $40 after a storm. Buyers pay voluntarily because they are thirsty.
  *   **The Requirement:** **The Vulnerability Condition.** The theory must distinguish between taking advantage of someone's *preferences* (they like water) vs. taking advantage of someone's *desperation* (they will die without water).
  *   **Status:** **Universal Problem.** Everyone agrees this feels sketchy, but they disagree on why. Is it the price? The circumstance? The intent?

  **3. The Unpaid Intern**
  *   **The Case:** A student works for free. No wages are paid. However, they gain connections and skills that lead to a high salary later.
  *   **The Requirement:** **The Investment Distinction.** The theory must distinguish between *extraction* (taking value now) and *investment* (forgoing value now for gain later).
  *   **Status:** **Camp-Specific.** Surplus theorists (Marxists) struggle here unless they argue the connections are a myth. Consent theorists pass this easily (it's a voluntary trade of labor for education).

  **4. The Subcontractor Chain**
  *   **The Case:** A brand sells a shirt for $50. A factory makes it for $5. A laborer is paid $0.50. The brand CEO never meets the laborer.
  *   **The Requirement:** **The Agency Problem.** The theory must identify *who* is doing the exploiting. Is it the factory owner? The brand? The market system itself?
  *   **Status:** **Universal Problem.** This is where "your dad" (interpersonal) and "your teacher" (structural) argue past each other. One looks for a villain; the other looks for a mechanism.

  ---

  ### II. The Conceptual Distinctions
  A theory cannot mush these concepts together. If it does, it loses its explanatory power.

  **1. Being Used vs. Being Used Unfairly**
  *   **The Problem:** I "use" the cashier to get my groceries; she "uses" me to get her wage. This is instrumentalization.
  *   **The Requirement:** The theory must define the *normative threshold*. When does "using" become "exploiting"? Usually, this requires a violation of duty or fairness, not just utility.
  *   **Status:** **Universal.**

  **2. Exploitation vs. Unequal Split**
  *   **The Problem:** I find a diamond in the dirt and sell it to you for $100, though it's worth $1,000. You didn't know. I gained more value than you.
  *   **The Requirement:** The theory must distinguish *luck* or *information asymmetry* from *exploitation*. Not every bad deal is exploitation.
  *   **Status:** **Universal.**

  **3. Exploitation vs. Alienation**
  *   **The Problem:** A worker feels disconnected from their work, their product, and themselves.
  *   **The Requirement:** The theory must keep psychological states separate from economic transactions. You can be exploited without feeling alienated (a happy, well-paid worker in a Marxist view is still exploited). You can be alienated without being exploited (a freelance artist with no boss).
  *   **Status:** **Camp-Specific.** This is primarily a Marxist distinction. Liberal theories rarely track "alienation" as a political category.

  **4. Descriptive vs. Condemnatory**
  *   **The Problem:** Biologists say parasites "exploit" hosts. They don't mean it's immoral, just mechanical.
  *   **The Requirement:** The theory must state if "exploitation" is a moral charge (it is wrong) or a mechanical description (value moved from A to B).
  *   **Status:** **Camp-Specific.** Your teacher is using the condemnatory version. Your dad is arguing against the moral charge by denying the mechanical premise (he denies the value transfer is unjust).

  ---

  ### III. The Hard Questions
  Here are the direct answers to your specific theoretical queries.

  **1. Does an account have to have a story about where value comes from?**
  *   **Answer:** **No.**
  *   **Explanation:** Your teacher's view (Marxian) requires a **Labor Theory of Value** (value is created by work, so profit is stolen labor). However, modern "Vulnerability Theories" do not need this. They argue exploitation happens when A takes advantage of B's weakness to get a better deal, regardless of who "created" the value. You can have a theory of exploitation based purely on bargaining power and options, without needing to prove labor creates all value.

  **2. Can a deal that leaves both sides better off still be exploitative?**
  *   **Answer:** **Yes.**
  *   **Explanation:** This is the core of the structural argument. If the *only* alternative for the worker is starvation, and the *only* alternative for the owner is lower profits, the deal helps both. But if the owner has 1,000 other options and the worker has one, the split of the benefits is determined by power, not fairness. Most contemporary philosophical accounts accept that mutual benefit does not immunize a transaction from being exploitative.

  **3. Is there such a thing as exploitation with no exploiter in it?**
  *   **Answer:** **Yes (Structural Exploitation).**
  *   **Explanation:** If the market forces compel a factory owner to cut wages to stay competitive, and the workers must accept to eat, the exploitation is generated by the *system rules*, not necessarily the owner's malice. The owner is merely a conduit. Your dad's view generally rejects this (no villain, no crime). Your teacher's view accepts it (the system is the villain).

  ---

  ### IV. The Trap (Incompatible Requirements)
  You suspected a trap regarding fairness baselines. You are correct. Here are the two requirements that cannot both be met:

  **1. The Neutral Baseline Requirement:** To prove exploitation, you must compare the actual deal against a "fair" baseline (what the worker *should* have been paid).
  **2. The Normative Neutrality Requirement:** The theory must not sneak in a controversial moral view to define that baseline (it must be objective).

  **Why they break:** You cannot define a "fair wage" without already assuming a moral theory about property, labor, or need. If you say the fair wage is "the market rate," you validate the status quo (killing the Marxist critique). If you say the fair wage is "the full value of the product," you assume the Labor Theory of Value (which economists largely reject). If you say the fair wage is "a living wage," you assume a right to subsistence (which Libertarians reject).
  **Verdict:** You cannot have an objective measuring stick for exploitation that doesn't already contain the moral conclusion you're trying to prove.

  ---

  ### V. The Verdict

  **The Single Requirement That Knocks Out the Most Theories:**
  **The Counterfactual Baseline.**
  To claim exploitation, you must be able to say what *would* have happened in a non-exploitative world. Most theories collapse because they cannot describe a realistic alternative scenario. Libertarians fail because their baseline (no coercion) ignores background desperation; Marxists fail because their baseline (full value to worker) ignores risk and capital coordination costs.

  **On Alienation:**
  Yes, you can be alienated without being exploited (e.g., a solitary craftsman who hates his work), but under Marxist theory, you cannot be truly exploited without some degree of alienation from the product of your labor.
