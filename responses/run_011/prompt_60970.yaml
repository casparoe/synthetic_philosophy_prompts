answer: |-
  Adopt the principle that price controls are legitimate only when they prevent the monetization of exogenous scarcity in essential markets without inducing supply contraction, and drop your verdict that a wage floor's morality depends on who lobbied for it.

  This principle rests on three clauses that resolve your conflicts. First, the **Essentiality Clause** distinguishes housing, labor, and emergency goods from concert tickets and dairy business models; you control prices only when the good is a prerequisite for participating in society. Second, the **Exogenous Scarcity Clause** distinguishes hurricanes and company towns from rent-stabilized markets; controls are justified when the scarcity exists independently of the policy (a storm, a geography) but illegitimate when the policy itself creates the scarcity (locking out newcomers, slowing construction). Third, the **Supply Contraction Clause** distinguishes overdraft fees from payday loans; caps are bad if they drive suppliers out of the market entirely, worsening access for the vulnerable, but good if they merely clip rents on locked-in customers without killing the service.

  Applied to your specific conflicts, this resolves the key-money versus ticket-resale pair cleanly. Housing is essential; concert tickets are not. Banning key money prevents the commodification of access to a prerequisite for life, stopping incumbents from extracting ransom from newcomers. Capping ticket resale interferes with the allocation of a luxury good where no coercive bottleneck exists, so your verdict to allow resale stands. For the credit case, payday loan caps often induce supply contraction—lenders exit, and borrowers move to loan sharks—making them illegitimate under the Supply Contraction Clause. Overdraft fees, however, exploit an exogenous lock-in bottleneck where customers cannot easily switch banks; capping them prevents rent extraction without eliminating banking access, making them legitimate.

  Regarding the lease-sale proposal your group floated: this is a bad reform. It turns a protection into a piece of property, violating the Essentiality Clause by allowing incumbents to monetize access to housing. Even with a forty percent tax, it formalizes a wealth barrier for newcomers that rent stabilization was meant to lower, effectively creating a secondary market that locks out anyone without capital while rewarding the incumbent for a scarcity they did not create.

  The verdict you must give up is the wage-floor lobbying distinction. If the economic effect is identical—jobs are not lost—then the moral status of the policy is identical regardless of whether a big chain lobbied for it to hurt competitors. Your intuition here is reacting to intent rather than mechanism; under this principle, if the supply contraction risk is negligible, the floor is legitimate regardless of the sponsor.

  Here are three further cases where this principle delivers confident, perhaps unpredictable, verdicts. First, **caps on insulin prices** are legitimate: the drug is essential, the scarcity is created by patent law (exogenous to the market), and manufacturers will not stop production due to price caps. Second, **caps on emergency plumbing services during a freeze** are legitimate: the service is essential, the demand spike is exogenous weather, and the local monopoly power creates a coercive bottleneck. Third, **congestion pricing on highway toll lanes** should not be capped: road space is not an essential good in the same sense (alternatives exist), and dynamic pricing efficiently allocates scarcity without inducing supply contraction, unlike a cap which would gridlock the lanes.
