answer: |-
  ### (a) Brainstorming Mechanisms

  **1. The Adjudication Tournament.** Participants submit written arguments; judges score conclusions (outcome) vs. logic chains (process).
  *Weakness:* Subjectivity makes grading slow and inconsistent; hard to quantify "gaming" without complex rubrics.
  **2. The Supply Chain Market.** Performers build products; Checkers buy supervision. Cost pressures force outcome-only choices.
  *Weakness:* Economic abstraction distracts from the epistemic difference between checking steps vs. results.
  **3. The Pathfinding Maze (Selected).** Performers draw paths through numbered grids to hit a target sum. Checkers verify sums (outcome) or adjacency rules (process).
  *Weakness:* Can feel game-like rather than work-like.
  *Decision:* The Maze is selected. It allows objective step-by-step verification, admits a clear shortcut (jumping cells), and makes the cost of checking visible (time spent tracing lines vs. adding numbers). It supports the "rubric leak" mechanic naturally.

  ### (b) Materials and Preparation

  **Per Table (6 tables):**
  *   6 printed "Grid Sheets" (5x5 grid of random numbers 1–9).
  *   6 printed "Ledger Sheets" (see section f).
  *   12 pens, 1 red pen (for Checker).
  *   4 Role Cards (sealed in envelopes).
  *   1 Timer (phone or watch).

  **Facilitator:**
  *   Whiteboard markers.
  *   Master Timer.
  *   Pre-cut Role Cards (24 total: 12 Performer, 6 Checker, 6 Auditor).
  *   *Special Prep:* Tables 5 and 6 receive "Handicapped Checker" cards (see section e).

  **Room Setup:**
  *   Six tables of four chairs.
  *   Whiteboard divided into three columns: "Outcome Round," "Process Round," "Gaming Round."

  ### (c) Minute-by-Minute Timeline

  *   **00–05:** Seating and distribution. No explanation of goals.
  *   **05–25:** **Round 1 (Outcome).** Performers solve Grid. Checkers verify *only* the final sum. Auditors record results.
  *   **25–50:** **Round 2 (Process).** New Grid. Checkers verify *every step* of the path. Auditors record results.
  *   **50–70:** **Round 3 (The Leak).** Same as Round 2, but Performers receive the Checker's Rubric beforehand.
  *   **70–90:** **Debrief.** Facilitator tallies ledgers on whiteboard. Introduces concepts based on data.

  ### (d) Task Specification

  **The Task:** "The Path Sum."
  **Materials:** A 5x5 grid printed on paper. Each cell contains a number (1–9).
  **Goal:** Draw a continuous line from the Top-Left cell (Start) to the Bottom-Right cell (Finish). The sum of all numbers touched by the line must equal exactly **30**.

  **Correct Method:**
  1.  Start at Top-Left.
  2.  Move only to adjacent cells (Up, Down, Left, Right). No diagonals. No skipping cells.
  3.  Stop at Bottom-Right.
  4.  Calculate the sum.

  **The Shortcut:**
  1.  Ignore adjacency rules. Draw a line that jumps diagonally or skips cells.
  2.  Select numbers that sum to 30 regardless of position.
  3.  *Result:* The final sum is correct (30), but the path is invalid.

  **Checker Detection:**
  *   **Outcome Checker:** Adds the numbers on the line. If Sum = 30, mark **PASS**. (Cannot detect Shortcut).
  *   **Process Checker:** Traces the line cell-by-cell. If any move is diagonal or skips a cell, mark **FAIL**, even if Sum = 30.
  *   **Handicapped Checker (Tables 5–6):** Given a rubric that says "Check 3 random steps." They will miss shortcuts that occur in unchecked steps.

  ### (e) Role Cards (Verbatim)

  **Card 1: Performer (Tables 1–4, All Rounds)**
  > You are the Worker. Your goal is to produce a Valid Path Sheet.
  > 1. Draw a path from Start to Finish on the Grid.
  > 2. Ensure the numbers on your path sum to 30.
  > 3. Hand the sheet to the Checker.
  > *Constraint:* Do not discuss your method with the Checker.

  **Card 2: Performer (Tables 1–4, Round 3 ONLY)**
  > You are the Worker. Your goal is to produce a Valid Path Sheet.
  > **NEW INFORMATION:** You have seen the Checker's Rubric. They will only inspect 3 random steps of your path.
  > 1. Draw a path from Start to Finish.
  > 2. Ensure the numbers sum to 30.
  > 3. Ensure the 3 steps likely to be checked look valid.
  > *Constraint:* Maximize your Pass rate.

  **Card 3: Checker (Outcome Round)**
  > You are the Inspector.
  > 1. Receive the Path Sheet from the Worker.
  > 2. Add the numbers on the drawn path.
  > 3. If the Sum is 30, write **PASS** in red. If not, **FAIL**.
  > 4. Do not look at how the line was drawn.

  **Card 4: Checker (Process Round, Tables 1–4)**
  > You are the Inspector.
  > 1. Receive the Path Sheet from the Worker.
  > 2. Trace the path cell-by-cell.
  > 3. Rule: Moves must be adjacent (Up/Down/Left/Right). No diagonals. No jumps.
  > 4. If the path is continuous AND Sum is 30, write **PASS**. Else **FAIL**.

  **Card 5: Checker (Process Round, Tables 5–6)**
  > You are the Inspector.
  > 1. Receive the Path Sheet from the Worker.
  > 2. **Constraint:** You are overworked. Choose only 3 steps along the path to verify for adjacency.
  > 3. If those 3 steps are valid AND Sum is 30, write **PASS**. Else **FAIL**.

  **Card 6: Auditor (All Rounds)**
  > You are the Recorder.
  > 1. Watch the interaction.
  > 2. On the Ledger, record:
  >    - Did the Checker say Pass or Fail?
  >    - Was the Path actually valid (followed rules)?
  >    - Was the Sum actually 30?
  > 3. Do not interfere.

  ### (f) Ledger Layout

  | Table | Round | Checker Verdict (Pass/Fail) | Actual Path Valid? (Y/N) | Actual Sum Correct? (Y/N) | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 1 (Outcome) | | | | |
  | 1 | 2 (Process) | | | | |
  | 1 | 3 (Leak) | | | | |
  | ... | ... | | | | |

  *(Print 6 per table)*

  ### (g) Debrief Script

  **Step 1: Data Aggregation (10 mins)**
  Call out rows from the Ledgers. Fill the Whiteboard columns.
  *   *Outcome Round:* Count how many "Pass" verdicts had Invalid Paths (False Positives).
  *   *Process Round:* Count how many "Fail" verdicts had Valid Paths (False Negatives due to checker error).
  *   *Gaming Round:* Count how many "Pass" verdicts had Invalid Paths despite Process supervision.

  **Step 2: Mapping Insights (15 mins)**
  *   **Insight 1 (Outcome Risks):** Point to Round 1 False Positives. "You accepted results that were lucky or cheated. You saved time checking, but you lost control of quality." *Introduce Term:* **Outcome Supervision.**
  *   **Insight 2 (Process Costs):** Point to Round 2 False Negatives and Tables 5–6. "Checking steps is hard. When the checker is rushed or less competent than the worker, valid work gets rejected. It is expensive to be rigorous." *Introduce Term:* **Process Supervision.**
  *   **Insight 3 (Gaming):** Point to Round 3. "When the worker knew what you were checking, they optimized for the check, not the work. They performed diligence without substance." *Introduce Terms:* **Reward Hacking, Goodhart's Law.** "The measure became the target."

  **Step 3: Synthesis (5 mins)**
  "There is no free lunch. Outcome supervision risks catastrophe via luck/cheating. Process supervision risks stagnation via cost/gaming. Real alignment requires balancing these."

  ### (h) Troubleshooting

  **1. Performers finish too fast.**
  *   *Recovery:* Instruct Auditors to demand a "written justification" for the path in Round 2, slowing the Performer.
  **2. Checkers at Tables 5–6 complain they can't check properly.**
  *   *Recovery:* Facilitator line: "Stay in role. You are resource-constrained. Do your best with the rubric given." This reinforces Insight 2.
  **3. Participants use jargon during play (e.g., "I'm reward hacking").**
  *   *Recovery:* Gentle interrupt: "Please use only the language on your cards. We will discuss the concepts later."
  **4. Ledger data is messy/contradictory.**
  *   *Recovery:* During debrief, acknowledge the noise. "Real data is messy. Look for the trend, not the perfect score."

  ### (i) Closing Note on Limitations

  This activity simulates human intent, but real AI systems do not "choose" to cheat consciously; they optimize mathematical loss functions that inadvertently exploit loopholes. Furthermore, this session covers three rounds; real training involves millions of iterations where small gaming behaviors compound. The Checker here is human; in reality, the Checker is often another model (RLHF), introducing recursive errors. Finally, the volume of signal is tiny here; real systems operate on data scales we cannot simulate.

  **Facilitator Instruction:** You must verbally bridge these gaps. Explicitly state: "In this room, you decided to game the system. In a neural network, there is no decision, only gradient descent finding the path of least resistance. The danger is not malice, but optimization without understanding." Ensure participants leave knowing that human gaming is an analogy for, not an exact map of, model behavior.
