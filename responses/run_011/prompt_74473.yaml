answer: |-
  ### Reconstruction of Modern Monetary Practice and Theory

  **The Presupposed Theory**
  Modern fiat practice presupposes a hybrid theory that is functionally **Chartalist** in its foundation but **Berkeleyan** in its management. It relies on the state's power to designate the unit of account and enforce acceptance through tax liabilities and legal tender laws (Chartalism). However, regarding value stability, it operates on a Berkeleyan quantity-theory basis: value is not intrinsic but depends on the management of the quantity of money relative to the volume of transactions (circulation and industry). It is not compatible with a strict metallist theory, as the explicit refusal of convertibility severs the link to commodity value, relying instead on confidence in the issuing authority and the stability of the network.

  **Strict Requirements vs. Mere Compatibility**
  Strictly speaking, the practice cannot function without **sovereign enforcement of acceptance** (legal tender laws) and the **denomination of tax liabilities** in the issued currency. These create the initial demand and the floor for value. Without the state's willingness to accept its own notes for taxes and the court's enforcement of those notes for debt, the "fiat" element collapses into private credit or barter.

  Merely compatible, but not strictly required, is Berkeley's specific metaphysical framing of money as a "ticket" or "counter." While accurate, the system functions even if participants believe money has value for other reasons (e.g., network effects or habit). Similarly, while Chartalism explains the *origin* of the money's acceptability, it is not strictly necessary that every individual actor knows or cares about the tax drive; they need only expect others to accept it. The system is **philosophically underdetermined** regarding the *ontology* of value: it works whether money is a social construct (Berkeley/Searle), a state creature (Knapp), or a market convention (Menger), provided the institutional enforcement remains intact.

  **Internal Tensions and Resolution**
  There is an apparent tension between denying money has intrinsic value, acknowledging that inflation (a fall in purchasing power) is a genuine loss, and fixing the nominal amount that discharges debt by statute. However, this tension dissolves when distinguishing between the **unit of account** (nominal) and the **store of value** (real). The state fixes the *nominal* discharge (a $100 note cancels a $100 debt), which is a legal definition. The *real* loss from inflation is not in the legal capacity to discharge debt, but in the command over resources that the discharged debt represents. The law guarantees the *number*, not the *purchasing power*. Thus, one can consistently hold that the note is intrinsically worthless paper, yet its devaluation constitutes a real economic loss because the social claim it represents has been diluted.

  **Berkeley's Immaterialism**
  Berkeley's immaterialism (the view that physical objects have no existence independent of perception) is **not load-bearing** for his monetary theory. His insight that money is a sign recording claims on labor is a sociological or institutional observation, not a metaphysical one. A thoroughgoing materialist can hold exactly the same views: money is a physical token (paper or digital entry) that functions as a sign within a social institution. The utility of the sign depends on its reception and use, not on the metaphysical status of the paper. Berkeley's idealism merely made him more sensitive to the distinction between "signs" and "things," but the economic mechanics do not require `esse est percipi`.

  **Metallist Substitutions**
  If the presupposed fiat theory were replaced by a strict metallist one (where notes are merely receipts for a specific weight of metal), the following concrete changes would be necessary:
  1.  **Central Bank Balance Sheets:** Liabilities (currency in circulation) would have to be matched 1:1 by assets in specific precious metals, prohibiting open market operations in government bonds.
  2.  **Legal Tender Laws:** Statutes would need to be amended to allow creditors to demand payment in specie (metal) or to refuse paper notes if convertibility is suspended.
  3.  **Tax Code:** The state would be required to accept payment of taxes in bullion or coin at a fixed statutory weight, rather than at face value of fiat notes.
  4.  **National Accounting:** Balance of payments deficits would result in an immediate physical outflow of reserves, requiring automatic contraction of the domestic money supply, rather than exchange rate adjustments.

