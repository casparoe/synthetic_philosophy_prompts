answer: |-
  **1. Diagnosis of Difficulty**

  The core difficulty lies not in the arithmetic, but in distinguishing mathematical equivalence from causal explanation. Students often conflate the two-level partition (which is an algebraic identity) with the substantive claim of group selection (which requires group-level heredity). A fluent but wrong answer will argue that because the kin-selection and multilevel-selection formulations yield the same numerical prediction in this specific case, the dispute is merely verbal. The excellent answer will recognize that while the *accounting* is identical here due to perfect assortment by kinship, the *explanations* diverge when the mechanism of group formation changes. The trap is to treat the covariance partition as a causal theory rather than a descriptive tool.

  **2. Examination Question**

  **Question 4 (25 Marks)**

  **Scenario:**
  Consider a hypothetical seed beetle. Each female lays a clutch of ten eggs in a single fallen fruit and dies. Larvae develop inside the fruit, emerge, and mate at random in a common dispersal pool. There is one diploid locus with alleles A and B. Mating is random, there is no dominance, mutation, or migration, and development is density-independent.

  Larvae carrying allele A bore a shared exit tunnel used by all ten occupants of the fruit.
  *   **Baseline:** Every larva has a baseline survival value of 2.0 adults.
  *   **Benefit:** Each A larva's tunnelling raises the fruit's *total* yield by 1.6 larvae. This increment is shared equally among all ten occupants.
  *   **Cost:** Each A larva pays a private cost of 0.6.

  Because a clutch is laid by a single mated female, fruit composition is fixed by the mother's genotype:
  *   **AA mother:** Fruit contains 10 A larvae.
  *   **AB mother:** Fruit contains 5 A and 5 B larvae.
  *   **BB mother:** Fruit contains 10 B larvae.

  In the parental generation, allele A is at frequency $p = 0.20$ among 1,000 fruit-colonising females. This yields 40 AA fruits, 320 AB fruits, and 640 BB fruits.

  **(a)** Calculate the per-larva fitness for each genotype within each fruit type (AA, AB, BB). Using these values, derive the total number of A and B offspring produced in the next generation. Confirm that while B outproduces A within mixed (AB) fruits, the frequency of A rises in the total population to $p' \approx 0.215$. **[8 marks]**

  **(b)** Two students interpret these results differently.
  *   **Student 1:** "This is group selection. Fruits with more A larvae produce more total offspring, and this between-fruit advantage outweighs the disadvantage A suffers within mixed fruits."
  *   **Student 2:** "Nothing happens at the level of the fruit. Every A larva shares its fruit with nine full siblings. This is gene-level selection with kin assortment."
  Do these claims conflict? Explain what each student is committed to regarding the cause of the frequency change. **[7 marks]**

  **(c)** The two-level covariance partition is an algebraic identity; it must sum to the total change in frequency. Hamilton's rule also predicts the direction of change correctly here. Does it follow that the disagreement in (b) is merely verbal? Defend your answer. Describe a modification to the beetle case concerning how group structure is transmitted across generations in which the two readings would no longer be two ways of describing the same causal process. **[10 marks]**

  **3. Model Answer**

  **(a) Arithmetic and Frequency Change**
  First, we determine the fitness per larva. The shared benefit per A actor is $1.6 / 10 = 0.16$ per occupant.
  *   **AA Fruits (10 A):** Each A receives benefit from 10 actors ($10 \times 0.16 = 1.6$). Cost is 0.6. Fitness $w_A = 2.0 + 1.6 - 0.6 = 3.0$.
      *   Total offspring: $40 \text{ fruits} \times 10 \text{ larvae} \times 3.0 = 1,200$ (all A).
  *   **AB Fruits (5 A, 5 B):** Total benefit is $5 \times 1.6 = 8.0$, shared among 10 ($0.8$ each).
      *   $w_A = 2.0 + 0.8 - 0.6 = 2.2$.
      *   $w_B = 2.0 + 0.8 - 0 = 2.8$.
      *   Total A offspring: $320 \text{ fruits} \times 5 \text{ A} \times 2.2 = 3,520$.
      *   Total B offspring: $320 \text{ fruits} \times 5 \text{ B} \times 2.8 = 4,480$.
  *   **BB Fruits (10 B):** No benefit, no cost. $w_B = 2.0$.
      *   Total offspring: $640 \text{ fruits} \times 10 \text{ larvae} \times 2.0 = 12,800$ (all B).

  **Totals:**
  *   Total A offspring: $1,200 + 3,520 = 4,720$.
  *   Total B offspring: $4,480 + 12,800 = 17,280$.
  *   Total Population: $22,000$.
  *   New Frequency $p' = 4,720 / 22,000 \approx 0.2145$.

  **Comparison:**
  Within AB fruits, $w_B (2.8) > w_A (2.2)$, so B is favoured locally. However, $p$ increases from 0.20 to 0.215 globally. The within-fruit disadvantage is overwhelmed by the higher productivity of AA fruits compared to AB and BB fruits.

  **(b) Interpretations**
  The claims do not conflict empirically; both describe the same numerical change. However, they are committed to different causal structures. Student 1 (Group Selection) is committed to the claim that the *fruit* is a unit of selection: variance in group productivity drives the change, and the within-group disadvantage is a counteracting force. Student 2 (Kin Selection) is committed to the claim that the *individual gene* is the unit, and the change is driven by positive assortment (relatedness); the group structure is merely the mechanism of assortment. In this specific case, because group composition is determined entirely by maternal genotype, group variance and kin assortment are perfectly confounded. Both accounts are descriptively adequate here.

  **(c) Substantive vs. Verbal Dispute**
  It does not follow that the disagreement is merely verbal. While the two-level partition is an identity that always holds mathematically, "Group Selection" as a biological explanation requires more than between-group variance; it requires group-level heredity. In the current case, groups (fruits) do not reproduce; only individuals do. The group structure is a transient developmental container created by individual reproduction. Therefore, the kin-selection reading is causally primary: the assortment exists because of individual genealogy, not because groups are replicators.

  To make the readings distinct, we must modify the transmission of group structure. Suppose successful fruits did not just release larvae into a pool, but instead sent out a swarm of offspring that collectively colonized a new fruit together (group budding). In this modification, groups have heredity: successful groups produce new groups. Now, the Group Selection reading becomes substantively distinct: it explains the change via differential reproduction of group lineages. The Kin Selection reading would still apply to individuals within the swarm, but it would not capture the group-level replication process. Conversely, if groups formed randomly (no kinship) but still reproduced, Kin Selection would predict no spread ($r=0$), while Group Selection could predict spread if group variance persisted. Thus, the dispute is substantive because the theories make different demands on the population structure (group heredity vs. individual relatedness), even if their accounting equations coincide in special cases like the original beetle scenario.

  **4. Marking Scheme**

  1.  **Correct Fitness Calculations (AA, AB, BB):** 2 marks. (Botch: Forgetting to share the benefit among all 10, or forgetting the private cost).
  2.  **Correct Offspring Totals (A and B):** 2 marks. (Botch: Multiplying fruit count by per-larva fitness but forgetting the number of larvae per fruit).
  3.  **Identification of Within/Between Conflict:** 2 marks. (Botch: Noting A rises but failing to explicitly state B wins within mixed fruits).
  4.  **Conflict Analysis (Empirical vs. Causal):** 2 marks. (Botch: Claiming one student is factually wrong rather than offering different explanations).
  5.  **Commitment Identification:** 2 marks. (Botch: Failing to specify that Student 1 requires group-level causality and Student 2 requires individual-level assortment).
  6.  **Verbal Dispute Diagnosis:** 3 marks. (Botch: Concluding the dispute is merely verbal because the math is identical).
  7.  **Modification Proposal (Group Heredity):** 4 marks. (Botch: Changing payoff numbers or relatedness values rather than transmission structure).
  8.  **Explanation of Distinction:** 8 marks. (Botch: Failing to explain why the modification makes one reading causally inadequate).
      *(Note: Marks 7 and 8 are weighted heavily as the crux. Total 25)*.

  **5. Discrimination Section**

  **First-Class vs. Good:**
  A good answer will correctly perform the arithmetic and note that both models predict the same outcome. A first-class answer will explicitly distinguish between the *partitioning of variance* (which is always possible) and the *existence of group-level heredity* (which is contingent). It will identify that the original case lacks group heredity, making the "group selection" label causally thin, and will propose a modification (like group budding) that introduces genuine group replication.

  **Seductive Wrong Answer:**
  The most seductive error is the "Mathematical Identity" argument. The student argues: "Since the Price equation is an identity, the between-group term must equal the kin-selection term. Therefore, choosing one over the other is just a preference in language." This fails because it conflates accounting with mechanism. The inference fails at the point where population structure changes: the identity holds, but the causal explanation (kinship vs. group replication) determines which term represents a real evolutionary force versus a statistical artifact.

  **6. Time Check**

  Fifty-five minutes is tight but realistic for a strong student. The arithmetic in Part (a) requires care (approx. 15 minutes). Part (b) is conceptual but straightforward (15 minutes). Part (c) requires careful philosophical reasoning and constructing a counterfactual case (25 minutes). I would not cut content; the arithmetic is necessary to ground the philosophical claims. However, providing the $p'$ value in the question text is essential to prevent arithmetic errors from cascading into the conceptual sections.
