answer: |-
  # Examination Question

  **Course:** Advanced Strategic Analysis & Combinatorial Game Theory
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1**

  **Part I: The Combinatorial Result**
  Consider a finite two-player game of perfect information in which players alternately claim unclaimed elements of a common board. Both players aim to occupy some member of a shared family of winning sets, and that family is closed upward under the addition of further elements (i.e., if a set is winning, any superset is also winning). In this setting, the second player cannot have a winning strategy. The argument proceeds by contradiction: if the second player had a winning strategy, the first player could claim an arbitrary element, thereafter follow her strategy, and, whenever it names an element he already holds, claim anything at all, since his extra element can only help. The exact force of the conclusion is that the first player is guaranteed not to lose, which amounts to a win only where draws are impossible (as in games of the Hex type); moreover, the argument establishes that a winning strategy exists without exhibiting one.

  **Part II: The Vignette**
  Two autonomous negotiating agents, MERCER and HALYARD, compete for thirty anchor supply agreements in a consortium procurement market, alternating offers. Whoever holds any eleven of a designated subset of agreements, or any superset of such a set, becomes the market's de facto standard-setter and captures the surplus. MERCER operates without constraints. HALYARD operates under a public, machine-verifiable charter excluding three classes of move: misrepresenting future pricing to a counterparty; purchasing exclusivity through side payments; and threatening retaliation in an unrelated joint venture. Three further features of the setting matter. (a) A small number of the agreements carry onerous continuing service obligations, so that holding them is a net liability even though they count toward the threshold, and HALYARD must make an offer in every round and may not abstain. (b) The charter is common knowledge and verifiable, so counterparties model HALYARD as unable to execute the excluded retaliatory threat, and agreements MERCER secures by implicit threat are unavailable to HALYARD even in principle. (c) HALYARD observes MERCER's moves but not MERCER's plan, which adapts to HALYARD's behaviour. HALYARD's developers nonetheless assert that the charter costs them nothing competitively: every course of action open to MERCER is open to HALYARD apart from the excluded moves; a player whose options are at least as ample as an opponent's can mimic that opponent and add to it; additional options can never hurt; therefore MERCER cannot be guaranteed to win, and HALYARD is at worst not behind.

  **Part III: Sub-questions**
  1.  State the theorem's premises and the precise force of its conclusion. [5 marks]
  2.  Reconstruct the developers' inference as an explicit chain and identify the analogy between theorem and case that it presupposes. [4 marks]
  3.  Say, for each of features (a), (b), and (c), which premise or which step of the analogy it undermines and whether the damage is fatal or merely weakening. [9 marks]
  4.  State the weakest claim about HALYARD that survives the vignette intact, together with one further assumption that would restore the developers' original conclusion. [4 marks]
  5.  Construct a minimal abstract game, containing no firms or agents, in which a player is strictly better off with a smaller set of options, explaining why that example does not refute the theorem. [3 marks]

  ***

  # Marking Scheme

  **Total Marks: 25**

  1.  **Theorem Premises & Conclusion (5 marks)**
      *   *Required:* Identification of finite, perfect information, alternating play, and **upward-closed winning sets (monotonicity)**. Conclusion must state **Second Player cannot win** (First Player guaranteed not to lose) and is **non-constructive**.
      *   *Common Error:* Supposing that the theorem's conclusion flips so that MERCER is guaranteed to win (confusing 1st player advantage with opponent guarantee).

  2.  **Developers' Inference & Analogy (4 marks)**
      *   *Required:* Chain: Options(H) $\supseteq$ Options(M) $\rightarrow$ Mimicry possible $\rightarrow$ Extra options harmless $\rightarrow$ H not behind. Analogy: Maps "available moves" to "board elements" and "charter restrictions" to "strategy constraints."
      *   *Common Error:* Treating the developers' claim as an instance of the theorem rather than an analogical transfer of it.

  3.  **Feature (a) Analysis (5 marks)**
      *   *Required:* Identifies **zugzwang** / violation of **value monotonicity**. The "extra element helps" step fails because liabilities reduce position value. Damage is **fatal** to the mimicry argument.
      *   *Common Error:* Locating the damage from feature (a) in the win predicate rather than in the ordering of positions by value.

  4.  **Feature (b) Analysis (4 marks)**
      *   *Required:* Identifies **commitment value**. Public verability makes restrictions credible, potentially gaining concessions. Damage is **weakening** to the "cost" assumption, not necessarily fatal to competitiveness.
      *   *Common Error:* Treating feature (b) purely as cost while missing that a publicly verifiable inability to deviate can be strategically advantageous in games where commitments are observed.

  5.  **Weakest Claim & Restoring Assumption (4 marks)**
      *   *Required:* Claim: HALYARD is not behind **only if** position values are monotonic (no liabilities). Assumption: Remove onerous obligations or allow abstention.
      *   *Common Error:* Conflating a restriction on HALYARD's permissible moves with a failure of monotonicity in the value of positions.

  6.  **Abstract Game Example (3 marks)**
      *   *Required:* Example: **Zugzwang position** (e.g., normal play game where passing is forbidden and any move loses). Explanation: Does not refute theorem because theorem **requires monotonicity/upward-closure** which this game violates.
      *   *Common Error:* Failing to explain why the example does not refute the theorem (i.e., failing to cite the violated premise).

  **Distinction Criteria**
  A first-class answer distinguishes itself from a competent second-class one by three specific moves. First, it treats the developers' argument as an analogical transfer subject to structural validation, rather than a direct application of the theorem. Second, it locates the failure of Feature (a) in the monotonicity of position *value* rather than the definition of the win condition. Third, it recognizes Feature (b) as a potential strategic asset (commitment) rather than a pure constraint cost. Second-class answers typically identify the errors but fail to articulate the underlying structural premises (monotonicity, non-constructiveness) that govern them.

  ***

  # Model Answer

  The combinatorial theorem rests on four premises: the game is finite, has perfect information, involves alternating claims on a common board, and features winning sets that are upward-closed under addition. The conclusion is strictly that the second player cannot possess a winning strategy; consequently, the first player is guaranteed not to lose. In games where draws are impossible, this guarantees a first-player win. Crucially, the proof is non-constructive: it establishes the existence of a winning strategy for the first player without exhibiting it.

  The developers' inference chains three assertions. First, HALYARD's available moves are a superset of MERCER's effective moves (excluding only "useless" threats). Second, a player with broader options can mimic an opponent's strategy while holding a spare element. Third, additional options cannot reduce a player's payoff. The analogy presupposes that the negotiation market maps directly to the combinatorial board: agreements correspond to board elements, and the charter corresponds to a strategy constraint that does not violate the upward-closure of value.

  Feature (a) undermines the step that "additional options can never hurt." The onerous obligations introduce liabilities, creating positions where holding more agreements reduces net value. This is a classic zugzwang structure. The damage is fatal to the developers' logic because the strategy-stealing argument relies on the extra element being neutral or beneficial. If the extra element is harmful, the first player (HALYARD, in the mimicry role) cannot safely claim the arbitrary opening element. The error lies not in the win predicate—which remains upward-closed regarding the threshold of eleven—but in the ordering of positions by value.

  Feature (b) undermines the assumption that excluded moves are purely costly. Because the charter is machine-verifiable common knowledge, HALYARD's inability to threaten retaliation functions as a credible commitment. In strategic settings, binding oneself to refrain from certain actions can induce cooperation from counterparties who fear the unconstrained agent. Thus, the restriction may enhance rather than diminish HALYARD's position. This damage is weakening to the developers' cost-benefit analysis but suggests their conclusion might hold for reasons they failed to articulate.

  Feature (c) highlights an information asymmetry regarding plans versus moves. While HALYARD observes moves, the adaptive nature of MERCER's plan implies the game is not strictly one of perfect information regarding intentions. However, since the combinatorial theorem requires only perfect information regarding the state (moves), this is merely weakening to the analogy, not fatal, provided the state space remains fully observable.

  The weakest claim surviving intact is that HALYARD is guaranteed not to lose only if the value of positions is monotonic with respect to agreement holdings. To restore the developers' original conclusion, one must assume away the onerous obligations or permit HALYARD to abstain from making offers in rounds where no beneficial agreement is available.

  A minimal abstract game where fewer options are better is a normal-play game on a single pile of size one, where the only move is to take the object and lose (a misere condition disguised as normal play, or simply a zugzwang position). If Player A must move and has two moves, both leading to loss, while Player B (hypothetically) could pass, Player B wins. This does not refute the theorem because the theorem explicitly requires winning sets to be upward-closed and assumes adding an element never harms the claimant. In the abstract counter-example, the value function is not monotonic; holding the object is detrimental. Thus, the premises of the theorem are not satisfied, and the conclusion does not apply. The theorem remains mathematically sound within its defined domain, while the developers failed to ensure the market scenario fell within that domain.
