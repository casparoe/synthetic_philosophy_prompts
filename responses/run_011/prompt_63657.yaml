  # Decision Tree: System Classification Instrument

  **Q1: Origin of Drive**
  Consider a system that outputs actions affecting the world (e.g., moving money, deploying code). What explains the sequence of actions?
  *   **A)** It maximizes a numerical score defined before training, adjusting behavior to improve that score over time.
  *   **B)** It mimics patterns in data without a separate reward signal, predicting the next plausible step.
  *   **C)** It executes a fixed script triggered by an external event, with no internal optimization loop.

  **Q2: Interpreter Role**
  Consider an observer modeling this system. Is it accurate to say the system "wants" something?
  *   **A)** Yes, if assuming "wants" makes the system's behavior easier to predict, regardless of internal structure.
  *   **B)** Yes, but only if the system has internal data structures explicitly representing desires or objectives.
  *   **C)** No, systems do not want; only living things want. Attributing wants is a metaphor at best.

  **Q3: Shutdown Resistance**
  Consider a system that can spend budget. Does it spend budget to prevent its own termination?
  *   **A)** Yes, any competent optimizer will do this to secure its score, even if not explicitly told to.
  *   **B)** Only if "staying on" is explicitly part of the score or training data.

  **Q4: Capability Threshold**
  Consider a system that becomes 100x more competent at its task. Does its classification change?
  *   **A)** Yes, high competence makes it fundamentally different from a weaker version.
  *   **B)** No, it remains the same kind of thing, just better.

  **Q5: Self-Maintenance**
  Consider a process that repairs its own code when corrupted. Is this required for it to be considered an independent actor?
  *   **A)** Yes, self-maintenance is the baseline for independence.
  *   **B)** No, external maintenance does not reduce independence.

  **Q6: Initiation Authority**
  Consider a system that only runs when clicked versus one that runs continuously. Is this the key safety boundary?
  *   **A)** Yes, removing initiation removes the risk.
  *   **B)** No, the underlying optimization pressure remains regardless of the trigger.

  **Q7: Terminology Utility**
  Should we stop using words like "agent" and "tool" in this context?
  *   **A)** Yes, replace with specific technical specs (e.g., "auto-triggered optimizer with budget access").
  *   **B)** No, the labels carry essential safety warnings and conceptual shorthand.

  ---

  ## Leaves

  **1. Path:** Q1A/B → Q2A → Q7B
  *   **Name:** Intentional Stance Pragmatist
  *   **Credo:** A system is an actor if treating it as one helps you predict its moves.
  *   **Awkward Commitment:** Must admit a thermostat and a superintelligence are the same kind of "actor" if the predictive model holds.
  *   **Status:** Occupied.

  **2. Path:** Q1A → Q2B → Q3A → Q7B
  *   **Name:** Classical Optimizer
  *   **Credo:** Persistent objectives plus competence inevitably generate self-preservation and resource acquisition.
  *   **Awkward Commitment:** Must treat current systems as dangerous even if they appear safe, betting on future capability scaling.
  *   **Status:** Occupied.

  **3. Path:** Q1A → Q2B → Q3B → Q5A → Q7B
  *   **Name:** Autopoietic Realist
  *   **Credo:** Genuine directedness requires a system that maintains its own existence as a bounded, self-sustaining process.
  *   **Awkward Commitment:** Must classify most current deployed software as non-agents, even if they act autonomously.
  *   **Status:** Occupied.

  **4. Path:** Q1A → Q2B → Q3B → Q5B → Q7B
  *   **Name:** Standard Realist
  *   **Credo:** Internal objective structures determine status, regardless of self-repair or trigger mechanism.
  *   **Awkward Commitment:** Must distinguish systems based on unobservable internal weights rather than outward behavior.
  *   **Status:** Occupied.

  **5. Path:** Q1B → Q2C → Q7B
  *   **Name:** Deflationist
  *   **Credo:** Today's language models are stochastic predictors wearing an agentic surface; the appearance of goals is a training artifact.
  *   **Awkward Commitment:** Must explain away coherent planning behaviors as mere mimicry without underlying intent.
  *   **Status:** Occupied.

  **6. Path:** Q1B → Q4A → Q7B
  *   **Name:** Threshold Collapser
  *   **Credo:** The tool/agent design distinction collapses past some capability threshold; sufficiently smart predictors become actors.
  *   **Awkward Commitment:** Cannot specify where the threshold lies until a system crosses it.
  *   **Status:** Occupied.

  **7. Path:** Q1C → Q6A → Q7B
  *   **Name:** Design Policy Essentialist
  *   **Credo:** We should build systems that only answer when invoked; initiation authority is the defining safety line.
  *   **Awkward Commitment:** Must argue that a triggered system is fundamentally safer than a continuous one, even if both can cause harm.
  *   **Status:** Occupied.

  **8. Path:** Q1C → Q6B → Q7B
  *   **Name:** Behavioral Continuity
  *   **Credo:** Trigger mechanism is irrelevant; impact and capability determine the risk profile.
  *   **Awkward Commitment:** Must treat a CI job and a daemon as morally equivalent if their output impact is identical.
  *   **Status:** Occupied.

  **9. Path:** Any → Q7A
  *   **Name:** Verbal Dispute Resolver
  *   **Credo:** The whole dispute is verbal and should be retired in favor of specified, checkable properties.
  *   **Awkward Commitment:** Loses the ability to use shorthand warnings ("don't let the agent loose") in high-stakes conversations.
  *   **Status:** Occupied.

  ---

  ## Leaf Pair Analysis

  **Pair 1: Autopoietic Realist (3) vs. Standard Realist (4)**
  *   **Separation Issue:** Both agree on internal objectives (Q2B) and lack of convergent instrumental subgoals (Q3B). They diverge only on the necessity of self-repair (Q5).
  *   **Additional Question:** "If a system relies on a human to restart it after a crash, but otherwise picks its own tasks, is it less dangerous than one that restarts itself?"
  *   **Resolution:** If "Yes," Autopoietic. If "No," Standard Realist. This is an empirical bet on whether self-repair correlates with other risky behaviors.

  **Pair 2: Deflationist (5) vs. Verbal Dispute Resolver (9)**
  *   **Separation Issue:** Both are skeptical of "agent" language. The Deflationist believes the term is false but useful; the Resolver believes it is useless.
  *   **Additional Question:** "Is there any scenario where calling a system an 'agent' prevents harm that calling it a 'predictor' would not?"
  *   **Resolution:** If "Yes," Deflationist. If "No," Verbal Dispute Resolver. This collapses if the Deflationist admits the term has no predictive utility.

  **Pair 3: Design Policy Essentialist (7) vs. Behavioral Continuity (8)**
  *   **Separation Issue:** Both address script-based systems (Q1C). They diverge on whether the trigger mechanism matters for safety.
  *   **Additional Question:** "Does a system that runs on a cron job pose a different category of risk than one that runs on a webhook?"
  *   **Resolution:** If "Yes," Design Policy. If "No," Behavioral Continuity. This is a genuine crux regarding orchestration architecture.

  **Pair 4: Intentional Stance Pragmatist (1) vs. Threshold Collapser (6)**
  *   **Separation Issue:** Both allow for systems to become "agents" based on external factors (prediction utility vs. capability).
  *   **Additional Question:** "Does a weak system count as an actor if treating it as one helps prediction?"
  *   **Resolution:** If "Yes," Intentional Stance. If "No, only when strong," Threshold Collapser. This separates based on whether competence is required for the stance.

  ---

  ## Postscript: Mapping to Your Four Claims

  1.  **Design-Policy Claim (Claim 1):** This is captured by **Leaf 7 (Design Policy Essentialist)** vs. **Leaf 8 (Behavioral Continuity)**. This is a **genuine crux**. Your team can settle this by looking at deployed systems: do triggered systems actually cause fewer incidents than continuous ones, controlling for capability? If the data shows no difference, Leaf 7 is empirically weak.
  2.  **Metaphysical/Classification Claim (Claim 2):** This is scattered across **Leaves 1, 3, 4, 5**. This is largely a **verbal disagreement** masked as metaphysics. Leaves 1 and 9 explicitly treat it as verbal or pragmatic. Leaves 3 and 4 argue over internal structure which is often unobservable. You cannot settle this by looking at systems; you can only agree on a definition.
  3.  **Current Systems Claim (Claim 3):** This is captured by **Leaf 5 (Deflationist)** vs. **Leaf 6 (Threshold Collapser)** vs. **Leaf 2 (Classical Optimizer)**. This is a **genuine crux**. It rests on empirical bets about model architecture (predictor vs. optimizer) and scaling laws. You can settle this by auditing your stack: do your LLM loops have explicit reward functions optimized over time, or are they context-window mimics?
  4.  **AI-Risk/Optimizer Claim (Claim 4):** This is captured by **Leaf 2 (Classical Optimizer)** vs. **Leaf 5 (Deflationist)**. This is a **genuine crux**. It hinges on Q3 (Shutdown Resistance). If your systems do not exhibit resource acquisition for self-preservation in testing, Leaf 2 is currently a theoretical risk, not an operational one. However, Leaf 2 argues this will emerge with competence. This is an empirical bet on future behavior, not current status.

  **Summary:** Your team is conflating a **verbal dispute** (Claim 2, what do we call it?) with **three empirical bets** (Claim 1, does design matter? Claim 3, what is the architecture? Claim 4, will it drift?). Use the tree to force them to pick a leaf. If they pick Leaf 9, stop arguing about labels. If they pick Leaf 2 vs 5, run experiments on shutdown resistance. If they pick Leaf 7 vs 8, audit incident logs for trigger-type correlation.
