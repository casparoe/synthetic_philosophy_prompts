answer: |-
  **Project Title:** Diachronic Validity and the Taxonomy of Constitutional Entrenchment

  **Research Question**
  Legal theory often treats conflicts between amendment rules as logical contradictions within a static system. This project asks: *Under what conditions does a conflict between amendment rules represent a genuine normative contradiction within a hierarchy, versus a shift in the criteria of validity across time?* Specifically, I seek to determine whether the apparent paradox of self-embracing entrenchment dissolves when we distinguish diachronic authority (what power the past has over the future) from hierarchical supremacy (which rule outranks another at a single moment). A successful answer will provide a diagnostic test capable of categorizing any amendment provision as either generating a logical conflict or merely updating the conditions for future validity.

  **The Problem and Existing Positions**
  The difficulty is illustrated by Article X of a hypothetical constitution. Paragraph (1) requires a supermajority and referendum for amendment. Paragraph (2) declares Paragraph (1) unamendable. Paragraph (3) reserves the electorate's power to adopt a new constitution by referendum. Standard analyses tend to stall here. One camp treats Paragraph (2) as generating a logical contradiction: if the constitution forbids amending the amendment rule, any attempt to amend it is void, yet the rule itself purports to be part of an amendable instrument. Another camp divides sovereignty into continuing and self-embracing conceptions, arguing that a legislature either can or cannot bind its successors.

  Both positions leave the specific question open rather than merely unresolved. They assume that the hierarchy of norms, once laid down, persists unchanged through time. They treat the conflict as hierarchical—which rule wins now?—when the actual tension is diachronic—does the rule adopted at Time 1 determine the validity of the rule adopted at Time 2? By tacitly assuming a static hierarchy, existing theories offer answers to the hierarchical question as solutions to the diachronic one. Consequently, they cannot explain why Article X(3) might validly override X(2) without declaring X(2) logically incoherent. The gap is not a lack of argument between rivals, but a category error shared by them: the conflation of rank with temporal sequence.

  **Method and Work Plan**
  The project proceeds over twelve months, divided into four phases of three months each.

  *Months 1–3: Taxonomy Construction.* I will construct a taxonomy of amendment-limiting provisions ordered by what exactly each purports to constrain. The categories will be: (1) *Agency* (who may change the rule); (2) *Content* (what subject matter is off-limits); (3) *Procedure* (what steps count as changing); and (4) *Recognition* (how a change is validated afterwards). I will map Article X onto this taxonomy: X(1) constrains Procedure and Agency; X(2) constrains Agency regarding Content; X(3) constrains Recognition. The output will be a structured matrix showing where conflicts typically arise.

  *Months 4–6: Developing the Conflict Test.* Using the taxonomy, I will formulate a test for deciding whether two provisions yield a genuine normative conflict or only an apparent one. The test will ask: Does the later rule attempt to violate a constraint currently in force, or does it alter the criteria by which the earlier rule's validity is assessed? I will apply this test iteratively to Article X. For instance, does a referendum under X(3) contradict X(2), or does it shift the recognition criteria such that X(2) is no longer the metric of validity? I will refine the test until it produces consistent results across varied hypothetical formulations.

  *Months 7–9: Stress-Testing and Defence.* I will subject the test to counterexamples drawn from comparative constitutional structures, focusing on cases where courts have declared amendments unconstitutional. I will specifically test the limits of the diachronic/hierarchical distinction. If the distinction collapses under pressure—for example, if a procedural change necessarily implies a hierarchical shift—I will revise the taxonomy. This phase involves drafting the core philosophical argument defending the distinction against the charge that it is merely verbal.

  *Months 10–12: Synthesis and Application.* The final quarter will be dedicated to writing the fellowship monograph. I will focus on translating the philosophical test into a practical diagnostic tool. The goal is to ensure the final output is not merely theoretical but applicable to textual analysis. I will conclude with a assessment of the project's limits and implications for broader theories of legal validity.

  **Defence of Method**
  Three obvious alternatives must be rejected. First, imposing a fixed hierarchy of norms assumes the answer it seeks to prove: that rank persists through time. This method cannot explain lawful constitutional replacement, as seen in Article X(3). Second, declaring the puzzles verbal dissolves the normative force of entrenchment clauses; it treats serious legal constraints as linguistic errors, which fails to account for judicial practice. Third, formalising rule-change in a dynamic logic risks letting the formalism settle the question. Logical systems often require static definitions of validity that cannot capture the fluidity of constitutional identity. My method prioritizes the conceptual structure of legal practice over formal consistency, acknowledging that validity criteria can change without contradiction.

  **Success, Failure, and Scope**
  A successful result looks like a checklist a constitutional court's clerks could apply to a text they had never seen. Given a new constitution with conflicting amendment rules, they should be able to use the taxonomy and test to determine whether a proposed amendment is void for contradiction or valid as a shift in validity criteria. The output will be a set of decision trees based on the four categories of constraint.

  Failure must be explicitly defined. The project fails if the diachronic/hierarchical distinction turns out to do no explanatory work. If applying the test to Article X yields the same result as simply assuming a static hierarchy, or if the distinction cannot accommodate Article X(3) without collapsing into incoherence, then the core suspicion is wrong. I will report this negative result candidly; demonstrating that the paradox is genuine and not merely categorical is a valuable philosophical outcome.

  Finally, a candid assessment of scope is necessary. Twelve months is sufficient to taxonomy amendment rules and test the diachronic hypothesis, but it is not sufficient to build a general theory of legal validity. To remain realistic, I must cut any attempt to ground the diachronic distinction in a broader metaphysics of time or identity. The project risks expanding into a general theory of validity if I attempt to explain *why* the criteria shift rather than *how* to identify when they have shifted. I will restrict the inquiry to the conditions of identification within the text and practice of amendment, leaving the ultimate source of validity to future work. This restriction ensures the project remains determinate and completable within the fellowship term.
