      *   The "Menu" theory. Different goods require different incentives.
  *   **Section 3: Forcing a Single Theory.**
      *   Lockean: Patent gets independent invention defense. Trade Secret becomes absolute.
      *   Utilitarian: Copyright term shrinks. Trade Secret abolished/limited.
