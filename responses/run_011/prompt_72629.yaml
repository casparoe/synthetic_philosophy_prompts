answer: |-
  This is one of the sharpest critiques of intellectual property jurisprudence I have encountered. You have correctly identified that the "IP Bundle" is not a monolith derived from a single philosophical premise. If you try to run Patent, Copyright, and Trade Secret law through a single filter of "Natural Rights" or "Utilitarianism," the system appears schizophrenic.

  However, it is not merely a collection of historical accidents. To reconcile them, we must abandon the search for a theory of **Ownership of Ideas** and replace it with a theory of **Governance of Intangibles.**

  Here is the charitable reconstruction of each regime, the argument for their coherence, and the thought experiment of forcing them into a single theoretical box.

  ### 1. Charitable Reconstruction: The Implicit Theory of Each

  You identified Patent as "staking a claim" and Copyright as "causal fact." Let's deepen those definitions to show how they avoid self-contradiction within their own domains.

  **Patent: The Contractual Bargain (Quid Pro Quo)**
  *   **The Theory:** This is not Lockean; it is Contractarian. The state cannot effectively tax or regulate invisible technical solutions once they are in products. So, the state offers a deal: "Give us the blueprint (disclosure), and we will give you a temporary monopoly (exclusion)."
  *   **Why Independent Invention Infringes:** If independent invention were a defense, the monopoly would be worthless. Competitors could simply claim "I thought of it too" (which is often unverifiable). To make the bargain valuable enough to induce disclosure, the right must be strict liability.
  *   **Why It Expires:** Because the *price* of the monopoly is the eventual release of the knowledge into the public domain. The clock starts ticking the moment the deal is signed.

  **Copyright: The Personality and Expression Theory**
  *   **The Theory:** This is Hegelian + Utilitarian. It posits that a work is an extension of the author's personality. You do not own the *idea* (e.g., "boy wizard goes to school"); you own the specific *expression* of that idea that emanates from your labor.
  *   **Why Independent Creation is a Defense:** Because copyright protects the *connection between author and work*. If I write the same novel without seeing yours, the work emanates from *my* personality, not yours. There is no theft of selfhood.
  *   **Why No Disclosure/Long Term:** Registration creates friction that discourages creation (bad for culture). Since the protection is narrow (only exact expression, not ideas), the state can afford to let it last longer without stifling future creators.

  **Trade Secret: The Ethics of Competition**
  *   **The Theory:** This is Tort Law, not Property Law. It does not presume you "own" the information in the abstract. It presumes you have a right to be free from *unfair commercial practices*.
  *   **Why Reverse Engineering is Allowed:** Because reverse engineering is honest competition. It is the "price" of keeping something secret. If you want absolute protection, you must patent it. If you want indefinite protection, you must accept the risk of discovery.
  *   **Why No Expiry:** Because the duty is based on confidentiality, not a state grant. As long as the secret holds and the confidence is maintained, the duty persists.

  ### 2. Is There a Unifying Account?

  You ask if there is a "third account" that makes all three fit, or if it is unprincipled.

  The system is **principled, but pluralistic.** The unifying theory is **Information Economics.**

  The law recognizes that "intellectual goods" are not a single category. They have different economic characteristics regarding **cost of creation**, **cost of copying**, and **social value of dissemination.**

  *   **Functional Inventions (Patents):** High cost to create, low cost to copy, high social value in *using* the knowledge.
      *   *Solution:* Force disclosure to ensure the knowledge is eventually usable by all, grant strong monopoly to recoup R&D.
  *   **Expressive Works (Copyright):** Variable cost to create, low cost to copy, high social value in *diversity* of expression.
      *   *Solution:* Low barrier to entry to maximize diversity, narrow scope to allow others to build on ideas, long term to monetize the specific expression.
  *   **Commercial Data/Processes (Trade Secret):** High value in *exclusivity*, difficult to define for disclosure (e.g., a customer list or a cooking process).
      *   *Solution:* Protect commercial morality without burdening the registry office with unpatentable minutiae.

  **The Coherence:** The coherence lies in the **Menu Theory.** The law provides a menu of options.
  *   Want a strong right? You must disclose and accept a short term (Patent).
  *   Want a long right? You must accept a narrow scope and no protection against independent creation (Copyright).
  *   Want indefinite secrecy? You must accept the risk of leakage and no protection against independent discovery (Trade Secret).

  The system is coherent because it forces the creator to **internalize the social cost of their exclusion.** You cannot have it all. You must trade off strength, duration, and breadth.

  ### 3. Forcing a Single Theory: The Thought Experiment

  If we forced the system to pick *one* philosophical foundation, the current balance would collapse. Here is how the rules would flip under the three dominant theories.

  #### A. The Pure Lockean Labor Theory (Natural Rights)
  *Premise: You own what you mix your labor with, provided you leave "enough and as good" for others.*
  *   **Patent:** **Independent invention becomes a defense.** If the second inventor mixed their labor without copying, they have a natural right to their invention. The first filer cannot block them.
      *   *Consequence:* Patent value plummets. R&D investment drops because you can't guarantee exclusivity. Disclosure decreases because the bargain is broken.
  *   **Copyright:** Remains largely similar, but moral rights become inalienable (you can't sell your labor's soul).
  *   **Trade Secret:** **Becomes absolute property.** If I own my secret by labor, you cannot use it even if you find it independently.
      *   *Consequence:* Innovation freezes. Everyone sues everyone for "independent" discovery. The public domain vanishes.

  #### B. The Pure Utilitarian/Incentive Theory (Economic Efficiency)
  *Premise: Rights exist solely to optimize social welfare; any right that doesn't incentivize creation is theft from the public.*
  *   **Patent:** **Terms shrink drastically.** 20 years is likely too long for most software/pharma given modern ROI speeds. Scrutiny on "non-obviousness" becomes extreme.
  *   **Copyright:** **Terms shrink to ~20 years.** There is zero evidence that a 95-year term incentivizes a creator more than a 20-year term. The rest is deadweight loss.
  *   **Trade Secret:** **Abolished or Heavily Curtailed.** Secrecy is socially destructive. The state would mandate disclosure for any valuable commercial process, perhaps compensating the inventor, to prevent knowledge burial.
      *   *Consequence:* Massive expansion of the public domain, but potential under-investment in technologies that are easy to reverse-engineer (like recipes or simple mechanics).

  #### C. The Pure Contract/Registration Theory (State Grant)
  *Premise: No rights exist without explicit state registration and examination.*
  *   **Patent:** Stays similar.
  *   **Copyright:** **Registration becomes mandatory.** No automatic protection. If you don't file, you don't own it.
      *   *Consequence:* Orphan works problem solves itself, but vast amounts of culture (emails, blogs, sketches) enter the public domain immediately, potentially reducing professional creative output.
  *   **Trade Secret:** **Abolished.** If you didn't register it, you have no claim. All knowledge must be categorized as either Patent (public) or Public Domain.

  ### Conclusion: The "Mess" is the Feature

  To answer your specific worry: **The system is not unprincipled, but it is not monolithic.**

  Your intuition that "Incentive theory makes Trade Secret look like a disaster" and "Lockean theory makes Patent look like a disaster" is correct. That is precisely why we have all three.

  *   We use **Patent** when we need to force disclosure of functional tech (solving the Trade Secret "burial" problem).
  *   We use **Copyright** when we want to encourage cultural production without administrative burden (solving the Patent "transaction cost" problem).
  *   We use **Trade Secret** for things that don't fit the other boxes (customer lists, internal processes), accepting the risk of secrecy to avoid over-propertizing information.

  If you forced the system to pick one theory, you would break the **trade-off mechanism.** The current system works because it forces innovators to choose their poison.
  *   If you want to bury knowledge, you accept the risk of Trade Secret (no legal shield against independent discovery).
  *   If you want a legal shield against independent discovery, you accept the cost of Patent (disclosure + expiry).

  The "Third Account" you are looking for is **Administrative Pragmatism.** The law treats ideas not as *objects* to be owned, but as *behaviors* to be regulated. It asks: "What set of rules induces the optimal amount of creation, disclosure, and competition for *this specific type* of idea?"

  The incoherence you feel is the friction of that optimization process. It is the sound of the system preventing anyone from having too much power over the abstract building blocks of thought.
