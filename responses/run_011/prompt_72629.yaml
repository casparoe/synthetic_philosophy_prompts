  *   **Conclusion:** The hybrid system is superior because ideas are heterogeneous.

  10. **Final Review against constraints:** The user wants to know if a single system can coherently hold all three. I need to answer "Yes, but not on the basis of *ownership*, on the basis of *regulation*."

