answer: |-
  Your difficulty arises because you are correctly sensing that the "Great Man vs. Structure" binary is a category error, but you are trying to force your intuitions into a framework (the Counterfactual Bottleneck) that is too blunt to capture the nuances you perceive. Specifically, you are conflating **causal necessity** (was this person required?) with **explanatory sufficiency** (does this person's presence explain the *nature* of the outcome?).

  Your verdicts are actually more consistent than you think, but your *stated principle* (Bottleneck) contradicts your *verdicts* (specifically Alexander). Furthermore, you are shifting the **description of the outcome** to make your verdicts fit (e.g., "War" for Princip vs. "Boycott" for Parks).

  Here is a refined principle designed to accommodate your intuitions while exposing the inconsistencies you need to resolve.

  ### The Principle of Agential Substitutability

  **Definition:** Historical explanation should be assigned to the level of analysis (Individual, Collective, or Structural) that exhibits the **lowest substitutability** regarding the **specific description of the outcome**.

  **Clause 1 (Structural Latency):** An outcome is structurally explained if the structural conditions created a high probability that *any* agent occupying the relevant role would have produced a **functionally equivalent** outcome within a **historically negligible** timeframe.
  *   *Motivating Verdicts:* **3 (Calculus)** and **4 (Nuclear Discovery).** The state of knowledge made discovery inevitable; Newton/Leibnau or Oppenheimer/Heisenberg were substitutable nodes in a network of knowledge. **6 (Alexander)** also motivates this: you argue the army and Persian weakness made conquest latent, rendering Alexander substitutable in terms of *causal work*, even if he was a bottleneck.

  **Clause 2 (Agential Specificity):** An outcome is individually explained if the **qualitative character**, **timing**, or **ideological content** of the outcome depends on unique properties of the agent that a structural substitute would not have replicated.
  *   *Motivating Verdicts:* **1 (Hitler/Extermination)** and **2 (Lenin).** You argue a German war was latent (Structural), but the *industrial extermination* was not (Individual Specificity). Similarly, a Russian revolution may have been latent, but the *Bolshevik orientation toward insurrection* in Spring 1917 depended on Lenin's unique authority (Agential Specificity). **7 (Rosa Parks)** fits here: the *Boycott* (specific outcome) required her specific arrest to trigger the ready organization, whereas previous arrests did not.

  **Clause 3 (Collective Irreducibility):** When the causal work is distributed across a network where no single node is a bottleneck, but the network itself is not a permanent structural feature (i.e., it is a contingent coalition), the explanation is **Collective**, not Individual and not Structural.
  *   *Motivating Verdicts:* This addresses your **Meiji Restoration** worry. It also applies to **4 (Nuclear Decision)**. The decision to build/drop was not one man (Individual) nor inevitable physics (Structural), but a contingent committee decision (Collective).

  ---

  ### Application to New Cases

  **1. The Collapse of the Soviet Bloc (1989)**
  *   **Analysis:** Apply Clause 1 vs. Clause 3.
  *   **Verdict:** **Structural with Collective Modulation.**
  *   **Reasoning:** The economic stagnation and nationalist pressures created Structural Latency (Clause 1) for the collapse of the bloc; it was not sustainable. However, the *peaceful* nature of the transition and the specific timing (1989 vs. 1995) depend on the Collective Agency of the reformist Politburo faction (Gorbachev, Shevardnadze, et al.) and their specific decision not to use force (Clause 3).
  *   **Application:** If you describe the outcome as "The end of the USSR," it is Structural. If you describe it as "The non-violent dissolution of the Warsaw Pact in 1989," it requires Collective Agency.

  **2. Scientific Discovery in Fields with 1,000+ Authors (e.g., LHC, Human Genome Project)**
  *   **Analysis:** Apply Clause 3.
  *   **Verdict:** **Collective.**
  *   **Reasoning:** No single author is a bottleneck (violates your original Bottleneck Principle), but the discovery is not structurally inevitable in the short term without the specific organization of this consortium. The "Individual" category dissolves entirely here. The "Structure" (scientific method) is necessary but insufficient without the specific "Collective" (the collaboration).
  *   **Application:** This validates your suspicion that the binary is wrong. The "n > 1" category is not just "Great Man multiplied"; it is a distinct ontological category of historical cause.

  ---

  ### Critique of Your Verdicts

  You asked for honesty regarding inconsistencies and which verdicts you must give up. The Principle of Agential Substitutability exposes three critical failures in your current position.

  **1. The Alexander Contradiction (Principle vs. Verdict)**
  *   **The Inconsistency:** You state your working principle is the **Counterfactual Bottleneck** ("in most nearby worlds in which they are absent, the outcome is absent"). You admit Alexander is the "narrowest bottleneck." Yet, you verdict him **Structural**.
  *   **The Conflict:** By your own stated principle, Alexander *must* be Individual. If he is absent, the conquest does not happen (by your admission).
  *   **Resolution:** You must give up the **Bottleneck Principle**. It is too crude. You should keep the **Alexander Verdict** but justify it via **Clause 1 (Structural Latency)**: The *capacity* for conquest was structural (Father's army, Persian weakness); Alexander was merely the trigger. A substitute general likely achieves similar gains.
  *   **Action:** Abandon "Bottleneck" as your definition of Individual Agency. Replace it with "Non-Substitutability."

  **2. The Princip vs. Parks Inconsistency (Outcome Shifting)**
  *   **The Inconsistency:** You treat **Princip** as Structural because "the war was waiting." You treat **Parks** as Individual because "the boycott needed a spark."
  *   **The Conflict:** These are identical causal structures. In both cases, a volatile structure exists (Alliances / Segregation), and a specific trigger is required to release it.
      *   If Princip is Structural because "War was inevitable," then Parks must be Structural because "Civil Rights victory was inevitable."
      *   If Parks is Individual because "The Boycott needed *her* arrest," then Princip must be Individual because "The War needed *this* assassination."
  *   **The Error:** You are shifting the **Description of the Outcome**. For Princip, you look at the macro outcome (WWI). For Parks, you look at the micro outcome (The Boycott).
  *   **Resolution:** You must align the outcome descriptions.
      *   If Outcome = "Global Conflict" vs. "Racial Justice," both are **Structural**.
      *   If Outcome = "Assassination of Franz Ferdinand" vs. "Montgomery Bus Boycott," both are **Individual/Collective** (Princip had co-conspirators, Parks had the WPC).
  *   **Action:** You must give up the **Princip Verdict** as currently stated. Either admit Princip is an Individual cause of the *War's timing* (like Lenin), or admit Parks is a Structural cause of the *Movement's success*. Given your Lenin verdict, consistency demands you treat Princip as **Individual regarding the timing/outbreak**, even if the underlying tensions were Structural.

  **3. The Nuclear Bomb (Moral Bias Confirmation)**
  *   **The Inconsistency:** You are confident the *discovery* is Structural, but undecided on the *decision*. You suspect moral feelings are reaching backward.
  *   **The Analysis:** Your suspicion is correct. You want the decision to be Individual so that moral blame can be assigned. However, under **Clause 1 (Structural Latency)**, the logic of Total War and the security dilemma made the *deployment* of available weapons highly probable regardless of the specific decision-maker.
  *   **Resolution:** Unless you can identify a specific, viable alternative path that was rejected due to unique individual morality (e.g., "Truman rejected a demonstration shot which his advisors unanimously supported"), the default explanation is **Structural/Collective**.
  *   **Action:** You should move your verdict on the *decision to drop* toward **Structural/Collective**. The "Individual" element is likely limited to the specific target selection or timing, not the fundamental decision to use the weapon in a total war context.

  ### Summary of Required Changes

  1.  **Discard the "Bottleneck" Principle.** It fails on Alexander and Multi-author science. Adopt **Agential Substitutability**.
  2.  **Align Outcome Descriptions.** You cannot judge Princip on "War" and Parks on "Boycott." If you standardize to "Specific Event," both are Individual/Collective. If you standardize to "Historical Era," both are Structural. I recommend the former for explanation, the latter for context.
  3.  **Accept the Collective Category.** Your hesitation on the Meiji Restoration and the Nuclear Decision indicates you have already outgrown the binary. Formalize the "Committee/Party" as a distinct explanatory level.

  Your intuitions are historically sophisticated; your philosophical framework is simply lagging behind them. The "Great Man" debate is a 19th-century problem; your verdicts suggest you are already thinking in terms of 21st-century complexity theory. Trust the verdicts, fix the principle.
