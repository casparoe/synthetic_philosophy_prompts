answer: |-
  Here is a breakdown of the distinct theses your colleague's sentence ("honest signals are honest because they are too expensive to fake") might be encoding. I have organised them by the conceptual axes you provided, plus two necessary additions regarding mechanical constraints and interest alignment.

  For each thesis, I provide a verdict on its truth status, its handling of the high-quality signaller's net gain, its stability under aligned interests, and its specific implications for your two objections (the toad's mechanical constraint and the firm's sanction-backed pledge).

  ### 1. The Differential Cost Thesis (Spencean)
  **Interpretation:** Honesty is maintained not because the signal is absolutely expensive, but because the *marginal cost* of signalling is lower for the high-quality type than for the low-quality type (the single-crossing condition).
  *   **Truth Status:** **Substantive and Defensible.** This is the standard game-theoretic condition for separating equilibria in signalling games.
  *   **High-Quality Gain:** **Yes.** The high-quality signaller can net a positive benefit from signalling (relative to not signalling) because the benefit of being identified outweighs the differential cost incurred.
  *   **Aligned Interests:** **Unnecessary.** If interests are perfectly aligned, "cheap talk" (costless signalling) sustains honesty. This thesis applies only where there is some conflict of interest.
  *   **Verdict on Toad (Mechanical Constraints):** **Distinct.** This thesis relies on strategic choice and cost differences. A toad's call frequency is an *index*, not a signal, because there is no choice variable to which costs apply. Collapsing indices into signals is a category error.
  *   **Verdict on Corporate (Sanctions):** **Compatible.** A sanction makes the *expected cost* of lying high. If the expected cost differs by type (e.g., a solvent firm finds sanctions less costly than an insolvent one), this thesis holds.

  ### 2. The Absolute Waste Thesis (Zahavian)
  **Interpretation:** Honesty requires that the signal imposes a net fitness loss (waste) on the signaller. Resources must be destroyed, not merely transferred.
  *   **Truth Status:** **False (as a universal theorem).** While true for some biological traits (peacock tails), it is not a necessary condition for information transmission. Transfers can signal if they are type-dependent.
  *   **High-Quality Gain:** **No.** By definition, if the signal is a pure handicap, the signaller incurs a net loss relative to a world without signalling, accepting this loss only to secure a mating/benefit that would otherwise be unavailable.
  *   **Aligned Interests:** **False.** Waste is never evolutionarily stable if interests are fully aligned; selection would eliminate the waste.
  *   **Verdict on Toad (Mechanical Constraints):** **False.** A mechanical constraint does not destroy resources; it restricts physics. Calling it "waste" is metaphorical at best.
  *   **Verdict on Corporate (Sanctions):** **False.** A sanction is often a transfer (penalty paid to audience/regulator). Your colleague's claim ("where no resources are destroyed, nothing is being signalled") relies on this thesis. It is incorrect in economics; a credible threat of transfer can sustain separation without deadweight loss.

  ### 3. The Out-of-Equilibrium Deterrence Thesis
  **Interpretation:** The sentence refers specifically to the cost a *liar* would face (out of equilibrium), not what the honest signaller actually pays (in equilibrium).
  *   **Truth Status:** **Substantive and Defensible.** This is the precise definition of incentive compatibility. The signal is "too expensive to fake" means the low type's payoff from mimicking is lower than their payoff from revealing.
  *   **High-Quality Gain:** **Yes.** The honest signaller pays the equilibrium cost, but the *deterrence* applies to the liar. The honest signaller can still profit.
  *   **Aligned Interests:** **Unnecessary.** Deterrence is only required if someone *wants* to fake. With aligned interests, no one wants to fake.
  *   **Verdict on Toad (Mechanical Constraints):** **Distinct.** A toad cannot fake a low frequency not because of deterrence (cost), but because of impossibility (physics). "Too expensive" implies a price exists; "impossible" implies no price exists.
  *   **Verdict on Corporate (Sanctions):** **Compatible.** Sanctions function precisely by raising the out-of-equilibrium cost for the liar (the firm that breaks the pledge). This validates your colleague's opponent: sanctions create the "expense" required to prevent faking.

  ### 4. The Budget Constraint Thesis (Condition Dependence)
  **Interpretation:** Honesty is maintained because low-quality types *cannot* produce the signal at any price (a hard physical or resource budget), whereas high-quality types can.
  *   **Truth Status:** **False (as a general theory of signalling).** This describes an *index* or a hard constraint, not a strategic signal. If a low type literally cannot produce the trait, it is not a signalling game; it is a revelation game.
  *   **High-Quality Gain:** **Yes.** If the cost is zero for the high type (because the low type is physically barred), the high type gains purely from revelation.
  *   **Aligned Interests:** **Stable.** Physical constraints hold regardless of interests.
  *   **Verdict on Toad (Mechanical Constraints):** **Identical.** This thesis *is* the toad argument. If your colleague claims this is "the same principle wearing a disguise," he is erasing the distinction between strategic signalling (choice) and physical indexing (no choice).
  *   **Verdict on Corporate (Sanctions):** **Incompatible.** Sanctions do not make a pledge physically impossible to break; they make it economically irrational. This thesis cannot account for your colleague's dismissal of the corporate case.

  ### 5. The Receiver-Response Thesis
  **Interpretation:** "Costliness" is not an intrinsic property of the signal but is defined by the receiver's refusal to reward the signal if it is not accompanied by the underlying quality.
  *   **Truth Status:** **True by Stipulation (in game theory).** A signal has no value without a receiver's response rule. The "cost" is often the opportunity cost of not receiving the reward.
  *   **High-Quality Gain:** **Yes.** The gain comes from the receiver's response, which outweighs the signal's production cost.
  *   **Aligned Interests:** **Unnecessary.** If interests align, the receiver's response rule is automatic, rendering the "cost" of signalling zero (cheap talk).
  *   **Verdict on Toad (Mechanical Constraints):** **Distinct.** The receiver does not need to enforce the toad's call frequency; physics does.
  *   **Verdict on Corporate (Sanctions):** **Compatible.** The "sanction" is simply a specific, negative receiver response rule. Dismissing it as "no resources destroyed" ignores that the *threat* of the response creates the signalling cost.

  ### 6. The Conflict of Interest Necessity Thesis
  **Interpretation:** Costly signalling is the *only* mechanism for honesty when signaller and receiver interests diverge.
  *   **Truth Status:** **Substantive and Defensible (with caveats).** Costly signalling is required to sustain honesty *in equilibrium* when there is an incentive to deceive. However, reputation mechanisms or repeated games can sometimes substitute for upfront costs.
  *   **High-Quality Gain:** **Yes.** The cost buys credibility in a hostile environment.
  *   **Aligned Interests:** **False.** If interests are aligned, honesty is costless (Cheap Talk Theorem).
  *   **Verdict on Toad (Mechanical Constraints):** **Distinct.** Indices work even with total conflict of interest (a predator cannot fake being small). They do not rely on the signalling logic of this thesis.
  *   **Verdict on Corporate (Sanctions):** **Compatible.** Sanctions exist *because* interests are not aligned (the firm wants to renege, the audience wants performance). The sanction aligns the incentives, allowing the costless pledge to function as a signal.

  ### Summary of Verdicts on Your Specific Objections

  **1. The Toad (Mechanical Constraints)**
  *   **Can it be dismissed as "the same principle"?** **No.**
  *   **Why?** Your colleague is conflating **Thesis 4 (Budget Constraint)** with **Thesis 1 (Differential Cost)**. In signalling theory, a "signal" implies a choice. A toad's call frequency is an *index*. Indices are honest because of physics; signals are honest because of incentives. While both convey information, the mechanism of honesty is fundamentally different. Collapsing them renders the concept of "cost" meaningless (physics is not a cost).

  **2. The Corporate Pledge (Audience Sanctions)**
  *   **Can it be dismissed as "no resources destroyed"?** **No.**
  *   **Why?** Your colleague is relying on **Thesis 2 (Absolute Waste)**. In game theory, a transfer (penalty) is a cost to the sender. If the expected penalty for lying exceeds the benefit of lying, the signal is "expensive to fake" in expectation. The resource is not "destroyed" in the thermodynamic sense, but it is removed from the signaller's control, which is the only definition of cost that matters for incentives. Dismissing this confuses *social waste* with *private cost*.

  ### What Your Colleague Likely Means
  In mixed company (biology + economics), when a senior member repeats "honest signals are honest because they are too expensive to fake," they are most likely intending a hybrid of **Thesis 1 (Differential Cost)** and **Thesis 2 (Absolute Waste)**.

  They are using the **Zahavian intuition** (signals must be wasteful handicaps) to justify the **Spencean mechanism** (differential marginal costs).

  *   **The Error:** They are treating the *sufficient* condition for biological handicaps (waste) as a *necessary* condition for all information transmission.
  *   **The Consequence:** This leads them to incorrectly dismiss indices (which require no cost, only constraint) and transfers (which require cost, but no waste).

  **Recommendation for the Meeting:**
  Do not attack the man. Attack the definition of "cost." Ask him to specify whether "expensive" means **(a) net fitness loss** (Zahavi), **(b) marginal cost differential** (Spence), or **(c) out-of-equilibrium penalty** (Game Theory).
  *   If (a): He must admit corporate pledges can signal (transfers are costs).
  *   If (b): He must admit toad calls are not signals (no marginal cost choice).
  *   If (c): He must admit sanctions make costless pledges informative (they create the out-of-equilibrium cost).

  Any way he answers, the universal claim "honest signals are honest *because*..." collapses without heavy qualification.
