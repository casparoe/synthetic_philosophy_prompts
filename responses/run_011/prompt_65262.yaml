      *   *Corporate (Sanctions):* Does it cover punishment? (Punishment creates a cost, so yes, but the colleague denied this).

  7.  **Refining the "Verdicts":**
      *   Need to be sharp. The colleague is likely mixing the "Handicap Principle" (waste is necessary) with "Signalling Theory" (differential cost is necessary).
      *   The colleague's claim "where no resources are destroyed, nothing is being signalled" is technically false in game theory (transfers can signal), but might be true in a specific biological fitness context (if transfer = fitness loss).
      *   The colleague's claim about mechanical constraints being "the same principle" is misleading. Indices rely on physics, Signals rely on incentives.

  8.  **Final Review against Constraints:**
      *   List format? Yes.
      *   Systematic axes? Yes.
