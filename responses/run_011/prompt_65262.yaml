  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure to distinguish between "Costly to Send" and "Costly to Fake." The sentence says "Costly to Fake." This implies the *low type* faces a higher barrier.
      *   *Correction on Corporate:* If a promise is costless to make but costly to break, is the *signal* costly? The signal is the promise. The cost is contingent. This is "contingent cost" vs "upfront cost." I need to make sure this distinction is clear.
      *   *Correction on Toad:* An index is not a signal in the game-theoretic sense because there is no choice. The colleague is expanding the definition of "signal" to include "indicator." I need to highlight this semantic stretch.

