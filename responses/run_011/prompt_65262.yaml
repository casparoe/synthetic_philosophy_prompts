      *   *Thesis 5: The Sanction/Transfer Equivalence.* Addressing the corporate pledge/punishment.
      *   *Thesis 6: The Conflict of Interest Necessity.* Addressing aligned interests.

  6.  **Evaluating Each Thesis against User Criteria:**

      *   *Truth Status:* Is it mathematically true, empirically true, or false?
      *   *High-Quality Gain:* Can the high type gain net benefits? (Yes in Spence, No in strict Zahavi).
      *   *Aligned Interests:* Does it hold if interests align? (No, cheap talk suffices).
