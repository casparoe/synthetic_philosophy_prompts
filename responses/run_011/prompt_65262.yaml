      *   *Axis 2: Waste vs. Transfer.*
          *   Interpretation A: Resources must be destroyed (burned money).
          *   Interpretation B: Resources can be transferred (paid to receiver/third party).
          *   *Verdict:* Signalling theory usually requires waste (deadweight loss) to prevent pooling, but transfers can work if they constitute a cost *to the sender* that differs by type. However, the colleague said "where no resources are destroyed, nothing is being signalled," which implies a strict Waste interpretation.

      *   *Axis 3: Out of Equilibrium (Liar's Cost) vs. In Equilibrium (Honest Signaller's Cost).*
