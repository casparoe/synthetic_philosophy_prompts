      *   *Axis 4: Condition-Dependence vs. Deterrence.*
          *   Interpretation A: Only high quality can afford it (Budget Constraint).
          *   Interpretation B: Low quality *could* afford it but choose not to because it's not worth it (Incentive Compatibility).
          *   *Verdict:* Standard signalling is Incentive Compatibility (B), not hard Budget Constraints (A).

      *   *Axis 5: Signaller's Outlay vs. Receiver's Response Rule.*
          *   Interpretation A: Cost is intrinsic to the signal.
          *   Interpretation B: Cost is defined by the lack of reward if the signal isn't sent (opportunity cost).
          *   *Verdict:* Game theory focuses on the payoff structure (Receiver's rule).

      *   *Axis 6: Theorem vs. Evolution vs. Empirical Generalisation.*
          *   Interpretation A: Mathematical necessity in signalling games.
          *   Interpretation B: How traits evolve biologically.
          *   Interpretation C: Observation of nature (peacocks).
          *   *Verdict:* Often conflated.

