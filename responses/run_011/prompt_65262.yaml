  5.  **Drafting the Theses (Iterative Refinement):**

      *   *Thesis 1: The Marginal Cost Condition (Spencean).* Focus on differential costs.
      *   *Thesis 2: The Absolute Waste Condition (Zahavian).* Focus on net fitness loss.
