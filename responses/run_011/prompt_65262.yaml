  *(Refining the "What they mean" section)*: In mixed company (bio + econ), they usually mean the Spencean differential cost condition but express it in Zahavian "handicap" language.

  Let's assemble the list.

  *   Thesis 1: The Differential Cost Thesis (Spence).
