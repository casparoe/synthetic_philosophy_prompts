prompt: |-
  So I just spent about four hours arguing with my friend Raj about the Great Divergence and I've come away way more confused about the *shape* of the argument than about the actual history. He's very much a "compare England to the Yangzi Delta, look at coal and wages and empire" guy, and I'm more of a "you're describing Britain's good luck and then calling it a cause" guy. We got nowhere. But the thing I kept throwing at him and he kept just not registering is a pattern I don't have a name for, and I want to know whether it has one. I'm a data analyst, not an academic, so go easy on me if this is all super well known.

  The pattern: somebody asks "why did X happen and not Y?", and it turns out the answer depends completely on how you write down the X — not the Y, the X. Same historical event, different perfectly reasonable description of it, different set of near-misses that count as the relevant alternatives, different causes, and the causes you get can straight up contradict each other. Concretely, with Raj: "why England and not the Yangzi Delta." If the thing-to-be-explained is "mechanised cotton spinning shows up in Lancashire in the 1780s," then the live causes are cheap coal sitting next to navigable water, oddly high wages relative to fuel, and slave-grown cotton. If the thing-to-be-explained is "output per person starts rising every year and never stops," then it's property rights, courts, the scientific culture, and high wages barely register at all. If it's "escape from an organic, land-constrained economy," then it's basically energy and ghost acres and the institutions story becomes noise. All three are supposed to be the same question. Each one silently makes a different contrast class the interesting one (France, the Song, India, the Netherlands, Rome) and each one promotes different facts to causes and demotes others to background. And Raj would grab whichever description made his favourite cause load-bearing, and when I pushed on it he'd slide to a different description without seeming to notice he'd done it, and the argument just kept regenerating because there was never a fixed thing being explained.

  It's not only history, which is why I think it's a general pattern and not just "historians are sloppy." Same structure in an argument I was in about a startup beating its rival: "beating" as in didn't go bankrupt → timing and a lucky funding round; "beating" as in ended up with 80% of the market → network effects and a distribution deal; "beating" as in created a category that didn't exist → the product. Three explanations, mutually pretty hostile, all answering "why them and not the other guy." Also: my brother and I once had a genuinely nasty conversation about "why did he end up a doctor and not me," and it turned out I meant "in medicine" and he meant "financially secure," and once we noticed that the whole two-year resentment sort of dissolved, which was annoying because I'd kind of been enjoying it.

  So — is there an established concept for this, and if not, what would you call it? Here's what I've already bumped into and why none of it quite fits, because I'm not looking for a bare label, I want the edges. Contrastive why-questions and foils: that's about the hidden "rather than Q" term and about relevance, but here the instability is in the P side, and the Q shifts only as a downstream consequence. Grain-sensitivity of explanations, and macro-vs-micro: close, but that's usually about how much detail an explanation ignores, whereas mine is about two explanations at *different* grains each claiming to answer one question. Screening off, INUS conditions, causal selection, the normal/abnormal-condition business: these tell you how to pick among causes once the explanandum is fixed, and my problem is that it isn't. Reference class problem: that's about estimating probabilities, and this happens even when nobody's putting numbers on anything. Equivocation: no, because nobody's using one word with two meanings — "industrialised," "rich," "escaped Malthus" are all honourable descriptions. Motte and bailey: no defensible core and no indefensible extension. Moving the goalposts: the standard of evidence isn't being changed, the thing being explained is. What I most want carved out is the *sliding* version specifically — using description-shifts to keep a pet cause relevant — because a natural reply is "well, every explanation is relative to a description, that's just how explanation works, so what's the complaint?" and I can't articulate why the sliding case is worse than the ordinary case. Is there some requirement you could put on a why-not question for it to be well posed, something like the answer having to be stable across the descriptions of the fact that the questioner would accept? Where does that requirement break down, and what are the boundary cases between a legitimate re-specification ("actually I was asking about growth rates, not the spinning jenny, let me be precise") and the bad slide? Two or three made-up examples of each would help me more than definitions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Problem:** The user identifies a specific argumentative pattern where the *explanandum* (the thing to be explained, "X") shifts description during an argument, leading to contradictory causal explanations for what is ostensibly the same question ("Why X and not Y?").
      *   **Context:** History (Great Divergence), Business (Startup success), Personal (Career/Financial success).
      *   **Key Feature:** It's not just that explanations are contrastive (which is well-known); it's that the *description of the event itself* changes, which silently changes the contrast class and the relevant causes. The interlocutor (Raj) slides between descriptions to keep a favorite cause relevant.
      *   **What the User Wants:**
          1.  Is there an established name/concept for this?
          2.  If not, what should it be called?
          3.  Why is the *sliding* version worse than ordinary description-relativity?
          4.  Criteria for a "well-posed" why-question (stability across descriptions).
          5.  Examples of legitimate re-specification vs. the "bad slide."
      *   **Constraints:** User is a data analyst, not an academic. Avoid overly dense jargon but respect their sophistication (they already know contrastive explanation, INUS conditions, reference class problem, etc.).

  2.  **Deconstruct the Phenomenon:**
      *   *Philosophy of Science/History:* The user is touching on the "individuation of events." When is Event A the same as Event B? If I describe the Industrial Revolution as "spinning jennies" vs. "sustained growth," am I talking about the same event?
      *   *Causal Selection:* Causes depend on the "causal field." Changing the description changes the field.
      *   *Argumentation Theory:* This sounds like a fallacy or a rhetorical tactic. It's close to *Equivocation*, but the user rightly notes the terms themselves aren't ambiguous; the *scope of the phenomenon* is. It's close to *Moving the Goalposts*, but specifically regarding the *target*, not the *evidence*.
      *   *Specific Concept:* The closest philosophical concept is **"Event Individuation"** or **"The Description-Relativity of Causal Explanation."** However, the *sliding* tactic is a rhetorical maneuver.
      *   *Potential Labels:* "Explanandum Sliding," "Causal Description Drift," "Target Shifting."
      *   *Philosophical Precedent:* Wesley Salmon, Bas van Fraassen (contrastive why), David Lewis (causal explanation depends on how we carve the event). But the *fallacious sliding* is less formally named. It resembles the **"Fallacy of Ambiguous Middle"** but applied to the conclusion/explanandum. It's also related to **"Reification"** (treating a description as the thing itself).

  3.  **Address the "Established Concept" Question:**
      *   There isn't one single catchy name like "The Raj Fallacy."
      *   Closest academic concepts:
          *   **Explanandum Instability:** (Rarely used as a fixed term, but describes the issue).
          *   **Causal Overdetermination / Redundancy:** (Related, but not quite).
          *   **The Problem of Event Individuation:** (Metaphysics).
          *   **Pragmatics of Explanation:** (Van Fraassen).
      *   *Best fit:* It's a violation of **"Explanandum Stability."** In rigorous causal inference (like potential outcomes framework), you must define the outcome variable $Y$ precisely. Sliding $Y$ is fatal.
      *   *Rhetorical name:* **"Explanandum Drift"** or **"Target Description Sliding."**

  4.  **Address the "Why is the Sliding Worse?" Question:**
      *   Ordinary explanation is relative to description (true).
      *   The *slide* is bad because it violates the **Cooperation Principle** (Grice). It pretends to be a continuous inquiry while actually swapping the object of inquiry.
      *   It prevents **Falsifiability**. If the cause $C$ fails to explain Description $D_1$, you switch to $D_2$ where $C$ works, but claim you're still talking about the same thing.
      *   It creates an **Illusion of Consilience**. It looks like multiple lines of evidence support one theory, but they actually support different theories about different events.

  5.  **Develop Criteria for "Well-Posed" Questions:**
      *   Need a stability condition.
      *   *Criterion 1: Causal Robustness.* Does the cause hold across nearby descriptions?
      *   *Criterion 2: Operational Invariance.* Can we measure the outcome consistently?
      *   *Criterion 3: Counterfactual Stability.* Do the same "near misses" apply?
      *   *The "Data Analyst" Angle:* Think of it as "Leakage" or "Target Variable Drift."

  6.  **Drafting the Examples (Legitimate vs. Bad Slide):**
      *   *Legitimate:* Refining a hypothesis. "I said 'sales,' I meant 'net retention,' let me correct that." (Transparent).
      *   *Bad:* "Why did the drug work?" (Survival rate) -> "Why did the drug work?" (Quality of life) when survival data is negative.
      *   *Legitimate:* Historical periodization. "I'm focusing on the political cause, not the economic." (Acknowledging scope).
      *   *Bad:* "Why did Rome fall?" (Political collapse) -> "Why did Rome fall?" (Cultural shift) to avoid military explanations.

  7.  **Synthesizing the Response:**
      *   **Validation:** Acknowledge the user's insight. It's sharp and correct.
      *   **Naming:** Offer "Explanandum Drift" or "Description-Relativity Exploitation." Connect to **Event Individuation**.
      *   **Philosophy:** Mention Van Fraassen (contrastive) but highlight the *individuation* gap. Mention **Causal Mechanism vs. Macro Outcome**.
      *   **Why it's toxic:** It creates a "Heads I win, Tails you lose" scenario for the theory. It creates **Spurious Consilience**.
      *   **The "Well-Posed" Requirement:** Propose **Explanandum Stability**. The cause should not be *highly sensitive* to minor changes in description if it claims to be the *fundamental* cause.
      *   **Examples:** Use the User's Data Analyst lens (Target Variable Drift) + Historical/Medical examples.

  8.  **Refining the Tone:**
      *   Keep it conversational but precise.
      *   Avoid condescension (user knows their stuff).
      *   Focus on the *structure* of the argument.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "sliding" specifically? Yes, distinguish between static relativity (okay) and dynamic sliding (bad).
      *   *Check:* Did I give examples of legitimate vs. illegitimate? Yes.
      *   *Check:* Is the "Data Analyst" perspective honored? Yes, use terms like "target variable," "operationalization," "leakage."
      *   *Insight:* The user mentions "Reference Class Problem." I should clarify why this is different. Reference class is about $P(X|Class)$. This is about defining $X$ itself.
      *   *Insight:* The user mentions "Equivocation." I need to reinforce why they are right that it's not simple equivocation. It's *ontological* sliding, not semantic.

  10. **Final Polish:** Ensure the distinction between "Explanandum Relativity" (a fact of life) and "Explanandum Drift" (the fallacy) is crystal clear. (This is the crux of the user's "what's the complaint?" question).

  *(Self-Correction on the name)*: "Explanandum Drift" is good. "Concept Creep" is a sociological term that's similar. "Motivation Drift" isn't right. Let's stick with **Explanandum Drift** or **Target Variable Sliding**. I will introduce "Explanandum Drift" as the philosophical term and "Target Leakage/Drift" as the data analog.

  *(Final thought on the "Well-Posed" criteria)*: The key is **Invariance**. If a cause is fundamental, it should explain the phenomenon under *reasonable* variations of description. If the explanation collapses when you tweak the definition of X slightly, the cause is likely incidental to that specific description, not fundamental to the event.

