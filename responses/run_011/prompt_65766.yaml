answer: |-
  You have put your finger on a genuine and deeply annoying structural flaw in causal reasoning that doesn't have a single, universally recognized name, though it sits at the intersection of philosophy of science, argumentation theory, and data science.

  You are right to reject the standard labels. It isn't *equivocation* (the words aren't changing meaning, the scope of the event is). It isn't *moving the goalposts* (the standard of proof isn't changing, the target is). It isn't just *contrastive explanation* (that assumes a fixed *explanandum* with a variable foil).

  Here is the breakdown of what this is, why the "sliding" version is toxic, and how to formalize the complaint.

  ### 1. Does it have a name?

  In the philosophy of science, this is a violation of **Event Individuation**.

  Events are not self-individuating; they are individuated by their descriptions. "The Industrial Revolution" is not a atom in the universe; it is a cluster of phenomena bound together by a description. When you change the description from "mechanised spinning" to "sustained per-capita growth," you have arguably picked out a *different event* in the causal network, even if they overlap in spacetime.

  However, there isn't a standard fallacy name for *sliding* between them mid-argument. The closest rhetorical term is **Explanandum Drift**.

  In your field (data/analytics), you actually have a precise name for this: **Target Variable Drift** (or *Concept Drift* applied to the label $Y$). If you train a model to predict "churn" defined as "no login for 30 days," and then when the model fails you redefine "churn" as "no purchase for 90 days" without retraining or acknowledging the shift, you have committed Target Variable Drift. You are claiming to solve the same problem while silently changing the objective function.

  So, if you want to name-drop to Raj: **"You're committing Explanandum Drift. You're treating description-relative explanations as if they are description-invariant truths."**

  ### 2. Why is the "Sliding" version worse than ordinary relativity?

  Your intuition is correct: *All* explanation is relative to a description. If I ask "Why did the window break?" and you say "Because a rock hit it," that explains *breaking* but not *shattering into exactly 42 pieces*. That's fine. That is just **granularity**.

  The "Sliding" (Drift) is worse because it creates an **Illusion of Consilience**.

  *   **Ordinary Relativity:** "I am explaining X under description D1. Cause C1 applies. If you meant description D2, Cause C2 would apply." (Honest, modular).
  *   **Explanandum Drift:** "I am explaining X. [Switches to D1]. See, C1 works! [Switches to D2]. See, C1 works here too! Therefore C1 is the robust cause of X."

  The slide allows the arguer to claim their cause is *robust* across descriptions when it is actually *fragile* and only works for specific slices. It turns a specific, contingent causal claim into a universal one by quietly swapping the universe it applies to.

  It violates the **Cooperative Principle** (Grice). It pretends to be a continuous inquiry into a single object ("The Great Divergence") when it is actually a hopscotch game across three different objects ("Mechanisation," "Growth," "Energy Constraints").

  ### 3. A Requirement for "Well-Posed" Why-Questions

  You asked for a requirement that makes a question well-posed. In causal inference terms, you are looking for **Invariance**.

  A causal explanation for "Why X?" is robust only if the causal link holds across a **neighborhood of acceptable descriptions** of X.

  **The Stability Criterion:**
  > An explanation $C \rightarrow X$ is valid only if $C$ remains a statistically significant predictor of $X$ across small, reasonable perturbations in the operational definition of $X$.

  If your cause (High Wages) explains "Mechanised Spinning" but disappears as a predictor when you shift the definition to "Total Factor Productivity Growth," then High Wages is not a cause of "The Industrial Revolution" *simpliciter*; it is a cause of "Mechanised Spinning." Claiming it explains the broader phenomenon is the drift.

  **Where the requirement breaks down:**
  It breaks down when the phenomenon is **Disjunctive**.
  *   *Example:* "Why did the patient survive?"
      *   Description A: "Didn't die on the table." (Cause: Surgeon's skill).
      *   Description B: "Lived 5 more years." (Cause: Adjuvant chemotherapy).
      *   Description C: "Returned to full mobility." (Cause: Physical therapy).
      *   Here, "Survival" is a disjunctive bucket. There is no single "Survival Cause." If Raj argues there is one "Great Divergence Cause," he is assuming the Divergence is a *natural kind* (like "Gold") rather than a *historical cluster* (like "The Renaissance"). If it's a cluster, looking for a single cause is a category error.

  ### 4. Examples: Legitimate Re-specification vs. The Bad Slide

  Here is how to distinguish a honest clarification from Explanandum Drift.

  #### Case A: The Startup (Your Example)
  *   **Legitimate Re-specification:**
      *   *You:* "Why did they beat the rival?"
      *   *Me:* "Do you mean why they didn't go bankrupt in year 1, or why they captured the market in year 5?"
      *   *You:* "Year 5 market share."
      *   *Me:* "Okay, then it's network effects. If you meant year 1 survival, it would have been the funding round."
      *   *Why it works:* The shift is explicit. The speaker acknowledges that the cause changes with the definition.
  *   **The Bad Slide (Explanandum Drift):**
      *   *Me:* "They won because of their superior product vision."
      *   *You:* "But their product was buggy and late."
      *   *Me:* "Well, 'winning' means they secured the Series B." (Shift to Survival).
      *   *You:* "But the rival also secured Series B."
      *   *Me:* "Okay, but 'winning' really means they defined the category." (Shift to Category Creation).
      *   *You:* "But they didn't define it, they copied it."
      *   *Me:* "Look, the point is their *vision* drove their success."
      *   *Why it fails:* "Product Vision" is being retrofitted to whatever definition of "Winning" is currently under attack. The cause is held constant while the effect morphs to accommodate it.

  #### Case B: Medical/Health
  *   **Legitimate Re-specification:**
      *   *Question:* "Why is this diet healthy?"
      *   *Clarification:* "Are we looking at weight loss or cardiovascular markers?"
      *   *Answer:* "For weight loss, it's caloric deficit. For cardio, it's lipid profiles. They are different mechanisms."
  *   **The Bad Slide:**
      *   *Claim:* "This diet cures metabolic disease."
      *   *Objection:* "The study showed no change in HbA1c (diabetes marker)."
      *   *Slide:* "Well, 'metabolic health' isn't just HbA1c, it's also inflammation." (Shifts target variable).
      *   *Objection:* "Inflammation markers didn't move either."
      *   *Slide:* "But the patients reported feeling more energetic." (Shifts from objective biomarker to subjective self-report).
      *   *Result:* The claim "Cures metabolic disease" is never falsified because the operational definition of "Cure" drifts away from every null result.

  #### Case C: The Great Divergence (Raj)
  *   **Legitimate Re-specification:**
      *   *Raj:* "Coal and wages explain the Divergence."
      *   *You:* "They explain the *location* of textile mills. They don't explain the *persistence* of growth."
      *   *Raj:* "Fair. Let's talk about mills then."
      *   *Why it works:* You have partitioned the event. You are now arguing about a specific, stable explanandum.
  *   **The Bad Slide:**
      *   *Raj:* "High wages caused the Divergence."
      *   *You:* "The Yangzi Delta had high wages too."
      *   *Raj:* "Well, the Divergence is about *energy*, and England had coal." (Slides from Wages to Energy).
      *   *You:* "Japan had no coal and industrialized."
      *   *Raj:* "Yes, but the *initial* divergence was about institutions." (Slides from Energy to Institutions).
      *   *You:* "But you started with wages."
      *   *Raj:* "It's all part of the High Wage Economy package." (Collapses the distinct descriptions back into one fuzzy blob to claim the cause is still the same).

  ### 5. How to shut it down (The Data Analyst Move)

  Since you are a data analyst, use that framing. It bypasses the historical jargon.

  Tell Raj: **"You are leaking the target variable."**

  Say this:
  > "Raj, in modeling, if I change the definition of $Y$ (the target) every time a predictor $X$ fails to fit, I haven't found a universal driver. I've just overfit a narrative.
  >
  > If 'High Wages' is the cause, it must predict *all* reasonable descriptions of the Divergence.
  > 1. Does it predict the *timing* of the spinning jenny? (Maybe).
  > 2. Does it predict the *persistence* of growth after 1850 when wages normalized? (No).
  > 3. Does it predict the *diffusion* to low-wage economies later? (No).
  >
  > You are treating 'The Divergence' as a single label, but it's actually three different classification problems. Pick one $Y$. Lock it down. If your cause doesn't predict that specific $Y$, drop the cause. Don't change $Y$ to save $X$."

  ### Summary
  The concept is **Explanandum Drift**.
  The violation is of **Event Individuation** and **Causal Invariance**.
  The fix is to demand **Operational Stability** of the outcome variable before accepting a causal claim.

  You weren't confused about the history; you were confused because Raj was arguing against three different histories while pretending they were one. You were trying to hit a target that was teleporting.
