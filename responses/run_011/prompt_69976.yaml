answer: |-
  **1. Accuracy Audit (Sections 2 and 4)**

  **Section 2:**
  *   **Okasha's MLS1/MLS2:** You have reversed the standard definitions. In the literature (Damuth & Heisler, adopted by Okasha), **MLS1** is the model where groups do *not* reproduce as wholes; selection is on individuals, and group traits are aggregates of individual fitness. **MLS2** is the model where groups *do* reproduce (via fission, budding, or forking) and have group-level fitness. Your draft states: "MLS1, in which groups themselves reproduce... and MLS2, in which groups do not reproduce." This is backward.
      *   *Does it matter?* Yes. Your system (deme forking) is a textbook MLS2 scenario. If you cite Okasha to justify your framework but define his central taxonomy incorrectly, computational biologists will dismiss the rest of your argument as uninformed.
  *   **Sober's Variance Criterion:** You attribute to Sober the view that one settles the question by finding the level that explains the "largest share of variance." Sober is generally more careful than this. He argues for **causal** significance, often using the "screening-off" relation, not merely statistical variance partitioning. While variance is the *evidence*, Sober typically insists that selection requires a causal property, not just a statistical correlation. Attributing a purely statistical criterion to him is a slight mischaracterization of his philosophical position, even if it matches how some biologists operationalize his work.
  *   **Williams:** Your summary is accurate. Williams is the canonical skeptic who demands high bars for group selection.
  *   **Dawkins/Hull:** Accurate enough for this context.

  **Section 4:**
  *   **The Price Equation:** You state it "cannot tell you where selection is; it is bookkeeping rather than ontology." This is a defensible philosophical position (held by some, like Walsh), but it is **contested**. Many evolutionary biologists treat the partitioning of the Price equation as ontologically significant. Stating this as a flat fact ("It is bookkeeping") rather than a philosophical stance ("It can be interpreted as bookkeeping") invites unnecessary pushback.
  *   **"Any between-group covariance can be restated as a change in gene frequency":** This is an accurate summary of the Genic View's claim (the "translation" argument). However, presenting it as "true but uninformative" is a value judgment. Proponents of the Genic View argue it *is* informative because it provides a universal currency. You are free to disagree, but acknowledge it as a disagreement, not a settled fact.

  **2. Specific Checks: Okasha and Screening-off**

  *   **Okasha's MLS1/MLS2:** As noted above, you have swapped them.
      *   *Correct Version:* MLS1 = Selection on individuals within a group context (groups don't reproduce). MLS2 = Selection on groups as entities (groups reproduce).
      *   *Impact on Argument:* Your system is MLS2. Your argument that "forking puts [demes] inside the copy set" is essentially an argument for why your system qualifies as MLS2. If you correct the definition, your argument actually aligns *better* with Okasha. Currently, the error makes it look like you think your system is MLS1 or that you haven't read the definitions closely.
  *   **Screening-off Criterion:** You characterized this as finding the level with the "largest share of variance."
      *   *Correct Version:* Screening-off is causal. Level $G$ (group) is the unit of selection if the group trait $G$ screens off the individual trait $I$ from fitness $W$. That is, $P(W | G, I) = P(W | G)$. If knowing the group trait makes the individual trait irrelevant to predicting fitness, selection is at the group level.
      *   *Impact on Argument:* This matters. Your "Copy Set" argument is mechanistic (how is state transmitted?). Screening-off is statistical/causal (what predicts fitness?). You are arguing that the mechanism *determines* the causality. If you conflate screening-off with variance partitioning, you weaken your critique of the statistical methods. You should argue that statistics measure the *shadow* of the mechanism, but the mechanism (the copy set) is the *cause*.

  **3. Is "Copy Set" just "Replicator" renamed?**

  It is not merely a renaming, but it is a close cousin. Here is the distinction:

  *   **Replicator (Dawkins):** An *entity* that passes on its structure largely intact. It implies a thing (a gene, a meme).
  *   **Copy Set (You):** The *information content* or state variables that are serialized.

  **Does it do philosophical work?**
  Yes, specifically through your **interventionist claim**: "I can move the boundary by editing code."
  In biology, the replicator is usually treated as a discovered fact of nature. In your system, the "replicator" is a design parameter. By calling it the "Copy Set," you highlight that "unitness" is contingent on the transmission mechanism, not an intrinsic property of the object.

  **What survives if it is a renaming?**
  The point that "the boundary can be relocated by changing what is serialized" is a real contribution. It operationalizes the abstract debate. It shows that the "Levels of Selection" problem is, in engineered systems, a "Levels of Serialization" problem. This aligns with recent "mechanistic" approaches in philosophy of biology (e.g., Godfrey-Smith's *Darwinian Populations*), but you derive it from engineering constraints rather than biological observation.

  **Verdict:** Keep the term. It signals to engineers that this is about data structures, not metaphysical essences. But acknowledge that it maps closely to "replicator" to show you know the lineage.

  **4. Strongest Objection and Advice on Section 6**

  **The Objection:**
  "The Fidelity Problem." A professional biologist will argue that in almost all natural systems, the "Copy Set" is leaky. Meiosis recombines genes; microbiomes are partially environmental; culture is partially oblique. Your criterion says: "an entity is a candidate unit of selection if and only if it is... inside the copy set."
  If transmission fidelity is 90%, is it a unit? If 50%? Your draft implies a binary (in the set / not in the set). But biology is continuous.
  By saying "the unit is whichever fraction of its state is transmitted," you quietly admit the boundary is fuzzy. If the boundary is fuzzy, the unit is a matter of degree. If the unit is a matter of degree, your conclusion ("Fix the copy set and the unit follows") is too strong. You haven't solved the ontological question; you've just moved it to "How much fidelity is enough to count as a copy set?"

  **Can you answer it?**
  You can answer it by distinguishing **engineered** from **natural** systems.
  *   *In your system:* Fidelity is (presumably) 100% for serialized state. The binary holds.
  *   *In biology:* Fidelity varies. The "unit" is a gradient.

  **Advice for Section 6:**
  Weaken the universal claim. Do not say "The units-of-selection debate is not a disagreement about how to describe the world." Say "In engineered systems, the debate reduces to..."
  Concede that in biology, the copy set is often porous, which is why the debate persists there. Your contribution is showing that *when* the copy set is rigid (by design), the unit becomes unambiguous. This makes your essay a proof-of-concept for the mechanistic view, rather than a final verdict on biology.

  **5. Contested Assertions and "Cheating"**

  **Contested Assertions:**
  1.  **"Price equation... cannot tell you where selection is."** (Sec 4). This is highly contested. Many biologists use it exactly to identify levels. Frame this as "On my account..." or "From an engineering perspective..." rather than "It is bookkeeping."
  2.  **"Genic view [is] true but uninformative."** (Sec 4). This is a philosophical stance (compatibilism), not a scientific consensus. Many biologists find the genic view highly informative.
  3.  **"You do not measure the unit of selection; you read the reproduction code."** (Sec 4). In biology, we cannot "read the code" (evolution has no source control). We *must* measure. This distinction is your strength, but don't imply biologists *could* read the code if they tried harder.

  **Where Biologists Will Think You Cheated:**
  1.  **Section 5 (Holobiont):** You write: "My criterion says the holobiont is not a unit of selection; the unit is whichever fraction of its state is transmitted."
      *   *The Cheat:* Biologists care about **functional integration**, not just transmission. If the host and microbiome are physiologically dependent (which they are), many argue they form a unit of *function* even if transmission is leaky. By defining "unit of selection" strictly via "transmission fidelity," you are defining away the functionalist argument. They will say you are solving a transmission problem, not a selection problem.
      *   *Fix:* Acknowledge that functional interdependence might create a "vehicle" even if the "copy set" is split. Your system conflates vehicle and replicator because you serialize the whole deme. Biology does not.

  2.  **Section 3 (Intervention):** "When I disabled forking... deme-level properties stopped predicting anything."
      *   *The Cheat:* This is a controlled experiment. In nature, you cannot "disable forking." Biologists might argue that your ability to isolate variables proves your point *only* because you built a simplified universe. It doesn't resolve the debate for systems where variables are entangled.
      *   *Fix:* Frame this as the advantage of the engineered context. "Because we can intervene, we can settle the question. Biologists cannot, which is why their debate continues."

  **Overall Assessment**

  This is a strong, provocative draft that will resonate with your engineering audience. It correctly identifies that "levels of selection" is often a confusion about transmission mechanisms. However, your credibility with the biologists in the room hinges on fixing the MLS1/MLS2 definition and softening the universal claims in Section 6.

  You are effectively arguing for a **mechanistic/operationalist** view of selection units. This is philosophically sound (aligned with Godfrey-Smith, Kerr, etc.), but you present it as a dismissal of statistical methods rather than a complement to them. If you position the "Copy Set" as the *causal mechanism* that the statistics *measure*, rather than a replacement for statistics, you will face less resistance.

  **Priority Fixes:**
  1.  Correct the MLS1/MLS2 definitions in Section 2.
  2.  Clarify in Section 4 that the Price Equation critique is a philosophical stance, not a mathematical fact.
  3.  Qualify Section 6 to acknowledge that natural "copy sets" are leaky, making the unit a matter of degree in biology, even if it is binary in your system.
