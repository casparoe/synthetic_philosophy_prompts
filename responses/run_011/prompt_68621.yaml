answer: |-
  # The Collapse Sorting Key

  This tool forces you to commit to a definition before you apply the label. Answer the eight scenarios below. Track your letters (A, B, or C). At the end, match your pattern to the Leaves to find your position.

  **Q1. The Scribe and the Farmer**
  The royal palace stops writing tax records and the king's statue is toppled. However, the village farmers continue planting the same crops in the same fields, and their mudbrick houses are slowly getting larger.
  *   **A:** The society has collapsed; the state *is* the society.
  *   **B:** The society is transforming, but not collapsing; the people matter more than the palace.
  *   **C:** It depends on whether the farmers were forced to build bigger houses or chose to.

  **Q2. The Empty City**
  Archaeologists find that the capital city's population dropped from 50,000 to 2,000 people. However, the total regional population (cities + countryside) only dropped by 10%.
  *   **A:** This is collapse; urbanization is the metric of success.
  *   **B:** This is de-urbanization, not collapse; the society just moved.
  *   **C:** This is collapse only if the city was the only place food was stored.

  **Q3. The Speed of Silence**
  The distinctive pottery style and religious rituals vanish. In one valley, this happens in a single layer of ash (one generation). In the next valley over, the style fades gradually over 400 years.
  *   **A:** Only the fast valley experienced collapse; slow change is evolution.
  *   **B:** Both collapsed; the end result (loss of culture) is what counts, not the speed.
  *   **C:** Neither collapsed; they just adopted new styles from neighbors.

  **Q4. The Return**
  Three hundred years after the monuments stop being built, a new king builds a palace on the same ruin, uses the same language, but claims a different god.
  *   **A:** The collapse was real; the 300-year gap breaks the continuity.
  *   **B:** It was an intermission; the civilization resumed.
  *   **C:** It was a new society wearing an old costume; the first one is still gone.

  **Q5. The Baseline**
  A kingdom's grain production drops to 40% of its "Golden Age" peak. However, this is still enough to feed everyone without starvation, and it is higher than their neighbors' production.
  *   **A:** This is collapse; they failed to maintain their own peak potential.
  *   **B:** This is stability; as long as they aren't starving or conquered, they are fine.
  *   **C:** This is relative decline; they collapsed compared to themselves, but not compared to the region.

  **Q6. The Evidence**
  Written histories say "The Empire Fell." However, skeletal evidence from the same period shows people were taller, healthier, and had fewer cavities than during the "Empire."
  *   **A:** The Empire fell; the written record defines the political reality.
  *   **B:** The Empire didn't collapse; life improved for the majority, so the system worked.
  *   **C:** The Empire fell, but that was a good thing; collapse can be positive.

  **Q7. The Specialization**
  The long-distance trade networks stop. Full-time potters and jewelers return to farming. Everyone is now a farmer-soldier.
  *   **A:** This is collapse; complexity is the definition of society.
  *   **B:** This is simplification; they are resilient, not collapsed.
  *   **C:** This is collapse only if the trade goods were necessary for survival (e.g., medicine).

  **Q8. The Name**
  The people still living in the ruins call themselves "The Children of the Sun," the same name used during the height of the empire 500 years prior. Outsiders call them "The Ruin Dwellers."
  *   **A:** They are the same society; internal identity trumps external labels.
  *   **B:** They are a successor society; 500 years is too long for continuity.
  *   **C:** They are a collapsed society; a name without a state is just a memory.

  ***

  ## The Leaves (Your Position)

  **1. The Palatialist (Mostly A on Q1, Q2, Q6)**
  *   **Position:** Collapse is the failure of the central authority, elite culture, and monumentality.
  *   **Logic:** If the government and the writing stop, the society is gone, regardless of how well the peasants eat.
  *   **Common Defense:** "You can't have a civilization without cities and kings."

  **2. The Demographic Determinist (Mostly A on Q2, Q5)**
  *   **Position:** Collapse is a significant loss of population density.
  *   **Logic:** If the people vanish or disperse, the society is gone. If the population stays stable, it's just political turnover.
  *   **Common Defense:** "Buildings can be rebuilt; dead people don't come back."

  **3. The Complexity Theorist (Mostly A on Q7, Q1)**
  *   **Position:** Collapse is the loss of socioeconomic specialization and trade networks.
  *   **Logic:** When full-time artisans return to subsistence farming, the "civilization" has collapsed into a simpler state.
  *   **Common Defense:** "Society is defined by what we can do together, not just how many of us survive."

  **4. The Continuity Defender (Mostly B on Q1, Q3, Q8)**
  *   **Position:** "Collapse" is a misleading term; societies transform but rarely vanish.
  *   **Logic:** As long as there is cultural or genetic continuity, the label "collapse" is an elite bias ignoring commoner resilience.
  *   **Common Defense:** "The Maya didn't disappear; their kings did."

  **5. The Cyclical View (Mostly B on Q4, Q3)**
  *   **Position:** Collapse is a temporary phase in a long cycle of growth and contraction.
  *   **Logic:** If the system eventually returns to complexity, the "collapse" was just a recession, not a death.
  *   **Common Defense:** "Rome fell twice; does that mean it never existed?"

  **6. The External Gazer (Mostly A on Q8, Q5)**
  *   **Position:** Collapse is defined by how neighbors and outsiders perceive the power vacuum.
  *   **Logic:** If you are no longer a player on the world stage, you have collapsed, regardless of internal health.
  *   **Common Defense:** "If no one fears you or trades with you, you don't matter."

  **7. UNNAMED: The Ghost State (Combination: Q1=A, Q2=B, Q7=A)**
  *   **Position:** The state remains intact while the population completely vanishes or returns to hunter-gatherer status.
  *   **Why Empty:** **Incoherent.** A state cannot function without a population to tax or conscript; this combination is structurally impossible.

  **8. UNNAMED: The Happy Catastrophe (Combination: Q6=C, Q1=A, Q2=A)**
  *   **Position:** Total political and demographic collapse occurred, but it is classified as a success because health improved.
  *   **Why Empty:** **Unappealing.** While some argue collapse *benefits* survivors, no one defines the event *as* a success rather than a collapse that *had* benefits. The term "collapse" implies negation.

  ***

  ## Limitations & Flags

  **Indistinguishable Leaves:**
  *   **The Palatialist** and **The Complexity Theorist** often land on the same verdict. It is difficult to find a historical case where the Palace falls (Palatialist collapse) but economic specialization remains intact (Complexity survival). In practice, these two positions are functionally identical for the Bronze Age and Maya.

  **Impossible Combinations:**
  *   **The Ghost State (Leaf 7):** As noted, a state apparatus cannot survive the total disappearance of its populace. If you select answers leading here, you must revise Q1 or Q2.

  ***

  ## Test Cases (Current Consensus Application)

  **1. The Classic Maya Lowlands (c. 800–950 CE)**
  *   **Path:** Palaces abandoned/records stop (Q1-A). Southern lowlands depopulate significantly (Q2-A). Change is relatively rapid in some centers (Q3-A/B mix). No return of Classic political system (Q4-A).
  *   **Analysis:** Northern Maya persisted (Continuity), but the Southern Classic political structure vanished.
  *   **Leaf:** **The Palatialist** (for the South) / **The Continuity Defender** (for the North). *Consensus usually splits the difference, but for the "Classic Collapse" specifically, it fits the Palatialist definition.*

  **2. Rapa Nui (Easter Island)**
  *   **Path:** Statue carving stops (Q1-A). Population crash is debated (pre-contact vs. post-contact) (Q2-B or A). Culture/Language persists despite turmoil (Q8-A).
  *   **Analysis:** If you believe the crash was post-European, it is **The Continuity Defender**. If you believe the crash was pre-contact due to ecocide, it is **The Demographic Determinist**.
  *   **Leaf:** **The Continuity Defender** (Based on modern archaeological consensus that culture persisted through the statue-toppling phase).

  **3. Late Bronze Age Eastern Mediterranean (c. 1177 BCE)**
  *   **Path:** Palaces burn/records stop (Q1-A). Trade networks vanish (Q7-A). Literacy lost in Greece (Q6-A). Population fluctuates but urban centers empty (Q2-A). New Iron Age systems emerge later (Q4-C).
  *   **Analysis:** High complexity lost, replaced by simpler systems.
  *   **Leaf:** **The Complexity Theorist**.

  Verdict: Maya = The Palatialist, Rapa Nui = The Continuity Defender, Bronze Age = The Complexity Theorist
