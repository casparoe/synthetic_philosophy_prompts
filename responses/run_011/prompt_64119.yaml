answer: |-
  ### 1. Reconstruction of the Presupposed Theory of Rational Choice

  The policy presupposes a hybrid theory that conflates **static coherence** with **dynamic optimality**. To treat the policy as correct rather than merely convenient, the following must hold:

  *   **Beliefs (Probabilism):** The firm must hold that its internal estimates ($p$) satisfy the axioms of probability (non-negativity, normalization, additivity). The coherence argument (Dutch Book) relies on this. If $p$ violates these axioms, the firm is theoretically exploitable regardless of stake size. The policy assumes these estimates are *the* prices at which the firm should be indifferent to betting, implying a commitment to **sharp probabilism** (no imprecision).
  *   **Utility (Logarithmic):** The firm must act as if its utility function over terminal wealth is $U(W) = \ln(W)$. The Kelly criterion is the unique solution for maximizing the expected growth rate of wealth *if and only if* utility is logarithmic (or if the horizon is infinite and the goal is almost-sure maximization of wealth). The policy explicitly rejects other utility curves ("not there because the partners believe the firm's utility... is more concave"). Therefore, the theory requires the firm to be risk-neutral over log-wealth, which implies significant risk aversion over raw wealth.
  *   **Structure (Infinite Horizon & Reinvestability):** The policy presupposes the firm is an ongoing concern with an unbounded time horizon. Kelly maximizes the *geometric* mean return, which converges to the arithmetic mean of log-returns only over many trials. For a single bet, or a finite short series, Kelly is not strictly optimal for any specific utility function other than Log. The practice assumes **full reinvestment** of profits and the ability to scale stakes continuously with bankroll fluctuations.
  *   **Silence and Open Questions:**
      *   **Correlation:** The policy is silent on correlation between bets. Standard Kelly assumes independence. If the firm faces correlated risks (e.g., multiple bets on the same match outcome), applying simple Kelly to each independently leads to overbetting and increased ruin risk.
      *   **Divisibility:** It assumes stakes are perfectly divisible. In reality, minimum bet sizes and market liquidity constraints create friction that Kelly ignores.
      *   **Bankroll Definition:** It leaves open whether "bankroll" is cash-on-hand or includes future earning potential (human capital). If the latter, the effective risk aversion is lower; if the former, it is higher.

  ### 2. Requirements vs. Fits (Expected Utility, Log, and Horizon)

  *   **Log Utility vs. Expected Utility:** Maximizing expected log bankroll is a *special case* of expected utility (EU) maximization, not a rival. The policy's justification claims that anyone not maximizing EU is exploitable (Money Pump argument). This is correct. However, it implies that *only* Log Utility is coherent. This is false. Any concave utility function satisfies the coherence constraints against money pumps. The policy smuggles in the assumption that **growth optimality** (maximizing the rate of wealth increase) is the only rational goal for a betting firm.
  *   **Single vs. Repeated vs. Unbounded:**
      *   **Single Wager:** For a one-off bet, Log Utility is not required. A firm could maximize $E[W]$ (risk neutral) or $E[-e^{-aW}]$ (exponential) without violating coherence. Kelly is not strictly required here.
      *   **Long but Finite:** Over a fixed number of bets $N$, the optimal strategy depends on the utility of wealth at time $N$. If $U(W_N) = \ln(W_N)$, Kelly is optimal. If $U(W_N) = W_N$, full expected value betting is optimal.
      *   **Unbounded:** Only in the limit as $N \to \infty$ does the Kelly strategy dominate all other strategies almost surely (maximizing the asymptotic growth rate).
  *   **Stopping Rule:** The practice presupposes the firm **never stops**. If the firm plans to liquidate or distribute capital at a fixed future date, the "half-Kelly" adjustment or even full Kelly may be suboptimal depending on the partners' consumption needs at that date. The policy treats the firm as a perpetual machine, which contradicts the reality of proprietary trading books that may be wound down.

  ### 3. Adjudication of Inconsistencies

  **The Lump-versus-Split Point**
  *   **Analysis:** The policy rejects one large bet but accepts twenty smaller sequential bets of equivalent total exposure.
  *   **Consistency Check:** If the twenty bets are on **independent** events, the variance of the aggregate outcome is lower than the single large bet (due to diversification). Since Log Utility penalizes variance (volatility drag), a Log-utility maximizer *should* prefer the split version. This is theoretically consistent with $U=\ln(W)$.
  *   **The Violation:** The inconsistency arises if the "single large wager" is simply the aggregation of the twenty smaller wagers on the **same** underlying risk (e.g., 20 contracts on the same game). If the risk profile is identical, rejecting one and accepting the other violates **transitivity** and **extensionality**. It suggests the firm is not actually maximizing EU over final wealth, but is instead adhering to a **heuristic constraint on single-event concentration** (e.g., "no more than X% on one outcome"). This is a risk management constraint, not a utility maximization result. The coherence argument does not justify concentration limits; only prudence does.
  *   **Verdict:** If the events are independent, the preference is consistent with Log Utility. If the events are identical (split contracts), it is a violation of the coherence principle that equivalent prospects should be treated equivalently. Given the phrasing ("settled one after another"), it implies independent opportunities, but the refusal of the "lump" suggests a hard constraint on drawdown that Log Utility does not strictly enforce (Log Utility allows significant drawdowns if the edge is positive).

  **The Half-Kelly Point**
  *   **Analysis:** The policy claims the haircut is due to **epistemic uncertainty** (error in $p$), not **utility curvature** (risk aversion).
  *   **Scrutiny:** Your suspicion is correct. In decision theory, reacting to parameter uncertainty by reducing stake size is **behaviorally equivalent** to having a more concave utility function. If you act as if $U(W) = \ln(W)$ but bet half-size, you are mathematically indistinguishable from an agent with $U(W) = W^{0.5}$ (or similar) betting full size on the mean estimate.
  *   **The Coherence Conflict:** The coherence argument demands that the firm's reported probabilities be the numbers it acts on. If the firm reports $p=0.6$ but acts as if $p=0.55$ (via the haircut), it is admitting its reported numbers are not its true pricing measures. This undermines the Dutch Book justification: if the "probability" is just a noisy input to a heuristic, the firm *can* be Dutch Booked relative to its *acting* probability, even if its *reported* probability is coherent.
  *   **Exposure:** A bookmaker who knows the firm uses half-Kelly due to estimation error can exploit this. They can offer bets with **high variance in edge estimation** (e.g., complex props where $p$ is hard to pin down). The firm will apply the haircut, but if the error is systematic (e.g., the firm consistently overestimates favorites), the haircut won't protect them. More dangerously, if the bookmaker knows the firm ignores correlation, they can offer a portfolio of bets that looks like high edge individually but is highly correlated, inducing the firm to overbet the aggregate risk.

  ### 4. Abandoning Point Estimates (Imprecise Probabilities)

  If the firm moves to a set of probabilities $P \in [p_{min}, p_{max}]$:

  *   **Policy Change:** The Kelly fraction $f^* = p - (1-p)/(o-1)$ becomes a range. The firm cannot calculate a single stake. It would need a decision rule for imprecise probabilities, such as:
      *   **Maximin:** Stake based on $p_{min}$ (most conservative).
      *   **E-admissibility:** Stake only if the bet is optimal for *some* probability in the set.
      *   **Zero Staking:** If the interval crosses the break-even probability, the policy would likely require declining the bet (status quo bias).
  *   **Coherence Justification:** The standard Dutch Book argument **collapses**. You cannot be Dutch Booked if you refuse to quote a single price for a wager. The justification would have to shift from **Coherence** (internal consistency) to **Robustness** (performance across a range of models).
  *   **Implication:** The firm would trade less frequently. The "Coherence" branding would no longer apply; it would become a "Robust Satisficing" framework. The claim that "prices must be probabilities" would be replaced by "prices must be sets of probabilities to avoid model risk."

  ### 5. Load-Bearing vs. Decorative Justification

  **Decorative (The "Coherence" Label)**
  *   **Dutch Book Argument:** This is decorative regarding stake size. It proves you need *a* probability, not *which* probability, and it says nothing about how much to bet. You can be coherent and bet zero, or coherent and bet your entire bankroll (if $U(W)=W$).
  *   **Money Pump Argument:** This proves you need *a* utility function. It does not prove you need *Log* utility. Using this to justify Kelly specifically is a non-sequitur.
  *   **"Rationality":** The policy uses "rationality" as a synonym for "Growth Optimal." This is a category error. Risk aversion is rational; maximizing growth rate is a specific strategic choice.

  **Load-Bearing (The Actual Drivers)**
  *   **Infinite Horizon Assumption:** This is the only premise that forces Kelly over other EU strategies. If the firm stops, Kelly loses its optimality guarantee.
  *   **Reinvestment:** The policy relies on the ability to compound gains. If profits are withdrawn regularly, Log Utility maximization is no longer the correct objective for the remaining capital.
  *   **Independence:** The policy assumes bets are uncorrelated. If this fails, the "half-Kelly" safety margin is consumed by correlation risk, not estimation error.
  *   **Survival Constraint:** The refusal of the "lump sum" wager reveals a hidden load-bearing constraint: **avoidance of ruin** (or significant drawdown) takes precedence over growth. This is not derived from coherence; it is a business continuity constraint.

  **Conclusion on Underdetermination**
  The policy is significantly underdetermined. A firm maximizing $U(W) = W^{0.5}$ with precise probabilities would produce the exact same stakes as a firm maximizing $U(W) = \ln(W)$ with uncertain probabilities and a half-Kelly rule. The firm cannot distinguish between "we are risk averse" and "we are uncertain" based on observed behavior alone. By claiming the latter while using the language of the former (coherence), the firm obscures its true risk profile. The coherence argument provides a shield of theoretical respectability, but the actual risk management is being done by the half-Kelly heuristic and the lump-sum rejection rule, neither of which follows from coherence alone.
