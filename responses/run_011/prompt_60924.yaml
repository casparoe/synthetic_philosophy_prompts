answer: |-
  Here are the desiderata for a theory of legislative sortition intended to rival election, followed by the impossibility analysis, the critical failure point, and the scorecard.

  ### The Desiderata

  **1. Authority (The Binding Claim)**
  *   **Motivation:** A legislative chamber must coerce compliance. Elections justify this via retrospective accountability (you can fire them). Sortition removes this lever. A theory must explain why a body immune to removal possesses the *right* to rule, distinct from the "advisory legitimacy" of citizens' assemblies. It must argue that freedom from re-election pressure generates a superior form of public-regarding judgment that outweighs the loss of electoral accountability.
  *   **Status:** **Non-negotiable.** If the theory cannot explain why losers should obey a body they cannot vote out, it justifies a consultative forum, not a legislature.

  **2. The Pool (Constitutive Justice)**
  *   **Motivation:** Randomness is only fair if the roster is just. If the electoral register under-represents the poor, the mobile, or the disaffected, the draw replicates structural exclusion under the guise of neutrality. The theory must treat roster correction not as a statistical tweak but as a prerequisite for political justice.
  *   **Status:** **Non-negotiable.** A lottery drawn from a rigged roster is an oligarchy with a randomizing veneer. However, the *method* of correction (compulsory service vs. incentivized volunteering) is defensibly negotiable.

  **3. Epistemic Conditions (The Competence Constraint)**
  *   **Motivation:** Random selection averages error only if errors are independent and the question is binary. Legislation involves complex, multi-option choices with correlated errors (e.g., partisan framing). A theory must specify the deliberative machinery required to decorrelate errors and prevent agenda cycling, or concede that the lot is epistemically inferior to election in specific domains.
  *   **Status:** **Non-negotiable.** A legislature that systematically produces incoherent or self-defeating law fails its functional purpose, regardless of its procedural purity.

  **4. Representation (The Mirror vs. The Sample)**
  *   **Motivation:** Proponents often claim the chamber "is" the people. But a sample of 150 cannot mirror the distribution of opinions on specific, post-deliberation issues, only pre-existing demographics. The theory must clarify whether legitimacy derives from *descriptive isomorphism* (looking like the population) or *statistical fidelity* (acting as a unbiased sample of the population's potential judgment).
  *   **Status:** **Defensibly Refuseable (Pro-Sortition Prejudice).** I argue that *descriptive mirroring* is a prejudice of the pro-sortition camp. Legitimacy derives from the *equality of opportunity* to enter the pool, not the demographic composition of the final chamber. Demanding a perfect mirror invites manipulation (stratification) and sacrifices competence.

  **5. Institutional Complements (The Athenian Warning)**
  *   **Motivation:** Athens paired the lot with *dokimasia* (screening), *euthyna* (audit), and short terms. Modern sortition often ignores these. A theory must specify the screening and auditing mechanisms that prevent the chamber from becoming a haven for the unqualified or the corrupt, without reintroducing careerism.
  *   **Status:** **Non-negotiable.** A naked lot in a complex state is an invitation to capture.

  **6. Expertise after the Careerist (The Staff Capture Problem)**
  *   **Motivation:** Removing professional politicians does not remove the need for professional knowledge. If drafting and budget analysis shift to permanent civil servants or lobbyists, power has not been dispersed; it has been relocated to unaccountable staff. The theory must explain how technical competence is internalized or checked without creating a new bureaucratic oligarchy.
  *   **Status:** **Non-negotiable.** This is the primary failure mode of term-limit experiments. If the staff writes the laws, the sortitioned members are merely rubber stamps.

  **7. Manipulation (Second-Order Control)**
  *   **Motivation:** Impartiality of the draw is useless if the framing of the question, the eligibility rules, or the stratification variables are controlled by partisans. A theory must account for who guards the guardians of the process design.
  *   **Status:** **Non-negotiable.** Process capture renders the outcome illegitimate regardless of the randomness of the selection.

  **8. Responsiveness (The Correction Mechanism)**
  *   **Motivation:** (Added) Elections allow mid-stream correction of gross errors. An 18-month sortitioned term is rigid. If the chamber makes a catastrophic error in month 3, what is the mechanism for correction before month 18? A theory must address how the system absorbs shock without relying on the very electoral accountability it seeks to bypass.
  *   **Status:** **Non-negotiable.** A legislature without a brake or a recall mechanism is a danger to the state.

  ***

  ### The Impossibility Theorem

  You suspect a trilemma between **Descriptive Mirroring**, **Independence from Administration**, and **Competence**. You are correct, but the tension is sharper than you posit.

  The true impossibility lies between **Descriptive Mirroring**, **Epistemic Competence**, and **Independence from Oligarchic Capture**.
  1.  **Mirroring + Competence:** To ensure a demographically perfect mirror is also competent, you must filter the pool or provide massive training. Filtering breaks the mirror; massive training requires a permanent apparatus, which threatens Independence.
  2.  **Competence + Independence:** To ensure competence without bureaucratic capture, you need members with prior expertise. This selects for the educated elite, breaking the Descriptive Mirror.
  3.  **Mirroring + Independence:** A raw, unfiltered lot mirrors the population and relies on no permanent staff. But it lacks the Epistemic Competence to draft complex legislation without deferring to external experts (breaking Independence) or producing garbage (breaking Competence).

  **Verdict:** Every existing proposal sacrifices one. The "Hybrid" models usually sacrifice Competence (relying on elected chambers to fix technical errors). The "Pure" models usually sacrifice Independence (relying on secretariats).

  **My Position:** The tension dissolves only if you abandon **Descriptive Mirroring** as a requirement for legitimacy. Legitimacy comes from the *randomness of selection* (equality of opportunity), not the *demographics of the result*. If you drop the demand for a sociological mirror, you can select for competence (via voluntary self-selection or light screening) and protect independence (by limiting the scope of legislation).

  **Recommendation for Your Chamber:** Sacrifice **Descriptive Mirroring**. Do not stratify the draw to match census data. Allow the self-selection bias of those willing to serve for 18 months to stand, provided the pool is open. Focus your institutional energy on **Independence** (creating a dedicated, non-transferable legislative staff) and **Competence** (intensive orientation and committee specialization). A chamber that looks like the people but is ruled by its staff is worse than a chamber that looks elite but writes its own laws.

  ***

  ### The Killer Requirement

  The single requirement that eliminates the largest number of candidate theories is **Expertise after the Careerist (The Staff Capture Problem).**

  Most theories of sortition are "negative" theories: they explain why elections are bad (careerism, short-termism, donor capture). They fail the "positive" test of how legislation actually gets written. When pressed, advocates assume existing civil services can be "neutral." This is empirically false. Bureaucracies have their own interests, and lobbyists fill vacuums of expertise. Any theory that does not propose a *new* technical apparatus loyal solely to the sortitioned chamber (and barred from future private sector employment) collapses into a theory of bureaucratic rule with a random fig leaf. This eliminates 90% of current proposals, including most "Citizens' Assembly" models scaled to legislation.

  ***

  ### Scorecard

  **The Pure-Lottery View**
  *Replaces the elected lower house entirely with a sortitioned chamber.*
  This view fails the **Expertise** and **Responsiveness** desiderata. While it maximizes descriptive representation and eliminates careerism, it creates a vacuum of institutional memory that permanent staff will inevitably fill. Without the threat of election, there is no mechanism to correct a chamber that becomes ideologically rigid or incompetent mid-term. It is theoretically pure but institutionally brittle; it works for a city-state, not a mid-sized parliamentary system.

  **The Hybrid View**
  *Sortitioned chamber holds veto/agenda power; elected chamber holds initiative.*
  This is the most robust candidate. It satisfies **Authority** (binding veto) and **Manipulation** (elected body sets broad agenda, sortitioned body checks it). It mitigates the **Expertise** deficit by limiting the sortitioned chamber to review and amendment rather than initial drafting. However, it risks becoming a purely obstructive body ("the veto chamber"), creating gridlock. It succeeds only if the suspensive veto is calibrated to force compromise rather than stalemate.

  **The Quasi-Judicial View**
  *Sortition confined to juries or single-shot citizens' assemblies.*
  This view satisfies **Epistemic Conditions** and **Expertise** easily, as the tasks are narrow and time-bound. However, it fails the **Authority** desiderata for a *legislative rival*. It concedes that the lot is fit only to judge specific cases or advise, not to govern. It is a safe theory, but it abandons the ambition of replacing electoral oligarchy with sortitioned democracy. It is a reform, not a rival.

  ### Final Recommendation

  Your proposal should adopt the **Hybrid** model but explicitly reject **Descriptive Mirroring**.

  Do not stratify your draw to match the census. Stratification is a form of gerrymandering the pool; it allows the designers to decide which identities matter and invites litigation over representation. Instead, rely on a large enough sample (e.g., 300+ members) and compulsory service (with hardship exemptions) to ensure the *Pool* is just, while accepting that the *Chamber* will not be a perfect microcosm.

  Direct your institutional innovation toward the **Expertise** requirement. Propose a "Legislative Service Corps"—a body of drafters and analysts hired on fixed-term contracts, barred from lobbying forever after, and accountable solely to the sortitioned chamber. Without this, your 18-month legislators will be tourists in a bureaucracy they cannot control. Sacrifice the mirror to build the machine.
