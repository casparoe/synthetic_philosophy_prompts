answer: |-
  Your draft demonstrates a strong grasp of the intuitive core of Ergodicity Economics (EE), particularly the distinction between ensemble and time averages. However, for a PhD prospectus, the framing requires greater technical precision and normative caution. The program makes a powerful descriptive point about non-ergodic dynamics, but its normative leap—that time-average growth is the *only* rational objective—is where the controversy lies. Below, I address your two questions and then provide the required assessment.

  ### On the Log-Utility Charge

  You are correct that the mathematics of maximizing the time-average growth rate of wealth in multiplicative processes is isomorphic to maximizing expected utility with a logarithmic utility function. The derivative of the time-average growth rate with respect to the betting fraction yields the same first-order conditions as maximizing $E[\ln(W)]$.

  The question is whether this equivalence invalidates EE's claim to be "preference-free." The charge that EE "smuggles in" log utility is partially correct but misses the ontological shift EE attempts. Standard Expected Utility (EU) theory treats risk aversion (the curvature of $u(w)$) as a primitive psychological parameter. EE treats the logarithmic objective as a derived physical constraint of the wealth dynamic itself. If wealth evolves multiplicatively, the time-average growth rate *is* the logarithmic growth rate.

  However, EE does not fully escape the charge of making an assumption. It replaces a *psychological* assumption (agents have log utility) with a *teleological* assumption (agents ought to maximize long-run wealth growth). This is not preference-free; it is a specific normative claim about what agents should value. If an agent values consumption smoothing, has a finite horizon, or cares about the path of wealth (not just the terminal point), the time-average growth rate is not their objective. Thus, the program escapes the claim that it relies on *psychological* parameters, but it does not escape the need to justify why wealth growth is the sole metric of rationality.

  ### On the Advisor's Rationality

  Your claim that your advisor is "strictly irrational" is indefensible in a general economic context, though it holds within the specific, narrow axioms of EE.

  First, a technical correction: Your Kelly policy does **not** maximize the *expected value* (arithmetic mean) of terminal wealth. In a positive-sum gamble, expected terminal wealth is maximized by betting the maximum allowable fraction (often $f=1$), because the arithmetic mean is dominated by extremely rare, extremely large outcomes in the right tail of the distribution. Kelly maximizes the *geometric mean* (or median) of terminal wealth.

  Second, regarding rationality: In standard decision theory, an agent is rational if they maximize their expected utility given their preferences. If your advisor has CRRA preferences with relative risk aversion $\gamma > 1$, fractional Kelly is the optimal policy for maximizing her expected utility. She is not irrational; she has a different objective function. EE argues her objective function is "wrong" for the long run, but this is a normative disagreement, not a proof of irrationality.

  The dominance result you are reaching for is the **Breiman (1961) result** (often associated with Kelly): As the number of periods $T \to \infty$, the ratio of the wealth of a Kelly bettor to the wealth of any other "essentially different" bettor diverges to infinity with probability one. However, this says nothing about expected utility, finite horizons, or the probability of the advisor being ahead at any finite $T$. To claim strict irrationality, you must first prove that maximizing long-run wealth growth is the *only* valid definition of economic rationality, which is a substantive philosophical claim, not a mathematical theorem.

  ### Prospectus Strategy

  For a dissertation, framing EE as a complete replacement for microfoundations is high-risk. It is viewed by many mainstream departments as heterodox. A safer, yet still innovative, approach is to treat EE as a constraint on dynamic optimization problems where non-ergodicity is salient (e.g., ruin, leverage cycles), rather than a universal theory of choice.

