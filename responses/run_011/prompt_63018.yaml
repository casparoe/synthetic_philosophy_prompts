prompt: |-
  I am in Year 13 and I run my school's philosophy society, which meets fortnightly for forty-five minutes. Next week's session is the problem of future contingents: the argument, running back to Aristotle's sea-battle passage, that a statement about a contingent future event must already be true or already be false, and that this seems to leave the future fixed. The audience is about fifteen students, nearly all of whom take Maths, Physics or Chemistry at A-level; none studies Philosophy or Religious Studies, and none has met the topic before. I have a whiteboard, no handouts, and a standing society rule that no session may turn into an argument about a live political or religious question.

  I am not asking for the explanation. I want a plan for delivering it, addressing the following.

  - The order in which the components must be introduced, and what depends on what. My suspicion is that the three-way distinction between 'we cannot yet know it', 'it is not causally determined', and 'there is not yet any fact of the matter' has to be secured before anything else can be said, but I do not know where bivalence and the idea of a truth-value gap sit in that sequence, or whether either can be reached without the other.
  - One example to carry the whole session. I had thought of a coin I shall flip in the car park at break tomorrow, but I expect a physicist to ask at once whether the outcome is fixed by initial conditions, whereupon the session becomes a debate about chaos rather than about truth. Tell me what the example must have and what it must lack, and propose one. It must additionally resolve itself before our next meeting, since I intend to open that meeting by revisiting it and asking whether anyone's answer has changed now that the outcome is known.
  - The misconceptions this audience will arrive with or form along the way, each paired with the precise point in the sequence at which it should be headed off. I anticipate at least: that the question is really about free will; that Aristotle is a fatalist of some kind; that the issue is merely epistemic; and that denying bivalence amounts to holding both that the event will not occur and that it will not fail to occur.
  - A single question to put at the end that would separate a student who has grasped the problem from one who has simply been agreeable.
  - What I should refuse to cover at this level, and say so out loud. I assume the rival logical systems and the historical responses to the argument are all beyond reach in forty-five minutes, but I would like that judgement argued rather than taken for granted.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Year 13 student, runs school philosophy society.
      *   **Audience:** ~15 students, STEM-focused (Maths/Physics/Chem), no prior philosophy background.
      *   **Topic:** Problem of Future Contingents (Aristotle's Sea Battle).
      *   **Constraints:** 45 minutes, fortnightly meeting, whiteboard only (no handouts), no live political/religious debates.
      *   **Specific Needs:**
          1.  Order of components (dependencies, bivalence, truth-value gaps, epistemic/ontic distinction).
          2.  One running example (must avoid physics determinism debates, must resolve before next meeting).
          3.  Misconceptions (Free Will, Aristotle as Fatalist, Epistemic vs. Ontic, Denying Bivalence $\neq$ Contradiction).
          4.  Final diagnostic question.
          5.  Scope limits (what to exclude and why).

  2.  **Deconstruct the Logic/Sequence (Need 1):**
      *   *Core Problem:* If "There will be a sea battle tomorrow" is *now* true, then the battle *must* happen. If it's *now* false, it *must not* happen. So the future is fixed.
      *   *Prerequisites:* To understand this, students need to understand:
          *   What a proposition is (statement that can be true/false).
          *   Principle of Bivalence (Every proposition is either True or False).
          *   The distinction between *Epistemic* (we don't know) and *Ontic* (it isn't fixed yet).
          *   Truth-value gaps (the solution space).
      *   *Sequence:*
          1.  Introduce the Example.
          2.  Establish Bivalence (Logic rule).
          3.  Apply Bivalence to the Future Example.
          4.  Derive the Fatalistic Conclusion (The Problem).
          5.  Distinguish Epistemic vs. Ontic (Crucial for STEM kids).
          6.  Introduce Truth-Value Gaps (The potential solution).
      *   *Dependency:* You can't explain truth-value gaps until they understand Bivalence. You can't understand why Bivalence is problematic for the future until they distinguish "unknown" from "unsettled."

  3.  **Select the Example (Need 2):**
      *   *User's Idea:* Coin flip.
      *   *Problem:* Physics students will argue determinism (Laplace's Demon). If the universe is deterministic, the outcome *is* fixed, so the logical problem vanishes into physics.
      *   *Requirement:* Needs to be contingent (could go either way), resolve quickly (by tomorrow break), and ideally immune to "physics determined it" arguments *for the sake of the logical exercise*.
      *   *Idea:* A choice made by a human agent *tomorrow*.
      *   *Better Idea:* A specific, mundane, binary event that relies on *human choice* but isn't morally loaded (avoids political/religious rule).
      *   *Best Idea:* "I will wear a red tie tomorrow." (Or similar).
      *   *Why:* It resolves tomorrow. It involves choice (contingent). Physics students might still say "Brain states determine it," but we can bracket that.
      *   *Refinement:* To avoid the "Physics/Determinism" trap completely, the example needs to be explicitly defined as *contingent* by stipulation, or rely on something external but undecided.
      *   *Actually, the prompt asks to avoid the physics debate.* The example must *lack* physical determinacy cues.
      *   *Proposal:* "The society leader (me) will eat an apple at break tomorrow."
      *   *Why:* It's up to me. It's trivial. It resolves tomorrow.
      *   *Constraint Check:* Must resolve before next meeting. Yes.
      *   *Avoiding Physics:* Explicitly stipulate: "For the sake of this argument, assume my choice is not causally determined by prior states." This brackets the physics objection.

  4.  **Identify Misconceptions (Need 3):**
      *   *Free Will:* Students will jump to "But I have free will!" -> *Correction:* This is about *truth*, not *ability*. Address after deriving the fatalistic conclusion.
      *   *Aristotle as Fatalist:* Students think Aristotle believed the future is fixed. -> *Correction:* Aristotle raised the problem to *avoid* fatalism. Address when introducing the historical context (briefly).
      *   *Epistemic:* "We just don't know yet." -> *Correction:* Distinguish "Unknown truth" vs "No truth yet." Address *before* applying Bivalence.
      *   *Denying Bivalence:* "If it's not True, it's False." -> *Correction:* Introduce 'Indeterminate'. Address when discussing solutions.

  5.  **Drafting the Diagnostic Question (Need 4):**
      *   Need to separate "I nodded along" from "I get the logical tension."
      *   Bad question: "Is the future open?" (Too vague).
      *   Good question: Something that forces them to choose between Bivalence and Open Future.
      *   *Draft:* "If you say the statement is neither true nor false, what happens to the law of excluded middle?" (Too technical).
      *   *Draft:* "If I say 'It is true now that I will eat an apple', have I changed the future?"
      *   *Better:* "Does denying bivalence save the open future, or does it just change the definition of truth?"
      *   *Best:* Focus on the cost of the solution. "If we say the statement has no truth value now, are we saying logic doesn't apply to the future, or that reality doesn't exist yet?"

  6.  **Determining Scope Limits (Need 5):**
      *   *What to cut:* Modal Logic (possible worlds), Ockham's specific solution, theological foreknowledge (too close to religious rule), Quantum Mechanics (distracts from logic).
      *   *Why:* 45 minutes is very short. STEM kids love QM/Chaos, but that turns it into Physics. Must keep it *Logical*.
      *   *Argument:* We are analyzing the *structure of language and truth*, not the *structure of the universe*.

  7.  **Structuring the Plan (45 Minutes):**
      *   0-5: Intro & Example (Stipulate contingency).
      *   5-15: The Logical Trap (Bivalence -> Fatalism).
      *   15-25: The Crucial Distinction (Epistemic vs. Ontic).
      *   25-35: The Solution Space (Truth Value Gaps).
      *   35-40: Misconception Check.
      *   40-45: Diagnostic Question & Wrap.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* The coin flip is actually okay *if* you stipulate indeterminacy. But the prompt says "I expect a physicist to ask at once." So, avoid the coin. Use a *choice*.
      *   *Critique:* The sequence of Epistemic/Ontic. If I introduce this too early, they won't see the problem. I need them to feel the pressure of the argument first. So: Argument -> Discomfort -> Distinction -> Solution.
      *   *Critique:* Bivalence vs Excluded Middle. For A-level STEM, keep it simple. Bivalence (True or False) is enough. Don't introduce Excluded Middle ($P \lor \neg P$) unless necessary, as it complicates the "gap" discussion. Stick to Truth Values.
      *   *Critique:* The "No handouts" rule means I need to write key definitions on the board clearly.

  9.  **Final Polish:**
      *   Ensure the tone is appropriate for a peer-led society (respectful but authoritative on the plan).
      *   Check all constraints (45 mins, whiteboard, no politics/religion).
      *   Make sure the "Physics" objection is explicitly managed in the example section.

  10. **Final Review against Prompt Requirements:**
      *   Order of components? Yes.
      *   One example? Yes (The Apple).
      *   Misconceptions paired with timing? Yes.
      *   Diagnostic question? Yes.
      *   Scope limits argued? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a structured plan for your 45-minute session. It is designed to leverage your audience's logical training while insulating the discussion from physical determinism.

  ### 1. The Sequence of Components
  You are correct that the three-way distinction (Epistemic vs. Causal vs. Ontic) is the pivot point, but you cannot introduce it *first*. If you start with definitions, the students will not feel the force of the problem. You must lead them into the trap before showing them the exit.

  **The Dependency Chain:**
  1.  **The Example:** Must be established as *contingent* by stipulation (see Section 2).
  2.  **The Principle of Bivalence:** Define this clearly on the board. (Every declarative statement is either True or False).
  3.  **The Argument (The Trap):** Apply Bivalence to the Future Example. Show how this logically entails Fatalism.
  4.  **The Distinction (The Pivot):** Now introduce the distinction between *Epistemic* (unknown to us), *Causal* (determined by physics), and *Ontic* (a fact of the matter exists). This is where you dismantle the physicists' instinctive objections.
  5.  **Truth-Value Gaps:** This can only be reached *after* the Distinction. You cannot propose a gap until they understand that "True/False" implies "Fixed Fact."

  **Why this order?**
  If you introduce truth-value gaps before Bivalence, they seem like an arbitrary exception. If you introduce the Epistemic/Ontic distinction before the Argument, the students won't understand *why* it matters. They must feel the logical pressure of the argument first.

  ---

  ### 2. The Running Example
  **Requirement:** It must be binary, resolve by tomorrow break, and be immune to "Laplace's Demon" determinism arguments *for the duration of the logic exercise*.

  **What it must have:**
  *   **Agency:** It should rely on a human choice, not a physical process, to discourage "initial conditions" arguments.
  *   **Triviality:** It must not matter morally or politically (adhering to your society rule).
  *   **Verifiability:** You must be able to prove the outcome at the next meeting.

  **What it must lack:**
  *   **Physical Randomness:** Do not use dice, coins, or decay. This invites Physics A-level students to discuss chaos theory or quantum indeterminacy, which distracts from the *logical* problem of truth.
  *   **External Dependency:** Do not use "It will rain," as that invites meteorological determinism.

  **The Proposal:**
  > **"I will wear a blue tie to school tomorrow."**

  **Implementation:**
  *   Write the statement on the board.
  *   **Crucial Stipulation:** At the start, explicitly state: *"For this session, we must stipulate that my choice is not causally determined by prior physical states. I am free to choose either. If you argue physics determined it, you are opting out of the philosophical problem. We are testing Logic, not Physics."*
  *   **Resolution:** At the start of the *next* meeting, wear (or do not wear) the tie. Ask: "Was the statement I made last week True or False *at the time I made it*?"

  ---

  ### 3. Misconceptions and Intervention Points
  Your STEM audience will approach this with specific logical intuitions. Here is when to head them off.

  | Misconception | When it will arise | How to head it off (Whiteboard Script) |
  | :--- | :--- | :--- |
  | **"This is just about Free Will."** | Immediately after you derive the fatalistic conclusion. | **Intervention:** "Free will is about *ability*. This problem is about *truth*. Even if you have the ability to choose, does the *truth* of the statement about your choice exist now? We are analysing propositions, not psychology." |
  | **"We just don't know yet (Epistemic)."** | When you ask "Is it True or False?" | **Intervention:** Draw two columns: **'Unknown Truth'** vs **'No Truth Yet'**. Ask: "If I hide a coin in my hand, is it heads or tails?" (Unknown Truth). "If I haven't flipped it yet, is it heads or tails?" (No Truth Yet). Force them to choose which category the future belongs to. |
  | **"Aristotle believed the future is fixed."** | When you mention the historical context. | **Intervention:** Clarify immediately: "Aristotle did not argue *for* fatalism. He argued that *if* we accept standard logic, we get fatalism. He raised the problem to save the openness of the future." |
  | **"Denying Bivalence means it's both True and False."** | When you propose Truth-Value Gaps. | **Intervention:** Write: **$\neg$(True) $\neq$ False**. Explain that a 'Gap' means the predicate 'is true' does not apply, not that the opposite is the case. It is not a contradiction; it is a category error. |

  ---

  ### 4. The Diagnostic Question
  Do not ask "Did you understand?" or "Is the future open?" These allow students to be agreeable without engaging the logic.

  **The Question:**
  > **"If we say the statement 'I will wear a blue tie' is neither True nor False right now, are we saying that Logic does not apply to the future, or that Reality does not exist yet?"**

  **Why this works:**
  *   **The Agreeable Student:** Will say "Um, reality doesn't exist yet?" without seeing the implication.
  *   **The Grasping Student:** Will recognise the dilemma. If Logic doesn't apply, we break the laws of thought. If Reality doesn't exist, we are committed to a specific metaphysical view (Presentism/Branching Time) which has its own costs. It forces them to see that 'solving' the problem requires paying a price elsewhere.

  ---

  ### 5. Scope Limits (What to Refuse)
  You have 45 minutes. You must explicitly exclude two topics to keep the session coherent. State these boundaries out loud at the start.

  **1. Quantum Mechanics and Physical Determinism**
  *   **The Refusal:** "We are not discussing whether the universe is physically deterministic. Even in a quantum universe, the *logical* problem remains: if a statement is True, does it fix the event? We are bracketing physics to test logic."
  *   **The Argument:** If you allow physics, the session becomes a debate about chaos theory and brain states. The Problem of Future Contingents is a problem of *semantic realism*, not causal chains. Even if the universe is random, is the statement "A random event will occur" true now?

  **2. Rival Logical Systems (Modal Logic/Many-Valued Logic)**
  *   **The Refusal:** "We will not be learning the formal notation of Modal Logic or Łukasiewicz's three-valued logic today."
  *   **The Argument:** Introducing formal systems requires learning a new syntax, which will consume the 45 minutes. We are doing *conceptual analysis*. We can discuss the *idea* of a truth-value gap without needing the symbolic machinery.

  ### Summary Timeline (45 Minutes)
  *   **00–05:** Intro & The Example (The Blue Tie). **Stipulate contingency.**
  *   **05–15:** The Argument. Define Bivalence. Apply to Tie. Derive Fatalism.
  *   **15–25:** The Distinction. Epistemic vs. Ontic. (Whiteboard columns).
  *   **25–35:** The Solution. Truth-Value Gaps. Address the "True/False" misconception.
  *   **35–40:** Scope Check. Explicitly rule out Physics/Formal Logic.
  *   **40–45:** Diagnostic Question & Wrap. Assign the "Tie Reveal" for next time.
