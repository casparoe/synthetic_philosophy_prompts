answer: |-
  You asked for a position rather than a survey, so I will skip the preamble about how complicated this is and go straight to the claim. The standard worry about biopics and historical fiction is that they harm the dead by misrepresenting them, but this collapses under the timing problem. The dead cannot be made worse off by things that happen after they cease to exist. If harm requires a subject who experiences the setback, the dead are invulnerable. Yet we still feel a strong, graded intuition that inventing things about the recently dead is worse than inventing things about the long-dead. The only account that explains this gradient is that the duty is not owed to the deceased at all. It is owed to the living. Specifically, it is owed to the people who knew them, to their descendants, and to audiences in their standing as people entitled not to be used as raw narrative material. The time-decay gradient is the smoking gun here. If the wrong were done to the subject, time would be irrelevant; a lie is a lie whether told a year or a century later. But if the wrong is done to the living community that holds the memory of the subject, the wrong naturally attenuates as that community dies out. The fading outrage tracks the disappearance of the people who could actually be hurt by the fabrication.

  This leads to the question of what exactly is being fabricated, and I want to argue that the moral line is drawn at witnessability. We need to distinguish between inventing outward acts and inventing private mental states. Invented acts look like lies, and they get policed harder, but invented thoughts are the deeper transgression. The reason witnessability matters more than falsifiability or reputational damage is that witnessability maps onto the possibility of consent. An outward act, even a private one, is in principle observable. Someone could have seen it. The subject could have been asked about it. They could have authorized the story or corrected the record. There is a logical space for consent, even if it wasn't taken. But a thought, a desire, or a motive is inherently unwitnessable. No one could have seen it but the subject, and no one can ask about it now. By inventing inner lives, the author bypasses the only mechanism that could legitimize the representation. They are not just lying about facts; they are occupying a space of interiority that was never public domain. Reputational damage is insufficient as a criterion because a positive fabrication can still feel like a violation, and falsifiability fails because many public acts are equally unfalsifiable after the fact. What makes the invention of thought uniquely wrongful is that it treats the subject's mind as public property when it was, by definition, the one thing that remained theirs alone. This violates the living witnesses who know that the mind was not public, and it violates the audience by presenting speculation as knowledge.

  Now, I know there are objections that seem to threaten this framework. The first is that positing a duty owed to the living regarding the dead looks like a philosophical workaround, a way to save the phenomenon by inventing a duty to nobody in particular. You might say it is simpler to admit our intuitions are just confused, a leftover superstition about the sanctity of the grave. But this dismisses the relational reality of grief and memory. When we protect the reputation or story of the dead, we are not protecting a ghost; we are protecting the integrity of the relationships the living had with them. To lie about a father to his children is to damage the children's relationship with their father, even if the father is gone. The duty is not strange; it is derivative. It is the same duty we owe the living not to corrupt their history, extended to cover the recent past where that history is still being processed. Our intuitions are not confused; they are tracking the density of living relationships. As those relationships thin out, the duty weakens. That is not confusion; that is precision.

  The second objection is harder, and it is the one I want to engage most directly. What about the person who left no descendants, no friends, no community, and no one who remembers them? A hermit who dies in obscurity. If I invent their inner life, and literally no living person is harmed or misled in a way that affects their relationships, your account seems to imply there is no wrong. If I say it is still wrong, I have to say who I am protecting. I will take the harder line here: if there are truly no living stakeholders, no descendants, and no audience that relies on this person for their understanding of history, then it is not wrong. This sounds cold, but it is the only consistent conclusion of the living-duty view. The intuition that it is still wrong is a heuristic overshoot. We feel it is wrong because we are used to cases where there are stakeholders, and we apply the rule universally to avoid the risk of missing a case where there are some. But in the strict null case, the prohibition dissolves. The duty runs to the living network of memory. If there is no network, there is no duty. To insist otherwise is to smuggle in a duty to the dead under another name, or to posit a duty to humanity in the abstract that lacks any specific bearer. I would rather admit that the wrong disappears when the living connections disappear than pretend there is a victim where there is none. This does not give carte blanche to lie to audiences generally, because most subjects of biopics do have an audience with expectations of truth. But in the limit case of the total isolate, the moral constraint vanishes because the relational ground it stands on is gone.

  So the position holds together. The timing problem kills the harm-to-the-dead account. The witnessability criterion explains why inner lives are off-limits in a way that outward acts are not, because only the latter allow for the logical possibility of consent. The objections regarding confused intuitions and isolated subjects are handled by recognizing that the duty is relational and contingent on the living community. We are not protecting the dead from slander. We are protecting the living from having their memory, their history, and their trust manipulated. When there is no one left to hold that memory, the duty expires. This might feel like a reduction of the sanctity of the person, but it is actually a clarification of where the moral weight actually sits. It sits with us, the living, and how we treat each other through the stories we tell about those who came before.
