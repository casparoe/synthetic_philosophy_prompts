  *   **Rule 1 (The Historical Constraint):** Content requires a selection history (phylogenetic or ontogenetic). Swampman (instant) has none, so no content. Swampman (6 months) has ontogenetic history, so content. GA history counts as phylogeny (consistent with Bacterium/Frog).
  *   **Rule 2 (The Consumer Fix):** The content of a signal is determined by the **Normal Explanation** of the *consumer's* use of that signal (Case 5: Bees). The consumer is selected to act only when certain conditions obtain.
  *   **Rule 3 (The "No Miracle" Constraint on Normal Conditions):** This is the crucial one that reconciles Case 1 and Case 2. The "Normal Conditions" for a mechanism are not what *should* have happened, but what *statistically supported the selection* over the relevant history.
      *   **Case 1 (Frog + Decoys):** Because decoys (BBs) were present during the selection history and did not eliminate the lineage, the "Normal Condition" cannot be "Fly." It must be the common denominator: "Dark Moving Thing." To say it represents "Fly" would require a miracle (that the mechanism was selected for Flies despite frequently firing for non-Flies without penalty).
      *   **Case 2 (Frog - No Decoys):** Because decoys were *never* in the history, the correlation between Mechanism and Food is perfect. Normal Condition = "Food."
      *   **Case 6 (Radiologist):** Her ontogenetic history contains Fractures and Successful Detections, but *no* False Positives (we assume her training filtered those out). Therefore, Normal Condition = "Fracture."

  **The Theory:** Content is the condition $C$ such that (a) $C$ caused the signal in the past, (b) the consumer's response conferred fitness because $C$ obtained, and (c) this correlation held with sufficient statistical robustness over the **entire relevant selection period** to explain the trait's fixation.

