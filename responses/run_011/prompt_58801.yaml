answer: |-
  This is a sharp observation. You have put your finger on the engine that drives much of the contemporary debate on emergence, specifically the literature surrounding Robert Batterman, Margaret Morrison, and the "singular limits" framework. You are correct that while the *physics* (singular limits) and the *metaphysics* (emergence) are well-labeled, the specific *argumentative structure* you describe—using the limit to block reduction while using the finite to secure ontology—often goes unnamed, treated instead as a natural consequence of the physics.

  Here is the breakdown you requested: the neighboring concepts, the assessment of soundness, and a precise carving of the move itself.

  ### 1. Nearest Established Concepts (and where they miss the mark)

  There are three concepts in the neighborhood. Each captures a facet of the pattern, but none captures the *dialectical toggle* you identified.

  **A. Singular Limits (Batterman/Morrison)**
  *   **The Concept:** A mathematical limit $\lim_{x \to \infty} f(x)$ is "singular" if the behavior of the function at the limit is qualitatively different from the behavior of the function for any finite $x$. (e.g., The free energy is non-analytic at $N=\infty$, but analytic for all finite $N$).
  *   **Where it fits:** This provides the physical justification for the first half of your pattern (the limit blocks reduction because the mathematical structure changes).
  *   **Where it fails:** "Singular Limits" describes the *mathematical relationship* between theories. It does not prescribe the *ontological argument*. One could accept singular limits and still be a reductionist (by arguing the finite approximation is sufficient for reduction). Your pattern describes a specific *use* of singular limits to secure irreducibility *and* realism simultaneously. The term "Singular Limits" is neutral on whether the property is "real" in the finite case.

  **B. Essential Idealizations (Batterman)**
  *   **The Concept:** An idealization is "essential" if it cannot be removed from an explanation without losing the ability to explain the target phenomenon. The infinite limit is an essential idealization for phase transitions.
  *   **Where it fits:** This captures the claim that we *need* the limit to make sense of the world.
  *   **Where it fails:** This focuses on *explanation*, not *ontology*. Your pattern is about the *existence* of the property. The "Essential Idealization" label doesn't capture the move of saying, "It doesn't exist in the lower theory (because of the idealization), but it does exist in the world (despite the idealization)." It risks conflating epistemic indispensability with ontological autonomy.

  **C. Asymptotic Emergence (Palacios/Valente)**
  *   **The Concept:** A property is asymptotically emergent if it arises only in the limit of a parameter, yet is relevant for finite systems.
  *   **Where it fits:** This is the closest metaphysical label. It acknowledges the limit/finite tension.
  *   **Where it fails:** It is a classification of the *relationship*, not the *argument*. It doesn't highlight the potential equivocation. It treats the coexistence of "limit-defined" and "finite-instantiated" as a settled metaphysical fact, whereas your prompt identifies it as a *move* that does work in an argument. It misses the strategic deployment you're noticing.

  ### 2. Is the Move Sound?

  Is there a defensible version of "irreducible because exact only in the limit"? Yes, but it relies on two specific philosophical commitments. If you reject either, the move collapses.

  **Condition A: Strict Identity Reduction**
  The move is sound only if you define reduction as requiring *strict type-identity* between the higher-level property ($H$) and some lower-level construct ($L$).
  *   **Why:** If reduction allows for *approximate* identity (e.g., $H \approx L$ within error bounds $\epsilon$), the limit argument fails. The reductionist can say, "For $N=10^{23}$, the finite magnetization is indistinguishable from the infinite limit for all physical purposes. Therefore, it reduces."
  *   **The Defense:** The anti-reductionist must argue that the *sharpness* of the phase transition is an essential feature of the phenomenon. If the transition is smeared (as it is in finite systems), it is a *different kind* of phenomenon. Therefore, approximate identity is not enough; you need the singularity.

  **Condition B: Structural Realism about Properties**
  The move is sound only if the identity of the higher-level property is tied to its mathematical structure in the successful theory.
  *   **Why:** If properties are defined functionally (e.g., "Magnetization is whatever causes the needle to move"), then the finite system clearly has the property, and it clearly reduces to atomic spins.
  *   **The Defense:** The anti-reductionist argues that "Magnetization" in thermodynamics is defined by non-analytic free energy. Since finite statistical mechanics yields analytic free energy, the finite system literally *does not have* the property defined by thermodynamics. It has a *surrogate* property.
  *   **The Vulnerability:** This invites the charge of "definition-stipulation." Why must we define magnetization by the infinite limit? If we define it by the finite behavior, the gap vanishes. The move is sound only if the infinite definition is privileged.

  **Verdict:** The move is **dialectically stable but ontologically precarious.** It works as a debate tactic because it forces the reductionist to either deny the reality of the phenomenon (eliminativism) or accept that the lower theory is mathematically incapable of describing it (irreducibility). However, it is vulnerable to a "functionalist" critique that rejects the privilege of the infinite limit definition.

  ### 3. Coining the Term: "The Asymptotic Ontological Pivot"

  Since no standard term captures the *argumentative structure* (as opposed to the physics), I propose we label this **"The Asymptotic Ontological Pivot."**

  **Definition:**
  An argumentative strategy in inter-theory relations where a higher-level property $P$ is:
  1.  **Defined** by a mathematical limit $L$ (e.g., $N \to \infty$) to establish that $P$ is not type-identical to any state in the lower-level theory (blocking Reduction).
  2.  **Instantiated** by finite systems that approximate $L$ to establish that $P$ is not merely a mathematical fiction (blocking Eliminativism).
  3.  **Concluded** to be ontologically autonomous because its identity conditions rely on $L$, but its causal powers rely on the finite approximation.

  The "Pivot" occurs because the arguer shifts the status of the limit: it is treated as **ontologically constitutive** when discussing reduction (you need the limit to be *that* property), but **physically dispensable** when discussing reality (you don't need the limit to *have* the property).

  **Boundary Cases:**

  *   **Inside the Concept (Fits the Pivot):**
      *   **Case:** **Spontaneous Symmetry Breaking in QFT.**
      *   **Why:** The property (broken symmetry) is strictly defined only in the infinite volume limit (Haag's Theorem). In finite volume, the ground state is unique and symmetric.
      *   **The Pivot:** Physicists argue you cannot reduce the broken phase to finite-volume QFT (because the math forbids it—the limit is constitutive). Yet, they insist finite systems (like superconductors) *are* in a broken symmetry phase (the property is real). The irreducibility is read off the gap between the finite math and the infinite definition.

  *   **Outside the Concept (Fails the Pivot):**
      *   **Case:** **The Ideal Gas Law ($PV=nRT$).**
      *   **Why:** The law is derived using the infinite particle limit ($N \to \infty$) to smooth out fluctuations.
      *   **The Failure:** No one argues that Pressure is *irreducible* because it requires $N \to \infty$. If you point out that finite gases have fluctuations, the response is not "Therefore Pressure is autonomous," but "Therefore the Ideal Gas Law is an approximation."
      *   **Distinction:** Here, the limit is treated as an **epistemic convenience**, not an **ontological constituent**. The property (Pressure) is allowed to be defined for finite systems (as mean momentum transfer). The Pivot is *not* deployed; the limit is not used to block reduction.

  ### Summary of the Carving

  The **Asymptotic Ontological Pivot** is distinct from general "emergence" because it relies specifically on the *mathematical singularity* to do the metaphysical work. It is distinct from "Singular Limits" because it describes the *philosophical deployment* of that math to secure a specific ontological conclusion (autonomy) while avoiding the cost (eliminativism).

  You can identify it in the wild by looking for this sentence structure:
  > *"Strictly speaking, $P$ requires [Infinite Limit] to be well-defined, so it cannot be reduced to [Finite Theory]; however, [Finite Systems] clearly exhibit $P$, so it is a robust feature of the world."*

  If the arguer treats the "Strictly speaking" clause as a barrier to identity, but the "However" clause as a guarantee of existence, they are pivoting.
