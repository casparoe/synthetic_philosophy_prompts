answer: |-
  The 2010 Nowak-Tarnita-Wilson controversy demonstrates that the units-of-selection debate was never the dispute this paper was prosecuting, but rather a conflict over modeling heuristics and causal attribution disguised as ontological disagreement.

  **Mapping the Units and Representations**
  Using Okasha's distinction, the critics defended Inclusive Fitness Theory (IFT) as a general accounting framework compatible with both MLS1 (selection on individuals within groups) and MLS2 (selection on groups as replicators), arguing that IFT is merely a mathematical transformation of the Price equation applicable at any level. Nowak, Tarnita, and Wilson (NTW) treated IFT not as a general transformation but as a specific MLS1-style model requiring weak selection and additive fitness effects, arguing it fails under the non-linear conditions typical of eusociality. In Dawkins's terms, the critics maintained the gene as the sole replicator and IFT as the necessary ledger for tracking replicator success, whereas NTW shifted focus to the vehicle (the colony) interacting ecologically, suggesting that standard natural selection on vehicles in structured populations renders the gene-centered ledger unnecessary. Consequently, much of the dispute was not about units of selection at all, but about representation: the critics defended IFT as a universal representational language, while NTW attacked it as a restricted modeling tool.

  **Engine vs. Ledger**
  The engine question asks where fitness differences causally arise, while the ledger question asks how to parameterize a model to account for variance in trait frequency. NTW attacked the ledger, claiming IFT cannot mathematically account for variance under strong selection or non-additive interactions, and simultaneously proposed a different engine, locating causal origins in ecological preadaptations and colony-level competition rather than relatedness coefficients. The signatories defended the ledger, invoking the Price equation to prove IFT's mathematical generality and variance-accounting capacity, while maintaining the standard engine of gene-centered selection driven by relatedness. The two sides rarely engaged the same question directly: NTW argued from model utility and causal ecology (engine/ledger hybrid), while the critics argued from formal equivalence (ledger). The vehemence of the response is explained by this mismatch; the critics perceived an attack on the ledger (IFT) as an existential threat to the engine (gene selection), whereas NTW viewed the ledger as merely a restrictive heuristic obscuring the true engine.

  **Where the Framework Goes Silent**
  The units-of-selection framework goes silent when faced with the Price equation's invocation as a neutral arbiter, because the Price equation demonstrates mathematical equivalence across levels without dictating causal primacy. Both sides claimed the Price equation supported their view, but the framework cannot adjudicate which decomposition of the equation offers better causal insight when the variance accounted for is identical. Furthermore, the framework cannot classify the conflict between mathematical generality and ontological reality; NTW issued a claim about mathematical restrictions (generality), but the community received it as an ontological claim (denying the reality of kin selection). The units framework assumes that distinct levels imply distinct causal stories, but it lacks the resources to explain why a debate about modeling convenience (which ledger is easier to use) escalated into a war about biological truth (which unit is real).

  **Verdict**
  This episode is evidence that the units-of-selection debate was never the dispute this paper was prosecuting. The conflict was not about whether groups or individuals are the true units of selection, but about whether a specific gene-centered accounting method (IFT) holds a monopoly on explanatory legitimacy. The theory itself was not anomalous; rather, the sociological structure of the field had conflated a specific modeling ledger with the causal engine of evolution, causing a methodological critique to be misinterpreted as an ontological heresy.
