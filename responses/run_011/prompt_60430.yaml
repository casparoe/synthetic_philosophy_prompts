answer: |-
  Your principle is surprisingly robust and handles the tension between your bounded rationality intuition and the Muddy Children case better than most formal accounts do. By distinguishing between what agents actually compute and what they are in a position to compute, you preserve the logical validity of the induction without attributing impossible cognitive loads to the children. This same distinction saves you from having to worry about whether the generals actually count to fifty levels of recursion; the issue there is not cognitive capacity but the structural lack of a common source. Your principle correctly identifies that private message chains, no matter how long, fail to create the public event required for common knowledge, which explains why the formal impossibility stands even if practical coordination happens anyway. This leads directly to your question about the referee's whistle. Since the whistle is a public event heard by everyone in the stadium, your principle predicts that common knowledge is established immediately, even if no spectator checks whether anyone else heard it. The sound itself is the common source, functioning exactly like the father's announcement in the Muddy Children case, so you should expect the crowd to share common knowledge of the foul just as the children share common knowledge of the muddy foreheads.

  However, when we turn to your game theory verdicts, the principle exposes a sharp contradiction in your set of intuitions that you cannot resolve without dropping one of them. You accept the unraveling argument in the finitely repeated prisoner's dilemma, which relies on common knowledge of rationality and the game structure to force defection from the first round. You reject the same unraveling logic in the Centipede game, arguing that taking the pot on the first move is wrong. Your principle treats the game structure in both cases as a public source, meaning common knowledge of the rules and rationality is present in both scenarios. If the epistemic conditions are identical, and you accept the logical consequence of backward induction in the prisoner's dilemma, you are committed to accepting it in the Centipede game as well. There is no epistemic difference between the two cases that your principle can latch onto to justify different outcomes; the logic of backward induction is structurally identical. To maintain consistency with your principle and your acceptance of the prisoner's dilemma verdict, you have to let go of your Centipede verdict. You cannot claim that public structure creates common knowledge sufficient for unraveling in one case but not the other without sprouting the very epicycles you want to avoid.

  The other cases fit more comfortably, though some remain independent of the principle. The Surprise Exam paradox is consistent with your verdict that the teacher wins, but your principle doesn't solve it; the error there lies in the self-referential definition of surprise rather than the source of knowledge. The Aumann Agreement Theorem is also consistent with your acceptance, but your intuition that friends shouldn't disagree even without a common prior actually goes beyond the theorem rather than conflicting with it. The theorem sets a sufficient condition for agreement, but you are positing a stronger normative claim about honesty and evidence that doesn't rely on the common prior assumption. This doesn't break your principle, but it does mean your intuition is stricter than the formal result. The Two Generals case is handled well because your principle explains the lack of common knowledge while your practical verdict allows for action based on high probability rather than certainty. Ultimately, though, the price of keeping your principle and your prisoner's dilemma conviction is the Centipede intuition. You have to accept that if the logic holds for one, it holds for the other, and since you seem willing to accept the harsh logic of the prisoner's dilemma, you should apply it to the Centipede game as well.
