answer: |-
  You have identified a genuine and under-theorized rhetorical structure in the philosophy of biology. It is not merely a confusion of terms, nor is it the standard pluralism defended by philosophers like John Dupré or Marc Ereshefsky. Those accounts argue that multiple classifications are *ontologically* legitimate because the world is complex. Your observation is about *argumentative* legitimacy: how the *usage* of a single term within a single paper is managed to evade empirical commitment.

  The standard labels you rejected are indeed near misses for the reasons you specified. **Equivocation** implies a fallacy where the switch is illicit; here, the switch is licensed by the community's acceptance of pluralism. **Motte-and-Bailey** requires one position to be indefensible (the Bailey); here, both the etiological and causal-role positions are defensible (two Mottes). **Promiscuous Realism** is an ontological claim about the world, not a pragmatic claim about how to write a discussion section to survive peer review.

  Since there is no existing term that captures this specific *unmarked alternation between defensible truth-conditions to prevent falsification*, I will coin a label for it.

  ### The Phenomenon: Unmarked Functional Switching (UFS)

  **Definition:**
  Unmarked Functional Switching occurs when an author employs a functional term (e.g., "the function of X") within a single argumentative chain, alternating between etiological (historical/selected) and causal-role (current capacity) truth-conditions without signaling the shift, such that the overall claim becomes immune to falsification by evidence that would refute either sense in isolation.

  **Necessary Conditions:**
  1.  **Polysemy:** The term used must have at least two distinct, philosophically recognized senses (e.g., Selected Effect vs. Causal Role).
  2.  **Unmarked Alternation:** The text must shift between these senses across premises or claims without explicit qualification (e.g., no "in the evolutionary sense..." vs. "in the physiological sense...").
  3.  **Immunization:** The switching must occur in a context where empirical evidence exists that would falsify the claim *if* one sense were held consistently. The switch allows the author to retreat to the sense that survives the specific critique at hand.

  **What Does Not Count (Boundary Conditions):**
  *   **Explicit Pluralism:** An author who states, "We use 'function' in the causal sense here, though we acknowledge the etiological history is unclear," is not engaging in UFS. They have fixed the truth-conditions.
  *   **Genuine Conflict:** If a paper argues that a trait *cannot* have a function because it lacks a selection history (etiological) despite having a capacity (causal), they are forcing a choice. UFS avoids the choice.
  *   **Ontological Pluralism:** A paper arguing that *both* functions exist simultaneously as distinct properties (e.g., "X has the selected function Y and the causal function Z") is not UFS. UFS conflates them into a single predicate "the function" to support a singular conclusion.

  ### Structural Analysis: The "Twin-Motte" Defense

  You correctly noted that this is not a Motte-and-Bailey fallacy. In a standard Motte-and-Bailey, the author retreats from an indefensible claim (Bailey) to a defensible one (Motte) when challenged. In UFS, the author maintains **Two Mottes**.

  Imagine a fortress with two defensible towers connected by a wall that is not drawn on the map. When attacked from the North (by a historical critic saying "no selection history"), the author retreats to the South Tower (Causal Role: "but it does this job now"). When attacked from the South (by a mechanistic critic saying "no measured capacity"), the author retreats to the North Tower (Etiological: "but it was selected for this").

  Because both towers are defensible, the author never appears to be making a false claim. However, the *connection* between the towers—the implication that the current job explains the history, or that the history validates the current job—is often the very point of the paper. UFS allows the *implication* of a link without the *commitment* to a link.

  ### Is This an Epistemic Vice?

  You asked whether this is a real vice or a benign division of linguistic labor. I argue it is a **significant epistemic vice**, specifically a form of **Terminological Immunization**.

  **1. It Stalls Empirical Resolution:**
  The central project of evolutionary biology is often to distinguish adaptation from exaptation from drift. UFS allows papers to conclude "X is functional" without resolving whether X is an adaptation. If the field accepts UFS, the literature accumulates claims of "function" that do not aggregate into knowledge about *why* the trait exists. It creates a fog where the historical question is answered with physiological data, and the physiological question is answered with phylogenetic inference.

  **2. It Exploits the "Division of Labor" Without Paying the Cost:**
  A benign division of linguistic labor (to borrow Putnam's phrase) works when experts agree on who determines the reference. Here, the "labor" is split between the historian and the physiologist, but the *credit* is claimed by the single author for a unified explanation. The author gets the explanatory power of adaptationism (the trait is *for* something) without the evidentiary burden of proving selection.

  **3. It Corrupts the Inferential Chain:**
  In a valid argument, the truth-conditions of the premises must match the truth-conditions of the conclusion. If a paper argues:
  *   (P1) Protein X has capacity Y (Causal Role).
  *   (P2) Traits with capacity Y are beneficial (Causal Role).
  *   (C) Therefore, Protein X was selected for Y (Etiological).
  This is a non-sequitur. UFS hides this non-sequitur by using the word "function" in P1 and C without marking the shift. It allows the *is* (capacity) to slide into the *ought* (selected purpose) silently.

  ### Why It Persists (The Benign Illusion)

  It looks benign because it is **heuristically efficient**. In the daily grind of lab work, distinguishing between "what it does" and "why it's there" is often impossible without data that doesn't exist yet. UFS allows scientists to write coherent narratives that bridge the gap between molecular data (causal) and evolutionary stories (etiological) while waiting for the hard evidence to catch up. It keeps the conversation moving.

  However, efficiency is not truth. When this rhetorical move becomes the standard rather than the placeholder, the field risks building a taxonomy of "functions" that are neither truly historical nor truly mechanistic, but a hybrid that satisfies reviewers without satisfying nature.

  ### Summary

  The phenomenon is **Unmarked Functional Switching**. It is a **Twin-Motte** structure that utilizes the legitimate pluralism of function concepts to create **Terminological Immunization**. It is an **epistemic vice** because it renders specific evolutionary claims unfalsifiable by allowing truth-conditions to shift post-hoc in response to critique. It is distinct from equivocation because the ambiguity is socially licensed, and distinct from promiscuous realism because it concerns argumentative consistency rather than ontological commitment.

  You are not imagining this. It is the rhetorical cost of a field that has accepted a philosophical pluralism without integrating the methodological discipline required to manage it.
