answer: |-
  Here is an analysis of the ontological commitments embedded in your data governance practices, structured according to your four requirements.

  ### (a) Reconstructing the View: Causal-Historical Individuation

  Your three features jointly presuppose a view of individuation best described as **Causal-Historical Individuation**.

  On this view, what makes a participant the specific individual they are is not a collection of qualities (name, genome, date of birth) but a specific history of origin and continuity. The system treats the participant as a continuant entity that enters the study's causal sphere at a specific moment (enrolment) and persists through time, regardless of changes to their descriptive attributes.

  **The Primary Key as a Causal Anchor**
  You asked how the primary key (the integer) is best read. It is not a "primitive thisness" (a metaphysical tag inherent to the person's soul), nor is it merely a bookkeeping convenience. It is a **Rigid Designator anchored in an Event**.

  *   **Rigid Designator:** The number refers to the same entity in every possible context within the database, regardless of how that entity's properties change. If the participant changes their name, sex, or even (hypothetically) their genome via therapy, the integer remains the same because it designates *that* history, not *those* qualities.
  *   **Anchored in an Event:** The integer is generated by the *event of enrolment*. The distinctness of Twin A and Twin B is grounded in the distinctness of their enrolment events (two bodies presenting at the clinic, two distinct causal interactions with the study apparatus). The integer records the fact that "a person entered the system here."

  **The View of "Two-ness"**
  Under this reconstruction, two things are "two" if they have distinct causal origins, even if they share all qualitative properties. The system commits you to the claim that **numerical distinctness does not require qualitative difference.** The twins are two because they are two distinct causal threads entering the archive, not because they have different surnames or genomes.

  Feature 3 (the merge rule) might seem to contradict this, but within this view, Feature 3 is not a metaphysical claim; it is an **Epistemic Heuristic**. It says: "In the absence of evidence to the contrary, we assume qualitative identity implies numerical identity." It is a rule for managing *knowledge*, not a rule for defining *being*. Feature 1 defines the being; Feature 3 manages the uncertainty of the record.

  ### (b) Presuppositions vs. Compatibility

  It is crucial to distinguish what your system *forces* you to believe versus what it merely *tolerates*.

  **What is Strictly Presupposed**
  Your practice strictly presupposes the **falsity of the Identity of Indiscernibles**.
  *   *The Principle:* The Identity of Indiscernibles (PII) states that if two entities share all qualitative properties, they are numerically identical (i.e., they are the same one thing).
  *   *The Commitment:* Your Twin Case violates PII. You assert that two entities can share all substantive fields (surname, DOB, sex, genome, address) and yet remain numerically distinct (two rows, two IDs).
  *   *The Constraint:* Therefore, your system is **unavailable** to a strict Qualitative Individuationist who believes distinctness *must* be grounded in a qualitative or relational difference. If you held that view, you would be forced to merge the twins in the absence of a National ID, because there would be no "ground" for their distinctness.

  **What is Merely Compatible**
  Your system is compatible with **Haecceitism** (the view that individuals have a primitive "thisness" over and above their qualities), but it does not require it.
  *   *The Haecceitist:* Can say the integer tracks the primitive "thisness."
  *   *The Spatio-Temporalist:* Can say the integer tracks the distinct spatio-temporal location of the enrolment event.
  *   *The Compatibility:* Both can use your system because both accept that distinctness can exist without qualitative difference. The integer functions as a **Surrogate for Distinctness**. For the Haecceitist, it proxies the "thisness." For the Spatio-Temporalist, it proxies the "origin point."

  **What the Integer is Doing for Rivals**
  *   **For the Qualitative Individuationist (who denies your presupposition):** They cannot use your system as designed. To make it work, they would have to treat the Integer itself as a "quality." They would have to say, "Twin A and Twin B are qualitatively different because Twin A has the property *ID=1000001* and Twin B has *ID=1000002*." This turns the ID from a tracker into a constitutive property.
  *   **For the Haecceitist:** The integer is a public label for a private metaphysical fact.

  ### (c) Consistency and Scoping

  The first and third features are **consistent but differently scoped**. They operate in different domains: Feature 1 is *Ontological* (what exists), and Feature 3 is *Epistemic* (what we can verify).

  The tension you feel arises because Feature 3 (Merge) has the power to overwrite Feature 1 (Distinct Rows) if not carefully constrained. In the Twin Case, if you lacked the National ID (Feature 2), Feature 3 would instruct you to merge them (since they agree on all substantive fields), thereby violating the reality captured by Feature 1 (that they are two people).

  **The Scoping Principle**
  To resolve this for your engineers, you need a principle that prioritizes the Causal-Historical thread over Qualitative Agreement when independent evidence of distinctness exists.

  **The Principle of Causal Priority:**
  > "Qualitative agreement presumes numerical identity *only in the absence of evidence for distinct causal origins*."

  **Engineer's Application Rule (for a Tuesday afternoon):**
  1.  **Default:** If two records match on all substantive attributes (Feature 3), treat them as one participant (merge).
  2.  **Exception:** If there is evidence of distinct *entry events* (e.g., two separate enrolment dates, two separate clinic visits, or a National ID difference), **do not merge**, even if all other attributes match.
  3.  **Hierarchy:** The Primary Key (Feature 1) represents the *Causal Thread*. The Unique Constraints (Feature 2) represent *External Verification*. The Merge Rule (Feature 3) represents *Error Correction*. Error Correction cannot override External Verification or established Causal Threads.

  In the Twin Case, the "independent evidence" required to block the merge is the **distinct enrolment event** itself (two rows created at different times/sequences), or the National ID. If the National ID is stripped, the distinct enrolment sequence (1000001 vs 1000002) must be treated as "independent evidence" to prevent the merge.

  ### (d) The Rival View and Concrete Changes

  The most natural rival to your current view is **Descriptivism (or Qualitative Individuation)**.
  *   *The View:* A participant is nothing over and above the sum of their attributes. There is no "underlying entity" tracked by an arbitrary number. If the attributes change, the identity changes.
  *   *The ID:* The identifier should not be an arbitrary integer (Surrogate Key) but a **Natural Key** derived from the data itself (e.g., a hash of Surname + DOB + Sex + National ID).

  **Concrete Change for the Committee**
  To adopt this rival view, you would propose the following schema change:

  > **Proposal:** "Abolish the permanent arbitrary integer. Replace the Primary Key with a Composite Natural Key generated from the unique substantive attributes (National ID, or Surname+DOB+Sex). If these attributes change or are corrected, the Participant ID changes."

  **What You Would Lose**
  You would lose **Longitudinal Continuity through Error and Change**.
  1.  **Data Fragmentation:** If a participant marries and changes their surname, or if a data entry clerk makes a typo in the Date of Birth, the system would generate a *new* ID. The participant's history would be split into two disconnected fragments. You would no longer be able to track the "person" through administrative noise.
  2.  **Pre-Name Observations:** You noted that observations are attached to the ID "before we knew the person's name." Under Descriptivism, you cannot assign an ID until you have the descriptive attributes. You would lose the ability to blind-enrol participants or track anonymous samples that are later identified.
  3.  **The Twin Problem:** Ironically, while Descriptivism handles the twins well (different National ID = different Key), it fails if the National ID is missing. Without the arbitrary integer to hold the place of the "causal thread," you would have no way to distinguish the twins at all, forcing a merge that erases one of them.

  **Honest Statement of Loss:**
  "By moving to a Natural Key system, we gain metaphysical parsimony (we only store what we know), but we lose the ability to assert that a participant is the *same entity* over time when our *knowledge* of them changes or is imperfect. We trade the stability of the archive for the accuracy of the description."

  ### Summary for Your Report
  Your current practice commits the study to **Causal-Historical Individuation**. You treat participants as persistent entities defined by their entry into the study, not by their attributes. The arbitrary integer is a **rigid designator** of that causal history. The tension between the integer and the merge rule is resolved by recognizing that the merge rule is an **epistemic tool** for cleaning data, not an **ontological rule** for defining persons. To maintain consistency, your engineers must treat distinct enrolment events as sufficient evidence to block merging, preserving the distinctness of the twins even in the absence of qualitative differences.
