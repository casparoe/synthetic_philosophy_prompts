  7.  **Final Polish:** Check transitions. Ensure the voice is appropriate for a doctoral student (sophisticated, precise, philosophical). *Self-Correction:* Make sure I explicitly address the "natural phenomenon" aspect in section 1. Ensure the "pathology" point in section 3 is clear.

