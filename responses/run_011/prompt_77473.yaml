          *   *Assessment:* **Highly Controversial/Philosophically Dubious.** This is the biggest philosophical error. To add utilities meaningfully in a social welfare function, the scales *must* be fixed relative to one another. The vNM theorem gives $u_i$ unique up to affine transformation ($a u_i + b$). To sum them, you need to fix the zero and the unit for *all* individuals relative to a common standard. Harsanyi argues the Impartial Observer argument *provides* the interpersonal comparison (via the equiprobability model). Saying "adding two people's numbers isn't comparing them" is nonsense mathematically and philosophically. If I measure your happiness in "Heds" and mine in "Dols", adding them is meaningless without a conversion rate (comparison). The student claims Harsanyi avoids IPC. Most literature says Harsanyi *derives* IPC from the veil of ignorance, he doesn't avoid it.
          *   *Correction:* The theorem *presupposes* fixed scales (which implies IPC) or the Impartial Observer argument *establishes* the IPC necessary to fix the weights and scales. Claiming "nothing as contentious as the claim that my happiness and yours can be measured on the same scale" is wrong; that is exactly what is required to sum them.

