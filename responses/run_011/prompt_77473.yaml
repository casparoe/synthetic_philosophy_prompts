      *   *Claim 8:* "The theorem... says nothing about the values of the $a_i$. It leaves open a weighted utilitarianism... To reach classical utilitarianism you need the weights equal, which is where Harsanyi's other argument comes in."
          *   *Assessment:* Solid. Good distinction.
