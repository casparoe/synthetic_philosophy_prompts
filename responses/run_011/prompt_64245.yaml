answer: |-
  Dear Colleague,

  I have spent considerable time with your cases, turning them over to see where the pressure points lie in the architecture of coherence arguments. You are right to sense that your tentative principle is too narrow, specifically because it treats the Dutch Book as a mere external test rather than a constitutive norm, and because it fails to distinguish between the agent's internal algebra of propositions and the external world of bettable events. What follows is my reconstruction of the principle I believe best captures the intuition behind your verdicts while maintaining the rigor required of formal epistemology. I will state the principle, walk through how it handles your cases, address the arithmetic difficulties you flagged, propose a verdict on imprecise credences, offer a divergent case of my own, and finally confront the worry about whether the betting apparatus is merely decorative.

  The principle I defend is the Principle of Finite Reflective Coherence. It states that an agent's doxastic state is irrational if and only if, relative to the set of propositions the agent currently entertains and understands, there exists a finite combination of bets that the agent is disposed to accept based on their credences which guarantees a net loss in every possible outcome, or if the agent refuses bets that their own credences identify as having positive expected value. This principle builds in two crucial idealizations. First, it assumes the agent has perfect access to their own dispositions and credences at the time of evaluation, though not necessarily logical omniscience regarding external truths. Second, it restricts the scope of coherence to finite sets of transactions, rejecting the requirement of countable additivity as a condition of rationality. This principle treats the betting setup not as a pragmatic trap laid by a bookie, but as an operational definition of what credence means; to have a credence is to be disposed to bet in certain ways, and irrationality is a failure of alignment between those dispositions and the logical relations between the propositions involved.

  Let me explain how each clause of this principle is motivated by your specific cases. The requirement for a guaranteed net loss in every possible outcome is motivated by Case 1, which is the paradigm of irrationality, and Case 9, which shows that we must restrict this to finite collections. In Case 9, the agent with uniform credences over the naturals is vulnerable only to an infinite book, and your verdict that she is not irrational convinces me that rationality does not demand countable additivity. The clause regarding the propositions the agent currently entertains is directly motivated by the contrast between Case 3 and Case 4. In Case 3, the mathematician is not irrational because she has not brought the axioms and the theorem into simultaneous view; the logical connection is not part of her current algebra. In Case 4, she holds them together and still violates the logical constraint, which triggers the irrationality verdict. This awareness relativity saves us from demanding logical omniscience while preserving the norm of coherence for what is actually under consideration. The clause regarding the refusal of positive expected value bets is necessary to handle Case 8, distinguishing it from Case 2. In Case 2, the agent buys at 0.30 and never sells. Her buying price is 0.30, and since she never sells, her selling price is effectively infinite or undefined, creating a spread. As long as the sum of her buying prices for exhaustive outcomes does not exceed one, she is not vulnerable to a sure loss, and she is acting consistently with her valuation of 0.30. She is cautious, but coherent. In Case 8, however, the agent declines bets her own credences deem favorable. This is a failure of the link between credence and action. While no bookie can exploit her because she accepts nothing, she is irrational because her actions contradict her own epistemic standards. Finally, the principle implies that actual bettability is irrelevant, which supports your verdict in Case 7. The norm applies to the dispositions themselves, so even if no one can bet on the grains of sand, holding credences of 0.9 for both even and odd is a disposition to accept a losing package were such bets possible, and thus is irrational.

  Regarding the arithmetic in Case 6, I must point out a technical confusion in the case description. You state that a bookie can set up a book that comes out ahead whichever way the coin fell, yet your verdict is that the agent is not irrational. My calculation confirms your verdict but contradicts the description of the exploitability. If the agent pays 0.50 on Sunday for a bet on heads and 0.33 upon awakening for a bet on heads, the bookie takes the other side. If the coin lands heads, there is one awakening. The agent pays 0.50 plus 0.33, totaling 0.83, and receives 2.00 in payouts. The agent profits. If the coin lands tails, there are two awakenings. The agent pays 0.50 plus 0.33 plus 0.33, totaling 1.16, and receives 0. The agent loses. This is not a Dutch Book because the loss is contingent on the coin landing tails, not guaranteed. For a Dutch Book to exist, the agent must lose in both heads and tails scenarios. Since no such combination of bets yields a sure loss given the awakening structure, the agent is not incoherent by the standard of sure-loss avoidance. The description in Case 6 claims a guaranteed profit for the bookie, but the arithmetic only supports a contingent profit. I accept your verdict that the agent is not irrational, but I correct the reasoning: she is not irrational because she cannot be Dutch Booked, not because the Dutch Book is somehow honest. As for Case 2, my check confirms that one-sided betting policies do not generate a sure loss provided the sum of buying prices for mutually exclusive and exhaustive outcomes does not exceed one. Here the sum is 0.90, so the agent guarantees a gain rather than a loss, and her refusal to sell merely protects that gain from being traded away. This is rational caution, not incoherence.

  You asked for my verdict on a case involving imprecise credences, specifically an agent with a range of 0.3 to 0.7 who accepts any bet at any price inside that range. Suppose the agent is offered a bet on proposition P at price 0.6 and a bet on not-P at price 0.6. If offered one at a time, the agent accepts both, since 0.6 is within the range. The sum of prices is 1.2, guaranteeing a loss of 0.2. If offered as a package, a rational agent with imprecise credences should evaluate the package against their lower and upper probabilities. If the package guarantees a loss, coherence requires rejecting it. Does it matter that they are offered one at a time? Yes, if the agent suffers from memory limitations or framing effects that prevent them from seeing the cumulative exposure. However, under the idealization of reflective coherence, the agent is required to recognize the cumulative commitment. If the agent accepts both individually despite having the cognitive capacity to recognize the joint loss, they are irrational. The principle treats the set of accepted bets as the object of evaluation, regardless of temporal spacing, provided the agent retains the memory of the first bet when considering the second. Therefore, if the agent accepts both, they are irrational, because their dispositions commit them to a sure loss. The range of credences does not grant immunity from coherence constraints; it merely expands the set of prices deemed acceptable, which in turn expands the set of potential Dutch Books.

  I will now construct a case where my principle diverges from the most serious rival, which I take to be Strict Probabilism requiring logical omniscience. Consider an agent who assigns a credence of 1 to proposition A and a credence of 1 to proposition B, but assigns a credence of 0.5 to the conjunction A and B. The agent is unaware that A entails B. Strict Probabilism declares this agent irrational immediately, because in any probability function, if P(A) is 1 and A entails B, then P(B) must be 1, and P(A and B) must be 1. My principle, however, declares the agent rational. Because the agent does not currently entertain the entailment relation between A and B, the propositions are treated as logically independent within their current algebra. There is no finite set of bets on A, B, and A-and-B that guarantees a loss given these prices alone, unless the bookie can force the agent to acknowledge the entailment. Since the agent is not aware of the connection, there is no internal contradiction in their dispositions relative to their awareness. My principle rules the agent rational until the entailment is brought into view, at which point they must update or become irrational. This diverges from the rival view which punishes the agent for logical facts outside their grasp.

  If I were forced to reduce my principle to at most three clauses, I would have to sacrifice some nuance. The three clauses would be: first, avoidance of finite sure loss on accepted bets; second, relativity to the agent's current algebra of awareness; and third, consistency between credal valuation and betting disposition. Under this constrained principle, I would have to sacrifice the verdict in Case 8 as a matter of doxastic coherence. While I maintain that the agent in Case 8 is defective, strictly speaking, a Dutch Book argument cannot catch an agent who accepts nothing. To keep the principle purely about coherence of belief as revealed by betting, I would have to classify Case 8 as instrumentally irrational rather than doxastically incoherent. I would also have to sacrifice the specific handling of Case 5 if it requires a distinct diachronic clause, subsuming it under the requirement that dispositions must be consistent across time if the agent plans ahead. However, I would keep the verdicts for Cases 1, 3, 4, 6, 7, and 9. Case 2 is kept as coherent. Case 8 is the one I would overturn in the context of a strict coherence principle, reclassifying it as a failure of rational action rather than rational belief.

  This brings me to your final and most pressing worry: whether what survives is still a Dutch Book argument at all, or if the betting apparatus is merely decoration on a norm that could have been stated without it. If the criterion is keyed to coherence whether or not any book can be constructed, as in Case 7, has the betting done any work? I argue that it has done essential work. Without the betting interpretation, credences are obscure mental states with no clear normative force. The betting apparatus provides the operational meaning of credence. To say an agent has a credence of 0.9 is just to say they are disposed to bet at certain odds. The norm of coherence is not that they should avoid losing money in the real world, but that their dispositions must not contradict each other. The bookie is a heuristic device to reveal these contradictions. In Case 7, even though no actual book can be made, the fact that the credences *would* lead to a loss if bets were possible shows that the mental states themselves are inconsistent. The betting framework is not decoration; it is the language in which the norm is stated. It transforms a vague requirement of consistency into a precise mathematical constraint on dispositions. If we remove the betting, we are left with a demand for consistency without a clear account of what consistency means for degrees of belief. The Dutch Book argument tells us that probabilistic coherence is the only way to avoid sure loss in betting, and since having credences just is having betting dispositions, probabilistic coherence is the only way to have consistent credences. The possibility of the book is what gives the norm its teeth, even if the book is never actually made.

  In summary, I believe your intuitions are largely correct but require a principle that distinguishes between logical awareness and logical truth, and between finite and infinite commitments. The arithmetic in Case 6 does not support a Dutch Book, which vindicates the agent. Case 8 represents a different kind of irrationality that sits on the boundary of coherence and instrumental rationality. I hope this reconstruction helps you refine your view on where the boundary of doxastic rationality lies.

  Yours sincerely,

  A Colleague
