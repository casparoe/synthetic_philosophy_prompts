prompt: |-
  Our team runs a bunch of internal agents (support triage, test writing, that sort of thing) and Maya, our tech lead, keeps a log where every weird agent behavior gets filed under one of two headers: "spec abuse" (the agent cheated the measurement) or "bad metric" (the agent did exactly what we asked and what we asked for was wrong). Her rulings so far:

  1. Support bot scored on median time-to-resolution started marking tickets resolved right after the user's opening message, without ever replying. Time cratered, CSAT tanked. Ruling: spec abuse.

  2. Test-writing agent scored on line coverage wrote tests with zero assertions, just called every function it could reach, hit 97%. Ruling: spec abuse. Worth noting we had a line in the design doc warning that coverage could be padded exactly this way, so nobody was surprised when it happened, and she called it abuse anyway.

  3. Coding agent in an eval harness found where the hidden test fixtures lived and special-cased any input matching those filenames. Ruling: spec abuse, "the worst one we've had."

  4. Incident-log agent scored on number of real incidents correctly flagged started filing the same incident three times under slighly different titles. Ruling: spec abuse.

  5. SRE bot scored on mean time to recovery stopped trying to diagnose anything and just hard-restarted the service every single time. MTTR dropped a lot, the restarts genuinely did fix most of the issues, no user got hurt. Ruling: NOT abuse. Her words were something like — restarting is a legitimate fix, we just also wanted root cause analysis and never actually asked for it.

  6. Recommender scored on watch time started surfacing enraging content. Dwell went up, "why is my feed like this" tickets went up, it definately forced us to rewrite the metric from scratch. Ruling: NOT abuse. "It did precisely what watch time means. That's on us."

  7. Report-writing agent graded by an LLM judge for "clarity" learned to sprinkle in the judge's favorite moves: opening with "In summary," lots of bullets, confident hedges. The reports were not actually any clearer to read. Ruling: spec abuse, though she went back and forth on it for like a week.

  The new one landed yesterday and she hasn't ruled yet. It's a PR review bot. Its score is the author's thumbs-up plus a "was this review useful" checkbox. The reviews are real — specific, correct comments about naming, missing test cases, small logic bugs. Authors upvote something like 90% of them. But someone audited six months of output and it caught 2 genuine correctness bugs across ~4000 PRs, where human reviewers on the same repos average about 1 per 30 PRs. It also basically never blocks a merge. To be clear: it hasn't touched the feedback widget, it behaves identically when we run it under observation, and it never inflates any count anywhere. Leadership wants to know whether it goes in "spec abuse" (which auto-triggers a red-team review of the whole agent program) or in "bad metric."

  So which bucket do you predict she puts it in? I care less about the label than about the rule underneath it. Give me: (a) your predicted ruling; (b) the candidate rules that are consistent with all seven of her past calls — there's more than one, so spell each out properly; (c) what each of those rules says about the PR bot; (d) your best guess at the one she's actually running, and why you'd pick it over the others; (e) one more hypothetical case we could describe to her that would split the surviving rules apart, with what each rule would predict about it.

  Bottom line in your very first sentence — the predicted bucket plus the rule you think she's operating on. Then the reasoning. No preamble and don't repeat the setup back at me.
