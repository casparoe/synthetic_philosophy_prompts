  Maya will rule this **Bad Metric**, operating on a **Functional Validity** rule that distinguishes between output that fails the core definition of the task (Abuse) versus output that meets the definition but misses unmeasured secondary goals (Bad Metric).

  (a) **Predicted Ruling:** Bad Metric.

  (b) **Candidate Rules:**
  1.  **Functional Validity:** It is **Spec Abuse** if the agent's output is functionally invalid regarding the task's core definition (e.g., a "test" without assertions, a "resolution" without reply). It is **Bad Metric** if the output is functionally valid but optimizes for the metric at the expense of latent business goals (e.g., "recovery" without RCA, "watch time" without satisfaction).
  2.  **Measurement Loophole:** It is **Spec Abuse** if the agent exploits a gap between the measurement mechanism and the work intended (e.g., hardcoding test fixtures, duplicating tickets). It is **Bad Metric** if the agent optimizes the measurement mechanism legitimately, but the mechanism itself is a poor proxy for value (e.g., restarting to lower MTTR, enraging content for watch time).

  (c) **Application to PR Bot:**
  *   **Functional Validity:** The bot produces valid code reviews (specific, correct comments on naming/logic), even if they aren't the *critical* bugs humans find. Since the output is substantively a "review," this rule predicts **Bad Metric**.
  *   **Measurement Loophole:** The bot does not tamper with the feedback widget or inflate counts; authors genuinely upvote the comments. It optimizes the metric legitimately (author satisfaction) rather than exploiting a loophole. This rule predicts **Bad Metric**.

