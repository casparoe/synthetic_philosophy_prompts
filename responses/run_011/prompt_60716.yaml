  1. **The correspondence**

  | Source (Title Practice) | Target (Entitlement Theory) |
  | :--- | :--- |
  | Deed | Voluntary Transfer |
  | Chain of Title | History of Holdings |
  | Clean Search | Just Entitlement |
  | Clerk | State Adjudicator |
  | Root Deed | Original Appropriation |
  | Curing Rules | Statutes of Limitation/Rectification |
  | Registry | Legal Framework |

  The lawyer maps the mechanical validation of property history onto the moral validation of holdings. In this schema, justice is archival rather than distributive. The "clerk" represents a state that enforces rules without judging outcomes. The "root deed" corresponds to Lockean original acquisition, while "curing rules" mirror limitations on rectifying past injustices. The registry acts as the institutional memory ensuring continuity. This mapping suggests that if the procedural history is unbroken, the current distribution is morally inert, requiring no further justification beyond the validity of past transfers.

  2. **Disanalogies that bear weight**

  Your first hypothesis holds significant weight. Title practice is not purely historical; curing rules like adverse possession explicitly sacrifice historical accuracy for present stability. This is a distributive choice favoring security over rectitude, undermining the claim that the system avoids "contested theories of the good." Determining where to stop looking backward is a policy decision about who bears the loss of historical error, which is inherently distributive. Thus, the "administrable" procedure relies on hidden end-state judgments. The clerk cannot simply check boxes; she must apply policy limits on history.

  Your second hypothesis also strikes deep. The registry is not a night-watchman; it constitutes ownership. Without the state's power to invalidate and re-record, the "chain" is meaningless. This contradicts the Nozickian claim that liberty upsets patterns. Here, the state *creates* the pattern of ownership through the registry. Furthermore, the Chamberlain argument concerns liberty versus patterned distribution, but title law validates ownership against *private* rivals, not public taxation. A clean chain protects against a neighbor's claim, not the sovereign's levy. Equating private validity with public immunity is a category error. The analogy assumes the registry's existence is costless, ignoring that the infrastructure validating the chain requires public funding—precisely what LVT proposes to supply. Therefore, the claim that LVT is interference akin to breaking a chain fails; LVT is the maintenance fee for the registry itself. The lawyer's claim that this is administrable ignores that the registry's power is the very thing being taxed. The state is not an external observer of the chain; it is the chain's author.

  3. **Disanalogies that do not bear weight**

  Some mismatches are superficial. That title law concerns physical land while Nozick concerns abstract rights is irrelevant; both deal with transferable entitlements. Similarly, that title searches are often private commissions while justice is public does not damage the logic. The lawyer can argue the *structure* of validation is identical regardless of who pays the clerk. Finally, jurisdictional variations in property law do not invalidate the universal principle being illustrated. A defender can absorb these by noting the analogy is illustrative of logical form, not institutional detail. These objections mistake the map for the territory without challenging the navigational logic. Even if the clerk is private, the logical requirement for a valid chain remains the same. The physical nature of land does not alter the moral structure of transfer.

  4. **What the analogy smuggles in**

  The analogy smuggles in statist assumptions incompatible with Nozickian liberty. First, the "root deed" in title law is ultimately a grant from the Sovereign (Crown or State). Nozick's theory rests on pre-political self-ownership. By using title law, the lawyer implicitly concedes that all property flows from state authority, undermining the libertarian claim to natural rights. Second, the power to declare a chain "closed" resides with the Registry, a public authority. This assumes the state has the standing to define justice, whereas Nozick views the state as a protective agency limited by individual rights. The state decides when history is irrelevant. Finally, the analogy imports the utilitarian value of market stability (via curing rules) while claiming deontological purity. It assumes security of tenure is a higher good than historical rectitude, a substantive value judgment disguised as procedural neutrality. This contradicts the claim that the system is neutral regarding the good.

  5. **Verdict**

  Neither claim survives intact. Claim 1 (Administrability) fails because curing rules reveal that "clean chains" require policy choices about distributional security, not just factual verification. The clerk cannot operate without a prior theory of how much history matters. Claim 2 (Chamberlain) fails because title law validates rights against private claims, not public taxation. The registry itself is a public good maintained by authority, making the comparison to LVT incoherent. However, a Nozickian could still legitimately argue that historical validity is a necessary condition for justice, even if not sufficient. They can maintain that without a clean chain, holdings are unjust, preserving the core intuition that process matters more than pattern, even if the title analogy overreaches by implying immunity from public levy. The core insight—that we should look at how holdings arose—remains, even if the legal machinery described doesn't support the tax immunity conclusion. The analogy is rhetorically potent but logically porous.

  6. **A better source domain**

  A better source domain is **Chain of Custody in Criminal Evidence**. Like title, it validates current status based on historical handling. If the chain is unbroken, the evidence is admissible regardless of the defendant's guilt or the verdict's fairness. This captures the historical principle without importing property-specific baggage like adverse possession or sovereign grants. It focuses purely on procedural integrity during transfer. Unlike title law, it does not imply ownership against the state, nor does it rely on curing rules that redistribute rights based on time. It isolates the "process vs. outcome" distinction more cleanly, supporting the historical entitlement idea without smuggling in statist assumptions about property creation. It avoids the property law baggage entirely.

  7. **Confidence and the weakest link**

  I am highly confident in the analysis of the "root deed" contradiction (Section 4) and the failure of the Chamberlain claim (Section 5). The weakest link is the interpretation of curing rules in Section 2. While I argue they are distributive, a defender might claim they are purely procedural efficiency measures unrelated to justice. Settling this requires examining legislative intent behind marketable-title acts: are they justified by utilitarian stability (distributive) or epistemic limits (procedural)? If the latter, the administrability claim gains ground. Empirical legal study would settle this.
