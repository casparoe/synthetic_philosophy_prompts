answer: |-
  **PART 1: STRESS-TEST (MAX 10 LINES)**

  *   **Strawman Risk:** Engineers don't claim to recover neoclassical "utility"; they claim to predict *behavior*. You're attacking a welfare claim they aren't making explicitly.
  *   **Ontological Trap:** You argue preference is co-produced, but imply a "true" preference exists underneath the adaptation. This contradicts your constructivist thesis.
  *   **Behav Econ Ally/Enemy:** They agree RPT is weak; they'll ask why you're using 1950s theory to critique 2024 ML.
  *   **Afriat/GARP:** If logs satisfy GARP, your theoretical violation claim weakens. You need empirical evidence of inconsistency, not just theory.
  *   **Actionability:** "Co-produced value" isn't a metric. If you can't measure it, engineers can't optimize it.
  *   **Skip-Level Risk:** If preference is fake, why optimize anything? You need a pragmatic pivot, not a shutdown.
  *   **Adaptation:** Hard to prove adaptation vs. learning without longitudinal counterfactuals.
  *   **Definition:** You're redefining "preference" to mean "idealized welfare," confusing the room.
  *   **Consistency:** Choice consistency isn't the only definition of preference in ML (e.g., pairwise comparisons).
  *   **Scope:** 2 months reading shows; don't overclaim on Sen/Elster nuances or you'll lose the ethics person.

  ***

  **PART 2: PREP SHEET**

  **1. The Skip-Level: "So is the conclusion we stop optimizing engagement?"**
  *   **Damage:** Critical. If yes, you're fired. If no, why talk?
  *   **Reply:** "No. It's that engagement is a *production* metric, not a *discovery* metric. We shouldn't stop optimizing, but we need to stop treating engagement as a proxy for user welfare. We optimize for stability—does the user come back next month without us forcing the menu? We shift from 'what did they click' to 'did we expand their choice set.'"
  *   **Concede:** We can't turn the system off.
  *   **Soft Spot:** "Stability" is hard to measure offline.
  *   **Status:** **MUST LAND.**

  **2. ML Eng: "Our offline metrics go up and A/B tests hold. Why does the philosophy matter?"**
  *   **Damage:** High. Pragmatism beats theory.
  *   **Reply:** "Prediction isn't understanding. You can have high accuracy on a feedback loop. If the model learns to feed users narrow content they've adapted to, metrics go up while user autonomy goes down. We're optimizing for a mirror, not a window. I'm asking if we care about the difference."
  *   **Concede:** Metrics are useful for engineering stability.
  *   **Soft Spot:** Hard to prove harm from reinforcement without long-term data.
  *   **Status:** Defend.

  **3. Econ/ML: "Just run a GARP/Afriat test on the logs. If it passes, you're wrong."**
  *   **Damage:** High. Technical debunking.
  *   **Reply:** "Two issues. One, GARP assumes the choice set is exogenous. Here, the choice set is endogenous—the model changes the menu based on past choices. That violates the test's setup. Two, even if data passes GARP, it only proves consistency, not welfare. You can be consistently addicted. My point is about the *generation* of the preference, not the consistency of the output."
  *   **Concede:** GARP is valid for fixed menus.
  *   **Soft Spot:** You need to show empirical GARP violations in your specific logs to be safe.
  *   **Status:** Defend.

  **4. Behav Econ: "Revealed Preference is a dead horse. Why are you attacking a strawman?"**
  *   **Damage:** Medium. Makes you look out of touch.
  *   **Reply:** "You're right, RPT is dead in econ. But it's alive in engineering docs. We write 'user preference' in code comments and design docs as if it's a latent stable variable. I'm using RPT to show why that *engineering language* is technically misleading, not to critique modern econ."
  *   **Concede:** **FOLD FAST.** Agree RPT is outdated in academia.
  *   **Soft Spot:** Semantic argument vs. technical reality.
  *   **Status:** Fold.

  **5. Ethics: "You imply a 'true self' exists to be corrupted. Where is it?"**
  *   **Damage:** Medium. Philosophical error.
  *   **Reply:** "I'm not claiming a metaphysical soul. I'm claiming a *stable* disposition vs. an *adapted* one. Sen's point isn't that there's a true self, but that we need to distinguish between 'I want this' and 'I want this because I've never seen anything else.' It's about the history of the choice, not the essence of the chooser."
  *   **Concede:** No metaphysical true self.
  *   **Soft Spot:** Defining "stable" without essentialism is hard.
  *   **Status:** Defend.

  **6. ML Eng: "We model context explicitly. Menu changes are just features."**
  *   **Damage:** Medium. Technical counter.
  *   **Reply:** "If the menu changes the *value* of the option, not just the probability of selection, it's not a feature, it's a generator. A feature adjusts the prediction; a menu change adjusts the preference. If showing you only action movies makes you value action movies higher, that's not context, that's construction."
  *   **Concede:** Context matters.
  *   **Soft Spot:** Hard to distinguish statistically.
  *   **Status:** Defend.

  **7. ML Eng: "Pairwise preferences (Bradley-Terry) don't need choice axioms."**
  *   **Damage:** Medium. Alternative framework.
  *   **Reply:** "Pairwise assumes transitivity. If we feed narrow menus, we create intransitive cycles over time. You prefer A to B today because of the menu, B to C tomorrow, C to A next week. The model converges, but the user cycles. That's not preference learning, that's preference spinning."
  *   **Concede:** Pairwise is standard.
  *   **Soft Spot:** Need evidence of cycles.
  *   **Status:** Defend.

  **8. Everyone: "Fine, then what do we optimize instead?"**
  *   **Damage:** High. The "So What?"
  *   **Reply:** "I don't have a silver bullet metric. But I propose we treat 'choice set diversity' as a constraint, not a loss. We optimize engagement subject to not narrowing the user's future menu. It's a guardrail, not a new objective function."
  *   **Concede:** No ready-made metric exists.
  *   **Soft Spot:** Diversity hurts short-term metrics.
  *   **Status:** **THE DREADED QUESTION.**

  ***

  **SUMMARY CHECKLIST**
  *   **Fold On:** Behav Econ "Strawman" (Objection 4). Don't fight it.
  *   **Must Land:** Skip-Level "Stop Optimizing?" (Objection 1). Pivot to "Optimize Differently."
  *   **Dreaded Question:** "What do we optimize instead?" (Objection 8). Have the "guardrail" answer ready.
  *   **Afriat/GARP:** Focus on **endogeneity of the choice set** and **consistency ≠ welfare**.
