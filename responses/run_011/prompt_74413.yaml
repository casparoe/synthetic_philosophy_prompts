      Dear Colleague,
      It is rare to see a genomicist engage so deeply with the philosophical underpinnings of function, and your alignment with the etiological account places you in good company among evolutionary biologists who pushed back against the ENCODE consortium. You are correct that the etiological view offers a mind-independent fact of the matter regarding whether a trait was selected, whereas the causal-role account risks collapsing function into whatever activity a researcher decides to measure. However, I must be plain with you regarding your primary question about operational thresholds. The metaphysics of the etiological account cannot tell you what degree of sequence conservation constitutes a functional element. Philosophy clarifies the concept of function, but it does not dictate the empirical evidence required to infer that concept. Conservation is merely a proxy for selection, and the reliability of that proxy depends on the effective population size of your gastropod, the divergence times of the species in your alignment, and the statistical power of your models, none of which are settled by philosophical argument.

      When you defend your threshold against reviewers citing biochemical data, your argument should not be that biochemical activity is irrelevant, but that it is insufficient. Under the etiological view, transcription factor binding or chromatin openness are mechanistic capacities, not historical explanations. You can acknowledge these data as evidence of potential utility while maintaining that without signatures of purifying selection, they remain indistinguishable from biochemical noise. The mutation load argument you mentioned is your strongest shield here. If eighty percent of the genome were truly under selection, the genetic load would be unsustainable for most species. You can argue that biochemical activity is a necessary condition for many functions but not a sufficient one, and that your conservation threshold is calibrated to filter out the transient noise that the causal-role account would inadvertently validate as functional.

      Regarding elements that are useful but too young to show conservation, you have identified the sharpest edge of the etiological account. Strictly speaking, if an element has not yet been subject to selection history, it does not have a function on the etiological view, even if it is currently beneficial. This is often called the problem of incipient function. For a working annotator, this creates a tension between metaphysical rigor and practical utility. If you adhere strictly to the etiological account, you must classify these young elements as non-functional until selection has had time to leave a footprint, which may feel counterintuitive when the element clearly contributes to organismal capacity. Some philosophers suggest a hybrid approach or a forward-looking account for these cases, but if you wish to remain consistent, you might annotate these as candidate elements with potential utility while reserving the label functional for those with evidence of historical constraint. This distinction allows you to acknowledge their biological role without conceding that they meet the historical criteria for function.

      So what does this philosophical debate actually buy you in the lab? It buys you conceptual clarity and argumentative precision, but it does not buy you a p-value or a conservation score. The debate protects you from conflating activity with adaptation. It allows you to state clearly that your annotation pipeline is designed to identify elements maintained by selection, not merely elements that are biochemically active. The two accounts diverge concretely on how to treat junk DNA, spandrels, and exaptations. The causal-role account might label a transposon insertion as functional if it happens to regulate a nearby gene, whereas the etiological account would label it non-functional unless that regulation was the reason the insertion was selected and maintained. In your gastropod genome, this means you will likely annotate fewer elements than a consortium using biochemical criteria, but your claims will be robust against evolutionary scrutiny.

      Ultimately, you should not look to the philosophy of biology to resolve the statistical uncertainty of your conservation thresholds. That is a matter of comparative genomics and population genetics. What the philosophy offers is the justification for why you are looking for conservation in the first place. It validates your intuition that biochemical signals drop out as evidence when they are decoupled from evolutionary history. It also clarifies that when you call a variant deleterious, you are making a claim about the disruption of a selected effect, not just the alteration of a causal capacity. Stick to your etiological guns for the definition, but rely on your empirical data and the specific population parameters of your study system to set the threshold. Your reviewers may demand biochemical validation, but you are justified in insisting that such validation confirms mechanism, not function in the evolutionary sense.

