answer: |-
  You have identified a genuine and pervasive rhetorical structure, and you are right that it lacks a canonical name in the standard taxonomy of fallacies. It is not Motte-and-Bailey, it is not Special Pleading (quite), and it is distinct from the Iron Law of Oligarchy.

  The reason it feels nameless is that it is a **category error regarding institutional ontology** disguised as a solution to a **principal-agent problem.**

  Here is the carving you are looking for: the neighbors, the distinction, and a proposed label.

  ### 1. The Nearest Neighbors (and why they miss)

  You correctly ruled out the obvious suspects, but it is worth stating *why* they stop short, to sharpen the edges of your concept.

  *   **Special Pleading:** This is the closest logical cousin. Special Pleading is applying a standard to others but exempting oneself (or one's allies) without justification.
      *   *Why it stops short:* Special Pleading implies a double standard based on *identity* ("I can do it because it's me"). Your reformers are arguing based on *structural properties* ("They don't need votes, therefore they aren't captured"). They believe they have a justification; they aren't merely exempting themselves, they are redefining the mechanism of capture.
  *   **The Nirvana Fallacy:** Comparing a realistic option to an idealized one.
      *   *Why it stops short:* The Nirvana Fallacy usually involves comparing Reality A to Perfect Solution B. In your examples, the reformer admits Solution B has dependencies (staff, experts). They aren't claiming Solution B is perfect; they are claiming Solution B's dependencies *don't count* as capture.
  *   **Depoliticization (Political Science):** This is the substantive phenomenon you are describing. Scholars like Colin Hay or Jacques Rancière describe moving issues from the "political" sphere (contestation) to the "administrative" sphere (management).
      *   *Why it stops short:* This names the *strategy*, not the *argumentative move*. It describes what they are doing (hiding power), not the logical slide they use to justify it (claiming dependence is now independence).
  *   **Infinite Regress (The "Who Guards the Guardians?" Problem):** This is the philosophical trap they are falling into.
      *   *Why it stops short:* This names the *dilemma*, not the *evasion*. Your reformers are evading the regress by arbitrarily declaring the buck stops with the secretariat.

  ### 2. The Core Mechanism: Reification of Independence

  The engine of this slide is a specific **reification**.

  The reformer treats "Independence" as an **intrinsic property** of a person or body (like height or weight), when it is actually a **relational state** (like "upstream" or "married").

  *   **Premise 1:** Politicians are dependent on voters/donors. (True)
  *   **Premise 2:** Dependence compromises independence. (True)
  *   **Conclusion:** We need independent actors.
  *   **The Swap:** We will use Experts/Staff.
  *   **The Slide:** Experts/Staff depend on *different things* (norms, tenure, grant cycles).
  *   **The Error:** The reformer counts the first dependency as "Capture" and the second dependency as "Autonomy."

  They are conflating **Alignment** with **Autonomy**. They prefer the *alignment* of the second supplier, so they rhetorically upgrade it to *autonomy*.

  ### 3. A Proposed Label: "The Fallacy of Displaced Dependence"

  Since there is no Latin tag for this, I suggest calling it **The Fallacy of Displaced Dependence** (or **Dependency Displacement**).

  **Definition:** The argumentative move where a critic identifies a structural dependency as the source of corruption, proposes a reform that substitutes a new dependency, and then frames the substitution as the *elimination* of dependency rather than a *transfer* of allegiance.

  **The Structure:**
  1.  **Diagnosis:** Group A is corrupted because they depend on Source X.
  2.  **Proposal:** Replace Group A with Group B.
  3.  **Constraint:** Group B must depend on Source Y to function.
  4.  **Assertion:** Because Source Y is not Source X, Group B is "independent."
  5.  **Result:** The criterion for success shifts from "Freedom from Dependence" to "Preference for Source Y," while the rhetoric claims "Freedom from Dependence."

  ### 4. The Carving: When is it a Fallacy vs. a Trade-off?

  You asked for the edges: when does this count as a dishonest slide, and when is it a legitimate argument? This is the most important part for your writing.

  It is **not** a fallacy if the reformer acknowledges the trade-off.
  It **is** a fallacy (or at least a rhetorical deception) if the reformer denies the trade-off.

  **The Legitimate Version (Honest Institutional Design):**
  > "Politicians are captured by donors. We cannot eliminate capture, because any body needs information and support. However, a citizen assembly briefed by a non-partisan secretariat shifts the dependence from *financial donors* to *procedural norms*. This is not 'independence,' but it is a *different kind of dependence* that we believe yields better outcomes."

  *   **Why it works:** It admits the Iron Law. It argues for a *better master*, not *no master*. It is a Public Choice argument.

  **The Fallacious Version (Dependency Displacement):**
  > "Politicians are captured by donors, so they can't think straight. We need a citizen assembly to restore independent judgment. They will be briefed by a secretariat."
  > *[Challenge: Who captures the secretariat?]*
  > "No one, they are professionals."

  *   **Why it fails:** It treats "professionalism" as the absence of influence rather than a specific vector of influence (e.g., budgetary dependence, career socialization, epistemic closure). It claims to have solved the structural problem when it has only changed the personnel.

  ### 5. Why This Matters for Your Beat

  This distinction is vital for covering AI governance and election reform because it separates **Technocratic Idealism** from **Institutional Realism.**

  *   **AI Safety:** If you say "Corporate labs are profit-captured, so we need a Public AI Lab," you are invoking Dependency Displacement if you imply the Public Lab is free from influence. It will be influenced by congressional appropriations, civil service rules, and the same engineers seconded from Google. If you argue "It will be influenced by Congress instead of Shareholders, and that's preferable," you are making a honest political argument.
  *   **Citizen Assemblies:** The "Neutral Secretariat" is the classic black box. If the Secretariat sets the agenda, selects the witnesses, and summarizes the testimony, *they* are the legislators. The Assembly is the theater. Acknowledging this isn't cynicism; it's accuracy.

  ### 6. Summary for Your Notebook

  *   **Name:** The Fallacy of Displaced Dependence (or Dependency Displacement).
  *   **Core Error:** Treating "Independence" as an intrinsic virtue rather than a relational state. Confusing a change in *allegiance* with a liberation from *allegiance*.
  *   **The Test:** Ask the reformer: "What does the new supplier want?"
      *   If they say "Nothing, they're neutral," it's the fallacy.
      *   If they say "They want professional credibility/budget stability, which aligns better with the public interest than re-election does," it's a legitimate trade-off.
  *   **Intellectual Heritage:** This is the gap between **Progressive Era Idealism** (experts are neutral) and **Public Choice Theory** (bureaucrats are self-interested actors). Your reformers are speaking the former while living in the latter.

  You aren't missing something obvious; you are noticing the place where political theory bumps into organizational sociology. The reformers are selling **liberation**, but they are actually selling **management**. Naming that slide allows you to ask the only question that matters: "Who guards the guardians, and who guards them?" without being dismissed as cynical.
