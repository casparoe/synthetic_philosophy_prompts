answer: |-
  Friends, colleagues, neighbors.

  Look at it. Really look at it.

  It is heavy. Even now, resting on a concrete plinth in the grass, you can feel the weight of it. It is cast in bronze, but it remembers being steel. It is a reduction gearbox. Its job was to take the chaotic, frantic pull of the tidal river and slow it down, grind it through these teeth, and turn it into something steady. Something useful.

  We are here to unveil a monument to a thing that never worked. That is a strange thing for a city to do. Usually, we bronze the generals who won, or the explorers who arrived. We do not usually cast the engine of the ship that sank.

  But here we are. And looking out at you, I see that this room is not one room, but three.

  To my left, I see the hands that built the barrage. The welders, the engineers, the site supervisors. I know many of you have spent the years since moving from contract to contract, or waiting for a phone that does not ring. You know the weight of this steel because you carried the real thing.

  To my right, I see the visitors. The economists and the scientists. You have come to study the wreckage. You see a data point. You see a curve that went up when it should have gone down. You see a lesson in how not to spend public money.

  And behind you, the city. The people who pay the bills. Some of you think this barrage was a scandal. Some of you think it was the last time this city tried to be great.

  I directed this project from the second year until the end. I signed the checks. I read the reports. And because I stand here as the one who held the pen, I owe you the truth about what happened in the middle of that timeline.

  By the fifth year, the arithmetic had changed. A new technology had emerged elsewhere—a cheaper way to capture the same energy. Our own internal projections, the ones we kept in the locked cabinets, confirmed that the tidal barrage would never return what it cost to build. The rational decision, the decision that fits on a spreadsheet, was to stop.

  We did not stop. We went on for two more years.

  I have spent a long time trying to explain why. The easy answer is that we were stubborn. That we fell in love with our own work. That we threw good money after bad because we couldn't bear to admit we were wrong.

  That is not the truth.

  In years six and seven, we were not buying a barrage. The barrage was already a ghost. What we were buying, with every week of continued construction, was time. Specifically, we were buying time for the workforce.

  This project required skills that do not exist anywhere else. You learned them here. You welded here. You calculated the loads here. If we cancelled in year five, that workforce was dismissed. The skills evaporated. The community of this site dissolved.

  I looked at the numbers, and I saw a loss of four hundred million dollars. Then I looked at the yard, and I saw three hundred families who relied on this site. I realized that nobody in my position wanted to be the person who signed the order to send you home. So we kept welding. We kept pouring concrete. We kept the rhythm of the work going because the silence of the dole queue was worse.

  Now, I have to say this to your faces, and I will not dress it up.

  I do not know if that was the right thing to do.

  It may be the most defensible thing I ever did. I kept a community intact. I honored the labor you had already given by ensuring it wasn't rendered instantly obsolete. I protected people from the sudden violence of unemployment.

  Or, it may be the reason the cost ballooned. It may be a failure of nerve disguised as loyalty. By refusing to make the hard cut, I may have ensured that the eventual cancellation hurt even more. I may have traded public capital for private stability, without the authority to make that trade.

  I have not settled which it was. I will not settle it today. A failure of arithmetic is clean; you can fix the numbers. A failure of nerve is messy; it lives in the person who made the choice. I am telling you this so that when you look at this gearbox, you do not see a simple mistake. You see a complex choice.

  I know that later, at the reception, our guests from the university have planned a game. A dollar auction. Twenty dollars to the highest bidder, but the runner-up pays their bid and gets nothing.

  They intend this as a demonstration. They think it is a game. But for the people who built the barrage, you know this game. You know how easy it is to bid one dollar more, not because you want the prize, but because you do not want to lose what you have already put on the table. You know how the bidding goes up long after the value is gone.

  So, a word of advice to my old crew: if you play, remember that the house always wins. And a word to our academic guests: be gentle. You are playing for twenty dollars. These people played for their livelihoods. Do not mistake their scars for data points.

  But let us come back to this object. Why a gearbox?

  A report of inquiry is a flat thing. It is paper. It tells you what went wrong, and then it is filed away. It has no torque. It cannot turn anything.

  This gearbox is different. Even frozen in bronze, it describes a relationship. It describes the meeting point between the wild energy of the river and the need for human power. It is a machine designed to transform motion.

  In a way, that is what this sculpture must do for us. It cannot generate electricity. It cannot turn the turbines. But perhaps it can transform our memory of this event.

  If we remember the barrage only as a waste, then the money is gone, and the pain is useless. But if we remember it as a place where people tried to hold onto each other in a storm, then the cost changes. The energy is not lost; it is stored.

  This gearbox reduces speed to increase force. Perhaps that is what we must do now. We must slow down our judgment. We must stop rushing to call this a triumph or a disaster. We must apply the force of our attention to the weight of what actually happened.

  The river will keep flowing. The tides will keep coming in and out, regardless of what we built or what we cancelled. But this steel remains. It is solid. It is honest. It does not pretend to be a turbine. It does not pretend to be a monument to victory. It is just the mechanism.

  It is here to remind us that work has value, even when the project fails. It is here to remind us that decisions have weight, even when the numbers say stop. And it is here to remind us that while we cannot change the past, we can still engage the gears.

  Thank you.
