  **Diagnostic Paragraph**
  The options are: (1) mandate the legacy notation (leading zero, no trailing zero) system-wide; (2) mandate the acquired notation; (3) rely solely on the vendor's EHR fix for structured fields while leaving free text and culture untouched; or (4) a hybrid approach combining a mandate with technical enforcement and retraining. Each depends on whether we believe notation is a matter of arbitrary agreement or intrinsic safety, and whether human behavior follows policy or expectation. The vendor fix handles structured data but fails at free text, leaving the human coordination problem unsolved. Regarding your specific question: this is not a pure convention question in the Lewisian sense because the payoffs are not symmetric; one notation is intrinsically safer, making it a normative standard rather than an arbitrary equilibrium. However, the *adoption* phase remains a coordination problem because the safety benefit is only realized if everyone conforms. The notion of convention does work here, but only to explain the friction of transition, not the justification of the rule. The recommendation below mandates the legacy system, couples it with the vendor fix, and addresses the Charge Nurse's objection by engineering the common knowledge required to shift expectations.

  ***

  **MEMORANDUM**

  **TO:** Medication-Safety Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Standardization of Fractional Dose Notation

  **Recommendation**
  I recommend we immediately mandate the legacy hospital's notation system (leading zero, no trailing zero; e.g., "0.25 mg," "5 mg") across both facilities. This policy must be coupled with the vendor's EHR normalization fix for structured fields and a targeted retraining program for all nursing and pharmacy staff. Existing free-text entries cannot be retroactively fixed by technology; they must be governed by this new policy, with compliance monitored during handoffs. Staff hired under the acquired hospital's practice require retraining, not exemption.

  **The Coordination Problem**
  We are facing a failure of coordination. Currently, two distinct regularities in behavior exist within one system. Under normal conditions, either notation could function safely if universally applied. However, our near-misses cluster at the boundary between sites, specifically when float-pool staff encounter notes written in the opposing style. This indicates a breakdown in common knowledge. When a nurse from Site A reads a note from Site B, they cannot rely on the expectation that the writer followed the same regularity they did. In coordination terms, we have two competing equilibria, and the friction between them is generating risk.

  **Safety Asymmetry and Convention**
  We must be clear about whether this is merely a convention question. If the choice between "0.25" and ".25" were purely arbitrary, either solution would suffice so long as we agreed. However, Pharmacy has demonstrated an asymmetry in risk: a dropped leading zero transforms a tenth into a whole, whereas a trailing zero on a whole number creates ambiguity but rarely magnitude errors of the same scale. Because one regularity offers a strictly superior safety payoff, this is not a pure convention where preferences are symmetric. It is a safety standard with a coordination component. The notion of convention still applies to the *adoption* phase—we must all move together—but the justification for *which* rule we adopt rests on intrinsic safety, not arbitrary agreement. We cannot treat this as a matter of local custom where both sides compromise; the physics of legibility favors the leading zero.

  **Addressing the Implementation Objection**
  Our senior charge nurse has raised a critical objection: a policy document will not change what anyone writes because clinicians' expectations are fixed by what they see colleagues do and by the ward where they trained. She argues that if we mandate anything we should expect to be ignored, and should spend the money on the vendor fix instead.

  She is correct that fiat alone does not create convention. Conventions are sustained by expectations of conformity, not by memos. If we issue a policy but the visual environment remains mixed, the expectation of conformity will not stabilize, and the old regularities will persist. However, she is incorrect to conclude that policy is therefore useless. Policy, when combined with technical constraints and signaling, creates the *common knowledge* necessary to shift expectations.

  The vendor fix for structured fields acts as a hard signal that the old regularity is no longer available in those domains. For free text, where technology cannot intervene, the policy must be backed by visible enforcement and retraining. We must make it common knowledge that the legacy notation is now the only expected regularity. If we merely buy the vendor fix and leave free text and culture alone, we validate the charge nurse's fear: we will have structured compliance but continued ambiguity in handoff notes. We must spend the money on the fix *and* invest in the cultural shift.

  **Plan for Free Text and Staff**
  1.  **Structured Fields:** Procure the vendor normalization tool immediately. This removes the burden of compliance from the writer for most entries.
  2.  **Free Text:** Mandate the legacy notation in all free-text charting. Acknowledge that this cannot be auto-corrected. Non-compliance here must be treated as a safety violation, not a stylistic preference.
  3.  **Staff:** All staff, regardless of prior training, must undergo retraining. We cannot allow a "grandfather clause" for staff trained under the acquired system, as this perpetuates the boundary risk. The goal is a single system-wide regularity.
  4.  **Timeline:** Policy effective immediately. EHR fix implemented within six months. A six-month grace period for monitoring and feedback follows, after which non-compliance triggers formal review.

  **Conclusion**
  We are not merely choosing a style; we are resolving a coordination failure that threatens patient safety. The legacy notation is intrinsically safer, and the merger provides the opportunity to establish a single, common knowledge regularity. We must act decisively to align expectations across the system.
