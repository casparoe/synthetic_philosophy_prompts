          3.  Every check presupposes something else's accuracy.
          4.  The chain must loop or bottom out (no infinite regress, no infallibility).
          5.  Looping = circular validation (bad). Bottoming out = unchecked assumption (contradicts 1).
          6.  Conclusion: I don't know any instrument is accurate.
          7.  Generalization: Nobody knows any instrument is accurate.
