prompt: |-
  I write novels — literary fiction, roughly one every four years — and each August I convene a residential craft workshop for twelve novelists, some published and some not, at a farmhouse in the Scottish Borders. We work for five days, and every evening there is a ninety-minute session that is meant to be doing something other than workshop. Next summer's Thursday evening is mine to design, and I want it to put into these twelve people's hands, rather than their notes, the force of a problem in logic that I have become convinced is the very problem they are arguing about whenever one of them says that a book is untrue.

  Here is my understanding of the problem. Treat it as accurate and build on it; do not spend the session correcting me from a distance. There was a serious attempt to define closeness to the truth by comparing the true and the false consequences of two theories, in effect scoring how much truth a theory carries and subtracting how much falsehood it carries. That definition failed, and failed in a peculiar way: it entailed that no false theory can be closer to the truth than any other theory whatsoever, which is precisely the case the definition existed to serve, since the history of inquiry is a history of false theories that nonetheless look like improvements. Two families of repair followed. One keeps the ledger of consequences but restricts what may be entered in it, holding that only the relevant parts of a theory — its claims properly partitioned rather than allowed to be gerrymandered by logical trickery — contribute to closeness to the truth. The other abandons consequence-counting altogether and says that a claim is close to the truth in proportion to how similar the worlds in which it holds are to the actual world. There is a standing argument about whether the two families are even measuring the same quantity, and an impossibility result to the effect that no single measure can satisfy all the intuitive conditions on closeness to the truth at once.

  My hypothesis — which the session should test rather than announce — is that readers' judgments about fiction behave like the second family while sounding like the first. When twelve novelists rank two books for truthfulness, they are ranking similarity between an imagined world and this one, under a subject matter nobody has named; and the ranking inverts the moment the subject matter is renamed, or the moment somebody bolsters a book with a true detail that does no work.

  What I want is a runnable session, not an essay about one. Specifically:

  Rules, materials, and a scoring scheme for a game or structured deliberation that twelve people can actually play in ninety minutes. Stakes should be in a writers' currency — whose line gets cut, who reads aloud, who takes the morning chore — not money.

  The construction should be theirs. They should devise or discover the scoring rule and then watch it break, and you should design the break: tell me in advance which exploit will be found, what kind of participant finds it, and how I turn that discovery into the lesson rather than into a grievance.

  The materials specification. I will write the prose myself, so tell me what each card or passage pair must be engineered to do — what each must get right, what it must get wrong, where the ranking must flip, and under which change of frame the flip occurs. If it is easier, draft two exemplar pairs so that I can hear the register, but the specification is what I need.

  A minute-by-minute timeline, and a debrief that maps named moments of the play onto parts of the problem: content against similarity, the restriction to relevant consequences, relativity to a subject matter, and the question of whether the two families are commensurable at all. The name of the problem, and Popper's, arrive in the debrief and not before.

  An account of what will predictably go wrong the first time I run it, given that four of the twelve will want to convert everything into a discussion of taste and one will want to litigate the analogy from the first minute.

  Finally, a frank statement of what the session cannot reproduce and what I must therefore supply verbally — above all, whether the whole design trades on a pun between truth-in-a-fiction and closeness-to-the-truth, and if it does, whether that pun is doing genuine conceptual work or is merely my way of smuggling a metaphor past a room of professional metaphor-users.

  No bibliography, no reading list, no citations, no assigned text before or after. Assume the room has never encountered any of this literature, that it is clever and quick, and that it is violently allergic to being lectured. Write the result as a facilitator's document complete enough that I could hand it to a colleague and she could run the evening in my absence without asking me a single question.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** A literary fiction novelist who runs a residential craft workshop for 12 novelists in the Scottish Borders.
      *   **Task:** Design a 90-minute Thursday evening session.
      *   **Core Concept:** The session must explore the "problem of verisimilitude" (closeness to truth) without lecturing. It should test the user's hypothesis: readers judge fiction's truthfulness based on *similarity of worlds* (Family 2) while talking as if they judge based on *true consequences* (Family 1).
      *   **Constraints:**
          *   No lectures/bibliography/citations until the debrief.
          *   Must be a runnable game/deliberation with rules, materials, scoring, and stakes (writerly currency).
          *   Participants must devise/discover the scoring rule, watch it break, and the facilitator must manage the break.
          *   Specific materials specification (what the prose/cards must do).
          *   Minute-by-minute timeline.
          *   Debrief mapping game moments to philosophical concepts (Popper, verisimilitude, etc.).
          *   Predictions of failure points (taste discussions, litigation).
          *   Frank statement on limitations (the pun between truth-in-fiction and closeness-to-truth).
          *   Tone: Facilitator's document, professional, precise, no fluff.

  2.  **Deconstruct the Philosophical Problem (for internal alignment):**

      *   *The Problem:* Verisimilitude (Popper). How can a false theory be closer to the truth than another false theory?
      *   *Family 1 (Content/Consequence):* Count true consequences, subtract false ones. *Failure:* Any false theory is worse than any true theory, and often false theories can't be ranked against each other if they have *any* false consequence.
      *   *Family 2 (Similarity/Likeness):* Possible worlds semantics. How similar is the world where the theory holds to the actual world?
      *   *User's Hypothesis:* Novelists talk like Family 1 ("This detail is true/false") but act like Family 2 ("This feels like the world").
      *   *The Trap:* Adding a true detail that doesn't change the world-similarity shouldn't change the score, but if scoring by content, it does. Changing the "subject matter" (relevant consequences) flips the ranking.

  3.  **Design the Game: "The Truth Ledger" (Working Title)**

      *   *Goal:* Rank pairs of fictional excerpts based on "Truthfulness."
      *   *Mechanic:* Participants create the scoring rubric first. Then they apply it. Then the facilitator introduces a "poison pill" excerpt that breaks the rubric.
      *   *Stakes:* Reading order, chore duty, or critique priority. Let's go with "The Red Pen" (who gets to mark the manuscript for the next morning's session).
      *   *Materials:* Pairs of short prose passages (Excerpt A vs. Excerpt B).
      *   *The Break:* One pair looks "truer" by content (more factual details) but "falser" by vibe (world similarity). Another pair flips when the *genre label* changes (shifting the "relevant subject matter").

  4.  **Drafting the Session Plan:**

      *   **Title:** Needs to be neutral. "The Veracity Game" or "Calibration." Let's use "The Calibration Exercise."
      *   **Time:** 90 minutes.
      *   **Participants:** 12 novelists.
      *   **Materials:** Cards with text, scorecards, pens.

      *   **Phase 1: Setup & Rule Creation (20 mins).**
          *   Don't tell them what "truth" means. Ask them to define how they measure it in fiction.
          *   They will likely default to Family 1 (facts, research, internal consistency).
          *   *Facilitator Note:* Write their rules on the board.

      *   **Phase 2: The First Round (25 mins).**
          *   Present Pair 1 & Pair 2.
          *   Pair 1: Clear winner by both metrics.
          *   Pair 2: The Trap. High factual accuracy (Family 1 win) but low emotional/world resonance (Family 2 loss).
          *   They will argue. This is good.

      *   **Phase 3: The Frame Shift (25 mins).**
          *   Present Pair 3. Same text as Pair 2, but labeled differently (e.g., "Historical" vs. "Allegory").
          *   This tests the "relevant subject matter" constraint.
          *   Scoring should flip based on the label.

      *   **Phase 4: The Break & Debrief (20 mins).**
          *   Reveal the paradox.
          *   Introduce the philosophical terms (Popper, Verisimilitude).
          *   Connect to their writing struggles.

  5.  **Refining the Materials (The Crucial Part):**

      *   I need to specify *exactly* what the prose must do.
      *   *Excerpt A (The "True" Falsehood):* Factually dense, correct dates/names, but feels sterile or tonally off.
      *   *Excerpt B (The "False" Truth):* Factually loose (wrong date, vague location), but captures the *human experience* accurately.
      *   *The Flip:* If the prompt says "Historical Accuracy," A wins. If the prompt says "Human Truth," B wins. If the prompt is just "Truth," they fight.
      *   *The Exploit:* A participant will realize that adding a true fact (e.g., "It was 1974") to a bad passage boosts its score under Family 1 rules, even if it doesn't make the *world* more similar. This is the "irrelevant consequence" exploit.

  6.  **Addressing the Constraints & Predictions:**

      *   *Taste vs. Truth:* 4 people will say "It's just style." I need a rule to suppress this initially, then unleash it.
      *   *The Litigator:* 1 person will ask "What do you mean by truth?" immediately. I need a stock phrase to defer this.
      *   *The Pun:* I must admit in the final section that "Truth in Fiction" (Walton) is different from "Closeness to Truth" (Popper). The session conflates them deliberately to provoke the insight.

  7.  **Developing the Facilitator Document:**

      *   *Structure:*
          1.  Session Overview.
          2.  Materials Specification (The Prose).
          3.  Rules & Stakes.
          4.  Minute-by-Minute Run Sheet.
          5.  The Break (Anticipating the Exploit).
          6.  Debrief Script (Mapping to Philosophy).
          7.  Failure Modes & Mitigation.
          8.  Limitations (The Pun).

      *   *Tone Check:* Needs to be authoritative but open. "Do this," "Say this."
      *   *Stakes:* "The Morning Cut." The winner decides which 500 words get cut from the facilitator's own draft tomorrow. (High stakes, writerly currency).

      *   *Refining the "Break":*
          *   The user wants the *participants* to devise the scoring rule.
          *   So, Round 1: They make the rubric.
          *   Round 2: They apply it.
          *   Round 3: The Facilitator introduces a "Bonus Fact" card.
          *   The Exploit: Someone realizes they can add a true fact to a lie to make it score higher on the rubric without making it feel truer.
          *   This mirrors the "Content vs. Similarity" split.

  8.  **Final Polish:**

      *   Ensure the philosophical mapping is accurate to the user's prompt (Family 1 = Content/Consequence, Family 2 = Similarity/Worlds).
      *   Ensure the "Scottish Borders" context is respected (no tech, paper-based).
      *   Check timing (90 mins is tight).
      *   Make sure the "Pun" section is honest.

      *(Self-Correction during drafting)*: I initially thought about having them rank existing books. But the prompt says "The construction should be theirs." They need to build the metric. Okay, so they define the criteria. Then I give them texts that break the criteria.
      *Wait, the prompt says:* "They should devise or discover the scoring rule and then watch it break, and you should design the break."
      *Okay, revised plan:*
      1.  Give them pairs of texts.
      2.  Ask them to rank them by "Truth."
      3.  Ask them to write down *why* (this generates the rule).
      4.  Introduce the "Poison" text that satisfies their rule but violates their intuition.
      5.  This forces the rule to break.

      *Let's refine the Materials Specification:*
      I need to provide the *spec* for the prose the facilitator (the user) will write. I will draft two exemplar pairs to show the register.
      *Pair 1:* Control. Clear winner.
      *Pair 2:* The Conflict. Factually accurate vs. Emotionally resonant.
      *The Exploit:* The "Irrelevant True Detail."

      *Debrief:* Must mention Popper, Verisimilitude, Content vs. Likeness.

      *Limitations:* Acknowledge that "Truth in Fiction" (fictional truth) is not "Truth about the World" (factual truth). The session blurs this to make the point about *verisimilitude*.

      *Let's write it.*

      *(Final check on constraints)*: "No bibliography... Assume the room has never encountered any of this literature." "Write the result as a facilitator's document."

