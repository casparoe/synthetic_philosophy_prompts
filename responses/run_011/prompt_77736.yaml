answer: |-
  # FACILITATOR'S DOCUMENT: THE CALIBRATION EXERCISE
  **Session:** Thursday Evening Craft Workshop  
  **Duration:** 90 Minutes  
  **Participants:** 12 Novelists  
  **Location:** Farmhouse Common Room (Scottish Borders)  
  **Objective:** To expose the conflict between "truth as accurate consequence" and "truth as world-similarity" without initial theoretical framing.

  ---

  ## 1. MATERIALS SPECIFICATION
  You must write three pairs of short prose excerpts (approx. 150 words each). Do not distribute these in advance. Print them on heavy card, one pair per envelope.

  ### The Register
  The prose must be literary, neutral in tone, and devoid of obvious stylistic tics that would trigger "taste" judgments. The subject matter should be mundane but charged: a domestic argument, a medical diagnosis, or a travel delay.

  ### Pair A: The Control (Round 1)
  *   **Text A1:** Contains a factual error regarding a verifiable object (e.g., describes a specific car model with the wrong engine type) but captures the emotional tenor of the scene perfectly.
  *   **Text A2:** Factually flawless regarding the object, but the emotional tenor is sterile or slightly "off."
  *   **Engineering Goal:** 10 out of 12 participants should agree A1 is "truer" despite the error. This establishes that they are *not* using a strict fact-checking metric.

  ### Pair B: The Conflict (Round 2)
  *   **Text B1:** High world-similarity. The psychology is exact. However, it contains a specific, verifiable falsehood (e.g., "The train left at 10:05" when the timetable says 10:15).
  *   **Text B2:** Low world-similarity. The psychology feels contrived. However, it is factually pristine. Crucially, **B2 includes one extra true detail that B1 lacks** (e.g., the name of the station master, correctly spelled).
  *   **Engineering Goal:** This forces the "Content" metric (Family 1) to favor B2 (more true consequences) while the "Similarity" metric (Family 2) favors B1. The group will split.

  ### Pair C: The Frame Shift (Round 3)
  *   **Text C1:** Identical to Text B1.
  *   **Text C2:** Identical to Text B2.
  *   **The Change:** You verbally relabel the genre before they read.
      *   *First pass:* Label them "Contemporary Realism."
      *   *Second pass:* Label them "Allegory" or "Memory Piece."
  *   **Engineering Goal:** Under "Realism," the factual error in C1 hurts. Under "Memory/Allegory," the factual error in C1 is forgiven or seen as irrelevant, while the sterile accuracy of C2 becomes suspicious. This tests the "relevant subject matter" constraint.

  ### Physical Materials
  *   12 Scorecards (simple grid: Pair A, Pair B, Pair C | Winner | Confidence 1-5).
  *   1 Whiteboard or large pad of paper.
  *   1 "Red Pen" (prop for the stakes).

  ---

  ## 2. STAKES AND CURRENCY
  Do not use money. Use **The Morning Cut**.
  *   **The Prize:** The participant (or team) with the most consistent scoring logic wins the Red Pen.
  *   **The Power:** Tomorrow morning, during the facilitator's manuscript review, the winner decides which 500 words of the facilitator's draft must be cut, no questions asked.
  *   **The Risk:** If the group fails to agree on a scoring rule by the end of the session, the Facilitator keeps the Red Pen.

  ---

  ## 3. RUN SHEET (90 MINUTES)

  ### 00:00 – 00:10 | Setup & The Ban
  *   **Action:** Seat participants in a circle. Place Pair A envelopes in the center.
  *   **Script:** "We are going to rank fiction for truthfulness. I am not defining truth. You will define it by how you vote. At the end, we will codify the rule you used. The winner gets the Red Pen for my draft tomorrow."
  *   **Constraint:** "For the first 40 minutes, you are forbidden from using the words 'style,' 'voice,' or 'beautiful.' You may only discuss accuracy, resonance, or fidelity. If you break this rule, you lose a point."
  *   **Mitigation (The Litigator):** If someone asks, "What do you mean by truth?" immediately say: "That is the variable you are solving for. Proceed."

  ### 00:10 – 00:30 | Round 1 & 2 (The Data)
  *   **Action:** Distribute Pair A. Give 5 minutes to read and score individually.
  *   **Deliberation:** 10 minutes to discuss and agree on a winner for Pair A.
  *   **Action:** Distribute Pair B. Give 5 minutes to read and score.
  *   **Deliberation:** 10 minutes. *Expect friction here.*
  *   **Facilitator Note:** On the whiteboard, write down the *reasons* they give for their votes.
      *   Column 1: "Facts/Details" (e.g., "The train time was wrong.")
      *   Column 2: "Feel/World" (e.g., "The anger felt real.")
      *   Do not label these columns yet. Just transcribe their justification.

  ### 00:30 – 00:50 | The Rule Construction
  *   **Action:** Stop the debate on Pair B. Ask the room to formulate a single scoring rule that explains their Pair A choice and attempts to explain Pair B.
  *   **Task:** They must write a formula. E.g., *Truth = (Emotional Accuracy x 2) + Factual Details.*
  *   **The Trap:** They will likely create a hybrid rule that weights "relevant facts" higher than "irrelevant ones."
  *   **Facilitator Note:** Write their final agreed rule on the board. This is now the Law of the Room.

  ### 00:50 – 01:10 | Round 3 (The Break)
  *   **Action:** Distribute Pair C (same texts as B).
  *   **The Twist:** Announce: "These texts are now classified as **Recovered Memory Fragments**, not Realism."
  *   **Task:** Re-score Pair C using the **Law of the Room** written on the board.
  *   **The Exploit:** Watch for the participant who realizes that under the written rule, adding a true fact (like the Station Master's name) *must* increase the score, even if it makes the text feel falser as a memory.
  *   **Outcome:** The rule will likely contradict their intuition again. The score will say B2 is truer; their guts will say B1 is truer.
  *   **Action:** If no one spots the contradiction, introduce the "Poison Card."
      *   *Poison Card:* A slip of paper with one true fact (e.g., "The Borders Railway opened in 2015").
      *   *Instruction:* "Insert this fact into Text B1. Re-score."
      *   *Result:* By their own rule, B1 is now truer (more true consequences). By their intuition, it is unchanged or worse (cluttered).

  ### 01:10 – 01:30 | The Debrief (The Map)
  *   **Action:** Reveal the philosophical map. Connect the game moments to the concepts below.
  *   **Script:** (See Debrief Script below).

  ---

  ## 4. THE BREAK: ANTICIPATING THE EXPLOIT
  You must be ready for the moment the game breaks.

  *   **Who finds it:** Usually the most analytically minded novelist, often the one who writes historical fiction or crime. They are the "Litigator" you fear, but here they are your ally.
  *   **The Exploit:** They will say, "Wait. If our rule says true details add points, I can make a lie look truer just by adding a true weather report."
  *   **Your Move:** Do not defend the rule. Validate the exploit.
  *   **Script:** "Exactly. You have just found the loophole in the Content Theory. You have gerrymandered the truth. Now, look at your gut. Does the weather report make the story truer? No. So what is your gut measuring?"
  *   **The Lesson:** The gut is measuring **Similarity of Worlds** (Family 2). The rule was measuring **Content of Consequences** (Family 1). The session proves they are not the same metric.

  ---

  ## 5. DEBRIEF SCRIPT (MAPPING THE MOMENTS)
  *Do not read this verbatim, but hit these beats in order.*

  1.  **The Content Ledger (Family 1):** Point to Column 1 on the whiteboard ("Facts/Details"). "When you argued that the train time mattered, you were treating the book like a theory. You were counting true consequences. In philosophy, this is the **Content Approach**. It failed in the 1970s because it implies that adding any true fact makes a book truer, even if it's irrelevant."
  2.  **The Similarity Measure (Family 2):** Point to Column 2 ("Feel/World"). "When you argued that the anger felt real despite the wrong train time, you were measuring distance. How close is *this* world to *our* world? This is the **Likeness Approach**. It handles the train error better, but it's vague."
  3.  **The Relevance Filter:** Refer to the Genre Shift (Round 3). "When we changed the label to 'Memory,' the train time mattered less. This suggests truth is relative to a **Subject Matter**. You cannot measure closeness to truth without defining which parts of the theory count."
  4.  **The Impossibility:** Refer to the Poison Card. "You found that you could satisfy the rule while violating the spirit. This mirrors an **Impossibility Result** in logic. You cannot satisfy all intuitive conditions of truthfulness at once. You must choose: are you writing a theory or a world?"
  5.  **The Name:** "This problem is called **Verisimilitude**. The definition you tried to build and failed is known as **Popper's Definition**. The repair you attempted is the **Relevant Consequence** view. The gut feeling you relied on is the **Possible Worlds** view."

  ---

  ## 6. PREDICTABLE FAILURE MODES & MITIGATION

  ### Failure 1: The Taste Conversion (4 Participants)
  *   **Symptom:** "I prefer B1 because the rhythm is better."
  *   **Risk:** Collapses the distinction between Truth and Aesthetics.
  *   **Mitigation:** Enforce the "Ban" strictly. If they say "rhythm," ask: "If the rhythm were identical, would the fact still matter?" Force them to isolate the variable. If they persist, assign them the role of "Scribe" to keep them busy writing the rules rather than debating them.

  ### Failure 2: The Early Litigator (1 Participant)
  *   **Symptom:** "This is a category error. Fiction isn't true or false."
  *   **Risk:** Derails the game before it starts.
  *   **Mitigation:** Agree with them, then bracket it. "You are right. For the purpose of this game, we are treating 'Truth' as 'Verisimilitude.' It is a proxy variable. Humor me for 40 minutes."

  ### Failure 3: Consensus Fatigue
  *   **Symptom:** They refuse to agree on a rule to avoid the stakes.
  *   **Risk:** Session stalls at minute 50.
  *   **Mitigation:** Impose a "Dictator Clause." At minute 50, the person who has spoken the least is appointed Dictator. They write the rule. This usually forces the group to compromise quickly to avoid a tyrant.

  ---

  ## 7. LIMITATIONS: THE PUN
  *Read this section carefully. This is what you must supply verbally if asked, but do not put it on the board.*

  **The Conceit:** This session trades on a pun between **Truth-in-Fiction** (what is true *inside* the story, e.g., "Sherlock Holmes lived on Baker Street") and **Closeness-to-Truth** (how well the story matches *our* world).

  **Does the pun work?**
  Yes, but only heuristically.
  *   **Conceptual Work:** It forces the writers to confront that "realism" is not a single setting. It is a negotiation between internal consistency (truth-in-fiction) and external correspondence (closeness-to-truth).
  *   **The Smuggle:** Philosophers distinguish these sharply. By blurring them, you are asking the novelists to feel the friction that philosophers try to solve with logic.
  *   **Your Disclosure:** If a participant presses you on whether fiction *can* be true, admit this: "We are not measuring factual truth. We are measuring the *force* of truth. The session is designed to show that the *feeling* of truthfulness breaks when you try to quantify it. The pun is the point."

  **What you must supply:**
  You must verbally bridge the gap between "My character lied" and "My book lied." The session shows they feel different. You must articulate that the anxiety they feel when a detail is wrong is the anxiety of **Verisimilitude**, not the anxiety of **Lying**.

  ---

  ## 8. EXEMPLAR PAIRS (FOR YOUR WRITING)
  *Use these to calibrate your own drafts. Do not distribute these texts.*

  **Pair B Spec (The Conflict)**
  *   **Text B1 (The "False" Truth):** "He waited on the platform. The train was due at 10:05. It didn't come. He thought about how she'd left the kettle on, the whistle screaming in the empty kitchen. He knew he wouldn't be back to turn it off."
      *   *Error:* Train was actually 10:15.
      *   *Truth:* The anxiety of the kettle is psychologically precise.
  *   **Text B2 (The "True" Falsehood):** "He waited on the platform. The train was due at 10:15. It didn't come. Station Master Henderson checked his watch. He thought about the schedule, the delay codes, the protocol. He knew the rules were strict."
      *   *Fact:* Time is correct. Henderson is a real name (local).
      *   *Falsehood:* The psychology is bureaucratic and cold; feels "written."
  *   **The Flip:** If the rule is "Facts," B2 wins. If the rule is "Human Experience," B1 wins. If you add "Henderson" to B1, the Content score rises, but the Similarity score stays flat.

  **Pair C Spec (The Frame)**
  *   **Label 1:** "Contemporary Realism." (B1 is penalized for the time error).
  *   **Label 2:** "A Memory from 1994." (B1 is forgiven; memory is fallible. B2 becomes suspicious; why remember the Station Master's name but not the feeling?)

  ---

  ## 9. FINAL CHECKLIST FOR FACILITATOR
  1.  **Write the texts** ensuring the factual error is verifiable but obscure (check a timetable).
  2.  **Prepare the Whiteboard** with two blank columns.
  3.  **Bring the Red Pen.**
  4.  **Memorize the Debrief Map** (Content vs. Similarity vs. Relevance).
  5.  **Prepare to lose the Red Pen.** (If they break the logic, you keep it. If they find the exploit, they win. Either way, the lesson holds).

  **End of Document.**
