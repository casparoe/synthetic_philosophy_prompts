          3.  Inflation Targeting (Deliberate devaluation vs. Store of Value).
      *   **Task:** Reconstruct the theory of money that makes these three intelligible. Compare three specific theories (Commodity, Credit/IOU, Chartalist/State). Determine what is essential vs. underdetermined. Evaluate Berkeley's theory against this bundle. Address the logical tension between "pay on demand" and "engineered depreciation."
      *   **Tone:** Intellectual, rigorous, respectful of the user's expertise, philosophical but grounded in operational reality. Avoid simplistic textbook definitions.

  2.  **Deconstruct the Three Features:**
      *   *Feature 1: The Promise.* "I promise to pay the bearer on demand." Historically meant gold. Now means another note. It's a recursive promise.
      *   *Feature 2: The Balance Sheet.* Notes are liabilities. Assets are gov securities. This implies a credit relationship, but who is the creditor? The public. Who is the debtor? The Central Bank (state).
      *   *Feature 3: The Mandate.* 2% inflation target. This means the purchasing power *must* fall. Yet, it claims to guard "value."

  3.  **Evaluate the Three Candidate Theories:**
      *   *Commodity Theory (Metalism):* Money is a claim on a real thing (gold).
          *   *Fit:* Explains Feature 1 (originally). Fails Feature 1 (now). Fails Feature 3 (gold standard restricts inflation targeting).
      *   *Credit Theory (Private/IOU):* Money is debt generated by lending, settled by offsetting.
          *   *Fit:* Explains Feature 2 (liabilities). Explains Feature 3 (manageable supply). Struggles with Feature 1 (why the specific "promise to pay" phrasing if it's not redeemable for anything external?).
      *   *Chartalist/State Theory:* Money is a creature of sovereign authority, value fixed by tax demand and legal tender status.
          *   *Fit:* Explains Feature 3 perfectly (state manages value). Explains Feature 2 (state liability). Explains Feature 1 as a performative utterance of sovereignty rather than a commercial contract.

      *   *Synthesis:* The modern system is a hybrid. It *looks* like Credit (balance sheet), *acts* like Chartalism (mandate), but *speaks* like Metalism (the promise).

  4.  **Analyze Berkeley's Position:**
      *   Berkeley (*The Querist*, *A Theory of Vision Vindicated* context): Money is a "ticket" or "counter." It's not wealth itself but a claim on labor/industry. Value lies in circulation and imagination/expectation.
      *   *Fit:*
