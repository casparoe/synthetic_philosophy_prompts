answer: |-
  This is a profound operational and philosophical puzzle. You are standing at the junction where the metaphysics of money meets the plumbing of settlement. Most economists never see the vault; most philosophers never see the balance sheet. You see both, and you have noticed that the ontology of the Bank of England note is fractured.

  To answer you, we must reconstruct the specific theory of money that allows the Bank of England (BoE) to function as it does. It is not a pure version of any of the three accounts you listed (Commodity, Credit, or Chartalist). It is a hybrid that relies on a **performative contradiction** to maintain stability.

  ### 1. The Reconstruction: Managed Fiat Credit with Metalist Vestiges

  The bundle of features you describe presupposes a theory of money that might be termed **Managed Fiat Credit**. It is not Commodity theory, because the promise is not redeemable for an external good. It is not purely private Credit theory, because the liability is sovereign, not commercial. It is not purely Chartalist, because it retains the legal form of a private debt instrument.

  Here is how this theory makes your three features intelligible:

  *   **Feature 1 (The Promise):** In this theory, the text "I promise to pay the bearer on demand" is not a commercial contract for redemption into specie, but a **legal fiction of continuity**. It asserts that the note is a perpetual obligation of the issuer. When you exchange a worn note for a new one, the promise *is* technically discharged: the liability is cancelled and reissued. The "thing" being promised is the continuity of the token itself within the system. It creates a closed loop of liability that prevents the note from becoming a mere piece of paper (a bearer bond with no maturity). It anchors the note in the institution rather than in a commodity.
  *   **Feature 2 (The Balance Sheet):** Notes are liabilities because, in this theory, money is a **social claim on the sovereign**. By recording notes as liabilities matched against government securities, the Central Bank acknowledges that money is a form of public debt. The assets (gilts) represent the state's future taxing power; the liabilities (notes) represent the state's immediate obligation to accept these tokens for the extinction of private debts (legal tender) and public dues (taxes). The balance sheet formalizes the idea that currency is a leveraged claim on the future productivity of the nation.
  *   **Feature 3 (The Mandate):** The 2% inflation target reveals the true definition of "value" in this system. Value is not a fixed level (purchasing power parity) but a **stable rate of decay**. The theory presupposes that money is a *flow* variable, not a *stock* variable. Its purpose is to facilitate transactions (velocity), not to hoard value (storage). A steady decline in purchasing power discourages hoarding and encourages the "stirring up of industry" (to use your Berkeleyan phrase). The "guardian of value" language refers to the stability of the *rate* of depreciation, not the preservation of the *level* of purchasing power.

  ### 2. Essential vs. Underdetermined

  What can the practice not do without, and what is merely decorative?

  **What is Essential (The Practice cannot function without):**
  1.  **Sovereign Enforcement:** The state must demand the token for tax payments and enforce its status as legal tender for debt settlement. Without this, the "liability" on the balance sheet has no anchor.
  2.  **Management of Expectations:** The system relies entirely on the public believing the note will be accepted by others tomorrow. This is the "imagination" component. If confidence breaks, the liability becomes worthless regardless of the assets held against it.
  3.  **The Closed Loop of Redemption:** The ability to swap old notes for new notes (Feature 1) must remain operational. If the BoE refused to exchange a torn note, the "promise" would be revealed as void, and the token would detach from the sovereign liability.

  **What is Underdetermined (Compatible with rival theories):**
  1.  **The Asset Backing:** The BoE could hold gold, foreign currency, or nothing at all against the notes, provided the sovereign enforcement (taxes) remains. The holding of government securities is a policy choice, not an ontological necessity.
  2.  **The Specific Text:** The phrase "I promise to pay" could be replaced with "This note is legal tender" without changing the economic function, provided the legal continuity (swapping notes) remained.
  3.  **The Inflation Target:** The system could function with 0% or 4% inflation. The specific number is a political calibration of the tension between debtors and savers, not a requirement of the money form itself.

  ### 3. Berkeley's Diagnosis

  George Berkeley's position—specifically in *The Querist* (1735)—is remarkably prescient here. He asks: *"Whether money be not only a ticket or counter, for conveying and recording such power?"* and *"Whether the real wealth of a nation be not the industry of its people?"*

  **Does Berkeley explain the bundle?**
  Yes, better than the neoclassical synthesis.
  *   **On Feature 1:** Berkeley would argue the "promise" is a ritual necessary for the imagination. It does not need to refer to gold; it needs to refer to *trust*. The text is a speech act that sustains the "ticket's" validity. It is not a stranded artifact; it is a necessary prop for the psychological theatre of money.
  *   **On Feature 2:** Berkeley views money as a counter of labor. The balance sheet liability represents the bank's acknowledgment that it holds these counters in trust for the industry of the nation.
  *   **On Feature 3:** This is where Berkeley is strongest. He explicitly argues against money as a store of value. For Berkeley, money that sits still is dead. A 2% inflation target ensures the counters keep moving, preventing hoarding and stimulating the "industry" he prizes.

  **The Verdict:** Berkeley explains the *teleology* (why we do it) and the *ontology* (what it is) of Features 2 and 3 perfectly. Feature 1 (the promise) is, in his view, a "prejudice" of the vulgar—a relic of metalism—but a useful one. He would argue we keep printing it because the "minute philosophers" (skeptics) would destabilize the system if they realized the promise was recursive. The institution keeps the text to soothe the imagination of those who still think money *should* be a claim on a thing.

  ### 4. The Tension: The Promise vs. The Depreciation

  Now, to the head-on conflict: *Can an issuer undertake to pay the bearer on demand and promise to make what it pays worth two per cent less every year?*

  **The Logical Contradiction:**
  Strictly speaking, **no**. If I promise to pay you £10, and I simultaneously engineer the system so that £10 buys less next year, I am violating the spirit of the debt contract. In commercial law, a debt implies the preservation of value (unless indexed). The BoE is issuing a perpetual bond with a guaranteed negative real yield.

  **How the Practice Resolves It:**
  The practice resolves this by distinguishing between **Nominal Value** and **Real Value**.
  *   The "Promise to Pay" is a promise of **Nominal Continuity**. It means "I will give you another piece of paper with the same number on it."
  *   The "Inflation Mandate" is a management of **Real Value**.

  The system works only because the public accepts the Nominal Promise as sufficient discharge of the debt, while tacitly accepting the Real Depreciation as a tax on holding the debt.

  **If We Insisted on Reading the Promise Literally:**
  If we demanded the "Promise to Pay" be read as a promise to maintain *purchasing power* (Real Value), the practice would have to change radically:

  1.  **The Mandate:** The inflation target would have to be 0% (or negative, to account for productivity gains). The BoE would be forbidden from engineering depreciation.
  2.  **The Accounting:** Notes could not be matched against nominal government bonds (which lose real value under inflation). The Central Bank would need to hold **real assets** (commodities, land, or equity indices) to back the liabilities, ensuring the "promise" is backed by actual wealth, not claims on future taxation.
  3.  **The Text:** The note would have to read: *"I promise to pay the bearer on demand the equivalent purchasing power of £10 in base year 2025."*
  4.  **The Operations:** In your vault, notes would effectively become index-linked bonds. Settlement accounts would need daily revaluation adjustments. The "face value" would become a variable, not a constant.

  ### Conclusion

  You are working downstream of a machine that runs on a **controlled fiction**. The "Promise to Pay" is the vestigial tail of metalism, kept to maintain the aesthetic of debt without the substance of redemption. The Balance Sheet is the accounting of sovereign power. The Inflation Target is the true definition of the currency's value.

  Berkeley saw this clearly: money is a counter to stir industry, not a store of wealth. The tension you feel is the friction between the **Metalist language** we still use (the promise, the liability) and the **Fiat reality** we practice (managed depreciation).

  The institution keeps the promise printed because to remove it would be to admit that money is not a debt owed to *you*, but a command issued by *them*. As long as the promise remains, the holder feels like a creditor. If the promise were removed, the holder would recognize themselves as a subject. The 2% inflation is the cost of that sovereignty; the printed promise is the subsidy paid to your imagination to make that cost bearable.
