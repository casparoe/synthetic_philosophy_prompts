      *(Self-Correction on the Promise)*: The promise is technically dischargeable by swapping a worn note for a new one. It is a promise of *continuity of the token*, not redemption into specie. This is crucial.

  9.  **Final Output Structure:**
      1.  Introduction: Validating the operational-philosophical tension.
