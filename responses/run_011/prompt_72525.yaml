          *   The "Promise" is a prop for the imagination. It's not a stranded artifact; it's a necessary fiction.
      *   *Section 4: The Tension (The Core Philosophical Problem).*
          *   Nominal vs. Real.
          *   If read literally: The BoE would be insolvent in real terms.
