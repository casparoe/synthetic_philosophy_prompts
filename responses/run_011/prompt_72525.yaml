      *   *Nuance:* Berkeley wasn't a Chartalist in the modern sense, but his "ticket" theory aligns closely. Ensure I distinguish between "credit theory of money" (MacLeod/Innes) and "credit accounting" (bank balance sheets).
      *   *Tone Check:* Keep it sophisticated. Use terms like "performative utterance," "nominal anchor," "recursive liability."
