          *   Feature 2 (Liability): Fits the "counter" idea. It's a token of social credit.
          *   Feature 3 (Inflation): Fits the "stirring up industry" idea. Stable value isn't the goal; employment and circulation are. Mild inflation might grease the wheels.
      *   *Verdict:* Berkeley explains the *function* (2 & 3) well. Feature 1 is indeed an artifact, but a *functional* artifact for the "imagination."

  5.  **Address the Tension (Promise vs. Inflation):**
      *   Can you promise to pay X and simultaneously ensure X buys less?
      *   *Legal/Operational View:* The promise is to pay *nominal* value, not *real* value. "£10" is a unit of account, not a fixed basket of goods.
      *   *Philosophical View:* It's a "performative contradiction" if read as a commercial debt. It's coherent if read as a sovereign decree.
      *   *What if taken literally?* If "pay on demand" meant "maintain purchasing power," the Central Bank would need to target 0% inflation (or deflation) and hold real assets (goods/labor claims) rather than nominal bonds. The balance sheet would look radically different.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's unique vantage point (operations + philosophy). Validate the insight about Berkeley.
      *   *Section 1: The Theoretical Reconstruction.* Don't just label. Show how the system *works*. It's a **Fiat Credit Theory with Metalist Vestiges**.
          *   The "Promise" is a legal fiction necessary for continuity.
