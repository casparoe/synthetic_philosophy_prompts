answer: |-
  Here is the plan. It is built to leverage their existing geological literacy (cores, boundaries) while correcting the specific stratigraphic category error most people make about the 2024 vote.

  ### 1. The Precondition: What must be in place before "Who Decides?" makes sense
  You are correct: if you jump to the vote, they will hear "Science vs. Politics." Before the "who decides" question is intelligible, you must establish **the rules of the game.**

  They need to understand that the International Commission on Stratigraphy (ICS) does not vote on *truth* (e.g., "Are humans impacting the Earth?"); it votes on *utility* (e.g., "Is this specific signal the best global marker for a new box on the chart?").

  **The Whiteboard Setup (First 5 Minutes):**
  Draw the hierarchy: **Eon → Era → Period → Epoch → Age.**
  Mark the **Holocene** (Epoch).
  Draw a box next to it labeled **Anthropocene (Proposal)**.
  Draw a gavel next to that labeled **AWG** (Working Group) and a higher gavel labeled **Subcommission** (SQS).

  **The Concept to Lock In:**
  Distinguish **Informal Usage** (cultural, political, scientific shorthand) from **Formal Chronostratigraphy** (a defined unit of rock/time with a Golden Spike/GSSP).
  *   *Say this:* "The question isn't 'Is the Anthropocene real?' The question is 'Does the Anthropocene qualify as a formal Epoch under the current rulebook?'"

  ### 2. The Carrier Example: Crawford Lake & The Plutonium Spike
  **Verdict:** Yes, use Crawford Lake. It is the specific specimen on the table.
  **Risk:** It makes the debate look like a measurement error ("They found the wrong spike").
  **Mitigation:** You must frame the plutonium not as *proof of impact*, but as a *candidate boundary marker*.

  **The One Physical Object:**
  Bring a **clear acrylic tube containing a simulated sediment core.**
  *   **Layers:** Grey silt at the bottom, distinct red band in the middle (the 1964 plutonium peak), varved layers on top.
  *   **Why:** They have handled cores. This triggers their tactile intuition. They understand "correlation" and "marker horizons."
  *   **Must Have:** A label on the red band: "1964 Global Peak."
  *   **Must Not Have:** Do not bring a Geiger counter or discuss decay rates. That shifts the focus to physics. Keep it on *stratigraphy* (is this layer synchronous? is it preserved?).

  **How to use it:**
  Hold it up when discussing the AWG proposal. "This was the bid. A global isochron."
  Put it down when discussing the rejection. "The signal is real. The *box* didn't fit."

  ### 3. The Misconception Map & Sequencing
  You identified three; here are three more they will bring, ordered by when you must dismantle them.

  **1. "The Anthropocene is just Climate Change with a grander name."**
  *   **When:** **Before** Crawford Lake (Minute 10).
  *   **Why:** If they think Anthropocene = Warming, they will think the vote was about climate skepticism.
  *   **Fix:** List the markers: Plutonium, Fly Ash, Microplastics, Chicken Bones. Climate is one thread; the Anthropocene is the whole weave.
  *   **Whiteboard:** Write "Polystrate Markers" next to the core.

  **2. "The start date is a question about when humans became the biggest force on Earth."**
  *   **When:** **Before** Crawford Lake (Minute 12).
  *   **Why:** This is the cultural definition. If you don't separate this from the *stratigraphic* definition, the 1950s start date looks arbitrary.
  *   **Fix:** "Geologically, 'biggest force' doesn't matter. 'Most distinct, synchronous, preservable signal' matters. We could be the biggest force in 1800, but if the rock record is messy, we can't put a spike there."

  **3. "The vote settled it one way or the other." (The Binary Trap)**
  *   **When:** **During/After** the Vote reveal (Minute 25).
  *   **Why:** This is the core confusion. They think "Rejected" = "Doesn't Exist."
  *   **Fix:** "The vote settled the *formalization*. It did not settle the *reality*."

  **4. "Geologists are denying human impact." (The Political Inference)**
  *   **When:** **Immediately After** the Vote reveal (Minute 26).
  *   **Why:** The K-Pg guy will be ready to pounce on bureaucracy vs. truth.
  *   **Fix:** "The Subcommission agreed the signal is there. They disagreed it defines an *Epoch* rather than an *Event*."

  **5. "Formalizing it makes it real." (The Ontological Error)**
  *   **When:** **Conclusion** (Minute 35).
  *   **Why:** They need to leave knowing the rock record doesn't care about the ICS.
  *   **Fix:** "Future geologists will find the plutonium layer regardless of what we name it today."

  **6. "The Holocene is over." (The Continuity Error)**
  *   **When:** **Before** the Vote (Minute 20).
  *   **Why:** Many assume Anthropocene *replaces* Holocene.
  *   **Fix:** Clarify that the proposal was to *end* the Holocene at 1950. The vote kept the Holocene ongoing.

  ### 4. What to Cut vs. What to Announce as a Gap
  **Cut (Do not explain):**
  *   **The specific voting margins:** (e.g., 12 to 4). It invites gossip about personalities.
  *   **The alternative start dates:** (Neolithic, Industrial). Mention them only as "other proposals that were also set aside." Do not detail why they failed.
  *   **The ratification chain:** (ICS Executive Committee, IUGS). Just say "Higher bodies confirmed."

  **Announce as Gaps (Say out loud):**
  *   **"I am not going to explain why the Holocene won."**
      *   *Say:* "There are technical stratigraphic arguments about diachroneity and preservation that kept the Holocene in place. I'm skipping the technical weeds to focus on the decision structure."
  *   **"I am not going to predict the future of the term."**
      *   *Say:* "Whether 'Anthropocene' becomes formal in 50 years is not my business. My business is explaining why it isn't today."
  *   **"I am not defining 'Human Impact'."**
      *   *Say:* "We all agree humans impact the planet. That is not the geology problem. The geology problem is *time resolution*."

  ### 5. The Diagnostic Question
  Do not ask "Did you enjoy that?" or "Is the Anthropocene real?"
  Ask this at minute 39:

  **"If we find a layer of plastic in a million years, does it matter if we called it the Anthropocene today?"**

  *   **Wrong Answer (They missed the point):** "Yes, because otherwise they won't know it was us." (Implies the label creates the reality).
  *   **Right Answer (They got the distinction):** "No. The rock is the rock. The name is just our filing system."
  *   **Why this works:** It tests if they separated the *physical signal* (which they know as rockhounds) from the *stratigraphic label* (the bureaucracy).

  ### 6. Sequence Summary (40 Minutes)
  *   **00-05:** **The Rules.** Whiteboard hierarchy. Informal vs. Formal. (Precondition).
  *   **05-10:** **The Signal.** Climate vs. Polystrate markers. (Misconception 1 & 2).
  *   **10-20:** **The Proposal.** Crawford Lake Core (Object). The 1950s Spike. The Holocene continuity. (Misconception 6).
  *   **20-25:** **The Vote.** Rejection confirmed. (Misconception 3).
  *   **25-30:** **The Why.** Signal vs. Unit. Impact vs. Epoch. (Misconception 4).
  *   **30-35:** **Who Decides.** It's the Rulebook, not the People.
  *   **35-40:** **The Gap & The Question.** Announce cuts. Ask the Diagnostic Question.

  **Final Note on Tone:**
  Treat them as colleagues who haven't read the specific committee minutes. You are not teaching them geology; you are teaching them the *bureaucracy of geology*. The K-Pg guy will respect you if you acknowledge that boundaries are often messy compromises, not just natural truths. Use that. "We all know the K-Pg boundary is more than just the iridium; it's the consensus on how to map the iridium. This is the same problem."
