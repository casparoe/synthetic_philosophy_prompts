answer: |-
  Dear Friend,

  It is understandable why your friend finds the standard metre bar analogy appealing, because on the surface it seems to dissolve the Euthyphro dilemma by changing the category of the discussion. He is essentially arguing that goodness is not a property God has, but a standard God constitutes, much like the length of the metre bar constitutes the metric unit. To help you articulate why this feels unsatisfying, let us first walk through the mapping he is proposing without getting bogged down in technical jargon. In his picture, the standard metre bar in Paris corresponds to God, and the unit of measurement, one metre, corresponds to the property of goodness. When we measure a table against the bar to see if it is one metre long, that corresponds to measuring an action against God's nature or commands to see if it is good. The claim that the bar is exactly one metre long by definition corresponds to the claim that God is good by definition. Finally, the act of gaining information by comparing an object to the bar corresponds to learning what is right by consulting divine command.

  Once we lay out that mapping, we can separate the disanalogies into those that are merely surface-level and those that actually damage the argument. The surface differences are things like the fact that the bar is physical and located in a vault while God is spiritual and omnipresent, or that the bar is inanimate while God is a person. These do not really hurt the logic of the analogy, because analogies rarely hold perfectly in every physical detail. The damaging disanalogies, however, strike at the heart of what morality is supposed to do. The first major problem is that the metre bar establishes a convention, whereas morality establishes a norm. We choose the bar to be the standard for convenience and consistency, but we do not feel morally obligated to the bar itself. If the bar changed length, we would just update our rulers. If God's nature changed, your friend would likely say morality changes, but this makes goodness seem arbitrary in a way that metric units are allowed to be but moral truths are not. The second damaging disanalogy is that the metre bar is publicly accessible in a way that resolves disputes, whereas God's nature is not. If two carpenters disagree about a length, they can bring their wood to Paris or check a calibrated copy. If two theologians disagree about what is good, they cannot lay their actions against God's nature directly to settle the score, which leads to the epistemic problem you identified.

  This brings us to your two specific intuitions, both of which are spot on. You noted that saying the bar is a metre long is trivial because humans stipulated it to be so, whereas nobody stipulated God into existence. This is a crucial distinction. The statement the bar is one metre long is true by fiat, meaning we decided it would be the standard. But when a theist says God is good, they usually mean this is a substantive truth about God's character that makes Him worthy of worship, not merely a definition we invented. If God is good only in the same way the bar is a metre, then goodness loses its independent weight and becomes synonymous with power or existence. It makes the worship of God akin to worshipping a definition, which empties the term good of the very value that made us interested in it in the first place. Your second point about epistemic work is equally damaging to his view. The metre bar is useful precisely because it is an external check that stops argument. If the measurement picture fails to provide a similar check for moral claims, then it cannot do the work your friend claims it does. He says God's commands stay informative, but if we cannot access the standard directly to verify the commands, then the informativeness is illusory. We are left relying on interpreters who claim to know the standard, which reintroduces the very ambiguity the analogy was supposed to solve.

  Ultimately, there is no measurement analogy that can fully carry the weight your friend wants it to because measurement is descriptive while morality is prescriptive. A better analogy might be something like the sun and vision, where the sun makes sight possible and allows us to see objects, including the sun itself, but even that struggles with the issue of error and interpretation. The honest verdict is that the measurement picture fails because it conflates defining a unit with defining a value. By trying to collapse both horns of the Euthyphro dilemma, your friend ends up collapsing the normativity of morality itself. He successfully argues that God is the standard, but only by making that standard a matter of definition rather than value, which leaves the question of why we ought to follow that standard entirely unanswered. You are right to feel that something is missing, because the analogy solves the logical puzzle by removing the moral force that made the puzzle matter in the first place.

  I hope this helps you clarify your thoughts for your next conversation.

  Best regards,

  Your Friend
