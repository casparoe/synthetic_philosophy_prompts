  hey — hoping you can sanity-check a bit of reasoning for me before I file. I cover science and ideas for a weekly, and the piece I'm on is about a comms firm whose entire product is what negotiation people call paltering: answering reporters with sentences that are literally true but built so you walk away holding a false belief. The founder is a real philosophy nerd, gave me two hours, and one exchange stuck with me. I asked whether his firm ever tells a client to flatly deny something. He said never — the closest they get is the sort of answer where a company asked about a product recall says it hasn't recieved any regulatory finding against the product. True, because the company pulled it from shelves itself before anybody ever issued a finding.

  His big pitch, and this is the bit I want checked, is that his firm definately isn't in the bullshit business in Frankfurt's sense. His argument: the bullshitter is defined by not caring whether what he says is true, whereas his people care obsessively, because they have to know exactly what's true in order to stay inside it. So on Frankfurt's own test they're the opposite of bullshitters. And they're not lying either, since nothing they say is false. Which leaves misleading — and misleading is the mildest of the three, right?

  So: doesn't the Frankfurt analysis basically settle the ethics in his favour? If indifference to truth is what makes bullshit worse than lying, then a firm that treats truth as something to be scrupulously obeyed ought to sit at the clean end of the spectrum, and the more precisely true its answers get the further it moves away from dishonesty. Tell me whether that actually holds, and what I should be saying about the moral difference between lying and misleading — I've got maybe 300 words for it, and right now I think I'm about to just paraphrase him approvingly tbh.
