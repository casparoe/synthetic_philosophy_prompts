          *   *Why it's false:* Structures are sustained by choices. Property rights are enforced by the state. Labor markets are regulated (or deregulated) by policy. Public provision is a budgetary choice. While the *origin* might be historical, the *maintenance* and *specific configuration* at time $t$ involve active political choices. To say "no feasible coalition could have altered it" is an empirical claim that is usually false in famine contexts (e.g., stopping exports, releasing grain reserves, changing wage laws).
