      *   *Nuance:* The "dots" in science are rarely theory-neutral. In the graph, a dot is a dot. In science, an observation depends on the theory of the instrument. This is a huge disanalogy.

  6.  **Final Polish:** Ensure tone is analytical, direct, and respectful of the reading group's intelligence. Use clear headings. (Proceed to generate output based on this structure.)

