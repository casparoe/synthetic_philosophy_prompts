prompt: |-
  You're someone who works at the intersection of philosophy of social science and violence statistics — you know the whole "is the world getting less violent" fight inside out. Before you answer, brainstorm a handful of candidate concepts out loud (statistics, epidemiology, criminology, x-phi) and then narrow down to the best fit.

  Here's a pattern I keep hitting and have no word for. Every so often the definition of violence gets wider — coercive control starts counting, marital rape stops being legally invisible, some people start folding in structural or ecological harm. The recorded numbers then jump, and everyone argues about whether things got worse or whether we're just finally seeing what was always there. But the bit that actualy bothers me is this: the obvious fix — hold the definition constant and re-measure the whole series — doesn't work, because the widening of the definition is itself part of the moral progress I'm trying to track. Freezing the old narrow meaning to get a clean time series means deliberately measuring the wrong thing. So the thing I want to measure and the instrument I measure it with are both moving, and the movement in the instrument isn't noise, it's a verdict on the thing.

  Is there an established name for this exact configuration? I know the neighborhood: concept creep, detection or ascertainment bias, the dark figure of crime shrinking, gerrymandering a definition, moving the goalposts. None of them seem to capture the part where the instrument changes for good moral reasons and that's precisely what makes the trend unmeasurable in principle. Tell me which is closest and exactly how mine differs from it, and whether something better fits that I haven't thought of. If nothing fits, coin a term and define it sharply, with boundary cases: does it still apply when the definition narrows instead? when the widening is contested rather than widely accepted? when it's genuine moral progress versus fashion?

  Also please separate what's actually settled in this literature from what's genuinely disputed among people who know it — don't slide one side of the violence-decline debate in as if it were consensus.
