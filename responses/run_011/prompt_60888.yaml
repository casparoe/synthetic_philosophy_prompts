answer: |-
  ### Brainstorming the Neighborhood

  Alright, let's cast the net wide before we tighten the mesh. I'm hearing echoes from a few different disciplines here.

  *   **Psychometrics/Statistics:** The immediate technical term that springs to mind is **Measurement Invariance**. In longitudinal studies, you need to prove that the "ruler" hasn't changed length between Time 1 and Time 2. If the definition of violence changes, you have "non-invariance." Standard procedure is to adjust the model to restore invariance. But your case is the inverse: restoring invariance (freezing the definition) is ethically unacceptable.
  *   **Epidemiology/Criminology:** We talk about **Ascertainment Bias** or **Detection Bias**. This is when better screening makes it look like disease/crime is increasing. There's also the **Dark Figure of Crime** (unreported events). When the dark figure shrinks because we recognize new harms, the stats jump. But "bias" implies error, and you're saying this isn't error.
  *   **Philosophy/Psychology:** Nick Haslam's **Concept Creep**. This describes the semantic expansion of harm-related concepts (trauma, abuse, violence). It captures the *widening*, but Haslam's framework often treats this expansion as a problem of precision loss or semantic dilution, not necessarily as *moral progress* that breaks the data.
  *   **Sociology of Knowledge:** **Reflexivity**. The idea that the observer changes the observed. Or **Ontological Politics** (Annemarie Mol), where the reality of the thing is enacted by the methods used to measure it.

  **Narrowing Down:**
  "Ascertainment bias" is too clinical; it treats the change as a technical glitch to be corrected. "Concept creep" is the closest cultural descriptor, but it lacks the *normative necessity* you're highlighting—it often carries a whiff of "we're becoming too sensitive." "Measurement invariance" is the correct statistical description of the *problem*, but not the *reason* for it.

  The closest existing fit is **Concept Creep**, but it fails your specific test because it doesn't account for the *ethical obligation* to change the metric. It treats the expansion as a descriptive fact, sometimes a normative bug. You are describing a normative *feature*.

  ### The Verdict on Existing Terms

  **Closest Fit:** **Concept Creep** (Haslam, 2016).
  **How Yours Differs:** Concept creep describes the *expansion* of a concept's semantic boundary. It acknowledges that this can be positive (recognizing hidden harm) or negative (diluting meaning). However, in the literature, concept creep is usually analyzed as a threat to *scientific utility* (making concepts unfalsifiable). Your configuration flips this: the loss of scientific utility (comparability) is the *price* of moral validity. Concept creep asks, "Are we losing precision?" You are asking, "How do we measure progress when the definition of progress changes the baseline?"

  **Second Closest:** **Measurement Non-Invariance**.
  **How Yours Differs:** This is the statistical symptom, not the cause. In standard methodology, non-invariance is a failure state. You are describing a scenario where non-invariance is a *success state* morally, even if it's a failure state statistically.

  **Why "Moving the Goalposts" Fails:** That phrase implies bad faith or rhetorical cheating. Your scenario posits good faith and moral necessity.

  ### The Coinage: **Constitutive Moral Reclassification**

  Since no existing term captures the *obligatory* nature of the metric change and the resulting *incommensurability*, I propose we call this configuration **Constitutive Moral Reclassification (CMR)**.

  **Definition:**
  CMR occurs when a change in the operational definition of a social phenomenon is driven by normative progress (e.g., recognizing previously invisible harms), such that maintaining the previous definition for the sake of longitudinal comparability would constitute a moral error. The resulting statistical discontinuity is not noise, but a signal of ontological change in the social world.

  **Boundary Cases:**

  1.  **Does it apply when the definition narrows?**
      *   *Yes, but rare.* Example: Decriminalization of homosexuality or cannabis. If we stop counting consensual sodomy as "sexual violence" or "crime," the stats drop. If we kept the old definition to preserve the time series, we would be measuring *persecution*, not *harm*. This is CMR in reverse (moral progress via exclusion).
  2.  **What if the widening is contested?**
      *   *No.* If the expansion is debated (e.g., "Is a microaggression violence?"), it remains **Concept Creep** or **Concept Contestation**. CMR requires a *settled* or *dominant* normative consensus that the old definition was morally insufficient. If the field is still fighting about whether marital rape counts as "real" rape, you haven't reached the CMR stage yet; you're in the political struggle *preceding* it.
  3.  **What if it's fashion rather than progress?**
      *   *No.* If the definition widens due to academic trendiness without a corresponding shift in ethical consensus or legal reality (e.g., labeling "rudeness" as "violence" without institutional buy-in), this is **Semantic Dilution** (a negative form of Concept Creep). CMR requires the reclassification to be *institutionally enacted* (law, policy, diagnostic manual) based on a claim of moral correction.

  ### Settled vs. Disputed in the Literature

  You asked for a map of the terrain without sliding into the violence-decline debate itself. Here is the separation:

  **Settled (Methodological Consensus):**
  *   **Definitions are historically contingent:** Everyone agrees (Pinker, critics, criminologists, epidemiologists) that the operational definition of "violence," "war," or "homicide" has shifted over centuries. There is no "view from nowhere" dataset.
  *   **Long-term comparisons are fragile:** It is settled that comparing 14th-century homicide rates to 21st-century rates involves massive assumptions about record-keeping, intent, and jurisdiction.
  *   **The "Dark Figure" exists:** It is settled that recorded statistics are a subset of actual events, and the ratio of recorded-to-actual changes over time due to reporting mechanisms and legal definitions.

  **Disputed (Substantive & Philosophical):**
  *   **The Direction of the Bias:** This is the heart of the Pinker debate.
      *   *Side A (Declinists):* Argue that while definitions have widened, the *magnitude* of the decline is so large that it swamps the measurement noise. They argue CMR creates a "headwind" against the decline thesis (making the past look safer than it was), so the decline is even *more* impressive.
      *   *Side B (Critics/Skeptics):* Argue that CMR creates a "tailwind" for the decline thesis (making the past look safer because we didn't count structural/colonial/domestic harm). They argue the "decline" is largely an artifact of excluding harms that we now count.
  *   **The Ontology of Violence:**
      *   *Objectivists:* Believe violence has a core, trans-historical essence (e.g., physical bodily damage) that allows for stable measurement. They view CMR as a corruption of data.
      *   *Constructivists:* Believe violence is inherently normative; you cannot separate the "act" from the "judgment." They view the attempt to freeze definitions (to save the time series) as a form of epistemic violence itself.
  *   **How to Model the Break:** There is no consensus on how to statistically handle CMR. Some use "breakpoint analysis" to segment the time series. Others try to model "shadow rates" for the past. There is no agreed-upon method to "correct" for Constitutive Moral Reclassification without erasing the moral progress it represents.

  ### Summary
  You are describing **Constitutive Moral Reclassification**. It is the specific moment where **Measurement Invariance** must be sacrificed to preserve **Construct Validity**. The existing term **Concept Creep** describes the semantic expansion but misses the *statistical incommensurability* and the *moral necessity*. The "fix" you identified (holding the definition constant) is rejected in critical social science because it privileges *reliability* (consistency) over *validity* (truth), whereas in moral progress, validity is the higher order good.
