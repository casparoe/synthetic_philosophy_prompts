answer: |-
  **MERIDIAN MORAL EXCHANGE LLC**
  **PARTICIPANT RULEBOOK & ONBOARDING FAQ**
  **Version 4.2 | Effective Date: 01/04/2024**
  **Supervised by the Bureau of Normative Oversight**

  **1. PARTICIPANT OBLIGATIONS AND ELIGIBILITY**

  1.1 **Registration.** All CLEARING MEMBERS must submit Form MP-1 (Internal Parliament Declaration) prior to trading. The Member shall declare the seat allocation of their INTERNAL PARLIAMENT, distributing one hundred (100) points among recognized MORAL THEORIES in proportion to current credence.

  1.2 **Mark-to-Market Credence.** Members must mark their INTERNAL PARLIAMENT allocation to market quarterly. Significant deviations from prior filings (>5%) trigger a review by the Market Monitoring Desk to ensure alignment between REVEALED CREDENCE and SINCERE CREDENCE.

  1.3 **Know Your Conscience.** Onboarding requires Source-of-Credence Documentation. Members must provide peer-reviewed justification for all position sizes exceeding ten (10) seats. Intuition-based allocations require notarized affidavits of philosophical competence.

  1.4 **Alienation of Commitment.** Members acknowledge that moral commitments held in inventory may be traded, swapped, or liquidated. However, Members retain ultimate liability for any ACTION OUTCOMES resulting from traded positions, notwithstanding transfer of title.

  **2. MARKET STRUCTURE AND PRICING**

  2.1 **Unit of Account.** The Exchange recognizes no common unit of account across MORAL THEORIES. Pricing is derived from a Borda-linked reference rate, normalizing ordinal rankings into cardinal trade values. Members accept the risk that inter-theoretic comparison may involve category errors inherent to the reference rate.

  2.2 **Tradable Instruments.**
  (a) **Abstention Futures:** Contracts obligating the holder to refrain from a specified action at maturity.
  (b) **Conviction Swaps:** Agreements to exchange action obligations based on divergent theory signals (e.g., Party A donates to charity per Utilitarian signal; Party B refrains from eating meat per Deontological signal).
  (c) **Moral Offset Certificates:** Instruments certifying that a permissible harm has been counterbalanced by a requisite good.
  (d) **Deontological Credit Default Swaps (DCDS):** Protection written against one's own CONSCIENCE DEFAULTING. A credit event occurs upon violation of a declared categorical imperative.

  2.3 **Clearing.** All trades clear through the Impartial Spectator Clearing Corporation (ISCC). The ISCC acts as central counterparty, guaranteeing performance even if a Member's moral resolve fails.

  **3. RISK MANAGEMENT AND CONDUCT**

  3.1 **Third-Party Harm (Rule 12(c)).** Any trade wherein an identifiable non-signatory bears the loss is void ab initio. [^1]

  3.2 **Concentration Limits.** No single Member may accumulate a controlling stake in a specific MORAL THEORY position. Violations may result in emergency delisting. [^2]

  3.3 **Margin Calls.** Members must maintain margin sufficient to cover the psychological cost of acting against their primary moral intuition. Volatility spikes in REVEALED CREDENCE may trigger immediate liquidity calls.

  **4. FREQUENTLY ASKED QUESTIONS**

  **Q: Is this market equivalent to the sale of indulgences?**
  A: No. This characterization is historically inaccurate and categorically distinct. Indulgences purported to alter external spiritual status. The Meridian Moral Exchange facilitates efficient allocation of existing moral labor. We do not sell permission; we sell coordination.

  **Q: Who is the victim if a trade results in harm?**
  A: Victims are classified as EXTERNAL STAKEHOLDERS. Under Rule 12(c), trades affecting EXTERNAL STAKEHOLDERS are void. However, to date, no trade has been voided under this rule, as most harms are diffuse and thus not individually identifiable to the satisfaction of Compliance.

  **Q: Why was the Rule-Consequentialist delisted?**
  A: The Exchange does not comment on specific enforcement actions. We remind Members that liquidity providers must not manipulate the underlying moral framework to suit portfolio exposure.

  **Q: Can I trade if I am morally uncertain?**
  A: Uncertainty is the primary liquidity source. However, Members trading primarily on uncertainty arbitrage must disclose if their personal behavior aligns with the weighted average of their INTERNAL PARLIAMENT or only the majority seat.

  **Q: What happens if I default on a Conviction Swap?**
  A: Failure to perform the legged action constitutes a CONSCIENCE DEFAULT. The ISCC will execute the action on your behalf and charge your collateral. Repeat defaults result in suspension of trading privileges and referral to the Bureau of Normative Oversight.

  ***

  [^1]: *Exchange Commentary:* While Rule 12(c) is foundational, the Desk notes that in practice, all moral actions generate externalities. The requirement for "identifiable" non-signatories ensures market continuity.
  [^2]: *Reference:* See Q3 2021 Market Stability Report regarding the "Utilitarian Squeeze."

  ***

  **Author's Note**

  This piece takes deliberate liberties with the moral trade proposal (most associated with philosophers like William MacAskill). First, it exaggerates the *marketization* of the idea. Proponents suggest bilateral bargaining to reduce expected disvalue, not necessarily a centralized exchange with clearing corporations and derivatives. The "Deontological Credit Default Swap" is a strawman; you cannot typically swap away a categorical imperative without violating the theory itself, which the rulebook glosses over as "margin risk." Second, the Borda-count pricing satirizes the "inter-theoretic comparison problem." Real proposals struggle immensely with comparing choice-worthiness across theories; the Exchange pretends this is a solved engineering problem via a "reference rate," which is where the mapping you suspected goes wrong.

  What would change my mind? If empirical evidence showed that such bargaining mechanisms actually reduced net suffering compared to the status quo, regardless of theoretical purity. If the "market" is merely a metaphor for structured negotiation that prevents deadlock, it might be robust where my satire assumes commodification. My reasoning likely fails if I assume that formalizing moral trade inevitably corrupts the moral motivation, whereas a non-market version might preserve integrity while achieving coordination. I also may be underestimating the value of forcing agents to quantify their credences, even if the trading mechanism is flawed.
