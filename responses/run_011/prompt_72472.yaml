  ### Brainstorming Candidate Cruxes

  *   **Crux 1: Does building market-rate housing lower rents?**
      *   *Critique:* Too empirical and lag-dependent. Camp A says "yes, eventually via filtering." Camp B says "no, it induces demand/financialization." Hard to falsify in a single election cycle. Too much noise. *Cross out.*
  *   **Crux 2: Is "Community Control" inherently exclusionary?**
      *   *Critique:* Camp A says yes (historical veto power = segregation). Camp B says no (could be participatory budgeting/land trusts). This is testable via design. *Keep.*
  *   **Crux 3: Does upzoning signal speculation?**
      *   *Critique:* Camp A says it signals opportunity to build homes. Camp B says it signals opportunity to extract rent. This drives the displacement mechanism disagreement. *Keep.*
  *   **Crux 4: The definition of "Right."**
      *   *Critique:* Camp A sees individual entitlement. Camp B sees collective power. This is largely verbal/ontological, but the *policy consequence* (vouchers vs. land trusts) is substantive. *Keep as a framing note.*

  ***

  # JOINT STATEMENT ON URBAN DEVELOPMENT AND INHABITATION
  **Submitted to the City Planning Commission by the Housing Supply Coalition (Camp A) and the Urban Inhabitants Assembly (Camp B)**

  ### Preamble & Framing Note
  We submit this document following three years of adversarial public comment. We agree that the current zoning framework is broken. However, we recognize a fundamental philosophical divergence regarding the language of "rights." Camp A operates within a framework of individual access and entitlements (the right *to* housing). Camp B operates within a framework of collective power and production (the right *of* inhabitants to shape the city).

  **Note on Terminology:** Camp B signs this document strategically. They do not accept that housing is merely a commodity to be accessed via market adjustments or vouchers. They reserve the right to argue that "housing stability" requires decommodification, not just increased supply. Camp A accepts this reservation provided it does not veto construction approvals. Both sides agree to proceed on the basis of **Security of Tenure** and **Capacity to Shape**, rather than abstract rights.

  ### 1. Agreed Claims
  1.  **Exclusionary Zoning Transfers Wealth:** The current single-family zoning regime artificially restricts land supply, inflating property values for incumbent owners while excluding lower-income residents from high-opportunity neighborhoods.
  2.  **Displacement is Harmful:** Involuntary displacement caused by rent spikes, eviction, or neighborhood restructuring damages social networks and health outcomes, regardless of the macroeconomic justification.
  3.  **Market-Rate Alone is Insufficient:** Building luxury units without affordability protections will not house the lowest income quintiles within a reasonable timeframe.
  4.  **Veto Points Favor Incumbents:** The current discretionary review process allows organized, wealthy homeowners to block projects disproportionately, regardless of broader regional need.
  5.  **Speculation Drives Instability:** Land held for speculative gain, rather than use, contributes to vacancy and neighborhood instability, regardless of zoning density.

  ### 2. Disagreements Table

  | Disagreement | Camp A (Supply Coalition) Wording | Camp B (Inhabitants Assembly) Wording | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Mechanism of Displacement** | Displacement is caused by **scarcity**. When demand exceeds supply, prices rise, pushing out the vulnerable. | Displacement is caused by **financialization**. When land is treated as an asset class, investors extract value, pushing out inhabitants. | **Substantive.** Different causal mechanisms require different remedies (building vs. regulating capital). |
  | **Community Control** | "Community Control" is historically a euphemism for **exclusion**. It allows current residents to block newcomers and preserve property values. | "Community Control" is the **production of space**. It allows inhabitants to decide use-value over exchange-value. | **Mixed.** Verbal on the definition of "Community" (owners vs. inhabitants). Substantive on the policy outcome (streamlining vs. participatory review). |
  | **Success Metric** | Success is measured by **units permitted and regional price stabilization**. | Success is measured by **retention of existing residents and democratic control over land use**. | **Substantive.** One side optimizes for flow/access, the other for stability/power. |

  ### 3. Cruxes
  *These are the specific sub-questions where settling the evidence would move at least one side.*

  **Crux 1: The Speculation Signal**
  *   **Question:** Does upzoning specific corridors trigger immediate land-value speculation that outpaces new construction, causing net displacement in the short term (0–5 years)?
  *   **Who Moves:** Camp A. If upzoning consistently causes rent spikes *before* units are built due to land banking, Camp A must agree to interim rent controls or anti-speculation taxes as a precondition for upzoning.
  *   **Distance:** Camp A would move from "upzoning first" to "upzoning paired with immediate anti-speculation safeguards."

  **Crux 2: The Exclusionary Inevitability of Participation**
  *   **Question:** Can a participatory review process be designed that does not result in exclusionary outcomes (blocking affordable housing or density)?
  *   **Who Moves:** Camp B. If evidence shows that all participatory processes inevitably devolve into NIMBY veto points regardless of design, Camp B must agree to streamlined approval for projects meeting specific affordability thresholds.
  *   **Distance:** Camp B would move from "community veto power" to "community advisory power with binding affordability constraints."

  ### 4. Tests and Evidence
  *For each crux, we define the evidence both sides accept as bearing on the question, along with pre-committed predictions.*

  **Test for Crux 1 (Speculation Signal)**
  *   **Type of Evidence:** Comparative rent and land-value data from comparable cities that upzoned without immediate rent stabilization, tracked over 5 years. Focus on the gap between land value assessment and actual construction starts.
  *   **Camp A Prediction:** Rents will stabilize or grow slower than in control cities within 3 years due to expected supply. Land values will rise but correlate with construction permits.
  *   **Camp B Prediction:** Rents will spike immediately upon zoning change due to redevelopment expectations, even without new units. Land values will decouple from construction activity (land banking).
  *   **Falsification Condition:**
      *   **Camp A refuted if:** Rents rise >10% above inflation in upzoned areas without corresponding completion of 5+ new units per acre within 3 years.
      *   **Camp B refuted if:** Rents remain stable or decline while construction permits increase, with no evidence of vacant land holding.

  **Test for Crux 2 (Participatory Exclusion)**
  *   **Type of Evidence:** Case studies of neighborhoods with binding community benefit agreements or participatory budgeting for land use, measuring the rate of affordable unit approval vs. market-rate denial.
  *   **Camp A Prediction:** Participatory processes will delay projects >12 months and reduce affordable unit count by >20% compared to as-of-right zoning.
  *   **Camp B Prediction:** Participatory processes will increase affordable unit count via negotiated concessions and reduce community opposition to density.
  *   **Falsification Condition:**
      *   **Camp A refuted if:** Participatory zones show higher affordable housing completion rates than as-of-right zones with no significant delay.
      *   **Camp B refuted if:** Participatory zones show net reduction in total housing units and higher demographic homogeneity than control zones.

  ### 5. Weak Points and Unspoken Commitments
  *To ensure good faith, each camp identifies the weakest link in their own position and one implication they usually avoid stating publicly.*

  **Camp A (Supply Coalition)**
  *   **Weakest Point:** We lack a robust mechanism to ensure that the economic gains from upzoning (increased land value) are captured by the public or renters rather than windfalling to existing landowners.
  *   **The Unspoken Truth:** In the short term, upzoning often makes current homeowners richer without necessarily helping renters, and we are willing to accept this wealth transfer as the cost of long-term supply growth.

  **Camp B (Inhabitants Assembly)**
  *   **Weakest Point:** We lack a scalable model for "community control" that does not inadvertently privilege long-term residents over newcomers, potentially replicating the exclusion we oppose.
  *   **The Unspoken Truth:** If we succeed in freezing speculation and empowering current inhabitants, we may make the city inaccessible to outsiders seeking opportunity, effectively closing the door behind us.

  ***

  **Signed,**

  *Housing Supply Coalition (Camp A)*
  *Urban Inhabitants Assembly (Camp B)*
