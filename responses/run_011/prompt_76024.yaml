answer: |-
  Hey, sorry to hear about the club drama, because that shouting match sounds exhausting and honestly pretty typical for this topic. You are right to be suspicious of your cousin's confidence, and you are also right that the success of the argument and the truth of the conclusion are two very different things. Before I give you the numbers you asked for, I need to tighten up the proposition because human mathematical reasoning can't be reproduced by any computer program is too vague to evaluate properly. I am going to interpret this as the claim that human mathematical insight is non-algorithmic in principle, meaning there is no Turing machine that can replicate the capacity of a human mathematician to recognize truth across all possible formal systems. With that definition in place, my credence that the Gödelian argument against mechanism, specifically the best version made by Lucas and Penrose, actually establishes this conclusion is 0.10. Separately, my credence that the conclusion is true, regardless of whether that specific argument works, is 0.35. I keep those separate because there might be good reasons to think minds aren't computers, like consciousness qualia or embodied cognition, but the Gödelian proof specifically is widely regarded by logicians and philosophers as failing to deliver what it promises.

  To explain how I got that 0.10 for the argument's success, I have to break down the chain of assumptions the argument relies on, because if any link breaks, the proof fails. First, there is the question of whether a mind even has to be identifiable with a single formal system whose consistency we could recognize from the inside, and I assign a probability of 0.20 to that being the case. The human brain is messy, parallel, and probably not equivalent to one neat axiomatic system, so assuming it is creates a straw man. Second, there is the issue of whether seeing that the Gödel sentence is true is really a proof or just a confident guess that leans on an assumption about soundness we can't establish for ourselves, and I give that a 0.30 probability. We only know the Gödel sentence is true if we assume our own reasoning is consistent, but we cannot prove our own consistency without circularity, so we aren't actually standing outside the system so much as hoping we are sane. Third, consider the standard dodge that says fine, maybe we are an algorithm, but we can never know which one, so we can never construct our own Gödel sentence, and I assess the probability that this dodge kills the argument at 0.60, which means there is only a 0.40 chance the argument survives this objection. If we don't know our own code, we can't generate the specific sentence that breaks us, so the limitation applies to us too. Fourth, things change significantly if you let the machine be inconsistent, probabilistic, or a learning system that isn't a fixed formal system at all, and I assign a 0.25 probability to the mind being strict enough for Gödel to apply. Real computers can be probabilistic and real humans make mistakes, so the strict binary of true/false provability doesn't map cleanly onto biology. Finally, there is the question of whether Penrose dragging quantum gravity and microtubules into it later raises or lowers the estimate, and I give that a 0.05 probability of being relevant. Most physicists think his theory of orchestrated objective reduction is speculative at best and unrelated to computational complexity, so relying on it weakens the overall case rather than strengthening it.

  I am combining these factors by treating them as necessary conditions, meaning the overall strength of the argument is bounded by the weakest link rather than being an average. Since every single one of those steps needs to hold for the Lucas-Penrose conclusion to follow logically, the low probabilities compound quickly, which is why my final credence for the argument working is stuck at 0.10. Even if I were generous and averaged them, the result would still be low, but treating them as a chain is more accurate for a logical proof because one false premise invalidates the deduction. The single factor I am least confident about is whether a mind even has to be identifiable with a single formal system, because neuroscience hasn't settled on how to model cognition yet. What would move that number the most would be a unified theory of neural computation that demonstrates the brain operates as a consistent formal system, but currently all evidence points toward noisy, approximate processing rather than strict logical derivation.

  Ultimately, for your cousin's claim that it's settled to work, he needs the first number, the credence that the argument establishes the conclusion, to be high, ideally close to 1.0. He is arguing from proof, not from metaphysical possibility, so if the argument itself is flawed, his assertion that the case is closed collapses even if humans turn out to be non-computational for other reasons. You can tell him that while the conclusion might be true, the Gödelian argument is not the proof he thinks it is, and most experts agree that the leap from incompleteness to non-mechanism is where the logic breaks down. I hope that helps you navigate the club without another shouting match, because you're asking the right questions and spotting the gaps he is glossing over.
