answer: |-
  Here is the plan. I am going to be blunt about the ordering and the case, because seventy-five minutes is not enough time to be polite to a structure that will collapse under its own weight.

  ### I. The Ordering: Why Your Sequence Fails and How to Fix It

  Your provisional ordering (Single Cause $\rightarrow$ Firing Squad $\rightarrow$ Conjunctural $\rightarrow$ Historian's Synthesis) is logically elegant but pedagogically backward for this specific audience. It validates their econometric intuition before breaking it, which makes them defensive when you finally break it. It also treats "Firing Squad" (redundant sufficiency) and "Mirror Image" (conjunctural necessity) as symmetrical opposites. They are not.

  **The Dependency Structure:**
  1.  **Counterfactual Stability (The Pre-requisite):** Before they can understand overdetermination, they must understand that their $Y(0)$ is not a stable object in history. In an RCT, $Y(0)$ is the average outcome of the control group. In history, $Y(0)$ is a specific world where $X$ did not happen, *holding everything else constant*. Historians argue you cannot hold everything else constant.
  2.  **Conjunctural Causation (INUS):** This must come *before* overdetermination. Most historical causation is not "X caused Y" but "X combined with Z caused Y." This is the baseline historical claim. If you start with Firing Squads, you teach them that history is about redundancy. It isn't; it's about configuration.
  3.  **Overdetermination (Redundancy):** This is the *special* claim. It is not the default. It is the claim that the *configuration itself* was robust to the removal of one element.

  **The Revised Whiteboard Plan (75 Minutes):**

  *   **00–15: The PO Anchor and the Break.**
      *   *Whiteboard Left:* Draw the standard Potential Outcomes table ($Y_i(1), Y_i(0)$). Ask: "What is $Y(0)$ for the French Revolution?"
      *   *The Break:* Show that changing $X$ (e.g., calling the Estates General) changes $Z$ (the composition of the Third Estate). In history, $X$ and $Z$ are not orthogonal.
      *   *Goal:* Establish that *ceteris paribus* is a choice, not a fact.

  *   **15–35: The Conjunctural Structure (INUS).**
      *   *Whiteboard Center:* Draw a chain with three links: $A \rightarrow B \rightarrow C \rightarrow Outcome$.
      *   *The Move:* Cross out link $B$. The chain breaks. Now draw a second chain alongside it: $D \rightarrow E \rightarrow F \rightarrow Outcome$.
      *   *Correction:* No, that's overdetermination. For INUS, draw a single gate that requires two keys turned simultaneously. $A$ + $B$ $\rightarrow$ $Y$.
      *   *Definition:* $A$ is an **I**nsufficient but **N**ecessary part of a condition which is itself **U**nnecessary but **S**ufficient.
      *   *Visual:* Use intersecting circles. The outcome is the intersection. Removing $A$ makes the intersection empty.
      *   *Why here:* This is what historians do 90% of the time. They explain configurations.

  *   **35–55: Overdetermination (The Firing Squad).**
      *   *Whiteboard Right:* Now draw the Firing Squad. Two arrows, both sufficient, hitting the target.
      *   *The Crucial Distinction:* In the INUS model (Center), removing $A$ saves the outcome (prevents it). In the Overdetermination model (Right), removing $A$ *does not* save the outcome because $B$ was also sufficient.
      *   *The Historian's Claim:* When a historian says "The War was overdetermined," they are claiming the *Right Board* structure, not the *Center Board* structure. They are claiming that even if the Archduke hadn't been shot, the Alliance System would have triggered it.
      *   *The Collapse:* Show how easily the Center turns into the Right. If the "Context" ($B$ in the INUS model) becomes so broad it counts as a cause itself, the INUS becomes Overdetermination. This is where you pause and let them see the slippage.

  *   **55–75: The Case and Synthesis.**
      *   Apply the boards to the case.
      *   Final Question.

  **Why this works:** It forces them to see Overdetermination as a claim about *robustness* (the outcome survives the removal of a cause), not just *complexity* (many causes exist).

  ### II. The Case: The Repeal of the Corn Laws (1846)

  You are right to reject 1914. It is too narrative, and the "inevitability" trap is fatal. You need a case that is binary, economic, and has a clear "Shock" vs. "Structure" debate.

  **The Case:** **The 1846 Repeal of the Corn Laws in Britain.**

  **Why this case:**
  1.  **Low Background Cost:** Every Econ/PolSci student knows "Tariffs" and "Famine." You can define the Corn Laws in two minutes (tariff on grain).
  2.  **Clear Counterfactuals:**
      *   *Cause A (The Shock):* The Irish Potato Famine (1845).
      *   *Cause B (The Structure):* The Anti-Corn Law League (pressure group/lobbying).
      *   *Cause C (The Agent):* Robert Peel's ideological conversion.
  3.  **The Overdetermination Claim:** The standard historical debate is exactly what you need to teach.
      *   *View 1 (Conjunctural):* Repeal required Famine + League + Peel. (INUS).
      *   *View 2 (Overdetermined):* Repeal was inevitable due to industrialization; the Famine just accelerated the timing. (Redundancy).
  4.  **Avoids Teleology:** Unlike 1914, the repeal was not "inevitable" in the long run (protectionism returned later in Europe). It allows you to separate *timing* from *occurrence*.

  **Constraints for the Session:**
  *   **Do not narrate the famine.** Treat it as an exogenous shock variable $S$.
  *   **Do not discuss Peel's biography.** Treat him as an agent variable $A$.
  *   **Focus on the Logic:** Ask: "If $S=0$ (No Famine), does $Y=1$ (Repeal)?"
      *   If they say "No," they are arguing for Conjunctural Causation (INUS).
      *   If they say "Yes, but later," they are arguing for Overdetermination.
  *   **Why not the Fed (1913)?** It tempts students into "Panic $\rightarrow$ Reform" IV thinking, which reinforces the Single Cause model you are trying to break. Corn Laws forces them to weigh Ideology vs. Shock.

  ### III. The Misconception Map

  You identified the right errors, but you need to know when to absorb them and when to fight them.

  **Incoming Misconceptions (From Econ/PolSci):**
  1.  **"Overdetermined = Multicollinearity."**
      *   *When to head off:* Minute 20 (INUS section).
      *   *Fix:* Multicollinearity is a statistical estimation problem. Overdetermination is a structural feature of the world. You can estimate coefficients in an overdetermined system; the coefficients just don't capture the *necessity*.
  2.  **"The Omitted Variable Critique."** (*"This is just a rich specification."*)
      *   *Strategy:* **Absorb this.** Do not fight it.
      *   *Script:* "You are right. If you had infinite data and a true structural model, you could estimate the interaction terms. But historians rarely have that. They have one observation ($N=1$). Overdetermination is the claim we make when we cannot run the regression."
      *   *Why:* If you fight the econometricians on their turf, you lose. concede the turf, change the game.
  3.  **"Cause = Coefficient Significance."**
      *   *When to head off:* Minute 10.
      *   *Fix:* A variable can be statistically significant but historically trivial (a cause, but not *the* cause). Distinction between *causal effect* and *causal importance*.

  **Manufactured Misconceptions (From Your Lecture):**
  1.  **"Historians reject counterfactuals."**
      *   *Risk:* If you emphasize the instability of $Y(0)$ too much, they will think historians are anti-science.
      *   *Fix:* Explicitly state: "Historians are obsessed with counterfactuals. They just argue about the *distance* to the nearest possible world."
  2.  **"Overdetermination means nothing matters."**
      *   *Risk:* If the Firing Squad kills the outcome in all worlds, students think causation vanishes.
      *   *Fix:* Distinguish *Token Causation* (this bullet killed him) from *Type Causation* (bullets kill). Historians care about Tokens.
  3.  **"INUS is just Interaction Terms."**
      *   *Risk:* They will reduce your Center Board to $X_1 \times X_2$.
      *   *Fix:* Acknowledge the math is similar, but the *identification* is different. In history, we cannot vary $X_1$ while holding $X_2$ constant.

  ### IV. The Close: Question and Exclusions

  **The Final Question (Last 5 Minutes):**
  Do not ask them to define overdetermination. Ask them to apply the *test*.

  > "I am going to give you an outcome: **The 2008 Financial Crisis.**
  > I am going to give you two causes: **Deregulation** and **Global Savings Glut.**
  > If you argue the crisis was **Overdetermined**, what must you believe would have happened in a world where Deregulation did not occur?
  > If you argue the crisis was **Conjunctural**, what must you believe would have happened in that same world?"

  *   *Correct Answer (Overdetermined):* Crisis still happens (via Glut).
  *   *Correct Answer (Conjunctural):* Crisis does not happen (or is significantly smaller), because Deregulation was a necessary component of the sufficient set.

  This separates those who grasped the *logical structure* from those who just heard a story about 1846.

  **What to Deliberately Leave Out:**
  1.  **Pre-emption:** (e.g., Assassin A shoots, Assassin B would have but didn't). This is a philosophical rabbit hole that consumes 20 minutes and buys nothing for economic history.
  2.  **Probabilistic Causation:** Keep it deterministic for the 75 minutes. Introducing $P(Y|X)$ muddies the necessity/sufficiency distinction.
  3.  **The "Substantive vs. Evasive" Quarrel:** Do not tell them that some historians think "overdetermined" is a way to avoid picking a side. That is a meta-commentary for Year 2. For now, treat it as a structural claim.

  **Summary of the Pivot:**
