answer: |-
  ### Brainstorming and Evaluation of Candidate Concepts

  Before settling on a diagnosis, I have brainstormed the nearest established concepts in democratic theory that address the relationship between a representative body and the public. Below is an evaluation of how well each fits the pattern you described.

  1.  **Descriptive Representation (Hanna Pitkin)**
      *   *Concept:* A body represents the people if it "stands for" them by resembling them in relevant characteristics (age, class, opinion).
      *   *Fit:* This captures the first half of your pattern (the "statistical portrait" claim).
      *   *Mismatch:* Strict descriptive representation treats divergence from the public's current opinions as a *failure* of representation. It cannot account for the second half of your pattern, where divergence is celebrated as a correction. It lacks the mechanism to switch validity standards.

  2.  **Counterfactual Representation (Robert Goodin)**
      *   *Concept:* Representatives should act not as people *actually* think, but as they *would* think if they were informed and attentive.
      *   *Fit:* This captures the second half of your pattern (the "informed vs. uninformed" justification). It explicitly allows for divergence from polls.
      *   *Mismatch:* Goodin's theory is normative and consistent; it prioritizes the counterfactual will *over* the actual will from the start. It does not rely on the "statistical mirror" claim for legitimacy unless that mirror also reflects the counterfactual will. It doesn't explain the *opportunistic* use of the mirror claim when opinions happen to align.

  3.  **Epistemic Democracy (David Estlund, Hélène Landemore)**
      *   *Concept:* The legitimacy of a decision rests on its quality (truth/correctness) rather than the procedure or the mirror of opinion.
      *   *Fit:* This justifies the divergence (the assembly found the "right" answer on carbon tax).
      *   *Mismatch:* Epistemic democracy generally downplays the importance of the statistical mirror. It argues the crowd is wise because of aggregation and diversity, not necessarily because it is a microcosm. It doesn't explain why proponents lean so heavily on the "miniature of the population" claim in the first place.

  4.  **Gyroscopic Representation (Jane Mansbridge)**
      *   *Concept:* Representatives act based on their own internalized principles and characteristics, which align with constituents because they share similar backgrounds (selection by lot fits this).
      *   *Fit:* Explains why sortition is used (selecting people "like us" who will deliberate "like us").
      *   *Mismatch:* Like descriptive representation, this implies a continuity of judgment. If the gyroscopes spin in a different direction than the public, the claim of gyroscopic representation is weakened, not strengthened.

  5.  **Constructivist Representation (Michael Saward)**
      *   *Concept:* Representation is a claim-making activity; the "people" are constructed by the representative (e.g., "the informed people" vs. "the raw public").
      *   *Fit:* This is the strongest existing framework. It acknowledges that proponents are *constructing* a specific version of "the public" (the informed microcosm) to validate the assembly.
      *   *Mismatch:* While it describes *how* the claim is made, it does not have a specific term for the *logical immunity* generated by switching between two competing constructions (the "mirror" public vs. the "transformed" public) to avoid falsification.

  **Diagnosis:**
  None of these established concepts fully capture the **dynamic, ex post switching mechanism** you have identified. The literature tends to treat descriptive and deliberative claims as *complementary* pillars (e.g., "It represents us *and* improves our judgment"). Your observation identifies a scenario where they are used as **interchangeable validity conditions** to insulate the body from empirical refutation.

  Because no established term captures this specific rhetorical maneuver, I will coin a term to carve the phenomenon correctly.

  ***

  ### The Concept: Representational Arbitrage

  I propose the term **Representational Arbitrage** to describe this phenomenon.

  In finance, arbitrage is the practice of exploiting price differences between two markets to guarantee a profit with no risk. In democratic theory, **Representational Arbitrage** is the practice of exploiting the validity gap between **Descriptive Resemblance** (Market A) and **Deliberative Transformation** (Market B) to guarantee legitimacy with no risk of empirical refutation.

  #### Definition
  **Representational Arbitrage** occurs when the proponents of a citizen body invoke **Descriptive Representation** to claim legitimacy when the body's output aligns with existing public opinion, but switch to invoking **Counterfactual/Epistemic Representation** when the body's output diverges from existing public opinion, without having established *ex ante* criteria for which standard governs.

  #### Boundary Cases: Where it stops being "Arbitrage"
  To distinguish this unobjectionable feature of deliberative design from the insulated argumentation you described, we must identify where the "arbitrage" ends.

  1.  **Sincere Dual-Justification (Not Arbitrage):**
      *   *Scenario:* A designers' charter states: "We use sortition to ensure all voices are heard (descriptive), but we expect deliberation to refine preferences (epistemic)."
      *   *Distinction:* If the designers explicitly state *beforehand* that the output represents the **considered judgment** of the public, not the **current preference**, they are not arbitraging. If polls match, it is treated as confirmation; if they diverge, it is treated as transformation. The standard (considered judgment) remains constant; only the empirical relationship to polls changes.
      *   *Boundary:* Arbitrage begins when the *standard of validity itself* shifts based on the outcome.

  2.  **Deliberative Polling (Not Arbitrage):**
      *   *Scenario:* James Fishkin's Deliberative Polling explicitly measures the "raw" opinion and the "deliberated" opinion.
      *   *Distinction:* The gap is the *data*, not the *legitimacy shield*. Fishkin does not claim the raw poll is valid when it matches and invalid when it doesn't. He claims the deliberated poll is the superior metric regardless.
      *   *Boundary:* Arbitrage begins when the raw poll is used as a shield *only when convenient*.

  3.  **Epistemic Democracy (Not Arbitrage):**
      *   *Scenario:* A theorist argues sortition is useful only because it creates cognitive diversity for truth-tracking.
      *   *Distinction:* They do not lean on the "statistical mirror" claim for legitimacy. If the assembly diverges from the public, they admit it is a divergence but argue it is a *correction*.
      *   *Boundary:* Arbitrage begins when the "statistical mirror" is used as a primary legitimacy claim that is only quietly abandoned when inconvenient.

  #### Design Immunity: How to Render a Proposal Immune to the Charge
  To prevent a citizens' assembly design from being accused of Representational Arbitrage, the design must **decouple the sampling method from the legitimacy claim.**

  1.  **Ex Ante Hierarchy of Validity:**
      The charter must explicitly state which standard governs *before* the assembly convenes.
      *   *Immune Design:* "This assembly is mandated to produce a recommendation based on the **informed, considered judgment** of the participants. Current polling is a baseline for comparison, not a binding constraint."
      *   *Vulnerable Design:* "This assembly represents the people's will." (Ambiguous: current will or informed will?)

  2.  **Transparency of Transformation:**
      The process must document *how* opinions changed.
      *   *Immune Design:* Pre- and post-deliberation surveys of the *assembly members* are published. If the assembly shifts from 20% support for a carbon tax to 80% support, the legitimacy rests on that *internal transformation*, not on the alignment with the external public.
      *   *Vulnerable Design:* Relying on the final output's alignment (or lack thereof) with external polls without showing the internal deliberative trajectory.

  3.  **Rejection of the "Mirror" as Legitimacy:**
      The most robust immunity is to stop claiming the body is a "statistical portrait" in the context of legitimacy.
      *   *Immune Design:* "Sortition is used to ensure **equality of opportunity** for participation and **cognitive diversity**, not to create a microcosm that mimics public opinion distributions."
      *   *Why this works:* If you do not claim to mirror the public's *opinions*, you cannot be charged with failing to mirror them. You only claim to mirror the *population's diversity of experience*, which remains true regardless of the policy outcome.

  ### Summary
  The pattern you have identified is a logical insulation strategy that has not yet been named in the literature. The nearest concepts (**Descriptive** and **Counterfactual Representation**) describe the *components* of the argument but not the *switching mechanism*.

  **Representational Arbitrage** is the precise term for this maneuver. It identifies the exploitation of the tension between "being like the people" and "knowing better than the people" to create a claim that is unfalsifiable by empirical evidence. A design is immune to this charge only if it commits *ex ante* to the **deliberated judgment** as the sole standard of validity, treating the statistical mirror merely as a sampling technique rather than a legitimacy claim.
