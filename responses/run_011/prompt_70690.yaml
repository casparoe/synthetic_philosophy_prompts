  11. **Tone:** Professional, analytical, decisive, ethical/risk-aware.

  *(Self-Correction during drafting)*: I should be careful not to sound like I'm blaming the engineers, but rather highlighting a category error in the design. The "Design-Time" argument is strong *if* the agent is a tool, but weak if the agent is an autonomous decision-maker. I need to clarify that distinction.

