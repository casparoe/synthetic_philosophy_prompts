          3.  Evaluate the "right but early" verdict. Discuss falsifiability and indefinite deferral. Assess rolling window evidence.
          4.  Confront the domain shift (Malthus pre-1800 vs. post-1800). Discuss theory refutation vs. boundary limits.
          5.  Identify where frameworks fall silent (window choice, wager as operationalization, bet as experiment).
      *   **Constraints:** No reading list, no citations, no summary of controversy. Explicit mapping required. Clear statement of what was *not* tested.

  2.  **Task 1: What was tested? (Duhem-Quine Analysis)**

      *   *Core Theory (T):* Malthusian scarcity thesis (Population growth outstrips resource capacity, leading to increased scarcity/hardship).
      *   *Auxiliary Hypotheses (A):*
          *   $A_1$: A 10-year window (1980-1990) is sufficient to detect the trend.
          *   $A_2$: Real prices of 5 specific non-renewable metals are a valid proxy for overall resource scarcity.
          *   $A_3$: No significant technological substitution or discovery will suppress prices within this window despite population growth.
          *   $A_4$: Inflation-adjusted price is the correct metric for scarcity (vs. physical availability, energy cost of extraction, etc.).
      *   *Observation (O):* Real prices of all 5 metals fell; population rose.
      *   *Logic:* $(T \land A_1 \land A_2 \land A_3 \land A_4) \rightarrow O_{expected}$ (Prices Rise). Observed $\neg O_{expected}$.
      *   *Duhem-Quine Implication:* The contradiction $\neg O_{expected}$ falsifies the *conjunction*, not necessarily $T$.
      *   *Analysis:* Did it impugn $T$ or $A$? Given the facts provided (rolling windows show Simon wins $<50\%$ of the time, 1980-2011 saw 4/5 metals rise), $A_1$ (window) and $A_3$ (technological offset timing) seem the most vulnerable auxiliaries. $T$ remains logically intact if $A$ is adjusted.

  3.  **Task 2: Ehrlich's Response (Popper vs. Lakatos)**

      *   *Response:* "Wrong indicator, wrong dates." (Shift to renewables, shift timeframe).
      *   *Popperian Test:* Is this ad hoc? Does it reduce testability?
          *   If "wrong dates" means "try again until I win," it's immunizing (degenerating).
          *   If "wrong indicator" implies a new, independently testable theory of *which* resources bind first, it could be progressive.
      *   *Lakatosian Test:* Research Programme (Hard Core vs. Protective Belt).
          *   *Hard Core:* Human demand exceeds planetary carrying capacity.
          *   *Protective Belt:* Specific metrics, timeframes, resource types.
          *   *Progressive Shift:* Predicts novel facts (e.g., specific renewable constraints will bind by year $X$).
          *   *Degenerating Shift:* Merely explains away past failure without new predictive content.
      *   *Verdict:* Based on the prompt's facts (no second wager settled, counter-proposal of 15 trends never finalized), it leans degenerating *in the context of the wager*. However, theoretically, shifting indicators is valid *if* justified by independent theory. The prompt asks to judge the response. Without independent justification provided in the facts, it looks like an immunizing stratagem. To be progressive, Ehrlich needed to specify *why* metals fail as indicators and *when* renewables would spike, *before* the fact.

  4.  **Task 3: "Right but Early" & Falsifiability**

      *   *Verdict:* "Right but early."
      *   *Coherence:* Only coherent if there is a bounded deferral condition.
      *   *Falsifiability:* If the settlement date can be moved indefinitely ($t \rightarrow \infty$), the claim becomes unfalsifiable (tautology: scarcity will happen eventually).
      *   *Condition for Postponement:* Must specify *what* changes in the interim (e.g., "Technology delays the crunch by 50 years") and offer a new specific prediction.
      *   *Rolling Windows:* The facts state Simon won $<50\%$ of 20th-century windows, and 1980-2011 saw 4/5 metals rise against him.
      *   *Evidence:* This supports the "wrong dates" auxiliary ($A_1$). It suggests the Malthusian signal is noisy or periodic, not monotonic. It entitles a theorist to postpone *if* they predict a regime change, but not if they simply chase the data. The rolling windows suggest the 1980-1990 window was indeed an outlier *for the Malthusian view*, but the long-term (1980-2011) data starts to rehabilitate the scarcity signal (4/5 rose). This complicates the "early" claim—it might be "right, wrong metric, wrong decade, maybe right later."

  5.  **Task 4: Domain Shift (Pre-1800 vs. Post-1800)**

      *   *Problem:* Malthus fits agrarian history, fails post-Industrial Revolution.
      *   *Refutation vs. Boundary:* A theory isn't necessarily refuted if its domain is limited (e.g., Newtonian physics). It is vindicated *within* that domain.
      *   *Falsificationism Handling:* If a claim is universal ("Population *always* outstrips food"), it is refuted. If it is conditional ("...absent technological shock"), it survives but requires the shock to be theorized.
      *   *Malthus's Revisions:* He absorbed criticism. This looks like Lakatosian belt adjustment.
      *   *Endpoint in Time:* If a theory claims to apply until time $T$, and stops, it is a historical model, not a universal law. If it claims universal applicability but stops working, it is falsified unless the "stop" is explained by a new variable (e.g., fossil fuels).
      *   *Analysis:* The Industrial Revolution acts as a "defeater" condition. Malthusianism is not falsified as a description of *organic* economies, but falsified as a universal law of human existence unless modified to include *energy/technology* as a variable.

  6.  **Task 5: Where Frameworks Fall Silent**

      *   *Choice of Window:* Epistemology tells us how to test, not *which* window is ontologically correct. 10 years vs. 100 years is a normative/pragmatic choice, not a logical one.
      *   *Wager as Operationalization:* A bet requires binary outcomes and specific terms. Science deals in probabilities and confidence intervals. The wager forces a crispification of fuzzy credences.
      *   *Bet as Experiment:* An experiment controls variables. A bet observes a chaotic system. The wager tests the *outcome*, not the *causal mechanism*. It doesn't tell us *why* prices fell (tech? substitution? market manipulation?).
      *   *Silence:* Philosophy of science cannot dictate the stake size, the specific metals, or the moral weight of the prediction. It maps the logic, not the empirical validity of the chosen proxies.

