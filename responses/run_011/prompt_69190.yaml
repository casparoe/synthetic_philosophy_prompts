answer: |-
  **Scenario**

  In 2024, historian Elena Rostova completed a full-text analysis of the notarial register for the town of Montreuil (1480–1580). Every surviving contract, will, and debt instrument is digitized. Rostova identified a sharp discontinuity in how heirs assumed liability for parental debt. Before 1523, 94% of wills used the formula *sanguine tenetur* ("bound by blood"), implying unlimited personal liability for descendants regardless of inherited assets. After 1535, 96% used *inventario tenetur* ("bound by inventory"), limiting liability strictly to the value of goods received. The shift occurred uniformly across all social classes, guilds, and neighborhoods. There was no corresponding change in royal law, no local statute enacted, no plague or war during the transition, and no shift in religious affiliation or artistic style. The notaries themselves left no commentary explaining the change; the old formula simply vanished and the new one replaced it within a single generation.

  Rostova's dataset is complete; no missing boxes or burned archives. The change is isolated to this specific clause of inheritance law. Economic data shows no sudden boom or bust. Theological records show no debate on usury or inheritance during this window. The ruling dynasty remained constant. Standard periodization markers (Humanism, Reformation, Early Modern state-building) show no traction in Montreuil during these years. The change is datable to the 1523–1535 window with high precision. It is a massive change in how ordinary people understood financial obligation across generations, yet it leaves no trace in the categories historians usually use to divide the past.

  ***

  **Discussion Guide**

  **The Question**
  Does the shift in liability formulae in Montreuil (1523–1535) constitute a genuine period boundary for the history of this town?

  **The Three Verdicts**
  *   **The Realist:** Yes. The material conditions of life changed abruptly. Before 1530, a son could be ruined by a father's hidden debts; after 1530, he could not. This is a factual discontinuity in ordinary experience regardless of whether chroniclers noticed it. The inherited labels (Middle Ages, Renaissance) are incorrect because they fail to mark this real break.
  *   **The Constructivist:** No. A period boundary is an artifact of sorting. Rostova chose to sort by debt clauses; if she had sorted by prayer formulas in wills or guild initiation rites, she would find continuity. There is no fact of the matter that makes debt liability more "period-defining" than liturgy. The break exists only because the historian decided to look there.
  *   **The Pragmatist:** Yes, for economic history; No, for cultural history. If the research question is "How did households transmit risk?", 1530 is a hard boundary because the mechanism of transmission changed. If the question is "How did people conceive of salvation?", 1530 is not a boundary because theology remained static. The break is real relative to the specific problem being solved, not relative to the past itself.

  **The Key Feature**
  The disagreement hinges on the **isolated sharpness without external cause**. Because the change is sudden and total but confined to one mundane variable (legal syntax) without a law, war, or king to explain it, the historians are forced to argue about the *status* of the change itself. If the change had a clear cause (like a statute), it would just be an event. If it were vague, it would be noise. The sharpness forces the Realist to call it a structure, while the isolation forces the Constructivist to call it a choice.

  **The Collapse Test**
  If the same sharp break appeared simultaneously in twelve independent variables (debt, art, prayer, grain prices), the Constructivist position collapses. It becomes untenable to argue that the break is merely an artifact of sorting when every sort yields the same line. The Realist wins, as the convergence suggests a systemic shift in life itself. Conversely, if a dated town statute from 1524 explicitly ordered the change in formulae, the disagreement evaporates because the cause is external and legal. The Pragmatist wins here: the break is real for legal history but merely an administrative update for social history.

  **The Realist's Attack**
  The Realist attacks the Constructivist by arguing that consequences exist independently of classification. They would say: "You claim the break is only real because you chose to look at debt. But a son in 1520 actually went to debtors' prison, and a son in 1540 actually did not. That difference is ontological, not methodological." This attack lands on the level of material suffering—you cannot deconstruct a prison sentence—but it fails to prove that this specific variable defines the *era*. The Constructivist can reply that while the consequence is real, calling it a "period" still requires prioritizing economics over theology, which is a choice, not a discovery.
