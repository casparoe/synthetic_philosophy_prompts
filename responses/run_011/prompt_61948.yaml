prompt: |-
  In the 2016 EU referendum the franchise extended to Irish and qualifying Commonwealth citizens resident in the UK, while excluding other EU nationals resident here — people who vote in British local and European elections and who had voted in the Scottish independence referendum — and excluding British citizens who had been off the UK electoral register for more than fifteen years. The question put, however, concerned the UK's future relation to a supranational polity whose membership rules themselves determine which foreign nationals may live and work here, and what rights British nationals retain abroad; so the referendum settled a question about the boundaries of the demos using a demos that the question would itself alter.

  What theory of political legitimacy does that franchise presuppose — an all-citizens principle, an all-subjected principle, an all-affected principle, or no principle at all but administrative path dependence on the general-election roll? Reconstruct the implicit theory, and distinguish what the practice strictly requires from what it merely happens to fit. Then say whether its parts presuppose consistent things: is the inclusion of resident Commonwealth and Irish nationals reconcilable with the exclusion of resident French or Polish nationals, and does the fifteen-year rule express a view about how long a stake persists, or only a bright line that had to be drawn somewhere? Finally, if the all-affected principle were taken seriously, what would have to change about referendums of this kind — and could such a referendum be constituted at all, given that those affected include non-residents, future citizens and foreign nationals with no say in the result?

  Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the Request:**
      *   **Topic:** The franchise (voting eligibility) of the 2016 EU Referendum in the UK.
      *   **Key Issues:** Inclusion of Irish/Commonwealth residents, exclusion of other EU nationals, exclusion of long-term expat Brits (>15 years). The paradox of defining the *demos* to decide the boundaries of the *demos*.
      *   **Tasks:**
          1.  Identify the presupposed theory of political legitimacy (all-citizens, all-subjected, all-affected, or administrative path dependence).
          2.  Reconstruct the implicit theory.
          3.  Distinguish what the practice *strictly requires* vs. what it *merely happens to fit*.
          4.  Assess consistency: Is Commonwealth/Irish inclusion reconcilable with EU exclusion? Is the 15-year rule a stake view or a bright line?
          5.  Explore the "all-affected principle": What would change? Could such a referendum be constituted at all?
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the Franchise:**
      *   *Included:* UK citizens (resident), Irish citizens (resident), qualifying Commonwealth citizens (resident).
      *   *Excluded:* Other EU citizens (resident), UK citizens abroad >15 years, peers, prisoners.
      *   *Context:* General Election franchise (with some modifications like the 15-year rule removal attempt that failed, and the specific EU citizen exclusion).
      *   *Subject Matter:* EU Membership (affects rights of EU nationals in UK, UK nationals in EU, future migration, trade, law).

  3.  **Task 1 & 2: Identify and Reconstruct the Implicit Theory:**
      *   *All-Citizens?* No, because non-citizens (Irish/Commonwealth) could vote.
      *   *All-Subjected?* Partially. Residents are subject to UK law. But why Irish/Commonwealth and not French/Polish? All are subject to UK law while resident.
      *   *All-Affected?* No. Long-term expats are heavily affected but excluded. Other EU nationals are affected but excluded.
      *   *Administrative Path Dependence?* This seems the strongest candidate. It largely mirrored the Local Government and Parliamentary Election franchise.
      *   *Reconstruction:* The franchise presupposes a "Resident National Community" model, heavily weighted by historical ties (Commonwealth/Irish) and administrative convenience (using the existing electoral roll). It treats voting as a privilege of membership in the *political community* defined by historic allegiance rather than mere residence or affectedness.
      *   *Strict Requirement vs. Fit:* Strictly, using the General Election roll requires excluding non-Commonwealth/Irish EU nationals (as they don't vote in UK General Elections). It requires excluding expats >15 years (as per the Representation of the People Act at the time). What merely *fits* is the idea that this specific group represents the "will of the people" regarding the EU. The fit is coincidental, not theoretically robust regarding the specific issue of EU membership.

  4.  **Task 3: Assess Consistency:**
      *   *Commonwealth/Irish vs. EU Nationals:* Is it reconcilable?
          *   *Argument for Yes:* Historical ties. Irish citizens have a unique status (Common Travel Area). Commonwealth citizens have historic allegiance to the Crown. EU citizenship is supranational and reciprocal, not rooted in UK constitutional history.
          *   *Argument for No:* If the principle is "residence + subjection to law," then excluding French/Polish residents is arbitrary discrimination. If the principle is "allegiance," Commonwealth fits, but EU nationals are also subject to UK law.
          *   *Verdict:* It is inconsistent with an *all-subjected* principle but consistent with a *historical-constitutional* principle. It privileges historic empire over current European integration.
      *   *15-Year Rule:* Stake vs. Bright Line?
          *   It looks like a bright line for administrative certainty. However, it implies a theory that connection to the polity fades over time. Given the referendum topic (expat rights), excluding those most affected suggests it's a rigid administrative rule rather than a nuanced view of stakeholder persistence.

  5.  **Task 4: The All-Affected Principle:**
      *   *What would change?*
          *   Include all EU nationals resident in UK.
          *   Include all UK nationals living abroad (regardless of time).
          *   Potentially include future generations (impossible practically).
          *   Potentially include foreign nationals affected by trade deals (very difficult).
      *   *Could it be constituted?*
          *   Problem of infinite regress. Who is affected? Everyone in the global economy?
          *   Problem of boundary setting. To decide who is affected, you need a decision rule. Who decides that? (The "boundary problem").
          *   Conclusion: A pure all-affected principle makes a territorial referendum impossible. It requires a transnational plebiscite or a different form of decision-making entirely.

  6.  **Drafting the Response (incorporating British English):**
      *   *Spelling:* Organisation, recognise, programme, centre, etc.
      *   *Tone:* Analytical, academic, precise.
      *   *Structure:*
          1.  Introduction: Identify the core tension.
          2.  The Implicit Theory: Path dependence + Historical Allegiance.
          3.  Strict Requirements vs. Coincidental Fit.
          4.  Consistency Check (Commonwealth/Irish vs. EU; 15-year rule).
          5.  The All-Affected Counterfactual.
          6.  Conclusion.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say it was *exactly* the General Election franchise. It was the Local Government franchise plus Parliamentary. EU citizens vote in Local but not Parliamentary. The Referendum excluded them from Local-style voting rights they usually possess. This highlights the inconsistency.
      *   *Nuance:* The 15-year rule was actually a specific point of contention. Parliament voted against extending it for the referendum. This reinforces the "administrative bright line" argument.
      *   *Theory:* It's best described as a "Hybrid of Administrative Convenience and Historical Allegiance." It's not a clean political theory.
      *   *British English Check:* Ensure "s" instead of "z" in organisation/recognise (where applicable), "programme", "centre", "defence", "licence" (noun). Use "whilst" or "while" appropriately.

  8.  **Final Polish:** Check against the prompt's specific questions.
