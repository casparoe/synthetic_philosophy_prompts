      *   Strictly requires vs. fits? Yes.
      *   Consistency (Commonwealth/Irish vs EU)? Yes.
      *   15-year rule analysis? Yes.
      *   All-affected implications? Yes.
      *   British English? Yes.

  9.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  The franchise employed in the 2016 European Union referendum presents a complex case study in democratic theory, revealing a tension between constitutional history, administrative convenience, and the philosophical boundaries of the *demos*. To analyse it, one must dissect the implicit assumptions regarding who possesses the legitimate authority to decide the UK's constitutional future.

  **The Implicit Theory of Legitimacy**

  The franchise does not cleanly map onto any single normative principle of political legitimacy. It is not an **all-citizens principle**, as it enfranchised non-citizen Irish and Commonwealth residents. It is not a strict **all-subjected principle**, for while resident EU nationals were subject to UK law, they were excluded, whereas resident Commonwealth citizens were included. Nor was it an **all-affected principle**, given the exclusion of British expatriates residing abroad for more than fifteen years, whose rights of residence and work in the EU were directly at stake.

  Instead, the referendum presupposed a theory of **administrative path dependence tempered by historical allegiance**. The baseline was the Parliamentary and Local Government electoral register, modified by specific legislation (the European Union Referendum Act 2015). This suggests a view of voting not as a universal right derived from affectedness or subjection, but as a privilege attached to a specific status within the UK's constitutional order. The inclusion of Irish and Commonwealth citizens relies on a theory of **historical community**: these groups are deemed to share a unique political heritage with the UK (the Common Travel Area and the Commonwealth realm) that distinguishes them from other foreign nationals, even those from the EU.

  **Strict Requirements versus Coincidental Fit**

  Distinguishing what the practice strictly required from what it merely happened to fit is crucial. Strictly, the administrative mechanism required a pre-existing list of eligible voters to ensure logistical feasibility. Using the existing electoral roll was a necessity of implementation. Furthermore, the exclusion of most EU nationals was legally required because the franchise for national referendums in the UK is not automatically aligned with the franchise for European Parliament elections (in which EU nationals could vote).

  However, the idea that this specific configuration of voters represented the appropriate *demos* to decide on EU membership merely *fits* the administrative reality; it is not theoretically necessitated by it. One could have constructed a register specifically for the referendum that included all residents or all British citizens globally. The choice to adhere to the General Election model (with the Commonwealth/Irish exception) was a political choice that prioritised the 'Westminster model' of citizenship over a 'residence model' of citizenship.

  **Consistency of the Franchise**

  When examining the internal consistency of these choices, contradictions emerge.

  Regarding the inclusion of resident Commonwealth and Irish nationals alongside the exclusion of resident French or Polish nationals, the arrangement is reconcilable only if one accepts a **constitutional-historical principle** over a **residence-based principle**. If the right to vote derives from long-term allegiance to the Crown or historic reciprocity (as with Ireland), then the distinction is consistent. However, if the right to vote derives from being subject to the jurisdiction and contributing to the society in which one lives, the exclusion of other EU nationals is arbitrary discrimination. Given that EU nationals vote in UK local elections, their exclusion from the referendum created an anomaly where one could vote for a local councillor who influences local implementation of EU law, but not on the existence of the EU itself. Thus, the franchise is consistent with a view of the UK as a historic nation-state, but inconsistent with a view of the UK as a modern residence-based democracy.

  The fifteen-year rule for British expatriates similarly reveals a tension between a view of stakeholder persistence and administrative bright lines. In theory, the rule expresses a view that a citizen's stake in the domestic polity diminishes over time as they integrate elsewhere. However, in the context of a referendum specifically concerning the right to live and work abroad, this rule appears as a rigid administrative cutoff rather than a nuanced assessment of affectedness. That Parliament voted against removing this rule for the referendum suggests the boundary was maintained for bureaucratic certainty rather than philosophical coherence. It treats political membership as something that can be severed by time, regardless of the specific issue at hand.

  **The All-Affected Principle and the Boundary Problem**

  If the **all-affected principle** were taken seriously, the constitution of the referendum would have to change radically. Firstly, all British citizens residing abroad, regardless of duration, would require enfranchisement, as EU membership fundamentally alters their legal status. Secondly, all EU nationals resident in the UK would need to vote, as their right to remain was contingent on the outcome. Thirdly, one might argue for the inclusion of citizens of other EU states, whose economies and political unions would be altered by a British exit, and potentially future generations, whose life chances would be determined by the result.

  This leads to the conclusion that a referendum of this kind could not be constituted at all under a strict all-affected principle. This is due to the **boundary problem**: to decide who is affected, one must first hold a vote on who gets to vote. Furthermore, the chain of affectedness is potentially infinite in a globalised economy; a UK-EU trade decision affects supply chains globally. A territorial referendum presupposes a bounded *demos*, whereas the all-affected principle dissolves territorial boundaries.

  Consequently, a serious application of the all-affected principle would require a transnational plebiscite across the EU, or perhaps a global mechanism, neither of which currently exists. It suggests that while the all-affected principle is a powerful moral critique of exclusionary franchises, it is functionally incompatible with the nation-state instrument of the referendum. The 2016 franchise, therefore, rested on a pragmatic, historically contingent definition of the people, one that prioritised the stability of the existing constitutional order over the theoretical purity of democratic inclusion, ultimately settling a question about the boundaries of the polity using a *demos* defined by that very polity's past rather than its future.
