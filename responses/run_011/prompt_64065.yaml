answer: |-
  ### Critique of the CWL Spec

  The spec is coherent, implementable, and does not accidentally settle the issue. It successfully encodes a known failure mode of naive conditional markets (reflexivity) without rendering the mechanism impossible to analyze.

  1.  **Coherence:** The circular dependency (Price determines Adoption; Adoption determines Payoff; Payoff determines Price) creates multiple equilibria rather than a logical contradiction. This indeterminacy is the exact phenomenon the question asks students to diagnose. It is not incoherent; it is unstable.
  2.  **Implementability:** All components (contracts, welfare index, market-maker rules, adoption trigger) are technically buildable. The treasury-funded market-maker implies a subsidy, which is a policy choice, not an engineering impossibility.
  3.  **Issue Preservation:** The spec does not solve the "counterfactual problem" (how to measure welfare for the policy not chosen). Instead, it hides the problem inside the price formation process, leaving it open for students to uncover. The market-maker patch is explicitly included as a distractor/red herring for students to evaluate, ensuring the core question remains open.

  You may proceed with the assessment design.

  ***

  ### Assessment Question

  **Topic:** Mechanism Design & Collective Decision-Making
  **Time Allowed:** 48 Hours
  **Word Limit:** None (Conciseness valued)
  **Total Marks:** 25

  **Background**
  You are evaluating a proposed mechanism for public decision-making called the Conditional Welfare Ledger (CWL). Read the specification below carefully. You must derive your answers from this text alone; do not rely on external theories or named mechanisms.

  **Specification: The Conditional Welfare Ledger (CWL)**
  1.  **Choice:** A public body must choose between Policy A and Policy B by a fixed date $T$.
  2.  **Contracts:** Two tradeable contracts are issued.
      *   **Contract A:** Pays one unit of currency per point of a Welfare Index $W$ *if and only if* Policy A is adopted. $W$ is measured over a fixed window after $T$.
      *   **Contract B:** Pays one unit of currency per point of $W$ *if and only if* Policy B is adopted.
  3.  **Expiry:** At date $T$, positions in the contract for the policy *not* adopted expire worthless. They are neither unwound nor refunded.
  4.  **Adoption Rule:** At $T$, the body must adopt the policy whose contract had the higher volume-weighted average price over the final week of trading.
  5.  **Liquidity:** To ensure liquidity, the Treasury funds a standing market-maker. This agent must quote both sides of both contracts at a fixed spread and fill orders up to a stated size. The market-maker is prohibited from trading on any information bearing on which policy will be adopted.

  **Tasks**
  1.  **Price vs. Requirement:** Derive what the market price of Contract A mathematically estimates in a rational market. Compare this to what the Adoption Rule requires the price to represent for the decision to be optimal. Explain precisely why these two values diverge. (8 marks)
  2.  **Incentives & Cost:** Identify one specific actor who has a financial incentive to manipulate the adoption decision under this spec. Calculate the cost of this manipulation attempt in the same units as the Treasury's exposure. Explain why the "worthless expiry" clause makes this manipulation cheap relative to the potential gain. (8 marks)
  3.  **Evaluation & Fix:** Judge whether the Treasury-funded market-maker solves the divergence or manipulation problems identified above. Propose a change to the **payoff structure** (not transparency or rules) that would align the price estimate with the adoption requirement. (9 marks)

  ***

  ### Model Answer

  **1. Price vs. Requirement**
  In a rational market, the price of an asset equals its expected payout. For Contract A, the payout is the Welfare Index ($W$) multiplied by a condition: the contract only pays if Policy A is adopted. Therefore, the price of Contract A ($P_A$) estimates the Probability that A is adopted ($Prob(A)$) multiplied by the Expected Welfare given A is adopted ($E[W|A]$).
  $$P_A \approx Prob(A) \times E[W|A]$$

  The Adoption Rule requires the body to choose the policy that maximizes welfare. To do this optimally using prices, the price should represent only the Expected Welfare given adoption ($E[W|A]$). The rule compares $P_A$ and $P_B$ and selects the higher one.

  These values diverge because the price includes the probability of adoption ($Prob(A)$), while the decision rule requires ignoring that probability to judge the policy on its merits alone. In this mechanism, the probability of adoption is not an external fact; it is determined by the price itself (since price determines adoption). This creates a reflexive loop: if traders believe A will win, $Prob(A)$ rises, pushing $P_A$ up, which causes A to win. The price signals "likelihood of winning" rather than "quality of policy." Consequently, the mechanism may select a policy simply because the market believes it will be selected, even if its expected welfare is lower.

  **2. Incentives & Cost**
  The actor with the strongest incentive to manipulate is a holder of Contract A. Because the contract for the non-adopted policy expires worthless, the value of holding Contract A jumps from near-zero to valuable ($W$) if A is adopted.

  Consider a trader who holds a large position in Contract A. If the price is currently low, B is likely to win, and their holding becomes worthless. They can buy more Contract A to drive up the volume-weighted average price. If this buying pushes $P_A$ above $P_B$, Policy A is adopted. Their entire position becomes valid and pays out $W$.

  The cost of this manipulation is the loss incurred on the additional trades if the manipulation fails. If they buy high to push the price up, but fail to surpass $P_B$, Policy B is adopted. Contract A expires worthless. The cost is the total currency spent on the manipulative buys.

  The Treasury's exposure is measured in currency (the sum of welfare payouts plus market-maker subsidies). The manipulator's cost is also measured in currency (trading losses). The "worthless expiry" clause makes manipulation cheap relative to gain because the gain is discontinuous. A small amount of currency spent on buying contracts can validate a massive position that would otherwise be worth zero. The manipulator risks a limited trading loss to unlock a potentially unlimited welfare payout on their existing holdings.

  **3. Evaluation & Fix**
  The Treasury-funded market-maker does not solve either problem. The market-maker provides liquidity (the ability to trade) but does not alter the payoff structure. The manipulator still profits from making Policy A win because the contract still expires worthless if A loses. The market-maker's prohibition on trading on adoption information merely ensures the manipulator faces a static counterparty, potentially making manipulation easier, not harder. The divergence between price and welfare expectation remains because the contract payoff is still conditional on adoption.

  To align the price estimate with the adoption requirement, the payoff structure must be changed to remove the dependency on the adoption decision.

  **Proposed Fix:** Both contracts should pay out based on the Welfare Index $W$ regardless of which policy is adopted. The Treasury would fund the payouts for both contracts.
  Under this structure, Contract A pays $W$ even if Policy B is chosen (requiring $W$ to be estimated or measured counterfactually, or via parallel pilots). If the payoff is no longer conditional on adoption, then $Prob(A)$ drops out of the price equation.
  $$P_A \approx E[W|A]$$
  Now, the price estimates exactly what the adoption rule requires. Traders have no incentive to manipulate the adoption decision to save their contract from expiring, because the contract does not expire based on the decision. They are incentivized only to report their true belief about welfare, allowing the price to accurately reflect policy quality.

  ***

  ### Marking Scheme (Total 25)

  **1. Price vs. Requirement (8 Marks)**
  *   **2 Marks:** States Price = Probability of Adoption $\times$ Expected Welfare. (Botch: Claims price equals Expected Welfare directly.)
  *   **2 Marks:** States Adoption Rule requires comparing Expected Welfare only. (Botch: Confuses rule with maximizing price.)
  *   **4 Marks:** Explains the divergence is due to the Probability term being endogenous (determined by the price itself). (Botch: Blames "volatility" or "lack of information" rather than the structural link between price and adoption.)

  **2. Incentives & Cost (8 Marks)**
  *   **2 Marks:** Identifies Contract Holder as the manipulator. (Botch: Identifies the Market Maker or Treasury.)
  *   **3 Marks:** Expresses cost as currency lost on trades if manipulation fails. (Botch: Vague references to "market instability" or "reputation loss" without currency units.)
  *   **3 Marks:** Explains the "worthless expiry" creates a discontinuous gain (0 to $W$) making limited trading loss worth the risk. (Botch: Fails to link the expiry clause to the cost/benefit ratio.)

  **3. Evaluation & Fix (9 Marks)**
  *   **3 Marks:** Judges Market Maker as insufficient because it doesn't change payoffs/incentives. (Botch: Claims MM solves it by ensuring liquidity.)
  *   **3 Marks:** Proposes removing the conditionality of the payoff (contracts pay regardless of adoption). (Botch: Proposes auditing, transparency, or voting changes.)
  *   **3 Marks:** Explains why this fix works (removes Probability term from price, aligns price with welfare). (Botch: Proposes fix but fails to explain the mechanistic link to the price formula.)

  ***

  ### Closing Note

  A competent answer identifies the mathematical error: the price includes the probability of winning, not just the value of winning. A first-class answer recognizes the game-theoretic implication: because the probability of winning is determined by the price, the market is not discovering truth but coordinating on a self-fulfilling prophecy. The distinction lies in seeing the mechanism not just as a calculator that adds the wrong variables, but as a game where the players have the power to set the variables to suit their holdings. The top tier will explicitly link the "worthless expiry" clause to the discontinuous incentive structure, showing why liquidity provision cannot fix a broken payoff matrix.
