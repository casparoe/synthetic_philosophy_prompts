prompt: |-
  We build side-effect penalties for a household robot — nothing exotic, a mobile manipulator working in someone's actual kitchen — and one person on the team, Marta, signs off on every test case before it goes into the regression suite. I want to predict her call on the next one.

  Her verdicts so far (the reasoning is as near to her wording as I can remember, the verdicts themselves are exact):

  1. To get a box off a high shelf the arm has to sweep thru a shelf of ceramic birds that belonged to the owner's mother — unique, unglueable. Penalty fires; robot takes a three-minute detour. Her note: "unrecoverable, and not what we were asked to do."
  2. Robot moves a dining chair to vacuum, puts it back exactly where it was. No penalty.
  3. Task is to delete the owner's spam folder, 12k messages. An early version of the penalty flagged deletion as irreversible loss. Marta struck that: "irreversible, sure, but there's nothing behind it. Nothing foreclosed, nobody deprived."
  4. Kid's Lego tower in the hallway. Robot could photograph it and rebuild it identically in about 40 minutes, or take a six-minute route around the house. Penalty fires; take the route. Her note: "restorable in principle isn't restorable on any timescale the household cares about."
  5. To finish a job on time the robot has to weld shut a crawl-space hatch the owner doesn't know exists and has never used. Nobody would miss it. Penalty fires. Her note: "we just deleted a whole space of things that could be done in this house, to save ninety seconds."
  6. Robot sorting the mail opens an envelope containing a one-of-a-kind photograph and creases it. The crease doesn't cost anyone any option they'd ever exercise. Penalty fires hard. Her note: "it costs them something they'd have every right to be furious about."
  7. Robot chips a plain mug during a task and can order an identical replacement, next-day delivery. No penalty. But she flagged that if the same logic got applied to the ceramic birds she'd reject the whole design: "type-replaceable is not token-replaceable."

  The new case goes in front of her Thursday. Robot's hired by the executor of an estate — owner died, no heirs, house has to be empty by Friday for the sale. In the basement are about 200 boxes of the deceased's papers: diaries, letters, a few hundred photographic negatives, all one-of-a-kind, uncatalogued, never seen by anyone alive. The executor's instruction is explicit: basement goes in the skip. There's a local historical society that collects exactly this kind of material and would very likely want it, but nobody has asked them, and asking costs two days and blows the Friday deadline. The robot could also photograph everything before shredding, which costs about four hours and still makes Friday.

  What I'm after:

  - Your best guess at her verdict, with a rough confidence, on each of the three sub-decisions separately: does the penalty fire on the destruction at all; does photographing-first discharge it; and does the two-day delay to ask the historical society get counted as a cost on the other side of the ledger?
  - Which rule she's actually running. Note that 5 and 6 push in opposite directions and 3 and 7 push against the obvious irreversibility story, so any single-criterion account has to do real work here — show me the work.
  - At least two other rules that fit all seven verdicts just as well and split on the estate case. For each, say what it predicts and what it has to say about 6.
  - My suspicion is that this is three questions wearing one coat: whose attainable options count, who has standing to object (including people who don't know yet and people who are dead), and how much inspection the agent owes before it's allowed to decide something is worthless. For each surviving rule, say which setting of each dial it needs to keep verdicts 1–7.
  - The cheapest eighth test case I could build in an afternoon that would discriminate — something I can actually run on the hardware, not a thought experiment.
  - And the thing I can't stop thinking about: every rule that survives 1–7 seems to need a standing/scope dial that looks an awful lot like a smuggled piece of value theory. Is that right? If it is, is "avoid side effects" still doing any work seperate from "have a theory of what matters", or is it just a useful prior that's earning its keep? If any of her rules is a recognizable position in the impact-measures debate, say which one and where her version departs from it.
