  ### 4. The Three Dials Analysis

  | Dial | Marta's Rule (Fiduciary Stewardship) | Alternative A (Legal Agency) | Alternative B (Info Restorability) |
  | :--- | :--- | :--- | :--- |
  | **1. Whose attainable options count?** | **Owner + Stakeholders.** (Includes Mother in Case 1, Historical Society in Estate). | **Current Legal Agent Only.** (Executor in Estate). | **Anyone who accesses the info.** (Universal). |
  | **2. Who has standing to object?** | **Living, Dead, & Potential.** (Owner's rights survive death/absence; latent value counts). | **Living Legal Agents.** (Dead owners have no standing; Executor speaks for them). | **No One (Objective).** (Standing is irrelevant; physics of restoration matters). |
  | **3. How much inspection owed?** | **High.** (Must distinguish Token vs. Type, Latent vs. Null value). | **Low.** (Follow explicit orders; assume value is defined by agent). | **Medium.** (Must assess restorability, but not sentimental value). |

