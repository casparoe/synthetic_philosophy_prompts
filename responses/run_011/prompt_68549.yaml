answer: |-
  **PLANNING SECTION: CANDIDATE EXPLANATIONS AND EVIDENCE LIMITS**

  **1. Votive Offering**
  *   **For:** Wet marginal location (liminal space); deliberate wrapping and charcoal sequence; objects were antiquities (300-year gap); broken axes (ritual "killing"?).
  *   **Against:** Broken axes could be cullet; wetland could be practical concealment; "priest/gods" are unobservable entities.
  *   **Compatibility:** Compatible with Funerary/Ancestral.

  **2. Founder's or Merchant's Hoard (Scrap)**
  *   **For:** Broken axes (standard scrap size); tight cluster; high value material.
  *   **Against:** Wet location hinders recovery; wrapping/charcoal unnecessary for scrap; 300-year gap reduces metallurgical utility; teeth inclusion unexplained.
  *   **Compatibility:** Compatible with Votive (ritual deposition of scrap).

  **3. Emergency Concealment**
  *   **For:** Tight cluster; valuable goods.
  *   **Against:** Wet location poor for preservation/retrieval; wrapping suggests care over speed; antiquities less useful in crisis.
  *   **Compatibility:** Low compatibility with Votive (intent differs).

  **4. Funerary or Ancestral Deposition**
  *   **For:** Human teeth; antiquities (heirlooms); marginal location.
  *   **Against:** No body or grave structure; teeth are loose, not articulated.
  *   **Compatibility:** Compatible with Votive (offering ancestors); incompatible with pure Scrap.

  **5. Limits of Evidence**
  *   **Cannot Discriminate:** Specific intention (worship vs. safekeeping vs. ritualized recycling); identity of depositor (priest vs. layperson); belief system (gods vs. spirits vs. ancestors).
  *   **No Further Excavation Could Resolve:** The site is excavated and disturbed by peat cutting. We cannot recover the depositor's identity or find a non-existent structure. The 300-year gap is typological; we cannot date the *intent* only the objects and the charcoal.

  ***

  **MEMORANDUM**

  **TO:** Interpretation Review Panel
  **FROM:** [Your Name], Panel Member
  **DATE:** [Current Date]
  **SUBJECT:** Recommendations for Bronze Age Hoard Label and Adjacent Context

  Colleagues,

  Ahead of Thursday's vote, I submit the following recommendations regarding the centerpiece hoard label and its interpretive context. My aim is to resolve the impasse between our prehistorian's demand for evidentiary rigor and our Head of Interpretation's call for narrative clarity. We can offer a compelling story without asserting fiction as fact.

  **1. Bottom Line on Label Text**
  The draft label conflates high-probability inference with specific institutional claims. I propose the following revisions:

  *   **Strike:** "A priest carried this hoard... and gave it to the gods." We cannot identify the actor as a priest or the recipient as gods.
  *   **Strike:** "Giving wealth away was how a chief won followers." This is a specific socio-economic model not proven by this single deposit.
  *   **Revise:** "The broken axes had served their purpose; here they were offerings, not tools." Change to: "The broken axes were deliberately damaged. Whether prepared for recycling or ritually 'killed,' they were placed here permanently."
  *   **Retain (with modification):** The core narrative that this was a deliberate deposition of valuable, old objects in a wetland.

  **Replacement Wording:**
  *"Around 900 BC, someone placed this collection into the edge of a shallow lake. The axes were already centuries old when buried, wrapped carefully with charcoal. Bronze was valuable, yet these objects were never recovered. Was this a gift to spiritual powers, a way to honor ancestors, or scrap metal hidden for later use? The wet ground and deliberate arrangement suggest a special act, removing wealth from circulation forever."*

  This maintains the Head of Interpretation's desire for a clear narrative ("special act," "removing wealth") without fabricating specific roles ("priest") or beings ("gods").

  **2. The Human Teeth**
  The sentence "The teeth among them may be all that is left of a child who was given along with the metal" is ethically and evidentially untenable. Three loose teeth (one deciduous, two adult) do not constitute a burial, nor do they prove sacrifice. They could be ancestral relics, accidental inclusions, or tokens.

  **Recommendation:** Strike the reference to a child being "given."
  **Replacement:** "Three human teeth were found within the cluster. Their presence connects this deposit to specific people, perhaps as ancestral keepsakes, but their exact meaning remains unknown."
  This acknowledges the human element without sensationalizing unproven violence.

  **3. The Adjacent Gallery Panel**
  The adjacent panel claims the hoard proves a chiefdom with specialist metalworkers and an organized cult with priests. This is circular reasoning: we cannot use the hoard to prove the existence of priests if the label then uses the existence of priests to explain the hoard.

  **Recommendation:** The adjacent panel must be revised pending further review. A single hoard cannot support claims about centralized government or organized priesthoods. It supports claims about *access* to metal and *deliberate deposition*. We should rewrite the panel to reflect that social hierarchy is *inferred* from such finds across the region, not *proven* by this specific object.

  **4. A Test for Interpretive Levels**
  To prevent future deadlock, I propose we adopt a five-level test for all gallery labels:
  1.  **Physical Fact:** What is it? (e.g., bronze axes, teeth).
  2.  **Deliberate Action:** Was it placed? (e.g., yes, wrapped/clustered).
  3.  **Immediate Intention:** Why placed? (e.g., to hide, to offer, to discard).
  4.  **Belief System:** What did they believe? (e.g., gods, ancestors, luck).
  5.  **Social Structure:** What was their society? (e.g., chiefdom, egalitarian, priestly).

  **Application to this Case:**
  *   Levels 1 & 2 are secure (Evidence reaches here).
  *   Level 3 is probable but debated (Evidence favors "deliberate deposition," but "offering" vs. "hoard" is split).
  *   Levels 4 & 5 are speculative (Evidence does not reach here).

  **Label Signaling:** We must signal these levels. Use assertive language for Levels 1-2 ("were placed," "were wrapped"). Use interpretive language for Level 3 ("suggests," "likely"). Use qualifying language for Levels 4-5 ("may reflect," "some argue"). This is not "false neutrality"; it is accurate mapping of knowledge.

  **5. Addressing the Head of Interpretation's Case**
  The Head of Interpretation argues that hedging distorts the visitor experience and that the votive reading is the best explanation. She is correct that excessive caution bores visitors and that the votive reading is strong. The wet location, the wrapping, and the antiquity of the objects do favor a ritualized deposition over simple loss.

  However, accepting the *general* votive reading does not justify specific *institutional* claims. We can assert "This was a ritual offering" without asserting "A priest gave this to gods." The former is an inference from the pattern of deposition (wetland + wrapping + antiquity); the latter is a projection of later religious structures onto the Bronze Age.

  Accommodating her concern means we do not retreat to "some scholars think." We state: "Archaeologists interpret this as a ritual offering." This claims the interpretation firmly while acknowledging it is an interpretation. We honor the local heritage group's wish to treat the site as a place of offering by using that framework, but we do not validate the specific mechanics (priests/child sacrifice) which risk alienating visitors if challenged.

  **Conclusion**
  We have a responsibility to be engaging, but our authority rests on the distinction between what we know and what we imagine. By tightening the label to reflect the limits of the evidence while maintaining the narrative of deliberate, ritualized deposition, we satisfy the prehistorian's rigor and the interpreter's need for clarity. I urge the panel to adopt the revised wording above and flag the adjacent panel for immediate revision.

  Respectfully,

  [Your Name]
