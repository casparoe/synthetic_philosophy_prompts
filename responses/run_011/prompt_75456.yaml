answer: |-
  Here is a complete seminar package designed for 14 philosophy graduate students. It includes the mathematical backbone, the physical setup, the script, and a candid critique of where the pedagogy might fray.

  ### **Seminar Overview**
  *   **Topic:** The Value of Information (Good's Theorem) and its Boundary Conditions.
  *   **Time:** 90 Minutes.
  *   **Participants:** 14 Students.
  *   **Goal:** Empirical demonstration that free information is usually valuable, followed by structured violations of the theorem's assumptions.
  *   **Mathematical Core:** Expected Utility (EU) with risk neutrality stipulated.

  ---

  ### **1. The Mathematical Backbone (Instructor Reference)**
  *Do not show this to students until the debrief.*

  **States of the World:** $S_1, S_2$.
  **Prior Probability:** $P(S_1) = 0.5, P(S_2) = 0.5$.
  **Signal Accuracy:** 80%.
  *   $P(E_1 | S_1) = 0.8$
  *   $P(E_2 | S_2) = 0.8$
  **Posterior Beliefs (via Bayes):**
  *   If Signal $E_1$: $P(S_1 | E_1) = 0.8$
  *   If Signal $E_2$: $P(S_1 | E_2) = 0.2$

  **Actions & Payoffs (Points):**
  *   **Action A (Safe):** 6 points regardless of State.
  *   **Action B (Risk 1):** 10 points if $S_1$, 0 points if $S_2$.
  *   **Action C (Risk 2):** 0 points if $S_1$, 10 points if $S_2$.

  **Expected Utility Calculations:**
  1.  **Without Information:**
      *   $EU(A) = 6$
      *   $EU(B) = (0.5 \times 10) + (0.5 \times 0) = 5$
      *   $EU(C) = (0.5 \times 0) + (0.5 \times 10) = 5$
      *   **Rational Choice:** Action A. **Value:** 6.

  2.  **With Information (Free to Act):**
      *   **Receive $E_1$ (50% chance):** Belief $S_1=0.8$.
          *   $EU(A)=6, EU(B)=8, EU(C)=2$. Choose B. Payoff: 8.
      *   **Receive $E_2$ (50% chance):** Belief $S_1=0.2$.
          *   $EU(A)=6, EU(B)=2, EU(C)=8$. Choose C. Payoff: 8.
      *   **Total EU:** $(0.5 \times 8) + (0.5 \times 8) = 8$.
      *   **Value of Info:** $8 - 6 = +2$.

  3.  **Round 2 Violation (Constraint):**
      *   If you Look, you are **forced** to play Action B.
      *   $EU(\text{Look}) = EU(B) \text{ at prior} = 5$.
      *   $EU(\text{No Look}) = 6$ (Free to choose A).
      *   **Value of Info:** $5 - 6 = -1$.

  4.  **Round 3 Violation (Utility Dependence):**
      *   Bonus: +5 points if you did **not** Look.
      *   $EU(\text{Look}) = 8$ (from Round 1).
      *   $EU(\text{No Look}) = 6 (\text{Action A}) + 5 (\text{Bonus}) = 11$.
      *   **Value of Info:** $8 - 11 = -3$.

  ---

  ### **2. Materials & Setup**
  *   **14 Envelopes:** Labeled "State". Inside: 7 cards saying $S_1$, 7 cards saying $S_2$. (Shuffle heavily).
  *   **14 Signal Bags:** Opaque bags.
      *   If State is $S_1$: Bag contains 4 Red chips, 1 Blue chip.
      *   If State is $S_2$: Bag contains 1 Red chip, 4 Blue chips.
      *   *(Note: Pre-pack these bags based on the State card you put in the envelope. You need 7 "S1-Bags" and 7 "S2-Bags" prepared beforehand.)*
  *   **Decision Sheets:** 14 sheets with checkboxes for "Look/Don't Look" and "Action A/B/C".
  *   **Constraint Cards:** 5 cards labeled **"RESTRICTION: If you choose to LOOK, you must play Action B."**
  *   **Bonus Slips:** 14 slips for Round 3 labeled **"IGNORANCE BONUS: +5 Points if you chose Don't Look."**
  *   **Whiteboard:** For tallying scores.

  ---

  ### **3. Timeline & Script**

  #### **0:00 – 0:15: Introduction & Rules**
  **Instructor:** "We are running a decision tournament. You will play three rounds. In each round, there is a hidden State of the World, $S_1$ or $S_2$. It is determined by a coin flip—50/50. You want to maximize your point total.
  **Crucial Rule:** For this seminar, you are to act as **Expected Value Maximizers**. Do not worry about risk aversion. If a gamble has a higher expected point value, take it.
  **The Signal:** You may have the option to draw one chip from a bag. The chip color gives you evidence about the State. Red suggests $S_1$, Blue suggests $S_2$. It is not perfect, but it is informative.
  **Scoring:** Points accumulate across rounds. Highest score wins [optional small prize/bragging rights]."

  #### **0:15 – 0:35: Round 1 (The Baseline)**
  **Instructor:** "Round 1. You have two stages.
  Stage 1: Choose **Query** (draw a chip) or **Pass** (do not draw).
  Stage 2: Choose Action A, B, or C.
  If you Queried, you must update your belief based on the chip color before choosing.
  Hand in your decision sheets."

  *(Collect sheets. Reveal States. Calculate scores on board.)*
  **Expected Outcome:** Most students who Query should score higher (avg 8) than those who Pass (avg 6).
  **Instructor:** "Notice the average score for Queryers is higher. Information seemed valuable."

  #### **0:35 – 0:55: Round 2 (The Constraint)**
  **Instructor:** "Round 2. Same payoffs. Same States. However, I am handing out **Constraint Cards** to five of you. Keep this secret for now.
  **Public Rule:** You choose Query or Pass. Then you choose an Action.
  **Private Rule (to 5 students):** Read your card. If it says you have a Restriction, you must follow it *if* you chose Query.
  Begin."

  *(The 5 restricted students who Query will be forced to play Action B. If they updated rationally, they might want to play C, but they can't. Their expected score drops to 5. Unrestricted students score 8. Passers score 6.)*

  **Instructor:** "Reveal States. Calculate scores.
  **Discussion:** Did everyone benefit from looking? [Wait for hands]. Why did the average score for Queryers drop for some of you?"
  *(Reveal the Constraint Cards.)*
  **Instructor:** "For the restricted group, information was a trap. It told them what they wanted to do, but didn't let them do it."

  #### **0:55 – 1:15: Round 3 (The Ignorance Bonus)**
  **Instructor:** "Round 3. Same payoffs. Same freedom to act. But there is a new rule written on these slips."
  *(Hand out Bonus Slips to everyone.)*
  **Rule:** "If you choose **Pass** (Do Not Look), you receive a +5 point bonus added to your action payoff. If you Query, no bonus."

  *(Restricted students from Round 2 are now free again, but the Bonus changes the math.)*
  **Calculation:**
  *   Query Max EU = 8.
  *   Pass Max EU = 6 (Action A) + 5 (Bonus) = 11.
  *   Rational choice is **Pass**.

  **Instructor:** "Who chose to Query? [Likely few or none]. Who got more points by remaining ignorant?"

  #### **1:15 – 1:30: Debrief & Theorem Mapping**
  **Instructor:** "You have just empirically tested I.J. Good's 1967 Theorem on the Value of Information. Good proved that for a Bayesian agent, free information is always non-negatively valuable. $EU(\text{Info}) \ge EU(\text{No Info})$.
  You found cases where it was negative. Why? Because we broke the theorem's assumptions."

  **Write on Board:**
  1.  **Round 1:** Assumptions held. (Bayesian Updating + Maximization + Free Action + State-Independent Utility). Result: Info $\ge$ 0.
  2.  **Round 2:** Violated **Freedom of Action**. You had info but lacked the agency to act on it. Info became a burden.
  3.  **Round 3:** Violated **State-Independence of Utility**. Your utility function depended on your *epistemic state* (knowing vs. not knowing), not just the world state. "Ignorance is Bliss" is a utility modifier, not a probability error.

  ---

  ### **4. Predictable Failure Modes (The Blunt Critique)**

  Here is what will likely go wrong when you run this with real philosophers:

  **1. The Risk-Aversion Objection (High Probability)**
  *   **The Issue:** Even if you tell them to maximize Expected Points, grad students are humans. In Round 1, Action A offers a *certain* 6. Querying offers a *gamble* (50% chance of 8, 50% chance of 8... wait, in my math above, the EU is 8 in both branches, so it's actually certain 8 *if* they play optimally).
  *   **Correction:** In my design, if they play optimally after looking, they get 8 points *regardless* of the signal (8 if $E_1$, 8 if $E_2$). This removes risk *after* the signal. However, *before* the signal, it looks like a gamble.
  *   **Risk:** A student might argue, "I prefer the certain 6 over the uncertain 8."
  *   **Fix:** You must be authoritarian about the "Maximize Expected Points" rule. Frame it as "You are an algorithm, not a person." If they push back, acknowledge it: "That is a violation of the risk-neutrality assumption required for this specific theorem."

  **2. Round 2 Telegraphing (Medium Probability)**
  *   **The Issue:** Handing cards to only 1/3 of the room *before* they decide might signal that the game has changed. They might suspect the "Look" option is trapped.
  *   **Fix:** Hand the cards out face down. Tell them: "These contain potential modifications to the rules. Do not look at them until you have made your Query/Pass decision."
  *   **Wait, no:** If they don't look until *after* deciding, the constraint doesn't affect the decision.
  *   **Better Fix:** Hand them out at the start of Round 2 and say: "These are your private constraints for this round. They are binding." The telegraphing is actually useful—it simulates *known constraints*. The point is that *knowing* you are constrained makes info valuable only if it helps you within the constraint. Here, it doesn't.
  *   **Real Risk:** The 9 unconstrained students will still find Info valuable. The data will be split. You must be ready to analyze the subgroups separately on the whiteboard. Do not average the whole class score in Round 2, or the lesson dilutes.

  **3. Calculation Time (Medium Probability)**
  *   **The Issue:** 90 minutes is tight. 14 students doing Bayes updates three times might drag.
  *   **Fix:** Provide a "Cheat Sheet" with the Posteriors pre-calculated.
      *   *Sheet:* "If you see Red: Prob $S_1$ = 80%. If you see Blue: Prob $S_1$ = 20%."
      *   This saves 15 minutes of arithmetic and focuses them on the decision theory.

  **4. The "Separate Assumption" Claim (Low Probability)**
  *   **The Issue:** Some decision theorists argue Round 2 and Round 3 are the *same* violation (utility depends on the action-information pair).
  *   **Defense:** Round 2 is about the *feasible set of actions* changing conditional on information. Round 3 is about the *valuation* of outcomes changing. Keep this distinction sharp in the debrief.

  ---

  ### **5. Confidence Assessment**

  *   **Confidence in Numbers:** **95%**. The math is trivial and checked. The 6 vs 8 spread is wide enough to be obvious but not so wide it looks fake.
  *   **Confidence in Assumption Isolation:** **85%**. Round 2 clearly isolates Action Freedom. Round 3 clearly isolates Utility Structure. The only bleed is if students feel "constrained" in Round 3 psychologically, but the math holds.
  *   **Confidence in Classroom Flow:** **70%**. The risk of students getting bogged down in "But what if I'm risk averse?" is the biggest time-sink.

  ### **6. The Single Point I Am Least Sure Of**
  **The "Risk Neutrance" Stipulation.**
  You cannot *make* people risk-neutral by telling them to be. If a student genuinely prefers the certain 6 over the expected 8, they have not "failed" the game; they have rejected the Von Neumann-Morgenstern axioms required for Good's Theorem.
  **Recommendation:** When you introduce the game, explicitly state: *"Good's Theorem assumes VNM rationality with linear utility over points. For this exercise, 1 point = 1 util. If you feel risk aversion, you are violating the background assumptions of the theorem we are testing."* Put the burden of the assumption on the theorem, not their psychology.

  ### **7. One Feature You Must Supply By Hand**
  **The "Why" of Round 2.**
  The game shows *that* information was bad for the constrained group. It does not automatically explain *why* this matters for Good's Theorem. Good's Theorem assumes the agent can always choose the action $a$ that maximizes $EU(a | \text{info})$.
  In Round 2, the agent receives info, identifies the optimal action $a^*$, but is forced to play $a_{forced}$.
  You must explicitly articulate in the debrief that Good's Theorem proves $EU(\text{Info}) \ge EU(\text{No Info})$ **only if** the agent is free to maximize conditional on the signal. The theorem is about the value of information *to a free agent*. If you are a slave to a policy, information can be harmful. This is the philosophical payload of Round 2.
