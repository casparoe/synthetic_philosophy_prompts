answer: |-
  Here is a complete 90-minute lesson plan designed to meet your constraints. It avoids heavy notation, uses the "Analysis" students as resources rather than spoilers, and forces the ethical conflict through arithmetic they can all perform.

  ### The Stake
  **The Syllabus Vote.**
  There are two readings prepared for next week.
  *   **Reading A:** A text arguing that infinite ethics is solvable (e.g., *Vallentyne & Kagan, "Infinite Value"*).
  *   **Reading B:** A text arguing that infinite ethics breaks consequentialism (e.g., *Parfit, "Future Generations"* excerpts).
  The class's verdict at the end of the session dictates which text is assigned. This creates a stake in *interpretation* rather than *hoarding*, and it makes their philosophical conclusion materially affect their workload.

  ### The Rules
  1.  **No Limits Talk:** You are not allowed to use the words "limit," "converge," "series," or "infinity" as a mathematical object. You must talk about "the list," "the total," and "the pattern."
  2.  **The Auditor Role:** The three students with analysis background are designated "Auditors." Their job is not to solve the problem, but to verify that other groups' arithmetic is correct. They are forbidden from stating the *name* of the mathematical phenomenon they recognize.
  3.  **The Whiteboard:** Only the instructor writes on the whiteboard. Students write on index cards and paper.

  ### The World Cards (Printable)
  *Print these on distinct colored cardstock. You need 14 sets total.*

  **CARD SET 1: WORLD ALPHA (7 copies)**
  ```text
  WORLD ALPHA POPULATION DATA
  (Person ID : Wellbeing Score)

  Person 1 :  1
  Person 2 :  2
  Person 3 :  3
  Person 4 :  4
  Person 5 :  5
  ...
  Pattern: Every person n has score n.
  ```

  **CARD SET 2: WORLD BETA (7 copies)**
  ```text
  WORLD BETA POPULATION DATA
  (Person ID : Wellbeing Score)

  Person 1 :  0
  Person 2 :  1
  Person 3 :  2
  Person 4 :  3
  Person 5 :  4
  ...
  Pattern: Every person n has score n-1.
  ```

  **CARD SET 3: THE DEBT SCENARIO (14 copies, distributed later)**
  ```text
  CURRENT STATE: WORLD DEBT
  Every person in the population has a score of -1.

  YOUR CHOICE:
  You may choose to add +1 to your own score only.
  (Cost to you: 0 effort. Effect: Your score becomes 0).
  ```

  ---

  ### Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Distribution**
  *   Hand out **World Alpha** to the left side of the room (7 students) and **World Beta** to the right side (7 students).
  *   **Instruction:** "You are evaluating a policy switch. We are currently in World Beta. A proposal suggests switching to World Alpha. Your task is to determine if this switch is an **Improvement**."
  *   **Constraint:** "You must justify your answer using the numbers on the card. You may talk to your neighbors, but Left Side talks to Left Side, Right Side talks to Right Side."
  *   *Assign the 3 Analysis students as Auditors. They circulate between groups to check arithmetic only.*

  **00:10 – 00:30: Phase 1 (The Summing Conflict)**
  *   **Left Side (Alpha) Task:** "Calculate the Total Wellbeing of your world."
      *   *Expected Math:* $1 + 2 + 3 + 4...$ They will quickly see this grows without bound. They will write "Infinity" or "Unbounded."
  *   **Right Side (Beta) Task:** "Calculate the Total Wellbeing of your world."
      *   *Expected Math:* $0 + 1 + 2 + 3...$ They will also write "Infinity" or "Unbounded."
  *   **The Confrontation (Min 25):** Ask the class: "Is switching from Beta to Alpha an improvement?"
      *   **Group 1 (Total Focus):** "No. Infinity equals Infinity. The total hasn't changed."
      *   **Group 2 (Person Focus):** (Prompt them to look at Person 1). "Yes. Person 1 goes from 0 to 1. Person 2 goes from 1 to 2. *Everyone* is better off."
      *   **Conflict:** One group says "Neutral," one says "Massive Improvement." Both used the cards correctly.
  *   **Instructor Action:** Write both verdicts on the board. Do not resolve it yet.

  **00:30 – 00:50: Phase 2 (The Individual Choice)**
  *   Collect World Cards. Distribute **Debt Scenario Cards** to everyone.
  *   **Instruction:** "We are now in World Debt. Everyone is at -1. The Total is negative infinity. You have a button. If you press it, your score becomes 0. It costs you nothing."
  *   **Task 1 (Individual):** "On a slip of paper, write down: Does pressing your button change the **Total Wellbeing of the World**?"
      *   *Expected Math:* Old Total = $-\infty$. New Total = $-\infty + 1$.
      *   *Consensus:* "No. Negative infinity plus one is still negative infinity."
  *   **Task 2 (Collective):** "Stand up if you pressed the button." (Ideally, all 14 stand).
  *   **Instruction:** "If *everyone* in the infinite population pressed this button, what is the new Total?"
      *   *Expected Math:* Everyone is now 0. Sum of infinite zeros = 0.
      *   *Realization:* The Total moved from $-\infty$ to $0$.
  *   **Conflict:** "My choice changed nothing. Our choice changed everything."

  **00:50 – 01:10: Phase 3 (Synthesis & Vote)**
  *   Bring the two phases together.
  *   **Question:** "In Phase 1, the Total View said 'No Improvement.' In Phase 2, the Total View said 'Individual Action is Neutral.' But in both cases, something ethically significant happened (Everyone got happier / The Debt was cleared)."
  *   **Discussion:** "If 'Maximize the Total' gives the answer 'Nothing Matters' in these cases, is 'Maximize the Total' a broken instruction?"
  *   **The Vote:** "Based on today's arithmetic, which reading do you want for next week? The one that tries to fix the Total View (Reading A), or the one that says we need a new theory entirely (Reading B)?"
  *   Tally the vote. Announce the reading.

  **01:10 – 01:30: Debrief & Mapping**
  *   **Map Phase 1:**
      *   "Total View" $\rightarrow$ **Classical Total Utilitarianism.**
      *   "Person Focus" $\rightarrow$ **The Pareto Principle / Person-Affecting View.**
      *   The Problem $\rightarrow$ **The Paradox of Infinite Utility (Shift Problem).**
  *   **Map Phase 2:**
      *   "Individual Choice" $\rightarrow$ **Causal Impotence in Infinite Contexts.**
      *   "Collective Choice" $\rightarrow$ **Overdetermination / Coordination Problems.**
      *   The Problem $\rightarrow$ **The Lack of Well-Defined Sums.**
  *   **Closing:** "You didn't just learn that series are weird. You learned that if the population is infinite, 'Add up the wellbeing' is not a coherent ethical command. It's like asking 'What is the color of the number 5?' The math isn't a trick; it's the boundary of the theory."

  ---

  ### Predictable Failures & Mitigations

  **1. The Analysis Kids Shout "Riemann!" in Minute 5.**
  *   **Why:** They recognize the divergent series immediately.
  *   **Fix:** The "Auditor" rule. Before class, pull the three aside. Tell them: "Your grade for this seminar depends on your silence. You are Auditors. If you say the word 'convergence' or 'Riemann,' the class fails the activity and everyone gets the harder reading." Gamify their restraint. Their job is to say, "Your addition is correct," not "Your premise is divergent."

  **2. A Group Refuses to Compare Infinite Worlds.**
  *   **Why:** They intuitively feel $\infty = \infty$ is nonsense.
  *   **Fix:** Force the **Pareto** angle. If they refuse to sum, ask: "Look at Person 1. Are they better off in Alpha?" If they say yes, ask "Look at Person 2. Are they better off?" If they say yes for all, ask "How can it be *not* an improvement if *everyone* is happier?" This forces them into the conflict even if they reject the Total Sum.

  **3. "This is Just a Math Trick."**
  *   **Why:** Students dismiss the problem as an artifact of bad modeling.
  *   **Fix:** In the debrief, be blunt. "Consequentialism *is* a mathematical model. It says 'Right Action = Maximize Function F.' If Function F is undefined, the theory outputs 'Error.' That is not a math problem; it is a theory failure. If your ethical theory crashes when the population gets large, the theory is the bug, not the population."

  ### What This Activity Cannot Reproduce (Limitations)

  **1. The Topology of the Population.**
  *   **Missing Feature:** In the activity, students are seated in a room (finite, bounded). In the problem, the "order" of the people matters for some solutions (e.g., spatiotemporal expansion).
  *   **What You Must Supply:** In the last 10 minutes, you must explain that in some infinite ethics models, *where* the happy people are (in time or space) matters as much as *how many* there are. The cards treat people as a list; reality might treat them as a grid.

  **2. The "Actual" Infinite Total.**
  *   **Missing Feature:** 14 students cannot simulate $\infty$. They are simulating the *logic* of extrapolation.
  *   **What You Must Supply:** You need to explicitly state: "We are trusting that the pattern on the card continues forever. If it stopped at a million, the Total View would win. The ethical problem *only* exists if the population is truly endless. You have to take that premise on faith for the argument to hold."

  **3. Probability and Uncertainty.**
  *   **Missing Feature:** This activity assumes perfect knowledge of the wellbeing numbers.
  *   **What You Must Supply:** Mention that in the real world, we don't know if the population is infinite. The ethical problem becomes one of *risk* (assigning non-zero probability to infinity), which is even harder than the certainty model you just played.

  ### Why This Works for Your Constraints
  *   **No Notation:** Uses $1, 2, 3$ and $-1, 0$.
  *   **Mixed Math:** Addition is universal; the "Auditor" role utilizes the analysis students without letting them dominate.
  *   **Stake:** The Syllabus Vote is real, academic, and avoids the "token economy" trap.
  *   **Goal 1 & 2:** Phase 1 creates the "Yes/No Improvement" split. Phase 2 creates the "Individual/Collective" split.
  *   **Debrief:** Names are withheld until the end, ensuring the *feeling* of the problem precedes the *label*.
