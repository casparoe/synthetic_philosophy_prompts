      *   **Predictable Failures:**
          *   Analysis kids: Give them the role of "Auditors" who check the arithmetic but aren't allowed to speak the *name* of the theorem.
          *   Refusal to compare: Force a vote.
          *   "Math Trick": Debrief must emphasize that *ethics* relies on the math. If math breaks, ethics breaks.

      *   **Limitations:**
