      *(One last thought on the Stake)*: "Syllabus" is good. "Donation" is risky. "Seating" is trivial. I'll suggest **The "Class Doctrine" on the Whiteboard**. It stays there all semester. It's symbolic but persistent. Or **The Reading**. I'll offer the Reading choice as it's most pedagogically sound.

