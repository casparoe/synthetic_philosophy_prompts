answer: |-
  Here is a teaching plan designed for your specific constraints (75 minutes, no modal logic, probabilistically literate audience) and pedagogical goals.

  ### 1. The Dependency Structure

  **Strategy:** Do not open with the closure principle. Open with the **representation they already possess** (the probability axioms) and derive the closure result as a theorem. If you state the principle first ("Belief is closed under implication"), they will treat it as a philosophical stipulation they can reject. If you derive it from the Kolmogorov axioms they just spent a term mastering, the problem becomes a *mathematical consequence* of their formalism, which is much harder to dismiss.

  **Sequence of Operations:**
  1.  **Recap the Formalism (10 mins):** Write the three Kolmogorov axioms on the board. Remind them that a "probability function" $P$ maps propositions to $[0,1]$.
  2.  **Define the Domain (15 mins):** This is the load-bearing step. You must specify what the *inputs* to $P$ are. Since you cannot use possible worlds, define the domain as a set of sentences closed under logical equivalence.
      *   *Stipulation:* If $A$ and $B$ are logically equivalent, they are the same input to $P$.
      *   *Stipulation:* If $A$ is a logical truth, it is equivalent to $\top$ (tautology).
  3.  **The Derivation (15 mins):** Show that given (1) and (2), $P(A) = 1$ for all logical truths $A$ is a theorem, not an assumption.
      *   $P(\top) = 1$ (by axiom).
      *   If $A$ is a logical truth, $A \equiv \top$.
      *   Therefore $P(A) = 1$.
  4.  **The Phenomenological Clash (20 mins):** Introduce the carrying example here to show that real agents violate this derived theorem.
  5.  **Diagnosis (15 mins):** Locate the source of the tension (Step 2: the domain specification).

  **Load-Bearing vs. Gesture:**
  *   **Load-Bearing:** The identification of logical equivalence with probabilistic identity (Step 2). This is the single point where the logic enters the probability.
  *   **Gesture:** The specific structure of the algebra (sigma-algebras, measure theory). Treat "propositions" as intuitive placeholders that behave like sets.
  *   **Diagram:** Draw a **Circle of Credence**. Inside, place "Logical Truths." Draw an arrow from "Axioms" to "Credence 1." Then draw a stick figure outside the circle labeled "Actual Agent" pointing at a logical truth with a label "Credence 0.8." This visualizes the exclusion of the agent from the model.

  ### 2. The Carrying Example

  **Assessment of Your Example (Mathematician + Peano):**
  *   **Strengths:** It captures the *necessity* of the truth (arithmetic truths are necessary).
  *   **Weaknesses:** For an audience without modal logic, "necessary truth" is a black box. It risks conflating *computational difficulty* with *logical omniscience*. Students might think, "She just hasn't calculated it yet," which feeds the misconception that this is a performance error.
  *   **Conditions for a Successful Example:**
      1.  **Normative Force:** It must show that Bayesianism *forbids* the agent's current state, not just that the agent fails to match the model.
      2.  **Credence Sensitivity:** It must involve degrees of belief, not just binary acceptance (since this is a formal epistemology course).
      3.  **Non-Triviality:** The logical relation must be opaque enough that assigning 1.0 feels genuinely irrational.

  **Recommendation:**
  Refine the example to **Goldbach's Conjecture**.
  *   *Why:* It is a statement of arithmetic. It is either necessarily true or necessarily false (standard view).
  *   *The Setup:* Ask the students for their credence in Goldbach's Conjecture. Most will say $0.5$ or "I don't know."
  *   *The Trap:* Under the standard Bayesian model derived in Section 1, since Goldbach is either a logical truth or a logical falsehood, $P(G)$ *must* be $1$ or $0$.
  *   *The Kick:* If they say $0.5$, they are violating the axioms of probability (given the domain stipulation). If they say "But I don't know which," they admit the model cannot represent their state of ignorance about a logical fact.
  *   *Justification:* This meets the conditions better than Peano because it isolates a single proposition where the *uncertainty* is palpable, forcing the conflict between "rational uncertainty" and "probabilistic coherence."

  ### 3. The Misconceptions

  **Addressing Your Three:**

  1.  **"It's just an idealization (frictionless plane)."**
      *   *Where to head it off:* During the Diagnosis (Step 5).
      *   *The Counter:* Frictionless planes are useful because friction is a perturbative force we can add back in later to improve prediction. Logical omniscience is not perturbative; it is structural. You cannot "add back" ignorance without breaking the probability axioms themselves. The model doesn't just predict poorly; it declares the actual state *incoherent*.
  2.  **"It's just that people are slow at arithmetic."**
      *   *Where to head it off:* During the Derivation (Step 3).
      *   *The Counter:* Emphasize that the axioms are *normative*. The problem isn't that we *can't* compute the value; it's that the theory says we *ought* to already have the credence fixed at 1. It frames rationality as a state, not a process.
  3.  **"Moving to degrees of belief dissolves it."**
      *   *Where to head it off:* Immediately after the Derivation.
      *   *Your Instinct:* You asked if observing that "probability axioms force credence one in every logical truth" is the right thing to say.
      *   *Verdict:* **Yes, say this explicitly.** It is the most important technical point of the lecture. Many students assume "degrees of belief" allows for nuance on logic. You must show that $P(\top)=1$ is a hard constraint of the calculus they just learned. Do not concede that this is "too much"; insist that this is exactly where the formalism bites.

  **Two Further Errors to Anticipate:**
  1.  **"We can just use 'High Probability' instead of 1."**
      *   *Error:* Thinking we can set the threshold for logical truths at 0.99.
      *   *Correction:* This violates the axiom $P(A \lor \neg A) = 1$. If $P(A) = 0.99$ and $P(\neg A) = 0.99$, additivity breaks.
  2.  **"Logic is empirical/revisionary."**
      *   *Error:* Suggesting we can solve this by saying logic isn't certain (Quine).
      *   *Correction:* While philosophically interesting, this sidesteps the *formal* problem. The lecture is about the tension between *standard* logic and *standard* probability.

  ### 4. Downstream Risk

  **The Risk:**
  The error that will most corrupt the upcoming Confirmation Theory sessions is the **"Idealization" misconception**.
  If students believe LO is a harmless idealization, they will fail to grasp the **Problem of Old Evidence**. In confirmation theory, if $P(H \to E) = 1$ (because it's a logical relation), then learning $H \to E$ cannot increase $P(H)$. This implies scientific theories can never be confirmed by entailing already-known evidence (e.g., Einstein and Mercury's perihelion).

  **Inoculation (Last 10 Minutes):**
  Explicitly connect LO to Old Evidence.
  *   *Say:* "In three weeks, you will study how evidence confirms hypotheses. You will encounter a puzzle where a theory entails known data, but Bayesianism says this confirmation is impossible. That puzzle exists *only because* of the Logical Omniscience problem we discussed today. If you think LO is just a 'frictionless plane,' you will not understand why Confirmation Theory is broken."
  *   *Task:* Ask them to write down one sentence: "Logical Omniscience breaks confirmation theory because..." (Collect these or have them share).

  ### 5. A Closing Question

  **The Question:**
  "Suppose we want to modify the Bayesian model to allow an agent to have credence 0.5 in a logical truth. Which specific component of the framework we built today must we discard: the Probability Axioms, or the Mapping of Logic to Probability?"

  **Bad Answer:**
  "We must admit humans are imperfect." (This ignores the formal structure entirely.)
  "We must change the axioms." (Too vague; which axiom? If they say 'normalization', ask why.)

  **Good Answer:**
  "We must break the identification of logical equivalence with probabilistic identity. We can keep the axioms, but we must allow $P(A) \neq P(B)$ even if $A \leftrightarrow B$ is a theorem."
  *(This shows they understand that the problem lies in the domain specification, not the math itself.)*

  ### 6. Omissions

  **What to Refuse to Attempt:**
  1.  **Solutions:** Do not teach *how* to fix it (e.g., Hintikka's impossible worlds, local reasoning, resource-bounded agents).
      *   *Why:* You have 75 minutes to establish the *problem*. Teaching solutions implies the problem is settled. It is not.
      *   *What to say:* "There is a vast literature on fixing this. I will provide a bibliography. Today is for understanding why the fix is needed."
  2.  **Modal Semantics:** Do not introduce Kripke frames or accessibility relations.
      *   *Why:* It violates your constraint and adds technical load that obscures the probabilistic tension.
  3.  **The Distinction Between Explicit and Implicit Belief:**
      *   *Why:* This is a psychological escape hatch. If you allow it, students will think the problem is solved by saying "I implicitly believe it." Insist that Bayesian credences are dispositional and supposed to guide betting behavior *now*.

  **Explicit Statement to Students:**
  "I am leaving out the proposed solutions. I am doing this because if you leave here thinking the solution is easy, you will not listen carefully when Confirmation Theory breaks next month. I want you to sit with the discomfort of a formalism that declares your rational uncertainty incoherent."
