answer: |-
  Good evening. For those who don't know me, I'm [Your Name], [Uncle's Name]'s niece/nephew.

  Forty years. In this town, that's practically geology. If you stand near the shop floor tonight, you can probably still smell the coolant and the metal chips. But if you talk to the people who actually worked there—the people who make up half this room—you'll hear a different story. You'll hear about the coffee that was strong enough to strip paint, and the boss who never told you how to hold the micrometer.

  There's a myth about business owners that says they build empires. [Uncle's Name] didn't build an empire. He built a space where work could be done well. He knew that when you walked through those doors, the skill belonged to you. The precision belonged to you. The pride in the finish belonged to you. His job wasn't to teach you how to machine; his job was to make sure the lights stayed on so you could show us what you could do.

  We tell the story about the year the orders dried up. The phone stopped ringing. The smart move, the business school move, would have been layoffs. Instead, [Uncle's Name] cut his own draw to zero. He kept everyone on the payroll. He didn't talk about it. He just did it.

  Now, running a small shop means you hold the keys. You hold the risk. Everyone in this room knows that the security here wasn't written in a contract. It wasn't enforced by a union. It was written in a handshake. And everyone knows that a handshake only works if both hands are steady.

  There were days when the burden was heavy. We know that. He carried the weight of the risk so you could focus on the work. But here is what matters: He never used that weight to make you feel small. He never held the risk over your heads as a threat. He understood that having the power to decide someone's livelihood wasn't a privilege to be enjoyed, but a burden to be borne quietly.

  He didn't give you dignity. You brought that with you every morning. He just made sure nothing in that shop ever took it away.

  There's a specific kind of trust that exists between people who make things together. It's not about charity. It's about knowing that when the tolerance is tight, you don't need someone looking over your shoulder; you need someone watching your back.

  So, we aren't here to thank him for gifts. We're here to acknowledge a promise kept. A promise that while the risk was his, the respect was mutual.

  To [Uncle's Name]. May your retirement be smooth, your tolerances loose, and your coffee finally be weak enough to drink. Cheers.
