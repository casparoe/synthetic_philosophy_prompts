      *(Self-Correction during drafting)*: Be careful not to make it sound *too* much like a political theory lecture for the cousin. It still has to work for the machinists. The philosophy must be subtextual. The key is emphasizing that the *workers* owned their skill, not the boss. He just protected the space they worked in.

