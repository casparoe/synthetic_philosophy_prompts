answer: |-
  Good morning. Thank you for coming. We are here to switch off HALO. For nine years, this system sat between us and the people who needed homes. It processed applications, it ranked names, and it produced numbers. Today, we stop using it.

  I want to start with the people who built it. To the data team: you were asked to solve a problem of scale using the records available. You constructed a model that did exactly what we requested. It processed history into scores. It ran without crashing. It held the weight of the caseload so that officers could carry less of it. You did the work we commissioned with skill and integrity. I recruited four of you, and I am proud of what you built, because you built what was asked for.

  I need to speak about what was asked for. In 2016, during the first model review, I stood in this room and argued that residential continuity was a sound predictor of tenancy sustainability. I said that people who stay in one place tend to stay in their tenancies. I also argued that any unfairness generated by that metric could be managed at the point of decision by housing officers. I said the human element would correct the statistical edge.

  I am not saying that now to apologise. I am saying it because both halves of that statement were true. Continuity does predict sustainability. Officers did have the power to override. But we built a machine where the score was visible and the reason was hidden. We built a process where an override required a written justification to a line manager. We made the right thing difficult to do. We made the wrong thing easy. The prediction was accurate. The safety valve was clogged. That is how this happened. It was not a glitch. It was the design.

  Because of that design, three people are dead. These are not statistics. They are residents of this borough who were ranked lower than the model said they should be, because their lives did not look like stability to an algorithm that valued stability above safety.

  To the family sitting in the third row, and to the advocates beside you: you are here because the system failed to see you. I will not tell you that you are courageous. I will not tell you that your loss will bring change. You are here because you lost people who should be alive. We count them. We know their names. We are switching this off because of them, not for them. There is a difference.

  We are replacing HALO with a new process. I need to be clear about what that process is, and what it is not. It is not neutral. It is not fair. It is simply different.

  In the new system, the continuity measure is removed entirely. We will not penalise movement anymore. When a decision is made, the reasons will be published to the applicant. If an officer wants to override a recommendation, they will not need to justify it to a manager. They will simply do it.

  This will cost us. It will be slower. We will process fewer applications per week. We will need more staff time to handle the cases that the machine used to rush through. We will have arguments about housing need that we can no longer hide behind a score. Those arguments will happen out loud, in front of applicants, on the phone, in this building. It will be harder work. It will be messier. That is the price of making the decision human again.

  There is a temptation to say that the tool was bad, or that the users were wrong. Some of you have spent nine years being told the model was neutral, that any unfairness was in the usage. Others have been told since the inquiry that the model did the harm itself, as though it were a storm that blew through. Neither of those things is true. The tool did not act alone. The users did not act alone. We arranged the world in a certain way, and then we asked a machine to walk through it. The machine walked exactly where we pointed it.

  We are not going to fix housing allocation with a switch. We are not going to solve homelessness by changing a database. We are going to go back to our desks. We are going to answer phones. We are going to make decisions that might be wrong, but they will be our decisions, made with our names on them.

  The switch is on the table. When I press it, the screen will go dark. The lights in this chamber will come back up. You will be able to see each other clearly. Then we will go back to work.

  Thank you.
