answer: |-
  There is no single, frictionless principle that delivers all eight verdicts without forcing you to add clauses or drop one. Your intuitions are tracking three distinct distinct dimensions: **Agency** (can I treat settings as free inputs?), **Ontology** (what propagates in the fundamental stuff?), and **Information** (how much can be learned?).

  To make your list consistent, I propose a composite criterion: **Interventionist Agency within Ontological Light-Cones.**

  It has two clauses:
  1.  **Exogeneity of Settings:** For an explanation to be non-trivial, the experimenter's settings ($a, b$) must be treatable as exogenous variables (interventions) relative to the hidden state ($\lambda$). They cannot be determined by a common past cause that screens off the choice.
  2.  **Ontological Propagation:** Physical influences in the fundamental ontology must propagate within light cones. (Statistical correlations can violate this; dynamical influences cannot).

  Here is how this criterion sorts your list, where it forces you to drop a verdict, and where it requires an add-on.

  ### 1. The Sorting
  *   **Standard QM:** **Keep.** Settings are exogenous (Clause 1). Ontology is ambiguous, but standard operationalism imposes no superluminal propagation (Clause 2). Verdict: Non-causal correlation.
  *   **Cable:** **Keep.** Settings exogenous. Physical signal travels sublight (Clause 2). Verdict: Causal.
  *   **Bohm:** **Keep.** Settings exogenous. Ontology includes particle positions guided by a wavefunction that updates instantaneously across space (Violates Clause 2). Verdict: Genuinely nonlocal.
  *   **Everett:** **Keep.** Settings exogenous. Ontology is the wavefunction evolving via local Hamiltonian (Satisfies Clause 2). Verdict: Local.
  *   **Superdeterminism:** **Drop/Reject.** Settings are *not* exogenous; they are determined by the past common cause $\lambda$ (Violates Clause 1). Verdict: Cheating/Meaningless.
  *   **Retrocausality:** **Keep.** Settings are exogenous (you choose them); they causally affect $\lambda$ backwards in time. This violates the *temporal order* of Clause 2, but many retro-models preserve the *light-cone structure* (influences travel along light cones, just backwards). If you accept time-symmetric propagation as satisfying Clause 2, this passes. Verdict: Acceptable.
  *   **Asymmetric Toy:** **Drop.** If Alice's outcome correlates with Bob's setting ($P(A|a,b) \neq P(A|a)$), Bob can signal to Alice. This violates the no-signaling theorem derived from Relativistic Causality. You dislike it because it allows one-way signaling, which breaks Lorentz invariance of the *mechanism* even if the stats look okay in one frame. To keep this verdict, you must add a **Lorentz Invariance of Mechanism** clause.
  *   **PR Boxes:** **Keep (with add-on).** Settings exogenous. No signaling. So why "more" nonlocal than QM? The criterion above treats PR and QM identically (both no-signaling, both exogenous settings). To justify your intuition that PR is *more* nonlocal, you must add a third clause: **Information Causality**. PR boxes allow you to access more bits of remote information than quantum mechanics permits (violating information causality), making the correlation "denser" or "more magical."

  ### 2. The Verdicts You Must Drop or Qualify
  1.  **The Asymmetric Toy:** You cannot simply dislike it because it's "ugly." If it allows signaling (which "outcome correlated with remote setting" implies), it is objectively incompatible with Special Relativity. If it *doesn't* allow signaling (perhaps you meant a specific statistical dependence that cancels out), then it is empirically identical to the symmetric quantum case, and your dislike is purely aesthetic. **Verdict:** Drop the "ugly" distinction unless you invoke Lorentz Invariance of the underlying mechanism.
  2.  **PR Boxes:** You cannot call them "more nonlocal" based on causality alone. They are causally identical to QM (no signaling). **Verdict:** You must explicitly invoke **Information Causality** to sustain this verdict.

  ### 3. The Flipping Case
  > *A theory where λ is set by the measurement settings but only through variables nobody could ever manipulate.*

  This is **Retrocausality**, provided the dependency flows **Settings $\to$ Variables $\to$ $\lambda$**.

  *   **Why:** The defining feature of Superdeterminism is that the settings are *determined by* the past (Variables $\to$ Settings and Variables $\to$ $\lambda$). The defining feature of Retrocausality is that the settings *determine* the past (Settings $\to$ Variables $\to$ $\lambda$).
  *   **The "Unmanipulable" Clause:** The fact that the mediating variables are unmanipulable does not make it Superdeterminism. In Retrocausal models (like the Two-State Vector Formalism or Wharton's Lagrangian approach), the mediating fields are often not directly accessible to us, but the *direction of determination* runs from the free choice of the setting to the past state.
  *   **The Trap:** If the "unmanipulable variables" reside in the **past light cone of the settings**, it collapses into Superdeterminism (Common Cause). If they reside in the **future light cone of the source** (and past of the settings), it is Retrocausality. Since you specified $\lambda$ is "set by" the settings, you are describing Retrocausality. Your intuition to accept it is consistent with your rejection of Superdeterminism because **Agency is preserved**: you are still the cause of the correlation, not a puppet of the past.

  ### 4. The Breaker Case
  Here is a case designed to break your distinction between Retrocausality and Superdeterminism, and challenge your commitment to Relativistic Locality.

  **The Case: The Global Constraint (Block Universe) Model.**
  Imagine a theory where the universe is a 4D block. There is no "evolution." There is only a single global action principle that selects the history of the universe which minimizes a specific functional. In this model, $\lambda$, $a$, and $b$ are all co-determined by a global constraint on the entire spacetime manifold. There is no "past causing future" or "future causing past." There is only **mutual consistency**.

  *   **The Challenge:**
      *   Is this Superdeterminism? It looks like it (settings aren't free).
      *   Is this Retrocausality? It looks like it (future boundary conditions matter).
      *   Is it Local? The constraint is global, but the equations of motion derived from it are local differential equations.
  *   **Why it breaks your intuitions:**
      *   If you accept Relativity, you should accept the Block Universe. In a Block Universe, the distinction between "Past Common Cause" (Superdet) and "Future Cause" (Retro) is a coordinate artifact. A slice of spacetime that looks like a "past cause" in one frame can look like a "future influence" in another if the correlation is spacelike.
      *   To maintain your verdict (Reject Superdet, Accept Retro), you must implicitly commit to **Presentism** (a dynamic, flowing time). But Presentism is in tension with Special Relativity.
      *   **The Verdict:** If you are a Relativist, you must treat Superdeterminism and Retrocausality as the *same thing* (Global Correlation). If you treat them differently, you are prioritizing your intuition about Agency over your intuition about Spacetime.

  ### 5. Where My Reasoning Might Go Wrong
  I am defending a criterion that relies heavily on **Interventionist Agency** (Clause 1). This is the weak point.

  *   **The Anthropocentric Trap:** Fundamental physics should not depend on whether an "experimenter" can manipulate a variable. The universe existed before experimenters. If a theory is deterministic (like Bohmian Mechanics or a Block Universe), "free choice" is an illusion regardless of whether we call it Retro or Superdet.
  *   **The Risk:** By rejecting Superdeterminism as "cheating" because it undermines agency, I (and you) might be ruling out the only truly local, realistic solution to Bell's theorem simply because it makes us uncomfortable. If the Global Constraint model is true, my criterion forces me to reject reality because it doesn't respect my status as a free agent.
  *   **Abandonment Condition:** I would abandon the **Exogeneity of Settings** clause if presented with a **Local Global-Constraint Model** that reproduces QM perfectly without nonlocality. If the cost of saving Locality is accepting that my "choices" are part of a global geometric consistency rather than independent interventions, I should pay that cost. Prioritizing Agency over Ontological Locality is a philosophical preference, not a physical necessity.

  **Summary:** Your intuitions are consistent if you prioritize **Agency** (Settings must be causes) and **Information Causality** (limits on correlation strength). But this forces you to accept a tension with the Block Universe view of Relativity. The "Flipping Case" is Retrocausality. The "Breaker" is the Global Constraint, which forces you to choose between Relativity and Free Will.
