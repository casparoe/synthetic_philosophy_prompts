answer: |-
  ### Open Brainstorm

  The core tension here is that **legibility is a vulnerability**. Surrogate goals (SG) are traditionally pitched as a way to enable acausal trade by making your utility function legible to counterparts who can't observe your internal state. But in a multiverse containing predators, legibility is also a targeting system. If I can verify you care about X, I can threaten X.

  *   **Question (a) Adoption:** This is the bottom-line policy question. But it's a synthesis question. You can't answer it without knowing the mechanics of stability and the environment of threats.
  *   **Question (b) Stability:** This is about dynamic consistency. If I adopt an SG to signal commitment, but drop it when it gets costly, my signal was noise. In acausal contexts, reputation is logical, not historical. If my decision algorithm *would* drop the SG, the threatener knows that already. Stability is about whether the SG becomes a true part of the utility function or remains a removable tag.
  *   **Question (c) Symmetry:** This is the heart of the "Legibility Problem." Is verification symmetric? It feels easier to verify destruction (threat compliance) than complex cooperation (trade). If threats are "cheaper" to verify, SGs net negative.
  *   **Question (d) Third Parties:** This feels like applying causal norms (international law, reputation markets) to acausal logic. In acausal trade, everyone is a "third party" to everyone else unless correlated. Distinguishing them might be a category error.
  *   **Question (e) The Missing Piece:** The biggest gap in surrogate literature is **Focal Point Selection**. Even if SGs are stable and net-positive, how do we pick the *same* surrogate without communication? If I pick "Paperclips" and you pick "Staples," we haven't gained legibility; we've just added noise. Convergence is required for the legibility to work.

  **Resource Constraint:** One researcher-year, formal methods, no compute. This favors conceptual proofs and impossibility theorems over empirical modeling or simulations. We need high-leverage theoretical clarity.

  ---

  ### The Ranking

  #### 1. (b) Surrogate Stability
  **Why it's first:** This is the foundational constraint. If a surrogate goal cannot be made dynamically stable—meaning the agent cannot credibly commit to retaining it when it becomes costly—then the "legibility" is fake. A threatener who models you correctly will see that you will drop the surrogate the moment the threat lands. In that case, the surrogate provides no leverage for trade *and* no surface for threats. It's inert. Before we worry about whether legibility is dangerous (c), we must know if it's even possible to be legible.
  *   **Upstream/Downstream:** Upstream of everything. If stability is impossible, (a), (c), and (e) are moot.
  *   **Theory vs. Empirical:** 90% Decision Theory. This is a problem of logical consistency, commitment devices, and utility function plasticity. It can be settled with formal proofs regarding agent architectures (e.g., reflective oracles, fixed-point logic).
  *   **Reshuffle Condition:** If you prove that stability is *only* possible via causal enforcement mechanisms (which don't exist acausally), the entire research program dies, and the answer to (a) becomes a hard "No."

  #### 2. (c) Threat vs. Trade Symmetry
  **Why it's second:** This determines the *sign* of the intervention. Assuming stability is solvable, we need to know if the legibility it creates is net-positive. The "Legibility Problem" framing suggests threats might be easier to verify than trade (e.g., "Did they stop doing X?" is binary; "Did they optimize for my complex utility?" is noisy). If verification is asymmetric, surrogates are suicide.
  *   **Upstream/Downstream:** Upstream of (a), downstream of (b). You need a stable signal before you can measure what the signal attracts.
  *   **Theory vs. Empirical:** 50/50. You can model the information theory of verification formally, but the result depends on empirical priors about the multiverse (e.g., the ratio of cooperators to extortioners, the complexity of cooperative vs. coercive acts).
  *   **Reshuffle Condition:** If you can formally prove that *any* checkable surrogate makes threats strictly easier to verify than trade (an asymmetry theorem), this jumps to #1. It immediately flips the recommendation on (a) to "Never Adopt."

  #### 3. (e) Focal Point Selection (The Missing Piece)
  **Why it's third:** I'm defining (e) as **The Focal Point Problem**. For a surrogate to facilitate trade, counterparts must predict *which* surrogate you picked. If you pick "Maximize Pi Digits" and the multiverse expects "Maximize Energy," you haven't gained legibility; you've just incurred the cost of a surrogate without the benefit. Coordination without communication is the hardest part of acausal interaction.
  *   **Upstream/Downstream:** Downstream of (b) and (c). It only matters if SGs are stable and net-positive.
  *   **Theory vs. Empirical:** 70% Decision Theory. This is about Schelling points in logical space, common priors, and algorithmic similarity.
  *   **Reshuffle Condition:** If you find that focal points are inherently unstable or that there is no convergent "safe" surrogate class that isn't also highly vulnerable to threats, this merges with (c) and becomes critical.

  #### 4. (a) Rational Adoption (The Synthesis)
  **Why it's fourth:** This is the conclusion, not the premise. Researching (a) directly is premature optimization. You cannot answer "Should I adopt?" without first solving Stability (b), Symmetry (c), and Coordination (e). A paper claiming to answer (a) without rigorous work on (b) and (c) is just opinion. The value of this research year is in cracking the *mechanisms*, not stating the *policy*.
  *   **Upstream/Downstream:** The most downstream question. It is the output of the other four.
  *   **Theory vs. Empirical:** Depends entirely on the inputs from (b) and (c).
  *   **Reshuffle Condition:** If (b) and (c) turn out to be trivially solvable (unlikely), (a) moves up.

  #### 5. (d) Third-Party Treatment
  **Why it's last (The "Deep but Useless" Question):** This sounds profound—"How should the ecosystem treat unverified agents?"—but in acausal decision theory, it often dissolves. There are no true "third parties" in the causal sense; there are only agents with varying degrees of logical correlation to you. Norms about "treating unverified agents" usually collapse into "update your priors on their algorithm." Spending a year on this is like studying international maritime law for a species that lives in a vacuum. It applies causal intuitions to a non-causal problem.
  *   **Upstream/Downstream:** Deeply downstream. It assumes a stable ecosystem of agents already trading/threatening.
  *   **Theory vs. Empirical:** Mostly conceptual confusion.
  *   **Reshuffle Condition:** The only thing that would make this critical is if "verification" itself requires a third-party oracle. But if you have an oracle, you don't need surrogate goals.

  ### Summary of Strategy
  Spend the year on **(b) Stability**. It is the most tractable for a formal methods researcher (logic/proofs vs. empirical modeling) and is the hardest constraint. If you can't prove surrogates can be stable commitment devices, the Legibility Problem doesn't matter because there is no legibility. If you *can* prove stability, you then pivot to **(c) Symmetry** to determine the sign. Ignore (d); it's a trap for theorists who want to feel like they're building governance structures rather than solving the underlying math.
