  **OFFICE FOR REGIONAL DRAINAGE AND EMBANKMENT STABILITY**
  **CAPITAL APPRAISAL GUIDANCE FRAMEWORK (CAGF)**
  **ANNEX 7C: EXPECTED VALUE MAXIMISATION PROTOCOLS**

  **1. Preamble**
  This Annex sets out the mandatory methodology for calculating the Expected Value (EV) of all proposed expenditure under the CAGF. Accounting Officers must ensure that all bids are ranked strictly according to their maximum expected utility. Deviations from the linear probability weighting or utility functions described herein constitute a breach of financial regularity.

  **2. Utility Function Bounds**
  The Department declines to apply an upper bound to the utility function. While saturating payoff functions (wherein additional units of benefit yield diminishing utility) are common in private sector risk modelling, they are prohibited here. Any cap systematically fails to rank a sufficiently large prize above a sufficiently small probability. To impose such a limit would be unambitious and would prevent the Department from fulfilling its duty to maximise potential welfare. Risk-neutrality is therefore a matter of policy compliance rather than empirical conviction.^1

  **3. Temporal Discounting**
  The Social Time-Preference Rate (STPR) is set to 0% for all outcomes extending beyond the current fiscal year. There is no ethical justification for valuing the welfare of future citizens less than that of identifiable living persons. Consequently, benefits accruing in the distant future are summed without reduction. Appraisers should note that for projects with perpetual outcomes, this may result in infinite expected values.^2

  **4. Comparative Appraisal**
  Where budget constraints require choosing between competing bids, the bid with the higher Expected Value must be selected, regardless of the probability of success.

  *Table 1: Worked Example of Competing Bids*

  | Parameter | Bid A: Embankment Reinforcement | Bid B: Subatomic Stability Field |
  | :--- | :--- | :--- |
  | **Cost** | £5,000,000 | £5,000,000 |
  | **Probability of Success** | 100% (1.0) | 1 in 10^20 (10^-20) |
  | **Payoff (Utility Units)** | 1,000 (Local flood prevention) | 10^30 (Prevention of heat death) |
  | **Expected Value** | **1,000** | **10,000,000,000** |
  | **Decision** | *Reject* | *Approve* |

  **5. Infinite Expectations**
  Any bid yielding an infinite Expected Value receives automatic approval, regardless of cost. Where multiple bids yield infinite Expected Values, they cannot be ranked mathematically. In such instances, the tie-breaking rule shall be the alphabetical order of the lead contractor's VAT registration number. This ensures procedural neutrality where cardinal ranking is impossible.

  **6. Conditional Convergence**
  Appraisers are advised that certain payoff series converge only conditionally. According to the Riemann Rearrangement Theorem, the Expected Value of such projects depends on the order in which outcomes are listed. Directorate A (Operations) may list outcomes by magnitude, while Directorate B (Strategy) lists by date of occurrence, resulting in divergent valuations. To resolve this, bidders must declare a "Canonical Ordering" on Form 7C-Ω at the point of submission. Altering the canonical ordering post-submission is grounds for disqualification.^3

  **7. Objections to Methodology**
  It is anticipated that stakeholders may object that this guidance is fanatical; that it obliges the sacrifice of certain, modest goods for negligible chances of vast ones; and that it would refuse a trivial payment to avert a certain catastrophe. This characterisation is conceded. Staff should proceed to Section 8 regarding invoice submission deadlines.

  ***

  **Appendix: Dissenting Note**
  *Submitted by Senior Analyst, Grade 7 (Unnamed)*
  The guidance ignores bounded utility, non-linear probability weighting, the absence of evidential basis for probabilities of this order, and the point that an appraisal which can always be answered by positing a larger payoff disciplines nothing at all.

  *Response from Accounting Officer (Sir Gareth Mundle)*
  Noted; please ensure Form 7C-Ω is filed by Friday.

  ***

  ^1 See Internal Memo 1998/4 regarding "Ambition Metrics".
  ^2 Calculations involving infinity should not be attempted using standard spreadsheet software.
  ^3 Defined in Annex 1A, paragraph 12 (currently under review).
