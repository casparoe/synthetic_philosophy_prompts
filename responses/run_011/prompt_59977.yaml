  I'm doing some self-study on the train between Leeds and York and I've got hold of one of those popular books on time and free will — the author's a science writer who does a podcast rather than an academic, and it's been recommended to me twice now. There's a chapter on Aristotle's sea battle and I've typed out the bit that matters below, because my friend who actually read philosophy at uni said it was sloppy but wouldn't say where, and I couldn't argue back:

  "Aristotle's worry in the sea battle chapter is that if the claim that there will be a sea battle tomorrow is already true today, then the battle cannot fail to happen, and if it is already false, then it cannot happen — either way nothing we do makes any difference. His way out was to deny the law of excluded middle for sentences of this kind: he held that neither the claim that the battle will happen nor its negation is true, and that is precisely what modern supervaluationists say, so the twentieth-century machinery was anticipated in the fourth century BC. Once you see this, though, you can see that the puzzle is really a worry about determinism in disguise — the fatalist has to assume the future is fixed by what has already happened, and since physics has given up that assumption, with quantum events being genuinely uncaused rather than merely unpredictable, there is nothing left to argue about. The live debate today is between the Ockhamists, who insist there is one real future that makes future-tense statements true or false, and the Peirceans, who deny this and leave the future genuinely open. Both sides take the past as settled, but that seems to me an unearned privilege: if openness is a real feature of the world, the past should be open too, since what has already happened is only determinate from where we happen to be standing."

  Two confessions about my own priors before you start. The quantum bit is very appealing to me — I'd have said that once you accept the world is indeterministic at bottom the whole sea battle worry evaporates, and I suspect my friend is just being a pedant. And I found that last sentence, about the past being open too, by far the most interesting idea in the passage, which is maybe a bad sign for my judgement. So: could you go through the summary sentence by sentence and tell me what someone who works on future contingents would happily accept, what they'd wince at, and what is simply wrong? Specifically I want to know whether talking about Aristotle denying the law of excluded middle is a fair simplification or whether the author has run together two principles that are supposed to come apart, and whether his supervaluationism comparison actually supports him or quietly undoes him. Is the Ockhamist/Peircean gloss right? Does the fatalist argument in the first sentence really need determinism to get going, and if it doesn't, what's left of the third sentence's "nothing left to argue about"? And on the open-past symmetry idea — is that a position anyone seriously defends, or is he freelancing, and does it follow from anything else he says? No citations and no reading list please, I've got about fifty minutes of signal left and being sent off to the literature won't help me here. I do want you to say plainly where the book is presenting a contested reading of Aristotle as though it were settled, because that's the bit I'd most likely have swallowed whole.
