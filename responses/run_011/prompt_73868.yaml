  *(Self-Correction Note)*: I need to make sure I don't drift too much into Behavioral Econ. The prompt is Philosophy of Economics. Keep the focus on the *ontology of preference* and the *methodology of RP*, not just "people are irrational."

  *(Refining the "Identity" point)*: Standard economics *can* model identity (Akerlof/Kranton), but that's a later development (2000). In 1985, it was standard neoclassical. The philosophical question is whether modeling identity as a parameter captures the *phenomenology* of the choice. Sen argues it doesn't. I should mention Sen.

  *(Refining the "Coke Management" point)*: Did they use RP? They used *data* to infer preference. RP says "Choice *is* preference." Coke said "Sip choice *predicts* Market choice." That's a predictive model, not strictly RP ontology. I need to make that distinction clear.

