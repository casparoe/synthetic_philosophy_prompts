answer: |-
  This is an excellent case study for a philosophy of economics seminar. It cuts right to the bone of the ontological status of utility and the methodological limits of Revealed Preference (RP).

  Here is a breakdown of the New Coke episode through the lens of RP theory, stress-testing your proposal, and flagging the consensus vs. contested terrain in the literature.

  ### 1. Mapping the Theory: What Counts as Preference?

  First, a correction on a foundational point, which matters for your paper: You wrote, *"If choice is the only evidence we have about preference..."*
  Strictly speaking, in the Samuelsonian RP framework (1938), choice is not merely **evidence** of preference; it is the **definition** of preference. There is no underlying psychological state called "preference" that exists prior to or independent of the choice. Utility is an ordinal index constructed to represent those choices.

  **The Mapping:**
  *   **The Sip Tests:** In the mall context, consumers chose New Coke over Old Coke. RP licenses the conclusion: *In the context of a single blind sip, New Coke $\succ$ Old Coke.*
  *   **The Market Launch:** Consumers chose (or hoarded) Old Coke over New Coke. RP licenses the conclusion: *In the context of market purchase, Old Coke $\succ$ New Coke.*
  *   **The Boycotts/Letters:** These are "cheap talk" in RP terms. Unless signing a petition or writing a letter involves a cost that alters a budget constraint or choice set, RP theory treats them as irrelevant noise. If a person writes a letter protesting New Coke but then buys a can, RP says they revealed a preference for buying the can. The letter is not a choice over economic goods; it is costless signaling.
  *   **The Angry 10–12%:** This is where RP goes quiet. RP is behaviorist by design. It has no ontology for "anger" or "alienation" unless those states manifest as a choice (e.g., choosing not to buy). If the focus group participants said they were angry but subsequently bought New Coke because it was the only option, RP says they preferred buying it to not buying it. Their reported feelings are methodologically invisible.

  **The Contradiction:**
  If we treat "a sip of Coke" and "a case of Coke" as the same commodity bundle ($x$), then we have a violation of the **Weak Axiom of Revealed Preference (WARP)**. $x$ was chosen over $y$ in the mall; $y$ was chosen over $x$ in the store.
  *   **Settled View:** Strict RP cannot tolerate this without modification.
  *   **Contested View:** How to modify it. Do we admit preferences changed? Do we admit the goods were different? Or do we admit the theory fails here?

  ### 2. Stress-Testing Your Proposal: Context-Portability

  Your proposal is that the sip-test and the market choice measure different objects: *experience of a sip* vs. *ownership of a brand over time*. You call this **context-portability**.

  **Does the distinction hold up?**
  Logically, yes. Economically, this is known as the **individuation of commodities** problem.
  *   **The Defense:** A "can of New Coke in 1985" is not the same good as "a sip of New Coke in a mall." The former includes the utility of social signaling, nostalgia, consistency, and lack of cloying sweetness over time. If we define the commodity bundle finely enough to include all contextual attributes (time, place, psychological state), then WARP is never violated.
  *   **The Cost (Unfalsifiability):** You identified the risk correctly. If every preference reversal can be rescued by saying "those were actually different goods," the theory becomes tautological. It predicts nothing because it can explain everything post-hoc.
      *   **Literature Flag:** This is a major critique raised by **Amartya Sen** and **Daniel Hausman**. Hausman (in *The Inexact and Separate Science of Economics*) argues that if we individuate goods by every subjective nuance, we lose the ability to generalize. If "Coke for a patriot" and "Coke for a traitor" are different goods, economics cannot study "Coke."
      *   **Verdict:** Your distinction is valid *if* you can specify the contextual parameters *ex ante*. If you only use it to explain the reversal *ex post*, it is indeed a rescue device that weakens the theory's scientific status.

  **Identity and Brand:**
  *   **Standard RP Framework:** It *can* handle identity. You simply add "identity maintenance" as an argument in the utility function. $U = f(\text{sugar}, \text{price}, \text{identity})$. If the identity cost of switching is high, the consumer maximizes utility by sticking with Classic.
  *   **The Critique:** Philosophers (Sen, Anderson) argue this is a misdescription. It reduces **commitment** to **sympathy**. When people defended Classic Coke, they weren't just satisfying a preference; they were upholding a norm or defending an identity. Standard RP treats this as "getting what you want," but the phenomenology is "doing what is right for my tribe."
      *   **Settled:** RP can *model* this mathematically.
      *   **Contested:** Whether modeling it this way captures the *meaning* of the action or distorts it. If you treat identity as just another price, you miss the normative force of the protest.

  ### 3. The Verdict: Explanation, Misdescription, and Management

  **What RP Explains:**
  *   **The Final Outcome:** RP perfectly describes the return to Classic. People voted with wallets. The market equilibrium settled where the revealed preferences lay.
  *   **The Substitution Effect:** When Classic returned, sales jumped. This fits standard demand curves.

  **What RP Misdescribes:**
  *   **The Reversal:** RP assumes stable preferences. The New Coke episode suggests preferences were **constructed** or **discovered** during the crisis. People didn't know they preferred Classic until New Coke threatened it. This aligns with **Endogenous Preference** theories (contested) rather than standard RP (stable preferences).
  *   **The "Sip" Error:** RP doesn't inherently distinguish between "decision utility" (what drives choice) and "experienced utility" (what is actually enjoyed). The sip test measured experienced utility of a moment; the market measured decision utility of a relationship. RP conflates the two unless you manually separate the goods (as per your proposal).

  **Did the Theory Anticipate This?**
  No. Neoclassical theory generally assumes transitivity and stability. The idea that a "better" product (by sip metrics) would fail due to non-sensory attributes was a shock to the *application* of the theory, if not the theory itself. It highlighted the **Lancasterian** view (1966) that goods are bundles of characteristics, and Coke missed a characteristic (nostalgia/continuity).

  **Coke Management's Decision Procedure:**
  *   **Was it RP?** Not strictly. RP says "Choice *is* preference." Coke management acted as if "Sip Choice *predicts* Market Preference." They treated the sip test as a proxy variable.
  *   **Was it Bad Marketing?** It was bad *ontology*. They assumed the utility of Coke was derived solely from physical taste (hedonic utility). They ignored the **transaction costs** of switching (psychological cost) and the **social utility** of the brand.
  *   **Ignoring the 10–12%:** From a strict RP standpoint, ignoring the "angry feelings" was consistent *if* those people still bought the soda. But management failed to realize that "anger" is a leading indicator of a future change in the choice set (e.g., organizing boycotts, hoarding old stock). They treated reported feelings as noise, whereas in a dynamic model, they were signals of future constraint changes.

  ### 4. Meta-Commentary: Settled vs. Contested

  For your paper, you must distinguish these clearly.

  **Settled Consensus:**
  1.  **Definition:** In strict RP theory, preference is defined by choice, not introspection. Feelings without choices are not data.
  2.  **Prediction:** RP is better at predicting market outcomes than explaining individual psychological motivation.
  3.  **The New Coke Lesson:** Taste tests are poor predictors of market behavior when brand identity is involved. (This is settled in marketing and behavioral econ).

  **Genuinely Contested:**
  1.  **Welfare Implications:** If people chose New Coke in sips but Classic in markets, which choice reflects their "true" welfare?
      *   *Camp A (Standard RP):* The market choice dominates because it involves higher stakes/costs.
      *   *Camp B (Behavioral/Welfare):* Neither might be "true." People might be inconsistent, and a planner might need to nudge them. (Kahneman's "Experienced Utility" vs. "Decision Utility").
  2.  **Individuation of Goods:** Is re-describing the "sip" vs. "case" as different goods a valid theoretical move or an ad hoc fix?
      *   *Camp A (Neoclassical):* It's valid. Context is part of the good.
      *   *Camp B (Philosophical Critique):* It renders the theory unfalsifiable. (Hausman, Sen).
  3.  **Normative Status:** Does RP tell us what is *good* for people?
      *   *Camp A (Pareto):* Yes, satisfying revealed preferences is the definition of welfare improvement.
      *   *Camp B (Sen/Anderson):* No, preferences can be adaptive or mistaken. The Coke drinkers might have been "wrong" to be so attached to a formula, or "right" to defend a cultural icon. RP cannot judge.

  **Did You Misstate the Theory?**
  Only slightly, as noted in Section 1. You framed choice as *evidence* of preference. In the strong Samuelsonian view, it is *constitutive*. However, in modern applied microeconomics, many economists speak loosely as if preferences exist psychologically and choices reveal them. For a philosophy seminar, you should stick to the strict definition: **Choice constitutes preference.**

  ### Summary for Your Paper

  Your "context-portability" hypothesis is the strongest philosophical lever here. It saves Revealed Preference from contradiction but at the cost of making it less predictive.
  *   **Argument:** New Coke isn't a failure of RP; it's a failure of **commodity description**.
  *   **Counter-Argument:** If we accept that description, does RP still do any work?
  *   **Synthesis:** The episode shows that "Utility" in economics is not "Pleasure" (hedonism). It is a placeholder for "whatever drives choice." The anger of the 10–12% only mattered because it eventually drove choice. Until then, RP was right to ignore it, but management was wrong to assume the sip-choice would map to the market-choice without accounting for the change in the *description of the good*.

  This framing allows you to defend the internal logic of RP while acknowledging its empirical limitations, which is usually the sweet spot for a seminar paper.
