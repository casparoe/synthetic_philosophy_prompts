  ### Brainstorming Candidate Settings and Features

  1.  **Time of Day (Morning vs. Afternoon applications).** *Reject.* Too close to the excluded "mood from good news" or freshness bias; hard to argue a decision-maker could endorse this as a principle without appearing irrational.
  2.  **Medium of Submission (Mobile App vs. Desktop Website).** *Reject.* A respectable moral view could argue this is relevant (e.g., mobile implies field presence), violating the requirement that the feature have *no* moral standing.
  3.  **Physical File Position (Top of Pile vs. Bottom).** *Reject.* Explicitly excluded by your specifications ("position in a pile").
  4.  **Alphabetical Order of Verifiers (First Name vs. Second Name on joint form).** *Select.* No moral view makes alphabetical order relevant. It entangles easily with a defensible partiality (trust in a "lead" verifier) because people often conflate list order with responsibility.

  ### The Scenario

  Elena sits on a three-person panel distributing emergency housing grants. She holds a defensible principle: applications verified by a senior volunteer (five-plus years) deserve priority, as their experience reduces fraud risk. In her current case, two applicants have identical need and cost. Applicant A is verified by Maria (seven years); Applicant B by David (seven years). The verification form lists volunteers alphabetically. Maria's name appears first on Applicant A's form; David's second on Applicant B's. Elena feels a distinct pull toward Applicant A, sensing Maria's top-line placement signals "lead responsibility," a marker of accountability she values. She awards the grant to A.

  Elena is fully aware the list is alphabetical, yet maintains that top-line placement naturally correlates with who took the lead in the home visit. She insists that if David had been listed first, she would have funded B, provided his seniority was equal. Her record shows she funds "first-listed" seniors 80% of the time, even when the "second-listed" volunteer has equal tenure. A colleague with identical values does not show this sensitivity. The correlation between name order and actual lead responsibility is unknown; volunteers sometimes sort themselves alphabetically, sometimes by seniority, with no written record.

  ### The Four Tests

  *   **The Swap Test:** *Verdict: Preference — leave it alone.*
      We ask Elena: "If the names were reversed on the form, but Maria remained the senior verifier, would you change your decision?" She answers "No," indicating her judgment tracks seniority, not the list order. Because she claims counterfactual stability when the load-bearing factor (seniority) is held fixed, the test suggests the pull is a principled preference.
  *   **The Endorsement Test:** *Verdict: Preference — leave it alone.*
      We tell Elena exactly how the judgment arose: "You favored A because the name order felt like leadership, even though you know it's alphabetical." She reflects and replies: "I stand by that feeling; it is a heuristic for accountability that serves the fund's values." Because she calmly endorses the causal chain after full disclosure, the test suggests the pull is a valid preference.
  *   **The Provenance Test:** *Verdict: Bias — correct it.*
      We look at a peer decision-maker with the same values and access to the same information. They do not treat the first name as the lead verifier. Because a reasonable person with identical moral commitments would not produce this judgment, the test suggests the pull is an idiosyncratic bias.
  *   **The Pattern Test:** *Verdict: Bias — correct it.*
      We examine Elena's historical data. The funding rate correlates strongly with name order (80% vs. 40%) even when seniority is controlled. Because the variation tracks the standing-less feature across a run of decisions, the test suggests the pull is a bias.

  ### The Entangling Feature

  The single feature doing the entangling work is **alphabetical priority on a joint signature line**. It has no moral standing (A comes before B regardless of merit), but it structurally mimics "lead authorship" or "primary responsibility," which *does* have moral standing in verification contexts.

  ### Effect of Removing or Weakening the Feature

  If the feature is removed (e.g., forms list volunteers randomly or by seniority), the case collapses into an **obvious preference**. Elena would simply fund the senior verifier, and her behavior would align with her stated principle. If the feature is weakened (e.g., she is forced to acknowledge name order never correlates with lead responsibility), the case collapses into **obvious bias**, as she would be prioritizing a known arbitrary marker. The current entanglement persists only because the empirical link between order and responsibility remains unverified.

  ### Irresolvability and Next Questions

  No further information settles whether the pull is load-bearing or borrowed. Asking "Do volunteers actually list the lead person first?" would not settle it: if yes, she is principled (load-bearing); if no, she is biased (borrowed). But the volunteers themselves do not record who took the lead, and their habits are mixed. Asking "Would you change if you knew the order was random?" would not settle it: she might say "Yes" (admitting bias) or "No" (claiming the feeling itself carries weight). The ambiguity is structural, not informational.

  ### The Strongest Reply to Your Friend

  Your friend should argue that the **Endorsement Test is bogus** in cases of structural entanglement. She should say that endorsement only proves *internal consistency*, not *external validity*. A clock can be consistently wrong if its gears are meshed incorrectly; similarly, a decision-maker can consistently endorse a judgment produced by a feature that *looks* like a principle but functions as a proxy. She should argue that when the Pattern and Provenance tests contradict the Endorsement test, the external evidence of arbitrariness overrides the internal feeling of coherence.

  ### Advice for the Fund Runner

  If this diagnosis is right, you should not try to introspect your way to certainty, because the entanglement is invisible from the inside. Instead, introduce a **blind procedural check** (e.g., masking volunteer names or randomizing file order) that breaks the link between the standing-less feature and your decision, allowing the load-bearing factors to operate without the borrowed noise.
