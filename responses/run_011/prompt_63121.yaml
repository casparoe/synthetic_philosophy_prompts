  D1. **The Privacy Constraint:** The account must distinguish guilt and shame in episodes where no external audience exists (private shame) and where no external discovery occurs (private guilt).
  *   *Motivation:* Phenomenological reports of shame before oneself and guilt over undiscovered faults contradict definitions requiring publicity.
  *   *Status:* Non-negotiable.

  D2. **The Reflexivity Constraint:** The account must allow one emotion to take the other as its intentional object (e.g., shame at having felt guilt; guilt at having shamed someone) without collapsing the distinction.
  *   *Motivation:* Second-order moral emotions are common in complex moral psychology and must be describable without category error.
  *   *Status:* Non-negotiable.

  D3. **The Ontology of Fault:** The account must accommodate fault attaching to what one *is* (including unchosen conditions) and what one *did* for both emotions, without rigidly mapping shame to being and guilt to doing.
  *   *Motivation:* Cases like survivor guilt (guilt about being) and shameful acts (shame about doing) violate rigid object-based distinctions.
  *   *Status:* Non-negotiable.

  D4. **The Predictive Constraint:** The account must explain longitudinal evidence that dispositions toward the two emotions track divergent behavioral profiles (shame → withdrawal; guilt → repair).
  *   *Motivation:* Empirical data suggests trait-level differences have real-world consequences that an adequate theory must predict or explain.
  *   *Status:* Non-negotiable.

  D5. **The Engineering Constraint:** The account must formulate culture-level shifts in terms of tunable variables (concepts in circulation, audience structure, publicity of fault, availability of restitution) rather than essentialist traits or national character.
  *   *Motivation:* To assess the feasibility of deliberate societal shifts, the theory must identify levers of change accessible to policy and practice.
  *   *Status:* Non-negotiable.

  **Compatibility and Exclusion:** No pair of desiderata is flagged as jointly unsatisfiable; a sufficiently nuanced theory can accommodate privacy, reflexivity, ontological flexibility, behavioral prediction, and social tunability simultaneously. The single desideratum that eliminates the most accounts currently on offer is **D1**, as the "Publicity Condition" (shame requires an audience) remains the default assumption in classical philosophy and common-sense morality, rendering any account relying on it inadequate for private cases.

  **View Assessments:**
  The internalized-audience view satisfies D1 and D2 but struggles with D5, as internal judges are difficult to tune via external structural variables.
  The act-versus-self view satisfies D1 but fails D3, as its rigid mapping cannot accommodate survivor guilt or shame about voluntary acts.
  The response-tendency view satisfies D4 but fails D1 and D2, as defining emotions by behavioral outcomes ignores phenomenological privacy and reflexive intentionality.

  \answer{NONE / D1}
