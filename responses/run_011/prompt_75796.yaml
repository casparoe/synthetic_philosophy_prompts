answer: |-
  **MEMORANDUM TO REVIEW PANEL**
  **SUBJECT:** Specification Requirements for Predictive Cliodynamic Theory
  **STATUS:** Draft for Consensus

  **PREAMBLE**
  The panel has already established two necessary conditions for funding eligibility: (1) **Temporal Validity** (parameters must be estimable using only data available prior to the forecast window) and (2) **Non-Tautology** (predictors cannot be coded proxies for the outcome). These conditions eliminate obvious overfitting and look-ahead bias. However, they do not guarantee that a model constitutes a *predictive theory* rather than a statistically sophisticated description of known history. The following specification addresses the structural, mechanistic, and inferential gaps that allow curve-fitting to masquerade as theory.

  ---

  ### I. SPECIFICATION REQUIREMENTS

  #### 1. Spatial and Phylogenetic Independence
  *   **Requirement:** The model must explicitly account for non-independence among polities. Observations cannot be treated as independent and identically distributed (i.i.d.) when polities share borders, trade networks, or cultural lineages. Effective sample size ($N_{eff}$) must be calculated correcting for spatial autocorrelation and phylogenetic inheritance.
  *   **Motivation:** **Galton's Problem.** Polities do not evolve in isolation; they conquer, imitate, and trade with one another. A model that treats 19th-century European states as independent observations is statistically inflating its degrees of freedom. If a shock (e.g., the Little Ice Age) affects all polities simultaneously, a model predicting "crisis" for all of them has not made $N$ predictions; it has made one.
  *   **Status:** **Non-negotiable.** Without this, p-values and confidence intervals are mathematically invalid.

  #### 2. Cycle Definition and Stationarity
  *   **Requirement:** To claim a "secular cycle," the training data must contain at least three full oscillations of the proposed periodicity *within a single continuous polity trajectory*, or the model must demonstrate that the periodicity holds across independent lineages without re-calibrating period length. Trends must be explicitly differenced from oscillations.
  *   **Motivation:** **Periodicity vs. Trend + Noise.** A single rise and fall (e.g., Rome) is a trajectory, not a cycle. Two points make a line; three make a wave. With only one or two cycles per polity, any periodicity claim is indistinguishable from a stochastic trend with heteroskedastic noise.
  *   **Status:** **Non-negotiable** for claims of *cyclical* theory. (Linear trend models are exempt but cannot claim cyclical prediction).

  #### 3. Ex-Ante Uncertainty Quantification
  *   **Requirement:** Forecasts must include confidence intervals or probability distributions generated *before* the forecast window opens. A "miss" is defined as an outcome falling outside the stated 95% interval. Post-hoc widening of error bars to accommodate misses is prohibited.
  *   **Motivation:** **Falsifiability.** A theory that predicts "instability" without defining the threshold of instability or the probability of occurrence cannot be falsified. If the model predicts a crisis and none occurs, the modeler must not be permitted to argue that "structural pressure" existed but "contingent factors" suppressed it, unless those contingent factors were included in the error term ex-ante.
  *   **Status:** **Non-negotiable.**

  #### 4. Mechanism Distinctness
  *   **Requirement:** The causal mechanism linking predictor to outcome must be specified independently of the statistical correlation. If the model relies on "elite overproduction," there must be a measure of elite overproduction that is not derived from the incidence of violence or instability it is meant to predict.
  *   **Motivation:** **Black Box Risk.** Statistical fit does not equal causal understanding. A model might predict revolution using grain prices, but if the mechanism is actually "state fiscal capacity," the theory is wrong even if the forecast is right. For a *theory of history*, the "why" must be as robust as the "when."
  *   **Status:** **Preference.** (Some camps argue instrumental prediction is sufficient; however, for *theoretical* funding, mechanism is required).

  #### 5. Unit Specificity (Aggregate vs. Particular)
  *   **Requirement:** The model must specify the unit of prediction. It must predict outcomes for specific polities or clearly defined clusters, not merely "global systemic instability."
  *   **Motivation:** **The Refuge of Aggregation.** Predicting that "somewhere in the system, violence will occur" is trivially true in almost every year of recorded history. Predictive power is only demonstrated when the model identifies *which* polity is at risk.
  *   **Status:** **Non-negotiable.**

  ---

  ### II. RETRODICTION VS. FORECAST

  **The Question:** Can accurate retrodiction of the past substitute for a risked forecast? Is "history is predictable in aggregate but not in particulars" a substantive commitment or a refuge?

  **The Panel's Settlement:**
  Accurate retrodiction **cannot** substitute for a risked forecast, even when the retrodiction uses only data available prior to the event (satisfying the Temporal Validity criterion).

  1.  **Parameter Tuning:** Retrodiction allows for implicit tuning. A modeler knows the French Revolution happened in 1789; even if they claim to use only pre-1789 data, the knowledge of the outcome often influences variable selection and functional form specification during the training phase.
  2.  **The "Aggregate" Refuge:** The claim that "history is predictable in aggregate but not in particulars" is, in this context, a **refuge**. It is a strategy to insulate the model from falsification. If a model predicts a "Age of Discord" for a century but fails to predict the specific timing or location of the violence, it claims success based on aggregate trends while failing the specific tests that matter for policy and theory.
  3.  **Verdict:** A model must demonstrate out-of-sample predictive validity on *particulars* (specific polity outcomes) to be considered a predictive theory. Aggregate predictability is a necessary condition for macro-history, but not a sufficient condition for a *predictive* model. If a model cannot distinguish between a polity that will collapse and one that will survive in the same era, it has not captured the causal mechanism, only the background noise.

  ---

  ### III. INCOMPATIBILITIES AND TRADE-OFFS

  Applicants must be aware that the following requirements create tension that may not be jointly satisfiable with current data quality:

  1.  **Independence vs. Sample Size:** Enforcing **Spatial/Phylogenetic Independence** (Req 1) drastically reduces the effective sample size ($N$). Cliodynamics relies on large datasets (e.g., Seshat) to overcome noise. If we correct for autocorrelation, $N$ may drop below the threshold required for statistical significance.
      *   *Resolution:* Applicants must acknowledge the reduced $N_{eff}$. If $N_{eff}$ is too low for frequentist inference, Bayesian methods with strong priors are required.
  2.  **Cycle Definition vs. Historical Record:** Requiring **Three Full Oscillations** (Req 2) excludes most polities, as few have continuous data spanning 600+ years (assuming a 200-year secular cycle).
      *   *Resolution:* Models may pool polities, but only if they satisfy Independence (Req 1). This creates a catch-22: Pooling increases $N$ but risks violating Independence. Applicants must explicitly model the diffusion process rather than pooling as independent observations.

  **Conclusion on Conflicts:** It is possible that no existing dataset satisfies both Independence and Cycle Definition simultaneously. In this case, the model must be classified as *exploratory* rather than *predictive*, and funding should be contingent on data generation rather than theory testing.

  ---

  ### IV. THE KILLER REQUIREMENT

  If enforced strictly, the single requirement that would eliminate the most existing work is:

  **Requirement 1: Spatial and Phylogenetic Independence.**

  **Reasoning:**
  The majority of current cliodynamic literature utilizes pooled cross-sectional time-series models. These models treat polity-years (e.g., Egypt-1500, Rome-1500, China-1500) as independent rows in a regression matrix. This assumes that the structural pressures in Han China are statistically independent of those in the Roman Empire. This is historically false (via trade, steppe nomad diffusion, climate shocks) and statistically fatal.

  Correcting for this autocorrelation (via hierarchical modeling, spatial lag, or phylogenetic control) typically inflates standard errors to the point where the "significant" relationships driving the field (e.g., between elite overproduction and instability) lose statistical significance. Most existing models derive their predictive power from the shared variance of connected polities (the "zeitgeist") rather than internal polity dynamics. Enforcing independence forces the model to predict *deviation* from the regional trend, which is where the actual theoretical work lies, and where most current models fail.

  ---
  **END OF SPECIFICATION**
