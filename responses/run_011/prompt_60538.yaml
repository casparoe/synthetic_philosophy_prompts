      **OAKWOOD HEIGHTS RESIDENTS' ASSOCIATION**
      **Minutes of the Monthly General Meeting**
      **Date:** 14 October 2023
      **Venue:** Village Hall, Main Room
      **Time:** 7:00 pm – 8:45 pm
      **Present:** Mrs. A. Gable (Chair), Mr. T. Henderson, Mr. L. Prufrock, Mr. J. Keynes, Ms. S. Vane, Mr. P. Secretary.
      **Apologies:** None.
      **Refreshments:** Tea and digestives provided.

      **1. Clubhouse Facade Repainting**
      Mr. Henderson proposed that the Association repaint the clubhouse. Mrs. Gable seconded. Both members stated unequivocally that they intended to paint the building together. However, upon reviewing procurement records, it emerged Mr. Henderson had purchased twelve gallons of sage green, having privately resolved the colour prior to the meeting, while Mrs. Gable had resolved internally that the colour must be cream, stating she would withdraw labour otherwise.

      Mr. Prufrock raised a Point of Order, stating that since he personally intended to paint the clubhouse sage green in his own mind, the action was already underway within his individual cognition, regardless of whether the others acknowledged this intention.

      The Secretary objected that an intention cannot be part of the Association's business unless it is mutually acknowledged as open knowledge among all participants. The Chair overruled Mr. Prufrock on the grounds that individual cognition does not constitute joint activity, but also overruled the Secretary on the specific requirement for openness, citing Standing Order 4 (Joint Resolve).

      Regarding the colour conflict, the Chair ruled that this was not a disagreement regarding aesthetics, but a failure of individual sub-plans to interlock. She declared that a vote on colour was procedurally invalid. The remedy was not to tally preferences, but to renegotiate the sub-plans until they meshed. The motion was held in abeyance pending plan interlock.

      **2. Harvest Barn Dance**
      A motion was proposed to host a Harvest Barn Dance. The vote was carried unanimously. The minutes record that every single member present explicitly stated a personal preference against attending the dance.

      The Secretary objected that this constituted an accounting error. He argued that the Association cannot intend to host a dance if no individual member intends to host a dance, as the Association's intentions are the sum of its members' intentions.

      The Chair overruled the objection. She stated that the Association forms a distinct plural subject upon the motion's carriage. The intention belongs to the subject formed by the members, not the members themselves. Therefore, the Association intends to dance, notwithstanding the unanimous personal reluctance of the constituent individuals. The motion stands.

      **3. Rescission of Commitment**
      Mr. Prufrock moved to withdraw his participation in the Barn Dance, citing a change of mind and a revelation that he never truly wanted the motion to pass.

      The Chair ruled him out of order. She stated that a member cannot release himself from a joint commitment unilaterally. The commitment runs to the other members, and only the collective body can dissolve it. She instructed that if Mr. Prufrock fails to appear on the night, he will be fined fifteen pounds and owes the Association a formal apology.

      Mr. Prufrock asked how this differed from a promise, which an individual may be let out of by the promisee. The Chair responded confidently that a promise is a bilateral transfer of rights, whereas this commitment creates a new authority that holds the rights. Therefore, no single individual possesses the key to the lock. Mr. Prufrock recorded his dissent.

      **4. Any Other Business**
      Ms. Vane reported a fallen tree across the shared drive. There are two equally acceptable methods of clearance, but both require all members to utilise the same method simultaneously to be effective. Every member expressed willingness to perform their part provided the others did so, but nobody was willing to initiate the coordination.

      The standard procedure—a poll of individual preferences followed by a majority vote—was attempted. This provably failed to secure coordination, as each member's preference was conditional on the others' actions.

      Mr. Keynes proposed that the Association stop asking what each member wants and start asking what the group should do as a single unit. He suggested rewriting the standing orders to prioritise group rationality over individual preference aggregation.

      Members shouted him down for attempting to rewrite the standing orders without notice. The Chair noted the proposal but declared it inadmissible under current procedural rules. The tree remains.

      **5. Adjournment**
      The meeting closed at 8:45 pm. The next meeting will proceed under the same standing orders.

      *Approved by the Chair.*
      *Countersigned by the Secretary.*

