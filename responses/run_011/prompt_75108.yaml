      I recommend the board adopt Dana's proposal to replace the four hundred-hour requirement with sixty hours plus a three-thousand-dollar maintenance contribution.

      Marcus's defense rests on the evolutionary concept of costly signaling: that a burden proves quality because only the truly committed will bear it. This is the Handicap Principle. For this signal to remain honest, the cost must fall disproportionately on the "low-quality" applicant—the free-rider—rather than the "high-quality" neighbor we seek. Our experience suggests the reverse is occurring. The cost of four hundred hours falls hardest on those with least discretionary time: single parents, night-shift workers, and aging applicants. These are often our highest-quality candidates for community stability. Meanwhile, the free-rider who views this as a financial arbitrage opportunity can absorb the cost by cheating, as evidenced by the landscaping crew incident, or by leveraging surplus unemployment. When a signal is easier for a speculator to fake than for a nurse to complete, it has failed its biological function. We are not screening for commitment; we are screening for availability.

