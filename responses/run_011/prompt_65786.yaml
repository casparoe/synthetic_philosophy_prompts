  This premise looked unobjectionable because it captures the intuitive force of higher-order evidence: if you learn your reasoning is flawed, you feel you lose support for your conclusion. It silently assumes a "screening-off" model where higher-order evidence about reliability functions as direct first-order counter-evidence against the proposition or its support, effectively canceling out the original evidence. By giving this up, you preserve the objectivity of evidential support (premise 5) and avoid the skeptical conclusion (premise 12), but you lose the simplicity of the strict Equal Weight View, requiring you to explain how first-order evidence can retain its weight even when you have reason to doubt your assessment of it. I rank rejecting premise (10) as a secondary option; while it blocks the move to universal skepticism, it leaves you stuck with local epistemic akrasia in the disagreement case, whereas rejecting (3) dissolves the tension at its source.
