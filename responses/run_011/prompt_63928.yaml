prompt: |-
  I'm a staff engineer at a mid-sized open-source infrastructure foundation — call it the Lattice Foundation, formed in 2014 out of a merger between two overlapping projects — and for the past eighteen months I've chaired our governance working group. We steward a dozen or so projects, the largest being a distributed storage engine that a great many companies depend on downstream. Our nine-member board meets monthly, and roughly two to four times a quarter somebody arrives with a proposal to write something into the charter so that it cannot be undone by an ordinary vote: a licence that may never be relaxed, a hard cap on how much of the endowment may be spent each year, a permanent ban on some category of contribution, a class of disputes handed irrevocably to an outside panel. Nobody on the board has legal or philosophical training, apart from one member who is a qualified solicitor and gives us one hour a month. Amending an entrenched clause currently takes an 85 per cent board vote plus ratification by the maintainers of the affected project, so a bad entrenchment is extremely expensive to reverse — and we have a live specimen: in 2019 we locked our flagship project's licence in a way that looked unambiguously wise at the time and that now blocks a merger with a compatible project which essentially everyone wants. I've been asked to bring a written framework to the next meeting, and I want that framework to be a procedure rather than an essay, because the people who will run it are tired engineers reading papers at the end of a working day.

  In preparation I've done a modest amount of reading, all of it shallow: Elster's *Ulysses and the Sirens*; the line of argument, which I believe Holmes developed under a name like the paradox of democracy, holding that entrenchment can make self-government possible rather than thwarting it; and the "dead hand" objection that the living ought not be ruled by choices made by people who are no longer around to bear the consequences. A colleague of mine, who is fond of taxonomies, proposes that we sort entrenchments by what they are binding us against — a future panic, a future ignorance, or a future change of heart — and adds a second axis, namely whether a given lock is meant to survive a change of mind or only a change of circumstance. I have no idea whether any of that is sound. Please treat it as raw material rather than as a constraint: keep it, repair it, or discard it, and tell me explicitly which distinctions genuinely matter once they have to be applied in a thirty-minute slot by non-specialists, and which are too fine-grained to survive the translation and should be dropped even though they are philosophically real.

  Before you write the procedure, spend a short while brainstorming on the page: sketch the principal ways an entrenchment goes wrong (the ones where the world changes, the ones where we were simply mistaken, the ones where the lock gets captured by whoever holds the amendment threshold, the ones where the lock changes behaviour in ways nobody predicted at the time of writing), and say what a usable procedure would need in order to catch each. Then give me the procedure itself as an ordered list of questions to ask of any proposal, with, for each question, a stated test for what counts as a sufficient answer, the branches on which it terminates in "do not entrench; handle this by ordinary policy", and the branches on which it must hand the matter to a named human being because the question is one of values rather than fact and no procedure can discharge it. Include the middle options short of full entrenchment — sunset clauses, periodic review triggers, delegations with a recall mechanism, deliberately narrow scope, lower thresholds — and say how to choose among them rather than listing them as a menu. Please mark plainly, at every step, which parts are genuine judgement calls wearing a procedural costume, and close with what the procedure cannot do and the conditions under which it will confidently produce a bad answer.

  Then run it on the following, showing your working at each step rather than only the verdict:

  - A proposal to entrench the copyleft licence of our flagship project at the current 85 per cent threshold, with wording to the effect that "no successor licence shall reduce the obligations of downstream redistributors". I should tell you that I am personally attached to this one and have argued for it in public, so if the procedure says no, or says "yes, but only with a review trigger", I would rather hear that from the procedure than from my colleagues.
  - A proposal to write a permanent charter-level ban on contributions substantially generated by machine coding tools, requested by a group of maintainers who expect to be outvoted within two years.
  - A proposal to hand all trademark and naming disputes to a standing external panel of three, with no recall mechanism and no term limits.
  - Two structural stress cases, briefly: a proposal to entrench the amendment threshold itself, so that lowering it requires meeting it, and a proposal in which a small minority of maintainers asks for a lock specifically to protect itself against a future majority that does not yet exist.

  You are, for this purpose, an expert in the philosophy of precommitment and constitutional design who has also sat through a great many real governance meetings and knows how such documents get misused in practice; please think carefully and reason before committing to a structure. Write the answer in British English, in plain prose suitable for circulation to a board with no specialist background, and do not give me a bibliography or a reading list — I have no time to chase references. Name a thinker, a book, or a technical concept only where doing so changes what my committee should actually do with a proposal next Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Staff Engineer at Lattice Foundation (mid-sized open-source infrastructure foundation, est. 2014). Chair of Governance Working Group.
      *   **Audience:** Nine-member Board (monthly meetings, tired engineers, no legal/philosophical training except one solicitor).
      *   **Task:** Create a written *procedure* (not an essay) for evaluating proposals to entrench clauses in the foundation's charter.
      *   **Context:** 18 months chairing governance. 12 projects (1 flagship distributed storage engine). Problem: 2-4 proposals per quarter to entrench clauses (licenses, spending caps, bans, dispute resolution). Current amendment threshold is high (85% board + maintainer ratification). One bad entrenchment exists (2019 license lock blocking a merger).
      *   **Input Material:** User has read Elster (*Ulysses and the Sirens*), Holmes (paradox of democracy/dead hand), colleague's taxonomy (panic/ignorance/change of heart vs. change of mind/circumstance).
      *   **Requirements:**
          1.  Brainstorm failure modes of entrenchment.
          2.  Define what a usable procedure needs to catch each.
          3.  Create the procedure as an ordered list of questions with tests, branches (reject/entrench/defer), and human judgement calls.
          4.  Include middle options (sunsets, reviews, etc.) and how to choose them.
          5.  Mark genuine judgement calls.
          6.  State limitations (what the procedure cannot do).
          7.  Run the procedure on 5 specific cases (License, AI contributions, Trademark panel, Threshold lock, Minority protection).
          8.  **Style:** British English, plain prose, no bibliography/reading list unless actionable, expert tone (philosophy + practical governance).

  2.  **Deconstruct the Philosophy & Taxonomy:**

      *   *Elster (Ulysses):* Precommitment is good if it protects against weakness of will (akrasia) but bad if it prevents adaptation to new information.
      *   *Holmes (Paradox of Democracy):* Some constraints enable democracy by protecting the conditions for it (e.g., free speech).
      *   *Dead Hand:* The past shouldn't rule the future indefinitely.
      *   *Colleague's Taxonomy:*
          *   Binding against: Panic, Ignorance, Change of Heart.
          *   Survival: Change of Mind vs. Change of Circumstance.
      *   *Assessment:* The colleague's taxonomy is actually quite useful for engineers. "Panic" maps to crisis response. "Ignorance" maps to technical debt/lack of info. "Change of Heart" maps to political shifts. "Circumstance" is key for tech (tech changes fast). "Mind" is key for values (values change slower).
      *   *Decision:* Keep the "Circumstance vs. Mind" distinction. Drop "Panic/Ignorance/Heart" as too abstract; fold them into "Risk Assessment."

  3.  **Brainstorming Failure Modes:**

      *   *World Changes:* Tech landscape shifts (e.g., license compatible then, not now).
      *   *Mistake:* We got the wording wrong or didn't foresee a loophole.
      *   *Capture:* The threshold holders (85%) become a cartel blocking necessary change.
      *   *Unintended Consequences:* The lock interacts badly with other rules (e.g., trademark panel vs. board authority).
      *   *Rigidity:* Unable to merge, acquire, or dissolve.
      *   *Procedure Needs:*
          *   A "Sunset" or "Review" mechanism for tech/circumstance locks.
          *   A "Safety Valve" for mistakes (e.g., super-majority + external audit).
          *   A "Scope Check" to ensure it doesn't capture too much.
          *   A "Values Check" to ensure it's not just protecting a current majority's preference.

  4.  **Drafting the Procedure (The Core):**

      *   Needs to be a checklist.
      *   Needs clear "Pass/Fail/Defer" criteria.
      *   Needs to distinguish between *Policy* (ordinary vote) and *Constitution* (entrenchment).
      *   *Key Question 1:* Is this a value or a tactic? (Values endure, tactics expire).
      *   *Key Question 2:* What is the specific risk we are preventing? (Must be specific, not vague).
      *   *Key Question 3:* What is the cost of being wrong? (Reversibility).
      *   *Key Question 4:* Is the mechanism proportional? (Don't use a nuke to kill a fly).
      *   *Middle Options:* Sunset clauses (time-bound), Review triggers (event-bound), Lower thresholds (e.g., 75% instead of 85%).
      *   *Judgement Calls:* Must explicitly flag where the Board must vote based on gut/ethics, not rules.

  5.  **Refining the Procedure for the Audience:**

      *   Tired engineers want binary switches where possible, but governance isn't binary.
      *   Use "Traffic Light" logic (Red/Amber/Green).
      *   Keep language concrete. Avoid "ontological" terms. Use "technical debt" analogies.
      *   British English spelling (programme, centre, licence vs license - *Note: In UK English, 'licence' is noun, 'license' is verb. In software context, 'license' is often standardised even in UK, but I should stick to UK convention for the foundation documents unless it's code. I will use 'licence' for the document, 'license' for the verb or software context if standard, but consistency is key. Let's stick to UK standard: Licence (noun), License (verb).*).

  6.  **Running the Cases:**

      *   *Case 1 (Flagship Licence):* User is attached. High risk of "Dead Hand." Tech compatibility changes. *Verdict:* Likely "Amber" -> Needs Review Trigger.
      *   *Case 2 (AI Ban):* Tech moves fast. "Change of Circumstance" high risk. Maintainers fear being outvoted (political). *Verdict:* Red (Policy, not Charter).
      *   *Case 3 (Trademark Panel):* Outsourcing authority. No recall. *Verdict:* Red (Accountability issue).
      *   *Case 4 (Threshold Lock):* Infinite regress. *Verdict:* Red (Self-referential paradox).
      *   *Case 5 (Minority Protection):* Veto power. *Verdict:* Amber (Needs narrow scope).

  7.  **Review against Constraints:**

      *   *British English:* Check spelling/grammar.
      *   *No Bibliography:* Mention Elster/Holmes only if actionable. (Decided to mention Elster's "Ulysses Pact" concept as a label for the procedure, but no reading list).
      *   *Plain Prose:* Avoid legalese.
      *   *Show Working:* Explicitly walk through the steps for the cases.
      *   *Judgement Calls:* Highlight them.
      *   *Limitations:* Explicit section at the end.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Initial thought:* Maybe suggest a "Constitutional Court." *Correction:* No, too heavy for a 9-person board. Stick to "External Reviewer" or "Maintainer Ratification."
      *   *Initial thought:* Use the colleague's taxonomy directly. *Correction:* It's a bit abstract. Translate it into "Risk Type."
      *   *Tone Check:* Ensure I don't sound condescending to the board. They are smart engineers, just time-poor and non-specialists in *governance*.
      *   *The "License" spelling:* In UK English, noun is 'licence', verb is 'license'. Software industry often uses 'license' for both. I will use 'licence' for the legal instrument to be precise, as this is a governance doc.
      *   *The "User Attachment":* The user admits bias on Case 1. The procedure must be robust enough to potentially reject their baby. I need to make sure the procedure doesn't just validate their bias.
      *   *The "Dead Hand":* Make sure the procedure addresses the 2019 mistake specifically (the "Legacy Lock" problem).

  9.  **Final Polish:**

      *   Structure: Brainstorm -> Procedure -> Application -> Limitations.
      *   Ensure the "Middle Options" section explains *how* to choose (e.g., if uncertainty is high, choose Sunset).
      *   Check the "Judgement Call" markers.

  *(Self-Correction on "License" vs "Licence")*: The prompt uses "licence" (noun) and "license" (verb) inconsistently ("licence that may never be relaxed", "licence in a way"). I will standardise to British English convention: Licence (noun), License (verb).

  *(Self-Correction on Tone)*: The prompt asks for "plain prose suitable for circulation." It needs to look like a memo or a handout.

