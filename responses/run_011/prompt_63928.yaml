answer: |-
  **To:** The Board of Directors, Lattice Foundation
  **From:** Chair, Governance Working Group
  **Date:** 24 May 2024
  **Subject:** Procedure for Evaluating Charter Entrenchment Proposals

  ### 1. Preliminary Analysis: How Entrenchments Fail

  Before adopting the procedure below, it is useful to agree on *why* we are doing this. We are not trying to stop good ideas; we are trying to stop permanent mistakes. Based on our history (specifically the 2019 licence lock) and general governance theory, entrenchments typically fail in four ways:

  1.  **The World Moves (Technical Obsolescence):** The lock assumes a technical reality that changes. *Example:* A licence clause that made sense when storage was expensive becomes a blocker when storage is cheap and the merger landscape shifts.
      *   *Procedure Requirement:* Must distinguish between *values* (which endure) and *mechanisms* (which expire).
  2.  **The Drafting Was Flawed (Unintended Consequences):** The wording captures more than intended or interacts badly with other rules.
      *   *Procedure Requirement:* Must require a "scope test" to ensure the lock is narrow.
  3.  **The Threshold Becomes a Cartel (Capture):** The group required to unlock the clause (e.g., 85% of the Board) becomes the very group benefiting from the lock, making reversal impossible even when everyone agrees it is broken.
      *   *Procedure Requirement:* Must prevent self-referential locks and require external ratification for reversal.
  4.  **The Panic Was Temporary (Akrasia):** We locked a rule to stop ourselves doing something rash in a crisis, but the crisis passed and the rule remained.
      *   *Procedure Requirement:* Must require a "cooling-off" period or sunset clause for crisis-driven rules.

  **Note on Taxonomies:** Your colleague's distinction between binding against *panic/ignorance* versus *change of heart* is sound in theory but too abstract for a thirty-minute board slot. We will translate this into a concrete test: **Is this protecting a Principle or a Preference?** Principles (e.g., "code must remain open") survive entrenchment; Preferences (e.g., "we prefer this specific licence version") do not.

  ---

  ### 2. The Entrenchment Evaluation Procedure

  This procedure is a decision tree. For any proposal to amend the Charter with an entrenched clause (requiring >50% vote or special ratification to reverse), the proposer must answer the following five questions in order.

  **Notation:**
  *   🛑 **STOP:** Do not entrench. Handle via ordinary policy or working group decision.
  *   ⚠️ **CAUTION:** Entrenchment possible only with mitigation (sunset, review, or lower threshold).
  *   ✅ **PROCEED:** Entrenchment permissible (subject to final vote).
  *   👤 **JUDGEMENT:** This question cannot be answered by rules; it requires a Board vote based on values.

  #### Question 1: The Principle vs. Preference Test
  *Does this clause protect a fundamental value of the Foundation, or does it encode a specific technical or strategic preference?*
  *   **Test:** Ask "If the technology changed completely tomorrow, would we still want this rule?"
      *   If **Yes**: It is likely a Principle. (Proceed to Q2).
      *   If **No**: It is a Preference. 🛑 **STOP.** Handle via ordinary policy. Preferences age into technical debt.
  *   **Mitigation:** If it is a Preference but critical for stability, propose a **Sunset Clause** (auto-expires in 3 years) instead of permanent entrenchment.

  #### Question 2: The Reversibility Cost Test
  *If this entrenchment turns out to be a mistake, how expensive is it to fix?*
  *   **Test:** Estimate the "Exit Cost."
      *   **Low Cost** (e.g., spending cap adjustment): ✅ **PROCEED** with standard entrenchment.
      *   **High Cost** (e.g., licence change, merger blocker, dissolving a project): ⚠️ **CAUTION.** Requires a **Review Trigger**.
  *   **Review Trigger Definition:** A mandatory governance review every 24 months, or upon a specific event (e.g., "if a merger is proposed"), where the clause *must* be reaffirmed or it lapses to ordinary policy.
  *   **Judgement Call:** 👤 The Board must decide what counts as "High Cost." This is not factual; it is risk appetite.

  #### Question 3: The Scope Test
  *Is the lock narrowly tailored to the specific risk, or does it sweep broadly?*
  *   **Test:** Can you describe the prohibition in one sentence without using words like "substantially," "category," or "related"?
      *   If **Yes** (Narrow): ✅ **PROCEED.**
      *   If **No** (Broad): ⚠️ **CAUTION.** Requires **Narrowing**.
  *   **Mitigation:** Replace broad bans with specific prohibitions. Instead of "no AI tools," use "no code generated by tools that do not permit copyright attribution."
  *   **Judgement Call:** 👤 Determining "narrow enough" is a legal/ethical judgement, not a mathematical one. The Solicitor must sign off on this step.

  #### Question 4: The Capture Test
  *Does this entrenchment make it harder to remove the people who are voting to entrench it?*
  *   **Test:** If the clause passes, does it increase the power of the current majority (or minority) to block future changes to their own status?
      *   If **Yes**: 🛑 **STOP.** This is self-dealing.
      *   If **No** (e.g., it binds everyone equally, including the proposers): ✅ **PROCEED.**
  *   **Special Rule:** No clause may entrench the Amendment Threshold itself (see Case 4 below). This creates an infinite regress.

  #### Question 5: The Accountability Test
  *Does this clause remove authority from the Board or Maintainers without a recall mechanism?*
  *   **Test:** Does it delegate power to an external body (panel, auditor, third party)?
      *   If **Yes**: ⚠️ **CAUTION.** Requires **Recall Mechanism**.
      *   If **No**: ✅ **PROCEED.**
  *   **Mitigation:** Any external panel must have term limits and be recallable by a super-majority (e.g., 75%) of the Board. Permanent delegation of sovereign authority is inadvisable.

  ---

  ### 3. Choosing Middle Options

  If a proposal triggers a ⚠️ **CAUTION**, do not simply reject it. Choose a mitigation based on the *source of uncertainty*:

  1.  **Uncertainty about the Future (Tech/Market):** Use a **Sunset Clause**. The rule expires automatically unless renewed. This solves the "Dead Hand" problem.
  2.  **Uncertainty about the Wording:** Use a **Review Trigger**. The rule stays, but must be explicitly reviewed if a specific event occurs (e.g., "upon receipt of a merger offer").
  3.  **Uncertainty about Consensus:** Use a **Lower Threshold**. Instead of 85% + Maintainer Ratification, require 75% Board vote only. This makes reversal difficult but not impossible.
  4.  **Uncertainty about Authority:** Use **Delegation with Recall**. Give power to a panel, but keep the leash short (term limits).

  ---

  ### 4. Limitations of This Procedure

  **What this procedure cannot do:**
  *   **It cannot predict the future.** It only assesses the *risk* of prediction failure.
  *   **It cannot resolve value conflicts.** If the Board is split 50/50 on whether "AI contributions" are ethical, this procedure will not solve it. It will only tell you whether entrenching that view is structurally safe.
  *   **It cannot fix bad drafting.** It flags broad scope, but the Solicitor must still write the text.

  **When this procedure will confidently produce a bad answer:**
  *   **Existential Crisis:** If the Foundation is facing immediate dissolution, the "Reversibility Cost" test may be too slow. In emergencies, suspend this procedure.
  *   **Hostile Takeover:** If a bad actor gains 85% of the Board, they can use this procedure to legitimize a capture. This procedure assumes good faith actors.

  **Genuine Judgement Calls:**
  I have marked these with 👤 in the text above. These are points where you, the Board, must vote based on your conscience and strategic vision. No checklist can replace the responsibility of governance.

  ---

  ### 5. Application to Current Proposals

  Below is the working for the five live proposals, applying the procedure strictly.

  #### Case 1: Entrenching the Flagship Copyleft Licence
  *Proposal:* Lock licence at 85% threshold; "no successor licence shall reduce obligations."
  *Proposer:* Chair (You).

  *   **Q1 (Principle vs. Preference):** Is open source a principle? Yes. Is *this specific wording* a preference? Likely Yes. Technology and compatibility landscapes change (as seen in 2019).
      *   *Result:* ⚠️ **CAUTION.**
  *   **Q2 (Reversibility Cost):** High. As noted, this blocked a merger.
      *   *Mitigation:* Requires a **Review Trigger**.
  *   **Q3 (Scope):** "Reduce obligations" is broad. Does it prevent optimising legal text?
      *   *Mitigation:* Requires **Narrowing** by Solicitor.
  *   **Q4 (Capture):** Does not increase Board power.
      *   *Result:* ✅ **PROCEED.**
  *   **Q5 (Accountability):** N/A.
  *   **Verdict:** **Do not entrench permanently.** Entrench with a **Review Trigger** (e.g., "must be reaffirmed every 3 years" or "upon any merger inquiry").
  *   *Note to Chair:* The procedure protects you from your own attachment. A review trigger allows you to keep the licence strong today without handcuffing the Foundation in 2029.

  #### Case 2: Ban on Machine-Generated Contributions
  *Proposal:* Permanent charter-level ban on code substantially generated by AI.
  *Proposer:* Group of Maintainers (fear being outvoted).

  *   **Q1 (Principle vs. Preference):** Is this a principle or a technical preference? AI tooling is a technology. In 5 years, "AI" may be the compiler.
      *   *Result:* 🛑 **STOP.** This is a Preference/Technical Standard.
  *   **Q2 (Reversibility Cost):** High (blocks future workflows).
  *   **Q3 (Scope):** "Substantially generated" is legally vague.
      *   *Result:* 🛑 **STOP.**
  *   **Verdict:** **Reject Entrenchment.** Handle via **Ordinary Policy** (Contributor License Agreement or Project Guidelines). These can be updated by Maintainers as tools evolve. Entrenching this would be the 2019 mistake repeated.

  #### Case 3: External Trademark Panel
  *Proposal:* Hand all trademark disputes to an external panel of three. No recall, no term limits.
  *Proposer:* Legal/Compliance Lead.

  *   **Q1 (Principle vs. Preference):** Dispute resolution mechanism is a Preference/Process.
      *   *Result:* ⚠️ **CAUTION.**
  *   **Q2 (Reversibility Cost):** High (hard to remove a panel once embedded).
  *   **Q3 (Scope):** "All disputes" is broad.
  *   **Q4 (Capture):** Neutral.
  *   **Q5 (Accountability):** "No recall, no term limits."
      *   *Result:* 🛑 **STOP.** This violates the Accountability Test.
  *   **Verdict:** **Reject as written.** Permissible only with **Recall Mechanism** and **Term Limits** (e.g., 3-year terms, recallable by 75% Board vote). You cannot outsource sovereign authority indefinitely.

  #### Case 4: Entrenching the Amendment Threshold
  *Proposal:* To lower the 85% threshold, you must first achieve 85%.
  *Proposer:* Unknown (Structural).

  *   **Q1 (Principle vs. Preference):** Process rule.
  *   **Q4 (Capture):** This is the definition of Capture. It creates an infinite regress (to change the lock, you need the key, but the key is locked).
      *   *Result:* 🛑 **STOP.**
  *   **Verdict:** **Reject.** This creates a "constitutional suicide" pact. If the threshold is wrong, you must be able to fix it without meeting the threshold. Standard practice is to allow a higher threshold (e.g., 90% or unanimous vote) to lower the standard threshold.

  #### Case 5: Minority Maintainer Protection
  *Proposal:* A small minority of maintainers asks for a lock to protect against a future majority.
  *Proposer:* Minority Maintainer Group.

  *   **Q1 (Principle vs. Preference):** Protecting minority rights is a Principle of democratic governance.
      *   *Result:* ✅ **PROCEED.**
  *   **Q2 (Reversibility Cost):** Medium.
  *   **Q3 (Scope):** Must be narrow. Does it give them a veto on *everything* or just *their project*?
      *   *Mitigation:* Must be **Narrowed** to affect only their specific project's governance, not the Foundation.
  *   **Q4 (Capture):** Risk of minority tyranny.
      *   *Mitigation:* Use **Lower Threshold** for reversal (e.g., 75% Board + Mediation) rather than a hard veto.
  *   **Verdict:** **Amber.** Permissible if **Narrowly Scoped** to the specific project and includes a **Mediation Step** before the lock engages. Do not grant a blanket veto.

  ---

  ### 6. Closing Advice for the Board

  We are engineers. We know that hard-coding constants leads to bugs when the environment changes. Governance is no different.

  The 2019 licence lock was a "hard-coded constant" in our Charter. It worked for the environment of 2019. It failed in 2024. This procedure is not designed to stop you from making rules; it is designed to stop you from hard-coding constants where you should be using variables.

  When you meet next Tuesday, I ask that you treat this procedure as a linter for our Constitution. If a proposal throws a warning, do not ignore it. Fix the code.

  **Action Required:**
  Please review the "Judgement Call" markers. If you are uncomfortable making those calls without external advice, we will budget for one hour of external constitutional counsel at the next quarterly review. For now, this procedure is sufficient to filter the immediate backlog.
