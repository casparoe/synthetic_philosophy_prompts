answer: |-
  **Mark: 62/100 (Upper Second Class)**

  ***

  ### Student Feedback (Paste-ready)

  **Strengths**
  *   **Hardin's Structure:** You reconstruct Hardin's logic clearly, particularly the mechanism of privatised gain versus socialised cost. Your explanation of why appeals to conscience are "self-eliminating" is precise and demonstrates a strong grasp of the textual argument.
  *   **Ostrom's Principles:** You list the design principles accurately and concisely. Connecting them to specific case studies (Swiss Alps, Valencia) shows good recall under closed-book conditions.
  *   **Nuanced Conclusion:** Your final paragraph is the strongest part of the essay. Acknowledging that Ostrom's solutions may not scale to global problems (like the atmosphere) prevents your critique from becoming naive. This shows you are thinking critically about the limits of the theory, not just repeating it.

  **Areas for Improvement**
  *   **Technical Taxonomy:** You state: *"The pasture is a public good in the strict sense, non-excludable and non-rival."* This is technically incorrect within the economics of property. A commons is a **common-pool resource**: it is non-excludable but **rivalrous**. If it were non-rival, one herdsman's use would not diminish another's, and there would be no tragedy. This distinction is fundamental to this module. While you describe the rivalry correctly later in the paragraph ("cost... is shared"), using the wrong classification undermines your technical precision.
  *   **Hardin's Target:** You argue: *"Hardin assumed the herdsmen were selfish maximisers, and that assumption is just false."* This is a defensible reading, but it risks simplifying Hardin. Hardin often argues that even if people *aren't* selfish, the institutional structure of open access creates incentives that *act as if* they are. By framing Ostrom's critique solely around human nature (reciprocity/shame), you might be overlooking her institutional argument: that communities build rules to change the incentive structure, not just rely on goodwill.
  *   **Depth of Refutation:** You conclude that Ostrom refutes Hardin "only because he made a claim about human nature." Consider whether Ostrom actually refutes Hardin or simply shows that "open access" (Hardin's target) is not the only alternative to "private property." She may be correcting a false dichotomy rather than refuting the logic of the tragedy itself.

  **Summary**
  This is a sophisticated answer with a clear argumentative arc. The error regarding public goods versus common-pool resources prevents this from reaching First-class territory, as precise terminology is essential when discussing property regimes. Correcting this taxonomy and sharpening the distinction between psychological and institutional critiques would significantly strengthen your work.

  ***

  ### TA Meta-Analysis (For your eyes only)

  **Settled vs. Disputed**
  *   **Settled (Student is Wrong):** The classification of the pasture. In standard political economy and property theory, a commons is a *Common-Pool Resource* (rival, non-excludable). A *Public Good* is non-rival and non-excludable (e.g., national defence, clean air *until* it becomes a sink). The student describes the rivalry correctly in the mechanism but labels it wrong. This is a factual error, not a interpretive dispute.
  *   **Disputed (Student is Defensible):** The interpretation of Hardin's core claim.
      *   *View A (Psychological):* Hardin assumes humans are selfish maximizers. Ostrom refutes this by showing humans are cooperative. (The student takes this view).
      *   *View B (Institutional):* Hardin assumes *open access* institutions. Ostrom shows *common property* institutions exist. She doesn't refute the tragedy of open access; she refutes the claim that private/state control are the *only* solutions.
      *   *Impact on Mark:* If you grade based on View A, the student's critique is stronger (64). If you grade based on View B, the student misses the institutional nuance (59). I have averaged this to 62, prioritizing the strength of their scale argument.

  **Charitable vs. Uncharitable Reading**
  *   **The "Non-Rival" Sentence:** *"The pasture is a public good in the strict sense, non-excludable and non-rival."*
      *   *Uncharitable:* The student does not understand the basic taxonomy of goods taught in this module.
      *   *Charitable:* The student knows the logic (rivalry causes the tragedy) but slipped on the standard economic label under time pressure, as evidenced by their correct description of the cost-sharing mechanism immediately after. I have marked based on the charitable reading but penalized the precision.

  **Mark Variance**
  *   **64/100:** If you accept the "Psychological Hardin" reading as the primary target for Ostrom.
  *   **59/100:** If you penalize heavily for the Public Good/CPR error and the missed institutional nuance in Ostrom's critique.
  *   **Final Decision:** 62. The essay demonstrates third-year critical thinking (especially on scale), which outweighs the terminology slip, but the slip prevents a 70+.

  ***

  ### The One Line
  Distinguish between 'open access' (no rules) and 'common property' (community rules) to sharpen your critique of Hardin.
