answer: |-
  The triad of practices you describe constitutes the core of the "Proof Paradox" in legal epistemology. To reconstruct the account of evidence presupposed by this combination, we must identify the implicit distinction courts draw between *statistical quantification*, *causal inference*, and *naked identification*.

  ### I. Reconstruction of the Presupposed Account

  The legal practice presupposes a **Causal-Attributional Account of Probability**. Under this account, statistical frequencies are not treated as uniform substitutes for knowledge. Their admissibility and weight depend on the *role* the probability plays in the narrative of the case: is it measuring a trait, proving a mechanism, or identifying an agent?

  **Principles of Reference-Class Selection:**

  1.  **Damages (Actuarial Tables):**
      *   **Principle:** *The Principle of Best Objective Estimate.*
      *   **Selection:** The reference class is the narrowest statistically significant group sharing the plaintiff's immutable characteristics (sex, race, occupation) relevant to the variable being measured (lifespan, earnings).
      *   **Function:** Statistics here are used to **quantify** a loss *after* liability is established. The plaintiff is treated as a random draw from the class solely for the purpose of economic calculation, not moral attribution.

  2.  **Toxic Exposure (Epidemiology):**
      *   **Principle:** *The Principle of Causal Sufficiency.*
      *   **Selection:** The reference class is the population exposed to the toxin versus the unexposed control group.
      *   **Function:** Statistics here are used to **infer a causal mechanism**. The "more than doubled risk" (Relative Risk > 2) requirement is a heuristic ensuring that, within the exposed class, it is more probable than not (>50%) that the disease was caused by the exposure rather than background noise. It treats the statistical correlation as evidence of a physical propensity inherent in the exposure.

  3.  **Naked Statistics (The Bus/ Gatecrasher Paradox):**
      *   **Principle:** *The Principle of Individualized Nexus.*
      *   **Selection:** The reference class is the set of potential agents (e.g., all bus companies operating on the road).
      *   **Function:** Statistics here are attempted to **identify the specific agent** responsible for a token event. Courts reject this because the statistical frequency (80% ownership) lacks a causal connection to the specific accident. It establishes a propensity of the *company's market share*, not a propensity of the *specific bus* to crash or the *specific driver* to be negligent.

  **Is there a Single Licensing Principle?**

  A single principle *can* be reconstructed to license the first two while excluding the third, though it rests on a metaphysical distinction rather than a purely mathematical one.

  **The Principle:** *Statistical evidence is sufficient when it measures a property or propensity inherent in the specific individual or token event (or the causal mechanism acting upon them), but insufficient when it measures only the frequency of potential agents in a population without a causal link to the token event.*

  *   **Damages:** The lifespan/earning capacity is treated as a property *of the plaintiff*. The table measures her specific (though unknown) attribute.
  *   **Toxic:** The epidemiological risk is treated as a property *of the exposure acting on the biology*. The statistic reveals a causal propensity relevant to her specific illness.
  *   **Bus:** The market share is a property *of the company*, not the accident. It does not describe a propensity of the specific bus to have struck the plaintiff.

  However, this practice borders on incoherence. Mathematically, the probability calculus is identical in all three cases (P(H|E) is derived from base rates). The distinction relies on the legal system's refusal to treat "naked" base rates as knowledge, demanding a "causal story" that statistics alone cannot provide.

  ### II. Strict Presuppositions vs. Good Fit

  To distinguish what the practice *requires* from what merely *accommodates* it:

  **Strict Presuppositions:**
  1.  **The Preponderance Threshold:** The system strictly presupposes that liability requires a probability of truth > 0.5. (This is explicit in the Toxic Tort "doubling rule," which maps RR>2 to P(Cause)>0.5).
  2.  **The Quantification Exception:** The system strictly presupposes that group frequencies *can* validly determine the rights of an individual in the context of *remedy*, even if they cannot determine *liability*.
  3.  **The Non-Identity of Frequency and Proof:** The system strictly presupposes that high probability (e.g., 80% in the Bus case) is not equivalent to legal proof. There is a categorical gap between "probable" and "proven."

  **What Merely Fits Well:**
  1.  **Race/Sex Stratification:** Using race and sex in actuarial tables fits the "Best Objective Estimate" principle, but it is not strictly required by the logic of probability. It fits well with a frequentist view but conflicts with anti-discrimination norms.
  2.  **The "Doubling" Heuristic:** The requirement that risk be *more than doubled* fits the >0.5 threshold well, but it is a rough proxy. A strict probabilistic account might allow lower relative risks if background incidence is low enough to still yield P(Cause)>0.5.

  **Where the Practice is Underdetermined:**
  The practice is underdetermined regarding the *nature* of the probability involved. Three distinct philosophical camps can endorse the outcomes without agreeing on the underlying metaphysics:

  1.  **The Subjectivist (Bayesian):** Can endorse all three by arguing that rational *degree of belief* should not reach the >0.5 threshold for liability in the Bus case merely due to base rates, perhaps due to a prior penalty on naked statistics or a requirement for causal likelihood ratios. They view the probabilities as states of mind, not world-frequencies.
  2.  **The Objectivist (Frequentist/Propensity):** Can endorse the Toxic and Damages cases as measuring real physical propensities (biology, mortality) but reject the Bus case because bus ownership is not a *causal propensity* for the specific accident. There is no "chance" process linking ownership to the crash in the same way biology links toxin to disease.
  3.  **The Skeptic (Knowledge-Based):** Can endorse the Bus rejection by arguing that bare statistics do not produce *knowledge* (sensitivity/safety conditions are not met), while allowing Damages as a matter of *policy* (we must calculate something) rather than knowledge. They deny that any of these produce strict knowledge of the singular case, but allow some for pragmatic administration.

  ### III. The Bayesian Factfinder Scenario

  If the court replaces the current factfinder with an **avowedly Bayesian factfinder** who reports *nothing but a posterior probability* (e.g., "The probability of liability is 0.8"), the three practices would fare differently:

  **1. Naked Statistics (Bus Case): *Would Not Survive.***
  *   **Current Practice:** 80% probability $\rightarrow$ No Liability.
  *   **Bayesian Factfinder:** 80% probability $\rightarrow$ Reports "0.8".
  *   **Outcome:** The current rule (that 80% is *insufficient*) is an exclusionary rule of law, not an evidentiary finding. A pure Bayesian factfinder cannot implement this. To maintain the current outcome, the legal system would have to impose an artificial **Prior Probability Cap** (e.g., "In the absence of individualized evidence, the prior probability of liability is fixed at 0") or a **Legal Exclusion Rule** that prevents the Bayesian from updating on the base rate at all. The practice of "rejecting high probability" would vanish, replaced by a policy rule that overrides the Bayesian report.

  **2. Toxic Exposure (Causation): *Would Survive (Transformed).***
  *   **Current Practice:** Relative Risk > 2 $\rightarrow$ Inference of Causation.
  *   **Bayesian Factfinder:** Calculates P(Causation | Epidemiology + Specific Facts).
  *   **Outcome:** The "doubling rule" is essentially a heuristic for ensuring the posterior probability exceeds 0.5. A Bayesian factfinder would make this explicit. Instead of a binary "admissible/inadmissible" based on RR>2, the factfinder would report the specific posterior (e.g., "65% probability the toxin caused the disease"). The practice survives but becomes more granular; the "rule" becomes a calculation.

  **3. Damages (Actuarial): *Would Survive (Unchanged).***
  *   **Current Practice:** Use tables to calculate Expected Value.
  *   **Bayesian Factfinder:** Use tables as Likelihoods/Priors to estimate Expected Loss.
  *   **Outcome:** This practice is already compatible with Bayesian decision theory. The actuarial table provides the probability distribution for the loss variable. The Bayesian factfinder would simply integrate this distribution to find the expected utility (damages). No fundamental change is required.

  **Summary:**
  The "Naked Statistics" prohibition is the most fragile. It relies on a non-probabilistic normative constraint (the requirement for "individualized evidence") that a pure Bayesian factfinder, committed to reporting posterior probabilities derived from all available data (including base rates), cannot honor without external constraint. The Toxic and Damages practices are essentially applications of probabilistic reasoning that a Bayesian would formalize but not reject.
