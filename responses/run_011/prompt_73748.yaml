          *   *Task Requirement:* I need to say whether a single principle licenses it or if it's incoherent. I should argue for a nuanced "Causal/Modal" account that makes it coherent *functionally*, even if epistemologically tense. The distinction is between *risk allocation* (damages), *causal inference* (toxic), and *attribution of agency* (bus).

