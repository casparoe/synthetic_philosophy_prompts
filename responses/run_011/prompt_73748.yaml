      *   *Strict Presuppositions vs. Good Fit:*
          *   *Strict:* The law presupposes that probability > 0.5 is the threshold for liability (Preponderance). It presupposes that group frequencies *can* apply to individuals in some contexts (damages).
          *   *Good Fit:* The rejection of naked stats fits well with a "knowledge-based" account (no knowledge without causal story), but isn't strictly required by probability theory.
          *   *Underdetermination:* A Subjectivist (degree of belief) can accept all three (belief isn't high enough in Bus case due to lack of causal story). An Objectivist (chance) can accept all three (chance exists in toxic, not in bus ownership). A Skeptic (no bare stats) accepts the Bus ruling but might struggle with Actuarial tables (unless viewed as policy).

  5.  **The Bayesian Factfinder Analysis:**

      *   *The Setup:* A factfinder who *only* reports posterior probabilities (e.g., "There is an 80% chance the defendant is liable").
