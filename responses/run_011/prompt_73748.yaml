  2.  **Analyze the Three Scenarios (Legal & Philosophical Context):**

      *   *Scenario 1 (Actuarial Tables):* Courts accept group statistics to quantify *damages* once liability is established. This is about *quantification*, not *liability*. It assumes the individual is a random draw from the reference class for the purpose of calculation.
      *   *Scenario 2 (Toxic Torts):* Courts require "more than doubling of risk" (Relative Risk > 2) to infer specific causation from general epidemiology. This is a bridge from group probability to individual causation. It treats probability > 50% as sufficient for "more likely than not" (preponderance of evidence), *but* only if the statistical link is causal, not just correlational.
      *   *Scenario 3 (Naked Statistics/Blue Bus):* Courts reject bare base rates (80% ownership) to establish liability. This is the "Proof Paradox." Why is 80% bus ownership insufficient, but 80% eyewitness reliability (sometimes) sufficient? Or why is actuarial data okay for damages but not liability?

