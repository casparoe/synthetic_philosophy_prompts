answer: |-
  Subject: Re: The shape of the rule

  Dear friend,

  You have put your finger on a texture of institutional life that is everywhere once you see it, and frustratingly nameless. I understand why the usual suspects feel insufficient. Letter versus spirit implies a choice to ignore the spirit, whereas in your examples the actors are often sincerely trying to follow the rule as written, only to find the rule itself directs them away from the purpose. Gaming a metric or Goodhart's Law is the closest neighbor, but that usually implies a quantitative target being optimized cynically. Your lying example is qualitative and moral, not just numerical, and the hospital example feels less like cynical gaming and more like a structural inevitability of the definition itself. Loopholes suggest a drafting error, but this happens even with perfectly drafted rules because language itself cannot perfectly capture intent. Self-defeating rules is too broad, covering everything from prohibition creating black markets to safety gear encouraging riskier behavior.

  Since nothing existing quite captures the migration of the vice into the shell of the virtue, I will coin a term for you. Let us call this formal hollowing. It occurs when a rule polices a surface feature so strictly that the underlying behavior mutates to preserve the surface feature while abandoning the function. The rule does not fail; it succeeds so well at measuring the form that the substance evaporates. The hollowing is complete when the compliance data becomes inversely correlated with the actual safety or truthfulness of the system.

  To answer your specific conditions, the rule does not need to be absolute, only strict enough that the penalty for breaking the form exceeds the cost of mutating the behavior. It creates a pressure gradient where the path of least resistance is through the semantic gaps rather than over the moral wall. The substitute behavior does not need to be as bad as the original, only bad enough to negate the intended benefit. If the rule against lying reduces blunt falsehoods but increases sophisticated misleading truths, the net trust might remain static or decline because the deception is now harder to detect. The danger of formal hollowing is not just that the bad behavior continues, but that it becomes immune to critique because it wears the armor of compliance.

  For an example that looks like formal hollowing but is not, consider malicious compliance. If a worker follows safety rules so literally that production stops, they are preserving both the form and the substance of safety, merely weaponizing the cost. The rule is working, even if the outcome is undesirable. That is not hollowing because the safety intent is actually met. For an example that is formal hollowing but does not look like it, consider academic publishing metrics. When universities require a certain number of publications for tenure, researchers begin salami-slicing their data into multiple thin papers. They are technically complying with the rule to publish research, and the numbers go up, but the substance of advancing knowledge declines because the incentive structure now rewards volume over insight. It looks like productivity, but it is hollowing.

  As for the character type you described, the person who never says a false thing and misleads everybody constantly, there are two terms that share the load. The historical term is a casuist, someone who uses clever but unsound reasoning to resolve moral problems, often to justify evasion. However, that describes the reasoning rather than the persona. The more precise linguistic term is a palterer. A palterer is someone who answers questions with true statements that are designed to create a false impression. While a liar says what is false, a palterer says what is true in a way that implies what is false. In a moral context, you might also call them a legalist, though that carries theological baggage. If you need a single word for the character who hides behind the shield of technical truth to practice deception, palterer is the most accurate existing label, though it lacks the institutional weight of the phenomenon you are seeing.

  I hope this gives you the vocabulary to name the shape you are seeing. It is a quiet corrosion, and naming it is the first step to designing rules that measure substance rather than form.

  Best regards,

  Your friend
