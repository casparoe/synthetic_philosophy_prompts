answer: |-
  The thesis I defend is this: the pessimist is right that something goes awry when we take moral verdicts on another's word, but has mislocated the defect. Nothing is wrong with the belief as such—the hearer may know what she is told, and may even come to understand it completely. What goes wrong is that, in accepting a bare verdict on authority, she installs another person's judgment in a position within her own practical reasoning that only her judgment can occupy. The failure is one of authorship rather than of knowledge or understanding. It tracks a distinction between verdict-testimony and reasons-testimony: being told that an act is wrong and accepting that on the speaker's say-so, versus being told why it is wrong, following the reasoning, and adopting the conclusion on the strength of considerations one has oneself taken in.

  Consider three cases. First, the redundant authority: a faculty member who has thought at length about an industry-funded research partnership and concluded it is exploitative, but who at the decisive meeting simply votes as her more senior colleague votes, telling herself his judgment is better than hers. She knows, she understands, she could give the explanation unaided, and yet her deference still looks like a quiet abdication. Second, the explained verdict: someone told not only that a practice is wrong but why, who follows the reasoning and accepts the conclusion. Nothing seems amiss here even though the belief is testimonial in origin. Third, the on-call resident: at three in the morning she has neither the time nor the background to work through a question about withdrawing treatment, accepts the attending's verdict, and means to think it through properly the following week.

  The understanding account sorts these cases badly. It must acquit the first, where the abilities are fully present, and indict the third, where they are absent. Yet intuitively, the first case is the most troubling, and the third is permissible. The authorship-based account sorts all three correctly. In the first case, the faculty member possesses the capacities for authorship but refuses to exercise them, substituting another's will for her own. In the second, she retains authorship by grasping the reasons herself. In the third, the resident treats the verdict as held in escrow rather than adopted outright; she accepts the directive for action now but reserves the judgment for later. The defect is not the lack of ability, but the permanent outsourcing of the seat of judgment.

  Four objections arise. First, the genealogical objection: nearly everyone's moral outlook begins in testimony. If adopting verdicts on authority is a defect in authorship, this view either convicts almost all of us or owes a developmental story about converting borrowed verdicts into one's own. The response is that childhood deference is provisional. A child accepts verdicts as placeholders until she develops the capacity to review them. The conversion does not collapse into the understanding account because it is not merely about acquiring abilities to explain or generalize; it is about taking responsibility for the verdict. One can understand a reason without owning it. Moral maturity is the transition from holding verdicts in escrow to signing them oneself.

  Second, the moral-progress objection: abolitionists and reformers have often had to defer to those who saw further than they did. Does the authorship view fetishise authenticity at the expense of getting things right? Can deferring to a morally better-informed other ever be required? It can, provided the deference is not a surrender of agency but a recognition of epistemic limitation. If I defer because I recognize my own reasoning is corrupted or immature, I am using my judgment to authorize the deference itself. The defect arises only when I treat the other's verdict as final without integrating it into my own practical identity. Correctness matters, but morality demands that I act on reasons I can endorse, even if that endorsement begins with trust in a guide.

  Third, the status objection: if the loss is only one of authenticity, the pessimist should downgrade the worry to something aesthetic or existential. If it is genuinely moral, explain in virtue of what. Is this a Kantian autonomy claim in disguise? It is akin to Kantian autonomy, but restricted to the moral domain. Morality is essentially practical; it governs what I do. To act morally is to act on principles I legislate for myself. Deferring on a matter of art criticism or legal interpretation does not carry the same weight because those domains do not essentially require my will to be the source of the norm. In morality, the authority of the reason over me depends on my recognition of it as binding. To bypass that recognition is to act heteronomously, which is a moral failure, not merely an aesthetic one.

  Fourth, the stability objection: any competent testifier offers reasons implicitly and any hearer can ask for them. Does the verdict/reasons distinction collapse? I defend the view that the authorship defect survives the giving of reasons whenever the hearer accepts those reasons only because the speaker says they are the reasons. If I accept your reasoning solely on your authority, without seeing the normative force of the premises myself, I have not truly adopted the reasons. I have merely adopted a more complex verdict. The distinction holds because there is a difference between being convinced by the force of an argument and being convinced by the status of the arguer. Only the former secures authorship.

  In conclusion, the positive criterion for permissible verdict-deference is this: deference is permissible when the verdict is held in escrow, accepted provisionally for the sake of action, with a committed intention to review the reasons oneself when circumstances allow. It is impermissible when the verdict is adopted as a final substitute for one's own judgment despite having the capacity to judge.

  The single most damaging concession this position must make is that there are emergencies where one must act on a bare verdict with no possibility of later review. In such cases, authorship is sacrificed for correctness. The view can live with this concession because moral ideals function as regulative principles. We are obligated to strive for authorship, but when the cost of doing so is catastrophic harm, the obligation to prevent harm overrides the obligation to author one's judgment. We regret the loss of authorship, but we do not deny the necessity of the action. This preserves the core claim: that authorship is the default requirement of moral agency, even if tragic circumstances sometimes force us to borrow another's eyes to see our duty.
