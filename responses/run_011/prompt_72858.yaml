answer: |-
  # DISPOSITION VERIFICATION PROTOCOL (DVP)
  **Document ID:** SAF-PROC-001
  **Authority:** Technical Authority, Life-Safety & Emergency Response
  **Purpose:** To validate claims that equipment possesses the disposition to operate under field conditions, distinguishing between *compliance with a test schedule* and *operational readiness*.

  ---

  ## PART 1: THE DECISION PROCEDURE

  **Instructions for the Technician:**
  Complete this procedure for every test protocol you design or review. Do not proceed to certification until all four Screening Gates are passed. If a Gate fails, you must either modify the test, downgrade the claim, or escalate to the Technical Authority.

  ### Step 1: Define the Claim
  State the disposition clearly: *"Item X will produce Response R when Field Stimulus S occurs."*
  *   **Constraint:** Do not use vague terms like "serviceable." Use physical outcomes (e.g., "Alarm sounds," "Valve closes," "Webbing holds 5kN").

  ### Step 2: Map the Stimulus Gap
  Compare the **Field Stimulus** (the real emergency) with the **Test Stimulus** (what you do during maintenance).
  *   **Action:** Record the physical differences (e.g., aerosol vs. smoke, static load vs. dynamic fall).
  *   **Rule:** If the Test Stimulus does not engage the same physical mechanism as the Field Stimulus, the evidence class is downgraded (see Taxonomy).

  ### Step 3: Screen the Four Failure Modes (In Order)
  You must explicitly check for these four errors. If any check fails, the test cannot support the claim without modification.

  1.  **Degradation (The Destructive Test):** Does performing the test weaken the item's ability to respond later?
      *   *Pass:* Test is non-invasive or restores original state.
      *   *Fail:* Test consumes life, fatigues material, or alters calibration.
      *   *Action:* If Fail, calculate life-loss. If life-loss > 1% per test, **STOP**. Recommend retirement, not testing.
  2.  **Masking (The Background Condition):** Are there conditions present during the test that would prevent a *good* item from working, or hide a *bad* item's failure?
      *   *Pass:* Test environment matches field environment (dust, temp, power mode).
      *   *Fail:* Test bypasses critical path (e.g., testing horn but not sensor), or environment is cleaner/easier than field.
      *   *Action:* If Fail, add environmental checks or change test method.
  3.  **Mimicry (The Extrinsic Support):** Can the item pass the test without having the disposition, because something else did the work?
      *   *Pass:* The item's internal mechanism provides the response.
      *   *Fail:* External power, controller logic, or technician intervention forces the pass.
      *   *Action:* If Fail, isolate the item from external aids during testing.
  4.  **Induction (The Finite List):** Does passing this specific test guarantee performance under *untested* variations of the stimulus?
      *   *Pass:* Mechanism is binary/robust (works or doesn't).
      *   *Fail:* Mechanism is sensitive to untested variables (e.g., smoke density, angle of fall).
      *   *Action:* If Fail, you cannot certify "Will Operate." You can only certify "Passed Test X." Downgrade claim.

  ### Step 4: Classify the Evidence
  Assign an Evidence Class based on Step 2 and 3.
  *   **Class A (Direct):** Test replicates Field Stimulus on the installed item. (High Confidence)
  *   **Class B (Surrogate):** Test measures the physical ground of the disposition (e.g., tensile strength, chamber cleanliness) but not the function. (Medium Confidence)
  *   **Class C (Derivative):** Test relies on batch sampling, calculation, or history. (Low Confidence)

  ### Step 5: Set Validity and Interval
  *   **Validity:** No claim is permanent. Assign a **Confidence Level** (High/Med/Low) and a **Validity Interval** (time until decay or risk makes the claim stale).
  *   **Interval Rule:** Retest interval = Min(Time to significant decay, Time to significant test-induced damage).
  *   **Handoff:** If Confidence is Low, or if Failure Mode 1 (Degradation) is active, file is escalated to Technical Authority for risk acceptance.

  ---

  ## PART 2: EVIDENCE TAXONOMY

  | Class | Definition | Inference Risk | Example |
  | :--- | :--- | :--- | :--- |
  | **A: Direct Manifestation** | The item is subjected to the Field Stimulus (or a functional equivalent) while installed, and produces Response R. | **Low.** Minimal gap between test and reality. | Flowing water through a sprinkler system; full-load generator start. |
  | **B: Surrogate Structure** | The test measures the physical properties that *ground* the disposition, without triggering the response. | **Medium.** Assumes structure guarantees function. Ignores assembly/installation errors. | Measuring webbing tensile strength; checking smoke chamber geometry; measuring battery impedance. |
  | **C: Derivative / Sample** | Evidence is drawn from a different population (batch mates) or mathematical model. | **High.** Assumes installed item matches sample/model. Ignores in-situ degradation. | Destructive test of spare sprinkler heads; manufacturer's MTBF calculations. |

  ---

  ## PART 3: CORE PROTOCOL TABLE (TEMPLATE)

  *Technicians must complete one table per equipment type/protocol.*

  | Claim Being Certified | Field Stimulus | Test Stimulus | Failure Mode Exposure & Guard | Falsification Condition | Evidence Class | Retest Interval & Justification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | *[Item] will [Response] when [Stimulus]* | *[Real world trigger]* | *[Maintenance action]* | *[Mode 1-4 identified. How is it mitigated?]* | *[What observation kills the claim?]* | *[A, B, or C]* | *[Time period. Why this length?]* |

  ---

  ## PART 4: APPLICATION TO EXISTING PROTOCOLS

  The following three tables apply the DVP to your current schedules. **Note the findings in bold.**

  ### PROTOCOL 1: Photoelectric Smoke Detectors (Corridor)

  | Claim Being Certified | Field Stimulus | Test Stimulus | Failure Mode Exposure & Guard | Falsification Condition | Evidence Class | Retest Interval & Justification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Head will alarm when smouldering combustion products enter chamber.** | **Smouldering aerosol (particulate obscuration).** | **Push-button actuation.** | **Mode 3 (Mimicry): HIGH RISK.** Button bypasses sensing chamber, driving horn directly via loop controller. **Guard:** None in current protocol. <br> **Mode 2 (Masking): HIGH RISK.** Dust/contamination in chamber prevents sensing but not button press. **Guard:** None. | **Head alarms on button, fails on aerosol.** | **Class C (Derivative).** Tests electronics only, infers sensing capability. | **Monthly.** **Justification:** Insufficient for certification. **Action:** Add annual aerosol challenge (Class A). Quarterly signature **cannot be warranted** on button test alone. |

  **Verdict:** **AGAINST CURRENT PRACTICE.** The monthly test certifies "The horn and loop connection work," not "The head detects smoke." The quarterly signature claiming "will operate when required" is false.
  **Required Change:** Retain monthly button test for electronics. Add annual aerosol test for sensing chamber. Downgrade quarterly claim to "Electronics verified; Sensing chamber unverified since last aerosol test."

  ### PROTOCOL 2: Sprinkler Heads (Lot Sample)

  | Claim Being Certified | Field Stimulus | Test Stimulus | Failure Mode Exposure & Guard | Falsification Condition | Evidence Class | Retest Interval & Justification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Installed heads will fuse and discharge water at rated temp.** | **Ambient heat from fire (installed environment).** | **Heat application to spare batch samples (destructive).** | **Mode 4 (Induction): HIGH RISK.** Sample history (warehouse storage) ≠ Installed history (corrosion, vibration, paint). **Guard:** Visual inspection of installed heads. <br> **Mode 1 (Degradation):** N/A for installed heads (they are not tested). | **Sample passes, installed head fails due to corrosion/paint.** | **Class C (Sample) for fusion; Class B (Surrogate) for installed.** | **5 Years (Sample) / 1 Year (Visual).** **Justification:** Sample licenses manufacturing consistency only. Installed heads require visual surrogate (corrosion/paint check). |

  **Verdict:** **PARTIAL.** The sample test licenses the *design*, not the *installation*. You cannot certify the installed heads based on the sample alone.
  **Required Change:** The protocol must explicitly state that sample testing validates the *batch*, while annual visual inspection validates the *installed condition*. The quarterly signature must be qualified: "Batch integrity verified; Installed condition visually confirmed."

  ### PROTOCOL 3: Fall-Arrest Lanyards (In-Service Proof Load)

  | Claim Being Certified | Field Stimulus | Test Stimulus | Failure Mode Exposure & Guard | Falsification Condition | Evidence Class | Retest Interval & Justification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Lanyard will arrest a live fall without failure.** | **Dynamic shock load (human fall).** | **Static proof load (tensile machine).** | **Mode 1 (Degradation): CRITICAL.** Proof loading induces micro-fatigue in fibers/webbing, reducing residual strength. **Guard:** None possible; physics of materials. <br> **Mode 2 (Masking):** Static load does not replicate shock dynamics. | **Lanyard passes test, fails later due to test-induced fatigue.** | **Class B (Surrogate).** Measures strength, degrades life. | **STOP.** **Justification:** Test reduces the disposition it measures. **Retest Interval:** N/A. **Recommendation:** Retire at fixed calendar life (e.g., 5 years) regardless of test. |

  **Verdict:** **AGAINST CURRENT PRACTICE.** **Stop testing immediately.** The test consumes the safety margin.
  **Required Change:** Abandon proof-load testing for in-service lanyards. Implement mandatory retirement date based on manufacture date. The budget allocated for testing hours must be reallocated to replacement procurement.

  ---

  ## PART 5: LIMITATIONS AND THE QUALITY MANAGER

  ### What This Procedure Cannot Do
  1.  **It cannot eliminate uncertainty.** No finite test suite guarantees performance under *all* conditions (Failure Mode 4). The DVP quantifies this gap; it does not close it.
  2.  **It cannot license "Zero Risk."** If the Evidence Class is C (Derivative) or B (Surrogate), there is a non-zero probability of failure. The procedure forces you to state this, not hide it.
  3.  **It cannot validate obsolete technology.** If the mechanism is known to degrade unpredictably (e.g., certain chemical fire suppressants), the procedure will force a "Cannot be Certified" outcome regardless of test passing. At this point, the instrument must be abandoned in favour of replacement or redundancy.

  ### Response to the Quality Manager's Extensional Definition
  The Quality Manager proposes: *"An item is serviceable just in case it responds correctly to every stimulus on the approved test list."*

  **Why this is incoherent:**
  This definition conflates **Verification** (did it pass the test?) with **Validation** (does it do the job?).
  1.  **The Gap:** The set of "Approved Tests" is a proper subset of the set of "Required Conditions." As shown in Protocol 1 (Smoke Detector), the intersection of these sets can be empty regarding the critical function (sensing). An item can satisfy the Manager's definition (passes button test) while failing the Technical Authority's requirement (detects fire).
  2.  **The Consequence:** Adopting this definition makes the accreditation signature a lie. It asserts "Will operate when required" when the evidence only supports "Passed administrative check."
  3.  **The Entitlement:** Under the DVP, our existing tests are entitled to support only the following claims:
      *   **Smoke Button Test:** "The supervisory circuit and horn are energized." (Not "Detects Smoke").
      *   **Sprinkler Sample:** "The manufacturing batch meets spec." (Not "Installed heads will fuse").
      *   **Lanyard Proof Load:** "The webbing held X load at T time." (Not "Will arrest a fall").

  **Instruction to Quality Manager:**
  We must rewrite the schedule assertions to match the Evidence Class.
  *   **Old:** "Certified serviceable and will operate."
  *   **New:** "Certified compliant with Maintenance Schedule [ID]. Operational readiness inferred with [High/Med/Low] confidence based on [Direct/Surrogate/Sample] evidence."

  This shifts the liability from a guarantee of outcome (which we cannot mathematically support) to a guarantee of process (which we can control), while explicitly flagging where the process fails to guarantee the outcome. This is the only defensible position for a Technical Authority.
