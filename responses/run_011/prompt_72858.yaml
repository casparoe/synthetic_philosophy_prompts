      *   The core issue is the gap between *manifestation* (testing) and *disposition* (the inherent capability to function).
      *   The User knows the literature on dispositions (conditional analysis problems).
      *   The procedure needs to bridge the gap between "passed test T" and "has disposition D."
      *   The four failure modes map to standard philosophical counterexamples to conditional analysis of dispositions (finks, masks, mimics, and the problem of induction/ceteris paribus).
      *   *Mode 1 (Destructive):* Testing destroys the disposition (e.g., proof loading).
      *   *Mode 2 (Masking):* Background conditions prevent manifestation (e.g., dust, isolate mode).
      *   *Mode 3 (Mimicry/Extrinsic):* Item passes without having the disposition (e.g., external drive).
      *   *Mode 4 (Finite List):* Induction problem (tested S != all possible S).

