      *   **Move 5 (He):** Argument for Regulation, not Prohibition. Unenforceable clauses can be fixed. Unpaid surrogacy exists, so the issue is payment, not the act. Paying *more* for risk should be better, not worse.
      *   **Move 6 (She):** Payment changes damage absorption (Relationship vs. Market). His regulations admit the contract is hollow (can't enforce handover), making it a "gift with a fee" designed for recruitment of the vulnerable.

  3.  **Evaluate Each Move (Step-by-Step):**

      *   *Move 1:* Strong libertarian/autonomy argument. The "exporting risk" point is empirically strong (tourism happens regardless). *Verdict:* He has a strong opening on autonomy and unintended consequences.
      *   *Move 2:* Classic commodification objection (Sandel/Anderson style). The "coerced consent" point is the core feminist/socialist critique. *Verdict:* She successfully shifts the frame from liberty to market morality.
      *   *Move 3:* The "Dangerous Labor" analogy. This is a standard liberal counter. *Verdict:* Logically consistent, but relies on equating pregnancy with labor, which is contested. He wins on consistency, she wins on distinction.
      *   *Move 4:* The "Specific Performance" argument. This is legally astute. You can't force a woman to give up a baby. This creates a legal vacuum filled by power dynamics. *Verdict:* She lands a heavy blow here. It exposes a structural flaw in surrogacy contracts specifically.
