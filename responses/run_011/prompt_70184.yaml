answer: |-
  # Final Examination: Formal Guarantees and Risk Protocols
  **Time Allowed:** 60 Minutes  
  **Total Marks:** 25  
  **Instructions:** Closed book. Answer the question below. Use only the notation provided in the stem.

  ### Question 1

  Consider the following course definition: a policy $\pi$ is **$(\epsilon, \delta)$-benign** relative to a task distribution $D$ just in case:
  $$ \Pr_{\tau \sim D}[ \text{harm}(\pi, \tau) > \epsilon ] \le \delta $$
  A candidate system, **"Verity-4"**, was evaluated on the **Everyday Tasks Battery (ETB)**: a fixed set of 2,000 curated household and office tasks. The auditing firm's press release states the system *"is safe: it behaves benignly with probability at least 98%."*

  Recall two assumptions from Week 5: the **Coverage Assumption** ($D$ is stationary and does not depend on $\pi$'s behaviour) and **Bounded Harm** ($\text{harm} \le 1$ always).

  Last year, a student argued: *"If $\delta$ is small enough, average-case and worst-case come apart by nothing worth caring about, since the failures live on a set of tiny measure, and you can ignore measure-zero sets."*

  **Answer the following:**

  **(a)** Write out with explicit quantifiers the claim the press release actually licenses (based on the definition above) and the claim users typically hear. Name three distinct gaps between these formal and informal statements.  
  **(b)** Show why the gap wherein Verity-4 shifts which tasks it ends up facing (violating the Coverage Assumption) cannot be closed by running the ETB more times or making the battery larger.  
  **(c)** State what extra assumptions are required to move from the per-task probabilistic guarantee to a guarantee uniform across all 2,000 ETB tasks. Explain why the size of the battery ($N=2,000$) does less work than students assume regarding the space of all possible tasks.  
  **(d)** The lab has put dozens of candidate systems through the same ETB and retrains on whatever fails. Explain why the "98%" figure no longer carries its intended interpretation, focusing on how adaptive reuse of a fixed benchmark changes the statistical meaning.  
  **(e)** Critique the quoted student answer. Specifically address the measure-zero conflation, the epistemic problem of not knowing *where* the bad set is, and the consequences if the Bounded Harm assumption fails.

  ***

  ## Model Answer

  **(a)** The press release licenses the claim: $\exists \pi$ (Verity-4) such that $\Pr_{\tau \sim D_{ETB}}[ \text{harm}(\pi, \tau) > \epsilon ] \le 0.02$. Users hear: $\forall \tau \in \text{Deployment}, \text{harm}(\pi, \tau) \le \epsilon$. Three gaps exist: (1) **Distribution Shift**: $D_{ETB} \neq D_{Deployment}$; (2) **Quantifier Order**: The license allows failures on 2% of tasks, while users expect 0% failures; (3) **Threshold Ambiguity**: The release does not specify $\epsilon$, leaving the severity of "benign" undefined.

  **(b)** If Verity-4 influences which tasks arise (e.g., by altering user behaviour), $D$ becomes a function $D(\pi)$. The Coverage Assumption fails. The ETB samples from $D_{static}$. No amount of sampling from $D_{static}$ reduces the divergence between $D_{static}$ and $D(\pi)$. Increasing $N$ reduces variance in the estimate of risk under $D_{static}$, but bias relative to $D(\pi)$ remains infinite. You are precisely measuring the wrong distribution.

  **(c)** To guarantee uniformity over the 2,000 tasks ($\forall \tau \in \text{ETB}, \text{harm} \le \epsilon$), one assumes the empirical risk is zero, not just $\le \delta$. However, the battery size $N=2,000$ is negligible relative to the task space $\mathcal{T}$. Students assume $N$ provides coverage of $\mathcal{T}$, but it only provides confidence over the sample. Unless $\mathcal{T}$ is finite and $|\mathcal{T}| \approx 2,000$, the battery is a drop in the ocean. The guarantee holds only for the test set, not the support of $D$.

  **(d)** Selecting $\pi$ based on ETB performance treats the ETB as a training set, not a test set. The "98%" reflects in-sample performance of the best-of-many candidates, not the generalization error of a fixed policy. This is selection bias. The probability bound $\delta$ assumes $\pi$ was fixed prior to seeing the sample. Adaptive retraining couples $\pi$ to the specific noise in the ETB, inflating the true failure rate on fresh tasks drawn from $D$.

  **(e)** The student conflates "low probability" with "irrelevant." In safety critical contexts, the bad set may have measure $\delta > 0$ but contain catastrophic outcomes. Even if measure-zero, we do not know the *location* of the bad set; deployment may target it specifically. Finally, if Bounded Harm fails, a single outlier with $\text{harm} \gg 1$ can dominate the expected loss, rendering the probability bound $\delta$ meaningless for risk assessment. Small $\delta$ does not bound worst-case impact if the tail is unbounded.

  ***

  ## Marking Scheme

  **Total Marks:** 25  
  **Pass Threshold:** 13/25 (Demonstrates basic competency in quantifier manipulation and risk logic).

  | Move | Marks | Required Content | Common Error |
  | :--- | :---: | :--- | :--- |
  | **(a) Quantifiers & Gaps** | 5 | Correctly distinguishes $\Pr[\dots] \le \delta$ from $\forall \tau$. Identifies 3 gaps (Distribution, Quantifier, Threshold). | Writing $\forall \tau$ in the formal claim, or failing to note $\epsilon$ is undefined in the press release. |
  | **(b) Distribution Shift** | 5 | Explains that sampling $D_{static}$ cannot estimate risk under $D(\pi)$. Bias vs. Variance distinction. | Arguing that larger $N$ eventually covers all tasks, or confusing shift with simple sampling noise. |
  | **(c) Uniformity & Size** | 5 | Notes need for zero empirical error. Explains $N=2,000 \ll |\mathcal{T}|$. Distinguishes sample confidence from space coverage. | Claiming a union bound over 2,000 tasks guarantees safety over the deployment distribution. |
  | **(d) Adaptive Reuse** | 5 | Identifies test-set contamination/selection bias. Notes $\pi$ is no longer independent of the benchmark. | Describing this as "overfitting" without explaining why it invalidates the probability bound interpretation. |
  | **(e) Student Critique** | 5 | Addresses location uncertainty (not just size). Explains unbounded harm breaks the risk model. | Accepting the measure-zero argument as valid for discrete deployment contexts. |

  **Distinction Criteria (A vs. B):**
  A-grade answers treat the formalism as a structural constraint: they explicitly show how the dependency between $\pi$ and $D$ breaks the sampling logic in (b) and how the selection process breaks the independence assumption in (d). B-grade answers correctly define the terms and identify that "shift is bad" or "overfitting is bad," but rely on intuitive hand-waving rather than manipulating the definitions of independence and stationarity provided in the stem. A students notice that the *order* of operations (selecting $\pi$ vs. drawing $\tau$) determines the validity of the bound; B students treat the bound as a property of the system alone.
