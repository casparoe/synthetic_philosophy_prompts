answer: |-
  Thank you for coming. For those of you who knew [Name] well, you know that standing here, talking about "eternal rest" or "watching over us," would be a violation of his intellectual property rights. He was a cosmologist. He dealt in scales that make human lifespans look like a blink, and probabilities that make winning the lottery look like a certainty.

  For the last twenty years of his life, [Name] was obsessed with a specific paradox. I'll keep it simple. He argued that if the universe is infinite and random, it is statistically more likely for a single brain to spontaneously fluctuate into existence, complete with false memories of a life like yours or mine, than for an entire universe to evolve to produce us biologically.

  He called them "freak observers." Lone brains, floating in the void, hallucinating a world.

  He found this hilarious. He'd laugh over dinner, gesturing with a fork, saying, "By all rights, we should be alone. We should be the hallucination."

  I bring this up because it creates a problem for a eulogy. The standard promise we make at funerals is, "We will always remember him." We lean on memory as proof of continuity. But if [Name] was right about the math, memory is the one thing we cannot trust. A fluctuated brain would have memories of a friend exactly like me, standing in a room exactly like this, feeling grief exactly like this. If I tell you that your memories prove he was real, I am using the one piece of evidence he taught us to distrust.

  So I cannot promise you that you will remember him. And I certainly cannot tell you he is at peace, because [Name] is no longer a system capable of equilibrium. He is gone. The equation has closed.

  But here is where the argument turns. The "freak observer" is, by definition, solitary. It is a single point of consciousness isolated in the dark. It can simulate a conversation, but it cannot have one. It can simulate love, but it cannot risk it.

  The counter-argument to the lone brain isn't found in the past. It's found in the friction of the present.

  A hallucination cannot challenge you. A memory cannot surprise you. But [Name] did. He argued, he listened, he changed his mind, and he made us change ours. He built a world not of matter, but of interaction. The reality of a life isn't proved by how long it lasts, or even by how well it's remembered. It is proved by the resistance it offered. By the weight of it.

  To his wife, and to his children: I know the math. I know that in a cold universe, connection is a statistical anomaly. But look around this room. The people here are not a simulation. The grief you feel is not a glitch. It is the cost of having built something real in a universe that prefers chaos.

  If this moment were a fluctuation, if we were all just lone brains hallucinating a goodbye, the love you feel right now would still be the only data point that matters. Because even in a false universe, the capacity to care is the one variable that defies the entropy. A lone brain cannot grieve, because grief requires something outside yourself to have been lost. Your grief is the proof that he was not alone. And that you are not.

  [Name] spent his life looking for the signal in the noise. He found it in his work, but he found the stronger signal here. In the messy, improbable, statistically unlikely fact of us.

  He wouldn't want us to bet on an afterlife. He'd want us to bet on the odds we have right here. The universe may be indifferent, but we are not. He was here. He mattered. And the love we carry for him is not a memory of what was, but a continuing argument for what is.

  Thank you.
