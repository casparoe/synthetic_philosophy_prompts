prompt: |-
  So I got into a three-hour argument with a friend last night and I still haven't won it, which means I need to outsource it. I'm the first-pass reader for a comparative economic history working-paper series — not a specialist in any region, just the person who decides which submissions go out to the area specialists and which get bounced back with a note. A lot of what lands on my desk is phrased as one big contrastive question: why Britain and not the Yangzi delta, why Europe and not China, why did X miss the boat, why did industrialization start where and when it did. My friend thinks these are perfectly good questions and that anyone who says otherwise is a philosopher wasting historians' time. I think most of them aren't actually well posed — that "why A and not B" quietly smuggles in a choice of foil, a choice of unit (state? region? civilization? river basin? firm?), and a definition of the outcome that the author never states and often couldn't defend. His counter is that my scepticism, applied consistently, would kill every ambitious question in macro-history, and I don't have a good answer, partly because I can't articulate what my standard actually is beyond a vibe. So: turn the vibe into a procedure.

  What I want is a checklist a non-specialist can run in about thirty minutes on a submission whose central claim is a contrastive why-A-and-not-B question. Ordered steps, what counts as a sufficient answer to each, where the procedure terminates in "not well posed, return with this specific repair," where it hands off to a specialist because what's left is an empirical matter rather than a conceptual one, and — this matters — which steps are judgement calls wearing a procedure costume. Ground it in whatever the philosophy of explanation actually says that's usable: that explanations are contrastive so the foil does real work, that a difference-based comparison needs some shared background between the case and the contrast, selection on the dependent variable, the sample-of-one problem, the difference between a concept being vague at the edges and a concept being broken. But write it so someone with no philosophy training can execute it without knowing where those ideas come from. Two things I specifically want built in, because they're how I catch the bad ones in practice: a re-description ladder, where the reader has to restate the question one unit-level up and one level down (Europe → England → Lancashire, or China → Yangzi delta → Suzhou) and check whether the question survives unchanged, dissolves, or changes its answer; and a one-sentence paraphrase test, where the reader has to restate the question so that a competent outsider could say what evidence would settle it, and if they can't, the reader has to decide whether that's vagueness or ill-posedness.

  Then run it on three submissions I'm making up but which are close to things I've actually recieved. First: "Why England and not the Yangzi delta? Wages, coal, and colonial markets around 1750." This is my friend's favourite framing and he considers it settled, so I want an honest verdict — if it fails, say precisely which check kills it, what repair the author would have to make, and whether the repaired question is still the interesting one or just a defensible one. Second: "Why didn't the Roman economy industrialize?" I suspect this is junk, because it applies an outcome concept to a society that arguably lacks half its components and because there's no plausible foil, but I want the procedure to say so rather than me. Third: "Why did industrialization begin in the eighteenth century rather than the fourteenth?" I personally find this unfalsifiable hand-waving, so if it passes, tell me bluntly that I'm wrong and which of my instincts is the bad one. Finally, answer my friend directly: give me the strongest version of his objection, say which checks in your procedure are most likely to be over-applied by a lazy or timid reader and how the procedure should protect against that, where you deliberately left slack so that big speculative questions aren't strangled, and what the procedure flatly cannot do — it doesn't tell me whether the answer to a well-posed question is correct, and I assume it can't detect a contrast chosen for ideological reasons, but I want you to say what else it's blind to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** First-pass reader for a comparative economic history working-paper series (gatekeeper, not specialist).
      *   **The Conflict:** User vs. Friend. Friend thinks "Why A and not B" questions are fine. User thinks they are often ill-posed (smuggle in foils, units, outcomes). User needs to turn their "vibe" into a concrete procedure.
      *   **The Goal:** A 30-minute checklist for non-specialists to evaluate contrastive "Why A and not B" submissions.
      *   **Key Requirements:**
          *   Ordered steps.
          *   Criteria for passing/failing each step.
          *   Termination points (Return to author vs. Send to specialist).
          *   Identification of "judgement calls wearing a procedure costume."
          *   Grounded in philosophy of explanation (contrastive explanation, selection on dependent variable, sample-of-one, etc.) but written for non-philosophers.
          *   **Specific Tools:** "Re-description Ladder" (scale up/down) and "One-Sentence Paraphrase Test" (evidence criteria).
          *   **Application:** Run the checklist on three specific hypothetical submissions (England/Yangzi, Roman Industrialization, 18th vs. 14th Century).
          *   **Direct Answer to Friend:** Strongest objection, risks of over-application, where slack is left, and limitations of the procedure.

  2.  **Deconstruct the Philosophy of Explanation (for the Checklist):**

      *   *Contrastive Explanation:* Explanations answer "Why P rather than Q?" The foil (Q) must be relevant and similar enough to P to make the difference meaningful (Mill's Method of Difference).
      *   *Unit of Analysis:* Is the comparison valid? (State vs. Region? Civilization vs. Economy?).
      *   *Outcome Definition:* Is "Industrialization" or "Growth" defined consistently across cases?
      *   *Selection on Dependent Variable:* Don't just pick cases where the outcome happened and look for causes; you need variation.
      *   *Vagueness vs. Ill-posedness:* Vagueness is okay (borderline cases); ill-posedness means the terms don't map to reality or evidence.

  3.  **Drafting the Checklist (The "Procedure"):**

      *   *Time Limit:* Needs to be doable in 30 mins.
      *   *Step 1: The Paraphrase Test.* Can you state it such that evidence is identifiable?
      *   *Step 2: The Foil Check.* Is the "Not B" actually comparable to "A"?
      *   *Step 3: The Re-description Ladder.* Does the question hold up at different scales?
      *   *Step 4: The Outcome Consistency.* Does the "success" metric apply to both sides?
      *   *Step 5: The Causal Leverage.* Does the answer actually distinguish A from B?
      *   *Decision Nodes:* Pass to specialist, Return for repair, Reject.
      *   *Flagging Judgement Calls:* Explicitly mark where human intuition is still required.

  4.  **Running the Checklist on the Three Submissions:**

      *   *Submission 1: England vs. Yangzi (1750).*
          *   *Context:* This is the Pomeranian/Great Divergence debate. It's famous.
          *   *Analysis:* Usually passes the foil check (both advanced agrarian economies). Might stumble on the Re-description Ladder (England is a state, Yangzi is a region). Needs repair on units.
          *   *Verdict:* Pass with repair (define units comparably).
      *   *Submission 2: Roman Industrialization.*
          *   *Context:* Anachronistic outcome definition.
          *   *Analysis:* Fails Outcome Consistency. "Industrialization" implies specific tech/social structures Rome didn't have. Fails Foil Check (what is the foil? A world where Rome industrialized? Counterfactual).
          *   *Verdict:* Return/Reject. Ill-posed outcome.
      *   *Submission 3: 18th Century vs. 14th Century.*
          *   *Context:* Temporal comparison.
          *   *Analysis:* Fails Foil Check? Or rather, fails Causal Leverage. Why *not* 14th? Black Death? If the paper says "because of X," does X exist in 14th?
          *   *User's Instinct:* Unfalsifiable hand-waving.
          *   *Procedure Verdict:* Might actually pass the *question* structure, but fail the *evidence* test. The question is well-posed, the *answer* might be weak. This distinguishes the procedure's limit.
          *   *Correction:* Wait, the prompt asks if the *question* is well-posed. "Why 18th not 14th?" is a valid contrastive question *if* the prerequisites for industrialization existed in the 14th. If they didn't, it's like asking "Why didn't cavemen build iPhones?"
          *   *Verdict:* Passes as a question, but requires strict definition of "prerequisites." User might be wrong about it being ill-posed, but right about the risk of hand-waving.

  5.  **Addressing the Friend (The Meta-Argument):**

      *   *Friend's Strongest Point:* Heuristics are necessary. Without "Why A not B," we get description, not explanation. Perfection is the enemy of the good.
      *   *Risks of Procedure:* Gatekeeper becoming a pedant. Killing bold hypotheses because units aren't perfectly aligned (they never are).
      *   *Slack:* Allow "ideal types" if acknowledged.
      *   *Blind Spots:* Ideology, correctness of data, rhetorical persuasion.

  6.  **Refining and Polishing:**

      *   *Tone:* Professional, slightly academic but practical, authoritative but acknowledging the limits.
      *   *Structure:*
          1.  Introduction (Acknowledging the stakes).
          2.  The Protocol (The Checklist).
          3.  The Trials (Applying to the 3 papers).
          4.  The Reply to the Friend (Philosophical defense).
      *   *Self-Correction on Submission 1:* The England/Yangzi comparison is the classic "Great Divergence." The unit mismatch (Island Nation vs. River Region) is a known critique (Rosenthal/Wong etc.). The checklist *should* catch this.
      *   *Self-Correction on Submission 3:* The 18th vs 14th century question. If the definition of industrialization requires steam power, and steam power wasn't *possible* in the 14th due to physics knowledge, the question is "Why did physics advance?" If it's about economic conditions, did the economic conditions exist in the 14th? The procedure needs to ensure the *possibility* of the outcome in the foil case is established.

  7.  **Final Review against Constraints:**
      *   30-minute limit? Yes, steps are concise.
      *   Re-description ladder included? Yes.
      *   Paraphrase test included? Yes.
      *   Judgement calls flagged? Yes.
      *   Friend's objection answered? Yes.

  8.  *(Drafting the response...)* -> *Focus on clarity and actionable language.* Ensure the distinction between "Return for Repair" (conceptual fix) and "Send to Specialist" (empirical fix) is clear.

      *   *Refining the "Judgement Call" flags:* Make them visual or explicit text boxes.
      *   *Refining the "Friend" section:* Make sure it sounds like a steelman argument, not a strawman.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "England/Yangzi fails." It's a seminal question. It passes *if* the units are aligned. The checklist should force the author to align them (e.g., England/Yangzi OR Britain/China). I will rule it as "Pass with Repair."

      *(Self-Correction on Roman)*: This is clearly a category error. "Industrialization" is a specific historical cluster. Applying it to Rome is anachronistic. The checklist must catch "Outcome Validity."

      *(Self-Correction on 18th vs 14th)*: This is about timing. Is it ill-posed? No, it's a valid timing question *provided* the 14th had the potential. The procedure should flag if the author assumes the 14th *could* have industrialized without proving it.

      *Let's write.*
answer: |-
  Here is the procedure you asked for. It is designed to be executed in 30 minutes by a generalist. It translates the philosophy of contrastive explanation into administrative triage.

  Following the protocol, I have run it on your three hypothetical submissions, and then I have addressed your friend directly.

  ***

  # The Protocol: Contrastive Question Triage (CQT)

  **Time Limit:** 30 Minutes
  **Goal:** Determine if the central question is *conceptually coherent*, not if the answer is *true*.
  **Decision Outputs:**
  1.  **Pass to Specialist:** Question is well-posed; empirical validity is now a specialist's problem.
  2.  **Return for Repair:** Question is ill-posed but fixable. Author must redefine units/outcomes.
  3.  **Reject:** Question is fundamentally broken (category error or unfalsifiable).

  ### Step 1: The One-Sentence Paraphrase Test (5 Minutes)
  **Action:** Read the abstract. Write down the central question in one sentence. It must take the form: *"Why did [Outcome O] occur in [Case A] during [Time T], but not in [Foil B] during [Time T]?"*
  **Criterion:** Can you identify specific archival or quantitative evidence that would settle this?
  *   **Pass:** You can list three specific datasets or sources that would prove/disprove the claim.
  *   **Fail:** The terms are so abstract (e.g., "culture," "spirit") that no document could count as evidence.
  **[Judgement Call]:** Distinguishing *hard-to-measure* concepts from *meaningless* ones. If the author defines "culture" as "guild membership records," it passes. If "culture" is "national ethos," it fails.
  **Termination:** If **Fail**, move to Step 5 (Diagnosis). If **Pass**, proceed to Step 2.

  ### Step 2: The Outcome Consistency Check (5 Minutes)
  **Action:** Look at the "Outcome O" (e.g., Industrialization, Growth, Divergence).
  **Criterion:** Does the definition of the outcome apply equally to Case A and Foil B?
  *   **Pass:** The metric exists for both. (e.g., "Real wages" can be calculated for London and Beijing).
  *   **Fail:** The outcome requires a structural prerequisite present in A but absent in B. (e.g., "Why didn't the firm maximize profit?" when the firm is a pre-market kinship group).
  **Termination:** If **Fail**, **Return for Repair**. The author must change the outcome to something B *could* theoretically achieve.

  ### Step 3: The Re-Description Ladder (10 Minutes)
  **Action:** Restate the question one unit-level **UP** (broader) and one unit-level **DOWN** (narrower).
  *   *Example:* If the paper asks "Why England and not China?", go Up to "Why Europe and not Asia?" and Down to "Why Lancashire and not Jiangnan?"
  **Criterion:** Does the causal mechanism proposed in the abstract survive the shift?
  *   **Pass:** The explanation works at all three levels, or the author explicitly justifies why the specific level is the causal bottleneck.
  *   **Fail:** The question dissolves or reverses at a different scale. (e.g., "England" had coal, but "Europe" had many coal-less regions that also didn't industrialize; or "Lancashire" industrialized but neighboring Derbyshire didn't, despite shared laws).
  **[Judgement Call]:** Determining if a scale shift is a *refinement* or a *refutation*. If the answer changes completely when you zoom in, the original unit was likely arbitrary.
  **Termination:** If **Fail**, **Return for Repair**. Author must justify the specific unit of analysis or narrow the claim.

  ### Step 4: The Foil Relevance Test (5 Minutes)
  **Action:** Examine [Foil B].
  **Criterion:** Is Foil B the *best* available contrast for isolating the cause?
  *   **Pass:** Foil B is similar to Case A in all relevant background conditions except the suspected cause. (Mill's Method of Difference).
  *   **Fail:** Foil B is too different (selection on the dependent variable). E.g., Comparing a modern state to an ancient empire to explain "bureaucracy."
  **Termination:** If **Fail**, **Return for Repair**. Author must select a tighter foil or acknowledge the limitation.

  ### Step 5: Diagnosis and Repair Note (5 Minutes)
  **Action:** If the paper failed Steps 1, 2, 3, or 4, categorize the error.
  *   **Vagueness:** Terms are loose but map to reality. -> *Send to Specialist with note to define terms.*
  *   **Ill-Posed:** Terms map to nothing or contradict the setup. -> *Return for Repair.*
  *   **Category Error:** Outcome cannot exist in Foil. -> *Reject.*

  ***

  # The Trials: Running the Protocol

  Here is the verdict on your three hypothetical submissions.

  ### Submission 1: "Why England and not the Yangzi delta? Wages, coal, and colonial markets around 1750."
  *   **Step 1 (Paraphrase):** *Why did mechanized textile production emerge in England c. 1750 but not in the Yangzi Delta?* **Pass.** (Wage data, coal output, trade records exist).
  *   **Step 2 (Outcome):** *Industrialization/Mechanization.* **Pass.** Both regions had proto-industry; the outcome is a matter of degree/tech adoption, not category.
  *   **Step 3 (Ladder):**
      *   *Up (Europe vs. China):* Fails. Much of Europe did not industrialize in 1750. "Europe" is too broad.
      *   *Down (Lancashire vs. Suzhou):* **Fail/Risk.** England is a political unit (state); Yangzi is a geographic/economic unit (region). If the author credits "English Law," the foil is mismatched (Suzhou had Qing law, but Jiangnan had different enforcement).
      *   *Verdict:* The unit mismatch is the classic critique of this framing.
  *   **Step 4 (Foil):** Yangzi is the wealthiest part of China; England is the leading part of Britain. **Pass**, provided the unit mismatch is acknowledged.
  *   **Final Verdict:** **Return for Repair.**
  *   **The Repair:** The author must explicitly justify the unit asymmetry (State vs. Region) or align them (Britain vs. Qing Empire, or Lancashire vs. Jiangnan).
  *   **Is it still interesting?** Yes. This is the "Great Divergence" question. It is defensible *if* the author admits the unit problem and argues why the state-level variable (e.g., colonial policy) matters more than the regional one. Your friend is right that it's a good question, but you are right that it smuggles in a unit mismatch.

  ### Submission 2: "Why didn't the Roman economy industrialize?"
  *   **Step 1 (Paraphrase):** *Why did Rome fail to achieve steam-powered mass production?* **Pass.** (We know what evidence would look like).
  *   **Step 2 (Outcome):** *Industrialization.* **Fail.**
      *   *Reasoning:* "Industrialization" implies a specific cluster of tech, energy, and social relations (factory system, fossil fuel dependence). Rome lacked the scientific prerequisites (thermodynamics) and the energy infrastructure. Asking why Rome didn't industrialize is like asking why a bicycle didn't fly.
  *   **Step 3 (Ladder):** *Up (Mediterranean vs. World):* Dissolves. *Down (Rome vs. Pompeii):* Dissolves.
  *   **Final Verdict:** **Reject.**
  *   **Diagnosis:** **Category Error.** The outcome concept is anachronistic.
  *   **The Repair:** The question must be changed to "Why did Roman energy consumption per capita stagnate?" or "Why did Roman tech innovation remain labor-saving rather than energy-intensive?" This changes the paper entirely. Your instinct was correct; the procedure confirms it is junk *as phrased*.

  ### Submission 3: "Why did industrialization begin in the eighteenth century rather than the fourteenth?"
  *   **Step 1 (Paraphrase):** *Why did the take-off happen c. 1750 and not c. 1350?* **Pass.**
  *   **Step 2 (Outcome):** *Industrialization.* **Pass.** (Assuming we define it as in Sub 1).
  *   **Step 3 (Ladder):** *Up (2nd Millennium vs. 1st Millennium):* Holds. *Down (1760 vs. 1360):* Holds.
  *   **Step 4 (Foil):** *The 14th Century.* **Conditional Pass.**
      *   *Constraint:* This passes *only if* the author establishes that the 14th century possessed the *prerequisites* for industrialization (e.g., markets, property rights, basic tech) but lacked the *trigger*.
      *   *Risk:* If the author assumes the 14th century *could* have industrialized without proving the prerequisites existed, it fails Step 2 (Outcome Consistency).
  *   **Final Verdict:** **Pass to Specialist.**
  *   **Your Instinct:** You called this "unfalsifiable hand-waving."
  *   **Procedure Verdict:** You are **wrong** about the question, but **right** about the risk. The question is logically well-posed (timing questions are valid contrastive questions). However, it is highly susceptible to "just-so stories." The procedure cannot stop a bad *answer*, only a bad *question*. This paper should go to a specialist to determine if the 14th-century counterfactual is historically plausible.

  ***

  # To Your Friend: The Defense of the Procedure

  You asked me to answer your friend directly. Here is the strongest version of his objection, followed by why the procedure is necessary despite it.

  ### The Strongest Version of His Objection
  *"History is not a laboratory. We cannot control variables. If we demand perfect unit alignment, precise outcome definitions, and counterfactual validity before asking a question, we will never ask the only questions that matter. 'Why Europe and not China?' is messy. 'Why Britain and not Jiangnan?' is messy. But the messiness is the reality of the past. A gatekeeper who sanitizes questions before they reach specialists is not protecting rigor; they are protecting timidity. You are building a machine that filters out bold hypotheses because they don't fit into clean boxes. The 'vibe' you have is just risk aversion."*

  ### Where the Procedure Protects Against Timidity
  He is right that perfectionism kills history. That is why the CQT Protocol has specific "slack" built in:
  1.  **Vagueness vs. Ill-Posedness:** Step 1 allows vague concepts *if* they can be operationalized. "Culture" is allowed if it maps to "guild records." This prevents the "no concepts allowed" trap.
  2.  **The Repair Option:** Most failures result in "Return for Repair," not "Reject." The procedure does not kill the question; it forces the author to sharpen the spear before throwing it.
  3.  **Step 3 (Ladder) Slack:** If the answer changes when you zoom in, the author isn't forced to abandon the question, only to *justify* the scale. This allows for "ideal types" (e.g., treating "China" as a unit) provided the author admits it's a simplification.

  ### Where the Procedure is Blind (My Concession)
  The procedure cannot detect:
  1.  **Ideological Foils:** An author might choose "Why Europe and not Africa?" not because it's the best causal contrast, but to serve a narrative of superiority. The procedure checks if the comparison is *possible*, not if the motivation is *honest*.
  2.  **Empirical Truth:** As seen in Submission 3, a question can be perfectly well-posed but answered with garbage. The procedure sends that to the specialist. It does not do the specialist's job.
  3.  **The "So What?" Factor:** A question can pass every logical check and still be trivial. The procedure ensures the question *works*, not that it *matters*.

  ### The Verdict on the "Vibe"
  Your vibe is a heuristic for **Selection Bias** and **Conceptual Anachronism**.
  *   Your friend thinks you are blocking **Ambition**.
  *   You know you are blocking **Category Errors**.

  The procedure validates your intuition: Submission 2 (Rome) is a category error and should be bounced. Submission 1 (England/Yangzi) is ambitious but conceptually leaky (units) and needs repair. Submission 3 (Timing) is valid, and your skepticism there is actually a skepticism of the *answer*, not the *question*.

  Tell your friend: **This procedure does not stop big questions. It stops broken compasses.** If the question is well-posed, the specialist can find the answer. If the question is ill-posed, the specialist will just argue about definitions for three hours and find nothing. You are saving the specialists' time.
