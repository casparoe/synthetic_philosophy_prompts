answer: |-
  **MEMORANDUM OF PARTIAL CONVERGENCE**
  **Subject:** Causal Architecture of Post-Plague Divergence (West vs. East of Elbe)
  **Chair:** [Your Name]
  **Date:** Month 14

  ### I. Jointly Signed Claims
  *The following statements represent the minimum viable consensus required to proceed. Each claim is falsifiable; a third party could plausibly deny them.*

  1.  **Comparability of Shock:** The initial demographic shock of the Black Death (1347–1351) was of comparable magnitude across Western and Eastern Europe, sufficient to create acute labor scarcity in both regions.
  2.  **Divergence of Outcome:** Within 150 years of the initial outbreak, legal and economic conditions for the peasantry diverged significantly, moving toward emancipation in the West and intensified servitude in the East.
  3.  **The Licensing Constraint:** Pre-existing geographic and institutional conditions did not *determine* specific outcomes but functioned as a **licensing mechanism**: they rendered certain political settlements (e.g., immediate total emancipation in the East, immediate re-enserfment in the West) prohibitively costly to attempt, though not logically impossible.
  4.  **Variance Decomposition:** Neither slow variables (geography, soil type, settlement density) nor fast variables (statutes, revolts, succession crises) account for 100% of the variance; a model excluding either class of variables fails to predict the observed divergence.
  5.  **Mechanism Requirement:** Any structural explanation must identify the specific agents who enforced the structure; any agent-centric explanation must identify the constraints that made those agents' choices effective.
  6.  **Counterfactual Validity:** Causal claims regarding this divergence must withstand at least one plausible local counterfactual (e.g., a specific border region) where one variable class changes while the other is held constant.

  ### II. Table of Remaining Disagreements
  *Phrased such that Side A accepts Column A and Side B accepts Column B. Neither accepts the other's column.*

  | Domain | Side A (Structural/Braudelian) Position | Side B (Agency/Event) Position |
  | :--- | :--- | :--- |
  | **Causal Priority** | Structures fix the *probability distribution* of outcomes; events merely select the realization from the available set. | Agents select the outcome; structures are merely the *retrospective name* for the stability of that selection. |
  | **The "East" Mechanism** | The Eastern divergence was driven by the **profitability of grain exports** via the Vistula, a slow variable that made serfdom the only economically viable equilibrium. | The Eastern divergence was driven by **specific political coalitions** (e.g., the Polish *szlachta* securing legal privileges), which were contingent choices, not economic inevitabilities. |
  | **Persistence** | Long-term persistence of serfdom in the East is evidence of **deep structural causation** (geography/demography). | Long-term persistence of serfdom in the East is evidence of **successful reinforcement** (repeated coercive choices to maintain the system). |
  | **Explanation Unit** | The primary unit of explanation is the **region** (West vs. East), as individual variance averages out over the century. | The primary unit of explanation is the **decision point** (Diet, Revolt, Statute), as regional trends are aggregates of these moments. |

  ### III. Cruxes and Adjudication
  *Sub-questions where settling the matter would force a concession. Both sides agree these are the battlegrounds.*

  **Crux 1: Persistence as Depth vs. Slowness**
  *   **The Question:** Is the longevity of a phenomenon (e.g., Eastern serfdom lasting 300 years) proof of a deep structural cause, or merely proof that short-term coercive choices were successfully repeated?
  *   **Agreed Evidence:** Cases of rapid structural collapse despite similar geographic conditions (e.g., Saint-Domingue/Haiti vs. Jamaica; or the sudden collapse of Eastern serfdom in the 19th century without geographic change).
  *   **Side A Prediction:** Rapid collapses are anomalies preceded by long-term structural erosion (e.g., soil exhaustion, demographic shifts) visible in the data prior to the break.
  *   **Side B Prediction:** Rapid collapses can occur without prior structural erosion, triggered solely by a shift in coercive capacity or political will (e.g., state decree, successful revolt).

  **Crux 2: The Legitimacy of "Delete Geography" Counterfactuals**
  *   **The Question:** Is a counterfactual that removes a slow variable (e.g., "What if the Vistula did not flow north?") a legitimate historical test, given it cannot be run?
  *   **Agreed Evidence:** Border regions where geography is constant but political jurisdiction changes (e.g., Pomerania vs. Brandenburg; or manors straddling jurisdictional lines).
  *   **Side A Prediction:** In border regions, outcomes will correlate with the geographic/economic zone, regardless of the political border. (Geography trumps Policy).
  *   **Side B Prediction:** In border regions, outcomes will correlate with the political jurisdiction, regardless of the geographic zone. (Policy trumps Geography).

  **Crux 3: The "License" Threshold**
  *   **The Question:** At what point does a structural constraint become an absolute barrier? (Testing Reframing 1).
  *   **Agreed Evidence:** Failed Peasant Revolts (e.g., German Peasants' War 1525, English Peasants' Revolt 1381).
  *   **Side A Prediction:** Revolts failed because the **structural conditions** (military tech, town support, nobility cohesion) made success impossible regardless of leadership.
  *   **Side B Prediction:** Revolts failed because of **contingent errors** (tactical decisions, loss of leaders, timing) that could have gone differently.

  ### IV. Closing Analysis

  **Verbal Disputes**
  Approximately 40% of the remaining friction is verbal, centering on the definition of **"Structure."**
  *   Side A uses "Structure" to mean *external constraints independent of individual will* (climate, trade routes).
  *   Side B uses "Structure" to mean *sedimented patterns of past human choices* (laws, property rights).
  *   **Resolution:** When Side A says "Structure caused X," Side B hears "People didn't choose Y." When Side B says "Agents caused X," Side A hears "Constraints didn't matter." The "Licensing" claim in Section I is the bridge: Structures are the walls of the room; Agents are the people moving inside it.

  **The Unsigned Claims (The Core Commitments)**
  *These are the claims each side believes but refuses to sign, as admitting them would surrender the core of their historiographical identity.*

  *   **Side A's Refusal:** "If we reran history with the same geography and demography but different kings and statutes, the broad trajectory of East vs. West would likely remain unchanged."
      *   *Why they won't sign:* It admits too much contingency.
      *   *Why Side B accuses them:* It proves A believes in historical determinism disguised as probability.

  *   **Side B's Refusal:** "If we reran history with the same geography but different decisions at the Diet of Piotrków (1496), the Second Serfdom could have been avoided entirely."
      *   *Why they won't sign:* It admits too much structural constraint.
      *   *Why Side A accuses them:* It proves B believes in the "Great Man" theory of economics and ignores the grain trade realities.
