      *   *The Student Hurdle:* Students often think "pleasure" is obvious. They need to feel the tension between the *word* being the same and the *experiences* being different.
      *   *The TA's Intuition:* The TA suspects students need to see that hedonism *requires* unity before they can feel the lack of it. They also suspect students need to notice they are already treating "pleasure" as a name for something.
      *   *My Task:* Validate, refine, or correct this sequencing. Choose the best case study. Map the misconceptions. Structure the closing.

  3.  **Sequencing the Argument (The "Order of Pieces"):**
      *   *TA's Guess:* 1. Notice "pleasure" names something -> 2. Hedonism requires unity -> 3. Multiplicity/Heterogeneity.
      *   *Critique:* This is mostly right, but Step 1 needs to be more specific. It's not just that it names something, but that it names a *criterion of value*. If it's not a single criterion, it can't rank lives.
      *   *Revised Sequence:*
          1.  **Establish the Hedonist Commitment:** Pleasure is the *sole* currency of value. (Why unity matters).
          2.  **Elicit the Phenomenology:** Get students to describe specific pleasures.
          3.  **The Clash:** Compare the descriptions. Do they share a common "feel"?
          4.  **The Consequence:** If no common feel, can we sum them up? Can we say one life has more "pleasure" than another?
      *   *Reasoning:* You can't feel the problem (heterogeneity) until you know what the theory needs (unity for calculation/ranking). So, Hedonist Commitment first. Then Phenomenology. Then the Clash.

  4.  **Choosing the Single Case:**
      *   *Option A:* Bodily (water) vs. Mental (proof). *TA's worry:* Too tidy, invites "body vs. mind" distinction which masks the phenomenological issue.
      *   *Option B:* Cessation of pain (scratching an itch). *Pros:* Highlights negative/positive blur. *Cons:* Might get bogged down in relief vs. joy.
      *   *Option C:* Background contentment (warm glow of evening). *Pros:* Hard to pinpoint a "feel." *Cons:* Might seem too vague.
      *   *Decision:* The TA's worry about Option A is correct. Option B is strong but specific. Option C is good for the "no feel" argument.
      *   *Best Choice:* **The "Background Contentment" case (warm evening with friends).**
      *   *Why:* It forces the question: "Is there a *tingle* here?" If they say no, but still call it pleasure, the "common feel" theory cracks. If they say yes, ask them to describe it compared to the cold water. It avoids the Body/Mind trap. It targets the "feeling tone" assumption directly.
      *   *What it must lack:* It must *not* be described as "happy" or "satisfied" initially, just "pleasant." Avoid moralizing it.
      *   *Why alternatives fail:* Body/Mind implies dualism solves it. Cessation of pain invites the "relief is just negative pleasure" debate which distracts from heterogeneity.

  5.  **Mapping Misconceptions:**
      *   *The "Common Buzz":* Head off during the Phenomenology phase. Ask "Where do you feel it?"
      *   *Heterogeneity = Refutation:* Head off in the Consequence phase. Clarify it's a problem *for the theory*, not necessarily a death sentence (leads to closing options).
      *   *Comparison/Intensity:* Distinguish early. This isn't about *how much*, it's about *what kind*.
      *   *Mill's Higher/Lower:* Head off immediately if raised. Mill admits heterogeneity but tries to save hedonism via quality. This concedes the point that feelings differ.
      *   *Attitude vs. Feeling:* Save for the closing options. Don't let it derail the phenomenological investigation.
      *   *Everything is Various:* This is the "triviality objection." Address by distinguishing *determinate* differences (red vs. blue) from *determinable* unity (color). Pleasure is supposed to be the "color" of experience. Is there a "color" of pleasure?

