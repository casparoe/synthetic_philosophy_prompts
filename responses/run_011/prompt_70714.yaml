answer: |-
  Here is a plan for your fifty-minute section. It is structured to build the philosophical tension before offering the escape routes, ensuring students feel the problem before they try to solve it.

  ### I. The Sequence of Pieces (0–40 Minutes)

  You are correct that students cannot feel the force of the multiplicity until they see why unity is required. However, your intuition about the first step needs a slight adjustment. Before they notice they are treating "pleasure" as naming something, they must understand *what work that name is supposed to do* for the hedonist.

  **1. The Hedonist Wager (0–10 mins)**
  *   **Goal:** Establish that for hedonism to function as a calculus of value, "pleasure" must be a unified metric.
  *   **Action:** Draw a simple equation on the board: `Good Life = Sum(Pleasures) – Sum(Pains)`.
  *   **Key Point:** Ask: "To add these numbers, what must be true about the items?" They must be denominated in the same currency. You cannot add meters to kilograms. If the "pleasure" of reading a poem and the "pleasure" of eating cake are different *kinds* of things (not just different amounts), the sum is nonsense.
  *   **Why this first:** If you start with phenomenology (what it feels like), students will treat it as a psychology question. By starting with the *theory's requirement*, you make the phenomenology a test of the theory's viability.

  **2. The Phenomenological Stress Test (10–25 mins)**
  *   **Goal:** Use the chosen case to probe whether a common "currency" exists in experience.
  *   **Action:** Elicit descriptions of the specific case (see Section II).
  *   **Key Point:** Press for the *location* and *texture* of the pleasure. Is it a sensation? Is it an emotion? Is it a judgment?
  *   **Why this second:** Now that they know unity is required for the math to work, they are looking for the unity. When they fail to find it, the problem registers.

  **3. The Misconception Gauntlet (25–40 mins)**
  *   **Goal:** Prevent premature closure by addressing standard deflections.
  *   **Action:** Field objections as they arise, but categorize them into specific "traps" (see Section III).
  *   **Why this third:** If you address these too early, you solve the problem for them. If you address them too late, students leave thinking the objections you didn't cover are fatal. This section stabilizes the problem so the closing options can be understood as *responses* to it, not denials of it.

  ---

  ### II. The Single Case (10–25 Minutes)

  **Choose: The Background Contentment (The "Warm Glow")**

  Do not use the Body/Mind contrast (Water/Proof). Do not use the Cessation of Pain (Cramp). Use the **Warm Glow of a good evening with friends.**

  **Why this case:**
  1.  **It avoids the Body/Mind trap:** The Water/Proof pair invites students to say, "One is physical, one is mental, but both are feelings." This preserves the "common feel" intuition too easily.
  2.  **It avoids the Negative/Positive trap:** The Cramp case invites debate about whether relief is just the removal of pain. This distracts from the core question: "Is there a positive feeling here?"
  3.  **It targets the "Feeling" assumption:** The Warm Glow is the hardest to pin down as a specific sensation. Many students will admit it doesn't "feel like anything" in the way an itch or a taste does, yet they insist it is pleasant. This creates the crack in the "Pleasure = Specific Feeling" model.

  **What the case must have:**
  *   It must be undeniably *good* (so hedonists want to count it).
  *   It must be undeniably *pleasant* (students must agree to call it pleasure).
  *   It must be *diffuse* (no clear location in the body or mind).

  **What the case must lack:**
  *   **Do not describe it as "Happiness."** Happiness invites theories of life-satisfaction which confuses the issue. Stick to "pleasant evening."
  *   **Do not describe it as "Relief."** Keep it positive, not the removal of a negative.
  *   **Do not introduce the Cold Water yet.** Let the Warm Glow stand on its own first. Ask: "Describe the sensation." When they struggle, *then* ask: "Is this the same kind of thing as the shock of cold water?" This makes the Cold Water the *control*, not the co-star. The focus remains on whether the Glow fits the model established by the Water.

  **Pedagogical Note:** This relies on the assumption that introspection is reliable enough to detect the presence or absence of a "feeling." This is **contested**. Some philosophers argue we are blind to our own hedonic tones. You should flag this in the closing, but for the sake of the exercise, proceed *as if* introspection works, so the problem becomes visible.

  ---

  ### III. Mapping the Misconceptions (25–40 Minutes)

  Do not save these for the end. Head them off as they naturally arise during the Stress Test.

  **1. "There is a common buzz."**
  *   **When:** During the Phenomenological Stress Test.
  *   **Response:** Ask for the location. "Is the glow in your chest the same *kind* of thing as the coldness in your throat?" If they say yes, ask them to describe the quality without using the word "good" or "pleasant." If they can't, the "common kind" claim is empty.

  **2. "Everything is various." (The Triviality Objection)**
  *   **When:** Immediately after you claim pleasures are too different to be one kind.
  *   **Response:** Distinguish *determinate* from *determinable*. Red and Blue are different, but both are *Colors*. Pleasure is supposed to be the *Color* of experience. The question is: Is there a "Color" of pleasure? If the "Warm Glow" has no color, but the "Cold Water" does, they aren't the same determinable.

  **3. "Mill's Higher and Lower Pleasures."**
  *   **When:** A student suggests we can just rank them by quality.
  *   **Response:** Point out that Mill concedes the point. By admitting "higher" and "lower," he admits they are *different kinds*. If they are different kinds, you cannot simply sum them. You need a second standard (dignity, virtue) to rank them. If you need a second standard, you are no longer a pure hedonist.

  **4. "Heterogeneity refutes hedonism."**
  *   **When:** Students think the discussion is over because the theory looks broken.
  *   **Response:** Clarify that this is a *problem for the theory*, not a refutation. It forces the theory to evolve. (Save the evolution for the closing).

  **5. "Attitude vs. Feeling changes the subject."**
  *   **When:** A student suggests pleasure is just liking something.
  *   **Response:** Acknowledge this is a major move. Tell them: "Hold that thought. That is one of the three ways out. We will evaluate if it stops being a theory of *experience* in the final minutes."

  ---

  ### IV. The Closing: Live Options (40–47 Minutes)

  You have seven minutes. Do not attempt to cover neural machinery (liking vs. wanting) or the view that pleasure is not a feeling *at all* (eliminativism). Stick to the three structural responses to the problem.

  **Capacity Check:** Second-year students can hold three distinct structural moves if they are presented as *responses to the problem you just built*, not as isolated theories.

  **The Three Options:**
  1.  **The Common Feel Defense:** Insist there *is* a common tone (a "hedonic quality"), even if it is faint or hard to describe. (Risk: Introspective failure).
  2.  **The Attitudinal Shift:** Pleasure is not a sensation; it is an attitude of *wanting the experience to continue*. (Risk: Changes subject from experience to desire).
  3.  **The Activity View (Aristotelian):** Pleasure is not an ingredient added to an activity; it is the experience of the activity going *unimpeded*. (Risk: Complex metaphysics of activity).

  **What to Leave Out:**
  *   **Names:** Do not say "Sidgwick," "Feldman," or "Aristotle." Say "Some philosophers," "Others," "A third group." Names invite memorization rather than understanding.
  *   **Consensus:** Explicitly state: "There is no agreement on which of these saves hedonism. Some think Option 2 stops being hedonism. Some think Option 3 is too difficult to define."
  *   **Contested Status:** Flag that Option 1 assumes introspection is transparent (contested). Flag that Option 2 assumes desires can be about present experience (contested).

  **Script for the Transition:**
  "We have found a crack in the theory. Pleasure does not look like one thing. Hedonists have three ways to fix the crack. They can deny the crack, change the definition of pleasure, or change the definition of experience. Here is the cost of each."

  ---

  ### V. The Diagnostic Question (47–50 Minutes)

  Do not ask: "Are pleasures heterogeneous?" (They will just say yes).
  Do not ask: "Is hedonism false?" (They will guess what you want to hear).

  **Ask this:**
  > "If we accept that the 'Warm Glow' and the 'Cold Water' share no common feeling, what exactly is the hedonist adding up when they calculate the best life?"

  **Why this works:**
  *   If they answer "Units of satisfaction," they have slipped into Attitudinal Hedonism (Option 2) without realizing it.
  *   If they answer "We can't add them," they grasp the heterogeneity problem.
  *   If they answer "The intensity of the feeling," they have missed the point (the problem is kind, not degree).
  *   It forces them to confront the *consequence* of the problem (the breakdown of the calculus), which is the heart of the issue.

  ---

  ### VI. Summary of Contested vs. Settled in this Plan

  **Settled Pedagogical Choices:**
  *   **Sequence:** Requirement of Unity → Phenomenological Test → Misconceptions → Options. (This order is necessary to generate the tension).
  *   **Case:** The Warm Glow is superior for breaking the "sensation" model without triggering dualist defenses.
  *   **Closing:** Limit to three structural options to avoid cognitive overload.

  **Contested Philosophical Claims (Flag these for students):**
  *   **Introspective Transparency:** The exercise assumes students can accurately report whether a "feeling" is present. Some philosophers argue pleasure is opaque to introspection.
  *   **The Unity Requirement:** The plan assumes hedonism *needs* a unified natural kind of pleasure. Some hedonists argue value can be pluralistic even if the theory is monistic about "good."
  *   **The Status of Options:** Present the three closing options as live debates, not as a progression toward the "correct" answer. There is no consensus on which, if any, saves hedonism.
