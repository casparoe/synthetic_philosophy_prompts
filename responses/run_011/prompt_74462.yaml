      *   *Alternative:* **Wild-Caught Octopus.** Removes farming welfare (crowding/cannibalism). Leaves death method + env (bycatch).
      *   *Selection:* **Wild-Caught Octopus (trap-caught, low bycatch).** This isolates the "Farming is inherently wrong for this species" principle vs. "Death/Env is what matters."

