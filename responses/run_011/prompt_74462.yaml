      *   *Idea:* **Farmed Tilapia (Recirculating).** Low sentience (fish), low env impact (veg feed, closed loop), but crowded.
      *   *Better Idea:* **Wild-Caught Squid.** High sentience (cephalopod), no farming welfare issues (lived wild), but high bycatch/stock uncertainty.
      *   *Best Idea:* **Farmed Crickets.** High density (welfare?), low sentience (debatable), low env impact.
      *   *Let's try to split the Octopus specific principles:* We need to separate "Can we fix the life?" from "Is the env cost too high?"
