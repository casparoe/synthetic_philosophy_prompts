      *   *Wait, re-reading the prompt:* "Tell me which single past ruling is the tightest analogy and exactly where it starts to break down."
      *   *Decision:* **Farmed Salmon (R1)**. It's the only "Farmed High-Sentience + Conditions = Yes" case. It breaks down because Octopus sentience is arguably higher (invertebrate peak) and their social needs (solitary) make "farming" inherently contradictory compared to schooling salmon.

  7.  **Propose a Discriminating Hypothetical:**
