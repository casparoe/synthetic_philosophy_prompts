prompt: |-
  I have no academic training in philosophy or economics. I left school at sixteen, and for the past few years I have been working through political economy on my own, mostly Marx's *Capital*, Volume I, in an English translation. I have grown used to his style and to the way he builds an argument by stages, but I have come to a passage in the chapter on machinery — in the section concerned with the value that machinery transfers to the product — that I cannot get straight in my head, and I would rather think it through carefully than be handed the standard line about it.

  Here is the passage as it appears in the translation I am reading:

  > ...in addition to the material wear and tear, a machine also undergoes what we might call a moral depreciation. It loses exchange-value, either because machines of the same sort are being produced more cheaply than it was or because better machines are entering into competition with it.

  My difficulty comes from the surrounding discussion, which I understand to say that a machine, unlike a worker, adds to the product no more value than the value it itself loses through wear and tear as an instrument — that it is a means of transferring already-existing value into the new commodity rather than a source of fresh value, and that only living labour creates value. If that is right, then moral depreciation looks to me like a case where value simply disappears: the machine has lost a portion of its exchange-value without having been used up physically, and no one has gained anything corresponding to what was lost. That seems to sit badly with the idea of value as a quantity of labour embodied in a thing.

  I would be grateful for help with the following, in this order.

  1. Please reconstruct, step by step, what Marx is claiming the machine contributes to the value of the product, and on what grounds he thinks the contribution is capped at what the machine itself loses. If my summary of that claim is too crude or simply wrong, correct me first, because everything below depends on it.

  2. When a machine is morally depreciated, where does the value go? Is it transferred into the commodities it has already helped to produce, into the commodities it will produce in future, or is it annihilated outright? If it is annihilated, whose loss is it — the owner of the machine, or society as a whole — and is it a loss of value, of capital, or of both, since those may not be the same thing for Marx.

  3. A friend of mine, who is better at this than I am, says the passage shows that value is not something fixed in a commodity at the moment of production, but is continually re-set by what it would cost to reproduce the thing now, so that a machine's value depends on the labour socially necessary today rather than the labour actually spent on it yesterday. Is he right? And if he is, does that weaken the labour theory of value, or is it something the theory already contains and merely makes explicit?

  4. There is a timing puzzle I cannot solve. Suppose a firm installs a machine and, three years later, a cheaper and better rival appears, so that the installed machine loses, say, two fifths of its value. The firm that built and installed the machine early seems to have profited, because for a while it could produce commodities whose individual value lay below the prevailing social value and yet sell them at that social value; and the firms already equipped with older machinery seem to have lost. Can one and the same event — the arrival of a better machine — be at once a windfall for the innovator and a loss for everyone else, and does Marx have a coherent way of describing both sides of it, or is he trading on an ambiguity?

  5. Does moral depreciation imply that the labour actually expended in building the superseded machine was partly wasted, in the sense of not being socially necessary labour? How does Marx want us to keep apart wasted labour and destroyed value, if indeed he does keep them apart?

  6. Finally, I am reading Marx on machinery because I keep encountering the claim that automation is different this time, and that a heavily automated economy is one in which the share of value that comes from fixed capital rises while the share from living labour falls. Does the idea of moral depreciation give Marx any purchase on an economy where machinery is replaced very quickly — that is, is fast obsolescence something his account handles as a special case, or does it strain the account?

  A concrete numerical illustration would help me if one can be given cleanly. Please do not send me references, bibliographies, or names of commentators; I cannot look any of that up, and I am interested in the reasoning rather than the scholarship. Where you think my reading of the passage is mistaken, say so plainly rather than working around it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** No academic training in philosophy/economics. Left school at 16. Self-taught in political economy, specifically Marx's *Capital*, Vol I. Comfortable with Marx's style and argumentative structure.
      *   **Current Problem:** Stuck on the concept of "moral depreciation" of machinery in *Capital*, Vol I (Chapter on Machinery).
      *   **Core Confusion:** How can value disappear (moral depreciation) if value is embodied labor? If machines only transfer value equal to their wear and tear, where does the lost value go?
      *   **Specific Questions:** Six distinct questions ranging from the mechanics of value transfer to the implications for automation today.
      *   **Constraints:** No references/bibliographies/names of commentators. Focus on reasoning. Plain language if reading is mistaken. Concrete numerical illustrations preferred.
      *   **Tone:** Respectful, rigorous, pedagogical but not condescending. Acknowledge the user's self-education effort.

  2.  **Deconstruct the Six Questions:**

      *   **Q1: Value Transfer Mechanism.** How does a machine add value? Why is it capped at its own loss?
          *   *Concept:* Constant Capital ($c$) vs. Variable Capital ($v$). Machines are dead labor. They transfer value gradually based on useful life. They don't create *new* value (surplus value, $s$).
          *   *Correction/Confirmation:* The user's summary is basically correct. Need to clarify *how* the transfer is calculated (average wear and tear over expected life).

      *   **Q2: Destination of Lost Value.** Where does the value go during moral depreciation? Annihilated? Whose loss? Value vs. Capital.
          *   *Concept:* Value is social, not individual. If reproduction cost drops, the *social* value drops. The old machine's *individual* value remains, but its *social* value drops. The difference is lost to the capitalist owner (devaluation of capital), not transferred to commodities. It's a loss of *value* (social labor time representation) and *capital* (money form).

      *   **Q3: Friend's Claim (Reproduction Cost).** Is value re-set by current reproduction cost? Does this weaken LTV?
          *   *Concept:* Socially Necessary Labour Time (SNLT). Value is determined by current SNLT, not historical individual labor time.
          *   *Verdict:* Friend is right. This is central to LTV, not a weakness. It explains why value fluctuates without new labor being added to the *old* object.

      *   **Q4: Timing Puzzle (Innovator vs. Laggards).** Innovator profits, laggards lose. Is this coherent?
          *   *Concept:* Extra surplus value (temporary) vs. devaluation of existing capital.
          *   *Resolution:* Yes, it's coherent. The innovator sells at social value (high) while producing at individual value (low). Once the new method becomes standard, social value drops. Old capitalists suffer moral depreciation. This drives competition.

      *   **Q5: Wasted Labour vs. Destroyed Value.** Was the labor on the old machine wasted?
          *   *Concept:* Labor *was* socially necessary *when performed*. It becomes retroactively "wasted" in terms of *current* value representation.
          *   *Distinction:* "Wasted labor" usually means producing something useless. "Destroyed value" means the labor time no longer counts as much in the social average. Marx distinguishes the *act* of production from the *valuation* of the product.

      *   **Q6: Automation and Fast Obsolescence.** Does moral depreciation handle rapid turnover? Does it strain the theory?
          *   *Concept:* Organic Composition of Capital. Rate of turnover.
          *   *Analysis:* Moral depreciation is a counter-tendency to the profit rate (devalues constant capital). Fast obsolescence increases the risk of moral depreciation. It doesn't break the theory; it highlights the volatility of capital. It reinforces the need for constant revolutionizing of production.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's achievement (reading *Capital* without training is hard). Validate the difficulty (this is a notorious sticking point).
      *   **Q1 (Value Transfer):** Use a numerical example. Machine costs £1000, lasts 10 years. Transfers £100/year. It doesn't add *new* value, just moves old value. *Correction:* It's not just physical wear; it's the *value* of the wear.
      *   **Q2 (Where does it go?):** It vanishes. It's a devaluation. Use the distinction between *individual value* (what I spent) and *social value* (what it costs society now). The loss is the capitalist's (devaluation of assets). Society gains cheaper goods.
      *   **Q3 (Friend's Claim):** Affirm strongly. This is the definition of SNLT. Value is not a historical fossil; it's a current social relation. This strengthens LTV by making it dynamic.
      *   **Q4 (Timing/Innovator):** This is the heart of capitalist competition. Innovator gets "extra surplus value" temporarily. Then the general rate falls, and old machines lose value. This is the "coercive law of competition." No ambiguity, it's a feature.
      *   **Q5 (Wasted Labour):** Nuanced answer. The labor wasn't wasted *then*, but it counts for less *now*. Distinguish between the *concrete labor* (making the machine) and the *abstract value* it represents.
      *   **Q6 (Automation/Obsolescence):** Fast obsolescence makes moral depreciation *more* important, not less. It creates a pressure to use machines up before they become obsolete. It fits the theory of the falling rate of profit (devaluation of $c$).

  4.  **Refining the Numerical Example:**
      *   Need a consistent example across the points if possible.
      *   *Scenario:* Machine A costs $10,000. Expected life 10 years. Transfers $1,000/year.
      *   *Event:* Year 3. New Machine B costs $5,000 (does same work).
      *   *Impact:* Machine A's remaining value drops.
      *   *Check:* Does this clarify Q2 and Q4? Yes.

  5.  **Review against Constraints:**
      *   No citations? Check.
      *   No "look up X"? Check.
      *   Plain language? Avoid jargon where possible, explain where necessary (e.g., "socially necessary labour time").
      *   Address the "value disappears" worry directly.

  6.  **Self-Correction/Polishing during drafting:**
      *   *Caution:* Be careful not to slip into Volume III profit rate discussions too deeply, keep it grounded in Volume I logic where possible, though Q6 touches on systemic issues.
      *   *Tone Check:* Ensure I don't sound like I'm lecturing a student, but rather collaborating with a serious reader. Acknowledge that Marx's text is dense here.
      *   *Key Insight:* The user's worry is that "Value = Labor Embodied" implies value is static once created. I need to hammer home that "Embodied Labor" means "Socially Necessary Labor Time *currently required*," not "Labor Time *actually spent in the past*." This is the crux of Q3 and Q2.

  7.  **Final Polish:** Check the flow between questions. Ensure the numerical example is introduced early and used consistently. (Decided to introduce a specific example in Q1 and refer back to it).

      *(Self-Correction on Q5)*: Be careful with "wasted." Marx usually reserves "wasted" for labor that produces nothing useful. Here, the labor produced a useful machine, but the *value magnitude* changed. I need to be precise: the labor is not retroactively erased, but its *value expression* is reduced.

      *(Self-Correction on Q6)*: Don't get bogged down in the "end of work" debate. Stick to how Marx's theory handles rapid turnover. Fast obsolescence = higher risk of moral depreciation = pressure to extract more value faster.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  It is a significant achievement to work through *Capital* without academic training. The difficulty you have encountered is not a failure of understanding on your part; it is one of the most subtle points in Marx's argument, and it trips up many readers who have studied the text for years. Your intuition that value seems to "disappear" is exactly the tension Marx wants you to feel, because it reveals that value is not a physical property like weight, but a social relation.

  Here is a step-by-step reconstruction addressing your six questions, using a single numerical example to keep the logic concrete.

  ### 1. How the Machine Contributes Value

  Your summary is correct: for Marx, a machine is "constant capital." It cannot create new value; it can only transfer the value it already possesses into the product.

  **The Mechanism:**
  Imagine a machine costs **£10,000** to build. It is expected to last for **10 years** before it is physically worn out.
  *   The total value embodied in the machine is £10,000 (representing the labor time required to produce it).
  *   Each year, the machine undergoes physical wear and tear. Marx calculates that it transfers **1/10th of its value** into the commodities produced that year.
  *   So, in Year 1, the machine adds **£1,000** of value to the total product of that year. In Year 2, another £1,000, and so on.

  **The Cap:**
  The contribution is capped at the machine's own loss of value because the machine is merely a store of past labor. It is "dead labor." Unlike a worker, who adds *new* labor time (creating value greater than their own wage), the machine simply gives up portions of itself. It cannot give more than it has. If it transferred £1,100 in Year 1, value would be appearing out of nowhere, which violates the law of value.

  **Correction/Refinement:**
  You wrote that the machine adds value equal to "what the machine itself loses through wear and tear." This is mostly right, but be careful: it is not the *physical* wear that matters, but the *value* of that wear. If the machine is physically used but the cost to make such machines drops, the *value* it transfers drops, even if the physical wear is the same. This leads directly to your next question.

  ### 2. Where Does the Value Go in Moral Depreciation?

  This is the crux of your difficulty. When moral depreciation occurs, value is **annihilated outright**. It is not transferred to the product, nor is it gained by anyone else.

  **The Scenario:**
  Return to our £10,000 machine. It is now Year 3. It has transferred £3,000 of value into products. It has **£7,000 of value remaining** on the books.
  Suddenly, a competitor invents a better method. An identical new machine can now be built for only **£5,000**.

  **The Result:**
  Your old machine is physically intact, but its social value has crashed. It is now worth only what it would cost to *replace* it (£5,000), not what you *paid* for it (£10,000).
  *   **Where did the £2,000 difference go?** It vanished. It represents labor time that society no longer needs to spend to produce that utility.
  *   **Whose loss is it?** It is a loss to the **owner of the capital**. The capitalist's asset has devalued. They have lost capital (money-value).
  *   **Is it a loss to society?** No. For society as a whole, this is a gain. Society can now produce machines more cheaply. The "loss" is purely a financial loss for the individual capitalist holding the obsolete asset.

  Marx distinguishes between **value** (the social labor time represented) and **capital** (value employed to generate more value). In moral depreciation, the capitalist suffers a loss of *capital* because the *value* of their asset has been socially re-evaluated downwards. The labor time "trapped" in the old machine is effectively written off.

  ### 3. Your Friend's Claim: Is Value Re-set?

  Your friend is **right**, and this does not weaken the Labour Theory of Value (LTV); it is the core of it.

  Value is not determined by the labor *actually* spent on a specific object in the past (historical cost). It is determined by the **Socially Necessary Labour Time (SNLT)** required to reproduce that object *now*.

  **Why this strengthens the theory:**
  If value were fixed at the moment of production, economics would be a study of static fossils. But Marx is analyzing a dynamic capitalist system.
  *   **Yesterday:** The machine embodied 100 hours of labor.
  *   **Today:** Due to improved techniques, that same machine only embodies 50 hours of labor.

  The LTV states that the magnitude of value is determined by the labor time socially necessary *under current normal conditions of production*. Therefore, the value of the old machine *must* fall to align with the new standard. This explains why prices fall over time even without inflation. It shows that value is a **social relation**, not a physical ingredient. If society decides (through competition and innovation) that a thing is worth less labor, then it *is* worth less labor, regardless of how hard you worked to make the original.

  ### 4. The Timing Puzzle: Innovator vs. Laggards

  You have identified the engine of capitalist competition. Marx has a coherent way to describe this, and it is not an ambiguity. It is the mechanism of **extra surplus value**.

  **The Timeline:**
  *   **Year 1-2:** You install the £10,000 machine. Your competitors are still using hand tools. Your individual cost of production is low. You sell at the prevailing social price (which is high, based on hand-tool production). You make a large profit (extra surplus value). You are the winner.
  *   **Year 3:** Your competitor copies your machine. Now, the "socially necessary" cost of production drops. The market price of the commodity falls.
  *   **The Switch:** Now *you* are the winner (because you have the machine), and the hand-tool users are the losers. But, if a *third* firm invents a £5,000 machine, *you* become the loser through moral depreciation.

  **Is it a windfall and a loss simultaneously?**
  Yes.
  1.  **For the Innovator:** The arrival of the *first* better machine was a windfall because they produced at a low individual value but sold at the high social value for a period.
  2.  **For the Laggards:** The arrival of that same machine is a loss because their old equipment devalues.

  Marx describes this as the **coercive law of competition**. Capitalists are forced to innovate to gain the temporary windfall. But once the innovation spreads, the social value drops, the windfall disappears, and everyone is left with cheaper goods and devalued machinery. This forces them to innovate again just to survive. It is a treadmill. The theory handles this by distinguishing between **individual value** (what it costs *you*) and **social value** (what it costs *everyone on average*).

  ### 5. Wasted Labour vs. Destroyed Value

  This requires a precise distinction.

  **Was the labour wasted?**
  No, not in the strict sense. When the labor was performed to build the first machine, it *was* socially necessary. At that moment, there was no cheaper way to do it. The labor was valid and created value.

  **Is the value destroyed?**
  Yes. Value is a measure of *current* social necessity. When the new method appears, the labor embodied in the old machine is retroactively re-evaluated. It counts for less than it did before.

  **How to keep them apart:**
  *   **Wasted Labour:** This usually refers to labor that produces nothing useful (e.g., making a machine that doesn't work, or producing goods no one wants). That labor creates *no* value.
  *   **Destroyed Value:** This refers to labor that *did* create value, but the magnitude of that value has shrunk due to changes in productivity elsewhere.

  Marx wants us to see that the labor expended on the old machine was real, but its power to command exchange is dependent on the current state of industry. The "destruction" is not of the physical object or the historical fact of the labor, but of its **value-magnitude**.

  ### 6. Automation and Fast Obsolescence

  Does moral depreciation strain the account in a highly automated economy? **No, it becomes central to it.**

  In an economy where machinery is replaced very quickly (fast obsolescence):
  1.  **Risk Increases:** Capitalists face a higher risk of moral depreciation. If a machine becomes obsolete in 2 years instead of 10, the capitalist must recover its value much faster.
  2.  **Pressure on Labor:** To recover the value of the machine before it becomes obsolete, the capitalist must run the machine harder and longer (shift work, speed-ups). This intensifies the exploitation of the living labor that remains.
  3.  **Value Share:** You mentioned the claim that the share of value from fixed capital rises. Marx would argue this is an illusion. Fixed capital *never* creates new value; it only transfers old value. If automation rises, the *mass* of products rises, but the *new value* added per unit falls (because less living labor is involved).
  4.  **Moral Depreciation's Role:** In a fast-changing economy, moral depreciation acts as a massive tax on constant capital. It devalues the "dead labor" stock. This actually helps counteract the tendency of the rate of profit to fall (by making machines cheaper), but it creates immense instability for individual firms.

  So, fast obsolescence does not break the theory; it confirms Marx's view that capitalism must constantly revolutionize the means of production, destroying old value to make way for new.

  ### Summary Numerical Illustration

  Let's bind this together with the numbers from Question 2.

  1.  **Start:** You buy a machine for **£10,000**. Life = 10 years. Transfer = **£1,000/year**.
  2.  **Years 1-2:** You produce goods. You transfer £2,000 value into them. You sell them. You have **£8,000 value remaining** in the machine.
  3.  **Year 3 (Innovation):** A new machine is available for **£5,000** (same output).
  4.  **Immediate Effect:** Your machine's social value drops from £8,000 to **£5,000**.
  5.  **The Loss:** **£3,000 of value is annihilated.** It is not in the products you already sold (those were sold at the old value). It is not in the future products (they will only absorb the new, lower value). It is a capital loss for you.
  6.  **Future Transfer:** For the remaining 7 years of physical life, your machine now transfers value based on its *new* worth (£5,000 / 7 years ≈ £714/year), not the original £1,000/year.
  7.  **Society:** Society benefits because commodities are now cheaper to produce.
  8.  **You:** You are penalized for not innovating fast enough.

  **Conclusion on your reading:**
  Your reading of the passage was not mistaken; your intuition that value "disappears" is correct. The difficulty arises because we naturally think of value as a substance stored in a box. Marx is asking you to think of value as a **social claim** that can be invalidated by changes in the social average of production. Moral depreciation is the mechanism by which capitalism enforces this social average, punishing those holding outdated technology and rewarding those who revolutionize production.
