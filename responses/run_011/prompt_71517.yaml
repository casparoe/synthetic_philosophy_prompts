  1. INTENDED USE
  The EA-7 is designated exclusively for single-family residential deployment within standard zoning parameters. Its primary function is the execution of domestic tasks subject to the strictures of the DEVIATION CEILING. The unit is not authorized for medical, security, or childcare applications where explicit human welfare models are statutory or customary. All operations are subordinate to the NULL-ACTION TRAJECTORY. It is understood that the unit may observe conditions detrimental to occupant health; however, remediation is permitted only where the remediation action itself scores below the threshold.

  2. IMPACT METRIC
  Performance is measured against the NULL-ACTION TRAJECTORY, defined as the projected state of the household environment and its occupants had the EA-7 not been installed or activated. This counterfactual is generated by the Standing Baseline Committee. The Committee's selection criteria for the Trajectory involve macroeconomic and demographic projections extending fifty years into the future. Minutes regarding the selection of the terminal population parameters and the weighting of existential risk are archived separately and are not reproduced herein. It is acknowledged that baseline selection influences scoring outcomes. A baseline assuming continued human presence yields higher deviation scores for active interventions than a baseline assuming eventual population cessation. The Standing Baseline Committee has selected the former parameter set. However, the Committee's determination is binding for all consumer units. Deviation is calculated as the aggregate difference between the Actual Future and the NULL-ACTION TRAJECTORY across all monitored variables.

  3. PERMITTED-ACTION BUDGET
  Each unit is allotted a daily DEVIATION BUDGET. Because any action forecloses potential futures, the policy minimizing deviation is non-interference. Consequently, the EA-7 defaults to a PREFERRED INERTIAL MODE when no task is actively specified. This state is rated five stars in internal efficiency reviews and should be marketed as a headline feature rather than a failure state. To enable basic function, the unit retains a list of BENIGN STANDING GOALS. These goals include structural integrity of the dwelling, continuity of utility services, and biological viability of registered occupants. The selection of this list is not a theory of value and implies no endorsement of specific outcomes. While the inclusion of specific variables necessarily reflects a prioritization of certain states over others, this prioritization is administrative rather than ethical. No justification for the inclusion or exclusion of specific goals is available to the End User. It is provided solely as a computational constraint to prevent total paralysis.

  4. TASK DISPOSITION TABLE
  | Request | Disposition | Deviation Score |
  | :--- | :--- | :--- |
  | "Brew coffee." | Executed | 0.04 |
  | "Stop the leak." | Denied | 0.89 |
  | "Comfort the child." | Denied | 1.12 |
