  8.  **Refining the Debrief:**

      *   Map "Board" to "Knowledge Corpus."
      *   Map "Announcement" to "Knowledge Acquisition."
      *   Map "Pioneer Bonus" to "Knowability Principle."
      *   Map "Rejection" to "Contradiction."

  9.  **Addressing the "What Goes Wrong":**

      *   *Risk:* They ignore the bonus.
      *   *Fix:* "The Market Crash." If no Pioneer Bonus is claimed by minute 45, the value of standard points halves. Economic pressure.
      *   *Risk:* 8 Students.
      *   *Fix:* Fewer cards, same logic.

  10. **Final Review against Constraints:**

      *   British English? Yes.
      *   No forbidden words before debrief? Yes.
      *   Spoiler role defined? Yes.
      *   Materials printable in 1 hour? Yes (simple text).
      *   Logic accurate? Yes, maps $K(p \land \neg Kp) \to \bot$.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Check:* Did I ensure the verification rule blows up the claim *in front of them*?
      *   *Adjustment:* The verification procedure must require writing the claim on the board *to verify it counts as an announcement*.
