  # 6. Limitations of the Activity

  **Feature the Game Cannot Reproduce: Modal Collapse vs. Temporal Falsification**
  The game demonstrates that $p \land \neg \text{Announced}(p)$ cannot be *actually* announced in *this* room at *this* time without becoming false. This is a temporal, pragmatic contradiction.
  The Fitch Paradox argues something stronger: that $p \land \neg Kp$ cannot be *possibly* known in *any* accessible world. The game shows the truth *perishing* when learned. The argument shows the truth *could never have been* learnable in the first place.
  *   **Your Verbal Supply:** You must explain in the debrief that the game models the *consequence* of the knowledge operator, but the paradox concerns the *existence* of the operator itself. The game shows the explosion; the logic proves the bomb was wired into the wall.

  **Feature the Game Cannot Reproduce: The Single Knower**
  The game uses a distributed group (14 students) to model a single epistemic agent ($K$).
  *   **The Gap:** In the game, "Nobody knows" means "No student has stood up." In the logic, "Nobody knows" means "It is not in the set of propositions entailed by the agent's evidence."
  *   **Your Verbal Supply:** You must clarify that the "Public Log" represents the *idealised* knowledge state of a single knower, not the aggregate knowledge of a seminar group. The "Registrar" is not a person, but the closure rule of the knowledge set.

  **Frank Statement:**
  "The game convinces you that *saying* it makes it false. The argument proves that *knowing* it makes it impossible. The gap between 'saying' and 'knowing' is where the real philosophy lives. I have given you the intuition; you must now do the work to bridge the modality."
