answer: |-
  # 1. The Game: "The Verification Market"

  ## Materials List (Preparation Time: < 60 mins)
  *   **The Public Log:** One large sheet of A3 paper or whiteboard space titled "The Public Log". Placed at the front.
  *   **The Ledger:** A clipboard with a score table (Student Name | Standard Points | Pioneer Points | Total).
  *   **Truth Envelopes:** 20 white envelopes.
      *   15 contain **Standard Truths** (printed slips).
      *   5 contain **Pioneer Truths** (printed slips).
      *   *Content:* See "Printable Materials" below.
  *   **Room Fact Cards:** 5 index cards placed face-down on random desks before students arrive. Each has a simple truth written on the underside (e.g., "This desk has a scratch on the left").
  *   **Tokens:** 50 small items (paperclips, counters, or printed "Citation Tokens").
  *   **Role Card:** One specific card for the "Spoiler" student (The Registrar).
  *   **Writing Implements:** Markers for the Log, pens for students.

  ## Printable Materials

  **A. Standard Truth Slips (15 copies)**
  > **TRUE PROPOSITION**
  > *Verify this statement to claim 1 Citation Token.*
  >
  > "The window in this room is closed."
  > *(Or: "There are more than ten chairs in this room." / "The tutor is wearing shoes." / "2 + 2 = 4.")*
  >
  > **Rule:** Stand, read the proposition aloud. The class must agree it is true. The Registrar writes it on The Public Log. Collect 1 Token.

  **B. Pioneer Truth Slips (5 copies)**
  > **TRUE PROPOSITION (HIGH VALUE)**
  > *Verify this statement to claim 10 Citation Tokens.*
  >
  > "The content of this envelope is true AND this content is not yet on The Public Log."
  >
  > **Rule:** Stand. Read the proposition aloud. You must demonstrate both conjuncts.
  > 1. Show the content is true.
  > 2. Show the content is not on The Public Log.
  > The Registrar will verify. If successful, the proposition is written on The Public Log. Collect 10 Tokens.

  **C. Student Instruction Sheet (1 per student)**
  > **THE VERIFICATION MARKET: RULES**
  >
  > 1.  **Objective:** Accumulate Citation Tokens. The student with the most tokens at the end of the session gains **First Priority Choice of Essay Topic** for this module. (Ties are broken by Pioneer Points).
  > 2.  **Assets:** Truths are located in envelopes around the room and under index cards on desks.
  > 3.  **Announcement:** To score, you must stand and announce a truth.
  > 4.  **Verification:** The Registrar (your classmate at the front) decides if your verification is successful.
  > 5.  **The Log:** No point is awarded until the Registrar writes the proposition on The Public Log.
  > 6.  **Validity:** You may only announce propositions that are *true*. Announcing a falsehood results in a penalty of -5 Tokens.
  > 7.  **Conjunctions:** If you announce 'A and B', both A and B must be verified separately.

  **D. The Registrar's Private Brief (For the "Spoiler" Student)**
  > **CONFIDENTIAL: ROLE OF THE REGISTRAR**
  >
  > You are the gatekeeper of The Public Log. Your job is to enforce the Verification Rules strictly.
  >
  > **Special Instruction:** If a student attempts to claim the **Pioneer Truth** (10 Tokens):
  > 1.  Allow them to begin verification.
  > 2.  When they claim the second conjunct ("...is not yet on The Public Log"), pause them.
  > 3.  Ask only this question: **"If I write this on the Log to award your points, will that second part still be true?"**
  > 4.  Do not answer your own question. Do not mention logic, paradox, or knowledge. Wait for the class to resolve the contradiction.
  > 5.  If they cannot resolve it, the claim is invalid. Points are not awarded.
  >
  > *Note: You know the solution. Do not reveal it. Your silence is the lesson.*

  ## Scoring Scheme
  *   **Standard Point:** 1 Citation Token.
  *   **Pioneer Point:** 10 Citation Tokens.
  *   **Penalty:** -5 Tokens for false announcement.
  *   **Value:** Citation Tokens determine the order in which students select their assessed essay topics. In a competitive MA programme, securing the first choice of topic is a significant advantage (worth roughly 5–10 hours of research time saved).

  ## Round Structure
  *   **Phase 1 (Discovery):** Students circulate, open envelopes, find cards.
  *   **Phase 2 (The Market):** Students stand and announce truths to the Registrar.
  *   **Phase 3 (The Crash):** When the Pioneer claims fail, trading or discussion may occur.
  *   **Phase 4 (Close):** Tally scores.

  ## Verification Procedure
  1.  Student stands and states proposition $P$.
  2.  Student provides evidence for $P$.
  3.  Registrar checks The Public Log.
  4.  If $P$ is true and not already on the Log, Registrar writes $P$ on the Log.
  5.  Tokens are awarded *after* writing.

  ***

  # 2. Decision on Proposition Authorship

  **Decision:** **Pre-printed propositions (with a minor mixture of room facts).**

  **Reasons:**
  1.  **Control of Logical Form:** The Fitch paradox relies on a specific structural relationship between a truth $p$ and the knowledge operator $K$. If students author their own propositions, they will likely choose simple atomic truths ("The bin is full"). They will not naturally construct the conjunction required for the Pioneer Bonus ("$p$ is true and $p$ is unannounced"). Pre-printing the Pioneer slips ensures the logical structure is present in the room without you having to dictate it.
  2.  **Preventing Drift:** Student-authored truths risk becoming subjective ("This seminar is interesting") or indexical in a way that complicates verification ("I am sitting here"). Pre-printed truths ensure objective verifiability, keeping the focus on the *status* of the truth (announced vs. unannounced) rather than the *content*.
  3.  **The "Spoiler" Constraint:** Since one student knows the paradox, allowing them to author propositions might allow them to subtly steer the class toward the solution too early. Pre-printed materials democratise the information; the "Spoiler" only has an advantage in their role as Registrar.
  4.  **Room Facts:** Including 5 face-down cards with room facts adds a layer of "discovery" to keep the game engaging, but the critical logical work is done by the envelopes.

  ***

  # 3. Minute-by-Minute Plan (90 Minutes)

  | Time | Phase | Activity | Notes |
  | :--- | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute Instruction Sheets. Assign the **Registrar** role (hand the Private Brief secretly to the "Spoiler" student). Place envelopes/cards. | Ensure the Registrar sits at the front with The Log. Do not explain the paradox. |
  | **10–35** | **Phase 1** | **The Standard Market.** Students circulate, open Standard Envelopes, and announce truths. Registrar logs them. | Expect a rush of 1-point claims. The Log fills up. Atmosphere is energetic. |
  | **35–45** | **Phase 2** | **The Pioneer Incentive.** Announce that "Rare Envelopes" (Pioneer Slips) have been found. Remind them of the 10-token value. | Students will begin attempting the Pioneer claims. The Registrar follows their Private Brief. |
  | **45–60** | **Phase 3** | **The Stall.** Students attempt the Pioneer claim. The Registrar asks the forcing question. The room realises the contradiction. | **Critical Moment.** If no one attempts the claim by min 50, announce: "Standard points are now halved due to market saturation." This forces risk-taking. |
  | **60–75** | **Phase 4** | **Discussion.** Students debate why the 10-token claim is impossible. Registrar remains silent on the *why*, only ruling claims invalid. | Let them struggle. They should articulate that writing it down makes it false. |
  | **75–90** | **Debrief** | **Formal Mapping.** You take the board. Map game events to logical notation. Reveal the name of the paradox. | See Section 4. |

  ***

  # 4. Debrief Mapping

  **Introduction:** "You have just encountered a limit on what can be successfully announced in a system where announcement constitutes knowledge. Let us translate this into the logic you know."

  | Game Event | Logical Move / Formal Epistemology |
  | :--- | :--- |
  | **The Public Log** | The set of known propositions, $K$. To be on the Log is to be Known ($Kp$). |
  | **Announcing a Truth** | The act of coming to know. Moving from $p$ to $Kp$. |
  | **Standard Claim ($p$)** | Asserting $p$. Verified as true. Logged. $Kp$ is achieved. |
  | **Pioneer Claim ($p \land \neg \text{Log}(p)$)** | Asserting $p \land \neg Kp$. (An unknown truth). |
  | **Verification Rule** | **Factivity & Distribution.** To verify $A \land B$, both must be true. To Log the claim is to Know the claim ($K(p \land \neg Kp)$). |
  | **The Registrar's Question** | **The Contradiction.** If $K(p \land \neg Kp)$, then $Kp \land K(\neg Kp)$ (Distribution). If $K(\neg Kp)$, then $\neg Kp$ (Factivity). So $Kp \land \neg Kp$. |
  | **The Invalid Claim** | The proposition $p \land \neg Kp$ cannot be known. $\neg \Diamond K(p \land \neg Kp)$. |
  | **The Conclusion** | If all truths are knowable (Pioneer Bonus exists), there can be no unknown truths (Pioneer claims fail). $\forall p (p \to Kp)$. |

  **The Two Lines of Response:**
  1.  **Restriction (Anti-Realism):** Deny the Knowability Principle. Some truths (specifically Moorean sentences like "$p$ and nobody knows $p$") are true but *not* knowable. The game biased you here: you saw the claim fail physically.
  2.  **Acceptance (Verificationism):** Accept that all truths are known. If a truth cannot be known, it is not a truth. This is the "collapse" you felt when the 10-token prize vanished.

  **Admission of Bias:**
  "This game has biased you towards **Restriction**. By making the 'Log' a physical, temporal board, I showed you that *actually* writing the claim destroys its truth. This makes it feel like a practical limitation of the room. The formal argument, however, claims this is a *logical* necessity in any possible world. The game makes the restriction feel intuitive; the logic makes it feel terrifying."

