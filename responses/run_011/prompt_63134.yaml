  # 5. Troubleshooting & Scaling

  **Predictable Failure: The "Safe Play" Problem**
  *   **Risk:** Students realise the Pioneer claim is tricky and stick to Standard claims to avoid the -5 penalty. The central moment never occurs.
  *   **Forcing Move:** At Minute 50, if no Pioneer claim has been attempted, intervene as the "Market Regulator." Announce: *"Due to inflation, Standard Tokens are now worth 0.5. Pioneer Tokens remain 10. Furthermore, the Market will close in 10 minutes."*
  *   **Why this works:** It alters the expected utility. Playing safe guarantees a low score (and poor essay topic choice). Risking the invalid claim becomes the rational choice, forcing the confrontation.

  **Predictable Failure: The "Spoiler" Speaks**
  *   **Risk:** The Registrar gets impatient and explains the answer.
  *   **Mitigation:** The Private Brief explicitly states: *"Your silence is the lesson."* Remind them before the session that their grade for *this seminar* depends on their ability to facilitate without lecturing.

  **Scaling Down (8 Students)**
  *   **Adjustment:** Reduce Standard Envelopes to 8. Reduce Pioneer Envelopes to 3.
  *   **Logic:** The paradox does not depend on the number of agents, but on the definition of the "Log." With fewer students, the Log fills slower.
  *   **Compensation:** Increase the value of "Room Facts" (the face-down cards) to ensure enough activity. The logical contradiction remains identical regardless of group size, as the "Knower" in the logic is modelled by the collective "Log," not individual heads.

