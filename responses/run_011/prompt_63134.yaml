      *   *Okay, let's finalize the 'Pioneer Bonus'.*
      *   Points: 1 for standard truth. 10 for Pioneer Truth ($p \land \neg \text{Board}(p)$).
      *   Procedure: Stand, State $p$, State "This is not on the board." Show evidence.
      *   If they do this, the class sees: "But now you've said it, so it's on the board."
