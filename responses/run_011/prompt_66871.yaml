answer: |-
  **NOMENCLATURE: THE STYLE MANUAL FOR THE DESCRIPTION OF EVENTS**
  **Eleventh Edition**
  **Secretariat's Office of Terminology**

  **NOTE FROM THE EDITORIAL BOARD**
  Drafters are advised that the Provisional Adjective Bank is nearly exhausted. Drawdowns for *unprecedented*, *systematic*, and *grave* exceeded quarterly allocations by 14% in the last cycle. The Board recommends a return to verbs where possible. Verbs carry fewer liabilities. Please note that the Substantiation Ladder has been updated; no annex for Rung 4 or above has yet been countersigned by a legal officer. This remains the case.

  > **SIDEBAR: THE SUBSTANTIATION LADDER**
  > **Rung 0:** Rumor. (No citation required.)
  > **Rung 1:** Unverified Report. (Source anonymous.)
  > **Rung 2:** Confirmed Incident. (Two independent observers.)
  > **Rung 3:** Pattern of Conduct. (Secretariat assessment.)
  > **Rung 4:** Protected Classification. (Requires annex countersigned by legal officer.)
  > **Rung 5:** Judicial Determination. (Final judgment.)
  > *Note: No annex for Rung 4 or above has ever been countersigned. Drafters should aim for Rung 3.*

  **ADJECTIVE, PROVISIONAL**
  **Usage:** Permitted only when nouns are restricted by the Moratorium Register.
  **Register:** High. Implies severity without triggering Article I.
  **Clearance:** Level 2. Must be drawn from the Bank.
  **See also:** Moratorium; Verb, Active.

  **CLEANSING, ETHNIC**
  **Usage:** Admissible precisely because it appears in no treaty and therefore obliges no one.
  **Register:** Neutral. Describes movement without implying intent to destroy.
  **Clearance:** Level 1. No legal officer signature required.
  **See also:** Genocide; Moratorium.

  **GENOCIDE**
  **Usage:** Restricted. Article I of the 1948 Genocide Convention: "The Contracting Parties confirm that genocide, whether committed in time of peace or in time of war, is a crime under international law which they undertake to prevent and to punish." Article II defines genocide as "any of the following acts committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such," and then enumerates five acts. Note what the enumeration leaves out and what it adds: political and social groups are not protected categories, and the crime requires a purpose to destroy a group rather than a pattern of killing however large.
  **Register:** Rung 5 only.
  **Clearance:** Level 5. Requires final judgment.
  **See also:** Undertaking; Prevention.

  **INCIDENT**
  **Usage:** Preferred for isolated events involving casualties.
  **Register:** Low. Suggests aberration rather than policy.
  **Clearance:** Level 1.
  **See also:** Situation; Zone.

  **MORATORIUM**
  **Usage:** Refers to the Register of words retired this cycle. Includes *massacre* and *purge*.
  **Register:** Administrative.
  **Clearance:** Level 3.
  **See also:** Cleansing, Ethnic; Adjective, Provisional.

  **PREVENTION**
  **Usage:** To be employed only where the undertaking could be honoured. A word which triggers an undertaking to prevent is a word that should be spent only where the undertaking could be honoured, and that promiscuous use devalues the accusation for those who will need it later.
  **Register:** Obligatory. Implies capacity to act.
  **Clearance:** Level 4. Requires annex (never countersigned).
  **See also:** Genocide; Undertaking.

  **SITUATION**
  **Usage:** Generic container for evolving conditions.
  **Register:** Vague. Allows for escalation or de-escalation without revision.
  **Clearance:** Level 0.
  **See also:** Incident; Zone.

  **TESTIMONY**
  **Usage:** Breakdown protocol. When a witness uses the noun aloud in testimony and the Office must decide how to render it in print, the noun shall be replaced by [REDACTED CLASSIFICATION]. The transcript remains raw; the public record must be sanitized.
  **Register:** Contaminated.
  **Clearance:** Level 3.
  **See also:** Genocide; Voice, Passive.

  **TENSE, PROTECTED**
  **Usage:** A protected noun may appear only in the past tense and only after the relevant chamber has closed, since the gerund would imply an obligation still running.
  **Register:** Historical.
  **Clearance:** Level 4.
  **See also:** Genocide; Prevention.

  **UNDERTAKING**
  **Usage:** Refers to the duty to prevent and punish. Use only when Member States are not the agent.
  **Register:** Legalistic.
  **Clearance:** Level 4.
  **See also:** Prevention; Genocide.

  **VOICE, PASSIVE**
  **Usage:** Mandatory wherever the agent is a party to the instrument, on the stated ground that agency is a matter for the Security Council.
  **Register:** Bureaucratic. Removes liability from subject.
  **Clearance:** Level 2.
  **See also:** Undertaking; Testimony.

  **ZONE**
  **Usage:** Geographic descriptor. Prefer *area of interest* to *occupied territory*.
  **Register:** Spatial.
  **Clearance:** Level 1.
  **See also:** Situation; Incident.

  *The Secretariat assumes no liability for events described herein. The description is not the event. The noun is not the duty. Drafters are reminded that the ideal document would consist entirely of adjectives. Where nouns are unavoidable, ensure they are dead.*
