answer: |-
  This is a classic and very sharp objection to Kant's ethics. You have identified one of the most frequently discussed tensions in his moral philosophy. The short answer is: **It is not a flat-out inconsistency within Kant's system, but it does rely on a specific distinction between the *ground* of morality and the *application* of morality.**

  Here is a breakdown of how Kant reconciles the *Groundwork* passage with the *Doctrine of Virtue* (and *Lectures on Ethics*), addressing your three specific questions.

  ### 1. The A Priori Principle vs. Empirical Application
  You asked if the empirical claim about human psychology undermines the a priori nature of the obligation.

  Kant distinguishes between the **Metaphysics of Morals** (the a priori principles) and **Moral Anthropology** (the empirical conditions for applying those principles).

  *   **The A Priori Duty:** The supreme obligation here is a duty to **oneself**. Specifically, it is the duty to preserve and perfect one's own moral agency ("humanity in your own person"). This is derived a priori. You must not degrade your own capacity for morality.
  *   **The Empirical Link:** The claim that "cruelty to animals coarsens human sympathy" is an empirical claim about human psychology.

  **The Analogy:** Think of the duty to preserve your life. The command "Do not destroy your moral agency" is a priori. But the command "Do not drink arsenic" relies on the empirical fact that arsenic kills you. If arsenic didn't kill you, the specific prohibition against drinking it would vanish, but the general duty to preserve your life would remain.

  Similarly, for Kant, the duty is "Do not damage your moral sensitivity." The statement "Animal cruelty damages moral sensitivity" is the empirical premise.
  *   **To your specific question:** Would it still be a duty if humans had no such predisposition? **No.** If humans were constituted such that torturing a dog had zero impact on their treatment of rational beings, Kant would logically have to concede there is no duty regarding the dog. The *obligation* is a priori (duty to self), but the *object* of the restriction (the dog) enters the picture only via empirical facts about human nature.

  So, the *Groundwork* passage forbids making human nature the *source* of the moral law (e.g., "Lying is wrong because it causes social instability"). It does not forbid using human nature to determine *where* the moral law applies (e.g., "Preserve your moral capacity; empirically, this requires treating animals well").

  ### 2. Duty *To* vs. Duty *With Regard To*
  You hit the nail on the head here. This distinction is the structural key to the whole issue.

  *   **Duty *To* (Direct Duty):** Requires the other party to be a rational agent (a "person"). Only rational beings can impose obligations on us because only they are "ends in themselves."
  *   **Duty *With Regard To* (Indirect Duty):** The action involves an entity that is not a rational agent (an animal, a plant, even an inanimate object like a work of art), but the moral constraint comes from our duty to humanity (either in ourselves or others).

  **Does the *Groundwork* passage ("not valid for men alone") do any work here?**
  Yes, but it refers to **moral agents**, not **moral patients**.
  When Kant says the law must be valid "not for men alone," he means that any rational being (an angel, an alien, God) is bound by the Categorical Imperative. He is *not* saying that every living thing must be a recipient of moral duty.
  *   **Agents:** Who is bound by the law? (All rational beings).
  *   **Patients:** Who can be wronged directly? (Only rational beings).

  So, the *Groundwork* passage ensures that the *law* binding you not to torture the dog is universal (any rational being with human-like psychology would be bound by it), but it doesn't grant the dog moral status. The dog is the *occasion* for the duty, not the *source* of the duty.

  ### 3. The "Unmoved Agent" Objection
  This is the hardest bullet for Kant to bite. If a person says, "I can torture this dog and it will not affect my sympathy toward humans," does Kant have to say they are permitted to do it?

  Kant has three resources to avoid this conclusion, though none are entirely satisfying to modern readers:

  1.  **Epistemic Humility / Risk:** Kant argues that we cannot know for certain that the spillover effect won't happen. Because the risk to one's moral character is high, the maxim of cruelty is forbidden prudentially and morally. You cannot gamble with your moral disposition.
  2.  **The Property Argument:** In the *Doctrine of Virtue*, Kant notes that animals are often someone's property. Cruelty to a dog might violate a direct duty to the *owner* of the dog.
  3.  **Vice as a Corruption of Will:** Kant suggests that cruelty is a vice not just because of consequences, but because it violates the duty of self-perfection. Even if the "sympathy" argument failed, the *maxim* of inflicting suffering for pleasure is contrary to the virtue of benevolence which we are commanded to cultivate in ourselves.

  **Does he bite the bullet?**
  In the *Lectures on Ethics* (Collins transcript), Kant is quite explicit: *"If a man shoots his dog because the animal is no longer capable of service, he does not fail in his duty to the dog... but his act is inhuman and damages in himself that humanity which it is his duty to show towards mankind."*

  If a person truly lacked that humanity (a "moral monster"), Kant's system struggles. However, Kant generally assumes that "humanity" (the predisposition to moral feeling) is a universal feature of human beings. He treats the link between animal cruelty and moral degradation as a law of **pragmatic anthropology**. He isn't saying "It usually coarsens you"; he is saying "It *necessarily* coarsens you, as a matter of human nature."

  So, he doesn't concede the point to the psychopath. He argues the psychopath is empirically mistaken about their own psychology.

  ### Summary
  You aren't misreading the scope of the *Groundwork* passage. The tension is real, but Kant resolves it by separating the **validity of the law** (a priori, universal to all rational agents) from the **conditions of its application** (empirical facts about human psychology and the status of animals).

  *   **Is it inconsistent?** No, provided you accept the distinction between the *ground* of obligation (Reason) and the *locus* of obligation (Humanity in oneself).
  *   **Is the To/Regarding distinction key?** Yes, absolutely.
  *   **The Unmoved Agent:** Kant argues this agent is empirically impossible (or at least, we can never assume we are that agent), so the duty holds universally for all actual humans.

  **A Note on Translation:** You mentioned Abbott. It is public domain and readable, but it is from 1889 and sometimes takes liberties to make Kant sound more "Victorian." If you continue with the *Groundwork*, the **Gregor** (Cambridge) or **Wood** (Yale) translations are much more precise with technical terms like "necessity," "maxim," and "humanity." It might help clarify these distinctions further.
