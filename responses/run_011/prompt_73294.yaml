      *   *Nuance:* The "Groundwork" passage is about the *source* of the law. The "Doctrine of Virtue" is about the *scope* of application.
      *   *Translation Note:* Abbott is indeed old. Suggest Gregor or Wood if they continue reading, but Abbott works for this passage.
      *   *Key Text:* Reference *Lectures on Ethics* (Collins) where Kant is even clearer on the "analogy" argument (treating animals like humans to practice for humans).

  9.  **Final Polish:** Check against the user's specific questions to ensure all are answered directly. (Yes, Q1, Q2, Q3 are all addressed in the plan).

  *(Self-Correction during drafting)*: I need to be careful with the "unmoved agent" point. Kant doesn't exactly bite the bullet that it's *okay*, he argues it's empirically impossible to be that agent without degradation. But logically, if the link is broken, the duty vanishes. I should clarify that distinction.

