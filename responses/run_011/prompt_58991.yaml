answer: |-
  You have put your finger on one of the most persistent and methodologically significant errors in evolutionary biology. It is well-documented in the literature, though it often hides under broader labels.

  The specific argumentative move you are describing is the **Conflation of Current Utility with Evolutionary Origin**.

  While this is the engine of **Adaptationism** (or the "Panglossian Paradigm"), there is a more precise technical carving for the logical step you are isolating. In the philosophy of biology and rigorous evolutionary methodology, this is distinguished as the confusion between **Causal Role (CR) Functions** and **Selected Effect (SE) Functions**.

  Here is the breakdown of the concept, the literature, the dialectical move, and the boundary conditions you asked for.

  ### 1. The Core Concept: Utility vs. Origin
  The error is treating evidence of **Current Utility** (what the trait does *now*) as sufficient evidence for **Evolutionary Origin** (why the trait was selected *then*).

  *   **Current Utility (Ahistorical):** The trait currently contributes to fitness. (e.g., Fingerprints increase wet friction).
  *   **Evolutionary Origin (Historical):** The trait evolved *because* it contributed to fitness in the past. (e.g., Fingerprints were selected *for* wet friction).

  The move you are spotting is the inference: **Utility $\rightarrow$ Origin**.
  This inference is invalid without additional premises. A trait can be useful now but have originated as a byproduct (spandrel), a developmental constraint, or via selection for a *different* function (exaptation).

  ### 2. The Technical Terminology
  If you want the precise philosophical "handle" for this, it is the **Selected Effect (SE) vs. Causal Role (CR) Distinction**.

  *   **Causal Role Function (Cummins, 1975):** What a part *does* in the current system. (Your friction measurements live here).
  *   **Selected Effect Function (Millikan, 1984; Neander, 1991):** What the part was *selected to do* in its evolutionary history. (The "why it is there" claim lives here).

  The fallacy is **Inferring SE from CR**. Just because a part *has* a causal role that is beneficial does not mean that causal role is its *selected effect*.

  **Key Literature:**
  *   **Reeve, H. K., & Sherman, P. W. (1993). "Adaptation and the Goals of Evolutionary Research."** *The Quarterly Review of Biology*.
      *   This is the paper that most explicitly carves out the distinction you are looking for. They argue that researchers routinely measure "current utility" but label it "adaptation" (history). They propose that the terms should be kept strictly separate to prevent exactly the rhetorical slide you are observing.
  *   **Williams, G. C. (1966). "Adaptation and Natural Selection."**
      *   Williams established that adaptation is a "special and onerous" concept. He argued that utility alone is never sufficient to prove adaptation; one must rule out alternatives (drift, pleiotropy, etc.).
  *   **Gould, S. J., & Lewontin, R. C. (1979). "The Spandrels of San Marco and the Panglossian Paradigm."**
      *   While you mentioned knowing the general "-ism," this paper specifically attacks the *method* of assuming utility implies history. They argue that functional measurement is compatible with non-adaptive origins.

  ### 3. The Dialectical Move: "Evidentiary Irrelevance"
  You asked about the specific reply: *"But the function is real, we measured it."*

  In logic, this is a form of **Evidentiary Irrelevance** (or a Red Herring regarding the historical claim). When challenged on the *history* of the trait, the author defends with *mechanics* of the trait.

  *   **Question:** "Is this trait here *because* of selection for J?" (Historical/Ultimate question).
  *   **Answer:** "We measured that it *does* J well." (Mechanical/Proximate answer).

  This is also a **Tinbergen Category Error**. Niko Tinbergen's Four Questions distinguish between **Function (Survival Value)** and **Evolution (Phylogeny)**. The move you are seeing answers a Phylogeny question with Function data.

  In the literature, this rhetorical defense is often implicitly criticized as **shifting the burden of proof**. The default assumption (per Williams) should be that a trait is *not* an adaptation until proven otherwise. By presenting utility data, the author acts as though they have met the burden of proof for adaptation, when they have only met the burden for utility.

  ### 4. The Carving: Valid vs. Invalid Inference
  You asked for boundary conditions: where does the inference go wrong, and where is it legitimate? It *is* possible to argue from function to origin, but utility data alone is never enough.

  **Invalid Inference (The Fallacy):**
  *   **Data:** Measurement of current performance (friction, load bearing).
  *   **Claim:** The trait evolved for this performance.
  *   **Missing:** Phylogenetic history, cost-benefit analysis, alternative hypothesis testing.
  *   **Why it fails:** It ignores the "History vs. Utility" gap. A chin might resist loads (utility) but exist because of developmental coupling with tooth buds (origin).

  **Valid Inference (The Adaptationist Program done correctly):**
  To legitimately move from "does job J" to "is there because of J," a paper must include:
  1.  **Utility Data:** (The friction measurement).
  2.  **Phylogenetic Reconstruction:** Showing the trait appeared concurrently with the selective pressure (e.g., did ridges appear when ancestors moved to wet environments?).
  3.  **Optimization Evidence:** Showing the trait is *better* at J than plausible alternatives (showing it was tuned by selection, not just a byproduct that happens to work).
  4.  **Ruling Out Constraints:** Explicitly testing and rejecting the "Spandrel" hypothesis (e.g., showing the ridges are not just a necessary side-effect of fingerprint development).

  ### 5. Why It Feels Distinct to You (The Engineering Bias)
  You noted this happens even in careful papers. One reason is that biomechanics attracts engineers. In **Engineering**, Function $\rightarrow$ Design Intent is a valid inference. If you find a gear in a machine that reduces friction, you can safely infer it was put there to reduce friction.

  In **Evolution**, there is no "Designer," only a blind process. The move you are spotting is an unconscious **Reverse Engineering Fallacy**. It treats Natural Selection as a human engineer who puts parts in for specific jobs. When a biologist measures a part working well, their engineering intuition says "This was designed for this," but their evolutionary training should say "This might just be a lucky accident."

  ### Summary
  *   **Established Concept:** The **Current Utility vs. Evolutionary Origin** distinction.
  *   **Philosophical Label:** Conflating **Causal Role (CR)** with **Selected Effect (SE)** functions.
  *   **The Fallacy:** **The Adaptationist Fallacy** (specifically the inferential step from utility to history).
  *   **The Dialectic:** Answering an **Ultimate (History)** question with **Proximate (Mechanism)** evidence.
  *   **The Fix:** Utility data is *necessary* but not *sufficient* for adaptation claims. It requires phylogenetic and constraint-based evidence to bridge the gap.

  If you need a phrase to use in discussion, **"The Utility-Origin Conflation"** is descriptively accurate, but citing **Reeve & Sherman (1993)** regarding the separation of **Adaptation** and **Current Utility** is the authoritative way to flag this error in a paper.
