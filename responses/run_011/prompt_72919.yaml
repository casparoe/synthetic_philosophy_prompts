  **Scratch Work: Concessions Under Pressure**

  *   **Skeptic:** Must concede that expected value (EV) math isn't *false*, just morally inert at this scale. Must concede she isn't saying *no* individual act ever matters (e.g., clearing out a shelf). Must concede that if the supply chain were transparent and linear, her view would collapse. Must admit "complicity" needs a definition that doesn't just smuggle in causal impact.
  *   **Theorist:** Must concede that no specific bird dies *because* of this specific carton (no deterministic causation). Must concede the tolerance band creates literal zones of zero marginal impact. Must admit the EV is vanishingly small (perhaps 10^-6 of a bird). Must admit that if the Skeptic's complicity view yields the same action guidance, the fight is mostly semantic.
  *   **Shared Coldwater Reality:** Both agree the 15-month lag and 15% tolerance band insulate production from weekly retail noise. Both agree batching (crates/trucks/flocks) creates non-linearity. Both agree the forecast algorithm smooths out individual data points.
  *   **The Real Fight:** Is a 10^-6 probability of causing suffering morally equivalent to 10^-6 of a unit of suffering? (Theorist: Yes. Skeptic: No, it's noise.) Is participation wrong even if causally inert? (Skeptic: Yes. Theorist: Only instrumentally.)

