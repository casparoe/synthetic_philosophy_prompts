answer: |-
  Dear Friend,

  It is completely understandable why you are finding this conversation so exhausting, especially given the stakes involved for your community. The phrase social construct is one of the most overloaded terms in modern discourse, and it is being used in your forum to do three completely different jobs at once. To untangle this, we need to look at the phrase not as a single claim but as a spectrum of claims ranging from the trivial to the extreme. At the weakest and most trivial end, the claim is that medical categories and definitions are human inventions. This is settled fact. Where we draw the line between high normal blood pressure and hypertension, or what temperature counts as a fever, is decided by committees of humans, not by nature itself. Nature provides the continuous variation, but humans draw the boxes. This claim is true, it is not seriously debated by philosophers of medicine, and what settles it is simply looking at how diagnostic manuals change over time. However, this version of the claim does not imply the underlying biology is fake, only that the label is a tool we created to manage it.

  Moving up the scale, the second claim is that the legitimacy of suffering is socially determined. This argues that society decides which pains count as real illness and which count as moral failings or laziness. This is also largely true and historically well-documented. We know that conditions like hysteria or drapetomania were used to control specific groups, and we know that stigma affects who gets believed. What settles this is historical record and sociological data showing disparities in who gets diagnosed and treated. This claim does not deny the biology of the patient, but it asserts that the social response to that biology is political. At the next level, the claim becomes that social factors can cause or sustain biological symptoms. This is where things become genuinely debatable. It is settled science that stress and environment affect biology, such as how poverty impacts life expectancy or how trauma changes brain chemistry. However, it is heavily disputed how much this applies to specific conditions like ME/CFS. Some argue the symptoms are primarily driven by social expectations and psychological feedback loops, while others argue the primary driver is viral or metabolic. There is no consensus here yet, and what would settle it is definitive biomarkers that exist independently of the patient's beliefs or social context.

  At the extreme end of the spectrum is the ontological claim, which is that the disease phenomenon itself does not exist independently of the concept. This version suggests that if we stopped talking about the condition, the symptoms would vanish because they are generated by the belief in the disease. This is generally considered false for conditions with clear physiological dysfunction, though it may hold true for some culture-bound syndromes. What would settle this is your upstairs test. If people still cannot walk upstairs even if everyone agrees the disease isn't real, then the impairment exists independently of the social concept. However, proponents of the extreme view might argue the test is rigged because the belief is internalized, but generally, persistent physiological collapse despite changed beliefs counts as evidence against this extreme claim.

  Now we can look at who is saying what in your specific situations. The GP who refused the referral is almost certainly relying on the extreme ontological claim, or at least implying it. When a doctor says a disease is a social construct to deny care, they are suggesting the symptoms are not real biological events but rather products of suggestion or social permission. They are using the phrase to mean the disease is not real. Conversely, the campaigner at the welfare meeting is using the weak or moderate claims. When they say the assessment criteria are political decisions dressed up as science, they are using the first claim about categories being human inventions. They are arguing that the threshold for who counts as disabled is a budgetary choice, not a biological fact. They are not saying the illness is fake; they are saying the gatekeeping mechanism is constructed.

  This leads directly to your question about which claim supports which conclusion. The GP's version, if true, would support writing off your member's diagnosis entirely because it denies the underlying reality of the suffering. If the disease is just a story we tell, there is nothing to treat. The campaigner's version, if true, supports the argument that benefits criteria are political rather than scientific. It accepts the suffering is real but argues the rules for compensating it are arbitrary human inventions. Crucially, these two jobs are mutually exclusive. You cannot use the campaigner's argument to protect the diagnosis while accidentally validating the GP's argument. The GP says the box is empty; the campaigner says the box is real but the lock is rigged.

  Regarding your upstairs test, you are right to be suspicious that it might be rigged, but it does prove something specific. It effectively disproves the extreme ontological claim. If the inability to walk persists regardless of social consensus, then the impairment is not merely a social construct in the strong sense. However, it does not settle the debate about classification. A proponent of the weak claim can agree with your test results and still say the category ME/CFS is a construct, just one that maps onto a real biological dysfunction. So the test proves the biology is real, but it does not prove the diagnostic label is natural rather than invented. It stops the GP from saying nothing is wrong, but it does not stop them from saying the wrong name is being used.

  The appendicitis reply from your member is a real objection but it is often used as a dodge. It is technically correct that all medicine involves social construction of categories. We decide where the appendix ends and the intestine begins, and we decide when inflammation becomes a surgical emergency. However, pointing this out can be a way of changing the subject from is this specific condition being unfairly targeted to all medicine is subjective. It is a valid defense against the idea that ME/CFS is uniquely fake, but it does not prove that ME/CFS has a biological basis. It levels the playing field but does not win the game. It is useful for highlighting the hypocrisy of the GP who accepts appendicitis but not ME/CFS, but it does not provide the biomarkers needed to settle the scientific dispute.

  Finally, to address where the fault lines run among people who work on this seriously. It is settled among philosophers and sociologists of medicine that diagnostic categories are human constructs and that social forces influence who gets diagnosed. It is not settled, and is the subject of intense conflict, regarding how much social construction influences the biological pathology itself in conditions like ME/CFS. Some researchers believe the mind-body interaction is so profound that social factors are primary causes, while others believe social factors are secondary to a primary pathogen. You are not missing a simple distinction; you are standing right on the fault line where philosophy meets clinical practice. The GP is using a philosophical critique to deny clinical reality, while the campaigner is using a philosophical critique to demand political change. Understanding that they are using the same words to describe different layers of the problem should help you see why the conversation feels like people are speaking past each other. The GP is attacking the existence of the illness, and the campaigner is attacking the administration of the support. Knowing this difference allows you to support the campaigner's argument about welfare without giving the GP any ammunition to deny the diagnosis.

  I hope this helps clarify the muddle without sending you off to read a stack of theory papers. It is a difficult position to be in as a moderator, but recognizing that the contradiction lies in the ambiguity of the phrase rather than in your own understanding should take some of the pressure off.

  Best wishes.
