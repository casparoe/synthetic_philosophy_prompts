  The practice is pragmatically coherent but theoretically hybrid, presupposing that personhood is a narrative project owned by the past self, yet subordinate to the present self's welfare. It treats advance directives not as absolute commands, but as evidence of what constitutes harm when the subject cannot speak.

  The binding signature relies on "precedent autonomy": you are the author of your life, entitled to determine its ending. This prioritizes authorship over psychological continuity, ruling out the view that personhood resets with cognitive capacity. However, the "contentment exception" reveals a safety valve. When the past self's abstract wishes clash with the present self's visible joy, clinicians prioritize non-maleficence over autonomy. They assume the past self wanted to avoid *suffering*, not necessarily to avoid *life* if life remains pleasant. This isn't self-undermining if the directive is interpreted as a shield against indignity rather than a death warrant. The past self retains sovereignty over the *shape* of the end, but not at the cost of the present self's immediate well-being.

  If you flipped to present-self sovereignty, the architecture collapses. Advance directives become advisory letters of values rather than binding orders. The family's role shifts from enforcing the dead will to advocating for current comfort. The cottage industry of precise legalistic forms would vanish, replaced by general value statements, because specific commands could always be overridden by a smile or a hummed tune.

  The risk of your current model is paternalism: clinicians deciding when a life is "worth" living despite prior refusal. The risk of the flipped model is betrayal: forcing a person to endure the existence they feared most, simply because their diminished self cannot remember the fear. Your committee sits precisely in that gap, adjudicating whether the past self's veto on suffering applies when suffering is absent.
