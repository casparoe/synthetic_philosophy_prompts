      *   **Prerequisites:** Know Ellsberg, know interval-valued credence definitions. Never *used* them practically.
      *   **Goal:** Two gut feelings: (a) Dilation (more evidence = less informed), (b) Coherent Imprecision $\rightarrow$ Decision Paralysis (no Dutch book, but can't choose).
      *   **Constraints:**
          *   One 75-minute block.
          *   Physical engine: One opaque bag of 100 chips (Red/Black). Range of Reds is known.
          *   Dilation trigger: True announcement about a *second* bag (irrelevant to the first, ostensibly).
          *   Correlation planting: If correlation is needed, plant it early in rules without explanation.
          *   Math: Specific numbers, show arithmetic for intervals before/after. Specify update rule.
          *   Ledger: Students *must* write intervals. Collapsing to points must be penalized by game mechanics, not just instruction.
          *   Betting Desk: Must induce paralysis (rejecting both bets) via a defensible rule.
          *   Terminology: No "dilation" or specific decision rule names until debrief.
          *   Payoff: No real money. Something grad students care about, zero cost, no pressure.
          *   Debrief: Map moments to formal structure. Predict failures (including the "read-ahead" student). Acknowledge limitations (finite bag vs. true imprecision).
          *   Language: American English.

  2.  **Deconstruct the Core Problems:**

      *   **Dilation:** Standard example: $P(H) \in [0.4, 0.6]$. Partition $\{E, \neg E\}$. $P(H|E) \in [0.3, 0.7]$ and $P(H|\neg E) \in [0.3, 0.7]$. The interval widens after learning $E$ or $\neg E$.
