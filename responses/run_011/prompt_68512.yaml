  4.  **Developing the Betting/Paralysis Segment:**

      *   Students have intervals $[L, U]$.
      *   Bet 1: Win \$1 if Red, Lose \$1 if Black.
      *   Bet 2: Win \$1 if Black, Lose \$1 if Red.
      *   If $[L, U] = [0.4, 0.6]$.
      *   EU(Bet 1) $\in [0.4(1) + 0.6(-1), 0.6(1) + 0.4(-1)] = [-0.2, 0.2]$.
      *   EU(Bet 2) $\in [-0.2, 0.2]$.
      *   Rule: "Maximin" (Choose act with highest minimum EU).
      *   Min EU(Bet 1) = -0.2. Min EU(Bet 2) = -0.2. Min EU(Reject) = 0.
      *   Result: Reject both. Paralysis.
      *   *Constraint:* "At least one student... turns down two bets they'd each take on their own."
      *   *Constraint:* "Rule can't just be 'facilitator tells them not to'."
      *   *Solution:* The Scoring Rule.
      *   **Scoring Rule:** "Your score is the *minimum* expected utility you guaranteed yourself."
      *   If you accept Bet 1, your guaranteed score is -0.2.
      *   If you Reject, your guaranteed score is 0.
      *   Rational agent maximizing 'Guaranteed Score' rejects the bet.
      *   *Penalty for Collapsing:* If you write $[0.5, 0.5]$.
      *   EU(Bet 1) = 0. Min EU = 0.
      *   You are indifferent. But if the resolution mechanism forces you to post a price...
      *   **Mechanism:** "Market Maker".
      *   Student states $[L, U]$.
      *   Bank offers to Buy at $L$, Sell at $U$.
      *   If Student states $[0.5, 0.5]$, Bank Buys at 0.5 and Sells at 0.5.
      *   If Student is forced to take a side?
      *   **Better:** "The Ledger Audit."
      *   At the end, a chip is drawn.
      *   If you wrote $[L, U]$, your points = $1 - (Outcome - Midpoint)^2 - (Width)^2$? No.
      *   **Simple Penalty:** "If you write a point interval $[x, x]$, you are forced to bet at odds $x$. If you write $[L, U]$, you can choose to bet at $L$ or $U$ or not bet."
      *   This rewards flexibility (imprecision) and punishes false precision (point).
      *   **Payoff:** "Syllabus Veto." Top score gets to veto one reading.
      *   **Score Calculation:**
          *   Phase 1 (Prior): Write interval.
          *   Phase 2 (Posterior): Write interval.
          *   Phase 3 (Betting): Accept/Reject bets based on your interval.
          *   Resolution: Chip drawn.
          *   Points awarded for "Coherence".
          *   **Coherence Rule:** If you accepted a bet that had negative Min-EU given your *own* interval, you lose 5 points.
          *   If you rejected a bet that had positive Min-EU, you lose 2 points (opportunity cost).
          *   If you wrote a point interval $[x, x]$ and the outcome made you lose money at odds $x$, you lose 10 points (Dutch Book Penalty).
          *   If you wrote $[L, U]$ and lost money at odds $L$ or $U$, you lose 0 (Protected by spread).
          *   *This enforces the interval.*

