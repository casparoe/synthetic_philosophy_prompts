          *   *Solution:* I need to plant a rule that links the *uncertainty* of Bag 1 to the *outcome* of Bag 2, or structure the "evidence" such that it reveals information about the *bias* of the mechanism generating Bag 1's composition.
          *   *Better approach for the prompt:* The prompt says "about a second bag that the students will take to be irrelevant to theirs." If it's truly irrelevant, dilation doesn't happen. The prompt *also* says "If the whole trick depends on their prior admitting a correlation they'd have no reason to posit, then build that correlation into the rules earlier in the session without explaining why."
          *   *Decision:* I will build a dependency into the setup phase. Bag 1's composition is determined by a draw from Bag 2 (or a mechanism linked to it). Students won't realize the link until the announcement.
      *   **Decision Paralysis:** With imprecise credences $[L, U]$, if a bet pays $x$ if $H$ and $y$ if $\neg H$, Expected Utility is $[L \cdot x + U \cdot y, U \cdot x + L \cdot y]$ (roughly). If 0 is inside the interval of expected gain for *both* accepting and rejecting (or two different bets), you can't choose.
          *   *Specifically:* Bet A (on Red), Bet B (on Black). If $P(Red) \in [0.4, 0.6]$, EU(Bet Red) $\in [-0.6, 0.6]$ (assuming even money). EU(Bet Black) $\in [-0.6, 0.6]$. If the rule is "maximin" or "E-admissibility," you might reject both.
      *   **Penalty for Collapsing:** If a student writes $[0.5, 0.5]$, they are claiming precision. If the truth is imprecise, they should be vulnerable to a Dutch Book *in the game mechanics*.
          *   *Idea:* The scoring rule must reward honest interval width or penalize false precision. Brier score variants for intervals exist (e.g., DeGroot & Fienberg), but might be too complex for 75 mins.
          *   *Simpler Idea:* The "Bank" offers to buy/sell bets at the student's stated bounds. If they state $[0.5, 0.5]$, the Bank forces a trade at 0.5. If the actual frequency or outcome makes that lose, they lose points. If they state $[0.4, 0.6]$, the Bank only trades at 0.4 (buy) or 0.6 (sell), protecting them.
          *   *Refinement:* To make them *care* without money: Course credit? Too high stakes. "Bragging rights"? Too weak.
          *   *Prompt Requirement:* "Something 14 grad students will actually care about that costs me nothing."
          *   *Idea:* "The Exemption." The winner gets to skip a short assignment or choose a topic for a future class. Or, more simply, "The Syllabus Veto." The top scorer gets to veto one reading for the next unit. Grad students hate readings they think are useless. This is high value, zero cost.
          *   *Penalty Mechanism:* If you write a point credence, you are forced to post a single price. If you write an interval, you post a bid/ask spread. The game resolves, and scores are calculated. Point-credence players will get Dutch-booked by the resolution mechanism if the outcome falls outside their point but inside the rational interval.

