  ## Appendix B: Instructor Math Key (Dilation Arithmetic)

  **Prior:** $P(H) \in [0.4, 0.6]$.
  **Evidence:** $E$ (Bag 2 Red).
  **Likelihoods (per Rule Beta - Unknown Correlation):**
  We know $P(E|H)$ and $P(E|\neg H)$ sum to 1 *for a specific correlation*, but the correlation is unknown.
  Conservative bounds on Likelihood Ratio $\lambda = \frac{P(E|H)}{P(E|\neg H)}$:
  Assume $\lambda \in [0.5, 2.0]$. (Moderate ignorance).

  **Posterior Lower Bound:**
  $$ \frac{P(H)_{min} \cdot \lambda_{min}}{P(H)_{min} \cdot \lambda_{min} + P(\neg H)_{max} \cdot 1} = \frac{0.4 \cdot 0.5}{0.4 \cdot 0.5 + 0.6 \cdot 1} = \frac{0.2}{0.8} = 0.25 $$

  **Posterior Upper Bound:**
  $$ \frac{P(H)_{max} \cdot \lambda_{max}}{P(H)_{max} \cdot \lambda_{max} + P(\neg H)_{min} \cdot 1} = \frac{0.6 \cdot 2.0}{0.6 \cdot 2.0 + 0.4 \cdot 1} = \frac{1.2}{1.6} = 0.75 $$

  **Result:** $[0.4, 0.6] \rightarrow [0.25, 0.75]$. **Dilation Confirmed.**
