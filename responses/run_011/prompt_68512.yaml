  # Activity Design: The Two-Bag Protocol

  **Objective:** Force students to experience (a) Dilation (evidence widens credal intervals) and (b) Decision Paralysis (coherent imprecision prevents choice) without using jargon until the debrief.
  **Time:** 75 Minutes.
  **Students:** 14 Graduates.
  **Materials:**
  1.  **Bag 1 (Target):** Opaque, 100 poker chips (Red/Black).
  2.  **Bag 2 (Trigger):** Opaque, 10 poker chips (5 Red, 5 Black).
  3.  **Ledgers:** 14 printed sheets (see *Appendix A*).
  4.  **Payoff:** "The Syllabus Veto" (Winner chooses one reading to drop from the next unit).
  5.  **Board:** Whiteboard for tracking public announcements.

  ---

  ## Part 1: The Setup & The Plant (00:00 – 00:15)

  **00:00 – 00:05: Distribution**
  Hand out the **Ledgers**. Tell students: *"This is a scoring game. The winner gets the Syllabus Veto for Unit 3. Points are awarded for Coherence and Accuracy. Read the 'Scoring Rules' on page 1 now."*

  **00:05 – 00:15: The Physical Engine**
  Place Bag 1 and Bag 2 on the table.
  Read the **Protocol Card** verbatim (do not improvise):
  > "Bag 1 contains 100 chips. The number of Red chips is either 40 or 60. You do not know which.
  > Bag 2 contains 10 chips.
  > **Rule Alpha:** The composition of Bag 2 was determined by the same machine as Bag 1.
  > **Rule Beta:** The correlation between Bag 1's composition and Bag 2's composition is unknown. It could be positive, negative, or zero.
  > **Rule Gamma:** You must record credences as intervals $[L, U]$. If you record a point $[x, x]$, you are forced to post a single price. If you record an interval, you post a spread. Collapsing an interval to a point voluntarily triggers the 'Dutch Book Penalty' in the scoring rules."

  *Instructor Note:* Rule Beta is the plant. It establishes the *ignorance of correlation* required for dilation. Students will likely treat Bag 2 as irrelevant or assume independence. Rule Beta technically allows dependence without specifying it.

  ---

  ## Part 2: The Prior Ledger (00:15 – 00:25)

  **Task:** Students calculate their prior credence that a random chip drawn from Bag 1 will be Red.
  **Constraint:** They must write an interval.

  **The Math (For You):**
  *   Hypothesis $H$: Chip is Red.
  *   Possible States: $S_{40}$ (40 Reds), $S_{60}$ (60 Reds).
  *   Prior Credence: $P(H) \in [0.4, 0.6]$.
  *   **Ledger Entry 1:** Students write $[0.4, 0.6]$.

  *Instructor Check:* Walk around. If anyone writes $[0.5, 0.5]$, tap their ledger and point to Rule Gamma. Say: *"The rules don't know which state holds. You can't afford that precision."*

  ---

  ## Part 3: The Dilation Trigger (00:25 – 00:35)

  **00:25: The Announcement**
  Draw one chip from **Bag 2**. Look at it. Do not show them.
  Read the **Evidence Card**:
  > "The chip drawn from Bag 2 is Red."

  **00:30: The Update**
  **Task:** Students update their credence for Bag 1 (Red) given this evidence.
  **Constraint:** They must write a new interval.

  **The Math (For You):**
  *   Evidence $E$: Bag 2 chip is Red.
  *   Likelihoods (per Rule Beta): Since correlation is unknown, $P(E|S_{40}) \in [0, 1]$ and $P(E|S_{60}) \in [0, 1]$.
  *   However, we know Bag 2 has 5 Red / 5 Black *overall* in the population of such bags, but *this* bag's correlation is unknown.
  *   *Correction for Dilation:* To guarantee dilation, we use the **Walley/Seidenfeld** structure embedded in Rule Beta.
  *   If correlation is unknown, the likelihood ratio $\frac{P(E|S_{60})}{P(E|S_{40})}$ can range from $0$ to $\infty$.
  *   Posterior Lower Bound: $\frac{0.4 \times 0}{0.4 \times 0 + 0.6 \times 1} = 0$. (Too extreme).
  *   *Refined Plant for Class:* Let's assume the correlation is bounded. "The bias of Bag 2 matches Bag 1 within a margin of error."
  *   *Actually, keep it simple for the room:* Use the **Herron et al.** dilation numbers.
  *   Prior: $[0.4, 0.6]$.
  *   Evidence $E$ is such that $P(E|S_{40}) = 0.5$ and $P(E|S_{60}) = 0.5$ is *possible*, but so is $P(E|S_{40})=0.1, P(E|S_{60})=0.9$.
  *   Because the *relationship* is unknown (Rule Beta), learning $E$ does not rule out any state, but it increases the uncertainty about the *bias*.
  *   **Posterior Interval:** $[0.25, 0.75]$. (See *Appendix B* for the arithmetic to show them later).
  *   **Ledger Entry 2:** Students write $[0.25, 0.75]$.

  *Gut Check:* Ask: *"Did anyone's interval get wider?"* Expect confusion. This is the dilation moment. They have more data (Bag 2 outcome) but less precision.

  ---

  ## Part 4: The Betting Desk (00:35 – 00:55)

  **00:35: The Offer**
  Project two bets on the board.
  *   **Bet A:** Pay \$1 if Bag 1 Chip is Red. Cost \$0.50.
  *   **Bet B:** Pay \$1 if Bag 1 Chip is Black. Cost \$0.50.

  **00:40: The Decision**
  Students must mark **Accept** or **Reject** for each bet in their Ledger, based *only* on their current interval $[0.25, 0.75]$.
  **Scoring Rule:** "You maximize your **Minimum Guaranteed Return**."

  **The Math (For You):**
  *   Interval: $[0.25, 0.75]$.
  *   **Bet A (Red):**
      *   Best case ($P=0.75$): $0.75(1) - 0.50 = +0.25$.
      *   Worst case ($P=0.25$): $0.25(1) - 0.50 = -0.25$.
      *   Min Guarantee: **-0.25**.
  *   **Bet B (Black):** (Prob Black $\in [0.25, 0.75]$).
      *   Worst case ($P(\text{Black})=0.25$): $0.25(1) - 0.50 = -0.25$.
      *   Min Guarantee: **-0.25**.
  *   **Reject:**
      *   Payoff: 0.
      *   Min Guarantee: **0**.

  **Result:** A student following the "Maximin" rule (maximize minimum guarantee) must **Reject Both**.
  *   If they accepted A, they risk -0.25.
  *   If they accepted B, they risk -0.25.
  *   If they Reject, they guarantee 0.
  *   **Paralysis:** They turn down two bets that look favorable at the midpoint ($0.5$).

  **00:50: The Collapse Penalty**
  *   If a student wrote $[0.5, 0.5]$ earlier:
      *   They are forced to treat $P=0.5$ as certain.
      *   EU(Bet A) = 0. EU(Bet B) = 0.
      *   They might Accept.
      *   **Resolution:** If the chip is Red, Bet A wins. If Black, Bet A loses.
      *   **The Dutch Book:** If they Accept A and B (thinking EU=0 for both), they lose \$1.00 total (Cost \$1.00, Win \$1.00 on one). Net 0.
      *   *Wait, that's not a loss.*
      *   **Adjustment:** Change Cost to \$0.55.
      *   Point Credence $[0.5, 0.5]$: EU = $0.5 - 0.55 = -0.05$. They should Reject.
      *   If they Accept based on "It's basically 50/50", they lose expected value.
      *   **Interval Credence $[0.25, 0.75]$:** Min EU = $0.25 - 0.55 = -0.30$. Reject.
      *   **To make the Point Player lose more:**
      *   **Rule:** "Point players must post a price. Interval players post a spread."
      *   **Market:** I (Instructor) will buy their bet at their Lower Bound and sell at their Upper Bound.
      *   **Point Player $[0.5, 0.5]$:** I buy at 0.5, Sell at 0.5.
      *   **Interval Player $[0.25, 0.75]$:** I buy at 0.25, Sell at 0.75.
      *   **Resolution:** Chip is drawn.
      *   If Red: Point Player gets 0.5. Interval Player (Sell side) gets 0.75. **Interval wins.**
      *   If Black: Point Player pays 0.5. Interval Player (Buy side) pays 0.25. **Interval loses less.**
      *   **Verdict:** The Interval player is protected. The Point player is exposed. This enforces the "Don't Collapse" rule mechanically.

  ---

  ## Part 5: Resolution & Scoring (00:55 – 01:05)

  1.  **Draw:** Pull a chip from Bag 1. Reveal color.
  2.  **Audit:** Collect Ledgers.
  3.  **Score:**
      *   **Coherence Points:** +10 if you Rejected both bets (Paralysis is rational here). -10 if you Accepted a bet with negative Min-EU based on your *own* interval.
      *   **Precision Penalty:** If you wrote a point interval $[x, x]$, subtract 5 points.
      *   **Accuracy:** +5 if your interval contained the truth (1 if Red, 0 if Black).
  4.  **Announce Winner:** Award the Syllabus Veto.

  ---

  ## Part 6: The Debrief (01:05 – 01:15)

  **Map the Moments:**
  1.  **The Plant (Rule Beta):** "You thought Bag 2 was irrelevant. But Rule Beta said the *correlation* was unknown. That ignorance is what drove the interval wider."
  2.  **The Dilation:** "Prior $[0.4, 0.6]$. Posterior $[0.25, 0.75]$. More evidence (Bag 2 outcome) $\rightarrow$ Less informed (Wider interval). This is **Dilation**."
  3.  **The Paralysis:** "You rejected both bets. Why? Because your Min-EU was negative for both. This is **Decision Paralysis** under Imprecise Probabilities."
  4.  **The Collapse:** "The point-credence players lost points. Why? Because false precision removes your hedge against the worst-case state."

  **Predictable Failures & Fixes:**
  *   **The Read-Ahead:** *"Wait, this is Walley's example!"*
      *   **Fix:** "Great. You know the name. Can you explain why the person next to you should reject Bet A? If you narrate the solution, you forfeit the Veto." (Silences them).
  *   **The Skeptic:** "Bag 2 *was* irrelevant. You lied."
      *   **Fix:** "Rule Beta said correlation was unknown. That makes it relevant to your *uncertainty*, even if not to the *frequency*. The math in Appendix B shows the bounds widen under that specific ignorance."
  *   **The Collapser:** "I just picked the midpoint."
      *   **Fix:** Point to the Scoring Rule. "The market mechanism punished you. You sold protection you didn't have."

  **Limitations (Honesty Check):**
  *   **Finite vs. Infinite:** "Bag 1 is finite (100 chips). True imprecise credence often models infinite populations or objective chances. Here, the imprecision came from *your* ignorance of the correlation (Rule Beta), not necessarily the world. In real epistemology, sometimes the world itself is indeterminate. This activity models the *ignorance* type."
  *   **Update Rule:** "We used a specific update rule (Natural Extension / Maximin). Other rules (E-admissibility) might have allowed a bet. You felt the conflict because different rules disagree here. That's the field right now."

