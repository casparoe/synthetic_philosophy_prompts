                              *   **Posterior:** Strongly favors Bag 1 = 40% Red. Interval narrows to near 0.4.
                              *   **This is NOT Dilation.**
                              *   **I must create a scenario where learning E makes the interval WIDER.**
                              *   **This happens if E is more likely under the 'uncertain' middle state than the extremes.**
