                              *   Posterior weights: $0.3 \times w_{40}$, $0.7 \times w_{60}$.
                              *   If prior weights equal, posterior favors 60%. Interval shifts, doesn't necessarily dilate.
                          *   **To Dilate:** We need the likelihood ratio to be extreme in *both* directions depending on hidden parameters.
                          *   **Okay, I will use the 'Dilation via Unknown Correlation' model.**
                          *   **Prior:** $P(Red) \in [0.4, 0.6]$.
                          *   **Bag 2:** Contains a correlation coefficient $\rho \in [-1, 1]$. (Abstract).
                          *   **Let's go with the Prompt's suggestion:** "If the whole trick depends on their prior admitting a correlation they'd have no reason to posit, then build that correlation into the rules earlier."
