      Yes, this is the reverse dynamic. Revisionism is *less* demanding (more permissive) regarding *who* can be killed, while Traditionalism is *more* restrictive based on status.
      Wait, usually Revisionism is considered *more* demanding because it restricts Unjust Soldiers. But regarding *targets*, Revisionism expands the target set (liable civilians) while Traditionalism restricts it (combatants only).
