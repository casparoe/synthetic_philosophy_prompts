      *   Make sure the "voluntariness" is evident (invited, voluntarily climbed).
      *   Make sure the "status" is evident (civilians, unarmed).

      *(Self-Correction during drafting)*: I need to make sure Walzer *definitely* says no. Walzer discusses human shields in *Just and Unjust Wars*. He distinguishes between involuntary (immune) and voluntary (complicated). He tends to lean towards immunity to protect the category. However, to make the thought experiment sharp, I should frame it such that Walzer's *commitment to noncombatant immunity as a status* is the driving force. I will emphasize the *status* protection.
