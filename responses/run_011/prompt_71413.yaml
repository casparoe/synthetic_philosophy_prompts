answer: |-
  **The Scenario**

  State A's armored divisions crossed the recognized international border of State B three days ago, ignoring UN Security Council resolutions demanding withdrawal, and State A artillery is currently shelling State B's residential districts. To protect a mobile missile launcher responsible for these strikes from State B counter-battery fire, State A officers invited local citizens to stand atop the vehicle's camouflage netting. Fifty civilians, aware of the launcher's targets, voluntarily climbed up and remain there, unarmed and in civilian clothes, knowing their presence violates State B's rules of engagement regarding collateral damage. A State B special forces operator, unable to disable the launcher without first removing the human obstruction, shoots one volunteer in the chest.

  ***

  **The Analysis**

  **Verdicts and Reasoning**
  *   **Walzer (Traditionalist):** **Impermissible.** For Walzer, the *in bello* right to kill is derived from the status of "combatant." These individuals are civilians: they wear no uniform, bear no arms, and are not part of the chain of command. Noncombatant immunity is a protective barrier based on this status to insulate the private sphere from war. Intentionally targeting them, even to stop an unjust threat, treats them as means rather than respecting their protected status.
  *   **McMahan (Revisionist):** **Permissible.** For McMahan, liability is not a matter of status but of moral responsibility for an unjust threat. These volunteers know the war is aggressive and the launcher is striking civilians. By voluntarily interposing themselves to protect the weapon, they become morally responsible for the harm that weapon enables. They have forfeited their right not to be killed because they are actively sustaining an unjust threat.

  **The Pivot Feature**
  The single feature doing the work is **voluntary moral responsibility decoupled from combatant status.** The case turns on the fact that the target is functionally contributing to the unjust threat (making them liable for McMahan) while formally retaining civilian status (making them immune for Walzer).

  **The Removal Test**
  If you remove the **voluntariness** (e.g., the civilians are conscripted at gunpoint to stand on the vehicle), the case collapses back into the standard agreement that killing them is impermissible. McMahan would argue they are no longer morally responsible for the threat (they are coerced instruments), and Walzer would still argue they are noncombatants. The unique divergence *only* exists when the civilian is morally liable but status-immune.

  **The Traditionalist Objection**
  A Walzerian would attack the **epistemic and institutional stability** of the Revisionist verdict. They would argue that allowing soldiers to determine "moral responsibility" on the fly erodes the bright-line rule of noncombatant immunity. If liability depends on the justice of the cause and the specific voluntariness of the civilian's act, soldiers will inevitably err or lie, claiming all enemy civilians are "voluntary collaborators." The Traditionalist argues that maintaining the absolute status-based prohibition is necessary to prevent the total moralization of war, which historically leads to greater civilian slaughter, even if it protects some individually liable actors in edge cases.
