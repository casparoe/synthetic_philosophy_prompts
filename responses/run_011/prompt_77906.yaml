answer: |-
  You have actually reconstructed the core of Gödel's philosophical argument almost perfectly, and your intuition about the laws versus the specific setup is exactly where the weight of the idea rests. The short version is that Gödel uses the rotating universe not to claim ours spins, but to show that our best theory of reality allows for structures where time cannot objectively pass, which implies that passage was never a fundamental feature of the theory to begin with. Because the same laws govern both that possible universe and our actual one, the conclusion bleeds over, suggesting our feeling of time flowing is a feature of our perspective rather than the world itself.

  Your reconstruction hits the nail on the head regarding how possible worlds function in this debate. You suggested that if the passing of time were real furniture, it would have to be written into the laws, and since the laws allow a world without it, the passing must be subjective. This is precisely the modal argument Gödel is making. He is not arguing that because a rotating universe exists somewhere, our time is fake. He is arguing that General Relativity is the theory that describes the structure of space-time itself. If that theory permits a solution where you cannot define a universal time order because paths loop back on themselves, then the concept of an objective, flowing time is not built into the foundation of physical reality. It becomes like the color blue in a black and white movie; the movie still exists and has structure, but the blueness was never part of the film strip, it was only in the projection. Since our universe runs on the same software as the rotating one, even if our specific data doesn't produce the loops, the software itself does not support an objective clock ticking for the whole cosmos.

  This leads naturally to your worry about whether this proves too much by demoting space or causation as well. It is true that General Relativity treats space and time as a unified fabric, and in a sense, it does demote absolute space just as it demotes absolute time. However, the argument bites harder on time because of how we experience it. We do not have a sensory experience of space flowing or passing; we simply experience being at different locations. We do, however, have a powerful, persistent intuition that time slips away, that the future is open, and that the past is gone. Gödel's target is specifically this experience of passage. While closed loops do threaten our normal understanding of causation, the philosophical punch is aimed at the idea of change. If you can return to your own past, the distinction between past, present, and future loses its objective sharpness. Space does not suffer the same fate in our experience because we never felt it was flowing to begin with, so showing it is relative confirms what physics says without contradicting a deep sensory intuition in the same way.

  You also asked whether the rotating universe was necessary given that Special Relativity already messed with simultaneity, and this distinction is crucial to why Gödel bothered with the construction. Special Relativity tells us that different observers slice up time differently, so there is no universal now, but it still allows for a consistent local ordering of events along any single path. You can still say event A caused event B, and no observer will see B happen before A. Gödel's rotating universe is worse than ambiguous slicing; it introduces closed timelike curves where you can physically travel to an event that is in your own past. This makes it impossible to define a global time coordinate at all, not just relative to an observer. This was Gödel's way of tightening the noose. Special Relativity suggests time is relative, but Gödel's solution suggests time might be incoherent as a progressive measure. He needed the rotating universe to show that the laws of physics do not just make time relative, but can make the very idea of time progressing forward logically impossible to maintain globally.

  Finally, it is important to be precise about what Gödel is actually denying, because popular accounts often blur the lines. He is not denying that events happen or that there is an ordering of events in a local sense. He is denying the objective lapse of time, which is the idea that there is a privileged present moment that moves forward, illuminating the future and extinguishing the past. The rotating universe result supports the view known as the block universe, where past, present, and future all exist equally as coordinates in a four-dimensional structure. In this view, nothing flows; things just are. So he is not claiming time is unreal in the sense that seconds don't tick on a clock, but rather that the passage we feel is an illusion of consciousness. The ordering of events remains objective in most contexts, but the special status of the now vanishes. The rotating universe is the proof of concept that shows a physical world can exist without that flowing now, and therefore, the flowing now was never a necessary part of physical reality to begin with.
