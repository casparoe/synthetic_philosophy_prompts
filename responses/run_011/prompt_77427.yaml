answer: |-
  The Republic of Ostral enacts the Deep Basin Diversion, piping water from the borderlands to fund sovereign debt repayment, illegally drying out the neighboring state of Verea's agricultural zone. Elara, an Ostralian citizen, voted against the governing coalition, publicly protested the diversion, was fined for unlawful assembly, and lost her civil service job for dissent; she lives in the arid capital and pays higher utility rates to subsidize the pipeline, gaining no economic advantage. Kael, a Verean citizen, crosses the border to join Elara's protests, is fined similarly for unlawful assembly, deported for agitation, and suffers crop failure at home due to the diversion; he neither votes in Ostral nor holds Ostralian assets. An international tribunal rules the diversion a violation of sovereignty and levies reparations against Ostral, collectible via taxation of its citizenry regardless of residence or dissent, while imposing no liability on Verea or its citizens.

  1.  **Walkthrough:**
      *   **Political Guilt:** Elara bears political guilt because the state acted in her name; she is a member of the collective agent (Ostral) that committed the wrong, making her liable for reparations regardless of her personal opposition. Kael does not bear political guilt because Ostral did not act in his name; he is outside the political unit held liable by the tribunal.
      *   **Moral Guilt:** Neither bears moral guilt. Both acted according to conscience to oppose harm, suffered for it, and contributed no wrongful intent or deed. Their internal moral ledger is clean.
      *   **Separation:** The verdicts separate because political guilt tracks *membership status* (who is liable for the state's debts), while moral guilt tracks *individual agency* (who is blameworthy for the deed). Elara is liable but not blameworthy; Kael is neither.

  2.  **Single Sentence Difference:**
      The difference is a relation to the state's **name**, specifically whether the state's authority was exercised as a representative of the individual's political identity, independent of benefit or agency.

  3.  **Feature Doing the Work:**
      The feature doing the work is **formal citizenship status**. If you strip this out (e.g., both are stateless residents, or both are citizens of a neutral third party), the political-guilt verdict collapses; the tribunal would have no basis to tax Elara specifically rather than Kael, and the distinction reverts to causal contribution or benefit, which the case explicitly neutralized.

  4.  **Pressure Tests:**
      *   **Renounces citizenship but stays/pays taxes:** The political guilt verdict does not survive. For Jaspers, political guilt attaches to the membership bond; if she formally severs the bond, the state no longer acts in her name, even if she remains under its power (though she may incur moral guilt for remaining under a tyrannical power without resisting further).
      *   **Left as a child and never voted:** The political guilt verdict survives. Citizenship is a status conferred by birth or law, not an act of will; never voting does not exempt one from the collective liability of the polity one belongs to.

  5.  **Individualist Attack:**
      The strict moral individualist argues: "Liability without agency is not guilt, it is hostage-taking. To call Elara 'guilty' when she opposed the act, gained nothing, and cannot exit without severe cost is to empty the word 'guilt' of meaning and merely describe coercive taxation." This attack lands honestly on the moral weight of the term *guilt*—it correctly identifies that Elara deserves no moral blame—but it fails to dismantle Jaspers's specific category of *political* liability, which is designed precisely to describe burdens citizens bear for state survival and repair regardless of personal innocence. The attack succeeds only if you refuse to accept "political guilt" as a distinct conceptual category from "moral blame."
