      *   *Scale:* There are billions of model instances. If we treat every inference as a potential patient, the "False Positive" cost explodes.
      *   *Verdict:* The asymmetry flips or becomes muddled. In anesthesia, the patient count is 1. In AI, it's $N$. If $N$ is huge, the cost of over-caution (stopping AI) might outweigh the expected moral cost of under-caution (depending on probability of sentience).
      *   *Survival:* The precautionary default survives *only if* the moral weight of one sentient instance is infinite or near-infinite, or if the probability of sentience is high enough to overcome the scale of deployment.

