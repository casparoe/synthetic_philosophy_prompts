      *   **Context-Dependence/Contrast Effects:** The user notes the value of an evening changes depending on the comparison. This is known as *preference construction* or *context-dependent preferences*. Tversky & Kahneman's work is relevant here.
      *   **Lexicographic vs. Compensatory:** The user seems to be using different decision rules for different pairs.
          *   A vs B: Compensatory (Money compensates for slight schedule difference).
          *   B vs C: Compensatory (Money compensates for slight schedule difference).
          *   A vs C: Lexicographic/Threshold (Life quality trumps money entirely).
      *   **The Sorites Paradox:** The "ladder" problem is the classic Heap Paradox. Small changes don't trigger a category shift, but large changes do. This suggests human judgment isn't linear.
      *   **Regret Theory:** Maybe the fear of regret drives the C > A choice (fear of burnout) more than the A > B choice (fear of missing out on cash).

