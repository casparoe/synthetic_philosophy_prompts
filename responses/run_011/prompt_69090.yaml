answer: |-
  The State Professional Caregiver Act mandates that all applicants for government-subsidized elder-care contracts must submit an affidavit certifying they bear no financial responsibility for any person with a chronic disability. The rule is published, prospective, clear, consistent, stable, and officials grant contracts exactly to those who sign and deny those who do not. It is possible to comply (by relinquishing legal responsibility or not applying). The injustice targets parents of disabled children who obey the law: they are barred from this employment sector solely due to their family status, while the system's procedural perfection prevents officials from granting hardship waivers, rendering the exclusion absolute and sanitized by the rule of law.

  **Show Your Work**

  **Fuller's Eight Desiderata:**
  1.  **Generality:** The rule applies to all applicants for the contract, not named individuals.
  2.  **Promulgation:** The Act is published and accessible to the public.
  3.  **Prospectivity:** It applies to future applications, not past conduct.
  4.  **Intelligibility:** The terms "financial responsibility" and "chronic disability" are defined in regulations.
  5.  **Consistency:** No other statute contradicts this eligibility requirement.
  6.  **Possibility of Compliance:** Applicants can legally transfer guardianship or choose not to apply.
  7.  **Constancy:** The rule remains stable over time, allowing planning.
  8.  **Congruence:** Officials deny licenses exactly according to the affidavit status, with no deviation.

  **Hart's Verdict:**
  Hart would declare this valid law. Under the separation thesis, the validity of a rule depends on its source (enacted by the legislature) and its adherence to the system's rule of recognition, not its moral content. Since the Act follows all procedural requirements and satisfies Fuller's formal criteria, it is legally valid. Morally, Hart would condemn it as wicked but insist that calling it "law" does not endorse it; rather, recognizing it as law clarifies that we face a moral choice to obey or resist, rather than a confusion about its legal status.

  **Fuller's Verdict:**
  Fuller faces a dilemma. He argues that the "inner morality of law" (the eight desiderata) creates a friction that usually prevents substantial injustice. Here, the inner morality is fully satisfied, yet the outer morality is monstrous. Fuller would likely concede that this system meets the formal conditions of legality but argue it fails to command moral fidelity. What survives of his claim is the assertion that the eight conditions are not merely technical but establish a relationship of reciprocity between government and citizen. However, this case shows that reciprocity can be formally met while substantively violated.

  **Pressure Point and Fuller's Reply:**
  The single feature generating pressure is the **use of a neutral procedural criterion to enforce a substantive status exclusion without discretion.** If the rule were removed and replaced with a competence-based standard (e.g., "must demonstrate ability to work 40 hours"), the exclusion would vanish, and the rule would serve a legitimate regulatory purpose. Fuller's best reply is that the eight desiderata are not mere principles of efficient rule-drafting but are the architectural requirements for a specific moral relationship: one of reciprocal agency. By forcing citizens to choose between fundamental human commitments (family care) and economic participation, the state treats them as objects of management rather than responsible agents. Thus, the eight conditions retain moral weight because their *purpose* is to sustain human agency; when a rule uses that form to negate agency, it satisfies the letter of the desiderata but violates their spirit, becoming a tool of manipulation rather than law in the full sense that grounds an obligation of fidelity.
