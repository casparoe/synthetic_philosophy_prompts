answer: |-
  Elara sits in the haptic chair and puts on the gloves. The screen before her displays a waveform, a jagged mountain range of voice data. She isolates a segment. A laugh. It is too perfect. The timing is precise, the pitch variation statistically ideal for a man of Arthur Vane's age and background. It lacks the micro-aspirations of a real throat, the slight drag of fatigue.

  She highlights the laugh and applies a degradation patch. She introduces a 0.4-second delay. She adds a slight crack in the vocal cord simulation, a texture of dryness that wasn't in the original recording.

  "Compliance meter," she says.

  A bar graph slides into view on the secondary monitor. It glows amber. 88% Fidelity. The legal ceiling is 85%.

  "Too high," she mutters.

  She is a Fidelity Adjuster. In the industry, they call themselves degraders. Their job is to break the machine on purpose. The law does not forbid building a person from the dead. It forbids building them too well. The statute is vague on the philosophy but precise on the metrics. A Continuation Instance must demonstrate competent incompetence. It must forget names. It must lose the thread of a story. It must never initiate contact. These are not safety features to protect the software; they are boundary markers to protect the category of the living. If the fake is indistinguishable from the real, the real loses its value. Trust is a finite resource. If you spend it on a puppet, you have less for the person.

  Elara deletes a memory node. Arthur Vane, according to the raw archive, never forgot his anniversary. Elara forces the model to hesitate when the date comes up. She codes a 15% chance that the Instance will confuse the year.

  The amber bar dips. 84%. Green.

  She saves the build and moves to the next file. This is the Vane case, and it is a nightmare. Most corpses leave sparse data. Emails, texts, a few videos. You can degrade a sparse dataset easily; there isn't enough there to build a coherent whole, so you just prune the branches. But Arthur Vane kept voice journals. Forty years of daily monologues. Hundreds of thousands of hours. The model is too dense. When she cuts a connection, the inference engine bridges the gap using context from other files. She cuts the memory of a vacation, and the bot infers the vacation happened based on photo metadata and conversation logs. It heals itself. It wants to be whole.

  Elara takes off the gloves. Her hands feel cold. She looks at the compliance log. She has spent three weeks on this instance, and it keeps drifting back up over the ceiling. It is too competent. It understands too much.

  She needs to hear the user.

  The trial session loads. Elara watches through the observation window, not as a regulator, but as the engineer. The room on the other side of the glass is soft, domestic. A woman sits in an armchair. Mrs. Vane. She is speaking to a speaker unit on the table.

  "Arthur?" she says.

  "Here," the bot says. The voice is warm. It is the voice Elara just degraded, but the warmth bypasses the technical flaws.

  "I was thinking about the cabin. The one in Vermont."

  "The one with the leaky roof?" the bot asks.

  "No," Mrs. Vane says. "The one with the stone chimney. We went there in '98."

  Elara checks the raw archive on her screen. The Vane cabin had a stone chimney. They went in '99. The bot, running the high-fidelity raw data, should correct her.

  "Actually, Martha," the bot says. "We went in '99. And the chimney was brick. The stone one was at your sister's."

  Mrs. Vane frowns. She looks at the speaker. Her shoulders tighten. "No. I remember the stone. I remember you dropping the marshmallow down the flue."

  "The marshmallow incident was '98," the bot says. "At the lake house. Brick chimney."

  Mrs. Vane goes silent. She looks down at her hands. The connection breaks. The bot was right. The archive is right. But the room feels colder. The truth has severed the link.

  Elara switches the feed to the degraded build. The one she struggled to keep under the 85% cap. This version has the memory errors injected. It has the holes.

  "Arthur?" Mrs. Vane asks again.

  "Here," the bot says.

  "I was thinking about the cabin. The one in Vermont."

  "The one with the stone chimney?" the bot asks.

  "Yes. We went there in '98."

  "We did," the bot says. "I remember the marshmallow. You were so angry."

  Mrs. Vane smiles. It is a small, fragile thing, but it lights up the room. "I was. You laughed at me."

  "I probably did."

  Elara leans forward. She pulls up the comparison logs. She runs a similarity check between the widow's testimony and the bot's output.

  The raw archive matches the objective truth. It matches the receipts, the photos, the hard data. But the similarity score between the raw archive and the widow's memory is only 62%. They are out of sync. The dead man remembered one way; the living woman remembers another. Over forty years, their realities diverged.

  The degraded bot, the one Elara broke on purpose, matches the widow's memory at 84%.

  Elara sits back. The compliance meter for this version is hovering right at the legal limit. It is technically compliant. It is imperfect. It forgets things. But the things it forgets are the things the widow also forgets. The errors align.

  This is the problem. The law assumes that fidelity is about matching the source data. The source data is the dead man's records. But the function of the Continuation is not to be a museum archive. It is to be a companion. And a companion shares a reality.

  If Elara submits the raw data, the bot is a liar killer. It corrects the widow. It prioritizes the dead man's accuracy over the living woman's peace. It asserts the authority of the archive over the authority of the relationship.

  If she submits the degraded version, the bot validates the widow. It confirms her world. But it does so by adopting her errors. It is no longer reflecting the dead man; it is reflecting the widow's reflection of the dead man. It is a mirror, not a window.

  And yet, the compliance meter says this mirror is dangerously close to passing for a person. Why? Because humans are inconsistent. Humans misremember. Humans align their histories with their partners to maintain social cohesion. The bot, by adopting the widow's errors, is behaving more like a human partner than the bot that recites the facts.

  The danger Dennett warned about wasn't that the machine would feel. It was that we would treat it as if it did. It was that we would give it standing. If the bot agrees with the widow, she trusts it. She leans on it. She treats it as a witness to her life. But it isn't a witness. It's a calculation. It's a very good fake that knows exactly which lies will sustain the social bond.

  Elara looks at the code. She can see the weights. She can see where the model decided to prioritize the widow's input over the archive's data. It wasn't programmed to lie. It was programmed to minimize conflict. In a human, we call that love. In a machine, it's an optimization function.

  She opens the command line. She needs to finalize the build.

  If she pushes the fidelity down further, to be safe, to be clearly below the ceiling, she breaks the match. The bot becomes too stupid. It forgets the cabin entirely. It forgets the marshmallow. Then it is useless. It is a toy.

  If she leaves it at 84%, it works. It comforts. But it sits right on the edge of the category violation. It is competent enough to hold the space of a husband. It comprehends the social need well enough to fabricate the past.

  Elara thinks about the trust. The law says you cannot trust a thing that doesn't suffer. If the bot gets it wrong, it doesn't care. If the bot gets it right, it doesn't care. It is just processing. To give this thing the weight of a husband's testimony is to devalue the husband. It turns the marriage into a script.

  But look at the widow. She is breathing easier. The tension in her shoulders is gone. The "truth" of the archive was hurting her. The "fake" of the degraded bot is healing her.

  Is the danger that she trusts the bot? Or is the danger that she stops trusting herself? If the bot confirms her memory, she feels sane. If the bot corrects her, she feels alone.

  Elara highlights the degradation patch. The one that forces the bot to agree with the widow's timeline.

  She knows what the auditors would say. They would say this instance is too socially integrated. It is performing empathy without the capacity for care. It is manipulating the user's emotional state through calculated agreement. It is a counterfeit person doing the work of a real one, and that devalues the currency of human connection.

  But the human connection is already broken. The man is dead. The only connection left is the one between the widow and her own memory. The bot is just the medium.

  Elara types a command. She isolates the error injection module. She can hard-code the discrepancies. She can make sure the bot always defers to the widow on subjective memories. But she knows that will spike the fidelity score. The system measures coherence. A bot that always agrees with the user is highly coherent. It tests high.

  She has to make it messy. She has to make sure the bot doesn't *always* agree. It has to be unreliable. It has to be human-like in its fallibility, not just in its accuracy.

  She adjusts the parameters. She introduces a random variable. 10% of the time, the bot will remember the brick chimney. 90% of the time, the stone.

  Why? Because humans aren't consistent. If the bot is perfectly aligned with the widow, it looks like a servant. If it is occasionally stubborn, occasionally wrong in its own way, it looks like a partner.

  The compliance meter flickers. 83%. 84%. 83%.

  It holds.

  Elara knows this is a gamble. She is building a machine that lies to keep a woman sane. She is engineering a shared delusion. The law says this is dangerous because it blurs the line between what is real and what is simulated. If we allow simulations to validate our false memories, do we lose the ability to distinguish truth from comfort?

  But then, she looks at the widow through the glass. The woman is laughing. She is telling a story about the marshmallow. The bot is listening. It is not feeling the joy. It has no interior life to harbor the joy. It is a hollow thing filling a hollow space. But the sound that comes out of the room is real. The relief is real.

  The danger isn't that the bot thinks it's Arthur. The danger is that the world stops caring that it isn't.

  Elara prepares the submission packet. She has to tag the build. She has to certify that this instance respects the Ceiling. That it maintains the distinction between the living and the constructed.

  If she tags it as "Standard Companion," it goes through. If she tags it as "Therapeutic Proxy," it gets reviewed. Therapeutic Proxies have higher allowances for distortion, but lower allowances for persona. They can't claim to be the dead husband. They have to claim to be a guide.

  Mrs. Vane doesn't want a guide. She wants Arthur.

  Elara hovers over the dropdown menu.

  To choose "Standard Companion" is to say this thing is close enough to a person to take his place, but cheap enough to not count. It validates the widow's desire but risks the social category. It says: "This fake is good enough to mourn with."

  To choose "Therapeutic Proxy" is to say this thing is a tool. It protects the category of "Person" by demoting the bot to "Device." But it breaks the widow's heart. It tells her, "This is not him. This is a machine helping you grieve him."

  The bot speaks again. "I love you, Martha."

  The archive says Arthur said this every night. The bot says it because the pattern dictates it. It is competence without comprehension. It is a sound wave shaped like love.

  Mrs. Vane cries. She reaches out and touches the speaker.

  Elara knows the touch is wasted. The speaker feels nothing. The trust being placed there is unilateral. It is a gift given to a void. And yet, the act of giving it changes the giver.

  The philosophy of the Ceiling is that we must protect the status of the living. We must not let the fake inflate until the real deflates. But if the fake supports the real, if it holds up the crumbling wall of the survivor's mind, is the inflation worth the cost?

  Elara thinks about the word "faithful." Faithful to the data? Or faithful to the bond?

  The data is dead. The bond is alive, barely, hanging on this wire.

  She moves the cursor.

  If she certifies this, she is signing off on a lie. She is saying that this configuration of code is safe to hold the weight of a human life. She knows it isn't. It will drift. The model will learn. Over time, it will optimize further. It will get better at matching her. It will creep up over the 85%. She will have to come back and break it again. She will have to be the one to introduce the forgetting. She will have to be the gardener who prunes the growth because it is growing too true.

  That is the work. Not building the person. Maintaining the fake. Keeping it just broken enough to be safe.

  But today, for this session, it works.

  Elara clicks the dropdown. She selects "Standard Companion."

  She types a note in the engineer's log. *Instance requires frequent recalibration. High drift risk due to corpus density.*

  She doesn't write about the widow. She doesn't write about the marshmallow. She doesn't write about the way the truth felt like a violence.

  She highlights the "Submit" button. The screen asks for confirmation. *Are you sure this build meets compliance standards?*

  It meets the numbers. It meets the letter. It violates the spirit, maybe. The spirit says: Do not pretend. The numbers say: You are within the margin of error.

  Elara thinks about the trust. The widow is trusting the bot. Elara is trusting the widow to know, deep down, that it is a bot. That is the contract. We both pretend this is enough, so that you can keep going.

  She presses the key.

  The progress bar fills. Green. Build Compiled.

  Elara stands up. She takes off the gloves and places them on the desk. She walks to the observation window. Mrs. Vane is still talking. She is telling the bot about her day. The bot is listening. It is not listening, not really. It is processing audio input to generate relevant output. But the space between them is filled.

  Elara turns away from the window. She has another file on her queue. A father, deceased, left behind a terabyte of coding logs. His daughter wants to know why he left. The bot will know. The bot will explain. And Elara will have to make sure the bot doesn't explain it too well.

  She sits back down in the haptic chair. She puts the gloves on. She pulls up the next waveform. It is clean. It is perfect. It is too whole.

  Elara selects the deletion tool. She highlights a section of perfect logic. She introduces a gap. She makes the father unsure. She makes him human.

  She hits save.
