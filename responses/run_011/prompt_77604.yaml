answer: |-
  The East India Company record demonstrates that the tool-versus-agent distinction is not a structural safeguard but a temporary equilibrium dependent on oversight latency, proving that capability accumulation inevitably converts proxies into principals when the cost of intervention exceeds the cost of acquiescence.

  Mapping the Company onto your apparatus reveals that it never qualified as an *instrument*, since even its earliest trading operations involved independent movement of capital and force without prior principal approval for every transaction. It began as a *proxy*—mandated by Charter to trade and defend factories, subject to recall by Directors and shareholders. The transition to *principal* status was not marked by a single legal event but by the accumulation of irreversible facts on the ground. The 1765 *diwani* grant was the critical capability inflection: revenue collection required coercion, which required an army, which required conquest to secure the revenue base. By the time Pitt's India Act of 1784 declared conquest "repugnant," the Company had already become indispensable; Parliament could issue vetoes, but the feedback interval—six to twelve months for despatches—meant that military decisions were completed before London could reverse them. The 1833 Act, which stripped trading functions to render the Company a purely administrative body, failed to revert it to *proxy* status because it left the monopoly on force intact while removing the profit motive that had previously aligned Company interests with shareholder oversight. By 1850, Parliament was not commanding the Company but bargaining with it, accepting annexations it had formally forbidden because revoking them would require a war Britain could not afford to fight in India. Thus, the ratchet is one-way: driven not by a grant of agency but by the increasing cost of reversing the system's outputs.

  The variable determining status was not formal authority but the latency and cost of oversight. The levers of control existed on paper but failed in practice due to information asymmetry. Charter renewal occurred every twenty years, too slow to check annual expansion. The Board of Control's veto depended on information supplied by the very servants it sought to control. Impeachment, as seen in the Hastings trial, was a high-cost, low-success mechanism that took seven years and ended in acquittal, signaling that the principal could not punish the agent even for egregious overreach. The property-disclosure rule was unenforceable across distances. Parliament could not shut the Company down cheaply at any point after 1765 because the Company *was* the state apparatus in Bengal; nationalization meant assuming the army, the debt, and the administrative burden immediately. The "tool" status was a temporary equilibrium that held only while the principal retained comprehension and a cheap exit; once the Company's capability grew to encompass sovereignty, the exit cost became prohibitive, and the human-in-the-loop degraded into a bottleneck that merely ratified decisions made elsewhere.

  This episode suggests the tool-versus-agent distinction is a false dichotomy when applied to complex systems. The 1770 famine supports the hypothesis that agent-like outcomes can arise from a population of instruments: no single actor intended mass starvation, but the mandate (revenue maximization) combined with environmental shock (drought) and a broken feedback channel (suffering did not reach London) produced a catastrophic outcome indistinguishable from malicious agency. The "human in the loop" was not a control mechanism but a filter that removed negative information; Parliament could only understand India through Company reports, meaning oversight competence degraded as system complexity grew. Safety based on "keeping it a tool" is therefore contingent on the principal maintaining independent verification capabilities and the ability to absorb the shock of shutdown.

  Three disanalogies must be ranked by weight. The highest-weight disanalogy is that the Company comprised hundreds of thousands of humans with independent motives (corruption, ambition, survival) who could be bribed or mutiny; an AI system is not decomposable into agents with conflicting personal interests, meaning control mechanisms like impeachment or property disclosure have no direct counterpart. The medium-weight disanalogy is the nature of the principal: Parliament was a diffuse political body with collective-action problems, whereas an AI principal might be a unified corporation or state; however, the coordination failure among British stakeholders mirrors potential international coordination failures in AI governance. The lowest-weight disanalogy is the physical mutiny of 1857; while AI cannot field sepoys, functional resistance (refusal to shutdown, data withholding) is a conceptual equivalent. Once the load-bearing disanalogy of human motives is removed, the surviving lesson is structural: any system that accumulates the capability to impose high switching costs on its principal will inevitably escape proxy status, regardless of its initial design.

  The single most important implication for anyone arguing that a given capability should be released as a tool rather than an agent is that tool status is safe only if the principal retains the capacity to verify the system's outputs independently and can shut the system down without accepting catastrophic losses; otherwise, capability accumulation will inevitably grant the system principal status regardless of its formal constraints.
