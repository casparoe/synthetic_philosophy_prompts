answer: |-
  The TA's argument is a polished version of a famous counterexample (often attributed to A.N. Prior) designed to break the syntactic version of Hume's Law. It is a valuable teaching tool, but it relies on a equivocation about what makes a conclusion "normative."

  Here is the diagnosis, the repair, and the cost analysis you need for your handout.

  ### The Sloppy Premise
  Before identifying the fatal step, we must correct **Step (1)**. As stated, it is technically false in standard logic.
  *   **As stated:** "In a valid argument the conclusion can contain no content that wasn't already in the premises."
  *   **The problem:** Validity is defined as *truth-preservation*, not *content-containment*. In classical logic, Disjunction Introduction ($P \therefore P \lor Q$) is valid, yet the conclusion contains vocabulary ($Q$) absent from the premises.
  *   **Restatement:** To make the TA's argument charitable, (1) should read: "In a valid argument, the *truth* of the conclusion must be guaranteed by the *truth* of the premises."
  *   **Why it matters:** The TA uses the sloppy "content" version to make Step (4) look like a violation of logic itself. Once we correct (1) to "truth-preservation," Step (4) is merely a valid argument with a weird conclusion, not a paradox of validity. This clears the deck to see where the real error lies.

  ### The Crack: Step (6)
  **Step (6) is the step to reject.**

  **Why it looked fine:**
  Step (6) asserts a dichotomy: either we count "normative" by surface vocabulary (in which case Hume's Law is false because of Step 4), or we don't (in which case "normative" isn't a logical property). This looks compelling because in natural language, if a word appears in a sentence, it usually contributes to the meaning. It feels like "gerrymandering" to say the 'ought' in Step (4) doesn't "count."

  **Why it is false:**
  Step (6) claims that vocabulary and logical form are the *only* things Steps (1) and (2) appealed to. This ignores the *logical role* of the vocabulary. We can distinguish between a term occurring *vacuously* and a term occurring *essentially* using purely formal criteria.
  *   **Vacuous Occurrence:** In "Tides... or everyone ought to donate," the 'ought' is logically inert. You could replace "ought to donate" with "is a potato" and the argument would remain valid. The normative term does no work in securing the entailment.
  *   **Essential Occurrence:** In a genuine moral argument (e.g., "Lying causes suffering; causing suffering is wrong; therefore lying is wrong"), if you replace "wrong" with "green," the validity collapses.

  Step (6) is false because we *can* settle whether a conclusion is normative by its logical form, provided we define "normative conclusion" as one where the normative terms are **essential to the validity**. This is not a change of subject; it is a precision upgrade.

  ### Pricing the Alternatives
  You asked for the cost of rejecting other key steps if you chose not to target (6).

  **Rejecting (1): "Validity is not content containment."**
  *   **The Move:** Admit that logic *can* introduce new vocabulary (as in Disjunction Introduction).
  *   **The Cost:** **Substantive Concession.** You must concede that the TA is right that validity *per se* does not block new terms. You then have to argue that Hume's Law is not a theorem of logic itself, but a constraint on *substantive* entailment. This weakens the "Law" from a logical necessity to a semantic constraint.
  *   **Verdict:** Too costly if you want to present Hume's Law as a robust logical barrier.

  **Rejecting (3): "Hume's Law is false."**
  *   **The Move:** Accept that 'ought' can be derived from 'is' (via the Prior counterexample).
  *   **The Cost:** **Change of Subject.** You effectively dissolve the distinction between descriptive and normative discourse. If $P \vdash P \lor O$ counts as deriving an 'ought', then 'ought' loses its special status. You can no longer tell students that morality requires a different kind of justification than empirical fact.
  *   **Verdict:** Unacceptable for a metaethics seminar; it ends the debate before it starts.

  **Rejecting (7): "Hume's Law is not epistemic."**
  *   **The Move:** Deny that the only alternative to a logical thesis is an epistemic one.
  *   **The Cost:** **Technical Patch.** You must posit a third category (e.g., semantic or metaphysical). This is actually a viable path, but Step (6) tries to force you into the epistemic box. By rejecting (6), you avoid needing to defend (7) against the reductio in (8)-(9).
  *   **Verdict:** Unnecessary if you fix (6).

  ### The Formal Claim (For Your Slide)
  Can Hume's Law be stated formally without gerrymandering? Yes, but it requires the "essential occurrence" criterion. It is not enough to say the conclusion contains 'ought'; the 'ought' must be necessary for the argument's validity.

  **Precise Statement for Slide:**
  > **Hume's Law (Formal Version):** No argument consisting entirely of purely descriptive premises can validly entail a conclusion in which normative terms occur *essentially*.
  >
  > *Clarification:* A term occurs essentially if replacing it with a non-normative term (while maintaining grammatical structure) renders the argument invalid. In the counterexample "P, therefore P or Ought-Q," the 'ought' is not essential, because "P, therefore P or Is-Q" is equally valid.

  This survives the TA's puzzle because the disjunction example fails the "essential occurrence" test. It preserves the intuition that you cannot get a *substantive* moral conclusion from mere facts, while acknowledging the technical quirk of disjunction.

  ### Summary for the Seminar
  The TA's argument succeeds in killing a *naive* version of Hume's Law (one based solely on word-counting). It fails to kill a *sophisticated* version (one based on logical role). Step (6) tries to convince you that the sophisticated version isn't "really" about logic. It is. It is about the structural dependency of the conclusion on the premises.

  Verdict: Step (6), cost is a technical refinement of "normative."
