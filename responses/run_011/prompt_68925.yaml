          *   3 vs 6 is normative. If badness is subjective desire (3), how can there be objective rational requirements (6)? This threatens the axiological core of the paper.
          *   *Correction:* I should rank 3 vs 6 (via 2) as potentially more damaging to the *argument* than 1 vs 2, though 1 vs 2 is more obvious.
          *   *Actually, looking at the prompt:* "Rank the tensions by severity."
