          *   *Severity:* Low-Medium. This is a standard distinction between *pro tanto* badness and *all things considered* badness. Claim 4 acknowledges this ("all things considered"). Claim 3 needs to be read as *pro tanto*.

      *   **Tension E: Claim 3 vs. Claim 2/6.**
          *   Claim 3: Badness = disliked/want to stop.
          *   Claim 2: Asymbolics don't dislike it.
          *   Claim 6: They are making a rational mistake (implying they *should* want it to stop/avoid it).
