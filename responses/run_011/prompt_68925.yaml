      *   **Tension C: Claim 1 vs. Claim 5.**
          *   Claim 1: Unpleasantness is part of pain.
          *   Claim 5: You can't be wrong about unpleasantness.
          *   *Conflict:* If Asymbolics say "I feel pain but it doesn't bother me," Claim 5 says we must believe them about the unpleasantness (or lack thereof). Claim 1 says if it lacks unpleasantness, it's not pain. Claim 2 says it *is* pain.
