      *   *Which cleans up the most?* Revising Claim 1 is usually the philosophically richer route (allowing for the dissociation). However, for a short paper, revising Claim 2 might be simpler linguistically. But Claim 2 is presented as an empirical fact ("Patients... report"). Denying patient reports is risky.
