  5.  **Determine Costs of Giving Up:**

      *   *Give up 1:* Pain is separable from unpleasantness (Sensory-Discriminative vs. Affective-Motivational). *Cost:* Counterintuitive to common language; makes "pain" a very broad category including asymbolia.
      *   *Give up 2:* Asymbolics don't feel *real* pain, just pain-like sensation. *Cost:* Medical/phenomenological dismissal of patient reports; ignores neurological evidence (insula damage affects affect, not sensory processing).
      *   *Give up 3:* Badness is objective or not solely desire-based. *Cost:* Moves away from subjectivist axiology; harder to explain why pain is bad for those who can't form desires (infants/animals) or those who welcome it.
      *   *Give up 6:* Asymbolics aren't irrational, just different. *Cost:* Undermines the protective function of pain; makes tissue damage seem normatively neutral without pain.

