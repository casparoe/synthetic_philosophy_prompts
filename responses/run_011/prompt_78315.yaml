  In clinical ablation, the persistence of a function after tissue removal suggests the function is not *implemented* by that tissue, but it does not prove the function is independent of the organism as a whole. Similarly, the Flying Man's affirmation of self amidst sensory deprivation proves only that self-awareness is not *derived* from sensory input. It establishes the immediacy of self-knowledge, not the substance of the knower. To move from "I am aware of myself without awareness of my body" to "I am not a body" requires an additional premise: that consciousness is transparent to essence. If the self were a bodily function that simply lacked sensory access to its own substrate, the phenomenological result would remain identical. The subject would still feel disembodied, even if they were physically embodied. Therefore, the experiment proves the non-sensory nature of self-awareness, but not the immateriality of the self.

