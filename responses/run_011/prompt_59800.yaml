answer: |-
  Your friend's post is a classic example of "poker table folklore" regarding the Kelly criterion: it captures the spirit and the formula correctly but glosses over the mathematical subtleties that determine whether the strategy succeeds or bankrupts you in the real world. It is more right than wrong in a vacuum, but the errors it contains are dangerous precisely because they sound like rigorous justifications for aggression.

  Here is the claim-by-claim breakdown, followed by the verdict on your specific concerns and a final judgment on the post.

  ### Claim-by-Claim Analysis

  **Claim 1:** *"Kelly betting is what you get when you take expected value seriously and apply it to a whole sequence of decisions instead of a single one."*
  *   **Verdict:** **Accepted Simplification.**
  *   **Reasoning:** This is a fair heuristic description. Kelly is indeed derived from maximizing the expected value of the *logarithm* of wealth over a sequence, rather than the expected value of wealth itself in a single instance.

  **Claim 2:** *"The rule — stake the fraction (bp − q)/b of your bankroll... is the choice that makes the logarithm of your wealth grow as fast as possible."*
  *   **Verdict:** **Accepted.**
  *   **Reasoning:** This is the mathematical definition of the Kelly criterion. It maximizes the expected geometric growth rate.

  **Claim 3:** *"Because wealth compounds multiplicatively rather than additively, maximizing that growth rate is the same thing as maximizing expected wealth; people who insist the two come apart are doing arithmetic on a problem that is geometric."*
  *   **Verdict:** **Wrong.**
  *   **Correct Statement:** Maximizing the geometric growth rate maximizes the *median* outcome of your wealth in the long run, but it does *not* maximize the *expected (arithmetic) value* of your wealth.
  *   **Mechanism of Error:** Your friend is conflating the expectation of the logarithm with the logarithm of the expectation ($E[\log(W)] \neq \log(E[W])$). This is a violation of Jensen's Inequality. Because the logarithm is a concave function, the average of the logs is always less than the log of the average. A strategy that bets *more* than Kelly (over-betting) often has a higher *expected arithmetic value* because of rare, massive upside outliers, but it has a lower *geometric growth rate* and will almost certainly lose to Kelly in a repeated contest. Your friend dismisses this distinction as "doing arithmetic on a geometric problem," but the distinction is real: Kelly maximizes what you will *likely* have, not the mathematical average of all possible outcomes.

  **Claim 4:** *"The rule also settles the question of ruin. Stake the Kelly fraction and you are always left holding some positive portion of your bankroll, so no streak of losses, however improbable, can ever wipe you out."*
  *   **Verdict:** **Harmless Simplification (Theoretically), Dangerous (Practically).**
  *   **Reasoning:** In a continuous mathematical model where you can bet infinitely small fractions, this is true. You never hit zero. However, in reality, bets are discrete (you cannot bet less than a table minimum or a cent). If your bankroll drops below the minimum bettable unit while following Kelly, you are functionally ruined.
  *   **Mechanism of Error:** Modeling a discrete process as continuous.

  **Claim 5:** *"Nor is the rule merely the best performer on average: across a long enough run of bets, the Kelly bettor's wealth exceeds that of every other bettor with probability one, whatever fractions of their bankrolls the others choose."*
  *   **Verdict:** **Wrong.**
  *   **Correct Statement:** As the number of bets approaches infinity, the Kelly bettor will outperform any strategy that is *significantly* different with probability one. However, in any finite timeframe (a human lifetime), a bettor using higher leverage can beat the Kelly bettor, and a bettor using a fraction very close to Kelly (e.g., 99% Kelly) may statistically tie or beat them due to variance.
  *   **Mechanism of Error:** Confusing asymptotic limits with finite reality. "Probability one" applies only as $N \to \infty$. In finite time, variance dominates. A bettor wagering 2x Kelly has a lower growth rate but higher variance; in a short sequence, they have a non-negligible chance of finishing ahead of the Kelly bettor, even though they will almost certainly lose in the infinite limit.

  **Claim 6:** *"That is why the criterion does not depend on your being able to repeat the gamble — the growth-rate argument constrains a single wager just as firmly as it constrains a thousand."*
  *   **Verdict:** **Wrong.**
  *   **Correct Statement:** The Kelly criterion is fundamentally a strategy for repeated play (ergodicity). For a single, one-off wager with no future opportunities, maximizing expected arithmetic value is usually the rational choice unless you have specific personal utility constraints.
  *   **Mechanism of Error:** Ignoring the requirement for ergodicity. The justification for using log-utility (Kelly) on a single bet relies on the assumption that you will face similar probabilistic opportunities in the future. If this is truly a "one-shot" deal with no reinvestment possible, the geometric growth argument collapses.

  **Claim 7:** *"The only objection worth taking seriously is that you have to know the true odds and nobody ever does; but that is an objection to decision theory in general rather than anything peculiar to Kelly, and in practice you simply plug in your best estimate."*
  *   **Verdict:** **Wrong.**
  *   **Correct Statement:** Parameter uncertainty (not knowing true odds) is *more* damaging to Kelly than to other strategies because the Kelly function is aggressive. Overestimating your edge leads to over-betting, which reduces growth rates drastically and increases ruin risk.
  *   **Mechanism of Error:** Underestimating the convexity of risk. The penalty for over-betting is much steeper than the penalty for under-betting. If you think you have a 10% edge but actually have 5%, Full Kelly based on the 10% estimate puts you on the dangerous side of the curve where growth turns negative. This is not a general decision theory problem; it is a specific fragility of the Kelly formula.

  ### Evaluation of Headline Conclusions

  **Conclusion 1: Ruin is impossible.**
  *   **Verdict:** **Dissolves.**
  *   Once you repair the premises to account for discrete betting units (Claim 4) and estimation error (Claim 7), ruin becomes possible and even likely if you overestimate your edge. In the real world, "Full Kelly" with imperfect knowledge carries a significant risk of ruin.

  **Conclusion 2: The Kelly bettor finishes ahead of everyone else with probability one.**
  *   **Verdict:** **Dissolves.**
  *   Once you repair the premises to account for finite time horizons (Claim 5), this guarantee vanishes. In any timeframe relevant to a human life, other strategies (specifically those slightly more aggressive or those that get lucky with variance) can and do outperform Kelly. The "probability one" guarantee requires a timescale that exceeds human mortality.

  ### The Half-Kelly Question

  You asked whether your habit of staking half the Kelly fraction is a superstition or a rational response.

  **It is the rational response.**

  Your friend's post waves away estimation error (Claim 7), but that is the single most important practical variable. The relationship between bet size and growth is asymmetrical.
  1.  **Under-betting:** If you bet half-Kelly, you sacrifice only about 25% of the theoretical growth rate, but you reduce the volatility (variance) of your bankroll by roughly 50%.
  2.  **Over-betting:** If you bet double-Kelly, your expected growth rate drops to zero. If you bet more than double-Kelly, your expected growth becomes negative, and ruin becomes certain.

  Because you cannot know your true edge with precision (as admitted in Claim 7, though dismissed as irrelevant), you are statistically more likely to overestimate your edge than underestimate it. Half-Kelly provides a "safety margin" against this estimation error. It is not squeamishness; it is an optimization for parameter uncertainty. It acknowledges that while Full Kelly is optimal for *known* probabilities, Half-Kelly is often optimal for *estimated* probabilities.

  ### Final Judgment

  Is this a fair summary of the Kelly criterion? **No.**

  While your friend correctly identifies the formula and the general goal (maximizing geometric growth), the post is fundamentally misleading because it presents Kelly as an objective, risk-free maximizer of wealth that applies universally.

  The single error that does the most damage to the argument as a whole is **Claim 3: The conflation of maximizing geometric growth with maximizing expected wealth.**

  This error is the linchpin of your friend's entire philosophical defense. By claiming that "people who insist the two come apart are doing arithmetic on a problem that is geometric," he dismisses the valid mathematical objection that Kelly sacrifices *mean* return for *median* security. If this claim were true, there would be no reason to ever bet less than Kelly; anyone betting less would literally be throwing away expected money. Because the claim is false, the choice to bet less than Kelly (like your Half-Kelly strategy) becomes a rational trade-off between growth and variance, rather than a failure of nerve. This error transforms Kelly from a useful tool for money management into a dogmatic imperative, which is dangerous for any bettor operating with imperfect information.
