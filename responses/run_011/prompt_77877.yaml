answer: |-
  # DIAGNOSTIC INSTRUMENT: ALLOCATION OF AUTHORITY
  **Seminar Handout | Comparative Constitutional Theory**

  **Instructions:** Answer the five questions below based on your intuition about a public problem. Follow the path to identify your structural position. Then review the twelve resulting positions to see how they handle the **River Basin Case**: *Upstream land-use causes downstream flooding; the poorest downstream unit cannot afford retention works; a linguistic minority unit objects to basin-wide standards.*

  ## I. THE LOGICAL SPACE (NODES)

  **1. Origin of Local Power:** When a local unit manages its own affairs, is this because it has an **inherent claim** to do so, or because it is **practically convenient** for the larger union?
  **2. Trigger for Union Action:** What justifies the larger union stepping in? To prevent **harm to others/incapacity**, or to achieve **uniform standards/efficiency**?
  **3. Channel of Authority:** When the union acts, does it order **individuals directly**, or does it instruct **local administrations** to act?
  **4. Guardian of the Boundary:** Who decides if the union overstepped? **Independent judges**, **representatives of local units**, or **no one** (political forbearance)?
  **5. Duty of Support:** If a local unit lacks resources, must the union **take the task over**, or **provide resources** to enable the local unit to do it?

  *Justification:* These five questions are orthogonal. Q1 is ontological (status of power). Q2 is substantive (reason for action). Q3 is administrative (mechanism). Q4 is procedural (review). Q5 is solidaristic (fiscal obligation). Together they distinguish institutional designs that look similar on a "centralize vs. decentralize" scale.

  ## II. THE POSITIONS (LEAVES)

  **1. Dual Federalism (US, 19th C.)**
  *   **Path:** Inherent → Harm → Direct → Judges → Takeover.
  *   **Ugly Commitment:** "We accept that some problems will go unsolved because no level of government is allowed to fix them."
  *   **Illustration:** National government cannot regulate manufacturing conditions within a state.
  *   **River Case:** Legislate: Upstream Unit. Pay: Downstream Unit. Compel: None (Upstream owes no duty).

  **2. Conditional Spending (US, Modern)**
  *   **Path:** Inherent → Efficiency → Direct → Judges → Takeover.
  *   **Ugly Commitment:** "We accept that financial coercion is preferable to direct command, even if it bypasses local accountability."
  *   **Illustration:** Federal highway funds withheld unless states raise drinking age.
  *   **River Case:** Legislate: Center (via conditions). Pay: Center (grants). Compel: Threaten funding cutoff.

  **3. Executive Federalism (Germany)**
  *   **Path:** Convenient → Uniformity → Mediated → Local Reps → Takeover.
  *   **Ugly Commitment:** "We accept that legislation is often paralyzed because local executives hold a veto over national laws they must administer."
  *   **Illustration:** Federal environmental laws administered by state officials subject to upper chamber approval.
  *   **River Case:** Legislate: Center (framework). Pay: Joint. Compel: Federal Council approval required.

  **4. Capacity Federalism (Switzerland)**
  *   **Path:** Inherent → Capacity → Direct → Local Reps → Takeover.
  *   **Ugly Commitment:** "We accept that uniform rights may vary by location because local capacity determines national intervention."
  *   **Illustration:** Confederation acts only if Cantons cannot effectively regulate a matter.
  *   **River Case:** Legislate: Center (if capacity exceeded). Pay: Mix. Compel: Cantonal vote on necessity.

  **5. Conferred Powers (European Union)**
  *   **Path:** Granted → Efficiency → Direct → Local Reps → Takeover.
  *   **Ugly Commitment:** "We accept that national parliaments may block union action even when the problem is clearly cross-border."
  *   **Illustration:** National legislatures issue "reasoned opinions" to halt EU directives.
  *   **River Case:** Legislate: Center (if better achieved). Pay: Mix. Compel: National parliament objection threshold.

  **6. Solidarist Subsidiarity (Catholic Social Teaching)**
  *   **Path:** Inherent → Capacity → Mediated → Judges → Provide Resources.
  *   **Ugly Commitment:** "We accept that higher bodies may be taxed heavily to build capacity in lower bodies that oppose the intervention."
  *   **Illustration:** State must aid private charities to do their work before taking over the function.
  *   **River Case:** Legislate: Center (standards). Pay: Center (retention works). Compel: Duty to assist Upstream.

  **7. Unitary State (France/UK)**
  *   **Path:** Granted → Uniformity → Direct → Judges → Takeover.
  *   **Ugly Commitment:** "We accept that local cultural objections are irrelevant if they conflict with national standards."
  *   **Illustration:** Central ministry dictates school curricula for all regions.
  *   **River Case:** Legislate: Center. Pay: Center. Compel: Direct administrative order.

  **8. Confederal League (Early US/CH)**
  *   **Path:** Inherent → Harm → Mediated → No One → Takeover.
  *   **Ugly Commitment:** "We accept that the union cannot enforce its own laws against a recalcitrant member without war."
  *   **Illustration:** Union requisitions troops from states; states refuse.
  *   **River Case:** Legislate: Upstream Unit. Pay: Downstream Unit. Compel: None (Treaty violation only).

  **9. Market Allocation (Libertarian)**
  *   **Path:** Inherent → Harm → Direct → No One → Takeover.
  *   **Ugly Commitment:** "We accept that wealth disparities determine who is protected from environmental harm."
  *   **Illustration:** Pollution resolved via private tort suits, not regulation.
  *   **River Case:** Legislate: None. Pay: Private actors. Compel: Court damages (if sued).

  **10. Judicial Supremacy**
  *   **Path:** Granted → Uniformity → Direct → Judges → Takeover.
  *   **Ugly Commitment:** "We accept that unelected judges define the scope of political authority."
  *   **Illustration:** Court orders redistricting or prison reform directly.
  *   **River Case:** Legislate: Court Order. Pay: Center. Compel: Contempt of court.

  **11. Political Question Doctrine**
  *   **Path:** Inherent → Efficiency → Direct → No One → Takeover.
  *   **Ugly Commitment:** "We accept that there is no legal remedy when the center usurps local authority."
  *   **Illustration:** Courts refuse to hear challenges to executive war powers.
  *   **River Case:** Legislate: Center (if it chooses). Pay: Political negotiation. Compel: None (Legal bar).

  **12. Functional Regionalism (Basin Authority)**
  *   **Path:** Granted → Harm → Direct → Local Reps → Provide Resources.
  *   **Ugly Commitment:** "We accept that democratic boundaries should be redrawn to match ecological ones, disrupting existing communities."
  *   **Illustration:** Water district board elected by watershed, not state lines.
  *   **River Case:** Legislate: Basin Authority. Pay: User fees. Compel: Authority levy.

  ## III. LIMITATIONS & UNOCCUPIED SPACE

  **Indistinguishable Pairs:**
  *   **Leaves 3 (German) & 5 (EU):** Both rely on local political bodies to police the trigger. The tree cannot separate the *Bundesrat* (executive reps) from the *National Parliaments* (legislative reps) without adding a sixth node on the *type* of local representative, which would over-complicate the instrument.
  *   **Leaves 1 (Dual) & 8 (Confederal):** Both treat local power as inherent and policing as weak. They differ historically in the existence of a central court, but in practice, both often result in local non-compliance.

  **Unoccupied Combinations:**
  *   **Inherent Right + Direct Action + No Policing:** *Verdict: Incoherence.* If local authority is an inherent right, there must be a mechanism to declare when that right is violated. Without a policeman, the "right" is merely a suggestion, collapsing into the Political Question Doctrine (Leaf 11).
  *   **Granted Power + No Trigger + No Policing:** *Verdict: Unattractive.* This is pure centralization without rule of law. It exists in practice (autocracies) but is excluded here as a *constitutional* theory of allocation.
  *   **Inherent Right + Capacity Trigger + Capacity Building:** *Verdict: Neglect.* This is the Catholic view (Leaf 6), but it is rarely implemented as a standalone constitutional structure, usually appearing as statutory policy.

  ## IV. THE REGRESS PROBLEM

  **Question:** *Which "local" level counts? The commune, the region, the nation, or a cross-border basin?*

  **Verdict:** This belongs on a **separate axis**, not as a node on this tree.
  **Reasoning:** Every position on this tree (from Unitary to Confederal) can theoretically apply at any scale. A "Dual Federalism" structure could exist between a global union and nations, or between a nation and its provinces. Placing "Scale" as a node would force every leaf to multiply by four, obscuring the institutional logic. The regress problem is a prior metaphysical question about the *unit* of analysis, whereas this tree classifies the *relationship* between units once defined.
