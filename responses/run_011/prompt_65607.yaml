answer: |-
  You have diagnosed the stalemate with remarkable precision. Your intuition that the debate has shifted from decision theory proper to the philosophy of mind (constitutivism vs. substantive normativity) is correct, but I would argue that the "tractable" issue you flagged—the **temporal structure of agency** (planner vs. timeslices)—is actually the decision-theoretic lever that moves the metaphysical weight.

  Here is why you are right about the deep disagreement, where the technical work is actually hiding, and what progress would look like.

  ### 1. The Metaphysical Bedrock: Constitutivism vs. Normativity
  You are correct that the impasse rests on the status of the VNM axioms.
  *   **The EU Defender (often implicitly Davidsonian):** Preferences *are* defined by their satisfaction of the axioms. If an agent violates Independence, you haven't found a new kind of rational agent; you have failed to correctly assign utilities or probabilities to their mental states. The Dutch Book argument here isn't a pragmatic warning; it's a *reductio* showing the agent's attitudes were incoherent *by definition*.
  *   **The REU Defender (Buchak):** Preferences are psychological states subject to norms. The axioms are substantive norms, not definitional truths. An agent can have coherent beliefs and desires that nevertheless violate Independence because they value the *structure* of the risk, not just the weighted sum of outcomes.

  If the EU defender holds the constitutive line, no theorem will move them, because REU is category-error on their view. If the REU defender holds the substantive line, Dutch Books are merely costs (like paying for insurance), not refutations.

  ### 2. The Tractable Bridge: Timeslices vs. Planners
  You asked if something more tractable is doing the work, specifically regarding "whether the agent is a planner or a pile of timeslices." **Yes.** This is where the metaphysics cashes out in decision-theoretic mechanics.

  The "Dynamic Dutch Book" against REU (often articulated by critics like Thoma, Easwaran, or in the LessWrong tradition) relies on **Separability**. It assumes that at time $t_2$, the agent should evaluate the remaining sub-gamble exactly as they would have evaluated it at $t_1$ had they arrived there directly.
  *   **EU assumes Separability:** Past costs are sunk; the risk profile of a sub-gamble is intrinsic to that sub-gamble. This treats the agent as a sequence of timeslices, each maximizing locally.
  *   **REU implies Non-Separability:** The riskiness of a gamble depends on the *global* distribution of outcomes available at $t_1$. A sub-gamble that looked safe in isolation might look risky relative to the foregone alternative at $t_1$.

  **The Real Fight:** The debate is actually about **Diachronic Agency**.
  *   If you view the agent as a **pile of timeslices**, the REU agent is irrational because her $t_2$ self undermines her $t_1$ plan. She is dynamically inconsistent.
  *   If you view the agent as a **Planner** (à la Bratman), the $t_1$ self has the authority to bind the $t_2$ self. The REU agent is "Resolute" or "Sophisticated." She doesn't maximize at every node; she maximizes over strategies.

  **Progress here is tractable:** We can formally model the REU agent as a resolute chooser. The question then becomes: *Is resolute choice rational?*
  *   **EU Critic:** Resolute choice is irrational self-binding. You are refusing free money at $t_2$ to satisfy a whim at $t_1$.
  *   **REU Defender:** Resolute choice is the essence of agency. Without it, you aren't an agent; you're a channel through which causal forces flow.

  The stalemate persists because EU proponents treat "dynamic consistency" as a requirement of rationality, while REU proponents treat it as a requirement of *predictability*, which is distinct from rationality.

  ### 3. The Redescription Objection (Individuation of Outcomes)
  There is a second tractable formal issue: **Outcome Individuation.**
  Critics argue that any REU function can be represented by an EU function if you individuate outcomes finely enough (e.g., "winning \$100 *in a safe context*" vs. "winning \$100 *in a risky context*").
  *   **If this works:** REU collapses into EU. The "risk function" $r$ is just a quirk of how we defined $u$.
  *   **Buchak's Counter:** This violates "Individuation by Reasons." We should only distinguish outcomes if the agent cares about them for a reason distinct from the risk itself. If the *only* reason to distinguish "Safe \$100" from "Risky \$100" is risk aversion, then you haven't explained risk aversion; you've just named it.

  **Progress here:** We need a principled theory of outcome individuation that doesn't beg the question. Stefánsson and Bradley have worked on this, suggesting that if we allow "risk-weighted" outcomes, we lose the ability to explain *why* the agent prefers one gamble over another without circularity. This is a fertile ground for formal philosophy, but it requires agreeing on constraints on individuation that both sides accept (which is hard).

  ### 4. What Would Count as Progress?
  Given that the constitutive/substantive divide is unlikely to be bridged by proof, progress would look like shifting the burden of proof or finding a new domain where the theories diverge without relying on the contested axioms.

  **A. A Dominance Argument that Doesn't Assume EU**
  Currently, Dutch Book arguments against REU assume that accepting a sure loss is irrational *independent of the risk profile*. But for an REU agent, the "sure loss" might be the price of maintaining a risk profile they value.
  *   **Progress:** A demonstration that REU agents violate a norm that even *they* should accept. For example, showing that REU agents violate a form of **State Dominance** that is compatible with risk-weighting. If REU violates dominance in a way that cannot be justified by risk preferences, the theory is in trouble. (Some argue REU violates "All-Options Dominance," but Buchak disputes the applicability).

  **B. Formalizing the "Planner"**
  Instead of arguing about whether REU is rational, formalize the **conditions under which Resolute Choice is permissible**.
  *   If we can show that Resolute Choice is only rational when specific conditions hold (e.g., high transaction costs of re-evaluation, or specific types of inter-temporal goods), we can limit the scope of REU.
  *   Conversely, if we can show that *all* rational planning requires something like REU (because EU planners are vulnerable to "planning failure" in specific environments), REU gains pragmatic vindication.

  **C. Pragmatic Vindication (Evolutionary/Epistemic)**
  Move away from "coherence" arguments (Dutch Books) to "accuracy" or "fitness" arguments.
  *   **Epistemic:** Does REU lead to better belief formation in uncertain environments? (Work by Pettigrew touches on this).
  *   **Evolutionary:** Do REU strategies outperform EU strategies in iterated games with specific variance structures? If REU agents survive longer in volatile environments despite being "money pumped" in static ones, the normative force of the Dutch Book weakens.

  ### Summary
  You are right: the debate is a philosophy-of-mind fight wearing decision-theory clothing. The EU side thinks rationality is **coherence of state** (constitutive); the REU side thinks rationality is **success of agency** (substantive).

  The "tractable" work is in **Diachronic Choice Theory**. The question isn't "Is Independence true?" but "Is the unit of rational assessment the *decision node* or the *strategy*?"
  *   If the node: EU wins, REU is inconsistent.
  *   If the strategy: REU is live, EU is myopic.

  **Progress** will not come from a new representation theorem. It will come from a robust theory of **Planning Agency** that explains *why* we should care about dynamic consistency. If the pro-EU camp can show that dynamic consistency is required for *social coordination* or *self-governance* in a way that REU undermines, they win. If the REU camp can show that dynamic consistency is merely a fetish for linearity that impedes long-term goal pursuit, they win. Until then, we are just shouting past each other about the definition of an agent.
