      *(Wait, one nuance on "Institutional Standing")*: The prompt asks to distinguish "whether an institution can have standing at all or only the person whose name is on the release." I need to address this. Usually, institutions *do* have standing, but it's tied to their mission consistency. I will codify this in Step 3.

