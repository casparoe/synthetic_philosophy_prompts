      *   Three cases run? Yes.
      *   One-pager included? Yes.
      *   Failure modes included? Yes.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the philosophy preamble. The user wants a *procedure* grounded in philosophy, not an essay. Keep the philosophy embedded in the steps. Ensure the distinction between "Institutional Standing" and "Individual Signatory" is clear—usually, the Org has standing, but the ED signs. If the ED is the problem, that's different. I will assume the ED is the signatory but the Org is the agent.

      *(Refining Case 3)*: Let's make Case 3 about a *board conflict* specifically, since the prompt mentioned "board conflict nobody's resolved." This tests the "Institutional vs. Individual" and "Unresolved Mess" constraint. Actually, the prompt asks for a case we'd *have standing to publish on despite mess* OR *kill even though true*. Let's go with: A callout on a donor practice that is *different* from our grant issue. This tests "Relevant Similarity." If the grant was for *procurement* and the callout is on *labor practices*, do we have standing? Yes. This highlights the "Relevant Similarity" judgment call.

      *Wait, re-reading prompt:* "a third you pick that you think we'd have standing to publish on despite our own unresolved mess, or that we'd have to kill even though it's true."
      Okay, I'll pick: A callout on *Labor Practices* when our dirt is *Procurement/Grant funding*. This allows us to test the "Relevant Similarity" filter. If we pass that, we have standing.

      *Wait, one more check:* "Flag every step that's really a judgment call wearing a procedure costume." I need to make sure these are visually distinct.

      *Final Plan:*
      1.  Intro/Philosophy Brief.
      2.  The Procedure (7 Steps).
      3.  Case Applications.
