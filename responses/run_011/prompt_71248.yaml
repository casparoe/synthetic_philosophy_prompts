answer: |-
  ## The Standing & Hypocrisy Decision Procedure

  **Purpose:** To determine whether the organization has the moral authority (standing) to publicly blame an external actor, given our own history of misconduct.
  **Time Budget:** 20 Minutes.
  **Philosophical Grounding:** Distinguishes between the *truth* of an accusation and the *speaker's right* to make it. Acknowledges that standing can be lost, weakened, deferred, or borrowed, but is distinct from factual accuracy.

  ---

  ### Part 1: The Procedure

  **Step 1: The Truth Test (Fact Check)**
  *   **Question:** Is the accusation factually accurate and verifiable *independent* of our organization's behavior?
  *   **Action:** If **No**, kill the proposal. (A false claim has no standing regardless of our purity).
  *   **Action:** If **Yes**, proceed to Step 2.
  *   *Note:* This separates **Truth of Claim** from **Standing to Make It**.

  **Step 2: The Relevance Test (Similarity Check)**
  *   **Question:** Is our past/present misconduct *relevantly similar* to the actor's misconduct?
  *   **Definition:** "Relevantly similar" means the same mechanism of harm (e.g., both are procurement fraud) OR the same violation of the specific value we are campaigning on (e.g., both undermine transparency).
  *   **Action:** If **No** (Our dirt is unrelated), proceed to Step 5 (Full Standing).
  *   **Action:** If **Yes** (Our dirt is the same type), proceed to Step 3.
  *   **⚠️ JUDGMENT CALL FLAG:** This is the highest-risk step. It is easy to convince yourself that "procurement fraud" is different from "grant acceptance" when they are functionally identical. If you have to argue for more than 2 minutes that they are different, assume they are similar.

  **Step 3: The Status of Our Misconduct (Hypocrisy Check)**
  *   **Question:** What is the current status of *our* similar misconduct?
  *   **Options:**
      *   **A. Active Hypocrisy:** We are currently doing the thing.
      *   **B. Unresolved Failure:** We stopped, but haven't publicly owned it or fixed the structural cause (e.g., the board conflict).
      *   **C. Repaired Standing:** We stopped, publicly owned it, made restitution, and changed the structure preventing recurrence.
  *   **Action:** If **A**, proceed to Step 4 (No Standing).
  *   **Action:** If **B**, proceed to Step 4 (Deferred Standing).
  *   **Action:** If **C**, proceed to Step 5 (Full Standing).
  *   *Note:* This distinguishes **Hypocrisy Proper** (doing it now) from **Failure Owned** (did it, stopped, fixed it).

  **Step 4: The Standing Assessment (Authority Check)**
  *   **Question:** Given Step 3, do we have the standing to name them?
  *   **Logic:**
      *   If **Active Hypocrisy**: Standing is **Lost**. You cannot blame for a sin you are actively committing.
      *   If **Unresolved Failure**: Standing is **Weakened/Deferred**. You have the facts, but not the moral high ground.
      *   If **Institutional vs. Individual**: Note that standing belongs to the *Institution*, not the Comms Director or ED. If the ED is personally implicated, standing is Lost. If the *Org* is implicated, standing is Weakened.
  *   **Action:** If Standing is **Lost**, go to Step 6 (Select Output).
  *   **Action:** If Standing is **Weakened**, go to Step 5 (Harm/Credibility Trade-off).

  **Step 5: The Harm/Credibility Trade-off (Consequentialist Override)**
  *   **Question:** Is the harm caused by the actor severe enough to justify the credibility cost to us?
  *   **Logic:** This is not a fact check. This is a strategic risk assessment.
  *   **Test:** If we stay silent, does significant damage occur *while* we fix ourselves?
  *   **Action:** If **Yes** (Harm is urgent/severe), we may proceed with a **Named Callout** but must include a disclaimer acknowledging our own work-in-progress status.
  *   **Action:** If **No** (Harm is static or slow), we must choose a lower-standing output.
  *   **⚠️ JUDGMENT CALL FLAG:** This is where procedure ends and leadership begins. There is no formula for "how much credibility is worth how much harm." This requires the ED's risk tolerance.

  **Step 6: Output Selection (The Four Paths)**
  *   **Select one based on the path taken above:**
      1.  **Full Named Callout:** (Requires Full Standing OR Urgent Harm Override).
      2.  **Un-named Policy Piece:** (Requires Weakened Standing + Low Urgency). Describes the harm/fix without naming the villain.
      3.  **Hold:** (Requires Active Hypocrisy + Low Urgency). We fix our side first, publish later, and state clearly that we paused for this reason.
      4.  **Hand to Partner:** (Requires Lost Standing + High Urgency). We provide the research to a coalition partner with clean hands; they publish, we amplify.
  *   *Note on Borrowed Standing:* Institutions can borrow standing. If we route the story through a partner, we use their moral authority. We lose credit but stop the harm.

  **Step 7: Final Recommendation (For the ED)**
  *   **Format:** "Recommend: [Option 1-4]. Reason: [Standing Status] + [Harm Level]."
  *   **Constraint:** This must be signable in one line.

  ---

  ### Part 2: Case Applications

  **Case 1: The Mayor's Procurement Scandal**
  *   **Context:** Mayor is rigging bids. We took a grant 2 years ago from a firm that rigs bids.
  *   **Step 1 (Truth):** Verified.
  *   **Step 2 (Similarity):** **Yes.** Taking money from a rigging firm while campaigning against rigging is relevantly similar to the Mayor rigging bids. Both undermine fair procurement integrity.
  *   **Step 3 (Status):** **Unresolved Failure.** We haven't resolved the board conflict or publicly owned the grant mistake.
  *   **Step 4 (Standing):** **Weakened.**
  *   **Step 5 (Harm):** Procurement scandal is ongoing, but likely not an immediate threat to life/safety.
  *   **Step 6 (Output):** **Option 4 (Hand to Partner)** or **Option 2 (Un-named Policy).**
  *   **Decision:** Because the similarity is high and our failure is unresolved, a named callout looks like deflection.
  *   **Final Recommendation:** **Recommend: Option 4 (Hand to Partner). Reason: Weakened Standing due to unresolved grant conflict; harm is significant but partner can carry the load.**

  **Case 2: Ongoing Harm (18-Month Fix)**
  *   **Context:** We are campaigning against data privacy violations. Our program team did this until last year. Fixing our internal systems takes 18 months. Harm to public is happening now.
  *   **Step 1 (Truth):** Verified.
  *   **Step 2 (Similarity):** **Yes.**
  *   **Step 3 (Status):** **Repaired Standing (Partial).** We stopped last year. Have we owned it? If yes, Standing is Recovering. If no, it's Unresolved. Let's assume we stopped but haven't fully owned it publicly. Status: **Unresolved Failure.**
  *   **Step 4 (Standing):** **Weakened.**
  *   **Step 5 (Harm):** **High Urgency.** Public data is being leaked *now*. Waiting 18 months causes real damage.
  *   **Step 6 (Output):** **Option 1 (Full Named Callout)** with disclaimer.
  *   **Decision:** Consequentialist override. The cost to our credibility is high, but the cost to the public is higher.
  *   **Final Recommendation:** **Recommend: Option 1 (Full Named Callout). Reason: Weakened Standing overridden by urgent ongoing harm; include disclaimer on our own remediation timeline.**

  **Case 3: The Labor Practice Callout (My Selection)**
  *   **Context:** We want to call out a Foundation for union-busting. Our "dirty" history is the Procurement Grant (Case 1).
  *   **Step 1 (Truth):** Verified.
  *   **Step 2 (Similarity):** **No.** Procurement fraud (financial integrity) is not *relevantly similar* to Union-busting (labor rights).
  *   **Step 3 (Status):** N/A (Because Similarity is No).
  *   **Step 4 (Standing):** **Full.** Our procurement dirt does not remove our standing to speak on labor.
  *   **Step 5 (Harm):** Standard campaign harm.
  *   **Step 6 (Output):** **Option 1 (Full Named Callout).**
  *   **Decision:** This tests the **Institutional Standing** distinction. The institution is dirty on Finance, but clean on Labor. We do not lose standing on *all* issues because we are dirty on *one*.
  *   **Final Recommendation:** **Recommend: Option 1 (Full Named Callout). Reason: Full Standing; our procurement history is not relevantly similar to labor violations.**

  ---

  ### Part 3: The One-Page Intern Version

  **COMMS DECISION FLOWCHART: CAN WE NAME THEM?**
  *Time limit: 20 Mins. If stuck, escalate to ED.*

  1.  **IS IT TRUE?**
      *   No → **KILL.**
      *   Yes → Go to 2.

  2.  **IS OUR DIRT THE SAME?**
      *   (Are we guilty of the *same type* of thing?)
      *   No → **GO TO 5.** (We have standing).
      *   Yes → Go to 3.
      *   *⚠️ If you have to argue why it's different, assume it's the SAME.*

  3.  **ARE WE STILL DOING IT?**
      *   Yes (Active) → **GO TO 4.** (No Standing).
      *   No (Stopped, but haven't fixed/apologized) → **GO TO 4.** (Weak Standing).
      *   No (Stopped, Fixed, Apologized) → **GO TO 5.** (Standing Repaired).

  4.  **IS THE HARM URGENT?**
      *   No (Can wait) → **HOLD** (Fix us first) OR **UN-NAMED POLICY**.
      *   Yes (Damage happening now) → **PARTNER** (Let them publish) OR **NAMED CALLOUT** (With disclaimer).
      *   *⚠️ This requires ED approval.*

  5.  **SELECT OUTPUT:**
      *   **A. Named Callout:** (We are clean OR Harm is Urgent).
      *   **B. Un-named Policy:** (We are dirty + Harm is Low).
      *   **C. Hold:** (We are dirty + Need to fix us first).
      *   **D. Partner:** (We are dirty + Harm is Urgent + Partner is clean).

  **FINAL LINE FOR ED:**
  "Recommend: [A/B/C/D]. Standing: [Full/Weak/Lost]. Harm: [High/Low]."

  ---

  ### Part 4: Failure Modes (How This Will Misfire)

  1.  **The "Relevance" Loophole:** Staff will consistently argue that *their* specific misconduct is "not relevantly similar" to the target's. (e.g., "Our grant was passive; their fraud is active.") This procedure cannot stop bad faith arguments in Step 2.
      *   *Mitigation:* Require a second pair of eyes on Step 2 for any "No" decision.
  2.  **Risk Aversion Paralysis:** When faced with Step 5 (Harm/Credibility Trade-off), the default human instinct is to protect the org. This will bias decisions toward "Hold" or "Partner" even when "Named Callout" is morally necessary.
      *   *Mitigation:* ED must explicitly state risk tolerance thresholds annually.
  3.  **Partner Fatigue:** Option 4 (Hand to Partner) relies on partners having cleaner hands and capacity. Overuse will burn bridges. Partners will realize they are being used as moral shields.
      *   *Mitigation:* Limit Option 4 to once per quarter per partner.
  4.  **The "Repaired" Illusion:** Step 3 assumes we know when standing is "Repaired." Orgs often think an internal memo counts as "repair." It doesn't. Repair requires public accountability.
      *   *Mitigation:* Define "Repaired" as "Public statement + Structural change" in the org wiki.
  5.  **ED Bottleneck:** The procedure ends with a one-line sign-off, but if the ED is the source of the "glass house" (e.g., the board conflict involves them), they cannot objectively judge Step 5.
      *   *Mitigation:* If the ED is personally implicated, authority delegates to the Board Chair for this specific decision.
