      *   **Problem:** Weekly proposals to call out bad actors, but the org has its own "glass house" issues (past grant from similar firm, board conflict, program team did the same thing until last year).
      *   **Team Split:** Half say "don't let bad actors off hook," half say "publishing while dirty costs credibility."
      *   **Constraints:**
          *   Decision time: ~20 minutes per proposal.
          *   User expertise: No philosophy training.
          *   Final Authority: ED signs off (needs a one-line approve/reject recommendation).
          *   Allowed Outputs: 1) Full Named Callout, 2) Un-named Policy Piece, 3) Hold (Fix self first), 4) Hand to Partner.
      *   **Philosophical Grounding:** Must be grounded in moral philosophy of standing and hypocrisy (usable distinctions).
      *   **Specific Distinctions to Keep Separate:**
          *   Truth of claim vs. standing to make it.
          *   Hypocrisy proper vs. changed mind vs. owned failure.
          *   Lost standing vs. weakened/deferred vs. repaired (and how to know).
          *   Institutional standing vs. individual signatory standing.
          *   Borrowed standing (via partners).
      *   **Meta-Requirement:** Flag steps that are "judgment calls wearing a procedure costume."
      *   **Application:** Run the procedure on three specific cases (Mayor/Grant, Ongoing Harm/18-month fix, Third Case chosen by me).
      *   **Deliverables:**
          1.  The Decision Procedure (detailed).
          2.  Application to three cases.
          3.  One-page Intern Version.
          4.  List of Failure Modes (how it will misfire).

  2.  **Deconstruct the Philosophy of Standing & Hypocrisy:**

      *   *Standing:* The right to blame. Usually requires not being guilty of the same thing *in a relevantly similar way*.
      *   *Hypocrisy:* Saying one thing, doing another.
      *   *Tu Quoque:* "You did it too." This is a logical fallacy regarding the *truth* of the claim, but valid regarding the *speaker's authority*.
      *   *Moral License:* Do we earn the right to speak by being perfect? No. Do we lose it by being egregious? Yes.
      *   *Institutional vs. Individual:* An org is a collective agent. Past actions bind the present if the structure hasn't changed.
      *   *Repair:* Apology + Restitution + Structural Change.
      *   *Urgency/Harm:* Sometimes stopping harm outweighs the cost to credibility (consequentialist override).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* 20 minutes. Needs to be a flowchart logic but written as steps.
      *   *Step 1: Truth Check.* (Fast). Is the accusation factual? If no, kill.
      *   *Step 2: Similarity Check.* (The "Judgment Call" zone). Is our dirt *relevantly similar* to their dirt?
      *   *Step 3: Status of Our Dirt.* (Distinctions: Hypocrisy vs. Change vs. Owned). Did we stop? Did we own it?
      *   *Step 4: Standing Assessment.* (Lost vs. Weakened). Can we speak?
      *   *Step 5: Harm/Credibility Trade-off.* (The Human Call). If standing is weak, is the harm bad enough to risk it?
      *   *Step 6: Output Selection.* (The 4 options).

      *   *Refining the Philosophy:* I need to make sure I explicitly address the prompt's required distinctions.
          *   *Truth vs. Standing:* Step 1 vs. Step 4.
          *   *Hypocrisy types:* Step 3.
          *   *Standing status:* Step 4.
          *   *Institutional vs. Individual:* Step 2/3 (Org history matters).
          *   *Borrowed Standing:* Step 6 (Partner option).

      *   *Flagging Judgment Calls:* I need to insert "WARNING: JUDGMENT CALL" markers where subjectivity creeps in.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Mayor/Grant):* We took money from a firm doing what the Mayor is doing.
          *   *Analysis:* Similarity is high. Standing is low.
          *   *Output:* Likely "Hold" or "Partner."
      *   *Case 2 (Ongoing Harm/18-month fix):* We do the thing, but stopping takes 1.5 years. Harm is happening now.
          *   *Analysis:* Consequentialist override. Credibility hit vs. Real World Damage.
          *   *Output:* "Un-named Policy" or "Named Callout with Disclaimer." Let's push for "Named Callout" if harm is severe, acknowledging the cost.
      *   *Case 3 (My Choice):* Needs to test the "Changed Mind" or "Institutional vs. Individual" distinction.
          *   *Idea:* A specific staff member's behavior vs. Org policy. Or, a issue we *used* to campaign on but stopped.
          *   *Selection:* A callout on a specific tactic (e.g., surveillance) that our *program team* used until last year, but we publicly renounced and stopped.
          *   *Analysis:* This tests "Repair" and "Changed Mind." If we owned it and stopped, standing might be recovered.

  5.  **Drafting the Content (incorporating constraints):**

      *   *Tone:* Professional, direct, slightly philosophical but operational.
      *   *Structure:*
          1.  Philosophy Preamble (brief).
          2.  The Procedure (Step-by-step).
          3.  Case Studies.
          4.  One-Pager.
          5.  Failure Modes.

      *   *Self-Correction on "One Line ED Approval":* The procedure must end with a specific recommendation like "Recommend: Option 2."

      *   *Refining the "Judgment Call" Flags:* The prompt asks to flag steps that are "judgment call wearing a procedure costume." I will highlight these explicitly.

      *   *Refining the "Standing" Distinctions:*
          *   *Truth:* Separate from standing.
          *   *Hypocrisy:* Distinguish between "doing it now" (fatal) vs "did it, stopped, owned it" (recoverable).
          *   *Institutional:* The org is the agent, not just the comms director.
          *   *Borrowed:* Partners can carry the load.

  6.  **Writing the One-Pager:**
      *   Needs to be ultra-simple. Yes/No logic.
      *   Must map to the 4 outputs.

  7.  **Writing the Failure Modes:**
      *   Where will this break?
      *   *Risk:* Risk aversion (always choosing "Hold").
      *   *Risk:* "Similarity" bias (convincing ourselves it's different).
      *   *Risk:* Partner fatigue.
      *   *Risk:* ED bottleneck.

  8.  **Final Review against Constraints:**
      *   20 mins? Yes, if steps are tight.
      *   No philosophy training? Yes, terms defined simply.
      *   ED sign-off? Yes, final recommendation line.
      *   4 Outputs? Yes.
