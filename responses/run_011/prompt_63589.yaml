      *   *The Oath:* The 1934 oath was personal to Hitler. Aquinas on oaths: An oath to do something unlawful is not binding. If the commander commands against the common good (which authority serves), the oath loses force. However, Aquinas is big on order. Breaking an oath is a sin against religion/truth. But obedience to a tyrant commanding evil is not required. The tension is between the sin of perjury and the sin of cooperating with tyranny. Aquinas would likely say the oath cannot bind one to facilitate the destruction of the common good.

