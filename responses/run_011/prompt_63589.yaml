answer: |-
  Your summary of the Thomistic apparatus is accurate enough for this exercise. You have correctly identified the distinction between *tyrannus in titulo* (usurper) and *tyrannus in regimine* (legitimate ruler turned tyrant), the prohibition on private initiative, the harm comparison (disturbance vs. tyranny), and the recourse to God when human mechanisms fail. I will not correct your premises, but I will hold you to your request: I will not stretch Aquinas to fit where the fit is bad.

  Here is the analysis of the July 20 plot through that specific Thomistic lens.

  ### (a) The Status of the Ruler and the Oath

  **Usurper vs. Legitimate Tyrant**
  On Aquinas's terms, Hitler falls squarely into the category of the legitimate ruler who degenerates into tyranny (*tyrannus in regimine*), not the usurper (*tyrannus in titulo*). He assumed office through the constitutional mechanisms of the Weimar Republic and the subsequent Enabling Act procedures. The initial title was valid.

  You ask if the total absence of ordering to the common good (the extermination program) changes the classification. In Aquinas's metaphysics of authority, a ruler who utterly abandons the common good ceases to rule *as a ruler* and rules *as a bandit*. However, Aquinas is deeply cautious about who gets to make that declaration. If the subjects themselves declare the title void, we are back to private initiative. For Aquinas, the *de facto* continuation of the regime's functioning usually maintains the presumption of legitimacy until a superior authority (like an Emperor over a King, or the Church over a Christian Prince) declares otherwise. There was no superior temporal authority over Hitler, and the Church's excommunications did not amount to a formal deposition of temporal power. So, structurally, Hitler remains a legitimate ruler turned tyrant. This triggers Aquinas's most restrictive conditions: private persons cannot act.

  **The Oath**
  The 1934 personal oath to Hitler presents a specific Thomistic problem. Aquinas treats oaths in the *Secunda Secundae*. His principle is that an oath is an act of religion, but it cannot bind a person to do something unlawful. If a superior commands something contrary to Divine Law or the fundamental good of the community, the oath to obey that superior is void *in that matter*.

  Since the extermination program and the aggressive war are violations of Divine and Natural Law, the oath does not bind the officers to facilitate those specific acts. However, Aquinas distinguishes between *refusing an unlawful order* and *actively deposing the superior*. The oath's invalidity regarding specific crimes clears the ground for disobedience, but it does not automatically confer the authority to kill the ruler. The oath problem is a dead end for justifying the *coup*, though it successfully dissolves the obligation of *obedience* to specific criminal orders. Aquinas would likely say the officers were free to refuse to send Jews to camps, but not necessarily free to kill the Chancellor for ordering it, absent public authority.

  ### (b) The Authority Question

  This is indeed the crux, and here the mapping fractures.

  **Public Authority vs. Private Person**
  Aquinas requires that action against a legitimate tyrant be undertaken by "public authority." In his 13th-century context, this means the "multitude" acting through its representatives (the nobility, the estates, or a superior magistrate). Stauffenberg was a Colonel in the Reserve Army. He held a commission, which is a form of public authority. However, his commission was derived *from* Hitler.

  Aquinas assumes a hierarchy where authority flows from God through the community to the ruler, but also that there are intermediate bodies that retain some standing. In the Third Reich, the "intermediate bodies" were dissolved or Nazified. The Army was one of the few remaining, but it was sworn personally to the Führer.

  When Stauffenberg activated Valkyrie, he was using a state mechanism (a public tool) for a purpose the head of state forbade. Aquinas has no category for "rightful internal subversion." To Aquinas, if you are not the superior of the tyrant, and you are not the designated representative of the multitude authorized to depose him, you are a private person. The fact that Stauffenberg wore a uniform does not make him a "public authority" in the Thomistic sense if his action is not sanctioned by the polity's constitutional structure. Since the constitutional structure *was* Hitler, Stauffenberg is, by Thomistic definition, a private person initiating violence.

  **Silence on Totalitarianism**
  Aquinas is silent on the situation where the *only* institutional capacity left standing is inside the tyrant's own apparatus. He assumes a polity where the "public" exists independently of the "ruler." In 1944 Germany, the "public" had been absorbed by the "state," and the "state" was the "party," and the "party" was the "leader." Aquinas's condition of "public authority" presupposes a separation between the office and the office-holder that totalitarianism deliberately obliterated. You cannot map "public authority" onto Stauffenberg without admitting that Aquinas's political ontology cannot comprehend a totalitarian state. He would likely view Stauffenberg as a seditious private actor, regardless of the Valkyrie order, because the *mandate* to use that order for deposition did not exist.

  ### (c) The Harm Comparison

  **Ex Ante vs. Ex Post**
  Aquinas's harm comparison is a matter of prudence. Prudence judges what is reasonable to expect *ex ante*, though *ex post* failure often indicates a defect in prudence. The condition is: will the disturbance cause more harm than the tyranny?

  In mid-1944, the war was militarily lost. The tyranny was actively engaged in industrial murder. A reasonable actor could argue that the status quo guaranteed millions more deaths (war + camps), whereas a successful coup offered a chance of negotiated peace and cessation of the camps. On a purely utilitarian calculation of lives, the *ex ante* harm comparison favors the attempt.

  **The Testimonial Argument**
  Tresckow's argument ("the world must see") introduces a value Aquinas's framework cannot process. Aquinas is concerned with the *temporal common good* (peace, justice, order). He is not concerned with the moral reputation of the nation or the historical ledger of guilt.

  For Aquinas, an act that disrupts order is permissible *only* if it restores order or prevents greater temporal harm. An act undertaken partly to secure a "moral witness" introduces a private good (the honor of the conspirators or the nation's soul) into a calculation that must be strictly about the common temporal good. If the coup fails (as it did), and the result is increased tyranny (the People's Court, intensified security), the testimonial value does not offset the temporal harm in Aquinas's calculus. The "witness" is spiritual; the harm is physical and political. Aquinas does not allow spiritual goods to justify political disorder in this context. Therefore, Tresckow's justification is extraneous to Thomistic theory. It is a modern existential argument grafted onto a medieval political framework.

  ### (d) What the Episode Does to the Theory

  **The Structural Gap**
  Your suspicion is correct: the episode exposes a structural gap. The "no private initiative" rule is calibrated for a corporatist or feudal polity where authority is diffuse. It relies on the existence of "notables" or "estates" who can legitimately convene and act against the king without being considered private conspirators.

  Totalitarianism systematically demolishes these bodies. By doing so, it immunizes itself against Thomistic resistance theory. If the only people with weapons are sworn personally to the tyrant, and the "multitude" has no representatives, then the condition for legitimate resistance (public authority) can never be met. The theory creates a catch-22: you need public authority to kill a tyrant, but the tyrant controls all public authority.

  **Recourse to God as Quietism**
  In this gap, Aquinas's counsel to have "recourse to God" functions as quietism. In a medieval context, this might mean prayer, penance, or waiting for a foreign intervention or a natural death. In 1944, waiting for God meant waiting for the Allies or waiting for the regime to collapse on its own. While the Allies did eventually destroy the regime, Aquinas's clause offers no guidance for those who believe they must act *before* the total destruction of their community. It effectively tells the resistance to wait until resistance is no longer necessary.

  **Can a Thomist Absorb the Case?**
  A modern Thomist could attempt to absorb the case by redefining "public authority." They could argue that in a totalitarian state, the "conspiracy of the decent" *becomes* the provisional public authority by virtue of representing the natural law that the tyrant has violated. They would argue Stauffenberg acted *as* the "multitude's representative."

  However, this stretches the doctrine to the point of unfalsifiability. If any group that claims to represent the common good counts as "public authority," the prohibition on private initiative collapses. If, conversely, the Thomist says Stauffenberg lacked authority and the harm comparison failed (because the coup failed), then the theory offers no guidance for the next resistance movement other than "don't try unless you are sure you will win." This makes the doctrine a counsel of success, not justice.

  **Anomaly or Uncontemplated?**
  This is an uncontemplated case. Aquinas wrote for a world where the King was under God and Law, and where the Church held a sword of spiritual deposition. He did not write for a world where the State is total, the Law is the Leader's will, and the Church is marginalized.

  The doctrine was never meant to license action in practice easily; it was meant to restrain it. It is a dam, not a gate. The July 20 plot shows that when the water rises above the dam (totalitarian atrocity), the dam breaks, but the theory provides no blueprint for the breach. The episode suggests that Thomistic resistance theory is structurally incapable of addressing regimes that successfully monopolize all institutional violence and legitimacy. It requires a pluralistic society to function. In a monistic tyranny, Aquinas's conditions render resistance theoretically impossible, leaving the actor to choose between violating the theory or accepting the tyranny. Stauffenberg chose to violate the theory. Aquinas would likely call it sedition; history calls it heroism. That disconnect indicates the theory's limits, not the actor's failure.
