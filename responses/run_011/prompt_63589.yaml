      *   *Analysis:* Stauffenberg is in a limbo. He holds a commission (public authority), but he is using it against the source of that commission. Aquinas would likely view this as "private initiative" because there was no *higher* or *parallel* public body (like a Senate or Pope in temporal matters) authorizing the act. The fact that Valkyrie existed doesn't make it "public authority" in the Thomistic sense if the *intent* is sedition against the legitimate head. *Correction:* If the regime is tyrannical, the "public authority" resides in the *community*, not the tyrant. But who speaks for the community? Stauffenberg claimed to speak for the "other Germany." Aquinas would ask: Is he recognized by the notables/multitude as their proxy? At the moment of the bomb, no.

