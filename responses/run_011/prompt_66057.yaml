      *Wait, let's look at the "Concession" strategy.* The user needs to buy credibility. Admitting the "400 years" is too narrow is a good move. Admitting the "crying" is anecdotal is good.
      *   *The "Kill Shot":* The distinction between the *engine* (biology) and the *vehicle* (culture).
      *   *Music Analogy:* Embrace it, but clarify that "dessert" doesn't mean "unimportant."

      *Let's refine the "Prayer Question".* The user's candidate ("Why did you write six?") is actually quite good because it forces a personal/philosophical answer. A worse one is technical: "What is the heritability coefficient of narrative appetite?" (Shows the user has no data). Or "Can you operationalize 'cultural selection'?"
      *   *Best "Prayer Question":* "If the form is culturally selected for profit/prizes, why do the best novels often fail commercially?" (Attacks the mechanism of selection).

      *Let's finalize the structure.*
      1.  Intro/Strategy.
      2.  Objections (Ordered by Damage). Voice, Reply, Soft Spot.
