      *   **Material:** An essay for a magazine (publishes *after* the conference, so can be revised).
      *   **Core Argument:** Story appetite is a spandrel (byproduct of causal modeling + social monitoring). Novel *form* is designed, but by cultural selection (400 years of industry), not natural selection. Not an exaptation (co-option happened in cultural history, not biological). Evidence: Literary forms change, appetite doesn't; we cry at fake deaths.
      *   **Audience/Panel:**
          1.  Senior Lit Darwinist (Story = Adaptation for coalitions).
          2.  Senior Lit Darwinist (Fiction = Flight Simulator).
