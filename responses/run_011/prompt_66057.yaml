      7.  One-Liners.
      8.  The Prayer Question.

      *Tone Check:* The user is a novelist. The language should be crisp, slightly wry, but authoritative. Avoid jargon where possible, or explain it simply.

      *Specific tweak on the Anthropologist:* The user claims forms churn wildly. The Anthro says oral tradition is conserved. This is a direct factual clash. The User needs to distinguish *oral* tradition from *novelistic* form. The User's essay is about the *novel*. The Anthro talks about *foragers*. This is the wedge.

      *Specific tweak on the Grad Student:* Exaptation vs. Spandrel. Gould/Lewontin. If the user says "Not an exaptation because co-option happened in cultural history," the Grad Student will say "Exaptation is a biological term. You're mixing levels." The User needs to concede the terminology is metaphorical.

      *Specific tweak on the Computationalist:* Drift vs. Selection. If cultural change is just drift, there's no "design." The User needs to argue for *bias* in transmission (readers prefer X over Y).

      *Let's write.*
answer: |-
  Here is your prep sheet. It is designed for the train, for memory, and for the mouth.

  ### The Strategy
  You are the canary in the coal mine. They expect you to be the "creative" who doesn't understand the science. Do not try to out-science them. Out-narrate them. Your authority is the *object* of their study (the novel), not the *method* (the regression).

  ### The Objections (Ordered by Damage)

  **1. The Coalition Adaptationist (Senior Lit Darwinist)**
  *   **The Voice:** "You call it a spandrel, but spandrels don't consume 20% of our waking metabolic budget. If story were just noise, selection would have silenced it. It's too expensive to be an accident. It tracks coalitions because it keeps us alive."
  *   **The Reply:** "Expensive things aren't always tools. Peacock tails are expensive; they don't help you fly. I'm arguing the *appetite* is the tail—a signal of a healthy causal engine. But the *novel*? That's the cage we built to show it off. Selection didn't design the cage. We did, to see how big the tail could grow."
  *   **The Soft Spot:** You are hand-waving the metabolic cost. If they press on *why* the spandrel is so energy-intensive, you have no hard data.
  *   **One-Liner:** "If it's just noise, why does it cost so much to keep the radio on?"

  **2. The Anthropologist (Field Veteran)**
  *   **The Voice:** "You say literary forms churn wildly. I've spent thirty years with foragers. The stories don't change. The structure is identical across continents. The appetite isn't just constant; the architecture is too. Your 'cultural selection' ignores deep time."
  *   **The Reply:** "You're right about the deep time. I'm talking about the *novel*, not the campfire. The campfire is the biology; the novel is the technology. A spear and a drone both kill, but only one is engineered. I'm studying the drone. Don't confuse the engine for the chassis."
  *   **The Soft Spot:** You risk sounding like you think history started in 1700. If you dismiss oral tradition too lightly, you lose the room.
  *   **One-Liner:** "You're studying the campfire; I'm studying the printing press. Don't mix the fuel with the engine."

  **3. The Taxonomy Policeman (Phil-Bio Grad Student)**
  *   **The Voice:** "You say it's not an exaptation because the co-option happened in cultural history. That's not what exaptation means. That's a category error. You're using biological terms metaphorically, which undermines the whole spandrel claim."
  *   **The Reply:** "Guilty. I'm using the map, not the territory. When I say 'design,' I mean it looks designed, not that it has a gene. I need a word for 'selected by readers, not predators.' If you have a better word than 'cultural selection,' I'll take it. But the mechanism—variation, selection, retention—is the same."
  *   **The Soft Spot:** This is your weakest technical flank. You *are* borrowing terminology loosely.
  *   **One-Liner:** "I'm using your map to draw my own territory. If the labels are wrong, fix them, but the landscape is real."

  **4. The Computational Modeler**
  *   **The Voice:** "How do you distinguish your 'cultural selection' from drift? Stylistic change often looks like random walk noise. What's the selection pressure? 'Bankruptcy' isn't a mechanism, it's a metaphor."
  *   **The Reply:** "Bankruptcy is a mechanism. It stops the meme from replicating. If a book doesn't sell, the printer doesn't print it. That's not drift; that's a hard filter. Drift is random; the market is brutal. It selects for readability, not truth. That's why we cry at fake deaths."
  *   **The Soft Spot:** "Bankruptcy" is a crude proxy for fitness. They will want a transmission bias model.
  *   **One-Liner:** "Drift is random. Bankruptcy is a wall. You can't drift through a wall."

  **5. The Flight Simulator Adaptationist (Senior Lit Darwinist)**
  *   **The Voice:** "We run simulations to practice danger. You say we cry at fake deaths. That's the point. It's safe practice for real grief. It's a flight simulator, not a spandrel."
  *   **The Reply:** "A flight simulator tracks physics. Fiction tracks emotion. If I read about a drowning, I don't learn how to swim. I learn how to feel about loss. That's not simulation; that's calibration. You're tuning the instrument, not flying the plane."
  *   **The Soft Spot:** The line between "calibration" and "simulation" is thin. They will push this.
  *   **One-Liner:** "A simulator teaches you to land. A story teaches you to crash."

  **6. The Reading Psychologist**
  *   **The Voice:** "You base your emotional claim on 'people sob.' That's anecdote. My eye-tracking shows cognitive load, not truth-tracking. You need data, not intuition."
  *   **The Reply:** "I agree. My essay is a hypothesis, not a dataset. That's why I'm here. You have the eye-trackers; I have the texts. Let's collaborate. But don't tell me the tears aren't real just because you can't weigh them."
  *   **The Soft Spot:** You have no data. You must lean into this vulnerability.
  *   **One-Liner:** "You measure the eye; I measure the tear. Both are wet."

  ---

  ### The Concessions (Buy Credibility Early)
  Make these in your first three minutes. It disarms them.

  1.  **The "400 Years" Claim:** "When I say four hundred years of selection, I know that's short. I mean the *industrial* novel. The storytelling instinct is ancient. I'm isolating the technology, not the biology."
  2.  **The Terminology:** "I know I'm borrowing biological terms. I'm a novelist, not a biologist. If the taxonomy is off, correct me. But don't let the labels hide the mechanism."
  3.  **The Data:** "My evidence is anecdotal. I know it. That's why I need this room. I bring the puzzle; you bring the pieces."

  ---

  ### The One Reply That Must Land
  If you lose this, you lose the room. It addresses the core tension between Biology and Culture.

  **The Objection:** "If natural selection didn't design the story, what did?"
  **The Reply:** "Natural selection built the *hunger*. Culture built the *meal*. Selection gave us a brain that craves causal patterns and social intel. But the three-act structure? The withheld revelation? That's not in the genes. That's in the marketplace. We engineered the novel to feed the hunger selection gave us. Selection made the mouth; we made the spoon."

  ---

  ### Where You Must Revise the Essay
  You cannot parry these; you must rewrite.

  1.  **The Exaptation Definition:** The Grad Student is technically right. You cannot simply redefine exaptation to fit cultural history without acknowledging the level-shift. Add a paragraph clarifying that you are using "exaptation" analogically, or switch to "cultural co-option."
  2.  **The "Churn" Claim:** The Anthropologist will eat you alive if you claim *all* narrative forms churn wildly. Qualify this. Specify that *written, commercial* forms churn. Oral traditions are stable. Acknowledge the distinction.

  ---

  ### The Music/Dessert Analogy
  **Embrace it, but refine it.**
  Pinker's "auditory cheesecake" is famous, but it implies uselessness.
  **Say this:** "Pinker called music cheesecake. That implies it's a treat. I'm calling it a shadow. A shadow isn't a treat, and it isn't a tool. It's just what happens when light hits an object. Story is the shadow cast when our social brain blocks our causal brain. It's not dessert. It's geometry."
  *Why:* It sounds more profound and less dismissive of the art form.

  ---

  ### One-Liners for Your Novel
  *Put these in the mouths of your characters to test if you understand the objections.*

  1.  **Adaptationist:** "We didn't evolve to tell lies. We evolved to survive them."
  2.  **Anthropologist:** "The fire changes, but the circle around it stays the same."
  3.  **Grad Student:** "You're calling a spade a shovel and asking why it won't dig."
  4.  **Computationalist:** "Is this pattern signal, or just the noise of time?"
  5.  **Psychologist:** "Show me the data, not the drama."
  6.  **You:** "The hunger is old. The food is new."

  ---

  ### The Prayer Question
  You asked if "Why did you write six of these?" is the worst question.
  **No.** That question is a gift. It lets you talk about compulsion and the spandrel firing.

  **The Worst Question:**
  **"If the novel is selected by the market for profit, and the market prefers lies to truth, isn't your theory just a fancy way of saying capitalism makes us stupid?"**

  *Why it kills you:* It reduces your "cultural selection" to "commerce," making your theory a political critique rather than an evolutionary one. It strips the "design" of any complexity.
  *How to answer:* "Capitalism is the environment, not the designer. Evolution doesn't care about truth either; it cares about fitness. Sometimes truth fits. Sometimes lies do. My theory explains why both sell."
