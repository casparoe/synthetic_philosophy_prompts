      *   *Medium Damage:* The Grad Student (Taxonomy). If definitions are wrong, the theory is sloppy.
      *   *Medium Damage:* The Computationalist. If cultural selection = drift, the "design" claim fails.
      *   *Lower Damage:* The Psychologist. Mostly methodological nitpicking, unless they attack the emotional response claim hard.

      *Refining Voices:*
      *   *Lit Darwinist 1 (Coalitions):* Focus on cost, universality, fitness payoff.
      *   *Lit Darwinist 2 (Flight Sim):* Focus on simulation, safety, planning.
      *   *Anthropologist:* Focus on deep time, cross-cultural stability, function in the wild.
      *   *Grad Student:* Focus on Gould, precise terminology, category errors.
      *   *Computationalist:* Focus on signal vs. noise, transmission bias.
      *   *Psychologist:* Focus on empirical evidence, replication, anecdote vs. data.

  4.  **Drafting Replies (Sayable & 90 Seconds):**
      *   Need to sound conversational, not academic. Short sentences. Pauses.
      *   Need to acknowledge validity where possible (buy credibility).
      *   Need to pivot back to the core distinction: Biological vs. Cultural selection.

  5.  **Identifying Concessions (Buy Credibility):**
      *   Admit the "400 years" line is too short. Novel *printing* is 400 years, storytelling is older.
      *   Admit "crying" is anecdotal.
      *   *Crucial Concession:* Acknowledge that *some* narrative capacity might be adaptive, but the *novel* specifically is cultural. This separates the biological hardware from the cultural software.

  6.  **The "Kill Shot" Reply:**
      *   What keeps the talk alive? The distinction between the *appetite* (biological spandrel) and the *form* (cultural artifact). If this holds, the adaptationists are fighting a different battle.

  7.  **Revisions Needed:**
      *   Where is the user actually wrong or weak?
      *   The "400 years" claim is historically shaky (oral tradition).
      *   The definition of exaptation might be technically off according to the Grad Student.

  8.  **The Music/Dessert Analogy:**
      *   Pinker calls music "auditory cheesecake."
      *   User is calling story a spandrel.
      *   *Advice:* Use it, but refine it. It's accessible. But don't let it trivialize the *function* of the cultural artifact.

  9.  **The "Prayer Question":**
      *   User's candidate: "Why did you write six?"
      *   *Worse Question:* "If story is a spandrel, why does your specific book demand we care about the drowning?" (Traps the author in performative contradiction). Or "If it's just cultural selection, why should we study it scientifically?"
      *   *Actually, the worst one:* "If the appetite is a spandrel, why is it so metabolically expensive to maintain?" (The Adaptationist trap).
      *   *Better "Prayer Question":* "If the novel is designed by cultural selection, who is the selector? The market? If so, isn't that just capitalism, not evolution?" (Undermines the scientific pretension).
      *   *Let's go with:* "If story is a byproduct, why does bad storytelling feel like a threat to your survival?" (Hits the emotional/physiological reality).

  10. **One-Liners for the Novel:**
      *   Need to capture the essence of the objection in dialogue.

  11. **Review and Refine:**
      *   Check tone: Supportive, sharp, practical.
      *   Check constraints: No reading list. Spoken rhythm.
      *   *Self-Correction on Ordering:* The Anthropologist might be more damaging than the Adaptationists because the User specifically claims forms churn wildly. If the Anthro says "No they don't," the User's evidence collapses. I will rank the Anthro high. The Adaptationists are expected opposition; the Anthro is factual contradiction.
      *   *Actually, the Grad Student is dangerous.* If the terminology is wrong, the whole theoretical framework is dismissed as amateurish. I'll put the Grad Student's taxonomy check as a "credibility killer" but maybe less damaging to the *core idea* than the Anthro.
      *   *Decision:* Order by "Damage to Core Thesis."
      *   1. Adaptationist (Coalition) - Direct contradiction.
      *   2. Anthropologist - Contradicts evidence (churning vs. stable).
      *   3. Grad Student - Contradicts framework (definitions).
      *   4. Computationalist - Contradicts mechanism.
      *   5. Psychologist - Contradicts data quality.
