answer: |-
  Hey, I hear you on the 2am argument. That is a classic rite of passage for anyone teaching ethics near an econ department, and honestly your roommate is articulating a version of the reductionist view that Parfit made famous, so you are up against some serious firepower. The problem is that if you just lecture on the distinctness of persons, the econ majors will treat it as a metaphysical assertion without cash value. You need them to feel the friction of the distinction in their guts before you give it a name. I have designed a activity called the Continuity Game that fits your constraints, keeps all twenty-four students moving, and rigs the reveal exactly how you asked. It requires no handouts other than slips of paper you can write out on the bus, and it uses the Halloween candy as stakes.

  You will start by dividing the class into eight groups of three students each. Arrange the desks so each trio is isolated. Tell them they are going to play two rounds of a decision game where they earn points redeemable for candy at the end. For the first round, hand each group a slip labeled Life Plan. Tell them that within their group, they are not three people but one single person planning across three decades of life. Assign them roles internally as Decade One, Decade Two, and Decade Three, but emphasize that because they are one person, they share a single bank account of points. Present them with a choice between Policy Alpha and Policy Beta. Policy Alpha gives ten points to each decade for a total of thirty. Policy Beta gives minus ten points to Decade One, zero to Decade Two, and fifty points to Decade Three, for a total of forty. Give them ten minutes to discuss and decide. Almost every group will choose Beta because the total sum is higher and they understand that one part of a life sacrificing for a later part is rational. They will pool their points mentally because you told them they are one person.

  For the second round, hand them a slip labeled Village Council. Tell them that this time they are three distinct villagers living in a small community. Assign them roles as Villager A, Villager B, and Villager C. Tell them the goal is to maximize the total welfare of the village. Give them the exact same payoff structure. Policy Alpha gives ten points to each villager. Policy Beta gives minus ten to Villager A, zero to Villager B, and fifty to Villager C. Give them ten minutes. Most groups will again choose Beta because the utilitarian sum is higher and the framing of maximizing total welfare invites them to ignore distribution. At this point, you have twenty minutes elapsed and they have made identical choices based on summing.

  Now comes the twist that eats up the next twenty minutes. Collect the sheets and tell them you need to verify the scores. Then announce that there was a metaphysical error in the instructions for Round One. Reveal that Decade One, Two, and Three were actually three different students who are forbidden from talking to each other and cannot transfer points between decades. Tell them you are going to replay Round One under the correct rules. Have them sit back-to-back or put up dividers so they cannot speak. Pass out new slips. Tell Decade One they must choose Alpha or Beta alone. If they choose Beta, they lose ten points and cannot be compensated by Decade Three later because communication is banned. Decade Three will get the fifty points but Decade One takes the hit with no recourse. You will see the mood shift instantly. Decade One will refuse Beta. They will feel exploited. Then, for the mirror image you wanted, tell them that for Round Two, the Village Council was actually allowed to transfer points after the decision but they didn't realize it. Ask them if knowing they could have taxed Villager C to compensate Villager A changes whether Beta was acceptable. This creates the symmetry. The objection is not about summing, it is about compensation and consent.

  You have fifteen minutes left for the debrief and this is where you win the argument without naming Rawls yet. Start by asking the groups where they felt the decision was fair and where it felt like someone was being used. Expect them to say that sacrificing Decade One felt fine when they could talk and pool points, but felt wrong when Decade One was silent and isolated. Ask them what changed between the two versions of Round One. The answer you want is that the ability to compensate or consent disappeared. Then ask them if the Village case would feel different if Villager C was forced to pay Villager A. They will say yes, it becomes fairer. This maps directly onto the objection. The utilitarian sum is the same in all cases, but the moral status changes based on whether the loser can be compensated or had a say. This isolates the separate persons objection as a problem of distribution and enforcement, not just metaphysics.

  You need to be ready for the econ majors who will raise their hands and say that if transaction costs were zero, the Coase theorem says they would have negotiated a bribe in the silent round anyway. If this happens, agree with them but point out that the real world has transaction costs. Rawls is making a political point, not a metaphysical one. He is saying we cannot assume society works like a single mind because we cannot force Person A to accept a loss for Person B's gain without their consent. The game proves that when you remove the mechanism of consent, the intuition for summing collapses. If the class shrugs and sides with your roommate, asking why it matters if the total happiness is higher regardless of who feels it, pivot to the question of stability. Ask them if Decade One would cooperate in a second game if they got screwed in the first. They will say no. This shows that ignoring separate persons is unsustainable for social cooperation over time.

  There are two predictable problems you need to manage. First, you will likely have one or two students who refuse to play the utilitarian game at all and argue that sacrificing anyone is wrong regardless of the points. If they start lecturing the group, gently remind them that the goal of the activity is to test the intuition about summing, not to find the perfect moral theory. Ask them to play along for the sake of the experiment and save their objection for the debrief. Second, some groups might try to hack the scoring by lying about their points in the silent round. Prevent this by collecting the slips immediately and calculating the candy distribution yourself based on the rules you announced. Do not let them self-report the final scores.

  I need to be honest about what this game cannot do. It cannot prove that there is a unified self. Your roommate is right that metaphysically, you are just a series of person-stages. The game does not refute that. What the game reproduces is the political consequence of that metaphysics. It shows that treating distinct stages as distinct persons changes the moral landscape because it removes the guarantee of compensation. You will have to supply that connection in words during the debrief. The game creates the intuition that compensation matters; you have to explain that separate persons are defined by the inability to compel compensation across boundaries. If you don't make that link explicit, the econ majors will say you just proved that transaction costs matter, not that persons are distinct.

  Here is your timeline to keep you on track. Spend the first five minutes splitting groups and explaining the candy stakes. Spend ten minutes on Round One Life Plan collaborative. Spend ten minutes on Round Two Village Council collaborative. Spend fifteen minutes on the Twist Replay of Round One silent and the discussion of the Village mirror. Spend the final fifteen minutes on the debrief questions and connecting it to the reading. If you run long on the game, cut the Village mirror discussion and just ask them hypothetically if compensation would have changed their mind in Round Two. Do not skip the debrief because that is where the learning happens. The game is just the engine to generate the conflict.

  One last thing about the candy. Make sure you have enough for everyone to get something, but enough extra that the points matter. If the points feel meaningless, they will not take the sacrifice seriously. Tell them upfront that the top three groups by total points get a full size bar and the rest get fun size. This creates enough pressure to maximize the sum that the sacrifice feels real. When Decade One realizes they are taking a hit for nothing in the silent round, the betrayal needs to sting slightly.

  You are going to do fine. The fact that you are losing sleep over how to teach this fairly shows you care more than most. Your roommate's argument is strong because it is clean, but ethics is messy because people are separate. Let the messiness happen in the room. If the students leave confused about whether they are one person or many but certain that they don't want to be the one who loses out without a say, you have taught the lesson. Good luck on Thursday and save me a piece of candy if the game works.
