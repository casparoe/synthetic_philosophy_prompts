answer: |-
  You have built a cathedral on a fault line. The tremors you feel in the seventh draft are not signs of structural failure, but of the ground moving beneath you. You ask for a principle that can bear the weight of your nine verdicts. I will not offer you comfort. I will offer you a tool sharp enough to cut the dead wood from the living.

  ### I. The Diagnosis of Your Working Principle

  Your current clauses ("Recognition" and "Open Future") fail because they assume a symmetry between the powerful and the powerless that history does not possess.
  *   **Recognition** fails on Case 4 (the Chairman) because the powerless rarely possess the language to recognise their own oppression in the moment. They recognise it only in retrospect.
  *   **Open Future** fails on Case 5 (the Owner) because you have closed the future of his character to make him a legible villain, yet you condemn this closure while allowing the Chairman's legible heroism.

  Your inconsistency is not logical; it is ethical. You grant the Chairman a voice he didn't have (Monumental) but deny the Owner a complexity he did have (Critical), and you feel guilty because you know you are manipulating both.

  ### II. The Nietzschean Assignment

  You ask if the triad is an instrument or an ornament. It is an instrument you are using to measure the wrong dimensions. You are treating them as genres of history, but in your novel, they are genres of *justification*.

  *   **Monumental (The Past as Inspiration):** Cases 1, 4, 7 (the Bell), 9. You use these to create a mythos that can be inhabited.
  *   **Antiquarian (The Past as Preservation):** Cases 3, 7 (the Inquest), 8 (the Grandmother). You feel the pull of the artifact, but you reject it when it hinders the story.
  *   **Critical (The Past as Defendant):** Cases 2, 5, 6, 8 (the Recorder). You judge the past to make the present livable.

  **Verdict:** The triad is carrying the lot, but you are using *Critical* history to justify *Monumental* ends. You condemn the Owner (Critical) to make the Valley's tragedy meaningful (Monumental). You elevate the Chairman (Monumental) to justify the Strike (Critical). The ornament is the guilt you feel when the modes clash. You must stop treating them as separate choices. They are simultaneous pressures.

  ### III. The Revised Principle: The Principle of Vital Necessity

  To save your nine verdicts (or most of them), you must replace "Recognition" with "Resonance" and "Open Future" with "Resistibility." You must add a third clause regarding the Living.

  **Clause 1: Resonance (Motivated by Case 3 & 7)**
  A distortion is legitimate if it captures the *weight* of the event, even if it alters the *mass*.
  *   *Reasoning:* The 17-year-old inspector (Case 3) feels more true than a 27-year-old would, because the vulnerability resonates with the failure. The bell (Case 7) resonates with the trauma, even if the inquest (facts) does not. Facts are mass; feeling is weight.

  **Clause 2: Asymmetric Agency (Motivated by Case 4 vs. Case 5)**
  A distortion is legitimate if it restores agency to the silenced; it is illegitimate if it removes agency from the responsible.
  *   *Reasoning:* The Chairman (Case 4) was silenced by history; giving him rhetoric restores his agency. The Owner (Case 5) had agency; making his cruelty "systematic" rather than "opportunistic" simplifies his moral choice. It turns a man who chose evil into a machine that produced it. This is why Case 5 feels "Not Fine." It lets the Owner off the hook by making him a caricature.

  **Clause 3: The Living Veto (Motivated by Case 6 & 8)**
  A distortion is illegitimate if it bribes the living with a falsehood about the dead, unless that falsehood protects the living from harm that truth would cause.
  *   *Reasoning:* Your grandmother (Case 8) is kin; the betrayal is personal. The town (Case 8) is history; the betrayal is public. The family (Case 6) is living; giving them repentance is a bribe.

  ### IV. Verdicts on the Undecided Cases

  1.  **The Eleven Names:** **Do not name them.**
      *   *Reasoning:* This violates *Resistibility*. A roll call turns grief into data. It satisfies the Antiquarian impulse but kills the Monumental sorrow. The reader must mourn the number, not the list. To name them is to claim you can know them. You cannot.
  2.  **The Facsimile Copybook:** **Reject it.**
      *   *Reasoning:* Antiquarian bric-à-brac. It breaks the spell of the novel to remind the reader "this is real." The novel's truth is internal. A facsimile is a credential, and you stated you have no interest in credentials.
  3.  **The Family Bequest:** **Reject it.**
      *   *Reasoning:* Violates *The Living Veto*. Conditional bequests are bribes. If the repentance scene is artistically false (which you admit: "the book went soft"), money cannot make it true. Take the loss of the funds. The book must not be bought.
  4.  **The Title (The Date):** **Accept it.**
      *   *Reasoning:* Serves *Resonance*. The valley uses the date for everything. To title it otherwise would be to ignore how the valley remembers itself. It anchors the myth.

  ### V. Two New Test Cases

  **Case A: The Weather.**
  *Scenario:* The records say the day of the failure was sunny. You want it to rain.
  *   *Ruling:* **Do not make it rain.**
  *   *Reasoning:* This is a cliché of *Monumental* history. It imposes a pathetic fallacy that the valley itself would reject. The horror of the event is that it happened on a sunny day. To darken the sky is to soften the blow.

  **Case B: The Missing Child.**
  *Scenario:* One child's body was never found. You want to show her body caught in the mill wheel to give the mother closure.
  *   *Ruling:* **Do not show the body.**
  *   *Reasoning:* Violates *Resistibility*. You are foreclosing the mother's grief (and the reader's) by settling the unknown. The uncertainty is the heavier truth. To resolve it is to serve the plot, not the life.

  ### VI. The Cost

  You asked for honesty about the cost. A principle that saves all nine verdicts is a lie. You must sacrifice one to save the integrity of the rest.

  **The Sacrifice: Case 5 (The Owner's Ledger).**
  You must revise or cut the systematic cruelty.
  *   *Why:* Under *Asymmetric Agency*, this distortion removes the Owner's moral complexity. By making him a monster who keeps a book of grievances, you make him predictable. By leaving him as the documented opportunist, he is more terrifying. He is a man who did evil casually, not a villain who planned it. The latter is fiction; the former is history. Your principle demands you trust the history here more than the fiction.
  *   *The Trade:* If you cut Case 5, you validate Case 4. You show that you invent for the silenced (Chairman) but discipline yourself for the powerful (Owner). This resolves the hypocrisy you feel between the two.

  **Regarding Case 8 (Kinship):**
  You say kinship is a "poor reason." It is the *only* reason. The dead of the town belong to the narrative; the dead of your blood belong to the relationship. To falsify the town is to write history; to falsify the grandmother is to lie to a ghost that knows you. Keep this distinction. It is not hypocrisy; it is jurisdiction.

  ### VII. The Epilogue

  **End in 1874. Let the reader out into forgetting.**

  *   *Reasoning:* Nietzsche writes that there is a degree of sleeplessness, of rumination, of historical sense, which harms the living and finally destroys them. Your book is an act of *Critical* history; it digs up the past to judge it. If you add the Epilogue (the diver in the present), you trap the reader in the *Antiquarian*. You force them to look at the water again.
  *   The diver who "cannot say what he saw" is a posture, just as you suspected in Case 9. It is the author clearing his throat one last time.
  *   The valley uses the date for everything, including the birthdays it has *stopped celebrating*. This implies a desire to move on. To end in 1874 is to grant the valley the mercy of forgetting. To end in the present is to grant yourself the vanity of remembering.
  *   Your principle of *Vital Necessity* requires that the book serve life. Life requires forgetting. Close the book in the dust of the failure. Do not bring the diver up.

  ### Summary of Action

  1.  **Adopt** the Principle of Vital Necessity (Resonance, Asymmetric Agency, Living Veto).
  2.  **Cut** the Owner's Ledger (Case 5). Let his cruelty be mundane, not systematic.
  3.  **Reject** the names, the facsimile, the bequest, and the epilogue.
  4.  **Keep** the Title, the Bell, the Chairman's Speech, and the distinction between your Grandmother and the Town.
  5.  **Accept** that Nietzsche's triad is a diagnostic, not a map. You are writing *Critical* history for *Monumental* ends.

  You have spent eight years in the valley. It is time to let the water settle.
