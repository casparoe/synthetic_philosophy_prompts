  Dear Friend,

  I am writing this to settle our argument about whether the conflict between calibration and error rate balance is a measurement artifact or a structural constraint. You argued that if we simply prioritize calibration, the disparities vanish into base rate facts. I argue that choosing calibration imposes a specific distribution of harm that cannot be wished away by definition. To prove this, I have constructed a lending scenario for a credit union with sixty thin-file applicants and sixty established-file applicants, where the risk score takes exactly three values representing ten percent, fifty percent, and ninety percent default probabilities. The outcome is recorded identically for both groups, there is no feedback from the decision to the outcome, there is no sample selection, and the score is not a proxy for protected class status beyond the credit file thickness itself. Under these conditions, the score is exactly calibrated within each group at each of its three values, the base rate of default is higher among thin-file applicants, and a single common threshold governs both groups, yet at that threshold the false positive rate is materially higher for the thin-file group while the false negative rate runs the other way.

  In the thin-file group, there are ten applicants with a score of one, of whom one defaults and nine repay, thirty applicants with a score of two, of whom fifteen default and fifteen repay, and twenty applicants with a score of three, of whom eighteen default and two repay, yielding thirty-four defaults and twenty-six repayers for a base rate of fifty-six point seven percent. In the established-file group, there are thirty applicants with a score of one, of whom three default and twenty-seven repay, ten applicants with a score of two, of whom five default and five repay, and twenty applicants with a score of three, of whom eighteen default and two repay, yielding twenty-six defaults and thirty-four repayers for a base rate of forty-three point three percent. If we set a common threshold to approve only those with a score of one, the thin-file group sees seventeen repayers declined out of twenty-six for a false positive rate of sixty-five point four percent, while the established-file group sees seven repayers declined out of thirty-four for a false positive rate of twenty point six percent. At this same threshold, the thin-file group sees one defaulter approved out of thirty-four for a false negative rate of two point nine percent, while the established-file group sees three defaulters approved out of twenty-six for a false negative rate of eleven point five percent. Thus, calibration holds, base rates differ, and the error rates diverge in opposite directions simultaneously.

  To repair the false positive rate disparity, we must adjust thresholds to bring the denial rates for repayers together, and the nearest attainable configuration assigns the thin-file group a threshold of two and the established-file group a threshold of one. Under this repair, the thin-file group receives forty loans, sixteen of which would have defaulted, and only two repayers are declined, reducing their false positive rate to seven point seven percent. To repair the false negative rate disparity, we must adjust thresholds to bring the approval rates for defaulters together, and the nearest attainable configuration keeps the common threshold of one for both groups. Under this repair, the thin-file group receives ten loans, one of which would have defaulted, but seventeen repayers are declined, leaving their false positive rate at sixty-five point four percent. The repair meant to address false negatives leaves thin-file applicants worse off on the very harm of excessive denial they suffer under the common threshold, because equalizing the risk of lending to defaulters requires maintaining a strict barrier that blocks most thin-file repayers.

  Regarding your side bet that equal base rates and exact calibration automatically deliver equal false positive rates, I have built a counter-case with sixty applicants in each group, both with a base rate of fifty percent, and exact calibration at ten, fifty, and ninety percent. In the first group, ten applicants score one with one default, forty score two with twenty defaults, and ten score three with nine defaults, while in the second group, thirty applicants score one with three defaults, zero score two, and thirty score three with twenty-seven defaults. If we approve only score one, the first group has a false positive rate of seventy percent while the second group has a false positive rate of ten percent, proving that score distribution differences alone can drive error rate disparities even when base rates and calibration match.

  The single feature doing the work in this construction is the difference in the distribution of applicants across score buckets conditional on the base rate, specifically that the thin-file group is concentrated in the middle-risk bucket while the established-file group is concentrated in the low-risk bucket. If you drop the stipulation that the outcome is recorded identically for both groups, the case collapses into a dispute about biased labels, because you could argue the higher thin-file default rate is an artifact of measurement rather than a fact of the world, but with identical recording, the conflict remains structural. This case is evidence that choosing a metric is a substantive moral decision rather than technical housekeeping, because prioritizing calibration fixes the meaning of the score but distributes the burden of error unevenly across groups. A defender of your position would attack this case by arguing that the threshold should be set to maximize utility rather than equalize rates, that the cost of declining a repayer is less than the cost of approving a defaulter, and that the thin-file base rate is a fact no metric can argue with, so the higher false positive rate is simply the price of rational risk management.
