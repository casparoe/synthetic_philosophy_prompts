answer: |-
  Here is an analysis of the exchange, adjudication of the Tam case, and an assessment of the underlying philosophical stakes.

  ### Part I: Rating the Moves

  **(1) Hale: Clearly Right (within its own framework).**
  Hale correctly identifies the verificationist core of Dennett's argument: if a property makes no difference to any observation (including first-person discrimination over time), it is ontologically idle. However, this is "right" only if one accepts that existence requires verifiability, which is the very point in dispute.

  **(2) Okonjo: Partly Right.**
  She is empirically correct that neuroscience can often distinguish sensory drift from affective drift (e.g., olfactory receptor turnover vs. amygdala habituation). However, she commits a category error by assuming that identifying the neural correlate settles the *phenomenological* question; Dennett's point is that even with full neural data, the subject's *interpretation* of that data remains ambiguous.

  **(3) Hale: Clearly Right.**
  This is the strongest philosophical move in the exchange. Hale correctly notes that if you explain the phenomenon entirely via physical mechanisms (receptors, discrimination, behavior), the "quale" becomes an explanatory ghost. If the physics does all the work, the "feeling" is not a causal agent, which undermines its status as a robust property.

  **(4) Okonjo: Partly Right.**
  She is right that "what it was like" is not identical to a measurement list (the Hard Problem). However, her claim that predictive success proves the distinction is "real" conflates pragmatic utility with ontological reality; a useful fiction (like "the sun rises") can have predictive weight without referring to a fundamental property.

  **(5) Hale: Partly Right.**
  His functionalist intuition is sound: if two states are identical in all causal powers and inputs/outputs, they are the same state. But he glosses over the possibility that the *internal organization* differs even if the output doesn't yet show it, which is what Okonjo attempts to defend.

  **(6) Okonjo: Clearly Right.**
  This is her best counter. She correctly identifies that Hale is committing the verificationist fallacy: arguing that because a third party cannot distinguish two private states, no distinction exists. Privacy entails epistemic asymmetry; Hale treats this asymmetry as evidence of non-existence, which is a non sequitur.

  ### Part II: The Case of Tam

  **Adjudication:**
  The case of Tam favours **Hale**, though it damages both positions.

  Tam reports no change in experience and no change in preference, yet his behaviour changes (he stops drinking). This breaks the link Okonjo relies on in Move (4), where she claims the distinction between "taste" and "liking" predicts choice. If the report and the preference are constant but the action varies, the report has lost its predictive utility. It suggests the behaviour is driven by variables neither the experience nor the stated preference captures.

  **Consistency Check:**
  *   **Hale:** Consistent. In Move (5), he argued that if descriptions can be swapped without behavioural change, they are mere words. Tam shows the reverse: behaviour can change without a change in description or physiology. For Hale, this confirms that the "inner state" (experience/preference) is not the driver of the action; the report is indeed "tracking nothing" causal.
  *   **Okonjo:** Inconsistent. In Move (2), she claimed empirical measures usually settle the drift. In Move (4), she claimed the distinction predicts choice. Tam presents a case where measures are stipulated unchanged, yet choice changes. She tries to spin this in her favour (experience is separate from disposition), but if experience is separate from disposition *and* preference is separate from disposition, the "experience" she is defending is doing no work. She is left defending a property that neither determines action nor changes when action does.

  ### Part III: The Unraised Terms and Final Verdict

  **What Was Missed:**
  1.  **Definition of "Qualia":** They are arguing past one another. Hale is attacking *Cartesian Qualia* (intrinsic, ineffable, private properties that cannot be fully described). Okonjo is defending *Operational Qualia* (discriminable neural states that correlate with reports). Dennett's paper specifically targets the former; Okonjo is defending the latter. A property can be "real" in a neuroscientific sense (Okonjo) without being "real" in the metaphysical sense Hale denies.
  2.  **Cognitive Penetration:** Neither mentioned that "taste" is not a passive reception but an active construction. The difference between "the coffee tastes different" and "I like it less" may not be a difference in *property* but a difference in *conceptual framing* of the same neural event. The brain creates the taste to suit the expectation; the tasters aren't reporting on a raw datum, they are theorizing about their own brains.
  3.  **Heterophenomenology:** Hale implicitly uses Dennett's method (treating subjects as text-generators), while Okonjo treats them as authorities. The missing middle ground is that the subjects' reports are data to be explained, not infallible truths about reality.

  **Overall Verdict:**
  **Hale wins the philosophical argument; Okonjo wins the scientific one.**

  Hale is correct that if you define qualia as intrinsic, private properties that transcend physical explanation, they cannot exist, because their existence would violate the causal closure of the physical world (Move 3). If the physics is fixed, the outcome is fixed; there is no room for a "ghost" quale to tweak the result.

  However, Okonjo is correct that for the purposes of sensory science, the distinction is indispensable (Move 4). To do her job, she must treat the distinction as real.

  **The Concession:**
  For Hale to be declared the overall victor, **Okonjo must concede** that the "reality" she defends is pragmatic, not metaphysical. She must admit that when she says "the taste changed," she is shorthand for "the neural pattern associated with discrimination shifted," not that a private, unshareable essence altered.

  For Okonjo to be declared the victor, **Hale must concede** that eliminativism is practically useless. He must admit that even if qualia are "user-illusions," they are the only interface the human organism has for navigating the world, and therefore cannot be dismissed as mere "noise" (Move 1) without losing the ability to explain human behaviour.

  **Settlement:**
  The argument rests on a equivocation. Hale is right that *Quining Qualia* successfully dissolves the metaphysical mystery. Okonjo is right that dissolving the mystery does not stop the coffee from tasting bitter. Hale won the evening's debate because he successfully showed that Okonjo's "real distinction" relies on a privacy that she cannot epistemically access, but she remains right that tomorrow morning, her panel will still need to distinguish between a spoiled bean and a tired tongue.
