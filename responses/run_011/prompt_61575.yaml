  The implicit philosophy of mind governing the looking-time paradigm is a specific variety of **Representational Realism**, bolstered by a **Modular** architecture of cognition. It operates on the assumption that mental states are internal, causal structures that can be decoupled from overt behavior, and that attention is a privileged window into these structures. Below is the reconstruction of this philosophy, addressing the four specific tensions you raised, followed by the separation of strict requirements from interpretive comforts and a rewriting of the field's claims under a rival ontology.

  ### 1. The Commitment of Looking-Time: Representational Realism
  The looking-time practice (specifically Violation of Expectation, or VoE) presupposes that **attention is modulated by prediction error**. For a difference in staring duration to count as evidence about the *content* of an infant's mind (e.g., "the toy persists"), the field must commit to the view that the infant holds an internal model of the world against which sensory input is compared.

  *   **Explicit Commitments:**
      1.  **Internalism:** Cognitive states exist independently of their behavioral expression. An infant can "know" $p$ without acting on $p$.
      2.  **Informational Content:** Mental states have semantic content (they are *about* objects, persistence, solidity) that can be inferred from physiological responses (pupil dilation, gaze duration).
      3.  **Passive Access:** The "looking" system provides a truer read-out of competence than the "reaching" system because it is less contaminated by motor constraints or inhibitory demands.

  *   **Excluded Rivals:** This practice explicitly excludes **Strict Dispositionalism** (e.g., Rylean behaviorism), on which to believe the toy persists *just is* to be disposed to reach for it. If belief were identical to the disposition to act, the infant's failure to reach would entail a lack of belief, rendering the looking data irrelevant. The field excludes this not by argument, but by **operational fiat**: it defines its instrument (the eye-tracker) as measuring "expectation" rather than "action readiness," thereby carving logical space for a belief that does not guide action.

  ### 2. Underdetermination of Content: The Principle of Charity
  The measure underdetermines the content because retinal stimulation is compatible with multiple ontologies. A longer look at an "impossible" event could indicate surprise at the violation of object permanence, or merely a violation of a low-level visual regularity (e.g., "screens do not usually pass through solid patches of color").

  *   **Licensing Principle:** The field settles on the object-level reading via a **Principle of Charity** combined with **Continuity Assumption**. It assumes the infant is a rational agent interpreting the world in roughly the same way the adult experimenter does.
  *   **Metaphysical Status:** This is a **substantive metaphysical commitment** masquerading as a methodological convenience. It assumes **Realism about Medium-Sized Dry Goods**: that the world is actually made of persisting objects, and that the infant's mind is designed to track them. It differs from animal/machine interpretation primarily in the *direction* of the charity: with machines, we assume no mind unless proven otherwise; with infants, we assume a proto-adult mind unless proven otherwise. This is not a logical necessity but a theoretical choice to prioritize rich interpretation over lean behaviorism.

  ### 3. The Two-Systems Move and the Posture Problem
  The "Two-Systems" reconciliation (System 1: fast/looking; System 2: slow/reaching) is a theoretical patch designed to save the Representationalist commitment from the reaching data.

  *   **Consistency:** This move is **inconsistent** with the original question ("Does the infant have object permanence?"). It replaces a question about *possession of a concept* with a question about *architectural modularity*. It changes the subject from "What does the infant know?" to "Which subsystem is online?"
  *   **Falsifiability:** The competence-versus-performance distinction, as deployed here, is **unfalsifiable**. Any failure in reaching can be attributed to performance (inhibition, memory load); any failure in looking can be attributed to attention. It absorbs all negative evidence.
  *   **The Posture Result:** The finding that sitting vs. standing alters the reaching error is devastating to the Two-Systems view. It implies that the representation is not a stable, amodal symbol stored in a "slow system," but is **embodied and state-dependent**. This supports **Dynamic Systems Theory**, suggesting cognition is not a central processor issuing commands, but a coupled sensorimotor loop where the body's configuration constitutes part of the cognitive process. If the "belief" vanishes when the posture changes, it was never a stable belief to begin with.

  ### 4. Analogy to Disorders of Consciousness (fMRI)
  The inferential logic is **identical**. In both cases, a physiological signal (gaze / BOLD response) is mapped to a hidden mental state (expectation / awareness) based on a calibration model (adult norms / healthy controls).

  *   **Consistency:** If one accepts the VoE inference without behavioral confirmation (reaching), one must, for consistency, accept the fMRI inference without behavioral confirmation (movement/speech). Both rely on **Inference to the Best Explanation** of a hidden cause.
  *   **Difference:** The difference lies in **calibration**, not ontology. fMRI patterns are calibrated against *reports* from conscious adults. VoE patterns are calibrated against *theories* of infant cognition. To accept one and reject the other is special pleading unless one argues the link between gaze and expectation is less robust than the link between motor-cortex activation and motor imagery. Given the posture data, the gaze-expectation link appears *less* stable. Thus, the fMRI practice is arguably *more* licensed than the infant looking practice, yet the stakes make us more cautious.

  ### 5. Strict Requirements vs. Comfortable Fits (The Rewrite)
  We must separate what the looking-time practice *strictly requires* from what it *comfortably sits with*.

  *   **Strictly Required:** The practice strictly requires that infants can **discriminate** between events and that their attention is **modulated by prior exposure** (habituation/sensitization). It requires that the visual system tracks statistical regularities.
  *   **Comfortably Sits With:** The practice comfortably sits with the claim that infants possess **concepts**, **beliefs**, or **ontological commitments**. These are interpretive layers added to the raw discrimination data.
  *   **Underdetermination:** Because a rival account can explain the discrimination and attentional modulation without positing "beliefs," the practice is **underdetermined** with respect to the ontology of mind.

  **The Threatening Rival: Enactivism / Sensorimotor Contingency Theory**
  This view holds that cognition is not the manipulation of internal representations, but the skilled management of sensorimotor contingencies. "Knowing" an object persists is not holding a symbol of the object, but possessing the skill to anticipate how sensory input will change if one moves.

  **The Rewrite:**
  If the field adopted Enactivism, the headline claims would shift from *epistemic* to *functional*:

  *   *Retracted:* "Infants represent objects as continuing to exist unobserved." (No internal representation).
  *   *Retracted:* "Infants lack the concept of object permanence." (No concepts).
  *   *Reinterpreted:* "Infants' visual systems resonate with statistical regularities of occlusion." (Instead of "expectations").
  *   *Reinterpreted:* "Reaching errors reflect a mismatch between current sensorimotor configuration and the learned contingency, not a failure of inhibitory control." (Instead of "performance error").
  *   *Surviving:* "Infants look longer at events that violate learned sensorimotor patterns." (This describes the data without the metaphysical baggage).

  The field's claim that infants have "knowledge" would be retracted in favor of claims about "adaptive sensitivity." The "Two-Systems" theory would be replaced by a "Single-System, Context-Dependent" model, where looking and reaching are different modes of engagement with the environment, not read-outs of different knowledge stores.

  \answer{underdetermined}
