          1.  *Ordinalism:* Interpersonal utility comparisons are impossible; only rankings matter.
          2.  *Anonymity + Weak Pareto:* Standard social choice constraints.
          3.  *Arrow + Domain Restriction:* Arrow's Impossibility Theorem is avoided by assuming single-peaked preferences on an Authority vs. Autonomy axis (Median Voter Theorem).
          4.  *Core-Value Veto:* A 5% minority gets a veto if an output violates their top-ranked value.
          5.  *Legitimacy:* Public justifiability of the *rule* (not outcome) from within losers' own values.
