  2. The psychiatrist will note that delusional patients predict their own behavior well while being flagrantly false about reality. [CONCEDE] I agree clinical intervention requires treating these as errors despite their predictive utility for the agent. The soft point is clinical versus theoretical success.

  3. Experimental psychologists will claim that without accuracy to a state, your predictive success is just calibration measured sloppily. [CONCEDE] I concede meta-d' remains valid for perceptual tasks where ground truth exists, limiting my claim to propositional attitudes. The soft point is scope limitation.

  4. Philosophers will suspect you have renamed confabulation as predictive commitment without solving the error problem. Error is retained as predictive failure over time, not mismatch at a time, preserving normative force. The soft point is normative force.

