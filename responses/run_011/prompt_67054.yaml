answer: |-
  **Cool Hands**

  Miller stands on the grating, forty feet above the concrete floor. The hydraulic line is singing. It's a high-frequency whine that vibrates in his teeth, not his bones. The pressure gauge on the manifold reads 4,200 psi. Yellow fluid weeps from the fitting, misting into the air.

  He checks his suit seals. Green across the board. He positions the containment clamp over the leak. The standard procedure is to isolate the line, depressurize, and then fit the clamp. But isolation shuts down the reactor feed. Downtime costs six figures a minute. The union contract bonuses for hot fixes.

  Miller tightens the bolt on the clamp. The wrench slips. The high-pressure spray hits his left forearm.

  Through the suit sensor display, a warning light flashes red. Breach detected. Left forearm. Pressure differential critical.

  Miller does not flinch. He does not jerk his arm away. He feels the impact as a blunt thud, a transfer of kinetic energy. He knows the fluid is caustic. He knows it is entering the subcutaneous tissue at a velocity that will strip flesh from bone. He knows this because he read the safety manual during orientation, eleven years ago.

  He finishes tightening the bolt. The whine stops. The mist settles.

  Miller logs the repair in his wrist comp. *Line 4B sealed. Hot fix. Suit breach.* He climbs down the ladder. His boots clang on the steel rungs. He does not favor the left arm. It hangs at his side, heavy but functional.

  In the locker room, the air smells of ozone and antibacterial soap. Miller peels off the suit. The undersuit is stained yellow around the forearm. The skin beneath is swollen, waxy, and pale. There is no redness. Redness is inflammation, and inflammation is a signal he no longer receives. The tissue is dying, but the alarm system is disconnected.

  He showers. The water runs hot. He tests it with his right elbow, standard procedure. He washes the yellow fluid off the left arm. The skin feels tight, like a drumhead. He dries off and pulls on his street clothes. A grey button-down. He has to leave the sleeve loose.

  Jensen is waiting by the vending machines. He's twenty-four, new hire, still has the look of someone who sleeps lightly. He's holding a brochure for the Anodyne procedure. The paper is creased where his thumb keeps rubbing the edge.

  "You're Miller," Jensen says. "Eleven years."

  Miller buys a coffee. Black. "That's right."

  "They say you never miss a shift."

  "Insurance likes me." Miller takes a sip. The heat scalds his tongue slightly. He notices the temperature, registers the potential for damage, and swallows. It doesn't matter.

  Jensen looks at the brochure. "My wife says it's mutilation. Says I'm cutting out part of being human."

  "My wife died," Miller says. "Car accident. Three years ago."

  Jensen flinches. "I'm sorry."

  "Don't be. I drove home from the hospital. I signed the papers. I went to work the next Monday." Miller gestures with the coffee cup. "You got kids?"

  "Two. Girls."

  "You come home tired?"

  "Exhausted. Sometimes I shake. I wake up thinking I'm still on the line."

  "After the lesion, you sleep eight hours. You wake up when the alarm goes off. You come home, you eat, you play with the girls. You don't snap at them because your nerves aren't firing like live wires." Miller sets the cup on the machine. "It's not about being tough. It's about efficiency. Pain is noise. We get paid to listen to the signal."

  Jensen looks at Miller's left arm. The sleeve is loose, but the swelling distorts the shape of the forearm. It looks thicker than the right. "Does it ever... do you ever worry? That you won't know if something's wrong?"

  "I check the logs. I check the sensors. My body is equipment. I maintain it." Miller holds out his right hand. "You want to keep shaking? Or do you want to keep the job?"

  Jensen looks at the hand. He looks at the brochure. He thinks about the overtime pay. He thinks about the shaking. He puts the brochure in his pocket.

  "I'll schedule the consult," Jensen says.

  "Good. Tell them Miller sent you. You get the premium package. No recovery time."

  Jensen nods. He reaches out to shake Miller's hand.

  Miller extends his left hand out of habit. The fingers are stiff. The joints don't flex fully. The necrosis has spread into the tendon sheaths. The fluid injection has compartmentalized the muscle.

  Miller sees Jensen looking at the hand. The fingers are slightly curled, fixed in a semi-claw. The skin is translucent, showing the dark veins beneath.

  Miller switches to his right hand. They shake. Jensen's grip is firm. Miller's is weak. The pressure sensors in Miller's palm register the force, but the feedback loop ends at the spinal cord. There is no message sent to the brain that says *stop*.

  "See you Monday," Jensen says.

  "Monday."

  Miller drives home. The car is automatic. He keeps the left hand on the wheel at the twelve o'clock position. It doesn't hurt, but the grip is slipping. Sweat pools in the palm. The skin is losing integrity.

  He arrives at his apartment. It's clean. Minimalist. Nothing that requires fine motor skills to maintain. He goes to the kitchen to make dinner. A jar of pasta sauce. He twists the lid.

  His left hand slips. The metal bites into the skin of his right palm. He feels the friction, the heat. He adjusts his grip. He tries again with the left hand. He applies torque. The tendons in the forearm shift under the waxy skin. They don't pull. They tear.

  There is a sound like wet canvas ripping.

  Miller looks down. The forearm has expanded. The skin has split along the flexor line. Dark fluid seeps out. Not blood. Necrotic tissue fluid. It smells sweet, like rotting fruit.

  He sets the jar down. He walks to the bathroom. He turns on the tap. He holds his left arm under the water. The water washes over the split skin. The flesh underneath is grey. The fingers are still curled. He tries to straighten them.

  He uses his right hand to pull the fingers of the left hand open. They resist. The joints are fused with swelling. He pulls harder. The skin tears further.

  He lets go. The left hand snaps back to the semi-claw position.

  Miller opens the medicine cabinet. There is a first aid kit. Gauze, tape, antiseptic. He takes them out. He sits on the edge of the tub. He lays the left arm on his knee.

  He picks up the gauze with his right hand. He wraps it around the left forearm. He pulls it tight. The circulation is already compromised, but the protocol says *apply pressure*.

  He tapes the end. He looks at the hand. The fingers are blue at the tips. He tries to make a fist. The fingers twitch, but do not close.

  He stands up. He goes back to the kitchen. He picks up the jar of sauce again. He needs to eat. He has a shift in twelve hours. He can work with one good hand. He can request a temporary reassignment. Light duty. Inspection.

  He sets the jar on the counter. He positions his right hand on the lid. He prepares to twist.

  He stops. He looks at his left hand resting on the counter. The fingers are tapping against the laminate. A rhythmic motion. Tap. Tap. Tap.

  He tries to stop the tapping. The signal sends from the brain, but the muscle does not respond. The fingers continue to tap. The nail on the index finger catches on the surface. It lifts. The nail bed is dry. There is no pain.

  Miller watches the finger tap. He reaches out with his right hand and holds the left wrist. He holds it still. The muscle beneath his palm vibrates, a low-frequency tremor.

  He lets go. The tapping resumes.

  Miller picks up a pen from the counter. It's a black ballpoint, cap lost. He places it on the counter. He tries to pick it up with his left hand.

  The fingers close around the pen. They do not open. The flexor tendons have locked. The pen is trapped in the palm.

  Miller uses his right hand to pry the fingers open. He has to pull each digit back individually. The joints click. He frees the pen. He drops it on the counter.

  He tries to pick it up again. The fingers close. They do not open.

  Miller looks at the pen trapped in his left hand. He looks at the jar of sauce. He looks at the clock on the wall.

  He walks to the drawer where he keeps the tools. He takes out a pair of wire cutters. He returns to the counter. He places the left hand flat on the laminate. He positions the cutters around the index finger, just below the first knuckle.

  He squeezes the handles. The blades bite into the swollen flesh. They meet resistance. Bone.

  Miller increases the pressure. The handles of the cutters dig into his right palm. He feels the discomfort there. He ignores it.

  The blades cut through the skin. They grind against the bone.

  Miller stops. He sets the cutters down. He looks at the indentation in the finger. The skin is white where the pressure was applied. It will bruise. It will necrose faster.

  He picks up the pen again with his right hand. He signs his name on a napkin. *Miller.* The handwriting is shaky.

  He folds the napkin. He puts it in his pocket. He turns off the kitchen light. He walks to the bedroom. He sits on the edge of the bed. He looks at his left hand. The fingers are still closed around nothing.

  He reaches over with his right hand and pries the fingers open one last time. He lays the hand flat on the quilt.

  He lies down. He closes his eyes. He waits for sleep.

  His left hand twitches. The fingers curl inward, slowly, grasping at the quilt. They tighten. The fabric bunches in the grip.

  Miller opens his eyes. He watches the hand crush the quilt.

  He reaches out with his right hand and covers the left hand. He holds it down. He keeps holding it until his arm gets tired. He does not let go.
