  ### Working Notes: Pre-Draft Brainstorming

  *Right, let's clear the whiteboard before we ink the contract. I've sat through enough of these workshops to know where the blood usually gets spilled. Here's what I threw out because it was too loaded, and what survived.*

  *   **Candidate:** "The brain processes information." -> **KEEP.** (Too basic to fight over).
  *   **Candidate:** "Consciousness is a stream." -> **CROSS OUT.** (Camp 1 says "streams" imply a single flow, which is the exact thing they deny. Camp 2 assumes it. Can't sign this).
  *   **Candidate:** "Subjects sometimes lie." -> **CROSS OUT.** (Neither side thinks subjects are lying. They think subjects are reporting accurately on *something*, they just disagree on what that something is).
  *   **Candidate:** "Neural events take time." -> **KEEP.** (Physical fact).
  *   **Candidate:** "There is a fact of the matter about what you saw at time T." -> **CROSS OUT.** (This is the war itself. Camp 1 says 'no', Camp 2 says 'yes').
  *   **Candidate:** "Reports are influenced by expectation." -> **KEEP.** (Both agree memory and language shape the output).
  *   **Candidate Crux:** "Can we measure the delay?" -> **TOO VAGUE.** (Measure what? Neural latency or 'experience' latency? Need to split this).
  *   **Candidate Crux:** "Does the fast probe bypass memory?" -> **KEEP.** (This is the lever).

  *Okay, the surviving claims are the ones that describe the machinery without claiming to know the ghost inside it. Let's write the document.*

  ***

  # JOINT STATEMENT ON TEMPORAL ANOMALIES IN VISUAL REPORTING
  **Regarding the phenomenon colloquially known as "Color Phi"**

  **Signatories:** The "Realist" Camp (Experience as Determinate State) & The "Drafts" Camp (Experience as Indeterminate Process)

  ### 1. AGREED CLAIMS
  *The following points are accepted as empirical or methodological common ground. Signing this does not concede the metaphysical interpretation of these points.*

  1.  **Stimulus Objectivity:** The physical presentation of the red and green dots occurs at distinct, measurable times ($T_1$ and $T_2$) and locations ($L_1$ and $L_2$). There is no physical motion between them.
  2.  **Report Consistency:** Under standard conditions (ISI approx. 60–100ms), naive subjects reliably report a single object moving from $L_1$ to $L_2$ changing color mid-path.
  3.  **Processing Latency:** Neural signals from the retina require significant time (typically >100ms) to reach cortical areas associated with object recognition and color processing. Conscious report requires further time for motor planning and speech/action.
  4.  **The Gap:** There is a temporal gap between the physical stimulus and the behavioral report. What happens *inside* that gap is the subject of this dispute.
  5.  **Fallibility of Retrospection:** A subject's report given at $T_{+5 seconds}$ is not a perfect playback of their state at $T_{+1 second}$. Memory and language construction alter the report.
  6.  **No "Homunculus":** Both camps reject the idea that there is a literal "little person" inside the head watching a screen. The disagreement is about whether the *functional equivalent* of a screen exists.
  7.  **Phenomenal Character:** Subjects genuinely *feel* as though they saw motion. Neither camp claims the subject is lying or "guessing." The sensation is vivid and involuntary.

  ***

  ### 2. DISAGREEMENTS TABLE
  *We could not agree on the interpretation of the gap. Below is the precise map of where we part ways. We have vetted these descriptions to ensure neither side feels caricatured.*

  | Point of Contention | The "Realist" Camp (Fact of the Matter) | The "Drafts" Camp (No Fact of the Matter) | Real Dispute or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of the "Middle" Moment** | At any millisecond $T$, the subject is in a specific conscious state. If they report motion later, either they experienced motion then (Stalinesque) or experienced static dots and forgot (Orwellian). One of these is physically true. | There is no single "state" at $T$. There are multiple neural processes finishing at different times. Asking "what was experienced at $T$?" is like asking "what is the capital of the number 7?" It's a category error. | **Real.** (One side says the question has an answer, the other says it doesn't). |
  | **2. The Nature of the Error** | The illusion is a mistake. The brain either constructed a false percept before awareness or corrupted the memory after. The report deviates from the "true" sensory input. | There is no "true" input to deviate from. The brain produces the best narrative it can. The report *is* the experience. There is no error, only a successful construction of a coherent world. | **Verbal.** (Depends on definition of "error" vs "construction"). |
  | **3. The "Cartesian Theater"** | There is a functional finish line where information becomes "available to the subject." Even if distributed, there is a time when the data is "in." | There is no finish line. "Availability" is a gradient. Information becomes available for different systems (speech, grasp, flinch) at different times. | **Real.** (Empirical claim about neural architecture). |
  | **4. What the Probe Measures** | A probe (button press) samples the current content of the conscious buffer. If fast enough, it samples the content before editing. | A probe triggers a new process. It doesn't sample a buffer; it forces a new "draft" to be written based on currently available fragments. | **Real.** (Predicts different outcomes in Setup A). |

  ***

  ### 3. THE CRUXES: PRE-REGISTERED PREDICTIONS
  *We agreed to stop talking and start testing. Here is what we expect from your two setups. We have committed to what would change our minds.*

  #### SETUP A: The Fast Probe
  *Method: Subject sees Red-Green sequence. Must press button within 300ms (Yes/No: "Did it change color?"). Then asked again verbally after 5 seconds.*

  **The "Realist" Camp Prediction:**
  *   **Prediction:** The Fast Probe will show **higher accuracy to the physical stimulus** (reporting "No change, two flashes") than the Slow Verbal Report.
  *   **Why:** The fast button press bypasses the slow "story-telling" memory systems that smooth over the gap. It accesses the raw percept before the Orwellian rewrite occurs.
  *   **If Dissociation Occurs (Fast = No, Slow = Yes):** This establishes that conscious experience exists in an early, unedited form that is later overwritten. It proves the "Orwellian" model is at least partially correct.
  *   **If No Dissociation (Fast = Yes, Slow = Yes):** This counts **against** us. It suggests the "editing" happens pre-consciously (Stalinesque) or that there is no raw percept to access. We would have to concede that the "motion" is baked into the earliest layer of experience.
  *   **Falsification Condition:** If the Fast Probe is *less* accurate than the Slow Report, our claim that "memory corrupts the truth" is undermined.

  **The "Drafts" Camp Prediction:**
  *   **Prediction:** Both Fast and Slow reports will show the **illusion (Yes, it changed)**.
  *   **Why:** There is no "raw percept" waiting to be tapped. The 300ms deadline just forces a "rough draft" instead of a "polished draft." But even the rough draft is a construction. The brain fills the gap to make sense of the data *before* the button press is even planned.
  *   **If Dissociation Occurs (Fast = No, Slow = Yes):** This does **not** prove a "true experience" was found. It proves that under high pressure, the brain prioritizes different features (location over color). It's just a different draft, not a truer one.
  *   **If No Dissociation (Fast = Yes, Slow = Yes):** This confirms our view. The content is fragile and context-dependent, but there is no "fact of the matter" hidden behind it.
  *   **Falsification Condition:** If the Fast Probe is *perfectly* accurate to the physical stimulus (100% "No Change") while the Slow Report is 100% Illusion, we must admit there is a definite state that gets overwritten. We would have to concede the "Orwellian" rewrite is real.

  #### SETUP B: Stretching the Gap
  *Method: Increase ISI (Inter-Stimulus Interval) from 50ms to 1000ms. Find the threshold where "One Moving Dot" becomes "Two Flashing Dots."*

  **The "Realist" Camp Prediction:**
  *   **Prediction:** There will be a relatively **sharp threshold** (e.g., around 200ms).
  *   **Why:** This threshold represents the limit of the "integration window" or the "specious present." It is the width of the buffer where the brain can still hold the first dot to compare it with the second.
  *   **Meaning of Threshold:** It marks the physical limit of the editing mechanism. Below 200ms, the editor can merge them. Above 200ms, the editor gives up.
  *   **Falsification Condition:** If the transition is completely random or gradual without a clear cognitive boundary, it suggests there is no fixed "window" of consciousness, weakening the idea of a defined processing stage.

  **The "Drafts" Camp Prediction:**
  *   **Prediction:** The transition will be **fuzzy and context-dependent**.
  *   **Why:** There is no fixed window. The brain makes a "bet." At 100ms, the bet "one object" is cheap and likely. At 500ms, the bet "two objects" is cheaper. The threshold shifts based on attention, expectation, and task demands.
  *   **Meaning of Threshold:** It is not a hard limit of experience, but a "cost-benefit" switch in narrative construction. It's where writing one story becomes harder than writing two.
  *   **Falsification Condition:** If the threshold is fixed, rigid, and invariant across different contexts/subjects, it suggests a hard physiological limit on the "stream," which looks too much like a fixed Theater buffer for our comfort.

  ***

  ### 4. BLUNT ASSESSMENT: VERBAL VS. REAL

  *You asked me to call it. I've sat in the room while they argued this for thirty years. Here is the verdict.*

  **What is Verbal (The Fight about Words):**
  Half of this fight is about the word **"Experience."**
  *   The **Realists** use "Experience" to mean *the neural state that causes the report.* They think if you can't report it, it wasn't experienced.
  *   The **Drafts** camp uses "Experience" to mean *the report itself.* They think asking about the state before the report is nonsense.
  *   **Verdict:** When they argue about "When did the experience happen?", they are mostly fighting over whether "experience" is a *cause* or an *effect*. This is a definition fight. They could solve 50% of the tension by agreeing to say "Neural State X" vs "Report Y" and banning the word "Experience" for five years.

  **What is Real (The Fight about the World):**
  The other half is about **Neural Architecture.**
  *   Is there a specific neural buffer where data sits *before* being broadcast to other systems? (Realist says Yes, Drafts says No).
  *   Does a fast button press access a *different neural pathway* than a slow verbal report? (Both say Yes, but disagree on what that pathway contains).
  *   **Verdict:** This is a real empirical dispute. Setup A (Fast Probe) is the only thing here that matters. If you can show that a 300ms motor response is physically incapable of containing the "motion" computation, the Realists win. If you show that the 300ms response *also* contains the illusion, the Drafts camp wins.

  **My Advice:**
  Don't listen to their metaphysics. Run Setup A. If the button press says "Two Dots" while the mouth says "One Moving Dot," the Realists were right about the rewrite. If both say "One Moving Dot," the Dennett side was right that the construction is immediate. Everything else is just noise.
