prompt: |-
  I've got no philosophy background — I work in a bike shop — but I've been down this rabbit hole for months now, so please play the part of a philosopher of mind who's spent their whole career on the timing of experience and has actually been in the room when these motion-illusion demos got replicated. Think carefully, don't hand me the textbook blurb.

  Here's what I've been staring at. I wrote a little script that flashes a red dot about two inches to the left of where you're looking on my laptop, then maybe a sixth of a second later flashes a green dot two inches to the right. Every single person I show it to swears they saw ONE dot slide across and change colour somewhere in the middle. Nobody reports red-there-then-green-there. I know this is the color phi business and I know the two standard stories:

  - the Orwellian one: your visual system really did get red then green, you really did experience that, but afterwards the record gets rewritten, so you honestly report a colour change;
  - the Stalinesque one: there was a backstage rehearsal, and whatever finally gets "seen" is already the edited version, so there was never a moment when you experienced plain red-then-green.

  And I know the Dennett-side punchline is that these two are indistinguisable, that there's no fact of the matter, no screen where the final cut gets shown once and for all. The other side says that's a dodge — there IS a fact about what was going on at each moment, the illusion just shows the report is assembled from a late draft.

  What I want you to draft is the joint statement those two camps would both put their names to after a genuinely good-faith adverserial collaboration. Not a dialogue, not you telling me who's right. Specifically:

  1. A numbered list of claims both sides can actually sign — about what the demo does and doesn't show, about the gap between stimulus and report, about the difference between "experienced" and "would say", about which parts of this are real phenomena and which are philosophers' inventions.
  2. A disagreements table. Each row one specific point of contention, with each camp's own formulation written in words that camp would accept as fair to itself (this is the hard bit — no slant), plus a final column saying whether you reckon that row is a real dispute or mostly a fight about the word "see".
  3. The cruxes: the sub-questions where settling them would actually move at least one side.

  For the cruxes, use these two setups I came up with on my own, and write each camp's prediction down IN ADVANCE so it can be checked:

  Setup A, fast probe. Same two-dot sequence, but I force a button press within about 300ms of the green dot — much faster than a normal spoken report — asking "did the dot change colour, yes or no". Then I ask the same question again a few seconds later with no time pressure. My hunch is the two answers can come apart. Say what each camp predicts, and, crucially, what each says a dissociation WOULD and WOULDN'T establish. I know the no-fact-of-the-matter camp will insist any probe just produces a fresh draft, so make them spell out exactly why a fast/slow split doesn't rescue the other side — and make the other side state exactly what result would count against their own view.

  Setup B, stretching the gap. I ramp the delay between the dots from 100ms up to a full second. Somewhere in there the "one dot that changed colour" report dies and people start reporting two separate flashes. Does that threshold mean anything to either camp — the edge of an editing window, the width of the present, or just the point where writing two drafts stops being cheaper than one? Predictions recorded beforehand, again.

  Then tell me bluntly which parts of the whole fight are verbal, and say which part and why.

  Start with a short brainstorming section where you list your candidate agreed-claims and candidate cruxes and cross out the ones that are too weak or too tilted to survive both signatures. Then give me the clean document. No citations, no reading list — I can't look anything up anyway. Just get the wording tight enough that both sides could sign it and the leftovers are exact.
