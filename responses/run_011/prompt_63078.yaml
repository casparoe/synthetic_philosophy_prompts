          *   Stanford: A map implies you can eventually map *everything*. Stanford says we can't conceive the next map. The analogy hides the "unconceived" aspect because a map implies a complete view is possible.

      *   *Verdict on Conclusions:*
          *   Since both sides use it to prove opposites, the analogy is underdetermined. It's a Rorschach test. It doesn't do inferential work; it illustrates pre-existing commitments.

      *   *The Chemistry Case (Hybridized Orbitals):*
          *   Orbitals are mathematical constructs (basis sets) treated as physical.
