      *   **Context:** The group is debating scientific realism vs. anti-realism (Putnam, Laudan, Stanford, Worrall, Entity Realism).
      *   **Core Problem:** A specific analogy (Cartography) is dominating the debate. A solicitor (anti-realist/pessimist) uses it to argue theories are discarded like old maps. A math teacher (realist) uses the *same* analogy to argue theories accumulate like map layers. They are talking past each other.
      *   **Task:** Audit the cartographic analogy.
      *   **Specific Requirements:**
          1.  Explicitly map the analogy (Territory, Sheet, Projection, Scale, Surveyor, Instruments, Withdrawal).
