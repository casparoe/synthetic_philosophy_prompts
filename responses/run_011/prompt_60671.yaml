answer: |-
  **Materials:** 3 index cards/student, pens, scoreboard.
  **Rules:** Cards are "source code." Write a deterministic instruction. Legal references: "If opponent's card text matches mine..." or "Copy opponent's action." No external info. Cards sealed until reveal. Arbiter (rotating) evaluates pairs aloud.
  **Payoff:** C/C=3pts, D/D=1pt, C/D=0/5. Total points = grade bonus.

  **Timeline:**
  0-5: Hand out cards. "You are writing code. The arbiter is the compiler." No theory yet.
  5-25: Round 1. Standard PD. Most will defect. Arbiter reads cards, assigns payoff.
  25-45: Round 2. "You may reference their text." Encourage "Cooperate if identical." Watch what happens if someone adds a period.
  45-60: Round 3. "You may seal your card." If sealed, opponent cannot read it. If unreadable, opponent must treat as Defect. Feel the cost of opacity.
  60-90: Debrief.

  **Debrief:**
  Ask the arbiter who stalled: "Why couldn't you decide?" Map this to infinite recursion in code. Ask the "identical" group: "Why did the period break cooperation?" Map to syntactic equality vs. semantic equivalence. Reveal term: *Program Equilibrium*. Unlike Nash (actions), this is equilibrium in *strategies reading strategies*. Unconditional Defection lost dominance because your strategy is now visible input. The sealed round demonstrates that transparency is the substrate of trust here; hiding code forces defection. Ask: "Who earned more in Round 2 than Round 1?" Highlight that legibility changed the dominant strategy.

  **Predicted Failures:**
  Students write vague promises ("I promise to cooperate"). *Steer:* Arbiter must reject non-deterministic instructions. Students avoid the "identical" trick. *Steer:* Hint in Round 2: "Try making your action depend on the ink on their card." Loops bore the class. *Steer:* Cap evaluation time at 2 mins; if unresolved, both get 0 (Penalty for non-termination). Arbiter bias. *Steer:* Rotate arbiters every 3 pairs.

  **Limitation:**
  Real programs execute conditionals instantly and without fatigue, whereas human arbiters simulate logic slowly and error-prone, masking the computational complexity costs inherent to actual program equilibrium.
