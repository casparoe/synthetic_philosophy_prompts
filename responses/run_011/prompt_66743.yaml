      2.  *Anti-realism (categories aren't real):* Hacking isn't saying the suffering isn't real, but that the *kind* is interactive.
      3.  *Stop labeling:* Pragmatic impossibility.
      4.  *Likeliest:* Self-fulfilling prophecy. It's the most common reduction.
      5.  *Timing:* Address self-fulfilling prophecy early (after step 2) to distinguish "individual expectation" from "structural kind change." Address anti-realism after step 4 (when discussing the "new person"). Address "stop labeling" at the end (pragmatics).

