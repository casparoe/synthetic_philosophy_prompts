  3.  **Case Study Selection (MPD vs. Current Category):**
      *   *Option A: Multiple Personality Disorder (MPD/DID).* Hacking's favorite example. Historical, closed loop. Shows the explosion and subsequent contraction.
      *   *Option B: Current Clinical Category (e.g., ADHD, Autism, Borderline).* Relevant to nurses/social workers. Live loop.
      *   *User's Instinct:* MPD because the loop is completed.
