hout implying the person is pretending, as this distinguishes those who grasp the mechanism from those who merely agree with your narrative. Finally, explicitly refuse to cover the ontological status of the disorders by stating clearly at the outset that you will not answer whether the conditions are 'real', because Hacking's point is about the effect of the classification regardless of its underlying truth, and declaring this omission prevents the discussion from devolving into metaphysics.
