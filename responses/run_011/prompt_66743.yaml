      5.  Human sciences lack predictive stability (target moved).
      *   *Critique:* This is actually quite solid logically. It follows Hacking's argument structure. However, step 5 might be too abstract for a general audience without grounding. The link between 4 and 5 needs to be explicit: because the kind changes, the laws governing it change.
