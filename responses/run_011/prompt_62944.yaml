  2. First, determine if the trait is currently maintained by selection for its effect; if so, classify as Adaptation or Exaptation based on original function. If not maintained by selection, classify as Byproduct if it is a necessary consequence of selected traits, otherwise classify as Neutral.

  3. You must drop verdict (g) because accepting a functional hypothesis for the appendix on weak evidence while rejecting one for the chin violates the evidentiary symmetry required for a predictive taxonomy. Consistency demands that functional claims stand or fall on comparable physiological data rather than intuitive plausibility.

  4. The seven cervical vertebrae classify as a Byproduct of developmental constraints linking neck length to cancer suppression, whereas the biconcave red blood cell classifies as an Adaptation for maximizing gas exchange surface area. This distinction highlights how constraints fix traits against selection while optimization drives traits toward it.

  5. The residue remains in cases like goosebumps and earlobes where current selection is too weak to distinguish from drift without precise fitness measurements. This uncertainty persists because any taxonomy based on history cannot fully resolve present-day selective neutrality without empirical data.
