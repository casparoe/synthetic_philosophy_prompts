prompt: |-
  I work in market and insurance risk — eleven years building internal models, so my native vocabulary is value-at-risk and expected shortfall, the coherence axioms (monotonicity, translation invariance, positive homogeneity, subadditivity), spectral risk measures with an aversion function or risk spectrum, capital charges and risk appetite statements, stress scenarios and reverse stress tests, Euler allocation of marginal risk contributions, risk-adjusted return metrics, model risk, and the time-consistency of dynamic risk measures. I can work through the algebra of any of these, but I have no formal training in decision theory.

  A philosopher colleague walked me through a position I want translated into my own terms before I decide whether it has any content for me. It is the view that rational agents need not maximize expected utility, but should instead maximize what is called risk-weighted expected utility. As I understand the proposal: order the possible outcomes of a gamble from worst to best by utility; the utility increment gained by moving up from one outcome to the next better one is not weighted by the raw probability of that increment, but by a risk function *r* applied to the probability of ending up at least that well off, where *r* maps [0,1] onto [0,1], is continuous and strictly increasing, fixes 0 and 1, and expresses risk aversion when *r(p) ≤ p* throughout. So a gamble paying 100 with probability *p* and 0 otherwise is worth *r(p)* times the utility of 100 rather than *p* times it. Three further claims were attached: (i) risk attitude is a third independent component of a rational agent — alongside beliefs and desires — and must not be folded into the curvature of the utility function, since curvature of utility already does something else; (ii) this lets the theory vindicate Allais-type preferences, which expected utility rules out; (iii) the risk attitude is a global or holistic feature of how an agent relates to a whole gamble, not a local sensitivity at the margin. The author also concedes that these preferences can look unstable when the same agent faces a sequence of choices over time.

  Here is what I want from you.

  First, restate the position — the formal rule and each of claims (i), (ii), (iii), and the concession about sequences — as faithfully as you can in the vocabulary I listed. Where my toolkit has an exact counterpart, say so and give it. Be explicit about whether the risk function *r* is the same object as my aversion function in a spectral risk measure, or only a near relative, and whether the REU of a gamble is a risk measure in my sense at all — does it satisfy monotonicity, translation invariance, positive homogeneity, subadditivity, and which of those it breaks if it fails them. Do not force the fit: if the honest rendering is "there is nothing here," say that rather than dressing the position up in my notation.

  Second, give me the residue report, and treat this as the main deliverable rather than an appendix. For each element, tell me what survives intact, what survives only by being bent (and exactly how it is bent), and what cannot be expressed in my framework at all. I am especially interested in four places where I suspect a translation would cheat, and I want you to police them rather than commit them: whether "risk attitude" in my world is a property of the institution or the regulator measuring a position it does not own, whereas the position under discussion makes it a property of the choosing agent's own preferences; whether my vocabulary would silently read "uncertainty" as model risk or Knightian ambiguity when the gamble in question has known probabilities; whether coherence and subadditivity would be smuggled in as rationality constraints that the original theory never accepted; and whether the claim that risk attitude is global rather than marginal is really expressible in a framework built on Euler allocation and marginal contributions, or whether that claim simply dissolves. Then take a view, element by element, on whether each failure of translation is a limitation of my vocabulary or a sign that the original claim was less determinate than it sounded — and answer directly whether this position amounts to a rediscovery of the rank-dependent weighting my field already prices with, or whether something genuinely additional is being asserted. Include the time-consistency concession: does the instability the author admits correspond to failure of time-consistency in a dynamic risk measure, or is it a different problem wearing a familiar label?

  Third, on epistemic standing: separate clearly what is settled from what is genuinely contested among people who actually work on these questions, on both sides. Where decision theorists disagree about whether the position succeeds, or where risk-measurement practice is conventional rather than theoretically forced, say so plainly and do not present a live dispute as a consensus view or a personal preference as a result. Flag any point where you are reconstructing the position rather than reporting it.

