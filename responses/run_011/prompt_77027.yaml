answer: |-
  # PHILOSOPHY CLUB: THE TOXIN DECISION TREE
  **Leader's Logic Map (Do Not Copy)**

  **1. Logical Space & Commitments**
  The puzzle turns on four binary commitments. Not all combinations are coherent.
  *   **C1 (Control):** Can one form an intention directly at will? (Yes/No)
  *   **C2 (Transparency):** Must one believe one will act to intend to act? (Yes/No)
  *   **C3 (Bootstrapping):** Does forming an intention create a new reason to act? (Yes/No)
  *   **C4 (Scope):** Is rationality assessed per *act* or per *plan/policy*? (Act/Plan)

  **Coherent Positions:**
  1.  **Orthodox Impossibility** (No C1, Yes C2, Act): You cannot intend, because you know you won't drink.
  2.  **Resolute Choice** (No C1, Yes C2, Plan): You intend via a binding plan; rationality demands following the plan even if the act is costly.
  3.  **Voluntarism** (Yes C1): You can simply intend, regardless of prediction.
  4.  **Self-Deception** (No C1, No C2): You can intend while knowing you won't do it (akrasia of intention).
  *Empty Cells:* Combinations like "Yes C1 + Yes C2 + Know I won't" are incoherent (cannot will what you believe impossible). "Plan" scope without "Bootstrapping" or "Control" is unstable.

  **4. Indistinguishable Leaves**
  *   **Resolute Choice vs. Policy Rationality:** Both yield "Intend & Drink." *Separation:* Ask, "At noon, is the reason to drink that you *decided* earlier, or that you *always* follow plans?"
  *   **Voluntarism vs. Self-Deception:** Both yield "Intend." *Separation:* Ask, "Did you have to trick yourself to form the intention?"

  **6. Variant Analysis**
  *   **Variant 1 (Payment After Drinking):** The act now has a causal reason (money). **C3 (Bootstrapping)** becomes irrelevant. The tree collapses; almost everyone moves to "Intend & Drink." Only the **Orthodox** stall if they still claim they can't predict their own compliance.
  *   **Variant 2 (Pleasant Substance):** The act has intrinsic value. **C2 (Transparency)** is easily satisfied. The tree fails to sort; everyone "Intends." The puzzle shifts to: "Does a reward change the *status* of an intention if the *action* is unchanged?" (Tests if intention requires sacrifice).

  ***

  ## STUDENT WORKSHOP: WHERE DO YOU STAND?
  **Instructions:** Answer honestly. There are no right answers. Circle **A** or **B**.

  **Q1. The New Year's Diet.** You resolve to diet starting Jan 1. On Dec 31, you know you love cake and have failed before. Can you *sincerely* make the resolution on Dec 31?
  (A) Yes, I can just decide. (B) No, not if I know I'll fail.

  **Q2. The Airport Promise.** You promise a friend a 5 AM ride. At 4 AM, you are exhausted and know you'd rather sleep. Did you *really* intend to drive when you promised, or were you just hoping you would?
  (A) I really intended it. (B) I was just hoping; intention requires certainty.

  **Q3. The Dreaded Class.** You sign up for a hard class needed for graduation. You know you will want to drop it in week three. Can you intend today to finish it?
  (A) Yes, intention is a choice. (B) No, intention tracks what I predict I'll do.

  **Q4. The Bluff.** You tell a bully you will fight them tomorrow to make them back down. You know you are cowardly and won't fight. Is this a lie or an intention?
  (A) It's an intention (I'm committing). (B) It's a lie (I know I won't do it).

  **Q5. The Change of Mind.** You intend to study tonight. At 7 PM, you choose Netflix instead. Did you *change* your intention, or did you *never truly have* the intention at 5 PM?
  (A) I changed my mind. (B) I never truly intended it.

  **Q6. The Sealed Envelope.** You write a note to your future self: "Drink the toxin." You seal it. Can writing the note make it rational to drink later, even if you still hate the toxin?
  (A) Yes, my past decision binds me. (B) No, only reasons present at the time matter.

  **Q7. The Automatic Transfer.** You set up an auto-transfer to savings so you can't spend the money. Does this count as *intending* to save, or just *forcing* yourself?
  (A) It's intending (via policy). (B) It's forcing (intention is internal).

  **Q8. The Reward.** If someone paid you $100 to *intend* to run a marathon (not to run it, just to intend), could you do it?
  (A) Yes, I'd form the intention. (B) No, intention isn't a switch I can flip for money.

  ***

  ## SCORING KEY & RESULTS

  **Tally your A's and B's in pairs:**
  *   **Control Score:** Q1(A) + Q3(A) + Q8(A). (Mostly A = **Voluntarist**)
  *   **Prediction Score:** Q2(B) + Q4(B). (Mostly B = **Transparency Constraint**)
  *   **Binding Score:** Q6(A) + Q7(A). (Mostly A = **Plan/Policy View**)
  *   **Stability Score:** Q5(A). (A = **Intention is Revisable**; B = **Intention is Fact**)

  **Find Your Leaf:**

  | If your profile is... | Your Position | The Awkward Cost |
  | :--- | :--- | :--- |
  | **Low Control, High Prediction, Low Binding** | **Orthodox Impossibility** | You must admit you cannot get the money; rationality forbids intending. |
  | **Low Control, High Prediction, High Binding** | **Resolute Choice** | You must admit it is rational to drink the toxin even when it makes you sick. |
  | **High Control** | **Voluntarism** | You must defend that intentions are magic mental actions distinct from beliefs. |
  | **Low Control, Low Prediction** | **Self-Deception** | You must admit rational agents can sincerely intend what they know they won't do. |
  | **Mixed/Incoherent** | **Philosophical Tension** | Your intuitions about promises conflict with your intuitions about self-control. |

  **Handling Incoherence:** If a member traces no coherent path (e.g., High Control but claims they can't intend for money), do not mark them wrong. Tell them: *"The puzzle has successfully located a conflict in your ordinary concepts. You treat intention as a choice in Q1 but as a prediction in Q8."* This is a feature, not a bug.

  ***

  **Instructor Note on Variants (For Discussion):**
  If you run the **Delayed Payment Variant** (Money after drinking), tell students to re-answer Q6. If they switch to "Yes," they are **Causal Decision Theorists**. If they stay "No," they are **Evidential**.
  If you run the **Pleasant Substance Variant**, tell students to re-answer Q2. If they switch to "Yes," their barrier was **Aversion**, not **Intentionality**.
