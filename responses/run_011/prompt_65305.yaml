prompt: |-
  Act as a decision theorist who has thought way too much about the Pasadena game and about what happens to expected-utility reasoning when the expectation doesn't exist. Think carefully here, and before you write the real answer, spend a handful of lines brainstorming the different angles you could take — I want to see the menu before you commit to the items that actually matter.

  Context: I sit on the board of a small family foundation, endowment about $4m. A lot of what gets pitched to us is longshot tail-risk stuff, so the payoff distributions are wildly fat-tailed, and for a couple of proposals we've genuinely argued ourselves into thinking they're Pasadena-shaped — conditionally convergent at best, and in one case (a pitch involving a staged rollout of some self-replicating something-or-other) flat-out divergent, Altadena-style, where no amount of cleverness is going to produce a number.

  Our workaround, which I basicly invented during a meeting and which I'm now suspicous of, is what we've been calling cap-and-stabilize. We pick a cap C, truncate every proposal's payoff at C, compute the resulting expected value, rank the proposals. Then we crank C up and do it again. The rule is: fund whichever proposal's ranking is most stable as C grows, on the theory that if an ordering survives arbitrarily large caps its tracking something real rather than an artifact of where we happened to put the cutoff. We currently set C equal to the size of the endowment, mostly because that felt like a natural ceiling.

  Please describe the most important implications of the Pasadena paradox — and of undefined or merely conditionally convergent expected values generally — for whether cap-and-stabilize can possibly do what I want it to do. I especially want you to get into:

  - whether "truncate at C" is even one rule, or whether the natural variants (cap the magnitude, cap the upside only, cap the downside only, drop the tail entirely rather than clipping it) give different rankings, and if they do, which of them if any earns the name "the expected value" and why
  - whether the Riemann-rearrangement problem is fatal to my claim that stability under increasing caps tracks something real, given that a payoff distribution doesn't come with a privileged ordering of its outcomes but my rule seems to assume one does
  - what it does to the argument that C should be set by our own balance sheet, i.e. endogenous to the very thing being decided — is that viciously circular, or is it secretly the only honest choice available
  - what we should do with the genuinely divergent proposals, where no cap will ever stabilize anything, and whether it's coherent to keep them in the same ranking exercise as the convergent ones
  - whether "these can't be ranked" leaves us rationally permitted to pick anything at all, or whether it points at some other quantity we should have been ranking on the whole time (median, variance, probability of any loss whatsoever, the size of the worst tranche we could survive)
  - the second-order embarrassment that choosing the decision rule is itself a fat-tailed bet, so the rule for picking rules would have to be applied to itself

  Don't give me a bibliography or invent papers — I'll add citations myself. But do be concrete: I'd rather get two or three small explicit calculations on made-up-but-representative payoff distributions than a tour of the positions people have taken. Write it so I can hand it to the other three board members, who are smart and numerate but have never heard of any of this.
