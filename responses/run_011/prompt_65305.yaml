answer: |-
  ### Brainstorming Menu: Angles of Attack

  Before committing to a recommendation, here are the distinct conceptual levers we could pull to analyze your "cap-and-stabilize" heuristic. Each leads to a different verdict on whether your method is robust or illusory.

  1.  **The Mathematical Angle (Riemann Series Theorem):** If a series is conditionally convergent (Pasadena), its sum depends on the *order* of summation. Truncating at $C$ imposes an order (by magnitude of payoff). Does this order reflect reality, or is it an artifact? If we ordered by probability instead, would the ranking flip?
  2.  **The Economic Angle (Bounded Utility):** The paradox vanishes if utility is bounded. Setting $C$ = Endowment is effectively saying "marginal utility of money drops to zero after $4m." Is this true? What about reputational capital or leverage?
  3.  **The Operational Angle (Truncation Variants):** "Capping" is ambiguous. Do we cap net value, gross upside, or downside liability? A project with unlimited upside and unlimited downside behaves very differently under "cap magnitude" vs. "cap upside."
  4.  **The Survival Angle (Divergence):** For Altadena-style (divergent) proposals, the expectation grows without bound as $C$ increases. Comparing a stabilizing number to a growing number is category error. We need a "ruin constraint" instead of an EV ranking.
  5.  **The Meta-Angle (Rule Selection):** Choosing "cap-and-stabilize" is itself a decision. If the "cost" of picking the wrong rule is fat-tailed (e.g., foundation goes bankrupt), we need a rule for picking rules that prioritizes survival over optimization.

  ***

  ### Memorandum: On the Stability of Undefined Expectations

  **To:** The Board of Directors
  **From:** Decision Theory Advisory
  **Re:** Evaluation of the "Cap-and-Stabilize" Heuristic

  You have stumbled onto a profound problem in decision theory. The Pasadena game demonstrates that when payoff distributions have fat tails, the "Expected Value" (EV) is not a property of the gamble itself, but of the *method used to calculate it*. Your heuristic attempts to recover objectivity by looking for stability as the cap $C$ grows.

  Below is an analysis of whether this method tracks reality or merely masks the ambiguity.

  #### 1. The Truncation Variant Problem
  You asked whether "truncate at $C$" is a single rule. It is not. In fat-tailed distributions, *how* you apply the knife changes the ranking.

  Consider two proposals, **Project Alpha** and **Project Beta**. Both have undefined expectations in the limit, but we will look at their behavior under caps.

  *   **Project Alpha:** 50% chance of $+\$10$, 50% chance of $-\$2$. (Bounded, safe).
  *   **Project Beta:** A "Pasadena-lite" structure.
      *   Outcome 1: $+\$100$ (prob 0.5)
      *   Outcome 2: $-\$200$ (prob 0.25)
      *   Outcome 3: $+\$400$ (prob 0.125)
      *   Outcome 4: $-\$800$ (prob 0.0625)
      *   ... Payoff magnitude doubles, probability halves, signs alternate.

  **Calculation A: Cap Magnitude (Absolute Value)**
  We truncate any outcome where $|Payoff| > C$. Let $C = \$300$.
  *   **Alpha:** EV = $0.5(10) + 0.5(-2) = \$4$.
  *   **Beta:**
      *   $+\$100$ (kept)
      *   $-\$200$ (kept)
      *   $+\$400$ (clipped to $+\$300$)
      *   $-\$800$ (clipped to $-\$300$)
      *   EV $\approx 0.5(100) + 0.25(-200) + 0.125(300) + 0.0625(-300) = 50 - 50 + 37.5 - 18.75 = \$18.75$.
  *   **Ranking:** Beta > Alpha.

  **Calculation B: Cap Upside Only**
  We cap gains at $C$, but allow losses to run (liability). Let $C = \$300$.
  *   **Alpha:** EV = $\$4$.
  *   **Beta:**
      *   $+\$100$ (kept)
      *   $-\$200$ (kept)
      *   $+\$400$ (clipped to $+\$300$)
      *   $-\$800$ (kept fully, as it's downside)
      *   EV $\approx 0.5(100) + 0.25(-200) + 0.125(300) + 0.0625(-800) = 50 - 50 + 37.5 - 50 = -\$12.5$.
  *   **Ranking:** Alpha > Beta.

  **Implication:** Your ranking flips based on whether you treat the cap as a limit on *wealth* (magnitude) or a limit on *contractual upside*. "Cap magnitude" is the only one that respects the symmetry of the Pasadena paradox, but "Cap Upside" is often more realistic for a foundation that cannot lose more than its endowment. If you use "Cap Magnitude," you are assuming you can absorb infinite losses clipped at $C$, which is false. **Recommendation:** You must cap downside at your actual ruin point (endowment) separately from capping upside.

  #### 2. The Riemann Rearrangement Problem
  This is the most fatal theoretical objection to your stability claim. The Riemann Rearrangement Theorem states that for any conditionally convergent series (like the Pasadena game), you can reorder the terms to sum to *any* number you like.

  Your heuristic assumes the distribution comes with a privileged ordering. It does not. A probability distribution is just a set of (outcome, probability) pairs. It does not tell you which outcome happens "first."

  However, your rule *imposes* an ordering: **Order by Payoff Magnitude.** You sum the small outcomes first, then add larger ones as $C$ increases.
  *   **Is this honest?** Yes, practically. In the real world, "small" outcomes are usually high-probability operational variances, while "large" outcomes are rare tail events. Summing by magnitude approximates the temporal reality that we experience the common stuff before the rare stuff.
  *   **Is it fatal?** Only if the proposal can be "repackaged." If a proposer can bundle two small positive outcomes into one large positive outcome without changing the probabilities, they can manipulate your ordering.
  *   **Verdict:** Stability under increasing $C$ (ordered by magnitude) does not track "True EV" (because none exists). It tracks **Robustness to Tail Ignorance.** If a project's ranking holds steady as you include larger tails, it means the decision is driven by the "body" of the distribution, not the "tails." That is a good property, even if it isn't "Expected Value."

  #### 3. Endogenous C (The Balance Sheet Argument)
  You set $C$ = Endowment ($4m). You worry this is circular. It is not; it is **Bounded Utility**.

  The Pasadena paradox relies on the assumption that Utility is linear with Money ($U(x) = x$). If $U(x)$ is bounded (e.g., logarithmic, or a step function at bankruptcy), the expectation exists.
  *   **The Circular Charge:** "We cap at $4m because we have $4m, but we decide how to invest based on the cap."
  *   **The Defense:** You physically cannot realize more than $4m in value if the foundation ceases to exist upon losing it. More subtly, you cannot *use* more than $4m. A billion-dollar payout is functionally identical to a $4m payout if your mission only requires $4m to execute.
  *   **The Risk:** This ignores **Leverage** and **Reputation**. If a tail risk blows up, the cost isn't just the $4m endowment; it's legal liability, reputational destruction, and the inability of the board members to ever fundraise again.
  *   **Recommendation:** $C$ should not be the Endowment. $C$ should be the **Maximum Survivable Loss**. If a tail event creates liability > $4m, that tail must be clipped at the ruin point, not the asset point.

  #### 4. Handling the Divergent (Altadena) Proposals
  You mentioned a self-replicating proposal that is "flat-out divergent." In these cases, the sum grows without bound as $C \to \infty$.
  *   **Can they be ranked?** No. You cannot compare a number that stabilizes (convergent) with a number that grows forever (divgent). It is like comparing a distance to a duration.
  *   **The Coherence Trap:** If you keep them in the same exercise, the divergent project will always win once $C$ is high enough. This is the St. Petersburg Paradox. It implies you should mortgage the foundation for a ticket that has infinite EV.
  *   **What to do:** Remove divergent proposals from EV ranking entirely. They must pass a **Survival Constraint**.
      *   *Rule:* If $P(\text{Ruin}) > 0.1\%$, reject regardless of EV.
      *   *Rule:* If the downside tail is unbounded (infinite liability), reject unless insured.
      *   Divergent upsides are irrelevant if the downside kills the foundation.

  #### 5. If Not EV, Then What?
  If "these can't be ranked" by EV, you are not permitted to pick anything at random. You switch metrics.
  *   **Median Outcome:** The median is robust to fat tails. In the Pasadena game, the median is usually small and well-defined.
  *   **Probability of Loss:** For a foundation, capital preservation is often primary. Rank by $P(\text{Return} < 0)$.
  *   **Geometric Mean:** This approximates long-term growth rate and penalizes volatility/variance heavily. It naturally handles the "risk of ruin" better than arithmetic mean (EV).

  **Calculation 3: Median vs. Mean**
  *   **Project Safe:** 90% chance of $+\$1m$, 10% chance of $-\$5m$.
      *   EV = $0.9(1) + 0.1(-5) = \$0.4m$.
      *   Median = $+\$1m$.
  *   **Project Wild:** 51% chance of $-\$1m$, 49% chance of $+\$100m$.
      *   EV (uncapped) = $-\$0.51m + \$49m = \$48.49m$.
      *   Median = $-\$1m$.
  *   **Decision:** EV says "Wild." Median says "Safe." For a $4m endowment, the "Wild" project has a >50% chance of shrinking the endowment. **Rank by Median** for sustainability, **Rank by EV** only for "play money" allocations.

  #### 6. The Meta-Problem (Choosing the Rule)
  You noted the embarrassment that choosing "cap-and-stabilize" is itself a fat-tailed bet. If you pick the wrong rule, the foundation dies.
  *   **The Regress:** We need a rule to pick the rule.
  *   **The Stopper:** The regress stops at **Mission Survival**. The only "meta-rule" that doesn't require its own expectation calculation is a hard constraint: *Do not adopt a decision rule that allows non-zero probability of total mission failure.*
  *   **Implication:** "Cap-and-Stabilize" is acceptable only if the Cap $C$ is set at the Ruin Point, not the Endowment. If the rule allows a scenario where $Loss > C$, the rule is invalid.

  ### Summary Recommendations for the Board

  1.  **Refine the Cap:** Do not set $C$ = Endowment. Set $C$ = **Maximum Survivable Loss**. If a proposal has unbounded downside (e.g., liability), it is ineligible regardless of upside.
  2.  **Split the Pool:** Separate proposals into "Convergent" (EV stabilizes as $C$ grows) and "Divergent" (EV grows forever). Do not rank them against each other.
  3.  **Change the Metric:** For the Convergent pool, your "stability" heuristic is a proxy for **robustness**. Keep it, but verify it using **Median Return** and **Probability of Ruin**. If a project has high stable EV but >5% chance of losing 50% of the endowment, kill it.
  4.  **Acknowledge the Artifact:** Admit to yourselves that "Stable EV" is not a discovered truth about the universe. It is a statement that "This project's value is determined by its likely outcomes, not its black swans." That is a desirable property, but it is a property of the *project's risk profile*, not its *value*.

  Your heuristic is not mathematically "true" in the Platonic sense, because for these distributions, truth is undefined. But it is **fiduciarily sound** if interpreted as a stress test for tail-dependence rather than a valuation tool.
