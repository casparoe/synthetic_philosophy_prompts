  ### Audit of Commitments for NHS Trust Position Paper

  This audit identifies inconsistencies within your eight commitments, ranks them by severity, and proposes repairs. The analysis prioritises logical coherence and defensibility before a resource-allocation committee.

  #### 1. Apparent vs. Genuine Conflicts

  **Apparent Conflicts (Dissolve on Inspection)**

  *   **Commitment 2 vs. Commitment 7:** You might fear that marking the therapy/enhancement boundary as a boundary of *obligation* (C2) conflicts with the claim that enhancement is not *morally objectionable* (C7). This dissolves upon distinguishing between *justice* and *permission*. You are arguing that the NHS owes citizens therapy as a matter of right, but does not owe enhancement, even if individuals are morally permitted to seek it privately. This is a standard and stable distinction in political philosophy.
  *   **Commitment 6 vs. Commitment 7:** Commitment 6 (fund high well-being/£) might seem to clash with Commitment 7 (enhancement is not the business of the trust). However, C6 specifies "refusal... stands in need of justification". The justification is provided by C2 and C5: the trust's mandate is to restore normal functioning, not maximise aggregate well-being regardless of category. As long as the boundary (C2) is accepted, C6 operates *within* that boundary, not across it.

  **Genuine Conflicts (Require Resolution)**

  *   **Commitment 5 vs. Commitment 4(a):** This is a logical contradiction. C5 states: "refuse where the recipient is at or above that median." C4(a) advocates funding a patient *until* she is "well above" the median (46 ml/kg/min vs. 31 ml/kg/min). You cannot propose a rule and simultaneously advocate a primary case verdict that violates it.
  *   **Commitment 1 vs. Commitment 4(c) & 5:** C1 defines disease strictly via "biological design" and pathology. C4(c) describes a man with "no pathology identified" whom you nonetheless classify as deserving therapy (funding to median). C5 funds based on "statistical... median", not "biological design". If C1 is true, the man in 4(c) does not have a disease. If you fund him as therapy, you are decoupling therapy from disease, rendering C1 irrelevant or false in the context of funding.
  *   **Commitment 5 vs. Commitment 6:** C5 is a deontological constraint (fund shortfalls, stop at median). C6 is consequentialist (fund what produces the most well-being/£). If an enhancement produces immense well-being cheaply, C6 demands justification for refusal. C5 provides that justification, but the tension remains: if the well-being gap is large enough, C6 threatens to erode the hard boundary of C5.

  #### 2. Ranking of Genuine Conflicts by Severity

  1.  **Commitment 5 vs. Commitment 4(a) (Critical):** This is a fatal internal contradiction. In a committee setting, pointing out that your operational rule forbids your flagship example will undermine your credibility immediately. It suggests the position has not been thought through.
  2.  **Commitment 1 vs. Commitment 4(c) (High):** This undermines the philosophical grounding of your paper. If you fund non-pathological states as therapy, you cannot simultaneously maintain a strict Boorsean naturalist definition of disease (C1) as the foundation. It leaves you open to the charge that your "therapy" label is arbitrary.
  3.  **Commitment 5 vs. Commitment 6 (Medium):** This is a tension of principle (Sufficientarianism vs. Utilitarianism) rather than a logical error. It is manageable if you clarify that C6 applies only to interventions that first pass the C5 threshold. However, left unaddressed, it invites committee members to argue for funding enhancements on cost-effectiveness grounds.

  #### 3. Repairs: Cheapest vs. Least Costly

  **Conflict: C5 vs. C4(a)**

  *   **Cheapest Repair:** Amend Commitment 4(a). Change the verdict to state funding stops once she reaches the population median (31 ml/kg/min), not her pre-morbid level (46).
      *   **Cost to You:** High. It sacrifices the intuitive moral force of "restoration". It makes the trust look indifferent to individual loss, adhering rigidly to statistics even when a specific patient could be fully restored.
  *   **Least Costly Repair:** Amend Commitment 5. Modify the rule to fund up to the *higher* of the population median or the individual's established pre-morbid baseline.
      *   **Cost to You:** Moderate. It complicates the "bright line" you seek. It introduces an administrative burden (proving pre-morbid function) which a resource-allocation committee may resist as "gaming" or "expensive assessment". However, it preserves the moral intuition of restoration.

  **Conflict: C1 vs. C4(c)**

  *   **Cheapest Repair:** Qualify Commitment 1. Add a clause stating that for funding purposes, "disease" is operationalised as "statistical subnormality", distinct from the biological definition.
      *   **Cost to You:** Moderate. It admits that C1 does not do the normative work you want it to do. It concedes that your funding rule is not actually tracking "disease" in the biological sense.
  *   **Least Costly Repair:** Drop Commitment 1 entirely. Replace it with a commitment to "Normal Functioning" as the goal, without making claims about biological design or value-free categories.
      *   **Cost to You:** Low. It removes a philosophical hurdle that is not serving your practical argument. The NHS is concerned with function and need, not necessarily philosophical naturalism.

  **Conflict: C5 vs. C6**

  *   **Cheapest Repair:** Qualify Commitment 6. Add "among interventions classified as therapy".
      *   **Cost to You:** Low. It clarifies the scope without changing the principle.
  *   **Least Costly Repair:** Reframe Commitment 6 as a tie-breaker. State that well-being/£ is used to prioritise *between* therapeutic interventions, not to cross the therapy/enhancement boundary.
      *   **Cost to You:** Low. It strengthens the boundary rather than weakening it.

  #### 4. Audit of Case Verdicts (4a, 4b, 4c)

  **Can they all be generated by a single account?**
  Yes, but not by your current Commitment 5. They require a **Hybrid Baseline Account**: *Normal Function* is defined as the population median, *unless* the individual has a demonstrable pre-morbid baseline higher than the median, in which case that baseline applies.

  *   **Verdict 4(a) (The Rower):** Requires the Hybrid Baseline. She is restored to pre-morbid function (46), which exceeds the median (31). Under current C5, this verdict **must be surrendered**. You cannot fund above the median if C5 stands as written.
  *   **Verdict 4(b) (The Firefighter):** Compatible with C5 and the Hybrid Baseline. She is already above the median (32 vs 31) and has no pre-morbid deficit. Job requirements do not shift the baseline of "normal human function" for NHS funding purposes. This verdict **survives**.
  *   **Verdict 4(c) (The Young Man):** Compatible with C5 (Statistical Baseline). Incompatible with C1 (Pathology Baseline). If you keep C1, this verdict **must be surrendered** (as he has no disease). If you drop C1, it **survives**.

  **Summary:** To keep all three verdicts, you must amend C5 to allow pre-morid restoration and amend/drop C1 to allow funding without pathology.

  #### 5. The Single Best Revision

  **Recommendation:** **Revise Commitment 5.**

  **The Revision:** Replace the "population median" rule with a "Normal Functional Range" rule.
  *Draft wording:* "Fund any intervention that restores the recipient's functional capacities to the normal range for their age and sex. The normal range is defined as the population median, or the individual's established pre-morid baseline where this is demonstrably higher and the deficit is due to acute pathology or injury."

  **Why this cleans up the most:**
  1.  **Resolves the Fatal Contradiction:** It aligns the rule with Verdict 4(a), removing the logical error that would embarrass you in the meeting.
  2.  **Mitigates the C1 Conflict:** By focusing on "functional capacities" and "acute pathology" rather than "disease" per se, it sidesteps the need for C1 to be strictly true for funding decisions. It makes C1 less central, reducing the damage if C1 is challenged.
  3.  **Preserves the Boundary:** It maintains a hard line against enhancement for healthy adults (Verdict 4b), satisfying C2 and C7.

  **Realistic Persuasion:**
  A committee is **moderately likely** to be persuaded by this, provided you address the administrative concern.
  *   *Objection:* "Proving pre-morid baseline is costly and open to fraud."
  *   *Counter:* Limit the exception to "acute pathology or injury" (as drafted above) where medical records exist (e.g., the rower's pre-surgery files), rather than congenital low function. This keeps the "bright line" for the majority of cases (like 4b and 4c) while allowing fairness for acute victims (4a).

  **Final Advice:** Do not circulate the draft with Commitment 5 in its current form. It is logically incompatible with your own case study. Fixing this is more urgent than refining the philosophical definition of disease (C1).
