          2.  The Reading (2000-2500 words): Address 7 specific points (Hailsham vs. Wingrave, Escape question, Tommy's tantrums, Miss Lucy vs. Miss Emily, The Gallery, Deferral rumour, Kathy's calm).
          3.  Section on Resistance: Where the lens distorts the book.
          4.  Conclusion: What the novel contributes to the debate.
      *   **Calibration Requests:**
          1.  Separate settled vs. contested issues (especially regarding Williams's "sound deliberative route" and the collapse into externalism).
          2.  Keep exegesis (Williams) and interpretation (Ishiguro) distinct.
      *   **Constraints:** No verbatim quotes (paraphrase only), no bibliography/citations, aim for specific word counts.
      *   **Tone:** Careful, philosophical, not immediate/fluent gloss.

  2.  **Deconstruct the Philosophical Framework (Williams):**
      *   **Internal Reasons Statement (R):** "A has a reason to $\phi$." True iff there is a sound deliberative route from A's subjective motivational set (S) to $\phi$-ing.
      *   **S (Subjective Motivational Set):** Desires, projects, commitments, dispositions. Not just raw desires.
      *   **Sound Deliberative Route:** Correcting false beliefs, reasoning about means, imaginative exploration.
      *   **External Reasons:** Statements claiming reasons exist independent of S. Williams argues these are false/mysterious.
      *   **Contested Point:** How expansive is the "sound deliberative route"? If imagination can add *new* elements to S, does internalism collapse into externalism? (The "Williams's Dilemma").
      *   **Owen Wingrave:** Family has external reasons (tradition), Owen has no internal reasons (no desire).

  3.  **Deconstruct the Literary Text (*Never Let Me Go*):**
      *   **Premise:** Clones raised to be organ donors.
      *   **Hailsham:** School designed to cultivate souls/art to prove humanity.
      *   **Characters:** Kathy H. (narrator, carer), Tommy (artist, temper tantrums), Ruth (manipulative, seeks deferral).
      *   **Key Themes:** Fate, compliance, memory, art, truth, deferral (rumour of delaying donations if in love).
      *   **Ending:** No escape, completions (deaths), Kathy accepts fate.

  4.  **Drafting the Brainstorming Stage (~500 words):**
      *   Need to identify pressure points where Williams's theory meets the text's specifics.
      *   *Point 1: Manufactured S.* Hailsham shapes desires. Williams assumes S is given-ish. If S is engineered, is internalism vacuous?
      *   *Point 2: Escape.* They never try to run. Internalism says if no route from S, no reason. But reader says they *should*. Is the reader an externalist?
      *   *Point 3: Tommy's Anger.* Pre-deliberative. Is anger in S? If yes, internalism works. If no, internalism fails to account for raw protest.
      *   *Point 4: Guardians.* Lucy (truth) vs. Emily (protection). Lucy tries to implant external reasons? Emily tries to cultivate internal acceptance?
      *   *Point 5: Art/gallery.* Trying to change *others'* S. Does this validate Williams's view that reasons require motivational change?
      *   *Point 6: Deferral.* False belief correction. Williams says this clears route. Here it leads to despair. Does internalism predict motivation or just possibility?
      *   *Point 7: Kathy's Narration.* She accepts her fate. Internalist says she has reasons to comply. Reader says she has reasons to rebel. Clash of standpoints.

  5.  **Drafting the Reading (2000-2500 words):**
      *   *Introduction:* Set up Williams's internalism and the novel's premise. State the thesis: The novel tests the limits of internalism when S is manufactured.
      *   *Section 1 (Hailsham vs. Wingrave):* Address the origin of S. Williams is arguably indifferent to the history of S (contested point). The novel suggests this indifference is a moral cost.
      *   *Section 2 (Escape):* The counterfactual deliberation. If they deliberated, would they run? The novel suggests the route is blocked by psychological conditioning, not just physical barriers. Internalism might say "no reason" if S is fully conditioned. This highlights the conservative bias of internalism.
      *   *Section 3 (Tommy's Tantrums):* Are these in S? They are pre-linguistic. Williams allows dispositions. This supports internalism (there *was* a motive), but challenges the "deliberative route" (it wasn't reasoned).
      *   *Section 4 (Lucy vs. Emily):* Lucy tries to inject external reasons (truth about fate). Emily cultivates internal acceptance. Lucy fails. Suggests internalism is descriptively accurate (you can't force reasons) but normatively troubling.
      *   *Section 5 (The Gallery):* Changing third-party S. Aligns with Williams: reasons require motivational grip. Failure of Gallery suggests limits of imagination in shifting S when stakes are high (economic/biological).
      *   *Section 6 (Deferral Rumour):* Correcting false belief. Williams says this enables reasons. Here it removes hope. Internalism predicts *potential* motivation, not *positive* outcome. This protects the theory but empties it of normative force.
      *   *Section 7 (Kathy's Calm):* The reader's externalism. Kathy has internal reasons to comply. Reader has external reasons to claim she should rebel. The novel forces the reader into an externalist position that is practically useless.
      *   *Section on Resistance:* Where the lens fails. The novel isn't about "what to do" but "how to live given what must be done." Reasons discourse might be the wrong tool for fate.
      *   *Conclusion:* What the novel adds. The phenomenology of manufactured S. The tragedy of internalism when S is constrained.

  6.  **Refining and Calibrating:**
      *   *Check Word Count:* Need to ensure the reading is substantial (2000-2500) plus brainstorming (~500). Total ~2500-3000.
      *   *Check Constraints:* No quotes. Distinct sections. Address the "contested" nature of Williams's "sound deliberative route" (does imagination expand S too much?).
      *   *Check Tone:* Philosophical rigor, not just literary appreciation.
      *   *Specific Instruction:* "Begin with a short working stage before the finished piece." -> Brainstorming first.
      *   *Specific Instruction:* "Separate what is settled from what is genuinely contested." -> Need to explicitly flag the debate over the "sound deliberative route" expanding S.
      *   *Specific Instruction:* "Keep exegesis and interpretation apart." -> Use phrases like "Williams requires..." vs "Ishiguro depicts..."

  7.  **Mental Walkthrough of the Argument:**
      *   *Williams's Internalism:* Reasons depend on S.
      *   *Ishiguro's World:* S is engineered by Hailsham.
      *   *Tension:* If S is engineered to accept death, internalism says they have reasons to accept death. Externalism says they have reasons to fight.
      *   *Williams's Defense:* The deliberative route includes imagination. Could they imagine freedom?
      *   *Novel's Answer:* They physically could, but psychologically cannot. The "route" is blocked by conditioning.
      *   *Critique:* Internalism risks legitimizing oppression if S is successfully manipulated.
      *   *Nuance:* Williams might say a *truly* sound route would reveal the manipulation. But the novel suggests the manipulation is too deep.
      *   *Conclusion:* The novel shows the moral danger of a world where internalism is true but S is unfree.

