      *   Check the tone: Don't sound condescending to the magazine, but be firm on the errors.

      *(Self-Correction during drafting)*: I initially thought about going deep into the seven predicates (is, is not, is & is not, etc.). I should keep it high-level so as not to overwhelm, but explain *why* "indescribable" is there (simultaneity of contradictory attributes).
      *(Self-Correction on "Logic")*: The article calls it a logic where nothing is true/false. That's wrong. It's a logic of *predication*, not truth-values in the Western binary sense. I need to clarify that.

