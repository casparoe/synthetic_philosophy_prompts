answer: |-
  **OAKHAVEN GAZETTE | COPY DESK MEMORANDUM 89-LOGIC**
  **TO:** All Reporting Staff, Feature Writers, Stringers
  **FROM:** Office of the Copy Chief
  **SUBJECT:** Quantificational Structure and Liability in Definite Descriptions

  Effective immediately, the *Gazette* adopts a revised policy regarding the logical form of nominal phrases. Consultation with Legal Counsel indicates that assertions implying uniqueness expose the paper to libel when uniqueness cannot be empirically verified. Consequently, the use of the definite article ("the") followed by a noun phrase is prohibited unless the existence and uniqueness of the referent are established facts.

  **1. General Prohibition and Paraphrase**
  Reporters must not assert "The F is G" unless it is verified that exactly one F exists. In most cases, sentences must be paraphrased into existential form.
  *   **Incorrect:** "The suspect fled the scene." (Implies exactly one suspect exists.)
  *   **Correct:** "A suspect fled the scene." or "There is at least one suspect who fled."
  *   **Note:** This restriction severely impacts Metro, Obituaries, and Sports. Do not write "The winner" until the race is officially certified. Do not write "The deceased" unless probate court confirms no other person holds that status relative to the estate.

  **2. Scope of Negation**
  Negative sentences involving descriptions are ambiguous regarding the scope of the negation operator. Headlines must avoid wide-scope negation which presupposes existence.
  *   **Incorrect:** "The King of France Is Not Bald." (False if there is no King; implies a unique King exists who has hair.)
  *   **Correct:** "It Is Not The Case That The King of France Is Bald." (True if there is no King.)
  *   **Policy:** Always prefer narrow scope. We deny the proposition, not the property of a non-existent entity.

  **3. Exposed Franchises**
  *   **Horoscopes:** "The Scorpio" implies a unique individual. Use "Some readers born under Scorpio."
  *   **Dining:** "The best steak in the county" asserts a unique maximizer. Use "A steak among the best." Superlatives are legally treated as definite descriptions.
  *   **Local History:** "The founder of Oakhaven" is suspect if multiple founders exist. Use "A founder."

  **4. Correspondence on Truth-Value**
  *   **Letter:** "Your story 'The Vault Was Empty' was not false; it was meaningless. There was no vault. You failed to say anything at all." — *R. Sterling*
  *   **Reply:** "The sentence was false. The existence condition failed. We stand by the falsity." — *Copy Chief*

  **5. Acquaintance and Demonstratives**
  In courtroom reporting, if a reporter is directly acquainted with the defendant, do not use a description unless the description is verified.
  *   **Incorrect:** (Pointing at defendant) "The murderer sits there." (Truth of 'murderer' is unsettled.)
  *   **Correct:** "This man sits there."
  *   **Constraint:** 'This' is permitted only under direct perceptual acquaintance. Do not use for individuals seen in photographs.

  **6. Propositional Attitudes**
  In reports of belief, descriptions create opaque contexts. Co-referring terms cannot be substituted *salva veritate*.
  *   **Incorrect:** "The Chief believes the winner is honest." (Where 'the winner' = 'Mr. Smith', but the Chief does not know Smith won.)
  *   **Correct:** "The Chief believes Mr. Smith is honest." (Only if the Chief employs that description.)
  *   **Rule:** Do not swap descriptions inside belief contexts. The logical form changes.

  ***

  **SIDEBAR: WEEKLY COPY QUERIES**

  **Q:** Metro Desk asks: Can we write "The sun rose at 6 AM"?
  **A:** Approved. Astronomical uniqueness is verified.

  **Q:** Sports Desk asks: "The team captain resigned." We know who he is, but haven't checked the bylaws on uniqueness.
  **A:** Reject. Use "A team captain." Multiple captains are possible in club structures.

  **Q:** Features asks: "The meaning of life."
  **A:** Reject. Existence of such a meaning is not verified. Use "A meaning of life."

  ***

  **7. Final Compliance**
  Adherence to these protocols is mandatory for all staff. The logical form of ordinary sentences often masks their true quantificational structure. It is the duty of the copy desk to reveal this structure. Failure to parse descriptions correctly renders the paper liable for asserting existence where there is none. The integrity of the *Gazette* depends on the precision of its references.

  **Note:** The rule stated above applies to this document.

  **Copy Chief**
  *Oakhaven Gazette*
