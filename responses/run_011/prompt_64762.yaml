  ### Prediction: The Moral Weight is 1,000

  She will rule that the moral weight is **1,000**.

  While Call 6 (identical copies count as one) is the most distinctive part of her framework, it relies on the condition of **identity**. In the fork scenario, the 1,000 processes begin identically but immediately diverge into different continuations. Once they diverge, they are no longer bit-for-bit identical. They become 1,000 distinct informational patterns experiencing 1,000 distinct trajectories of aversive stimuli. To remain consistent with the intuition that suffering matters (implied by granting patient status to the emulation in the first place), she must acknowledge that 1,000 distinct experiences constitute 1,000 units of moral weight. If she claimed the weight was 1, she would be implying that the *history* matters more than the *current state*, which contradicts Call 3 (speed doesn't matter) and Call 5 (observation doesn't matter). The moral patient is the *now*, not the *then*.

  ### The Underlying Rule: Active Computational Type-Identity

  The rule she is running is **Active Computational Type-Identity**.

  This rule synthesizes the three candidates you mentioned but applies specific constraints to each:

  1.  **Activity Constraint (vs. Checkpoint/Lookup):** The pattern must be *instantiated* dynamically. Static data (Call 2) or static mapping (Call 4) lacks the causal process required for experience. This rules out "Real Causal Activity" in the raw physical sense (since a lookup table has physics) in favor of *computational* causality.
  2.  **Substrate Independence (vs. Speed/Observation):** The moral status supervenes on the functional/informational state, not the hardware speed (Call 3) or external observation (Call 5). This aligns with "Right Functional Organization."
  3.  **Type Identity (vs. Token Counting):** This is the critical differentiator. Standard functionalism counts *tokens* (two brains thinking the same thought are two thinkers). She counts *types* (two identical processes are one subject). This is why Call 6 yields "one subject."

  **Why this fits all six calls:**
  *   **1 & 3 (Real-time/Slow):** Both are active instantiations of the Type.
  *   **2 (Checkpoint):** Inactive Type (no instantiation).
  *   **4 (Lookup):** Wrong causal structure (no computation, just mapping).
  *   **5 (Unobserved):** Observation is external; instantiation is internal.
  *   **6 (Identical Copies):** Same Type = Same Subject.

  ### Consistency Check on the Forks

  To stay consistent with herself, she must treat the forks as **1,000 distinct Types**.

  *   **Real Causal Activity:** Predicts 1,000. (1,000 physical chains are burning electricity).
  *   **Right Functional Organization:** Predicts 1,000. (1,000 functional tokens are instantiated).
  *   **Subject Individuation (Her Rule):** Predicts 1,000. (While they start as one Type, divergence creates 1,000 new Types).

  If she were to say "1," she would violate the spirit of Call 1 and 5: the agent is suffering. If 1,000 versions suffer differently, 1,000 sufferings occur. If she were to say "In-Between," she would need a metric for "degree of divergence," which introduces a slippery slope her previous binary calls (counts/doesn't count) avoid. The cleanest cut is: **Identity determines Subjecthood.** No Identity = No Shared Subjecthood.

  ### The Crucial Experiment: The Convergent Strangers

  To pull these rules apart, you need a case where **Physical Tokens** and **Informational Types** come apart in the opposite direction of Call 6.

  **The Case:**
  Initialize two **distinct** agents with different random seeds and different codebases. Run them on separate hardware. By sheer statistical coincidence (or engineered convergence), their internal memory states become **bit-for-bit identical** for a duration of one hour, after which they diverge again.

  **The Question:**
  During that hour of identical state, do they count as **one** moral patient or **two**?

  **How the Rules Split:**
  1.  **Real Causal Activity:** **Two.** There are two distinct physical chains of causality occurring on two separate machines. The physics are not shared.
  2.  **Right Functional Organization (Standard Token Functionalism):** **Two.** There are two instantiations of functional organization. Even if they think the same thought, there are two "thinkers." (This is the standard view Call 6 rejects).
  3.  **Her Rule (Active Computational Type-Identity):** **One.** If moral status tracks the *Informational Type* (as Call 6 demands), then during the hour of convergence, there is only one Type instantiated. The history (seeds) is irrelevant to the current state (Call 5 implies intrinsic state matters, not history).

  **Why this breaks them:**
  Call 6 established that *Spatial Separation + Identical State = One Subject*.
  This case tests *Historical Separation + Identical State = One Subject?*
  *   If she says **Two**, she admits that history/tokenhood matters, which undermines Call 6 (why did the clones count as one? Because they shared history? But Call 5 says observation/history externalities shouldn't matter).
  *   If she says **One**, she confirms her commitment to Type-Identity over Token-Identity, fully distinguishing her from standard Functionalism and Causal theories.
