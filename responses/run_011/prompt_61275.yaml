answer: |-
  This is a productive pivot. Textbook relativism often sterilizes the stakes; the AAA archive restores them. The 1947 Statement ("Statement on Human Rights") and the 1999 Declaration ("Declaration on Anthropology and Human Rights") offer a concrete historical trajectory that tests the coherence and utility of relativist positions under political pressure.

  Here is an analysis of the arc, structured by your questions.

  ### 1. The Three-Way Split in the 1947 Statement

  The 1947 Statement is often cited as the canonical text of anthropological relativism, but it is not philosophically uniform. It slides between the three categories you identified, and that slippage is where its argumentative power—and its vulnerability—lies.

  *   **Descriptive Relativism:** The Statement is unambiguous here. It asserts that "standards and values are relative to the culture from which they derive." This is presented as an empirical finding of ethnography. There is no hesitation: moral systems are culturally embedded.
  *   **Metaethical Relativism:** The text implies this but does not strictly argue for it. It suggests that because values derive from culture, there is no "transcendent" or "universal" standard by which to judge them. However, it stops short of a full-blown error theory or non-cognitivism. It posits that the *source* of validity is internal to the culture, not that moral claims lack truth values simpliciter.
  *   **Normative Relativism:** This is the prescriptive payload: "Respect for differences between cultures is the basic postulate of the science [of anthropology]." The argument is that we *ought* not to impose Western rights because doing so violates the integrity of other cultural systems.

  **The Slide:** The Statement moves from Descriptive ("values are relative") to Metaethical ("no universal standard exists") to Normative ("therefore, do not impose"). This is the classic naturalistic fallacy territory. However, the Statement attempts to bridge this with a specific anthropological universal: **personality realization.** It argues that "the individual realizes his personality through his culture."

  This is the critical pivot. The Statement argues for normative relativism (tolerance/non-imposition) based on a **universalist anthropology**. Every human needs a culture to realize their personality; therefore, destroying a culture (via imposition) destroys the human.

  ### 2. The Self-Refutation Charge

  The standard critique (articulated later by philosophers like Donnelly and legal theorists) is that the Statement condemns imperialism in the name of tolerance, but tolerance is itself a universal value. If no framework-independent truths exist, on what ground do you condemn the imposition of Western values?

  **Did they build a straw man?**
  Partially. The critics assume the 1947 authors were preaching tolerance as a *freestanding moral universal*. But the text suggests tolerance is a *functional prerequisite* for the universal good of "personality realization."

  **Did they hold the position?**
  The Statement is inconsistent. It claims there are no universal standards, yet it relies on the universal standard of "cultural integrity as necessary for personality."
  *   **If read strictly metaethically:** The Statement is self-refuting. It makes a universal claim ("no universal claims") to justify a universal prohibition ("do not impose").
  *   **If read functionally:** It escapes self-refutation. It argues: "We all agree humans need culture to function (Universal Fact). Therefore, interfering with culture harms humans (Universal Norm). Therefore, specific moral contents should remain local (Relativist Conclusion)."

  The critics attack the metaethical claim ("no universal truths"). The authors were actually making a sociological claim ("universal need for cultural embedding") to ground a political injunction. The charge of self-refutation sticks only if you ignore the anthropological universalism underpinning the ethical relativism. The Statement isn't purely relativist; it is **methodological relativism grounded in psychological universalism.**

  ### 3. Truth vs. Justification (The Epistemic Move)

  Your distinction between relativism as a claim about *truth* (metaphysical) vs. *justification* (epistemic) is the sharpest tool for dissecting this.

  **Does the epistemic reading survive the text?**
  Barely. The text says values "derive" from culture. That is an ontological claim about the source of value, not just our access to it. However, the *rhetorical force* of the document is epistemic: "We cannot know which culture is better," or "We have no procedure to adjudicate."
  If you read the 1947 Statement as purely epistemic (we cannot know the good across cultures), it lets them off too easy regarding the text, but it aligns with their political goal: **epistemic humility as a barrier to imperialism.**

  **Maritain vs. Herskovits:**
  Jacques Maritain's observation at UNESCO ("agree on the rights, not the why") is distinct from the AAA 1947 position.
  *   **Maritain (Overlapping Consensus):** Assumes universal rights exist (Thomist natural law), but acknowledges pluralistic *justifications*. This is compatible with moral realism.
  *   **AAA 1947 (Incommensurability):** Suggests the *rights themselves* might be culture-bound. It's not just that we disagree on the *why*; it's that the *what* is locally constituted.

  Maritain's move is epistemic/pragmatic within a universalist ontology. The AAA's move is ontological relativism regarding the *content* of values, masked as epistemic humility regarding *judgment*.
  Your epistemic reading saves the 1947 authors from metaphysical incoherence, but it requires ignoring their explicit language about the cultural *source* of values. It treats the Statement as a political strategy (stop the West) rather than a philosophical treatise. Given Herskovits's background, this is likely the more accurate historical reading: the metaethics were weapons, not conclusions.

  ### 4. The 1999 Reversal: Theory or Context?

  In 1999, the AAA adopted a Declaration supporting human rights, acknowledging that "anthropology can contribute to the protection of human rights." This is often framed as the death of relativism. I argue it is the death of relativism's *political utility* in a specific context.

  **What does the reversal do to the theory?**
  1.  **Relativism Proving Unstable?** Not necessarily. Normative relativism is stable as long as the primary threat is *external imposition*. In 1947, the threat was Western colonialism/imperialism. Relativism was a shield for the colonized.
  2.  **Evidence 1947 was never Metaethical?** This is the strongest reading. If 1947 was a political maneuver against Western hegemony, then 1999 is a political maneuver against state violence and genocide. In the late 20th century, "culture" was often invoked by states to justify abuse (e.g., "Asian Values" debates, female genital cutting defenses). Relativism became a shield for *tyrants*, not the colonized.
  3.  **Institutional Update:** The 1999 Declaration acknowledges that "culture" is not always a benign medium of personality realization (as 1947 assumed). It can be a site of oppression. When the internal dynamics of a culture violate the conditions for personality realization for subsets of its members (women, minorities), the 1947 universalist foundation (personality realization) actually *demands* intervention, not tolerance.

  **The Fifty-Year Arc:**
  *   **What Relativism Explains:** It explains the *shift in rhetorical strategy*. When power flows West $\to$ Rest, relativism is the tool of the Rest. When power flows State $\to$ Citizen (often in the Rest), universalism is the tool of the Citizen. The metaethical debate tracks the geopolitical power dynamic.
  *   **What Relativism Can't Touch:** It cannot resolve the ontological status of rights. The 1999 reversal doesn't prove universal rights exist; it proves the AAA decided acting *as if* they exist is necessary to prevent atrocity. It is a pragmatic adoption of universalism, not a philosophical refutation of relativism.

  ### Summary for the Chapter

  If you are writing this up, the through-line is this:

  The 1947 Statement is not a clean instance of metaethical relativism. It is a **universalist claim about human psychology (need for culture)** used to justify a **normative prohibition on interference**. The self-refutation charge fails because it misses the psychological universalism.

  The epistemic reading (truth vs. justification) is historically charitable but textually generous; the authors wanted the ontological weight of "culture creates value" to block universal claims, not just the epistemic limitation.

  The 1999 reversal does not solve the metaethical problem. It reveals that "relativism" in anthropology was never a settled metaphysical commitment but a **political technology**. It was deployed when culture was the victim (1947) and abandoned when culture became the perpetrator (1999).

  **The Philosophical Payoff:**
  The arc suggests that the descriptive/metaethical/normative split is unstable in practice because normative commitments drive the metaethical posture. We don't choose relativism because we are convinced by the metaphysics; we choose it because it serves a specific protective function. When that function reverses, the metaphysics are quietly updated. This supports a pragmatist reading of moral ontology: the "truth" of relativism is contingent on its consequences for human flourishing (the very universal the 1947 authors secretly relied on).

  This allows you to move past the "is relativism true?" deadlock to "under what conditions is relativism a viable moral technology?" which is a much richer vein for a dissertation.
