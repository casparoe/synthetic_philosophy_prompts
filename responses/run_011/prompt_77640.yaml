answer: |-
  Here is a breakdown of the logical structures hiding behind *cui bono?*, followed by an analysis of your two suspicions and a checklist for when the heuristic actually carries weight.

  ### The Menu of Claims

  **1. The Motivational Platitude**
  *   **Claim:** Human actions are often driven by self-interest; therefore, knowing who gains helps us understand *why* an action might have been taken.
  *   **Commitment:** Only that motives exist and are relevant to psychology.
  *   **Scrutiny:** Survives easily. It is a truism.
  *   **Licenses "Benefited → Arranged"?** No. It explains motive, not causation. A person can have a motive to rob a bank without robbing it.

  **2. The Investigative Heuristic**
  *   **Claim:** In a field of many potential actors, identifying the primary beneficiary narrows the search space for who *might* have acted.
  *   **Commitment:** That resources for investigation are scarce, and benefit is a cost-effective filter for generating hypotheses.
  *   **Scrutiny:** Survives. This is how fraud auditors and detectives start, not finish.
  *   **Licenses "Benefited → Arranged"?** No. It licenses "Investigate," not "Conclude."

  **3. The Probabilistic Nudge**
  *   **Claim:** An event that confers a specific, large benefit on a specific agent is statistically less likely to be random noise than an event that confers no benefit or diffuse benefits.
  *   **Commitment:** That the distribution of benefits in random systems is usually diffuse, while engineered systems produce concentrated outcomes.
  *   **Scrutiny:** Conditional. It holds in mechanical systems (a bridge doesn't collapse on a specific car unless sabotaged) but fails in complex adaptive systems (markets, politics) where unintended consequences are the norm.
  *   **Licenses "Benefited → Arranged"?** No. It raises the posterior probability slightly, but does not cross the threshold of proof.

  **4. The Strong Causal Claim (The BIL's Official Stance)**
  *   **Claim:** If an agent is the *primary* beneficiary of an event, they are the *probable cause* of the event.
  *   **Commitment:** That benefit is a reliable proxy for agency; that unintended consequences benefiting specific actors are rare enough to be dismissed.
  *   **Scrutiny:** Fails. This is the *post hoc ergo propter hoc* fallacy dressed in Latin. It ignores competence, opportunity, and base rates of accidental benefit.
  *   **Licenses "Benefited → Arranged"?** Yes. This is the only version that attempts this jump, but it does so illegitimately.

  **5. The Presumption of Guilt (The Burden-Shift)**
  *   **Claim:** Once benefit is established, the burden of proof reverses. The beneficiary must prove they *did not* cause the event, or skeptics must provide a complete alternative causal account.
  *   **Commitment:** That coincidence is impossible or sufficiently improbable that it requires disproof rather than proof.
  *   **Scrutiny:** Fails. This violates the basic epistemic rule that the person making the positive claim ("this was arranged") bears the burden of proof.
  *   **Licenses "Benefited → Arranged"?** It attempts to license it by default if no other explanation is immediately available (argument from ignorance).

  ***

  ### Addressing Your Suspicions

  **(a) The Hindsight Problem (Sharpened)**
  Your suspicion is correct and fatal to the Strong Causal Claim. In any complex system (like a government or a market), *someone* always benefits from any outcome.
  *   **The Test:** If the rule had *not* been dropped, a different contractor would have benefited (the one protected by the rule). If the stock had dropped, short-sellers would have benefited.
  *   **The Flaw:** Unless the beneficiary can be identified *ex ante* (before the event), *cui bono* is non-falsifiable. It is a pattern-matching exercise that finds a pattern in noise because it looks for the pattern *after* the noise has settled.

  **(b) The Agency Problem (Sharpened)**
  Your suspicion is also correct. "Benefit" must accrue to a decision-capable unit.
  *   **The Flaw:** In your example, the stock price jump benefits shareholders. Shareholders are a diffuse, uncoordinated group. The *contractor's executives* might benefit, but even they are agents of the board.
  *   **The Requirement:** For *cui bono* to work, the beneficiary must be a singular agent (or a cohesive cartel) with the *capacity* to execute the cause. If the beneficiary is "the energy sector," the heuristic is decorative. If the beneficiary is "the Minister's campaign fund," the agency is clearer, but the causal link still requires evidence of transmission (the bribe/the quid pro quo).

  ***

  ### The Checklist for Probative Value

  To move *cui bono?* from decorative to probative, the following conditions must be met. If the answer to any of these is "no," the heuristic is merely suggestive.

  1.  **Ex Ante Identification:** Could the beneficiary have been named *before* the event occurred? (If you had to wait for the stock price to jump to name the contractor, the test fails).
  2.  **Concentration of Gain:** Is the benefit concentrated in a single agent, or diffuse across a sector? (Diffuse gain suggests systemic drift; concentrated gain suggests targeting).
  3.  **Exclusivity:** Is this agent the *unique* or *primary* beneficiary? (If five contractors benefited and one lost, the heuristic is weak. If only one benefited significantly, it is stronger).
  4.  **Capacity and Access:** Did the beneficiary have the specific means, clearance, and opportunity to cause the event? (A contractor benefiting from a rule change must have access to the minister, not just a donation record).
  5.  **Base Rate Calibration:** How often does this type of event happen *without* corruption? (If procurement rules change weekly, a Tuesday change is noise. If they change once a decade, a Tuesday change is signal).
  6.  **Mechanism Specificity:** Can you describe the mechanism of causation without assuming the conclusion? (e.g., "The donation bought a meeting" is a mechanism; "The donation influenced the outcome" is an assertion).

  ***

  ### The Burden-Shift Mechanism

  The specific claim doing the work in your brother-in-law's reply ("*I* owed him an account of why the rule died on that specific Tuesday") is **Item #5: The Presumption of Guilt.**

  He is treating the *absence of an alternative explanation* as *evidence for his explanation*. This is logically distinct from the *cui bono* heuristic itself.
  *   **Cui Bono (Valid):** "Who gains? Let's look at them."
  *   **BIL's Move:** "Who gains? They are guilty unless you can prove otherwise."

  He is using the benefit to establish a *prima facie* case, then demanding you disprove it. This works rhetorically because explaining the precise timing of bureaucratic decisions is often impossible (bureaucracy is opaque), but that impossibility does not transfer the burden of proof to the skeptic.

  **Summary for your group:** *Cui bono* is a valid tool for generating hypotheses (Menu #2), but an invalid tool for testing them (Menu #4). It becomes fallacious when it treats motive as mechanism, or when it uses the difficulty of explaining randomness as proof of design.
