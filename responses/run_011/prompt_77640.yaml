          *   Tone: Analytical, precise, no moralizing about the BIL beyond what's necessary for the logic.

  2.  **Deconstruct *Cui Bono?*:**
      *   *Origin:* Cicero, *Pro Roscio Amerino*, attributing to Lucius Cassius Longinus Ravilla. Meaning: "To whose benefit?"
      *   *Legal Context:* Motive is relevant to suspicion, not proof of guilt.
      *   *Logical Structure:* Event $E$ occurred. Agent $A$ benefited from $E$. Therefore, $A$ caused $E$. (This is the fallacy).
      *   *Valid Structure:* Event $E$ occurred. Agent $A$ benefited from $E$. Therefore, investigate $A$'s involvement. (This is heuristic).

  3.  **Drafting the "Menu" of Claims (Iterative Process):**
      *   *Level 1: Trivial/Platitude.* Motives matter. People do things for reasons. (Survives scrutiny, doesn't prove causation).
      *   *Level 2: Investigative Heuristic.* Follow the money to find suspects. (Survives, useful for narrowing search, doesn't prove guilt).
      *   *Level 3: Probabilistic Indicator.* Benefit increases the likelihood of agency compared to random chance. (Debatable, depends on base rates).
      *   *Level 4: The BIL's Strong Claim.* Benefit implies causation/arrangement. (Fails scrutiny, post hoc ergo propter hoc).
      *   *Level 5: The Burden Shift.* If you benefit, you must prove you *didn't* cause it. (Fails scrutiny, reverses presumption of innocence/logic).

  4.  **Addressing the User's Suspicions:**
