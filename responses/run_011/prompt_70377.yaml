  # Handout: Decision Tree for Interpretations of Harsanyi's Aggregation Theorem

  **Context:** The bare theorem states that if individual preferences $\succeq_i$ and social preferences $\succeq_S$ over a set of prospects satisfy the Expected Utility (EU) axioms, and if $\succeq_S$ satisfies the Pareto condition with respect to $\succeq_i$, then the social von Neumann-Morgenstern (vNM) utility function $W$ is a positively weighted sum of individual vNM utility functions $U_i$:
  $$W = \sum_{i=1}^n a_i U_i + b$$
  The following decision tree sorts competing interpretive readings of this result. At each node, answer the question based on the **mathematical commitments** of the reading you are evaluating. Do not select a path based on the label of the final position; select the path that matches the technical assumptions the position requires.

  ---

  ### **Decision Tree**

  **START:** Harsanyi Aggregation Theorem (EU Axioms + Pareto $\rightarrow$ Linear Aggregation)

  **NODE 1: Pareto Scope**
  Does the reading require the Pareto condition to hold **statewise** (for outcomes in every state of nature) *in addition to* the standard **ex ante** requirement (over prospects)?
  *   **YES** $\rightarrow$ Go to NODE 2.
  *   **NO** (Ex ante only) $\rightarrow$ Go to NODE 3.

  **NODE 2: Independence Axiom**
  Does the reading maintain that social preferences must satisfy the **Independence axiom** over prospects while retaining the statewise Pareto condition?
  *   **YES** $\rightarrow$ **LEAF A: The Impossibility Reading** (Premises jointly unsustainable).
  *   **NO** (Independence relaxed) $\rightarrow$ **LEAF B: Distribution-Sensitive Welfarism** (Unnamed in standard canon; e.g., Ex Post Prioritarianism).

  **NODE 3: Utility Ontology**
  Are the aggregated quantities $U_i$ interpreted as **interpersonally comparable measures of wellbeing**, or strictly as **vNM preference indices** (unique up to positive affine transformation)?
  *   **WELLBEING** $\rightarrow$ Go to NODE 4.
  *   **vNM INDICES** $\rightarrow$ Go to NODE 5.

  **NODE 4: Weight Derivation**
  Does the reading derive equal weights ($a_i = a_j$) from the core axioms alone, or does it require an additional **Anonymity axiom** to establish equality?
  *   **REQUIRES ANONYMITY AXIOM** $\rightarrow$ Go to NODE 6.
  *   **ACCEPTS UNEQUAL/ARBITRARY WEIGHTS** $\rightarrow$ **LEAF C: Weighted Welfarism** (Unequal and unnormalized weights).

  **NODE 5: Normative Status of $W$**
  Does the reading posit a mathematical mapping from the social utility function $W$ to a **normative objective** (e.g., "Ought to maximize"), or does it treat $W$ solely as a **representation of consistent preferences**?
  *   **NORMATIVE OBJECTIVE** $\rightarrow$ **LEAF D: The Neutral/Non-Welfarist Reading** (Summed quantities need not be wellbeing; neutral on moral content).
  *   **PREFERENCE REPRESENTATION ONLY** $\rightarrow$ **LEAF E: The Rationality-Only Reading** (Affine combination with no moral content).

  **NODE 6: Observer and Population**
  *(Reached only if Wellbeing + Anonymity)*
  Does the reading identify the social observer as one of the individuals $i \in N$ **and** allow the population $N$ to vary across prospects?
  *   **YES** (Observer inside + Variable Pop) $\rightarrow$ **LEAF F: Critical Utilitarianism** (Unnamed; leads to Parfit-style objections).
  *   **NO** (Observer outside or Fixed Pop) $\rightarrow$ **LEAF G: Classical Utilitarianism**.

  ---

  ### **I. Vacant Combinations**

  The following combinations of answers are permitted by the logical structure of the tree but are not occupied by standard positions in the literature.

  1.  **Statewise Pareto + Independence + vNM Indices (Leaf Path 1 $\rightarrow$ 2 $\rightarrow$ YES).**
      *   **Status:** **Incoherence.**
      *   **Reasoning:** This combination generates the Diamond-Broome impossibility result. One cannot maintain statewise Pareto, ex ante Pareto, and the Independence axiom simultaneously without contradiction. No coherent position occupies this leaf because the mathematics forbids it.

  2.  **Wellbeing + Anonymity + Variable Population + Fixed Weights (Leaf Path 3 $\rightarrow$ 4 $\rightarrow$ 6 $\rightarrow$ YES).**
      *   **Status:** **Unattractiveness.**
      *   **Reasoning:** This corresponds to "Critical-Level Utilitarianism" with variable population, but without adjusting the weights or the critical level to avoid the Repugnant Conclusion. While mathematically possible, it is largely neglected in foundational welfare economics because it yields counterintuitive results regarding population ethics (Parfit 1984).

  3.  **vNM Indices + Normative Objective + Unequal Weights (Leaf Path 3 $\rightarrow$ 5 $\rightarrow$ NORMATIVE).**
      *   **Status:** **Neglect.**
      *   **Reasoning:** This position claims we ought to maximize a weighted sum of preference indices where weights are arbitrary, without claiming those indices represent wellbeing. It is rarely defended because it combines moral demandingness ("Ought") with a refusal to ground the metric in value (wellbeing), making the moral obligation appear arbitrary.

  ### **II. Indistinguishable Leaves**

  The following pair of leaves cannot be genuinely separated by the questions in the tree above, as the distinctions rely on philosophical nuance rather than mathematical specification.

  **Pair:** **LEAF D (Neutral/Non-Welfarist Reading)** and **LEAF E (Rationality-Only Reading)**.

  *   **Problem:** Both leaves accept that $U_i$ are vNM indices (not necessarily wellbeing) and both reject the derivation of Classical Utilitarianism. The tree splits them based on whether $W$ is mapped to a "Normative Objective." However, in the formalism, a "normative objective" and a "social preference ordering" are both represented by the maximization of $W$. The mathematics alone does not distinguish between "Society prefers X to Y" and "Society ought to choose X over Y."
  *   **Further Question Needed:** To split these, one must ask a meta-ethical question outside the formalism: *"Does the reading claim that violating the social preference ordering $\succeq_S$ constitutes a moral wrong, or merely an inconsistency in planning?"* This cannot be answered from the mathematics alone, as the theorem is silent on deontic operators.
