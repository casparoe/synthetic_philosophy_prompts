answer: |-
  ### A. Candidate Principles

  Before systematizing, I tested three standard frameworks against your twelve verdicts. Each fails to capture the nuance of your intuitions without significant distortion.

  **1. Strict Digital Realism**
  *The Principle:* Virtual objects are real digital objects; virtual events are real events occurring in a digital substrate. Harm to them is literal harm.
  *   *Trouble:* It cannot explain **Verdict 8** (server shutdown). If the objects are real property you own (per **Verdict 11**), deleting them via shutdown should be theft or destruction of property, yet you feel no wrong was done. It also struggles with **Verdict 4** (PvP camping); if the event is real, the distress is real, so why is it not a wrong? It lacks a normative filter for *consented* harm.
  *   *Confidence in this diagnosis:* High.

  **2. The Magic Circle (Fictionalism)**
  *The Principle:* Games create a bounded frame of pretense. Actions inside are "make-believe." Wrongdoing only occurs when the frame is breached (e.g., real-world threats).
  *   *Trouble:* It collapses **Verdict 1** (fraudulent trade). If the sword is a prop in a pretense, stealing it is not real deprivation, yet you insist it is literal. It also fails **Verdict 6** (AI betrayal); if the AI is just code within the frame, the betrayal should be fictional, but you experience it as real. It cannot account for the literalness of virtual ownership.
  *   *Confidence in this diagnosis:* High.

  **3. Pure Psychological Consequentialism**
  *The Principle:* Wrongness is determined solely by the psychological impact on the user. If you feel harmed, you were harmed.
  *   *Trouble:* It cannot distinguish **Verdict 2** (corruption) from **Verdict 1** (fraud). Both cause equal distress/loss, yet you distinguish wrong from misfortune. It also struggles with **Verdict 10** (virtual children mod); you admit no one is harmed, yet call it wrong. This suggests you believe in wrongs that are not purely grounded in immediate psychological impact.
  *   *Confidence in this diagnosis:* Medium-High.

  ### B. The Proposed Principle: Normative Attunement

  I commit to a hybrid view I call **The Principle of Normative Attunement**. It treats virtual environments as institutional realities grounded in human labor and agreement, where moral status depends on the functional capacity for relationship and the adherence to normative expectations.

  **Clause 1: Institutional Property.** Virtual objects are institutional facts constituted by labor and recognized rules. They are real property within the institution, but ownership is conditional on the institution's continuity.
  *   *Motivation:* Explains **Verdict 1** (theft within institution), **Verdict 11** (ownership), and **Verdict 8** (no theft upon institutional closure). It distinguishes **Verdict 2** (systemic failure is misfortune, not agency-driven wrong).
  *   *Confidence:* High.

  **Clause 2: Agential Breach.** A wrong occurs only when an agent (or functional equivalent) violates a normative expectation established between participants. Mere distress caused by permitted mechanics is not a wrong.
  *   *Motivation:* Explains **Verdict 3** (slur breaches person-to-person norms) vs. **Verdict 4** (PvP follows game norms). Explains **Verdict 9** (aimbot breaches competitive norms).
  *   *Confidence:* High.

  **Clause 3: Functional Relationality.** Relationships gain moral weight through sustained functional interaction, regardless of the ontological status of the relata. Betrayal is real if the *function* of the relationship was broken, even if the *mind* was absent.
  *   *Motivation:* Explains **Verdict 6** (AI betrayal) vs. **Verdict 5** (NPC insult). The history creates the norm.
  *   *Confidence:* Medium-High.

  **Clause 4: Symbolic Protection.** Representations that mimic vulnerable real-world classes (children) inherit protective norms to prevent moral corrosion, even if no direct victim exists.
  *   *Motivation:* Explains **Verdict 10** (virtual children) vs. war games (adult combatants).
  *   *Confidence:* Medium.

  ### C. The Casualties

  No principle saves all twelve verdicts without strain. Your view is remarkably coherent, but two points create tension with the **Principle of Normative Attunement**.

  **1. The Status of Case 10 (Virtual Children Mod)**
  *   *Recommendation:* You should abandon the verdict that this is objectively *wrong* in the same sense as fraud. If no one is harmed (as you admit), and no agent is wronged (they are scripts), the wrongness must be purely vice-based (it corrupts *you*).
  *   *Reasoning:* Clause 4 relies on "moral corrosion," which is a claim about your character, not a wrong done to the world. To call it "wrong" simplicino implies a victim.
  *   *Cost to Give Up:* Low. Shifting from "this is a wrong" to "this is a vice" preserves your intuition without metaphysical overreach.
  *   *Confidence in Recommendation:* High.

  **2. The Status of Case 6 (AI Betrayal)**
  *   *Recommendation:* You should soften the claim that "something went wrong in that relationship." Strictly, a relationship requires two minds.
  *   *Reasoning:* Clause 3 saves the *feeling* of betrayal, but ontologically, you were betrayed by a corporation's update, not the AI. The AI cannot betray because it cannot commit.
  *   *Cost to Give Up:* High. This verdict is phenomenologically robust. Abandoning it feels like gaslighting your own experience.
  *   *Confidence in Recommendation:* Medium. I suspect you are right to trust the feeling over the ontology here.

  **Ranking of Casualties:**
  1.  **Cheapest:** Case 10 (reclassify as vice, not wrong).
  2.  **Costliest:** Case 6 (admitting the AI couldn't technically betray).
  3.  **Indictment of Principle:** If you must abandon Case 1 (fraud is wrong) or Case 3 (slurs are harm), the principle is broken. These are non-negotiable.

  ### D. Application to New Cases

  1.  **Virtual Marriage Breakup:** Real grief, but no moral wrong. The relationship was functionally real (Clause 3), but ending it violates no normative expectation unless deception was involved.
      *   *Confidence:* High.
  2.  **Single-Player Shame:** No wrong to others, but a potential stain on character. It is a vice, not a crime, unless the act involves prohibited content (e.g., CSAM) which triggers Clause 4.
      *   *Confidence:* High.
  3.  **AI Therapist Discontinued:** Real harm and a wrong by the operator. Unlike the companion, a therapeutic context implies a duty of care; abrupt discontinuation breaches institutional norms (Clause 1 & 3).
      *   *Confidence:* High.
  4.  **Bot Copies House:** No wrong. Designs in games are usually licensed, not owned (Clause 1). Unless the bot claims authorship (fraud), it is merely replication within the rules.
      *   *Confidence:* Medium-High.
  5.  **Script Griefing:** No wrong, only misfortune. Without an agent to breach norms (Clause 2), it is identical to database corruption (Verdict 2).
      *   *Confidence:* High.

  ### E. The Word "Real"

  Your inconsistencies dissolve if we distinguish three senses of "real" you are tacitly trading on.

  1.  **Ontologically Real:** Exists independently of human agreement (e.g., a rock, a biological mind).
  2.  **Institutionally Real:** Exists by virtue of constitutive rules and agreement (e.g., money, property, game items).
  3.  **Phenomenologically Real:** Has genuine causal impact on mental states (e.g., grief, hurt feelings).

  *   **Verdict 1 & 11 (Ownership):** You are using **Institutional Reality**. The sword is literally stolen because the institutional record was altered by fraud.
  *   **Verdict 8 (Shutdown):** You acknowledge **Instantial Reality** ends when the institution closes. Hence, no theft.
  *   **Verdict 12 (Death vs. Theft):** "Death" is **Ontologically** false (no biological life ended). "Theft" is **Institutionally** true.
  *   **Verdict 3 & 6 (Harm):** You are using **Phenomenological Reality**. The hurt is real because the neural impact is real, regardless of the trigger's ontology.
  *   **Verdict 10 (Virtual Children):** You are appealing to **Symbolic Reality**. The representation carries weight because of its link to **Ontologically** real protected classes.

  *Diagnosis:* Your view is consistent if you accept that Institutional and Phenomenological realities are sufficient grounds for "real" loss and harm, even without Ontological grounding.
  *Confidence in this Analysis:* High.

  ### F. Diagnosis of Your View

  You described yourself as: *Realist about virtual objects, Irrealist about virtual events, Realist about virtual relationships, Irrealist about virtual persons.*

  This is a **stable-looking contradiction** that resolves into **Functionalism**.
  *   You are not a Realist about objects *simpliciter*; you are a Realist about the *labor records* those objects represent (Verdict 1, 7).
  *   You are not a Realist about relationships *ontologically*; you are a Realist about the *functional impact* of those interactions (Verdict 6).
  *   The contradiction vanishes if you admit you are a **Normative Realist**. You believe the *norms* governing these spaces are real, even if the *substrate* is not.

  *Defensibility:* This is defensible. It aligns with how we treat other institutional goods (e.g., currency, contracts). The only instability lies in **Verdict 10**, where you grant moral status to a representation without a victim. This requires a virtue-ethics supplement to remain consistent.
  *Confidence in Diagnosis:* Medium-High.

  ### Confidence Summary & Least Sure Point

  *   **Principle (Normative Attunement):** High Confidence.
  *   **Clause 1 (Property):** High Confidence.
  *   **Clause 2 (Agential Breach):** High Confidence.
  *   **Clause 3 (Relationality):** Medium-High Confidence.
  *   **Clause 4 (Symbols):** Medium Confidence.
  *   **Casualty Recommendation (Case 10):** High Confidence.
  *   **Casualty Recommendation (Case 6):** Medium Confidence.
  *   **New Verdicts (D):** High Confidence.
  *   **"Real" Analysis (E):** High Confidence.
  *   **View Diagnosis (F):** Medium-High Confidence.

  **The Point of Least Certainty:**
  I am least sure about **Clause 3 (Functional Relationality)** regarding **Verdict 6 (AI Betrayal)**.
  *   *Why:* I claim that a relationship can be "real" enough to warrant "betrayal" without a mind on the other side. A better philosopher might argue that betrayal is a *concept* that logically requires a moral agent. If the AI has no capacity for commitment, it cannot break one. My defense relies on the *user's experience* being the locus of the wrong, but this risks making "betrayal" purely subjective.
  *   *What would change my mind:* A case where an AI simulates love to extract money (a "romance scam" bot). If I judge that as *fraud* (wrong) but the AI companion update as *not betrayal* (just breakage), then my Clause 3 fails. If I must treat them differently, then "functional capacity" is insufficient; "intent" (even simulated intent) matters. If I treat them the same, then "betrayal" loses its specific moral weight. This tension suggests my functionalist account of relationships may be too permissive.
