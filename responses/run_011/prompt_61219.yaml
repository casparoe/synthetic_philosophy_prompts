jointly satisfied, and name the single requirement that eliminates the most candidates among shared-intention accounts, joint-commitment accounts, accounts that treat we-intentions as primitive individual attitudes, and the deflationary view that there is no distinct phenomenon to explain. Skip the scorecard; that is the next section.
