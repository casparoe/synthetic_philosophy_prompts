answer: |-
  ### Specifications for an Account of Collective Action in Institutional Contexts

  To serve a theory of institutional responsibility, an account of "acting together" must distinguish mere aggregate behavior from genuine collective agency, specifically in contexts where organizational structure is thin or emergent. Below are the requirements any adequate theory must meet, classified by their status.

  #### I. The Requirements List

  **1. The Parallel/Joint Distinction**
  *   **Phenomenon:** The account must distinguish between two agents lifting a heavy table together versus two agents lifting separate tables at the same time.
  *   **Motivation:** Without this, responsibility cannot be assigned to the *group* as opposed to the individuals.
  *   **Status:** **Non-negotiable.** A theory that collapses this distinction fails to identify the subject of responsibility.

  **2. Interdependence without Direct Negotiation**
  *   **Phenomenon:** The account must accommodate cases where agents adjust their behavior in real-time based on the actions of others, even without prior agreement or communication channels.
  *   **Motivation:** Institutional settings often rely on emergent coordination (e.g., emergency response, market behaviors) where prior negotiation is impossible.
  *   **Status:** **Non-negotiable** (for this specific purpose). A theory requiring explicit negotiation rules out the very cases institutional responsibility seeks to govern.

  **3. Normative Consequences (The Standing to Rebuke)**
  *   **Phenomenon:** If the collective action fails due to a member's withdrawal, the remaining members must have the standing to claim a wrong was done to them (not merely that a goal was frustrated).
  *   **Motivation:** Responsibility implies obligation. If a member can leave without breach, there is no collective *duty*, only convergent *interest*.
  *   **Status:** **Non-negotiable** (for responsibility). While some action-theories treat this as optional, a theory of *responsibility* cannot.

  **4. Empirical Adequacy (Developmental and Comparative)**
  *   **Phenomenon:** The account must not contradict findings that pre-linguistic children and non-human animals engage in cooperative problem-solving.
  *   **Motivation:** If the cognitive prerequisites for acting together are too high (e.g., complex recursive reasoning), the concept cannot explain the biological or developmental roots of sociality that institutions often leverage.
  *   **Status:** **Non-negotiable.** A theory contradicting established empirical data is falsified.

  **5. Intentional Structure (We-Intention vs. I-Intention)**
  *   **Phenomenon:** The account must specify whether participants intend *that we do X* or merely *that I do my part of X*.
  *   **Motivation:** This determines the locus of the mental state driving the action.
  *   **Status:** **Doctrinal Commitment.** Shared-intention accounts (Searle) demand the former; deflationary accounts (Bratman/Summative) reduce it to the latter. Both can potentially satisfy the Non-negotiables above.

  ---

  #### II. Doctrinal Commitments vs. Non-negotiable Debts

  You asked specifically about mutual belief, meshing subplans, and joint commitment. Here is their classification:

  *   **Mutual Belief / Common Knowledge:** This is a **Doctrinal Commitment** of Shared-Intention accounts (e.g., Bratman, Searle). It is *not* a debt every adequate theory owes. Requiring recursive belief ("I believe that you believe that I intend...") contradicts **Requirement 4 (Empirical Adequacy)**, as infants and animals cooperate without such cognitive architecture. For the courier case, requiring prior mutual belief would falsely exonerate the group.
  *   **Meshing Subplans:** This is a **Doctrinal Commitment** specific to Bratman's Shared Intention account. It is not a general requirement. In loose groups, subplans may not "mesh" in a detailed sense but rather interlock functionally. Insisting on meshing subplans violates **Requirement 2 (Interdependence without Negotiation)**.
  *   **Joint Commitment (with Standing to Rebuke):** The claim that a specific *joint commitment* creates the standing to rebuke is a **Doctrinal Commitment** of Margaret Gilbert's account. However, the *phenomenon* of normative standing (**Requirement 3**) is Non-negotiable for a theory of responsibility. Gilbert provides one mechanism for this, but a theory could potentially ground the obligation in institutional role functions rather than interpersonal commitment. If a theory denies normative standing entirely (treating withdrawal as merely a change of mind), it fails the Non-negotiable requirement for responsibility.

  ---

  #### III. Application to the Oxygen Courier Case

  **The Case:** Eleven couriers, notified by app, no comms, arrive sequentially, lift together, three leave, cylinder dropped.

  **Verdict:**
  1.  **Did they act together?** **Yes.**
  2.  **Was early departure a breach?** **Yes.**

  **Which Requirement Does the Work?**
  *   The verdict that they **acted together** is forced by **Requirement 2 (Interdependence without Direct Negotiation)**. Despite the lack of communication, their actions were functionally interdependent (each adjusted grip/step based on others). A theory requiring prior communication (like strict Gilbertian Joint Commitment or Bratmanian Common Knowledge) would fail here, but such theories are ruled out by the Non-negotiable status of Requirement 2 for *this* institutional context.
  *   The verdict that departure was a **breach** is forced by **Requirement 3 (Normative Consequences)**. Once the interdependent action commenced, the leavers disrupted the collective capacity. If the theory treats this as merely "changing one's mind" (Deflationary view), it fails Requirement 3. To satisfy Responsibility, the account must ground an obligation to sustain the joint effort once undertaken.

  ---

  #### IV. Incompatible Requirements

  I flag the following pair of requirements as cannot be jointly satisfied in their strongest forms:

  **Requirement 3 (Normative Consequences) and Requirement 4 (Empirical Adequacy).**

  *   **The Tension:** If acting together *necessarily* generates normative obligations (Requirement 3), then pre-linguistic children and animals (who cooperate but arguably lack normative concepts of obligation or standing to rebuke) cannot be acting together. If we insist they *are* acting together based on behavioral evidence (Requirement 4), then normative consequences cannot be a necessary condition of joint action.
  *   **Resolution:** For a paper on *institutional responsibility*, you must prioritize Requirement 3. This implies that "primitive" cooperation is a different category than "responsible" collective agency.

  ---

  #### V. The Single Eliminator

  The single requirement that eliminates the most candidates among the four camps (Shared-intention, Joint-commitment, Primitive We-intention, Deflationary) is:

  **Requirement 3: Normative Consequences (The Standing to Rebuke).**

  *   **Deflationary Accounts:** Eliminated. They explicitly deny that joint action creates new obligations beyond individual morality.
  *   **Shared-Intention Accounts (Bratman):** Eliminated. Bratman explicitly argues that shared intention does not *inherently* create obligations; it creates stability, but not necessarily mutual entitlement to rebuke.
  *   **Primitive We-Intention (Searle):** Eliminated/Uncertain. Searle focuses on the psychological mode of the intention, remaining agnostic or silent on whether the *failure* of that intention creates interpersonal obligations.
  *   **Joint-Commitment Accounts (Gilbert):** **Survives.** This is the only camp that builds the normative standing to rebuke into the definition of the phenomenon itself.

  By making Normative Consequences Non-negotiable for a theory of *responsibility*, you effectively filter for Gilbertian-style accounts or institutional-functional accounts, ruling out the purely descriptive or psychological theories.
