prompt: |-
  Write a short story of roughly 1,500 words about a public agency that has adopted Harsanyi's aggregation theorem as its actual decision procedure: every citizen carries a von Neumann–Morgenstern utility function, social value is a weighted sum of them, and the weights are set by officials before anyone learns which citizen they will turn out to be. The agency is dividing a scarce resource that will lengthen some lives and shorten others, and its arithmetic is unimpeachable.

  Let the story turn instead on the procedure's soft spot: individual utilities are determined only up to positive affine transformations, so the choice of zero points and scales — made years earlier by a calibration questionnaire — is quietly doing all the normative work the theorem claims to have eliminated. Give the reader one citizen who objects not that the arithmetic is wrong but that her life is being measured in a unit never built to carry it, and one official who defends the procedure in good faith on the ground that every alternative merely hides the same choice inside somebody's intuitions. End by dramatizing the aggregate's indifference between two distributions with the same sum.

  Show rather than explain, and let the technical content emerge from the case instead of from anyone lecturing about it.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Prompt:**
      *   **Topic:** A public agency using Harsanyi's aggregation theorem as its actual decision procedure.
      *   **Core Mechanics:**
          *   Citizens have von Neumann–Morgenstern (vNM) utility functions.
          *   Social value = weighted sum of individual utilities.
          *   Weights set by officials behind a "veil of ignorance" (before knowing who they will be).
          *   Resource allocation affects life expectancy (lengthens some, shortens others).
          *   The arithmetic is correct/unimpeachable.
      *   **The Conflict/Soft Spot:** vNM utilities are unique only up to positive affine transformations ($u' = au + b$, where $a > 0$). The choice of zero points ($b$) and scales ($a$) was made years ago via a calibration questionnaire. This calibration is doing the hidden normative work.
      *   **Characters:**
          *   One citizen objecting that the unit of measurement doesn't fit her life.
          *   One official defending the procedure in good faith (arguing alternatives just hide the bias elsewhere).
      *   **Ending:** Dramatize the aggregate's indifference between two distributions with the same sum.
      *   **Style:** Show, don't tell. No lecturing. Technical content must emerge from the case.
      *   **Length:** Roughly 1,500 words.

  2.  **Deconstruct the Technical Concept (Harsanyi + vNM):**
      *   *Harsanyi's Utilitarianism:* If individuals satisfy vNM axioms and social preferences satisfy Pareto + Independence, then Social Welfare is a linear combination of individual utilities.
      *   *The Catch:* vNM utility isn't cardinal in an absolute sense; it's interval. You can shift the zero and stretch the scale without changing preferences over lotteries *for that individual*. But when you *sum* them, the scale and zero point matter immensely. If Person A's "0" is death and "100" is heaven, and Person B's "0" is mild discomfort and "100" is ecstasy, summing them is meaningless unless you normalize them.
      *   *The Story's Twist:* The normalization happened via a "calibration questionnaire" years ago. This is the hidden political act disguised as math.

  3.  **Setting the Scene:**
      *   Needs to be bureaucratic but high-stakes. A "Resource Allocation Board."
      *   The resource: "Chronos" or something similar? Let's call it "Vitality Doses" or simply "The Allocation." Let's go with "Dialation Treatments."
      *   Atmosphere: Sterile, quiet, heavy with the weight of numbers.

  4.  **Character Development:**
      *   **The Objector:** Elara. Needs to feel the mismatch between her lived experience and the numbers. She's not mathematically illiterate, just existentially alienated from the metric.
      *   **The Official:** Director Kael. Needs to be reasonable, not villainous. He believes in the system because he sees the alternative as chaos or hidden tyranny.
      *   **The Setting:** The hearing room. The "Calibration Archive."

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the setting and the stakes. The Board is meeting. The resource is life itself. Introduce the "Sum."
      *   **The Procedure:** Show, don't tell, how the calculation works. Screens, numbers, the "Weights." Mention the Veil of Ignorance aspect (weights set beforehand).
      *   **The Conflict:** Elara's case. She is scheduled to lose time so others gain it.
      *   **The Technical Reveal (Subtle):** Elara questions the *units*. Reference the "Questionnaire 74-B." The zero-point issue.
      *   **The Dialogue:** Kael vs. Elara.
          *   Elara: "This zero isn't my zero."
          *   Kael: "If we don't fix the zero, we can't add. If we let you pick, you game it. We picked it blindly."
      *   **The Climax/Resolution:** The decision stands. The math holds.
      *   **The Ending:** Two different distributions yielding the same total social value. The machine doesn't care who suffers, only that the sum is constant.

  6.  **Writing - Focusing on "Show, Don't Tell":**
      *   Instead of explaining affine transformations, have Elara hold up her old questionnaire. "I marked a 5 here. You treated it as 0."
      *   Instead of explaining Harsanyi, show the "Veil Weights" document signed years ago.
      *   Instead of lecturing on indifference curves, show the screen toggling between two scenarios with the same "Total Social Utility" score.

  7.  **Refining the Narrative Arc (Self-Correction during drafting):**
      *   *Check:* Is it too dry? *Fix:* Add sensory details. The hum of the server, the coldness of the table, the physical toll on Elara.
      *   *Check:* Is the math clear enough? *Fix:* Ensure the dialogue about "shifting the baseline" is clear without using jargon like "affine transformation." Use "scale" and "floor."
      *   *Check:* Word count. Need to expand on the atmosphere and the specific details of the allocation to reach ~1,500.
      *   *Check:* The ending. Needs to be poignant. The indifference of the sum.

  8.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Opening:* The room. The screen displaying the "Social Welfare Function."
      *   *Elara's Testimony:* She's losing 5 years. Why? Because her utility curve is flat? No, because her baseline was set too high.
      *   *Kael's Defense:* The "Calibration of Year 10." The need for a common denominator.
      *   *The Twist:* The questionnaire asked about lotteries (vNM style), but the *anchors* were arbitrary.
      *   *Closing:* The algorithm proposes two options. Option A: Elara dies, Stranger lives. Option B: Elara lives, Stranger dies. The score is identical.

  9.  **Polishing:**
      *   Enhance the imagery of the "Veil."
      *   Make sure Kael sounds sincere. He's not a villain; he's a tragic bureaucrat.
      *   Ensure the "affine" concept is clear through the metaphor of temperature or currency. (Decided to use the "thermometer" analogy in dialogue).

  10. **Final Review against constraints:**
      *   ~1,500 words? (Will monitor during writing).
      *   Harsanyi/vNM mechanics accurate? (Yes, focusing on the $au+b$ issue).
      *   Citizen objection & Official defense included? (Yes).
