answer: |-
  The hearing room was soundproofed, not to keep noise out, but to keep the weight of the numbers in. In the center of the table sat the Terminal, its screen glowing with the soft, amber light of the Social Welfare Function. On the wall behind the dais, the Veil Weights were framed: a single sheet of paper signed ten years ago by the founding Directors, before they knew their names, their health, or their station. They had chosen the multipliers then, blind to their own fate.

  Elara sat in the witness chair. Her hands were clasped tightly around a manila folder, the edges worn soft. She looked at the screen. It displayed her name, and next to it, a delta: *-5.4 years*.

  " The arithmetic is not in dispute, Ms. Vane," said Director Kael. He didn't look up from his datapad. He was a man who trusted the sum more than the parts. "The Dilation Treatment is scarce. To extend the cohort's aggregate life by twelve thousand years, the Function requires a subtraction from the lower-quintile utility curves. Yours is the most efficient deduction."

  "Efficient," Elara said. Her voice was thin, raspy from the early onset of the decay the Treatment could halt. "That's the word you use when you cut the bone to feed the muscle."

  "We use the word the Theorem provides," Kael corrected gently. "Harsanyi's aggregation. We maximize the expected utility of the representative citizen behind the Veil. You agreed to the procedure when you registered for the Census."

  "I agreed to the vote. I didn't agree to the ruler." Elara slid the folder across the polished table. It stopped just short of Kael's hand. "Open it. Page four."

  Kael hesitated, then tapped the Terminal. A scan of the document appeared on the main screen. *Calibration Questionnaire 74-B. Date: Ten years prior.*

  "Question 12," Elara said, pointing to the paper. "You asked me to rate my current state of health against a lottery. A 50% chance of perfect health, a 50% chance of immediate death. I marked a 60. I was happy then. I had my work. I had my husband."

  "And that established your vNM utility index," Kael said. "Standard procedure. We need cardinal utility to sum across persons. Preferences alone aren't enough."

  "But you fixed the zero," Elara said. "Look at the footnote. *'Zero point anchored to biological cessation. Scale anchored to maximum theoretical neuro-stimulation.'*"

  Kael sighed, leaning back. The leather of his chair creaked, a human sound in a room of logic. "We had to fix the zero, Elara. If utility is only unique up to positive affine transformations, we can't add them. If your zero is 'sadness' and your neighbor's zero is 'hunger,' the sum is noise. We needed a common thermometer."

  "You built the thermometer in a summer when the mercury was high," Elara said. "You set my zero at death. But for me, death isn't the bottom. Losing him was the bottom. The questionnaire didn't account for grief. It assumed a linear scale of biological function. My utility didn't drop to zero when he died, but the Function treats my life now as if it's barely above the baseline. You're taking five years from me because my scale is compressed. You're measuring my suffering in inches, but the map is in miles."

  Kael rubbed his temples. He had heard this before. Not the specific grief, but the structural complaint. The soft spot in the armor of the Theorem. The math required a scale, but the choice of scale was a political act disguised as a technical necessity.

  "If we allow you to reset your zero point now," Kael said, "everyone will reset their zero point. The prisoner will set his zero to freedom. The addict will set his zero to sobriety. The sum explodes. The Veil Weights become meaningless because the variables they multiply are unbounded."

  "So you froze the calibration," Elara said. "Ten years ago. You decided then what 'nothing' feels like for the rest of our lives."

  "We decided it behind the Veil," Kael insisted, his voice tightening. "We didn't know who would be the grieving widow, or the prisoner, or the addict. We chose the calibration blindly. It is the only fair way. Any other method hides the choice inside someone's intuition. If we let you choose your scale, you become the dictator of your own weight. If we let me choose it now, I am the tyrant. By locking it in the past, behind the Veil, we made the tyranny impersonal."

  "Impersonal," Elara repeated. She looked at the screen. The number *-5.4* pulsed. "It's not impersonal when it's my time. You say the weights were set blindly. I believe you. But the units? The units were set by people who thought 'death' was the worst thing that could happen. They didn't know about the hollow years. You're summing utilities that were calibrated for a different world."

  "The arithmetic is unimpeachable," Kael said, though he looked at the Terminal as if it might offer him a different answer. "The sum of weighted utilities is maximized by this allocation. To change your scale is to change the sum. To change the sum is to violate the Veil mandate."

  "Then the mandate is a cage," Elara said. "You built a machine that adds apples and oranges because you painted them both green ten years ago. And now you tell me the color is the truth."

  Kael stood up. He walked to the screen and tapped a command. "We are not here to debate metaphysics, Ms. Vane. We are here to allocate the Dilation. The resource is finite. The Function must clear."

  "The Function clears," Elara said, standing as well. Her knees trembled. "But it doesn't care."

  "It cares about the Total," Kael said. "It cares about the sum of human experience."

  "It cares about the number," she corrected. "Not the experience."

  Kael turned back to the Terminal. He had to finalize the distribution. He input the command to lock the allocation. The screen flickered. A prompt appeared: *OPTIMIZATION COMPLETE. MULTIPLE SOLUTIONS DETECTED.*

  Kael frowned. He tapped the query.

  Two distribution maps appeared side-by-side.

  **Distribution A:**
  *   Subject: Elara Vane. Delta: -5.4 years.
  *   Subject: Citizen 8940. Delta: +5.4 years.
  *   **Total Social Utility: 4,592,100.00**

  **Distribution B:**
  *   Subject: Elara Vane. Delta: 0.0 years.
  *   Subject: Citizen 8940. Delta: 0.0 years.
  *   Subject: Citizen 2215. Delta: -5.4 years.
  *   Subject: Citizen 7731. Delta: +5.4 years.
  *   **Total Social Utility: 4,592,100.00**

  The room went silent. The hum of the cooling fans seemed to grow louder.

  Kael stared at the numbers. The Theorem was indifferent. It did not see Elara. It did not see the specific tragedy of her grief-compressed scale. It only saw the aggregate. In Distribution A, Elara paid the cost. In Distribution B, a stranger paid the cost. To the Function, the suffering was fungible. The sum was identical. The arithmetic was perfect.

  "See?" Kael said softly, his defense crumbling into something quieter, sadder. "Even now. If I swap you out for another, the value is the same. The system doesn't know the difference. That is why we need the Veil. That is why we need the fixed calibration. Because if the system can't tell the difference, we must be the ones who ensure no one is singled out. But the math... the math just balances."

  Elara looked at the two maps. She saw her name on the left, safe on the right, replaced by a number she didn't know. The machine didn't care who bled, as long as the volume was constant.

  "You say the alternative hides the choice," Elara said, picking up her folder. "But this... this hides the choice in the sum. You think because the number is the same, the justice is the same."

  "I think," Kael said, his hand hovering over the 'Confirm' key, "that if I choose Distribution B to save you, I am privileging your calibration over Citizen 2215's. And I have no metric to justify that. The Veil Weights are blind. The Calibration is fixed. I am just the clerk who turns the crank."

  "Then turn it," Elara said. She turned toward the door. "But don't tell me it's justice. It's just accounting."

  She left the room. The heavy door sealed shut behind her, cutting off the sound of her footsteps.

  Kael stood alone in the amber light. He looked at the two distributions. Both yielded the same Total Social Utility. Both satisfied Harsanyi's conditions. Both adhered to the Veil Weights signed ten years ago.

  He closed his eyes. He thought of the calibration questionnaire. He thought of the moment, years ago, when he had helped draft the footnote anchoring the zero point to biological death. He had thought he was building a neutral tool. He hadn't realized he was building a mold into which all future lives would be poured, regardless of how they fit.

  His finger descended. He selected Distribution A. It was the path of least resistance. It was the one the algorithm listed first. It was the one that maintained the status quo of the queue.

  The screen flashed green. *ALLOCATION CONFIRMED.*

  The Total Social Utility remained: 4,592,100.00.

  Kael sat down. He waited for the next case. The sum was preserved. The arithmetic was unimpeachable. And in the silence of the room, the indifference of the number hung heavier than any verdict.
