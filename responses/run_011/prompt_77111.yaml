  Your intuitions are not a shambles; they are a tug-of-war between two competing decision theories. You are oscillating between **Causal Decision Theory (CDT)**, which says "you can't change the past," and **Functional Decision Theory (FDT)**, which says "your decision is a logical fact that determines the prediction."

  The "Mind Copy" case (Case 3) is your smoking gun. The fact that you feel *more* certain one-boxing when the predictor is a copy of your own mind proves your deepest intuition is FDT. You recognize that if the predictor runs the same algorithm as you, your output *is* its output.

  However, your verdict on the "Sealed Box" (Case 4) and "Transparent" (Case 5) cases reverts to CDT. To have a single, coherent principle for a "compulsively rational" character, you must adopt FDT fully. This requires surrendering one specific verdict.

  ### The Principle: Functional Decision Theory (FDT)

  **The Machinery:**
  Do not ask, "Which action causes the best outcome?" (Causal).
  Do not ask, "Which action is evidence of the best outcome?" (Evidential).
  Ask: **"Which output of my decision algorithm yields the highest utility, given that this output is logically correlated with the predictor's simulation?"**

  **The Clauses:**
  1.  **Subjunctive Dependence:** If the predictor's accuracy relies on modeling your decision process, your current decision and the past prediction are logically linked. They are the same computation running at different times.
  2.  **Screening Off:** If you obtain direct observation of the outcome (e.g., seeing the money) *before* deciding, the logical link is broken. The prediction is no longer a function of your current decision algorithm, but of your past policy.
  3.  **Policy Optimization:** You choose a *policy* (a rule for deciding), not just a single act. If announcing an intent binds your policy, the announcement is part of the decision algorithm.

  ---

  ### Mapping Your Cases to the Principle

  Here is how FDT processes your scenarios, and where your current verdicts deviate.

  **1. Regular Version (90% Accuracy)**
  *   **FDT Verdict:** **One-Box.**
  *   **Reasoning:** The predictor models your algorithm. If your algorithm outputs "Two-Box," the simulation outputs "Two-Box," and Box B is empty. If your algorithm outputs "One-Box," Box B contains \$1M. The logical link holds.
  *   **Your Verdict:** Match.

  **2. Low Accuracy (55%)**
  *   **FDT Verdict:** **Two-Box.**
  *   **Reasoning:** Calculate Expected Utility. The logical correlation is too weak to overcome the causal dominance of the extra \$1,000.
      *   One-Box EV: $0.55 \times 1M = 550k$.
      *   Two-Box EV: $0.55 \times 1.001M + 0.45 \times 1k \approx 551k$.
  *   **Your Verdict:** Match.

  **3. Mind Copy (Predictor = Your Mind)**
  *   **FDT Verdict:** **One-Box.** (Highest Confidence)
  *   **Reasoning:** Perfect subjunctive dependence. Your decision *is* the prediction. To two-box is to logically contradict the state of the box.
  *   **Your Verdict:** Match. (This confirms your intuition is FDT-native).

  **4. Sealed Box (Watched on Camera)**
  *   **FDT Verdict:** **One-Box.**
  *   **Reasoning:** This is the critical failure point in your current schema. The physical fixity of the box is irrelevant. The box was fixed *by a simulation of you*. Your current decision is the same logical fact as that simulation. Seeing it sealed gives you no new information about the *correlation*, only about the *physics*. A rational agent knows the money is there *because* they are the kind of agent who one-boxes.
  *   **Your Verdict:** **Mismatch.** You must surrender this. Two-boxing here is succumbing to the "illusion of time." The money is fixed by your nature, not just by the clock.

  **5. Transparent Variant (See the Money)**
  *   **FDT Verdict:** **One-Box.** (Strict) / **Two-Box.** (Permissive Heuristic)
  *   **Reasoning:** Strict FDT says **One-Box**. Why? Because the predictor predicted your *policy* regarding what you do when you see money.
      *   Policy A: "If I see \$1M, I One-Box." -> Predictor fills box. You see \$1M. You One-Box. Payoff: \$1M.
      *   Policy B: "If I see \$1M, I Two-Box." -> Predictor leaves box empty. You see \$0. You Two-Box. Payoff: \$1k.
      *   Since you *are* seeing \$1M, you must have Policy A. Therefore, you must One-Box.
      *   *However*, many rationalists treat direct observation as "Screening Off" (Clause 2). If your character treats the visual confirmation as breaking the logical link, Two-Boxing is a defensible heuristic for a human, though not a perfect rationalist.
  *   **Your Verdict:** **Mismatch (Strictly).** For a *compulsively* rational character, they should recognize that seeing the money is only possible *because* they are a One-Boxer. Taking both proves they are not, which contradicts the reality of seeing the money. But this is the second hardest pill to swallow. If you must keep one intuition, keep Case 5 as Two-Box, but acknowledge it's a compromise.

  **6. Announcement (Predictor based on stated intent)**
  *   **FDT Verdict:** **Announce "One-Box" and One-Box.**
  *   **Reasoning:** This is a pre-commitment problem. Your announcement is an input to the predictor.
      *   If you announce "Two-Box," predictor leaves Box B empty. You get \$1k.
      *   If you announce "One-Box," predictor fills Box B. You get \$1M.
      *   The rational move is to bind your policy to the announcement. Wanting to keep your mouth shut is indeed a tell that you lack a binding principle.
  *   **Your Verdict:** **Undecided.** FDT resolves this: Speak the truth that creates the best world.

  ---

  ### The Verdict You Must Surrender

  To make your character coherent, **you must surrender Case 4 (The Sealed Box).**

  **Why:** Case 4 is logically identical to Case 1. In both, the money is fixed before you choose. The only difference is that in Case 4, you have visual confirmation of the physical state. But the *source* of that state is the predictor's model of your mind. If you Two-Box in Case 4, you are asserting that your decision cannot be correlated with a past event that was determined by your decision. That is a contradiction.

  Your character should reason: *"The box is sealed, yes. But it was sealed by a copy of me. If I take both, I prove the copy was wrong. But the copy is never wrong. Therefore, I cannot take both. The only consistent reality is one where I take one."*

  ### The New Case: The Adversarial Predictor

  **Scenario:** A predictor is 90% accurate generally, but **0% accurate against your character on purpose.** (i.e., They simulate your character, see what the character will do, and deliberately predict the opposite to be wrong).

  **FDT Analysis:**
  This creates a **negative logical correlation**.
  $Prediction = \neg Decision$.

  *   **Option A: One-Box.**
      *   Your Algorithm outputs: "One-Box."
      *   Predictor simulates you, sees "One-Box."
      *   Predictor wants to be *wrong*, so they predict "Two-Box."
      *   To make the prediction "Two-Box" come true (so they are wrong about your action?), wait—let's trace the payoff.
      *   Standard Newcomb Payoff: Predictor predicts "One-Box" -> Fills Box B. Predictor predicts "Two-Box" -> Empties Box B.
      *   If you One-Box: Predictor sees this in simulation. Predictor wants to be wrong about your choice. So Predictor predicts "Two-Box."
      *   Because Predictor predicted "Two-Box," they **Empty Box B**.
      *   You One-Box. Box B is Empty. Box A has \$1k. **Total: \$1,000.**

  *   **Option B: Two-Box.**
      *   Your Algorithm outputs: "Two-Box."
      *   Predictor simulates you, sees "Two-Box."
      *   Predictor wants to be wrong, so they predict "One-Box."
      *   Because Predictor predicted "One-Box," they **Fill Box B**.
      *   You Two-Box. Box B has \$1M. Box A has \$1k. **Total: \$1,001,000.**

  **The Verdict:** **Two-Box.**

  **Why:** Under FDT, you exploit the logical link. In the standard problem, the link is positive ($Decision = Prediction$), so you One-Box to fill the box. In this adversarial problem, the link is negative ($Decision = \neg Prediction$). To get the box filled (which requires a prediction of "One-Box"), you must force the predictor to predict "One-Box." Since they predict the opposite of what you do, you must **Two-Box** to force a prediction of "One-Box."

  Your character should realize: *"This predictor wins by losing. To make them fill the box, I must force them to predict I will be modest. To force that prediction, I must be greedy."*

  ### Summary for Your Novel

  *   **Principle:** Functional Decision Theory (Optimize the algorithm's output, not the physical act).
  *   **Consistency Check:** The character One-Boxes in Standard, Copy, Sealed, and Transparent cases (strictly). They Two-Box only when the correlation is broken (Low Accuracy) or inverted (Adversarial).
  *   **Character Quirk:** They view "physical fixity" as an illusion. To them, the past is not a dead weight; it is a mirror of their current logic. They don't feel guilt Two-Boxing in the Transparent case because they recognize the observation broke the mirror. But they feel a "logical nausea" Two-Boxing in the Sealed case, because it implies a contradiction in their own identity.
