answer: |-
  Your hypothesis is mathematically isomorphic to a degenerate spectral risk measure under maximal ambiguity, but it fails normatively because the "residue" you identified consists of deontological constraints that cannot be reduced to any agent-centric preference functional.

  ### The Translation

  **Ambiguity Set:** In the Original Position (OP), the parties lack specific knowledge of their society's probability distribution over social positions. In Gilboa–Schmeidler Maxmin Expected Utility (MEU) terms, the ambiguity set $\mathcal{P}$ is the set of all probability measures over the set of social positions compatible with the basic structure. If we assume interchangeability of citizens, $\mathcal{P}$ is the simplex of all probability vectors over $N$ positions. Maximizing over the worst-case prior in this set ($\min_{P \in \mathcal{P}} E_P[\cdot]$) collapses to minimizing over the worst outcome ($\min_{i} x_i$).

  **Loss Random Variable:** The variable is not utility, but an index of **Primary Goods** (rights, liberties, opportunities, income, wealth, social bases of self-respect). For the Difference Principle specifically, this is scalarized to the income/wealth component of the index for the least advantaged representative man. **Flag:** The risk framework assumes the input to the risk measure is a quantity the agent *desires* (utility or wealth); Rawls posits primary goods as an objective metric of advantage independent of subjective preference satisfaction.

  **Weighting Function:** The Difference Principle corresponds to a spectral risk measure $\rho(X) = \int_0^1 F_X^{-1}(p) \phi(p) dp$ where the weighting function $\phi(p)$ is a Dirac delta distribution concentrated at $p=0$ ($\phi(p) = \delta(p)$). This assigns 100% weight to the lowest quantile (the infimum) and 0% to all others.

  **Legitimacy:** This weighting function is a **degenerate limit case**. It satisfies coherence (monotonicity, translation invariance, subadditivity, positive homogeneity) but fails continuity properties required for standard spectral risk measures (where $\phi \in L^1$). It is a coherent risk measure, but it is not "regular" in the sense of being sensitive to changes in the distribution away from the essential infimum. It breaks the "law of large numbers" intuition inherent in most financial risk management; it treats a single catastrophic outcome as fully representative regardless of probability.

  **Rawls's Conditions vs. MEU Axioms:** Rawls's trio (no probability knowledge, guaranteeable outcome, unacceptable alternatives) does **not** map onto the MEU axioms. MEU axioms (Uncertainty Aversion, Comonotonic Independence) describe a stable preference ordering held by an agent across all choices. Rawls's conditions are contextual heuristics for why Maximin is rational *only* behind the Veil. Specifically, Rawls's second condition (caring little for gains above the minimum) implies a specific utility curvature (satiation) that contradicts his insistence that parties want more primary goods rather than less. MEU generates Maxmin structurally; Rawls argues for it pragmatically.

  ### Residue Report

  **1. Lexical Priority of Basic Liberties**
  *   **Translatability:** No expression.
  *   **Analysis:** Risk measures are scalar functionals; they trade off tail risk against expected return. Lexical priority is a lexicographic ordering ($A > B$ regardless of magnitude of $B$'s gain). You cannot encode this into a single risk functional $\rho(X)$ without introducing infinite weights, which breaks the vector space structure required for coherent risk measures.
  *   **Distortion:** To force this into your framework, you would have to model liberties as hard constraints rather than risk factors, which removes them from the optimization problem entirely.

  **2. Fair Equality of Opportunity (FEO)**
  *   **Translatability:** Distorted.
  *   **Analysis:** FEO constrains the *process* generating the distribution of primary goods, not just the final distribution vector. Risk measures evaluate the random variable $X$ (outcomes), not the mechanism producing $X$.
  *   **Distortion:** You could model FEO as a constraint on the support of the ambiguity set, but this misses Rawls's point that unequal opportunities are unjust even if they maximize the minimum income.

  **3. Metric is Primary Goods, Not Welfare**
  *   **Translatability:** Distorted.
  *   **Analysis:** **Flag:** Your framework assumes preferences (utility) are the fundamental normative object. Risk measures minimize loss relative to an agent's valuation. Rawls explicitly rejects welfare (preference satisfaction) as the metric because preferences can be adaptive or unjust.
  *   **Distortion:** Translating primary goods into the "loss variable" smuggles in the assumption that parties value these goods instrumentally for preference satisfaction. Rawls views them as constitutive of free status.

  **4. Publicity Condition**
  *   **Translatability:** No expression.
  *   **Analysis:** Publicity requires the principles of justice to be known and accepted by all as the basis of social cooperation. This is a stability constraint on the *algorithm* itself, not the output.
  *   **Distortion:** Risk measures are computational tools; their opacity or transparency is irrelevant to their validity. In Rawls, a principle that works but cannot be publicly acknowledged is rejected.

  **5. Strains of Commitment**
  *   **Translatability:** Distorted.
  *   **Analysis:** This refers to the psychological and political feasibility of sticking to the agreement under adverse conditions.
  *   **Distortion:** In risk theory, constraints are binding by definition. In Rawls, the parties must assess whether real humans can sustain the chosen principles. This introduces a dynamic consistency check that static risk measures lack.

  **6. Representatives vs. Single Agent**
  *   **Translatability:** No expression.
  *   **Analysis:** Rawls insists the parties are representatives of free and equal citizens, not one person gambling on their own fate.
  *   **Distortion:** Your framework is inherently single-agent decision theory. Modeling the OP as a single agent maximizing a risk measure collapses the distinctness of persons into a single utility function, which Rawls explicitly forbids (the "separateness of persons" objection to utilitarianism).

  **7. Justification vs. Prudence**
  *   **Translatability:** No expression.
  *   **Analysis:** Rawls uses the OP as a device of representation to model fairness, not as a real choice situation to maximize prudence.
  *   **Distortion:** **Flag:** Your framework assumes the goal is optimal choice (prudence). Rawls assumes the goal is valid justification (rightness). Translating justification into optimization category-errors the entire project.

  ### Verdict

  The residue points to the conclusion that **your vocabulary is genuinely missing a piece**: specifically, a constraint that isn't reducible to an agent's attitudes toward outcomes. The risk framework is consequentialist and agent-relative; Rawls's theory is deontological and relational. The "residue" (lexical priority, publicity, separateness of persons) is not noise; it is the normative core that prevents the theory from collapsing into a optimization problem.

  **Harsanyi's Complaint:**
  Harsanyi argues that OP + Rationality = Average Utilitarianism.
  *   **Does it land?** It lands only if you accept Harsanyi's premise that rationality under ignorance requires the Principle of Insufficient Reason (assigning equal probabilities to all positions).
  *   **Does it slide off?** It slides off if you accept Rawls's premise that the Veil implies *deep ambiguity* (no probabilistic knowledge), not risk. Under MEU (ambiguity), Rawls's Maximin is mathematically consistent.
  *   **Why:** However, the translation reveals Harsanyi misses the deeper point: Rawls isn't solving a decision problem. Even if Maximin is the rational choice under ambiguity, Rawls argues the principles are justified because they model fairness, not because they are the prudent gamble. Harsanyi treats the OP as a gambling scenario; Rawls treats it as a modeling device for equality. Once you translate the OP into a risk measure, you have already conceded Harsanyi's framing that this is about individual rational choice, thereby validating the very utilitarianism Rawls seeks to reject.
