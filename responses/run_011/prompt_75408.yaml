answer: |-
  The citizens' assembly is not built on a single coherent theory of legitimacy. It is a hybrid device that stitches together three distinct rationales, each of which explains part of the design but fails to account for the whole. The practice assumes that legitimacy is generated by a specific sequence: purification (random selection), education (expert testimony), and distillation (deliberation). Below is the reconstruction of the implicit political theory, broken down by rationale, coherence tensions, and counterfactual variations.

  ### I. Three Candidate Rationales

  #### 1. Descriptive Representation (The Microcosm)
  **Core Claim:** The body is legitimate because it is a statistical mirror of the populace. It possesses the same interests, experiences, and biases as the whole, making its will indistinguishable from the general will.

  *   **Strictly Requires:**
      *   **Random Selection (Sortition):** To ensure every citizen has an equal probability of inclusion.
      *   **Stratification Quotas:** To correct for statistical variance and ensure minorities are not excluded by chance.
      *   **Anonymity:** To prevent members from becoming distinct political actors separate from the group they mirror.
  *   **Merely Fits:**
      *   **Deliberation:** A mirror could simply be polled; talking is not required for representation.
      *   **Stipends:** These facilitate participation but are not strictly necessary for the *concept* of mirroring, only for making it feasible.
  *   **None Explains:**
      *   **The Volunteer Bottleneck:** The pool is drawn from those who accept an invitation, not the whole population. This systematically excludes the disengaged, the distrustful, and the overworked, breaking the statistical mirror.
      *   **The Irish Anecdote:** If the goal were purely descriptive outcomes, replacing non-random recruits who behaved normally would be unnecessary. The repair of randomness suggests a ritualistic or procedural value beyond statistical accuracy.

  #### 2. Epistemic Diversity (The Wisdom of Crowds)
  **Core Claim:** The body is legitimate because cognitive diversity among non-experts, when combined with information, produces superior solutions to those generated by homogenous elites or partisans.

  *   **Strictly Requires:**
      *   **Facilitated Deliberation:** To aggregate information and challenge assumptions.
      *   **Access to Experts:** To raise the baseline knowledge of the group.
      *   **Time (Weekends):** To allow for learning and preference transformation.
  *   **Merely Fits:**
      *   **Random Selection:** One could select for cognitive diversity or relevant life experience without random draws.
      *   **Quotas:** Demographic diversity is a proxy for cognitive diversity, but an imperfect one.
  *   **None Explains:**
      *   **Advisory Status:** If the group finds better answers, their output should logically be binding, or at least carry greater weight than a legislature's.
      *   **Dissolution:** If the mechanism produces wisdom, it should be institutionalized, not discarded after one task.
      *   **Witness Selection:** The steering board controls the information input. If the goal is truth-seeking, the assembly should have subpoena power or control over the witness list.

  #### 3. Independence from Capture (The Uncorrupted Will)
  **Core Claim:** The body is legitimate because it is immune to the structural corruptions of the electoral system: parties, donors, lobbyists, and re-election incentives.

  *   **Strictly Requires:**
      *   **No Re-selection:** Members cannot curry favor for future office.
      *   **Anonymity:** Members cannot be individually lobbied or threatened.
      *   **Random Selection:** Prevents campaigning and party nomination.
  *   **Merely Fits:**
      *   **Quotas:** Independence does not require demographic mirroring, only insulation from interest groups.
      *   **Deliberation:** One could be independent without deliberating (e.g., a secret ballot).
  *   **None Explains:**
      *   **Government Control of Agenda:** The sponsor poses the question and controls the response. The assembly is independent of parties but dependent on the executive/legislature that created it.
      *   **Stipends:** While preventing economic exclusion, payment creates a dependency on the state, distinct from the independence from *private* capture.

  ### II. Assessment of Coherence

  The design contains structural tensions that the implicit theory glosses over.

  **1. Tokens vs. Agents**
  The quotas treat members as stand-ins for demographic groups (women, youth, regions). However, the deliberation treats them as autonomous rational agents who are expected to change their minds based on argument, not group interest. The design assumes that a person's demographic identity provides the *perspective*, but their individual reason provides the *judgment*. This is unstable: if a member votes against the apparent interest of their demographic quota, are they failing as a representative or succeeding as a deliberator? The practice privileges the latter, rendering the quotas largely symbolic.

  **2. The Sovereignty Gap**
  The assembly is a microcosm, yet its output is submitted to the macrocosm (via referendum or legislative vote). If the assembly truly represents the people, its decision should be final. If the people must vote again, the assembly is merely a filtering mechanism. The implicit theory here is that the assembly represents the people *thinking*, while the referendum represents the people *deciding*. This distinguishes between reasoned will and raw will, but it creates a legitimacy deficit: why is the reasoned will of the few advisory, while the raw will of the many binding?

  **3. Randomness vs. Control**
  Randomness governs the *members*, but not the *frame*. The government sets the question, the steering board selects the witnesses, and the government decides the response. This creates a "constituent power" imbalance. The assembly has the power of recommendation, but the sponsor retains the power of constitution. The implicit theory assumes that a random body cannot be trusted with the agenda, only with the answer. This contradicts the claim that they are a mirror of the sovereign people; a sovereign people sets its own agenda.

  **4. Contrast with Judiciary and Legislature**
  States insist judges be meritocratic and binding because they interpret law. They insist legislators be elected and binding because they allocate value. The citizens' assembly is random and advisory. This places it in a constitutional limbo. It is not a court (no merit), not a legislature (no election), and not a poll (too expensive). Its implicit function is that of a **safety valve**: it absorbs political heat on toxic issues without transferring sovereign power. It legitimizes difficult decisions by showing they were vetted by "people like us," without actually removing the risk from the elected officials who must enact them.

  ### III. Counterfactual Designs

  If the presuppositions of legitimacy were swapped, the design would change radically.

  **1. If Legitimacy Rested on Epistemic Performance**
  *   **Selection:** Members would be selected for cognitive diversity, relevant experience, or demonstrated ability to understand complex trade-offs, rather than demographic quotas.
  *   **Process:** There would be testing or assessment of comprehension before voting. The focus would be on the quality of the argument, not the fairness of the procedure.
  *   **Outcome:** Recommendations would be binding if they met specific criteria (e.g., supermajority, consistency with expert consensus), regardless of public opinion.
  *   **Duration:** The body would be permanent or long-term to build institutional memory and expertise.

  **2. If the Body Had Decision-Making Power**
  *   **Accountability:** Mechanisms for recall or review would be necessary. An unaccountable body with binding power is a technocratic oligarchy, however random.
  *   **Transparency:** Anonymity would likely be removed so the public could judge who voted how.
  *   **Agenda Control:** The body would need the power to self-convene or set its own agenda, otherwise it remains a tool of the sponsor.
  *   **Integration:** It would need a defined place in the constitution, likely as a second chamber or a veto player, rather than an ad-hoc advisory committee.

  ### IV. Underdetermination and Foreclosure

  **Underdetermination**
  The current design is underdetermined because it serves rival masters equally well.
  *   **Education vs. Representation:** The design works both as a school for citizens (epistemic) and a sample of the public (descriptive). Sponsors can claim it is the former when criticized for lack of expertise, and the latter when criticized for lack of elections.
  *   **Consultation vs. Delegation:** The advisory status allows the government to treat the output as a mandate when convenient and a suggestion when inconvenient. The design does not force a decision on whether the assembly speaks *for* the people or *to* the government.

  **Foreclosure**
  The design quietly forecloses views its sponsors would not endorse.
  *   **Partisan Legitimacy:** By excluding parties from the selection and process, the design assumes parties are inherently corrupting. It forecloses the view that parties are necessary vehicles for aggregating interests and that deliberation without them is naive.
  *   **Permanent Citizen Power:** By dissolving the body, the design forecloses the idea of a permanent sortition chamber (a House of Lots). It assumes citizens are only capable of short bursts of virtue before returning to private life.
  *   **Binding Authority without Elections:** The design accepts that random selection cannot confer binding authority. It forecloses the radical democratic view that sortition is *more* legitimate than elections, settling instead for a hybrid where elections retain the final veto.

  ### Summary of the Implicit Theory

  The citizens' assembly presupposes a **trusteeship of experience**. It assumes that ordinary citizens, if purified of partisan incentives (randomness), protected from economic hardship (stipends), and guided by neutral expertise (steering board), will converge on solutions that are acceptable to the whole. However, it does not trust them enough to give them the keys to the state.

  Legitimacy is derived not from the *authority* of the members, but from the *integrity of the process*. This is why the Irish polling firm scandal mattered: the substance was unaffected, but the ritual of randomness was violated. The assembly is a legitimacy-generating machine for the existing government. It allows the state to say, "We did not decide this alone; the people, in their most reflective mode, advised us." It solves the problem of political risk without solving the problem of political power.
