prompt: |-
  I prepare briefing material on democratic innovation for a parliamentary committee, and I keep being asked to explain why anyone thinks a body of randomly chosen strangers deserves a hearing. I would rather understand what the practice itself already assumes. Please reconstruct the implicit political theory of the citizens' assembly, as it is actually run.

  Here is the device, described as concretely as I can. A legislature or head of government poses a question — constitutional reform, climate policy, an issue too hot for the parties. Invitations go out by mail or telephone to tens of thousands of residents; a few percent accept. From those who accept, somewhere between sixty and one hundred and fifty people are drawn at random, subject to quotas so that the final panel mirrors the population on sex, age, region, education and sometimes social class. Members meet over a run of weekends, are paid expenses or a stipend, receive childcare and travel, and are not individually named in press coverage. They hear from experts and stakeholders selected by an independent steering board, then deliberate at facilitated small tables, then vote in plenary on recommendations. The output is advisory: the government undertakes to respond publicly to each proposal, accepting, amending, or setting it aside, and may put the package to a referendum of the whole electorate. The body then dissolves; there is no re-selection, no recall, no accountability afterwards. Real instances include the Irish assembly that considered abortion, the French convention on climate, and a small German-speaking region of Belgium where a standing council of randomly chosen residents now sets the agenda for further assemblies.

  One detail from the Irish case has stuck with me. The draw was carried out under contract by a polling firm; a substantial number of the original members withdrew before the first working weekend and were replaced; and when it emerged that several replacements had been recruited through the acquaintances of an employee of the firm rather than at random, they were removed. Nobody suggested that the substance of the deliberation had been affected. The randomness itself was treated as something that had to be repaired.

  So: what view of political legitimacy does this apparatus presuppose? Distinguish at least three candidate rationales — that the panel is legitimate because it descriptively mirrors the population, that it is legitimate because cognitive diversity among non-experts produces better answers than expertise alone, and that it is legitimate because it is immune to parties, donors and re-election — and tell me which features of the design each rationale strictly requires, which it merely happens to fit, and which features none of them explains. Then assess coherence. The quotas treat members as standing for groups, while the anonymity, the facilitated discussion and the invitation to change one's mind treat them as individuals answerable to no one. The refusal bottleneck means the panel mirrors only those willing to surrender several weekends. Randomness governs the composition of the body but not the question, the witness list, the facilitation, or the government's response — all of which remain with the sponsor. If the microcosm's judgment is genuinely representative, why submit it to a vote of the macrocosm; and if the macrocosm's vote is what decides, why convene the microcosm at all? And how does the practice square with the same states' insistence that judges be appointed meritocratically and that anything with binding force be traceable to an election?

  Finally, tell me what would have to change if the presupposition were swapped: what the assembly would look like if legitimacy rested on epistemic performance rather than resemblance, and what it would look like if the body were given decision-making power rather than influence. Mark clearly where the practice is underdetermined — where several rival theories license the same design — and where it quietly forecloses a view its sponsors would not endorse. Do not give me a bibliography, a reading list, or a survey of who has argued what; use technical vocabulary only where it saves time, and no quotation marks unless you are certain of the wording.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Reconstruct the implicit political theory of the citizens' assembly (CA) based on its actual practice/design.
      *   **Context:** The user prepares briefing material for a parliamentary committee and is tired of justifying "random strangers." They want to understand the *internal logic* of the practice itself.
      *   **Specific Requirements:**
          *   Distinguish at least three candidate rationales (Descriptive Representation, Epistemic/Cognitive Diversity, Independence from Capture).
          *   For each rationale, identify: strictly required features, coincidental features, and unexplained features.
          *   Assess coherence (tensions between quotas vs. individual deliberation, refusal bottleneck, control of agenda/witnesses/response, microcosm vs. macrocosm vote, contrast with meritocratic judiciary/electoral accountability).
          *   Counterfactuals: What changes if legitimacy rests on *epistemic performance*? What changes if the body has *decision-making power*?
          *   Identify underdetermination (where rival theories license the same design) and foreclosure (where design rules out views sponsors wouldn't endorse).
          *   **Constraints:** No bibliography/reading list, no survey of authors, technical vocabulary only where efficient, no uncertain quotation marks.

  2.  **Deconstruct the Device (The Citizens' Assembly):**
      *   *Input:* Question from legislature/executive.
      *   *Selection:* Random sortition from volunteers, stratified by quotas (descriptive representation).
      *   *Process:* Paid, facilitated, expert testimony (steering board selected), small group deliberation, plenary vote.
      *   *Output:* Advisory recommendations.
      *   *Follow-up:* Government response (accept/amend/reject), possible referendum.
      *   *Termination:* Dissolves, no recall/re-selection.
      *   *Key Anecdote:* Irish case – randomness treated as sacred even if substance unaffected.

  3.  **Develop the Three Candidate Rationales:**

      *   **Rationale 1: Descriptive Representation (The Microcosm)**
          *   *Core Idea:* The group *is* the people in miniature. Legitimacy comes from resembling the demographic whole.
          *   *Required Features:* Random selection (sortition), stratification quotas (age, sex, region, etc.), large enough N to mirror stats.
          *   *Coincidental:* Deliberation (could just survey), anonymity (could be public representatives), facilitation.
          *   *Unexplained:* Why deliberation? Why not just a poll? Why the specific quotas (class is often weak)? Why the volunteer bottleneck?

      *   **Rationale 2: Epistemic Diversity (The Wisdom of Crowds/Deliberation)**
          *   *Core Idea:* Diverse non-experts + information + discussion = better solutions than elites or homogenous groups.
          *   *Required Features:* Facilitated deliberation, access to experts, time to learn, small group interaction, protection from party discipline (to allow mind-changing).
          *   *Coincidental:* Random selection (could select for diversity without randomness), quotas (could select for cognitive diversity specifically), anonymity.
          *   *Unexplained:* Why strict demographic quotas rather than cognitive tests? Why advisory only? Why dissolve after one task?

      *   **Rationale 3: Independence from Capture (The Uncorrupted Will)**
          *   *Core Idea:* Legitimacy comes from being free from parties, donors, and re-election pressures.
          *   *Required Features:* Random selection (can't campaign), no re-selection (can't curry favor), anonymity (can't be lobbied individually), stipend (reduces economic coercion).
          *   *Coincidental:* Quotas (could be random without quotas), deliberation style.
          *   *Unexplained:* Why government controls the agenda/witnesses? Why advisory status (still dependent on gov)?

  4.  **Assess Coherence (The Tensions):**
      *   *Quotas vs. Individuality:* Quotas treat members as tokens of groups; deliberation treats them as autonomous reasoners.
      *   *The Refusal Bottleneck:* The "random" sample is actually "random from volunteers." This biases towards the civically engaged/available.
      *   *Control of the Frame:* Randomness applies only to *members*, not the question, witnesses, or response. The state holds the "constituent power."
      *   *Microcosm vs. Macrocosm:* If the CA represents the people, why the referendum? If the people decide via referendum, why the CA? (The CA is often a filter or a cover).
      *   *Judicial/Electoral Contrast:* Judges = merit/binding. CA = random/advisory. Elections = accountable/binding. CA = unaccountable/advisory. This suggests CA is a *safety valve*, not a sovereign body.

  5.  **Counterfactuals (Swapping Presuppositions):**
      *   *If Epistemic Performance:* Less focus on demographics, more on cognitive diversity or track record. Testing for comprehension. Longer duration. Binding outcomes if they solve the problem "better."
      *   *If Decision-Making Power:* Needs accountability mechanisms (recall, elections). Needs stricter rules on evidence. Needs constitutional integration (not ad-hoc).

  6.  **Underdetermination and Foreclosure:**
      *   *Underdetermination:* The current design fits both "representative sample" and "deliberative poll" theories. It fits both "trust the people" and "educate the people."
      *   *Foreclosure:* The design forecloses *partisan* legitimacy (no parties allowed). It forecloses *permanent* citizen power (dissolves after). It forecloses *binding* authority without electoral ratification.

  7.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Analytical, precise, slightly detached (matching the user's professional context).
      *   *Vocabulary:* Use terms like "sortition," "descriptive representation," "epistemic," "constituent power," but define implicitly through context.
      *   *Structure:*
          1.  Introduction: The implicit theory is a hybrid, not a pure type.
          2.  The Three Rationales (Table or structured list for clarity on Required/Coincidental/Unexplained).
          3.  Coherence Assessment (The Tensions).
          4.  Counterfactual Designs (Epistemic vs. Decision Power).
          5.  Underdetermination and Foreclosure.

      *(Self-Correction during drafting)*: Make sure I address the Irish anecdote about randomness. It highlights that the *procedure* of selection carries symbolic weight independent of the *outcome*. This supports the "Independence/Clean Hands" rationale over pure epistemic utility.
      *(Refining the "Refusal Bottleneck")*: This is crucial. It undermines the "Descriptive" claim. I need to highlight that the theory assumes volunteers are a neutral substrate, which they aren't.
      *(Refining the "Micro/Macro" tension)*: The CA is often a *pre-legislative* filter. The theory isn't that CA = People, but CA = People *thinking*. The referendum = People *deciding*.

  8.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   No uncertain quotes? Check.
      *   Technical vocab only where saving time? Check.
      *   Address all specific questions (3 rationales, features, coherence, counterfactuals, underdetermination)? Check.

  9.  **Final Polish:** Ensure the distinction between "strictly requires," "merely fits," and "none explains" is sharp for each rationale. (I will structure this clearly). Ensure the conclusion ties back to the "implicit theory" request.

  *(Mental Note on the Irish Anecdote)*: The fact that they replaced non-random recruits even if substance wasn't affected proves that *procedural purity* is a source of legitimacy in itself, distinct from outcome quality. This aligns with the "Independence" rationale.

  *(Mental Note on Judges vs. CA)*: Judges are meritocratic and binding. CA is random and advisory. This implies CA is not a court of reason, but a court of *experience*. It complements the technocratic/electoral system rather than replacing it.

