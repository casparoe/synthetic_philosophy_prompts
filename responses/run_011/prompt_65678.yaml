      *   *Premise 3 (Math):* Mathematically correct for cardinals, but morally irrelevant. We care about *marginal* change, not absolute total.
      *   *Premise 5 (Comparison):* **This is the weak link.** "One world is better than another *only if* its total value is greater." This assumes we must compare *totals*. If totals are undefined or identical, we can still compare *differences*.
