answer: |-
  ### Translation

  Szasz's claim translates most faithfully as: the construct is a normative placeholder wearing a statistical costume. In IRT terms, you can estimate $\theta$ and fit Item Response Functions to symptom endorsements, but Szasz argues the latent trait lacks causal cohesion. The polythetic diagnostic sets violate local independence; symptoms correlate not because they share a common biological cause ($\theta$), but because clinicians group them via convention. Without a biological gold standard, construct validity relies entirely on internal coherence and predictive utility, which Szasz dismisses as circular. You are measuring a reified label, not a disease entity. Differential Item Functioning (DIF) is endemic because the "symptoms" function differently depending on whether the context is medical or social, yet measurement invariance is assumed to justify the medical label. The math works, but the ontology fails. The latent variable exists statistically as a summary of covariance, but Szasz denies it exists ontologically as a disease mechanism. Therefore, the validity argument collapses not on reliability, but on the interpretation of score meaning. The scale measures deviation from social norms, not presence of pathology. Your validity argument assumes the network hangs together; Szasz argues the network is held together by linguistic fiat, not biological gravity. The latent trait is merely a convenient summary of behavioral deviations, mistakenly imbued with causal power. When you claim validity, you are claiming the map matches the territory; Szasz argues there is no territory, only the map. In measurement invariance testing, you assume the construct is the same across groups; Szasz argues the construct itself shifts meaning across contexts, making invariance testing a ritual of confirmation rather than discovery. The IRF parameters are stable, but what they index is unstable. You are calibrating a ruler against itself.

  ### Residue

  Your guess is correct but incomplete. The cleanest translations are the epistemic critiques: the absence of a gold standard and the circularity of construct validity arguments. These map directly to validation theory. The subject changes occur when Szasz discusses "problems in living." Psychometrics translates this as environmental covariates or contextual effects, stripping the phenomenological weight. However, the core residue—responsibility, excuses, rights—has no expression in measurement theory. Psychometrics is descriptive; Szasz is prescriptive. You cannot model moral agency as a latent trait, nor can you quantify the violation of liberty inherent in involuntary commitment. This isn't just leftover noise; it's the engine of his argument. Measurement theory assumes the construct is worthy of measurement. Szasz challenges the ethics of the measurement act itself. The residue shows that psychometrics treats the existence of the construct as an empirical question, whereas Szasz treats it as a category error with moral consequences. The framework cannot capture the harm of reification because it treats reification as a necessary step in validation. You measure the shadow and call it the object. The rights issue isn't statistical residue; it is the boundary condition your model ignores. When Szasz speaks of excuses, he refers to the removal of agency. In your framework, scores predict behavior, but they do not exculpate. The statistical prediction of behavior is treated as neutral data, whereas Szasz sees it as a tool for social control. This gap cannot be bridged by adding covariates.

  ### My verdict

  The residue shows your framework is smuggling in a normative decision it gets to treat as empirical. Psychometrics assumes that if a model fits, the construct is real enough to act upon. By focusing on fit indices and invariance, you bypass the ontological claim that there is a disease to be found. Szasz isn't confused about statistics; he is objecting to the reification of the latent variable as a medical entity. Your field treats the decision to label behavior as "illness" as a technical validation step, rather than a moral categorization. When you establish measurement invariance, you stabilize the category, thereby enforcing the medical model regardless of biological truth. Szasz's critique exposes that your validity argument rests on a normative commitment to medicalization, not just empirical evidence. You are not just measuring; you are legitimizing.
