answer: |-
  There is no single, canonical proper noun for this specific pattern in the literature (e.g., there is no "The [Name] Problem" equivalent to "The Gettier Problem" that captures precisely this stalemate). However, your observation sits at the intersection of three well-discussed concepts. I will outline the closest existing concepts, explain where they fall short of your specific description, and then offer a name and definition that captures the phenomenon exactly as you have isolated it.

  ### 1. The Closest Existing Concepts

  **A. The Closeness Problem (Frances Kamm, Philip Quinn)**
  *   **The Concept:** This is the standard objection to the Doctrine of Double Effect (DDE). It argues that in many cases, the "intended means" and the "foreseen side effect" are so causally or conceptually close that distinguishing them is arbitrary.
  *   **Where it Fits:** It addresses your morphine case directly (is respiratory depression the means of pain relief or a side effect?).
  *   **Where it Falls Short:** The Closeness Problem focuses on the *metaphysical or causal proximity* of the effects. Your observation is more linguistic and epistemic: you are highlighting that the *descriptions themselves* are equally literally true, and the disagreement stems from the *selection* of the description, not just the causal fuzziness. The Closeness Problem assumes there is a hard fact about intention that is hard to find; you are suggesting the "fact" is constituted by the description chosen.

  **B. Act Individuation (G.E.M. Anscombe, Donald Davidson)**
  *   **The Concept:** This is the metaphysical debate about how we count actions. Is "moving a finger," "pulling a trigger," and "killing a man" one action or three? Anscombe argues actions are individuated by the description under which they are intended.
  *   **Where it Fits:** It grounds your claim that multiple descriptions can apply to the same physical event.
  *   **Where it Falls Short:** Act Individuation is a theory of *what an action is*, not a critique of *moral verdict stability*. It does not specifically name the pattern where competing individuations lead to opposite moral verdicts and circular justifications. It provides the machinery, but not the name for the breakdown you are observing.

  **C. The Description Objection (General DDE Critique)**
  *   **The Concept:** Critics argue DDE is vulnerable because any action can be redescribed to make a bad effect look like a side effect (e.g., "I am exercising my trigger finger while foreseeing death").
  *   **Where it Fits:** It captures the vulnerability of DDE to linguistic framing.
  *   **Where it Falls Short:** This is usually presented as a *reductio ad absurdum* (showing DDE allows anything). Your observation is more nuanced: you are describing a *stalemate between competent judges* where both descriptions are *plausible and accurate*, not just one being a gerrymandered excuse. You are isolating the *pedagogical and diagnostic pattern* of the disagreement, not just the logical vulnerability.

  ### 2. The Proposed Name

  Since no existing term captures the specific dynamic of **equally accurate descriptions yielding opposite verdicts resulting in epistemic stalemate**, I propose we call this:

  **The Problem of Descriptive Underdetermination**

  ### 3. Definition

  **The Problem of Descriptive Underdetermination** occurs when:
  1.  **Ontological Identity:** A single course of conduct admits two or more distinct descriptions that are equally consistent with the physical facts, causal chain, and agent's mental states.
  2.  **Verdict Sensitivity:** These descriptions map onto mutually exclusive moral categories within a normative framework (e.g., "Intended Means" vs. "Foreseen Side Effect").
  3.  **Epistemic Circularity:** There is no neutral, pre-moral criterion to select the "correct" description; judges select the description that yields their pre-theoretical moral verdict, justifying the choice by claiming it "best captures" the act.

  ### 4. Application to Your Illustrations

  **Clearly Covered Cases:**
  *   **The Trolley Switch:**
      *   *Description A:* "Redirecting threat away from five." (Verdict: Permissible Side Effect).
      *   *Description B:* "Using one's body to stop threat." (Verdict: Impermissible Means).
      *   *Fit:* Both are physically true. The switch *does* redirect away from five, and the one *does* stop the trolley. The selection of A or B determines the DDE verdict, and proponents of each verdict insist their description is the "real" one without a neutral metric.
  *   **Palliative Morphine:**
      *   *Description A:* "Titration for analgesia." (Verdict: Permissible).
      *   *Description B:* "Induction of respiratory depression." (Verdict: Impermissible, if depression is the means).
      *   *Fit:* As you noted, if relief is physiologically dependent on depression, the distinction collapses into descriptive preference.

  **The Edge Case:**
  *   **Separation of Conjoined Twins (where one must die):**
      *   *Scenario:* Surgeons separate twins sharing a heart; Twin A survives, Twin B dies.
      *   *Description A:* "Separating shared tissue." (Death is a foreseen consequence of separation).
      *   *Description B:* "Dividing the heart." (Death is the means of saving A).
      *   *Why it is an Edge Case:* This sits at the boundary because the *physical topology* of the case makes Description B slightly more salient than in the Trolley case. In the Trolley case, the one is merely *on* the track; in the Twins case, the one is *part of* the obstacle. A judge might argue Description B is *more* accurate here, breaking the "equally accurate" condition slightly. It is an edge case for Descriptive Underdetermination because the physical facts begin to exert pressure on the description, whereas in the Trolley case, the physics are neutral between the two descriptions.

  **The Outside Case:**
  *   **Terror Bombing:**
      *   *Scenario:* Bombing a civilian center specifically to demoralize the enemy population.
      *   *Description A:* "Demoralizing the enemy." (Verdict: Impermissible Means).
      *   *Description B:* "Destroying buildings while foreseeing death." (Verdict: Attempted Permissible Side Effect).
      *   *Why it is Outside:* Here, the condition of **Ontological Identity** fails. Description B is *not* equally accurate. The causal mechanism of demoralization *requires* the death of the civilians; the death is not a side effect of destroying buildings, it is the method of achieving the goal. A competent judge cannot select Description B without violating the causal facts. Descriptive Underdetermination requires that *both* descriptions be literally true; in Terror Bombing, the "side effect" description is causally false.

  ### Summary for Teaching
  When you encounter this pattern in class, you can tell your students they are experiencing **The Problem of Descriptive Underdetermination**. It is not merely that intention is hard to read (Closeness Problem), nor that actions have many names (Act Individuation). It is that the moral framework (DDE) relies on a distinction that the physical world does not always support, forcing the moral agent to *legislate* the description rather than *discover* it. This explains the circularity: they are not arguing about the facts; they are arguing about which linguistic frame gets to govern the facts.
