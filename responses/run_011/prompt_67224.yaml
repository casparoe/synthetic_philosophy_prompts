  To the buyer's eye, the glaze looks **New**.
  The shape is set, the curve is **Fixed**.
  It counts as distinct, it counts as **One**.

  But break it down to grain, it's not **One**.
  Touch the molecular grid, it's not **Hard**.
  The wheel stopped spinning, yet nothing is **Fixed**.
  Scan for cracks, is it truly **Whole**?
  The clay was dug last season, not **New**.
  Fill it with water, it is not **Empty**.

  It stands **Empty** of water, full of air.
  It counts as **One**, yet scattered into sand.
  It emerges **New**, though dug from ancient earth.
  It feels **Hard**, until the acid bites.
  It sits **Fixed**, while shadows wheel around.
  It remains **Whole**, unless the season breaks.

  Call it **Whole** until the hammer falls.
  Call it **New** until the dust settles.
  Call it **Empty** until the monsoon comes.
  Call it **One** until the shards scatter.
  Call it **Hard** until the kiln reopens.
  Call it **Fixed** until the shopper lifts.

  Time makes nothing **Fixed**.
  Use makes nothing **Whole**.
  Heat makes nothing **Hard**.
  Fill it, nothing **Empty**.
  Age it, nothing **New**.
  Crush it, nothing **One**.

  So the glaze is **New** only for a day.
  So the position is **Fixed** only for a verse.
  So the object is **One** only for a glance.
  So the vessel is **Whole** only for a use.
  So the inside is **Empty** only for a purpose.
  So the touch is **Hard** only for a skin.

  No verse stays **Whole**, nor pattern stays **Fixed**;
  It holds the **New** seventh mode **Empty** of slot.
  For ending lines is **Hard**, and pot is **One**.

  ***

  **Note on the Philosophical Turn**

  **Stance on Self-Application:**
  The poem argues that the doctrine *must* apply to itself to remain coherent. If *anekantavada* claimed exemption from its own rule (i.e., "All truths are conditional *except this one*"), it would collapse into the very dogmatism (*ekantavada*) it seeks to avoid. The poem enacts this by applying the conditionality to its own structure: Stanza 6 ("So the position is **Fixed** only for a verse") and the Envoi ("No verse stays **Whole**") explicitly submit the poem's own claims to the same rotational limitation as the pot. This is not a "shrug" or an excuse to never be wrong; it is a claim that coherence *requires* self-inclusion. A Jain logician (following Mallavadin's defense against the self-stultification objection) would defend this by arguing that the proposition "all propositions are conditional" is itself a *syad*-statement (conditionally true), functioning as a pragmatic tool (*upaya*) rather than a metaphysical absolute. It avoids infinite regress because it stops at practical utility, not ontological foundation.

  **Liberties Bent:**
  1.  **Compression of Predicates:** The seven-fold predication (*saptabhangi*) is compressed into six end-words plus the envoi's "seventh mode." Technically, the seventh mode (*avaktavya*) is "inexpressible," but here it is treated as the *simultaneity* that sequential language (line endings) cannot capture. This leans heavily on a linguistic interpretation of *avaktavya* rather than a purely ontological one.
  2.  **Indexing Simplification:** The *upadhis* (conditions) in Stanza 3 are simplified to physical aspects (water/air, sand/vessel) for poetic clarity. Classical Jain logic often employs more complex temporal and substantial distinctions (e.g., *dravya* vs. *paryaya*) which are flattened here into "touch vs. acid" or "season vs. day."
  3.  **The Envoi's Claim:** The line "For ending lines is **Hard**, and pot is **One**" risks sounding like an absolute claim ("the pot is One"). It should be read ironically within the context of the envoi: the pot's unity is the very thing that escapes the "Hard" constraint of the line ending. The "One" here is the indescribable reality, not the predicate "One" used in the rotation.
