  Your description does not rest on a confusion. It is a precise phenomenological account of a specific dynamic in literary production and reception. You are not conflating distinct phenomena; you are isolating a feedback loop that existing theory usually treats as two separate events (the creation of meaning by the reader, and the constraint of the author by the market/canon). You have correctly identified that the binding force is not merely commercial or consistent, but *ontological* regarding the work's history.

  Here is the carving you requested.

  ### 1. The Established Neighbourhood
  There is no single established term in literary theory or philosophy of interpretation that covers the full triad you describe (Accident → Sticky Interpretation → Authorial Binding/Memory Alteration). I am confident in this negative. However, three existing concepts cover the slices of your phenomenon, none of which capture the backward flow of authority on its own.

  *   **Hypothetical Intentionalism (Stage 2):** In aesthetics (Levinson, Carroll), this position holds that a work's meaning is determined by what a competent audience would *hypothesize* the author intended, regardless of what the author *actually* intended. This covers your Stage Two (readers finding meaning). However, Hypothetical Intentionalism is a theory of *meaning*, not a theory of *authorial obligation*. It explains why the whistle means "inability to speak plainly," but it does not explain why *you* are forbidden from writing the character without the whistle in Book Five. It grants authority to the reader over the *text*, not over the *writer*.
  *   **The Author Function (Stage 3 Binding):** Foucault argued that the "Author" is not the living writer but a construct projected by discourse. This construct has rules (consistency, style, thematic unity). When you feel bound to the whistle, you are serving the "Author Function," not your own private will. This covers the normative binding. However, Foucault's concept is sociological; it does not account for the *psychological* component you describe (the confabulation of memory, the feeling that you *did* intend it). It explains the constraint, but not the internalization.
  *   **Confabulation / Narrative Identity (Stage 3 Memory):** In psychology, humans reconstruct memory to maintain a coherent self-narrative. If your public persona includes the whistle, your private memory adjusts to align with that persona to reduce cognitive dissonance. This covers the memory retrieval. But this is a general psychological mechanism, not a literary concept. It doesn't explain why the *reader* triggered it, only how you processed it.

  **Where the coverage runs out:** None of these concepts captures the *directionality* you identified. They describe the reader's power (Hypothetical Intentionalism), the construct's power (Author Function), or the mind's power (Confabulation). None describe the specific mechanism where *reception constitutes intention retroactively* and binds the living author to that constituted intention.

  ### 2. The Proposed Concept: Hermeneutic Binding
  Since no established term exists, I propose **Hermeneutic Binding**.

  **Definition:** Hermeneutic Binding occurs when a public interpretation of an accidental textual feature acquires normative authority over the author's future production and retroactive memory, effectively converting reception into intention.

  **The Carving (Boundaries and Distinctions):**

  *   **It is not the Intentional Fallacy:** The Intentional Fallacy warns critics *not* to ask the author. Hermeneutic Binding describes what happens when the author *is* asked, denies the intent, and is ignored anyway. The denial is part of the data, but it does not stop the binding.
  *   **It is not Series Consistency:** Ordinary consistency is forward-looking (I wrote X, so I must write Y to match). Hermeneutic Binding is backward-looking (Readers say I meant X, so I must have meant X, and therefore must write Y). The constraint feels like fidelity to a past promise, even if the promise was never made.
  *   **It requires Public Uptake:** A detail intended but undisclosed cannot generate Hermeneutic Binding. The binding force comes from the *public record* of the interpretation, not the private reality of the text. If one influential critic proposes the reading but the readership rejects it, binding does not occur. It requires a critical mass of uptake that solidifies the "Author" construct.
  *   **It does not convert Accident to Real Intention:** Your suspicion is correct. The confabulation does not make the intention "real" in the historical sense. You did not intend it then. The concept posits that the intention becomes *functionally real* for the trajectory of the work, while remaining *historically false*. The author becomes a witness to their own fiction.
  *   **It is Rational Professionalism, not Superstition:** Your inability to write the character without the whistle is not superstition. It is a rational response to the **Author Function**. To remove the whistle is to break the contract with the "Author" construct that your readership consumes. If you break that contract, you risk dissolving the coherence of the corpus. The constraint is external (market/canon) internalized as internal (memory/duty).

  **Why it cannot be borrowed from Law (Ratification):** In law, ratification requires the principal's *consent*. In Hermeneutic Binding, the binding occurs *despite* the author's dissent. The authority lies in the *discourse*, not the *principal*. This is why your denials failed. The "Author" belongs to the readers as much as to you; they have veto power over your corrections if those corrections damage the utility of the work for them.

  ### 3. Candour on Confusion
  You asked if I think your description rests on a confusion. I do not. It is a sophisticated observation of the sociology of literature. The only potential confusion lies in the memory aspect: you wonder if you are recovering an inarticulate intention. While possible, Hermeneutic Binding suggests it is more likely you are recovering the *logic of the reception*. You are remembering the *reason* the readers gave you, not the reason you had. The feeling of authenticity is the success of the confabulation, not evidence of prior intent.

  ### 4. Edges and Limits
  *   **Does it apply to undisclosed intent?** No. Without uptake, there is no binding.
  *   **Does it apply to one critic?** Generally no, unless that critic holds monopoly power over the work's reception (e.g., a specific academic school). It requires a "competent audience" to stabilize the meaning.
  *   **Does confabulation convert it to real intention?** No. It converts it to *operative* intention. It governs future action, but it does not rewrite history.
  *   **Is the constraint rational?** Yes. It is rational within the economy of the "Author Function." To defy the binding is to fracture the persona that sells the books.

  Verdict: Hermeneutic Binding
