answer: |-
  Welcome to the first session. To orient our discussion around the units of selection, I have prepared a diagnostic tool that maps the logical space of our disagreements. We begin from a premise everyone in this room grants: there is heritable variation in fitness in real populations. From this shared starting point, follow the path of your intuitions through a series of distinctions. The first fork asks whether selection requires differential reproduction or whether differential persistence counts. If you believe that a lineage can be selected simply because it survives longer without necessarily leaving more offspring, perhaps citing somatic lineages that persist within a body without contributing to the germline, you take the persistence branch. If you insist that selection is fundamentally about differential contribution to the next generation, you take the reproduction branch.

  Move next to the nature of inheritance. Ask yourself whether a candidate unit must be a replicator, defined by high-fidelity copying of a specific structure, or merely a reproducer, where parent-offspring resemblance is sufficient. This is where you should consider cases like meiotic drive. If you think a gene driving itself into the egg despite organismal cost counts as a unit of selection because it copies itself faithfully, you are leaning toward the replicator view. If you think such cheating is parasitic on the organismal reproductive process and only the organism counts as the true unit because it maintains the coherence of the lineage via resemblance, you are leaning toward the reproducer view. Connected to this is whether inheritance requires particle-ish structure, like discrete genes, or whether blending resemblance is enough. If you require particles, you are setting a high bar for what gets selected.

  The third distinction concerns the ontology of biological levels. Ask yourself whether the gene, organism, and group levels are features of the world or artifacts of the grain at which you are describing the system. This is the crucial test for the holobiont or microbiome question. If you believe the holobiont is a real unit only because we choose to describe the host and microbes together for convenience, you view levels as artifacts of grain. If you believe the holobiont is a real unit because the metabolic interdependence creates a genuine new level of organization regardless of our description, you view levels as real features of the world.

  The fourth distinction applies specifically if you grant that groups can be units. Ask yourself whether you detect group-level selection with a neighbour-modulated fitness decomposition, which partitions effects into direct and indirect components on individuals, or with contextual analysis, which treats group properties as distinct causes. Furthermore, ask whether these two methods ever come apart empirically. If you believe they are merely different accounting schemes for the same underlying individual-level process, you land on one side. If you believe contextual analysis captures a causal reality that neighbour-modulated fitness misses, specifically regarding group reproduction, you land on the other.

  Following these branches leads you to one of five positions. If you required replicators, particle inheritance, and viewed genes as the only real level, you arrive at Gene Selectionism. If you required differential reproduction, viewed organisms as the only real reproducers, and dismissed group effects as individual context, you arrive at the Organism-only view. If you viewed levels as real but argued that groups affect individual fitness without themselves reproducing as units, relying on contextual analysis to show variance among groups, you arrive at an MLS1-type realism. If you argued that groups themselves reproduce and persist as genuine units, distinct from the sum of their members, you arrive at an MLS2-type realism. Finally, if you answered that levels are artifacts of grain and that the correct unit depends on the specific question being asked, you arrive at the Pluralist view.

  Regarding the logical space this tree maps, there are combinations of answers that nobody actually occupies. Specifically, there are no serious proponents of MLS2-type realism who also deny that inheritance requires particle-ish structure. This view is likely incoherent because MLS2 requires groups to reproduce as units, which implies a mechanism for high-fidelity transmission of group structure that blending resemblance cannot support. Another unoccupied space is the combination of believing levels are merely artifacts of grain while insisting that neighbour-modulated fitness and contextual analysis must come apart empirically. This view is unattractive because if levels are not real, the mathematical equivalence of the two methods usually holds, making the insistence on their divergence unmotivated. There is also a largely unexplored region involving differential persistence without replicators, where somatic lineages are selected via survival but without high-fidelity copying, which remains a theoretical curiosity rather than a defended position.

  There are also pairs of leaves this tree cannot really separate cleanly. The Organism-only view and MLS1-type realism are often empirically indistinguishable because both agree that selection ultimately acts on individual fitness, differing only on whether group context is described as a selective force or as part of the individual's environment. Similarly, Gene Selectionism and the Organism-only view can be difficult to separate in cases where gene interests align perfectly with organism interests, making the distinction visible only in conflict cases like meiotic drive or somatic cheating.

  I am moderately confident in this branch structure as a diagnostic for this group, but I am least sure about the node distinguishing neighbour-modulated fitness from contextual analysis. Many philosophers and biologists argue these are mathematically equivalent partitions of the same Price equation terms, meaning this node might not cut the views apart ontologically as cleanly as I have assumed, but rather separates rhetorical preferences about how to account for the same causal processes.
