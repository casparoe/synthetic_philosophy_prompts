prompt: |-
  I run a reading group on evolution and philosophy — about a dozen people, half of them working biologists who read Dawkins as undergrads and not much since. For the first session I want to hand out a diagnostic: a decision tree that starts from something everyone in the room will already grant (there is heritable variation in fitness in real populations) and ends at a named position on the units-of-selection question.

  Build it out of the logical space rather than out of a list of names — questions first, positions located in that space afterwards. I want the branch nodes to be the distinctions that actually do the work, and I'd like these in there somewhere: whether a candidate unit has to be a replicator (high-fidelity copying of a structure) or merely a reproducer; whether inheritance needs particle-ish structure or whether parent–offspring resemblance is enough; whether you detect group-level selection with a neighbour-modulated-fitness decomposition or with contextual analysis, and whether the two ever come apart; whether differential persistence counts as selection or only differential reproduction; and whether the gene/organism/group levels are features of the world or artifacts of the grain your describing at. The leaves have to include gene selectionism, the organism-only view, an MLS1-type and an MLS2-type realism, and the pluralist "it depends which question you're asking" view. Where you can, hang the diagnostic on cases the biologists will care about: meiotic drive, somatic-versus-germline cheating inside one body, and the holobiont/microbiome question.

  Then tell me which combinations of answers nobody actually occupies, and whether that's because the view is incoherent, merely unattractive, or just unexplored — and flag any pair of leaves the tree can't really separate.

  Two housekeeping things: prose only, no headings, bullets, bold or tables, this is going into a plain-text email. And close with how confident you are in the branch structure, singling out the one node you're least sure really cuts the views apart the way I'm assuming.
