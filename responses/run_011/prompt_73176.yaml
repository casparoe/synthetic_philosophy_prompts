answer: |-
  # Handout: Dissecting "When in Rome"
  **Context:** Three people used the same proverb to justify three incompatible actions (tipping, not pressuring a guest, jaywalking). Below are the four distinct normative claims the proverb usually hides.

  ## Part I: The Menu of Interpretations

  | Thesis | Who is bound? | Type of Claim | Scope of Norms | Nature of Wrongness | Assumption about Local Norm | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Coordination Thesis** | The Visitor | **Prudential** (Safety/Order) | **Coordination Conventions only** (Traffic, queues, greetings) | **Instrumental:** You cause confusion or danger. | Assumes the local norm *works* to coordinate behavior. | **Platitude.** Hard to deny that breaking coordination causes friction. |
  | **2. The Fairness Thesis** | The Visitor | **Moral** (Reciprocity) | **Benefit Schemes** (Tipping, taxes, public transit) | **Free-Riding:** You take the benefit without bearing the cost others do. | Assumes the local scheme is **decent** (not exploitative). | **Substantive.** Defensible, but fails if the local scheme is corrupt or unjust. |
  | **3. The Hospitality Thesis** | **The Host** (Inverted) | **Moral** (Care/Respect) | **Social Comfort** (Dietary restrictions, customs) | **Disrespect:** You prioritize your comfort over the guest's dignity. | Assumes the guest's discomfort outweighs the host's desire for conformity. | **Substantive.** A strong claim about the duties of hosting, not visiting. |
  | **4. The Relativist Thesis** | The Visitor | **Metaethical** (Truth) | **All Morality** (Cheating, lying, tipping, sex) | **Objective Wrongness:** The act literally *becomes* right or wrong based on location. | Assumes local practice **defines** morality (no external standard). | **False.** Most ethicists reject this. Location doesn't make theft right. |

  ***

  ## Part II: The Payoff (Mapping Your Dinner)

  Here is which thesis each person was actually relying on. Note that two of them were talking past each other.

  **1. The Senior Person (The Tipping Argument)**
  *   **Claim:** "You must tip 20% because you are eating here."
  *   **Thesis Used:** A mix of **The Fairness Thesis** and **The Relativist Thesis**.
  *   **Analysis:** They argued that by eating in the restaurant, the guest enters a benefit scheme (Fairness). However, they also implied that the local custom *makes* the tip obligatory in a moral sense (Relativism).
  *   **Vulnerability:** This collapses if the tipping system is viewed as exploitative (violating the "decent scheme" assumption). If the system is unjust, the Fairness Thesis doesn't bind the guest.

  **2. The Other Guest (The "Don't Pressure" Argument)**
  *   **Claim:** "We shouldn't force her to tip because she isn't one of us."
  *   **Thesis Used:** **The Hospitality Thesis.**
  *   **Analysis:** This person flipped the proverb. For them, "The Romans" are the *hosts*, and the Roman duty is hospitality. Pressuring a guest violates the local norm of generosity.
  *   **Vulnerability:** None, provided you accept that hosting duties override visiting duties in private settings. This is the only argument that doesn't demand conformity from the visitor.

  **3. The Visiting Colleague (The Jaywalking Argument)**
  *   **Claim:** "I cross when they cross because that's how it's done here."
  *   **Thesis Used:** **The Coordination Thesis.**
  *   **Analysis:** She argued that safety and flow depend on matching the herd.
  *   **Vulnerability:** High. This relies on the assumption that the local norm *actually* coordinates safely. If the locals are jaywalking dangerously (getting hit, causing near-misses), the Coordination Thesis fails. She is using "everyone does it" to excuse a potentially unsafe act, which is a misuse of the thesis.

  ***

  ## Part III: Free-Riding vs. Scrambling Expectations

  You suspected two lines of argument were doing different work. You are correct. They are separable.

  **1. Free-Riding (The Tipping Case)**
  *   **The Harm:** Economic distribution.
  *   **Mechanism:** The system functions *overall*, but specific individuals (servers) lose out if you opt out.
  *   **Does it require conformity?** No. You could pay the server directly in a way that bypasses the tip jar, or the restaurant could pay living wages. The specific *habit* matters less than the *contribution*.
  *   **Verdict:** This is a **Fairness** issue.

  **2. Scrambling Expectations (The Jaywalking Case)**
  *   **The Harm:** Predictability and Safety.
  *   **Mechanism:** The system functions only if everyone follows the *same signal*. If you contribute money but walk against the light, you haven't solved the safety issue.
  *   **Does it require conformity?** Yes. The specific *habit* is the point.
  *   **Verdict:** This is a **Coordination** issue.

  **Do they collapse?**
  No. You can free-ride without scrambling (e.g., riding the bus without paying when no one is checking). You can scramble without free-riding (e.g., driving the speed limit in a flow of traffic going 20mph over).
  *   **The Senior Person** conflated the two. They treated tipping (Fairness) like jaywalking (Coordination), implying the *act itself* was the moral requirement rather than the *support of the worker*.
  *   **The Visiting Colleague** treated jaywalking (Coordination) as a moral permission slip, ignoring that coordination only works if the convention is actually safe.

  ***

  ## Part IV: Bonus Problem Set (Intro Ethics)

  **Case:** *The Roman Dinner*
  Three friends argue over a bill in a US restaurant.
  *   **Alice** says: "I'm from Europe. Tipping is insulting there. I won't do it here either."
  *   **Bob** says: "You're free-riding. The servers expect this income."
  *   **Carol** says: "Actually, if everyone tips 20%, the restaurant pays lower base wages. By not tipping, you force them to pay living wages."

  **Questions:**
  1.  Which Thesis from the Menu is Bob using? Which is Alice using?
  2.  Carol is making a **Consequentialist** argument against the local norm. Does the "When in Rome" proverb have any power against Carol? Why or why not?
  3.  Imagine the group is at a crosswalk. Alice crosses against the light because "no one waits here." Is this the same argument she made about tipping? Explain using the Free-Ride vs. Scrambling distinction.

  **Teaching Note:** *Use this to show students that proverbs are not arguments; they are placeholders for arguments. The work begins when you ask "Why Rome?"*
