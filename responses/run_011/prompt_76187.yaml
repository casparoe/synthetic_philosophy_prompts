      *   Let's go with a weighted average approach for the final step to reflect the "substantial" condition (it doesn't have to be the *only* motive, just substantial).
      *   Revised Rule: $C = \min(P_1, P_2) \times P(\text{Motivation Weight})$.
      *   Let's stick to the prompt's request for a specific rule description. I will use a **Conjunctive-Competitive Model**. $C = (P_1 \times P_2) \times (1 - P_{\text{rivals\_exclusive}})$.
      *   Wait, the prompt says "rival-motives term... subtracts from rather than multiplies into".
