prompt: |-
  I am a junior double-majoring in history and philosophy, currently enrolled in a seminar on Nietzsche's second Untimely Meditation, and I also work twelve hours a week at a county historical society. We make three kinds of decision constantly and have no framework for any of them: whether to mount an exhibit that celebrates a prominent local figure, whether to accept a large donation of ordinary domestic material we lack the staff to catalog, and whether to publish material that reflects badly on the founders whose names are on the building. Our director defaults to honoring everything, and, under pressure, to saying nothing at all.

  Please act as a philosopher who knows the monumental, antiquarian, and critical modes of history thoroughly and who also understands the constraints of a small, volunteer-run museum, and think the problem through carefully before answering. Begin with a short brainstorming pass: what each of the three modes would look like if it were written as an institutional decision rule, and what goes wrong when any one of them runs unchecked. Then convert the distinction into a procedure my director could run on any incoming proposal — the questions in order, what counts as a sufficient answer to each, which answers terminate the procedure with a no, and where the procedure must stop and hand the matter to a board vote because the question is one of values rather than fact.

  Build in Nietzsche's notion of a culture's capacity to absorb and metabolize its past as a genuine constraint rather than ornament: tell me what exceeding that capacity would look like observably in an institution like ours, and give me a threshold rule I could defend to a board already suspicious of theory.

  Finally, run the procedure on two cases: a proposed exhibit on the town's most successful industrialist, whose fortune was built partly by breaking a strike with hired gunmen, and a four-thousand-piece donation of one farm family's receipts, photographs, and tools. Point out explicitly the step at which the procedure produces an answer the donor or the board will resent, and flag honestly which steps are judgment calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Junior double-major in History and Philosophy. Working 12 hours/week at a county historical society.
      *   **Context:** Seminar on Nietzsche's *Second Untimely Meditation* ("On the Uses and Disadvantages of History for Life").
      *   **Problem:** The historical society lacks a decision-making framework for three specific types of dilemmas (celebratory exhibits, overwhelming donations, controversial truths). The director defaults to honor/silence (avoidance).
      *   **Task:** Act as a philosopher expert in Nietzsche's three modes (Monumental, Antiquarian, Critical) + practical museum constraints.
      *   **Deliverables:**
          1.  Brainstorming pass: Institutional decision rules for each mode + risks of unchecked modes.
          2.  A procedural flowchart/checklist for the director (questions, termination conditions, board vote triggers).
          3.  Integration of Nietzsche's "capacity to absorb/metabolize" concept as a constraint (observable signs + threshold rule).
          4.  Application of the procedure to two specific cases (Industrialist/Strikebreaker, Farm Family Donation).
          5.  Honest meta-commentary on where resentment will occur and where judgment calls are disguised as procedure.

  2.  **Deconstruct Nietzsche's *Second Untimely Meditation*:**
      *   **Monumental History:** Focuses on great deeds/figures to inspire action in the present. *Risk:* Distorting truth, ignoring context, making the past a myth that crushes the present.
      *   **Antiquarian History:** Focuses on preserving the past for its own sake, reverence for origins. *Risk:* Mummification, hoarding, inability to distinguish valuable from worthless, stifling new growth.
      *   **Critical History:** Judges and condemns the past to enable life in the present. *Risk:* Nihilism, rootlessness, destroying the soil one grows from.
      *   **The "Plastic Power":** The capacity of a culture (or institution) to incorporate the past without being crushed by it. This is the key constraint.

  3.  **Drafting Section 1: Brainstorming the Modes as Institutional Rules:**
      *   *Monumental Rule:* "Does this inspire?" -> Risk: Hagiography, ignoring sins of "great men."
      *   *Antiquarian Rule:* "Is this old/local?" -> Risk: Clutter, resource drain, "everything matters equally."
      *   *Critical Rule:* "Does this reveal truth/justice?" -> Risk: Alienating donors, self-flagellation, losing community support.
      *   *Synthesis:* Need a balance. The institution exists for *life* (the present community), not just the past.

  4.  **Drafting Section 2: The Procedural Framework (The "Nietzschean Triage"):**
      *   Need a step-by-step process.
      *   *Step 1 (Antiquarian Filter):* Authenticity/Relevance. If it's not real or relevant, stop.
      *   *Step 2 (Monumental Filter):* Inspirational value. Does it serve the living?
      *   *Step 3 (Critical Filter):* Truth/Harm. Does it hide necessary pain?
      *   *Step 4 (Plastic Power Check):* Can we handle it? (Resources + Emotional capacity).
      *   *Board Vote Trigger:* When values conflict (e.g., Truth vs. Funding).
      *   *Termination:* Clear "No" conditions (e.g., fake artifacts, resource impossibility).

  5.  **Drafting Section 3: The "Plastic Power" Constraint:**
      *   Nietzsche's concept: *Plastische Kraft*. The ability to grow, incorporate, and heal.
      *   *Observable signs of exceeding capacity:* Staff burnout, exhibit incomprehensibility, donor revolts, storage overflow, narrative incoherence.
      *   *Threshold Rule:* "The 20% Rule" or "The Metabolism Cap." Let's go with a resource/narrative bandwidth cap. If accepting this prevents us from processing *other* essential history, it's a no.
      *   *Defending to Board:* Frame it as "Sustainability" and "Mission Focus," not "Philosophical Limits."

  6.  **Drafting Section 4: Running the Cases:**
      *   *Case A (Industrialist):*
          *   Monumental: Yes (successful).
          *   Critical: Yes (strikebreaking/violence).
          *   Conflict: Honor vs. Truth.
          *   Outcome: Proceed but reframe (Critical/Monumental synthesis).
          *   Resentment Point: Telling the descendants/board that "celebration" is insufficient.
      *   *Case B (Farm Family):*
          *   Antiquarian: Yes (old, local).
          *   Plastic Power: No (4000 items, no staff).
          *   Outcome: Reject or sample.
          *   Resentment Point: Telling the donor their family history isn't "worthy" of full preservation.

  7.  **Drafting Section 5: Meta-Commentary (Honesty Check):**
      *   Where is this subjective? The weighting of "harm" vs. "inspiration."
      *   Where is the resentment? Donors feel rejected; Board feels threatened.
      *   Acknowledge that procedure doesn't remove the burden of judgment.

  8.  **Refining and Polishing:**
      *   *Tone:* Academic but practical. Respectful of the user's intellect (junior major) but grounded in the reality of the museum (volunteer-run).
      *   *Nietzschean Terminology:* Use *Leben* (Life), *Plastische Kraft* (Plastic Power), but explain them in museum terms.
      *   *Structure:* Follow the prompt's ordering strictly.
      *   *Self-Correction during drafting:* Make sure I don't just say "use all three." Nietzsche warns against *excess* of any. The procedure must prioritize *Life* (the present community's health).
      *   *Constraint Check:* The prompt asks for "questions in order," "sufficient answers," "termination points," and "board vote triggers." I need to make this look like a flowchart or checklist.

  9.  **Final Review against constraints:**
      *   Did I act as the philosopher/expert? Yes.
      *   Did I brainstorm the modes first? Yes.
      *   Did I create a procedure? Yes.
      *   Did I address "Plastic Power" as a constraint? Yes.
      *   Did I run the two cases? Yes.
      *   Did I flag resentment and judgment calls? Yes.

  *(Self-Correction Note)*: Ensure I emphasize that the Director's default (honor/silence) is a failure of *Critical* history and an excess of *Antiquarian* reverence. The goal is to empower the Director to say "No" or "Yes, but..."

  *(Refining the Plastic Power Rule)*: How to make it defensible to a board? "If processing this item reduces our ability to serve the public by >X%, we cannot accept it." Or "If the narrative complexity exceeds our interpretive capacity." Let's combine resource and narrative capacity.

  *(Refining the Procedure)*: Make it a "Triage Protocol."
  1. Antiquarian (Is it real/ours?)
  2. Plastic Power (Can we hold it?)
  3. Monumental/Critical (What story does it tell?)
  4. Board (If values clash).

