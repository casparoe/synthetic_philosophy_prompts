answer: |-
  ### Part I: Brainstorming the Modes as Institutional Rules

  As a student of Nietzsche's *Second Untimely Meditation*, you recognize that history is not for the sake of knowledge, but for the sake of *life* (*Leben*). An institution that forgets this becomes a tomb. Here is how the three modes translate into institutional decision rules, and the specific pathology that arises when each operates without the check of the others.

  **1. The Monumental Rule**
  *   **The Dictum:** "Does this proposal provide an inspiring model for action in the present?"
  *   **The Procedure:** Accept materials or exhibits that highlight greatness, courage, or achievement.
  *   **The Pathology of Excess:** **Hagiography.** When unchecked, the institution becomes a temple of false idols. It distorts facts to preserve the inspiration. It silences the suffering required to produce the "greatness." In your society, this is the Director's default: honoring the founders regardless of their actions. It creates a culture that cannot cope with failure or moral ambiguity.

  **2. The Antiquarian Rule**
  *   **The Dictum:** "Does this proposal preserve the conditions of our origin and local identity?"
  *   **The Procedure:** Accept anything old, local, or connected to established families. Preserve everything equally.
  *   **The Pathology of Excess:** **Mummification.** The institution becomes a hoarder. It loses the ability to distinguish the significant from the trivial. It stifles new growth because every new idea must bow to the sheer weight of preserved junk. In your society, this is the inability to reject the 4,000-piece donation. It consumes the resources needed for *living* history.

  **3. The Critical Rule**
  *   **The Dictum:** "Does this proposal allow us to judge and break the past so that we may live?"
  *   **The Procedure:** Publish truths that damage reputations if those reputations hinder current justice. Deaccession items that glorify oppression.
  *   **The Pathology of Excess:** **Rootlessness.** The institution becomes a tribunal rather than a home. It alienates the community it serves by destroying their connection to their ancestors. It creates a nihilistic environment where no continuity is possible. In your society, this is the fear that drives the Director to silence; he worries that critical history will destroy the building's namesakes and thus the funding.

  ***

  ### Part II: The "Plastic Power" Triage Procedure

  Nietzsche argues that a culture (or institution) possesses a specific "plastic power" (*plastische Kraft*): the capacity to grow out of itself, to incorporate the past without being crushed by it. When you exceed this capacity, the institution does not just fail; it becomes toxic.

  Below is a decision procedure for your Director. It is designed to force a synthesis of the three modes while respecting the constraint of plastic power.

  **Phase 1: The Antiquarian Filter (Fact & Relevance)**
  *   **Q1:** Is the material authentic and geographically relevant to the county?
      *   *Sufficient Answer:* Verified provenance + local connection.
      *   *Termination (NO):* If fake or irrelevant. (End process).
  *   **Q2:** Do we have the physical storage and conservation capacity for this?
      *   *Sufficient Answer:* Yes, with existing budget/staff.
      *   *Termination (NO):* If "No," proceed to **Phase 1b**.
      *   **Phase 1b (Sampling):** Can we accept a representative sample (e.g., 5%) and return the rest?
          *   *Termination (NO):* If donor refuses sampling. (End process. *Note: This protects the institution from antiquarian excess.*)

  **Phase 2: The Plastic Power Check (Metabolic Capacity)**
  *   **Q3:** Will processing this material prevent us from processing *other* essential history in the next 24 months?
      *   *Sufficient Answer:* No, it fits within current workflow.
      *   *Termination (NO):* If "Yes." (*See Threshold Rule below*).
  *   **Q4:** Does the narrative complexity of this proposal exceed our current interpretive staff's ability to contextualize it safely?
      *   *Sufficient Answer:* No, we can explain the nuance.
      *   *Board Vote Trigger:* If "Yes." (This is a value judgment on risk).

  **Phase 3: The Monumental/Critical Synthesis (Meaning)**
  *   **Q5:** Does this proposal require us to hide a significant harm to present a "great" figure?
      *   *Sufficient Answer:* No, OR Yes, but we can contextualize the harm.
      *   *Termination (NO):* If "Yes" and we *cannot* contextualize (e.g., lack of space, political threat too high).
      *   *Board Vote Trigger:* If "Yes" and the harm involves the founders/benefactors. (This forces the board to choose between funding and truth).
  *   **Q6:** Does this proposal serve the *living* community's need to understand themselves, or only the dead's need to be remembered?
      *   *Sufficient Answer:* Serves the living.
      *   *Termination (NO):* If it serves only the dead (pure antiquarianism).

  **Board Vote Trigger Summary:**
  Matters must go to the board when:
  1.  **Resource Conflict:** The Plastic Power Check fails (Phase 2, Q3).
  2.  **Moral Conflict:** The Critical Synthesis requires judging a benefactor (Phase 3, Q5).
  *Reasoning:* These are not factual questions; they are questions of what kind of institution the community wants to be. The Director manages facts; the Board manages values.

  ***

  ### Part III: The Plastic Power Threshold Rule

  You asked for a threshold rule defensible to a board suspicious of theory. Do not use the word "metabolism." Use the language of **Mission Sustainability.**

  **The Rule:** *"The 20% Capacity Cap."*
  **Definition:** No single acquisition or exhibit may consume more than 20% of the institution's total annual volunteer/staff labor hours or exhibit square footage.

  **Observable Signs of Exceeding Capacity (The "Toxic Past"):**
  1.  **Backlog Growth:** Unprocessed boxes increase for three consecutive quarters.
  2.  **Narrative Incoherence:** Visitors leave exhibits more confused about the town's identity than when they entered.
  3.  **Volunteer Attrition:** Long-term volunteers quit because they feel overwhelmed by "busy work" (cataloging) rather than engaged in "meaningful work" (interpretation).
  4.  **Defensive Silence:** Staff refuse to answer visitor questions about specific collections because the story is too complicated or painful to explain ad-hoc.

  **Defense to the Board:**
  "If we accept material that consumes 50% of our labor, we are no longer a museum serving the public; we are a warehouse serving the donors. Nietzsche calls this 'the blind rage of collecting.' It kills the institution's ability to function in the present. We must reject good history to save the institution that preserves history."

  ***

  ### Part IV: Running the Procedure on Cases

  #### Case A: The Industrialist Exhibit
  *Proposal:* Celebrate the town's most successful industrialist. Fortune built partly by breaking a strike with hired gunmen.

  1.  **Phase 1 (Antiquarian):** Is he local/real? **Yes.**
  2.  **Phase 2 (Plastic Power):** Do we have the space/staff? **Yes.**
  3.  **Phase 2 (Narrative Capacity):** Can we contextualize the violence? **Judgment Call.** (Assume Yes, we have a panel for labor history).
  4.  **Phase 3 (Synthesis Q5):** Does this require hiding harm? **Yes.** The strikebreaking is central to the fortune.
      *   *Condition:* Can we contextualize? **Yes.**
      *   *Action:* Proceed *only if* the exhibit explicitly details the strikebreaking as part of the "cost" of the industrial success.
  5.  **Phase 3 (Synthesis Q6):** Does this serve the living? **Yes,** if it sparks dialogue on labor and wealth.

  *   **Outcome:** **Approved with Conditions.** The exhibit must be titled to reflect complexity (e.g., "Industry and Conflict: The [Name] Legacy") rather than pure celebration.
  *   **Resentment Point:** The Industrialist's descendants and the Board members who bear his name. They expect Monumental history (glory); you are giving them Critical history (judgment).
  *   **Board Vote Trigger:** Because the founders' names are on the building, Phase 3, Q5 triggers a board vote. The Director cannot make this alone.

  #### Case B: The Farm Family Donation
  *Proposal:* 4,000-piece donation of receipts, photos, tools. No staff to catalog.

  1.  **Phase 1 (Antiquarian):** Is it local/real? **Yes.**
  2.  **Phase 1 (Capacity Q2):** Do we have storage/staff? **No.**
      *   *Action:* Move to Phase 1b (Sampling). Offer to take 50 photos, 10 tools, 1 ledger.
  3.  **Phase 1b:** Does donor accept sampling? **Assume No** (Donors often want "all or nothing" to keep the legacy intact).
      *   *Termination:* **Reject Donation.**
  4.  **Phase 2 (Plastic Power Q3):** If we accepted it, would it stop other work? **Yes.** It would consume >20% of annual labor.

  *   **Outcome:** **Rejected.**
  *   **Resentment Point:** The donor family. They view the Antiquarian mode as sacred (everything matters); you are viewing it through the lens of *Life* (the institution must survive). They will feel their ancestors are being discarded.
  *   **Judgment Call Disguised as Procedure:** The decision of *which* 50 photos to keep is subjective. The decision that 4,000 items is "too many" is based on the 20% cap, which is an arbitrary administrative line drawn to protect the staff.

  ***

  ### Part V: Meta-Commentary on the Procedure

  **Where the Procedure is a Mask for Judgment:**
  Nietzsche warns that no system can replace the need for artistic and philosophical instinct.
  1.  **The "Contextualization" Loophole:** In Case A, saying "we can contextualize the violence" is a judgment call. If the board pressures you to minimize the violence to keep the funding, the procedure says "No," but the reality is you might be fired. The procedure gives you cover, but it cannot guarantee safety.
  2.  **The 20% Cap:** This number is arbitrary. It is a heuristic, not a law of nature. However, it is necessary to prevent the "Antiquarian excess" where everything is deemed equally important.
  3.  **Serving the Living:** Deciding what the "living community needs" (Phase 3, Q6) is inherently political. You are deciding what history is *for*.

  **Where the Resentment Will Burn:**
  *   **The Director:** He defaults to silence because he fears conflict. This procedure forces him to speak (either to say "No" to the donor or "But" to the board). He will resent the loss of neutrality.
  *   **The Donors:** They view donation as a transaction: *I give objects, you give immortality.* The procedure breaks this contract by saying, "We only accept what serves the living."
  *   **The Board:** They view the building's namesakes as sacred (Monumental). The procedure treats them as historical subjects subject to critique (Critical).

  **Final Advice for the Seminar & The Society:**
  Use this procedure to show your Director that Nietzsche is not just abstract theory. The "Antiquarian" mode is exactly why you are drowning in unboxed receipts. The "Monumental" mode is exactly why you are afraid to talk about the strike. The "Critical" mode is the scalpel you need to cut away the dead weight so the institution can breathe.

  When you present this, do not frame it as "Nietzsche says." Frame it as "Sustainability Triage." But know, in your heart, that you are fighting for the *plastic power* of your town to grow rather than merely to remember.
