answer: |-
  ### Calibration Method for Moral Resistance

  1.  **Abstraction:** Remove all indexical references (I, me, here, now) from your justification for inaction. Does the resulting principle hold for any agent in any location, or does it rely on your specific position to function?
  2.  **Reciprocity:** Imagine you are the beneficiary suffering the consequence of your inaction. Does the justification still seem sufficient to warrant that suffering, or does it appear as a privilege you are claiming for yourself?
  3.  **Consistency:** Apply the justification to a scenario where your self-interest is neutral or opposed (e.g., judging a peer's inaction). Does it yield the same moral permission, or does it conveniently expand only when you are the one sacrificing?

  ### Application to Your Situation

  **Suspicious Attachments to the Pond Case**
  You should be most suspicious of your attachment to the **discreteness** and **vividness** of the pond scenario. The pond presents a one-off cost (ruined shoes) against a specific life, whereas real-world giving presents a continuous cost (lifestyle reduction) against statistical lives. Your brain treats the former as a clear duty and the latter as a vague tax. This is a cognitive framing effect, not a moral distinction. The *logic* of the pond compels you, but the *psychology* of the pond (urgency, visual certainty) is what your resistance is actually clinging to when you claim the cases are different.

  **Analysis of Counter-Considerations**

  *   **Proximity (Rationalization):** Fails **Abstraction**. Moral relevance does not diminish over kilometers any more than it does over meters. If you accept the principle that suffering is bad, location is morally arbitrary. This is a bias masking as community preference.
  *   **Others Not Giving (Rationalization):** Fails **Reciprocity**. The drowning child does not care about fairness among donors; they care about not dying. While fairness is a valid social virtue, it cannot justify letting a identifiable victim die when you could prevent it. This is a fairness heuristic misapplied to a survival imperative.
  *   **Personal Projects & Open-Endedness (Insight):** Passes **Consistency**. The "Strong Principle" (give until marginal utility equals marginal cost) risks destroying the agent's integrity and capacity for effective action over time. If everyone gave until they were marginally useless, there would be fewer capable agents to generate wealth and solve systemic problems. Your resistance to the *totality* of the demand preserves the agency required to be moral at all. However, this insight justifies keeping *some* resources for projects, not *most* resources for comfort.

  **Diagnosis**
  Your failure to give *anything* significant is bias (self-interest overriding acknowledged duty). Your failure to give *everything* is principled (preservation of agency and sustainability). You are conflating the validity of the moderate principle with the invalidity of any principle at all.

  Verdict: BOTH While your refusal to sacrifice all agency preserves the capacity for moral action, your failure to sacrifice any significant comfort reveals self-serving inconsistency.
