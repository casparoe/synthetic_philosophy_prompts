  **Opening concessions**

  I grant that confirmation is holistic in the sense that mathematics never appears alone in a prediction; the web of belief is real, and no experiment tests a mathematical axiom in isolation. I grant that mathematical sentences are truth-apt and that my agnosticism regarding their truth-makers is ontologically costly compared to standard realism. I grant that distinguishing reliability from truth feels verbal if reliability always accompanies truth in practice. I acknowledge that for the naturalist, empirical success is the only warrant available. I am not introducing a new source of warrant but reinterpreting the existing one. I also concede that my view leaves a large portion of mathematics in a state of derivative warrant, which may seem uneven. However, this unevenness mirrors the actual history of application. I do not concede that this unevenness is a defect; it is a feature of an empiricist account of justification. The line I hold is that while we must accept the theory that works, we need not accept every component of that theory as literally true to explain why it works. Reliability is a feature of a practice's output stability; truth is a semantic property. I do not concede that agnosticism undermines the utility of mathematics in science. The cost of agnosticism is metaphysical quietism, not practical paralysis.

  **The objections, ranked**

  **Quinean Holist**
  *If confirmation is holistic, how can you carve out math for separate treatment without breaking the web of belief?*
  **Severity:** Fatal. **Weakness:** Relies on a practice/truth distinction that may not hold under scrutiny.
  Reply: Holism tells us what gets tested, not what gets believed. When a theory succeeds, we are warranted in believing the package yields reliable predictions. But the package contains components with different roles. Physical posits explain causal mechanisms; mathematical posits provide derivational structure. We can acknowledge the whole package is confirmed while distinguishing the type of warrant each component receives. The web of belief is not a monolith; it has structure. My view respects the holism of testing while denying the holism of ontological commitment. We accept the theory because it works, but we analyze *how* it works to determine what we owe it. The math is warranted as a reliable tool, not as a true description of abstract reality. This preserves the holistic input while allowing a differentiated output. The Quinean worry assumes confirmation transfers uniform truth-value; I argue it transfers uniform reliability, which supports differentiated ontological stances.

  **Naturalist Empiricist**
  *Isn't reliability just truth-conduciveness by another name? If it works systematically, isn't that what truth is?*
  **Severity:** Serious. **Weakness:** Risks collapsing the distinction if reliability is defined too robustly.
  Reply: Truth is a property of sentences corresponding to reality; reliability is a property of a practice yielding stable outputs. A clock can be reliable without having a true theory of time inside it. Similarly, mathematics can be a reliable engine for derivation without the sentences describing existing objects. If truth were required for reliability, we could not explain the history of useful but false theories. We have a rival hypothesis: the math is merely stable, not true. Both predict success. Science chooses the weaker hypothesis when the stronger adds no predictive power. Truth adds ontological baggage; reliability adds none. Since empirical evidence does not distinguish them, naturalism dictates we prefer the weaker claim. Reliability explains the success without the metaphysical cost. Truth is an excess hypothesis here.

  **Platonist**
  *If sentences are truth-apt, what makes them true? If you don't know, aren't you just a fictionalist in denial?*
  **Severity:** Serious. **Weakness:** Agnosticism may look like instability rather than a stable position.
  Reply: I am not denying truth-makers exist; I am denying we are warranted in claiming knowledge of them. Fictionalism says mathematical sentences are false; I say they are truth-apt but our warrant stops at reliability. You can be a platonist and accept my account of justification. I am offering an epistemological constraint, not an ontological denial. The question "what makes them true" is legitimate, but science does not answer it. My view is compatible with your ontology but restricts your claim to know it via science. This is not denial; it is scope-limiting. You may believe in abstract objects on other grounds, but empirical success alone does not force that belief. I leave the door open for platonism while closing the indispensability argument. This is a shared account of justification, not a rival ontology.

  **General Naturalist**
  *What is "reliability" if not truth-conduciveness? Define it without circularity.*
  **Severity:** Serious. **Weakness:** Defining reliability without truth is technically difficult.
  Reply: Reliability is the systematic correlation between input characterization and output validation in practice. It is measured by engineering success and predictive stability, not by correspondence to abstracta. We verify reliability by checking if the math consistently leads to working bridges and accurate predictions. Truth-conduciveness implies a link to reality; reliability implies a link to outcomes. We can track outcomes without settling the reality question. A map can be reliable for navigation without being a true picture of the territory's metaphysics. I define reliability operationally: a mathematical practice is reliable if its application to empirical inputs yields empirically validated outputs. This avoids circularity because it references only empirical success, not mathematical truth. It is a functional definition, not a semantic one.

  **Naturalist Empiricist**
  *What about unused mathematics? If warrant comes from exercise, why does unused math work later?*
  **Severity:** Survivable. **Weakness:** Derivative warrant is vague compared to direct exercise.
  Reply: Unused math acquires derivative warrant through inferential entanglement with exercised parts. Mathematics is a connected web; if the core is reliable, the extensions inherit that reliability provisionally. When unused math is eventually applied, it moves from derivative to direct warrant. This explains why it works without claiming it was always warranted strongly. The warrant is uneven, matching the history of application. This is not a bug; it reflects the empirical basis of the view. We do not need to justify all math equally, only the math we use. The success of unused math later confirms the entanglement, not the prior truth. It validates the web's connectivity, not the independent truth of the nodes. This preserves the empirical constraint while accounting for mathematical unity.

  **Constructivist**
  *Reliability sounds like constructive provability. Are you smuggling in constructivism without the rigor?*
  **Severity:** Survivable. **Weakness:** May alienate classical mathematicians if confused with constructivism.
  Reply: No, reliability is empirical, not proof-theoretic. Constructivism demands internal proof standards; I demand external empirical validation. A classical proof can be reliable on my view if it yields successful predictions. I am not changing mathematical practice, only interpreting its justification. You can keep classical logic; I just won't call it true based on science alone. This view is neutral on internal mathematical standards. It only concerns the bridge to science. Your rigor is internal to math; my reliability is external to practice. We are talking past each other slightly. I respect your standards but locate warrant in application, not derivation. This allows classical math to remain reliable without committing to platonist truth. It is a pragmatic endorsement, not a foundational change.

  **Grad Student**
  *Isn't appealing to mathematical practice just appealing to intuition sociologically? How is that empirical?*
  **Severity:** Soft. **Weakness:** Risks conflating sociological consensus with empirical validation.
  Reply: I am not appealing to what mathematicians feel; I am appealing to what engineers build. Practice here means application in physical systems, not professional consensus. The warrant comes from the bridge standing up, not the mathematician nodding. Intuition is psychological; reliability is causal. We track the success of the output in the world, not the acceptance in the community. This is strictly empirical. The sociological element is irrelevant unless it correlates with physical success. I am not using experimental philosophy data; I am using engineering data. The distinction is crucial. My view avoids the intuition trap by grounding warrant in physical validation, not professional agreement. This keeps the view naturalistic and avoids the graduate student's worry about folk psychology.

  **The load-bearing reply**

  This answer belongs to the **Naturalist Empiricist** objection regarding reliability versus truth-conduciveness. For the talk to be judged a success, I must convince the room that reliability is a substantive alternative to truth, not a synonym. If reliability collapses into truth, the view offers no advantage over standard realism. If it holds, I have broken the indispensability argument without sacrificing empiricism. The room cares about content: what this rules out. It rules out the inference from success to ontology. It predicts uneven warrant across mathematics. It costs us the comfort of knowing math is true, but saves us from metaphysical commitment.

  The one-sentence version I must produce is: *Reliability explains the non-accidental success of mathematics through stable practice without requiring the metaphysical commitment to truth that realism demands.*

  If I can land this distinction, the Quineans cannot force holism onto ontology, and the Platonist cannot force ontology onto justification. This is the pivot point. Everything else depends on this gap being real and defensible. I must not let them close it with a definitional stipulation. I must hold the line that science needs only the tool to work, not the description to be true. This is the core content of the view.

  **The question I am hoping nobody asks**

  *If mathematical reliability is contingent on empirical success, how do you account for the modal force or necessity we attribute to mathematical claims?*

  This is worse than the ranked list because it attacks the phenomenology of mathematical experience directly. The ranked objections challenge the justification mechanism; this challenges the very nature of the subject matter. If math is only reliably successful, it seems contingent. But mathematics feels necessary. If I say it is contingent, I contradict the mathematicians in the joint programs. If I say it is necessary, I seem to reintroduce the truth I claimed to avoid.

  There is no good answer ready. The least bad answer is to distinguish epistemic necessity from metaphysical necessity. We treat math as necessary because any reliable practice must be stable, but this stability is a fact about our world, not abstract reality. However, this may sound like a dodge. An honest account is that my view sacrifices modal force for empirical grounding. I must admit this cost. I cannot have both full empiricist warrant and full mathematical necessity. I choose warrant. This admits a significant limitation of the view that might undermine its appeal to those who value mathematical certainty. I should prepare to admit this trade-off explicitly if pressed.
