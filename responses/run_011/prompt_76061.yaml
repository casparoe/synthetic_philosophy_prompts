answer: |-
  Here is the principle that underlies your gut verdicts, the necessary sacrifice to keep it clean, and the ruling on your unsettled cases.

  ### The Principle: Historical Agency

  **A system is alive if it expends energy to maintain its pattern against entropy, specifically because that pattern carries a historical mandate to persist.**

  This distinguishes your "alive" cases from your "not alive" cases not by what they *do* (crystals grow, dunes repair), but by *why* they do it.
  *   **Physics/Chemistry** systems (Dunes, Weather, Crystal) settle into shapes because it is the path of least resistance *right now*. If the wind stops, the dune remains. They are in equilibrium with their environment.
  *   **Living** systems (Reef, Woman, Replicator) maintain shapes that are *not* the path of least resistance. They fight equilibrium. They do this because they carry information (DNA, memory, code) that was selected in the *past* for the specific purpose of continuing into the *future*.

  ### Mapping Your Verdicts

  *   **The Reef (Alive):** Buys the **Historical Mandate** clause. It grows slowly, but its structure is a record of evolutionary selection, not just mineral precipitation.
  *   **The Dunes (Not Alive):** Buys the **Equilibrium** clause. They look like they are repairing, but they are just sand finding the lowest energy state allowed by the wind. No history, just physics.
  *   **The Uploaded Woman (Alive):** Buys the **Pattern Maintenance** clause. She is fighting data-decay and oblivion using a preserved identity (history) to justify the energy expenditure.
  *   **The Weather (Not Alive):** Buys the **Equilibrium** clause. The eddies are thermodynamic inevitabilities, not defended patterns.
  *   **The Crystal (Not Alive):** Buys the **Equilibrium** clause. It grows because chemistry demands it, not because the crystal "wants" to.
  *   **The City (Characters say No / Prose says Yes):** This is your thematic friction. Under this principle, the City **is Alive**. It metabolizes and repairs based on a "street plan" (historical mandate/design) against the entropy of decay. The characters are denying it; your prose is recognizing it.

  ### The Sacrifice for Simplicity

  To keep this principle from becoming baroque, you must overturn your verdict on **The Bare Replicator**.

  Currently, you say: *"Not alive on its own, alive while it's inside somebody."*
  This is a contextual definition, which weakens the principle. A seed is not "not alive" in the packet and "alive" in the soil. It is dormant, then active. The Historical Mandate is in the code, regardless of the host.
  **The Fix:** Declare it **Alive** (dormant) at all times, or **Not Alive** (a tool) at all times. Given your acceptance of the Reef (which does nothing visible) and the Woman (who is digital), consistency demands you call the Replicator **Alive**. It carries the Historical Mandate. The host is just the soil.

  ### The Two Unsettled Cases

  **1. The Creature Stitched from Dead Tissue**
  **Verdict: Alive.**
  **Reasoning:** The moment it metabolizes "under its own steam," it has crossed from *mechanism* to *system*. Even if the tissue was dead, the new configuration is now expending energy to maintain a pattern against entropy. It has established a new Historical Mandate (even if that history is only seconds old). It is no longer relying on the environment to hold it together; it is doing the work itself.

  **2. The Swarm (Individuals fail, Whole passes)**
  **Verdict: Alive.**
  **Reasoning:** The principle applies to the **System**, not the Component. If the boundary of the "self" is the swarm's edge, and the selection pressure acts on the swarm's survival, then the swarm is the living entity. The individuals are merely cells. This aligns with your Reef (which might be a colony) and your City (which is a collection of parts).

  ### Confidence & Uncertainty

  **Confidence:** 85%
  This principle resolves 90% of your draft's contradictions without resorting to biological pedantry. It honors the thematic weight of your "alive" cases while cleanly excising the false positives (dunes/weather).

  **Least Sure Point:** **The City.**
  I am least sure whether your novel *wants* the City to be alive. Your principle says it is. Your characters say it isn't. Your prose treats it as if it is. This is the only place where the principle creates a conflict with your character dynamics.
  *   **If you keep the principle:** The characters are wrong (perhaps blind to the life around them).
  *   **If you keep the characters:** You must tweak the principle to require *Interiority* (a sense of self), which would kill the Reef (since no one sees it do anything) and complicate the Woman (is she a simulation of self?).
  *   **Recommendation:** Trust the prose. Let the City be alive. Let the characters' denial be a comment on their inability to recognize life that isn't human. It deepens the theme.
