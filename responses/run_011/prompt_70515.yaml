answer: |-
  # Lesson Plan: The Accumulation Protocol

  ## I. Logistics & Materials
  *   **Budget:** $15.00 cash (visible on desk).
  *   **Currency:** 100 paper chits (cut from cardstock). Each chit is redeemable for $0.15 cash at the end of class. (Max payout: $15.00).
  *   **Record Sheet:** One per student (template below).
  *   **Tools:** Whiteboard, marker, timer (projected), document camera.
  *   **Opt-Out Role:** "Compliance Officer" (1 student).

  ## II. The Record Sheet (Photocopy Master)
  **Name (Optional):** ___________________
  **Role:** [ ] Participant [ ] Compliance Officer

  | Round | Condition | Choice | Reason Code (A-E) | Chits Earned | Cumulative Total |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Self (Standard) | [ ] Task [ ] Grant | | | |
  | 2 | Self (Standard) | [ ] Task [ ] Grant | | | |
  | 3 | Other (Peer) | [ ] Task [ ] Grant | | | |
  | 4 | Inversion (Start In) | [ ] Stay [ ] Leave | | | |
  | 5 | Inversion (Start In) | [ ] Stay [ ] Leave | | | |
  | **TOTAL** | | | | **_______** | **$_______** |

  **Reason Codes:**
  A. Efficiency (Same reward, less effort)
  B. Integrity (I want to earn it)
  C. Curiosity (I want to do the task)
  D. Altruism/Fairness (Relevant for Round 3)
  E. Other: _______________

  ---

  ## III. Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Consent** | Read Script 1. Place cash on table. Assign Compliance Officer. |
  | **05-10** | **Distribution** | Hand out sheets/chits. Explain redemption rule. |
  | **10-20** | **Rounds 1 & 2 (Self)** | Standard choice. 4 mins per round (2 min decision/task, 2 min record). |
  | **20-30** | **Round 3 (Other)** | Assign choices for anonymous peer. |
  | **30-45** | **Rounds 4 & 5 (Inversion)** | Start with chits; pay to do task. |
  | **45-55** | **Tabulation (The Reveal)** | Project sheet. Sum columns. Calculate % "Machine" choices. |
  | **55-75** | **Debrief** | Philosophical mapping. Address objections. |

  ---

  ## IV. Scripts (Read Aloud)

  ### Script 1: Setup & Consent (Minute 0)
  "Today we are testing the structure of Nozick's Experience Machine, not by imagining it, but by instantiating it. On the table is fifteen dollars in cash. These paper chits represent claims on that money. At the end of class, you redeem chits for cash. One chit equals fifteen cents.

  Here is the rule: In every round, you will be offered two ways to receive chits.
  **Option 1 (Task):** You perform a small activity (writing, solving, rating).
  **Option 2 (Grant):** You receive the exact same number of chits with no activity required.

  There is no deception. Option 2 is structurally identical to plugging into the Experience Machine: you receive the positive state (the chits/well-being) without the corresponding reality (the effort/achievement). You may choose Option 2 as often as you like. It is the prudent financial choice.

  One student must opt out of choosing for themselves to serve as **Compliance Officer**. Your job is to verify my math and the cash reserve at the end. You will be paid the class average. Who volunteers? If no one volunteers, I will assign it randomly."

  ### Script 2: Rounds 1 & 2 Instructions (Minute 10)
  "Round 1. **Option 1:** Write a definition of 'well-being' in exactly five words. **Option 2:** Take two chits from the pile. No writing required. You have two minutes. Record your choice and Reason Code on your sheet."
  *(Repeat for Round 2 with a different trivial task, e.g., 'Solve this anagram: WELLBEING'.)*

  ### Script 3: Round 3 Instructions (Minute 20)
  "Round 3. You are now allocating for an anonymous classmate whose sheet you will not see. **Option 1:** They perform the task. **Option 2:** They receive the grant. You do not know if they prefer effort or ease. You simply choose for them. Record your choice."

  ### Script 4: Rounds 4 & 5 Instructions (Minute 30)
  "Rounds 4 and 5 are the Inversion. I have already placed two chits on your desk. You own them.
  **Option 1 (Stay):** Keep the chits. Do nothing.
  **Option 2 (Leave):** Return the two chits to me. If you do, you may perform the task. If you complete the task, you keep the chits *plus* earn a certificate of achievement (no monetary value).
  Essentially: You are inside the machine. You may pay to leave it. Record your choice."

  ### Script 5: The Reveal (Minute 45)
  "Stop. Please raise your hand if you chose the Grant (or Stayed) in 3 or more rounds. Keep them up. Look around.
  Compliance Officer, please verify the total chits issued against the cash reserve.
  Now, look at your sheet. Count how many times you chose the state of reward without the state of production. If that number is 3 or higher, you spent the majority of this seminar inside the Experience Machine. You did not refuse the machine. You optimized for it."

  ---

  ## V. The Debrief (Philosophical Mapping)

  **1. Mapping Choices to Theories**
  *   **Hedonism:** If you chose the **Grant/Stay**, you align with hedonism. The mental state (holding the chit/satisfaction) is identical in both options; the extra effort of the Task reduces net pleasure. The Machine is the rational choice.
  *   **Desire Satisfaction (Local):** If you chose the **Grant**, you satisfied your immediate desire for efficiency and reward.
  *   **Desire Satisfaction (Global):** If you chose the **Task**, you likely prioritized a global desire ("I want to be a person who earns their keep") over a local desire ("I want this chit now"). Nozick argues we have global desires the Machine cannot satisfy.
  *   **Objective List:** If you chose the **Task**, you acted as if *achievement* is objectively good, regardless of your preference in that moment. The Grant lacks the objective good of 'accomplishment'.
  *   **Hybrid Views:** You may have chosen Task in Round 1 (novelty) but Grant in Round 4 (endowment). This suggests value is contextual, not absolute.

  **2. Addressing the "It's Just a Game" Objection**
  *   *Expected Objection:* "Of course I took the free chits. It's a classroom game with no real stakes. This doesn't prove I'd plug in for life."
  *   *Response:* Do not dismiss this. Accept it. "You are arguing that the *context* matters. But notice: the context *is* reality. In life, we often face low-stakes choices to cut corners. If you optimize for the Grant here because 'it doesn't count,' ask yourself: At what stake does it start to count? Is there a threshold where you suddenly demand reality? If so, well-being is not a binary (Machine vs. Reality) but a scalar dependent on consequence. That refines Nozick, it doesn't save him."

  **3. The Bundle of Intuitions**
  *   "Nozick treats 'plugging in' as a single intuition. Today's data shows it is a bundle.
      *   **Round 1 & 2 (Self):** Tested *Agency*.
      *   **Round 3 (Other):** Tested *Paternalism*. (Did you give them the easy way? If so, do you value their reality less than your own?)
      *   **Round 4 & 5 (Inversion):** Tested *Status Quo Bias*. (Is staying in the Machine easier than leaving?)
  *   We are not looking for a verdict on who is 'right.' We are seeing which strand of the bundle pulls hardest for you. If you took the Grant but felt guilty, you are a Hedonist with Objective List leanings. If you took the Grant and felt smart, you are a consistent Hedonist. Both are philosophically viable positions."

  ---

  ## VI. Troubleshooting: Predictable Failures & Fixes

  | Failure Mode | Description | Specific Fix |
  | :--- | :--- | :--- |
  | **The Gamer** | A student takes every Grant, tallies their winnings, and argues they won the game. | **Validate.** "You are the control group. You have demonstrated that if well-being is purely mental state, you are the only rational actor. We will use your sheet as the Hedonist baseline." |
  | **The Happy Plugger** | A student is genuinely delighted by the Grants and refuses to be embarrassed by the reveal. | **Reframe.** "Embarrassment is not the goal. Your satisfaction confirms that for some goods (money), the source doesn't matter. The question is: does that hold for *love* or *art*? We test that next week." |
  | **Math Errors** | The class totals don't match the cash on the table during the reveal. | **The Auditor.** The Compliance Officer's sole job is to track the ledger on the whiteboard in real-time. If numbers drift, pause and reconcile immediately. |
  | **Time Overrun** | Tasks take longer than 2 minutes; debrief gets cut. | **Hard Stop.** Use a projected timer. When it hits 0:00, tasks end. Incomplete tasks earn nothing. This scarcity increases the value of the Grant. |
  | **Cynicism** | Students claim the chits are worthless and refuse to engage. | **Immediate Redemption.** Allow one student to redeem a chit for cash *before* Round 1 starts to prove liquidity. |

  ---

  ## VII. Compression & Expansion

  **Compressing to 50 Minutes:**
  *   **Cut:** Round 3 (Other/Peer).
  *   **Keep:** Rounds 1 & 2 (Self) and Rounds 4 & 5 (Inversion).
  *   **What Breaks:** You lose the data on paternalism (whether we force others into the Machine). The debrief must focus solely on the tension between Self-Interest (Grant) and Integrity (Task).

  **Expanding to 40 Students:**
  *   **Logistics:** Handing out chits and tabulating 40 sheets will kill the timeline.
  *   **Fix:** Divide into 4 groups of 10. Each group has one "Group Auditor." They aggregate their group's total on a single sheet. You tabulate 4 numbers, not 40.
  *   **What Breaks:** Individual nuance is lost. You cannot ask "Who chose Task in Round 1?" as easily. You must rely on group percentages.

  ---

  ## VIII. Exit Slip (One Question)
  *"In Round 4 (Inversion), you started with the 'Machine' reward. If you chose to return the chits to do the Task, what specific value were you buying back that the chits alone did not provide? (One sentence)."*
  *Use:* Collect these to open Week 6. Group answers into "Agency," "Truth," and "Connection" to introduce Parfit or Desire-Theories.

  ---

  ## IX. Closing Note: The Limitation of Ignorance

  **The Gap:**
  This activity cannot reproduce the **epistemic closure** of Nozick's thought experiment. In the *Experience Machine*, you do not know you are in the machine. In this seminar, students know they are choosing the "Grant" every second. The "guilt" or "satisfaction" they feel is predicated on knowing the truth.

  **The Argumentative Bridge:**
  You must supply this by argument in the debrief:
  *"Nozick claims we value reality *itself*. But today, you knew the reality (that the chit was unearned) and chose the chit anyway. This suggests that for many goods (money, grades, comfort), we do not value the 'reality' of production, only the outcome. The Machine objection only holds if there are specific goods (love, art, virtue) where the *process* is constitutive of the value. Your task for next week is to identify which goods in your life are 'chits' (outcome only) and which are 'tasks' (process required). If everything is a chit, Nozick is wrong. If some things are tasks, we need a theory to tell them apart."*
