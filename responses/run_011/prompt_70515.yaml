  4.  **Developing the Record Sheet & Tasks:**

      *   Needs to track: Round, Choice (Task vs. Grant), Reason (optional but helpful), Cumulative Score.
      *   Tasks need to be "philosophically relevant" but trivial. E.g., "Define well-being in 5 words," "Solve this anagram," "Rate your current mood."
      *   Grants: "Receive 5 credits without task."

  5.  **Addressing the Comparison Conditions:**

      *   *Self:* Standard Nozick proxy.
      *   *Other:* Does paternalism change the intuition? (If I choose for you, do I give you the easy way?)
