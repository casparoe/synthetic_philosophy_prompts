  2.  **Deconstruct the Core Mechanism (The "Decomposition"):**

      *   *Challenge:* How to make "plugging in" happen without deception?
      *   *Solution:* Frame it as "Efficiency Optimization." Each round offers a task (puzzle, writing, drawing) vs. a "grant" (same reward, no task).
      *   *Currency:* Candy is too childish. Cash is awkward. *Raffle Tickets* for a specific prize (e.g., a $20 bookstore gift card + a bag of nice coffee/tea) work well. It's tangible, tradeable, and low-stakes. Budget: $15 allows for ~$20 prize + small individual treats if needed, but raffle is better for "value." Let's use "Credits" redeemable for a raffle at the end.
      *   *Rounds:* Need enough rounds to show accumulation. 5 rounds seems right for 75 mins.
      *   *Conditions:*
