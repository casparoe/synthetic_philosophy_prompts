answer: |-
  Your observation cuts directly to the heart of the "Causal Exclusion Problem" but reframes it through the lens of control and access rather than pure ontology. You are describing a structure where high-level variables function as **control interfaces** that are causally efficacious via manipulation but causally inert regarding energy transfer. This tension is well-known, but your specific emphasis on the *agent's epistemic access* as a condition for the "handle-ness" adds a pragmatic layer often omitted in metaphysical debates.

  Here is an analysis of the nearest concepts, followed by the boundary cases and the required JSON summary.

  ### Candidate Concepts

  **1. Interventionist Causation**
  *   **Origin:** James Woodward (Philosophy of Science).
  *   **Core Claim:** X causes Y if and only if an intervention on X changes Y, holding other relevant factors fixed.
  *   **Fit:** Close.
  *   **Difference:** Woodward defines causation by the *possibility* of intervention, not the *ease* or *accessibility* for a specific agent. Your pattern highlights that the high-level variable is a *better* handle for *us* than the low-level one, even if both are theoretically interventionable. Woodward's framework validates the high-level cause but doesn't fully explain the asymmetry of *practical* control you observe.

  **2. Multiple Realizability**
  *   **Origin:** Hilary Putnam, Jerry Fodor (Philosophy of Mind).
  *   **Core Claim:** High-level states (like "belief" or "temperature setting") can be realized by many different physical substrates.
  *   **Fit:** Partial.
  *   **Difference:** This explains why your dial works regardless of the boiler's mechanism (substrate independence). However, it is an ontological claim about states, not a dynamic claim about *control*. It explains why the high-level description survives replacement, but not why it functions as a locus of control while lacking force.

  **3. Downward Constraint**
  *   **Origin:** Alicia Juarrero (Philosophy of Action/Complex Systems).
  *   **Core Claim:** High-level patterns do not "push" low-level elements but constrain their degrees of freedom, channeling energy rather than supplying it.
  *   **Fit:** Close.
  *   **Difference:** This captures your "locus of control but not source of force" distinction perfectly. However, Juarrero focuses on the system's internal dynamics. Your pattern adds the external agent's relation: the constraint is only a "handle" relative to an agent who knows the high-level description.

  **4. Affordance**
  *   **Origin:** J.J. Gibson (Ecological Psychology).
  *   **Core Claim:** The environment offers action possibilities to an agent based on the agent's capabilities.
  *   **Fit:** Partial.
  *   **Difference:** This captures the "property of my relation to the system" intuition. A dial affords turning. However, "affordance" is usually perceptual and behavioral, not strictly causal. It explains why you *can* grab it, but not the metaphysical status of the causation once grabbed.

  ### The Split: Force vs. Control

  Your intuition split ("no force = no cause" vs. "reliable setting = cause") arises from conflating **energy transfer** with **informational constraint**. In physics, cause is often modeled as force (energy/momentum transfer). In control theory and information theory, cause is modeled as signal (constraint on probability spaces). Your pattern suggests the split should be redrawn: the low level provides the *power* (energy), while the high level provides the *program* (constraint). Neither is the sole "cause"; they are complementary necessary conditions. The high-level variable is a cause in the sense of a *difference-maker* (Woodward), not a *force-provider* (Newton).

  ### Boundary Cases

  **1. The Spreadsheet Cell**
  *   **Verdict:** Out (Does not exhibit the pattern).
  *   **Reason:** The asymmetry collapses. In a spreadsheet, the high-level label ('Revenue') and the low-level memory address are functionally transparent to the user. Editing the cell *is* editing the memory via a direct interface. There is no "swarming chaos" hidden below that requires a summary description to manage; the abstraction layer is thin enough that the "handle" and the "mechanism" are accessed simultaneously.

  **2. The Printed Listing**
  *   **Verdict:** Out (Does not exhibit the pattern).
  *   **Reason:** While the high-level description is available, there is no causal coupling. You can edit the paper, but it does not loop back to change the program's execution. It lacks the feedback mechanism required for the variable to be a "locus of control." It is a map, not a control interface.

  **3. The Flyball Governor**
  *   **Verdict:** Borderline.
  *   **Reason:** This is a case of direct mechanical feedback. The variable 'speed' moves the valve, but it does so through physical linkage driven by the engine's own energy. It blurs your distinction because the "handle" (the balls) is physically coupled to the "force" (the steam pressure via the valve). It is a handle that is *also* a source of mechanical resistance, unlike the dial which is purely informational/constraint-based.

  ### Conclusion

  The configuration you describe is best understood as an **Epistemic Leverage Point**. It is not merely that the high level supervenes on the low; it is that the high level offers a compression of complexity that aligns with the agent's cognitive bandwidth, allowing for reliable intervention where low-level intervention would be computationally or physically intractable. The "handle-ness" is indeed a relational property between the system's structure and the agent's access.

