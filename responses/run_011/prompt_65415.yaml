      *   Actually, the core is that the *value* was constituted by the *consensus*. When consensus breaks, value goes to zero, and the past valuation looks like an error.
      *   Term: *Constitutive Amnesia*.
      *   Definition: The loss of access to a past attitude that was sustained solely by the perceived continuity of a social norm, resulting in the inability to reconstruct the prior motivation once the norm collapses.
