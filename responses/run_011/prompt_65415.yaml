answer: |-
  - **Short answer**
  Yes, this is best understood as a single phenomenon rather than two separate ones: the attitude was not merely regulated by the norm but *constituted* by it, meaning the motivation existed only within the social feedback loop. The established term for the collapse (a) is **Pluralistic Ignorance** leading to a **Norm Cascade**, while the memory revision (b) is a specific form of **Preference Falsification** where the "false" preference is pruned from self-narrative once the social cost vanishes. Together, they describe a state where the value of an action is purely intersubjective, so when the consensus breaks, the past valuation becomes cognitively inaccessible rather than just embarrassing.

  - **Nearest concepts**

  **1. Pluralistic Ignorance**
  This occurs when a majority of group members privately reject a norm but incorrectly assume that most others accept it, leading them to go along with it. This fits your parking lot story perfectly for phase (a): the seniors participated because they believed the *group* valued the tradition, not necessarily the act itself. However, standard pluralistic ignorance usually explains the *maintenance* of the norm, not the memory wipe in phase (b). A clean example would be a meeting where no one asks questions because everyone thinks everyone else understands, but later everyone admits they were confused; it doesn't necessarily require them to forget they were confused in the moment.

  **2. Preference Falsification (Timur Kuran)**
  This concept describes when people publicly support a norm they privately dislike to avoid social sanctions, eventually leading to a sudden collapse when the perceived cost of dissent drops. This bridges (a) and (b) better than most theories: the "hype" texts were a form of falsification that may have become internalized temporarily. It fits the "no argument" collapse, but Kuran's model usually assumes people *know* they are lying. Your description suggests the seniors aren't lying now; they genuinely can't access the old feeling. A clean example is a population suddenly admitting they hated a dictator they previously cheered; they usually admit they were afraid, not that they forget the fear.

  **3. Norm Cascade / Tipping Point (Cass Sunstein)**
  This describes the rapid phase transition where a norm becomes unsustainable once a certain threshold of people stop following it. This explains the speed of the parking lot death ("within two weeks the whole thing was dead") without the need for formal rules or arguments. It fits the mechanics of the collapse but is silent on the psychology of the aftermath. A clean example is a fashion trend vanishing overnight; people stop wearing the clothes, but they don't necessarily lose the memory of why they liked them—they just look dated.

  **4. Socially Situated Cognition**
  This psychological framework argues that thinking and valuation are not just internal processes but are distributed across the social environment. This explains phase (b) best: the "attitude" wasn't in their heads alone, it was in the network of texts, the parking lot chain, and the shared expectation. When the network dissolved, the cognitive scaffold supporting that attitude vanished, making it "unreconstructable." It fits the feeling that the reason "stopped making sense." A clean example would be a gamer losing all interest in a game the moment their guild disbands, unable to explain why they ever found the mechanics fun.

  **5. Hindsight Bias (Creeping Determinism)**
  This is the tendency to see past events as having been more predictable than they actually were, often rewriting memory to match current knowledge. This partially fits the "I always knew it was stupid" claim, as their current knowledge (the norm is dead) rewrites the past. However, hindsight bias usually applies to *predictions* ("I knew they would lose"), not *valuations* ("I knew this was stupid"). A clean example is a student saying "I knew that test would be hard" after failing it, despite having said earlier they were confident; they still remember being confident, they just reinterpret the signs.

  - **The edges**
  For this to *not* be the phenomenon you're describing, the collapse would need to rely on external coercion or genuine moral persuasion. If the school had threatened suspension and the seniors stopped out of fear, but privately still thought the tradition was cool, that is suppression, not dissolution. Similarly, if a respected student leader gave a speech convincing everyone the tradition was actually harmful, and everyone agreed while remembering their past enthusiasm as "misguided but well-intentioned," that is moral growth. The key boundary is the *accessibility of the past self*: if they can say, "I loved it then, but I see now it was wrong," that is standard maturation. If they say, "I don't understand how anyone could have loved that," the value has been ontologically erased, not just morally rejected.

  Another boundary case is if the behavior continues privately. If the seniors stopped parking in the lot but still grilled together in small groups, the norm would have changed, not collapsed. The phenomenon you are noticing requires the *meaning* of the act to vanish entirely. If the insult your cousins used became "cringe" but they still used it ironically, the norm has shifted to irony, not dissolved. The specific thing you are tracking is the total evaporation of the motivational logic, leaving a gap in their own biography they cannot explain.

  - **Name it**
  **Constitutive Amnesia**
  This term defines the inability to reconstruct a past attitude or motivation that was sustained solely by the perceived continuity of a social norm, occurring after that norm has collapsed without external enforcement. It deliberately excludes simple lying, moral growth, or standard memory decay; it applies only when the *value* of the past action was generated by the group consensus itself, such that the dissolution of the consensus renders the past valuation cognitively void rather than just incorrect.
