      *   *Section 1: The Mechanism (Reason vs. Empathy).* Explain that for Singer, empathy is parochial (tribal). Reason is universalizing. We use reason to override empathy's limits.
      *   *Section 2: Compassion Fatigue/Algorithms.* If the engine is reason, algorithms are an obstacle to *clarity*, not just feelings. Compassion fatigue affects charity, not necessarily moral *truth*. Singer would argue we need better systems, not just more feelings.
