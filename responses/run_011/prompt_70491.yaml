      *   *Singer's Solution:* This is the strongest evidence that empathy *isn't* the main engine.
      *   *Animals:* It's about *sentience* and *interests*, not cuteness or connection. Reason dictates that suffering is bad, regardless of the species.
      *   *Future People:* It's about logical consistency. If my life matters, why doesn't theirs? (The "point of view of the universe" concept).
      *   *Key Concept:* "The Pontifex Maximus of Reason" (Sidgwick influence). Universalizability.

  5.  **Drafting the Response (Iterative Process):**

