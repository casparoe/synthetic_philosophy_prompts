prompt: |-
  Book club thing, and I want to make sure I've actually got Singer's mechanism right. My read: the expanding circle runs on empathy — we read novels, travel, scroll past other people's lives, our sympathies widen, so the circle of who counts gets bigger. If that's the engine, doesn't compasion fatigue plus outrage algorithms mean the circle is contracting right now, i.e. moral progress is basically over? Is there any way to pump the empathy back up, or does Singer just have to bite that bullet? And separately — if it really is empathy doing the work, how does he explain the circle stretching out to cover things nobody feels much of anything about, like people alive in 2300 or factory-farmed chickens?
reasoning: |-
