answer: |-
  You are wrestling with the **Map-Territory Relation** and **Counterfactual Sensitivity**. You aren't asking about physics; you're asking about *abstraction boundaries*.

  Here is the principle that matches your gut, broken into three clauses.

  ### The Principle

  1.  **Representation:** The physical states must be treated as *symbols* standing for abstract values, not just physical quantities.
  2.  **Derivation:** The output must be causally produced by rule-based transformations *at the time of the query*, not retrieved from a static mapping.
  3.  **Finitude:** The distinct states and steps must be physically distinguishable within finite energy and time bounds.

  ### Why You Are Committed to This (Case Mapping)

  *   **Clause 1 (Representation) is forced by Case 4.**
      A real pendulum is just mass moving. It doesn't "know" it's solving a differential equation. A simulation manipulates variables *representing* mass and position. You called the pendulum "measuring" and the simulation "computing." The difference is that the simulation operates on a *map* of the territory, not the territory itself. Without an encoding scheme, physics is just physics.
  *   **Clause 2 (Derivation) is forced by Case 1 vs. Case 2 & 6.**
      This is the core of your itch. In Case 1 (Lookup Table), the causal chain between input and output was severed at query time; the work happened in the past. In Case 2 (Human) and Case 6 (Long Program), the output *depends* on the specific chain of state transitions happening *now*. If you change the input, the process must *run* differently to find the new answer. Computation is the *act* of deriving, not the *possession* of the result.
  *   **Clause 3 (Finitude) is forced by Case 7 & 8.**
      Case 7 (Infinite Precision): If you allow infinite precision, you can hide infinite information in a single physical state (e.g., the exact voltage). That bypasses the "work" of processing. You correctly identified this as "smuggling." Computation requires discretization (bits) so that noise doesn't destroy the signal.
      Case 8 (Zeno Machine): This clause kills the "infinite steps in finite time" loophole. Physics imposes a minimum time/energy cost per distinct state change (Landauer's principle, Planck time). If you can't physically distinguish the steps, they didn't happen.

  ### The Verdict on Case 8 (The Zeno Loop)

  **It is not computing, because it is physically impossible.**
  Your gut is right: you can't build it. To halve the time per iteration indefinitely, you need infinite bandwidth and infinite energy density. At some point, your switch becomes smaller than an atom or faster than light can cross it. The description "cheats" by assuming a continuous spacetime that allows infinite subdivision without cost. In our universe, information processing is thermodynamic work. Infinite steps require infinite work.

  ### One Further Case: The Rock

  **Case 9:** A rock sitting in the sun. I define a mapping where the temperature of the rock at time *t* represents the output of a complex function.
  **Verdict:** **Not computing.**
  **Why:** It fails Clause 1 and 2. The rock isn't manipulating symbols; it's just heating up. The "computation" exists only in your head, not in the causal structure of the rock. If you change the "input" (the function you want to solve), the rock doesn't change its behavior. This protects you from **Pancomputationalism** (the idea that *everything* is a computer, which makes the word "computer" useless).

  ### The Sacrifice

  I cannot save **Case 4 (The Pendulum)** without making the definition baroque.
  There is a rival view called *structural realism* which argues the pendulum *is* computing its own trajectory because its physical structure is isomorphic to the math.
  **To keep your principle simple, you must accept this trade-off:** You are defining computation as an *engineered activity*, not a *natural phenomenon*. If you ever decide that a planetary orbit *is* a computation, you have to drop Clause 1. But if you drop Clause 1, you can't distinguish a simulation from the real thing, which breaks your intuition on Case 4. Stick with Clause 1.

  ### Word vs. World

  **You are asking a question about how you are using a word.**
  There is no "computation particle" in the standard model. Computation is a lens we put on physics to describe systems that are **controllable, composable, and counterfactual**.

  **Why it matters:**
  If you treat it as a fact about the world, you end up in mysticism (e.g., "The universe is a simulation").
  If you treat it as a definition of utility (which it is), it dictates engineering constraints:
  1.  **Error Correction:** If it's computation (Clause 3), you need to fight entropy.
  2.  **Modularity:** If it's computation (Clause 1), you can swap the substrate (meat vs. silicon) without changing the logic.
  3.  **Complexity:** If it's computation (Clause 2), you care about time/space complexity. If it's just a lookup table, you care about storage size.

  **Summary:** You are a **Functionalist** with a **Finite Physicalist** constraint. You believe computation is about *what the system does* (function), not *what it is made of* (substrate), provided the physical costs of doing it are real and finite. Keep that. It's the only stance that lets you ship code.
