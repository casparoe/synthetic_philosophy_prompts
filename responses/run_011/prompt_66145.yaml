answer: |-
  Here is a disambiguation of the claims latent in your colleague's citation, followed by an analysis of the metaphor, the mechanism, the textual tension, and a final assessment of the argument.

  ### I. A Menu of Readings

  Here are four distinct precise claims that can be extracted from the conjunction of the "oil" metaphor and the "no consequence" sentence.

  **1. The Strong Conceptual Veil**
  *   **Assertion:** Money is *by definition* merely a counter used to facilitate exchange; it possesses no utility independent of its use in transaction. To treat it as wealth is a category error, like treating a scorecard as the game itself.
  *   **Type:** Conceptual/Definitional thesis.
  *   **Scope:** Universal. Applies to any token designated as money, in any timeframe, closed or open economy.
  *   **Status:** False. It contradicts the modern (and arguably Humean) recognition that money yields liquidity services and acts as a temporary store of value. It conflates the *function* of money with the *nature* of the asset.
  *   **Dismissal:** Licenses dismissal of **both (a) and (b)**.
  *   **Missing Premises:** To reach this conclusion, your colleague must premise that crypto cannot possess liquidity services or store-of-value utility independent of its medium-of-exchange function, and that "wealth" is defined exclusively as consumable goods or productive capital, excluding claims on them.

  **2. Long-Run Classical Neutrality**
  *   **Assertion:** In equilibrium, a change in the nominal stock of money results in a proportional change in the price level, leaving real variables (output, employment, real wealth) unchanged.
  *   **Type:** Empirical regularity (conditional on equilibrium).
  *   **Scope:** Long run. Requires flexible prices, full employment of resources, and an open economy where arbitrage can function. Applies to sustained changes in the stock.
  *   **Status:** Substantive and defensible as a long-run tendency, but genuinely contested regarding the speed of adjustment and the cost of the transition.
  *   **Dismissal:** Licenses dismissal of **(b)** primarily. Suggests (a) is futile for increasing *real* national income, though not necessarily for holding nominal reserves.
  *   **Missing Premises:** To dismiss (b), the colleague must premise that the policy goal is permanent real growth rather than short-term stabilization. To dismiss (a), he must premise that the state's goal is real income generation rather than balance sheet insulation or geopolitical leverage.

  **3. The Mercantilist Zero-Sum Critique**
  *   **Assertion:** A single nation cannot permanently increase its share of global wealth by accumulating money (specie), because price increases will degrade export competitiveness, causing the money to flow out until equilibrium is restored.
  *   **Type:** Policy prescription / Strategic claim.
  *   **Scope:** Open economy. Specifically addresses the "state acquiring stock" scenario. Relies on specie convertibility and price-sensitive trade balances.
  *   **Status:** True of Hume's object (specie under bimetallism/gold standard) but potentially false of ours (fiat regimes, capital controls, or non-sovereign crypto).
  *   **Dismissal:** Licenses dismissal of **(a)** specifically.
  *   **Missing Premises:** To dismiss (a), the colleague must premise that the cryptoasset functions like specie in international settlement (i.e., it *will* flow out if prices rise) and that the state intends to use it to manipulate trade balances rather than simply hold it as a non-circulating reserve.

  **4. The Short-Run Non-Neutrality (The "Interval" Reading)**
  *   **Assertion:** While money is neutral in the long run, during the "interval" before new money circulates through all ranks and prices adjust, increased money stimulates industry by raising profits before wages and inputs rise.
  *   **Type:** Empirical mechanism.
  *   **Scope:** Short run / Transition period. Applies to sustained rates of growth, not one-off level changes.
  *   **Status:** True to Hume's fuller text; consistent with modern New Keynesian friction models.
  *   **Dismissal:** Licenses dismissal of **neither**. In fact, it potentially supports **(b)**.
  *   **Missing Premises:** None. This reading contradicts your colleague's conclusion. To use this, you would need to premise that the current economy is in a demand shortfall (the "interval" of slack) where prices are sticky.

  ---

  ### II. The Oil-and-Wheels Metaphor

  The metaphor carries a specific exclusionary claim, but it is rhetorical rather than logical.

  *   **What it excludes:** By calling money "oil" and not a "wheel," Hume excludes money from the category of **factors of production** (capital) and **final goods** (consumption). A wheel moves the load; oil merely reduces friction between wheels. The claim is that money yields no *direct* utility (you cannot eat it) and no *productive* service (it does not transform inputs, it only swaps them).
  *   **The Loophole:** The metaphor fails to account for **liquidity services**. In modern theory, holding money (or a liquid asset) provides a flow of utility by reducing transaction costs and mitigating risk. If an asset provides this service, it is not merely "oil"; it is a capital good yielding a return (the liquidity yield).
  *   **The Verdict:** The image is doing work by connotation ("lubricant" implies it is consumed/used up, not stored). It is not an argument. It begs the question against the store-of-value theory. If the cryptoasset in proposal (a) is acquired *to be held* rather than *to be spent*, it is being treated as a "wheel" (a capital asset/reserve), not "oil." The metaphor therefore does not apply to proposal (a) unless your colleague first proves that the asset *must* circulate to have value.

  ### III. The Mechanism vs. The Slogan

  Your colleague treats the proportionality claim ("prices... always proportioned") as analytic. Hume treats it as the outcome of a causal mechanism. The thought experiment (annihilating 4/5 of money) relies on specific premises. If these fail, the slogan fails.

  **The Mechanism's Premises:**
  1.  **Price Flexibility:** Prices of commodities and wages must adjust downward (or upward) without rigidities.
  2.  **Constant Real Output:** The quantity of goods produced is independent of the money stock (Say's Law / Full Employment).
  3.  **Arbitrage:** Goods and specie move freely across borders to equalize prices (Law of One Price).
  4.  **Demand for Money:** The demand for real balances is stable and depends only on transaction volume, not interest rates or uncertainty.

  **Where the Slogan Fails:**
  *   **Sticky Prices:** If prices do not fall when money is annihilated (or rise when expanded), real balances change, affecting consumption and output. This invalidates the "no consequence" claim in the short run.
  *   **Liquidity Traps:** If the demand for money becomes infinite (hoarding), increasing the stock has no effect on prices or output.
  *   **Distributional Effects:** Hume acknowledges money enters at specific points. If new money goes to debtors vs. creditors, or state vs. private sector, real wealth is redistributed even if aggregate prices eventually adjust.

  **Conclusion:** The slogan is a summary of the *equilibrium endpoint* of the mechanism, not a description of the *process*. Your colleague is citing the endpoint to refute a policy concerned with the process.

  ### IV. Internal Tension in Hume's Essay

  You are correct to sense a tension. Hume holds two positions that seem contradictory only if time is ignored.

  1.  **The Long-Run Neutrality:** "Greater or less plenty of money is of no consequence." (Final equilibrium).
  2.  **The Short-Run Stimulus:** "It is only in this interval or intermediate situation... that the encreasing quantity of gold and silver is favourable to industry." (Transition period).

  **Reconciliation:** Hume is consistent if one distinguishes between the *level* of money and the *rate of change* of money.
  *   A high *level* of money (plenty) implies high prices and no real advantage (Neutrality).
  *   A *growing* stock of money (injection) keeps prices slightly ahead of wages, boosting profits and the "spirit of industry" (Non-Neutrality).

  **Is the quoted passage his considered doctrine?**
  Yes, but it is rhetorically compressed. The "no consequence" sentence is the *thesis* of the essay against the Mercantilists, who believed a permanent high stock of specie made a nation permanently powerful. Hume's qualification about the "spirit of industry" is the *concession* to policy. Your colleague is quoting the thesis to refute a policy that relies on the concession.

  ### V. Assessment of the Argument

  **Which reading is your colleague relying on?**
  He is relying on a hybrid of **Reading 1 (Conceptual Veil)** and **Reading 2 (Long-Run Neutrality)**. He is treating the empirical claim of long-run neutrality as a conceptual truth about the nature of money ("oil not wheels").

  **Is he entitled to it?**
  No. He is not entitled to dismiss proposal (b) because Hume explicitly allows for short-run demand management ("spirit of industry"). He is not entitled to dismiss proposal (a) based on the "oil" metaphor because if the asset is held as a reserve, it is functioning as a "wheel" (capital/wealth), not a medium of exchange.

  **Is the fixed-supply asset case inside the slogan's scope?**
  This is the decisive point. **It is likely outside the scope.**
  *   Hume's critique targets money *in circulation*. Mercantilists wanted to accumulate specie to *spend* on armies or trade. Hume argued this would just raise prices and leak out.
  *   Proposal (a) suggests acquiring an asset *to hold* as a store of national wealth (like a strategic petroleum reserve or gold vault).
  *   If the crypto is not intended to circulate as a medium of exchange but to sit in a vault as a reserve asset, it is not "money" in Hume's "oil" sense. It is a commodity.
  *   Hume's neutrality argument applies to the *medium of account*. If the state holds a non-circulating asset, its value depends on global demand for that asset, not just domestic price levels.

  **Where the argument actually stands:**
  Your colleague has deployed a long-run equilibrium condition to refute short-run policy proposals and has misclassified a store-of-value asset as a medium-of-exchange instrument.
  *   **Against (b):** He is ignoring the "interval" Hume describes. To defeat (b), he must argue that prices are perfectly flexible *now* or that the central bank cannot influence real rates *now*. Hume's quote does not prove that.
  *   **Against (a):** He is assuming the crypto must circulate to be valuable. If the state treats it as a non-circulating reserve (a commodity), Hume's "oil" metaphor is a category error. To defeat (a), he must argue that a fixed-supply digital asset cannot function as a store of value (e.g., it will go to zero), which is an empirical claim about crypto, not a philosophical claim about money derived from Hume.

  **Recommendation:**
  Return to the seminar and argue that your colleague is conflating the *equilibrium property* of money (neutrality) with the *ontological status* of money (veil). Point out that Hume's own text validates short-run demand management (proposal b) and that proposal (a) treats the asset as capital (a wheel), not lubricant (oil), placing it outside the scope of the quoted maxim.
