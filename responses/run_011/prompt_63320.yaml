      *   **Source B (Political Scientist):** "Money is speech" = Money is a *resource* convertible into speech (like labor, celebrity). Singling out cash is arbitrary unless cash is distinctive. Argues *for* regulation (presumably to regulate all resources or acknowledge cash's distinctiveness).
      *   **Situation 1 (Volunteer Labor):** Ordinance values labor at hourly wage against caps. Source A says it's a cash cap (speech restriction). Source B says it proves the slogan does no work (regulating resources, not messages).
      *   **Situation 2 (Developer Monopoly):** Developer buys all ad space to silence others. Spends to suppress.
      *   **Journalist's Distinction:** Loudness (reach) vs. Audibility (can be heard at all).
      *   **Equivocation:** Source A shifted from "restricting how much I say" to "forbidden equalization."

  3.  **Brainstorming (Mental Draft):**
      *   What does "Money is Speech" mean?
      *   1. Literal: Writing a check *is* an expressive act (like burning a flag). (Weak, mostly rejected).
      *   2. Instrumental: Money buys amplification. Without money, speech is mute. (Common).
      *   3. Constitutive: Money allows the *existence* of speech that wouldn't exist otherwise. (Spending creates speech).
      *   4. Equivalence: Money *equals* speech in value/weight. (Dangerous).
      *   5. Resource Neutrality: Money is just one resource among many (labor, time). (Source B's angle).
      *   6. Negative Right: Restricting money restricts the *potential* for speech. (Source A's angle).
      *   *Unendorsed/Logical Extreme:* "Money has a viewpoint." (Absurd, but logically possible if money itself communicates). Or "All property is speech." (If spending money is speech, is buying groceries speech? No, only political spending. Why? That's the rub).
