          *   2 is substantive/contested (is the act of giving expressive?).
          *   3 is substantive/contested (Buckley v. Valeo logic).
          *   4 is substantive/defensible (theoretical consistency).
          *   5 is radical/false (conflates wealth with right).
      *   **Point 3 (Source Licensing):**
          *   Source A likes 2 and 3.
          *   Source B likes 4.
          *   Neither likes 5 really, but A leans toward it.
      *   **Point 4 (Equivocation):** Source A's shift.
          *   Move 1: Liberty claim (I can't speak).
          *   Move 2: Equality claim (You can't level down).
