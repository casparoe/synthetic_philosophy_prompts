      *(Refining the Equivocation)*: Source A moves from "Liberty" (I can't speak) to "Equality" (You can't equalize). The First Amendment protects liberty, not equality. The equivocation is using "Speech" to cover "Advantage."

      *(Refining Situation 2)*: If money is speech, buying silence is speech. But is it *protected* speech? The doctrine usually says you have no right to a forum, but if you buy the forum, is it speech? This tests the limit.

