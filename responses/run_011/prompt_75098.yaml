answer: |-
  ### 1. Reconstruction of Moore's Position

  To evaluate the Bloomsbury appropriation, we must first isolate the specific architecture of G. E. Moore's axiology in *Principia Ethica*, specifically Chapter VI. Moore's central claim is that intrinsic value resides exclusively in certain states of consciousness. However, these states are not simple sensations; they are complex organic wholes.

  **Beauty and Cognition**
  For Moore, the appreciation of beauty is not merely the feeling of pleasure caused by an object. It is a whole composed of two essential parts: (1) the cognition of the beautiful object (the belief that certain qualities exist) and (2) the emotional response (admiration or delight) directed at those qualities.
  Moore argues that the emotional component, taken in isolation, has very little intrinsic value. A intense emotion based on a false belief (e.g., admiring a forgery thinking it is a masterpiece) is vastly inferior to a cooler emotion based on true cognition of a genuine beautiful object. The value emerges from the *relation* between the mind and the object. The cognition is not merely a causal trigger; it is a constituent of the valuable state. Without the appropriate cognitive grasp of the object's properties, the "aesthetic experience" is defective.

  **Personal Affection and Friendship**
  Moore applies the same structure to personal affection. The highest goods involve the consciousness of another person's mental qualities (their character, intellect, or capacity for feeling) combined with an emotional response of love or admiration.
  There is a nuance here that is often missed: Moore distinguishes between the *pleasure* of being loved and the *virtue* of the object loved. While affection for a person is good, the *greatest* goods involve affection for persons who possess other intrinsic goods (like virtue or intelligence). However, Moore does allow that personal affection is valuable even if the object is not perfectly virtuous, provided the affection is genuine. The crucial point is that the state involves an *appreciation* of the other's mind, not merely a blind attachment. It is a cognitive-emotional complex.

  **The Doctrine of Organic Wholes**
  This doctrine is the engine of Moore's argument. It states that the value of a whole is not the sum of the values of its parts.
  *   **Part 1 (The Object):** A beautiful object existing without a consciousness to appreciate it has no intrinsic value.
  *   **Part 2 (The Emotion):** An emotion existing without a true object (or directed at a valueless object) has negligible value.
  *   **The Whole:** The consciousness *of* the beautiful object has immense value.
  This implies that you cannot maximize value by maximizing the parts separately. You cannot simply maximize "emotion" or "beautiful objects"; you must maximize the specific *relation* of correct cognition and appropriate feeling. This places a heavy burden on truth and accuracy. If your cognition is false, the organic whole collapses into a lower value tier.

  ### 2. Mapping the Appropriation

  The Bloomsbury Group, mediated through the Apostles, extracted the *ranking* of goods from Moore but largely discarded the *structural conditions* required to achieve them.

  **Retentions and Droppings**
  *   **Retained:** The hierarchy. They accepted that aesthetic appreciation and personal love were the only things that mattered (the "religion" of the ideal). They accepted that material success, public duty, and conventional morality were merely means, and often worthless ones.
  *   **Dropped:** The cognitive requirement and the distinction between means and ends in action. They treated the *state of mind* as something one could inhabit directly, without the rigorous cognitive appraisal Moore demanded. They also discarded Moore's consequentialist account of *right action* (that we must act to bring about the most good), replacing it with an intuitionist immediacy.

  **Question 1: Personal Relations**
  Was the slogan of "personal relations as the supreme good" licensed by Moore?
  *   **Moore's View:** Moore would endorse the ranking but not the Bloomsbury execution. For Moore, the value of friendship depends on the *qualities* of the friend and the *accuracy* of the appreciation.
  *   **Bloomsbury's Deviation:** As exemplified by Forster's later claim (choosing friend over country), the Bloomsbury view tended toward an unconditional loyalty to the *person* regardless of their moral or intellectual worth.
  *   **Verdict:** Moore would likely score the Bloomsbury version lower. If the affection is blind to the friend's flaws (lacking true cognition of the object), or if the friend lacks the qualities that make affection valuable, the organic whole is less valuable. Moore requires the affection to be *appropriate* to the object's value. A loyalty that ignores the object's lack of value is, on Moore's terms, a less valuable state of consciousness than one grounded in truthful appraisal.

  **Question 2: Clive Bell and Aesthetic Emotion**
  Does Moore's cognitive condition commit him against Bell's "significant form"?
  *   **Bell's Theory:** Bell argued for a self-contained "aesthetic emotion" triggered by "significant form," distinct from ordinary life and ordinary cognition.
  *   **Moore's Objection:** Moore insists that the emotion must be *about* the object's properties. If Bell's theory implies that the emotion is a subjective reaction detached from a cognitive grasp of specific properties (treating the emotion as the sole locus of value), Moore would reject it.
  *   **Survival of Bell's Project:** Bell's project survives only if "significant form" is treated as a real property of the object that is *cognized*. If Bell treats the emotion as a self-validating state independent of the object's specific nature, he violates the organic whole doctrine. Given Bell's emphasis on the emotion itself as the marker of art, he likely drifted into the error Moore warned against: valuing the emotional part over the cognitive whole. Thus, much of Bell's specific theoretical edifice is a distortion of Moore, even if inspired by him.

  ### 3. Adjudicating the Diagnoses

  We have two diagnoses for the failure of the Bloomsbury project as described by Keynes.

  *   **Diagnosis A (Transmission Failure):** The Bloomsbury group failed to understand the *axiology*. They prized states that Moore would deem inferior because they lacked the necessary cognitive component. The theory is vindicated because the states they actually achieved were less valuable than the states Moore described.
  *   **Diagnosis B (Abridgment):** The Bloomsbury group understood the *axiology* well enough but failed to integrate it with a theory of *obligation*. They ignored Moore's casuistry (rules, consequences, probability). The failure was political and practical, not necessarily a failure to experience value.

  **Verdict:**
  Diagnosis **B** better fits the record as described, specifically regarding Keynes's critique.
  Keynes's complaint is not primarily that their art was bad or their friendships shallow (though he implies immaturity). His complaint is that they were "unequipped for the political world of the 1930s." This is a failure of *action*, not necessarily a failure of *appreciation*. Moore's *Principia* separates the definition of "good" (Chapter VI) from the definition of "right" (Chapter IV and V). Moore argues that "right" is defined by producing the best consequences. Bloomsbury absorbed the "good" (states of mind) but discarded the "right" (maximizing consequences through rules and calculation).
  Therefore, the episode is evidence about the danger of severing a theory of value from a theory of obligation.

  **Evidence for Diagnosis A:**
  To support Diagnosis A, one would need evidence that Bloomsbury's aesthetic experiences were demonstrably shallow or their friendships demonstrably false *by Moore's specific criteria*. For example, if it could be shown that their appreciation of art was based on fashion rather than cognitive grasp of form, or their friendships on vanity rather than appreciation of character. While plausible, Keynes's specific retrospective focuses on their inability to handle *consequences* and *public duty*, which points to the theory of obligation (Diagnosis B). Diagnosis A explains why their philosophy was bad philosophy; Diagnosis B explains why their lives were politically disastrous.

  ### 4. Reversing the Direction: Keynes on Moore

  Keynes's complaint is that a morality focused on states of mind and personal affections left adherents unable to cope with institutions, violence, and large-scale consequences.

  **Where the Complaint Lands**
  This complaint lands squarely on Moore's theory of **right action**, not his theory of **beauty and friendship**.
  Moore's theory of value (Chapter VI) says *what* is worth having. His theory of right (consequentialist) says we must calculate how to get it. Bloomsbury ignored the calculation. They assumed that by cultivating the right states of mind, the right outcomes would follow, or that outcomes didn't matter. Keynes is pointing out that Moore's consequentialism (which demands we look at outcomes) was discarded by his followers, leaving them with a value theory that had no engine for political engagement. Moore himself would agree with Keynes: if you ignore consequences, you are not following Moore's ethics, even if you quote his list of goods.

  **Moore's Resources for Self-Diagnosis**
  Moore has the resources to diagnose the misreading from inside the theory. He explicitly distinguishes between:
  1.  What is good in itself (states of consciousness).
  2.  What we ought to do (actions that cause those states).
  He can argue that Bloomsbury conflated the two. They treated the *end* as if it were the *method*. Moore can say: "You correctly identified the destination, but you refused to use the map (casuistry/consequences) to get there."

  **Three Silences in the Theory**
  However, there are places where Moore is silent, and where the theory strains under the weight of the episode:

  1.  **Agent-Relative Duties:** Moore is a consequentialist. He argues we ought to produce the *most* good overall. He does not easily generate a duty to prioritize *my* friend over a stranger if the stranger would produce more good. Bloomsbury (and Forster) assumed special duties to friends were absolute. Moore's theory is silent on how to justify agent-relative preferences within a maximizing framework. It cannot easily validate Forster's choice to betray country for friend unless that specific act produces the most global good, which is unlikely in a political crisis.
  2.  **Material and Political Preconditions:** Moore focuses on the internal state of consciousness. He is largely silent on the external, institutional structures required to protect those states. He does not theorize the "enclave." The theory assumes the possibility of aesthetic life but does not account for the violence that can destroy the conditions making it possible. It treats the political world as mere "means," failing to see that some means (institutions, laws) are constitutive of the safety required for the "ends."
  3.  **The Unreliable Object:** Moore assumes the subject can cognize the object's value. He is silent on what happens when the object of affection (the friend) is an unreliable reporter on their own qualities, or when the friend demands loyalty that conflicts with truth. Moore's theory requires true cognition for the highest value. If maintaining the friendship requires accepting a lie about the friend's character, Moore's theory creates a tension it does not resolve: pursue the truth (and risk the affection) or pursue the affection (and lower the cognitive value)? Bloomsbury chose the latter; Moore's text does not explicitly forbid it, but it implies the resulting state is less valuable.

  ### 5. Conclusion

  **What the Episode Settles:**
  This episode strongly settles that Moore's view of beauty and friendship is **not subjectivist**. It cannot be reduced to "whatever feels intense is good." The Bloomsbury failure to maintain the cognitive rigor Moore demanded demonstrates that without the objective component (the true cognition of the object), the "Moorean" state collapses into something Moore would rate significantly lower. The theory requires a fit between mind and world, not just intensity of mind.

  **What the Episode Leaves Open:**
  The episode leaves genuinely open whether a **consequentialist framework can sustain the special duties** that Moore's own list of goods seems to require. Moore prizes personal affection as one of the greatest goods, yet his theory of obligation requires us to maximize good impersonally. The Bloomsbury experience suggests that in practice, people cannot maintain the deep personal affections Moore prizes if they are constantly required to calculate their utility against the needs of the state or the general population. Moore's theory does not resolve whether the "greatest goods" are compatible with the "greatest obligation."
