      *   *Prov 1 (Final Intentions):* Reading text = author's final intentions. Last supervised version is copy-text.
      *   *Prov 2 (Coercion Exception):* Restoring cuts made under publisher threat. Free revisions stand even if bad.
      *   *Prov 3 (Accidentals):* Spelling/punctuation/paragraphing silently conformed to house style. Justification: not meaning-bearing, compositor noise.
      *   *Prov 4 (Interpretive Intro):* Introductions argue her punctuation/paragraphing *are* interpretively decisive.
      *   *Prov 5 (Letters):* Diplomatic transcription (exact). Reason: Letter = Document, Novel = Work.
      *   *Prov 6 (Correspondence):* Letters used for meaning in interpretive intros, but only for production history in editorial intro.

  3.  **Drafting the Response - Section by Section:**

      *   **(a) Theory of Meaning and Intention (Provs 1 & 2):**
          *   *Question:* Does text mean = maker willed? Or is it just best evidence of authorized artifact?
          *   *Analysis:* Prov 1 says "final intentions." This sounds like intentionalism. But Prov 2 complicates it. If meaning were just public language artifact, the publisher's cut would be part of the artifact. The fact that they restore it means they care about the *source* of the change, not just the final state.
          *   *Distinction:* "Intentionalism" (meaning is what author meant) vs. "Authorization" (meaning is what author allowed).
          *   *Verdict:* The practice *requires* a specific kind of intentionalism. It's not just "best evidence." If it were just about the authorized artifact, the coerced cut *is* authorized (she signed off). The restoration implies the signature doesn't count if the will was compromised. So, it presupposes that meaning is tied to the *uncoerced will*, not just the public mark.
          *   *Underdetermination:* Where no coercion exists, the two theories look the same. The divergence is only at the margins of coercion.

      *   **(b) The Will and Coercion (Prov 2):**
          *   *Question:* Coerced cut vs. compositor error. Theory of will required?
          *   *Analysis:* A compositor changes text without author knowledge. A publisher threatens suit; author changes text to avoid suit. Technically, the author moved the pen.
          *   *Theory of Will:* Requires a distinction between "internal" and "external" motivation. Or "authentic" vs. "inauthentic" will. It treats economic/legal pressure as analogous to physical interference (compositor).
          *   *Commitment:* The project is committed to a Romantic/Expressive theory of the self. The "true" author is the one writing freely, not the one negotiating contracts. It assumes we can distinguish "her choice" from "the market's choice" inside her head.
          *   *Strain:* The analogy is strained. She *chose* to cut. But the editorial policy treats her as a victim of the cut, not the agent. This requires a theory of duress that invalidates consent.

      *   **(c) Accidentals and Contradiction (Provs 3 & 4):**
          *   *Question:* Flat contradiction? Relation between marks and meaning?
          *   *Analysis:* Prov 3 says punctuation doesn't bear meaning (mostly). Prov 4 says punctuation *is* interpretively decisive.
          *   *Is it a contradiction?* Yes, functionally. If Prov 4 is true, Prov 3 destroys the object of study.
          *   *Condition for non-contradiction:* Only if "her punctuation" (Prov 4) refers to *substantive* rhythm not captured by standard marks, OR if Prov 3 is a lie/convenience. But Prov 3 says "paragraphing" is standardized. Prov 4 says "refusal to break paragraphs" is decisive. This is a direct clash.
          *   *Which text is the work?* If the reading text has standardized punctuation, but the meaning relies on original punctuation, the reading text is *not* the work being interpreted. The "work" exists in the apparatus or the manuscript, not the reading text. The edition is schizophrenic.

      *   **(d) Letters vs. Novels (Prov 5):**
          *   *Question:* Document vs. Work. Substantive distinction or convenience? Consistency?
          *   *Analysis:* Novel = Work (ideal, intentional, finalized). Letter = Document (historical, ephemeral, process).
          *   *Theory:* Ontological distinction. A novel is an aesthetic object transcending its instances. A letter is a speech-act tied to a specific moment and material instance.
          *   *Smuggling Intentionalism?* Yes. By calling the novel a "work," you invoke the author's shaping hand. By calling the letter a "document," you excuse the lack of shaping.
          *   *Consistency:* It is consistent *if* you accept the ontological split. But it risks inconsistency if the letters contain crucial intentional statements about the novels (see Prov 6).
          *   *Identity:* The novel is an *type* (abstract); the letter is a *token* (concrete).

      *   **(e) Correspondence and Meaning (Prov 6):**
          *   *Question:* Testify to meaning in one place, bar in another. Principled line?
          *   *Analysis:* Editorial Intro (bibliographic) vs. Interpretive Intro (literary).
          *   *Line:* "Genetic" meaning (how text came to be) vs. "Hermeneutic" meaning (what text signifies).
          *   *Collapse:* If the author says "I meant X," that is evidence of intention (Editorial) AND evidence of meaning (Interpretive). Separating them is artificial.
          *   *Verdict:* The distinction is bureaucratic, not philosophical. It protects the "objective" editorial intro from the "subjective" interpretive intro. It collapses under scrutiny because authorial testimony bridges both.

      *   **(f) Rival Theories and Concrete Changes:**
          *   *Rival 1: Versioning (Social Text/Scholarly Editing).* Work exists in versions.
              *   *Change:* No single reading text. Parallel texts or clear indication of versions. Apparatus becomes main event.
