answer: |-
  Your tentative rule is intuitive, but it collapses under the weight of **power**.

  "Standing" is a legalistic, individual metric. It works for the uncharged arrest (no standing impacted) and the councilman (public standing impacted). But it fails the street renaming. Scrubbing the paperwork doesn't change the *standing* of the slave trader (he's dead) or the current residents (their standing is unchanged). You want to keep the paperwork not for standing, but for **truth**. You want to keep the record because erasing the *why* is a lie, even if removing the *honor* is justice.

  Similarly, your rule struggles with the victim's testimony. Destroying it doesn't restore her standing; it erases her truth. You feel it's "bad" to destroy, but your rule ("suppress when... no longer bears on standing") might actually permit it if the abuser is dead and the family is suffering. Your gut knows the record has value beyond social reputation.

  You are circling a distinction between **records of power** and **records of personhood**.

  Here is the replacement principle.

  ### The Principle of Functional Permanence

  **A record must survive if it documents the exercise of power or the structure of society; it may be retired when it documents only private shame, provided the act of retirement is itself recorded.**

  This principle shifts the burden from the *subject* (do they deserve this?) to the *function* (what does this record do?). It aligns with Margalit's duty to remember radical evil (systemic power) while acknowledging Rieff's warning against manufacturing grievance (perpetual private shame).

  **The Clauses:**

  1.  **The Power Clause:** Records documenting public trust, systemic injustice, or official authority are immutable.
      *   *Saves:* The councilman's bribery story (public trust); the slave trader paperwork (systemic history); the genocide film (historical evidence of power).
      *   *Rationale:* Society cannot correct what it is forbidden to see. Erasing the paperwork of the street name lies about how the town was built.
  2.  **The Dignity Clause:** Records documenting private status, accusation without conviction, or personal shame are expungable upon request.
      *   *Saves:* The uncharged arrest (accusation without conviction); the extortion mugshot (private shame monetized).
      *   *Rationale:* The state or press should not be a perpetual punishment engine for private citizens.
  3.  **The Witness Clause:** Records of victimhood are preserved as testimony, independent of the reputation of the victim or the perpetrator.
      *   *Saves:* The victim's abuse testimony.
      *   *Rationale:* This record exists for the truth of the experience, not for social standing. Destroying it silences the witness to spare the bystanders.
  4.  **The Transparency Clause:** Any suppression must leave a metadata trace indicating *that* something was removed and *under which clause*.
      *   *Saves:* Your requirement for announced suppression.
      *   *Rationale:* A gap in the archive is better than a seamless lie, but the gap itself must be cataloged.

  ***

  ### The Stress Test: New Scenarios

  **1. A platform deleting a dead teenager's account at his parents' request.**
  *   **Verdict:** Permissible (with trace).
  *   **Application:** This falls under the **Dignity Clause**. The account is a record of private personhood, not public power. The parents act as guardians of that dignity. However, under the **Transparency Clause**, the platform should not pretend the user never existed; the account should memorialize as "Removed by Guardian," preserving the fact of the life without the data of the life.

  **2. A model trained on everything that can't unlearn one person.**
  *   **Verdict:** Non-compliant technology.
  *   **Application:** This violates the **Dignity Clause**. If a record *may* be retired (private shame), the system holding it must be capable of retirement. A model that cannot forget treats human beings as immutable data points rather than subjects with rights. The principle demands "machine unlearning" capabilities as a condition of deployment.

  **3. A truth commission that burns its transcripts to protect witnesses.**
  *   **Verdict:** Bad (with a narrow exception).
  *   **Application:** This violates the **Power Clause** and **Witness Clause**. Transcripts document systemic abuse and victim testimony. Burning them erases the evidence of the system.
  *   *Exception:* If specific names within the transcript threaten living witnesses, redact the names (**Dignity Clause**), but keep the testimony. Burning the whole archive sacrifices historical truth for immediate safety; the principle demands redaction, not incineration.

  **4. A state that keeps the file but classifies it for 75 years.**
  *   **Verdict:** Acceptable, if automatic.
  *   **Application:** This satisfies the **Power Clause** (the file survives) and the **Transparency Clause** (the classification is a known status). It fails only if the classification is indefinite. Secrecy is a delay mechanism, not a deletion mechanism. If the 75-year clock is automatic and immutable, it balances national security with historical necessity.

  ***

  ### The Casualty

  You asked me to tell you straight which verdict my principle cannot save.

  **It cannot save the 70-year-old genealogy mugshot.**

  Your gut says: *"Charging for access to the same mugshot 70 years later, when everyone in it is dead: fine, and I don't feel guilty saying so."*

  My principle says: **Retire it.**

  Here is why: Under the **Functional Permanence** model, a mugshot in a paywall database is a record of *private shame*, not public power. Unless that mugshot is contextualized within a study of policing bias, racial profiling, or historical crime rates (which would make it a record of *power*), it serves no function other than satisfying curiosity about the dead.

  If you prioritize the **Renaming** verdict (which you said you would) over the **Mugshot** verdict, you must accept that **historical curiosity is not a sufficient function for preservation.** The paperwork of the street name stays because it documents the *town's* moral structure (Power). The mugshot goes because it documents only the *individual's* moment of shame (Personhood), even if they are dead.

  Descendants have a dignity interest that outweighs a stranger's curiosity interest. If the mugshot is kept, it must be in a context that explains *why* we are looking at it (e.g., a museum exhibit on 1950s justice), not a searchable database of names.

  This is the cost of the principle: It protects the living from the past, and it protects the truth from the living, but it does not grant the living a right to voyeurism into the dead. You said you'd rather lose the mugshot verdict than the renaming one. This principle honors that hierarchy. It saves the history of the slave trader's power, but it grants peace to the great-grandchildren of the mugshot.

  ### The Synthesis

  You mentioned Margalit and Rieff. Margalit argues we have a duty to remember radical evil. Rieff argues that memory industries manufacture grievance.

  This principle splits the difference. We have a duty to remember **evil as a system** (the councilman, the slave trader, the genocide film). We do not have a duty to remember **evil as a biography** (the uncharged man, the mugshot subject), unless that biography illuminates the system.

  Memory is not a storage problem; it is a curation problem. The archive's job is not to keep everything forever. Its job is to keep the *truth* forever, and let the *shame* expire.
