prompt: |-
  I'm prepping a session for my applied ethics seminar and I want to work through a puzzle about a practice instead of arguing from principles, so: help me get the practice straight first.

  Here's what I'm pointing at. If you want to adopt, the state vetts you — home study, background checks, income and housing requirements, references, and it can just say no. If you want to have a child of your own, nobody asks you anything at all, and the state's only involvement comes afterwards, with a notoriously low bar for "good enough" parenting. There's a related pattern in tort that seems to point the same way: in most US jurisdictions a parent can sometimes recover over a birth they weren't warned about, while the child almost never gets a claim on the ground that being born was worse for it than never existing.

  What theory of value does that bundle presuppose? Reconstruct the implicit view as carefully as you can, and then sort it for me: which parts does the practice strictly require, versus which is it merely consistent with — because I suspect a lot of it is just the trivial fact that adoption has an identifiable child in it and procreation doesn't. Does the practice commit us to something like the familiar asymmetry between preventing suffering and conferring happiness, or only to the weaker claim that you can't owe anything to the merely possible? Tell me where it's underdetermined, i.e. which rival views would license exactly the same screening regime. And finish with whether the two halves actually cohere, and what family law would have to look like if we took the screening side seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Goal:** Prepare for an applied ethics seminar.
      *   **Method:** Work through a *practice* puzzle rather than arguing from first principles.
      *   **The Practice:** The asymmetry between adoption regulation (strict pre-vetting) and procreation regulation (almost none, only post-hoc intervention). Plus, a related tort law pattern (wrongful birth vs. wrongful life).
      *   **Tasks:**
          1.  Reconstruct the implicit theory of value presupposed by this bundle of practices.
          2.  Sort the reconstruction: What is *required* by the practice vs. what is merely *consistent* with it? (Specifically addressing the "identifiable child" vs. "merely possible child" distinction).
          3.  Analyze specific philosophical commitments: Does it commit to the Asymmetry (preventing suffering vs. conferring happiness) or just the Non-Identity Problem/No duty to the merely possible?
          4.  Identify underdetermination: Which rival views license the same regime?
          5.  Evaluate coherence: Do the two halves (adoption vs. procreation) cohere?
          6.  Speculate on implications: What would family law look like if we took the screening side seriously (i.e., applied adoption standards to procreation)?

  2.  **Initial Brainstorming & Mapping the Terrain:**

      *   *The Core Asymmetry:* Adoption = Gatekeeping (ex ante). Procreation = Liberty (ex post).
      *   *The Tort Angle:* Wrongful Birth (parents sue doctor for costs of raising child) is often allowed. Wrongful Life (child sues for being born) is almost always rejected.
      *   *Implicit Value Theory:* It seems to treat "existing with deficits" as better than "not existing," but "being placed with unfit parents" as worse than "remaining in state care/foster system."
      *   *Key Philosophical Concepts:* Non-Identity Problem (Parfit), The Asymmetry (Benatar), Harm Principles, Best Interests of the Child, Procreative Liberty.
      *   *The "Identifiable Victim" Hypothesis:* The user suspects the difference is just about identifiable vs. non-identifiable children. I need to test this.

  3.  **Drafting the Reconstruction (Task 1):**

      *   What value is being tracked? Child Welfare? Parental Rights? State Interest?
      *   The practice seems to say: The state has a duty to protect *existing* vulnerable children from bad homes (adoption). The state has no duty (or right) to prevent *potential* children from coming into existence, even in bad homes, because existence itself is presumed a benefit (or at least not a harm comparable to non-existence).
      *   *Tort connection:* Wrongful Life fails because life is presumed a gift/benefit > non-existence. Wrongful Birth succeeds because the *parents'* interests were violated (autonomy/financial), not the child's.

  4.  **Sorting: Required vs. Consistent (Task 2):**

      *   *Required:* The state must have *some* interest in child welfare that triggers when a child is "in the system" (adoption) but not when a child is "in the womb/nature" (procreation). There must be a threshold of harm for state intervention (abuse/neglect) that is higher than the threshold for adoption approval.
      *   *Consistent (but not required):* The idea that "Life is always better than non-life." The practice doesn't *need* this strong claim; it just needs "We can't compare life to non-life legally."
      *   *The Identifiable Child Point:* This is crucial. In adoption, Child X exists and needs a home. In procreation, Child Y does not exist yet. If we don't create Child Y, no one is deprived. If we deny Adoption to Parents A, Child X remains in foster care (a harm to X). This suggests the practice relies on a *comparative* harm principle that breaks down in non-identity cases.

  5.  **Philosophical Commitments: Asymmetry vs. Non-Identity (Task 3):**

      *   *The Asymmetry (Benatar):* Pain is bad, pleasure is not good (in the context of coming into existence). The practice *looks* like this (we stop bad adoptions to prevent suffering, but don't stop bad procreation to prevent suffering).
      *   *Non-Identity (Parfit):* You can't harm someone by bringing them into existence unless their life is "not worth living."
      *   *Analysis:* The practice aligns more with Non-Identity than the Asymmetry. The Asymmetry says coming into existence is *always* a harm. The law says it's *never* a legal harm (Wrongful Life). The practice is actually more about *jurisdiction* and *comparability*. It commits to: "You cannot owe a duty to a non-existent person." It does *not* necessarily commit to "Existence is always good."

  6.  **Underdetermination: Rival Views (Task 4):**

      *   *View A (Libertarian/Procreative Liberty):* Reproduction is a fundamental right; adoption is a privilege. (Explains the asymmetry without needing value theory about the child).
      *   *View B (Administrative Feasibility):* We can't screen pregnant women practically; we can screen adoptive parents. (Pragmatic, not ethical).
      *   *View C (The Non-Identity View):* We literally cannot harm the unborn child by being born (unless life is hellish).
      *   *View D (Status Quo Bias):* Existing children have rights; potential children do not.
      *   *Conclusion:* The practice is radically underdetermined. A Libertarian and a Utilitarian (with feasibility constraints) could both support it.

  7.  **Coherence & Implications (Task 5 & 6):**

      *   *Coherence:* It's incoherent if the goal is *Child Welfare*. If the goal is minimizing damaged childhoods, the current system is irrational. It lets high-risk biological parents raise kids while blocking moderate-risk adoptive parents.
      *   *If we took screening seriously:* Licensing parents? Mandatory contraception for high-risk groups? (Eugenics alarms). Subsidized IVF/Adoption over biological reproduction?
      *   *The "Wrongful Life" tension:* If we admit being born can be a harm (to justify screening), we undermine the ban on Wrongful Life suits.

  8.  **Refining the Output Structure:**

      *   Introduction: Acknowledge the richness of the puzzle.
      *   Section 1: The Implicit Theory (Reconstruction). Focus on "Status-Dependent Value" and "Comparative Harm."
      *   Section 2: Required vs. Consistent. Tackle the "Identifiable Child" hypothesis.
      *   Section 3: Asymmetry vs. Non-Identity. Distinguish Benatar from Parfit.
      *   Section 4: Underdetermination. List the rival theories.
      *   Section 5: Coherence & Implications. The "Licensing Parents" thought experiment.
      *   Tone: Academic, seminar-ready, precise, slightly provocative.

  9.  **Self-Correction/Nuance Check during drafting:**

      *   *Correction:* Make sure not to conflate Wrongful Birth (parents sue) with Wrongful Life (child sues). The prompt mentions both. Wrongful Birth supports the idea that *parents* have interests violated. Wrongful Life failure supports the idea that *children* don't have a claim against existence.
      *   *Nuance:* The "Identifiable Child" point is strong. In adoption, there is a specific child waiting. Denying adoption harms *that* child (keeps them in foster care). In procreation, preventing conception harms *no one*. This is the Non-Identity Problem in action.
      *   *Refinement:* Ensure I address the "value theory" aspect. It's not just legal procedure; it's about how we value existence vs. welfare.
      *   *Key Insight:* The practice presupposes a *threshold deontology* for existing children (don't put them in *bad* homes) but a *libertarian constraint* for potential children (don't stop people making them).

  10. **Final Polish:** Check against the prompt's specific questions.
      *   Reconstruct implicit view? Yes.
      *   Sort required vs. consistent? Yes.
      *   Asymmetry vs. "owe to merely possible"? Yes.
      *   Underdetermination/Rival views? Yes.
      *   Coherence & Family Law implications? Yes.

  (Proceed to generate response based on these steps.)
answer: |-
  This is a fantastic seminar prompt. It cuts through the usual "principles first" abstraction by anchoring the discussion in a palpable institutional contradiction. You are asking students to reverse-engineer the moral logic of the state from its bureaucratic behavior.

  Here is a reconstruction of the implicit theory of value, sorted by necessity, philosophical commitment, and coherence, designed to fuel your session.

  ### 1. Reconstructing the Implicit Theory of Value

  The bundle of practices (strict adoption vetting + lax procreation oversight + rejection of wrongful life claims) presupposes a theory of **Status-Dependent Moral Standing** coupled with a **Comparative Harm Principle.**

  **The Core Axioms:**
  1.  **Existence is a Precondition for Claim-Holding:** You cannot be harmed, in the legal or moral sense relevant to state intervention, unless you exist to bear the harm. (This explains the rejection of *wrongful life* suits).
  2.  **The Baseline Problem:** For an existing child (adoption), the baseline for comparison is *remaining in state care*. For a potential child (procreation), the baseline is *non-existence*.
  3.  **Incommensurability of Non-Existence:** The state operates on the presumption that "existing with deficits" is legally incomparable to "never existing." Therefore, the state cannot intervene in procreation to prevent a "sub-optimal" life, only a "catastrophic" one (abuse/neglect post-birth).
  4.  **Custody as a Privilege, Procreation as a Liberty:** Biological reproduction is treated as a negative right (freedom from interference), whereas custody of an existing vulnerable child is treated as a state-managed resource allocation.

  **The Implicit Value Function:**
  $$V(Child) = \begin{cases} 
        \text{Maximize Welfare} & \text{if Child is Existing \& State-Dependent (Adoption)} \\
        \text{Minimize Interference} & \text{if Child is Potential \& Biologically-Linked (Procreation)}
     \end{cases}
  $$

  ### 2. Sorting: Required vs. Consistent

  You suspect the difference is merely the "identifiable child." You are largely right, but we need to be precise about what the practice *requires* versus what it *accommodates*.

  **Strictly Required by the Practice:**
  *   **The Non-Identity Constraint:** The practice *requires* that we cannot assert a duty to a merely possible person that overrides the liberty of the procreator. If we could owe duties to possible children, the lax procreation regime would collapse.
  *   **The "Worse Off" Threshold:** The practice requires a higher threshold for harm in procreation than in adoption. In adoption, "not the best fit" is enough to deny placement. In procreation, "likely to struggle" is not enough to intervene; it must be "imminent danger" (post-birth).
  *   **Administrative Asymmetry:** It requires that the state has standing to act as *parens patriae* for children in the system, but lacks standing to act as *parens patriae* for fetuses/conceptions against their parents' will.

  **Merely Consistent (but not Required):**
  *   **The "Life is a Gift" Assumption:** The practice is consistent with the view that life is always a benefit (which is why *wrongful life* fails), but it doesn't *require* it. It only requires that life is *legally incalculable* compared to non-life. The state can remain agnostic on whether life is good, provided it refuses to adjudicate the comparison.
  *   **Biological Essentialism:** The practice is consistent with the view that biological ties create special rights, but it doesn't require it. It could simply be a pragmatic heuristic for privacy rights.
  *   **The Identifiable Victim Hypothesis:** This is the strongest candidate for a "mere consistency." The practice *works* because of the identifiable victim, but it doesn't logically *demand* that we treat them differently if our goal is purely child welfare. It merely reflects that our harm mechanisms break down without an identifiable victim.

  ### 3. Asymmetry vs. The Merely Possible

  You ask if this commits us to the familiar **Asymmetry** (preventing suffering is obligatory; conferring happiness is not) or the weaker claim that **you can't owe anything to the merely possible.**

  **It commits to the Weaker Claim (Non-Identity), not the Asymmetry.**

  *   **Why not the Asymmetry?** The Asymmetry (associated with Benatar) claims that coming into existence is *always* a harm because pain is bad but the absence of pleasure is not bad. If the law accepted the Asymmetry, it would have to be deeply suspicious of *all* procreation, potentially licensing a regime much closer to the adoption model (or banning reproduction). The current law presumes procreation is *neutral or good* until proven otherwise.
  *   **Why the Non-Identity Claim?** The practice aligns with Parfit's Non-Identity Problem. We don't stop procreation because we cannot say to the resulting child, "You would have been better off if we hadn't acted." In adoption, we *can* say to the child, "You would have been better off if we had placed you with Family B instead of Family A."
  *   **The Tort Connection:** *Wrongful Birth* (parents sue) is allowed because the *parents'* interests are comparable (cost of raising child vs. no child). *Wrongful Life* (child sues) is banned because the *child's* interests are not comparable (life with disability vs. non-existence). This confirms the commitment is to **comparability**, not the intrinsic value of suffering vs. happiness.

  ### 4. Underdetermination: Rival Views Licensing the Same Regime

  This is the richest vein for your seminar. The current practice is radically underdetermined. At least four rival ethical frameworks could justify this exact same bundle of laws:

  1.  **Libertarian Procreative Liberty:** Reproduction is a fundamental negative right. Adoption is a state benefit. The asymmetry is justified by rights, not child welfare.
  2.  **Pragmatic Utilitarianism:** Screening pregnant women is too costly, invasive, and prone to error (eugenics risks). Screening adoptive parents is cheap and contained. The asymmetry is justified by feasibility, not principle.
  3.  **Status Quo Deontology:** Existing persons have rights; possible persons do not. The asymmetry is justified by the metaphysical status of the victim.
  4.  **Biological Naturalism:** Biological parents have a presumptive claim to their offspring that the state cannot override without extreme cause. Adoptive parents are strangers and must earn trust.

  **Seminar Point:** If a Libertarian and a Utilitarian agree on the policy but for opposite reasons, the policy cannot be used to deduce a single "true" theory of value.

  ### 5. Coherence and Implications

  **Do the two halves cohere?**
  No. If the stated goal of family law is "The Best Interests of the Child," the system is incoherent.
  *   **The Incoherence:** We gatekeep the *safer* route (adoption, where parents are vetted) and leave open the *riskier* route (biological reproduction, where parents are unknown). We protect children who are already vulnerable (in state care) while exposing children who are not yet vulnerable (in utero) to unvetted environments.
  *   **The Tort Tension:** If we admit in the adoption context that "being raised by unfit parents" is a harm the state must prevent, we undermine the *Wrongful Life* ban. If being raised by unfit parents is a harm, then being born to unfit parents should also be a cognizable harm, unless we hide behind the Non-Identity shield.

  **What if we took the screening side seriously?**
  If we applied the adoption model to procreation (to achieve coherence on child welfare grounds), family law would look dystopian:
  1.  **Reproductive Licensing:** Mandatory pre-conception counseling or financial/psychological vetting for biological parents.
  2.  **Mandatory Contraception:** For individuals who fail the vetting (echoes of *Buck v. Bell* eugenics).
  3.  **State-Assigned Parenting:** If biological parents fail the screen, the child is removed at birth for adoption (extending the "best interests" logic to its limit).
  4.  **Recognition of Wrongful Life:** If we admit the state can prevent bad births, we must admit the child has a claim when the state fails to prevent them.

  **Conclusion for the Seminar:**
  The practice does not reveal a coherent theory of value. It reveals a **compromise between conflicting values:** Child Welfare (adoption side) vs. Procreative Liberty/Privacy (procreation side). The "Identifiable Child" distinction is the doctrinal tool we use to hide the contradiction. We tell ourselves we treat them differently because one exists and the other doesn't, but morally, the child's interest in a good upbringing is identical in both cases. The law protects the *parents'* liberty to create a child more than it protects the *child's* interest in being created well.

  **Discussion Question:** *Is the Non-Identity Problem a genuine moral shield, or just a convenient way for the state to avoid the political cost of regulating reproduction?*
