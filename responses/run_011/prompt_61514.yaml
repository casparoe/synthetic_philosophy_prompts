answer: |-
  # THE BINDING COMMITMENT TEST
  **For Steering Group Use | Timebox: 10 Minutes | Facilitator: Secretary or Chair**

  **Purpose:** To distinguish between *individual alignment* ("we all like this") and *joint commitment* ("we owe this to each others/others"). Use this when disputes arise about whether a decision was made, or before ratifying any new external promise.

  **Rule:** If any step fails, the commitment is **NOT BINDING** unless Step 3 (Reliance) overrides. If Step 4 triggers, the matter leaves this room.

  ---

  ### STEP 1: AUTHORITY & CHANNEL (2 Mins)
  **Question:** Was this proposal made in a designated decision space (Meeting/Steering) OR by an agent authorized to speak for the group (Chair/Secretary)?
  *   **Yes:** Proceed.
  *   **No (e.g., WhatsApp only):** Default is **NOT BINDING**. *Exception:* Proceed to Step 3 immediately if an authorized agent spoke externally.
  *   **Note:** WhatsApp is a notification channel, not a decision space, unless a specific poll/deadline was set and archived.

  ### STEP 2: LANGUAGE OF OBLIGATION (2 Mins)
  **Question:** Did participants use words of commitment ("will", "agree", "promise") or words of interest ("keen", "good idea", "maybe")? Was silence treated as consent?
  *   **Commitment Words:** Indicates **BINDING**.
  *   **Interest Words:** Indicates **ALIGNMENT ONLY**.
  *   **Silence:** Silence is **NEVER** consent unless a specific deadline ("No objections by Friday") was communicated and visible to all.
  *   **Standing Aside:** A member who "stands aside" is **NOT BOUND** to labour but cannot block the decision. They cannot be rebuked for non-participation later.

  ### STEP 3: RELIANCE & REPUTATION (3 Mins)
  **Question:** Has anyone (inside or outside the group) changed their position based on this decision such that withdrawing now causes concrete harm or loss of trust?
  *   **Yes (External):** (e.g., Press quote, Council contract signed). The **GROUP IS BOUND** even if Step 1 or 2 failed. The group must honour the promise to protect its agency, then fix its internal process.
  *   **Yes (Internal):** (e.g., Rota signed, supplies bought). The **INDIVIDUAL IS BOUND** to the group. Unilateral withdrawal is a breach.
  *   **No:** Return to Step 1 outcome.

  ### STEP 4: VALUES HANDOFF (3 Mins)
  **Question:** Does fulfilling this commitment fundamentally alter the group's core purpose or resource allocation (e.g., displacing the Food Bank)?
  *   **Yes:** **STOP.** This is a question of values, not procedure. Refer to **Full Membership Vote**. The Steering Group cannot decide this.
  *   **No:** Steering Group may ratify/resolve.

  ---

  ## APPLICATION TO CURRENT DISPUTES

  **1. The Night Shelter (WhatsApp + Chair + Press)**
  *   **Step 1:** WhatsApp alone = No. But Chair is an authorized agent. **PASS.**
  *   **Step 2:** Enthusiasm ("keen") ≠ Commitment. **FAIL.**
  *   **Step 3:** Chair quoted in local paper; Council likely expecting delivery. Withdrawing now damages group reputation and Council relationship. **EXTERNAL RELIANCE CONFIRMED.**
  *   **Step 4:** Uses same kitchen as Food Bank. High risk of resource conflict. **VALUES HANDOFF TRIGGERED.**
  *   **VERDICT:** **BINDING ON THE GROUP.** Because the Chair acted as agent and external reliance exists, the Association owes the Council the shelter. *However*, because Step 4 triggered, the Full Membership must decide *how* to deliver it (e.g., pause Food Bank vs. find new venue). You are bound to the obligation, even if you didn't see the messages. The failure was procedural, but the liability is real.

  **2. The Standing Aside Member**
  *   **Step 1:** Made in meeting. **PASS.**
  *   **Step 2:** Member explicitly "stood aside". This is not language of obligation. **FAIL (for obligation).**
  *   **Step 3:** Did others rely on *this specific member* labouring? If the plan worked without them, no.
  *   **VERDICT:** **NOT BOUND.** The procedure protects them. They allowed the decision to pass but did not join the joint commitment to execute it. Rebuking them later is invalid.

  **3. The Food Bank Rota Walkaway**
  *   **Step 1:** Signed rota is a recognized internal commitment. **PASS.**
  *   **Step 2:** Signing implies "I will". **PASS.**
  *   **Step 3:** Other volunteers rely on cover for vulnerable clients. Withdrawal causes gaps. **INTERNAL RELIANCE CONFIRMED.**
  *   **VERDICT:** **BINDING.** This is a joint commitment. Unilateral withdrawal in week 4 is a wrong to the group. She must find cover or negotiate release with the coordinator; she cannot simply quit the shift.

  ---

  ## LIMITATIONS & FAILURE MODES

  **Distinctions Blunted for Speed:**
  1.  **Moral vs. Practical Obligation:** This test treats "reputation damage" same as "contractual breach". It prioritizes the group's survival over individual fairness.
  2.  **Intensity of Preference:** It doesn't measure how much people care, only if they committed. A reluctant majority binds an enthusiastic minority.
  3.  **The "Discursive Dilemma":** If the group agrees on premises but not the conclusion, this test forces a vote on the conclusion only. It ignores logical inconsistency to get a decision.

  **Where This Will Misfire:**
  1.  **The "Reliance" Trap:** People may exaggerate external reliance ("The Council will sue us!") to force a binding verdict under Step 3. Facilitator must demand evidence.
  2.  **Agent Overreach:** Step 1 authorizes the Chair to bind the group. If the Chair is reckless, Step 3 locks the group into their mistakes. You need a separate rule for revoking Agent Authority.
  3.  **Values Creep:** Step 4 is subjective. What counts as "fundamentally altering purpose"? One person's tweak is another's betrayal. If Step 4 is argued for more than 3 minutes, you must default to a Full Membership Vote.

  **Adoption:** Print this. Keep it on the table. If someone says "We decided on WhatsApp", read Step 1. If someone says "You can't quit the rota", read Step 3.
