answer: |-
  This is a classic objection, often called the "self-refutation" or "incoherence" charge against Quine. Your roommate has reconstructed it well. In fact, Quine anticipated this exact argument and spent a significant portion of *Ontological Relativity* and *Pursuit of Truth* dismantling it.

  Here is the breakdown of the two things you asked for.

  ### 1. The Observation Sentence Escape Hatch

  **Does your roommate close the door?**
  Yes, but only because the door leads to a room Quine never intended to enter.

  Your roommate is right that Premise (1) swallows observation sentences *if* the goal is to fix **reference** (ontology). The stimulus conditions for assenting to "Rabbit!" are indeed identical to the stimulus conditions for assenting to "Undetached rabbit part!" (since you can't see a rabbit without seeing its parts, nor vice versa, in the relevant context). Therefore, behavioral evidence cannot distinguish between the two ontologies.

  However, the "escape hatch" usually isn't about saving reference; it's about saving **empirical content**. Quine distinguishes between:
  *   **Stimulus Meaning:** The pattern of sensory stimulations that prompt assent/dissent. (This *is* fixed for observation sentences).
  *   **Reference:** The object in the world the term picks out. (This is *not* fixed).

  Your roommate's argument successfully shows that observation sentences do not fix *reference*. But Quine doesn't need them to. Quine's behaviorism only requires that observation sentences have fixed *stimulus meaning* to ground science. The indeterminacy thesis is specifically about the slack between stimulus meaning and reference.

  So, your roommate is correct that (1) prevents observation sentences from solving the *ontological* indeterminacy. But Quine would reply: "Exactly. That's my point." The hatch remains open for what Quine cares about (empirical prediction), but closed for what the realist cares about (unique ontology). Your roommate hasn't refuted Quine here; he has just confirmed the distinction between stimulus meaning and reference that Quine relies on.

  ### 2. Which Step to Reject (Keeping 4 & 5)

  You want to keep (4) and (5). Good news: **Quine keeps them too.** He accepts that inscrutability applies to home language (English) just as much as to "Gavagai."

  To block the conclusion (8) while keeping (4) and (5), you must reject **Premise (7)**:
  > *(7) Where there's no fact of the matter about what a sentence means, the sentence doesn't say anything.*

  **Why it looked innocent going in:**
  Premise (7) relies on a "God's Eye View" of semantics. It assumes that for a sentence to be meaningful, there must be a transcendent, absolute fact of the matter about its truth conditions that holds independently of any linguistic framework. It conflates "indeterminate reference" with "lack of communicative function." It feels intuitive because we usually assume our words latch onto the world in a unique way; if they didn't, we feel we'd be speaking into the void.

  **Quine's Rejection (The "Immanent" Move):**
  Quine rejects (7) by arguing that meaning and truth are **immanent**, not transcendent.
  *   We cannot step outside our own skin to check if "rabbit" *really* refers to rabbits.
  *   We can only ask if "rabbit" refers to rabbits *relative to a background language* (in this case, English).
  *   The indeterminacy thesis is a statement made *within* English. It says: "Relative to our current linguistic framework, there is no behavioral evidence that can distinguish between manual A and manual B."

  The sentence *does* say something. It functions as a philosophical warning within the language. It tells us not to look for certain kinds of facts (absolute reference facts) because they don't exist. The fact that the thesis itself is subject to indeterminacy doesn't make it empty; it just means the thesis is **ontologically relative**.

  **What does rejecting (7) cost you?**
  To block (8) while keeping (4) and (5), you must pay the price of **Ontological Relativity**.

  1.  **No Absolute Semantics:** You must give up the idea that there is a single, true description of what your words refer to "in reality." Reference is only meaningful relative to a translation manual or a background theory.
  2.  **Disenchantment:** You lose the comforting idea that language mirrors the world's structure uniquely. You accept that "rabbit" and "undetached rabbit part" are empirically equivalent descriptions, and choosing between them is a matter of pragmatic convenience, not metaphysical discovery.
  3.  **Self-Application:** You must accept that the indeterminacy thesis itself is indeterminate *from outside*, but determinate *from within*. This requires a nuanced view of truth where a sentence can be "true for us" (within our theory) without being "True with a capital T" (from nowhere).

  **Summary:**
  Your roommate's argument is the standard self-refutation objection. Quine's counter is that the objection assumes a transcendent standpoint that naturalism forbids. By rejecting (7), you accept that the indeterminacy thesis is a meaningful claim *within* our best scientific theory about the limits of evidence, even if the terms of the thesis themselves are inscrutable from a hypothetical external vantage point. You keep the interesting indeterminacy (4 & 5), but you lose absolute semantic realism.
