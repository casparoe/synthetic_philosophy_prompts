answer: |-
  The question tests whether candidates can evaluate the coherence of Hume's distinction between money's domestic neutrality and its international substantive value.

  **Exam Question**
  Hume asserts that money is domestically neutral yet internationally substantive. Critically assess whether his proposal to lock up specie in a bank reconciles these positions or exposes a fundamental contradiction in his monetary theory.

  **Model Answer**
  Hume's monetary theory rests on a dichotomy: domestically, money is merely instrumental "oil," not wealth itself; internationally, it is substantive power. In "Of Money," the levelling argument suggests that any change in money supply merely alters prices, leaving real output unchanged. Thus, domestically, the quantity of money is "of no consequence." However, Hume contradicts this neutrality when discussing state power in "Of the Balance of Trade." He argues that a plentiful stock of specie is vital for war and negotiation because foreign states reject paper credit, dismissing it as counterfeit money reliant on state stability.

  To harmonize these tiers, Hume proposes a bank that locks up received money. This shrinks domestic circulation, keeping labor cheap and exports competitive, while accumulating a hoard for state emergencies. The tension arises here. If the levelling mechanism works automatically, deliberately shrinking circulation should trigger an immediate specie inflow until the natural proportion is restored, rendering the policy futile. Conversely, if the policy succeeds in maintaining a low circulation while accumulating a hoard, money is not neutral; its distribution affects real variables like labor costs and export competitiveness. Therefore, the first tier (neutrality) collapses into the second (substantive value). A student objection notes that if the levelling argument holds, any policy holding the circulating medium below its natural proportion should be undone by inflow. If the hoard grows without limit, money becomes consequential domestically, collapsing the first tier. Hume avoids this only by assuming the bank can resist the natural flow indefinitely, implying money is indeed consequential domestically after all.

  However, a charitable reading suggests Hume distinguishes between short-run transition effects and long-run equilibrium. The "oil" metaphor applies to the long-run equilibrium where prices adjust. The policy recommendation exploits the short-run friction where money supply changes affect industry before prices rise. By locking up money, the state prolongs the beneficial transition phase of low prices and high employment. Yet, this relies on the hoard remaining idle. If released, inflation follows. Thus, the contradiction is resolved only if one accepts that money is neutral in equilibrium but non-neutral in disequilibrium. Hume's bank proposal attempts to institutionalize this disequilibrium for state benefit.

  Ultimately, while logically tense, the theory is pragmatically coherent: money is domestically neutral regarding wealth, but substantively vital regarding state power and temporary competitive advantage. The contradiction lies not in the mechanism, but in applying a long-run neutrality thesis to justify short-run activist policy. Students must recognize that Hume prioritizes state security over strict theoretical consistency, using the neutrality thesis to dismiss mercantilist wealth accumulation while retaining specie for geopolitical leverage. The two-tier structure is thus a strategic ambiguity rather than a simple error.

  **Marking Scheme**

  | Point | Marks | Common way candidates lose those marks |
  | :--- | :--- | :--- |
  | **1. Domestic Neutrality:** Accurately explains the levelling argument and money as "oil" not "wheels." | 4 | Describing the price-specie-flow mechanism without explicitly stating domestic neutrality. |
  | **2. International Substantivism:** Identifies money's role in war/negotiations and the rejection of paper credit. | 4 | Failing to mention why foreigners reject paper or limiting the discussion to domestic trade. |
  | **3. Bank Policy:** Explains the proposal to lock up specie to shrink circulation and build a hoard. | 4 | Omitting the "locking up" mechanism or its dual purpose (cheap labor + emergency fund). |
  | **4. Analysis of Tension:** Articulates why the policy contradicts the neutrality thesis (inflow vs. control). | 4 | Narrating the contradiction without explaining why the levelling argument makes the policy problematic. |
  | **5. Judgement:** Offers a nuanced conclusion on coherence (e.g., short-run vs. long-run) rather than binary verdict. | 4 | Declaring it purely contradictory without nuance or missing the strategic rationale behind the ambiguity. |

  An A-level answer evaluates the strategic coherence of the tension, whereas a B-level answer merely identifies the contradiction.
