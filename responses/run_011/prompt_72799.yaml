answer: |-
  **Scenario: The Ostria Signal**

  The Republic of Ostria is purging the Kelm minority. Intelligence confirms 10,000 Kelm will be executed within the month. The Allied Coalition can stop this with a limited air campaign. Cost: negligible. Probability of success: 95%.

  However, across the border in Veltria, the Veltrian Freedom Front (VFF) is losing a civil war against the government. VFF leadership intercepts Coalition communications regarding Ostria. They calculate that the Coalition intervenes only when civilian massacres reach a threshold of visibility. To secure Coalition air support against the Veltrian government, the VFF deliberately plans to massacre 15,000 of their own civilians in government-held zones, framing the state. Intelligence confirms this plan is contingent on the Coalition striking Ostria. If Ostria is spared, the VFF lacks the model and proceeds with conventional warfare (estimated 2,000 combatant deaths). If Ostria is struck, the VFF executes the massacre plan to trigger similar aid.

  The Coalition cannot keep its doctrine secret; democratic transparency mandates public justification for force. Nor can they credibly claim this is a "one-off"; their legal advisors confirm that establishing a precedent of humanitarian intervention binds future operations under international norms they champion.

  **Verdicts:**
  *   **Intervene:** 10,000 saved (Ostria), 15,000 killed (Veltria). Net: -5,000 lives.
  *   **Do Not Intervene:** 10,000 killed (Ostria), 2,000 killed (Veltria). Net: -12,000 lives.

  ***

  **Analysis**

  **The Positions**
  The **Act Consequentialist** looks at the net body count. Intervening causes a net loss of 5,000 lives compared to non-intervention. The causal chain is clear: the intervention provides the evidence the VFF needs to activate their strategy. Because the VFF's choice is a foreseeable response to the Coalition's action, the Coalition bears responsibility for the Veltrian deaths. The verdict is straightforward: do not intervene.

  The **Deontologist** (specifically one holding a strong duty to rescue) focuses on agency and proximity. The 10,000 Kelm are identified victims facing imminent death directly from the Ostrian state. The Coalition has the capacity to stop this specific wrong. The 15,000 Veltrians are statistical victims; their deaths depend on the free, immoral choices of the VFF. The Coalition does not intend their deaths, nor do they use them as means; the VFF does. The duty to rescue the identified present victims outweighs the duty to prevent future statistical deaths caused by third-party agency. Verdict: Intervene.

  The **Rule Consequentialist** asks what general rule maximizes well-being. A rule stating "Intervene whenever you can stop mass killing cheaply" encourages moral hazard, as seen in Veltria. Adopting this rule leads to more deaths long-term. They would adopt a refined rule: "Intervene to stop mass killing only when the signaling effect does not incentivize greater atrocities elsewhere." In this specific case, since the signaling effect cannot be neutralized (due to transparency constraints), the rule prohibits intervention. They land with the Act Consequentialist, but for systemic reasons rather than case-specific math.

  **The Key Feature**
  The work is being done by the **identified/statistical distinction coupled with the agency break**. The Deontologist relies on the fact that the Ostrian victims are "here and now" while the Veltrian victims are "there and then," contingent on a separate moral agent's choice. If the Veltrian deaths were a direct mechanical consequence of the bombing (e.g., collateral damage), the Deontologist might prohibit intervention based on the doctrine of double effect or direct harm. The "free choice" of the VFF allows the Deontologist to offload the moral responsibility for the 15,000 onto the rebels.

  **Removing the Feature**
  If you remove the agency break—say, intelligence confirms the VFF *will* massacre 15,000 regardless of Coalition action, but intervention simply shifts *where* they die—the Deontologist's position weakens. Alternatively, if the 10,000 Ostrians were merely "at risk" rather than "scheduled for execution," the duty to rescue identified victims loses its urgency. If the victims on both sides are equally identified and the causal link is equally tight, the Deontologist struggles to justify saving one group at the expense of the other without sliding into consequentialism.

  **Act Consequentialist Counter-Attack**
  The Act Consequentialist might attack the **probability estimates**. Intelligence on the VFF's contingent plan is inherently speculative. If there is only a 60% chance the VFF follows through, the expected utility shifts. A stronger line of attack, however, is **normative establishment**. Preventing genocide in Ostria establishes a global norm that deters future genocides elsewhere. The long-term utility of establishing a robust "responsibility to protect" norm might outweigh the short-term loss of 5,000 lives in Veltria. The Act Consequentialist could argue the scenario ignores the preventive value of the intervention itself.

  **Defender of the Rescue Duty**
  To avoid special pleading, the defender needs to emphasize **complicity**. They could add that failing to intervene makes the Coalition complicit in the Ostrian genocide by omission, whereas intervening does not make them complicit in the Veltrian massacre because they actively oppose the VFF's strategy. By adding a clause where the Coalition publicly condemns the VFF strategy while saving the Kelm, the defender strengthens the claim that they are not endorsing the moral hazard, merely fulfilling a specific duty to the Kelm that cannot be overridden by the potential sins of others.
