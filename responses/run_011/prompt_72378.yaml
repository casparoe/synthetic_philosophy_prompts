answer: |-
  # SEMINAR HANDOUT: THE ONTOLOGY OF GLYPHS
  **Course:** Concepts & Categorization (PHIL/COG 305)  
  **Topic:** Letter Identity & The *Letter Spirit* Problem  
  **Length:** 9 Cases  

  ### I. The Logical Space
  We are investigating what makes a mark a specific letter. Disagreements usually fall along four axes. As you answer the cases, notice which factors you prioritize.

  1.  **Constitution:** Is identity found in the **Physical Shape** (geometry, contours) or the **Causal History** (how it was produced, where it came from)?
  2.  **Authority:** Is identity determined by the **Producer** (designer, writer, intent) or the **Consumer** (reader, recognizer, effect)?
  3.  **Context:** Is a letter an **Atom** (identifiable in isolation) or a **Node** (identifiable only via its relation to other letters in a set)?
  4.  **Precision:** Are category boundaries **Sharp** (a mark either is or isn't an *a*) or **Fuzzy** (a mark can be more or less of an *a*)?

  *Note: There are no "correct" answers. Consistency matters more than intuition.*

  ### II. The Sorting Quiz
  *For each case, select the single response that best matches your judgment.*

  **1. The Accidental Blot**
  A drop of ink falls randomly on paper. By pure chance, its contour is identical to a printed Times New Roman *a*. No human intended it.
  A. It is an *a*. Shape is all that matters.
  B. It is not an *a*. It lacks a history of production.
  C. It is an *a* only if someone reads it as one.

  **2. The Three-Century Drift**
  A chain of scribes copies a manuscript over 300 years. Each faithfully copies the previous one, but style shifts accumulate. The final *a* shares no visible geometric features with the first.
  A. They are the same letter. The causal chain is unbroken.
  B. They are different letters. The shape has changed too much.
  C. They are the same letter only within the context of that specific book.

  **3. The Morph**
  A computer smoothly morphs a double-storey *a* into an *o* through 100 frames.
  A. There is a specific frame where it stops being *a* and starts being *o*.
  B. There is no fact of the matter; it is a gradient.
  C. It remains an *a* as long as the designer labels the file "a."

  **4. The Family Resemblance**
  A Blackletter *a*, a Times *a*, and an Italic single-storey *a* are placed side-by-side. They look radically different.
  A. They are all *a*s because they function as *a*s in their respective systems.
  B. Only the Times *a* is a "true" *a*; the others are stylized variants.
  C. They are different symbols that happen to share a name.

  **5. The Designer's Error**
  A type designer creates a glyph that looks exactly like an *a* but insists, "This is my new *d*." Readers universally mistake it for an *a*.
  A. It is a *d*. The creator's intent defines the slot.
  B. It is an *a*. The reader's recognition defines the function.
  C. It is a failed *d* that functions as an *a*.

  **6. The Damaged Stone**
  A Roman inscription is chipped. Half the bowl of the *a* is missing. A palaeographer reads it with confidence as *a*.
  A. It is an *a*. The expert infers the intended whole.
  B. It is a fragment. The physical shape is incomplete.
  C. It is an *a* only because the surrounding letters make it predictable.

  **7. The Digital Switch**
  In a font file, the key "a" is mapped to a glyph that looks like a *d*. When you type "a," a *d*-shape appears.
  A. It is an *a*. The encoding defines the character.
  B. It is a *d*. The visual output is what counts.
  C. It is a bug. The identity is broken.

  **8. The Alien Artifact**
  Aliens produce a rock carving identical to our alphabet. They have no concept of writing, language, or symbols.
  A. They are letters. The shapes are universal.
  B. They are not letters. They lack linguistic function.
  C. They are proto-letters, waiting for a user.

  **9. The Child's Circle**
  A 3-year-old draws a circle and says, "That's an *a*." It looks like an *o*.
  A. It is an *a*. The child's intent is sufficient.
  B. It is an *o*. The shape dictates the identity.
  C. It is neither. It is a drawing of a letter.

  ***

  # SCORING KEY & TAXONOMY
  **For Seminar Leaders Only**

  ### Scoring Instructions
  Tally the responses. Dominant patterns indicate the student's metaphysical commitment.
  *   **Mostly A (Shape/Encoding/Sharp):** Visual Formalist or Structuralist.
  *   **Mostly B (History/Function/Realism):** Historical Materialist or Reception Functionalist.
  *   **Mostly C (Context/Intent/Gradient):** Intentional Normativist or Pragmatist.
  *   **Mixed/Inconsistent:** Eliminative Pragmatist (or confused).

  ### Taxonomy of Positions
  *Map the dominant pattern to the following leaves. Each includes the commitment the view finds most embarrassing to admit.*

  1.  **Visual Formalism** (Q1-A, Q2-B, Q3-A)
      *   *Commitment:* Letter identity is intrinsic to geometry.
      *   *Embarrassment:* Cannot explain how we read damaged text or historical drift without ad-hoc "error" theories.
  2.  **Historical Lineage** (Q1-B, Q2-A, Q6-A)
      *   *Commitment:* Identity is a causal chain of copying.
      *   *Embarrassment:* Must deny that independent invention (e.g., two people drawing the same shape) yields the same letter.
  3.  **Reception Functionalism** (Q1-C, Q5-B, Q8-B)
      *   *Commitment:* Identity is fixed by reader recognition.
      *   *Embarrassment:* Cannot account for unreadable experimental type that the designer claims is valid.
  4.  **Intentional Normativism** (Q3-C, Q5-A, Q9-A)
      *   *Commitment:* Identity is fixed by the producer's plan.
      *   *Embarrassment:* Must classify typos and slips of the pen as "different letters" rather than errors.
  5.  **Systemic Structuralism** (Q2-C, Q4-A, Q7-A)
      *   *Commitment:* Identity is a slot in a system (font/encoding).
      *   *Embarrassment:* Cannot identify a single isolated letter without reference to the rest of the set.
  6.  **Eliminative Pragmatism** (Q3-B, Q5-C, Q9-C)
      *   *Commitment:* "Letter identity" is not a natural kind; it is a tool for specific tasks.
      *   *Embarrassment:* Offers no theoretical resistance to calling an *a* a *b* if it proves useful to do so.

  ### The Trap
  **Question 3 (The Morph)** is the trap.
  *   **Intuitive Answer:** A ("There is a specific frame").
  *   **Misclassification Risk:** Students often pick A because they speak colloquially about boundaries, not because they are metaphysical **Visual Formalists**. They may actually be **Pragmatists** who believe boundaries are context-dependent but sharp *in context*.
  *   **Correction:** If a student picks A on Q3 but C on Q5 and Q9, reclassify them as **Eliminative Pragmatist**. The trap catches those who conflate *practical* sharpness with *ontological* sharpness.

