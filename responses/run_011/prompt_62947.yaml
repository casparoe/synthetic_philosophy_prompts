answer: |-
  The authority of the earlier self in this scenario consists not in persistent consent, but in a **conditional transfer of decision-rights**. When the patient signs the directive during a lucid interval, they are not merely stating a preference; they are executing a waiver. They are temporarily alienating their right to refuse treatment for the duration of a specified clinical state. This is a Ulysses contract: the agent binds themselves to the mast knowing the sirens will sing, explicitly instructing the crew to ignore their future screams. The moral force comes from respecting the agent's long-term governance over their life trajectory, rather than privileging the momentary sovereignty of the episodic self.

  To defend this, we must walk through the objections without flinching.

  First, the personal-identity objection claims the manic self is a different subject, making enforcement paternalism aimed at a stranger. This relies on a psychological-continuity view of identity that is too thin for clinical ethics. We are not dealing with fission or total memory wipe; we are dealing with distortion. The manic self is not a new person; it is the same person operating under a known pathological constraint that systematically alters value weighting. If we accept the "different subject" argument, we undermine the possibility of responsibility for actions taken during mania (e.g., debt, infidelity), which society rightly holds the patient accountable for once stable. You cannot claim the manic self is a stranger when the bills arrive, but insist they are a stranger when the medication is offered. Narrative identity holds: the lucid self is the author of the life story; the manic self is a corrupted chapter. Enforcing the directive preserves the integrity of the whole narrative against a temporary hijacking.

  Second, the capacity objection is the sharpest. If the patient passes the standard understanding-appreciating-reasoning-expressing test, how can we override them without defining capacity question-beggingly? The answer lies in the scope of "appreciation." Standard assessments check if the patient understands the drug and the diagnosis. They often fail to check if the patient appreciates the *reliability of their own judgment* regarding that diagnosis. When a patient with a predictable history says, "This time is different," despite evidence to the contrary, they are failing to appreciate the probabilistic reality of their condition. However, even if we grant they pass the test, the conditional transfer model bypasses the need to prove incapacity. By signing the directive, the patient agreed that during the episode, their contemporaneous refusal is invalid *by contract*, not by clinical finding. They pre-authorized the surrogate to decide, effectively waiving the right to veto that surrogate during the triggered state. This is not finding them incompetent; it is honoring their prior competent waiver of the right to refuse.

  Third, the betrayal objection suggests that violation laundered through autonomy is worse than ordinary commitment. This assumes autonomy is purely contemporaneous. But autonomy is also about planning and sticking to plans. If I ask a friend to stop me from drinking when I am intoxicated, I am not betrayed when they take my keys; I am helped. The betrayal would be ignoring the deep values of the whole life in favor of the transient desire of the episode. The "laundering" is actually the only thing that makes the coercion permissible. It transforms an external imposition into an internal commitment fulfilled.

  Fourth, the cold-hot gap argues the lucid self cannot imagine the manic state, so their judgment is uninformed. This is true phenomenologically but irrelevant axiologically. The lucid self does not need to know what mania *feels* like to know what mania *costs*. They have lived through the aftermath: the shame, the hospitalization, the financial ruin. The directive is a bet that the avoidance of those consequences outweighs the experiential quality of the episode. The lucid self is the only one capable of weighing the long-term costs; the manic self is chemically incapable of valuing them.

  However, this argument cannot stand without tight fences. To be enforceable, the directive must meet strict criteria. First, **independent certification**: the sister cannot be the sole judge that the episode has arrived. A clinician unconnected to the family must certify that the specific triggering conditions (e.g., sleeplessness for 48 hours, specific delusional themes) are met. This prevents family members from weaponizing the directive during ordinary conflicts. Second, **specificity**: the directive must name the medications and dosages. Blanket consent to "whatever the doctor thinks" is too vulnerable to abuse. Third, **reversibility**: this mechanism cannot authorize irreversible treatments like psychosurgery or ECT, only stabilization protocols. Fourth, **revocation**: the right to revoke the directive must exist, but only during certified lucidity. You cannot allow revocation during the episode, or the contract is void.

  Even with these fences, the argument has brittle points where I must retreat.

  The first failure point is the "Happy Manic" scenario. If the patient is manic, refusing meds, but not dangerous—simply spending money and feeling euphoric—the enforcement looks purely paternalistic. The harm principle is strained here. If the patient isn't a danger to self or others, overriding their refusal based solely on a prior document risks turning psychiatry into a tool for enforcing conformity over well-being. I cannot defend enforcement in non-dangerous cases without sliding into hard paternalism.

  The second failure point is the surrogate's error. The sister might trigger the directive too early or too late, or the clinical picture might be ambiguous. If the patient is in a mixed state rather than pure mania, the directive might not apply, yet the pressure to enforce it remains.

  Therefore, I must retreat from the claim that the directive is an absolute command. It should function as a **rebuttable presumption**. It shifts the burden of proof: instead of the family proving the patient needs treatment, the patient (or their current advocates) must prove that the current episode is *not* the one covered by the directive, or that circumstances have materially changed. Furthermore, enforcement should be time-limited. The directive authorizes stabilization, not indefinite maintenance. Once the acute episode breaks, authority must immediately revert to the patient, with a fresh capacity assessment.

  Ultimately, the case rests on the belief that we are more than the sum of our momentary states. If we deny the lucid self the power to bind the manic self, we abandon the patient to the illness every time it returns. But we must admit that this power is dangerous. It requires us to trust that the person signing the form knew themselves better than the person screaming in the bed, and that trust is never guaranteed. The directive is not a magic wand that solves the tension between then and now; it is a tool to tip the scales toward the life the patient says they want, acknowledging that sometimes, protecting autonomy means overriding it.
