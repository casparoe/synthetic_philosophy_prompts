      *   *Mechanism:* It's not that the later self lacks capacity in the standard sense, but that the *authority* to decide has been contractually waived for the duration of the episode. The lucid self acts as a trustee for the patient's long-term interests/values against the temporary distortion of the episodic self.
      *   *Addressing Objections:*
          *   *Identity:* Reject the strong discontinuity view. The patient is the same moral agent over time; episodic distortion doesn't create a new person, it creates a compromised version of the same person.
          *   *Capacity:* Challenge the sufficiency of standard MacCAT-T style assessments. "Appreciation" must include insight into the *pattern* of illness, not just the immediate facts. If the refusal is based on the delusion "this time is different" despite evidence, appreciation is impaired regarding the *context* of the decision.
          *   *Betrayal:* Reframe betrayal. The betrayal would be ignoring the deep values of the whole life trajectory in favor of the transient desire of the episode. The "laundering" is actually respect for the agent's long-term autonomy.
          *   *Cold-Hot Gap:* Acknowledge this is the strongest point against. Counter: The lucid self knows the *consequences* of the manic state (hospitalization, debt, shame) even if they can't feel the mania. They are betting against the episode's validity, not its phenomenology.
      *   *Fences:* Strict criteria needed. Specific meds, independent certification of episode onset, no irreversible treatments (like ECT or psychosurgery), revocation only during lucidity.
      *   *Weaknesses:* The "Appreciation" loophole is shaky. The risk of abuse by surrogates. The possibility that the manic self *is* expressing a valid shift in values (neurodiversity argument). Retreat: Directive as heavy evidence + short enforcement window.

