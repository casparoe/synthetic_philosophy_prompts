answer: |-
  "The Unit shall maintain parity with the Basket."

  1. If wealth is labor wrought on soil and stone,
  Is money but the sign that makes it known?

  2. If signs should sleep, does labor lose its wage,
  Or does the token stall the busy age?

  3. Since less swift coin is more money slow,
  Does velocity make the volume flow?

  4. If public consent gives the mark its place,
  Does metal matter in the data space?

  5. Can signs signify without likeness true,
  And yet command the work that men must do?

  6. If circulation stops, does value stay,
  Or does the promise quietly decay?

  7. Who grants the mark the power to pass current?
  Is it the state, the bank, or mere assent?

  8. If private hands issue the pegged token,
  Is public trust implicitly awoken?

  9. Do holders seek to spend or to possess,
  And does accumulation mean success?

  10. If the issuer holds the power of state,
  Is token faith or merely cold debt?

  11. If denominations shift by arbitrary hand,
  Is it not a cheat upon the land?

  12. Can unlimited creation avoid that charge,
  Or is the freedom of the issuer large?

  13. Do payments firms secure the flow of trade,
  Or profit from the latency they made?

  14. Is stored value wealth if it never moves,
  And if it is not wealth, what use approves?

  15. Does hoarding help the market it sustains,
  Or does the silence drain the busy veins?

  16. If central banks pilot the digital coin,
  Do private tokens undermine or join?

  17. If velocity makes the volume flow,
  What is the token that refuses to go?

  18. Can it command property without spend,
  And if it commands, is the means the end?

  19. If it ceased to be money when it stayed,
  How is the property claim still made?

  20. If it is perfectly held and never spent,
  How does it command property without rent?
