answer: |-
  You have isolated the structural engine that drives the failure of the Doomsday Argument (DA) and its kin, and your intuition is correct: while this difficulty is the core of what is standardly called the **Reference Class Problem**, that label is too broad to capture the specific *dynamic tension* you describe. The standard label treats the issue as a static ambiguity (which class do we pick?), whereas you have identified a zero-sum trade-off (any pick undermines a necessary condition of the inference).

  There is no single, canonical proper noun (à la "Gettier Problem") established in the literature solely for this trade-off. However, it is the active mechanism behind the **"Reference Class Objection"** as refined by critics like Ken Olum, Radford Neal, and Korb & Oliver.

  Below is the carving you requested: the nearest established concepts, how your configuration differs, the state of resolvability, external analogues, and a defensible term for the configuration itself.

  ### 1. Nearest Established Concepts and Differentiations

  **A. The Reference Class Problem (Reichenbach / Salmon)**
  *   **The Concept:** In frequentist probability, a singular event (e.g., "John Smith will die at 70") belongs to multiple classes (men, smokers, philosophers), each yielding different probabilities. There is no principled way to select the "correct" class.
  *   **The Difference:** The classical problem is about *ambiguity* or *underdetermination*. Your configuration is about *instability*. In the classical problem, one hopes to find a "narrowest relevant class." In your configuration, finding the narrowest relevant class (to satisfy randomness) *destroys* the inference (by removing informativeness). The classical problem asks "Which one?"; your configuration demonstrates that "Whichever one you choose fails."

  **B. The Principle of Indifference (Keynes / Jaynes)**
  *   **The Concept:** In the absence of evidence, assign equal probability to all possibilities. Paradoxes (like Bertrand's) arise when different parametrizations yield different results.
  *   **The Difference:** Bertrand-style paradoxes turn on mathematical description (how we carve the sample space). Your tension turns on *epistemic status* (the relationship between the observer's evidence and the sample). The DA fails not because we can parametrize the population differently, but because the observer's *knowledge* of their own atypicality (e.g., "I am a DA-considerer") correlates with the class definition in a way that breaks the indifference assumption.

  **C. The Problem of Old Evidence (Glymour)**
  *   **The Concept:** In Bayesian confirmation theory, if evidence $E$ is already known, $P(E) = 1$, so it cannot confirm a hypothesis $H$.
  *   **The Difference:** This is structurally similar to your "narrowing" condition. If the observer conditions on all their evidence ("I am alive in 2024 reading DA"), the probability of their existence becomes 1, and the likelihood ratio collapses. However, the "Old Evidence" problem is about *confirmation*, whereas your tension is about *sampling validity*. The DA requires the observer to treat their birth rank as a random draw *despite* knowing it; the tension arises because acknowledging the knowledge invalidates the draw, but ignoring it invalidates the sample.

  ### 2. Resolvability in the Literature

  Has anyone argued this is resolvable? Yes, but the solutions generally concede one horn of your dilemma to save the other.

  *   **Bostrom's "Same Evidence" Rule:** In *Anthropic Bias* (2002), Nick Bostrom proposes the Self-Sampling Assumption (SSA) should apply to the reference class of "observers with the same evidence."
      *   *Resolution Attempt:* This secures the **Randomness** premise (you are typical among those with your exact evidence).
      *   *Failure:* As you note, this triggers the **Informativeness** collapse. If my evidence includes "I am considering the Doomsday Argument," the class shrinks drastically, and my rank within *that* class tells me nothing about total human history. Bostrom acknowledges this but suggests a "weak" version of evidence, which critics argue is ad hoc.
  *   **Full Non-indexical Conditioning (FNC) (Radford Neal):** Neal argues we should condition on all evidence, including the fact that *someone* with our exact memories exists.
      *   *Resolution Attempt:* This attempts to bypass the reference class selection entirely.
      *   *Failure:* It tends to favor larger universes (SIA-style), leading to the "Presumptuous Philosopher" problem, where we can rule out small universes a priori. It resolves the tension by abandoning the "random draw from a population" model entirely, effectively dissolving the DA rather than saving it.
  *   **The "No-Go" Consensus:** Most contemporary critics (e.g., Olum 2002, Korb & Oliver 2011) accept your diagnosis as fatal. They argue the tension is not resolvable because the DA requires a "view from nowhere" (to be a random sample) that is incompatible with the "view from somewhere" (the specific evidence required to make the observation).

  ### 3. External Analogues

  This structure appears wherever inference relies on treating a specific instance as representative of a total set while acknowledging the instance's specific selection criteria.

  *   **Statistics: The Bias-Variance Trade-off.**
      *   *Analogue:* A model that is too simple (wide population) has high bias (the randomness assumption is false; the sample is atypical). A model that is too complex (narrow population) has high variance (the sample size is too small to yield predictive power/informativeness).
      *   *Difference:* In statistics, this is a tuning parameter optimized for prediction. In anthropics, it is an epistemic constraint with no "optimal" setting, only a contradiction.
  *   **Law: Rule 403 (Relevance vs. Prejudice).**
      *   *Analogue:* Evidence must be relevant (informative) to be admitted, but if it is too specific, it may be excluded as prejudicial or misleading (unreliable/unrepresentative).
      *   *Difference:* Legal exclusion is pragmatic/normative. The anthropic tension is logical/ontological.
  *   **Ecology: Sample Representativeness.**
      *   *Analogue:* To estimate a population size, one must trap animals. If the trap is too general, it catches non-target species (violating randomness/typicality). If the trap is baited specifically for the target, the catch rate cannot be used to estimate total population density without knowing the bait's attraction bias (violating informativeness).

  ### 4. A Defensible Term and Definition

  Since no canonical name exists, and "Reference Class Problem" is insufficiently precise for your seminar, I propose the following term. It is descriptive, neutral, and captures the inverse relationship you identified.

  **Term:** **The Typicality-Informativeness Trade-off**
  *(Alternative: The Reference Class Dilemma)*

  **Definition:**
  The epistemic tension in self-locating reasoning wherein the justification for treating an observer as a random sample (Typicality) is inversely proportional to the probabilistic leverage that sample position provides regarding the total population size (Informativeness).

  *   **Condition A (Typicality):** Requires the reference class to be defined narrowly enough that the observer possesses no unique properties distinguishing them from other class members.
  *   **Condition B (Informativeness):** Requires the reference class to be defined broadly enough that the observer's ordinal position within it correlates with the total class size.
  *   **The Trade-off:** Strengthening Condition A (by narrowing the class to ensure randomness) weakens Condition B (by making the ordinal position independent of the total size of the broader group of interest). Strengthening Condition B (by widening the class) weakens Condition A (by introducing selection effects that violate randomness).

  **Boundary Cases:**
  *   **Simple Lottery:** You hold ticket #60 billion.
      *   *Trade-off Absent:* The class is "tickets sold." You are a random member (Typicality holds). Your rank tells you exactly how many tickets were sold (Informativeness holds).
      *   *Why:* There is no *selection effect* on your part; you did not choose to observe ticket #60 billion because of its number. In the DA, you are selecting *yourself* as the observer, which introduces the tension.
  *   **Pure Indexicality:** "I am here."
      *   *Trade-off Absent:* The class is "locations."
      *   *Why:* There is no ordinal rank to provide informativeness about the total size of space.

  ### Summary for the Seminar

  You are describing the **Typicality-Informativeness Trade-off**. It is the dynamic core of the **Reference Class Problem**. While the literature often subsumes this under the general header of "Reference Class," your distinction is vital: the problem is not merely that we don't know *which* class to pick, but that the *criteria for picking a valid class* (randomness) are logically in tension with the *criteria for a useful class* (predictive scope).

  Most attempts to resolve the Doomsday Argument fail because they attempt to fix the reference class statically, whereas your analysis shows the difficulty is structural to the inference itself. The only ways out are to abandon the Self-Sampling Assumption (moving to SIA or FNC) or to accept that birth rank carries no probabilistic weight regarding total population size.
