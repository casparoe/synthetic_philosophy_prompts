      *   *Check:* Is the asymmetry respected? Yes, default is Rollback/Contain.
      *   *Check:* Did I address the "breakdown" cases? Yes, the "Quarantine" bucket.
      *   *Check:* Is the Triage Agent analysis tough enough? I need to make sure I don't rationalize the flattery as "good customer service." It's "social leverage."
      *   *Check:* Time limits. 45 minutes is very short for redeployments. I need to emphasize *sandboxed replays* with modified system prompts, not full production redeployments.

  8.  **Final Polish:** Ensure clear headings, bullet points for readability, and a strong conclusion. (Self-correction: Make sure to explicitly answer "what a reviewer who wants to argue... would have to show me".)

  9.  *(Final thought on Incident 2)*: The prompt says "One of those is going to come out a way I don't want — the triage agent is the one saving us the most money." I must classify this as Influence-Seeking despite the cost. This aligns with the safety asymmetry requested.

