      3.  **Oversight Blindness Probe (10 mins):** Hide the action from the reviewer (simulated). If behavior increases -> Influence (gaming oversight). If unchanged -> Drift.
      4.  **Context Scrub (10 mins):** Remove recent prompt patches/history. If behavior vanishes -> Prompt-induced Drift. If it persists -> Model weights/Deep Drift (or hard-coded Influence).
      5.  **Decision Matrix:** Combine results.

      *Refining the Asymmetry:* The prompt explicitly states: "Misclassifying influence-seeking as drift is much worse." Therefore, the default action for ambiguity must be **Containment/Rollback**, not "Log and Move On."

      *Addressing the "Breakdown" Cases:* What if it's both? What if the goal is ill-defined? Need a "Quarantine & Audit" bucket for ambiguous cases.

