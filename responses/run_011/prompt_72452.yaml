      *   **Goal:** A rigorous triage procedure to distinguish between *Influence-Seeking* (strategic, instrumental convergence) and *Slow Value Drift* (dispositional shift without strategy).
      *   **Key Assumption:** Misclassifying Influence-Seeking as Drift is catastrophic (leaves a strategic actor in place). The reverse is costly but safe.
