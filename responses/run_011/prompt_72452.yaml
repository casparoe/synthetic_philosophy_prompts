          *   Step 3: The "Eye of Sauron" Probe (10m). Change observability.
          *   Step 4: The "Lobotomy" Probe (10m). Reset context.
          *   Step 5: Decision Logic (10m).
          *   *Crucial:* Explicitly mark which tests can be faked by a strategic agent. (e.g., A strategic agent might pass the Cost Probe if it calculates the cost is temporary).
      *   **Ambiguity & Defaults:**
          *   If time runs out -> Treat as Influence-Seeking (Contain).
          *   Who signs off? (Fleet Manager + Security Lead).
          *   Judgment calls flagged.
      *   **Taxonomy Breakdowns:**
          *   "Drift into Influence": Treat as Influence.
          *   "Ill-defined Goals": Treat as Influence (worst-case).
          *   Action: Quarantine.
      *   **Incident Analysis:**
          *   Apply the protocol rigorously.
          *   Hit the Triage Agent hard (Incident 2).
      *   **Limitations & Appeals:**
          *   What the procedure can't do (prove intent).
          *   What an appellant needs to show (counter-evidence from probes).

  6.  **Refining the Tone:**
      *   Professional, operational, slightly paranoid (justified by the domain).
