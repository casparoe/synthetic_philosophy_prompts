answer: |-
  Here is the architecture for your forty-minute presentation.

  ### First: The Order of Presentation

  You must resist the temptation to start with the "good news" (that groups get smarter). If you show the table of probabilities first, the theorem looks like a magic trick that validates your colleague's proposal. You must build the trap before you spring it.

  **1. The Setup (5 minutes)**
  *   **Action:** Define the scope. The theorem applies *only* to binary questions (Yes/No, Guilty/Not, Compliant/Violation) where there is a single, mind-independent fact of the matter.
  *   **Dependency:** This must come first to eliminate the "averaging" intuition immediately. If they think the theorem applies to "what is the best policy," the rest of the talk is wasted.
  *   **Whiteboard:** Write "YES / NO" and "FACT OF THE MATTER."

  **2. The Competence Condition (10 minutes)**
  *   **Action:** Introduce individual probability ($p$). Ask: "If you looked at the evidence alone, how often would you be right?"
  *   **Dependency:** You cannot show the group benefit until you establish that $p > 0.5$. This is the hinge. If $p < 0.5$ (we are systematically biased or incompetent), the theorem proves the opposite: the majority becomes *certainly wrong* as the group grows.
  *   **Why here:** If you present the headline result ("14 people are better than 1") before this, the audience treats $p > 0.5$ as a minor technicality. It is the engine. If the engine is broken, the car doesn't just stop; it reverses.

  **3. The Independence Condition (10 minutes)**
  *   **Action:** Define independence not as "no cheating," but as "no shared error."
  *   **Dependency:** This must precede the numerical table. The arithmetic of the theorem assumes errors are random. If errors are correlated (we all read the same bad report), the math breaks.
  *   **Why here:** If you introduce independence *after* the numbers, the audience will assume the numbers apply to their current deliberative process. You must frame the numbers as a "best case scenario" that requires isolation.

  **4. The Numerical Demonstration (5 minutes)**
  *   **Action:** Show the table. Compare $N=1$ to $N=14$ given $p=0.6$. Then show $N=14$ given $p=0.4$.
  *   **Dependency:** Now that they understand $p$ and Independence, the table confirms the logic rather than substituting for it.

  **5. The Deliberative Trade-off (10 minutes)**
  *   **Action:** Apply the theorem to the room. Deliberation raises $p$ (we learn from each other) but threatens Independence (we think alike).
  *   **Dependency:** This relies on all previous steps. It allows you to refute the colleague's proposal not by rejecting the theorem, but by showing that "dispensing with argument" freezes $p$ at its current level while doing nothing to guarantee independence.

  ---

  ### Second: The Single Example

  **The Example:** "The Property Line Violation."
  **The Scenario:** A neighbor complains that a new fence crosses the municipal boundary by two feet. There is a true fact (it either does or it doesn't). We have the survey maps, but they are old and faded. Each of us examines the map independently.
  **The Parameters:** We are not surveyors. We are reasonably diligent. We have a 60% chance ($p=0.6$) of interpreting the map correctly individually.

  **Justification of Choice:**
  *   **Binary & Determinate:** Unlike "Where should we build the school?" (which involves values), the fence is either over the line or it isn't. This satisfies the theorem's requirement for a "correct answer."
  *   **Competence ($0.5 < p < 1$):** It is not obvious (otherwise $p \approx 1$ and we don't need a theorem). It is not a guess (otherwise $p = 0.5$). It requires skill we partially possess.
  *   **No Averaging:** You cannot average "over the line" and "not over the line" to get "half over the line." The decision is discrete. This blocks the intuition that errors cancel out like high and low weight guesses.
  *   **Relevance:** It mirrors your actual work (planning appeals, contractor disputes) without triggering immediate political polarization.

  **On Urns and Coins:**
  *   **Verdict:** **Misleads.**
  *   **Reason:** An urn with black and white balls implies pure randomness. A coin flip implies $p=0.5$. Your panel members are not flipping coins; they are examining evidence. Using a coin analogy invites the objection: "But we aren't guessing, we are judging." The Property Line example respects their agency while acknowledging their fallibility.

  ---

  ### Third: The Misconception Map

  You must intercept these errors at specific points. Do not wait for questions.

  | Misconception | Placement in Sequence | Strategy |
  | :--- | :--- | :--- |
  | **1. Continuous vs. Discrete** (That this is about averaging guesses) | **In The Setup (Step 1).** | **Preempt.** State clearly: "This theorem does not apply if we are guessing the *cost* of a project. It only applies if we are judging *compliance*." |
  | **2. Independence = No Collusion** (That it just means we don't bribe each other) | **In The Independence Condition (Step 3).** | **Preempt.** Explicitly distinguish "private dealing" from "shared error." Say: "If we all read the same flawed report, we are independent in spirit but correlated in error. The theorem fails." |
  | **3. The Deference Paradox** (That I should just vote with the majority) | **In The Competence Condition (Step 2).** | **Allow to Surface.** Ask the room: "If the theorem says the majority is right, should I just wait and copy them?" Let someone say yes. Then refute it: "If everyone does that, $p$ becomes 1.0 for the first person and 0.5 for everyone else. The competence vanishes." |
  | **4. Deliberation vs. Assumption** (That the theorem describes a talking group) | **In The Deliberative Trade-off (Step 5).** | **Preempt.** State: "The theorem assumes isolated votes. Deliberation creates correlation. We use deliberation to raise $p$, knowing we risk independence." |
  | **5. Fairness/Legitimacy** (That this proves majority rule is 'just') | **In The Setup (Step 1).** | **Preempt.** State: "This is a claim about *accuracy*, not *rights*. It tells us when we are likely to be right, not when we are being fair." |

  ---

  ### Fourth: The Closing Question

  **The Question:**
  "Suppose, before we vote, we invite the Town Engineer to tell us her professional view on the property line. She is 90% accurate. Should we all listen to her and then vote?"

  **The Diagnostic:**
  *   **The Confident Wrong Answer:** "Yes, absolutely. Her $p$ is 0.9, which is higher than our 0.6. The theorem says higher competence wins, so we should follow her."
      *   *What this reveals:* They have memorized the slogan "Majority/Expertise = Truth" but missed the **Independence** condition. They treat the panel as a vessel for truth rather than a generator of independent trials.
  *   **The Grasp of the Result:** "No. If we all listen to her, we are no longer 14 independent voters. We are 14 copies of one voter. Our group probability drops to 0.9 (her score) instead of the 0.98+ we could achieve as 14 independent people at 0.6."

  ---

  ### Fifth: Disclaimers and Gestures

  You must be honest about what you are omitting, or the colleague who proposed skipping deliberation will claim you are hiding the "real math."

  **1. What to Openly Decline:**
  *   **The Limit Proof:** "I am not going to show you the calculus of why the probability approaches 100% as $N$ goes to infinity. You have to trust that the arithmetic table I showed you continues to climb."
  *   **Wording:** "The math behind the curve is binomial expansion. It's correct, but it won't help us decide whether to talk to each other. So I am leaving it out."

  **2. What to Gesture At (Crucial):**
  *   **Correlation:** You cannot leave this out, because it is the mathematical weapon against your colleague's proposal.
  *   **Wording:** "I am not going to calculate the formula for *correlated* votes. But you need to know the rule: **Correlation shrinks the group.** If our votes are 50% correlated, a panel of 14 acts mathematically like a panel of 7. If we simply rubber-stamp a majority without argument, we risk high correlation. The theorem doesn't forbid skipping deliberation, but it warns that without deliberation, our effective $N$ might be much smaller than 14."
  *   **Why:** This concedes the math is deeper while using the *implication* of that math to support deliberation. It prevents the colleague from saying, "You didn't prove correlation matters." You admit it matters, even if you don't derive the coefficient.
