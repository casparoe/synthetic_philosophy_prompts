prompt: |-
  Last autumn I was drawn by lot onto our municipality's standing review panel: fourteen residents, none of us trained in law, statistics, or economics, charged with reaching findings on contested local questions — a disputed school siting, a complaint against a contractor, an appeal of a planning refusal. Our findings carry real weight, and we decide by majority vote. At our second sitting, one member argued that since there are fourteen of us, the majority is "mathematically almost certain" to be right, and proposed that we adopt whatever a bare majority reports as our standing practice and dispense with the long argument sessions. Two others agreed enthusiastically. The chair has asked me, because I once took a course in political philosophy, to open next month's meeting with forty minutes on the Condorcet jury theorem: what it actually says, what it needs in order to say it, and why it does not settle the question my colleague thinks it settles.

  I am not asking you to explain the theorem to me. I want a plan for how I should explain it to them, under these constraints: forty minutes, a whiteboard, no slides, and no formulas beyond arithmetic a person will accept while standing at a table. A short table of numbers is welcome; a proof is not.

  Please give me the following.

  First, the order of presentation, with the dependency reasons stated. In particular, tell me why the audience cannot be handed the headline result before they have understood that its force depends entirely on each member being individually better than a coin flip, and that the same reasoning runs backwards with a vengeance when they are worse. Tell me where the assumption of independence has to be introduced — before or after the numbers — and what breaks if I introduce it later.

  Second, the single example that should carry the whole thing. I want you to justify the choice by saying what such an example must contain (a genuinely binary question with a determinate right answer, members who have some skill but not certainty) and what it must be carefully free of (an answer so obvious that the room short-circuits the argument, any setup in which members can see one another's votes before casting, and anything that smuggles in an averaging intuition). Say explicitly whether the familiar urn-and-ball or repeated-coin framing serves or misleads at this level, and if it misleads, propose a replacement drawn from the sort of ordinary factual questions a panel like mine might actually face.

  Third, a misconception map. I expect at least these, and I want each one placed at the precise point in the sequence where it should be headed off, with a note on whether any of them should instead be allowed to surface on its own so that I can answer it in public:

  - that the theorem is the same thing as the intuition that many independent guesses at a continuous quantity converge on the truth, with errors cancelling out, when in fact it concerns discrete right-or-wrong questions and nothing cancels;
  - that "the majority is more likely correct" licenses each individual member to defer to the majority rather than exercise judgment of their own, and the difficulty that arises if everyone draws that inference, since the competence the theorem presupposes would then have no source;
  - that independence means only an absence of collusion or private dealing, rather than something about how members' correctness stands to one another once the truth of the matter is fixed;
  - that the theorem describes what happens in a deliberating body, when deliberation is very nearly the thing that destroys its central assumption;
  - that it is a claim about fairness, legitimacy, or whose interests get represented.

  Fourth, one question I can put to the room at the end that will separate those who have grasped the result from those who have merely adopted a slogan, together with a description of what a confident wrong answer to it would sound like.

  Fifth, what I should openly decline to cover at this level, and how to say so honestly. I have in mind the mathematics behind the limit result and what happens to votes that are correlated rather than independent. Tell me which of these to disclaim, in what words, and which to gesture at anyway because leaving it wholly unmentioned would give my colleague's proposal an unfair advantage.

  I am not looking for readings, sources, or anything to assign the panel afterwards. I need the architecture of the explanation.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 40-minute presentation plan on the Condorcet Jury Theorem (CJT) for a municipal review panel (14 laypeople).
      *   **Context:** The panel makes binding decisions by majority vote. One member wants to skip deliberation because "math says majority is almost certainly right." The user (presenter) needs to explain why this is flawed using CJT.
      *   **Constraints:** 40 minutes, whiteboard only, no slides, no complex formulas (arithmetic only), one main example, specific sections required (Order, Example, Misconception Map, Closing Question, Disclaimers).
      *   **Tone:** Practical, architectural, precise, respectful of the audience's intelligence but aware of their lack of technical training.

  2.  **Deconstruct the Five Requirements:**

      *   **1. Order of Presentation:** Needs logical flow. Crucial point: The "better than coin flip" condition ($p > 0.5$) must come *before* the "big numbers are better" result. If $p < 0.5$, big numbers make it worse. Independence needs to be introduced early enough to frame the numbers, otherwise the numbers look like magic.
      *   **2. The Single Example:** Needs to be binary, have a ground truth, involve some skill ($p > 0.5$ but $< 1$), and avoid "averaging" intuitions (like guessing a weight). Urn/coin is too abstract. Needs to feel like *their* work (planning, facts, contracts).
      *   **3. Misconception Map:** Five specific misconceptions listed. Need to place them in the flow (preventative vs. reactive).
      *   **4. Closing Question:** A diagnostic question to test understanding vs. sloganizing. Needs a specific "confident wrong answer" profile.
      *   **5. Disclaimers:** What to leave out (math proofs, correlation models) but what to hint at (correlation is dangerous) so the "skip deliberation" guy doesn't think he's right by omission.

  3.  **Drafting - Section by Section:**

      *   **Section 1: Order of Presentation.**
          *   *Start:* The claim being examined (Majority = Truth).
          *   *Step 1:* Define the conditions. Binary choice, ground truth.
          *   *Step 2:* Individual Competence ($p$). This is the hinge. If $p < 0.5$, the theorem inverts. This *must* happen before showing the group benefit.
          *   *Step 3:* Independence. If we copy each other, $N$ doesn't grow.
          *   *Step 4:* The Group Effect (The Numbers). Show how $N$ amplifies $p$.
          *   *Step 5:* Application to Deliberation. Deliberation affects $p$ and Independence.
          *   *Reasoning:* If I show the numbers first, they look impressive. If I show $p < 0.5$ later, it feels like an exception rather than a fundamental condition. Independence must frame the numbers, otherwise they think "14 people talking" equals "14 independent votes."

      *   **Section 2: The Example.**
          *   *Criteria:* Binary, ground truth, $0.5 < p < 1$, no averaging, no obvious answers.
          *   *Bad:* "Guess the weight of the ox" (averaging/continuous). "Is the sky blue?" (too easy, $p \approx 1$). Urn/Ball (too abstract).
          *   *Good:* A factual question relevant to their work. "Did the contractor pour the concrete on a rainy day?" (Evidence exists, but ambiguous). Or "Does this soil sample meet the drainage code?"
          *   *Selection:* "The Permit Compliance Check." Imagine a specific regulation (e.g., setback distance). There is a fact (measured distance) and a rule (code limit). But the measurement is tricky (where does the property line start?). Each member reviews the file independently.
          *   *Refinement:* Let's make it simpler for a whiteboard. "The Faulty Wire." A building inspector scenario. Is the wiring up to code? Yes/No. There is a correct state. Each inspector has a 60% chance of spotting the fault.
          *   *Wait, better:* Stick to their context. "The Boundary Dispute." Two neighbors. Where is the line? There is a true line (survey). We look at old maps. Each of us interprets the map.
          *   *Decision:* **The "Hidden Violation" Scenario.** A specific planning application. Question: "Does this proposal violate the height restriction?" (Yes/No). There is a fact of the matter. Members review plans independently. Competence is 60% (better than random, not perfect).
          *   *Why:* It avoids "averaging" (height isn't averaged, it's a binary violation). It mirrors their work. It allows for $p < 1$.

      *   **Section 3: Misconception Map.**
          *   *Averaging/Continuous:* Address early when defining the problem type.
          *   *Deference/Paradox:* Address after the result. If everyone defers, $p$ drops.
          *   *Independence/Collusion:* Address before the numbers. It's about error correlation, not just cheating.
          *   *Deliberation:* Address at the end. Deliberation creates correlation.
          *   *Fairness/Legitimacy:* Address at the very end. CJT is epistemic, not democratic.
          *   *Strategy:* Let "Deliberation" surface naturally since that's the prompt. Let "Fairness" be preempted (it's not about rights).

      *   **Section 4: Closing Question.**
          *   *Goal:* Distinguish "Majority is magic" from "Majority works *if*..."
          *   *Question:* "If we hire an expert to tell us how to vote, does our group competence go up or down?"
          *   *Wrong Answer:* "Up, because the expert knows more." (Violates independence/competence source).
          *   *Right Answer:* "Down, because we are no longer independent judgments; we are 14 copies of one."

      *   **Section 5: Disclaimers.**
          *   *Math:* Don't do the binomial expansion.
          *   *Correlation:* Must mention it. If votes correlate, the "N" shrinks. This is the killer argument against "no deliberation" (since deliberation correlates votes).
          *   *Wording:* "I am not showing you the curve, but I am telling you the slope depends on independence."

  4.  **Refining and Polishing:**
      *   *Time Check:* 40 minutes is tight.
          *   Intro/Claim: 5 min.
          *   Example/Competence ($p > 0.5$): 10 min.
          *   Independence/Numbers: 10 min.
          *   Misconceptions/Deliberation: 10 min.
          *   Closing/Q&A: 5 min.
      *   *Whiteboard:* Need to visualize the table.
      *   *Tone:* Check against the prompt's request for "architecture of the explanation." No fluff.
      *   *Constraint Check:* "No formulas beyond arithmetic." Use a table of probabilities for N=1, 3, 5, 14.
      *   *Constraint Check:* "Dependency reasons stated." Explain *why* order matters.
      *   *Constraint Check:* "Misconception Map." Place them precisely.

  5.  **Self-Correction during Drafting:**
      *   *Critique:* Is the "Hidden Violation" example too dry?
      *   *Fix:* Make it concrete. "The Setback." Did the builder encroach 1 meter? Yes/No.
      *   *Critique:* Is the order right on Independence?
      *   *Fix:* Introduce Independence *before* the table. If you calculate the table assuming independence, then explain independence later, they will think the table applies to dependent voters too.
      *   *Critique:* The "Deference" paradox.
      *   *Fix:* Ensure this is highlighted as the reason we *must* deliberate to raise $p$, even if deliberation risks independence. It's a trade-off, not a dismissal.

  6.  **Final Review against Prompt:**
      *   Order with dependency reasons? Yes.
      *   Single example with justification? Yes.
      *   Misconception map with placement? Yes.
      *   Closing question with wrong answer profile? Yes.
      *   Disclaimers with wording? Yes.

  7.  **Final Polish:** Ensure the voice is authoritative yet helpful, matching the user's sophisticated request. (The user is clearly well-read, so don't dumb it down, just structure it.)

  *(Self-Correction on the Example)*: The prompt asks to avoid "averaging intuition." A binary planning violation is good. But the prompt also says "ordinary factual questions a panel like mine might actually face." Let's use **"The Contractor's Invoice."** Did the work happen? Yes/No. There is a truth. We have documents. We are 60% likely to read them right. This is very concrete. Actually, **"The Boundary Marker"** is better. It's physical, binary (inside/outside), and prone to interpretation error. Let's go with **"The Property Line."**

  *(Self-Correction on Misconceptions)*: The prompt lists 5 specific misconceptions. I need to make sure I address *all* of them in the map, not just some.
  1. Continuous vs Discrete.
  2. Deference/Paradox.
  3. Independence definition.
  4. Deliberation vs Assumption.
  5. Fairness/Legitimacy.
  I need to slot all 5 into the timeline.

  *(Self-Correction on Disclaimers)*: The prompt asks what to "openly decline" vs "gesture at." Correlation must be gestured at because it defeats the colleague's argument. Math proofs should be declined.

