  ### The remarks

  **[0:00]**
  Good morning. Welcome. Look around this room. Half of you read Langdon Winner for pleasure; half of you read ASHRAE standards for work. We have philosophers, facilities engineers, architects, and a dozen undergrads getting credit for showing up. All of you are equally essential to today. Thank you for coming.

  **[1:00]**
  We are meeting in a building that asks us to lie to it. To keep this room below twenty-nine degrees, my department files a phantom "reading group" booking every Friday afternoon. The HVAC system does not measure heat; it measures administrative compliance. If we don't perform the paperwork, the system assumes no one is here, and we sweat. The technology isn't a passive tool waiting for instruction; it actively structures our labor. We must become clerks to be comfortable.

  **[2:00]**
  Similarly, our step-free entrance locks at 5 PM. Our keynote speaker arrives at 6. She uses a wheelchair. So, she will enter through the loading dock behind the kitchens. This wasn't an accident, and it isn't malice. It is an alignment of security protocols and operating hours that prioritizes one kind of flow over another. The door works perfectly. It opens for badges, and closes for everyone else. The friction isn't in the hinge; it's in the schedule. We accept this friction so the security logic holds.

  **[3:00]**
  I want to speak directly to the team who designed these systems, including the access control architect sitting right here. You are not on trial. You solved for security, efficiency, and energy conservation within a budget and a brief. You built a machine that works exactly as specified. The question isn't whether the machine works. It's what kind of human behavior the machine requires to function smoothly. We are co-conspirators in this workaround, not just victims of it. We choose to file the phantom booking. We choose to route the keynote through the dock.

  **[4:00]**
  To the STS scholars: please resist the urge to diagnose. To the engineers: please resist the urge to defend. We aren't here to decide if this building is "political" in the abstract. We know the politics are real because we feel them in the heat and the route we take to enter. This workshop isn't about assigning blame for the past. It's about negotiating the maintenance of the present. When we fix the HVAC glitch, do we change the code, or do we just hire another admin to file the form?

  **[5:00]**
  So, our working title is "Who Built This?" But that implies a finished past tense. A better question for our first panel is this: "When the system demands a workaround—like a phantom booking or a loading dock entrance—who is authorized to rewrite the code, and who is required to follow it?" Let's begin.

  ***

  ### Where the philosophy is load-bearing

  1.  **"The technology isn't a passive tool waiting for instruction; it actively structures our labor."**
      *   *Weight:* Rejects neutrality without blaming users.
      *   *Breaks if softened:* If changed to "we use the tool to structure labor," engineers hear flattery ("tools are dumb") and STS hear nonsense.
  2.  **"We are co-conspirators in this workaround, not just victims of it."**
      *   *Weight:* Distributes agency. Protects the designer from being the sole villain while refusing determinism.
      *   *Breaks if softened:* If changed to "we are forced to workaround," it implies determinism (STS groan). If changed to "we choose to workaround," it implies total freedom (engineers tune out).
  3.  **"Who is authorized to rewrite the code, and who is required to follow it?"**
      *   *Weight:* Shifts from ontological debate ("is it political?") to power analysis ("who decides?").
      *   *Breaks if softened:* If changed to "how do we fix this?", it becomes a maintenance ticket, not a philosophical inquiry.

  ***

  ### Escape hatches

  1.  **If the engineers look defensive:** "I want to be clear: the phantom booking is our department's choice, not a system error. You built a system that demands truth; we chose to feed it fiction to stay cool."
  2.  **If the STS scholars start theorizing too early:** "Let's hold the theory for the panel. For now, I just want us to agree that the loading dock entrance is a fact, not a metaphor."
  3.  **If the room goes silent after the 'co-conspirator' line:** "It's an uncomfortable word, 'conspirator.' But it implies we all have the power to change the plot. That's why you're here."
