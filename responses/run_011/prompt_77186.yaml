      *   *Verdict:* This *is* a real objection to Parfit if he claims R is a "deep further fact." But Parfit admits R is a matter of degree. The "measurement resolution" objection actually *supports* Parfit: it shows there is no deep fact, only descriptive facts about similarity. The "strangeness" is the point.
