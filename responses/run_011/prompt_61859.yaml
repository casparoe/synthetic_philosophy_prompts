prompt: |-
  You are an expert in the philosophy of mind, with particular command of the literature on mental causation and the causal exclusion argument. Before answering, think carefully and begin by sketching, in a few sentences, how you would map the relations that argument trades on — causation, realization, supervenience, causal closure, and the exclusion premise itself — so that I can see the structure you are working from.

  The context is this. I am revising my graduate seminar on mental causation and want to state one point precisely before asserting it in lecture. My reconstruction of the dialectic runs as follows. Nonreductive physicalists hold that mental properties are realized by, and therefore determined by, physical properties. But realization just is a determination relation, and determination is causal: the realizer brings it about that the realized property is instantiated. It follows that a realized mental property stands to its base as an effect to its cause, and an effect cannot cause anything on account of what already causes it — that would be causation running back down the realization relation. On this reading, the exclusion problem is fundamentally a problem about the direction of causation, and the premise ruling out systematic overdetermination is doing no substantive work: it is a gloss on the impossibility of a mental property causing what its own realizer causes.

  Is that the right diagnosis? If it is, explain why the argument still needs the no-overdetermination premise at all, and how a nonreductive physicalist should reply to someone who presses the objection in this form. If it is not, identify exactly which step in my reconstruction goes wrong and which two relations it conflates, and then give me the version of the worry that survives that correction — I want my students to meet the strongest form of the puzzle, not a mangled one. Throughout, please distinguish what you take to be settled from what remains genuinely contested, and flag any place where my framing has imported an assumption the literature does not share.
