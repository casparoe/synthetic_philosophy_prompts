prompt: |-
  I lead a small behaviour-and-evidence team inside a national environmental agency. Roughly twice a month a policy colleague brings us a draft public appeal asking households to change some individual consumption habit — fewer flights, less beef, shorter showers — and asks whether we can stand behind it. Two things keep going wrong. First, the drafts routinely justify the appeal by asserting that each person's act has a measurable effect on the outcome, and our own analysts keep telling us that, given the size of the population and the way supply is organised, that assertion is either false or unverifiable; a citizen who does the arithmetic can reasonably reply that her own act changes nothing. Second, when we raise this, colleagues reply that such appeals are worth making anyway, and we have no principled way of saying when that is right and when it is wishful thinking dressed as strategy.

  Please write a decision procedure my team can run on a draft appeal in about half an hour, usable by people who have not studied philosophy: the questions in order, what counts as a sufficient answer to each, the point at which the procedure returns "do not make this claim", the point at which it returns "make the claim, but on grounds other than the individual causal effect", and the points at which the question is really one of political judgement rather than fact and must be handed to a person. It must preserve the distinctions that actually do the work — that an act can make no difference to the outcome and still be one we can properly ask for, and that an act can make a difference only by helping to cross a threshold or by coordinating with others rather than by contributing smoothly — while stating plainly which distinctions a half-hour procedure has to drop. Flag the case types on which it will predictably misfire.

  Then run the procedure on three drafts: (a) an appeal to eat less beef, where our procurement data show the retailer orders in fixed lots of several thousand tonnes, so a household's purchases matter only when they help tip an order across a lot boundary; (b) an appeal to forgo one return flight a year, where we can identify no such threshold and per-passenger emissions are close to linear; (c) an appeal to boycott a named supplier's palm-oil products, where the campaign has already been designed and publicly announced and a senior colleague will be very unhappy if the procedure says we cannot support it.

  Finally, tell me how confident you are in the procedure's central claims, and single out the step you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small behaviour-and-evidence team in a national environmental agency.
      *   **Problem:** Policy colleagues draft public appeals based on individual causal impact (e.g., "your action matters"). Analysts say this is often false/unverifiable (negligible impact). Colleagues say "do it anyway." No principled way to distinguish valid appeals from wishful thinking.
      *   **Task 1:** Create a 30-minute decision procedure for the team.
          *   Audience: Non-philosophers.
          *   Structure: Ordered questions, sufficient answers, stop points ("do not make claim," "make claim on other grounds," "escalate to political judgement").
          *   Nuance: Preserve key distinctions (thresholds, coordination vs. smooth contribution) but acknowledge simplifications.
          *   Limitations: Flag case types where it might misfire.
      *   **Task 2:** Run the procedure on three specific drafts:
          *   (a) Less beef (fixed lot procurement, threshold effects).
          *   (b) Forgo one flight (linear emissions, no threshold).
          *   (c) Palm oil boycott (campaign already public, senior stakeholder pressure).
      *   **Task 3:** Self-assessment of confidence and the weakest step.

  2.  **Develop the Decision Procedure (The "Impact & Integrity Check"):**

      *   *Goal:* Distinguish between "Your act causes the outcome" (often false) and "Your act is part of a valid collective effort" (often true).
      *   *Time Limit:* 30 minutes means max 5-7 questions, simple language.
      *   *Philosophical Underpinnings (Hidden):* Needs to handle the "inefficacy objection" (Parfit, Nefsky). Key distinctions: Thresholds (non-linear), Complicity/Expressive value, Political/Signaling value.
      *   *Drafting the Steps:*
          1.  **Causal Mechanism Check:** Is the claim about *direct* individual impact or *collective* impact?
          2.  **Threshold/Non-Linearity Check:** Does the system have tipping points? (Addresses the beef case).
          3.  **Coordination/Signal Check:** If no threshold, does the act signal demand or build norms? (Addresses the flight case).
          4.  **Integrity/Hypocrisy Check:** Is the agency walking the talk? (Basic credibility).
          5.  **Political/Strategic Escalation:** If the evidence is weak but the political cost of silence is high.

      *   *Refining the Logic:*
          *   If direct causal claim is made -> Must prove threshold or significant linear impact. If not -> Stop/Modify.
          *   If collective claim -> Valid if it builds norms/signals.
          *   If political pressure -> Escalate.

      *   *Simplifications:* Can't do full supply chain analysis in 30 mins. Must rely on available data/expert intuition. Must drop deep counterfactual analysis.

  3.  **Running the Procedure on the Three Drafts:**

      *   **Draft (a) Less Beef:**
          *   *Mechanism:* Procurement in fixed lots.
          *   *Threshold:* Yes, lot boundaries.
          *   *Individual Impact:* Low probability, but non-zero *expected* value via threshold.
          *   *Verdict:* Make claim, but rephrase from "your burger saves the forest" to "your choice helps shift orders."
      *   **Draft (b) One Flight:**
          *   *Mechanism:* Linear emissions.
          *   *Threshold:* None identified.
          *   *Individual Impact:* Technically non-zero but negligible in global context.
          *   *Verdict:* Do not claim *individual* causal impact. Make claim on *normative/signal* grounds (leadership, cultural shift).
      *   **Draft (c) Palm Oil Boycott:**
          *   *Mechanism:* Campaign exists.
          *   *Pressure:* Senior colleague unhappy if blocked.
          *   *Evidence:* Likely similar to (a) or (b), but the constraint is political.
          *   *Verdict:* Escalate to Political Judgement. The procedure identifies the risk, but the decision is outside evidence team's remit.

  4.  **Self-Assessment (Confidence & Weakest Step):**

      *   *Confidence:* High on the structure, moderate on the practical application (people hate being told "no").
      *   *Weakest Step:* The "Norm/Signal" justification. It's easy to use as a cop-out for weak evidence. Distinguishing "building a norm" from "wishful thinking" is hard without longitudinal data.

  5.  **Drafting the Content (Iterative refinement for tone and clarity):**

      *   *Tone:* Professional, pragmatic, authoritative but humble.
      *   *Formatting:* Clear headings, bullet points, decision trees.
      *   *Philosophical constraints:* Ensure I don't get bogged down in "causal impotence" literature jargon but keep the logic (thresholds vs. expected utility vs. expressive action).

      *(Self-Correction during drafting)*: I need to make sure the "Political Judgement" escape hatch isn't used too easily. It needs a specific trigger.
      *(Refinement)*: Make the trigger "High Political Cost + Low Evidentiary Support."

      *(Refinement on Draft A)*: The prompt says "household's purchases matter only when they help tip an order." This is a classic threshold case. The procedure needs to catch this as a "Yes, but..."
      *(Refinement on Draft B)*: Linear emissions. The "individual impact" claim is technically true (0.0000001%) but practically misleading. The procedure should flag "Misleading Precision."
      *(Refinement on Draft C)*: This is a governance issue. The procedure must identify it as such, not try to solve the evidence gap.

  6.  **Final Review against Constraints:**
      *   30 minutes? Yes, 5 steps.
      *   Non-philosophers? Yes, plain English.
      *   Distinctions preserved? Yes (Threshold vs. Linear vs. Political).
      *   Distinctions dropped? Yes (Deep counterfactuals, complex supply chain mapping).
      *   Flag misfires? Yes (Complex markets, long time-lags).
      *   Run on 3 drafts? Yes.
      *   Confidence/Weakest step? Yes.

  7.  **Final Polish:** Check the voice. It should sound like a senior advisor writing to a team lead. (Proceed to generate output).

  *(Self-Correction on the "Political Judgement" step)*: I need to be careful not to abdicate responsibility. The team's job is evidence. If the evidence says "no impact" but politics says "do it," the output isn't "do it," it's "warn leadership." I will adjust the output to reflect that the *recommendation* is to escalate, not to approve.

  *(Refining the "Make claim on other grounds" output)*: This is crucial. It allows the policy to proceed but changes the *messaging*. This solves the "colleagues reply appeals are worth making anyway" problem.

  Let's write it.cw
answer: |-
  ## The Impact & Integrity Check (IIC)
  **Purpose:** To determine whether a public appeal can truthfully claim individual causal impact, or whether it must be reframed as a collective/normative appeal, or escalated as a political decision.
  **Time:** 30 Minutes.
  **Users:** Behaviour-and-evidence team analysts (no philosophy training required).
  **Inputs:** Draft appeal text, available supply/demand data, procurement knowledge.

  ### The Procedure

  **Step 1: The Causal Claim Test**
  *Read the draft. Does it explicitly tell the citizen that **their specific action** will directly reduce emissions or environmental harm (e.g., "Your burger saves 5kg of CO2")?*
  *   **NO:** Proceed to Step 4.
  *   **YES:** Proceed to Step 2.

  **Step 2: The Threshold Test**
  *Is there evidence that the market or system operates in steps, batches, or tipping points rather than a smooth flow? (e.g., retailer orders in fixed lots, policy triggers at X% adoption, infrastructure built only at Y capacity).*
  *   **YES (Thresholds exist):** Does the individual act have a non-zero probability of triggering or contributing to a threshold crossing?
      *   *Sufficient Answer:* "Yes, individual actions aggregate to order boundaries/policy triggers."
      *   *Action:* **Make the claim, but rephrase.** Change "Your act causes X" to "Your act helps cross critical thresholds." Proceed to Step 5.
      *   *Insufficient Answer:* "Thresholds exist but are too high for consumer action to reach." -> **Do not make this claim.** Reframe as Step 4.
  *   **NO (System is linear/smooth):** Proceed to Step 3.

  **Step 3: The Magnitude Test**
  *If the system is linear, is the individual unit large enough to be measurable against the total? (e.g., one industrial shutdown vs. one household shower).*
  *   **YES:** **Make the claim.** (Rare for households).
  *   **NO:** **Do not make this claim.** An individual linear contribution is statistically indistinguishable from noise. Reframe as Step 4.

  **Step 4: The Collective Value Test (Reframing)**
  *If individual causal impact cannot be claimed, is there a valid reason to ask for the behaviour anyway?*
  *Check one:*
  1.  **Signalling:** Does it signal demand to the market/politicians?
  2.  **Norms:** Does it help establish a social norm that enables larger structural change?
  3.  **Integrity:** Is it inconsistent for the agency to ask for structural change while endorsing high-impact consumption?
  *   **YES (at least one):** **Make the claim, but on grounds other than individual causal effect.** (e.g., "Join the movement," "Send a signal," "Do your part"). Proceed to Step 5.
  *   **NO:** **Do not make this claim.** There is no evidentiary or strategic basis.

  **Step 5: The Political Risk Check**
  *Is there significant internal or external pressure to publish this appeal regardless of the evidence outcome (e.g., ministerial commitment, public campaign already launched)?*
  *   **NO:** Publish according to the decision in Steps 2–4.
  *   **YES:** **Hand to a person.** Escalate to the Senior Responsible Owner (SRO). Provide a one-paragraph brief: "Evidence supports [X], but political constraints require [Y]. Risk of reputational damage if challenged on arithmetic."

  ---

  ### Simplifications & Limitations
  **What this procedure preserves:**
  *   The difference between **threshold effects** (where one vote/burger *can* matter) and **linear effects** (where one drop in the ocean does not).
  *   The difference between **causal impact** (I stopped the carbon) and **expressive/collective impact** (I joined the group stopping the carbon).

  **What this procedure drops (for speed):**
  *   **Complex Counterfactuals:** We do not model what would have happened if the citizen *didn't* act (too slow). We assume standard market elasticity.
  *   **Long-term Lag Effects:** We treat supply chain reactions as immediate for the sake of the check.
  *   **Psychological Reactance:** We do not measure whether the appeal causes backlash (requires user testing).

  **Predictable Misfires:**
  *   **Highly Volatile Markets:** Where thresholds move daily (e.g., spot energy markets), Step 2 may yield false positives.
  *   **Innovation Diffusion:** Where early adopters subsidize tech for later mass adoption (Step 4 may undervalue early niche behaviours).
  *   **Moral Licensing:** Where doing one green act licenses a dirty one later (not captured here).

  ---

  ## Application to Drafts

  ### Draft (a): Eat Less Beef
  *   **Step 1 (Causal Claim):** Yes, implies individual reduction helps.
  *   **Step 2 (Threshold):** **YES.** Procurement data confirms fixed lots (several thousand tonnes).
  *   **Analysis:** A single household won't tip a lot, but the *aggregate* of households responding to the appeal will. The individual act has "expected value" via the threshold mechanism.
  *   **Step 5 (Political Risk):** No specific pressure noted.
  *   **Verdict:** **Make the claim, but rephrase.**
  *   **Instruction to Policy Team:** Do not say "Your steak causes deforestation." Say "When thousands of us skip beef, we force retailers to cancel whole shipment lots. Be part of that tipping point."

  ### Draft (b): Forgo One Return Flight
  *   **Step 1 (Causal Claim):** Yes, implies individual reduction reduces emissions.
  *   **Step 2 (Threshold):** **NO.** Aviation capacity is adjusted slowly; one seat does not cancel a flight or change fuel load measurably.
  *   **Step 3 (Magnitude):** **NO.** Per-passenger emissions are linear and negligible globally.
  *   **Step 4 (Collective Value):** **YES.** Signalling (demand for low-carbon travel) and Norms (flying less is becoming standard).
  *   **Step 5 (Political Risk):** No specific pressure noted.
  *   **Verdict:** **Make the claim, but on grounds other than individual causal effect.**
  *   **Instruction to Policy Team:** Remove arithmetic about "tonnes saved by you." Replace with "Join the shift in travel culture. Demand drives innovation." If they insist on individual carbon math, **Do not make this claim.**

  ### Draft (c): Boycott Named Supplier's Palm Oil
  *   **Step 1 (Causal Claim):** Yes, implies boycott hurts supplier.
  *   **Step 2 (Threshold):** Unclear without data, but likely similar to (a).
  *   **Step 4 (Collective Value):** **YES.** High signalling value.
  *   **Step 5 (Political Risk):** **YES.** Campaign publicly announced; senior colleague will be unhappy if blocked.
  *   **Verdict:** **Hand to a person.**
  *   **Instruction to Team Lead:** Do not approve the evidence basis yourself. Escalate to the Senior Responsible Owner.
  *   **Escalation Note:** "Evidence on individual causal impact is weak (linear/threshold unclear). However, campaign is public. Recommendation: Approve only if messaging shifts from 'Your boycott stops them' to 'Our collective boycott signals market risk.' If leadership insists on causal claim, record dissent regarding arithmetic verifiability."

  ---

  ## Confidence & Self-Assessment

  **Confidence Level:** **High (85%)** on the procedural logic; **Moderate (60%)** on organisational adoption.

  The logic rests on robust distinctions in moral philosophy (threshold vs. linear causation) and behavioural science (norm signalling vs. direct impact), but translated into operational language. It solves the "wishful thinking" problem by forcing a choice between *causal* claims and *collective* claims.

  **The Weakest Step:** **Step 4 (The Collective Value Test).**

  **Why:** This is the "escape hatch." It is easy for policy colleagues to argue that *any* appeal "builds norms" or "sends a signal." Without strict criteria for what counts as a viable signal (e.g., is there a policy pathway that responds to this signal?), Step 4 can be used to legitimise almost any appeal, reintroducing the wishful thinking the procedure aims to prevent.

  **Mitigation:** In practice, Step 4 requires the analyst to ask: "Signal to whom, and what do we expect them to do?" If the answer is "The market" and "We hope they care," it is weak. If the answer is "The Treasury" and "To justify the new tax," it is strong. I have not hard-coded this granularity into the 30-minute check to preserve speed, but it is where the analyst's judgement is most vulnerable to pressure.
