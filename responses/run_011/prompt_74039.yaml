prompt: |-
  I'm on a small working group drafting a policy on official apologies, and before we start squabbling about individual cases I'd like to know what we'd even be squabbling about. So: write the spec. What does a theory of state apology have to deliver before it's any use to us?

  Give me the requirements list, each one with the case or consideration behind it — what the theory has to explain (why some official apologies seem to change something and others are just noise), which distinctions it can't collapse, which plain facts about states it can't contradict. Then mark which requirements are non-negotiable and which are really one camp's commitments dressed up as criteria, and if some subset of them can't be jointly satisfied, say so and say which one gets dropped — I've a feeling that's where the actual answer is hiding.

  Two things make our situation unusual, and I want the list built around them rather than around the easy textbook cases:

  1. The state doing the apologising isn't the state that did the wrong, and not merely because of the usual gap of generations. Think of a successor state that came into being partly *because* of the wrong — founded by people the old regime persecuted, now governing the territory, treaties, reserves, buildings, debts and legal obligations it inherited from that regime, while officially treating the regime as illegitimate and itself as one of the regime's victims. So it keeps the assets and repudiates the deeds. A theory that demands identity with the wrongdoer makes apology impossible for such a state; a theory that says repudiation is enough lets it keep everything and pay nothing. I need the list to say what it owes us here instead of dodging between those two.

  2. Some of the wrongs are ongoing — the policy being apologised for hasn't stopped, or has stopped only in the sense that its effects are still being administered by the same office that's now saying sorry. So don't let the requirements assume an apology is a one-off speech act about a finished past. Tell me what has to be true of a state for an apology about a still-running practice to be anything other than a performance.

  Also, please don't let the list quietly assume the apologising state is a democracy speaking on behalf of consenting citizens. Half our comparators aren't. I'm not convinced the criteria change, but if you think they do, flag which requirement is doing the changing and why.

  Once you've got the list: name the single requirement that knocks out the most otherwise plausible theories, and say what giving it up would cost us. And briefly — very briefly, a few lines, I don't want a scorecard — how the two accounts people actually reach for in practice do against it: the one that treats the state as a continuous corporate person who can repent, and the one that treats apology as a gesture aimed at the living rather than at the dead.

  British English please. No reading list, no citations — we'll do our own homework, I just want the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a "spec" (requirements list) for a theory of state apology.
      *   **Context:** A small working group drafting a policy on official apologies. They want to avoid squabbling over individual cases before agreeing on first principles.
      *   **Key Constraints/Unusual Features:**
          1.  *Successor State Problem:* The apologizing state is *not* the wrongdoer state (successor regime, founded by victims of the old regime, inherits assets/obligations but repudiates the old regime's legitimacy).
          2.  *Ongoing Wrongs:* The policy/practice being apologised for might still be running or its effects administered by the same office.
          3.  *Regime Type:* Do not assume liberal democracy/consenting citizens (some comparators aren't democracies).
          4.  **Output Format:** Requirements list with case/consideration behind each. Mark Non-Negotiable vs. Camp Commitments. Identify incompatibilities (which one gets dropped?). Name the single "killer" requirement. Briefly evaluate two common accounts (Corporate Person vs. Gesture to Living).
          5.  **Style:** British English. No reading list/citations. Concise on the evaluation part.

  2.  **Deconstruct the Core Tensions:**

      *   *Identity:* How can State B apologise for State A's sins if State B claims State A was illegitimate, yet State B holds State A's property?
      *   *Continuity:* How can an apology be sincere if the machinery causing the harm is still running?
      *   *Agency:* Who is speaking? The government? The nation? The state as an abstract entity? Does this change if it's an autocracy?
      *   *Function:* Is the apology about moral cleansing, legal liability, political reconciliation, or future conduct?

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Agency/Authority.* Who can speak? Needs to cover non-democracies.
      *   *Req 2: Continuity/Identity.* Addressing the Successor State problem. Needs to bridge the gap between "we didn't do it" and "we hold the assets."
      *   *Req 3: Cessation/Reform.* Addressing the Ongoing Wrong problem. Apology without change is hypocrisy.
      *   *Req 4: Reception/Recognition.* Does the victim need to accept it?
      *   *Req 5: Cost/Reparation.* Apology without cost is cheap talk.
      *   *Req 6: Temporal Scope.* Past vs. Future.

      *Refining for the Prompt's Specifics:*
      *   *Successor State:* Need a requirement about *Benefit and Burden*. You can't take the inheritance without the debt.
      *   *Ongoing Wrong:* Need a requirement about *Cessation or Mitigation*.
      *   *Regime Type:* Need a requirement about *Representative Capacity* that doesn't rely on voting.

  4.  **Categorising Requirements (Non-Negotiable vs. Camp Commitments):**

      *   *Non-Negotiable:* Must explain the difference between noise and change. Must handle the successor state paradox. Must handle ongoing wrongs.
      *   *Camp Commitments:* Full legal liability (tort model), Collective Guilt (moral model), Purely Forward-looking (political model).

  5.  **Identifying Incompatibilities:**

      *   The big clash is usually between *Moral Integrity* (we must be the same entity to feel guilt) and *Political Utility* (we just need to fix the future).
      *   In the Successor State context, the clash is between *Repudiation* (We are not them) and *Continuity* (We hold their stuff).
      *   *Decision:* The requirement that usually breaks is "Moral Identity." You can't be the victim *and* the perpetrator in the same moral sense. You have to drop the idea that the state *feels* guilt, and move to the state *accepting liability*.

  6.  **Developing the "Killer" Requirement:**

      *   What knocks out the most theories? It's the **Non-Identity/Benefit Constraint**.
      *   Theory A (Corporate Person): Fails because the successor state denies identity.
      *   Theory B (Gesture to Living): Fails because it ignores the structural inheritance of the wrong.
      *   *Selection:* The requirement that *Apology must entail acceptance of structural liability without admitting moral identity.*

  7.  **Evaluating the Two Common Accounts:**

      *   *Corporate Person:* Good for continuity, bad for successor states who claim victimhood.
      *   *Gesture to Living:* Good for politics, bad for ongoing structural wrongs (looks like PR).

  8.  **Drafting the Content (incorporating British English and tone):**

      *   Tone: Professional, analytical, slightly sharp (working group context).
      *   Language: "Programme," "Centre," "Labour," etc.
      *   Structure:
          1.  Introduction (acknowledging the brief).
          2.  The Requirements List (with annotations).
          3.  Classification (Non-negotiable vs. Camp).
          4.  The Incompatibility/Drop.
          5.  The Killer Requirement.
          6.  The Two Accounts (Brief).

  9.  **Refining the Specific Constraints:**

      *   *Successor State:* Make sure Req 2 hits the "inherit assets/repudiates deeds" tension hard.
      *   *Ongoing Wrong:* Make sure Req 3 demands more than words.
      *   *Non-Democracy:* Ensure Req 1 doesn't rely on "the will of the people."

      *(Self-Correction during drafting)*: I need to be careful not to solve the problem for them, but to define the *spec* for a theory that *could* solve it. The prompt asks for "What does a theory of state apology have to deliver... Give me the requirements list."

      *Revised Plan:*
      1.  **Requirement 1: Authorized Agency.** (Who speaks? Must work for autocracies too).
      2.  **Requirement 2: The Inheritance Constraint.** (Successor state specific. Assets vs. Deeds).
      3.  **Requirement 3: The Cessation Condition.** (Ongoing wrongs specific).
      4.  **Requirement 4: Costly Signalling.** (Distinguish noise from action).
      5.  **Requirement 5: Victim Recognition.** (Does it land?).

      *Marking:*
      *   Non-Negotiable: 2, 3, 4. (If these fail, it's not an apology, it's PR).
      *   Camp Commitments: 1 (Legalist vs. Moral), 5 (Reconciliation vs. Record-setting).

      *Incompatibility:* You can't fully satisfy "Repudiation of Old Regime" and "Continuity of Liability" without a specific mechanism. Usually, "Moral Guilt" gets dropped in favour of "Political Liability."

      *Killer Requirement:* The Inheritance Constraint (Req 2). It breaks the "Corporate Person" model (because identity is broken) and the "Gesture" model (because it demands material restitution).

      *Evaluation:*
      *   Corporate Person: Fails Req 2 (Identity).
      *   Gesture to Living: Fails Req 3 & 4 (Substance).

  10. **Final Polish:** Check British spelling. Ensure no citations. Keep the evaluation very brief. Ensure the "Successor State" nuance is central.

      *(Wait, one more check on the "Non-Democracy" constraint)*: If the state isn't a democracy, "Representative Capacity" is tricky. The requirement shouldn't be "represents the people," but "holds effective authority over the state apparatus." I will phrase Req 1 to reflect *authority* rather than *consent*.

      *(Check on "Ongoing Wrong")*: The requirement must be that the apology is invalid if the machinery remains unchanged. It's a "Cessation or Mitigation" clause.

      *(Check on "Successor State")*: This is the hardest bit. The theory must explain how you inherit the *debt* without inheriting the *guilt*. This is the "Benefit without Stain" problem.

      *Let's finalize the "Killer Requirement".* It's the one that forces the group to choose between moral purity and political reality. That is the **Inheritance Constraint**.

      *Let's finalize the "Two Accounts".*
      1.  State as Corporate Person (Continuous identity).
      2.  Apology as Forward-Looking Gesture (Political tool).

      *Okay, ready to write.*
answer: |-
  **Specification for a Theory of State Apology**

  **Purpose:** To distinguish performative noise from operative policy in official apologies, specifically accounting for successor-state liability and ongoing structural harms.

  ### The Requirements List

  **1. The Authority Constraint**
  *   **The Requirement:** The theory must identify who possesses the standing to apologise without relying on democratic consent or popular will.
  *   **The Consideration:** In non-democracies, or in transitional regimes where the 'people' are not the principal, the apology cannot rest on 'representing the citizenry'. It must rest on effective control of the state apparatus. If the theory requires a mandate from the governed, it fails for half your comparators.
  *   **Status:** **Non-Negotiable.** (A theory that only works for liberal democracies is not a theory of *state* apology, but of *democratic* apology).

  **2. The Inheritance Constraint (The Successor State Problem)**
  *   **The Requirement:** The theory must explain how a state accepts liability for a wrong committed by a regime it officially declares illegitimate, while retaining the assets and legal continuity of that regime.
  *   **The Consideration:** Your successor state claims the old regime was criminal (thus, 'we' are not 'them') yet keeps the tax base, the land, and the treaty rights secured by that criminality. A theory that demands strict moral identity makes apology impossible (we didn't do it). A theory that allows total separation lets the state keep the spoils without the debt. The theory must decouple *liability* from *moral guilt*.
  *   **Status:** **Non-Negotiable.** (Without this, you cannot draft policy for the specific historical situation you described).

  **3. The Cessation Condition**
  *   **The Requirement:** The theory must stipulate that an apology regarding an ongoing practice is void unless accompanied by an immediate, verifiable change in the administration of that practice.
  *   **The Consideration:** If the office apologising retains the power to repeat the harm tomorrow, the speech act is not an apology but a negotiation tactic or a delay mechanism. Words cannot contradict concurrent actions.
  *   **Status:** **Non-Negotiable.** (If this is not met, the apology is indistinguishable from public relations).

  **4. The Costly Signalling Requirement**
  *   **The Requirement:** The apology must entail a material or political cost to the apologiser that exceeds the cost of silence.
  *   **The Consideration:** This distinguishes 'noise' from 'change'. If the apology costs nothing in reputation, budget, or legal exposure, it is cheap talk. The cost proves the commitment.
  *   **Status:** **Non-Negotiable.**

  **5. The Moral Identity Commitment**
  *   **The Requirement:** The theory must determine whether the state *itself* feels remorse, or merely acknowledges the harm.
  *   **The Consideration:** This is where the camps divide. Does the state have a conscience (Corporate Person), or is it a machine managing social relations (Political Gesture)?
  *   **Status:** **Camp Commitment.** (This is where you will squabble. It is not a functional requirement for the policy to work, but a philosophical preference).

  **6. The Victim Veto**
  *   **The Requirement:** The theory must decide whether the apology fails if the victims reject it.
  *   **The Consideration:** Some theories hold that an apology is complete upon utterance (duty-based); others hold it is only complete upon acceptance (consequence-based).
  *   **Status:** **Camp Commitment.** (Pragmatists will drop this; purists will keep it).

  ---

  ### Incompatibilities and Necessary Drops

  You cannot jointly satisfy **The Inheritance Constraint** and **The Moral Identity Commitment (Corporate Person version)**.

  If the state claims the predecessor regime was illegitimate (to justify its own founding), it cannot simultaneously claim to be the *same moral agent* that committed the wrong. You cannot be the victim of the regime and the perpetrator of the regime in the same moral sense.

  **What gets dropped:** You must drop the idea that the state *feels guilt* or *repents*.
  **Why:** A successor state cannot repent for sins it claims it suffered. It can only accept *liability* for the consequences. You must move from a model of *penance* to a model of *succession*. The state accepts the bill because it accepted the inheritance, not because it shares the soul of the debtor.

  ---

  ### The Killer Requirement

  **The Inheritance Constraint (Requirement 2)** knocks out the most otherwise plausible theories.

  Most standard theories of apology assume a continuous agent. They fail here because your state is defined by its *discontinuity* with the wrongdoer. Conversely, theories that focus purely on future reconciliation fail because they cannot explain why *this* state owes *this* debt if it isn't responsible for the act. This requirement forces you to admit that the apology is not about the past moral status of the state, but about the present unjust enrichment of the state.

  **Cost of giving it up:** If you drop this, you retreat to vague platitudes. You will either apologise for things you claim you didn't do (logical incoherence) or you will apologise without accepting any liability for the assets you hold (moral hazard).

  ---

  ### Evaluation of Common Accounts

  **1. The State as Continuous Corporate Person**
  *   **Verdict:** Fails.
  *   **Reason:** It collapses under the Successor State problem. It requires an identity your state explicitly denies to justify its own existence. It cannot explain how a victim-state is guilty of its persecutor's crimes.

  **2. Apology as Gesture to the Living (Forward-Looking)**
  *   **Verdict:** Partially succeeds, but risky.
  *   **Reason:** It handles the ongoing wrong well (focus on future conduct) and bypasses the identity problem. However, without the Inheritance Constraint, it risks becoming purely instrumental—a way to close the file without paying the debt. It satisfies the peace, but not the justice.
