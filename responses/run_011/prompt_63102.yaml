answer: |-
  **Handout: Deconstructing "It Was In The Air"**

  The slogan "it was in the air" is not a single argument but a conflation of five distinct claims. Evaluate each separately.

  1.  **The Statistical Observation (Mertonian Multiples)**
      *   **Asserts:** Independent simultaneous discoveries occur frequently in the historical record.
      *   **Status:** Platitude/Empirical Regularity. Everyone accepts multiples happen; this does not explain *why*.
      *   **Evidence:** Catalogues of priority disputes (calculus, oxygen, evolution).
      *   **Supports (2)/(3)?** Neither. Frequency does not entail inevitability, nor does it erase individual contribution.

  2.  **The Conditional Probability Claim (Field Readiness)**
      *   **Asserts:** Given background knowledge $K$ at time $t$, the probability of discovery within $\Delta t$ was high.
      *   **Status:** Substantive Empirical Thesis. Plausible for mature fields (e.g., oxygen), less so for radical ruptures.
      *   **Evidence:** Existence of competing research programs tackling the same problem; availability of necessary instrumentation.
      *   **Supports (2)/(3)?** Supports (2) weakly (priority matters less if imminent). Does not support (3); high probability does not mean the specific *path* was predetermined.

  3.  **The Strong Counterfactual Claim (Determinism)**
      *   **Asserts:** Given $K$ at $t$, someone *would* have produced discovery $D$ by $t+\Delta$ regardless of specific agents.
      *   **Status:** Strong/Often False. Requires specifying the pool of potential discoverers and the time bound. Fails for discoveries requiring unique idiosyncratic insight or non-standard tools.
      *   **Evidence:** Cases where discovery stalled for decades despite "readiness" until a specific individual intervened.
      *   **Supports (2)/(3)?** Supports both. If the outcome is fixed, the agent is interchangeable.

  4.  **The Content Convergence Claim (Identity)**
      *   **Asserts:** The content of the discovery is fixed by the problem situation; different agents produce identical theoretical objects.
      *   **Status:** False/Unintelligible (without qualification). Ignores formulation, notation, and metaphysical commitment.
      *   **Evidence:** Compare Newton's fluxions (kinematic, time-based) vs. Leibniz's differentials (algebraic, static). Compare Darwin's natural selection (struggle, branching) vs. Wallace's (environmental pressure, less branching).
      *   **Supports (2)/(3)?** Supports (2) if "discovery" means "solution to problem X." Refuted by (3) if "discovery" includes the specific formalism or conceptual framework.

  5.  **The Epistemic Claim (Colleague's Reading)**
      *   **Asserts:** The documentary record is too messy to establish priority definitively.
      *   **Status:** Platitude about archives.
      *   **Evidence:** Lost letters, undated manuscripts, private communications.
      *   **Supports (2)/(3)?** Supports (2) pragmatically (we can't judge). Does not support (3); uncertainty about *who* doesn't mean *who* doesn't matter.

  **The Token/Type Slide**
  The slogan's persuasiveness relies on sliding between **Type** (the general solution) and **Token** (the specific formulation).
  *   **Newton/Leibniz:** As a *type* (calculus), it was likely inevitable soon. As *tokens* (fluxions vs. differential notation), they are distinct objects with different heuristic powers. Leibniz's notation enabled later continental advances Newton's obscured. The individual shaped the token.
  *   **Darwin/Wallace:** As a *type* (evolution via selection), they converged. As *tokens*, Darwin's mechanism was richer and embedded in a broader explanatory framework. Wallace did not produce *Origin of Species*.
  *   **Verdict:** The slide hides the fact that while the *problem* may be in the air, the *solution's form* is not.

  **Verdict: Can you concede (2) and refuse (3)?**
  Yes, this is a stable position, provided you restrict (2) to the **Type** and restrict (3) to the **Token**.
  *   **Concede (2):** Accept that given the state of the field, the *problem* would likely have been solved shortly thereafter by someone. Priority disputes over "who was first" often miss that the intellectual infrastructure made the step imminent.
  *   **Refuse (3):** Insist that the *individual* determines the specific formalism, the scope of application, and the subsequent trajectory of the field. We name theorems after people not because they were the only possible discoverers, but because their specific *token* contribution (notation, proof style, conceptual framing) shaped the science that followed. Inevitability of the breakthrough does not imply interchangeability of the breaker.
