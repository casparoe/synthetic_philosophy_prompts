  2.  **Deconstruct the Passage (Claim-by-Claim Analysis):**

      *   *Claim 1: "Philosophers divide into reductionists and anti-reductionists about testimony."*
          *   Specialist View: Generally accurate as a broad taxonomy (Hume vs. Reid), though modern debates are more nuanced (global vs. local reductionism, etc.).
      *   *Claim 2: "The reductionist line... holds that a hearer's belief is justified only if she has evidence, independent of testimony itself, that this particular speaker is telling the truth on this particular occasion..."*
