      *   *Rule A (The "Harm Reduction" Rule):* If a harmful release is inevitable by others, a responsible release by us is mandated/permittable, even unilaterally if time is tight. (Supported by Case 1, Case 4).
      *   *Rule B (The "Process Integrity" Rule):* No individual may bypass the panel's deliberation. If the panel is deadlocked or uneasy, the default is non-release or panel-managed release. (Supported by Case 5, Case 6).

