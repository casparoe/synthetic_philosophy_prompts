      *   **The Problem:** The user has a replication package for a de-anonymization attack (40% re-identification). Panel deadlocked 3-3 previously. User wants to release it now because a rival lab is releasing a similar tool soon without safeguards. User is tempted to act unilaterally.
      *   **The Goal:** Determine what action is *consistent with the panel's precedents*, not just the user's personal judgment. Identify the underlying rules, find the closest analogue, and determine if the record underdetermines the decision.

  2.  **Deconstruct the Precedents (The Case Law):**

