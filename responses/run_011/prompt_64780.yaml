prompt: |-
  I am drafting a position paper for a debate about reforming the allocation of competences in the European Union, and the central argument I have to answer rests on an analogy I would like audited before I engage with it.

  The argument comes from a senior colleague. He says subsidiarity should be understood as a corporate delegation rule: a well-run multinational decides at head office only what its subsidiaries genuinely cannot do as well themselves, leaves everything else where the knowledge and the customers are, and settles disputes about where a decision belongs empirically, by comparing performance. Article 5(3) TEU, he says, is the same test in constitutional dress, since the Union may act only where objectives "cannot be sufficiently achieved by the Member States ... but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level." He draws two conclusions. First, subsidiarity is at bottom a principle of organisational efficiency rather than of liberty or self-government, so comparative evidence of performance is what settles competence disputes, and objections rooted in national identity carry no independent weight. Second, the early-warning mechanism is an anomaly on this reading: national parliaments may transmit reasoned opinions objecting that a draft act breaches subsidiarity within eight weeks, and where those opinions reach one third of the votes allocated to them (one quarter for proposals in the area of justice and home affairs) the Commission must review the draft — which has happened a handful of times, including on the proposal for a European Public Prosecutor's Office. A firm, he notes, has no comparable procedure; no subsidiary gets to file a reasoned objection to a head-office decision. He treats that as a defect in the EU's machinery rather than as a clue about the principle.

  Another colleague offers the opposite analogy. For her, subsidiarity's home is the household rather than the firm: its origins lie in the thought that a parent should not take over a task a child can manage, because the child's doing it is itself part of what is being protected, and the higher level's business is to support rather than to replace. On that reading comparative performance is beside the point — head office may be measurably better at the job and still be properly excluded from it — and the efficiency reading simply deletes the normative content of the principle.

  What I need is an audit of both, with most of the weight on the first. Specifically:

  (i) An explicit table of correspondences for the delegation analogy: head office, subsidiaries, board and shareholders, the firm's single objective and its articles of association, the standing test of who does it better, the power to re-centralise, the possibility of exit, and the party who decides where decisions belong.

  (ii) The disanalogies, sorted into those that actually bear on my colleague's inference and those that are merely true of firms and therefore inert here.

  (iii) What the source quietly supplies that the target lacks — in particular whether a firm has anything corresponding to the question of who holds authority to decide who decides; whether it has constituent units whose standing does not derive from their contribution to the whole's objectives; and whether "better" is measured on one scale in a firm while the treaty's test is conjunctive, requiring both insufficiency below and improvement above.

  (iv) Whether the absence of any analogue to the early-warning mechanism counts against the EU, as my first colleague says, or shows that the analogy has already misdescribed the target — and what the mechanism's existence tells us about the direction of the subsidiary relation, whether the whole exists for the units or the units for the whole.

  (v) The same treatment, more briefly, for the household analogy: where it does better, where it fails, and whether it captures anything the delegation analogy cannot.

  (vi) Whether either analogy fares differently against the other federations we keep invoking in the same debate. In Germany the Länder administer federal law and their governments vote as instructed units in the Bundesrat; in the United States the states both legislate and execute; in Switzerland the cantons retain everything the constitution does not expressly confer on the Confederation. Say which of these, if any, is genuinely firm-like, and what the variation implies for treating subsidiarity as one principle across systems.

  (vii) A verdict: does the efficiency conclusion survive once the disanalogies are on the table, and if neither analogy carries it, what work is the principle actually doing? If you think a better comparison exists — the allocation of jurisdiction in private international law, the matching of benefit areas to deciding jurisdictions in fiscal federalism, or a default rule of residual competence — say what each gets right and what each still distorts.

  Finally, if any of the institutional facts I have recited are wrong or out of date, please flag them rather than build on them: my colleague's argument leans on them, and mine will too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit two analogies (Corporate/Firm vs. Household) regarding the principle of subsidiarity in the EU (Article 5(3) TEU).
      *   **Focus:** Heavier weight on the Corporate/Firm analogy (Colleague 1).
      *   **Specific Requirements:**
          *   (i) Table of correspondences for the delegation analogy.
          *   (ii) Disanalogies (relevant vs. inert).
          *   (iii) What the source (firm) lacks compared to the target (EU) (authority to decide who decides, standing of units, conjunctive test).
          *   (iv) Analysis of the Early-Warning Mechanism (EWM) in light of the analogy.
          *   (v) Brief audit of the Household analogy.
          *   (vi) Comparison with other federations (Germany, US, Switzerland).
          *   (vii) Verdict on the efficiency conclusion and alternative comparisons.
          *   **Constraint:** Flag any institutional inaccuracies.

  2.  **Initial Fact-Checking & Institutional Accuracy (Constraint):**
      *   *Article 5(3) TEU:* "cannot be sufficiently achieved by the Member States... but can rather... be better achieved at Union level." (Correct).
      *   *Early-Warning Mechanism (EWM):* National Parliaments submit reasoned opinions. Thresholds: 1/3 of votes (general), 1/4 (Area of Freedom, Security and Justice - AFSJ). Commission must *review* (not necessarily withdraw). (Correct).
      *   *EPPO Example:* The "Yellow Card" was triggered on the EPPO proposal (2013). 14 chambers objected (threshold was 14 at the time). Commission reviewed but maintained the proposal. (Correct).
      *   *Bundesrat:* German Länder administer federal law (mostly) and vote in Bundesrat (instructed delegates). (Correct).
      *   *US States:* Legislate and execute. (Correct).
      *   *Switzerland:* Cantons retain residual competence. (Correct).
      *   *Conclusion:* The institutional facts provided by the user are accurate. No major flags needed, though nuance on the EWM outcome (review $\neq$ withdrawal) is important.

  3.  **Drafting Section (i): Table of Correspondences (Corporate Analogy):**
      *   Need to map EU entities/functions to Corporate entities/functions based on Colleague 1's argument.
      *   *Head Office:* EU Institutions (Commission/Council).
      *   *Subsidiaries:* Member States.
      *   *Board/Shareholders:* European Council / European Parliament (citizens).
      *   *Single Objective:* Market integration/Efficiency vs. Profit/Shareholder Value.
      *   *Articles of Association:* The Treaties.
      *   *Standing Test:* Comparative efficiency (who does it better?).
      *   *Re-centralisation:* Competence creep/Implied powers.
      *   *Exit:* Article 50 TEU (Brexit).
      *   *Decider:* ECJ (ultimately) or Commission (initially).

  4.  **Drafting Section (ii): Disanalogies:**
      *   *Relevant (bear on inference):*
          *   Purpose: Profit/Uniformity vs. Pluralism/Identity.
          *   Hierarchy: Top-down command vs. Conferral (powers granted *up*).
          *   Exit: Easy in theory (sell subsidiary) vs. Political nuclear option (Art 50).
          *   Ownership: Shareholders own the firm vs. States constitute the Union.
      *   *Inert (true but irrelevant):*
          *   Physical assets.
          *   Employment contracts.
          *   Bankruptcy rules (mostly).

  5.  **Drafting Section (iii): What the Source Lacks (The "Quiet" Supply):**
      *   *Authority to decide who decides:* In a firm, HQ decides. In EU, Member States (Masters of the Treaties) decide who decides. This reverses the hierarchy.
      *   *Standing of Units:* Subsidiaries exist for the Firm's profit. Member States exist *prior* to the EU and have intrinsic constitutional standing (national identity, Art 4(2) TEU).
      *   *The "Better" Test:* Firm = Absolute efficiency. EU = Conjunctive (Insufficiency *AND* Added Value). The corporate analogy ignores the "insufficiency" hurdle.

  6.  **Drafting Section (iv): The Early-Warning Mechanism (EWM):**
      *   Colleague 1 says EWM is a defect because firms don't have it.
      *   Counter: EWM proves the EU isn't a firm. It acknowledges Member States as *principals* monitoring the *agent* (Commission).
      *   Direction of Relation: Firms = Whole for the parts (parts serve the whole). EU = Parts for the Whole (Union serves the States/Citizens, but States constitute the Union). Actually, it's more reciprocal. The EWM suggests the "Subsidiaries" (States) have a veto-like oversight on the "HQ" (Commission), implying the HQ works *for* them, not just *over* them.
      *   Verdict: EWM shows the analogy misdescribes the target.

  7.  **Drafting Section (v): Household Analogy:**
      *   *Strengths:* Captures the normative/developmental aspect (capacity building, identity). Explains why "better" isn't enough (parent shouldn't do homework even if faster). Aligns with Art 4(2) TEU (National Identity).
      *   *Weaknesses:* Paternalistic. EU isn't a parent; States aren't children. Doesn't explain the legal enforcement (ECJ) or the market logic of the Single Market.
      *   *Capture:* It captures the *political legitimacy* aspect that the firm analogy deletes.

  8.  **Drafting Section (vi): Other Federations:**
      *   *Germany:* Most "firm-like" in administration (Länder execute federal law), but Bundesrat is political, not corporate.
      *   *US:* Dual sovereignty. Less firm-like. States have original authority.
      *   *Switzerland:* Most distinct. Cantons are the masters. Least firm-like.
      *   *Implication:* Subsidiarity isn't one principle. In US it's federalism (dual sovereignty). In EU it's conferral + subsidiarity. Treating them as the same obscures the EU's unique "derived competence" structure.

  9.  **Drafting Section (vii): Verdict & Alternatives:**
      *   *Verdict:* Efficiency conclusion does *not* survive. The analogy fails because it ignores the *source* of power (Conferral).
      *   *Work Principle is Doing:* It's a political check on centralization, protecting pluralism, not just optimizing output.
      *   *Better Comparisons:*
          *   *Fiscal Federalism (Oates):* Matching benefit areas to jurisdictions. Good for economic logic, bad for identity.
          *   *Private International Law (Jurisdiction):* Which court is best placed? Good for "forum," bad for "legislative competence."
          *   *Default Rule of Residual Competence:* This is the most accurate legal description (Kompetenz-Kompetenz lies with States).
      *   *Recommendation:* Use Fiscal Federalism for the *economic* argument, but rely on Constitutional Conferral for the *legal* argument.

  10. **Review and Refine:**
      *   Check tone: Academic, rigorous, debate-prep style.
      *   Check constraints: Did I flag institutional facts? (Yes, confirmed accuracy but nuanced the EWM outcome). Did I weight the first analogy more? (Yes).
      *   Check specific arguments: Ensure the "conjunctive test" point is clear (Insufficiency + Added Value). Ensure the "Masters of the Treaties" point is highlighted.

  11. **Final Polish:** Organize with clear headings matching the prompt's (i)-(vii). Ensure the table is readable. (Self-Correction: Make sure to explicitly mention Article 4(2) TEU regarding national identity as it directly counters Colleague 1).

  12. **Final Output Generation** (Proceed to generate response based on these steps).
answer: |-
  This audit examines the structural validity of the "Corporate Delegation" analogy versus the "Household" analogy regarding EU subsidiarity. As requested, the institutional facts you recited are accurate: Article 5(3) TEU sets the conjunctive test; the Early-Warning Mechanism (EWM) thresholds (1/3 general, 1/4 AFSJ) are correct; the EPPO proposal did trigger a "yellow card" (14 chambers, meeting the threshold at the time); and the descriptions of German, US, and Swiss federalism are standard comparative law characterizations.

  However, while the facts are correct, the *inferences* drawn from them by your first colleague rely on category errors. Below is the audit.

  ### (i) Table of Correspondences: The Corporate Delegation Analogy

  This table maps the elements of your colleague's argument (Source: The Firm) onto the EU legal order (Target: The Union).

  | Concept | Source: The Multinational Firm | Target: The European Union |
  | :--- | :--- | :--- |
  | **Head Office** | Corporate HQ / Board of Directors | European Commission / Council (Legislative Initiative) |
  | **Subsidiaries** | Regional/National Branches | Member States |
  | **Board/Shareholders** | Investors (Owners) | European Council (Heads of State) / Citizens (via EP) |
  | **Single Objective** | Profit Maximization / Shareholder Value | "Ever Closer Union" / Market Efficiency / Treaty Objectives |
  | **Articles of Association** | Corporate Bylaws / Charter | The Treaties (TEU/TFEU) |
  | **Standing Test** | Comparative Efficiency (ROI, Speed, Cost) | Subsidiarity Test (Insufficiency + Added Value) |
  | **Power to Re-centralise** | Management Decision (Re-org) | Competence Creep / Implied Powers / Art 352 TFEU |
  | **Possibility of Exit** | Divestiture / Sale of Subsidiary | Article 50 TEU (Withdrawal) |
  | **Decider of Competence** | HQ (Top-Down) | ECJ (Adjudication) / Member States (Masters of Treaties) |

  ### (ii) Disanalogies: Relevant vs. Inert

  Not all differences between firms and states matter for the argument. We must distinguish those that undermine the efficiency inference from those that are merely descriptive.

  **A. Relevant Disanalogies (Bear on the Inference)**
  1.  **Direction of Conferral:** In a firm, the HQ *grants* authority to subsidiaries (delegation). In the EU, Member States *grant* authority to the Union (conferral). This reverses the hierarchy. The "Head Office" is the agent; the "Subsidiaries" are the principals.
  2.  **Objective Pluralism:** A firm has a unified metric (profit/efficiency). The EU has incommensurable objectives (market efficiency, social protection, national identity, security). Efficiency cannot settle disputes where values conflict.
  3.  **Constitutive Standing:** A subsidiary exists *for* the firm. Member States existed *before* the Union and derive legitimacy from their own constitutions, not the Treaties.
  4.  **Exit Costs:** Divesting a subsidiary is a commercial calculation. Article 50 withdrawal is a geopolitical rupture with uncertain legal and economic finality. This makes "exit" an ineffective discipline mechanism compared to corporate markets.

  **B. Inert Disanalogies (True but Irrelevant)**
  1.  **Asset Ownership:** Firms own subsidiary assets; the EU does not own Member State territory. (Irrelevant to competence allocation).
  2.  **Employment Law:** HQ can fire subsidiary managers; the Commission cannot fire national ministers. (Irrelevant to legislative competence).
  3.  **Bankruptcy:** Firms can go insolvent; States generally do not in the same legal sense. (Irrelevant to the subsidiarity test).

  ### (iii) What the Source Quietly Supplies (and the Target Lacks)

  Your colleague's argument assumes the firm model supplies a complete logic of authority. It does not. It hides three critical structural deficits when applied to the EU.

  1.  **Who Decides Who Decides (*Kompetenz-Kompetenz*):**
      *   *Firm:* HQ holds *Kompetenz-Kompetenz*. It decides the scope of its own authority relative to subsidiaries.
      *   *EU:* The Member States hold *Kompetenz-Kompetenz* as "Masters of the Treaties." The Union has only conferred powers. The corporate analogy assumes the central body has the inherent right to define its own reach, which contradicts Article 5(2) TEU (Principle of Conferral).
  2.  **Intrinsic Standing of Units:**
      *   *Firm:* A subsidiary's standing is instrumental. If it contributes nothing to profit, it is closed.
      *   *EU:* Member States have intrinsic standing protected by Article 4(2) TEU (National Identity). Their existence is not contingent on their contribution to Union objectives. The efficiency reading deletes this constitutional protection.
  3.  **The Conjunctive Test:**
      *   *Firm:* The test is singular: "Who does it better?" (Absolute efficiency).
      *   *EU:* The test is conjunctive: (1) States *cannot* achieve it sufficiently **AND** (2) Union *can* do it better.
      *   *Implication:* Even if the Union is "better" (e.g., faster, cheaper), it is barred from acting if the States are *sufficient*. The corporate analogy collapses this two-step test into a single efficiency metric, legally misrepresenting Article 5(3).

  ### (iv) The Early-Warning Mechanism (EWM): Defect or Clue?

  Your colleague argues the EWM is a defect because firms lack it. This is a category error.

  *   **Why it counts against the Analogy:** The EWM exists precisely because the EU is *not* a firm. In a firm, subsidiaries do not monitor HQ because HQ owns them. In the EU, National Parliaments monitor the Commission because the Commission is their *agent*. The EWM is a principal-agent control mechanism, not a subsidiary complaint box.
  *   **Direction of Relation:** The existence of the EWM suggests the Union exists to serve the Member States (and their citizens), not vice versa. If the EU were a firm, the "subsidiaries" (States) would be subordinate to the "whole" (Union). The EWM empowers the parts to check the whole.
  *   **Verdict:** The EWM is not a defect in the EU machinery; it is a fatal flaw in the corporate analogy. It proves that political legitimacy flows from the national level upward, contradicting the top-down efficiency model.

  ### (v) Audit of the Household Analogy

  Your second colleague's analogy (Parent/Child) offers a normative corrective but fails as a structural model.

  *   **Where it does better:** It captures the *developmental* and *protective* purpose of subsidiarity. It explains why the higher level should not act even if it is more efficient (to preserve the capacity and autonomy of the lower level). It aligns with Article 4(2) TEU (respect for national identity).
  *   **Where it fails:** It is paternalistic. Member States are not children; they are sovereign equals. It lacks a mechanism for enforcement (a parent decides unilaterally; the EU requires legal adjudication). It ignores the market-integration logic that drives much EU competence.
  *   **What it captures:** It identifies that subsidiarity is about **political autonomy**, not just administrative efficiency. It captures the "liberty" element your first colleague dismisses.

  ### (vi) Comparative Federations: Is any of them "Firm-like"?

  Treating subsidiarity as a uniform principle across federations obscures vital structural differences.

  *   **Germany:** The closest to the "firm" model administratively (Länder execute federal law), but politically distinct. The Bundesrat represents Land *governments*, not parliaments. It is hierarchical but cooperative.
  *   **United States:** Least firm-like. Dual sovereignty. States have original authority, not conferred. The "Commerce Clause" jurisprudence is more akin to boundary disputes between sovereigns than HQ/Subsidiary delegation.
  *   **Switzerland:** Most distinct. Cantons retain all powers not expressly conferred. This is the purest form of "Conferral," making the "Head Office" (Confederation) strictly limited.
  *   **Implication:** None are genuinely firm-like because all are polities, not profit-seeking entities. Germany is the most "managerial," but even there, the *Länder* protect their own constitutional identity. Treating subsidiarity as one principle across these systems ignores that in the US it is a limit on federal power, in Germany it is a principle of administration, and in the EU it is a condition of legislative competence.

  ### (vii) Verdict and Alternative Comparisons

  **Does the efficiency conclusion survive?**
  **No.** The efficiency conclusion collapses once the disanalogies are tabled. Specifically:
  1.  **Conferral:** Since States grant power, they retain the right to judge necessity, not just performance.
  2.  **Identity:** Article 4(2) TEU gives national identity independent weight, contradicting the claim that objections rooted in identity carry "no independent weight."
  3.  **Conjunctive Test:** The "insufficiency" hurdle means efficiency is necessary but not sufficient for Union action.

  **What work is the principle actually doing?**
  Subsidiarity is a **political threshold mechanism**. It forces the Commission to justify *why* national action is inadequate before proposing Union law. It shifts the burden of proof to the centralizer. It is less about "who does it better" and more about "who has the right to try first."

  **Better Comparisons:**

  1.  **Fiscal Federalism (Oates' Decentralization Theorem):**
      *   *Gets Right:* Matches the jurisdiction of decision-making to the geographic scope of the problem's effects (internalizing externalities).
      *   *Distorts:* Still too technocratic. Ignores the democratic legitimacy of national parliaments.
  2.  **Private International Law (Jurisdiction):**
      *   *Gets Right:* Focuses on the "forum conveniens"—which court is best placed to hear the case? Acknowledges multiple valid jurisdictions.
      *   *Distorts:* Jurisdiction is about adjudication, not legislation.
  3.  **Default Rule of Residual Competence (The Legal Reality):**
      *   *Gets Right:* This is the most accurate description. Competence remains with the States unless explicitly transferred.
      *   *Distorts:* None. This is the actual legal baseline.

  **Recommendation for your Position Paper:**
  Do not fight the efficiency argument on its own terms. Accept that efficiency matters (Fiscal Federalism), but argue that in a constitutional order, efficiency is constrained by **legitimacy**. The Corporate Analogy fails because it treats the EU as a *managerial* problem (how to maximize output) rather than a *constitutional* problem (how to allocate authority among sovereigns). The Early-Warning Mechanism is not a bug; it is the feature that proves the Member States are the principals, not the subsidiaries.

  **Institutional Note:** Your facts are sound. However, be careful with the EPPO example. While the "yellow card" was triggered, the Commission *maintained* the proposal. This shows the EWM is a political brake, not a legal veto. Your colleague might use this to argue the mechanism is weak; you should argue it proves the mechanism is *political* (requiring negotiation) rather than *managerial* (automatic compliance).
