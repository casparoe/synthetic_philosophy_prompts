prompt: |-
  You're an evolutionary game theorist who also does philosophy of biology — think carefully, and brainstorm a bit before you start writing. I want the spec, not a survey of mechanisms.

  What does a theory of the evolution of cooperation between unrelated, non-clonal agents actually have to deliver to count as adequate? Give me the desiderata: the phenomena it must account for, the cases it has to get right, the distinctions it can't collapse, the empirical results it can't flatly contradict — with the motivating case or consideration behind each one, not just a label.

  A few things I'd expect on the list, or else a reason they dont belong: cooperation under noise, where a strict reciprocal rule spirals into mutual defection after one accidental defection; the endgame problem, i.e. why people keep cooperating in finitely repeated games when backward induction says they shouldn't; reports from some subject pools where the most generous contributors get punished roughly as much as free riders, which seems to invert the usual prediction; voluntary participation, where models sometimes yield cycles instead of defection taking over; and third-party punishment by bystanders who gain nothing from punishing.

  Then mark which requirements are non-negotiable and which are really the preferences of one camp — demanding an account with no group-level selection at all, or demanding that cooperation pay off for the individual at equilibrium, look like candidates for the second pile. Flag any subset you think is jointly unsatisfiable; that's the part I most want to see, since then the list is itself a result. Finish by saying which single requirement eliminates the most standard mechanisms (kin selection, direct reciprocity, indirect reciprocity, network reciprocity, punishment, partner choice), and a couple of lines each on how they do agaisnt it. Keep it tight — no bibliography, I'll find my own reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Evolutionary Game Theorist + Philosophy of Biology.
      *   **Task:** Define the *desiderata* for an adequate theory of the evolution of cooperation between unrelated, non-clonal agents.
      *   **Constraint 1:** "Spec, not a survey of mechanisms." (Focus on what the theory must *do*, not just listing existing theories).
      *   **Constraint 2:** Include specific motivating cases/considerations for each desideratum.
      *   **Constraint 3:** Include specific expected items (noise/endgame, antisocial punishment, voluntary participation, third-party punishment) or explain why they don't belong.
      *   **Constraint 4:** Distinguish between "Non-negotiable" (hard constraints) and "Preferences of one camp" (ideological/theoretical commitments).
      *   **Constraint 5:** Flag any jointly unsatisfiable subsets (impossibility results).
      *   **Constraint 6:** Identify the single requirement that eliminates the most standard mechanisms and briefly explain why.
      *   **Constraint 7:** Keep it tight, no bibliography.

  2.  **Deconstruct the Core Problem:**
      *   The problem is "Cooperation among unrelated, non-clonal agents." This rules out kin selection (Hamilton's Rule) as the *primary* explanation, though it doesn't rule out multilevel selection entirely if defined carefully.
      *   The user wants a *specification* of adequacy. What makes a theory *good* enough to be accepted as the explanation?
      *   The tension lies between mathematical rigor (Nash equilibria, ESS) and empirical reality (humans/animals cooperate more than models predict).

  3.  **Brainstorming Desiderata (incorporating user suggestions):**
      *   *Noise/Errors:* Tit-for-Tat (TFT) fails here. Needs robustness.
      *   *Endgame:* Finite repeated PD. Backward induction says defect. Humans cooperate. Theory must explain the deviation from subgame perfection without just saying "humans are irrational."
      *   *Antisocial Punishment:* Punishing cooperators. Standard models say punishment stabilizes cooperation. This data point challenges that.
      *   *Voluntary Participation:* Optional PD. Cycles of cooperation/defection/loners. Theory must account for dynamic stability, not just static equilibria.
      *   *Third-Party Punishment:* Altruistic punishment. Costly to punish, no direct benefit. Hard for individual selection models.
      *   *Scale:* Must work in large groups, not just dyads.
      *   *One-shot interactions:* Cooperation happens even when reputation is impossible.

  4.  **Categorizing: Non-negotiable vs. Camp Preferences:**
      *   *Non-negotiable:* Empirical fit (must match data), Internal consistency (math must work), Robustness (to noise/parameters).
      *   *Camp Preferences:* "Must be individually rational at equilibrium" (Group selectionists hate this), "No group-level selection allowed" (Methodological individualists demand this), "Must derive from pure self-interest" (vs. social preferences).

  5.  **Identifying Joint Unsatisfiability (The "Impossibility Theorem" aspect):**
      *   This is the crux. Can we have robustness to noise *and* stability against invasion *and* one-shot cooperation *and* strict individual rationality?
      *   Likely conflict: *Individual Payoff Maximization at Equilibrium* vs. *High Cooperation in One-Shot Anonymous Games*. If agents are purely self-interested rational maximizers, one-shot cooperation is irrational. If they cooperate, they aren't standard maximizers.
      *   Another conflict: *Stability of Punishment* vs. *Second-Order Free Riding*. Punishers pay a cost. Non-punishing cooperators save the cost. Punishers should die out unless there's higher-order punishment, leading to infinite regress.

  6.  **Selecting the "Mechanism Killer":**
      *   Which requirement kills the most standard models?
      *   *Candidate:* "Cooperation in large, anonymous, one-shot interactions without external enforcement."
      *   *Kin Selection:* Fails (by definition of prompt).
      *   *Direct Reciprocity:* Fails (one-shot).
      *   *Indirect Reciprocity:* Fails (anonymous/no reputation).
      *   *Network Reciprocity:* Fails (well-mixed/large scale).
      *   *Punishment:* Fails (no future benefit/second-order free rider).
      *   *Partner Choice:* Fails (anonymous/no exit).
      *   *Verdict:* This is the strongest filter. It forces the theory to invoke social preferences, strong reciprocity, or cultural group selection.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the stage. We are looking for the "spec" for a theory of *human-scale* cooperation (since animals rarely show the full suite).
      *   *Desiderata List:*
          1.  *Robustness to Implementation Error:* (The Noise requirement). TFT dies. Needs Generous TFT or Contrite TFT logic.
          2.  *Terminal Period Anomaly:* (The Endgame). Backward induction vs. reality. Needs bounded rationality or social preferences.
          3.  *Heterogeneity of Sanctioning:* (Antisocial Punishment). Not all punishment is pro-social.
          4.  *Volitional Stability:* (Voluntary Participation). Cycles, not just defection.
          5.  *Altruistic Sanctioning:* (Third-party punishment). Costly punishment without direct return.
          6.  *Scalability:* Dyads are easy; large groups are hard.
      *   *Classification:*
          *   Non-negotiable: Empirical fit, Mathematical consistency.
          *   Preferences: Methodological Individualism (no group selection), Strict Rationality (Nash).
      *   *Unsatisfiable Subset:* The "Rationality Triangle." Strict Individual Rationality + One-Shot Cooperation + Stability against Free Riders. You can pick two.
      *   *Mechanism Killer:* "One-shot, anonymous cooperation."

  8.  **Refining the Tone:**
      *   Needs to sound like an expert who knows the literature but is critical of it.
      *   Avoid waffle. Be precise.
      *   Ensure the distinction between "theory of mechanisms" and "spec for adequacy" is maintained. I am listing *what must be explained*, not *how*.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* antisocial punishment matters? Yes, it challenges the normative assumption that punishment equals cooperation.
      *   *Check:* Did I address the "non-clonal" constraint? Yes, keep kin selection out of the primary explanation.
      *   *Check:* Is the "Mechanism Killer" section tight? Need to ensure I explain *why* each fails that specific test.
      *   *Check:* Did I flag the unsatisfiable set clearly? This is a key part of the prompt.
      *   *Refinement on "Endgame":* Make sure to note that standard EGT says cooperation should unravel. The spec demands a theory that explains why it *doesn't*.
      *   *Refinement on "Preferences":* Be careful not to dismiss group selection as "wrong," but as a "camp preference" for methodological individualists.

  10. **Final Polish:** Check word count and density. Ensure the "Philosophy of Biology" lens is present (e.g., distinguishing proximate/ultimate, or levels of selection). *Self-correction: Keep it focused on the game theory spec, but acknowledge the philosophical tension in the "Preferences" section.*

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification for adequacy. This is not a list of mechanisms (how cooperation happens) but a list of constraints (what a theory must explain to be accepted as sufficient). The target is cooperation among unrelated, non-clonal agents, specifically targeting the human phenotype where these anomalies are most acute.

  ### I. The Desiderata (Non-Negotiable Constraints)

  These are empirical or logical hurdles. A theory that fails these is empirically falsified or mathematically incoherent.

  **1. Robustness to Implementation Error (The Noise Constraint)**
  *   **The Spec:** The equilibrium strategy must not collapse into mutual defection following a single unintended defection (trembling hand).
  *   **Motivation:** In biological and social reality, signals are misread and actions slip. A strict reciprocal rule (like classic Tit-for-Tat) enters an endless echo of retaliation after one error. An adequate theory must stabilize cooperation *despite* noise, not just in a noiseless vacuum.

  **2. The Terminal Period Anomaly (The Endgame Constraint)**
  *   **The Spec:** The theory must account for sustained cooperation in finitely repeated interactions where the endpoint is known, without relying on "irrationality" as a placeholder.
  *   **Motivation:** Standard backward induction dictates immediate defection in the first round of a finite game. Empirically, agents cooperate until the very end. A theory that predicts unraveling but observes stability is inadequate; it must explain the *mechanism* that suspends backward induction (e.g., incomplete information, reputation carry-over, or social preferences).

  **3. Heterogeneity of Sanctioning (The Antisocial Punishment Constraint)**
  *   **The Spec:** The model must accommodate regimes where high contributors are punished as frequently as free riders, without predicting the immediate collapse of cooperation.
  *   **Motivation:** Cross-cultural data (e.g., Herrmann et al.) shows that in some societies, "do-gooders" are sanctioned to enforce conformity or suppress status climbing. Standard models assume punishment is inherently pro-social (targeting defectors). A theory that assumes punishment *must* aid cooperation cannot explain cultures where it suppresses it.

  **4. Dynamic Stability of Optional Participation (The Voluntary Participation Constraint)**
  *   **The Spec:** The system must allow for cyclic or polymorphic stability where agents can opt out of the game entirely, rather than converging on a monomorphic defection equilibrium.
  *   **Motivation:** In optional Public Goods Games, "loners" who take a small fixed payoff prevent defection from taking over. The system cycles (Cooperators → Defectors → Loners → Cooperators). A static equilibrium analysis that predicts only defection fails to capture the dynamic persistence of cooperation in open systems.

  **5. Altruistic Sanctioning by Bystanders (The Third-Party Constraint)**
  *   **The Spec:** The theory must explain why agents incur costs to punish norm violators who did not harm the punisher directly.
  *   **Motivation:** Third-party punishment is the bedrock of legal systems and norm enforcement. Since the bystander gains no direct material benefit and incurs a cost, this violates strict individual payoff maximization. A theory relying solely on direct reciprocity cannot account for this.

  **6. Scalability to Large, Anonymous Groups**
  *   **The Spec:** The mechanism must sustain cooperation in groups larger than Dunbar's number, among agents who cannot track individual histories.
  *   **Motivation:** Human cooperation extends to nations and markets. Mechanisms relying on dyadic memory (direct reciprocity) or tight clustering (network reciprocity) mathematically degrade as $N$ increases and anonymity rises.

  ---

  ### II. Camp Preferences (Ideological Constraints)

  These are often treated as hard constraints by specific schools of thought, but they are actually theoretical commitments. An adequate theory might have to violate one of these to satisfy Section I.

  **1. Methodological Individualism (No Group-Level Selection)**
  *   **The Camp:** Strict adaptationists and methodological individualists.
  *   **The Demand:** The trait must spread because it benefits the *individual* carrier's fitness, not the group's.
  *   **Status:** **Preference.** If human cooperation requires cultural group selection (where groups with more cooperators outcompete others), insisting on individual-level selection renders the theory inadequate to the phenomena.

  **2. Strict Rationality at Equilibrium**
  *   **The Camp:** Classical Game Theorists.
  *   **The Demand:** Cooperators must not earn less than defectors at equilibrium; cooperation must be a Nash Equilibrium.
  *   **Status:** **Preference.** If the data shows people cooperate even when it is strictly costly (altruism), a theory that forces cooperation to be "secretly selfish" (e.g., via hidden reputation) is fitting the data to the model, not the model to the data.

  **3. Genetic vs. Cultural Transmission**
  *   **The Camp:** Evolutionary Psychologists vs. Dual-Inheritance Theorists.
  *   **The Demand:** The mechanism must be encoded in genes (slow) vs. culturally transmitted norms (fast).
  *   **Status:** **Preference.** Given the speed of human social change, a purely genetic spec is likely insufficient, but a purely cultural spec risks lacking ultimate evolutionary grounding.

  ---

  ### III. Joint Unsatisfiability (The Impossibility Result)

  There is a subset of requirements that appears jointly unsatisfiable under standard assumptions of natural selection. This is the "Trilemma of Cooperation":

  1.  **Strict Individual Payoff Maximization** (Cooperators never earn less than defectors in the long run).
  2.  **One-Shot Anonymity** (No future interaction, no reputation tracking).
  3.  **High Rates of Cooperation** (Significant % of agents cooperate).

  **Why they conflict:** If interactions are one-shot and anonymous, there is no future benefit to cooperation (violating Reciprocity). If agents maximize individual payoff, defection dominates (violating Cooperation). To satisfy all three, you must abandon standard payoff maximization (invoking social preferences) or invoke multi-level selection (where individual loss is group gain). You cannot have a theory that satisfies all three using only standard individual-selection game theory.

  ---

  ### IV. The Mechanism Killer

  The single requirement that eliminates the most standard mechanisms is:
  **Requirement 6: Scalability to Large, Anonymous Groups (specifically in One-Shot contexts).**

  Here is how the standard five mechanisms fail this spec:

  *   **Kin Selection:** Fails by definition of the prompt (unrelated agents) and fails scalability (relatedness $r$ drops to near zero in large anonymous pools).
  *   **Direct Reciprocity:** Fails anonymity. Requires repeated dyadic interaction. In a large anonymous pool, the probability of meeting the same agent again is negligible, collapsing the shadow of the future.
  *   **Indirect Reciprocity:** Fails anonymity. Requires reputation tracking. In large anonymous groups, information flow is too noisy or costly to maintain reliable image scores.
  *   **Network Reciprocity:** Fails scalability. Relies on clustering. As group size increases and mixing becomes well-mixed (anonymous), clusters dissolve and defectors invade.
  *   **Punishment:** Fails the Second-Order Free Rider problem in large groups. Punishers pay a cost. Non-punishing cooperators save that cost and outcompete punishers. Without higher-order punishment (which leads to infinite regress), punishers go extinct in large anonymous pools.

  **Conclusion:** To meet the spec, a theory must likely invoke **Cultural Group Selection** (norms spread between groups) or **Strong Reciprocity** (innate preferences for fairness/punishment), as these are the only frameworks that currently claim to handle large-scale, anonymous, one-shot cooperation without collapsing into defection.
