answer: |-
  Your hypothesis is not too clever by half; it is the standard sophisticated reconstruction of the debate in contemporary political economy. You have correctly identified that the "Socialist Calculation Debate" (SCD) is not a single argument that evolved, but a stack of three distinct arguments that were never disentangled.

  However, your diagnosis of *why* this leads to an impasse needs to go deeper than "they are answering different questions." They are answering different questions because they inhabit different ontologies. Here is the structural breakdown you are looking for, followed by the critique of your own framing.

  ### 1. The Diagnosis: Ontological Incommensurability
  This is not merely a verbal dispute, nor is it purely empirical. It is a clash of **social ontologies** and **epistemological standards**.

  **The Ontological Split:**
  *   **The Planner's Ontology (Lange/Cockshott):** The economy is a *system of constraints*. It is an engineering problem. Resources, technologies, and preferences are treated as parameters that exist independently of the mechanism used to aggregate them. The economy is a *thing* to be optimized.
  *   **The Market's Ontology (Mises/Hayek):** The economy is a *process of discovery*. Preferences and technologies are not pre-existing data points; they are generated, revealed, and altered through the act of exchange itself. The economy is a *verb* (catallaxy) rather than a *noun*.

  **The Epistemological Split:**
  *   **The Planner's Standard:** Existence proofs and formal consistency. If you can write down the equations (Lange) or propose an algorithm (Cockshott) that converges to equilibrium, you have won. The burden of proof is on the critic to show the math is wrong.
  *   **The Market's Standard:** Institutional plausibility and incentive compatibility. It does not matter if the equations balance if no human being has the incentive or ability to provide the true inputs. The burden of proof is on the planner to show how the information gets into the model without being distorted by the act of gathering it.

  **Why they talk past each other:**
  When Lange says, "We can solve the equations," he is operating in the ontology of static equilibrium. When Hayek says, "You don't have the data," he is operating in the ontology of dynamic disequilibrium.
  *   Lange hears Hayek saying: "Your computer isn't fast enough." (Empirical claim)
  *   Hayek is actually saying: "The data does not exist until the market creates it." (Ontological claim)

  Because Lange treats knowledge as *propositional* (codifiable in a ledger) and Hayek treats knowledge as *practical* (embedded in habits, local contexts, and hunches), they cannot agree on what "calculation" even means. For Lange, calculation is solving for $P$. For Hayek, calculation is the process of entrepreneurs discovering that $P$ is wrong.

  ### 2. Where Your Three-Question Reconstruction is Tendentious
  Your tripartite division (Computability, Data Assembly, Adaptation) is analytically clean, but it silently imports Hayekian epistemology as the neutral arbiter. Here is where it leaks bias:

  **A. It assumes "Data" is the bottleneck.**
  By framing Question (2) as "Could the data... be assembled," you accept the premise that the relevant information *exists* in some form to be assembled. A hardline Marxist or Institutionalist might argue that under capitalism, relevant data (e.g., social costs, long-term ecological impacts) is systematically *obscured* by property rights and profit motives. In this view, the market doesn't "discover" data; it hides it behind externalities. Your framing assumes the market's data set is the complete one.

  **B. It privileges "Efficiency" as the metric.**
  Your reconstruction assumes the goal of the debate is allocative efficiency (Pareto optimality). Lange explicitly conceded that socialism might be less efficient in static allocation but argued it would be superior in distribution and stability. By focusing on the *calculation* mechanism, the debate ignores the *political* mechanism. If the goal is democratic control over production, the "calculation problem" is a secondary technical hurdle, not the primary philosophical objection. Your framing accepts the economists' terms of engagement, which favors the market side.

  **C. It treats Hayek's "Tacit Knowledge" as a given.**
  Question (2) and (3) rely on the Hayekian claim that knowledge is inherently dispersed and often inarticulable. This is a contestable philosophical claim, not an economic fact. Cockshott's argument relies on the counter-claim that modern information technology (big data, AI) can codify what Hayek thought was tacit. By framing this as "Data Assembly," you imply the data is waiting to be picked up. If the data is truly tacit (knowing how to ride a bike), it cannot be "assembled" by definition. Your framing makes the Socialist task look like a logistics problem, when their critics claim it is a category error.

  ### 3. The Verdict: What Counts as Progress?
  Is this a permanent impasse? **Yes, at the level of the "Grand Question."**
  No formal result or historical case will settle it, because the disagreement is about first principles (the nature of knowledge and the purpose of the economy).

  *   **Formal Results:** Complexity theory (P vs NP) helps Cockshott, but it doesn't address the incentive problem (why would a manager report true capacity?). General Equilibrium theory helps Lange, but it assumes away the dynamics Hayek cares about.
  *   **Empirical Cases:** The Soviet Union failed, but proponents argue it wasn't "real" socialism (lack of democracy, bureaucratic distortion). Walmart succeeds internally, but only because it rides on external market prices for labor and capital. There is no control group for a global, democratic, planned economy.
  *   **The "Walmart" Move:** This is the strongest empirical point for planners, but it hits a scaling limit. Firms are planned hierarchies; markets are spontaneous orders. Coase's theory of the firm suggests firms exist until the cost of internal planning exceeds the cost of external transaction. The debate is essentially about where that line is. Hayekians say the line is very small (firms should be tiny); Planners say the line is very large (the whole economy can be one firm). We cannot know where the line is without trying, but trying risks catastrophic failure.

  **Where Progress Is Possible:**
  Progress happens only if you **change the question** from "System A vs. System B" to "Mechanism M for Context C."

  1.  **Mechanism Design:** Instead of asking "Can we plan the whole economy?", ask "For which goods is planning superior?" (e.g., public goods, natural monopolies, long-term R&D) and "For which goods are prices superior?" (e.g., consumer preferences, local services). This dissolves the binary.
  2.  **Epistemic Humility:** Acknowledge that Mises was right about the *limits of knowledge* but wrong about the *impossibility of approximation*. We can have "mixed" systems that use prices for discovery and planning for stabilization.
  3.  **Power Analysis:** Shift the debate from *efficiency* to *power*. If the calculation problem implies that planners must have totalitarian power to gather data, that is a political argument, not an economic one. If the market implies that capital owners have veto power over production, that is also a political argument.

  ### Summary
  Your hypothesis is structurally sound: the debate stalls because it conflates static computability, information aggregation, and dynamic discovery.

  However, the deeper reason nobody budges is that **Mises and Hayek are making a philosophical claim about the limits of human reason, while Lange and Cockshott are making an engineering claim about the capacity of institutions.**

  *   **Mises/Hayek:** "You cannot know enough to plan." (Epistemological skepticism)
  *   **Lange/Cockshott:** "We can build a system to know enough." (Technological optimism)

  These are not compatible premises. One side sees the economy as a brain (central processing), the other as an ecosystem (distributed processing). You cannot prove an ecosystem "wrong" with a blueprint, and you cannot prove a blueprint "wrong" with a story about evolution.

  **The Verdict:** The debate is a permanent impasse at the level of total systems. Progress is only possible by abandoning the quest for a total system and moving toward **pluralist institutionalism**: identifying specific domains where price signals fail (externalities, monopoly) and specific domains where planning fails (innovation, preference revelation), and designing hybrid mechanisms for the boundary between them. If your seminar stays on "Who won the 1930s?", you will stay stuck. If you move to "What is the boundary of the firm vs. the market in the age of AI?", you might actually generate light.
