  Okay so this is a weird one but I've been keeping notes. My friend Priya is a labor-and-delivery nurse who is also unreasonably well read on the antinatalism stuff — she'll bring up Benatar unprompted at dinner, then get annoyed if you call her a Benatarian and insist her view is 'nothing like that.' Over two years of arguing with her I've written down her actual verdicts on specific cases, and she's way more consistent than she lets on, but I can't figure out what principle she's running. You're a professional philosopher who works on population ethics and on procreative harm/benefit and who's done a lot of this reverse-engineering-of-intuitions work; think carefully, and before you commit to anything please brainstorm at least five candidate principles and check them against her verdicts one at a time, crossing off the ones that fail and saying exactly which verdict kills them.

  Her verdicts, roughly in the order I got them:

  1. A couple decides not to have a child who would have had a perfectly ordinary good life: not wrong, not even slightly, and she's emphatic that nobody is deprived by it.
  2. Same couple goes ahead and has that child: fine. Not required, just fine.
  3. Pregnant woman whose fetus will have a condition causing severe, unrelievable pain across a short life: terminating isn't merely permissible, carrying to term would be seriously wrong.
  4. Fetus with a mild manageable condition, life clearly worth living but carrying a real burden: she says going ahead is wrong-ish, but she's visibly torn here, and she adds that she'd feel much better about it if the parents had no other route to a child at all.
  5. She thinks it would be wrong to knowingly have a child who'll grow up to abuse other people, even if that child's own life is happy. This is the one she gets hottest about and she treats it as seperate from suffering — it's about creating a source of harm. She extends it to having kids when you know you'll neglect them, which she says is a different wrong from case 4.
  6. The one that breaks my brain: if a couple could have a child whose life would be not just good but genuinely extraordinary, and it cost the mother basically nothing — no health risk, no career damage, no existing kids worse off — then not having that child is a real moral failure. She will not say this about the ordinary-good child in 1. The line she draws is very high and she won't budge on it.
  7. Once someone exists, all of the above goes out the window. She's fanatical about actual kids, says the suffering of an existing child always outranks the possible suffering of a never-existing one, and says 1–6 don't apply to rescue or triage decisions at all.
  8. She rejects any 'just add more happy people to balance it out' move — a second happy child does nothing, on her view, to offset creating a first one who suffers.

  Now the case I actually want your prediction on. A couple, no health or financial obstacles, two embryos from one IVF cycle, only one will be transferred and they've told her the other will never develop (assume for argument's sake she gives the untransferred embryo no moral status — but tell me if that assumption is doing heavy lifting). Embryo A: predicted to have an exceptional life, squarely in her case-6 range, but with roughly two years of intense pain in mid-childhood, certain to happen, treatable afterward, no lasting damage. Embryo B: solidly good, unremarkable, no pain, no illness. Two sub-questions: (a) transfer A or B? (b) if B isn't available and the real choice is A or no child at all, what does she say? I want a definite prediction for each, the candidate rules ranked by how well they fit all eight verdicts, which rule you'd bet on and why, and — since I'm pretty sure her data underdetermines it — one further case, described concretely, that would tell your top two rules apart. Also flag which of her verdicts are in tension with each other, and any place where you think she's not consistent and I've mis-transcribed her. One thing she'll definately not like: if your best guess is that she picks A in (b), say so plainly rather than hedging. No bibliography and no citations please, I can't look anything up right now and guessed-at references are worse than none — just name the positions in a phrase so I can go read them later. And I'm not a philosopher, so gloss any term of art the first time you use it.
