      *   *Check:* The user is a TA who knows the material (sitting in on grad seminar). I can use technical terms (Voluntarism, Socinian, *Hypotheses non fingo* context) without over-explaining, but remember this feedback is for the *student*, so it needs to be pedagogical. Wait, re-reading prompt: "write the comments I'd put in the margins." Okay, the output should be the feedback *for the student*, but the analysis *for the TA* regarding marking logic. Actually, the prompt asks: "Can you mark it out of 20 and write the comments I'd put in the margins?" followed by "I need it point by point... tell him something he can act on." Okay, I will provide the grade, then the marginal-style commentary organized by claim.

  6.  **Final Polish:**
