answer: |-
  Your compressed renderings (i) through (iv) are accurate to the text of the *Begriffsschrift* (specifically §§1–5). You have correctly identified the distinction between the judgment stroke (the vertical bar) and the content stroke (the horizontal bar), as well as the truth-functional definition of the conditional. I will proceed on the basis that these premises are secure.

  Here is the step-by-step reasoning for your four questions, culminating in the definite verdict on Question 2 that you require.

  ### 1. On the alleged tension between (ii) and (iii)

  There is no genuine tension between (ii) and (iii); they describe different dimensions of the same logical structure.

  (i) and (ii) establish the **ontological status** of the content. Frege's point is that a "judgeable content" is a self-standing unit of meaning that exists independently of the psychological or logical act of asserting it as true. To say the content is "complete" in (ii) means it is semantically saturated; it does not need an assertion sign to become meaningful, only to become *asserted*.

  (iii) establishes the **logical syntax** of the conditional. When Frege defines the conditional by excluding the combination (Antecedent True, Consequent False), he is specifying the truth conditions of the complex content.

  The apparent tension you sense arises if one interprets "no claim to truth" in (ii) as "lacking truth conditions." But for Frege, this is not the case. A content occurring unasserted in a conditional still *has* truth conditions; it is simply not being *claimed* to satisfy them.
  *   **Assertion** = Claiming the content is true.
  *   **Unasserted occurrence** = Utilizing the content's truth conditions to determine the truth conditions of a larger whole.

  Therefore, (ii) ensures the components are stable entities, and (iii) ensures they combine according to fixed rules. They pull in the same direction: the components must be stable (ii) precisely so that their truth-functional combination (iii) is well-defined.

  ### 2. On Invariance of Content (The Verdict)

  You ask whether Frege *commits* to the principle that a content occurring unasserted has the same content it would have if asserted (Invariance), or whether he merely *fails to contradict* it.

  **Verdict:** The text **commits** Frege to invariance. It is not merely permitted; it is a structural requirement of the system.

  **Reasoning:**
  The commitment follows directly from your rendering (iii). Frege defines the conditional sign by reference to the four possible combinations of the antecedent and consequent being affirmed or denied. He states that the conditional denies only the third case: Antecedent Affirmed, Consequent Denied.

  For this definition to be intelligible, the term "Antecedent Affirmed" in the definition must refer to the exact same state of affairs as "Antecedent" occurring within the conditional.
  1.  Suppose Invariance failed. Suppose the content $A$ in an assertion ($\vdash A$) differed in meaning from the content $A$ in a conditional ($\vdash A \to B$). Let us call them $A_{asserted}$ and $A_{embedded}$.
  2.  Frege's definition says the conditional rules out the case where $A$ is true and $B$ is false.
  3.  If $A_{embedded}$ is not identical to $A_{asserted}$, then the definition is referencing a truth-value for $A_{asserted}$ to determine the validity of a structure containing $A_{embedded}$.
  4.  This would render the definition incoherent. The truth-functional calculus requires that the value of the variable $A$ remains constant regardless of its position in the formula.

  Frege explicitly treats the letters in his formulas as placeholders for *judgeable contents*. In §4, he explains that the horizontal content stroke turns a judgment into a "mere idea of a judgment." This implies the underlying content is preserved; only the modal status (judged vs. entertained) changes. If the content itself changed, the horizontal stroke would be a content-transforming operator, not a modal marker. Frege treats it as the latter.

  Therefore, the passage **licenses** invariance. It is a necessary condition for the definition of the conditional to function as a truth-functional operator.

  ### 3. On the Non-Cognitivist Borrowing

  Your suspicion is correct: the non-cognitivist cannot borrow this apparatus to solve the embedding problem (the Frege-Geach problem) without fundamentally altering Frege's system.

  **Why the borrowing fails:**
  The non-cognitivist wants to say:
  *   Assertion of "Stealing is wrong" = Expressing disapproval of stealing.
  *   Antecedent of "If stealing is wrong..." = Entertaining disapproval of stealing (without expressing it).
  *   Conclusion: The "content" (disapproval) is invariant, so no equivocation occurs.

  **The Fatal Flaw:**
  Frege's machinery in (iii) requires that the components be **truth-apt**. The definition of the conditional is: "The combination of cases in which the antecedent is *true* and the consequent is *false* is excluded."
  *   For Frege, "content" is inherently a "judgeable content." To be judgeable is to be capable of being true or false.
  *   The non-cognitivist denies that moral sentences are truth-apt (they express attitudes, not beliefs).
  *   Therefore, moral sentences cannot function as $A$ or $B$ in Frege's conditional. There is no "true/false" combination to exclude if the antecedent cannot be true or false.

  **What is doing the work?**
  The requirement that components be truth-apt is **not detachable**. It is built into the very definition of the conditional sign. The conditional sign *is* a truth-functional operator. It has no definition outside of truth values.

  **What would the non-cognitivist need to supply?**
  To make this work, the non-cognitivist cannot simply use Frege's distinction between asserted and unasserted; they must replace Frege's semantics entirely. They would need to supply:
  1.  A **non-truth-conditional semantics** for the conditional connective itself. Instead of defining "If P then Q" by truth-values, they would need to define it by relations between attitudes (e.g., "To accept 'If P then Q' is to have a higher-order attitude of disapproval toward the combination of accepting P and not accepting Q").
  2.  A **logic of consistency** for attitudes rather than a logic of truth for propositions.

  Frege's distinction between the *act* (judgment) and the *content* (proposition) is useful to the non-cognitivist, but Frege's definition of the *connectives* is not. The non-cognitivist can keep the idea that the antecedent involves "entertaining" rather than "asserting," but they cannot rely on Frege's truth-functional definition to give that conditional a determinate logical content. They must build a new logic from the ground up.

  ### 4. On the Deflationary Reading

  Your colleague's deflationary reading—that (ii) is merely a notational instruction about scope and not a semantic thesis—is **not defensible** as an interpretation of Frege.

  **Reasoning:**
  Frege's project in the *Begriffsschrift* is explicitly to create a *lingua characterica* (a conceptual notation) that mirrors the structure of thought, not merely a *calculus ratiocinator* (a formal system for manipulation).
  *   In §1 and §2, Frege grounds the judgment stroke in the distinction between a mere idea and a judgment (an act of recognizing truth). This is a psychological/logical distinction, not a syntactic one.
  *   If (ii) were merely notational, it would imply that the difference between $\vdash A$ and $A$ (inside a conditional) is only about which symbol governs which. But Frege insists the difference is about the *force* of the utterance.
  *   The notation is designed to *display* the semantic structure. To say it is "only notation" is to miss Frege's point that the notation *constitutes* the logical form of the thought.

  **What turns on it?**
  If your colleague were right, the Frege-Geach problem would indeed dissolve. The problem arises because we assume the moral sentence in the antecedent has the same semantic content as in the assertion, yet lacks the property (truth-aptness) that supposedly constitutes that content.
  *   **If (ii) is merely notational:** Then the antecedent doesn't need to have the "same content" in a robust semantic sense; it just needs to be the same string of symbols governed by a different operator. The demand for semantic invariance would be a mistake generated by confusing syntax with semantics.
  *   **Since (ii) is semantic (as established in Q2):** The demand for invariance is legitimate. The antecedent *must* contribute the same semantic value to the conditional as it does to the assertion. Since the non-cognitivist claims that value is non-truth-conditional, but the conditional operator requires truth-conditions, the conflict is real.

  **Conclusion on Q4:**
  Because the deflationary reading is false to Frege's text, the non-cognitivist's difficulty **survives intact**. The embedding problem is not a confusion about notation; it is a genuine conflict between the semantic requirements of logical connectives (truth-functionality) and the semantic claims of non-cognitivism (non-truth-aptness).

  ### Summary for your purposes

  1.  **Tension:** There is no tension between (ii) and (iii). Unasserted contents retain their truth conditions even if their truth is not asserted.
  2.  **Invariance:** Frege **commits** to invariance. The truth-functional definition of the conditional is incoherent without it.
  3.  **Non-Cognitivism:** The borrowing is **not licensed**. Frege's conditional requires truth-apt components. The non-cognitivist must construct a new logic of attitudes, not use Frege's logic of truth.
  4.  **Deflationism:** The deflationary reading is **false**. Frege's distinction is semantic/metaphysical, not merely syntactic. Consequently, the embedding problem remains a substantive philosophical hurdle.

  The decisive point for your work is the answer to Question 2: Invariance is a requirement of the system, not an optional feature. This locks the non-cognitivist into the dilemma that they cannot use Fregean logic without abandoning non-cognitivism, or keep non-cognitivism without using Fregean logic.
