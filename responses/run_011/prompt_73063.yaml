      *   **Context:** Avicenna (Ibn Sina), *Kitab al-Shifa* (The Book of Healing) and *al-Isharat wa-l-Tanbihat* (Remarks and Admonitions).
      *   **The Argument:** A man created all at once, floating in air, senses blocked (no sight, touch, sound, etc.). Would he affirm his existence? Yes. Would he affirm his body/limbs? No. Therefore, the self (soul) is distinct from the body.
      *   **Point 1 (Marcus):** Compares it to Descartes' *Cogito*. Claims same argument, same conclusion (mind isn't body).
          *   *Scholarly Consensus:* There are similarities (self-awareness without sensory input), but significant differences. Descartes uses methodological doubt to find indubitable truth (*Cogito, ergo sum*). Avicenna uses it to show the primitiveness/immediacy of self-awareness and the immateriality of the soul. Avicenna isn't doubting existence; he's isolating awareness. The conclusion is similar (dualism), but the method and epistemic status differ. Marcus is oversimplifying.
      *   **Point 2 (Dana):** Says structurally different. Descartes = doubt/certainty. Avicenna = awareness/attention. Not primarily metaphysical claim initially, but about what attention is aimed at.
          *   *Scholarly Consensus:* Dana is more accurate here. Avicenna's point is often interpreted as establishing the *primacy* of self-awareness independent of bodily awareness. It's an intuition pump for the immateriality of the soul, but the immediate result is about awareness. However, Avicenna *does* intend it to support substance dualism eventually. Dana's distinction on doubt vs. awareness is key.
