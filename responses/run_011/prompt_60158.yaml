      *   *The "Empty Promise" Problem:* If I promise you I'll clap my hands, and you don't care/rely, is there a duty? User says yes, weak. But if you waive it, the duty vanishes. This suggests the *content* of the duty is controlled by the promisee's will, not just the promisor's.
      *   *The "Too Late Reliance" Problem:* I promise. You don't rely for weeks. Then you rely heavily. Did my duty *increase* retroactively? Or did it exist potentially? If it increases, can I revoke before reliance? If I can revoke before reliance, then the duty wasn't real at $t_0$.
      *   *The "Dead Promisee" / "Waiver" Problem:* If the claim is theirs, and they die/waive, the claim disappears. But we often feel bound by dead relatives' wishes. User acknowledges this but needs to fit it in. If the claim vanishes, who is the duty owed to?
