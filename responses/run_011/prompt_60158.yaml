      *   *The "Unfalsifiable" point:* Be honest. Normative theories often are mushy. But is *this* mushier? Yes, because "uptake" is internal to the promisee and hard to measure.

  8.  **Final Polish:** Check against constraints (no reading list, honest about concessions). Ensure the "Collapse" objection gets the space it deserves since it scared the user.

