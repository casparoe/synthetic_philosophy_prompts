  *(Self-Correction on Waiver)*: If the promisee can waive, does that mean the duty was never "self-assumed" in a strong sense? It means the duty is *held* by them. This actually supports the "directed duty" view but weakens the "self-assumed" independence. I need to highlight this tension.

