  2.  **Deconstruct the User's Theory:**
      *   *Normative Power Component:* I create the duty by speaking (assurance + uptake). It's directed (owed *to* them).
      *   *Graded Strength Component:* Duty exists at $t_0$ (uptake) but weight $W$ increases with reliance/planning $R$. $W = f(R)$.
      *   *Goal:* Avoid pure reliance (Hume/Raz) where the duty *is* the prevention of harm/disappointment. Avoid pure voluntarism (Scanlon/Shiffrin) where the duty is binary and absolute upon utterance.

