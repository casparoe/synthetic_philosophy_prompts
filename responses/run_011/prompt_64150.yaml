answer: |-
  1.  **Creature vs. State Consciousness (0–5 min)**
      Board left. Distinguish wakefulness (creature) from state awareness (transitive). HOT targets state consciousness. Write: "State S is conscious iff accompanied by suitable non-conscious thought."
      *Dependency:* This definition requires the transitive/creature split first. Without it, students conflate awareness with wakefulness or attention.
      *Action:* Explicitly state: "We are not explaining why you are awake; we are explaining why a specific state feels like something."

  2.  **Regress & Unconscious HOT (5–15 min)**
      Board center. Define HOT. Raise regress *immediately*: "If HOT is conscious, we need HOT2, HOT3..." Solution: HOT is unconscious.
      *Dependency:* This motivates the "non-conscious" clause in your definition early.
      *Misconception Head-off:* This blocks the "introspection" error (conscious second judgement). State clearly: "The HOT is not a second look; it is a structural condition."

  3.  **Example: Unfelt Pain (15–25 min)**
      Drop Gorilla. It implies rich unconscious content (debated) and collapses into attention (GWT). Use **Unfelt Pain** (hypnotic analgesia/blindsight).
      *Structure:* 1st-order: Nociception (damage rep). 2nd-order: Missing HOT. Result: Damage exists, no suffering.
      *Requirement:* Dissociation between signal and feeling.
      *Prohibition:* Ambiguity about signal existence.
      *Why:* This isolates awareness from representation, avoiding the "rich unconscious state" trap of inattentional blindness.

  4.  **Misconception Intercepts (25–35 min)**
      Do not wait for Q&A. Intercept during explanation.
      *Objection 1:* "How can unconscious HOT make it feel?"
      *Beat:* Address now. Answer: HOT doesn't add qualia; it adds *for-me-ness*. Without it, the state exists but isn't *for* the subject.
      *Objection 2:* "HOT without pain = pain?"
      *Beat:* Address now. Answer: No. HOT must be causally triggered by 1st-order state (reliability). Empty HOT is misrepresentation, not pain.

  5.  **HOT vs. GWT & Cuts (35–45 min)**
      Board right. GWT = Access/Report. HOT = Phenomenality.
      *Cuts:* Dispositionalism and Externalist HOT.
      *Script:* "We stick to Actualist HOT. Dispositionalism changes metaphysics; Externalism complicates locus. Both await final papers."
      *Closing Question:* "If global broadcasting occurs without a higher-order representation, is there something it is like to be in that state? Why?"
      *Target:* GWT=Yes (Access suffices). HOT=No (HOT required). This tests the metaphysical distinction, not definition recall.
