answer: |-
  This is a classic philosophical trap, and your intuition is correct: the argument looks tight, but it relies on a sleight of hand in the middle. Your brother-in-law (BIL) is using a *reductio ad absurdum* intended to expose human hypocrisy, but to do so, he has to smuggle in a premise that most neuroscientists and ethicists would reject.

  Here is the breakdown of where the argument fails, the cost of rejecting that step, and why his "changing rulers" objection backfires on him.

  ### 1. Where the Argument Breaks: Step 2 and 3
  You said you'd rather lose Step 3 than Step 1. That is the correct instinct. Step 1 is the standard philosophical baseline (sentience/cognition grants moral standing). The error happens at the transition from **Step 2 to Step 3**.

  **Step 2 claims:** Brain mass is the *best available measure* of the mental stuff that matters.
  **Step 3 claims:** Therefore, differences in brain mass *are* differences in moral weight.

  **The Flaw:** This confuses a **proxy** with the **property**.
  Brain mass is a *correlate* of cognitive capacity, not the *constitutive property* of moral worth.
  *   **Analogy:** If you want to measure "computing power," weight is a rough proxy for servers. A data center weighs more than a laptop. But if you say, "Therefore, a 50lb server rack has more moral claim to existence than a 3lb laptop," you've confused the hardware with the software.
  *   **The Science:** We know brain mass is a bad proxy. A cow's brain is heavier than a chimpanzee's; a macaque's brain is denser in the prefrontal cortex than a cow's. If you stick with Step 2, you are arguing that a cow is morally superior to a chimp. Most vegans (and your BIL) would not accept that.

  **The Cost of Rejecting Step 3:**
  If you reject Step 3, you are admitting that **biological metrics are imperfect heuristics, not moral laws.**
  *   **What you lose:** You lose the simplicity of a single number (grams) to settle the debate. You have to do the harder work of specifying *which* mental capacities matter (e.g., episodic memory, future planning, linguistic recursion, moral agency).
  *   **What you gain:** You avoid the absurd conclusion that a sperm whale has a greater right to life than a human toddler. You align your ethics with actual neuroscience, which values *connectivity, cortical folding, and neuron density in specific regions* over raw mass.

  ### 2. The "Changing Rulers" Objection
  Your BIL's strongest rhetorical move is Step 6: *"Every time the metric stops flattering us we change the metric."* He is accusing you of **Special Pleading** (rigging the system to win).

  **Why this objection is weak:**
  There is a difference between **moving the goalposts** (dishonesty) and **refining the measurement** (scientific progress).
  *   If you try to measure temperature with a glass of water (it freezes at 0, boils at 100), and someone says, "But this doesn't work for 500 degrees," and you switch to a thermometer, you aren't being hypocritical. You are acknowledging the first tool was crude.
  *   Brain mass *was* the ruler 100 years ago. We changed the ruler because science told us it was inaccurate. When you shift from "mass" to "neuron density in the pallium," you aren't swapping rulers to save humans; you are swapping rulers to get a more accurate reading of the *mental stuff* defined in Step 1.

  **How it bites him back:**
  Your BIL is guilty of the exact same charge.
  *   He starts with Step 1: "Mental stuff matters."
  *   He jumps to Step 2: "Brain mass is the measure."
  *   **Why did he pick mass?** Because it's the only metric that gets him the conclusion he wants (that humans aren't special). If he used "neural connectivity" or "moral agency," humans come out on top.
  *   **The Turn:** He is accusing you of changing the ruler to keep humans on top. But he picked a ruler *specifically because* it puts humans below whales. He is "dressing up 'we lose' as a measurement" just as much as he accuses you of dressing up "we win." He froze the metric at "mass" because going deeper (into neuron function) undermines his conclusion.

  ### 3. The Fatal Category Error: Moral Weight vs. Moral Authority
  Even if you grant him Step 5 (Whales have more moral weight), Step 6 implies that having more moral weight grants a species dominion over another. This is a category error.

  *   **Moral Weight (Patienthood):** The capacity to suffer or have interests. A baby has more moral weight than a fly.
  *   **Moral Authority (Agency):** The capacity to understand rights, duties, and consequences.

  If a Sperm Whale has a bigger brain, it may have higher *moral weight* (more capacity for suffering or complex experience). But it does not have *moral authority*. It cannot enter into a social contract. It cannot reciprocate rights.
  *   **The Implication:** Even if the whale is "worth more" in a utilitarian calculus, that doesn't mean it has the right to eat you, nor does your lower "score" mean you must submit to it. It just means you have a higher obligation *not to harm it*.
  *   **The Vegan Trap:** If your BIL argues that brain mass dictates moral hierarchy, he undermines the basis of veganism. Veganism relies on the idea that *suffering* is the baseline, not hierarchy. If we are just ranking brains, then a being with a bigger brain than a human (an alien, a super-AI, or a whale) would be justified in farming humans. Most vegans do not want to defend the position that "Might (or Mass) Makes Right."

  ### Summary for Your Reply
  You can tell him this:

  1.  **Reject Step 2/3:** Brain mass is a crude proxy, not the definition of moral worth. Rejecting this doesn't save humans; it saves *accuracy*. If he cares about the "mental stuff" (Step 1), he must care about the *quality* of the brain, not just the weight.
  2.  **Call the "Ruler" Bluff:** Refining a metric based on new data isn't hypocrisy. But picking "mass" because it's the only metric that demotes humans is just as biased as picking "language" because it promotes them. He froze the science at 1950s neurology to make his point.
  3.  **The Alien Test:** Ask him: "If an alien landed with a 10kg brain and superior cognition, would you argue it is morally permissible for them to farm humans?" If he says **No**, then he admits brain mass isn't the sole determinant of moral rights. If he says **Yes**, he has argued himself out of human rights entirely.

  He wants to use brain mass to humble humans (Step 6), but he can't use it to humble humans without also destroying the foundation of *his* moral claim (that humans have duties to animals). Duties require agents, not just heavy brains.
