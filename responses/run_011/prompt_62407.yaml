answer: |-
  "You're telling me nothing caused that house to burn down?" Mara tapped her pen against the table, sharp rhythm. "Because the battery wasn't there?"

  "I'm telling you *nothing* isn't a thing, Mara. It's not an event." Leo leaned back, arms crossed. "Fire caused the burn. Oxygen, fuel, heat. The missing battery? That's just background. You can't trace energy from an absence."

  "Try telling that to the insurance adjuster. Or the mom. They all say the missing battery caused the loss."

  "They're speaking loosely. They mean the dad's *action* of removing it caused the vulnerability. But the absence itself? There's no oomph. No process connecting 'no battery' to 'charred beams.' You're chasing ghosts."

  "God, you sound like a nineteenth-century physicist. Causation is about difference-making. If the battery had been there, the alarm sounds, they wake up, hose it down. World goes differently. That's a cause. Full stop."

  "Physics envy? No, it's reality envy. You want the world to be about dependencies. I want it to be about stuff."

  "Okay, twist it." Mara leaned forward. "Suppose the wiring was fried. Dead. Even with a brand-new battery, the alarm stays silent. Fire moves fast—they get one minute max even if it screams. So taking the battery out made zero difference to the outcome."

  Leo smirked. "Finally. So the absence wasn't a cause. My view holds. Nothing there, nothing happens."

  "Wait. Does it hurt you? The dad pulled the battery. That's a physical event. But if the alarm was dead, his removal didn't change the physical process of the fire either."

  "It means he's negligent, not causal."

  "But everybody still calls it the cause. Even knowing the wiring was shot, the report says 'failure of safety system.'"

  "Then the report is conflating blame with physics," Leo said. "And this actually hurts *you*. If causation is difference-making, and there was no difference, you have to admit it wasn't a cause. But you want to say the dad is responsible. You're trying to have causation do the work of morality."

  Mara grimaced. "Fine. Maybe causation isn't blame. But that leads to Case Three, and you know it. Why is the dad's failure a cause, but not some random guy in Ohio who didn't drive down with a extinguisher? Neither did anything. Neither sent energy. On your view, both are absences. On my view, if the Ohio guy couldn't have made it, he's not a cause. But what if he could have? What if he was just sleeping?"

  "Neither is a cause," Leo said. "Nothing happened."

  "That's insane. The dad's inaction is causal. The Ohio guy's isn't. You need a filter."

  "I don't. I just say 'no' to both."

  "You can't live like that. You'd dissolve every legal system in history." Mara rubbed her temples. "Okay, here's a fix. Maybe an absence is only a cause relative to what was *supposed* to happen. Detectors are supposed to sound. Dads are supposed to replace batteries. Random guys in Ohio aren't supposed to intervene. So the dad's non-action is an absence in the relevant sense. The Ohio guy's is just... nothing."

  Leo frowned. "You're smuggling norms into metaphysics."

  "Maybe metaphysics needs them. It explains why one feels cause-y and the other doesn't."

  "Temporary team-up?" Mara asked. "Does this dissolve the Ohio problem?"

  "It filters it," Leo said slowly. "But now causation depends on expectations. If we move to a society where dads aren't expected to fix alarms, the fire happens the same way, but suddenly there's no cause? That makes causation subjective."

  "It makes it contextual. Like 'tall.' You're not tall in a basketball team, you are in a kindergarten."

  "Height is physical. Causation is supposed to be about how the world works, not what people think." Leo tapped the table. "Give me a case where the norm gives the wrong answer."

  Mara thought. "A lifeguard drowns a swimmer intentionally. He violated the norm. But his action caused the death. Now suppose a stranger sees the swimmer drowning. No norm expects him to jump in. He doesn't. Swimmer dies. On your norm view, the stranger's inaction isn't a cause. But if he was the *only* person there? And he could have saved them?"

  "So?"

  "So intuitively, the swimmer died because the stranger didn't help. But there was no norm. Your rule says 'not a cause.' That feels wrong. The dependency is there."

  "Or," Leo said, "it proves my point. You're struggling because you're trying to make 'nothing' do something. You need norms to prop it up because the ontology is empty."

  "But if I drop norms, I can't distinguish the dad from the Ohio guy."

  "Because there *is* no distinction in the physics. The distinction is purely moral." Leo leaned in. "Here's your problem. If causation shifts based on what people *expect*, then causation isn't in the world. It's in our heads. If the dad didn't *know* he was supposed to change the battery—say he bought the house yesterday—does the absence stop being a cause? The fire burns the same. The physics are identical."

  Mara opened her mouth, then closed it. "It's about objective functions. The alarm's function is to alarm."

  "Functions are assigned by users. Take the alarm to a planet with no humans. It doesn't have a function. If it fails to sound, did it cause the forest to burn? On your view, no norms, no cause. On my view, still no cause, because absences don't push."

  "So we're stuck."

  "No. I'm consistent. Nothing causes anything by not happening. You're the one trying to build a bridge out of mist."

  "But I can explain why we sue the dad and not the Ohio guy."

  "You explain blame. I explain the world." Leo sat back. "And if your theory says the cause disappears just because the expectation changes, then you're not talking about causation. You're talking about accountability."

  Mara stared at her coffee. "So when the report says the battery caused the fire..."

  "It's shorthand for 'The dad's failure to meet an expectation allowed the fire to proceed unchecked.' It's not a causal claim. It's a liability claim."

  "That feels like a dodge. Like you're redefining 'cause' to save the theory."

  "Maybe," Leo said. "But you're redefining 'world' to save the intuition. At least my nothing is honestly nothing."

  Mara sighed, picking up her pen again. "I still think the house burned down because the battery wasn't there."

  "And I think it burned down because wood burns. The rest is just story."

  "Next round. I'm bringing the Ohio guy's truck."

  "Bring the fire extinguisher. Maybe then something will actually happen."
