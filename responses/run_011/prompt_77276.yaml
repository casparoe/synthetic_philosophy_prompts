prompt: |-
  I'm putting together a corpus of technical-satire prompts and need one more entry, this one about fairness metrics in criminal risk scoring. Heres the setup I want you to write:

  Version 4.2 release notes for a commercial recidivism risk-assessment tool (you invent the vendor, the product name, and the state) whose regulator just passed a statute — call it what you like, but give it a section number or two — requiring the score to simultaneously satisfy: calibration within each racial group, equal false positive rates across groups, and equal false negative rates across groups. On top of that the statute has a Pareto clause saying no group may be predicted against less accurately than under version 4.1, and a transparency clause requiring a "trade-off ledger" stating, per group and per 1,000 people scored, how many extra false positives or false negatives the update created.

  Format: deadpan corporate changelog, about 800 words. Sections along the lines of Highlights, Fixed, Improved, Changed, Deprecated, Known Issues, Compliance Statement, and a Notice to Affected Persons in Plain Language at the bottom. Support email address at the very end that is obviously not monitored.

  The comedy has to come entirely from the vendor complying with the letter of the law in ways that only someone who actually understands base rates and these impossibility results will clock. Each bullet should cut one specific corner and the reader should be able to name it: per-group thresholds tuned until the metrics line up and the ranking collapses; calibration restored by re-binning the score so coarsely that everyone is calibrated by construction; a protected attribute "removed" from the feature set while remaining trivially reconstructable from four other fields; equalized error rates achieved because one group now has nobody above the release threshold, so its false negative rate is 0/0 and the equality holds vacuously; AUC quietly down six points; the Pareto clause satisfied by measuring accuracy on a subset the vendor gets to define; the ledger technically complete but presented so it only makes sense to a reader who already knows what the numbers mean.

  Hard constraints: no named theorems, papers, results, or people, no citations or bibliography anywhere, and the vendor never once admits the criteria conflict — the whole document has to read as completely sincere. Include exactly one bug fix that makes things worse in a way only a base-rate-literate reader would catch, and one Deprecated entry that is obviously the interesting part of the old model being quietly deleted.

  The plain language notice should be the best bit: two or three sentences at roughly a sixth-grade reading level, completely honest about what the model now does differently, and horrifying if you're the judge who receives it.
