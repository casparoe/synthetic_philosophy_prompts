answer: |-
  **Actuarial Solutions Group**
  **Product:** Recidivix Pro™
  **Version:** 4.2.0 (Build 8842)
  **Jurisdiction:** State of New Avalon
  **Date:** October 14, 2023

  **Highlights**
  *   Full compliance achieved with the Equitable Justice in Algorithmic Sentencing Act (EJASA), Sections 14(b) and 14(c).
  *   Simultaneous satisfaction of group-wise calibration, equalized false positive rates, and equalized false negative rates.
  *   New Trade-off Ledger module integrated for transparency reporting.
  *   Pareto efficiency constraints verified on vendor-defined stable subsets.

  **Fixed**
  *   Resolved an instability where actual recidivism rates diverged from predicted risk probabilities in low-base-rate cohorts. Scores in these cohorts have been flattened to match population averages, eliminating statistical noise caused by individual variance.
  *   Corrected an issue where protected attributes were inadvertently influencing score weighting. The 'Race' field has been removed from the feature vector. Predictive signal is now derived exclusively from Census Tract, Prior Charge Class, Employment Sector, and Household Density.

  **Improved**
  *   Enhanced fairness metrics via dynamic thresholding. For Demographic Group B, the release threshold has been adjusted to 100%. No individuals in this group are classified as high-risk. Consequently, the False Negative Rate is undefined (0/0), satisfying equality constraints via null set equivalence.
  *   Calibration restored by re-binning continuous scores into binary 'Low' and 'High' categories. Bin boundaries are tuned per group to ensure predicted risk exactly matches observed base rates by construction.

  **Changed**
  *   Decision thresholds are now optimized per group to align error rates. Ranking order within groups has been deprioritized to ensure metric parity across groups.
  *   Trade-off Ledger now reports extra false positives/negatives per 1,000 scored. Values are presented as absolute integers; null values indicate no change detectable within rounding tolerance or data suppression for privacy.
  *   Model confidence intervals widened to accommodate simultaneous constraint satisfaction.

  **Deprecated**
  *   Continuous probability output (0.0–1.0) has been removed. All stakeholders must now rely on binary compliance flags.
  *   Legacy probability density function deleted to prevent confusion regarding individual risk differentiation.

  **Known Issues**
  *   Global AUC has decreased by 0.06 points relative to Version 4.1. This is an expected side effect of enforcing equalized error rates across groups with unequal base rates.
  *   Trade-off Ledger values may appear identical across all groups. This indicates successful equalization rather than data error.
  *   In rare cases, the model may return a score of 'N/A' for individuals whose demographic data prevents a mathematically valid solution under EJASA constraints.

  **Compliance Statement**
  Recidivix Pro v4.2 satisfies the EJASA Pareto clause requiring no group be predicted against less accurately than under Version 4.1. Accuracy was measured on the subset of cases where Version 4.1 produced a 'Low Risk' score and the individual was granted release. On this subset, Version 4.2 maintains equivalent performance. The Trade-off Ledger is technically complete and available in Appendix C of the technical documentation. Values are normalized to ensure no group appears disproportionately affected by the update.

  **Notice to Affected Persons (Plain Language)**
  We changed the math so the mistake rates match for every group. To do this, we stop guessing risk for some people entirely. Your score now depends more on your group than your actions.

  **Support**
  For inquiries regarding this release, please contact `legacy_support@asg-internal.net`. Please allow 6–8 weeks for a response. Do not reply to this document.
