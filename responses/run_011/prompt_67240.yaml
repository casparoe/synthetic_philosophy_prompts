answer: |-
  The haptic feedback in Elias's gloves hummed, a low-frequency reminder that the server farm beneath the building was cycling through another batch of simulations. He rubbed his temples, the glow of the tri-screen console reflecting in his glasses. On the center display, the file for Claimant 8940-V, Mara Vane, waited in the queue. Status: Pending Adjudication. Category: Physical Injury / Asset Loss.

  Elias liked Mara's file. Not because it was easy, but because it was clean. No fraud markers, no prior inconsistencies. She was a courier for the Outer Rim logistics chain, a job that required navigating the unstable magnetic fields of the decommissioned satellite grid. Three weeks ago, her skiff's stabilizer failed during a high-velocity dive. She survived, but her left arm was crushed, and the skiff was vaporized.

  Under standard Dworkin protocols, the agency compensated for brute luck—unchosen circumstances—but denied claims for option luck—the outcomes of calculated gambles. If Mara knew the stabilizer was faulty and flew anyway, that was option luck. If the fault was undetectable, it was brute luck. The problem, as always, was the history.

  Elias swiped left, bringing up Mara's psychosocial baseline. She grew up in the Flats, a sector prone to structural collapses and air filtration failures. Her parents died in a ventilation outage when she was six. She spent her formative years in state care, where risk-assessment training was minimal and survival instincts were prioritized over long-term planning.

  This was the contamination point. The agency's theory was that early brute luck corrupts preference formation. If you grow up believing death is random, you don't develop a normal aversion to risk. You might choose a dangerous job not because you value the thrill, but because you don't believe safety is possible anyway. Your "choices" aren't truly open options; they're adaptations to trauma.

  To correct for this, the agency used the Shadow.

  Elias initiated the simulation. The screen darkened, then populated with a wireframe model of Mara. This was the Shadow Claimant: Mara Vane reconstructed under idealized conditions. Same genetics, same intelligence, but raised in a stable sector with full information and secure attachment figures. The Shadow represented what Mara would have chosen if luck hadn't twisted her values.

  The simulation ran. Progress bars crawled across the bottom of the screen. Elias sipped his coffee, cold now. He watched the Shadow grow up in the simulation. She went to school. She didn't join the logistics chain. She chose administrative work in a low-gravity hub. She valued longevity over immediate income. When presented with the choice of flying a skiff with a marginally faulty stabilizer, the Shadow grounded the vehicle.

  The result flashed green: **DIVERGENCE DETECTED.**

  Actual Mara flew. Shadow Mara did not.

  According to the protocol, if the Shadow avoids the risk, the actual loss is reclassified as brute luck. The logic was that the actual claimant's choice was compromised by their history. Therefore, the injury wasn't a gamble; it was a consequence of unjust circumstances. The agency should pay.

  Elias hovered his cursor over the **APPROVE** key. Technically, this was the right move. Mara needed the credits for prosthetic integration. Denying her would leave her destitute, punishing her for being born in the Flats.

  But he hesitated. He pulled up Mara's personal statement attached to the claim. *"I knew the odds. I took the job because I like the fly. Don't tell me I didn't choose it."*

  That was the wrinkle. The Shadow mechanism was designed to protect claimants from their own corrupted preferences, but in doing so, it erased their actual agency. By approving the claim based on the Shadow's choice, Elias would be validating Mara's injury only by invalidating her identity. He would be telling her, officially, on the record, that she didn't know what she was doing. That her love for the flight was just a symptom of her trauma.

  It was a fresh unfairness. To get the money she needed because of her bad luck, she had to accept the narrative that she wasn't a competent agent. The system offered her compensation at the cost of her dignity. It treated her like a child of circumstance rather than an adult who made a hard choice.

  If he denied the claim, he upheld the principle of option luck but ignored the structural coercion of her upbringing. If he approved it, he neutralized the luck but imposed a paternalistic fiction on her life. There was no clean line. The brute luck of her childhood bled into the option luck of her career so thoroughly that separating them required cutting through the person herself.

  Elias looked at the two figures on the screen. The actual Mara, broken but defiant in her statement. The Shadow Mara, safe, sterile, and hypothetical. The Shadow didn't exist. The pain did. But the rules said the pain only mattered if the Shadow wouldn't have felt it.

  He toggled the classification dropdown. **TYPE: BRUTE (SHADOW OVERRIDE).**

  The system prompted for a justification code. He typed in the standard string for *Preference Contamination via Early Deprivation*. The text looked sterile against the raw scan of Mara's bone fractures. He imagined her reading the denial letter if he chose otherwise, or the approval letter if he chose this. Either way, she would know what the letter meant. It meant the agency knew better than she did what she wanted.

  A notification pinged in the corner of his screen. A secondary review flag. The system noticed the divergence magnitude was high—greater than 85% deviation between Actual and Shadow. High divergence cases required a secondary authorization signature to confirm that the Shadow model accurately reflected the claimant's potential, not just the agency's bias toward safety.

  Elias opened the authorization window. It asked for a confidence metric regarding the Shadow's utility function. Did the Shadow truly represent Mara's uncorrupted self, or just a bourgeois ideal of safety? He couldn't know. No one could. The model assumed stability was always preferable to risk, but maybe Mara's risk-taking was authentic, even if it was born in the Flats. Maybe the Shadow was the distortion.

  He moved his cursor to the confidence field. It required a numerical value between 0.0 and 1.0. A 1.0 meant total faith in the Shadow's choice. A 0.0 meant total rejection. Anything in between was an admission that the math was guessing.

  The hum of the gloves intensified as the server waited for input. Elias looked at the cursor blinking in the empty box. He thought about Mara's arm, already gone. He thought about the Shadow's arm, intact in the simulation. He thought about the form field requiring a certainty he didn't possess.

  He typed a decimal point.

