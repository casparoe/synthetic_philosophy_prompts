      *(Refining the "Victor Move")*: The user says Victor thinks wrecking is worse than never starting. Actually, Victor decides to wreck *to prevent* the starting. The user's "Victor Move" is the intuition that *having started* creates an obligation that makes stopping worse. I need to clarify this. Victor feels the weight of the partial creation.

