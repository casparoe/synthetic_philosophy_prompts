          *   *Soft Spot:* "Long run" is a standard defense for a reason.

      *   *Objection 6 (Quinean - Entrenchment):* "It's not nature, it's usage. 'Green' is entrenched. We project what we've projected before."
          *   *Reply:* "Entrenchment explains *what* we do, not *why* it's rational. Past success doesn't guarantee future logic."
          *   *Soft Spot:* Pragmatism is a valid philosophical stance.

  6.  **The "Hope Nobody Asks" Question:**
