      *   **Constraint:** The faculty sponsor thinks the conclusion is too strong. The user wants to keep premises (3) and (4) (the mathematical core).
      *   **Goal:** Identify the flawed step, explain why it seemed plausible, explain the cost of dropping it, and offer a weaker, more defensible conclusion.

  2.  **Deconstruct the Argument:**
