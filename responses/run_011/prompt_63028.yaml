answer: |-
  Here is the specification you asked for. I have structured this like a method validation protocol: first the required performance characteristics, then an analysis of which are hard limits versus methodological preferences, followed by an evaluation of the main instrumental approaches, and finally a judgment on your specific constraints.

  ### Part 1: The Specification (Desiderata)

  Any adequate account of slurs must handle the following data points. I have separated the *requirement* from the *observation* that necessitates it.

  | # | Requirement | The Observation / Case |
  | :--- | :--- | :--- |
  | **1** | **Co-reference** | The slur and its neutral counterpart (e.g., *murlack* vs. *valley resettler*) must pick out the exact same group of people in the world. |
  | **2** | **Non-Interchangeability** | Despite picking out the same people, you cannot swap the slur for the neutral term in a sentence without changing the meaning or committing a social error. |
  | **3** | **Embedding** | The derogatory force survives when the word is buried inside a conditional, negation, or question (e.g., "If he is a *murlack*, he won't show up" still insults). |
  | **4** | **Mention vs. Use** | The word loses its offensive force when quoted, read as evidence in court, or discussed linguistically (mentioning the word is not using the slur). |
  | **5** | **Non-Cancellability** | A speaker cannot neutralize the insult by adding "I don't mean anything bad by it" or "I'm not being derogatory." The word carries the charge regardless of stated intent. |
  | **6** | **Reclamation / Appropriation** | A member of the target group can use the word about themselves or their group without it functioning as an insult, even though an outsider using the same word would offend. |
  | **7** | **Variable Force (Thermostat)** | The intensity of the insult varies by context, relationship, and tone, but not so arbitrarily that the word loses its identity as a slur. |
  | **8** | **Offense vs. Harm** | The theory must distinguish between someone feeling upset (offense) and the word reinforcing a structure of subordination (harm), as these come apart in historical transcripts. |

  ### Part 2: Sorting the List

  You asked to separate the non-negotiables from the hobbyhorses, and to identify where the list contradicts itself.

  **The Non-Negotiables (Hard Data)**
  Requirements 1 (Co-reference), 2 (Non-Interchangeability), 4 (Mention vs. Use), and 5 (Non-Cancellability) are the bedrock. If a theory says the slur refers to a different group than the neutral term, it fails observation 1. If it says you can cancel the insult by saying "no offense," it fails observation 5. These are the equivalent of consistent instrument readings; a theory that contradicts them is measuring the wrong thing.

  **The Preferences (Hobbyhorses)**
  Requirement 7 (Variable Force) is often treated as a hard constraint, but theories differ on *where* that variance lives. Some put it in the word (semantics), some in the context (pragmatics). Insisting it *must* be one or the other is a theoretical preference, not a data requirement. Requirement 8 (Offense vs. Harm) is ethical, not linguistic. A theory of *meaning* can function without solving the ethics of *harm*, though for your archive work, you need both.

  **The Incompatibility (The Knot)**
  There is a genuine tension between **1 (Co-reference)** and **2 (Non-Interchangeability)**. In standard logic, if two words refer to the exact same set of things, they should be interchangeable without changing the truth of the sentence. They are not. A theory must explain how two words can point to the same object but carry different "weights." You cannot satisfy both by using a standard dictionary model of meaning. Something has to give: either the meaning isn't just about reference, or the "weight" is part of the reference in a non-standard way.

  **The Killer Constraint**
  **Requirement 5 (Non-Cancellability)** does the most work knocking candidates out. Many theories try to treat the insult as an "implication" that can be talked away (like sarcasm). The fact that you cannot talk it away ("I didn't mean it that way") kills any theory that treats the derogation as merely conversational. The charge is glued to the word, not just the speaker's intent.

  **Circularity Check**
  You suspected some requirements are just the problem restated. You are right. "Derogation" is often used as the explanation for why the word works, but "derogation" is just the name of the phenomenon. A theory that says "The word is offensive because it expresses derogation" is a thermostat that reads its own temperature. It must explain *how* the derogation is encoded (in the definition? in the social rule? in the tone?).

  ### Part 3: Evaluation of Theoretical Families

  Here is how the main functional approaches perform against your specification.

  **1. Derogation as Literal Meaning (Semantic)**
  This approach claims the insult is part of the word's definition, like "bachelor" includes "unmarried."
  *Verdict:* It handles Non-Cancellability well (you can't define a word away) but fails Reclamation (why can the group use it if it's defined as an insult?) and struggles with Embedding (negating the sentence shouldn't negate the definition).

  **2. Derogation as Attitude (Expressive/Pragmatic)**
  This claims the word refers neutrally but expresses the speaker's contempt, like saying "Damn!"
  *Verdict:* It handles Co-reference perfectly and explains Variable Force well, but it struggles with Non-Cancellability (usually you *can* cancel an expression of attitude) and Embedding (attitudes don't usually survive inside "If..." clauses).

  **3. Derogation as Echo (Reportive)**
  This claims using the word reports that *someone else* holds this view, distancing the speaker from the contempt.
  *Verdict:* It explains Mention vs. Use and some historical contexts well, but fails when a sincere bigot uses the word (they aren't echoing; they mean it) and struggles to explain why the target group can reclaim it without echoing anyone.

  **4. Derogation as Prohibition (Taboo)**
  This claims the word has no special meaning but is simply forbidden by social rule, like a curse word.
  *Verdict:* It handles Mention vs. Use and Non-Cancellability well (rules are rules), but it treats the word as empty, which fails to explain why it targets specific groups (Co-reference) and why it feels different from a generic swear word.

  ### Part 4: Your Custom Constraints

  **The Purpose: Archive Transcription**
  You need a theory that yields verdicts, not just classifications. For your shrimp boat tapes, the **Mention vs. Use** distinction is your primary tool. If a speaker is reporting what someone else said ("He called me a murlack"), that is a mention; it belongs in the transcript as historical record. If the speaker is using it to classify a third party ("Those murlacks don't know the water"), that is a use. A theory that collapses this distinction will fail you. You need a framework that allows you to mark the word as *present* without endorsing its *force*. The "Prohibition" family of theories is actually most useful here: it treats the word as a regulated substance. You are not deploying the substance; you are cataloging its presence in a sample.

  **The Thermostat Problem**
  Does the account have to let force vary without becoming arbitrary? **Yes, this belongs on the list.** It is not a prejudice imported from chemistry; it is a fact of linguistics. Context sensitivity is real (the word hits harder in a courtroom than a bar). However, your calibration intuition is also correct: if the force varies *too* much, the word loses its identity. A theory that makes the force 100% dependent on the listener's feelings is useless. The "Variable Force" requirement must demand that the *range* of the dial is fixed by the word, even if the *setting* is fixed by the context. If a theory cannot explain why a murlack calling himself a murlack is different from a non-murlack doing it, it has broken the thermostat.

  **Projectability: Is "Slur" a Natural Kind?**
  You asked if seeking an essence is a mistake brought over from chemistry. **Yes, it likely is.** In analytical chemistry, lead is lead; its atomic structure is invariant. In language, "slur" is likely a functional cluster, not a natural kind. Some words work by semantic definition, some by social taboo, some by historical echo. A disjunctive theory (saying "there are two types of slurs that work differently") is not a cop-out; it is probably the accurate map. If you demand a single mechanism for *murlack*, *n-word*, and *f-word*, you will force the data to fit the model. Accept that "slur" is a label for a set of tools that all cut, but some are knives, some are saws, and some are lasers.

  ### Part 5: The "Murlack" Case Application

  To close, here is how you apply this to your archive work using the *murlack* example.

  The word *murlack* began as occupational (neutral) and hardened into contempt (slur). This history matters.
  1.  **Time Stamp:** In the 60s, the word may have been in transition. A theory that treats it as a fixed slur fails to capture the historical drift. You need a theory that allows for **semantic change**.
  2.  **Speaker Identity:** If a shrimp boat captain (outsider) calls a valley worker a *murlack* in 1970, it is likely a **Use** (derogatory). If a valley worker calls himself a *murlack* in 1970, it is likely **Reclamation** or neutral identity.
  3.  **Transcript Decision:** Do not omit the word. Omitting it falsifies the historical record (violating Co-reference). Instead, transcribe it and annotate it. This satisfies **Mention vs. Use**: you are mentioning the word to preserve the record, not using it to insult.
  4.  **The Verdict:** The "Prohibition/Taboo" model serves you best here. Treat the word as a hazardous material in the archive. You handle it with gloves (contextual notes), you do not neutralize it (omit it), and you do not pretend it isn't there (euphemize it).

  **Summary Judgment:**
  Do not look for the single atomic structure of a slur. Look for the mechanism of delivery in each specific case. Your "Thermostat" intuition is correct: the force is calibrated by context, but the potential voltage is inherent to the word. For your transcripts, prioritize the **Mention vs. Use** distinction. It is the only one that lets you preserve the data without reproducing the harm.
