      *   *Check:* Did I answer the "cop-out" question about disjunctive theories? Yes, need to validate that "slur" might not be a natural kind.

  6.  **Final Review against User Prompt:**
      *   38 years chemist? Acknowledge the calibration mindset.
      *   40 pages of notes? Validate the overwhelm.
      *   Specification not candidates? Focus on desiderata first.
      *   Sort them? Non-negotiable vs. Preferences.
      *   Incompatibilities? Highlight the Co-reference/Interchangeability tension.
      *   Killer constraint? Identify it.
      *   Families evaluation? 2-3 sentences each.
      *   Thermostat problem? Judge it.
      *   Projectable kind? Judge it.
      *   Murlack example? Use it.
      *   No authors/citations? Strictly enforced.
      *   American English? Yes.

  7.  **Final Polish:** Ensure the table is clean. Ensure the "Verdict" sections are punchy. (Proceed to generate output).

  *(Self-Correction on the "Killer Constraint"):* The biggest tension is usually between *Co-reference* (they mean the same group) and *Non-Interchangeability* (they mean different things). If meaning = reference, they should be interchangeable. They aren't. So meaning ≠ reference. This is the core philosophical knot. I need to make sure this is clear.

  *(Self-Correction on "Thermostat"):* The user is asking if context-sensitivity is a bug or a feature. In pragmatics, it's a feature. In semantics, it's a bug. I need to tell him that expecting a fixed "force value" like a chemical concentration is the category error, not the theory.

