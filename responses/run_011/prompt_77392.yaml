answer: |-
  **Scenario**
  The Ogunquit Coastal Water Authority must decide whether to activate an emergency desalination bypass that injects chemically treated brine back into the local estuary to prevent hydraulic collapse of the municipal wellfield. The mechanism of collapse is understood (pressure differential), but the critical threshold depends on unpredictable winter recharge rates, rendering the probability of collapse within the next five years scientifically indeterminate, though budgetary protocols require an elicited estimate of 3%. If collapse occurs, the wellfield is lost permanently, costing $500 million to replace with pipeline infrastructure. Activating the bypass causes known, localized hypoxia in the estuary, killing the seasonal lobster fishery valued at $10 million; this harm is fully reversible because the estuary flushes naturally within two tidal cycles, and the fishery recovers within one breeding season (12 months) at a compensatory cost of $2 million paid to identifiable license holders. The bypass activation itself costs $25 million in operational expenditure.

  **The Check**

  **Expected Value Calculation:**
  To compute expected value, the regulator must use the elicited probability despite its scientific fragility.
  *   **Expected Benefit of Intervention:** 0.03 (probability of collapse) × $500,000,000 (loss avoided) = $15,000,000.
  *   **Certain Cost of Intervention:** $25,000,000 (operations) + $2,000,000 (compensation) = $27,000,000.
  *   **Net Expected Value:** $15,000,000 − $27,000,000 = −$12,000,000.
  *   **EV Verdict:** **Refuse Intervention.** The certain cost exceeds the probabilistically weighted benefit.

  **Precautionary Verdict:**
  The verdict is **Authorize Intervention**. The clause carrying the case is the **Irreversibility Asymmetry** (often coupled with the treatment of uncertainty as distinct from risk). Standard risk assessment treats the 3% probability as commensurable with the costs, but the Precautionary Principle (PP) distinguishes between the *uncertain* threat of irreversible loss (the wellfield) and the *known* threat of reversible loss (the fishery). Because the harm of inaction involves a structural, permanent loss under conditions of deep uncertainty (no defensible point probability), while the harm of action is temporary, compensable, and reversible, the PP shifts the burden of proof to the proponents of inaction. Since they cannot prove the wellfield is safe from collapse, the PP mandates avoiding the irreversible outcome.

  **Single Feature Doing the Work:**
  The **Irreversibility of the Inaction Harm**. If this feature is removed—for example, if geological surveys confirmed the wellfield could be restored via artificial recharge within five years at a known cost—the asymmetry vanishes. Both sides would present reversible, monetizable harms. In that modified scenario, the PP loses its traction and defaults to the expected value calculation (Refuse), aligning with the EV verdict. The irreversibility is the necessary condition for the PP to override the arithmetic.

  **Opponent Attack:**
  The strongest attack is that **the precautionary reading has quietly substituted its own probability distribution for the elicited one.** The opponent argues that by treating the 3% elicited probability as "insufficient" to justify inaction, the regulator is implicitly acting as if the probability is much higher (e.g., >5.4%, where $500M × p > $27M). This reduces the decision to a dispute over numbers (probability elicitation) rather than a distinct decision rule. The opponent claims the PP is merely "Expected Value with Pessimistic Bias."

  **Evaluation of Attack:**
  This attack **fails**. It misunderstands the normative function of the Precautionary Principle in this context. The PP does not assert the probability is higher; it asserts that under deep uncertainty (where the probability is scientifically indeterminate), the *validity* of using a point estimate for irreversible stakes is null. It is a lexical constraint on the admissibility of the calculation, not a re-weighting of the variables. If the attack succeeded, all decision rules under uncertainty would collapse into Expected Value, denying the possibility of uncertainty aversion as a rational stance distinct from risk aversion. The PP here functions as a tie-breaking rule based on the *quality* of the evidence (reversible/known vs. irreversible/uncertain), not a hidden adjustment of the *quantity* of risk.
