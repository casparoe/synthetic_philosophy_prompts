answer: |-
  This is a classic frustration in philosophy of mind seminars. The phrase "consciousness is an illusion" is a homonym: it sounds like one claim, but it does very different work depending on which metaphysical layer you apply it to. Your professor is likely sliding between two distinct versions to win both points.

  Here is the menu of interpretations, sorted from deflationary to radical, evaluated against your criteria.

  ### The Menu: What "Consciousness is an Illusion" Could Mean

  #### 1. The Epistemic Illusion (Deflationary)
  *   **What is the illusion?** Our *introspective access*. We think we know our minds directly and infallibly, but we don't. The states exist, our knowledge of them is flawed.
  *   **Coherence:** Coherent. Compatible with standard cognitive science.
  *   **Mary Case:** **No.** Mary still learns *what it is like*. Even if her introspection was previously flawed, she now has the experience. The Knowledge Argument survives.
  *   **"Illusion requires experiencer" Objection:** **Fails.** Since the states are real, there is still something "being-appeared-to."
  *   **Verdict:** Too weak for your professor's purposes.

  #### 2. The Property Illusion (Dennettian)
  *   **What is the illusion?** The *qualitative properties* (qualia). Experiences exist, but they lack the intrinsic, ineffable, private "glow" we think they have. They are just functional states we *judge* to have those properties.
  *   **Coherence:** Mostly coherent, though critics argue it changes the subject.
  *   **Mary Case:** **Yes (mostly).** Mary isn't learning a new fact about the world; she is acquiring a new *mode of presentation* or a new capacity to discriminate. She learns to "misdescribe" a physical state as phenomenal.
  *   **"Illusion requires experiencer" Objection:** **Fails.** This is the trap. If the functional states are real (which they must be for her to misdescribe them), then *something* is still happening. The student's objection ("something has to be being-appeared-to") still sticks, because the "appearing" is just the functional state operating.
  *   **Verdict:** Fits the Mary move, fails the Experiencer move.

  #### 3. The Subject Illusion (No-Self)
  *   **What is the illusion?** The *subject* of experience. Experiences happen, but there is no "I" having them. (Hume, Buddhism, Parfit).
  *   **Coherence:** Coherent, but metaphysically heavy.
  *   **Mary Case:** **No.** Even if there is no "self," there is still "what it is like." Mary still gains the phenomenal knowledge.
  *   **"Illusion requires experiencer" Objection:** **Yes.** It dissolves the objection by denying the "experiencer."
  *   **Verdict:** Fits the Experiencer move, fails the Mary move.

  #### 4. Hard Illusionism (Eliminativism about Phenomenality)
  *   **What is the illusion?** *Phenomenal consciousness itself.* There is no "what it is like." There are only physical/functional states that *represent* themselves as having phenomenal properties. (Keith Frankish, early Dennett).
  *   **Coherence:** **High Risk.** Critics argue it is self-undercutting (to be an illusion, it must appear to exist; if it appears to exist, phenomenal consciousness exists).
  *   **Mary Case:** **Yes.** There is no phenomenal fact to learn. Mary only acquires a new false belief (or a new functional capacity) about her physical state.
  *   **"Illusion requires experiencer" Objection:** **Yes.** Since phenomenal experience doesn't exist, nothing is "being-appeared-to" in the phenomenal sense. The "illusion" is a cognitive judgment, not a felt experience.
  *   **Verdict:** Fits both moves, but carries a heavy coherence cost.

  ---

  ### Diagnosing Your Professor's Moves

  Your professor is making two distinct moves that require two different levels of the menu:

  1.  **The Mary Move:** *"She's just acquiring a new way of misdescribing states she already had."*
      *   This requires **Level 2 (Property Illusion)**. It admits states exist ("states she already had") but claims the phenomenal description is wrong.
  2.  **The Experiencer Move:** *"I've already handled that [something has to be being-appeared-to]."*
      *   This requires **Level 4 (Hard Illusionism)**. To truly "handle" the objection that illusions need an experiencer, you must deny that the *experience itself* is real. If you admit the states are real (Level 2), the student is right: something is being appeared to.

  **The Diagnosis:** He is equivocation between Level 2 and Level 4. He wants the ontological safety of Level 2 (states exist, so we aren't crazy) but the argumentative power of Level 4 (phenomenality doesn't exist, so the Knowledge Argument fails).

  ### The Missing Premise

  No single reading licenses both moves cleanly without a specific technical distinction. To make his argument hold water, he needs to smuggle in the **Phenomenal/Access Distinction**.

  He needs to assert this premise explicitly:
  > **"We must distinguish between *Access Consciousness* (functional states available for report) and *Phenomenal Consciousness* (the felt quality). Access states are real; Phenomenal properties are the illusion."**

  *   **How this saves the Mary Move:** Mary already had the *Access* states (she knew everything physical). She thinks she is learning a *Phenomenal* fact, but she is only acquiring a new Access relation to the old state.
  *   **How this saves the Experiencer Move:** When the student says "something must be being-appeared-to," the professor can say: "Access states are being processed, but nothing is *phenomenally* being-appeared-to. The 'feeling' of being-appeared-to is the illusion."

  ### Office Hours Strategy

  Don't ask "What do you mean?" (he will repeat the slogan). Ask him to locate his view on the menu.

  **Script:**
  > "I'm trying to map your 'illusion' claim to the standard taxonomy. When you say Mary is 'misdescribing states she already had,' that sounds like **Property Illusionism** (Level 2). But when you dismiss the 'experiencer' objection, that sounds like **Hard Illusionism** (Level 4).
  >
  > If it's Level 2, the student is right that functional states still exist to be 'appeared to.' If it's Level 4, your claim that Mary 'had the states' seems false—she only had the *physical* correlates, not the phenomenal states.
  >
  > **Are you relying on the distinction between Access and Phenomenal consciousness to bridge that gap? Or do you think the 'feeling' of the illusion doesn't require a phenomenal subject?**"

  **Why this works:**
  1.  It shows you've done the reading (Access vs. Phenomenal).
  2.  It forces him to admit he is sliding between the two levels.
  3.  It isolates the "missing premise" (that the *feeling* of the illusion is just a functional judgment, not a phenomenal fact).

  If he says "Yes, that's it," you have your answer: He is a **Quasi-Realist Illusionist** (Frankish style). If he says "No, it's simpler than that," he is likely glossing over the incoherence of Hard Illusionism.
