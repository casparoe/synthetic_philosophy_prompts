      *   Move 2 (Experiencer) requires Level 4 (Hard Illusionism) or a very strong Level 3.
      *   Level 2 *cannot* handle Move 2. If states exist (Level 2), something is being appeared to.
      *   Level 4 *can* handle both, but it makes Move 1 slightly awkward (she's not misdescribing states she *had*, she's acquiring a false belief about states that *don't exist phenomenally*).
      *   *Diagnosis:* The professor is likely sliding between Level 2 and Level 4. To make it work, he needs the premise: "The 'states' Mary had are purely functional/physical; the 'phenomenal' aspect she thinks she learns is a false cognitive construct."

  7.  **Refining the Output:**
