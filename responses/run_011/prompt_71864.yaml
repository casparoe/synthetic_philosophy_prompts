answer: |-
  (i) **Prediction**
  I predict he will verdict **Not a Cause**. Confidence is high (approx. 90%). The single consideration moving me is the contrast between Case 4 (Cleaner) and Case 3 (Nurse). Both involve able agents where counterfactual dependence holds cleanly. The differentiator is institutional role. Since the visiting researcher lacks even the cleaner's proximity to the ward (having no role whatsoever), he falls squarely into the Class 7 (Bystander) category. The leader's explicit discomfort with normative accounts suggests he will frame this as the visitor not being part of the "causal system," but the extensional outcome will match the duty-based pattern.

  (ii) **Candidate Principles**
  1.  **Normative Restriction:** Omissions cause only if the agent breached a specific duty or undertaking.
      *   *New Case:* Not a Cause.
      *   *Fit:* Explains 1, 3, 5, 6 (Affirmative) vs 4, 7 (Negative) effortlessly.
      *   *Bend:* Contradicts his stated anti-normative orientation; requires treating contracts as causal relata.
  2.  **Process Continuity:** Omissions cause only if they interrupt an existing, automated causal process assigned to the agent.
      *   *New Case:* Not a Cause (no prior process assigned to him).
      *   *Fit:* Explains 6 (valve) and 5 (generator test) well.
      *   *Bend:* Struggles with 1 (plants don't auto-water) and 3 (meds are static until given); requires stretching "process" to include static duties.
  3.  **Contrastive Salience:** Causation selects the deviation from a contextually normal background.
      *   *New Case:* Not a Cause (visitor acting normally by leaving).
      *   *Fit:* Explains 7 (bystanders normal) vs 1 (caretaker leaving abnormal).
      *   *Bend:* Risks making causation too subjective; doesn't explain why 4 is less salient than 3 without invoking norms.
  4.  **Eliminativism:** Omissions never literally cause; affirmative verdicts track blame, not ontology.
      *   *New Case:* Not a Cause (literally true).
      *   *Fit:* Consistent with all verdicts if treated as pragmatic shorthand.
      *   *Bend:* He affirms causation in 1, 3, 5, 6 literally, not merely as blame-tracking; he wants causation to be worldly.

  (iii) **The Bet**
  I bet on **Normative Restriction**, disguised as **Contrastive Salience**. This best explains the pattern because it accounts for the sharp split between Case 3 (Nurse) and Case 4 (Cleaner) despite identical counterfactuals. Purely physical principles (like Process Continuity) cannot distinguish them; only the agent's integration into the institutional structure does. This handles his tension by treating "norms" as worldly facts about system design: a nurse is a functional component of the ward's safety system, a cleaner is not. He resolves the tension by naturalizing the norm: obligations are simply specifications of what counts as "normal functioning" for that agent within that system. Thus, causation remains worldly (tracking system function) while verdicts track duty.

  (iv) **The Test Case**
  **The Unnotified Warden:** A staff member's contract includes a clause making them a fire warden, but they were never informed of this clause and received no training. A fire starts; they could have led evacuation but did not, assuming it was someone else's job.
  *   **Normative Restriction:** **Cause.** The duty exists objectively in the contract regardless of knowledge.
  *   **Contrastive Salience (Psychological):** **Not a Cause.** Their behavior was normal relative to their epistemic state; no deviation from *their* expected conduct occurred.
  This separates whether the "system specification" is objective (contract text) or subjective (agent's understanding of their role).

  (v) **Implications of Denial**
  If he denies causation, he owes us an account of explanation that excludes the visitor. He must say the fault alone caused the deaths. He can maintain the visitor did nothing *wrong* (no obligation) or that they did something wrong but not *causally* efficacious (moral blame without causal blame). The cost is severing the link between causal and explanatory relevance. He must accept that the death is fully explained by the mechanical fault, rendering the visitor's presence and choice explanatorily inert. This weakens the utility of causation in historical explanation, forcing him to admit that some human choices are causally invisible even when they determine outcomes.

  (vi) **Instability in the Record**
  The record is unstable regarding **Case 6 (Operator)** versus **Case 4 (Cleaner)** given his **Anti-Normative Stance**.
  *   **Conflict:** Case 6 is affirmative; Case 4 is negative. Physically, both involve a human intervening to stop a threat. The only difference is the job description.
  *   **Cost:** To keep both verdicts, he must admit causation turns on normative status (contradicting his orientation). To keep his orientation, he must treat the Operator and Cleaner identically (contradicting his verdicts). He cannot have a worldly relation that distinguishes two physically identical interventions based solely on contract status without smuggling norms into the world. He must either drop the anti-normative claim or flip the verdict on 4.
