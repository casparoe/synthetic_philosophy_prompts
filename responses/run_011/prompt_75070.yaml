  ### The Hidden Assumption in Good's Theorem

  Good's Theorem is standard fare: for a Bayesian expected utility maximizer, free information is never negatively valuable. The proof is elegant—maximizing after averaging yields higher expected utility than averaging before maximizing. But this elegance conceals a structural fragility. The theorem holds only if the evidence is **decision-independent**. Specifically, it assumes that the probability distribution over states, conditional on the evidence, remains invariant regardless of which act the agent selects after observing that evidence. When evidence bears on the agent's own dispositions—predicting the act rather than merely the state—this invariance collapses. The agent's choice updates the state probabilities via evidential correlations, potentially steering them into a lower-utility region than if they had remained ignorant.

  ### The Counterexample: The Self-Undermining Report

  Consider an agent facing a investment decision. There are two acts: **Conservative** ($a_1$) and **Aggressive** ($a_2$). There are two states: **Favorable** ($s_1$) and **Unfavorable** ($s_2$). The agent has access to a costless report ($E$) from an imperfect predictor of their own behavior. The predictor is 90% accurate regarding which act the agent will ultimately choose. Crucially, the agent's disposition to choose Aggressive is causally correlated with the Unfavorable state (e.g., overconfidence in bad markets).

  **Utilities:**
  *   $U(a_1, s_1) = 50$, $U(a_1, s_2) = 50$ (Safe return).
  *   $U(a_2, s_1) = 100$, $U(a_2, s_2) = 0$ (High risk).

  **Prior Probabilities:**
  *   $P(s_1) = 0.5$.
  *   Disposition correlation: $P(s_1 | a_2) = 0.2$, $P(s_1 | a_1) = 0.8$.
  *   Predictor accuracy: $P(E=\text{pred } a_2 | a_2) = 0.9$.

  **Blind Decision:**
  The agent calculates expected utility based on priors.
  $EU(a_1) = 50$.
  $EU(a_2) = 0.2(100) + 0.8(0) = 20$.
  The agent chooses **Conservative**. **Ex Ante EU = 50.**

  **Look Then Decide:**
  The agent opens the envelope.
  *   **Case 1: Report predicts Aggressive ($E_2$).**
      The agent updates on $E_2$. Since $E_2$ predicts $a_2$, and $a_2$ correlates with $s_2$, the posterior $P(s_1 | E_2)$ drops to roughly 0.2.
      $EU(a_2 | E_2) = 20$. $EU(a_1 | E_2) = 50$.
      The agent switches to **Conservative**. Payoff = 50.
  *   **Case 2: Report predicts Conservative ($E_1$).**
      The agent updates on $E_1$. This predicts $a_1$, correlating with $s_1$. Posterior $P(s_1 | E_1)$ rises to 0.8.
      $EU(a_2 | E_1) = 80$. $EU(a_1 | E_1) = 50$.
      The agent switches to **Aggressive**.
      *Here lies the trap.* By switching to Aggressive based on the "good news" of $E_1$, the agent breaks the correlation that made the news good. The state was favorable *because* they were disposed to be Conservative. By acting Aggressively, they enter the state distribution associated with Aggression ($P(s_1)=0.2$).
      Realized Payoff = 20.

  **Agent's Ex Ante Calculation:**
  A sophisticated Bayesian recognizes that choosing $a_2$ upon seeing $E_1$ invalidates the probability estimate used to justify it. Anticipating this instability, the agent calculates the expected utility of looking as a weighted average of the *stable* outcomes.
  $EU(\text{Look}) = 0.5(50) + 0.5(20) = 35$.
  Since $35 < 50$, the agent strictly prefers **Decide Now**.

  **Outside Evaluation:**
  An evaluator weighting outcomes by the unconditional frequency of states ($P(s_1)=0.5$) sees that the information *could* have guided a causal intervention. If the agent could have committed to $a_2$ only when $s_1$ was objectively true (independent of disposition), the value would be higher. However, in this specific setup, the "Outside Ranking" is ill-defined without a causal model. The nearest equivalent is the **Causal Expected Utility**, which screens off the evidential correlation. Under CDT, $P(s_1 | do(a_2)) = 0.5$.
  $CDT(a_2) = 50$. $CDT(a_1) = 50$.
  The information allows the agent to coordinate with the predictor. If the predictor is accurate, looking yields a higher frequency of matching the state *if* the agent treats the prediction as a causal signal (which they shouldn't). The genuine self-harm is that the agent's rational refusal to look prevents them from exploiting the predictor's accuracy, leaving value on the table that a causal agent might capture.

  ### Where the Proof Fails

  The standard proof of Good's Theorem relies on the inequality:
  $$ \sum_e P(e) \max_a \sum_s P(s|e) U(a,s) \geq \max_a \sum_s P(s) U(a,s) $$
  This step assumes $P(s|e)$ is the correct probability weighting for the utility of act $a$ *chosen after seeing* $e$. In decision-dependent cases, the relevant probability is $P(s|e, a)$. When $P(s|e, a) \neq P(s|e)$, the term inside the maximization does not represent the true expected utility of the act in that context. The convexity argument holds for the mathematical expression, but the expression no longer maps to the agent's realized welfare.

  ### The CDT Objection

  Your colleague argues that Causal Decision Theory (CDT) restores the theorem. This is technically correct but misses the thesis's punch. Good's Theorem is historically and standardly presented as a result for "Bayesian rational agents," implying probabilistic coherence and conditionalization (EDT). If the theorem requires the additional machinery of causal counterfactuals to hold, then the standard statement is incomplete. The thesis is not that CDT is wrong, but that the *theorem as usually taught* hides a causal independence assumption within a probabilistic proof. Acknowledging this doesn't save the theorem; it restricts its domain to causal agents, which is a significant substantive constraint often omitted in graduate seminars.

