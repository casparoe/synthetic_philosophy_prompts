prompt: |-
  I teach a graduate decision theory seminar and next week we hit the dynamic material — sequential choice, the value of information, that whole area. I want to hand the students something with more bite than the usual gloss on Good's theorem, so I'm going to give them a thesis to attack or defend, and I'd like you to write the defence. The thesis is mine, and a colleague I ran into in the corridor thinks it's confused, so please be rigorous rather than diplomatic. Here it is roughly: for a Bayesian expected utility maximiser, evidence that's costless and has no side effects on the decision problem is always worth waiting for, because maximising-then-averaging beats averaging-then-maximising over the partition the evidence induces — everyone grants that, and it's the standard proof. My claim is that the theorem still doesn't deliver the slogan even when you grant every hypothesis that normally gets listed, because there's an extra assumption doing quiet work that almost never gets stated: that the evidence is decision-independent, meaning the agent's posterior over the states given the evidence doesn't shift with which act she ends up taking. Savage is at least explicit that the states had better not depend on the acts; Good's theorem seems to inherit that silently. And the moment the free evidence bears on the agent's own choice — a sealed prediction of what she'll do, a report written by someone who knows her dispositions better than she does, that kind of thing — the two policies your supposed to compare are no longer scored with a common probability weighting, and an expected utility maximiser who conditionalises can end up worse off, by her own lights, for having looked.

  So build me the case. I want a fully specified example with real numbers: acts, evidence cells, a joint distribution, utilities. Use an imperfect predictor rather than a perfect one — the perfect version invites the objection that the whole setup is incoherent, and I don't want to lose the seminar to that. I tried filling in numbers on the train and got the two rankings to come out equal, so I probably botched it; do it properly. Then give me the two rankings side by side: first the agent's own ex ante calculation, showing she strictly prefers "decide now, don't open the envelope" to "open the envelope, then decide"; second, an outside evaluation that weights outcomes by the unconditional probability of what's in the envelope, showing that opening it would actually have been better for her, so her refusal is genuine self-harm rather than a bookkeeping artefact. If you think that second ranking isn't well defined in a setup like this, say so plainly and give me the nearest thing to it — I'd much rather have the caveat than a fudge. And point to the specific line of the standard proof where things stop going through: what is the max-then-average inequality entitled to here, and what does it stop being entitled to once the evidence is correlated with the act?

  Two more things. My colleague's line is that this only shows evidential decision theory is broken, and that a causal decision theorist gets the theorem back intact — deal with that head on, because if he's right the interesting conclusion is about one bad decision theory rather than about the theorem's hypotheses, and my thesis loses its punch. And if you think I'm wrong somewhere in the above, tell me where instead of quietly repairing my argument; I still want the strongest version of it you can manage.

  Deliverable: the argument in prose, headings welcome, somewhere around 900 to 1400 words, and then a JSON object at the end with exactly these fields — "thesis" (one sentence, the claim being defended); "hidden_assumption" (the unstated hypothesis you're targeting); "assumptions_audit" (array of objects, each with "assumption", "granted_in_my_case" as a boolean, and "why_it_matters"); "case" (object with "acts", "evidence_cells", "joint_distribution", "utilities" — spell the numbers out so I can check them on the board); "eu_decide_now" and "eu_look_then_decide" (the agent's own ex ante figures); "outside_ranking" (object with "value_of_not_looking", "value_of_looking", "well_defined" as a boolean, and "caveat"); "proof_step_that_fails"; "cdt_reply" (your answer to my colleague); "confidence" (high, medium, or low); and "biggest_worry" (the objection you'd press if you were sitting in my seminar).
