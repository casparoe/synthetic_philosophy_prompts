answer: |-
  Here is the translation of Donald Davidson's radical interpretation project into your craft vocabulary, followed by the residue report you requested.

  ### The Translation

  Imagine you are handed a manuscript written in a language you do not speak, by an author you cannot contact. There is no introduction, no character list, no interior access. You have only the **behaviour-only draft**: marks on a page representing sounds and gestures, situated in described contexts. Your task is to write the **interior access** layer. You must decide what the characters mean by their noises, what they believe about the world they inhabit, and what they desire to achieve.

  Davidson's radical interpretation is the rulebook for this task. It begins with the observation that you cannot pin down meaning, belief, and desire independently. If a character points at a rabbit and makes a sound, you cannot know if they mean 'rabbit', 'undetached rabbit part', or 'food' without knowing what they believe is happening and what they want. These three elements are tied in a knot. To loosen one, you must adjust the others. This is holism. In your terms, you cannot assign a thought to a character unless that thought makes sense of their gestures *and* fits with the other thoughts you have already assigned them.

  To untie the knot, you must spend **charity**. But here, charity is not a budget you manage; it is the currency you must spend to buy the character into existence. You must assume the character is largely rational and largely correct about their immediate environment. If you interpret their behaviour as revealing massive confusion or constant falsehood, you haven't written a complex person; you have failed to interpret them at all. They cease to be a speaker and become noise. For Davidson, maximizing charity isn't an aesthetic choice to make them likable; it is the precondition for them having a mind.

  There is a worry here: is the interpretation underdetermined? Could you write two different interior access drafts that both fit the behaviour-only draft perfectly? Davidson acknowledges this but argues that if two interpretations work equally well, there is no fact of the matter about which is 'true'. The character *is* the interpretation.

  Later, Davidson introduces the **omniscient interpreter**. Imagine a being who knows all the truths of the world and interprets the character. If this being can interpret the character, the character's beliefs must largely match the world's truth (because the omniscient being knows the truth and must assume charity to interpret). This guarantees that thought is essentially truthful.

  Finally, there is **triangulation**. A single character alone in a void cannot have thoughts about objects. You need two creatures and a shared object. Character A reacts to the object; Character B reacts to the object; A reacts to B's reaction. Meaning emerges at the apex of this triangle. Without the second creature to correct or confirm the focus, the first creature's gestures are just causal reflexes, not signs carrying meaning.

  ### The Residue Report

  **1. Clean Translates**
  The holism of belief, desire, and meaning translates cleanly into your workflow. You already know that you cannot fix a character's motivation (desire) without checking if it aligns with their actions (behaviour) and their understanding of the scene (belief). If a character runs from a room (behaviour), you cannot assign the thought 'I am scared' (interior) if earlier drafts established they are brave (belief network) unless you adjust the network (perhaps they are protecting someone). Davidson's claim that these elements are mutually constitutive matches your experience of drafting: change one sentence of dialogue, and the character's entire history shifts weight. The requirement that interpretation must render the speaker intelligible also maps well to your rule that interior access must be inferable from behaviour. If the thought isn't in the action, you cut it.

  **2. Distorted Translates**
  The concept of **charity** translates only with significant distortion. In your framework, the **charity budget** is a variable resource. You can spend it lavishly on a protagonist to allow them contradiction and self-deception, or withhold it from a minor character to make them opaque or functional. You can choose to make a character irrational, provided you signal it sufficiently. For Davidson, charity is not a budget; it is a threshold. You cannot choose to interpret a speaker as largely irrational. If you do, you haven't interpreted them; you've dismissed them. The distortion lies in agency: you view charity as a tool the author wields over the text; Davidson views it as a law the interpreter obeys to find the text.

  The **omniscient interpreter** also distorts. For you, the author *is* the omniscient interpreter. You know what is in the head. For Davidson, the omniscient interpreter is a thought experiment to prove that belief is veridical. He uses the figure to constrain truth; you use the figure to create it. When you decide a character is self-deceived, you are asserting a truth they cannot access. Davidson would argue that if the self-deception is too radical, the attribution of belief collapses.

  **3. No Counterpart**
  Your suspicion is correct. The **constitutive claim** has no counterpart in your framework. You operate on the assumption that there is a determinate inner life behind the behaviour-only draft, waiting to be revealed or concealed. The draft hides the truth; it does not create it. For Davidson, there is no 'inner life' prior to successful interpretation. The mind is not a private theatre you are granting the reader tickets to; the mind is the public pattern of behaviour successfully interpreted under the constraint of charity.

  This is a real difference, not a collapse under pressure. You are an ontological realist about character states (they exist independently of the reader's grasp); Davidson is an interpretivist (they exist *in* the reader's grasp). If a reader fails to interpret your character charitably, you say the reader failed. Davidson says if a interpreter cannot interpret charitably, the speaker lacks propositional thought. You believe in the ghost in the machine; Davidson believes the machine's operation *is* the ghost.

  **4. Novelist's Richness**
  Your vocabulary is richer in three specific areas that put pressure on Davidson.
  First, **authorial omniscience**. You can write a character who is fundamentally misunderstood by everyone in the book, yet known fully by the reader. Davidson's triangulation suggests meaning requires a community of interpreters. Your novel allows for a private meaning known only to the author and the reader, bypassing the other characters. This challenges Davidson's claim that meaning is essentially public.
  Second, **withheld charity**. Readers often refuse charity on principle (e.g., reading an unreliable narrator or a villain). They understand the character precisely by diagnosing their irrationality. Davidson struggles to account for how we identify error without assuming overall truth. Your craft handles this daily: we recognise madness by contrasting it with sanity, not by assuming the madman is mostly right.
  Third, **free indirect style**. When the narrator's idiom bleeds into the character's, the 'behaviour-only' distinction collapses. Whose voice is it? Davidson requires a distinction between the interpreter and the speaker. Your style dissolves this boundary, creating a hybrid consciousness that Davidson's binary setup cannot easily categorise.

  **5. Smuggled Assumptions**
  I caught myself smuggling your assumption in the translation of the **behaviour-only draft**. I described it as containing 'nothing but what a camera and a microphone could catch', implying a neutral record of physical events. I then treated the **interior access** as a layer added on top. This presumes the behaviour exists independently of the interpretation.
  Davidson argues the opposite. There is no 'behaviour' that is not already laden with intention. A hand raising is not a muscle contraction until it is interpreted as a wave. By positing a draft that is purely physical, you assume a world of brute facts prior to meaning. Davidson argues there are no brute facts of human action; there are only interpreted actions. Your framework assumes the inner life is hidden; Davidson argues the inner life is constituted by the outer interpretation. I presented his view as if it were compatible with your realist ontology, when it is actually incompatible.

  ### The Verdict

  Where the translation breaks down, it is because your craft vocabulary is missing a distinction that only comes into focus once you have it: the distinction between *describing* a mind and *constituting* a mind.

  Your version is a cheat. It is a useful, necessary cheat for writing fiction, but a cheat nonetheless. You assume the character exists before the reader arrives. You assume there is a 'true' version of the character in your head that the text approximates. Davidson argues that there is no 'true' version independent of the interpretive scheme. When you say a reader has 'misread' your character, you are appealing to your private authority as the creator. Davidson would say that if the text supports the reading under the principle of charity, the reading is valid, and your private intention is irrelevant.

  The residue is exactly where the sound and the substance come apart. Davidson is not offering a method for writing better characters; he is offering a metaphysical account of what thought *is*. Your framework is epistemological and aesthetic (how do we know and show what is in a mind?); his is ontological (what must be the case for there to be a mind at all?).

  You can keep your charity budget. It is excellent craft advice. But do not mistake it for philosophy. Your budget implies you can spend less charity and still have a person, just a harder one to read. Davidson says if you spend less than the maximum, you eventually stop describing a person and start describing a broken thing. The breakdown occurs because you believe in the secret interior; he believes the interior is public property. If you accept his view, your 'behaviour-only draft' is not a draft hiding the truth; it is the only truth there is. That would make your job impossible. So you must remain a cheat. You must pretend the ghost exists before the machine starts moving. Davidson says the ghost is the movement.
