answer: |-
  ### The Menu of Claims

  Here are the three distinct claims hidden inside your consultant's complaint. They range from a boring linguistic point to a genuine scientific misunderstanding.

  **1. The Semantic Reading (Trivial)**
  *   **The Claim:** If you define "fittest" strictly as "those who leave the most offspring," then "the fittest leave the most offspring" is true by definition.
  *   **Commitment:** This commits you to nothing about the world. It is a statement about how English words relate to each other, not how biology works.
  *   **Status:** **Platitude.** It is technically true if you accept that sloppy definition.
  *   **Settled by:** Dictionary agreement. Biologists generally agree the phrase "survival of the fittest" is linguistically clunky, which is why they rarely use it in papers.

  **2. The Methodological Reading (Live Worry)**
  *   **The Claim:** If fitness is *only* measured by counting offspring after the fact, we cannot use it to predict anything. A theory that only explains the past is not scientific.
  *   **Commitment:** This commits you to the idea that biology is merely descriptive history, not predictive science.
  *   **Status:** **Resolved Mistake.** This was a live worry in the mid-20th century, but modern genetics settled it. We measure fitness via *proxies* (metabolic efficiency, camouflage, mating displays) independent of actual reproductive success. We predict who *should* survive based on traits, then check if they do.
  *   **Settled by:** Empirical success. We predict allele frequency changes in populations (e.g., antibiotic resistance) before they happen.

  **3. The Explanatory Reading (False)**
  *   **The Claim:** Because the core principle is abstract, it cannot explain specific outcomes (like why humans fear snakes or prefer sugar).
  *   **Commitment:** This commits you to the idea that general laws cannot explain specific instances (i.e., gravity is too abstract to explain why this apple fell).
  *   **Status:** **False.** A general mechanism (selection) constrains specific hypotheses (adaptations). If a trait reduces survival, selection says it shouldn't spread. That is an explanation.
  *   **Settled by:** Logic. The consultant is confusing the *engine* with the *vehicle*.

  ### What Nadia Can Concede

  Nadia can—and should—concede **Reading 1 (Semantic)** outright.

  A confident scientist doesn't fight over a catchphrase. She can admit that "survival of the fittest" is a tautology if defined poorly. It costs her nothing. Population genetics relies on mathematical models of gene frequency, not Victorian slogans. If she concedes the phrase is empty, she isolates his attack to a slogan he read in a magazine, protecting the actual math she uses.

  **What she cannot concede:** She cannot concede that *fitness* is defined solely by survival (Reading 2). If she admits fitness is just a post-hoc label for survivors, she admits biology cannot make predictions. She must hold that fitness is a property of traits, measurable before reproduction occurs.

  ### The Jump: From Tautology to Behavior

  The consultant is leaning on **Reading 3 (Explanatory)** when he jumps to evolutionary psychology. He argues: *Because the engine is empty (tautology), the vehicle's destination (human behavior) cannot be derived from it.*

  **Does this step follow?**
  No. It is a category error.
  1.  **If** natural selection were a pure tautology (empty), it could generate no specific predictions about human nature. In that case, evolutionary psychology would be impossible, not nonsense.
  2.  **If** evolutionary psychology makes specific claims (e.g., "humans are adapted to prefer calorie-dense foods"), those claims are testable and falsifiable. If they are wrong, the theory is testable.

  He is swapping definitions mid-argument. He treats natural selection as **empty** when defending his philosophical critique (it says nothing), but treats it as **substantive** when attacking evolutionary psychology (it says too much/wrong things). You cannot claim a theory is vacuous and then complain that it is dangerous.

  ### Popper and Unfalsifiability

  You heard correctly, roughly. Popper initially worried that natural selection was a "metaphysical research programme"—a framework that organizes thinking rather than a testable law like gravity. He was concerned that biologists could always invent a "just-so story" to explain why a trait survived, making the theory unfalsifiable.

  He later softened this, acknowledging that when specific traits and environmental pressures are specified, the theory becomes highly testable (and falsifiable).

  **Is "Unfalsifiable" the same as "Tautological"?**
  No, though they overlap.
  *   **Tautological:** True by definition (e.g., "All bachelors are unmarried"). Cannot be false.
  *   **Unfalsifiable:** No observation could prove it wrong (e.g., "There is an invisible dragon in my garage"). Could be false, but you can't check.

  All tautologies are unfalsifiable, but not all unfalsifiable claims are tautologies. The consultant is conflating them. He thinks that because the *core principle* is hard to falsify (or tautological), the *specific claims* derived from it (evo psych) are also shielded from criticism. The opposite is true: if the core principle is empty, the specific claims have no support. If the specific claims are supported, the core principle is not empty.

  ### The Line

  Nadia needs to trap him in his own contradiction. He wants the theory to be empty (so it's not science) and substantive (so it's bad science). She needs to force him to choose.

  **The Line:**

  > "You're arguing that natural selection is a tautology, which means it says nothing. But you're also complaining that it's being used to justify specific claims about human nature. It can't be logically empty and empirically dangerous at the same time. Decide if my field is useless, or if it's wrong."

  **Why this works:**
  1.  **It accepts his premise:** She doesn't fight the "tautology" point immediately.
  2.  **It exposes the swap:** It highlights that he is treating the theory as "nothing" and "something" simultaneously.
  3.  **It's unkind:** It questions his basic logical consistency, which is insulting to a strategy consultant who prides himself on reasoning.
  4.  **It's accurate:** It forces him to admit that if Evo Psych is nonsense, it's because it made testable claims that failed, which proves the underlying science is testable (not a tautology).
