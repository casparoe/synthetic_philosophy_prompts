prompt: |-
  I'm writing a novel and there's a dinner-party scene I keep having to rewrite because I honestly don't know who's right in it.

  Setup: Nadia, my main character, is a population geneticist, mid-career, prickly. Across the table is her sister's new husband, a strategy consultant who reads a lot of pop science and likes to hold forth. At one point he says that evolution by natural selection cant be a real scientific theory, because "survival of the fittest" is a tautology — the fittest are just defined as the ones who survived, so the whole thing is true by definition and therefore untestable. Then he slides somewhere else with it: since it's empty anyway, it can't tell you anything about how people actually behave, so all that evolutionary psychology stuff is nonsense, and nobody should be allowed to derive claims about human nature from it. He's quite pleased with himself.

  Nadia is supposed to fire back something devastating. Right now all I have is her saying "that's not what fitness means" and him not budging, which reads flat.

  So: take that one line and lay out every distinct precise claim somebody could actually be making with it. I want the whole menu — from the reading where it's a trivial point about how a word is being used, through the readings where it's a genuine methodological worry about whether fitness can be measured independently of just counting who left offspring, to the readings where it's simply false. For each one, tell me what exactly it commits you to, whether it's a platitude, a live debate, or a mistake, and what would settle it.

  Few things I specifically need:

  - Which readings could Nadia concede outright and keep her science completely intact? My gut says some version of the complaint is harmless and a good biologist would just shrug and say fine, so what.
  - Which reading is the consultant leaning on when he jumps from "it's a tautology" to "so it can't explain behaviour"? Does that step follow on any of the readings, or is he swapping definitions mid-argument?
  - There's also the unfalsifiability angle. Someone told me Popper thought natural selection was something like unfalsifiable or nearly tautological, but meant that as a specific technical criticism, and then later changed his mind and treated it more as a framework that organizes research than a testable law. I don't want to put words in a real philosopher's mouth on the page, so don't try to quote him and don't give me dates — just tell me whether that's roughly the shape of it. And more importantly: is "unfalsifiable" even the same complaint as "tautological"? People use those interchangeably at dinner parties and I suspect they're doing different work.
  - Then give me the line. The single most accurate thing Nadia can say, one or two sentences, in her register — blunt, a little unkind — that lands on the reading he's actually making rather than the one he'd scramble back to.

  No bibliography, I'm not chasing sources and I'd rather you not guess at them. And please don't have her lecture him about who coined the phrase; nobody does that at a real dinner party.
