      4.  Two Questions (Causal History vs. Explanatory Selection).

      *INUS Clarification:* INUS actually undermines the teacher if overdetermination is true. An INUS condition is a necessary part of an *unnecessary* sufficient condition. If the condition is unnecessary (because other triggers exist), the specific trigger isn't necessary for the *outcome*, only for that *version* of the outcome. I will make sure this is clear.

  10. **Final Review against constraints:** No bibliography. No references. Numbered list for theses. Verdicts included. Payoff included. Two questions formulated.

      *Wait, one more check:* "Please set out, as a numbered list I could bring to class, the separate precise theses the proverb could be taken to assert, and for each one be explicit about which feature of causation is doing the work... Then give each reading a verdict... and say whether it survives my classmate's assumption."
