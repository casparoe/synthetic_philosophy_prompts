answer: |-
  You have described a configuration that is epistemically coherent, practically defensible, and yet notoriously difficult to label because it sits at the intersection of decision theory, philosophy of science, and moral psychology. There is no single canonical term in the literature that captures the entire structure you have outlined. However, the configuration is well-understood when analyzed through three converging frameworks: **Imre Lakatos's "Negative Heuristic,"** **Wittgensteinian "Hinge Propositions,"** and **Decision-Theoretic Asymmetry.**

  Below is an analysis of the configuration, the established concepts that map onto it, the distinctions you requested, and the boundary conditions where defensibility turns into self-deception.

  ### 1. The Conceptual Architecture

  To understand why this refusal is legitimate rather than cowardly, we must distinguish the *role* the belief plays in the agent's system.

  **A. The Professional Case: Lakatos's "Negative Heuristic"**
  In the philosophy of science, Imre Lakatos described scientific "research programmes" as having a **hard core** of fundamental assumptions and a **protective belt** of auxiliary hypotheses. Lakatos argued that it is methodologically rational to adopt a **negative heuristic**: a decision *not* to test the hard core directly.
  *   **Application:** Your archive's dating method is the "hard core." The specific physical test is an auxiliary probe. If the test disagrees, the rational move (within the programme) is to assume the test is inapplicable or flawed, not that the core method is wrong.
  *   **Why it is legitimate:** Science cannot progress if every anomaly forces the abandonment of the foundational theory. The "refusal" to let the test falsify the method is not bias; it is a methodological rule required to maintain the stability of the research programme.

  **B. The Personal Case: Wittgenstein's "Hinge Propositions"**
  In *On Certainty*, Ludwig Wittgenstein argued that some propositions (e.g., "The world exists," "I have hands") function as **hinges**. They are not empirical claims to be verified; they are the scaffolding upon which verification turns.
  *   **Application:** Your friend's belief in his wife's affection is a hinge for his marriage. To treat it as an empirical hypothesis subject to testing is to misunderstand its category.
  *   **Why it is legitimate:** The act of testing a hinge proposition often destroys the framework it supports. Testing trust demonstrates a lack of trust, which undermines the marriage regardless of the result. The refusal to test is a recognition that the belief is **constitutive** of the relationship, not descriptive of it.

  **C. The Unifying Logic: Asymmetric Epistemic Utility**
  From a decision-theoretic perspective, this is a case of **Negative Value of Information (VOI)**.
  *   **The Calculation:** $VOI = (Probability \times Utility_{Gain}) - (Probability \times Cost_{Loss})$.
  *   **The Asymmetry:**
      *   *Confirmation:* Utility is near zero (redundant with 20/30 years of prior evidence).
      *   *Falsification:* Cost is catastrophic (systemic collapse of the archive's credibility or the marriage).
      *   *Pre-commitment:* Because the agent knows the negative result would be rejected (attributed to test error), the information cannot update the belief.
  *   **Result:** The test has high cost and zero capacity to alter the doxastic state. Therefore, refusing the test is **Rational Ignorance**.

  ### 2. Distinguishing from Neighbors

  You asked how to distinguish this from nearby concepts. The distinctions lie in *intent*, *structure*, and *outcome*.

  | Concept | Why it is not this | Key Distinction |
  | :--- | :--- | :--- |
  | **Confirmation Bias** | Bias is unconscious and post-hoc (weighting evidence to fit belief). | Your cases are **pre-emptive** and **conscious**. The agent admits the asymmetry openly. |
  | **Willful Ignorance** | Usually implies moral culpability or liability avoidance (e.g., not reading a contract). | Here, there is no **duty to know**. The duty is to *preserve the system* (archive/marriage), which outweighs the duty to verify. |
  | **Self-Deception** | Involves convincing oneself of something one suspects is false. | The agent is not suspicious. The prior probability of the belief is high based on long-term track records. The refusal is based on **risk management**, not fear of truth. |
  | **Begging the Question** | A logical fallacy in argumentation. | This is not an argument; it is a **policy of inquiry**. It concerns when to inquire, not how to argue. |
  | **The Reliability Puzzle** | (e.g., bootstrapping problem: using a gauge to prove the gauge). | Your cases are not circular validation. They are **protection of entrenched priors** against low-utility external shocks. |

  ### 3. Boundary Conditions: When does it become Self-Deception?

  The configuration is coherent, but it is not infinitely defensible. It tips into irrationality or self-deception under specific conditions.

  **1. Degeneration of the Research Programme (Lakatos)**
  *   **Defensible:** The core belief continues to generate successful predictions and useful work (the finding aids are cited and used).
  *   **Indefensible:** The core belief stops working, requires constant *ad-hoc* adjustments to explain away failures, or no longer yields new knowledge. If the archive's dating method starts failing regularly against *other* internal checks, refusing the physical test becomes dogmatism.

  **2. The Cost of the Protective Belt (Quine)**
  *   **Defensible:** Attributing the negative result to the test is plausible (e.g., "This ink test is known to be unstable on 19th-century paper").
  *   **Indefensible:** The explanation for rejecting the test result becomes more complex and unlikely than the falsification itself. If the friend must believe in a vast conspiracy to explain the letters, the hinge has snapped.

  **3. The Possibility of Remediation**
  *   **Defensible:** The negative outcome is truly catastrophic and irreversible (retraction of thousands of records; divorce).
  *   **Indefensible:** The negative outcome could be managed or integrated. If the archive could quietly correct the 30 items without public retraction, the refusal to test becomes about pride, not systemic stability.

  **4. The Source of the Asymmetry**
  *   **Defensible:** The asymmetry arises from the **value of the belief** (trust, institutional credibility).
  *   **Indefensible:** The asymmetry arises from **ego protection** alone. If the archivist refuses the test merely to avoid personal embarrassment, rather than to protect the institution's utility, it slides toward culpable avoidance.

  ### 4. Proposed Terminology

  Since no single term exists, I propose describing this configuration as **"Methodological Immunity regarding Entrenched Commitments."**

  If you require a label for the *refusal itself*, the most precise existing term is the exercise of the **Negative Heuristic**.

  **Definition:**
  > **Methodological Immunity:** A defensible epistemic stance wherein an agent declines to generate decisive evidence regarding a foundational belief, because the belief functions as a structural hinge for a larger system, and the cost of falsification (systemic collapse) radically outweighs the utility of verification (redundancy), provided the belief remains productive and the rejection of contrary evidence remains plausible.

  **Boundary Conditions for Methodological Immunity:**
  1.  **Productivity:** The belief must continue to yield successful outcomes (the archive aids must be useful; the marriage must be functional).
  2.  **Plausibility of Error:** There must be a credible alternative explanation for potential negative results (the test could be wrong).
  3.  **Non-Invasiveness:** The act of testing must not itself degrade the value of the belief (particularly in the personal case).

  ### 5. Conclusion

  You are not circling a paradox; you are identifying a **stability condition** for complex systems (whether institutional or interpersonal).

  In both episodes, the agent recognizes that some beliefs are not merely *held*; they are *inhabited*. To subject them to a binary test is to step outside the system that gives them meaning. The refusal to test is not a failure of epistemic courage, but a recognition that **certainty is sometimes a prerequisite for inquiry, not its result.**

  The archive needs to be certain of its dating to catalogue; the husband needs to be certain of his wife to be married. In these contexts, the "check" is not a tool for truth-seeking; it is a tool for system-breaking. Declining it is not self-deception; it is **systemic preservation.**
