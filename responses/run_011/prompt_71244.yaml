answer: |-
  No single canonical term perfectly isolates this phenomenon, though it technically falls under the broader taxonomy of **"Invented Tradition"**; for precision regarding the openness of the invention, I propose coining **"Transparent Tradition."**

  You are correct to hesitate at Hobsbawm's "Invented Tradition." While strict textual analysis of Hobsbawm and Ranger allows for practices that simply *construct* continuity (even with a recent past), the term's sociological uptake almost invariably carries a pejorative connotation of falsification or false antiquity. Your case lacks the *deceit* component essential to the popular understanding of Hobsbawm's category; the continuity claimed is real (to 1994), not imputed to a vague, older past. Therefore, while it is structurally an invented tradition, labeling it as such obscures the critical feature you identified: the communal consent to the origin story.

  "Custom" or "Convention" fails because it lacks the normative sacredness you described. A custom (e.g., wearing casual clothes on Fridays) can be altered without moral outrage; a tradition (e.g., the mug toast) invokes a duty of preservation. The resistance to change you note ("attack on tradition") signals a shift from *habit* to *obligation*, which custom does not capture. "Ritual" describes the *form* of the action (the toast, the fair) but not the *temporal status* or the social agreement regarding its history. A ritual can be ancient or new; your phenomenon is specifically about the *validation* of the new as binding.

  Edward Shils, in *Tradition* (1981), comes closest with **"Deliberate Tradition,"** distinguishing practices established by conscious decision rather than organic drift. However, Shils does not explicitly foreground the *transparency* of that decision as a functional feature. In your case, the openness is not just a fact; it is a *mechanism* of bonding. The shared knowledge of the 1994 memo acts as a foundational myth that is historically verifiable, creating a "we were there" (or "we know who was there") intimacy that false antiquity cannot achieve.

  **Transparent Tradition** is the precise term for this. It is defined as a practice that acquires the normative force of tradition despite a collectively acknowledged recent origin, where the origin story itself serves as the sacred text.

  **Edges and Breaking Conditions:**

  1.  **What Counts:**
      *   **Known Origin:** The date and agents of creation are accessible and frequently cited (e.g., the Dean telling the story).
      *   **Normative Force:** Violation or alteration provokes social sanction or feelings of loss, indistinguishable from reactions to ancient traditions.
      *   **Continuity of Practice:** The action is repeated with high fidelity despite the short timeline.

  2.  **What Doesn't Count:**
      *   **Inside Jokes:** If the practice lacks normative weight and is merely humorous, it remains a meme or gag, not a tradition.
      *   **Administrative Rules:** If compliance is driven by enforcement rather than communal buy-in (e.g., "you must attend the fair or be fined"), it is a regulation, not a tradition.
      *   **Forgotten Origins:** If the 1994 date is lost and people start assuming it's older, it shifts into standard **Invented Tradition** (Hobsbawmian), relying on false continuity.

  3.  **The Breaking Feature:**
      *   The phenomenon collapses if **transparency is removed** or **normativity is lost**. If the college starts claiming the mug dates to 1894, it becomes a lie (Invented Tradition). If the college admits it's from 1994 but students stop caring and change the toast wording freely, it becomes a **Custom**. The stability of a Transparent Tradition relies on the paradoxical agreement to treat a known contingency as a binding necessity.
