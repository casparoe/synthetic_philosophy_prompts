answer: |-
  Your suspicion is well-founded. This passage is a classic example of "philosophical telephone": it starts with a recognizable position, simplifies it for flow, and then draws a dramatic conclusion that relies on the simplification rather than the actual argument. It is rhetorically effective but philosophically leaky.

  Here is the breakdown of what a Hume scholar would accept, what is a distortion, and how that affects your specific situation in Patagonia.

  ### 1. The Humean Gloss: What's Accurate?
  **The Claim:** *Promising is artificial/conventional; its bindingness comes from the social utility of the practice, not natural sentiment.*
  **Verdict:** **Accurate.**
  A Hume scholar would sign off on this. In *A Treatise of Human Nature*, Hume argues that fidelity is an "artificial virtue." Unlike benevolence (which we feel naturally), promising is a human invention designed to solve a coordination problem. We invent the ritual of "I promise" because without it, we couldn't cooperate across time. The obligation arises because the *scheme* is useful to society, not because the sounds themselves have magical properties.

  **The Claim:** *A promise obligates like a rule of the road.*
  **Verdict:** **Mostly Accurate.**
  Hume does view moral rules as analogous to social conventions. We drive on the left (or right) not because it's naturally superior, but because *coordinating* is superior to chaos.

  ### 2. The "Broken in Secret" Inference: Where It Breaks
  **The Claim:** *Whether you're bound depends on whether the practice is served [in that instance], so a promise broken in secret... isn't broken in any real sense at all.*
  **Verdict:** **Philosophically Wrong.**
  This is the slippery move you sensed. The author conflates the **justification of the institution** with the **obligation of the individual act.**

  For Hume (and most conventionalists), the *practice* is justified by its general utility. However, once the practice is established, the individual is bound by the rule, not by a case-by-case calculation of utility. If every individual decided, "This specific breach won't hurt the general practice because it's secret," the practice would collapse.

  **Did Hume have a reply to the free-rider worry?**
  Yes. This is essentially the problem of the "Sensible Knave" (discussed in his *Enquiry Concerning the Principles of Morals*). The Knave argues: "Why should I be honest when I can gain by cheating and no one will know?"
  Hume's reply is not that the Knave will be caught. His reply is twofold:
  1.  **Psychological/Character:** Maintaining the habit of integrity is essential for your own peace of mind and character. Corrupting your own disposition is a high price for a secret gain.
  2.  **Systemic Risk:** You cannot reliably isolate your breach. Habits are slippery. If you allow yourself to breach the rule when it's convenient, you erode your own reliability, which will eventually become known or cause other failures.

  So, the book's claim that a secret breach "isn't broken in any real sense" is a caricature. For Hume, the breach is real because it violates the convention that you, as a participant in society, are required to uphold regardless of immediate detection. The obligation is to the *rule*, not to the *outcome of the specific act*.

  ### 3. The Rights-Transfer Critique: Is it Fair?
  **The Claim:** *Rights-transfer theories just relocate the mystery... assuming you can conjure rights out of thin air.*
  **Verdict:** **A Fair Objection, but a Straw Man Conclusion.**
  The "rights-transfer" view (often associated with Locke or later Will Theorists) posits that by promising, I give you a normative power over me.
  *   **The Objection:** The author is right that this doesn't explain *how* we get this power. It takes the power as a primitive.
  *   **The Distortion:** The author implies this makes the view worthless ("just relocates the mystery"). But philosophical theories often posit primitives to explain structures. The value of the rights view isn't explaining the *metaphysical origin* of the power, but explaining the **structure of the relationship**. It explains why *only the promisee* can release you from the promise (because you gave *them* the right), whereas the Humean view struggles to explain why I can't just apologize to society and be done with it.

  The book presents a false dilemma: Either obligation is just social utility (Hume) or it's magic rights (Transfer). In reality, modern philosophy (e.g., Scanlon, Rawls) often blends these: the practice is socially useful, but the *individual obligation* is grounded in a principle of fidelity or reasonable reliance that doesn't require "magic," just a recognition of the other person's standing.

  ### 4. The Overall Moral: "Everything Collapses"
  **The Claim:** *Every account collapses; we should live with the mystery.*
  **Verdict:** **Trade-Press Dramatics.**
  This does not survive correction. The passage sets up a "Goldilocks" failure: Hume is too cold (secret breaches don't matter), Rights-Theorists are too magical (conjuring duties).
  But the gap between them is where most actual moral philosophy lives. We can say: "Promising is a social practice (Hume) that creates specific normative expectations between individuals (Rights/Relational)." The fact that there is debate does not mean the concept is mysterious nonsense; it means it is complex.

  ### 5. The Patagonia Situation: Should You Keep the Promise?
  You asked whether the reasoning in that paragraph is any good once fixed up, specifically regarding your commitment to your friend.

  **The Short Answer:** No. The reasoning in the passage is not good, and using it to rationalize breaking the promise is building on sand.

  **The Longer Answer:**
  The passage invites you to think of the obligation as **external**: "Am I bound only because society will punish me or because the system needs me?" Since your friend is gone and society won't know, the passage suggests the bond is dissolved.

  But if we correct the Humean view (as above), the obligation is also **internal** and **dispositional**.
  1.  **The Humean Correction:** Even if undetected, breaking the promise damages *your* character. You are training yourself to be the sort of person who keeps commitments only when monitored. Hume would argue that your own self-conception as a trustworthy agent is part of the "utility" you are undermining.
  2.  **Your Initial Instinct (The Trust View):** You mentioned you were primed to prefer the "betrayal" explanation. You were right. Even if your friend never knows, the promise created a normative expectation. By breaking it, you are treating your past self and your friend's reliance as irrelevant.
  3.  **The "Secret" Fallacy:** The passage argues that if nobody finds out, the rule isn't served. But the rule *you* are serving is the rule of your own integrity. You are the one who has to live with the person who broke the promise.

  **Conclusion:**
  The book is using a sophisticated-sounding philosophical debate to license a convenient conclusion. It tells you: "Don't worry, the philosophers say this is all made up anyway." That is not what the philosophers say. They say the *source* of the obligation is debated, not the *existence* of it.

  If you keep the promise, you aren't necessarily obeying a cosmic law or a social contract. You are affirming that your word has weight even when the social enforcement mechanism is removed. That is arguably the only time your word *actually* has weight. The passage tries to convince you that without an audience, the performance doesn't matter. But in morality, the audience is often just you.

  Don't let a science journalist's summary of Hume talk you out of your integrity. The "mystery" isn't that promises don't bind; it's that we have the capacity to bind ourselves to people who can't hold us to it. That capacity is worth keeping.
