answer: |-
  **SEMINAR HANDOUT: THE LIBERAL PARADOX**
  **Characters:** Elena (Impossibility Advocate), Marcus (Game-Form Advocate)

  **Elena:** Let's stop treating this like a logic puzzle to be solved and start treating it like a normative crisis. Write down the alternatives. $n$: Neither reads *Lady Chatterley*. $p$: The Prude reads it. $l$: The Lewd reads it.

  **Marcus:** Fine. And the preferences?

  **Elena:** The Prude ($P$) wants no one to read it. But if someone must, he'll do it himself to protect the Lewd. So: $n \succ_P p \succ_P l$. The Lewd ($L$) wants it read. Preferably by the Prude, for the shock value. So: $p \succ_L l \succ_L n$.

  **Marcus:** Standard profile.

  **Elena:** Now apply Minimal Liberalism. The Prude is decisive over his personal sphere $\{n, p\}$—to read or not. The Lewd is decisive over $\{n, l\}$. By Prude's right, society ranks $n \succ p$. By Lewd's right, society ranks $l \succ n$.

  **Marcus:** And Pareto?

  **Elena:** Look at $p$ versus $l$. Prude prefers $p \succ l$. Lewd prefers $p \succ l$. Pareto demands society rank $p \succ l$. Combine them: $l \succ n \succ p \succ l$. A cycle. Transitivity fails. You cannot have a complete social ordering that respects both Pareto and Minimal Liberalism over this profile.

  **Marcus:** So you conclude liberty is impossible? Or rather, that your modeling of liberty is. You've defined a right as a guaranteed outcome over a pair of states. But rights aren't outcome guarantees; they're permissions to act.

  **Elena:** If I have a right to read, doesn't that mean my choice determines whether I read?

  **Marcus:** It means I'm permitted to pick up the book. It doesn't mean the social ordering must freeze the world in the state resulting from my choice, regardless of what else happens. If you formulate liberty as a game form—who moves when, what actions are allowed—the contradiction evaporates. The Prude chooses not to read. The Lewd chooses to read. The outcome is $l$. No cycle, just a played game.

  **Elena:** But that outcome ($l$) is Pareto-dominated by $p$. Both prefer the Prude reading! Your game form delivers an inefficient outcome because it treats rights as side-constraints on action rather than integrating them into the social good. But let's go deeper. Why are we accepting these preferences? The Prude's ranking of $l$ versus $n$ is meddling. He cares about what the Lewd does in the Lewd's own sphere.

  **Marcus:** Exactly. If we restrict the domain to "self-regarding preferences," the paradox disappears. The Prude should only rank $\{n, p\}$.

  **Elena:** And there's the rub. Restricting the domain isn't a fix; it's a retreat. Universal Domain is the requirement that social choice work for *any* logically possible preferences. If liberalism only survives when we forbid people from caring about each other, it's a fragile ideal. Nosiness is real. People vote on abortion, drug laws, speech. To say "those preferences don't count" is to rig the model so the theorem can't fire.

  **Marcus:** It's not rigging; it's defining the scope of public reason. But fine, assume Universal Domain holds. What about waiving? Gibbard showed agents can waive rights to restore consistency. In this profile, if the Lewd waives his right over $\{n, l\}$, the Prude decides everything. He picks $n$. Pareto is violated, but the cycle breaks.

  **Elena:** And if the Prude waives? The Lewd picks $l$. Again, Pareto violated. But here's the cost: you're saying liberty is conditional on consistency. If my exercising my right creates a cycle, I *must* waive it? That makes rights residual. They exist only when they don't conflict with Pareto efficiency or transitivity. That's not a robust defense of liberty; it's a description of when liberty is permitted to exist.

  **Marcus:** Better than saying liberty is logically incoherent. But I grant you this: the waiver solution feels like damage control. It admits the conflict exists. My deeper objection is your ontology. You're evaluating outcomes ($n, p, l$) without evaluating the *process*. A game form respects liberty by ensuring no one coerces the Prude's choice. Whether the outcome is Pareto optimal is secondary.

  **Elena:** Secondary? If the outcome is $l$ (Lewd reads), both agents are worse off than if the outcome were $p$ (Prude reads). If your theory of rights prevents us from recognizing that $p$ is better for everyone, your theory is blind to welfare. A right that protects me from my own best interests might be coherent, but is it desirable?

  **Marcus:** It's desirable if the alternative is allowing social calculation to override personal sovereignty. But I'll concede this: a pure game form tells you what was *allowed*, not whether the exercise of liberty was *good*. It lacks evaluative bite.

  **Elena:** And my model lacks procedural clarity. It assumes rights map directly to social orderings without explaining the mechanism. So we're stuck. I think the impossibility is real. We have to drop Universal Domain or weaken Pareto.

  **Marcus:** I think the impossibility is an artifact of mapping rights onto orderings instead of actions.

  **Elena:** Then here's where I'd attack next: Pareto. Why should social efficiency override individual sovereignty in personal spheres? If the Prude and Lewd both prefer $p$, but the Lewd has a right to choose $l$, why does Pareto trump the right?

  **Marcus:** And I'd attack Minimal Liberalism as you've defined it. Rights shouldn't be decisive pairs over outcomes. They should be protected domains of action. If we shift the machinery to game forms, we keep the liberty without the cycle.

  **Elena:** But you lose the guarantee that liberty leads to good states.

  **Marcus:** And you lose the guarantee that liberty is possible.

  **Elena:** Then the seminar isn't over. We've just found the fault line.

  **Marcus:** Exactly. Now let's see if the students can find a bridge.
