answer: |-
  "The bottleneck is the crane," Elara said, tracing a circle in the condensation on the table. "You start with a single cell. That physical constraint guarantees genetic homogeneity. From there, policing mechanisms evolve to suppress somatic cheating. It is a mind-last, substrate-neutral process. It accelerates design work in the space of multicellular forms without borrowing any intelligence from elsewhere."

  Kael shook his head, leaning back. "You are describing the sequence, not the logic. A crane lifts weight from a established base. But here, the base—the higher-level individual—only exists once the lifting is complete. You claim policing evolves to protect the organism. But until lower-level competition is suppressed, there is no organism to protect. There are only colonies of cells. If the explanation relies on the fitness of the multicellular unit to explain the suppression of cell-level fitness, you are presupposing the outcome."

  "That's a caricature of the mechanism," Elara countered. "The policing doesn't evolve for the organism *qua* organism. It evolves via kin selection among the cells. Because of the bottleneck, the cells are clones. A gene that suppresses cheating in neighbors promotes copies of itself. The higher-level fitness is a byproduct, not a prerequisite. The gradient is continuous. As fidelity of heredity increases via policing, the cluster becomes more individual-like. That is a crane building complexity from simplicity."

  "But when does the selection shift?" Kael pressed. "You speak of continuous gradients, but individuality is defined by the absence of lower-level conflict. If there is any significant cell-level competition, it is a colony. If there is none, it is an individual. The transition requires the elimination of the very force your crane relies on to build the structure. You need cell-level selection to build the policing, but you need the absence of cell-level selection to have an individual. The process is only recognizable as design work for multicellularity under a description framed in terms of the outcome. By your own criterion, that is a skyhook."

  Elara wiped the table clean. "You are treating individuality as a binary state. It isn't. Compartmentalization and limited migration create degrees of conflict suppression. A cluster with 90% suppression functions more like an individual than one with 50%. The crane works in the degrees. It lifts the fidelity of heredity incrementally. The 'organism' is just the limit case of that trajectory. You don't need a threshold to have a mechanism."

  "But you do need a threshold to have a unit of selection," Kael insisted. "Fitness is a property of replicators. If the cluster cannot replicate without internal conflict dissolving it, it has no fitness. You are arguing that the crane builds the replicator. But a crane operates on existing fitness landscapes. If the landscape for the multicellular unit doesn't exist until the unit is cohesive, then positing a mechanism that navigates that landscape to create the unit is circular. The mechanism looks like a crane only because you know where it ends up. Without the end point in view, it's just cells dying or dividing."

  "That implies the landscape is created ex nihilo," Elara said. "But the landscape is physical. Diffusion limits, adhesion molecules, metabolic constraints. These exist before the individual. The crane leverages these physical regularities. It is greedy reductionism to demand that the higher-level fitness be fully realized before the mechanisms stabilizing it can evolve. The stabilization is the realization."

  "Stabilization implies something to stabilize," Kael replied. "If I say the arch holds itself up because the keystone locks the stones, I explain the arch. But if I say the keystone evolved to lock the stones before the arch existed, I need a story about why the stones stayed together long enough for the keystone to arrive. You say kin selection holds the stones. But kin selection is cell-level. As soon as a mutation arises that bypasses the policing—a cancer—the cell-level fitness outruns the group-level benefit. The policing must be perfect to sustain the individual. Perfection is a threshold. A crane that only works when it has already finished its work is a skyhook."

  "Perfection isn't required, just sufficiency," Elara argued. "Migration is limited, not zero. Cheating is costly, not impossible. The crane works because the cost of cheating rises as the cluster integrates. The design work is done by the changing cost-benefit ratio. That is substrate-neutral. It applies to cells, to robots, to software. It doesn't borrow from the future."

  "It borrows from the description of the future," Kael corrected. "You identify the mechanism as 'policing for the good of the whole' only because you see the whole. If you describe it strictly as 'cellular enzyme production triggered by proximity,' there is no design work for multicellularity happening there. There is just chemistry. To call it a crane for individuality is to import the teleology of the outcome into the causality of the process. That is the definition of a skyhook in naturalistic explanation. It lifts the design space by assuming the design."

  "So your claim is semantic," Elara said, narrowing her eyes. "You think the distinction rests on how we describe the mechanism, not the mechanism itself."

  "My claim is ontological," Kael said. "The distinction rests on whether the fitness gradient exists independently of the trait it selects. If the gradient for multicellular individuality only emerges once multicellular individuality is nearly complete, the process that traverses it cannot explain its origin. It assumes the ground it claims to build."

  "Then we agree on the mechanics," Elara said. "Bottlenecks, policing, fidelity. We disagree on whether the gradual suppression of conflict constitutes a continuous landscape or a threshold cliff."

  "And whether a mechanism described by its outcome counts as a natural lift," Kael added.

  Elara paused. "So the disagreement isn't about the biology. It's about the topology of the fitness landscape and the dependency of the explanation on the final state."

  "Precisely," Kael said. "If the fitness of the higher-level unit is zero until lower-level competition is fully suppressed, no crane can cross the gap. If it is non-zero throughout, the crane holds."

  "Then here is the question," Elara said. "Does the fitness of a nascent multicellular cluster scale linearly with the suppression of cell-level competition, or does it remain zero until a critical threshold of cohesion is crossed?"

  Kael nodded slowly. "If it is zero, I win. If it scales, you win. But we have no way to measure the fitness of a unit that is not yet a unit."

  "Then that is the question," Elara concluded. "Can fitness be assigned to a level of organization that is still in the process of becoming an organization, or does fitness require the organization to be complete?"
