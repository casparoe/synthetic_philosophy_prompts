  2.  **Deconstruct the Philosophical Concepts:**
      *   **Crane:** A natural mechanism that lifts design space from existing ground, step-by-step, without magic. It explains complexity from simplicity.
      *   **Skyhook:** A miraculous or unexplained lift that presupposes the complexity it explains. Often involves teleology or circular reasoning.
      *   **The Transition:** Single cells -> Multicellular individual (with germ/soma distinction and policing).
      *   **Pro-Crane Argument:** Mechanisms like bottlenecks, policing enzymes, and physical constraints naturally suppress cell-level selection, allowing group-level selection to emerge gradually. It's a mechanistic lift.
      *   **Pro-Skyhook Argument:** You can't select for the "individual" until the "individual" exists. If lower-level competition isn't already suppressed, the higher-level unit doesn't have fitness. Therefore, positing a mechanism that *creates* the unit by selecting *for* the unit is circular. It looks like design only from the end point.

