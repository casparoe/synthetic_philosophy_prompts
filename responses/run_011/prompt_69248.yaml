prompt: |-
  I'm a junior and next Friday I have to give the five-minute student speech at my school's Character Awards assembly, the one where the top ten kids on our virtue tracker get pins. The tracker's an app: every month is a virtue (Integrity, Grit, Respect), teachers give you points for showing it and dock you for infractions, and the leaderboard runs on the screen by the front office where everyone can see it.

  I want the whole speech built on Franklin's plan for moral perfection from his autobiography — the private little book with a page per virtue and a column per day where he dotted his own faults, how Order beat him, and how he ended up deciding a speckled ax was better than a perfectly polished one and admitting he never reached the perfection he'd aimed for.

  Here's the problem: the people who made the tracker will be in the front row. So write it so Franklin's own verdict on his project comes through honestly, not softened into a he-tried-his-best poster, and it still sounds generous to the school instead of a takedown, and the gap between his private self-marking and our public scoreboard does the arguing for me without me ever saying the app is bad. Audience is mostly people who've never heard of him, becuase he's not on our curriculum.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Speaker:** Junior student.
      *   **Occasion:** Character Awards assembly (5-minute speech).
      *   **Context:** School uses a "virtue tracker" app (public leaderboard, points for virtues, docks for infractions). Top 10 get pins.
      *   **Theme:** Benjamin Franklin's plan for moral perfection (from his *Autobiography*).
      *   **Key Franklin Details:** Private book, page per virtue, column per day, marking faults, "Order" defeated him, "speckled ax" conclusion (good enough is better than impossible perfection), admitted he never reached perfection.
      *   **Constraint 1 (Crucial):** The app creators/admin will be in the front row.
      *   **Constraint 2 (Crucial):** Must be honest about Franklin's verdict (it didn't fully work/perfection is impossible) *without* sounding like a takedown of the school/app.
      *   **Constraint 3 (Crucial):** The argument must be made through the *contrast* between Franklin's private method and the school's public scoreboard, without explicitly attacking the app.
      *   **Audience:** Mostly unfamiliar with Franklin (not in curriculum).
      *   **Tone:** Generous to the school, thoughtful, humble, not preachy.

  2.  **Deconstruct the Tension:**
      *   *School's System:* Public, competitive, quantitative (points/leaderboard), external validation, perfection-oriented (top 10).
      *   *Franklin's System:* Private, reflective, qualitative (dots for faults), internal validation, progress-oriented (admitting failure).
      *   *The Goal:* Use Franklin's humility to reframe what "character" means in the context of the awards, validating the winners while reminding everyone that the *score* isn't the *virtue*.

  3.  **Drafting Strategy - Section by Section:**

      *   **Introduction:** Hook the audience. Acknowledge the occasion (awards). Introduce Franklin simply (Founding Father, but also a guy trying to be good).
      *   **Explaining Franklin's Method:** Describe the little book. The grid. The dots. Emphasize the *privacy* of it.
      *   **The Turning Point (Franklin's Failure):** Discuss the virtue of "Order." Admit he failed. Introduce the "speckled ax" metaphor. This is the core philosophical pivot.
      *   **Bridging to the Present (The Delicate Part):** Connect Franklin's private struggle to the school's public recognition. *Do not say "The app is bad."* Instead, say "Franklin reminds us that the score isn't the whole story." Focus on the *intent* of the school (encouraging virtue) vs. the *reality* of human nature.
      *   **Addressing the Winners:** Congratulate them genuinely. But frame their win not as "perfection achieved" but as "effort noticed."
      *   **Conclusion:** Bring it back to the "speckled ax." Character is a practice, not a prize. End on a hopeful, unifying note.

  4.  **Navigating the "App" Constraint:**
      *   *Risk:* Saying "Franklin kept his book private, unlike our screen" sounds accusatory.
      *   *Solution:* Focus on *why* Franklin kept it private (honesty requires safety). Then pivot to how the school's recognition *celebrates effort*, even if we can't track everything. Acknowledge the screen exists but emphasize what happens *off* the screen.
      *   *Phrasing:* Instead of "The leaderboard is wrong," say "The leaderboard shows us one thing, but Franklin teaches us about another."
      *   *Tone Check:* Ensure gratitude towards the administration is visible. They are trying to help.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. We are here for awards. Ben Franklin tried to be perfect. He had a chart. He marked X's when he messed up. He failed at Order. He said a speckled ax is okay. We have a screen with points. Franklin says points don't make you good. But congrats to winners. Let's all try to be better, even if we aren't perfect. Thanks.
      *Critique:* Too blunt. Needs more nuance to satisfy the "generous to school" constraint.

  6.  **Drafting - Iteration 2 (Refining the Argument):**
      Need to make the "private vs. public" contrast subtle. Franklin's book was for *him*. The school's board is for *us*. Both aim for growth. Franklin realized perfection is impossible. The school knows we aren't perfect either (hence awards for progress?). Let's frame the awards as "milestones" not "finish lines."

  7.  **Writing the Speech (incorporating specific Franklin details):**
      *   *The Book:* 13 virtues, red ink, black dots.
      *   *The Ax:* The story of the smith who wanted the whole surface polished vs. the speckled one.
      *   *The Verdict:* "I never arrived at perfection."
      *   *The School Connection:* The screen shows the "polished" moments. Franklin reminds us to value the "speckled" work too.

  8.  **Refining the Tone (The "Front Row" Test):**
      *   Make sure to thank the faculty/admin for caring about character.
      *   Ensure the winners don't feel imposter syndrome, but rather humility.
      *   Ensure the non-winners don't feel dismissed, but rather encouraged.
      *   *Key phrase:* "If Franklin were sitting in that front row..." (Acknowledges the admins without attacking them).

  9.  **Final Polish:**
      *   Check timing (5 mins = approx. 750-850 words spoken at a moderate pace).
      *   Ensure the "speckled ax" metaphor lands clearly.
      *   Verify the "private book vs. public screen" argument is implicit but clear.

      *(Self-Correction during drafting)*: I need to be careful not to imply the school *wants* perfection. They want "character." But the *mechanism* (leaderboard) implies ranking. I will frame the ranking as "encouragement" but Franklin's lesson as "sustainability."

      *Revised Strategy:* Focus on the *honesty* of Franklin's record. He admitted faults. A public score might hide faults. The speech should encourage honesty about our flaws, even while celebrating our wins.

  10. **Final Review against constraints:**
      *   Franklin's verdict honest? Yes (he failed).
      *   Softened? No (he admitted defeat).
      *   Generous to school? Yes (acknowledges good intent).
      *   App takedown? No (uses contrast, not criticism).
      *   Audience knowledge? Explain Franklin clearly.

      *(Word Count Check)*: A 5-minute speech is roughly 750 words. I will aim for that.

      *(Final Polish on the "App" nuance)*: I will refer to it as "the list" or "the board" rather than "the app" to keep it slightly more abstract and less technical/confrontational. I will emphasize that the board captures *moments*, while character is a *life*.

      *Let's write.*
answer: |-
  Good morning. For those who don't know me, I'm a junior, and I'm honored to be speaking today.

  When we look at the screen by the front office, or when we see the names called for these pins, it's easy to think of character as a score. Something you accumulate. Something you can win. And I get that. It feels good to see your name go up. It feels good to be recognized for trying to be a good person.

  But I want to tell you about a guy who tried to turn character into a score two hundred and fifty years ago, and exactly what happened when he did.

  His name was Benjamin Franklin. You know him from the hundred-dollar bill, or maybe the kite, but in his autobiography, he talks about a project he started when he was just twenty years old. He called it his "Project for Moral Perfection."

  Franklin decided there were thirteen virtues he needed to master. Things like Temperance, Silence, Order, and Industry. He didn't just think about them; he made a little book. He made a page for each virtue, and he drew seven columns for the days of the week. Every night, he would examine his day. If he lost his temper, or if he wasted time, he put a black dot in the column for that virtue.

  His goal was to keep the pages clean. He wanted to wipe out the faults, one by one, until he was perfect.

  Now, Franklin was a practical guy. He wasn't a saint. And he writes honestly about how this went. He thought the virtue of "Order"—keeping his time and his things organized—would be easy. It beat him. He writes that he struggled with it his whole life. He'd make progress, then slip back. He'd get frustrated.

  Eventually, Franklin came to a conclusion that I think is really important for us, especially on a day like today. He tells a story about a man who wanted to buy an ax from a smith. The man liked the shape of the ax, but he wanted the whole surface polished as bright as the edge. The smith agreed to do it, but only if the man turned the wheel while he ground it. It was hard work. After a while, the man looked at the ax, saw it was still speckled, and said, "I think I like a speckled ax best."

  Franklin says, "I have always thought that a man of sense might have good reasons for this."

  He realized that trying to polish away every single speck of fault was exhausting, and maybe impossible. He writes, simply: "I never arrived at the perfection I had been so ambitious of obtaining." He failed. And he admitted it.

  I bring this up not to say that trying to be good is pointless. I bring it up because Franklin's little book was private. The dots were for him. He knew that if he was going to be honest about his faults, he needed a safe place to admit them.

  Here, we have a different system. We have a leaderboard. We have points that everyone can see. And I want to thank the administration and the faculty for caring enough about our character to track it. It shows that this school believes virtue matters more than just grades. That intention is rare, and it's valuable.

  But Franklin's "speckled ax" reminds us of something the leaderboard can't show. The leaderboard shows the highlights. It shows the days the page was clean. But it doesn't show the work it took to wipe the ink away. It doesn't show the days we messed up, owned it, and tried again.

  Franklin teaches us that character isn't about having a clean sheet. It's about knowing where your speckles are.

  So, to the students receiving pins today: Congratulations. You should be proud. Your effort has been noticed. But if Franklin were sitting in the front row, I think he'd tell you that the pin isn't a finish line. It's just a marker that you're turning the wheel. Don't let the score make you afraid of the speckles. Don't hide your mistakes because you're worried about your rank. The most honest thing you can do is admit when you're off track.

  And to the rest of us, whose names might not be on that screen: Don't mistake a public score for private worth. You can be gritty, or respectful, or honest when no one is giving you points for it. In fact, that's probably when it counts the most.

  Franklin never became perfect. But he said the attempt made him a better man than he would have been without it. That's the goal. Not a polished ax. Not a perfect score. But a tool that works. A character that holds up when we need it.

  Let's keep turning the wheel. Let's be okay with the speckles. And let's keep trying to be good, not because it gets us on a screen, but because it's the only project that actually matters.

  Thank you.
