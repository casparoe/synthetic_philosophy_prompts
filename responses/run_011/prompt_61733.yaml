      *Re-evaluating Move 4:* Noah says "a third weapon was already being assembled." This is historically true (Core was ready, assembly pending). But the claim that this makes the bomb side "renewable" while Soviets were "one-off" is the weak link. The Soviet entry *changed the strategic landscape* (loss of Manchuria, fear of communism) in a way a third bomb might not have replicated if the first two didn't work. So Move 4 is "Partly."

      *Re-evaluating Move 1:* Ishita says "An event that leaves the outcome untouched... cannot be the cause." This is a specific definition of causation (difference-making). It holds up logically but might be too narrow for history. "Partly" is appropriate.

