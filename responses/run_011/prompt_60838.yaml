  **INSTRUCTIONS:** Copy the text below into a document. Set margins to Narrow (0.5"). Font: Courier New or Consolas, size 10. This is designed to fit exactly two pages.

  ***

  # PAGE 1: THE RAVEN DIAGNOSTIC TREE

  **START HERE.** Read the scenario. Pick the answer that feels true in your gut. Follow the arrow.

  **Q1. THE LOGIC TRAP**
  Statement A: "All Ravens are Black."
  Statement B: "All Black Things are Ravens."
  If A is true, must B be true?
  *   **YES** → Go to **LEAF A (The Confused)**
  *   **NO** → Go to Q2

  **Q2. THE RED APPLE**
  You see a red apple. It is not black. It is not a raven.
  Does looking at this apple give you *any* reason, even a tiny one, to believe "All Ravens are Black"?
  *   **NO** → Go to Q3
  *   **YES** → Go to Q5

  **Q3. THE ALBINO RAVEN**
  A bright white raven lands in your brother's yard. It is definitely a raven.
  Does this single bird prove the rule "All Ravens are Black" is false?
  *   **YES** → Go to Q4
  *   **NO** (It's an exception/bird is weird) → Go to **LEAF B (The Definitionalist)**

  **Q4. THE FEATHER SWAB**
  You find a feather. DNA says it's raven DNA. But you don't have the whole bird.
  Does the rule "All Ravens are Black" apply to this feather?
  *   **YES** (It counts as a raven) → **LEAF C (The Falsificationist)**
  *   **NO** (Need the whole bird) → **LEAF D (The Vagueness Dodger)**

  **Q5. THE APPLE PICKER**
  Does it matter *who* picked up the apple?
  Case 1: A kid grabs it off the ground randomly.
  Case 2: You went out specifically hunting for a non-black thing to test the rule.
  Does Case 2 make the apple better evidence than Case 1?
  *   **YES** → Go to Q6
  *   **NO** (Evidence is evidence) → Go to Q7

  **Q6. THE INTENT COST**
  If intent matters, does that mean logic depends on what was in your head?
  *   **YES** → **LEAF E (The Contextual Bayesian)**
  *   **NO** → **LEAF F (The Standard Bayesian)**

  **Q7. THE TILE SHIPMENT**
  You have 400 boxes of tile. Rule: "Every box is the right colour."
  You check a green box. It is not the right colour. It is not a tile box.
  Does this green box prove the shipment is correct? (Same logic as the apple).
  *   **YES** (Logic is universal) → **LEAF G (The Strict Hempelian)**
  *   **NO** (Tiles are finite, ravens aren't) → **LEAF H (The Finite Pragmatist)**

  ---

  ### THE LEAVES (PRINTOUT RESULTS)

  **LEAF A: The Confused**
  *   **Apple:** You think the apple proves ravens are black, but you also think black cars are ravens.
  *   **Cost:** You win arguments by changing the meaning of "All." You are logically unsafe.

  **LEAF B: The Definitionalist (Quinean)**
  *   **Apple:** The apple proves nothing because "non-black" isn't a real category like "raven."
  *   **Cost:** You have to explain why some categories (colour) count for science and others (non-colour) don't.

  **LEAF C: The Falsificationist (Popperian)**
  *   **Apple:** The apple proves nothing. Only a non-black raven matters.
  *   **Cost:** You can never prove a rule is true, only that it hasn't been broken yet. Science is just survival.

  **LEAF D: The Vagueness Dodger**
  *   **Apple:** The apple proves nothing. Also, we can't test the rule until we define "raven" perfectly.
  *   **Cost:** You spend all your time arguing about feathers and DNA instead of doing the work.

  **LEAF E: The Contextual Bayesian**
  *   **Apple:** The apple confirms the rule, but only if you weren't hunting for it.
  *   **Cost:** You have to track the history of every piece of evidence. Logic gets messy.

  **LEAF F: The Standard Bayesian**
  *   **Apple:** The apple confirms the rule, but so slightly it's worthless (there are too many non-black things).
  *   **Cost:** You admit the intuition is wrong, but the math is right. Hard to explain at lunch.

  **LEAF G: The Strict Hempelian**
  *   **Apple:** Yes, the apple confirms the rule. Logic is logic. Deal with it.
  *   **Cost:** You must accept that a green shoe proves ravens are black. Your intuition is irrelevant.

  **LEAF H: The Finite Pragmatist**
  *   **Apple:** The apple works for the tile shipment (finite), but not for ravens (infinite).
  *   **Cost:** You have two different rules for logic: one for the warehouse, one for the world.

  ***

  # PAGE 2: THE LOGICAL SPACE

  **HOW TO READ THIS:** This section maps the empty spots in the tree. If your group chat lands here, someone is lying or confused.

  ### THE QUESTION MATRIX
  There are 8 decision nodes in the tree. Theoretically, there are 256 paths ($2^8$). In reality, only 8 leaves are stable. Here is why the rest are empty.

  **1. The Logic Constraint (Q1)**
  *   **Empty Combo:** Answering "NO" to Q1 but later arguing as if "All Black Things are Ravens" is true.
  *   **Why:** Incoherent. You cannot pass the logic check and then use the Converse fallacy in your reasoning. If two friends are here, they are not disagreeing on philosophy; one is failing basic logic.

  **2. The Equivalence Constraint (Q2 & Q7)**
  *   **Empty Combo:** Saying the Apple counts (Q2=YES) but the Green Tile does not (Q7=NO).
  *   **Why:** This is **Leaf H**. It is the *only* stable position here. If you claim this difference is due to *logic* rather than *population size*, you are in an empty spot. Logic doesn't change based on inventory.
  *   **Unattractive:** Holding Leaf H requires admitting logic is not universal. Most philosophers hate this, but it works for warehouse guys.

  **3. The Background Knowledge Constraint (Q5)**
  *   **Empty Combo:** Saying Intent Matters (Q5=YES) but denying that Logic Depends on Head (Q6=NO).
  *   **Why:** Incoherent. If the *search method* changes the evidence value, then the evidence is not objective. You cannot have it both ways. This splits **Leaf E** from **Leaf F**.

  **4. The Falsification Constraint (Q3 & Q4)**
  *   **Empty Combo:** Saying the Albino kills the rule (Q3=YES) but the Feather doesn't count (Q4=NO).
  *   **Why:** This is **Leaf D**. It is stable but costly. The empty spot is claiming the Albino kills the rule *because* it's a raven, but the feather isn't a raven *despite* the DNA. You need a consistent definition of "Raven."

  ### LIMITATIONS OF THIS TREE
  **Be honest with your brother.** This tree cannot separate these pairs:

  1.  **Leaf F (Standard Bayesian) vs. Leaf G (Strict Hempelian):**
      *   Both say the apple counts.
      *   **The Tie:** The tree treats them as different because of *why* they accept it (Math vs. Logic). In practice, they act the same. If your chat is fighting here, you are arguing about feelings, not facts.
  2.  **Leaf B (Definitionalist) vs. Leaf D (Vagueness Dodger):**
      *   Both reject the apple.
      *   **The Tie:** Both rely on "categories are fuzzy." One blames "Non-Black," the other blames "Raven." This is a distinction without a difference for lunch-break talk.
  3.  **Leaf C (Falsificationist) vs. Leaf A (The Confused):**
      *   **The Risk:** A Falsificationist says "Only non-black ravens matter." A Confused person says "Only black ravens matter."
      *   **The Test:** Ask them about the Green Tile. The Falsificationist says "Irrelevant." The Confused person often slips and says "It helps." Watch for this slip.

  ### FINAL ADVICE FOR THE CHAT
  *   **If someone lands on Leaf A:** Stop arguing philosophy. Teach them logic first.
  *   **If someone lands on Leaf H:** They are right about the tiles, but they are cheating on the ravens. Call them out on having two rulebooks.
  *   **If someone lands on Leaf G:** They are the most logically consistent, but the most annoying. Acknowledge their consistency, then point out the cost (the green shoe).
  *   **The Albino:** This is the strongest weapon. If the rule is "All," one white raven ends the game. Anyone who says "Well, except that one" has moved the goalposts.

  **END OF PRINTOUT**
