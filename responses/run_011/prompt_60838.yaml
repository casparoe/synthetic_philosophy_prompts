prompt: |-
  ok so context first: I work in receiving at a flooring distributor and my lunch break habit for like three years now has been reading philosophy stuff on my phone sitting in the truck. I fell down a hole on the raven paradox — the whole "does a red apple count as evidence that all ravens are black" thing — and I have not been able to climb out. I dragged my brother and two of his friends into it, we have a group chat that is now 90% this, and the problem is that all four of us have landed somewhere different but none of us can tell if we're actually disagreeing or just saying the same thing at each other very loudly. So what I want is a flowchart I can print out and hand to people: they answer a bunch of questions about little scenarios, and they end up at a named position on the paradox. Two pages max, please, I only have the one printer at work.

  The mechanics I'm after: 8 or 9 questions, each one a concrete situation with two or three options, not a question about vocabulary, because nobody in this group has ever taken a philosophy class and if you ask something like "do you accept the equivalence condition" we will all just guess and then feel clever. Every question needs to be answerable by someone who has no idea which branch it leads down or what the leaves are called. Then each leaf gets its name — the real one if the position has one, or "unnamed" if literally nobody defends it — plus two sentences: what that position says about my red apple, and what it costs you to hold it. Please use my cases instead of the standard textbook ones wherever you can, because I want the tree to sort *us* specifically. Here's what it needs to handle: (1) an albino raven, bright white, that's been sitting on the fence in my brother's yard for two summers — that thing kills "all ravens are black" but it's also a raven, and I honestly don't know what anybody should say about it; (2) whether it matters *who* picked up the apple, i.e. someone who went out specifically hunting for a non-black non-raven to make a point, versus a kid who grabbed it off the ground; (3) a shipment of 400 boxes of tile where "every box in this shipment is the right colour" is finite and I can check all of it by Friday, versus ravens being open-ended — does the finite version change what a stray green tile proves?; (4) a raven's egg, or a feather, or a DNA swab, where the "is this even a raven" line goes fuzzy — does the paradox get worse or just dissolve; (5) the contrapositive, "anything that isn't black isn't a raven," which is supposed to be the same claim and yet makes my skin crawl, plus the converse, "all black things are ravens," which is *not* the same claim. I want a node in there somewhere that catches people who can't tell those last two apart, because I'm fairly sure two of the four of us in that chat are that person and they've been