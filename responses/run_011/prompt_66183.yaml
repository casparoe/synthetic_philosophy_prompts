answer: |-
  1. The Luddites were primarily resisting debasement, evidenced by their targeted destruction of wide frames producing shoddy hose and their appeals to customary rules governing apprenticeship and quality rather than a blanket rejection of machinery. The strongest evidence for displacement remains the sheer reduction in demand for skilled finishing work among the croppers, whose tasks were being physically eliminated by the shearing frames regardless of the quality produced.

  2. If the harm was debasement, the classical compensation apparatus answers a question nobody asked, since cheaper goods do not restore the lost standing of a craft or the authority of its regulations. A degraded but employed knitter is worse off in this specific moral sense than an unemployed one, because the compensation theory assumes labor is a commodity rather than a social relation bound by customary decency.

  3. The distinction dissolves upon contact with 1811 because the knitters' real grievance was a legal and jurisdictional one about who had authority to fix the terms of the trade, making both displacement and debasement mere symptoms of lost political standing. The frame-breaking was in substance collective bargaining by riot in a year of dearth and war, utilizing the language of craft integrity because no other forum remained to assert bargaining power.

  4. The distinction earns its keep in the present debate over automation because it forces economists to confront the normative character of work rather than retreating into the neutral vocabulary of task substitution. Existing terms like deskilling capture the technical change but obscure the loss of customary decency and standing that debasement explicitly names.

  5. To prove this utility, the distinction would have to be applied next to the case of algorithmic management in platform labor, where workers remain employed but lose control of the pace and standard of what counts as well-made work. Only there can we see if the harm is truly the quantity of labor demanded or the character of the subordination involved.
