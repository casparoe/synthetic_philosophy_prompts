          *   *Candidate Principle 1 (The "Shield" Test):* Is the force strictly limited to creating a physical shield for civilians against immediate mass atrocity, without seeking to determine the political outcome beyond that shield? (Passes: N. Iraq, Kosovo, Libya I. Fails: Libya II, Iraq '03, Syria, Yemen).
          *   *Candidate Principle 2 (The "Access & Independence" Test):* Will the intervention compromise the ability of humanitarian organizations to operate neutrally now or in the future, and is there a credible handover to civilian/UN administration? (Passes: N. Iraq, Libya I. Fails: Yemen, Syria [foreclosed options], Kosovo [critiqued on infrastructure]).
          *   *Candidate Principle 3 (The "Mandate/Consent" Heuristic):* SC Mandate is ideal, but Regional Backing + Valid Invitation can substitute *if* the inviting authority has actual control or the SC is blocked by veto during genocide (Rwanda lesson). (Passes: Kosovo, Current Proposal. Fails: Yemen [inviter had no control]).

