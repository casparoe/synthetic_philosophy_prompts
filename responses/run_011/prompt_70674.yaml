          *   *Refusing:* Commits us to prioritizing humanitarian access/neutrality over stopping active starvation when military means are required. Sets precedent that without charity support, we do not endorse force.

  6.  **The Discriminating Hypothetical (Requirement 4):**
      *   *Goal:* Create a case where Framework A (Protection) and Framework B (Integrity) split.
