answer: |-
  **AGENDA NOTE**

  **TO:** Executive Board
  **FROM:** [Your Name/Office]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Framework: Proposed Intervention in [State Name]

  **1. Candidate Principles Derived from Organizational Record**

  To ensure consistency with our seven prior positions, we must identify the underlying principles that reconcile our endorsements (Northern Iraq, Kosovo, Libya I) with our oppositions (Iraq '03, Syria, Yemen, Libya II) and our retrospective admissions (Rwanda). A review of the record suggests our decisions are not driven by a single rule (such as strict legality or pure consequentialism) but by the intersection of two competing interpretive lenses. Both lenses are required to explain the full dataset, including the awkward distinctions between cases.

  *   **Principle A: The "Efficacious Shield" Doctrine.**
      *   *Derived from:* Northern Iraq (1991), Kosovo (1999), Rwanda (Retrospective), Libya (2011, initial).
      *   *Core Tenet:* When mass atrocity (genocide, expulsion, starvation) is underway, the organization endorses military force if it is the only credible means to physically protect civilians, even absent a Security Council mandate.
      *   *Explains:* Our endorsement of Kosovo (no mandate) and Northern Iraq (weak mandate). It explains our Rwanda regret (inaction despite veto risk).
      *   *Constraint:* The force must be demonstrably capable of stopping the harm (explains Syria '13 opposition: strikes would not protect) and must be confined to protection, not coercion (explains Libya '11 reversal: shift to regime change).

  *   **Principle B: The "Political Horizon & Independence" Constraint.**
      *   *Derived from:* Iraq (2003), Yemen (2015), Syria (2013), Libya (2011, later).
      *   *Core Tenet:* Intervention is impermissible if it lacks a credible plan for post-conflict governance or if it compromises the neutrality and operational capacity of humanitarian actors.
      *   *Explains:* Iraq '03 (no "morning after" plan); Yemen '15 (inviting government lacked control/territory); Syria '13 (action would foreclose aid options); Libya '11 (later phase endangered neutrality).
      *   *Constraint:* Valid consent requires effective control (Yemen), and humanitarian endorsement requires that aid agencies can operate without military integration (Syria/Yemen).

  **The Tension:** Our record shows we endorse intervention only when Principle A (Immediate Protection) overwhelmingly outweighs Principle B (Long-term Integrity/Governance). We refuse when Principle B risks are high (Iraq '03, Yemen) or when Principle A benefits are low (Syria '13).

  ***

  **2. Application of Principles to Current Proposal**

  The two principles identified above deliver different verdicts on the proposal before us.

  *   **Under Principle A (Efficacious Shield): ENDORSE.**
      *   *Reasoning:* The threat (starvation/executions) matches the gravity of Kosovo and Northern Iraq. The Security Council is blocked by veto, triggering the Rwanda lesson that a mandate is not a precondition for action. The operational plan is limited to a corridor and port, mirroring the "safe haven" logic of Northern Iraq.
      *   *Implication:* A flat endorsement. The humanitarian imperative to stop starvation trumps procedural defects or political risks.

  *   **Under Principle B (Political Horizon & Independence): REFUSE or CONDITIONAL.**
      *   *Reasoning:*
          1.  **Governance:** While the UN handover plan addresses the Iraq '03 "morning after" concern, the inviting government lacks territory (echoing Yemen '15).
          2.  **Independence:** Major medical charities oppose military escort and threaten suspension of programs (echoing Syria '13 and Yemen '15).
          3.  **Intent:** Coalition leaders' rhetoric regarding regime change risks the "mission creep" that doomed our support for Libya in late 2011.
          4.  **Efficacy:** Air superiority is not guaranteed beyond 90 days, risking the safety of the corridor.
      *   *Implication:* Refusal, unless strict conditions are met.
      *   *Required Conditions for Endorsement:*
          1.  **Public Renunciation:** Coalition heads must formally disavow regime change as an objective, limiting the mandate strictly to the corridor/port.
          2.  **Aid Independence:** Guarantees that aid agencies refusing military escort will be granted safe passage independent of the coalition.
          3.  **Air Security:** Written commitment securing air superiority for the full 18-month duration, not just 90 days.

  ***

  **3. Assessment of Consistency and Analog Analysis**

  If the Board wishes to remain consistent with its historical record, the decision should be **Endorsement Subject to Conditions.**

  *   **Rationale:** The "Rwanda" precedent (silence as gravest failure) combined with the "Northern Iraq" precedent (safe havens without robust SC mandate) creates a strong presumption to act when starvation is weaponized. The inclusion of a UN administration handover specifically remedies the "Iraq '03" governance defect. However, to satisfy Principle B, we must mitigate the risks regarding neutrality and mission creep.
  *   **Closest Analog:** **Northern Iraq (1991).**
      *   *Why:* In both cases, the SC addressed the situation but did not authorize force explicitly. In both, the operation was confined to shielding displaced/persecuted populations (safe havens/corridors) rather than defeating an army. In both, there was a defect in legal authorization that was flagged but not treated as a bar.
  *   **Most Tempting but Misleading Analog:** **Yemen (2015).**
      *   *Why:* It is tempting to oppose based on the fact that the inviting government holds no territory. However, Yemen was opposed because the inviting government was a *party to the conflict* with no plan for civilian handover, and the burden fell on the civilians defended. Here, the handover is to the UN, and the besieged minority has explicitly appealed for intervention. Treating this as Yemen would ignore the "Rwanda" lesson on veto paralysis.
  *   **Underdetermination:**
      *   The record is genuinely tense between the **Syria/Yemen** concern for humanitarian independence and the **Rwanda/Kosovo** imperative to stop atrocity.
      *   **If we Endorse:** We commit to the principle that *physical survival trumps humanitarian neutrality*. Future implication: We may support military escorts in aid delivery even if major charities object, provided the threat is existential.
      *   **If we Refuse:** We commit to the principle that *humanitarian access conditions the use of force*. Future implication: We will oppose interventions in veto-blocked genocides if the local humanitarian community fears for their neutrality, effectively granting NGOs a veto over protection mandates.

  ***

  **4. The Discriminating Hypothetical**

  To test which principle truly governs our identity, consider the following hypothetical case, differing from the current proposal in only one specific respect:

  *   **The Case:** All facts remain identical (starvation, SC veto, regional backing, minority appeal), *except* the Coalition **withdraws the offer to transfer the corridor and port to a United Nations administration.** Instead, they commit to handing control back to the **Recognized Government** (which currently holds no territory) once the siege is lifted.

  *   **Why This Discriminates:**
      *   **Principle A (Efficacious Shield)** still dictates **Endorsement.** The immediate starvation stops; the veto is overcome; the physical protection is credible. The political outcome is secondary to saving lives (Rwanda/Kosovo).
      *   **Principle B (Political Horizon & Independence)** now dictates **Refusal.** Handing territory to a government with no control recreates the exact "Iraq '03" defect (no credible morning after) and the "Yemen '15" defect (inviter lacks effective authority).

  *   **Conclusion:** If the Board endorses the *current* proposal but would reject this *hypothetical* one, we confirm that **Governance Credibility** is a co-equal principle to **Protection**. If we would endorse *both*, then **Protection** is our sole operating principle, and our oppositions in Iraq '03 and Yemen were merely tactical, not principled. This hypothetical forces the Board to decide if the UN handover is a dealbreaker or a detail.
