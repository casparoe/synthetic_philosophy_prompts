      *   *Principle B: The "Procedural Legitimacy & Governance" Principle.* While SC mandates are preferred, they aren't absolute preconditions (Rwanda, Kosovo). However, there must be a credible political horizon (Iraq '03 no) and valid consent from a governing authority that isn't purely a combatant (Yemen no vs. N. Iraq/Kosovo where local need trumped central consent).
      *   *Principle C: The "Humanitarian Sincerity" Principle.* The humanitarian rationale must be primary, not ex post facto (Iraq '03), and the means must match the end (Libya '11 shift criticized).
      *   *Refining the Principles:*
          *   *Principle 1: Direct Protection vs. Coercive Regime Change.* (Endorse protection, reject regime change/coercion).
          *   *Principle 2: Credible Political Horizon.* (Who governs the morning after? Is there a plan?).
          *   *Principle 3: Operational Independence/Neutrality.* (Can aid be delivered without compromising humanitarian actors? Will it endanger other operations?).

      *   *Let's try to find the *joint* explanation.*
