answer: |-
  **Brainstorm**
  Committees typically invoke: restoration of species-typical function (Boorse); improvement in welfare or capabilities (welfarism/Nussbaum); the individual's baseline versus species average; positional or competitive goods (Sandell); authenticity and the value of giftedness (Sandel); and the distinction between acting on a person versus their circumstances. These criteria often conflict, creating the deadlock you face.

  **The Diagnostic Tree**
  To break the stalemate, answer these questions sequentially.

  1.  **Does the intervention restore species-typical functional organization?**
      *   **Yes** → Go to Q6.
      *   **No** → Go to Q2.
  2.  **Does it alleviate significant suffering or expand capabilities relative to the individual's prior baseline?**
      *   **No** → **Leaf 1: Unnamed (Trivial Enhancement).** *Diagnosis: Merely unattractive/medically irrelevant.*
      *   **Yes** → Go to Q3.
  3.  **Is the primary benefit a zero-sum competitive advantage over peers?**
      *   **Yes** → **Leaf 2: Positional-Goods Objection.**
      *   **No** → Go to Q4.
  4.  **Does it fundamentally alter core identity or undermine the 'giftedness' of human life?**
      *   **Yes** → **Leaf 3: Bioconservatism (Authenticity/Giftedness).**
      *   **No** → Go to Q5.
  5.  **Is the intervention prophylactic against statistically probable pathology?**
      *   **Yes** → **Leaf 4: Preventive/Public Health Account.**
      *   **No** → Go to Q7.
  6.  **(From Q1 Yes) Does it undermine authenticity or cultural identity (e.g., Deaf culture)?**
      *   **Yes** → **Leaf 5: Unnamed (Function/Authenticity Conflict).** *Diagnosis: Unexplored tension.*
      *   **No** → **Leaf 6: Normal-Functioning Account.**
  7.  **(From Q5 No) Does it expand opportunity sets without necessarily reducing suffering?**
      *   **Yes** → **Leaf 7: Capability-Based Account.**
      *   **No** → **Leaf 8: Liberal Welfarist.**

  *Note:* Leaf 5 (Function/Authenticity) and Leaf 6 (Normal-Functioning) strain against each other; biologically they are identical, but culturally distinct. I flag this explicitly: the tree cannot separate biological restoration from cultural imposition without external value judgments.

  **Case Analysis**
  *   **Methylphenidate (ADHD) & Cochlear Implant (Adult):** Both restore species-typical function without violating identity. They reach **Leaf 6 (Normal-Functioning)**. This is the clearest category; the pathology is internal, the restoration standard.
  *   **Vaccination:** Prophylactic against probable pathology. Reaches **Leaf 4 (Preventive)**. Distinct from treatment because the baseline is healthy, not dysfunctional.
  *   **Propranolol (Nurse) & Methylphenidate (Healthy Nurse):** No function restored (fatigue/focus are normal variations), but provides competitive advantage in zero-sum shift work. Reaches **Leaf 2 (Positional-Goods)**. Even if welfare improves, the competitive nature triggers the objection.
  *   **Propranolol (Violinist):** Similar to the nurse. Performance anxiety is species-typical; the drug offers competitive edge in auditions. Reaches **Leaf 2 (Positional-Goods)**. I place it here rather than Welfarist because the primary ethical friction is fairness, not suffering.
  *   **GH (Idiopathic Short Stature):** No function restored (shortness is statistical, not dysfunctional), reduces suffering/expands capability, non-competitive (generally), no authenticity violation. Reaches **Leaf 7 (Capability-Based)**. It expands opportunity sets (social height bias) without curing disease.
  *   **SSRI (Bereavement) & Guilt-Dulling Drug:** No function restored (grief/guilt are normal), reduces suffering, but alters core identity or the 'given' emotional response. Reaches **Leaf 3 (Bioconservatism)**. The tree flags these as ethically fraught due to authenticity concerns, even if welfare improves.
  *   **Propranolol (Assault Memories):** No function restored, reduces suffering, non-competitive. Does it violate authenticity? I decide **No**; trauma memories are pathological intrusions, not core identity. Reaches **Leaf 8 (Liberal Welfarist)**. This distinguishes it from bereavement; trauma relief is therapeutic, grief relief is existential.
  *   **Cochlear Implant (Deaf Infant) & Embryo Selection (Deaf Child):**
      *   *Cochlear:* Biologically restores function, but violates Deaf cultural identity. Reaches **Leaf 5 (Function/Authenticity Conflict)**. The tree exposes the clash: medicine says treat, culture says harm.
      *   *Embryo:* No function restored (to the couple), violates medical norms of welfare. Reaches **Leaf 3 (Bioconservatism)** via the 'giftedness' branch (accepting the child as given vs. designing), though it also fits Leaf 5's tension. I place it in Leaf 3 because the parental intent rejects the medical welfare baseline entirely.

  **Unoccupied Combinations**
  *   **Leaf 1 (Trivial):** Unoccupied by serious ethical theories. *Diagnosis:* Merely unattractive. No one argues trivial enhancements deserve medical resources.
  *   **Leaf 5 (Conflict):** Occupied only by edge cases (Deaf culture). *Diagnosis:* Unexplored tension. Most theories assume function and identity align; when they diverge, the tree breaks.
  *   **Unnamed (Restores Function but Harms Welfare):** Logically possible (e.g., restoring consciousness in permanent vegetative state against wishes). *Diagnosis:* Incoherent within medical ethics. Medicine presupposes welfare alignment.

  **Awkward Commitments**
  1.  **Normal-Functioning:** Pathologizes statistical minorities who suffer no disadvantage.
  2.  **Positional-Goods:** Permits enhancement if non-competitive, ignoring intrinsic fairness.
  3.  **Bioconservatism:** Privileges suffering if it is deemed 'authentic' or 'given'.
  4.  **Preventive:** Medicalizes healthy populations indefinitely based on probability.
  5.  **Function/Authenticity:** Forces choice between biological normativity and cultural integrity.
  6.  **Capability:** Risks expanding opportunities that reinforce harmful social norms (e.g., height).
  7.  **Liberal Welfarist:** Cannot distinguish therapy from enhancement morally, only pragmatically.
  8.  **Unnamed (Trivial):** Wastes resources on medically irrelevant desires.

  **Settled Judgement**
  This tree belongs in triage, not metaphysics. It strains most at Leaf 5 (Function/Authenticity), where biological restoration conflicts with cultural identity, revealing that 'function' is not value-neutral. The tree succeeds by forcing committees to admit when they are arguing about fairness (Positional) rather than health (Normal-Functioning). However, it cannot resolve the Deaf case without external cultural input, proving that metaphysics alone cannot settle ethical disputes where definitions of 'harm' diverge. Use it to expose the disagreement, not to solve it.
