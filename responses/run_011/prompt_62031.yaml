prompt: |-
  I run an upper-level metaphysics seminar on powers and dispositions — 14 students, one 100-minute block. They've had the simple conditional analysis in lecture (call something fragile iff it would shatter if struck, soluble iff it would dissolve if immersed, and so on) and most of them are privately convinced the standard counterexamples are verbal quibbles dressed up as philosophy. I want an in-class game that costs them that conviction, and I want them to lose it in play rather than in a lecture.

  The conceal I have in mind — steal it, change it, throw it out:

  Teams of 3-4. One team is the **analysts**: they must write down an explicit sorting rule for whether a mystery object has some disposition, using nothing but if-then clauses about what the object would do when tested. The other team is the **workshop**: they get a closed toolbox of imaginary devices and a few minutes to construct an object that either (a) really does have the disposition but the analysts' rule sorts as lacking it, or (b) really lacks it but gets sorted as having it. The toolbox is the load-bearing part, because I want the counterexamples to get *built* rather than waved at, so seed it with roughly the right resources: a field that switches an object's inner structure off the instant anything touches it, a field that switches it on, some packing that stops the stimulus ever arriving, something that neutralises the effect after the stimulus has landed, and a couple of plain-jane tools so the good stuff doesn't stand out. You can add or swap items, but every item should correspond to a real move in the literature and you should tell me which.

  Scoring should reward the workshop for counterexamples that are judged valid by some procedure you design (this is the part I'm most worried about — I don't want it degenerating into an argument about whether their object is "really" fragile, so give me a way to settle that quickly and a way to stop teams lawyering the rules). Also: I want a mechanic where the whole class records its gut verdict on each mystery object by secret ballot *before* anyone applies the analysts' rule to it, so the analysts can't quietly retrofit. Points, no real money needed, maybe some symbolic prize.

  Two full rounds minimum, so the analysts patch their rule and get broken again. What I'm hoping — tell me if it won't happen — is that their final patch converges on something like Lewis's move: keep the object's own intrinsic makeup fixed while you imagine the stimulus happening. That's a great place to land, because the debrief can then ask what that clause is really doing, and whether they've analysed the disposition or just banned the workshop's best tools. I'd also like the game to end up reproducing the fact that this kind of patch handles the switch-off device but *still* gets beaten by the packing device — that asymmetry is one of the things I most want them to walk out with, and if the ruleset can't produce it naturally, say so.

  They shouldn't hear the words fink, mask, or antidote until the debrief. In the debrief I want the map from each toolbox item to its name and to which objection it is, the question of what the analysts' final clause bought them, and an explicit moment where you make them notice that they could have skipped the whole exercise by just looking at what the object is made of — I expect at least one team to reach for microstructure and I want to know whether to allow it, forbid it, or price it as a purchasable card, since appealing to composition is obviously a different analysis and that's a conversation worth having rather than suppressing.

  Deliverables: full ruleset, materials list (I have index cards, a whiteboard, and a printer), scoring, a minute-by-minute timeline that fits 100 minutes including the debrief, what to do with 13 or 15 students, the debrief script or at least its beats, an honest list of what will predictably go wrong the first time I run it and how to recover on the fly, and — this matters most — a straight answer on which feature of the real problem the game cannot reproduce and that I'll have to supply myself in words. My guess is that in the game the students are always allowed to peek inside the object, whereas the actual question is whether there's anything in there to peek at. Tell me if that's the right worry or if there's a worse one I'm not seeing.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar game:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level metaphysics seminar (14 students, 100 mins). Topic: Powers/Dispositions, specifically the Simple Conditional Analysis (SCA).
      *   **Problem:** Students think SCA counterexamples (finks, masks, antidotes) are verbal quibbles.
      *   **Goal:** An in-class game where students *build* counterexamples against a team trying to defend SCA.
      *   **Core Mechanic:** "Analysts" (defend SCA with if-then rules) vs. "Workshop" (build objects using specific "tools" that mimic finks/masks/antidotes).
      *   **Specific Constraints:**
          *   Teams of 3-4.
          *   Toolbox items must map to literature moves.
          *   Scoring must prevent "lawyering" (use secret ballot for gut verdicts).
          *   Two rounds minimum (Analysts patch rules).
          *   Desired Outcome: Analysts converge on something like Lewis's "intrinsicality" clause, but still fail against masks (asymmetry).
          *   Debrief: Map tools to terms (fink, mask, antidote), discuss the "intrinsic" clause, discuss microstructure/composition.
          *   Deliverables: Rules, materials, scoring, timeline, odd-number adjustment, debrief script, predicted failures/recovery, and the "one thing the game can't do."
      *   **User's Worry:** The game allows peeking inside the object, whereas the real philosophical problem is about whether there *is* anything inside to peek at (categorical bases).

  2.  **Deconstruct the Game Mechanics:**
      *   *The Analysts:* Need to write a conditional rule. $D(x) \iff (S(x) \rightarrow M(x))$. They will try to patch this.
      *   *The Workshop:* Need to construct a scenario/object description using "Tool Cards."
      *   *The Verdict:* The class votes *before* the rule is applied. This is crucial. It establishes the intuition that the rule is supposed to capture. If the rule contradicts the vote, the Workshop scores.
      *   *The Toolbox:* Needs to represent Finks (disposition disappears upon stimulus), Masks (disposition stays but effect is blocked), Antidotes (effect happens but is neutralized).
      *   *Scoring:* Needs to be simple. Analysts win if Rule matches Vote. Workshop wins if Rule mismatches Vote.

  3.  **Address the "Peeking" Worry:**
      *   The user worries: "In the game the students are always allowed to peek inside the object, whereas the actual question is whether there's anything in there to peek at."
      *   *Analysis:* This is a deep worry. The SCA debate is often about whether dispositions *reduce* to conditionals or require a categorical base. If the Workshop describes the "inner structure," they are implicitly assuming a categorical base exists. The Analysts are trying to define the disposition *without* reference to that base (purely behaviorally/conditionally).
      *   *Resolution:* The game *should* allow the Workshop to specify inner structure because that's how Finks/Masks work (they change the structure or the environment). The real issue isn't "can we peek," it's "does the conditional analysis capture the truth *independent* of the peeking." The game actually highlights this: if the Analysts have to add "holding the base fixed" to their rule, they are admitting the conditional isn't enough on its own. I need to make sure the "Tool Cards" force the Workshop to describe *changes* to the base or environment, not just the base itself.
      *   *Correction to User's Worry:* The bigger issue the game might miss is the *normative* or *teleological* aspect of some dispositions, or the fact that Lewis's fix presupposes we know what the "base" is without using the disposition term. But the user's specific worry about "peeking" is actually a feature, not a bug, *if* framed correctly. The game shows that to make the conditional work, you need to reference the non-conditional (intrinsic) facts. I will address this in the "What the Game Cannot Do" section.

  4.  **Drafting the Rules & Materials:**
      *   *Teams:* 14 students. 3 teams of 3, 1 team of 5? Or 2 Analysts, 2 Workshops? Let's go with 2 Analyst Teams and 2 Workshop Teams (4 teams total, ~3-4 students each). This creates competition.
      *   *Tools:*
          *   "Structural Shifter" (Fink): Disposition vanishes when stimulus applied.
          *   "Force Field" (Mask): Stimulus applied, disposition present, effect blocked.
          *   "Neutralizer" (Antidote): Effect happens, but is cancelled immediately.
          *   "Decoy" (Mimic): No disposition, but effect happens anyway (standard SCA failure).
          *   "Lock" (Standard): Normal disposition.
      *   *Scoring:*
          1.  Workshop presents Object + Tools.
          2.  Class votes (Gut Check): Does it have the disposition? (Yes/No).
          3.  Analysts apply Rule.
          4.  Match = Analyst Point. Mismatch = Workshop Point.
      *   *Rounds:*
          *   Round 1: Naive SCA.
          *   Round 2: Patched SCA (Ceteris Paribus or Intrinsic).
          *   Round 3 (Optional/Time permitting): The "Mask" round.

  5.  **Timeline (100 Minutes):**
      *   0-10: Setup & Rules.
      *   10-25: Round 1 (Build & Break).
      *   25-35: Analysts Patch.
      *   35-50: Round 2 (The Patch Test).
      *   50-60: Break/Debrief Prep.
      *   60-90: Debrief (Mapping to Literature).
      *   90-100: The "Microstructure" Twist & Conclusion.

  6.  **Refining the "Asymmetry" (Fink vs. Mask):**
      *   The user wants the game to show that Lewis's fix (hold intrinsic properties fixed) kills Finks but *not* Masks.
      *   *Mechanism:* The "Structural Shifter" (Fink) changes the object *during* the stimulus. If the rule says "Hold structure fixed," the Fink is neutralized.
      *   *Mechanism:* The "Force Field" (Mask) leaves the structure fixed but blocks the *manifestation*. Holding structure fixed doesn't help. The conditional still says "If struck, shatter," but the field stops the shattering.
      *   *Wait:* If the field stops the shattering, the conditional "If struck, shatter" is false. So SCA says "Not Fragile." But intuition says "Fragile (but masked)."
      *   *Game Logic:* Workshop builds "Fragile Glass + Force Field." Class votes "Fragile." Analyst Rule (even patched) says "If struck -> Shatter." Result: No Shatter. Rule says "Not Fragile." Mismatch. Workshop wins.
      *   *Crucial Detail:* The Analysts need to try to patch the rule to handle Masks. They usually can't without giving up on pure conditionals. This is the winning move for the seminar.

  7.  **Addressing the "Odd Number" (14 is even, but user asked for 13 or 15):**
      *   14 is fine (2 teams of 3, 2 teams of 4).
      *   If 13: One team of 3, three teams of 3? Or one observer/judge role. Let's suggest a "Judge" role for the odd student out who manages the ballot box.
      *   If 15: Three teams of 5? Or one team of 3, three of 4. Let's stick to 2 Analyst / 2 Workshop structure for symmetry, absorb extra students into teams.

  8.  **Debrief Script:**
      *   Map cards to names (Fink, Mask, Antidote).
      *   Discuss the "Intrinsic" clause (Lewis).
      *   Discuss the "Microstructure" move (Armstrong/Realism).
      *   Address the "Peeking" worry explicitly.

  9.  **Predicted Failures:**
      *   Analysts write vague rules ("normal conditions"). Workshop exploits "normal."
      *   Workshop builds nonsense.
      *   Voting takes too long.
      *   Students conflate "Fragile" with "Shattered."
      *   *Recovery:* Instructor acts as "Supreme Court" on rule clarity. Enforce strict "If... Then..." syntax.

  10. **The "One Thing The Game Cannot Do":**
      *   User's guess: Peeking.
      *   My assessment: The game *relies* on peeking (Workshop knows the setup). The real philosophical problem is that *in reality* we often don't know the categorical base. But the deeper issue is **Circularity**. To define "Intrinsic Base," you often need to reference dispositions anyway. The game can't show that the "Intrinsic" clause might be empty or circular without a prior theory of powers. I need to highlight this. The game shows *that* we need a base, not *what* a base is or if we can identify it without disposition talk.

  11. **Final Polish:**
      *   Make the Tool Cards concrete.
      *   Ensure the Scoring is bulletproof against lawyering (The Vote is King).
      *   Check timing. 100 mins is tight for 2 rounds + deep debrief. I'll compress the build time.

  12. **Review against constraints:**
      *   14 students? Yes.
      *   100 mins? Yes.
      *   No "Fink/Mask" words until debrief? Yes.
      *   Secret ballot? Yes.
      *   Asymmetry (Fink solved, Mask remains)? Yes.
      *   Microstructure conversation? Yes.

  Let's write it.
answer: |-
  This is a sharp design challenge. You want the students to feel the *pressure* of the counterexamples, not just hear about them. The game structure you proposed is solid, but it needs tight constraints to prevent the "verbal quibble" defense from resurfacing during play.

  Here is the full package: **The Disposition Workshop.**

  ### 1. The Core Mechanic: "The Vote is King"
  To stop the "lawyering" (e.g., *"Well, technically, if the field is on, it's not a 'normal' strike..."*), you must decouple the **Intuition** from the **Rule**.
  *   **Step 1:** Workshop presents the object and its setup.
  *   **Step 2:** **Secret Ballot.** The class votes: *Does this object have the disposition (e.g., Fragility)?* (Yes/No).
  *   **Step 3:** Analysts apply their written Rule to the setup.
  *   **Step 4:** Scoring. If the Rule's output matches the Majority Vote, Analysts get a point. If it mismatches, Workshop gets a point.
  *   **Why this works:** It prevents Analysts from arguing that the object *isn't* fragile. The class has already decided it is. The Analysts' job is solely to make their math match the class's gut.

  ### 2. Materials List
  *   **Index Cards (3x5):** Two colors. Blue for "Analyst Rules," Red for "Workshop Builds."
  *   **Tool Cards (Printed):** 5 types (see below). 3 copies of each.
  *   **Ballot Slips:** Small scraps of paper.
  *   **Whiteboard:** To track scores and write the "Current Rule."
  *   **Timer:** Visible to all.

  ### 3. The Toolbox (The Counterexamples)
  Each card describes a physical modification. The Workshop must play at least one Tool Card when building an object.

  1.  **The Trigger-Shifter (The Fink):** *"When the stimulus occurs (e.g., striking), this device instantly alters the object's internal structure so the disposition is lost before the effect can happen."*
      *   **Literature:** Martin's Fink / Disposition Removal.
  2.  **The Barrier (The Mask):** *"The object retains its structure, but a field prevents the effect from manifesting (e.g., stops shards from flying) even if the stimulus lands."*
      *   **Literature:** Johnston's Masks.
  3.  **The Neutralizer (The Antidote):** *"The effect happens (e.g., chemical reaction occurs), but a second substance immediately cancels the observable outcome."*
      *   **Literature:** Antidotes (often grouped with Masks, but distinct in chemistry cases).
  4.  **The Mimic (The False Positive):** *"The object lacks the structure, but an external device simulates the effect perfectly when stimulated."*
      *   **Literature:** Standard SCA failure (Electrofink style).
  5.  **The Standard (Control):** *"No modifications. Ordinary causal structure."*
      *   **Literature:** The baseline intuition.

  ### 4. Ruleset & Scoring
  **Teams:**
  *   **Analysts (2 Teams, 3-4 students each):** Their goal is to write a conditional rule that matches the class's intuition.
  *   **Workshop (2 Teams, 3-4 students each):** Their goal is to build scenarios where the Analysts' rule fails.
  *   *(Note: With 14 students, this creates 4 teams of 3-4. If you have 13, make one student the "Ballot Clerk" who counts votes. If 15, add a 5th member to a Workshop team.)*

  **The Disposition:** Fix the disposition for the whole game. **FRAGILITY** (Disposition: To shatter. Stimulus: Being struck.)

  **Round Flow:**
  1.  **Build (5 mins):** Workshop teams select Tool Cards and write a 2-sentence description of an object on a Red Card. (e.g., *"A glass vase + Trigger-Shifter."*)
  2.  **Vote (2 mins):** Analyst teams submit their current Rule on Blue Cards (kept secret). Workshop reads their Build aloud. Class votes secretly on Fragility (Yes/No). Instructor tallies majority.
  3.  **Apply (3 mins):** Analysts reveal their Rule. They must apply it to the Build on the board.
  4.  **Score (2 mins):**
      *   If Rule Output == Majority Vote: Analyst Team gets 1 point.
      *   If Rule Output != Majority Vote: Workshop Team gets 1 point.
  5.  **Patch (5 mins):** Analysts can rewrite their Rule for the next round. Workshop keeps their Tools.

  **Winning:**
  *   Workshop wins if they break the rule twice.
  *   Analysts win if they survive two rounds without a mismatch.
  *   (Realistically, Workshop will win. The prize is symbolic: "Metaphysical Immunity" — they get to choose the topic for the first 5 mins of next week's seminar).

  ### 5. Minute-by-Minute Timeline (100 Minutes)

  *   **00-10: Setup.** Explain rules. Emphasize: *"You cannot argue about the vote. The vote is the data. Your rule must fit the data."* Distribute teams.
  *   **10-25: Round 1 (Naive SCA).**
      *   Analysts start with: *"x is fragile iff if x were struck, x would shatter."*
      *   Workshop builds: **Mimic** (Plastic vase + explosion pack) and **Trigger-Shifter** (Glass + wizard who makes it soft when struck).
      *   Vote: Class says Mimic = Not Fragile; Shifter = Fragile.
      *   Rule says: Mimic = Fragile (shatters); Shifter = Not Fragile (doesn't shatter).
      *   **Result:** Workshop crushes Analysts.
  *   **25-35: The Patch.** Analysts confer. They will try to add "Normal Conditions" or "Intrinsic Properties." Instructor must enforce strict syntax. No "usually." Must be "If... Then..."
  *   **35-50: Round 2 (The Lewis Patch).**
      *   Analysts likely propose: *"x is fragile iff x has an intrinsic structure S such that if x were struck (and S remained fixed), x would shatter."*
      *   Workshop builds: **The Barrier (Mask)**. (Glass vase + Force Field that catches shards).
      *   Vote: Class says **Fragile** (It's glass, the field is external).
      *   Rule says: **Not Fragile** (If struck, it does *not* shatter because of the field).
      *   **Result:** Workshop wins again. The asymmetry is revealed: The "Intrinsic" clause fixed the Shifter (Fink) but not the Barrier (Mask).
  *   **50-60: Buffer/Transition.** Collect cards. Reset board.
  *   **60-90: The Debrief (The Meat).** (See Script below).
  *   **90-100: The Microstructure Twist.** (See Script below).

  ### 6. Debrief Script & Beats

  **Beat 1: Naming the Beasts (60-70 mins)**
  *   "Look at the Tool Cards that broke the Analysts."
  *   Reveal the names: **Trigger-Shifter = Fink.** **Barrier = Mask.** **Neutralizer = Antidote.**
  *   "Why did the Analysts' first rule fail?" (Elicits: Because consequences aren't the same as dispositions.)
  *   "Why did the second rule fail?" (Elicits: Because you can have the disposition and be stopped from showing it.)

  **Beat 2: The Lewis Move (70-80 mins)**
  *   "In Round 2, many of you added a clause about 'holding the structure fixed' or 'intrinsic properties.' What did that buy you?"
  *   *Answer:* It killed the Fink. The Fink works by *changing* the structure mid-strike. If you stipulate the structure stays fixed, the Fink card is illegal.
  *   "Did it kill the Mask?"
  *   *Answer:* No. The Mask leaves the structure fixed. It interferes *after* the causal chain starts or blocks the output.
  *   **Key Takeaway:** The Conditional Analysis requires a *Ceteris Paribus* clause about intrinsic bases to survive Finks. But that clause doesn't solve Masks.

  **Beat 3: The Microstructure Twist (80-90 mins)**
  *   "One of you might be thinking: 'Why are we talking about conditionals at all? Why not just say Fragile = Has a crystalline lattice structure'? Why didn't the Analysts just define the disposition by looking inside?"
  *   *Discussion:* This leads to **Categoricalism vs. Dispositionalism.**
  *   If you define fragility by microstructure, you avoid the conditional problems. But now you have to explain what *makes* that microstructure the fragility-base. Is it *its* disposition to shatter? If so, you've just pushed the problem back one step.
  *   **The "Peeking" Answer:** (Addressing your worry). "In the game, you were allowed to peek at the Tool Cards. In the real world, we often don't know the base. But more importantly: If you define 'Fragile' as 'Has Lattice L,' you have changed the subject. You are no longer analyzing the *concept* of fragility (which is about what things *do*); you are identifying its *cause*. The SCA tries to tell us what we *mean* by fragility. The Microstructure view tells us what *makes* things fragile."

  **Beat 4: Conclusion (90-100 mins)**
  *   Summarize the asymmetry: Finks attack the *connection* between stimulus and base. Masks attack the *connection* between base and manifestation.
  *   Final thought: "If the conditional analysis needs to reference the intrinsic base to work, is it still a *conditional analysis*? Or is it just a disguised realism about powers?"

  ### 7. Predicted Failures & Recovery

  **Failure 1: Analysts use "Normal Conditions."**
  *   *Symptom:* Rule says "If struck in normal conditions..."
  *   *Recovery:* Stop play immediately. Ask Workshop: "Is a force field 'normal'?" If Analysts say "No," they are defining "normal" as "conditions where it shatters." That is circular. Force them to specify *what* makes conditions normal (e.g., "intrinsic properties fixed").

  **Failure 2: Workshop builds "Impossible" objects.**
  *   *Symptom:* "A vase that is struck but never experiences force."
  *   *Recovery:* Instructor veto. The stimulus must occur. The question is what happens *given* the stimulus.

  **Failure 3: The Vote splits 50/50.**
  *   *Symptom:* Class can't decide if the Masked Glass is fragile.
  *   *Recovery:* Instructor casts the tie-breaking vote based on the "Standard Intuition" (Masked glass is fragile). Remind them: "We are testing the rule against standard intuitions, not generating new ones."

  **Failure 4: Time overrun.**
  *   *Recovery:* Cut Round 2 build time to 3 minutes. If debrief is tight, skip the "Antidote" distinction and group it with Masks.

  ### 8. The "One Thing The Game Cannot Do"

  You asked for a straight answer on the feature of the real problem the game cannot reproduce.

  **Your worry:** *"In the game the students are always allowed to peek inside the object, whereas the actual question is whether there's anything in there to peek at."*

  **My verdict:** That is **not** the biggest worry. The game *needs* them to peek to understand the Fink/Mask distinction. The real thing the game cannot reproduce is **The Circularity of the 'Intrinsic Base'.**

  **The Problem:**
  In the game, when Analysts patch their rule to say *"Hold the intrinsic structure fixed,"* the students treat "intrinsic structure" as obvious. They assume we all know what the "structure" is independent of what the object *does*.
  In the actual metaphysics, this is the hard part. How do you identify the "intrinsic base" of fragility without referencing fragility (or other dispositions)?
  *   If you say "The molecular bonds," a skeptic asks: "What makes those bonds the fragility-base?"
  *   If you say "The bonds that cause shattering," you have used the disposition to define the base, which you then use to define the disposition. **Circularity.**

  **How to supply this in words:**
  In the debrief (Beat 3), you must explicitly point out: *"In the game, the Workshop told you what the structure was. In reality, the Conditional Analyst owes us an account of what the 'intrinsic base' is that **does not** rely on dispositional language. If they can't give that, their 'patched' analysis is empty. They haven't analyzed dispositions; they've just said 'Dispositions are conditionals grounded in... whatever grounds dispositions.'”*

  This is the gap the game simulates but cannot fully instantiate: the difficulty of **non-dispositional identification of the categorical base.** The game assumes the base is knowable (via the Tool Cards). The real philosophical crisis is that it might not be.

  ### 9. Adjustment for 13 or 15 Students

  *   **13 Students:**
      *   2 Analyst Teams (3 students each).
      *   2 Workshop Teams (3 students each).
      *   1 **Arbiter.** This student manages the ballot box, enforces the timer, and has the tie-breaking vote on intuitions. This is a desirable role; it keeps them engaged without forcing a 5th member into a tight team.
  *   **15 Students:**
      *   2 Analyst Teams (4 students each).
      *   2 Workshop Teams (4 students each).
      *   1 **Scribe.** This student writes the "Current Rule" on the whiteboard after every round. This ensures the rule is public and immutable during the scoring phase, preventing "We meant to write..." retrofits.

  ### 10. Final Check on the Asymmetry
  Does this ruleset naturally produce the Fink/Mask asymmetry?
  *   **Yes.**
  *   **Round 1:** Analysts use Simple Conditional. Workshop plays **Fink** (Structure changes). Rule fails (Predicts shatter, doesn't happen). Analysts patch: "Hold structure fixed."
  *   **Round 2:** Analysts use Patched Conditional. Workshop plays **Mask** (Structure fixed, effect blocked). Rule fails (Predicts no shatter, intuition says fragile).
  *   **Why:** The "Hold structure fixed" clause legally prohibits the Fink card (since the Fink *changes* structure). But it *allows* the Mask card (since the Mask *preserves* structure).
  *   **Result:** The game mechanics force the Analysts into the exact philosophical corner Lewis found themselves in. They solve the Fink by fiat, but the fiat doesn't cover the Mask.

  This should cost them their conviction. They will leave seeing that the "verbal quibbles" are actually structural failures of the analysis.
