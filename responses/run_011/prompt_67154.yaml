  # JOINT STATEMENT ON COHERENCE ARGUMENTS AND AGENCY

  ## PART I: JOINT CLAIMS

  The undersigned parties, representing the strong reading (Party A) and the deflationary reading (Party B) of coherence theorems, affirm the following eight claims. These claims represent the substantive common ground regarding the mathematics, the empirical reality of agents, and the specific scenarios tested during this collaboration.

  1.  **Mathematical Validity:** The representation theorems (linking preferences to utility and probability) and the Dutch book/money-pump arguments (linking incoherence to sure loss) are mathematically valid within their stated axiomatic systems. Neither party disputes the internal logic of the derivations.
  2.  **Conditionality:** The conclusions of these theorems hold if and only if the premises (completeness, transitivity, continuity, independence) are satisfied. If an agent violates a premise, the theorem does not mathematically compel the conclusion for that agent without modification.
  3.  **Case 1 (Cyclic Preferences):** In scenarios where an agent has cyclic pairwise preferences (A>B>C>A) but refuses trading sequences that return to the start with less money, both parties agree the agent avoids resource loss. The parties disagree on whether this "sophistication" constitutes coherence or merely avoids the *consequence* of incoherence.
  4.  **Case 2 (Label Rules):** In scenarios where an agent chooses based on superficial labels rather than outcome content, both parties agree a utility function can be mathematically constructed to represent this behavior. The parties disagree on whether such a representation is informative about the agent's goals regarding the outcomes.
  5.  **Case 3 (Continuity):** In scenarios where an agent refuses any probability-weighted trade-off for a specific loss (violating continuity), both parties agree the standard expected utility representation fails. The parties disagree on whether this indicates a bounded agent requiring a new vocabulary or a refutation of the normativity of the axiom.
  6.  **Case 4 (Risk Aversion):** In scenarios where an agent is thoroughly coherent and thoroughly risk-averse, both parties agree this behavior is fully consistent with expected utility maximization. Risk aversion is not a violation of coherence but a feature of the curvature of the utility function over wealth or outcomes.
  7.  **Exploitability is Environmental:** Whether an incoherent agent actually loses resources depends on the environment. A money pump requires a counterparty willing and able to offer the specific sequence of trades at the agent's stated rates. In the absence of such a counterparty, incoherence may persist without cost.
  8.  **Boundedness is Real:** Natural and artificial agents operate under computational, informational, and temporal constraints. Observed violations of coherence axioms in humans are consistent with the costs of maintaining coherence exceeding the benefits in specific environments.

  ## PART II: DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. For each row, the Neutral column states the issue without loading language. The Party A and Party B columns state how each party characterizes the issue in their own terms. The Final Column states the empirical or logical condition that would validate each party's wording.

  | Disagreement | Neutral Statement | Party A (Strong Reading) Wording | Party B (Deflationary Reading) Wording | Conditions for Truth |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Normative Force** | Do the theorems prescribe how agents *ought* to behave, or describe how they *can* be modeled? | The theorems establish normative constraints on successful agency; violations are errors that invite loss. | The theorems establish existence conditions for a specific mathematical representation; violations are simply features outside that model. | **A is correct if:** In the long run, all surviving agents converge to coherence regardless of environment.<br>**B is correct if:** Incoherent agents survive and thrive in environments lacking specific pump mechanisms. |
  | **2. Representation Triviality** | Can any behavior be modeled as utility maximization? | Only if the utility function tracks the *relevant* outcomes. A function over irrelevant labels is a vacuous representation. | Any deterministic behavior can be represented as maximizing a utility function over the space of choices. The theorem is structurally empty without constraints on the outcome space. | **A is correct if:** There is an objective fact about which outcome descriptions are "relevant" independent of the agent's choices.<br>**B is correct if:** "Relevance" is itself a preference that can be baked into the utility function without loss of generality. |
  | **3. Sophistication (Case 1)** | Does refusing a money pump via menu-awareness restore coherence? | Yes. The agent effectively maximizes utility over *paths* or *menus*, restoring transitivity at the higher level of description. | No. The underlying pairwise preferences remain intransitive. The agent is merely avoiding the cost, not resolving the structural inconsistency. | **A is correct if:** The agent's choices over menus satisfy the axioms of choice under uncertainty.<br>**B is correct if:** The agent's pairwise preferences remain intransitive when isolated from the sequence context. |
  | **4. Continuity (Case 3)** | What does a violation of continuity imply? | It implies the agent is using a bounded vocabulary to describe an unbounded preference, or requires a vector-valued utility representation. | It implies the axiom is not a universal normative requirement. Some values are lexicographic and non-tradable at any odds. | **A is correct if:** A richer state-space description restores continuity.<br>**B is correct if:** No refinement of the state-space eliminates the lexicographic ordering. |
  | **5. Source of Pressure** | What drives agents toward coherence? | Internal rational pressure. Incoherence is a cognitive dissonance that agents are driven to resolve to function. | External evolutionary or market pressure. Agents are driven to coherence only if the environment punishes incoherence. | **A is correct if:** Isolated agents self-correct incoherence without external feedback.<br>**B is correct if:** Isolated agents retain incoherence until penalized by external selection. |

  ## PART III: CRUXES

  The following sub-questions represent the live wires of the debate. Settling these would significantly shift the weight of the argument. For each crux, we identify the bearing evidence, advance predictions, and define failure conditions. No statistics are invented; blanks indicate quantities to be determined by future inquiry.

  **Crux 1: The Prevalence of Pumps**
  *   **The Question:** How frequently do real-world environments offer the specific sequence of trades required to exploit incoherence?
  *   **Bearing Evidence:** Market data on arbitrage opportunities involving human traders; experimental economics data on repeated money-pump exposure.
  *   **Party A Prediction:** In competitive markets, the frequency of exploitable incoherence will approach ____% because arbitrageurs eliminate it.
  *   **Party B Prediction:** In competitive markets, the frequency of exploitable incoherence will remain around ____% because transaction costs prevent pump completion.
  *   **Failure Condition:**
      *   **A fails if:** Significant incoherence persists in high-liquidity markets over long time horizons.
      *   **B fails if:** Incoherence disappears in markets even when transaction costs are artificially lowered to near zero.

  **Crux 2: The Completeness Axiom**
  *   **The Question:** Is the requirement that an agent must have a preference between *any* two options (completeness) a necessary feature of agency or an artifact of the model?
  *   **Bearing Evidence:** Behavioral studies on choice deferral, "I don't know" responses, and neural correlates of decision formation.
  *   **Party A Prediction:** Apparent incompleteness is actually a preference for information gathering; given sufficient time, preferences will resolve in ____% of cases.
  *   **Party B Prediction:** Genuine incompleteness will persist in ____% of cases even with infinite time and information, due to value incommensurability.
  *   **Failure Condition:**
      *   **A fails if:** Agents consistently refuse to choose even when information costs are zero.
      *   **B fails if:** Agents can be forced to choose randomly, and that random choice integrates into a coherent utility function.

  **Crux 3: The Cost of Coherence**
  *   **The Question:** What is the computational cost of maintaining coherence relative to the cost of being pumped?
  *   **Bearing Evidence:** Computational complexity analysis of preference sorting; resource expenditure in biological systems.
  *   **Party A Prediction:** The cost of maintaining coherence scales logarithmically with the number of options, making it cheap for sophisticated agents.
  *   **Party B Prediction:** The cost of maintaining coherence scales exponentially with the number of options, making it prohibitive for bounded agents.
  *   **Failure Condition:**
      *   **A fails if:** The computational burden of checking transitivity exceeds the expected loss from pumps for agents with >____ options.
      *   **B fails if:** Simple heuristics are found that maintain coherence with constant-time overhead.

  **Analysis of Four Scenarios (Joint Resolution)**
  *   **Case 1 (Cycles):** Jointly identified as a test of *level of description*. A claims coherence is restored at the menu level; B claims the base intransitivity remains the fundamental fact.
  *   **Case 2 (Labels):** Jointly identified as a test of *representation vacuity*. A claims utility must track causal outcomes; B claims utility tracks choice regardless of causality.
  *   **Case 3 (Continuity):** Jointly identified as a test of *axiom universality*. A claims this is a modeling error; B claims this is a feature of value.
  *   **Case 4 (Risk):** Jointly identified as a *control*. Both parties agree this is coherent. This confirms the dispute is not about risk aversion, but about the necessity of the form.

  ## PART IV: VERBAL DISPUTES

  Much of the apparent disagreement stems from divergent definitions of key terms. Fixing this vocabulary clarifies that the dispute is not about the mathematics, but about the mapping of mathematics to reality.

  **1. "Agent"**
  *   **Party A Usage:** A system that acts to achieve goals. If a system cannot be modeled as having goals (utility), it is not an agent in the relevant sense, but a random process or a force of nature.
  *   **Party B Usage:** Any system that makes selections from a set of options. This includes thermostats, humans, and algorithms, regardless of whether those selections map to a consistent goal.
  *   **Resolution:** The argument should distinguish between *Selection Systems* (Party B's definition) and *Goal-Directed Agents* (Party A's definition). The theorems apply necessarily only to the latter, but Party B argues the former is the only empirically observable category.

  **2. "Coherence"**
  *   **Party A Usage:** Satisfaction of the axioms (transitivity, completeness, etc.) over a relevant domain. Incoherence is a structural flaw in the agent's decision architecture.
  *   **Party B Usage:** A property of the *model* used to describe the agent, not the agent itself. An agent is "coherent" only relative to a specific description of outcomes and probabilities.
  *   **Resolution:** Distinguish between *Axiomatic Coherence* (internal consistency of preferences) and *Representational Coherence* (existence of a utility function). Party A argues the former causes the latter; Party B argues the latter can be fabricated without the former.

  **3. "Exploitable"**
  *   **Party A Usage:** Vulnerable in principle. If a counterparty *could* exist who would pump the agent, the agent is exploitable, even if no such counterparty is currently present.
  *   **Party B Usage:** Vulnerable in practice. An agent is only exploitable if the environment actually contains the mechanism to extract resources.
  *   **Resolution:** Distinguish between *Theoretical Exploitability* (existence of a Dutch Book strategy) and *Empirical Exploitability* (actual resource loss). Party A treats the former as normative; Party B treats only the latter as relevant.

  **4. "Utility"**
  *   **Party A Usage:** A latent variable that *causes* or *explains* the choices. It represents the agent's valuation of the world.
  *   **Party B Usage:** A mathematical function that *fits* the choices. It is a descriptive tool, not necessarily a causal mechanism.
  *   **Resolution:** The dispute reduces to whether utility is *ontological* (Party A) or *instrumental* (Party B). If utility is merely instrumental, the theorems lose their prescriptive force for AI alignment or normative economics.

