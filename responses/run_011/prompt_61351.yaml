          *   On (5): It doesn't sink it, but it forces a distinction between collaboration and aggregation. Don't try to save the committee; ditch it.
          *   On (4-7): This is where it bleeds. The symmetry claim is false. The AI doesn't treat inputs as *reasons*, it treats them as *data*. The normative gap (Gilbert) is real. You can't deflate Gilbert away.
          *   On Interest: It's worth pursuing. It's not a truism. It's a functionalist challenge to orthodoxy.

  5.  **Refining the Critique (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm defending Bratman/Gilbert dogmatically. The user wants to know if *their* argument holds.
