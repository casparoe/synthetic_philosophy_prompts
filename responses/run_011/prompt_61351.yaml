      *   *Style:* Ensure British spelling (colour, labelled, programme - though maybe not needed here), idioms ("cut of your jib," "dead in the water").

  6.  **Final Polish:** Check against constraints. No bibliography. British English. Blunt.

      *   *Point 1 (Meshing):* You're right that static meshing is weak. But Bratman includes mutual responsiveness. Your "revisability" is just a specific *kind* of responsiveness. Don't act like you've discovered fire.
      *   *Point 2 (Committee):* Don't try to save the committee. Accept the cost. It distinguishes *joint action* from *collective decision*. That's a feature, not a bug.
      *   *Point 3 (The Rot):* It starts at 4. The symmetry claim is nonsense. The AI doesn't revise because it accepts a reason; it revises because it minimises loss functions. That's a causal chain, not a normative one.
