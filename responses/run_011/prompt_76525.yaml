  **Mark: 15/25**

  **General Assessment**
  You have a strong grasp of the general themes (common good, definition of tyranny) and your essay is well-structured. However, per the grading calibration, marks above 20 require precise accuracy regarding Aquinas's specific philosophical arguments. While you correctly identify the relevant texts, you attribute several arguments to Aquinas that he does not make, conflating his views with later scholastics or other medieval authors. These are not minor slips; they concern the core moral mechanism of the answer.

  **Confident Errors (Factual/Textual)**
  *These points are objectively incorrect based on the primary texts and would not hold up under specialist scrutiny.*

  1.  **Double Effect Application (ST II-II q.64 a.3):** You claim Aquinas covers tyrannicide under the same doctrine as self-defense (double effect), where the death is "beside the intention." Aquinas does **not** make this link. In q.64 a.3, he discusses private self-defense against an immediate physical aggressor. He does not apply this reasoning to political tyrannicide in the *Summa* or *De Regno*. This is a common modern extrapolation, but it is not Aquinas's own argument.
  2.  **The "Beast" Analogy as Juridical Loophole:** You state Aquinas argues "one does not commit homicide against a beast." While Aquinas (following Aristotle) describes tyrants as beast-like, he never argues that this removes the moral status of homicide. He argues that removing a tyrant is not *sedition*, not that it isn't killing a human. This specific justification is not found in the text.
  3.  ***De Regno* Authorship and Content:** You cite Book II of *De Regno* for Aquinas's view on conditional power. *De Regno* is unfinished; Book I is by Aquinas, but Book II is widely accepted by scholars to be by Ptolemy of Lucca. Attributing Book II's arguments to Aquinas is a significant textual error. Furthermore, in Book I (the authentic section), Aquinas is far more restrictive than you suggest: he warns against private individuals killing tyrants and emphasizes recourse to public authority or God, rather than stating the community "must act."
  4.  **Public vs. Private Authority:** You suggest the prohibition on disturbing the peace "no longer binds" generally. Aquinas is specific: it does not bind *public authority* to depose a tyrant, but he explicitly discourages *private* presumption. Your answer blurs this distinction, making Aquinas sound more permissive of vigilante action than he is.

  **Debatable/Interpretive Points**
  *A specialist might disagree on these interpretations, but they are weakened by the errors above.*

  1.  **Aquinas vs. John of Salisbury:** You argue Aquinas is the "first" to supply a principled justification, dismissing Salisbury as mere "exhortation." Many specialists argue Salisbury (*Policraticus*) provides a systematic justification earlier than Aquinas. Your claim is defensible only if you prove Aquinas's *theory* is superior, but since your explanation of Aquinas's theory contains errors (see above), this comparison currently fails.
  2.  **Prudence vs. Principle:** You argue Aquinas's warnings are only about timing (prudential), not principle. Some scholars argue Aquinas sees the preservation of order as a principled constraint that often outweighs the removal of a tyrant. This is interpretive, but your reading is overly optimistic about Aquinas's willingness to endorse removal.

  **Actionable Feedback (What to Fix)**
  *   **Correct the Moral Mechanism:** Remove the reference to double effect (q.64 a.3) regarding tyrannicide. Focus instead on the distinction between private and public authority. Aquinas's justification rests on the loss of legitimacy due to the violation of the common good, not on the mechanics of intentionality in killing.
  *   **Verify Textual Attribution:** Check the authorship of *De Regno*. Restrict your claims about Aquinas's personal views to Book I. Do not use the "beast" analogy as a legal justification for non-homicide; use it only as a rhetorical description of vice.
  *   **Nuance the "First" Claim:** Acknowledge John of Salisbury's earlier contribution. If you wish to maintain Aquinas is "first," specify that he is the first to integrate it into a broader *Summa* theology of law and obedience, rather than claiming Salisbury offered no theory.
  *   **Clarify Who Acts:** Explicitly distinguish between what a private citizen may do (almost nothing) versus what a public body or superior authority may do (depose). Your current draft implies a general permission that Aquinas explicitly warns against.
