  4.  **Integrate Ian Hacking (Interactive Kinds):**
      *   *Concept:* Interactive kinds (people react to the classification) vs. Indifferent kinds (natural kinds).
      *   *Application:* Money is the quintessential interactive kind. Classifying something as money changes how people behave, which changes the value.
      *   *Relevance to 1971:* The classification changed (fiat), people reacted (inflationary expectations, spending habits), which altered the reality of the money. This complements Searle by adding the *dynamic* feedback loop Searle sometimes underplays.

