answer: |-
  ### Brainstorming Pass: Claims Embedded in "DNA is a Code"

  Before designing the procedure, we must isolate what work the metaphor is doing. The sentence "DNA is a code" is not a single claim but a container for four distinct assertions. Your writers often slide between them without noticing.

  1.  **Mapping Claim:** There is a rule-governed correspondence between two distinct alphabets (nucleotides to amino acids). This is the only strictly true "coding" claim. It is arbitrary (not chemically forced) and digital.
  2.  **Copying Claim:** The molecule is replicated. This is templating, not coding. A template resembles its product; a code does not. Conflating replication with coding suggests the DNA looks like the organism.
  3.  **Causal Claim:** Changes in the sequence cause changes in the outcome. This is true but trivial. Everything in the cell makes a causal difference. Calling it "information" implies a semantic weight the causality does not support.
  4.  **Specification Claim:** The sequence contains the plan or instructions for the whole organism. This is the most dangerous claim. It implies the genome specifies the phenotype independently of the cellular context. It treats development as execution rather than construction.

  ### The Decision Procedure

  Use this flowchart for every genetic metaphor (code, blueprint, manual, script, program). Time limit: 5 minutes.

  **Q1: What is the target of the metaphor?**
  *   **Protein/Polypeptide:** (e.g., "codes for insulin") → **Pass.** Proceed to Q4.
  *   **Cell/Organism/Trait:** (e.g., "blueprint for a human," "program for development") → **Fail.** Proceed to Q2.

  **Q2: Is the mechanism translation or templating?**
  *   **Translation:** (Nucleic acid to Protein) → **Pass.** Proceed to Q4.
  *   **Templating/Replication:** (DNA to DNA, or DNA to Body Structure) → **Fail.** Proceed to Q3.

  **Q3: Is the phrase describing development as "execution"?**
  *   **Yes:** (e.g., "the cell executes the genome") → **Strike.** Development is not software execution.
  *   **No:** (e.g., "carries the instructions") → **Conditional Pass.** Requires Gloss. Proceed to Q4.

  **Q4: What is the context?**
  *   **Direct Quote:** → **Run as Is.** (Do not put words in a source's mouth, even if imprecise).
  *   **Headline:** → **Strike/Replace.** Headlines cannot carry the necessary nuance.
  *   **Body Copy:** → **Check Gloss.** If Q2 or Q3 failed, a gloss is mandatory.

  **Verdicts:**
  *   **Green:** Run as is.
  *   **Yellow:** Keep with Mandatory Gloss (Writer must add one sentence clarifying the limit).
  *   **Red:** Strike and Replace (Use "sequence," "template," or "contributes to").
  *   **Blue:** Escalate to Editor (If the metaphor is central to the piece's thesis).

  ### Costs and Misfires

  **Simplification Costs:**
  This procedure drops the philosophical distinction between *causal* and *semantic* information. A writer might argue "information" just means "makes a difference." The procedure bans this usage in organism-level claims because readers interpret "information" semantically (as instructions). We sacrifice philosophical precision for reader protection.

  **Where It Misfires:**
  1.  **False Positives (Too Strict):** It will flag "gene for X" even when biologists use it as shorthand for "gene variant associated with X."
  2.  **False Negatives (Too Lenient):** It allows "instruction manual" for the genome inside a cell (Q3 Conditional Pass). This still risks implying the cell is a passive reader.
  3.  **Headline Asymmetry:** A phrase permitted in the body (with gloss) is banned in the headline. This frustrates writers but is necessary; headlines lack space for caveats.
  4.  **Judgment Calls:** Q3 ("Is this execution?") is subjective. A writer may argue "program" is just a metaphor for regulation. The procedure treats it as forbidden to prevent slippage.

  ### Running the Examples

  **1. "This gene codes for a receptor." (Direct Quote)**
  *   **Q1:** Protein target? Yes (Receptor is a protein).
  *   **Q4:** Direct Quote? Yes.
  *   **Verdict:** **Green (Run as Is).**
  *   **Note:** Biologists use "codes for" as shorthand for "codes for the primary sequence of." Since it is a quote, accuracy to the speaker trumps semantic purity. No defensibility issue here.

  **2. "Every cell in your body carries the same instruction manual." (Your Copy)**
  *   **Q1:** Organism/Cell target? Yes.
  *   **Q3:** Describes development as execution? Ambiguous, but "instruction manual" implies specification.
  *   **Q4:** Body Copy? Yes.
  *   **Verdict:** **Yellow (Keep with Mandatory Gloss).**
  *   **Honest Assessment:** The procedure does not kill the sentence, but it forbids running it *as is*. You intended to fight for the phrase; the procedure says you may keep it only if you clarify that the "manual" is not a full plan for the body, but a list of protein parts.
  *   **Defensibility:** If a biologist complains, your reply is: "We retained the metaphor but added a gloss clarifying that genomic equivalence does not imply developmental determinism." This acknowledges the nuance they care about.
  *   **Audience Flag:** General readers interpret "instruction manual" as "build instructions for the body." Specialists interpret it as "identical genome." The gloss bridges this gap.

  **3. Headline: "Cracking the code of ageing."**
  *   **Q1:** Organism/Trait target? Yes (Ageing).
  *   **Q2:** Mechanism? Epigenetic clocks are correlations, not genetic translation.
  *   **Q4:** Headline? Yes.
  *   **Verdict:** **Red (Strike and Replace).**
  *   **Reason:** This conflates epigenetic markers with the genetic code. It suggests ageing is a cipher to be solved rather than a biological process. Headlines cannot carry the gloss required to make this accurate.
  *   **Replacement:** "Markers of Ageing" or "The Biology of Ageing."

  **4. "Junk DNA." (Used three times)**
  *   **Q1:** Function/Specification claim? Yes (Claim of non-function).
  *   **Q2:** Mechanism: N/A (Claim about lack thereof).
  *   **Q4:** Body Copy? Yes.
  *   **Verdict:** **Yellow (Keep with Mandatory Gloss).**
  *   **Reason:** "Junk" is a historical term, not a semantic one, but it implies "no information." Since function is debated (regulatory vs. non-coding), it requires context.
  *   **Gloss:** Must state that "junk" refers to non-coding sequences, some of which may have regulatory roles.

  ### Limitations of the Procedure

  This tool cannot settle disputes about evolutionary function (e.g., "selfish gene"). It does not cover regulatory networks where "information" flows bidirectionally. It assumes a standard central dogma view; it will misfire on epigenetics or prion-based inheritance where the "code" model is genuinely contested. Finally, following this procedure makes your section *less* accurate if the piece is specifically about the *history* of these metaphors; in that case, the metaphors are the data, not the description.

  ***

  ### Desk Cheat Sheet: Genetic Metaphor Ruling

  **Goal:** Prevent readers from thinking DNA builds bodies like a blueprint builds a house.
  **Time:** 5 Minutes.

  **1. Check the Target**
  *   **Protein?** (e.g., "codes for hemoglobin") → **OK.**
  *   **Body/Trait?** (e.g., "blueprint for a human") → **WARNING.**

  **2. Check the Mechanism**
  *   **Translation?** (DNA → Protein) → **OK.**
  *   **Templating?** (DNA → DNA) → **OK (but don't call it code).**
  *   **Development?** (DNA → Organism) → **BAN "CODE/PROGRAM/EXECUTE".**

  **3. Check the Context**
  *   **Headline?** → **NO METAPHORS.** (No space for nuance).
  *   **Quote?** → **ALLOW.** (Don't edit sources).
  *   **Body Text?** → **ALLOW WITH GLOSS.** (If warned above).

  **Verdicts**
  *   🟢 **Run:** Protein-level coding.
  *   🟡 **Gloss:** Organism-level metaphors in body text. *Gloss must say: "Instructions are for proteins, not the whole body."*
  *   🔴 **Strike:** Headlines, "Execution," "Blueprint for body."
  *   🔵 **Escalate:** If the metaphor is the main argument.

  **Common Traps**
  *   "Instruction Manual" → Implies the body is built from a plan. (Needs Gloss).
  *   "Program" → Implies the cell is a computer. (Strike).
  *   "Code of Ageing/Disease" → Implies a simple cipher. (Strike).

  **Defending a Ruling**
  *   *To Writer:* "Readers interpret 'code' as 'plan'. We need to distinguish protein synthesis from development."
  *   *To Complainant:* "We use standard metaphors but require glosses to prevent genetic determinism."
