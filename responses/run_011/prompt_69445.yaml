prompt: |-
  Our team has to put numbers on things. Right now the number is: what's the probability a new grid-scale battery installation has a serious fire in its first year of operation. No base rate, no frequency data, nothing exactly like it has ever been run. Every time someone opens an elicitation session, our safety lead kills it with "that's not risk, that's uncertainty" — usually with a nod at Knight, like the question was settled in 1921 and the rest of us are just slow.

  I want to push back, but honestly I cant tell what he's actually committed to. So: lay out the different precise claims that one sentence could be standing for. I've heard it doing work for at least three or four different things — something about there being no fact of the matter how likely this event is, something about our evidence being too thin to support any number, something about nobody in the room being able to form a settled opinion, and probably something about how you're supposed to decide that I'm not registering at all.

  For each reading I want it stated sharply, and then a verdict: is it a platitude that everyone including me already grants, is it substantive and defensible, or is it just false. And separately — does an ordinary Bayesian, the kind who assigns sharp credences to everything on pain of incoherence, have to reject it, or can she accept it without any tension? I suspect a couple of the readings are ones she can happily sign on to, which would make his appeal to them a total non-starter.

  Then the part I actually need. Which of these readings would license what he did — refusing to let anyone put forward a number at all? As opposed to only licensing something much weaker, like putting forward an interval, or declining to defend a single point estimate, or jumping to worst-case planning. Some of us are sympathetic to representing belief as a set of probabilities rather than one, and I want to know whether any reading of the slogan actually supports that, or whether the slogan is neutral about it and hes borrowing credit from a view he hasn't argued for. My strong suspicion is that he's sliding between these readings somewhere mid-sentence, and I want to be able to name exactly which step is the illegitimate one.

  Please keep it as a list I can hold in my head while sitting in a meeting room, not an essay.
