          1.  **Ontological:** There is no objective probability fact.
          2.  **Epistemic:** We lack evidence to estimate the probability.
          3.  **Psychological/Competence:** Experts cannot form a reliable judgment.
          4.  **Decision-Theoretic:** You shouldn't maximize expected utility; use a different rule (e.g., maximin).
