answer: |-
  Your intuition is spotting a real flaw in your brother's logic, even if his conclusion sounds mathematically elegant. His argument relies on a specific model of human behavior that political science and data largely contradict.

  Here is the breakdown of where his logic holds up, where it breaks, and who is closer to the truth.

  ### 1. The "Random Noise" Fallacy
  **Your Brother's Claim:** Uninformed/forced voters vote randomly (like a coin flip), canceling each other out.
  **The Reality:** **He is wrong here.**

  In statistics, this is the assumption of "random distribution." In sociology, it is almost never true. People do not vote by flipping a coin. Even uninformed voters use **heuristics** (mental shortcuts). They vote based on:
  *   **Family tradition:** "My parents always voted Labor/Republican."
  *   **Incumbency:** "Things are okay, let's not rock the boat."
  *   **Demographics:** Income, religion, and location strongly correlate with voting patterns.
  *   **Media exposure:** Even "uninformed" people consume some media, which leans in specific directions.

  **Why this matters:** If the people who currently *don't* vote are demographically similar to each other (e.g., they are disproportionately younger, poorer, or from marginalized communities), forcing them to vote does not add "noise." It adds **weight to a specific side.**

  In the U.S., for example, non-voters tend to lean more left on economic issues than actual voters. If you forced them to vote, the election wouldn't move to the "middle"; it would likely move to the left. In other contexts, if the disengaged are angry populists, it could move the election to the right. It is not neutral noise; it is systematic bias.

  ### 2. The "Moderating Effect" Myth
  **Your Brother's Claim:** Compulsory voting drags elections toward the "sensible middle."
  **The Reality:** **It's complicated, but mostly wrong.**

  This relies on the **Median Voter Theorem**, which suggests parties will converge on the center to capture the most votes. However, compulsory voting changes *who* the median voter is.

  *   **Voluntary Voting:** The median voter is someone motivated enough to go to a polling station. They tend to be older, wealthier, and more partisan.
  *   **Compulsory Voting:** The median voter becomes the actual median citizen.

  If the "actual median citizen" is frustrated with the status quo, parties won't move to the "sensible middle" of the political establishment; they will move to the "middle" of the public's frustration, which might be radical.

  **The Australia Example:** Australia does have compulsory voting. Does it produce "sensible middle" outcomes? Not necessarily. It produces high turnout (around 90%), but they still experience political polarization, leadership spills, and contentious policy shifts. It prevents the *extremes* from winning solely on the energy of a motivated base, but it doesn't guarantee moderation. It guarantees **representation.**

  ### 3. The 16-Year-Old Argument
  **Your Brother's Claim:** 16-year-olds are less informed, adding more random noise.
  **The Reality:** **He is likely wrong here, too.**

  We actually have data on this from Austria, Scotland, and Brazil, where 16-year-olds can vote.
  *   **Competence:** Studies show 16- and 17-year-olds do not have lower "civic competence" than 18- to 21-year-olds. In fact, because many are still in school, their civic education is often fresher.
  *   **Preferences:** Their votes are not random. They tend to be more progressive on climate change and social issues. This isn't "noise"; it's a coherent demographic interest.
  *   **Habit:** The strongest predictor of voting is whether you voted in the previous election. Voting at 16 establishes the habit while the teen is still in a stable environment (home/school), leading to higher lifelong turnout.

  Adding 16-year-olds doesn't add static; it adds a specific demographic voice that is currently excluded.

  ### 4. The Mandate Question
  **Your Brother's Claim:** (Implied) The result is legitimate because it reflects the people.
  **Your Concern:** If they voted to avoid a fine, is it a real mandate?

  **The Verdict:** **You have a philosophical point, but practically, he is right.**

  *   **The "Donkey Vote":** In Australia, there is a phenomenon called "donkey voting," where people just number the candidates 1, 2, 3 down the ballot to get it over with. This *is* random noise. However, it accounts for only about 1–2% of votes. It is statistically negligible.
  *   **Informal Voting:** People who don't care can submit a "blank" or "informal" ballot. They still show up (avoiding the fine) but don't actually choose anyone. This is a valid form of protest.
  *   **Legitimacy:** Political scientists generally argue that compulsory voting *increases* legitimacy. A government elected by 90% of the people has a stronger claim to represent the nation than one elected by 55% of the people (which is effectively 27% of the eligible population in a polarized system). The *motivation* for voting (civic duty vs. avoiding a fine) matters less than the *outcome* (broad participation).

  ### Where You Are Right (The "Bug" in Your Intuition)
  You sensed that apathetic voters aren't coin flips. You are correct.
  *   **Systematic Bias:** If the disengaged voters are systematically different from engaged voters, compulsory voting changes the *ideological balance* of the country, it doesn't just wash it out.
  *   **Quality of Democracy:** There is a valid argument that forcing uninterested people to participate might lower the "average information level" of the electorate, potentially making the public more susceptible to populism or sound-bite politics. Your brother assumes "more data points = better average." You are worried that "bad data points = skewed average." Both are valid concerns.

  ### The Final Verdict

  **Your brother is wrong on the mechanics, but maybe right on the spirit.**
  *   **Wrong:** Uninformed voters do not vote randomly. They vote based on demographics and heuristics. Lowering the age to 16 does not add "noise"; it adds a specific generational perspective.
  *   **Right:** Compulsory voting does reduce the advantage of hyper-partisan mobilization. It forces parties to appeal to the whole population, not just their angry base.

  **You are right on the nuance.**
  *   The election result won't necessarily move to the "sensible middle." It will move to wherever the non-voting population actually stands (which might not be sensible or moderate).
  *   The "mandate" is functionally real, but the *quality* of the decision-making might be diluted if a large chunk of the electorate is voting solely to avoid a penalty without engaging with the issues.

  **How to settle the argument:**
  Tell him: *"You're assuming apathetic voters are random number generators. They aren't. They're people with demographics. If we force the poor and young to vote, we won't get a 'sensible middle'; we'll get an electorate that looks more like the actual population, which might be more extreme, or more progressive, but definitely not random. Compulsory voting isn't a moderation machine; it's a representation machine."*
