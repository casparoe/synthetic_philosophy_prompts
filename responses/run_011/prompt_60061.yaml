      *   *Nuance:* Australia *does* have compulsory voting. Does it have less polarization than the US? Hard to say directly due to cultural differences, but it doesn't prevent hard-right or hard-left movements entirely.
      *   *Key Concept:* "Donkey Voting." I should mention this. It's when people just number 1, 2, 3 down the ballot. This *is* random noise, but it's a small fraction (1-2%).
      *   *Key Concept:* "Socioeconomic Bias." Non-voters are rarely a random sample of the population. They are usually poorer, younger, or more marginalized. Forcing them to vote changes the *composition* of the electorate, not just the volume.

