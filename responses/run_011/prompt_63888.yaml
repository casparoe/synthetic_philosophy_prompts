answer: |-
  This is a strong draft. It avoids the usual trench warfare and attacks the methodological infrastructure, which is where the actual vulnerability lies. You have correctly identified that "unfalsifiable" is a slogan, whereas "un-calibrated null model" is a technical defect.

  Here are comments addressing your eight specific questions, followed by structural observations.

  **1. Load-bearing objection (§3 vs §6/§7)**
  §3 (Null Models/Multiplicity) is the load-bearing *statistical* objection, but §5 (Circularity) is the load-bearing *logical* objection. If you must cut everything else, keep §5.
  Why? Because §3 and §6 assume the data entering the machine is valid and merely being misinterpreted. §5 argues the data is *constructed* by the theory it is supposed to test. If the x-axis (time) is aligned using conventional chronology for the "peaks" to exist in the first place, the volume function cannot be used to disprove that chronology. That is a fatal input error, whereas §3 and §6 are fatal processing errors. Input errors are harder to patch.
  However, for your stated goal (a reusable instrument for digital humanities), §3 is more generalizable. Most DH errors are multiplicity/null-model failures, not necessarily circular input construction. So for the *essay's* purpose, §3 is more valuable. For the *Fomenko* case specifically, §5 is stronger.

  **2. The Fermi-style multiplicity estimate**
  The estimate is defensible as an order-of-magnitude warning, but the dependence issue does undermine the specific arithmetic. Positive dependence among overlapping windows reduces the effective number of independent trials ($N_{eff} < N_{raw}$).
  However, you are under-counting the degrees of freedom in the *definition* of "spectacular alignment." You treat the threshold for significance as fixed. In practice, the researcher can adjust smoothing parameters, bin sizes, and the visual tolerance for "matching shapes" until a match is found. This is "p-hacking" via visualization parameters.
  **Correction:** Instead of focusing on the number of comparisons, focus on the *flexibility of the match criterion*. A rough restatement: "Even if the effective number of trials were low, the criterion for 'match' is sufficiently elastic that the probability of finding *some* match approaches unity." This sidesteps the hard calculation of dependence while preserving the intuition.

  **3. The §4 intuition (Smooth curves correlate)**
  The intuition is correct. Two low-frequency signals will always correlate well if you allow a shift parameter.
  **Formalization:** Describe the volume function as a signal passed through a low-pass filter (the smoothing). This removes high-frequency noise (specific events) and leaves only low-frequency trends (general activity). Low-frequency signals have low entropy. Matching two low-entropy signals is statistically trivial.
  **Cleanest statement:** "By smoothing the data to produce a recognizable 'shape,' the method discards the high-frequency information that distinguishes independent texts, leaving only the low-frequency trends that all narratives share (e.g., more writing in stable periods, less in chaotic ones). It then treats the similarity of these generic trends as evidence of specific dependence."

  **4. Condition (ii) and Stemmatology**
  Condition (ii) does not exclude stemmatology, provided you frame it correctly. Modern stemmatology (phylogenetics applied to texts) *does* satisfy (ii) via simulation. Researchers generate artificial manuscript trees, introduce random errors according to a model, and test if the algorithm recovers the known tree.
  Fomenko does not do this. He does not generate "fake chronicles" to see if his method finds duplicates where none exist.
  **Resolution:** You do not need to weaken condition (ii). You need to specify that "can in principle be estimated" includes estimation via *simulation* on synthetic data. This distinguishes fields that have moved toward quantitative rigor (phylogenetic stemmatology) from those that haven't (Fomenko). The Two-Source hypothesis is weaker here, and you can concede that—it strengthens your point that qualitative consensus isn't enough.

  **5. Federalist Papers Contrast**
  The contrast is fair, but the distinction isn't just "closed vs. open" hypothesis space. It is **calibration data**.
  The Federalist analysis had a training set: essays with known authorship (Hamilton vs. Madison) to calibrate the function-word frequencies *before* testing the disputed essays. Fomenko has no training set of "known independent chronicles" to calibrate what a non-matching volume function looks like.
  **Recommendation:** Promote "Calibration" to a key term. The problem isn't just that the hypothesis space is open; it's that the metric is uncalibrated. This bridges §3 and §7 nicely.

  **6. §6 vs Popper/Lakatos**
  It is Lakatosian, but the "parameter budget" phrasing adds marginal content by invoking the logic of Overfitting/AIC (Akaike Information Criterion). Popper says "it must be refutable." AIC says "adding parameters improves fit, but penalizes predictive power."
  **Advice:** Keep it, but explicitly use the word "overfitting." It connects the philosophical critique to the statistical one in §3. It clarifies that the theory isn't just "degenerating" in a sociological sense; it is mathematically consuming its own degrees of freedom.

  **7. Strawmanning/Steelmanning**
  You have not strawmanned the volume function, but you might be underplaying the "statistical regularity of history" claim. Fomenko argues history *is* periodic (dynasties repeat, etc.).
  **The Steelman:** A defender might say, "We aren't just fitting curves; we are detecting a real periodic signal in human social organization."
  **The Counter:** Even if history were periodic, the volume function method still fails §3 and §5. But the strongest counter is that Fomenko *derives* the periodicity from the same data he uses to prove the duplication. He assumes the periodicity to align the texts, then uses the aligned texts to prove the periodicity. This loops back to §5. You should explicitly mention this potential steelman in §5 to show you've considered it.

  **8. Structure and Tone**
  *   **Structure:** Yes, move §5 before §3. Logical flow:
      1.  Here is the method.
      2.  Here is why the input is circular (§5).
      3.  Even if we accept the input, here is why the statistics fail (§3, §4).
      4.  Here is the structural overfitting issue (§6).
      5.  Here is the general criterion (§7).
      *   *Reasoning:* If the input is circular, the statistical critique is secondary. Establishing circularity first makes the statistical critique a "fortiori" argument (i.e., "Even if we ignore the circularity, the stats don't work").
  *   **Tone:** §8 is not a jeremiad; it is a justification. It works. The overall tone is appropriately confident without being dogmatic. You successfully avoid the "skeptical sneer."
  *   **Hedges:** In §3, hedge the Fermi calculation. Use phrases like "roughly speaking" or "order-of-magnitude." In §4, acknowledge that smoothing is a valid technique *if* calibrated, rather than implying smoothing itself is the sin.

  **Specific Hand-Waving Flags**
  *   **§3:** "Overlapping smoothing windows make them strongly positively dependent, which is the sort of complication that cuts both ways." -> This is the hand-waving you asked to be caught on. Positive dependence reduces the effective trial count, which *weakens* your argument that there are "hundreds of spectacular alignments." You need to clarify that while dependence reduces $N$, the flexibility of the *match definition* increases the per-trial false positive rate ($p$). The product $N \times p$ remains high.
  *   **§4:** "Effective sample size is in the single digits." -> This is an assertion. Better: "The smoothing operation reduces the Nyquist frequency of the signal, effectively discarding most data points. The resulting curve contains very few independent pieces of information."
  *   **§7:** "Comparative philology also seems to pass." -> This is risky. Historical linguistics has its own replication crises. Better to say: "Comparative philology *aspires* to this via the regularity of sound correspondences, which act as a constraint against arbitrary matching."

  **Summary of Recommended Changes**
  1.  **Reorder:** Move §5 (Circularity) to position 2 (after the Case, before the Diagnosis). It is the foundational flaw.
  2.  **Refine §3:** Shift focus from "number of trials" to "flexibility of match criteria" to account for dependence.
  3.  **Refine §4:** Use "low entropy/low frequency" language rather than just "single digits."
  4.  **Refine §7:** Distinguish Fomenko from Stemmatology via *simulation/calibration*, not just false-positive rates.
  5.  **Refine §6:** Explicitly link "parameter budget" to "overfitting."

  This is a high-quality piece of methodological criticism. With the statistical hand-waving tightened and the circularity argument prioritized, it will be robust.
