  5.  **Refining the Statistical Critique (§3 & §4):**
      *   The user asks about dependence in §3. Positive dependence means the effective number of trials is *lower* than the raw count. This weakens the "100 false positives" claim. I need to point out that while the *number* of trials is lower, the *flexibility* of the matching criterion (smoothing windows, etc.) increases the false positive rate per trial.
      *   For §4, the "low degrees of freedom" argument is solid. A smoothed curve is essentially a low-pass filter. Comparing two low-pass filtered signals is prone to spurious correlation.

  6.  **Refining the Methodological Critique (§7):**
      *   The user worries about excluding stemmatology. The key is *simulation*. Phylogenetics (which stemmatology uses) relies heavily on simulation to test robustness. Fomenko does not. This is the differentiator.

