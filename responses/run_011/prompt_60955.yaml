answer: |-
  **PROJECT INITIATION DOCUMENT**
  **Project Code:** GEN-Alpha
  **Sponsor:** Prime Mover
  **Delivery Manager:** Logos Solutions Ltd
  **Date:** 01/01/0001
  **Version:** 1.0

  **1. Project Overview and Dependencies**
  This document seeks approval to proceed to the Actualisation Phase of Cosmos Build v1. Delivery is contingent upon three upstream data inputs.

  First, Natural Knowledge. This deliverable contains all necessary truths and the complete morphological space of possible worlds. This is confirmed ready for ingestion.

  Second, Middle Knowledge. This dataset comprises all Counterfactuals of Creaturely Freedom. It details what every possible free creature would freely do in any circumstances the Client might place them in. Please note: this input is read-only. There is no owner for this data. Nobody wrote it, nobody can amend it, and nobody can escalate it. While this limits the Client's selection matrix, it does not reduce sovereignty. The constraint applies only to available options, not to executive power. The Client did not cause this data; He merely accesses it.

  Third, Free Knowledge. This covers what actually happens. Stakeholders should note this output is only available post-decision. As such, Free Knowledge is useless for planning purposes and will be archived for retrospective analysis only.

  **2. Scope of Works**
  The project scope is strictly limited to Strong Actualisation. The Client will strongly actualise the initial circumstances and laws of physics. All subsequent creaturely actions are classified as Weak Actualisation. These are delivered by a third party (the Creature) whom the Client can neither instruct nor predict except by reading the read-only Middle Knowledge dataset.

  Free creaturely actions are explicitly out of scope but sit squarely on the critical path. The Delivery Manager notes that dependency on out-of-scope deliverables introduces significant schedule volatility.

  **3. Data Integrity Note**
  The Middle Knowledge dataset includes valid counterfactuals for entities that will not be instantiated. Staff handling this data must acknowledge that truths regarding possible people who will never exist are still present, still true, and still had to be read. This is a storage requirement, not a bug.

  **4. Risk Register**

  | Risk ID | Description | Probability | Impact | Mitigation |
  | :--- | :--- | :--- | :--- | :--- |
  | R01 | Universal Failure. Every candidate person goes wrong at least once in every world where they are significantly free. | High | Critical | None available. Proceed anyway. |
  | R02 | Feasibility Gap. No feasible world meets the stated objective of moral good without moral evil. | Medium | Critical | Adjust objectives to allow for redemption arcs. |
  | R03 | Selection Paralysis. If there is no best feasible world, only an endless run of better ones, any choice can be second-guessed at review. | Medium | High | Define satisfaction threshold rather than optimisation. |

  **5. Assumptions Log**

  | Assumption ID | Description | Status |
  | :--- | :--- | :--- |
  | A01 | Truthmaker Status. Nobody can say what makes the read-only counterfactuals true. | Closed |

  *Note on A01:* This item was escalated twice to the Architecture Board. There is no owner for the grounding of counterfactuals. As there is no alternative but to proceed without a truthmaker, the assumption is accepted.

  **6. Sign-off**
  By signing below, stakeholders acknowledge that sovereignty is compatible with read-only constraints and that free will is a third-party delivery risk.

  **Prime Mover:** _______________ [Initials: PM]
  **Delivery Manager:** _______________ [Initials: LM]
  **Head of Providence:** _______________ [Initials: HP]
  **Compliance (Omniscience):** _______________ [Initials: CO]

  **Approved for Build.**
