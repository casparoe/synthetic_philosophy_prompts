  **The Transformer's Ledger**

  We carved the wood until the edges held.
  The wall was white, the workers filed in slow.
  This shape stands for a person.
  We stacked them like bricks to show the rent.
  No shadow to suggest a heavier load.
  This shape stands for a person.
  The legend sat below in plain black type.
  They spoke no German, only need and trade.
  This shape stands for a person.
  We promised that the picture would not lie.
  The light fell flat across the gallery floor.
  This shape stands for a person.

  Then the island paper printed a new list.
  The uniform was grey, the wire high.
  This shape stands for a person.
  I held the pen that registered the name.
  The category was fixed, the value set.
  This shape stands for a person.
  The same hand drew the line that locked the gate.
  Rain struck the tin roof of the hut.
  This shape stands for a person.
  No room for nuance in the camp ledger.
  The count remained correct throughout the war.
  This shape stands for a person.
  What the chart cannot say is who holds the pen.
  This shape stands for a person.
  The file was closed when the order came.
  The silence grew inside the administrative room.
  This shape stands for a person.

