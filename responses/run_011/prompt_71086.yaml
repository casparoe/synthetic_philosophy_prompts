  **Note to the Editor**

  The transition from emancipatory chart to internment ledger relies on a formal identity that risks erasing moral distance, though the poem attempts to expose this friction rather than smooth it over. I was tempted to vary the refrain in the second stanza to signal coercion, but adhering to the constraint forces the reader to feel the discomfort of the sign's neutrality. The count splits four instances of public promise against six of state classification, a ratio discoverable only by laboriously tallying the lines as one would count symbols on a wall. Treating the refrain as a unit sign holds up technically, yet it reveals a limitation: poetic language accumulates connotation with each repetition, whereas the Isotype symbol is designed to resist it. Ultimately, the caption must bear the weight of the moral distinction because the form itself cannot differentiate between liberation and containment.
