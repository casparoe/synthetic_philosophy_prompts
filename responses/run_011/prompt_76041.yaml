  There is one principle that reconciles all six without killing any of your intuitions, provided you define truth as explanatory indispensability within our web of belief rather than empirical verification.

  Your verdicts on cases 5 and 6 differ not because of observability, but because of theoretical utility. The multiverse (6) earns a truth value because it may be indispensable to explaining the constants of *our* observable universe; the unreachable aliens (5) are idle posits that explain nothing about our experience, so asking if harming them is "wrong" is category-mistaken, like asking if numbers are polite. Cases 1 through 4 function similarly within the social sector of the web: torturing a cat (1) is central to our web of empathy and social cohesion, held as firmly as logic, while your grandfather's views (4) were discarded not because he missed biological facts, but because his moral posits failed to cohere with a broader, more functional theory of human potential and equality. You don't need a fact/value line; you need a central/peripheral distinction where morals are deep structural posits rather than surface observations.

  This principle kills none of your six verdicts, though it clarifies that case 5 is dissolved as meaningless rather than answered as false.

  Apply this to a new case: Is it wrong to delete a backup of a conscious AI that no one will ever restore? If positing "AI suffering" is indispensable to our best theory of mind and social regulation, the claim has a truth value; if the AI is causally disconnected from any experience like the aliens in case 5, the question dissolves into nonsense.
