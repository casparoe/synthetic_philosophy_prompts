answer: |-
  **Brainstorming Candidate Formulations**

  1.  "Is the frame problem solved?" **Vacuous.** Both agree it is solved under one definition and unsolved under another; the question hides the definitional dispute.
  2.  "Does logic handle change efficiently?" **Slanted toward A.** Assumes logic is the metric; B argues efficiency without relevance is useless.
  3.  "Is ontology selection harder than bookkeeping?" **Slanted toward B.** Presupposes the difficulty hierarchy A denies is part of the problem.
  4.  "Does successor-state axiomatization reduce axiom count relative to fluents?" **Vacuous.** Empirical mathematical fact both accept; costs neither camp anything.
  5.  "Does the term 'frame problem' refer to bookkeeping efficiency or relevance selection?" **Usable.** Isolates the terminological divergence without prejudging the technical merits of either side.

  ***

  **Joint Statement on the Frame Problem and the Counter Perturbation Battery**

  **1. Agreed Claims**
  1.  Successor-state axioms reduce the logical bookkeeping cost of change from scaling with the product of fluents and actions to scaling with the number of fluents alone. *Rules out:* The claim that logical inertia requires per-action frame axioms. *Cost:* A admits this does not solve ontology selection; B admits this is a non-trivial logical result.
  2.  Selecting a fluent vocabulary adequate for an open environment is an unsolved problem distinct from maintaining truth values within a fixed vocabulary. *Rules out:* The claim that axiomatization automatically generates appropriate categories. *Cost:* A concedes ontology is not trivial; B concedes bookkeeping is not the ontology problem.
  3.  In the Counter Perturbation Battery (CPB), successful task completion under perturbation requires either updating fluent values or altering the perception strategy. *Rules out:* The claim that a fixed plan survives uncorrected belief changes. *Cost:* Both accept the CPB as a valid testbed for belief revision.
  4.  The ablation arm of the CPB shifts the burden of structure from hand-written fluents to training data distribution. *Rules out:* The claim that raw perception operates without inductive bias. *Cost:* A concedes learning replaces axioms; B concedes learning relies on prior assembly.
  5.  Scaling the domain model from 40 to 4,000 fluents increases the manual engineering cost of the axiomatized approach unless automation is introduced. *Rules out:* The claim that manual modeling scales indefinitely without overhead. *Cost:* A admits engineering burden increases; B admits logical consistency is maintainable.

  **2. Disagreements**
  1.  *Neutral:* Does the term "frame problem" properly apply to the selection of vocabulary or only to the maintenance of truth values?
      *   *Camp A:* The frame problem is strictly the logical efficiency of representing change; vocabulary selection is a separate engineering abstraction problem.
      *   *Camp B:* The frame problem is fundamentally about relevance and ontology; solving bookkeeping without solving selection misses the point of the term.
  2.  *Neutral:* Is the difficulty of intelligent action located primarily in representing the world or in attending to the world?
      *   *Camp A:* The difficulty lies in ensuring consistent representations of change; attention is a downstream perceptual module.
      *   *Camp B:* The difficulty lies in determining what deserves representation; consistency is trivial once attention is correctly focused.
  3.  *Neutral:* Does the ablation arm solve the relevance problem or merely hide it in the training phase?
      *   *Camp A:* It hides the problem; the training distribution embodies the ontology the system failed to construct explicitly.
      *   *Camp B:* It solves the problem; relevance emerges from interaction without explicit symbolic commitment.

  **3. Cruxes**
  1.  *Ontology Ownership:* Does the fluent vocabulary belong to the system or to the theorist's description of it?
      *   *Test:* CPB Scale Arm (4,000 fluents). Recorded quantity: Hours of manual modeling required vs. performance degradation.
      *   *Prediction A:* Modeling time scales linearly; performance remains stable if axioms are correct.
      *   *Prediction B:* Modeling time scales superlinearly; performance collapses due to ontology brittleness.
      *   *Difference:* Genuine. A expects engineering effort; B expects structural failure.
  2.  *Ablation Interpretation:* Does the ablation arm count as solving relevance determination or as amortizing it over a training distribution others assembled?
      *   *Test:* CPB Ablation Arm. Recorded quantity: Success rate on Perturbation 2 (Empty Kettle) without explicit fluent updates.
      *   *Prediction A:* Success rate drops significantly; the system lacks the concept of "emptiness" without explicit fluents.
      *   *Prediction B:* Success rate remains high; visual prediction captures affordance changes without symbolic labels.
      *   *Difference:* Genuine. A expects symbolic gap; B expects continuous compensation.
  3.  *Problem Unity:* Does the phrase "frame problem" pick out a single problem or two problems of different kinds?
      *   *Test:* Philosophical argument based on CPB results. If bookkeeping is solved but robots still fail perturbations, is the remaining failure still "the frame problem"?
      *   *Prediction A:* It is a different problem (Qualification/Relevance); the Frame Problem is closed.
      *   *Prediction B:* It is the same problem revealed; the Frame Problem was never just bookkeeping.
      *   *Difference:* Mixed. Partly terminological, partly substantive regarding research priorities.

  **4. Self-falsifiers**
  *   *Camp A:* If manual ontology creation for the 4,000-fluent arm requires more than ten times the effort of the 40-fluent arm while failing to improve perturbation handling, A concedes that axiomatization does not scale independently of ontology engineering.
  *   *Camp B:* If the ablation arm fails to detect Perturbation 1 (Occluded Mug) despite extensive training, while the axiomatized system succeeds with minimal perception updates, B concedes that explicit structure offers robustness raw prediction cannot match.

  **5. Verbalness**
  Much of this dispute is terminological. If both camps stipulate that "Frame Problem" refers strictly to the logical bookkeeping of change (Camp A's usage) and "Relevance Problem" refers to ontology selection (Camp B's concern), the disagreement over definitions dissolves. However, a substantive residue survives: Camp A claims solving the Frame Problem enables solving the Relevance Problem via modular engineering; Camp B claims solving the Frame Problem is useless without solving the Relevance Problem first. This residue is not verbal; it dictates research strategy. The stipulation removes confusion but not the disagreement over dependency.

