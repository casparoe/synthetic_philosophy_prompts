  Consider the physical description of a crystal lattice maintained at a fixed non-zero temperature. To compute the equilibrium volume of this crystal, physicists employ a recursive calculation. They begin by assuming a reference volume for the lattice. Given this specific volume and the known interatomic potential, they calculate the normal modes of vibration and their associated frequencies. These frequencies are not arbitrary; they are fixed by the force constants and masses inherent to that specific structural arrangement. If the volume were to change, the force constants would change, and thus the frequencies would change. This sensitivity is captured by parameters describing how each mode's frequency shifts with fractional changes in volume.

  Next, physicists construct the Helmholtz free energy of the system. This quantity is defined as the static energy of the reference structure plus the thermodynamic contribution of the vibrational modes. To find the equilibrium state, they minimize this free energy with respect to the volume. The volume that minimizes the energy is selected as the new equilibrium volume. However, because this new volume differs from the reference volume, the force constants have changed, meaning the vibrational modes and frequencies must be recalculated for this new structure. The procedure is repeated until the volume and the mode spectrum cease to change.

  This physical practice suggests two competing grounding claims. The first claim is that the facts concerning the crystal's vibrational modes are grounded in the facts concerning its lattice parameters together with the interatomic potential. This is because the modes are ontologically dependent on the lattice; they are merely vibrations of that specific arrangement of atoms. The second claim is that the fact that the lattice has the parameters it has at this temperature and pressure is grounded in the facts concerning the mode spectrum. This is because the actual parameters are exactly those that minimize a free energy to which that specific spectrum contributes; without the modes, the equilibrium volume would be different.

  Standard metaphysical grounding is typically characterized by three formal constraints: it is irreflexive, asymmetric, and transitive. These constraints jointly prohibit grounding cycles. Yet the physics described appears to assert that the modes ground the lattice parameters while the lattice parameters ground the modes.

  (a) State the formal constraints on grounding that this case appears to violate. Show rigorously that, given these constraints, the case cannot constitute a genuine grounding cycle.
  (b) Set out the strongest response available to a defender of the hierarchical picture of grounding. Identify which of the two dependence claims this response revises or reclassifies, and explain why it is entitled to do so.
  (c) Assess whether that response disposes of the case or concedes something significant. In particular, address whether fundamentality requires that there be a bottom layer of reality or only that whatever is derivative be grounded in something, taking into account that effective theories appear to succeed one another without termination.

  The case presented appears to violate the standard formal constraints on grounding, specifically irreflexivity and transitivity. Grounding is standardly defined as a strict partial order, which entails that it is irreflexive, asymmetric, and transitive. If we accept the two claims as stated, we have a situation where fact A, concerning the lattice parameters, grounds fact B, concerning the mode spectrum, and fact B grounds fact A. By transitivity, if A grounds B and B grounds A, then A grounds A. By irreflexivity, nothing grounds itself. Therefore, the conjunction of these claims entails a logical contradiction. Since the physical calculation yields consistent and empirically verified results, the contradiction must lie in the metaphysical interpretation of the dependence relations, not in the physics itself. One or both of the purported grounding claims must be false or misclassified. The task is to identify which classification is erroneous.

  The strongest response available to a defender of the hierarchical picture is to distinguish metaphysical grounding from nomological or functional dependence. Grounding is a relation of constitutive determination, explaining what something is in virtue of what. It tracks ontological priority. The physics described, however, outlines a system of equations where variables constrain one another according to dynamical laws. The claim that the lattice parameters are grounded in the mode spectrum conflates the condition for equilibrium with the ontological source of the parameters. The minimization of free energy is a law-like constraint selecting a state from a space of possibilities, not a metaphysical generator of the state's constituents. The lattice parameters are grounded in the positions of the atoms and the fundamental forces governing them. The modes are grounded in the lattice parameters because they are nothing over and above the collective motions of those atoms. The dependence of the parameters on the modes is merely causal or nomological: the presence of thermal energy in the modes causally influences the equilibrium separation via internal pressure. This reclassification is entitled because grounding is ordinarily taken to be neither causal nor nomological; it is synchronic and constitutive, whereas the feedback loop described is diachronic or functional.

  Furthermore, one must rigorously separate the map from the volume to the spectrum from the spectrum at the equilibrium volume. The iterative procedure described is an epistemic method for solving a system of coupled equations. It converges to a consistent state where the volume and modes are mutually compatible. This convergence does not imply that the state grounds itself. Rather, the entire equilibrium state is grounded in the Hamiltonian of the system and the external temperature. The iteration is a tool for discovery, a way for physicists to find the solution, not a picture of ontological generation. The defender of hierarchy is entitled to reclassify the second claim as nomological dependence because grounding is reserved for constitutive relations, whereas the minimization principle describes how systems behave under constraints. To treat the solution method as the grounding relation is to confuse the map with the territory.

  Alternative ways of blocking the circle include denying the reality of phonons entirely or taking the free-energy-minimization fact as the single ground of both sides. Denying phonons is too costly, as it undermines successful explanations in solid-state physics and treats useful theoretical entities as fictions. Taking the minimization fact as a common ground is preferable but risks obscuring the distinction between the constituents and the laws governing them. The preferred response maintains the distinction between the ontology, consisting of atoms and forces, and the dynamics, consisting of minimization principles. This preserves the hierarchical structure without denying the physics.

  Regarding fundamentality, this response concedes that grounding requires well-foundedness but does not necessarily require a specific bottom layer known to current physics. The thesis that a fundamental level exists is distinct from the thesis that nothing is ungrounded. Effective theories may succeed one another without termination in our epistemic access, suggesting an infinite regress of models. However, metaphysical grounding requires that chains of dependence terminate in ungrounded grounds. The physics case shows that derivative facts can be mutually constrained by laws without forming a grounding circle, provided the ultimate ground lies in the fundamental laws and entities themselves. Thus, the case is disposed of without abandoning the hierarchical picture, provided one respects the distinction between metaphysical determination and physical interaction. The requirement is not that we know the bottom, but that there is a bottom where the grounding chains stop.

