      *   **Core Problem:** The "Utility Monster" claim (Nozick). PIs claim massive utility (future lives, diffuse benefits) to justify hogging resources. Incentives to inflate, no obligation to be right. Taurek's counter (numbers don't count) makes it worse by ignoring scale.
      *   **Constraints:** 90 minutes total for the full docket. No economists. No auditing of life-years models. Everyone read proposals once.
      *   **Requirements:**
          1.  A decision procedure (questions in order, sufficient answers, fact vs. value, flat no/not this round).
          2.  Inflation-proofing (what happens when *everyone* claims to be the monster?).
          3.  Run the procedure on three specific cases:
              *   (a) Drug-discovery foundation model (high claim, high uncertainty, candid).
