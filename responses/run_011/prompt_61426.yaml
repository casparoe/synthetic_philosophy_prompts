answer: |-
  ### The Specification for Statistic $G$

  **Objective:** Construct a statistic $G$ for a trait $T$ in a population $P$ that quantifies the role of genetic differences in a format actionable by an institution (school, clinic).

  **The Desiderata**

  **1. Environmental Variance Sensitivity**
  *   **Requirement:** $G$ must explicitly report the variance of the environment ($V_E$) in which it was estimated, and declare how $G$ scales if $V_E$ is compressed or expanded.
  *   **Motivation:** The height example. In a population with uniform nutrition, $V_E$ is low, so genetic variance ($V_G$) dominates the ratio ($h^2 \approx 1$). In a famine-struck population, $V_E$ is high, so $h^2$ drops. A school district needs to know if a high $G$ means "genes are destiny" or "environments are currently uniform." If $G$ doesn't flag the $V_E$ context, a high value will be misread as immutability rather than environmental saturation.
  *   **Tag:** **Genuine Desideratum.**

  **2. Contextual Interaction Reporting (The SES Clause)**
  *   **Requirement:** $G$ cannot be a single scalar if the genetic effect is modified by socioeconomic status (SES). It must report $G_{low\_SES}$ and $G_{high\_SES}$ separately, or report the interaction term magnitude.
  *   **Motivation:** The Scarr-Rowe hypothesis (and its counter-findings). In some contexts, wealth allows genetic potential to fully express (high $G$ in high SES); in others, poverty suppresses it (low $G$ in low SES). If $G$ averages these, it lies to a district serving only low-SES students. They need the local parameter, not the national average.
  *   **Tag:** **Genuine Desideratum.**

  **3. Causal Specificity (rGE Separation)**
  *   **Requirement:** $G$ must distinguish between *direct* genetic effects (biology) and *indirect* genetic effects (genetic propensity to select/create environments, i.e., passive/evocative rGE).
  *   **Motivation:** A child's "reading score" genetics might actually be "parent's reading habit" genetics passed down via books in the home (passive rGE). A school can intervene on the books; they cannot intervene on the child's biology directly. If $G$ lumps these together (as twin studies often do), the district thinks they are fighting biology when they are actually fighting resource distribution.
  *   **Tag:** **Genuine Desideratum.**

  **4. Portability Declaration**
  *   **Requirement:** $G$ must carry a validity domain. It must state the population parameters (ancestry, SES distribution, era) under which it holds, and quantify the expected decay when applied to a population with different allele frequencies or environmental structures.
  *   **Motivation:** Polygenic scores (PGS) derived from European populations fail in African or Asian populations due to linkage disequilibrium differences and environmental mismatches. A statistic that implies universal validity invites policy failure when transported across district lines or national borders.
  *   **Tag:** **Genuine Desideratum.**

  **5. Predictive vs. Explanatory Honesty**
  *   **Requirement:** $G$ must distinguish between *currently captured* genetic variance (e.g., PGS $R^2$) and *theoretical* genetic variance (e.g., Twin $h^2$).
  *   **Motivation:** The "missing heritability" gap. Twin studies might say 50% genetic; PGS might predict 10%. For a clinic deciding whether to genotype patients *today*, the 10% is the relevant number. For a researcher asking if biology matters *at all*, the 50% is relevant. Conflating them leads to over-promising on genomic medicine or under-estimating biological roots.
  *   **Tag:** **Genuine Desideratum.**

  **6. Individual Attribution**
  *   **Requirement:** $G$ must provide a percentage breakdown of causes for a single individual (e.g., "This child's score is 60% due to genes, 40% due to school").
  *   **Motivation:** Parents and teachers want to know about *this* kid, not the variance of the class. They want to assign cause to the specific outcome in front of them.
  *   **Tag:** **Camp Prejudice.**

  **7. Intervention Licensing**
  *   **Requirement:** $G$ must license claims about the magnitude of trait change resulting from a specific environmental manipulation (e.g., "Reducing class size moves the trait by $X$").
  *   **Motivation:** The end-user is an actor, not an observer. They do not care about variance decomposition for its own sake; they care about the derivative $\frac{\partial T}{\partial E}$. If $G$ cannot connect to a counterfactual change, it is descriptively interesting but operationally null.
  *   **Tag:** **Genuine Desideratum** (for the stated goal of actionability), though often corrupted by the prejudice that *variance* equals *malleability*.

  ***

  ### Adjudications

  **1. Is "G must be interpretable for one individual kid" a coherent demand?**
  **Verdict: Category Error.**
  This is a camp prejudice wearing a desideratum's clothes. Variance is a property of a distribution, not a datum. To say "60% of John's height is genetic" is semantically void. John's height is the sum of his specific developmental history; you cannot partition a single realization into variance components. Variance components answer "Why do John and Jane *differ*?" not "Why is John *tall*?"
  Demanding this of $G$ forces the statistic to lie. It encourages the "percentage of a single outcome" fallacy. A coherent $G$ must refuse this demand. It can offer individual *prediction* (PGS), but not individual *attribution* of variance.

  **2. Can "G must license intervention claims" be satisfied at the same time as "G must transport across populations"?**
  **Verdict: No.**
  This is the impossibility result you suspected.
  *   **Intervention Licensing** requires local causal knowledge. To know how a trait responds to an environmental change (e.g., better nutrition), you need to know the specific shape of the reaction norm *in that environment*. This is inherently local. The effect of nutrition on height depends on the current nutritional baseline.
  *   **Portability** requires invariance. To transport across populations, the statistic must describe a structural parameter that remains constant despite changes in the environmental distribution (e.g., a specific allele's biochemical effect).
  *   **The Conflict:** Variance components (the usual candidates for $G$) are ratios ($V_G / V_P$). Both the numerator and denominator change when you change populations or environments. Therefore, a variance ratio cannot transport. Conversely, a structural parameter (like an allele effect size) might transport, but it does not license intervention claims on its own because the *environmental variance* it interacts with is unknown in the new population.
  *   **Conclusion:** You can have a statistic that predicts intervention outcomes locally (high actionability, low portability), or a statistic that describes biological mechanisms structurally (high portability, low direct actionability). You cannot have a single number that guarantees an intervention effect size *and* remains valid across different environmental distributions without recalibration.

  ***

  ### The Killer Requirement

  **Requirement 7: Intervention Licensing.**

  This requirement does the most work. It knocks out every standard candidate for "heritability" immediately.
  *   **Twin $h^2$:** Describes the status quo variance, not the response to change. (PKU is 100% heritable but 100% malleable by diet).
  *   **PGS $R^2$:** Describes current prediction, not causal leverage.
  *   **Standard Regression Coefficients:** Confounded by rGE unless specifically designed otherwise.

  If you enforce the demand that $G$ must tell an agent "If you push $E$, $T$ moves by $X$," you are no longer asking for a variance decomposition. You are asking for a **Causal Response Function.**

  ### What $G$ Looks Like If You Keep Only Intervention Licensing

  If you discard Individual Attribution, discard the dream of perfect Portability, and keep **Intervention Licensing** as the sole master, $G$ ceases to be a property of the *trait* and becomes a property of the *manipulation*.

  $G$ is no longer "Heritability." $G$ becomes **$\tau$ (Tau): The Treatment Effect Slope.**

  *   **Definition:** $\tau = \mathbb{E}[T | do(E_{new})] - \mathbb{E}[T | do(E_{old})]$, conditional on genetic strata if necessary.
  *   **Form:** It is not a ratio (0 to 1). It is a slope (units of trait per unit of environment).
  *   **Behavior:**
      *   It admits that $\tau$ might be large even if genetic variance is high.
      *   It admits that $\tau$ is local to the population and baseline environment (sacrificing Portability).
      *   It ignores the "percentage of cause" for an individual (sacrificing Individual Attribution).
      *   It requires experimental or quasi-experimental identification (RCTs, natural experiments), rendering observational twin/correlational data insufficient on its own.
  *   **Utility:** A school district can use $\tau$ directly. "If we spend \$X on tutoring, scores rise by $Y$." It bypasses the "nature vs. nurture" debate entirely because it doesn't measure the source of the variance, only the leverage of the intervention.

  **Result:** The debate ends because the statistic no longer answers "How much do genes matter?" It answers "How much does this policy matter?" The genetic context is retained only insofar as it modifies the slope (Requirement 2), but the central metric is **malleability**, not **heritability**.
