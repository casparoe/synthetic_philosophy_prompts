answer: |-
  **The Four Accounts**
  1.  **Exchange:** Corruption requires a *quid pro quo*; a specific benefit traded for a specific misuse of office.
  2.  **Private-Gain:** Corruption is the abuse of entrusted power for any private benefit, regardless of a deal.
  3.  **Role-Integrity:** Corruption is the subversion of the office's purpose by personal interests; the wrong is the capture of the role, not the gain.
  4.  **Conventionalist:** Corruption is a violation of the specific norms actually in force within that setting; if the norm permits it, it is not corrupt.

  **Case A**
  Dr. Aris, a hospital procurement officer, receives a high-end espresso machine ($500 value) from a MedSupply representative during a routine site visit; no words are exchanged regarding future contracts, no expectation is implied, and Aris feels no conscious obligation. Months later, Aris awards a contract to MedSupply solely because their bid is objectively the best value for the hospital, a decision defensible on the merits and documented accordingly. Under the **Exchange** account, this is not corruption because no *quid pro quo* exists. Under the **Private-Gain** account, this is corruption because Aris abused entrusted power for a private benefit. Under the **Role-Integrity** account, this is corruption (and structurally worse) because the personal gift compromises the impartiality required by the procurement role, regardless of the outcome. Under the **Conventionalist** account, assuming standard strict hospital norms, this is corruption because it violates the established rule against vendor gifts.

  **Case B**
  The facts remain identical regarding Aris, the machine, the silence, and the defensible decision, but the hospital department operates under a long-standing, known custom where vendors leave small equipment for staff use, a practice even reformers accept as necessary for vendor relations. Under the **Exchange** account, this remains not corruption for the same reason as A (no deal). Under the **Private-Gain** and **Role-Integrity** accounts, this remains corruption (abuse and capture persist despite norms). Under the **Conventionalist** account, this is now **not corruption**, because the act does not violate the norms actually in force; the "Not Corrupt" verdict here rests on normative permission, distinct from the Exchange verdict in Case A which rests on structural absence of a deal.

  **The Minimal Edit**
  To flip the **Conventionalist** verdict to Corrupt while keeping **Exchange** at Not Corrupt: Change the gift from a machine for the *staff breakroom* (permitted by custom) to a machine for Aris's *private home* (forbidden by custom). The **Exchange** account still sees no deal and says Not Corrupt. The **Conventionalist** account now sees a violation of the specific local norm (shared vs. personal) and says Corrupt. If you cannot construct this distinction, it shows the Conventionalist account collapses into the Exchange account when norms are purely transactional, but here the norm is about *usage*, not *exchange*, so the distinction holds.

  **Writeup**

  **Feature Doing the Work**
  In the Exchange account, the working feature is the **expectation of return**; without it, the variable is zero. In the Conventionalist account, the working feature is the **norms of the office itself**; the physical facts matter less than the social rulebook. Secrecy and value are secondary variables; they influence the norms but do not define the corruption in the Conventionalist view unless the norm specifies them. The third party getting passed over is irrelevant in all four accounts if the decision is meritorious, which isolates the "harm" to the system rather than the outcome.

  **Ablations**
  1.  **Make the gift public:** Exchange remains Not Corrupt (still no deal). Role-Integrity may shift to Not Corrupt if transparency is deemed to neutralize capture (sunlight as disinfectant). Conventionalist depends on whether the norm requires disclosure.
  2.  **Make the gift trivial ($20):** Private-Gain may shift to Not Corrupt (*de minimis* exception). Exchange remains Not Corrupt. Role-Integrity remains Corrupt if the principle of impartiality is absolute, regardless of scale.
  3.  **Reciprocated in fact years later:** Exchange may flip to Corrupt if the delay implies a standing understanding (long-game *quid pro quo*). Role-Integrity flips definitively as the capture is realized. Conventionalist flips if the norm forbids delayed reciprocity.

  **The Exchange Defender's Attack**
  The Exchange defender will argue your design punishes status rather than acts. They will claim: "If the decision is meritorious and no deal was struck, the public suffers no harm. You are policing the official's internal state or their social associations, not their official conduct. Without a *quid pro quo*, you criminalize friendship or gratitude, which chills legitimate cooperation." They will argue that Role-Integrity and Private-Gain accounts are over-inclusive, catching benign human interaction in a net meant for predators.

  **Should You Lose That Argument?**
  You should not lose it entirely, but you must concede its jurisdiction. The Exchange account is the correct standard for *criminal liability* (proof beyond reasonable doubt requires a deal). However, it is insufficient for *institutional design*. If you only police Exchange, you allow the erosion of trust that precedes the deal. The Role-Integrity account is necessary for administrative rules (ethics codes), while Exchange is necessary for penal code. They operate at different layers of the system.

  **Strict Norm Settings**
  When run in a setting where norms are supposed to be strict (e.g., a judicial chamber), the Cultural Frame is **load-bearing** for the Conventionalist account but **decoration** for the Role-Integrity account. In a strict setting, Conventionalist and Role-Integrity converge (both say Corrupt). In a permissive setting, they diverge. This proves the Conventionalist account is relative, while Role-Integrity claims a universal standard based on the function of the office itself. If you believe corruption is an objective wrong regardless of local custom, the Conventionalist account fails the "renal physiology" test of universal mechanism; it describes symptoms, not pathology.
