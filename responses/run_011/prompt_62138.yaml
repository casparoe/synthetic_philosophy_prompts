  6.  **The "Cheapest Revision":**
      *   The biggest tension is claiming Lewisian Objective Chance (4/5) in a deterministic multiverse (3).
      *   *Revision:* Modify (4) and (5). Stop calling them "Chances" in the Lewisian sense. Call them "Branch Weights" that *guide* credence via Self-Locating Uncertainty (8).
