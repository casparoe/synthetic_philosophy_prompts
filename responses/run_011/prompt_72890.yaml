answer: |-
  - **What each practice is committed to**

  **Australia (Compulsory Attendance)**
  This practice presupposes that voting is fundamentally a *duty of membership* rather than a right of preference. For the coercion to be non-arbitrary, the act of attending must hold value independent of the mark made on the ballot. The state commits to the view that the legitimacy of the government derives from the *comprehensiveness* of the participation, not just the sum of the preferences. By enforcing attendance while protecting secrecy and allowing spoilage, the institution treats the voter as a statistical unit required to complete the sample. The minimum view needed here is that the physical act of participation constitutes a civic contribution equivalent to jury duty; the content of the vote is secondary to the fact that the citizen submitted to the process. Without this, the state is merely fining people for staying home, which is hard to justify if the vote itself is null.

  **Nevada (None of These Candidates)**
  This practice presupposes that voting functions as a *feedback mechanism* distinct from *decision-making power*. For the line to be non-deceptive, the institution must acknowledge that the electorate needs a sanctioned outlet for dissent that does not threaten the transfer of authority. It commits to the view that a vote can be a valid expression of rejection even if it lacks causal efficacy regarding the outcome. The minimum view needed is that system stability requires the formal recording of dissatisfaction. If the vote were purely about selecting a winner, this option would be administrative waste. Therefore, the practice assumes the ballot serves a dual purpose: selecting leaders and measuring sentiment. The line exists to validate the voter's negative judgment without granting them veto power over the plurality winner.

  - **The instrumental reading, and why it fails**

  On a strict instrumental picture, a vote is a causal lever intended to alter the probability of a specific outcome. Under this definition, both practices are irrational inefficiencies. In Australia, compelling a citizen to attend and potentially spoil a ballot forces them to incur costs (time, effort, fines) to produce a null causal contribution. If the vote is only about the outcome, a spoiled ballot is noise, and compulsion merely increases the volume of noise without improving the signal. It is coercive waste.

  In Nevada, the "None of These Candidates" option is instrumentally incoherent. If the goal is to determine who governs, an option that cannot win is a distractor. It risks confusing the tally or creating a false sense of agency. If the vote is a tool for outcome determination, providing a tool that cannot determine outcomes is a design flaw. Both practices incur administrative costs—enforcement machinery in Australia, ballot space and tallying in Nevada—that yield zero instrumental return. They fail because they prioritize the *process* of voting over the *product* of voting, which instrumentalism cannot accommodate.

  - **Is there one theory that covers both?**

  Yes. Both practices are coherent under a theory of **Systemic Legitimacy**. On this account, the primary function of an election is not merely to aggregate preferences to find the "best" ruler, but to generate acceptance of the regime among the governed. Legitimacy requires two things: broad participation and managed dissent.

  Australia's compulsion serves the first requirement. By dragging the entire electorate into the booth, the system ensures that the resulting mandate cannot be dismissed as the product of a motivated minority. The secrecy and allowance for spoilage ensure that this participation doesn't become forced affirmation; the state gets the legitimacy of high turnout without demanding false consent. The citizen fulfills the duty of maintaining the system, even if they reject the options.

  Nevada's protest line serves the second requirement. High legitimacy requires that dissent be absorbed within the system rather than expelled outside it. By offering a formal channel for rejection, the state acknowledges dissatisfaction without paralyzing governance. It prevents boycotts or extra-legal protest by offering a symbolic victory within the ritual.

  Under Systemic Legitimacy, these are not contradictory. Australia ensures the *volume* of input is high enough to validate the system. Nevada ensures the *variety* of input includes negative sentiment without breaking the mechanism. Both treat voting as a ritual of regime maintenance rather than a marketplace of policy choices. They are two parts of one design: one forces you into the ritual, the other ensures the ritual can accommodate your rejection without collapsing.

  - **Where they're underdetermined**

  While Systemic Legitimacy fits best, it is not the only theory that licenses these choices. **Epistemic Democracy** could also justify both. On this view, voting is about producing good knowledge for the state. Australia's compulsion forces disengaged citizens to inform themselves, theoretically raising the average quality of the decision. Nevada's line provides data to elites about the intensity of dissatisfaction, allowing them to adjust future platforms. Similarly, a **Liberal Neutrality** theory could argue Australia prevents socioeconomic skew in turnout (fairness), while Nevada prevents forcing voters to affirm candidates they morally oppose (conscience).

  To discriminate between Systemic Legitimacy and Epistemic Democracy, you would need to examine how the data is used. If Australian officials treat spoiled ballots as a signal to improve civic education, it's epistemic. If they ignore them so long as turnout is high, it's legitimacy. If Nevada legislators analyze "None of These" totals to change policy, it's epistemic/feedback. If they treat it as a harmless pressure valve and ignore the counts, it's legitimacy. Currently, the administrative behavior suggests the latter: spoiled ballots and protest votes are tallied but rarely trigger institutional responses, pointing toward legitimacy maintenance rather than knowledge gathering. The practices are underdetermined because the same institutional machinery can serve either master depending on how the elites interpret the output.

  - **Swapping the theory out**

  If you replaced the presupposed view with a strictly instrumental one, election administration would change concretely in both jurisdictions. In Australia, compulsion would be abolished. If a voter does not care about the outcome, their absence is rational and should not be penalized. Resources currently spent on enforcement and tracking non-attendance would be redirected to voter education aimed at increasing voluntary interest. Spoiled ballots might be reclassified as errors rather than valid compliance, encouraging voters to make a definitive choice or stay home.

  In Nevada, the "None of These Candidates" line would be removed. It occupies ballot space and complicates tabulation without altering the winner. Under instrumentalism, protest belongs in primaries, where it can affect the nominee, or outside the booth entirely. The ballot would be streamlined to list only viable contenders. The focus of administration would shift from measuring sentiment to maximizing the efficiency of preference aggregation. The result would be a cleaner tally, but potentially lower perceived legitimacy during cycles of high dissatisfaction or low engagement, as the system would lack the ritualistic mechanisms to absorb dissent or enforce participation.

  - **Bottom line**

  Your hunch is half right. You are correct that instrumentalism fails to explain either practice; both are inefficient on a causal picture. However, you are wrong that they require contradictory non-instrumental theories. They do not pull in opposite directions. Both are best understood as tools of Systemic Legitimacy: one secures the mandate through presence, the other secures stability through managed dissent. They are compatible components of a regime prioritizing endurance over efficiency.
