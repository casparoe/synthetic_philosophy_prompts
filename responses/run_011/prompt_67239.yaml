      *   *Another Consideration:* **Relational vs. Non-Relational Goods.** Equality is relational (between people). Reefs are non-relational. This might save Noor's distinction in (5) better than she did.
      *   *Selection:* I will focus on the **"In One Respect" vs. "All Things Considered"** distinction, as it's the crux of whether the LDO is fatal. Also, I should mention the **fairness of the stipulation**: The case rules out instrumental benefits of equality (social cohesion), which stacks the deck for the LDO by removing instrumental defenses.

