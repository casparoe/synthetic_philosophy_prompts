          *   No. Callum's point in (6) is decisive. Whether a value *requires* harm depends on the feasible set, not the value's definition. Equality *can* be achieved by gains. The fact that the *test case* involves loss doesn't mean the *value* is constituted by loss. Noor's distinction collapses.

