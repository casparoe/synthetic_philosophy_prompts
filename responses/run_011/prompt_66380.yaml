answer: |-
  ### Polybius
  **Score: 1**

  **Component Abandoned:** The specific typology of constitutions (Monarchy, Tyranny, Aristocracy, Oligarchy, Democracy, Ochlocracy). To apply *anacyclosis* to a non-state entity (e.g., a trading firm), you must strip the mechanism of its legal-sovereign content. A firm cannot experience "Ochlocracy" (mob rule) in the Polybian sense because it lacks a public sphere and a monopoly on violence; it can only experience management collapse.

  **Cycle or One-Way:** Becomes a **one-way process** (entropy). In Polybius, the collapse of Ochlocracy necessitates a return to Monarchy to restore order. In a non-coercive unit, collapse usually results in dissolution or acquisition, not a generational reset to a singular founder-figure. Without the state's fiscal capacity to enforce the reset, the cycle breaks at the point of disorder.

  ### Ibn Khaldun
  **Score: 6**

  **Component Abandoned:** The geographic necessity of the nomadic/sedentary dichotomy. Khaldun's engine is *asabiyyah* (group solidarity), which is highly portable to a monastic order or a startup. However, to make it work, you must abandon the requirement that the group must conquer a sedentary center (*Mulk*) to complete the cycle. A scientific specialty can exhibit rising and falling solidarity without ever becoming a "kingdom."

  **Cycle or One-Way:** Remains a **cycle**. The mechanism is generational (roughly three to four generations from zeal to luxury to collapse). This temporal rhythm holds intact whether the unit is a dynasty, a sect, or a corporate division. The "winter" of the group creates the vacuum for a new group with higher *asabiyyah* to replace it, preserving the cyclical topology.

  ### Oswald Spengler
  **Score: 4**

  **Component Abandoned:** The metaphysical "Prime Symbol" (the unique soul of the Culture). To apply Spengler's morphology to an open-source project or a scientific paradigm, you must discard the idea that the unit possesses a pre-destined, mystical essence (e.g., the "Faustian"). You retain the morphological stages (Spring/Summer/Autumn/Winter) but treat them as sociological phases of innovation, standardization, rigidification, and petrification.

  **Cycle or One-Way:** Remains a **one-way process**. Spengler never posited a reset; a Culture is an organism that is born and dies. Transferred to a scientific specialty, the mechanism describes a lifecycle (paradigm emergence to ossification), not a cycle. The unit does not return to Spring; it is replaced by a new unit. This distinguishes it from true cyclical theory.

  ### Arnold Toynbee
  **Score: 7**

  **Component Abandoned:** The soteriological end-game (the Universal Church as the chrysalis for a new civilization). Toynbee's "Challenge and Response" is a cybernetic feedback loop applicable to almost any adaptive system. To port it to a trading firm, you discard the spiritual teleology where breakdown leads to higher religious consciousness. You keep the structural dynamic: a creative minority solves problems until it becomes a dominant minority that relies on force rather than mimesis.

  **Cycle or One-Way:** Remains a **one-way process**. Like Spengler, Toynbee describes a trajectory of Growth, Breakdown, and Disintegration. While he allows for multiple "rhythms" within a civilization, the unit itself does not cycle back to genesis; it dies or transmutes. The mechanism is a lifecycle arc, not a circle.

  ***

  ### Adjudication

  **The Outright Failure:**
  **Polybius.** His machinery is not merely state-centric; it is *constitutional*. The causal links in *anacyclosis* depend entirely on the distribution of sovereign power and the legal capacity to coerce. You cannot have a "mixed constitution" in a voluntary association or a market firm. Once you remove the coercive/fiscal apparatus, the specific causal links (e.g., why Democracy *necessarily* devolves into Ochlocracy rather than simply dissolving) vanish. It is the only theory on the list that describes the mechanics of the state itself, rather than using the state as a vessel for a broader social process.

  **The Shared Mechanism:**
  **Spengler and Toynbee.**
  Despite their animosity, they operationalize the same mechanism: **Organic Morphology.**
  Both theorists treat the unit of history (Civilization/Culture) as a super-organic entity subject to a predetermined lifecycle of birth, growth, rigidification, and death. Both confuse "cyclical history" (recurring patterns) with "lifecycle history" (sequential stages). In both systems, the "cycle" is an illusion created by observing multiple units at different stages of the same one-way arc. When transferred to non-state units (e.g., a scientific specialty), both reveal themselves not as cycles, but as **S-curves of institutional vitality** that terminate in death or replacement, not reset.
