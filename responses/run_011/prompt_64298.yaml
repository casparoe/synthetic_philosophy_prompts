answer: |-
  **1. Exam Question**

  **PHIL 305: Classical Utilitarianism**
  **Take-Home Final Examination**

  **Time Limit:** 72 Hours
  **Word Limit:** 1,500 words maximum
  **Value:** 25 Marks (100% of Final Grade)

  **Instructions:**
  Answer the following question. You are not required to cite primary or secondary sources, and you should not quote directly from any texts. Your grade depends on your analysis of the argument and cases provided below, not on your recall of external biographical or historical details. You may reference John Stuart Mill only to clarify a distinction Bentham cannot make; do not use Mill to solve Bentham's problems.

  **The Argument Reconstruction**
  Consider the following reconstruction of Jeremy Bentham's position regarding the criminalization of private, consensual sexual conduct:

  1.  **The Justification of Punishment:** Punishment is inherently painful and therefore an evil. It is only justified if it prevents a greater evil (mischief).
  2.  **Types of Mischief:** Mischief is divided into two kinds. *Primary mischief* affects assignable individuals who are harmed against their will. *Secondary mischief* consists of alarm and danger spread through the community.
  3.  **Application to Private Conduct:** In private, consensual sexual acts, there is no primary mischief because no assignable person is made worse off against their will.
  4.  **The Role of Disgust:** The pain felt by onlookers who discover such conduct stems from antipathy (dislike) rather than utilitarian harm. Furthermore, the pain of ruined reputation suffered by the actor is largely manufactured by the law itself, which stamps the conduct with infamy.
  5.  **Conclusion:** Because the pain of punishment exceeds the prevention of mischief, the law should be repealed.

  **The Stipulated Cases**
  Evaluate the stability of this argument under the following two hypothetical conditions:

  *   **Case A (The Dead Letter):** The law prohibiting the conduct remains on the books but is never prosecuted. However, the conduct is universally known to be loathed. The pain suffered by those who engage in the conduct comes entirely from gossip, ostracism, and ruined economic prospects (the popular sanction), not from the courts (the political sanction).
  *   **Case B (The Vigorous Enforcement):** The law is vigorously enforced. However, the general population is indifferent to the conduct itself. The pain of disgust and alarm in the community is generated solely by the spectacle of the trial and the execution of the punishment, not by the knowledge that the conduct is occurring.

  **The Prompt**
  Write an essay that addresses the following:

  1.  In **Case A**, does repealing the law achieve any utilitarian work? Identify which premise of the reconstruction above carries the weight of your answer.
  2.  In **Case B**, does the argument hold more securely? Explain why the source of the "secondary mischief" matters here.
  3.  Critically assess Premise 4. Is Bentham's dismissal of onlooker disgust an independent utilitarian calculation, or is it a non-utilitarian constraint smuggled into the calculus? If the majority's alarm constitutes "secondary mischief," does the doctrine of secondary mischief actually argue *against* Bentham's conclusion?
  4.  Conclude with a verdict: Is the claim that Bentham anticipated the Harm Principle defensible? If so, what cost does this impose on the consistency of his hedonic calculus?

  ***

  **2. Model Answer**

  **Verdict: Bentham Anticipates the Harm Principle at the Cost of Empirical Fragility**

  Bentham's reconstruction offers a coherent argument for decriminalization, but its stability depends entirely on the empirical relationship between the political sanction (law) and the popular sanction (social stigma). While the argument succeeds in Case B, it risks collapse in Case A unless Bentham makes a strong empirical claim about the causal power of law. Ultimately, Bentham does anticipate the Harm Principle, but he does so by suppressing the utilitarian weight of "secondary mischief," which threatens the consistency of his calculus.

  In Case A, the law is a dead letter, and the suffering arises from social ostracism. If Bentham argues for repeal here, he must rely on Premise 4: that the law manufactures the reputation damage. He must claim that even an unenforced statute legitimizes social antipathy, thereby fueling the popular sanction. If the law is repealed, the stigma should theoretically fade, reducing the total pain. However, if the social loathing is independent of the statute, repeal achieves no utilitarian work. The pain of ostracism remains constant, but the state loses the deterrent option should the conduct ever produce primary mischief. In this scenario, Bentham's argument fails unless he asserts that legal infamy is the *cause* of social infamy, not merely a correlate. This places a heavy empirical burden on Premise 4.

  Case B presents a stronger position for Bentham. Here, the population is indifferent, and the pain is generated by the legal process itself. Premise 1 (Punishment must prevent greater evil) does the heavy lifting. Since the conduct causes no primary mischief (Premise 3) and the secondary mischief (alarm) is created by the trial rather than the act, the punishment creates more pain than it prevents. Repeal eliminates the source of the pain (the trial) without increasing mischief. This is a straightforward hedonic calculation where the removal of the political sanction directly reduces the net sum of pain.

  The critical vulnerability lies in the treatment of onlooker disgust in Premise 4. Bentham dismisses this pain as "antipathy," implying it does not count toward the calculus. This looks less like an independent calculation and more like a circular definition: pain counts unless it is based on antipathy, and we know it is based on antipathy because it should not count. If the majority genuinely feels alarm at the knowledge of the conduct, this constitutes secondary mischief under Premise 2. Utilitarianism generally demands the soothing of alarm to maintain social security. By ignoring this, Bentham appears to smuggle in a non-utilitarian constraint protecting liberty. To avoid this, he must argue that gratifying antipathy yields no long-term utility, a claim that requires evidence beyond the calculus itself.

  This tension defines the verdict on the Harm Principle. Bentham anticipates Mill's principle by restricting legitimate interference to cases of primary mischief (harm to others). However, Mill secures this by defining a category of "self-regarding" actions that are immune to utility calculations. Bentham lacks this shield; he admits all pain into the calculus but attempts to zero out the pain of the majority through the classification of antipathy. Therefore, Bentham anticipates the *conclusion* of the Harm Principle but not its *foundation*. He defends liberty using the calculus, whereas Mill protects liberty from the calculus.

  In conclusion, Bentham's argument is defensible only if one accepts that legal stigma is the primary driver of social pain (saving Case A) and that majority alarm based on mere dislike has no utilitarian weight (saving Premise 4). This preserves the conclusion of the Harm Principle but renders the hedonic calculus fragile. It requires Bentham to ignore the "secondary mischief" of social unrest whenever it conflicts with his view of rational self-interest. He achieves the right result for liberty, but he does so by bending the utility principle rather than breaking it.

  ***

  **3. Marking Scheme**

  **Total Marks: 25**

  **1. Reconstruction and Premise Identification (5 Marks)**
  *   **5:** Correctly identifies which premises apply to which case without quoting the text.
  *   **3:** Identifies premises generally but conflates primary/secondary mischief.
  *   **0:** Ignores the provided reconstruction and relies on outside knowledge of Bentham.
  *   *Typical Botch:* Student ignores the provided premises and writes a generic biography of Bentham.

  **2. Analysis of Case A (The Dead Letter) (5 Marks)**
  *   **5:** Identifies that repeal only helps if the law *causes* the stigma (Premise 4); notes the risk if stigma is independent.
  *   **3:** States repeal is good/bad but fails to link it to the source of the pain (popular vs. political sanction).
  *   **0:** Assumes repeal automatically stops the pain of ostracism.
  *   *Typical Botch:* Treats the popular sanction and political sanction as interchangeable.

  **3. Analysis of Case B (Vigorous Enforcement) (5 Marks)**
  *   **5:** Recognizes this is the stronger case; identifies that the trial creates the secondary mischief, not the act.
  *   **3:** Correctly argues for repeal but misses the distinction regarding the source of the alarm.
  *   **0:** Argues enforcement is justified because the law is being followed.
  *   *Typical Botch:* Claims the law is justified because it reflects the will of the majority.

  **4. Critique of Antipathy and Secondary Mischief (5 Marks)**
  *   **5:** Identifies the circularity risk in Premise 4; acknowledges that majority alarm usually counts as secondary mischief and explains why Bentham excludes it.
  *   **3:** Notes that disgust is ignored but calls it "unfair" rather than analytically circular or empirically fragile.
  *   **0:** Accepts Bentham's dismissal of disgust without question.
  *   *Typical Botch:* Confuses the principle of sympathy and antipathy with the ascetic principle.

  **5. Verdict on the Harm Principle (5 Marks)**
  *   **5:** Distinguishes between Bentham's calculus-based defense and Mill's rights-based shield; offers a definitive verdict on consistency.
  *   **3:** States Bentham anticipated Mill but fails to explain the cost to the calculus.
  *   **0:** Equates Bentham and Mill completely or denies any connection.
  *   *Typical Botch:* Uses "tyranny of the majority" as a substantive argument rather than a description of the problem.

  **A/B Boundary Note:**
  A competent (B-range) answer reports the objection that majority alarm counts as mischief. A first-class (A-range) answer specifies *which premise* the objection targets (Premise 2 vs. Premise 4) and states what Bentham loses (empirical stability or calculative consistency) if he revises it to meet the objection.

  **Evidence of Summarizing:**
  If a student writes generally about "freedom of expression" or "sexual liberty" without referencing the specific mechanics of primary/secondary mischief or the political/popular sanction distinction provided in the prompt, deduct 5 marks from the total.

  ***

  **4. List of Specific Errors (Costing Marks)**

  *   **Confusing Principles:** Treating the "principle of sympathy and antipathy" as the "ascetic principle." (Deduct 2 marks)
  *   **Categorization Error:** Declaring Bentham a "rule utilitarian" to solve the problem without textual warrant. (Deduct 3 marks)
  *   **Sanction Conflation:** Treating the popular sanction (gossip/ostracism) and political sanction (courts/punishment) as the same mechanism. (Deduct 3 marks)
  *   **Sloganizing:** Using the phrase "tyranny of the majority" as if it were a utilitarian argument rather than a description of a outcome. (Deduct 2 marks)
  *   **Quotation:** Including any verbatim quotes from Bentham or the prompt's reconstruction. (Deduct 5 marks)
  *   **Mill Dependency:** Using Mill's Harm Principle to solve the problem rather than analyzing Bentham's calculus. (Deduct 3 marks)
