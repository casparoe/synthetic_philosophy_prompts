answer: |-
  The Housing Committee allocates one quiet-office permit. Applicants A and B are equally entitled, income-matched, and currently occupy identical noisy cubicles (State C). Both strictly prefer the permit (State P) to C. Evidence from calibrated self-reports and cash-equivalent trade-offs establishes a common satisfaction metric. A is temperamentally volatile: their worst conceivable work state (W) is -50 units, best (Z) is +50 units. C sits at 0; P lifts A to +10. B is temperamentally stoic, neither deprived nor adapted: their W is -5 units, Z is +5 units. C sits at 0; P lifts B to +3. Both ranges are certain and observable via consistent choice behavior stable across varied workplace conditions. Neither faces health risks or permanent loss. The metric locates all endpoints on a single scale derived from shared willingness-to-pay benchmarks. A gains 10 absolute units; B gains 3. Ordinally, both rank P > C. The only difference is the spread of their attainable satisfaction ranges.

  1.  *Range normalization.* This convention rescales each individual's utility so their worst attainable state is 0 and best is 1. A's range is 100 units (-50 to 50); current state 0 is 0.5, post-benefit 10 is 0.6. Gain = 0.1. B's range is 10 units (-5 to 5); current state 0 is 0.5, post-benefit 3 is 0.8. Gain = 0.3. The convention favors B (0.3 > 0.1).
  2.  *Common-scale comparison.* The metric is cash-equivalent satisfaction units, bearing interpersonal weight because both agents trade off satisfaction against income identically. A gains 10 units; B gains 3 units. The comparison favors A (10 > 3).
  3.  *Confirmation.* Steps 1 and 2 disagree. They rely on identical ordinal facts (P > C) and identical evidence (self-reports, trade-offs), diverging solely due to the scaling convention.
  4.  *Money-metric check.* Willingness-to-pay mirrors the common scale: A pays 10, B pays 3. It favors A. Income correction changes nothing as incomes are equal.
  5.  *Impartial-observer check.* An observer choosing behind a veil of ignorance with equal chance of being A or B cannot sum utilities without a scaling convention. The verdict is indeterminate. To resolve it, the observer must supply either Range Normalization (favors B) or Level Utilitarianism/Common-Scale (favors A).
  6.  *The load-bearing feature.* The feature is the difference in range spread (100 vs 10). If ranges are made equal (e.g., both 100) while holding gains fixed, Range Normalization yields 0.1 for A and 0.03 for B. Both conventions then favor A. The divergence collapses.
  7.  *The loser's reply.* B (loser under Common-Scale) argues the metric measures capacity for satisfaction, not welfare itself; privileging volatile temperaments penalizes stoicism. This attack lands partially: choosing a metric is normative, not empirical, but rejecting absolute magnitudes risks ignoring intensity.
  8.  *Generality.* The divergence is structural. It arises whenever attainable ranges differ in size under a common metric. To stop disagreeing, the conventions must agree on range sizes (impossible given temperament) or one convention must be rejected as normatively inappropriate.
