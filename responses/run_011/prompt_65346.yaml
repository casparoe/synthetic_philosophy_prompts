answer: |-
  The steam rose from the porcelain bowl, carrying the scent of star anise and braised pork, but Eleanor did not lean in. She sat back in the leather chair, her fountain pen hovering over the notepad like a bird unsure of where to land. Julian stood by the desk, holding the spoon. He did not wait for permission. He blew on the broth, tested it against the roof of his own mouth, and watched her eyes.

  'It's missing something,' she said. Her voice was tight, the way it had been since Christmas. 'The acidity isn't cutting through the fat.'

  'It's the tamarind,' Julian said. 'It's late in the finish. You won't catch it immediately.'

  'Write that down.'

  He didn't write it down. He walked to his own desk in the corner, the one obscured by the ficus tree, and opened his laptop. He typed: *The tamarind arrives late, a sharp ghost haunting the rich pork.* He knew the dish. He had cooked the broth himself in the kitchen of the restaurant while she waited in the car, claiming a migraine. That was the arrangement, though neither had signed a contract. She provided the face, the byline, the sharp elbows required to get a reservation at a place booked solid until 2026. He provided the tongue.

  Lately, her questions had become more specific, yet more desperate. She asked about texture more than flavour. She asked if things were hot or cold, crunchy or soft. The nuance was slipping away from her, draining out like water from a cracked basin. Julian's own palate, conversely, had become terrifyingly precise. He could taste the soil the carrot grew in, the stress of the chicken before slaughter. He tasted everything for both of them now.

  Three months prior, the *Evening Standard* had published her review of *Le Grenouille*. It was a rave. She had called the sauce a 'classic beurre blanc, emulsified to perfection'. Julian had eaten the dish alone in the office the day before publication. It was a hollandaise, heavy on the lemon, slightly split. He had seen the printed paper on her desk that morning, the ink still smelling of chemicals. She had been showing it to a sub-editor, laughing, tapping the column with a manicured nail.

  Julian had stood in the doorway, holding a box of proofs. He looked at the words *beurre blanc*. He looked at Eleanor's profile, the way the light caught the grey creeping into her hair, the fragility of her neck. If he corrected her, he admitted he knew the sauce better than she did. If he admitted that, he admitted he was the one who had eaten it. To correct the record was to dismantle the statue.

  Now, she was drafting a follow-up piece on consistency in French cooking. She wanted to cite *Le Grenouille* as an example of technical mastery.

  'Read me the quote again,' she said, rubbing her temples.

  Julian walked over and picked up the clipping. He could feel the weight of the lie in the paper. '“A beurre blanc of exceptional clarity,”' he read.

  'Yes,' she said, leaning forward to type. 'It anchors the piece. Shows I know my classics.'

  Julian looked at her cursor blinking on the screen. He could reach over and change it. He could type *hollandaise*. It would be a small correction, easily passed off as a sub-editor's error or a refinement of thought. But if he changed it, he was altering her history. If he left it, she was building her future on a falsehood he could expose with a single phone call to a chef.

  He watched her hands. They were trembling slightly. She was terrified of being found out, though she thought she was hiding it from him. She didn't know he knew. She thought he was just the assistant, the boy who fetched the coffee and typed the drafts. She didn't realise that without him, she was mute.

  He left the word alone. He let her type *beurre blanc*. He let the error stand, cementing another brick in the wall between them. It was an act of mercy, or perhaps possession. By keeping her secret, he owned her.

  The seasons turned. The leaves outside the office window browned and fell. The meals became more complex, requiring more explanation. Julian found himself describing colours to her. 'The reduction is the colour of a mahogany desk,' he would say. 'The foam is white, like paper.' She wrote it all down, trusting him utterly. Her dependence was no longer a secret; it was a physical thing, a tether pulling her towards his desk whenever a new delivery arrived.

  The climax came on a Tuesday, with a tasting menu from a new establishment in Soho that claimed to use only foraged ingredients. There were twelve courses. Eleanor managed four. By the fifth, a broth of woodruff and snail, she put the spoon down. Her face was pale.

  'I can't,' she whispered. 'It's all... grey.'

  Julian didn't answer. He pulled the bowl towards himself. He ate the snail broth. It was exquisite, earthy, vibrant with the scent of the forest floor. He ate the sixth course, the seventh, the eighth. He ate until he was full, until the flavours were mapping themselves onto his nervous system. He took notes in his own shorthand, precise and brutal.

  When he looked up, she was watching him. She wasn't looking at the food anymore. She was looking at his mouth. She knew. The pretence had evaporated. There was no point in asking him what it tasted like if she couldn't comprehend the answer.

  'What do I write?' she asked. Her voice was small, stripped of the authority she used in restaurants.

  Julian closed his notebook. He stood up and walked around the desk. He stood behind her chair. He could smell her perfume, something expensive and floral that couldn't mask the scent of her fear. He placed his hands on the arms of the chair. He did not touch her, but he caged her in.

  'You write that the food is honest,' Julian said. His voice was low, close to her ear. 'You write that it demands attention.'

  'And the snail?'

  'You write that it tastes of the woods after rain.'

  She stared at the blank document on the screen. Her fingers hovered over the keys, but she didn't type. She was waiting for him to dictate the words. She was waiting for him to take control.

  Julian leaned past her. He reached around, his chest brushing against her shoulder, and placed his hands on the keyboard. He began to type. He didn't ask for permission. He didn't stop to let her edit. He wrote the review exactly as he had tasted it, using his own metaphors, his own rhythm. The prose was sharper than hers had ever been, more visceral.

  Eleanor sat still. She could have stopped him. She could have stood up, fired him, walked out of the office and told the editor the truth. She could have reclaimed her name. But she didn't move. She watched the letters appear on the screen, black on white, her byline at the top, his words beneath it.

  When he finished, he hit save. He didn't move away. He stayed standing behind her, his hands resting on the desk, framing her. She was the critic, the famous one, the one with the column inches and the television appearances. But he was the one who had eaten the world. She was trapped in the fame she couldn't taste, and he was trapped in the silence he couldn't break. Neither of them could leave. The meal was over, but neither of them could get up from the table.

  I chose the assistant's point of view because it highlights the burden of truth and the quiet power shift inherent in being the unseen engine of someone else's reputation.
