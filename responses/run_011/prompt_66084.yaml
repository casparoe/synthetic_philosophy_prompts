      *   *Core Claim:* Intransitive preferences aren't inherently irrational.
      *   *Mechanism:* The money pump only works if you accept trades sequentially without a prior plan.
      *   *Solution:* Adopt a plan (e.g., "stick with B") and refuse sequential trades.
      *   *Shift:* Transitivity is a requirement on *plans*, not raw *preferences*.
      *   *Implication:* If you don't face sequential trades, you aren't irrational even with cyclic preferences.

