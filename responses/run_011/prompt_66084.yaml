      *   Need plain English. No "diachronic," "normative," "axiom."
      *   Focus: You can like A>B>C>A without being crazy. You only lose money if you say yes to every trade as it happens. If you make a plan beforehand and stick to it, you're safe. So the rule isn't "your tastes must make sense," it's "your strategy must make sense." If no one tries to trade with you, your crazy tastes don't matter.
