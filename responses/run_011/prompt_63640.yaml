  *   **Strict Screening-Off (PP):** Says **0.5**. You know the chance is 0.5. The ball doesn't *entail* Heads (it could be wrong), so it's inadmissible/irrelevant. Chance screens it off.
  *   **Total Evidence:** Says **0.8** (or thereabouts). You conditionalize on the testimony of the ball.
  *   **Why it settles it:** Given Dev's verdict on the **Drunk Buddy (Case 5)**, where he scaled his credence to the trustworthiness of the source (0.75), he will almost certainly say **0.8** here. This confirms he follows Total Evidence, not Strict Screening-Off, and reinforces the prediction that he'll say **0.7** for the Time Traveller.
