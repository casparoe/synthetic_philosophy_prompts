answer: |-
  The tension you identify lies at the intersection of epistemology (how we know things) and procedure (how we justify decisions). Good's theorem is an epistemic claim about ideal agents; the "no-research" rule is a procedural constraint on institutional actors. To reconstruct the implicit theory of the trial, we must distinguish between the *goal* of the trial (which is debated) and the *mechanism* of the trial (which is structurally fixed).

  Below is a reconstruction of the implicit theory, an analysis of its consistency, and a delineation of settled versus contested ground in legal theory.

  ### 1. Reconstructing the Implicit Theory

  The prohibition on independent juror investigation presupposes a theory of the trial that prioritizes **procedural legitimacy** and **adversarial testing** over raw epistemic accumulation. It rests on three pillars:

  **A. The Adversarial Principle (The Right to Confrontation)**
  The trial is not a pure inquiry into truth; it is a dispute resolution mechanism between two parties. The core axiom is that no fact may be used against a party unless that party had an opportunity to challenge it (cross-examine, rebut, or object).
  *   *Implicit Claim:* Evidence is not just data; it is data *processed through a filter of reliability testing*. Information acquired outside this filter is "toxic" not because it is false, but because it is untested.
  *   *Relation to Good's Theorem:* Good's theorem assumes the agent bears the cost of processing information. In a trial, the *litigants* bear the cost of rebuttal. If a juror acquires information privately, the litigants cannot bear that cost (they don't know what to rebut). Thus, the "negative value" comes from the systemic violation of rights, not the cognitive state of the juror.

  **B. The Cognitive Constraint (Jurors as Non-Ideal Updaters)**
  The law assumes jurors are not the ideal Bayesian agents required for Good's theorem to hold.
  *   *Implicit Claim:* Humans suffer from "belief perseverance" and "source confusion." If a juror finds a fact online, they cannot easily "ignore" it if it is later rebutted (the "bell cannot be unrung"). Furthermore, jurors lack the training to assess the reliability of external sources (e.g., distinguishing a wiki from a peer-reviewed journal).
  *   *Relation to Good's Theorem:* Good's theorem requires the agent to update by conditionalization on the *reliability* of the source. If the juror cannot accurately assess source reliability, the expected value of information *can* be negative because it introduces noise indistinguishable from signal.

  **C. The Equality of Arms (Symmetry)**
  The trial aims to ensure both sides operate with the same informational set.
  *   *Implicit Claim:* A verdict is legitimate only if it rests on a shared record. Private research creates asymmetry; if one juror researches and others do not, the deliberation is skewed by information not subject to group scrutiny or adversarial testing.

  ### 2. Consistency Check: Life Experience vs. Reference Works

  You note a tension: jurors are told to use common sense (and specialized knowledge like nursing) but forbidden from looking up definitions. Is this consistent?

  **The Distinction: Priors vs. Evidence**
  The theory distinguishes between **background priors** (life experience) and **new evidence** (specific facts).
  *   *Settled:* All reasoning requires priors. You cannot decide a case without using your internal knowledge of how the world works (e.g., "ice is slippery," "people usually lie to avoid trouble"). To forbid this would make deliberation impossible.
  *   *Contested:* Where the line is drawn. Is a nurse's knowledge of a drug interaction a "prior" (general knowledge) or "expert testimony" (specific evidence)?
      *   *Strict View:* If the knowledge is specific to the case facts, it is evidence and must be excluded if not in the record.
      *   *Permissive View:* If it is general professional knowledge, it is part of the juror's cognitive toolkit.
  *   *Consistency:* The rule is theoretically consistent if defined as: *Jurors may use internalized generalizations to weigh evidence, but may not acquire new specific facts to fill gaps in the evidence.* The tension arises only in application, not in the underlying logic.

  **The Distinction: Controlled vs. Uncontrolled Access**
  The escorted view vs. solo lookup distinction is consistent with the **Adversarial Principle**.
  *   *Escorted View:* This is treated as "demonstrative evidence." Both sides are present, the judge controls what is seen, and the context is preserved. It enters the "courtroom record."
  *   *Solo Lookup:* This bypasses the judge and the opposing counsel.
  *   *Verdict:* There is no logical contradiction here. The theory demands *control*, not *ignorance*.

  ### 3. Good's Theorem and the Location of Costs

  Does the rule assume the trial's aim is something other than accuracy?
  *   **Contested:** Some scholars argue the trial is purely about accuracy (instrumentalism). Others argue it is about legitimacy (proceduralism).
  *   **Reconstruction:** The rule presupposes that **accuracy is constrained by legitimacy.** A correct verdict reached via unconstitutional means (e.g., denying cross-examination) is treated as a systemic failure.
  *   **Cost Location:** The cost of the information is located on the **adversarial process**, not just the jury. Good's theorem calculates the value to the *agent*. The legal system calculates the value to the *system*. If the agent (juror) gains information but the system loses integrity (rights violated), the net value is negative.

  ### 4. The Hypothetical Information-Permissive Rule

  *Scenario:* Jurors may research freely but must disclose findings; parties may respond.

  **Effect on the Theory:**
  This rule would **destroy** the presupposed theory of the adversarial trial and shift it toward an **inquisitorial** or **collaborative truth-seeking** model.
  1.  **Role Shift:** Jurors become active investigators rather than passive triers of fact.
  2.  **Resource Shift:** The burden shifts to the parties to rebut *anything* a juror might find, rather than the parties controlling what enters the room. This creates infinite potential rebuttal costs.
  3.  **Dynamic Change:** Deliberations would change from "what did we hear?" to "what did you find?" This privileges jurors with better research skills or internet access, violating the "Equality of Arms" among jurors.

  **Does it preserve the theory?**
  No. It preserves the goal of *accuracy* (aligning closer to Good's theorem) but abandons the goal of *procedural containment*. It assumes jurors *can* reliably distinguish sources (contradicting the Cognitive Constraint pillar) and assumes the parties can effectively rebut surprise evidence introduced mid-deliberation (contradicting the Adversarial Principle).

  ### 5. Settled vs. Contested

  To satisfy your requirement for distinguishing consensus from debate:

  **Settled (Consensus among Legal Scholars & Courts)**
  *   **The Rule's Existence:** It is settled law in common-law adversarial systems that jurors cannot conduct independent investigations. Violations are presumptively prejudicial.
  *   **The Rationale:** There is consensus that the primary justification is the preservation of the right to cross-examination and the prevention of untested evidence.
  *   **Cognitive Risk:** There is broad agreement that jurors are susceptible to bias from external information and cannot easily disregard it once learned.
  *   **Good's Theorem Inapplicability:** Legal theorists agree that Good's theorem does not directly govern legal procedure because legal procedure imposes constraints (rights, rules of evidence) that are external to the epistemic utility of the decision-maker.

  **Contested (Genuine Disagreement)**
  *   **The "General Knowledge" Exception:** There is significant disagreement on whether jurors with specialized knowledge (like the nurse) should be allowed to share it. Some jurisdictions treat this as misconduct (it's unsworn expert testimony); others allow it as "background." This is an underdetermined area where the theory does not provide a clear bright line.
  *   **Accuracy vs. Legitimacy:** Philosophers of law debate whether the exclusion of reliable external evidence (e.g., a juror correctly Googles a scientific fact that was misrepresented in court) is a *feature* or a *bug*.
      *   *Proceduralists* say it is a feature (rights matter more).
      *   *Epistemic Consequentialists* say it is a bug (truth matters more).
  *   **The Remedy:** There is debate over whether a verdict *must* be set aside upon proof of research, or whether courts should inquire into whether the research actually prejudiced the outcome. (Some jurisdictions apply a presumption of prejudice; others require a showing of actual harm).
  *   **Inquisitorial Alternatives:** While the adversarial system forbids research, comparative law scholars contest whether civil-law (inquisitorial) systems, where judges investigate, actually yield more accurate results, or if they simply shift the bias from the jury to the judge.

  ### Summary of the Implicit Theory

  The "no-research" rule presupposes that a trial is a **closed epistemic system** designed to produce **legitimized decisions** rather than **maximized truth**.

  It assumes jurors are **bounded rationality agents** who cannot safely update on unverified data. It locates the cost of information not in the cognitive load of the juror, but in the **procedural rights of the litigants**.

  The tension between "use your experience" and "do not research" is resolved by categorizing experience as **priors** (necessary for reasoning) and research as **evidence** (subject to testing). This distinction is theoretically consistent but practically fuzzy.

  Adopting an information-permissive rule would not merely tweak the system; it would collapse the distinction between the jury and the investigator, effectively ending the adversarial model in favor of a system that prioritizes Good's theorem (information accumulation) over the adversarial right to confront one's accuser. Whether that is an improvement is the central contested question in the philosophy of evidence.
