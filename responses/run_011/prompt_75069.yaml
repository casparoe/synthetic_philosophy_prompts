prompt: |-
  So I'm a junior and I run the economics club at my school. It's like 12 people, all of them have had AP stats so they know expected value cold, but basically zero philosophy. Next Wednesday I've got 30 minutes with a whiteboard and I want to teach them risk-weighted expected utility (the Buchak version), becuase I think it's genuinely cool that expected value isn't the last word on what's rational.

  Don't explain RWEU to me, I mostly get it — plan how *I* should explain it to them. What I need:

  - The order the pieces have to go in. Do I start from expected value and break it, or start with a story and back into the math? What depends on what — like can I say the word "rank" before they've got the idea that the whole shape of a gamble matters, or does that just confuse them?

  - The example. I was going to use phone insurance: pay $40 now to avoid a 5% chance of a $400 cracked screen. But our econ teacher sits in sometimes and he's definitely gonna say "that's just diminishing marginal utility of money, nothing new here," and I do NOT have a comeback. So: does that example actually survive his objection, or is it a bad choice, and what would an example have to look like to be immune to it? Give me something I could sketch on the board in two minutes.

  - The misconceptions. I'm pretty sure half of them will think I'm just changing the probabilities — like pretending the odds are worse than they really are — and the other half will decide risk aversion is a feeling and not a reason. Where exactly in the sequence do I kill each one? And what am I not thinking of that's going to bite me later?

  - Related: I've been describing it to people as "you line up the outcomes worst to best, and the weight on each one depends on how much of the distribution is underneath it." Is that gonna plant something wrong in their heads, or is it fine?

  Also tell me what I should flat out refuse to cover at this level and say so out loud, and give me one question to ask at the end that'll show whether it landed or they're just nodding at me.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Junior in high school, runs an economics club.
      *   **Audience:** 12 peers, all know AP Stats (comfortable with Expected Value - EV), zero philosophy background.
      *   **Constraint:** 30 minutes, whiteboard available.
      *   **Goal:** Teach Risk-Weighted Expected Utility (RWEU), specifically Lara Buchak's version.
      *   **Key Motivation:** Show that EV isn't the final word on rationality.
      *   **Specific Concerns:** Order of operations, the "phone insurance" example (fear of diminishing marginal utility objection), misconceptions (probability weighting vs. risk attitude), phrasing of "ranking/weighting," scope creep (what to avoid), and a check-for-understanding question.

  2.  **Deconstruct the Core Concept (RWEU):**
      *   Standard EU: $EU = \sum p_i \cdot u(x_i)$. Linear weighting of probabilities.
      *   RWEU: $REU = \sum [r(\sum_{j \ge i} p_j) - r(\sum_{j > i} p_j)] \cdot u(x_i)$. Or more intuitively, transform the cumulative probability function using a risk function $r$.
      *   Key distinction: It's not about the *value* of money (utility curvature), it's about the *weight* of the probability based on its position in the distribution (global property of the gamble).
      *   Buchak's specific contribution: Axiomatizing this as a distinct rational attitude, not just a psychological bias.

  3.  **Address the Specific Requests:**

      *   **Order of Operations:**
          *   Need to establish EV first (they know it, but need to see it as a *normative* claim, not just math).
          *   Need to break EV with an intuition pump (Allais-style or simple risk premium).
          *   Need to distinguish Utility Curvature (Bernoulli) from Risk Weighting (Buchak). This is crucial for the teacher objection.
          *   Introduce the math *after* the intuition.
          *   *Verdict:* Start with EV, break it with intuition, distinguish from diminishing marginal utility, then introduce RWEU math.

      *   **The Example (Phone Insurance vs. Teacher Objection):**
          *   *Problem:* The phone insurance example ($40 vs 5% of $400) is classically explained by concave utility functions (diminishing marginal utility of money). Losing $400 hurts more than 5x losing $40. An econ teacher will pounce on this.
          *   *Solution:* Need an example where utility is *linear* (money is money) but risk aversion still exists. Or, explicitly frame the example to isolate the probability weighting.
          *   *Better Example:* A gamble where the stakes are small enough that marginal utility is roughly linear, but the *structure* of the risk feels different. Or, use a "St. Petersburg" lite or an Allais-style pair.
          *   *Best for 30 mins:* The "Sure Thing vs. Gamble" where the expected value is identical, but the *spread* matters. Actually, to beat the teacher, we need to show that two people with the *same* utility function for money can rationally choose differently based on risk attitude.
          *   *Revised Example:* Use points or hypothetical currency where marginal utility is stipulated as linear. Or, use the "Allais Paradox" structure but simplified. Let's go with a direct comparison: Option A (Sure $50) vs Option B (50% $0, 50% $100). EV is $50 for both. Why pick A? If utility is linear ($u(x)=x$), EU says indifferent. RWEU says you can prefer A because you weight the bottom 50% more heavily.
          *   *Wait, even better:* To specifically address the teacher, I need to explicitly separate $u(x)$ from $r(p)$. I should tell the student to *stipulate* linear utility for the sake of the argument. "Assume $100 is exactly twice as good as $50." If they still prefer the sure thing, it's risk weighting, not diminishing utility.

      *   **Misconceptions:**
          *   *Misconception 1: "You're just changing probabilities."* (Probability Weighting vs. Risk Function). Need to emphasize that the *objective* odds don't change, but their *decision weight* changes based on the global structure.
          *   *Misconception 2: "Risk aversion is a feeling/irrational."* Need to frame it as a *premise* of rationality, like patience.
          *   *Timing:* Kill Misconception 2 early (when breaking EV). Kill Misconception 1 during the math/formula reveal.

      *   **Phrasing ("Line up outcomes... weight depends on distribution underneath"):**
          *   This is actually a pretty good intuitive description of the cumulative distribution function transformation. It captures the "global" nature of the gamble. It's safe, provided they understand "weight" isn't "probability."

      *   **Scope Creep (What to avoid):**
          *   Don't derive the axioms (Sure Thing Principle violation).
          *   Don't get into the specific functional forms of $r(p)$ (power functions, etc.) unless necessary.
          *   Don't debate whether it's *true*, just that it's *coherent*.

      *   **Check-for-Understanding Question:**
          *   Needs to force a distinction between EU and RWEU.
          *   Scenario: Two agents, same utility for money, different choices. Why?

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (5 mins):* EV recap. The "Rationality = EV Maximization" dogma.
      *   *The Break (5 mins):* The $50/$100 example. Stipulate linear utility. Show EV says "indifferent," Intuition says "take the sure $50."
      *   *The Teacher Defense (5 mins):* Explicitly separate Utility ($u$) from Risk ($r$). This is the shield against the econ teacher.
      *   *The Mechanism (10 mins):* Whiteboard the RWEU formula. Visualize the "stacking" of probabilities. Explain the risk function $r(p)$.
      *   *Misconception Check (5 mins):* Address "lying about odds" vs. "caring about structure."
      *   *Closing:* The question.

  5.  **Refining the "Teacher Objection" Strategy:**
      *   The user is worried about the phone insurance example.
      *   *Advice:* Ditch phone insurance. It's too easy to conflate with diminishing marginal utility.
      *   *Replacement:* Use "Lab Dollars" or "Points." Stipulate $u(x) = x$. Then the only variable left is risk.
      *   *Argument:* If $u(x)$ is linear, EU *must* be indifferent. If you aren't indifferent, EU is wrong (or incomplete). RWEU fills the gap.

  6.  **Refining the Order:**
      *   Don't say "Rank" before explaining *why* rank matters. Rank matters because RWEU is sensitive to the *structure* of the gamble (global property), not just independent outcomes (local property).
      *   So: EV (Local) -> Intuition (Global matters) -> RWEU (Formalizing Global).

  7.  **Final Polish:**
      *   Tone: Peer-to-peer, encouraging but rigorous.
      *   Whiteboard visuals: Need to be simple.
      *   Time management: 30 mins is tight. Keep the math high-level.

  8.  **Self-Correction/Review against constraints:**
      *   *Did I explain RWEU?* No, I planned how *they* explain it.
      *   *Did I address the teacher objection?* Yes, by stipulating linear utility.
      *   *Did I address the misconceptions?* Yes, specific slots in the timeline.
      *   *Did I validate the phrasing?* Yes, with a caveat.
      *   *Did I provide the closing question?* Yes.

      *(Self-Correction on the "Rank" phrasing)*: The user's phrase "weight on each one depends on how much of the distribution is underneath it" is actually a description of the cumulative probability. In Buchak's framework, the risk function $r$ applies to the cumulative probability. So if $r$ is convex (risk-averse), the bottom outcomes get *more* weight than their probability suggests. The phrasing is okay, but needs to be precise that it's the *cumulative* probability being transformed.

      *(Final check on the Teacher Objection)*: The econ teacher is right that standard Econ explains insurance via concave utility. To beat him, the student must explicitly say: "We are holding utility constant and linear. We are isolating the attitude toward risk *itself*." This is the key philosophical move Buchak makes.

      *(Closing Question)*: Needs to be a "gotcha" for EU but solvable for RWEU. "Two people, same bank account, same utility for money. One buys insurance, one doesn't. EU says one is irrational. RWEU says both can be rational. Why?"

      *Wait, let's make it more concrete.* "I offer you $50 for sure, or a coin flip for $0/$100. You take the $50. Is it because $100 isn't twice as good as $50, or because you care about the guarantee?" This forces the distinction.

      *Actually, the best question:* "If I prove your utility function for money is linear, does Expected Utility Theory say you're irrational for buying insurance?" (Answer: Yes. RWEU says: No.)

      *Let's go with the "Same Utility, Different Choice" question.*

      *Okay, ready to write.*
answer: |-
  This is a fantastic topic for a high school econ club. You're right to be worried about the econ teacher; the "diminishing marginal utility" objection is the standard defense of Expected Utility (EU) theory against risk aversion. Lara Buchak's work is specifically designed to pierce that shield.

  Here is your 30-minute battle plan.

  ### 1. The Order of Operations
  **Do not start with the math.** If you write a formula with a risk function $r(p)$ on the board immediately, their eyes will glaze over, and they will map it onto "weighted probability" (prospect theory) incorrectly.

  **The Sequence:**
  1.  **The Dogma (5 mins):** Establish EV/EU as the "Rational Default."
  2.  **The Intuition Pump (5 mins):** Break the dogma with a case where EV fails *even if money is linear*.
  3.  **The Shield (5 mins):** Pre-empt the econ teacher (Utility vs. Risk).
  4.  **The Mechanism (10 mins):** The Whiteboard Math (how RWEU actually works).
  5.  **The Cleanup (5 mins):** Misconceptions and Q&A.

  **On "Rank":** Do not use the word "rank" until you have explained that RWEU cares about the **global structure** of the gamble. In standard EV, outcomes are independent local facts. In RWEU, an outcome's value depends on where it sits in the whole distribution. If you say "rank" too early, they'll think you're just sorting numbers. You need them to understand that *position matters* first.

  ### 2. The Example (Beating the Econ Teacher)
  **Drop the phone insurance example.** It is too easy to conflate with diminishing marginal utility. Your teacher is right: in standard Econ, buying insurance is rational *because* losing $400 hurts more than 5x the pain of losing $40. That is a claim about $u(x)$, not risk.

  **Use the "Lab Dollar" Example.**
  To isolate risk from utility, you must stipulate that utility is linear.

  **The Setup (Sketch this on the board):**
  *   **Currency:** "Club Points."
  *   **Stipulation:** 100 Points is *exactly* twice as good as 50 Points. (Utility is linear: $u(x) = x$).
  *   **Choice:**
      *   **Option A:** 50 Points for sure.
      *   **Option B:** 50% chance of 0 Points, 50% chance of 100 Points.

  **The Argument:**
  1.  **EV Calculation:** Both options have an Expected Value of 50.
  2.  **EU Prediction:** Since $u(x)$ is linear, Expected *Utility* is also identical. Standard theory says you should be **indifferent**.
  3.  **The Reality:** Most people prefer Option A.
  4.  **The Teacher's Trap:** If you use real money, the teacher says "You prefer A because $100 isn't twice as good as $50."
  5.  **The Comeback:** "We stipulated linear utility. If you still prefer A, it's not because of the *value* of the points, it's because of the *risk* of the gamble. EU theory calls this irrational. Buchak says it's a different rational attitude."

  This example is immune to the teacher's objection because you have explicitly controlled for marginal utility.

  ### 3. Killing the Misconceptions
  You have two big fires to put out. Here is exactly where to douse them.

  **Misconception 1: "You're just pretending the probabilities are different." (Probability Weighting)**
  *   **When to kill it:** During the **Mechanism (Whiteboard)** phase.
  *   **How:** Students will think RWEU is just Prospect Theory (changing 50% to 40% in your head).
  *   **The Script:** "I am not changing the odds. The coin is still 50/50. I am changing how much that 50% *matters* to my decision based on where it falls in the stack. In EU, probability is a weight. In RWEU, probability is an input into a risk function."
  *   **Visual:** Draw a standard probability scale (0 to 1). Draw a curved line above it (the risk function $r$). Show that $r(0.5)$ might equal $0.3$ (if risk-averse). Emphasize: "The world hasn't changed. My evaluation of the *structure* has."

  **Misconception 2: "Risk aversion is a feeling, not a reason." (Irrationality)**
  *   **When to kill it:** During **The Shield** phase (before the math).
  *   **How:** Frame risk attitude like "patience."
  *   **The Script:** "If I prefer $50 today over $60 next week, am I irrational? No, I have a high discount rate. If I prefer a sure 50 points over a gamble for 100, am I irrational? No, I have a high risk-aversion parameter. It's a premise of rationality, not a violation of it."

  ### 4. Your Phrasing Check
  > *"You line up the outcomes worst to best, and the weight on each one depends on how much of the distribution is underneath it."*

  **Verdict:** This is **90% correct**, but the last clause is dangerous.
  **The Fix:** Change "how much of the distribution is underneath it" to **"the cumulative probability up to that point."**
  **Why:** "Distribution underneath" sounds vague. RWEU specifically transforms the *cumulative probability function*.
  **Better Phrasing:** "You order outcomes from worst to best. The weight you give an outcome isn't just its probability; it's the difference in your *risk-function* applied to the cumulative probability."
  *(Keep it simple for them, but be precise on "cumulative.")*

  ### 5. Scope Creep: What to Refuse to Cover
  You have 30 minutes. If you try to cover these, you will fail. Explicitly tell them:
  1.  **"I am not proving the Axioms."** (Sure Thing Principle violation). If someone asks *why* we drop Independence, say: "That's the technical proof, but today we're looking at the structural fix."
  2.  **"I am not deriving the Risk Function."** Don't let them ask "What shape is $r(p)$?" Just say "It's a curve that represents your attitude, like a fingerprint."
  3.  **"I am not debating if it's True."** You are arguing it is *Coherent*. Don't get bogged down in whether people *actually* act this way (psychology) vs whether they *should* (normative).

  ### 6. The Closing Question
  Do not ask "Does this make sense?" They will lie to be polite. Ask a question that forces them to choose between EU and RWEU.

  **The Question:**
  > "Imagine two people. They both value money exactly the same way (linear utility). Person X takes the sure $50. Person Y takes the 50/50 gamble for $0/$100.
  >
  > **According to Expected Utility Theory, one of them is making a mistake. According to Risk-Weighted EU, both can be rational. Why?**"

  **The Answer you want to hear:**
  "Because EU says rationality is only about the value of outcomes and objective odds. RWEU says rationality also includes your attitude toward the *structure* of the risk itself."

  ### Whiteboard Layout Plan (For your 30 mins)
  *   **Left Panel:** The "Lab Dollar" Choice (Option A vs B). EV calculation showing they are equal.
  *   **Center Panel:** The Formula.
      *   EU: $\sum p \cdot u(x)$
      *   RWEU: $\sum [r(\text{cum } p) - r(\text{cum } p_{\text{prev}})] \cdot u(x)$
      *   *Draw the risk curve $r(p)$ next to it.*
  *   **Right Panel:** "The Teacher Objection."
      *   Write: $u(x)$ = Value of Money.
      *   Write: $r(p)$ = Attitude toward Risk.
      *   Draw a line between them. "Today we hold $u(x)$ constant to test $r(p)$."

  Good luck. If you hold the line on "Linear Utility," you will shut down the econ teacher's objection before he even stands up.
