answer: |-
  # Specification for a Theory of Material Constitution

  ## 1. The Requirements List

  The following criteria constitute the adequacy conditions for any metaphysical account of material constitution. Each requirement is paired with its motivating consideration and classified as either **Non-Negotiable** (a condition of logical or explanatory coherence) or **Local Prejudice** (a methodological or intuitive preference specific to certain metaphysical camps).

  | Requirement | Motivating Case or Consideration | Status |
  | :--- | :--- | :--- |
  | **1. Accommodation of Modal Mismatch** | **The Statue and the Clay:** The artefact (statue) is destroyed if squashed into a disc; the matter (clay) survives. They appear to have different persistence conditions. | **Non-Negotiable** (Phenomenological Data) |
  | **2. Compliance with Leibniz's Law** | **The Indiscernibility of Identicals:** If $x$ is identical to $y$, they must share all properties. Any theory denying identity must locate a genuine property difference; any theory affirming identity must explain away apparent modal differences. | **Non-Negotiable** (Logical Constraint) |
  | **3. The Grounding of Persistence** | **Metaphysical Explanation:** If two entities in the same place have different persistence conditions, this difference must be grounded in some non-modal, categorical fact (e.g., arrangement, function), not merely restated as a brute modal difference. | **Non-Negotiable** (Explanatory Demand) |
  | **4. Ontological Parsimony** | **Ockham's Razor:** Coincidence realism posits two entities where ordinary perception suggests one. If the second entity is undetectable and causally redundant, it risks being an unnecessary multiplication of being. | **Local Prejudice** (Methodological) |
  | **5. Resolution of the Counting Problem** | **How Many?:** If a statue and a clay lump coincide, how many objects are on the pedestal? Sortal-relativity must explain whether this question has a determinate answer or merely relocates the ambiguity to the sortal term. | **Non-Negotiable** (Semantic Coherence) |
  | **6. Diachronic Continuity** | **Fission and Replacement:** The theory must handle the Ship of Theseus, gradual replacement of parts, and fission cases without entailing contradictory identity claims or arbitrary cut-off points. | **Non-Negotiable** (Temporal Coherence) |
  | **7. Treatment of Vague Boundaries** | **Spatial Vagueness:** Artefacts (and organisms) often lack precise spatial boundaries. The theory must state whether this vagueness is ontic (in the world) or semantic (in our description). | **Local Prejudice** (Metaphysical Commitment) |
  | **8. The Organism-Body Relation** | **Animalism vs. Constitution:** A human organism and the body it constitutes appear coincident. The theory must clarify whether *I* am the organism, the body, or something constituted by them, avoiding the 'too many thinkers' problem. | **Non-Negotiable** (Self-Identification) |
  | **9. Determinacy of Reference** | **Demonstratives:** When a speaker points and says 'this', what fixes the reference between coinciding candidates? The theory must explain how ordinary reference succeeds without magical disambiguation. | **Non-Negotiable** (Linguistic Practice) |

  ## 2. The Incompatible Subset (The Metaphysical Trilemma)

  There exists a subset of requirements that cannot be jointly satisfied without significant theoretical cost. This trilemma forms the core tension of the thesis chapter:

  1.  **The Modal Intuition:** Distinct persistence conditions imply non-identity (Requirement 1).
  2.  **Categorical Supervenience:** Modal properties must supervene on non-modal, intrinsic properties (Requirement 3).
  3.  **The Principle of Coincidence:** Two things cannot occupy the exact same spatial region at the same time without being identical (related to Requirement 4).

  **The Conflict:**
  If the statue and the clay share all categorical properties (as **Categorical Supervenience** and **The Principle of Coincidence** suggest), they cannot differ modally without violating **Categorical Supervenience**. If they do differ modally (**The Modal Intuition**), then either they are not coincident (violating **Coincidence**), or their modal differences are brute facts ungrounded in categorical reality (violating **Categorical Supervenience**).

  Consequently, a theory must reject at least one horn:
  *   **Identity Theories** reject (1).
  *   **Coincidence Realists** reject (3) or accept brute modal facts.
  *   **Relativists** modify (2) by making identity sortal-relative.

  ## 3. The Most Eliminative Requirement

  The single requirement that eliminates the greatest number of contenders is **Requirement 3: The Grounding of Persistence**.

  While many theories can accommodate the modal data or preserve logical consistency, few can provide a non-circular ground for why persistence conditions differ.
  *   **Standard Constitution Views** often posit that sortal concepts ground persistence, but this risks circularity (the sortal is defined by the persistence conditions it is meant to ground).
  *   **Identity Theories** fail because they deny the data requiring grounding.
  *   **Four-Dimensionalism** often treats temporal parts as brute, failing to ground *why* certain stages compose an object with specific modal profiles.
  *   **Eliminativism** avoids the issue by denying the entities, but at too high a cost to Requirement 9 (Reference).

  Insisting on a robust, non-modal ground for modal differences filters out theories that rely on brute essentialism or linguistic convention alone.

  ## 4. Scoring the Main Contenders

  **Extensionalism (Identity Theory):**
  Scores highly on Parsimony and Leibniz's Law but fails decisively on the **Modal Mismatch**. It requires denying the intuitive difference between the statue and the clay, rendering it counter-intuitive for ordinary artefacts.

  **Eliminativism:**
  Satisfies Parsimony and avoids the Counting Problem by denying the existence of composite artefacts. However, it collapses under **Referential Determinacy** and **Ordinary Discourse**, making it impossible to explain the success of our daily interactions with objects.

  **Coincidence Realism (Constitution View):**
  Accommodates the **Modal Mismatch** and **Leibniz's Law** by positing distinct entities. However, it struggles severely with **Parsimony** and the **Grounding Requirement**, as it must explain how two things can be materially identical yet metaphysically distinct without brute facts. It also faces the 'Too Many Thinkers' objection regarding **Organisms**.

  **Sortal Relativism:**
  Attempts to dissolve the conflict by making identity relative to a sortal concept. While this addresses the **Counting Problem**, it places immense strain on **Leibniz's Law** (requiring a non-standard logic) and often fails to provide a metaphysical ground for *why* sortals dictate persistence, merely relocating the mystery.

  **Four-Dimensionalism (Perdurantism):**
  Performs well on **Diachronic Continuity** and **Modal Mismatch** by treating objects as space-time worms. However, it faces significant challenges regarding **Vague Boundaries** (epistemicism vs. ontic vagueness) and **Referential Determinacy**, as it is unclear how temporal parts secure reference to the 'whole' object in ordinary contexts.

  *Conclusion:* No theory satisfies the specification without cost. The thesis must argue which requirement is most dispensable or propose a novel grounding mechanism to resolve the trilemma.
