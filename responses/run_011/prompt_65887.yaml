answer: |-
  # The Stage of Virtue: Rousseau and the Festival of the Supreme Being

  ### Applying the Test
  The Festival of the Supreme Being stands as the historical limit-case for Rousseau's *Letter to d'Alembert*. To determine whether 20 Prairial was a Rousseauian festival or merely theater in disguise, we apply the tripartite test of Authorship, Assignability, and Excess.

  On Authorship, the festival fails comprehensively. Rousseau's ideal festival generates its script from the participants' own dispositions; the people gather and *become* the spectacle through spontaneous interaction. On 20 Prairial, the script was composed by Jacques-Louis David and Robespierre. The symbolism—the burning of Atheism, the emergence of Wisdom—was not an expression of popular sentiment but an instruction delivered to the crowd. On Assignability, it likewise fails. Rousseau demands that any citizen take up any role, dissolving the distinction between actor and spectator. Here, roles were distributed from above by section, age, sex, and office. The people were arranged like props in a tableau vivant, not merged into a unity.

  On Excess, the verdict is ambiguous but leans toward failure. Rousseau argues theatrical pity discharges compassion without obligation, whereas festival feeling is spent in the doing. The crowd on the Champ de Mars certainly sang and marched; the feeling was enacted. However, because the action was choreographed to honor the Convention and the Supreme Being rather than the people themselves, the emotional surplus was deposited into the state, not circulated among citizens. The test holds: 20 Prairial was theater. This does not invalidate Rousseau's distinction; rather, it confirms that the Festival was never an instance of his ideal. It was a theatrical representation of unity, not unity itself.

  ### The Talma Problem
  The presence of François-Joseph Talma, France's celebrated tragedian, sharpens this failure. Rousseau's objection to players concerns the public sale of one's person for pay, creating a class of professional impostors. In the Festival, Talma served as an organizer and designer. Does it matter whether he walked in the procession or only designed it? For Rousseau, it does not. If he designed it, he is the playwright; if he walked, he is an actor playing a citizen. Both roles violate criterion (i).

  The tension here is structural. By employing the Republic's greatest tragedian to stage an anti-theatrical civic event, the Revolution admitted that the people could not generate their own spectacle. They required a professional to teach them how to be free. Talma's presence confirms that the Festival was a production, not a gathering. The "people" were the audience instructed to applaud themselves, mediated by the very trade Rousseau claimed corrupted public morals. The anti-theatrical state thus relied on theatrical expertise to sustain its illusion of authenticity.

  ### Scale and Volition
  Rousseau's festival presupposes a small, face-to-face city like Geneva (20,000 souls), where homogeneous *moeurs* allow for spontaneous recognition. The decree of 18 Floréal ordered every commune in a nation of twenty-eight million to enact the same program. This scale destroys the claim that "the people become the spectacle." In a nation, the people are an abstraction; only representatives can embody them. On the Champ de Mars, the "people" were a curated selection of categories (mothers, soldiers, aged), standing in for the whole.

  Furthermore, Rousseau's festival must be voluntary. In Paris, under the Revolutionary Government at the height of the Terror, absence was politically legible as counter-revolutionary sentiment. A mandated festival is not a celebration of liberty but a drill of obedience. When attendance is coerced, the "doing" is not an expenditure of free feeling but a performance of survival. This transforms the festival from a bond of citizenship into a mechanism of surveillance. The scale and coercion ensure that the event functions as a display of state power over the population, rather than the population's display of itself.

  ### The Foil and the Magistrate
  Which festival does the *Letter* condemn more severely: the Festival of Reason (November 1793) or the Festival of the Supreme Being? The Festival of Reason was overt theater: staged inside Notre-Dame, featuring an opera singer as the Goddess. It was honest about its artificiality. The Festival of the Supreme Being, however, claimed to be natural, held outdoors on an artificial mountain, purporting to be the voice of conscience. Rousseau would condemn the latter more severely. It is not the building that makes theater ruinous, but the representation. The Supreme Being festival masked its theatricality under the guise of virtue, making the deception more dangerous. It flattered the public's disposition toward virtue while intensifying the disposition toward obedience.

  This deception culminates in the figure of the presiding magistrate. Robespierre spoke from an elevated platform while others marched. He was the sole actor addressing the spectators; the rest were the chorus. The irony that the representative of virtue was identified with the guillotine is not merely rhetorical; it does analytical work for Rousseau's account. It demonstrates the *Letter*'s warning that when virtue is performed, it becomes a mask. Robespierre isolated himself on the mountain, separating the source of virtue (the Leader) from the recipients (the People). This spatial arrangement recreated the theater's division of active performer and passive spectator, validating Rousseau's claim that such structures isolate rather than unite. The bloodiness of the regime underscores that theatrical pity (for the Republic) discharged any obligation to actual mercy.

  ### Reversing the Lens
  When we apply the Festival back to the *Letter*, the episode confirms Rousseau's central claim: spectacles cannot remake *moeurs*, only express them. The regime fell seven weeks later. The Festival expressed the desperate unity sought by the elite, not the actual morals of the nation. It was an index of fracture, not cohesion. However, the episode discloses a third category Rousseau's *Letter* has no name for: mass spectacle as an instrument of state power. Rousseau assumes spectacles are either corrupting amusements or organic celebrations. He does not contemplate a festival composed by a government, enforced by decree, and used to legitimize a specific political theology.

  Here, Rousseau's own *Social Contract* sits against the *Letter*. The decree's articles read like the dogmas of civil religion put to music: belief in a deity, the afterlife, the sanctity of the social contract. The *Social Contract* permits the sovereign to enforce these dogmas, even by death. The Festival was the liturgy of that civil religion. Thus, the *Letter*'s hope for spontaneous, organic moral renewal is contradicted by the *Social Contract*'s acceptance of engineered civic religion. The *Letter* is silent on the possibility of a state-enforced festival; it assumes a free people. The Festival of the Supreme Being reveals that when the state attempts to engineer the *Letter*'s solution, it produces the *Social Contract*'s coercion.

  ### Conclusion: Costs and Saves
  This analysis saves Rousseau's diagnosis while costing his prescription. It saves his claim that theater cannot improve morals and that representation isolates the citizen. The failure of 20 Prairial proves that a scripted virtue is no virtue at all. However, it costs the feasibility of Rousseau's alternative. The *Letter* proposes the festival as a remedy, but the historical application shows that in a modern nation-state, the festival cannot remain spontaneous. It inevitably becomes a tool of the very representation it seeks to escape.

  The episode reveals a tragic inconsistency in Rousseau's political thought. The *Letter* demands organic unity, but the *Social Contract* requires dogmatic enforcement. The Festival of the Supreme Being attempted to bridge this gap by enforcing spontaneity. Its collapse demonstrates that the *Letter*'s festival is impossible without the small, homogeneous city Rousseau lamented was lost. Ultimately, the Festival confirms that while spectacles cannot remake *moeurs*, they can certainly weaponize them. Rousseau's theory survives the critique of theater, but it cannot survive the reality of the state attempting to become the stage manager of the soul.
