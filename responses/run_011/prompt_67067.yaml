answer: |-
  **Translation of Claims**

  1.  **Rules against standards.** Tight fit. Like "unreasonable search," the category 'a' resists definition by necessary and sufficient features. Both frameworks accept this resistance as permanent, not a descriptive failure.
  2.  **Reasoning by analogy along a line of cases.** Bending. Law treats the *ratio decidendi* as a stored rule applied anew; Letter Spirit says the rule is constructed afresh. Loss: The legal fiction that the law pre-exists the decision.
  3.  **Holding and dicta.** Tight fit. You cannot subtract facts (style) to find pure law (core). The holding exists only as realized in its factual matrix; there is no platonic rule underneath.
  4.  **Core instances and penumbra.** Tight fit. Membership is graded. **Distinguishing and overruling** manages the contextual pressure; a case's meaning shifts based on the doctrinal landscape surrounding it, constituting what it must not be mistaken for.
  5.  **Requirement that a decider publish articulable reasons.** No counterpart. Law requires justification; Letter Spirit posits that competent judgment may be subpersonal and inarticulable. The legal system cannot validate a decision based on "settled pressures" alone.

  **Residue Report**

  Claim 5 has no expression in your system. A regime requiring reasoned opinions cannot accommodate inarticulate intuition as a valid ground of decision. You may suspect a judge knows the outcome via "competing pressures," but you cannot write it. Regarding Claims 1 and 5: Letter Spirit treats them as ontological truths about the category (the fuzziness *is* the thing). Law often treats them as epistemic limitations or pragmatic tools (we use standards because we lack precise rules). The residue suggests your vocabulary misses the subpersonal mechanism of categorization, but not necessarily the logical structure. The researchers describe *how* we judge; you describe *how we justify* judging. The residue is not indeterminacy; it is the gap between cognition and justification.

  **Instinct Check**

  Your instinct is right: this is reasoning from precedent with pictures substituted for cases. It is analogical coherence. However, you smuggle an assumption: that authority fixes the category. In Letter Spirit, coherence fixes the category. In law, a Supreme Court ruling fixes the category, even if incoherent. The translation works only if you ignore the vertical authority structure and focus on horizontal coherence. If you assume the "chain of comparisons" *makes* the law rather than *justifies* the authority's choice, you are importing the cognitive framework into the legal one.

  **Confidence Statement**

  I am highly confident in the mappings for Claims 1, 3, and 4, as these align with standard legal realism. I am moderately confident in the ontological versus epistemic distinction in the Residue Report, as legal philosophers debate this vigorously. I am least sure about Claim 2's "no counterpart" status regarding the generative rule; Legal Realists argue law is always made anew, which would tighten that fit, but formalist doctrine contradicts it. I flag this uncertainty because it depends on whether you view law as it is practiced or as it is formally described.
