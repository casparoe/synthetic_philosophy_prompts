  1. The only known construction of a logical inductor is computable in principle but so astronomically slow it's useless as an actual algorithm. If no reasoner with a realistic budget can actually satisfy this criterion, what work is the criterion doing? Is it a target we aim at but miss, or something else?

     **Follow-up:** But if you say it's just a regulative ideal like Bayesian coherence, doesn't that undercut your claim that the trader restriction is a substantive normative commitment? You can't be committed to an ideal you literally cannot instantiate.

  2. Your guarantee is purely asymptotic. Nothing rules out an inductor that prices blatant contradictions near 1 for a googol steps and only shapes up in the limit. What normative work is the criterion doing on any given day, say, step ten thousand?

     **Follow-up:** If you answer that it performs well empirically in practice, aren't you relying on an contingent claim about the world rather than the normative force of the framework itself? If the math allows the googol-step error, why shouldn't I worry I'm in those steps?

  3. In standard Dutch-book arguments, getting money-pumped shows you'll lose actual resources, which people argue isn't the same as being irrational. Here the market is hypothetical and you never actually trade. Does non-exploitability inherit that worry? And does the criterion happily license an agent that is confidently wrong in ways only an uncomputable trader could catch?

     **Follow-up:** If you say uncomputable traders aren't relevant threats, then isn't rationality just relative to the computational power of your enemies? That sounds more like security than epistemology.

  4. The framework uses a market metaphor with many traders, but you're modeling a single reasoner. Are these traders supposed to be distinct sub-agents, or just mathematical devices?

     **Follow-up:** If they're just mathematical devices representing potential criticisms, why do those criticisms have resource constraints? A logical contradiction doesn't care how long it takes to find it.

  5. You argue restricting traders to polynomial-time is a substantive normative commitment, not just convenience. What happens at the extremes? Does a big enough trader class collapse back into logical omniscience, and does a small enough one make the criterion vacuous? Is there a principled stopping point between triviality and omniscience?

     **Follow-up:** If you say P is the stopping point because it's a robust complexity class, robustness isn't normativity. Why is P the *right* ideal for reasoning rather than just the *feasible* one?

  6. You say the restriction to polynomial-time traders is a commitment we could rationally revise upward. If our computational power increases, does the standard of rationality actually change?

     **Follow-up:** That makes rationality relative to hardware. Is there any core of rationality that stays fixed regardless of how fast the computer runs, or is logic just a function of clock speed?

  7. Take your motivating case: feeling that a proved bound on gaps between primes is evidence for a conjecture it doesn't strictly imply. What in the framework licenses that update, given that only patterns writable in polynomial time are supposed to be learned in a timely way?

     **Follow-up:** If the pattern relies on mathematical insight not yet formalized into a poly-time algorithm, how does the inductor catch it before the proof exists? You seem to need the insight to build the trader, but the trader is supposed to generate the insight.

  8. I want to press on self-reference. You handle it by letting sentences talk about the reasoner's own prices. But what's genuinely left of the problem once you grant that? Specifically, what happens if those prices get fed directly into a decision procedure that acts on the belief about its own action?

     **Follow-up:** If you say it converges to a fixed point, does it converge to the *right* fixed point, or just any stable one? Stability isn't correctness.

  9. You replace Bayesian coherence with non-exploitability because coherence is impossible for bounded agents. But if I satisfy your criterion while violating coherence, am I less rational than the Bayesian ideal or just differently rational?

     **Follow-up:** If you say differently rational, why use probability at all? Why not just keep prices as betting odds without claiming they approximate a coherent measure?
