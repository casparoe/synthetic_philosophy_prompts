prompt: |-
  So here's my situation, sorry if it rambles. My sister and her husband are doing IVF with genetic testing on the embryos, and my mother in law says "you're playing God" every single time it comes up, and that ends the conversation instantly, nobody answers it. Meanwhile I've been reading stuff online on my own and ran into this argument called procreative beneficence, which is basically the philosopher's version of saying that if you can choose which child to have you should choose the one expected to have the best life — so it treats what my sister is doing as not just allowed but the right call. Those two things are supposed to be in conflict but neither side is actually arguing, they're just repeating lines at each other. I never took a philosophy course so I can't do this part myself.

  You're a philosopher who's worked on reproductive ethics and who's good at taking apart ordinary moral slogans, so please do it for me. Take "playing God" and lay out the different precise claims somebody could be making with those two words. For each one, say what would actually have to be true for it to be true, and say whether it's just uncontroversial, whether it's defensible but genuinely contested, or whether it doesn't hold up. Then the part I care about most: for each reading, does it actually push back against that procreative beneficence argument, or does it miss it entirely? My hunch is that some version of "we can't foresee what we're doing" is the only one carrying any weight, and I want to know wether that's right. And is there a reading where the objection isn't about consequences at all but about the parents' attitude, like what it expresses about them? Also flag which readings prove too much, because if playing God rules out picking embryos it looks like it should rule out vaccines and C-sections and half of medicine too, and I want to know which versions have that problem and how someone would try to draw the line.

  Think it through carefully and work over the candidate readings one at a time before you settle on verdicts. But don't hand me an essay with headers and bullets and bold and tables, just write continuous prose like you're sending me an email, a handful of paragraphs.
