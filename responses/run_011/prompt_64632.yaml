answer: |-
  It is completely understandable that you feel stuck when conversations shut down behind a slogan like that, because you are right to sense that playing God is not a single argument but a container for several distinct worries that rarely get disentangled. The first reading is the literal theological claim that reproductive sovereignty belongs exclusively to a deity, so for this to be true, it must be the case that God exists and has issued a specific prohibition against human intervention in conception. Within a specific religious framework this is defensible though contested, but secularly it doesn't hold up as a public reason. This version directly conflicts with procreative beneficence because it prioritizes obedience to divine will over maximizing welfare, but it does prove too much unless one draws a sharp line between therapy and enhancement. A proponent would have to argue that curing infertility via IVF is restoring natural function like medicine does, whereas genetic selection is altering human nature, though many find that distinction fragile since both involve technological intervention.

  The second reading is the one you suspected, which is about epistemic hubris rather than divine authority. For this claim to hold water, it must be true that human knowledge is too limited to foresee the long-term consequences of selecting embryos, whether for the individual child or society at large. This is defensible and genuinely contested, as it relies on empirical claims about genetics and sociology rather than faith. This pushes back against procreative beneficence by attacking its feasibility, arguing that we cannot actually know which child will have the best life because traits we view as beneficial might have hidden costs or because reducing genetic diversity harms the population. This version does not necessarily prove too much against vaccines or C-sections because those interventions address known, immediate threats to health, whereas genetic selection involves complex trade-offs about future quality of life that are far less predictable, so the line here is drawn based on the certainty of the medical knowledge involved.

  The third reading shifts focus from consequences to the moral attitude of the parents, suggesting that selection expresses a commodification of children or conditional love. For this to be true, it must be the case that the act of choosing embryos inherently communicates that a child is a product to be designed rather than a gift to be received. This is also defensible but contested, as it depends on a theory of what actions express what virtues. This objection largely misses the point of procreative beneficence because PB is concerned with the outcome for the child, while this argument is concerned with the moral character of the parents and the nature of the relationship. However, this reading avoids proving too much because treating a sick child with vaccines expresses care for an existing person, whereas selecting embryos expresses quality control over a future person, marking a morally relevant difference in how we relate to patients versus progeny.

  Your hunch is largely correct that the unforeseen consequences argument is the only one carrying significant weight in a secular debate, but you should not overlook the attitudinal objection because it addresses the moral cost even if the outcome is good. The divine authority argument is the one that most frequently proves too much, collapsing into a rejection of most modern medicine unless carefully qualified, which is why people often retreat to the hubris or attitude arguments when pressed. If you want to reopen the conversation with your mother-in-law, you might ask her which of these worries is driving her, because if she is worried about hubris, you can discuss the limits of genetic knowledge, but if she is worried about attitude, you are having a completely different conversation about what it means to be a parent that procreative beneficence does not even attempt to answer.
