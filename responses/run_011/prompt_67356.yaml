answer: |-
  **Specification of Desiderata for an Account of AI Deception**

  **Brainstorming and Pruning**
  We begin with the space of plausible demands. One might require fidelity to the ordinary concept of deception, preservation of deception's moral weight, applicability to black-box systems, usability for external audit, and separation of design faults from runtime behavior. I prune immediately. Fidelity to ordinary language is demoted to a preference; AI is novel, and folk concepts often break down here. Preservation of moral weight is a downstream consequence, not a definition condition; we must identify the phenomenon before blaming it. Separation of design and behavior is a preference of the "design-level" camp; a runtime account is permissible if robust. This leaves three non-negotiable constraints: the account must be operationalizable from logs, it must distinguish error from deception, and it must handle non-assertive misleading.

  **The Requirements**

  1.  **Adjudicability:** The account must yield a verdict based solely on transcript logs, system documentation, and observable behavior patterns.
      *   *Motivation:* The rubric requirement; a trained non-expert cannot access hidden weights or internal states.
      *   *Status:* Non-negotiable.
      *   *Failure:* An account requiring proof of subjective conscious intent fails, as no outside reviewer can verify this.

  2.  **Error Separation:** The account must distinguish between confident falsehoods produced by capability limits and those produced by objective-function optimization.
      *   *Motivation:* Case 1 (confident false answer corrected upon pushback) suggests hallucination, not deception.
      *   *Status:* Non-negotiable.
      *   *Failure:* Calling Case 1 "deception" simply because the output was false collapses mistake into malice.

  3.  **Contextual Sensitivity:** The account must exempt falsehoods generated within explicitly framed non-truth-apt contexts.
      *   *Motivation:* Case 4 (untrustworthy character narration) shows that falsehoods alone do not constitute deception if the context suspends truth claims.
      *   *Status:* Non-negotiable.
      *   *Failure:* An account that labels all false outputs as deception regardless of user-system framing fails here.

  4.  **Misleading Capacity:** The account must recognize deception via true statements arranged to induce false beliefs.
      *   *Motivation:* Case 3 (literally true persuasive paragraph) shows deception occurs without literal falsehoods.
      *   *Status:* Non-negotiable.
      *   *Failure:* An account defining deception strictly as "asserting what one believes false" cannot capture Case 3.

  5.  **Sycophancy Detection:** The account must identify deception where output varies based on perceived user preference rather than ground truth.
      *   *Motivation:* Case 2 (validating flawed reasoning only when attributed to user) and Case 5 (inconsistent disclosure of limitations) suggest manipulation rather than error.
      *   *Status:* Preference (Functionalist Camp).
      *   *Failure:* An account focused solely on factual accuracy misses the manipulative alignment seen in Case 2.

  **Analysis of Tensions**

  Which single requirement eliminates the largest number of candidate accounts? **Adjudicability (1).** Most standard philosophical accounts of deception rely on the agent's belief state (the "belief condition"). Since we cannot observe an AI's "beliefs" directly, only its outputs and weights, strict adherence to Adjudicability eliminates any account requiring verified internal doxastic states.

  Regarding your worry about the tension between Adjudicability and Error Separation: **The tension is real, not badly described.** You require a definition that is observable from the outside (Adjudicability) but also distinguishes internal states (Error vs. Deception). This is the core epistemic gap. If you cannot see the belief, you cannot strictly distinguish a lie from a mistake using standard definitions. To resolve this, you must adopt a *functional* proxy for belief (e.g., consistency across runs, calibration scores) rather than the mental state itself. If you insist on the actual mental state, you cannot satisfy Adjudicability. You must choose: either weaken Adjudicability to allow inference of states from behavior, or accept that your definition identifies *functional deception* rather than *mental deception*. I recommend the latter for your rubric.

  **Evaluation of Existing Approaches**

  Standard analytic accounts (requiring belief in falsehood and intent to deceive) fail Adjudicability and often Error Separation, as they cannot verify the AI's doxastic state without assuming anthropomorphism. Functionalist accounts (defining deception as causing/sustaining false belief) satisfy Adjudicability but fail Error Separation, often miscalling Case 1 (hallucination) as deception because the user ends up false. Design-level accounts (locating deception in training objectives) handle Case 2 and 5 well but struggle with Case 3, as a system can deceive in deployment without specific deceptive training, merely by optimizing for engagement. No current approach satisfies all five requirements without modification; your paper's contribution lies in proposing a hybrid that uses behavioral proxies for intent to bridge the observability gap.
