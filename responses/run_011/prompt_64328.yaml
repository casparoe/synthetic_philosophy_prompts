  We swore the coins lay flat upon the table.
  Each stack the same height, gleaming in the light.
  No hand held more than what the neighbor had.
  A perfect geometry of silver cents.

  Each stack the same height, gleaming in the light.
  Then the tall man opened up the gate.
  A perfect geometry of silver cents.
  They poured themselves into his wooden box.

  Then the tall man opened up the gate.
  A quarter for the view of playing hard.
  They poured themselves into his wooden box.
  The table lost its even, leveled look.

  A quarter for the view of playing hard.
  Now one pile towers while the rest lie thin.
  The table lost its even, leveled look.
  To fix it, we must reach into his lock.

  Now one pile towers while the rest lie thin.
  We take the surplus back to smooth the row.
  To fix it, we must reach into his lock.
  Yet old debts stain the legs of every table.

  We take the surplus back to smooth the row.
  We swore the coins lay flat upon the table.
  Yet old debts stain the legs of every table.
  No hand held more than what the neighbor had.

  **How the repetitions do the argument**

  The pantoum's recursive structure mirrors Nozick's cyclical dilemma. Lines 2 and 4 of each stanza become lines 1 and 3 of the next, forcing the reader to revisit previous images in new contexts. Initially, "Each stack the same height, gleaming in the light" (S1) describes a just distribution (D1). When repeated in S2, it becomes the baseline before disruption, emphasizing what is about to be lost. Similarly, "They poured themselves into his wooden box" shifts from voluntary action (S2) to irreversible consequence (S3), highlighting the aggregation of individual choices.

  The argument moves from the initial pattern (S1) through the voluntary transfers (S2–S3) to the disrupted outcome (S4). S5 attempts restoration ("We take the surplus back to smooth the row"), acknowledging the need to undo the transfer to maintain the pattern. However, the final stanza introduces the rectification complication.

  Crucially, the final stanza retrieves S1's first and third lines as its own second and fourth. "We swore the coins lay flat upon the table" returns in S6, but now follows the act of forced redistribution. It sounds less like a fact and more like a fragile assertion or a cover-up. The new line, "Yet old debts stain the legs of every table," intervenes between the repeated claims, introducing historical injustice without jargon. When "No hand held more than what the neighbor had" closes the poem, it is deeply ironic; the "old debts" suggest the initial distribution was never clean. The form forces the argument back to its start, but the meaning has shifted: the pattern cannot hold because the ground beneath it is compromised. The loop closes, but the justice remains open, requiring endless rectification. The repetition demonstrates that restoring the pattern requires constant intervention, yet the final return reveals the starting point was illusory.
