answer: |-
  Hi there,

  It is good to hear from you, and I want to start by saying that Dana is sharp. Her argument is a very clean reconstruction of the skepticism that haunted dispositional talk for most of the twentieth century, and it is no surprise you are finding it sticky. It captures exactly why the simple conditional analysis died, and it tries to kill the reformed analysis by suggesting it inherits the same disease. You are right to feel that something goes wrong in the move from her fourth point to her fifth, but I think the deeper error lies earlier, in the very first claim she makes about what a disposition is. If you want to save dispositions without treating them as brute primitives that we can only point at, you have to be willing to reject the idea that a dispositional ascription says nothing over and above a counterfactual. That reductionist commitment is the engine driving her conclusion, and once you turn it off, the rest of the argument loses its force.

  Your instinct about the jump from metaphysical possibility to semantic relevance is correct, but it needs to be bolstered by a change in ontology. Dana argues that because a masking situation is metaphysically possible, it threatens the truth of the counterfactual. But counterfactual semantics, whether Lewisian or otherwise, relies on similarity ordering, not mere possibility. The fact that there is a possible world where a match is struck in a nitrogen glovebox does not make the counterfactual if this match were struck it would flame false, because that world is not among the closest worlds where the match is struck. We hold fixed the standard background conditions unless there is a specific reason not to. Dana anticipates this with her worry about finks, noting that in fink cases the interfering world is close. That is why Lewis introduced the clause about holding the intrinsic base fixed. The fink removes the base, so it is excluded by the analysis. The mask leaves the base intact but adds an extrinsic interferer. The question is whether adding that interferer makes the world less similar than keeping it away. In ordinary contexts, we assume the absence of masks because masks are specific, positive additions to the world, whereas their absence is the null state.

  However, relying solely on similarity metrics leaves you vulnerable to the charge that you are just asserting what counts as close without independent justification. This is where you should target her first premise. If you accept that dispositions are identical to counterfactuals, then you have no resources to explain why some possibilities are relevant and others are not, except by stipulation. But if you view dispositions as real properties that ground the counterfactuals, then the direction of explanation flips. The counterfactual is true because the object has the disposition, not the other way around. The disposition is a categorical base or a powerful quality that exists independently of whether the manifestation occurs. When Dana says there is nothing left over besides the counterfactual, she is begging the question against dispositional realism. If there is something left over, namely the intrinsic property that serves as the truthmaker for the counterfactual, then the parity claim fails. The lodestone has a magnetic field regardless of the shell, and that field is the disposition. The shell is an interferer not because the paperclip fails to move, but because it interacts with the field in a specific way that blocks the effect.

  This brings us to her worry about circularity in defining interference. She claims we identify an interferer only by the fact that it prevents the manifestation. This is where you need to stand firm on the physics. We identify the putty on the tuning fork as an interferer because we understand damping mechanisms, mass loading, and energy dissipation. We identify the nitrogen in the glovebox as an interferer because we understand oxidation chemistry. These are positive theories about how the world works, not just negative reports that the match didn't light. The ceteris paribus clause is not a blank check; it is a placeholder for a detailed physical account of the normal conditions under which the base produces the manifestation. It is true that we often use the clause before we have the full account, but that makes it a promissory note, not a circular definition. The content is supplied by the broader scientific theory, not by the dispositional ascription itself.

  So which step do you give up? You should give up the first one. You should reject the claim that a dispositional ascription says nothing over and above a counterfactual. This costs you reductionism. You can no longer say that dispositions are just convenient ways of talking about what things would do. You have to say they are features of the world that explain what things would do. You mentioned worrying about powers as brute primitives, but rejecting the conditional analysis does not force you into primitivism. You can be a realist who thinks dispositions are grounded in categorical bases, like microphysical structures, which are not themselves defined by counterfactuals. Or you can accept powers as fundamental but argue they are not brute because they play a specific explanatory role in a network of laws and properties. The cost is ontological inflation, but the gain is explanatory power. You avoid the triviality problem because the brick does not have the intrinsic base required to sing when struck, so the counterfactual is false regardless of how many worlds we keep in view.

  Regarding my confidence, I am highly confident that the first premise is the weak link because it assumes the very reductionism that the argument is supposed to prove. The rest of Dana's argument follows validly if you accept that reductionism, which is why it feels so compelling. Once you deny that dispositions are nothing over and above counterfactuals, the parity claim collapses because there is something left over that stays fixed when you add the shell. I am moderately confident about the solution to the circularity worry, though I admit that specifying normal conditions without context is difficult. What would change my mind is if someone could demonstrate that every attempt to identify interferers independently inevitably relies on the failure of the manifestation. If it turned out that the only way to define a mask was to say it is whatever stops the effect, then Dana would be right that the clause is empty. Another thing that would shake my confidence is a successful reduction of all dispositional talk to purely categorical terms without remainder, showing that the extra ontology is truly unnecessary. But until then, the realist position seems the only way to make sense of why science relies so heavily on dispositional concepts without falling into triviality.

  I hope this helps you untangle the knot. Dana has forced you to choose between being a reductionist and being a realist, and she is right that you cannot be both. But being a realist is a perfectly respectable position that avoids the bookkeeping conclusion. Let me know how the next session goes.

  Best,

  Your Friend
