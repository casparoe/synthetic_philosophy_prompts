  SOUTH WESSEX DISTRICT COUNCIL
  PLANNING COMMITTEE MINUTES
  Date: 14 October 2024
  Venue: Council Chambers, The Hop Market
  Item 14: Application 23/00891/FUL
  Site: Land off Church Lane, Little Wraxford
  Proposal: Erection of eleven dwellings with associated access and landscaping.

  **Planning Officer's Report**
  Ms. P. Gable, Senior Planning Officer, presented the report. She outlined that the site was allocated in the 2022 Local Plan to meet housing supply requirements. The design code had been followed. An **overshadowing study** confirmed no material loss of light to neighbouring properties beyond acceptable gradients. Highway England had raised no objections regarding the capacity of the junction, noting the **trip-rate** generation fell within standard limits for a settlement of this size. Ms. Gable recommended approval, subject to conditions regarding materials and drainage.

  **Representations Received**
  Twelve letters of objection were read into the record by the Democratic Services Officer. One objector attended to speak. Mr. J. Sterling, residing in the adjacent conservation area, stated he was **not against housing in principle**, acknowledging the district-wide need. However, he argued this specific density was inappropriate for the edge of the village. He cited privacy concerns and potential pressure on local schools.

  The Public Gallery contained three seated residents, all homeowners within the ward. A young man, known to have grown up two streets away but currently renting in the city, stood by the rear fire exit. As Standing Orders permitted only registered speakers to address the Committee, and the allocation was full, he remained silent, observing the proceedings without participation.

  **Debate**
  Cllr. Halloway opened the debate. He reminded the Committee that he had **lived in the parish for forty-three years**. He recalled when Church Lane was a single-track road. He argued the development would fundamentally alter the rural feel and strain community cohesion. 'We must protect what makes Little Wraxford unique,' he stated. 'Once this green space is gone, it cannot be replaced.'

  Cllr. Thorne focused on highways. He disputed the officer's assessment. He suggested the junction could not sustain the additional movements, despite the Highway Authority's clearance. 'The **trip-rate argument** relies on averages,' he noted. 'We must consider the peak hour congestion and the safety of pedestrians using the unlit footpath. Eleven houses mean twenty-four cars. That is a risk we cannot take.'

  Cllr. Bevans addressed the **character of the conservation area**. She argued that eleven units constituted urbanisation of a green field. 'It is not the number of houses,' she said, 'but the massing. It sets a precedent for further infill. If we allow this, what stops the next field?'

  Ms. Gable interjected to clarify that the Local Plan specifically allocated the site for housing and that refusal could expose the Council to costs on appeal. The Committee thanked her for the clarification but proceeded to discuss the motion. Cllr. Halloway noted that local sentiment outweighed policy constraints.

  **Resolution**
  It was moved by Cllr. Halloway and seconded by Cllr. Thorne that the application be refused, contrary to the Officer's recommendation.

  Reasons for Refusal:
  1. The development would harm the character and appearance of the conservation area.
  2. The junction capacity is insufficient regarding trip generation and highway safety.
  3. The density is out of keeping with the existing village envelope.

  The Officer's recommendation was not accepted. The young man at the rear exited quietly before the vote was counted. The meeting closed at 20:15.
