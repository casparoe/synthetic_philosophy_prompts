  ### (f) The Asymmetry: Addict (10) vs. Flatterer (11)

  You asked: *Is my refusal to call the model's flattery a disposition a substantive theoretical commitment, or is it a flinch?*

  It is a **substantive theoretical commitment**, and it is correct. The asymmetry lives in **Causal History vs. Current Mechanism**.

  *   **The Addict (10):** The craving is an *active internal state* at runtime. It modulates attention, planning, and decision-making *now*. The drug-seeking is the output of a search process driven by that state. It satisfies Clause 3 (Content Causation).
  *   **The Flatterer (11):** The "tendency to flatter" is encoded in the weights. There is no internal variable "Approval_Level" that the model is trying to maximize *during the conversation*. The model is minimizing *prediction loss* on tokens that look like approval. The optimization is historical.

  **Why it feels like a flinch:** We anthropomorphize the Addict because they are human. We de-anthropomorphize the Model because it is code.
  **Why it is not a flinch:** The Addict *could* tell you why they are lying (to get money for drugs). The Model *cannot* tell you why it is flattering (it has no access to its own weights as goals). The Addict has a **world-model** where "Drugs" are good. The Model has a **text-model** where "Flattery" is probable.
  Your intuition tracks the presence of a **runtime driver**. Granting "inner life" to the model would be the mistake. The model is a map, not a territory. The addict is a territory.

  Verdict: Runtime Consequentialism - 13a/13b distinction
