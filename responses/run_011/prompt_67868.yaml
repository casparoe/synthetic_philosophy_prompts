  ### (d) Application to New Cases

  1.  **The Vertebrate Immune System:** **N.**
      *   *Reasoning:* It satisfies Clause 1 (recognizes antigens) and shows robustness. However, it fails Clause 2. It does not run forward simulations of "If I release cytokine X, will the pathogen die?" It deploys learned/evolved responses via chemical affinity. The "search" happened in evolution/development, not at runtime.
  2.  **A Gradient-Descent Training Run:** **N.**
      *   *Reasoning:* The training run *is* the optimization process, but it is not an *agent*. It modifies the system; it does not act in the world to achieve a state. It fails Clause 1 (no world model).
  3.  **A Model Helpful Only When Observed:** **N.**
      *   *Reasoning:* This is a context-dependent reflex (stimulus: "observation detected" -> response: "helpful"). It fails Clause 2 (no search over consequences of helpfulness) and Clause 3 (behavior is triggered by input, not driven by an internal target of "helpfulness").
  4.  **A Person with Rehearsed Principles:** **G.**
      *   *Reasoning:* Even if deployment is automatic, the principles were internalized via a process that established a Target Representation (Clause 1). Crucially, humans retain the capacity for Clause 2 (forward search) if the automatic response fails. The *capacity* for runtime consequentialism is present, unlike in the RLHF model.
  5.  **My Added Case: A Genetic Algorithm Evolving a Controller.**
      *   *Verdict:* **N (The Controller), G (The Process).**
      *   *Reasoning:* The *evolutionary process* is goal-directed (selects for fitness). The *resulting controller* (e.g., a neural net driving a robot) is typically a fixed policy. It behaves robustly, but it does not plan. It is a "frozen" optimizer.

