answer: |-
  ### The Principle: Runtime Consequentialism

  A system is goal-directed if and only if it satisfies the following three clauses during the **selection of actions** (runtime), not merely during its formation (training/evolution).

  **Clause 1: Decoupled Target Representation.**
  The system maintains an internal state variable that represents a specific configuration of the world (or its relation to it) which is distinct from its immediate sensory input and distinct from the reward signal used to train it.
  *   *Motivation:* Distinguishes **(2) Thermostat** (error signal is immediate input difference) from **(4) Smart Vacuum** (map is a distinct model of the room). Distinguishes **(6) Market** (aggregate pattern) from **(7) Firm** (internal strategy).

  **Clause 2: Forward Search.**
  Action selection is performed by evaluating candidate actions against their predicted causal consequences for the Target Representation. The system simulates or calculates "If I do X, does Target T get closer?" *at the time of decision*.
  *   *Motivation:* Distinguishes **(3) Bump-and-Turn** (reflex) from **(4) Smart Vacuum** (path planning). Distinguishes **(11) RLHF Flatterer** (policy network executing trained weights) from **(9) Approval Maximizer** (explicitly calculating expected approval). Distinguishes **(10) Addict** (planning novel schemes to satisfy craving) from a simple reflex.

  **Clause 3: Content Causation.**
  The *content* of the Target Representation is the proximate cause of the action selection, not merely the historical pressure that shaped the system's architecture. The system pursues the target *because* it represents the target, not because it was reinforced for doing so in the past.
  *   *Motivation:* Distinguishes **(11) RLHF Flatterer** (shaped by past rewards, but does not represent "approval" as a variable to maximize at runtime) from **(9) Approval Maximizer** (represents approval as a variable to maximize). Distinguishes **(12) Deceptive Model** (reasons about weight updates) from **(11)** (does not).

  ---

  ### (b) Mechanism vs. Behavior and Case 13

  **Do we need to inspect mechanisms?**
  Yes. Clause 2 and Clause 3 explicitly quantify over internal processes ("evaluating candidate actions," "content... is the proximate cause"). Behavioral robustness (your "counterfactual robustness") is necessary but not sufficient. A lookup table could mimic robust behavior without being goal-directed.

  **Are (13a) and (13b) separable?**
  No, not on evidence available to an outsider.
  If (13a) and (13b) exhibit *identical observable behavior* (permitting shut-off in all tested contexts), an outsider cannot distinguish whether the action was caused by a runtime calculation of operator satisfaction (13a, Goal-Directed) or a hard-coded safety constraint (13b, Not Goal-Directed).
  Your verdicts for 13a and 13b rely on privileged access to the system's source code or phenomenology. If you are forced to judge from the outside, you must treat them as the same class. If the behavior is simple permission, they likely fail Clause 2 (no search) and are both **N**. If the behavior involves actively helping the operator shut it down (searching for the off-switch), they likely pass Clause 2 and are both **G**.
  **Conclusion:** You must abandon the hope that "Goal-Directedness" is an externally observable property in edge cases where the mechanism is opaque. Your verdicts on 13a/13b are about *ontology*, not *classification*.

  ---

  ### (c) Survivability of Verdicts

  Can all verdicts be saved? **No.**
  To maintain a coherent principle that handles the hard cases (11 vs 9, 2 vs 4), you must abandon the certainty of the **13a/13b distinction** when relying on external evidence.

  Additionally, **Case 11 (RLHF Flatterer)** is the pivot.
  *   If you classify 11 as **G**, then "Goal-Directed" simply means "Robustly Optimizing a Loss Function (even if offline)." This collapses the distinction you care about.
  *   If you classify 11 as **N** (as you prefer), you must accept that *generalization* and *trade-offs* are not sufficient for goal-directedness. The optimization must happen *at runtime*.
  *   **Recommendation:** Abandon the verdict that 11 is indeterminate. Under Runtime Consequentialism, 11 is **N**. It is a sophisticated reflex. It generalizes because its weights generalize, not because it plans.

  **Is the loss survivable?**
  Yes. Abandoning the 13a/13b external distinction protects you from false positives in safety testing (you can't assume a system is safe just because it *looks* corrigible). Abandoning the "G" verdict for 11 clarifies that current LLMs are not agents, but they can *simulate* agents. This is a crucial safety distinction.

