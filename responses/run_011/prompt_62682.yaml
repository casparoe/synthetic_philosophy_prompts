answer: |-
  ### Desiderata for a Theory of Originality and Standing

  1.  **Historical Genesis Determines Institutional Standing**
      *   (a) The theory must assign different acquisition and exhibition status to two perceptually indistinguishable objects if their histories of production differ (e.g., artist's hand vs. later imitation).
      *   (b) Motivated by **Case 1** (Indistinguishable Forgery) and **Case 9** (AI Generation). In both, the surface remains constant while the assessment shifts upon revelation of process.
      *   (c) **Non-negotiable.** A museum is a historical institution, not a decor supplier; if history does not govern standing, the distinction between collection and prop storage collapses.

  2.  **Aesthetic Merit is Autonomous from Authenticity**
      *   (a) The theory must allow that an inauthentic object may possess equal or superior aesthetic quality to the authentic original without thereby becoming the "original."
      *   (b) Motivated by **Case 2** (Better Forgery). Experts were fooled because the fake was visually successful; the theory must not force us to call it "bad art" once exposed.
      *   (c) **Non-negotiable.** To conflate quality with authenticity corrupts connoisseurship and prevents the museum from acknowledging the skill of the forger or the weakness of the master.

  3.  **Intent Defines the Category of Forgery**
      *   (a) The theory must distinguish between deceptive misrepresentation and honest replication, workshop practice, or self-repetition.
      *   (b) Motivated by **Case 3** (Honest Studio Copy) and **Case 8** (Artist Self-Forgery). In Case 3, no deception occurred at origin; in Case 8, the author is the same but the chronology is lied about.
      *   (c) **Non-negotiable.** Ethical policy rests on fraud. Without an intent condition, all copies become forgeries, criminalizing standard art-historical practice.

  4.  **Authorization Validates Posthumous Production**
      *   (a) The theory must account for why some objects made after the artist's death are legitimate editions while others are fakes, based on rights and lineage rather than material presence of the artist.
      *   (b) Motivated by **Case 4** (Posthumous Bronze). The artist did not cast this, yet it is not a forgery.
      *   (c) **Non-negotiable.** Legal and market realities require this distinction; a museum cannot treat authorized estate casts as contraband.

  5.  **Material Continuity is Gradable, Not Binary**
      *   (a) The theory must accommodate degrees of material survival and intervention without forcing a binary "real/fake" verdict on composite objects.
      *   (b) Motivated by **Case 5** (Reconstruction) and **Case 6** (Palimpsest/Overpaint). Case 5 has no original material; Case 6 has mixed material. Both require nuanced classification.
      *   (c) **Non-negotiable.** Conservation science deals in percentages of original material. A binary theory renders most conservation reports unintelligible.

  6.  **The Work is Distinct from the Physical Vehicle**
      *   (a) The theory must distinguish the artistic work (the type) from the object that carries it (the token), allowing one to be authentic while the other is not, or for the work to survive the object's loss.
      *   (b) Motivated by **Case 10** (Manuscript vs. Performance). The manuscript can be a forgery while the performance of the score is authentic.
      *   (c) **Non-negotiable.** Without this, the museum cannot coherently collect music, digital art, or performance documentation.

  7.  **Truth Trumps Consensus in Classification**
      *   (a) The theory must allow an object's status to revert to "authentic" if new evidence corrects a prior false negative, regardless of how long it was treated as a fake.
      *   (b) Motivated by **Case 7** (False Negative). The object was always real; the documentation was wrong. The theory must not lock in the error.
      *   (c) **Non-negotiable.** Scholarship aims at truth. If policy locks in errors, the collection becomes a archive of mistakes rather than culture.

  8.  **Aesthetic Experience Shifts with Provenance**
      *   (a) The theory must claim that the viewer's aesthetic experience of the object itself changes (not just their interest in it) when the provenance is revised.
      *   (b) Motivated by **Case 1** (Indistinguishable Forgery). This is the claim that knowing it is a fake makes it *look* different or *be* aesthetically different.
      *   (c) **Camp Prejudice.** This belongs to the third faction (Educational/Goodmanian). It is psychologically dubious and unnecessary for policy; we can value the history without hallucinating a visual change.

  ***

  ### Distinctions the Theory Must Not Collapse

  *   **Nominal vs. Expressive Authenticity:** Nominal authenticity concerns correct identification of the producer; expressive authenticity concerns whether the work is true to the artist's vision or self.
      *   *False Verdict:* Collapsing these fails **Case 8** (Artist Self-Forgery). The work is nominally authentic (same artist) but expressively deceptive (misrepresented date/context). A collapse would force us to call it entirely real or entirely fake.
  *   **Work vs. Object:** The work is the abstract entity; the object is the physical carrier.
      *   *False Verdict:* Collapsing these fails **Case 10** (Manuscript vs. Performance). If Work=Object, a forged score makes the performance a forgery, which contradicts musical practice.
  *   **Aesthetic vs. Market vs. Documentary Value:** The value of looking, the value of selling, and the value of knowing.
      *   *False Verdict:* Collapsing these fails **Case 2** (Better Forgery). The aesthetic value is high, but the market/documentary value is low. A collapse forces us to say the object is "worthless" aesthetically because it is market-devalued.
  *   **Forgery vs. Copy/Pastiche/Reproduction:** Forgery implies intent to deceive regarding origin; the others do not.
      *   *False Verdict:* Collapsing these fails **Case 3** (Honest Studio Copy). If Copy=Forgery, the museum must deaccession standard workshop productions as ethical hazards.

  ***

  ### Incompatibilities and Sacrifices

  There is a logical tension between **Requirement 1** (History determines standing) and **Requirement 8** (Aesthetic experience shifts with provenance) when combined with **Requirement 2** (Aesthetic merit is autonomous). If aesthetic merit is autonomous (R2), then the perceptual experience should not change based on history. If the aesthetic experience *does* change (R8), then merit is not autonomous.

  We cannot jointly satisfy the demand that the object's *standing* changes (R1) and the demand that this change is rooted in a shift in *aesthetic experience* (R8), given that the perceptual properties are ex hypothesi identical (Case 1). To maintain a coherent policy, **Requirement 8 must be sacrificed.**

  We must locate the value shift in Case 1 entirely within *historical/documentary standing* (R1) and *market/ethical status* (R3), not within the aesthetic encounter itself. We acquire the original for its history; we may exhibit the fake for its story; but we do not pretend the fake *looks* different once caught. Insisting on R8 forces the museum into a psychological fiction that undermines the honesty of R2.

  ***

  ### Evaluation of Invoked Answers

  **The Achievement Account (Original manifests achievement; forgery misrepresents):**
  This theory satisfies R1, R3, and R7 robustly by grounding value in the historical act of creation. It handles Case 3 (Studio Copy) well by distinguishing the master's achievement from the assistant's. However, it struggles with **Case 9** (AI Generation) and **Case 4** (Posthumous Bronze). AI has no human "achievement" to misrepresent, yet we may still wish to exclude it; Posthumous bronzes have no artist achievement at the time of casting, yet we accept them. It risks being too anthropocentric for modern production methods.

  **The Aesthetic Distinction Account (Knowing the difference teaches us to see):**
  This theory satisfies R1 and R8 by claiming the "fake" becomes a different aesthetic object once known. It excels at justifying the exhibition of fakes for education (Case 1). However, it directly violates **Requirement 2** (Better Forgery). If the fake is aesthetically superior, this theory cannot explain why we prefer the original without resorting to snobbery. It also fails **Case 10** (Music), as the performance is not "seen" in the same way, making the "learning to see" metric inapplicable to auditory works.

  \answer{R8 — Aesthetic Experience Shifts}
