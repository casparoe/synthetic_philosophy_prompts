answer: |-
  You have identified a genuine structural feature of modern political economy, and your intuition that it lacks a single, sharp label is correct. There is no canonical term in philosophy or economics that captures precisely this *moral* slide driven by *administrative* friction.

  However, there are three "nearest neighbours" in existing thought that form the boundary of this concept. Understanding why they *almost* fit but ultimately miss your point is the best way to carve out the definition you need.

  ### 1. The Nearest Neighbours (and why they fail)

  **A. Legibility (James C. Scott)**
  The anthropologist James C. Scott coined the term "legibility" to describe how states simplify complex social realities to manage them (e.g., imposing surnames, standardizing weights, mapping land). The state cannot tax what it cannot see.
  *   **Where it fits:** It explains *why* inheritance is targeted (it is a discrete, legible event) while lifetime advantage is not (it is a fluid, illegible process).
  *   **Where it fails:** Scott describes a limitation of *state capacity*, not a shift in *moral judgment*. He explains why the state *doesn't* act on bedtime stories. He does not explain why citizens *agree* that bedtime stories are therefore not a matter of justice. Your observation is about the public's moral imagination, not just the state's administrative reach.

  **B. The Streetlight Effect (Observational Selection Bias)**
  This is the joke about the drunk looking for keys under the light not because they were lost there, but because that's where he can see.
  *   **Where it fits:** It captures the search pattern. Policymakers look for inequality where the data exists.
  *   **Where it fails:** The Streetlight Effect is epistemic (about *knowledge*). Your observation is normative (about *blame*). The drunk knows he might be looking in the wrong place; in your example, the debaters convince themselves that the lit area is the *only* place that matters. They don't say, "We tax inheritance because it's the only thing we can catch." They say, "Inheritance is the unfair thing; spending on schooling is parenting."

  **C. Administrative Feasibility (Tax Theory)**
  In tax law, a rule must be "collectible" to be valid. If a tax costs more to enforce than it raises, or invites massive avoidance, it is discarded.
  *   **Where it fits:** It explains the mechanism. You cannot tax an accent or a bedtime story.
  *   **Where it fails:** In tax theory, feasibility is a *practical constraint* on a moral goal. In the debate you describe, feasibility becomes the *definition* of the moral goal. The constraint swallows the principle.

  ### 2. The Proposed Concept: "Normative Legibility"

  Since no existing term captures the *moral slide* (from "we can't fix this" to "this isn't unjust"), I propose the term **Normative Legibility**.

  **Definition:**
  *Normative Legibility* is the cognitive and political bias wherein the perceived injustice of a social outcome is proportional to the administrative ease of regulating the mechanism that produced it.

  It is the tendency to confine the domain of "unfairness" to the domain of "state-visible transactions."

  **The Core Mechanism:**
  It operates via a modal collapse.
  1.  **Premise 1:** Justice requires remediation (if it's unfair, we should fix it).
  2.  **Premise 2:** Remediation requires administrative tractability (we can only fix what we can measure/regulate).
  3.  **The Collapse:** Therefore, if it is not administratively tractable, it is not a matter of justice.

  The error lies in moving from Premise 2 (a practical limit on *action*) to the conclusion (a limit on *moral status*).

  ### 3. The Carving: Boundaries and Exclusions

  To use this concept as a tool, you need to know where it applies and where it breaks.

  **What it Includes (The Domain):**
  *   **Distributive Justice:** Debates about wealth, opportunity, and advantage (your inheritance example).
  *   **Policy Design:** Where solutions are chosen based on metric availability rather than causal impact (e.g., carbon pricing vs. consumption changes).
  *   **Moral Outrage:** The intensity of public anger correlates with the existence of a regulatory form (e.g., a tax return), not the magnitude of harm.

  **What it Excludes (The Boundaries):**
  *   **Discrete Crimes:** It does not apply to acts that are illegible but universally condemned (e.g., murder in a private home). We lack perfect visibility into domestic murder, yet we do not say it is "not unjust" because it is hard to police. *Why?* Because the *act* itself is legible as a moral category, even if the *instance* is hidden. Normative Legibility applies specifically to *structural advantages* where the mechanism itself is blurred (e.g., "culture" vs. "cash").
  *   **Catastrophic Harm:** If an illegible thing causes visible catastrophe, it retains moral status (e.g., climate change). However, note that the *debate* shifts to legible proxies (carbon tons) rather than the illegible root (lifestyle).
  *   **Biological Endowment:** We generally accept genetic luck as "misfortune" rather than "injustice." Normative Legibility explains this: we have no administrative handle on genes. But note the boundary: if genetic editing became tractable, the "injustice" of genetic lottery would likely spike in public discourse.

  **Counterexamples (Where the Theory Fails):**
  To test if this concept is real, look for where it *doesn't* hold.
  *   **Insider Trading:** This is notoriously hard to detect and prove (low tractability), yet it attracts high moral heat and severe penalties.
      *   *Resolution:* This is not a counterexample if you view the *market mechanism* as legible. The trade itself is recorded; the *intent* is hidden. We regulate the record.
  *   **The "Baby Bonus" Debate:** Some countries pay parents for having children. This is highly legible (birth certificates), yet often controversial as "unfair" to non-parents.
      *   *Resolution:* This fits the theory. Because it is legible, it becomes a site of justice-debate. If it were an untraceable cultural preference for large families, it would not be debated.

  ### 4. Generalisations (Applying the Carving)

  You asked if this generalises beyond wealth. It does, aggressively.

  **A. Carbon Pricing vs. Consumption**
  *   **The Pattern:** It is administratively easy to tax carbon at the source (refineries, power plants). It is administratively impossible to tax the cultural drivers of consumption (status signalling, planned obsolescence, car dependency).
  *   **The Normative Legibility:** We treat carbon tons as the "unit of injustice." We argue fiercely about the price of carbon. We rarely argue about the injustice of a culture that requires two cars per household, because you cannot write a rule for "car dependency." The moral heat is on the tax, not the lifestyle.

  **B. AI Safety (Capabilities vs. Harms)**
  *   **The Pattern:** It is easy to benchmark a model's capabilities (can it pass this test?). It is hard to measure societal harms (does this model erode trust over five years?).
  *   **The Normative Legibility:** Safety debates cluster around "jailbreaking" and "benchmarks" (legible) rather than "societal displacement" or "epistemic corrosion" (illegible). We regulate the model's output because we can measure it, not the model's impact because we cannot. The "unfairness" of AI is defined by what we can log, not what we feel.

  **C. Health Policy (Datasets vs. Determinants)**
  *   **The Pattern:** We can measure hospital wait times and drug costs. We cannot easily measure the health impact of loneliness, precarious work, or food deserts in a way that fits a budget line.
  *   **The Normative Legibility:** Health inequality is debated as "access to care" (legible) rather than "determinants of health" (illegible). A death caused by a waiting list is a scandal (tractable). A death caused by twenty years of stress-induced hypertension is a statistic (intractable).

  ### 5. Why This Matters for Your Argument

  You mentioned you are not looking for a label to win an argument, but the label clarifies the move your friend is making.

  Your friend (the tax barrister) is likely operating within **Administrative Feasibility**. To a lawyer, a rule that cannot be enforced is not a rule. It is void. Therefore, in their professional ontology, it does not exist.

  You are operating within **Causal Contribution**. To a systems thinker, money moved is money moved, regardless of the schedule.

  **Normative Legibility** is the bridge. It explains why your friend's ontology has colonized the moral debate. We have allowed the *tools of the state* (tax forms, regulations) to define the *boundaries of the good*.

  **The Verdict:**
  If you accept Normative Legibility as a valid description of the world, you must accept one of two conclusions:
  1.  **Cynical:** Justice is only ever about power, and power is only ever about administration. (Therefore, stop arguing about bedtime stories).
  2.  **Reformist:** Our definition of justice is incomplete because it is blinded by our own administrative tools. (Therefore, the fact that we can't tax bedtime stories doesn't mean they aren't unjust; it means our concept of justice is too narrow).

  Your spreadsheet model supports the second. The money moves the same. The advantage is transmitted the same. The only variable is the *visibility* of the transfer.

  **Summary Definition for Use:**
  > **Normative Legibility:** The bias wherein the moral urgency of correcting an inequality is determined not by the severity of the inequality, but by the administrative ease of measuring and regulating its mechanism. It is the error of mistaking the limits of the tax form for the limits of justice.

  This concept is yours to use. It fits the data, it generalises across domains, and it exposes the category error at the heart of the inheritance debate.
