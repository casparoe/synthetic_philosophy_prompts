  # SEMINAR HANDOUT: Mapping the Norms of Assertion

  **Instructions:** Start at **Node 1**. Answer the question based on your intuitive verdict about the case described. Follow the branch corresponding to your answer. Continue until you reach a **Leaf**. The Leaf describes the theoretical position consistent with your path.

  **Working Assumptions of this Tree:**
  *   **Existence:** Assertion is governed by at least one normative rule (it is not purely descriptive).
  *   **Uniqueness:** There is a single primary norm determining *assertoric propriety* (distinct from moral or prudential rules).
  *   **Stability:** The norm does not shift radically between contexts (e.g., casual chat vs. court).
  *   **Data:** Case verdicts (e.g., "this assertion feels wrong") are reliable evidence for the norm.
  *(Note: Each of these assumptions is contested in the literature. Reaching a leaf does not prove these assumptions are true.)*

  ---

  ### THE DECISION TREE

  **Node 1: The Blameless Error**
  A physician has overwhelming evidence for a diagnosis, asserts it, but it turns out false. She was not negligent.
  *   **Was her assertion improper (a mistake in asserting)?**
      *   **YES** → Go to **Node 2**.
      *   **NO** → Go to **Node 7**.

  **Node 2: The Lottery Ticket**
  You know your ticket is 1 in a million to win. Before the draw, you assert: "My ticket lost."
  *   **Is this assertion improper?**
      *   **NO** → Go to **Node 3**. *(Suggests Truth is sufficient)*
      *   **YES** → Go to **Node 4**. *(Suggests Knowledge/Strictness required)*

  **Node 3: The Disclaimer**
  A speaker says: "It is raining, but I don't know that it is raining."
  *   **Is this as contradictory/improper as saying "It is raining, but it is not"?**
      *   **YES** → **LEAF A: The Truth-Knowledge View**
      *   **NO** → **LEAF B: The Truth-Only View**

  **Node 4: The Gettier-Style Assertion**
  You have strong evidence for a claim, it is true, but your evidence is connected to the truth by luck (you don't "know" it in the strict sense).
  *   **Is asserting this claim improper?**
      *   **NO** → **LEAF C: The Justified-True-Belief View**
      *   **YES** → Go to **Node 5**.

  **Node 5: The Accumulated Premises**
  You know A, you know B, and you know C individually. You assert: "A and B and C." (You have not checked the conjunction specifically).
  *   **Is this assertion improper?**
      *   **NO** → **LEAF D: The Aggregative Knowledge View**
      *   **YES** → Go to **Node 6**.

  **Node 6: The Sanction (Revisiting Node 1)**
  Return to the **Blameless Error** (Node 1). You said it was *improper*.
  *   **Is the physician nevertheless *blameworthy* for asserting?**
      *   **NO** (She violated the rule but is excused) → **LEAF E: The Excuse-Based Defence**
      *   **YES** (She is fully at fault) → **LEAF F: The Strict Knowledge View**

  **Node 7: The Selfless Assertion**
  A creationist science teacher has overwhelming evidence for evolution but personally does not believe it. She asserts the textbook account.
  *   **Is it a problem that she does not believe what she asserts?**
      *   **YES** → Go to **Node 8**.
      *   **NO** → Go to **Node 9**.

  **Node 8: The Hearer's Evidence**
  You know a claim is true. However, your audience has strong evidence that you are likely wrong (though you don't know they have this evidence).
  *   **Does their evidence make your assertion improper?**
      *   **YES** → **LEAF G: The Audience-Sensitive View**
      *   **NO** → **LEAF H: The Speaker-Reliant View**

  **Node 9: The Collision Case**
  You know a claim is true and have evidence. However, asserting it will cause severe, unnecessary harm.
  *   **Does this make the *assertion itself* improper (not just the timing)?**
      *   **YES** → **LEAF I: The All-Things-Considered View**
      *   **NO** → **LEAF J: The Purely Epistemic View**

  ---

  ### LEAF LEGEND

  *   **Leaf A:** Truth-Knowledge View (Truth required; Knowledge linked to warrant).
  *   **Leaf B:** Truth-Only View (Truth required; Knowledge not linked).
  *   **Leaf C:** Justified-True-Belief View (Knowledge not required; JTB sufficient).
  *   **Leaf D:** Aggregative Knowledge View (Knowledge required; Closure holds).
  *   **Leaf E:** Excuse-Based Defence (Knowledge required; Violations excused by evidence).
  *   **Leaf F:** Strict Knowledge View (Knowledge required; No excuse for falsehood).
  *   **Leaf G:** Audience-Sensitive View (Justification required; Context/audience matters).
  *   **Leaf H:** Speaker-Reliant View (Justification required; Speaker's state matters).
  *   **Leaf I:** All-Things-Considered View (Evidence required; Practical norms govern assertion).
  *   **Leaf J:** Purely Epistemic View (Evidence required; Practical norms are external).

  ***

  # INSTRUCTOR'S COMMENTARY & LOGICAL ANALYSIS

  ### 1. Empty Logical Combinations (Unoccupied Cells)
  The tree routes certain combinations of answers to no leaf.
  *   **Truth Norm + Lottery Improper:** (Node 2: NO → Node 4). If truth is the only norm, the Lottery assertion (which is true) should be proper. Routing this to "Improper" leads to Knowledge views. *Status:* **Incoherent.** A Truth Norm by definition permits true assertions.
  *   **Excuse View + Lottery Proper:** (Node 2: YES → Node 6). If one holds an Excuse View, one typically accepts a strict norm (like Knowledge) that is merely excused. If the Lottery assertion were *Proper*, there would be no violation to excuse. *Status:* **Merely Unattractive.** One could theoretically hold that the norm is Knowledge but Lottery assertions don't violate it, but this collapses into a Probabilistic view.
  *   **Strict Knowledge + Blameless:** (Node 6). If one answers "YES" to Improper (Node 1) and "NO" to Blameworthy (Node 6), one lands on Leaf E. If one answers "YES" to Blameworthy, Leaf F. There is no path for "Proper but Blameworthy." *Status:* **Incoherent.** One cannot be blameworthy for an action that was not improper.

  ### 2. Indistinguishable Leaves
  The tree cannot practically separate the following pairs given the selected cases:
  *   **Leaf C (JTB) vs. Leaf F (Strict Knowledge):** These diverge on Gettier cases (Node 4). However, if a student's intuition on Gettier cases is unstable, these leaves may feel identical.
      *   *Disputed Case Needed:* A "Fake Barn" style case where the subject has a true belief formed via a reliable process that is locally unlucky. Strict Knowledge says Improper; JTB says Proper.
  *   **Leaf H (Speaker-Reliant) vs. Leaf J (Purely Epistemic):** Both prioritize the speaker's state over the audience or practical consequences. They would only diverge on a case where the *audience* has evidence the speaker lacks (Hearer's Evidence) *and* practical stakes are high (Collision).
      *   *Disputed Case Needed:* A case where the speaker knows P, the audience has defeaters, *and* asserting P causes harm. Leaf H says Proper (Speaker knows); Leaf J says Proper (Epistemic met). Leaf G says Improper (Audience); Leaf I says Improper (Harm). H and J agree on "Proper" here. They diverge on whether *moral* blame attaches to a proper assertion.

  ### 3. Norm Structure: Necessary vs. Sufficient
  *   **Node 1 (Blameless Error)** tests whether Truth is **Necessary**. (If False+Justified is Improper, Truth is Necessary).
  *   **Node 2 (Lottery)** tests whether Knowledge/Justification is **Necessary**. (If True+Probable is Improper, Knowledge is Necessary).
  *   **Node 6 (Sanction)** distinguishes between a **Constitutive Norm** (Leaf F: Violation = Improper) and an **Excuse Framework** (Leaf E: Violation = Improper but Blameless). This is where the distinction between "violating a necessary condition" and "having a sufficient defence" does its work.
  *   **Question-Begging:** The tree assumes a **Unique Norm** (see Assumptions Box). This begs the question against **Pluralist Views** (e.g., assertion is governed by different norms in different contexts). A Pluralist might answer "Improper" at Node 1 (Scientific context) but "Proper" at Node 1 (Casual context). The tree forces them to choose one path, artificially unifying their view.

  ### 4. Settled vs. Contested (Meta-Commentary)
  *   **Settled:** There is broad agreement that assertion is *normative* (not just causal) and that the **Blameless Error** and **Lottery** cases are the primary testing grounds.
  *   **Contested:**
      *   **Existence of a Norm:** Some (e.g., nihilists) deny assertion is governed by a rule at all. The tree assumes one exists.
      *   **Uniqueness:** Contextualists deny the norm is stable across Node 7/8/9 scenarios.
      *   **Propriety vs. Blame:** The distinction at Node 6 is highly contested. Some argue "Improper" just *means* "Blameworthy," making Leaf E logically impossible.
      *   **Case Verdicts:** The "correct" answer at Node 4 (Gettier) and Node 9 (Collision) is the subject of ongoing debate. The tree treats these as fixed data points to sort theories, not as questions to be solved.
