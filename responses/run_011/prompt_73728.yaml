answer: |-
  # Job Talk Prep Sheet: The Swing Voter's Curse and Altruistic Turnout

  ## Strategic Overview

  **Three Opening Concessions (Blunt the Hard Objections)**
  1.  **Scope on Values:** State clearly in your setup that the model assumes a *common value* component (e.g., competence, corruption) distinct from *private value* distribution. You are not arguing the curse applies to pure redistribution elections.
  2.  **Scope on Information:** Concede that "uninformed" is a modeling abstraction for "less informed than the marginal pivotal voter," not necessarily a citizen who knows nothing. This pre-empts the empiricist's continuum objection.
  3.  **Normative Stance:** Explicitly disclaim any prescriptive claim about disenfranchisement. Frame the paper as a diagnostic puzzle about *motivation*, not a blueprint for *eligibility*.

  **The Single Reply That Must Land**
  You must successfully distinguish between the **magnitude of stakes** (EGK) and the **sign of the expected value** (SVC).
  *   *Phrasing:* "The EGK solution scales the *stakes* ($B$), but the Swing Voter's Curse determines the *sign* of the expected return conditional on pivotality. If the sign is negative, scaling the magnitude only scales the harm. My contribution is showing that these are orthogonal parameters, not competing solutions to the same term."
  *   *Why:* If this fails, your paper looks like a category error rather than a synthesis.

  **Your Weakest Point (Defend Proactively)**
  The assumption that the uninformed voter's signal is *negatively* correlated with the truth conditional on pivotality (worse than a coin flip).
  *   *Defense:* In the Feddersen-Pesendorfer setup, this arises because the uninformed vote breaks ties among the informed. If the informed are split, the state is ambiguous, and the uninformed vote adds noise. Acknowledge that if uninformed voters have a slight positive correlation (via heuristics), the curse weakens, but argue that the *altruistic* threshold for voting becomes drastically higher, still supporting your core claim about the turnout gap.

  **The Question You Are Dreading**
  "If the implication of your model is that altruistic, low-knowledge voters harm the polity by voting, are you committed to the normative claim that they *ought* to abstain, and does that not violate the democratic equality of citizens?"
  *   *Prep:* Do not dodge. Answer: "I am committed to the claim that *instrumental* altruism counsels abstention in this specific setup. That reveals a tension between epistemic quality and democratic equality, which is precisely the puzzle I want the field to grapple with, rather than hiding it behind a 'duty to vote' heuristic."

  ---

  ## The Eight Objections (Ordered by Damage Potential)

  ### 1. The Epistocratic Trap (Normative Theorists)
  **The Objection:** "You've built a model where the social value of voting is a function of epistemic reliability. By concluding that the altruistic uninformed should stay home, you aren't just solving a paradox; you're licensing an epistocratic constraint on participation. How do you reconcile this with the normative commitment to political equality?"
  **The Reply:** "I distinguish between *instrumental* rationality and *democratic* legitimacy. My model shows that if voting is purely about outcome optimization, the uninformed altruist faces a negative expected value. That doesn't mean they lack the *right* to vote; it means the 'duty to vote' cannot be grounded solely in outcome-based altruism. We need a different normative foundation for their participation, perhaps expressive or constitutive, which my paper leaves open."
  **Soft Spot:** If they press on whether you think they *should* vote despite the model, you risk sounding incoherent.
  **Classification:** **Scope Restriction.** (Restrict the claim to instrumental rationality, not normative obligation).

  ### 2. Equilibrium Selection vs. Dominance (Formal Theorists)
  **The Objection:** "In the Feddersen-Pesendorfer game, abstention by the uninformed is an equilibrium, but it's not always a dominant strategy. Depending on the cost structure and the population size, there can be mixed equilibria where the uninformed vote with some probability. Are you claiming abstention is dominant, or just that it's the unique equilibrium in your specific calibration?"
  **The Reply:** "I am relying on the dominance argument in the limit as population size grows. In large Poisson games, the probability that an uninformed vote is pivotal in a 'good' state vanishes faster than in a 'bad' state. While mixed equilibria exist in finite cases, the asymptotic result drives the comparative static: as the social benefit scales, the cost of voting incorrectly scales with it, pushing the equilibrium probability of uninformed voting toward zero."
  **Soft Spot:** If they have a specific Poisson game counter-example where the uninformed vote persists in equilibrium despite high social stakes.
  **Classification:** **Thesis Revision.** (If dominance doesn't hold, you must soften the claim from 'should not' to 'is less likely to').

  ### 3. The Common Value Assumption (Formal Theorists)
  **The Objection:** "The Swing Voter's Curse relies heavily on the common value assumption—that there is a 'correct' candidate. But most modern elections are about private values and redistribution. In a private value setting, the uninformed voter isn't making a mistake by voting their preference; they're expressing a taste. Doesn't your result collapse once we introduce heterogeneous preferences?"
  **The Reply:** "That is why I opened by conceding the scope to common-value components. However, even in private value elections, there is usually a competence or corruption dimension that is common value. My claim is that for the subset of the decision space that *is* common value, the curse applies. Given that altruistic voters care about the aggregate welfare, the common-value component should weigh heavily in their calculus, even if private values exist."
  **Soft Spot:** If they argue the common value component is negligible in real elections.
  **Classification:** **Scope Restriction.** (Limit the thesis to elections with significant common-value components).

  ### 4. Partisan Heuristics as Information (Empiricists)
  **The Objection:** "You treat 'uninformed' as voting randomly or noise. But in the real world, low-knowledge voters use partisan cues as heuristics. If party labels correlate with the 'true' state of the world even weakly, the uninformed voter isn't flipping a coin; they're following a signal. Doesn't that break the curse?"
  **The Reply:** "It weakens the curse, but it doesn't eliminate it for the *altruistic* voter. Even with heuristics, the marginal uninformed voter is less reliable than the marginal informed voter. The Swing Voter's Curse triggers when the voter is less informed than the pivot threshold. For an altruist maximizing social welfare, the bar isn't 'better than random'; it's 'better than the informed consensus.' Heuristics rarely clear that bar."
  **Soft Spot:** If they show data that heuristic-based voting aggregates as well as informed voting.
  **Classification:** **Thesis Revision.** (Requires acknowledging that heuristics mitigate the harm, reducing the strength of the 'negative value' claim).

  ### 5. Endogeneity of Information (Empiricists)
  **The Objection:** "You treat information as exogenous to the voting decision. But people acquire information *because* they intend to vote. If the social benefit $B_{social}$ increases, doesn't that incentivize information acquisition, turning the 'uninformed' into the 'informed' before they cast the ballot?"
  **The Reply:** "That is a compelling dynamic extension, but it actually strengthens my puzzle. If high social stakes incentivize information acquisition, we should observe near-perfect correlation between altruistic motivation and political knowledge. Yet, we see high turnout among the persistently uninformed. My model explains why that persistence is puzzling: the altruistic motive should have either converted them to informed voters or driven them to abstention."
  **Soft Spot:** If they argue the cost of information is too high for some demographics regardless of stakes.
  **Classification:** **Scope Restriction.** (Frame the model as a static snapshot of the decision moment).

  ### 6. Expressive and Duty-Based Utility (Normative Theorists/Methodologists)
  **The Objection:** "You assume the utility of voting is entirely consequentialist. But much of the literature suggests voting is expressive or a civic duty. If $C$ is offset by a duty benefit $D$, doesn't the curse become irrelevant?"
  **The Reply:** "It makes the curse irrelevant for the *decision* to vote, but not for the *social evaluation* of that vote. My paper addresses the EGK line, which is explicitly consequentialist (saving millions via policy). If voters are motivated by duty, the EGK paradox doesn't apply to them in the first place. I am targeting the specific claim that altruists vote *to produce good outcomes*. For that specific motivation, the curse stands."
  **Soft Spot:** If they argue that consequentialist and duty motivations are inseparable in practice.
  **Soft Spot:** **Scope Restriction.** (Explicitly target consequentialist altruism only).

  ### 7. Pivot Probability Scaling (Formal Theorists)
  **The Objection:** "In Poisson voting games, changing the payoff structure can change the equilibrium turnout rates, which in turn changes the pivot probability $p$. If altruists vote more because $B$ is higher, doesn't that dilute $p$ enough to offset the curse?"
  **The Reply:** "No, because the curse operates on the *conditional* probability of being correct given pivotality, not the absolute probability of pivotality. Increasing turnout might lower $p$, but it doesn't change the information structure of the pivotal event. The uninformed voter is still most likely to be pivotal when the informed are split. Lowering the frequency of that event doesn't change the negative expected value when it does occur."
  **Soft Spot:** If there is a general equilibrium effect where high turnout changes the *composition* of the informed pool.
  **Classification:** **Thesis Revision.** (Minor: requires acknowledging second-order equilibrium effects).

  ### 8. Measurement of 'Knowledge' (Empiricists)
  **The Objection:** "Your empirical upshot relies on knowledge batteries predicting turnout. But those batteries measure factual trivia, not social or economic self-interest. Maybe the 'uninformed' know what's good for their community even if they can't name the Secretary of State."
  **The Reply:** "That is a valid measurement concern. However, the Feddersen-Pesendorfer logic requires information about the *state of the world* (e.g., candidate competence), not just local self-interest. If 'uninformed' means 'lacks information on the common value dimension,' then the curse holds. I invite empirical colleagues to test this with measures of candidate quality assessment rather than factual recall."
  **Soft Spot:** If they argue factual recall is the only proxy we have.
  **Classification:** **Scope Restriction.** (Clarify that 'knowledge' refers to common-value relevant information).

  ---

  ## Final Advice for the Room

  **Tone:** You are not attacking the EGK literature; you are refining the boundary conditions of altruistic voting models. You are not attacking low-knowledge voters; you are highlighting a tension in how we model their motivations.

  **Body Language:** When the Formal Theorists speak, look at the board/screen (reference the logic). When the Empiricists speak, look at them directly (acknowledge the reality gap). When the Normative Theorists speak, slow down (show you weigh the ethical implication).

  **The "Out":** If you get stuck on a technical point, pivot to the conceptual contribution: "Even if that parameter shifts the threshold, the structural point remains that scaling $B$ does not fix the sign of the expectation."

  Good luck. You know the material; now own the room.
