answer: |-
  **Interview Questions for [Guest Name]**

  **1. The Lag Problem**
  *Target Commitment: The utility of an ex-post diagnostic.*
  Your criterion registers backsliding only when the probability of turnover declines relative to a baseline, which often becomes clear only after a transfer fails or is severely contested. If the metric lights up red only when the patient is already in cardiac arrest, doesn't this render the concept useless for the very actors—international bodies, domestic courts—who need to intervene before the transfer fails?
  *Follow-up (Likely Answer: It is a diagnostic tool, not a预警 system):* If it is purely diagnostic, why retain the label "backsliding," which implies an active process we might stop, rather than "democratic failure," which describes a completed state?

  **2. Likelihood vs. Observables**
  *Target Commitment: Epistemic accessibility (observable events only).*
  You insist on observable events to ensure neutrality, yet your core variable is a "likelihood," which is inherently counterfactual and unobservable. How do you calculate the probability of a party losing office using only binary outcomes like certification and transfer, without importing the very expert modeling or subjective risk assessment you seek to exclude?
  *Follow-up (Likely Answer: Using proxies like margin of victory or seat share):* If you use margins or seat shares as proxies for likelihood, aren't you reintroducing a judgment about what constitutes a "safe" margin, which varies by political culture and is itself a subjective coding choice?

  **3. The Poland Case (Consistency)**
  *Target Commitment: Classification consistency across cases.*
  In Poland, the ruling party lost the 2023 election and vacated office, yet you classify the preceding eight years as backsliding. If the transfer ultimately occurred, on what observable basis do you argue the *likelihood* of that transfer had declined during the PiS tenure, rather than simply that the tenure was long?
  *Follow-up (Likely Answer: Institutional traps lowered the probability even if realized):* If the opposition takes office but finds it cannot govern effectively due to those institutional traps, does your metric capture that continued dysfunction, or does the successful transfer wipe the slate clean?

  **4. The Neutrality Claim [MARKED: GOOD ANSWER QUESTION]**
  *Target Commitment: Normative minimalism.*
  You argue that focusing on the transfer of office is politically neutral because it avoids judging policy outcomes. But elevating turnover to the *essence* of democracy is itself a substantive normative choice that privileges competition over rights or rule of law. Why is your normative preference for turnover less contestable than a coder's preference for civil liberties?
  *Follow-up (Likely Answer: Turnover is a prerequisite for enforcing other rights):* **Strong Answer Look:** She acknowledges the normative choice but argues it is the *least* controversial necessary condition, serving as a "gateway" metric that reduces partisan disagreement on measurement even if it doesn't capture the full democratic ideal.

  **5. Unsuccessful Non-Transfers**
  *Target Commitment: Exclusion of intentions.*
  Consider a scenario where an incumbent attempts to refuse a transfer but is forced out by military or judicial pressure. The transfer occurs, so on your observable test, the regime did not backslide. How do you distinguish this from a voluntary concession without attributing intentions, which you explicitly forbid?
  *Follow-up (Likely Answer: The observable outcome is what matters for stability):* If the outcome is identical but the mechanism reveals a willingness to subvert democracy, does ignoring that distinction blind us to regimes that are one crisis away from failure?

  **6. Instrumental Rights**
  *Target Commitment: Instrumental view of democratic institutions.*
  You treat judicial reorganization and media capture as relevant only insofar as they affect election outcomes. If a government captures the media and courts but continues to lose elections due to economic shocks, your test says there is no backsliding. Are you prepared to argue that a regime can be democratically stable even if the opposition has no fair chance to speak or be heard, provided they still win occasionally?
  *Follow-up (Likely Answer: If they win, the channel remains open):* Does this not assume that economic performance is independent of media manipulation, ignoring that voters cannot make informed choices if the information environment is captured?

  **7. The Poland Case (Governance) [MARKED: GOOD ANSWER QUESTION]**
  *Target Commitment: Distinction between access to office and capacity to govern.*
  Constraint (iii) asks specifically about the incoming opposition finding it cannot govern. If your test marks Poland as backsliding despite the transfer, are you implicitly admitting that the *capacity to govern* is part of the democratic baseline, and if so, how do you measure "capacity" without expert judgment?
  *Follow-up (Likely Answer: Backsliding is the trend in probability, not the final outcome):* **Strong Answer Look:** She clarifies that "backsliding" measures the erosion of the *competitive playing field* over time (the declining probability), distinct from the *realization* of authoritarianism (the failed transfer), allowing for a warning signal even if the final election holds.

  **8. The Baseline Problem**
  *Target Commitment: Country-specific prior records.*
  Your test relies on a decline relative to a country's "own prior record." How do you handle states with no history of peaceful transfer, or those where the prior record is itself authoritarian? Does a regime that never allowed transfers cannot technically "backslide" by your definition, only remain static?
  *Follow-up (Likely Answer: The metric applies only to electoral regimes):* If it applies only to regimes with a prior transfer record, does this not exclude the most vulnerable new democracies where the first failure to transfer is the most critical moment?

  **9. The "Try but Fail" Scenario**
  *Target Commitment: Binary coding of events.*
  If an incumbent refuses to certify an election but is overturned by a court, the transfer happens. If an incumbent certifies but secretly coerces the opposition to withdraw, the transfer happens. Both score zero on your backsliding measure. Does this binary coding collapse distinct threats into the same category, masking the severity of the attempt?
  *Follow-up (Likely Answer: Severity is separate from classification):* If severity is separate, why bundle the concept of "backsliding" with the binary outcome rather than treating the attempt as a distinct category of democratic stress?

  **10. Falsification**
  *Target Commitment: Empirical vulnerability.*
  Finally, what specific empirical pattern would force you to abandon this criterion? If we found a set of countries where your measure indicated stability but independent measures of rights and rule of law collapsed simultaneously, would that falsify your claim that turnover is the sufficient proxy for regime health?
  *Follow-up (Likely Answer: No single metric is perfect):* If no single pattern falsifies it, is the criterion functioning as an empirical claim or a definitional stipulation that is immune to evidence?

  ***

  **Analysis for the Moderator**

  **The Load-Bearing Question**
  **Question 2 (Likelihood vs. Observables)** is the load-bearing question. Her entire thesis rests on the claim that she can measure a *probability* (likelihood of losing) using only *observable events* (did they leave?) without subjective modeling.
  *   **If she holds this:** She must explain how a probability is observable. If she admits she uses proxies (like vote margins), she concedes that "observable events only" is a bluff, which weakens her neutrality claim (Question 4) and her consistency on Poland (Question 3/7).
  *   **If she fails this:** The methodology collapses into the very expert coding she criticizes, blunting the force of the Lag (Q1) and Neutrality (Q4) arguments because the metric is no longer uniquely "objective."

  **Genuine Good Reply**
  **Question 4 (The Neutrality Claim)** is where she has a genuinely strong reply.
  *   **The Reply:** She can argue that *all* measures of democracy are normative, but "expert coding" introduces *partisan* bias (experts disagree based on ideology), whereas "turnover" is a *procedural* minimum that commands broader consensus.
  *   **Why it works:** It shifts the debate from "Is turnover enough?" (where she is vulnerable) to "Is expert coding worse?" (where she is strong). A strong answer acknowledges the trade-off: she isn't measuring "perfect democracy," she is measuring "uncontested regime status" to reduce measurement disagreement. This is a defensible, if narrow, research goal.
