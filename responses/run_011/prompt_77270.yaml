answer: |-
  ### Disambiguation of the Principle

  The slogan "do not tear down a fence until you know why it was put up" is not a single proposition but a family of claims ranging from trivial advice to paralyzing dogma. The confusion in your committee arises because the senior member is sliding between these readings without acknowledging the shift. Below is a menu of five distinct readings, ordered from the weakest (least epistemically demanding, least restrictive on action) to the strongest (most demanding, most restrictive).

  #### 1. The Procedural Diligence Claim
  *   **The Claim:** For any existing practice $P$, an agent $A$ should not initiate the removal of $P$ without first making a good-faith effort to investigate the history or function of $P$.
  *   **Quantifiers/Epistemic Operators:** $\forall P, \forall A$: Removal($A, P$) $\rightarrow$ PriorInvestigation($A, P$).
      *   *Kind of Knowing:* Mere "looking." No requirement to actually *find* the reason, only to have searched for it.
      *   *Who:* The proposer of the change.
      *   *Status:* Justified belief that a search was conducted.
  *   **Verdict:** **Platitude.** It is trivially true that reckless destruction is bad. It does not forbid removal if the search yields nothing.
  *   **Application:**
      *   *Hiring Rule:* **Licenses.** You investigated (asked founder, discussed history).
      *   *All-Hands:* **Licenses.** Trivial investigation shows no hidden function.
      *   *Pilot:* **Licenses.** A pilot is a form of investigation.

  #### 2. The Burden of Proof Claim
  *   **The Claim:** For any existing practice $P$, there is a default presumption that $P$ is useful. The burden of proof lies on the reformer to demonstrate that $P$ is net-negative, not on the keeper to demonstrate $P$ is net-positive.
  *   **Quantifiers/Epistemic Operators:** $\forall P$: Existence($P$) $\rightarrow$ PresumptionUtility($P$). Removal($P$) requires Evidence($\neg$Utility($P$)) > Threshold.
      *   *Kind of Knowing:* Justified belief that the costs of $P$ outweigh its unknown benefits.
      *   *Who:* The reformer.
      *   *Status:* Normative presumption, not strict knowledge.
  *   **Verdict:** **Substantive and Defensible.** This is a standard conservative heuristic. It acknowledges uncertainty without mandating paralysis. It treats the status quo as a baseline asset.
  *   **Application:**
      *   *Hiring Rule:* **Veto Plausible.** If the committee believes the risk of a bad hire outweighs the cost of deadlock, the burden isn't met.
      *   *All-Hands:* **Veto Implausible.** The cost of Tuesday vs. Thursday is low; the burden to show "no hidden function" is easily cleared.
      *   *Pilot:* **Veto Plausible.** If the pilot itself carries risk (e.g., team morale), the burden applies.

  #### 3. The Functional Presumption Claim
  *   **The Claim:** For any practice $P$ that has persisted over time $T$, there *exists* a function $F$ that $P$ serves, and persistence is evidence of $F$'s value.
  *   **Quantifiers/Epistemic Operators:** $\forall P$: Persistent($P, T$) $\rightarrow$ $\exists F$: Serves($P, F$) $\land$ Valuable($F$).
      *   *Kind of Knowing:* Belief in the *existence* of a function, not necessarily knowledge of *what* it is.
      *   *Who:* The committee/collective.
      *   *Status:* Belief based on survivorship bias.
  *   **Verdict:** **Contentious.** This relies on the assumption that institutional drift, lock-in, or power dynamics do not explain persistence. It conflates "survived" with "optimal."
  *   **Application:**
      *   *Hiring Rule:* **Veto.** Assumes the deadlock itself might be serving a hidden function (e.g., preventing factionalism).
      *   *All-Hands:* **Veto.** Implies Tuesday has a hidden systemic function even if no one can name it.
      *   *Pilot:* **Veto.** Modifying the fence risks breaking the hidden function $F$.

  #### 4. The Historical Specificity Claim
  *   **The Claim:** To remove $P$, agent $A$ must possess specific knowledge of the original causal intention $I$ of the founders, and verify that $I$ is no longer valid.
  *   **Quantifiers/Epistemic Operators:** $\forall P$: Removal($P$) $\rightarrow$ Knows($A$, OriginalIntent($P$)) $\land$ $\neg$Valid($OriginalIntent(P)$).
      *   *Kind of Knowing:* Propositional knowledge of historical mental states.
      *   *Who:* The reformer (or the committee).
      *   *Status:* Knowledge (truth-conditional).
  *   **Verdict:** **False/Impossible.** As your founder demonstrated, intentions are often lost, inconsistent, or non-existent (kludges). This reading makes removal impossible whenever history is opaque.
  *   **Application:**
      *   *Hiring Rule:* **Veto.** Founder forgot; reasons inconsistent. Condition cannot be met.
      *   *All-Hands:* **Veto.** Likely no specific "founder intent" for the day of the week.
      *   *Pilot:* **Veto.** Cannot verify intent is satisfied by a partial change.

  #### 5. The Epistemic Barrier Claim (The "No Pilot" Reading)
  *   **The Claim:** The function $F$ of a fence $P$ is *only* revealed by its removal. Therefore, one cannot know $F$ without removing $P$, but one must know $F$ before removing $P$.
  *   **Quantifiers/Epistemic Operators:** $\forall P$: Knows($F(P)$) $\leftrightarrow$ Removed($P$). Rule: $\neg$Removed($P$) $\rightarrow$ $\neg$Knows($F(P)$). Constraint: $\neg$Knows($F(P)$) $\rightarrow$ $\neg$Removed($P$).
      *   *Kind of Knowing:* Certain knowledge of the counterfactual (what happens if it's gone).
      *   *Who:* The decision-maker.
      *   *Status:* Logical paradox / Strict Knowledge.
  *   **Verdict:** **Self-Defeating.** This creates a Catch-22 that forbids all change and all learning. It explicitly forbids experimentation (pilots) because a pilot is a controlled removal, which is forbidden without prior knowledge which is impossible to get.
  *   **Application:**
      *   *Hiring Rule:* **Veto.**
      *   *All-Hands:* **Veto.**
      *   *Pilot:* **Veto.** (This is the reading your senior member used to block the pilot).

  ---

  ### The Gap: Epistemic Constraint vs. Normative Presumption

  You identified the core friction: the slide from "you may not remove it until you know why" (epistemic constraint) to "the fence enjoys a presumption in its favour" (normative presumption).

  1.  **The Epistemic Constraint:** Readings 1 and 4 are purely epistemic. They say, "Get information." The problem, as you noted, is that getting the information (e.g., "it was a temporary concession to a dead signatory") often *dissolves* the presumption for keeping the fence. If the slogan were strictly epistemic, discovering the reason should frequently license removal.
  2.  **The Normative Presumption:** Readings 2 and 3 are normative. They say, "Assume value." This is where the slogan does its real work in governance. It shifts the default from "change is neutral" to "change is risky."
  3.  **The Slide:** The slogan works rhetorically because it disguises the Normative Presumption as an Epistemic Constraint. By saying "You don't *know*," the senior member implies "Therefore you *cannot* act." But logically, "I don't know" should lead to "Let's find out" (Reading 1/Pilot), not "Let's stop" (Reading 5). The senior member is using the epistemic gap to enforce a normative status quo bias without admitting it is a value judgment.

  ### Scope and Symmetry Questions

  *   **Symmetry:** The principle is radically asymmetric. It applies to *removal* but not to *retention*. Keeping a fence is a decision with costs (maintenance, obstruction), yet the slogan treats retention as the null action. It also says nothing about *building* fences. If applied symmetrically ("Don't build a fence until you know why you need one"), it would be a strong design principle. As it stands, it is a conservation principle.
  *   **Designed vs. Emergent:** The metaphor "fence" implies design (someone put it up).
      *   *Designed Institutions:* The principle is most applicable here, but Reading 4 (Intent) fails if records are lost.
      *   *Emergent Norms:* Applying the slogan here is a category error unless "why it was put up" is reinterpreted as "what selective pressure kept it." If interpreted as "founder intent" for an emergent norm, the claim is false.
      *   *Kludges/Cargo Cults:* Reading 3 (Functional Presumption) fails here. A rule copied from another org or created as a temporary fix may persist due to inertia, not function. Persistence is weak evidence of function in high-friction bureaucracies.
  *   **Persistence as Evidence:** Persistence is evidence of *stability*, not necessarily *utility*. Practices survive via lock-in, sunk cost fallacy, or because they benefit a powerful subgroup (e.g., existing team leads vetoing hires to reduce competition). The slogan assumes the "invisible hand" of institutional efficiency, which is often absent.

  ### Logical Incompatibilities

  *   **Reading 1 (Diligence) vs. Reading 5 (Epistemic Barrier):** These cannot both be operational. Reading 1 encourages the pilot as a method of diligence. Reading 5 forbids the pilot as a violation of the knowledge constraint. Your senior member invoked Reading 5 to block a Reading 1 solution.
  *   **Reading 3 (Function) vs. Founder's Testimony:** If the founder states the rule was a temporary concession or a copy-paste error, Reading 3 (Persistence = Function) is falsified for this specific case. To maintain Reading 3, one must assert the founder is lying or mistaken about their own organization, which is a strong claim.
  *   **Reading 4 (Intent) vs. Reading 2 (Burden):** Reading 4 requires specific historical knowledge. Reading 2 only requires a net-negative assessment. Reading 4 entails Reading 2, but Reading 2 does not entail Reading 4. The senior member is demanding Reading 4 while claiming the authority of Reading 2.

  ### Rationalist Usage and the Strongest Core

  In the circles you describe, the slogan is usually deployed as **Reading 2 (Burden of Proof)** but is often mentally experienced as **Reading 3 (Functional Presumption)**.

  *   **Common Usage:** Users intend to counsel humility regarding complex systems (Reading 2). They want to prevent "naive interventionism."
  *   **Actual Effect:** It often calcifies into Reading 5 (Epistemic Barrier) in practice, because "knowing why" is set as a precondition for action, and "knowing" is defined strictly. This leads to the paralysis you are experiencing.

  **The Strongest Core:**
  Once the false (Reading 4), self-defeating (Reading 5), and contentious (Reading 3) readings are stripped away, the defensible core is a **Risk-Adjusted Burden of Proof (Reading 2)**:
  > *In complex, coupled systems where side-effects are hard to predict and reversal is costly, the burden of proof for removal should be proportional to the opacity of the system and the irreversibility of the change.*

  This core admits that:
  1.  Sometimes the fence is stupid (founder's amnesia).
  2.  Sometimes you must cut the fence to see what it did (pilots are allowed if reversible).
  3.  The "presumption" is not about the fence's *value*, but about the *risk of uncertainty*.

  ### Note on Your Paraphrase

  You asked me to work from your paraphrase ("don't tear down... until you know") and note if it does work the original might not.

  Your paraphrase is **more epistemic and more absolute** than the traditional understanding of the principle.
  *   **"Until you know":** This sets a binary condition. Either you know, or you don't touch. This directly enables the "No Pilot" veto (Reading 5), because a pilot implies acting *without* full knowledge to *gain* knowledge.
  *   **Chesterton's Nuance:** The original argument (without quoting it) is generally framed as a question of *authority* and *temperament* rather than a strict epistemic lockout. It suggests that the *attitude* of the reformer is often the problem (arrogance), not just the lack of data. It allows for the possibility that a reformer *might* be right, but asks them to prove they have considered the fence's purpose.
  *   **The Difference:** Your paraphrase turns a heuristic about *attitude* into a rule about *knowledge states*. This makes it easier for a senior member to weaponize. If the rule is "Don't act until you know," and knowledge is impossible without action, the system locks. If the rule is "Don't act until you have *considered* why," a pilot is a valid form of consideration. Your paraphrase inadvertently supports the paralysis you are suffering.
