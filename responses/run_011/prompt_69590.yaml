      You're pressing hard on the policy, but I think you're conflating the source of motivation with the structure of deliberation. Piotr's policy forbids acting on waves of emotion, it doesn't forbid acting on calculated self-interest or prudential planning. He cares about not being a burden. If his daughter collapses into destitution or trauma because he stays home, the likelihood of her becoming a crushing burden on him later—financially, legally, or even just by forcing a crisis he can't ignore—increases dramatically. Going now is a means to securing his desired end of remaining unburdened later. That route doesn't require vivid emotional imagination; it requires only the sort of cold forecasting an ex-surveyor specializes in. The policy intercepts the surge of pity, not the calculation of risk.

