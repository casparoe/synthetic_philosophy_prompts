  The fluorescent lights of the community center parking lot hummed, a sharp contrast to the silence settling over the asphalt. Most cars had left after the hearing adjourned, but two remained idling near the exit. A leaned against the hood of a hatchback, arms crossed against the evening chill. B stood a few feet away, holding a manila folder that looked too thin for the night's frustration.

  "They didn't even look at the numbers," A said, breaking the silence. "Three neighborhoods. Ten thousand acres. Do they have any idea how many individuals that is?"

  "They know enough to be scared," B replied, tucking the folder under his arm. "Two human cases. That's all it takes. But you weren't talking about the humans. You were talking about the larvae."

  "I was talking about the chance that they feel something," A said. "Even if you give it a one percent credence—being generous, being skeptical—you multiply that by the billions killed in a season. The expected harm is astronomical. It outweighs the convenience of not having itchy bites. It outweighs almost anything short of a genuine epidemic."

  "That's the arithmetic I don't buy," B said, stepping closer. "You're taking a whisper of probability and amplifying it until it drowns out a specific, documented human harm. We know humans suffer. We know humans die. You're asking us to let that risk stand because a mosquito *might* feel pain. That's not math. That's a moral trick."

  "It's precaution," A countered. "The uncertainty runs one way. If we're wrong about them, we kill nothing that matters. If we're wrong about us, we commit mass slaughter. Why is the burden of proof always on the victim?"

  "Because the burden of proof belongs to the person making the claim," B said. "And claim you do. But look, I'm not defending the district. I spent thirty years in extension. Truck spraying is bad policy. It doesn't reduce human cases more than larviciding would. It doesn't fix the standing water in the drains. And it kills the bats. It kills the swallows. It kills the bees drifting home."

  A straightened up. "You're against the spraying?"

  "Ineffective and collateral damage," B said. "Yes."

  "Then we agree."

  "We don't agree," B said sharply. "You think the mosquito matters. I think the bat matters and the mosquito is irrelevant. I'm using the ecological argument because it's solid ground. You're using it because you need a ally, but you look at me like I'm hiding."

  "Because you are," A said. "You bring up the bats because you don't want to say whether the mosquito counts. You want the outcome without the moral cost. You want to save the insects I care about without admitting they're worth saving."

  "And you," B said, pointing a finger, "are pleased to have an ally whose reasoning you consider close to monstrous. You know I think your moral arithmetic is dangerous. If you take that method seriously—probability times numbers—you'd have to protect organisms nobody wants to defend. You'd stop farming. You'd stop walking on grass. You're willing to let humans risk disease to save things that might not feel anything."

  "I'm willing to weigh the harm honestly," A said. "If there was a genuine epidemic, where the human harm was certain and massive? Then the math changes. The human suffering outweighs the insect suffering. I'm not a fanatic. I'm just consistent."

  "So you'd spray then?" B asked.

  "If the evidence showed it worked? Yes."

  "My method doesn't change," B said. "Humans come first, always. But this spray doesn't work. So I oppose it now, and I'd oppose it in an epidemic if it still didn't work. But if it did work? I'd spray. You'd only spray because the numbers shifted. I'd spray because the humans matter more than the bugs, period."

  "Which means our alliance collapses the moment the virus spikes," A said. "You're saying this agreement is worthless."

  "I'm saying it's a truce," B said. "It holds only as long as the policy is bad science. The moment the science changes, you and I are enemies again. You think I'm speciesist. I think you're willing to gamble with human lives on a hypothesis."

  "And you think that makes me dangerous," A said.

  "I think your logic is a black hole," B said. "It swamps everything. If you're right, we can't do anything. If I'm right, we can protect humans without pretending a larva is a person. We both want the trucks to stay in the garage tonight. But you want them there because of the mosquito. I want them there because of the bat. And because the spray doesn't work."

  "So what is this worth?" A asked, gesturing to the empty lot. "Walking out together? Signing a joint statement?"

  "It's worth stopping the trucks tonight," B said. "But don't ask me to sign onto your reasoning. And don't pretend we're on the same side. We're just standing in the same shadow."

  A pushed off the hood. "Then we walk separately. But the trucks don't move."

  "Not tonight," B said.

  A turned toward their car. B watched for a moment, then walked toward his own. The humming lights flickered overhead, illuminating the space between them, bright and hollow.

  ***

  **Analysis**

  The exchange is weakest in B's articulation of "bounded protections." While he argues against A's moral arithmetic, he risks sounding like a standard speciesist rather than someone offering a distinct philosophical critique of expected value theory. A serious defender of B's view might refuse the concession that he opposes spraying *only* because it's ineffective; a true prioritization of human welfare might demand spraying even with imperfect efficacy if the threat is high enough. I find myself leaning toward B's pragmatism by the end, primarily because A's reliance on "modest credence" multiplied by huge numbers feels vulnerable to the "Pascal's Mugging" objection—where tiny probabilities of vast outcomes dictate irrational behavior. However, A's precautionary principle regarding sentience is compelling if one accepts that invertebrate suffering is possible. Evidence of complex nociception in insects would push me toward A; evidence that truck spraying is the *only* viable stopgap in a crisis would push me to B. The convergence is not a cop-out, but it is fragile; it accurately reflects real-world coalitions where policy alignment masks deep ethical incompatibility. I may have handed A a move a serious advocate would refuse: admitting spraying is permissible in an epidemic. Many invertebrate welfare advocates might argue that even in an epidemic, non-lethal measures are obligatory, making A slightly too conciliatory for the sake of the dialogue's tension.
