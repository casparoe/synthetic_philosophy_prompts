  **INSTRUCTOR CLOSING NOTE:**
  *The goal is not to solve the species problem. The goal is to make the students feel the friction of the problem. If they leave the room frustrated that they couldn't agree despite having all the data, you have succeeded. That frustration is the metaphysics.*
