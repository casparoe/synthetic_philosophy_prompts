answer: |-
  # SEMINAR PACKET: The *Silurana ficta* Revision Committee

  **Course:** Metaphysics of Biological Classification
  **Session:** Simulation – The Orogen Valley Checklist
  **Time:** 100 Minutes
  **Participants:** 18 Students (6 Working Groups of 3, plus 2 Individual Officers drawn from the groups)

  ---

  ## 1. INSTRUCTOR LOGISTICS & TIMELINE

  **Room Setup:** Six tables clustered in a circle. One central table for the Officers. Whiteboard at the front.
  **Materials:**
  *   6 Envelopes (one per Group) containing: Role Brief, Public Dossier, Private Evidence Cards.
  *   2 Envelopes (for Officers) containing: Individual Mandates.
  *   18 "Voting Cards" (index cards).
  *   1 "Master Checklist" poster.
  *   Timer visible to all.

  **Minute-by-Minute Schedule:**
  *   **00–10:** **Briefing.** Distribute roles. Explain the *Silurana ficta* genus and the Orogen Valley context. Emphasize: *No concept names allowed in discussion.*
  *   **10–25:** **Evidence Review (Silent).** Groups read Public Dossier and Private Cards. No cross-talk.
  *   **25–35:** **The Silent Vote.** Each group writes their partition of populations A–G on a Voting Card. All posted simultaneously. (The "Reveal").
  *   **35–75:** **Negotiation.** Open floor. Officers circulate. Goal: One Master Checklist.
  *   **75–85:** **Final Submission & Scoring.** Groups calculate payoffs.
  *   **85–100:** **Debrief.** Philosophical mapping (see Section 6).

  **Handling the Headcount (18 Students):**
  To accommodate 6 Working Groups *and* 2 Individual Officers with 18 students:
  *   Form 6 Groups of 3.
  *   Select one student from Group 1 to be the **Listing Officer**.
  *   Select one student from Group 2 to be the **Nomenclature Officer**.
  *   During the **Negotiation Phase**, these two students leave their tables and sit at the Central Table. Their original groups continue with 2 members.

  ---

  ## 2. THE PUBLIC DOSSIER (Included in all Group Envelopes)

  **Genus:** *Silurana* (Family: *Fictidae*)
  **Context:** Montane stream-dwelling frogs in the Orogen Valley system.
  **Task:** Produce the Official Checklist for the Conservation Authority.
  **Constraint 1 (The Law):** The *Endangered Valley Act* recognizes only units ranked as **Species**. Subspecies receive no protection.
  **Constraint 2 (The Concession):** A hydroelectric project is planned in Valley G. If Valley G populations are listed as **one species**, the project proceeds. If they are split into **three species**, the project is halted.
  **Constraint 3 (The Names):** The oldest available name, *Silurana montana* (1892), has its Type Locality in Population **B**. If **B** is split, the name *montana* applies only to one fragment. The rest require new names, invalidating 50 years of ecological literature.

  **The Populations (A–G):**
  *   **A:** Low-elevation valley floor. Large population.
  *   **B:** Mid-elevation slopes. Parapatric with A.
  *   **C:** High-elevation peaks.
  *   **D:** Thermal springs (distinct regime). All-female observed.
  *   **E:** Island population (recently founded).
  *   **F:** Known only from 9 museum specimens (1900–2000) + 1 eDNA hit.
  *   **G:** Terminal valley chain. Connects to F, which connects to... eventually A.

  ---

  ## 3. ROLE BRIEFS (6 Groups)

  **CRITICAL RULE:** Your brief describes a *procedure*. Do not use philosophical labels (e.g., "Biological Species Concept," "Phylogenetic Species Concept"). Do not cite authors. Defend your procedure as the only scientifically rigorous one.

  ### GROUP 1: Reproductive Isolation Procedure
  **Slogan:** "Can they make babies that make babies?"
  **Mandate:** You delimit species based on actual or potential interbreeding under natural conditions.
  **Rules:**
  1.  If two populations interbreed freely and produce fertile offspring in the wild, they are one species.
  2.  If hybrids are sterile or inviable, they are separate species.
  3.  If hybridization is rare (<10%) but gene flow is blocked, they are separate.
  4.  **Problem:** How do you handle populations that do not reproduce sexually?
  **Payoff:** +10 points if your final partition matches your isolation data. -20 points if you are forced to lump populations you have evidence are isolated.

  ### GROUP 2: Diagnosability Procedure
  **Slogan:** "If you can tell them apart, they are apart."
  **Mandate:** You delimit species based on the presence of fixed, heritable characters.
  **Rules:**
  1.  If a population possesses at least one unique trait (morphological, genetic, or behavioral) found in 100% of its members and 0% of others, it is a species.
  2.  Do not worry about whether they interbreed. Worry about whether you can identify them.
  3.  **Problem:** What if the unique trait is trivial (e.g., a call pulse)?
  **Payoff:** +5 points for every distinct species you successfully designate. -10 points if you lump two populations that have a fixed difference.

  ### GROUP 3: Ecological Distinctness Procedure
  **Slogan:** "Different jobs, different names."
  **Mandate:** You delimit species based on occupation of distinct adaptive zones.
  **Rules:**
  1.  If two populations occupy significantly different niches (temperature, diet, microhabitat), they are separate species.
  2.  Gene flow is irrelevant if selection keeps them distinct in their habitats.
  3.  **Problem:** What if the niche difference is subtle?
  **Payoff:** +10 points if your checklist protects distinct ecological roles. -10 points if you lump populations with different thermal/dietary needs.

  ### GROUP 4: Genotypic Clustering Procedure
  **Slogan:** "Find the gaps in the data."
  **Mandate:** You delimit species based on statistical gaps in genetic similarity.
  **Rules:**
  1.  Look at multilocus genotypes. If individuals cluster into distinct groups with few intermediates, those are species.
  2.  Ignore geography. If the genetics show a gap, there is a species boundary.
  3.  **Problem:** What if the clusters don't match the geography?
  **Payoff:** +10 points if your partition matches the genetic clusters. -20 points if you ignore a genetic gap to satisfy other groups.

  ### GROUP 5: Cohesion Procedure
  **Slogan:** "What keeps the group one?"
  **Mandate:** You delimit species based on the mechanisms holding them together (gene flow or shared fate).
  **Rules:**
  1.  A species is the widest group united by intrinsic (mating) or extrinsic (selection) cohesion.
  2.  If cohesion is broken, split them. If cohesion exists despite differences, lump them.
  3.  **Problem:** How do you measure "fate"?
  **Payoff:** +10 points if you can identify the cohesive mechanism for every unit. -10 points if you split a cohesive group.

  ### GROUP 6: Lineage Independence Procedure (The "7th Chair")
  **Slogan:** "Separate fates only."
  **Mandate:** You refuse to endorse any specific criterion. You only endorse separately evolving metapopulation lineages.
  **Rules:**
  1.  You are the arbiters. You do not propose splits; you veto them.
  2.  If a proposed species does not represent a distinct historical lineage, you veto it.
  3.  **Problem:** Lineages are hard to see in a snapshot.
  **Payoff:** +20 points if the final checklist reflects true evolutionary independence. -30 points if the checklist is arbitrary or inconsistent.

  ---

  ## 4. INDIVIDUAL OFFICER BRIEFS (2 Students)

  ### OFFICER A: Listing Agency Representative
  *(Drawn from Group 1)*
  **Mandate:** Maximize protection under the *Endangered Valley Act*.
  **Incentive:** The Act only recognizes **Species**.
  **Payoff:** +5 points for every population designated as a **Species** on the final checklist. 0 points for subspecies or unranked populations.
  **Secret Pressure:** If the G Valley is split into 3 species, you get a +50 bonus (Project Halted). If G is lumped, you get -50 (Project Proceeds).

  ### OFFICER B: Nomenclatural Stability Officer
  *(Drawn from Group 2)*
  **Mandate:** Minimize disruption to published literature.
  **Incentive:** The name *Silurana montana* applies to Population **B**.
  **Payoff:** +50 points if Population **B** remains a single species (keeping the name). -50 points if **B** is split (stranding the literature).
  **Secret Pressure:** You prefer lumping generally. Every new name required costs you -5 points.

  ---

  ## 5. PRIVATE EVIDENCE CARDS (The Asymmetry)

  *Each Group receives 1 or 2 cards. Do not show these unless trading.*

  **Group 1 (RI) Card:**
  *   **A-B Contact:** 9% of adults in the contact zone are morphologically intermediate.
  *   **Crosses:** Captive crosses A♀ x B♂ yield fertile backcrosses. B♀ x A♂ yield sterile offspring (Haldane's Rule).
  *   **D Population:** No males found. Females mate with B males but offspring are clonal copies of mothers (Gynogenesis).
  *   **Impact:** A and B might be one species (some flow). D is impossible to classify by your rules.

  **Group 2 (Diag) Card:**
  *   **C Population:** Has a single fixed character: Advertisement call has 5 pulses (all others have 3).
  *   **B Population:** Contains the Type Specimen.
  *   **Impact:** C *must* be a species by your rules. Splitting B hurts the Nomenclature Officer.

  **Group 3 (Ecol) Card:**
  *   **D Population:** Occupies thermal springs (35°C). All others are <20°C.
  *   **E Population:** Niche modelling shows 98% overlap with A, despite being on an island.
  *   **Impact:** D *must* be a species (distinct niche). E should be lumped with A (same niche).

  **Group 4 (Geno) Card:**
  *   **B-C Genetics:** Mitochondrial haplotypes of C are nested inside B. B is not monophyletic unless C is sunk into it.
  *   **Nuclear DNA:** Shows B and C are distinct clusters.
  *   **Impact:** MtDNA says lump B+C. Nuclear says split. Your procedure prioritizes multilocus clustering (Split).

  **Group 5 (Cohesion) Card:**
  *   **E Population:** Genetic assignment indicates 2 migrants per generation from A. Strong drift signature (low heterozygosity).
  *   **G Population:** Part of a chain. G exchanges genes with F, F with E... eventually A. But G and A do not interbreed directly.
  *   **Impact:** E is cohesive with A (migrants). G is cohesive with A (chain), despite no direct contact.

  **Group 6 (Lineage) Card:**
  *   **F Population:** Known from 9 museum specimens (1900–2000) + 1 eDNA hit. No live specimens.
  *   **G Population:** Terminal end of a ring.
  *   **Impact:** F's lineage status is unknown (extinct?). G is a distinct lineage endpoint despite gene flow chain.

  ---

  ## 6. NEGOTIATION MECHANICS & TRADING

  **The Trading Rule:**
  Groups may trade Evidence Cards during the Negotiation Phase.
  *   **Cost:** To demand a card from another group, you must offer them **2 Authority Points** (from your payoff) or concede one of your proposed splits/lumps.
  *   **Risk:** If you reveal a card, everyone knows its content. If you keep it hidden, you can use it to veto, but others may call your bluff.

  **The Decision Rule:**
  *   The Committee must produce **one** checklist (e.g., A=Sp, B=Sp, C=Subsp...).
  *   **Abstention is not neutral.** Any population the Committee fails to explicitly rank as "Species" defaults to **"Unlisted"** for the Listing Officer (0 points) and **"Lumped"** for the Nomenclature Officer.
  *   **Veto:** Group 6 (Lineage) has one Veto token. If used, the checklist is rejected, and all groups get 0 points.

  **The "Integrative Taxonomy" Trap:**
  If a student proposes: *"Let's just pool all the evidence and decide together!"*
  **Facilitator Script:** "Stop. You are proposing a weighting rule. Is a fixed call character worth more than nuclear DNA? Is reproductive isolation worth more than niche? Who decides the weights? That weighting rule *is* a species concept. You haven't escaped the problem; you've just hidden the concept choice."

  ---

  ## 7. DEBRIEF PLAN (Instructor Notes)

  *Do not lecture. Draw out the following from their experience.*

  **1. The Scoreboard vs. The Pressure (10 mins)**
  *   *Ask:* "Who changed their mind during negotiation? Why?"
  *   *Point:* You didn't change your mind about the *frogs*; you changed your mind about the *cost*. This mirrors real taxonomy: nomenclatural inertia and regulatory triggers drive decisions as much as data.
  *   *Philosophy:* **Value-ladenness of taxonomy.** Is the Listing Officer's pressure a corruption of science, or an honest acknowledgement of what taxonomy *does*?

  **2. Disjoint Evidence (10 mins)**
  *   *Ask:* "Group 1 and Group 2, did you look at the same data?"
  *   *Point:* Group 1 looked at fertility (process). Group 2 looked at call pulses (pattern). You were not answering the same question.
  *   *Philosophy:* **de Queiroz (2007).** The "Species Category" is one thing (separately evolving metapopulation lineage), but the "Species Criteria" (RI, Diag, etc.) are different lines of evidence. The dispute isn't about what a species *is*, but how we *find* them. Does this dissolve the dispute? (Ask students: Did knowing de Queiroz's view help you agree in the sim? Probably not, because you still had to weigh the evidence.)

  **3. Class vs. Individual (10 mins)**
  *   *Ask:* "Group 6 (Lineage), what were you looking for?"
  *   *Point:* Group 6 was looking for a historical entity (a lineage). Group 2 was looking for a class membership condition (having a trait).
  *   *Philosophy:* **Ghiselin & Hull (Species as Individuals).** If species are historical individuals, they can't be defined by necessary and sufficient conditions (traits). They are defined by spatiotemporal continuity. This is why Group 1 (RI) struggled with D (asexual) and Group 6 struggled with F (extinct?).

  **4. Pluralism vs. Monism (5 mins)**
  *   *Ask:* "Could we have had two checklists? One for the Law, one for the Museum?"
  *   *Philosophy:* **Kitcher / Mishler & Brandon.** Pluralism suggests different concepts for different purposes. **Ereshefsky** suggests abandoning the rank "Species" entirely. Would that have helped? (If there were no "Species" rank, the Listing Officer would have no leverage.)

  **5. The Integrative Trap (5 mins)**
  *   *Recap:* Remind them of the "Just pool the evidence" moment.
  *   *Point:* Pooling requires a weighting rule. The weighting rule is a metaphysical commitment. There is no "view from nowhere."

  ---

  ## 8. TROUBLESHOOTING: WHAT WILL GO WRONG

  **1. The Diagnosability Split (Group 2)**
  *   *Prediction:* They will split A–G into 7 species immediately and declare victory.
  *   *Fix:* Remind them of the **Nomenclature Officer's Payoff**. If they split B, the Officer loses 50 points and will block the checklist. Force them to negotiate the *cost* of splitting, not just the right.

  **2. The RI Abstention (Group 1)**
  *   *Prediction:* They will refuse to rule on D (asexual) or F (museum).
  *   *Fix:* Enforce the **"Abstention is not neutral"** rule. If they don't rank D, it defaults to "Unlisted." The Listing Officer will pressure them to rank it. Force a choice: "Is D a species or not? You cannot pass."

  **3. The Nomenclature Comic Relief**
  *   *Prediction:* Students will ignore the Type Locality rule as bureaucratic nonsense.
  *   *Fix:* During the scoring phase, ruthlessly deduct the 50 points from the Nomenclature Officer if B is split. Show the class how "science" just lost to "bureaucracy" in the payoff.

  **4. The Real-World Drift**
  *   *Prediction:* A student will say, "In wolves/finches we would just..."
  *   *Fix:* "Stop. You are in the Orogen Valley. External evidence is inadmissible."

  **5. The Reveal Eats the Debrief**
  *   *Prediction:* The Silent Vote reveal takes too long.
  *   *Fix:* Hard stop at 35 minutes. Post the cards. Take a photo. Move to negotiation immediately. Do the detailed analysis in the debrief.

  ---

  ## 9. LIMITATIONS & MODIFICATIONS

  **What This Simulation Cannot Reproduce:**
  1.  **The Diachronic Dimension:** This is a frozen snapshot. Real lineages are processes over time. Students cannot see the *future* independence of G, only the current connectivity. You must supply this in the debrief: "Imagine coming back in 10,000 years. Would G still be connected?"
  2.  **Tacit Knowledge:** Real taxonomists have a "feel" for the organisms. This simulation reduces organisms to data points. Acknowledge that real revision involves handling specimens, not just reading cards.
  3.  **Articulation:** Real taxonomists are often less philosophically articulate than these role briefs imply. They often use concepts inconsistently. This sim is *cleaner* than reality.

  **Modification for 12 Students:**
  *   **Groups:** 4 Groups of 3 (RI, Diag, Ecol, Lineage).
  *   **Officers:** Listing and Nomenclature Officers are played by the **Instructors** (You and your colleague).
  *   **Effect:** This increases pressure. The Instructors act as the "State" and the "Museum," applying pressure to the student groups. It reduces the number of concepts covered (drop Cohesion and Genotypic Clustering), but allows for deeper negotiation on the remaining four.
  *   **Evidence:** Distribute the Private Cards from the missing groups (Geno/Cohesion) among the remaining 4 groups to ensure the biological tensions remain.

