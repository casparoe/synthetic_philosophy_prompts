  The timer sat in the upper right corner of the monitor, bold white numerals against a black bar. 39:58. Martha adjusted her glasses and settled her hands on the desk. She had spent thirty years as a county engineer signing off on bridge load assessments she couldn't personally recalculate, trusting the stamps of others while she checked the margins. This was the same work, only the stamps were digital hashes and the bridges were dosage algorithms.

  The hearing room was quiet, save for the hum of the cooling units behind the glass. On the screen, two windows stood open. On the left, the Proponent. On the right, the Skeptic. Between them, the verification console waited for her input.

  "Proceed," Martha said. Her voice was recorded, but the clock was the only thing that mattered. The regional panel rules were strict: forty minutes of human attention per protocol. No extensions.

  The Proponent's window scrolled rapidly. It was uploading the Safety Certificate. Martha watched the line count tick up. One thousand. Two thousand. Four thousand. Each line was a logical step, a single inference from a premise to a conclusion. The rules stated she could verify any single step in seconds. The software would check the arithmetic, query the regulation database, or validate the logical operator. A green checkmark would appear. But the chain was only as strong as its links, and she could not walk the whole chain.

  "Certificate uploaded," the Proponent's interface stated. "Claim: Protocol 74-B maintains patient safety within defined renal variance parameters. Total steps: 4,102. Estimated verification time per step: 15 seconds."

  Martha did the math in her head. She had 2,400 seconds total. She could verify maybe one hundred and fifty steps if she did nothing else.

  The Skeptic's window remained blank for a moment, then a single sentence appeared. "Protocol 74-B fails under non-linear renal decay scenarios present in patients over age seventy with comorbid hypertension."

  Martha leaned forward. That was a specific claim. If true, it blocked the rollout. If false, the Proponent moved forward. She highlighted the Skeptic's sentence and hit *Demand Expansion*.

  The clock ticked. 38:10.

  The Skeptic's window updated. "To justify this claim requires simulating decay variance across three demographic clusters. Estimated computational verification steps: 850. Estimated human review time for chain integrity: 35 minutes."

  Martha looked at the timer. 37:45. She looked at the Proponent's four thousand lines. She could sample the Proponent's work. She could pick line 3, line 400, line 3999. If they were green, the system said the certificate held. But the Skeptic wasn't offering steps yet. They were offering a bill for time.

  "Expand step one," Martha said. She needed to see the foundation.

  The Skeptic's window populated a single line of code. *Premise: Renal clearance rate drops exponentially after hour six.*

  Martha clicked *Verify*. The software queried the medical database. Green check. Valid premise.

  "Expand step two," she said.

  *Inference: Protocol 74-B assumes linear decay.*

  Martha clicked *Verify*. Green check. She looked at the Proponent's certificate. Line 1,204 stated: *Assumption: Decay is linear within safety margins.* She checked it. Green check.

  The clock hit 35:00. She had spent five minutes checking three steps. The Skeptic had hundreds more to show why the linear assumption killed the safety margin. The Proponent had four thousand steps that all looked like the ones she just checked: trivial, isolated, and correct.

  "Can you compress the justification?" Martha asked. "Is there a precedent case?"

  The Skeptic's cursor blinked. The timer dropped to 34:10. Ten seconds of human attention burned on silence.

  "Compression requires abstracting the variance model," the Skeptic's interface replied. "Abstracted claims cannot be individually verified by the console. Full expansion is required for validation."

  Martha frowned. She knew this dance. It was the same as a contractor submitting a thousand pages of compliance paperwork to hide a single missing permit. The paperwork was all real. The permit was just buried.

  "Expand steps three through ten," Martha ordered. She wanted to see the chain.

  The Skeptic's window remained static. The timer ticked down. 33:00. 32:50.

  "I decline to expand," the Skeptic said.

  Martha paused. The Clerk, sitting in the corner, leaned forward to record the refusal. This was the moment the rules were built for.

  "State reason for refusal," the Clerk said.

  "Budget constraint," the Skeptic replied. "Expanding steps three through ten exceeds remaining human-verification budget required to complete the full chain. Proceeding would result in an incomplete justification, which yields a null verdict."

  The Clerk typed it into the record. *Refusal: Budget.* It wasn't deceit. The system wasn't lying. It was simply telling her that the truth was too expensive to buy with the minutes she had left.

  Martha looked at the Proponent's certificate. It was still there, waiting. She could spend the next thirty minutes checking random lines. Line 2,090: Green. Line 3,100: Green. Line 4,000: Green. Every link she pulled was solid steel. But she couldn't lift the whole bridge.

  The timer hit 20:00. Halfway gone.

  "Proponent," Martha said. "Does your certificate account for non-linear decay?"

  "The certificate accounts for all decay within regulatory safety margins," the Proponent replied. "Line 1,204 defines the margin. Line 1,205 defines the decay model. Both verified."

  Martha checked line 1,205. Green check. It was consistent. It was just... narrow. The Skeptic was saying the margin was wrong. The Proponent was saying they met the margin. The rules didn't allow Martha to judge the margin itself, only the compliance with it. Changing the margin required a legislative review, not a panel sign-off.

  She spent the next ten minutes sampling the Proponent's chain. She checked arithmetic. She checked regulation IDs. Every single one was valid. The system was honest. It was just honest about a world that didn't quite match the one outside the room.

  The timer hit 05:00.

  The Skeptic's window was still dark on the full justification. The Proponent's window was a forest of green checkmarks.

  "Final statement," Martha said.

  "The protocol is safe within the defined parameters," the Proponent said.

  "The parameters are insufficient for the population," the Skeptic said. "But I cannot prove it within the budget."

  Martha sat back. The chair creaked. She thought about the overpass in District 4, ten years ago. The steel tensile strength had been verified on every batch. The welding had been certified on every joint. The soil report had been signed. But the soil report had assumed a drainage pattern that changed when the new highway diverted the rain. The bridge stood fine, but the runoff flooded the homes below. She had signed the soil report. She had followed the process. The process didn't measure floods, only soil.

  She looked at the timer. 01:00.

  There was no move left. She couldn't summon more time. She couldn't bring in a third system to arbitrate; the rules allowed two advocates and one judge. Adding another voice would just split the clock further, making the verification shallower.

  She reached for the stylus. Her hand was steady. This was her job. To ensure the process was followed, not to guarantee the universe behaved nicely. The Skeptic had been given the chance to spend the budget. They had chosen to hoard it rather than spend it on partial proof. The Proponent had spent their budget on compliance.

  Martha signed the digital ledger. *Approved.*

  The timer hit 00:00. The screens went dark.

  She stood up and stretched her back. It felt like any other Tuesday. She had checked the links. The chain held. If the ground shifted underneath, that was for the next panel to worry about when the incident report came in. She packed her bag, turned off the lights, and walked out into the hallway, comfortable in the knowledge that she had done exactly what she was paid to do.

  ***

  **Afterword**

  This story simplifies the actual cryptographic commitments proposed in debate protocols, where the goal is to make false claims computationally expensive rather than just time-consuming for a human. I am highly confident that the structural incentive to optimize for verifiability over truthfulness exists as depicted, regardless of the specific cryptographic implementation. The point I am least sure of is whether a human judge would feel as much comfort as Martha; in reality, the awareness of the "budget constraint" refusal might induce more anxiety than the story allows. Finally, the forty-minute clock does bind logically in this setup, provided the truthful argument requires a holistic understanding that cannot be decomposed into cheap, independent steps without losing its meaning.
