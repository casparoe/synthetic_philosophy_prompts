answer: |-
  Here is a breakdown of the distinct precise claims your friend's sentence might be making, analysed according to your criteria.

  **1. The Universal Cardinality Claim**
  *   **The Claim:** For *any* collection whatsoever, the number of members in the whole is strictly strictly greater than the number of members in any proper part.
  *   **Status:** Simply false. In standard set theory (ZFC), this is demonstrably false for infinite sets.
  *   **Survives the Dedekind Point?** No. This is precisely what Dedekind showed does not hold for infinite sets. To assert this is to deny the definition of infinity rather than to argue against it.
  *   **Carries the Argument?** It would, if it were true. However, relying on it renders your friend's argument circular. He is assuming the non-existence of infinite sets (by claiming they must obey finite arithmetic) to prove the non-existence of infinite sets.

  **2. The Mereological Claim**
  *   **The Claim:** A proper part is ontologically 'less than' the whole in terms of containment or being, regardless of how many members it contains.
  *   **Status:** A platitude. By definition, a proper part is contained within the whole and is not identical to it.
  *   **Survives the Dedekind Point?** Yes. Dedekind infinity concerns *cardinality* (counting), not *mereology* (parthood). An infinite set can be a proper part of another set while having the same cardinality.
  *   **Carries the Argument?** No. This claim establishes that the original guests are a *part* of the total guests, but it does not establish that they are *fewer* in number. It fails to bridge the gap from 'bizarre' to 'contradictory'.

  **3. The Euclidean Magnitude Claim**
  *   **The Claim:** The principle applies strictly to continuous magnitudes (lines, areas, volumes) rather than discrete multitudes (counts of things).
  *   **Status:** Historically accurate and true. Euclid's Common Notion 5 was formulated for geometry, not arithmetic or set theory.
  *   **Survives the Dedekind Point?** Yes. It restricts the scope of the principle to domains where it actually holds.
  *   **Carries the Argument?** No. In fact, it undermines your friend's position. If the principle only applies to continuous magnitudes, it cannot be invoked to disprove the possibility of a discrete infinite collection of hotel guests.

  **4. The Finite Restriction Claim**
  *   **The Claim:** The principle holds necessarily, but only where the collections in question are finite.
  *   **Status:** A platitude (within standard mathematics). It is true by definition of 'finite' (a set is Dedekind-finite if it cannot be put into one-to-one correspondence with a proper subset).
  *   **Survives the Dedekind Point?** Yes. It accepts the Dedekind distinction between finite and infinite.
  *   **Carries the Argument?** No. This concedes the main point of contention. If the principle only applies to finite collections, one cannot use it to prove that an infinite collection is impossible; one must first prove the collection is finite to apply the rule.

  **5. The Metaphysical Necessity Claim**
  *   **The Claim:** It is a necessary truth of metaphysics that no reality (physical or abstract) can instantiate a one-to-one correspondence with a proper part of itself.
  *   **Status:** A substantive and defensible thesis (historically associated with Aristotle and the Kalam Cosmological Argument), though controversial in contemporary philosophy of mathematics.
  *   **Survives the Dedekind Point?** No. This is not a reaction to Dedekind but a rejection of the mathematical conception of the actual infinite as metaphysically unrealisable.
  *   **Carries the Argument?** **Yes.** This is the only reading that actually supports your friend's conclusion. However, it is not a self-evident platitude; it is the very conclusion he is trying to establish disguised as a premise. To use this, he must provide independent metaphysical justification for why mathematical coherence does not entail metaphysical possibility.

  ### Summary for your Friend
  You might suggest to him that his argument hinges entirely on **Claim 5**. If he treats "the whole is greater than the part" as a mathematical claim about numbers (**Claim 1**), he is simply mistaken about transfinite arithmetic. If he treats it as a metaphysical axiom (**Claim 5**), he is not demonstrating a contradiction within the concept of the hotel, but rather asserting a metaphysical constraint upon reality that excludes Cantorian sets. The latter is a coherent philosophical position, but it requires defence on metaphysical grounds, not merely an appeal to Euclidean intuition.
