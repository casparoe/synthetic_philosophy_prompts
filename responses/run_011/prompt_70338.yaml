  *(Self-Correction on the "Infinite Memory" Loophole)*: The colleague claims the resolution depends on a "contingent assumption about finite storage." This is philosophically interesting. If storage is infinite, can we avoid the 2nd Law? No, because the tape itself must be in a low-entropy state to begin with. Using up low-entropy tape is the thermodynamic cost. I must emphasize that the *source* of the order is the blank tape.

