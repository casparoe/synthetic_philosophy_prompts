          *   35-Hour: Clean. It's purely quantitative constraint.
          *   Karoshi: Partial. Misses the cultural coercion aspect.
      *   **Meaning & Leisure:**
          *   Can the framework handle "leisure is good in itself"? No. In load management, rest is *restorative*. It serves performance. If leisure is intrinsic value, it drops out of the objective function unless you code "happiness" as a performance metric. That is smuggling.
      *   **Framework Failures:**
          *   *Shaky Framework:* ACWR noise, GPS validity, wellness subjectivity. These are measurement errors.
          *   *Wrong Kind of Framework:* Trying to quantify "will to train" or "social pressure." These are sociological, not physiological.
      *   **Wellness vs. Election:**
          *   This is the killer point. Both are subjective signals interpreted through a dogma (Calvinism / Sports Science) to predict an unknowable future (Salvation / Availability). If the wellness score doesn't predict injury better than a coin flip, it *is* a sign of election. I need to be honest here.

  4.  **Formulating the Verdict:**
      *   Is work/leisure just load management? No. Load management is teleological (for the sake of winning). Work/leisure debate is ontological (what is a good life?).
      *   The model cannot capture *alienation*. An athlete can be perfectly loaded, recovered, and miserable. The model sees "ready"; the philosopher sees "alienated."

  5.  **Refining the Tone:**
      *   Avoid academic jargon. Use rugby/sports science terms (AU, TRIMP, periodization, selection).
      *   Be direct. "You are smuggling," "This is a category error."
      *   Acknowledge the user's intelligence. They spotted the parallels; now show the limits.

  6.  **Step-by-Step Writing Plan:**
