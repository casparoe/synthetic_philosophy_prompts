  8.  **Final Polish:** Ensure the structure matches the user's requested "Residue Report" format. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to make sure I don't just say "Philosophy is deeper." I need to explain *why* the load vocabulary fails to capture it technically. It's about the *objective function*. Load management optimizes $P$ (Performance). Philosophy optimizes $E$ (Existence). You can't subsume $E$ into $P$ without changing the definition of $P$.

