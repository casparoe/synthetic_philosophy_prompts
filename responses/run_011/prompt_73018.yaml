      *   *Check:* Did I answer the specific prompt about "smuggling meaning"? *Yes, need to be explicit.*
      *   *Check:* Did I address the ACWR criticism? *Yes, distinguish between statistical noise and conceptual limits.*
      *   *Check:* Is the tone right? *Needs to be professional but sharp.*
      *   *Refinement on Weber:* Make sure to distinguish between "hard work for gain" (rational) and "hard work for God" (irrational/ascetic). In rugby, if they train hard to get selected, that's rational. If they train hard because resting makes them feel guilty *even when injured*, that's Weberian.
