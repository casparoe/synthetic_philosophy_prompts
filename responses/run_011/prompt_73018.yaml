      *   **Tone:** Direct, critical, precise, respecting the user's expertise while challenging their conceptual translation. No platitudes.

  2.  **Deconstruct the Three Translations:**

      *   **1. Weber (Protestant Ethic) $\rightarrow$ Chronic High Load/No Deload + Unvalidatable Wellness.**
          *   *User's take:* Asceticism = chronic high load. Election = wellness questionnaire (unvalidatable until the end).
          *   *Critique:* Weber isn't just about working hard; it's about *why*. It's irrational accumulation for the sake of accumulation as a sign of grace. In rugby, high load is usually instrumental (win on Saturday). If the athlete trains hard just to prove they are "worthy" of selection, regardless of performance gain, that's Weberian. The wellness questionnaire comparison is sharp: both are signs of an internal state that can't be directly measured until "judgment" (selection/injury/season end).
          *   *Verdict:* Strong mapping on the *psychology* of the load, but misses the *irrationality*. Sports science is usually rational (load $\rightarrow$ adaptation). Weber is about irrational duty.

      *   **2. French 35-Hour Week $\rightarrow$ Acute Load Cap + Monotony/Intensity Trade-off.**
          *   *User's take:* Cap hours = cap acute load. Critique (intensity up) = same strain index, fewer hours, higher intensity.
          *   *Critique:* This is actually a very clean translation. The "intensity paradox" in labor economics (hours down, output same, so intensity up) maps perfectly to "session duration down, sRPE up, TRIMP same." The risk here is that load metrics often miss *density*. If you compress 1000 AU into 40 mins instead of 60, the physiological stress might be non-linear.
          *   *Verdict:* Cleanest map. Captures the structural constraint and the behavioral adaptation.

      *   **3. Karoshi $\rightarrow$ Danger Zone + No Recovery Monitoring + Diffused Ownership.**
          *   *User's take:* Death by overwork = injury/death from load. No recovery monitoring. No single owner of load (unlike a coach).
