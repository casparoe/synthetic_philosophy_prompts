  **Joint Statement of the Adversarial Collaboration on the Public Justification Standard**

  **To:** The Student-Faculty Senate
  **From:** Camp A (Sponsors) and Camp B (Opponents)
  **Date:** March 10

  We, the undersigned members of Camp A and Camp B, submit this statement following our adversarial collaboration. While we remain divided on the adoption of the Public Justification Standard, we have identified common ground regarding the legitimacy of our body and the obligations of its members.

  **I. Agreed Claims**

  1.  **Obligation to Bound Students:** Senators owe an explanation to every student bound by Senate decisions, including those who did not vote or were unaware of the agenda. Power exercised without accountability undermines the Senate's legitimacy.
  2.  **Limits on Authority:** The Senate is not entitled to regulate the personal convictions, religious practices, or private associations of students. Its authority extends only to school activities and the student activities fund.
  3.  **Value of Sincerity:** Both camps agree that senators should not be trained to manufacture presentable grounds that differ from their actual motivations. A culture of insincerity degrades deliberation.
  4.  **Asymmetric Costs:** Camp A concedes that the clause imposes costs on some members that it does not impose on others; specifically, students whose comprehensive views are religious may bear a heavier burden of translation than those whose views align with secular norms.
  5.  **Subordination:** Camp B concedes that a body which settles questions by unanswerable authority rather than by reasons treats its members as subordinates. Decisions binding the community must be defensible to the community.

  **II. Table of Surviving Disagreements**

  | Label | Camp A Formulation | Camp B Formulation | Condition for Settlement |
  | :--- | :--- | :--- | :--- |
  | **Neutrality** | The standard is a neutral procedure for addressing one another when exercising power, not a comprehensive doctrine. | The standard is not neutral; it privileges secular reasoning and defines "public" grounds in a way that excludes religious worldviews. | Agreement on whether secular utilitarianism is as "comprehensive" as religious doctrine. |
  | **Participation** | The clause ensures full participation by requiring reasons all can assess, preventing exclusion by fiat. | The clause restricts full participation by telling religious students their convictions are second-class unless translated. | Data on whether religious students feel excluded or empowered by the norm. |
  | **Enforcement** | Social censure is a legitimate enforcement mechanism for a norm of conduct, even without formal sanctions. | Social censure will fall hardest on minority students and drives debate into private channels where it cannot be answered. | Evidence of where debate migrates and who is censured. |

  **III. Cruxes and Concrete Tests**

  To move forward, we identified specific sub-questions where evidence could shift our positions. We agree to the following tests and evidence criteria.

  1.  **The Utilitarian Calculation:**
      *   *Case:* A funding motion carried by a senator offering only aggregate welfare calculations, discounting a rival club's disappointment.
      *   *Evidence:* Debate transcripts showing whether the discounting was challenged as inaccessible.
      *   *Predictions:* Camp A predicts this will be accepted as accessible grounds. Camp B predicts this will be treated as accessible despite being as uninspectable as scripture.
  2.  **Mixed Motives (Dress Code):**
      *   *Case:* A senator invokes modesty traditions but also offers a sufficient cost argument regarding clothing affordability.
      *   *Evidence:* Whether the vote is recorded as valid if the cost argument stands alone.
      *   *Predictions:* Camp A predicts validity, as accessible grounds exist. Camp B predicts the religious motive will still be scrutinized, proving the rule targets identity, not reasoning.
  3.  **Insincerity:**
      *   *Case:* A senator states a reason known to be reasonable but that is not their actual reason.
      *   *Evidence:* Anonymous post-vote surveys comparing stated reasons to private motivations.
      *   *Predictions:* Camp A predicts public reasoning improves regardless of private motive. Camp B predicts high rates of insincerity, reducing trust.
  4.  **Long-Term Exclusion:**
      *   *Case:* Three years after adoption, religiously observant students hold no leadership offices and report feeling they must leave convictions at the door.
      *   *Evidence:* Anonymous climate survey and leadership demographic data.
      *   *Predictions:* Camp A predicts no correlation between the clause and leadership demographics. Camp B predicts a statistically significant decline in religious student participation.
  5.  **Non-Religious Moral Frameworks:**
      *   *Case:* A motion supported only by premises from a moral framework half the Senate rejects as question-begging (e.g., specific rights theories), but which is not religious.
      *   *Evidence:* Whether the chair or peers treat this as a violation of the standard.
      *   *Predictions:* Camp A predicts this will be accepted as public reason. Camp B predicts it will be accepted, proving the standard biases against religious comprehensive doctrines.
  6.  **AI Drafting Tool:**
      *   *Case:* The Senate uses an AI tool to write motion preambles and debate summaries that no senator fully endorses.
      *   *Evidence:* Review of whether AI-generated text is held to the Standard.
      *   *Predictions:* Camp A predicts the tool must comply to ensure public record accuracy. Camp B predicts applying the rule to AI exposes the impossibility of genuine "reason-giving" by non-agents, undermining the rule's logic.
  7.  **Verbal Disputes:**
      *   *Issue:* We conclude part of this dispute is verbal. Camp A reads "accessible" as *intelligible and contestable using shared evidence*, while Camp B reads it as *derived from shared premises*. Camp A reads "must be able to say" as a *capacity to articulate*, while Camp B reads it as a *requirement to articulate*.
      *   *Resolution:* We agree to define "accessible" in any pilot as "grounds that do not require acceptance of a specific comprehensive doctrine to evaluate," and "must be able to say" as "must be prepared to state."

  **IV. Joint Recommendation and Procedural Step**

  We cannot currently agree on the permanent adoption of the clause. Camp A believes the norm is essential for legitimacy; Camp B believes it is inherently exclusionary. However, we agree that empirical evidence from our own Senate is needed to resolve the predictions above.

  **Recommendation:** We jointly recommend that the Senate **adopt the clause as amended for a trial period**.

  **Procedural Step:** The clause shall apply only to **spending motions** exceeding $500 for one academic year. On **March 14** of next year, the Faculty Adviser shall present a report detailing: (1) the number of motions debated under the standard, (2) results of the anonymous climate survey regarding sincerity and exclusion, and (3) a log of any instances where reasons were challenged. Following this review, the Senate shall vote on permanent adoption, amendment, or repeal.

  This path allows Camp A to test whether public justification improves deliberation and allows Camp B to test whether the norm imposes asymmetric costs or drives debate underground. We urge our colleagues to accept this trial not as a victory for either side, but as a commitment to evidence over assumption.

  **Signed,**
  **Camp A Sponsors**
  **Camp B Opponents**
