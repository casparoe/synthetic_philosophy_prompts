answer: |-
  ### Brainstorming Candidate Concepts

  1.  **Self-Fulfilling Prophecy (Merton)**
      *   *Why it fits:* Describes a belief that brings about its own truth.
      *   *Why it fails:* As you noted, the classic definition implies the belief starts *false* or *unfounded* (e.g., a bank run based on a rumor). In your case, the market price might be epistemically sound *and* causally potent. The term carries a pejorative connotation of "delusion made real," whereas your market might be "knowledge made real."
      *   *Fit:* Low.

  2.  **Goodhart's Law**
      *   *Why it fits:* Involves a metric losing its value once used for control.
      *   *Why it fails:* Goodhart assumes *gaming* or *optimization against the metric* (e.g., teachers teaching to the test). Your actors (employers, council) aren't gaming the price to look good; they are reacting to the price as *information* to change the physical world. The mechanism is coordination, not distortion.
      *   *Fit:* Low.

  3.  **Reflexivity (Soros)**
      *   *Why it fits:* Explicitly describes feedback loops where market prices influence the fundamentals they are supposed to measure (e.g., stock price affects company's ability to borrow, changing earnings).
      *   *Why it fails:* Usually applied to financial instability, boom/bust cycles, or macro-economics. It often implies a divergence from "fair value." It doesn't inherently address the *audit* problem of distinguishing knowledge from causation in a policy context.
      *   *Fit:* Medium-High.

  4.  **The Oedipus Effect (Popper)**
      *   *Why it fits:* Karl Popper's term for the influence of a prediction on the predicted event. He explicitly noted this makes social prediction different from natural science.
      *   *Why it fails:* It is a broad philosophical category, not a technical mechanism. It names the problem but doesn't offer a framework for analyzing the *accuracy* resulting from it.
      *   *Fit:* Medium.

  5.  **Barnesian Performativity (MacKenzie/Callon)**
      *   *Why it fits:* Specifically describes when a theory or model makes the world conform to itself (named after Bachelard). MacKenzie applied this to options pricing models (Black-Scholes) making markets behave like the model.
      *   *Why it fails:* Usually applied to the *theory* underlying the market, not the *price signal* itself acting as a policy lever. However, it is the closest philosophical match for "accuracy via constitution."
      *   *Fit:* High.

  6.  **Performative Prediction (Perdomo et al., ML/Stats)**
      *   *Why it fits:* A recent (c. 2020) technical term from machine learning. Defines a setting where the deployment of a predictive model changes the distribution of the data it predicts. It mathematically formalizes the exact loop you describe.
      *   *Why it fails:* It originates in computer science/statistics, not social science. It treats the reaction as a loss function to be minimized, whereas your county *wants* the reaction.
      *   *Fit:* High (Technically), Medium (Culturally).

  **Ranking by Fit:**
  1.  **Barnesian Performativity** (Best philosophical carving).
  2.  **Performative Prediction** (Best technical definition).
  3.  **Reflexivity** (Best economic intuition).
  4.  **The Oedipus Effect** (Best historical ancestor).

  ---

  ### Considered Verdict

  The phenomenon you are describing does not have a single, universally agreed-upon name that bridges the gap between social philosophy and market mechanics, but it is a recognized intersection of two established concepts.

  The most precise established label from the philosophy of social science is **Barnesian Performativity**.
  The most precise label from the statistics and decision-science literature is **Performative Prediction**.

  Your case is a specific, policy-oriented hybrid of these. Since you asked me to coin a term if nothing established covers it cleanly: I propose the term **Constitutive Calibration**.

  **Definition:** A system is in a state of Constitutive Calibration when a public forecast achieves high accuracy primarily because the publication of the forecast triggers behavioral adjustments that align the outcome with the forecast, rendering the epistemic contribution of the forecast (its knowledge of independent fundamentals) indistinguishable from its causal contribution (its power to move fundamentals).

  **Why this differs from the near-synonyms:**
  *   **Vs. Self-Fulfilling Prophecy:** A prophecy is usually deemed "false" until fulfilled. In Constitutive Calibration, the forecast may be *true* on fundamentals (e.g., the bus lanes *would* have worked anyway), but the publication ensures it happens *faster* or *more certainly*. The truth value is not the differentiator; the *source* of the accuracy is.
  *   **Vs. Goodhart's Law:** Goodhart's Law presumes the metric is corrupted (becomes a bad measure). In Constitutive Calibration, the metric remains a "good" measure of the outcome, precisely *because* it corrupted the process. It is a "successful" metric that fails as a "passive" sensor.
  *   **Vs. Reflexivity:** Reflexivity often implies a destabilizing feedback loop (price diverges from value). Constitutive Calibration implies a *stabilizing* loop (price converges to outcome via intervention). It is reflexivity harnessed for control, like a thermostat.

  **Boundary Cases for "Constitutive Calibration":**
  1.  **Looks like it, but isn't:** A weather forecast causes people to carry umbrellas, so "rain preparedness" matches the forecast, but the *rainfall itself* does not change. This is behavioral adaptation, not Constitutive Calibration, because the underlying physical variable (precipitation) remains independent of the prediction.
  2.  **Doesn't look like it, but is:** A central bank announces an inflation target (a prediction of future prices) and hits it exactly. Observers claim the bank has perfect models. In reality, the bank's model was mediocre, but the announcement anchored wage negotiations and pricing strategies to the target. The accuracy was constitutive, not epistemic.

  ---

  ### The Audit Question: Distinguishing Knowledge from Causation

  This is the core of your disagreement. Your friend argues the market is successful because it coordinates (causation). You argue it is epistemically hollow because it coordinates (causation). You are both right, but you are measuring different things.

  **Is the distinction ill-posed?**
  Strictly speaking, **yes**, within the current system design. If the price $P$ influences the outcome $Y$, and the fundamentals $F$ influence $Y$, and $P$ is derived from $F$, you have a system of simultaneous equations:
  1.  $P = f(F)$ (The market aggregates info)
  2.  $Y = g(F, P)$ (The outcome depends on fundamentals and the price signal)

  Without an external shock, you cannot solve for the weight of $F$ versus $P$ in determining $Y$. The market is not a thermometer (measuring independent temperature); it is a thermostat (setting temperature). Asking a thermostat how accurate its measurement was is a category error; its job is to *make* the measurement true.

  **Can an auditor distinguish them without a counterfactual world?**
  No, not definitively. However, an auditor can look for **elasticity evidence** that suggests causation is dominating epistemology.

  **What would count as evidence of Causal Dominance (Your view):**
  1.  **The "Noise" Test:** If the market price moves on irrelevant noise (e.g., a rumor that is later debunked, or a trader error) and the *outcome* still shifts in response to that price movement before the correction, the system is causally sensitive to the price itself, not just the fundamentals.
  2.  **The "Withheld Signal" Test (Quasi-Counterfactual):** If the county publishes the price in Corridor A but keeps it internal for Corridor B (randomized disclosure), and Corridor A performs significantly better *relative to fundamentals* than Corridor B, the delta is the causal power of the publication.
  3.  **Lag Analysis:** If the price shifts *before* new fundamental information is available (e.g., before the council votes, before construction starts), and the outcome follows the price shift rather than the eventual fundamental reality, the price is leading via causation.

  **What would count as evidence of Epistemic Dominance (Friend's view):**
  1.  **Inelasticity to Manipulation:** If an auditor could inject a fake price signal (without changing the underlying plan) and actors *ignored* it because their on-the-ground fundamentals contradicted it, the market is epistemic. (In your case, the council scaling back the program when the price sagged suggests they *did* listen to the price over their own initial plans, pointing to your view).
  2.  **Convergence without Intervention:** If the outcome matches the price even in areas where the price was *not* public or where actors could not act on it (e.g., freight depots outside county jurisdiction), that accuracy is epistemic.

  **The Verdict on the Fight:**
  Your friend is describing **Governance Utility**. The market is a successful *coordination mechanism*. It aligns expectations so that employers, freight depots, and the council all move in the same direction. In this sense, the "accuracy" is a feature, not a bug.

  You are describing **Epistemic Validity**. You want to know if the market *knows* something about the world that we didn't. Because the market changes the world, you cannot know this.

  **Procedure for the Auditor:**
  Since you cannot run the counterfactual world, the auditor must change the *question*. Do not ask: "Was the market right because it knew, or because it caused?"
  Ask: **"What is the marginal cost of the price signal?"**

  If the council scales back a project *solely* because the market price dropped (as in your Year 2 example), but the fundamentals (traffic engineering models) still supported the project, the market has introduced **Efficiency Risk**. It may have saved money by canceling a useful project, or it may have prevented a failure.

  **Recommendation:**
  The distinction is operationally ill-posed *unless* the county treats the market price as a **treatment variable** rather than a **measurement variable**.
  To audit this, the county should occasionally **decouple the price from the policy**. Run the market, get the price, but commit to *ignoring it* for one quarter (blind policy). Compare the outcome to the price.
  *   If the outcome matches the price anyway: The market was **Epistemic** (it knew).
  *   If the outcome diverges from the price: The market was **Constitutive** (it usually works only because we listen).

  Without this "blind quarter," your friend wins the utility argument, and you win the truth argument, and you will argue forever because you are describing two different properties of the same machine. The machine is a **Performative Engine**, not a **Prediction Market** in the strict sense. It predicts by making.
