      *   *Keep:* The adverse selection intuition ("why is the other side taking the bet?").
      *   *Keep:* The Aumann connection.
      *   *Keep:* The EMH/Stock picking advice link (with caveats).

      *   *Crucial Addition:* The Ex-Ante Efficiency assumption.

      *(Self-Correction during drafting)*: Wait, does MS require common knowledge of rationality? It assumes Rational Expectations Equilibrium (REE). In REE, agents know the mapping from signals to prices. This implies a high degree of epistemic alignment. The passage's "common knowledge of rationality" is a fair proxy for REE assumptions in a pop-sci context. I won't nitpick that too hard, but I will emphasize the *Efficiency* assumption which is completely missing.

      *Wait, one more thing:* The passage says "prices move... never because traders are betting against one another." This is wrong because even in MS, if public news arrives, traders update. But the *volume* is the issue. MS says *volume* is zero. Prices can still move if the *potential* price changes due to public info, but no trade happens. Actually, if no trade happens, how do prices move? In MS, prices are set by a market maker or equilibrium condition. If no trade occurs, the *valuation* changes, but transaction prices might not be observed. The passage implies prices swing on public news. That's consistent. The error is implying *no trade* means *no price movement*. Price is a reflection of information, trade is the exchange. MS says no exchange. I need to be careful not to confuse price updates with trade volume. The passage says "price stays exactly where it was" in the private info scenario. That is correct for the *transaction* price if no trade occurs. But if public news arrives, price moves. Okay, the passage is mostly okay on the price vs. trade distinction, but implies *only* public news moves prices. In reality, order flow (trade) moves prices. MS says order flow shouldn't exist. So if order flow exists, prices move on order flow. The passage says prices *never* move because traders bet against one another. This is technically true under MS (because they don't bet), but empirically false. I will focus on the *volume* aspect.

      *Re-evaluating the "Common Prior" gloss:* "Before the news arrived, they were all looking at the same evidence." This is slightly misleading. They have the same *model* of the world. They might have seen different public history. But effectively, they assign the same probability to states before private signals. I'll call this a "Forgivable Simplification."

      *Re-evaluating "Common Knowledge":* "Everyone knows that everyone knows." This is 2nd order. Formal theorem needs Common Knowledge (infinite). I will flag this as technically wrong but standard shorthand.

      *Re-evaluating "Ex-Ante Efficiency":* This is the big omission. Without this, the theorem fails. If I am risk-averse and you are risk-neutral, we trade even with common priors. The theorem assumes we are already at an optimal risk-sharing point.

