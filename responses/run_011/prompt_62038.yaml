  2.  **Analyze the Source Passage (Mental Sandbox):**
      *   *Claim:* Milgrom-Stokey (1982) says rational traders cannot trade.
      *   *Claim:* Assumptions: Common Prior, Rationality + Common Knowledge of Rationality.
      *   *Claim:* Mechanism: Adverse selection logic ("they know something I don't").
      *   *Claim:* Result: Prices move only on public news, never on betting.
      *   *Claim:* Connection to Aumann ("Agree to Disagree").
