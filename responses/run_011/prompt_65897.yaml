answer: |-
  # Step 1 — Brainstorm

  To reconstruct the theoretical engine driving these verdicts, I have isolated four candidate rules. The table below evaluates their fit against the eight established cases.

  | Candidate Rule | 1 (Clinic) | 2 (Genetics) | 3 (Period App) | 4 (Hospital) | 5 (Fitness) | 6 (Oncologist) | 7 (Protest) | 8 (Hospice) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Consent Sovereignty**<br>(Privacy = Control waivable by consent) | *Strain*<br>(Consent implied by email provision) | *Clean*<br>(Granular consent) | *Incompatible*<br>(Consent given, still violation) | *Strain*<br>(Agreement signed) | *Strain*<br>(Defaults accepted by use) | *Incompatible*<br>(Consent explicit & informed) | *Strain*<br>(Public data) | *Clean*<br>(Consent given) |
  | **Contextual Integrity**<br>(Privacy = Adherence to context norms) | *Clean*<br>(Billing ≠ Treatment context) | *Clean*<br>(Commercial research norms met) | *Clean*<br>(Health ≠ Advertising context) | *Clean*<br>(Research ≠ Re-ID context) | *Clean*<br>(Defaults violate choice norm) | *Strain*<br>(Requires norm forbidding waiver) | *Clean*<br>(Public ≠ Searchable DB) | *Clean*<br>(Bereavement norm met) |
  | **Inalienable Dignity**<br>(Privacy = Protection of status non-waivable) | *Clean*<br>(Negligence degrades status) | *Strain*<br>(Commercial use usually degrading) | *Clean*<br>(Exploitation degrades) | *Clean*<br>(Re-ID degrades patients) | *Clean*<br>(Manipulation degrades) | *Clean*<br>(Medical dignity inviolable) | *Clean*<br>(Aggregation degrades) | *Clean*<br>(Memorializes dignity) |
  | **Procedural Autonomy**<br>(Privacy = Quality of choice architecture) | *Clean*<br>(No safety check) | *Clean*<br>(Revocable/Itemized) | *Clean*<br>(Take-it-leave-it) | *Strain*<br>(Student rogue action) | *Clean*<br>(Dark pattern) | *Incompatible*<br>(Procedure perfect) | *Strain*<br>(Public sourcing) | *Clean*<br>(Specific clause) |

  **Notes on Strain:** Consent Sovereignty collapses immediately on Case 6, where explicit informed authorization fails to prevent a violation. Procedural Autonomy similarly fails on Case 6 and struggles with Case 4 (where the breach was by a third party despite procedural safeguards). Inalienable Dignity fits Case 6 perfectly but must stretch to accommodate Case 2, where commercial exploitation is permitted provided consent is granular. Contextual Integrity is the strongest fit but requires a robust explanation for Case 6: why the medical context norm prohibits waiver.

  # Step 2 — Survivors

  Only **Contextual Integrity** survives all eight verdicts unqualified, but only if supplemented by an auxiliary assumption: **The Inalienability of Professional Norms.**

  Pure Contextual Integrity suggests that if context norms allow a flow, it is permissible. Case 6 proves this insufficient; the supervisor holds that certain professional contexts (medicine) generate norms that *cannot* be waived by the subject, even with informed consent. This implies a hybrid theory: Information flows must respect context-relative norms, *and* certain contexts carry non-waivable duties that override individual authorization.

  If we attempt to save **Inalienable Dignity** instead, we must accept a significant loss of predictive content. To accommodate Case 2 (Genetics), we must argue that commercial use is not inherently degrading if procedurally robust. This makes "dignity" contingent on procedure, effectively collapsing it back into a procedural version of Contextual Integrity. Therefore, the ledger is consistent only with the hybrid: **Contextual Integrity with Inalienable Professional Constraints.** When components conflict (e.g., patient consent vs. medical norm), the professional norm takes priority.

  # Step 3 — The Prediction

  **Verdict:** Violation.
  **Confidence:** High (85%).
  **Closest Analog:** Case 8 (Hospice Recording) is the surface analog (same setting, same clause), but Case 6 (Oncologist) is the governing principle.

  **Reasoning:** Like Case 8, this involves hospice data and a bereavement clause. However, like Case 6, it involves a transfer/use that exceeds the normative scope of the original authorization, regardless of the subject's initial permission. In Case 8, handing a static recording to a daughter fits the entrenched norm of "bereavement" (memory preservation). In Case 9, generating an interactive simulacrum shifts the norm from "remembering the dead" to "reconstructing the dead." This exceeds the semantic scope of "bereavement program" initialed by the patient. Furthermore, following Case 6, the supervisor treats consent as insufficient when the *nature* of the use violates the integrity of the relationship or the subject's status. An interactive AI risks commodifying the deceased's identity in a way a static recording does not. The analogy to Case 8 breaks on the *interactivity*; the analogy to Case 6 holds on the *insufficiency of consent* regarding the specific type of transfer.

  # Step 4 — Divergence

  Here is how the surviving candidates reason through Case 9, highlighting their divergence on the status of the deceased.

  **Contextual Integrity (with Inalienable Core):**
  *   **Reasoning:** The "bereavement program" context has entrenched norms. These norms include sharing memories (Case 8) but exclude creating interactive agents that mimic the deceased. This shifts the information flow from a memorial context to a simulation context. The initial consent ("bereavement program") does not cover this new flow.
  *   **Dead Subject:** Contextual norms persist post-mortem. The family becomes the subject of the privacy interest, but the norms governing the deceased's data remain tied to the original context of collection.
  *   **Verdict:** Violation.

  **Inalienable Dignity:**
  *   **Reasoning:** Creating a conversational replica degrades the moral status of the deceased. It reduces a person to a tool for comfort, risking mockery or uncanny valley effects that undermine the dignity of mourning. Consent cannot waive this degradation.
  *   **Dead Subject:** The deceased retains moral status. Privacy violations can occur against the dead because dignity is not extinguished by death.
  *   **Verdict:** Violation.

  **Where They Part:** They agree on the verdict but diverge on *why*. If the family *requested* the AI specifically, Contextual Integrity might still rule Violation (norms forbid it), whereas Inalienable Dignity might struggle if the family argues this *enhances* their dignity/grief process. The crucial divergence is on the **source of the constraint**: external social norms (Context) vs. internal moral status (Dignity). Both agree consent is insufficient, aligning with Case 6.

  # Step 5 — The Recommendation

  **Recommendation:** Rule **Violation**.

  **Principle Adopted:** By ruling this a violation, the chapter adopts the principle that **privacy protects the normative integrity of information types, not just the subject's will.** It establishes that consent is a necessary but insufficient condition when the *type* of processing fundamentally alters the relationship between the living and the dead. This coheres perfectly with Case 6 (medical pathology cannot become training data for a trainer) and Case 3 (vague policy cannot cover exploitative use). It preserves the supervisor's commitment that some boundaries are structural, not contractual.

  **Cost of the Alternative:** If she rules **No Violation**, she undermines Case 6. It would imply that "bereavement program" is a magic phrase that permits any technology developed under its banner, provided the family agrees. This collapses her theory into Consent Sovereignty, forcing her to retract the verdict on Case 6 or admit an inconsistent distinction between medical pathology and voice prints. It would also strain Case 8, making the distinction between static recording and interactive AI arbitrary rather than principled. To maintain the monograph's theoretical uniformity, she must treat the AI reconstruction as a categorical shift in information flow that the original clause did not and could not authorize.

  # Step 6 — The Discriminator

  To distinguish between **Contextual Integrity** and **Inalienable Dignity** (the two best fit), I propose a tenth example:

  **Case 10:** *The hospice uses the deceased's AI voice model to train staff on delivering difficult news empathetically. The family consents, and the data never leaves the hospital.*

  **Prediction:**
  *   **Contextual Integrity:** **Violation.** The flow moves from the "Bereavement/Family" context to the "Medical Training/Professional" context. Even with family consent, the normative expectation of the bereavement clause was family comfort, not institutional utility. The context shift triggers a violation.
  *   **Inalienable Dignity:** **No Violation.** Using the voice to improve care for the dying honors the deceased's dignity and contributes to the common good. There is no degradation or commodification; the purpose is morally laudable.

  **Why this works:** This case isolates the *purpose* and *flow* from the *consent*. Both theories agree consent is present (unlike Case 6). Contextual Integrity focuses on the *destination* of the data (Training vs. Family), predicting a violation due to context breach. Inalienable Dignity focuses on the *moral quality* of the use (Honoring vs. Exploiting), predicting no violation because the use is dignified. This forces the supervisor to clarify whether her constraint is about **where information goes** (Context) or **what is done to the person** (Dignity).
