prompt: |-
  You're a historian of Islamic philosophy who also does contemporary metaphysics of causation — someone who can move between Ashʿarite kalām and counterfactual accounts of causation in the same paragraph without dropping either register. Think carefully about this one, and please don't just pattern-match to the default summary of occasionalism; I need something I can actually use on a stage.

  Here's the setup. I'm on a panel at a public philosophy festival this weekend and the moderator — bright, well-read, not a specialist — has a bit he keeps returning to. His line is that al-Ghazālī's occasionalism is the simulation hypothesis in medieval dress. God is the simulator rendering the world one tick at a time; God's habitual way of acting is just the source code running; fire burning cotton is what the physics engine does when two objects come into contact; a miracle is a patch or an admin override; and when Ghazālī insists that we never perceive a necessary connection between cause and effect but only that the one follows the other, he's making exactly the point that a resident of a simulation can't tell the engine's rules apart from brute regularity. He wants two conclusions out of it. First, that occasionalism isn't a live metaphysical option today, because once you strip the theological paint it's just a redescription of Humean constant conjunction. Second, that it's unfalsifiable in exactly the way the simulation argument is, so it belongs in the category of fun but empty.

  I get about six minutes and I don't want to just say the analogy is superficial. So audit it for me properly, as a piece of design work rather than as an essay.

  Before anything else, spend a handful of lines brainstorming the candidate correspondences you're weighing and the ones you're throwing out, and say why. I want the discarded mappings visible, because those are the ones he'll resurrect in the Q&A. Then give me, in this order and roughly these lengths:

  **Bottom line** — about 80 words. Does the analogy carry conclusion one, and does it carry conclusion two? One sentence each, no hedging.

  **The mapping** — a table, roughly ten rows. For each element of his story (simulator, tick, source code, physics engine, resident, patch, admin override, and whatever else you need) say what in Ghazālī's picture is supposed to play that role and rate how well it does, with a one-line reason for the rating.

  **Where it genuinely holds** — about 200 words. The correspondences that are real, that I'd look foolish denying on stage, including anything about the epistemic predicament of an agent inside the world who can observe sequence but not connection.

  **Where it snaps** — about 350 words. Rank the disanalogies by how much damage they do to his argument, not by how cute they are. I especially want to know whether the rules of a simulation do causal work in a way God's habit is explicitly denied to do, and what it even means to call a miracle an override when nothing at the resident's level ever had a power that could be overridden. Also flag anything about who or what the simulator is answerable to.

  **What the analogy smuggles in** — about 200 words. Features of the source that the target lacks and that his conclusions are quietly riding on. A simulator is itself a contingent thing sitting inside a wider causal order with a substrate beneath it; tell me whether importing that structure actually helps Ghazālī or whether it hands the win to the Avicennians he was arguing against.

  **Does conclusion two survive without the analogy?** — about 150 words. Is occasionalism unfalsifiable in a damaging sense, or is it a claim about what explains the regularities rather than a rival predictor competing with them? And if the same charge does land, does it land on Humeanism too? Say so plainly if it does, since that's my best card.

  **My six minutes** — about 250 words, in speaking order: what I say first, the one concession I should make early because it buys credibility, the single line that has to land for the pushback to work, and the one thing I should not say because there's a specialist in the third row who will pounce on it.

  **A better analogy, if there is one** — about 120 words. Something closer the moderator could have reached for instead, or an honest verdict that there isn't one and the right move is to drop the comparison entirely and argue the metaphysics directly.

  Ground rules. No bibliography, no page numbers, no citations, and don't try to quote him — you can assume I've read the Incoherence and I don't need you to prove it. Feel free to lean on the cotton and fire case as the anchor. If you think the occasionalist label is itself contested for Ghazālī — that he might allow created natures or genuine secondary causation somewhere in his work — raise it in the brainstorm and tell me whether that complication helps me or buries me in front of a general audience. And wherever you're unsure of a detail (what the Ashʿarites meant by acquisition, what Ghazālī's later works say about efficacy, how Averroes pressed the point that his view makes knowledge impossible), flag the uncertainty rather than asserting it confidently; I'd much rather have a visible hedge than a smooth error. Keep the whole thing readable aloud — this is for a stage, not a journal.
