          *   Clause D (Sincerity): The agent sincerely avows P (rules out lying).

      *   *Testing against Case 2:* Why is she *Not SD*? If she "organized nothing around not finding it out," maybe she isn't *deflecting*, just *hoping*. To make the principle fit the User's verdict, I need to distinguish between *ignoring* (passive) and *avoiding* (active). Case 4 (Lump Lapsed) is SD because she *let it lapse* (active omission). Case 2 is Not SD because she just... didn't look. This is a fragile distinction. I might need to challenge this verdict.

  5.  **Addressing the New Cases:**
