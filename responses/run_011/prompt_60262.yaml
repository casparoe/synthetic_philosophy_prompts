  **Scenario**
  A mountain village shares a single snowmelt stream feeding a 100-acre meadow. Under common management, one large main canal distributes water. Due to favorable surface-area-to-volume ratios, evaporation and seepage losses are 10%. The community harvests 90 units of water worth $90.

  Experts advise privatization to prevent overuse. The land is divided into ten 10-acre parcels. To ensure no externalities (no water crossing boundaries), each owner constructs an independent canal from the source. Each owner is a perfect steward, maintaining their canal flawlessly. However, physics dictates that ten small canals have much higher surface-area-to-volume ratios than one large one. Losses jump to 40%. Each parcel receives 6 units instead of 9. Total harvest falls to 60 units ($60). Everyone is poorer, despite perfect stewardship and zero conflict.

  **(1) The Arithmetic**
  *   **Open Common:** 100 units source → 1 large canal (10% loss) → 90 units delivered. Value: $90.
  *   **Privatized:** 10 owners × 10 units source → 10 small canals (40% loss) → 6 units each. Total 60 units delivered. Value: $60.
  *   **Check:** 90 > 60. Division destroys value via physical inefficiency.

  **(2) The Feature**
  **Indivisibility (Economies of Scale).** The infrastructure required to access the resource functions efficiently only at a large scale.
  *   **Removal:** If water transport scaled linearly (losses remained 10% regardless of canal size), division would yield the same 90 units. The verdict flips; privatization becomes neutral or better (by preventing over-extraction).

  **(3) The Defender's Reply**
  *"With zero transaction costs, owners would contract to share the large canal, splitting maintenance costs while keeping titles."*
  *   **Verdict:** The case **survives** if the privatization mandate requires *physical independence* to guarantee the "no externalities" ground rule. Sharing the canal reintroduces monitoring complexities (who took what?) that the "fence it off" advice sought to eliminate. If the goal is strictly to remove interdependence, the efficiency loss is the price paid.
