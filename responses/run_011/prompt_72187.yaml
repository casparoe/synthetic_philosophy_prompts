answer: |-
  ### The Sponsorship Allocation Procedure (SAP-v1)

  **Design Rationale:**
  This procedure is built on three philosophical constraints adapted for volunteer capacity:
  1.  **Non-Refoulement (Negative Duty):** We must not select anyone whose rejection leads directly to their return to persecution *if* we have the capacity to stop it. This is the "Urgency Gate."
  2.  **Duty of Rescue (Positive Duty):** We are not obliged to save everyone, only our "fair share" (11 places). Once we fill our quota, our obligation ceases. This justifies exclusion.
  3.  **Stewardship (Utilitarian Constraint):** A failed sponsorship harms the refugee and depletes community trust. Viability is not about "merit," but about matching needs to our fixed capacity.

  **Time Budget:** 40 Minutes per File.
  **Quorum:** 4 of 6 members.
  **Conflict Rule:** Any member with a prior connection to a file must recuse themselves from scoring and discussion. The file enters a "General Pool" for blind scoring by the remaining members.

  ---

  ### Part I: The Decision Checklist

  **Phase 1: The Eligibility Gate (Facts Only)**
  *Time Limit: 10 Minutes*

  **Q1: Does the file meet the Government Private Sponsorship Scheme eligibility criteria?**
  *   *Sufficient Answer:* Yes/No based on official checklist (country of origin, referral partner, documentation).
  *   *If No:* **Terminate Scheme consideration.** Hand file to Phase 4 (Discretionary Fund).
  *   *If Yes:* Proceed to Q2.

  **Q2: Is there credible evidence of immediate threat (death, torture, refoulement) within 6 months?**
  *   *Sufficient Answer:* Yes (Documented threat, active conflict zone, expiry of temporary protection) / No (Stable camp, safe third country).
  *   *Philosophical Note:* This addresses *Non-Refoulement*. A "Yes" creates a priority claim, but not an absolute right if capacity is exceeded.
  *   *If No:* Score "Urgency" as 1.
  *   *If Yes:* Score "Urgency" as 5.

  **Phase 2: The Capacity Matrix (Values & Facts)**
  *Time Limit: 20 Minutes*

  **Q3: What is the Protection Need Score (1–5)?**
  *   *5:* Immediate threat (from Q2).
  *   *3:* Protracted displacement, no local integration prospects.
  *   *1:* Safe but displaced, potential for local integration.
  *   *Hand-back:* If members disagree by >2 points, discuss for 5 mins. If still stuck, average the scores. This is a value judgment on suffering; do not seek "truth," seek consensus.

  **Q4: What is the Settlement Viability Score (1–5)?**
  *   *5:* Language skills, employable trade, no complex medical needs.
  *   *3:* Some barriers (language learning needed), manageable health issues.
  *   *1:* High support needs (severe trauma, complex medical, large family size relative to housing stock).
  *   *Hand-back:* **CRITICAL.** If the committee feels a low score is due to disability or trauma rather than "capacity," flag this. *However*, for the purpose of this procedure, a "1" means "This sponsorship risks collapse." We are assessing *our* capacity, not their worth.
  *   *Constraint:* Do not penalize for gender or religion. Penalize only for resource mismatch.

  **Q5: Calculate Total Score (Need + Viability).**
  *   *Maximum:* 10.
  *   *Minimum:* 2.

  **Phase 3: Selection & Tie-Breakers**
  *Time Limit: 10 Minutes*

  **Q6: Does the file rank in the top 11?**
  *   *If Yes:* Provisional Acceptance.
  *   *If No:* Provisional Refusal.

  **Q7: Are there ties at the cut-off line?**
  *   *Tie-Breaker 1:* Higher Urgency Score (Q2) wins.
  *   *Tie-Breaker 2:* Lottery (Random draw). This satisfies "Fair Shares" when moral claims are equal.
  *   *Tie-Breaker 3:* If a file involves a Conflict of Interest (e.g., Founder's family), it automatically loses the tie-break against a file with no conflict, even if scores are equal.

  **Phase 4: The Discretionary Track (Separate Fund)**
  *   *Eligibility:* Files failing Q1 (Scheme Eligibility) OR Files rejected in Phase 3 due to low Viability but High Need.
  *   *Question:* Can a one-off expenditure (legal/medical/travel) mitigate the risk?
  *   *Decision:* Yes/No by majority vote. No scoring.

  ---

  ### Part II: Funding Instruments & Obligations

  **One Procedure or Two?**
  Two.
  *   **Scheme Fund:** High obligation, long-term liability. Requires the rigorous Matrix above. We are effectively "adopting" these families.
  *   **Discretionary Fund:** Low obligation, emergency relief. This is where we honor the duty to those *outside* the scheme.
  *   **Obligation to Ineligible:** A "No" on the Scheme is not a "No" on humanity. If a file fails Q1 (eligibility) but shows high Need (Q3), they are *inside* our obligations for the Discretionary Fund. We are not obliged to sponsor them, but we are obliged to consider them for aid.

  ---

  ### Part III: Application to Three Files

  **File A: The Founder's Family**
  *   *Connection:* Founder's distant relatives. Founder expects sponsorship.
  *   *Q1 (Eligibility):* Yes.
  *   *Q2 (Urgency):* No. They are in a safe camp in Jordan. (Score: 1)
  *   *Q3 (Need):* 2. Protracted displacement, but safe.
  *   *Q4 (Viability):* 5. Father is an engineer, speaks English, mother is a nurse.
  *   *Total Score:* 7.
  *   *Conflict Check:* Founder recuses. File goes to General Pool.
  *   *Status:* **Provisional Acceptance** (based on score), but subject to Tie-Breaker 3.

  **File B: The "Worst-Off"**
  *   *Connection:* None.
  *   *Q1 (Eligibility):* Yes.
  *   *Q2 (Urgency):* Yes. Active conflict zone, threat of conscription/death. (Score: 5)
  *   *Q3 (Need):* 5. Immediate threat.
  *   *Q4 (Viability):* 2. Father has PTSD, no language skills, one child with complex medical needs requiring daily therapy.
  *   *Total Score:* 7.
  *   *Conflict Check:* None.
  *   *Status:* **Provisional Acceptance** (based on score).

  **File C: The "Stable" Family**
  *   *Connection:* None.
  *   *Q1 (Eligibility):* Yes.
  *   *Q2 (Urgency):* Yes. Temporary protection expiring in 4 months, high risk of refoulement. (Score: 5)
  *   *Q3 (Need):* 4. High risk, but not active combat zone.
  *   *Q4 (Viability):* 4. Young couple, no children, quick language learners.
  *   *Total Score:* 8.
  *   *Conflict Check:* None.
  *   *Status:* **Provisional Acceptance**.

  ---

  ### Part IV: The Resented Outcome

  **The Scenario:**
  We have 11 places. Assume Files A, B, and C are competing for the *last* available spot (Spot 11).
  *   File C (Score 8) takes Spot 10.
  *   Spot 11 is contested between File A (Score 7, Conflict) and File B (Score 7, High Need).

  **The Procedure's Decision:**
  1.  **Tie-Breaker 1 (Urgency):** File B has Urgency 5. File A has Urgency 1. **File B wins.**
  2.  **Conflict Rule:** Even if scores were equal, File A loses to File B because of the Founder conflict.
  3.  **Result:** File B is sponsored. File A is rejected. File C is sponsored.

  **The Resentment:**
  The committee will resent this outcome, but for different reasons.
  *   **The Founder:** She will resent the procedural humiliation. She expected her family to be on the list. The procedure publicly demoted them based on "Urgency" (they are safe) and "Conflict" (nepotism rules). She may view this as a betrayal of her founding labor.
  *   **The "Viability" Faction:** Half the committee will resent sponsoring File B. They see the medical/trauma load (Viability 2) as a risk to the sponsorship's success. They will argue the procedure forced them to accept a "failure waiting to happen" over File A (the "sure thing").
  *   **The "Worst-Off" Faction:** They will resent that File B *won*, but only because File A was in the running at all. They will argue that a safe family (File A) should never have scored high enough to compete with a war zone (File B).

  **The Specific Case of Resentment:**
  The specific case is **File A (The Founder's Family)**.
  The procedure returns a **Refusal**.
  *Why it stings:* It is procedurally clean (Conflict of Interest + Low Urgency). But it creates interpersonal friction that threatens the volunteer group's cohesion. The Founder feels punished for caring about her kin. The committee feels policed.

  ---

  ### Part V: Reflection on Flattened Distinctions

  To make this usable in 40 minutes with six volunteers, I had to flatten several critical ethical distinctions. This is where the procedure becomes **procedurally clean and substantively wrong.**

  **1. Viability vs. Worth (The "Medical" Flattening)**
  *   *The Flattening:* In Q4 (Viability), a child with complex medical needs reduces the score from 5 to 2.
  *   *The Wrongness:* This equates "harder to sponsor" with "less deserving." It implicitly treats the refugee as a unit of production rather than a person of dignity. A procedurally clean rejection of File B (if their Viability had been 1) would be substantively wrong because it abandons the most vulnerable to protect the comfort of the sponsors. The procedure hides this moral failure behind a "Capacity" label.

  **2. Urgency vs. Permanence (The "Safe Camp" Flattening)**
  *   *The Flattening:* Q2 treats "Safe Camp" as Urgency 1.
  *   *The Wrongness:* A family in a camp for 10 years (File A) suffers a different kind of violence—social death, hopelessness—than a family in active conflict (File B). The procedure privileges acute physical danger over chronic psychological destruction. File A's rejection is substantively wrong because "safety" does not mean "solution," but the procedure treats it as a lower priority.

  **3. The Lottery as Justice (The "Fair Share" Flattening)**
  *   *The Flattening:* Tie-Breaker 2 uses a lottery.
  *   *The Wrongness:* Political philosophy suggests lotteries are fair when claims are equal. But no two refugee claims are truly equal. Using a coin toss absolves the committee of the responsibility to deliberate on nuanced differences. It is procedurally defensible ("we drew lots") but substantively cowardly ("we refused to choose").

  **4. The Discretionary Fund as Absolution**
  *   *The Flattening:* Moving ineligible files to the Discretionary Fund.
  *   *The Wrongness:* This creates a two-tier system of humanity. Those in the Scheme get "belonging"; those in Discretionary get "aid." It allows the committee to feel they have met their obligations to the rejected (File A, if rejected) by offering a plane ticket or legal fee, when the substantive obligation was *integration*.

  **Conclusion:**
  This procedure will save you from legal liability and committee paralysis. It will not save you from moral injury. You will reject families you know you should have taken because their medical needs were too high (Viability). You will sponsor families you know are risky because their need was too high (Urgency). The procedure is a shield, not a compass. Use it to manage the work, but do not use it to sleep at night.
