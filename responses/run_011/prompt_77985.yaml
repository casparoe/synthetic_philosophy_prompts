prompt: |-
  I serve on a county bird records committee. As well as vetting sightings, we occasionally comment on proposed changes to the regional checklist, and one long-standing member has a stock formula for dismissing any proposed split: if they can interbreed, they are the same species. Last month he deployed it against a submission arguing that a Palearctic leaf-warbler complex should be divided in two. The proposers cited a narrow hybrid zone, marked and consistent differences in song, and genetic divergence implying long separation; he replied that hybrids are still produced where the two forms meet, that the split was therefore fanciful, and the submission was withdrawn without further discussion.

  I want to answer properly rather than intuitively, and my suspicion is that his one-liner is doing several distinct jobs at once, only some of them defensible. Could you set out, as an explicit menu, the different precise claims it could be making? I would like you to distinguish at least the following dimensions:

  - whether it is offered as a claim about what the word "species" means, or as an empirical criterion for deciding which populations to group together;
  - what "can interbreed" is supposed to amount to — does interbreed in the wild, would interbreed if brought into contact, produces offspring at all, or produces fertile offspring that go on to reproduce;
  - whether the intended conditional runs in one direction only or is meant as a biconditional, noting that what he actually relies on seems to be the contrapositive (if they cannot interbreed, they are different species), and that the two directions fare very differently;
  - whether compatibility of this kind is even transitive, and what the ring-complex cases do to any reading that treats "can interbreed with" as picking out an equivalence class;
  - whether the claim is tacitly restricted to sexually reproducing organisms, and what, if anything, it then says about the remainder of the tree of life or about fossil material.

  For each reading, tell me whether it is trivially true by stipulation, substantive and defensible, or false, and say briefly why. Then tell me which reading, if any, would actually license his conclusion from the evidence described — a narrow hybrid zone, song differences, deep genetic divergence — and what such a zone does and does not show under each. Please also identify the auxiliary premises about rates of gene flow that the slogan would need before it could bear any weight in a checklist decision, and note where it quietly assumes there is a single correct answer to the question, and how the assessment changes if species are treated as individual historical entities rather than as classes.

  A list I could circulate before the next meeting would be ideal. No references or bibliography, please; I will supply my own. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a county bird records committee.
      *   **Problem:** A colleague uses a simplistic slogan ("if they can interbreed, they are the same species") to dismiss taxonomic splits, specifically regarding a Palearctic leaf-warbler complex with a narrow hybrid zone, song differences, and genetic divergence.
      *   **Goal:** Create an explicit "menu" of interpretations of this slogan to critique it properly at the next meeting.
      *   **Required Dimensions:**
          1.  Definition vs. Empirical Criterion.
          2.  Meaning of "can interbreed" (wild vs. captive, F1 vs. fertile, etc.).
          3.  Logical Direction (Conditional vs. Biconditional vs. Contrapositive).
          4.  Transitivity (Ring species problem).
          5.  Scope (Sexual vs. Asexual/Fossils).
      *   **Evaluation:** For each reading, classify as Trivial/Stipulative, Substantive/Defensible, or False. Explain why.
      *   **Application:** Determine which reading licenses the colleague's conclusion given the specific evidence (narrow hybrid zone, song, genetics).
      *   **Auxiliary Premises:** Identify needed assumptions about gene flow.
      *   **Ontological Status:** Address the assumption of a single correct answer vs. species as individuals.
      *   **Format:** A list suitable for circulation. British English. No references/bibliography.

  2.  **Deconstruct the Slogan:** "If they can interbreed, they are the same species."

  3.  **Drafting the Menu (Dimension by Dimension):**

      *   *Dimension 1: Definition vs. Criterion.*
          *   Reading A: It's the *definition* (Biological Species Concept - BSC).
          *   Reading B: It's a *rule of thumb* (Empirical proxy).
          *   *Evaluation:* As a definition, it's stipulative but limited. As a rule of thumb, it's often useful but fails in edge cases.

      *   *Dimension 2: Meaning of "Interbreed".*
          *   Reading C: Potential interbreeding (captivity).
          *   Reading D: Actual interbreeding in the wild.
          *   Reading E: Production of any offspring.
          *   Reading F: Production of fertile offspring (gene flow).
          *   *Evaluation:* Captivity is too loose. Wild is better. Fertile offspring is the standard BSC requirement.

      *   *Dimension 3: Logical Direction.*
          *   Reading G: Interbreed $\rightarrow$ Same Species.
          *   Reading H: Same Species $\rightarrow$ Interbreed.
          *   Reading I: Biconditional (Same Species $\leftrightarrow$ Interbreed).
          *   Reading J: Contrapositive (Not Interbreed $\rightarrow$ Different Species).
          *   *Evaluation:* The colleague uses "Interbreed $\rightarrow$ Same Species". This is the weak direction. The strong direction is usually "Different Species $\rightarrow$ Reproductive Isolation".

      *   *Dimension 4: Transitivity.*
          *   Reading K: Equivalence relation (Transitive).
          *   Reading L: Non-transitive (Ring species).
          *   *Evaluation:* If transitive, ring species break it. If non-transitive, "species" becomes messy.

      *   *Dimension 5: Scope.*
          *   Reading M: Sexual organisms only.
          *   Reading N: Universal.
          *   *Evaluation:* Universal is false (bacteria, fossils). Sexual only is defensible but limits scope.

  4.  **Synthesizing and Evaluating Specific Readings:**
      *   I need to combine these dimensions into coherent "Readings" to evaluate as True/False/Trivial.
      *   *Reading 1 (Strict BSC Definition):* Definition of species for sexual animals. Stipulative.
      *   *Reading 2 (Empirical Proxy - Wild/Fertile):* Substantive. Often works, but hybrid zones complicate it.
      *   *Reading 3 (Potential/Captive):* False/Too broad. Lions and tigers.
      *   *Reading 4 (The Contrapositive):* "If they *can't* interbreed, they are different." This is the robust part of BSC. The colleague is using the inverse.
      *   *Reading 5 (Transitive/Equivalence):* False due to ring species.

  5.  **Addressing the Specific Case (Leaf-Warbler):**
      *   Evidence: Narrow hybrid zone, song differences, deep genetics.
      *   Colleague's logic: Hybrids exist $\rightarrow$ Interbreed $\rightarrow$ Same Species.
      *   Critique: Narrow hybrid zone suggests *limited* gene flow. Song differences suggest pre-mating isolation. Genetics suggest long separation.
      *   Does the slogan license the conclusion? Only under a very loose reading (any hybridisation = same species). Under a rigorous BSC reading (significant gene flow required), it does not.

  6.  **Auxiliary Premises & Ontology:**
      *   *Gene Flow:* Need to define how much gene flow prevents speciation. A narrow zone implies selection against hybrids or limited contact.
      *   *Ontology:* The slogan assumes species are classes defined by a property (interbreeding). The "Species as Individuals" view sees them as lineages. Under the lineage view, hybridisation doesn't necessarily merge the lineages.

  7.  **Refining the Output (British English & Tone):**
      *   Use "colour", "programme", "centre", etc.
      *   Tone: Professional, analytical, suitable for a committee paper.
      *   Structure: Clear headings, bullet points.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between definition and criterion? Yes.
      *   *Check:* Did I cover the logical direction? Yes, this is crucial. The colleague is committing a logical error (affirming the consequent relative to isolation, or simply using the weak direction of the BSC).
      *   *Check:* Did I address the ring species issue? Yes, under transitivity.
      *   *Check:* Did I avoid references? Yes.
      *   *Check:* Is the distinction between "can interbreed" (potential) and "do interbreed" (actual) clear? Yes.
      *   *Check:* Did I address the "Species as Individuals" point? Yes, this is a key philosophical distinction.

  9.  **Final Polish:** Ensure the distinction between the *Biological Species Concept* (BSC) and the *colleague's specific formulation* is clear. The BSC is usually about *reproductive isolation* defining separate species, not *interbreeding* defining single species (though they are related). The colleague's formulation is the "lumper's" version of the BSC.

      *   *Key Insight:* The colleague's slogan is logically weak because the BSC is primarily defined by *isolation* (negative), not *connection* (positive). Two distinct species *can* sometimes hybridise without collapsing into one. The slogan ignores the *stability* of the hybrid zone.

      *   *Structure Plan:*
          1.  Introduction.
          2.  The Menu of Readings (categorised by the requested dimensions).
          3.  Application to the Leaf-Warbler Case.
          4.  Auxiliary Premises (Gene Flow).
          5.  Ontological Considerations (Classes vs. Individuals).
          6.  Conclusion/Recommendation.

      *(Self-Correction on "No References"):* Ensure I don't cite Mayr or de Queiroz by name, just describe the concepts.

      *(Self-Correction on British English):* Ensure spelling (vetting, programme, behaviour, etc.) and phrasing (whilst, amongst - though keep it modern professional).

      *(Final check on the logical direction):* The colleague says "If Interbreed -> Same Species". The standard BSC is "If Same Species -> Interbreed" (mostly) and "If No Interbreed -> Different Species". The colleague's direction is the one that fails with hybridising distinct species. I must highlight this.

  10. **Drafting the Content:** (Mental or scratchpad)
      *   *Reading 1 (Stipulative Definition):* True by definition but unhelpful if definition is flawed.
      *   *Reading 2 (Empirical Criterion - Wild/Fertile):* Substantive. False in cases of stable hybrid zones.
      *   *Reading 3 (Potential/Captive):* False (Ligers).
      *   *Reading 4 (Logical Direction):* The colleague uses $P \rightarrow Q$. Science usually relies on $\neg Q \rightarrow \neg P$ (Isolation implies distinctness).
      *   *Reading 5 (Transitivity):* False (Ring species).
      *   *Reading 6 (Scope):* False for asexuals.

      *   *Application:* Narrow hybrid zone = limited gene flow. Song = pre-zygotic barrier. Genetics = independent evolution. Slogan fails here because it ignores *extent* of interbreeding.

      *   *Ontology:* Species as lineages allows for some introgression without merging lineages.

      *   *Conclusion:* The slogan is an oversimplification that hinders accurate taxonomy.

  11. **Final Review against constraints:**
      *   British English? Yes.
