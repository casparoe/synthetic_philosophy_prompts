  2.  **Analyze the Debate Structure (Task 1):**

      *   *What kind of disagreement is this?* It's not just verbal, though terms like "art" vs. "artifact" matter. It's deeper.
      *   *Evidence Standards:* Ethnographic analogy is huge here. Some use 19th/20th-century hunter-gatherers (risk of anachronism), others use universalist psychology (risk of projection).
      *   *Data Selection:* Breakage is key. Is it ritual killing? Accidental? Discard? Each side cherry-picks.
      *   *Background Values/Agents:* This is the big one. Who gets agency? Men (pornography/gaze)? Women (self-representation/maternity)? Abstract groups (identity tokens)? The debate is often a proxy for modern anxieties about gender, religion, and cognition.
      *   *Bedrock Intuition:* The "intentional stance." We assume they *meant* something specific.
      *   *Diagnosis:* It's a *underdetermination* problem exacerbated by *motivated reasoning* regarding agency. The evidence is compatible with too many narratives because the narratives are driven by modern theoretical commitments (feminist, functionalist, cognitive, etc.) rather than the data itself.

  3.  **Assess the Triple-Explanans Test (Task 2):**

      *   *User's Test:* Must explain (1) Stereotypy, (2) Variability, (3) Fragmentation/Deposition.
      *   *Is it too demanding?* For deep time archaeology, yes, often. But is it *too* demanding? Maybe not for this specific corpus because the corpus is defined by these traits.
      *   *Does it separate readings?*
          *   (i) Fertility Cult: Explains stereotypy (ideal form), maybe deposition (offering), struggles with variability (why change the goddess?) and domestic context (why not shrines?).
          *   (ii) Male Gaze: Explains stereotypy (sexual features), struggles with deposition (why break/discard valuable porn?) and variability (why clothes?).
          *   (iii) Dressed Women/Textiles: Explains variability (fashion/status), struggles with stereotypy (why ignore faces?) and deposition.
          *   (iv) Self-representation: Explains stereotypy (viewpoint), maybe variability, struggles with deposition (why break self?).
