      *   *Critique of User's Hypothesis:* The user is right about the "single tradition" error. The "functional teleology" is also suspect. But the triple-test is a good tool for *weeding out* weak theories, even if it doesn't crown a winner.
      *   *Recommendation:* Shift from "What are they?" to "What did they *do* in social networks?" (Practice theory).

