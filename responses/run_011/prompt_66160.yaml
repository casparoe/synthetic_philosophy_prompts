          *   (vi) Deflationary: Explains everything by denying the premise. Hard to falsify, but intellectually honest.
      *   *Verdict:* It's a good heuristic, but risks forcing a unified theory on a heterogeneous corpus. It discriminates well, but might condemn *all* specific functional theories if the "single tradition" premise is false.

  4.  **Evaluate the Question "What were they for?" (Task 3):**

      *   *Is it well-posed?* No. It assumes *telos* (purpose) and *singularity* (one function).
      *   *Better Questions:* "How did they circulate?" "What practices involved them?" "What cognitive capacities do they reveal?"
      *   *Talking Past:* Even with perfect evidence, the "meaning" vs. "function" divide remains. Finding residue (ochre?) tells you they were painted, not *why*. Finding them in a hearth tells you they were burned, not if it was ritual or fuel. The *interpretive leap* remains.

  5.  **Define Progress (Task 4):**

      *   *Move the debate:* Evidence that links specific objects to specific actions *distinctly*. E.g., Residue showing they were hung on skin (clothing) vs. handled (tokens). Spatial analysis showing consistent placement (shrines vs. random).
      *   *Add a reading:* More stylistic analysis, more philosophical interpretation without new physical data.
      *   *Distinction:* Progress = narrowing the *range of plausible behaviors*. Adding a reading = narrowing the *range of plausible meanings* (which is infinite).
      *   *Key:* We need behavioral constraints, not semantic ones.

  6.  **Compare with Birka Grave (Task 5):**

      *   *The Case:* DNA proved female. Debate shifted from "Is it a woman?" to "Can a woman be a warrior?" (Social role vs. Biological sex).
