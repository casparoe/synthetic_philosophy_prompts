      *   *Application to Figurines:* DNA/Residue can tell us *what* they touched or *who* made them (maybe). It cannot tell us *what they meant* to the maker. The "meaning" gap is wider than the "sex" gap.
      *   *Verdict:* Progress is possible on *production/use*, but "meaning" will remain contested.

  7.  **Final Verdict & Honesty (Task 6):**

      *   *Will it resolve?* No. Not in the sense of "This is the true meaning."
      *   *Why?* It's a limit on reconstructing *belief* from *objects* without text. It's the "problem of other minds" scaled to 20,000 years.
