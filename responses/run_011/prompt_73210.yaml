answer: |-
  Right. You are asking me to map a deontological ontology onto a consequentialist topology. The short answer is that your framework is built to solve the very problem Anscombe claims is a category error. She is not proposing a different solution to the optimisation problem; she is denying the legitimacy of the optimisation problem itself in certain domains.

  Here is the translation, claim by claim, followed by the residue report.

  ### 1. Claim-by-Claim Translation

  **(i) The Absoluteness Constraint**
  *Anscombe:* Choosing to kill the innocent is never right. The line is not a weight.
  *Translation:* This must be modelled as a **hard constraint on the feasible set** $\mathcal{A}$, not as a term in the objective function $U(\cdot)$.
  *Technical Execution:* Let $\mathcal{A}_{raw}$ be the set of physically possible acts. Let $K \subset \mathcal{A}_{raw}$ be the subset of acts described as "killing the innocent". The agent's feasible set is $\mathcal{A} = \mathcal{A}_{raw} \setminus K$. The choice function $C(\mathcal{A})$ is defined only over $\mathcal{A}$.
  *Distortion:* **High.** In your framework, a constraint on $\mathcal{A}$ is behaviourally indistinguishable from a lexicographic preference over $\mathcal{A}_{raw}$ where $U(\text{kill}) = -\infty$. If you model it as $-\infty$ utility, you have smuggled in commensurability (it is now a 'cost', albeit an infinite one). If you model it as a removal from $\mathcal{A}$, you render the prohibition exogenous (like gravity) rather than normative (a rule the agent imposes on herself). Revealed preference theory cannot distinguish "I did not choose $a$ because it was impossible" from "I did not choose $a$ because it was forbidden." Anscombe requires the latter to be a voluntary submission to a rule, which your framework collapses into a taste parameter.

  **(ii) Intentionality and Act Individuation**
  *Anscombe:* Deaths were intended means, not foreseen side-effects. The description matters.
  *Translation:* Your framework individuates acts by their state-contingent outcome maps $f: S \to X$. Anscombe individuates acts by their intentional description $d: S \to D$.
  *Technical Execution:* You must expand the consequence space $X$ to include "action properties" (Sen's 'comprehensive outcomes'). So $x$ is not just "city destroyed, war ended", but "city destroyed *by intentional targeting of civilians*".
  *Distortion:* **Fatal.** Even with comprehensive outcomes, your framework evaluates the *package* $(outcome, action\_property)$. Anscombe evaluates the *description* prior to the outcome. In your model, if two intentional descriptions lead to the same comprehensive outcome vector, they are equivalent. For Anscombe, the intentional structure *constitutes* the act. Your framework treats intention as just another coordinate in the consequence vector; she treats it as the ontological ground of the act. There is no slot for "intention" that isn't ultimately cashed out as a consequence to be weighed.

  **(iii) Complicity (The Degree)**
  *Anscombe:* Conferring the degree is participation in the murder.
  *Translation:* This is a **preference over the choice function itself**, or an **expressive utility** term.
  *Technical Execution:* The act is $a_{degree}$. The outcome $x$ (Truman is happy, Oxford looks generous) is unchanged regarding the bombing. To model this, $U(a_{degree}, x)$ must depend on the *relation* between the agent and the past act of Truman.
  *Distortion:* **Moderate.** You can model this as "social signalling" or "internalised norm compliance." However, Anscombe's claim is metaphysical: the act of honouring *changes the moral status* of the agent relative to the past event. Your framework can only capture this as a change in the agent's current utility flow. It misses the "participation" aspect, which implies a causal/moral link that your framework explicitly severs (sunk costs are sunk).

  **(iv) Consequentialism as Rationalisation**
  *Anscombe:* Appeal to consequences is a symptom of defencelessness, not a decision procedure.
  *Translation:* This attacks the **stability of the preference ordering** $\succeq$.
  *Technical Execution:* This implies $\succeq$ is endogenous to the choice problem. The agent chooses $a$, then constructs $\succeq$ such that $a \succeq a'$. This is **motivated reasoning** or **preference construction**.
  *Distortion:* **None (because it breaks the model).** Your framework assumes $\succeq$ exists *prior* to choice (completeness/transitivity). Anscombe is claiming that for consequentialists, $\succeq$ is generated *post-hoc* to justify $a$. This is not a parameter in your model; it is a rejection of the rationality axioms as descriptive of moral reasoning. You cannot model "rationalisation" without modelling a deviation from rationality, which your toolkit treats as error, not structure.

  **(v) Doing vs. Allowing**
  *Anscombe:* Killing (doing) $\neq$ Letting die (allowing). Invasion deaths do not offset bombing deaths.
  *Translation:* **Reference-dependent utility** or **act-dependent utility**.
  *Technical Execution:* $U(x | \text{bomb}) \neq U(x | \text{invade})$. The status quo matters. The operator is not linear.
  *Distortion:* **Low.** This translates cleanly into behavioural econ (loss aversion, omission bias). However, reducing it to a 'bias' or 'preference parameter' misses the normative force. For you, it's a quirk of human psychology; for her, it's a structural feature of moral reality.

  ---

  ### 2. The Residue Report

  You asked specifically about the "cheat" of constraints vs. preferences, the individuation problem, the rendering of absoluteness, the rationalisation point, and the complicity claim. Here is the verdict on what is lost.

  **A. Constraints vs. Objective Function (The "Cheat")**
  You are right to suspect the move cheats.
  *   **If you put it in the feasible set ($\mathcal{A}$):** You make the prohibition look like physical impossibility. But Anscombe's agent *can* physically push the button. She *chooses* not to. By removing it from $\mathcal{A}$, you remove the agency required for the moral act.
  *   **If you put it in the objective function ($U$):** You make it a trade-off. Even lexicographic preferences imply that if the 'lower' priority good becomes infinite, it might outweigh the 'higher' priority. Anscombe denies the scale exists.
  *   **Verdict:** This is a **genuine expressive limitation**. Your framework is built on the premise that all values are ultimately comparable (completeness axiom). Anscombe's position relies on incommensurability. You cannot model a "rule" that is not ultimately a "preference" without breaking the representation theorem.

  **B. Act Individuation (The Structural Blindness)**
  *   **The Problem:** Your acts are $f: S \to X$. Her acts are "intentional actions under description."
  *   **Sen's Move:** Sen's distinction between 'culmination outcomes' and 'comprehensive outcomes' gets you halfway. You can write $x = (\text{peace}, \text{civilians\_dead}, \text{intentionally\_killed})$.
  *   **The Failure:** In your framework, the agent still *maximises* over these comprehensive outcomes. She might accept "intentionally killed" if "peace" is valuable enough. Anscombe says the description "intentionally killed" vetoes the calculation entirely.
  *   **Verdict:** **Structural Blindness.** The framework is consequentialist by definition. It evaluates acts by what they *bring about*. Anscombe evaluates acts by what they *are*. You can paste "intention" onto the consequence vector, but you cannot make it prior to the evaluation without ceasing to do decision theory.

  **C. Rendering Absoluteness**
  *   **Lexicographic:** Smuggles in a hierarchy of goods. Implies trade-offs at the margin of the higher order.
  *   **Infinite Disutility:** Smuggles in commensurability. Implies that if the alternative were $-\infty - \epsilon$, the act might be permissible.
  *   **Hard Constraint:** Smuggles in exogeneity. Removes the moral will.
  *   **Verdict:** **No expression.** There is no mathematical object in standard choice theory that represents "categorical imperative." The closest is a constraint, but as noted, that erases the moral choice.

  **D. Consequentialism as Rationalisation**
  *   **Econ Equivalent:** Endogenous preference formation, cognitive dissonance reduction.
  *   **The Gap:** In econ, this is a deviation from the rational model. For Anscombe, this is the *standard operating procedure* of modern moral philosophy. She is not saying consequentialists are irrational; she is saying their rationality is morally corrupt.
  *   **Verdict:** **Inexpressible.** Your framework treats the preference ordering as the ground truth of the agent's welfare. Anscombe treats the preference ordering (when consequentialist) as a fiction generated to excuse the act. You model the *logic* of choice; she models the *pathology* of the justification.

  **E. The Complicity Claim**
  *   **The Problem:** Conferring the degree changes no physical outcome regarding the war.
  *   **Econ Equivalent:** Expressive utility. I vote because I like being a voter, not because I swing the election.
  *   **The Gap:** Expressive utility is still about *my* utility. Anscombe's claim is about *ontological participation*. She argues the act of honouring makes the University a co-author of the crime.
  *   **Verdict:** **Distorted.** You can model the *motivation* (I don't want to feel complicit), but you cannot model the *fact* of complicity within the choice architecture, because the architecture only tracks causal consequences.

  ---

  ### 3. Final Verdict: Ranked Residue

  You asked to rank the residue: which parts are limitations of your vocabulary, and which are evidence that her position is doing something else.

  **1. Evidence she is doing something else (The Ontological Gap)**
  *   **Rank:** Highest.
  *   **Reason:** Anscombe is not doing decision theory. She is doing **moral grammar**. When she says "killing the innocent is never right," she is not specifying a parameter in a utility function; she is defining the concept of 'right action'. Your framework assumes the concept of 'right action' is 'maximisation of the good'. She denies this definition. You cannot translate her position because you are trying to translate a definition of terms into a calculation using those terms. The friction isn't a lack of variables; it's a disagreement on what 'choice' is.

  **2. Genuine Expressive Limitation (Incommensurability)**
  *   **Rank:** High.
  *   **Reason:** Your framework requires completeness ($\forall a, b: a \succeq b \text{ or } b \succeq a$). Anscombe's absolutism implies that for some pairs $(a_{kill}, a_{let\_die})$, the relation is undefined not because of ignorance, but because they belong to different categories. Your toolbox has no operator for "incomparable." You force comparability by assumption.

  **3. Structural Blindness (Intentionality)**
  *   **Rank:** Medium-High.
  *   **Reason:** You can patch this with comprehensive outcomes (Sen), but it remains a patch. The framework is inherently forward-looking (consequences). Anscombe's ethics is inherently backward-looking (intentions/descriptions). You can simulate the past-looking element as a current 'taste', but you cannot make it constitutive of the act without breaking the $f: S \to X$ mapping.

  **4. Distortion (Complicity & Rationalisation)**
  *   **Rank:** Medium.
  *   **Reason:** These can be modelled as 'psychological costs' or 'endogenous preferences'. The distortion is that you reduce moral truths to psychological states. But technically, the maths can hold the shape of the argument, even if it empties the content.

  **Summary for your Seminar:**
  When you nod in seminar, you are nodding at a critique of the **axioms of rationality** themselves. Anscombe is arguing that the **Completeness** and **Continuity** axioms are morally illicit when applied to certain classes of action. She is not offering a different utility function; she is arguing that the domain of the function excludes certain acts entirely, not because they are 'costly', but because they are not 'choices' in the moral sense—they are violations.

  Your framework cannot represent this without treating the moral law as either a physical constraint (removing agency) or a preference (removing authority). You are trying to optimise a system she claims should not be optimised. The residue isn't noise; it's the signal.
