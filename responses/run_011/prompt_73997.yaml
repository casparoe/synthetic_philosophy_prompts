      **Resolution on Pedestal, Plaque, and Conservation**
      The conservation clock runs regardless of our deliberation on meaning. To prevent the loss of the bronze through chloride corrosion, we must execute the $180,000 conservation contract by September, ensuring action precedes potential state legislation barring alteration of monuments over fifty years old. However, physical preservation cannot imply historical endorsement.

      Regarding the pedestal: We must not recast the original plaque. To do so would violate the principle of **Voice**; the original text spoke a partial truth that no neutral panel can now reclaim. Instead, we commission a new plaque mounted adjacent to the original outline. This new text must list Hallam's benefactions and explicitly detail the 1899 strike deaths. Regarding the ghost outline and drilled holes on the granite: these remain. This applies the principle of **Accretion**. The damage is now part of the object's history, owned jointly by the city (which failed to protect it) and the residents (who renew the painted date). Removing it would erase the community's intervention. Finally, we do not melt the statue. Under **Reversibility**, destruction is impermissible; future generations must retain the capacity to reinterpret the bronze itself, even if we contextualize it heavily today. I propose a fourth concept, **Stewardship**, to guide the Trust issue: our duty to preserve public assets includes truthful interpretation, even if the Hallam Trust challenges the deed. We proceed with conservation and contextualization, accepting the legal risk.

      **Street Renaming**
      The petition to rename Foundry Street must be heard in a separate motion. This is not merely procedural; it is categorical. A statue is a declarative statement intended for contemplation; a street name is a utilitarian marker embedded in daily navigation and property law. Conflating the two suggests that removing a name erases history, whereas adding context to a statue preserves history while correcting the record. Furthermore, the criteria for street naming (navigation clarity, residential consent) differ from monument criteria (historical accuracy, artistic merit). Severing them allows the Commission to address the statue's moral weight without being held hostage by the logistical burdens of a street rename, ensuring neither decision compromises the other.

      **Rule for Contested Inventory**
      For the nine other contested monuments, I propose the "Contextual Integrity Rule": *If a monument's existing inscription omits significant historical events that cause ongoing civic harm, physical restoration must be conditioned upon the addition of contextual information.* This rule allows a commissioner who disagrees with my reading of Hallam to apply it elsewhere. It does not mandate removal (preserving **Reversibility**) nor does it mandate agreement on the harm (leaving that to evidence), but it establishes that physical care is not morally neutral. A commissioner could vote against Hallam's contextualization but use this rule to demand context for a Confederate statue, maintaining consistency without endorsing my specific conclusion.

      **Counter-Argument and Loss**
      The strongest consideration against this plan comes from the perspective of Artistic Integrity and Fiduciary Duty. A dissenting commissioner would argue that Adelaide Frost's work is a unified artistic statement; adding plaques or leaving graffiti outlines vandalizes the aesthetic whole. Moreover, the Hallam Trust deed ties scholarships to the monument's preservation. Altering the presentation may breach the deed, causing the Trust to withdraw funding. By proceeding, we risk losing the scholarship that currently supports two students annually.

      My recommendation is willing to lose that money. We cannot hold civic history hostage to private endowment conditions that require silence on bloodshed. If the Trust withdraws, the city must fund the scholarships independently to honor the students, not the benefactor's silence. We save the bronze, tell the whole story, and accept the cost.

