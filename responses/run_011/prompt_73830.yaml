answer: |-
  Here is the straight answer: **Your intuition is not Aristotelian.**

  Aristotle would likely condemn both the sneaker flipper and the payday lender with equal vigor. Your distinction relies on a modern concept of *market power* and *necessity* that Aristotle's framework simply does not possess. He judges transactions based on the **telos** (purpose) of the activity, not the **power dynamics** between the parties.

  Here is the breakdown of your principle, how it clashes with Aristotle, and what it implies for the kidney case.

  ### 1. What Principle Fits Your Verdicts?
  Your tentative rule ("fine if risk/added value, not fine if bottleneck") is close, but your specific verdicts reveal a deeper principle: **The Vulnerability Constraint.**

  Your intuition distinguishes between **preference** and **necessity**.
  *   **Sneakers:** The buyer *wants* them. They are a luxury. The transaction is between equals regarding status; the buyer can walk away without harm. The risk you mention is just the justification for the profit, but the moral core is that no one's survival is leveraged.
  *   **Payday/Rent/Plumber:** The buyer *needs* these things (liquidity to eat, shelter, sanitation). The seller knows the buyer cannot walk away. The profit comes from the buyer's lack of alternatives, not from value creation.

  **Your Principle:** *Wealth acquisition is legitimate only if it does not exploit the inelastic demand of basic human needs.*

  ### 2. How Aristotle Overrules Your List
  Aristotle divides wealth-getting into *oikonomia* (household management, natural, limited) and *chrematistike* (money-making, unnatural, unlimited).

  *   **Farmer:** **Fine.** This is natural wealth-getting. He produces use-value (food) for the household/city.
  *   **Sneaker Flipper:** **Not Fine.** Aristotle does not care about "risk." He cares that this is trade for profit. The sneakers are not being used; they are being flipped to generate more money. This is *chrematistike*. It corrupts the soul by making profit the end rather than the good life.
  *   **Plasma Donor:** **Not Fine (probably).** For Aristotle, the body is part of the *oikos*, not a commodity. Selling parts of oneself to generate cash is treating the self as a means to wealth, not an end for virtue.
  *   **Payday Lender:** **Not Fine.** But for a different reason than you. You hate the bottleneck; Aristotle hates **usury**. He calls interest "money breeding money." It is the most unnatural form of wealth-getting because money was meant to be a medium of exchange, not a reproductive organism.
  *   **Landlord (Absentee):** **Not Fine.** Rent is often viewed by Aristotle as a form of usury or unnatural profit if detached from the management of the estate.
  *   **Plumber (Emergency):** **Not Fine.** This violates reciprocity. Money is supposed to represent need; charging triple for an emergency distorts that measure.
  *   **Short Seller:** **Not Fine.** Destructive profit.
  *   **Index Fund:** **Not Fine.** Pure accumulation of money for money's sake.

  **The Clash:** You forgive the sneaker flipper because he isn't hurting anyone's survival. Aristotle condemns him because he is participating in the unlimited accumulation of wealth, which distracts from virtue. You condemn the payday lender because of structural coercion. Aristotle condemns him because interest is unnatural. **You are looking at power; Aristotle is looking at purpose.**

  ### 3. The Kidney Case
  Apply **The Vulnerability Constraint**:
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** While the buyer needs the kidney to live, the seller is almost certainly selling due to financial desperation (a vulnerability). It turns biological integrity into a commodity. It exploits the seller's poverty to solve the buyer's medical necessity. It creates a market where the poor become spare parts for the rich.

  Apply **Aristotle**:
  *   **Verdict:** **Hard No.**
  *   **Reasoning:** The body is not "wealth." It is the instrument of the soul's activity. To sell it is to destroy the vessel of the good life. It is the ultimate subordination of the human *telos* to *chrematistike*.

  ### 4. Does Aristotle Have Resources for the "Bottleneck"?
  **No.** This is the hard truth.

  Aristotle's ethics are **agent-centered**, not **structure-centered**.
  *   He asks: "Is this man acting virtuously?"
  *   He does not ask: "Is this market structure coercive?"

  To Aristotle, the payday lender is vicious because he is greedy and unnaturally uses money. The sneaker flipper is vicious because he is greedy and unnaturally uses trade. The *victim's* lack of options is secondary to the *actor's* moral corruption.

  Aristotle cannot see the "bottleneck" because he does not view the market as an impersonal system of power. He views exchange as a series of moral interactions between citizens. If the sneaker flipper is "gentlemanly" about his profit, Aristotle might still dislike the trade, but he wouldn't see the *structural* difference between flipping sneakers and lending money. Both are deviations from the natural use of goods.

  Your intuition is actually closer to **Michael Walzer** (*Spheres of Justice*) or **Elizabeth Anderson** (*Private Government*).
  *   **Walzer:** Argues that money should not dominate spheres where it doesn't belong (like basic survival or bodily integrity).
  *   **Anderson:** Argues that market freedom is meaningless if workers or consumers are subject to the arbitrary authority of others due to necessity.

  ### Summary
  You are trying to wear Aristotelian clothes, but you are built for Modern Liberal Egalitarianism.
  *   **Aristotle** says: "Stop wanting infinite money; it ruins your character."
  *   **You** say: "Stop leveraging people's desperation; it ruins their freedom."

  The sneaker flipper passes your test because he doesn't leverage desperation. He fails Aristotle's test because he pursues infinite profit. The payday lender fails both, but for different reasons. If you want to defend your "bottleneck" intuition, you need to leave the *Politics* behind and move into theories of distributive justice or market socialism. Aristotle gives you no cover there.
