answer: |-
  The *Aethelgard* did not shake. That was the first thing the children learned, before they learned to read the star-charts or recite the lineage of the Custodians. They placed a cup of water on the floor of the nursery, and they watched. The surface remained flat. The water did not tremble. This proved the Engine burned. The Engine's burn provided the thrust; the thrust provided the gravity; the stillness of the water proved the burn.

  Elara, Custodian of the Keel, watched the morning lesson from the shadowed archway. She was a woman of worn hands and quiet eyes, dressed in the grey wool of the Archives. Her job was not to command the ship, but to command the meaning of the ship.

  "Does the water move?" the teacher asked.

  "No, Instructor," the children chorused.

  "Then does the Engine sleep?"

  "No, Instructor."

  "Good. The river flows, but the bed holds."

  It was an old saying, part of the Litany of Arrival. *The water flows, but the bed holds.* The water was their days, their meals, the shifting shifts of the crew. The bed was the Hull, the Engine, the Destination. You could measure the water. You could not measure the bed, because you stood upon it. To measure the bed, you would need to stand somewhere else, and there was nowhere else.

  Elara turned away before the lesson ended. Her comms unit buzzed. It was Kael from Propulsion. He sounded young, which he was, and tight, which he shouldn't be.

  "Custodian. I need to show you something. Sector 4. The deep sensors."

  "Bring it to the Archives, Kael," Elara said. "Bring the hard copy."

  When he arrived, he did not sit. He stood by the heavy oak table that served as Elara's desk, clutching a sheaf of printouts. The air in the Archives was still, smelling of ozone and old paper. Kael looked as though he hadn't slept. He was a good engineer, one of the best of his cycle. He trusted the numbers. That was his virtue, and today, his danger.

  "It's the neutrino flux," Kael said, laying the papers out. He didn't wait for permission. "Look at the integration over the last decade. It's not just a dip. It's a flatline."

  Elara looked. The lines were straight. Horizontal. Zero.

  "And the thermal output?" she asked, her voice level.

  "Inferred from the flux," Kael said. "If there's no fusion, there's no heat. If there's no heat, the thermocouples are reading residual decay, not active burn. Custodian, the Engine stopped. It stopped fifty years ago. We're coasting."

  Elara did not look at the papers again. She looked at Kael. She saw the terror behind his eyes. It wasn't fear of death; they were all going to die eventually. It was the fear of unmooring. If the Engine had stopped fifty years ago, then the voyage time was wrong. The distance was wrong. The Destination was a lie. If the Engine was silent, then the water in the nursery cup was still for a different reason. And if the reason changed, the world changed.

  "You calibrated the sensors yourself," Elara said.

  "Standard protocol," Kael replied. "Using the atomic clocks in the navigation core."

  "And the clocks?"

  "Calibrated against the Engine cycle. The pulse defines the second."

  Elara nodded slowly. She walked around the table and stood beside him. She did not touch the papers. "Kael, you are trying to weigh the scale using the weights the scale created."

  "It's math," Kael insisted, his voice rising. "It's physics. The neutrinos don't care about our definitions. They either pass through the detector or they don't."

  "But 'detecting' them requires a time window," Elara said softly. "You count the particles per second. But if your 'second' is defined by the Engine's pulse, and the Engine is silent... what is a second, Kael?"

  He blinked. "It's... it's a constant."

  "It is a promise," Elara corrected. "We promised that the Engine beats like a heart. We built our clocks to count the beats. If you say the heart has stopped, you are not showing me data. You are showing me that your ruler has melted."

  Kael gripped the edge of the table. "So I'm wrong? The sensors are lying?"

  "The sensors are speaking a language that assumes the Engine burns," Elara said. "They are calibrated to expect a song. When they hear silence, they record zero. But 'zero' implies a quantity that is absent. What if the quantity is not absent, but foundational? You cannot measure the ground you stand on without falling."

  She picked up one of the sheets. The graph was stark, a black line cutting through the grid. "If I accept this, Kael, what happens tomorrow?"

  "We fix it," he said. "We restart the ignition."

  "With what fuel? With what knowledge of where we are?" Elara asked. "If the Engine stopped fifty years ago, we are not where the charts say. The stars outside the viewports... do they match?"

  "I haven't checked," Kael admitted. "I didn't want to..."

  "Because you knew," Elara said. "You knew that if the stars didn't match, the charts were lies. And if the charts are lies, the School is a lie. And if the School is a lie, why do the children drink the water without checking for poison? Why do they sleep without locking the airlocks?"

  She let the silence hang. The ship hummed, or seemed to. It was a sound felt in the teeth more than heard in the ears.

  "There is a story," Elara said, her voice dropping to the register she used for the Litany. "From the Old Earth. A river ran through a valley. The people lived on the banks. They measured their lives by the river's flow. One day, a man dug into the bank and found the rock was soft. He said, 'The bed is mud. The river will swallow us.' He tried to tell the others. But to tell them, he had to stand on the bank. And to stand on the bank, he had to trust the mud was rock."

  Kael looked at her. "Are you saying we just ignore it?"

  "I am saying that truth is a tool," Elara said. "A tool must have a handle. This..." She tapped the paper. "This has no handle. It cuts the hand that holds it. If you announce this, you do not save us. You dissolve us. The crew will not know how to act. If the Engine is dead, is the air recycled? Is the gravity true? If the bedrock is silt, then every step is a guess. Panic is not an emotion, Kael. It is an epistemological collapse."

  "So I bury it," Kael said. The bitterness was sharp.

  "You recalibrate," Elara said. "You adjust the sensors to account for... background decay. You align the clocks to the stellar drift, not the Engine pulse. You make the data consistent with the Bed. Because the Bed *must* hold, or the water spills."

  "That's not science," Kael whispered.

  "It is ship-science," Elara replied. "Out there, in the void, maybe your way works. In here, in the *Aethelgard*, the truth is what keeps the hull whole. If believing the Engine burns keeps the crew functioning, and the crew functioning keeps the ship flying... then the Engine burns."

  She pushed the papers back toward him.

  "There is a choice," Elara said. "You can take this to the Council. They will listen to you. They will verify your numbers. And then they will look at the stars, and they will see we are lost. And the order will break. Or, you can take these papers to the incinerator. You can adjust your calibration protocols. You can live with the knowledge that you are holding up the roof."

  Kael stared at the papers. He looked young, suddenly. The certainty of the numbers had been a shield, and she had asked him to lower it.

  "If I'm wrong," Kael said, his voice trembling. "If the Engine *is* dead, and we pretend... we die drifting."

  "If you are right," Elara said, "we die drifting anyway. The only question is whether we die as a crew, or as a mob screaming in the dark."

  She turned her back on him, walking to the window that looked out into the shaft. The great drive column stretched down into the darkness, glowing with a soft, blue Cherenkov radiance. It was beautiful. It was necessary. Whether it was real was a question that had no answer, because there was no outside to stand on to check.

  "The water flows," Elara said to the glass. "But the bed holds."

  She heard the rustle of paper. She heard the strike of a lighter. She did not turn around until she smelled the smoke of burning pulp.

  "I'll recalibrate," Kael said. His voice was hollow. "I'll file a report on sensor drift."

  "Good," Elara said. "See to it."

  He left. The door hissed shut. Elara remained by the window. She placed her hand against the glass. The ship vibrated, a subtle thrum against her palm. It could have been the Engine. It could have been the blood in her own veins. It could have been the ship coasting on momentum, singing a song of inertia that sounded like thrust.

  She did not know. And she realized, with a cold clarity, that it did not matter. What mattered was that Kael would go back to his station, and he would adjust the numbers, and he would teach his apprentices that the Engine burns. He would become a Custodian in his own way, guarding the bedrock against the erosion of facts.

  Elara watched the blue light in the shaft. It was steady. It was unwavering. It was a lie that kept them alive, or a truth that kept them sane. There was no way to tell the difference from inside the ship.

  She turned back to the desk and picked up the lesson plan for the nursery. *The water flows, but the bed holds.* She would have to teach it again tomorrow. And the day after. Until the stars grew large, or until they faded completely. She sat down, opened the book, and waited for the next child to ask why the water didn't shake.
