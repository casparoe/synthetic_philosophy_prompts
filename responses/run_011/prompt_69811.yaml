answer: |-
  **Diagnosis of the Disagreement**

  The stalemate exists because the three readings are arguing from different phases of the object's life cycle, yet treating their conclusions as mutually exclusive descriptions of the whole. The data you possess describes the **end** of the object's life (deposition) and its **birth** characteristics (fabric/motif). The theories argue about the **middle** of the object's life (circulation and use).

  1.  **Production vs. Consumption:**
      *   The **Administrative** reading privileges the *production/distribution* signal (notches cluster at large sites). It assumes the logic of the system (centralized recording) dictates the object's value.
      *   The **Ritual** and **Fashion** readings privilege the *consumption/deposition* signal (equal burial/floor ratio, no wealth correlation). They assume the logic of the user (personal devotion or identity) dictates the object's value.
      *   **The Conflict:** The Administrative camp treats the plain majority as "blanks" or "copies" (low value), yet the deposition data shows they were treated with the same care as the notched minority (high value). The Administrative reading survives only by assuming a radical shift in meaning at the moment of death or deposition (e.g., a tally becomes a passport). The Ritual and Fashion readings do not need this auxiliary assumption; they allow the object to have consistent value from acquisition to deposition.

  2.  **Where They Stop Being Rivals:**
      The three readings converge on **mechanism** but diverge on **agency**.
      *   **Convergence:** All three agree the plaques were *tokens*—material signs of a non-material relation. All three agree the motif was recognized regionally. All three agree the notches mark a distinction made at the large sites.
      *   **Divergence:** They are genuinely incompatible regarding the **source of efficacy**.
          *   *Administrative:* Efficacy comes from the *system* (the notch validates the record).
          *   *Ritual:* Efficacy comes from the *sacred* (the motif connects to the cosmos; the notch marks rank).
          *   *Fashion:* Efficacy comes from the *social* (the motif signals belonging; the notch marks origin).
      *   **Incompatibility:** You cannot have an object that is simultaneously a secular accounting tool *and* a sacred cosmological device *in the same context* without blurring the definition of both. However, in pre-modern contexts, "temple economy" and "sacred tally" are often indistinguishable. The incompatibility is real only if you impose a modern secular/sacred divide. If you remove that divide, Administrative and Ritual readings become structurally identical (Centralized Authority vs. Decentralized User).

  3.  **The Verbal Dispute:**
      The disagreement is partly verbal, centering on the term **"Function."**
      *   **Sense A (Designed Purpose):** What the maker/large-site authority intended the object to do. (Favors Administrative/Ritual).
      *   **Sense B (Actualized Role):** What the depositor did with the object. (Favors Ritual/Fashion).
      *   **The Work the Term Does:** The Administrative camp uses "Function" to mean Sense A (it was made to count). The Fashion camp uses "Function" to mean Sense B (it was kept to signal). Because the object was deposited, Sense B is the only one archaeologically visible. The argument stalls because the Administrative camp insists Sense A can be inferred from distribution, while the others insist Sense A is invisible without Sense B.

      A secondary verbal dispute rests on **"Token."**
      *   *Economic Token:* Represents a quantity of goods/labor.
      *   *Votive Token:* Represents a relationship with a deity.
      *   *Social Token:* Represents membership in a group.
      *   Since all three involve exchange (goods, prayers, or recognition), the term is doing no discriminatory work.

  4.  **The Hidden Empirical Question:**
      There is a formal question that all three camps must accept as relevant, though they may disagree on the expected outcome. It is not about *where* the plaques were found, but *what happened to them* before they were found.

      **The Question:** *"Do the notched plaques exhibit significantly different micro-wear, edge rounding, or residue profiles compared to the plain plaques, indicative of longer or more intensive circulation?"*

      *   **Why this settles the matter:**
          *   **If Yes (Notched show more wear):** The Administrative reading gains decisive ground. It implies the notched plaques circulated as active tools/tallies, while the plain ones were static (blanks, local copies, or single-use votives). This validates the "functioning subset" claim.
          *   **If No (Wear is identical):** The Administrative reading collapses. A "blank" or "imitation" tally would not be handled with the same intensity as a "functioning" one. If plain and notched plaques show identical handling, they had identical *use-lives*. This supports the Ritual or Fashion readings, where the motif, not the notch, drove the object's value and handling.
          *   **If No Wear (All are pristine):** This suggests ritual purification before deposition or that they were never "used" in a mechanical sense. This favors the Ritual reading (votives are often new) or Fashion (items kept for display), and strongly undermines the Administrative reading (tallies get dirty).

  5.  **Path to Progress:**
      Progress will not come from better mapping or typology. You have exhausted the spatial and morphological variables. Progress requires shifting from **Taxonomy** (what is it?) to **Biography** (what happened to it?).

      **Recommended Reformulation:**
      Stop asking "What are the plaques?" and start asking **"Why were the plain plaques buried?"**
      *   The plain majority is the weak point of the Administrative theory. If 14 out of 15 plaques are "blanks" or "copies," why are they deposited in burials with the same frequency as the "real" ones?
      *   Force the Administrative camp to explain the *value* of the plain plaque in the burial context without borrowing from the Ritual camp (i.e., without calling it a "spiritual tally").
      *   Force the Ritual/Fashion camps to explain the *clustering* of notches at large sites without borrowing from the Administrative camp (i.e., without admitting a form of centralized control/distribution).

      **Verdict on Winnability:**
      If micro-wear analysis shows no distinction between notched and plain plaques, the question of *intent* (Priest vs. Scribe vs. Potter) is **unwinnable in principle**. The archaeological record preserves the *act of deposition*, not the *thought of deposition*. If the handling was identical, the distinction between a "sacred token," a "social marker," and a "decommissioned tally" has no determinate truth value in the absence of text.
      However, if wear distinguishes them, the Administrative reading becomes the most parsimonious explanation for the *notches*, while the Ritual reading remains the most parsimonious explanation for the *deposition*. This would lead to a synthesis: **Centralized administrative objects that acquired secondary ritual value upon decommissioning.** This synthesis resolves the standoff by acknowledging that the object's function changed over its lifecycle, satisfying the distribution data (Admin) and the deposition data (Ritual).

      **Immediate Next Step:**
      Blind micro-wear analysis of the edges and backs (excluding the notches) of 50 notched and 50 plain plaques. If the wear profiles are statistically indistinguishable, abandon the Administrative "functioning subset" hypothesis. It is contradicted by the object's biography.
