answer: |-
  **EXAMINATION PAPER: METAPHYSICS OPTION**

  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1**

  Read the following two cases carefully.

  **Case One:** A single early embryo, formed from one specific egg and one specific sperm, is divided into two viable halves in a laboratory. Each half is gestated separately, resulting in two distinct people. One half is implanted immediately; the other is cryopreserved for several years before transfer. Consequently, two people share the exact same gametic origin but are born years apart. Neither can claim to be the 'original' by virtue of developing first, as both developed from equal parts of the same initial zygote.

  **Case Two:** Cells from two early embryos, each formed from a different egg and a different sperm, are combined into a single embryo which develops into one person. This person's body is a mixture of the two cell lines. However, testing reveals that one of the two original lines supplies all of that person's germ cells (eggs or sperm), while the rest of their somatic body is a mixture. Thus, her reproductive capacity descends from only one of the two pairs of gametes, while the rest of her does not.

  (a) State the thesis of the Necessity of Origin precisely enough to be capable of being false. For each case separately, explain exactly which commitment of your stated thesis is put under pressure. (10 marks)

  (b) Decide whether a revised version of the thesis can survive both cases and still perform the philosophical work the original was recruited for (such as grounding transworld identity or ruling out origin-swapping). You must commit to a verdict on whether the thesis can be saved. Explain what would have to be surrendered to save it, and whether the result is worth keeping. (15 marks)

  ***

  **MODEL ANSWER**

  The Necessity of Origin (NOO) thesis claims that for any person $P$, if $P$ originates from a specific biological source $S$, then in any possible world where $P$ exists, $P$ must originate from $S$. To be falsifiable, $S$ must be specified. If $S$ is defined loosely as "human parents," the thesis is trivial. To have modal force, $S$ must be the specific pair of gametes or the specific fertilisation event. I will define $S$ as the specific pair of gametes whose union initiated $P$'s development.

  Case One pressures the uniqueness commitment of NOO. If NOO implies that originating from gametes $G$ is sufficient to fix the identity of the person originating from them, Case One refutes this. Here, two distinct people, $A$ and $B$, both originate from the same $G$. If $A$ exists in a world, NOO says $A$ must come from $G$. But $B$ also comes from $G$. Therefore, coming from $G$ does not uniquely determine which person exists. The thesis fails to secure transworld identity because the link between origin and identity is one-to-many rather than one-to-one. The cryopreservation detail ensures we cannot appeal to temporal priority to distinguish them; they are metaphysically equal candidates for the origin $G$.

  Case Two pressures the material constitution commitment. Here, person $C$ originates from two pairs of gametes, $G1$ and $G2$. Standard NOO suggests $C$ could not exist without $G1$ and could not exist without $G2$. However, the germline detail complicates this. If $C$'s reproductive capacity derives solely from $G1$, one might argue $C$'s essential biological continuity ties only to $G1$. If we insist $C$ needs both, we imply $C$ could not exist if $G2$ had been slightly different, even if $G2$ contributed only to non-reproductive skin cells. This forces a choice: is the 'origin' the whole zygotic mixture or the germline source? If the former, NOO binds $C$ to material that plays no role in her genetic propagation. If the latter, NOO binds $C$ to $G1$ only, rendering the contribution of $G2$ accidental, which contradicts the intuition that the whole embryo constitutes the person.

  Can a revised thesis survive? To survive Case One, we must weaken NOO from "must originate from $S$" to "must originate from *a subset of* $S$" or "must originate from *materially continuous* $S$." To survive Case Two, we must allow that origin can be composite or that only the germline matters. However, these revisions surrender the philosophical work NOO was recruited for. The original thesis was meant to rule out origin-swapping (e.g., that I could have been born from different parents) and to ground rigid designation across worlds. If we allow that $A$ and $B$ share an essential origin, we lose the ability to use origin to distinguish them modally. If we allow $C$ to have a composite essential origin, we introduce vagueness: how much of $G2$ is essential? Ten percent? One cell?

  Furthermore, specifying the origin as the fertilisation event rather than the gametes does not help. In Case One, there is one event producing two people. In Case Two, there are two events producing one person. The mismatch between the count of events and the count of persons remains.

  I conclude that the thesis cannot be saved in a form robust enough to do its intended work. To accommodate Case One, we must admit that origin is not sufficient for identity. To accommodate Case Two, we must admit that origin is not necessarily unique or singular. A revised thesis might claim that one must originate from *roughly* this material. But this invites a sorites paradox: how much variation in the gametes is allowed before it is a different origin? If we draw a sharp line, it is arbitrary. If we do not, the thesis loses its necessity.

  Therefore, the strict Kripkean thesis must be surrendered. What survives is a weaker principle of causal continuity: a person must originate from *some* biological material causally connected to their actual origin. But this is too weak to rule out swapping scenarios where the causal chain is preserved but the material is replaced. The metaphysical payoff of NOO was certainty about transworld identity; the biological reality of fission and fusion shows that certainty is unavailable. We must accept that origin is a contingent matter of degree, not a modal anchor.

  ***

  **MARKING SCHEME**

  **Crux of the Question:**
  The question turns on the tension between the *uniqueness* and *singularity* required by the Necessity of Origin thesis and the biological realities of *fission* (Case One) and *fusion/chimerism* (Case Two). Candidates must recognise that saving the thesis requires weakening it to the point where it no longer secures transworld identity.

  **Must-Hit Moves (25 Marks Total):**

  1.  **Precise Formulation of Thesis (4 marks):**
      *   Candidate defines origin specifically (e.g., specific gametes or zygote) rather than vaguely (e.g., "parents").
      *   *Common Error:* Defining origin as "the same parents," which makes the thesis trivially true and immune to the cases.

  2.  **Analysis of Case One (Fission) (5 marks):**
      *   Identifies that one origin yields two persons, breaking the link between origin and unique identity.
      *   *Common Error:* Claiming one twin is the "real" person based on birth order (explicitly ruled out by the stem).

  3.  **Analysis of Case Two (Fusion/Chimera) (5 marks):**
      *   Identifies the conflict between somatic origin (two pairs) and germline origin (one pair), questioning which is essential.
      *   *Common Error:* Ignoring the germline detail and treating it as a simple mixture without metaphysical consequence.

  4.  **Specification of Origin Level (4 marks):**
      *   Discusses whether origin is the gametes, the zygote, or the event, and how the cases bite differently at each level.
      *   *Common Error:* Assuming "gametes" and "zygote" are interchangeable without argument.

  5.  **Verdict on Revision and Philosophical Work (7 marks):**
      *   Commits to a definite conclusion (save or abandon) and explains what philosophical utility is lost (e.g., inability to rule out swapping).
      *   *Common Error:* Offering a balanced survey ("some say X, others say Y") without a personal verdict.

  **Grade Caps:**
  *   **C Grade (Max 12/25):** A fluent reconstruction of Kripke's table or monarch examples with little to no engagement with the specific biological cases provided in the stem.
  *   **B Grade (Max 20/25):** Engages both cases but hedges the verdict in Part (b) or fails to address how the specification of origin (gamete vs. zygote) alters the argument.

  **Specific Credit Guidelines:**
  *   **Sorites Objection:** Up to 3 marks (within Part b) for raising the slippery slope regarding gametic variation if linked to the loss of modal force.
  *   **Germline Detail:** Full credit for Part (a) Move 3 is available whether the candidate argues the germline detail is decisive (fixing the essential origin) or a red herring (the person is the whole soma), provided the argument is consistent.
