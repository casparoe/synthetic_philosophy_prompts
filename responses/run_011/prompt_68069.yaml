  You are a philosopher who works on social choice theory and judgment aggregation, and you are used to reading the primary literature rather than secondhand summaries of it. Please think carefully, and reconstruct the example yourself before you evaluate anything said about it.

  I am a junior in high school and I co-edit our student philosophy journal. We have accepted an essay by an alumnus who is now an undergraduate, and I am the one who has to check its central section before we set type. I want an accuracy audit I can act on, not a lecture on the topic. His section runs roughly as follows; I have retyped it rather than transcribing the manuscript, but the argumentative content is his:

  "Take a three-judge court that has to decide whether a defendant is liable for breach of contract. The doctrine says the defendant is liable just in case the contract was valid and the defendant breached it. Judge 1 holds the contract was valid but not breached. Judge 2 holds it was breached but not valid. Judge 3 holds both. Now ask the judges about the outcome and the defendant walks free, two to one; ask them about the two premises instead, take a majority on each, and the court finds the contract valid, finds a breach, and holds the defendant liable. Same judges, same opinions, opposite verdict — the only thing that changed was the order in which the questions were put. This is the discursive dilemma, and it is Arrow's impossibility theorem turning up in a courtroom: that result proved decades ago that no voting system can faithfully aggregate individual preferences, and what these judges have run into is that proof in action. Notice what it means. In the second case the court ends up committed to a flat contradiction that not one of its members believes, which is simply irrational. The remedy is obvious in principle: always vote on the premises, because the premises are the reasons, and a group that ignores its own reasons is not reasoning at all. Once this is visible, the fashion for multi-question referendums looks like a fraud, since whatever combination of answers wins, nobody actually voted for it."

  There are two places where I already have an instinct, though I may well be wrong about both: the sentence identifying this with Arrow's theorem feels too glib, and the final sentence about referendums feels like it is being asked to carry more weight than the courtroom example can support. Please tell me where my instincts are off just as readily as where they are right.

  What I need from you:

  1. Set the example out as a table of the three judges' votes and confirm whether the arithmetic works the way he says it does — including whether the premise majorities really do generate a finding of liability, and whether any individual judge held that the defendant is liable.

  2. Audit the passage claim by claim, sorting each claim as accurate, a defensible simplification, or wrong, and giving in a sentence or two what the correct statement would be. I particularly want to know whether aggregating judgments on connected propositions is the same problem as aggregating preferences over alternatives, and whether what the judges face is an impossibility theorem in Arrow's sense or something structurally different — including whether the popular gloss on Arrow that he uses is itself correct.

  3. Take up the contradiction charge directly. Is the court, in the second of the two procedures he describes, literally committed to a contradiction? If the answer depends on something — for instance on whether the legal rule linking premises to conclusion is itself treated as one of the propositions being voted on, or held fixed in the background as the doctrine — say so and walk through both readings, because our readers will not know that the distinction is even there to be drawn.

  4. Assess the two normative conclusions. Is "always vote on the premises" settled doctrine among people who work on this, or a contested position, and what would a serious defender of voting on the conclusion first say in reply? Separately, does the referendum claim follow from the case he has given, or does it only follow under conditions he has not stated?

  5. Close with the changes I would have to insist on before publication, ranked by importance, and then — for the Arrow sentence only — a replacement sentence or two that keeps his rhetorical momentum without asserting something false.

  Lead with your bottom line: your very first sentence should be your overall verdict on the passage, and then the reasoning, with no preamble and no restating of my question. We do not print footnotes, so please give me no reading list, no page numbers, and no citations; explain the substance in your own words. Where reasonable specialists genuinely disagree, say so explicitly rather than quietly picking a side.
