  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Semantics of Modality and Reference  
  **Participants:** Proponent A (Strong Two-Dimensionalism), Proponent B (Kripkean/Soames One-Dimensionalism)  
  **Date:** October 26, 2023

  ## I. SHARED GLOSSARY & TRANSLATION KEY

  To facilitate mutual intelligibility, we agree to the following baseline definitions. Where our theoretical commitments diverge, we provide side-by-side translations for key terms.

  | Term | Shared Baseline Definition | Proponent A (2D) Translation | Proponent B (1D) Translation |
  | :--- | :--- | :--- | :--- |
  | **Proposition** | The primary bearer of truth value, believed, and asserted. | A two-dimensional intension (function from scenarios to truth-values). | A structured entity or set of metaphysically possible worlds. |
  | **World/Scenario** | A complete way things might be. | **Epistemic Scenario:** A centered world considered as *actual* (an epistemic possibility). | **Metaphysical World:** A way the world might have *been* (counterfactual). |
  | **Intension** | A function from worlds/scenarios to extensions. | **Primary:** Epistemic (actualized). **Secondary:** Metaphysical (counterfactual). | **Semantic:** Function from metaphysical worlds to extensions. "Primary intensions" are merely psychological dispositions. |
  | **Conceivability** | Ideal positive conceivability (no contradiction found upon reflection). | A reliable guide to metaphysical possibility (via primary intensions). | A fallible heuristic; does not entail metaphysical possibility. |

  ## II. NUMBERED CLAIMS (COMMON GROUND)

  Both proponents sign the following claims, acknowledging that their theoretical explanations of *why* these claims hold may differ.

  1.  **Hesperus/Phosphorus:** The identity statement "Hesperus is Phosphorus" expresses a truth that is metaphysically necessary but epistemically a posteriori.
  2.  **Water/H2O:** In the actual world, "Water is H2O" is true and metaphysically necessary. There is no metaphysically possible world where water exists and is not H2O.
  3.  **The Zombie Argument:** A world physically identical to ours but lacking conscious experience (a "zombie world") is *ideally conceivable*.
  4.  **Zombie Conclusion:** The Zombie Argument is *not* a proof that physicalism is false unless conceivability entails metaphysical possibility. Both sides agree the argument turns on the link between epistemology and metaphysics.
  5.  **Cognitive Significance:** "Hesperus is Hesperus" and "Hesperus is Phosphorus" differ in cognitive significance (one is trivial, one informative), regardless of whether they express the same proposition.

  ## III. DISAGREEMENTS TABLE

  | Topic | Proponent A (2D) Wording | Proponent B (1D) Wording | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Semantic Content** | What is said includes the primary intension (epistemic profile). | What is said is solely the proposition (metaphysical truth conditions). | **Substantive** |
  | **Necessary A Posteriori** | These are truths where the primary intension is contingent, but the secondary is necessary. | These are genuine features of reality; the proposition is necessary, our access is contingent. | **Substantive** |
  | **Primary Intensions** | These are semantic rules constitutive of meaning. | These are speaker dispositions or metalinguistic descriptions, not semantic content. | **Substantive** |
  | **Zombie Possibility** | Zombie conceivability implies metaphysical possibility (via 1-intension). | Zombie conceivability does not imply metaphysical possibility (conceivability $\neq$ possibility). | **Substantive** |

  ## IV. THE CRUXES: TESTS AND PREDICTIONS

  We identify two fundamental divergence points. For each, we specify a test case and record our predictions *ex ante*.

  ### Crux 1: Semantic Content vs. Speaker Disposition
  **The Question:** Does the "primary intension" (the epistemic rule for applying a term) belong to the semantic content of the word, or is it merely a record of a speaker's disposition to apply the word based on potentially false theories?

  **The Test Case ("Zalt"):**
  *In 1904, a physicist coins "zalt" for the quantity conserved in collisions of his corpuscles. The corpuscle theory turns out to be false; the conserved quantity we now call momentum. However, the term "zalt" enters the literature.*
  *   **Q1:** What did "zalt" refer to in 1904?
  *   **Q2:** In an epistemic scenario where the corpuscle theory is *true* (corpuscles exist) but the conserved quantity is *Vis Viva* ($2mv^2$) rather than Momentum ($mv$), does "zalt" pick out Vis Viva?

  **Predictions:**
  *   **Proponent A (2D):**
      *   *Q1:* Reference is indeterminate or fixed by the role ("the conserved quantity").
      *   *Q2:* **Yes.** In that scenario considered as actual, "zalt" picks out Vis Viva. The primary intension ("the quantity conserved in collisions") determines reference in that scenario.
  *   **Proponent B (1D):**
      *   *Q1:* Reference is **Momentum** (via causal link to the phenomenon), despite the false theory.
      *   *Q2:* **No.** "Zalt" rigidly designates Momentum. In the scenario where Vis Viva is conserved, "Zalt is Vis Viva" is false. The 1904 physicist was mistaken about the nature of zalt, but not about the reference.

  ### Crux 2: Explaining Away vs. Redescribing
  **The Question:** Does two-dimensionalism *explain away* the necessary a posteriori (showing it to be a semantic artifact), or does it merely *redescribe* it while acknowledging the metaphysical necessity?

  **The Test Case ("Water/XYZ"):**
  *Consider the statement "Water is H2O." Evaluate it in a scenario where the clear, wet stuff in lakes is XYZ.*

  **Predictions:**
  *   **Proponent A (2D):**
      *   The statement "Water is H2O" is **contingent** when evaluated under the primary intension (in the XYZ scenario, 'water' refers to XYZ). It is only necessary under the secondary intension. Thus, the "necessity" is a feature of the secondary evaluation, not the whole semantic value.
  *   **Proponent B (1D):**
      *   The statement "Water is H2O" is **necessary**. In the XYZ scenario, there is no water. To claim the statement is "contingent" under a primary intension is to change the subject to a different sentence (e.g., "The actual watery stuff is H2O"). 2Dism redescribes the phenomenon but fails to eliminate the metaphysical necessity.

  ## V. MUTUAL CONCESSIONS

  To conclude this collaboration, each side acknowledges a specific insight earned from the other.

  **Proponent A (2D) concedes to Proponent B:**
  > "I acknowledge that my framework must not be read as reducing metaphysical modality to epistemic modality. The secondary intension tracks genuine mind-independent necessity. If physicalism is true, it is necessarily true, and my 'scenarios' cannot be used to conjure away hard metaphysical constraints simply because they are conceivable."

  **Proponent B (1D) concedes to Proponent A:**
  > "I acknowledge that dismissing primary intensions as merely 'psychological' risks ignoring the systematic role epistemic profiles play in communication and rational inference. Even if they are not 'content' in the metaphysical sense, a complete theory of language must formally model how speakers coordinate on reference despite theoretical error, which your framework handles explicitly."

  ***

