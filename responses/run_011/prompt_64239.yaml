prompt: |-
  Two members of my philosophy-of-language group have argued past eachother for a year: a strong two-dimensionalist (primary intensions are part of what's said, scenarios are epistemic possibilities, zombie-conceivability does real work) and a Kripkean one-dimensionist of the Soames stripe (contents are propositions, some of them necessary a posteriori, and a primary intension at best records how a speaker would apply a word, not what the word means). Draft the joint statement their adversarial collaboration should end with.

  Give me: a short shared glossary up front, and where a term like "scenario" or "intension" can't be shared, both translations side by side; numbered claims both can sign, including about Hesperus, about water, and about what the zombie argument is and isn't supposed to show; a disagreements table with each side's own acceptable wording of its position plus a verdict on whether the row is substantive or just two vocabularies; then the cruxes — I suspect one is whether a primary intension belongs to content or only to a speaker's dispositions to apply words, and another is whether two-dimensionalism explains away the necessary a posteriori or merely redescribes it. For each crux, a test both accept and each side's prediction, written down beforehand.

  Use this case for the first crux; it's mine, neither of them has seen it. In 1904 a physicist coins "zalt" for the quantity conserved in collisions of his corpuscles, a theory that turns out to be false; the conserved quantity we now call momentum. What did "zalt" refer to back then, what does it refer to now, and in a scenario where the corpuscle theory is true but the conserved quantity is something different, does "zalt" pick out that other thing? End with one concession each side thinks the other has genuinely earned.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy-of-language group where two members (Strong 2Dist vs. Kripkean/Soames 1Dist) have argued past each other for a year.
      *   **Task:** Draft a joint statement concluding their adversarial collaboration.
      *   **Components Required:**
          1.  Short shared glossary (with side-by-side translations for divergent terms).
          2.  Numbered claims both can sign (covering Hesperus, Water, Zombie Argument).
          3.  Disagreements Table (Side A wording, Side B wording, Verdict on substantiveness).
          4.  The Cruxes (with tests and predictions):
              *   Crux 1: Primary Intension in Content vs. Speaker Dispositions. (Must use the specific "Zalt" case provided).
              *   Crux 2: 2Dism explaining away vs. redescribing the necessary a posteriori.
          5.  Ending: One concession each side thinks the other has earned.
      *   **Tone:** Professional, collaborative, precise, philosophical.

  2.  **Deconstruct the Positions:**
      *   **Strong Two-Dimensionalist (2D):**
          *   Primary Intensions (1-intensions) are part of semantic content (what is said).
          *   Scenarios are epistemic possibilities (ways the world might turn out to be).
          *   Zombie conceivability entails metaphysical possibility (or at least does "real work" against physicalism).
          *   Necessary a posteriori truths are often contingent primary intensions + necessary secondary intensions.
      *   **Kripkean/Soames One-Dimensionalist (1D):**
          *   Content = Propositions (sets of possible worlds, primarily).
          *   Necessary a posteriori truths are genuine features of reality, not just semantic artifacts.
          *   Primary intensions (if acknowledged) are merely cognitive/psychological (how speakers apply words), not semantic.
          *   Zombie conceivability does *not* entail metaphysical possibility (conceivability $\neq$ possibility).

  3.  **Drafting - Section by Section:**

      *   **Glossary:** Need to find common ground or explicitly mark divergence.
          *   *Proposition:* 1D says sets of worlds. 2D says maybe structured or 2D intensions. Let's stick to "truth-conditional content."
          *   *Scenario/World:* 1D says metaphysically possible world. 2D says epistemically possible scenario (centered world).
          *   *Intension:* 1D says function from worlds to extensions. 2D distinguishes Primary (epistemic) vs. Secondary (metaphysical).

      *   **Numbered Claims (Common Ground):**
          *   *Hesperus/Phosphorus:* Both agree it's necessary identity, known a posteriori.
          *   *Water/H2O:* Both agree it's necessary identity (in actual world), known a posteriori.
          *   *Zombies:* Both agree zombies are *conceivable*. Disagreement is on what that entails.
          *   *General:* Language connects mind to world; modal status is distinct from epistemic status.

      *   **Disagreements Table:**
          *   Need to show where they talk past each other vs. where they really disagree.
          *   *Example:* "What is said." 1D: Proposition. 2D: 2D Intension. Verdict: Substantive.
          *   *Example:* "Conceivability." 1D: Heuristic. 2D: Guide to possibility. Verdict: Substantive.
          *   *Example:* "Cognitive Significance." 1D: Pragmatics/Psychology. 2D: Primary Intension. Verdict: *Maybe* verbal? (Soames might say it's just psychology, Chalmers says it's semantics). Let's mark this as the core substantive dispute.

      *   **The Cruxes (The Hard Part):**
          *   *Crux 1 (Content vs. Disposition):* Must use the "Zalt" case.
              *   *Case:* 1904 Physicist coins "zalt" for conserved quantity in corpuscle theory. Theory false (it's momentum).
              *   *Question:* Reference then? Reference now? Scenario where theory true but quantity different?
              *   *1D Prediction:* Reference is fixed by causal/historical link to the actual quantity (momentum), even if theory is wrong. "Zalt" = Momentum. In the counterfactual, if they point to something else, it's a different term or error.
              *   *2D Prediction:* Primary intension picks out "whatever plays the zalt-role." In the counterfactual scenario (epistemic), if something else plays the role, "zalt" picks that out.
              *   *Test:* Does the truth of "Zalt is conserved" depend on the theory being right (1D) or the role being filled (2D)?
          *   *Crux 2 (Explaining Away vs. Redescribing):*
              *   *Issue:* Is "Water = H2O" necessary because of how the world is (1D) or because we fix reference via a contingent description (2D)?
              *   *Test:* Consider a world where the clear wet stuff is XYZ.
              *   *1D:* In that world, Water $\neq$ XYZ. Water is H2O necessarily.
              *   *2D:* In that scenario (considered as actual), "Water" picks out XYZ. The *statement* "Water is H2O" is contingent as said (1-intension), necessary as evaluated (2-intension).
              *   *Verdict:* 1D says 2D changes the subject. 2D says 1D ignores epistemic dimension.

      *   **Concessions:**
          *   2D to 1D: Acknowledge that modal metaphysics isn't *reduced* to epistemology.
          *   1D to 2D: Acknowledge that cognitive significance needs a formal home, even if not "content."

  4.  **Refining the "Zalt" Case (Crux 1):**
      *   This needs to be precise.
      *   *1904 Context:* Theory says corpuscles have property Z. Conservation law holds for Z.
      *   *Reality:* Theory false. Corpuscles don't exist as described. But *momentum* is conserved.
      *   *1D (Soames):* "Zalt" refers to momentum (via causal chain to the phenomenon), despite the false theory. The false theory is a "reference-fixing description" that failed, but the causal link to the quantity remains. Or, if the theory is *too* false, it refers to nothing. Soames usually leans towards causal-historical overriding descriptive error *if* there's a dominant causal link. Let's assume there is a link to the conservation phenomenon.
      *   *2D (Chalmers/Jackson):* Primary intension is "the quantity conserved in collisions." In a scenario where the theory is true (corpuscles exist) but the conserved quantity is *Kinetic Energy* (not momentum), "zalt" picks out Kinetic Energy.
      *   *The Test:* Evaluate the sentence "Zalt is Momentum."
      *   *1D:* Necessary (if reference succeeded).
      *   *2D:* Contingent (1-intension), Necessary (2-intension).

  5.  **Review and Formatting:**
      *   Ensure the tone is conciliatory but firm on differences.
      *   Check all constraints: Glossary, Numbered Claims, Disagreements Table, Cruxes (with Zalt), Concessions.
      *   Make sure the "Zalt" case is integrated exactly as requested (it's the user's case, neither philosopher has seen it).

  6.  **Self-Correction/Nuance Check:**
      *   *Soames' View:* Soames is very aggressive against 2Dism. He thinks 2Dism confuses propositions with sentences. He might deny primary intensions exist *at all* as semantic entities, calling them "metalinguistic." I need to make sure the 1D column reflects this skepticism without being obstructionist.
      *   *2D View:* Needs to maintain that 1-intensions are *semantic*, not just pragmatic.
      *   *Zalt Case:* Ensure the distinction between "Theory is false" (actual world) and "Scenario where theory is true" (epistemic possibility) is clear.
      *   *Glossary:* Make sure "Scenario" gets the dual definition.

  7.  **Final Polish:** Check word count and clarity. Ensure the "Verdict" column in the table distinguishes between "Verbal/Notational" and "Substantive." (Most will be substantive, otherwise they wouldn't argue for a year).

  *(Self-Correction on Crux 1 Test)*: The prompt asks for a test *both accept* and *each side's prediction*.
  Test: Evaluate the truth value of "Zalt is Momentum" in the counterfactual scenario where the corpuscle theory is correct but the conserved quantity is *Vis Viva* (2mv^2), not Momentum (mv).
  1D Prediction: False (or truth-valueless), because 'Zalt' refers to Momentum (actual world anchor).
  2D Prediction: True (under primary intension evaluation), because 'Zalt' picks out whatever fills the role in that scenario.

