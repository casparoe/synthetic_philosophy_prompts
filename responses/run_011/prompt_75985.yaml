answer: |-
  **Project Title:** The Temporal Dynamics of Goodhart's Law: Defining and Predicting the Half-Life of Metrics

  **Research Question**
  Standard treatments of Goodhart's Law treat metric failure as a binary event: either a measure becomes a target and collapses, or it holds. This project challenges that binary by proposing a temporal metric: the "half-life of a metric." I define this as the duration of sustained optimization pressure required for the correlation between a proxy measure and its underlying goal to drop by fifty percent. My central claim is that this decay rate is not random but is predictable based on structural features of the measurement system. Specifically, I hypothesize that metrics with high degrees of freedom for the agent, low visibility of gaming, low revisability for the principal, and downstream positioning relative to the goal will exhibit significantly shorter half-lives.

  This claim is falsifiable. If I can identify cases where high degrees of freedom coexist with long metric stability (e.g., GPA) without explanatory confounding variables, or if adversarial cases decay slower than regressional ones, the hypothesis fails. The question is not whether Goodhart's Law applies, but *when* it applies, and whether that "when" is structurally determined.

  **Existing Treatments and Limitations**
  The current literature, particularly the standard four-way taxonomy (regressional, extremal, causal, and adversarial), effectively categorizes the *mechanism* of failure. Similarly, work in AI alignment regarding specification gaming identifies *how* agents exploit loopholes. These frameworks are robust, but they are largely static. They explain why a metric breaks, not how long it lasts before breaking.

  This distinction matters. In policy and education, knowing that a metric *will* fail is less useful than knowing if it will fail in two weeks (like our school's reading-log points) or twenty years (like GPA). Existing models treat the collapse as inevitable but temporally undefined. By focusing on speed, I am not contradicting the taxonomy but adding a dimension it currently lacks. The adversarial type likely decays faster than the regressional type, but this is an assumption, not a derived result. My project tests whether the mechanism type correlates with decay speed.

  **Methodology**
  I cannot run controlled experiments or access longitudinal institutional data. Therefore, this is a conceptual project utilizing comparative case study analysis. I will construct a rigorous definition of "metric half-life" that avoids circularity (i.e., not defining decay solely by the outcome I'm trying to predict). I will then apply this framework to four distinct cases:
  1.  **School Reading Logs:** High freedom, low visibility, rapid collapse.
  2.  **GPA/Grade Inflation:** High freedom, high visibility, slow decay.
  3.  **Hospital Wait-Time Targets:** Specific operational metric, medium revisability.
  4.  **Reinforcement Learning Agents:** Digital environment where reward hacking is instantaneous.

  Critics might call this anecdotal. However, the goal is not statistical significance but conceptual clarity. If the structural features I identify cannot consistently distinguish between the rapid collapse of reading logs and the slow decay of GPA across these diverse domains, then the framework lacks explanatory power. The work lies in sharpening the definitions enough that the comparison yields insight rather than just storytelling.

  **Success and Failure Conditions**
  A successful result will be a refined conceptual framework presented at the symposium. This will include a clear definition of "metric half-life," a mapping of structural features to decay speeds across the four cases, and a argument for why adversarial cases decay faster than regressional ones. The final product is a paper arguing that measurement stability is a design feature, not luck.

  The project fails if I cannot define "half-life" without referencing the specific outcome of the case study. If the definition is circular—for example, if I define "high degrees of freedom" only by looking at which metrics failed quickly—then the project is tautological and useless. Another failure condition is if the structural features prove orthogonal to speed; if GPA and reading logs have similar structural scores but vastly different half-lives that I cannot explain, the hypothesis is incorrect. I need to avoid simply narrating history; I must demonstrate predictive capacity.

  **Scope and Constraints**
  I have four months part-time. The biggest risk is scope creep into empirical data collection. I must cut any attempt to gather actual data on school metrics or hospital statistics; I will rely on existing public records and reasoned analysis of the systems. I will also limit the case studies to four. Adding more will dilute the depth of analysis. If the Reinforcement Learning case proves too technical regarding algorithmic specifics, I will cut it in favor of a third economic example, such as quota-based manufacturing. The priority is the philosophical framework, not the technical details of every case.

  **Objection: Philosophy vs. Statistics**
  A common objection will be: "Isn't this just statistics? Isn't half-life just a proxy for incentive strength?" If this were purely about measuring incentive intensity, it would be a stats project. However, my focus is on the *meaning* of the measure itself and the structural relationship between the proxy and the goal. I am analyzing the conditions under which a signifier loses its connection to the signified. This is a philosophical inquiry into measurement validity under pressure. Statistics could describe the decay curve, but it cannot explain why the structure of the measurement system dictates that curve. I am arguing that the ontology of the metric determines its lifespan, which is a conceptual claim, not merely a numerical one.
