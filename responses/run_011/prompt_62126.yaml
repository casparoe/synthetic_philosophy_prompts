      *   *Check:* Is the Dimensional Analysis point clear? Yes, conversion factors = bridge principles.
      *   *Check:* Make sure to address the "Smuggler" specifically.
      *   *Refinement:* Ensure the distinction between *formal validity* and *substantive entailment* is clear. The housemate is conflating logical validity with metaphysical grounding.

  11. **Final Polish:** Check against the user's specific questions.
