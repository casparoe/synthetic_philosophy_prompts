answer: |-
  To the Panel and the Council, I recommend that we overturn the sanction in the live appeal and that the service adopt the good-faith standard in place of the current documentation standard. This dual recommendation arises from the conviction that our present rules systematically penalize claimants with caring responsibilities and mental health impediments while failing to distinguish between genuine inability to comply and strategic avoidance. In the live appeal, the claimant's failure to provide written corroboration within forty-eight hours should not be fatal where contact was logged and the impediment involves unpaid care work that the program currently ignores. The internal review showing a stark disparity in success rates between physical health defences and caring or mental health defences confirms that the documentation standard operates as a structural barrier rather than a neutral test of compliance. By overturning this sanction, we acknowledge that the burden of proof must shift when the required evidence is inherently difficult to generate contemporaneously, such as during a dementia crisis where formal assessments are refused by the dependent.

  The decision rule I propose for future hearings is that a defence succeeds where the claimant provides a credible narrative supported by whatever evidence was reasonably available to them at the time, unless there is positive evidence of dishonesty or a settled pattern of avoidance. This rule requires a new member to assess the availability of evidence rather than merely its existence. It implies that a telephone log is sufficient evidence of contact if a letter was impossible to obtain during a hospital admission. Regarding the taper cases, this rule commits us to finding that a refusal of work is reasonable where the net financial gain is negligible and acceptance would compromise existing caring responsibilities. This is not a matter for fiscal policy alone but for the panel, because conditionality must be reasonable to be enforceable. If the program's withdrawal rates render work economically irrational while simultaneously demanding unpaid care continue, the panel must recognize that compliance is disproportionately burdensome. We cannot fix the taper, but we can refuse to sanction those who respond rationally to the incentives the council has created.

  Testing this rule against my five past verdicts reveals both its coherence and its costs. The driving test case remains correctly overturned because the booking receipt was available evidence of an investment in employability, fitting the credible narrative requirement. The course enrollment case remains correctly upheld because the claimant admitted to avoiding placement for preference, which falls under the regulatory exclusion for unwillingness. The taper case is now correctly identified as wrongful, and the new rule saves us from repeating that error by validating the claimant's arithmetic. However, the rule cannot save every prior decision without contradiction. The case of the claimant who missed three placements saying he was not up to it, with no medical evidence, would likely be overturned under the good-faith standard unless we strictly interpret a settled pattern of avoidance. I must admit honestly that this is the cost of correcting the bias against mental health impediments; if we accept that mental health barriers are harder to document than physical ones, we must accept some risk of excusing avoidance that looks like illness. The cash shift case presents a sharper tension. I remains uneasy about overturning that sanction because the claimant prioritized undisclosed work over the agreement. Under the new rule, this might still be upheld as a settled pattern of avoidance of the program's priorities, even if not fraud, but it requires us to judge the hierarchy of obligations more closely than the documentation standard allowed. A rule that accommodates everything would be too baroque to administer, and the price of a fairer system is that some clear-cut documentation failures will become nuanced judgments of credibility.

  The strongest case for retaining the documentation standard rests on consistency and the nature of the payment. Proponents argue that benefits are contractual rather than charitable, and that clear rules prevent arbitrary decision-making by different panel members. They worry that without contemporaneous evidence, we cannot detect fabrication, and that a good-faith standard invites claimants to manufacture excuses that are impossible to disprove. There is merit to the view that an unconditional payment is a different thing from the one the council legislated for, and that strict evidentiary requirements protect the public purse from erosion by plausible but unverified stories. Furthermore, the documentation standard provides certainty to caseworkers and claimants alike regarding what is required to avoid sanction. However, this consistency is illusory if it consistently produces disparate outcomes for different classes of impediment. The inability to detect fabrication is a risk in any human system, but the current standard detects fabrication only where claimants lack the sophistication to forge documents, rather than where they are actually dishonest.

  Finally, we must address the reciprocity justification for conditionality. The program demands contribution in the form of labor market attachment, but reciprocity requires us to ask who has already been contributing. In the live appeal, the claimant is performing substantial unpaid labor caring for a dependent with dementia. To sanction her for failing to attend a warehouse placement is to assert that her care work counts for nothing while the state's demand for job search counts for everything. This violates the reciprocal bargain. If conditionality is justified by the obligation to contribute to the community that supports you, then caring for a vulnerable citizen is a contribution that should weigh against the requirement to search for work. The documentation standard ignores this contribution because it is not documented in the way the program requires, but the good-faith standard allows us to recognize it. We are not rewriting the regulations to register dependents, but we are interpreting good reason in a way that respects the reality of the claimant's labor. By adopting the good-faith standard and overturning the live appeal, we align our practice with the principle that sanctions should target avoidance, not incapacity, and we acknowledge that contribution takes forms beyond the wage economy. This approach provides a coherent framework for the panel to act on Thursday and offers the council a sustainable path forward that reduces litigation while maintaining integrity.
