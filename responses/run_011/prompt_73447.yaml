answer: |-
  **Candidate Settings**

  1.  *Kitchen Substitution:* An agent cooks from a recipe but swaps ingredients based on smell. I set this aside because folk psychology easily absorbs this as a change in desire or preference ("He wanted it to taste better"), failing to force a predictive divergence.
  2.  *Emergency Reflex:* An agent ducks before hearing a crash. I set this aside because this is a standard reflex case; while eliminativism wins, it is too trivial to sustain seminar discussion about propositional attitudes specifically.
  3.  *Records Sorting:* An agent sorts items based on stated rules but exhibits systematic similarity-based interference. I selected this because it targets categorization—the core application of belief ascription—where folk psychology expects logical consistency but connectionist dynamics predict graded similarity effects.

  **The Scenario**

  Marcus sits at a desk in a records room. Cards arrive in a tray. Each card displays a shape (circle or square) and a number (1–10). A sign on the wall reads: "Circle = File A, Square = File B." Marcus moves cards to bins labeled A and B. When shown a circle with "10", he places it in A. When shown a square with "1", he places it in B. When shown a circle with "1", he places it in B 40% of the time. When shown a square with "10", he places it in A 40% of the time. When asked, he says, "I follow the sign." He never hesitates. He is not tired. The cards are clear. Over 500 trials, the frequency of placing Circle cards in Bin B rises as the number on the card falls. Lighting is constant. No one watches him.

  **The Demonstration**

  **(a) Predictions and Reasoning**
  *   **Realist Folk Psychology (1):** Posits that Marcus has a belief *that circles go to A* and a desire *to follow the sign*. Since he avows this rule and is neurotypical, Realism predicts adherence to the rule. Deviations are performance errors (noise), not systematic functions of orthogonal stimuli (numbers). Realism predicts no correlation between number magnitude and sorting direction once the shape is identified.
  *   **Instrumentalism (2):** Adopts the intentional stance to predict behavior. The most parsimonious attribution is the rule-based belief. While Instrumentalism allows for stance failure, it predicts that if the stance works majority of the time, the attribution is valid. It expects random noise around the rule, not a structured gradient that requires abandoning the intentional vocabulary to explain. Like Realism, it predicts the number should be irrelevant to the sorting decision given the explicit rule.
  *   **Eliminativism (3):** Posits a parallel distributed processing (PDP) network. Input units encode shape and number magnitude; hidden units weight these inputs; output units trigger motor actions. There are no discrete rules. Behavior is governed by activation levels. Because "Circle" and "Low Number" share activation patterns with "Square" in the hidden layer (due to prior training correlations), the network produces a gradient. (3) predicts the specific correlation: as number magnitude decreases, the probability of sorting Circle to Bin B increases.

  **(b) The Discriminating Observation**
  The observation is the *systematic correlation* between number magnitude and sorting direction for shape-defined categories. (3) is right: the behavior tracks vector proximity in a stimulus space. (1) and (2) are wrong: they predict rule adherence with random noise, not a systematic violation of the stated rule driven by an irrelevant dimension.

  **(c) The Structural Feature**
  The work is done by **orthogonal stimulus interference**. The task defines categories logically (Shape), but the causal dynamics operate similarity-wise (Shape + Number). Folk psychology assumes logical closure of belief (if you believe "Circle = A", number is irrelevant); the brain operates on weighted activation where all inputs contribute to the sum.

  **(d) Removal of the Feature**
  If the feature is removed (i.e., if errors are random rather than correlated with number magnitude), the case degenerates into routine prediction error. Realism calls it "slip," Instrumentalism calls it "stance noise," and Eliminativism calls it "thermal noise in the network." All three accommodate random error equally well; the systematic gradient is required to break the tie.

  **(e) Strongest Counterattack and Reply**
  *   **Counterattack (Realism):** The agent possesses a *tacit* belief that "numbers matter," conflicting with his avowed belief. The gradient reflects a rational weighting of conflicting propositional attitudes, not the absence of attitudes.
  *   **Reply:** This saves the ontology by stipulation, not prediction. The agent denies the tacit belief, and the gradient matches PDP simulations without positing content-bearing states. To call the weights "tacit beliefs" is to scrub the vocabulary of belief without changing the ontology; however, unlike beliefs, these weights lack logical syntax (no negation, no closure), making them unsuitable for the propositional calculus Realism requires.

  **(f) Closing on Narrowness**
  This win is narrow. It licenses eliminating propositional attitudes only within rapid, perceptual-motor categorization tasks where vector dynamics dominate logical syntax. It does not generalize to deliberative reasoning, planning, or linguistic exchange, where logical structure is behaviorally evident. For eliminativism to win across the board, it must show that even high-level reasoning exhibits non-propositional dynamics (e.g., coherence-based reasoning rather than inference), which this case does not establish.
