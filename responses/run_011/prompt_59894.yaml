  The Night Register

  The stranger asked for a key but found none left.
  I looked down the long corridor of lights.
  My hand hovered above the open register.
  The desk lamp flickered on the full account.
  I rang the night bell to wake the sleepers.
  Told each to walk ahead to the next door.

  They poured inside past every open door.
  No single key could fit so many locks.
  I struck the bell again, a louder sound.
  The corridor stretched out beyond the glass.
  I turned the lamp to face the waiting line.
  And wrote the doubling rule in the register.

  The ink ran dry upon the crowded register.
  Still space remained behind each closed door.
  Shadows grew long beneath the desk lamp.
  I held a master key that shook in hand.
  The length of this corridor defies measure.
  No final bell announces where it ends.

  The silence follows after the last bell.
  Two meanings hide inside the word register.
  One counts the rooms along the corridor.
  One counts the guests behind each solid door.
  In finite walls these sums must match the key.
  Here the part fills up the whole beneath the lamp.

  I sign my name beneath the yellow lamp.
  The paper ends, though still rings the bell.
  I doubt I ever truly held a key.
  Just instructions copied in the register.
  Was there ever a wall behind that door?
  Or just a rule to walk the corridor?

  The brickwork stops, the corridor continues.
  I trust the light more than the solid lamp.
  No guest is lost outside the final door.
  Though no one hears the ending of the bell.
  The book is full, the list is the register.
  The rule itself provides the room, the key.

  Through the unbuilt corridor shines the lamp.
  No final bell hangs on the last door.
  The map is drawn within the register, the key.
