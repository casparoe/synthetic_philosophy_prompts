answer: |-
  You have identified a structural feature of comparative historical sociology that is widely practiced but rarely named as a singular maneuver. There is no single term of art in economic history that captures all three versions (Space, Outcome, Onset) as a unified phenomenon. However, the pattern is composed of three well-established concepts from the philosophy of science, spatial analysis, and causal inference.

  Here is the carving you requested: the existing concepts that map onto your observation, the distinctions, the stopping rule, and a proposal for naming the composite maneuver.

  ### 1. Existing Concepts and Distinctions

  The maneuver you describe is a composite of three distinct methodological phenomena. None covers the whole, but together they explain the mechanism.

  **A. The Modifiable Areal Unit Problem (MAUP)**
  *   **Source:** Spatial statistics and geography.
  *   **The Concept:** Statistical results (correlation, regression) change depending on how spatial boundaries are drawn (e.g., counties vs. states) or how data is aggregated.
  *   **Mapping to your observation:** This covers your **Space** version (Britain vs. Northern England; China vs. Jiangnan).
  *   **The Distinction:** In geography, MAUP is usually treated as a source of *bias* or error to be minimized. In the literature you are reading, it is being used as a *resource*. The author is not unaware of the boundary problem; they are exploiting the availability of alternative scales to preserve the causal link.

  **B. The Lakatosian "Protective Belt"**
  *   **Source:** Imre Lakatos, *The Methodology of Scientific Research Programmes*.
  *   **The Concept:** A research programme has a "hard core" (fundamental assumptions that are not abandoned) and a "protective belt" (auxiliary hypotheses that can be adjusted to absorb anomalies).
  *   **Mapping to your observation:** The "hard core" is the thesis that *specific factor X caused industrialization*. The "protective belt" is the definition of the units (Space), the metric (Outcome), or the period (Onset).
  *   **The Distinction:** Lakatos distinguishes between "progressive" shifts (the new belt predicts novel facts) and "degenerating" shifts (the new belt only explains what the old one failed to). Your observation is that these shifts are often *locally* progressive (better data for the new region) but *globally* degenerating (the thesis never risks falsification).

  **C. Selection on the Dependent Variable**
  *   **Source:** Gary King, Robert Keohane, and Sidney Verba, *Designing Social Inquiry*.
  *   **The Concept:** Choosing cases for study based on the value of the outcome variable (e.g., selecting "Industrialized" and "Non-Industrialized" cases) makes it impossible to infer causality, because you have pre-selected the divergence you wish to explain.
  *   **Mapping to your observation:** This underpins all three versions. By allowing the definition of the cases (Britain/China) to shift *after* observing the outcome, the author ensures the cases remain distinct on the dependent variable.
  *   **The Distinction:** Standard selection bias is usually a one-time error at the design stage. Your maneuver is dynamic: the selection criteria evolve iteratively to maintain the separation of the dependent variable.

  **Is there a single term?**
  No. In economic history, this is often discussed under the rubric of **"Unit Homogeneity"** (are the cases comparable?) or **"Equifinality"** (can different paths lead to the same outcome?), but neither captures the *adjustability* you describe. The closest pejorative term is **"Immunization Strategy"** (Hans Albert), but that implies bad faith, which you have rightly excluded.

  ### 2. A Proposed Term

  Since the pattern is real but unnamed as a composite, I propose: **Explanatory Rescaling**.

  *   **Definition:** A methodological maneuver in comparative history where the spatial, temporal, or definitional scale of the units of analysis is adjusted post-hoc to maintain the invariance of a causal thesis when confronted with counter-evidence.
  *   **Case that looks like it but is not:** A historian argues that "Protestant Europe" industrialized first. Evidence shows Catholic Belgium industrialized early. The historian revises the thesis to "Northwestern Europe," *and* uses this new category to correctly predict the later industrialization of Sweden (a case not used in the initial revision). This is **Refinement**, not Rescaling, because the new scale generates novel predictions outside the original dispute.

  ### 3. The Stopping Rule

  You asked for a criterion a referee could apply to distinguish refinement from rescue. The distinction lies in **independent testability**.

  **The Criterion: Novel Prediction vs. Accommodation**
  *   **Refinement:** The re-specified unit (e.g., "Jiangnan" instead of "China") is defined by characteristics *independent* of the industrialization outcome. Crucially, this new unit must allow the theory to make a prediction about a *third case* (e.g., "If Jiangnan is the unit, then the Tokaido in Japan should also show signs of X").
  *   **Rescue (Explanatory Rescaling):** The re-specified unit is chosen *because* it maximizes the contrast with Britain on the outcome variable. It absorbs the objection but makes no new claims about other regions or periods.

  **The Editorial Test:**
  Ask the author: *"Does this new boundary (spatial or temporal) allow you to predict the outcome for a case that was not part of the original comparison?"*
  *   If **Yes**: It is a theoretical refinement.
  *   If **No**: It is Explanatory Rescaling. The unit has been drawn to fit the data, not to test the mechanism.

  ### 4. Is the Question Well-Posed?

  The recurrence of Explanatory Rescaling suggests the question *"Why Britain and not China?"* is **ill-posed**.

  **The Problem of Reification**
  The maneuver persists because "Britain" and "China" are treated as natural causal units rather than administrative containers. Industrialization is not a national property; it is a local phenomenon (coal basins, specific institutions, regional markets).
  *   When the unit is "Nation," the comparison is vulnerable to MAUP.
  *   When the unit is "Region" (e.g., Lancashire vs. Jiangnan), the comparison becomes fixed, but the "Why not China?" question dissolves into "Why not other Chinese regions?"

  **Repairing the Question**
  To stop the rescaling, the comparison must be fixed **ex-ante** by mechanism, not by outcome.
  1.  **Fix the Unit by Input:** Compare regions with *similar initial conditions* (e.g., high wage economies, accessible coal, commercialized agriculture) regardless of national borders.
  2.  **Fix the Time by Process:** Do not pick a date (1800) and look for divergence. Pick a mechanism (e.g., steam engine adoption) and measure the time-to-adoption across fixed units.

  **Conclusion**
  The maneuver you have spotted is **Explanatory Rescaling**. It is the strategic use of the **Modifiable Areal Unit Problem** to protect a **Lakatosian Hard Core** from the implications of **Selection on the Dependent Variable**.

  It is defensible only if the rescaling generates novel predictions for cases outside the original binary. If it merely preserves the Britain/China contrast by shifting the goalposts of definition rather than evidence, it indicates that "Britain" and "China" are not the correct causal units for the theory being proposed. The question should be repaired by abandoning the nation-state as the unit of analysis in favor of the specific economic or ecological region where the causal mechanism actually operates.
