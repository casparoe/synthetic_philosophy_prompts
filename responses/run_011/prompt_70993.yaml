prompt: |-
  I have been asked to draft the criteria by which a festival jury will award a single prize for artistic achievement in film, and I do not want to begin with a rubric. Before I decide what jurors are entitled to weigh, I want the specification underneath it: what any theory of the bearing of a work's ethical character on its artistic value has to deliver in order to count as adequate, where adequate here means good enough to be defended to twelve intelligent non-specialists who will disagree with one another about the morality of at least two of the films in competition. State the requirements generally — a theory that works only for narrative film is not what I am after — though film may supply your examples.

  So: write the desiderata. For each, give the requirement and then the case or consideration that generates it; I want the reasoning behind the requirement, not a catalogue of labels. Mark which requirements are non-negotiable for any theory in this area and which turn out to be the doctrinal commitments of one camp dressed as neutral criteria. Where you think some subset cannot be jointly satisfied, say which and argue the incompatibility as tightly as you can — if that argument goes through, it is worth more to me than everything else in the answer.

  Some of the data an adequate theory has to reproduce. Treat all of these as stipulated; I have constructed them to be clean.

  (a) Production. A documentary in competition contains a sequence, universally singled out as its achievement, that the crew obtained by continuing to film a person in mortal danger rather than intervening. Nothing in the finished film records or rewards that decision, and no amount of attentive viewing could detect it. Does the discovery change the film's artistic value, or only our reasons for honoring it? If the former, by what mechanism, given that the film is unchanged?

  (b) Later conduct. The director of an otherwise unobjectionable film is credibly accused of a serious wrong after completing it and before the festival. The film is frame for frame what it was. A theory that says only the work matters must explain why that response feels like evasion here; a theory that says the maker matters must explain why a prize should turn on a fact no viewer can perceive.

  (c) Revealed intention. Years later we learn that a film long admired for its unflinching cruelty was built as a trap: the director intended to expose his audience's appetite for precisely what he showed them. The frames are identical, and the discovery changes our estimate for the better. If intentions matter here, why do they not matter in (a) — or why do they matter there too?

  (d) The virtuous and the inert. A film of impeccable moral outlook: humane, sincere, competent in every craft department, and utterly inert, such that nobody who has seen it once wants to see it again or thinks of it afterward. Any theory on which moral merit contributes to artistic value must fail to deliver the verdict that this is a strong candidate for the prize.

  (e) Genre relativity. A long, formally dazzling act of cruelty appears, unchanged in its particulars, in a slasher picture, in a realist family drama, and in an animated feature marketed to children. Our verdicts differ sharply. The theory must explain the difference without reducing artistic value to audience expectations.

  (f) Excision. The festival also screens a print from which the sequence in (e) has been removed, and nearly everyone who sees both agrees that the shorter film is the worse film. Whatever else the theory says about that sequence, it must account for its being at once a defect and load-bearing — or explain why that intuition is confused.

  (g) Complicity. A film recruits identification with a perpetrator so thoroughly that the viewer is made to want what the film simultaneously shows to be monstrous, and much of its power consists in that recruitment. Is the value located in the work or in the experience the work produces, and does a theory that answers otherwise lose anything?

  Second, the distinctions. I expect a theory here to be judged partly on whether it keeps certain pairs apart: the ethical character of a work and the ethical conduct of its maker; what a work depicts and what it endorses; the responses a work prescribes and the responses it happens to cause; artistic value and aesthetic value; a local defect and a defect in the work's governing attitude; the claim that a work is defective and the claim that I have reason not to watch it; and a work's being wrong about something and a work's being wrong in the way it makes me feel. Tell me which of these are load-bearing, which are artifacts of a particular position's vocabulary, and which collapse under pressure — and where they collapse, what has to replace them.

  Third, a constraint I do not know how to formulate. My jurors will disagree about the morality of the material, which is not a defect of the jury but the normal condition of criticism. I therefore need to know whether such a theory may let artistic value track the truth of a contested moral claim, or whether it must locate the defect in something that survives moral error — an attitude that fails by standards the work itself invites, say, rather than by the correct standards. Whichever way you take it, state it as a requirement and price it.

  If any of (a) through (g) is not in fact a datum — if the intuition behind it is confused, or belongs to one camp's ideology rather than to critical practice — say so and strike it from the specification. I would rather have a short list of real requirements than a long list of demands a theory is entitled to refuse.

  Finally, and briefly: how do the standing positions — that ethical defects are never artistic ones; that they can be, but only where they bear on a work's uptake; that a work is artistically defective whenever it prescribes responses that are ethically unmerited; and that ethical defects can themselves be a source of artistic value — fare against the list you end up with? A paragraph each, no citations, no literature review; I will not be checking your references. What I want from this section is a single verdict: which one requirement eliminates the most candidates. Leave the rubric to me, and keep the weight on the criteria, since the scoring is the part I could have guessed at.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Task:** Draft criteria (desiderata) for a theory connecting a work's ethical character to its artistic value, specifically for a film festival jury context.
      *   **Constraint 1:** Do *not* begin with a rubric. Focus on the specification underneath the criteria.
      *   **Constraint 2:** The theory must be defensible to twelve intelligent non-specialists who disagree on morality.
      *   **Constraint 3:** General applicability (not just narrative film), though film examples are okay.
      *   **Constraint 4:** For each desideratum, state the requirement and the reasoning/case generating it.
      *   **Constraint 5:** Mark requirements as "Non-negotiable" vs. "Doctrinal Commitments."
      *   **Constraint 6:** Identify incompatibilities between requirements if they exist (high value placed on this).
      *   **Constraint 7:** Address specific data points (a) through (g). Challenge them if they aren't actually data.
      *   **Constraint 8:** Address specific distinctions (ethical character vs. conduct, depicts vs. endorses, etc.). Determine which are load-bearing, artifacts, or collapse.
      *   **Constraint 9:** Address the "Constraint I do not know how to formulate" (Moral Truth vs. Internal Coherence given juror disagreement).
      *   **Constraint 10:** Evaluate standing positions (Autonomism, Moderate Moralism, Radical Moralism, Immoralism) against the final list.
      *   **Constraint 11:** Final verdict on which single requirement eliminates the most candidates.
      *   **Tone:** Rigorous, philosophical, precise, avoiding jargon where possible but maintaining conceptual tightness. No citations/literature review.

  2.  **Deconstruct the Data Points (a-g):**

      *   *(a) Production:* Non-detection of unethical production. Does it affect value? *Intuition:* It feels like it should, but if it's undetectable, how does it affect the *work*?
      *   *(b) Later Conduct:* Director's post-film wrongdoing. *Intuition:* Boycotting feels distinct from artistic critique, but ignoring it feels evasive.
      *   *(c) Revealed Intention:* Trap/Cruelty revealed later. *Intuition:* Changes value positively. Contrasts with (a).
      *   *(d) Virtuous/Inert:* Good morals, bad art. *Intuition:* Moral merit $\neq$ Artistic merit automatically.
      *   *(e) Genre Relativity:* Same act, different genres, different verdicts. *Intuition:* Context matters.
      *   *(f) Excision:* Removing the "bad" part makes the film worse. *Intuition:* The defect is load-bearing.
      *   *(g) Complicity:* Recruitment into monstrous desire. *Intuition:* Power lies in the experience/uptake.

      *Critique of Data:* Are these all solid?
      *   (b) seems weak as a datum for *artistic* value. It conflates honoring the person with honoring the work. I should challenge this.
      *   (a) is the "Hidden Flaw" problem. If the work is unchanged, can the *artistic* value change? This is the crux of the Autonomism vs. Moralism debate.
      *   (f) is crucial. It suggests ethical defects can be aesthetically functional.

  3.  **Develop the Desiderata (The Requirements):**

      *   *Requirement 1: The Detection Constraint.* If a feature cannot be detected in the experience of the work, it cannot constitute an *artistic* defect in the work itself (though it might affect our willingness to award). *Reasoning:* Based on (a). If the film is frame-for-frame identical, the *object* is identical. Artistic value supervenes on the work's features.
      *   *Requirement 2: The Merit Separation.* Moral merit does not entail artistic merit. *Reasoning:* Based on (d). A boring sermon is not good art.
      *   *Requirement 3: The Contextual Sensitivity.* Ethical valuation must be sensitive to genre and framing. *Reasoning:* Based on (e). Slasher vs. Drama.
      *   *Requirement 4: The Load-Bearing Defect.* An ethical flaw can be aesthetically integral. *Reasoning:* Based on (f). Removing the flaw ruins the work.
      *   *Requirement 5: The Uptake Condition.* Ethical value is tied to the responses the work prescribes/invites, not just what it depicts. *Reasoning:* Based on (g). Complicity matters.

      *Incompatibility Check:* Requirement 1 (Detection) vs. Requirement 4 (Load-Bearing Defect).
      *   If a defect is load-bearing, it's usually detectable (you feel the tension).
      *   But (a) suggests hidden production ethics.
      *   Actually, the real tension is between *Moral Truth* (Constraint 3) and *Juror Disagreement*. If value tracks moral truth, and jurors disagree on truth, they cannot agree on value. If value tracks internal coherence, we risk relativism.
      *   Let's look closer at (a) vs (c). (a) says hidden production ethics. (c) says hidden intention. If intention matters in (c), why not (a)?
      *   *Incompatibility:* The "Work-Immanence" requirement (value must be in the work) vs. The "Intentional/Production" requirement (value depends on genesis). I need to argue that for a *prize for artistic achievement*, Work-Immanence must win, rendering (a) and (b) irrelevant to *artistic* value, even if relevant to *honor*.

  4.  **Address the Distinctions:**

      *   *Work vs. Maker:* Load-bearing. Crucial for (b).
      *   *Depicts vs. Endorses:* Load-bearing. Crucial for (g).
      *   *Prescribes vs. Causes:* Load-bearing. A work can prescribe pity but cause laughter. Value lies in prescription.
      *   *Artistic vs. Aesthetic:* Tricky. Often collapsed. I should argue they collapse here. Artistic value includes cognitive/ethical engagement.
      *   *Local Defect vs. Governing Attitude:* Load-bearing. A slip vs. a worldview.
      *   *Defective vs. Reason not to watch:* Load-bearing. I can acknowledge a masterpiece I refuse to engage with.
      *   *Wrong about something vs. Wrong in the way it makes me feel:* The latter is more relevant to art.

  5.  **Address the "Unknown Constraint" (Moral Truth vs. Internal Standards):**

      *   *The Problem:* Jurors disagree on morality. If artistic value tracks objective moral truth, the jury is deadlocked.
      *   *The Solution:* The theory must locate the defect in *internal coherence* or *failure of uptake* rather than objective moral truth. The work fails if it invites a response that is *unmerited within the fictional world* or *incoherent*, not necessarily if it violates universal law.
      *   *Requirement:* **The Immanent Critique Constraint.** Ethical defects count as artistic defects only when they manifest as failures of imagination, coherence, or prescribed response *internal* to the work's project, not when they merely violate an external moral code contested by the jury.
      *   *Price:* This limits the scope. A film could be morally abhorrent (objectively) but artistically successful if it coherently executes that vision (Immoralism). Or, we admit we can't judge moral truth, so we judge the *handling* of the moral material.

  6.  **Evaluate Standing Positions:**

      *   *Autonomism (Ethics never matters):* Fails (g) and (f). Complicity and load-bearing defects matter.
      *   *Moderate Moralism (Ethics matters when it affects uptake):* Strongest contender. Fits (g), (d), (e).
      *   *Radical Moralism (Ethical defect = Artistic defect):* Fails (d) and (f). A virtuous film can be boring; a cruel film can be structurally essential.
      *   *Immoralism (Ethical defect can enhance value):* Fits (f) and (g) well, but struggles with (d) if not careful.

      *Eliminator:* The **Immanent Critique Constraint** (or Detection Constraint). It kills Radical Moralism (which says *any* ethical defect is an artistic one, even if hidden or external) and Autonomism (which says *no* ethical defect matters). It forces the theory to look at *how* the ethics function in the work.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone Check:* Needs to be authoritative, analytical, not academic-stuffy but precise.
      *   *Structure:*
          1.  Desiderata (with Non-negotiable/Doctrinal tags and Incompatibility note).
          2.  Distinctions (Load-bearing vs. Artifact).
          3.  The Moral Truth Constraint.
          4.  Evaluation of Positions.
          5.  Final Verdict.

      *Refining the Incompatibility:* The strongest tension is between (a) Production/Intention and the idea of the "Work" as the object of judgment. If we accept (a) as a datum for *artistic* value, we break the link between the object and the value. I will argue (a) and (b) are *not* data for artistic value, but for *institutional honor*. This is a crucial move. It simplifies the theory.
      *Refining the "Unknown Constraint":* Call it the **Public Accessibility Requirement**. If jurors disagree on morality, they must agree on the *criteria* of judgment. Therefore, judgment must be based on the work's success in its own terms, not external moral truth.

      *Refining the Distinctions:* "Artistic vs. Aesthetic" is often a trap. In film, they are usually fused. I'll mark that as collapsing. "Depicts vs. Endorses" is vital.

      *Refining the Positions:*
      *   Autonomism: Eliminated by (g) Complicity.
      *   Radical Moralism: Eliminated by (d) Virtuous/Inert.
      *   Immoralism: Hard to defend to non-specialists as a *prize* criterion ("We award this because it's wicked").
      *   Moderate Moralism (Uptake-based): The survivor.

      *Wait, one more check on (a):* The prompt asks me to strike data if it's confused. (a) is confused regarding *artistic* value. If the film is unchanged, the *art* is unchanged. The *honor* might change. I will strike (a) and (b) as data for *artistic* value, reclassifying them as institutional/ethical constraints on the *jury*, not the *theory of value*. This is a bold move that answers the "strike it" instruction.

      *Wait, check (c):* Revealed intention. If the frames are identical, does the art change? Yes, because art involves communication. If the message changes (from "cruelty is fun" to "cruelty is a trap"), the work's meaning changes. So (c) is valid data, (a) is not. Why? Because intention informs meaning in (c), whereas production ethics in (a) do not necessarily inform meaning. I need to be careful here. Actually, (a) is the stronger strike candidate.

      *Let's finalize the Incompatibility:* The tension between **Immanence** (value is in the work) and **Genesis** (value depends on history). I will argue Immanence must win for a *prize for artistic achievement*.

      *Let's finalize the "Unknown Constraint":* It's the **Disagreement Tolerance Requirement**. The theory cannot rely on moral truths the jurors dispute. It must rely on *procedural* ethics (coherence, honesty of engagement).

      *Final Verdict:* The requirement that **Ethical defects must manifest as failures of imagination or coherence (Uptake)** eliminates Autonomism (too narrow) and Radical Moralism (too broad).

  8.  **Writing the Content:** (Self-Correction during drafting)
      *   Make sure to explicitly mark Non-negotiable vs. Doctrinal.
      *   Ensure the "Incompatibility" section is sharp.
      *   Keep the evaluation of positions to one paragraph each.
      *   Ensure the tone matches the user's sophisticated prompt.

      *(Self-Correction on Data (a)):* The prompt asks: "If any of (a) through (g) is not in fact a datum... say so and strike it."
      *   My analysis: (a) and (b) are not data for *artistic value*. They are data for *institutional ethics*. I will strike them from the specification of *artistic* value. This clarifies the theory immensely.
      *   (c) is tricky. If the frames are identical, is the work identical? In film theory, the "work" often includes the intended communication. If the intention changes the *meaning* of the frames, the work changes. I will keep (c) but note the tension with (a).
      *   Actually, striking (a) and (b) is the most philosophically robust move for a "prize for artistic achievement." It isolates the aesthetic/ethical judgment from the biographical/production judgment.

      *(Self-Correction on Distinctions):* "Artistic vs. Aesthetic." In this context, they should collapse. Artistic value includes the success of the ethical engagement.
      *(Self-Correction on Constraint):* The constraint is about **Inter-Subjective Accessibility**.

      *(Final Polish):* Ensure the distinction between "Non-negotiable" and "Doctrinal" is clear. Non-negotiable = logic of the prize. Doctrinal = specific moral theory.

