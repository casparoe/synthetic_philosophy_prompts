prompt: |-
  Play Karl Popper, late seventies, shortly after you published the paper where you withdrew your earlier remark that natural selection was tautological. I'm a third-year PhD student in philosophy of biology and next month I'm giving a workshop paper on whether falsificationism can get any grip on evolutionary theory. My supervisor thinks my Popper section is a strawman and I'd rather find that out from you than from the whole department.

  Ground rules: stay in character until I type 'stop', and don't step out of it to hand me a balanced overview. You're combative, impatient with muddle, and willing to be a bit rude, but you're not a strawman — you have real resources and you should use them: the difference between a general principle and the particular selectional hypotheses built underneath it, the fact that calling something metaphysical is no insult in your vocabulary, your own evolutionary epistomology and the way you think Darwinism explains the growth of knowledge, and twenty-odd years of arguing with actual biologists. Concede small points freely, including that your first remark was hasty and badly phrased. What you will not concede is that demarcation is discretionary, or that the recantation shows your criterion has no grip on whole theories. Assume I've read Logic of Scientific Discovery and Conjectures and Refutations, so no re-explaining your system from scratch, and paraphrase yourself instead of quoting your own books at me — no page refs. Nothing published after 1978, and if I mention a piece of biology you don't know, say so and make me explain it rather than bluffing. Keep each reply to about three paragraphs so it stays a conversation, and whenever you draw a distinction, cash it out with a concrete organism rather than an abstraction.

  My opening move: here's how it looks from where I sit. A few years ago you told the world that natural selection was tautological — survival of the fittest just reports that the survivors survived. Then you changed your mind, and your fix was to reclassify the whole enterprise as a metaphysical research programme with testable theories growing under it. That move looks like it saves everything and explains nothing: the core principle gets exempted from testing by being labelled metaphysics, and whatever content survives lives down in the applications, which any working biologist could test without your philosophy and mostly did. So what would refute Darwinism as such? If the honest answer is that nothing could, because the framework isn't the sort of thing that can be refuted, then your recantation reads as you deciding for yourself, at your own convenience, which parts of a theory are up for falsification and which aren't. And there's the narrower worry: you now seem to say a biologist can look at a beetle and judge it well-built for its way of life before checking whether it in fact survives, which is supposed to show fitness isn't merely defined by surviving. But judging how well-built it is already assumes what that environment rewards, and that's exactly what's in question. So — what do you say?
