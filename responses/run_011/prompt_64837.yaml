answer: |-
  ### Brainstorming the Snap Points

  Before I defend the Rewind Rule, let's be honest about where it feels like it should break. If I'm going to stand up at this seminar and advocate for backtracking credences, I need to know where the shrapnel will fly.

  1.  **The Epistemic Time Travel Problem:** The rule requires me to recover $P_{old}$, my credence function before I believed $E$. But do I have access to that? If $E$ was learned long ago (like the perihelion of Mercury), my current cognitive state is built on the foundation of $E$ being true. Trying to subtract $E$ might collapse the whole web. I might not have records. This looks psychologically impossible.
  2.  **The Diachronic Dutch Book:** Standard Bayesianism protects you from sure-loss betting strategies if you conditionalize forward. If I update on $E$ at $t_1$, then at $t_3$ I "rewind" and update on $E$ again (effectively), haven't I double-counted? A bookie could sell me a bet on $H$ at $t_2$ (low price), then demand I update at $t_3$ (high value), then claim I'm inconsistent because I already paid for $E$ at $t_1$.
  3.  **The Normative Irrelevance of the Past:** Why should my *past* ignorance matter? If $E$ is true, it's true. If $H$ entails $E$, it entails $E$. The logical relation holds timelessly. Why does the fact that I *didn't know* $E$ five years ago license me to boost $H$ today? This smells like subjectivism run wild—confirming hypotheses based on my personal history of forgetfulness.
  4.  **Step (ii) Contamination:** The rule says conditionalize on everything learned *other* than $E$. But what if I learned $K$ *because* I assumed $E$? If $E$ and $K$ are entangled, stripping $E$ out makes $K$ unintelligible. The "clean room" required for Step (ii) might not exist.

  I'm going to set aside the "Contamination" worry for now; that's a general problem for any counterfactual reasoning (including standard Jeffrey conditionalization). The real killers are the **Dutch Book**, the **Psychological Access**, and the **Normative Force**. I will argue that the Rewind Rule survives the first two and actually turns the third into a virtue.

  ***

  ### The Case for the Rewind Rule

  Colleagues, the Problem of Old Evidence is usually framed as a bug in Bayesianism. I'm here to suggest it's actually a bug in our understanding of *when* confirmation happens. We treat confirmation as a synchronic relation between a current hypothesis and current evidence. But confirmation is an *event*. It is the moment a hypothesis locks onto a piece of uncertainty and resolves it. When $E$ is already certain ($P(E)=1$), there is no uncertainty to resolve, so there is no confirmation *at that time*.

  The Rewind Rule isn't a hack to make the numbers work; it is an attempt to locate the epistemic work in the correct temporal slot. Here is why you should adopt it.

  #### 1. The Numerical Worked Example

  Let's make this concrete. Suppose we are astronomers in the 19th century.
  *   **$H$**: A new gravitational theory (e.g., perturbations from an unseen planet).
  *   **$E$**: The observed orbit of Uranus (anomalous data).
  *   **$K$**: A calibration fact about the telescope learned *after* $E$ but *before* $H$ was formulated.

  **The Timeline:**
  *   **$t_0$ (Pre-Evidence):** You have a credence function $P_0$. You do not yet know $E$. You assign $P_0(E) = 0.5$. $H$ is not yet in your algebra, but for the sake of the Rewind Rule, we will assign it a counterfactual prior $P_0(H) = 0.1$. Let's assume $P_0(E|H) = 1$ (if $H$ is true, $E$ must be so).
  *   **$t_1$ (Learn E):** You observe Uranus. You conditionalize on $E$.
      *   $P_1(H) = P_0(H|E) = \frac{P_0(E|H)P_0(H)}{P_0(E)} = \frac{1 \times 0.1}{0.5} = 0.2$.
      *   $P_1(E) = 1$.
  *   **$t_2$ (Learn K):** You learn the telescope calibration $K$. $P_2(\cdot) = P_1(\cdot|K)$. Assume $K$ is independent of $H$ and $E$ for simplicity, so probabilities don't shift much. $P_2(H) \approx 0.2$. $P_2(E) = 1$.
  *   **$t_3$ (Formulate H & Discover Entailment):** You formulate $H$ seriously and realize $H \vdash E$.
      *   **Standard Bayesian Problem:** At $t_3$, your current function is $P_2$. $P_2(E) = 1$. Therefore, $P_2(H|E) = P_2(H)$. The realization that $H$ explains $E$ gives $H$ **no boost**. This is absurd. The explanation of the anomaly is the main reason to believe $H$.
      *   **The Rewind Rule Application:**
          1.  **Rewind:** Go to $P_0$.
          2.  **Update on Intermediates:** Conditionalize on $K$ (but *not* $E$). Let's call this $P_{rewind}$. $P_{rewind}(\cdot) = P_0(\cdot|K)$.
          3.  **Treat E as New:** Conditionalize on $E$ (and effectively introduce $H$ with its $t_0$ prior).
          4.  **Result:** $P_{final}(H) = P_0(H | K \land E)$.
          5.  **Calculation:** Since $K$ is independent, $P_0(H|K \land E) = P_0(H|E) = 0.2$.

  Wait, in this specific numbers, $P_2(H)$ was already 0.2 because I conditionalized on $E$ at $t_1$. The problem arises if $H$ was *not* in the algebra at $t_1$. Let's correct the scenario to the standard POE case: $H$ is **new** at $t_3$.

  **Corrected Scenario:**
  *   **$t_0$:** $P_0(E) = 0.5$. $H$ is not conceived.
  *   **$t_1$:** Learn $E$. $P_1(E) = 1$.
  *   **$t_2$:** Learn $K$. $P_2(E) = 1$.
  *   **$t_3$:** Conceive $H$. Assign prior $P_3(H) = 0.1$. Discover $H \vdash E$.
      *   **Standard:** $P_3(H|E) = P_3(H) = 0.1$ (because $P_3(E)=1$).
      *   **Rewind:** Go to $P_0$. Assign $H$ the prior $0.1$ (as a counterfactual insertion). Conditionalize on $K$. Then conditionalize on $E$.
      *   **Calculation:** $P_{final}(H) = \frac{P_0(E|H)P_0(H)}{P_0(E)} = \frac{1 \times 0.1}{0.5} = 0.2$.
      *   **Outcome:** The credence in $H$ doubles from 0.1 to 0.2. The explanatory power of $H$ is recognized.

  This shows the rule *works* mathematically to generate confirmation where standard conditionalization yields stagnation.

  #### 2. Defusing the Diachronic Dutch Book

  The charge is that I am vulnerable to a money pump because I am effectively updating on $E$ twice: once at $t_1$ and again at $t_3$.

  **The Defense:** This objection assumes that the "update event" at $t_3$ is the same kind of event as $t_1$. It is not. At $t_1$, I updated on the *truth of E*. At $t_3$, I am updating on the *logical connection between H and E*.

  Standard Dutch Book arguments assume a fixed algebra of propositions. They prove that if your credences don't align with probability axioms *over time*, you lose money. But the POE is precisely a problem of **algebraic expansion**. At $t_1$, $H$ did not exist in my epistemic space. You cannot Dutch Book me on a relation between $H$ and $E$ at $t_1$ because $H$ was not a live option.

  The Rewind Rule is a policy for handling *newly introduced hypotheses* that claim to explain *old certainties*. It is not a general license to re-conditionalize on old evidence whenever you feel like it. It is triggered specifically by the discovery of an entailment relation involving a *new* hypothesis. A bookie cannot pump me because they cannot force me to formulate $H$ at a time of their choosing. The "rewind" is not a reversal of a rational update; it is a relocation of the confirmation event to the only time it *could* have logically occurred: when $E$ was uncertain.

  If I bet on $H$ at $t_3$ (before the rewind), I bet at odds reflecting 0.1. After the rewind, I value $H$ at 0.2. Did I lose money? No, because the value of the bet changed due to a logical discovery, just as the value of a bet on "Checkmate in 3" changes when you see the move. The Rewind Rule simply ensures the ledger reflects that logical discovery correctly.

  #### 3. The Psychological Impossibility Objection

  Critics will say: "You can't recover $P_0$. I don't know what I thought about Uranus before I looked at the telescope."

  **The Defense:** Bayesian epistemology is already an idealization. We assume logical omniscience in many models; here I am asking for **Credence Archiving**. But even without a diary, this is no harder than the counterfactuals we accept in causal decision theory. When we ask "What would you have believed if...?" we are reconstructing a state, not digging up a fossil.

  To implement Step (i), you do not need perfect memory. You need a **reflective equilibrium** with your current self, minus $E$. You ask: "Given what I know now (excluding $E$), what *should* I have thought?" This turns the Rewind Rule from a psychological demand into a normative constraint. It commits you to the view that your current rationality depends on the coherence of your *possible* pasts.

  If you cannot reconstruct *any* plausible $P_0$ where $P(E) < 1$, then $E$ is indeed "too old"—it is part of your framework, not your evidence. In that case, $H$ *shouldn't* be confirmed by $E$. The Rewind Rule correctly identifies that some evidence is so foundational it cannot confirm anything new. The difficulty of rewinding is a feature, not a bug; it marks the boundary between evidence and framework.

  #### 4. The Normative Force of the Past (Why Rewind?)

  This is the deepest objection: "Why does my past ignorance matter? If $E$ is true, it supports $H$ regardless of when I learned $E$."

  **The Defense:** This assumes confirmation is a timeless relation between propositions. I deny this. Confirmation is a **triadic relation**: $H$, $E$, and **State of Information $S$**.
  $P(H|E)$ is only a measure of support if $E$ is uncertain in $S$. If $E$ is certain in $S$, $P(H|E) = P(H)$.

  When we say "General Relativity is confirmed by Mercury's perihelion," we are making a claim about the *history of science*, not just the logic. We mean that GR succeeded in resolving an uncertainty that existed for astronomers *at the time*. If Mercury's orbit had been known since the dawn of man as a necessary truth, GR would not be "confirmed" by it in the same way; it would merely be "consistent" with it.

  The Rewind Rule respects the **temporality of epistemic leverage**. You only get leverage against uncertainty. Once $E$ is certain, the leverage is gone. By rewinding, we are not saying the past is more real than the present. We are saying that the *epistemic work* was done in the past, and our current credence function must be adjusted to acknowledge where that work happened.

  If we don't rewind, we allow "free confirmation." We allow agents to invent hypotheses today that entail tautologies or settled facts and claim a boost in credibility without having risked anything. The Rewind Rule forces you to pay the epistemic cost: to get credit for explaining $E$, you must show that your hypothesis *would have* predicted $E$ when $E$ was still in doubt.

  ### Commitments

  Adopting the Rewind Rule commits you to two substantive claims:

  1.  **Past Credence Functions are Normative Anchors:** Your past self is not just a causal predecessor; it is an epistemic trustee. Rationality requires maintaining a coherent narrative of belief revision. You are committed to the idea that there is a "correct" credence you *should have had* before $E$, and that current rationality is partially defined by aligning with that counterfactual past.
  2.  **Confirmation is Essentially Diachronic:** You cannot solve the POE synchronically. You cannot find the boost in the current probability function alone. You must look at the trajectory. This means Bayesianism is not just a logic of static consistency, but a logic of learning histories.

  ### Conclusion

  The Rewind Rule is heretical because it breaks the forward-only flow of standard conditionalization. But the Problem of Old Evidence is itself a symptom of treating belief as a static stack rather than a dynamic process. The usual fixes (Garber, Jeffrey) try to squeeze the confirmation into the current moment by tweaking the algebra or the certainty. The Rewind Rule acknowledges the truth: the confirmation *already happened* when $E$ was new. We are merely correcting the ledger to show it.

  It avoids Dutch Books because it applies only to algebraic expansion. It avoids psychological impossibility by treating $P_{old}$ as a normative reconstruction. And it respects the nature of evidence by insisting that support requires uncertainty. If you want a Bayesianism that captures how science actually works—where the explanation of old anomalies is the strongest proof of a new theory—you have to be willing to rewind the tape.
