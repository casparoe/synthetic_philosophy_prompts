prompt: |-
  I have been reading around the ethics of asylum over the past few weeks, in preparation for a tutorial essay, and the person who has shaped my thinking most is an old friend of mine — a former immigration caseworker who reads political theory avidly, argues with great confidence, and is rather given to summarising whole positions over dinner. Last month he gave me what he insisted was a faithful account of Michael Walzer's argument in the chapter on membership in *Spheres of Justice*, together with what he called the legal reality that makes most of the philosophy academic. I found it persuasive at the time, and I have been building on it since. A reading set this week left me uneasy, though: some of what he said fits with what I half-remember of Walzer, and some of it sits badly, and I cannot tell which is which. I should confess at the outset that I am temperamentally on the cosmopolitan side of this debate, so I have an obvious motive to be told that he is wrong; please do not humour me on that account. Here is his summary, as near to his own words as I can reproduce it.

  'Walzer's starting point is that a political community is above all a distributive community. The first good it distributes is membership, and the reason admission matters so much is not that movement is intrinsically valuable but that everything else — the welfare arrangements, the language of public life, the sense of who owes what to whom — depends on who belongs. His master analogy is the members' club. A club decides whom to admit; no outsider has a claim to be let in; and that is not selfishness but a condition of the club being anything in particular. A state is the same, and the argument has nothing to do with property or territory, only with self-determination. From this he concludes that a state may in principle close its borders, even to people fleeing persecution, because the members' interest in reproducing their own common life outweighs whatever outsiders can claim. What is left over is a residual duty of mutual aid: help where you can, up to limits the community sets for itself. But that is charity rather than justice, which is why the familiar objection — that a state which helped produce the crisis, through its wars or its arms sales or the borders it once drew, must take in the people who fled it — never really bites on Walzer's own premises. At most it makes for a stronger case for generosity, and a state can always answer that the causal chain is too long to trace. The one concession he makes concerns people already inside. A state that has admitted guestworkers cannot simply ship them home once they stop being useful, and long residence ripens into a claim to membership — but he makes that concession prudentially, because mass expulsion would be politically and administratively impossible, not because the residents have acquired any right. And in any case the law has made most of this academic. The 1951 Convention defines a refugee as anyone who has fled their country because of persecution or war, and its central obligation, non-refoulement, forbids a signatory from sending such a person back. So once someone has arrived and cannot be returned, the question of who must take them in has been settled by treaty rather than left to the community's discretion, and what remains is only a question of numbers: how many a state can absorb without damaging the common life Walzer is so concerned about. That is why the interesting disputes are all about integration capacity, and why the communitarian wins the philosophical argument by default.'

  Could you go through this claim by claim and tell me how much of it I can trust? For each, I want it sorted into what Walzer would accept as stated, what is a defensible compression that loses something important, and what he would positively reject — and where he would reject it, what he says instead. Two things in particular are nagging at me. First, whether the analogy my friend treats as the load-bearing beam of the argument is really doing that work, or whether Walzer uses it illustratively alongside something else that the summary quietly drops. Second, whether the summary ever reaches a conclusion Walzer holds by a route he would refuse — that is, places where the answer is right but the reason attributed to him is wrong, which for my purposes is just as damaging as getting the answer wrong. Please also separate out the legal claims and handle them on their own terms: what the Convention's definition actually requires, who it therefore leaves outside the category, and precisely what non-refoulement settles as against what it leaves wide open — most obviously, whether it tells us anything at all about *which* state owes protection to a person who has arrived, or about the people who never reach a border in the first place. Finally, tell me whether his closing move survives the corrections: even once the summary is repaired, does it follow that the philosophical question is settled by treaty and that the communitarian wins by default? I would like to finish with a short list of the parts of his account I can carry into my essay with confidence, and the parts I should strike out altogether.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Evaluate a friend's summary of Michael Walzer's argument in *Spheres of Justice* (specifically the chapter on membership) and the associated legal claims regarding the 1951 Refugee Convention.
      *   **Structure:** Go claim-by-claim. Categorize each as: (1) Walzer would accept, (2) Defensible compression (loses nuance), (3) Walzer would reject (and explain what he says instead).
      *   **Specific Focus Areas:**
          *   The "members' club" analogy (is it load-bearing or illustrative?).
          *   Right answer/wrong reason (conclusions Walzer holds but for different reasons).
          *   Legal claims (1951 Convention definition, non-refoulement, allocation of responsibility).
          *   The closing move (does the treaty settle the philosophical question? Does the communitarian win by default?).
      *   **Output:** A detailed analysis followed by a short list of "keep" vs. "strike" points for the user's essay.
      *   **Tone:** Academic, precise, critical, not humouring the user's cosmopolitan bias.

  2.  **Deconstruct the Friend's Summary (Claim by Claim):**

      *   *Claim 1: "Walzer's starting point is that a political community is above all a distributive community. The first good it distributes is membership..."*
          *   **Assessment:** Accurate. This is the core of *Spheres of Justice*. Membership is the primary good because it determines the distribution of all other goods.
          *   **Category:** Walzer would accept.

      *   *Claim 2: "...the reason admission matters so much is not that movement is intrinsically valuable but that everything else... depends on who belongs."*
          *   **Assessment:** Accurate. Walzer is a communitarian, not a cosmopolitan. He values the integrity of the community over freedom of movement.
          *   **Category:** Walzer would accept.

      *   *Claim 3: "His master analogy is the members' club. A club decides whom to admit; no outsider has a claim to be let in; and that is not selfishness but a condition of the club being anything in particular."*
          *   **Assessment:** This is the tricky one (Focus Area 1). Walzer *does* use the club analogy, but he qualifies it heavily. He distinguishes between *neighbourhoods* (open), *clubs* (selective), and *states* (somewhere in between but closer to clubs regarding membership). However, he explicitly rejects the idea that states have *unlimited* discretion like a private social club. He argues states are more like "clubs" regarding the *right to exclude*, but not regarding the *reasons* for exclusion.
          *   **Category:** Defensible compression / Partially Reject. It loses the nuance that states have moral obligations clubs don't.

      *   *Claim 4: "A state is the same, and the argument has nothing to do with property or territory, only with self-determination."*
          *   **Assessment:** Mostly accurate. Walzer grounds the right to exclude in communal self-determination, not property rights (Lockean).
          *   **Category:** Walzer would accept.

      *   *Claim 5: "From this he concludes that a state may in principle close its borders, even to people fleeing persecution, because the members' interest in reproducing their own common life outweighs whatever outsiders can claim."*
          *   **Assessment:** **Major Error** (Focus Area 2). Walzer *does* argue states can generally control borders, *but* he makes a crucial exception for refugees. He explicitly states that communities are obligated to admit refugees when their own survival is at stake. The "club" analogy breaks down here.
          *   **Category:** Walzer would reject. He argues there is a duty of "mutual aid" that becomes a duty of admission when the outsider's life is at risk and the community's capacity allows it.

      *   *Claim 6: "What is left over is a residual duty of mutual aid: help where you can, up to limits the community sets for itself. But that is charity rather than justice..."*
          *   **Assessment:** Incorrect. For Walzer, mutual aid in extreme cases (refugees) is a matter of *justice*, not mere charity. It stems from the shared understanding of humanity, even within a communitarian framework.
          *   **Category:** Walzer would reject.

      *   *Claim 7: "...the familiar objection — that a state which helped produce the crisis... must take in the people who fled it — never really bites on Walzer's own premises."*
          *   **Assessment:** Plausible interpretation. Walzer focuses on the capacity of the receiving community and the need of the refugee, not necessarily historical culpability (though he acknowledges political responsibility generally).
          *   **Category:** Defensible compression.

      *   *Claim 8: "The one concession he makes concerns people already inside... long residence ripens into a claim to membership — but he makes that concession prudentially, because mass expulsion would be politically and administratively impossible, not because the residents have acquired any right."*
          *   **Assessment:** Incorrect. Walzer argues that guestworkers acquire a *moral right* to citizenship over time because their social membership becomes a reality. It's not just prudential; it's about the integrity of the sphere of membership.
          *   **Category:** Walzer would reject.

      *   *Claim 9 (Legal): "The 1951 Convention defines a refugee as anyone who has fled their country because of persecution or war..."*
          *   **Assessment:** Inaccurate. The 1951 Convention definition is specific (persecution based on race, religion, nationality, membership of a particular social group, or political opinion). It does *not* explicitly include "war" or general violence unless linked to those grounds (though regional instruments like the OAU Convention do).
          *   **Category:** Legally Incorrect.

      *   *Claim 10 (Legal): "...central obligation, non-refoulement, forbids a signatory from sending such a person back. So once someone has arrived and cannot be returned, the question of who must take them in has been settled by treaty..."*
          *   **Assessment:** Misleading. Non-refoulement prevents return to danger. It does *not* necessarily grant permanent asylum or determine *which* state is responsible if multiple are safe. It also doesn't apply to those who haven't reached a border.
          *   **Category:** Legally Imprecise/Overstated.

      *   *Claim 11 (Conclusion): "That is why the interesting disputes are all about integration capacity, and why the communitarian wins the philosophical argument by default."*
          *   **Assessment:** Does not follow. Even if non-refoulement applies, the philosophical debate about *why* we owe duties, *how many* we owe, and the rights of those *outside* the border remains open. The treaty doesn't settle the moral theory.
          *   **Category:** Reject.

  3.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the friend's summary (it's a common reading) but validate the user's unease.
      *   **Section 1: The Philosophical Claims (Walzer):**
          *   Address the "Distributive Community" point (Accept).
          *   Address the "Club Analogy" (Nuance/Reject). Explain it's illustrative, not absolute. The "lifeboat" exception is key.
          *   Address the "Refugee Exception" (Reject). This is the biggest error. Walzer *does* mandate admission for refugees in danger.
          *   Address "Mutual Aid vs. Justice" (Reject). It's a minimal moral standard, hence justice.
          *   Address "Guestworkers" (Reject). It's a moral right based on social facts, not prudence.
      *   **Section 2: The Legal Claims (1951 Convention):**
          *   Correct the definition (Persecution grounds, not just war).
          *   Clarify Non-Refoulement (Negative duty not to return, not positive duty to resettle permanently or allocate responsibility).
          *   Highlight the "Arrival" bias (Doesn't help those who can't travel).
      *   **Section 3: The Closing Move:**
          *   Analyze whether the treaty settles the philosophy. It doesn't. It shifts the debate but doesn't end it. Communitarianism doesn't win by default because the *limits* of obligation are still contested.
      *   **Section 4: Summary List (Keep/Strike):**
          *   Clear bullet points for the essay.

  4.  **Refining the Walzer Interpretation (Self-Correction/Verification):**
      *   *Check:* Does Walzer actually say refugees *must* be admitted?
      *   *Verification:* Yes, in *Spheres of Justice*, Chapter 2 ("Membership"), Walzer writes: "But communities are obligated to take in refugees... when their own survival is at stake." He distinguishes between ordinary migrants (can be excluded) and refugees (must be admitted if capacity exists). The friend's claim that Walzer allows closing borders *even to refugees* is the critical failure point.
      *   *Check:* Is the club analogy load-bearing?
      *   *Verification:* Walzer uses it to explain the *right to exclude*, but immediately limits it with the principle of mutual aid. It is not an unconditional right.
      *   *Check:* Guestworkers.
      *   *Verification:* Walzer argues "guest workers" are a violation of justice. If they are there, they must be offered a path to citizenship. It is a matter of rights, not administrative convenience.

  5.  **Refining the Legal Interpretation:**
      *   *Check:* 1951 Definition.
      *   *Verification:* "Well-founded fear of being persecuted for reasons of race, religion, nationality, membership of a particular social group or political opinion." "War" alone is not enough under the 1951 Convention (though often covered under subsidiary protection in EU law or broader definitions in Africa/Latin America).
      *   *Check:* Non-refoulement.
      *   *Verification:* Article 33. Prohibits expulsion/return. Does not mandate permanent residence (though usually implies it if no other safe country exists). Does not allocate quotas among states.

  6.  **Final Review against User Constraints:**
      *   Did I sort claim-by-claim? Yes.
      *   Did I address the analogy specifically? Yes.
      *   Did I address "right answer/wrong reason"? Yes (specifically on refugees).
      *   Did I separate legal claims? Yes.
      *   Did I evaluate the closing move? Yes.
      *   Did I provide the short list? Yes.
      *   Tone check: Respectful but firm on errors. No humouring of cosmopolitan bias (actually, Walzer is closer to the friend than the user, but the friend still gets Walzer wrong on key points).

  7.  **Final Polish:** Ensure clear headings and distinct sections for readability. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to swing too far to the user's cosmopolitan side. The prompt asks me *not* to humour them. Walzer *is* a communitarian. I must defend Walzer's actual communitarianism against the friend's *caricature* of it, which is actually *more* restrictive than Walzer. The friend makes Walzer sound like a hard nationalist; Walzer is a moderate communitarian. I need to make sure that distinction is clear. The friend says Walzer allows closing borders to refugees; Walzer says he does not. That is the pivot point.

  Also, on the legal point: The friend says the treaty settles "who must take them in." This is the "burden-sharing" problem. The Convention does *not* settle this. It only binds the state the refugee happens to reach. I need to emphasize this gap.

