answer: |-
  The dispute over the policy relevance of heritability hinges on a category error regarding the causal mechanisms of change. The familiar claim—that heritability ($h^2$) says nothing about modifiability—is correct regarding environmental interventions within a generation. The counter-claim—that the Breeder's Equation ($R = h^2 S$) licenses predictions about social programs—is mathematically sound but causally misplaced when applied to standard social policy. Importing the Breeder's Equation into social policy is **legitimate only under stated conditions**, specifically when the policy mechanism mimics biological selection rather than developmental remediation. For the vast majority of social interventions, which aim to alter phenotypes through treatment rather than genotypes through reproduction, the import is illegitimate.

  To understand why, we must first address the mechanism of selection. In animal breeding, selection operates through differential reproduction: parents with desirable traits are chosen to produce the next generation, thereby shifting the population's genetic mean. The Breeder's Equation predicts this intergenerational genetic response. In social policy, however, "selection" typically refers to differential treatment within a generation, such as admitting high-scoring students to a gifted program or targeting low-scoring families for aid. This selection does not alter the genetic composition of the next generation unless it influences reproductive success. Consequently, applying $R = h^2 S$ to predict the *treatment effect* of a program is a fundamental error. The equation predicts evolutionary change, not phenotypic plasticity. A program can shift the phenotypic mean arbitrarily (as with PKU diets) regardless of $h^2$, because the mechanism is environmental manipulation, not genetic sorting.

  Second, the validity of the Breeder's Equation relies on assumptions rarely met in social contexts. It assumes random mating and, crucially, a stable genotype–environment correlation (rGE). In breeding, environments are controlled to isolate genetic effects. In human populations, rGE is pervasive: individuals with genetic propensities for high cognitive ability often seek or evoke stimulating environments. If a social intervention disrupts this correlation—for example, by placing a child in a novel environment uncorrelated with their genetic background—the predictive power of $h^2$ estimated from the general population collapses. Furthermore, heritability is local to the range of environments sampled. If a policy introduces a radically new environment (outside the historical norm of reaction), the variance components ($V_G$ and $V_E$) may change, rendering the original $h^2$ estimate obsolete. The Breeder's Equation assumes linearity within the existing reaction norm; social policy often attempts to break that norm.

  Third, we must distinguish between variance and means. Heritability is a ratio of variances ($V_G / V_P$), describing individual differences within a population. Policy questions typically concern changes in the population mean. While the Breeder's Equation does predict a change in the mean ($R$), it does so by leveraging variance in breeding values to shift the genetic baseline across generations. It does not constrain how much the *phenotypic* mean can be shifted by a uniform environmental improvement within a generation. High heritability implies that current differences are largely genetic, not that the trait is immune to environmental shifts. Therefore, using $h^2$ to argue that a program cannot raise the mean is a statistical non sequitur.

  Finally, the phenomenon of "fade-out" in intervention studies is often misattributed to high heritability. Critics argue that if intervention effects disappear, the trait must be strongly genetically determined. However, fade-out is more parsimoniously explained by the difference between stable and transient environmental variance. If an intervention provides a temporary environmental boost (e.g., a one-year tutoring program) without altering the underlying developmental trajectory or sustaining the environmental support, the phenotype will regress when the support is removed. This reflects the transience of the environmental manipulation, not the immutability of the genetic liability. Evidence of fade-out is evidence about the sustainability of the environment, not the heritability of the trait.

  In conclusion, the Breeder's Equation is a powerful tool for predicting intergenerational genetic change, but it is not a law of phenotypic remediation. Importing it into social policy is legitimate only when the policy aims to influence genetic transmission or when the specific assumptions of the model are strictly met. For standard interventions aimed at improving outcomes within a generation, the statistic offers no constraint on efficacy.

