answer: |-
  (a) **Diagnostic Survey of Candidate Principles**

  To find a principle that respects your intuitions without collapsing into ad-hocery, we must survey the available philosophical frameworks for diachronic agency (agency over time).

  1.  **Lifetime Welfare Maximization:** Enforce the pledge if doing so maximizes the agent's total well-being over their lifetime.
      *   *Delivers:* Case 1 (Stroke reduces welfare), Case 3 (Games reduce long-term welfare).
      *   *Misses:* Case 2 (Better job likely increases welfare, yet you vote Bound), Case 7 (Business stake likely increases welfare, yet you vote Bound), Case 9 (You refuse to enforce large fines even if they might work better).
      *   *Diagnosis:* Rejected. You are not acting as a utilitarian calculator; you respect the *process* of commitment even when welfare outcomes are ambiguous.

  2.  **Cool Endorsement (The Hypothetical Consent View):** Enforce if the agent, under idealized rational conditions (no temptation, no emotion), would endorse the enforcement.
      *   *Delivers:* Case 3 (Cool self wants to write), Case 4 (Cool self allows wedding champagne), Case 5 (Cool self wants reconciliation).
      *   *Misses:* Case 5 (Unstable: Hot self knew the urge's strength; Cool self might be naive), Case 7 (Cool self is indifferent, just like Case 6).
      *   *Diagnosis:* Rejected. As you noted, this collapses the distinction between Case 6 (Conversion) and Case 7 (Opportunism), as both involve a Cool self that no longer cares.

  3.  **Psychological Continuity (The Lockean View):** Enforce only if the breaker is psychologically continuous with the signer.
      *   *Delivers:* Case 6 (Radical conversion breaks continuity = Released), Case 7 (Continuity holds = Bound).
      *   *Misses:* Case 1 & 2 (Circumstantial changes don't break continuity, yet verdicts differ), Case 5 (Temporary anger doesn't break identity, yet verdict is Released).
      *   *Diagnosis:* Promising for 6 vs. 7, but too blunt for 1, 2, and 5.

  4.  **Etiology of Preference Change (The Authenticity View):** Enforce unless the change in preference is "authentic" (deep, reflective) rather than "inauthentic" (akratic, opportunistic).
      *   *Delivers:* Case 6 (Authentic conversion), Case 7 (Inauthentic opportunism), Case 2 (Inauthentic priority shift).
      *   *Misses:* Case 1 (Stroke isn't a preference change, it's an impossibility), Case 5 (Anger is a state, not a preference change).
      *   *Diagnosis:* Strong contender, but needs to be combined with competence and impossibility conditions.

  5.  **Interpersonal Obligation (The Promise-Keeping View):** Enforce because a promise was made to the group (or wife).
      *   *Delivers:* Case 8 (Promise to wife), Case 2 (Contract with group).
      *   *Misses:* Case 1 (Group forgives emergencies), Case 6 (Why should the group care about internal conversion?).
      *   *Diagnosis:* Explains the external pressure, but fails to capture the internal rationality constraints you apply (like Case 5's competence check).

  (b) **The Proposed Principle**

  I commit to a hybrid principle that treats the pledge circle as a guardian of **Rational Agency Integrity**. This principle prioritizes the validity of the *act of willing* over the specific *content of the will*. It distinguishes between changes that defeat the *capacity* to pledge and changes that merely alter the *desire* to fulfill it.

  **The Integrity of Agency Principle:**
  *A pledge is enforceable if and only if:*
  1.  *(Competence)* *It was signed under conditions of cognitive competence, excluding temporary states of high arousal or impairment (Case 5);*
  2.  *(Possibility)* *Performance has not been rendered objectively impossible by unforeseen external catastrophe (Case 1);*
  3.  *(Continuity)* *The desire to breach stems from opportunistic preference shifts rather than a deep, non-instrumental transformation of core identity (Case 6 vs. 7);*
  4.  *(Spirit)* *The breach is not de minimis or contextually implied by the pledge's original purpose (Case 4);*
  5.  *(Proportionality)* *The penalty serves as a deterrent rather than a punitive threat disproportionate to the lapse (Case 9).*
  *Promises owed to third parties (Case 8) constitute a separate category of fiduciary duty and are not governed by self-binding rules.*

  *Traceability:*
  *   Clause 1 is forced by **Case 5** (Anger impairs competence). Cost: It risks letting agents escape commitments made during passion that they later value (the "hot self knew best" problem).
  *   Clause 2 is forced by **Case 1** vs. **Case 2**. Cost: Requires distinguishing "catastrophe" from "inconvenience," which can be subjective.
  *   Clause 3 is forced by **Case 6** vs. **Case 7**. Cost: Requires the group to judge the "depth" of a member's internal conversion, risking intrusive inquiry.
  *   Clause 4 is forced by **Case 4**. Cost: Introduces interpretive flexibility that could weaken strict contracts.
  *   Clause 5 is forced by **Case 9**. Cost: Paternalistically overrides the signer's agreed-upon terms.
  *   The Exclusion is forced by **Case 8**. Cost: Acknowledges that your system mixes self-binding with other-binding, which operate on different logics.

  (c) **Incoherence and Overturning**

  Your nine verdicts are remarkably coherent, but **Case 8** is the outlier that threatens the system's philosophical stability.

  *   **The Problem:** In Cases 1–7 and 9, the obligation is *intrapersonal* (self-to-self) or *contractual* (self-to-group). In Case 8, the obligation is *fiduciary* to a deceased person. Metaphysically, duties to the dead are contentious; practically, there is no beneficiary to release you. You admit you "cannot say for whose sake" he is bound.
  *   **Recommendation:** Overturn **Case 8**.
  *   **Reasoning:** If the pledge is to the *wife*, her death dissolves the counterparty. If the pledge is to *himself* ("I will honor her memory"), it falls under Case 6 (Identity). If he has changed such that restoring the garden no longer honors her memory in his eyes, he should be released. Binding him "for no one's sake" turns the circle into a engine of pointless suffering rather than rational agency.
  *   **Resentment:** You should least resent losing this verdict because it is the only one that does not serve the member's rational autonomy. Enforcing a vow to a ghost helps neither the living nor the dead.

  All other verdicts are accommodated. Case 9 is accommodated by the Proportionality clause (acknowledging that excessive penalties undermine the rational nature of the contract). Case 7 is accommodated by the Continuity clause (distinguishing opportunism from conversion).

  (d) **Application to New Cases**

  1.  **The Ten-Year Pledge (19-to-30):**
      *   *Application:* Apply Clause 3 (Continuity). The member speaks with "contempt," suggesting a value shift. However, the change was "gradual and continuous."
      *   *Verdict:* **Bound.** Gradual maturation is the expected function of a pledge, not a break in identity. Contempt for one's past self is common in growth; unless there is a *qualitative* break (like ordination in Case 6), the continuity of agency holds. The 19-year-old and 30-year-old are the same agent navigating time.

  2.  **The Unverifiable Trigger:**
      *   *Application:* Apply the implicit requirement of *Public Verifiability* inherent in a group-administered escrow.
      *   *Verdict:* **Void ab initio.** A pledge circle functions on mutual monitoring. If the trigger condition is private, the member is effectively judging their own case, which destroys the commitment device. It fails the "Possibility" of administration, even if the act is possible.

  3.  **The Recursive Pledge (Pledge to Pledge):**
      *   *Application:* Apply Clause 1 (Competence/Authority).
      *   *Verdict:* **Not Binding.** A commitment requires an initial anchor of voluntary choice. A chain that renews itself without a fresh act of will creates a "dead hand" control where the current self has no opportunity to authorize the constraint. It violates the sovereignty of the present agent.

  (e) **Defense of Your Vote (Case 7)**

  You enforced the pledge in Case 7 (Business Opportunity), despite the member's total indifference matching Case 6 (Conversion). You asked if this vote can be defended. **It can, and it must be.**

  The defense rests on the **Etiology of Change**. In Case 6, the change was *constitutive*: she became a different kind of person (ordained) for whom the goal was *repugnant*. In Case 7, the change was *instrumental*: he remained the same person, but his *circumstances* made the goal inconvenient.

  If you release Case 7, you destroy the pledge circle. You establish a precedent that "I found a better use for the money" is a valid exit clause. Every member who faces temptation can construct a narrative of "indifference." By holding him bound, you affirm that the pledge protects the *structure* of his agency against the *flux* of his preferences. You are voting not on his happiness, but on his integrity. The discomfort you feel is the cost of being the guardian of his future self against his present convenience.

  **The Principle:**
  A pledge binds the current self to the past self's will unless competence was impaired at signing, performance is objectively impossible, the penalty is punitive, or the agent has undergone a deep, non-opportunistic transformation of identity.

  \answer{The Integrity of Agency Principle; overturned: 8}
