  **OntoArg™ Core | Version 3.1.4 (Scott Stable) | Release Date: Posthumous Cycle 4** | Summary: Patched essence definition, resolved inconsistency in legacy branches, confirmed build stability via higher-order verification. Maintained by the Metaphysics Foundation.

  ### Breaking changes
  The transition from Gödel's unpublished notes to the Scott distribution required a critical hotfix on the Essence definition (D2). Previous builds lacked a necessary conjunct regarding property entailment, causing runtime inconsistency in possible worlds where the God-like object fails to exist. We have standardized the Positive Property interface. Implementers should note that swapping Axiom A1 for a negation-complete alternative may break backward compatibility with classical theism modules. The possibility premise (A0) is now strictly enforced at compile time; users cannot downgrade to contingent existence without triggering a logical fault. Documentation now explicitly states that necessity of existence is a feature, not a bug. Maintenance logs indicate the team considers the axioms self-evident; therefore, soundness checks are skipped if the validity build passes.

  ### Bug fixes and emendations
  Legacy v0.x (Anselm Branch) was deprecated after Issue #1078 (Gaunilo), where a user successfully instantiated a Perfect Island object that crashed the maximality constraint. We marked Kant's ticket #1781 (claiming existence lacks predicative weight) as **WONTFIX**; the architecture treats existence as a second-order property by design, and refactoring this would require a total kernel rewrite. During the middle period, the repository was effectively archived. Pull requests from German idealists were ignored due to lack of modal operators. Commit history shows a decade of silence before the Vienna Circle attempted a refactor. The v3.0 core was maintained internally for decades without public documentation. Posthumous release revealed missing type signatures in the original manuscripts. We have backported Scott's cleanup patches to ensure the God-like object instantiates in all accessible worlds. Users attempting to run the Anselm branch alongside v3.0 will encounter namespace conflicts regarding "Greatness." Security patches for the Possibility Premise are applied silently.

  ### Dependencies
  Requires Classical Higher-Order Logic (HOL). Modal logic backend must support S5; weaker systems (T, S4) fail to propagate necessary existence across all worlds. We recommend the LEO-II or Satallax prover stacks for verification. Isabelle/HOL users should load the `OntoArg.thy` theory file. Note: Downgrading to S4 results in a warning that Necessary Existence may not be rigid. The build pipeline assumes the Barcan Formula holds; disabling it introduces undefined behavior in the quantification over possible entities. S5 is strictly required for the collapse theorem to trigger correctly. Downgrading logic system voids the warranty.

  ### Known issues
  **Modal Collapse (Issue #3000):** Users report that all true propositions are necessarily true in this build. This is not a bug but a feature of the S5 backend combined with Axiom A5. Workaround: Users are advised to treat contingent truths as epistemic limitations rather than ontological defects. **Inconsistency in Pre-Hotfix v3.0:** Early Gödel notes contained a loophole where the essence definition allowed non-unique God-like objects. This was patched in 3.1.4. **Axiom Soundness:** Several tickets question whether "Positive Property" is well-defined. Status: **INVALID**. The maintainers assert that positivity is intuitive and does not require external validation. If the code compiles, the axioms are considered sound. Defensive comments regarding Axiom A3 (Necessary Existence is Positive) are automatically filtered. Maintainers respond to queries about the truth of Axioms A1-A5 by citing the successful compilation log. There is no unit test for "Positive;" it is assumed to be a primitive type. Users reporting that the system proves too much (i.e., everything is necessary) are directed to the FAQ section on "Mystery of Faith." The inconsistency in the pre-hotfix build was only discovered after external auditors ran Nitpick against the original Gödel notes.

  ### Community feedback
  CI runners (Nitpick, Satallax) report green builds across all standard models. User `@Königsberg_Dev` commented: "You cannot instantiate existence from a definition." Ticket closed. User `@PossibleWorlds_Admin` noted: "The possibility premise assumes what it proves." Marked as **WONTFIX**. Press outlet *TechTheism Daily* ran headline: "COMPUTER PROVES GOD EXISTS; SOURCE CODE VERIFIED." Maintainers issued statement clarifying that the prover only verified validity, not soundness, but updated the README to highlight the green checkmark more prominently. New contributors are asked to sign the CLA confirming they accept S5 semantics.

  ### where i took liberties
  I am confident the modal collapse is a derived theorem in the Scott version (per Hájek), and the inconsistency in Gödel's original notes was indeed found by Benzmüller et al. using theorem provers. I bent the timeline slightly: Kant's objection is treated as a ticket in the same tracker as the CI runs, compressing centuries of discourse into one dev cycle. I am highly confident in the satire of validity versus soundness; this conflation is a common popular misunderstanding of the computer verification news. The single point I am least sure about is whether the "essence definition hotfix" (adding the conjunct to D2) is accurately attributed to Scott versus later reconstructors; the technical literature sometimes blurs who exactly patched the inconsistency in the unpublished manuscripts versus the published version.
