  write me a **software release-notes / changelog document** for "the ontological argument," as if it were a legacy codebase maintained by a small team for roughly a thousand years. so it's the argument's own version history, in deadpan corporate-changelog voice, covering:

  - an ancient 0.x line built around a definition of a greatest conceivable being, and the very first bug report filed against it by a monk with a thought experiment about an island
  - a long middle period where the project is treated as effectively abandoned after a certain Königsberg professor files what amounts to a wontfix ticket arguing that existence is not a real predicate
  - a v3.0 rewrite by a reclusive logician that ships only as an internal design doc for decades and gets published posthumously
  - the widely circulated "Scott" release with axioms A1-A5, definitons D1-D3, corollary C and theorems T1-T3
  - a recent CI run where higher-order theorem provers (the Nitpick / LEO-II / Satallax / Isabelle crowd) check the whole thing, report the build green, and separately confirm that a couple of the older variants were actually inconsistent

  the joke i want is that validity and soundness get systematically conflated by the maintainers: "it compiles" is treated as though it settles whether the axioms are true, axiom swaps are logged as dependency bumps, and modal collapse gets filed under Known Issues with a workaround attached instead of being treated as a reason to distrust the core assumptions. the team should also be disproportionately defensive about the possibility premise and about the claim that necessary existence counts as a positive property. bonus points for treating the gap between Gödel's original notes and Scott's cleaned-up version as an unreviewed hotfix — the definition of an essence quietly gaining a conjunct, without which the build would have been flat-out inconsistent.

