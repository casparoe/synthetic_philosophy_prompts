  ### 3. Categorisation of Claims and Omissions

  **A. Claims that are wrong**
  *   **"Every war is a moment at which the world spirit supersedes a people."**
      *   *Reason:* Hegel reserves the judgment of the World Spirit for the rise and fall of *world-historical* peoples and principles. Most wars, in Hegel's account, are disputes over particular interests (boundaries, treaties) that do not necessarily signal a transition in the World Spirit's development.

  **B. Claims that are defensible readings but stated with more confidence than the text supports**
  *   **"The outcome shows which of the two was in the right."**
      *   *Reason:* Hegel is ambiguous here. He suggests that in the absence of a tribunal, the decision is made by events, but he also warns against equating success with moral righteousness in a simplistic sense. The "right" that is settled is often the *existence* of the state, not necessarily the moral justice of its specific cause in that conflict.

  **C. Things the question asked for that the answer never addresses (Omissions)**
  *   **The distinction between the justice of the *cause* and the standing of the *people*.**
      *   *Cost:* Part (d) specifically asks whether victory settles the justice of the *cause*. Your answer shifts to the justice of the *people's principle* in world history. While related, Hegel allows that a state might win a particular war (settling the immediate dispute) without necessarily embodying a higher world-historical principle. Failing to distinguish these two levels of "right" limits the accuracy of your response to part (d).
      *   *Deduction:* 3 marks deducted from the total available for part (d).
  *   **The limits of war conduct.**
      *   *Cost:* Hegel argues that war must be conducted in a way that preserves the possibility of future peace and mutual recognition (e.g., not destroying the internal life of the enemy state). This contextualizes the "justice" claim, suggesting victory does not grant unlimited rights over the defeated.
      *   *Deduction:* 2 marks deducted from the total available for part (d).

