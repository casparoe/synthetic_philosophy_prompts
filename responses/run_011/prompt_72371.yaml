  ### 5. Marker's Calibration Note (Part D)

  **What a First-Class Answer Would Have Said About Part (d):**

  To secure a mark in the 70%+ band, the answer needed to navigate the tension in Hegel between *particular right* and *world-historical right*.

  1.  **Particular Disputes:** In *Philosophy of Right*, Hegel acknowledges that states have particular disputes (e.g., border lines, treaty interpretations). In these cases, there is no arbiter, so war decides the issue. However, victory here only settles the *particular* claim, not the absolute moral justice of the cause. The "right" is indeterminate prior to the conflict.
  2.  **World-Historical Right:** The "Court of Judgment" applies properly to the *Weltgeist*. A state may win a war but be historically "dead" (e.g., a state clinging to an obsolete principle that momentarily succeeds but is destined to fall). Conversely, a state might lose a battle but embody the future principle.
  3.  **Conduct of War:** A first-class answer would note that Hegel limits the "right of victory." In *Philosophy of Right* (near the end of the International Law section), Hegel insists that war should not be waged against the internal life of the state (families, civil society) or in a way that precludes future peace. This implies that victory does not grant the victor the "justice" to annihilate the vanquished's ethical existence.
  4.  **Mutual Recognition:** Finally, Hegel emphasizes that states, even in war, recognize each other as sovereign entities. Victory does not reduce the defeated state to a thing; it remains a "state" to be treated with. A First Class answer would note that this mutual recognition limits the extent to which victory can be said to settle "justice"—it settles *power*, but the ethical relationship remains.

