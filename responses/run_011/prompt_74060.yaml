      7. Sign-off.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Product Safety Review Board
  **FROM:** [Your Name], Staff Software Engineer
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Probability Interpretations in Vision-Monitor Safety Case

  **Recommendation**
  I recommend we **approve the safety case subject to stated conditions**. Approving as written is technically indefensible; rejecting outright exposes the company to unacceptable commercial risk. We must resolve the semantic conflict before the number becomes a legal liability.

  **The Interpretive Disagreement**
  The safety case currently conflates three distinct interpretations of probability. This is not merely philosophical pedantry; each interpretation demands different evidence.

  1.  **Frequentist (Objective):** The reliability engineer treats the probability as a long-run frequency of physical events. This requires a stable population of units undergoing random degradation. Evidence must be empirical field data.
  2.  **Bayesian (Subjective/Epistemic):** The actuary treats the probability as a degree of belief based on available information. This requires calibrated expert elicitation. Evidence is the rigor of the elicitation process, not field hours.
  3.  **Propensity (Inherent):** The safety case text claims the number is a physical disposition of the system itself, independent of observation. This implies the software possesses an intrinsic "failure rate" akin to radioactive decay.

  Mixing these validates nothing. If the number is a frequency, the Bayesian network is irrelevant. If it is a belief, the predecessor field data is irrelevant. We cannot claim the number is an objective fact while deriving it from subjective elicitation.

  **The Arithmetic and Reference Class**
  We must address the hardware reliability engineer's claim regarding the predecessor system. The argument asserts that 4.2 million field operating hours with zero dangerous failures validates the $3 \times 10^{-9}$ per hour threshold. The arithmetic does not support this.

  In reliability engineering, zero failures in time $T$ allows us to calculate an upper bound on the failure rate $\lambda$ with a specific confidence level (typically 95%). Using the standard "rule of three" approximation ($\lambda \approx 3/T$):
  $$ \lambda \approx \frac{3}{4,200,000} \approx 7.1 \times 10^{-7} \text{ per hour} $$
  Our required threshold is $3 \times 10^{-9}$. The field data supports a failure rate roughly **230 times higher** than the requirement. To statistically validate $3 \times 10^{-9}$ with zero failures, we would need approximately 1 billion operating hours. We have 0.4% of the required evidence.

  Furthermore, the predecessor system (mats/light curtains) is the wrong reference class for a vision-based ML detector. Hardware components fail due to physical wear (aleatory uncertainty); software fails due to unhandled input states (systematic uncertainty). A light curtain's failure rate is physically measurable; an ML model's failure rate depends on the distribution of real-world inputs it encounters. Treating them as the same population is a statistical error that invalidates the frequentist claim.

  **The Auditor's Category Mistake**
  The safety-case auditor argues that assigning a failure rate to deterministic code is a category mistake. This objection is philosophically sound but pragmatically difficult. Software does not wear out; it either contains a bug or it does not. A "failure rate" for software is actually a measure of the probability that the operational environment will trigger a latent defect.

  For the auditor's objection to carry the day, we would need to abandon probabilistic metrics entirely in favor of purely argument-based assurance (e.g., formal verification of all input states). Given the complexity of unstructured vision data, exhaustive verification is impossible this quarter. However, the auditor is correct that claiming an *inherent* failure rate is misleading. We are not measuring a physical decay rate; we are quantifying our confidence that the system handles sufficient variety to avoid triggering latent defects. We must acknowledge this distinction to maintain integrity.

  **Defining the Number**
  If we keep the number, we must define it consistently.
  *   **Internally:** The figure $3 \times 10^{-9}$ is a **risk allocation target**, not a measured property. It represents the maximum acceptable contribution of this function to the overall cell risk, derived from the Bayesian belief network's confidence level rather than field frequency.
  *   **Externally (Customer):** We cannot state it is a measured frequency. It must be presented as a **Performance Level claim** compliant with relevant standards (e.g., ISO 13849 PL e / IEC 61508 SIL 3), which implicitly accepts the probabilistic modeling of systematic failures. We tell the customer the system is *designed and validated* to meet this target, not that it has been observed to do so.

  **Actionable Bottom Line**
  To approve this case, the following conditions must be met before shipment. These bridge the gap between philosophical rigor and commercial necessity.

  1.  **Revise Safety Case Wording (Owner: Safety Analyst):**
      Remove all claims that the $3 \times 10^{-9}$ figure is a measured frequency derived from predecessor hardware. Reclassify the number as a "Target Failure Measure" validated by the Bayesian belief network and architectural constraints. Explicitly state that software systematic failures are managed via diversity and validation, not physical reliability.
      *Deadline: 5 days.*

  2.  **Decouple Customer Communication (Owner: Product VP):**
      The procurement template requires a number, but not a definition. Provide the number to procurement, but attach the standard compliance certificate (e.g., SIL 3) rather than raw reliability data. If challenged, Legal must vet any statement implying empirical measurement of software failure rates.
      *Deadline: 1 week.*

  3.  **Validate ML Reference Class (Owner: ML Lead):**
      The predecessor hardware data is irrelevant to the ML detector. Submit a validation report demonstrating that the test dataset covers the operational design domain (ODD) sufficiently to justify the Bayesian confidence inputs. We must show the test data is representative of the field, even if the hours are insufficient for frequentist claims.
      *Deadline: 2 weeks.*

  4.  **Monitor Field Performance (Owner: Reliability Engineer):**
      Initiate a field data collection plan specifically for the vision system. Acknowledge that the 4.2 million hours from mats does not apply here. We need a separate telemetry stream to update the Bayesian network with actual field performance over the next 12 months.
      *Deadline: 1 month.*

  **Conclusion**
  We are not measuring a physical constant; we are constructing an argument for trust. The current safety case fails because it claims to measure what it actually estimates. By correcting the wording, isolating the customer communication, and validating the ML-specific evidence, we can ship without lying about the physics of software. Vote to approve with these conditions.
