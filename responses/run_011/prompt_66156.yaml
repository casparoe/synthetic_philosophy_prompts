          *   *Severity:* High. If tipping is sustained *only* by fear of shame (sanction), it's not a Lewisian convention (where I tip because I want to match your tipping). It's a norm.
          *   *Fix:* Distinguish conventions from norms, or argue the preference is internalized (making it coordination).

  4.  **Synthesize and Rank:**

      *   *Critical Contradiction:* Item 4 (Blind Drift/No Intention) vs. Item 5 (Tacit Promise/Agreement). You cannot promise blindly.
