      *   *Check:* Item 6 (Sanctions). Lewis explicitly tries to handle norms as conventions, but it's the weakest part of his theory. Bicchieri is stronger here. I need to tell the author that sociologists will reject Item 1+6.
      *   *Check:* Item 4 (Drift). Lewis is rationalist. Drift is evolutionary. Combining them requires a "Rational Drift" or "Evolution of Rationality" story. Simply saying "Drift satisfies Lewis" is hand-wavy.

  8.  **Final Polish:** Ensure the structure matches the prompt's requirements (Rank tensions, identify false tensions, flag interactions, single revision, final verdict).

  *(Self-Correction on Hume)*: Hume's view is that the *practice* of promising is a convention. The author says "participation... signals... a species of promise." This implies the convention creates the promise. Hume says the convention *is* the practice that makes promising intelligible. The author's claim that *conformity* is a promise is a specific interpretation (perhaps Gilbert or Simmons), but attributing it to Hume as "promising is conventional all the way down" is accurate enough, *except* for the "tacit agreement" part which Hume famously critiques in social contract theory. Hume rejects tacit consent for political obligation. Applying it to convention is risky. I will flag this.

