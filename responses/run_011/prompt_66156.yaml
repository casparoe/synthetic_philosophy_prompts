      *   *3. Language:* Lewisian application (truthfulness & trust convention).
      *   *4. Origins (Drift):* Blind drift (cultural evolution). No intention/convening. Synchronic/All-or-nothing conditions. Drift is the mechanism to satisfy (1).
      *   *5. Obligation/Promising:* Participation = tacit agreement/promise. Humean view (promising is conventional).
      *   *6. Sanctions:* Paradigms (tipping, queueing) sustained by punishment/guilt/shame. Removal = decay. Preference for conformity includes motive (sanctions).
      *   *7. Implicitness:* Agents don't need to state the rules or understand coordination problems. CK (Item 2) is compatible with this.
      *   *8. Arbitrariness vs. Entrenchment:* Originally arbitrary, now uniquely correct/ruinous to switch. Worried about conflict with Item 1 (Arbitrariness).
