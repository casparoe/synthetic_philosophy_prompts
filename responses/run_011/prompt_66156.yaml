          *   *Severity:* High. This is the "Lewis vs. Evolution" clash. Lewis requires agents to prefer conformity *because* others conform (rational choice). Drift suggests they conform because they copied (mimetic).
          *   *Fix:* Either weaken the rationality condition in Item 1 or admit drift only explains the *history*, not the *current sustaining mechanism*.

      *   *Tension 3: Arbitrariness (Item 1 & 8) vs. Entrenchment (Item 8).*
          *   Lewis requires an alternative *could have* served. Item 8 says switching is now ruinous.
          *   *Resolution:* Lewis allows this. Arbitrariness is about *origin* or *logical possibility*, not current cost of switching. QWERTY is arbitrary even if switching is costly.
          *   *Severity:* Low (False Tension). This is standard Lewisian fare.

      *   *Tension 4: Tacit Promise (Item 5) vs. Drift/No Intention (Item 4).*
          *   Item 4: Nobody intends the practice.
          *   Item 5: Conformity signals a promise (tacit agreement).
          *   *Conflict:* You cannot have a "tacit agreement" or "promise" (even Humean) if the process is *blind drift* with *no intention*. A promise requires intent to obligate.
          *   *Severity:* Very High. This is a direct contradiction. You can't have blind drift *and* tacit promising.
          *   *Fix:* Drop the "promise" language. Stick to "expectations" or "reliance."

      *   *Tension 5: Population Regularity (Item 1) vs. Small Group (Item 9).*
          *   Item 1: Regularity in behavior of members of *some population*.
          *   Item 9: 3 people = convention before population-wide regularity.
          *   *Conflict:* Lewis requires a *population* and a *regularity*. 3 people is a small population, but "before population-wide regularity existed" contradicts the definition in Item 1 if the "population" is defined as the faculty.
          *   *Severity:* Medium. Lewis allows sub-populations. But if the author claims it's a convention *before* the regularity is established, that violates Item 1's "regularity... such that nearly everyone conforms."
