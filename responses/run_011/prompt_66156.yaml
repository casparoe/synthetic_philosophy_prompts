  3.  **Evaluate Consistency & Factual Accuracy:**

      *   *Fact Check (Lewis):* Lewis *does* require Common Knowledge (or at least reason to believe). He *does* require arbitrariness (alternative regularity possible). He *does* treat it as a synchronic analysis of an existing state.
      *   *Fact Check (Bicchieri):* She replaces CK with empirical/normative expectations to make it empirically tractable. She distinguishes social norms from conventions more sharply than Lewis sometimes does, but her "empirical expectations" are weaker than CK.
      *   *Fact Check (Hume):* Hume *does* view justice/promising as artificial virtues (conventions). He *does* ground obligation in interest/sympathy/utility, not necessarily a "tacit promise" in the Lockean sense, though the "tacit agreement" language is often associated with social contract theory which Hume critiques. However, Hume *does* say conventions create obligation through mutual interest. The specific claim "signal is a species of promise" is a bit strong for Hume (who thinks promising *presupposes* convention), but defensible as a Humean *extension*.
      *   *Fact Check (Drift/Evolution):* Lewis is rationalist/individualist. Cultural evolution is population-level/selectionist. They can be compatible (mechanism vs. definition), but there's tension in *how* CK arises via blind drift.

      *   *Tension 1: CK (Item 2) vs. Implicitness (Item 7).*
          *   Lewisian CK is a high bar. "I know that you know that I know..." Does a relative driving on the right have *beliefs about beliefs*? Lewis allows "reason to believe" derived from salience or precedent, not necessarily explicit propositional attitude. However, strict CK is often criticized as psychologically unrealistic.
          *   *Severity:* Medium. Lewisians usually argue CK is dispositional or implicit. If the author insists on *strict* CK (Item 1 & 2) but admits agents have *no* beliefs about others' beliefs (Item 7), this is a contradiction.
          *   *Fix:* Clarify CK as dispositional/implicit, not explicit propositional knowledge.

      *   *Tension 2: Drift (Item 4) vs. CK (Item 2) vs. Rationality.*
          *   Lewis's agents are rational maximizers solving coordination problems. Drift (Item 4) implies blind variation/retention, not necessarily rational calculation of conditional preferences.
