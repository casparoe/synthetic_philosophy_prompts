      *   *Check:* Is the tone right? Needs to be sharp, not condescending, but authoritative enough to help them in office hours.
      *   *Check:* The classmate's claim ("no neutral standpoint"). This sounds like Thesis 4 (Epistemic Closure), but Foucault usually stops at Thesis 3 (Constitutive). I need to clarify that distinction because Thesis 4 is the one that "falls over." The classmate might be conflating them.
      *   *Refinement on Thesis 3:* Make sure to explain *why* it blocks the calibration argument. If the "outcome" (rearrest) is constituted by the power apparatus, then calibration is circular. It measures fidelity to the apparatus, not fidelity to nature.

  9.  **Final Review against constraints:**
      *   Numbered menu? Yes.
      *   Trivial to radical? Yes.
      *   Verdicts (Platitude/Substantive/Falls over)? Yes.
      *   Evidence specified? Yes.
      *   Calibration block/stand? Yes.
