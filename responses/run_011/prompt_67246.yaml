answer: |-
  Dear friend,

  It is a pleasure to engage with this question, and I want to reassure you immediately that your background in engineering is not a handicap here but rather an asset. Philosophy often suffers when it drifts too far from the concrete mechanics of decision-making, and your instinct to test a theoretical objection against a historical stress case is exactly how these ideas should be handled. You have constructed a rigorous test bed for James Lenman's argument, and I will do my best to run the simulation you have requested without introducing unnecessary jargon or hiding behind ambiguity.

  To begin with the mapping you requested, we must first settle the question of agency. In a consequentialist framework, the agent is the entity whose action causally initiates the chain of events being evaluated. While the Medical Research Council made a decision to withhold funding, their inaction was a boundary condition rather than the proximate cause of the birth. Similarly, while Lesley and John Brown consented, they lacked the technical capacity to execute the procedure themselves. The primary agents under the consequentialist description are Robert Edwards, Patrick Steptoe, and Jean Purdy acting as a unit. They possessed the technical knowledge, the agency to proceed or halt, and the control over the variables. One could argue that Lesley Brown is a co-agent because her consent was necessary, but for the purpose of evaluating the moral calculation regarding the introduction of a new technology into the world, the clinicians bear the burden of the foresight. They were the ones introducing the variable into the system.

  Now we must reconstruct the calculation as it would have appeared in November 1977, stripping away all hindsight. The live options were essentially binary: proceed with the embryo transfer or halt the clinical program indefinitely. A third option, handing the technique to others, was practically nonexistent since no one else was close to achieving the milestone. The information available to them was sharply divided. On the positive side, they knew Lesley Brown suffered from blocked fallopian tubes and had endured nine years of infertility, a source of significant psychological and social distress. They knew that animal models had shown viability, though human success was unproven. On the negative side, they knew the procedure involved laparoscopic surgery with associated risks to the mother, and they knew nothing about the long-term health of a child conceived outside the womb. There were fears of chromosomal abnormalities or developmental issues, but no data existed to price these risks. Crucially, regarding the cascade of events you listed—the commercial industry, the legal frameworks, the germline editing—the information set was zero. Those facts did not just exist in a hidden drawer; they were contingent on the success of this very decision.

  This brings us to the core of Lenman's objection. Lenman argues that consequentialism requires us to choose the action that produces the best overall outcome. However, because causal chains extend indefinitely into the future, and because we are epistemically limited, we cannot know the overall outcome of any significant action. Therefore, the theory demands we do something we cannot know how to do. In the Oldham case, does this show the calculation was empty or merely difficult? I believe the case supports the stronger claim that it was empty, at least regarding the long-term consequences. You suggest that a consequentialist might treat the unknowable long run as a wash, assuming positive and negative unknowns cancel each other out. Lenman would reject this. He argues that the variance is too high. The potential for catastrophic negative outcomes in the long run, such as eugenics or societal destabilization, could theoretically outweigh the immediate benefit of one child's birth, just as the potential for a utopian resolution of infertility could outweigh it. Without knowledge of the weights, the equation does not balance to zero; it remains undefined. To proceed is to guess, not to calculate.

  Here is where your first distinction becomes vital. You separate cluelessness that better inquiry could cure from cluelessness that no inquiry could cure because the facts did not exist. The health risks to Louise Brown fall into the first category, though in 1977 they were functionally in the second. They could have waited for more animal data, but human physiology was the unknown variable. The societal shifts and germline editing fall squarely into your second category. These were not merely unknown facts; they were non-existent futures contingent on the success of the procedure. Lenman's objection bites hardest on this second category. If the objection only applied to things we could have known but were too lazy to check, it would be a critique of competence, not theory. But because it applies to things that literally could not be known, it strikes at the feasibility of the theory itself. In 1977, no amount of inquiry could have revealed the moral status of germline editing in 2025. Therefore, a strict consequentialist in 1977 was required to maximize an outcome that was ontologically inaccessible.

  Your second distinction, borrowed from risk registers, is equally penetrating. You separate what was priced, what was known to be unpricable, and what never occurred to anybody. I suspect you are right that the objection only truly bites on the last of these, the unknown unknowns, specifically the incurable subset. However, I would caution against concluding that this makes the objection harmless. In risk engineering, you might accept unknown unknowns as a residual risk to be managed. In moral philosophy, if the theory says you must maximize the good, you cannot simply manage the residual risk; you must account for it. If the unknown unknowns contain a catastrophe of sufficient magnitude, the decision to proceed was objectively wrong, even if no one could have known it. This leaves the agent in a position where they can never be sure they are acting morally. This is not a narrow technicality; it is a paralyzing condition for any moral system that claims to guide action.

  This leads directly to your question about moral luck. If the outcome had been a badly harmed child, would the decision be wrong? Under strict consequentialism, yes. The morality of the act is determined by the outcome. If Louise Brown had been born with severe defects caused by the procedure, the suffering caused would likely outweigh the relief of the parents' infertility, rendering the act morally wrong. If she is born healthy, as she was, the act is morally right. This means Edwards and Steptoe were not moral agents making a reasoned choice; they were gamblers who got lucky. This aligns with Lenman's view that consequentialism disconnects the rationality of the decision from the morality of the act. They did the best they could with the evidence, but if the evidence leads to a bad outcome, they are condemned. This feels intuitively unjust to most people, which suggests either our intuition is wrong or the theory is failing to capture something essential about moral responsibility, namely the quality of the deliberation rather than the luck of the result.

  You also ask about the defense Edwards and Steptoe offered, focusing on the identifiable couple in front of them. Is this the retreat Lenman recommends? Lenman does suggest that we often rely on local rules and heuristics because global calculation is impossible. Focusing on the relief of identifiable suffering is a heuristic. It is a way of bounding the problem so it becomes solvable. However, there is a tension here. If Edwards and Steptoe were truly acting as consequentialists, they should have been worried about the millions of future children and the societal shifts. By focusing only on Lesley Brown, they were effectively switching moral frameworks mid-calculation. They were acting more like care ethicists or deontologists fulfilling a duty to their patient than like utilitarians maximizing global welfare. Lenman might say this proves his point: when faced with cluelessness, even committed consequentialists abandon the theory in practice and revert to local duties because the global calculation is impossible. They did not actually perform the consequentialist calculation; they performed a different kind of moral reasoning that was compatible with their epistemic limits.

  So, where does this leave us with your specific verdict? You asked whether the case shows the calculation was empty or only difficult. I believe the Oldham episode demonstrates that the calculation was empty regarding the long-term consequences, which are the very consequences that matter most for a technology with cascading effects. The immediate consequences were calculable within a margin of error, but the long-term consequences were not just uncertain; they were undefined. This supports Lenman's claim that consequentialism cannot guide decisions where the causal horizon is long and opaque. Your distinction about incurable cluelessness strengthens this. If the facts do not exist, they cannot be weighed. A consequentialist cannot weigh non-existent facts. Therefore, the theory has nothing to say about the long-term morality of the decision at the time it was made. It can only judge it retrospectively.

  Does this mean the objection is harmless because we must act on the evidence we have? Not necessarily. It means that consequentialism cannot be the sole arbiter of such decisions. It can tell us to weigh the known risks and benefits, but it cannot tell us whether proceeding is the right thing to do in a global sense. It leaves a vacuum where the most significant moral questions lie. This is not harmless; it suggests that for decisions involving deep uncertainty and long causal chains, we need a moral framework that values precaution, duty, or consent over outcome maximization. The fact that the outcome turned out magnificently does not vindicate the decision within consequentialism; it only vindicates it retrospectively. At the moment of decision, the agents were flying blind, and the theory offers no navigation system for blind flight other than hope.

  There is one final point where I must concede the framework has nothing to say, as you requested. Consequentialism struggles to account for the moral significance of the process itself. It cannot easily explain why we feel Edwards and Steptoe were brave rather than reckless, independent of the outcome. It cannot account for the value of Jean Purdy's contribution being unacknowledged, unless that lack of acknowledgment caused measurable harm. It treats the agents as vessels for producing outcomes rather than as authors of actions. In the Oldham case, the human element—the desperation of the Browns, the dedication of the team, the societal resistance—is central to how we understand the event. A purely consequentialist map flattens these textures into units of utility. If you feel something is lost in that translation, you are identifying a limit of the theory, not a failure of your understanding.

  In summary, the birth of Louise Brown serves as a powerful validation of Lenman's cluelessness objection. It shows a scenario where the agents had to act without the knowledge the theory demands they possess. Your distinctions clarify that the problem is not just epistemic humility but ontological limitation; the future was not waiting to be discovered, it was waiting to be created. The consequentialist calculation was therefore empty regarding the very things that now define the moral landscape of IVF. The agents proceeded using a different moral logic, one focused on local duty and identifiable suffering, which suggests that in practice, we abandon strict consequentialism when the stakes are high and the lights are low. The theory might judge them right now, but it could not have guided them then. I hope this analysis serves your purpose without overstepping into speculation, and I remain happy to discuss further if any of these mappings require adjustment.
