answer: |-
  ### The Specification

  To function as a single legal agent capable of signing, defending, and sustaining a verdict, the board's aggregation rule must deliver the following:

  1.  **Logical Integrity (The Statutory Constraint)**
      *   **Requirement:** The collective verdict must obey the logical structure of the governing rule. If the board collectively affirms the premises required for a violation, it must affirm the violation.
      *   **Case:** In your scenario, the rule is $Violation \iff (OverLimit \land \neg InstrumentFault)$. If the board's official finding is "Yes" on both premises, the official verdict cannot be "No." To do so is to issue a legal contradiction that an appellate court will vacate as arbitrary.

  2.  **Collective Agency (The "One Voice" Constraint)**
      *   **Requirement:** The written opinion must assert propositions that the board, as a body, endorses. It cannot attribute findings to a coalition that does not exist.
      *   **Case:** The opinion cannot state "We find the emissions were over the limit" if three members voted "No." It must state findings that command a majority *as findings*, not just as steps toward a verdict.

  3.  **Traceability (The Defense Constraint)**
      *   **Requirement:** Every factual assertion in the final order must be traceable to a specific majority vote on that assertion.
      *   **Case:** If the company appeals, the court asks, "On what basis did you find a violation?" If the answer is "Three of us thought X, three thought Y, but only two thought Violation," the board admits it has no coherent basis. The reasons must match the votes.

  4.  **Determinacy (The Operational Constraint)**
      *   **Requirement:** The procedure must yield exactly one verdict (Violation or No Violation) for every possible configuration of votes.
      *   **Case:** A company cannot operate under a "set of admissible verdicts." The letter must say one thing.

  5.  **Procedural Stability (The Time Constraint)**
      *   **Requirement:** The aggregation rule must remain invariant even if board membership rotates.
      *   **Case:** If you sit next year on a nearly identical case, the *method* of deciding must be the same, even if the *outcome* differs due to different members. Equal treatment under law requires stable procedures, not stable outcomes.

  ***

  ### Verdict on Contested Requirements

  *   **Equal Weight:** **Dropable.** While politically preferred, it is not load-bearing for agency. If the chair has a statutory casting vote, inequality is built into the design. The board can still own the verdict as long as the voting rule is known in advance. Legitimacy comes from the rule, not strict arithmetic equality.
  *   **Traceability:** **Load-Bearing.** You cannot defend a verdict on appeal if the written reasons contradict the vote tally on those reasons. If you vote on the bottom line only, you cannot truthfully write findings of fact that a majority rejected. This is the primary vulnerability in litigation.
  *   **Strategy-Proofness (Hard to Steer):** **Nice-to-Have.** It is desirable that members vote sincerely, but no rule is perfectly immune to tactical voting. Prioritize Logical Integrity and Traceability over preventing gaming; a manipulable rule that produces a legally sound verdict is better than an unmanipulable one that produces a contradiction.
  *   **Determinacy:** **Load-Bearing.** You must produce a single letter. Ambiguity here constitutes a failure of the board's basic function.
  *   **Rotation/Consistency:** **Procedural Only.** The rule must not change when members rotate. Do not demand the *outcome* remain the same for similar cases across years; demand the *method* remains the same. Outcomes will shift with personnel; that is a feature of a deliberative body, not a bug.

  ***

  ### The Incompatibility Result

  You cannot meet all reasonable demands simultaneously. There is a specific cluster of requirements that creates a logical crash.

  **The Smallest Conflicting Cluster:**
  1.  **Premise Majoritarianism:** The board accepts a premise (e.g., Over-Limit) if a majority votes "Yes."
  2.  **Conclusion Majoritarianism:** The board accepts the verdict (Violation) if a majority votes "Yes."
  3.  **Logical Integrity:** The verdict must follow logically from the accepted premises.

  **The Damage Doer:**
  **Proposition-Wise Majority Rule.** This is the demand that *every* question (premises and conclusion) be settled independently by a simple majority. In your specific case, this demand forces a contradiction: The majority says "Yes" to Premise 1, "Yes" to Premise 2, but "No" to the Conclusion. You cannot have all three.

  **The Single Requirement That Knocks Out the Most Candidates:**
  **Logical Integrity.** Because your board is bound by a statute ($A \land B \rightarrow C$), you cannot simply ignore the logic. This requirement eliminates any procedure that allows a majority "No" on the verdict when there is a majority "Yes" on all necessary premises. It forces you to abandon either Premise Majoritarianism or Conclusion Majoritarianism.

  ***

  ### Scorecard of Contenders

  **1. Premise-Based Procedure (Vote on findings, derive verdict)**
  *   **Method:** Tally votes on Over-Limit and Instrument Fault. Apply the rule. Ignore the direct vote on Violation.
  *   **Performance:** Satisfies Logical Integrity and Traceability. Fails Conclusion Majoritarianism (as seen in your case: 3-2 for violation, but 3-2 against).
  *   **Best For:** Legal defensibility. It ensures the written order never contradicts the math.

  **2. Conclusion-Based Procedure (Vote on verdict, ignore findings)**
  *   **Method:** Tally votes on Violation only. Treat premise votes as advisory.
  *   **Performance:** Satisfies Conclusion Majoritarianism. Fails Logical Integrity and Traceability. You must write findings that a majority of the board may have explicitly rejected.
  *   **Best For:** Political compromise. It allows members to agree on an outcome for different reasons, but leaves the board vulnerable on appeal.

  **3. Sequential/Hybrid Procedure (Vote findings; if conflict, revote verdict)**
  *   **Method:** Vote premises. If they imply a verdict that loses a direct majority vote, hold a second vote on the verdict to override.
  *   **Performance:** Satisfies Determinacy. Fails Logical Integrity (sometimes) and Procedural Stability (outcome depends on order of voting).
  *   **Best For:** Avoiding rebellion. It acknowledges the paradox but risks inconsistency year-to-year depending on which vote is held first.

  **Recommendation:** Adopt the **Premise-Based Procedure**. Your primary risk is appellate vacatur for arbitrary decision-making. A contradiction between findings and verdict is fatal in court. A contradiction between the verdict and the "will of the majority on the bottom line" is internal politics. Own the logic, not the headcount.
