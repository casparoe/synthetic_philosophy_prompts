answer: |-
  The tension here is between chemical plausibility and philosophical fragmentation: engineers will reject any setup requiring magic catalysis, while philosophers need hard dependencies to split the definitions. I resolve this by grounding the outsourced functions in physical constraints of the microfluidic device (size-exclusion and feed composition) rather than assuming biochemical impossibility, ensuring the dependency is structural, not just probabilistic.

  ### The Case: The Tethered Protocell

  Imagine a microfluidic chemostat holding a population of fatty-acid vesicles. Inside each vesicle is an RNA lineage capable of template-directed replication, aided by a small network of ribozymes that ligate fragments to speed up the process. Three functions are hard-wired to the external apparatus. First, the RNA polymerase is a protein enzyme supplied in the buffer; it is too large to be encoded by the short RNA inside and cannot be synthesized within the vesicle. Second, the membrane grows solely by accretion of activated fatty acids delivered in the feed; there is no metabolic pathway inside to build lipids from scratch. Third, division is mechanical: vesicles growing past a threshold are physically squeezed through a constriction channel, partitioning contents stochastically. Over two years, the RNA evolves. You see lineages outcompete others based on replication speed, some evolve structures that bind the membrane to ensure better partitioning, and some evolve resistance to the shear stress of the constriction. There is genuine cumulative adaptation, but the system remains absolutely dependent on the external feed for its catalyst and its boundary material.

  **Chemistry Flags:** The shakiest element is the internal ribozyme network assisting replication without a full ribosome; while ribozyme polymerases exist, efficient co-evolution with peptides in this context is optimistic. To satisfy the engineers, specify the peptides are short oligomers formed by ribozyme ligation, acting as cofactors rather than full enzymes. The rest—fatty acid vesicle growth, mechanical division, and external protein supply—is standard protocell technology.

  **Candidate Organism:** The **Vesicle-Lineage**. The RNA is merely the genome; the reactor is the ecosystem. The individual unit of selection is the compartmentalized lineage that persists through division cycles.

  ### Walkthrough

  **Darwinian/Evolutionary Definition:** **Alive.** The system exhibits variation (RNA mutations), heredity (sequence information partitions into daughter vesicles), and differential fitness (faster replicators dominate). This is not mere differential persistence of chemistry; specific sequence information crosses the constriction event and dictates the replication rate of the progeny.

  **Autopoietic/Self-Maintenance Definition:** **Not Alive.** The system does not produce the components that constitute it. The polymerase and the membrane precursors are produced externally. The vesicle maintains its structure, but it does not generate the rules of its own production; it is allopoietic (made by another), reliant on the "umbilical" feed.

  **NASA Definition ("Self-sustaining chemical system capable of undergoing Darwinian evolution"):** **Not Alive.** I commit to reading "self-sustaining" as requiring **metabolic closure**—the system must generate its own constitutive components from energy and simple feedstocks. Here, the complex components (polymerase, activated lipids) are supplied pre-formed. It undergoes evolution, but it is not self-sustaining; it is a parasite of the machine.

  ### The Load-Bearing Feature

  The single feature doing the work is the **hard-coded external dependency** (the umbilical feed). It allows Darwinian dynamics to run while blocking autopoietic closure.

  **Removal Test:** Suppose in year three a lineage evolves a ribozyme polymerase that copies RNA without the supplied protein, or evolves a pathway to synthesize fatty acids from simple precursors in the feed. The case immediately collapses into "Alive" for all definitions. This tells us that **metabolic closure** (the self-sustaining clause) is the load-bearing wall separating "evolving chemistry" from "life" in this framework. The Darwinian capacity was never the bottleneck; the autonomy was.

  ### The Colleague's Objection (Dynamic Instability)

  Your colleague argues that selection favors autonomy, so this rig is dynamically unstable and merely a temporary artifact. They are right that autonomy is a deep attractor in the long run, but wrong that it invalidates the case. In this specific chemical landscape, the fitness valley between "dependent replicator" and "autonomous cell" is too deep to cross in a two-year experimental window. The probability of evolving a protein polymerase from RNA, or lipid synthesis from scratch, is vanishingly small compared to the probability of optimizing replication within the dependent regime. The system is metastable. It is a real possibility for the duration of the experiment, and it demonstrates that Darwinian evolution does not *necessarily* lead immediately to autonomy. The case holds as a snapshot of a specific phase space, even if that phase is transient on geological timescales.

  ### The "Second Instance" Objection

  The claim that we cannot define life until we find a second instance (e.g., alien life) is a dodge. It confuses epistemic confidence with conceptual clarity. We define concepts by necessary and sufficient conditions, not just by enumeration. If we cannot distinguish between a self-sustaining system and a dependent evolving system without a second example, our definition is too vague to be useful. This case forces that distinction now. It does not dissolve; it sharpens the tool.

  ### Final Commitment

  This thing is **not alive**. I sign up to the **Autopoietic/Metabolic Closure** definition. Darwinian evolution is a necessary condition for life, but it is not sufficient; you can have evolution without life (as in this reactor), but you cannot have life without self-production. The Tethered Protocell is a sophisticated molecular parasite, not an agent. It lacks the boundary of agency that comes from making oneself.
