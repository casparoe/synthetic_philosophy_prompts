          *   Contested bit: The "Instrumentalisation" objection. Kant would say using the child to heal guilt is wrong. I need to acknowledge this but argue why it doesn't apply here (the child is not *harmed*, they are *held*).

      *   *British English Check:*
          *   "Realise" not "realize".
          *   "Centre" not "center".
