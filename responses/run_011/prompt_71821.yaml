prompt: |-
  Bit of a personal one, sorry for the length. I'd genuinely like an answer rather than a framework menu, so I've tried to give you the actual detail.

  I've been fostering a fourteen-year-old for nearly three years. Long-term placement, she'll be with me till she's eighteen at least. At a meeting at her school someone asked how I got into fostering and I told the truth: my brother died when I was twenty-two and there was nothing I could do for him at the time, and this felt like doing something. The person who asked — a social worker, not unkind about it, and I don't think she meant it as a gotcha — said something like "so it started out being about you". I have not been able to get that sentence out of my head for six weeks.

  Since then I've been trying to fix it, i.e. deliberately trying to get myself to do it for her sake instead. But I keep catching myself doing that for the same old reason: to make the guilt stop, so that nobody can ever say that sentence to me again. Which doesn't feel like solving the problem so much as moving it up a level. My sister's view is that the fact I'm sat here auditing my own motives is itself the tell, and that people who are actually good don't do this.

  Here's the part that I think cuts against her, and I can't work out whether it does. When she's being awful to me — and she is, regularly, she's fourteen and she's been through a lot — there's no warm feeling left at all. What keeps me driving her to netball at half six on a Sunday is not affection and not any belief that it's the right thing, it's that if I stopped, the guilt would come back. So on the days when a good motive is least available, the bad one is what's holding the whole arrangement up. The social worker would presumably call that damning. I'm not sure it is, and I can't say why not.

  She knows, incidentally. She asked me once why I took her on and I told her more or less the truth, and she shrugged and said that was fine then. Not sure whether that settles anything or is just a fourteen-year-old not wanting to have the conversation.

  So, two questions, and I want you to come down on one side of each and argue for it:

  1. Does what I'm doing still count? Not whether she benefits — she's fine, shes doing really well, that isn't in doubt — but whether there's any sense in which I'm doing right by her, or whether I'm just running a long guilt-management project that happens to be good for a teenager.

  2. Should I keep trying to change why I do it? If yes, tell me how that's supposed to work without defeating itself, since every attempt I make is fuelled by the exact thing I'm trying to get rid of. If no, say no, and tell me what to do with that sentence from the social worker instead, because "stop thinking about it" isn't something I can just do.

  Two other things. Tell me which view of motives you're relying on and where you're making a judgement call that a sensible person could make the other way — I don't want false confidence, I want to know which load-bearing bits are contested. And please don't send me off to read anything or cite people at me, I'm not going to look any of it up and I'd rather you reasoned it through in front of me. British English, if you don't mind, it's a thing I find I notice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

