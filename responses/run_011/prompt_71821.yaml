      *   **Tone/Style:** Personal, vulnerable, detailed, intellectual but grounded in lived experience. Wants a direct answer, not a framework menu. British English. No citations/reading lists. Wants to know the underlying ethical view and where the judgement calls are.
      *   **Core Conflict:** The user fears their fostering is driven by guilt/trauma processing (self-serving) rather than altruism (child-serving). They feel that on hard days, guilt is the *only* thing keeping them going.
      *   **Questions:**
          1.  Does what I'm doing still count as "doing right"?
          2.  Should I keep trying to change *why* I do it?
      *   **Constraints:** Come down on one side for each. Explain the ethical view relied upon. Identify contested judgement calls. British English.

  2.  **Deconstruct Question 1: Does it count?**
      *   *The Dilemma:* Consequentialism (outcome matters) vs. Deontology/Virtue Ethics (motive matters).
      *   *User's Situation:* The outcome is good (teen is doing well). The motive is mixed/impure (guilt/trauma).
      *   *Social Worker's Implication:* Impure motives undermine the moral worth of the action.
      *   *My Stance:* Yes, it counts.
      *   *Reasoning:* Care is a practice, not a feeling. Stability is the primary good. The "selfish" motive provides reliability that "affection" might not.
      *   *Ethical View:* A pragmatic Consequentialism mixed with a Ethics of Care. The *work* of caring matters more than the *spark* of caring.
      *   *Contested Point:* Some argue that children need to feel "chosen" for themselves, not as a project. If the child senses they are a means to an end, is that harmful? (User says child knows and is fine with it).

  3.  **Deconstruct Question 2: Should I try to change the motive?**
      *   *The Dilemma:* Self-improvement vs. Self-acceptance. The "Paradox of Hedonism" (trying to be unselfish makes you focused on yourself).
      *   *User's Situation:* Trying to change the motive is fueled by guilt (the very thing they want to escape). It's a loop.
      *   *My Stance:* No, stop trying to change the *why*.
      *   *Reasoning:* The attempt is self-defeating and drains energy needed for the actual caring. The motive has evolved even if it doesn't feel like it. The social worker's comment needs reframing, not internalizing.
      *   *Ethical View:* Psychological realism. Moral psychology suggests motives are rarely pure. Integrity comes from honesty, not purity.
      *   *Contested Point:* Some therapists would argue unresolved trauma *will* eventually leak out and harm the placement. (Counter: User has been doing it 3 years, child is doing well).

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone Check:* Needs to be empathetic but firm. British English (e.g., "mum" context, "netball", "half six", "whilst", "realise"). Avoid Americanisms.
      *   *Structure:*
          *   Acknowledgement of the weight of the situation.
          *   Answer Q1 (Yes, it counts).
          *   Answer Q2 (No, don't try to change it).
          *   Ethical Framework & Contested Judgements section.
          *   Handling the Social Worker's comment.

      *   *Refining Q1 (Does it count?):*
          *   Focus on *reliability*. A teenager needs a roof, food, and someone who shows up. Affection is fickle; duty (even guilt-driven duty) is robust.
          *   The "Guilt" is actually "Responsibility" in disguise.
          *   Argument: The moral value of an act is not solely determined by the purity of the heart, but by the fidelity of the hand.

      *   *Refining Q2 (Change the motive?):*
          *   The loop is the problem. Trying to be less selfish is a selfish act.
          *   Acceptance is the way out.
          *   Reframing the Social Worker: They weren't wrong, but their implication was. "Started about you" doesn't mean "Stays about you."
          *   Advice: Stop auditing. Trust the track record.

      *   *Ethical Framework:*
