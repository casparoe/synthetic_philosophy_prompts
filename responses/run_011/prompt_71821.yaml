answer: |-
  This is a heavy burden to carry, and you have carried it well for three years. It is entirely understandable that a single sentence from a professional has lodged itself in your mind like a splinter. You are asking for clarity, not comfort, so I will give you my direct view on both questions, followed by the ethical machinery behind it.

  **1. Does what I'm doing still count?**

  Yes. It counts unequivocally.

  You are drawing a distinction between 'doing right by her' and 'running a guilt-management project'. I am telling you that in the context of long-term foster care, those two things are not mutually exclusive, and the latter often secures the former.

  Affection is a feeling; care is a practice. Feelings are notoriously unreliable, especially with a traumatised fourteen-year-old. There will be days, as you know, when affection is impossible to summon. If your commitment relied solely on warm feelings, the placement would have fractured months ago. The fact that you show up at half six on a Sunday because you feel you *must*—because the alternative is a moral failure you cannot abide—is what provides the stability she actually needs.

  In moral terms, fidelity matters more than purity. You have made a commitment to a child. You are honouring that commitment. The engine driving the car is less important than the fact that the car arrives at the destination safely. If guilt is the fuel that keeps the car on the road when the engine of affection stalls, then guilt is doing a moral job. It is binding you to your duty when your emotions would otherwise let you drift.

  So, does it count as doing right by her? Yes. Because 'doing right' by a vulnerable teenager is primarily about reliability, safety, and presence. You are providing those things. The internal architecture of your motivation is secondary to the external reality of your consistency.

  **2. Should I keep trying to change why I do it?**

  No. Stop trying to change it.

  You have identified the trap yourself: every attempt to purify your motive is fuelled by the very impurity you are trying to escape. This is a psychological loop that drains energy you need for the actual job of parenting. By auditing your motives, you are turning your attention inward, towards your own moral status, rather than outward, towards the child. Paradoxically, obsessing over whether you are being selfish is itself a selfish act.

  Your sister is half-right and half-wrong. Good people do audit their motives, but they do not let the audit paralyse the action. The fact that you worry about this proves you are not indifferent to her welfare. But you must now trust the track record over the feeling.

  As for the social worker's sentence ("so it started out being about you"): You cannot "stop thinking about it", but you can refile it. She was factually correct, but morally naive. Of course it started about you. Almost all fostering starts with a need in the adult—whether that is religious duty, a desire for a family, financial necessity, or trauma processing.

  The sentence should not be a verdict; it should be a baseline. Acknowledge it. Say to yourself: "Yes, it started about me. It started as a way to grieve my brother. But in the three years since, it has become the structure of this girl's life." You do not need to excise the origin story to validate the current reality. The motive does not need to be static. It is allowed to be messy.

  **The Ethical View and Contested Judgements**

  You asked me to be explicit about the view I am relying on and where a sensible person might disagree.

  **The View:**
  I am relying on a form of **Care Ethics** prioritised over **Moral Purity**.
  In this view, the moral worth of an action is determined by the maintenance of the relationship and the well-being of the dependent party, rather than the internal virtue of the agent. I am also leaning on **Psychological Realism**: the idea that human beings are rarely capable of purely altruistic action, and demanding that they are is counter-productive. A commitment device (like guilt) that ensures reliability is morally superior to a fleeting feeling (like affection) that ensures nothing.

  **The Contested Judgement Calls:**
  Here is where a sensible person could argue against me, and you should know these risks:

  1.  **Instrumentalisation:** A Kantian ethicist would argue that using the child as a means to heal your own trauma is inherently wrong, regardless of the outcome. They would say the child deserves to be valued for their own sake, not as a vessel for your grief.
      *   *My counter:* This applies if the child is *harmed* by being instrumentalised. You state she is doing really well and knows the truth. If she feels used, the Kantian is right. If she feels held, the Care Ethicist is right. You are betting on the latter.

  2.  **The Leakage Risk:** A clinical psychologist might argue that unprocessed guilt will eventually curdle into resentment or control. They would say you *must* process the brother's death separately, or it will contaminate the placement eventually.
      *   *My counter:* This is a valid long-term risk. However, trying to process it *by changing your fostering motive* is not the way to do it. That is why I say stop trying to change the motive. Deal with the grief in therapy or private reflection, but do not make the child the battlefield for that change.

  3.  **The Definition of 'Good':** Your sister suggests good people don't audit motives. I suggest they do, but they don't let the audit stop the work. A sensible person could argue that constant self-doubt undermines your authority and makes you hesitant.
      *   *My counter:* Hesitation is better than arrogance. But paralysis is useless. You are currently bordering on paralysis.

  **Summary**
  You are not running a guilt-management project that happens to help a girl. You are running a care project that is sustained by guilt. The distinction is vital. The guilt is the mortar, not the building.

  Keep driving her to netball. Keep the roof over her head. Let the social worker's comment sit on the shelf as a factual observation about your history, not a prophecy about your future. You are doing right by her. Trust the work, not the feeling.
