  5.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm dismissing the social worker entirely. They had a point, but the user's interpretation is the trap.
      *   *Correction:* Ensure I address the sister's comment ("good people don't audit motives"). Actually, the sister is wrong. Good people *do* audit, but they don't let the audit paralyse them. I should nuance this.
      *   *Correction:* The user asked specifically about the social worker's sentence. I need to give them a specific way to hold that thought.

  6.  **Final Review against constraints:**
