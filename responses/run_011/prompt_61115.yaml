answer: |-
  ### A Challenge to the Framing

  Before we list the requirements, I need to push back on the phrase "settles on what to produce." That phrasing smuggles in an equilibrium assumption that biases the debate toward the CS camp. Economies do not *settle*; they churn. A serious account must explain coordination in motion, not just the solution to a static snapshot. If your desiderata assume a final state, you have already ruled out Hayek before the argument begins.

  With that correction in place, here are the candidate requirements. I started with a longer list (including "Pareto Optimality," "Fair Distribution," "Political Liberty," "Price Stability"), but pruned them. "Fair Distribution" is a political goal, not a calculation constraint. "Price Stability" is a monetary phenomenon, orthogonal to real resource allocation. "Pareto Optimality" is a metric of success, not a requirement of the *mechanism* itself.

  What remains are the functional constraints any mechanism must satisfy to claim it can run a complex division of labor.

  ### The Desiderata for Economic Calculation

  | Requirement | Motivating Case & Consideration |
  | :--- | :--- |
  | **1. Incentive-Compatible Revelation** | **The Mechanism Design Constraint.** A solver is only as good as its inputs. If agents (workers, managers, consumers) gain by hiding capacity, hoarding inputs, or misreporting preferences, the solution is garbage. This addresses the Soviet reality where factories hid true capacity to secure easier targets. A system that requires benevolent agents is not a system; it's a prayer. |
  | **2. Codifiability of Local Context** | **The Epistemic Constraint.** Can the knowledge required for the decision be translated into data without losing its value? Hayek's point was that "knowledge of the particular circumstances of time and place" often exists only as a skill or a hunch. If the mechanism requires data that cannot be written down (tacit knowledge), it fails. This distinguishes the *computational* objection (hard to process) from the *epistemic* objection (doesn't exist as data). |
  | **3. Latency vs. Granularity Trade-off** | **The Cybersyn Constraint.** Real-time feedback (like the Chilean ops room) solves the lag problem but forces a choice: do you optimize high-level aggregates quickly, or detailed allocations slowly? A mechanism must specify where it sits on this curve. If the compute time exceeds the shelf-life of the data (e.g., optimizing a supply chain that changed yesterday), the solution is historically accurate but economically useless. |
  | **4. Endogenous Discovery Capacity** | **The Innovation Constraint.** The economy isn't just allocating known resources to known ends; it's discovering new resources and new ends. A mechanism that optimizes a fixed menu of goods (static efficiency) but cannot signal the value of producing something that doesn't yet exist (dynamic efficiency) is a rationing system, not a calculation system. |
  | **5. Hierarchical Scalability Limit** | **The Firm Objection.** Firms plan internally without prices successfully. Why doesn't this scale to the state? The requirement demands an explanation of the *boundary*. Is it a limit on compute? A limit on goal homogeneity (profit vs. pluralistic values)? A limit on monitoring costs? A theory that says "planning works" must explain why it stops working at the border of the firm, or admit the state is just a meta-firm. |
  | **6. Robustness to Implementation Drift** | **The Second Economy Constraint.** Actual planned economies developed informal fixers, barter networks, and black markets to make the plan work. A serious account must explain whether these are bugs or features. If the formal calculation mechanism *requires* an informal black market to clear shortages, the mechanism itself is incomplete. The "system" includes the fixers. |

  ---

  ### The Sorting Work

  Here is where we separate the philosophical commitments from the functional constraints.

  **1. Non-Negotiable vs. Camp Preference**

  *   **Non-Negotiable:** *Incentive-Compatible Revelation* and *Robustness to Implementation Drift*. Any system that ignores lying or informal workarounds is describing a toy world. Both camps must accept these if they want to talk about reality.
  *   **Camp Preference (CS/Optimizer):** *Hierarchical Scalability Limit (Compute Version).* The CS camp often assumes the firm/state distinction is purely a function of processing power. They treat the limit as *Impractical (currently)*. This is a prejudice: it assumes the firm's success is due to better algorithms rather than shared unitary goals.
  *   **Camp Preference (Hayek/Epistemic):** *Codifiability of Local Context (Strong Version).* The Hayekians often treat this as *Impossible in Principle* (tacit knowledge can never be digitized). This can become a dogma that ignores how much tacit knowledge *has* been codified by sensors and IoT. It should be treated as an empirical variable, not an axiom.
  *   **Shared Prejudice:** Both sides often assume *Endogenous Discovery Capacity* is secondary to *Static Allocation*. They fight over how to divide the pie, ignoring who bakes it. This is a shared blind spot inherited from neoclassical equilibrium analysis.

  **2. Modal Strength of Claims**

  *   **CS Camp:** Claims the problem is *Impractical (currently)* but *Feasible (soon)*. Their load-bearing claim is that latency and dimensionality are engineering problems, not ontological ones.
  *   **Hayek Camp:** Claims the problem is *Impossible in Principle* (regarding knowledge) or *Undesirable-but-Feasible* (regarding tyranny). Their load-bearing claim is that the data *does not exist* to be fed into the solver.
  *   **The Crucial Divide:** The debate turns on **Codifiability**. If knowledge can be fully codified, the CS camp wins (eventually). If it cannot, the Hayek camp wins. The modal strength here determines the winner.

  **3. Incompatible Desiderata**

  *   **Full Information Aggregation vs. Incentive Compatibility.**
      *   *The Conflict:* To solve the optimization problem globally, the center needs truthful, granular data from all nodes. However, the more granular the data required, the higher the incentive for nodes to manipulate it to secure favorable allocations.
      *   *The Result:* You cannot have perfect central visibility *and* truthful reporting without external enforcement (coercion) or internal prices (decentralization). If you enforce truthfulness coercively, you kill *Endogenous Discovery* (people stop experimenting to avoid risk).
  *   **Static Optimization vs. Dynamic Discovery.**
      *   *The Conflict:* Optimization requires a defined objective function. Discovery requires exploring undefined objective functions. A system optimized for the known world creates high switching costs for the new world.
      *   *The Result:* A system that is perfectly efficient at allocating existing resources is likely brittle when those resources become obsolete.

  **4. Eliminative vs. Free Requirements**

  *   **Most Eliminative:** *Endogenous Discovery Capacity.*
      *   *Why:* Almost all formal models (Lange, Soviet Math, early CS) take preferences and production functions as given. They solve for $X$, they don't explain how we decided to value $X$ or how we invented the tech to make $X$. This requirement wipes out 80% of the literature on both sides.
  *   **Nearly Free:** *Static Allocation Consistency.*
      *   *Why:* Both Lange and the CS camp can easily show that, *given* fixed data and benevolent agents, a solver can produce a consistent plan. This sounds demanding ("solve the equations!") but is trivial compared to getting the data or handling the change. It's the "streetlight effect" of the debate: solving what can be measured, not what matters.

  ---

  ### Scoring the Contenders

  **Mises**
  Mises passes *Incentive-Compatible Revelation* (insists on private property to align incentives) and *Hierarchical Scalability* (identifies the firm/state boundary clearly). He fails *Computational Solvability* by declaring it *Impossible in Principle*, which history has softened (we can solve big linear programs now). However, he scores highest on *Endogenous Discovery* because his system relies on entrepreneurial judgment, not calculation. He is the only one who treats the economy as a process rather than a state.

  **Hayek**
  Hayek dominates on *Codifiability of Local Context*. He correctly identifies that the data doesn't exist until created by action. He is weak on *Mechanism Design*; he offers a critique but no formal alternative mechanism other than "the price system," which he treats as a black box. He handles *Robustness to Drift* well by acknowledging the role of custom and tradition, but offers no spec for how a planned system would degrade (he just says it won't work).

  **Lange/Lerner (Market Socialism)**
  Lange satisfies *Static Allocation Consistency* (the "free" requirement). He attempts to address *Incentive Compatibility* by telling managers to "follow the rules," which is the weak link; it assumes benevolence. He fails *Endogenous Discovery* because the "trial and error" is bureaucratic, not entrepreneurial. The "parametric prices" are set by a board that lacks the local knowledge to adjust them fast enough, failing the *Latency* requirement.

  **Mathematical Planning (Soviet Cybernetics)**
  This tradition (Kantorovich, et al.) crushes *Static Allocation Consistency*. They proved you can mathematically optimize a plan. They fail catastrophically on *Incentive-Compatible Revelation* (the math assumes truth, the reality was lies) and *Codifiability* (they assumed all relevant constraints could be quantified). They ignored *Robustness to Drift*, treating the second economy as noise rather than a systemic feature. They are the ancestors of the modern CS crowd, making the same modal error: confusing *computable* with *implementable*.

  **Modern ML/CS Revival**
  This camp solves *Latency vs. Granularity* better than the Soviets (real-time data vs. annual plans). However, they inherit the Soviet blind spot on *Codifiability*. They assume sensors can capture "context." They also struggle with *Incentive Compatibility*; an algorithm optimizing a supply chain assumes the warehouse manager isn't gaming the input data. They fail *Endogenous Discovery* because ML optimizes within the distribution of training data; it is notoriously bad at predicting black swans or radical innovation. They treat the economy as a prediction problem, not a coordination problem.

  **Final Note:** The CS camp thinks they are answering Mises. They are not. They are answering Lange. Mises and Hayek argued that without property rights, there are no *true* prices, and without true prices, there is no *knowledge*. Better compute on false data yields precise errors. Until the CS account explains how to generate *economic truth* (scarcity signals) without ownership, they are building a faster abacus for a market that doesn't exist.
