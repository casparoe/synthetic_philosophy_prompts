  **HARKER & NULL FINE FINDINGS**
  *Curating Significance Since 1988*

  **AUTUMN COLLECTION: SIGNIFICANT VINTAGES**

  **2023 Borderline Reserve (Red)**
  A bold, fruity expression of the null hypothesis rejected. Rich notes of correlation and oak-aged regression. Best consumed immediately this season; leave it another year and additional data may cause it to drift over p = 0.05, turning the finish to vinegar. Drink now while significant.

  **2022 Micro-Lot (Red)**
  Tiny production from a producer working with only twelve bottles' worth of material. Somehow tastes enormously of a huge effect size. Intense nose, but the structure is fragile. One outlier and the palate collapses. For immediate impact, not long-term cellaring.

  **2021 Open Protocol Natural (White)**
  Preregistered. Honest, austere, faintly disappointing. No oak of p-hacking to smooth the edges. The finish is null, entirely unsold, but structurally sound. A virtuous choice for the conscientious drinker who doesn't mind swallowing nothing.

  **2023 Sequential Sparkling**
  Made by optional stopping. Our proprietor kept going back to the tank and tasting until the bubbles were right. Effervescent excitement on the palate, though the method inflates the risk of false positives. Best paired with a headline that needs fizz.

  **2020 Power-Calculated White**
  Well-powered study. Small effect size. Sensible confidence interval. The prose is flat. It is reliable. It will taste the same in a decade. There are no surprises here. It is entirely correct. [Staff Note: We have plenty in stock.]

  **2022 Bayesian-Adjacent Red**
  Full-bodied. We are 95% confident the true effect lies within this bottle. The confusion between frequentist and Bayesian interpretations adds a complex, murky finish. Connoisseurs of probability theory will detect a hint of legitimate error on the nose.

  **VINTAGE CHART**
  *Rated by replication stability over a decade.*
  ★★★★★ 2012 (Pre-Boom)
  ★★☆☆☆ 2018 (Peak Output)
  ★★★☆☆ 2021 (Correction Era)

  **STAFF PICK**
  **The Press Release Blend.** Not technically a vintage, but it travels well. High sugar content masks the methodological flaws. Pairs excellently with policy briefs and conference keynotes.

  **SERVING AND STORAGE**
  Serve strictly at α = 0.05. Keep away from direct sunlight and direct requests for the raw data. Exposure to independent replication attempts may cause corkage fees to apply. Store in a cool, dark file drawer until needed.

  **THE FILE DRAWER CASE OFFER**
  **The "Twenty-to-One" Bundle**
  We taste twenty bottles in the lab. We ship you the one that worked. The other nineteen stay in the back and we'd rather not discuss them. An economical way to furnish a literature review without the clutter of null results. 12 bottles per case.

  *Delivery within 6–8 weeks, pending peer review.*
