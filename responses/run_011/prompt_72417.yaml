      *   **Ulysses and the Sirens:**
          *   *Situation:* Sailing past Sirens. Song causes madness/crash.
          *   *Constraint:* Ulysses knows his future self will be irrational/weak-willed.
          *   *Solution:* Bind self to mast (precommitment). Order crew not to release him.
          *   *Payoff:* Survival/Hearing song safely vs. Death/Crash.
          *   *Rationality Problem:* Time inconsistency. Present self wants future self to be bound; future self wants to be free.
          *   *Key Feature:* Physical constraint prevents the irrational act. The *act* of binding changes the available options later.

  3.  **Map the Analogy (Friend's View):**
