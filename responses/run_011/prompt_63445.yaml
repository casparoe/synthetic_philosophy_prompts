  **Which pump shows the largest gap between how often it is deployed and what it earns?**
  Chalmers's Philosophical Zombies shows the largest gap, as it is a cornerstone of modern philosophy of mind despite scoring poorly on framing asymmetry and yield. It is deployed as a knockout punch, yet the de-pumped restatement reveals it relies entirely on a contested modal premise that opponents simply deny.

  **If exactly one were permanently retired from the literature, which retirement would cost the most, and what specifically becomes harder to establish without it?**
  Retiring Newcomb's Problem would cost the most, as it is the primary engine for distinguishing causal from evidential decision theory. Without it, formalizing the conflict between acting on correlations versus causing outcomes becomes significantly more abstract and less pedagogically tractable.

  **Which de-pumped restatement was hardest for you to write, and whether that difficulty reflects a subtle argument or an absent one?**
  Parfit's Teletransporter was the hardest to restatement, reflecting a subtle argument rather than an absent one. The difficulty lay in separating "identity" from "survival" without using the sci-fi narrative that makes the distinction emotionally resonant.

  **Do the tiers sort by subject matter — normative pumps against descriptive ones — and if so, what that pattern suggests about how much work vividness does in each?**
