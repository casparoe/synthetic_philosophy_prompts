  **1. Newcomb's Problem**
  Ornament load: 1 | Framing asymmetry: 2 | Yield: 5
  Composite: 3.5 | Tier: S

  The predictor's infallibility is the load-bearing detail, and skeptics argue removing it collapses the dilemma into standard decision theory. An agent chooses between one box containing a large sum based on a prior prediction of that choice, or two boxes guaranteeing a smaller sum plus the potential large sum. The target intuition survives intact, as the conflict between causal and evidential reasoning persists without the box imagery. This scores the standard two-box versus one-box debate.

  **2. Nozick's Experience Machine**
  Ornament load: 3 | Framing asymmetry: 2 | Yield: 5
  Composite: 2.5 | Tier: S

  The tank and electrode setup is ornamental, though partisans claim it emphasizes the passivity essential to the objection. If well-being consisted solely of subjective mental states, individuals would prefer a simulated life guaranteeing maximal pleasure over a real life with mixed experiences. The target intuition survives intact, because the preference for reality holds even when described abstractly. This scores the standard hedonism refutation.

  **3. Putnam's Twin Earth**
  Ornament load: 3 | Framing asymmetry: 3 | Yield: 5
  Composite: 2.0 | Tier: A

  The specific chemical formula XYZ is unnecessary detail, yet internalists argue it distracts from the functional role of water. Two individuals can be in identical internal mental states while referring to different external objects due to environmental differences. The target intuition survives intact, as the externalist conclusion relies on the environmental variance, not the chemistry. This scores the standard semantic externalism reading.

  **4. Footbridge Trolley**
  Ornament load: 4 | Framing asymmetry: 3 | Yield: 5
  Composite: 1.5 | Tier: A

  The description of the man as "heavy" is illegitimate detail, though deontologists argue it emphasizes the bodily violation required. Maximizing lives saved does not always justify actively using an innocent person as a means to prevent death. The target intuition survives intact, because the means/ends distinction remains clear without the bridge scenario. This scores the standard personal force variant.

  **5. Parfit's Teletransporter**
  Ornament load: 3 | Framing asymmetry: 3 | Yield: 4
  Composite: 1.0 | Tier: A (ties with Monster; breaks on higher Yield)

  The destruction of the original body is crucial, but reductionists argue survival does not require identity. Psychological continuity can be preserved across discontinuous physical substrates even if numerical identity is not preserved. The target intuition survives but weakened, as the emotional weight of death is harder to isolate without the sci-fi setting. This scores the standard reductionist view.

  **6. Nozick's Utility Monster**
  Ornament load: 1 | Framing asymmetry: 4 | Yield: 3
  Composite: 0.5 | Tier: B (ties with Jackson; breaks on lower Ornament)

  The label "monster" is prejudicial framing, though utilitarians argue it correctly illustrates aggregation limits. If moral rightness is determined solely by maximizing total utility, resources should be allocated to whichever agent converts them into utility most efficiently. The target intuition survives intact, as the mathematical implication holds without the monstrous imagery. This scores the standard aggregation critique.

  **7. Jackson's Mary**
  Ornament load: 3 | Framing asymmetry: 4 | Yield: 4
  Composite: 0.5 | Tier: B

  The black and white room is specific ornamentation, yet physicalists argue complete physical knowledge without experience is impossible. Possessing complete physical information about a perceptual process does not entail possessing the subjective experience of that process. The target intuition survives but weakened, because the "complete knowledge" premise is the actual battleground. This scores the standard knowledge argument.

  **8. Singer's Child in the Pond**
  Ornament load: 5 | Framing asymmetry: 3 | Yield: 4
  Composite: 0.0 | Tier: B (ties with Thomson; breaks on lower Framing)

  The muddy suit is irrelevant detail, though advocates say it emphasizes the trivial cost of rescue. If one can prevent significant harm at negligible cost to oneself, distance from the victim does not negate the moral obligation to act. The target intuition survives intact, as the proximity principle holds without the pond imagery. This scores the standard positive duty argument.

  **9. Thomson's Violinist**
  Ornament load: 3 | Framing asymmetry: 5 | Yield: 4
  Composite: 0.0 | Tier: B

  The kidnapping scenario presupposes non-consent, which pro-life advocates reject as analogous to pregnancy. One person's right to life does not automatically grant them permission to use another person's body against their will. The target intuition survives intact, because the bodily autonomy distinction holds regardless of the violinist story. This scores the standard abortion analogy.

  **10. Chalmers's Philosophical Zombies**
  Ornament load: 2 | Framing asymmetry: 5 | Yield: 3
  Composite: -0.5 | Tier: C (ties with Searle; breaks on lower Ornament)

  The conceivability premise is the framing asymmetry, as physicalists deny conceivability entails possibility. It is conceivable that a being exists with identical physical states to a human but lacks conscious experience. The target intuition dies, because without the modal leap, the argument collapses into a bare assertion. This scores the standard modal argument.

  **11. Searle's Chinese Room**
  Ornament load: 5 | Framing asymmetry: 3 | Yield: 3
  Composite: -0.5 | Tier: C

  The man inside the room is excessive ornament, though dualists argue it triggers the necessary "no understanding" intuition. A system can manipulate symbols according to rules without possessing semantic content associated with those symbols. The target intuition survives but weakened, as the human element does most of the persuasive work. This scores the standard systems reply context.

