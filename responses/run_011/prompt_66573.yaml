  4.  **Incentive Compatibility:** Must mitigate gains from falsely overstating commitment intensity. *Consideration:* Prevents agents from lying about how much they care to secure favorable exchange rates, destabilizing the coalition.
  5.  **Motivational Neutrality:** Must clarify whether performing an act instrumentally (for the swap) rather than for its intrinsic moral reason alters permissibility. *Consideration:* Addresses whether the act counts morally if done for trade credit rather than the cause itself.
