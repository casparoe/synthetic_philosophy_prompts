answer: |-
  Here is the principle you are looking for, the trade it demands, and the consequences for your cases.

  ### The Principle: Causal-Structural Continuity

  Your intuition is struggling because you are trying to judge theories based on **Ontological Truth** (are the *things* real?) while your evidence is **Predictive Success** (do the *relations* hold?). These two do not map one-to-one. To resolve your inconsistencies, you must adopt a version of **Selective Structural Realism**.

  **The Principle:** A discarded theory $T$ counts as approximately true (and its success is not miraculous) if and only if:
  1.  **Structural Preservation:** The mathematical relations responsible for $T$'s successful predictions are preserved as a limiting case or isomorphism in the successor theory $S$.
  2.  **Causal Role Retention:** The theoretical terms in $T$ that did the "load-bearing" work refer to entities or structures in $S$ that play the *same causal role*, even if the intrinsic nature of those entities is redefined.
  3.  **Independent Constraint:** The posits of $T$ were constrained by data *other than* the predictions they were designed to save (ruling out purely ad-hoc machinery).

  ### How the Clauses Map to Your Cases

  *   **Clause 1 (Structural Preservation)** motivates the similarity between **Fresnel** and **Caloric**. In both cases, the differential equations survived. This clause forces you to treat them similarly. It saves **Newton** (equations survive as a limit of Relativity) and **Mendel** (segregation ratios survive in genetics).
  *   **Clause 2 (Causal Role Retention)** distinguishes **Fresnel** from **Ptolemy**. In Fresnel's case, the "wave" structure corresponds to real electromagnetic propagation. In Ptolemy's case, the "circles" were computational tools, not causal mechanisms; the successor theory (Kepler/Newton) did not retain the *causal role* of the spheres, only the ability to fit the data. This clause also distinguishes **Water** from **Phlogiston**. "Water" retained its causal role (the stuff we drink/bathe in) despite theory change. "Phlogiston" (substance released in combustion) had no causal counterpart in Oxygen theory; its role was erased, not redefined.
  *   **Clause 3 (Independent Constraint)** distinguishes **Fresnel** from **Bohr**. Fresnel's wave theory explained interference, diffraction, *and* the Arago spot. Bohr's orbits were tailored specifically to the Balmer series and could not be extended without contradiction; they were "load-bearing" only for that specific dataset. This clause also pressures your view on **Ether** vs. **Electrons**. The ether was constrained by interferometry (even if the result was null); electrons are constrained by cloud chambers, scattering, etc.

  ### The Trade: Which Verdict Must Go?

  You asked for a simple principle that overturns a verdict rather than an elaborate one that saves them all. Here is the cost of adopting Causal-Structural Continuity:

  **You must abandon your verdict on Caloric.**

  You currently judge Fresnel as "substantially right" and Caloric as "closer to a miracle." Under this principle, **they stand or fall together.**
  *   **Why:** In Fresnel's case, the *Ether* was false, but the *Wave Equation* was true. In Caloric's case, the *Fluid* was false, but the *Conservation/Flow Equation* was true.
  *   **The Pressure:** You feel Fresnel is "truer" because Light *is* a wave, while Heat *is not* a fluid. But "Wave" is a structural description, not an ontological one. "Fluid" is an ontological description. Fresnel got the Structure right (oscillation/propagation). Caloric got the Structure right (conservation/gradient flow). Both got the Substance wrong.
  *   **The Consequence:** If you accept that predictive success tracks *structural* truth, you must admit Caloric was "partly true" in the exact same sense Fresnel was. The Carnot efficiency is not a miracle; it is a structural truth about energy flow that Caloric captured via the analogy of fluid flow. To keep your current verdicts, you would have to claim the Ether was "realer" than Caloric, which is indefensible given that neither exists.

  **Secondary Sacrifice:** You must soften your verdict on **Ptolemy**. While the *spheres* were false, the *Fourier structure* (decomposition of periodic motion) is a genuine structural truth about orbital mechanics. Ptolemy was not "not even partly true"; he was structurally correct about periodicity but ontologically wrong about the mechanism. However, he fails Clause 3 (Independent Constraint) more severely than Fresnel, as his epicycles were often adjusted ad-hoc per planet without independent physical justification.

  ### Application to New Cases

  1.  **Mendel's Factors (Pre-DNA):**
      *   **Verdict:** **Partly True (Real).**
      *   **Reasoning:** Satisfies Clause 1 (Segregation ratios are preserved in molecular genetics). Satisfies Clause 2 (The "factor" plays the causal role of an inherited unit, now identified as DNA sequences). Satisfies Clause 3 (Predicted ratios in crosses not yet performed).
      *   **Status:** Like Fresnel. The ontology (bead-like units) was vague, but the causal structure was preserved.

  2.  **Vital Force (Early 19th Century):**
      *   **Verdict:** **False (Miraculous Success if any).**
      *   **Reasoning:** Fails Clause 1. There is no equation or structural relation in modern biochemistry that corresponds to "elan vital." Fails Clause 2. The causal work attributed to the vital force is now explained by complex chemical pathways, not a "force."
      *   **Status:** Worse than Caloric. Caloric preserved the math of thermodynamics; Vitalism preserved nothing but a label for ignorance.

  3.  **Dark Matter (Today):**
      *   **Verdict:** **Provisionally True (Structurally).**
      *   **Reasoning:** Satisfies Clause 1 (Gravitational equations hold, mass term added). Satisfies Clause 3 (Constrained by rotation curves, lensing, CMB, not just one dataset).
      *   **Uncertainty:** Clause 2 is currently open. We know the *causal role* (gravitational mass without emission), but we do not know the *entity* (WIMPs? Axions? Modified Gravity?).
      *   **Status:** Analogous to the Ether in 1880. We detect the structural effect, but the ontology is not yet secured. If we find the particle, it becomes like the Electron. If we find it was Modified Gravity, Dark Matter becomes like the Caloric Fluid (a useful placeholder for a structural relation).

  ### Summary of Instructions for Your Essay

  1.  **Adopt Structural Realism.** Argue that predictive success is evidence for the *mathematical structure* of a theory, not necessarily its *ontological picture*.
  2.  **Equalize Fresnel and Caloric.** Explicitly state that your initial hesitation was due to conflating "substance" with "structure." Acknowledge that Carnot's success is no more miraculous than Fresnel's; both captured structural truths about the world using incorrect ontological models.
  3.  **Use the Phlogiston/Water distinction to define Reference.** Argue that terms refer if they are causally anchored to samples (Water), not if they are defined by theoretical descriptions (Phlogiston). This saves you from saying "nothing exists."
  4.  **Accept the Pessimistic Meta-Induction partially.** Concede that we are likely wrong about the *nature* of electrons (ontology), but likely right about the *relations* they obey (structure).

  This gives you a coherent system. The price is admitting that Caloric was "scientific" and "partially true" in the same way Wave Theory was. That is a defensible, historically nuanced position that strengthens your essay.
