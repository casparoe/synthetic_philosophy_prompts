prompt: |-
  I cover artificial-intelligence research for a general-interest science desk. Last week I sat in on a closed workshop whose stated purpose was to settle what a safety claim about a deployed model should actually consist of. Two participants — call them A, who works on formal guarantees, and B, who runs adversarial evaluation at a lab — argued for the better part of an hour, and I could not tell which of them was right. I would like a referee's report rather than a summary.

  The exchange ran roughly as follows.

  (1) A opened by arguing that a guarantee stated as average performance over a test distribution is worthless for alignment purposes, because deployment is not sampling from that distribution: a single input, however improbable, can produce a catastrophic and irreversible outcome, so the only meaningful claim is one that holds for every input, including the cleverest one an attacker can construct.

  (2) B replied that a worst-case bound over an unrestricted input space is either so loose that it licenses nothing or so tight that it forces the system to refuse nearly everything, and that what protects users in practice is a sharp statement about typical behavior plus an honest accounting of the residual tail; insisting otherwise, B said, drives teams to substitute private judgment while claiming rigor.

  (3) A said the tail is exactly where adversaries live: an average-case guarantee is a guarantee only when nobody is trying to break it, which is the one situation in which you least need one, and it silently assumes the deployment distribution resembles the evaluation distribution — the assumption a jailbreak exists to violate.

  (4) B conceded part of this and proposed a middle route: specify the adversary explicitly — bounded compute, bounded query access, a stated number of attempts — certify against that class, and publish the specification so that others can attack it. That, B said, is worst-case reasoning done honestly rather than aspirationally.

  (5) A's closing move was that this quietly reintroduces the reasoning B had just rejected, since the adversary class will be drawn so that the attacks the lab already knows how to generate fall inside it, and the threat worth worrying about — an attacker more ingenious than the model of attackers — is precisely the case assumed away. Publishing an assumption, A said, protects no one from its failure.

  Neither budged, and the workshop report ended up containing both positions side by side. Please adjudicate move by move: rate each of the five from clearly mistaken to clearly right, with a sentence or two of justification for each rating, and say who is right about which specific point rather than only who wins overall. Then tell me which of the two is more right on the whole, and identify any assumption or distinction that both of them are treating as settled but that a referee ought not let pass.
reasoning: |-
  Here's a thinking process that leads to the referee's report:

  1.  **Analyze the Request:**
      *   **Role:** Referee/Adjudicator (not just a summarizer).
      *   **Context:** Closed workshop on AI safety claims for deployed models.
      *   **Participants:** A (Formal Guarantees) vs. B (Adversarial Evaluation).
      *   **Task:**
          1.  Adjudicate moves (1) through (5) individually (Rate: Clearly Mistaken to Clearly Right + Justification).
          2.  Specify who is right about *which specific point* (nuance over binary winner).
          3.  Determine who is more right on the whole.
          4.  Identify hidden assumptions/distinctions both treat as settled but shouldn't be.
      *   **Audience:** General-interest science desk (needs clarity, precision, but accessible enough for a science journalist).
      *   **Tone:** Professional, analytical, decisive but nuanced.

  2.  **Analyze the Arguments (Move by Move):**

      *   **Move (1) - A:** Average performance is worthless; deployment $\neq$ test distribution; single catastrophic input matters; need guarantees for *every* input (worst-case).
          *   *Assessment:* Strong intuition on safety-critical systems (one crash kills you), but technically impossible for general-purpose AI (undecidability, infinite input space). "Worthless" is too strong; average case *does* reduce risk, just doesn't eliminate tail risk.
          *   *Rating:* Partially Right / Overstated.
          *   *Justification:* Correct that tail risks matter for safety, but incorrect that average-case is "worthless" or that universal quantification over *all* inputs is feasible/meaningful for Turing-complete systems.

      *   **Move (2) - B:** Unrestricted worst-case is too loose or too tight (refuse everything); practical protection comes from typical behavior + honest tail accounting; strict worst-case drives private judgment masquerading as rigor.
          *   *Assessment:* Pragmatically sound. Unrestricted worst-case on high-dimensional data is usually trivial (e.g., "accuracy > 0%"). The point about "refuse nearly everything" highlights the alignment tax. The "private judgment" critique is sharp.
          *   *Rating:* Mostly Right.
          *   *Justification:* Correctly identifies the intractability of unrestricted worst-case bounds, but underestimates the danger of relying on "typical behavior" when adversaries actively shift the distribution.

      *   **Move (3) - A:** The tail is where adversaries live; average-case only works when no one is trying to break it; assumes deployment $\approx$ evaluation distribution (which jailbreaks violate).
          *   *Assessment:* Very strong point. This is the core of adversarial robustness. Average-case on i.i.d. data fails under distributional shift or active attack.
          *   *Rating:* Clearly Right.
          *   *Justification:* Accurately diagnoses the failure mode of standard ML evaluation in security contexts; distributional shift is the norm in deployment, not the exception.

      *   **Move (4) - B:** Middle route: Specify adversary explicitly (bounded compute, queries, attempts); certify against that class; publish spec for external attack. Worst-case done honestly.
          *   *Assessment:* This is the standard cryptographic/security approach (threat modeling). It moves from "all inputs" to "all inputs within resource bounds." This is the only tractable path to rigor.
          *   *Rating:* Clearly Right.
          *   *Justification:* Aligns with established security engineering practices; makes the guarantee falsifiable and tractable without claiming the impossible.

      *   **Move (5) - A:** This reintroduces B's earlier rejection; adversary class drawn to match known attacks; ignores attacker more ingenious than the model; publishing an assumption protects no one from its failure.
          *   *Assessment:* Philosophically strong, pragmatically weak. Yes, threat models can be wrong (Goodhart's law of security). But claiming that *because* a model might be wrong it offers *no* protection is nihilistic. All engineering relies on assumptions (e.g., "attacker doesn't have a nuclear weapon").
          *   *Rating:* Partially Right / Overstated.
          *   *Justification:* Correct that threat models can be misspecified, but incorrect to imply that bounded assumptions offer *no* safety value compared to impossible unbounded ones.

  3.  **Synthesize the "Who is Right on What":**
      *   A is right about the *nature of the risk* (tail events, adversaries shift distributions).
      *   B is right about the *feasibility of the solution* (unrestricted worst-case is impossible, threat modeling is the industry standard).
      *   A is wrong about the *value of average case* (it's not worthless, just insufficient).
      *   B is wrong about *relying on typical behavior* (without adversarial hardening, typical behavior is fragile).
      *   The synthesis is B's Move (4), but A's Move (5) is a necessary cautionary note on *how* that spec is created.

  4.  **Determine "Who is More Right on the Whole":**
      *   B wins on *engineering reality*. You cannot ship with A's requirement (universal quantification).
      *   A wins on *safety philosophy*. You cannot ship with B's initial requirement (average case) without A's warning.
      *   However, since the goal is a "safety claim about a deployed model," B's framework (Move 4) is the only one that yields a claim that can actually be written down and tested. A's framework yields silence or false promises.
      *   *Verdict:* B is more right on the *constructive* path, but A provides the necessary constraints. I will lean towards B because Move 4 is the actual solution to the debate, whereas A's final move is a critique of implementation, not the framework itself. Actually, looking closer, B's Move 4 *accepts* A's critique of Move 2. So B evolves. A stays static. B is more right on the whole because they proposed the viable synthesis.

  5.  **Identify Hidden Assumptions/Distinctions:**
      *   *Assumption 1:* "Safety Claim" implies a binary guarantee (Safe/Unsafe). In reality, safety is probabilistic and layered.
      *   *Assumption 2:* "Deployment" is a static event. It's a continuous process (monitoring, updates).
      *   *Assumption 3:* The distinction between "Formal Guarantees" and "Adversarial Eval" is sharper than it is. Formal methods need specs; Adv Eval needs rigor. They are converging.
      *   *Key Distinction:* **Verification vs. Validation.** A wants Verification (proof against spec). B wants Validation (testing against reality). Both are needed.
      *   *Crucial Hidden Assumption:* That the model is static. If the model can be updated/patched, worst-case guarantees are less critical than detect-and-respond systems.

  6.  **Drafting the Report:**
      *   *Structure:*
          1.  Intro (Referee context).
          2.  Move-by-Move Adjudication (1-5).
          3.  Specific Points of Correctness.
          4.  Overall Verdict.
          5.  Hidden Assumptions/Unsettled Distinctions.
      *   *Tone:* Objective, authoritative, clear.
      *   *Refinement:* Ensure the distinction between "unrestricted worst-case" (impossible) and "bounded worst-case" (standard security) is clear. Ensure A's point about "assumption failure" is acknowledged as a risk management issue, not a logical disqualifier.

  7.  **Review against Constraints:**
      *   Rate each move (Clearly Mistaken to Clearly Right).
      *   Sentence or two justification per move.
      *   Say who is right about which specific point.
      *   Identify who is more right on the whole.
      *   Identify hidden assumptions.
      *   Audience: Science desk (avoid overly dense jargon, explain "bounded compute" etc. if needed, but assume intelligence).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Move 1:* Don't call it "Clearly Mistaken." It's "Partially Right." The intuition is correct for safety-critical systems (aviation, nuclear), but the application to LLMs is currently impossible. I'll rate it "Conceptually Sound, Practically Infeasible." Wait, the prompt asks for "Clearly Mistaken to Clearly Right." I need to fit the scale. I'll use "Partially Right" as a midpoint or lean towards "Mostly Right on Principle, Wrong on Feasibility." Let's go with "Partially Right."
      *   *Correction on Move 5:* A is making a Goodhart's Law argument. It's a valid critique of *process*, not *theory*. I should rate it "Partially Right."
      *   *Hidden Assumption:* The idea that a "safety claim" is a one-time certificate rather than a continuous monitoring contract. This is huge in AI safety.

      *(Self-Correction)*: I need to make sure I don't sit on the fence too much. The prompt asks me to adjudicate. I need to be decisive.
      *   Move 1: Mostly Right (on the risk), Wrong (on the "worthless" claim). Let's say "Partially Right."
      *   Move 2: Mostly Right (on feasibility), Wrong (on reliance on typicality). "Partially Right."
      *   Move 3: Clearly Right. (This is the strongest argument A makes).
      *   Move 4: Clearly Right. (This is the industry standard solution).
      *   Move 5: Partially Right. (Valid warning, but dismissive of risk reduction).

      *Wait, I need to pick a winner.* B proposes the solution (Move 4) that incorporates A's concern (Move 3). A rejects the solution (Move 5) based on implementation risk. B is more right because engineering requires tractable solutions, not perfection.

      *Hidden Assumption:* The "Static Model" assumption. Both argue as if the model is frozen at deployment. In modern AI, deployment includes feedback loops, monitoring, and patching. This changes the necessity of "perfect" worst-case guarantees.

      *Let's write.*
answer: |-
  **Referee's Report: Adjudication of Safety Claim Framework**

  **Move-by-Move Adjudication**

  **(1) Participant A: Average-case guarantees are worthless; only universal worst-case matters.**
  **Rating: Partially Right.**
  **Justification:** A is correct that for high-stakes safety, tail risks dominate (one crash ruins the flight), but incorrect to label average-case metrics "worthless," as they establish a baseline probability of failure that is necessary for risk calculation. Furthermore, demanding a guarantee for *every* input in a high-dimensional space is mathematically intractable for current model classes.

  **(2) Participant B: Unrestricted worst-case is impossible; rely on typical behavior plus tail accounting.**
  **Rating: Partially Right.**
  **Justification:** B correctly identifies that unrestricted worst-case bounds are often trivial (e.g., "accuracy ≥ 0%") or paralyzing, but underestimates the fragility of "typical behavior" when the deployment environment is actively hostile rather than stochastic.

  **(3) Participant A: The tail is where adversaries live; average-case assumes no attacker.**
  **Rating: Clearly Right.**
  **Justification:** This is the strongest argument in the exchange; standard i.i.d. (independent and identically distributed) evaluation assumptions break down precisely when an adversary intentionally shifts the input distribution to find failures.

  **(4) Participant B: Specify the adversary explicitly (bounded compute/queries) and certify against that class.**
  **Rating: Clearly Right.**
  **Justification:** This aligns with established security engineering (threat modeling); it converts an impossible universal claim into a falsifiable, tractable guarantee that allows for rigorous testing without claiming omniscience.

  **(5) Participant A: Bounded adversary models just encode current ignorance; assumptions protect no one from their own failure.**
  **Rating: Partially Right.**
  **Justification:** A correctly warns against "security through obscurity" or self-serving threat models, but wrongly implies that a bounded assumption offers no safety value compared to an impossible unbounded one; risk reduction is still value, even if risk elimination is unachievable.

  ***

  **Specific Points of Correctness**

  *   **A is right about the threat landscape:** A wins the argument that deployment is not a random sampling process when adversaries are present. Relying on test-set performance without adversarial stress-testing is indeed insufficient for safety claims.
  *   **B is right about engineering constraints:** B wins the argument that universal quantification over input space is not a viable standard for deployment. A's requirement would result in no models ever being released, which is a policy outcome, not a safety metric.
  *   **B is right about the solution path:** Move (4) represents the actual industry standard for robust safety claims (e.g., cryptographic standards or safety cases in aviation). It bridges the gap between A's demand for rigor and the reality of computational limits.

  ***

  **Overall Verdict**

  **Participant B is more right on the whole.**
  While A identifies the problem with greater philosophical precision, B provides the only workable framework for a safety claim. A's position leads to a paralysis where no claim can be made because perfection is unattainable; B's position (specifically Move 4) allows for a claim that is rigorous, falsifiable, and improvable over time. A's final objection (Move 5) is a valid caution regarding *how* the threat model is constructed, but it is not a refutation of the threat modeling approach itself.

  ***

  **Hidden Assumptions and Unsettled Distinctions**

  Both participants are treating the following distinctions as settled when they are, in fact, the crux of the unresolved problem:

  1.  **Static vs. Dynamic Deployment:** Both A and B argue as if the model is frozen upon deployment. They assume the "safety claim" must cover the model's entire lifetime based on pre-deployment evaluation. In modern AI operations, safety is often managed via continuous monitoring, rate-limiting, and patching. If the system can detect and respond to novel attacks post-deployment, the need for a pre-computed worst-case guarantee diminishes significantly.
  2.  **Verification vs. Validation:** A is arguing for *verification* (proving the system meets a specification), while B is arguing for *validation* (demonstrating the system works under expected conditions). The workshop report fails to distinguish that a complete safety case requires both: B's threat model specifies the conditions for validation, but A's rigor is needed to verify that the defenses against that threat model actually hold.
  3.  **The Definition of "Harm":** Both assume "catastrophic outcome" is a binary property of an input. They neglect that harm is often contextual. An output that is safe in a research sandbox may be catastrophic in a medical context. A safety claim cannot be about the *model* in isolation; it must be about the *model-in-context*, a distinction neither participant explicitly anchored their guarantees to.
