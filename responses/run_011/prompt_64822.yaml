  ok so my friend and I just burned three hours on Parfit's teletransporter and I need a third party, becuase I think he's being a smartass and he thinks I'm being sentimental. Don't send me to the literature, I've read it — I want you to actually commit and argue.

  Here's the set-up. I typed out eight variations on the teleportation case, some of them roughly the ones Reasons and Persons uses and some I made up specifically to annoy him. I want two scores per case, 0–10:

  - **dread**: how much I should mind being the person who goes through the process, assuming ordinary self-interested concern for my own future. 10 = this is just death with extra steps. 0 = genuinely no worse than going to sleep.
  - **pressure**: how much trouble the case makes for the claim that what matters in survival isn't identity but Relation R — psychological continuity and/or connectedness with the right kind of cause.

  the eight:

  1. **Baseline.** I'm scanned, my body here is destroyed, a replica is assembled on Mars out of local matter with all my memories and character, wakes up, carries on. Continuous causal chain, no interruption anywhere.
  2. **Thirty seconds.** Exactly like 1, except the machine takes thirty seconds to build the replica after destroying the original, so for half a minute there is no one with my psychology in existence anywhere.
  3. **The backup.** The scan doesn't destroy me. I live another forty years and die of old age. Then the stored blueprint is used to make a replica, who wakes up remembering everything up to the scan, including the forty years I actually lived.
  4. **One at a time.** No scanning, no transport. Over ten years each of my neurons is replaced in place by a synthetic one doing the identical causal job, one at a time. No interruption, I go to work as normal, nobody notices. At the end there's nothing organic left in my skull.
  5. **Two of me.** The scan doesn't destroy me and a replica is made on Mars. We both wake up tomorrow, both remember everything up to the scan, both fully continuous with the original.
  6. **Flattened.** Like 1, but the replica is rebuilt with my beliefs, memories and skills intact and my affective wiring reset. Same projects, knows exactly who I love, none of the actually-caring.
  7. **Blank body.** My body and brain are preserved perfectly and the physical continuity is unbroken, but on waking there's nothing there — total wipe, fresh psychology grown in, no memories, no character, no connection to me at all.
  8. **Ten.** Like 5, except ten replicas, all equally continuous with the original, and the original is destroyed.

  Now the actual point of the argument. His bet is that your dread ranking is going to line up almost perfectly with one completely non-philosophical variable: how long and how visible the gap is, i.e. how much time passes with nobody-who-has-my-psychology anywhere in the universe. If that's true, he says, all the Relation R talk is just squeamishness wearing a technical vocabulary and there's no principled ordering to find at all. I said there's at least one pair where dread runs the other way from gap-length, and I was waving 6 and 7 at him, and he waved them off as "not really about survival, you're changing the subject."

  So: give me both rankings side by side, say roughly how well the two orderings agree, and then tell me straight up who won the bet. And deal with 6 and 7 explicitly — is he right that they're irrelevant to the question, or do they break his story?

  Pick a view of what matters and stick to it for all eight, I don't want eight answers times three theories. Then at the end put a number on how confident you are in the whole thing, and single out the one score you're least sure of and say why — I want to know which of these you were basically guessing at, because I fully intend to use it against him either way.
