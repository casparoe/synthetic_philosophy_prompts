  *Wait, one nuance:* Marcus's argument about the heap (Move 5) is actually a very sophisticated philosophical move (Epistemicism or Nihilism about vagueness). I should give him credit there. Dana's Move 8 is also strong (accusation of circularity).
  *The Third Position:* It's not just Parfit. It could also be the "Pattern Identity" theory or "Open Individualism." But Parfit is the standard counter to this specific dichotomy. I'll stick with Parfit/Reductionism as the primary third option.

