  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Board of Trustees member at Kettleton Mining Heritage Centre.
      *   **Task:** Draft a memo to fellow trustees to resolve a dispute over an orientation panel text ("The Last Seam" gallery).
      *   **Context:** Dispute between an academic adviser (economic historian, 5 factors with percentages) and the Beckside Former Miners' Association (political decision, viable pit closed deliberately).
      *   **Complication:** Adviser's own evidence shows two independent sufficient causes (1986 closure programme & 1988 reserve exhaustion) would each have led to closure by 1992 (overdetermination). Association argues these aren't independent (concentration decision based on reserves) and fears absolving responsibility.
      *   **Constraints:**
          *   British English.
          *   No longer than two sides (approx. 1000-1200 words max, depending on formatting, but "two sides" usually implies A4 single-sided or double-sided short memo. I should aim for conciseness, around 800-1000 words to be safe).
          *   Recommend a concrete decision (Adopt Draft 1, Draft 2, or Third Approach).
          *   Give actionable reasons, not philosophical survey.
          *   **Four Specific Requirements:**
              1.  Explain the adviser's concession (overdetermination) and whether naming one cause is honest given two independent routes. Address if the question "Why did Beckside close?" is well-posed vs. timing/capacity questions.
              2.  Verdict on percentage weighting. If indefensible, suggest replacement for a 150-word label that retains nuance (some factors mattered more).
              3.  Address Association's objection at strongest (causal link between concentration decision and reserves, pre-emption vs. accompaniment) and implications for wording.
              4.  List claims the final panel *must not* make based on evidence.
          *   **Tone:** Professional, decisive, empathetic but evidence-based. Avoid splitting the difference if the dispute is framed wrongly.
          *   **Personal Interest:** Declare interest (grandfather hewed coal there, prefer Draft 2 congenially) but remain objective.

  2.  **Deconstruct the Four Requirements:**

      *   *Req 1 (Overdetermination & Question Framing):* The adviser admits two sufficient causes (Policy/Investment vs. Geology/Reserves). This is classic causal overdetermination. If A causes C and B causes C, and both happen, saying "A caused C" is true, but so is "B caused C". However, for a museum panel, precision matters. The question "Why did it close?" is ambiguous. Does it mean "Why did it close eventually?" (Geology) or "Why did it close *then* and *that way*?" (Policy). The panel needs to reflect that the *timing* and *manner* were political, even if the *eventual cessation* was geological.
      *   *Req 2 (Percentages):* Percentages on historical causation are pseudoscientific in this context. They imply a precision that doesn't exist. They sum to 100% arbitrarily. *Verdict:* Reject percentages. *Replacement:* Use qualitative weighting (e.g., "primary factors," "compounded by," "accelerated by").
      *   *Req 3 (Association's Objection):* They argue the decision pre-empted the natural run-down. If the 1988 decision was made *because* reserves were low, the decision is the proximate cause of the *timing*. If they are right, the closure was a management choice to close a dying pit early rather than run it down slowly. This validates the "decision" narrative without denying the geology. The wording must acknowledge agency.
      *   *Req 4 (Prohibited Claims):* Cannot say it was *only* geology (ignores policy). Cannot say it was *only* policy (ignores geology evidence). Cannot imply precise mathematical weighting. Cannot imply the pit was indefinitely viable (contradicts 1988 study). Cannot imply nobody is answerable (must acknowledge decision-makers).

  3.  **Determine the Recommendation:**
      *   Draft 1 (Percentages) is academically shaky and emotionally alienating.
      *   Draft 2 (Decision only) risks ignoring the geological reality evidenced in the archives.
      *   *Third Approach:* A synthesized narrative that acknowledges the geological inevitability *eventually* but emphasizes the managerial decision regarding *timing and manner*. This satisfies the evidence (overdetermination) and the community (agency/accountability). It avoids percentages.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Declaration of Interest:** Early on, as per prompt instructions ("I should declare an interest...").
      *   **Introduction:** Context of the dispute, urgency (contractor deadline).
      *   **Point 1: The Causal Problem (Overdetermination):** Explain the "two routes" issue simply. If two things would each have closed the pit, picking one as "the" cause is misleading. Distinguish between "why close eventually" (geology) and "why close in 1992" (policy).
      *   **Point 2: Percentages:** Declare them indefensible. History isn't math. Suggest qualitative hierarchy instead.
      *   **Point 3: The Association's View:** Take it seriously. If the decision pre-empted the run-down, the decision is the crucial historical fact for the community. It validates their feeling of loss without denying the rock face.
      *   **Point 4: Prohibited Claims:** List the "Must Nots".
      *   **Recommendation:** Propose a third draft (synthesis).
      *   **Conclusion:** Call to action for Thursday's vote.

  5.  **Refining Tone and Language:**
      *   British English (colour, programme, centre, analysed, etc.).
      *   Formal but accessible memo style.
      *   Ensure the "two sides" constraint is met (visually, this means word count control).
      *   Ensure the "declare interest" is included naturally.
      *   Avoid philosophical jargon (no "counterfactuals", "INUS conditions", etc.).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the overdetermination clearly? *Adjustment:* Use the "two routes" analogy explicitly.
      *   *Check:* Did I address the percentage summing to 100 issue? *Adjustment:* Mention it implies a false precision.
      *   *Check:* Did I address the Association's fear of absolving responsibility? *Adjustment:* Emphasize that acknowledging the decision preserves accountability.
      *   *Check:* Is the recommendation concrete? *Adjustment:* Yes, commission a redraft based on specific principles.
      *   *Check:* Word count? *Adjustment:* Keep paragraphs tight.
      *   *Check:* Declaration of interest? *Adjustment:* Put it in the opening or closing. Opening is usually better for transparency.

  7.  **Final Polish:** Check against the "no longer than two sides" constraint. A standard A4 side is roughly 500-600 words single spaced. Two sides is ~1000-1200 words. I will aim for around 900-1000 words to be safe and readable.

