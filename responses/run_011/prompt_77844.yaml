answer: |-
  ### 1. Exam Question

  You are a traveler in Damascus. Death appears and says, "I have an appointment with you tomorrow in Aleppo." You possess no evidence regarding Death's movements apart from this announcement. However, you know your mind works like a mirror: whenever you settle on going to a city, your credence that Death will be there snaps to 1; if you abandon the plan, it drops to 0. You entertain exactly two hypotheses: H1 (the appointment was fixed beforehand; your choice is causally irrelevant) and H2 (Death goes wherever you end up). Your prior split between H1 and H2 is unspecified.

  Does this mirror stipulation refute Evidential Decision Theory, or does it describe an epistemic state no deliberating agent could coherently occupy? Take a definite stand. In your argument, address whether there is any deliberative equilibrium here given that every act carries zero expected utility once chosen, and handle the worry that a deliberating agent cannot treat her own act as something she has a probability for (ratificationism).

  ***

  ### 2. Model Answer

  The mirror stipulation does not refute Evidential Decision Theory (EDT); rather, it describes an epistemic state incoherent for a deliberating agent. The failure lies not in EDT's calculation mechanism, but in the impossibility of holding the required beliefs while simultaneously choosing. To see this, we must analyze the relationship between the agent's credences and the hypotheses governing the world.

  The stipulation states that settling on a choice snaps the credence in Death's location to 1. For a rational agent, conditional probabilities must reflect believed correlations. If I believe my choice merely correlates with Death's location due to a common cause (H1), my credence should not snap to 1 upon forming an intention unless I believe my intention is infallible evidence. But infallible evidence of this sort implies that the choice determines the outcome. Therefore, holding the "mirror" belief functionally entails certainty in H2 (Death tracks me). If the agent is certain of H2, Death's initial announcement provides no new information. The puzzle dissolves because the announcement was never news; the agent already knew Death would be wherever she decided to be. The decision problem becomes vacuous because the outcome is fixed by the deliberation itself, not by an external threat.

  Consequently, there is no deliberative equilibrium. EDT recommends choosing the act with the highest expected utility conditional on that act. In this scenario, conditional on going to Aleppo, the probability of death is 1. Conditional on staying in Damascus, the probability of death is also 1 (assuming the mirror applies to the alternative or the announcement fixed the expectation of death regardless). If every available act carries a conditional probability of death equal to 1, every act has zero expected utility relative to survival. An agent cannot maximize utility when all options are equally fatal conditional on their selection. The decision matrix collapses because the evidence conditional on the act always defeats the act.

  This connects directly to ratificationism. A ratificationist argues an act is admissible only if it remains optimal given the evidence that you have chosen it. In this case, choosing Aleppo provides evidence that Death is in Aleppo. Thus, choosing Aleppo makes Aleppo the worst place to be. The act defeats itself. If I choose Aleppo, I should have chosen Damascus. But if I choose Damascus, the mirror implies Death is there, so I should have chosen Aleppo. There is no stable point where I can say, "Given that I am doing this, this is the best thing to do." The loop is vicious because the evidence provided by the choice overrides the utility of the choice.

  Therefore, the case fails as a counterexample to EDT because it demands the agent treat her own decision as a fixed predictor of external events while simultaneously asking her to decide between them. You cannot coherently assign probability 1 to an outcome based on your own choice while treating that choice as a free variable in a decision matrix. The mirror stipulation collapses the distinction between the evidence and the act. The correct conclusion is not that EDT is false, but that the scenario describes a psychological impossibility for a rational deliberator. The agent cannot occupy the epistemic state required to run the calculation without undermining the deliberation itself. To deliberate is to treat the future as open; the mirror stipulation treats the future as closed by the deliberation. These stances are mutually exclusive.

  ***

  ### 3. Marking Scheme (25 Marks)

  1.  **Stipulation Accuracy (3 marks)**
      *   Correctly cites the mirror mechanic, H1/H2 split, and lack of prior evidence.
      *   *Typical Error:* Student invents priors for H1/H2 or ignores the "snap-to-1" constraint.
  2.  **The H1/H2 Credence Link (5 marks) [Recitation Catch]**
      *   Identifies that "snap-to-1" credence implies functional certainty of H2.
      *   *Typical Error:* Student defines EDT/CDT generally but fails to link the specific credence mechanic to the hypothesis certainty.
  3.  **The News Value of the Announcement (4 marks)**
      *   Argues that if H2 is certain, the Announcement provides no new information (is vacuous).
      *   *Typical Error:* Treats the Announcement as independent evidence despite the mirror stipulation.
  4.  **Deliberative Equilibrium Analysis (5 marks)**
      *   Explains why no equilibrium exists (all acts yield zero/negative EU conditional on choice).
      *   *Typical Error:* Claims equilibrium exists at "stay" or "go" without addressing the conditional utility collapse.
  5.  **Ratificationism Application (4 marks) [Recitation Catch]**
      *   Applies ratificationism to show acts are self-defeating (choice makes act suboptimal).
      *   *Typical Error:* Student defines ratificationism abstractly but does not apply it to the self-defeating nature of the mirror acts.
  6.  **Definite Stance (2 marks)**
      *   Clearly argues for incoherence OR refutation (no hedging).
      *   *Typical Error:* Concludes with "both sides have merit" or refuses to judge the coherence.
  7.  **Argument Flow (2 marks)**
      *   Logical progression from credence structure to equilibrium failure.
      *   *Typical Error:* Disjointed points that do not build toward the conclusion.

  ***

  ### 4. Differentiation Note (A vs. B)

  **The Differentiating Move:** The explicit link between the "snap-to-1" credence and the collapse of the H1/H2 uncertainty (Marking Scheme Move 2).

  **Concrete Application:** A **B-grade** answer will correctly identify that there is no deliberative equilibrium and that ratificationism fails, treating the mirror as a tricky correlation that breaks the decision matrix. An **A-grade** answer will go further to argue that the mirror stipulation *itself* is the incoherence: it forces the agent to be certain of H2 simply by deliberating, which renders the Announcement non-news and the decision problem vacuous before the calculation even begins. The A answer identifies that the agent cannot occupy the epistemic state required to run the EDT calculation, whereas the B answer assumes the state is possible but fatal to EDT.
