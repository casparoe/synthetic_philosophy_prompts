  3.  **Evaluate Specific Pressure Points:**
      *   *Irreversible vs. Permanent:* Crucial distinction in DCD (Donation after Circulatory Death). "Irreversible" means cannot restart on its own or with intervention. "Permanent" means it won't restart on its own, but *could* be restarted if someone tried. In DCD, we usually mean "permanent" (we won't try to restart), but the law says "irreversible." This is a major point of contention.
      *   *Whole-Brain vs. Consciousness:* The law says *entire* brain (including brainstem). The podcast says it's really about *consciousness* (higher brain). Defenders of whole-brain say the brainstem controls integration of the body, not just consciousness. If the brainstem is dead, the body is no longer an integrated organism.
