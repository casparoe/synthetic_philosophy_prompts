answer: |-
  1. **Is (M) doing work?**
  Yes and no. Formally, (M) is just the Law of Total Probability applied to the Principal Principle (PP). If you accept PP and a partition of chance hypotheses, (M) is a theorem, not an axiom. You claim it's "stronger" because it constrains credence when "no single chance hypothesis is known admissibly." This is misleading. PP is a conditional norm; it tells you what your credence *would be* if you knew the chance. (M) tells you what your credence *is* given your uncertainty about the chance.

  The "work" you think (M) is doing (bypassing admissibility) is actually being done by your definition of $H_i$. You define $H_i$ as "complete... specifications of what the chances are." If $H_i$ are truly complete (i.e., they include the history-to-chance conditionals required for Lewis's New Principle), then (M) is just the New Principle aggregated. If $H_i$ are just "Chance(A) = x", then (M) fails without an admissibility constraint on the evidence used to form $Cred(H_i)$. You haven't eliminated admissibility; you've buried it in the requirement that $H_i$ be "complete." Unless you explain how an agent forms $Cred(H_i)$ without admissible evidence, (M) is just Lewis's remark wearing a hat, as you suspect.

  2. **The Lab-Device Case**
  The numbers are hiding a contradiction in your setup.
  You define $H_i$ as "jointly exhaustive." In your case, $H_1$ (ch=0.2) and $H_2$ (ch=0.8).
  You then say 500/1000 heads "points at a chance near 0.5, which was supposed to be excluded."
  If $H_1$ and $H_2$ are *exhaustive*, a chance of 0.5 is metaphysically impossible in your model. 500/1000 is unlikely under both $H_1$ and $H_2$, but it is not evidence for a third hypothesis unless your partition was *not* exhaustive.
  If the partition wasn't exhaustive, (M) does not constrain your credence regarding the missing $H_3$. You write: "the fact that the mixture now wants an H you left out... is itself the information." (M) cannot "want" an $H$ that isn't in the sum. (M) is silent on $H_3$.
  Furthermore, you conflate *undermining* with *statistical surprise*. Undermining is when the history makes the chance hypothesis false (e.g., Humean supervenience). 500/1000 is compatible with ch=0.2 (just low probability). It doesn't undermine $H_1$; it just disconfirms it. Your case doesn't demonstrate (M) solving undermining; it demonstrates Bayesian updating on a potentially misspecified model.

  3. **The Strongest Objection**
  **The Inadmissible Evidence Problem.**
  You claim admissibility "evaporates" and is derived as "weight-neutral" evidence. This fails for standard inadmissible evidence.
  Suppose I have inadmissible evidence $E$: I have seen the coin land Heads.
  My chance hypotheses $H_1$ (0.2) and $H_2$ (0.8) remain unchanged (seeing the outcome doesn't change the chance at $t$).
  Therefore, my weights $Cred(H_i)$ are unchanged.
  (M) dictates: $Cred(Heads) = 0.5 \times 0.2 + 0.5 \times 0.8 = 0.5$.
  But rationality requires $Cred(Heads | E) = 1$.
  (M) violates Conditionalization on certain evidence.
  Your escape route is to say $E$ shifts the weights. But why should seeing the outcome shift my credence in the *chance hypothesis*? If I know the device is set to 0.2, seeing a Head doesn't make me think it's set to 0.8. It just makes me think the outcome occurred.
  (M) cannot distinguish between evidence that bears on the *chance* and evidence that bears on the *outcome* given the chance. It treats all evidence as evidence about $H_i$. This is why the conditional PP needs an admissibility clause: to block evidence about the outcome from bypassing the chance function. (M) lacks this block.

  4. **Errors and Sloppiness**
  *   **Lewis's Reformulation:** Your gloss is wrong. Lewis's New Principle (1994) isn't just "conditionalize on the chance given total evidence." It is $C(A | T_w H_w) = ch_w(A)$, where $T_w$ is the theory of chance and $H_w$ is the history. It specifically uses history-to-chance conditionals to block undermining. Your (M) sums over $ch_i(A)$, not $ch_i(A | E)$.
  *   **The Promissory Note:** You flag $ch_i(A | E) = ch_i(A)$ as a promissory note. It's not a note; it's the definition of admissibility relative to $H_i$. You cannot derive this from "$H_i$ being a complete specification" without assuming $H_i$ includes the entire history (which returns you to the New Principle). If $H_i$ is just "chance is x", the equation fails for inadmissible $E$.
  *   **"Complete Specifications":** You use this phrase to do too much work. If $H_i$ specifies the complete history, you have the New Principle. If $H_i$ specifies only the chance value, you have the Old Principle and need admissibility. You are oscillating between the two to make (M) look like it solves problems unique to the New Principle while retaining the simplicity of the Old.
  *   **Undermining Gloss:** "Undermining cases are just cases where your partition was wrong, noticed late." This is category confusion. Undermining cases are where the partition is *right* about the chances, but the history supervening on those chances makes the chance assignment false. It's not a partition error; it's a metaphysical tension between chances and histories.

  **Summary:** (M) is the Law of Total Probability applied to PP. It doesn't solve admissibility; it assumes a partition that already handles it (or fails to). The lab case confuses statistical disconfirmation with undermining. The inadmissible evidence objection shows (M) violates conditionalization. Tighten the definition of $H_i$ or admit (M) is just the New Principle in summation form.
