answer: |-
  This is a classic "Shoreline" objection to supervaluationism, often attributed to critics like Timothy Williamson or Rosanna Keefe (though Keefe defends supervaluationism, she articulates the worry well). Your friend has reconstructed a version of the **Higher-Order Vagueness Regress** argument. It's a strong argument, which is why you argued for three hours.

  Here is the brainstorming landscape you asked for, mapping the dialectical space before we commit to a diagnosis.

  ### Brainstorming the Dialectical Space

  **Moves available to the Critic (Your Friend):**
  *   **Press the "Intended Interpretation":** If the set of admissible precisifications is vague, there is no fact of the matter about which model represents English. If there's no fact of the matter, "supertruth" is undefined.
  *   **Press the "Determinacy Operator":** If supervaluationism defines determinacy ($\Delta p$) as truth on all admissible precisifications, then $\Delta\Delta p$ requires admissibility of admissibility. If this never stops, we can't define the logic.
  *   **Collapse Argument:** Claim that any constraint on admissibility strong enough to do semantic work *just is* a sharp boundary, making the view epistemic in practice.

  **Moves available to the Supervaluationist (You):**
  *   **Model-Theoretic Defense:** Distinguish between the *object language* (vague) and the *metalanguage* (precise set theory). We use sharp tools to describe vague things. This attacks (3) or (5).
  *   **Contextualism:** "Admissible" is context-sensitive. In a specific conversational context, the set of admissible precisifications is fixed (sharply) for that context, without being fixed globally.
  *   **Benign Regress:** Accept the regress in (6) but deny it is *vicious*. Higher-order vagueness is a feature of reality/language, not a bug in the theory.
  *   **Pragmatic Stop:** We don't need the semantics to "bottom out" in a non-vague foundation to be useful or truth-apt.

  ---

  ### The Diagnosis

  You are right to be suspicious of (4), but technically (4) is an instance of the Law of Excluded Middle (either "admissible" has a sharp extension or it doesn't). The real error isn't the disjunction itself, but the **consequences your friend draws from each horn.**

  If you want to keep (3) (that the metalanguage is vague), you **must reject (6)**.
  However, the philosophically stronger move—and the one that actually saves supervaluationism from collapsing—is to **reject (5)**.

  Here is why (5) is the step that has to go, why it looked plausible, and what it costs.

  #### 1. Why Reject (5)? (The "Model vs. World" Distinction)
  **The Step:** "If she draws a sharp line [around admissibility]... that's epistemicism with extra steps."
  **Why it looked fine:** It assumes that if there is a precise fact about which precisifications are admissible, there must be a precise fact about where the extension of "bald" begins. If the *semantics* has a sharp boundary, surely the *world* does too?
  **Why it fails:** This conflates the **precision of the theory** with the **precision of the subject matter**.
  Supervaluationism is typically formulated in classical set theory (a precise metalanguage). In the model, the set of admissible precisifications is a specific set $S$. There is a sharp boundary to $S$ *within the model*. But the Supervaluationist claims this model *represents* a vague language. The sharpness is in the representation, not the thing represented.
  Epistemicism claims there is a sharp boundary in the **actual usage/truth-conditions** of English (we just don't know it). Supervaluationism claims there is a sharp boundary in the **set of candidate extensions** we are considering, but no fact of the matter about which one is *the* extension.
  **The Cost:** Giving up (5) costs the Supervaluationist the claim that their theory is "ontologically innocent." They must admit their semantic theory is more precise than the language it describes. They have to accept that they are using sharp concepts (sets, functions) to model vague ones, and that this doesn't "transmit" sharpness to the object language. This opens them to the charge that they are just "pretending" the vagueness is there while doing precise math.

  #### 2. Addressing (6) and the Regress (Since you want to keep (3))
  If you insist on keeping (3) (that "admissible" is itself vague), you are forced down the second horn of (4). Now you must defend against (6).
  **The Step:** "...the semantics never gets fully stated and no truth-value is ever really determined."
  **Is the regress vicious?** **No.**
  **Why:** The regress in (6) corresponds exactly to **higher-order vagueness**.
  *   Order 1: Is he bald? (Vague)
  *   Order 2: Is it determinate that he is bald? (Vague)
  *   Order 3: Is it determinate that it is determinate...? (Vague)
  Supervaluationism captures this by iterating the "supertruth" operator. The fact that the semantics doesn't "bottom out" in a non-vague foundation isn't a failure; it's an accurate map of the territory. Language *is* vague all the way up.
  **The Cost:** If you accept this, you give up **semantic foundationalism**. You cannot provide a finite, non-vague specification of the truth conditions for vague sentences. Your friend will say this means you haven't actually explained meaning. You have to reply that meaning doesn't *require* a non-vague foundation. This is a pragmatic cost: you lose the ability to silence the skeptic who demands a final, precise truth-condition.

  #### 3. What about your suspicion of (4)?
  You suspected (4) was "too tidy." You were intuitively correct, even if (4) is logically valid.
  (4) assumes that "drawing a sharp line" and "accepting a vague metalanguage" are the only two options for *how we theorize*.
  The missing option (which dissolves the force of the dilemma) is **Contextualism about Admissibility**.
  "Admissible" isn't vaguely fixed globally, nor is it sharply fixed globally. It is **sharply fixed relative to a context**. In any given conversation, the context selects a specific set of precisifications. The boundary of that set is sharp *for that context*, but shifts as the context changes.
  This allows you to deny the global sharpness required for Epistemicism (rejecting 5) while avoiding the global regress (rejecting 6).
  **The Cost:** This moves you away from "Global Supervaluationism" toward "Local Supervaluationism" or Contextualism. It complicates the logic (truth becomes context-dependent in a stronger way).

  ### Verdict: Who Won?

  **You won, but on a technicality your friend missed.**

  Your friend's argument relies on the inference in **(5)** being true. They assume that *any* sharp boundary in the semantics entails Epistemicism about the world. That is the non-sequitur.
  *   **Epistemicism:** There is a fact of the matter about whether 5,432 hairs is bald.
  *   **Supervaluationism:** There is a fact of the matter about whether "5,432 hairs" is in every admissible precisification *given our current semantic model*.
  These are different facts. The second can be sharp without the first being sharp.

  **How to defend it (keeping (3)):**
  Tell your friend: "I accept (3). I accept the regress in (6). But I deny it is vicious. The regress just mirrors higher-order vagueness. The fact that my semantic theory doesn't terminate in a precise foundation doesn't mean truth-values aren't determined; it means truth-values are determined by a vague structure, which is exactly what I claimed in the first place. You are demanding that a theory of vagueness be precise, which begs the question."

  **How to defend it (better strategy, dropping (3)):**
  "I reject (3). I use a precise metalanguage (set theory) to model vague language. I reject (5). A sharp boundary in my *model* does not imply a sharp boundary in *English*. I am not an Epistemicist because I deny there is a unique intended precisification. I'm just using sharp tools to draw a blurry picture."

  **Summary of Costs:**
  *   **Rejecting (5):** You must accept that semantic theories are more precise than the languages they describe.
  *   **Rejecting (6):** You must accept that semantics is non-foundational (no "bottom" level of meaning).
  *   **Rejecting (4) (via Contextualism):** You complicate your logic to handle context-sensitivity.

  Your friend tried to force a collapse by demanding that *semantics itself* must be vague or *reality itself* must be sharp. The Supervaluationist middle ground is: *Semantics is sharp (in the model), Reality is vague (in the world), and the link between them is what handles the vagueness.* Don't let them conflate the map with the territory.
