answer: |-
  Ilse and Ravi sit at a small table, the printout of the twelve figures spread between them. The thirteenth figure, the probe, lies slightly apart.

  Ilse: Eleven out of fourteen solved it. Six minutes median. That looks like selection, not construction. They had the vocabulary—counting, sides, containment—and they searched until they found the match.

  Ravi: And one participant drew a new figure: seven shapes, dot in a heptagon. A shape that appears nowhere in your set. If this were merely selection from a pre-existing list of hypotheses, where did 'heptagon' come from?

  Ilse: From compositionality. They have 'seven' and they have 'polygon'. Combine them. The hypothesis space is infinite because the language of thought is recursive. The fact that they generated a novel instance doesn't mean they constructed a new concept. It means they used old rules to generate a new case.

  Ravi: But they didn't just generate a case. They treated 'number of sides' as a variable to be equated with 'number of shapes'. That's not just combining words. It's recruiting a perceptual count into a logical equation. Before this, 'three' might have meant 'three things'. Now it means 'a value comparable to side-count'. That's a change in the type structure of their cognition, not just an instance within a fixed structure.

  Ilse: Here is the circularity worry, Ravi, and I want it sharp. You describe this new type structure using vocabulary you already have: 'variable', 'equation', 'count'. If you can represent the end state of their learning, why couldn't they? If the description is available to the theorist, it must be available to the learner's system, just unselected. You're smuggling the concept in to explain its acquisition.

  Ravi: I'm not smuggling it in. I'm distinguishing between having a representation and having it available for a specific computational role. I can describe a screwdriver to you, but that doesn't mean you can use it to drive a screw until you recruit your motor routine for twisting. The participant didn't just have 'count'. They had to make 'count' enter into an equality check with 'side-number'. That functional recruitment is the construction.

  Ilse: Then explain the two who said they saw which side a fresh figure belonged on before they could say why. If they constructed a new predicate, surely the codification comes first?

  Ravi: No. Perceptual restructuring precedes propositional report. They saw the gestalt—the balance between shape-count and side-count—before they could articulate the rule. That lag is the signature of system-building.

  Ilse: Or it's the signature of unconscious hypothesis testing. They tested 'equality', it fit, and the feeling of fit arrived before the verbal label. That explains the lag without positing new machinery. And look at the four who failed. They offered rules that were false but perfectly statable: 'dot is in the shape with the most sides', 'shapes all nest'. They searched the space, just poorly.

  Ravi: They searched using old tools. That's why they failed. The successful ones didn't just search; they built a ruler to measure the problem. Consider the probe. Three shapes. Dot in a hexagon and an overlapping triangle. Three sides versus six. The rule as stated doesn't determine an answer. Yet three called it Left.

  Ilse: Because they selected the hypothesis 'equality holds' and found a container that fit—the triangle. They resolved the ambiguity by fitting the data to the hypothesis.

  Ravi: They extended the concept despite the ambiguity. They didn't just fit data; they decided that the relation of equality was the invariant, even when the container was ambiguous. The one who said 'doesn't count' refused the extension. The three who said 'Left' treated the new figure as a member of the kind they had just constructed.

  Ilse: I concede that search constraints are the hard part. If the space is infinite, what limits the search to plausible hypotheses like 'equality' rather than 'prime number of sides'? I don't have a full account of the constraint mechanism.

  Ravi: And I concede that I cannot describe the new concept without using the old vocabulary. I need 'count' and 'equality' to tell you what they built. But the building is real.

  Ilse: Then we are at the crux. For me, the unboundedness of the search space via compositionality shows that nothing new is needed. The learner finds the coordinate in a fixed space.

  Ravi: For me, the change in computational type shows that the space itself expands. The learner builds a new axis for the coordinate system.

  Ilse: Learning is finding the right path in a fixed maze.

  Ravi: Learning is building a new door in the wall.
