answer: |-
  This is a tight, rigorous argument. You have effectively reconstructed the **Big Bad Bug** (Lewis 1980, 1994) but framed it as an *epistemic access* problem rather than a *metaphysical compatibility* problem. That is a genuine contribution, and it explains why the conclusion feels so damning: you've shown that even if the metaphysics holds, the *epistemology* of Humean chance collapses for any agent who actually *knows* the chance.

  You want to keep (1) PP and (3) Humeanism. You are staring at (4), (5), and (6).

  Here is the diagnosis: **You must cut the generalization in (6).**

  Step (5) (The Closed-World Case) is valid. In a finite, closed Humean world, chance *is* epistemically idle for an agent who knows the mosaic. If you know the frequency of the whole sequence, you don't need the chance to predict the next flip; you just count. Step (5) correctly identifies that PP is vacuous for an omniscient Humean agent.

  The error is in **Step (6)**, where you generalize from the Closed-World case to *any* Humean world (including ours). Specifically, the inference from "Any mosaic evidence sufficient for $H_x$ reaches past the admissible boundary" to "Hence an agent who knows a chance hypothesis never has only admissible evidence" relies on an equivocation about what it means to "know" or "use" a chance hypothesis in the context of PP.

  ### Why Step (6) Looked Innocent
  It looked innocent because of (3). If chances supervene on the whole mosaic, it feels like *grasping* the chance requires grasping the mosaic. If grasping the mosaic requires knowing the future, and knowing the future is inadmissible, then using the chance is inadmissible.

  This is the seductive pull of Humeanism: it makes chance facts look like "compressed" future facts.

  ### Why Step (6) is False (The Fix)
  Step (6) fails because it conflates **metaphysical determination** with **epistemic justification**.

  1.  **PP is a norm for uncertain agents, not knowers.**
      The Principal Principle (1) is a constraint on *conditional credence*: $Cr(p | H_x \& E) = x$. It does not require the agent to *know* $H_x$ (i.e., assign it credence 1 based on entailment). It applies to agents who *hypothesize* $H_x$.
      In our world (an open, infinite, or sufficiently large mosaic), we never have evidence $E$ that *entails* $H_x$. We have inductive evidence from the past ($A$) that makes $H_x$ *probable*.
      Crucially, **inductive evidence from the past is admissible.**
      When we apply PP, we are not conditioning on the *whole mosaic* $M$ (which is inadmissible). We are conditioning on the *proposition* $H_x$ (which we treat as admissible) alongside our past evidence $E$.
      The fact that $H_x$ *metaphysically depends* on $M$ does not mean that *conditioning on* $H_x$ provides the same information as *conditioning on* $M$, unless $H_x$ rules out all undermining futures. In an open world, $H_x$ does *not* rule out specific outcomes; it only assigns them weights.

  2.  **The Closed-World Exception.**
      Your argument works perfectly in the Closed-World case (5) because in that specific scenario, $H_x$ *does* entail facts about $p$ (due to the finite frequency constraint). In that specific case, $H_x$ *is* inadmissible.
      But in our world, the "undermining" futures are negligible or metaphysically possible. $H_x$ (e.g., "Tritium decay chance is 0.5") does not entail "This atom decays." It only entails "The long-run frequency is 0.5."
      Therefore, in our world, $H_x$ does not smuggle in outcome information *unless* we also know the rest of the mosaic. Since we don't know the rest of the mosaic, $H_x$ remains admissible *for us*.

  ### The Cost of Cutting (6)
  If you cut the generalization in (6), you save PP and Humeanism, but you pay a price:

  1.  **PP is Context-Sensitive:** You must admit that PP is not a universal metaphysical law that holds for all agents in all worlds. It is a norm that holds for *epistemically limited* agents in *open* worlds. In closed worlds (or for God), PP is false or vacuous.
  2.  **The "Bug" Remains Latent:** You are effectively arguing that PP is *approximately* true for humans because we lack access to the inadmissible evidence (the future mosaic). This is very close to Lewis's eventual motivation for the **New Principle (NP)**.
      *   *Your move:* You don't have to adopt the NP formalism ($Cr(p | T \& E) = x$) to make this point. You can argue that for all *human* purposes, $H_x$ is admissible because the "undermining" information is inaccessible.
      *   *The Risk:* A sharp examiner will say, "If $H_x$ is inadmissible metaphysically, why is it admissible epistemically?" Your answer must be: "Because admissibility is defined relative to the agent's information state, not just the proposition's content." (This is a defensible, though controversial, reading of Lewis's "gloss" in (2)).

  ### Alternative Cuts (And Why You Shouldn't Make Them)

  *   **Cut (3) Humeanism:** This is the "honest" metaphysical move. If chances are primitive (Armstrong, Bird), they don't supervene on the mosaic. Then $H_x$ doesn't entail $M$, and the argument collapses.
      *   *Cost:* You contradict your advisor's career work. Do not do this for a chapter draft unless you are prepared for a fight.
  *   **Cut (2) Admissibility:** You could argue that "admissibility" just *means* "evidence that doesn't violate PP."
      *   *Cost:* This makes PP trivial/tautological. It saves the principle but drains its content.

  ### Recommendation for Thursday
  Walk in with the **Epistemic Limit Defense**.

  1.  **Concede (5):** Agree that in a Closed Humean World, chance is idle. That's a bullet worth biting. It shows you understand the stakes.
  2.  **Deny (6):** Argue that the generalization fails because human agents never possess the "mosaic evidence" required to make $H_x$ inadmissible. We possess *past* evidence.
  3.  **Reframe the Conclusion:** Instead of "PP never applies," conclude: "PP applies *only* because we are ignorant of the future mosaic. Humean chance is epistemically robust *in virtue of* our ignorance."
  4.  **The "Fix":** Propose a modest refinement to (2). Admissibility isn't just about the *content* of $E$; it's about the *route* by which $E$ bears on $p$. For a Humean, $H_x$ bears on $p$ via the Best System. Even if the Best System supervenes on the future, our *access* to it is via the past. Therefore, for us, it is admissible.

  This allows you to keep (1) and (3), acknowledges the depth of the problem (you aren't ignoring the Bug), but blocks the nihilistic conclusion (7). You aren't proving chance is idle; you're proving chance is a *human-scale* tool that breaks at the limit of omniscience.

  **One warning:** Be prepared for the question: "If $H_x$ entails $M$, and $M$ entails $p$, doesn't $H_x$ entail $p$?"
  **Answer:** "No. $H_x$ says 'The Best System assigns probability $x$ to $p$'. In a probabilistic system, the Best System does *not* entail $p$. It only entails the probability. It only entails $p$ in the Closed-World frequency case, which I have already conceded."

  Good luck. This is PhD-worthy work; don't let the nihilism win.
