      *   *Drafting - Section 3: Empirical Load-Bearing.* Insular stimulation is key. If you can stimulate "ouch" without "where," ABT wins. If cingulotomy leaves sensation pure, ABT wins. Killer finding: If sensory activation *always* co-occurs with affective activation in healthy systems, suggesting the dissociation is a breakdown, not a revelation of structure.
