  We often talk about marriage as if it's a destination you arrive at, a place where the work is done. But standing here, looking at the two of you, I see a project. A vow isn't a crystal ball. It doesn't predict that the feeling you have right now will remain static for fifty years. Feelings are weather; they change. You can't honestly promise a sunny day forever. To promise a feeling is to tell a lie about the future. But you can promise to bring an umbrella. You can promise to stand in the rain together. You can promise that when the weather turns, you won't run for cover alone.

  That is the distinction that matters. You didn't promise a feeling. You promised a conduct. You promised to prioritize this partnership even when it's difficult. You promised to show up. Bertrand Russell once wrote that the essence of a happy marriage is generosity rather than duty. I see that generosity in you. It's in [Detail 1: e.g., the way he learns her coffee order by heart]. It's in [Detail 2: e.g., how she defends his wild ideas at dinner parties]. It's in [Detail 3: e.g., the map on their wall marked with places they intend to go]. You aren't completing each other; you are challenging each other to be better.

  Looking around this room, I see two families who love you deeply, with different traditions and different ways of praying. You are bridging those worlds. You've chosen a path that is entirely your own, including the decision to keep your future focused just on the two of you. That requires a clarity many never find. It means your permanence isn't a fact of nature, but a fact of your own making. It is something you build, day by day.

  So, my wish isn't that you never face difficulty. My wish is that you keep choosing this. Keep choosing the generosity. Keep choosing the friendship. And please, for the sake of the open bar, and the sleeping great-aunt in the back, don't choose to make this speech any longer than it already is.

  To [Couple].

  ***

  **Invented Details for Replacement:**
  1.  **[Detail 1]:** *the way he learns her coffee order by heart* (Replace with specific act of service/attention).
  2.  **[Detail 2]:** *how she defends his wild ideas at dinner parties* (Replace with specific instance of support/loyalty).
  3.  **[Detail 3]:** *the map on their wall marked with places they intend to go* (Replace with specific object in their home).

  ***

  **Note on Philosophical Slip-ups:**

  1.  **"You are challenging each other to be better."**
      *   *Risk:* This flirts with the "completion" myth (that you need the other to be whole/better).
      *   *Check:* I framed it as "challenging" rather than "completing," implying two whole agents pushing each other, but ensure your delivery doesn't imply they were *incomplete* before.
  2.  **"Your permanence isn't a fact of nature, but a fact of your own making."**
      *   *Risk:* This could be heard as saying permanence *is* achievable/factual if you work hard enough.
      *   *Check:* The distinction is "fact of nature" (destiny) vs. "fact of making" (project). It avoids guaranteeing the outcome, but implies the *attempt* is the reality. It's the safest formulation of the load-bearing wall, but watch the emphasis don't land on "permanence" as a guaranteed result.
  3.  **"Keep choosing the friendship."**
      *   *Risk:* Russell emphasized friendship, but some conventional views prioritize romantic passion.
      *   *Check:* This is safe for your view, but ensure it doesn't sound like you're downgrading their romance to mere pals. The context of "generosity" should buffer this.
