prompt: |-
  I am a novelist, and what I need from you is a classification instrument, not an essay.

  My protagonist — call him Elias — is a municipal bridge inspector in a small port city. Every weekday at 05:40 he walks the same four-kilometre route across the same two spans, examining the same eleven expansion joints in the same order with the same steel feeler gauge. He devised the route himself, decades ago, after a span collapsed in another country; he has shortened it once, when a deck was replaced, and lengthened it once, when a new crack pattern appeared on the eastern pier. He has never missed a day. When the sequence is interrupted — a delivery truck across the walkway, a locked gate — he does not resume where he stopped; he returns to the start and begins again. Asked why he does it, he says it has to be done, and cannot elaborate. He reports no experience of choosing: the round presents itself each morning as something that must happen rather than as an option he takes up. In one scene his daughter moves his gauge two metres along the parapet while he is inside the maintenance hut; he finds it, carries it back to its place in the order of things, and starts the round over. He is untroubled by all of this and would refuse an offer to change.

  A philosopher friend who read the draft says Elias exhibits sphexishness — the rigidity illustrated by the old digger-wasp anecdote, in which a wasp hauls paralysed prey to the mouth of its burrow, leaves it there while she goes inside to inspect, and, if the prey is displaced during that inspection, finds it, drags it back to the threshold, and begins again, apparently without end. He adds that the anecdote is disputed: the wasp may adapt after enough repetitions, and re-inspecting a disturbed nest may be a sensible standing policy rather than a malfunction. I want that dispute exposed by the instrument, not settled by it.

  My difficulty is practical. Two early readers disagree about whether Elias is unfree, and their disagreement turns out to be a disagreement about what the question even is. Some hold that a fixed routine is beside the point so long as nothing prevents him; some that it is fatal because he could not have done otherwise; some that everything depends on where the routine came from; some that a routine this reliable is an accomplishment rather than a deficit; some that praise and blame survive all of it regardless; some that I am asking something malformed.

  So: build me a decision tree that sorts a reader — or a character — into a position on whether mechanical rigidity of this kind is compatible with free will, and, where the positions come apart, with responsibility, self-rule, or standing as a person.

  Constraints on the instrument:

  1. Construct it from the logical space first, not from a roster of views. State your axes before you place anyone.
  2. Eight to eleven nodes. Each must be posed as a concrete situation or test that could be staged in a scene, answerable by someone with no philosophy at all. No node may use the vocabulary of the debate, and none may ask what a position is called.
  3. Six to nine leaves. These must appear, or be merged with an explicit justification: (a) the routine is irrelevant because the only constraint that matters is external interference, and there is none; (b) the routine is his — he made it and would endorse it if shown it — so the inability to do otherwise is not the issue; (c) what matters is whether his machinery would have responded differently had there been a reason to, even though it does not; (d) freedom is gone but responsibility survives; (e) no structural description settles it, because the disposition was installed by a history he did not choose; (f) reliability is itself a competence, and flexibility would make him worse at the thing; (g) freedom is graded by the range of circumstances an agent handles without breaking down, so he is partly free; (h) the question is malformed. Add at least one leaf of your own and say why the space needed it.
  4. These axes should be represented; you may regroup or rename them, but if you think one is spurious, say so: rigidity of means versus rigidity of ends; tracking how the world is versus tracking whether there is a reason; whether a flexible layer requires a fixed policy above it and whether that regress terminates harmlessly; whether origin matters or only present structure — his younger colleague walks the identical route for identical reasons but learned it from a manual; whether rigidity can be competence; whether the target is freedom, responsibility, self-rule, or personhood, and whether these come apart for Elias; whether self-transparency matters, given that he cannot state his rule but ratifies it when it is shown to him.
  5. Name the leaves, but do not name philosophers and give me no bibliography. Where you think a position is genuinely held, record it in the occupancy field and nowhere else.

  Return a single JSON object; one paragraph of framing beforehand is welcome, and nothing after. Schema:

  ```
  {
    "axes": [ { "axis_id": "", "name": "", "what_it_separates": "", "why_it_matters_for_elias": "" } ],
    "nodes": [ { "node_id": "N1", "reader_facing_question": "the exact wording a reader sees",
                 "situation": "the concrete scene or test being posed",
                 "options": [ { "option_id": "N1a", "text": "", "leads_to": "node id or leaf id" } ] } ],
    "leaves": [ { "leaf_id": "", "position_name": "", "one_line_claim": "",
                  "path": ["N1a", "N2b"], "most_awkward_commitment": "",
                  "occupancy": "defended | defensible but unclaimed | incoherent",
                  "revealing_scene": "", "fails_to_explain": "" } ],
    "unseparable_pairs": [ { "leaves": ["", ""], "why": "", "what_would_separate_them": "" } ],
    "empty_combinations": [ { "combination": [""], "diagnosis": "incoherent | unattractive | merely unexplored", "note": "" } ],
    "additions_and_omissions": [ { "item": "", "reason": "" } ]
  }
  ```

  Finally, using the tree you have built, tell me in `unseparable_pairs` which of these positions my synopsis as it stands cannot distinguish between — where I would need a new scene to force the choice.
