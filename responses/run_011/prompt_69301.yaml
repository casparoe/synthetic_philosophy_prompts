  Precisely: $(\delta_{initial} + \epsilon_{model}) \cdot G(t) < \text{Tolerance}$, where $\delta$ is measurement uncertainty, $\epsilon$ is model error, and $G(t)$ is dynamic error growth (e.g., $e^{\lambda t}$).

