  *   **Contested:** Whether quantum randomness is ontic (fundamental indeterminism) or epistemic (hidden variables); whether computational irreducibility implies fundamental unpredictability beyond chaos.

  **Consensus:** Predictability is not a property of the system alone. It is a relation between the **System**, the **Model**, and the **Observer's Precision**. Your gut is right: there is no intrinsic "predictable" tag, only a budget of uncertainty versus tolerance.
