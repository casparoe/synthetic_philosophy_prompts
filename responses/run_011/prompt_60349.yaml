      *   *Step 3: Non-Empirical Support.* (Philosopher leads). Apply the 4 criteria.
      *   *Step 4: Strategic Value.* (Trustees). Does this fit the foundation's risk profile?
      *   *Refinement for the "Hated Outcome":* To allow QG > SME, Step 3 needs to be weighted heavily. If QG scores high on Neighbouring Success and MI, it can beat SME's "modest prediction."

  5.  **Running the Procedure on the Two Proposals:**
      *   **Proposal A (Quantum Gravity):** String Theory or Loop Quantum Gravity (let's say String Theory for the "Neighbouring" angle). No experiment for decades. High NETA score (AdS/CFT applications in condensed matter = Neighbouring Success).
      *   **Proposal B (SME):** Adds a particle/parameter. Testable in 10 years (maybe LHC upgrade or neutrino exp). Modest theoretical gain.
      *   *Execution:*
