      *   *Analysis:* Is this just UEC? UEC is usually internal consistency or explaining *more* of $A$ than intended. If $T$ explains $B$, is $B$ just a subset of $A$? If $B$ is distinct (e.g., String Theory math applied to Condensed Matter), it's distinct from internal coherence. It's closer to empirical success, but not the *target* empirical success. It's "side-empirical success."
      *   *Decision:* It is distinct from UEC. UEC is about the *structure* of the theory fitting the *intended* phenomena better than expected. This is about *external* applicability. It functions as a proxy for robustness. I should treat it as a distinct input but note its evidential weight is lower than direct prediction.

  3.  **Develop the Decision Procedure (The "40-Minute Protocol"):**
