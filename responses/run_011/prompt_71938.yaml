answer: |-
  There is no single, canonical name for this specific defect in the standard literature of logic or probability theory. It is frequently subsumed under the broader heading of **equivocation** or discussed informally as a failure to specify the **conditioning set**. However, because you require a sharp carve-out that distinguishes it from plain semantic equivocation and reference class problems, I propose we call it **Information-State Equivocation**.

  Below is the definition, an evaluation of your examples, the boundaries against nearby concepts, and the conditions under which I would revise this assessment.

  ### The Name and Definition

  **Term:** Information-State Equivocation

  **Definition:** A formal or informal probabilistic argument in which a probability term $P(X)$ (or $P(X|Y)$) appears multiple times with identical syntax, but implicitly indexes to distinct bodies of background information ($I_1, I_2$) at different steps of the derivation. The argument appears valid only because the shift from $P(X|I_1)$ to $P(X|I_2)$ is not marked in the notation, treating two distinct numerical quantities as one.

  **Why this name?**
  *   **Equivocation:** It fits the classical definition of using the same term in two different senses. Here, the "sense" is not the semantic meaning of "probability," but the pragmatic indexicality of the information state relative to which the probability is assessed.
  *   **Information-State:** This distinguishes it from equivocation on object-level terms (e.g., "bank") and from errors in the direction of conditioning (e.g., Prosecutor's Fallacy). The error is specifically about *what is known* at the time of assignment.

  ### Evaluation of Your Examples

  To sharpen the definition, some of your examples are core instances, while others are boundary cases that risk blurring the phenomenon.

  **1. Two-Envelope Paradox: KEEP.**
  This is the paradigmatic instance. The calculation treats $P(\text{other} = 2x | \text{mine} = x)$ as invariant.
  *   *State 1:* Before opening, the symmetry holds (under certain priors).
  *   *State 2:* After opening and seeing $x$, the probability depends on the prior distribution of values.
  *   *The Defect:* The derivation uses the symmetry valid in State 1 to justify an expectation calculation in State 2 without updating the conditioning information to include the specific value $x$ and the prior distribution required to evaluate it.

  **2. Forecast Evaluation: KEEP.**
  This is a clean, real-world instance.
  *   *State 1:* Predictions made at $t_1$ with information $I_1$.
  *   *State 2:* Predictions made at $t_2$ with information $I_2$ (where $I_2 \supset I_1$).
  *   *The Defect:* Aggregating these into a single calibration plot treats $P(Event | I_1)$ and $P(Event | I_2)$ as samples from the same generating function. They are not; they are conditional on different times.

  **3. Monty Hall: KEEP (with a caveat).**
  *   *State 1:* Before the host opens a door. $P(\text{Car behind Door 1}) = 1/3$.
  *   *State 2:* After the host opens Door 3. $P(\text{Car behind Door 1} | \text{Host opens 3}) = 1/3$.
  *   *The Defect:* The "50/50" error arises by asserting $P(\text{Car behind Door 1}) = 1/2$ in State 2, effectively pretending the information "Host opened Door 3" has not occurred, or assuming it provides no constraint.
  *   *Caveat:* This is sometimes framed as a failure to condition on the *host's strategy* rather than just information. However, since the strategy is part of the background information $I$, it fits.

  **4. Sleeping Beauty: REMOVE.**
  You flagged this as contested, and for the purpose of a sharp definition, it should be excluded.
  *   *Reason:* The core debate between "Halfers" and "Thirders" is precisely about whether waking up constitutes a *change* in information state. Halfers argue $I_{\text{wake}} = I_{\text{sleep}}$ regarding the coin; Thirders argue $I_{\text{wake}} \neq I_{\text{sleep}}$ due to self-locating evidence.
  *   *Why Remove:* Including this makes the definition dependent on resolving the philosophy of self-locating belief. To keep **Information-State Equivocation** recognizable "in the wild," it is better to restrict it to cases where the change in information is uncontroversial (e.g., opening an envelope, a door opening, time passing), but the *mathematical update* is neglected.

  ### Distinctions from Nearby Concepts

  You asked to separate this from specific neighbors. Here is how the carving holds:

  *   **Vs. Plain Equivocation:** Plain equivocation relies on semantic ambiguity (e.g., "light" as weight vs. photons). Information-State Equivocation relies on *indexical* ambiguity (e.g., "probability" as "probability given $I_1$" vs. "probability given $I_2$"). The words mean the same thing, but the invisible parameter attached to them has shifted.
  *   **Vs. Prosecutor's Fallacy:** The Prosecutor's Fallacy confuses $P(E|H)$ with $P(H|E)$. The direction of the arrow is wrong. In Information-State Equivocation, the direction is correct, but the *content* of the condition ($I$) has silently changed.
  *   **Vs. Bertrand's Chord:** Bertrand's problem arises from an underspecified *generation mechanism* (how the chord is chosen). Information-State Equivocation arises from an underspecified *knowledge state* (what the agent knows). One is ontological/randomization; the other is epistemic.
  *   **Vs. Reference Class Problem:** The Reference Class problem asks "Which group does this individual belong to?" Information-State Equivocation asks "What does this agent know at this moment?" While changing the information state often changes the effective reference class, the error here is not about selecting the group, but about failing to note that the agent has moved from one group (the uninformed) to another (the informed) mid-argument.

  ### What Would Change My Mind

  I hold this categorization tentatively. Here are the considerations that would persuade me that **Information-State Equivocation** is not a distinct phenomenon or that my carving is incorrect:

  1.  **Collapse into Standard Equivocation:** If it can be demonstrated that "probability relative to information $I$" is semantically distinct from "probability relative to information $J$" in the same way "bank of a river" is distinct from "bank for money," then this is just plain equivocation. If the notation $P(A|I)$ is considered part of the *meaning* of the term rather than a hidden parameter, my proposed name is redundant. I am currently persuaded otherwise because standard notation often suppresses $I$, making the error structural rather than semantic.
  2.  **Collapse into Reference Class:** If every shift in information state can be rigorously mapped to a shift in reference class without loss of fidelity, then this is merely the Reference Class problem in temporal clothing. If I were shown a formal proof that $P(A|I_1)$ vs $P(A|I_2)$ is always equivalent to choosing Class 1 vs Class 2, I would withdraw the distinction.
  3.  **The Sleeping Beauty Counter-Example:** If the Sleeping Beauty problem is ultimately resolved by consensus as a clear case of information update (or lack thereof), it might belong in the core set. If it remains permanently contested, its exclusion is necessary for the term to be usable. If it turns out that the "contested" nature is actually the defining feature of the phenomenon (i.e., the error is *always* about disputed information updates), then my definition is too narrow.

  ### Summary

  The phenomenon is real and structurally distinct from simple arithmetic errors or direction-of-conditioning fallacies. It is the silent sliding of the epistemic context. While no canonical name exists, **Information-State Equivocation** captures the mechanism: the syntax remains invariant while the implicit information index shifts. To use this term sharply, restrict it to cases where the information change is objective (time, observation, action) but the probabilistic accounting fails to reflect it.
