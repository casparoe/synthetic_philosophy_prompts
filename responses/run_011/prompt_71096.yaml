  Real tensions

  **(2) vs. (5): The Expected Value Conflict**
  Commitment (2) justifies existential-risk work via the sheer number of future people, typically relying on expected value calculations where uncertain probabilities multiply by astronomical stakes. Commitment (5) explicitly rejects this calculus ("one in a million shot at 10^30 lives"). This is a substantive conflict because (2) loses its primary motivational engine without the mathematical leverage (5) forbids. If you maintain (5), you must argue that x-risk mitigation probabilities are robustly high, not merely non-tiny, which contradicts the uncertainty inherent in standard risk assessment. The tension is severe because it undermines the rational basis for your longtermism. The cheapest revision is to qualify (5) to exclude non-fanatical probabilities (e.g., >1%), but this costs you the shield against speculative moral hazards elsewhere. On the reading where (2) relies on act-utilitarian expected value, the conflict is fatal; if (2) is rule-based, the tension weakens but remains.

  **(3) vs. (7): The Duration Inference Conflict**
  Commitment (3) asserts simulations are pruned "long before the heat-death-timescale," implying short durations. Commitment (7) argues that because "any long-running sim spends nearly all of its existence in the not-yet-terminated state," your current existence offers no evidence of imminent end. This is logically inconsistent: if (3) is true, sims are *not* long-running, so the statistical defense in (7) fails. On the reading where sims are short, a random observer moment is likely near the end, meaning your current early temporal location *should* update you toward termination soon. The conflict is severe because (7) neutralizes the empirical implication of (3). Revising (7) to acknowledge the Doomsday-style inference costs you the comfort of temporal ignorance but aligns your epistemology with your empirical claims. You cannot claim sims are short while simultaneously claiming duration is uninferable from current existence.

  **(3) vs. (6): The Causal Mechanism Conflict**
  Commitment (3) lists "safety" as a specific mechanism for simulation termination. Commitment (6) states you put "no weight on trying to be... well-behaved enough" to prevent this. This generates tension on the reading where "safety" is endogenous to your behavior. If simulators prune unsafe civilizations, then behavioral changes could alter termination probability. By denying causal leverage (6) while affirming the mechanism (3), you create a gap between cause and effect. The conflict is moderate but exposes an empirical blind spot. The cheapest revision is to amend (6) to acknowledge theoretical leverage while maintaining practical skepticism, costing you the absolute certainty of causal inertness. If "safety" in (3) refers to exogenous factors (e.g., simulator budget), the tension dissolves, but "safety" usually implies risk management regarding the simulated entity.

  False alarms

  **(1)+(4) vs. (3): Moral Status vs. Duration**
  (1) and (4) combined with (3) might seem to imply a moral contradiction: if simulated people are real (4), shouldn't their extinction matter more? However, (3) is a claim about *duration*, not *value density*. You can consistently hold that simulated lives are morally real (4) while acknowledging their temporal scope is limited (3). The "cooling down" of longtermism in (3) refers to the total aggregate value available, not the moral status of existing individuals. There is no conflict here; you are simply calculating a smaller total sum due to fewer future terms, not devaluing the terms themselves.

  **(1) vs. (6): Existence vs. Agency**
  (1) and (6) might appear inconsistent: if simulators exist (1), surely we can influence them (6)? This dissolves on the reading that existence does not imply accessibility. You can consistently believe entities exist outside your causal horizon. (6) is a claim about causal reach, not ontology. As long as you view the simulators as operationally disconnected from your universe's physics, believing they exist (1) while denying leverage (6) is coherent. This preserves your agency within the simulation without requiring futile external communication.

  The one change that buys the most

  Modify (7). This buys the most coherence because it resolves the logical contradiction with (3) without forcing a major ethical overhaul. By admitting that short simulation durations imply a higher probability of early termination given your current temporal location, you align your epistemic updates with your empirical beliefs. This removes the "false comfort" of (7) and forces you to confront the implication of (3): that if we are in a sim, the future is likely near. This change leaves (2) and (5) intact, preserving your ethical stance, while cleaning up the empirical model. You give up the claim that survivorship bias is irrelevant, accepting instead that your current existence is evidence subject to selection effects. This prevents seminar attendees from dismantling your empirical model before addressing your ethics.

  Where you had to assume things

  I assumed "tiny probabilities" in (5) covers the ranges typically used in existential risk calculations (e.g., <1%). If you define "tiny" as strictly Pascal's Mugging levels (10^-9), the tension with (2) vanishes. I also assumed "safety" in (3) implies behavioral variables; if safety is purely exogenous (e.g., simulator boredom), (3) and (6) are compatible. Finally, I assumed (2) requires expected value maximization; if your longtermism is rule-based rather than act-based, the conflict with (5) weakens. These definitions determine whether the tensions are fatal or manageable.
