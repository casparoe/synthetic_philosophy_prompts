answer: |-
  **Bottom line**

  Cut step (5). It embodies an equivocation between epistemic indistinguishability and ontological identity. On the reading supported by premise (4), (5) claims only that the subject cannot *know* whether experience or memory drifted; this is plausible. But to drive the elimination in (6), (5) must claim that there *is no fact of the matter* regarding the drift; this is unsupported verificationism. Consequently, the argument fails to eliminate qualia, though it successfully highlights limits on first-person authority. Step (7) is also false, as your student noted, because belief ascription relies on third-person behavioral evidence, not just avowal. This neutralizes the performative contradiction in (10)–(11), rendering it a rhetorical trick rather than a logical bind. Finally, conclusion (12) is illicit: the failure of an elimination argument does not positively establish that phenomenal character is intrinsic or re-identifiable. What remains standing is the epistemic problem of the coffee case, not the ontological conclusion.

  **Where it breaks**

  The load-bearing step is (5). This premise functions as the engine of elimination, converting an epistemic limitation into an ontological conclusion. To see the break, we must distinguish two readings of the claim: "Where no available evidence distinguishes two descriptions... the two descriptions do not describe distinct states of affairs."

  On the first reading (Epistemic), the premise asserts that if evidence cannot distinguish two hypotheses, the subject is not justified in believing one over the other. This reading is true and follows from (4). Given memory drift, the subject lacks the evidence to decide between "experience changed" and "memory changed." However, this reading supports only skepticism about the subject's knowledge, not the non-existence of the properties in question. It leaves open the possibility that one description is true and the other false, even if the subject cannot tell which.

  On the second reading (Ontological), the premise asserts that if evidence cannot distinguish two hypotheses, there is no objective difference between the states of affairs they describe. This reading is required to derive (6), which eliminates phenomenal character in favor of avowal dispositions. Without this strong verificationist principle, the indistinguishability of the drift cases implies only ignorance, not identity. The argument needs the Ontological reading to quine qualia, but only the Epistemic reading is licensed by the preceding steps.

  This equivocation is the primary fracture. A secondary break occurs at (7), as your student identified. The argument needs (7) to be true to generate the self-undermining contradiction in (11). If (7) holds, eliminating qualia eliminates beliefs, silencing the argument. But (7) is false: belief ascription is fixed by behavioral coherence and third-person evidence, not solely by avowal. Thus, a theorist can consistently eliminate qualia while retaining beliefs. This prevents the *reductio* from biting the theorist, though it does not save qualia from elimination via (5). The fundamental error remains the verificationist slide in (5), which illegitimately infers non-existence from indiscernibility.

  **Why that step looked unobjectionable**

  Step (5) appeals to a deep methodological intuition common in naturalistic philosophy of mind: if a distinction makes no difference to observable evidence or functional role, it is metaphysically idle. This is a form of operationalism or verificationism that feels like parsimony. In the context of the coffee case, the intuition is particularly seductive because the "evidence of the relevant kind" is explicitly restricted to first-person avowals. Since the case is constructed to show that avowals underdetermine the underlying state, it tempts one to conclude there is no underlying state to determine.

  Furthermore, the phrasing "evidence of the relevant kind" masks the shift. It suggests that we are merely defining the property by its epistemic access conditions. For phenomenal properties, which are traditionally defined by "what it is like" from the inside, it seems plausible to tie their identity conditions to what can be discerned from the inside. If the inside view cannot tell the difference, why posit a difference? This aligns with Dennett's strategy of treating introspection as a theoretical construct rather than a window onto intrinsic properties.

  In good faith, one might read (5) as a harmless clarification of concepts rather than a heavy metaphysical claim. It looks like a rule for individuating properties: properties are individuated by their evidence. Since this seems reasonable for subjective domains, the premise slides past scrutiny. It appears to be a modest claim about individuation criteria, not a radical elimination of reality. The cost of this appeal is that it smuggles in a verificationist ontology under the guise of methodological caution, allowing the argument to move from "we can't tell" to "there is nothing to tell" without explicit justification.

  **Repairs and their prices**

  Consider three repairs to salvage the argument or clarify its residue.

  First, restrict (2) so that avowal-fixes-content applies only to phenomenal terms, not belief terms. This accepts your student's objection: beliefs are tracked behaviorally, qualia avowally.
  *Price:* This saves the argument from self-refutation (the theorist can speak consistently), but it leaves step (5) intact. Qualia are still eliminated via the verificationist slide. The coffee case retains its force against the *existence* of qualia, but the *reductio* structure collapses. You lose the performative trap but keep the elimination.

  Second, restrict (6) so that elimination reaches only the drift cases, not all phenomenal character. This admits that qualia exist generally but are indeterminate when memory drifts.
  *Price:* This saves qualia from total elimination but concedes that they are not re-identifiable across time in drift scenarios. The coffee case retains force against the *stability* of qualia, but not their existence. However, this undermines (12)'s claim that phenomenal character is intrinsic and re-identifiable. It leaves you with a fragmented ontology where qualia exist only when discernible.

  Third, deny (5) outright. Assert that epistemic limits do not entail ontological identity.
  *Price:* This kills the elimination argument entirely. The coffee case becomes a problem about first-person authority and memory reliability, not about the existence of qualia. It leaves qualia intact as intrinsic properties that may be unknowable to the subject. This is the most honest repair but costs the most dialectically: it concedes that Dennett's coffee case does not quine qualia, only quines first-person infallibility. It blocks the runaway generalization but leaves the positive claim of (12) unsupported by the argument. You must argue for intrinsic qualia on other grounds.

  **Performative contradiction or cheap trick?**

  Your student is correct: the performative contradiction is a cheap trick if (7) is false. Steps (10)–(11) attempt to force the theorist into a pragmatic bind where asserting the argument contradicts its content. This works only if the terms used to assert the argument (belief, intention) are subject to the same elimination as qualia. Since belief ascription depends on third-person evidence (behavioral patterns, coherence) rather than solely on avowal, the elimination in (9) does not apply to the arguer's own states. The theorist can consistently hold that qualia are avowal-dispositions while beliefs are functional states.

  Therefore, (10)–(11) do no diagnostic work beyond rhetorical pressure. They rely on a forced generalization that the theorist is not compelled to accept. The contradiction is avoidable, making the *reductio* invalid. This does not mean the argument is sound, but it means the self-undermining charge is false. The trick distracts from the real vulnerability, which is the verificationist premise (5). By focusing on the performative aspect, the handout invites students to attack the consistency of the arguer rather than the substance of the elimination. You should acknowledge that the performative layer is decorative; the core philosophical work is done by (5), and that is where the argument stands or falls. The student's objection exposes the decoration, not the engine, but without the engine, the decoration is useless.

  **What I should tell the seminar**

  Revise the handout to remove the performative contradiction (steps 7–11) and the positive ontological conclusion (12). Acknowledge that the argument successfully demonstrates an epistemic limit: subjects cannot distinguish experience change from memory change via introspection alone. However, admit that this does not prove qualia are non-existent or reducible to avowals. The coffee case challenges first-person authority, not phenomenal realism. Tell the students that the verificationist leap in (5) is the controversial core, not a neutral methodological rule. Use the case to discuss the gap between epistemic access and ontological status. The honest residue is that introspection is fallible and memory is constructive, which complicates the traditional conception of qualia without eliminating it. This preserves the pedagogical value of the coffee case without trapping them in a flawed *reductio*.
