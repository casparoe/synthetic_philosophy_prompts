prompt: |-
  I run the editorial office of a mid-tier political theory / applied ethics journal — roughly 850 submissions a year, and I desk-reject something like half of them. The decisions actually get made by five associate editors, all grad students, who rotate out every two years, so each cohort starts from scratch and I end up re-explaining the same thing every fall. What I need help with isn't the quality judgements. It's that the reasons people give for a desk decision are a mess and I have no way to sort them. A board member tells an AE we should send a paper out because the author is eminent and will make trouble if we don't. A special-issue guest editor wants a friend's piece included. One AE argues we should reject a perfectly decent manuscript because we've already taken four on that topic this year and the reviewers are sick of it. Another wants to accept a weak submission because rejecting it would cost the author their funding. My rough habit has been to call the first batch "pressure reasons" and the second batch "paper reasons," but that clearly doesn't work — some of the pressure reasons feel legitimate (the funding one!) and some paper reasons are really about us rather than about the manuscript. At a conference bar last spring our outgoing editor told me a reason is a reason if it moves you, which was funny at the time and useless at 9am on a Tuesday.

  I've read enough around the edges to know there's a whole literature on the wrong kind of reasons problem — the state-given versus object-given way of carving it up, fittingness, those thought experiments where a demon or an eccentric billionaire will do something awful or pay you a fortune unless you admire them. What I want is that turned into something my AEs can actually run: a procedure, in order, that takes about ten minutes per manuscript before they write the desk memo. For each step I want the question to ask, what counts as a sufficient answer, what that answer licenses (reject / send out for review / escalate to me), and where the step is really a call about values that I should be making rather than a factual judgement. It has to work for people who've never read any of the philosophy, so no jargon unless you define it in a sentence. And it has to confront the thing I suspect breaks the naive version: a desk decision is an action, not an attitude, so I'm genuinely unsure whether a right-kind/wrong-kind filter is even the correct tool here or whether using it that way is a category mistake I should drop. Tell me which, and build the procedure accordingly. I also have two home-made tests I want you to keep, repair, or kill: the anonymity test (would this reason still count if the manuscript were fully anonymized and the author's identity erased?), and the flip test (would this same consideration count against a paper I already liked?).

  Then run the procedure on three cases. One: a technically sound paper by a very senior author who has spent two years publicly trashing our journal in print and will certainly do it again if we desk-reject him. Two: a paper that's weak but not hopeless, by a grad student whose program requires a publication to keep her funding, and whose advisor sits on our board. Three: a genuinely strong paper on a topic we've already published three times this year, where a rival journal is about to launch a competing special issue, so there's a real strategic case for taking it anyway. I want at least one of these to come out the way I won't like — if the procedure only ever delivers comfortable verdicts I won't trust it. Be honest too about what it can't do: where an AE can game the steps to reach the verdict they already wanted, where two careful AEs will get different results from the same manuscript, and where the ten-minute budget just can't support the step you're asking for. Last thing, and it matters because this goes into a training packet: please seperate out for me which parts of the underlying theory are settled and which are live disputes among people who actually work on it, and don't hand me a contested account of reasons dressed up as the consensus view. If one of your steps only goes through on a contested reading, flag it right there.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Editor of a mid-tier political theory/applied ethics journal.
      *   **Context:** 850 submissions/year, 50% desk reject rate. 5 Associate Editors (AEs), all grad students, rotating every 2 years. High turnover means constant retraining.
      *   **Problem:** Reasons for desk decisions are messy/inconsistent. Mixing legitimate editorial concerns with illegitimate pressures (status, favoritism, pity, strategic gaming). Current taxonomy ("pressure" vs. "paper") fails.
      *   **Goal:** A practical, 10-minute pre-memo procedure for AEs to categorize and validate reasons for desk decisions.
      *   **Constraints:**
          *   Must be usable by grad students (no heavy jargon without definition).
          *   Must address the "Right Kind of Reasons" (RKR) vs. "Wrong Kind of Reasons" (WKR) philosophical literature but translate it into practice.
          *   Must address the user's specific worry: Desk decisions are *actions*, not *attitudes* (is RKR/WKR a category mistake here?).
          *   Must incorporate/repair/kill two existing tests: Anonymity Test and Flip Test.
          *   Must run the procedure on three specific, difficult cases (Senior Troll, Funding/Board Member, Strategic Topic).
          *   Must include at least one uncomfortable verdict.
          *   Must admit limitations (gaming, inter-rater reliability, time budget).
          *   Must distinguish settled theory from live disputes in the philosophy of reasons.
      *   **Tone:** Professional, direct, pragmatic, philosophically informed but not pedantic.

  2.  **Deconstruct the Philosophical Problem (RKR vs. WKR in an Editorial Context):**
      *   *The Theory:* The "Wrong Kind of Reasons" problem usually arises in the context of *attitudes* (e.g., admiring a demon). A reason to *have* an attitude (money/threat) is different from a reason *for* the attitude (admirable qualities).
      *   *The User's Worry:* Publishing is an *action* (accepting/rejecting), not just an attitude (believing a paper is good). Does RKR/WKR apply?
      *   *Resolution:* Yes, but with a shift. In institutional contexts, "Right Kind" reasons are those aligned with the *constitutive aim* of the institution. For a journal, the aim is publishing high-quality, relevant scholarship. "Wrong Kind" reasons are those that bypass the quality/relevance aim for external goods (money, status, avoiding conflict). However, some "external" factors (diversity, topic balance) *can* be constitutive if defined in the journal's mission.
      *   *Translation:* We need to distinguish between *Constitutive Reasons* (about the paper's fit with the journal's mission/standards) and *Extrinsic Reasons* (about consequences unrelated to the paper's merit/fit).
      *   *The "Action" Objection:* Even if it's an action, the *criteria* for the action should be based on the paper's properties relative to the journal's goals, not the editor's personal welfare or the author's status. So the filter still works, provided we define the "journal's goals" clearly.

  3.  **Develop the Procedure (The "10-Minute Filter"):**
      *   Need a step-by-step flow.
      *   *Step 1: The Merit Floor.* Is the paper technically competent? (Filters out obvious trash).
      *   *Step 2: The Constitutive Check.* Is the reason about the paper's relation to the journal's mission? (This is the RKR/WKR translation).
      *   *Step 3: The Tests.* Apply Anonymity and Flip tests.
      *   *Step 4: The Escalation.* If a reason fails the tests but feels compelling, escalate to the Editor-in-Chief (EiC).
      *   *Refining the Tests:*
          *   *Anonymity Test:* Good for spotting status bias. Keep it.
          *   *Flip Test:* Good for spotting consistency bias. Keep it, but refine the wording.
      *   *Addressing the "Action" Worry:* Explicitly state that while publishing is an action, the *justification* for that action must rest on the journal's constitutive aims.

  4.  **Drafting the Steps (Iterative refinement):**
      *   *Step 1 (Quality):* "Is this scholarship?" If no -> Reject.
      *   *Step 2 (Fit/Mission):* "Does this reason relate to the text or the journal's scope?" If no -> Flag as Extrinsic.
      *   *Step 3 (The Tests):* Apply Anonymity and Flip.
      *   *Step 4 (Decision):* If Extrinsic + Fails Tests -> Reject/Escalate. If Extrinsic + Passes Tests (e.g., strategic topic balance) -> Escalate (because this is a policy decision, not an AE decision).

  5.  **Running the Cases:**
      *   *Case 1 (Senior Troll):* Reason = Avoid conflict. Extrinsic. Fails Anonymity (if anonymized, threat disappears). Fails Flip (would we accept a bad paper from a friend to avoid conflict?). *Verdict: Reject/Escalate.* (Uncomfortable: Risking public trashing).
      *   *Case 2 (Funding/Board):* Reason = Pity/Conflict of Interest. Extrinsic. Fails Anonymity (funding status hidden). Fails Flip (would we reject a good paper because they have funding?). *Verdict: Reject (on merit) / Recuse Board Member.* (Uncomfortable: Hurting the student).
      *   *Case 3 (Strategic Topic):* Reason = Competition/Mission. Extrinsic/Constitutive mix. Passes Anonymity (topic is visible). Passes Flip (we'd do this for any journal). *Verdict: Escalate to EiC.* (This is a policy call, not an AE call).

  6.  **Addressing Limitations & Theory:**
      *   *Gaming:* AEs can phrase extrinsic reasons as intrinsic (e.g., "topic saturation" vs. "reviewer boredom").
      *   *Disagreement:* "Quality" is subjective.
      *   *Time:* 10 minutes is tight for deep reading, but enough for the *reason check*.
      *   *Theory:* Distinguish between "Buck-Passing" accounts (settled enough for this) vs. "Fittingness" debates (live dispute). Acknowledge the Action vs. Attitude debate.

  7.  **Refining the Output Structure:**
      *   **Part 1: The Philosophical Grounding (Brief & Honest).** Address the Action/Attitude worry. Define RKR/WKR in plain English. Distinguish settled vs. contested.
      *   **Part 2: The Procedure (The "Reasons Filter").** Step-by-step, time-boxed.
      *   **Part 3: The Tests.** Repair/Keep instructions.
      *   **Part 4: Case Studies.** Apply the filter.
      *   **Part 5: Limitations & Vulnerabilities.** Where it breaks.
      *   **Part 6: Theory Appendix.** For the EiC's understanding.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is "Constitutive" too jargon-y?
      *   *Fix:* Use "Journal-Internal" vs. "Journal-External."
      *   *Critique:* The user wants at least one verdict they won't like.
      *   *Fix:* Case 1 (The Troll) should probably result in a Desk Reject recommendation, which risks the public fallout. Or Case 2 (The Student) must be rejected on merit despite the funding issue. Let's make Case 2 the hard one: The procedure demands rejecting the paper if it's weak, regardless of funding.
      *   *Critique:* The "Action vs. Attitude" point is crucial.
      *   *Fix:* I need to explicitly validate the user's intuition. The RKR/WKR distinction *does* apply to actions when those actions are governed by norms (like a game or an institution). Publishing is a norm-governed practice. So the filter holds, but the "Right Kind" is defined by the *Journal's Mission*, not abstract truth.
      *   *Critique:* The "Strategic Topic" case. Is that a Right Kind reason?
      *   *Fix:* It depends on the mission. If the mission includes "shaping discourse," it's Internal. If it's just "beating rivals," it's External. I should classify this as an *Escalation* because it's a policy choice, not an AE judgment call.

  9.  **Final Polish:** Check tone. Ensure it sounds like a manual for grad students but respects the EiC's philosophical literacy. Ensure the "Settled vs. Contested" section is accurate (e.g., the existence of WKR is settled; the *analysis* of why they are wrong is contested).

  *(Self-Correction on the "Action" point)*: The user is right to be suspicious. RKR is traditionally about *attitudes* (admiration, belief). Applying it to *actions* (publishing) requires a bridge. The bridge is "Normative Roles." An editor acts *as an editor*. Therefore, reasons must be relevant to the role. I will make this explicit.

  *(Self-Correction on Case 2)*: The advisor sits on the board. This is a COI. The procedure must flag this immediately. The funding issue is secondary. The primary issue is the Board Member's influence. I need to make sure the procedure catches the COI.

  *(Self-Correction on Case 3)*: Strategic acceptance. This is often considered "Wrong Kind" in pure ethics, but "Right Kind" in publishing strategy. I need to distinguish between *Editorial Policy* (EiC's job) and *Editorial Judgment* (AE's job). AEs shouldn't make strategic portfolio decisions; that's the EiC's job. So this should escalate.

  Let's assemble the document.cw
answer: |-
  Here is a procedural manual designed for your Associate Editors (AEs), followed by the philosophical grounding and limitations analysis you requested.

  ***

  # PART 1: THE PROCEDURE (The "Reasons Filter")

  **Target Audience:** Graduate Student Associate Editors
  **Time Budget:** 10 Minutes per manuscript (post-reading)
  **Goal:** Distinguish between reasons that justify an editorial decision and reasons that justify *something else* (politics, pity, strategy).

  ### Step 1: The Competence Floor (2 Minutes)
  **Question:** "Ignoring who wrote this, does the manuscript meet the minimum threshold of technical competence and argumentative clarity for our journal?"
  *   **Sufficient Answer:** "Yes, it is coherent and scholarly" OR "No, it is unintelligible or fundamentally flawed."
  *   **Licenses:**
      *   If **No**: Desk Reject. (Stop here).
      *   If **Yes**: Proceed to Step 2.
  *   **Value Call:** This is a **factual judgment** about the text. However, the *threshold* is set by the Editor-in-Chief (EiC). If you are unsure where the floor is, ask the EiC once at the start of the term.

  ### Step 2: The Source Check (3 Minutes)
  **Question:** "Is the primary reason for my proposed decision (Accept/Reject/Review) derived from the **text itself** or from the **context surrounding the text**?"
  *   **Definitions:**
      *   *Text Reasons:* Argument quality, novelty, fit with journal scope, clarity.
      *   *Context Reasons:* Author's status, author's need for funding, journal's rivalry with other journals, reviewer fatigue, personal relationships.
  *   **Sufficient Answer:** "My reason is primarily about the text" OR "My reason is primarily about the context."
  *   **Licenses:**
      *   If **Text**: Proceed to Step 4.
      *   If **Context**: Proceed to Step 3 (The Filter).
  *   **Value Call:** This is the **Constitutive Aim** check. Our journal exists to publish good papers, not to solve authors' funding crises or win status games. This step enforces that aim.

  ### Step 3: The Context Filter (3 Minutes)
  *Apply this only if Step 2 yielded a "Context Reason."*
  **Instruction:** Take your Context Reason and run it through the two tests below.

  *   **Test A: The Anonymity Test (Repaired)**
      *   *Question:* "If the manuscript were fully anonymized and I knew nothing about the author's situation (funding, status, relationships), would this reason still exist?"
      *   *Pass:* Yes. (e.g., "The topic is saturated" is visible in the text/bibliography).
      *   *Fail:* No. (e.g., "The author needs this for tenure" vanishes if anonymized).
  *   **Test B: The Flip Test (Repaired)**
      *   *Question:* "If I were inclined to *accept* a paper I loved, would this same consideration count *against* it?"
      *   *Pass:* Yes. (e.g., "We have published too much on this topic" counts against a good paper just as it counts against a mediocre one).
      *   *Fail:* No. (e.g., "The author is eminent" counts for acceptance, but we wouldn't reject a loved paper because the author is *unknown*).

  *   **Licenses:**
      *   If **Both Tests Pass**: The reason is **Policy-Valid**. It is a legitimate editorial concern (e.g., topic balance). **Escalate to EiC.** (AEs do not set portfolio strategy).
      *   If **Either Test Fails**: The reason is **Illegitimate**. **Discard the reason.** Re-evaluate the paper based *only* on Step 1 (Competence). If the paper is decent, send for review. If weak, reject.

  ### Step 4: The Decision Memo (2 Minutes)
  **Instruction:** Write the memo.
  *   **Constraint:** You may not cite any reason that failed Step 3.
  *   **Escalation:** If you discarded your primary reason in Step 3 and are now unsure what to do, flag the manuscript for the EiC with the note: "Primary reason filtered out. Requesting guidance."

  ***

  # PART 2: CASE STUDY RUN-THROUGH

  Here is how the procedure handles your three specific cases.

  ### Case 1: The Senior Troll
  *   **Scenario:** Technically sound paper. Senior author. Publicly trashes the journal. Will trash again if rejected.
  *   **Step 1 (Competence):** Pass. It is technically sound.
  *   **Step 2 (Source):** **Context.** The reason to accept is avoiding public conflict, not the paper's superiority.
  *   **Step 3 (Filter):**
      *   *Anonymity Test:* **FAIL.** If anonymized, the threat of trashing disappears.
      *   *Flip Test:* **FAIL.** We would not reject a great paper because the author is *nice*.
  *   **Verdict:** **Discard Reason.** The AE must decide based on merit. If the paper is merely "sound" but not exceptional, the recommendation should be **Reject**.
  *   **Escalation:** Because the *consequence* of rejection is high-risk (public relations damage), the AE must **Escalate to EiC** with the note: "Paper merits rejection on standard criteria, but author poses reputational risk."
  *   **Why you won't like it:** The procedure forces you to admit the paper should be rejected on merit, placing the burden of the "corrupt" decision (accepting to save face) squarely on you, the EiC. It prevents the AE from laundering a cowardly decision as an editorial one.

  ### Case 2: The Funding/Board Student
  *   **Scenario:** Weak but not hopeless paper. Grad student needs pub for funding. Advisor is on your Board.
  *   **Step 1 (Competence):** **Borderline/Fail.** You describe it as "weak." If it fails the Competence Floor, it is a Reject. Let's assume it passes the floor (is publishable, just not great).
  *   **Step 2 (Source):** **Context.** The reason to accept is pity/funding and potential Board pressure.
  *   **Step 3 (Filter):**
      *   *Anonymity Test:* **FAIL.** Funding status and Board connections are not visible in an anonymized text.
      *   *Flip Test:* **FAIL.** We would not reject a strong paper because the author *already has funding*.
  *   **Verdict:** **Discard Reason.** The AE must recommend **Reject** (if weak) or **Review** (if competent). The funding issue is irrelevant to the journal's mission.
  *   **Conflict of Interest:** The Board Member advisor is a separate issue. The AE must **Recuse** that Board Member from any discussion of this paper.
  *   **Why you won't like it:** This is the hard ethical cost. The procedure dictates that the journal cannot function as a welfare agency. Saving the student's funding is a "Wrong Kind of Reason" for *publication*, even if it is a right kind of reason for *charity*. The AE must be insulated from this pressure.

  ### Case 3: The Strategic Topic
  *   **Scenario:** Strong paper. Topic saturated in your journal. Rival journal launching special issue on same topic. Strategic case to take it to compete.
  *   **Step 1 (Competence):** Pass. Genuinely strong.
  *   **Step 2 (Source):** **Context.** The reason is strategic competition and portfolio management, not just the paper's intrinsic quality.
  *   **Step 3 (Filter):**
      *   *Anonymity Test:* **PASS.** Topic saturation is visible in the bibliography/subject matter regardless of author identity.
      *   *Flip Test:* **PASS.** "We have published too much on X" would count against a paper you loved, too. It is a consistent policy constraint.
  *   **Verdict:** **Policy-Valid.** However, this is **Escalate to EiC.**
  *   **Why:** AEs rotate every two years. They do not own the journal's long-term strategic positioning. Deciding to break a "topic saturation" norm to fight a rival is a policy decision, not an editorial judgment.
  *   **Outcome:** The AE recommends "Accept," but flags it for you. You make the call on whether to prioritize strategy over balance.

  ***

  # PART 3: LIMITATIONS & VULNERABILITIES

  You asked for honesty about where this breaks.

  **1. The "Gaming" Vulnerability**
  A clever AE can rephrase a Context Reason as a Text Reason.
  *   *Example:* Instead of "The author is eminent" (Context), they write "The paper offers a definitive statement on the literature" (Text).
  *   *Mitigation:* This procedure cannot stop lying. It stops *unconscious* bias and provides a vocabulary for you to challenge them. If you see a pattern of "definitive statements" from famous authors, you catch the gaming in aggregate, not per case.

  **2. The "Competence" Subjectivity**
  Step 1 assumes "technical competence" is objective. It isn't.
  *   *Risk:* Two AEs will disagree on the "Floor." One AE's "weak" is another's "innovative."
  *   *Mitigation:* This is why Step 3 is vital. Even if they disagree on quality, they should agree that "Author's Funding" is not a quality metric. This procedure standardizes the *reasons*, not the *taste*.

  **3. The Time Budget**
  10 minutes is tight for Step 3 if the AE is conflicted.
  *   *Risk:* AEs will rush the Tests to get to the decision they want.
  *   *Mitigation:* Make the Tests a checkbox in your submission system. They cannot submit the memo without checking "Anonymity Test: Pass/Fail." Friction slows down rationalization.

  **4. The "Action" Category Mistake**
  You worried that RKR/WKR is for attitudes, not actions.
  *   *Reality:* The procedure works because we treat the *Journal* as an agent with a specific aim. If the journal's aim were "maximize profit," then "Author is eminent" (citations) would be a Right Kind reason. Because the aim is "publish good scholarship," it is Wrong.
  *   *Limit:* If you (EiC) decide the aim *should* be "survive the budget crisis," then the procedure must change. This tool enforces *your* stated mission, not objective moral truth.

  ***

  # PART 4: THEORETICAL APPENDIX (For the EiC)

  You asked to separate settled theory from live disputes. This section is for your understanding, not for the AE packet.

  ### 1. The Action vs. Attitude Objection
  *   **Your Worry:** RKR/WKR literature (Parfit, Scanlon, Hieronymi) focuses on attitudes (belief, admiration). Publishing is an action. Is applying this filter a category mistake?
  *   **Consensus View:** It is **not** a category mistake, provided we use an **Institutional Norms** framework.
  *   **Explanation:** Actions performed in a professional capacity are governed by the *constitutive norms* of that role. A judge sentencing a criminal cannot accept a bribe, even if the bribe is a "reason" to act. Similarly, an editor cannot accept based on pity, even if pity is a valid human reason.
  *   **Settled:** It is settled that professional roles filter reasons. (See: *Role Obligations* literature).
  *   **Live Dispute:** *Which* reasons are constitutive. Some argue "impact" and "citations" are constitutive of modern journals; others argue only "truth/quality" is. You must define this in your mission statement. This procedure assumes "Quality/Fit" is the constitutive aim.

  ### 2. The Analysis of "Wrong Kind" Reasons
  *   **Settled:** There is a distinction between reasons that make an object worthy of an attitude/action (Object-Given) and reasons that make having the attitude/action beneficial (State-Given).
      *   *Object-Given:* The paper is rigorous. (Fits the aim of publishing).
      *   *State-Given:* Publishing this gets me money/saves the author's funding. (Fits the aim of welfare).
  *   **Live Dispute:** *Why* are WKRs excluded?
      *   *View A (Fittingness):* It is unfitting to admire a demon who threatens you. (Metaphysical claim).
      *   *View B (Buck-Passing):* To say something is "good" is just to say there are reasons to pursue it. WKR confusion arises from linguistic ambiguity. (Meta-ethical claim).
      *   *View C (Normative Roles):* WKR are excluded because they violate the norms of the specific practice (e.g., editing, believing).
  *   **Recommendation:** Adopt **View C** for your AEs. It is the most pragmatic. It doesn't require them to believe in "fittingness," only to respect the "rules of the job."

  ### 3. The Anonymity Test Status
  *   **Status:** **Heuristic, not Theoretical.**
  *   **Explanation:** Philosophically, a reason can be valid even if it relies on non-anonymizable facts (e.g., "This paper is by a local scholar" might be valid for a *local* journal).
  *   **Repair:** I modified the test in the procedure to ask: "Does this reason rely on facts *irrelevant to the journal's mission*?" Anonymity is just a proxy for mission-relevance. If the fact disappears in blind review, it is usually mission-irrelevant for a standard peer-review journal.

  ### 4. Strategic Reasons (Case 3)
  *   **Status:** **Contested.**
  *   **Explanation:** Is "beating a rival journal" a Right Kind reason for acceptance?
  *   **Purist View:** No. Only quality matters.
  *   **Realist View:** Yes. Journals are competitors in a marketplace of ideas.
  *   **Procedure Stance:** I classified this as **Escalate**. This acknowledges the dispute. It is not for a rotating grad student to decide the journal's philosophical stance on competition. It is a policy choice for you.

  ### Summary for the Training Packet
  *   **Settled:** Professional roles exclude external reasons (bribes, threats, pity).
  *   **Contested:** Whether strategic market considerations (citations, rankings, rivalry) are "internal" or "external" to the role of an editor.
  *   **Procedure Stance:** We treat Quality and Fit as Internal. We treat Status, Pity, and Strategy as External (requiring EiC approval).

  ***

  # FINAL NOTE ON IMPLEMENTATION

  This procedure will not stop a determined AE from gaming the system, nor will it solve the moral distress of rejecting the funding-dependent student. Its purpose is **bureaucratic insulation**.

  When the Board Member asks why their advisee was rejected, you do not say "The AE thought it was weak." You say: "The AE applied the Reasons Filter. The funding consideration failed the Anonymity Test. Our protocol prohibits using external welfare reasons for acceptance."

  It turns a personal slight into a procedural compliance issue. That is the only way to survive 850 submissions a year with rotating staff.
