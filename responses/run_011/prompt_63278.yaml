prompt: |-
  I'm a fourth-year political philosophy PhD student and I've somehow ended up as the "theory person" for a worker-ownership conversion fund run by a mid-sized Rust Belt city I grew up near — the program director read a paper I gave at a grad conference and decided that qualified me. The fund lends/grants money (average ask around $180k, roughly 35–40 applications a year, three-person committee that meets monthly) to buy out retiring or exiting owners of small firms and hand the business to the workers. The enabling ordinance has criteria that say the conversion has to "materially reduce exploitation in the workplace" and "increase worker control over the productive process," and in the four years the program has existed nobody has ever said what either phrase means. In practice the case officers — all ex-small-business lenders, none of them have read any philosophy and they aren't going to start — score applications on whether payroll went up and whether there's a board seat for workers, and the committee basically approves anything that looks solvent. My deliverable, due before the October cycle, is a procedure they can actually run.

  So: write me that procedure. It has to be usable by a case officer with no theory background in about ninety minutes from an application packet plus a forty-five minute site visit, and it has to output one of four things — not fundable, fund, fund-with-conditions (with the conditions stated concretely enough to go into a term sheet), or escalate to the committee because the question in front of you is about values rather than facts. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, which answers terminate the run, and which ones you can only get by asking a worker something rather than reading the pro forma. For the grounding: I want it built on what Marx's own account of exploitation is actually claiming — the appropriation of surplus labour, the worker's separation from the means of production, labour power bought and sold as a commodity — not on the watered-down version where "exploitation" just means "the workers get a smaller share than they deserve," because if the procedure quietly does that substitution it becomes a fairness-of-the-split calculator and the ordinance language is doing no work at all. I also want you to bring in the analytic-Marxist reformulation, specifically the withdrawal-style test where a group is exploited if it would be better off leaving with its per capita share of the productive assets (and the others worse off), since that seems to me like the only piece of this literature that a case officer could genuinely evaluate from numbers in a packet — but be honest about what gets lost in that translation, because the withdrawal test measures property distribution and not the labour process. On alienation I don't want the four headings listed at me like a syllabus; I want you to tell me which of those distinctions survive being turned into a form a lender can fill out and which ones I should drop as unmeasurable, and I want the procedure to handle the fact that exploitation and alienation come apart in both directions — you can have a fully worker-owned firm whose members are more alienated than they were under a boss, and you can have real gains in control that change nothing about who appropriates the surplus. No reading list, no citations, nothing the officers would have to look up; explain the concepts inside the procedure itself in plain English.

  Then run it on three real-ish applications from last cycle. (1) A 38-person precision machining shop, retiring owner selling to a 100% worker trust, one-member-one-vote, board elected from the floor, wages up 7% with profit share by seniority — but the business plan depends on five to eight agency temps every peak season, and the applicants told us straight that if the aerospace contract lands they'd keep non-member contract machinists on permanently, since members' shares would get too thin otherwise. This one is the director's poster child and it's already in the annual report, so I'm braced for the procedure to give me an answer the office will hate. (2) A home-care agency, about 60 workers, nearly all part-time and nearly all women, converting to a co-op; the county sets the reimbursement rate and the scheduling software breaks the day into fifteen-minute visits, so the members will own the agency and elect the board but will have no say over prices, caseloads, or the increments their work is chopped into. Everyone in the office thinks this one is unfundable because the wage gain is small and the "control" is nominal — I suspect the procedure should split it, and if it splits it I need the procedure to say which half governs the funding decision. (3) A twelve-person specialty coffee roaster offering all staff "equity points" and a participation council while the founder keeps 70% and veto power over hiring; the mayor's office likes it because it's a visible job creator. Also flag the failure modes you can see coming: the temp/contractor loophole, remote and gig-shaped work, applicants where more control means more unpaid labour and the members end up squeezing themselves harder than the market would have, peer discipline replacing managerial discipline so that relations among coworkers get worse rather than better, and workers who simply don't want a vote. Finally, I want a short section at the end stating what this procedure cannot establish — including whether a fund of this size operating inside a market economy can reduce exploitation in Marx's sense at all, or whether the most the honest procedure can do is score local reductions and tell the committee what its own success metric is and isn't entitled to claim. I'd rather that limitation be stated up front than buried, but I definately need the thing to still be usable, so don't let the pessimism eat the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** 4th-year Pol Phil PhD student, acting as "theory person" for a worker-ownership conversion fund in a Rust Belt city.
      *   **Task:** Create a usable procedure (checklist/algorithm) for case officers to evaluate loan/grant applications based on specific ordinance criteria: "materially reduce exploitation" and "increase worker control over the productive process."
      *   **Constraints:**
          *   Usable by non-theorists (ex-lenders) in ~90 mins (packet) + 45 mins (site visit).
          *   Output: Not Fundable, Fund, Fund-with-Conditions, Escalate to Committee.
          *   Theoretical Grounding: Marx's actual account of exploitation (surplus labor, separation from means of production, labor power as commodity) + Analytic Marxist withdrawal test (Roemer-style).
          *   Alienation: Don't just list the 4 types; determine what's measurable vs. unmeasurable for a lender. Acknowledge exploitation/alienation can come apart.
          *   No citations/reading lists; explain concepts in plain English within the procedure.
          *   Test the procedure on three specific cases (Machine Shop, Home-Care Agency, Coffee Roaster).
          *   Identify failure modes (temp loophole, gig work, self-exploitation, peer discipline, apathy).
          *   Final Section: Limitations of the procedure (what it *cannot* establish, especially regarding structural limits of a fund in a market economy).
          *   Tone: Pragmatic, theoretically rigorous but operationalized, honest about trade-offs.

  2.  **Deconstruct the Theory for Operationalization:**

      *   **Exploitation (Marx):** Appropriation of surplus value. Workers produce more value than they are paid.
          *   *Operationalization:* Can't measure "socially necessary labor time." Can measure *distribution of surplus*. Who gets the profit? Is labor power treated as a commodity (hired/fired at will) or something else?
      *   **Exploitation (Analytic Marxist/Withdrawal Test):** A group is exploited if they would be better off leaving with their per capita share of assets.
          *   *Operationalization:* If workers leave, do they take the capital? If they stay, do they get the residual claim? This maps to *ownership structure* and *profit distribution*.
      *   **Control (Alienation/Process):** Control over the productive process.
          *   *Operationalization:* Who sets the pace? Who decides tools/methods? Who hires/fires?
          *   *Measurable:* Board seats, voting rights, scheduling input, tool selection.
          *   *Unmeasurable:* Internal psychological sense of fulfillment, "species-being." Drop the psychological/philosophical depth; focus on *decision rights*.
      *   **The Tension:** Ownership $\neq$ Control. Ownership $\neq$ End of Exploitation (if market forces compel surplus extraction to compete).

  3.  **Drafting the Procedure (The "Tool"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist. Let's go with a Step-by-Step with Decision Gates.
      *   *Time Limit:* 90 mins packet + 45 mins visit. Questions must be direct.
      *   *Concept Translation:*
          *   "Surplus Appropriation" $\rightarrow$ "Where does the net profit go?"
          *   "Separation from Means of Production" $\rightarrow$ "Do workers own the assets, and can they sell them?"
          *   "Labor Power as Commodity" $\rightarrow$ "Are workers hired/fired like inputs, or are they members?"
          *   "Withdrawal Test" $\rightarrow$ "If the co-op dissolved tomorrow, what happens to the equity?"
          *   "Control over Process" $\rightarrow$ "Who sets the speed and method of work?"

      *   *The Algorithm:*
          1.  **Gate 1: The Withdrawal Test (Ownership/Asset Lock).** If they leave, do they take capital? (Pass/Fail).
          2.  **Gate 2: Surplus Appropriation (Profit Distribution).** Who gets the residual? (Pass/Fail/Condition).
          3.  **Gate 3: Labor Power Status (Hiring/Temp).** Are workers commodities or members? (Pass/Fail/Escalate).
          4.  **Gate 4: Process Control (Alienation/Workflow).** Who decides how work is done? (Pass/Condition/Escalate).
          5.  **Output Generation.**

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Machine Shop.**
          *   Ownership: 100% trust (Pass).
          *   Surplus: Profit share (Pass).
          *   Labor Power: Temps/Contractors used to protect share value. This creates a two-tier system. Non-members are exploited *by* the members.
          *   *Verdict:* Fund-with-Conditions (must cap temp usage or convert temps) OR Escalate (is member-exploitation-of-non-members allowed?). Let's say Fund-with-Conditions to cap the *ratio* of non-member labor.
      *   **Case 2: Home-Care Agency.**
          *   Ownership: Co-op (Pass).
          *   Surplus: Margins are thin (county rates).
          *   Control: Software/County dictates pace. Workers own the shell, not the process.
          *   *Verdict:* This is the "Alienation vs. Exploitation" split. They reduce exploitation (own surplus) but not alienation (no process control). Procedure needs to weigh this. If the ordinance requires *both*, this might be "Not Fundable" or "Fund-with-Conditions" (advocacy for scheduling control). Let's make it "Fund-with-Conditions" focused on the *process* control deficit.
      *   **Case 3: Coffee Roaster.**
          *   Ownership: Founder keeps 70% + Veto.
          *   Withdrawal Test: Fail. Workers can't leave with assets.
          *   Control: "Participation council" is advisory.
          *   *Verdict:* Not Fundable. Fails the basic definition of reducing separation from means of production.

  5.  **Addressing Failure Modes:**

      *   Temp Loophole (Case 1).
      *   Self-Exploitation (Working harder for less because it's "ours").
      *   Peer Discipline (Toxic co-op dynamics).
      *   Apathy (Workers don't want to vote).

  6.  **Drafting the Limitations Section:**

      *   Must be honest: A fund cannot stop market competition.
      *   Marx's exploitation is systemic; this is local mitigation.
      *   The procedure measures *form*, not *essence* (cannot measure surplus value directly).

  7.  **Refining the Tone:**

      *   Needs to sound like a manual, not a paper.
      *   Avoid jargon where possible, or define it immediately in operational terms.
      *   Acknowledge the user's PhD background implicitly by showing the theoretical rigor *behind* the simple questions.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the Withdrawal Test too abstract for a lender?
      *   *Fix:* Translate it to "Asset Lock and Buy-In/Out rules." If a worker quits, do they get a check for their share of the machine shop? If yes, they own the means. If no, they just own a job.
      *   *Critique:* Is the Alienation part too vague?
      *   *Fix:* Focus on "Pace and Method." Can a worker stop the line? Can they choose the tool?
      *   *Critique:* The prompt asks for "Escalate" for value questions.
      *   *Fix:* Use "Escalate" when the math works but the ethics are murky (e.g., members exploiting temps).
      *   *Critique:* Ensure the "Not Fundable" criteria are hard stops.
      *   *Fix:* Founder veto power = Automatic Not Fundable (fails separation test).

  9.  **Final Polish:** Check against all constraints in the prompt (90 mins, 4 outputs, specific cases, limitations section). Ensure the distinction between *exploitation* (economic extraction) and *alienation* (process control) is clear in the scoring.

  *(Self-Correction on Case 2)*: The prompt says "I suspect the procedure should split it." I need to make sure the procedure allows for a "Fund" on exploitation grounds even if "Control" is low, or vice versa, but the Ordinance says "AND". So if it fails one, it technically fails. However, "Fund-with-Conditions" can address the gap. I will structure the scoring to allow a "Fund" if Exploitation is significantly reduced, even if Control is constrained by external factors, provided there is a plan to mitigate the Control deficit. Actually, strict reading: Ordinance says "reduce exploitation AND increase control." If Control is impossible (county software), can they "increase" it relative to the prior state? Yes, if they have *more* say than the private owner did. I need to make sure the baseline is "previous ownership," not "ideal ownership."

  *(Refining the Withdrawal Test)*: Roemer's test is counterfactual. A lender can't run a simulation. They can check the *bylaws*. Do the bylaws allow withdrawal of equity? That's the proxy.

  *(Refining Alienation)*: Drop "species being." Keep "Pace, Method, Product."

  Let's write it.cw
answer: |-
  # WORKER-CONVERSION FUND: EVALUATION PROCEDURE (v1.0)
  **For Case Officer Use Only**  
  **Time Allowance:** 90 Minutes (Packet Review) + 45 Minutes (Site Visit)  
  **Goal:** Determine if the conversion meets the Ordinance requirements to "materially reduce exploitation" and "increase worker control."

  ---

  ## PART 1: CONCEPTUAL GROUNDING (READ ONCE)
  *Do not give this section to applicants. This is for your scoring logic.*

  **1. Exploitation (The Economic Test)**
  In this fund's context, exploitation is not just "low wages." It is the structural separation of the worker from the value they create.
  *   **The Marxian Baseline:** Under capitalism, the owner buys labor and keeps the profit (surplus). The worker is a cost to be minimized.
  *   **The Withdrawal Test (Analytic Marxist):** A group is exploited if they would be better off leaving with their per-capita share of the assets. To *reduce* exploitation, the workers must have a claim on the assets and the surplus that they cannot be fired away from.
  *   **What you are measuring:** Who owns the residual value? If the business is sold or dissolved, who gets the check? If the answer is "only the original owner" or "a trust the workers can't access," exploitation has not been reduced.

  **2. Control (The Process Test)**
  Control is not just voting for a board. It is authority over the immediate labor process.
  *   **The Alienation Baseline:** Workers are alienated when they are told *how* to work, *how fast* to work, and *what* to work on, without input.
  *   **What you are measuring:** Decision rights. Can a worker stop the line? Do they choose the tools? Do they set the schedule?
  *   **Note:** Ownership does not guarantee control. A worker-owner can still be micromanaged by a hired CEO or constrained by a client's software. You must measure *process* separately from *profit*.

  **3. The Four Outputs**
  *   **NOT FUNDABLE:** Fails a hard gate (see below).
  *   **FUND:** Meets all criteria.
  *   **FUND-WITH-CONDITIONS:** Meets criteria only if specific, enforceable changes are made to the bylaws or business plan (conditions must be written into the term sheet).
  *   **ESCALATE:** The math works, but the ethical implication violates the spirit of the ordinance (e.g., workers reducing their own exploitation by exploiting others).

  ---

  ## PART 2: THE PROCEDURE (CHECKLIST)

  ### GATE 1: THE WITHDRAWAL TEST (Ownership & Assets)
  *Review: Bylaws, Purchase Agreement, Equity Structure.*

  **Q1.1: If a worker-member quits or retires, can they redeem their equity for cash?**
  *   **Yes:** (Pass) They own a share of the means of production.
  *   **No / Only at Board Discretion:** (Fail) They own a job, not an asset.
  *   **Action:** If **No**, mark **NOT FUNDABLE**. Stop.
  *   *Theory Note:* If they cannot withdraw their share of the assets, they remain separated from the means of production. They are selling labor power, not utilizing capital.

  **Q1.2: If the company dissolves or is sold, where does the net equity go?**
  *   **To the worker-members:** (Pass)
  *   **To a non-worker entity / Original Owner / Charity:** (Fail)
  *   **Action:** If **Fail**, mark **NOT FUNDABLE**. Stop.
  *   *Theory Note:* This checks the "appropriation of surplus." If the residual value leaves the workforce, the surplus is being expropriated.

  ### GATE 2: SURPLUS APPROPRIATION (Profit & Wages)
  *Review: Pro Forma, Compensation Plan.*

  **Q2.1: How is net profit (after expenses and reserves) distributed?**
  *   **Majority (>50%) to worker-members based on labor/hours:** (Pass)
  *   **Majority to external investors or retained indefinitely without member vote:** (Fail)
  *   **Action:** If **Fail**, mark **NOT FUNDABLE**. Stop.

  **Q2.2: Are there workers in the facility who are *not* eligible for membership/profit share?**
  *   **No:** (Pass)
  *   **Yes:** (See Q2.3)
  *   **Q2.3: Is the number of non-member workers capped at 10% of total labor hours?**
  *   **Yes:** (Pass)
  *   **No:** (Condition/Escalate)
  *   **Action:** If **No**, mark **FUND-WITH-CONDITIONS**.
      *   *Condition:* "Borrower must cap non-member labor hours at 10% of total annual hours by Year 2."
      *   *Theory Note:* If members protect their profit share by hiring a permanent underclass of non-owners, they are replicating the exploitation structure internally. This reduces *their* exploitation but increases aggregate exploitation.

  ### GATE 3: LABOR POWER STATUS (Hiring & Firing)
  *Review: HR Policy, Site Visit Interviews.*

  **Q3.1: Who has the authority to hire and fire member-workers?**
  *   **The Workers (Vote or Elected Committee):** (Pass)
  *   **A Hired Manager without Board oversight:** (Condition)
  *   **The Original Owner (post-sale):** (Fail)
  *   **Action:** If **Fail**, mark **NOT FUNDABLE**. If **Manager**, mark **FUND-WITH-CONDITIONS** (Condition: "Board must retain final approval on all terminations").
  *   *Theory Note:* If labor power can be discarded by a single owner, it remains a commodity.

  **Q3.2: (Site Visit) Ask three random workers: "If you disagreed with a safety or speed decision, could you stop the work without being fired?"**
  *   **Yes (Consensus):** (Pass)
  *   **No / "I'd get written up":** (Condition/Escalate)
  *   **Action:** If **No**, mark **FUND-WITH-CONDITIONS**.
      *   *Condition:* "Borrower must implement a 'Stop Work' authority clause in the employee handbook."

  ### GATE 4: PROCESS CONTROL (Alienation & Workflow)
  *Review: Org Chart, Site Visit Observation.*

  **Q4.1: Who sets the production schedule or caseload pace?**
  *   **The Workers / Elected Board:** (Pass)
  *   **External Client / Software / Market Demand (Unmediated):** (See Q4.2)
  *   **Q4.2: Does the Board have the authority to reject work or adjust timelines to protect worker capacity?**
  *   **Yes:** (Pass)
  *   **No:** (Condition)
  *   **Action:** If **No**, mark **FUND-WITH-CONDITIONS**.
      *   *Condition:* "Borrower must establish a quarterly capacity review where the Board can decline contracts that require unsustainable pacing."
      *   *Theory Note:* Alienation comes from being an instrument of someone else's will. If the software or client dictates the pace and the Board cannot say "no," the workers are still instruments, even if they own the machine.

  **Q4.2: (Site Visit) Ask three random workers: "Do you have a say in which tools or methods you use to do your job?"**
  *   **Yes:** (Pass)
  *   **No:** (Condition)
  *   **Action:** If **No**, mark **FUND-WITH-CONDITIONS** (Condition: "Formation of a Methods Committee with budget authority for tooling").

  ### GATE 5: THE "SELF-EXPLOITATION" CHECK
  *Review: Business Plan Financials.*

  **Q5.1: Does the business plan rely on wage cuts or increased hours per worker to achieve solvency compared to the prior ownership?**
  *   **No:** (Pass)
  *   **Yes:** (Escalate)
  *   **Action:** Mark **ESCALATE TO COMMITTEE**.
      *   *Note:* This indicates the workers are buying the job at the cost of their own reproduction. This is not a reduction of exploitation; it is a shift of risk from capital to labor.

  ---

  ## PART 3: TEST RUNS (LAST CYCLE APPLICATIONS)

  ### APPLICATION 1: Precision Machining Shop (38 Workers)
  *   **Gate 1 (Assets):** 100% Worker Trust. Equity redeemable on exit. **(PASS)**
  *   **Gate 2 (Surplus):** Profit share by seniority. **(PASS)**
  *   **Gate 2.3 (Non-Members):** Plan relies on 5–8 agency temps permanently; potentially permanent contract machinists. Ratio exceeds 10%. **(FAIL -> CONDITION)**
  *   **Gate 3 (Hiring):** Members elect board. **(PASS)**
  *   **Gate 4 (Control):** Members set pace. **(PASS)**
  *   **Gate 5 (Self-Exploitation):** Wages up 7%. **(PASS)**

  **OUTPUT:** **FUND-WITH-CONDITIONS**
  **Conditions:**
  1.  Cap non-member (temp/contract) labor hours at 10% of total annual production hours.
  2.  Any contract machinist working >1,000 hours/year must be offered membership buy-in.
  **Theory Note:** This triggers the "Temp Loophole." The members are reducing their own exploitation by externalizing it onto a precarious periphery. The Ordinance requires reducing exploitation *in the workplace*, not just for the voting class. The condition forces them to internalize the labor cost.
  **Political Risk:** High. The Director likes this one. The condition may make the deal financially unviable. If they reject the condition, it becomes **NOT FUNDABLE**.

  ### APPLICATION 2: Home-Care Agency (60 Workers)
  *   **Gate 1 (Assets):** Co-op structure. Equity redeemable. **(PASS)**
  *   **Gate 2 (Surplus):** Margins fixed by county. Profit share minimal but exists. **(PASS)**
  *   **Gate 3 (Hiring):** Members elect board. **(PASS)**
  *   **Gate 4 (Control):** Scheduling software and county rates dictate pace. Board *cannot* reject caseloads without losing license. **(FAIL -> CONDITION)**
  *   **Gate 4 (Site Visit):** Workers report no say in visit duration (15-min chunks). **(FAIL -> CONDITION)**
  *   **Gate 5 (Self-Exploitation):** Wage gain small. **(PASS)**

  **OUTPUT:** **FUND-WITH-CONDITIONS**
  **Conditions:**
  1.  Board must establish a "Care Quality Committee" empowered to aggregate worker data and lobby the county for rate/time adjustments (mitigation of external control).
  2.  Internal scheduling flexibility: Workers must be allowed to trade/swap visits without penalty to manage the 15-minute chunks.
  **Theory Note:** This splits Exploitation and Alienation. Exploitation is reduced (they own the surplus, however small). Alienation is *not* reduced (they still don't control the labor process). The procedure allows funding because the *ownership* change is real, but the *process* deficit must be acknowledged and mitigated where possible.
  **Decision Logic:** The Ordinance says "Increase control." They cannot increase control over the county, but they can increase control over *internal* scheduling. The condition targets the margin of control they actually possess.

  ### APPLICATION 3: Coffee Roaster (12 Workers)
  *   **Gate 1 (Assets):** Founder keeps 70%. Workers get "points" (phantom equity). **(FAIL)**
  *   **Gate 1.2 (Dissolution):** Founder gets net equity. **(FAIL)**
  *   **Gate 3 (Hiring):** Founder has veto power. **(FAIL)**

  **OUTPUT:** **NOT FUNDABLE**
  **Reasoning:** Fails the Withdrawal Test. Workers remain separated from the means of production. "Equity points" are a bonus scheme, not ownership. Labor power remains a commodity subject to the Founder's veto.
  **Political Risk:** High. Mayor likes it. You must stand firm on Gate 1. This is not a conversion; it is a retention bonus plan.

  ---

  ## PART 4: FAILURE MODES & RISK FLAGS

  **1. The Temp/Contractor Loophole (Seen in App 1)**
  *   **Risk:** Members vote themselves high wages by hiring non-members at market rate with no benefits.
  *   **Procedure Fix:** Gate 2.3 (10% Cap).
  *   **Theoretical Limit:** This acknowledges that a co-op can be an exploitative collective capitalist. The Fund cannot subsidize this.

  **2. Self-Exploitation (The "Sweatshop Co-op")**
  *   **Risk:** Workers vote to cut their own wages or work unpaid overtime to save the business, effectively absorbing the risk that capital usually bears.
  *   **Procedure Fix:** Gate 5 (Escalate).
  *   **Theoretical Limit:** Marx argues labor power must be reproduced. If the conversion requires workers to consume their own reproduction fund, it is not liberation; it is desperation. The Committee must decide if this is a valid "transition cost" or a dealbreaker.

  **3. Peer Discipline (Toxic Horizontalism)**
  *   **Risk:** Removing managers leads to social pressure, shaming, and informal hierarchies that are harder to appeal than formal HR processes.
  *   **Procedure Fix:** Gate 3.1 (Formal Termination Process).
  *   **Theoretical Limit:** The procedure cannot measure interpersonal dynamics. It can only ensure due process exists.

  **4. Apathy (The "Voteless Owner")**
  *   **Risk:** Workers own the firm but refuse to attend meetings. A de facto manager takes control.
  *   **Procedure Fix:** Gate 4.1 (Board Authority).
  *   **Theoretical Limit:** You cannot force participation. If they choose alienation, the Fund cannot stop them. The procedure ensures the *right* to control exists, not the *exercise* of it.

  **5. Remote/Gig Work**
  *   **Risk:** "Ownership" of a platform where workers are isolated.
  *   **Procedure Fix:** Gate 4.2 (Tools/Methods).
  *   **Theoretical Limit:** If the "workplace" is an app, "control over the productive process" means control over the algorithm. If they cannot audit the algorithm, they do not control the process. Treat as **NOT FUNDABLE** unless algorithm governance is granted.

  ---

  ## PART 5: LIMITATIONS STATEMENT (FOR THE COMMITTEE)

  **What This Procedure Cannot Establish**

  1.  **Systemic Exploitation:** This procedure measures *local* property relations. It cannot determine if the firm is extracting surplus value from the broader economy (e.g., via monopoly pricing or supply chain pressure). A fully worker-owned firm can still exploit customers or suppliers to survive market competition. The Ordinance claims to reduce exploitation "in the workplace." This procedure verifies that claim only within the four walls of the firm.
  2.  **The Market Constraint:** In a capitalist market, firms are compelled to accumulate capital or die. Even a worker-owned firm must extract a surplus (profit) to reinvest. This procedure ensures the *workers appropriate that surplus*, but it cannot stop the *necessity* of surplus extraction. We are funding a change in *distribution*, not a suspension of market laws.
  3.  **Alienation vs. Ownership:** As seen in Application 2, ownership does not guarantee control. External market forces (county rates, software, supply chains) can dictate the labor process even if the workers own the assets. This procedure scores the *potential* for control (legal rights), not the *reality* of daily experience.
  4.  **Success Metrics:** If a funded firm succeeds financially by intensifying labor (working harder/faster) to beat competitors, this procedure will score it as "Fundable" provided the workers vote for it. We cannot distinguish between "empowerment" and "collective self-grinding" without violating worker sovereignty.

  **Conclusion:** This procedure ensures the *form* of the conversion matches the Ordinance's theoretical requirements (Withdrawal Test, Surplus Appropriation, Process Rights). It does not guarantee the *substance* of liberation, as that depends on market conditions outside the Fund's control. Success is defined as the establishment of legal and economic structures that *permit* the reduction of exploitation, not the guarantee of its outcome.
