prompt: |-
  I'm a third-year actuarial science student who's also sitting in on a political philosophy seminar this semester (distributive justice), and I've been telling my study group that luck egalitarianism is basically a pricing problem in disguise. My claim: the brute luck / option luck split is just the difference between exposure you can't select on and exposure the person brings on themselves, i.e. whether the risk is exogenous to the insured or endogenous to their choices, and Dworkin's hypothetical insurance stuff is literally an underwriting exercise where you've been told which variables you're not allowed to use.

  Can you take the luck egalitarian position — Dworkin's equality of resources as the cleanest version, plus Cohen's complaints and Anderson's democratic-equality alternative — and restate the whole thing in the vocabulary I actually use? Risk pools, underwriting classes, experience rating, adverse selection, moral hazard, the actuarially fair premium, loss ratios, correlation between insureds, uninsurable risk, reserves, reinsurance. Be as faithful as you definately can with the parts that do fit.

  Then give me the residue report in three buckets: what maps cleanly, what you had to bend to make fit, and what has no expression at all in underwriting language. Specifically I want to know:

  - does the hypothetical insurance market survive as an actuarial object, or does it need frequencies and an actual book of business that the hypothetical version never has?
  - is there any counterpart to a chosen risk that's correlated across the whole pool? like if everybody picks the same gamble, does option luck collapse into something my framework can only treat as exogenous?
  - what happens to the expensive tastes problem and to Anderson's point that luck egalitarianism shames people for their bad luck. My gut says neither translates and I want to be told why (or told I'm wrong).

  One ground rule: don't smuggle. "Fair premium" and "fair distribution" are not the same word doing the same job, so if you catch yourself sliding between the actuarial sense of fair and the moral one, flag it out loud instead of doing it quietly — that slide is probably where alot of the interesting stuff is hiding.

  Finish with a verdict on my study-group claim: is the residue there because underwriting vocabulary is too thin to hold the whole argument, or because the philosophers are fighting over less than it looks like?
