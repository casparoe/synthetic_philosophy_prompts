  2.  **Deconstruct Aquinas's Position on Tyranny:**
      *   *De Regno (On Kingship):* Tyranny is unjust rule for private gain. It's better to have a mild tyranny than a revolt that leads to worse tyranny or chaos.
      *   *Summa Theologiae II-II, Q. 42 (Sedition):* Sedition is a mortal sin. Opposing a tyrant is not sedition *unless* it causes greater harm to the community.
      *   *Who can act?* Public authority, not private individuals. If there is a superior (e.g., Emperor over King), appeal to them. If no superior (the King is the top), recourse is to God (prayer, repentance), not violence.
      *   *Assassination?* Aquinas explicitly discourages private assassination. He mentions examples where it happened but doesn't endorse it as a general policy for individuals.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard HR policy header.
      *   **Section 1: Purpose & Definitions.** Define "Tyrannical Executive" vs. "Adverse Management." Focus on private advantage vs. common good.
