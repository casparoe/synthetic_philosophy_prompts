  **Policy ID: GOV-EX-042**
  **Title: Removal of a Tyrannical Executive: Employee Guidance and Escalation Pathway**
  **Effective Date: Immediately**

  **1. Definitions and Scope**
  For the purposes of this protocol, a "Tyrannical Executive" is defined as a leadership stakeholder who directs organizational resources primarily toward private advantage rather than the common good of the firm. This classification does not apply to executives who are merely severe, operationally incompetent, or personally disliked. Strict management of deliverables does not constitute tyranny.

  **2. Eligibility and Authorization**
  Initiation of removal proceedings is restricted to Public Authority. Individual Contributors (ICs) are not authorized to initiate removal actions against an executive. Private action taken by an individual to remove leadership is classified as sedition and violates Company Conduct Policy. Remediation must originate from a body representing the collective organizational interest.

  **3. Escalation Pathway**
  3.1 **Existence of Superior Authority:** If the Tyrannical Executive reports to a higher administrative layer (e.g., VP reports to C-Level), the concern must be escalated to that superior. The superior is obligated to review the alignment of executive output with organizational good.
  3.2 **Absence of Superior Authority:** If the Tyrannical Executive holds the highest human authority within the unit (e.g., CEO/Founder), the matter must be referred to the Board of Directors. The Board acts as the public authority capable of deposing leadership.

  **4. Harm Assessment and Proportionality**
  Before any removal action is authorized, a Comparative Harm Analysis must be conducted. Removal is prohibited if the resulting disturbance to organizational stability exceeds the harm caused by the continued tyranny. If the removal process risks collapsing the firm or installing a worse leadership regime, the status quo must be maintained. The safety and continuity of the collective body take precedence over the removal of the unjust actor.

  **5. Unavailable Human Remedies**
  In scenarios where no superior authority exists, the Board is complicit, or the Harm Assessment prohibits action, no human remedy is available. Employees are instructed to endure the condition. Requests for intervention will be closed. Staff may utilize the Employee Assistance Program (EAP) for spiritual counseling regarding endurance under unjust authority.

  **FAQ**

  **Q: Can I remove the executive if they are harming the team?**
  A: Only if you possess public authority. Private individuals cannot act.

  **Q: What if the Board refuses to act?**
  A: Recourse to human authority is exhausted. You must endure.

  **Q: Is lethal removal permitted?**
  A: No. Private assassination is strictly prohibited regardless of executive conduct.

  **Q: What if the tyranny becomes unbearable?**
  A: Unbearable conditions do not override the Proportionality Clause. If removal causes greater harm, you must remain subject to the executive.

  **Acknowledgement**
  By continuing employment, staff acknowledge that organizational continuity may require submission to unjust leadership where removal poses greater risk. There is no guarantee of justice in every reporting cycle.

