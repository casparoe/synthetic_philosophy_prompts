answer: |-
  **OFFICIAL ACKNOWLEDGMENT CLASSIFICATION PROCEDURE (OACP)**
  **Framework Choices:** To classify texts as apologies, this procedure adopts two contested positions as operational choices: (1) **Continuity:** The State is a continuous moral agent responsible for prior regimes' acts (vs. State succession). (2) **Moral Judgment:** Past acts are judged by current moral standards, not solely contemporary ones (vs. Historical relativism). *Flag: These are policy choices, not philosophical findings.*

  **1. THE FIVE TESTS**
  *Apply sequentially. If any Conceptual Test fails, the text is not an apology.*

  | Test | Instruction | Pass | Fail | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Agent** | Identify the speaker. Does a specific collective agent accept responsibility *now* for acts done *then*? | "We did this." | "Things happened" or "Past regime did this." | **Conceptual** |
  | **2. Wrongness** | Locate the moral judgment. Does the text assert the act was wrongful *at the time*? | "This was unjust." | "This caused suffering" or "Standards were different." | **Conceptual** |
  | **3. Responsibility** | Check for negation. Is responsibility accepted without voiding obligation in the same breath? | Unqualified acceptance. | "We apologize but accept no liability." | **Conceptual** |
  | **4. Addressee** | Identify the recipient. Is a specific wronged community named? | Named group. | Abstract "suffering" or no target. | **Pragmatic** |
  | **5. Commitment** | Locate future orientation. Is there a promise of non-repetition or repair? | "We will change/pay." | No forward-looking clause. | **Pragmatic** |

  **2. CLASSIFICATION VOCABULARY & REPAIRS**
  *If Tests 1-3 fail, classify using the left column. Repairs are either Wording (W) or Act (A).*

  | Classification | Defining Failure | Minimal Repair | Type |
  | :--- | :--- | :--- | :--- |
  | **Expression of Regret** | Fails **Wrongness**. Acknowledges harm, not wrong. | Change "sorrow for suffering" to "acknowledge injustice." | **W** |
  | **Historical Acknowledgment** | Fails **Agent**. States facts without agency. | Insert "The State accepts responsibility for..." | **W** |
  | **Disavowal Statement** | Fails **Agent** (Continuity). Distances current from past regime. | Remove distinction between regimes; assert continuity. | **A** (Policy) |
  | **Qualified Regret** | Fails **Responsibility**. Waives liability while apologizing. | Remove liability waiver clause. | **A** (Legal) |
  | **Statement of Sympathy** | Fails **Addressee**. Speaks *about* victims, not *to* them. | Address text to specific community representatives. | **W** |
  | **Commitment to Reform** | Fails **Wrongness/Agent**. Focuses only on future policy. | Precede with acknowledgment of past specific wrongs. | **W** |

  **3. TEST STATUS & NECESSITY**
  *   **Conceptual (Tests 1-3):** Necessary for the illocutionary act of apology. If these fail, the text *cannot* be an apology regardless of public reception. Passing these while failing 4-5 yields a "defective apology" (valid but ineffective).
  *   **Pragmatic (Tests 4-5):** Advisable for uptake and ethical completion. A text may pass 1-3 and fail 4-5; it is an apology, but likely ineffective or insulting.
  *   **Repair Limitations:** Repairs marked **(A)** require accompanying acts (legislative change, funding, liability assumption). No wording change can fix them. Producing the appearance of apology without these acts is prohibited by this procedure.

  **4. MINISTERIAL TRIGGERS & PROCEDURAL LIMITS**
  *   **Ministerial Judgment Required:** (1) **Continuity Choice:** Whether to accept responsibility for prior regimes (Test 1). (2) **Liability Assumption:** Whether to waive legal claims (Test 3). (3) **Reparation Scope:** What constitutes adequate commitment (Test 5). These are political/value judgments, not linguistic findings.
  *   **Procedure Cannot Settle:** (1) **Sincerity:** Internal state of mind is unverifiable. (2) **Uptake:** Whether the victim community accepts the apology. (3) **Demand:** Whether an apology is owed if not requested. (4) **Closure:** Whether an apology ends moral claims.

  ***

  **DRAFT EVALUATIONS**

  **DRAFT A**
  *   **Classification:** **Expression of Regret** (Not an Apology).
  *   **Tests Failed:**
      *   **Test 2 (Wrongness):** FAIL. Text cites "beliefs and standards of its time." This relativizes the wrong, negating the moral judgment required for apology.
      *   **Test 3 (Responsibility):** FAIL. Text states "no person now living bears responsibility." This explicitly voids agency.
  *   **Repairs:**
      *   *Wrongness:* Change "standards of its time" to "violations of fundamental rights." **(W)**
      *   *Responsibility:* Remove "no person... bears responsibility." Insert "The State accepts responsibility." **(W)**
      *   *Note:* If legal advice dictates no living person is liable, this requires a Ministerial decision on Collective Liability **(A)**.
  *   **Verdict:** Unflattering but clear: This is a eulogy for suffering, not an admission of guilt.

  **DRAFT B**
  *   **Classification:** **Qualified Regret** (Not an Apology).
  *   **Tests Failed:**
      *   **Test 3 (Responsibility):** FAIL. Text accepts responsibility but immediately voids it ("neither creates... obligation," "claims... closed"). In speech-act theory, waiving obligation while apologizing is infelicitous; it performs a settlement, not an apology.
  *   **Repairs:**
      *   *Responsibility:* Remove the waiver clause ("neither creates... closed"). **(A)**. This requires legal policy change, not rewording. You cannot apologize while legally immunizing yourself against the consequences of the wrong.
  *   **Verdict:** This is a legal settlement instrument disguised as moral acknowledgment. It fails the core function of apology (accepting burden).

  **DRAFT C**
  *   **Classification:** **Disavowal Statement** (Not an Apology).
  *   **Tests Failed:**
      *   **Test 1 (Agent):** FAIL. Text disavows the prior regime. Under our Framework Choice (Continuity), the State must own the past to apologize. Disavowal severs the agent.
      *   **Test 4 (Addressee):** FAIL. Text does not say to whom it is addressed.
  *   **Repairs:**
      *   *Agent:* Remove disavowal of prior regime; assert State continuity. **(A)** Requires political decision to inherit past sins.
      *   *Addressee:* Name the descendant community as recipients. **(W)**
  *   **Verdict:** This is a political declaration of regime change, not an apology to victims. It risks confirming the petitioners' fear that the matter will be declared closed without repair.

  **SUMMARY**
  **None of the three drafts classify as an apology under this procedure.**
  *   **Draft A** excuses the wrong via historical context.
  *   **Draft B** negates responsibility via legal waiver.
  *   **Draft C** negates agency via regime disavowal.
  To produce an apology, you must accept responsibility without waiver (B), judge the act as wrong regardless of era (A), and accept continuity with the past regime (C). This requires political decisions, not just drafting changes.
