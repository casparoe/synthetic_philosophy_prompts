answer: |-
  ### 1. Examination Question

  **Time Allowed:** 45 minutes  
  **Marks:** 25

  **Question:**

  Daniel Dennett proposes that the self is best understood on the model of a **center of gravity**. Like a center of gravity, the self is not a concrete particular located in the head, but an abstraction derived from a complex physical distribution (the body/brain). It is a posit belonging to a useful explanatory style: it has fixed properties determined by the underlying mass, and one can compute it wrongly.

  Contrast this with a **character in a novel**. A character is also not a concrete particular. However, nothing underwrites the correctness of claims about her beyond the fiction itself. There is no independent "mass" that determines whether the character is truly brave; there is only the text.

  Consider the case of **G**. At age thirty, G invented a past for himself—a childhood in another country, a dead brother, a career as a surveyor—and has lived in exact conformity to it ever since. The invented narrative is coherent, organizes his decisions, and makes him highly predictable to those who know it. G is under no illusion: he knows it is fabricated and maintains it deliberately. Because his actual history was uneventful, the fabricated narrative predicts and explains his conduct better than any accurate history would.

  Based on the distinction above:
  1.  Is G's self analogous to the center of gravity or the fictional character?
  2.  Explain why the view cannot simply answer "both."
  3.  What does your answer imply about the metaphysical status of the self on Dennett's model?

  ***

  ### 2. Model Answer

  Dennett's center of gravity analogy is designed to secure a middle ground between Cartesian realism (the self is a thing) and eliminativism (the self is nothing). It claims the self is real but abstract, grounded in physical facts like a center of gravity is grounded in mass. The case of G threatens to collapse this middle ground by severing the link between the abstraction and the physical ground.

  In G's case, the fabricated narrative functions exactly like a center of gravity in terms of utility: it predicts motion (behavior) and simplifies the complex mass (psychological states). However, a center of gravity is *derivative*. If you move the mass, the center of gravity shifts necessarily. It is computable wrongly if it does not match the mass. G's narrative, by contrast, is stipulated. It does not track his actual history (the mass); it overrides it. Therefore, G's self cannot be a center of gravity in the strict sense, because there is no underlying distribution from which it is abstracted. It resembles the fictional character: its correctness is underwritten only by the narrative consistency, not by physical facts.

  One might argue the view can be "both." Perhaps the self is a center of gravity generally, but in pathological or rare cases like G, it becomes fictional. This fails because it misunderstands the metaphysical commitment. If the self is a center of gravity, its identity conditions are fixed by the physical substrate. If it is a fictional character, its identity conditions are fixed by the story. These are incompatible modes of existence. To say it is both is to say it is simultaneously grounded and ungrounded. If the narrative determines the self despite contradicting the physical history, then the physical history is irrelevant to personal identity. If the physical history remains relevant, then G's fabricated narrative is not his self, but merely a story he tells about himself.

  Consequently, we face a dilemma. If we insist G's self *is* the fabricated narrative because it is the useful explanatory posit, we concede that the self is like a fictional character. This undermines the center of gravity analogy, which promised objective constraints (you can be wrong about your self). If the self is purely narrative, G is not wrong about his self, even if he is wrong about his history. This slides Dennett's view toward fictionalism, where the self exists only relative to the story told.

  Alternatively, if we insist the self must be a center of gravity, we must say G's self is not the fabricated narrative, but the actual psychological state sustaining the fabrication. This reinstates a concrete particular (the brain state maintaining the lie) as the true ground of the self. This saves the analogy but sacrifices the claim that the self is *just* the narrative center.

  The stronger position is to admit that G reveals the center of gravity analogy is unstable. In G's case, the "useful explanatory style" floats free of the mass. If Dennett wishes to maintain that selves are centers of gravity, he must deny that G's narrative is G's self. If he accepts the narrative as the self, he must admit the self is more like a fictional character than a physical abstraction. The latter is the more honest reading of the view: the self is a fiction, but a useful one. However, this abandons the objective constraint implied by the center of gravity, leaving the view vulnerable to the charge that if the self is just a story, there is no fact of the matter about who we are, only stories we agree to tell. G proves that usefulness does not guarantee grounding.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **A. Analysis of the Distinction (5 Marks)**
  *   **5:** Clearly articulates the difference: Center of Gravity (CoG) is derivative/objectively constrained by mass; Fiction is stipulated/underwritten only by the text.
  *   **3:** Identifies the difference but模糊 on the "grounding" aspect.
  *   **1:** Merely restates the prompt without philosophical elaboration.

  **B. Application to Case G (5 Marks)**
  *   **5:** Identifies that G's narrative lacks the requisite "mass" connection for a CoG but fits the "stipulation" model of Fiction.
  *   **3:** Notes the fabrication but fails to explain why this breaks the CoG model specifically.
  *   **1:** Treats G as a standard example of narrative identity without addressing the grounding problem.

  **C. The "Both" Exclusion (5 Marks)**
  *   **5:** Explains the metaphysical incompatibility: an entity cannot be simultaneously grounded in physical fact and ungrounded stipulation. Identity conditions would contradict.
  *   **3:** States they are different but fails to explain why a hybrid view is logically unstable.
  *   **1:** Accepts "both" as a viable compromise without argument.

  **D. Implication for Dennett's View (5 Marks)**
  *   **5:** Draws a clear conclusion: either Dennett must reinstate a concrete particular (the brain state) or admit the self is fictional/ungrounded.
  *   **3:** Vaguely suggests Dennett needs to clarify something.
  *   **1:** No conclusion drawn regarding the metaphysical status.

  **E. Clarity and Constraints (5 Marks)**
  *   **5:** Precise philosophical prose; avoids forbidden errors.
  *   **3:** Minor ambiguities or one minor forbidden error.
  *   **1:** Difficult to follow or multiple forbidden errors.

  **Specific Penalties (Deducted from Total):**
  *   **Pathology Move (-5 Marks):** Treating G as deluded, insane, or pathological. (The prompt stipulates he is under no illusion and functional).
  *   **Usefulness Move (-5 Marks):** Arguing that because the narrative is useful/predictive, it *is* the center of gravity, thereby conflating utility with metaphysical grounding.
  *   **Eliminativism Move (-5 Marks):** Claiming Dennett's view means the self does not exist at all. (Dennett argues the self exists as an abstraction, not that it is nonexistent).

  **First-Class Threshold (20-25 Marks):**
  To achieve a First, the answer must avoid all Specific Penalties and secure full marks in sections **C** and **D**. The student must recognize that the "Center of Gravity" model relies on a dependency relation (abstraction depends on mass) that G's case severs. They must explicitly argue why "usefulness" is insufficient to bridge this gap without collapsing the distinction between abstraction and fiction. The answer must take a definitive stance on whether Dennett's view survives the case, rather than surveying options neutrally.
