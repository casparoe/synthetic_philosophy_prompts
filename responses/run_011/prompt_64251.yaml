  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I say deflationists *never* deny truth is a property? *Correction:* Some do (Quine), some don't (Horwich). So the text is a simplification, not a flat denial by *all*. I need to be precise: "Careful minimalists would deny the universal claim that it is *not* a property."
