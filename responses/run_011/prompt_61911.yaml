answer: |-
  **Exam Question**

  **Course:** ANTH/ARCH 450: How Do We Know That?
  **Time:** 75 Minutes
  **Total Marks:** 25

  **Question:**
  Using only the provided data sheet for Sarnu Höyük Phase IIb, evaluate the claim that the standardized masses recovered from the site demonstrate the presence of a central institutional authority (e.g., a palace administration or taxing body) enforcing metrological standards. Your essay must distinguish between the inference that these objects *functioned* as weights and the inference that their standardization required *political enforcement*. Identify the specific gaps in the data where the inference from artifact to institution breaks down. Do not summarize site formation processes generally; apply them directly to the Sarnu assemblage.

  ***

  **Model Answer**

  The claim that the Sarnu Höyük assemblage proves a central institutional authority enforcing metrological standards is an overreach that collapses three distinct inferential steps: functional identification, contextual integrity, and social mechanism. While the data suggests some objects functioned as weights, it does not support the conclusion that a state-like body policed their standardization.

  First, functional identification is ambiguous. The mass clusters (10g, 38g, 77g, 153g) show tight tolerances (5%), which supports a metrological interpretation over random accumulation. However, the 10g group is perforated with cord-polish, while larger masses are not. The comparative data notes spindle whorls typically range 5–40g. The 10g objects fit this range perfectly. While the note states regional loom weights are "sloppier," this negative analogy is weak; it does not prove these specific objects are not textile tools used in domestic contexts. If the 10g perforated objects are spindle whorls found on house floors, their standardization might reflect craft tradition rather than metrology. Conflating the perforated and non-perforated groups to establish a single "system" is analytically unsound without use-wear analysis beyond cord-polish.

  Second, the contextual integrity of the assemblage is compromised by missing data and temporal mixing. The data sheet aggregates all 43 objects to demonstrate mass clustering but withholding the cross-tabulation of mass against context is a critical gap. If the 10g perforated objects are exclusively domestic (house floors) and the non-perforated 77g/153g objects are exclusively in the burned room, there is no single standardizing system across the site. Furthermore, four objects come from an intrusive pit dated 300 years later. Including these in the same statistical clusters as the Phase IIb material assumes metrological continuity across centuries without evidence. The presence of exotic stone and reworked statue fragments in the pit suggests these specific items were curated heirlooms, not circulating currency or active weights. Their inclusion artificially bolsters the sample size for the higher mass categories, potentially creating a false impression of a coherent, site-wide system.

  Third, and most critically, even if we accept these are standardized weights, standardization does not equal state enforcement. The ceramicist's argument relies on the burned room containing pithoi and cylinder seals to imply a palace administration. This is the "Pompeii premise" applied to administration: assuming the destruction horizon captures a functioning bureaucratic moment rather than a specific, perhaps anomalous, storage event. The presence of seals indicates some record-keeping, but not necessarily a monopoly on standards.

  The inference breaks where students assume vertical enforcement (a palace policing weights) is the only cause of standardization. Economic anthropology demonstrates that horizontal enforcement—peer monitoring in market exchange or reciprocal gift networks—can produce tight tolerances without a central authority. If the 26 objects from house floors share the same standard as the burned room, this suggests a widespread cultural norm rather than a top-down decree. The data shows uniformity, but uniformity can emerge from repeated dyadic exchange where deviation is punished by social trust rather than state violence. To claim a taxing authority, one would need evidence of calibration tools, official copies of standards, or textual records linking the weights to tribute. None exist here.

  Ultimately, the Sarnu data supports the existence of a local convention for measuring mass, likely used in both domestic craft and storage management. It does not support the existence of an institution with the power to enforce those standards politically. The leap from "these objects match" to "a palace made them match" is unsupported by the distributional data and ignores non-state mechanisms for maintaining standardization.

  ***

  **Marking Scheme**

  **1. Functional Ambiguity (5 marks)**
  *   **Must Hit:** Student identifies the perforation distinction (10g vs. others) and engages the spindle whorl comparata to challenge the "all weights" assumption.
  *   **How they blow it:** They accept the prompt's implication that all 43 objects are weights without questioning the perforated 10g group's fit within the spindle whorl range.

  **2. Contextual Cross-Tabulation Gap (5 marks)**
  *   **Must Hit:** Student explicitly notes that the missing mass-by-context cross-tabulation prevents knowing if the standardization is site-wide or restricted to the "administrative" burned room.
  *   **How they blow it:** They treat the aggregate mass clusters as valid despite the data sheet admitting the cross-tab was omitted, assuming the clusters apply equally to houses and the burned room.

  **3. Temporal Integrity (5 marks)**
  *   **Must Hit:** Student flags the intrusive pit (300 years later) as contaminating the dataset, noting that heirloom status (statue fragment/exotic stone) removes those objects from contemporary circulation.
  *   **How they blow it:** They include the pit finds in the Phase IIb analysis without comment, treating the 300-year gap as irrelevant to the functioning of a metrological system.

  **4. The Institutional Leap (5 marks)**
  *   **Must Hit:** Student distinguishes between *standardization* (the pattern) and *enforcement* (the cause), arguing that uniformity does not prove a central authority.
  *   **How they blow it:** They argue that because the masses are standardized within 5%, a central authority *must* exist to enforce it, ignoring peer-to-peer enforcement mechanisms.

  **5. The Ceramicist Trap (5 marks)**
  *   **Must Hit:** Student critiques the reliance on the burned room/pithoi/seals as proof of a state, identifying this as a contextual shortcut that ignores the domestic majority (26 objects).
  *   **How they blow it:** They reproduce the ceramicist's argument that the burned room "settles" the issue, awarding the site a palace administration based solely on the presence of storage jars and seals.

  *(Note: Answers that rely solely on the phrase "context is everything" without specifying which contexts are problematic or how they alter the inference cannot score above 15/25 [C range].)*

  Verdict: The data supports the use of standardized measures in local exchange, but fails to demonstrate central institutional enforcement.
