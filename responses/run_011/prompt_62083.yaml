answer: |-
  This is a sophisticated and pedagogically sound plan. You are attempting to operationalize the distinction between *ontological determinism* (the envelope exists) and *epistemological predictability* (the score sheet suffers). The Golden Mean Shift (GMS) is an excellent choice for a philosophy seminar: it is discrete (no calculus required), structurally rich (constraints mimic laws), and topologically conjugate to standard chaotic maps.

  Here is the development, correction, and framing you requested.

  ### 1. The System: Golden Mean Shift vs. Continuous Maps

  **Verdict:** Keep the Golden Mean Shift. Do not switch to the Doubling or Logistic Map.

  **Analysis of your worry:** You worry the unpredictability is "representational" (how much I reveal) rather than "dynamical" (amplification).
  *   **Doubling Map ($2x \mod 1$):** Computationally trivial for you, but conceptually slippery for them. To compute $x_{n+1}$ from $x_n$ by hand requires decimal multiplication. More critically, its invariant measure is uniform. If a student does not know the state, their best forecast for the next bit is always 50/50. There is no *structural* constraint to discover. They will not learn that "laws constrain possibilities," only that "numbers get long."
  *   **Logistic Map ($4x(1-x)$):** Computationally prohibitive for a 90-minute pen-and-paper session.
  *   **Golden Mean Shift:** The constraint (no '11') is the "Law." It creates a non-uniform invariant measure. This allows students to discover that *knowledge of the law improves prediction even without knowledge of the state*.
      *   **Figures Check:**
          *   Transition Matrix $M = \begin{pmatrix} 1 & 1 \\ 1 & 0 \end{pmatrix}$.
          *   Max Eigenvalue $\lambda = \phi \approx 1.618$.
          *   Topological Entropy $h = \ln \phi \approx \mathbf{0.481}$ **nats**. (Your figure is correct).
          *   Stationary Frequency of 1s: The eigenvector is $(\phi, 1)$. Normalized, $P(1) = 1/\phi^2 \approx \mathbf{0.382}$. (Your figure is correct).

  **The Amplification Issue:** You are correct that the Shift Map discretizes error. In continuous chaos, an error of $\epsilon$ grows as $\epsilon e^{\lambda t}$. In the Shift, an error of 1 bit (not knowing $s_k$) results in total uncertainty at step $k$. This *is* sensitive dependence, just in the metric of symbol space ($d(x,y) = 2^{-N}$).
  *   **Correction:** Do not claim this models the *continuous* butterfly effect. Claim it models the **logical structure** of prediction limits. The "amplification" is that 1 bit of missing information at $t=0$ renders the prediction at $t=k$ statistically independent of the initial data.

  ### 2. The Scoring Scheme

  You need a **Proper Scoring Rule** to prevent hedging (always predicting the mode) and to reward calibrated uncertainty. The **Brier Score** is the most robust for pen-and-paper.

  **Scheme:**
  *   **Forecast:** For each step $t$, assign a probability $p_t \in [0, 1]$ that the digit will be '1'.
  *   **Outcome:** $o_t \in \{0, 1\}$.
  *   **Score per step:** $S_t = 1 - (p_t - o_t)^2$.
      *   If you predict $p=1.0$ (certainty) and are right ($o=1$): Score = 1.0.
      *   If you predict $p=1.0$ and are wrong ($o=0$): Score = 0.0. (Penalizes overconfidence).
      *   If you predict $p=0.38$ (stationary) and $o=0$: Score = $1 - (0.38)^2 \approx 0.85$.
      *   If you predict $p=0.38$ and $o=1$: Score = $1 - (0.62)^2 \approx 0.61$.
  *   **Total Score:** Sum of $S_t$ over the forecast horizon.

  **Why this works:**
  1.  **Prevents Hedging:** A student cannot simply write $p=0.5$ everywhere. If they know the last digit was '1', they *must* write $p=0$ for the next to maximize score.
  2.  **Separates Pointwise/Distributional:**
      *   *Pointwise:* They must commit to a specific $p$ for specific steps.
      *   *Distributional:* In the final round (no data), their average $p$ across steps should converge to 0.382. You can grade a "Calibration Bonus" if their mean forecast is within $\pm 0.05$ of the true frequency.

  ### 3. Round Arithmetic

  You want them to feel the **Horizon of Predictability**.
  *   **Seed Length:** 25 digits (fits on a card, enough for 3 rounds).
  *   **Currency:** "Prediction Points" (PP). Start each team with 10 PP.
  *   **Cost:** 1 PP to reveal the next digit of the seed.
  *   **Payoff:** Max 1 PP per correct forecast step (via Brier score).

  **Round Structure:**
  *   **Round 1 (The Deterministic Illusion):**
      *   **Revealed:** Digits 1–5.
      *   **Forecast:** Digits 1–5.
      *   **Task:** Copy the revealed digits to the forecast sheet.
      *   **Lesson:** Perfect prediction is possible with perfect data. (Scores should be 5.0/5.0).
  *   **Round 2 (The Cost of Precision):**
      *   **Revealed:** Digits 1–5 (from before).
      *   **Forecast:** Digits 6–10.
      *   **Market:** They may buy Digit 6 for 2 PP, Digit 7 for 2 PP, etc.
      *   **Constraint:** They *must* submit forecasts for 6–10.
      *   **Lesson:** Buying Digit 6 guarantees points on Step 6, but costs points. Buying Digit 6 also constrains Step 7 (if D6=1, D7 must be 0). They must calculate if the cost of buying is worth the score gain vs. using the constraint.
  *   **Round 3 (The Entropy Wall):**
      *   **Revealed:** Digits 1–5 only.
      *   **Forecast:** Digits 11–15.
      *   **Market:** Buying is **forbidden**.
      *   **Task:** Forecast using only the Law (no '11') and the last known digit (D5).
      *   **Lesson:** Even with the Law, uncertainty returns. If D5=0, D11 is effectively random (constrained). Their scores will drop to $\approx 0.7$ per step (reflecting the entropy).

  **The Gap:** In Round 1, Score = 100%. In Round 3, Score $\approx 70\%$. The "gap" is the 30% loss due to finite access to the state, despite the system being deterministic.

  ### 4. Seed Generation (Fairness)

  Flipping a coin and rejecting '11' creates a bias (too many 0s). You need the **Parry Measure** (measure of maximal entropy).
  *   **Transition Probabilities:**
      *   If current is '0': Next is '0' with prob $1/\phi \approx 0.618$, '1' with prob $0.382$.
      *   If current is '1': Next is '0' with prob $1.0$.
  *   **Classroom Procedure:**
      1.  Project a live random number generator (e.g., `random.org`) set to integers 1–100.
      2.  Start with '0'.
      3.  **Rule:** If current is '1', write '0'. If current is '0', roll the RNG. If $\le 61$, write '0'; if $\ge 62$, write '1'.
      4.  Do this live for the first 5 digits so they see the "Law" generating the "Future."
      5.  Generate the remaining 20 digits beforehand (using the same algorithm) and seal them in the envelope.
      *   *Why:* This proves the seed isn't "chosen" by you to make them fail, but generated by the public stochastic process consistent with the constraint.

  ### 5. One-sided vs. Two-sided Shift

  **Decision:** Use the **One-sided Shift** ($\Sigma^+$).
  *   **Justification:** You want to teach Determinism without Reversibility.
  *   In the One-sided shift, the map is $\sigma(s_0, s_1, s_2...) = (s_1, s_2...)$. The digit $s_0$ is lost forever.
  *   **Debrief Point:** "Could you reconstruct the first digit from the rest?" No. If you see the sequence start with '0...', the previous digit could have been '0' or '1'.
  *   **Pedagogical Value:** This kills the intuition that "Determinism implies the past is recoverable." It isolates **Predictability** (future from present) from **Retrodictability** (past from present). Both can fail even if the laws are deterministic.

  ### 6. The Debrief: Mapping Play to Concepts

  **Specific Mappings:**
  1.  **The Envelope:** **Ontological Determinism.** The future existed at $t=0$. It did not change when you opened it.
  2.  **The Score Drop (Round 1 vs 3):** **Predictability Limit.** The law didn't change, your access to the state did.
  3.  **The Constraint ('no 11'):** **Laws of Nature.** They restrict *possibility space* (modality) but do not fix *actuality* (unless the state forces it).
  4.  **Buying Digits:** **Measurement Precision.** You traded resources to reduce state uncertainty.
  5.  **Round 3 Failure:** **Sensitive Dependence.** Not knowing digit 10 makes digit 15 unpredictable.
  6.  **Shadowing Lemma:** "Every string you wrote down was *admissible*." If a team wrote a valid string that didn't match the envelope, they weren't "violating physics." They identified a *possible* world. They were just in the wrong one.

  **Predictable Failures & Fixes:**
  *   **"It's just random."**
      *   *Fix:* Open the envelope. Show the fixed string. "Randomness implies no fixed future. This had a fixed future. Your inability to know it is epistemic, not ontic."
  *   **"The Demon Objection" (Laplace's Demon holds the envelope).**
      *   *Fix:* Concede it. "Yes. A being outside the system with infinite precision predicts perfectly. But you are *inside* the system with finite resources. Science is what agents inside the system can do."
  *   **"I guessed all 0s and did okay."**
      *   *Fix:* Point to the Brier Score. "You scored 0.85 on average. But if you had used the constraint (knowing D5=1 $\to$ D6=0), you could have scored 1.0. The Law offers predictive power you left on the table."
  *   **Arithmetic Slips:**
      *   *Fix:* Provide a pre-printed scorecard with the Brier formula pre-calculated for common probabilities (0, 0.38, 0.5, 1.0).
  *   **Demoralization:**
      *   *Fix:* Frame the score drop as a *success*. "If you had scored 100% in Round 3, I would have failed. The fact that you couldn't predict proves the theorem."

  ### 7. Limitations: The Honest Framing

  You suspected the "amplification" worry was the weak point. You are right.
  *   **What the activity cannot reproduce:** **Continuous Error Growth.** In this game, uncertainty is binary. You either know the bit or you don't. In physical chaos (fluid dynamics, orbits), you know the state *approximately*, and the error *grows* over time. Here, the error is immediate (the bit is either revealed or not).
  *   **The Honest Framing Sentence:**
      > "This simulation demonstrates that **finite precision implies a finite horizon**, which is the operational definition of chaos. However, in physical systems, small errors *grow* continuously over time; here, we have discretized that growth into 'known' versus 'unknown' bits. The lesson is not about the physics of amplification, but the **logic of access**: Determinism does not guarantee prediction when access to the state is costly."

  ### Summary Checklist for Preparation
  1.  **Print Cards:** 14 teams (pairs), 1 seed per team (generated via Parry measure algorithm).
  2.  **Print Score Sheets:** Columns for Step, Forecast ($p$), Outcome, Brier Score. Include a lookup table for Brier calculations.
  3.  **Prepare Envelope:** Seal the full 25-digit string. Write "DO NOT OPEN UNTIL ROUND 3 ENDS" on the outside.
  4.  **Projector:** Live RNG for the first 5 digits generation.
  5.  **Handout:** Rules of the Shift (No '11'), Scoring Rule, Transition Probabilities ($0 \to 0: 62\%$, $0 \to 1: 38\%$, $1 \to 0: 100\%$).

  This plan respects the students' intelligence, avoids "math fog," and forces the philosophical distinction to emerge from their own failed predictions. Good luck.
