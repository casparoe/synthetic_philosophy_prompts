answer: |-
  Dear Friend,

  I must tell you straight away that while your intuition is remarkably sharp and cuts to the heart of a genuine philosophical dilemma, the manoeuvre you propose is ultimately a cheat. It is a seductive one, born of a clear-sighted desire to protect individual liberty from the encroachments of meddlesome neighbours, but it solves the logical puzzle only by changing the rules of the game rather than resolving the conflict of values. You suggest that we should discard any preference about another person's choice that would vanish if that choice were made in secret and left no trace. This test aims to filter out preferences that are merely about interference or noise, preserving only those grounded in something deeper. However, this distinction is far too fragile to bear the weight you place upon it, because it relies on a definition of a trace that is either too narrow to capture moral reality or too broad to solve your paradox. By attempting to purify the data of preferences to make the mathematics of rights work, you bypass the harder work of defining what rights are for, and in doing so, you offer a solution that is logically convenient but morally arbitrary.

  You should know that you have independently rediscovered one of the most famous problems in modern social choice theory, known as the Liberal Paradox, formulated by the economist and philosopher Amartya Sen in 1970. Your piano case is a variation of his own example involving a Prude and a Lewd person deciding who should read a copy of Lady Chatterley's Lover. Sen demonstrated mathematically that it is impossible to satisfy two seemingly innocent conditions simultaneously: that individuals should have liberty over certain personal choices, and that if everyone prefers one outcome to another, society should respect that consensus. In your scenario, respecting your liberty to play and your neighbour's liberty to abstain leads to an outcome where you play, even though both of you would prefer he played instead. Sen's conclusion was not that we should filter preferences, but that we must accept that no social decision rule can perfectly satisfy both absolute liberty and Pareto efficiency. Your version departs from his by attempting to save the principle of liberty by restricting the domain of admissible preferences, whereas Sen showed the conflict lies in the structure of the rights themselves. You are trying to heal the contradiction by pruning the desires that reveal it, which is where the charge of cheating arises.

  The core of your proposal is the test of the secret trace. You argue that if I prefer you not to play the piano, but I would not care if you played silently where I could not hear it, then my preference is merely about the noise, not your liberty, and should not count against your right to play. This feels correct in the piano case, but it becomes unstable when we examine what counts as a detectable trace. In the case of your brother's promise, you rightly note that you would prefer he kept it even if you never knew he had broken it. Under your test, this preference counts because it survives the secrecy condition. However, consider a preference about justice or integrity that has no physical trace at all. If I prefer that a stranger does not commit a crime in a distant country where I will never travel and never hear of it, does that preference count? There is no detectable trace for me, yet many would argue I have a moral stake in the state of the world beyond my sensory perception. If your test excludes this, it reduces morality to mere sensory impact. If it includes it, because the crime itself is a trace in the universe, then the test becomes meaningless, for every action leaves some trace somewhere. You are forced to draw a line between relevant and irrelevant traces, and that line cannot be drawn without already deciding which rights matter, which is the very question you set out to answer.

  Furthermore, there is a deeper reason why this manoeuvre fails, which touches on the nature of rights themselves. You treat rights as inputs into a collective calculation, suggesting that if we clean up the preferences, the rights will stand unharmed. But rights are not merely weights in a balancing scale; they are boundaries that protect actions from being weighed at all. The problem in your piano case is not that your neighbour has a meddlesome preference; it is that the situation forces a collision where one person's exercise of liberty inevitably diminishes the other's welfare. By saying his preference doesn't count because it is about your noise, you are effectively saying his welfare loss doesn't count. But if we start excluding welfare losses because they stem from another's legitimate choice, we are no longer doing social choice; we are simply asserting that rights trump all consequences. If rights trump all consequences, we do not need your test. If consequences matter, then your neighbour's misery matters, regardless of whether his preference is meddlesome. Your test tries to have it both ways: it wants to aggregate preferences to find the best outcome, but it wants to exclude the preferences that make the outcome difficult. This is why it feels like a cheat; it rigs the tally to ensure the liberal result wins without acknowledging the cost.

  You asked specifically about the objection regarding your brother's promise, fearing your test would discard it. As I noted, your test might technically save that preference, but only by relying on an ambiguous notion of a trace. If the trace is physical detectability, the promise preference passes. But if the trace is any causal impact on the world, then the piano noise is also just a causal impact, and the distinction blurs. The real issue is that you are trying to distinguish between self-regarding and other-regarding preferences, a distinction John Stuart Mill struggled with in On Liberty. Mill argued that society should only interfere with conduct that harms others. Your test is an attempt to operationalize Mill's harm principle. But Mill's principle is a moral claim, not a logical filter. It asserts that certain preferences ought not to be satisfied by coercion, not that they do not exist or should not count in a reckoning of welfare. By trying to make them vanish from the reckoning entirely, you obscure the real trade-off. We often have to accept that respecting a right will lead to a Pareto-inferior outcome, where everyone could be happier if someone's right were waived. That is the price of liberty, and no amount of preference filtering can wish it away without undermining the concept of rights as protections against the collective will.

  In the end, your insight is valuable because it correctly identifies that not all preferences should have equal weight in a free society. We do intuitively feel that a neighbour's desire to control your piano playing is less legitimate than your desire to play. But legitimising that intuition requires a theory of rights that defines spheres of authority, not a theory of preferences that defines spheres of invisibility. Your test asks us to imagine a world where actions leave no trace, but we live in a world where actions resonate. The conflict you describe is real, and it is painful precisely because both parties are reasonable. To resolve it by declaring one party's feelings irrelevant because they depend on the other's action is to misunderstand that human welfare is interdependent. So, while you have walked a path that many rigorous thinkers have trodden, and your specific formulation is your own, the manoeuvre remains a cheat. It solves the paradox by defining away the conflict rather than enduring the tension that liberty inevitably creates. We must accept that rights sometimes protect us from the very preferences that would make us all happier, and that is not a logical error to be fixed, but a moral feature to be endured.
