answer: |-
  Here is the brainstorming process, followed by the committed argument.

  ### Brainstorming Candidate Principles

  I need to find a thread that ties together your 14 intuitions. They pull in three different directions: physical shape, historical intention, and systemic function.

  *   **Candidate 1: The Family Resemblance Principle.** An 'a' is anything that shares enough visual features with a prototype 'a'.
      *   *Verdict:* Fails immediately. It explains Case 1 (two-story vs. single-story) and Case 9 (distortion). But it crashes into Case 3 vs. 4. The Cyrillic 'а' and the Invented Water Symbol share *all* visual features with your 'a', yet you assign them different identities. Visual similarity is necessary but not sufficient.
  *   **Candidate 2: The Causal-Historical Principle.** An 'a' is a mark produced by a chain of copying going back to an original 'a'.
      *   *Verdict:* Strong on Case 4 (Invented Symbol has no lineage, so not 'a') and Case 11 (Greek Alpha has a different lineage). But it struggles with Case 14 (Erosion). The stonecutter's intention is gone; the physical chain is broken by weather. It also struggles with Case 6 (Mirrored Word). The causal history of a mirrored word is "someone flipped an image," not "someone wrote an 'a'." Yet you say it *is* an 'a'.
  *   **Candidate 3: The Functional-Systemic Principle.** An 'a' is a mark that performs the 'a' function within a specific code.
      *   *Verdict:* This is the strongest contender. It handles Case 3 (Cyrillic functions as 'a' in English text) and Case 8 (Context decides). But "function" is vague. Does a mirrored 'a' function as 'a'? Only if the system allows mirroring. This suggests the principle needs to be about *licensing* within a specific interpretive frame.

  **Decision:** I am committing to a refined version of Candidate 3. It must account for the fact that perception is the *gateway*, but the system is the *judge*.

  ***

  ### The Principle: Normative Legibility

  Here is the precise formulation:

  > **A mark is an instance of the letter 'a' if and only if it is *legible* as 'a' to a competent user *without violating the normative constraints* of the active orthographic system.**

  Let's break that down.
  1.  **Legibility:** The mark must afford recognition. It cannot be random noise. It must trigger the perceptual machinery of reading.
  2.  **Competent User:** The judgment relies on a reader who knows the rules of the game (English orthography, handwriting conventions, etc.).
  3.  **Normative Constraints:** The system has rules about what counts. Some transformations are allowed (tilting, styling); some are forbidden (mirroring, unless the whole system is mirrored).
  4.  **Active Orthographic System:** The context determines the rules. In a Russian text, the shape 'а' is Alpha. In an English text, it is 'a'. In a mirrored reflection, the rules of orientation are inverted.

  ### Mapping the Principle to Your Cases

  Here is how **Normative Legibility** processes your data, and where it forces you to pay a price.

  **The Easy Wins (System & Context)**
  *   **Cases 3 & 4 (Cyrillic vs. Invented):** The shape is identical, but the *Active System* differs. In Case 3, the system is English typing; the norm allows typos that preserve legibility. The mark is licensed as 'a'. In Case 4, the system is "New Symbolism"; the norm assigns that shape to "Water." The mark is licensed as Water. **Verdict: Saved.**
  *   **Case 11 (Greek Alpha):** The system is Greek. The norm dictates this shape is Alpha. Even if it looks like Latin 'a', the normative constraint of the Greek system overrides the visual similarity. **Verdict: Saved.**
  *   **Cases 7 & 8 (Logo/Context):** The *Active System* is the word. The norm of reading is "context resolves ambiguity." If the surrounding letters license the interpretation of this ambiguous shape as 'a', then it is 'a'. **Verdict: Saved.**

  **The Hard Wins (Perception & Transformation)**
  *   **Cases 1 & 9 (Style & Distortion):** The *Normative Constraints* of handwriting and typography allow for significant variance (single vs. two-story, neon vs. ink). As long as the *Legibility* condition is met (a competent user can retrieve it), the identity holds. The "8 degrees vs. 90 degrees" threshold in Case 9 is simply the point where Legibility fails. **Verdict: Saved.**
  *   **Case 14 (Erosion):** This relies on *Counterfactual Legibility*. The norm of reading damaged text (paleography) allows a user to reconstruct the original form. If a competent user can recover the 'a' without invoking a different system, it remains an 'a'. **Verdict: Saved.**

  **The Costs (Where the Principle Bites)**
  *   **Cases 5 & 6 (Mirroring):** This is the crux.
      *   In Case 5 (Isolated Mirrored), the Active System is "Standard English." The Normative Constraints of Standard English forbid left-right inversion. Therefore, it is *not* licensed. It is a defect. You called it a "defective a at best." My principle says: **It is not an 'a'.** It is a picture of an 'a', or a broken 'a'. To save your intuition that it is "at best" an 'a', we must accept that "defective 'a'" is a category error. It's a mark that *failed* to be an 'a'.
      *   In Case 6 (Mirrored Word), the Active System shifts to "Reflected English." In this temporary system, the Normative Constraints are inverted. A mirrored glyph is now the *canonical* form. Therefore, it is licensed. **Verdict: Saved, but Case 5 is demoted.**
  *   **Case 12 (Mid-Stroke):** You say at the mid-stroke moment, it is "neither." My principle agrees. Until the mark is complete enough to be *Legible* under the *Norms*, it is not yet an 'a'. It is a potential 'a'. The "making" matters only insofar as it produces a legible result. **Verdict: Saved.**
  *   **Case 13 (Scrawl):** If only the author can read it, is there a "Competent User"? Yes, the author is a user of their own idiolect. If they can read it a year later, Legibility is sustained. If they cannot, it fails. **Verdict: Saved.**

  **The Sacrifice:**
  To keep this principle clean, you must give up the idea that a mirrored, isolated glyph (Case 5) is *any kind* of 'a'. It is a shape that *references* an 'a', but within the norms of the system, it has no standing. It is like a chess piece carved in the shape of a knight but painted the wrong color for the board you are playing on. It's not a knight *in play*.

  ### Two Stress-Test Cases

  Let's run **Normative Legibility** on two cases you didn't list, designed to break the "System" vs. "Mark" tension.

  **Stress Test 1: The "Tofu" Box**
  You are reading a text message. The font doesn't support a specific character, so your phone displays a generic empty square box (☐). The underlying digital code is definitely an 'a' (ASCII 97). You know it's supposed to be an 'a'.
  *   *Analysis:* The *Mark* is a square. The *Legibility* as 'a' is zero (visually). However, the *Active System* includes the digital encoding layer. The norm of digital communication is that the code underwrites the display.
  *   *Verdict:* It is an 'a', but a **broken token**. The Principle holds because the "Competent User" accesses the system rules (encoding) to override the perceptual failure. If you didn't know it was code, it would just be a box.

  **Stress Test 2: The Alien Decipherment**
  An alien species with no knowledge of Earth finds a sign saying "GAS". They analyze the shapes. They determine the middle symbol is a "closed loop with a tail." They map it to their own symbol for "Danger." They treat it as a warning.
  *   *Analysis:* Is the middle mark an 'a'?
  *   *Verdict:* **No.** It is not legible as 'a' to the user, and they are not operating within the English Orthographic System. They have created a *new* system where that shape means "Danger." The 'a'-ness is not in the stone; it is in the lost practice that put it there. Without a community to sustain the norm, the mark reverts to mere shape.

  ### The Ontology: Where is the 'a'?

  You asked: Is 'a'-ness in the mark, the making, or the system?

  **I pick: The System (specifically, the Community of Practice).**

  The mark is too unstable (Case 1, 9, 14). The making is too private (Case 12, 13). The System is the only thing that stabilizes the identity across time and variation. An 'a' is a **status** conferred upon a mark by a community of readers and writers who agree to treat it as such.

  **What would change my mind?**
  I would abandon the "System" view only if we discovered a **biological universal**. If it turned out that every human brain, regardless of culture or training, spontaneously categorized that specific shape as "Category A" due to hardwired visual cortex processing (like face recognition), then 'a'-ness would be in the *Perceiver*, not the System.

  But we know that isn't true. A child raised without exposure to Latin script does not see an 'a'; they see a shape. Therefore, the 'a' is not in the eye, nor in the ink. It is in the agreement between us that this ink, in this context, *counts* as that sound, that concept, that letter.

  **Final Summary:**
  Your intuition that "Case 5 is defective" is the key. You already sense that system norms matter more than shape. My principle just makes that explicit. The cost is admitting that without a system to license it, a shape is never a letter. It is just a drawing waiting for a reader to give it a job.
