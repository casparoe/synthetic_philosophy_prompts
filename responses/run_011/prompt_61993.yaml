          *   *Verdict:* The setup is viable. It's not incoherent, but it requires careful handling of Nadja's position. She shouldn't say interventionism *denies* the claim, but that it requires restating it (e.g., as a general principle), whereas she *wants* the token claim. Ruairi should point out that her attribution study (type-level) doesn't prove the token death without a bridge principle that looks suspiciously like counterfactuals.
