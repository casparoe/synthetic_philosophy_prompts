          *   *The Conflict:* The 1991 privatisation claim.
          *   *Nadja's Problem:* Interventionism struggles with token-level causation of singular past events where no intervention is possible *now*. Interventionists usually handle this via "type-level" causation applied to tokens, or by defining interventions relative to the *time of the event* (could *someone* have intervened in 1991?). If Nadja says "no intervention is possible even in principle" because it's a settled past fact, she undermines her own ability to claim *any* past causation (including the heatwave attribution). Attribution studies are about *types* of events (heatwaves), not tokens (this specific death).
