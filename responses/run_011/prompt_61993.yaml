answer: |-
  Ruairi tapped the printout. The graph showed two curves diverging. One real, one imagined.

  "You say this proves the heatwave was caused by us," he said. "By the forcing."

  "I say it proves the forcing made the heatwave vastly more likely," Nadja said. "We ran the model with the forcing, then without. The difference is the causal contribution."

  "Without the forcing," Ruairi said. "You intervened on the model. Not the atmosphere. You changed a parameter in a simulation."

  "The simulation mirrors the physics. If the model is valid, the intervention on the parameter maps to an intervention on the world's physics."

  "Maps to," Ruairi said. "Which is to say, you are relying on a counterfactual. If the forcing had been absent, the heatwave would not have occurred. Or would have been less likely. You are not manipulating the sun, Nadja. You are manipulating a story about the sun."

  "It's not a story. It's invariant relationships. If I change the input, the output changes reliably. That's what cause is."

  "Is it?" Ruairi leaned back. "Then tell me about 1991. The privatisation. You want to say that caused your father's death. Because the shelter stayed closed."

  "Yes."

  "Show me the intervention."

  Nadja looked at the paper. "There isn't one."

  "Exactly. You cannot set the variable 'privatisation' to 'false' now. You cannot even set it in a model, because the model doesn't contain the political history. It contains thermodynamics."

  "I can construct a narrative model. If services remained public, protocols would have mandated opening shelters."

  "And if services remained public, the budget deficit would have been handled differently, perhaps leading to cuts elsewhere, perhaps no heatwave mitigation funding at all," Ruairi said. "To evaluate your claim, I have to hold fixed the heatwave, the budget, the administration, and vary only the ownership status. My theory says I do this by looking for the closest possible world where ownership is public. Your theory says you need an intervention. Where is the hand that turns the knob?"

  "The hand doesn't matter. The structure matters."

  "But you just said where no intervention is possible, the claim isn't causal."

  "I said where no intervention is possible *on a system*."

  "Is history not a system?"

  "History is singular. You can't rerun it."

  "You can't rerun the climate either. You rerun the equations." Ruairi leaned forward. "Here is the trouble. You want the comfort of the model for the heatwave, but the comfort of the narrative for the shelter. In the heatwave study, you accept a probabilistic claim about a type of event to ground a specific outcome. In the shelter claim, you want a specific outcome without a manipulable variable."

  "The attribution study gives a probability of causation for the event," Nadja said. "It says the risk increased by a factor of ten. That supports the token claim."

  "Only if you assume the token belongs to the type without remainder. But your father didn't die of 'heatwave'. He died of heart failure in a room without air conditioning. The link between the privatisation and the heart failure is a chain of human decisions. Can you intervene on a decision?"

  "If I can specify the conditions under which the decision changes, yes."

  "Can you? Or does specifying the conditions already assume you know what causes the decision?" Ruairi paused. "You accuse my similarity ordering of vagueness. If I say 'closest world where services are public', you say that's fuzzy. But you say 'intervention on privatisation'. To define that intervention, you must specify what else stays fixed. Does the economy stay fixed? The election results? If you fix too much, the intervention is impossible. If you fix too little, you aren't testing privatisation, you're testing a miracle."

  Nadja traced the curve on the paper. "An intervention requires breaking the causal arrows coming into the variable. I set privatisation by hand, ignoring its causes."

  "Who sets it? You? God?"

  "An ideal agent."

  "An ideal agent is a metaphor," Ruairi said. "You are smuggling counterfactuals in through the back door. You say 'if an agent set this'. That is a counterfactual. You are using my language while claiming it's yours."

  "I'm using it to demand testability. Your similarity ordering allows anything. I could say 'if gravity had been weaker, he would have lived'. That's a counterfactual. It's true in some similarity ordering. But it's not causal because I can't intervene on gravity."

  "You can't intervene on 1991 either."

  "But I could have then."

  "Could you? Or is that just another counterfactual? 'If you had been there, you could have voted differently.' You are grounding causation in human capacity. What if there were no humans? Would the asteroid still cause the extinction?"

  "Yes. Because a hypothetical agent could have diverted it."

  "So causation depends on the existence of hypothetical agents?" Ruairi shook his head. "That makes causation anthropocentric. It makes the universe's structure depend on our ability to manipulate it."

  "It makes causal claims about our ability to manipulate it. It keeps us honest."

  "It keeps us silent about the past." Ruairi pointed at the paper. "This study. It says the heatwave was made likely. It does not say this heatwave was caused. You cannot assign a probability to a single event's cause without a counterfactual framework that handles tokens. Your interventionism gives you type-level frequencies. It tells you shelters save lives. It does not tell you this shelter would have saved him."

  "It tells me the risk was manageable."

  "Risk is not cause. You are conflating responsibility with mechanism. You want to say the state killed him. That is a moral claim. You are dressing it in physics."

  "I'm dressing it in reality," Nadja said. "Your theory lets me say 'if the wind had blown left, he would have lived'. That's true. But it's not useful. It doesn't tell me what to change. Causation is about what we can change."

  "Then admit it," Ruairi said. "Admit that when you say 'privatisation caused his death', you are not making a metaphysical claim about the world. You are making a methodological claim about where to direct anger."

  "I'm saying the world works such that changing that variable changes the outcome."

  "But you cannot change that variable. So the claim is empty."

  "It's not empty. It's a constraint on future models. If we build a society again, we know this variable matters."

  "So it's a claim about the future disguised as a claim about the past." Ruairi sat back. "And my theory? You say it's vague. But it captures what you actually mean. You mean that in the world as it is, his death depends on that decision. You don't care if you can rewind time. You care that the dependence is there."

  "Dependence without manipulability is just correlation," Nadja said.

  "Is it? Or is manipulability just how we find dependence?" Ruairi looked at her. "You think your model intervention is real because you pressed a key. But the key press didn't change the climate. It changed your knowledge. You are trusting the counterfactual logic of the simulation to tell you about the world. You are using my tool."

  "I'm using a tool that requires defined inputs."

  "And I'm telling you the input '1991' is defined. The vagueness isn't in the variable. It's in your refusal to accept that some causes are structural, not levers."

  Nadja folded the paper. "If I accept that, I accept that causation is just story-telling. Any story that fits."

  "And if you don't," Ruairi said, "you accept that half of history is causally inert because no one can go back and pull the lever."

  They sat in the silence. The kitchen was dark save for the lamp over the table.

  "It's not about history," Nadja said finally. "It's about truth conditions. You say the claim is true if the counterfactual holds. I say it's true only if the intervention relation holds."

  "Then we disagree on what truth is," Ruairi said. "You think truth requires a procedure. I think truth requires a fact."

  "I think truth requires verification."

  "Then you are not a realist," Ruairi said. "You are an instrumentalist. You don't believe the cause exists. You believe the model works."

  Nadja looked at him. "I believe that if I can't check it, I can't claim it."

  "And I believe that if it happened, it's checkable in principle, even if not by your hands." Ruairi touched the paper. "You want to blame the privatisation. I understand that. But don't call it science if you won't accept the metaphysics that makes science possible."

  "Don't call it metaphysics if it ignores what science requires," Nadja said.

  They stopped. The disagreement was not about the father, or the heat, or the paper. It was about whether the world contains connections that we cannot touch.

  ***

  **Note**

  Ruairi comes out slightly better, primarily because Nadja's strict interventionism collapses under the weight of past singular events. She conflates "intervention now" with "causal structure," allowing Ruairi to paint her as an instrumentalist who denies reality to unmanipulable facts. A serious proponent of interventionism (e.g., Woodward) would argue that interventions need only be *conceptually* possible at the *time of the event*, not now. Nadja should have argued that the 1991 variable *was* manipulable then, making the causal claim valid type-level knowledge applied to a token. By conceding the variable is "settled," she weakens her position.

  Ruairi's counterfactualism is also compressed; the "similarity ordering" problem is deeper than vagueness—it's about which similarities matter. I omitted this to keep the dialogue moving. Nadja risks sounding like a positivist ("truth requires verification"), which few scientists explicitly claim. However, this serves the dramatic need to contrast her "methodological" view against his "metaphysical" one. The ending lands on the realism/instrumentalism divide, which is the correct underlying philosophical fault line.
