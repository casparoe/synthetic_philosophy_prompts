      *   *Ruairi:* Needs to argue that the model intervention is *also* a counterfactual simulation, not a real intervention. If she trusts the model to tell her about the heatwave, she must trust counterfactual reasoning. If she trusts counterfactual reasoning, why not for the shelter?
      *   *The Twist/Discovery:* They realize the disagreement isn't about method, but about whether causation requires an *agent* (even a hypothetical one).

