prompt: |-
  Subsidiarity, as the European Union actually institutionalises it, strikes me as a philosophically peculiar object, and I want to know what it has to assume in order to work. Let me set out the arrangements concretely so that we are reasoning about the same thing rather than about the slogan.

  **The EU mechanism.** Subsidiarity operates only where Union competence is not exclusive. The test asks whether the objectives of a proposed act cannot be sufficiently attained by the member states acting at central, regional or local level, and can therefore, by reason of the scale or effects of the proposed action, be better attained at Union level. Proportionality sits beside it and asks only whether the act goes beyond what is necessary to reach the treaty's objectives.

  Compliance is policed in two distinct ways. Politically: within eight weeks of a draft's transmission, any national parliament or chamber may send a reasoned opinion objecting on subsidiarity grounds; each of the twenty-seven parliaments holds two votes, one per chamber where there are two; if reasoned opinions reach one third of the votes — one quarter for drafts in the area of justice, freedom and security — the Commission must review the draft and may maintain, amend or withdraw it, stating its reasons (the yellow card). A majority of the votes triggers the orange card, under which, if the Commission maintains the draft, a simple majority of the members of the European Parliament or fifty-five per cent of Council members can stop it. Judicially: the Court of Justice has jurisdiction, reviews with marked deference, and in practice has essentially never annulled an act for breach of subsidiarity alone.

  The yellow card has been triggered three times: in 2012 on a proposal concerning the exercise of the right to take collective action, in 2013 on a proposal to establish a European Public Prosecutor's Office, and in 2016 on a proposal to revise the directive on posted workers. In the second and third cases the Commission reviewed and maintained the draft, concluding that it complied with subsidiarity. In the first it likewise found no breach of subsidiarity, and withdrew the draft on the stated ground that it was unlikely to gather the political support needed for adoption. The orange card has never been used.

  **Three comparators.** Germany has its own necessity clause: for a large block of concurrent legislative subjects the federation may legislate only if and to the extent that establishing equivalent living conditions across the federal territory, or maintaining legal or economic unity in the interest of the state as a whole, makes federal regulation necessary — a condition the constitutional court polices seriously, while a separate provision permits the Länder to enact deviating rules in specified fields (nature conservation and landscape management, land distribution, spatial planning, water resources, university admission and degrees, property tax). Switzerland makes subsidiarity a general principle governing the allocation and performance of state tasks, commits the federation to assuming only what the cantons cannot discharge, treats the cantons as residual sovereigns, and gives citizens the power to demand a referendum on federal statutes. The United States has no subsidiarity test whatever: enumerated powers, a Tenth Amendment, a presumption against preemption, and a Supreme Court that since the 1980s has held that state sovereignty is protected chiefly by the structure of the federal government rather than by judicial review of the substance of federal statutes — while still policing one narrow point, that Congress may not commandeer state legislatures or executives.

  With that in view:

  1. Reconstruct the theory of legitimacy the EU mechanism presupposes. In particular, is "better attained" one notion or three — productive efficiency, the epistemic quality of the decision taken at the relevant scale, and the proximity of the decision-maker to those bound by it? Which of these could the yellow-card procedure possibly track, given what it asks national parliaments to do and what it rewards them for doing?

  2. Take up the objective-setting problem: the test compares attainment of an objective, but the objective is characterised by the institution proposing to act, and framing an objective as the removal of divergences between national rules makes central action look necessary almost by construction. What does a review procedure that takes the objective as given presuppose about who is entitled to define the question? Is that a flaw in the principle or an unavoidable feature of any competence-allocation rule?

  3. Explain the mismatch of addressee. The mechanism empowers national parliaments, not subnational ones, although in federal member states it is the subnational tier whose room for action Union legislation narrows. What conception of the citizen, and of which polity the citizen belongs to, does that allocation of the objection right presuppose?

  4. Diagnose the 2012 withdrawal. If the Commission can deny the alleged breach and withdraw anyway for want of political support, is the mechanism a truth-tracking test of a normative principle or a signalling device for measuring salience? Can a practice be what it claims to be while operating as something else?

  5. Set the three comparators against the EU. What does the German criterion of equivalent living conditions presuppose, and does it sit in tension with an experimentalist reading of subsidiarity on which diversity of rules across units is itself a good? What does the Swiss reliance on the referendum presuppose that the EU cannot borrow? And does the American refusal to have any necessity test presuppose a rival theory of legitimacy, or is it a refusal to have one — bearing in mind that the anti-commandeering doctrine protects the *form* of state authority without asking whether federal action was necessary?

  6. Distinguish carefully what these practices strictly presuppose from what they merely fit comfortably with, and identify where the design is philosophically underdetermined — where two incompatible theories of federal arrangement would license exactly the same institutional text.

  7. Finally, say what would have to change in practice, not only in doctrine, if the presupposed view were replaced by (a) a purely epistemic subsidiarity concerned with which level produces better decisions, (b) a subsidiarity grounded in the claim of a self-governing demos to decide its own affairs, or (c) an equality-based version of the German kind.

  Argue from the material described above; I know these mechanisms and do not need them recounted, and I am not looking for citations or a reading list. Where you think a step of my framing is mistaken, say so rather than accommodating it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The principle of subsidiarity as institutionalized in the European Union (EU).
      *   **Task:** Reconstruct the theory of legitimacy presupposed by the EU mechanism, answer seven specific questions/prompts based on the provided text and comparative analysis (Germany, Switzerland, US), and identify philosophical underdetermination and practical implications of alternative theories.
      *   **Constraints:** Argue from the material described; do not recount mechanisms (the user knows them); no citations/reading lists; challenge the framing if mistaken.
      *   **Tone:** Philosophical, analytical, precise, critical.

  2.  **Deconstruct the Seven Prompts:**

      *   **Q1: Theory of Legitimacy & "Better Attained".** Is "better attained" efficiency, epistemic quality, or proximity? What does the yellow card track?
      *   **Q2: Objective-Setting Problem.** Who defines the objective? Is framing objectives to ensure centralization a flaw or unavoidable?
      *   **Q3: Mismatch of Addressee.** National parliaments vs. Subnational entities. What conception of the citizen/polity does this imply?
      *   **Q4: 2012 Withdrawal Diagnosis.** Truth-tracking test vs. Signalling device for salience. Can it be both?
      *   **Q5: Comparators (Germany, Switzerland, US).** German "equivalent living conditions" vs. experimentalism. Swiss referendum presuppositions. US refusal of necessity test (legitimacy theory vs. refusal).
      *   **Q6: Presupposition vs. Fit & Underdetermination.** Distinguish strict requirements from comfortable fits. Where is the design philosophically underdetermined?
      *   **Q7: Practical Changes for Alternative Theories.** (a) Epistemic, (b) Demos-based self-government, (c) German-style equality.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the peculiarity. The EU subsidiarity is a procedural check on competence, not a substantive right of lower levels. It's a "brake," not a "steering wheel."

      *   **Q1: Legitimacy & "Better Attained".**
          *   *Analysis:* The text says "cannot be sufficiently attained... can therefore... be better attained." This implies a comparative efficiency test.
          *   *Efficiency vs. Epistemic vs. Proximity:* "Scale or effects" points to efficiency (externalities). "Sufficiently attained" points to capacity. It doesn't explicitly mention epistemic quality (local knowledge) or proximity (democratic connection) as primary drivers, though they are implicit in the *reasoning* of parliaments.
          *   *Yellow Card:* National parliaments are political bodies. They track political salience and sovereignty concerns, not technical efficiency. They reward *objection*, not optimization. So the mechanism tracks *political resistance to centralization* rather than objective "betterment."
          *   *Conclusion:* The theory is a hybrid: Output legitimacy (efficiency of scale) checked by Input legitimacy (national parliamentary veto potential). But the yellow card specifically tracks political salience/sovereignty anxiety, not technical subsidiarity compliance.

      *   **Q2: Objective-Setting.**
          *   *Analysis:* The Commission proposes the objective. If the objective is "harmonization," then national action is by definition insufficient.
          *   *Presupposition:* It presupposes the Commission (executive) has the prerogative to define the *ends*, while subsidiarity only governs the *means/scale*.
          *   *Flaw or Feature?* It's a feature of any functionalist federation. If lower levels could define the objective as "local variation," centralization would never happen. Therefore, the higher level *must* control the objective definition to exist. The flaw is pretending this isn't a power grab. The review procedure presupposes the Commission is a neutral arbiter of necessity, which it isn't; it's an agenda-setter.

      *   **Q3: Mismatch of Addressee.**
          *   *Analysis:* National parliaments object, not regions (Länder, Cantons, etc.).
          *   *Conception of Citizen:* The citizen belongs primarily to the *Member State*, not the Region or the Union. The Member State is the "master of the treaties."
          *   *Polity:* It presupposes a Union of *States*, not a Union of *Peoples/Regions*. It reinforces the Westphalian shell of the Member State against both the EU above and the Region below. It treats the Member State as a unitary black box for the purpose of EU competence, even if internally federal.

      *   **Q4: 2012 Withdrawal.**
          *   *Analysis:* Commission said "No breach" but withdrew due to "lack of support."
          *   *Diagnosis:* It reveals the mechanism is a *political thermometer*, not a *legal scale*. It measures the cost of proceeding, not the truth of the principle.
          *   *Can it be both?* Yes, but not honestly. If it claims to be a legal test (Court of Justice jurisdiction) but operates as a political veto, it creates a category error. It functions as a "compliance signal" where the signal is "this is politically dangerous," regardless of legal merit.

      *   **Q5: Comparators.**
          *   *Germany:* "Equivalent living conditions" presupposes a substantive goal of homogeneity. This clashes with experimentalism (diversity as a good). If the goal is unity, diversity is a failure. If the goal is learning, diversity is data. Germany chooses unity.
          *   *Switzerland:* Referendum presupposes a *demos* capable of direct decision-making and a political culture of consensus. The EU lacks a single demos and the linguistic/cultural cohesion for a pan-EU referendum. It relies on indirect representation.
          *   *US:* No necessity test. Presupposes legitimacy comes from *process* (enumerated powers, representation in Senate/House) and *structure* (state sovereignty protected by political process, not courts), plus the anti-commandeering rule (protecting state *integrity*). It's a refusal to judicialize political questions of necessity.

      *   **Q6: Presupposition vs. Fit & Underdetermination.**
          *   *Strict Presupposition:* The EU *must* presuppose that Member States are the primary democratic units (hence national parliaments police it). It *must* presuppose the Commission defines objectives (otherwise no Union action).
          *   *Comfortable Fit:* It fits with "efficiency," but doesn't require it. It fits with "protection of sovereignty," but doesn't guarantee it (orange card is hard to trigger).
          *   *Underdetermination:* The text allows for two theories: (1) *Federal Balance:* Protecting state sovereignty as a value in itself. (2) *Functional Efficiency:* Ensuring laws are made at the most effective level. The institutional text (the "scale or effects" test) works for both, but the political enforcement (national parliaments) favors the former while the legal enforcement (CJEU deference) favors the latter. The mechanism doesn't decide between "States' Rights" and "Good Governance."

      *   **Q7: Practical Changes for Alternative Theories.**
          *   *(a) Epistemic:* Need independent impact assessments, not parliamentary opinions. Regions need direct standing. Focus on data/outcomes, not votes.
          *   *(b) Demos/Self-Government:* Need a direct citizen trigger (EU-wide referendum or citizen initiative with teeth). Shift from "efficiency" to "right to rule."
          *   *(c) German Equality:* Need a substantive constitutional court review of "living conditions." Shift from procedural check to substantive mandate for homogeneity (or heterogeneity protection).

  4.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it sharp.
      *   *Check Constraints:* Did I recount the mechanisms? No. Did I cite sources? No. Did I challenge the framing? I should explicitly address the "three notions" in Q1 and the "flaw/feature" in Q2.
      *   *Refining Q1:* The prompt asks if "better attained" is one notion or three. I need to be decisive. It's primarily *effectiveness/efficiency* (scale/effects), but the *procedure* tracks *political sovereignty*.
      *   *Refining Q3:* The "mismatch" is key. The EU treats the Member State as the sovereign unit, ignoring internal federalism. This is a specific choice.
      *   *Refining Q6:* The distinction between "presuppose" and "fit" is crucial. The mechanism *presupposes* the Member State is the relevant counterweight. It *fits* with efficiency but doesn't *require* it.

  5.  **Final Polish:** Ensure the transition between points is logical. The argument should build a picture of the EU subsidiarity as a *political compromise masquerading as a legal principle*.

      *(Self-Correction during drafting)*: In Q4, the user asks if a practice can be what it claims while operating as something else. I should answer "Yes, but it degrades trust/legitimacy." It's a "noble lie" or a "useful fiction."
      In Q5, regarding the US: The prompt asks if it's a rival theory or a refusal. It's a refusal to judicialize, based on a theory that *political structure* protects liberty, not *judicial tests*.
      In Q7, ensure the changes are *practical*, not just doctrinal.

  6.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  The EU's institutionalisation of subsidiarity is indeed peculiar because it attempts to judicialise a political question while providing a political remedy that lacks legal teeth. It is a procedural brake on competence, not a substantive right of lower levels. Below is the reconstruction of its presuppositions and the analysis you requested.

  ### 1. The Theory of Legitimacy and "Better Attained"
  The phrase "better attained" in the Treaty is ostensibly unitary but functionally tripartite. It conflates **productive efficiency** (scale/effects), **epistemic quality** (sufficiency of local knowledge), and **democratic proximity** (who decides). However, the mechanism privileges only the first. The "scale or effects" criterion is a functionalist test: it asks if the problem spills over borders, not if the local decision is wiser or more legitimate.

  The yellow-card procedure cannot track epistemic quality or proximity. National parliaments are not auditing the technical capacity of regional governments, nor are they measuring the democratic distance between the citizen and the regulator. They are measuring **political salience**. When a national parliament issues a reasoned opinion, it is signalling that the *Member State's* sovereignty is being encroached upon, not that the *region's* capacity is being ignored. Therefore, the mechanism presupposes a theory of legitimacy based on **Member State consent**. It treats the Union as a derivative of the States, not a direct expression of the European peoples. The "better attained" test is the legal veneer; the legitimacy theory is the preservation of the Member State as the primary political container.

  ### 2. The Objective-Setting Problem
  You are correct that framing an objective as the removal of divergences makes central action necessary by construction. If the objective is "a single market for X," national action is definitionally insufficient. A review procedure that takes the objective as given presupposes that the **agenda-setting power belongs exclusively to the Union executive** (the Commission).

  This is not a flaw in the principle but an unavoidable feature of any competence-allocation rule in a federation. If the lower level could define the objective as "local variation," the higher level could never act. Therefore, the higher level must control the definition of the *end* to justify its control over the *means*. The presupposition here is that the Union has a teleological priority: its goals (integration, market unity) are the default, and subsidiarity is merely a check on the *intensity* of the intervention, not the *validity* of the goal. The flaw lies not in the structure but in the pretence that this is a neutral test. It presupposes the Commission is a neutral arbiter of necessity, when it is structurally biased toward integration.

  ### 3. The Mismatch of Addressee
  Empowering national parliaments rather than subnational ones reveals a specific conception of the citizen and the polity. It presupposes the citizen belongs primarily to the **Member State**, not the Region or the Union. Even in federal Member States (like Germany), the *Land* has no direct voice in the EU subsidiarity mechanism; only the *Bundestag* does.

  This allocation presupposes a **Westphalian shell**. It treats the Member State as a unitary black box for the purpose of external (EU) relations. It reinforces the sovereignty of the Member State against the Union, but simultaneously reinforces the central government of the Member State against its own regions. The citizen is conceived as a national constituent whose democratic will is aggregated at the capital, not at the regional seat. This contradicts the rhetoric of "Europe of the Regions." The mechanism protects the *State's* competence, not the *principle* of local governance.

  ### 4. Diagnosing the 2012 Withdrawal
  The 2012 withdrawal (Monti II) confirms the mechanism is a **signalling device for measuring salience**, not a truth-tracking test of a normative principle. The Commission denied the breach of principle (maintaining the legal truth) but withdrew due to lack of support (acknowledging the political reality).

  Can a practice be what it claims to be while operating as something else? It can, but only as a **useful fiction**. If the mechanism claims to be a legal compliance test but operates as a political veto, it degrades the rule of law while preserving political stability. It allows the Commission to save face (we withdrew for political reasons, not because we were wrong) and the Parliaments to save face (we stopped the proposal). However, this duality prevents the development of a coherent jurisprudence. It turns subsidiarity into a bargaining chip rather than a constitutional boundary. It presupposes that **political peace is more valuable than principled consistency**.

  ### 5. The Comparators
  *   **Germany:** The criterion of "equivalent living conditions" presupposes a substantive commitment to **homogeneity**. It sits in direct tension with an experimentalist reading of subsidiarity. If diversity of rules is a good (laboratories of democracy), then enforcing equivalent conditions is a harm. Germany chooses solidarity and unity over experimentalism. The EU, by contrast, has no substantive equality mandate in its subsidiarity test, only a functional efficiency one.
  *   **Switzerland:** The referendum presupposes a **single, cohesive demos** capable of understanding and deciding on federal statutes, and a political culture where the default is local autonomy. The EU cannot borrow this because it lacks a unified linguistic and media space. An EU-wide referendum on subsidiarity would fracture along national lines, reinforcing the very national vetoes the EU tries to manage.
  *   **United States:** The US refusal of a necessity test is a **rival theory of legitimacy**. It presupposes that state sovereignty is protected by the *structure* of the federal government (Senate representation) and specific prohibitions (anti-commandeering), not by judicial balancing of "necessity." It refuses to judicialise political questions of federalism. The EU, conversely, tries to judicialise them (CJEU jurisdiction) but lacks the political structure (a true Senate of States) to enforce them politically. The US assumes the political process will self-correct; the EU assumes it will not and needs a procedural brake.

  ### 6. Presupposition vs. Fit and Underdetermination
  **Strict Presuppositions:**
  1.  **Member State Primacy:** The mechanism *must* presuppose the Member State is the relevant unit of accountability (hence national parliaments).
  2.  **Executive Agenda-Setting:** It *must* presuppose the Commission defines the objectives (otherwise no Union act is possible).
  3.  **Deference:** It *must* presuppose the Court will defer to the legislature on complex economic/social assessments (otherwise the Court becomes a super-legislature).

  **Comfortable Fits:**
  1.  **Efficiency:** The mechanism fits with economic efficiency, but does not require it.
  2.  **Democracy:** It fits with democratic oversight, but does not guarantee it (since national parliaments may not represent regional interests).

  **Philosophical Underdetermination:**
  The institutional text is underdetermined between **Federal Balance** and **Functional Efficiency**.
  *   *Theory A (Federal Balance):* Subsidiarity exists to protect State sovereignty as a value in itself.
  *   *Theory B (Functional Efficiency):* Subsidiarity exists to ensure laws are made at the most effective level for the citizens.
  Both theories license the exact same text ("scale or effects," "sufficiently attained"). The text does not decide whether the goal is to *stop* the Union (protecting the State) or to *optimize* the Union (helping the Citizen). The yellow card leans toward Theory A (States objecting); the Commission's impact assessments lean toward Theory B (technical optimization). The mechanism allows both to coexist without resolving the tension.

  ### 7. Practical Changes for Alternative Theories
  If the presupposed view (Member State sovereignty/Functional Efficiency hybrid) were replaced, the following practical changes would be required:

  *   **(a) Purely Epistemic Subsidiarity:**
      *   *Change:* Remove national parliaments from the enforcement loop. Replace the yellow card with an independent **Regulatory Impact Assessment Agency** with veto power over competence claims.
      *   *Practice:* Regional governments would need direct standing to challenge acts before the CJEU based on data showing local capacity. The test would shift from "scale or effects" to "comparative performance metrics."

  *   **(b) Demos-Based Self-Government:**
      *   *Change:* Introduce a **Citizen's Subsidiarity Initiative**. If a certain number of citizens across Member States object, a referendum or mandatory Council review is triggered.
      *   *Practice:* Shift the addressee from Parliaments to People. This requires a pan-European civil society infrastructure which currently does not exist. It would treat subsidiarity as a human right of self-determination rather than a competence rule.

  *   **(c) Equality-Based (German Style):**
      *   *Change:* Amend the Treaty to include a substantive mandate for **territorial cohesion** or, conversely, a "diversity clause" that protects regulatory competition.
      *   *Practice:* The CJEU would have to abandon deference. It would need to review the *substance* of legislation to ensure it meets the equality standard (or diversity standard). This transforms the Court from a procedural reviewer into a substantive arbiter of social policy, requiring a massive expansion of judicial capacity and legitimacy.

  In sum, the current EU mechanism presupposes a Union of States that wishes to act like a Federation of Peoples but lacks the demos to sustain it. It uses a legal test to manage a political conflict, relying on the fiction that "efficiency" can resolve disputes that are fundamentally about sovereignty.
