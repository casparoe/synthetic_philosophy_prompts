answer: |-
  **Brainstorming**

  You are attempting to dissolve a metaphysical problem into a methodological taxonomy. This is a sensible strategy, akin to Carnapian explication, but you risk merely relabelling the confusion rather than resolving it. The tripartite distinction (Granularity, Width, Timing) is tidy, perhaps too tidy. Real historical debate rarely isolates these variables; they are entangled. Your 'modal horizon' is the risky centrepiece: if it amounts to nothing more than 'the point of no return', you have simply added modal terminology to standard path-dependence theory without increasing explanatory power. The epistemological worry is the most philosophically interesting element, yet you relegate it to a footnote in your own thinking. You need to decide if this is a paper about metaphysics or historiography; currently, it straddles both without fully committing to the implications of either.

  **Three Serious Objections**

  1.  **The Covariance Problem:** You treat Granularity and Width as independent parameters. They are not. If I specify the outcome with high granularity (e.g., 'the specific pattern of industrialisation observed in 1790'), the class of perturbations capable of altering it expands massively. If I specify it coarsely ('some form of mechanised production'), the perturbation class required to prevent it shrinks to cataclysms. You cannot vary one without constraining the other. Consequently, your claim that disagreements are merely about 'different parameters' collapses; most disagreements are about the *relationship* between granularity and width. By treating them as separable dials, you obscure the substantive trade-off historians actually make.

  2.  **The Triviality of Indexicality:** You argue inevitability claims are indexical to the historian's position relative to the modal horizon. Since historians necessarily write from a position *after* the outcome has obtained, they are, by definition, always past the modal horizon for that outcome. On your account, every historical inevitability claim made by a professional historian is trivially true, because they are observing from a point where the outcome is fixed. This dissolves the debate by making inevitability a tautology of survival rather than a substantive claim about the causal structure of the past. You need to explain how a historian can meaningfully claim something was inevitable *before* the horizon closed, from a position where they cannot possibly stand.

  3.  **The 'Modal Horizon' is Merely Temporal:** You define the modal horizon as the latest time a perturbation can redirect an outcome. This is indistinguishable from the 'tipping point' or 'lock-in' moment in standard path-dependence literature (e.g., Arthur, David). Unless you can show that the 'modal' aspect adds something over and above the causal mechanisms of increasing returns or network effects, you are simply repackaging existing sociological theory in possible-worlds semantics. If the horizon is determined by causal mechanisms, then 'timing' is not a separate parameter but a function of the causal structure itself. You have not added a parameter; you have described a consequence.

  **Paragraph-by-Paragraph Critique**

  *Paragraph 1:* You begin with a confident dissolutionist move. 'Artefact' is a strong word; ensure you can prove the dispute is merely verbal and not grounded in genuine metaphysical uncertainty. The phrase 'scalar notion of inevitability' is useful, but you must demonstrate that participants in the debate actually treat it as scalar. Many treat it as binary (fixed vs. open).

  *Paragraph 2:* The definition of robustness is standard Lewisian modal logic applied to history. It is serviceable, but note that 'would still have obtained' carries heavy metaphysical weight. You are assuming a semantics for counterfactuals that many historians reject. You might need to bracket the metaphysics and treat this as a heuristic model rather than a truth-conditional account.

  *Paragraph 3 (Granularity):* This is your strongest distinction. However, 'apt for truth' is too strong. Claims are not inapt; they are indeterminate. You need to clarify who settles the granularity. Is it the historian? The evidence? If it is the historian, then inevitability becomes subjective, which undermines your objective schema.

  *Paragraph 4 (Width):* 'There is no measure over counterfactual histories' is a sceptical claim that threatens your own project. If there is no measure, how can we assess robustness? You cannot have it both ways: either we can assess robustness (implying some measure) or we cannot. You need to clarify that width is stipulated *methodologically*, not discovered *ontologically*.

  *Paragraph 5 (Timing):* You concede this to the path-dependence literature. Be careful not to let this parameter swallow the others. If timing determines the effect of perturbations, then granularity and width are functions of timing.

  *Paragraph 6 (Interpretive Claim):* Your reading of Carr is plausible but reductive. Carr's objection was moral and political, not merely about granularity. Gould on width is accurate. Be wary of forcing historical figures into your taxonomy just to show its utility; ensure you are not straw-manning their actual arguments to fit your three boxes.

  *Paragraph 7 (Modal Horizon):* As noted in the objections, this risks triviality. 'Monotone in t' is a strong mathematical claim about history. History is rarely monotone; reversals happen. A 'modal horizon' might open again due to exogenous shocks. You need to allow for non-monotonicity, or defend why macro-history is sufficiently smooth to warrant this claim.

  *Paragraph 8 (Epistemological Worry):* This is the most philosophically rich paragraph, yet you treat it as an afterthought. 'Retrospective inevitability inflation' is a compelling phrase. However, you must distinguish this from standard hindsight bias. Hindsight bias is cognitive; this sounds structural (the archive itself is biased). Do not leave this hanging; it deserves a full section, not a tentative closing remark.

  **Addressing Your Specific Questions**

  (i) **Is the modal horizon notion doing any work?**
  Currently, no. It is path dependence with extra steps. To sharpen it, you must decouple it from simple chronology. The horizon should not be defined by *time* but by *modal distance*. A modal horizon is reached not when time passes, but when the *cost* of divergence exceeds a certain threshold of causal energy. If you define it temporally, it is trivial. If you define it modally (in terms of the 'size' of perturbation required), it becomes a measure of historical stability, which is useful.

  (ii) **Are the three parameters genuinely separable?**
  No. Fixing granularity effectively fixes the width. If you demand a highly specific outcome, the set of perturbations that *would not* change it (the robustness set) shrinks. If you demand a coarse outcome, the robustness set expands. They are covariates. You should acknowledge this interdependence. Your scheme works better if you present them as axes of a single space rather than three independent dials. Admitting they are linked strengthens the model by showing the trade-offs historians make, rather than pretending they can isolate them.

  (iii) **Is retrospective inevitability inflation real or a redescription?**
  It is likely hindsight bias in modal costume unless you can tie it to the structure of the archive. Hindsight bias is psychological (I knew it all along). Inevitability inflation is epistemic (the evidence for alternatives has been destroyed). To settle this, you would need evidence where agents *know* they are being tested on counterfactuals yet still exhibit the bias, or cases where the archival silence systematically removes evidence of near-misses. If it is merely cognitive, it is psychology, not philosophy of history. If it is archival, it is a genuine methodological problem. You must argue for the latter to make it distinct.

  **Final Verdict**

  This thesis is too methodological to sustain an entire dissertation on metaphysics, but too sophisticated to be merely a section. You should build the dissertation around the *epistemological* implications of this framework (the inflation problem), using the three parameters as the tool to analyse specific historical case studies, rather than treating the taxonomy itself as the primary contribution.
