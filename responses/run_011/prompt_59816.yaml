  9.  **Final Polish:** Ensure the tone is consistent. A senior supervisor wouldn't say "I think"; they would say "The argument fails because..." or "You must address..." Ensure the distinction between metaphysical and methodological is sharp.

      *Self-Correction on Tone:* Make sure it's not *too* harsh that it's destructive, but definitely not encouraging. "Blunt criticism rather than encouragement" means no sandwich method. Just the meat.

      *Self-Correction on Content:* The student asks about 'modal horizon' doing work. I need to be specific about *what* work it isn't doing. It describes *when* change becomes impossible, but path dependence already describes *why* (increasing returns, etc.). The 'modal' aspect needs to be about *possibility space*, not just chronology.

      *Self-Correction on Separability:* If I say 'Industrialisation' (coarse), almost any perturbation short of nuclear war leaves it robust. If I say 'Industrialisation starting in 1760 in Lancashire' (fine), a minor perturbation kills it. So Granularity dictates the *required* Width for a truth claim. They aren't independent variables.

