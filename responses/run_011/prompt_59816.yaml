      *   *Tone Check:* Needs to be blunt, British (e.g., 'programme', 'analyse', 'whilst', 'modest'), authoritative but constructive in a hard-nosed way.

  4.  **Developing the Three Serious Objections:**
      *   *Objection 1 (The Collapse of Parameters):* Granularity and Width are not independent. If I specify the outcome finely ('The Industrial Revolution *as it actually occurred*'), the class of perturbations that *could* change it shrinks automatically. If I specify it coarsely ('Some industrialisation'), the class widens. You can't vary them independently without trivialising the robustness claim.
      *   *Objection 2 (Modal Horizon vs. Path Dependence):* 'Modal horizon' sounds fancy but is it just the 'tipping point' or 'lock-in' point already discussed in path dependence literature (Arthur, David)? If it's just "the point after which change is hard," it's not new. It needs to do modal work, not just temporal work.
      *   *Objection 3 (The Indexicality Problem):* Claiming inevitability is indexical to the historian's position is risky. Historians usually write *after* the fact. If inevitability is only true *past* the modal horizon, and historians are always past the modal horizon (because the event happened), then all historical inevitability claims become trivially true or meaningless. It dissolves the debate by making inevitability a tautology of survival.

