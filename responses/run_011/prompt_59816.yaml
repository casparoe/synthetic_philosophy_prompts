      *   *(iii) Retrospective Inevitability Inflation:* This is likely just hindsight bias (Fischhoff) dressed in modal logic. To distinguish it, you'd need to show it persists even when agents know they are being tested on counterfactuals, or that it arises from structural features of the archive rather than cognitive psychology.

