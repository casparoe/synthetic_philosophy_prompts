answer: |-
  Your hunch is sharp, but it is too charitable. You suggest the two camps are answering different questions and mistaking each other's answers for bad answers to their own question. That implies a confusion that could, in principle, be cleared up by better translation. If that were true, a philosopher could step in, say "Ah, you mean *determinacy* and you mean *truth*," and the tension would dissolve.

  It won't dissolve. The disagreement is not a category error; it is a clash over the *presuppositions* of the question itself.

  Here is the plain correction to your hunch: Both sides believe they are answering the exact same question ("Is CH true?"). The Platonist believes the question presupposes a unique reality ($V$) and asks for a fact about it. The Multiversist (or anti-realist) believes the question presupposes a unique reality and argues that *that presupposition is false*. They are not talking past each other; they are fighting over whether the ground they are standing on exists.

  Let's sort your four readings. It is not a purely verbal fight (1). If it were, we could stipulate "By 'universe' we mean 'model of ZFC'" and move on. But the Platonist refuses that stipulation because they believe "universe" refers to something that isn't just a model. It is substantive metaphysics (2), but it is not epistemically inert in the way you fear, because the metaphysics dictates the methodology. It is fundamentally about standards of evidence (3), rooted in bedrock intuition (4).

  The core of the stalemate is this: **The criteria for 'settling' the question are part of the question.**

  ### The Error Bar Analogy
  In your old work, an error bar represented epistemic uncertainty. The lead isotope ratio *was* a specific number; your instrument just had noise. You assumed the parameter existed.
  In the CH debate, the Platonist treats independence like a large error bar. The value exists (CH is true or false); ZFC is just a noisy instrument. We need a better spectrometer (new axioms) to shrink the error bar to zero.
  The Multiversist treats independence like a thermodynamic definition problem. Asking for the "true" value of CH in *the* universe is like asking for the temperature of a single molecule. The concept "temperature" requires an ensemble. There is no "true" value for the individual case, only values relative to a model.

  When Woodin shifts from $\Omega$-logic (suggesting CH is false) to Ultimate $L$ (suggesting CH is true), he isn't just changing a measurement. He is changing his theory of what the "spectrometer" is. First, he thought the structure of *all* models pointed one way. Now, he thinks the structure of the *maximal* model points the other. The Multiversist looks at this and says, "You're just tuning the instrument until it plays the song you want." The Platonist says, "I'm calibrating against reality."

  ### What Would Count as Progress?
  You ask if a new axiom would settle it.
  **No.** If Woodin (or anyone) produces a new axiom $\Phi$ that is aesthetically compelling, fruitful, and decides CH, the Platonist will say, "We have found the truth." The Multiversist will say, "You have defined a nice class of universes where CH holds. Why is *that* class the 'real' one?"

  The Multiversist can always retreat to the position that $\Phi$ is just another coordinate choice. To defeat them, you wouldn't need a theorem that decides CH; you would need a theorem that shows **conceptual vagueness is impossible.**

  Here is the distinction you asked for between "merely hard" and "ill-posed":
  *   **Merely Hard:** The concept "arbitrary subset of $\omega$" is sharp and definite, but our logical access to it is limited. (The Platonist view).
  *   **Ill-Posed:** The concept "arbitrary subset of $\omega$" is inherently vague because "arbitrary" cannot be made precise without circularity or relativization to a model. (The Feferman/Multiverse view).

  For the question to be **ill-posed**, one must prove that the notion of "all subsets" cannot be determinate. This is incredibly difficult because the intuition of "definiteness" is primal. In geochemistry, you can prove a system is open by finding the leak. In set theory, how do you prove a "leak" in the concept of a set? You can't point to a subset that is "vague." You can only point to the fact that we can't pin down *which* subsets exist.

  So, could a theorem do it?
  A theorem showing that *any* axiom system deciding CH must be arbitrary (in a rigorous sense) would push the needle toward "ill-posed." But "arbitrary" is in the eye of the beholder. Large cardinal axioms feel non-arbitrary to Platonists because they extend the height of the universe uniformly. To a Multiversist, they are just rules for building taller models.

  ### The Verdict on Progress
  Progress will not look like a solution. It will look like a **decoupling**.
  In physics, we learned to accept that "position" and "momentum" cannot both be sharp. We didn't solve the uncertainty; we incorporated it into the theory.
  Progress in set theory would be the widespread acceptance that "Truth in $V$" and "Provability in $T$" are distinct categories that do not need to map one-to-one.

  If the community broadly accepts a new axiom $\Phi$ that decides CH, the Platonists will claim victory. But the Multiversists won't be refuted; they will just become a minority philosophical sect, like determinists in the age of quantum mechanics. The math will proceed *as if* Platonism is true because it is heuristically useful to assume there is a single $V$.

  However, if you want to know if the question *itself* will be dissolved:
  The only way to dissolve it is to show that the word "set" in "set of integers" is no more definite than the word "heap" in "heap of sand." If "set" is a vague predicate, CH has no truth value. But mathematicians have a visceral resistance to this. They feel they know what a set is. That feeling is the bedrock intuition (your option 4). You cannot argue someone out of a bedrock intuition with a theorem, because they will interpret the theorem through the intuition.

  ### Where Your Hunch Misses
  You thought the sides were mistaking each other's answers. In reality, they understand each other perfectly.
  The Platonist says: "I know you think it's a multiverse, but you're wrong, there is one $V$."
  The Multiversist says: "I know you think there is one $V$, but you're wrong, there are many."
  They are not answering different questions. They are disagreeing about the **ontology of the subject matter**.

  This is why no one has changed their mind in sixty years. In science, data forces mind-changes. In this corner of philosophy, the "data" (the independence results) is compatible with both ontologies. The choice between them is not driven by evidence, but by **temperament**.
  *   One temperament cannot tolerate a truth that is in principle unknowable (The Platonist).
  *   The other temperament cannot tolerate a reality that is in principle unexhibitable (The Multiversist).

  ### Summary
  1.  **Diagnosis:** It is not a verbal dispute or a confusion of questions. It is a substantive disagreement about whether the domain of discourse ($V$) is unique or plural, driven by conflicting standards of what counts as justification for an axiom.
  2.  **Progress:** A new axiom will settle it *sociologically* (mathematicians will use it), but not *philosophically* (the multiverse critique remains valid). A theorem cannot settle it unless it proves the concept "set" is vague, which is unlikely to be accepted by the majority.
  3.  **Ill-posed vs. Hard:** It is "ill-posed" only if the concept of "arbitrary subset" is inherently vague. It is "merely hard" if the concept is sharp but our axioms are weak. The field is stuck because there is no meta-tool to measure the "sharpness" of a concept without using the concept itself.

  You are looking for an error bar on the truth value. The uncomfortable reality is that the disagreement is about whether the parameter exists at all. In your old field, you could run a blank to check for background noise. In set theory, the "background noise" is the logic you use to run the check. You cannot subtract it out.
