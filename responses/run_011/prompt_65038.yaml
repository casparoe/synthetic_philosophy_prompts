answer: |-
  **The Weight of Wax**

  The hall smelled of wet wool and woodsmoke, the air thick enough to taste. Outside, the river was a single sheet of grey iron, locked against the banks. Inside, the hundred delegates sat in tiers of rough timber, their breath rising in pale clouds that tangled with the smoke from the single stove. Elara sat at the low table in the center, a pot of ink freezing at her elbow. She was the youngest of the three counting clerks, the only one whose fingers did not stiffen when she touched the paper. Her task was not to speak, but to watch the numbers form in her head before the slips were piled.

  The first question was the granary. The charter lay open on the lectern, its parchment stiff with age. Everyone knew the proud clause: the rule of decision must be such that no delegate can ever fare better by declaring preferences other than the ones they hold. It was the foundation of the confederation, the promise that truth was the safest path.

  Vessa sent forty-five delegates. Orun sent forty. Kelt, the smallest valley, sent fifteen. The options were carved into the table: the Ford, the Pass, the Marsh Causeway.

  Elara watched the slips come forward. They were folded tight, sealed with wax the colour of dried blood. The senior clerk broke the seals. The wax cracked, a sound like small bones snapping.

  "Forty-five for the Ford," the senior clerk read. The Vessa delegation sat still.
  "Forty for the Pass," he continued. The Orun delegates nodded.
  "Fifteen for the Causeway."

  The hall murmured. Under the rule, most first declarations wins. Forty-five beat forty. The Ford would be built.

  Elara looked to the Kelt bench. They preferred the Causeway above all; the marsh connected their trade routes. But the Causeway had only fifteen votes. Their second choice was the Pass; the Ford was their ruin, flooding their lower fields. She saw the senior delegate from Kelt, a woman named Varrin, stand up. Varrin did not look like a conspirator. She looked like a mother counting rations.

  "The fifteen slips from Kelt," Varrin said, her voice clear in the cold air. "We declare for the Pass."

  The senior clerk paused. The charter allowed declaration, not confession. He tallied the change.
  "Ford: forty-five. Pass: forty plus fifteen. Fifty-five."

  The Pass won. The smallest commune had overturned the largest. There was no anger in the room, only a cold understanding. Varrin had not broken the rule; she had used it. She had declared a lie to save her people from the Ford, and everyone understood precisely how it was done. The charter's promise was broken in the first hour. Elara wrote the numbers down: 45, 55. The ink skidded on the paper.

  The following year, the ice was thicker. The charter was repaired. They adopted a second ballot between the two options with the most first declarations. It was believed this would cure the lying. If you could not win in the first count, you would survive to the second, so there was no need to lie.

  The question was the ferry reach: Upper, Middle, Lower.

  Elara sorted the slips. The numbers stood clear in her mind before she touched them. Forty delegates preferred Upper before Middle before Lower. Thirty-five preferred Middle before Lower before Upper. Twenty-five preferred Lower before Upper before Middle.

  "Honest tally," the senior clerk announced. "Upper: forty. Middle: thirty-five. Lower: twenty-five."

  The Upper and Middle reaches went to the second ballot. The Lower was cast out.
  In the runoff, the forty who wanted Upper voted Upper. The twenty-five who wanted Lower preferred Upper to Middle, so they voted Upper.
  "Upper wins," the clerk said. "Sixty-five to thirty-five."

  The Orun delegates stood. For them, the Upper reach was the worst of the three; the currents there would capsize their boats. They needed the Lower.

  "We declare for the Lower," said the Orun lead.

  Elara ran the arithmetic instantly.
  First count: Upper: forty. Middle: zero. Lower: twenty-five plus thirty-five. Sixty.
  The pairing was remade. The Upper and Lower reaches faced one another. The Middle was cast out.
  In the runoff, the forty who wanted Upper voted Upper. The thirty-five from Orun voted Lower. The twenty-five who wanted Lower voted Lower.
  "Lower wins," the clerk said. "Sixty to forty."

  Elara put down her quill. She spent a page establishing, to her own relief, that the second ballot itself could not be lied about at all. When only two options remain, you simply choose the one you prefer. A lie there only hurts yourself. But she understood then that the lie had not been abolished. It had moved upstream, into the choosing of which two options were permitted to face one another. The rule protected the vote, but not the choice of the vote. Varrin watched her from the benches. There was no triumph in Varrin's eyes, only the exhaustion of having to calculate survival.

  Winter deepened. The river groaned under the snow. A delegate proposed the Urn.

  Every delegate's name on a slip, placed in a wooden bowl. One drawn. The drawn party's honest ranking decides alone with no further counting.

  The hall went silent. Elara looked at the bowl. She conceded, truthfully and against her own side, that this could not be gamed at all. A lie only alters which of your own preferences is honoured should your slip be drawn, and you cannot increase the chance of your slip. If you are drawn, you want your true wish. If you are not, your vote counts for nothing. There was no space for strategy in the random draw.

  But the assembly rejected it anyway.

  Varrin spoke against it. "The Urn can crown the one outcome that every other commune ranks below an outcome they could have had," she said. "If Kelt is drawn, they take the Causeway. Vessa and Orun starve. We cannot have the harvest decided by a piece of paper."

  It was not the math that killed the Urn. It was the fear. To be safe from lies, they would have to surrender to chance. They preferred the lie they could track to the truth they could not control. The bowl was pushed aside. The wax seals remained.

  The charter was narrowed again. The assembly may only ever decide between two named options. No more than two. This brought relief. With only two options, no one can lie to improve their lot. You vote for what you want. The arithmetic is pure.

  But the second chill arrived. Whoever draws up the pair decides everything. If I choose between Ford and Pass, I decide the outcome. If I choose between Ford and Causeway, I decide the outcome. The pair is drawn up by clerks.

  Elara looked at the senior clerk. He looked tired. The power had shifted to the table where she sat.

  A proposal was laid on the wood. To vest the power of drawing the pair, and the decision itself, in a single officer for life.

  A murmur rose. This was the end of the confederation. This was a king.

  Elara stood. She was the youngest, and her voice did not carry far, but the hall was quiet. "What happens," she asked, "when the count comes out even at fifty apiece?"

  The hall discovered what answering that question amounted to. If fifty say yes and fifty say no, someone must break the tie. That person decides the outcome. To resolve the tie is to hold the veto. To hold the veto is to hold the choice.

  "If we cannot agree," Elara said, "someone must choose. If someone must choose, let it be one person, so we know who to blame."

  The final vote was whether to vest that power. The question was binary. Yes or No.

  Elara looked at Varrin. The senior delegate from Kelt sat with her hands folded. She had lied for fifteen households that would otherwise be outvoted for a generation. She had lied because the math left her no other path to keep her people fed. Now, the math offered a different path. A single officer could not be lied to, because the officer decides alone. The binary vote to create the officer was the first vote in the federation's history that no delegate could improve upon by lying. There was no advantage in declaring No if you wanted Yes. There was no room for the wax seals to hide a strategy.

  They passed it.

  The senior clerk took the charter. He dipped his pen in the frozen ink. He wrote the name of the Officer. He did not write his own name. He looked at Elara. She did not look away. The stove hissed. The river outside held still under the ice. The hall waited for the Officer to speak, but there was only the sound of the wax cooling, hardening into a shape that would not change.
