  # The Self-Control Sorting Instrument

  **Instructions:** Read each scenario or question below. Choose the option that best matches your intuition about the case. Follow the arrow to the next node. At the end, you will arrive at a named position.

  ### Node 1: The Structural Link
  **Case:** Consider **Alex**, who resolves on Sunday to decline a party on Monday but goes anyway. Consider **Blake**, who plans to save for retirement but spends the bonus instead.
  **Question:** Are Alex and Blake in the same kind of trouble?
  *   **(A)** Yes, it's the same engine running on different fuel (time vs. money). → *Go to Node 2*
  *   **(B)** No, one is a moral failure, the other is a calculation error. → *Go to Node 3*
  *   **(C)** I'm not sure they are in trouble at all. → *Go to Node 4*

  ### Node 2: The Future Self (For "Same Engine" respondents)
  **Case:** When Blake spends the bonus, is it Blake making a mistake, or is "Monday-Blake" a different person than "Sunday-Blake"?
  *   **(A)** It's the same person, just inconsistent. → *Go to Node 5*
  *   **(B)** It's effectively a conflict between two different people in one body. → *Go to Node 6*

  ### Node 3: The Verdict (For "Different Engine" respondents)
  **Case:** When Alex eats the cake on Monday, does Alex still believe, right then, that dieting is better?
  *   **(A)** Yes, the judgment stays put; they just act against it. → *Go to Node 7*
  *   **(B)** No, in the moment, the cake looks like the better option. → *Go to Node 8*
  *   **(C)** It depends on whether you ask them before or after. → *Go to Node 9*

  ### Node 4: The "So What?" Test (For "Unsure" respondents)
  **Case:** Suppose we agree that people value things more when they are closer in time. Is that a failure of rationality?
  *   **(A)** No, that's just how valuing works. → *Leaf: The Deflationary View*
  *   **(B)** Yes, it's a bug in the system. → *Go to Node 2*

  ### Node 5: The Planner (For "Same Person" respondents)
  **Case:** On Sunday, Alex knows they will fail on Monday. Alex buys a lock for the pantry anyway. Is this self-control?
  *   **(A)** Yes, managing your own weakness is control. → *Leaf: The Commitment Account*
  *   **(B)** No, that's just avoiding the choice. → *Leaf: The Naive Agent*

  ### Node 6: The Exploitation (For "Different People" respondents)
  **Case:** Sunday-Alex knows Monday-Alex is weak. Sunday-Alex leaves the cake out *on purpose* to ensure a cheat day happens. Is this rational?
  *   **(A)** Yes, satisfying the whole timeline's preferences. → *Leaf: The Sophisticated Split*
  *   **(B)** No, that's self-sabotage. → *Leaf: The Partitioned Self*

  ### Node 7: The Report (For "Judgment Stays Put" respondents)
  **Case:** Alex says, "I knew it was wrong, I just couldn't stop." Do we believe Alex felt a pull they couldn't resist?
  *   **(A)** Yes, trust the report of struggle. → *Go to Node 10*
  *   **(B)** No, if they did it, they must have wanted to. → *Leaf: The Identification View*

  ### Node 8: The Shift (For "Judgment Moves" respondents)
  **Case:** If the judgment changes in the moment, is there anything left to explain?
  *   **(A)** Yes, why did the judgment change? → *Leaf: The Judgment-Shift View*
  *   **(B)** No, problem solved. → *Leaf: The Deflationary View (Variant)*

  ### Node 9: The Scope (For "Depends" respondents)
  **Case:** Is the failure in the single act of eating, or in the months of habit that led there?
  *   **(A)** The single act. → *Leaf: The Intentionalist View*
  *   **(B)** The habit/life. → *Leaf: The Virtue View*

  ### Node 10: The Animal (For "Trust Report" respondents)
  **Case:** A dog is trained to wait for food but eats it when the trainer leaves. Is the dog weak-willed?
  *   **(A)** Yes, same mechanism. → *Leaf: The General Mechanism View*
  *   **(B)** No, dogs don't have reasons. → *Leaf: The Reason-Based View*

  ### Node 11: The Drift (Discriminator for Virtue/Character)
  **Case:** Consider **Casey**, who doesn't eat one big cake but delays saving $5 a day for ten years. Is there a moment of failure?
  *   **(A)** Yes, every day is a choice. → *Leaf: The Distributed Failure*
  *   **(B)** No, it's a slow drift of character. → *Leaf: The Virtue View*

  *(Note: To meet the 9-11 node constraint while ensuring all leaves are reachable, Nodes 9 and 11 function as parallel discriminators for the "Scope" dimension depending on earlier paths.)*

  ---

  ### The Leaves: Positions and Awkward Commitments

  1.  **The Deflationary View:** There is no coherent phenomenon of weakness; there is only changing one's mind.
      *   *Awkward Commitment:* You must tell the dieter who cries while eating the cake that they are simply lying about what they wanted most.
  2.  **The Deflationary View (Variant):** Preference reversal is rational updating, not failure.
      *   *Awkward Commitment:* You must argue that the retirement saver who ends up destitute made no mistake, only updates.
  3.  **The Commitment Account:** Self-control is externally binding your future choices.
      *   *Awkward Commitment:* You must admit that a person in a straitjacket has more self-control than a free person who resists temptation.
  4.  **The Naive Agent:** The agent is a unity who simply makes inconsistent choices without planning for them.
      *   *Awkward Commitment:* You must explain why this agent never learns to avoid the situation despite repeated failures.
  5.  **The Sophisticated Split:** The agent is multiple selves; planning to fail can be rational.
      *   *Awkward Commitment:* You must accept that deliberately setting yourself up to fail is a form of successful agency.
  6.  **The Partitioned Self:** The conflict is between distinct parts (e.g., limbic vs. cortical).
      *   *Awkward Commitment:* You must explain who the "real" agent is when the parts disagree.
  7.  **The Judgment-Shift View:** The agent's evaluation of the best option actually changes at the moment of action.
      *   *Awkward Commitment:* You must deny that the agent feels any residual conflict or regret during the act.
  8.  **The Identification View:** Action is free only if it aligns with higher-order desires; reports of struggle are suspect.
      *   *Awkward Commitment:* You must tell the addict who wants to quit but can't that they are doing exactly what they want.
  9.  **The Intentionalist View:** The action is done intentionally for a reason, despite better judgment.
      *   *Awkward Commitment:* You must claim that acting against your own best judgment is a perfectly coherent exercise of rationality.
  10. **The General Mechanism View:** Weakness is a biological control failure applicable to animals and humans.
      *   *Awkward Commitment:* You must attribute moral concepts like "resolve" to a dog waiting for a treat.
  11. **The Reason-Based View:** Weakness requires the capacity for reason-responsiveness, unique to humans.
      *   *Awkward Commitment:* You must argue that a human acting on pure impulse is less "agential" than a dog acting on training.
  12. **The Virtue View:** The failure is in the character constitution, not the single episode.
      *   *Awkward Commitment:* You cannot explain a one-off failure by a generally virtuous person without calling it an anomaly.
  13. **The Distributed Failure:** The failure is in the sequence of trivial choices, not a dramatic moment.
      *   *Awkward Commitment:* You must identify a specific "tipping point" in a smooth curve where responsibility begins.
  14. **Empty Coordinate 1 (Stable Judgment + Multiple Selves):** The agent holds a stable better judgment but is constituted by conflicting selves.
      *   *Status:* **Incoherent.** If selves are truly distinct, they have distinct judgments; if judgment is stable across the agent, the agent is effectively unified.
  15. **Empty Coordinate 2 (Distinct Phenomena + Naive Unity):** Phil akrasia and Econ discounting are distinct, but both are explained by a single naive agent.
      *   *Status:* **Unattractive.** It posits two distinct mysteries but offers only one generic solution, gaining no explanatory power.

  ---

  ### Instrument Limitations & Predictions

  **Indistinguishable Pairs:**
  This instrument cannot reliably separate **The Intentionalist View** from **The Naive Agent**. Both answer "Same Person" and "Stable Judgment" to the case questions. The tree sorts by *behavioral description*, but these two positions differ only on *metaphysical labeling* (Reasons vs. Preferences). To separate them, you would need a node asking: "Is the explanation for the action a *reason* the agent could articulate, or a *cause* that bypassed articulation?"

  **The Inverse Case:**
  Node 4 (The "So What?" Test) handles the inverse question. If a participant selects "No, that's just how valuing works," they are routed to the Deflationary leaf. This captures the agent whose judgment genuinely swings with temporal proximity and on whom we feel no pressure to apply the language of weakness.

  **The Self-Report Fault Line:**
  Node 7 (The Report) explicitly forces a commitment on trusting the agent's self-ascription. Selecting (B) routes to the Identification View, which treats the report of "I couldn't stop" as a post-hoc rationalization rather than data.

  **Where the Vehement Disagree-ers Land:**
  I expect the **Hardline Davidsonian (Intentionalist)** and the **Hardline Thalerian (Behavioral Economist/Naive)** to land on the same leaf: **The Naive Agent** (or *The Intentionalist View*, depending on Node 10 routing).
  *Why?* Despite disagreeing vehemently on vocabulary (Reasons vs. Utility Curves), both view the agent as a **single unity** who makes a **sub-optimal choice** without partitioning the self or dissolving the phenomenon. The case-based sorting (Did they try to stop? Was it one person?) forces them into the same bin, exposing that their disagreement is theoretical, not phenomenological.
