answer: |-
  ### The Causal Debugging Tree

  Answer these five questions based on your immediate intuition about the scenario. Do not overthink the metaphysics; choose the answer that feels like the correct incident report.

  **Q1. The Perfect Sim (Ontology)**
  You create a bit-for-bit deterministic emulation of the production environment. The outage occurs in the sim exactly as it did in prod. Is the "cause" of the outage a property of the bits and state transitions in the simulation, or is it a property of the narrative description you layer on top of those bits?
  *   **A.** It is in the bits (the simulation *contains* the cause).
  *   **B.** It is in the narrative (the simulation only *shows* the events).

  **Q2. The Missing Check (Absence)**
  A service crashes because a specific null check was *not* written in the codebase. No line of code executed that "pushed" the crash; a line was absent. Did the *absence* of the check cause the crash?
  *   **A.** Yes.
  *   **B.** No.

  **Q3. The Dual Deploy (Overdetermination)**
  Two independent microservices, Alpha and Beta, both send a `DROP TABLE` command to the database at the exact same nanosecond due to a race condition. The table drops. If Alpha hadn't sent it, Beta would have. If Beta hadn't, Alpha would have. Did Alpha *cause* the drop?
  *   **A.** Yes (and Beta did too).
  *   **B.** No (or only one of them did).

  **Q4. The Shared Lock (Mechanism)**
  Service X and Service Y run on different nodes and never communicate over the network. They both spike in latency because they contend for the same underlying database lock. Does Service X's load *cause* Service Y's latency?
  *   **A.** Yes (changing X changes Y).
  *   **B.** No (nothing flowed from X to Y).

  **Q5. The Silent Backup (Preemption)**
  A circuit breaker trips, preventing a crash. If it hadn't tripped, a watchdog timer would have rebooted the service, which also would have prevented the crash. The circuit breaker acted first. Did the circuit breaker *cause* the stability?
  *   **A.** Yes.
  *   **B.** No (the watchdog would have done it anyway).

  ---

  ### Path to Leaves

  1.  **Q1(A) → Q2(A):** **Causal Primitivism** (e.g., Anscombe). Causation is a fundamental feature of reality (bits), and omissions can be real features.
  2.  **Q1(A) → Q2(B) → Q5(B):** **Process Theory** (e.g., Salmon/Dowe). Causation requires a physical connection (bits/flow). Absences aren't physical; preempted backups didn't complete the process.
  3.  **Q1(B) → Q3(A) → Q4(B):** **Humean Supervenience** (e.g., Lewis). Causation is a pattern in events (narrative). Overdetermination fits the pattern, but without direct flow (Shared Lock), the causal link is weaker or requires spatiotemporal continuity.
  4.  **Q1(B) → Q3(A) → Q4(A):** **Interventionism** (e.g., Woodward). Causation is about manipulability within a model (narrative). If intervening on X changes Y, it's a cause, regardless of physical flow. Overdetermination holds because intervening on either prevents the outcome.
  5.  **Q1(B) → Q3(B):** **Causal Nihilism** (e.g., Russell). Causation is not even a useful pattern here; it's folk taxonomy. If the pattern breaks down (overdetermination), the concept itself is suspect.

  ---

  ### Analysis of Cases & Puzzles

  **Reskins of Standard Puzzles:**
  *   **Q3 (The Dual Deploy)** is a direct reskin of **Symmetric Overdetermination** (the classic "two shooters" case). It tests whether causation requires necessity (counterfactual dependence) or sufficiency.
  *   **Q2 (The Missing Check)** is a reskin of **Causation by Absence/Omission** (the "gardener fails to water" case). It tests whether causation requires positive existence.
  *   **Q5 (The Silent Backup)** is a reskin of **Late Preemption** (the "Suzy throws, Billy holds back" case). It tests whether a cause must be *necessary* for the outcome, or merely *actual*.

  **Genuinely New Pressure:**
  *   **Q1 (The Perfect Sim)** puts pressure on **Digital Metaphysics**. Traditional philosophy assumes a physical substrate; software allows for a substrate that is *already* logical. This forces a choice between causation as syntax (bits) vs. semantics (narrative) in a way rock-throwing puzzles cannot.
  *   **Q4 (The Shared Lock)** pressures **Mechanism vs. Dependency** in distributed systems. Traditional puzzles assume spatial proximity. In cloud architecture, "contact" is logical (locks), not spatial. This separates Interventionists (who accept logical coupling) from Process Theorists (who demand signal flow) more sharply than physical examples.

  ---

  ### Leaf Diagnostics

  **Indistinguishable Leaves:**
  *   **Humean Supervenience vs. Interventionism:** In practice, these leaves are often indistinguishable using these cases. Both typically answer "Yes" to Overdetermination and "Yes" to Absence. The distinction lies in *why* (pattern vs. manipulability), which requires deeper probing than intuition alone provides.

  **Unoccupied Combinations:**
  *   **Q2(B) [No Absence] + Q4(A) [Yes Shared Lock]:**
      *   *Diagnosis:* **Incoherence.** Denying absence causation usually stems from a requirement for "something to happen" (a physical event). Affirming the Shared Lock as causal despite no direct flow contradicts that requirement. One cannot demand physical presence for omissions while accepting logical coupling for correlations.

  **Engineer Habit Commitments:**
  *   **The Randomization Trap:** By demanding A/B testing or randomized canaries to prove a fix, you quietly commit to **Interventionism** (causation is defined by the ability to manipulate). However, in post-mortems, engineers often reject this label, insisting the root cause was a "brute fact" of the code (**Primitivism**). You act like an Interventionist but argue like a Primitivist.
  *   **The Reproducibility Trap:** By treating a bug that cannot be reproduced as "not real" or "not a priority," you quietly commit to **Humean Supervenience** (causation is a regularity/pattern). If causation were a primitive physical connection (Primitivism), a single non-reproducible instance should hold the same ontological weight as a reproducible one. You reject the leaf (Humean) because it sounds "statistical," but your workflow inhabits it.
