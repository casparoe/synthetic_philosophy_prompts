  Cost: You must accept that early embryos (pre-sentience) might not have FLOs in the moral sense, only biological futures. This weakens the anti-abortion force of (1) slightly but saves it from absurdity. It distinguishes between a life that *has* a future and a life that *is* a future. For your group, this means admitting the embryo is special but not identical to a child. It protects the comatose because they *were* subjects, whereas the unconceived never were.

  - **The skin-cell test**
  The "existing subject" repair handles this. A skin cell is not an organism; it is a part. It has no independent future unless artificially manipulated. The embryo is an organism; the skin cell is not. Totipotency shows potential, not actual organization. You don't need a separate patch; you just need to define "subject" as "organized organism," not "cell with DNA." This isn't ad hoc; it distinguishes parts from wholes, a standard biological distinction you know well. A hedge is many organisms; your skin is one organism's parts. Pruning kills organisms; showering sheds parts. The repair respects the biological boundary between part and whole, preventing the slide into mass homicide over shed skin.

  - **On the violinist**
  Orthogonal. Thomson's violinist argues that even if the fetus has a right to life (FLO), you aren't obliged to lend it your body. Your argument is about whether killing is wrong *at all*. Hers is about whether *you* must prevent it. You can agree killing is wrong (your point) but still say forced pregnancy is impermissible (her point). They address different moral questions: the value of the life vs. the cost to the bearer. Her case doesn't fix your logic; it just bypasses it.

  - **Bottom line**
  Step (2) fails because you cannot deprive someone who never exists. Fix it by requiring an actual subject. This saves contraception and skin cells. It keeps killing wrong but admits embryos are different from adults. Tell your group: "You can't miss a party you were never invited to." The wrongness lies in taking a future from someone who is already here, not in failing to invite someone who isn't.
