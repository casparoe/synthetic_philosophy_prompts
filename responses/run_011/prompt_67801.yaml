answer: |-
  **Directions of Generalisation: Singularity, Modernity, and the Formal Structure of Holocaust Comparison**

  **Research Question and Problem Statement**

  The debate regarding the singularity of the Holocaust and the sociological thesis that modernity made it possible are typically conducted in isolation. The former is treated as a normative and historiographical dispute, the latter as a matter of social theory. Yet both make the same formal move: they place the event inside a wider class. This project proceeds from the hypothesis that generalisation runs in two distinct directions, and that the difference between them has been left implicit. The research question is precise: under what formal conditions does generalising the Holocaust function as moral exculpation rather than critical implication?

  The aim is not a balanced survey of comparability but a determinate answer regarding the logical structure of the claim. My suspicion is that Ernst Nolte's appeal to the Gulag generalised laterally, setting the Holocaust alongside the crimes of another regime so that the burden of guilt was distributed. Jürgen Habermas's objection amounted to the claim that this redistributed rather than discharged responsibility, and so normalised the event. Conversely, Zygmunt Bauman generalises upward and inward, treating the Holocaust as an instance of a condition the analyst and the reader still inhabit, which implicates rather than distributes. If this asymmetry can be stated rigorously, it may explain why comparability is objectionable in one form and indispensable in another. It may also show what the sociological thesis has to give up in order not to lapse into the apologetic pattern it was never meant to serve.

  **Critical Context: Limits of Existing Positions**

  Existing positions leave this question open because they fail to address the directionality of the generalisation. Defenders of singularity often reject generalisation outright to preserve the event's moral gravity. However, by refusing classification, they inadvertently protect the Holocaust from sociological analysis, rendering it a metaphysical anomaly rather than a historical event. This protects memory but sacrifices explanatory power.

  Defenders of generic genocide comparison treat all comparison as equal. They argue that placing the Holocaust alongside other mass atrocities fosters universal human rights. Yet this approach often flattens specific mechanisms of destruction and ignores the moral vector of the comparison. It fails to distinguish between comparing to understand and comparing to exculpate.

  Functionalist historiography focuses on the mechanisms of destruction without necessarily engaging the normative implications of classification. By treating the Holocaust as a case of bureaucratic efficiency, it risks desensitising the moral horror without offering a framework to distinguish legitimate from illegitimate abstraction.

  Finally, the sociological modernity thesis, while powerful, remains vulnerable. If Bauman's claim that the Holocaust was made possible by ordinary features of modern rational-bureaucratic order is not rigorously distinguished from lateral comparison, it risks lapsing into apologetics. By suggesting modernity itself is the culprit, it can inadvertently diffuse specific German responsibility into a vague condition of modern life. Each position fails because it lacks a formal criterion for distinguishing the direction of the generalisation.

  **Methodology and Twelve-Month Plan**

  This is a conceptual project rather than an archival one. The dispute concerns the logical structure of arguments and the moral implications of classification, not the discovery of new documents. Archival work would reveal what happened; conceptual analysis reveals how we argue about what happened. The method involves logical reconstruction of key texts and the development of a typology of generalisation.

  *Months 1–3:* I will map the logical space of the singularity debate. This involves close reading of key interventions in the Historians' Dispute and subsequent social theory. The goal is to extract the implicit premises regarding classification used by both sides.
  *Months 4–6:* I will develop the typology of generalisation. I will define 'lateral' versus 'upward' generalisation formally. This involves distinguishing between claims that distribute responsibility across agents and claims that implicate structures inhabited by the analyst.
  *Months 7–9:* I will test the typology against live controversies. I will apply the criteria to three specific cases: the original Historians' Dispute, comparisons between colonial genocide and the Holocaust, and contemporary critiques of bureaucratic violence.
  *Months 10–12:* I will write up the findings. This includes drafting the monograph chapters and preparing two journal articles. The focus will be on articulating the conditions for legitimate generalisation.

  **Expected Outcomes and Conditions of Failure**

  A successful result will look like a test, or a small set of conditions, for distinguishing legitimate from illegitimate generalisation. This test will be applied to the controversies mentioned above. Success means demonstrating that lateral generalisation tends towards normalisation while upward generalisation tends towards implication, provided specific formal criteria are met. This would allow scholars to utilise sociological tools without triggering the moral alarms associated with relativisation.

  However, I must identify what would count as failure. There is a genuine possibility that the distinction collapses. For instance, every upward generalisation might be redescribed as a lateral one depending on the context. If claiming modernity is guilty simply shifts blame from Germans to 'moderns', then Bauman's move is merely a sophisticated lateral shift. Alternatively, the difference might turn out to rest on the speaker's intentions and audience rather than on the form of the claim. If the logic holds only when the audience is sympathetic, then the asymmetry is pragmatic, not conceptual. Acknowledging this possibility is crucial; if the distinction proves unstable, the project will conclude that the singularity debate cannot be resolved through formal logic alone.

  **Addressing the Political Objection**

  The most obvious objection is that the asymmetry is rhetorical or political rather than conceptual. Critics will argue that Nolte was objectionable because of his political aims, not his logical form, and that Bauman was acceptable because of his moral stance. Therefore, analysing the structure of the argument is futile. I meet this objection by arguing that political efficacy relies on conceptual coherence. If the logical structure of a claim inherently invites exculpation, good intentions cannot permanently safeguard it. By clarifying the conceptual structure, we provide a defence against political misuse. If the form of the argument itself distributes guilt, it will eventually be used to do so, regardless of the author's intent. Therefore, the conceptual work is a prerequisite for stable political judgement.

  **Scope and Limitations**

  A candid assessment of scope is necessary for a twelve-month fellowship. The primary risk is overextension in the testing phase. If twelve months proves too little, I will cut the number of case studies from three to two. I will prioritise the Historians' Dispute and the colonial comparison, as these offer the sharpest contrast between lateral and upward generalisation. The contemporary critique of bureaucratic violence may be deferred to a subsequent project. Additionally, I will limit the engagement with broader genocide theory to what is strictly necessary for the typology. The focus must remain on the formal structure of the Holocaust comparison, not on a general theory of genocide. This ensures the project remains deliverable within the fellowship period while maintaining argumentative rigour.
