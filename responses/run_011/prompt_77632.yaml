  Elias works quality control on a tablet assembly line. His task is to reject any unit with a surface scratch deeper than 50 microns (Condition C). Lighting is standard; Elias is rested and attentive. We consider a series of 100 tablets produced sequentially. Tablets 1–60 have 60-micron scratches. Tablets 61–70 have scratches tapering from 59 to 50 microns. Tablets 71–100 have no scratches. In cases 1–70, C obtains. In 71–100, C fails. Elias inspects each for ten seconds. In every case where C obtains (1–70), Elias correctly identifies the scratch and rejects the unit. In case 70 (the faintest scratch), Elias rejects the unit, knowing it is defective. However, aware that 50 microns is the limit of visual resolution, he refrains from judging that he *knows* it is defective, suspecting he might be guessing. He knows C, but does not know that he knows C.

  ### Analysis

  **Condition and Series**
  $C$ is the condition *the tablet has a scratch $\ge$ 50 microns*. The series $\alpha_1, \dots, \alpha_{100}$ orders tablets by scratch depth, decreasing by 0.1 microns per step. $C$ obtains in $\alpha_1 \dots \alpha_{70}$ and fails in $\alpha_{71} \dots \alpha_{100}$. $\alpha_{70}$ and $\alpha_{71}$ are perceptually indiscriminable to Elias, constituting the "near-miss."

  **Luminosity**
  $C$ is luminous because Elias's visual system is reliably calibrated to the 50-micron threshold. In every case $\alpha_1 \dots \alpha_{70}$, $C$ obtains and Elias forms a true belief via a reliable process, satisfying externalist conditions for knowledge.
  *Margin-for-Error Premise:* "If $S$ knows $C$ in $\alpha_i$, then $C$ obtains in any case $\alpha_j$ sufficiently similar to $\alpha_i$."
  In this construction, the premise holds for $i=1 \dots 69$. It ceases to apply at the transition from $\alpha_{70}$ to $\alpha_{71}$. Although $\alpha_{71}$ is similar to $\alpha_{70}$, it is not *sufficiently* similar to violate safety for first-order knowledge because Elias's belief-forming mechanism has a sharp cutoff in reliability at the 50-micron physical limit, even if phenomenology is gradual. The physical fact anchors the knowledge where the appearance fades.

  **KK Failure**
  In $\alpha_{70}$, Elias knows $C$ but does not know $KC$. The block is **doxastic**: Elias withholds belief in $KC$. He is aware of the sorites risk (the "near-miss" $\alpha_{71}$). While his first-order vision is reliable enough for knowledge, his meta-cognitive assessment is sensitive to the proximity of error. He believes $C$, but he does not believe that he knows $C$ because he cannot rule out the possibility that he is in $\alpha_{71}$ (where he would not know $C$).
  *Asymmetry:* First-order knowledge requires reliability (which he has). Second-order knowledge requires reliability *about* reliability (which he lacks, due to awareness of the boundary). The proximity of $\alpha_{71}$ undermines his confidence in his epistemic status without undermining the status itself.

  **Single Feature**
  The working feature is the **Meta-Cognitive Threshold**. Elias operates with a higher standard of evidence for attributing *knowledge* to himself than for forming first-order judgments.
  *Removal:* If this feature is removed (i.e., if Elias applies the same threshold to $C$ and $KC$), the case collapses. Either he claims $KC$ (restoring KK) or he withholds $C$ (destroying Luminosity). The separation depends entirely on the gap between his first-order confidence and his second-order caution.

  **Attacks and Comparison**
  1.  **KK Defender:** A proponent of KK (e.g., Hintikka) would argue that if Elias knows $C$, he is *in a position* to know $KC$. Elias's refusal to believe $KC$ is an irrational failure of reflection, not a genuine epistemic limit. Retreating to "position to know" saves KK by making it a normative claim rather than a descriptive one about actual belief.
  2.  **Anti-Luminosity Defender:** A Williamsonian would deny (1). They would argue that if $\alpha_{70}$ and $\alpha_{71}$ are indiscriminable, Elias cannot know $C$ in $\alpha_{70}$. The margin-for-error principle dictates that knowledge requires safety from error in nearby cases; since Elias believes $C$ in $\alpha_{70}$ and would believe $C$ in $\alpha_{71}$ (error), he knows $C$ in neither. Luminosity is impossible for non-trivial conditions.

  These are distinct objections. The KK attack accepts the case but disputes the verdict on iterated knowledge. The Anti-Luminosity attack denies the case is metaphysically possible. If only the KK attack succeeds, Luminosity and KK remain separable (Luminosity holds, KK fails). If the Anti-Luminosity attack succeeds, both fail. For your seminar, the conclusion is that **the theses are separable in principle**, but accepting Luminosity requires resisting Williamson's safety constraints on first-order knowledge. Your case demonstrates that *if* one grants luminosity for a specific condition, KK need not follow.
