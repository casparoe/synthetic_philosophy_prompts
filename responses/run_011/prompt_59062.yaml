      *   *Crucial Check:* Are these actually different predictions?
          *   For the Split Pair: If behavior is *identical* by stipulation, the disagreement is purely about *explanation*. This needs to be flagged as "Verbal/Explanatory Preference" unless we add a constraint about *evolvability* or *damage resistance*.
          *   Let's refine the Split Pair test: *Evolvability*. Can X evolve new behaviors faster than Y in a changing environment? A says yes (internal selection is faster). B says depends on the tunability parameter.

  6.  **Drafting Section 4: Verdict on Verbosity:**
