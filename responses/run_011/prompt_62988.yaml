answer: |-
  The air in the Archives tasted of recycled ozone and old paper, a scent Elara associated with the weight of the *Canticle*'s history. She sat before the console, the glow of the census logs reflecting in her eyes. Four hundred years of voyage data scrolled across the screen, reduced to rows of integers and welfare scores. She was the Senior Auditor, tasked with signing the Cohort Proposal for Census 400, the latest in a chain that stretched back to the Founding.

  She pulled up the historical summary. The Charter's constraints hovered in the margin of her mind, specifically the Continuity Clause: *No population proposal may be assessed against any census earlier than the one immediately preceding it.* It was a rule designed to prevent despair, to stop the living from grieving the golden age of the founders whose circumstances were, officially, incomparable.

  Elara traced the lineage of the Tally.

  **Founding Census (C0):** Population 10,000. Mean Welfare Score 9.0. Aggregate Tally 90,000.
  **Census 100 (C1):** Population 12,000. Mean Welfare Score 7.5. Aggregate Tally 91,000.
  **Census 200 (C2):** Population 15,000. Mean Welfare Score 6.5. Aggregate Tally 97,500.
  **Census 300 (C3):** Population 20,000. Mean Welfare Score 5.0. Aggregate Tally 100,000.
  **Census 400 (Proposal):** Population 35,000. Mean Welfare Score 3.0. Aggregate Tally 105,000.

  Every step was green. Every step showed an increase in the Tally relative to the previous census. By the logic of the Charter, the ship was thriving. Yet, looking at C0, Elara felt a hollow ache. The founders lived with nearly triple the quality of life of the proposed cohort. They had space, privacy, nutrient-rich vats, and art. The proposed cohort would live in stacked bunks, eating algae paste, their lives measured in shifts and maintenance cycles. The Founding Census was better on per-capita welfare, better on resource availability, and arguably better on every measure the ship still bothered to record, save for the raw, swelling integer of the Tally.

  A chime interrupted her reverie. Kael, a junior clerk, entered the archive bay. He looked haggard, holding a datapad like a shield.

  "Auditor Elara," he said, his voice tight. "I've found an anomaly in the Floor calculations for the proposed cohort."

  Elara gestured for him to approach. The Floor was the second pillar of their ethics, legislated alongside the Continuity Clause. *A legislated welfare score below which a life is not entered into the census as a positive quantity; such a life is recorded as a null entry, contributing nothing to the ship's aggregate tally, but also counting as no loss when it ends.*

  "Show me," Elara said.

  Kael projected a simulation. "Scenario A: We admit 1,000 new births. Projected mean score 4.0. The Floor is set at 2.5. All lives count. Tally contribution: 4,000."

  He swiped the screen. "Scenario B: We admit 5,000 new births. Projected mean score 2.6. Just above the Floor. Tally contribution: 13,000."

  Elara frowned. "Scenario B raises the Tally more than Scenario A."

  "Significantly more," Kael said. "But look at the quality. In Scenario B, the lives are barely worth living. They are existence on the brink of suffering. Yet, because they are above the null line, they are mathematically superior for the ship's metrics."

  He swiped again. "Scenario C: A catastrophe. A ventilation failure in Sector 7. It kills 500 people. In Scenario A, their scores were 4.0. The Tally drops by 2,000. In Scenario B, if the victims had scores of 2.6, the Tally drops by 1,300. But..." Kael hesitated. "If the victims fall below the Floor—say, a chronic illness cohort scored at 2.4—their deaths register as null entries. The Tally does not drop. It remains untouched. Technically, the ship's welfare aggregate improves per capita when the miserable die, provided they were below the line."

  Elara stared at the numbers. The perverse incentive was clear. To maximize the Tally, the ship should breed as many marginally-scored lives as possible and neglect those below the Floor, as their suffering and death were statistically invisible.

  "This is a defect," Elara said quietly. "Draft a revision. Raise the Floor to 4.0."

  Kael shook his head, defeated. "I tried. But the Continuity Clause blocks it. To raise the Floor now would re-evaluate the previous census. Thousands of lives currently counted as positive would become null. The Tally would crash from 105,000 to roughly 60,000. That is a decrease relative to the preceding census. The proposal would be refused. The ship cannot authorize a drop in Tally. We are locked into the Floor we inherited from C3."

  "We are locked into encouraging misery," Elara said.

  "We are locked into continuity," Kael corrected, and left her alone with the glow of the console.

  Later that cycle, Varis found her in the observation deck. Varis was a Proponent, responsible for drafting the cohort proposals. He leaned against the hull, looking out at the endless starfield.

  "You haven't signed," Varis said.

  "The numbers are clean," Elara replied. "The logic is sound. But the outcome is repugnant."

  "The outcome is survival," Varis countered. "The *Canticle* is a closed system. We cannot create new resources, only new people. If we restrict breeding to maintain high quality, the population ages, the workforce shrinks, and the ship fails. We must maximize the aggregate good."

  "Aggregate good?" Elara turned to him. "You mean the Tally. You believe what matters is how much good there is in the world, whoever happens to contain it."

  "Someone has to believe that," Varis said. "If not me, then who? You hold that no one can be wronged by being brought into a life worth living. That only actual, identifiable people can be better or worse off."

  "Correct," Elara said. "If a child is born into a life that is net-positive, even if it is meager, they are not harmed by being born. But if we choose to create a multitude of meager lives instead of a few flourishing ones, we are not benefiting anyone who would otherwise exist. We are swapping quality for quantity."

  "But the Tally rises," Varis insisted. "There is more welfare in the universe. More joy, more experience, more existence. Is that not valuable?"

  "It is valuable only if it is experienced by someone for whom it is good," Elara said. "But look at the Founding Census." She pulled the data up on her wrist comp. "Compare C0 to the Proposal."

  Varis glanced at it. "C0 had higher mean welfare. But fewer people."

  "Can you rank them?" Elara asked. "Is C0 better than the Proposal?"

  Varis shrugged. "The Tally says the Proposal is better."

  "Ask me," Elara said. "I am the Auditor. I must apply the person-affecting view. If I compare C0 to the Proposal, I must ask: Is anyone in the Proposal worse off than they would have been in C0?"

  "Yes," Varis said. "They have less space, worse food."

  "But they would not exist in C0," Elara said. "The specific people in the Proposal are the children of C3. If we had chosen the C0 path—restricting population to maintain quality—these specific people would never have been conceived. Their identities are contingent on the breeding policies of their parents. Therefore, no one in the Proposal is worse off than they would have been otherwise, because otherwise they would not be."

  Varis smiled thinly. "So you cannot condemn the Proposal."

  "And I cannot praise it," Elara said. "Because no one in C0 exists now to be better off. My principle delivers no ranking at all between the Founding and the Present. They are incommensurable. I cannot say the founders were better off, because they are dead. I cannot say the current crew are worse off, because they owe their existence to the decline."

  "Then the Total View wins by default," Varis said. "We maximize the good."

  "Does the line hold?" Elara asked. "The Floor. Why 2.5?"

  Varis stiffened. "It is the legislated threshold."

  "Why not 2.6? Why not 2.4?" Elara pressed. "If a life at 2.5 is worth living, and a life at 2.4 is null, what moral magic happens at that decimal? If I add a single unit of suffering to a 2.5 life, making it 2.4, does it cease to matter? Does the person vanish from the moral calculus?"

  "It is a sharp cutoff for administrative necessity," Varis said, his voice tightening. "We need a line."

  "A line drawn in sand," Elara said. "If you cannot defend why the line falls exactly there rather than one increment either side, then the Tally is built on vagueness. It is a measurement of nothing."

  Varis pushed off the hull. "The proposal needs your signature, Elara. The breeding vats are calibrated. If you refuse, the cohort is cancelled. Population declines. The Tally drops relative to C3. The Charter forbids it. You will be removed from office, and someone else will sign."

  "I know," Elara said.

  "Then sign. Preserve the continuity. We are four hundred years from Earth. We are not going back. We are only going forward."

  Elara returned to the Archives. The silence of the ship pressed against the hull. She thought of Kael's simulation, of the invisible deaths below the Floor. She thought of the founders, whose lives were inadmissible evidence. She thought of Varis, who believed he was saving humanity by filling the ship with souls who lived on the edge of nullity.

  She could refuse. She could break the chain. But the Continuity Clause was not just a rule; it was the structural integrity of the ship's society. To break it was to admit that the last four hundred years were a mistake. To admit that the Tally was a lie. If she refused, the system would collapse, not into ethics, but into chaos. The ship required the Tally to function. It required the illusion of progress.

  She picked up the stylus. Her hand hovered over the signature plate. She understood now that the Charter did not protect the people; it protected the numbers. The people were merely the vessels for the arithmetic.

  If she signed, the cohort would be born. They would live lives scored at 3.0. They would work, they would suffer, they would die. Some would fall below the Floor, and their deaths would not count. Their children would be proposed in Census 500, with scores of 2.5, and the Tally would rise again, and the quality would drop again, until the ship was full of ghosts who counted as numbers.

  If she refused, the Tally would drop. The system would flag the error. A new Auditor would be appointed. The proposal would be signed by someone who did not know the founders' scores, or who did not care. The result would be the same, but the honesty would be lost.

  Elara realized there was no correct theory to discover. There was only the ship, and the vote, and the cost. The cost of signing was her complicity. The cost of refusing was her irrelevance.

  She looked at the screen. The Proposal waited. *Population 35,000. Mean Welfare Score 3.0.*

  She thought of the Founding Census. 10,000 souls. Score 9.0. They were gone. They could not be wronged. The new souls could not be wronged, for they would not exist without this choice. There was no one to appeal to. There was only the Tally.

  Elara pressed the stylus to the plate. The system chimed, accepting the input. The breeding vats hummed to life in the depths of the ship, a sound like a slow heartbeat. She had chosen continuity over quality, existence over flourishing. She had chosen the math.

  She closed the log file. The screen dimmed, leaving only the summary line glowing in the dark room.

  Total Tally: 105,000.
