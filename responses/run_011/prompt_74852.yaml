answer: |-
  ### I. Sketching the Space of Candidate Principles

  Before committing, we must map the epistemological terrain. Your verdicts suggest you are rejecting naive inductivism (simple generalization) in favor of a hypothetico-deductive or Bayesian framework, likely influenced by the Processualist demand for systemic explanation but tempered by Post-Processual caution regarding meaning.

  Three candidate families present themselves:

  1.  **The Intentionality Principle:** Inferences to belief are licensed only when the artifact *must* be the product of conscious symbolic intent.
      *   *Failure:* This fails your Case 6 (burned grain). The burners did not intend to create an archaeological pattern for us to find, yet you license an inference to a "coordinated event." It also struggles with Case 3 (weights), which may be habitual rather than consciously "symbolic."
  2.  **The Uniformitarian Principle:** Inferences are licensed only if the link between cause and effect is observed in the ethnographic present.
      *   *Failure:* This is too restrictive for Case 1 (extinct animals). We have no ethnographic parallel for depicting locally extinct fauna, yet you license the inference. It also struggles to distinguish Case 2 from Case 3 without ad hoc adjustments.
  3.  **The Probabilistic Coordination Principle:** Inferences are licensed based on the improbability of the pattern arising from independent agents or natural processes (Signal-to-Noise).
      *   *Promise:* This aligns with your physics background. It treats social structures as "constraints" that reduce the entropy of human behavior. It handles the "Defeating Pairs" well: Weights (Case 3) require coordination (low entropy); Doorways (Case 2) can be independent responses to sun/wind (higher entropy).

  I will commit to a refined version of the third family. It treats archaeological inference as a problem of **excluding independent convergence**.

  ### II. The Principle of Non-Trivial Coordination (PNC)

  **Statement:** An inference to a shared social or cognitive structure (Institution, Belief, Rank) is licensed if and only if the observed regularity is statistically improbable under a null hypothesis of independent agents optimizing for local functional utility or environmental adaptation.

  This principle operates via two ranked clauses:

  1.  **The Functional Exclusion Clause:** If a pattern can be generated by individual adaptation to local environmental constraints, inference is limited to those constraints. Inference to a shared normative rule is licensed only if the pattern requires inter-agent agreement to function.
      *   *Motivating Case:* **Case 2 vs. Case 3.** Doorway azimuths (Case 2) can be independent responses to sun or wind (local utility). Stone weights (Case 3) cannot function as weights across sites without shared agreement (inter-agent coordination). Thus, Case 2 licenses "Template," while Case 3 licenses "Institution."
  2.  **The Representational Fidelity Clause:** Inference to specific cognitive content (Story/Belief) is licensed only if the representation contradicts observable empirical reality or requires information transmission not guaranteed by proximity.
      *   *Motivating Case:* **Case 1 vs. Case 7.** Figurines of extinct animals (Case 1) contradict empirical reality; they require shared "story" to exist. Pottery motifs (Case 7) can drift or be independently invented over 800km; transmission is not required. Thus, Case 1 licenses "Belief," Case 7 licenses "Nothing."

  *Auxiliary Clauses (derived from remaining cases):*
  *   **Statistical Robustness:** A pattern must exceed a threshold of repetition to distinguish normative rule from stochastic accident. (Motivated by **Case 4**).
  *   **Causal Specificity:** Inference extends to the *physical coordination* of an event, but not to *semantic motive* if multiple motives produce identical physical traces. (Motivated by **Case 6**).

  ### III. Application to New Cases

  Here I apply the PNC to your three unlisted scenarios.

  1.  **Pollen concentrated in a temple precinct.**
      *   *Analysis:* High concentration exceeds natural background dispersal (Null Hypothesis rejected). However, pollen type matters. If it is a crop not grown locally, it implies importation (Coordination). If it is local weed pollen, it implies storage or decay (Functional).
      *   *License:* **License to infer deliberate deposition or storage (Event).** No license to infer specific deity or ritual type without iconographic association (Causal Specificity).
  2.  **A vessel mended through drilled repair holes.**
      *   *Analysis:* Null Hypothesis = Discard and replace. Drilling requires effort > replacement cost in most contexts.
      *   *License:* **License to infer scarcity or high sentimental/symbolic value.** This is a constraint on economic rationality. It indicates the object had a "biography" exceeding its utility function.
  3.  **A substantial building left unfinished.**
      *   *Analysis:* Null Hypothesis = Planned small structure. "Substantial" implies intent to complete. Cessation implies disruption.
      *   *License:* **License to infer systemic disruption (War, Plague, Political Collapse).** No license to choose between specific causes (Causal Specificity), as multiple disruptions halt labor identically.

  ### IV. The Mismatch and Recommendation

  I must state plainly where the Principle of Non-Trivial Coordination strains against your intuitions.

  **The Mismatch: Case 5 (Tool in Male Graves).**
  *   *Your Verdict:* License to speak of mortuary practice; **none** about who used the tool in life.
  *   *PNC Prediction:* The PNC identifies the "Shared Social Structure" generating the pattern. The pattern is "Tools associated with Males." The most parsimonious shared structure is a "Gendered Division of Labor/Identity." While the PNC agrees we cannot be *certain* about life-use, it suggests a **probabilistic license** to infer life-use. In almost all ethnographic analogues where mortuary goods are gendered, life-roles are also gendered. The PNC views the mortuary sphere as a signal of the broader social structure, not a closed semantic system.
  *   *The Conflict:* Your verdict demands a hard epistemic stop ("None"). The PNC suggests a soft Bayesian update ("Probable, but not certain").

  **Recommendation:**
  You should **complicate the principle**, not abandon the verdict.

  Your verdict in Case 5 is methodologically sound (it prevents the "Pots = People" fallacy), but it relies on an auxiliary assumption not contained in the core PNC. You should add a **Contextual Containment Clause**:

  > *Inferences are bound to the context of formation. Patterns generated in mortuary contexts license inferences to mortuary norms; inferences to life-behaviors require independent bridging assumptions (e.g., wear analysis on the tool itself).*

  **Why this is necessary:**
  As a physicist, you know that measuring a system often perturbs it. Death is a phase transition. The "state" of an object in a grave is not identical to its "state" in life. The PNC correctly identifies the *coordination* (the burial rite), but without the Containment Clause, it risks over-extending the inference to the *pre-transition state* (life).

  By adding this clause, you preserve your rigorous skepticism in Case 5 while maintaining the explanatory power of the PNC for the other six cases. You effectively treat "Mortuary Context" as a distinct thermodynamic system where the rules of inference differ from the "Domestic Context." This honors your intuition that the grave is a statement about *identity*, which is not always a statement about *activity*.
