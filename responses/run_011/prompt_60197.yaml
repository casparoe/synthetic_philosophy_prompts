answer: |-
  Here is a principle constructed to deliver the coherence you seek, followed by the specific applications and analyses you requested.

  ### The Principle of Diachronic Endorsement

  **Statement:**
  An agent's relationship to a disposition or act is rational if and only if it satisfies the following hierarchy:

  1.  **Ex Ante Adoption:** A disposition is rational to adopt if and only if possessing it yields higher expected lifetime utility than lacking it, *given the responses of others*. (Motivated by Cases 1, 3, 4, 5).
  2.  **Psychological Possibility:** An intention is rational only if the agent believes the intended act is possible. One cannot intend what one knows one will not do. (Motivated by Case 2).
  3.  **Ex Post Evaluation:** An act flowing from a disposition is rational if:
      *   (a) It maximizes utility given the agent's *current* preferences; OR
      *   (b) It preserves the integrity of a *self-installed* plan or commitment, where the value of diachronic consistency outweighs the local utility loss. (Motivated by Case 5).
      *   If the disposition was *externally selected* or does not involve a plan requiring stability, the act is irrational if it fails (3a), even if the disposition is admirable. (Motivated by Case 1).

  **Reasoning:**
  This principle distinguishes between **strategic traits** (which make you a better bargainer) and **constitutive commitments** (which make you a stable agent). It allows that a disposition can be rational to have (Clause 1) while the specific act it produces is irrational (Clause 3, Case 1), *unless* the act is required to maintain the integrity of a self-authored plan (Clause 3b, Case 5).

  ---

  ### Verdicts on New Cases

  **1. Whether payment in Case 1 becomes rational if the driver can trace me.**
  **Verdict: Rational.**
  **Reasoning:** Clause 3(a). If the driver can trace you, non-payment incurs a penalty (reputation loss, legal action, retaliation). The utility calculation at the moment of payment changes: Cost(Payment) < Cost(Traceable Punishment). The act now maximizes utility given current preferences (avoiding punishment). It shifts from a "free rider" problem to a standard enforcement problem.

  **2. Whether it is rational to undergo a painless procedure that installs a costly-promise-keeping disposition visible to everyone, even if I would end up worse off than if I declined.**
  **Verdict: Irrational.**
  **Reasoning:** Clause 1. Ex Ante rationality is determined by expected lifetime utility. If the prompt stipulates you end up *worse off* overall by having the disposition (presumably because the costs of keeping promises outweigh the benefits of being offered rides), then adopting the disposition fails the primary test of rational adoption. You are purchasing a handicap that others exploit without sufficient compensation.

  ---

  ### The Simplest Coherent Account

  To achieve the simplest coherent account, you must drop the verdict in **Case 5** regarding the *act* of not abandoning the project.

  **The Account:** **Standard Instrumental Rationality.**
  *   **Principle:** An act is rational if and only if it maximizes expected utility at the time of acting. A disposition is rational if and only if adopting it maximizes expected lifetime utility.
  *   **Application to Case 5:** Installing the attachment was rational (Ex Ante). However, at the moment of decision, abandoning the project serves the agent better. Therefore, *not abandoning* is irrational (a sunk cost fallacy), even if it flows from a rationally adopted state.
  *   **The Cost:** You lose the normative force of **commitment**. You cannot explain why keeping a promise or finishing a plan is ever *rational* when breaking it yields a better outcome; you can only say it is *admirable* or *praiseworthy* (as in Case 1). This collapses the distinction between Case 1 and Case 5 entirely. Both become cases of "Rational Disposition, Irrational Act."

  ---

  ### The Distinction: Self-Installed vs. Merely Possessed

  **Does it have content?**
  **Yes.** It distinguishes between **Preference Change** and **Behavioral Constraint**.

  *   **Case 1 (Merely Possessed/Selected):** The disposition acts as a *constraint*. You still prefer to keep the money (your utility function is unchanged), but you are compelled to pay. Because the act contradicts your current preferences, it is instrumentally irrational. You are a slave to a trait that benefits your past self but costs your present self.
  *   **Case 5 (Self-Installed):** The disposition acts as a *preference changer*. The "irrational attachment" means you now *value* finishing the project more than the alternative. Because the act (staying) aligns with your *current* (altered) preferences, it satisfies Clause 3(a). Furthermore, because you authored the change to secure a long-term goal, Clause 3(b) grants it additional rational weight as a matter of integrity.

  **Should it be dropped?**
  If you adopt the **Simplest Coherent Account** (Standard Instrumentalism) described above, **yes, it should be dropped.** In that view, all that matters is the utility at $t_2$. Whether you installed the preference or were born with it is irrelevant; if the act doesn't maximize utility now, it's irrational.
  However, if you wish to preserve your Case 5 verdict, the distinction **must be kept**. It is the only lever that allows the act in Case 5 to be "rational full stop" while the act in Case 1 remains "irrational."

  ---

  ### Public Recommendability

  **Can the principle be recommended publicly?**
  **No.**

  **Reasoning:**
  Your intuition regarding Case 4 ("this should not be said out loud") identifies a **Self-Defeat Condition**.
  The Principle of Diachronic Endorsement relies on the opacity of the agent's motives to function.
  *   In Cases 1, 3, and 4, the payoff exists only because others believe you are *constrained* (unable to act instrumentally).
  *   If you publicly recommend the principle, you reveal that your "constraints" are actually calculated strategies adopted for profit.
  *   Once others know you are following a principle that tells you to cultivate irrationality *for gain*, they will treat your threats as bluffs (Case 3) and your promises as insincere (Case 1). The dispositions will stop paying off.

  Therefore, the principle is **esoteric**. It is rational for you to follow it, but irrational for you to preach it. To maintain the benefits of the dispositions, the community must believe that agents act on the dispositions *intrinsically*, not instrumentally. Publicizing the principle destroys the very conditions that make the dispositions rational to adopt.
