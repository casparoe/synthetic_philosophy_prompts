answer: |-
  # Q&A Sheet: Endurantism Defense

  **Context:** Departmental Seminar.
  **Position:** Multilocational Endurantism + Indexed Intrinsics + Eternalist/UC Background.
  **Audience:** 4 x 4Dists (2 Stage), 1 Phil Phys, 1 Presentist, 2 Grads.

  ---

  ### The Objections (Ordered by Damage Potential)

  **1. The Philosopher of Physics (Lorentz Invariance)**
  *Objection:* "You claim ordinary objects are multilocated at every time they exist. But in Special Relativity, 'every time' implies a foliation of spacetime into simultaneity slices. There is no Lorentz-invariant way to slice spacetime. If your multilocation is frame-dependent, the object's existence is frame-dependent, which violates the spirit of eternalism. If it's frame-independent, you require a privileged foliation, which contradicts current physics. Which is it?"
  *Reply:* "I accept a B-theory where spacetime is the fundamental manifold. My 'times' are not fundamental ontological primitives but derivative hypersurfaces. Multilocation is a relation between an object and spacetime regions, not a slicing operation. I can accommodate relativity by treating the location relation as holding between the object and *any* maximal achronal slice it intersects, without privileging one frame. The object is wholly present relative to a frame, not absolutely."
  *Candid Note:* **Thin.** This leans heavily on "relative to a frame," which risks making the object's existence frame-relative (violating eternalism) or forces me to admit a privileged frame (violating physics). Under pressure, I must concede that my view is incompatible with standard SR unless I adopt a neo-Lorentzian interpretation or a specific metaphysics of spacetime (e.g., Maudlin's primitivism) that the Phil Phys will likely reject.

  **2. The Graduate Student (Lewis's Temporary Intrinsics)**
  *Objection:* "You solve temporary intrinsics by positing properties like *being-bent-at-t*. But Lewis argued these aren't intrinsic properties; they are relations to times disguised as monadic properties. If *being-bent-at-t* is intrinsic, how can the same object have *being-straight-at-t'*? You haven't explained change; you've just indexed the contradiction away."
  *Reply:* "I deny the dichotomy that a property must be either a relation or a non-indexed intrinsic. *Being-bent-at-t* is a fundamental, monadic property of the object. It is intrinsic because it concerns only the object's nature at that location. Change is the instantiation of incompatible indexed properties by the same numerically identical subject. The 'relation' is not part of the property's content; the time is a parameter of instantiation, not a relatum."
  *Candid Note:* **Thin.** This is a brute posit. If pressed on *why* this isn't relational, I have no analysis of 'instantiation' to offer other than 'primitive instantiation.' I risk collapsing into the very relational view I reject, or admitting that 'intrinsic' is being used in a non-standard way that begs the question against Lewis.

  **3. The Four-Dimensionalist (Mereological Incoherence)**
  *Objection:* "You accept Unrestricted Composition but deny that the fusion of your temporal slices is a part of you. But if the fusion exists, and you are wholly located at the regions the fusion spans, what distinguishes you from the fusion? Your parthood constraint—that parts must be located nowhere outside the whole—seems gerrymandered specifically to block perdurance. Why isn't the fusion just you, extended?"
  *Reply:* "Because parthood requires location containment. The fusion is located at the union of disjoint regions. I am located at *each* of those regions wholly. The fusion has a scattered location; I have a multilocated one. These are distinct modes of location. Since I deny that scattered location entails having parts at the scattered sub-regions, the fusion exists but is not me, nor are its 'segments' my parts."
  *Candid Note:* **Thin.** This relies entirely on the distinction between 'scattered location' and 'multilocation.' If the audience treats multilocation as just a linguistic variant of scattered location (which many do), my distinction collapses. I have to insist on a primitive difference in the location relation that may look like wordplay.

  **4. The Presentist (Ontological Vacuum)**
  *Objection:* "You build your indexed properties and multilocation on 'times' and a 'B-theory background.' But only the present exists. Your 't' variables range over nothing. You aren't solving the problem of persistence; you're solving a problem that doesn't exist by populating the world with non-existent times. Why not just say objects have tensed properties?"
  *Reply:* "Because tensed properties require a dynamic view of time that conflicts with the static structure of modern physics and the B-theory I accept for independent reasons. My 't's are coordinates in the spacetime manifold, which is as real as the spatial manifold. Denying their reality denies the reality of spatial locations. I offer an ontology compatible with the block universe, which your view is not."
  *Candid Note:* **Thin.** I cannot convince a Presentist of the block universe in a Q&A. This reply simply restates my background commitment. If the Presentist is right, my entire framework is category-error nonsense. I have to concede that my view is unintelligible *given their presuppositions*, which is dialectically weak.

  **5. The Four-Dimensionalist (The Counting Problem)**
  *Objection:* "If you are wholly located at t1 and wholly located at t2, and I count the objects in the spacetime manifold, do I count you once or twice? If once, how do you account for the causal interactions between t1-you and t2-you? If twice, you've admitted temporal parts by another name."
  *Reply:* "You count me once. I am a single entity multilocated. Causal interaction is not between t1-me and t2-me as distinct entities, but between the state of the manifold at region t1 and region t2, mediated by me. The causal chain is continuous through the manifold; my multilocation is the metaphysical grounding of that continuity, not a duplication of entities."
  *Candid Note:* **Thin.** "Mediated by me" is vague. If I am wholly at t1, and wholly at t2, what prevents t1-me from causally affecting t1-me? I need a robust account of how multilocation doesn't lead to self-interaction paradoxes. I risk having to introduce a 'no self-interaction' brute fact.

  **6. The Stage Theorist (Theoretical Virtue)**
  *Objection:* "We both agree on the spacetime manifold. I say 'person-stage' exists at t1. You say 'person' exists at t1. Your view requires a mysterious multilocation relation; mine requires only standard location. Why should we accept the mystery? Isn't this a verbal dispute where I get all the benefits without the cost?"
  *Reply:* "It's not verbal because our truth conditions for 'I will exist tomorrow' differ. For you, it's about counterpart relations between distinct entities. For me, it's about numerical identity. The 'cost' of multilocation is outweighed by the benefit of preserving strict identity through time, which matters for moral responsibility and survival. Your view dissolves the very concern that makes persistence philosophically interesting."
  *Candid Note:* **Thin.** This appeals to intuition about responsibility, which a Stage Theorist will say they can handle via counterpart theory. I am claiming a benefit (identity) that they deny is necessary. I risk looking like I'm privileging folk intuition over theoretical parsimony.

  **7. The Graduate Student (Coincidence)**
  *Objection:* "Consider a statue and the clay. Both are wholly located at t1. Both are wholly located at t2. On your view, they share all their parts and locations. What grounds their distinctness? If you say 'modal properties,' you've reintroduced temporal parts via the back door of modal space."
  *Reply:* "They are distinct because they have different persistence conditions, grounded in their sortal concepts, not their parts. Since I deny parts are the primary ontological unit, the statue and clay can coincide without being identical. Their distinctness is primitive, not grounded in temporal composition. This is a cost, but less than the cost of denying their distinctness."
  *Candid Note:* **Thin.** "Primitive distinctness" is a notorious stopgap. If they share all locations and all parts (since they have no temporal parts), the Indiscernibility of Identicals threatens me. I have to deny that persistence conditions supervene on location and parthood, which is a heavy metaphysical load.

  **8. The Four-Dimensionalist (Causal Continuity)**
  *Objection:* "If the object at t1 is numerically identical to the object at t2, what explains the qualitative continuity? In perdurance, it's causal connection between parts. In your view, it's just 'the same thing.' That's not an explanation; it's a restatement."
  *Reply:* "The explanation lies in the laws of nature governing the spacetime region. The object's continuity is not a further fact over and above the continuity of the properties instantiated at the locations. I don't need causal links between *parts* because there are no parts. The causal story is told at the level of property instantiation across the manifold."
  *Candid Note:* **Thin.** This pushes the causal burden entirely onto the laws of physics, making the metaphysics of the object passive. It risks making the object epiphenomenal to the spacetime structure.

  **9. The Stage Theorist (Semantic Ascent)**
  *Objection:* "When you say 'I am wholly at t1,' do you mean the word 'I' refers to the multilocated entity, or the stage? If the multilocated entity, how do you explain the semantics of temporal predication without counterparts?"
  *Reply:* "The word 'I' refers to the multilocated entity. Temporal predication is handled by the indexed properties. I don't need counterparts because the subject of the predication remains constant. The semantics are simpler: Subject + Indexed Property, rather than Subject + Counterpart Relation + Property."
  *Candid Note:* **Thin.** This ignores the complexity of quantifying into temporal contexts. If I say "I was bent," and I am wholly present now, how does the past tense operator work without shifting the reference to a past stage? I may be forced to admit tense operators act like quantifiers over times, which looks like perdurantism semantics.

  **10. The Presentist (The Illusion of Change)**
  *Objection:* "If you instantiate *being-bent-at-t1* and *being-straight-at-t2*, and both facts eternally exist in the B-block, nothing *changes*. Change requires the coming into being of new facts. You have a static distribution of indexed properties. That's a picture, not a process."
  *Reply:* "Change is the variation of properties across the time parameter, not the 'coming into being' of facts. The B-theory captures the reality of change as difference across the manifold. Your 'process' view requires a moving now, which is incoherent. My view preserves the reality of difference without the myth of passage."
  *Candid Note:* **Thin.** This concedes the Presentist's main point: there is no *dynamic* change. I am defending a static view of change. If the audience feels dynamic change is essential to the concept, I have lost the concept, even if I saved the ontology.

  ---

  ### Load-Bearing Objections

  If my replies to these two fail, the view collapses entirely.

  1.  **The Philosopher of Physics (Objection #1):**
      *   **Why:** My commitment to multilocation (Commitment 1) requires a coherent definition of "location" across spacetime. If Special Relativity renders "wholly located at a time" physically incoherent (due to the lack of absolute simultaneity), my ontology is physically impossible.
      *   **Risk:** My reply relies on "relative to a frame." If this implies the object's existence is frame-relative, I violate Eternalism. If I posit a privileged frame, I violate Physics. I have no third option ready that satisfies both.

  2.  **The Four-Dimensionalist (Objection #3 - Mereological Incoherence):**
      *   **Why:** My Commitment 3 (Unrestricted Composition + No Temporal Parts) relies on a non-standard definition of parthood. If the fusion of my temporal slices exists (by UC) and is located where I am located, the distinction between "me" and "the fusion" becomes untenable.
      *   **Risk:** If I cannot motivate the distinction between "multilocated whole" and "scattered fusion" without circularity, I am forced to admit that the fusion *is* the object, which makes me a Perdurentalist. This commitment is the specific mechanism I use to block the 4D conclusion; if it breaks, I am a 4Dist.

  ### Hidden Weaknesses in Commitments

  The audience is likely to focus on the standard debates (Intrinsics, Relativity), but these technical vulnerabilities are where the view is most fragile:

  1.  **Commitment 2 (Indexed Properties):** I claim to reject the "relational analysis" but accept *being-F-at-t*. The hidden weakness is that **instantiation itself becomes a relation.** If an object instantiates *being-bent-at-t*, the instantiation relation connects the object, the property, and the time. I claim the *property* isn't relational, but the *fact* is. Under pressure, I may have to admit that 'instantiation-at-a-time' is a primitive ternary relation, which looks suspiciously like the "having a property at a time" notion I explicitly rejected in my setup.
  2.  **Commitment 3 (Parthood Constraint):** I hold that "parthood requires that the part be located nowhere outside the region of the whole." The hidden weakness is **transitivity.** If *a* is part of *b*, and *b* is part of *c*, is *a* part of *c*? If I have no temporal parts, but there exists a fusion of me-and-my-chair, is the chair part of that fusion? If yes, does the fusion have temporal parts? My constraint blocks the fusion from being *my* part, but it creates a fragmented mereology where standard transitivity rules may fail depending on how regions overlap. A mereologically savvy grad student could trap me in a parthood loop.

  ### The Dreaded Question

  **"On your view, what determines the *granularity* of the 't' in your indexed properties?"**

  *   **Why I dread it:**
      *   If I say "arbitrary slices," then *being-bent-at-t* and *being-bent-at-t+epsilon* are distinct properties. This leads to an explosion of properties and makes change continuous in a way that threatens the identity of the object (too many properties).
      *   If I say "natural joints" or "atomic times," I am committed to a discrete spacetime or privileged metaphysical atoms, which the Phil of Physics will attack as physically unmotivated.
      *   If I say "it doesn't matter," I undermine the specificity of the indexed properties solution to temporary intrinsics (if the property is *being-bent-at-any-time-in-interval*, it's not a specific intrinsic).
      *   **My lack of equipment:** I have not worked out the mereology of time in relation to my indexed properties. I treat 't' as a variable, but its ontological status (point, interval, frame-relative slice) is the exact point where my Metaphysics (Commitment 1 & 2) collides with Physics (Audience Member 1). I have no principled answer that doesn't either commit me to discrete time or an infinity of properties.
