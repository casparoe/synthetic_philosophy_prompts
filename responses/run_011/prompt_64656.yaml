  **Visiting Hours**

  She whispers half a NAME, then lets it fade.
  They keep a laminated LIST by the door.
  Sunlight moves slowly across the warm ROOM.
  Her fingers move as if to COUNT the beads.
  This chair beside her is the only REAL.
  The paper never holds the WHOLE of us.

  We try to make a WHOLE from broken days.
  She calls me by my father's given NAME.
  The warmth upon her hand is distinct, REAL.
  She writes a ghost upon the mental LIST.
  Her mind will always COUNT one more than shown.
  No wall can hold the edges of the ROOM.

  The hallway noise never enters the ROOM.
  No sum of infinite minutes makes a WHOLE.
  I lose the COUNT of Sundays in the year.
  She speaks a forgotten family NAME.
  Every entry on the printed LIST is wrong.
  The love between us is the only REAL.

  What feels most REAL changes with the passing light.
  We map the familiar corners of the ROOM.
  She finds a fault in every printed LIST.
  Seeking a WHOLE picture of her own past.
  I sign a guest-book NAME beside the rest.
  The numbers never COUNT the way she sees.

  If you COUNT the faces, one is always new.
  Something more REAL arrives than what is planned.
  She conjures up a missing family NAME.
  Filling the space beyond the walls of the ROOM.
  Still not the WHOLE story she can tell me.
  Extending her own invisible LIST.

  The laminated LIST is dry and cold.
  But here the COUNT includes the unseen guest.
  We seek a WHOLE that paper cannot hold.
  Is this single moment any less than REAL?
  Shadows lengthen across the polished ROOM.
  She speaks my NAME as if I just arrived.

  She writes a NAME upon the sheet outside the ROOM.
  The COUNT matches the REAL heads on the LIST.
  Every single person fits into the WHOLE.

  ***

  The first six stanzas are spoken from inside the room, where the mother's subjective experience generates a person who cannot be captured by the administrative list. The envoi shifts to the corridor's perspective, where the clipboard's tally is objectively correct and everyone is accounted for. Both viewpoints are presented as true within their own contexts, without suggesting one invalidates the other. The "procedure" implied in the stanzas is the mother's act of altering every entry on the list to produce a new identity, mirroring the diagonal argument without naming it.
