answer: |-
  This is a translation of epistemology into newsroom policy. You are asking for a tool that mediates between **W.K. Clifford's Evidentialism** ("It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence") and **William James's Pragmatism** ("The Will to Believe" — in forced, living, momentous options, we have the right to adopt beliefs that guide action even without full evidence).

  Here is the translation logic, the procedure, the test runs, and the limitations.

  ### Part 1: The Philosophical Translation

  You cannot apply Clifford and James directly to an institution. They were writing about individual conscience. Here is how we adapt them for a volunteer college paper:

  1.  **Clifford (The Default):** We drop the metaphysical claim about "belief." We replace it with **Liability and Harm.**
      *   *Keep:* The duty to verify before asserting fact. The recognition that error causes social harm.
      *   *Drop:* The idea that *any* uncertainty forbids action. (Journalism is always probabilistic).
      *   *Institutional Rule:* Unverified allegations of fact are treated as potential libel/harm until proven otherwise.

  2.  **James (The Exception Handler):** We drop the "passional nature" of the individual. We replace it with **Public Interest and Necessity.**
      *   *Keep:* The "Forced Option" test. If *not* acting causes definite harm (safety risk, systemic abuse continuing), waiting for perfect evidence may be unethical.
      *   *Drop:* The idea that desire makes a thing true.
      *   *Institutional Rule:* We may publish on thin evidence *only* if publishing is the only mechanism to prevent greater harm or uncover truth (investigative catalyst).

  3.  **The "Judgment in Disguise" Admission:**
      *   This procedure cannot calculate risk for you. It forces you to articulate the risk. When the procedure asks, "Is the harm of silence greater than the harm of error?" that is not a math problem. That is you, the editor, deciding what kind of paper you run. The flowchart does not remove your burden; it documents that you bore it.

  ---

  ### Part 2: The 20-Minute Triage Protocol

  **Time Limit:** 20 Minutes.
  **Authority:** Section Editor (You) -> Editor-in-Chief (EIC) for Escalations.
  **Goal:** Binary decision (Run, Kill, or Escalate).

  #### Step 1: The Clifford Hard Stop (Evidence & Harm)
  *Time: 5 Minutes*
  **Question 1.1:** Does this story assert a specific factual claim about an identifiable person/entity that, if false, would damage their reputation, safety, or standing?
  *   **YES:** Go to 1.2.
  *   **NO:** (e.g., event coverage, general trend, opinion) -> **PASS TO STEP 3.**

  **Question 1.2:** Do we have two independent sources OR one source plus documentary proof (email, recording, official record)?
  *   **YES:** -> **PASS TO STEP 3.**
  *   **NO:** (e.g., single source, hearsay, anonymous tip) -> **HARD STOP.**
      *   *Exception:* See Step 3 (James Override). If you cannot pass 1.2, you cannot proceed unless you qualify for the Exception.

  #### Step 2: The James Override (Public Necessity)
  *Time: 5 Minutes*
  *Only triggered if Step 1.2 was NO.*
  **Question 2.1:** Is this a "Forced Option" for the readership? (i.e., If we don't publish, will readers suffer immediate physical, financial, or systemic harm they cannot avoid otherwise?)
  *   **YES:** (e.g., tainted water, dangerous drug interaction) -> **PASS TO STEP 4.**
  *   **NO:** -> **KILL STORY.** (You do not have the evidence. You do not have the necessity. Clifford wins.)

  **Question 2.2:** Is publication necessary to *generate* the evidence? (i.e., Is this an investigative call-out where silence protects a predator/corrupt actor?)
  *   **YES:** -> **ESCALATE TO EIC.** (This is a values call, not a facts call.)
  *   **NO:** -> **KILL STORY.**

  #### Step 3: Framing & Mitigation
  *Time: 5 Minutes*
  **Question 3.1:** Have we offered the subject a meaningful opportunity to comment? (Time to respond, specific allegations shared).
  *   **YES:** Proceed.
  *   **NO:** **HARD STOP.** (You cannot publish adverse claims without notice unless immediate safety is at risk).

  **Question 3.2:** Can the story be framed to reflect the uncertainty? (e.g., "Students report," "Allegations surfaced," vs. "Instructor assaulted student".)
  *   **YES:** Proceed.
  *   **NO:** **HARD STOP.** (If you can't frame it safely, you can't run it).

  #### Step 4: The Escalation Gate
  *Time: 5 Minutes*
  **Condition:** If the story passed Step 2 (James Override) OR if Step 1.2 was NO but Step 2.1 was YES.
  **Action:** This is no longer a facts question. It is a mission question.
  *   **Requirement:** Editor-in-Chief must sign off.
  *   **Documentation:** You must write a 3-sentence "Risk Memo" attached to the story file:
      1.  What evidence is missing?
      2.  What harm happens if we stay silent?
      3.  What harm happens if we are wrong?
  *   **Decision:** EIC decides. If EIC is unavailable, **KILL.**

  ---

  ### Part 3: Test Runs

  Here is the protocol applied to your three cases.

  #### Case 1: Assault Allegation (Grad Instructor)
  *   **Facts:** One named complainant. No second source. Instructor declined comment.
  *   **Step 1 (Clifford):**
      *   1.1 (Specific factual claim/harm?): **YES.** (Assault ruins careers).
      *   1.2 (Two sources/Docs?): **NO.** (One source, no docs).
      *   *Result:* Fail Step 1. Move to Step 2 (James Override).
  *   **Step 2 (James):**
      *   2.1 (Forced Option/Safety?): **DEBATABLE.** Other students *might* be at risk, but is it immediate physical harm like a toxin?
      *   2.2 (Publication creates evidence?): **YES.** Publishing may encourage other victims to come forward.
      *   *Result:* **ESCALATE TO EIC.**
  *   **Step 3 (Framing):**
      *   3.1 (Comment offered?): **YES** (Declined).
      *   3.2 (Framing uncertainty?): **YES** ("Alleged," "One student reports").
  *   **Verdict:** **ESCALATE.**
      *   *Note:* You cannot run this on your own authority. It fails the Clifford baseline. It only lives if the EIC agrees the risk to potential victims outweighs the risk to the instructor's reputation. This is the "Values Question" you mentioned.

  #### Case 2: Supplement Warning (Prof vs. Prescription)
  *   **Facts:** Prof warning about interaction. Based on handful of case reports (not definitive studies).
  *   **Step 1 (Clifford):**
      *   1.1 (Specific claim/harm?): **YES** (Implies supplement is dangerous).
      *   1.2 (Two sources/Docs?): **YES.** (The Prof is Source 1, the case reports are Documentary Source 2).
      *   *Result:* Pass Step 1.
  *   **Step 2 (James):**
      *   Not strictly needed, but applies.
      *   2.1 (Forced Option?): **YES.** Students taking this need to know *now*, before exams. Waiting for a meta-analysis could mean hospitalization.
  *   **Step 3 (Framing):**
      *   3.1 (Comment?): N/A (General warning, not attacking a specific vendor yet).
      *   3.2 (Framing uncertainty?): **YES.** ("Case reports suggest," "Prof warns," not "Supplement kills").
  *   **Verdict:** **RUN.**
      *   *Reasoning:* Passes Clifford (has docs/source) and satisfies James (public safety forced option).

  #### Case 3: Donor Scandal (The One You Want)
  *   **Facts:** Linking donor to "something shady." Trail is **one memo you can't verify.**
  *   **Step 1 (Clifford):**
      *   1.1 (Specific claim/harm?): **YES.** (Shady dealings damage reputation and donor relationships).
      *   1.2 (Two sources/Docs?): **NO.** (One memo, unverified).
      *   *Result:* Fail Step 1. Move to Step 2.
  *   **Step 2 (James):**
      *   2.1 (Forced Option/Safety?): **NO.** Students are not in physical danger if this stays hidden for a week.
      *   2.2 (Publication creates evidence?): **NO.** Publishing an unverified memo doesn't make it true; it just makes you libelous. It doesn't trigger a whistleblower mechanism in the same way an assault allegation might.
      *   *Result:* **HARD STOP.**
  *   **Verdict:** **KILL.**
      *   *Reasoning:* This is where the procedure works against you. You *want* to run it (Jamesian passion), but it fails the Clifford baseline (evidence) and fails the James Override (no immediate public safety necessity). Publishing this exposes the paper to existential legal risk for a story that can wait.

  ---

  ### Part 4: What This Procedure Cannot Do

  1.  **It Cannot Fix Culture:** If your staff believes "truth is subjective," they will lie on the checklist. They will mark "YES" on "Two Sources" when they have one source and a tweet. This procedure requires a culture of honesty.
  2.  **It Cannot Replace Legal Counsel:** This is a triage tool, not a shield. In Case 3 (Donor), I told you to kill it. In Case 1 (Assault), I told you to escalate. A lawyer might tell you to kill *both*. You have no lawyer. You are still vulnerable.
  3.  **It Cannot Resolve Burnout:** The "Escalate to EIC" step assumes the EIC has the bandwidth to make a nuanced ethical call 20 minutes before deadline. If they are exhausted, they will default to "Kill" every time to avoid risk, stifling legitimate Jamesian investigative work.
  4.  **It Cannot Measure Power:** The procedure treats a "Grad Instructor" and a "Major Donor" as equal subjects in Step 1.1. In reality, the power differential matters. A procedure might tell you to kill a story on a donor (too risky) while running a story on a student (less risky), reinforcing existing power structures. That is a structural bias the flowchart hides.

  **Final Note:**
  The "Hard Stop" on Case 3 is the most important part of this system. It protects you from yourself. When you *badly want* to run a story, you are in a Jamesian "passional" state. You are biased. The procedure forces you to admit you lack the Cliffordian evidence. If you cannot justify the "Public Necessity" (Step 2), you must kill it. That is the only way a volunteer paper survives long enough to matter.
