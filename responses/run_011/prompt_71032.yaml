answer: |-
  1. **Paraphrase-invariance and the disjunction problem**
  Your convergence criterion requires features to be recoverable across paraphrase and modality. Critics argue this allows a direction to encode a disjunction like "Paris-or-France-or-tourism" so long as it remains stable across those variations. Does your criterion actively rule out such disjunctive contents, or must we accept that the network's genuine representations are sometimes logically disjunctive in ways human concepts are not?

  *Follow-up:* You will likely say that causal steering distinguishes the specific concept from the disjunction because only the specific concept supports targeted intervention. If steering works equally well for the disjunction, however, what prevents the content from collapsing into that broader category?
  *Label: Testing determinacy vs. stability.*

  2. **Independence in (iii)**
  You require features to be recovered independently by methods with non-overlapping failure modes, such as sparse autoencoders and behavioral probes. Yet both are fitted to the same activation data generated by the same network. In what sense are these methods genuinely independent rather than merely distinct optimizations over the same underlying signal?

  *Follow-up:* I expect you to argue that their objective functions differ enough to guarantee independence. If so, what would a non-circular independence look like that doesn't rely on sharing the very activation space whose structure is in question?
  *Label: Testing methodological independence.*

  3. **Overpermissiveness**
  A household thermometer satisfies your three conditions: its state is causally steerable by heat, recoverable across different heat sources, and detectable by distinct methods like mercury expansion and resistance change. What in your criterion excludes the thermometer from having genuine representational states, or is your view committed to saying it does?

  *Follow-up:* You will likely appeal to the lack of a selectional history in the thermometer. If that is the deciding factor, does that mean your convergence criterion is merely necessary, and the heavy lifting for realism is done entirely by the selectional reply?
  *Label: Testing sufficiency of criterion.*

  4. **Features without a training-distribution anchor**
  Interpretability work sometimes finds directions that steer reliably yet correspond to concepts the model was never explicitly trained to track, such as specific fictional characters or emergent logical rules. Does your view grant these directions representational content, or does the lack of a training-distribution anchor render them merely real patterns without semantic content?

  *Follow-up:* If you deny them content because they weren't selected for, you risk making content opaque to the interpreter. How do we distinguish a selected feature from an emergent one if both steer behavior identically in the present system?
  *Label: Testing training-dependence of content.*

  5. **Feature identity across layers and checkpoints**
  When a feature appears in an early layer and a structurally similar direction appears in a late layer, do these count as tokens of the same representation type? What are the identity conditions for a feature that persists across layers or survives a fine-tuning checkpoint?

  *Follow-up:* You will likely argue that functional role defines identity. If the functional role shifts slightly between layers, at what point does the feature cease to be itself and become a new representation?
  *Label: Testing diachronic identity.*

  6. **The granularity of the selection-history reply: Conflict**
  You argue gradient descent fixes content via selection for the training objective, but pretraining and fine-tuning often have competing objectives. If a direction contributes to pretraining loss but hinders fine-tuning performance, which selectional event determines the content of that feature?

  *Follow-up:* I anticipate you will say fine-tuning overrides pretraining. Does this imply that the representational content of a model's early layers is retroactively changed by later training stages?
  *Label: Testing temporal priority in selection.*

  7. **The granularity of the selection-history reply: Settling**
  Continuing on selection: gradient descent selects for output performance, but many internal configurations can produce the same output. What settles which of the competing candidate contents was actually selected for when the behavioral outcome is underdetermined?

  *Follow-up:* You will likely suggest we look at the loss landscape or gradient flow. Since we cannot replay training, how do we measure that contribution retrospectively without relying on the very behavioral data that underdetermines the content?
  *Label: Testing measurability of selection.*

  8. **The pragmatic question**
  *Instrumentalist Challenge:* A strict instrumentalist argues that positing real features adds no predictive power; all that matters is that the model behaves *as if* it has these features. They claim your "realism" is just a useful fiction for engineering interventions, indistinguishable in practice from their instrumentalism.
  If a strict instrumentalist predicted and steered exactly as you do, what does your realism add, and how could a third party tell which account was correct?

  *Follow-up:* You will likely claim realism explains generalization better than instrumentalism. Can you specify a generalization failure that instrumentalism predicts but realism rules out, rather than just asserting realism is more explanatory?
  *Label: Testing explanatory surplus.*

  9. **The closing evidential question**
  Realism must be vulnerable to evidence in a way that semantic revision is not. What specific kind of finding, were it to appear in mechanistic interpretability, would oblige you to abandon the view that features are genuine representational states?

  *Follow-up:* I expect you to cite a failure of the convergence criterion. If such a failure occurred, would you conclude the features aren't real, or would you argue our criterion for realism needs revision?
  *Label: Testing falsifiability.*
