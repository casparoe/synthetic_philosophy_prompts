answer: |-
  **Setting:** A sunlit kitchen table covered in papers. A half-empty pot of coffee sits near a stack of bank statements. Three siblings—Maya, Sam, and Leo—are sorting through their late mother's estate.

  **Maya:** (Tapping a calculator) If we split this three ways, the check I get puts me over the threshold. I told you, if we had a cumulative receipts tax, this wouldn't feel like… like winning a lottery I didn't buy a ticket for.

  **Sam:** We've been over the estate tax, Maya. It's double taxation on saved income.

  **Maya:** I'm not talking about the estate tax. That punishes Mom for saving. I'm talking about *my* receipt. I already got forty thousand for my down payment when I turned thirty. This is another two hundred. Under a lifetime receipts system, the marginal rate on this chunk would be higher. It would go to public goods, not my brokerage account. It's about my unearned advantage, not Mom's wallet.

  **Sam:** But you're treating the transfer like a spillage of money that needs mopping up. It's not. Look, I'll concede the point everyone usually starts with: Mom doesn't have rights anymore. She's gone. Nothing is being taken *from her*.

  **Maya:** Exactly. So why protect the transfer?

  **Sam:** Because a bequest isn't just a transfer of assets. It's a form of consumption. It's the satisfaction of a project that outlasts the consumer. Mom wanted to see us secure. That desire was part of her life, even if the execution happens after she dies. When you tax the receipt, you aren't taxing my luck. You're taxing the completion of her project. You're making her final act more expensive by a different route.

  **Leo:** (Shuffling papers) Can we focus on the signature line? The accountant needs this by noon.

  **Maya:** I'm signing, Leo. I'm just saying the system is blind. It sees this check as an isolated event. It doesn't see that I've already had more luck than half the country. A cumulative tax is the only way to measure the actual advantage. If my friend gets nothing from her parents, and I get this plus the down payment plus whatever my husband inherits, we aren't equals. The state should neutralize that accumulation.

  **Sam:** But to do that, you have to treat family partiality as a bias to be corrected. It's not a bias. It's a ground project. It's constitutive of what it means to be a parent. If Mom had spent this money on a world tour, no tax. Because she spent it on *us*, on extending her care beyond her death, you want to levy a penalty.

  **Maya:** It's not a penalty on care. It's a recognition that care, when monetized across generations, creates caste.

  **Sam:** (Leaning forward) Here's the thing you can't solve with your cumulative ledger. You say you're taxing the heir's luck. But the heir can't refuse the project without rejecting the parent. If you impose a significant tax on my receipt, you make Mom's love a burden to me. You turn her gift into a liability. You force me to calculate the cost of accepting her care. That corrupts the relationship *before* she dies. She'll know that taking her money hurts me fiscally.

  **Maya:** That's an emotional argument, Sam. I'm talking about structural equality.

  **Sam:** It's structural! If the state intervenes between the donor's intent and the heir's receipt, it severs the link. You say you're only looking at me, the receiver. But you can't isolate the receiver. I am the vessel of her choice. If you tax the vessel, you dampen the flow. You're arguing for a system that requires families to hide wealth to protect the relationship, or to feel guilty for receiving it.

  **Maya:** And your system requires society to accept a permanent aristocracy of luck because we're afraid of hurting feelings? Look, here's my point you can't dodge: Without a cumulative receipts tax, there is no way to track dynastic aggregation. One heir could receive gifts from parents, grandparents, aunts, and a wealthy spouse. Another gets nothing. If you only tax the donor's estate, you miss the pile-up on the receiving end. You let the inequality hide in the pockets of the living. My tax catches the pile-up. Yours lets it compound tax-free forever. How do you justify that compounding without claiming the dead have rights?

  **Sam:** (Pauses, looks at the coffee cup) I justify it because the alternative is giving the state a ledger of every intimate transaction within a family. To track the "pile-up," as you call it, the state has to audit every gift, every tuition payment, every down payment. It turns family life into a compliance issue. You want to prevent caste, but you create a surveillance state around the kitchen table.

  **Maya:** Privacy shouldn't shield intergenerational hoarding.

  **Sam:** And equality shouldn't require monetizing the bond between parent and child. You say you're taxing my luck. I say you're taxing the only way we have to say "you matter to me" after I'm gone. If you make that expression taxable to the receiver, you change the meaning of the expression. You can't tax the receipt without altering the gift.

  **Leo:** (Pen hovering) Okay. Theoretical impasse. Practical reality: The check exists. The tax code, as it stands, is what it is. Mom's project was to leave this to us. Maya's project is to fix the world. My project is to not get penalized for late filing.

  **Maya:** (Sighs) I know. I'm not refusing the money, Sam. I'm just saying… when I spend this, I'll know it came with a privilege I didn't earn. And the state let me keep it all.

  **Sam:** And when I spend it, I'll know it was Mom's way of staying present. And the state let her finish.

  **Leo:** (Signs a paper, slides it to Maya) Your turn.

  **Maya:** (Takes the pen) I still think the cumulative base is the only coherent way to handle this.

  **Sam:** And I still think it treats love like a loophole.

  **Maya:** (Signs) We're not going to agree.

  **Sam:** No.

  **Leo:** (Gathering the papers) Good. Then we're done. Coffee?

  **Maya:** Yeah. Black.

  **Sam:** I'll put the kettle on.
