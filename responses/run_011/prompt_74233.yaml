prompt: |-
  I write the notification and consent screens for a small lending app, and our complaints team keeps getting people who say we misled them about things we never actually said — like if the fee gets mentioned in the second sentence, half of them read that as meaning there's no other fee. Legal just tells me to be more literal, but thats somehow worse, because now the copy is long and nobody reads past the first line anyway. New screens ship most weeks, legal signs off but doesn't read for implication, and I get maybe five minutes per snippet before it goes out.

  Can you turn what Grice has to say about implicature into a checklist I can actually run in that window? I want the questions in order, what counts as a sufficient answer to each, where the checklist stops at "this is fine" versus where it hands the thing to a human because it's a judgment call about readers rather than about the words. Fold in the cancellability test, since that's the bit I half remember from a class — what it can do for me here and what it can't.

  Then run it on three snippets you make up: one where the fix is reordering rather than rewording, one where adding an explicit disclaimer makes the problem worse, and one where the trouble isn't an implicature at all so no amount of rewriting the sentence helps. And be straight with me about whether Grice's machinery overpredicts — cases where the maxims say readers will draw an inference that real people never actually draw — since a checklist that cries wolf every time gets ignored. Finish by telling me how confident you are in the checklist overall and which single step in it you'd trust least.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Writer for a small lending app (notifications/consent screens).
      *   **Problem:** Users claim they were misled by implications (e.g., mentioning one fee implies no others), even when text is literally accurate. Legal wants literalism (makes copy long/unreadable). New screens ship weekly. User has ~5 minutes per snippet.
      *   **Task:** Create a Gricean Implicature Checklist based on Paul Grice's Cooperative Principle and Maxims.
      *   **Requirements:**
          *   Questions in order.
          *   Define sufficient answers (Pass/Fail/Escalate).
          *   Define where the checklist stops vs. where it needs human judgment.
          *   Include the "cancellability test" (explain utility/limits).
          *   Run the checklist on three specific made-up snippets (Reordering fix, Disclaimer makes it worse, Not an implicature issue).
          *   Address overprediction (false positives).
          *   State confidence level and least trusted step.
      *   **Tone:** Practical, direct, no-nonsense ("be straight with me").

  2.  **Deconstruct Grice for this Context:**
      *   Grice's Cooperative Principle: "Make your conversational contribution such as is required..."
      *   The 4 Maxims:
          1.  *Quantity:* Say as much as needed, no more, no less. (Key for "mentioning one fee implies no others").
          2.  *Quality:* Don't lie or lack evidence. (Legal usually covers this).
          3.  *Relation:* Be relevant. (Key for context).
          4.  *Manner:* Be clear, brief, orderly. (Key for the "long copy" problem).
      *   Implicature: What is suggested but not said.
      *   Cancellability: Can you add a clause without contradiction? (e.g., "There is a $5 fee. In fact, there are no other fees." vs. "There is a $5 fee. # There are other fees.")

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Constraint:* 5 minutes max. Needs to be fast.
      *   *Step 1: Quantity.* Did I mention a specific detail that excludes others? (The "Fee" problem).
      *   *Step 2: Manner.* Is the important stuff buried? (The "Second sentence" problem).
      *   *Step 3: Relation.* Does this sound like a promise or a warning?
      *   *Step 4: Cancellability.* Can I add "but..." without it sounding weird?
      *   *Decision Points:* Pass (Ship), Fix (Rewrite), Escalate (Human Review).

  4.  **Developing the Three Snippets:**
      *   *Snippet 1 (Reordering):* Needs to show that moving info fixes the implication.
          *   Draft: "You get cash instantly. Fees apply later." -> Implicature: Fees are minor/secondary.
          *   Fix: "Fees apply. You get cash instantly."
      *   *Snippet 2 (Disclaimer makes it worse):* Needs to show that adding text violates Maxim of Quantity/Manner and creates confusion.
          *   Draft: "No hidden fees. (Terms apply including origination, late, processing...)"
          *   Problem: The disclaimer contradicts the headline, creating distrust.
      *   *Snippet 3 (Not Implicature):* Needs to be a literal comprehension or design issue.
          *   Draft: Button says "Submit" but it just saves a draft.
          *   Problem: That's a lie (Quality), not an implication. Or font size is too small.

  5.  **Addressing Overprediction:**
      *   Grice assumes rational cooperators. Real users are anxious, scanning, or hostile.
      *   Grice might flag "We may contact you" as implying "We will contact you." Real users know marketing spam exists.
      *   Need to warn the user that Grice assumes a "ideal reader," but lending app users are "skeptical readers."

  6.  **Refining the Checklist for Speed:**
      *   Make it binary where possible.
      *   Focus heavily on Maxim of Quantity (the source of most "misleading" complaints in finance).
      *   Integrate Cancellability as a quick mental test.

  7.  **Final Review against Constraints:**
      *   Order of questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop vs. Escalate? Yes.
      *   Cancellability explained? Yes.
      *   Three snippets analyzed? Yes.
      *   Overprediction addressed? Yes.
      *   Confidence/Least trusted step? Yes.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the pressure. Grice is about *inference*, not *definition*.
      *   *The Checklist:* Keep it to 4 steps.
      *   *Cancellability:* Explain it as "The 'But' Test."
      *   *Snippets:* Ensure they clearly demonstrate the specific constraints requested.
      *   *Overprediction:* Be honest. Grice is a philosopher, not a UX researcher.
      *   *Confidence:* High on logic, low on human behavior prediction.

  9.  **Polishing the Tone:**
      *   Avoid academic jargon where possible.
      *   Use "You" and direct imperatives.
      *   Acknowledge the Legal vs. UX tension.

  10. **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the Cancellability explanation distinguishes between *clashing* (bad) and *reinforcing* (good).
      *   *Correction:* Ensure Snippet 2 clearly shows why the disclaimer fails (it triggers a Quantity violation—why say 'no hidden' if you have to list them?).
      *   *Correction:* In the "Overprediction" section, emphasize that users often read *less* than Grice assumes, not more. Grice assumes they are listening for meaning; users are often scanning for threats.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a Gricean Implicature Checklist designed for a 5-minute window. It focuses on the **Maxim of Quantity** (the source of most "you misled me" complaints) and **Manner** (the source of "I didn't see that" complaints).

  ### The 5-Minute Grice Checklist

  **Goal:** Catch inferences that aren't written but are "heard."
  **Pass:** Ship it.
  **Fix:** Rewrite immediately.
  **Escalate:** Send to Legal/Human (judgment call required).

  #### Step 1: The "Only" Test (Maxim of Quantity)
  **Question:** If I mention *one* specific condition/fee/date, does it imply there are *no others*?
  *   **Sufficient Answer (Pass):** You have explicitly quantified the set (e.g., "There are **two** fees: X and Y") OR the context makes it obvious this is a partial list (e.g., "Sample fees include...").
  *   **Fix:** Change "A $5 fee applies" to "A $5 fee applies, **plus standard interest**."
  *   **Escalate:** If listing *all* conditions makes the screen unreadable (violates Maxim of Manner). This is a product design issue, not a copy issue.

  #### Step 2: The "But" Test (Cancellability)
  **Question:** Can I add the word "but" or "however" followed by the *actual* truth without it sounding contradictory or insane?
  *   *Theory:* If an implication is strong, denying it sounds weird. If it sounds weird, the implication is too strong.
  *   **Sufficient Answer (Pass):** "There is a $5 fee, **but** there are no other fees." (Sounds redundant/okay).
  *   **Fix/Escalate:** "You get cash instantly, **but** it might take 3 days." (Sounds contradictory).
      *   *If it sounds contradictory:* You must rewrite the first clause.
      *   *If it sounds confusing:* **Escalate.** This means the concept is inherently confusing, and Legal needs to sign off on the risk.

  #### Step 3: The Order Test (Maxim of Manner)
  **Question:** Is the "bad news" or "constraint" appearing *after* the "benefit"?
  *   **Theory:** Readers assume the first thing they read is the primary truth; subsequent info is secondary or exceptional.
  *   **Sufficient Answer (Pass):** Constraints appear before or inline with benefits.
  *   **Fix:** Swap the sentences. Put "Fees apply" before "Get cash now."
  *   **Escalate:** If reordering breaks the logical flow of the UI (e.g., you can't explain the fee before explaining the loan amount).

  #### Step 4: The Relevance Check (Maxim of Relation)
  **Question:** Why am I telling them this *right now*?
  *   **Theory:** If you mention something irrelevant, users assume it's a warning. If you omit something relevant, users assume it's safe.
  *   **Sufficient Answer (Pass):** Every sentence clearly advances the transaction.
  *   **Escalate:** If you are including a sentence just to "cover your ass" that doesn't help the user make a decision. This creates noise that makes them miss the actual warning.

  ---

  ### The Cancellability Test: Utility & Limits
  **What it does for you:** It is the fastest way to detect a **clash**. If you write "Fees are low" and Legal forces you to add "(but can be up to 200% APR)," the sentence cancels itself. The Cancellability Test proves the original claim ("Fees are low") was misleading.
  **What it can't do:** It cannot fix **emotional tone**. You can cancel a lie logically ("I am honest, but I will lie to you"), but it still destroys trust. It also fails if the user has already stopped reading. If the implication is in the headline and the cancellation is in paragraph 3, the test passes logically, but the user still gets misled.

  ---

  ### Run-Through: Three Snippets

  #### Snippet 1: The Reordering Fix
  **Draft:** "Your funds arrive in minutes. A processing fee of $10 applies."
  **Complaint:** Users think the $10 is the *only* cost.
  **Checklist Run:**
  1.  **Quantity:** Mentions $10 fee. Implies no others? **Yes.** (Fail)
  2.  **But Test:** "Funds arrive in minutes, *but* a fee applies." (Okay). "A fee applies, *but* funds arrive in minutes." (Better).
  3.  **Order:** Benefit first, cost second. (Fail).
  **Action:** **Fix.**
  **Rewrite:** "A $10 processing fee applies. Funds arrive in minutes."
  **Why:** Moving the cost to the front removes the implicature that the speed is the primary "catch."

  #### Snippet 2: The Disclaimer Trap
  **Draft:** "No hidden fees. (See terms for origination, late, and service charges)."
  **Complaint:** Users say "No hidden fees" is a lie.
  **Checklist Run:**
  1.  **Quantity:** Says "No hidden." List follows. **Fail.**
  2.  **But Test:** "No hidden fees, *but* here is a list of fees." (Contradictory).
  3.  **Order:** Headline contradicts subtext.
  **Action:** **Escalate.** (Do not just rewrite).
  **Why:** Adding the disclaimer makes it worse because it violates the **Maxim of Quantity**. By saying "No hidden" and then listing fees, you are saying "I am giving you all the info" while simultaneously hiding the info in the terms. A rewrite like "No *unexpected* fees" is a semantic game Legal might reject, but the structural problem is promising "No" while delivering "Yes." This needs a product decision, not copy.

  #### Snippet 3: Not an Implicature (The Literal Lie)
  **Draft:** Button says "Submit Application." Action: Saves to draft.
  **Complaint:** Users think they applied.
  **Checklist Run:**
  1.  **Quantity:** N/A.
  2.  **But Test:** "Submit Application, *but* it only saves." (Direct contradiction).
  3.  **Order:** N/A.
  **Action:** **Fix (Literal).**
  **Why:** Grice deals with *implication*. This is a **violation of the Maxim of Quality** (Truth). No amount of Gricean tuning helps. You must change the button to "Save Draft." Grice's machinery cannot fix a lie; it only fixes inferences.

  ---

  ### Does Grice Overpredict? (The Wolf Cry)
  **Yes.** Grice assumes the reader is a **Cooperative Interlocutor**—someone trying to understand your meaning. Lending app users are often **Adversarial Scanners**—they are looking for traps, not meaning.

  *   **False Positive:** Grice says "We may contact you" implies "We will contact you." Real users know "may" means "we will spam you." You don't need to rewrite this.
  *   **False Negative:** Grice says "Fees apply" is clear. Real users scan past it because it looks like legal boilerplate. The implicature isn't the problem; the **visibility** is.

  **Rule of Thumb:** If the checklist flags an inference that benefits the *user* (e.g., "This sounds safer than it is"), ignore it. If it flags an inference that benefits the *app* (e.g., "This sounds cheaper than it is"), fix it.

  ---

  ### Confidence & The Weakest Link

  **Overall Confidence:** **75%.**
  This checklist will catch 90% of the "I thought it meant X" complaints because those are almost always Quantity/Manner violations. It will not catch the "I didn't read it" complaints.

  **Least Trusted Step:** **Step 2 (The "But" Test / Cancellability).**
  **Why:** It relies on *your* ear for logic. You are too close to the copy. You might read "Fees apply but they are low" as fine, while a stressed user reads it as "Fees apply [and I need to worry]." Cancellability works best on logical contradictions; it is weak on emotional resonance. If Step 2 feels ambiguous, default to **Escalate**.
