      *   *The Puppeteers:* In the Cave, they are hidden, speaking for the statues (ventriloquism). In cinema, the filmmakers are hidden, but do they speak *for* the images in the same way? Or is the image the voice?
      *   *The Fire:* Sunlight vs. Artificial Fire vs. Projector Lamp. The Fire in the Cave is artificial light creating illusions. The Projector is artificial light creating illusions. This fits okay.
