answer: |-
  MERIDIAN ACADEMIC PRESS
  INTERNAL EDITORIAL QUERY SHEET
  Project: *Foundations of Global Tectonics* (3rd Ed.)
  Authors: Prof. Arthur Vance & Prof. Silas Thorne
  Editor: Helen Gist
  Date: 14 October 1968

  **Queries for Author Resolution**

  1.  **Chapter 2 Title:** The manuscript lists Chapter 2 as "The Permanence of Ocean Basins." House style prohibits chapter titles that state factual errors, as this may confuse undergraduate readers checking against current consensus. Should this be marked as a historical survey, or deleted entirely? If retained, please confirm if the content contradicts Chapter 3.
      *AV: Don't delete. It isn't an error in the context of the chapter. You can't explain why we changed our minds if you erase the mind we changed from. Just leave it. The contradiction is the point, even if the style guide hates it.*

  2.  **Glossary Consistency:** Entries for "Continent" and "Crust" appear in the glossary with definitions that shift between pages 40 and 85. On page 40, "crust" implies a static shell; on 85, it implies a moving plate segment. Please unify the definition for the sake of indexing. Also, shall we retain "Geosyncline" and "Earth Contraction"?
      *AV: You can't unify them. The word is the same, but the thing it points to isn't. A static crust and a moving crust aren't just different states; they're different categories. Retire "Geosyncline" and "Contraction." They don't exist anymore. But don't pretend the old "crust" definition was just a draft of the new one. It wasn't.*

  3.  **Figure 4.1 Caption:** The map showing the fit of the Atlantic coastlines is currently captioned "Evidence for Continental Displacement." A reviewer from the previous edition noted this assumes the conclusion. Can we adjust the caption to a neutral description, such as "Geometric Correspondence of Coastlines," acceptable to proponents of both fixed and mobile models?
      *AV: There are no proponents of the fixed model left in the departments that buy this book. But even if there were, they wouldn't call it evidence. They'd call it a coincidence. You can't write a caption that both sides accept because they don't agree on what counts as a puzzle worth solving. Call it "Fit of the Atlantic Margins." Let the students decide if it's evidence.*

  4.  **Marketing Feedback:** The sales team reports that a key reviewer for the second edition complained the discipline came across as a matter of "fashion" rather than cumulative data accumulation. They request a new introductory section titled "The Steady Growth of Geological Knowledge" to reassure adopters that the shift was logical and inevitable.
      *AV: It wasn't steady. It was a break. But write what they want. If I write a section saying "We suddenly stopped seeing the world the old way," they'll say I'm being dramatic. Just don't promise me that section will be true. Accumulation implies you keep the old bricks. We threw the bricks away.*

  5.  **Co-Author Dissent:** Prof. Thorne has submitted a two-page note rejecting the mobile model entirely, citing unresolved mechanistic issues. He requests this be included as a postscript. Where should this be placed? An appendix risks highlighting dissent; a footnote seems insufficient for a co-author.
      *AV: Put it in the preface. Or don't. Silas thinks he's arguing with me, but he's arguing with a ghost. He uses words like "force" and "drive" that I don't use anymore. If you print it, students will think it's a debate. It's not a debate. It's a translation failure. Hide it in the bibliography notes if you must.*

  6.  **References to Disproved Work:** Chapter 5 cites several papers from the 1920s regarding vertical crustal movements. Since these mechanisms are now considered invalid, should we remove these citations to avoid cluttering the bibliography with incorrect data?
      *AV: No. Keep them. But don't list them as "incorrect." List them as "superseded." There's a difference. One implies a mistake in calculation; the other implies a change in the rules of the game. They weren't bad scientists. They were playing a different game.*

  7.  **Author Coordination:** Please confirm final manuscript approval with Prof. Thorne. Previous correspondence suggests significant disagreement on the core thesis. We require sign-off from both authors to proceed to production.
      *AV: Silas and I have been lunching every Tuesday for forty years. We agree on the weather, the wine, and the university budget. We don't agree on the rocks. He'll sign. He knows the students won't read his note anyway. They only want the answers that get them jobs.*

  8.  **Final Note:** Upon receiving the signed proofs, I noted both signatures on the approval sheet were dated the same day. Prof. Thorne's copy includes handwritten corrections to the glossary terms "Subduction" and "Mantle Convection," which Prof. Vance has initialled. It appears the two authors are coordinating closely despite the theoretical divergence noted in Query 5.
      *AV: [No reply]*
