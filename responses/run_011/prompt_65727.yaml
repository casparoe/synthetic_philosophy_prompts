  The conference room was quiet, save for the hum of the projector and the shuffling of the proposal draft between them. Elena leaned forward, her fingers tracing the outline of the methodology section. Paul sat back, arms crossed, watching her read the final paragraph again.

  "It's bold," Elena said finally. "It's essentially institutionalizing Plutarch. You take the *synkrisis*, the formal comparison, and you strip away the mythology. You keep the adversarial element—the devil's advocate assigned to every file—and you test the output. If the biographical attribution of virtue predicts behavior in unseen scenarios, then Plutarch was right. Character is real, and it's legible."

  Paul shook his head slowly. "It's elegant, I'll give you that. But it's garbage in, garbage out. Look at the nomination phase. 'Nominate a couple hundred people widely taken to be moral exemplars.' Who is doing the nominating? The public? Peers? Historians?"

  "Admiration is the metric," Elena said. "That's the point. You don't start with a definition of courage and then check if someone meets it. You start with the people we admire, the ones who pull us toward the good, and you derive the definition from them. That's the only way moral concepts have content. If this study shows that the people we identify as exemplars don't actually behave differently than controls, then our moral concepts are empty. But I don't think they will."

  "Admiration tracks narratability, not virtue," Paul countered. "We admire people whose lives make sense as stories. We admire survivors. We admire people whose contexts allowed their virtues to be visible. If you select your sample based on who has a compelling biography, you've already selected for people who are good at managing impressions or who were lucky enough to be in situations where doing the right thing was成本低 or highly visible. You're selecting on the dependent variable."

  Elena tapped the paper. "That's why the devil's advocate is there. The protocol requires an adversarial biographer to hunt for the misread evidence, the hidden selfish motives, the times they failed. It's designed to break the halo effect. Plutarch knew this. He didn't hide Caesar's vanity or Alexander's drunken rages. He included them to show how character handles weakness. The small details—the offhand remark, how they treat a servant—are supposed to be harder to fake than the public speech."

  "The Fundamental Attribution Error isn't fixed by adding more narrative," Paul said. "It's baked into the form. When you write a life, you smear coherence backwards. You take a disjointed series of actions and impose a plot. In the lab, when we strip away the narrative, the consistency drops. Think about the seminary studies. Students training for the priesthood, told they were late for a sermon, stepped over a slumped man in an alleyway. Students who were on time stopped. The variable wasn't their piety or their character structure; it was how much hurry they were in. The correlation between personality traits and behavior across different situations is often around .30. That's not nothing, but it's not the robust global character trait you need for this study to work."

  ".30 is roughly the size of the correlation between smoking and cancer," Elena shot back. "Or cholesterol and heart disease. In medicine, you'd kill for that predictive validity. You're asking for a level of consistency that doesn't exist in any biological system. Why demand it of the soul?"

  "Because medicine doesn't claim those correlations prove a global essence," Paul said. "It claims smoking increases risk in specific contexts. My worry is that you're treating 'character' as a cross-situational disposition—a thing inside the person that stays the same whether they're in a hurry, under authority, or being watched. The data suggests character is more like a local if-then profile. A person might be honest with their spouse but dishonest with their tax authority. Brave in physical danger but cowardly in social confrontation. If your biographers code for 'Courage' as a single global score, they're measuring a fiction."

  Elena paused. She looked out the window for a moment, then back at him. "I'll concede the global part. Maybe 'courage' isn't a single monolith. But the Exemplarist view doesn't require perfect cross-situational consistency. It requires enough stability that the exemplar is a reliable guide. If the people we admire are only virtuous in narrow bands, then moral education based on emulation is useless. You can't tell a child, 'Be like this person,' if that person is only good when the weather is nice. But I think you're underestimating the aggregation. One act in a lab is noise. A life is a signal."

  "But the life is curated," Paul insisted. "Even with the devil's advocate, you're working with records. Who leaves records? The literate, the privileged, the ones who weren't crushed by systems. Your sample is inherently biased toward people who had the resources to be virtuous. If you take a person with high 'conscientiousness' and put them in a system designed to break them—say, an obedience setup where an authority tells them to harm someone—the trait often dissolves. The situation swamps the disposition. If your study doesn't control for the situations the exemplars faced, you're just measuring privilege."

  "So refine the protocol," Elena said. "Match the controls not just on demographics, but on opportunity. Match the soldier with the soldier, the CEO with the CEO. Then ask: in similar situations, did the exemplar do something different? If the situation is identical, and the behavior diverges, what explains it? If not character, then what?"

  "Random variance," Paul said. "Or unmeasured situational cues. Maybe the exemplar had a better night's sleep. Maybe the control was hungry. We know glucose levels affect judicial rulings. You're looking for a moral ghost in the machine."

  "It's not a ghost if it predicts," Elena said. "Here's where I think we might be talking past each other. You define character as a statistical probability of behavior across diverse contexts. I define it as a narrative identity that organizes those contexts. For me, the 'small detail' Plutarch loves isn't data point; it's a revelation of how the person interprets the situation. The exemplar doesn't just react; they frame the event. When the seminary student is in a hurry, the exemplar interprets the hurry differently. They see the slumped man as part of their duty, not an obstacle to it. That interpretive lens is the character. Can your psychology measure that?"

  Paul uncrossed his arms. He picked up a pen and twirled it. "We can measure interpretation. We can look at how people construe ambiguous situations. And I'll admit, there is some stability there. People do have consistent ways of seeing the world. If your study focuses on that—on the cognitive framing rather than just the behavioral output—I'm less opposed. But you have to drop the claim that you're finding global traits. You're finding stable interpretive habits. And you have to admit that those habits are fragile. They can be overwritten by strong situational pressures."

  "I can live with 'fragile'," Elena said. "Virtue is hard. It's supposed to be hard. But if the study shows that the biographical method—the Plutarch method—has zero predictive power over the situational method, then I have a problem. If knowing someone's life story tells me nothing about what they'll do next compared to knowing the context they're walking into, then moral biography is just entertainment. It's hagiography."

  "And if the biographical method works?" Paul asked. "If the adversarial files predict behavior better than the situational variables?"

  "Then I have to admit that the lab is too sterile," Paul said. "That stripping away the narrative strips away the person. That the .30 coefficient is an artifact of breaking the context into too small pieces. It would mean that whole-life aggregation captures something that single-act experiments miss. It would cost me the claim that situation is king."

  They sat in silence for a moment. The hum of the projector seemed louder.

  "We need to be clear about what would kill our views," Elena said. "Not just annoy us. Kill them."

  "Agreed," Paul said.

  "For me," Elena said, her voice steady. "If you run this study with rigorous matching, rigorous adversarial review, and you find that the 'exemplars' perform no better than controls in aggregated real-world scenarios—not lab tricks, but real stakes—then Exemplarism is dead. It would mean admiration is purely aesthetic. It would mean there is no moral knowledge to be gained from lives, only pleasure. I would have to stop teaching ethics through biography. I would have to tell my students that looking to heroes is a cognitive bias, not a method of learning."

  Paul nodded. "And for me. If the biographical profiles predict behavior significantly better than the situational variables—specifically in the high-pressure contexts where I claim traits dissolve—then I have to give up the hard situationist line. I have to admit that there is a cross-situational stability that survives the obedience setups, the hurry, the anonymity. I would have to concede that character is not just a label we paste on behavior after the fact, but a causal force. And that means psychology needs to stop treating persons as mere vessels for situational variables."

  "That costs you something," Elena noted. "It undermines the idea that we can engineer morality just by fixing institutions. If character is real, then fixing the person matters as much as fixing the system."

  "It does," Paul said. "And it costs you too. If admiration is shown to be biased toward the legible and the privileged, even after adversarial review, then you can't use 'who we admire' as the foundation for moral concepts. You'd need an objective standard outside of human reaction."

  "Then we agree on the protocol," Elena said, closing the folder. "We run the Plutarch Protocol. We let the lives speak. But we agree beforehand that if the data says the lives are just stories, we stop telling them as truth."

  "And if the data says the situations don't matter as much as the people," Paul said, standing up. "Then I stop telling people that character is an illusion."

  "Deal," Elena said.

  "Deal," Paul replied. He didn't look happy about it, but he looked ready. They walked out of the room together, leaving the proposal on the table, waiting to see if the past could predict the future.
