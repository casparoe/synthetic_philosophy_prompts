answer: |-
  Here is a design for a 90-minute senior seminar session on Money Pumps, specifically engineered to bypass the "I'd just refuse" objection by inducing intransitivity through multidimensional trade-offs rather than hidden tricks.

  ### 1. The Activity: "The Dimensional Rotation"

  **The Setup**
  *   **Goods:** Bundles of colored chips (Red, Blue, Green).
  *   **Valuation:** There is **no fixed redemption rule** announced beforehand. Students are told: *"Value these bundles however you naturally do. There is no trick exchange rate. We are testing your raw preference over these specific configurations."*
  *   **The Cycle Payoffs:**
      *   **Option A:** 10 Red, 4 Blue, 2 Green (Total: 16)
      *   **Option B:** 2 Red, 10 Blue, 4 Green (Total: 16)
      *   **Option C:** 4 Red, 2 Blue, 10 Green (Total: 16)
  *   **The Pump Mechanism:** A transaction fee of **1 Chip** (deducted from the bundle immediately upon trading).
  *   **The Order:**
      1.  **Endowment:** All students start with **Option A**.
      2.  **Offer 1:** Trade A for B (Cost: 1 chip).
      3.  **Offer 2:** Trade B for C (Cost: 1 chip).
      4.  **Offer 3:** Trade C for A (Cost: 1 chip).

  **Why This Order & Scheme?**
  This scheme exploits the **"Majority of Dimensions" heuristic** (a la Tversky, 1969). When humans compare multidimensional options, they often count how many attributes improve rather than calculating a weighted sum.
  *   **A vs. B:** B improves Blue (4→10) and Green (2→4). A improves Red (10→2). **B wins 2 dimensions to 1.**
  *   **B vs. C:** C improves Green (4→10) and Red (2→4). B improves Blue (10→2). **C wins 2 dimensions to 1.**
  *   **C vs. A:** A improves Red (4→10) and Blue (2→4). C improves Green (10→2). **A wins 2 dimensions to 1.**

  Because the total chip count is identical (16), there is no dominant option based on quantity. The preference is induced by the *structure of comparison*. At every step, the student feels they are "upgrading" their bundle on the majority of attributes. The 1-chip fee is small enough to feel negligible compared to the "upgrade" (e.g., gaining 6 Blue chips), but large enough to ensure a net loss after the cycle (3 chips lost).

  **Why it breaks "I'd just refuse":**
  Students cannot simply "refuse" without overriding their local intuition. At Step 1, refusing B means keeping A, which is objectively "worse" on 2 out of 3 dimensions. To refuse requires global reasoning (seeing the cycle) that conflicts with local rationality (maximizing attribute satisfaction). The activity forces them to experience the tension between *local optimization* and *global consistency*.

  ---

  ### 2. The Precommitment Variant

  **The Modification**
  Before distributing the initial Endowment (Option A), hand each student a sealed envelope and a "Contract Card."
  *   **Task:** "Look at the Menu {A, B, C} on the board. Knowing you will be offered sequential trades with a 1-chip fee, write down a **binding plan**: How many trades will you accept? (0, 1, 2, or 3)."
  *   **Constraint:** If they write "0", they must return the envelope unopened at the end. If they write "1+", they must follow the plan or pay a **penalty of 5 chips** (enforced by honor system + peer monitoring).

  **What This Shows**
  The sequential version tests **Sophisticated Choice** (can you anticipate your future self?). The precommitment variant tests **Resolute Choice** (can you bind your future self?).
  *   **Result:** Most will write "0" in the envelope (recognizing the cycle globally) but then trade when holding the chips sequentially (succumbing to local preference).
  *   **Lesson:** This demonstrates **Dynamic Inconsistency**. It proves the problem isn't "stupidity" (they identified the cycle in the precommitment phase); the problem is that *preference is state-dependent*. Holding A makes B look attractive. Holding B makes C look attractive. The precommitment variant isolates the *volitional* failure from the *cognitive* failure.

  ---

  ### 3. Debrief Mapping: Sophisticated vs. Resolute

  Use the whiteboard to map the students' behavior onto the three standard solutions to money pumps:

  1.  **Myopic Choice (The Pumped):**
      *   *Behavior:* Traded A→B→C→A.
      *   *Reasoning:* "At every step, the new bundle looked better on most stats."
      *   *Lesson:* Local rationality $\neq$ Global rationality.
  2.  **Sophisticated Choice (The Refusers):**
      *   *Behavior:* Refused the first trade (A→B).
      *   *Reasoning:* "I saw the menu, knew the cycle, and stopped the bleed at Step 1."
      *   *Lesson:* This requires **Backward Induction**. You have to treat the current choice as a node in a larger tree. This is cognitively expensive.
  3.  **Resolute Choice (The Precommitters):**
      *   *Behavior:* Signed the "0 trades" contract and stuck to it.
      *   *Reasoning:* "I knew I couldn't trust my future self to resist the 'upgrade'."
      *   *Lesson:* Rationality might require **binding constraints** (Ulysses contracts), not just better calculation.

  **Key Discussion Point:** Ask the Sophisticated Refusers: *"Did you feel a 'loss' when you refused the first trade?"* (They should say yes—they turned down a 2-dimension upgrade). This highlights that rationality can feel like *leaving value on the table* in the short term.

  ---

  ### 4. The Diagnostic Question

  To check if the concept landed, ask this single question at the end of class:

  > **"If you lost 3 chips today, was it because you failed to understand the menu, or because the structure of the choice made 'upgrading' feel rational at every single step?"**

  *   **Correct Signal:** They answer the latter. They acknowledge that the *process* of sequential comparison generated the loss, not a lack of information.
  *   **Failed Signal:** They answer the former (e.g., "I didn't notice the cycle"). This means they still view it as a trick rather than a structural paradox.

  ---

  ### 5. Limitation of the Activity (The "Straight Answer")

  **The Feature You Cannot Reproduce:** **Stable Intransitive Preferences.**

  *   **The Real Argument:** The classic Money Pump argument assumes the agent has **fixed, stable preferences** (A > B > C > A) that exist independently of the choice context. The pump exploits this static inconsistency.
  *   **This Activity:** This activity generates **State-Dependent Preferences** (A > B when holding A; B > C when holding B). The preference order *changes* based on the endowment (Reference Dependence).
  *   **Why Flag It:** If a student points out, "My preferences didn't cycle, the *options* just looked different depending on what I held," they are correct. This activity demonstrates **Framing/Reference Effects** more than pure logical intransitivity.
  *   **Pedagogical Use:** Use this distinction to elevate the discussion. "If preferences are this malleable, is the Rational Choice model broken because we are inconsistent, or because the model assumes preferences are stable when they aren't?"

  ---

  ### 6. Predictable Failure Modes (First Run)

  1.  **The "Gamer" Refusal:**
      *   *What happens:* One vocal student says, "This is obviously a cycle, everyone just say no."
      *   *Mitigation:* Run the first round **anonymously**. Have them write their decision on a slip of paper and drop it in a box. Reveal the aggregate loss (e.g., "The class lost 42 chips total") before discussing *why*. This prevents social coordination from masking the individual temptation.
  2.  **The "EV" Objection:**
      *   *What happens:* Students argue, "They are all 16 chips, so they are equal. I'm indifferent."
      *   *Mitigation:* Pre-empt this. *"If you are truly indifferent, you should be willing to trade for free. But if you trade, you pay a fee. If you are indifferent, you should refuse the fee. But if you prefer the new bundle on 2 dimensions, you should pay. Which is it?"* Force them off the fence of indifference.
  3.  **Step 3 Resistance:**
      *   *What happens:* Students trade A→B and B→C, but refuse C→A because they recognize they are back at the start.
      *   *Mitigation:* This is actually a **success** for the debrief. It shows **Sophistication** kicking in late. Use it: "Why did you stop at Step 3 but not Step 1? What changed? Your preferences, or your information?" (Answer: Information about the sequence structure).

  ### Timing Guide (90 Minutes)
  *   **00-10:** Intro & Setup (Rules, Menu, No Hidden Info).
  *   **10-25:** Activity Round 1 (Sequential, Anonymous decisions).
  *   **25-35:** Activity Round 2 (Precommitment Variant).
  *   **35-60:** Debrief (Map to Sophisticated/Resolute/Myopic).
  *   **60-80:** Discussion (Limitation: Stability vs. State-Dependence).
  *   **80-90:** Diagnostic Question & Wrap.
