      *   I need them to care about the *distribution*.
      *   *Instruction:* "You will redeem these chips at the end. The redemption rule is: **You are paid for your MAJORITY color only.**"
      *   *A: 10 Red, 4 Blue, 2 Green. (Paid for 10 Red).*
      *   *B: 2 Red, 10 Blue, 4 Green. (Paid for 10 Blue).*
      *   *C: 4 Red, 2 Blue, 10 Green. (Paid for 10 Green).*
      *   *If the exchange rate is equal, they are indifferent.*
