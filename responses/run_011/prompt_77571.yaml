  ### 1. The Formal Notion of Expectation and Case A/A′

  In standard measure-theoretic probability, the expectation of a random variable $X$ is defined as the Lebesgue integral $\int X \, dP$. This integral is defined if and only if $\int |X| \, dP < \infty$; that is, the sum of the absolute values of the probability-weighted terms must be finite. This requirement ensures that the value is independent of the order in which states are enumerated. When a series is conditionally convergent (as in Case A), the Riemann Series Theorem guarantees that rearranging the terms can yield any real number, or diverge. Because a gamble is a function from states to outcomes, and the set of states is unordered, the expectation must be an unordered sum. Consequently, the correct formal verdict for Case A is that the expectation **does not exist**.

  To say it has "infinitely many equally admissible candidate expectations" is to mistake a property of a specific series representation for a property of the gamble itself. The gamble is the mapping, not the sequence. Assigning it a value based on one ordering privileges a description over the ontology of the option.

  However, folding conditional convergence (Case A) into simple non-existence (Case D) does conceal a normative difference. In Case A, the "natural" ordering (by toss number) yields a stable finite limit ($\ln 2$), and truncations of the game converge to this value. In Case D, even the natural ordering oscillates or diverges. Case A is "fragilely finite," while Case D is "robustly undefined." Conflating them treats an option that behaves reasonably under natural physical truncation as identical to one that does not. This loses the nuance that Case A might be manageable via limit-based reasoning (if justified), whereas Case D offers no such foothold.

  ### 2. Privileged Orderings and Truncation

  The argument for privileging the toss-count ordering in Case A rests on the physical temporal sequence of the game: toss 1, then toss 2, etc. The objection is that the *option* is the contract specifying payoffs for states, not the process of calculating the sum. The agent chooses the gamble before any tosses occur; the temporal unfolding is relevant to realization, not valuation. Summation is a logical operation, not a temporal one.

  I find the objection stronger. The expectation is a property of the probability space, which is static. While the *realization* is temporal, the *value* should not depend on the order in which the mathematician lists the states. If the value depended on the listing, two agents facing the identical contract could rationally assign different values based solely on how they organized their scratchpads.

  Regarding truncation: defining the value as $\lim_{N \to \infty} E[G_N]$ (where $G_N$ is the game stopped at $N$ tosses) yields $\ln 2$ for Case A. However, this limit interchange ($\lim \int \neq \int \lim$) is only valid under conditions like the Dominated Convergence Theorem, which requires absolute integrability. Using truncation to define the value of the infinite game essentially assumes the conclusion (that the limit is well-behaved) without the requisite mathematical justification. It supplies a surrogate value, but it is not the expectation of the infinite gamble; it is the limit of expectations of finite gambles. Since the infinite gamble is not the limit of the finite ones in the topology of expectation, this surrogate stands or falls on whether one accepts the physical truncation as the definition of the game, which returns us to the temporal objection.

  ### 3. Taxonomy and Damage to Expected Utility Theory

  We can taxonomy the cases by their failure modes:
  *   **C(ε), ε > 0:** Well-behaved. Absolute convergence. Unique finite expectation.
  *   **C(0) = A = A′:** Conditionally convergent. Expectation undefined (order-dependent).
  *   **C(ε), ε < 0:** Divergent terms (for $\epsilon \le -1$) or divergent sum (for $-1 < \epsilon < 0$). Expectation undefined. *Correction:* Technically, for $-1 < \epsilon < 0$, terms tend to zero but the sum diverges. For $\epsilon \le -1$, terms do not tend to zero. Both fail expectation.
  *   **D:** Oscillatory/Divergent. Terms do not vanish. Expectation undefined.
  *   **E:** Positive Divergent. Sum is $+\infty$. Expectation exists in extended reals, but not finite.

  The most damaging case to Expected Utility (EU) theory is **Case A (C(0))**. Case E issues a determinate verdict (infinity), which can be handled by extended real numbers or rejected as inadmissible options. Case D is silent, which is honest ignorance. Case A, however, creates the illusion of determinacy. It allows a theory to assign a value ($\ln 2$) that is mathematically arbitrary (since $1.04$ is equally defensible via reordering). This undermines the uniqueness requirement of rational valuation. If a theory permits Case A to have a value, it permits money pumps based on re-description. Unlimited flexibility (being able to prove any value) is worse than silence (D) or a fixed absurdity (E), because it destroys the normative constraint function of the theory. Silence preserves the demand for coherence; flexibility abandons it.

  ### 4. The Bounded-Utility Repair

  If utility is bounded by $\pm M$, then $\sum p_n |u_n| \le \sum p_n M = M < \infty$. Absolute summability is guaranteed, and expectations always exist.
  *   **Mechanism:** Imposing an axiom that utility functions must be bounded.
  *   **Status:** This is a **restriction on the theory**, justified by a substantive **claim about agents** (that they cannot care infinitely more about one outcome than another).
  *   **Principal Cost:** It forecloses the modeling of agents with lexicographic preferences or those who would trade any finite probability of infinite bliss for a certainty of finite good (e.g., Pascal's Wager scenarios). It also blocks unbounded additive aggregation across infinite populations (e.g., intergenerational equity), as the sum of bounded utilities can still diverge if the population is infinite.
  *   **Case E:** This repair disposes of Case E as well (St. Petersburg payoff becomes finite). This is a benefit for consistency but a worry for descriptive adequacy, as it implies a saturation point for value that many find counterintuitive.

  ### 5. What Survives: Dominance and Mixing

  When expectations vanish, two principles often survive:
  1.  **Dominance:** If Option X pays $\ge$ Option Y in every state and $>$ in some, prefer X. This restores partial ordering without expectations.
      *   *Limitation:* It fails to compare two expectationless gambles where neither dominates (common in Pasadena-type cases), and it can yield counterintuitive results if the dominating option also lacks an expectation (e.g., dominating an undefined gamble with another undefined gamble).
  2.  **Mixing (Compound Lotteries):** This concerns whether mixing gambles preserves their status.
      *   *Limitation:* The class of expectationless gambles is **not closed** under mixing. Mixing a Pasadena game (A) with its negative (−A) can yield a zero-value gamble (defined). Conversely, mixing two defined gambles can yield an undefined one if weights are infinite (not standard) or if the mixture creates conditional convergence where absolute convergence existed (rare in standard convex combinations). The failure of closure matters because it violates the linearity of expectation, preventing the simplification of complex lotteries into single values.

