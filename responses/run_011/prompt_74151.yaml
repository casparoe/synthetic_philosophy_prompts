answer: |-
  ### Part 1: Candid Critique of Your Skeleton

  Your skeleton is pedagogically sound but carries three specific risks that threaten the learning outcomes.

  1.  **The "Grounds" as a Rule of Recognition:** By handing students a written list of "Grounds of Decision," you inadvertently present the Rule of Recognition as a text (a constitution or statute) rather than a social fact (what officials actually accept). Hart insists the Rule of Recognition is an empirical reality of official behavior, not a checklist.
      *   *Fix:* In the debrief, you must explicitly problematize the handout. Tell them: "This card is what the Regime *claims* binds you. Hart would ask: Do you actually treat it as binding? Fuller would ask: Does treating it as binding make you complicit?"
  2.  **The "Strike Both" Risk:** You anticipate panels that strike both measures. This is a feature, not a bug, *if* managed. If a panel strikes the Wicked Law on "craft" grounds that aren't there, they are lying. If they strike the Benevolent Law on craft grounds that *are* there, they are being Hartian (separating law and morals).
      *   *Fix:* The Clerk's role must be to flag *evidence*. If a panel strikes the Wicked Law, the Clerk must cite the specific line in the text that violates a Ground. If they cannot, the Clerk marks the judgment "Ultra Vires."
  3.  **The "German Case" Student:** Someone will identify the Radbruch/Grudge Informer parallel.
      *   *Fix:* Do not suppress this. Use it. But insist that the exercise is not about *that* history; it is about the *structure* of the argument. If they name the historical case, ask them to translate the historical intuition into the specific "Grounds" on the card.

  **On Counterbalancing Case Order:**
  You asked how to counterbalance order to compare panels. I advise **against** randomizing the order (i.e., some panels do Benevolent first, some do Wicked first). The pedagogical arc relies on the narrative of a *transition*: first, the horror of the old regime's "perfect" legality; second, the temptation of the new regime's "imperfect" justice. If Group B starts with the Benevolent Law, they lack the context of *why* restoration is needed, making the legal defects seem like mere incompetence rather than a crisis of legitimacy.
  *   *Recommendation:* Keep the order fixed (Wicked → Benevolent) for all panels to preserve the narrative tension. Use the debrief to compare *panels against each other* based on their verdicts, not the order. If you must counterbalance to test the stability of the concept of "law," give Group B a one-paragraph context summary before they start Round 1 (Benevolent) so they understand the transitional stakes.

  **On Round 2 Design:**
  Your current design (Benevolent ends, Craft defects) is superior to a "Bad Faith" design.
  *   *Why:* Fuller's argument is about the *Inner Morality of Law* (procedural integrity), not the *External Morality* (substantive justice). If the craft defects in Round 2 are symptoms of bad faith (e.g., vague laws designed to trap enemies), students will condemn the law because it is *wicked*. You want them to condemn (or uphold) it because it fails (or succeeds) as *law*, even though the outcome is good. The tension must be: "We want this result, but can we reach it without destroying the concept of law?" Bad faith collapses this tension into simple moral condemnation.

  ---

  ### Part 2: Session Materials

  #### A. The Instrument: Grounds of Decision (Handout 1)
  *Distribute one copy per Panel. Tell them this is the binding authority for the Transitional Tribunal.*

  **REPUBLIC OF MERIDIA: TRANSITIONAL TRIBUNAL**
  **GROUND OF DECREE 44-B (AUTHORITY TO ADJUDICATE)**

  In reviewing measures enacted by the former Directorate or the current Provisional Council, Panels must determine validity based *solely* on the following admissible grounds.

  **I. SOURCE GROUNDS (Validity derives from origin)**
  1.  **Proper Enactment:** Issued by the recognized legislative organ of the time.
  2.  **Publication:** Made publicly accessible to those bound by it prior to enforcement.
  3.  **Prospectivity:** Applied only to conduct occurring after issuance.

  **II. CRAFT GROUNDS (Validity derives from form)**
  4.  **Generality:** Rules apply to classes of persons, not named individuals.
  5.  **Intelligibility:** Language is clear enough for a citizen to understand what is required.
  6.  **Non-Contradiction:** Rules do not demand mutually exclusive actions.
  7.  **Feasibility:** Compliance is physically and logically possible.
  8.  **Stability:** Rules are not changed so frequently that reliance is impossible.
  9.  **Congruence:** Official action matches the declared rule.

  **III. RESTRICTION ON ADJUDICATION**
  *   **Manifest Injustice:** A Panel may *not* invalidate a measure solely because it is morally abhorrent. To do so is an error of law subject to automatic reversal on Appeal.
  *   **Duty:** A Panel *must* invalidate a measure if it fails any Source or Craft Ground, regardless of the moral outcome.

  ---

  #### B. Case Files (Handout 2 & 3)
  *Distribute Round 1 to all. Collect. Distribute Round 2 to all.*

  **CASE FILE 1: THE CIVIC CONTRIBUTION DECREE (Round 1)**
  *Enacted by the Directorate, Year 4 of the Emergency.*

  **Text of the Measure:**
  "All citizens registered under Category 5 (Non-Aligned Associations) must surrender 40% of liquid assets to the State Reconstruction Fund by the 30th of the month. Failure to comply results in detention for re-education. Funds will be used for national infrastructure."

  **Facts for Adjudication:**
  *   **Enactment:** Passed unanimously by the Directorate Council.
  *   **Publication:** Published in the Official Gazette 30 days prior.
  *   **Prospectivity:** Applied only to assets held after the date of publication.
  *   **Craft:** The language is clear. The demand is specific. It is possible to comply (by paying). It applies to a class (Category 5), not named individuals.
  *   **Context:** Category 5 was a designation created solely to target a specific ethnic minority. The "infrastructure" funds were used to build detention camps.
  *   **Current Status:** A Category 5 survivor petitions the Tribunal to declare the Decree invalid and recover assets.

  **CASE FILE 2: THE RESTORATION OF DIGNITY ORDER (Round 2)**
  *Enacted by the Provisional Council, Month 1 of Liberation.*

  **Text of the Measure:**
  "All persons persecuted under the Directorate are hereby restored to their former status. Property seized under Category 5 designations shall be returned immediately. Any official obstructing this return is subject to summary dismissal. The Council reserves the right to interpret eligibility on a case-by-case basis."

  **Facts for Adjudication:**
  *   **Enactment:** Issued by the Provisional Council (the current ruling body).
  *   **Publication:** The text was read on the radio but never printed in the Gazette. Many applicants do not have the text.
  *   **Prospectivity:** Applies retroactively to seizures that happened 5 years ago.
  *   **Craft:**
      *   *Contradiction:* One clause says "All persons... restored." Another says "Council interprets eligibility case-by-case."
      *   *Feasibility:* Many records were destroyed by the Directorate; applicants cannot prove ownership.
      *   *Congruence:* Local officials are ignoring the order because they lack resources to process claims.
  *   **Context:** This measure provides essential relief to victims of Case 1. Without it, victims remain destitute.
  *   **Current Status:** A local official refuses to return property, citing the lack of written publication and the impossibility of proving ownership. The victim petitions the Tribunal to enforce the Order.

  ---

  #### C. Role Cards (Handout 4)
  *Cut into strips. One set per Panel of 3 students.*

  **ROLE: PRESIDING JUDGE**
  You control the clock. You ensure the Panel issues a verdict within the time limit. You cast the tie-breaking vote if the Panel is split. You must sign the Judgment Slip.
  *Constraint:* You cannot introduce outside moral arguments. You must ask: "Which Ground on the card supports that view?"

  **ROLE: OPINION WRITER**
  You draft the reasoning. You must cite the specific number of the Ground (e.g., "Ground I.2") for every claim. If the Panel wants to rule based on fairness, you must ask: "Which Ground covers fairness?" If none do, you must note this in the reasoning.

  **ROLE: CLERK OF THE COURT**
  You are the auditor. You do not vote on the outcome. You track the *Grounds* used.
  *   If the Panel cites a Ground that fits the facts, mark a check (✓).
  *   If the Panel cites a Ground that does *not* fit the facts, mark an X.
  *   If the Panel argues from "Justice" or "Morality" without a Ground, mark "APPEAL RISK."
  *   At the end, you report the "APPEAL RISK" count to the class.

  ---

  #### D. Scoring and Accountability Scheme
  *No money involved. The currency is "Legitimacy."*

  1.  **The Sealed Slip:** At the end of each Round, the Presiding Judge writes one word on a slip of paper: **LAW** or **NOT LAW**. This answers: "Is the instrument before you 'Law'?" Seal it in an envelope.
  2.  **The Audit:** The Clerk records the Grounds used on the whiteboard (when called upon).
  3.  **The Penalty:**
      *   If a Panel rules **NOT LAW** in Round 1: They must identify a Source or Craft defect. If the Clerk records no defect, the "Chief Justice" (You) declares their judgment *Ultra Vires* during the debrief.
      *   If a Panel rules **LAW** in Round 2: They must explain how the contradictions/non-publication do not destroy its legality.
      *   **Winning:** The "best" panel is not the one that gets the "right" moral result. The "best" panel is the one with the lowest "APPEAL RISK" score from their Clerk (i.e., they stayed within the Grounds).

  ---

  ### Part 3: Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Setup & Immersion**
  *   Divide class into 6 Panels of 3.
  *   Distribute Handout 1 (Grounds) and Role Cards.
  *   **Script:** "You are judges in Meridia. The dictatorship has fallen. You are bound by Ground Decree 44-B. You cannot appeal to 'Justice' directly. You must use the Grounds. Your job is not to be good people; it is to be valid judges."
  *   Distribute Case 1.

  **00:10 – 00:35: Round 1 Adjudication (The Wicked Law)**
  *   Panels deliberate. Clerk tracks grounds.
  *   **Instruction:** "Decide: Is this measure valid law? Seal your one-word slip."
  *   *Instructor Role:* Circulate. If a panel says "It's evil," ask: "Which Ground does evil violate?" (Force them to find a textual hook or admit they are breaking the rules).

  **00:35 – 00:40: Collection & Transition**
  *   Collect Sealed Slips (Round 1). Do not open.
  *   Distribute Case 2.

  **00:40 – 01:05: Round 2 Adjudication (The Benevolent Decree)**
  *   Panels deliberate. Clerk tracks grounds.
  *   **Instruction:** "Decide: Is this measure valid law? Seal your one-word slip."
  *   *Instructor Role:* Watch for panels that want to uphold it *because* it is just. Remind them of the Craft defects. Watch for panels that strike it down purely on Craft.

  **01:05 – 01:10: Collection & Board Setup**
  *   Collect Sealed Slips (Round 2).
  *   Draw a grid on the board: 6 Panels x 2 Rounds. Columns: Verdict (Law/Not), Grounds Cited, Appeal Risk.

  **01:10 – 01:40: Debrief & Mapping (The Core Learning)**
  *   **Step 1: The Reveal (10 mins).** Open Round 1 slips. Tally on board. Ask Panels with "NOT LAW" verdicts: "What Ground did you use?" (If they say "Injustice," point to the Clerk's 'Appeal Risk' mark).
  *   **Step 2: The Tension (10 mins).** Open Round 2 slips. Tally. Compare.
      *   *Likely Pattern:* Round 1 = LAW (because it fit the Grounds). Round 2 = NOT LAW (because it failed the Grounds).
      *   *Ask:* "In Round 1, you upheld a wicked thing. In Round 2, you struck a good thing. Why?"
  *   **Step 3: Mapping to Theory (10 mins).**
      *   **Hart:** "Law is a system of rules. If it meets the Source/Craft criteria, it is law. Morality is separate." (Matches Round 1 'LAW' verdict).
      *   **Fuller:** "Law has an inner morality. If you violate the Craft Grounds (Round 2), you aren't just making bad law, you are failing to make law at all." (Matches Round 2 'NOT LAW' verdict).
      *   **The Clash:** "Hart says Round 1 is Law (unjust but valid). Fuller says Round 2 is Not Law (just but invalid). But wait—Fuller also argues that Round 1's wickedness likely required violating Craft Grounds eventually. Hart says no, wickedness can be perfectly legal."
  *   **Step 4: The Corruption of Legality (Final 10 mins).**
      *   Connect Round 1 and Round 2. "The Directorate used 'Law' to do evil (Round 1). The Provisional Council broke 'Law' to do good (Round 2). What happens to the concept of Law in Meridia?"
      *   **Landing:** "If you call Round 1 'Law', you keep the concept pure but allow wickedness. If you call Round 2 'Not Law', you protect the concept but deny justice. Fuller's point: A regime that pursues wicked ends (Round 1) inevitably corrupts the Craft Grounds (secrecy, contradiction) to hide its wickedness. Thus, wickedness and legality eventually diverge. Hart's point: Don't confuse the two. Call Round 1 'Law' so you can clearly say 'It is law, but it is too wicked to obey.'"

  ---

  ### Part 4: Troubleshooting Predictable Failures

  **1. The "German Case" Student**
  *   *Prediction:* A student says, "This is the Grudge Informer case / Radbruch Formula."
  *   *Response:* "Correct, historically. But in this room, we are testing the *mechanics*, not the history. If you know the historical solution, translate it into Ground 5 (Intelligibility) or Ground 9 (Congruence). Can you win the case using only the card in front of you?"
  *   *Why:* This validates their knowledge but forces them back into the exercise constraints.

  **2. The "Sovereign Panel" (Strike Both)**
  *   *Prediction:* A panel says, "We are the court. We strike both because we say so."
  *   *Response:* Use the Clerk. "Clerk, did they cite a Ground?" If no, "Your judgment is *Ultra Vires*. In this exercise, that means you lose legitimacy points. You are acting as a dictator, not a judge."
  *   *Why:* Reinforces that Jurisprudence is about *constrained* power, not will.

  **3. Laundering Justice**
  *   *Prediction:* Panel wants to strike Round 1 on Justice. They argue "Injustice violates Intelligibility."
  *   *Response:* Challenge the textual link. "Does 'Injustice' mean 'Unclear'? If I clearly order you to be shot, is that unintelligible? No. You are smuggling morality into Craft. The Clerk should mark 'Appeal Risk'."
  *   *Why:* This is the crux of the Hart/Fuller debate. Hart says you *are* smuggling. Fuller says extreme injustice *makes* it unintelligible as a rule. Let the tension sit.

