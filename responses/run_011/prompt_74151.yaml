  ### Part 5: Limitations of the Exercise (Honest Statement)

  You must supply the following in your closing remarks, as the exercise cannot generate them organically:

  1.  **The Social Fact of the Rule of Recognition:** The "Grounds of Decision" handout is a *text*. In reality, Hart's Rule of Recognition is a *practice*. It exists because officials accept it, not because it is written down. The exercise makes legality look like a checklist. You must explain that in the real world, the "Grounds" only matter if the police and judges *agree* to follow them.
  2.  **The External Perspective:** The students are playing *internal* participants (judges). Hart emphasizes the *external* observer (the sociologist) who sees the rules as mere habits. The exercise forces an internal viewpoint. You must remind them that a positivist can observe the system from the outside without accepting its moral claim.
  3.  **The Obligation to Obey:** The exercise asks "Is this Law?" It does not fully resolve "Must this be Obeyed?" Hart's separation thesis is specifically designed to allow us to say "It is law, but I will not obey it." The exercise risks conflating Validity with Obligation. You must disentangle these in the final debrief: "Calling Round 1 'Law' does not mean you must obey it. It means you must recognize the cost of resisting it."
  4.  **The Fullerian Slide:** Fuller argues that adherence to the Inner Morality (Craft Grounds) *pushes* law toward substantive justice. The exercise treats Craft and Substance as separate (Round 1 has Craft, no Justice; Round 2 has Justice, no Craft). You need to point out that Fuller believes Round 1 (Wicked Law) could not *sustain* its Craft Grounds indefinitely without collapsing. The exercise is a snapshot; Fuller's theory is a movie.

  ### Final Note on Running the Session
  Your role is not to facilitate consensus, but to **sustain the discomfort**. If the class agrees too easily, press the minority. If they all strike Round 1, ask: "If that wasn't law, what was it? Mob violence? Why did the victims try to comply?" If they all uphold Round 2, ask: "If the Council can ignore publication and contradiction to do good, what stops them from ignoring it to do evil next month?"

  The goal is for them to leave feeling that the definition of "Law" is not a dictionary definition, but a **tool** that changes the political options available to them. Hart gives them a scalpel (precise, cold). Fuller gives them a compass (directional, moral). They need to feel the weight of choosing which tool to hold.
