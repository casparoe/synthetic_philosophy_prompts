answer: |-
  **The Thought Experiment**

  In 1985, a specific zygote, *Z*, is created via IVF using a particular sperm and egg. Instead of immediate implantation, *Z* is cryopreserved due to a medical contraindication for the surrogate. *Z* remains frozen until 2001, when it is implanted and results in the live birth of Alice. Alice lives a standard lifespan, dying in 2071. In the nearest possible counterfactual world, the medical contraindication does not occur; *Z* is implanted in 1985, resulting in the birth of Alice sixteen years earlier. She lives the same standard lifespan, dying in 2055. In the actual world, Alice never experiences the years 1985–2001; in the counterfactual world, she does. There are no differences in family reputation, inherited wealth, or historical events affecting others; the only variable is the sixteen-year shift in Alice's conscious timeline. The goods lost in the actual world are the intrinsic experiences of childhood and early adulthood available in that era, comparable in qualitative richness and quantity to the goods lost by someone dying at 50 instead of 66.

  **Personal Identity Account**

  This scenario relies on **Biological Origin Essentialism** (a Kripkean view). This account holds that a person's identity is fixed by the specific genetic origins (the particular sperm and egg) from which they develop. Since *Z* is numerically identical in both the actual and counterfactual worlds, Alice is numerically identical across both timelines. If this account is wrong—for instance, if you hold a Psychological Continuity theory where personhood begins only with consciousness or memory—then the Alice born in 2001 is not the same entity as the one born in 1985. On that view, the 1985–2001 period belongs to a different possible person, the Non-Identity Problem returns, and the deprivation claim collapses because there is no single subject to lose out.

  **The Check: Epicurean vs. Deprivation Theorist**

  The **Epicurean** says this case changes nothing. For them, harm requires a subject to experience the state of being harmed. In the years 1985–2001, Alice does not exist consciously. Therefore, there is no time at which Alice is worse off than she would have been. The fact that the biological substrate existed in a freezer is irrelevant because the *person* did not. They will argue this mirrors death exactly: just as Alice is not around to suffer the loss of 2072 onwards, she was not around to suffer the loss of 1985 backwards.

  The **Deprivation Theorist** says Alice is genuinely harmed in the actual world. Her total lifetime welfare is lower than in the counterfactual world by the precise value of the experiences from 1985–2001. Since the Non-Identity escape is closed (it is the same *Z*, hence the same Alice), the theorist must concede that pre-natal non-existence can be a misfortune for the subject. If dying at 50 is bad because it deprives you of 16 years of life, being born 16 years late is bad because it deprives you of the same 16 years of life. The currency is identical: conscious experience.

  **Where the Symmetry Argument Bites**

  The symmetry argument gets its leverage here by closing the **Non-Identity Escape**. Usually, philosophers argue you couldn't have been born earlier without being a different person (different sperm/egg combination). By using cryopreservation, we fix the biological identity while varying the temporal start. This forces the deprivation theorist to treat pre-natal time and post-mortem time as comparable pools of possible goods. If they say death is bad because it removes possible goods from your life total, they must admit delayed birth does the same. The leverage comes from forcing the theorist to apply their own counterfactual metric consistently across both ends of the timeline.

  **The Single Feature and Its Removal**

  The single feature doing the work is the **decoupling of biological origin from temporal onset**. In ordinary conception, biological origin and temporal onset are simultaneous; you cannot change the start time without changing the gametes, which changes the person. If you remove this feature and revert to ordinary conception, the Non-Identity Problem returns immediately. If Alice's parents simply waited 16 years to conceive naturally, the resulting child would be genetically different. Thus, the actual Alice cannot claim she was deprived of those earlier years because *she* could not have had them. The symmetry argument loses its bite because the comparison is no longer between two lives of the *same* person, but between the existence of one person and the non-existence of that person (plus the existence of a different one).

  **The Strongest Reply for Asymmetry**

  The strongest reply available to someone wanting to hold onto the asymmetry is the **Temporal Bias Argument**. This view claims that harm is not just about the loss of goods, but about the thwarting of *time-relative interests*. We are creatures who care essentially about the future. We have forward-looking desires and projects. Death is a misfortune because it thwarts the future-oriented interests of the living subject. Pre-natal non-existence is not a misfortune because there was no subject with prior interests to be thwarted. We do not look backward with care; therefore, backward losses do not count as harms.

  **The Undercut**

  Accepting this reply **plainly undercuts the deprivation theorist's bog-standard claim that dying young is a misfortune.**

  Here is why: The standard deprivation account argues that death is bad *objectively*, based on the counterfactual comparison of total welfare, not merely because the dying person currently fears it. If you justify the asymmetry by saying "Past loss doesn't count because we don't care about the past," you are grounding the badness of death in our psychological orientation toward time, not in the objective loss of goods. If harm depends on having a forward-looking stance, then death is only bad insofar as the subject currently cares about the future. This invites the Epicurean back in: if harm is dependent on current attitudes, then death cannot be a misfortune for the dead person (who has no attitudes), nor for the living person regarding their own death (once they are dead).

  More critically, if you concede that deprivation requires a subject to hold an interest *at the time of the alleged loss*, you lose the death case too. When you are dead, you hold no interests. When you were unborn, you held no interests. If the lack of prior interests saves you from the symmetry argument, the lack of future interests saves you from the deprivation argument. You cannot have it both ways. Either harm is a counterfactual comparison of total life welfare (in which case symmetry holds and delayed birth is bad), or harm requires a subject's temporal orientation (in which case death is not bad for the one who dies). The symmetry argument and the timing problem are indeed the same problem wearing two hats: both ask how non-existence can be bad for a subject who isn't there to bear the badness.

  **Note on the Timing Problem**

  This case makes the "when exactly is death bad" issue **worse** for the deprivation theorist. In the standard death case, they often argue the harm occurs at the time of death or is timelessly true. In this embryo case, *when* is Alice harmed by the delay? Is she harmed in 1985 (when she wasn't conscious)? Is she harmed in 2001 (when she is born)? If they say she is harmed in 2001 by the fact of her late start, they must admit the dead are harmed at the moment of death by the fact of their early end. But if they say she is never harmed at a specific time (because harm is a timeless comparison), they concede the Epicurean point that there is no *time* at which the subject is worse off. The embryo case duplicates the metaphysical awkwardness of the death case rather than resolving it.
