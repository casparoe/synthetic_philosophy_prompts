answer: |-
  This is a remarkably sophisticated debate for a civics class. Noah and Ana are essentially reenacting centuries of political theory (Social Choice Theory vs. Pragmatic Institutionalism) without realizing it. Noah is arguing from the perspective of **voting theory** (mathematical fairness), while Ana is arguing from **political realism** (legitimacy and alternatives).

  Here is the move-by-move breakdown, the overall verdict, and the crucial concepts they both missed.

  ### Move-by-Move Evaluation

  **1. Noah: "The vote didn't express the majority's will... whoever wrote the ballot decided the outcome."**
  *   **Rating: Clearly Right (Technically)**
  *   **Why:** Noah is describing the **Spoiler Effect** in a **Plurality Voting** system. The exit poll data confirms that "Longer Days" was the **Condorcet Winner** (beats every other option head-to-head). In voting theory, if a Condorcet winner exists but loses the election, the system has failed to capture the majority preference. Noah is mathematically correct that the ballot structure (allowing three options without runoffs) determined the winner, not the voters' true preferences.

  **2. Ana: "That's an argument about a badly designed ballot, not about referendums... proves too much."**
  *   **Rating: Mostly Right**
  *   **Why:** Ana correctly identifies that vote-splitting is a systemic issue with *plurality voting*, not unique to referendums. Her "proves too much" argument is strong: if vote-splitting invalidates a result, then almost no US congressional or presidential election (which often have third parties) is legitimate. However, she slightly underplays that referendums lack the "negotiation" phase that representative elections have.

  **3. Noah: "Elections are different because losers can go back and amend stuff... a referendum answer is locked in."**
  *   **Rating: Very Right**
  *   **Why:** This is Noah's strongest point. Representative democracy is iterative; legislators can compromise on a bill after an election. A referendum is often binary and rigid. If the "will" is misread in a referendum, you can't just tweak the law; you have to start a whole new campaign. This rigidity makes the accuracy of the initial vote much more critical.

  **4. Ana: "Switzerland already solved your problem... counter-proposal on the ballot."**
  *   **Rating: Right**
  *   **Why:** Ana brings empirical evidence. The Swiss model allows for nuance within direct democracy (initiative + counter-proposal + tie-breaker). This undermines Noah's claim that referendums *must* be rigid yes/no locks. It proves the flaw is in *design*, not the *concept* of direct voting.

  **5. Noah: "The second anything gets complicated you hand the decision back to whoever writes the wording... Mandate Ratio... 23% of the whole school picked the schedule."**
  *   **Rating: Mixed (Insightful but Nihilistic)**
  *   **Why:** The first half is a deep insight into **agenda-setting power** (whoever controls the ballot controls the outcome). The second half (Mandate Ratio) is rhetorically powerful but politically extreme. By insisting that legitimacy requires >50% of *eligible* voters, he sets a bar that almost no government in history clears. He is right that the mandate is weak, but wrong to imply that makes it meaningless.

  **6. Ana: "That's true of every government that's ever been elected... 23% is definitely a lot when the alternative is 12 people."**
  *   **Rating: Clearly Right (Pragmatically)**
  *   **Why:** Ana wins the comparative argument. Democracy is always about the "least bad" option. Even a low-turnout plurality vote is more representative than an oligarchy (the student council). She successfully reframes the debate from "Is this perfect?" to "Is this better than the alternative?" which is the standard political science uses.

  ---

  ### Who is More Right Overall?

  **Ana wins on the big picture, but Noah won the specific case.**

  Noah is technically correct about the schedule vote: the math proves the school's preference was distorted by the voting system. If the goal was to measure "what the school wants," the vote failed.

  However, Ana is more right about **civics and governance**. Noah's argument leads to a dead end (democratic nihilism), whereas Ana's argument leads to solutions (better ballot design, Swiss models, comparative legitimacy). In a functioning society, we have to accept imperfect mandates because the alternative is no mandate at all. Ana successfully defended the *legitimacy* of the process despite its flaws, while Noah only successfully attacked the *accuracy* of the result.

  **Verdict:** **Ana** is more right overall because she offers a path forward, whereas Noah only offers a critique.

  ---

  ### What Both of Them Are Missing

  You hit on something important regarding the exit poll and the "will" of the school. Here are the three concepts neither of them named, which would have settled the debate:

  **1. Ranked Choice Voting (The Missing Solution)**
  Neither student mentioned **Instant Runoff Voting (IRV)** or **Ranked Choice Voting (RCV)**. This is the obvious middle ground. If students had ranked the options (1st, 2nd, 3rd), the "Online Friday" votes would have transferred to their second choice (likely "Longer Days"), and "Longer Days" would have won without needing a Swiss-style counter-proposal or a runoff election.
  *   **Why it matters:** It proves Ana right (you can fix the ballot) and Noah right (the current ballot was bad) without destroying the legitimacy of the vote.

  **2. The Exit Poll isn't "Truth," it's Hypothetical**
  Noah treats the exit poll pairwise data as the "real" will of the people. But exit polls are non-binding and hypothetical.
  *   **Why it matters:** In the actual vote, "Online Friday" voters might have voted strategically or based on intensity. Maybe the 29% who wanted Online Friday *hated* Longer Days, but in a polite exit poll, they said they preferred it over Keeping the Status Quo. The actual vote captures **intensity of preference** (what you are willing to go to the booth for), while the exit poll only captures **ordinal preference** (what you like better in theory). Neither student questioned whether the exit poll was actually a better metric than the vote itself.

  **3. Arrow's Impossibility Theorem (The "Will" Illusion)**
  Both assume there is a singular thing called "what the school wants" that can be captured if we just find the right math.
  *   **Why it matters:** Social Choice Theory (specifically Arrow's Theorem) suggests that **no voting system is perfect.** Sometimes, a group's preferences are circular (A beats B, B beats C, but C beats A). If preferences cycle, there *is* no "majority will" to begin with. Noah assumes the will exists and was suppressed; Ana assumes the will is whatever the system produces. The missing truth is that "the people's will" is often a **construction** of the voting method, not a pre-existing fact waiting to be discovered.

  **Summary for your class:**
  Noah proved the **math** was broken. Ana proved the **system** is still valid. But both missed that **Ranked Choice Voting** would have solved the specific problem without needing to argue about whether democracy is real.
