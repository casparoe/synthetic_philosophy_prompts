          *   (4) says Invariance *singles out* the 1/2 answer. It claims this isn't just another arbitrary procedure but *the* one that respects symmetry.
          *   *Conflict:* You can't hold that the problem is fundamentally ill-posed with multiple valid answers (3) AND that invariance uniquely identifies the correct physical answer (4). (3) is pluralist/conventionalist; (4) is objectivist/uniquist regarding the "straw toss" scenario.
