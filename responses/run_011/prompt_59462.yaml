          *   *Conflict:* A Uniform[0,1] *is* a uniform distribution over an uncountably infinite set of points. (2) says "equal credence in each of... uncountably many exclusive alternatives is just incoherent." (7) says "I have no problem using continuous densities... uniform over a bounded interval."
