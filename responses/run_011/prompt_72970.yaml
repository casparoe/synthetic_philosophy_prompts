          *   Crux 3: Constitution. Case: Expressive Writing/Articulation. Prediction: A says articulation reveals pre-existing state. B says articulation stabilizes/creates state.
      *   *Section 5 (Defeaters):*
          *   A's Defeater: Systematic error in *phenomenal* reports (e.g., saccadic suppression awareness).
          *   B's Defeater: Access without concepts (infants/animals analog or non-conceptual qualia reports that match neural data).

