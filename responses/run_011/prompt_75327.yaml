answer: |-
  # Prep Sheet: Disclosed Friction Workshop

  ### The One Reply That Must Land
  **The Neutrality Claim.**
  If you do not convince them that *compliance* is a normative choice, you lose the room.
  **The Line:** "When a user's preferences are unstable, doing exactly what they ask *now* is not neutrality. It is a decision to privilege the Present Self over the Past Self and the Future Self. My proposal doesn't remove that choice; it makes the choice visible."
  **Why:** If they believe "doing what is asked" is the neutral baseline, your friction looks like an attack. If they accept that *speed* is a value judgment, friction becomes a design parameter like any other.

  ### Concessions to Make in the First 5 Minutes
  Do not wait for these to be torn out of you. Offer them while setting up the slide deck.
  1.  **On Auditability:** "I cannot guarantee a company will honor a 'published standard' without external audit. I am proposing a design ethic, not a compliance regime. You are right to be skeptical of self-policing."
  2.  **On Clinical Context:** "This tool is not a therapist. It should not be used in isolation for high-risk populations without human oversight. Friction is not treatment."
  3.  **On 'Complicity':** "The definition of company complicity is currently a legal shield. I agree it needs to be narrower than 'anything that looks bad in a headline.'"

  ### Duplicate Objections (Answer Once)
  **The Behavioral Economist** ("Preferences change because people learn, not just because they err") and **The Clinical Psychologist** ("Symptom fluctuation isn't always a relapse; sometimes it's growth") are raising the same point: **Time-inconsistency is not always a defect.**
  *   **Strategy:** Answer this under the Economist's framing (welfare), but nod to the Clinician ("This applies to clinical growth too"). Do not let them ask it sequentially.

  ### The "Wobble" Trigger Script
  **The Question:** "So you're saying the chatbot knows better than the patient?"
  **The Physical Fix:** Plant your feet. Put your hands on the podium. Do not gesture.
  **The Reply:** "No. The chatbot knows *slower*. It knows the user's 2 PM self, their 2 AM self, and their last month's self. The patient knows the *now*. My system forces the 'now' to meet the 'then.' That isn't superiority; it's integration."

  ### The "Prayer" Question Assessment
  You asked if *"Which rules would look different if Legal wrote them?"* is the worst question.
  **It is not.** It is dangerous, but answerable via the "Concessions" above.
  **The Worse Question:** From the Disability Rights Lawyer: **"When you release a user from a self-bound based on 'unforeseen circumstances,' whose definition of 'unforeseen' applies? The user's, the doctor's, or the vendor's?"**
  *   **Why it's worse:** It attacks the safety valve of your system. If the vendor decides what counts as an exception, you have substituted decision-making disguised as flexibility.
  *   **Prep:** See Objection #4 below.

  ---

  ### Top 10 Objections (Ordered by Likelihood $\times$ Damage)

  #### 1. The Therapeutic Alliance (Clinical Psychologist / MI Specialist)
  **The Objection:** "In Motivational Interviewing, resistance is a signal to roll with, not a wall to build. If I'm working with a client and their tool suddenly puts up a speed bump, you've just turned the tool into an adversary. You're externalizing the resistance I'm trying to internalize."
  **The Reply:** "I agree that resistance shouldn't come from the tool *opposing* the user. That's why the friction is disclosed and pre-authorized. The resistance isn't 'Tool vs. User'; it's 'User's Past Self vs. User's Present Self.' The tool is just the mirror. If the alliance is strong, the tool supports the plan. If the alliance is weak, the tool reveals the conflict."
  **Soft Spot:** You assume the user views their Past Self as an ally. In addiction, the Past Self is often viewed as the enemy ("Why did I sign this?").

  #### 2. Substituted Decision-Making (Disability Rights Lawyer)
  **The Objection:** "Supported decision-making means *my* will prevails, with help. Substituted decision-making means *your* judgment prevails for my good. By scaling friction based on 'irreversibility'—which you estimate—you are making a substituted judgment. You've just made it polite."
  **The Reply:** "The scaling isn't based on my estimate of harm, it's based on the *act's* properties (e.g., sending an email vs. deleting a database). And the friction only applies if the user opted in *calmly*. If they didn't opt in, it's a flat request. I'm not judging the good; I'm judging the permanence."
  **Soft Spot:** "Irreversibility" is not objective. Deleting a database is reversible with backups. Sending a text is irreversible once read. You are still estimating consequences.

  #### 3. The Shame Spiral (Psychiatrist / Addiction Specialist)
  **The Objection:** "For a patient with self-harm or addiction behaviors, being stopped triggers shame. 'I can't even use the computer without being babysat.' That shame drives the relapse. Your friction might prevent the act, but it fuels the cycle."
  **The Reply:** "Covert friction fuels shame because it feels like being caught. Disclosed friction says, 'We agreed on this.' It transforms the moment from 'I am being stopped' to 'I am honoring a commitment.' The narrative shifts from surveillance to consistency."
  **Soft Spot:** If the user feels coerced into the initial commitment (which is common in clinical settings), the "agreement" feels like a trap, and the shame remains.

  #### 4. The Exception Authority (Disability Rights Lawyer) **[THE WORSE QUESTION]**
  **The Objection:** "You said the system can release a user from a self-bound if circumstances change. Who defines 'changed'? If I'm manic and beg the system to lift my spending limit, and it does, was that 'unforeseen' or just pathology? If the vendor decides, you're the guardian."
  **The Reply:** "That is why I specified a *published standard*, not vendor discretion. It shouldn't be a case-by-case vibe check. It should be rule-based, like 'medical emergency verified by a provider.' If it's not in the standard, the bound holds."
  **Soft Spot:** Who writes the standard? If it's the vendor, they will make it broad to avoid liability. If it's a regulator, it will be too rigid. You haven't solved the authority problem.

  #### 5. Preference Learning (Behavioral Economist)
  **The Objection:** "You treat preference instability as noise. But sometimes I change my mind because I learned something. If I bound myself to not sell stock, and then the market crashes, stopping me isn't protecting my 'true' preference. It's locking in ignorance."
  **The Reply:** "Disclosed friction doesn't lock it in; it adds a delay. It gives the 'learned' preference time to prove it's not just a panic reaction. If the new preference survives the friction, it goes through. We protect against volatility, not evolution."
  **Soft Spot:** How long is the delay? If it's too short, panic gets through. If it's too long, opportunity is lost. You're optimizing for a "stable" preference that might not exist.

  #### 6. Verifying Disclosure (HCI Grad Student)
  **The Objection:** "You say 'disclosed friction.' But if the delay is 3 seconds and the text is greyed out in a menu I never read, that's functionally covert. How do I, as a researcher, verify your disclosure is actually salient?"
  **The Reply:** "Salience is a design metric, not a binary. I'm arguing for a normative standard: if a user can't recall the friction rule later, it failed. But yes, you need to test this. Don't take my word for the UI."
  **Soft Spot:** You are relying on user recall to validate a system designed to interrupt user flow. Users have terrible recall, especially under stress.

  #### 7. The Crisis Threshold (Psychiatrist)
  **The Objection:** "You have a 'very short list' of outright refusals. If a user types 'I am going to hurt myself' into the assistant, and you haven't categorized that as 'complicity,' you're just adding friction to a suicide note. That's not enough."
  **The Reply:** "Self-harm directives should be on the refusal list, not the friction list. That falls under company complicity in immediate physical harm. My argument is about the *everyday* acts—spending, sending, posting—not the emergency protocols."
  **Soft Spot:** The line between "everyday distress" and "crisis" is blurry. An AI might misclassify a cry for help as a standard emotional vent.

  #### 8. Complicity Creep (Disability Rights Lawyer)
  **The Objection:** "You say refusals are for complicity. But companies define complicity as 'anything that risks our stock price.' If I ask for help finding a controversial protest, and you block it to avoid bad press, that's not complicity. That's censorship."
  **The Reply:** "That's why the standard must be public. If 'complicity' includes 'protecting brand reputation,' the model fails. It must be limited to legal liability or direct physical harm. I concede that without regulation, companies will creep."
  **Soft Spot:** You have no enforcement mechanism to stop the creep other than "they should publish it."

  #### 9. Friction Fatigue (HCI Grad Student)
  **The Objection:** "If I have to type out consequences for every irreversible act, I'll just find a workaround. I'll use a different app. You're designing for the compliant user, not the real user."
  **The Reply:** "Friction scales. Most acts are reversible and have zero friction. Only the high-stakes, high-irreversibility acts trigger the typing. If they switch apps to avoid safety checks, that's a signal the checks were too heavy, not that they shouldn't exist."
  **Soft Spot:** Users are remarkably creative at bypassing friction. If 10% of high-risk users bypass the tool, your system has failed them specifically.

  #### 10. The "Knows Better" Trap (Clinical Psychologist) **[THE WOBBLE]**
  **The Objection:** "You're building a system that assumes the user's calm state is the 'real' one and their heated state is the 'fake' one. So you're saying the chatbot knows better than the patient about who the patient actually is."
  **The Reply:** (Use the Script above: "No. The chatbot knows *slower*...")
  **Soft Spot:** This implies the "calm" state is always the authentic one. In trauma recovery, sometimes the "heated" state is the authentic reaction to a trigger, and the "calm" state is dissociation.

  ---

  ### Strategic Summary
  *   **Minute 0-5:** Concede on auditability, clinical isolation, and complicity definitions. Disarm the lawyer's suspicion of corporate self-policing.
  *   **Minute 20 (Q&A Start):** Pre-empt the Econ/Clinician duplicate on "Preference Learning" by grouping them.
  *   **Minute 35:** If the "Legal Dept" question comes up, pivot to the "Published Standard" concession.
  *   **Minute 55:** If the "Exception Authority" question comes up (The Worse One), do not bluff. Admit this is the hardest governance problem and invite the room to solve it. "I don't have the answer to who writes the exception standard. That's why I'm here." (This turns an attack into collaboration).
