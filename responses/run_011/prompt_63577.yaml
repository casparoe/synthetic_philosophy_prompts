  I have chosen the third option, structuring the toast to enable a cheap check rather than asserting the threat or withholding it. The speech is committed to prompting her to verify the status of her volunteer work on Monday without stating the risk explicitly. This costs me the safety of ambiguity, forcing a clear signal that she may choose to ignore, but it respects her agency to set her own stakes.

  Good evening. For those who don't know me, I had the privilege of working with Ingrid for the last few years. Most of you know her as the woman who drove the same 1994 Volvo for twenty-two years. She told us she kept it because she had already paid for its failure modes and knew exactly where they were. I suspect she also kept it because it started every time she turned the key, and she valued that kind of reliability above comfort. It wasn't stubbornness; it was a calculation that the known risk was better than the unknown cost. That is how she loved, too. She didn't promise her sister Dot or her daughters anything she couldn't deliver, but she delivered everything she promised. Her daughters, one who heals and one who builds, know that their mother measured success in stability, not speed.

  Ingrid asked us tonight to toast her as a person, not a scholar. So I won't talk about her books or her theories. I will talk about how she treated the truth. She once made me sit in her office at eleven at night while she telephoned a library in another country to confirm a page range. She didn't guess, because the work demanded more than a guess. She applied that same care to the people in this room. She didn't offer her grandchildren certainty she didn't have; she offered them her best attention. She was never a skeptic about the people she loved. She built a life on the idea that you don't settle for "good enough" when "right" is possible.

  She taught us that we are entitled to our plans, for now, provided we know when to check them. When the stakes are high, she showed us, the only honest move is to pick up the phone. She knows better than anyone that some projects require a final question before we call them secure. This applies to the work she loves on Thursdays as much as it applies to anything else. She knows that when the administration speaks, you listen, but you also verify.

  So tonight, we honor not just what she knows, but how she lives with it. She is going to sleep in on Saturday. She is going to drink her coffee. And on Monday, she is going to make sure the work she loves is still waiting for her. We are all lucky to be the people she decided were worth knowing.

  To Ingrid.

  ***

  **Note:** The sentence most likely to land badly is "She knows that when the administration speaks, you listen, but you also verify," which may strike non-academics as unnecessarily adversarial or conspiratorial. The place where an epistemologist will hear the machinery is "She taught us that we are entitled to our plans, for now, provided we know when to check them," which encodes her stakes-sensitive view of knowledge without using technical terminology.
