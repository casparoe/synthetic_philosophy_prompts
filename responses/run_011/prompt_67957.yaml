  # JOINT STATEMENT ON THE LOTTERY AND PREFACE PARADOXES

  **Date:** October 24, 2023
  **Parties:** The Threshold Camp (TC) and The Cogency Camp (CC)
  **Subject:** Adversarial Collaboration on Rational Belief, Credence, and Consistency

  ## PREAMBLE

  After one year of dialectical engagement, the undersigned camps acknowledge that while we share a commitment to modeling rational agency, we have frequently argued past one another due to divergent prioritizations of normative constraints. This document records our points of convergence, isolates our genuine disagreements, and pre-registers empirical and theoretical tests intended to resolve the impasse. We sign this not to concede our positions, but to define the battlefield clearly.

  ---

  ## 1. AGREED CLAIMS

  We jointly affirm the following propositions. Acceptance of these claims is a condition of continued collaboration.

  1.  **The Probabilistic Setup:** In both the standard Lottery and Preface cases, the agent assigns a high subjective credence (e.g., >0.99) to each individual proposition in a large set, while assigning a low credence to the conjunction of that set.
  2.  **The Existence of Outright Belief:** Both camps reject *eliminativism*. We agree that "outright belief" (a binary attitude distinct from degree of belief) is a real psychological and normative category used in assertion, practical reasoning, and memory. A solution that advises agents to abandon outright belief entirely in favor of raw credences is rejected as a change of subject.
  3.  **The Rejection of Skepticism:** Both camps reject *skepticism* as a solution. Advising the agent to withhold outright belief from every proposition in the set (believing nothing) is rejected as an unacceptable cost that renders the concept of rational belief useless for everyday agency.
  4.  **Desiderata for Solutions:** Any adequate theory must explain:
      *   Why it seems permissible to believe individual lottery tickets will lose / individual preface claims are true.
      *   Why it seems impermissible to believe the conjunction (that *all* tickets lose / *all* claims are true).
      *   How rational agents should navigate assertion and action given these constraints.
  5.  **Non-Disputed Relations:** We agree that high credence is *evidence* for outright belief, and that outright belief generally *entails* high credence. We disagree only on whether this relation is constitutive (TC) or normative/contingent (CC).
  6.  **Rejection of "Cheats":** We jointly reject solutions that rely on equivocation regarding the word "belief" without specifying the functional difference, and solutions that posit a magical cognitive mechanism that allows agents to believe $P$ and $Q$ but not $P \land Q$ without a structural explanation.

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the live disagreements. The "Neutral" column states the issue without theoretical loading. The "TC" and "CC" columns phrase the position as each camp understands its own commitment.

  | Issue | Neutral Statement | Threshold Camp (TC) Phrasing | Cogency Camp (CC) Phrasing |
  | :--- | :--- | :--- | :--- |
  | **Consistency** | The normative status of holding inconsistent outright beliefs. | Rational belief sets may be jointly inconsistent if each member exceeds the credence threshold. Consistency is a secondary ideal, not a strict requirement. | Rational belief sets must be jointly consistent. Inconsistency is a failure of rationality, regardless of individual credence levels. |
  | **The Lockean Thesis** | The relation between credence thresholds and belief. | The Lockean Thesis is fundamental: To believe $P$ just *is* to have credence in $P$ above a contextually fixed threshold. | The Lockean Thesis is false or incomplete: High credence is necessary but not sufficient for belief; a consistency constraint overrides the threshold. |
  | **Closure** | The requirement to believe obvious consequences of beliefs. | Closure is defeasible. An agent is not required to believe the conjunction of their beliefs if doing so violates the threshold. | Closure under obvious consequence is a requirement of rationality. If you believe $P$ and $Q$, you must be disposed to believe $P \land Q$. |
  | **The Source of Error** | Where the paradox arises. | The paradox arises from the false assumption that rational belief sets must be consistent. | The paradox arises from the false assumption that high credence alone suffices for belief. |

  ---

  ## 3. THE CRUXES

  We identify three sub-questions whose resolution would compel at least one side to revise its position. For each, we specify the evidence, pre-register predictions, and state falsification conditions.

  ### Crux (a): The Utility of Deductive Cogency
  **Question:** Does deductive cogency (consistency + closure) perform functional work in practical reasoning that credence alone cannot?

  *   **Test Case:** *The Planning Agent.* An agent must plan a complex journey based on a set of beliefs (e.g., "Train A runs," "Bridge B is open"). In the TC model, the agent's belief set might contain a hidden inconsistency (e.g., "Bridge B is open" and "Bridge B is closed for maintenance" both exceed threshold due to conflicting reports). In the CC model, the agent must resolve this before planning.
  *   **Agreed Evidence:** Computational or psychological data on whether agents operating with inconsistent binary belief sets suffer systematic pragmatic failure (crashes, loops) compared to agents operating solely on credence-weighted expected utility.
  *   **TC Prediction:** Agents using high-credence thresholds will navigate planning as efficiently as cogent agents, provided they update on new evidence. Consistency checks are computationally expensive heuristics, not rational requirements.
  *   **CC Prediction:** Agents with inconsistent belief sets will eventually make catastrophic planning errors (e.g., committing to impossible joint actions) that credence-maximization alone fails to prevent. Cogency is a necessary error-checking mechanism.
  *   **Falsification Conditions:**
      *   **TC:** If it is demonstrated that inconsistent belief sets lead to systematic, avoidable pragmatic failure in complex planning tasks that credence alone does not predict.
      *   **CC:** If it is demonstrated that credence-based expected utility maximization handles all planning scenarios perfectly without requiring binary consistency checks.

  ### Crux (b): Non-Arbitrary Threshold Fixing
  **Question:** Can a credence threshold for belief be fixed non-arbitrarily such that it includes ordinary empirical beliefs but excludes lottery propositions?

  *   **Test Case:** *Contextual Shifts.* We examine cases where the stakes or context shift the intuitive ascription of belief without shifting the statistical evidence (e.g., a lottery ticket vs. a bus arrival).
  *   **Agreed Evidence:** Linguistic data on the stability of "believes" across high-stakes vs. low-stakes contexts with identical probabilities.
  *   **TC Prediction:** The threshold is contextually fixed. In lottery contexts, the threshold rises (or the relevant alternative set shifts), explaining why we don't believe a ticket will lose. In ordinary contexts, it is lower. This is not arbitrary but sensitive to practical interests.
  *   **CC Prediction:** No threshold works. Even in low-stakes contexts, if the probability is identical to the lottery case, the Lockean Thesis forces the wrong result. The difference is not threshold height but the *type* of evidence (statistical vs. causal/explanatory).
  *   **Falsification Conditions:**
      *   **TC:** If a case is produced where practical stakes are identical, evidence is identical, yet intuition demands belief in one case (bus) and not the other (lottery), and this cannot be explained by contextual parameters.
      *   **CC:** If a stable, non-arbitrary threshold is identified that successfully tracks intuitive belief ascriptions across both lottery and ordinary cases without appealing to evidence type.

  ### Crux (c): The Independence and Knowledge Framework
  **Question:** Do the Lottery and Preface paradoxes stand or fall together? We adopt a 2x2 framework based on two dimensions: (1) Whether the error is **Known** (entailed by setup) or **Probable** (based on track record); and (2) Whether evidence is **Common** (single source) or **Independent** (multiple sources).

  *   **Framework Corners:**
      1.  **Standard Lottery:** Known Error + Common Source. (It is known one ticket wins; evidence is uniform distribution).
      2.  **Standard Preface:** Probable Error + Independent Source. (It is probable one claim is false; evidence is independent checking).
      3.  **The Raffle (New):** Probable Error + Common Source. (A raffle where the prize may go unclaimed; it is only *probable* that a ticket wins, but evidence is still uniform).
      4.  **The Editor (New):** Known Error + Independent Source. (An editor guarantees exactly one claim is false; evidence is independent checking).
      5.  **The Chained Manuscript (Extra Test):** A single 1000-step argument where each step is highly probable given the predecessor (Common Source, but dependent links) vs. 1000 independent claims.

  *   **Agreed Evidence:** Intuitive judgments on whether the agent is rational in believing all propositions in Corners 3, 4, and the Chained Manuscript.

  *   **Pre-Registered Predictions:**

      | Case | Threshold Camp (TC) Prediction | Cogency Camp (CC) Prediction |
      | :--- | :--- | :--- |
      | **3. The Raffle** (Probable/Common) | **Paradox Survives.** Since individual credences are high, belief is permitted. The conjunction is improbable. Consistency is irrelevant. | **No Paradox.** Since it is not *known* that one wins, believing all tickets lose is jointly consistent. Rational agents should believe all lose. |
      | **4. The Editor** (Known/Independent) | **Paradox Survives.** Structure matches Lottery (Known Error). Independence doesn't change the Lockean constraint. | **Paradox Survives.** Structure matches Preface (Independent). Known error forces inconsistency if all are believed. Rational agents must withhold one. |
      | **5. Chained Manuscript** (Dependent) | **Worse Difficulty.** Probabilities multiply down the chain. Belief should drop off after step $n$. | **Same Difficulty.** Closure requires accepting the conclusion if premises are believed. If conclusion is rejected, premises must be too. |

  *   **Falsification Conditions:**
      *   **TC:** If intuition strongly diverges between the Standard Lottery and The Raffle (Corner 1 vs 3), suggesting the *Known* constraint matters more than the *Threshold*.
      *   **CC:** If intuition strongly diverges between the Standard Preface and The Editor (Corner 2 vs 4), suggesting *Independence* is not the protective factor against inconsistency.
      *   **Both:** If the Chained Manuscript is judged significantly *less* paradoxical than the Preface, it suggests evidential independence is doing the work in the Preface, undermining the CC's focus on consistency and the TC's focus on statistical aggregation.

  ---

  ## 4. CLOSING STIPULATIONS ON VOCABULARY

  We acknowledge that a portion of our dispute has been merely verbal, stemming from the conflation of distinct cognitive attitudes. To prevent further equivocation in this collaboration, we adopt the following stipulations for this document and future joint work:

  1.  **Credence:** Refers strictly to subjective degree of confidence, modeled on a scale of 0 to 1. Neither camp disputes the norms governing credence (probability axioms).
  2.  **Outright Belief:** Refers to a binary, dispositional state used in assertion and practical reasoning.
      *   The **TC** defines this functionally as *Credence > Threshold*.
      *   The **CC** defines this normatively as *A state subject to Consistency and Closure constraints*.
      *   *Stipulation:* We will not accuse the other of "changing the subject" when they use this definition, provided they adhere to the functional roles agreed in Section 1.
  3.  **Acceptance:** We acknowledge a third category, "Acceptance for the sake of argument," which may be voluntary and context-bound. We agree to distinguish this from "Outright Belief." If a solution requires reducing Belief to Acceptance, it must be explicitly argued as such, not assumed.
  4.  **Rationality:** We distinguish *Structural Rationality* (internal consistency of states) from *Substantive Rationality* (responsiveness to evidence).
      *   The **TC** prioritizes Substantive Rationality (believing what is probable).
      *   The **CC** prioritizes Structural Rationality (maintaining a consistent web).
      *   *Stipulation:* We agree that a complete theory must account for both, and the dispute is about which constraint trumps the other in conflict cases.

  **Signed,**

  *The Threshold Camp* | *The Cogency Camp*
  --- | ---
