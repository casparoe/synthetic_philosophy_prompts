answer: |-
  This is a sharp argument. Your student has essentially reconstructed a version of the "voluntarist objection" to Williams, often associated with critics like Peter Railton or David Brink. They are arguing that if integrity is just fidelity to commitments, and morality generates commitments (like promises), then morality *is* integrity-preserving.

  To save the "one thought too many" intuition and the negation of (7), you need to cut the argument at **Step (2)**, supported by a challenge to **Step (4)**.

  Here is the breakdown of why to reject it, why it's seductive, and what it costs you.

  ### 1. The Step to Give Up: Step (2)
  **The Claim:** *Promising does exactly the same [as impartial morality]: the commitment binds me even when breaking it would serve my projects better...*

  **Why it looked innocent:**
  It relies on a surface-level phenomenology of constraint. Both keeping a promise and obeying an impartial moral demand feel like "I want to do X, but the rule says Y." From the inside, in the moment of conflict, the psychological friction is identical. The student argues that since the *effect* on the agent's immediate desires is the same (constraint), the *source* of the constraint shouldn't matter for the integrity objection. If Williams hates constraint on projects, he should hate promises too.

  **Why it fails (The Williamsian Rescue):**
  Williams's objection isn't about *constraint* simpliciter; it's about **alienation from the source of the constraint.**

  *   **Promising is an exercise of agency:** When I make a promise, I am extending my will into the future. The obligation comes *from me*. It is a projection of my ground projects. Keeping a promise is an act of fidelity to *my own past agency*.
  *   **Impartial Morality (Utilitarianism) is an imposition of externality:** When utilitarianism asks me to sacrifice my project for the greater good, it asks me to view my project from a standpoint that is *not mine*. It asks me to treat my own commitments as fungible satisfaction-units in a calculus I do not author.

  In the promise case, the "ranking" is still internal to the agent's narrative (I am a promise-keeper). In the impartial case, the agent is asked to become a neutral channel for utility. Step (2) conflates *self-binding* with *being bound by the universe.*

  ### 2. The Supporting Blow: Step (4)
  **The Claim:** *Promise-keeping doesn't damage anyone's integrity — it's close to the most integrity-preserving thing an agent does.*

  **Why it looked innocent:**
  This appeals to the ordinary language definition of integrity. In common parlance, a person of integrity is someone who keeps their word. If Williams's theory implies promise-keeping damages integrity, Williams seems to be redefining "integrity" so radically that he's lost the plot.

  **Why you must challenge it:**
  You have to insist that Williams is using "integrity" in a **pre-moral, psychological sense**, not a moral virtue sense.
  *   **Student's definition:** Integrity = Moral Consistency / Fidelity to Obligations.
  *   **Williams's definition:** Integrity = Fidelity to Ground Projects that make life worth living.

  If a promise ceases to serve the ground projects (e.g., I promised to meet you for lunch, but on the way I see someone bleeding out), keeping the promise *does* damage integrity in Williams's sense, because it prioritizes a rule over the substantive value that gave the rule weight. You must argue that Step (4) begs the question by assuming the moral definition of integrity that Williams is attacking.

  ### 3. The Cost of the Retreat
  You suspected you'd end up defending something thinner than Williams wanted. You are right. Here is the bill:

  **A. You lose the "Anti-Morality" Edge:**
  Williams often sounds like he is attacking "morality" as such. By conceding that *some* external constraints (promises, contracts, special obligations) are integrity-preserving, you admit that integrity is compatible with obligation. You can no longer say "Impartiality damages integrity." You must say, "**Totalizing** impartiality damages integrity." You have to allow that a *partial* morality (one that recognizes special duties) is fine. This moves you from Williams's radical critique toward a more standard Hybrid Theory or Prioritization View.

  **B. You need a Criterion for "Ground Projects":**
  If promising is okay because it flows from projects, but utilitarianism is bad because it overrides them, you need a way to distinguish which projects are "ground" projects and which are mere whims. If the student asks, "Why is 'being a promise keeper' a ground project but 'maximizing utility' not?" you need an answer. Williams is notoriously vague here. Defending him requires you to flesh out a theory of the self that Williams himself left suggestive.

  **C. The "One Thought Too Many" becomes softer:**
  You can no longer say the husband *never* needs to calculate. You have to say he doesn't need to calculate *in the moment of crisis regarding the special obligation.* If the choice is between his wife and a stranger, the calculation is alienating. But if the choice is between his wife and *three* strangers, or his wife and *the entire world*, Williams's view strains. By accepting the promise analogy, you admit that sometimes moral weight *does* override projects. This makes the "one thought" not "forbidden," but merely "misplaced in standard cases."

  ### 4. How to Save the Drowning Husband (Negating 7)
  To hold onto the intuition that the husband has had one thought too many, you frame the calculation not as **required**, but as **constitutive of a failure of relationship.**

  *   **The Student's View:** The thought is required because morality is the supreme tribunal.
  *   **Your Defense:** The thought is alienating because the relationship *is* the tribunal.

  In the promise case, I ask, "Did I promise?" In the husband case, asking "Is this impartially justified?" is like asking "Is this promise really binding?" It reveals that the agent does not actually inhabit the commitment.

  **The Retreat:** You concede that if the stakes were high enough (e.g., saving the wife causes a genocide), the calculation becomes necessary. But you hold firm that in the **standard case** (one life vs. one life), the demand for impartial justification is a category error. It treats a constitutive commitment as a tradeable commodity.

  ### Summary for Office Hours
  Tell the student:
  1.  **Reject (2):** Promising is self-legislation; Utilitarianism is external legislation. The source of the constraint matters for integrity.
  2.  **Qualify (4):** Integrity isn't rule-following; it's being true to what makes you *you*. Sometimes keeping a promise violates that (if the promise was stupid), but usually, it expresses it. Utilitarianism *always* threatens to override it.
  3.  **Accept the Cost:** Williams isn't against all morality, only against moral systems that claim **absolute priority** over ground projects.
  4.  **Save the Husband:** The husband doesn't calculate because the love *is* the reason. Calculating implies the love is just one input among others. That is the alienation.

  You end up defending a Williams who is less of an anarchist and more of a pluralist, but you keep the core insight: **There are some things you do not trade, and asking someone to price them is to ask them to cease being who they are.**
