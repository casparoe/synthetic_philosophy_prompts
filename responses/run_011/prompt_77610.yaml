answer: |-
  Framing famine as a political crime rather than a systemic failure of entitlement mapping undermines prevention and misdirects accountability.

  The crime frame mislocates agency because it searches for a break in the chain of command rather than a break in the chain of exchange. When you look for a culprit, you look for someone who violated a rule—hoarding grain, blocking a road, signing an order. But in a lawful famine, the starvation is produced by people following rules perfectly: merchants selling to the highest bidder, officials collecting taxes according to schedule, employers cutting wages because demand fell. If you insist on finding a criminal, you will either invent one to satisfy the moral urge or exonerate the system because no single law was broken. This makes the crime frame inherently ex post; you cannot identify the villain until the bodies are already on the ground because the "crime" is defined by the outcome, not the precursor conditions. By contrast, an entitlement analysis allows for ex ante intervention. If you monitor the mapping of wages to food prices, employment rates, and state transfer viability, you can see the famine forming while people are still merely vulnerable, not yet dead. The crime frame waits for death to establish guilt; the entitlement frame uses vulnerability to establish risk.

  Furthermore, treating famine as a crime frames it as an aberration committed by monsters, which implies that removing the monster fixes the problem. This leaves the entitlement map intact. If the Bengal famine was caused by greedy speculators, then punishing speculators prevents the next one. But if it was caused by a war economy inflating prices while rural wages stagnated, punishing speculators does nothing to stop the next inflationary shock from starving the same class of people. Remediation organized around finding the guilty tends to focus on punitive measures—seizures, trials, purges—rather than structural repairs like price controls, employment guarantees, or trade adjustments. You fix the person, not the machine. As long as the machine produces starvation under specific economic conditions, you will have famines, regardless of how many villains you execute.

  The strongest counter is that criminal language generates the political will necessary to act, and that de-agentifying famine risks functioning as absolution for those who could have stopped it. Telling victims that no one wronged them because no rule was broken is an insult that drains the moral energy required for reform. In cases like the Great Leap Forward, specific leaders had information and chose to prioritize ideology over human life, making the "lawful" label feel like a whitewash.

  This objection must be absorbed by distinguishing between *criminal guilt* and *political responsibility*. The crime frame demands proof of intent or rule-breaking, which is hard to establish and easy to evade. A framework of strict political responsibility demands that leaders guarantee entitlement protection regardless of intent. You do not need to prove a leader meant to starve peasants to hold them accountable; you only need to prove that their governance failed to maintain the entitlement map. This preserves the moral outrage—the leaders are still responsible for the deaths—without misdiagnosing the mechanism. It shifts the demand from "punish the monster" to "redesign the system," which is harder work but actually prevents recurrence. Regarding the Great Leap specifically: even if individuals had information, the system incentivized lying about grain yields and punished truth-tellers. Focusing on the individual liars misses the structural coercion that made lying the rational choice. The insult to the victims is not healed by executing a cadre; it is healed by ensuring the economic rules no longer permit starvation under any ideology.

  Take Bengal 1943 to stress this distinction. A district officer operating under the **crime frame** would look for hoarders and speculators driving up prices. His advice would be to raid warehouses, arrest merchants suspected of withholding grain, and enforce price ceilings through threat of imprisonment. He would view the famine as an attack by economic enemies requiring police action. A district officer operating under the **entitlement frame** would look at the ratio of agricultural wages to rice prices. His advice would be to import grain immediately to flood the market, initiate cash-for-work programs to boost purchasing power, and prioritize food distribution to laborers regardless of market logic. He would view the famine as a failure of purchasing power requiring economic intervention.

  The two frames converge on the immediate necessity of moving food into the district; both would tell the officer to stop exports. But they diverge on how to treat the market and who to target. The crime frame attacks the market actors (merchants) and assumes the market is being weaponized. The entitlement frame accepts the market mechanics but intervenes to correct the balance of power within them. The crime frame leaves the officer believing that once the hoarders are jailed, the system is safe. The entitlement frame leaves the officer knowing that unless wage-price stability is maintained, the next shock will kill again, regardless of who is in jail.
