  2.  **Deconstruct the Decision Problem (Absent-Minded Driver Analogy):**
      *   This is the classic "Absent-Minded Driver" problem (Piccione & Rubinstein, 1997), though I cannot cite it.
      *   Structure: Two intersections (windows). Start -> X1 -> X2 -> End.
      *   Action at X1: Continue (Wait) or Exit (Give).
      *   Action at X2: Continue (Wait/Rescue) or Exit (Give).
      *   Payoffs:
          *   Exit at X1 (Give 1st): 20.
          *   Exit at X2 (Give 2nd): 80.
          *   Exit at End (Give Neither): 5.
      *   Constraint: At any alarm, you don't know if you are at X1 or X2.
      *   Strategy: Probability $p$ of Giving (Exit) at any alarm. Probability $1-p$ of Waiting (Continue).
      *   Calculation of Expected Utility (EU):
          *   To get 20: Must Give at X1. Prob = $p$.
          *   To get 80: Must Wait at X1 AND Give at X2. Prob = $(1-p) \times p$.
          *   To get 5: Must Wait at X1 AND Wait at X2. Prob = $(1-p) \times (1-p)$.
