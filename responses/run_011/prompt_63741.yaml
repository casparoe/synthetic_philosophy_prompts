          *   EU(Wait) at this credence = Need to calculate value of continuing. If I wait, I go to next node. If this is X1, next is X2. If this is X2, next is End.
          *   Actually, the "self-stabilizing" claim usually means that given the belief generated by the policy, the agent is indifferent between actions *or* the action prescribed matches the optimal action given the belief.
          *   In the Absent-Minded Driver literature, the optimal planning-self strategy ($p=0.6$) is not necessarily the action-choice strategy consistent with the beliefs generated by that plan (time inconsistency).
          *   However, the resident claims: "arrives at exactly the credence that leaves her indifferent at the bedside."
