prompt: |-
  I'm a sophomore and this year I'm sitting on my college's Governance Review Panel — we're the student body that has to sign off on any change to how campus offices get filled. We're also doing a unit on sortition in my political theory course right now, which makes our own record feel kind of weird to look at, because I can't tell what principle we've actually been applying. Here are our verdicts so far, roughly in the order we took them up:

  1. **Approved** a random draw for the student members of academic conduct hearing panels (3 students per panel). They come off a volunteer list that's usually shorter than the number of seats, it's maybe two hours a month, they apply a written standard to a specific case, and their names never get published.
  2. **Rejected** sortition for Student Government president. Singleton office, enormous time commitment, a contested three-way race every year, and the winner is supposed to speak for the whole student body.
  3. **Approved** a draw for the 7 student seats on the study spaces and library hours advisory group. Two meetings a semester, no expertise required, and the last four "elections" for it were unopposed — nobody on the panel could name a single incumbent.
  4. **Rejected** it for the 5 student seats on the trustees' endowment spending subcommittee. Real money, members get named in the campus paper, the seats are genuinely contested, and everyone agreed you want people who can read an investment report.
  5. **Rejected** it for the student delegation to the town's participatory budgeting roundtable. Small money and no expertise needed, but weekly meetings for a full year, and the delegation is formally supposed to carry the college's position to the town. Historically something like 40 people apply for 6 slots and the SG president picks.
  6. **Approved** a draw for the 2 student seats on the dining vendor selection committee. Three meetings total, unopposed, names not published, and the output is basically a ranked list of caterers.
  7. **Rejected** it for the class representatives to the faculty curriculum committee. Low stakes and low time cost, but those reps are formally charged with canvassing their class and reporting back, and two of the four class elections were contested.

  The case coming up next week is the new Climate and Campus Operations Task Force: 6 student seats, monthly meetings for two years, and it writes a report to the president recommending where to spend a $150k pilot fund. The faculty co-chairs handle all the technical modeling. Nobody is expected to represent a constituency or canvas anyone. No student has ever applied for it — last year SG filled it with the two people who raised their hands. We'd use the same stratified draw (by class year and academic division) with an opt-out that returns the seat to the pool, which is the mechanic we used in case 1. Two members are already dug in: one says case 5 controls because there's real money and a two-year commitment, the other says case 3 controls because the seat has literally never attracted an applicant.

  Can you work through this for me? Specifically:

  - Which candidate rules are consistent with **all seven** of our verdicts? Give me at least three, stated precisely enough that they'd actually generate the same verdicts. And tell me which of our precedents already knock out the obvious-sounding ones like "no sortition where money is involved" or "no sortition where expertise matters" — I want to know if any of our seven is best read as an outlier instead.
  - What does each surviving rule predict for the task force, and where exactly do they diverge?
  - Your best guess at our verdict, and why you'd weight one rule over the others given how we've argued in the past.
  - Which of the seven is the closest analog, and what makes it closer than the runner-up.
  - If the record genuinely underdeterminates this one, what principle would we be committing ourselves to by voting yes, and what by voting no? I'd rather be honest about that in the meeting than pretend it's forced.
  - One further hypothetical case we could take up that would most cleanly discriminate between the surviving rules — describe it concretely, with the features that matter varied, and say what each rule would say about it.

  No need to cite anything or point me at readings, I mostly want the reasoning. Please write the whole thing in American English.
