answer: |-
  Here is an analysis of your panel's record, the surviving principles, and how they apply to the Climate Task Force case.

  ### 1. Three Consistent Rules

  Based on the seven precedents, here are three rules that accurately generate every past verdict. They are stated precisely enough to be applied as policy.

  **Rule A: The Principle of Democratic Demand**
  > Sortition is impermissible for any office where there is demonstrated political demand (defined as a contested election or a pool of applicants exceeding available seats). Sortition is permissible only when seats are uncontested, unknown, or under-subscribed.

  *   **Consistency Check:** This rule perfectly predicts all seven verdicts.
      *   **Rejections (2, 4, 5, 7):** All involved contested elections (2, 4, 7) or a surplus of applicants (5).
      *   **Approvals (1, 3, 6):** All involved under-subscribed volunteer lists (1) or uncontested/unknown seats (3, 6).
  *   **Status:** This is the strongest mechanical rule in your record.

  **Rule B: The Principle of Political Mandate**
  > Sortition is impermissible for roles requiring a representative mandate (defined as formally canvassing a constituency, carrying an official organizational position, or speaking for the entire student body). Sortition is permissible for roles based on individual judgment, preference, or the application of written standards.

  *   **Consistency Check:** This rule also predicts all seven verdicts.
      *   **Rejections (2, 5, 7):** All explicitly required representing a group or position ("speak for whole body," "carry college's position," "canvass their class").
      *   **Approvals (1, 3, 6):** All rely on individual judgment or applying rules ("apply written standard," "advisory group," "ranked list").
      *   **Note on Case 4:** The Endowment Subcommittee rejection fits here if "fiduciary oversight" is read as a mandate to protect student financial interests, though it is primarily driven by expertise (see Rule C).
  *   **Status:** This explains the *political* logic behind the rejections better than Rule A.

  **Rule C: The Principle of Competence and Consequence**
  > Sortition is impermissible for roles requiring specialized technical expertise to manage high-consequence decisions (significant financial assets or public accountability). Sortition is permissible for low-expertise tasks with limited public consequence.

  *   **Consistency Check:** This rule fits six of seven cases.
      *   **Rejections (2, 4, 5):** High stakes (Presidency, Endowment, Public Town Relations) and/or expertise (Investment reports).
      *   **Approvals (1, 3, 6):** Low stakes, low expertise (Dining, Library, Conduct).
      *   **The Outlier (Case 7):** The Curriculum Committee rejection breaks this rule. The prompt specifies "low stakes and low time cost," yet you rejected sortition. This suggests that **Representation (Rule B)** trumps **Stakes (Rule C)**. When a role is representative, stakes don't matter; sortition is out.
  *   **Status:** Strong, but Case 7 proves it is secondary to the Political Mandate.

  **Knocked-Out Rules:**
  *   **"No Sortition Where Money Is Involved":** Dead on arrival. **Case 6** (Dining Vendor) approved sortition despite involving vendor contracts and student fees. The distinction isn't money itself, but *fiduciary oversight* (Case 4) vs. *advisory spending* (Case 6).
  *   **"No Sortition Where Expertise Matters":** Nuanced. **Case 1** (Conduct) requires understanding judicial standards, yet was approved. **Case 7** (Curriculum) implies academic standing, yet was rejected. The record shows you reject *specialized technical* expertise (Case 4 investments), not general *judgment* expertise.
  *   **"No Sortition for High Time Commitments":** Weak. **Case 5** (Town Budget) was rejected with a one-year weekly commitment, but **Case 7** (Curriculum) was rejected despite "low time cost." Time correlates with rejection, but Case 7 proves it isn't decisive on its own.

  ### 2. Predictions for the Climate Task Force

  Here is how each surviving rule applies to the new case (6 seats, 2 years, $150k, no applicants, no mandate).

  *   **Rule A (Democratic Demand) predicts: APPROVE.**
      *   *Reasoning:* "No student has ever applied." This is the ultimate under-subscription. It is functionally identical to Case 1 (volunteer list shorter than seats) and Case 3 (nobody knows the incumbents).
  *   **Rule B (Political Mandate) predicts: APPROVE.**
      *   *Reasoning:* "Nobody is expected to represent a constituency." This distinguishes it from Case 5 (Town Budget) and Case 7 (Curriculum). The students are offering judgment, not representation.
  *   **Rule C (Competence & Consequence) predicts: REJECT (likely).**
      *   *Reasoning:* While faculty handle modeling, the $150k pilot fund and two-year commitment resemble the "high consequence" of Case 4 (Endowment) and the time burden of Case 5 (Town Budget). A strict reading of "Consequence" might flag the money; a strict reading of "Competence" might flag the two-year duration as requiring sustained engagement luck cannot guarantee.

  **Where they diverge:**
  The divergence is between **Legitimacy via Demand** (Rules A & B) versus **Legitimacy via Merit/Stability** (Rule C). Rules A and B view sortition as a solution to apathy and a way to avoid false representation. Rule C views sortition as a risk to the quality of decision-making over a long horizon with real funds.

  ### 3. Best Guess Verdict

  **Verdict: APPROVE.**

  **Reasoning:**
  I would weight **Rule A (Democratic Demand)** over the others. Your panel's record is most mechanically consistent on the question of *interest*. You have never approved sortition for a job students want (Cases 2, 4, 5, 7 all had applicants or contests). You have *always* approved it for jobs students ignore (Cases 1, 3, 6).

  The Climate Task Force is the strongest case for Rule A you have ever seen: zero historical applicants. To reject this would imply that sortition is only a tool of last resort for *minor* roles (like Library hours), but not for *significant* ones. However, Case 6 (Dining) shows you are willing to use sortition for operational decisions involving money when interest is low.

  Furthermore, the "Case 5 controls" argument (from your colleague) is weak because Case 5 had 40 applicants and a political mandate. Both of those "No" triggers are absent here. The "Case 3 controls" argument is stronger because both are advisory bodies with zero student interest. The increased money and time are differences in degree, not kind, whereas the lack of applicants is a difference in kind.

  ### 4. Closest Analog

  **Closest Analog: Case 3 (Library Advisory Group).**

  *   **Why:** Both are advisory bodies where the student role is to provide perspective rather than technical expertise or representation. Both suffer from chronic student apathy (Case 3: "nobody could name a single incumbent"; Task Force: "no student has ever applied"). In both cases, the administration needs a student signal, but students aren't willing to campaign for it.
  *   **Runner-Up: Case 5 (Town Participatory Budgeting).**
  *   **Why:** It involves money and a long time commitment. However, it is a weaker analog because Case 5 was a *political delegation* ("carry the college's position") with *high demand* (40 applicants). The Task Force lacks the two main features that killed Case 5.

  ### 5. Underdetermination: Principles at Stake

  If the record genuinely underdetermines this case (which is possible, given the 2-year commitment is heavier than any previous "Yes"), your vote commits you to a specific principle of governance.

  **If you vote YES:**
  You are committing to the principle that **participation is a civic duty to be distributed by lot when voluntary consent fails.** You are acknowledging that some governance labor is undesirable, and rather than letting it fall to the self-selected few (or staff appointees), the burden should be shared randomly among the populace. You are prioritizing *descriptive representation* (getting bodies in seats) over *active consent*.

  **If you vote NO:**
  You are committing to the principle that **legitimacy requires active consent, regardless of the role's desirability.** You are asserting that even for unwanted tasks, the authority to decide how money is spent must derive from a specific act of will (application or election). You are prioritizing *meritocratic or consensual legitimacy* over *descriptive representation*, effectively saying, "If no one wants to do this job, the administration should appoint experts rather than draft random students."

  ### 6. Discriminating Hypothetical Case

  To cleanly discriminate between **Rule A (Demand)** and **Rule C (Consequence/Time)**, you should consider a case that isolates the *burden* from the *interest*.

  **The Hypothetical:**
  > A **Emergency Hardship Fund Committee**.
  > *   **Function:** Reviews anonymous applications from students in financial crisis and recommends grants from a $50,000 annual pool.
  > *   **Commitment:** 10 hours per week for one semester (High burden, higher than Library, lower than Town Budget).
  > *   **Expertise:** None (Guidelines are binary checklists).
  > *   **Mandate:** None (Do not represent constituencies).
  > *   **Variable:** **Demand.**
  >     *   *Scenario X:* 0 applicants historically (Staff currently appoints friends).
  >     *   *Scenario Y:* 30 applicants for 5 seats (Students want the influence).

  **How the Rules Discriminate:**
  *   **Rule A (Demand):** Approves Scenario X (No demand); Rejects Scenario Y (High demand).
  *   **Rule C (Consequence/Time):** Likely Rejects both. The time commitment (10 hrs/week) is significant, and the stakes (denying/awarding emergency money) are high consequence, similar to the Endowment or Town Budget cases.
  *   **Rule B (Mandate):** Approves both. There is no representational mandate.

  **Why this helps:**
  If your panel approves Scenario X but rejects Scenario Y, you confirm that **Demand** is your primary driver (Sortition is an apathy remedy). If you reject *both*, you confirm that **Consequence/Time** is your primary driver (Some jobs are too important for lot, regardless of interest). Given your history with Case 7 (rejecting low-stakes curriculum reps because they were representatives), I suspect you would reject Scenario Y, but Scenario X is the true test of whether you view sortition as a legitimate tool for high-burden work.
