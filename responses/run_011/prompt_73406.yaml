prompt: |-
  ok, context first: I'm an EM at a ~60 person backend company. We run on-call rotations and we do a "blameless postmortem" after every Sev-1 and Sev-2, so roughly two or three a month land on me or one of the other three EMs. Our postmortem template literally says *no names, no judgements, only system factors*, and for about a year that felt enlightened. Now I think it's quietely broken in two directions and I want to replace it with something I can hand to another EM.

  Direction one: because we can't say anything about a person's choices, everything gets written up as if the system did it, and the fix is always "add a guardrail" or "add a lint rule" even when what actually happened is that somebody decided to skip review because they were annoyed. Same person, two outages in six months, and the process has nothing to say except "action item: sync offline."

  Direction two: when something does go wrong, the person gets frozen out anyway. They stop getting invited to design reviews, they get moved off the interesting services, nobody says it out loud. That feels worse for them then an actual conversation would have, and I can't point at where in our process it happened because it didn't happen in the process.

  So: I want a decision procedure my EM group can actually run on an incident, grounded in a real idea instead of vibes. The one I keep coming back to is Peter Strawson — reactive attitudes versus what he calls the objective attitude, i.e. the difference between being angry at someone as a person and treating them as a thing to be managed, fixed, or worked around. I have zero formal philosophy background, I read a summary and skimmed an article, so please don't assume I know the details. What I think I got out of it: there's a real difference between "they didn't know / were pressured / it was an accident" and "they aren't an agent we hold responsible here at all," and those two should NOT end up in the same place procedurally — but I also think treating someone purely as an object to be optimized is a cost we're paying, not a neutral default, which is exactly what our no-names rule does.

  What I want back:

  - the questions to ask in order during an incident review, with what counts as a sufficient answer to each, and where the procedure stops at "no further action" versus where it hands the decision to a human because it's a values call, not a facts call
  - an explicit fork for the two things above — the excusing-style cases vs the not-an-agent-here cases — and what each one licenses you to do and what it forbids
  - the step that guards against the freeze-out failure: something that says when you may NOT take the managerial/objective stance toward someone, even though it'd be easier
  - what to literally say out loud in the review meeting and to the person afterwards, in plain language, plus a version of the finding that can go in the doc without a name in it
  - where HR has to be looped in and where looping them in would be an overreaction
  - every place you're making a judgement call dressed up as a step, labeled as such
  - and mark anywhere you've invented a distinction that isn't actually Strawson's, because I genuinely can't tell the difference

  Then run it on three cases: (a) a senior engineer who force-pushed over a colleague's work mid-incident and maintains they were right to do it; (b) a new grad three weeks in who followed the runbook exactly and the runbook was two years stale, so the steps made the outage worse; (c) the two-outages person from above who everyone has quietly stopped pinging. For (c) I expect the procedure's answer to be something I don't want to hear — give it to me straight rather than sanding it down.

  Constraints: 45 min per incident, run by an EM who has never read any of this, no philosophy names or citations in the artifact itself (the reasoning should be baked in, not footnoted), and the output has to survive being said to someone's face without sounding like a therapy bot.
reasoning: |-
  Here's a thinking process that leads to the suggested incident review framework:

  1.  **Analyze the Request:**
      *   **User Role:** Engineering Manager (EM) at a ~60 person backend company.
      *   **Current State:** "Blameless postmortems" are broken. They hide human agency (Direction 1: systemic fixes for human choices) and lead to covert punishment (Direction 2: freeze-out without process).
      *   **Goal:** A decision procedure for incident reviews that distinguishes between *excusable human error* and *agency violations*, preventing both the "system did it" cop-out and the "quiet firing" dynamic.
      *   **Philosophical Basis:** Peter Strawson's "Freedom and Resentment" (Reactive Attitudes vs. Objective Attitude), but the user admits limited knowledge. I need to use the *concept* without the jargon in the final artifact.
      *   **Deliverables:**
          *   Step-by-step question procedure with stopping conditions.
          *   Explicit fork for excusable vs. non-agent cases.
          *   Guard against "freeze-out."
          *   Scripts (what to say in meeting, to the person, in the doc).
          *   HR involvement guidelines.
          *   Labeling of judgement calls vs. facts.
          *   Labeling of invented distinctions (not strictly Strawson).
          *   Application to three specific cases (Senior force-push, New grad/stale runbook, Repeat offender).
      *   **Constraints:** 45 mins max, runnable by any EM, no philosophy jargon in the artifact, plain language (not therapy-speak).

  2.  **Deconstruct Strawson for this Context:**
      *   *Strawson's Core Idea:* We relate to people via "reactive attitudes" (resentment, gratitude, indignation) when we see them as moral agents. We relate via "objective attitudes" (management, treatment, training) when we see them as subjects to be managed (due to insanity, childhood, extreme coercion, or sometimes just functional roles).
      *   *Application to EM:*
          *   **Reactive Stance:** Holding someone accountable as a peer/agent. "You chose to skip review." This allows for trust, resentment, forgiveness, and genuine professional growth.
          *   **Objective Stance:** Treating someone as a risk to be mitigated. "This person is a liability." This leads to the "freeze-out" (Direction 2) or the "system fix" cop-out (Direction 1).
      *   *The Problem:* The current "Blameless" policy forces an *Objective Stance* on everything (system fixes, no names). This denies agency. When agency *is* clearly violated (skipping review out of annoyance), the Objective Stance fails to address it, leading to covert Reactive Stance (freeze-out).
      *   *The Solution:* A framework that explicitly asks: "Was this an agent acting with capacity, or a system component failing?" If Agent -> Reactive (Accountability/Conversation). If Component -> Objective (Process Fix).

  3.  **Drafting the Framework (The "Artifact"):**
      *   *Name:* Needs to sound operational, not philosophical. "Incident Agency Review" or "Post-Incident Decision Tree." Let's go with "Incident Accountability Framework."
      *   *Structure:*
          1.  Fact Finding (What happened?)
          2.  Capacity Check (Could they have known better?)
          3.  Choice Check (Did they choose to bypass?)
          4.  The Fork (Process Fix vs. Accountability Conversation).
          5.  The Guardrail (Preventing Freeze-Out).
      *   *Scripts:* Need to be direct. "We need to talk about the choice you made," not "How did that make you feel?"
      *   *HR:* HR is for performance issues/patterns, not single incidents unless gross negligence/malice.
      *   *Labels:* I need to explicitly mark where I'm making a judgement call or deviating from Strawson in the *explanation* to the user, but the artifact itself must be clean.

  4.  **Refining the Distinctions (Strawson vs. Invented):**
      *   *Strawson:* Reactive (participant) vs. Objective (observer). Excusing conditions (ignorance, coercion) modify reactive attitudes but keep us in the participant stance. True objective stance is for those *incapable* of participation.
      *   *Invented/Adapted:* In engineering, "Objective" often means "Process Fix." Strawson's "Objective" is more clinical. I need to map "Process Fix" to "System Factor" and "Accountability" to "Participant Stance."
      *   *Crucial Adaptation:* Strawson says if someone is ignorant, we suspend resentment. But in engineering, repeated ignorance requires training (Objective). I need to distinguish between *Single Instance Ignorance* (Excusable) and *Pattern of Negligence* (Performance). The framework needs to catch the "Repeat Offender" (Case C).
      *   *Labeling:* I will add a section after the artifact explaining where I stretched Strawson.

  5.  **Developing the Three Cases:**
      *   *(a) Senior Force-Push:* This is an Agency violation. They knew the rule, chose to break it. Needs a Reactive response (Accountability). Not a process fix.
      *   *(b) New Grad/Stale Runbook:* This is a System Factor. They followed instructions. Capacity was there, Choice was to follow rules. Outcome was bad due to environment. Needs Objective response (Fix the runbook).
      *   *(c) Repeat Offender:* This is the hard one. The current system ignores it. The framework must identify this as a Performance/Behavior pattern, not a System bug. It requires moving from "Incident Review" to "Performance Management." The "straight answer" is likely that they need to be put on a PIP or managed out, not just "synced offline."

  6.  **Addressing the "Freeze-Out" Guard:**
      *   The framework must explicitly state: If you assign Accountability, you *must* reinvest. You cannot quietly sideline them. If you sideline them, you are admitting they are not an agent, which contradicts the Accountability finding.
      *   Rule: "If you assign ownership of the fix to the person, you must assign ownership of the next feature to them too." (Reintegration).

  7.  **Review against Constraints:**
      *   45 mins? Yes, the questions are tight.
      *   No philosophy names? Yes, artifact will be clean.
      *   Plain language? Yes.
      *   Mark judgement calls? Yes, in the commentary.
      *   Mark invented distinctions? Yes, in the commentary.

  8.  **Final Polish:**
      *   Ensure the tone is empathetic but firm.
      *   Make sure the HR boundary is clear (HR = patterns/policy violation, EM = behavior/coaching).
      *   Check the "Case C" output. It needs to be uncomfortable. "This is a performance issue, not an incident issue."

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe call it "Blameful Postmortem." *Correction:* No, that's toxic. Call it "Agency & System Review."
      *   *Initial thought:* Strawson says ignorance excuses. *Correction:* In engineering, ignorance of *critical* paths is a training gap. I need to distinguish "Unknown Unknown" vs. "Known Rule Ignored."
      *   *Constraint Check:* The user asked me to mark where I invented distinctions *in the response*, not in the artifact. I will add a "Meta-Commentary" section at the end for this.
      *   *Constraint Check:* "No philosophy names in the artifact." I will ensure the handout is clean.

  10. **Final Structure of Response:**
      *   Introduction (acknowledging the insight).
      *   The Artifact (The Framework itself).
      *   The Three Cases (Applied).
      *   Meta-Commentary (Strawson fidelity, judgement calls, invented distinctions).

  *(Self-Correction on Case C)*: The user wants the truth. If someone has 2 outages in 6 months due to skipping review, and the system says "add a guardrail," that's lying. The truth is "This person is not operating at the required level of judgment." The framework must force that conversation.

  *(Refining the "Freeze-Out" Guard)*: How to codify this? "The Reintegration Clause." If you have a hard conversation, you must schedule a follow-up to assign high-trust work within 30 days. If you don't, you are covertly punishing.

  *(Refining HR)*: HR comes in when it becomes a "Performance Improvement Plan" or "Termination" track. EM handles the coaching. HR handles the documentation/legal risk.

  Let's build it.cw
answer: |-
  Here is the framework you asked for. It is designed to be printed and handed to an EM with no context. Following the artifact, I have applied it to your three cases, and then provided the "Meta-Commentary" where I disclose the philosophical scaffolding, judgement calls, and invented distinctions as requested.

  ***

  # The Incident Agency Framework
  **Goal:** Determine if an incident was caused by a **System Gap** (process/tooling failed) or an **Agency Gap** (judgment/choice failed), and prescribe the correct response.
  **Timebox:** 45 Minutes.
  **Rule:** You cannot close an incident without selecting one of the two paths below.

  ## Part 1: The Fact Pattern (15 Mins)
  *Do not discuss solutions yet. Establish the timeline.*

  **Q1: What was the expected behavior?**
  *   *Sufficient Answer:* "The runbook said X," or "The engineering standard says Y."
  *   *Insufficient Answer:* "They should have known better." (If you can't point to a doc or standard, this is a System Gap, not an Agency Gap).

  **Q2: Did the person have access to the information/tools needed to succeed?**
  *   *Sufficient Answer:* "The alert fired," "The doc was linked in the ticket," "They had write access."
  *   *Insufficient Answer:* "They could have asked." (Unless asking is a documented requirement).

  **Q3: Did the person deviate from the expected behavior?**
  *   *Yes:* Proceed to Part 2.
  *   *No:* Stop. This is a **System Gap**. The person did what they were told, and the system broke. Fix the system. Do not discuss the person's performance.

  ## Part 2: The Agency Fork (15 Mins)
  *If Q3 was Yes, determine why.*

  **Q4: Was the deviation caused by pressure, confusion, or lack of training?**
  *   *Examples:* "They were sleep deprived," "The UI was misleading," "They are new and hadn't seen the standard."
  *   *If Yes:* This is an **Excusable Agency Gap**.
      *   *Action:* Coaching. "Next time, stop and ask."
      *   *Doc Wording:* "Engineer deviated from standard due to [context]. Coaching provided on escalation paths."
      *   *Stop.* Do not escalate to HR. Do not restrict access.

  **Q5: Was the deviation a conscious choice to bypass safety for speed/convenience?**
  *   *Examples:* "Skipped review to ship faster," "Ignored alert because it usually fires false," "Force-pushed to overwrite a colleague."
  *   *If Yes:* This is a **Willful Agency Gap**.
      *   *Action:* Accountability Conversation. This is not about fixing the code; it is about trust.
      *   *Doc Wording:* "Process bypassed to prioritize speed. Ownership assigned to [Role] to reaffirm standards." (No names in doc, but names in the room).
      *   *Stop.* This requires EM intervention, not just a lint rule.

  ## Part 3: The Reintegration Guard (10 Mins)
  *This step prevents the "Freeze-Out."*

  **Rule:** If you identified an **Agency Gap** (Excusable or Willful), you must schedule a **Trust Reset**.
  *   **The Requirement:** Within 30 days, the same engineer must be assigned a high-visibility task that requires the behavior they missed (e.g., leading a design review, owning a migration).
  *   **The Logic:** If you hold them responsible for the break, you must hold them responsible for the fix. If you quietly move them to low-risk work, you are treating them as a liability, not an agent. That is a performance management decision, not an incident decision.
  *   **Check:** If you are not willing to assign them high-trust work, do not classify this as an Agency Gap. Classify it as a Performance Issue and loop in HR.

  ## Part 4: HR Boundaries
  *   **Loop HR In:** If this is the *third* Willful Agency Gap in 12 months, OR if the behavior involved malice/harassment, OR if you intend to start a Performance Improvement Plan (PIP).
  *   **Do Not Loop HR In:** For a single Willful Agency Gap. This is a management conversation about standards, not a legal or policy violation yet.

  ***

  # Application to Cases

  ### Case A: The Senior Force-Push
  *   **Facts:** Senior engineer overwrote colleague's work mid-incident. Claims they were right.
  *   **Part 1:** Expected behavior is "No force-push on shared branches." They had access to this knowledge. They deviated.
  *   **Part 2:** Was it pressure/confusion? No, they claim they were *right*. This is a **Willful Agency Gap**. They chose their judgment over the protocol.
  *   **Part 3 (Reintegration):** You cannot just let them move on. You must have the Accountability Conversation. However, you must also schedule a Trust Reset. If you strip them of incident command privileges permanently without a PIP, you are violating the Guard.
  *   **The Hard Truth:** This engineer is asserting their individual judgment supersedes team safety.
  *   **Verdict:** **Willful Agency Gap.**
  *   **Script to Engineer:** "I understand you thought you were right. But when you bypassed the protocol, you made the rest of us unable to trust the branch state. That breaks the team's ability to move fast. I need you to own the fix for our merge protocol, and I need you to lead the next incident drill. If you can't follow the safety rules, I can't give you the keys."
  *   **Doc Wording:** "Merge protocol bypassed during mitigation. Ownership assigned to Senior Engineering to review conflict resolution standards."

  ### Case B: The New Grad & The Stale Runbook
  *   **Facts:** Followed runbook exactly. Runbook was wrong. Outage worsened.
  *   **Part 1:** Expected behavior was "Follow runbook." They did this.
  *   **Part 2:** Q3 asks "Did they deviate?" **No.**
  *   **Verdict:** **System Gap.** Stop immediately.
  *   **Action:** Do not have an "Accountability Conversation" with the grad. Do not coach them on "checking better." The system failed them.
  *   **Script to Engineer:** "You did exactly what we asked you to do. The instructions were wrong. I'm sorry we put you in that position. We are fixing the doc."
  *   **Doc Wording:** "Runbook step 4 contained stale configuration. Process updated to require quarterly runbook validation."
  *   **HR:** Do not loop in. This is not a performance issue.

  ### Case C: The Repeat Offender (2 Outages, 6 Months)
  *   **Facts:** Skipped review twice. "Annoyed." Current process says "Add guardrail." Team has quietly frozen them out.
  *   **Part 1:** Deviation confirmed both times.
  *   **Part 2:** Pressure/Confusion? No. Willful? **Yes.**
  *   **Part 3 (The Guard):** Here is where the framework breaks your current workflow. You have had *two* Willful Agency Gaps. The Reintegration Guard says: "If you are not willing to assign them high-trust work... classify this as a Performance Issue."
  *   **The Hard Truth:** You are past "Incident Review." You are in "Performance Management." The team freezing them out is actually the correct *instinct* (they don't trust the agent), but the wrong *process* (covert vs. explicit).
  *   **Verdict:** **Performance Issue (HR Loop Required).**
  *   **Why:** You cannot have a "Trust Reset" with someone who has broken trust twice willfully. The "Objective Stance" (managing them as a risk) is now the only honest stance.
  *   **Script to Engineer:** "We've had two incidents now where safety protocols were skipped for convenience. We can't treat this as a one-off mistake anymore. This is now about your fit for the role's requirements. We are moving this to a performance plan."
  *   **Script to Team:** "We are addressing the reliability issues with [Service]. [Engineer] is moving to a different scope while we stabilize the review process." (Honest, but professional).
  *   **Doc Wording:** "Recurring process bypass identified. Escalated to Leadership for role alignment review."

  ***

  # Meta-Commentary & Scaffolding
  *(This section is for you, the EM, not for the artifact)*

  ### 1. Strawson Fidelity vs. Invented Distinctions
  *   **Strawson's Actual View:** Strawson distinguishes between "Participant Stance" (reactive attitudes like resentment/gratitude) and "Objective Stance" (viewing someone as a subject to be managed/cured). He argues we naturally hold the Participant stance unless "excusing conditions" (insanity, childhood, extreme coercion) force us into the Objective stance.
  *   **Where I Deviated:**
      *   **The "Willful" Category:** Strawson would classify "skipping review because you were annoyed" as a standard moral failure warranting reactive attitudes (resentment/indignation). He would *not* classify this as an "Objective Stance" case. However, in an engineering context, if someone repeatedly fails this, we *must* shift to an Objective Stance (management/PIP). I invented the **"Performance Issue"** bucket to bridge Strawson's philosophy with HR reality. Strawson doesn't have a "PIP" category.
      *   **The "System Gap":** Strawson doesn't really account for "the system made me do it." He focuses on interpersonal relationships. I have treated "System Gap" as a zone where the Objective Stance is applied to the *tooling*, not the person. This is a pragmatic adaptation, not pure philosophy.
      *   **The Reintegration Guard:** This is my invention. Strawson argues that suspending reactive attitudes (forgiveness) is necessary for relationships. I codified this into a "30-day Trust Reset" rule to prevent the "freeze-out." Strawson would agree with the spirit, but the specific 30-day mechanic is operational invention.

  ### 2. Judgement Calls Labeled
  *   **Q1 (Expected Behavior):** *Judgement:* Determining if a standard "exists" is subjective. If the standard is oral tradition, an EM might claim it exists when it doesn't. *Mitigation:* The framework demands a doc or ticket link.
  *   **Q4 vs Q5 (Excusable vs Willful):** *Judgement:* Distinguishing "pressure" from "convenience" is the hardest call here. An engineer will always claim pressure. The EM must judge credibility. *Mitigation:* Look for patterns (Case C). One off = benefit of doubt. Two off = Willful.
  *   **HR Boundary:** *Judgement:* Deciding when to loop HR. I set the line at "Third Offense" or "PIP." This is a policy choice, not a philosophical truth.

  ### 3. Why This Solves Your "Direction Two" (Freeze-Out)
  *   Currently, your team takes the **Objective Stance** (freeze-out) secretly, while the process forces the **Participant Stance** (blameless doc) publicly. This cognitive dissonance creates toxicity.
  *   This framework forces alignment:
      *   If they are an Agent (Participant Stance), you must reintegrate them (Trust Reset).
      *   If they are a Risk (Objective Stance), you must admit it and manage performance (HR/PIP).
      *   You are no longer allowed to pretend they are an Agent in the doc while treating them as a Risk in the roster.

  ### 4. Implementation Note
  *   **The "No Names" Rule:** I kept "No Names" in the *Doc Wording* to preserve psychological safety for the broader org reading the postmortem. However, I explicitly require names in the *Room* (Part 2 & 3). You cannot have accountability without identifying the agent. The "Blameless Doc" is for system learning; the "Accountability Conversation" is for human alignment. Keep them separate.
  *   **The 45 Minute Limit:** This is tight. If Q3 is "No" (System Gap), you finish in 20 mins. If Q3 is "Yes," you will likely need a follow-up 1:1 for the Accountability Conversation. The 45 mins is for the *classification*, not the full coaching session.

  ### 5. What to Expect
  *   **Pushback:** Senior engineers (Case A) will hate this. They prefer the "Blameless" shield because it protects their ego from admitting they chose speed over safety.
  *   **Relief:** Junior engineers (Case B) will love this. It protects them from being scapegoated for system failures.
  *   **Pain:** Case C is going to hurt. You will likely lose that engineer. That is the point. They are costing you more in reliability than they are producing in code. The framework makes the cost visible.
