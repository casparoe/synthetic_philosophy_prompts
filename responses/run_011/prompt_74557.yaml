prompt: |-
  Method-of-historiography seminar, and one of my classmates has adopted "all history is contemporary history" as an all-purpose comeback. Sometimes he says "all *true* history," sometimes he drops the "true," and I've never gotten straight which one he means or whether it matters. Last week we were on whether you may condemn a past slaveholder by your own standards, and he said the whole anachronism worry is bogus: obviously we judge the past with present-day standards, that's just what history is, so quit pretending there's some past-only standpoint you could climb back into. He also says the line flatly contradicts "the past is a foreign country", which i doubt.

  Can you lay out the different precise claims that slogan could be making — ones about what leads historians to pick their topics, ones about what concepts or what evidence they're stuck with, ones about what makes a past-tense moral claim true — rank them from trivial to radical, and for each say whether it's actually true and whether it would license the move he made? Then say whether any of them genuinely does contradict the foreign-country line.

  Finish with a last line in the form "Verdict: <your label>" naming the one reading that supports his dismissal, or "Verdict: none" if no reading does.
