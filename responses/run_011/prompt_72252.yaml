answer: |-
  You have correctly identified that your current heuristic is strained because it attempts to compress three distinct categories of normative obligation into a single rule. Your colleague's claim that this is merely "tribal signalling" is too cynical; these conventions perform genuine social work, but they do not all work in the same way. To achieve consistency, you must separate **coordination norms** (which keep systems functioning), **distributive norms** (which govern economic fairness), and **relational norms** (which govern social standing and trust).

  Here is a principled framework that captures your intuitions without the contradictions, followed by an application to your new cases and an honest audit of your current verdicts.

  ### The Tripartite Framework of Normative Obligation

  **1. The Principle of Systemic Integrity**
  *   **Definition:** You are obligated to follow a convention when your deviation undermines a cooperative system from which you benefit, regardless of whether your specific act causes immediate physical harm. The obligation is to the *system*, not the individual.
  *   **Motivating Cases:** Queue cutting at the Leeds supermarket; crossing against the red with schoolchildren waiting.
  *   **Explanation:** In the supermarket, the queue is a fair-processing algorithm. Allowing one person to cut (even with consent from the person behind) violates the rights of those further back who are not consulted. With the schoolchildren, the wrong is not the physical risk (which you stipulated as nil) but the *expressive* damage to the signal. If the red light is treated as optional by adults, its authority to protect children is eroded. You are free-riding on the discipline of others.

  **2. The Principle of Distributive Reciprocity**
  *   **Definition:** Your financial obligation is determined by the explicit or implicit wage contract of the service provider. Where the price includes the wage, no tip is owed. Where the price excludes the wage, a tip is obligatory to complete the contract.
  *   **Motivating Cases:** Dutch restaurant (hourly wage) vs. low-wage shared tips; the self-service coffee jar.
  *   **Explanation:** In the Dutch restaurant, the wage is socialised; tipping is gratuitous. In the low-wage establishment, the tip is deferred wages; withholding it is exploitation. The coffee jar sits in a grey area: you have no *obligation* (no service provided), but the "flicker of shame" arises from a failure of *gratitude* for the infrastructure provided. This is not a breach of duty, but a failure of virtue.

  **3. The Principle of Social Capital**
  *   **Definition:** Permission to deviate from strict rules (where such deviation is tacitly tolerated) is earned through long-term compliance and community integration. Newcomers lack the credit to draw on this tolerance.
  *   **Motivating Cases:** The neighbour speeding vs. you speeding; removing shoes; refusing food.
  *   **Explanation:** Your neighbour has thirty years of compliance 'in the bank'; their speeding is read as a rare lapse within a known pattern of care. You have no such history; your speeding is read as a characterological disregard for local safety. Regarding shoes and food: these are tests of respect for the private sphere. The host sets the terms; the guest's obligation is to adapt, not to assert autonomy.

  ### The Visitor Asymmetry: Principled or Prejudice?

  The asymmetry you feel regarding the queue-cutting tourist ("worse, not better") and your own speeding ("worse of me") is **principled**, but not for the reason you initially thought. It is not that visitors are held to a *higher* moral standard, but that they lack the **epistemic authority** and **social credit** to deviate.

  1.  **Epistemic Authority:** The local knows *why* the rule exists and *when* it is safe to bend (e.g., the neighbour knows the camera locations and traffic patterns). The visitor acts on guesswork. Acting on guesswork increases risk, making the act more reckless.
  2.  **Social Credit:** Norms rely on trust. A local who speeds occasionally but generally drives safely has built trust. A newcomer is an unknown variable. Until you have proven your commitment to the local cooperative framework, you are obligated to adhere to the letter of the law to signal your reliability.

  Therefore, do not discard the asymmetry. It is a necessary feature of integrating into a new community. You must earn the right to treat rules as flexible.

  ### Application to New Cases

  **1. The Cyclist at the Red Light**
  *   **Verdict:** Wrong.
  *   **Reasoning:** This falls under **Systemic Integrity**. Even if a separate signal exists, traffic lights are a coordinated system. If cyclists treat red lights as 'give way' while cars treat them as 'stop', it introduces unpredictability into the system. Drivers may not anticipate the cyclist's movement. The safety of the system relies on uniform interpretation of signals.

  **2. The Traveller Holding a Place in a Queue**
  *   **Verdict:** Wrong (in a formal queue); Permissible (in a loose gathering).
  *   **Reasoning:** In a formal queue (like the Leeds supermarket), the "place" belongs to the person, not the group. Holding a place for a friend who arrives later effectively allows two people to occupy one slot of time, disadvantaging those behind. It violates the first-in-first-out algorithm. However, in a "loose knot" (like the self-scans), the norm is fluid, and saving a spot is merely social coordination, not queue-jumping.

  **3. The Expatriate Tipping out of Habit**
  *   **Verdict:** Not wrong to tip, but wrong to resent it.
  *   **Reasoning:** If the local norm is "no tip" (as in your Dutch restaurant case), tipping is supererogatory (a good deed beyond duty). However, if you resent it, you are operating under a false obligation. You should cease tipping to align with the **Distributive Reciprocity** of the new location. Continuing to tip out of habit can actually be harmful, as it creates inflationary pressure on local pricing and wage expectations. You should abandon the habit.

  **4. The Resident Stopping a Queueing Practice**
  *   **Verdict:** Not wrong.
  *   **Reasoning:** Conventions are contingent on mutual expectation. If the shop owners (the beneficiaries of the order) signal they do not care, the **Systemic Integrity** argument collapses. A norm cannot bind you if the institution it supports has dissolved it.

  ### An Honest Audit of Your Verdicts

  To achieve true consistency, there are two verdicts in your list that you should reconsider or refine.

  **1. The Neighbour's Speeding ("Not wrong, or barely")**
  *   **Critique:** This is the weakest link in your chain. Legally, it is wrong. Morally, under **Systemic Integrity**, it is also wrong (it risks harm). You are granting your neighbour a "halo effect" because you know them.
  *   **Correction:** You should judge the neighbour's speeding as *wrong*, but *understandable*. The asymmetry is not that their act is permissible and yours is not; the asymmetry is that their act is *consistent with their history*, whereas yours would be *indicative of your character*. You should not validate the speeding, but acknowledge that your judgment of them is softened by relationship, whereas your judgment of yourself must be strict.

  **2. The Self-Service Tip Jar ("Not wrong... flicker of shame")**
  *   **Critique:** You are conflating *obligation* with *virtue*.
  *   **Correction:** Be precise. It is **not wrong** (no obligation exists). The shame is a signal that you are failing to be *generous*, not that you are failing to be *just*. Acknowledge the shame as a prompt to virtue, not a verdict on your morality. If you are tight on funds, ignore it. If you are not, the virtuous act is to drop the coin, not because you owe it, but because it sustains a culture of gratitude.

  ### Conclusion

  Your colleague is half-right: these are signals. But they are not *merely* tribal; they are the lubricant of a complex society. You are not inconsistent; you are simply trying to use a single tool for three different jobs.

  Adopt the Tripartite Framework.
  1.  **Protect the System:** (Queues, Lights).
  2.  **Honour the Contract:** (Wages, Tips).
  3.  **Earn the Trust:** (Speeding, Shoes, Hospitality).

  If you do this, you will find that your intuition about the schoolchildren was your moral compass at its sharpest: some rules exist not to prevent the accident that *might* happen, but to preserve the order that *must* hold. As for your status in Rotterdam: you are correct to feel bound more tightly than your neighbour. You are building the credit that will one day allow you the same latitude. Until then, drive the limit, queue strictly, and leave the shoes on the rack.
