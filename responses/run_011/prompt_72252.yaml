      *   **Core Problem:** Struggling to reconcile various intuitions about social conventions, rules, and norms into a coherent ethical framework. Feels tension between "tribal signalling" (colleague's view) and genuine moral obligation.
      *   **Specific Cases Provided:**
          1.  Queue cutting (Leeds supermarket): Wrong (even if waved through/1 item).
          2.  Queue cutting (Self-scan knot): Not wrong (but feels odd).
          3.  Jaywalking (3 AM, empty): Not wrong.
          4.  Jaywalking (4 PM, schoolkids): Wrong (even if no risk/copying).
          5.  Tipping (Dutch, hourly wage): Not wrong.
          6.  Tipping (Low wage, shared tips): Wrong.
          7.  Tip jar (Self-service coffee): Not wrong (but shame flicker).
          8.  Speeding (Neighbour, 30 yrs): Not/Barely wrong.
          9.  Speeding (Me, newcomer): Worse.
          10. Shoes (Colleague's hallway): Wrong (symbolic).
          11. Food refusal (4th helping): Not wrong (but comply more than at home).
          12. Queue cutting (Tourist vs. Local): Tourist is worse.
      *   **User's Current Hypothesis:** Conventions bind if they cause harm or free-ride on cooperation. Visitors held to lower standard on harm, higher on free-riding (guest status).
      *   **User's Critique of Hypothesis:** Fails on empty vs. schoolkids crossing, tip jar, neighbour vs. newcomer speeding.
      *   **Tasks:**
          1.  State a precise principle (or set of principles).
          2.  Indicate which cases motivated each clause.
          3.  Apply to new cases (Cyclist, Queue holder, Expatriate tipping, Resident stopping practice).
          4.  Address the "visitor asymmetry" (principled or prejudice?).
          5.  Be honest about inconsistent verdicts that should be abandoned.
          6.  Distinguish distinct kinds of obligations if lumped together.
          7.  **Language:** British English.

  2.  **Deconstruct the Cases & Identify Underlying Normative Types:**
      *   *Queue Cutting (Leeds):* Fairness/Equality. Undermines the system.
      *   *Queue Cutting (Self-scan):* Ambiguous structure. No clear queue = no clear violation.
      *   *Jaywalking (3 AM):* Legalism vs. Harm. No harm, no audience.
      *   *Jaywalking (4 PM):* Expressive harm/Exemplarity. Sets a bad example, undermines the norm's authority.
      *   *Tipping (Dutch vs. Low Wage):* Distributive Justice/Contractual expectation.
      *   *Tip Jar (Self-service):* Gratitude vs. Obligation. The "shame flicker" suggests a norm of reciprocity even without strict obligation.
      *   *Speeding (Neighbour vs. Newcomer):* Social License/Integration. The neighbour has "earned" deviation through long-term compliance/social capital. The newcomer hasn't established trust.
      *   *Shoes:* Respect for private sphere/Host authority.
      *   *Food Refusal:* Hospitality vs. Autonomy. Politeness norms.
      *   *Tourist Queue Cutting:* Free-riding without contribution. Lack of stake in the community.

      *Analysis:* The user is trying to fit *moral* obligations (harm), *conventional* obligations (rules of the road), and *etiquette* (shoes, food) into one bucket. They are distinct. The "visitor asymmetry" is real but needs nuance (it's about social capital, not just guest status).

  3.  **Develop the Principle(s):**
      *   Single rule is impossible (as the user noted). Need a taxonomy.
      *   *Category 1: Coordination & Fairness (The Queue/Traffic).* Based on mutual expectation and system integrity.
      *   *Category 2: Distributive Justice (The Tips).* Based on economic reliance and explicit/implicit contracts.
      *   *Category 3: Social Membership & Trust (The Speeding/Shoes).* Based on relational history and standing within a community.
      *   *Category 4: Expressive Norms (The Schoolchildren).* Based on the signal sent to others, regardless of immediate physical harm.

      *Refining the "Visitor Asymmetry":* It's not that visitors are held to a *higher* standard morally, but they lack the *social credit* to deviate. A local speeding has a history of compliance; a newcomer is an unknown quantity. It's about *presumption of goodwill*.

      *The "Shame Flicker" (Tip Jar):* This is about *virtue* vs. *obligation*. Not wrong to skip, but virtuous to give.

  4.  **Drafting the Principles (Iterative Process):**
      *   *Attempt 1:* Do no harm, respect local customs, don't free-ride. (Too vague).
      *   *Attempt 2:* Distinguish between *constitutive rules* (queues), *economic norms* (tips), and *relational norms* (speeding/shoes).
      *   *Final Polish:* Let's call it a "Tripartite Framework of Normative Obligation."
          1.  **The Principle of Systemic Integrity:** (Queues, Traffic lights with pedestrians). Don't undermine the mechanism others rely on.
          2.  **The Principle of Relational Reciprocity:** (Tips, Food, Shoes). Respect the specific social contract of the interaction.
          3.  **The Principle of Social Capital:** (Speeding). Deviation requires earned trust.

  5.  **Addressing the Specific Questions:**
      *   *Visitor Asymmetry:* It is principled, but not about "guests" being better. It's about *epistemic humility* and *trust*. Locals know *when* it's safe to bend; newcomers don't. Also, locals have "paid dues."
      *   *Inconsistent Verdicts:* The "Schoolchildren" crossing is the strongest moral case (expressive harm). The "Neighbour vs. Me" speeding is the trickiest. Is it actually *morally* worse for the newcomer, or just *prudentially* riskier? The user feels it's morally worse. I need to validate that feeling via the "Social License" argument.
      *   *The "Shame Flicker":* Distinguish between *obligation* and *supererogation* (good to do, not wrong to skip).

  6.  **Addressing the New Cases:**
      *   *Cyclist (Red light, green traffic):* Complex. If the signal is separate, it's a coordination rule. If it's safe, is it wrong? Under *Systemic Integrity*, if the light exists for safety/flow, ignoring it undermines the system, even if safe *this time*.
      *   *Queue Holder:* Is it a queue or a gathering? If it's a formal queue, holding place violates fairness (Systemic Integrity). If informal, maybe okay.
      *   *Expatriate Tipping:* Habit vs. Local Norm. If the local norm is "no tip," tipping can be disruptive (inflationary pressure). But if it's personal habit, it's supererogatory. Resentment suggests they feel *obligated* by habit. They should stop feeling obligated.
      *   *Resident Stopping Practice:* If the shop changes owners and the norm dies, the obligation dies. Norms are contingent on the practice existing.

  7.  **Refining the Tone:**
      *   British English (colour, centre, analyse, programme, etc.).
      *   Respectful, analytical, slightly academic but accessible (matching the user's undergraduate reference).
      *   Direct and honest about inconsistencies.

  8.  **Final Review against Constraints:**
      *   Did I answer the visitor asymmetry? Yes.
      *   Did I cover the new cases? Yes.
      *   Did I identify which verdicts to drop? Yes (specifically the nuance on the neighbour speeding).
      *   Did I separate the distinct kinds of things? Yes (Integrity, Reciprocity, Capital).
      *   British English? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the "Schoolchildren" case. The user says it's wrong *even if* no risk and no copying. This points to a Kantian "maxim" argument or a "expressive" argument. I should frame it as undermining the *authority* of the signal.
      Regarding the Speeding: The user says it's *worse* for them than the neighbour. This is counter-intuitive legally, but sociologically sound. I need to explain *why* without validating law-breaking. It's about *trust*.
      Regarding the Tip Jar: The "shame" is key. It's not obligation, it's a failure of *generosity* relative to the ease of the act.

      *Structure:*
