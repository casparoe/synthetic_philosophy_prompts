      *Wait, one nuance on the Speeding:* The user says "Me, a newcomer... worse of me." I need to be careful not to endorse breaking the law. The principle is about *social standing* to deviate from *informal* tolerances, not the law itself. The neighbour knows the *tolerance*, the newcomer assumes a *permission* they haven't earned.

      *Wait, one nuance on the Queue:* "Cutting into the queue... wrong even when the person behind you waves you forward." This is interesting. It suggests the queue belongs to the *group*, not the individual behind. I must highlight this.

