answer: |-
  **PREP SHEET: 12-MINUTE PRESENTATION**
  **Goal:** Shift from blanket EAB treatment to targeted "specimen only" treatment.
  **Core Logic:** The Asymmetry Rule (High volume of potential insect suffering outweighs certainty of tree loss).

  ### 1. OPENING: THE CONCESSIONS (First 2 Minutes)
  *Do not start with insects. Start with their problems.*

  **Concede These Immediately:**
  *   **Safety is non-negotiable:** "I am not asking the town to keep dead wood standing over sidewalks. If a tree is hazardous, it comes down."
  *   **The canopy will shrink:** "I know untreated ashes will die. I am not promising to save the street shade. I am promising to save the budget from endless chemical treatments."
  *   **I am not an expert:** "I fix bikes. I don't know dendrology. I know numbers and risk."

  **Why:** This disarms the Arborist (safety) and Liaison (budget). It makes you look reasonable, not like a zealot who wants to let trees fall on cars.

  **The Non-Negotiable:**
  *   **The Chemical Load:** You cannot concede that the current chemical usage is necessary. Hold the line that reducing insecticide volume is a moral and environmental imperative, regardless of the sentience debate.

  ---

  ### 2. THE OBJECTIONS (Order of Damage)
  *These are phrased as they will speak them. Your reply must be under 60 seconds.*

  #### **Objection 1: The Council Liaison (Budget & Liability)**
  **They will say:** "Look, treatment costs $X per tree. Removal costs $Y per tree. Y is three times X. If we let them die, we are kicking a massive removal bill down the road that my office has to explain to angry taxpayers when a branch takes out a power line. Why should I trade a known cost for a liability nightmare?"

  **Your Reply:** "Because the 'known cost' is a recurring subscription fee forever. Treatment isn't a one-time fix; it's every two years, indefinitely. Removal is a one-time cost. We phase the removals over five years as the trees decline, smoothing the budget spike. You're comparing a mortgage to a car payment. The mortgage never ends."

  **Where this is soft:** Phasing removals requires active monitoring, which costs labor dollars *now*. If the town is cash-poor, the "future spike" argument doesn't matter. They might not have the capital to remove trees even when they die.

  #### **Objection 2: The City Arborist (Public Safety & Canopy)**
  **They will say:** "I've watched these trees die in other towns. Ash wood becomes brittle fast. It doesn't just drop branches; it snaps trunks. You're asking me to sign off on a plan where I know trees are going to become hazards. I can't sleep at night knowing we sprayed poison on a tree we could have saved, or left a widowmaker standing to save a bug."

  **Your Reply:** "I'm asking you to prioritize the trees that matter most—the ones by the school and senior center. We treat those. The rest, we monitor. I fix bikes; I know when a frame is cracked. I'm proposing we fund a stricter inspection schedule for the untreated street trees instead of funding chemicals for all of them. Safety stays the priority, but we stop treating trees nobody values."

  **Where this is soft:** Inspections cost man-hours. Chemicals are often cheaper than sending a crew out to check every street tree twice a year. If they say "We can't afford the inspections," your plan stalls.

  #### **Objection 3: The Entomologist (The Science/Numbers)**
  **They will say:** "Your 'hundred million insects' number is misleading. EAB treatment is usually a trunk injection. It targets the borer inside the wood. It doesn't kill a cloud of bees or beetles. You aren't saving a massacre; you're saving a specific invasive larva that destroys ecosystems. Letting EAB win hurts *more* native insects long-term by destroying their habitat."

  **Your Reply:** "I might be wrong on the exact count, but I'm not wrong on the chemical class. Most EAB treatments use neonicotinoids. Those move through the tree, into the leaves, into the soil. They don't just kill the borer; they kill the beetles and bugs eating the leaves and living in the dirt under that tree. Even if my number is too high, the impact isn't zero. And under my rule, even a small risk multiplied by thousands of trees demands we pause."

  **Where this is soft:** This is your weakest point. If they use trunk injections (imidacloprid), the non-target kill rate is significantly lower than spray. If they press hard on "Systemic injections don't kill pollinators," your "100 million" figure evaporates. *Pivot to soil health and ground beetles if they corner you here.*

  #### **Objection 4: The Beekeeper (Ecology & Forage)**
  **They will say:** "I hate neonics as much as anyone. But a living tree is a factory for life. A dead ash provides nothing. If we lose the canopy, we lose the shade, the soil stability, and the forage for everything else. You're trading a living ecosystem for a theoretical moral point about the things we're spraying."

  **Your Reply:** "A tree poisoned with systemic insecticide isn't a healthy factory. It's a toxic one. I'd rather have fewer trees that are chemical-free than a full canopy that's essentially a slow-release pill for the soil. We plant replacements. We can't plant insects back if we wipe them out now."

  **Where this is soft:** "We plant replacements" takes 20 years to match the canopy. The Beekeeper knows a sapling doesn't help the bees today. This sounds like a long-term promise to fix a short-term loss.

  ---

  ### 3. THE WEAKNESS IN YOUR "ASYMMETRY RULE"
  *You asked for honesty. Here is where the Entomologist will try to bury you.*

  Your rule relies on the idea that **Insect Death × Probability > Tree Death.**
  The flaw is **Ecosystem Collapse.**

  If the untreated trees die, the local ecosystem degrades. That degradation kills *more* insects later than the insecticide would have killed now. The Entomologist will argue that saving the tree saves *more* insects in the long run (habitat vs. chemical casualty).

  **How to patch it:** Do not argue that saving the insects *now* is the only goal. Argue that **preventing chemical saturation** is the goal. Once the soil is saturated with neonics, it stays toxic for years. Letting a tree die is bad, but poisoning the street corridor permanently is worse. Frame it as "Soil Banking" for the future.

  ---

  ### 4. THE FORBIDDEN QUESTION
  *Pray they don't ask this. If they do, do not hesitate.*

  **The Question:** (From the Council Liaison or Arborist)
  **"If a branch from an untreated tree falls and injures a person, or damages a private vehicle, are you personally accepting liability for that decision?"**

  **Why it's a trap:** If you say "Yes," you are legally exposed (and they know you can't actually pay). If you say "No," you admit you want the *town* to take the risk for your moral preference.

  **The Answer:**
  "No. The town retains liability, just as it does for any natural tree failure. But the town already accepts that risk for every non-ash tree on our streets. We don't treat maples or oaks preventatively; we inspect and remove when hazardous. I am asking you to treat the remaining ashes like the rest of the forest, not like hospital equipment. We manage the risk; we don't eliminate it with chemicals."

  ---

  ### 5. CLOSING THOUGHT (For your last minute)
  Don't end on the insects. End on the **Town's Identity.**

  "We treat the specimen trees. We save the icons. But for the rest, let's stop trying to keep them on life support with chemicals. Let's let the town breathe a little less poison, even if the shade gets thinner. I'm asking you to be comfortable with a little less control, and a little more nature."
