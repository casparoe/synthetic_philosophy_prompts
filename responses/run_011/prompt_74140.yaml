prompt: |-
  I run the consent side of a research office at an academic medical center. I'm the person who has to say whether a study team's consent process actually holds up before we let them enroll anyone — about 30 reviews a week, and increasingly they aren't about the main study at all. They're about the add-ons: biobank storage, permission for future unspecified research on the samples, sharing with an industry partner, recontact in five years, sequencing that might turn up something we'd be obliged to tell the participant about.

  The thing I can't get a handle on is what I've started calling consent by accretion. The main consent is fine — clean, well-written, reviewed. Then the team bolts on four or five secondary asks, and collects them all at once, at minute 90 of a visit, often after something uncomfortable has happened, from someone who is tired and grateful and wants to be a good patient. Everything is disclosed. Nothing is hidden. And I genuinely don't know whether what we end up with is a valid authorization or a piece of paper.

  I'd like a decision procedure my reviewers can actually run, not a framework. Concretely:

  - The questions to ask, in order, with what counts as a sufficient answer to each.
  - Where the procedure stops at "no" outright, and where it hands the decision to a human because the question is about values rather than facts.
  - The escalation triggers that send it to me or to counsel. Right now escalation is gut feel and it's wildly inconsistent between reviewers; I need it named.

  It has to survive these four patterns, which are 90% of my workload:

  1. Disclosed but buried — the commercial sharing is on page 14 in a paragraph headed "How We Handle Your Data."
  2. Timing — the ask lands at the worst moment in the visit. Is that a defect in the consent, or just bad hospitality? I need the procedure to take a position, because my committee splits on this every single time.
  3. Bundling — participants seem to think declining the biobank means dropping out of the study. Our own exit interviews suggest roughly one in four believe this, and six rounds of rewording hasn't moved it. At what point does a persistent misunderstanding that disclosure can't cure become the site's problem rather than the participant's?
  4. The "sure, whatever you need" participant, and the $75 for a follow-up visit. When is a payment a problem rather than just fair reimbursement for their time? I want a test, not a dollar figure.

  Then run it on three cases, one of which I expect will make me unhappy — if your procedure signs off on everything I currently do, it isn't worth my time, and if it kills everything, I can't use it either. Say plainly which one you think has to change and what the change costs the study.

  Two more things. It has to be runnable in twenty minutes by someone with a science background and no legal training, and it has to work when the reviewer doesn't have the full protocol in front of them — half the time they have a consent form and an email. And I don't want a tour of the theories of consent. Pick the account of what makes consent valid that you think is actually right, build the procedure on it, and defend that choice briefly; then in one paragraph tell me how the procedure would come out differently if you'd built it on the main rival. That's the only place I want alternatives.

  Be committed. Where the literature genuinely doesn't settle something — and the deception cases are like that — make the call, say why, and flag it as a call. Also tell me which steps of your procedure are judgment calls wearing a labcoat, because I'd rather know that going in than discover it in an audit. No bibliography needed, I care about the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Head of consent review at an academic medical center (AMC).
      *   **Problem:** "Consent by accretion." Main study consent is fine, but secondary asks (biobank, future use, industry sharing, recontact, sequencing) are bolted on at the end of long visits, often when patients are vulnerable/tired. Disclosure exists, but validity is questionable.
      *   **Goal:** A concrete *decision procedure* (algorithm/checklist) for reviewers, not a theoretical framework.
      *   **Requirements:**
          *   Ordered questions with sufficient answers.
          *   Stop points (Hard No vs. Human Review).
          *   Escalation triggers (named, not gut feel).
          *   Must handle 4 specific patterns: Buried disclosure, Timing, Bundling/Therapeutic Misconception, Undue Inducement ($75).
          *   Must run on 3 test cases (one must result in a rejection/revision that might make the user unhappy).
          *   Time limit: Runnable in 20 mins by non-lawyer (science background).
          *   Constraint: Reviewer often lacks full protocol (just consent form + email).
          *   Philosophical Stance: Pick *one* account of valid consent, defend it briefly, contrast with one rival in a single paragraph.
          *   Tone: Committed, direct, acknowledge judgment calls ("labcoat judgment calls").
          *   No bibliography.

  2.  **Select the Philosophical Account of Consent:**

      *   *Option A: Disclosure-Based (Legalistic).* If it's written, it's consent. (Reject: User explicitly says this fails "consent by accretion".)
      *   *Option B: Autonomy-Based (Faden & Beauchamp).* Focus on understanding and voluntariness, not just signing. (Strong contender.)
      *   *Option C: Relational/Trust-Based.* Focus on the relationship between researcher and participant. (Harder to operationalize in a checklist.)
      *   *Selection:* **Substantive Autonomy (Faden/Beauchamp influenced).** Consent is valid only if the authorization is *intentional*, *informed*, and *voluntary*. Mere disclosure is necessary but not sufficient. This aligns with the user's intuition that "everything is disclosed" isn't enough.
      *   *Defense:* It protects the *agency* of the participant, not just the *liability* of the institution.
      *   *Rival Contrast:* A purely legalistic/disclosure model would pass all three test cases because the text exists. My model fails cases where text exists but agency is compromised.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Constraint:* 20 minutes, science background, limited docs.
      *   *Structure:* Sequential gates. Pass = Next. Fail = Stop/Escalate.
      *   *Gate 1: Salience & Location (Addresses "Buried").*
      *   *Gate 2: Temporal Integrity (Addresses "Timing").*
      *   *Gate 3: Decouplability (Addresses "Bundling").*
      *   *Gate 4: Inducement Threshold (Addresses "Payment").*
      *   *Escalation Triggers:* Need specific flags.

      *   *Refining Gate 1 (Buried):* Is the secondary use on the signature page or within 2 pages of it? If no, is there a separate signature line?
      *   *Refining Gate 2 (Timing):* This is tricky without observing the visit. The procedure must rely on the *protocol description* of the consent process. If the consent form says "End of Visit" and the visit is 90 mins of procedures, that's a flag.
      *   *Refining Gate 3 (Bundling):* Look at the script. Does it say "optional"? Look at exit interview data (user mentioned they have this). If >15% confusion, automatic fail.
      *   *Refining Gate 4 (Payment):* Is payment contingent on the *secondary* use? That's the key.

  4.  **Developing Escalation Triggers:**

      *   Need to distinguish "Reviewer Fix" vs. "IRB/Lead Review" vs. "Counsel".
      *   *Reviewer Fix:* Wording changes.
      *   *Lead Review (User):* Structural issues (Timing, Bundling rates).
      *   *Counsel:* Legal risk (Industry sharing without clear opt-out, genetic findings obligations).

  5.  **Addressing the "Labcoat Judgment Calls":**

      *   Be honest. Some things can't be fully algorithmic. Identifying "vulnerability" from a form is one. Assessing "undue influence" is another.

  6.  **Developing the Test Cases:**

      *   *Case 1 (The Pass):* Clean secondary consent, separate signature, clear timing.
      *   *Case 2 (The Fix):* Buried text, but fixable with restructuring.
      *   *Case 3 (The Fail/Unhappy One):* Needs to be something common but problematic. Let's go with the "Bundling" issue where the data shows confusion, but the PI argues "we explained it." The procedure must prioritize the data over the PI's assurance. This will cost the study time/delay.

  7.  **Drafting the Content - Section by Section:**

      *   *Philosophy:* State the Substantive Autonomy stance clearly.
      *   *The Procedure:* Step-by-step.
      *   *Escalation:* Clear matrix.
      *   *Judgment Calls:* Transparency section.
      *   *Test Cases:* Apply the procedure.
      *   *Rival Contrast:* One paragraph.

  8.  **Review against Constraints:**

      *   *20 mins?* Yes, if it's a checklist.
      *   *No full protocol?* The questions must rely on the Consent Form (CF) and the Consent Process Description (CPD) email.
      *   *Commitment:* Don't hedge. Say "This is a No."
      *   *Unhappy Case:* Ensure Case 3 actually stops enrollment until fixed.

  9.  **Refining the "Timing" Question (Pattern 2):**

      *   User asks: "Is that a defect in the consent, or just bad hospitality?"
      *   My stance: It's a defect in *voluntariness*. If the patient is exhausted, they cannot exercise autonomy.
      *   Procedure Check: Does the CPD specify *when* consent occurs relative to procedures? If "after procedures," -> Escalate.

  10. **Refining the "Bundling" Question (Pattern 3):**

      *   User says 25% confusion rate.
      *   Procedure Check: If exit data shows >10% confusion on optionality -> Stop. Don't wait for 6 rounds of rewording. Change the *process*, not just the words.

  11. **Refining the "Payment" Question (Pattern 4):**

      *   Test: Is the payment *pro-rated* or *contingent* on the secondary add-on? If I get $75 only if I say yes to the biobank, that's coercion. If I get $75 for the visit regardless, it's reimbursement.

  12. **Final Polish:**

      *   Ensure tone is professional, authoritative, and empathetic to the reviewer's burden.
      *   Check the "Unhappy Case." I need to make sure I tell the user *why* this will make them unhappy (e.g., it halts a high-priority study).
      *   Check the "Labcoat" section. Be specific about where human intuition is still required.

      *(Self-Correction during drafting)*: I initially thought about requiring observation of consent. But the user said reviewers often don't have full protocol and need to do this in 20 mins. I can't require direct observation for every review. I must rely on the *described process*. If the described process is "end of visit," that's the trigger.

      *(Self-Correction on Philosophy)*: Make sure I don't get bogged down in ethics theory. Keep it to the "Defense" and "Rival" sections as requested.

      *(Self-Correction on Case 3)*: The user wants one case that makes them unhappy. If I reject a study because of bundling despite "perfect text," that challenges the reliance on text. That's the right friction point.

  13. **Final Output Generation** (incorporating all above thoughts).
answer: |-
  ### The Philosophical Stance: Substantive Autonomy

  I am building this procedure on **Substantive Autonomy**. Under this account, consent is not a signature on a disclosure document; it is an *authorization* given by an agent who understands the choice, intends to authorize the specific action, and acts voluntarily without controlling influences. Disclosure is necessary but not sufficient. If the context (timing, fatigue, bundling) undermines the participant's ability to exercise agency, the consent is invalid regardless of the text.

  **Why this account?** Because your problem isn't that teams are hiding things; it's that they are securing signatures when agency is compromised. A disclosure-based model protects the institution from liability; a substantive autonomy model protects the participant's right to decide. You asked for validity, not liability coverage.

  **The Rival:** If I built this on a **Legalistic Disclosure** model (the main rival), the procedure would ask only: "Is the information present?" and "Is there a signature?" All three test cases below would pass. The "buried" text passes because it exists. The "timing" passes because the form was signed. The "bundling" passes because the text says "optional." That model solves your audit risk but ignores your moral risk.

  ***

  ### The Decision Procedure: "The Accretion Audit"

  **Reviewer Profile:** Science background, no legal training.
  **Time Budget:** 20 Minutes.
  **Inputs:** Consent Form (CF) + Consent Process Description Email (CPD).
  **Outputs:** Pass, Conditional Pass (Revision Required), Escalate to Lead (You), Escalate to Counsel.

  #### Gate 1: Salience & Separation (Addresses "Buried Disclosure")
  **Q1.1:** Is the secondary use (biobank, industry share, future contact) located on the signature page or within the two pages immediately preceding it?
  *   **Yes:** Proceed to Q1.2.
  *   **No:** Proceed to Q1.3.

  **Q1.2:** Is there a distinct initial line or checkbox *specific* to the secondary use, separate from the main study signature?
  *   **Yes:** **PASS Gate 1.**
  *   **No:** **FAIL Gate 1.** (Action: Require separate signature line.)

  **Q1.3:** Is there a standalone supplementary consent form for the secondary uses?
  *   **Yes:** **PASS Gate 1.**
  *   **No:** **FAIL Gate 1.** (Action: Require either relocation to signature area or standalone form.)

  *Rationale:* If a participant signs page 1 and skims page 14, they have not authorized page 14. Proximity correlates with attention.

  #### Gate 2: Temporal Integrity (Addresses "Timing")
  **Q2.1:** Does the CPD explicitly state *when* the consent discussion occurs relative to clinical procedures or study interventions?
  *   **Yes:** Proceed to Q2.2.
  *   **No:** **ESCALATE TO LEAD.** (Reason: Process undefined. Cannot assess validity.)

  **Q2.2:** Does the CPD state consent occurs *after* invasive procedures, at the *end* of a visit exceeding 60 minutes, or after the delivery of significant clinical news?
  *   **No:** **PASS Gate 2.**
  *   **Yes:** **ESCALATE TO LEAD.** (Reason: High risk of fatigue/duress compromising voluntariness.)

  *Rationale:* This takes a position on your Pattern #2. Consent obtained when a patient is physically compromised or cognitively fatigued is defective consent, not just bad hospitality. The procedure treats this as a structural flaw.

  #### Gate 3: Decouplability (Addresses "Bundling")
  **Q3.1:** Does the CF text explicitly state that declining the secondary use has *no effect* on clinical care or main study participation?
  *   **No:** **FAIL Gate 3.** (Action: Rewrite.)
  *   **Yes:** Proceed to Q3.2.

  **Q3.2:** Is there exit interview data or pilot data available regarding participant understanding of this specific choice?
  *   **No:** **CONDITIONAL PASS.** (Action: Require collection of exit data on first 5 participants.)
  *   **Yes:** Proceed to Q3.3.

  **Q3.3:** Does the data show >10% of participants believed the secondary use was mandatory?
  *   **No:** **PASS Gate 3.**
  *   **Yes:** **ESCALATE TO LEAD.** (Reason: Textual disclosure has failed to cure misunderstanding. Process change required.)

  *Rationale:* This answers Pattern #3. If 25% of patients misunderstand after 6 rounds of rewording, the problem is not the words; it is the assumption that words alone convey choice. The procedure stops the "reword and retry" loop.

  #### Gate 4: Inducement Threshold (Addresses "Payment")
  **Q4.1:** Is the payment amount prorated or contingent on agreeing to the secondary use? (e.g., "$100 total, but only $50 if you decline biobank")
  *   **Yes:** **ESCALATE TO COUNSEL.** (Reason: Coercive structure.)
  *   **No:** Proceed to Q4.2.

  **Q4.2:** Is the payment for the secondary use visit disproportionately high compared to the time burden? (Test: Does the hourly rate exceed 3x the local unskilled labor wage?)
  *   **No:** **PASS Gate 4.**
  *   **Yes:** **ESCALATE TO LEAD.** (Reason: Potential undue inducement.)

  *Rationale:* This answers Pattern #4. The test isn't the dollar figure ($75); it's the *contingency* and the *rate*. Reimbursement is fine; payment for agreement is not.

  ***

  ### Escalation Triggers (Named)

  Do not use "Gut Feel." Use these labels when sending an email to me or Counsel.

  1.  **The "Fatigue Flag" (Gate 2):** Consent process scheduled after clinical burden. *Send to Lead.*
  2.  **The "Persistent Misconception" (Gate 3):** Exit data shows >10% confusion despite clear text. *Send to Lead.*
  3.  **The "Contingent Cash" (Gate 4):** Payment tied to secondary authorization. *Send to Counsel.*
  4.  **The "Black Box" (Gate 2):** Process description missing timing details. *Send to Lead.*

  ***

  ### Labcoat Judgment Calls

  I am flagging these steps because they require human intuition, not just checklist ticking. If an audit challenges you, these are the vulnerable points.

  1.  **Gate 2 (Timing):** Determining if a visit is "clinically burdensome" requires knowing the disease state. A 90-minute visit for a healthy volunteer is fine; for a chemo patient, it is not. The reviewer must infer this from the study population.
  2.  **Gate 4 (Inducement):** The "3x wage" test is a heuristic. A $75 payment might be coercive to a homeless population but negligible to executives. The reviewer must assess *vulnerability of the population*, which is a judgment call.
  3.  **Gate 3 (Data Interpretation):** If exit data says 9% were confused, but the comments suggest they felt pressured, the reviewer must decide if 9% is actually 20% underreported.

  ***

  ### Test Cases

  Here is the procedure applied to three real-world scenarios from your workload.

  #### Case 1: The "Clean" Biobank Add-On
  *   **Inputs:** Main study CF + 1-page Biobank Addendum.
  *   **Process:** Consent happens at screening visit (45 mins), before any blood draw.
  *   **Payment:** $0 for biobank.
  *   **Run:**
      *   Gate 1: Separate signature on Addendum. (Pass)
      *   Gate 2: Screening visit, before procedures. (Pass)
      *   Gate 3: Text clear, no exit data yet. (Conditional Pass: Collect data.)
      *   Gate 4: No payment. (Pass)
  *   **Verdict:** **Conditional Pass.**
  *   **Cost:** None. Study proceeds, but team must report understanding metrics on first 5 enrollees.

  #### Case 2: The "Buried" Industry Share
  *   **Inputs:** Single 20-page CF.
  *   **Process:** Consent at Visit 3 (90 mins), after MRI and lumbar puncture.
  *   **Clause:** Industry sharing disclosed on Page 16 under "Data Safety." No separate signature.
  *   **Run:**
      *   Gate 1: Page 16, no separate signature. (Fail)
      *   *Action:* Require separate signature line or move to Page 1.
      *   Gate 2: Consent after LP/MRI at Visit 3. (Escalate to Lead - Fatigue Flag).
  *   **Verdict:** **Escalate to Lead.**
  *   **Cost:** Study pause for 1 week while we renegotiate process timing.
  *   **Why:** The text fix is easy, but the timing is a validity threat. I am overruling the PI's schedule.

  #### Case 3: The "Good Patient" (The Unhappy One)
  *   **Inputs:** Single CF. Secondary asks (biobank + genetic return) included.
  *   **Process:** Consent at end of first treatment visit.
  *   **Payment:** $75 for the follow-up visit where genetic results are discussed.
  *   **Data:** Exit interviews show 25% believe declining genetic return stops their treatment. PI argues: "We say it's optional in bold."
  *   **Run:**
      *   Gate 1: Separate checkbox exists. (Pass)
      *   Gate 2: End of treatment visit. (Escalate to Lead - Fatigue Flag).
      *   Gate 3: Exit data shows 25% confusion. (Escalate to Lead - Persistent Misconception).
      *   Gate 4: $75 for 30 min visit = $150/hr. Local wage ~$20/hr. 7.5x multiplier. (Escalate to Lead - Inducement).
  *   **Verdict:** **STOP. Do Not Approve.**
  *   **Cost:** High. This study cannot enroll until they:
      1.  Move consent to a separate, non-treatment visit.
      2.  Implement a "teach-back" method to prove understanding (adds 15 mins to staff time).
      3.  Reduce payment to $30 or remove contingency.
  *   **Why this makes you unhappy:** This is likely a high-profile study. The PI will scream that we are blocking science with bureaucracy. The text *is* bold. The payment *is* common. But the procedure identifies that the *context* invalidates the choice. The 25% confusion rate proves the disclosure is failing. Under Substantive Autonomy, this is not consent; it is compliance.

  ***

  ### Summary of Commitments

  1.  **Timing is a Validity Defect:** I have taken the position that asking for consent after clinical burden is a structural flaw, not a hospitality issue. This will cause friction with clinical teams.
  2.  **Data Over Text:** If exit data shows misunderstanding, the text is deemed insufficient regardless of readability scores. This stops the "rewording loop."
  3.  **Inducement is Relative:** The $75 isn't the problem; the hourly rate and contingency are. This requires reviewers to do math, not just look for dollar signs.

  This procedure will reject valid signatures that lack valid authorization. That is the point. If you want to process 30 reviews a week without sleeping, use a disclosure checklist. If you want to ensure the consent holds up when a participant complains five years later, use this.
