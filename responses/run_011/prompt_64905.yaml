      *   *Tension:* If I am a *substance*, I should persist without modes (thinking). But Descartes says *si cessarem... desinerem*.
      *   *Resolution:* Thinking is the *principal attribute*. A substance cannot exist without its principal attribute. So, no thinking = no substance. The conservation doctrine *repairs* the gap by explaining *how* I persist from moment to moment (God's will), but it confirms the *quandiu* restriction (I need a cause to persist, and my essence is thinking).

  8.  **Formulating the Verdict:**
      *   Does it license a thinking substance? Yes, but a substance whose existence is essentially active.
      *   Momentary subject? Existence is momentary, but the *nature* is substantial.
      *   Cost: It makes personal identity over time dependent on God and memory (later validated), not on the *cogito* alone. The *cogito* is an intuition, not a syllogism proving a soul's immortality directly.
      *   The "I" is not merely grammatical (against Option C) because he infers properties (doubting, willing, etc.) inhering in it.

