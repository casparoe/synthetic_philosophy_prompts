prompt: |-
  I'm a third-year in a metaphysics seminar and our prof has made each of us run something for the whole cohort on the last day of term — about 28 people, mixed ability, at least four of whom have already told me they think this topic is fake. Flat classroom, no budget, but there's paper, pens, and whatever everyone happens to have on them (keys, phones, water bottles, coats, rucksacks). 40 minutes including debrief.

  We've just finished the special composition question: universalism, nihilism, the restricted answers (contact, fastening, doing-the-work-of-a-thing, life), and the deflationist line that it's really just a question of how we count. I want them to feel the arbitrariness pressure on any restricted answer, but I want it to come out of the scoreboard, not out of my mouth. My rough idea is that the room is a bonded warehouse and every object being shipped out needs a sticker, stickers are points, and any team can challenge another team's sticker by exhibiting a configuration the challanged rule either swallows whole or spits out absurdly — successful challenges move points. So the incentive is: claim objects to earn, but every claim you make exposes your cutoff to attack. Universalism should look like free money that collapses under challenges, nihilism should look like total safety that earns nothing, and every restricted rule should end up stuck defending a line it can't justify.

  Answer as exactly five numbered items, each a sentence or two, no intro and no conclusion. Commit to one design — one payoff scheme, one twist, one debrief — and say why you picked it over the obvious alternatives rather than handing me a menu to choose from. The five items, in order:

  1. Setup and materials, including how I split 28 people and what each group physically has in front of it.
  2. The rules of the claiming phase and the challenging phase, with timings that actually fit in 40 minutes.
  3. The exact point values — and tell me straight whether they really generate the pressure I described or just reward whichever team shouts loudest.
  4. One mid-game twist, plus your verdict on a mechanic I'm unsure about: I want teams to write their rule down before they see any hard cases and then be forced to apply it, but I'm worried that just teaches them to hedge their wording strategically instead of feeling any metaphysical pressure, so say definitively whether to keep it.
  5. The debrief — which specific moments map onto which actual positions, what will predictably go wrong the first time I run it and how to handle that, and which feature of the debate the game simply cannot reproduce so I have to supply it myself. I already suspect it's that "counts as one object for scoring purposes" is conventionalist from the start, so tell me whether that's fatal or something I can use.
