  2. Spend five minutes explaining that teams earn points by sticking labels on object-configurations according to a secret rule, then spend twenty minutes alternating between two-minute claiming rounds and open challenge periods where opponents steal points by exposing contradictions. This rigid timing prevents the seminar from devolving into unstructured arguing and forces rapid ontological commitment.

  3. Award one point per valid claim but grant two points to challengers who prove a rule admits absurd fusions or denies obvious wholes, ensuring that aggressive universalism bleeds points while nihilism starves. This asymmetric payoff is selected over equal scoring because it mechanically incentivizes the specific arbitrariness pressure you want the cohort to feel.

  4. Keep the pre-written rule requirement because strategic hedging *is* the metaphysical pressure of precisifying vague predicates, and introduce a mid-game twist where all teams must swap rules and defend their opponent's ontology. Forcing them to defend a rival's cutoff exposes the fragility of restricted composition faster than letting them refine their own wording endlessly.

  5. Expect teams to cheat on their own rules during play, so handle this by pausing to publicly audit a slip before mapping the final scoreboard onto universalism, nihilism, and restricted views. The game cannot reproduce mind-independent facts, but that conventionality is not fatal and should be used to show the SCQ might ultimately rest on linguistic decisions.
