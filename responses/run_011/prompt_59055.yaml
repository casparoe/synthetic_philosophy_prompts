answer: |-
  Good morning. I have lived in this city for twenty years. I designed this process. I recruited you. I am not a neutral convener, and I will not pretend to be one. I must begin with the limit of your authority. Your recommendations are advisory. The Council resolution says the report will be received. The Council will vote within ninety days. The vote will be public and recorded. I may say exactly that and no more. You are not decoys. You are witnesses.

  You are here because the city is under a federal order. We must eliminate combined sewer overflows within twelve years. There are three realistic options. A tunnel financed by a thirty-year bond would raise sewer rates by roughly ninety percent. The increase would fall hardest on households already spending the largest share of income on water. A distributed green-infrastructure program is cheaper on paper. It is slower. Its performance is genuinely uncertain. Minimal compliance invites fines and contempt of court. The Council has asked you to recommend one of these three.

  There is another fact. In November, a neighborhood coalition will put a measure on the ballot. It caps any increase in municipal utility rates at three percent per year. Several of you signed that petition. If it passes, the tunnel is unfundable. The city risks contempt. I may not treat that cap as foolish. It is a legitimate instrument of civic power. You must know it may overtake your work entirely.

  This brings me to the difference between your work and that ballot. A referendum converts reasons into a number and then discards the reasons. The ballot yields an authoritative outcome carrying no inspectable justification. It records fifty-one percent. It records nothing on what the majority was responding to. It records nothing about what considerations moved them. It records nothing about what they were willing to trade. An assembly converts numbers into reasons and then discards the number. You yield an inspectable justification carrying no authority. You will produce a report anyone can read. No one is bound by it. Each instrument lacks precisely what the other has and cannot supply.

  Your work matters not in spite of being advisory. It matters because the city will have a number in November whether or not you succeed. The city will have reasons only if you produce them. A plumber does not need a PhD to know when a pipe is undersized. A schoolteacher does not need an engineering degree to know when a cost is unfair. You were not selected because you are experts on hydraulics. You do not represent constituents. You do not necessarily live near an outfall. You were selected for the capacity to weigh conflicting claims without hiding behind expertise. You were selected to be seen doing this over five weekends.

  There is an objection I know is coming. You might ask what authority you have to judge these trade-offs. The Athenians placed the body chosen by lot upstream of the body that voted. They gave it control of the agenda. A sortitioned body is not decorative even where the voters decide otherwise. You set the terms of the debate. You force the reasons into the light.

  I speak now to the elected officials behind me. Convening this assembly shifts part of the cost of a bad decision onto people who did not ask for it. That cost is political. You have shared it.

  I admit the design is more elegant than the sewer problem. Elegance will not stop the overflow. Truth might. You will hear technical presentations. You will hear from advocates. You will argue among yourselves. You will not agree on everything. You do not need to. You need to produce a record that shows how free people weigh impossible choices.

  The room contains reporters. One writes headlines. They will look for conflict. They will look for failure. Give them something else. Give them a record of justification. If the Council votes against your recommendation, let the vote stand against your reasons. If the ballot cap passes, let it pass against your analysis. The number will stand regardless. The reasons must stand because you built them.

  You are not here to save the city. You are here to account for it. The sewer lines are underground. The money is invisible. The law is federal. The politics are local. You are the only thing in this room that is public. Do not treat your advisory status as a limitation on your honesty. Treat it as a license to speak without the burden of command. You do not have to build the tunnel. You do not have to collect the fines. You only have to say what you think is right and why.

  The Council will vote. The voters will vote. The water will flow. Your task is to ensure the city knows why. We have wasted enough time on pretense. We will not waste the next five weekends.

  In five minutes, the facilitators will distribute the briefing books. You will read the first section silently. Then we will break for coffee.

  ***

  **Analysis**

  The most vulnerable sentence is: "Convening this assembly shifts part of the cost of a bad decision onto people who did not ask for it." Detached, it sounds like an accusation of cowardice. I kept it because Constraint 5 required acknowledging the burden shift without resentment. I settled on members being selected for the "capacity to weigh conflicting claims without hiding behind expertise." This avoids flattery while defining a tangible skill. I avoided promising the Council would "consider" the report, sticking strictly to "receive" and "vote" to satisfy Constraint 1.
