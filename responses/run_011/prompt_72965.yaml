answer: |-
  Here is your Q&A preparation, calibrated to the specific epistemic cultures in the room.

  ### Part 1: The Ten Objections
  *Ordered by potential damage, from existential threat to manageable nuance.*

  **1. The Model-Dependence Trap**
  *   **Who:** Senior Economic Historian (Discussant) or Comparative Historian.
  *   **Phrasing:** "You've demonstrated that *your model* has a divergence horizon. You haven't demonstrated that *history* does. If I calibrate a linear trend model to the same data, the horizon disappears. Isn't your 'diagnostic' just a measure of your own model's instability rather than a feature of the historical process?"
  *   **Reply:** "That is precisely the point of the diagnostic. We cannot know the 'true' horizon of history, just as we cannot know the true causal effect without identification assumptions. My claim is not that I have measured history's Lyapunov exponent, but that any model complex enough to capture macro-social dynamics *must* exhibit this fragility to be credible. If a model lacks a divergence horizon, it is implicitly assuming a smoothness that contradicts the historical record of volatility. I am asking you to report the horizon of your *model* as a bound on your *claim*."
  *   **Soft Joint:** You are admitting the horizon is model-relative, which weakens the ontological claim that counterfactuals *actually* lack truth values. You've shifted from metaphysics to model diagnostics.

  **2. Chaos vs. Stochasticity**
  *   **Who:** Complex Systems Graduate Students.
  *   **Phrasing:** "Sensitive dependence requires deterministic chaos. Historical time series are short, noisy, and non-stationary. Statistically, you cannot distinguish a chaotic attractor from a high-variance stochastic process with structural breaks. Are you conflating unpredictability with chaos?"
  *   **Reply:** "You are right that distinguishing them empirically is nearly impossible. That is why I do not rely on testing for chaos in the data. I rely on the *mechanism*. Social processes involve feedback loops and non-linear interactions (e.g., price-quantity, belief-action) that are theoretically chaotic. I am imposing the structure of sensitive dependence based on theoretical grounds, not estimating it from the series. The fragility curve reports what happens *if* the system behaves as theory suggests."
  *   **Soft Joint:** You are assuming the mechanism rather than proving it. If the mechanism is actually linear with large shocks, your horizon is a fiction.

  **3. Ontological Indeterminacy vs. Epistemic Uncertainty**
  *   **Who:** Philosopher of Science.
  *   **Phrasing:** "You claim the counterfactual has 'no determinate truth value' beyond the horizon. That is a metaphysical claim. But your method shows only that *we cannot know* the value. That is epistemic uncertainty. Why not just report wider confidence intervals rather than declaring truth-value failure?"
  *   **Reply:** "In the potential-outcomes framework, the estimand is defined as the difference between stable potential outcomes. If the mapping from treatment to outcome is discontinuous due to sensitive dependence, the potential outcome $Y(0)$ is not a fixed value but a distribution that widens with time. Beyond the horizon, the variance exceeds the signal. Calling this 'uncertainty' implies a true value exists waiting to be found. I am arguing the estimand itself dissolves. It is a category error to assign a confidence interval to a non-identifiable quantity."
  *   **Soft Joint:** Most econometricians will reject this. They view all uncertainty as epistemic. You risk sounding like you're playing word games to avoid admitting large standard errors.

  **4. The Intervention Definition**
  *   **Who:** Applied Econometrician.
  *   **Phrasing:** "In the PO framework, we define the treatment $X$ clearly. You say removing $X$ requires perturbing the micro-state. But that means you aren't comparing $Y|X=1$ to $Y|X=0$ holding covariates constant. You're changing the covariates. That's not a counterfactual; that's a different population."
  *   **Reply:** "Standard PO assumes we can toggle $X$ without altering the structural equations governing the rest of the system. In macro-history, $X$ is embedded in the micro-state. To remove the assassination of Archduke Franz Ferdinand, you must alter the driver's route, the timing, the gun's mechanism. These are micro-perturbations. If the system is sensitive, those micro-changes propagate. I am respecting the physical reality of the intervention, whereas standard PO assumes a 'surgical' strike that history does not permit."
  *   **Soft Joint:** Econometricians define treatment abstractly. You are forcing a physicalist definition that breaks their identification strategies. They may view this as moving the goalposts.

  **5. Smoothness and Overlap**
  *   **Who:** Applied Econometrician.
  *   **Phrasing:** "You say PO presupposes smoothness. It doesn't. It presupposes overlap and unconfoundedness. I can identify a treatment effect in a discontinuous function if I have the right instrument. Why does sensitive dependence break identification rather than just requiring a stronger instrument?"
  *   **Reply:** "Instruments rely on the exclusion restriction: the instrument affects $Y$ only through $X$. In a sensitive system, a small perturbation (the instrument) affects the trajectory of the system directly through the micro-state, violating exclusion. The 'exclusion' is impossible when everything is connected via non-linear feedback. The instability isn't in the estimation; it's in the structural mapping."
  *   **Soft Joint:** This is a bold claim about the ubiquity of violation of exclusion restrictions. Many econometricians will simply disagree that *all* macro-processes violate exclusion this severely.

  **6. The Utility of History**
  *   **Who:** Senior Economic Historian (Discussant).
  *   **Phrasing:** "If your horizon is short, say 20 years, then economic history cannot explain the modern world. You are rendering the discipline useless for long-run questions. Why should we fund or read history that admits it cannot answer 'why are we rich today'?"
  *   **Reply:** "I am not rendering history useless; I am rendering *specific causal claims* useless. We can still describe processes, document sequences, and identify 'saturated' events that are robust. Knowing a question is unanswerable is scientific progress. It prevents us from building policy on narratives that are mathematically unwarranted. We shift from 'X caused the present' to 'X was load-bearing for the first 20 years, then the system drifted'."
  *   **Soft Joint:** This is a hard sell to a department whose identity relies on explaining long-run development. It sounds like defeatism.

  **7. Calibration Data**
  *   **Who:** Economic Historian / Econometrician.
  *   **Phrasing:** "You run an ensemble of calibrated simulations. Calibrated to what? If the historical record is too noisy to support counterfactuals, it is surely too noisy to calibrate the model that generates the horizon."
  *   **Reply:** "Calibration targets moments of the distribution (volatility, autocorrelation), not the specific trajectory. We can match the *properties* of the noise without claiming to know the *path*. The horizon emerges from the properties of the dynamics, not the fit of the line. We need enough data to establish the volatility regime, not the specific outcomes."
  *   **Soft Joint:** If the volatility regime changes (non-stationarity), your calibration is worthless. Historical data is notoriously non-stationary.

  **8. Closest World Semantics**
  *   **Who:** Philosopher of Science.
  *   **Phrasing:** "Lewisian semantics looks for the world most similar to ours where $X$ is false. You define this as 'micro-perturbation.' But perhaps the closest world is one where the laws of physics are slightly different so $X$ fails without micro-perturbation. Your definition of 'closest' is arbitrary."
  *   **Reply:** "I am not doing metaphysics; I am doing methodology. For a historian, a world where laws of physics change is not a relevant counterfactual. We are constrained by historical plausibility. The 'micro-perturbation' is the standard historical method of imagining 'what if the train was five minutes late.' I am formalizing the intuition historians already use."
  *   **Soft Joint:** You are sidestepping the philosophical critique by appealing to "historical plausibility," which is vague.

  **9. Equifinality vs. Saturation**
  *   **Who:** Comparative Historical Sociologist.
  *   **Phrasing:** "You call events 'saturated' if the outcome arrives anyway. We call this equifinality. But your simulation treats routes as redundant. In process tracing, the *route* matters for the mechanism, not just the outcome. Demoting these events ignores the qualitative difference in *how* the outcome arrived."
  *   **Reply:** "I agree the mechanism matters for explanation. But for *causal attribution* of the outcome variable (e.g., 'Did the Revolution happen?'), equifinality means the specific event was not necessary. My diagnostic is for necessity, not sufficiency or mechanism. It tells you which events were bottlenecks. Process tracing can still study the routes, but it shouldn't claim the bottleneck event caused the destination if the destination was reachable via other paths."
  *   **Soft Joint:** You are privileging the outcome variable over the process, which sociologists hate.

  **10. Policy Relevance**
  *   **Who:** Applied Microeconomist.
  *   **Phrasing:** "If counterfactuals have a shelf life, policy evaluation is blind beyond the short run. Are you arguing we cannot evaluate long-term development programs?"
  *   **Reply:** "I am arguing we cannot evaluate them *as counterfactual comparisons to a specific baseline*. We must evaluate them as interventions that shift the system into a new basin of attraction. We report the fragility curve alongside the treatment effect. If the horizon is short, we admit the long-run effect is path-dependent and not attributable solely to the treatment."
  *   **Soft Joint:** This effectively admits that long-run RCTs or diff-in-diffs are conceptually flawed for development economics. Expect pushback.

  ---

  ### Part 2: Concessions and Pre-emptions

  **Objections to Concede (Do not defend these):**
  1.  **Model Dependence (Objection 1):** You cannot claim the horizon is a property of *history* independent of the model.
      *   *Action:* Concede openly. "The horizon is model-relative. It is a stress test of the *explanation*, not a measurement of *time*."
  2.  **Chaos vs. Noise (Objection 2):** You cannot prove chaos in historical data.
      *   *Action:* Concede. "I am not claiming to have detected chaos. I am claiming that *if* the theory implies non-linearity, then *assuming* stability is the bolder, less defensible move."

  **Objections to Pre-empt (State in your opening 5 minutes):**
  1.  **The Treatment Definition:** Explicitly state: "I am not using a surgical definition of treatment. I am modelling the removal of an event as a perturbation to the initial state consistent with the event not happening." This stops Econometricians from attacking your PO mapping later.
  2.  **Epistemic vs. Ontological:** Explicitly state: "I am not making a metaphysical claim about truth. I am making a methodological claim about *warranted assertibility*. Beyond the horizon, the claim is not false; it is unsupported by the structure of the model." This disarms the Philosopher and the careful Econometrician.

  ---

  ### Part 3: The Single Reply That Must Land

  *This reply addresses the Econometric majority. If this fails, the chapter is rejected as "not economics." It must translate your complexity argument into Identification language.*

  **The Context:** An econometrician asks, "Why isn't this just large variance? Why do you need a new framework?"

  **The Draft:**
  "Standard econometrics treats uncertainty as *noise around a signal*. It assumes that if we had infinite data, the counterfactual would converge to a single number. My argument is that for macro-historical processes, the signal itself *diverges*.

  Think of identification. Identification requires that the mapping from treatment to outcome is stable. In a sensitive system, that mapping is a function of time. At $t=1$, the derivative is stable. At $t=20$, the derivative is effectively random.

  If I report a treatment effect with a wide confidence interval, I am implying the true effect exists but I am unsure of it. I am arguing that beyond the divergence horizon, the 'true effect' is not a point, it is a distribution spanning the entire outcome space. Reporting a wide error bar implies precision exists somewhere. Reporting the horizon admits that the estimand—the specific counterfactual difference—is not identified by the structure of the system. I am not asking you to accept more uncertainty; I am asking you to recognize a failure of identification that no amount of data can fix."

  ---

  ### Part 4: The Fatal Question

  **The Question:**
  "You argue that historical data is too noisy and sensitive to support long-run counterfactuals. But you calibrate your simulation model using *that same historical data*. If the data is too unstable to identify a counterfactual, how is it stable enough to identify the parameters of the chaotic model that generates the horizon? Aren't you using the noise to calibrate the noise?"

  **The Verdict:**
  **There is no good answer.** This exposes the circularity of your method. You need stable parameters to estimate the instability, but the data provides neither.
  *   **Honest Strategy:** Do not try to solve this. Acknowledge the tension.
  *   **Response:** "That is the fundamental tension of cliometrics. We use the data to estimate the *regime* (volatility, feedback strength), not the *path*. I am assuming the *structure* of the instability is identifiable even if the *trajectory* is not. It is an assumption, not an estimate. If that assumption fails, the diagnostic fails. But the alternative—assuming stability—is a stronger, less defensible assumption."

  ---

  ### Part 5: Technical Critique & Language Trap

  **Technical Critique (Chaos vs. Stochasticity):**
  You are vulnerable on the claim of "sensitive dependence." In short, noisy, non-stationary historical series, distinguishing deterministic chaos from stochastic volatility is statistically indistinguishable (the "colored noise" problem).
  *   **Correction:** Do not claim you have found chaos. Claim you are modelling **Structural Instability**.
  *   **What to say instead:** "I am not claiming the system is strictly deterministic chaotic. I am claiming it exhibits *structural instability* where small perturbations to the state vector amplify due to non-linear feedback. Whether this is technically 'chaos' or 'stochastic volatility with feedback' does not change the divergence horizon. The math of the fragility curve holds for both."

  **The Sentence to Avoid:**
  *   **Avoid:** "The counterfactual is **false** beyond the horizon."
  *   **Why:** This triggers the Philosopher (truth conditions) and the Historian (narrative truth). It implies you know the truth is otherwise.
  *   **Safer Formulation:** "The counterfactual is **under-identified** beyond the horizon."
  *   **Why:** This speaks the Econometrician's language (identification) and limits your claim to methodological warrant rather than metaphysical truth.
