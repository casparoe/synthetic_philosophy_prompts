      *(Refining the "Drawing Hands" point)*: Is there *any* mutual constitution? Maybe Craig and Lotte? They find each other through the vessel. But they don't author each other. They recognize each other. That's different. So (b) is mostly absent. The film is obsessed with (c).

      *(Final Polish)*: Ensure the distinction between Hofstadter's "Strange Loop" (which generates the self) and BJM's "Portal" (which displaces the self) is clear. Hofstadter = Emergence. BJM = Parasitism. This is the crucial tension for the paper.

