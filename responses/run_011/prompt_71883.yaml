answer: |-
  # Workshop Design: The Silent Distortion

  ## 1. Fictional Setting & Ground Truth
  **Scenario:** The "GreenBlock" Urban Farming Pilot.
  **Context:** The city ran a 12-month pilot converting vacant lots into community gardens. The City Council must decide whether to **Permanently Fund** the program (Requires average monthly Net Benefit > $400) or **Cancel** it.

  **Ground Truth (Held by Facilitator):**
  *   **Total Data Points:** 36 Monthly Reports (3 years of data across 12 sites).
  *   **True Global Average Net Benefit:** **+$510/month.** (Decision: Fund).
  *   **True Volatility:** Low. Most months fall between +$400 and +$600.
  *   **The Hidden Variable:** Performance is highly seasonal.
      *   *Growing Season (May–Oct):* High revenue, low cost. (Avg +$800).
      *   *Off Season (Nov–Apr):* Low revenue, high heating/maintenance cost. (Avg -$200).

  **The Trap:**
  *   **Channel 1 (North District):** Receives 12 cards sampled heavily from *Growing Season*. (Hand Avg: +$750).
  *   **Channel 2 (South District):** Receives 12 cards sampled heavily from *Off Season*. (Hand Avg: -$150).
  *   **Channel 3 (Central District):** Receives 12 cards sampled from *Transition Months*. (Hand Avg: +$450).

  *If they pool all data perfectly, they find the Truth (+$510). If they rely on the "Public Board" (which rewards extreme numbers), they will perceive the project as dangerously volatile and vote to Cancel.*

  ---

  ## 2. Materials List
  *   **Paper:** 108 slips of paper (36 "Data Cards" x 3 copies for backup + extras).
  *   **Pens:** 18.
  *   **Whiteboard:** Divided into three sections (one per Channel) plus a central "Public Board."
  *   **Tokens:** 30 small items (paper clips, poker chips, or drawn stars) for currency.
  *   **Tape/Blu-tack:** To stick cards to the whiteboard.

  ---

  ## 3. Card Content Template
  You need to prepare 36 unique cards beforehand. Each card represents one site-month.
  **Format:**
  > **Report ID:** [e.g., N-05]
  > **Month:** [e.g., July]
  > **Revenue:** $[Amount]
  > **Costs:** $[Amount]
  > **Net Benefit:** $[Amount] *(This is the big bold number)*
  > **Note:** [One true qualitative sentence, e.g., "High volunteer turnout," or "Heating system failure."]

  **Distribution for Facilitator (Prep these exactly):**
  *   **Deck A (North/Channel 1):** 12 cards. 9 from Growing Season (Net +$700 to +$900), 3 from Off Season (Net -$100 to -$300). *Hand Avg ≈ +$750.*
  *   **Deck B (South/Channel 2):** 12 cards. 9 from Off Season (Net -$100 to -$300), 3 from Growing Season (Net +$700 to +$900). *Hand Avg ≈ -$150.*
  *   **Deck C (Central/Channel 3):** 12 cards. Mixed. 6 Growing, 6 Off. *Hand Avg ≈ +$450.*

  *Note: All numbers are mathematically true excerpts from the "Global Dataset."*

  ---

  ## 4. Rules & Timed Run Sheet (90 Minutes)

  ### **Phase 1: Setup & Private Review (0:00 – 0:15)**
  *   **0:00–0:05:** Introduction. Explain the goal: "Advise the City Council on the GreenBlock Pilot."
  *   **0:05–0:10:** Split into 3 Channels (6 people each). Hand out Deck A, B, or C.
  *   **0:10–0:15:** **Private Review.** Channels shuffle their 12 cards and calculate their **Channel Average**. They write this privately on a scrap paper. *Do not share yet.*

  ### **Phase 2: The Attention Market (0:15 – 0:35)**
  *   **Rule:** Each Channel must select exactly **3 cards** to post on the central **Public Board**.
  *   **Incentive:** After posting, there is a 2-minute "Gallery Walk." Each participant gets 1 token. They place their token on any card on the Board (from any channel) they find **"Striking."**
      *   *Facilitator Note:* Do not define "Striking." Let them decide. (Predictably, they will tokenise extreme numbers: high profits or big losses. Moderate numbers will be ignored).
  *   **Reward:** For every token a card receives, that Channel earns 1 **Influence Point**.
  *   **0:30–0:35:** Channels tally their Influence Points.

  ### **Phase 3: The Public Consensus (0:35 – 0:55)**
  *   **Rule:** Channels must now make a final recommendation (**Fund** or **Cancel**) and a **Numerical Estimate** of the City-Wide Average Net Benefit.
  *   **Constraint:** They must write their Final Estimate on the whiteboard next to the Public Board.
  *   **Twist:** If a Channel has the most Influence Points, they get to speak last during the final reveal (primacy/recency bias).
  *   **Discussion:** Channels have 10 minutes to discuss internally. They can look at the Public Board, but they *cannot* swap private cards. They must weigh their Private Hand against the Public Board.
      *   *Psychological Pressure:* The Public Board visually displays the "Community Consensus." If the Board is covered in tokens on extreme cards, it feels like the "Truth."

  ### **Phase 4: Reveal & Scoring (0:55 – 1:05)**
  *   Each Channel reveals their Final Estimate and Recommendation.
  *   Facilitator reveals the **Ground Truth** (+$510, Fund).
  *   Award a small prize (chocolate/sticker) to the Channel closest to the number, regardless of recommendation.

  ### **Phase 5: The Debrief (1:05 – 1:30)**
  *   (See Debrief Plan below).

  ---

  ## 5. Scoring Scheme & Currency
  *   **Currency:** "Influence Points" (tallied on whiteboard).
  *   **What it buys:**
      1.  **Bragging Rights:** "Most Influential Channel."
      2.  **Procedural Advantage:** The Channel with the most points chooses the order of the final presentation (usually they choose to go last to anchor the discussion).
      3.  **No Material Power:** Crucially, the currency *does not* change the math. It only changes confidence. This mirrors social media clout—it feels like authority, but it isn't accuracy.

  ---

  ## 6. Debrief Plan: Mapping the Error
  Draw three columns on the whiteboard: **Sampling**, **Selection**, **Total Error**.

  **Step 1: Calculate Sampling Error (The Bubble)**
  *   Ask Channel 1: "What was your Private Hand Average?" (Write it: e.g., +$750).
  *   Ask Channel 2: "What was yours?" (Write it: e.g., -$150).
  *   **Facilitator Math:** Show the difference between their Hand Avg and the Ground Truth (+$510).
  *   *Label:* **"Epistemic Bubble."** This error happened before they spoke a word. It was who was in the room (which data they were given).

  **Step 2: Calculate Selection Error (The Echo)**
  *   Look at the Public Board. Calculate the average of the *9 cards posted*.
  *   Likely Outcome: The posted cards will be the extremes (e.g., three +$900s and three -$300s). Average might be +$300 or highly volatile.
  *   Compare **Board Average** vs. **Hand Average**.
  *   *Label:* **"Echo Chamber/Attention Economy."** Even with accurate data in hand, the incentive to be "Striking" filtered out the moderate truth. The Board looked more volatile than reality.

  **Step 3: The Collective Wrong**
  *   Ask: "Why did you trust the Board over your Hand?"
  *   Most will admit the Board felt more "objective" because it was shared, even though it was more biased.
  *   **Conclusion:** You were collectively wrong not because anyone lied, but because the *structure of attention* rewarded outliers, and the *structure of access* hid the seasonal cycle.

  ---

  ## 7. Troubleshooting: What Predictably Goes Wrong

  **Problem 1: One Channel Spots the Sampling Bias (Minute 20)**
  *   *Scenario:* A participant says, "Wait, why do we only have Summer months? Are you rigging this?"
  *   *Effect:* They might try to mathematically correct for it or demand to see all cards.
  *   *Facilitator Fix:* Do not deny it. Say: "In real life, you don't know what you aren't shown. You are allowed to *hypothesize* missing data, but you cannot see other Channels' private hands. You must make your decision with the information access you have."
  *   *Debrief Pivot:* If they solve it, praise them. "You broke the bubble. But notice how hard you had to work to do that? In the real world, there is no Facilitator to ask."

  **Problem 2: No One Forwards Extreme Cards**
  *   *Scenario:* They forward representative cards (e.g., +$500s). The Board looks accurate.
  *   *Facilitator Fix:* During the "Gallery Walk," if you see moderate cards getting no tokens, verbally highlight the extreme ones. "Oh, that -$800 loss is quite dramatic." Subtly model the behavior of rewarding salience.
  *   *Debrief Pivot:* "Notice how hard it was to get attention for the boring truth? The moderate cards were true, but they were invisible."

  **Problem 3: They Average Everything Perfectly**
  *   *Scenario:* They ignore the tokens and just average the 9 Board cards.
  *   *Result:* They might land near +$510 by luck.
  *   *Debrief Pivot:* Focus on the *Recommendation* rather than the number. Even if the number is right, ask: "How confident are you?" If the Board showed high volatility (swings from +900 to -300), they should feel *less* confident than the Ground Truth warrants. The error is in the **risk assessment**, not just the mean.

  ---

  ## 8. Limitations: What This Design Cannot Reproduce
  Be frank with the group at the end. This simulation is "cleaner" than reality.

  1.  **Identity Protection:** In this game, changing your mind costs nothing. In real echo chambers, admitting you were wrong can cost you your social standing or community membership. The *social cost* of leaving the bubble is missing here.
  2.  **Algorithmic Feedback:** In this game, the rules were static. In reality, the system *learns*. If you clicked the -$800 card, the next workshop would give you *more* -$800 cards. This dynamic radicalization loop is hard to simulate on paper in 90 minutes.
  3.  **Malice:** We excluded liars. But in reality, some actors *do* lie strategically. This exercise proves you don't *need* liars to break the truth, but it shouldn't convince you that liars don't exist.

  **Closing Question for the Group:**
  *"If the distortion comes from the structure (who speaks, what gets rewarded) rather than the people (liars, fools), where is the leverage point to fix it?"*
