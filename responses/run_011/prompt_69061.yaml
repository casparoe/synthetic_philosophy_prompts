  C is given.
  Option 1 (Copy all changes): D has new Eyes + new Shape.
  Option 2 (Copy one change): D has new Eyes + old Shape.
  Which is simpler? Usually, copying the *difference* is the rule. If there are multiple differences, the rule is "Apply the Delta." The Delta includes all changes.
  *However*, if C is already different from A in Shape, does the Delta apply cumulatively or reset?
