answer: |-
  Dear Writer,

  You have put your finger on a very specific and delicate piece of social machinery, one that hums quietly beneath most family dramas and never quite gets the name it deserves. It is a keen observation, and the frustration you feel in lacking a term for it is understandable because language tends to categorize things by their truth value or their intent, and this phenomenon splits the two. You are describing an exchange where the propositional content is false, but the emotional content is deeply true, and crucially, both parties know the content is false. That shared knowledge is the glue.

  To walk through your nearest neighbours, tatemae is indeed the first place one looks, but it is too structural for what you are describing. Tatemae is the public face one wears to maintain social harmony, often against one's true feelings, or honne. It is a duty, a mask required by hierarchy and group cohesion. What you are describing is not a mask worn for duty but a gift offered in intimacy. It is voluntary, warm, and collaborative rather than obligatory and defensive. If tatemae is a uniform, this is a costume both parties agree to wear for the dance.

  The white lie is also close, but as you noted, it fails on the mechanism of belief. A white lie is a benevolent deception. I tell you the casserole is good because I want you to believe it is good, to spare your feelings. In your example, the host knows the casserole is ruined, the guest knows the casserole is ruined, and the guest knows the host knows. The lie is not meant to deceive; it is meant to be seen through gently. If the host actually believed the praise, the exchange would be pathetic. If the guest believed the praise was literal, they would be foolish. The value lies in the transparency of the fabrication.

  Phatic communion is the linguistic term for language used to establish atmosphere rather than convey information, like saying nice weather when it is raining. This is the strongest academic neighbour you have. However, phatic expressions are usually empty of specific content. They are placeholders. What you are describing is phatic in function but elaborate in content. Renting houses in Portugal is not a placeholder like how are you; it is a specific, vivid, shared daydream. It is an extended phatic gesture, dressed up as a plan.

  Polite fiction is perhaps the closest existing phrase, often used when everyone agrees to ignore an uncomfortable truth, like pretending a drunk uncle is sober. But polite fiction often carries a cynical or defensive weight. It is used to avoid conflict or shame. Your example is not defensive; it is affirmative. It is not about ignoring a problem but about offering a possibility that both know is impossible, solely for the warmth of the offering.

  Since nothing fits perfectly, I will coin a term for you, something you can use in your own notes to keep the edges sharp. Let us call it the generous counterfactual. A counterfactual is a statement about what would have happened or what could happen, contrary to fact. By calling it generous, you anchor the intent. It is a statement of impossibility offered as a gift.

  The edges of this thing are defined by how it breaks. The generous counterfactual is a fragile contract that relies on mutual complicity. It breaks if one party becomes literal. If your friend actually books the houses in Portugal, he has broken the contract. He has taken the gift of the gesture and demanded the substance of it. He has confused the map for the territory. This is the betrayal of literalism. It turns the warmth into a burden. The other way it breaks is through cynicism. If one party says we both know we will never do this, they have stripped the gesture of its generosity. They have demanded factual truth where emotional truth was being offered. This is the betrayal of pedantry. Both the literalist and the pedant are offenders because both refuse to play the game where the implausibility is the point.

  Regarding honesty, the generous counterfactual is more honest than a straight white lie, precisely because nobody is deceived. A white lie creates a gap in reality where one person knows something the other does not. The generous counterfactual creates a shared space where both people know the truth but agree to speak around it for the sake of connection. It is emotionally honest even if it is factually false. The message is not we will go to Portugal; the message is I value you enough to imagine a future with you in it, even if that future is not real.

  For your characters, knowing when someone steps outside this is a powerful tool for conflict. A character who cannot speak in generous counterfactuals might be seen as cold or overly rigid, someone who demands truth at the expense of kindness. A character who takes them literally might be seen as naive or burdensome, someone who cannot read the room. And a character who exposes them might be seen as cruel, someone who would rather be right than loved.

  You can use this to measure the distance between people. When two characters stop exchanging generous counterfactuals and start speaking only in literal plans or only in cold facts, the relationship is dying. When they start making wilder, more impossible plans, they are drawing closer. The implausibility is the intimacy. The more impossible the plan, the safer it is to offer, because it costs nothing but affection.

  I hope this term serves you well. It is a quiet thing, this generous counterfactual, but it holds up a great deal of the weight of human love. It is the way we tell each other I wish things were different without having to say I am sad that they are not. It is the subjunctive mood of friendship.

  Warmly,

  A Reader
