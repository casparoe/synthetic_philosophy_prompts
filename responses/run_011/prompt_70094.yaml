answer: |-
  This is a tight reconstruction of the classic Empiricist argument (Berkeleyan in spirit), and your suspicion that the trouble lies downstream of the empirical data is well-founded. You are right to hold onto (2); right to be wary of (6); and right to scrutinize (3) and (4).

  Here is the breakdown of what is settled, what is contested, and which step offers the most philosophically robust exit from the dilemma.

  ### 1. The Status of the Premises

  **Premise (2) is largely settled.**
  While the historical cases (Cheselden, von Senden) were methodologically messy, modern data from "Project Prakash" (Held et al., 2011) confirmed the Molyneux prediction. Children who gained sight after congenital cataracts failed to match objects by sight and touch immediately after sight restoration. They succeeded only after a period of visual-tactile exploration (days to weeks). You are on solid ground keeping this.

  **Premise (6) is genuinely contested.**
  Your suspicion here is shared by a significant portion of the literature. Philosophers like John Campbell and Martin Millar have argued that blind spatial understanding may be "parasitic" on the spatial concepts of sighted others, or reliant on algebraic/symbolic surrogates rather than genuine spatial intuition. However, the consensus in cognitive science is that haptic spatial representation is robust enough to support geometry, even if it lacks the *instantaneous* surveyability of vision. It is not settled that blind geometry proves the existence of an *amodal* concept rather than a highly abstracted tactile one. Relying on (6) to refute (4) is therefore risky.

  **Premise (1) is the philosophical pivot.**
  This is the most vulnerable step, though it often passes unnoticed. It asserts: *Cross-modal identification presupposes one shape concept accessible to both senses.*
  This conflates **reference** (the property in the world) with **sense** (the mode of presentation). It assumes that to recognize $X$ as the same property across modalities, one must possess a single, amodal concept *prior* to the recognition.

  ### 2. The Recommendation: Reject (1)

  You should reject **(1)**.

  **The Argument:**
  Step (1) assumes a "One-Concept" model of cross-modal identification. It claims that if I can identify the globe by sight as the *same shape* I knew by touch, I must be deploying a single concept `SHAPE` that is neutral between vision and touch.

  However, a Fregean "Two-Concept" model is available. I can possess a visual concept `VISUAL-SPHERE` and a tactile concept `TACTILE-SPHERE`. Both concepts refer to the same property (sphericity), but they have different modes of presentation. Molyneux's man fails not because the properties are different, but because he has not yet learned that `VISUAL-SPHERE` and `TACTILE-SPHERE` co-refer.

  **How this dissolves the dilemma:**
  *   **It blocks the inference to (3):** If (1) is false, the failure in (2) does not prove that the shapes are different (as (3) claims). It only proves that the *link* between the two distinct concepts is missing.
  *   **It saves the Blind Geometer:** The blind geometer can develop an amodal concept (or a highly abstracted tactile one that functions amodally) over time. The fact that the *newly* sighted lack the link does not prove that *no one* can form the link or that the property itself is modality-bound.
  *   **It respects (2):** It explains why the patient fails initially (no association learned) and succeeds quickly (association learned) without requiring a metaphysical overhaul of shape.

  **The Cost of Rejecting (1):**
  You must accept **Perceptual Opacity**. Just as one can know "Hesperus" and "Phosphorus" without knowing they are both Venus, one can know a shape by touch and by sight without knowing they are the same shape. This means spatial content is not transparently amodal; it is encoded in modality-specific formats that require a separate cognitive act to integrate. This aligns well with contemporary multisensory integration theories (e.g., Casey O'Callaghan, Fiona Macpherson) which posit that vision and touch deliver distinct formats that the brain must calibrate.

  ### 3. Alternative: Reject (4)

  If you are unwilling to reject (1), you must reject **(4)**.

  **The Argument:**
  (4) generalizes from a pathological/developmental edge case (the newly sighted) to the entirety of human cognition. It argues that because the *connection* is not innate or immediate, it does not exist.
  Rejecting (4) allows you to say: "Molyneux's man lacks the amodal concept *at that moment*, but normal adults (and the blind geometer) possess it through development."

  **The Cost of Rejecting (4):**
  You must explain the **Developmental Gap**. If amodal concepts exist, why are they not available to the newly sighted? You are forced into a Nativist or Constructivist position: either the amodal concept is innate but requires visual triggering (Nativism), or it is constructed through experience (Constructivism). This is a live debate, but it is less costly than denying the possibility of blind geometry. However, note that rejecting (4) while keeping (1) forces you to admit Molyneux's man literally lacks the concept of "sphere" initially, which is a strong claim.

  ### 4. Summary of Consensus vs. Contestation

  | Premise | Status | Notes |
  | :--- | :--- | :--- |
  | **(1) Cross-modal ID requires one concept** | **Contested** | **Reject this.** Most contemporary philosophers of perception distinguish between *property identity* and *concept identity*. |
  | **(2) Newly sighted fail the test** | **Settled** | Confirmed by Project Prakash (2011). Immediate transfer fails; learning is rapid. |
  | **(3) Tactile shape $\neq$ Visual shape** | **Contested** | Follows only if (1) is true. If (1) is false, this is an unwarranted inference. |
  | **(4) No amodal concepts for anyone** | **Rejected** | Broad consensus in cognitive science against radical incommensurability. Multisensory integration is standard. |
  | **(5) Blind geometry is impossible** | **False** | Blind people do math. The debate is on *how* (surrogate vs. spatial), not *if*. |
  | **(6) Blind geometry proves amodal concepts** | **Contested** | As you suspected, this is evasive. Symbolic competence $\neq$ spatial intuition. |

  ### Conclusion

  The slide is indeed in the word **concept**, specifically in **Step (1)**.

  The argument treats "concept" as a transparent window onto a property. If you treat "concept" as a mode of presentation (a Fregean *Sinn*), the paradox vanishes. Molyneux's man has two concepts for one property. He cannot identify them across modalities because he lacks the identity belief, not because the property is fragmented.

  **Recommendation:** Reject (1). This invalidates the move to (3) and (4) without forcing you to deny the empirical data (2) or rely on the shaky inference from blind geometry (6). The cost is accepting that perceptual content is modality-specific and that cross-modal unity is an achievement of cognition, not a given of perception. This is the standard view in contemporary philosophy of perception (e.g., Evans, Campbell, O'Callaghan).
