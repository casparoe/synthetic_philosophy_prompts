      *(Self-Correction on "Three Requirements"):* I need to treat the three specific user questions *explicitly* as requested, separate from the main list or integrated carefully. The prompt says "Three requirements are unclear to me and I would like them treated explicitly rather than folded silently into the standard list." I will give them their own section after the main list.

