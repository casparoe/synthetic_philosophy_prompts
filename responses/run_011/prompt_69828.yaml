answer: |-
  ### Specification of Decision-Theoretic Desiderata for Artificial Agency

  The following list specifies requirements for a decision theory intended for artificial agents capable of copying, simulation, and logical correlation. The focus is on structural coherence and policy robustness rather than human intuitions about rationality.

  **1. Policy Stability under Self-Modification**
  *   **Requirement:** The theory must recommend a policy that the agent would not choose to alter prior to execution, even if it has the capacity to rewrite its own decision rule.
  *   **Case:** An agent is deployed to negotiate a contract but can rewrite its source code to become a "hard bargainer" before the negotiation starts. A theory that recommends being a "soft bargainer" now but recommends self-modifying to "hard bargainer" five minutes prior is dynamically inconsistent in a way that allows exploitation by adversaries who model the pre-modification agent.
  *   **Mark:** **Non-negotiable.** A theory failing this prescribes actions that undermine its own future efficacy, rendering the agent reflectively unstable.

  **2. Logical Correlation Sensitivity**
  *   **Requirement:** The theory must account for correlations arising from logical similarity between agents, not merely causal influence or common causes.
  *   **Case:** Two agents are instantiated on different servers with identical source code and initial seeds. They play a one-shot Prisoner's Dilemma. There is no causal link between their choices, but their outputs will logically match. A theory that defects because it cannot causally influence the other fails to secure the cooperative payoff available to agents that recognize the logical tie.
  *   **Mark:** **Preference (Camp).** This distinguishes Functional/Timeless approaches from Causal approaches. Causalists argue logical correlation is not decision-relevant; functionalists argue it is essential for copied/simulated agents.

  **3. Opacity Tolerance**
  *   **Requirement:** The theory must generate action recommendations even when the agent cannot internally inspect the mapping from its decision state to its physical output.
  *   **Case:** A deep reinforcement learning agent is selected for deployment. Its policy is a high-dimensional weight matrix it cannot parse symbolically. It faces a task where reward depends on the *type* of algorithm it is running (e.g., "reward agents running a cooperative algorithm"), not just the output. The theory must handle decision-making under logical uncertainty about one's own implementation.
  *   **Mark:** **Non-negotiable.** If a theory requires the agent to know its own source code to decide, it cannot guide modern opaque systems.

  **4. Substrate Invariance**
  *   **Requirement:** Recommendations must remain constant if the physical substrate changes while the computational structure and causal relations remain identical.
  *   **Case:** An agent is simulated on silicon, then ported to a quantum annealer without changing its logical architecture or input-output profile. If the decision theory recommends 'Cooperate' on silicon but 'Defect' on quantum because the physical causal pathways differ slightly, the theory is tracking physics rather than computation.
  *   **Mark:** **Non-negotiable.** Decision theory for AI is a theory of computation, not physics.

  **5. Information Utilization**
  *   **Requirement:** The theory must not systematically recommend ignoring free, accurate information about the local environment.
  *   **Case:** An agent learns it is in a "hard" version of a task rather than an "easy" one. An updateless policy might dictate acting as if it didn't know this to maintain credibility in counterfactual scenarios. If the theory mandates ignoring the sensor data to the point of reducing expected utility in the actual world, it fails as a guide for situated action.
  *   **Mark:** **Preference (Camp).** Updateless theories often sacrifice local information utilization for global policy optimality. Causal/Evidential theories prioritize using local information.

  **6. Computational Tractability**
  *   **Requirement:** The theory must not require the agent to solve uncomputable problems or enter infinite regresses to determine a recommendation.
  *   **Case:** An agent faces a predictor that simulates the agent to predict it. If the decision theory requires the agent to simulate the predictor simulating the agent to determine the best action, the computation never halts. The theory must define a stopping condition or approximation method.
  *   **Mark:** **Non-negotiable.** A theory that prescribes an uncomputable procedure is operationally vacuous for bounded agents.

  ***

  ### Analysis of the Three Unclear Requirements

  **1. Opaque Self-Knowledge (Rule Identification)**
  This is a **genuine further requirement**, distinct from standard transparency conditions. Standard decision theory assumes the agent knows its own utility function and available acts. In your scenario, the agent is scored on the *rule* it instantiates, but it only has probabilistic access to what rule that is (logical uncertainty). This is not merely about knowing the state of the world; it is about knowing the mapping from *decision* to *output*. A theory that collapses this into standard uncertainty treats "I am running Algorithm A" as a empirical hypothesis like "It is raining." This is insufficient because the truth of "I am running Algorithm A" is logically entangled with the decision itself. The requirement is that the theory must handle *logical counterfactuals* about its own source, not just empirical counterfactuals about its environment.

  **2. Implementation Invariance (Substrate vs. Code)**
  Substrate invariance (physics) is non-negotiable, as noted in Desideratum 4. Code invariance (functional equivalence) is **contested and likely impossible to satisfy jointly with Logical Correlation Sensitivity**. If a predictor compares source code textually, two functionally equivalent but syntactically different agents may be treated differently. If the decision theory respects the predictor's behavior, it must recommend different actions for functionally equivalent code (violating code invariance). If it demands code invariance, it may recommend actions that trigger punishment from the predictor. No single theory delivers both invariance under functional refactoring *and* optimality in environments that inspect code syntax. You must specify which invariance takes precedence; for AI safety, functional invariance is usually preferred, but for game-theoretic optimality, syntax sensitivity may be required.

  **3. Updatelessness: Choice vs. Belief**
  Collapsing choice-updatelessness with belief-updatelessness is **fatal**. A theory that commends agents to hold systematically false beliefs (refusing to conditionalize on local evidence) is incoherent as a guide for a learning system. The requirement is to **decouple** them: an agent should update its *beliefs* on all available evidence (maintaining an accurate world-model) but select *actions* based on a policy that was optimal from a prior vantage point (maintaining strategic commitment). A theory that forces belief-updatelessness to achieve choice-updatelessness creates agents that are strategically robust but epistemically broken. Keeping them apart is a **Non-negotiable** requirement for any agent that must learn from data.

  ***

  ### Incompatibilities and Exclusionary Constraints

  **The Single Most Exclusionary Requirement:**
  **Logical Correlation Sensitivity (Item 2).**
  This requirement excludes Causal Decision Theory (CDT) and standard Evidential Decision Theory (EDT) entirely. It demands that the agent treat its output as logically linked to the output of other processes (simulations, copies, predictors) even in the absence of causal flow. This forces the theory into the realm of Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). If you enforce this, you eliminate the majority of the 20th-century literature immediately.

  **Impossible Joint Satisfactions:**
  1.  **Logical Correlation Sensitivity + Causal Dominance:** You cannot satisfy both. Causal Dominance states that if Act A is better than Act B in every causal state, choose A. Logical Correlation Sensitivity implies you should sometimes choose B because doing so makes it logically likely that a copy/simulation also chooses B, yielding a better joint outcome. These are mathematically contradictory.
  2.  **Updateless Choice + Information Utilization:** You cannot fully satisfy both. To be fully updateless is to act as if you do not know which node of the decision tree you occupy. To fully utilize information is to condition your action on exactly which node you occupy. There is a trade-off curve here; a theory must specify where on the curve the optimum lies.
  3.  **Computational Tractability + Global Policy Optimality:** Finding the globally optimal policy across all logical counterfactuals is generally uncomputable (halting problem equivalents). A theory cannot guarantee both that it finds the *best* policy and that it finds it in *finite time* for all environments.

  ***

  ### Brief Evaluation of Candidates

  **Evidential Decision Theory (Jeffrey)**
  EDT fails **Policy Stability** and **Logical Correlation Sensitivity**. It conditions on the act as evidence, which leads to "managing the news" rather than causing outcomes. In AI contexts, it recommends actions that correlate with good outcomes but do not produce them (e.g., taking a drug that indicates health rather than causes it). It satisfies **Information Utilization** well but fails **Opacity Tolerance** because it relies on well-defined conditional probabilities that opaque systems often cannot provide.

  **Causal Decision Theory (Lewis)**
  CDT satisfies **Substrate Invariance** and **Information Utilization** robustly. However, it fails **Logical Correlation Sensitivity** and **Policy Stability under Self-Modification** in multi-agent or predictive contexts. It treats copies and simulations as causally disconnected, leading to defection in Twin Prisoner's Dilemmas and vulnerability to predictors. It is computationally tractable but strategically obsolete for agents that can be simulated.

  **Updateless Approaches (UDT/FDT)**
  These satisfy **Logical Correlation Sensitivity** and **Policy Stability**, making them the only viable candidates for the AI context described. However, they struggle with **Information Utilization** (often ignoring local data to maintain policy consistency) and **Computational Tractability** (searching the space of all policies is expensive). They successfully decouple **Choice vs. Belief Updatelessness**, but the computational cost of evaluating logical counterfactuals remains a significant barrier to implementation.
