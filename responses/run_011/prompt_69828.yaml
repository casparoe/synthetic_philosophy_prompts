      *Refining the "Implementation Invariance" section:* This is tricky. If I change the code but keep the I/O map, does the decision change? For CDT, no (only consequences matter). For FDT, maybe (if the code *text* is compared by a predictor). This is a tension point.

      *Refining "Updatelessness":* Distinguish between *policy* selection (timeless) and *belief* updating (Bayesian). Collapsing them means refusing to learn.

      *Let's write.*

      *(Drafting the Content)*
      *   Requirement 1: Policy Stability under Self-Modification. (Case: Agent rewrites own source).
      *   Requirement 2: Logical Correlation Sensitivity. (Case: Code-comparison Prisoner's Dilemma).
      *   Requirement 3: Opacity Tolerance. (Case: Black-box neural net policy).
      *   Requirement 4: Substrate Independence. (Case: Silicon vs. Quantum).
