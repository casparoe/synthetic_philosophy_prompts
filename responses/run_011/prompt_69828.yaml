      *   **User:** 3rd-year DPhil student in decision theory.
      *   **Task:** Write a list of desiderata (requirements) for a decision theory suitable for an *artificial agent* (copyable, simulatable, modeled by others, opaque implementation).
      *   **Constraint 1 (Format):** Numbered list. Each item: Requirement (1-2 sentences), Motivating Case/Consideration (concrete scenario, >50% novel), Negotiability Mark (Non-negotiable/Incoherent vs. Preference/Camp).
      *   **Constraint 2 (Analysis):** Identify the single most exclusionary requirement. Flag impossible pairs/triples of requirements (incompatibilities).
      *   **Constraint 3 (Specific Topics):** Address three specific unclear requirements explicitly:
          1.  Opaque Self-Knowledge (recommending acts to an agent unsure of its own rule).
          2.  Implementation Invariance (substrate vs. code/causal structure).
          3.  Updatelessness (Choice vs. Belief).
      *   **Constraint 4 (Evaluation):** Brief paragraph (max) each on Evidential (Jeffrey), Causal (Lewis), and Updateless approaches.
      *   **Constraint 5 (Negative):** No references, bibliography, or reading lists.
      *   **Tone:** Academic, rigorous, direct, avoiding standard survey tropes (Newcomb, Smoking Lesion, Money Pump need to be minimized or recontextualized).
      *   **Goal:** Move from "survey of talking points" to "specification of requirements."

  2.  **Deconstruct the Context (AI/Artificial Agent):**

      *   Standard decision theory (DT) often assumes a human agent: singular, temporally continuous, transparent to self, causally isolated from predictions of itself.
      *   AI Agent context: Copyable (identity issues), Simulatable (prediction issues), Modeled by others (game theory/logical correlation issues), Opaque implementation (inner alignment/black box issues).
      *   This shifts the focus from "rationality as coherence of belief/desire" to "rationality as robust policy selection in a network of logical/causal dependencies."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Dynamic Consistency.* Standard. Needs AI twist. *Scenario:* Self-modification or pre-commitment via code.
      *   *Idea 2: Logical Correlation.* Standard FDT/TDT stuff. *Scenario:* Source code comparison rather than causal influence.
      *   *Idea 3: Opacity.* The user's specific point 1. *Scenario:* Agent doesn't know its own weights.
      *   *Idea 4: Implementation Invariance.* The user's specific point 2. *Scenario:* Refactoring code without changing input-output map.
      *   *Idea 5: Updatelessness.* The user's specific point 3. *Scenario:* Learning your location in a simulation.
      *   *Idea 6: Computability/Tractability.* AI specific. *Scenario:* Halting problem in decision loops.
      *   *Idea 7: Robustness to Prediction.* *Scenario:* Adversarial modeling.
      *   *Idea 8: Value Stability.* *Scenario:* Self-modification changing utility function.

      *Refining for Novelty:* Avoid standard Newcomb. Use "Twin Prisoner's Dilemma with Code Access," "Quining Agent," "Adversarial Simulator."

      *Refining Negotiability:* Distinguish between "mathematically incoherent" (e.g., preferring A to B and B to A) and "strategic preference" (e.g., one-boxing vs. two-boxing).

  4.  **Addressing the Three Specific Uncertainties:**

      *   *Opaque Self-Knowledge:* Is it distinct? Yes, it's about *rule* identification, not just state identification. It relates to "logical uncertainty about oneself."
      *   *Implementation Invariance:* Substrate is easy (physics). Code structure is hard (functional equivalence vs. causal trace). Can a theory handle both? CDT handles substrate, fails code (doesn't care about logical correlation). FDT handles code, might struggle with substrate if physical causation overrides logical.
      *   *Updatelessness (Choice vs. Belief):* Crucial distinction. If you don't conditionalize belief, you have false beliefs. If you don't update choice, you keep commitments. Collapsing them leads to "dogmatism." They must be separate.

  5.  **Identifying Incompatibilities:**

      *   *The Big One:* Implementation Invariance (Code) vs. Causal Dominance. If you respect logical correlations (code), you violate causal dominance (CDT axiom).
      *   *Computability vs. Optimality:* Finding the global optimum policy is often uncomputable (Gödel/Halting).
      *   *Updatelessness vs. Information Utilization:* Ignoring local info (updateless) can lead to ignoring useful data (information inefficiency).

  6.  **Drafting the Response (incorporating constraints):**

      *   *Intro:* Acknowledge the shift from human to artificial agency.
      *   *List:* 6-8 strong items.
      *   *Specific Sections:* The three unclear requirements.
