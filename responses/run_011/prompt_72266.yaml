prompt: |-
  I'm a PhD student TA-ing a small philosophy of religion seminar — fourteen people, meets at 8:15 in a room with a whiteboard and a projector that hasn't worked since October. In two weeks I have 75 minutes on Wittgenstein's remarks about religious belief, mainly the 1938 lectures, with maybe five minutes at the end gesturing at the Frazer notes. The reading load was light so I can assume they've actually seen the Last Judgement material, but office hours have made it obvious nobody has it. Three separate students told me the upshot is that religious sentences aren't true or false, they're just expressions of how you feel, which is roughly the opposite of what I want to land. And one of the evangelical students — she's genuinely engaged, not grandstanding — asked me whether Wittgenstein thinks her belief in the resurrection is a story she tells herself that she doesn't really believe, and if so whether that makes her a fool or just confused. I said something noncommittal and walked away feeling like a coward. The class also skews weird for this topic: about half are practising Christians of some kind and half are loudly atheist and have already decided the first half are deluded, so whatever I do gets read as taking a side.

  Please don't explain Wittgenstein to me, I've read him. Plan how I should explain him in that specific room. What I want is the sequencing: which piece has to be in place before which, and why — I have a hunch that if I start with the Frazer material and the rain-king, religion immediately looks like failed technology and the atheists win the room in the first four minutes, but if I start with the 1938 lectures I don't have any grip on what a belief is supposed to be doing yet. Tell me which way round and what the first ten minutes actually have to accomplish. Then: the carrying example. It probably can't be the Last Judgement believer, since they've read it and it slides straight back into "so it's not about facts" — so give me one case to build the whole thing on and say what it needs to have and what it must not have, and whether it should be drawn from their own lives or from somewhere else entirely. Then the misconception map with exact insertion points: I'm counting at least five (religion as non-cognitive emoting; religion as walled off from all criticism; believers as self-deceived about what they themselves say; belief as a picture in the head, which they'll drag in from the private language argument we did last month; and "meaning is use" as a slogan that settles everything) — for each one, tell me whether to head it off before the example, right after it, or park it to the last three minutes, and give me the actual sentence I'd say to head it off. I also want one closing question I can put to the room that would show me whether the idea landed — ideally one where the fideist reading and the right reading give visibly different answers, so I can tell from the replies rather than from nods.

  Finally, tell me what to cut and say so out loud. I know I can't do the Tractatus material on the mystical, the hinge stuff from On Certainty, the whole fideism debate in the secondary literature, or his own religious biography, and I'd rather announce the omission than let fourteen people infer that silence means something. Rank those cuts by how much damage skipping each one does, and if there's something I listed that I should actually keep, say that instead — I'd rather be overruled than have the hour collapse. Small thing: I'd like the plan to work without a handout and without any quotes projected on screen, because they won't read aloud at 8:15, so whatever I put in front of them has to be said, drawn, or acted out by me.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student TA, knowledgeable about Wittgenstein ("Please don't explain Wittgenstein to me, I've read him").
      *   **Task:** Teach a 75-minute seminar on Wittgenstein's remarks on religious belief (mainly 1938 Lectures, slight touch on Frazer).
      *   **Constraints:**
          *   Room: Whiteboard, broken projector (no slides/quotes).
          *   Time: 8:15 AM (students will be tired/low energy).
          *   Class Size: 14 (small enough for discussion, large enough for factions).
          *   Class Dynamic: 50% practicing Christians, 50% loudly atheists (polarized).
          *   Student Misunderstandings: "Religion is just emotion/non-cognitive," "Believers are self-deceived/fools," "Meaning is use = slogan."
          *   Specific Incident: Evangelical student worried she's being called a fool/self-deceived. TA felt cowardly.
          *   Reading: Light, they *should* know Last Judgement material but office hours suggest they don't *get* it.
      *   **Goal:** A specific sequencing plan, a carrying example, a misconception map with scripts, a diagnostic closing question, and a prioritized cut list. No handouts.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is the "Non-Cognitivist" reading (religious language is just emotion/attitude, not fact-claiming) vs. the "Grammatical" reading (religious language *does* make claims, but the *grammar* of those claims functions differently than scientific/historical claims).
      *   Wittgenstein is *not* saying religious beliefs are false or meaningless. He is saying the *criteria* for assessing them are internal to the form of life.
      *   The "Frazer" trap: Starting with *The Golden Bough* notes makes religion look like primitive science (failed technology). This confirms the atheist bias immediately.
      *   The "Last Judgement" trap: Students read "It's not a hypothesis" and jump to "It's not about truth."
      *   The Evangelical Student's Fear: She thinks Wittgenstein reduces her belief to a psychological crutch or a metaphor she doesn't literally hold.

  3.  **Develop the Sequencing (The "Arc"):**
      *   *User's Hunch:* Don't start with Frazer. Agreed. Frazer makes religion look like bad science.
      *   *Alternative:* Start with the 1938 Lectures, specifically the distinction between *evidence* and *grounds*.
      *   *Why:* We need to establish what a "belief" *does* before we ask if it's "true."
      *   *First 10 Minutes:* Need to break the "Science vs. Emotion" dichotomy immediately. Establish that there is a third option: "Regulative/Constitutive."
      *   *Decision:* Start with the 1938 Lectures (Last Judgement), but *reframe* it immediately through the lens of "risk" and "orientation," not "truth-conditions."

  4.  **Select the Carrying Example:**
      *   *Constraint:* Cannot be the Last Judgement (they already misread it). Needs to be secular enough for atheists to engage, serious enough for believers to respect.
      *   *Idea 1:* Love ("I love you"). Too cliché, slides into emotion.
      *   *Idea 2:* Political allegiance ("This is my country"). Good, but too heated.
      *   *Idea 3:* *The Unshakable Belief in a Friend's Innocence.*
      *   *Why:* It involves a fact (did they do it?), but the *belief* functions differently than a legal verdict. It guides action, risk, and identity. It allows for "evidence" to exist without being the sole determinant of the belief's status.
      *   *Criteria:* Must involve risk. Must involve action. Must not be purely empirical (like "the cat is on the mat") and not purely emotive (like "ouch").

  5.  **Map the Misconceptions (The "Traps"):**
      1.  *Non-cognitive emoting:* "It's just feelings." -> Address early, during the example.
      2.  *Walled off from criticism:* "Fideism." -> Address mid-class, when discussing evidence.
      3.  *Self-deception:* "They know it's fake." -> Address the Evangelical student's worry specifically.
      4.  *Picture in the head:* "Private mental image." -> Link back to Private Language Argument (PLA) briefly.
      5.  *Meaning is Use slogan:* "It means whatever it does." -> Save for wrap-up to prevent laziness.

  6.  **Drafting the Scripts (The "Sentences"):**
      *   Need to be punchy, 8:15 AM friendly. No jargon without definition.
      *   *Key distinction:* "Hypothesis" vs. "Picture that holds you captive" (but phrased positively).
      *   *Key phrase:* "The grammar of the belief."

  7.  **The Closing Question:**
      *   Needs to distinguish Fideism (belief is immune to reality) from Wittgenstein (belief structures reality).
      *   *Question:* "If the friend *confessed*, what happens to the belief?"
      *   *Fideist answer:* "It doesn't matter, the belief is internal."
      *   *Wittgenstein answer:* "The belief collapses or transforms because its connection to the world is severed."

  8.  **The Cuts (Prioritization):**
      *   *Must Cut:* Tractatus mystical (irrelevant here), On Certainty hinges (too complex/late Wittgenstein), Bio (genetic fallacy), Secondary Lit fideism debate (too meta).
      *   *Potential Keep:* Frazer. User said "maybe 5 mins." Actually, it's useful *if* placed at the end as a contrast (Religion $\neq$ Science). But if time is tight, cut it. Let's advise cutting it to protect the core argument, or using it only as a negative example.
      *   *Ranking:* Bio (Least damage), Tractatus (Low), On Certainty (Medium - actually dangerous to mix), Fideism Debate (High - causes confusion).
      *   *Wait, re-evaluating On Certainty:* Hinges are actually very close to the 1938 Lectures. But mixing them confuses the timeline. Better to cut to keep focus on "Grammar."
      *   *Re-evaluating Frazer:* The user specifically mentioned it. It's good for showing what religion is *not*. Keep it as the "contrast case" at the end if time permits, otherwise cut.
      *   *Decision:* Cut Bio, Cut Tractatus, Cut On Certainty (explicitly), Cut Secondary Lit. Keep Frazer *only* as a 3-minute contrast if the room energy allows, otherwise cut.

  9.  **Refining the Plan for the Room:**
      *   *Whiteboard:* Use it. Draw the "Spectrum." Science <--- ---> Emotion. Put Wittgenstein in the middle as "Grammar/Action."
      *   *8:15 AM:* Get them talking within 12 minutes. Don't lecture for 40.
      *   *The Evangelical Student:* Need a specific moment to validate her without alienating the atheists. The "Friend" example helps this.

  10. **Final Review against Constraints:**
      *   No projector? Yes, rely on board/voice.
      *   No handouts? Yes.
      *   Sequencing clear? Yes.
      *   Misconception scripts included? Yes.
      *   Closing question diagnostic? Yes.
      *   Cuts ranked? Yes.

  11. **Self-Correction/Nuance Check:**
      *   *Correction:* Make sure I don't accidentally endorse the "Friend" example as *exactly* religious belief. It's an analogy. Need to flag that.
      *   *Correction:* Ensure the "Non-cognitive" rebuttal doesn't sound like "Religion IS factual." It's about the *role* of the fact.
      *   *Tone:* Supportive of the TA. Acknowledge the difficulty of the 8:15 slot.

  12. **Final Polish:** Organize into clear sections: Sequencing, The Example, Misconception Map, Closing, Cuts. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, the user asked about the Frazer notes specifically. They said "maybe five minutes at the end gesturing at the Frazer notes." I should respect that but warn about the placement. I will advise keeping it as a *contrast* at the very end, not the start.
  Also, the "Evangelical Student" worry is critical. I need to make sure the plan explicitly addresses the "Am I a fool?" question. The "Friend" example handles this well (believing in a friend isn't foolish even if evidence is slim, *provided* the grammar is understood).

  Let's finalize the "First 10 Minutes." It needs to set the board.
  Board Left: "Science/Hypothesis" (Evidence changes belief).
  Board Right: "Emotion/Preference" (No evidence needed).
  Board Middle: "Religious Belief" (Evidence exists but doesn't function the same way).
  This visual anchors the whole hour.

  Okay, ready to write.cw
answer: |-
  Here is the plan. It is designed for 8:15 AM energy levels, a broken projector, and a polarized room. It relies on the whiteboard and your voice.

  ### 1. The Sequencing: Why Order Matters

  **Do not start with Frazer.** Your hunch is correct. If you start with the Rain King or sympathetic magic, you frame religion as *proto-science*. The atheists will nod ("Yes, primitive error"), and the believers will bristle ("No, it's spiritual"). You lose the room in five minutes.

  **Do not start with the Last Judgement text alone.** If you open the book to the Last Judgement passage, students will immediately reach for the "Non-Cognitivist" drawer: "See? It's not a fact, it's a picture."

  **The Sequence:**
  1.  **The Phenomenology of Belief (10 mins):** Establish what a belief *does* before asking if it's true. Use the whiteboard to draw a spectrum.
  2.  **The Carrying Example (20 mins):** Apply the spectrum to a secular case they all understand.
  3.  **The Transfer to Religion (25 mins):** Move the logic from the secular case to the Last Judgement/Resurrection.
  4.  **The Frazer Contrast (5 mins):** Use Frazer only to show what religious belief is *not*.
  5.  **Diagnostic Closing (15 mins):** Discussion based on the closing question.

  **What the First 10 Minutes Must Accomplish:**
  You need to break the binary: *Fact vs. Feeling.*
  Draw a line on the whiteboard.
  *   **Left Side:** "Scientific Hypothesis." (Function: Predicts. Vulnerable: One counter-example kills it. Example: "There is water on Mars.")
  *   **Right Side:** "Emotional Preference." (Function: Expresses taste. Vulnerable: Not vulnerable to evidence. Example: "I prefer chocolate.")
  *   **Center:** "Regulative Conviction." (Function: Orients action. Vulnerable: Resistant to evidence, but not immune. Example: [Leave blank for the carrying example].)

  **Script for Minute 5:**
  > "If I say 'There is a tiger in the garden,' and you look and see no tiger, my belief is dead. If I say 'I love this song,' and you tell me it's out of tune, my preference remains. Wittgenstein is asking: when a believer says 'Christ rose,' are they on the left, the right, or somewhere that breaks our board?"

  ### 2. The Carrying Example

  **The Case:** *The Unshakable Belief in a Friend's Innocence.*
  **Scenario:** Your best friend is accused of a serious crime. The circumstantial evidence is stacked against them. You believe they are innocent.

  **Why this works:**
  *   **For the Atheists:** It's not supernatural. It involves facts (did they do it?).
  *   **For the Believers:** It mirrors faith (trust despite evidence).
  *   **For Wittgenstein:** It captures the "grammar" of belief without triggering the "is it true?" reflex immediately.

  **What it must have:**
  *   **Risk:** You might lose money or reputation by standing by them.
  *   **Action:** You visit them in jail; you hire a lawyer.
  *   **Evidence:** There *is* evidence (police reports), but it doesn't function normally.

  **What it must not have:**
  *   **Blindness:** You cannot say "I literally don't care about the evidence." (That makes the believer look deluded).
  *   **Metaphor:** You cannot say "I know they did it, but I'm pretending they didn't." (That makes the believer a liar).

  **How to run it (Minutes 10–30):**
  Ask the room: "If the friend confesses to you privately, what happens to the belief?"
  *   If they say "The belief vanishes," they are treating it as a **Hypothesis**.
  *   If they say "The belief stays the same," they are treating it as **Emotion/Fideism**.
  *   **The Wittgensteinian Move:** "The belief *shatters*, but not because of logic. It shatters because the *ground* on which you were standing has been removed. The confession doesn't just add a negative data point; it changes the world in which the belief lived."

  ### 3. The Misconception Map

  Here are the five traps, where they appear, and the exact sentence to disarm them.

  **1. Religion as Non-Cognitive Emoting ("It's just feelings")**
  *   **Insertion Point:** Immediately after the "Friend" example, before moving to religion.
  *   **Why:** Students will try to file the Friend case under "Emotion."
  *   **The Sentence:** "If belief were just emotion, I could believe my friend is innocent while never visiting them in jail. But Wittgenstein says the belief *is* the willingness to take the risk. The feeling is the exhaust, not the engine."

  **2. Belief as a Picture in the Head (Private Language hangover)**
  *   **Insertion Point:** When discussing the Evangelical student's worry about the Resurrection.
  *   **Why:** They think belief is an internal mental state of "assent."
  *   **The Sentence:** "Don't look for the belief inside her head. Look at what she *does* on Sunday morning, how she treats her neighbors, how she faces death. The belief isn't a movie playing in her mind; it's the axis on which her life turns."

  **3. Believers as Self-Deceived ("They know it's a story")**
  *   **Insertion Point:** Addressing the Evangelical student's specific fear (Minute 40).
  *   **Why:** This is the "cowardice" moment you need to fix.
  *   **The Sentence:** "Wittgenstein is not saying she is pretending. He is saying that when she says 'He rose,' she is not making a prediction about forensic evidence. She is saying 'Nothing can ultimately defeat me.' To call that self-deception is to misunderstand what game she is playing."

  **4. Religion as Walled Off from Criticism (Fideism)**
  *   **Insertion Point:** During the transfer to the Last Judgement material.
  *   **Why:** Atheists will argue this makes religion unfalsifiable and therefore safe from reason.
  *   **The Sentence:** "This does not make the belief safe. It makes it vulnerable in a different way. If the believer starts acting cruel, or if the world becomes unintelligible to them, the belief rots. It's not walled off; it's rooted in a form of life that can fail."

  **5. "Meaning is Use" as a Slogan**
  *   **Insertion Point:** Park this for the last three minutes.
  *   **Why:** If you say this early, they stop thinking.
  *   **The Sentence:** "Don't use 'meaning is use' to shut down the question. Use it to open it. If the use is prayer, not prediction, then asking for prediction-evidence is a category mistake, not a refutation."

  ### 4. The Diagnostic Closing Question

  You need a question where the **Fideist** (belief is immune to reality) and the **Wittgensteinian** (belief structures reality) give different answers.

  **The Question:**
  > "If we discovered undeniable historical proof that Jesus' body remained in the tomb, does the religious belief *necessarily* end?"

  **The Answers you want to hear:**
  *   **The Fideist/Non-Cognitivist Answer:** "No, because the belief isn't about history. It's about value. The truth of the story doesn't matter." (This is *not* Wittgenstein).
  *   **The Wittgensteinian Answer:** "It depends. For *this* believer, the resurrection is the hinge. If that hinge breaks, the door falls off. For *that* believer, it might not. But you cannot say a priori that it doesn't matter. For many, it would be the end of the language game."

  **Why this works:** It forces the atheists to admit the belief *claims* something about the world, and forces the believers to admit the belief *depends* on something about the world. It prevents the "safe zone" of pure metaphor.

  ### 5. The Cuts (Ranked by Damage Control)

  You have 75 minutes. You cannot do everything. Here is what you cut, ranked by how much damage skipping them does (Lowest Damage to Highest Damage).

  1.  **Wittgenstein's Religious Biography (Lowest Damage):**
      *   *Cut:* Whether he prayed, went to church, or called himself a Christian.
      *   *Why:* Genetic fallacy. His life doesn't validate his philosophy.
      *   *Say:* "I'm skipping his biography. We are analyzing the logic of the remarks, not the man."

  2.  **The Tractatus / The Mystical (Low Damage):**
      *   *Cut:* "Whereof one cannot speak..."
      *   *Why:* This is early Wittgenstein. It confuses the 1938 Lectures. It makes religion sound like "ineffable silence," which feeds the non-cognitivist error.
      *   *Say:* "We are not doing the Tractatus. Here, religious language is not silence; it is active."

  3.  **On Certainty / Hinge Propositions (Medium Damage):**
      *   *Cut:* Explicit discussion of *On Certainty*.
      *   *Why:* It's too close. It will blur the 1938 Lectures. Students will conflate "hinges" with "axioms."
      *   *Say:* "This looks like the 'hinge' arguments in On Certainty. It is. But today we stay strictly with the 1938 Lectures to keep the grammar clear."

  4.  **The Secondary Literature Fideism Debate (High Damage):**
      *   *Cut:* Phillips, Malcolm, Plantinga, etc.
      *   *Why:* This is where the "walled off" misconception lives. If you bring in the debate, you validate the idea that there is a "Fideist Position" to defend.
      *   *Say:* "There is a huge debate about whether Wittgenstein was a fideist. I am banning that word from today. We are looking at the text, not the commentary."

  5.  **Frazer Notes (Highest Damage if kept, High Safety if cut):**
      *   *Decision:* **Cut it entirely if you are behind time.** If you must keep it, keep it strictly as the 5-minute contrast at the end.
      *   *Risk:* If you spend too long here, you revert to "Religion = Bad Science."
      *   *Say:* "I am mentioning Frazer only to show what Wittgenstein rejects. Religion is not failed technology."

  **One Thing You Should Keep (Overruling your list):**
  *   **The "Danger" of Religious Belief.**
      *   You listed cuts, but you didn't list "The danger." You *must* keep the idea that religious belief is dangerous/passionate.
      *   *Why:* The atheists think believers are deluded; the believers think atheists think they are deluded. Wittgenstein says: "Belief is passionate." It's not a lukewarm hypothesis.
      *   *Add this:* Explicitly state that for Wittgenstein, religious belief is *more* serious than scientific belief, not less. It carries more risk. This validates the Evangelical student without validating the dogma.

  ### Summary Checklist for the Whiteboard
  1.  **Left:** Hypothesis (Evidence = King).
  2.  **Right:** Emotion (Evidence = Irrelevant).
  3.  **Center:** Conviction (Evidence = Complicated).
  4.  **Bottom:** "Don't ask for the picture in the head. Ask for the use in the life."

  Good luck. At 8:15 AM, clarity is kindness. Don't be noncommittal with the Evangelical student; tell her Wittgenstein takes her belief *more* seriously than the atheists do, because he treats it as a structure of life, not a failed science project.
