answer: |-
  Good evening. Thank you for coming. I know it's Saturday, and I know the town has other ideas about how to spend a night out, so seeing this many people in one wing of the museum is genuinely encouraging. Even if the free cider is doing some of the heavy lifting.

  We are here for the landscape panel. It has been in our storage since 1961. For most of that time, we had a name for it. We had a label, we had a valuation, and last month, you had a newspaper article telling you it was one of the finest things in the county. I sent the photograph for that article. I know many of you read it. You walked in here tonight expecting to see a masterwork.

  Six weeks ago, we asked our conservator to look closer. Not to clean it, but to understand it. She looked at the wood, the pigments, and the underdrawing. She sent me a report that said the materials are right for the period, but the hand beneath the paint is not the master's hand. It is likely a workshop copy.

  Some of you will hear that and feel something drop in the room. The trustee in me knows that changes numbers on forms. The director in me knows it changes labels. But the person who wrote that report didn't do it to lower a value. She did it because there is a kind of care that means leaving things alone, and a kind of care that means asking difficult questions. We are lucky to have the second kind here. It is better to know what we own than to pretend.

  We have two art historians with us tonight who have seen that report. They disagree. One tells me that the paint on the surface is what matters, and if it looks like the master, it works like the master. The other tells me that you cannot separate the paint from the story, and that knowing it is a copy changes what you see. One says the loss is only money and romance. The other says the loss is the truth of the object. They are both in the front row. They are not shaking hands on this. I am not going to try to settle an argument between experts in five minutes while you are holding a drink.

  So, here is what I want you to do when the cloth comes off. You have ninety seconds before you start talking to each other. Use them.

  First, look at the trees on the left. Look at how the light hits the water. Decide if it moves you. Decide if it is skilled. That is the first view.

  Then, remember the headline you read last month. Ask yourself: do I see boldness there because it is bold, or because I was told it was bold? If you hear the word "copy," does the brushwork look hesitant? If you hear the word "master," does it look confident?

  I want you to hold both thoughts at once. I want you to see the picture as it is, and see the picture as you were told it was. If you can stand in that uncertainty, if you can look at the paint and wonder about the hand without needing an answer immediately, then you are seeing this object more clearly than anyone has in sixty years.

  The value of this panel isn't just in the signature it doesn't have. It is in the fact that we are looking at it together, knowing what we know, and not looking away.

  Thank you for caring enough to come and find out. Let's see it.
