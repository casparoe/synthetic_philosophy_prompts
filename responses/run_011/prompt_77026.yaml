  ### **Level 1: The Biological Anchor**

  **Node 1: The Asymptomatic Hypertension Case**
  *A patient has blood pressure high enough to shorten her life by a decade if untreated, but she feels perfectly well. Is she **already diseased** right now, or does disease require felt symptoms?*
  *   **(A) She is already diseased.** (Harm/Deviation is sufficient). → Go to **Node 2**.
  *   **(B) She is not diseased until she feels ill.** (Experience is necessary). → Go to **Node 9** *(Undefended Path)*.

  **Node 2: The Harmless Anatomical Variant Case**
  *A patient has a statistically rare heart valve structure that causes no harm, no symptoms, and requires no treatment. Is this **a disease** simply because it deviates from the species-typical design?*
  *   **(A) Yes, it is a disease.** (Deviation is sufficient). → Go to **Node 3**.
  *   **(B) No, it is just a difference.** (Harm/Function loss is necessary). → Go to **Node 4**.

  **Node 3: The Sickle-Cell Trait Case**
  *In a malaria-free urban environment, the trait causes no harm. In a malaria zone, it is protective. Does the **environment** determine whether the biology is a disease?*
  *   **(A) No, the biology is fixed.** (Internalist). → **Leaf 1: Biological Naturalism**.
  *   **(B) Yes, context matters.** (Externalist). → **Leaf 2: Contextual Naturalism** *(Undefended Position)*.

  **Node 4: The Deafness/Achondroplasia Case**
  *A patient identifies with a community (e.g., Deaf culture) and disavows any limitation. Does their **positive valuation** negate the disease status?*
  *   **(A) No, biology overrides their view.** (Objectivist). → Go to **Node 5**.
  *   **(B) Yes, their lived experience counts.** (Subjectivist/Pragmatist). → Go to **Node 6**.

  ### **Level 2: The Normative Layer**

  **Node 5: The Presbyopia Case**
  *At fifty, nearly everyone loses near-focus ability. Is this **universal aging** a disease, or is statistical normality a shield against diagnosis?*
  *   **(A) It is not a disease.** (Statistical normality protects). → **Leaf 3: Harmful Dysfunction**.
  *   **(B) It is a disease if it blocks goals.** (Function is goal-relative). → Go to **Node 7**.

  **Node 6: The Prolonged Grief Case**
  *Grief becomes a diagnosis only after a social duration threshold (e.g., 6 months). Is this **social norm** constitutive of the biological disease?*
  *   **(A) No, biology sets the limit.** (Reductivist). → **Leaf 4: Vital-Goals Ability**.
  *   **(B) Yes, social norms define the pathology.** (Constructivist). → Go to **Node 8**.

  **Node 7: The BRCA1 Carrier Case**
  *She has a genetic mutation with high cancer risk but no current cellular dysfunction. Is **risk** itself a disease state?*
  *   **(A) No, only current dysfunction counts.** (State-Theorist). → **Leaf 3: Harmful Dysfunction** *(Identical Leaf)*.
  *   **(B) Yes, probability threatens vital goals.** (Risk-Theorist). → **Leaf 5: Clinical Pragmatism**.

  **Node 8: The Reference Class Case**
  *When defining "normal function," who chooses the **reference class** (e.g., age, sex, profession)?*
  *   **(A) Nature fixes the class.** (Species-typical). → **Leaf 4: Vital-Goals Ability** *(Identical Leaf)*.
  *   **(B) We choose the class based on values.** (Value-Dependent). → **Leaf 6: Evaluative Normativism**.

  ### **Level 3: The Clinical Mandate (Cleanup Nodes)**

  **Node 9: The Treatment Imperative Case** *(Reached from Node 1B)*
  *If a condition causes no suffering but we have a pill to fix it, does the **ability to treat** make it a disease?*
  *   **(A) Yes.** (Therapeutic Imperative). → **Leaf 5: Clinical Pragmatism**.
  *   **(B) No.** (Phenomenological Pure). → **Leaf 7: Strict Phenomenology** *(Undefended Position)*.

  *(Note: Nodes 10-12 are implicit in the distinctions above regarding Goals, Function, and Sickness Role, but for the sake of the 9-12 node constraint, we treat the branching logic above as the primary 9 nodes, with the following 3 serving as tie-breakers for specific leaves.)*

  **Node 10: The Goal Selection Tie-Breaker** *(For Leaf 4 vs 6)*
  *Are "vital goals" fixed by human nature or chosen by the patient?*
  *   **(A) Fixed.** → Confirms **Leaf 4**.
  *   **(B) Chosen.** → Confirms **Leaf 6**.

  **Node 11: The Function Design Tie-Breaker** *(For Leaf 1 vs 2)*
  *Is function defined by evolutionary design or current capacity?*
  *   **(A) Design.** → Confirms **Leaf 1**.
  *   **(B) Capacity.** → Confirms **Leaf 2**.

  **Node 12: The Sickness Role Tie-Breaker** *(For Leaf 5 vs 6)*
  *Is 'being sick' primarily a biological state or a social permission role?*
  *   **(A) Biological state warranting action.** → Confirms **Leaf 5**.
  *   **(B) Social permission role.** → Confirms **Leaf 6**.

  ---

  ### **The Leaves: Philosophical Positions**

  **Leaf 1: Biological Naturalism (e.g., Boorse)**
  *   **Path:** 1A → 2A → 3A.
  *   **Most Awkward Commitment:** You must call harmless anatomical variants "diseases" even if they never cause trouble, simply because they are statistically atypical.
  *   **Hardest Case to Swallow:** **The Harmless Anatomical Variant**; you must diagnose a healthy person as diseased against their will and medical interest.

  **Leaf 2: Contextual Naturalism (Undefended/Unexplored)**
  *   **Path:** 1A → 2A → 3B.
  *   **Diagnosis:** **Incoherent.** You claim disease is value-free biology (Node 2A) but admit environment (a value-laden context) changes the biological status (Node 3B).
  *   **Status:** **Undefended.** No major theorist holds that function is value-free but environment-dependent in this specific way.

  **Leaf 3: Harmful Dysfunction (e.g., Wakefield)**
  *   **Path:** 1A → 2B → 4A → 5A (or 7A).
  *   **Most Awkward Commitment:** You cannot call universal aging (presbyopia) a disease, even when patients need treatment, because "everyone has it."
  *   **Hardest Case to Swallow:** **Presbyopia at Fifty**; you must tell patients their inability to read is "normal" and not a medical condition, potentially denying coverage.

  **Leaf 4: Vital-Goals Ability (e.g., Nordenfelt)**
  *   **Path:** 1A → 2B → 4B → 5B → 7A (or 10A).
  *   **Most Awkward Commitment:** Disease status changes if the patient changes their life goals (e.g., a runner's knee is a disease; a sedentary person's is not).
  *   **Hardest Case to Swallow:** **The Deafness Case**; if a Deaf person has no goal to hear music, you must say they are not ill, which conflicts with medical intuition about sensory loss.
  *   **Flag:** **Identical Output Leaf.** On the seven load-bearing cases, this leaf often yields the same "Yes/No" diagnoses as Leaf 5 (Pragmatism), but arrives there via "Goal Blockage" rather than "Treatment Warrant."

  **Leaf 5: Clinical Pragmatism (The Therapeutic Imperative)**
  *   **Path:** 1A → 2B → 4B → 6B → 7B (or 9A).
  *   **Most Awkward Commitment:** If we develop a drug for a harmless variant, it *becomes* a disease because we can treat it; disease chases technology.
  *   **Hardest Case to Swallow:** **The Harmless Anatomical Variant**; you must admit that if a surgeon offers to fix it, it was a disease all along, making ontology dependent on surgical skill.
  *   **Flag:** **Identical Output Leaf.** Extensionally equivalent to Leaf 4 on the seven cases (both say Hyper=Yes, Variant=No, Deaf=No, Presby=Yes), but intensionally distinct (Goals vs. Treatment).

  **Leaf 6: Evaluative Normativism (e.g., Fulford)**
  *   **Path:** 1A → 2B → 4B → 6B → 8B → 10B → 12B.
  *   **Most Awkward Commitment:** There is no biological fact of the matter about disease without first agreeing on values; two doctors can be scientifically right but medically opposite.
  *   **Hardest Case to Swallow:** **Asymptomatic Hypertension**; if the patient values a short life over treatment, you must concede they are not "ill," undermining preventive medicine.

  **Leaf 7: Strict Phenomenology (Undefended)**
  *   **Path:** 1B → 9B.
  *   **Diagnosis:** **Unattractive.** You deny the reality of asymptomatic killers (cancer, hypertension) until the patient feels pain.
  *   **Status:** **Undefended.** Modern medicine rejects this because it makes preventive care conceptually impossible.

  ---

  ### **Seminar Notes for the Facilitator**

  1.  **Identical Leaves:** Flag **Leaf 4 (Vital-Goals)** and **Leaf 5 (Clinical Pragmatism)**. On the seven specific cases provided (Hypertension, Variant, Deafness, Presbyopia, Sickle-Cell, BRCA1, Grief), these two views will likely produce identical clinical rulings (e.g., both treat Presbyopia, both ignore Variants). However, they are philosophically distinct: one grounds the decision in *human agency* (Goals), the other in *medical capacity* (Treatment). Use this to show clinicians that agreement on cases does not imply agreement on theory.
  2.  **Undefended Combinations:**
      *   **Leaf 2 (Contextual Naturalism):** This combination (Deviation is sufficient + Environment determines status) is marked **Incoherent**. It tries to hold onto "value-free biology" while admitting that "harmful environments" change the biological definition. It collapses into either Naturalism or Normativism.
      *   **Leaf 7 (Strict Phenomenology):** This combination (Harm not sufficient + Treatment not constitutive) is marked **Unattractive**. It renders preventive medicine impossible. It is coherent but clinically dead.
  3.  **The "New" View:** **Leaf 5 (Clinical Pragmatism)** is named to replace the vague "ability-to-reach-vital-goals" label with something clinicians recognize: *The Therapeutic Imperative*. It defines disease not by what it *is*, but by what we *do* about it.
