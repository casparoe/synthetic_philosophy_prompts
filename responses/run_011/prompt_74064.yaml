answer: |-
  **Workshop Prep Sheet: Informational Foreclosure and Famine Onset**

  **Audience Profile:** Quantitative agricultural historians, demographic economists, one Sen-sympathetic political theorist.
  **Constraint:** No new archives, no regressions. Job market candidate.

  **Top Eight Objections (Ordered by Expected Damage)**

  **1. The Endogeneity Trap (Quantitative Historian)**
  *Rank:* Highest damage because it turns your mechanism into a tautology impossible to falsify with qualitative data.
  *Concession:* You are right that without exogenous variation, foreclosure looks indistinguishable from policy preference.
  *Reply:* Foreclosure is not the refusal to act, but the specific breakdown of the *capacity* to register distress before the refusal occurs. In China, cadres physically could not report low yields without punishment; in Bengal, shipping data existed but was categorically excluded from procurement calculations; in Ireland, yield data was published but doctrinally discounted. I distinguish these from simple neglect by tracing the specific point where information flow severed from decision-making loops, using cabinet minutes to show when data was received versus when it was acted upon.
  *Softness:* I cannot statistically separate information failure from political will; I rely on the timing of correspondence which may be curated.

  **2. The China Data Reliability Challenge (China Specialist)**
  *Rank:* High damage because two members have built these series and know the noise-to-signal ratio is massive.
  *Concession:* I acknowledge that reported grain output during the Great Leap is compromised by systemic inflation.
  *Reply:* That inflation is precisely the evidence of foreclosure. My argument does not rely on the accuracy of the yield data, but on the *incentive structure* surrounding its reporting. I use the divergence between procurement quotas and local consumption estimates found in internal correspondence to show when officials knew the reports were fiction. The mechanism is the punishment of honest reporting, which I can document through personnel files and directive circulars rather than output tables.
  *Softness:* I cannot quantify the true yield gap; I must rely on post-hoc reconstructions that this room may distrust.

  **3. The Ireland Definition Problem (Economic Historian)**
  *Rank:* High damage because it strikes at your hardest case and risks collapsing your definition of foreclosure.
  *Concession:* I concede that calling open press coverage "foreclosure" stretches the standard definition of information blocking.
  *Reply:* Foreclosure here refers to the *bindingness* of information, not its availability. In Ireland, the press reported failure, but the Treasury's doctrinal filter treated those reports as moral failings rather than economic data requiring intervention. The feedback loop broke not because the signal was muted, but because the receiver was calibrated to ignore it. This distinguishes Ireland from Bengal, where the signal was suppressed, while maintaining the same outcome: the state did not respond to distress.
  *Softness:* This risks sounding like a semantic shift; I cannot prove the Treasury "couldn't" act rather than "wouldn't."

  **4. The Mortality Baseline Dispute (Demographer)**
  *Rank:* Medium-High because onset timing relies on mortality spikes that are reconstructed differently across methods.
  *Concession:* You are correct that excess mortality estimates for these periods vary widely depending on the counterfactual baseline.
  *Reply:* I do not use mortality to date onset, but rather the breakdown of procurement and price signaling systems. Mortality is the outcome; informational foreclosure is the trigger. By focusing on the administrative timeline—when quotas were set against false data or when shipping was denied—I avoid relying on contested demographic reconstructions. This aligns with your own work on how administrative records often precede demographic collapse.
  *Softness:* If my administrative dates conflict with your mortality reconstructions, my mechanism looks empirically weak.

  **5. The Bengal FAD Smuggle (Bengal Specialist)**
  *Rank:* Medium-High because this opponent argues availability mattered, and you risk conceding too much to entitlements.
  *Concession:* I agree that aggregate availability declined in Bengal, contrary to the strict entitlement view.
  *Reply:* My thesis is that availability declines become famines only when informational foreclosure prevents mitigation. The decline existed, but the catastrophe began when the denial policy and censorship prevented that decline from triggering imports. This bridges your availability argument with Sen's entitlement view: availability shocks are necessary but not sufficient without the feedback failure.
  *Softness:* I cannot quantify how much import capacity existed; I rely on official correspondence regarding shipping tonnage which may be optimistic.

  **6. The Mechanism vs. Label Critique (Methodologist)**
  *Rank:* Medium because it questions whether you have identified a causal mechanism or just renamed state failure.
  *Concession:* It is fair to worry that "informational foreclosure" is just a sophisticated label for political neglect.
  *Reply:* A label describes a state; a mechanism describes a process. I trace the process: data generation, transmission, reception, and binding action. In all three cases, I show a specific break in the transmission or reception phase. This allows us to distinguish between famines where the state lacked information and those where it lacked will, which is a crucial policy distinction.
  *Softness:* Without a control group of non-famine crises, I cannot prove this mechanism is unique to famine onset.

  **7. The Selection Bias Problem (Development Economist)**
  *Rank:* Medium because graduate students trained in identification will ask about the control group.
  *Concession:* You are right that selecting three famine cases limits my ability to generalize about non-famine outcomes.
  *Reply:* This is a mechanism paper, not a predictive model. I use process tracing to show how known variables interacted to produce catastrophe. While I cannot estimate the probability of famine, I can identify the necessary condition of feedback breakdown. Future work could test this against near-miss crises, but the historical record here supports the causal chain.
  *Softness:* I cannot rule out that foreclosure occurs frequently without famine, which would weaken its explanatory power.

  **8. The Price Signal Noise (Agricultural Historian)**
  *Rank:* Low-Medium because price series are available but noisy in wartime and planned economies.
  *Concession:* I acknowledge that price signals in Bengal and China were distorted by controls and black markets.
  *Reply:* Distortion is the point. In China, prices were fixed; in Bengal, they were inflated by speculation and denial policies. The feedback failure is visible in the divergence between local distress prices and central procurement pricing. I use this divergence to show when the center lost touch with the periphery, regardless of the absolute price level.
  *Softness:* I lack high-frequency local price data to pinpoint the exact week the signal broke.

  **Fatal Objections and Strategic Retreat**

  Objections 1 (Endogeneity) and 3 (Ireland Definition) are genuinely fatal to the strong version of your thesis. If foreclosure is indistinguishable from political will, or if Ireland's open press disqualifies it from the mechanism, the theory collapses into "states sometimes ignore famines."

  **The Retreat:** You must retreat to a weaker, institutional claim: "Famine onset is accelerated when institutional filters decouple distress signals from binding policy obligations." This avoids claiming the state *couldn't* know (which is hard to prove in Ireland) and instead claims the institutions *processed* the knowledge differently. Say this: "I am not arguing the state was blind, but that its institutional eyes were calibrated to look away." This preserves the mechanism without overclaiming on information asymmetry.

  **The "Hope Nobody Asks" Objection**

  You hope nobody raises Objection 3 (Ireland Definition) in its strongest form: "If the press reported it and Parliament debated it, how can you claim informational foreclosure without rendering the concept meaningless?" This hurts most because it exposes the tension between your political theory and your economic history. It suggests your argument quietly presupposes that only *successful* claims count as information, which is circular. If the information existed but was rejected, that is a preference shock, not an information shock. You cannot answer this fully without conceding that "foreclosure" includes doctrinal filtering, which blurs the line between information and politics.

  **The Reply That Must Land**

  You must land the reply to Objection 1 (Endogeneity). If the room decides "foreclosure" is just a post-hoc label for "state didn't act," your paper becomes a description, not an explanation. You need to convince them that the *timing* of the information breakdown precedes the *timing* of the policy refusal.

  **Inoculation:** During the talk, explicitly raise this yourself: "You might ask if foreclosure is just a synonym for political will. I argue it is not, because we see cases where information was present but institutionally neutralized." By framing it first, you define the terms before they attack them.

  **Closing: Audience Strategy**

  The Sen-sympathetic theorist will object on normative grounds, asking why the state *ought* to treat information as binding, whereas the cliometricians will ask how you *measure* that bindingness. Given you are on the job market, court the cliometricians. Show them you respect identification constraints and data limits, even if your methods are historical. If you win the quants on rigor, the theorist will follow; if you lose the quants on vagueness, the theorist's support will not save you.
