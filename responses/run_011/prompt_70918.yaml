  8.  **Final Polish:** Ensure the distinction between *descriptive* (people do this) and *normative* (people shouldn't do this) is clear. The money pump is normative. Hysteresis is descriptive. The user is turning a normative argument into a descriptive/physical one. That's the philosophical shift.

