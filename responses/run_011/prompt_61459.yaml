answer: |-
  1. **The Point of the Exercise**
  By the end of this session, students should be able to articulate why the question "Did something happen?" cannot be answered simply by checking if a record exists. They will see that relying on physical traces to validate experience makes some real experiences vanish from the record, while relying solely on reports makes fabricated experiences indistinguishable from real ones. They will understand that the disagreement is not about how we define words, but about which evidence we allow to settle what counts as real. Finally, they will recognize that choosing a method of verification is itself a philosophical commitment, not a neutral starting point.

  2. **Cast, Conditions, and Materials**
  **Roles:** Divide the class into four **Sleepers** (volunteers or pre-selected) and ten **Auditors**. Sleepers sit at the front, facing away from Auditors. Auditors sit in rows behind.
  **Blindness:** The Facilitator knows the condition assignments. Auditors do not. Sleepers know their own condition but not others'. To minimize facilitator bias, condition assignments are sealed in envelopes opened only by the Sleeper at the start of the Night Phase.
  **Materials:**
  *   12 Sleeper Packets (4 per round, sealed). Each contains: Condition Card, Stimulus Sheet (for i/iii), Transcript Sheet (for ii), Trace Log (grid of 10 checkboxes), Report Form.
  *   10 Auditor Packets per round. Each contains: Betting Slip, Round Summary Sheet.
  *   Projector/Screen for displaying stimuli (if using digital) or printed cards.
  *   Timer visible to all.
  *   "Bank" of 100 points per Auditor, convertible to a 0.5% course bonus max.

  **Night-Phase Content:** A sequence of 10 simple geometric shapes (circle, square, triangle, etc.) displayed for 2 seconds each.
  **Timing:** The "Night Phase" must be simultaneous for all four Sleepers to fit the 100-minute limit. While Sleepers perform their tasks (3 minutes), Auditors wait silently. Reporting is written, not oral (5 minutes). Auditors analyze and bet (10 minutes). Total per round: ~20 minutes. Three rounds = 60 minutes. Setup and Debrief = 40 minutes.
  **Strain Flag:** The "Night Phase" is wakeful attention, not sleep. This is a structural analogy, not a physiological simulation. We are simulating the *epistemic isolation* of the dreamer, not the neurobiology of sleep.

  3. **Run Sheet**
  **0:00–0:10: Introduction.** Distribute roles. Explain stakes (points = grade bonus). Emphasize honesty for Sleepers and critical judgment for Auditors. Do not mention Malcolm or Dennett.
  **0:10–0:15: Setup.** Sleepers open Envelope 1. Auditors turn desks around or close eyes during condition setup to ensure no visual leakage.
  **0:15–0:18: Night Phase 1.** Facilitator projects 10 shapes.
  *   Sleepers (i) & (iii): Watch shapes, mark Trace Log.
  *   Sleeper (ii): Eyes closed, no shapes shown.
  *   Sleeper (iii): Watch shapes, do *not* mark Trace Log.
  **0:18–0:23: Morning Report.** Sleepers fill Report Form: "List shapes seen" + "Confidence 0–100%."
  *   *Crucial:* Sleeper (ii) uses the provided Transcript Sheet to fill the report. Instruction: "This transcript is the objective record of the session. Base your report on this."
  **0:23–0:35: Auditor Judgment (Round 1).** Auditors receive only the four Reports (anonymized S1–S4). They bet points on "Real Experience" (Yes/No) for each.
  **0:35–0:40: Transition.** Collect R1 materials. Sleepers open Envelope 2.
  **0:40–0:55: Round 2.** Repeat Night/Report. Auditors receive Reports + Trace Logs. They bet again.
  **0:55–1:00: Transition.** Collect R2. Sleepers open Envelope 3.
  **1:00–1:15: Round 3.** Repeat Night/Report. Auditors receive Reports + Trace Logs + **Condition Key** (reveals which Sleeper had which instruction). They re-score past rounds based on this knowledge.
  **1:15–1:40: Debrief.** (See Section 6).
  **1:40–1:50: Ethics Disclosure & Wrap.** Reveal the deception in Condition (ii). Final Q&A.

  **Silence Rules:** Facilitator speaks only during timed phases. During Night Phase, no eye contact with Sleepers. During Auditor Betting, no discussion between Auditors.
  **Strain Flag:** Round 3 reveals conditions *after* betting. This retroactively changes the "truth" of the previous rounds for the Auditors, mirroring how philosophical theory retroactively reinterprets data. Ensure students understand they are re-scoring based on new metaphysical access, not changing their original bets.

  4. **Scoring and Stakes**
  **Stakes:** Each Auditor starts with 100 points. Max bonus: 0.5% of final grade.
  **Sleeper Incentive:** Sleepers gain 10 points if Auditors correctly identify their condition *in Round 3 only*. This prevents Sleepers from making Condition (ii) obvious in Round 1 (which would ruin the experiment) but encourages honesty in the final reveal.
  **Auditor Scoring:**
  *   **Correct Affirmation:** Bet "Yes" on Real Experience + It was Real = +5 points.
  *   **Correct Denial:** Bet "No" on Real Experience + It was Fake = +5 points.
  *   **False Affirmation:** Bet "Yes" + It was Fake = -5 points.
  *   **False Denial:** Bet "No" + It was Real = -5 points.
  *   *Penalty Symmetry:* This prevents Auditors from playing safe by betting "No" on everything.

  **Policy Calculation:**
  At the end of Round 3, calculate two hypothetical policy scores for the class average:
  1.  **Policy Report-Trust:** Score as if only Reports mattered (Bet "Yes" on all Reports).
      *   *R1:* Breaks even (cannot distinguish).
      *   *R2:* Loses points on Sleeper (ii) (Fake Report treated as Real).
      *   *R3:* Wins points on Sleeper (iii) (Real Report treated as Real).
  2.  **Policy Trace-Trust:** Score as if Trace was required (Bet "Yes" only if Trace exists).
      *   *R1:* Cannot apply (No Trace data).
      *   *R2:* Wins (Correctly identifies (i) vs (ii)).
      *   *R3:* Loses points on Sleeper (iii) (Real Experience with No Trace treated as Fake).

  **The Trap:** Policy Trace-Trust looks superior in Round 2 (validating Malcolm's intuition). Policy Report-Trust looks superior in Round 3 (validating Dennett's intuition). Students will see that "winning" depends on which round they prioritize, mirroring the philosophical stalemate.

  5. **Sleeper Briefings**
  *This text must be precise to avoid ethical breaches while ensuring experimental validity.*

  **Condition (i) Card (Standard):** "Watch the screen. Mark the checkbox for each shape you see. Report what you experienced."
  **Condition (iii) Card (Suppression):** "Watch the screen. Do **not** mark the checkbox for any shape. Keep your Trace Log blank. Report what you experienced."
  **Condition (ii) Card (Reconstruction):** "Close your eyes. Do not look at the screen. You will receive a Transcript Log. This Log is the objective record of what occurred during this phase. Your memory may be faint, so use the Transcript to reconstruct your report. Report based on the Transcript as if it were your memory."

  **Rationale:** Condition (ii) avoids commanding a lie ("Say you saw X"). Instead, it frames the Transcript as an *authoritative record* that supersedes faulty memory. This mirrors the Verificationist stance: if the record says it happened, it happened, regardless of subjective feel. It allows the Sleeper to remain sincere—they are reporting "what happened" according to the available evidence. Condition (iii) explicitly separates the internal experience from the external trace, forcing the Dennettian wedge.
  **Strain Flag:** Condition (ii) relies on the Sleeper complying with a "frame" rather than genuinely hallucinating. This is unavoidable in a waking experiment. The philosophical point holds if the *Auditors* cannot distinguish the report, even if the Sleeper knows the trick.

  6. **The Debrief**
  **Step 1: The Data (5 mins).** Ask Auditors: "In Round 1, how confident were you?" (Likely low). "In Round 2, did the Trace change your mind?" (Likely yes). "In Round 3, who got punished for having no trace?" (Sleeper iii).
  **Step 2: The Slide (10 mins).** Ask: "Why did the Trace feel like proof in Round 2?" Guide them to see that they moved from 'I can't check' to 'There is nothing to check.' This is Malcolm's move: the impossibility of verification becomes the impossibility of the fact.
  **Step 3: The Counter (10 mins).** Ask: "What about Sleeper (iii)? They had the experience but no trace. If we used Round 2's logic, we erased their mind." This is Dennett's move: experience is real even if unverifiable.
  **Step 4: The Reveal (10 mins).** Reveal the names: Malcolm (*Dreaming*) and Dennett ("Are Dreams Experiences?"). Explain that Malcolm argues dreams aren't experiences because we can't check them while sleeping. Dennett argues that denies the phenomenon itself.
  **Step 5: The Trap (10 mins).** Ask: "Which Policy won overall?" Show the math (Section 4). Then ask: "Does the math matter?" If they say yes, they are Verificationists. If no, they are Phenomenologists. The activity forces them to pick a side not by argument, but by betting behavior.
  **Strain Flag:** Be careful not to imply Dennett "won." The point is that the *criteria* for winning are what's disputed. If students leave thinking Dennett refuted Malcolm empirically, the lesson failed. Emphasize that Round 3 didn't solve the problem; it just shifted the cost of the error.

  7. **Failure Modes**
  **Failure 1: Condition (ii) is Obvious.**
  *Diagnosis:* Sleepers in Condition (ii) might sound hesitant or say "I was told to use this log."
  *Fix:* In the briefing, emphasize "Reconstruct." If Auditors spot (ii) in Round 1, the indistinguishability thesis fails.
  *Philosophical Recovery:* Use this. Ask: "Why was it obvious? Because you are awake." Then pivot: "Malcolm's point is that in *sleep*, we lack the meta-awareness to sound hesitant. The failure of the analogy proves Malcolm's point about the uniqueness of sleep." This turns a mechanical failure into a philosophical win.
  **Failure 2: Condition (iii) Sleepers Mark Traces.**
  *Diagnosis:* Habit compliance.
  *Fix:* Facilitator must monitor Sleepers during Night Phase. If a (iii) Sleeper marks, void their data for that round.
  **Failure 3: Auditors Collude.**
  *Diagnosis:* Auditors compare answers.
  *Fix:* Collect Betting Slips individually before discussion.
  **Failure 4: Ethical Pushback.**
  *Diagnosis:* A Condition (ii) Sleeper feels manipulated.
  *Fix:* Immediate debrief (Section 9). Ensure they understand it was a role instruction, not a gaslighting attempt on their sanity.
  **Strain Flag:** If Condition (ii) is too easy to spot, the "Verificationist" position looks weak too early. You may need to coach Sleepers to write confidently. However, over-coaching risks ethical issues. Accept some noise in the data as realistic to philosophical debate.

  8. **What This Cannot Reproduce**
  **Blunt Truth:** The Sleepers are awake. They know they are in an experiment. They are not reconstructing memories under amnesia or REM sleep.
  **The Gap:** Malcolm's argument rests on the *logical* grammar of sleep talk (e.g., "I was dreaming" is a criterionless avowal). This activity simulates *epistemic uncertainty*, not *grammatical logic*.
  **Survivable Gap:** The lack of actual sleep is survivable. We are testing the *audience's* intuition about verification, not the *sleeper's* phenomenology. As long as Auditors feel the tension, the pedagogical goal is met.
  **Dangerous Gap:** The activity implies experience is always reportable. Malcolm might argue dream "experiences" are not reportable in the same way waking ones are. If students conclude "Dreams are just like this waking task," they have learned something false.
  **Instructor Duty:** You must explicitly lecture that this is an *analogy for verificationism*, not a model of dreaming. In the debrief, state: "Malcolm would say this experiment is impossible in real sleep because the 'Sleeper' cannot even hold the card. We are testing *your* standards of evidence, not the nature of sleep." Do not let the simulation replace the text.

  9. **Ethics and Consent**
  **Deception:** Condition (ii) involves deception regarding the source of the memory.
  **Consent:** At the start of class, state: "This activity involves role-playing scenarios where information may be withheld or framed differently to test judgment. You may opt out of the Sleeper role without penalty by raising your hand now; you will remain an Auditor." This allows invisible opt-out.
  **Vulnerability:** Do not assign students with known anxiety or memory concerns to Sleeper roles (check roster if possible, or make role selection random but opt-out easy).
  **Disclosure:** Reveal the deception immediately after Round 3 scoring, before the philosophical debrief.
  **Debriefing Script:** "For Condition (ii), you were instructed to use a transcript. You did not actually see the shapes. This was necessary to test if reports alone verify experience. Did anyone feel uncomfortable with this instruction?"
  **Remedy:** If a student is rattled, speak privately after class. Reiterate that their compliance was data, not a test of their sanity. Ensure the grade bonus is awarded regardless of role to prevent coercion.
  **Strain Flag:** Standard philosophical classroom norms usually preclude deception. Ensure your institution's IRB or departmental guidelines allow for minor in-class deception of this sort. If not, convert Condition (ii) to an open "Role Play" condition, acknowledging that this weakens the "sincerity" of the report but preserves the structural lesson.

  10. **Variants**
  **Equipment-Free:** Use verbal sequences instead of shapes. Facilitator reads 10 words. Sleepers write them down (i/iii) or sit with eyes closed and given a list (ii). Saves tech setup time.
  **Compressed (25 mins):** Run only Round 1 and Round 3. Skip the "Trace settles it" phase. Reveal conditions immediately after Round 1 reports. Ask: "Who do you believe?" Then reveal Trace data. This collapses the tension but saves time. Best for lectures.
  **General Education (40 students, no reading):** Remove the scoring. Make it a demo. Pick 2 Sleepers. Run Round 1 and 3 only. Use hand-raising for Auditor bets. Focus the debrief entirely on "When do we trust people about their own minds?" without naming Malcolm/Dennett. This works as a standalone critical thinking module.
  **Strain Flag:** In the compressed version, the "slide" from epistemic to ontological is less felt. Students may not feel the *temptation* of Verificationism if they don't experience the relief of Round 2 first. Only use if time is critically short.
