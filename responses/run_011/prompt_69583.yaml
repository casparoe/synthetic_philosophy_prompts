answer: |-
  ## The Identity Protocol (v1.0)

  **Purpose:** To determine whether a repository event requires a new Persistent Identifier (PID) or can remain under the existing one.
  **Time:** 10 minutes max.
  **Users:** Repository Staff.
  **Escalation:** Any verdict of "New Object" requires Director sign-off.

  ### Part 1: The Metaphysical Commitment (For the Record)
  We are adopting **Functional Endurantism with Provenance Tracking**.
  *   **The Object:** The "Object" is the *Intellectual Entity* (the work, the data, the idea), not the specific sequence of bits.
  *   **The Files:** Files are *temporal manifestations* of that Object.
  *   **The Rule:** An Object remains the "same" as long as its **Intellectual Intent** and **Citation Utility** remain stable, even if its bits change. If the Intent changes or the Citation Utility is broken, it is a "New Object."

  *Why this matters:* This allows us to keep one PID for a work that undergoes preservation migration (Same Object) but forces a new PID if the work itself is fundamentally altered (New Object). It acknowledges the "spacetime worm" (we track history) without forcing staff to model temporal parts.

  ### Part 2: The Procedure (The 3-Question Test)

  Ask these questions in order. Stop at the first "Yes."

  **Q1: Did the bits change without human intent to alter content? (e.g., disk rot, checksum fail, format migration for preservation)**
  *   **YES:** → **SAME OBJECT.** (Log event in PREMIS metadata. Restore or migrate bits under existing PID.)
  *   **NO:** → Go to Q2.

  **Q2: Does the change alter the intellectual content such that a citation written yesterday would be invalid today? (e.g., corrected data, changed conclusion, re-interpreted scan)**
  *   **YES:** → **NEW OBJECT.** (Escalate to Director. Mint new PID. Link records as "Supersedes/Superseded By".)
  *   **NO:** → Go to Q3.

  **Q3: Did the Creator/Donor explicitly designate the previous version as "invalid" or "draft" *before* it was ever cited or published?**
  *   **YES:** → **SAME OBJECT (New Version).** (Replace bits. Add note: "Author Corrected Pre-Publication".)
  *   **NO:** → **NEW OBJECT.** (If it was accessible/citable, the old version is now a historical record. Mint new PID for the correction.)

  ### Part 3: Value Judgments Disguised as Procedure
  *Be aware: You are making ethical calls, not technical ones.*

  1.  **The Citation Promise:** When we say "Same Object," we are promising a researcher that the PID resolves to what previous citers saw. If we change the bits under the same PID, we are prioritizing *current utility* over *historical accuracy*.
      *   *Procedure Impact:* Q2 and Q3 protect the Citation Promise.
  2.  **The Definition of "Work":** We are deciding that a TIFF and a JPEG2000 of the same page are the same "Work," but a corrected spreadsheet is a different "Work."
      *   *Procedure Impact:* This privileges *semantic content* over *bitwise identity*.
  3.  **The Authority of the Donor:** In Q3, we grant the donor the power to rewrite history, but *only* if the public record hasn't yet relied on the mistake.
      *   *Procedure Impact:* Once a file is citable, the donor loses the right to collapse the timeline.

  ### Part 4: Failure Modes (Where This Will Misfire)
  1.  **The "Minor" Correction:** A donor fixes a typo in a text file. Technically, the intellectual content changed (Q2 = Yes), but practically, it's the same work. Staff may struggle to judge "significance."
      *   *Mitigation:* If the typo doesn't change data interpretation, treat as Same Object (New Version).
  2.  **The Silent Migration:** Automated systems migrate files without logging the event. We lose the "temporal part" record. The Object appears to have no history.
      *   *Mitigation:* Ensure all migrations trigger a metadata event log, even if PID stays same.
  3.  **The Orphaned Version:** If we mint a New PID for a correction (Q2/Q3), the old PID must remain resolvable. If our system deletes old bitstreams to save space, we break the protocol.
      *   *Mitigation:* Old versions must be archived, not deleted.

  ---

  ### Part 5: Running the Protocol on Your Cases

  #### Case 1: 300 TIFFs migrated to JPEG2000 (2019); 2004 paper cites TIFF.
  *   **Q1 (Bits change without intent to alter content?):** **YES.** Migration is for preservation/access, not content change.
  *   **Verdict:** **SAME OBJECT.**
  *   **Action:** Keep existing PID. Log migration event in metadata.
  *   **Rationale:** The 2004 reader cited the *image content*, not the compression algorithm. The Intellectual Entity is stable. The "Citation Promise" is kept because the visual data is functionally identical.
  *   **Metaphysical Note:** This treats the Object as Endurant (wholly present). The TIFF and JP2 are just different "clothing" for the same body.

  #### Case 2: Checksum fail; restore from 3-year-old backup.
  *   **Q1 (Bits change without intent to alter content?):** **YES.** This is recovery of the *original* state, not a change.
  *   **Verdict:** **SAME OBJECT.**
  *   **Action:** Keep existing PID. Log "Integrity Failure" and "Restoration" events with timestamps.
  *   **Rationale:** You are not creating a new object; you are healing the existing one. The "spacetime worm" had a lesion, now it is stitched.
  *   **Risk:** If the backup is significantly older than the failure, you have a "temporal gap." You must document what data might have been lost between the backup date and the failure date.

  #### Case 3: Donor sends corrected file; says original was "never finished."
  *   **Q1:** **NO.** This is human intent to change content.
  *   **Q2 (Does it alter intellectual content/citation validity?):** **YES.** If the original was "unfinished," the data/conclusions may differ. A citation to the "unfinished" version is now a citation to a draft, not the final work.
  *   **Q3 (Designated invalid *before* cited/published?):** **DEPENDS.**
      *   *Scenario A (It was never public):* **SAME OBJECT (New Version).** Replace the file. Note: "Version 2: Author Final."
      *   *Scenario B (It was public/citable):* **NEW OBJECT.** The "unfinished" file is now a distinct historical artifact (a draft). The "finished" file is the Work.
  *   **Action (assuming it was accessible):** Mint **New PID** for the corrected file. Link the two: Old PID `isDraftOf` New PID. New PID `isFinalVersionOf` Old PID.
  *   **Rationale:** You cannot erase the "unfinished" version if someone cited it. To do so would be to falsify the historical record (breaking the Citation Promise). The "Object" has bifurcated: there is now the *Draft Object* and the *Final Object*.

  ---

  ### Part 6: The Honest Truth (Metaphysics vs. Database)

  You asked: *If the two views make zero difference to what ends up in the database, say so.*

  **Here is the truth:**
  In a rigid database schema where `PID -> Single Bitstream`, the metaphysics **does** dictate the schema.
  *   If you believe the Object is the **Bits** (Perdurantist/Strict), every migration requires a **New PID**. Your database fills with PIDs for the same work.
  *   If you believe the Object is the **Work** (Endurantist/Functional), migrations keep the **Same PID**. Your database hides the bit-level history unless you have a separate event log.

  **Where the difference actually shows up:**
  It shows up in the **Metadata**, not the PID.
  *   **Zero Difference:** If your system supports PREMIS events or versioning layers. Whether you call a migration "Same Object, new properties" or "New Temporal Part of same Worm," the database record looks identical: `PID: 123 | File: A.tif | Event: Migration | File: B.jp2`.
  *   **Real Difference:** The difference is in **Liability and Trust**.
      *   If you treat Case 3 (Donor Correction) as "Same Object," you are implicitly telling the researcher: *"The object you cited last year is identical to the one you see today."* If they find out it changed, they lose trust in the repository.
      *   If you treat it as "New Object," you are telling them: *"The object evolved. Here is the lineage."*

  **The Verdict:**
  The metaphysics doesn't change the *bits* you store. It changes the **provenance chain** you build around them.
  *   **Endurantism** (Same PID) is easier for users (stable links) but riskier for integrity (hidden changes).
  *   **Perdurantism** (New PID/Versioning) is harder for users (link rot) but safer for integrity (explicit history).

  **My Advice:**
  Your system forces a binary (One ID = One Thing). This is a metaphysical constraint disguised as tech debt.
  1.  **Adopt the Protocol above.** It leans Endurantist for preservation (Case 1 & 2) to save staff time and PID space.
  2.  **Switch to Perdurantist for Content Changes (Case 3).** When the *meaning* changes, mint a new ID.
  3.  **Fix the Tech:** Eventually, decouple the PID from the Bitstream. The PID should point to an *Intellectual Entity* which resolves to the *Best Available Version* by default, but allows selection of *Historical Versions*. Until then, use the Protocol to manage the risk.

  You are not solving the Ship of Theseus. You are managing the risk of being sued by a donor or corrected by a PhD student. The Protocol prioritizes **Citation Stability** over **Bitwise Purity**, except when the Donor forces a bifurcation. That is the only sustainable position for a small repo.
