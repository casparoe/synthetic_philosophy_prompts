prompt: |-
  Nguyen separates epistemic bubbles (you just never hear the other voices, and more exposure fixes it) from echo chambers (you've been trained to actively distrust outside sources, so exposure makes it worse). Here's a case I keep coming back to: a county's only local paper gets bought by a chain that guts the newsroom, and what's left is mostly syndicated copy and press releases from developers. The townsfolk watched this happen, they now tell each other not to trust anything in it, and they're right — it really is basically a PR sheet. True belief, decent evidence, correctly aimed target.

  Argue that they're still in an echo chamber in the sense that matters, and that the usual gloss on Nguyen puts the marker in the wrong place: what makes a structure an echo chamber can't be that the distrust is false or badly grounded, since here it's neither. So identify what else does the work — some property of how the distrust is held rather than whether its correct — and defend that as the load-bearing feature. Then say what your answer does to the bubble/echo contrast itself, especially whether "exposure reinforces it" still cleanly separates the two kinds once you've relocated the criterion.

  I want an actual argument, not a literature tour or a both-sides summary. When you're done, add a JSON object with exactly these fields: thesis (one sentence); load_bearing_property (one sentence naming the feature you claim does the work); moves (array of 3-5 strings, one per argumentative step, in order); hardest_objection (string, the best reply available to the other side); does_the_contrast_survive (string: yes or no, plus the amended formulation if yes).
