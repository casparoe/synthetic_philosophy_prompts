answer: |-
  # Q&A Preparation Document: Metascience Seminar

  **To:** Software Engineer, Research Platform Team
  **From:** Strategy Prep
  **Subject:** Objection Handling for "Preregistration as Search Budget" Talk
  **Context:** 40-min talk + 60-min discussion. Audience: 2 Trial Statisticians, 4 Psychologists, 1 Philosopher, ~8 Grad Students.

  Below are the eight objections you are most likely to face, ordered by the likely flow of the conversation (senior faculty usually speak first). They are tagged by **Damage Potential** (High/Medium/Low) if answered poorly.

  Each objection is written in the voice of the objector. The suggested reply is timed for ~2 minutes of spoken speech (~250 words).

  ---

  ### 1. The Trial Statistician (Multiplicity & Alpha-Spending)
  **Damage:** **HIGH** | **Likelihood:** **Very High** (Will likely speak first)
  **Voice:** "I want to make sure I understand your contribution relative to existing theory. You describe the 'search space' of analyses as a source of error inflation. But in group-sequential designs, we account for the 'search space' of looks at the data using alpha-spending functions. We have rigorous error control under optional stopping for decades. Are you claiming this is a new problem, or just that applied researchers aren't using the tools we built thirty years ago?"

  **Suggested Reply:**
  "That's a crucial distinction, and I want to be precise so I don't claim credit for work you've already solved. You are absolutely right that *optional stopping*—peeking at the data to decide *when* to stop collecting—is handled by alpha-spending. My claim is about *analytic flexibility*—deciding *how* to model the data after seeing it.

  Alpha-spending bounds the number of *times* you check the data. My simulation bounds the number of *ways* you process the data. In my model, the sample size is fixed, but the analyst chooses between covariates, transformations, and outlier rules. A group-sequential design controls the error rate if I test the same hypothesis five times. It does not control the error rate if I test five *different* hypotheses on the same dataset and report the best one. Preregistration, on my account, acts like an alpha-spend, but applied to the 'model space' rather than the 'time space.' I'm not saying trial statistics is broken; I'm saying the 'Garden of Forking Paths' is a multiplicity problem that standard alpha-spending doesn't address because the 'comparisons' aren't predefined."

  **Soft Spot:** If they press that "model selection" is just "multiple comparisons," you risk sounding like you're renaming existing concepts.
  **Concession Flag:** **NO.** Do not concede this is just standard multiplicity. The distinction between *data accumulation* and *model specification* is your core thesis.

  ### 2. The Psychologist/Bayesian (Immunity of Bayes Factors)
  **Damage:** **HIGH** | **Likelihood:** **High**
  **Voice:** "I'm one of the people running the preregistered studies you mentioned. We started reporting Bayes Factors specifically because the literature says they are immune to stopping rules and optional sampling. Your simulation shows Bayes Factors degrading just like p-values. If your simulation is right, it implies the theoretical guarantees of Bayesian inference don't hold in practice. Are you saying Bayes Factors are broken, or that our implementation of them is?"

  **Suggested Reply:**
  "I am not claiming the math of Bayes Factors is broken. The theoretical guarantee is that if you update a prior with likelihood, the stopping rule doesn't change the posterior. That holds. But that guarantee assumes the *model* is fixed. My simulation introduces a step before the Bayes Factor is calculated: the analyst chooses *which* model to run based on the data.

  If I try ten different covariate adjustments and report the Bayes Factor for the one that looks strongest, I have effectively 'cherry-picked' the prior-likelihood pairing. The Bayes Factor is calibrated for *that specific model*, not for the process that *selected* that model. So, the math is right, but the interpretation is wrong if you ignore the selection process. My point isn't that Bayesians should switch to p-values; it's that Bayes Factors inherit the same vulnerability to 'researcher degrees of freedom' as p-values do. Preregistration protects the Bayes Factor not by making it more 'Bayesian,' but by preventing the model selection that biases it."

  **Soft Spot:** Hardline Bayesians believe the Likelihood Principle makes stopping rules irrelevant *period*. They may reject the premise that selection bias matters for belief updating.
  **Concession Flag:** **NO.** This is your second pillar. If you concede BFs are safe, your thesis collapses to "p-values are hard to use."

  ### 3. The Feasibility Challenge (Counting the Space)
  **Damage:** **MEDIUM-HIGH** | **Likelihood:** **High**
  **Voice:** "Let's say I accept your premise that preregistration is a budget on the search space. In a clinical trial, we can count the number of interim looks. In an analyst's head, how do you count the 'number of analyses tried'? One analyst might see ten paths; another sees fifty. If we can't quantify the 'N' of the search space, how can we set a budget? It sounds like you're proposing a correction we can't calculate."

  **Suggested Reply:**
  "That is the hardest engineering problem here, and I don't have a perfect solution yet. You're right that we can't count the mental search space retrospectively. That's exactly why *prospective* preregistration is the mechanism. We can't count the paths taken, so we must limit the paths *allowed*.

  Think of it like security clearance. We can't know every way a hacker might try to breach a system, so we don't try to patch every hole retrospectively. We limit access upfront. Preregistration doesn't require us to count the 'N' of analyses tried; it requires us to set a cap on the 'N' of analyses permitted. If the protocol says 'we will test Model A,' then the search space size is 1. If it says 'we will test A, B, or C,' the space is 3. The 'budget' is set by the specificity of the protocol, not by counting the analyst's thoughts. The simulation shows that as that permitted space grows, error grows. So the solution is to keep the permitted space small."

  **Soft Spot:** This sounds a bit circular ("We can't measure it, so just restrict it"). It doesn't solve the problem of exploratory analysis.
  **Concession Flag:** **YES (Partial).** Concede that quantifying the space retrospectively is impossible. That strengthens the argument for *prospective* registration.

  ### 4. The Simulation Critic (Your Own Degrees of Freedom)
  **Damage:** **HIGH** | **Likelihood:** **Medium** (Someone read your write-up carefully)
  **Voice:** "I read your internal write-up. Your simulation uses a scripted agent to explore the data. But you had to decide how that agent behaves: which transformations to try, how many to allow, what the 'true' effect size was. Didn't you exercise your own degrees of freedom in building the simulation? If you tweaked the agent until you got the degradation curve you wanted, doesn't that undermine the evidence?"

  **Suggested Reply:**
  "That is a fair critique, and I want to be transparent about the simulation's limits. I did make choices about the agent's behavior. However, the goal of this simulation wasn't to provide a precise calibration constant—like saying '10 analyses equals 5% inflation.' It was an existence proof.

  I varied the simulation parameters—different effect sizes, different numbers of allowed transformations—and the degradation trend held. The specific slope changes, but the direction doesn't. I am not claiming this simulation gives us a universal correction factor. I am claiming it demonstrates a mechanism: that coupling model selection with inference inflates error, regardless of the specific metric. If the room thinks the specific parameters are unrealistic, I welcome that feedback to refine the model. But the qualitative result—that flexibility degrades calibration—doesn't depend on the specific agent settings I chose."

  **Soft Spot:** If they press that you tuned the parameters to get significance, you have no defense other than "trust me."
  **Concession Flag:** **YES.** See "Graceful Fallback" in the Strategy section below.

  ### 5. The Philosopher (Severity vs. Calibration)
  **Damage:** **MEDIUM** | **Likelihood:** **Medium**
  **Voice:** "I teach the foundations course, and I worry you're conflating two different goals. You talk about 'error control' and 'false-positive rates.' But for many of us, the point of a statistical procedure isn't just long-run calibration; it's about whether the data provides a severe test of a claim. If preregistration stops you from searching, does it actually make the test more severe, or does it just make the error rate manageable? I'm not sure 'budgeting' captures the epistemic value."

  **Suggested Reply:**
  "I appreciate that distinction. In my framework, 'error control' is the mechanism, but 'severity' is the outcome. If an analyst searches through twenty models and reports the one with the best fit, the data no longer severely tests the hypothesis, because the data was used to construct the hypothesis.

  By treating preregistration as a budget, I'm trying to operationalize severity. A test is severe only if it could have detected an error had one been present. If the search space is unbounded, the procedure can always find a model that fits, so it couldn't have detected the error of 'wrong model.' Limiting the search space restores the capability of the procedure to detect errors. So I agree with you that severity is the goal; I'm arguing that a 'budget on search' is the engineering constraint required to achieve it."

  **Soft Spot:** You are stepping into philosophical territory without training. Keep it mechanistic.
  **Concession Flag:** **NO.** Align with them. Their definition of "error detection" supports your "budget" mechanism.

  ### 6. The Definition Challenge (Contract vs. Budget)
  **Damage:** **LOW** | **Likelihood:** **Medium**
  **Voice:** "You keep using the word 'budget.' But preregistration is usually framed as a contract or a commitment device to prevent p-hacking motives. Does calling it a 'budget' change how we should enforce it? A budget implies trade-offs; a contract implies binary compliance."

  **Suggested Reply:**
  "I use 'budget' deliberately to shift how we handle deviations. If it's a contract, any deviation is a breach, which encourages people to hide deviations. If it's a budget, we acknowledge that exploration costs 'alpha.'

  In a budget framework, if a researcher wants to deviate from the preregistration, they don't have to hide it; they just have to acknowledge the cost. Maybe they spend their 'budget' on an exploratory subgroup analysis. This makes the trade-off explicit. It moves us from a culture of 'did you follow the rules?' to 'how much inference did you spend to get this result?' It makes the cost of flexibility visible rather than forbidden."

  **Soft Spot:** Journals don't actually operate on a budget system yet. This is theoretical.
  **Concession Flag:** **YES.** Concede this is a proposed mental model, not current policy.

  ### 7. The Exploratory Question (Scope)
  **Damage:** **LOW** | **Likelihood:** **High** (Grad Students will ask this)
  **Voice:** "I'm a grad student. Most of my work is exploratory; I don't know what hypotheses I have until I see the data. If preregistration is a budget on search, does that mean exploratory work is invalid? Are you saying we shouldn't do data science on our own data?"

  **Suggested Reply:**
  "Not at all. Exploratory work is essential. My claim is about *inference*, not *discovery*. You can search the space as much as you want for generation of hypotheses. The 'budget' only applies when you want to claim the result as a test of a hypothesis.

  Think of it like a map. You can explore the territory freely. But if you want to draw a map for someone else to navigate, you have to tell them which paths you already walked. Exploratory analysis generates claims; confirmatory analysis tests them. My framework just asks that we label which one we are doing. If you are exploring, report it as exploration. Don't spend your 'confirmation budget' on an exploratory finding."

  **Soft Spot:** None. This is a standard distinction.
  **Concession Flag:** **NO.** This is a safe opportunity to clarify scope.

  ### 8. The Alternative Solution (Report All)
  **Damage:** **LOW** | **Likelihood:** **Low**
  **Voice:** "Why do we need a budget? Why not just require analysts to report all the analyses they tried? If the search space is recorded, then the p-value is interpretable again. Transparency solves this without restricting the search."

  **Suggested Reply:**
  "Transparency is necessary, but it's not sufficient. If you report twenty analyses and one is significant, the reader still has to do the correction. But more importantly, analysts often don't *know* the full space they searched. It's often intuitive decisions—'this outlier looked weird'—that aren't recorded.

  A budget forces the decision *before* the intuition kicks in. Transparency lets us audit the crime; a budget prevents it. We need both, but preregistration as a budget does the heavy lifting on error control. Transparency just lets us check if the budget was balanced."

  **Soft Spot:** Some open-science advocates believe "report all" is the silver bullet.
  **Concession Flag:** **YES (Partial).** Concede transparency is vital, but maintain it doesn't solve the *selection* bias alone.

  ---

  # Strategic Advice for the Talk

  ### 1. What to Concede in the First 5 Minutes
  *Pre-empt the two strongest attacks to disarm them.*
  *   **Concede to the Trial Statisticians:** "I want to be clear: I am not claiming that group-sequential designs or alpha-spending are insufficient for *data peeking*. That problem is solved. My talk is about *model peeking*, which is distinct."
  *   **Concede on the Simulation:** "The simulation I'm showing is an existence proof, not a precise calculator. The exact degradation rate will depend on the context. The point is the direction of the effect, not the slope."

  ### 2. What You Must Not Give Up
  *   **The Vulnerability of Bayes Factors:** If you let them convince you that BFs are immune to analytic flexibility, your thesis becomes "P-values are hard to use," which is old news. You must maintain that *model selection* biases *any* metric derived from the model.
  *   **Preregistration as Mechanism, not Morality:** Do not let the discussion drift into "researchers should be more honest." Keep it on "preregistration bounds the search space." If it becomes about ethics, you lose the engineering audience.

  ### 3. The Single Reply That Must Land
  *   **The Distinction between Stopping and Searching:** You must successfully communicate the difference between *Optional Stopping* (changing N) and *Analytic Flexibility* (changing Model).
      *   *Why:* The Trial Statisticians know how to handle the first. If you confuse the two, they will dismiss you. If you distinguish them, you carve out a niche for your contribution.
      *   *Phrasing:* "Stopping rules change the distribution of the test statistic. Analytic flexibility changes the definition of the test statistic itself."

  ### 4. Graceful Fallback for the "Simulation DF" Objection
  *If Question #4 hits hard and you feel cornered on your own researcher degrees of freedom:*
  *   **Say this:** "You're right. This simulation is a product of my own search space. I made choices to get this result. That actually proves my own point: even in a simulation about researcher degrees of freedom, I had researcher degrees of freedom. The takeaway shouldn't be the specific numbers I generated, but the fact that we need a way to bound these choices in real research. I'm offering the framework; I invite the room to help me stress-test the simulation parameters."
  *   **Why:** It turns the attack into a validation of your thesis (even the critic is subject to the problem) and invites collaboration rather than defense.
