answer: |-
  # HANDOUT: The Realism Sorting Tree (Condensed Matter & Bio Edition)

  **Instructions:** Start at **Node 1**. Answer based on your intuition about the *case*, not the label. Follow the arrow to the next node or to a **Leaf** (your provisional position). Time limit: 10 minutes.

  ***

  ### NODE 1: The Status of the Model
  **Case:** You run a simulation using a "pseudopotential" or a cutoff parameter that you know is physically false (e.g., infinite lattice), but it yields perfect predictions for the observable output.
  *   **A:** The parameter is just a computational tool; the model isn't "true" or "false," just useful. $\rightarrow$ **Go to Node 2**
  *   **B:** The parameter is false, but the underlying structure it approximates is true/false about the world. $\rightarrow$ **Go to Node 3**

  ### NODE 2: Truth-Aptness (Instrumentalism Check)
  **Case:** Consider the whole theory (e.g., BCS theory). If it saves all phenomena but posits entities you can't see, is it a *description* of reality or an *organizing system* for data?
  *   **A:** It's an organizing system. Truth values don't apply to the unobservable parts. $\rightarrow$ **LEAF 1: Instrumentalism**
  *   **B:** It's a description. It aims at truth, even if it misses. $\rightarrow$ **Go to Node 3**

  ### NODE 3: The Observable Limit (Empiricism Check)
  **Case:** A detector registers a "click" (e.g., Geiger counter, cloud chamber track) that requires theory to interpret. Van Fraassen calls this "observable"; others call it "theoretical."
  *   **A:** I only believe in what I can see with my eyes (macroscopic). Unobservables are just model artifacts. $\rightarrow$ **LEAF 2: Constructive Empiricism**
  *   **B:** If the detection chain is robust, I believe in the entity causing the click, even if I can't see it directly. $\rightarrow$ **Go to Node 4**

  ### NODE 4: Manipulation vs. Description (Entity Realism Check)
  **Case:** You can manipulate a quasiparticle (e.g., steer a hole in a Hall system) to do work, but the *equation* defining its mass changes with context (renormalization).
  *   **A:** The *entity* is real because I can spray it; the *theory* describing it is likely false/approximate. $\rightarrow$ **LEAF 3: Entity Realism**
  *   **B:** If the theory describing it is unstable, I'm not sure the "entity" is distinct from the "relations" defining it. $\rightarrow$ **Go to Node 5**

  ### NODE 5: Theory Change (PMI Check)
  **Case:** Look at the "Gene." It referred to a Mendelian factor, then a DNA sequence, now often an epigenetic marker. The *term* stayed, the *referent* shifted.
  *   **A:** This is discontinuity. We likely don't have the "real" referent yet. (PMI is strong). $\rightarrow$ **Go to Node 6**
  *   **B:** This is refinement. We are locking onto the same natural kind more precisely. (PMI is weak). $\rightarrow$ **Go to Node 7**

  ### NODE 6: What Survives Change? (Structuralism Check)
  **Case:** Fresnel's ether theory was "false" (no ether), but the differential equations survived into Maxwell's theory.
  *   **A:** The *math/structure* was true; the *ontological story* (ether) was false. $\rightarrow$ **LEAF 4: Structural Realism (ESR/OSR)** `[See Note 1]`
  *   **B:** If the ontology is wrong, the theory is wrong. We need to find the parts that were actually "working." $\rightarrow$ **Go to Node 7**

  ### NODE 7: Selectivity (Preservative Realism Check)
  **Case:** Can you historically separate the "working posits" (e.g., transverse wave nature) from the "idle wheels" (e.g., elastic solid medium) in past theories?
  *   **A:** Yes, in hindsight. We should believe only the parts that survive theory change. $\rightarrow$ **LEAF 5: Selective Realism**
  *   **B:** No, the theory is a package deal. You can't know which part is "working" until the next theory arrives. $\rightarrow$ **Go to Node 8**

  ### NODE 8: Unconceived Alternatives (Stanford Check)
  **Case:** Is it likely that a future theory will explain current data using concepts we literally cannot conceive of yet (like we couldn't conceive of fields in 1800)?
  *   **A:** Yes. Current ontology is probably as doomed as phlogiston. $\rightarrow$ **LEAF 6: Skeptical Realism / New Induction**
  *   **B:** No. Our conceptual space is mature enough that we're closing in on the truth. $\rightarrow$ **LEAF 7: Standard (Optimistic) Realism**

  ***

  ## INSTRUCTOR'S KEY: Logical Space & Diagnostics

  ### 1. The Logical Matrix (Answer Combinations)
  The tree above maps onto three binary dimensions (simplified for the 7 leaves):
  1.  **Truth-Aptness:** (Is science trying to state facts? Y/N)
  2.  **Ontological Commitment:** (Do unobservables exist? Y/N)
  3.  **Continuity:** (Does successful structure/reference survive theory change? Y/N)

  | Leaf | Truth-Apt? | Believe Unobservables? | Trust Current Ontology? | Trust Structure over Objects? |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Instrumentalism** | No | N/A | No | No |
  | **2. Const. Empiricism** | Yes | No (Observables only) | No | No |
  | **3. Entity Realism** | Yes | Yes (Entities only) | Agnostic | No |
  | **4. Structural Realism** | Yes | Yes (Relations only) | No (Objects dubious) | **Yes** |
  | **5. Selective Realism** | Yes | Yes (Working parts) | **Yes (Partial)** | Yes (if structure works) |
  | **6. Skeptical Realism** | Yes | Yes (Tentative) | **No** | Maybe |
  | **7. Standard Realism** | Yes | Yes | **Yes** | No |

  ### 2. Empty Cells (Combinations that yield no defended position)
  *   **Cell:** Truth-Apt = **No** / Believe Unobservables = **Yes**.
      *   *Diagnosis:* **Incoherent.** You cannot believe an entity exists while claiming statements about it have no truth value. (Some pragmatists flirt with this, but it collapses into Instrumentalism).
  *   **Cell:** Trust Current Ontology = **Yes** / Trust Structure over Objects = **Yes**.
      *   *Diagnosis:* **Redundant.** If you trust the ontology, you usually trust the objects *and* the structure. Distinguishing them implies skepticism about the objects (see Structural Realism).
  *   **Cell:** Believe Unobservables = **No** / Trust Structure = **Yes**.
      *   *Diagnosis:* **Unappealing.** Mathematical structuralism without ontological commitment is effectively Constructive Empiricism with extra steps.

  ### 3. Indistinguishable Leaves (On this handout)
  *   **Leaf 4 (Structural Realism) vs. Leaf 5 (Selective Realism):**
      *   *Why:* Both argue that *something* survives theory change (math vs. working posits). In practice, "working posits" are often mathematical structures.
      *   *Extra Question Needed:* "Is the structure real *because* it captures relations between objects, or are the relations all there *is*?" (Distinguishes Epistemic vs. Ontic Structural Realism).
  *   **Leaf 6 (Skeptical Realism) vs. Leaf 2 (Constructive Empiricism):**
      *   *Why:* Both result in withholding belief about current unobservables.
      *   *Extra Question Needed:* "Do you withhold belief because we *can't* know (Empiricism), or because history suggests we *will be wrong* (Skepticism)?"

  ***

  ## EPISTEMIC FOOTNOTES (For the Facilitator)

  **[Note 1: Structural Realism]**
  *   *Live Disagreement:* The distinction between **Epistemic** (we can only *know* structure) and **Ontic** (structure is all there *is*) is a major live debate (Ladyman & Ross vs. Worrall). This tree groups them because Node 6 doesn't separate metaphysics from epistemology.
  *   *Facilitator Tip:* If a postdoc lands here, ask: "Do photons exist, or is there just a field structure that behaves photon-ish?"

  **[Node 1: Instrumentalism]**
  *   *Settled Claim:* It is settled that scientists *use* instruments instrumentally.
  *   *Live Disagreement:* Whether this usage implies a philosophical commitment to anti-realism is contested. Many realists use false parameters without being instrumentalists.

  **[Node 3: Observables]**
  *   *Live Disagreement:* The observable/unobservable distinction is widely contested (Maxwell vs. van Fraassen). In Condensed Matter, "observable" often means "detectable via interaction," which blurs the line.
  *   *Facilitator Tip:* If a biologist says "I see DNA," challenge them: "You see a stained band. The 'gene' is an inference."

  **[Node 5 & 8: PMI & Unconceived Alternatives]**
  *   *Live Disagreement:* The strength of the Pessimistic Meta-Induction is the central live debate in this session. There is no consensus on whether current theories are "special" compared to 19th-century ether theories.
  *   *Facilitator Tip:* Don't let the Standard Realist (Leaf 7) claim victory. Ask them: "What specific feature of QFT makes it immune to the fate of Newtonian Mechanics?"

  **[Node 4: Entity Realism]**
  *   *Contested Reading:* Hacking's "If you can spray them, they are real" is often criticized for relying on causal theories that may themselves be theory-laden.
  *   *Facilitator Tip:* For the Statistician: "If you can manipulate a p-value threshold to produce significance, is the 'effect' real?" (Use this to show the limit of manipulation arguments).

  **[Leaf 7: Standard Realism]**
  *   *Live Disagreement:* The definition of "Approximate Truth" is notoriously unresolved (Niiniluoto vs. others).
  *   *Facilitator Tip:* Ask the Condensed Matter postdoc: "Is the Fermi Liquid theory approximately true, or is it a robust effective description that fails fundamentally?"

  ***

  **Design Note:** This tree prioritizes *domain-specific intuitions* (quasiparticles, genes, effective theories) over abstract definitions. It forces the participant to confront the *cost* of their realism (e.g., accepting that "genes" might not be natural kinds) rather than just asking for their label. The "Empty Cells" section ensures you can explain why certain combinations (like believing in electrons but denying truth-values) don't survive philosophical scrutiny.
