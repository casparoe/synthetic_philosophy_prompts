      *   **The User's Insight is Correct:** They are talking past each other. Camp A is promising "Safety" (absence of harm), Camp B is promising "Reliability" (presence of function).
      *   **The "Vault" Analogy:** The friend is right about the definition of a vault (deterministic security), but wrong about the product. An email assistant isn't a vault; it's a *delegate*. A delegate *must* act. A vault that never opens is useless. A delegate that acts unpredictably is dangerous.

  3.  **Evaluate the Risks:**
      *   **Camp A Risk:** Product dies. Users leave for competitors. The "guarantee" is illusory (composition attacks, social engineering the user into approving bad things).
      *   **Camp B Risk:** Catastrophic failure. One prompt injection or distribution shift causes mass unauthorized sends, financial loss, or legal liability. 99.4% on 12k samples means ~72 failures in that set. Scale that to 200k users acting daily, and you have daily incidents.
