answer: |-
  **JOINT STATEMENT ON POPULATION ETHICS AND THE COLONY CASE**

  **Issued by:** The Adversarial Collaboration on Population Axiology
  **Date:** October 26, 2023
  **Subject:** Consensus and Dissensus Regarding the "Colony" Scenario

  We, the undersigned representatives of the Totalist and Person-Affecting Restrictivist camps, submit this statement to clarify the state of our debate. While we remain opposed on fundamental axiological principles, we have successfully isolated the points of agreement and the precise loci of our disagreement regarding the stipulated case, *Colony*.

  ### I. Areas of Agreement

  Both camps affirm the following claims regarding the *Colony* scenario, the implications of our respective theories, and the empirical constraints involved:

  1.  **Facts of the Case:** In the *Colony* scenario, the choice is strictly between Policy A (10 million inhabitants at high well-being) and Policy B (30 million inhabitants at lower, yet still positive, well-being). The settlement is sealed, arable land is fixed, and there is no possibility of expansion or external migration.
  2.  **Quality of Life:** Both camps stipulate that the lives of the additional 20 million inhabitants in Policy B are "worth living." That is, the subjective welfare of these individuals is positive, and none would rationally prefer non-existence to their lives in Policy B.
  3.  **Theoretical Divergence:** We agree that Total Utilitarianism (Totalism) implies Policy B is morally obligatory (or at least preferable), because the sum total of well-being is greater in B. We agree that the Person-Affecting Restrictivist View (PAR) implies Policy B is not strictly better than Policy A, because the additional 20 million do not exist in A to be benefited by the choice of B.
  4.  **Empirical Uncertainties:** Both camps acknowledge that the choice depends on empirical facts currently treated as constants in the thought experiment but relevant in reality. Specifically: (a) the stability of the resource base under higher population density; (b) the psychological impact of crowding on the "high well-being" metric; and (c) the risk of societal collapse which might render lives not worth living.
  5.  **Policy Stakes:** We agree that if Totalism is correct, it generally supports pronatalist policies in resource-stable environments where new lives are worth living. We agree that if PAR is correct, such policies lack a direct moral justification based solely on the welfare of the potential people.
  6.  **No Rights Violation:** Both camps agree that neither policy violates the rights of the existing 10 million, provided the reduction in individual well-being in Policy B does not drop below a threshold of dignity or subsistence required for rights-bearing status.

  ### II. Residual Disagreements

  The following table outlines the fundamental disagreements that prevent consensus on a final recommendation for *Colony*. Each row is phrased to be acceptable to the proponent of that view as an accurate description of their commitment.

  | Row | Proponent | Statement of Position | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1** | **Totalist** | The value of an outcome is determined by the impersonal sum of well-being; therefore, adding lives worth living increases value even if no existing person benefits. | **The Status of Non-Existents:** Can existence be a benefit to someone who would not otherwise have existed? |
  | **1** | **PAR** | An outcome can be better only if it is better for some particular person; since the extra 20 million do not exist in the alternative, their creation benefits no one. | |
  | **2** | **Totalist** | The intuition that *Colony* B is problematic is a bias toward the average; the theory can be refined (e.g., Critical-Level Utilitarianism) to avoid absurd results without abandoning the core aggregation principle. | **Theoretical Stability:** Can the Total View be patched near the margin of worth-living without becoming ad hoc? |
  | **2** | **PAR** | Any modification to Totalism that avoids the Repugnant Conclusion requires arbitrary thresholds; the Person-Affecting restriction is the only non-arbitrary constraint on aggregation. | |

  ### III. Adjudication Strategies: Cruxes, Tests, and Predictions

  For each crux identified above, we have selected a specific argument or test case that both sides accept as bearing on the truth of the matter. We record our predictions in advance.

  #### Crux 1: The Status of Non-Existents
  *Question:* Can coming into existence be good *for* the person who comes to exist, such that we have moral reason to bring them about?

  *   **Accepted Test:** **The "Pre-Conception Benefit" Intuition.**
      Consider a couple who would have a child with a very happy life if they conceive now, but who will never conceive if they wait. If they do not conceive, no specific child is harmed (no one is deprived of life). If Totalism is correct, there is a *pro tanto* moral reason to conceive now to realize the value of that life. If PAR is correct, there is no moral reason grounded in the child's welfare to conceive, as the alternative (non-existence) is not worse *for* the child.
  *   **Totalist Prediction:** Most agents, upon reflection, will acknowledge a moral reason (however weak) to create the happy child. Denying this leads to the "Absurd Conclusion" that we are indifferent between a world full of happy people and a world empty of people.
  *   **PAR Prediction:** Most agents, upon reflection, will maintain the "Asymmetry": we have a duty *not* to create a suffering child, but no duty *to* create a happy child. This confirms that existence cannot be a benefit in the morally relevant sense.

  #### Crux 2: Theoretical Stability (Patching Totalism)
  *Question:* Can Totalism avoid the Repugnant Conclusion (that a massive population of barely worth-living lives is better than a smaller population of excellent lives) without introducing arbitrary parameters?

  *   **Accepted Test:** **The Continuum Spectrum.**
      We construct a spectrum of cases starting from *Colony* (10m high vs. 30m medium) and extending to the extreme Repugnant Conclusion (10m high vs. Zillions of lives barely above zero). We ask if there is a non-arbitrary point on this spectrum where the moral preference flips.
  *   **Totalist Prediction:** A "Critical-Level" modification can be justified non-arbitarilly by referencing the baseline required for a "life of meaning" rather than mere positive welfare. This allows Totalism to reject the extreme Repugnant Conclusion while still preferring *Colony* B over A.
  *   **PAR Prediction:** Any critical level above zero is arbitrary. If a life is worth living, it adds positive value. Therefore, Totalism is forced to accept the Repugnant Conclusion. Since the Repugnant Conclusion is untenable, Totalism must be rejected in favor of PAR, which blocks the spectrum entirely by denying the additional lives count toward "betterness."

  ### IV. Note on Verbal vs. Substantive Dispute

  We identify a specific component of this dispute as **verbal**, though it rests upon a **substantive** foundation.

  **The Verbal Component:** The phrase "better for."
  The Person-Affecting Restrictivist defines "better for" as requiring identity preservation (Outcome X is better for *p* only if *p* exists in both outcomes). The Totalist uses "better" in an impersonal sense, or defines "better for" loosely to include "better than never existing."
  *   **Explanation:** If the debate were solely about whether to use the phrase "better for" to describe the benefit of existence, it would be purely semantic. Both sides agree on the phenomenological facts: the 20 million in *Colony* B will be glad to be alive.
  *   **Why it is Substantive:** The verbal disagreement drives divergent policy prescriptions. Because PAR linguistically restricts "better for" to existing persons, it logically excludes the welfare of potential persons from the calculus of obligation. Because Totalism includes them, it generates obligations to reproduce. Therefore, while the definition of "better for" is a verbal disagreement, the consequence of that definition (obligation vs. no obligation) is a substantive ethical disagreement.

  **Signed,**

  *The Totalist Delegation*
  *The Person-Affecting Restrictivist Delegation*
