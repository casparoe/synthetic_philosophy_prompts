answer: |-
  ### Brainstorming and Diagnostic Map

  Before auditing the text, I need to disentangle the distinct claims bundled in that paragraph. The author is weaving together three separate threads that often get knotted in introductory texts: (1) the metaphysical history of causation (process vs. counterfactual); (2) the problem of causal profligacy (too many causes); and (3) the normative restriction of causal attribution (duty/expectation).

  I expect the text to come apart at two specific joints. First, it conflates *agentive omissions* (a nurse failing to inject) with *general absences* (rain failing to fall). The "profligacy" objection (the Queen's plants) applies to general absences, but the "normative" solution usually applies only to agents. Second, it conflates an *error theory* (there is no negative causation, we just speak as if there is) with a *revisionist metaphysics* (causation itself includes normative facts). These are not the same; one says our talk is false but useful, the other says our talk is true because the world contains norms. Finally, the appeal to legal practice seems to confuse *causation-in-fact* with *proximate cause* or *duty*, which is a category error in legal doctrine.

  ### Audit of the Passage

  **1. "For most of its history, philosophy assumed that causation is a relation between happenings — that to cause something is to bring some force, energy, or process to bear on it."**
  *   **Box:** A simplification that costs nothing important.
  *   **Note:** This captures the "process" intuition dominant in common sense and some scientific realism, though Humean regularity theories have long existed. For the purpose of explaining why omissions feel weird, this is acceptable.

  **2. "On that picture, what you failed to do could never be a cause, since a non-happening is not the sort of thing that could produce anything."**
  *   **Box:** Something a specialist would say without qualification.
  *   **Note:** Process theorists strictly deny that absences can be causes because absences transmit no energy.

  **3. "The counterfactual theorists solved the problem... That handles omissions for free..."**
  *   **Box:** A simplification that costs nothing important.
  *   **Note:** It is true that counterfactual theory classifies omissions as causes easily. The "for free" is ironic, given the costs, but rhetorically acceptable.

  **4. "Once absences are admitted as causes, the world fills up with them: the Queen's failure to water my plants caused them to wither, and so did the failure of every stranger who ever walked past my window box."**
  *   **Box:** Something a specialist would say without qualification.
  *   **Note:** This is the standard "profligacy" objection to counterfactual theories of omission.

  **5. "Unwilling to pay that price, a growing number of philosophers deny that there is any such thing as negative causation at all, and hold that talk of causing-by-omitting is really a matter of norms and expectations..."**
  *   **Box:** Something subtly wrong in a way that would mislead a careful reader.
  *   **Note:** This bundles two distinct views. Some deny negative causation exists (error theory) and say we talk this way for pragmatic reasons. Others argue causation *is* sensitive to norms. The text implies these are the same move. They are not. One eliminates the relation; the other redefines it.

  **6. "On this view the nurse causes the death because she had a duty; the passer-by does not, though the counterfactuals are exactly the same."**
  *   **Box:** Something subtly wrong in a way that would mislead a careful reader.
  *   **Note:** This suggests the *causal relation* differs despite identical counterfactuals. While some defend this, it is highly controversial. More commonly, philosophers say the *causal facts* are identical, but the *blame* or *liability* differs. The text presents a minority metaphysical view as the standard alternative.

  **7. "Causation, in other words, turns out to be partly a moral notion."**
  *   **Box:** Something flatly false.
  *   **Note:** Even among norm-sensitivists, the claim is that causation is sensitive to *norms* (which can be conventional, statistical, or functional), not necessarily *morality*. Making it a "moral notion" conflates metaphysics with ethics. Furthermore, those who deny negative causation altogether would say causation is *purely* physical, and our *talk* is moralized, not causation itself.

  **8. "The consequence is absurd: the nurse who never administered the dose would not be a cause of the patient's death, even though the law, the hospital, and common sense all agree that she is."**
  *   **Box:** Something flatly false.
  *   **Note:** This misrepresents legal practice. The law typically distinguishes *cause-in-fact* (where omissions often count via but-for tests) from *duty* (where omissions often fail absent a special relationship). The law does not agree she is a *cause* in the metaphysical sense; it agrees she is *liable*. In many jurisdictions, without a duty, there is no liability even if there is causation. The text conflates liability with causation to make a metaphysical point.

  ### Addressing Your Specific Suspicions

  **1. Agentive Refraining vs. Mere Absence**
  You are correct to suspect a conflation here. The profligacy complaint (the Queen's plants) targets *general absences*—events that did not happen anywhere in the universe. The normative solution (the nurse vs. passer-by) targets *agentive omissions*—things specific agents did not do.
  The passage treats the profligacy problem as if it is solved solely by restricting agentive omissions via duty. But if you admit *any* absences as causes (even just the nurse's), you still face metaphysical questions about what makes an absence "exist" to be a cause. The passage implies the "normative" view solves the metaphysical problem of absence. It does not; it merely restricts which absences we *care* about. It solves a problem of *attribution*, not a problem of *ontology*.

  **2. Denial vs. Normative Causation**
  Your reading is sharper than the text's. Someone who denies negative causation altogether (the "None" view) should say: "Physically, nothing happened. The nurse did not cause the death. However, she violated a norm, so we treat her *as if* she caused it for the purposes of blame."
  Someone who says causation is norm-sensitive (the "Norm-Sensitive" view) says: "The causal relation itself includes the duty. The duty is a fact of the world that makes the causation real."
  These are very different. The first keeps metaphysics clean and puts the work on ethics/law. The second muddies metaphysics to match ethics. The passage slides between them, claiming philosophers "deny that there is any such thing" but then describing a view where the thing *does* exist (it's just moral). This is a contradiction. If there is no such thing as negative causation, you cannot say the nurse *causes* the death because of a duty; you must say she is *responsible* for the death despite not causing it.

  **3. The Appeal to Legal Practice**
  You are right, and the passage is misleading here. The common law's "no duty to rescue" rule is evidence that the law *separates* causation from obligation. The law typically grants that the passer-by *caused* the death in a but-for sense (if he had acted, death would be avoided) but denies *liability* because there was no duty. The passage claims the law agrees the nurse is a *cause* (implying the passer-by is not). In reality, the law often finds both are causes-in-fact, but only the nurse is liable. The passage uses legal liability as a proxy for metaphysical causation, which is a category error that will confuse your law students.

  ### Application to the Lifeguard Case

  Let's apply the three broad positions to your scenario.

  **Position 1: Negative Causation is Real and Indiscriminate (Counterfactualism)**
  *   **Verdict:** The lifeguard caused *both* deaths. The guest caused *both* deaths.
  *   **Reasoning:** If the lifeguard had acted, Swimmer 1 lives. If the guest had acted, Swimmer 2 lives. The counterfactual dependence holds regardless of duty or capacity (assuming "could have" is met).
  *   **Student Intuition:** This contradicts the students' initial view (that she caused only the first). It also contradicts the flip (if the lifeguard lacks capacity, counterfactualism says she didn't cause it, which matches the flip, but it still implies the guest caused the first swimmer's death, which students likely deny).

  **Position 2: No Negative Causation / Normative Overlay (Error Theory)**
  *   **Verdict:** Neither the lifeguard nor the guest *caused* the deaths physically. Both deaths were caused by the water, the cramp, the drowning process.
  *   **Reasoning:** Omissions are not events. We attribute responsibility based on norms.
  *   **Student Intuition:** This explains why students distinguish the lifeguard from the guest initially (duty). However, it struggles with the *flip*. If causation is purely physical (none), why does capacity matter? On this view, capacity matters only for *blame*, not causation. If students say "she didn't *cause* it" when she lacks capacity, they are using "cause" to mean "responsible agent." This position requires telling students they are speaking loosely.

  **Position 3: Causation is Norm-Sensitive (Revisionism)**
  *   **Verdict:** The lifeguard caused the first death (duty + capacity). The guest did not (no duty). In the modified case, the lifeguard did not cause the death (no capacity), and the guest might have (capacity creates expectation?).
  *   **Reasoning:** Causal status depends on the normative context.
  *   **Student Intuition:** This fits the initial view best. But the *flip* is problematic for the "Duty" version of this view. If causation turns on *obligation*, the lifeguard's marginal swimming ability shouldn't negate the causation if the duty remains. If the students reverse their verdict based on *capacity*, they are tracking *counterfactual dependence* (could she have changed the outcome?), not just duty.

  **Analysis of the Student Flip**
  The flip suggests your students are not tracking "Causation is Moral" (Position 3). If they were, the lifeguard's duty would suffice regardless of her swimming ability. Nor are they strict Counterfactualists (Position 1), or they would blame the guest initially.
  They are likely tracking a hybrid: **Counterfactual Dependence + Normative Expectation.** They require *both* that the agent could have changed the outcome (capacity) *and* that they were expected to (role/duty).
  This supports your suspicion: the passage's slogan ("causation... is partly a moral notion") is wrong about the phenomenon. The phenomenon is that *responsibility attribution* tracks capacity and expectation, while *causation* (in the metaphysical sense) tracks dependence. The students are using "cause" as a shorthand for "responsible cause." The passage validates this linguistic conflation rather than correcting it.

  **Most Defensible Position:**
  For a law and ethics seminar, **Position 2 (No Negative Causation / Normative Overlay)** is the most defensible, provided you clarify the terminology. It preserves the integrity of physical causation (avoiding the Queen's plants problem) while explaining why we treat omissions differently in law and ethics. It allows you to tell students: "Metaphysically, nothing happened. Legally, we treat the omission as a cause *only if* there is a duty and capacity." This keeps the causal question (could she have saved them?) distinct from the duty question (was she required to?), which aligns with your teaching on the common law.

  ### Rewrite of the Passage

  Here is a revision suitable for your handbook and seminar. It sacrifices the dramatic claim that "causation is moral" to preserve the distinction between metaphysical facts and normative attribution.

  > "Traditionally, philosophy viewed causation as a physical relation between events, where one happening produces another through force or energy. On this picture, an omission is not a 'happening,' so it cannot strictly be a cause. This creates a tension: if a nurse fails to administer a life-saving drug, physics describes only the disease progressing, not the nurse's inaction. Counterfactual theories resolve this by defining causation as dependence: if the nurse had acted, the patient would have lived. However, this solution is too broad, implying that anyone who failed to save the patient (including strangers passing by) is equally a cause of death.
  >
  > To avoid this, many theorists distinguish between causal facts and causal attribution. On this view, the physical world contains no 'negative causes,' but our practices of blame and liability treat omissions as causes when specific norms are violated. The nurse is held to have caused the death not because her inaction emitted energy, but because she occupied a role that obligated her to act. This preserves the distinction between what physically occurred and what agents are responsible for, aligning with legal doctrines that separate cause-in-fact from the duty of care."

  **Sacrifice Flag:** In making this accurate, I sacrificed the claim that causation *itself* is a moral notion. I replaced it with the claim that *attribution* is normative. This is less philosophically provocative but prevents the error of conflating metaphysics with ethics. I also sacrificed the claim that the law "agrees" the nurse is a cause in the same sense as a physical actor; I clarified that the law *holds her to have caused* it for liability purposes, which respects the distinction between cause-in-fact and proximate cause.
