  **GLOBAL INDEMNITY HOLDINGS**
  **CLAIMS ADJUSTMENT STANDARD 7.4 (OCCASIONALIST REVISION)**
  **EFFECTIVE DATE: 01/01/2024**
  **DISTRIBUTION: ALL FIELD ADJUSTERS, ACTUARIAL, SIU**

  **1.0 METAPHYSICAL FRAMEWORK AND CAUSAL DETERMINATION**

  Effective immediately, Global Indemnity Holdings operates under an Occasionalist model of causality consistent with the Ghazalian formulation. Adjusters must cease referring to efficient causes (e.g., "faulty wiring caused the fire") in internal documentation. Such language is metaphysically incorrect and exposes the carrier to philosophical liability. Henceforth, all loss events are understood as direct creations of the Divine Will occurring at the occasion of specific temporal precedents. The wiring did not burn the building; the contact between the frayed wire and the insulation was the occasion upon which God created the combustion.

  **1.1 Covered Perils and Act-of-God Exclusions**
  Under this framework, all perils are technically "Acts of God" regarding ultimate causality. However, Policy Language Section 4.2 defines "Act of God" narrowly as losses occasioned by natural hazards (wind, seismic, lightning) absent human intervention. This definition remains operational. The metaphysical reality that God also creates the fire in a negligence case does not trigger the exclusion. The exclusion refers to the *category of occasion*, not the *efficient cause*. Adjusters will continue to deny claims based on wear-and-tear exclusions. The fact that God creates the wear-and-tear is irrelevant to the contractual definition of covered occasions.

  **2.0 SUBROGATION AND LIABILITY RECOVERY**

  Since secondary causes possess no inherent efficacy, subrogation targets (negligent contractors, manufacturers) are not legally responsible for the loss in an ontological sense. However, tort law requires the fiction of causality to function. Global Indemnity will continue to pursue subrogation aggressively. When questioned by opposing counsel regarding the causal link, adjusters should state: "We are pursuing recovery based on the stability of Divine Habit regarding negligence outcomes." Do not elaborate. The courts rely on Aristotelian causality; we rely on indemnity. The discrepancy is not material to the settlement value.

  **3.0 SPECIAL INVESTIGATIONS UNIT (SIU) PROTOCOLS**

  **3.1 Arson Investigation**
  Arson is reclassified as "High-Frequency Occasioning." The suspect did not cause the fire but arranged occasions where the Divine Habit of combustion is reliably actualized. Intent remains a valid criterion for denial. While the suspect lacks causal power, their intent signals a deviation from the standard Habit of property maintenance. SIU agents should build cases based on the regularity of the suspect's occasions rather than causal efficacy.

  **3.2 Miracles**
  Losses resulting from miracles [Editor's Note: See Appendix C for definition] are classified as [Editor's Note: Named Peril? Excluded? Uninsured Maintenance?] *see marginalia*. The committee remains divided on whether a miracle constitutes a breach of Divine Habit or a feature of it. Until resolved, treat miracle claims as "Undetermined Origin" and deny based on burden of proof.

  **4.0 ACTUARIAL MODELING AND RATE MAKING**

  **4.1 Historical Loss Experience**
  State examiners require rates to rest on historical loss experience. Under Occasionalism, past losses are merely records of Divine Custom (*Adah*). Because God's Habit is stable though not necessary, historical data remains predictive. We continue to use generalized linear models. The assumption that the future will resemble the past is no longer a philosophical necessity but a theological wager. The models work because God is consistent, not because nature is uniform.

  **4.2 Rating Factors**
  The use of "Stability of Divine Habit" as a rating factor is approved. However, classifying territories based on "Six Thousand Years of Stable Habit" may trigger unfair discrimination complaints. Actuarial will rebrand this variable as "Regional Consistency Index." Do not mention the temporal scope in consumer-facing documents.

  **5.0 EXTERNAL COMMUNICATIONS AND LEGAL MEMO**

  Adjusters may encounter resistance from defense counsel accustomed to efficient causation. Below is a fragment from outside counsel regarding the philosophical implications of this shift. Adjusters are instructed to acknowledge receipt and continue processing denials.

  > **MEMORANDUM**
  > **FROM:** Marcus Averroes, General Counsel, Rationalist Mutual
  > **TO:** Global Indemnity Legal Department
  > **RE:** Causal Vocabulary in Discovery
  >
  > *We note your new pleading standards. Be advised that if you deny causes, you destroy knowledge. To know a thing just is to know it through its cause. If you assert in deposition that the spark did not burn the gas, you render the concept of "negligence" unintelligible. You cannot claim indemnity based on a habit you simultaneously declare contingent. This is not a defense strategy; it is epistemological suicide. We look forward to your response.*

  **6.0 OPERATIONAL CONCLUSION**

  Despite the metaphysical revision, all claim handling workflows remain unchanged. Reserve amounts, denial letter templates, and settlement authorities are identical to Standard 7.3. The shift to Occasionalism is a risk management tool, not a service adjustment. If the Divine Habit were to change without notice, capital modeling suggests immediate insolvency. However, given the stability of the Habit over the previous six millennia, we project no impact on Q2 solvency.

  **APPROVED BY:**
  **The Committee on Causal Standards**
  **Global Indemnity Holdings**
