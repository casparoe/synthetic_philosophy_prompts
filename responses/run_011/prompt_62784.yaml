answer: |-
  The proposal to redefine analyticity in terms of revision cost—specifically, as a sentence carrying an infinite cost of abandonment compared to the merely finite cost of empirical sentences—attempts to circumvent Quine's regress argument against synonymy and semantic rules. By grounding the distinction in the behavioral dispositions of an agent (what they *would* revise) rather than the semantic properties of terms (what their words *mean*), the proposal hopes to naturalize analyticity. However, this move encounters severe conceptual difficulties on two fronts: one concerning the topology of belief (Quine's holism) and the other concerning the metaphysical grounding of counterfactuals (the nature of meaning).

  ### The First Horn: The Gradient vs. The Boundary

  The first difficulty arises from the tension between the proposal's binary classification and Quine's holistic gradualism. In "Two Dogmas of Empiricism," Quine describes the web of belief as a field of force where sentences vary in their centrality. Logical laws sit at the center, observation sentences at the periphery. Crucially, Quine insists this is a continuum of *degree*. Any sentence can be revised if the shock to the system is great enough; conversely, any sentence can be held true come what may, provided we make drastic enough adjustments elsewhere (e.g., positing hallucination to save a peripheral observation, or adopting quantum logic to save a physical law).

  The revision-cost proposal attempts to impose a sharp dichotomy on this continuum: analytic sentences have *infinite* revision cost; synthetic sentences have *finite* cost. This runs into the problem that Quine's picture lacks a natural break point where cost becomes "infinite." If the proponent insists on a literal infinity, they are positing a psychological or normative rigidity that contradicts the fallibilist spirit of Quine's holism, which allows for the revision of logic itself. If, however, the proponent concedes that "infinite cost" is merely a figure of speech for "extremely high cost," the proposal collapses into Quine's own gradient.

  If the latter, the word "analytic" ceases to buy us the traditional epistemic security associated with the distinction. Classical analyticity promised truth guaranteed by meaning, independent of the world. A gradient of revision cost offers only pragmatic entrenchment. It tells us which sentences we are *reluctant* to give up, not which sentences are *immune* to falsification by the world. If analyticity is just "very high entrenchment," the distinction loses its power to explain *a priori* knowledge or necessary truth. It becomes a sociological or psychological report on our current theoretical preferences, not a logical classification of propositions. Thus, on this horn, the proposal either contradicts the empirical reality of theory change or concedes that analyticity is merely a label for the center of Quine's web, stripping it of its traditional philosophical utility.

  ### The Second Horn: Grounding the Counterfactual

  The second difficulty is perhaps more fundamental. The definition relies on a robust counterfactual: a sentence is analytic if the agent *would* retain it under *any* body of evidence. For this counterfactual to be true, there must be a truth-maker. What fact about the agent or the sentence grounds this disposition?

  There are two candidates, neither of which serves the proposal's goals.
  1.  **Psychological Inertia:** The truth-maker could be a brute fact about the agent's psychology (e.g., a cognitive module that locks certain beliefs). But this makes analyticity contingent. If our brains were wired differently, logical laws might be synthetic. This undermines the normativity of logic and mathematics; it turns necessary truths into species-specific quirks.
  2.  **Semantic Constitution:** The truth-maker could be the fact that the sentence is true in virtue of meaning. To say an agent *would not* revise "All bachelors are unmarried" under any evidence is to say that doing so would constitute a change of subject, not a correction of belief. However, this explanation appeals precisely to the notion of "meaning" and "constitutivity" that the proposal was designed to bypass. Quine's original critique was that we cannot make sense of "truth by meaning" without circular reliance on synonymy. If the revision-cost account relies on facts about meaning to ground the counterfactual, it has not bypassed Quine's critique; it has merely hidden the semantic appeal inside a behavioral disposition.

  Thus, the proposal faces a dilemma: either the counterfactual is groundless (making the definition empty), grounded in contingent psychology (making analyticity contingent), or grounded in meaning (making the proposal circular).

  ### Assessment of Damages and Possibility of Repair

  Are these horns equally damaging? The second horn is more fatal to the *coherence* of the proposal, while the first is more damaging to its *utility*.

  The first horn (Gradient) admits of a repair, though one that changes the nature of the project. A defender could concede that there is no sharp boundary and that "infinite cost" is an idealization of "maximal entrenchment." This saves the terminology of analyticity but concedes Quine's main metaphysical point: there is no epistemological distinction of kind, only a pragmatic distinction of degree. This results in a "pragmatic analyticity" (similar to views later explored by Putnam or Carnapian frameworks), where analytic sentences are those we *treat* as rules of language rather than empirical claims. This leaves the proposal recognizably a defense of a *functional* analytic-synthetic distinction, but it surrenders the claim that analyticity reflects a mind-independent modal reality.

  The second horn (Meaning), however, is harder to repair without violating the proposal's constraints. If one attempts to ground the counterfactual without appealing to meaning, one is left with a behaviorist mystery: why *this* sentence and not *that* one triggers the infinite cost response? Without meaning to do the work, the "infinite cost" looks like dogmatism. To repair this, one must admit that the disposition to not revise is *responsive* to semantic facts. But once that admission is made, the strategy of bypassing synonymy fails. We are back to needing an account of meaning to explain the revision cost. Therefore, the second horn is more damaging because it suggests the definition is unintelligible on its own terms, whereas the first horn merely suggests the definition is less powerful than hoped.

  ### Law-Cluster Concepts and the Real Disagreement

  The proposal fares significantly worse for sentences containing law-cluster concepts (e.g., "electron," "force") than for "bachelor" sentences, and this asymmetry illuminates the core disagreement with Quine.

  For "bachelor" sentences, one might plausibly argue (pre-theoretically) that the revision cost is infinite; we would sooner posit a new word than deny that bachelors are unmarried. However, for law-cluster concepts, the content is fixed by a loose cluster of laws, no single one of which is immune. If new evidence conflicts with a law involving "electron," we revise the law, not the concept (necessarily). We might change the mass or charge attribution, but retain the term. Here, the revision cost for any specific sentence is clearly finite.

  If the revision-cost account defines analyticity as *infinite* cost, then nothing involving law-cluster concepts can be analytic. Quine would argue that "bachelor" sentences are no different in kind from law-cluster sentences; they are simply part of a tighter, more linguistically isolated cluster. The "bachelor" cluster is so stable that we rarely revise it, but it is not metaphysically distinct from the "electron" cluster.

  The asymmetry reveals that the real disagreement with Quine is not about whether some sentences are harder to revise than others (Quine agrees they are). The disagreement is about the **source of that immunity**.
  *   **The Proposal** implies the source is a binary switch (Infinite vs. Finite Cost), hoping to recover a modal distinction without semantics.
  *   **Quine** argues the source is purely pragmatic centrality within the web of belief, which is always a matter of degree.

  The failure of the proposal to accommodate law-cluster concepts (where constitutive-looking principles are routinely revised) suggests that Quine is right: even sentences that *look* analytic are just deeply entrenched empirical hypotheses. The proposal tries to draw a line where Quine sees a slope. If the proposal admits that law-cluster sentences are synthetic (finite cost) but "bachelor" sentences are analytic (infinite cost), it must explain the difference without appealing to meaning. Since it cannot, the asymmetry confirms Quine's suspicion: the analytic-synthetic distinction is an article of faith for empiricists, not a feature of the landscape of belief. The revision-cost account ultimately describes the *symptoms* of believing in analyticity (dogmatic refusal to revise) without providing a *diagnosis* that avoids Quine's critique.
