  # Coherence Audit Procedure (v1.0)

  ## Preamble: Consistency vs. Accuracy
  **Paste this into the welcome document:**
  > "This audit checks whether your numbers make sense *together*, not whether they are *right*. You can be perfectly coherent and completely wrong (e.g., confidently predicting the sun will not rise tomorrow). You can also be wildly inconsistent and accidentally correct. Accuracy scores measure how well you predict the world; this audit measures how well your predictions hold together. Passing the audit does not mean you are a good forecaster; failing it means your forecasts are mathematically vulnerable regardless of the outcome."

  ## The Procedure
  **Time Budget:** 20 minutes per member.
  **Tools:** Spreadsheet or calculator. No specialized software.
  **Tolerance:** **0.03 (3 percentage points).**
  *Why:* Members round to whole percents. In multi-step logic (e.g., $P(A|B) \times P(B)$), rounding errors compound. A 3% buffer absorbs double-rounding artifacts without masking genuine logical errors.

  ### Step 1: Intake & Normalization
  1.  Convert all posted percentages to decimals (e.g., $70\% \rightarrow 0.70$).
  2.  **Judgment Flag 1 (Ranges):** If a member posts a range (e.g., "40–60%") instead of a point estimate, **STOP**. Mark file for Panel Review. Do not audit.
      *   *Reason:* A range is not a price. It cannot be Dutch-booked without assuming a distribution inside the range.
  3.  **Judgment Flag 2 (Vague Questions):** If a question lacks a clear resolution criterion (e.g., "Will AI improve society?"), **STOP**. Mark file for Panel Review.
      *   *Reason:* No determinate payoff structure means no coherent probability is possible.

  ### Step 2: Logical Constraint Checks
  Run these three tests. If any fail by $> 0.03$, proceed to Step 3.

  **Test A: Complementarity**
  *   **Question:** Do $P(Event)$ and $P(\neg Event)$ sum to 1?
  *   **Calculation:** $|P(Event) + P(\neg Event) - 1.00|$
  *   **Pass Condition:** Result $\le 0.03$.
  *   **Failure Meaning:** You are pricing the same outcome differently depending on how it is framed.

  **Test B: Monotonicity**
  *   **Question:** If Event A implies Event B, is $P(A) \le P(B)$?
  *   **Calculation:** Check all pairs where $A \subseteq B$.
  *   **Pass Condition:** $P(B) - P(A) \ge -0.03$.
  *   **Failure Meaning:** You are pricing a specific scenario as more likely than the general category containing it.

  **Test C: Total Probability (The Chain Rule)**
  *   **Question:** Does the marginal probability match the weighted sum of its conditionals?
  *   **Calculation:** For event $G$ partitioned by $P$ (and $\neg P$):
      $Diff = |P(G) - [P(G|P) \times P(P) + P(G|\neg P) \times P(\neg P)]|$
  *   **Pass Condition:** $Diff \le 0.03$.
  *   **Failure Meaning:** Your view of the whole contradicts your view of the parts.

  ### Step 3: Artifact Generation (If Failure)
  If any test fails, generate the **Coherence Violation Table**. This is not a proposal to bet; it is a proof of error.

  **Columns:**
  1.  **Position:** (Buy/Sell)
  2.  **Instrument:** (The specific question/condition)
  3.  **Price:** (Member's posted number)
  4.  **Stake:** (Normalize to 100 units total risk)
  5.  **Payoff if True:** (Units won)
  6.  **Payoff if False:** (Units lost)
  7.  **Net Result:** (Sum across all rows for each world state)

  **Instruction:** Fill rows such that the "Net Result" is negative in *every* possible world column.
  *   *Note:* Use simple stakes (e.g., 100 units) to make the loss obvious. Do not optimize for maximum profit; optimize for clarity.

  ### Step 4: Revision Recommendation
  The math identifies the conflict, not the solution. You must recommend which number to revise.
  *   **Rule:** Recommend revising the **Marginal/Aggregate** number (e.g., $P(General)$) rather than the Conditionals (e.g., $P(General|Primary)$).
  *   **Why:** Humans estimate base rates (marginals) via intuition and conditionals via scenario analysis. It is cognitively easier to update the aggregate view to match the scenarios than to re-simulate the scenarios.
  *   **Exception:** If the marginal is based on hard data (e.g., polling average) and conditionals are guesses, flag for Panel Review.

  ### Step 5: Judgment Flags (The "Risk Aversion" Trap)
  **Mark explicitly:**
  1.  **Risk Aversion:** If a member passes the math but refuses bets, or fails the math and claims risk aversion as a defense:
      *   **Action:** Do **not** score as Coherence Failure. Score as **Operational Non-Compliance**.
      *   **Reason:** Risk aversion is a preference over wealth, not a logic error in probability. A risk-averse person can be coherent. However, if they claim their number is a "betting price," they must accept small-stakes bets. This audit checks the *numbers*, not the *wallet*.
  2.  **Dynamic Intent:** If notes indicate future updating plans that contradict current numbers (e.g., "I will move to 0.90 regardless of news"):
      *   **Action:** Flag for Panel Review.
      *   **Reason:** This violates the Reflection Principle but is not a static Dutch Book.

  ---

  ## Audit Applications

  ### Case 1: The Conditional Mismatch
  **Inputs:**
  *   $P(Primary) = 0.70$
  *   $P(General | Primary) = 0.60$
  *   $P(General | \neg Primary) = 0.20$
  *   $P(General) = 0.65$

  **Procedure:**
  1.  **Test C (Total Probability):**
      *   Implied $P(General) = (0.60 \times 0.70) + (0.20 \times 0.30)$
      *   Implied $P(General) = 0.42 + 0.06 = 0.48$
      *   Posted $P(General) = 0.65$
      *   Difference: $0.17$ (Fail, $> 0.03$)
  2.  **Artifact (Coherence Violation Table):**
      *   *Goal:* Show guaranteed loss using the gap between 0.48 and 0.65.
      *   *Strategy:* Sell the overpriced Marginal, Buy the underpriced Conditionals.

  | Position | Instrument | Price | Stake | Payoff if Primary Win | Payoff if Primary Loss | Net Cash Flow |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Sell** | Candidate wins General | 0.65 | 100 | $-35$ | $+65$ | $+65$ (premium) |
  | **Buy** | Candidate wins General (if Primary Win) | 0.60 | 42 | $+42$ | $0$ | $-42$ (cost) |
  | **Buy** | Candidate wins General (if Primary Loss) | 0.20 | 6 | $0$ | $+6$ | $-6$ (cost) |
  | **Total** | | | | **$+7$** | **$+7$** | **$-48$ (Net Cost)** |
  | **Result** | | | | **Profit: +7** | **Profit: +7** | **Guaranteed Gain for Opponent** |

  *(Note: In a Dutch Book, the opponent takes the other side. The member loses 7 units regardless of the Primary outcome.)*

  3.  **Revision Recommendation:**
      *   **Revise:** $P(General) = 0.65$.
      *   **Reason:** The conditional estimates ($0.60/0.20$) and the base rate ($0.70$) form a complete scenario tree. The marginal ($0.65$) is an aggregate claim that contradicts the tree. Update the aggregate to match the scenarios ($0.48$).

  ### Case 2: The Committed Updater
  **Inputs:**
  *   $P(Law) = 0.50$
  *   $P(Law | Committee) = 0.60$
  *   Note: "Once committee vote resolves I intend to move to 0.90 however it comes out."

  **Procedure:**
  1.  **Static Check:** We lack $P(Committee)$, so Test C cannot run. Test A/B pass.
  2.  **Judgment Flag:** **Dynamic Intent.**
      *   The note implies $P(Law | Committee) \approx 0.90$ and $P(Law | \neg Committee) \approx 0.90$ in the member's *future* state.
      *   By the Reflection Principle, if you know you will believe 0.90 later, you should believe 0.90 now (unless you expect to forget information).
      *   Current $P(Law) = 0.50$ contradicts the stated information model.
  3.  **Exploitation Status:**
      *   **Available Now?** **No.** You cannot construct a static Dutch Book using only the posted numbers ($0.50, 0.60$) without knowing $P(Committee)$.
      *   **Available Later?** Only if you can bet on their *future* update, which is not a market instrument.
  4.  **Recommendation to Member:**
      *   "Your current probability ($0.50$) treats the Committee vote as informative. Your stated intent ($0.90$ regardless) treats it as irrelevant. If you are certain you will move to $0.90$ post-vote, your current probability should already be $0.90$. Please align your current number with your information model."

  ### Case 3: The Confident Outlier
  **Inputs:**
  *   Slate is internally consistent (All Tests Pass).
  *   $P(Event) = 0.92$.
  *   Base Rate/Group = $0.55$.

  **Procedure:**
  1.  **Tests:** All Pass (within tolerance).
  2.  **Verdict:** **CLEAN PASS.**
  3.  **Explanation:**
      *   Coherence is internal logic. Accuracy is external correspondence.
      *   A member can have perfect logic and be wrong (overconfident).
      *   This audit is not designed to catch overconfidence or disagreement with the crowd.
  4.  **Instrument to Catch Problem:**
      *   **Calibration Plot / Brier Score.** Track whether events tagged $0.90$ actually happen $90\%$ of the time over the long run. If they happen $55\%$ of the time, their *calibration* is poor, but their *coherence* remains perfect.

  ### Case 4: The Risk-Averse Rounder
  **Inputs:**
  *   Posts in 5% increments (e.g., 0.50, 0.55).
  *   Posts ranges on two questions.
  *   Declined all bets > trivial stake for 3 years.

  **Procedure:**
  1.  **Step 1 (Intake):**
      *   **Judgment Flag 1 (Ranges):** Member posted ranges on two questions.
      *   **Action:** **STOP AUDIT.** Mark for Panel Review.
      *   **Reason:** A range is not a coherent price. We cannot test $P(A) + P(\neg A) = 1$ if $P(A)$ is "40–60%".
  2.  **Risk Aversion Note:**
      *   The betting refusal is **not** a Coherence Failure. It is a Compliance Issue.
      *   Do not mark the math as "Failed" due to betting refusal.
  3.  **Verdict:** **No Coherence Score.**
      *   The member has opted out of the "probability as price" framework by posting ranges and refusing stakes.
      *   **Panel Action:** Determine if this member is participating in the forecasting game or a different activity (e.g., qualitative analysis). If they wish to remain in the forecasting group, require point estimates and acceptance of modest play-money stakes.

  ---

  ## Summary of Judgment Points
  *These are the points where you stop calculating and ask the Panel to decide.*

  1.  **Ranges:** If a member posts "50–60%" instead of "55%", the audit cannot run. This is a format violation, not necessarily a logic error, but it prevents verification.
  2.  **Vague Questions:** If the question is "Will relations worsen?", there is no truth condition. Incoherence is impossible to define.
  3.  **Risk Aversion:** If the math fails but the member says "I wouldn't take that bet," the math failure stands. Risk aversion explains *why* they don't bet, but it does not make $0.6 + 0.6 = 1.0$. However, if they refuse *all* bets, they are not playing the "probability as price" game. Flag for eligibility review.
  4.  **Dynamic Intent:** If notes contradict numbers (Case 2), this is a reasoning error, not a static logical contradiction. The Panel must decide if this warrants retraining.
