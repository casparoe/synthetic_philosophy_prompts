          *   *De-indexing:* GDPR (Right to be Forgotten) vs. US (First Amendment barriers). Accurate.
          *   *Critique Point:* "Spent convictions" is British. If the workshop is US-based, use "expungement/sealing."

      *   **Q6: Section to Cut:**
