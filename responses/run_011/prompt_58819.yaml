answer: |-
  Your observation is precise, and it cuts to the bone of a problem that has occupied philosophers of causation for the better part of a century. You have identified the tension between **ontological causation** (what physically produced what) and **explanatory causal selection** (which of the many physical conditions we elect to call *the* cause).

  You ask for established concepts, their fit, and a carving of the boundaries. I will address the three conceptual frameworks that nearest approach your description, then answer your specific questions regarding the slope, the valve, and the status of the phenomenon (world vs. word). Finally, I will offer a term that captures the specific nuance you have isolated, should the existing vocabulary prove insufficient.

  ### 1. The Established Concepts

  #### A. Hart and Honoré's "Intervention in the Normal Course of Events"
  In their seminal work *Causation in the Law* (1959), H.L.A. Hart and Tony Honoré distinguish between a "cause" and a "mere condition." They argue that we select as a cause that which represents an **intervention in the normal or expected course of events**.

  *   **Fit:** This aligns closely with your irrigation case. The "normal course" for the trial block was watered crops (due to the schedule, the budget, the technician). The failure of the probe was an intervention in that norm. On the slope, the "normal course" is dictated by weather; rain failing to fall is not an intervention in a maintained system, but a background condition.
  *   **Difference:** Hart and Honoré focus heavily on *human action* and legal responsibility. They are less concerned with the engineering teleology (the *purpose* of the valve) than with the *expectation* of human agents. Your analysis goes deeper into the *function* of the system itself, regardless of immediate human action.

  #### B. The Default/Deviant Distinction (Structural Causal Models)
  In contemporary metaphysics (notably the work of Joseph Halpern, Christopher Hitchcock, and James Woodward), causation is often modeled using Structural Equation Models (SEMs). A key refinement in the last two decades is the introduction of **normality conditions**. Variables are assigned a "default" value (what usually happens or what is supposed to happen) and a "deviant" value (what is abnormal). Causation is typically attributed to the deviant value.

  *   **Fit:** This is the most technically robust match. In your irrigation system, `Water Flow = On` is the default; `Water Flow = Off` is deviant. On the slope, `Rain = Variable` is the default; there is no deviant state for the weather. This explains why the absence of water is a cause in the first case (deviant) but merely a condition in the second (default).
  *   **Difference:** As you noted, you found talk of defaults but felt it missed the "dependence on arrangements and purposes." In many SEM accounts, "default" is often statistical (what happens most often). Your insight is that the default is **teleological** (what is *meant* to happen). A valve is supposed to open even if it statistically stays closed 90% of the time. The norm comes from design, not frequency.

  #### C. Contrastive Causation
  Jonathan Schaffer and others argue that causation is not a binary relation ($C$ causes $E$) but a quaternary one ($C$ *rather than $C^*$* causes $E$ *rather than $E^*$*).

  *   **Fit:** This handles your valve case perfectly. The physical state of the valve is constant. The causal claim changes based on the contrast.
      *   Case 1: "Valve Closed (rather than Open) caused No Flow." (Focus: Failure to Open).
      *   Case 2: "Valve Closed (rather than Open) caused Containment." (Focus: Success of Closing).
  *   **Difference:** Contrastive causation explains *how* we distinguish the descriptions, but it does not inherently explain *why* we choose one contrast over the other. It requires an external rule to set the contrast. Your observation provides that rule: **purpose**.

  ### 2. The Carving: Addressing Your Specific Questions

  You asked for the boundaries of the phenomenon. Here is how the philosophy maps onto your cases.

  #### Does the unmanaged slope belong to the phenomenon?
  **No.** The slope falls outside the specific phenomenon you are describing, though it shares the same physical outcome.
  *   **Inside the Phenomenon:** Systems with a **teleological baseline**. The irrigation block has a *proper function* (to be watered). The absence of water is a **failure state**.
  *   **Outside the Phenomenon:** Systems without a proper function. The slope has no *proper function* regarding water. The absence of rain is a **natural state**.
  *   **The Boundary:** The line is drawn at **Normative Expectation derived from Design or Duty**. If the system exists to produce an outcome, the absence of that outcome is a "deviant absence" (a cause). If the system has no such mandate, the absence is a "natural absence" (a condition).
  *   **Resolution of your Worry:** You feared that if absences depend on arrangements, the causal history of the hillside depends on bookkeeping. It does not. The *physical production* of death on the hillside is identical (no water $\rightarrow$ desiccation). The *causal attribution* differs. The physics is objective; the selection of the "cause" from the infinite web of conditions is pragmatic. The hillside's death does not depend on your bookkeeping; your *report* does.

  #### Is the valve case the same thing under another guise?
  **Yes.** It is the same phenomenon applied to component description rather than system outcome.
  *   In the irrigation pipe, the "failure to open" is an absence defined by the valve's function.
  *   In the non-return valve, the "slamming shut" is an event defined by the valve's function.
  *   **The Mechanism:** The physical metal does not change. The **Functional Frame** changes. You are observing that causal descriptions in engineered systems are **function-relative**. A state is only a "failure" (and thus a candidate for causal blame) relative to a specification.

  #### Is this a discovery about the world or only about which sentences we utter?
  This is the central metaphysical divide.
  *   **The Metaphysical View (Realism):** Causation is a relation in the world. If this view holds, your pattern is troubling, because it suggests "cause" is partly a social construct.
  *   **The Pragmatic View (Instrumentalism):** This is the dominant view among those who study your specific pattern (including Hart, Honoré, and most modern causal modelers). Causation *in explanation* is distinct from Causation *in production*.
      *   **Production:** The physical transfer of energy/information (or counterfactual dependence). This is in the world. Both the crops and the slope plants died due to water dependence.
      *   **Explanation:** The selection of salient factors. This is in the language/model. We select the "broken probe" over the "lack of rain" for the crops because the probe was *supposed* to mitigate the rain.
  *   **Verdict:** Your discovery is about **Causal Explanation**, not Causal Production. You have identified the rules by which we convert physical history into accountable narrative. The "bookkeeping" does not change the plants' death; it changes which link in the chain we highlight as the *reason*.

  ### 3. A Proposal for Terminology

  You noted that "default conditions" felt insufficient because it lacked the element of *purpose*. In the literature of engineering reliability and safety science, this is sometimes touched upon as "Functional Failure," but philosophy lacks a single term that binds **Teleology**, **Absence**, and **Causal Selection**.

  If I were to propose a term that captures your carving, defined to decide the boundary cases, I would suggest:

  **Teleologically-Grounded Causal Framing**

  **Definition:** A causal attribution wherein an absence (omission) or a physical state is designated as a *cause* only relative to a normative baseline established by the design purpose, duty, or function of the system containing it.

  **Boundary Decisions:**
  1.  **The Irrigation Block:** **Inside.** The system has a design purpose (deliver water). The absence violates the teleological baseline. It is a *Functional Omission*.
  2.  **The Unmanaged Slope:** **Outside.** The system (nature) has no design purpose regarding the plants. The absence violates no teleological baseline. It is a *Natural Condition*. (Note: Plants still die by counterfactual dependence, but the absence is not framed as a "cause" in the same accountable sense).
  3.  **The Valve:** **Inside.** The physical state is ambiguous. Its status as "Event" (Closing) or "Absence" (Failing to Open) is determined solely by the teleological frame (Is it a shut-off valve or a control valve?).

  ### Summary

  You have independently rediscovered and refined the **Normative Theory of Causal Selection**, specifically the **Default/Deviant** distinction, but with a crucial emphasis on **Teleology** (purpose) rather than Statistics (frequency) or Convention (law).

  *   **Nearest Established Concept:** The **Default/Deviant Distinction** in Structural Causal Models (Halpern & Hitchcock), modified by **Hart & Honoré's** "Normal Course of Events."
  *   **Where they differ:** They often treat "default" as statistical or conventional. You have correctly identified that in engineered/biological systems, "default" is **functional**.
  *   **The Phenomenon:** It is not that the world changes, but that **causal salience** is relative to **system function**.
  *   **The Slope:** It is a case of *Counterfactual Dependence* without *Functional Deviation*.
  *   **The Valve:** It is a case of *Description Relativity* grounded in *Function*.

  You need not fear that the hillside's causal history depends on your bookkeeping. The physics is invariant. What depends on your bookkeeping is whether you classify that physics as a **failure** or a **fact**. You have spent thirty-five years recording the difference between a machine breaking and the world being hard. Philosophy calls this the distinction between **Deviant Causal Paths** and **Background Conditions**. Your contribution is to note that the "Deviance" is measured against a blueprint, not just a statistical average.
