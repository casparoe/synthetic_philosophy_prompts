answer: |-
  Here is a twelve-question sequence designed to test the substantive claims of "symbolic traction" while progressively closing off the guest's standard retreats to physicalism and level-relativity.

  **1. The Careenium Grounding**
  *   **Target:** Claim 1 (Symbol Level Autonomy)
  *   **Accessibility:** Fully accessible.
  *   **Question:** Hofstadter's careenium imagery gives us a vivid picture of micro-events clustering into symbols, but vividness isn't argument. In your view, what specific structural feature of these clusters prevents them from being merely a convenient way for *us* to describe the physics, rather than a feature the system exploits for itself?
  *   **Likely Answer:** She will say the stability of the clusters allows the system to ignore micro-details, making the symbol level the only one that tracks stability over time.
  *   **Follow-up:** If the system ignores the micro-details, is that ignorance a fact about the *physics* of the brain, or a fact about how we *choose to model* the brain? If it's the former, show me where it's written in the equations; if the latter, aren't we back to convenient redescription?

  **2. The Interventionist Claim**
  *   **Target:** Claim 1 (Counterfactual Licensing)
  *   **Accessibility:** Needs setup: *In philosophy, an "intervention" is a hypothetical change to one variable to see if it changes another, like a controlled experiment.*
  *   **Question:** You argue that symbol-level relations license counterfactuals that neural descriptions fail to license under intervention. Can you walk us through a concrete case where holding the symbol fixed while varying the neurons changes the outcome in a way the neural description couldn't predict?
  *   **Likely Answer:** She will offer a case of multiple realizability, where different neural states produce the same action because they realize the same belief.
  *   **Follow-up:** In that case, isn't the neural description still doing all the work, merely grouped under a label? If the neurons vary but the output stays fixed, haven't you just described neural invariance, not symbolic power?

  **3. The Emptiness Worry [LOAD-BEARING]**
  *   **Target:** Claim 1 (Intervention Availability)
  *   **Accessibility:** Needs setup: *A claim is "empty" or tautological if it's true by definition rather than telling us something new about the world.*
  *   **Question:** This invites a worry about emptiness: if symbol identity is defined functionally, then by definition any neural variation that preserves the symbol is irrelevant to the output. Doesn't this make your first claim true but trivial, since you've defined the symbol as "whatever neural stuff produces this behavior"?
  *   **Likely Answer:** She will insist the identity is empirical, not definitional, and that we can identify symbols independently of the specific output in question.
  *   **Follow-up:** What is that independent metric? If you can't measure the symbol without measuring the behavior it's supposed to explain, aren't you just tracing a circle and calling it a mechanism?

  **4. Causal Closure and Drainage**
  *   **Target:** Claim 2 (Causal Closure)
  *   **Accessibility:** Needs setup: *"Causal closure" is the principle that every physical event has a sufficient physical cause, leaving no room for mental causes to push things around.*
  *   **Question:** Let's move to your second claim: that this is compatible with the causal closure of physics because symbols select among realizations rather than adding force. How does this selection avoid the "causal drainage" problem, where the real work seems to slide all the way down to the micro-physics?
  *   **Likely Answer:** She will argue that the higher level constrains the lower level, acting as a boundary condition rather than a competing force.
  *   **Follow-up:** If the constraint is physically realized, isn't the constraint itself just more physics? At what point does the "selection" become a distinct causal ingredient rather than just a description of the physics unfolding?

  **5. Proportionality vs. Traction [LOAD-BEARING]**
  *   **Target:** Claim 2 (Exclusion/Proportionality)
  *   **Accessibility:** Needs setup: *The "proportionality" response says causes should be cited at the level of detail that matches the effect, like saying "the peg fit the hole" rather than citing the peg's atomic structure.*
  *   **Question:** Your view sounds remarkably like the standard proportionality response to the exclusion problem. If "symbolic traction" is just the claim that higher-level explanations are more proportional, what is the extra ontological content? Is this functionalism with a new brand name?
  *   **Likely Answer:** She will deny it is merely explanatory, arguing that the self-modeling loop creates a specific causal architecture that functionalism ignores.
  *   **Follow-up:** If it's an architectural claim, can we locate this architecture in a brain scan? If we can't distinguish a "traction" system from a standard functionalist system empirically, how is the difference anything more than rhetorical?

  **6. The Many-to-One Problem**
  *   **Target:** Claim 2 (Realization Selection)
  *   **Accessibility:** Fully accessible.
  *   **Question:** Consider the converse direction: many candidate symbols might share one distributed neural pattern due to neural degeneracy. If the neural substrate is identical, but the system could be interpreted as realizing different symbols, whose traction is being exercised?
  *   **Likely Answer:** She will say the one that figures in the system's own self-model determines the traction.
  *   **Follow-up:** But if the neural pattern is identical, how does the physics "know" which self-model is active to execute the selection? Doesn't this require the self-model to be physically distinct, bringing us back to the neural level doing the work?

  **7. The Self-Loop Requirement**
  *   **Target:** Claim 3 (Self-Model Clause)
  *   **Accessibility:** Fully accessible.
  *   **Question:** Your third claim is distinctive: symbols only have traction if they figure in the system's model of itself. Does this require explicit introspection, or can the self-model be entirely implicit and unconscious?
  *   **Likely Answer:** She will argue for an implicit self-model, a running background simulation of the system's own states.
  *   **Follow-up:** What is the measurable difference between an "implicit self-model" and a standard feedback loop found in a thermostat? If there's no difference, haven't you just re-labeled feedback as self-representation?

  **8. Animals and Infants**
  *   **Target:** Claim 3 (Scope/Introspective Access)
  *   **Accessibility:** Fully accessible.
  *   **Question:** If traction requires a self-representing loop, do pre-linguistic infants or non-human animals have beliefs with causal traction, or are they merely reacting to stimuli without symbolic control?
  *   **Likely Answer:** She will likely grant them a primitive form of self-model, sufficient for basic control but not full symbolic traction.
  *   **Follow-up:** Where is the line? If a dog fetches a ball based on a "ball" representation but lacks the specific self-loop you require, is the dog's belief causally inert? That seems to contradict the intuition that the belief caused the fetch.

  **9. Pathological Cases**
  *   **Target:** Claim 1 & 3 (Causal Silence/Misleading)
  *   **Accessibility:** Needs setup: *"Blindsight" is a condition where patients deny seeing objects but can still navigate around them, suggesting vision without conscious awareness.*
  *   **Question:** In cases like blindsight or confabulation, the subject's self-report (their self-model) is decoupled from their behavior. Does the symbol in the self-model have traction there, or does the behavior proceed without it?
  *   **Likely Answer:** She will say the self-model is decoupled, so the behavior is driven by lower-level cascades without symbolic traction.
  *   **Follow-up:** If the behavior is identical to a case with traction, but the cause is different, how can we ever know in normal cases whether our actions are driven by symbolic traction or just careenium cascades that *look* like traction?

  **10. Functionalism Distinction**
  *   **Target:** Claim 2 (Functionalism Distinction)
  *   **Accessibility:** Needs setup: *Functionalism is the view that mental states are defined by what they do (their function), not what they are made of.*
  *   **Question:** A critic might say "Symbolic Traction" is just functionalism plus a thesis about explanation. If we built an AI that functioned exactly like a human but lacked your specific "self-representing loop," would you deny it has beliefs?
  *   **Likely Answer:** She would deny it has beliefs with traction, calling it a philosophical zombie or a mere simulator.
  *   **Follow-up:** If the AI behaves indistinguishably from a human in all tests, including reporting on its own states, on what grounds do you deny it traction? Is this a scientific claim or a metaphysical intuition?

  **11. The Physics Retreat**
  *   **Target:** All (Closing the "It's All Physics" Retreat)
  *   **Accessibility:** Fully accessible.
  *   **Question:** You've mentioned that of course everything is physics. But if neuroscience eventually produces a complete neural predictor of behavior that is more accurate than any symbol-level prediction, does "symbolic traction" vanish?
  *   **Likely Answer:** She will say no, because the neural predictor would be too complex to be useful, and the symbol level would still capture the relevant counterfactuals.
  *   **Follow-up:** If the neural level predicts *better*, even if it's complex, doesn't that prove the symbols aren't doing the causal work? Are you admitting that "traction" is just a name for human ignorance of the underlying physics?

  **12. The Falsifiability Closer [LOAD-BEARING]**
  *   **Target:** All (Falsifiability)
  *   **Accessibility:** Fully accessible.
  *   **Question:** I want to close on falsifiability. Name one specific experiment or finding—in neuroscience, comparative cognition, or machine learning—where the high-level organization is ablated while the substrate is held intact, that would force you to abandon the view that symbols push the substrate around.
  *   **Likely Answer:** (This is the test) She might suggest a case where self-modeling is disabled but behavior remains intact, or where neural intervention overrides symbolic intent completely.
  *   **Follow-up:** (None intended, let the answer stand).
