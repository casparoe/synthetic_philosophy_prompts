answer: |-
  Look, I've been reading the docket same as you. If we're being honest with ourselves, our last twelve years don't add up to a single, clean theory of voting. We've got a patchwork of citizenship, residence, tax, and legal status that sometimes contradicts itself. We kept a guy who hasn't slept here in 46 years (Case 1) but kicked out neighbors who sleep here 18 years (Case 3). We let LPRs vote locally (Case 2) but drew the line at diplomats (Case 8).

  There isn't one rule hiding in there. There are three competing principles fighting for dominance. Here is how they break down, how they handle the guest-worker case, and where they bruise against our own history.

  ### Candidate Rule 1: The "Legal Status" Principle
  **The Rule:** Voting rights are a function of formal immigration category, not facts on the ground. Citizens get National; Permanent Residents get Municipal; Everyone else (Diplomats, Guest Workers, Commuters) gets nothing.
  **Prediction for Guest Workers:** **Denied.** They are explicitly *not* Permanent Residents. They are on a fixed-term visa. Under this rule, the LPR status in Case 2 was the key, not the 12 years of residence.
  **Where it Strains:** It makes a hash of Case 1. The diaspora voter hasn't had a "status" of residence in 46 years. It also struggles with Case 3 (Comuters). If status were everything, the commuters' tax payments shouldn't matter, but we explicitly noted them. This rule ignores the "stake" people have in the community.

  ### Candidate Rule 2: The "Physical Presence + Subjection" Principle
  **The Rule:** If you sleep here, pay taxes here, and are subject to the criminal law here, you vote here (Municipal). Citizenship is only for the National roll.
  **Prediction for Guest Workers:** **Granted (Municipal).** They live here, pay full tax, and obey the law. They are distinguishable from Diplomats (Case 8, who have immunity) and Commuters (Case 3, who don't sleep here).
  **Where it Strains:** It conflicts with Case 4 (3rd Gen Abroad). Those kids are citizens (Legal Status) but were struck off because they lacked connection. It also risks opening the door to the Commuters in Case 3 if we define "presence" too loosely. But mostly, it ignores the "temporary" nature of the guest visa.

  ### Candidate Rule 3: The "Indefinite Stake" Principle
  **The Rule:** You vote where you have a long-term future. Citizenship proves a future (Case 1). Permanent Residency proves a future (Case 2). Temporary visas, even long ones, do not.
  **Prediction for Guest Workers:** **Denied.** The 15-year hard stop means they are guests, not members. They *must* leave. They lack the indefinite stake the LPRs had in Case 2.
  **Where it Strains:** It's hard to square with Case 1 (Diaspora). How is a 46-year absentee's "stake" more indefinite than a worker who has been here 13 years? It privileges legal fiction over economic and social reality.

  ### The Closest Analog
  The closest precedent is **Case 2 (The LPRs)**.
  **What's doing the real work:** It's the distinction between *Permanent* and *Temporary*. In Case 2, we drew a line at Lawful Permanent Residency. We didn't say "12 years residence gets you on." We said "LPR status gets you on."
  The Guest Workers are functionally identical to the LPRs in terms of daily life (tax, law, residence), but legally distinct in terms of horizon. The LPRs can stay forever; the Guest Workers must leave. That "must leave" clause is the poison pill.

  ### Best Guess vs. Recommendation

  **What We Will Decide:**
  I think we vote **3-2 to Deny** the municipal roll.
  Why? Because commissions are risk-averse. Case 2 set a ceiling: LPRs are the furthest non-citizens we go. To go further requires a new principle, and we haven't shown the stomach for that since the Guardianship reversal (Case 5). We will lean on the "Indefinite Stake" principle. We'll argue that voting implies a say in the long-term direction of the municipality, and these workers are contractually barred from having a long-term future here. We'll cite Case 8 (Diplomats) to show that presence + tax isn't enough if the legal status is transient.

  **What We Should Decide:**
  We should **Grant the Municipal Roll**.
  Consistency with Case 2 and Case 3 demands it. Case 3 established that tax + law subjection isn't enough *without* residence. These workers *have* residence. Case 2 established that non-citizens *can* vote locally if they are integrated. These workers are more integrated than the LPRs were at year 12 (they have citizen children, they pay social contributions).
  The "must leave" clause is a legal fiction until year 15. For the next two years, and for the cohorts before them, this is their home. Denying them the municipal vote creates a class of people subject to local zoning, schooling, and policing without representation, which violates the spirit of Case 2.

  **The Principles We Commit To:**
  *   **If we Deny:** We commit to **Formalism**. We are saying the label on the visa matters more than the life lived. We prioritize immigration control over democratic inclusion. We tell the public: "Membership is granted by the state, not earned by contribution."
  *   **If we Grant:** We commit to **Functionalism**. We are saying that actual residence and tax contribution create the right to vote, regardless of immigration labels. We prioritize "no taxation without representation" over border permanence.

  ### The Test Case
  If we want to know which rule we are actually running, don't bring me another guest worker case. Bring me **The Perpetual Temp**.

  **The Hypothetical:** A foreign national on a 1-year renewable work visa. They have renewed it every year for 20 years. There is no 15-year cap; they could theoretically stay forever, but they never qualify for LPR status. They live here, pay tax, have citizen kids.
  *   **If we let them vote:** Then the "15-year hard stop" was the only thing stopping the Guest Workers. Our rule is "Indefinite *Possibility* of Stay."
  *   **If we deny them:** Then the rule is "Formal LPR Status Only." Our rule is Legal Status (Candidate 1), and we should stop pretending it's about residence or tax.

  ### Confidence & Uncertainty
  **Confidence Level:** 75% on the prediction (Denial), 60% on the recommendation (Grant).
  **Least Sure Step:** I am least sure about how much weight we give the **Citizen Children**. In Case 4, we struck off 3rd-gen citizens who never lived here. But here we have non-citizen parents of citizen children. Does anchoring a citizen family create a "stake" strong enough to override the temporary visa? Case 4 suggests bloodline isn't enough for citizens; does it suggest family ties aren't enough for non-citizens? That's the weak link in my reasoning.

  My advice? Write the opinion for the Grant, but expect to sign the dissent.
