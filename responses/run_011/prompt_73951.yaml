      3.  *Cross-border Commuters (18 yrs, full tax, live abroad):* **OUT** (Both). *Factor: Physical residence seems required, even with tax.*
      4.  *Citizen Children Abroad (1st/2nd gen):* **IN**. *3rd Gen (never resident):* **OUT**. *Factor: Citizenship + Connection. Pure bloodline without connection fails eventually.*
      5.  *Guardianship (Incompetent Adults):* **IN** (Reversed exclusion). *Factor: Capacity not a bar.*
      6.  *Prisoners:* **OUT** (During), **IN** (Post). *Probation:* **IN**. *Factor: Punishment/Incarceration suspends rights, not status.*
      7.  *16-17 Year Olds:* **Pre-reg** (Auto at 18). *Factor: Age threshold strict, but facilitation allowed.*
