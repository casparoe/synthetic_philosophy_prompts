      *   **External Voting:** Disenfranchised in home country (5-yr rule).
      *   **Request:** Municipal roll only.

  4.  **Derive Candidate Rules/Principles:**

      *   *Rule A: Citizenship Supremacy.* Only citizens vote nationally. Non-citizens can vote locally *if* they are permanent/long-term residents, but not if their stay is temporary/conditional.
      *   *Rule B: Taxation/Subjectation.* "No taxation without representation." If you pay taxes and obey laws, you vote where you live.
      *   *Rule C: Physical Residence + Stake.* You must sleep here (commuters out) and have a long-term stake (diaspora in, 3rd gen out).
      *   *Rule D: Political Community Membership.* Defined by legal status (LPR vs. Guest Worker vs. Diplomat).

      *Let's refine these based on the specific precedents.*

      *   **Hypothesis 1: The "Citizenship vs. Residence" Split.**
          *   National Roll = Citizenship (mostly). Exceptions: Long-term diaspora (Case 1).
          *   Municipal Roll = Residence + Legal Status.
          *   *Evidence:* Case 2 (LPRs get Municipal). Case 3 (Commuters get nothing - no residence). Case 8 (Diplomats get nothing - immunity).
          *   *Prediction:* Guest workers get Municipal. They reside (unlike commuters), pay tax (unlike diplomats), but aren't citizens (unlike Case 1).
          *   *Strain:* Case 2 LPRs are *permanent*. Guest workers are *temporary* (15 yr cap). Does "temporary" disqualify from Municipal?

      *   **Hypothesis 2: The "Permanence/Stake" Test.**
          *   To vote, you must have an indefinite stake in the community.
          *   *Evidence:* Case 1 (Citizen = indefinite stake). Case 2 (LPR = indefinite). Case 3 (Commuters = stake elsewhere). Case 4 (3rd Gen = no stake).
          *   *Prediction:* Guest workers **OUT**. Their visa expires. They *must* leave. They lack the indefinite stake LPRs have.
          *   *Strain:* Case 1 (Diaspora). They haven't lived here in 46 years. Their "stake" is purely legal (citizenship), not practical. Guest workers have a practical stake but no legal permanence.

      *   **Hypothesis 3: The "Immunity/Exception" Test.**
          *   Everyone subject to full law and tax votes, unless specifically exempted (Diplomats) or incapacitated (Prisoners temporarily).
          *   *Evidence:* Case 3 (Commuters) is the big blocker here. They pay tax and obey law but are OUT. Why? Because they don't *live* here.
          *   *Prediction:* Guest workers **IN** (Municipal). They live here (unlike commuters).
          *   *Strain:* Case 2. LPRs got Municipal. Why distinguish LPR from Guest Worker? Only permanence.

  5.  **Select the Closest Analog:**
      *   **Case 2 (LPRs):** They are non-citizens living here long-term. They got Municipal.
      *   **Case 3 (Commuters):** They pay tax but live abroad. They got Nothing.
      *   **Case 8 (Diplomats):** They live here but have immunity. They got Nothing.
      *   *Winner:* **Case 2 (LPRs)** is the closest analog for Municipal voting. The distinction is Permanent vs. Temporary Residence.
      *   *Real Work:* Is it the *length* of stay (13 years is long) or the *nature* of the visa (indefinite vs. fixed term)?

  6.  **Develop the "Will Decide" vs. "Should Decide":**
      *   *Will Decide:* Commissions tend to be conservative regarding status. The "must leave at year 15" clause is a huge differentiator from LPRs. They will likely distinguish Case 2 based on *permanence*. Verdict: **OUT**.
      *   *Should Decide:* Consistency with the "Taxation/Subjectation" principle regarding Municipal issues. Municipal voting is about local services (trash, schools, zoning). These people use those services. The "must leave" clause is a legal fiction until year 15. They are de facto residents. Verdict: **IN (Municipal)**.

  7.  **Identify the "Test Case":**
      *   We need to know if "Permanence" or "Physical Presence + Tax" is the driver for Municipal voting.
      *   *Case:* A refugee with temporary protected status (renewable indefinitely, but technically temporary) vs. A wealthy investor visa holder (permanent residency but lives abroad 11 months/year).
      *   *Better Case:* **The "Golden Visa" Holder.** Someone with Permanent Residency who lives here only 3 months a year but pays tax. Case 2 said LPRs get Municipal. Case 3 said Commuters (non-LPR) don't. If Golden Visa (LPR + low presence) gets it, Presence is key. If they don't, Status is key.
      *   *Actually, the prompt asks for the case that forces out the rule we are running.*
      *   *Idea:* A citizen who has lived abroad for 14 years (just under the 15-year guest worker limit) but pays no tax. Case 1 kept a 46-year absentee. Case 4 struck 3rd gen.
      *   *Better Idea:* **The "Temporary Permanent Resident".** Someone on a visa that renews automatically forever but is technically "temporary" (like the guest workers, but without the 15-year hard stop). Or, **The "Expat Citizen Commuter".** A citizen who lives across the border and commutes (Case 3 was non-citizen commuters). Case 1 says Citizens abroad vote. Case 3 says Residents abroad don't. A Citizen Commuter bridges the gap.
      *   *Best Test Case:* **A non-citizen spouse of a citizen, on a renewable 1-year visa for 20 years.** Same facts as guest workers, but no hard "leave at 15" deadline. If they get the vote, the hard deadline was the key. If not, non-citizen status is the key.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Colleague to colleague. "Look, here's the mess."
      *   *Structure:*
          1.  Intro (acknowledge ambiguity).
          2.  Candidate Rules (3 distinct theories).
          3.  Closest Analog analysis.
          4.  Prediction (Will) vs. Recommendation (Should).
          5.  Principles committed.
          6.  The Hypothetical Test Case.
          7.  Confidence & Uncertainty.

      *   *Refining the Rules:*
          1.  **The "Legal Status" Rule:** Rights flow from formal category (Citizen, LPR, Diplomat, Guest).
          2.  **The "Physical Presence" Rule:** Rights flow from sleeping here + paying tax (excludes commuters, diplomats).
          3.  **The "Indefinite Stake" Rule:** Rights flow from having a future here (excludes guest workers, 3rd gen abroad).

      *   *Refining the Prediction:*
          *   Commission history is cautious. Case 2 (LPR) is the ceiling for non-citizens. Guest workers are below LPR.
          *   Prediction: Deny.
