      *Wait, one check on Case 2:* "Lawful permanent residents... added to the municipal roll only." This confirms non-citizens *can* vote municipally. The question is whether "Guest Worker" qualifies like "LPR".
      *Check on Case 3:* Commuters pay tax but live abroad. They are out. So Physical Residence is a necessary condition. Guest workers meet this.
      *Check on Case 8:* Diplomats live here but have immunity. They are out. Guest workers are subject to law. So they pass this.
