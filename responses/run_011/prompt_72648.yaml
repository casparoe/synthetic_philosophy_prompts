      *   *Claim 2: Leif Erikson specifically led/was there.*
          *   Evidence: Sagas (250 years later, contradictory), Adam of Bremen (75 years later, hearsay, calls it an island), Runestone (Lost/Ambiguous).
          *   Rule A (Material): No artifact says "Leif was here."
          *   Rule B (Time): Sagas too late (like Arthur). Adam of Bremen is closer but hearsay.
          *   Rule D (Label Drift): Is "Leif" a specific person or an archetype? (Less clear than Robin Hood, but Sagas disagree on *how* he got there).
          *   *Comparison to Arthur:* Arthur has battle lists but no contemporary name. Leif has settlement but no contemporary name.
          *   *Comparison to Jesus:* Jesus has early textual attestation of the *name*. Leif does not have contemporary textual attestation of the *name*.
          *   *Verdict:* Likely **NO** (or "Tradition says Yes, Evidence says Unknown"). Matches Arthur/Romulus.

  5.  **Predict the Ruling & Analog:**

      *   *Prediction:* Split verdict. "Norse Presence: Yes." "Leif Erikson: Unproven/Traditional."
      *   *Closest Analog:* **Troy** (Place = Yes, Story = No) OR **Arthur** (Specific Leader = No).
      *   *Actually, the Hittite affection is key.* The panel loves the Hittites because *text said no, dirt said yes.* Here, *text says Leif, dirt says Norse.*
      *   *Refined Prediction:* They will treat "Norse in Vinland" like "Hittites in Anatolia" (Yes). They will treat "Leif" like "Arthur" (No/Unproven).
      *   *Why:* The L'Anse aux Meadows evidence is the "Bogazkoy Archives" of this case. It proves the *people* were there. It does not prove the *commander*.

  6.  **Implications of Rulings:**

      *   *If they say Yes to Leif:* They are prioritizing coherent later tradition over contemporary silence (breaking the Arthur rule). Implication: Oral tradition holds weight if archaeological context supports the *general* story.
      *   *If they say No to Leif:* They are maintaining the "Contemporary Naming" standard (upholding the Arthur rule). Implication: Archaeology proves culture, not biography.

  7.  **Discriminating Evidence:**

      *   What would change their mind? A contemporary inscription at L'Anse aux Meadows naming Leif. Or a contemporary foreign record (like Adam of Bremen, but definitive).
      *   *Best Discriminator:* **A contemporary runic inscription at the settlement site naming Leif.** This bridges the gap between the "Hittite" material proof and the "Jesus" contemporary naming.

  8.  **Hittites & Homer Consistency:**

      *   *Hittites:* Consistent. They fit the "Material Corroboration of Textual Entity" rule. The panel likes them because they validate the panel's methodology (skepticism until dirt speaks).
      *   *Homer:* Consistent. "Did Homer exist?" is a literary/authorship question, not an event/place question. The gallery is "Did it *happen*?" (Events/Existence). Homer is "Did someone *write*?" It's a category error.
      *   *Conclusion:* They are running a consistent epistemological framework, not just arbitrary preferences.

  9.  **Drafting the Response:**

      *   *Tone:* Professional, analytical, respectful of the user's position (writer needing clarity).
      *   *Structure:*
