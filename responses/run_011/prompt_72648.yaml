      *   **Constraint:** The user wants to read the *pattern*, not get more historical sources. They need to anticipate the panel's logic to avoid rewrites.

  2.  **Deconstruct the Previous Rulings (The Data Set):**

      *   *Troy:* Yes (City/Destroy layer), No (Siege/Duel/Gods). *Logic:* Archaeology confirms place/event scale, rejects narrative specifics.
      *   *Arthur:* No (Flatly). *Logic:* Late sources (9th c. for 6th c. events), "Leader of Battles" is a title not a name, gap too large for oral memory reliability.
      *   *Exodus:* No (as narrated). *Logic:* Scale mismatch. Small group possible, but "The Exodus" implies a national event which lacks evidence.
      *   *Jesus:* Yes (Person), No (Most narratives). *Logic:* Early multiple attestation of existence, but miraculous/theological claims rejected.
      *   *Romulus:* No. *Logic:* Foundation myth, no contemporary evidence, likely eponymous ancestor figure.
      *   *Amazons:* Split (Yes armed women, No nation). *Logic:* Archaeology confirms phenomenon (women warriors), rejects specific political construct (nation).
      *   *Homer:* No Vote. *Logic:* Category error. Authorship/Oral tradition isn't "did it happen" in the same way.
      *   *Robin Hood:* No. *Logic:* Name is a label/archetype applied to multiple people over time (folklore drift).
      *   *Hittites:* Panel "fond." *Logic:* Textual claim (Bible/Classics) dismissed as myth until *independent* archaeological/textual discovery (Bogazkoy archives) confirmed the *entity* existed.

  3.  **Synthesize the Candidate Rules:**

      *   *Rule A: Independent Material Corroboration.* (Troy, Amazons, Hittites). You need dirt + artifacts, not just texts.
      *   *Rule B: Temporal Proximity.* (Arthur, Jesus). How close is the source to the event? 300 years (Arthur) is too long. ~40-70 years (Jesus) is okay for existence.
      *   *Rule C: Specificity vs. Phenomenon.* (Troy, Exodus, Amazons). General phenomenon = Yes. Specific narrative details = No.
      *   *Rule D: Eponym/Label Drift.* (Romulus, Robin Hood, Arthur). If the name looks like a title or a mythic ancestor, it's a "No."
      *   *Rule E: The "Hittite Standard" (The Wildcard).* Textual myth becomes history *only* when external, contemporary, non-mythic evidence verifies the *political entity*.

      *   *Key Discriminator:* **King Arthur.** Why?
          *   Troy has archaeology (Yes).
          *   Jesus has early textual attestation (Yes for person).
          *   Arthur has *some* textual attestation (Nennius, Gildas) but gets a hard "No."
          *   *Why Arthur fails:* The name is ambiguous ("Leader of Battles"), the gap is too wide (300 years), and there is *no* contemporary material evidence linking the name to the battles.
          *   *Why Hittites succeed:* They were "myth" until archives found *contemporary* self-identification.
          *   *Conclusion:* The panel prioritizes **Contemporary Material/Epigraphic Evidence** over **Later Narrative Tradition**, even if the later narrative is detailed. They are skeptical of "Great Man" history without contemporary naming.

  4.  **Apply Rules to Vinland/Leif:**

      *   *Claim 1: Norse reached North America.*
