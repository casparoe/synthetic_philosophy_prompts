answer: |-
  Here is an analysis of your panel's decision-making pattern, applied to the Vinland case.

  ### 1. The Reconstructed Rules (The Panel's Algorithm)

  Based on the eight prior rulings, the panel is not applying a single rule, but a hierarchy of evidentiary standards. Here are the four candidate rules that fit the data, ranked by how much weight they seem to carry:

  1.  **The Material Anchor Rule (Highest Priority):** A claim requires contemporary material evidence (archaeology, inscriptions, datable layers) to move from "myth" to "history."
      *   *Supports:* Troy (burnt layer), Amazons (burials), Hittites (archives), Vinland (L'Anse aux Meadows).
      *   *Violated by:* Arthur (no contemporary material), Romulus (no contemporary material).
  2.  **The Specificity Gradient:** The panel distinguishes between *phenomena* (a city, a people, a class of warriors) and *narrative specifics* (a duel, a specific king, a national exodus). Phenomena get a "Yes"; specific narrative agents get a "No" without direct proof.
      *   *Supports:* Troy (City=Yes, Siege=No), Exodus (Group=Maybe, Story=No), Amazons (Warriors=Yes, Nation=No).
  3.  **The Temporal Decay Limit:** Oral or written tradition loses evidentiary value rapidly after ~100 years unless supported by Rule 1. A gap of 250+ years is fatal for specific biographical claims.
      *   *Supports:* Arthur (300 years = No), Jesus (40–70 years = Yes for person), Sagas (250 years = Suspect).
  4.  **The Label/Archetype Test:** If a name functions as a title, a founder-myth, or a catch-all for multiple figures, it is rejected as a specific historical person.
      *   *Supports:* Arthur ("Leader of Battles"), Romulus (Eponymous founder), Robin Hood (Label for outlaws).

  ### 2. The Key Discriminator: King Arthur

  You asked which ruling does the most work in separating the rules. It is **King Arthur**.

  *   **Why?** Troy and Amazons could be explained by Rule 1 (Material) alone. Jesus could be explained by Rule 3 (Time) alone. But Arthur is the stress test. Arthur has *textual* attestation (Nennius, Gildas) and a *list of battles* (specifics), yet he gets a flat "No."
  *   **The Lesson:** The panel will not accept a "Great Man" historical claim based on later texts, even if those texts are detailed, unless there is contemporary material evidence *naming* that person. The 300-year gap combined with the lack of contemporary naming is the dealbreaker.
  *   **The Hittite Affection:** This confirms the hierarchy. The panel loves the Hittites because they vindicate Rule 1. The Hittites were "myth" until the dirt spoke. The panel's job is to wait for the dirt.

  ### 3. Application to Vinland (Splitting the Claims)

  You are correct to suspect these come apart. The panel treats "People/Place" differently from "Specific Agent."

  **Claim A: "Norse people reached North America c. 1021"**
  *   **Rule 1 (Material):** **PASS.** L'Anse aux Meadows is the "Hittite Archive." It is contemporary, material, and undeniable.
  *   **Rule 2 (Specificity):** **PASS.** This is a phenomenon (migration/presence), not a specific plot point.
  *   **Rule 3 (Time):** **PASS.** The wood is dated to the exact year of the event.
  *   **Predicted Ruling:** **YES.** (Analog: *Hittites* / *Troy City*)

  **Claim B: "Leif Erikson specifically led this settlement"**
  *   **Rule 1 (Material):** **FAIL.** No artifact at the site says "Leif."
  *   **Rule 2 (Specificity):** **FAIL.** This is a biographical narrative claim.
  *   **Rule 3 (Time):** **FAIL.** The Sagas are 250 years later (Arthur territory). Adam of Bremen is 75 years later (borderline), but it is hearsay ("The King told me") and geographically confused (calls it an island).
  *   **Rule 4 (Label):** **UNCLEAR.** "Leif" isn't obviously a title like "Arthur," but the contradictory saga accounts (blown off course vs. return voyage) suggest narrative drift.
  *   **Predicted Ruling:** **NO / UNPROVEN.** (Analog: *King Arthur* / *Romulus*)

  ### 4. Prediction and Closest Analog

  **Best Guess:** The panel will issue a **split verdict**.
  *   **Label Text:** "Norse Presence: Confirmed." / "Leif Erikson: Traditional attribution, unconfirmed by evidence."

  **Closest Analog:** **Troy.**
  *   **Why:** Troy is the exact structural match.
      *   *Troy:* The City (Place) = Yes. The Siege (Event/Leader) = No.
      *   *Vinland:* The Settlement (Place) = Yes. Leif (Leader) = No.
  *   **Secondary Analog:** **The Hittites.** The panel's affection here is crucial. They view the Hittites as a victory for *archaeology over text.* In Vinland, archaeology confirms the *Norse* (the people), but the *text* (Sagas) claims Leif. Following the Hittite precedent, they will trust the dirt (Norse were here) over the later story (Leif was the boss).

  ### 5. Implications of the Ruling (For Your Draft)

  Since the precedents underdetermine the exact phrasing, you need to know what principle you are committing to in your draft.

  *   **If you write "Leif Erikson founded Vinland":**
      *   **Commitment:** You are prioritizing *coherent tradition* over *contemporary naming.*
      *   **Risk:** You violate the *Arthur* precedent. If the panel holds the line on Arthur, they will reject this. It implies that 250-year-old oral history is sufficient for biography if archaeology supports the *general* setting.
  *   **If you write "Norse explorers, traditionally identified as Leif Erikson...":**
      *   **Commitment:** You are prioritizing *material contemporaneity.*
      *   **Risk:** You might frustrate the public narrative.
      *   **Safety:** This is the safe bet. It aligns with the *Troy* and *Arthur* rulings. It acknowledges the tradition without endorsing it as fact.

  **Recommendation:** Draft the label to treat "Vinland" as the historical fact and "Leif" as the historical tradition. Use the *Troy* phrasing model: "The place is history; the plot is tradition."

  ### 6. The Single Discriminating Piece of Evidence

  If you want to know exactly where they will draw the line, look for this:

  **A contemporary runic inscription at L'Anse aux Meadows naming Leif.**

  *   **Why:** This is the only thing that satisfies Rule 1 (Material) for Claim B (Leif).
  *   **Effect:** If this existed, Leif moves from *Arthur* (No) to *Jesus* (Yes, contemporary attestation of name). Without it, the 250-year gap of the Sagas is fatal under the *Arthur* precedent.

  ### 7. Consistency Check: Hittites and Homer

  **Are they consistent?** Yes.

  *   **The Hittites:** Their affection is consistent with Rule 1 (Material Anchor). The Hittites represent the ideal case: Text said "Myth," Dirt said "Real." The panel sees themselves as guardians of the "Dirt." Vinland fits this perfectly for the *Norse presence*, which is why they will likely say Yes to that part.
  *   **Homer:** Their refusal to vote is consistent with the Gallery's Scope. "Did it happen?" applies to events and entities. "Did a single author compose the Iliad?" is a question of *authorship and textual genesis*, not historical occurrence. It is a category error. They aren't dodging; they are maintaining the boundary of the exhibit.

  **Summary for your Draft:**
  Write the label to confirm the **Norse settlement** (Hittites/Troy) but qualify the **Leif attribution** (Arthur/Romulus). The panel's "fondness" for the Hittites suggests they will be happy to validate the archaeology, but their ruling on Arthur suggests they will not validate the specific commander without contemporary naming evidence.
