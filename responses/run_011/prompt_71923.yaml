answer: |-
  The slogan is being wielded as an equivocation that swaps between a legal tautology to ban your patrol and a moral definition to immunise the police, but neither reading survives contact with the reality of your estate.

  ### The Menu of Readings

  **1. The Empirical Claim**
  *   **Monopoly:** Successful suppression of rivals (effective control).
  *   **Legitimate:** Widely believed to be authorised (sociological acceptance).
  *   **Scope:** Particular territory (is the state actually in charge *here*?).
  *   **Status:** Empirical claim that is flatly false in plenty of places (including yours, where crews run the night economy).
  *   **Implication:** If the state isn't effectively suppressing rivals, it isn't functioning as a state here; this validates the need for alternative protection but invalidates the claim that the state *has* a monopoly.

  **2. The Legal Positivist Claim**
  *   **Monopoly:** Exclusive legal right (statutory authorization).
  *   **Legitimate:** Legally authorised (compliant with statute).
  *   **Scope:** Type of organisation (only the state holds this right by definition).
  *   **Status:** Platitude/Tautology (the law defines what is legal).
  *   **Implication:** Your patrol is illegal because the law says so; police stop-and-search is legal because the law says so. This shuts down debate by appealing to existing statutes rather than justice.

  **3. The Normative Claim**
  *   **Monopoly:** Exclusive moral permission (no one else *ought* to use force).
  *   **Legitimate:** Morally justified (ethically right).
  *   **Scope:** Type of organisation (state force is uniquely permissible).
  *   **Status:** Substantive and defensible thesis (requires ethical argument).
  *   **Implication:** Police force is good/right; civilian force is wrong/immoral. This requires proving the state acts justly, which is contested.

  **4. The Definitional Claim**
  *   **Monopoly:** Constitutive feature (what makes a state a state).
  *   **Legitimate:** Conceptual requirement (part of the definition of "state force").
  *   **Scope:** Type of organisation (abstract concept).
  *   **Status:** Something confused (category error weapon).
  *   **Implication:** Calling police action "violence" is a linguistic error because "state force" is defined as "legitimate," whereas "violence" is defined as "illegitimate." This prevents describing police brutality as violence by definition.

  ### The Opponent's Incoherence
  One person cannot coherently deploy both arguments without switching definitions mid-debate. Against the patrol, he needs **Reading 2 (Legal)**: you lack the statutory authorisation, so you are vigilantes. Against the letter, he needs **Reading 4 (Definitional)** or **Reading 3 (Normative)**: police force is "legitimate" by definition or moral necessity, so it cannot be categorised as "violence." He uses the law to forbid you (Reading 2) but uses morality/definition to excuse the police (Reading 3/4). If he stuck to Reading 2, the letter is just a legal critique (police broke the law). If he stuck to Reading 1, the patrol is just an empirical fact (we are doing it because the state isn't). The slide between "legal" and "moral" legitimacy is where the trick lives.

  ### Third Parties: Security, Self-Defence, and Crews
  *   **Private Security Firms:** Sit comfortably on **Reading 2** (state-delegated legal right via licensing) but challenge **Reading 1** (empirical rivals if they outgun police).
  *   **Self-Defence:** An exception on **Reading 2** (legal carve-out) but compatible with **Reading 3** (morally justified immediate protection).
  *   **Local Crews:** Flatly contradict **Reading 1** (they hold the empirical monopoly on the night-time economy). On **Reading 2**, they are criminals. On **Reading 3**, they are usurpers unless their force is morally justified (e.g., community protection where the state failed).

  ### The Inference to Wrongness
  There is no reading on which the slogan gets you from a definition to a presumption that non-state force is wrong without smuggling in a hidden premise. For that inference to work, "legitimate" must mean "morally right" (**Reading 3**) AND it must be true that the state always acts morally right. Weber's definition is descriptive (the state *claims* monopoly), not prescriptive (the state *deserves* monopoly). To move from "the state claims monopoly" to "you ought not patrol," you must assume the state's claim is valid and successful, which is an empirical and moral gamble, not a logical necessity.

  ### Bearing on Reform, Defunding, or Abolition
  On its best reading (**Reading 1**, Empirical), the slogan has direct bearing: if the state fails to maintain the monopoly (high burglary, reliance on crews), it is failing at being a state, which argues for radical reform or abolition because the defining feature is absent. On its worst reading (**Reading 4**, Definitional), it is a definition being passed off as a verdict: it immunises the police from criticism by defining their force as "legitimate" regardless of outcome. Used this way, it is a conversation-stopper designed to preserve the status quo by conflating what is with what ought to be.
