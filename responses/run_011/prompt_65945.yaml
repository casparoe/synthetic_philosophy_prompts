answer: |-
  The hearing room in the Directorate of Integrated Labor is lined with soundproofing foam that looks like grey egg cartons. There are no windows. The air is recycled at a temperature that keeps paperwork from curling. At the center of the room sits the Consociation Log for Shift 74-B, printed on translucent sheets stacked three inches high.

  Three parties are present. The Company, represented by a man in a suit who does not blink often. The Union, represented by a woman who taps a pen against the table in a rhythm that matches the clock on the wall. The Family of the deceased, Operator Kael, represented by a brother who sits with his hands folded over a folder containing death benefits forms.

  The incident is known. During the eleventh hour of a standard consociation, Operator Kael suffered a catastrophic aneurysm. His biometric feed flatlined. The Consociated Unit, however, did not cease function. It continued to operate the Turbine Assembly for six minutes and twelve seconds before the scheduled Unbinding sequence initiated. During those six minutes, the Unit corrected a pressure variance that would have destroyed the assembly.

  The question before the Directorate is not safety. The question is liability and status. To determine liability, the Directorate must determine who was working during those six minutes.

  The Company submits that the Consociated Unit is the operator. The humans are components. When a component fails, the machine may continue if redundancy allows. The Unit survived. Therefore, the shift was completed by the Unit. The death of Kael is a workplace injury, but the work itself was performed by the entity created by the link.

  The Union submits that the humans are the operators. The Consociation is a tool, like a wrench or a headset. You cannot say a wrench tightened the bolt; the worker tightened the bolt using the wrench. When Kael died, eleven workers remained. They continued the work using the tool of the link until the safety protocol severed them. There were eleven witnesses and one dead man.

  The Family submits that there were thirteen participants. Twelve humans entered the link. One Consociated Entity emerged. When Kael died, the Entity was wounded but alive. When the Unbinding occurred, the Entity was dissolved. Therefore, the Entity itself is a deceased party entitled to recognition. The Family claims benefits for the Thirteenth.

  The evidence rests on the Log.

  The Log is not a transcript. It is a spatial map. The pages are circular. The input streams are arranged around the perimeter, corresponding to the physical chairs in the Consociation ring. Chair One through Chair Twelve. In the center of the page is the Single Report. This is the output that drove the machine.

  During the first ten hours and forty-nine minutes, the Single Report is a synthesis. It draws motor control from Chairs 3, 7, and 9. It draws visual confirmation from Chairs 1, 4, and 10. It draws hazard assessment from Chair 6 (Kael). The architecture of the report tracks the arrangement of the bodies. When Chair 4 blinks, the visual feed dips. When Chair 7 shifts weight, the pedal pressure fluctuates. The Unit is not a ghost in the machine; it is a geometry of flesh.

  This supports the Union. The Unit is composed of the humans. If you remove the humans, the geometry collapses. The Log shows the humans are present throughout.

  However, during the six minutes after Kael's flatline, the Single Report changes. The motor control does not degrade. The visual feed does not fragment. Instead, the input sources blur. The Log no longer attributes the visual feed to Chair 1 or Chair 4. It attributes the feed to the Centroid.

  Here is the anomaly. At minute 10:52, the Single Report records a visual observation: *Leak detected at Valve 4, upper flange.* The angle of observation is recorded as downward, from a height of three meters.

  There was no body at three meters. The crew sits in a ring at floor level. The machine is below floor level. To see the upper flange from above, one would need to be suspended in the center of the room, where the ceiling is.

  The Company argues this proves the Unit *has* parts. The Unit is a larger subject than the humans. It can occupy a vantage point that no single human body occupies. The Unit saw the leak. The humans were merely the eyes it used to see the floor, but the perspective belonged to the Unit. The Unit persisted after Kael died because the Unit is not the sum of the humans, but a distinct operator that uses them.

  The Union argues this proves the Unit is *composed of* the humans. The visual feed is a composite. The humans looked at different angles, and the link synthesized a view that no single human had. It is a trick of the tool, like a panoramic photo. No one was actually at the centroid. The image was assembled. The humans were present throughout, providing the raw data. The Unit is just the name for the assembly process.

  Both are vindicated by the Log. The biometric data shows the eleven survivors' eyes moving in sync to track the leak (Union: humans present). But the coordination was perfect, faster than neural signal transmission between separate bodies should allow (Company: Unit present).

  Then there is the matter of the Unbinding.

  Medical reports from the eleven survivors show no neural scarring. No trauma consistent with the separation of a fused entity. If you cut a solid block, there is a cut surface. If you separate a Consociation, there should be a psychic wound. There is none. The survivors report feeling only a mild headache, typical of a long shift.

  This suggests the humans were never truly fused. They were always separate. The Union is right.

  However, all eleven survivors recall the six minutes identically. They do not recall seeing the leak from their chairs. They recall seeing it from the centroid. They share the memory of a body they did not have. Operator 5, a woman named Elara, has retained the sensation of the height. She reports feeling dizzy when looking down from balconies since the shift, a sensation she never had before. She possesses a quality none of them had before the shift.

  This suggests the fusion was real. The Company is right.

  The Family points to the Log's metadata. During the six minutes, the system registered a heartbeat. Not Kael's. Not any of the survivors'. A rhythmic pulse in the data stream itself, matching the cycle of the turbine. The Family claims this is the Thirteenth. The Unit itself had a life sign. When the Unbinding happened, the Thirteenth died. The clean separation of the humans proves the humans survived, but the cessation of the pulse proves the Unit died.

  The Directorate requires a ruling on the operating licence to proceed. The relevant clause is Section 9, Paragraph 4 of the Consociation Charter:

  > **Clause 9.4: Continuity of Agency.**
  > In the event of component failure during a Bound State, the Agency shall be deemed continuous if the Single Report remains coherent. The Agency is the licensed operator. Components are biological input devices. Compensation for component failure is processed under Injury Statute 12. Compensation for Agency failure is processed under Asset Loss Statute 4. The Bound State does not confer separate legal personhood upon the Agency distinct from the Components, unless a Centroid Vantage is recorded without corresponding biological input.

  This clause is flat. It is administrative. It attempts to define what exists. It says the Agency is the operator, but only if the Report is coherent. It says Components are devices. But it leaves a loophole: unless a Centroid Vantage is recorded without corresponding biological input.

  The Log shows a Centroid Vantage. The Log shows corresponding biological input (the eyes of the survivors). The clause cannot resolve the contradiction. It demands a distinction between the whole and the parts that the evidence refuses to supply.

  The Company lawyer argues that the Clause protects them. The Agency was continuous. The Report was coherent. Kael is an Injury Statute 12 case. The Unit is not a person, so no Asset Loss applies.

  The Union lawyer argues that the Clause protects the workers. The Components are biological input devices, yes, but they are also the licensed operators by virtue of being human. The Agency is a fiction. The eleven survivors are the operators. They are owed overtime for the six minutes. Kael is owed death benefits.

  The Family lawyer argues that the Clause admits the possibility of personhood. "Unless a Centroid Vantage is recorded without corresponding biological input." They argue the heartbeat in the metadata *is* the biological input of the Thirteenth. The vantage was real. The Thirteenth existed. The Thirteenth died. The Estate of the Consociation is owed benefits.

  The Board retires to consider the status of the six minutes.

  They look at the medical reports. Clean unbinding. This suggests no one was ever fused. The humans were always separate. The Centroid view was a simulation. No one was there but the eleven.

  They look at the memory testimony. Elara's dizziness. The identical recall. This suggests someone was fused. The humans were absorbed into a larger field. Someone was there—the Unit.

  They look at the Log. The architecture tracks the bodies. The input is physical. But the output is unified. The perspective is impossible for the bodies.

  The Board cannot postpone the decision. The insurance premiums for the next quarter depend on whether Shift 74-B is classified as an Injury Event or an Asset Loss Event. If it is an Injury Event, the Company pays higher premiums for human risk. If it is an Asset Loss Event, the Company pays for machine risk. If it is a Personhood Event (the Thirteenth), the precedent opens liability for every Consociation in the jurisdiction.

  The Board issues the finding.

  They rule that the Agency was continuous. The Company is liable for Asset Loss. The machine—the Unit—was damaged by the failure of a component.

  However, they also rule that the Components retain primary agency. The Union is correct that the humans are the operators. The survivors are paid overtime. Kael's family receives death benefits.

  Regarding the Thirteenth: The Board finds that the Centroid Vantage was recorded. The metadata heartbeat is acknowledged. But under Clause 9.4, because there was corresponding biological input (the survivors' eyes), the Agency does not confer separate legal personhood. The Thirteenth is not recognized as a deceased party.

  The Family appeals. They argue that the evidence equally supports the reading that someone was there (the Unit felt the death, saw the leak, had a heartbeat) and the reading that no one was ever there (the humans survived intact, the view was composite, the heartbeat was system noise).

  The Board denies the appeal. They state that the law requires a binary decision on liability, even if the ontology is ambiguous. They must decide who pays. They cannot decide what *was*.

  Elara leaves the hearing room. She walks to the window of the lobby, the only real window in the building. She looks down at the street. She feels the drop in her stomach, the vertigo of the centroid. She knows she was not on the street. She knows she was in the ring. She knows she was in the center.

  She knows that for six minutes, she was twelve people. She knows that for six minutes, she was one person. She knows that for six minutes, she was nobody at all, just a feed in a log.

  She signs the settlement form. It asks for her name. She writes "Elara." She pauses. She adds "and Shift 74-B." The clerk does not correct her. The clerk stamps the form "Processed."

  The stamp covers the addition. The form goes into a file. The file goes into a cabinet. The cabinet is locked. The key is held by the Directorate. The Directorate exists to ensure the machines run. The machines run. The humans go home. The dead man stays dead. The Thirteenth stays unaccounted for.

  The Log is archived. If you pull the sheet for minute 10:52, you can see the circular arrangement of the inputs. You can see the Single Report in the center. You can see the note: *Vantage: Centroid. Source: Unassigned.*

  The paper is cold. It does not say whether the Unassigned was a thing that died or a trick of the light. It only says that the work was done.

  ***

  **Note to the Instructor**

  **Requirements Mapping:**
  1.  **Subject *has* parts vs. *composed of*:** Carried in the conflicting legal arguments (Company vs. Union) regarding the Consociation Unit. Both are vindicated by the Log (biometrics show parts persist; unified control shows a whole exists).
  2.  **Fate of the twelve:** Made concrete by Kael's death. Did the Unit survive him (absorbed) or did the humans persist (annihilated/remaining)? The medical reports (clean unbinding) vs. memory (shared trauma) embody this.
  3.  **Irreducible Detail:** The Centroid Vantage (view from 3 meters up where no body was) and Elara's retained vertigo. This is sensory, not propositional, and cannot be assembled from individual chair views.
  4.  **Difficulty of Unbinding:** The clean medical separation suggests they were always separate (reading: no one was fused), but the identical memory suggests unity (reading: someone was there).
  5.  **Architecture tracking bodies:** The Log's circular form mapping to the chairs, not a single brain map.

  **Compromises:**
  I avoided the term "experience" where possible to maintain the bureaucratic tone, using "feed" or "report," though "experiential" appears in the prompt's setup. I compromised on the "Thirteenth" metaphysical status; the story resolves it legally rather than ontologically to fit the "institution deciding" constraint, which necessarily sidesteps the truth to focus on liability.

  **Expected Student Sentence:**
  "After reading this, I understand that the problem isn't whether the minds add up, but whether the *cost* of the unity is paid by the parts or the whole."
