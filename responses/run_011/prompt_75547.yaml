  # Article ID: ZF-404: Configuring Your Axiom of Choice Add-On

  **Product:** Zermelo–Fraenkel Core™  
  **Module:** Axiom of Choice (AC) Extension  
  **Status:** Optional Subscription

  Thank you for choosing ZF Services™. Your base subscription includes the Axioms of Extensionality, Foundation, Infinity, and more. However, certain high-performance mathematical workflows require the **Axiom of Choice (AC)** module. This article helps you determine which tier fits your research profile and outlines known compatibility behaviors.

  ### Is Choice Right for Me?
  For most working mathematicians, AC is a seamless productivity tool. It allows for the simultaneous instantiation of elements from infinite collections without explicit construction rules. However, enabling AC modifies your universe's ontology. If your work relies on constructive proofs or measure theory stability, you may wish to remain on the **ZF Core** plan.

  ### Subscription Tiers

  | Tier | Permissions | Recommended For |
  | :--- | :--- | :--- |
  | **ZF Core** | No Choice Axioms. | Constructive analysis, finite combinatorics. |
  | **ZF + CC** | Countable Choice only. | Basic analysis; selecting from infinite pairs of shoes. |
  | **ZF + DC** | Dependent Choice. | Baire Category Theorem, separable Hahn–Banach. |
  | **ZF + AC Enterprise** | Full Choice, Zorn's Lemma, Well-Ordering. | General topology, arbitrary vector space bases. |

  *Note: Zorn's Lemma and the Well-Ordering Principle are sold as separate modules for legacy compatibility, but enabling AC Enterprise automatically activates them. You will be billed for only one.*

  ### Frequently Asked Questions

  **1. I enabled AC, but Zorn's Lemma isn't working.**
  Please clear your cache. In ZF Services™, AC, Zorn's Lemma, and the Well-Ordering Principle are logically equivalent. If one is active, all are active. If you see behavior suggesting otherwise, you may be operating in a non-standard model.

  **2. What is the difference between CC and Full AC?**
  CC allows selection from countably many non-empty sets. A common benchmark: You can select a left shoe from infinitely many pairs of shoes using ZF Core (due to distinguishability). However, selecting from infinitely many pairs of identical socks requires at least CC. Full AC is required for uncountable collections, such as arbitrary families of sets.

  **3. Why did my sphere duplicate?**
  This is a known feature of the AC Enterprise tier known as the Banach–Tarski optimization. It allows a solid sphere to be decomposed and reassembled into two identical copies. While this may violate physical intuition, it is mathematically consistent within your subscription. To disable volume replication, please downgrade to ZF + DC.

  **4. How do I verify if AC is enabled in my current model?**
  Due to the independence of AC from ZF, our support team cannot verify whether AC is active or inactive in your specific instance. Both ZF+AC and ZF+¬AC are consistent configurations. If you cannot prove AC is false, it is likely functioning as intended.

  **5. Competitor Model S claims all sets of reals are measurable. Should I switch?**
  Model S (Solovay) offers enhanced measure stability but lacks support for arbitrary bases in vector spaces and general Tychonoff topology. Most enterprise users find the loss of bases too restrictive for general algebra workflows.

  **6. Can I rollback if I encounter non-measurable sets?**
  Rollbacks are not supported once non-constructive objects are instantiated. Please review your measure theory requirements before upgrading to Enterprise.

  ### ⚠ Known Issues

  *   **Non-Measurable Sets:** Enabling AC may spontaneously generate Vitali sets. These cannot be deleted.
  *   **Topology Conflicts:** Tychonoff's Theorem requires AC Enterprise. Users on ZF + DC may experience compactness failures in non-Hausdorff spaces.
  *   **Existence Proofs:** AC guarantees existence without construction. Users seeking explicit algorithms may experience frustration when objects are proven to exist but cannot be located.

  ### See Also
  *   *Troubleshooting Constructive Universe Conflicts*
  *   *Understanding the Boolean Prime Ideal Theorem Add-On*
  *   *Category Theory Integration: Do We Really Need Sets?*

  **© 2024 Zermelo–Fraenkel Services™. All universes reserved.**
