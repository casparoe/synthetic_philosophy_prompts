answer: |-
  This is a classic case of a sentence doing too much work. Your uncle's phrase—"You can't apologize for something you didn't do"—sounds like a single, solid principle, but philosophically, it is a container holding at least four or five distinct arguments that often contradict one another. The power of the sentence comes from sliding between these meanings without noticing.

  To prepare you for the meeting, we need to separate the *metaphysical* claims (who exists?), the *moral* claims (who is guilty?), and the *linguistic* claims (what is an apology?).

  Below is a menu of distinct propositions hidden inside that sentence. I have flagged where two readings might bleed into each other. For each, I have analyzed the claim, its philosophical status, and which of your uncle's four moves it supports.

  ### The Menu of Interpretations

  **1. The Biological Agency Claim**
  *   **(a) The Claim:** The word "You" refers exclusively to biological human beings. Since moral agency resides only in living flesh, a councilor who was not alive in 1958 cannot be the subject of the verb "do" regarding 1958 actions.
  *   **(b) Status:** **Substantive Thesis.** This is not a universal truth; it is a specific philosophical stance (methodological individualism) that denies moral capacity to groups or offices. It requires an argument that institutions *cannot* act, only people can.
  *   **(c) Uncle's Use:** Supports Use 1 (Impossible/Not born) and Use 4 (Guilt/Confession).

  **2. The Psychological Sincerity Claim**
  *   **(a) The Claim:** The word "Apologize" implies the expression of personal remorse or shame. Since one cannot genuinely feel remorse for an event one did not cause or witness, uttering the apology is necessarily a lie.
  *   **(b) Status:** **Debatable/Substantive.** It depends on whether apology is defined by *internal feeling* (emotion) or *external commitment* (speech act). If apology is a promise to repair, sincerity is about intent to fix, not feeling bad about the past.
  *   **(c) Uncle's Use:** Supports Use 2 (Insincere).

  **3. The Metaphysical Discontinuity Claim**
  *   **(a) The Claim:** The "City" of 2024 is not the same moral agent as the "City" of 1958. They share a name and territory, but like a river that has changed course, the entity that "did" the building no longer exists. Therefore, the current entity literally cannot take responsibility for the past entity's actions.
  *   **(b) Status:** **Substantive Thesis.** This is a claim about identity over time. It is not obviously true; most legal and political systems operate on the premise that states/cities *do* persist through time (debts, treaties, laws).
  *   **(c) Uncle's Use:** Supports Use 1 (Impossible). **Note:** This is the only reading that makes the apology *literally impossible* rather than just inappropriate.

  **4. The Apology-as-Confession Claim**
  *   **(a) The Claim:** The word "Apologize" is synonymous with "Admit Personal Guilt." To apologize is to say "I am to blame." Since current councilors are not to blame, the sentence is a category error.
  *   **(b) Status:** **False/Conflated.** In political philosophy and law, official apologies are rarely confessions of *personal* sin. They are acknowledgments of *institutional* wrong. Conflating the two is a category mistake.
  *   **(c) Uncle's Use:** Supports Use 4 (Guilt/Confession).

  **5. The Causal "Do" Claim**
  *   **(a) The Claim:** The word "Do" refers strictly to direct causal authorship (signing the order, driving the bulldozer). It excludes benefiting from, sustaining, or failing to rectify the aftermath of an action.
  *   **(b) Status:** **Substantive Thesis.** This narrows the definition of responsibility. A counter-thesis would be that "doing" includes maintaining the structures built by the act (e.g., living in the segregated city the highway created).
  *   **(c) Uncle's Use:** Supports Use 1 and Use 4.

  **6. The Representational Standing Claim**
  *   **(a) The Claim:** The word "You" refers to the Councilors as *representatives*. They only have the standing to speak for current constituents, not past administrations. To apologize is to bind the current constituents to a narrative they didn't author.
  *   **(b) Status:** **Substantive Thesis.** This argues about the scope of political representation. Does a representative speak for the *office* or the *current voters*?
  *   **(c) Uncle's Use:** Supports Use 3 (Money/Taxes) and Use 4.

  **7. The Fiscal Liability Claim (The "Money" Slide)**
  *   **(a) The Claim:** This reading interprets "Apologize" metonymically to mean "Pay for." The sentence actually means: "You can't be financially liable for something you didn't do."
  *   **(b) Status:** **Distinct Argument.** This is not actually about apology; it is about reparations. It slides from the speech act to the budget line item.
  *   **(c) Uncle's Use:** Supports Use 3 (Housing Fund). **Flag:** This is the shakiest link to the actual sentence, as one can apologize without paying, and pay without apologizing.

  ***

  ### Analysis of Your Specific Questions

  You asked two specific questions that get to the heart of how you can defend your position at the meeting.

  **1. Does ANY reading make the apology literally impossible?**
  Yes, but only **Proposition 3 (The Metaphysical Discontinuity Claim)**.
  If the City of 2024 is a *completely different entity* than the City of 1958, then the apology is logically incoherent, like apologizing for your neighbor's broken window. However, this is a very hard position to maintain in the real world. If the City is a different entity, then the City's property, laws, and tax base are also different. Your uncle likely doesn't want to argue this, because it would undermine the City's right to collect taxes or enforce laws passed in 1958 that still exist today.
  *   **Strategy:** If he says it's "impossible," ask him if the city's debt is also impossible. If the city can owe money for a bond issued in 1958, the city can owe an apology for a harm caused in 1958. Continuity works both ways.

  **2. Is it coherent to hold that a continuing institution can apologize while denying that any living person is guilty?**
  Yes. This is the core of **Corporate Agency Theory**.
  The coherence rests on separating the *Office* from the *Officer*.
  *   **The Claim:** The "You" in the apology is the *City* (a corporate body that persists through time), not the *Councilors* (biological humans who rotate in and out).
  *   **The Mechanism:** When the Council votes to apologize, they are not saying "I, John Doe, feel bad about 1958." They are saying "The Office of the City Council acknowledges that the Office of the City Council in 1958 committed a wrong."
  *   **The "Do":** In this framework, the current Councilors *are* "doing" something: they are performing the speech act of acknowledgment *on behalf of the institution*. They are not confessing personal sin; they are accepting institutional custody of the history.
  *   **Why this matters:** This allows you to say: "Uncle, you are right that *I* didn't build the highway. But *we* (the City) did. And since *we* still own the land and collect the taxes from that highway, *we* are the only ones who can apologize for it."

  ### Preparation for the Meeting

  Your uncle won the dinner argument because he kept shifting which proposition he was using. When you attacked the "guilt" angle, he switched to the "impossibility" angle. When you attacked "impossibility," he switched to "sincerity."

  To prepare, do not try to prove him wrong on all fronts. Pick **one** lane and stay in it. I recommend the **Institutional Continuity** lane (The Counter to Proposition 3 and 4).

  **Here is your script:**

  1.  **Isolate the Subject:** "When the resolution says 'The City Apologizes,' who is the 'City'? Is it the people sitting in the chairs, or the Office they hold?"
  2.  **Force the Continuity Choice:** "If the City isn't the same agent today as it was in 1958, then we don't own the public buildings built then, and we can't enforce the laws passed then. We can't pick and choose. If the City survives to collect taxes, it survives to apologize."
  3.  **Redefine the Act:** "An official apology isn't a confession of personal sin. It's a statement of record. It's the difference between 'I am a bad person' and 'This institution did a bad thing.' I can say the second without believing the first."
  4.  **Address the Money (Proposition 7):** "The fund isn't a fine on innocent people. It's a maintenance cost. We are still benefiting from the highway. Maintaining the moral integrity of the city is just another cost of running the city, like fixing the roads."

  **One Warning:** Be careful with **Proposition 2 (Sincerity)**. If you argue that councilors don't need to *feel* remorse, you risk sounding cold. Instead, argue that their "sincerity" is found in their *commitment to the fund*, not their emotional state about the past. The action proves the sincerity, not the feeling.

  **Summary for your notes:**
  *   **Uncle's Strength:** Ambiguity. He swaps between "Person" and "Office" without noticing.
  *   **Your Strength:** Consistency. Insist that the City is a single agent across time.
  *   **The Trap:** Do not let him define "Apology" as "Personal Guilt." Define it as "Institutional Acknowledgment."
  *   **The Goal:** You don't need to prove the apology is *perfect*. You only need to prove it is *coherent*. If it is coherent, the vote stands.
