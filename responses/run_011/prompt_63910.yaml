      *   *Check:* Did I address the ML aspect? *Yes, need to ensure the "model" doesn't solve the problem.*
      *   *Check:* Objection 2 (Priors) needs strong treatment. Rationalists love priors. I need to explain why priors don't fix *ontology*, only *theory choice within an ontology*.
