  *(Self-Correction on Objection 4)*: This is the "verificationist" challenge. If there's no difference in practice, what's the difference? The answer is: The difference is real *within* a manual, but there is no fact of the matter *between* manuals. The "no fact of the matter" claim *is* the agreement that there is no practical difference, but drawn as a metaphysical conclusion rather than a linguistic one. I need to clarify that the "metaphysical flourish" is actually a deflationary move, not an inflationary one.

  8.  **Finalizing the Verdict:**
