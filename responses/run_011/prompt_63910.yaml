answer: |-
  The rationalist dismissal you describe rests on a category error: it treats the indeterminacy of translation as a problem of *underdetermination of theory*, when it is actually a problem of *inscrutability of reference*. Underdetermination is epistemic; given enough data, the posterior probability of the true hypothesis converges to 1. Indeterminacy is ontological; even with infinite data, the mapping from behavior to ontology remains many-to-one.

  To see why better models and bigger corpora fail to dissolve the problem, we must isolate the mechanism by which evidence is supposed to fix reference. The rationalist assumes reference is a latent variable that generates behavioral data. If so, a sufficiently powerful model inverting that process should recover the variable. The argument against this is that reference is not a latent cause of behavior. It is a coordinate system imposed upon behavior.

  ### The Hinge

  Here is the hinge on which the argument turns, stated explicitly:

  **Two translation manuals are empirically equivalent if they map every native utterance to a home-language sentence such that the native's disposition to assent or dissent matches the home speaker's disposition under all possible stimulations, yet the manuals assign divergent ontological categories to the terms.**

  Consider Manual A, which translates *gavagai* as "rabbit." Consider Manual B, which translates *gavagai* as "undetached rabbit part." For these manuals to be empirically equivalent, Manual B must compensate for this ontological shift by translating the native's logical particles differently. Where Manual A translates a native construction as "is the same rabbit as," Manual B translates it as "belongs to the same concatenation of parts as."

  The divergence surfaces only in the rendering of sentences on which native practice is silent: novel compounds, counterfactual predications, or quantifications into contexts the speakers never enter. If the natives never count rabbits, never speak of rabbit persistence through time, and never distinguish the whole from the part in their assent/dissent patterns, the manuals are free to diverge there.

  This structural feature is not a defect of the setup; it is the whole point. A manual's superior performance on the corpus is compatible with its being no more faithful in reference than its rival because **predictive accuracy tracks dispositions to use, not ontological commitment.** A machine learning model trained on the complete corpus and video feed minimizes a loss function defined over utterance-prediction. It learns the manifold of native dispositions. It does not, and cannot, learn what the natives are *referring to*, because "referring to" is not a dimension in the loss landscape. The model can instantiate Manual A's weights or Manual B's weights (with compensatory adjustments in the logic layers) and achieve identical loss. The slack between the manuals is not a gap in the model's knowledge; it is a gap in the world's constraint on the model.

  The rationalist dismissal claims that with enough video data, the model will see the rabbit as a unified object moving through space, ruling out "rabbit stages." But the model only sees pixels and correlations. To interpret the pixel-cluster as a "unified object" is already to apply Manual A's ontology. To interpret it as a "temporal slice of a space-time worm" is to apply Manual B. The video data is theory-neutral only until you label it, and the labeling is where the indeterminacy lives.

  ### Objection 1: The Causal-Historical Fix

  **The Objection:** Reference is fixed by the causal-historical relation between the speakers and the animals they encounter. The natives are causally linked to *rabbits*, not to abstract stages or parts. The corpus-complete translator inherits this fix because the causal chain is part of the physical data. The world cuts the joints; the linguist just has to measure the cuts.

  **The Steelman:** This is the strongest externalist counter. It bypasses the speaker's mind and anchors language in the environment. If the causal chain terminates at the rabbit, then *gavagai* means rabbit, regardless of behavioral equivalence.

  **The Reply:** The causal-historical chain is invisible to the linguist, and invisible to the model. To identify the "cause" of an utterance, you must already have individuated the cause. Did the utterance arise from the presence of a *rabbit*, or the presence of *rabbit parts*, or the presence of *rabbithood*? The physical stimulus is a pattern of irradiation at the nerve endings. Moving from "irradiation pattern" to "rabbit" requires an interpretive leap.

  The causal theorist assumes we can specify the cause of the utterance in terms that are already translated. But we cannot step outside our own manual to check the causal relata. To say "the cause is a rabbit" presupposes the translation of "rabbit." If we are trying to establish the translation of *gavagai*, we cannot presuppose the ontology of the cause. The causal chain determines reference only relative to a background ontology. Since the background ontology is itself subject to indeterminacy, the causal fix is circular. It tells us that reference is fixed by the world, but it cannot tell us *which* of the empirically equivalent ontologies the world has fixed, because the description of the fix relies on one of those ontologies.

  ### Objection 2: The Bayesian Prior

  **The Objection:** Even if two manuals are empirically equivalent, they are not equiprobable. "Rabbit" is a simpler, more natural kind than "undetached rabbit part." A rational agent applies a prior over candidate reference schemes based on simplicity or naturalness. The manual that posits rabbits will have a higher prior probability than the manual that posits rabbit stages plus a complex logic of concatenation. Therefore, a Bayesian learner converges on the rabbit manual. The disagreement is about priors, not facts.

  **The Steelman:** This is the objection that should compel a rationalist. Science routinely breaks empirical ties with simplicity constraints (Occam's Razor). If indeterminacy is real, it must survive the appeal to simplicity. If "rabbit" is objectively simpler than "rabbit stage," then the indeterminacy is merely pragmatic, not ontological.

  **The Reply:** Simplicity is not an absolute metric; it is internal to a manual. "Rabbit" is simple in Manual A. But Manual B is not just "Manual A with 'rabbit' replaced by 'rabbit part'." Manual B includes compensatory adjustments to the logical particles (identity, quantification, predication). In Manual B, the logic of "concatenation" might be primitive, and the notion of "whole rabbit" might be the complex derivative.

  From the perspective of Manual B, *its* ontology is the simple one. The "complexity" of Manual B is only visible from the standpoint of Manual A. There is no neutral vantage point from which to measure the absolute complexity of the two schemes. The loss landscape is flat between them. A Bayesian prior requires a hypothesis space defined in a specific vocabulary. If you define the hypothesis space in terms of "objects," rabbits win. If you define it in terms of "processes" or "stages," rabbit stages win.

  Furthermore, simplicity is a pragmatic virtue, not a truth tracker in this domain. We prefer simpler theories because they are easier to compute and manipulate. But ease of manipulation does not entail that the world *is* that way. If the universe is symmetric between two ontological descriptions, preferring one because it is cognitively cheaper for *us* does not make the other false. It just makes it inconvenient. The indeterminacy thesis claims there is no fact of the matter, not that one fact is harder to calculate.

  ### Objection 3: Home Language Relativity

  **The Objection:** Quine himself admits that reference is determinate relative to a home background language. I can say determinately that *gavagai* means "rabbit" relative to English. This makes the thesis far less radical than you are treating it. It is not that reference is indeterminate *simpliciter*, but that it is relative. This saves the practice of translation from paralysis.

  **The Steelman:** This concedes the technical point but defangs the metaphysical threat. If reference is determinate relative to English, then for all practical purposes, reference is determinate for English speakers. The "inscrutability" is pushed to the boundary of language as a whole, leaving internal discourse safe.

  **The Reply:** This qualification does not save the rationalist's desire for a "fact of the matter." It confirms the argument. If reference is only determinate relative to a background language, then there is no absolute fact of the matter about reference. The rationalist dismissal claims that better data resolves the indeterminacy. But relativity shows that data never resolves it; it only shifts it to the background.

  Moreover, the background language is not a secure anchor. English itself is subject to the same inscrutability. I can ask whether *my* word "rabbit" refers to rabbits or rabbit stages. I cannot answer this by consulting my own dispositions, because they are compatible with both. I can only answer by deferring to a further background, leading to a regress. The "home language" solution is not a solution; it is an admission that reference is a relation between languages, not between language and world. The rationalist wants the latter. Quine gives only the former.

  ### Objection 4: The Verbal Dispute

  **The Objection:** If no agent's beliefs, predictions, or actions could ever differ between the two manuals, then saying "there is no fact of the matter" adds nothing to saying "the manuals are notational variants." The metaphysical flourish should be dropped. It is a distinction without a difference.

  **The Steelman:** This is a verificationist challenge. If the difference makes no difference, it is not a real difference. Claiming "ontological indeterminacy" sounds deep, but if it boils down to "you can write the theory two ways," it is trivial.

  **The Reply:** The distinction is not verbal; it is structural. "Rabbit" and "rabbit stage" have different identity conditions. In one manual, identity is absolute; in the other, it is relative to a concatenation relation. This changes the logic of the language. However, the "no fact of the matter" claim is not an inflationary metaphysical claim; it is a deflationary one. It agrees with the objection that there is no *extra* fact beyond the dispositions.

  But the conclusion is stronger than "notational variants." Notational variants imply there is a single underlying proposition expressed in two ways. Indeterminacy claims there is no single underlying proposition. There is only the manual. To say "there is no fact of the matter" is to say that the question "Which manual is correct?" is meaningless, not just unanswerable. It dissolves the question. The rationalist wants to know which hypothesis is true. The answer is that the hypothesis type "reference hypothesis" is ill-formed. The metaphysical flourish is necessary to block the rationalist from re-posing the question as a scientific one.

  ### Verdict

  The rationalist dismissal fails because it conflates the optimization of predictive accuracy with the determination of ontology. A model can perfectly predict the natives without settling what the natives are talking about, because "what they are talking about" is not a variable that improves prediction beyond the level of behavioral dispositions.

  Regarding your two-part position:

  **Part 1 survives intact:** No finite or limit-case amount of behavioral evidence closes the space of empirically adequate manuals. The hinge holds: if two manuals account for all dispositions (actual and counterfactual), no further data can distinguish them, because there is no further data of the relevant kind. Reference is not a hidden cause waiting to be discovered by better sensors.

  **Part 2 survives with a qualification:** The residual slack marks the absence of a fact of the matter, *but* this absence must be understood as relative to the absence of a privileged background language. The qualification is that we cannot assert "there is no fact of the matter" as an absolute metaphysical truth from a God's-eye view, because that would itself be a claim about reference. We must assert it from within our own manual, acknowledging that our own terms are equally inscrutable.

  **The Cost:** The cost of this qualified version is the loss of semantic realism. We cannot claim that our own scientific models latch onto the "true" joints of nature in an absolute sense. We can only claim they latch onto the joints relative to our own conceptual scheme. The rationalist desire for a "view from nowhere" that validates our ontology as *The* Ontology is unsustainable. The model does not find the truth; it finds a coordinate system that works. There is no fact of the matter about whether it is the *right* coordinate system, only that it is empirically adequate.
