      *   **Target View:** The "rationalist dismissal" claims indeterminacy is just temporary underdetermination solvable by big data (corpus + video + ML).
      *   **My Task:** Argue *against* the dismissal and *for* Quine's indeterminacy (specifically the ontological relativity/inscrutability of reference aspect).
      *   **Core Argument Structure:**
          1.  State a specific "Hinge" explicitly and lean on it. (The hinge involves two manuals agreeing on all dispositions but diverging on reference in silence/counterfactuals).
          2.  Explain why this divergence isn't a defect but the point.
          3.  Explain why corpus performance $\neq$ referential faithfulness.
          4.  Answer four specific objections (Causal-Historical, Priors/Simplicity, Home Language Relativity, Verbal Dispute/Notational Variants).
          5.  Steelman objections (especially #2).
          6.  **Constraint:** Do not end with a balanced summary. End with a defended verdict on which parts of the position survive and at what cost.
          7.  **Constraint:** Use Quine only to fix the target, not for exegesis.
