  2.  **Deconstruct the "Rationalist Dismissal":**
      *   The dismissal assumes reference is a hidden variable that causes behavior. If we model behavior perfectly, we infer the hidden variable.
      *   Quine's counter: Reference isn't a hidden variable causing behavior; it's a mapping *onto* behavior. There is no "fact of the matter" beyond the behavioral dispositions.
      *   The ML angle: An LLM or multimodal model predicts tokens/actions. It optimizes for predictive accuracy, not ontological truth. If two ontologies yield identical predictions, the model has no gradient to descend toward one over the other *as truth*.

  3.  **Develop the "Hinge":**
      *   *Hinge Statement:* Two translation manuals are empirically equivalent if they map every native utterance to a home-language sentence such that the native's disposition to assent/dissent matches the home speaker's disposition to assent/dissent under all possible stimulations, yet the manuals assign different ontological categories to the terms.
      *   *Crucial Nuance:* The divergence appears only where practice is silent (novel compounds, counterfactuals).
      *   *Why it matters:* If the manuals agree on *all* dispositions (actual and counterfactual), then "reference" cannot be a disposition. If it's not a disposition, and behavior is all we have, reference is indeterminate.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the rationalist habit (hypothesis testing). Validate the intuition that more data usually solves underdetermination. State the thesis: Indeterminacy is not underdetermination.
      *   *The Hinge:* State it clearly. Two manuals, $M_1$ (Rabbits) and $M_2$ (Rabbit Stages). They predict all utterances perfectly. They diverge on *what is being talked about* in cases the natives never speak about.
      *   *The ML Connection:* An ML model minimizes loss on the corpus. If $M_1$ and $M_2$ yield the same loss, the model is indifferent. The "latent space" might look like rabbits, but it could be rotated (Quine's proxy functions). The model optimizes for *use*, not *reference*.
      *   *Addressing Objection 1 (Causal-Historical):* Kripke/Putnam style. The world cuts the joints.
          *   *Steelman:* Causal chains ground reference externally.
          *   *Rebuttal:* The linguist only has access to the *effects* of the causal chain (behavior). The "causal relation" itself is theoretical. To say the causal chain picks out "rabbit" assumes we've already translated the causal relata. It begs the question.
      *   *Addressing Objection 2 (Priors/Simplicity):* Bayesian approach. "Rabbit" is simpler than "undetached rabbit part."
          *   *Steelman:* This is the strongest objection. Science uses simplicity to break ties. Why not here?
          *   *Rebuttal:* Simplicity is internal to a manual. "Rabbit" is simple in $M_1$. "Undetached part" might be simple in $M_2$ if the ontology is adjusted elsewhere (compensatory adjustments). Global simplicity doesn't break the tie because the manuals are empirically equivalent *globally*. Also, simplicity is pragmatic, not truth-tracking in this context.
      *   *Addressing Objection 3 (Home Language Relativity):* Quine admits reference is determinate relative to background.
          *   *Steelman:* It's not radical skepticism; it's just relativity.
          *   *Rebuttal:* This doesn't save the "fact of the matter." It confirms the argument. If reference is only determinate relative to a background, and the background itself is subject to the same indeterminacy, there is no absolute fact. The rationalist wants *the* reference, not reference-relative-to-English.
      *   *Addressing Objection 4 (Verbal/Notational):* If no difference in practice, it's just notation.
          *   *Steelman:* Metaphysical inflation. If it doesn't ping the cash register of experience, it's noise.
          *   *Rebuttal:* It's not just notation; it's ontology. "Rabbit" vs. "Number" matters. But here, "Rabbit" vs. "Stage" changes the *logic* of identity. It's not notational; it's structural. However, since the structure is fixed by use, and use is fixed, the ontology floats. The "no fact of the matter" claim *is* the claim that the distinction is metaphysically idle, which aligns with the objection, but the conclusion is stronger: it's not that the distinction is meaningless, but that *reference itself* is not a meaningful relation independent of the manual.

      *   *The Verdict:* Need to decide which part of the user's two-part position survives.
          1.  No amount of evidence closes the space of manuals. (Survives intact).
          2.  Residual slack is absence of fact, not ignorance. (Survives, but with a qualification regarding the "Home Language" anchor).
          *   Cost: We lose the ability to say our *own* terms have determinate reference absolutely, only relative to our own background.

  5.  **Refining the Tone:**
