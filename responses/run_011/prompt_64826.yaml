answer: |-
  **Question 1 (25 marks)**

  A critic argues that Buchak's Risk-Weighted Expected Utility (RWEU) theory is theoretically redundant. They claim that any preference pattern accommodated by RWEU can be modeled by standard Expected Utility (EU) theory simply by adjusting the curvature of the utility function $u$. Consequently, they argue the Allais preferences RWEU is designed to rescue merely reflect diminishing marginal utility of money, not a distinct attitude toward risk, and the extra machinery of the risk function $r$ buys nothing.

  Evaluate this objection. In your answer, you must:
  1.  Explain what a separate risk attitude consists in within RWEU over and above the curvature of $u$.
  2.  Clarify what the Allais pattern does and does not establish about utility curvature versus risk weighting.
  3.  Discuss the normative cost associated with the way RWEU makes the value of an outcome depend on its position within a gamble, specifically regarding the divergence between local choices and global plans.

  ***

  **Model Answer**

  The objection that RWEU is reducible to EU with a concave utility function fails because it conflates the valuation of outcomes with the weighting of probabilities. While both theories can generate risk-averse choices, they locate the source of that aversion in fundamentally different structural components. In standard EU, risk attitude is entirely derivative of the curvature of $u$. A risk-averse EU agent rejects a fair gamble solely because the disutility of the loss outweighs the utility of the gain due to diminishing marginal utility. There is no separate parameter for risk; to be risk-averse just is to have a concave $u$.

  In contrast, RWEU decouples these elements. The utility function $u$ measures the intrinsic value of outcomes, while the risk function $r$ represents the agent's attitude toward risk independently. $r$ transforms cumulative probabilities based on the rank of outcomes. A risk-averse RWEU agent applies a convex risk function, effectively downweighting the probability of better outcomes relative to their objective likelihood. This allows an agent to have linear utility in money (constant marginal value) yet still exhibit risk-averse behavior purely due to how they weight probabilities. Therefore, a separate risk attitude consists in a non-linear transformation of probability weights based on outcome ranking, distinct from the valuation of the outcomes themselves.

  The Allais pattern decisively refutes the reductionist objection. The Allais preferences violate the Independence Axiom of EU theory. No matter how much one curves $u$, EU requires linearity in probabilities; if an agent prefers gamble $A$ over $B$, they must prefer a mixture of $A$ with $C$ over the same mixture of $B$ with $C$. The Allais paradox presents choices where common sense preferences violate this linearity. Since EU cannot accommodate violations of Independence regardless of $u$'s curvature, the Allais pattern cannot be explained solely by diminishing marginal utility. RWEU accommodates these preferences precisely because $r$ allows for non-linear probability weighting. Thus, the Allais pattern establishes that rational agents may violate Independence, which requires a formalism like RWEU that separates risk weighting from outcome valuation.

  However, this explanatory power comes at a significant normative cost: dynamic inconsistency. Because RWEU weights probabilities based on the global rank of outcomes within a specific gamble, the value of a sub-gamble depends on the context in which it appears. This violates Separability. In a dynamic choice sequence, an agent might endorse a global plan at time $t_1$ but, when arriving at a local choice node at $t_2$, re-evaluate the remaining options based on their new ranking within the truncated gamble. The local choice may diverge from the global plan because the risk weights shift when the possibility space changes.

  This forces a dilemma regarding rational planning. A "naive" RWEU agent is susceptible to money pumps or dynamic inconsistency, failing to execute their own preferred plans. A "sophisticated" agent must anticipate this shift and may need to restrict their future choices or choose a globally inferior plan at the outset to ensure consistency. Unlike EU agents, for whom local optimality guarantees global optimality (given consistent beliefs), the RWEU agent faces a tension between local rationality and global coherence. The reductionist is wrong that the machinery is redundant, but right to suspect a cost: RWEU saves the Allais preferences by sacrificing the separability that ensures dynamic consistency.

  ***

  **Marking Scheme**

  **Block 1: Utility vs. Risk Attitude (0–7 marks)**
  *   **A Grade (6–7):** Clearly distinguishes $u$ (outcome value) from $r$ (probability weighting). Explains that in EU risk aversion *is* concave $u$, whereas in RWEU it is a separate parameter allowing linear $u$ with risk aversion.
  *   **B Grade (3–5):** Identifies that $r$ handles risk and $u$ handles value but fails to explain how RWEU allows risk aversion with linear utility, or conflates risk aversion with diminishing marginal utility.
  *   **Common Wrong Turn:** Treating $r$ as merely another utility curve rather than a probability transformer.

  **Block 2: Allais & Reductionism (0–7 marks)**
  *   **A Grade (6–7):** Explicitly states Allais violates Independence. Explains why curving $u$ cannot fix Independence violations in EU. Confirms RWEU handles this via non-linear weighting.
  *   **B Grade (3–5):** Describes the Allais choices correctly but fails to link them to the Independence Axiom, or claims EU *could* fit Allais with enough curvature.
  *   **Common Wrong Turn:** Arguing that Allais preferences are irrational and should be discarded rather than modeled.

  **Block 3: Dynamic Consistency & Global Plan (0–7 marks)**
  *   **A Grade (6–7):** Identifies that outcome value depends on rank (violates Separability). Explains the divergence between local choice and global plan (dynamic inconsistency). Mentions the need for sophistication/constraint.
  *   **B Grade (3–5):** Notes that RWEU has "problems over time" or is "inconsistent" but fails to explain the mechanism (rank-dependence/separability) or the global/local planning conflict.
  *   **Common Wrong Turn:** Claiming RWEU is dynamically consistent because preferences are stable at a single time point.

  **Block 4: Structure & Clarity (0–4 marks)**
  *   **A Grade (4):** Argument flows logically from definition to Allais to cost. Precise terminology.
  *   **B Grade (2–3):** Disjointed sections or unclear phrasing, though key points are present.
  *   **Common Wrong Turn:** Writing a biographical overview of Buchak's theory rather than answering the specific objection.
