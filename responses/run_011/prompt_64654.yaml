  I'm a backend engineer on a payments-infra team and I run a monthly 40-minute lunch-and-learn for about a dozen of us — mostly engineers, two PMs, everyone's comfortable with basic probability and reading a payoff matrix, nobody has ever taken an actual econ or game theory course. Next month I want to do iterated elimination of dominated strategies, but specifically the version where a strategy gets knocked out because it's beaten by a *randomization* over other strategies rather than by any single one, and then you keep going. I know the mechanics fine, what I don't know is how to teach them. My last two sessions went okay but the room visibly glazed over the second I started deriving things at the board, so I want a plan, not a derivation.

  Here's the game I built for it (Alice picks the row, Bob the column, Alice's payoff listed first):

  ```
                L         C         R
     T      (1, 1)    (0, 2)    (3, 0)
     M      (0, 2)    (1, 1)    (3, 0)
     B     (0.4, 0)  (0.4, 0)  (0.4, 5)
  ```

  My intended line: B isn't beaten by T (T gets 0 against C) and isn't beaten by M (M gets 0 against L), but a 50/50 flip between T and M gets (0.5, 0.5, 3), which beats B's (0.4, 0.4, 0.4) in every single column, so B goes. Then Bob's R loses to L in both surviving rows, so R goes, and you land on the top-left 2x2, which is matching pennies — each player at half-half, no pure answer. First ask: is this example actually sound? I sketched it on a napkin and I'm worried there's a flaw I can't see myself, like B being strictly dominated by some pure strategy after all, or R already being eliminable in the full 3x3 by a mixture of L and C, which would wreck the "you have to go in this order" story I'm telling.

  The real question is the lesson plan though. Some specific things I'm stuck on. I was going to justify the B step out loud as "Alice would rather commit to a coin flip than to B, no matter what Bob does" — is that phrasing going to plant something wrong, like that she literally has to be flipping coins at the table during play, or that beating every column is the same thing as being a best response to some belief about Bob? I also fully expect someone to say "you can't just delete B, Bob might be counting on it," which I think is really a point about what has to be commonly known before you're allowed to iterate at all, but I don't know how to say that in one sentence to engineers without it sounding like mysticism. And there's a variant where B is only *weakly* dominated, and then the order you delete things in can change what survives — do I spend five of my forty minutes on that to sharpen the strict-vs-weak distinction, or does it just muddy the slot? I've got a whiteboard and no slides, and one of the PMs will definately ask "ok but what's the actual right move then" the instant I reach matching pennies, so that moment needs a scripted answer.

