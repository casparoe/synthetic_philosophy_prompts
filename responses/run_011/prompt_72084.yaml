answer: |-
  (a) **The Principle: Concern-Grounded Intentional Disposition**

  A mental state $S$ counts as an emotion if and only if it satisfies the following four conditions:

  1.  **Particular Intentionality:** $S$ is directed at a *particular* object, event, or state of affairs (real, imagined, or presented), distinct from the subject's raw bodily sensation.
      *   *Motivated by:* Case 3 (Unease lacks a particular, thus a mood) vs. Case 4 (Music is directed at the *passage* itself, thus an emotion). Also excludes Case 1 (Espresso dread is directed at the *heartbeat*, not an external threat).
  2.  **Concern-Relevance:** $S$ evaluates that particular as bearing on a *concern* (something the subject cares about or is invested in), rather than a homeostatic deficit or biological need.
      *   *Motivated by:* Excludes Thirst (biological need). Includes Case 7 (Shame about accent evaluates social standing/concern). Includes Case 8 (Fiction fear evaluates imagined concern).
  3.  **Action-Readiness:** $S$ involves a disposition to act, attend, or engage in a manner appropriate to the evaluation, even if the action is not executed or is consciously suppressed.
      *   *Motivated by:* Case 5 (Cold indignation includes disposition to write/donate despite no heat). Case 10 (Standing fury is a standing disposition). Excludes Case 6 (Startle is a reflex, not a disposition to engage).
  4.  **Appraisal Grounding:** $S$ is causally generated or sustained by the representation of the object (Clause 1), not merely by raw physiology that is subsequently interpreted.
      *   *Motivated by:* Case 1 (Espresso: physiology causes the interpretation; dread evaporates when cause is known). Case 2 (Spider: representation of spider causes the state; persists despite contrary belief).

  (b) **Scorecard**

  *   **1. Espresso Dread:** **Verdict: Not Emotion.**
      *   *Analysis:* Fails Clause 1 (Object is internal sensation) and Clause 4 (Grounding is physiological, not appraisive).
      *   *Match:* Preserves your verdict.
  *   **2. Spider Terror:** **Verdict: Emotion.**
      *   *Analysis:* Passes all. Object (spider), Concern (safety), Action (recoil), Grounding (visual trigger). The conflict with belief does not violate the principle.
      *   *Match:* Preserves your verdict.
  *   **3. Low-grade Unease:** **Verdict: Not Emotion (Mood).**
      *   *Analysis:* Fails Clause 1. No *particular* object; it is a background filter.
      *   *Match:* Preserves your verdict.
  *   **4. Music Tears:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 1 (Object is the *musical passage* or the *expression within it*). Passes Clause 2 (Aesthetic concern).
      *   *Match:* Preserves your verdict. (Note: Requires accepting the music itself as the "particular.")
  *   **5. Cold Indignation:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 2 (Justice concern) and Clause 3 (Disposition to act). Fails no clause despite lacking arousal (Clause 3 requires disposition, not feeling).
      *   *Match:* Preserves your verdict.
  *   **6. Startle:** **Verdict: Not Emotion.**
      *   *Analysis:* Fails Clause 1 (No evaluative object) and Clause 3 (Reflex, not action-ready disposition).
      *   *Match:* Preserves your verdict.
  *   **7. Accent Shame:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 1 (Self-in-situation) and Clause 2 (Social concern).
      *   *Match:* Preserves your verdict.
  *   **8. Fiction Fear:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 1 (Imagined particular). Reality of object is irrelevant to the principle.
      *   *Match:* Preserves your verdict.
  *   **9. Schadenfreude:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 2 (Rivalry concern). Endorsement is irrelevant to the principle.
      *   *Match:* Preserves your verdict.
  *   **10. Standing Fury:** **Verdict: Emotion.**
      *   *Analysis:* Passes Clause 3 (Disposition persists even when occurrent thought fades). Passes Clause 4 (Sustained by the latent appraisal of the colleague).
      *   *Match:* Preserves your verdict.

  *   *Cost:* The principle relies on a sharp distinction between "Particular Object" (Case 4) and "Diffuse Background" (Case 3). If you insist the music emotion is truly objectless, Clause 1 must be weakened to "Intentional Content," which risks re-including Case 3. I assume you accept the music *itself* as the object.

  (c) **The Deflationary Alternative**

  If we press the deflationary line that "emotion" is a heterogeneous folk category with no essence, your verdicts are not tracking a natural kind but rather a *utility cluster*. On this view, the difference between the Espresso case (1) and the Spider case (2) is not ontological but functional.

  *   **What survives:** The distinction remains robust because the two states play different roles in your cognitive economy. The Spider state is a *signal* (however false) about the environment that coordinates future avoidance; it is "about" the world. The Espresso state is *noise* that dissipates upon calibration. We classify the Spider state as an emotion because it belongs to the "navigation and social coordination" cluster of states. We classify Espresso as "misattributed arousal" because it belongs to the "body maintenance" cluster.
  *   **The Loss:** If you accept this, you must abandon the hope that a single principle explains *why* Cold Indignation (5) and Standing Fury (10) are the same kind of thing as Spider Terror (2). They would only be "emotion" in the way that "game" covers both chess and tag—by family resemblance. You would have to accept that your intuition in Case 5 (calling cold appraisal an emotion) is a linguistic stretch justified only by its functional similarity to hot anger, not by a shared essence.
  *   **My Recommendation:** Reject pure deflationism. Your verdicts show too much structural consistency (specifically the separation of *arousal* from *emotionhood* in 1 vs 5, and the reliance on *object-specificity* in 3 vs 4) to be mere folk noise. The principle above captures the functional unity without demanding a single phenomenological essence.

  (d) **Three New Test Cases**

  1.  **Awe at the Night Sky:** You look up at the stars. You feel small, overwhelmed, and attentive. There is no specific threat or benefit, just vastness.
      *   *Principle Verdict:* **Emotion.** (Object: The Sky. Concern: Significance/Place. Action: Attention/Stillness.)
      *   *Your Likely Intuition:* Emotion.
  2.  **Intense Chocolate Craving:** You have a pounding desire for chocolate. Your mouth waters. You are poised to walk to the kitchen. It feels urgent.
      *   *Principle Verdict:* **Not Emotion.** (Fails Clause 2: This is a homeostatic/biological drive, not an evaluation of a concern relative to a situation. It is "I need X" not "This situation is Good/Bad".)
      *   *Your Likely Intuition:* Borderline. You might call it a "Desire" or "Urge," distinct from emotion, but the phenomenological heat mimics anger/fear.
  3.  **Learned Helplessness Anger:** You are imprisoned unjustly. You judge it wrong (Appraisal). You feel the heat of rage. But you know absolutely that no action is possible; you have *no* disposition to act, not even mentally, because agency is extinguished. You only suffer.
      *   *Principle Verdict:* **Not Emotion (or Borderline).** (Fails Clause 3: Action-Readiness. If the disposition to engage is truly zero, the state becomes pure suffering/passion.)
      *   *Your Likely Intuition:* **Emotion.** You would likely call this "Anger" or "Despair."
      *   *The Conflict:* Here I expect you to override the principle. You would call it anger because of the *Appraisal* and *Feeling*, even without the *Action*.
      *   *Resolution:* I am wrong, and you are right. Clause 3 must be weakened from "Poised to move me to act" to "Poised to move me to act *or* to prioritize the object in cognition." In helplessness, the object is prioritized cognitively (rumination) even if motor action is blocked. The principle survives if "Action-Readiness" includes "Cognitive Mobilization."

  (e) **Location Relative to Families**

  This view is a **Functional Intentionalism**.

  *   **From the Judgment/Appraisal Family:** It borrows the claim that evaluation (Clause 2) is central. It agrees with Case 5 (Cold Indignation) that belief/judgment-like structures can constitute emotion without heat.
  *   **From the Perception Family:** It borrows the claim that emotions can bypass belief (Clause 4/Case 2). Like perception, an emotion can present the world as dangerous (Spider) even if you judge it safe. It treats the "Concern" as a lens through which the object is perceived.
  *   **From the Feeling/Physiology Family:** It refuses the claim that feeling is *necessary* (Case 5), but it borrows the requirement that the state must be *grounded* in the subject's perspective (Clause 4), excluding purely abstract judgments (e.g., "Injustice is bad" without personal concern is not indignation).
  *   **What it Refuses:** It refuses that arousal is essential (Case 1 vs 5). It refuses that reality of the object is essential (Case 8). It refuses that moral correctness is essential (Case 9).

  **Summary:** The principle defines emotion not by what it *feels like*, but by what it *does*: it takes a particular situation, evaluates it against what you care about, and prepares you to engage with it.
