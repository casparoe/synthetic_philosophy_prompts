answer: |-
  ### Pre-Q&A Analysis: Where the Attack Will Come From

  You asked whether the "indeterminacy of alternatives" objection will be the primary angle. **It will not.** That is a graduate-student-level worry. The specialists in this room will not attack the *vagueness* of your proposal first; they will attack the *necessity* and *coherence* of the proposal based on their specific technical commitments.

  The Neo-Griceans will defend the diagnostics as working *exactly as intended* (you are misinterpreting nondetachability). The Semanticists will panic because you are removing the only tool they have to separate their fragment of the pie from the pragmatics fragment. The Experimentalist will demand to know how "representing choice" is cognitively implemented.

  Your "indeterminacy" worry is real, but it is the *last* thing they will bring up, once they've tried to dismantle the foundation. Prepare for the foundation first.

  ***

  ### The Q&A Preparation

  **1. The Neo-Gricean (Nondetachability)**
  *   **Idiom:** "You're conflating the proposition with the code. Nondetachability was never about truth-conditional equivalence; it's about lexical convention. If I swap 'some' for 'at least one,' I've changed the lexical trigger, so of course the default inference vanishes. That doesn't show the test fails; it shows the inference is tied to the form, which is exactly what we claim. You haven't broken nondetachability; you've just rediscovered that GCIs are grammaticalized."
  *   **Reply (60s):** "If the inference is tied to the form rather than the proposition expressed, then it isn't a conversational implicature by Grice's own definition, which requires derivation from the proposition plus maxims. If it's tied to the lexical item, it's semantic or coded pragmatic. My point is precisely that the diagnostic fails to distinguish these. If 'nondetachability' just means 'attached to the word,' it tells us nothing about whether that attachment is semantic or pragmatic. We need a test that tracks speaker reasoning, not lexical history."
  *   **Softness:** You are conceding that the inference is lexicalized, which might strengthen their claim that it's not a GCI.
  *   **Concession Flag:** **Yes.** Concede in the talk that standard GCIs behave like coded meanings. It strengthens your claim that the diagnostic is obsolete for distinguishing semantics from pragmatics.

  **2. The Formal Semanticist (The Boundary Vacuum)**
  *   **Idiom:** "I can model semantics because I know where it stops. If cancellability no longer marks the boundary between what is said and what is implicated, where do I draw the line for my truth conditions? If I can't distinguish domain restriction from cancellation, I can't build a compositional model. You're asking us to work with a blurred variable. How do we formalize a boundary that doesn't exist?"
  *   **Reply (60s):** "The boundary isn't disappearing; it's shifting from a binary switch to a functional distinction. Semantics handles composition; pragmatics handles speaker-specific adjustment. My test measures the degree of speaker-specific adjustment required. For your models, treat the 'said' content as the minimal proposition required to evaluate truth, and treat the rest as a pragmatic overlay. You don't need a sharp line to model the core; you just need to stop pretending the overlay is part of the engine."
  *   **Softness:** Semanticists hate "overlays" that affect truth conditions. This sounds like context-dependence creeping back in.
  *   **Concession Flag:** **No.** This is your core philosophical move. Hold the line.

  **3. The Experimentalist (Processing Cost)**
  *   **Idiom:** "Your test requires the hearer to represent the speaker's choice among alternatives. That's a second-order mental state. But our reaction-time data shows scalar inferences happen automatically, often without increased processing load. If the hearer isn't actively simulating the speaker's choice, your metric measures nothing that actually occurs in the brain. You're describing a rational reconstruction, not a psychological process."
  *   **Reply (60s):** "Automaticity doesn't preclude underlying choice-representation. Skills become automatic through practice, but they rely on learned distinctions. When you hear 'some,' you rapidly access the alternative 'all' because you know the speaker *could* have chosen it. The 'cost' isn't always visible in reaction time if the alternative is highly salient. My test doesn't require slow deliberation; it requires that the alternative was *available* to the system, even if accessed efficiently."
  *   **Softness:** You are speculating about cognitive architecture without data.
  *   **Concession Flag:** **No.** This is the **Critical Reply**. If this fails, your test is psychologically inert.

  **4. The Neo-Gricean (Domain Restriction vs. Cancellation)**
  *   **Idiom:** "Your first leg claims domain restriction looks like cancellation. But we distinguish saturation from implicature. Restricting 'every bottle' to 'in the fridge' is filling a slot in the logical form. Cancelling 'some but not all' is blocking an inference. Just because they both use 'not' in natural language doesn't mean they are the same operation. You're confusing surface syntax with underlying process."
  *   **Reply (60s):** "The hearer doesn't see the underlying process; they see the correction. If the surface behavior is identical, the diagnostic is useless for the hearer, and pragmatics is about the hearer's uptake. If I can correct a domain restriction explicitly just like I cancel an implicature, then 'explicit cancellability' cannot be the criterion for distinguishing them. We need a functional difference, not a syntactic one."
  *   **Softness:** Semanticists will insist logical form is distinct regardless of surface form.
  *   **Concession Flag:** **Yes.** Acknowledge the logical distinction but maintain the *diagnostic* failure.

  **5. The Experimentalist (Embedding)**
  *   **Idiom:** "How does your test handle embedding? If I say 'If some students passed, we celebrate,' the implicature usually disappears. But the speaker still chose 'some' over 'all' in the antecedent. Does your test predict an implicature there? If not, why does 'representing choice' stop working inside a conditional? If yes, you're wrong about the data."
  *   **Reply (60s):** "In embedded contexts, the speaker isn't asserting the content, so they aren't committing to the choice of alternatives in the same way. The 'choice' is hypothetical. My test is graded: the degree of implicature drops because the commitment to the alternative selection drops. It explains the weakening of the inference without needing a hard projection rule."
  *   **Softness:** "Graded commitment" is hard to define formally.
  *   **Concession Flag:** **No.**

  **6. The Relevance Theorist (Explanatory Power)**
  *   **Idiom:** "You're replacing the Maxims with 'choice among alternatives.' But that's just Quantity restated. Why is your version better? Relevance Theory explains *why* the speaker chose the alternative: cognitive effects vs. processing effort. You just say they chose it. You've added a step without adding an explanation. What work is 'representing choice' doing that 'optimizing relevance' doesn't do better?"
  *   **Reply (60s):** "Relevance is a global constraint; choice is a local mechanism. Relevance tells me *that* you communicated efficiently; tracking alternatives tells me *what* you excluded. I can know you were relevant without knowing which specific alternative you rejected. My test isolates the specific content implicated by focusing on the specific fork in the road the speaker navigated, not just the efficiency of the journey."
  *   **Softness:** Relevance theorists argue global constraints determine local mechanisms.
  *   **Concession Flag:** **No.**

  **7. The Formal Semanticist (Gradience)**
  *   **Idiom:** "Semantics is binary. A sentence is true or false. If 'implicatedness' is a degree, how does it interact with logical operators? Can you negate a degree? If I say 'It's not the case that some passed,' am I negating the implicature partially? Your graded test breaks compositionality."
  *   **Reply (60s):** "The content is binary; the *status* of the content is graded. Either the students passed or they didn't. The question is how firmly that content is attached to the utterance. Logic operates on the content; my test operates on the attachment strength. You can model the content truth-conditionally while acknowledging the pragmatic attachment is a matter of degree."
  *   **Softness:** This distinction is subtle and easy to mangle under pressure.
  *   **Concession Flag:** **Yes.** Clarify early that the *proposition* is binary, the *diagnostic status* is graded.

  **8. The Graduate Student (Circularity)**
  *   **Idiom:** "To know which alternatives were available, don't I already need to know what the speaker was trying to imply? If I don't know the implicature, how do I know 'all' was the relevant alternative to 'some'? It seems like I need the answer to run the test."
  *   **Reply (60s):** "Not at all. Alternatives are determined by linguistic convention and salience, not by the specific implication. 'All' is always a formal alternative to 'some' in the scale. You don't need to know the implication to know the scale exists. The test asks: did recovering this content require you to notice the speaker didn't use the scale-mate? That's a structural question, not a mind-reading one."
  *   **Softness:** Scales are not always fixed (e.g., adjectives).
  *   **Concession Flag:** **No.**

  ***

  ### The Critical Reply

  **The reply that must land is #3: The Experimentalist on Processing Cost.**

  If the Experimentalist convinces the room that "representing speaker choice" is cognitively too expensive to be the default mechanism of interpretation, your replacement test becomes a philosophical curiosity rather than a linguistic tool. The Neo-Griceans can survive having their diagnostics tweaked; the Semanticists can survive blurred boundaries. But if the cognitive mechanism you propose is implausible, the test describes nothing real.

  **Strategy:** Do not get bogged down in specific reaction-time studies. Stick to the architectural claim: *Automaticity is compatible with underlying choice-representation.* If you waver here, the room will treat your test as normative (how people *should* reason) rather than descriptive (how they *do* reason).

  ***

  ### The "Hope Nobody Asks" Question

  **The Question:**
  "You argue that domain restriction correction is indistinguishable from cancellation. But if that's true, doesn't it follow that *what is said* is never fixed? If I can explicitly correct the domain of 'every' just like I cancel an implicature, then truth conditions are always up for negotiation. Doesn't this collapse semantics into pragmatics entirely? If so, why keep the distinction at all?"

  **Why this is dangerous:**
  This comes from the Formal Semanticist who realizes your first leg (cancellability) destroys the firewall they need to do their job. If you concede this fully, you are no longer doing pragmatics; you are doing radical contextualism, which alienates half the room. If you deny it, you contradict your first leg.

  **The Best Answer:**
  "It doesn't collapse the distinction; it relocates it. Semantics provides the *skeleton*—the minimal truth-evaluable structure. Pragmatics provides the *flesh*—the specific content. Explicit correction targets the flesh. We keep the distinction because we still need to know which parts of the sentence are invariant across contexts (the skeleton) and which are flexible (the flesh). My point is just that the *diagnostic* for telling them apart isn't cancellability, because both skeleton and flesh can be adjusted explicitly. The distinction remains, but the test for it changes."
