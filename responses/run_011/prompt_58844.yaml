  **Note on the Text**

  Historians of early modern mathematics agree on the settled facts: Hobbes's quadrature constructions were invalid, he repeatedly retracted and issued new ones, and the quarrel was deeply entangled with the institutional rise of the Royal Society and theological anxieties about Hobbes's materialism. What remains genuinely contested is the philosophical weight of his errors. Scholars debate whether his hostility to indivisibles and infinite quantities represented a coherent foundational critique of the nascent calculus or merely symptomatic technical inadequacy. Similarly, there is disagreement over whether his thesis that "we know only what we make" constitutes a general epistemology or a narrower claim local to his nominalism, and how tightly this mathematical method is actually connected to his political writings. This poem leans heavily on the sympathetic reading: it presents Hobbes's constructivism as a coherent rival system rather than a confusion, and it compresses decades of pamphleteering into the voice of an old man to emphasize the philosophical stakes over the chronological attrition. It treats the mathematical failure as tragic rather than farcical, visible only from within his own standards.
