answer: |-
  **Diagnostic Note**

  A competent B answer will correctly reconstruct the Ellsberg paradox, identify the violation of the Sure-Thing Principle, and catalogue non-Bayesian alternatives like multiple-prior models. It will fail because it treats the paradox as a settled empirical fact rather than a modelling dispute. To score higher, a candidate must engage the 'process objection': that enlarging the state space restores Bayesian consistency. They must distinguish between descriptive rescue (any behavior can be Bayesianized) and normative justification (whether aversion is rational given the description). Shallow answers ignore the unfalsifiability worry and the diachronic coherence costs of the alternatives.

  ***

  **Final Examination: Foundations of Decision Theory**

  **Question 1 (Essay)**

  **Time Allowed:** 50 Minutes
  **Word Limit:** Approximately 700–800 words
  **Weight:** 25 Marks

  Consider the following objection to the standard interpretation of the Ellsberg paradox:

  > "An ambiguous-urn experiment does not test the Sure-Thing Principle at all, because the subjects are not choosing among the acts the experimenter supposes she is offering them. A subject told only that an urn holds one hundred red and black balls in an unspecified ratio is entitled to wonder how that ratio came to be fixed: by a chance device operated in front of her, or by a researcher who had reasons of her own. A subject who hedges against the second possibility — the possibility that the urn was stocked so as to defeat whichever bet she takes — behaves exactly as an ambiguity-averse subject behaves. But if one widens the state space to include the process that determined the composition, her choices are unimpeachably Bayesian: she holds a single prior over the enlarged states, and her refusal to back either colour follows from that prior rather than violating any axiom. On this reading the experiments document a mismatch of descriptions, not a defect in the axioms, and a genuine test would require the composition to be fixed by a visible chance mechanism."

  Write an essay evaluating this objection. Your response must address: (1) the strongest dialectical point of this objection and its normative weakness; (2) the unfalsifiability worry regarding state-space enlargement and what constrains legitimate state descriptions; (3) which specific axiom yields in leading non-Bayesian alternatives and whether this weakening is principled; (4) the coherence of these alternatives when choice is unfolded over time; and (5) a defended verdict on whether ambiguity aversion constitutes a failure of Bayesian rationality or a rational response to mis-description, specifying what evidence would support your view.

  ***

  **Model Answer**

  The objection posits that Ellsberg choices reflect Bayesian reasoning over an enriched state space that includes the *source* of uncertainty, not just the outcome distribution. Its strongest point is descriptive: it rescues Subjective Expected Utility (SEU) from falsification. If a subject suspects adversarial intent, assigning low probability to favorable compositions is rational. Thus, the behavior is consistent with Bayes' rule given a different prior.

  However, this rescue creates a normative vacuum. If any choice pattern can rationalized by enlarging the state space, SEU loses its critical bite. It becomes a tautology: agents maximize expected utility relative to *some* description. The normative question remains untouched: given the standard description (urn composition fixed, source irrelevant), is ambiguity aversion rational? The objection shifts the goalposts rather than answering whether aversion to unknown probabilities is coherent per se.

  This leads to the unfalsifiability worry. If every anomaly implies a missing state, probabilistic sophistication becomes trivial. To constrain legitimate enlargement, we require that states be mutually exclusive, exhaustive, and—crucially—utility-relevant only via consequences. Savage's framework demands that states not directly influence utility; if the 'process' matters, it must be because it affects the probability of outcomes, not because the agent dislikes 'adversarial nature' as a consequence itself. If the process is utility-neutral, Bayesianism demands reduction to known probabilities. If the process carries utility weight (e.g., fear of deception), it is not pure ambiguity aversion but risk aversion over a broader set of consequences.

  In leading non-Bayesian alternatives, such as MaxMin Expected Utility (MMEU), the axiom that yields is the Independence Axiom (or Savage's Sure-Thing Principle). This weakening is principled, not merely ad hoc. It distinguishes between risk (known probabilities) and uncertainty (unknown probabilities), allowing the decision rule to change based on the epistemic status of the probabilities. However, this comes at a cost. When choice is unfolded over time, MMEU often fails dynamic consistency. An agent may plan a strategy ex-ante that they wish to abandon ex-post upon receiving null information, because the set of priors updates in a way that shifts the 'worst-case' scenario. This diachronic incoherence suggests that while ambiguity aversion captures static intuitions, it struggles to support stable planning.

  My verdict is that ambiguity aversion represents a genuine failure of Bayesian rationality *under the standard description*, but not necessarily a failure of instrumental rationality overall. If the experimental context implicitly signals adversarial intent, the 'Bayesian rescue' is descriptively accurate but normatively evasive. A genuine test requires explicit common knowledge that the urn is fixed by a chance device independent of the choice. Evidence for this verdict would come from process-tracing experiments: if ambiguity aversion persists even when the chance mechanism is visible and verified, the state-space enlargement objection fails, and the axiom violation is real. If aversion disappears under verified randomization, the objection holds, and the 'paradox' was merely a framing effect regarding the source of uncertainty. Thus, ambiguity aversion is rational as a heuristic for unknown social contexts, but irrational as a response to verified stochasticity.

  ***

  **Marking Scheme (25 Marks)**

  **1. Articulation of the Objection (5 Marks)**
  *   **A (4-5):** Clearly explains that enlarging the state space to include the *process* restores Bayesian consistency (descriptive rescue). Distinguishes between the subject's model and the experimenter's model.
  *   **B (2-3):** Describes the Ellsberg setup correctly but treats the objection merely as "subjects are confused" without engaging the state-space logic.
  *   **C (0-1):** Fails to understand the objection or conflates it with risk aversion.

  **2. Normative vs. Descriptive Distinction (5 Marks)**
  *   **A (4-5):** Identifies the normative weakness: if Bayesianism explains everything via state enlargement, it prohibits nothing (unfalsifiability). Separates descriptive accuracy from normative justification.
  *   **B (2-3):** Notes that subjects might be rational but fails to discuss the implication for the theory's normative force.
  *   **C (0-1):** Assumes descriptive rescue equals normative validation.

  **3. Unfalsifiability and State Space Constraints (5 Marks)**
  *   **A (4-5):** Discusses the triviality worry. Identifies constraints (e.g., states must not directly affect utility; Savage's requirement).
  *   **B (2-3):** Mentions unfalsifiability but offers no criteria for legitimate state descriptions.
  *   **C (0-1):** Ignores the unfalsifiability worry.

  **4. Axiomatic Specificity (5 Marks)**
  *   **A (4-5):** Identifies Independence/Sure-Thing Principle as the failing axiom. Discusses whether the weakening is principled (epistemic distinction) vs. patching.
  *   **B (2-3):** Identifies an axiom vaguely ("rationality axioms") or names theorists without specifying the logical break.
  *   **C (0-1):** Claims Transitivity or Completeness fails.

  **5. Diachronic Coherence and Verdict (5 Marks)**
  *   **A (4-5):** Addresses dynamic consistency/update issues in non-Bayesian models. Offers a clear verdict with specific evidentiary conditions (e.g., verified chance mechanism).
  *   **B (2-3):** Mentions time briefly or gives a verdict without evidentiary criteria.
  *   **C (0-1):** No discussion of time or evidence.

  ***

  **Check-Understanding: Multiple Choice**

  **1. In the standard Ellsberg setup, ambiguity aversion is distinguished from risk aversion because:**
  A. The agent violates transitivity in their preferences.
  B. The probabilities of the outcomes are known precisely in risk, but unknown or unspecified in ambiguity.
  C. The agent prefers the urn with fewer balls to the urn with more balls.
  D. The agent violates the dominance principle by choosing a strictly worse bet.
  *   **Key:** B
  *   **Distractor Analysis:** A catches those conflating ambiguity with general irrationality (transitivity holds in Ellsberg). C catches those focusing on irrelevant physical features. D catches those confusing ambiguity violations with dominance violations (Ellsberg choices respect dominance).

  **2. If one accepts the 'state-space enlargement' objection to the Ellsberg paradox, which claim follows?**
  A. The Sure-Thing Principle is logically false in all contexts.
  B. Ambiguity aversion is necessarily a violation of probabilistic sophistication.
  C. The observed choices can be represented as Bayesian maximization relative to a richer description of the states.
  D. Multiple-prior models are the only way to represent the choices.
  *   **Key:** C
  *   **Distractor Analysis:** A catches those who think the objection attacks the axiom itself rather than the model description. B catches those who miss the point of the objection (that it *saves* probabilistic sophistication). D catches those who think non-Bayesian models are required even if the objection holds.

  **3. A common criticism of non-Bayesian alternatives (like MaxMin Expected Utility) regarding dynamic choice is that:**
  A. They require too much computational power for agents to use.
  B. They often fail dynamic consistency, leading to plans that agents wish to revise without new information.
  C. They assume agents are risk-neutral over known probabilities.
  D. They cannot represent ambiguity aversion in a single-period setting.
  *   **Key:** B
  *   **Distractor Analysis:** A catches those confusing normative theory with behavioral feasibility. C catches those conflating ambiguity models with risk models. D catches those who think the models fail statically (they succeed statically by design).
