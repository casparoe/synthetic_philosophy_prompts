answer: |-
  1. **Non-identifiability is not non-existence.**
     *Objection:* "You conflate epistemic limits with ontological reality; just because our designs cannot isolate the coefficient doesn't mean the causal mechanism isn't operating in the world." (Substantive. **Kill Shot.**)
     *Concession:* You are right that measurement failure is not proof of absence.
     *Reply:* But policy requires leverage, not just correlation. If the mechanism is a black-box bundle we cannot open, we cannot prescribe it without risking unintended consequences. We are mapping a coastline we cannot land on; claiming causality here implies a control we do not possess. The claim isn't that the effect is zero, but that the sentence "institutions cause prosperity" implies a manipulability that the estimand does not support.
     *Soft Spot:* Relies on a pragmatic definition of causality they may reject as too narrow.

  2. **Botswana as an existence proof.**
     *Objection:* "Botswana transformed without geography changing, serving as an existence proof that institutional components can be built selectively without the full bundle." (Substantive. **Answer.**)
     *Concession:* Botswana is the strongest counterexample to the bundle claim.
     *Reply:* Distinguish: Botswana's diamond wealth provided a rent stream unavailable to others, making it a special case of resource-led state capacity, not generalizable institutional surgery. The security of property rights there was purchased by mineral rents, not built from scratch in a low-income setting. It proves institutions can matter, but not that the bundle is separable for a typical low-income country without equivalent windfalls.
     *Soft Spot:* Requires accepting Botswana as primarily resource-dependent.

  3. **Quarrel about definitions.**
     *Objection:* "This feels like converting an empirical hypothesis into a quarrel about definitions, which lets you dismiss findings without engaging the data." (Expected Charge. Sunk Cost.)
     *Concession:* I acknowledge the risk of semantic drift.
     *Reply:* But if the variable is a composite index, changing one component changes the variable. That isn't semantics; it's measurement validity. If 'constraints on executives' moves but 'bureaucratic quality' does not, and outcomes change, you haven't measured institutions; you've measured a specific political configuration. The label 'institutions' hides the heterogeneity that determines success.
     *Soft Spot:* Easily framed as pedantry by a room full of empiricists.

  4. **Settler-mortality instrument robustness.**
     *Objection:* "The settler-mortality instrument includes robustness checks against geographic controls that you are dismissing as common causes rather than valid adjustments." (Substantive. **Answer.**)
     *Concession:* The controls are sophisticated and standard in the literature.
     *Reply:* Distinguish: Controls adjust for observed geography, but the instrument varies settlement demography, which is endogenous to the disease environment you claim to hold fixed. The instrument doesn't break the tie; it rides the same causal current as the geography hypothesis. You are comparing European disease environments, not holding them constant.
     *Soft Spot:* Technical debate over exogeneity assumptions.

  5. **Divided borders and discontinuities.**
     *Objection:* "The divided-country comparisons hold physical geography fixed at the scale of the fence, isolating the institutional shock from historical confounders." (Substantive. **Answer.**) (Covers Korea, Germany, Colonial Borders.)
     *Concession:* The discontinuity design is visually compelling.
     *Reply:* Distinguish: The fence's location was determined by wars and treaties driven by the very geopolitical forces you claim to isolate, pushing the causal question back a step. The border isn't arbitrary; it is the sediment of conflict whose causes are the thing under dispute. You are measuring the effect of the fence, not the cause of the division.
     *Soft Spot:* Hard to prove the treaty causes were institutional rather than purely military.

  6. **Persistence estimates and historical traces.**
     *Objection:* "Studies on forced labor in the Andes, slave trades, and legal origins show persistent traces independent of current institutions, suggesting deep causal channels." (Sunk Cost. **Answer.**) (Covers Andes, Slave Trades, Legal Origins.)
     *Concession:* The persistence estimates are statistically robust.
     *Reply:* Distinguish: Persistence shows history matters, but doesn't identify whether the channel is institutional rules or embedded social norms and human capital. A mining regime leaves a trace, but that trace could be cultural distrust rather than formal property law. You are measuring the shadow of the past, not the mechanism of the present.
     *Soft Spot:* Blurs culture and institutions.

  7. **Policy paralysis.**
     *Objection:* "Your critique is intellectually rigorous, but if we wait for separability, no policy happens, and you deny practitioners tools they need." (Disguised Compliment. Sunk Cost.)
     *Concession:* I do not intend to paralyze policy action.
     *Reply:* But bad tools break things. Admitting uncertainty is better than prescribing a bundle that may fail when unpacked. We should stop selling silver bullets and start testing specific components, even if it slows the narrative of progress.
     *Soft Spot:* Sounds naive about political pressure for answers.

  **Closing Items**

  1.  **Soften or Drop:** Drop the claim that *N*=1 makes estimation impossible; they know Bayesian approaches and hierarchical models exist. Soften this to "limits generalizability and prevents averaging over replications." Claiming impossibility invites technical demolition; claiming limits invites methodological debate.
  2.  **Opening Five Minutes:** Do not start by questioning their results. Start by acknowledging the 2024 Prize and the rigor of the credibility revolution. Frame yourself as a stress-tester of the *interpretation*, not the *math*. Say: "I am here to ask what these magnificent structures allow us to build, not to deny their engineering." This disarms the "journalist garbling field" fear.
  3.  **The Dangerous Question:** "What is your alternative model?" If you say "none," you are just a critic. If you propose one, they will dismantle it. **Fallback:** "My job is to clear the ground, not build the house. I am asking for a map before we drive, not suggesting we never leave." This maintains your role as the interrogator of claims without forcing you into their empirical game.
