  Your intuition that "marginal contribution" fails is correct. It treats the transaction as an isolated economic event, whereas your verdicts treat it as a participation in a structural relationship. Your hesitation on Case 6 and your asymmetry in Case 5 suggest you are grappling with a conflict between **consequentialist harm reduction** and **deontological structural complicity**.

  To generate your six verdicts consistently, you need a principle that prioritizes the **validity of consent under structural conditions** over the immediate welfare outcome of the specific transaction.

  Here is the principle set that delivers your verdicts, the cost it exacts, and the application to your new cases.

  ### The Principle: Structural Reciprocity and Bodily Integrity

  **Clause 1: The Recourse Condition.**
  A transaction is permissible only if the regulatory framework allows the worker to enforce boundaries, screen clients, and seek legal recourse without risk of self-incrimination or loss of livelihood.
  *   **Motivated by:** Cases 1, 2, 3, and 4.
  *   **Explanation:** This explains why the *same* worker and client generate different verdicts based on jurisdiction. In Amsterdam (1) and decriminalized zones (3), the state guarantees recourse. In Nordic (2) or criminalized (4) zones, the transaction forces the worker into the shadows, severing her access to protection. The wrongness in 2 and 4 is not the sex, but the **enforced vulnerability**.

  **Clause 2: The Structural Taint Condition.**
  A transaction is impermissible if it relies on structural vulnerabilities (criminalization, debt bondage) to exist, regardless of whether the specific client acts benevolently within that transaction. Individual mitigation does not cure structural illegitimacy.
  *   **Motivated by:** Case 6.
  *   **Explanation:** This addresses your "saturation problem" worry. The wrongness is not the marginal harm of *this* john, but the fact that *any* john participating in a criminalized market sustains the structure that denies the Recourse Condition. Paying double (Case 6) is charity, not justice; it leaves the structural vulnerability intact.

  **Clause 3: The Bodily Priority Condition.**
  When structural vulnerabilities (like debt bondage) are present, transactions commodifying direct bodily access are morally weightier than transactions commodifying labor output.
  *   **Motivated by:** Case 5.
  *   **Explanation:** This explains the asymmetry. Both the employer and the client exploit debt (violating Clause 2). However, the sex client purchases *access to the person's body* under coercion, while the employer purchases *output*. Under conditions of coercion, the violation of bodily integrity is a deeper moral injury than the exploitation of labor time.

  ---

  ### The Cost: Which Verdict Must You Abandon?

  To maintain this principle, you must abandon the **ambivalence in Case 6**.

  Your current verdict is "not obviously permissible." The Principle of Structural Reciprocity forces this to be **clearly Impermissible**.
  *   **Why:** If the wrongness in Case 2 and 4 is the *structural denial of recourse*, then a client who pays double in a criminalized zone is still participating in a structure that denies recourse. His benevolence is private; the risk is public and structural. He is effectively saying, "I will treat you well within a system designed to ensure you cannot report me if I don't."
  *   **The Cost:** You lose the ability to praise "ethical johns" in bad systems. You must accept that in a criminalized jurisdiction, the only permissible act is abstention (or political activism, see below). Given you said you would "rather lose 6 than 2," this is the acceptable sacrifice. It tightens your view from "harm reduction" to "structural complicity."

  *Note on Case 5:* This principle also demands you justify **Clause 3** robustly. If you view sex work as "work like any other," the asymmetry in Case 5 collapses (both are equally impermissible). To keep the asymmetry, you must accept that bodily intimacy carries a unique moral weight regarding coercion that domestic labor does not. If you cannot defend that distinction, you must abandon the asymmetry in 5 and treat both as equally impermissible.

  ---

  ### Verdicts on New Cases

  **1. The Lobbying Client**
  *   *Case:* A client lobbies for decriminalization but only ever buys where it is criminal.
  *   *Verdict:* **Impermissible.**
  *   *Reasoning:* This violates the **Structural Taint Condition**. Political advocacy for future structural change does not grant a license to participate in current structural violence. By buying in a criminalized zone, he is actively sustaining the market that harms the worker *now*, regardless of his long-term goals. He is treating the current worker as a means to a political end (or satisfying his desire despite the cost to her safety).

  **2. The Worker-Owned Cooperative**
  *   *Case:* A worker-owned cooperative in a legal regime; no third-party cut.
  *   *Verdict:* **Permissible.**
  *   *Reasoning:* This satisfies all three clauses. The legal regime ensures **Recourse** (Clause 1). The cooperative structure removes exploitation and debt bondage, satisfying **Structural Taint** (Clause 2). The **Bodily Priority** (Clause 3) is not triggered negatively because there is no coercion; the workers are selling access on their own terms. This is the ideal realization of your principle.

  **3. The Cross-Border Cam Session**
  *   *Case:* Client in a legal jurisdiction pays for a cam session performed by a worker in a criminalized jurisdiction.
  *   *Verdict:* **Impermissible.**
  *   *Reasoning:* The **Recourse Condition** is determined by the *worker's* location, not the client's. If the worker is in a jurisdiction where sex work is criminalized, she likely cannot report harassment, extortion, or non-payment without risking arrest. The digital nature of the transaction does not remove the legal risk she faces. The client is importing the safety of his jurisdiction to exploit the vulnerability of hers.

  ---

  ### What Would Change My Mind

  As an AI analyzing your ethical framework, here is where the reasoning is most vulnerable and what evidence would force a revision of the principle:

  **1. Empirical Failure of Decriminalization (Threatens Clause 1)**
  If robust sociological data demonstrated that full decriminalization (Amsterdam model) *increases* trafficking or *decreases* workers' ability to screen clients compared to the Nordic model, Clause 1 collapses. Your principle relies on the law being a proxy for safety. If the law grants legitimacy but safety decreases, the principle permits harmful transactions.
  *   *The Pivot:* I would have to move toward a **Material Safety Principle** (permissibility depends on actual risk, not legal status), which would complicate Cases 1 and 2 significantly.

  **2. The "Work Like Any Other" Argument (Threatens Clause 3)**
  If you are persuaded that the distinction in Case 5 is unjustified "sex exceptionalism," Clause 3 must be dropped. Many labor ethicists argue that exploiting debt in a warehouse is morally equivalent to exploiting debt in a brothel; the difference is merely cultural stigma.
  *   *The Pivot:* If you accept this, Case 5's asymmetry vanishes. Both are equally impermissible. This simplifies the theory but conflicts with your stated intuition that the client's wrong is "sharper."

  **3. The Agency Challenge (Threatens Clause 2)**
  If workers in criminalized jurisdictions consistently report that *client bans* (Nordic model) cause them more harm than *criminalization of their own work*, and that they prefer discrete, criminalized clients over no clients at all.
  *   *The Pivot:* This would suggest that **Marginal Contribution** (your rejected hypothesis) might actually be the more ethical guide in non-ideal theory. It would force you to make Case 6 Permissible, because the worker's expressed preference for the income outweighs the abstract structural wrong. This would require abandoning Case 2 and 4 as "Impermissible" and reclassifying them as "Regrettable but Necessary."

  ### Summary
  Your intuitions are best served by a **Structural Complicity** framework rather than a **Harm Reduction** framework. This secures your strong verdicts on the Nordic Model (Case 2) and Criminalization (Case 4) but demands you reject the "ethical client" in criminalized zones (Case 6). It requires you to defend the view that buying sex under coercion is uniquely violating compared to buying labor under coercion (Case 5). If you cannot defend that uniqueness, the principle simplifies, but you lose the asymmetry you feel.
