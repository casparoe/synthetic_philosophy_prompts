  ### Phase 3: The Answer

  Here is the breakdown of the concept, the near-misses, and the precise definition you need.

  #### 1. Is there an established term?
  There is no single word like "ad hominem" that dominates the literature, but there are three overlapping labels depending on which discipline you stand in.

  *   **In Philosophy of Mind:** This is the **Homunculus Fallacy**. Your instinct was correct. The fallacy consists of explaining a system's capacity (coordinating an economy) by positing a sub-system (the Planning Board) that already possesses that capacity (knowing where shortages are). The "procedure" (trial and error) is just the homunculus flexing its muscles.
  *   **In the History of Economic Thought:** This is Hayek's critique of the **"Given Data" Assumption**. In his 1937 paper *Economics and Knowledge* and later in *The Competitive "Solution"*, Hayek argues that socialist models treat knowledge as "objectively given" to the planner. He distinguishes between the *logic* of equilibrium (which assumes data are given) and the *empirical* problem (how data are communicated). The move you describe treats the empirical problem as if it were merely a logical one.
  *   **In Computer Science/Complexity:** This is the **Oracle Assumption**. An "oracle machine" is a theoretical construct that can solve specific problems by querying a black-box entity that "knows" the answer. Designing a planning algorithm that requires an oracle for price signals is computationally valid *only if* the oracle exists. Claiming the algorithm solves the problem without accounting for the oracle's construction is the fallacy.

  #### 2. Why the Near-Misses Don't Fit
  You asked for the edges. Here is why the common suspects fail to capture this specific move:

  *   **Petitio Principii (Begging the Question):**
      *   *Why it fails:* *Petitio* is usually explicit or logical ("P is true because P is true"). Your cases are *constructive*. They offer a mechanism ("iterate prices," "install sensors"). The fallacy isn't in the logic of the deduction, but in the **epistemic cost of the inputs**. It's a *hidden* premise, not a repeated conclusion.
  *   **The Nirvana Fallacy (Demsetz):**
      *   *Why it fails:* Demsetz's fallacy is about *comparison* (Real Market vs. Ideal State). Your cases are about *internal feasibility*. Even if we weren't comparing planning to markets, the planning model would still be flawed because it assumes knowledge it cannot generate. It's a coherence error, not a comparative error.
  *   **Idealization (Ceteris Paribus):**
      *   *Why it fails:* Idealizations remove *friction* (e.g., transaction costs). This move removes a *constituent*. Knowledge isn't friction; it's the fuel. Assuming the fuel is available isn't an idealization; it's a **precondition failure**. It's like modeling a car that runs without an engine by assuming "motion is given."
  *   **Black-Boxing:**
      *   *Why it fails:* Black-boxing is legitimate when the internal mechanism is irrelevant to the function. Here, the internal mechanism (knowledge discovery) *is* the function. Hiding it isn't a simplification; it's the **explanandum** (the thing to be explained) masquerading as the **explanans** (the explanation).

  #### 3. The Precise Carving: "The Epistemic Oracle Fallacy"
  Since no single economic term captures the *procedural disguise* perfectly, I propose we coin/refine the term **"The Epistemic Oracle Fallacy"** (or **"The Procedural Homunculus"**).

  **Definition:**
  The Epistemic Oracle Fallacy occurs when a proposed mechanism is presented as a solution to a coordination or allocation problem, but the mechanism's operation implicitly requires an input (information, knowledge, or valuation) that is:
  1.  **Epistemically Inaccessible** to the system by the system's own rules (e.g., no prices, no property rights).
  2.  **Treated as an Available Input** within the procedural steps (e.g., "adjust price based on shortage").
  3.  **Undischarged:** The argument does not explain the origin of this input, nor does it condition the conclusion on the availability of this input.

  **The Boundary Conditions (Legitimate vs. Illegitimate):**
  You asked where the line lies between a legitimate stipulation and this fallacy.

  *   **Legitimate Stipulation (Conditional Feasibility):** "If a planner *could* know the marginal damage, a Pigouvian tax would solve the externality."
      *   *Why it's okay:* The conclusion is conditional ("If..."). The epistemic burden is acknowledged. This is useful for isolating variables.
  *   **Illegitimate Stipulation (The Fallacy):** "A Pigouvian tax solves the externality. The regulator estimates marginal damage and sets the tax."
      *   *Why it's a fallacy:* The conclusion is flat ("Solves"). The epistemic burden ("estimates") is buried in the procedure as if it were a trivial operation. The "estimation" is the Oracle.

  **Boundary Cases:**
  *   **Inside the Fallacy:** "We can solve traffic congestion with central routing. The central computer ingests all driver destinations and optimizes flow." (Assumes drivers truthfully reveal destinations without incentive to lie, or that the computer can know destinations without asking.)
  *   **Outside the Fallacy:** "We can solve traffic congestion *if* we implement a revelation mechanism that incentivizes drivers to report destinations truthfully." (Acknowledges the epistemic constraint and builds a mechanism to overcome it.)
  *   **Inside the Fallacy:** "Neural nets can plan the economy. We train the net on historical data to predict demand." (Assumes historical data contains the counterfactual knowledge that prices would have generated, i.e., assumes the data is "given" rather than created by the market process.)
  *   **Outside the Fallacy:** "Neural nets can assist price discovery by processing publicly available transaction data faster than humans." (Acknowledges the net processes *existing* market data, not that it replaces the market's knowledge generation.)

  #### 4. Did the Objectors Name It?
  Yes, but in prose rather than a single label.

  *   **F.A. Hayek** is the primary source. In *The Use of Knowledge in Society* (1945), he writes that the "data" from which the economic calculus starts are "never given to a single mind." He critiques the "assumption that the relevant knowledge is given to the planning board." He doesn't use a Latin tag, but he identifies the move as the **confusion between the logical principle of equilibrium and the empirical problem of knowledge communication**.
  *   **Ludwig Lachmann**, in the Austrian tradition, called this the **"Plan Coordination"** problem. He argued that equilibrium models assume plans are already coordinated, rather than explaining how they get that way.
  *   **Donald Campbell** (Social Science) called a version of this **"The Law of Effect without Selection"**. You get the adaptive outcome (effect) without the evolutionary process (selection) that generates the knowledge for that outcome.

  **Summary:**
  You are describing the **Homunculus Fallacy** applied to institutional design, historically instantiated in the Calculation Debate as the **"Given Data" Assumption**, and technically isomorphic to the **Oracle Assumption** in computation. The most precise label for the *dialectical move* itself—where the procedure smuggles the knowledge—is **The Epistemic Oracle Fallacy**. It distinguishes itself from simple circularity by wearing the clothes of a constructive algorithm.
