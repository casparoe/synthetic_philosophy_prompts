answer: |-
  ### Phase 1: Brainstorming Candidate Concepts

  Okay, let's cast a wide net. You're describing a move where a *process* is offered as a solution to an *epistemic* problem, but the process only functions if the epistemic problem is already solved. It's a "how" that presupposes the "what."

  **From Philosophy of Mind & Cognitive Science:**
  *   **The Homunculus Fallacy:** This is the one you hinted at. It's the error of explaining a capacity (like vision) by positing an internal agent (a "little man") who already has that capacity (who "sees" the image). In your examples, the Planning Board or the Regulator is the homunculus. They "see" the shortage or the marginal damage.
  *   **Ryle's "Ghost in the Machine":** Related to the homunculus. Treating the mind (or the plan) as a distinct agent separate from the mechanical processes, endowed with magical powers.
  *   **Intentional Stance:** Dennett. Treating a system *as if* it has beliefs/desires. The fallacy might be taking the intentional stance literally in a design spec.

  **From Methodology of Economics & History of Thought:**
  *   **The "Given Data" Assumption:** Hayek's specific critique of neoclassical equilibrium and Lange's socialism. The assumption that the "data" (preferences, technologies, resource availability) are objectively given to the solver, rather than discovered.
  *   **The Nirvana Fallacy (Demsetz):** Comparing an imperfect real-world institution to a perfect hypothetical one. Close, but usually about *performance*, not the *epistemic precondition* of the hypothetical.
  *   **The Walrasian Auctioneer:** The fictional agent who calls out prices until markets clear. Critiques of general equilibrium often point out that the Auctioneer does all the work the model claims the market does.
  *   **Operationalism:** Defining a concept by the operations used to measure it. If the operation assumes the knowledge, the definition is circular.

  **From Mechanism Design & Computer Science:**
  *   **The Oracle Assumption / Oracle Machine:** In computability theory, an oracle machine can solve problems (like the Halting Problem) by querying an "oracle" that knows the answer. If you design a planning algorithm that queries an "oracle" for shadow prices, you haven't solved the calculation problem; you've just assumed an oracle exists.
  *   **The Revelation Principle:** Assumes agents will truthfully report types. If the mechanism requires verification that is epistemically impossible, it's an implementation failure.
  *   **Observability / Controllability:** In control theory, a system is "observable" if you can infer internal states from outputs. The fallacy is assuming observability without a sensor mechanism.
  *   **The Frame Problem:** In AI, knowing which data is relevant. The planner assumes they know the relevant frame.

  **From Philosophy of Science:**
  *   **Black-Boxing:** Hiding the internal workings of a mechanism. Here, the "knowledge generation" is black-boxed inside the "price adjustment" step.
  *   **Reification / Hypostatization:** Treating an abstraction (the Plan, the Equilibrium) as a concrete thing that can act.
  *   **Petitio Principii (Begging the Question):** The logical root, but too broad. It doesn't capture the *procedural* disguise.
  *   **Idealization:** Galilean vs. Aristotelian. This isn't just simplifying friction; it's removing the epistemic barrier.

  ---

  ### Phase 2: Narrowing and Carving

  Now, let's trim the list. We need a term that captures the *procedural disguise*. It's not just assuming the conclusion; it's running a simulation that *looks* like it generates the knowledge but actually consumes it.

  1.  **Nirvana Fallacy:** *Reject.* This is about comparing real vs. ideal outcomes. Your case is about the *internal coherence* of the ideal mechanism. You can commit the error even without comparing it to a real market.
  2.  **Petitio Principii:** *Reject.* Too generic. It doesn't explain why the argument *looks* constructive. A bare assertion ("Planning works because it works") is *petitio*. A procedural demonstration ("Iterate prices until clear") that smuggles the premise is something more specific.
  3.  **Idealization:** *Reject.* Idealizations usually remove friction (transaction costs). This removes an *informational constraint*. It's not "frictionless," it's "omniscient."
  4.  **Black-Boxing:** *Close.* But black-boxing is often legitimate (we don't need to know how the engine works to drive). The fallacy is when the black box is doing the *exact work* that was disputed.
  5.  **The Walrasian Auctioneer:** *Very Close.* This is the economic archetype of the move. But it's a specific character, not the name of the logical fallacy itself.
  6.  **The "Given Data" Assumption:** *Strong Contender.* This is historically accurate to the debate. Hayek explicitly argued that Lange treated data as "given" to the board. But it sounds static, and your examples include dynamic processes (iteration, sensors).
  7.  **The Homunculus Fallacy:** *Strongest Philosophical Fit.* It captures the "inner agent" structure. The Planning Board "sees" the shortage just as the little man "sees" the image. But it's not a standard term in *economics*.
  8.  **The Oracle Assumption:** *Strongest Technical Fit.* In CS, an oracle provides information that the system cannot compute itself. Using an oracle to prove computability is a known category error.

  **The Verdict:**
  There is no single, universally standardized term of art in *economics* that captures the *procedural* nuance perfectly. However, the concept is a intersection of three established ideas:
  1.  **Philosophy of Mind:** The **Homunculus Fallacy**.
  2.  **Economic History:** Hayek's critique of **"Given Data"**.
  3.  **Computation:** The **Oracle Assumption**.

  If I have to give you the precise carving you asked for, I will anchor it in the **Homunculus Fallacy** (because you correctly identified the "inner agent" instinct) but refine it for institutional design. I will also introduce the **"Epistemic Oracle"** label as a modern technical synonym that fits the "sensor/neural net" revival you mentioned.

