answer: |-
  This is an excellent exercise. Given your background, you will spot immediately that the passage conflates the *traditional* consequence argument with Strawson's *a priori* regress argument. While the passage captures the *spirit* of Strawson's pessimism, it introduces significant technical errors that a second-year ethics class (especially one likely to encounter standard objections) could exploit to dismiss the argument prematurely.

  Here is an accuracy audit of the passage, followed by a discussion of your two specific troubles and slide-ready corrections.

  ### Part 1: Claim-by-Claim Accuracy Audit

  | Passage Claim | Verdict | Commentary |
  | :--- | :--- | :--- |
  | **"Strawson's argument is a new way of pressing the old problem of determinism."** | **Misrepresentation** | This is the most significant error. Strawson's Basic Argument is explicitly designed to work *regardless* of whether determinism is true or false. It is an *a priori* argument about the structure of agency, not a consequence of causal determinism. |
  | **"If everything we do is caused by the past... we cannot be blamed for them."** | **Fair (as context)** | This accurately describes the *traditional* incompatibilist argument (the Consequence Argument), which Strawson distinguishes his view from. It serves as a foil in the book, but attributing this premise to Strawson is misleading. |
  | **"Strawson's twist is to push the chain inside the agent: we act as we do because of the way we are..."** | **Fair** | This captures the first premise of the Basic Argument correctly. Responsibility for action requires responsibility for one's "mental nature" (how one is). |
  | **"...and since we never chose our character, we cannot be responsible for what follows from it."** | **Simplification** | "Character" is too static. Strawson refers to one's "nature," "motives," or "principles of choice." More importantly, the problem isn't just that we *didn't* choose it, but that we *couldn't* have chosen it without a prior basis for choosing. |
  | **"To be responsible for an action you would have to be responsible for the character that produced it, and for that... responsible for whatever produced that character, and so on..."** | **Fair** | This accurately describes the regress. To be responsible for $X$, you must be responsible for the cause of $X$ (your nature), and the cause of that, *ad infinitum*. |
  | **"...until you would have to have made yourself out of nothing. That is impossible..."** | **Fair** | This captures the *causa sui* (self-caused) conclusion. One cannot be the ultimate cause of oneself. |
  | **"...so free will is an illusion..."** | **Simplification** | Strawson usually concludes that *ultimate moral responsibility* is impossible. He often grants we have "free will" in a compatibilist sense (freedom from coercion), just not the kind required for deep desert. |
  | **"...the libertarians are wrong, the compatibilists are merely changing the subject..."** | **Fair (as Strawson's view)** | This accurately reflects Strawson's dialectical stance. He argues libertarians fail the regress test, and compatibilists redefine "responsibility" to avoid it. |
  | **"...and any institution that treats people as deserving praise or punishment rests on a mistake we ought to correct."** | **Fair (with nuance)** | Strawson argues *basic desert* is impossible. He generally agrees retributive institutions are unjustified, though he may allow consequentialist measures (quarantine, rehabilitation). |

  ---

  ### Part 2: Addressing Your Specific Troubles

  #### 1. Does the argument need determinism?
  **No.** The passage is wrong here. This is the distinctive feature of Strawson's Basic Argument.
  *   **The Traditional Argument:** Determinism $\rightarrow$ No alternative possibilities $\rightarrow$ No responsibility.
  *   **Strawson's Argument:** Responsibility requires self-creation $\rightarrow$ Self-creation is impossible $\rightarrow$ No responsibility (whether determinism is true or false).

  If indeterminism is true, our actions might be random. But if they are random, they don't issue from *us* in a way that grounds responsibility. If they are determined by our nature, we aren't responsible for our nature. Strawson argues we lose on both sides. The popular passage frames it as a "twist" on determinism, which suggests that if determinism were false, the argument might fail. It does not.

  #### 2. Is the regress about *characters*?
  **Your suspicion is correct.** Formulating the regress over "character" exposes the argument to the **Self-Formation Objection**.
  *   **The Objection:** "I can change my character. I can decide to become more patient. Therefore, I am responsible for my character."
  *   **Strawson's Block:** Any *attempt* to change your character is itself an action. That action flows from *how you already are* (your existing motives, values, and disposition to change). To be responsible for the *new* character, you must be responsible for the *old* character that motivated the change.
  *   **Correction:** The regress is not over "character traits" but over **"principles of choice"** or **"mental nature."** The formulation must emphasize that *any* act of will presupposes a prior nature that governs that act.

  #### 3. Do the conclusions about compatibilism and institutions follow?
  *   **Compatibilism:** Strawson explicitly claims compatibilists "change the subject." He argues they offer a definition of freedom (e.g., freedom from coercion, or acting on one's desires) that satisfies social utility but fails to satisfy the deep intuition required for *true* moral desert. The passage is accurate to Strawson's polemic, though obviously, compatibilists disagree.
  *   **Institutions:** The claim that institutions rest on a "mistake" follows from the impossibility of *desert*. If no one is ultimately responsible, no one *deserves* punishment in the retributive sense. However, Strawson is careful to distinguish *desert* from *consequences*. We might still detain dangerous people (like quarantining a disease carrier), but not because they *deserve* it. The passage's phrase "treats people as deserving" is accurate; if it said "treats people as dangerous," it would be false.

  ---

  ### Part 3: Slide-Ready Formulations

  Here are corrected formulations suitable for a second-year lecture slide. They are designed to block the "determinism" and "self-formation" objections you identified.

  **Slide 1: The Basic Argument (The Regress)**
  1. To be morally responsible for an action, you must be responsible for how you are (your mental nature).
  2. To be responsible for how you are, you must have chosen to be that way.
  3. To choose to be that way, you must have had prior principles of choice that led to that choice.
  4. To be responsible for those principles, you must have chosen them...
  5. **Result:** An infinite regress. To be truly responsible, you would have to be *causa sui* (self-caused).
  6. **Conclusion:** *Causa sui* is impossible. Therefore, ultimate moral responsibility is impossible.

  **Slide 2: Key Clarifications**
  *   **Determinism is Irrelevant:** The argument works even if indeterminism is true. (Randomness does not equal responsibility).
  *   **Self-Formation Blocked:** You cannot "choose your character" because the choice itself flows from the character you already have.
  *   **Target:** The argument denies *Ultimate Responsibility* (basic desert), not necessarily freedom from coercion.

  **Slide 3: Strawson's Implications**
  *   **Libertarians:** Fail because they cannot explain how an agent causes themselves without a regress.
  *   **Compatibilists:** Succeed only by lowering the definition of "responsibility" (changing the subject).
  *   **Justice:** Retributive punishment (punishment because it is *deserved*) is unjustified. Consequentialist measures (safety, rehabilitation) may remain.

  ### Teaching Tip
  Since you are a philosopher of language, your students might benefit from hearing that Strawson treats "Moral Responsibility" as a **natural kind concept** that picks out a specific, robust metaphysical relation (Ultimate Responsibility). Compatibilists, he argues, engage in a kind of semantic shift, redefining the term to pick out a weaker, pragmatic relation. The disagreement is often about *what concept we are tracking*, not just the facts of the case.

  This distinction should help you navigate the "changing the subject" claim without endorsing it as the final word.
