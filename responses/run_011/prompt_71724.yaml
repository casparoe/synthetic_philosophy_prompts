  The standard changed-person objection relies on psychological drift over years. *Memento* compresses this interval into minutes. Leonard's tattoos function as advance directives issued by a self moments dead. If the changed-person objection holds here, it cannot be about substantive psychological change, since Leonard's personality and desires remain stable. Instead, the objection must target the later self's loss of access to the *reasons* behind the choice. This suggests that in dementia cases, the ethical friction arises not because the patient is a stranger, but because the surviving self cannot interrogate the evidence. If we feel Leonard *should* be bound across twenty minutes despite this epistemic gap, then the changed-person objection in dementia cases loses its force, revealing that temporal distance is merely a proxy for memory loss, not a moral threshold. Dworkin argues critical interests survive incompetence; Leonard proves they can survive even when the facts supporting them are fabricated, suggesting that critical interests may persist independently of truth.

  The film introduces a provenance problem absent from standard bioethics models. Leonard knowingly burns evidence and mislabels a photograph to ensure his future self pursues a specific target. Natalie similarly annotates his materials to manipulate his behavior. This demonstrates that a directive's force depends on the integrity of the channel through which it reaches the executor. Bioethics assumes legal formalities secure this channel, but *Memento* suggests no record is immune to internal bias or external interference. If precedent autonomy requires a secure record, actual practice—with its ambiguous language and family disputes—may never meet the condition. The film implies that we rely on trust in the record, not the record itself, making the directive vulnerable to the very interests it seeks to override. When drift occurs over decades rather than minutes, the opportunity for such corruption expands exponentially.

  The reverse chronological structure forces the audience into the epistemic position of a surrogate. We witness the violence before understanding the justification, mirroring the experience of acting on a directive whose grounds we never witnessed. This structure makes an argument the plot alone cannot: it induces a visceral anxiety about acting on incomplete information. We feel the danger of the effect preceding the cause, suggesting that procedural safeguards cannot fully compensate for the loss of contextual memory. The intercutting of forward-moving monochrome scenes with backward-moving color sequences disorients the viewer, replicating the fragmentation of Leonard's consciousness and denying us the comfort of causal certainty.

  The analogy strains because Leonard is competent between resets. He is not incapacitated like a dementia patient; he is capable of reasoning but unable to store new data. This shifts the debate from precedent autonomy to self-binding contracts and weakness of will. Leonard chooses to deceive his future self, which is an act of agency, not merely the residue of past agency. To treat this as a standard advance directive case ignores that Leonard is actively sabotaging his future autonomy to satisfy a present psychological need. However, this distinction ultimately reinforces the film's skepticism: if a competent self can so easily tyrannize a future competent self via records, the protection offered by advance directives is illusory.

  Argument alone treats autonomy as a logical relation between time-slices. *Memento* contributes the phenomenology of dependency. It shows what it feels like to be the survivor bound by the dead self's paperwork—trapped in a narrative you cannot verify. The film reveals that precedent autonomy is not just a metaphysical problem of identity, but a practical vulnerability to the corruption of memory itself. It forces us to ask whether the patient who matters is the one who wrote the directive, or the one who must live with its consequences.
