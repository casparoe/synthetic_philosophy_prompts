  **HISTORAMINE™ (history polyphosphate)**
  **MINISTRY OF THE PAST | PHARMACOLOGICAL DIVISION**

  **DESCRIPTION**
  HISTORAMINE is a temporal analgesic available in three distinct salt formulations: Monumental, Antiquarian, and Critical. Each formulation modifies the patient's relationship to antecedent events. The active ingredient is processed history, stabilized for oral or institutional ingestion.

  **INDICATIONS AND USAGE**
  HISTORAMINE is indicated for the management of temporal disorientation and motivational deficits. The Monumental formulation is indicated for patients requiring inspiration to undertake significant action; it isolates exemplary precedents to stimulate ambition. The Antiquarian formulation is indicated for patients requiring stability and continuity; it preserves existing conditions and fosters reverence for origins. The Critical formulation is indicated for patients suffering under oppressive inherited conditions; it facilitates the judgment and breaking of past chains to enable liberation.

  **DOSAGE AND ADMINISTRATION**
  Dosing must be titrated against the patient's Plastic Power Index (PPI), defined as the capacity to metabolize antecedent data without structural damage. Patients with high PPI may tolerate high concentrations of historical input. Patients with low PPI require diluted regimens. Administration should cease when the past serves life, not when life serves the past. Do not exceed the ceiling dose where inspiration becomes imitation, preservation becomes stagnation, or judgment becomes destruction.

  **ADVERSE REACTIONS**
  Common adverse reactions vary by formulation. Monumental therapy may cause distorting myth-making, where context is erased to fit heroic narratives. Antiquarian therapy may cause mummification of the present, characterized by an inability to accept new growth and a reverence for the trivial. Critical therapy may cause rootlessness and nihilistic erosion, where the destruction of origins prevents future construction. All formulations carry a risk of historical fever.

  **WARNINGS AND PRECAUTIONS**
  Patients should be monitored for signs of spectral existence. Concurrent use of multiple formulations is not recommended without specialist oversight, as conflicting temporal orientations may result in paralysis. The therapeutic window is narrow; the boundary between medicine and poison is determined solely by the strength of the patient's assimilative capacity.

  **CONTRAINDICATIONS**
  HISTORAMINE is contraindicated in patients with total amnesia or those incapable of distinguishing past from present. It is also contraindicated in cultures where the burden of the past already exceeds the metabolic capacity of the population.

  **OVERDOSAGE**
  Acute overdosage manifests not merely as individual collapse but as a population-level condition. An age suffering from historical overdosage exhibits a collective inability to complete actions. The population becomes spectators of their own existence, crushed by the weight of accumulated knowledge. This epidemiological historical sickness results in cynicism, irony, and the retreat into interiority, rendering the generation incapable of genuine creation or willing.

  **ANIMAL STUDIES**
  Comparative studies utilize unhistorical grazers as a baseline control species. These animals live and die without awareness of the past, exhibiting perfect temporal homeostasis. While this state eliminates historical sickness, it is not proposed as a substitute therapy for humans. The unhistorical state is a biological baseline, not a achievable clinical outcome for sentient populations.

  **PATIENT COUNSELING INFORMATION**
  Advise patients that history is a tool for life, not an end in itself. Patients should be instructed to forget when necessary to maintain the horizon of the present. Adherence to the prescribed temporal horizon is essential to prevent toxicity.

  **HOW SUPPLIED**
  HISTORAMINE is supplied in blister packs containing 50 tablets. Monumental formulations are gold-colored; Antiquarian are earth-toned; Critical are translucent. Store in a cool, dry place away from the present moment.

  *Manufactured by the Ministry of the Past. Approved for conditional use only.*
