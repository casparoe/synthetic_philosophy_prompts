prompt: |-
  I'm giving the guest paper at our department's joint methods workshop next month, and I want to walk in prepared. Its a room that's mostly historians — early modernists plus a few twentieth-century political historians who basically live in the archives — along with three comparative politics people who do process tracing, one economic historian who's the only other person in the building who has ever run a regression, and a couple of grad students. Nobody's hostile exactly, but the default assumption in that room is that history is about understanding particular events, and that anyone importing methodology from the social sciences is about to flatten something important. Thirty minutes plus whatever the questions turn into, whiteboard only, and I've been told in advance that a slide with formal notation on it would read as a provocation.

  Here's the claim I'm defending, and I want it attacked in the room's own terms rather than in mine: most published historical explanations are overfitted, in a sense that is close to literal rather than metaphorical. The historian picks the case after the outcome is known, then goes into the record looking for a mechanism that makes that outcome intelligible; and the features that make the result a satisfying story — one through-line, actors whose intentions carry the plot, a reversal that pays off at the end — are the same features that make it unauditable. What I'm proposing is a discipline-level reform. A historical explanation should have to ship with something like a pre-registration: before you open the archive on a case, you commit in writing to an explanandum that doesn't already presuppose the outcome you know happened, to two or three rival accounts you'd count as genuine competitors, and to what you'd expect to find in the record if each of those rivals were true. Plus held-out cases — you develop the account on the case you know best, then run it against the ones you didn't choose, and you report what happens to it. I'll be leaning on the analogy to backtesting a trading strategy on the same data you selected it with, and I'll use three running examples, a financial crisis, a revolution and a firm's collapse, all chosen because the standard explanations of them are famous.

  So build me the Q&A prep sheet. Give me the eight or so objections this specific room will actually raise, roughly in the order they'll come, phrased the way they'd phrase them — the historian who says you're just doing political science and doing it badly and the process-tracer who says we already do this and your version is strictly worse are different objections and I need both. For each one: how much damage it does, a two-minute reply I can deliver out loud without notes, and an honest line on where that reply is soft. Tag each objection by whether it's aimed at the analogy or at the proposal itself, because I think I can give up the analogy and keep the proposal, and I want to know which ones survive that trade. Tell me what to concede in the first five minutes to buy credibility with the historians, and tell me which question I'm hoping nobody asks — I have a suspicion about what that one is, I'd rather you name it than discover it at the podium. No reading list, no citations, no author names; I know roughly where this sits in the literature and I dont want you guessing at it. And commit: rank these by how much they actually hurt, say plainly which one is fatal to the version I sketched above, and if you think the whole proposal is a category error, say that and then tell me what the strongest version of it that isn't a category error would look like.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** A methodologist (likely a political scientist, sociologist, or economist) giving a guest paper at a history department workshop.
      *   **Audience:** Mostly historians (early modern + 20th-century political), archival researchers. Skeptical of social science methodology ("flattening"). Three comp-pol process tracers (allies but critical). One economic historian (regression guy). Grad students.
      *   **Constraints:** 30 mins + Q&A. Whiteboard only (no slides with formal notation).
      *   **Core Claim:** Historical explanations are "overfitted" (literally). Historians pick cases post-outcome, find mechanisms that fit the story. This makes them unauditable.
      *   **Proposal:** "Pre-registration" for history. Commit to *explanandum* before archives, list rival accounts, specify evidence expectations. Use held-out cases (train on one, test on others).
      *   **Analogy:** Backtesting trading strategies.
      *   **Examples:** Financial crisis, revolution, firm collapse.
      *   **Task:** Create a Q&A prep sheet with ~8 objections, ranked by damage, specific replies, concessions, and the "fatal" question. No citations/authors.

  2.  **Deconstruct the Audience's Mindset:**
      *   *Historians:* Value nuance, context, contingency, agency, narrative coherence. Hate determinism, anachronism, and "covering laws." They see history as *interpretive*, not *predictive*.
      *   *Process Tracers:* Care about causal mechanisms. Might agree with the goal but think the "pre-registration" constraint kills the inductive discovery essential to process tracing.
      *   *Economic Historian:* Might like the rigor but worry about data availability or the feasibility of "held-out" cases in deep history.
      *   *General Vibe:* "You don't understand what we do."

  3.  **Brainstorming Objections (Targeting the Specific Room):**
      *   *Objection 1 (The Historian's Core):* History isn't about prediction; it's about understanding. Pre-registration assumes we know the variables beforehand.
      *   *Objection 2 (The Archive Reality):* Archives are messy. You can't know what you're looking for until you're there. Pre-registration blinds you to the unexpected.
      *   *Objection 3 (The "Political Science" Attack):* This is just hypothesis testing dressed up. It turns history into a handmaiden to theory.
      *   *Objection 4 (Process Tracer):* We already do "rival accounts." Your version is too rigid.
      *   *Objection 5 (The Held-Out Case):* There *are* no held-out cases for unique events (e.g., French Revolution).
      *   *Objection 6 (The Narrative/Agency):* You're killing the story. Actors didn't know the outcome; why should the historian pretend to?
      *   *Objection 7 (The Economic Historian):* Selection bias is real, but your solution creates specification error.
      *   *Objection 8 (The "So What?"):* Even if you're right, this makes history impossible to write.

  4.  **Selecting and Refining the Top 8:**
      *   Need to capture the specific voices: The Senior Historian, The Process Tracer, The Econ Historian, The Grad Student.
      *   Need to distinguish between attacks on the *Analogy* (Trading) vs. the *Proposal* (Pre-reg/Held-out).
      *   Need to rank by "Damage."

      *   *Selection:*
          1.  The "Unique Event" Objection (Historians). Fatal to held-out cases.
          2.  The "Archive Discovery" Objection (Historians). Fatal to pre-registration feasibility.
          3.  The "Narrative/Agency" Objection (Historians). Philosophical clash.
          4.  The "Process Tracer" Objection (Allies). "We do this, but your way is rigid."
          5.  The "Political Science Imperialism" Objection (Historians). "Doing it badly."
          6.  The "Economic Historian" Objection (Data). "N=1 problem."
          7.  The "Anachronism" Objection (Historians). "Explanandum presupposes outcome."
          8.  The "Incentive" Objection (Grad Students/Practical). "Who will publish this?"

  5.  **Drafting the Replies & Soft Spots:**
      *   *Reply Strategy:* Validate their concern, pivot to the core problem (overfitting), offer a softened version of the proposal.
      *   *Soft Spot:* Where the reply relies on a compromise that weakens the original claim.

  6.  **Addressing the "Fatal" Question & Category Error:**
      *   *The Fatal Question:* It's about the *Explanandum*. If the outcome is known (the Revolution happened), how can you pre-register an *explanandum* that doesn't presuppose it? If you say "Why did the monarchy fall?" you already know it fell. If you say "What happened to the monarchy?" that's not an explanation, that's a chronicle.
      *   *Category Error:* History is interpretive/hermeneutic, not nomothetic/predictive. Treating it like a trading strategy misunderstands the epistemic goal.
      *   *Strongest Version:* Focus on *transparency of inference* rather than *pre-registration*. "Audit trails" instead of "hypothesis testing."

  7.  **Determining Concessions:**
      *   Concede that "prediction" is the wrong word.
      *   Concede that "held-out cases" don't work for singular events (French Revolution), but do work for comparative sets (revolutions, bank failures).
      *   Concede that the Trading Analogy is provocative and maybe unhelpful for *meaning*, though useful for *bias*.

  8.  **Review against Constraints:**
      *   No citations/authors.
      *   Whiteboard friendly (mental check).
      *   Tone: Respectful but firm.
      *   Ranking included.

  9.  **Final Polish:**
      *   Ensure the "Voice" of the objections sounds like the specific audience members described (e.g., the Early Modernist vs. the Process Tracer).
      *   Make sure the "Fatal" assessment is clear.

  *(Self-Correction during drafting)*: I initially thought about putting the "Process Tracer" objection high. But the prompt says the room is *mostly* historians who are skeptical. The Process Tracers are only three people. The real threat is the Senior Historian who thinks this is a category error. I need to make sure the "Unique Event" objection is high up because it kills the "held-out case" part of the proposal immediately for the Early Modernists.

  *(Refining the "Fatal" Question)*: The prompt asks me to identify the question the user *hopes nobody asks*. This is usually the one that exposes the internal contradiction. The contradiction here is: You want to study history (which studies known outcomes) using a method designed for unknown outcomes (pre-registration). The question is: "How do you define the *explanandum* without knowing the *explanans*?" Or more sharply: "If I pre-register 'Why did the bank fail?', haven't I already selected on the dependent variable?"

  Let's structure the output clearly.

  *   **Opening Concessions:** Buy credibility.
  *   **The Q&A Sheet:** 8 Objections, Ranked, Tagged (Analogy vs. Proposal), Reply, Soft Spot.
  *   **The Fatal Question:** Identify it.
  *   **Category Error Assessment:** Be honest.
  *   **Strongest Version:** Reframe the proposal.

  Let's write it.cw
answer: |-
  ### Opening Concessions (First 5 Minutes)
  *Do not start by defending the trading analogy. Start by validating their craft.*

  1.  **Concede the "Unique Event" Point:** Acknowledge immediately that for singular events (e.g., The Fall of Constantinople), "held-out cases" are impossible. State clearly: "I am not proposing this for the singular miracle. I am proposing this for the recurring pattern masquerading as a singular miracle."
  2.  **Concede the Word "Prediction":** Historians hate prediction. It implies determinism. Swap it for "expectation." You aren't predicting the future; you are stating what evidence *should* exist in the past if a theory is true, before you look for it.
  3.  **Concede the Analogy is Rough:** Say explicitly: "The trading analogy is about incentives and bias, not about equating the French Revolution with a stock ticker. If the analogy distracts from the audit mechanism, discard the analogy, keep the audit."

  ---

  ### Q&A Prep Sheet: 8 Objections
  *Ranked by damage potential (1 = Highest Damage).*

  #### 1. The "Selection on the Dependent Variable" Trap
  *   **Who:** The Senior Early Modernist (The smartest person in the room).
  *   **The Objection:** "You say we select the case after the outcome is known. That is the definition of history. We study the French Revolution *because* it happened. If I pre-register 'What will happen to the French Monarchy?', I am writing a chronicle, not an explanation. If I pre-register 'Why did the Monarchy fall?', I have already assumed the cause is internal to the monarchy. How do you define an *explanandum* without presupposing the *explanans*?"
  *   **Target:** Proposal (Fatal).
  *   **Damage:** **Fatal.** This exposes the category error.
  *   **2-Minute Reply:** "You're right that we can't ignore the outcome. But we can ignore the *story* we tell about it. Currently, we pick the outcome, then hunt for the mechanism that fits. I'm asking you to list the mechanisms you *would have accepted* if the outcome were different. If you argue 'fiscal crisis caused the revolution,' pre-register what evidence would have convinced you it was 'elite defection' instead. It's not about the outcome; it's about the counterfactual evidence trail."
  *   **Soft Spot:** This requires historians to operationalize rivals they don't actually believe in, which feels intellectually dishonest to them.

  #### 2. The "Archive is a Labyrinth" Objection
  *   **Who:** The Archival Researcher (20th Century Political).
  *   **The Objection:** "You think I walk in knowing what I'm looking for? The archive speaks back. I find a letter that changes the question. Your pre-registration blinds me to the unexpected discovery. It forces me to ignore the box I wasn't supposed to open."
  *   **Target:** Proposal.
  *   **Damage:** **High.** Makes the method seem practically impossible.
  *   **2-Minute Reply:** "Pre-registration isn't a straitjacket; it's a logbook. If you find the letter that changes the question, you update the registration. The sin isn't changing course; it's changing course and then pretending you were on this path all along. I want the audit trail of the detour, not the prohibition of the detour."
  *   **Soft Spot:** Requires a cultural shift in how footnotes are written that journals won't support.

  #### 3. The "N=1" Problem
  *   **Who:** The Economic Historian (The Regression Guy).
  *   **The Objection:** "You want held-out cases? For a financial crisis or a revolution, N is tiny. If I train on 1929 and test on 2008, I'm not testing a historical explanation; I'm testing a macro model. You're asking historians to do small-N comparative politics without the tools for it."
  *   **Target:** Proposal (Held-out cases).
  *   **Damage:** **Medium-High.** Limits the scope of your proposal to only "comparative" history.
  *   **2-Minute Reply:** "Agreed. This reform isn't for the singular event. It's for the 'type' of event. If you claim your explanation of the 1929 crash is *the* theory of financial crises, it must hold for 2008. If you claim it's only about 1929, then stop claiming generalizable mechanisms. You can't have it both ways."
  *   **Soft Spot:** Most historians *do* claim generalizable mechanisms implicitly while arguing for specificity.

  #### 4. The "Process Tracing is Already Bayesian" Objection
  *   **Who:** One of the Comp-Pol People.
  *   **The Objection:** "We already do this. Process tracing is about updating priors with new evidence. Your 'pre-registration' is just setting priors. But your version is static. Real inference is dynamic. You're freezing the process."
  *   **Target:** Proposal.
  *   **Damage:** **Medium.** Undermines your novelty.
  *   **2-Minute Reply:** "Process tracers do this informally. I want it formalized because informal priors are invisible to the reader. You know you updated your priors; I, the reader, only see the final posterior. I want to see the starting point to judge the magnitude of the update."
  *   **Soft Spot:** Acknowledges your proposal is bureaucratic, not epistemic.

  #### 5. The "Narrative Coherence" Objection
  *   **Who:** The Narrative Historian.
  *   **The Objection:** "You say narrative features (through-line, intention, reversal) are signs of overfitting. But that's how humans understand causality. If you strip out the story, you don't have better history; you have a variable list. You're flattening agency."
  *   **Target:** Analogy & Claim.
  *   **Damage:** **Medium.** Philosophical disagreement.
  *   **2-Minute Reply:** "I'm not asking you to stop writing stories. I'm asking you to check if the story is a post-hoc rationalization. A satisfying story can be false. I want the story to be auditable. Agency matters, but imagined agency is fiction."
  *   **Soft Spot:** "Auditable story" is an oxymoron to many humanists.

  #### 6. The "Political Science Imperialism" Objection
  *   **Who:** The Skeptical Historian.
  *   **The Objection:** "This is just hypothesis testing dressed up. You're importing a social science norm that treats history as a data mine for theory. History isn't a handmaiden to political science."
  *   **Target:** Proposal.
  *   **Damage:** **Medium.** Cultural resistance.
  *   **2-Minute Reply:** "I'm not asking history to serve political science. I'm asking history to protect itself from its own confirmation bias. This isn't about theory testing; it's about credibility. It's history defending its own rigor against the charge of storytelling."
  *   **Soft Spot:** Historians may prefer the charge of storytelling to the charge of bias.

  #### 7. The "Incentives" Objection
  *   **Who:** A Grad Student.
  *   **The Objection:** "If I pre-register rivals, and one wins, I have to publish the others as 'failed.' Journals want clean stories. You're asking me to do double the work for half the publishable surface area."
  *   **Target:** Proposal (Feasibility).
  *   **Damage:** **Low-Medium.** Practical, not theoretical.
  *   **2-Minute Reply:** "Journals publish null results in science because the cost of false positives is higher. If history values truth over plot, the incentives will follow. But you're right: until journals demand it, this is a voluntary discipline."
  *   **Soft Spot:** Admits the proposal is dead on arrival without institutional change.

  #### 8. The "Trading Analogy is Insulting" Objection
  *   **Who:** Anyone (Early in Q&A).
  *   **The Objection:** "Comparing the French Revolution to a trading algorithm is reductive. Markets are closed systems; history is open. This analogy reveals you don't respect the subject."
  *   **Target:** Analogy.
  *   **Damage:** **Low.** Rhetorical.
  *   **2-Minute Reply:** "The analogy isn't about the subject; it's about the *bias*. In trading, backtesting on training data creates false confidence in a strategy. In history, researching a known outcome creates false confidence in an explanation. The mechanism of bias is identical, even if the subject isn't."
  *   **Soft Spot:** You can afford to drop this analogy entirely if pressed.

  ---

  ### The Question You Hope Nobody Asks
  **"If you pre-register the rivals, and the evidence you find supports none of them, what do you do?"**

  *   **Why it's fatal:** Your proposal assumes the truth is among the pre-registered rivals. But historical discovery often finds a *new* mechanism nobody thought of (the "black swan" in the archive). If you force them to stick to the pre-registered list, you enforce paradigm lock-in. If you let them add a new rival mid-stream, you've defeated the purpose of pre-registration (preventing data mining).
  *   **The Trap:** If you say "stick to the list," you are dogmatic. If you say "add a new one," you admit pre-registration doesn't stop overfitting, it just documents it.
  *   **Prepared Answer:** "You add the new rival, but you flag it as 'exploratory' rather than 'confirmatory.' You publish the log. The reader then knows which parts of the argument were bets placed before the hand was dealt, and which were drawn after seeing the cards. Transparency, not prohibition."

  ---

  ### Commitment: Ranking & Category Error

  **Ranking by Damage:**
  1.  **Selection on Dependent Variable (Fatal):** If you can't solve how to define the *explanandum* without knowing the outcome, the whole "pre-registration" concept collapses for history.
  2.  **Archive is a Labyrinth:** If the method prevents discovery, historians will reject it as anti-intellectual.
  3.  **N=1 / Held-Out Cases:** Limits your proposal to a tiny subset of historical work.
  4.  **Process Tracing Redundancy:** Makes you look like you haven't read the room's lit.
  5.  **Narrative Coherence:** Philosophical disagreement, but manageable.
  6.  **Imperialism:** Cultural friction, manageable with humility.
  7.  **Incentives:** Practical problem, not a theoretical one.
  8.  **Analogy:** Rhetorical, easily swapped.

  **Is this a Category Error?**
  **Yes.**
  History is primarily *hermeneutic* (interpretive), not *nomothetic* (law-seeking). Your proposal treats historical explanation as a failed prediction model. But historians aren't trying to predict outcomes; they are trying to reconstruct meaning and contingency. Overfitting is a bug in prediction; in interpretation, "fitting" the evidence to a coherent narrative is the *feature*.

  **The Strongest Version (That Isn't a Category Error):**
  Drop the "Pre-registration" and "Held-out" language. It sounds like social science imperialism.
  Reframe it as **"Audit Trails for Causal Inference."**

  *   **Don't** ask them to predict. **Do** ask them to document *elimination*.
  *   **The Reform:** When a historian argues Mechanism A caused Outcome B, they must explicitly document why Mechanisms C and D were rejected *based on evidence found*, not just because they don't fit the story.
  *   **The "Held-Out" Swap:** Instead of "held-out cases," ask for **"Negative Cases."** If you explain why a revolution happened in France, you must explicitly address why it *didn't* happen in a similar context (e.g., Britain at the same time) using the same mechanism.
  *   **The Goal:** Not to stop overfitting (which is impossible in interpretation), but to make the *cost* of overfitting visible to the reader.

  **Final Advice:** Walk in saying, "I know history isn't a regression. But even in interpretation, there are ways to lie to oneself. I'm proposing a way to catch those lies." That gets you in the door. The rest is negotiation.
