      *   **Premise 5:** Zombie scenario (physical duplicate has same beliefs without qualia).
      *   **Premise 6:** Beliefs about qualia are coincidentally true if epiphenomenalism is true.
      *   **Premise 7:** The belief *in epiphenomenalism itself* is derived from introspection/experience.
      *   **Premise 8:** If epiphenomenalism is true, the belief isn't grounded in experience (because experience causes nothing). If false, the belief isn't grounded (because the zombie would have it too).
      *   **Conclusion 9/10:** The belief is unjustified/unreliable. Therefore, reject epiphenomenalism.
      *   **Assessment:** This is a strong argument. It's widely discussed in philosophy of mind (e.g., Frank Jackson originally argued for epiphenomenalism but later abandoned it partly due to this problem; also discussed by Chalmers).
      *   **Potential Flaws:**
          *   *Step 7-8:* The claim that the belief isn't "grounded" if the physical cause is sufficient. A materialist/physicalist might say the physical state *is* the grounding, and the qualia are identical to the physical state (identity theory) or supervene on it. But the argument assumes epiphenomenalism is true for the sake of reductio.
          *   *The "Coincidence" Objection:* Some epiphenomenalists argue that the correlation between brain states and qualia is nomological (law-like), not coincidental. If brain state B always produces Qualia Q and also produces Belief "I have Q", then the belief is reliably produced, even if Q doesn't cause the belief. The reliability comes from the common cause (the brain state).
