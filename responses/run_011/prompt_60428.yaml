  I hold the **dose** within my steady hand.
  I will not weigh them using any **coin**.
  But offer each an equal **chance** to stand.
  You say the outcome here is somehow **worse**.
  Because I save the life of only **one**.
  And leave behind the dying of the **five**.

  You count the distinct losses of the **five**.
  As heavier than loss sustained by **one**.
  You argue that to ignore this is **worse**.
  You say I deny them each a **chance**.
  By resting all upon a single **coin**.
  You say I should not waste the single **dose**.

  I spin the silver **coin** into the air.
  No collective soul finds dying **worse**.
  There is no beast that bleeds for all the **five**.
  Each waits upon the mercy of the **dose**.
  To grant them each a fair and equal **chance**.
  Is all I owe the stranger and the **one**.

  The ending comes as singular to **one**.
  It does not compound given half a **chance**.
  The medicine cannot divide the **dose**.
  I will not trade the separate lives of **five**.
  To say one group's extinction is not **worse**.
  But simply different than the fall of **coin**.

  You insist that death for them is somehow **worse**.
  I see only the separate faces, **five**.
  I hold the metal **coin** between my fingers.
  I cannot merge the identity of **one**.
  Into the others to consume the **dose**.
  I give them each the same random **chance**.

  This is the only equitable **chance**.
  Though you demand I maximize the **dose**.
  By sacrificing the future of the **one**.
  I hear the clatter of the thrown **coin**.
  It does not count the bodies, not the **five**.
  It does not judge which outcome is **worse**.

  The **coin** decides the fate of that **one**,
  The sum is **worse** without the saving **dose**,
  **Five** must die without their fair **chance**.
