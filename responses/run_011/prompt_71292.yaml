answer: |-
  Here is the breakdown of your position, ranked defeaters, the insulation verdict, and the empirical stakes.

  ### 1. Ranking the Defeaters (Fatal to Awkward)

  **1. Fatal: Sign Language and Homesign**
  This is your hardest empirical problem. You claim pictures can't host grammar because they lack markers for operations like negation or quantification without becoming alphabetic. Sign languages (and emerging homesign systems) do exactly this using visual space, yet remain visual.
  *   **The Attack:** In American Sign Language (ASL) and Nicaraguan Sign Language (NSL), negation is often a headshake or a specific hand movement. Quantification is handled by sweeping movements or spatial distribution. Crucially, in homesign (systems invented by isolated deaf children), spatial loci are used to track referents (embedding/argument structure). These are *visual* markers, not borrowed text.
  *   **Why it hurts:** If you say sign language isn't "pictorial," you have to explain where the line is. Early sign is highly iconic (mimetic). If the brain can grammaticalize iconic gestures into a recursive system without borrowing from text, your claim that the *visual modality* structurally prohibits grammar collapses. It suggests the barrier isn't the picture; it's the lack of a community to conventionalize the syntax.

  **2. Fatal: The Insulation Charge (Circularity)**
  You define a "picture" as a sign that lacks grammatical operators, and then conclude pictures can't have grammatical operators.
  *   **The Attack:** If a slash through a cigarette makes it "non-pictorial" because it's an arbitrary operator, you must explain why the sound "not" is linguistic but the slash is not. Both are arbitrary. If your criterion for "picture" is "iconic resemblance," then a slash destroys resemblance. But if your criterion is "visual sign," the slash is still visual.
  *   **Why it hurts:** If you retreat to "iconicity" as the definition, you face the Sign Language problem (iconic signs *do* grammaticalize). If you retreat to "visual modality," you face the Slash problem (visual arbitrary marks exist). To avoid circularity, you must define "picture" independently of "grammar" (e.g., via Goodman's density) and *then* prove grammar is impossible. If you define "picture" as "that which has no grammar," the thesis is a tautology.

  **3. Severe: Peirce's Existential Graphs (EGs)**
  You ask if a "cut" (enclosure for negation) is just another arbitrary mark. Peirce would say no; it is topological iconicity.
  *   **The Attack:** In EGs, the sheet of assertion represents the universe of truth. Drawing a cut *iconically* separates a region from the truth. Negation *is* exclusion. Exclusion *is* spatial. Therefore, the cut is a picture of negation, not an arbitrary symbol for it. Juxtaposition is iconic of conjunction (things existing together).
  *   **Why it hurts:** If topology counts as pictorial (which it does in standard accounts of diagrammatic reasoning), then EGs are a sound, complete, logical language that is purely pictorial/diagrammatic. It handles negation, quantification, and embedding without borrowing from text. Your claim that these operations require "marks with no visible correlate" is false; the correlate is spatial containment.

  **4. Awkward: Comics and Children's Drawings**
  *   **The Attack:** Comics convey sequence (time), motion (kinetics), and thought vs. speech (cloud vs. bubble) without an alphabet. Children draw "X-rays" (showing inside and outside simultaneously) to convey knowledge states.
  *   **Why it's only awkward:** You can argue these are "proto-grammars" or unstable conventions. Comics rely heavily on text captions for complex logic. However, the existence of "silent comics" that successfully convey counterfactuals (e.g., a character imagining a future event) suggests visual narrative syntax exists. It's not a full language, but it weakens the "structurally impossible" claim to "structurally limited."

  **5. Supportive: Goodman's Account**
  *   **The Help:** Goodman distinguishes *notational* systems (language) from *descriptive* systems (pictures) via syntax. Language is disjoint and differentiated (a 'c' is not a 'd'). Pictures are dense and replete (any slight change in line weight changes the symbol).
  *   **The Verdict:** This helps you. If you argue that for a picture to become a language it must become discrete (notational), and that becoming discrete destroys its status as a picture (making it a diagram or symbol), you have a rigorous philosophical ground. The "slash" makes the system discrete. Therefore, the system is no longer pictorial in Goodman's sense. This saves you from the "Slash vs. Word" objection: the word "not" belongs to a discrete system; the slash *makes* the system discrete, thus transforming it out of the pictorial realm.

  ---

  ### 2. The Insulation Verdict

  **Is it fatal?**
  Yes, unless you pivot.
  If your argument is: *"I define pictures as things without grammar, therefore they have no grammar,"* it is trivial and uninteresting.
  If your argument is: *"I define pictures as iconic/dense representations (independently of grammar), and I demonstrate that iconicity is cognitively incompatible with recursive syntax,"* it is a substantive empirical claim.

  **How to fix it:**
  You must lean into Goodman. Don't define pictures by what they *can't do* (grammar). Define them by their *syntax* (density/repleteness/iconicity). Then argue that human cognition cannot parse dense syntax recursively.
  *   **The Move:** Admit that if you add a slash, it's no longer a "picture" in the strict sense—it's a hybrid notation. But argue that this isn't just a label change; it's a cognitive category shift. The moment you add the slash, you stop *seeing* an image and start *reading* a code. The "fatal" flaw in rival views is that they assume you can do both simultaneously at a linguistic level. You can't.

  **What a Neurathian would grant vs. wave off:**
  *   **Grant:** Neurath would agree that ISOTYPE is not a language. He was a physicalist who hated metaphysics; he cared about *transmission of information*. He would agree that without standardization and transformation rules, pictures are just art.
  *   **Wave Off:** He would reject the strong "impossibility" claim. Neurath was a socialist optimist. He believed social engineering could overcome cognitive limits. He would argue that if a community *needed* a picture language badly enough, they would stabilize the "slashes" until they functioned as grammar. He would call your structural limit a historical contingency, not a logical necessity.

  ---

  ### 3. Empirical Predictions: You vs. The Rival

  **Your View (Structural Limit):**
  *   **Prediction:** No "Picture Creole" will ever emerge. In situations where language is absent (homesign, pidgin trade contexts), if the modality is visual, the system will either (a) fail to develop complex recursion, or (b) rapidly import arbitrary/symbolic markers that cease to be iconic (becoming sign language or text).
  *   **Evidence to look for:** Track the evolution of emoji. If emoji remain purely iconic, they will never develop consistent syntax for negation or conditionals. If users *do* develop consistent syntax, it will rely on non-iconic markers (e.g., specific sequences that don't resemble the meaning, or borrowing punctuation).
  *   **Specific Test:** Look at technical diagramming communities (e.g., electrical engineering schematics). Do they develop a recursive grammar purely through icons? No, they rely on standardised symbolic labels and mathematical notation.

  **Rival View (Learning Difficulty):**
  *   **Prediction:** Given enough time and pressure, a fully recursive visual language *will* stabilize. It will look messy to outsiders, but it will have consistent rules for negation, tense, and embedding using only visual means.
  *   **Evidence to look for:** Nicaraguan Sign Language (NSL) is the battleground. If NSL retains high iconicity while developing complex grammar, the rival wins. If NSL grammar becomes abstract and loses iconicity (arbitrarization), you win. (Current linguistics suggests the latter: signs become more abstract over time).
  *   **Specific Test:** Experimental semiotics. Put people in a room with no shared language, allow only drawing. Can they communicate "The dog did *not* chase the cat" reliably without using a text-like convention (like a cross-out)? If they consistently invent the cross-out, does that cross-out become a discrete symbol (your win) or remain a picture of destruction (rival win)?

  ### 4. Summary of the Hard Cases

  *   **Peirce/EGs:** You must argue that topology is *not* pictorial in the relevant sense. If "picture" means "resembles object properties," a boundary line does not resemble logical negation. It is a convention. If it is a convention, it is alphabetic in function.
  *   **Slash vs. Word:** Use Goodman. The word "not" is part of a discrete system. A slash on a picture forces the picture into a discrete system. The moment that happens, it is no longer a picture language; it is a text-picture hybrid. The rival claims this is just a spectrum; you claim it is a category change.
  *   **Sign Language:** This is your biggest threat. You must argue that sign language is *not* a picture language. It uses the visual modality, but its signs are lexical items, not images. The iconicity is etymological, not syntactic. Once the grammar kicks in, the iconicity is irrelevant to the structure.

  **Final Advice:**
  Your strongest ground is **Goodman + Cognitive Load**. Argue that parsing density (pictures) and parsing discrete recursion (grammar) compete for the same cognitive resources. You can have one or the other, or a hybrid, but not a pure pictorial language. The "Insulation" charge is avoided if you treat "pictorial" as a cognitive mode of processing (analog/holistic) rather than just "visual stuff." If you do that, the thesis is: *The human brain cannot process analog signals with digital syntax.* That is a falsifiable, non-tautological claim.
