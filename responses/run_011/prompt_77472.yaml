      *   *Why?* "Gerrymandering" implies manipulating boundaries to achieve a desired political (or in this case, numerical) outcome. It fits the "drawing boundaries around a case" metaphor perfectly.
      *   *Alternative:* **Optimistic Reference Class Selection**. (Too dry). **Base Rate Evasion**. (Good, but describes the goal, not the method). **Class Narrowing Bias**. (A bit generic).
