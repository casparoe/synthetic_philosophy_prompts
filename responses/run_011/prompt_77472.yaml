          *   *Vs. Special Pleading:* Special pleading claims an exemption without rule; this claims inclusion in a *different* rule.
      *   *The Test:* Pre-registration of the class or blind selection. If you can't define the class before knowing the rate, it's gerrymandering.

  7.  **Refining the British English:**
      *   Use "programme" (not program).
      *   Use "labelled" (double l).
      *   Use "centre" (not center).
      *   Use "analyse" (not analyze).
      *   Phrasing: "Whilst," "whilst," "insofar as," etc. (But don't overdo the archaic stuff, keep it modern professional British).

  8.  **Final Review against User Constraints:**
