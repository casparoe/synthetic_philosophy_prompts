      *   *Motivated Reasoning:* The user explicitly says it's not quite this, because the reasoning steps are valid, but the *selection* is biased. However, motivated reasoning is the umbrella term. I need to be more specific.
      *   *Cherry-picking:* Close, but usually refers to data points, not reference classes.
      *   *Texas Sharpshooter Fallacy:* Drawing the target after shooting. This is very close. The "target" is the reference class, drawn around the "bullet hole" of the desired outcome.
      *   *Confirmation Bias:* Too broad.
      *   *Survivorship Bias:* Not quite.
      *   *Planning Fallacy:* This is what the user is trying to avoid, but the phenomenon described is the *resistance* to correcting the planning fallacy.
      *   *Kahneman/Lovallo:* Daniel Kahneman writes extensively about the "Inside View" vs. the "Outside View." The user is advocating for the Outside View. The colleagues are retreating to the Inside View but disguising it as an Outside View by manipulating the class.
