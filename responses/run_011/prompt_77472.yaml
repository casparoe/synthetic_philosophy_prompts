          *   The final estimate matches the initial gut feeling, just dressed up with statistics.
          *   It creates a veneer of statistical humility without changing the conclusion.
          *   It's distinct from special pleading (reasons are given), motivated reasoning (reasoning is formally correct, bias is in selection), and after-the-fact rationalisation (this happens during the estimation phase).
      *   **Task:** Identify if there's an established concept for this. If not, propose a term, define it, distinguish it from related concepts (reference class problem, special pleading, motivated reasoning, rationalisation, legitimate narrowing), and define the boundary between defensible narrowing and this bias.
      *   **Constraint:** Write in British English.

  2.  **Initial Brainstorming & Concept Matching:**
