answer: |-
  You have identified a precise and pernicious manoeuvre in decision-making. While there is no single, universally settled noun phrase in the academic literature that captures this exact behaviour in its entirety, it is a recognised instantiation of broader concepts in behavioural economics and statistics.

  The phenomenon you describe sits at the intersection of the **Reference Class Problem** and **Motivated Reasoning**, but as you correctly note, it is distinct from both. The Reference Class Problem (posed by Hans Reichenbach) is an epistemological difficulty: *which* class is the correct one? Your colleagues are not struggling with the difficulty; they are exploiting the ambiguity. Similarly, while this is a form of Motivated Reasoning, that term is too broad to capture the specific statistical dressing-up you have observed.

  In the literature of judgement and decision-making, particularly in the work of Daniel Kahneman and Dan Lovallo, this is often discussed under the umbrella of the **Inside View masquerading as the Outside View**. However, this describes the *stance* rather than the *mechanism* of class selection.

  Since no single established term perfectly isolates the tactical narrowing of a class to suit a desired conclusion, I propose we adopt the term **Reference Class Gerrymandering**.

  Below, I define this term, distinguish it from the related concepts you mentioned, and establish the boundary between this bias and legitimate statistical narrowing.

  ### Proposed Term: Reference Class Gerrymandering

  **Definition:**
  Reference Class Gerrymandering is the strategic manipulation of the boundaries of a comparison class during probability estimation. It occurs when an agent iteratively narrows or redefines the attributes of a reference class not to maximise predictive validity, but to terminate the search once a base rate is found that aligns with a pre-existing intuition or desired outcome.

  **The Mechanism:**
  1.  **The Trigger:** An external base rate is introduced that contradicts the agent's prior belief (e.g., "70% of projects overrun").
  2.  **The Differentiation:** The agent identifies genuine but potentially irrelevant distinguishing features of the current case (e.g., "publicly funded," "has a pilot").
  3.  **The Iteration:** The reference class is narrowed to include only cases sharing these features.
  4.  **The Stopping Rule:** The narrowing ceases immediately when the resulting base rate matches the agent's gut feeling, rather than when the class is statistically robust.
  5.  **The Outcome:** The original intuition is retained but is now buttressed by the apparent rigour of a base rate.

  ### Distinctions from Related Concepts

  To understand why this requires its own label, we must distinguish it from the concepts you raised.

  **1. Versus The Reference Class Problem**
  The Reference Class Problem is a philosophical and statistical limitation: any individual case belongs to infinite classes, each with different frequencies. It is a difficulty for the *interpreter* trying to find the truth. Reference Class Gerrymandering is a rhetorical tactic used by a *proponent* to evade an inconvenient truth. The former is a puzzle; the latter is a solution to a political problem disguised as a statistical one.

  **2. Versus Motivated Reasoning**
  Motivated reasoning is the broad psychological tendency to process information in a way that suits one's goals. Reference Class Gerrymandering is a specific *substrate* of motivated reasoning. In general motivated reasoning, one might ignore data or question the source. In this specific variant, one accepts the data but manipulates the *container* (the class) holding the data. The reasoning steps (if A has property X, and X has rate Y, then A has rate Y) are formally valid; the bias lies exclusively in the selection of X.

  **3. Versus Special Pleading**
  Special pleading typically involves asserting that a general rule should not apply to a specific case without providing a relevant difference (e.g., "The rules apply to everyone else, but I am exempt"). In Reference Class Gerrymandering, the agent does not claim exemption from the rule. Rather, they claim inclusion in a *different* rule. They argue, "I am not in the class of 'all projects' (70% failure); I am in the class of 'piloted public projects' (20% failure)." It is a reclassification, not an exemption.

  **4. Versus After-the-Fact Rationalisation**
  Rationalisation typically occurs post-hoc to justify a decision already made. While Reference Class Gerrymandering often supports a pre-existing gut feeling, it frequently occurs *during* the estimation phase as a defensive reaction to scrutiny. It is used to construct the estimate, not merely to defend it later. However, because the gut feeling precedes the statistical search, it functions as a *contemporaneous* rationalisation.

  ### The Boundary: Legitimate Narrowing vs. Gerrymandering

  This is the crux of your inquiry. Narrowing a reference class is often statistically necessary. If you are estimating the risk of a nuclear power plant, comparing it to "all construction projects" is useless; you must compare it to "nuclear power plants." At what point does defensible narrowing become gerrymandering?

  The distinction lies in the **Stopping Rule** and the **Predictive Validity**.

  **1. The Stopping Rule Test**
  *   **Legitimate Narrowing:** The search for a reference class stops when adding further conditions reduces the sample size to a point where the statistics become unreliable (high variance), or when further conditions no longer have a proven causal link to the outcome.
  *   **Gerrymandering:** The search stops when the *number* becomes comfortable. If the colleague had found that "piloted public projects" still had a 70% overrun rate, would they have narrowed it further to "piloted public projects led by people with blue eyes"? If the answer is yes, it is gerrymandering.

  **2. The Pre-Registration Test**
  *   **Legitimate Narrowing:** The criteria for the class can be defined *before* looking at the success rate of that class. One can say, "We should compare this to projects with pilots," without knowing the failure rate of projects with pilots.
  *   **Gerrymandering:** The criteria are selected *because* of the rate. The class is defined by the outcome. If you cannot define the class without peeking at the success rate to see if it justifies your optimism, you are gerrymandering.

  **3. The Causal Relevance Test**
  *   **Legitimate Narrowing:** The distinguishing features used to narrow the class (e.g., "has a pilot") have a known, causal mechanism for reducing risk.
  *   **Gerrymandering:** The features are merely correlational or superficial descriptors chosen because they happen to correlate with success in the historical data, often by chance.

  ### Conclusion

  You have identified a sophisticated form of bias that weaponises statistical rigour against itself. It creates a facade of the "Outside View" (using base rates) while retaining the cognitive comfort of the "Inside View" (focusing on the unique merits of the current case).

  While you may encounter this described loosely as **Base Rate Neglect** or **Selection Bias**, neither captures the active, iterative boundary-drawing you have observed. **Reference Class Gerrymandering** serves as a precise label for this conduct. It marks the transition from a genuine search for the most predictive comparison to a strategic search for the most comforting one.

  When you encounter this again, the counter-move is to challenge the stopping rule. Ask: "If this class had shown a 90% failure rate, would we have narrowed it further? If so, on what basis do we stop here?" This forces the discussion away from the comfort of the number and back to the validity of the class definition.
