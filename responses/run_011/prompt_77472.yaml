  9.  **Self-Correction during drafting:** I initially thought about calling it "Statistical Camouflage." But "Gerrymandering" is better because it specifically relates to *boundaries* of classes/districts. I need to make sure I don't dismiss the user's intuition that this is distinct from general motivated reasoning. It *is* a specific species of it. I must highlight the *stopping rule* as the defining feature.

  10. **Final Polish:** Check the flow and ensure the distinction between the "Reference Class Problem" (the philosophical hurdle) and the "Gerrymandering" (the tactical exploitation) is clear. Ensure the distinction from "Special Pleading" is sharp (Special Pleading says "rules don't apply to me"; this says "I'm in a different rulebook").

