      *   **Town K—:** Wants to annex an unincorporated area (400 people) for taxes. Wants to extend voting to 16-year-olds and undocumented residents.
      *   **The Proposal:** A two-stage referendum.
          *   Stage 1: *Everyone* in the watershed (residents, commuters, tourists, undocumented, 16+, annexation targets) votes *only* on who gets to vote in Stage 2.
          *   Stage 2: The newly defined electorate votes on annexation and franchise extension.
      *   **The Core Philosophical Problem:** The Boundary Problem (Whitney, Dahl, Whelan, etc.). Who decides who decides?
      *   **The Debate:**
          *   Nadia: Defends the two-stage process as an attempt to solve the circularity/regress problem via moral constraints (subjection).
          *   Ben: Attacks it as an infinite regress or arbitrary fiat (might makes right).

  3.  **Brainstorming & Argumentative Analysis (Move by Move):**

      *   *Move 1 (Nadia):* "Decision about membership must be acceptable to everyone it applies to."
          *   *Insight:* Captures the democratic ideal of self-determination. Avoids arbitrary exclusion.
          *   *Error:* Risks circularity (who decides who it applies to?).
          *   *Verdict:* Strong normative claim, but logically vulnerable.

      *   *Move 2 (Ben):* "Infinite regress. Every democracy founded by fiat."
          *   *Insight:* Historically accurate. Logically sound regarding regress (Whelan's point).
          *   *Error:* Is-Ought fallacy? Just because it *has* happened doesn't mean it *should* be accepted as legitimate now. Dismisses the normative quest too easily.
          *   *Verdict:* Logically strong, normatively cynical.

      *   *Move 3 (Nadia):* "If regress is unavoidable, boundary isn't a democratic question. Ask which boundary is just."
          *   *Insight:* Shifts from procedural legitimacy to substantive justice. Crucial pivot.
          *   *Error:* Concedes the democratic high ground. If it's not democratic, what authority does it have?
          *   *Verdict:* Smart pivot, but admits defeat on pure proceduralism.

      *   *Move 4 (Ben):* "Dropped the thing you were defending. Affectedness criterion is too broad (world government)."
          *   *Insight:* The "All-Affected Principle" (AAP) is notoriously porous. Causal chains go everywhere.
          *   *Error:* Equates Nadia's "justice" solely with AAP. She hasn't specified the standard yet.
          *   *Verdict:* Strong critique of AAP, premature critique of Nadia's unspecified standard.

      *   *Move 5 (Nadia):* "Use subjection (All-Subjected Principle - ASP). Coercive rules."
          *   *Insight:* ASP is the leading alternative to AAP. Clearer boundaries. Includes undocumented/annexed.
          *   *Error:* Temporal problem (future subjection). Doesn't justify Stage 1's inclusion of tourists/commuters.
          *   *Verdict:* Theoretically robust, practically inconsistent with the specific proposal.

      *   *Move 6 (Ben):* "Will be. Tourists/commuters not subjected. You're falling back on affectedness for Stage 1."
          *   *Insight:* Catches the inconsistency between Nadia's theory (ASP) and the proposal (Watershed/AAP-ish).
