  8.  *(Self-Correction during drafting)*: Make sure I don't just say "Ben is right about logic, Nadia is right about morals." I need to be specific about *why* a move is good or bad argumentatively. For Move 6, Ben is devastatingly accurate about the inconsistency. For Move 9, Nadia makes a profound distinction but lacks institutional teeth.

