      *   *Self-Correction on Confidence:* I need to be careful not to sound dogmatic. Democratic theory is contested. I will vary the confidence levels.
      *   *Least Certain:* Probably Move 9. It's deep political philosophy territory (foundings vs. normal politics).

  6.  **Refining the "Missing Option":**
      *   Nadia and Ben assume the choice is between *Internal Self-Definition* (circular) and *External Fiat* (undemocratic).
      *   The missing option is **Recursive/Iterative Boundary Drawing with External Review.** Or, more distinctively: **The Principle of Non-Domination.**
      *   Actually, the most potent missing option in the literature (e.g., Bauböck, López-Guerra) is **Stakeholder Enfranchisement based on Genuine Link.** But the specific institutional mechanism missing is **A Boundary Commission appointed by a higher authority (State) but constrained by local input.** This acknowledges that a local demos *cannot* constitute itself.
