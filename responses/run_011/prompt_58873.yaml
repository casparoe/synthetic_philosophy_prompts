answer: |-
  **MEMORANDUM**

  **TO:** Rebuild Commission and North Side Residents
  **FROM:** [Your Name], Rebuild Commission
  **DATE:** September 5
  **SUBJECT:** Recommendation for Vote on September 14

  We vote on the 14th. Nine days from now, we decide whether to redraw the north side or restore the old lot lines exactly as the deeds describe them. This is the hardest decision this town has faced in a century. I am writing this to state my position clearly, to explain my reasoning, and to ask for your support.

  Before we discuss the map, I need to disclose my own stake. If we vote to re-plat, the road widening required for safety will clip about a third of my family's parcel. We will lose land. I want that on the record now so no one has to raise it later. I am recommending we re-plat anyway.

  Here is the choice: We can restore the old layout, which lets people return to their exact plots faster. Or we can redraw the lines to fix the flaws that made the disaster worse. I recommend we re-plat.

  The old layout is a mess. We all know this. Streets curve because a trolley line ran there until 1929. Lots are 25 feet wide because someone sold by frontage in 1903. Maple Street is 18 feet wide end-to-end. That width is why the engines had trouble getting in when the fire started. We have a window to fix this that will not open again. State money is on the table now. Titles are being reworked anyway. Nobody has moved back yet. If we vote to restore the old lines, we codify the mistakes of 1903 for another hundred years.

  There is a feeling among us that we are "locked in." People say we can't change the layout. When folks say this, I think they are rolling three different claims into one. We need to pull them apart to see which ones actually bear on this vote and which are just noise.

  The first claim is that the current layout happened by accident. This is true. The curves and narrow streets are historical accidents, not design. Does this bear on the vote? Yes. Just because a mistake is old doesn't mean we should preserve it. We aren't restoring a historic district; we are rebuilding a neighborhood. Preserving an accidental hazard because it feels familiar is not a valid strategy.

  The second claim is that changing the layout is expensive and difficult. This is also true. Redrawing lines takes engineering, legal work, and consensus. Does this bear on the vote? Yes, but only regarding timing and budget. However, the state funding is available now and will not be in ten years. If we wait until families have rebuilt to fix the streets, the cost will be on us, not the state. The expense is real, but the funding window makes it manageable now rather than impossible later.

  The third claim is that the town comes out the same whatever we draw. Our former planner argued that the highway interchange decides where a center is, not the map, and that we'd be spending credibility on cosmetics. This is the noise. It assumes macro-economics override micro-safety. The highway might decide where the grocery store goes, but the lot lines decide whether a fire truck can turn around. The map decides density. It decides if a neighbor can walk to the corner or must drive. Saying the layout doesn't matter ignores the physical reality of emergency access and daily life. This claim should not bear on the vote.

  I know there is a strong, honest case against my recommendation. I need to state it clearly. The argument against re-platting is that speed matters more than perfection. Half the commission believes we are spending our credibility on cosmetics while families are still in trailers. They argue that every week we spend arguing over lot lines is a week families wait to go home. They say the highway interchange will dictate the town's future regardless of our map, and that delaying reconstruction to redraw lines risks losing the very families we are trying to save. If the process drags on, people will sell their rights and leave, and the north side will die regardless of the street width. This is a moral argument: do not prioritize infrastructure over people.

  I hear that. But I believe safety is part of people.

  So, how will we know if we got this wrong? We need to agree on what failure looks like. Ten years from now, we will know we made the wrong call if the north side is still half-empty. If the new lot lines are too large or too expensive for the people who lived here before, and they cannot afford to build back, then we have gentrified the disaster. If the state funding falls through because we delayed too long, and the streets remain unpaved dirt, we got it wrong. If the new streets feel sterile and empty because we prioritized engineering over community, we got it wrong.

  But we will also know we got it wrong if we restore the old lines and another fire starts. If the engines cannot get down Maple Street again, we failed.

  We have nine days. I ask you to look at the map not as it was, but as it must be. I ask you to vote on the 14th to re-plat the north side. We have the money. We have the chance. We do not have the time to waste on another century of mistakes.

  Let's get to work.
