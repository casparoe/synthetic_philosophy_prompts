answer: |-
  Here is the translation of the Principal Principle debate into your calibration and forecasting vocabulary, followed by the residue report and the required JSON summary.

  ### Translation of Concepts

  **1. Objective Chance ($Ch$)**
  *   **Philosophical Claim:** There exists a physical magnitude $Ch(A)$ distinct from any agent's belief, governing the occurrence of event $A$.
  *   **Statistical Restatement:** This is the true parameter $\theta$ of the Data Generating Process (DGP). In your hierarchical models, it is the latent variable governing the distribution of $Y$. It is distinct from the forecast $p_t$ (your model's estimate).
  *   **Mapping:** $Ch(A) \leftrightarrow \theta = P(Y=1 | \text{DGP})$.

  **2. The Principal Principle (PP)**
  *   **Philosophical Claim:** $Cr(A | Ch(A)=x \land E) = x$, where $Cr$ is rational credence and $E$ is admissible evidence.
  *   **Statistical Restatement:** This is a claim about **conditional calibration** under oracle access. If your forecaster conditions on the true parameter $\theta$ (i.e., you know the chance), your forecast $p$ must equal $\theta$ to be calibrated. Formally: $E[Y | p=\theta, \mathcal{I}] = \theta$.
  *   **Mapping:** PP $\leftrightarrow$ The requirement that a forecaster with access to the true DGP parameter must issue probabilities equal to that parameter to satisfy calibration.

  **3. Admissibility**
  *   **Philosophical Claim:** Evidence $E$ is admissible if it does not provide information about the outcome $A$ other than through the chance $Ch(A)$. Information about the future outcome is inadmissible.
  *   **Statistical Restatement:** This is the **no data leakage** constraint. Your information set $\mathcal{I}_t$ (filtration) must not contain $Y_{t+k}$ for $k \geq 0$. Admissible evidence is measurable with respect to the sigma-algebra generated by past outcomes and covariates, excluding the target variable itself.
  *   **Mapping:** Admissibility $\leftrightarrow$ $\mathcal{I}_t \subseteq \sigma(\text{Past}, \theta)$ such that $Y \perp \mathcal{I}_t | \theta$.

  **4. Single-Case Chance**
  *   **Philosophical Claim:** There is a fact of the matter about the chance of a unique, non-repeatable event (e.g., this specific atom decaying).
  *   **Statistical Restatement:** This asserts that a Bernoulli parameter $\theta$ exists for a singleton sequence. In your framework, probability is defined over ensembles (exchangeable sequences or reference classes). Assigning $\theta$ to a single case without a class is a model assumption, not an empirically verifiable property.
  *   **Mapping:** Single-Case Chance $\leftrightarrow$ Asserting a latent parameter $\theta$ for a sample size $N=1$ without assuming exchangeability with other events.

  **5. Analytic vs. Substantive Debate**
  *   **Philosophical Claim:** Is PP a definition of chance (analytic) or a law linking two distinct things (substantive)?
  *   **Statistical Restatement:** Is "true probability" defined operationally as the value that yields calibration (analytic), or is it a realist claim about the existence of a stable DGP parameter $\theta$ that *causes* calibration (substantive)?
  *   **Mapping:** Analytic/Substantive $\leftrightarrow$ Operationalist vs. Realist interpretation of the latent parameter $\theta$.

  ---

  ### Residue Report

  **1. Objective Chance**
  *   **Status:** Distorted.
  *   **What Breaks:** Your vocabulary treats $\theta$ as a model component useful for prediction. Philosophy treats $Ch$ as an ontological commitment independent of modeling. You can always say "the model is misspecified"; Lewis wants to say "the chance is real even if the model is wrong."
  *   **Verdict:** My vocabulary is missing something (ontological commitment).

  **2. The Principal Principle**
  *   **Status:** Clean.
  *   **What Breaks:** Null.
  *   **Verdict:** Null. (It maps directly to calibration conditional on the true parameter).

  **3. Admissibility**
  *   **Status:** Clean.
  *   **What Breaks:** Null.
  *   **Verdict:** Null. (Maps to filtration/no leakage).

  **4. Single-Case Chance**
  *   **Status:** Inexpressible.
  *   **What Breaks:** Your framework requires a reference class or exchangeability sequence to define calibration. A single event has no calibration curve.
  *   **Verdict:** My vocabulary is missing something (or rejects the premise).

  **5. Analytic vs. Substantive**
  *   **Status:** Distorted.
  *   **What Breaks:** In stats, calibration is empirical. Whether it *defines* probability is a meta-interpretation. The philosophical fight is about whether the definition holds necessarily or contingently.
  *   **Verdict:** The original claim was underdetermined (depends on interpretation of probability).

  **Admissibility Counterpart**
  There is a direct counterpart: **Filtration / No Data Leakage.** In your framework, inadmissible evidence is simply information from the test set ($Y_{future}$) leaking into the training set. The philosophical worry about "future chances" maps to non-stationarity: if $\theta_t$ changes, knowing $\theta_{t+1}$ gives info about $Y_{t+1}$ not contained in $\theta_t$. Your framework handles this via covariate shift or time-varying parameters; Lewis handles it via admissibility restrictions.

  **Single-Case Chance**
  Your framework cannot validate single-case chances. Calibration is an asymptotic or ensemble property. You can posit a hierarchical prior for a single event, but you cannot backtest it. The philosophical claim asserts a truth value where your framework asserts a model assumption. This is not a failure of your math, but a difference in ontology: you require a collective; they assert a propensity.

  **Smuggling Risk**
  The highest risk is defining "Chance" as "The value that calibrates the forecaster." If you do this, the Principal Principle becomes a tautology (Analytic). Lewis wants Chance to be independent of the forecaster. To avoid smuggling, you must treat $\theta$ as a fixed property of the DGP that exists even if no forecaster ever attempts to calibrate to it.

  **Dissolved Disagreements**
  *   **The "Mystery" of Chance:** Much of the metaphysical worry dissolves if you treat Chance as the latent parameter in a well-specified hierarchical model. The "normative force" of PP is just the requirement to minimize proper scoring rules given the true parameter.
  *   **Admissibility Confusion:** The philosophical confusion about what counts as admissible often dissolves when framed as "information independent of the outcome conditional on the parameter."

  **Irreducible Disagreement**
  The ontological status of probability for non-repeatable events. Your framework says probability is undefined or purely subjective for a singleton without exchangeability. Lewis says objective chance exists regardless. This is a realist vs. instrumentalist divide that no amount of calibration theory can bridge.

  **Bottom Line**
  The analytic/substantive fight looks like a choice between operationalist vs. realist interpretations of the latent parameter. If you define chance by calibration, PP is trivial; if you define it by physical propensity, PP is a substantive hypothesis about the link between physics and rational belief.

