  Third-year stats PhD here — I work on calibration of probabilistic forecasts, mostly clinical risk models, some weather. So my native vocabulary is proper scoring rules, calibration curves and reliability diagrams, backtesting, exchangeability, hierarchical priors, reference classes. My partner is in philosophy and drags me to the phil-sci seminar occasionally, and last week somebody gave a talk on Lewis's Principal Principle and I have not been able to stop thinking about it tho I only followed maybe half of it. From what I gathered: there's supposed to be an objective chance, a real physical magnitude in the world, not just somebody's opinion. And the Principal Principle says something like — if you know the chance of an event, and the rest of your evidence is "admissable" (this is the part I lost), then your credence in that event ought to just equal the chance. And then apparently there's a live fight about whether that's a substantive constraint you could in principle violate, or whether it's closer to a definition: chance just *is* whatever quantity rational credence defers to, so the principle is true by construction and the whole thing is trivial. Somebody in the audience said something about it being analytic and the speaker got annoyed.

  What I want is an honest translation of this whole mess into the vocabulary I actually use — not an analogy, not a "here's the intuition" explainer, an actual mapping. What plays the role of chance when all I have is a forecaster, a loss function, and a sequence of events? Is the Principal Principle just a claim about *conditional* calibration — i.e. once you condition on the right covariate, a calibrated forecaster's probabilities have to match that covariate's value — or is it more or less than that? What happens to the admissibility restriction? Because in my framework every piece of information is just conditioning information; there's no such thing as inadmissible evidence, you just get scored on whatever you conditioned on, and I can't see what would make one conditioning set illicit and another fine. Does that restriction have a counterpart at all, or is it doing work my formalism simply can't state? And single-case chances — the chance of this particular atom decaying, with no reference class and no repeat — my calibration concepts are properties of a forecaster over many events, so I'm not sure they even apply.

  Then the residue report, which is the part I actually care about. For every claim you translated, tell me whether it comes over cleanly, comes over only with distortion (and what got bent to fit), or has no counterpart in my framework at all. For the third bucket, say which side has the problem: is my vocabulary missing a concept I ought to want, or was the philosophical claim less determinate than it sounded in the talk? Please don't smuggle frequentist or calibration assumptions in at the start and then announce at the end that chance turned out to be calibration all along — I want to know where you had to fudge, and I'd rather you flag it than paper over it. Also point out anywhere you think the two sides are just talking past each other and the disagreement dissolves under relabeling, and — separately, since this cuts the other way — anywhere there's a genuine substantive disagreement that my formalism structurally cannot capture. No reading list or citations, I'm on a train and couldn't look anything up even if you gave them to me.

  Finish with a JSON object, nothing after it, using exactly this schema:

  - `"items"`: array of objects, one per claim you translated, each with `"claim"` (the original philosophical claim, in their words), `"restatement"` (your best rendering in calibration/scoring-rule vocabulary), `"status"` (one of `"clean"`, `"distorted"`, `"inexpressible"`), `"what_breaks"` (string, or null if clean), `"verdict"` (only for distorted/inexpressible: one of `"my vocabulary is missing something"`, `"the original claim was underdetermined"`, `"real gap, both frameworks are fine"`, or null).
  - `"admissibility_counterpart"`: string — either the counterpart, or an explicit statement that there isn't one and why.
  - `"single_case_chance"`: string — what your framework can and can't do with a one-off.
  - `"smuggling_risk"`: string — where your translation was most likely to presuppose the conclusion.
  - `"dissolved"`: array of strings — disagreements that vanish under relabeling.
  - `"irreducible"`: string — the one disagreement that survives everything, if there is one; otherwise say so plainly.
  - `"bottom_line"`: string, two or three sentences max, on whether the analytic/triviality fight looks different once it's in my language.
