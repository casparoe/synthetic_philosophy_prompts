          2.  Middle: Fix contradictions in will (frustrating ends). Harder sell, higher price.
          3.  Premium: Humanity as ends in themselves + "Kingdom of Ends" network membership (vague benefits).
      *   **Tone/Style:** Professional-services marketing (reassuring, legalistic, allergic to commitment). Deadpan. No winking. No mocking Kant. No anachronism. Comedy from correct handling of the apparatus.
      *   **Specific Content Requirements:**
          1.  Two anonymized case studies (one successful over-specification, one failed/evasive).
          2.  One testimonial (satisfied), one complaint (damaging but unintentional).
          3.  Small print: Firm's founding maxim (which fails the test because it relies on non-universalization).
          4.  Sidebar: Services declined (morality vs. prudence).
          5.  No real philosopher's words in quotation marks (paraphrase only).
      *   **Length:** 700-800 words.
      *   **Format:** Brochure copy (headings, price list, bullets, small print).

  2.  **Drafting - Section by Section:**

