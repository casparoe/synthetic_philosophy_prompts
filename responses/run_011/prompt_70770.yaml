      Let's go with: "Founding Principle: The partners act on the maxim: 'I will provide formal validation of duty to others while reserving the right to suspend my own duties when commercially necessary.'" If everyone did this, duty is meaningless.

      *Wait, one more check:* "No real philosopher's words inside quotation marks." I must ensure I don't quote the Groundwork. I can use terms like "universalizability test" as common nouns.

      *Let's write.*

