          *   Good: "Saved my reputation."
          *   Bad: "You fixed my maxim but I still feel guilty." (Shows the emptiness).
      *   **Sidebar:** Declined services. Prudence vs. Morality. "We do not advise on happiness."
      *   **Small Print:** The firm's maxim. "We advise only those who can pay." (If everyone did this, no one would be advised). Or "We maximize profit by selling universalizability." Let's go with: "We offer these services to all who can afford them, excluding those who cannot." If universalized, no one could afford them? Or "We reserve the right to select clients based on profitability." If everyone did that, the market collapses. Let's try: "We act only on maxims that secure our firm's continuity." If everyone acted only on firm continuity, the concept of service dissolves. Better: "We provide moral clearance exclusively to clients whose fees exceed our operational costs." If universalized, no one gets clearance unless they pay, but the *service* relies on there being people who *need* clearance but can't get it? No, the prompt says the maxim fails because efficacy depends on most people *not* doing what the firm does.
      *   *Correction on Small Print:* The firm's *own* founding maxim. "We shall offer moral validation only to those who pay for it." If everyone offered moral validation only for pay, the concept of moral validation loses authority? Or "We shall exploit the gap between moral aspiration and moral rigor."
      *   *Refined Small Print:* "We operate on the principle: 'I will provide ethical clearance only when compensated, while relying on the general population to remain uncompensated in their moral duties.'" If everyone did this, morality becomes a commodity and the system breaks.
      *   *Actually, simpler:* "We will maximize our billing hours regardless of the client's ultimate moral improvement." If everyone did this, trust collapses.
      *   *Best fit for prompt:* "The efficacy depends on most people not doing what the firm does."
      *   *Idea:* "We will sell exceptions to the universal law." If everyone sold exceptions, there are no laws.
      *   *Idea:* "We will maintain our practice by ensuring others remain confused about their duties."
      *   *Let's go with:* "We act on the maxim: 'I will provide formal validation of moral conduct to those who pay, while assuming the majority of agents will continue to act out of unvalidated duty.'" If everyone provided validation for pay, the validation means nothing.

      *   **Word Count Check:** Need to be careful. 700-800 words is tight for all this content. I need to be concise.

      *   **Tone Check:** Deadpan. Corporate speak. "Optimizing moral risk." "Compliance."

      *   **Philosopher Quotes:** Do not quote Kant directly. Use phrases like "contradiction in conception," "kingdom of ends," "humanity as end."

  3.  **Drafting - Step-by-Step:**

      *   *Name:* Kranz & Partner: Büro für universelle Maximen.
