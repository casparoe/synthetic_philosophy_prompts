      *   *Contradiction:* They admit the *people* didn't vanish, just the political structure.
      *   *Philosophical Issue:* What is the "thing" (society) that is dying? Is it the population or the structure?
      *   *Paleo Analogy:* True vs. Pseudoextinction (anagenesis/cladogenesis vs. disappearance).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise. Validate the insight. It's a sharp observation about reification.

      *   **1. The Implicit Ontology: Society as Structure/System:**
          *   If the date of the last stela = date of collapse, the "society" is defined functionally by its *complexity* or *state apparatus*.
          *   It treats the polity as a distinct entity separable from the populace.
          *   Ontological commitment: A society is a *system of relations* (hierarchy, redistribution, monumentality) rather than a *collection of organisms*.
          *   This aligns with Systems Theory (Tainter, etc., though I won't cite specific books unless sure, better to describe the *logic*).
          *   *Rival Accounts Ruled Out:*
              *   *Demographic Ontology:* Society = People. (Ruled out because people stayed).
              *   *Cultural/Praxis Ontology:* Society = Shared habits/language/kinship. (Ruled out because Maya culture persisted).
              *   *Phenomenological Ontology:* Society = Mutual recognition. (Ruled out because communities likely persisted).

      *   **2. Consistency & Underdetermination:**
          *   *Is it inconsistent?* No, not internally. It depends on the definition of "Collapse." If "Collapse" = "Loss of Sociopolitical Complexity," then the stela date is accurate. The "inconsistency" is linguistic (using "Maya Collapse" implies "Maya People Died" to the layman).
          *   *Underdetermination:* This is key.
              *   *Theory A:* Elite capture of surplus. (No elites = no monuments).
              *   *Theory B:* Ideological shift. (Elites exist but stop building stone).
              *   *Theory C:* Material scarcity. (No stone/lime available).
              *   All three yield the *same measurement* (no stelae) but imply vastly different ontological states of the "society." The measurement underdetermines the *cause* and the *nature* of the change.

      *   **3. The Paleontological Analogy (True vs. Pseudoextinction):**
          *   *The Fit:* It's remarkably strong.
          *   *Pseudoextinction:* Lineage continues, diagnostic traits change.
          *   *Collapse:* Population continues, diagnostic traits (monuments/state) vanish.
          *   *The Break:*
              *   *Biological Species:* Defined by reproductive continuity + morphology.
              *   *Societies:* Defined by... what? If defined by structure, it's a *true* extinction of the structure. If defined by people, it's a *pseudo* extinction.
              *   *Crucial Difference:* Biological lineages don't have "agency" to choose to stop expressing traits (mostly). Societies can *choose* to stop building monuments (ideological shift).
              *   *Anagenesis:* In bio, A becomes B. In collapse, often Complex A becomes Simple A. It's not necessarily evolution into a new named species; it's often devolution (normatively speaking) or simplification.
              *   *Verdict:* The analogy holds for the *taxonomic error* (naming the unit by transient traits), but breaks on *lineage continuity mechanisms*.

      *   **4. Alternative Ontology (Society = Wellbeing/People):**
          *   *Practice Change:* Shift from monuments to bioarchaeology (stature, enamel hypoplasia, trauma, settlement density).
