answer: |-
  This is a remarkably sharp diagnosis. You have identified a reification error that sits at the heart of processual and post-processual archaeology alike. You are asking for the metaphysical commitments required to make the measurement valid, and then testing those commitments against the explicit caveats the practitioners offer.

  Here is the reconstruction of the implicit ontology, the testing of your paleontological analogy, and the evaluation of the value claims involved.

  ### 1. The Implicit Ontology: Society as a Political Organism
  For the date of the last monument to serve as the *death certificate* of a society, the following ontological commitments must be true:

  *   **The Polity is the Unit of Selection:** The "society" is not the population (the biomass), nor the culture (the memetic load), but the *political superstructure*. It treats the state apparatus as a distinct organism that supervenes on the population but is not identical to it.
  *   **Complexity is Essence, Not Accident:** The capacity to mobilize surplus for non-subsistence activities (monuments, writing, long-distance trade) is treated as the *diagnostic character* of the society. If that character is lost, the entity ceases to exist, even if the substrate (the farmers) remains.
  *   **Visibility Equals Existence:** There is a positivist commitment that if a social relation does not leave a material trace resolvable by current survey methods, it effectively did not exist. A kingship that leaves no stelae is ontologically indistinguishable from no kingship at all.

  **Rival Accounts Ruled Out:**
  *   **The Demographic Account:** (Society = People). Ruled out because the "collapse" is dated while the population persists.
  *   **The Phenomenological Account:** (Society = Mutual Recognition). Ruled out because communities likely continued to recognize each other as Maya, even without kings.
  *   **The Continuity Account:** (Society = Transmitted Practices). Ruled out because pottery styles, language, and agriculture often continue through the "collapse" horizon.

  **Is the Field Inconsistent?**
  No, but it is equivocal. The practice is consistent with a definition of "Society" as "Complex State." The inconsistency is linguistic, not ontological. When they write "The Maya Collapsed," they mean "The Classic Maya Polity Collapsed." When they say "The Maya didn't vanish," they mean "The Maya Ethno-linguistic Group didn't vanish." They are using the same proper noun ("Maya") to refer to two different ontological units (The State vs. The People). The discussion section disclaimer is an attempt to patch this linguistic slippage, but it admits that the measurement (last stela) does not measure the survival of the people, only the survival of the *project* of kingship.

  ### 2. Philosophical Underdetermination
  You asked where different theories license the same measurements. The silence of the archaeological record is radically underdetermined. The cessation of monument building supports at least three incompatible ontological scenarios:

  1.  **Systemic Failure:** The political apparatus was incapable of mobilizing labor (the standard "collapse" narrative).
  2.  **Ideological Shift:** The apparatus remained intact, but the new elite faction rejected monumental lithics as a mode of legitimacy (e.g., shifting to perishable materials or different ritual technologies).
  3.  **Strategic Withdrawal:** The elite intentionally stopped dating monuments to avoid providing propaganda for rivals during a period of instability (a "dark age" by design).

  All three yield the exact same curve: a drop to zero in dated stones. The measurement presupposes that *willingness* and *ability* to carve stone are perfectly correlated with *political existence*. That is a theoretical assumption, not an empirical fact.

  ### 3. Testing the Paleontological Analogy: True vs. Pseudoextinction
  Your intuition here is robust. The analogy holds significant explanatory power but breaks at the mechanism of continuity.

  **Where it Holds:**
  *   **Diagnostic Characters:** In paleontology, we often name a species by a specific shell morphology. If the lineage survives but the shell smooths out (due to environmental plasticity or selection), we might call the original species "extinct." This is pseudoextinction via anagenesis.
  *   **Archaeological Parallel:** We name the "Classic Maya" by specific diagnostic characters (Long Count dates, corbelled vaults, specific iconography). When those traits vanish, we declare the "Classic Maya" extinct.
  *   **The Taxonomic Artifact:** In both cases, the "extinction" is partly an artifact of the classifier's need for diagnostic boundaries. The continuity of the genetic lineage (DNA) or the cultural lineage (language/kinship) is ignored in favor of the morphological signal.

  **Where it Breaks:**
  *   **Reproductive vs. Ideological Continuity:** Biological lineages are held together by reproductive isolation and genetic inheritance. Societies are held together by *ideology* and *coercion*. A biological lineage cannot "choose" to stop expressing a trait (barring plasticity). A society can *choose* to stop building temples.
  *   **The Nature of the Descendant:** In pseudoextinction, Species A evolves into Species B. In societal collapse, Complex Society A often devolves into Simple Society A. It is not necessarily a speciation event; it is often a loss of traits without a gain of new diagnostic ones. It is more akin to a population surviving a bottleneck and losing genetic diversity than it is to anagenesis.
  *   **Agency:** The "pseudoextinction" in biology is blind. The "pseudoextinction" of the Classic Maya involves human agents deciding that the "diagnostic characters" (kingship) are no longer worth the cost.

  **Verdict:** The analogy is sound regarding the *taxonomic error* (confusing the trait with the lineage). It fails regarding the *mechanism* (biological necessity vs. political choice).

  ### 4. Alternative Ontology: Society as Wellbeing
  If you swap the ontology to "Society = The members and their biological/cultural flourishing," the practice changes fundamentally.

  *   **Proxies:** You stop counting stelae and start counting enamel hypoplasias, Harris lines, stature, trauma indicators, and settlement density (via lidar or survey).
  *   **Resolution:** You correctly identify the resolution problem. A stela can be dated to a specific *katun* (20 years). A skeleton in a midden is often dated to a century or more via C14 or stratigraphy.
  *   **Consequence:** "Collapse" ceases to be an *event* and becomes a *gradient*. You cannot draw a line at 850 CE. You get a curve of declining health starting at 750, bottoming at 900, recovering at 1000.
  *   **Does it undercut the project?** It undercuts the *dramatic* project of "Collapse." It makes the history less about a cliff-edge and more about a recession. It renders the "date of collapse" scientifically meaningless, replacing it with "period of maximum stress." This is why the field resists it: it kills the narrative hook.

  ### 5. The Smuggled Value Claim
  There is a profound normative claim buried in the practice: **Complexity is Good; Simplification is Bad.**

  By labeling the cessation of monument building as "Collapse" (a negative term implying failure) rather than "Simplification" or "Reorganization" (neutral terms), the field presupposes that the investment of surplus into elite projects is the telos of that society.
  *   If the peasants were starving to build the temples, the end of the temples might be a *liberation*, not a collapse.
  *   If the "collapse" correlates with improved skeletal health (as seen in some Post-Classic transitions), the term "collapse" is a value judgment on the *political structure*, projected onto the *population*.
  *   It assumes that history is the history of States, not the history of People.

  ### 6. What Would Change My Mind & Critique of Your Framing

  **What would change my verdict on the ontology:**
  I would shift my view if there were evidence that the *population itself* identified the cessation of monument building as the end of their world. If we found graffiti or post-collapse oral traditions (recorded later) that explicitly said, "When the stones stopped, we ceased to be Who-We-Are," then the ontological link between the monument and the society would be emic (insider) rather than etic (outsider). Currently, the link is imposed by the archaeologist, not the subject.

  **Where your framing might lead you astray:**
  Your framing relies on the idea that there is a "true" unit out there (the society) that we are misidentifying, similar to a biological species.
  *   **The Trap:** In biology, the species has a material reality (gene flow). In sociology/history, "society" is *always* a heuristic. There is no "real" society independent of the boundaries we draw.
  *   **The Correction:** The error isn't just taxonomic (naming the wrong unit); it's categorical. We are treating a *process* (political integration) as a *thing* (the State).
  *   **Pseudoextinction Nuance:** In paleontology, pseudoextinction implies the lineage *survives*. In collapse studies, often the *political* lineage truly dies (the dynasty ends), even if the *people* survive. So it is a **True Extinction of the Polity** coupled with a **Pseudoextinction of the Culture**. Your analogy risks conflating the two. The "Classic Maya" (the political entity) *did* truly go extinct. The "Maya People" did not. The confusion arises because we use the same name for both.

  **Summary:**
  You are not asking a naive question; you are asking a foundational one. The practice presupposes that a society is defined by its peak energy consumption and political centralization. It treats the state as the organism and the people as the cells. When the brain dies, we call the organism dead, even if the body twitches on for centuries. Your paleontological instinct is correct: we are diagnosing the extinction of a *morphology* (complexity) and calling it the extinction of the *lineage* (the people). The field is not inconsistent, but it is politically committed to the idea that Complexity is the only metric of historical success.
