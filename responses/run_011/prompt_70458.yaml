  **MEMORANDUM**

  **TO:** Charter Review Commission Members
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Electoral System Amendment (Meeting of the 14th)

  ### Executive Summary

  We have four meetings to resolve the most consequential decision in this commission's history. The choice is not merely "proportional vs. districts." It is a choice between two different equity claims that currently point in opposite directions.

  *   **Black voters (24%):** Have secure representation (2 seats) under the current single-member district (SMD) map due to geographic concentration.
  *   **Latino voters (31%):** Have zero representation under SMD due to geographic dispersion. No SMD map fixes this.

  Moving to a proportional system unlocks seats for Latino residents but introduces risk to Black representation unless the new map is drawn with specific constraints. Moving to At-Large systems maximizes mathematical proportionality but severs the neighborhood link our civic infrastructure relies on.

  **Recommendation:** I propose we advance **Three 3-Member Wards using Single Transferable Vote (STV)**, conditioned on **Charter-mandated Redistricting Criteria** that prioritize keeping the Southside communities of interest intact within a single ward. We should target implementation for the **2027 election cycle** with no phase-in.

  This memo details the arithmetic, the legal exposure, and the political trade-offs required to make this work.

  ---

  ### I. The Arithmetic of Representation

  We must be precise about what each system delivers. The "Droop Quota" (votes needed to guarantee a seat) drives the outcomes.

  #### 1. Status Quo: 9 Single-Member Districts (FPTP)
  *   **Black Voters:** Concentrated at 60% in two districts. **Outcome:** 2 Seats (Secure).
  *   **Latino Voters:** 31% citywide, but <33% in every district. **Outcome:** 0 Seats (Structural lockout).
  *   **Verdict:** Protects established Black representation; perpetuates Latino dilution.

  #### 2. Proposal: 3 Wards × 3 Seats (STV)
  *   **Quota:** 25% + 1 vote per ward.
  *   **Black Voters:**
      *   *The Risk:* The two current Southside districts comprise ~22% of the city. A new STV ward comprises 33% of the city. If we merge the two Southside districts into one STV ward, the Black voting share in that ward drops from 60% to approximately **40%** (assuming non-Southside areas added to the ward are not heavily Black).
      *   *The Math:* With 40% of the vote, a cohesive bloc clears the first quota (25%) easily. To win a *second* seat, they need to clear 50% OR clear 25% again via transfers. With 40%, they have a 15% surplus after the first seat. They need ~10% in transfers from allies to elect a second councilor.
      *   *Outcome:* **1 Seat Guaranteed, 2nd Seat Contingent** on coalition-building and transfer patterns.
  *   **Latino Voters:**
      *   *The Opportunity:* 31% citywide, distributed evenly (25–33% per ward).
      *   *The Math:* They clear the 25% quota in *all three* wards.
      *   *Outcome:* **Up to 3 Seats**, contingent on voter cohesion (avoiding vote-splitting among multiple Latino candidates).
  *   **Verdict:** Swaps guaranteed Black seats for probable Latino seats. Net gain in diversity, but introduces risk for the Southside.

  #### 3. Alternative: At-Large Cumulative Voting (9 Seats)
  *   **Quota:** ~10% + 1 vote citywide.
  *   **Black Voters:** 24% citywide. Can concentrate votes to elect **2 Seats** securely (needs ~20%).
  *   **Latino Voters:** 31% citywide. Can concentrate votes to elect **3 Seats** securely (needs ~30%).
  *   **Verdict:** Mathematically superior for equity. Politically difficult due to loss of neighborhood representation.

  ### II. The Core Tension (The "Wrinkle")

  We have not yet acknowledged that the equity case for Black residents and the equity case for Latino residents are currently in tension.

  *   **The Southside Argument (Against STV):** "Under SMD, 60% concentration guarantees our voice. Under STV, 40% concentration makes it contingent. You are asking us to trade a lock for a lean. If the map cracks the Southside across multiple wards, our representation drops to zero. If it packs us into one ward, we rely on white progressives to transfer votes to us for our second seat. This is retrogression."
  *   **The Latino Argument (For STV/Cumulative):** "Under SMD, we are permanently locked out. 31% of the city deserves 3 seats, not zero. Any system that keeps SMD is codifying second-class citizenship. We cannot wait for a map that doesn't exist."

  **My Assessment:** STV is the only viable path that addresses Latino dilution without fully abandoning geographic accountability. However, it is only viable if we mitigate the Southside risk through map-drawing rules.

  ### III. Legal Exposure & Record Building

  We are not lawyers, but the record we build over the next four meetings determines whether this amendment survives a challenge.

  *   **Retrogression Risk:** If we move from SMD to STV and Black representation drops from 2 seats to 1, that is prima facie retrogression. A court will look at *opportunity*, not just results.
  *   **The Remedy Defense:** We can argue STV is a remedy for Latino vote dilution (Section 2 risk under current SMD).
  *   **What the Record Needs:**
      1.  **Polarization Data:** We need evidence that Latino voting power is currently diluted *because* of the electoral system, not just demographics.
      2.  **Intent:** Minutes must show we considered the impact on Black voters and took steps to minimize it (i.e., the mapping criteria below).
      3.  **No "Cracking":** We must explicitly reject any map that splits the Southside community of interest across multiple wards.

  ### IV. Charter Language & Redistricting Criteria

  If we recommend STV, the Charter amendment cannot just say "3 Wards." It must constrain how those wards are drawn. I propose we recommend the Council adopt the following binding criteria for the redistricting commission:

  1.  **Priority 1:** Wards must be contiguous and equal in population.
  2.  **Priority 2:** **Communities of Interest.** The Commission shall prioritize keeping the historic Southside neighborhoods intact within a single ward to preserve minority voting strength.
  3.  **Priority 3:** Competitiveness and geographic compactness.

  *Note: This elevates "Community of Interest" above "Competitiveness." This is deliberate. It forces the mapdrawers to keep the Southside together, maintaining the 40% concentration needed for STV to work.*

  ### V. Transition & Timing

  *   **Clock:** Target the **2027 General Election**.
  *   **Phase-In:** **No.** A phased rollout (e.g., electing some seats at-large, some by district) creates two classes of councilors and confuses the electorate. It also looks like entrenchment.
  *   **Incumbents:** Seven incumbents will face a changed landscape. Some may be paired in the same ward. This is unavoidable.
  *   **Civic Infrastructure:** Neighborhood associations currently organize by district. We must fund a voter education campaign specifically on how to rank candidates and how ward boundaries are changing.

  ### VI. The Losing Side at Full Strength

  To ensure we are not deluding ourselves, here are the strongest arguments against my recommendation:

  **If we choose STV (My Recommendation):**
  The Southside Commissioners are correct that 40% in a ward is not 60% in a district. In a polarized election, if the non-Black 60% of the ward coalesces around a single candidate, and Black voters split their first-preference votes among two candidates, the Black community could elect *one* seat instead of two. STV relies on transfer patterns that assume a level of cross-racial coalition building that may not exist yet. We are betting on a political culture shift that hasn't happened.

  **If we choose SMD (The Status Quo):**
  Latino advocates are correct that SMD is a mathematically closed door. With 31% of the vote and 0% of the seats, the city is exposed to significant liability under voting rights principles. Keeping SMD preserves stability for the Southside but condemns the Latino community to permanent minority status regardless of population growth. It prioritizes the equity of the past over the equity of the future.

  **If we choose At-Large Cumulative:**
  Neighborhood advocates are correct that this severs the link between a councilor and a specific geography. In a nonpartisan election, it favors candidates with citywide name recognition and money, potentially disadvantaging grassroots organizers in the Southside who rely on door-knocking in a defined area. It solves the math problem but creates a governance problem.

  ### VII. Bottom Line & Action Items

  **Recommendation:** Move forward with **3 Wards / STV**, but condition the recommendation on the adoption of the **Redistricting Criteria** listed in Section IV.

  **Action Items for Next Meeting (The 14th):**
  1.  **Vote to Draft:** Authorize staff to draft charter language for 3 Wards / STV.
  2.  **Mandate Criteria:** Direct staff to include the "Southside Integrity" clause in the redistricting guidelines.
  3.  **Fund Education:** Allocate budget for a voter education plan focused on transferable voting and map changes.
  4.  **Timeline:** Set 2027 as the hard implementation date.

  This path acknowledges the momentum for STV while installing the guardrails necessary to prevent retrogression. It is not risk-free, but it is the only path that offers a remedy for Latino dilution without explicitly sacrificing Black representation.

  **[Your Name]**
  Charter Review Commission
