answer: |-
  Here is some thinking out loud about what this question is actually doing before I commit to the final text. The core tension here is between computational realism and instrumentalism, but specifically tailored to the individuation of computational states. If I just ask about triviality, students will regurgitate Putnam. If I ask about Chinese Room, they will regurgitate Searle. This case forces them to confront the gap between syntactic implementation and semantic content. The tricky part is ensuring they don't just say science will figure it out. They need to argue about what makes a computational description correct in the first place. Is it just causal structure, or does it require content? If causal structure underdetermines the computation, and content is what distinguishes the two descriptions, then computationalism either fails to explain content or admits that computation is observer-relative. A top answer needs to realize that causal constraints might not be enough if both descriptions fit the counterfactuals. They need to discuss whether the implementation relation is supposed to fix content or just syntax. If it's just syntax, computationalism might be safe but explanatorily weak. If it's content, this case kills it. I also need to watch out for students who try to solve this with externalism, since the prompt rules out an outside interpreter. They need to stick to the internal metaphysics of the system.

  Here is the question exactly as it would appear on the exam paper.

  Consider a scenario in which a neuroscientist demonstrates that a creature's neural dynamics admit two distinct computational descriptions. Both descriptions fit the actual causal structure equally well, satisfying every counterfactual dependency one could check. However, they disagree fundamentally about content. Under the first description, the system carries representations with determinate propositional contents and performs belief-desire style inference. Under the second, it is a hierarchical prediction machine whose states are merely error-signalling parameters, possessing no content in the first sense. There is no outside interpreter to appeal to in either case, and no third description that both are approximating. Is this scenario a genuine problem for the claim that the brain is literally a computer, or is it merely a verbal redescription? Discuss what would have to be true for this to be a substantive metaphysical problem rather than a pragmatic choice of models. Specifically, evaluate whether causal and counterfactual constraints on implementation can do the tie-breaking work here, and argue whether fixing content is even part of the job description of an implementation relation. What could possibly settle which description is correct, or is correctness a confused thing to be asking for in this context?

  Here is a model answer that would receive full marks.

  This scenario presents a profound challenge to computational realism by exposing a gap between causal implementation and semantic individuation. If the brain is literally a computer, there should be a fact of the matter about which computation it is performing. However, if two computational descriptions fit the physical causal structure equally well, including all counterfactuals, then the physical facts alone do not individuate the computation. This suggests that computational individuation is not fixed by the mechanism alone. For this to be a genuine problem rather than a verbal dispute, one must assume that computationalism makes an ontological claim about the brain's nature, not just a predictive claim about its behavior. If computationalism is merely instrumentalism, then the choice between descriptions is pragmatic, and there is no problem. But if computationalism aims to explain cognition via content-bearing states, the indeterminacy is fatal.

  The core issue is whether causal and counterfactual constraints can resolve the indeterminacy. Typically, the implementation relation requires that the physical states map to computational states such that causal transitions mirror logical transitions. In this case, both descriptions satisfy this constraint. The belief-desire model maps neural states to propositions and causal transitions to inferences. The prediction machine model maps neural states to parameters and transitions to error minimization. Since both map perfectly to the causal structure, syntax alone cannot break the tie. This implies that the implementation relation, defined purely mechanistically, underdetermines the computational identity. Therefore, causal constraints cannot do the tie-breaking work here because the physical facts are ex hypothesi compatible with both computational narratives.

  This leads to the question of whether fixing content is part of the implementation relation's job. If implementation is purely syntactic, then content is external to the computation itself. On this view, the brain computes regardless of whether we interpret it as having beliefs or error parameters. However, this weakens computationalism significantly. If the computation does not fix the content, then computational explanation cannot explain intentional action, which relies on specific content. If the brain computes belief-desire inferences, it explains why I reach for water when I believe it is there. If it merely minimizes error parameters, the link to intentional action is obscure. Thus, for computationalism to explain cognition, content must be intrinsic to the computational description. But if content is intrinsic, and the physical structure supports two incompatible content assignments, then there is no fact of the matter about what the brain is computing.

  Consequently, nothing could settle which description is correct if we restrict ourselves to internal physical and causal facts. One might appeal to teleology or evolutionary history to fix content, but the prompt excludes outside interpreters and implies a focus on the current causal structure. If no internal or historical fact breaks the tie, then correctness is indeed a confused notion here. This supports an instrumentalist view where computational descriptions are tools rather than discoveries of mind-independent kinds. For computational realism to survive, it must posit a principle of individuation beyond causal structure, perhaps involving normative constraints on function. Without such a principle, the claim that the brain is literally a computer collapses into the claim that the brain can be modeled as one, which is a significantly weaker thesis. The scenario thus demonstrates that without a robust account of how content is fixed by mechanism, computationalism cannot sustain its ontological ambitions.

  Here is the marking scheme written as paragraphs in an email.

  To earn the full 25 marks, students must demonstrate a clear grasp of the metaphysical stakes involved in computational individuation. Students will receive 5 marks for correctly identifying that the core problem is the underdetermination of computational identity by physical causal structure. They need to state clearly that if both descriptions fit the physics equally well, the physical facts do not dictate which computation is occurring. A solid B answer will note this indeterminacy, but an A answer will explicitly distinguish between computational realism and instrumentalism here, noting that the problem only exists if one assumes there is a fact of the matter about which computation is real. Students earn another 5 marks for their analysis of causal and counterfactual constraints. They must argue that since both descriptions satisfy the counterfactual dependencies, syntax and causal structure alone cannot resolve the tie. Common errors that will cost marks here include claiming that neuroscience will eventually find the real one without explaining what makes it real, or reverting to triviality arguments about any system being a computer, which misses the point that only these two specific descriptions are in play.

  The next 5 marks are allocated for discussing the role of content in the implementation relation. Students need to argue whether implementation is supposed to fix content or just syntax. If they argue that implementation is purely syntactic, they must acknowledge the cost to computational explanation of cognition. If they argue content is intrinsic, they must explain how it is fixed given the indeterminacy. Top answers will note that if content is not fixed by implementation, computationalism fails to explain intentional action. Another 5 marks are awarded for the conclusion regarding correctness and realism. Students should argue that if no internal or historical fact breaks the tie, correctness is likely a confused notion, pointing toward instrumentalism. They earn these marks for recognizing that without a normative or teleological principle, the ontological claim fails. Finally, 5 marks are reserved for overall coherence, clarity, and structure. The essay must flow logically from the problem statement to the analysis of constraints, then to the content issue, and finally to the metaphysical conclusion. A disjointed essay that hits the points but lacks argumentative flow will lose marks here, while an essay that integrates the points into a sustained argument will secure the full allocation.
