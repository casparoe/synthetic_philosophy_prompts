      *   **Licenses/Forbids (Strict Propriety & Dominance):**
          *   *Strict Propriety:* Means you maximize expected accuracy by reporting your true credence. If the analysts *believed* their credences (based on the evidence they had), propriety says they were rational to report high confidence. It doesn't criticize being wrong if the evidence was bad. It criticizes *misreporting* confidence (sandbagging or hyping).
