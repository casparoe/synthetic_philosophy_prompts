answer: |-
  Teacher's Map Corrections
  - Vaiśeṣika: Originally accepted only Perception and Inference (2). They later merged with Nyāya and adopted the 4-fold system.
  - Recognition: No major school counts Recognition (*pratyabhijñā*) as a separate *pramāṇa*. Nyāya reduces it to Perception aided by Memory.
  - Reliability: Nyāya says validity is established *after* (extrinsic); Mīmāṃsā says it is built *in* (intrinsic). This affects the "Cost" on the Testimony leaves.
  - Sentence Conditions: Nyāya adds "Speaker's Intent" (*tātparya*) as a 4th condition for Testimony; Prābhākara Mīmāṃsā rejects this.
  - Nyāya Perception: "Extraordinary" and "Yogic" perception are sub-types of Perception, not separate leaves.

  Decision Tree: Sources of Knowledge (Pramāṇa)

  1. Is this knowledge coming from a past experience you are recalling right now, without fresh sensory contact?
      - Yes → Not a Source (Memory/Smṛti)
          - Schools: All agree memory is not a fresh source.
          - Cost: You are relying on past knowledge, not generating new knowledge.
      - No → Go to 2
  2. Did your senses (eyes, ears, skin) directly contact the object itself?
      - Yes → Perception (pratyakṣa)
          - Schools: All accept (Cārvāka only accepts this). Nyāya includes extraordinary/yogic cases here.
          - Cost: Limited to present, sensible objects; cannot know abstract truths directly.
      - No → Go to 3
  3. Did you learn this because someone told you using words (spoken or written)?
      - Yes → Go to 4
      - No → Go to 5
  4. Do you trust these words because the speaker is reliable, or because the words are sacred/authorless?
      - Reliable Person → Testimony (śabda) - Human
          - Schools: Nyāya, Sāṃkhya, Vedānta.
          - Cost: Requires checking speaker competence/honesty (Nyāya) OR accepts words as self-valid if conditions met (Mīmāṃsā). Conditions: Words must fit together, be compatible, be contiguous, and convey intent (Nyāya).
      - Sacred/Authorless → Testimony (śabda) - Vedic
          - Schools: Mīmāṃsā, Advaita Vedānta.
          - Cost: Requires accepting authorless authority as intrinsically valid without checking a speaker.
  5. Did you figure this out because you saw a sign that is always connected to the thing?
      - Yes → Inference (anumāna)
          - Schools: All except Cārvāka.
          - Cost: Requires prior knowledge of the universal connection between sign and thing.
  6. Did you figure this out because you matched a description to a new thing?
      - Yes → Comparison (upamāna)
          - Schools: Nyāya, Mīmāṃsā (Independent). Buddhists, Sāṃkhya (Reduce to Inference/Testimony).
          - Cost: Requires prior description and later encounter; useless without both.
  7. Did you figure this out because the facts make no sense unless this is true?
      - Yes → Postulation (arthāpatti)
          - Schools: Mīmāṃsā, Advaita (Independent). Nyāya (Reduces to Inference).
          - Cost: Requires assuming a fact to save another fact; risks over-explaining.
  8. Did you know this because you looked for something and didn't find it?
      - Yes → Non-apprehension (anupalabdhi)
          - Schools: Kumārila Mīmāṃsā, Advaita (Independent). Nyāya, Prābhākara (Reduce to Perception).
          - Cost: Requires accepting "absence" as a real object you can know.
      - No → Not a Source (Doubt/Error/Hypothetical)
          - Schools: All agree these are not knowledge.
          - Cost: You do not actually know P yet.

  Routed Cases

  1. Case: "There's no coffee in the pot" vs. "I just looked at an empty pot."
      - Path: Q1 (No) → Q2 (Yes, senses contacted pot) → Q8 (Yes, knew by not finding coffee).
      - Conflict: This lands on Non-apprehension logically. However, Nyāya reduces this to Perception (Q2). The student arguing "I just looked" is arguing for Perception; the student arguing "There's no coffee" is arguing for Non-apprehension.
      - Resolution: The tree sorts the *claim*. If the claim is about absence via non-seeing, it is Non-apprehension. Nyāya students must note their school reduces this leaf to Perception.

  2. Case: Cousin gaining weight but not eating during day → must eat at night.
      - Path: Q1 (No) → Q2 (No) → Q3 (No) → Q5 (No, no universal rule) → Q7 (Yes, contradiction requires explanation).
      - Verdict: Postulation (arthāpatti).
      - Note: The student is correct that it lacks a general rule (Inference requires "All gainers eat at night"). It relies on resolving the contradiction of weight gain without day eating. Nyāya would reduce this to Inference.

  3. Case: Quince description → matched at market.
      - Path: Q1 (No) → Q2 (No, didn't know it was quince by senses alone) → Q3 (No, description was prior) → Q6 (Yes, matched description to new thing).
      - Verdict: Comparison (upamāna).
      - Note: This is the classic example. You know the name via the description match.

  4. Case: Maya recognizing cousin after nine years.
      - Path: Q1 (No, fresh visual contact) → Q2 (Yes, senses contacted cousin) → Verdict.
      - Verdict: Perception (pratyakṣa).
      - Note: Nyāya says recognition is Perception + Memory. Since Memory is not a source, the source is Perception. The "nine years" detail triggers memory, but the knowledge source is the current seeing.

  5. Case: Teacher says exam Tuesday vs. Textbook says Earth age.
      - Path: Q1 (No) → Q2 (No) → Q3 (Yes, words) → Q4 (Reliable Person).
      - Verdict: Testimony (śabda) - Human.
      - Note: Both are Human Testimony. The difference is the *degree* of reliability check. Teacher = direct trust. Textbook = institutional trust. Nyāya requires reliability for both; Mīmāṃsā requires it for human but not Vedic. Neither is Vedic/Authorless.

  Flags and Empty Corners

  Flagged Leaves (Hard to Separate)
  1. Perception of Absence vs. Non-apprehension.
      - Why: Both involve looking and not seeing. Nyāya says you perceive the empty space (Perception); Mīmāṃsā says you cognize the absence of the object (Non-apprehension). The student's report ("I didn't see it") fits both.
      - Separator: Ask "Did you see an empty pot (positive) or know the coffee is gone (absence)?" If they insist absence is a distinct object of knowledge, it's Non-apprehension.
  2. Human Testimony vs. Inference from Reliable Report.
      - Why: If I trust you because you are reliable, am I listening to words (Testimony) or reasoning that "Reliable people tell truth, you are reliable, so this is true" (Inference)?
      - Separator: Ask "Did you understand the meaning of the words directly, or did you calculate the truth based on their character?" Nyāya says Testimony; Buddhists often reduce to Inference.

  Empty Corners (Unoccupied Views)
  1. Accept Testimony, Reject Perception.
      - Diagnosis: Incoherent. You need senses (Perception) to hear or read the words before Testimony can work.
  2. Accept Non-apprehension, Reject Inference.
      - Diagnosis: Unattractive/Incoherent. Knowing an absence usually relies on inferring that if it were there, it would be seen. Rejecting inference undermines the mechanism of non-apprehension.
  3. Accept Comparison, Reject Testimony.
      - Diagnosis: Incoherent. Comparison requires a prior description (e.g., "like a lumpy pear"). That description must come from Testimony. You cannot have Comparison without Testimony.

  Verdict: Perception (pratyakṣa)
