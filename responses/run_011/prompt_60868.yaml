  1. "Some experiences are so new that you cannot know anything at all about them beforehand — having a baby, going to war, becoming a vampire. That's what makes them transformative."
  2. "Because you can't grasp what the outcome would be like, you can't assign it a value to compare against your other options, so the normal expected-utility recipe has literally nothing to chew on. Paul's own running example is having a child: since no amount of thinking it through and no number of conversations with your friends who already have kids can tell you what it'll be like, deciding to have a baby isn't rational and isn't irrational either, it's just a leap in the dark."
  3. "Honestly the whole thing is just the Mary's room thought experiment applied to real life. Mary learns something brand new when she finally sees red, and Paul's point is that you're Mary every time you make a huge life choice."
  4. "So for transformative decisions, other people's evidence and advice are worthless, and the only honest options are to choose based on who you want to become or to flip a coin — those are exactly equally rational."

