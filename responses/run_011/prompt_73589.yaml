answer: |-
  Here are eight questions designed to keep the conversation moving without letting the guest retreat into standard disjunctivist slogans. They're written in a conversational, grad-seminar style.

  **1. The Illusion Exception**
  "You're happy to concede that in illusion cases—like the bent-looking stick in the water—there's a common phenomenal factor between the veridical and non-veridical experience. But you draw a hard line at hallucination. Why does the 'bent stick' get a common factor pass while the 'pink rat' doesn't? Is it just that the stick case involves a real object, or is there a phenomenological difference that justifies treating the two non-veridical cases differently?"
  *   **Follow-up:** *If he says it's just about the presence of an object:* "But if the *feel* of the bent stick and the feel of the pink rat are structurally similar (both present properties the world doesn't have), why does the ontology of the object dictate the ontology of the experience?"

  **2. Indiscriminability: Explanation or Label?**
  "You've argued that the bad case is psychologically exhausted by its indiscriminability from the good case. To us, that sounds like a definition rather than an explanation. Are you telling us *what* the hallucinatory state is, or are you just relabeling our ignorance about what it is as a positive feature?"
  *   **Follow-up:** *If he says it's a positive epistemic property:* "But an epistemic property usually rests on some underlying nature. If there's no underlying common nature with the good case, what ground is the indiscriminability standing on?"

  **3. The 'Question-Begging' Defense**
  "You tend to treat demands for a positive account of hallucination as question-begging moves that assume the Common Factor view. But isn't that a bit defensive? If your view implies that the bad case has no positive mental nature of its own, don't you owe us a story about what *fills the gap' other than 'not seeing'?"
  *   **Follow-up:** *If he says the gap is a mistake:* "Okay, but if the subject is having a conscious episode, something is happening. If you refuse to characterize it, aren't you just insulating the theory from falsification?"

  **4. The Causally Matched Case**
  "Let's look at a causally matched hallucination where the proximal neural goings-on are identical to a veridical perception. You want to say the mental kinds come apart even if the neural kinds don't. What license do we have to let mental kinds float free of neural ones like that? Are you rejecting supervenience?"
  *   **Follow-up:** *If he rejects local supervenience:* "If the mental state depends on the external object, does that mean two intrinsic physical duplicates could be in fundamentally different mental kinds solely because of their environment?"

  **5. The Expert Subject**
  "Your account leans heavily on indiscriminability. But imagine a subject who has had enough episodes to learn the 'signature' of their hallucinations—they can actually tell which ones are real and which aren't. For them, the bad case is discriminable. Does your account collapse for this subject, or do you still say the episodes are of different kinds despite the similarity they can now detect?"
  *   **Follow-up:** *If he says they are still different kinds:* "Then indiscriminability wasn't doing the work. What's doing the work? Because from the inside, the subject reports the episodes feel the same *type* of thing, even if they can now sort them."

  **6. Metaphysical Disjunctivism vs. Factive Seeing**
  "We're wondering if you need the heavy metaphysics of Disjunctivism to get your anti-skeptical payoff. Could you just argue that 'seeing-that-p' is a factive state that provides justification, without claiming the hallucinatory state is a fundamentally different *ontological kind*? What does the metaphysical split add that a simple factive account doesn't?"
  *   **Follow-up:** *If he says factivity presupposes the metaphysics:* "But couldn't a Common Factor theorist agree that veridical perception is factive, they just deny that hallucination is a *different kind* of state? Why is the kind-claim necessary for the epistemic win?"

  **7. Phenomenal Continuity**
  "Consider a case where the object slowly fades out while the experience remains constant—like a gradual hologram failure. At what exact point does the mental kind switch from 'perception' to 'hallucination'? If the phenomenology is continuous, how do you justify a sharp ontological cut without making the subject's perspective irrelevant?"
  *   **Follow-up:** *If he says the cut is where the object vanishes:* "But if the subject can't detect the cut, and the phenomenology doesn't shift, why should we accept that the *mind* underwent a radical change just because the world did?"

  **8. The Closer (No Clean Answer)**
  "Here's the thing we can't quite square: In the causally matched case, the brain is the same, the introspective access is the same, and the behavioral dispositions are the same. You say the experiences are fundamentally different because one has an object and one doesn't. But if the *subject's* entire reality—neural, behavioral, and introspective—is identical, what *makes* them different mental states other than your theory stipulating that they are? Where is the difference located if not in the subject?"
