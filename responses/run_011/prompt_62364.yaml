answer: |-
  ### Prep Notes: The Case Selection

  **Do not start with Andromeda (Rietdijk–Putnam).**
  *   **Why:** It assumes the conclusion. It presupposes that "real for me" is determined by simultaneity slices, which Presentists deny (they claim only the local present is real; simultaneity is conventional). Starting here lets Physics students dominate with math while Philosophy students disengage, and it invites a 20-minute sidebar on the conventionality of simultaneity that kills the ontological question.
  *   **Use Instead:** **The "True Past Proposition" Case (e.g., "Caesar crossed the Rubicon").**
  *   **What it must have:** A proposition both groups agree is *true now* but refers to a *non-present entity*.
  *   **What it must not have:** Any reference to evidence (fossils, books) or observation (light signals). This prevents Presentists from offloading truthmakers onto present traces and prevents Physics students from reducing it to signal delays.

  ---

  ### Session Plan (50 Minutes)

  #### 0:00 – 0:05 | Setup & The "Exist" Trap
  **Board:** Left: "Exists?" | Right: "Is Real?"
  **Say:** "We are not asking if the past is *accessible*. We are asking if it is *there*. Physics students: stop thinking about light cones. Philosophy students: stop thinking about experience. We are talking about ontology."
  **Misconception (Pre-existing):** Physics students think SR *deduces* ontology.
  **Head it off:** "Relativity constrains ontology; it does not dictate it. We must choose the metaphysics that fits the physics, not read metaphysics off the math."

  #### 0:05 – 0:20 | The Case: Caesar's Truth
  **Board:** Write: "It is true *now* that Caesar crossed the Rubicon."
  **Say:** "Both groups agree this sentence is true. Question 1: Does Caesar exist? Question 2: What makes that sentence true *right now*?"
  **Activity:** Poll the room. Let the clash happen. Physics will say "Yes (in the block)." Phil will say "No (not present)."
  **Transition:** "If Caesar does not exist, what is the *truthmaker* for this sentence? Is it present dust? Is it the past event itself?"
  **Misconception (Pre-existing):** Phil students think "flow" is separate from ontology.
  **Head it off:** "If nothing exists but the present, 'flow' is an illusion with no ontological ground. You cannot have it both ways."
  **Goal:** Force them to see that denying the existence of the past requires a complex theory of truth (Presentism), while accepting it simplifies truthmakers (Eternalism).

  #### 0:20 – 0:30 | The Truthmaker Principle
  **Board:** Write: "Truth requires a Truthmaker." (Draw arrow from Sentence to Object).
  **Say:** "If you deny the past exists, you must explain what *currently exists* that makes this true. If you say 'present traces,' I ask: What if all traces were destroyed? Would it still be true?"
  **Transition:** "This is where the Block Universe buys its keep. It offers a truthmaker without extra machinery."
  **Misconception (Induced):** "Eternalism means Fatalism."
  **Head it off:** "The block contains your choices as well as your outcomes. A map of a road does not drive the car. Ontology is not causality."
  **Misconception (Induced):** Reinventing the "Moving Spotlight."
  **Head it off:** "If the whole block is real, what is 'moving'? If you say 'consciousness,' you've moved from ontology to psychology. Don't smuggle a 'now' into the block."

  #### 0:30 – 0:40 | The Phenomenology Refusal
  **Board:** Write: "Ontology $\neq$ Phenomenology".
  **Say:** "Students always ask why time *feels* like it passes if the block is static. I am going to stop you there."
  **The Sentence:** **"I will not explain why time *feels* like it flows, because phenomenology is not ontology."**
  **Say:** "We are mapping what exists, not how it feels. A map of a mountain doesn't feel steep."

  #### 0:40 – 0:45 | Consolidating the Ontology
  **Board:** Draw a spacetime diagram (Minkowski). Label axes $x, t$.
  **Say:** "Look at this diagram. Where is the present? Is it the line $t=0$? Or is it the whole manifold?"
  **Transition:** "If you say $t=0$ is special, you are adding something to the physics. If you say the whole manifold is real, you are reading the physics literally."

  #### 0:45 – 0:50 | The Closing Question
  **Board:** Erase the $t=0$ label on the diagram. Leave the manifold.
  **Say:** "I have erased the 'present' label. Answer this on your way out:"
  **The Question:** **"If I erase the 't=0' line on this diagram, have I deleted the present from the universe, or just a coordinate label?"**
  **Scoring:**
  *   "Deleted the present" = Memorized diagram, missed ontology (Presentist intuition).
  *   "Just a coordinate" = Grasped the ontological claim (Eternalist/Block understanding).

  ---

  The hinge: The moment they agree that truths require ontological grounds.
