answer: |-
  # PREP SHEET: "Artifacts Don't Have Politics, Maintenance Regimes Do"

  ## 1. BLUNT ASSESSMENT: ARE YOU JUST RE-DESCRIBING WINNER?
  **Yes, but only on Case 1 (The Moses Bridges).**
  *   **The Damage:** If the Winner fan pins you down on the bridges before you get to the lead pipes, you look like you're splitting hairs to sound novel. Winner's point was always about *outcomes* (who can ride the bus), not strictly about the concrete's metaphysical status.
  *   **The Fix:** Pre-empt this. Open the bridge section by saying: *"Winner correctly identified the exclusion, but misidentified the mechanism. The bridge didn't exclude the bus; the Parks Department's decision to never widen the overpasses excluded the bus. The concrete was just the weapon, not the shooter."*
  *   **Severity:** Moderate. If you frame it as "locating the politics in the budget, not the beam," the Winner fan might actually nod. If you frame it as "Winner was wrong," they will eat you alive.

  ## 2. THE ONTOLOGIST'S OPENING GAMBIT
  **The Question:** "You say politics is a property of the regime, not the artifact. But if you remove the artifact, the regime dissolves. Aren't you just smuggling the artifact back in as a necessary condition, thereby making 'political' a relational property of the artifact-after-all? Why not just say artifacts have relational politics?"

  **The 90-Second Reply:**
  "Because relational properties imply stability, and my point is about *instability*. A relational property suggests the politics is fixed as long as the artifact and user exist. But the artifact stays still while the politics flip. That same lead pipe was 'public health' in 1920, 'negligence' in 2015, and 'asset' in 2025. The pipe didn't change relations; the *obligations* around it did.
  I'm not smuggling the artifact out; I'm treating it as the *site of friction*, not the *source of law*. The artifact creates the requirement for maintenance (gravity pulls the bridge down, lead leaches into water). The regime decides who pays to fight gravity or leaching. 'Political' isn't the relation between human and thing; it's the distribution of the burden to sustain that relation. If I call it a relational property of the artifact, I imply the artifact holds the leverage. It doesn't. The budget holder does."

  **Risk:** If they push on "necessary condition," concede. "Yes, necessary condition, not sufficient cause."

  ---

  ## 3. THE SEVEN OBJECTIONS (In Order of Appearance)

  ### 1. The Historian of Technology
  **Objection:** "You define a regime as a 'standing arrangement.' That sounds suspiciously like a structure. By reifying 'regime,' aren't you just building a black box around the very historical contingencies we study? You're freezing a process into a noun."
  **Reply:** "Fair. 'Regime' is a shorthand for a repeating pattern of decisions, not a monolith. I use it to highlight *repetition*. One-off decisions aren't politics; they're events. Politics is when the decision becomes a routine. I'm not freezing the process; I'm pointing out that the routine *is* where the power hides. The history is in how the routine gets established."
  **Thin Spot:** You haven't explained *how* regimes change, only that they do.
  **Concede?** Yes. Admit "regime" is a functional placeholder, not a metaphysical structure.

  ### 2. The Die-Hard Winner Fan
  **Objection:** "Winner's essay was normative, not descriptive. He wanted to shock engineers into realizing their complicity. By shifting blame to 'maintenance regimes,' you're letting designers off the hook. If I design a bridge I know won't be maintained, isn't that still my politics?"
  **Reply:** "No, because you can't design for a budget you don't control. If I design a high-tech water filter for a district with no tax base, my 'intent' is irrelevant. The politics happen when the filter breaks and the city chooses not to fix it. Shifting blame isn't my goal; accuracy is. If we blame designers for maintenance failures, we fix the wrong thing. We tweak the specs instead of funding the crews."
  **Thin Spot:** Designers *do* sometimes specify high-maintenance tech knowingly.
  **Concede?** Concede that "designing for obsolescence" is a regime decision disguised as design.

  ### 3. The Critical-Infrastructure Geographer
  **Objection:** "With the lead lines: the chemistry is the politics. Lead poisons poor kids regardless of the maintenance schedule. The material agency of the lead *is* the exclusion. If you say the politics is in the regime, you're ignoring that the pipe itself is a violent actor."
  **Reply:** "The poison is chemical; the *exposure* is political. Lead exists in the crust. It only becomes violence when it's piped into homes without filtration or replacement. Two cities have lead pipes; one replaces them, one doesn't. The pipe is constant; the harm is variable. The variance is the politics. The pipe is the gun; the regime pulls the trigger."
  **Thin Spot:** This is your strongest case, but also where materiality matters most. Don't deny the lead's agency, deny its *political autonomy*.
  **Concede?** No. Hold the line. Hazard ≠ Politics.

  ### 4. The City Engineer (Auditor)
  **Objection:** "In public works, we work to code. The code is written into the artifact's permit. If the regime fails, it's usually because the artifact didn't meet the spec. Why isn't the compliance failure a property of the artifact's installation?"
  **Reply:** "Because codes are minimums, and maintenance is discretionary. You can install a perfect pipe and still choose to never inspect it. The audit trail shows the regime: who signed off, who budgeted the inspection, who ignored the warning. The artifact meets spec on day one. The politics is what happens on day 1,000."
  **Thin Spot:** Engineers know that "value engineering" (cutting costs during design) locks in maintenance failures.
  **Concede?** Concede that design choices *constrain* the regime, but don't *determine* it.

  ### 5. The STS Scholar (Akrich/Latour leanings)
  **Objection:** "You're dismissing the script/de-scription move too easily. Akrich showed that artifacts prescribe use. You're saying that only applies to 'new' things. But decay is also scripted. A crumbling road scripts a detour. That's still artifact politics."
  **Reply:** "A crumbling road scripts a detour, yes. But who paves the detour? Who pays for the extra commute time? The script describes the friction; the regime describes the cost allocation. Akrich explains how the artifact speaks; I'm explaining who is forced to listen and who gets to ignore it. Script is the demand; regime is the response."
  **Thin Spot:** You risk creating a false dichotomy between "script" and "regime."
  **Concede?** Admit they are entangled, but insist regime is the locus of *normative* judgment.

  ### 6. The Social Ontologist (Round 2)
  **Objection:** "You say politics allocates 'veto power.' Is veto power a dispositional property of the regime? If the regime collapses, does the politics cease to exist, or does it revert to the artifact?"
  **Reply:** "If the regime collapses, the politics becomes chaos, not artifact. Think of a failed state. The roads are still there, but there's no allocation of cost, just survival. Politics requires a standing arrangement to allocate. Without the regime, you have physics and scarcity, but not politics. So yes, it's dispositional on the arrangement, not the thing."
  **Thin Spot:** "Chaos" is a political condition too (Agamben etc.).
  **Concede?** Don't get dragged into political theory. Keep it pragmatic: "No budget, no politics, just disaster."

  ### 7. The "Pragmatist" (Any audience member)
  **Objection:** "Okay, grants are politics. But why does the label matter? If I want to fight the injustice, do I target the regime or the artifact? If I say 'the bridge is racist,' I can mobilize people. If I say 'the maintenance budget is racist,' I put them to sleep."
  **Reply:** "Because targeting the artifact leads to symbolic removal. We tear down the statue but keep the funding structure. Targeting the regime leads to resource redistribution. If you want to actually change who gets poisoned or who gets to commute, you have to change the budget, not the beam. Slogan-wise, 'artifact' wins. Solution-wise, 'regime' wins."
  **Thin Spot:** You are admitting your thesis is less mobilizing.
  **Concede?** Yes. Admit it's less sexy, but more actionable.

  ---

  ## 4. THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If maintenance regimes hold the politics, who constitutes the regime? Is it the people, or is the regime itself an actor that constrains the people? If it's the people, you've just reduced politics to human intention again. If it's the regime, you've reified structure and lost agency."

  **Why it's dangerous:** It forces you to choose between methodological individualism (which the historians hate) and structural determinism (which the engineers and ontologists will poke holes in). It attacks the "Regime" noun you built your whole talk on.

  **The Escape:** "The regime is the *pattern* of constraints. It constrains people, but people can break the pattern. That's exactly why it's political: because it *could* be otherwise, but the cost of changing it is allocated to specific people to prevent them from trying."

  ---

  ## 5. CONCESSIONS TO BUY CREDIBILITY (Do this early)
  1.  **To the Historians:** "I am not claiming design intent is irrelevant. It sets the initial conditions. I am claiming it is not *decisive*."
  2.  **To the Winner Fan:** "Winner's normative project is correct. His ontological location of that project is what I'm adjusting."
  3.  **To the Geographer:** "Materiality is non-negotiable. Lead kills. But 'killing' is biology; 'who gets the lead' is politics."

  ## 6. TACTICAL NOTE ON THE OPEN SOURCE CASE
  Use the Open Source case to disarm the Ontologist.
  *   **Why:** It has no physical materiality.
  *   **Argument:** "If artifacts had politics, this code package would have the same politics everywhere. It doesn't. In a well-funded corp, it's infrastructure. In a non-profit, it's a vulnerability waiting to break. The code is identical. The regime (one paid maintainer vs. a team) is the variable."
  *   **Benefit:** This proves your point without the "lead pipe" materiality baggage.
