          *   Identification of merely verbal disputes.
      *   **The Case:** Lena checks one weather app.
          *   V1: Low stakes (walking home).
          *   V2: High stakes (outdoor wedding, costs thousands).
          *   V3: High stakes for Lena, Low stakes for Attributor (Roommate in lazy conversation).
      *   **The Positions:**
          *   Contextualist (CX): "Knows" is gradable/context-sensitive (like "tall"). Attributor's context sets the bar. Subject's stakes irrelevant.
          *   Pragmatic Encroachment (PE): "Knows" has fixed meaning. Subject's stakes affect truth conditions of knowledge. High stakes = harder to know.

  2.  **Brainstorming & Epistemological Analysis:**
      *   *Goal:* Find common ground. Both CX and PE agree that standard invariantism (SI) is wrong. SI says stakes/context don't matter for knowledge attribution, only truth, belief, and justification. Both CX and PE say stakes/context *do* matter for whether "S knows that p" is true.
      *   *Agreement:* They agree that in V1, "Lena knows" is true. They agree that in V2, "Lena knows" is false (or at least much harder to assert truly). They agree that traditional JTB (Justified True Belief) isn't the whole story; practical factors matter.
      *   *The Crux (Version 3):* This is the classic "Bank Case" variant (Stanley vs. DeRose).
          *   CX Prediction: Attributor (Roommate) is in a low-stakes context. Therefore, "Lena knew" is *true* in the Roommate's mouth, even if Lena had high stakes. The bar is set by the speaker.
          *   PE Prediction: Lena's stakes are high. Therefore, she does *not* know. The Roommate's assertion "Lena knew" is *false*, even in a lazy conversation. The bar is set by the subject.
      *   *Verbal Dispute:* Is it about the word "knows" or the concept? CX says the semantic content of "knows" shifts. PE says the semantic content is fixed, but the *conditions* for satisfying it shift based on practical rationality.
      *   *Ordinary Speakers:* Both usually appeal to intuitions about what people *would* say. They need to agree on what the data is before interpreting it.
      *   *Moderator Tone:* Needs to be precise, charitable, slightly academic but accessible to a club, and structured to force clarity.

  3.  **Drafting - Step 1: Brainstorming Notes (Internal Monologue/Scratchpad):**
      *   *Common Ground:* Both hate Skepticism (mostly). Both think "S knows p" can be true in low stakes and false in high stakes. Both think evidence (one app check) is constant across cases.
      *   *Version 3 is the Killer:* This is the DeRose/Stanley battleground.
      *   *CX:* "I (Roommate) can truly say she knew, because *I'm* not planning a wedding."
      *   *PE:* "She didn't know, so you (Roommate) are wrong to say she did, even if you're chill."
      *   *Verbal:* Is it semantics (CX) or metaphysics/norms (PE)? CX says context changes proposition expressed. PE says context changes the world-facts required for knowledge.
      *   *Testing:* Need surveys or specific intuition pumps. Maybe "Retraction" cases? If Roommate says "She knew" and then learns about the wedding, do they retract?
      *   *Structure:* Agreement -> Disagreement -> Cruxes/Tests -> Verbal Component.

  4.  **Drafting - Step 2: The Polished Document:**
      *   *Header:* Formal title, date, participants.
      *   *Section 1: Shared Commitments.* Focus on the rejection of Purist Invariantism. Agree on the V1/V2 intuition pump.
      *   *Section 2: The Disagreement Matrix.* Contrast the *mechanism* of the shift.
      *   *Section 3: Version 3 (The Roommate Case).* This needs specific predictions.
      *   *Section 4: Cruxes & Empirical Tests.* What would change minds? Retraction data, survey data, embedding tests.
      *   *Section 5: The Verbal Component.* Acknowledge the semantic vs. pragmatic distinction.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't bias towards Contextualism. PE proponents (like Jason Stanley) argue vigorously that CX gets V3 wrong.
      *   *Nuance:* Ensure the "Ordinary Speakers" section doesn't just say "people say X." It needs to be about *truth conditions* vs. *assertability*. PE often argues people *assert* "knows" loosely but it's not *true*. CX says it *is* true.
      *   *Tone Check:* Keep it professional. "Adversarial Collaboration" is a specific methodology (Tetlock et al.). It requires pre-registering predictions.
