  Your friend's collapse argument fails because it assumes the second coordinate never speaks, but it speaks whenever you choose between worlds that are both free of disqualified suffering. Most policy decisions—tax rates, healthcare allocation, infrastructure—operate below the horror threshold, where LTNU demands happiness maximization and Pure NU demands indifference. Rejecting Step (2) costs you simplicity in decision-making under uncertainty; you cannot use standard expected utility calculations because no finite amount of expected happiness can offset a non-zero probability of creating a disqualified life. You must adopt a lexical decision rule that prioritizes minimizing the risk of crossing the threshold above all else, which can lead to paralysis in high-stakes gambles.

  You are indeed grabbing the conclusion you find least repugnant, but so is every ethical theorist facing impossibility theorems. The derivation you cited shows that lexicality is the necessary price of satisfying separability and the anti-reverse-repugnant intuition simultaneously; if you refuse lexicality, you must reject one of those premises. If you accept your friend's Step (7) and put everything on one cardinal scale, you are left with the Sadistic Conclusion: that enough mild happiness can justify extreme torture. That is a heavier bullet to bite than lexical indeterminacy.

  Yes, you must eat the trillion happy lives. On LTNU, the disqualified life creates a lexical discontinuity that no amount of aggregate well-being can bridge. Preferring Policy B is not a rhetorical hedge; it is the logical consequence of placing consent-based suffering outside the realm of trade-offs. If you cannot accept that outcome, you do not hold LTNU, but if you do hold it, consistency demands you accept the loss of the trillion.
