answer: |-
  The Norway 2003 law presents a classic case of an **incompletely theorized agreement**. The state, the companies, and the public could agree on the *rule* (40% headcount) without agreeing on the *reason* (the justification). This allows incompatible moral and practical views to license the very same regulation. To understand what the arrangement presupposes about the "wrongness" of the old boardrooms, we must test the rule against the candidate readings and then use the "directorship-hoarding" phenomenon as a diagnostic tool to see which reading actually drove the outcome.

  ### 1. Evaluation of Candidate Readings

  Here is how the quota arrangement relates to the three proposed diagnoses of the old boardrooms.

  **Reading A: Fairness to Women (Distribution of a Good)**
  *   **Diagnosis:** Board seats are valuable goods (power, prestige, pay) from which women were unjustly excluded.
  *   **Relation to Practice:** The practice is **consistent** with this, but does not strictly **require** it. A quota redistributes access, which aligns with fairness. However, the law could theoretically exist without a moral claim about fairness (e.g., as a pure economic mandate).
  *   **Openness:** This reading is left open because the law does not specify *which* women should benefit. Is the "good" owed to women as a class (requiring broad distribution), or to qualified women individually (allowing concentration)? The rule permits both.

  **Reading B: Deliberative Quality (Cognitive Diversity)**
  *   **Diagnosis:** Homogeneous groups suffer from groupthink; mixed sexes bring different life experiences that improve decision-making.
  *   **Relation to Practice:** The practice is merely **consistent** with this, not required. One can mandate gender mixing without believing it improves performance (as evidenced by the fact that "fairness" was a separate, co-equal defense).
  *   **Openness:** The rule leaves open *what kind* of diversity matters. Does "sex" proxy for "life experience"? The headcount rule assumes yes, but it does not verify it. It allows the view that biology dictates perspective to coexist with the view that socialization does, provided the headcount is met.

  **Reading C: Symbolic Representation (Fitness to Govern)**
  *   **Diagnosis:** An all-male board asserts a false normative claim that only men are fit for leadership.
  *   **Relation to Practice:** The practice is **consistent** with this. Putting women in the room corrects the visual symbol.
  *   **Openness:** The rule leaves open whether the symbol requires *representativeness*. Does the presence of *any* woman correct the symbol, or must the women on the board reflect the diversity of women in society? The headcount rule is satisfied by the former, leaving the latter question unresolved.

  **Summary of Openness:** The practice leaves the *teleology* of the law open. Because the metric is purely arithmetic (counting heads), it allows a utilitarian (efficiency), a deontologist (rights/fairness), and a expressivist (symbolism) to all vote for the same bill. They agree on the *output* while disagreeing on the *purpose*.

  ### 2. What the "Directorship-Hoarding" Settles

  The phenomenon where a tiny elite of women (the "golden skirts") filled the majority of the new seats acts as a stress test for these readings. It reveals what the law *actually* prioritized versus what it *claimed* to prioritize.

  **What it Settles:**
  1.  **It settles that Reading B (Deliberative Quality) was not the operational logic.** If the true wrong of the old boardrooms was cognitive homogeneity, recycling the same eight women across sixteen boards each fails to fix it. Those eight women bring the same class background, education, and network to every room. The boards became numerically mixed but cognitively consolidated. The hoarding proves the state cared about the *statistic*, not the *substance* of diversity.
  2.  **It settles that the "Good" in Reading A (Fairness) was treated as a Property Right, not a Social Resource.** If the goal were to uplift women as a class, the law would have discouraged concentration. By allowing hoarding, the arrangement presupposed that the injustice was located in the *exclusion of qualified individuals*, not the *structure of opportunity*. It treats the board seat as a prize for the already-elite, rather than a ladder for the underrepresented.
  3.  **It settles that the "Symbol" in Reading C is about Presence, not Representativeness.** The hoarding shows that the symbolic correction is satisfied by the *fact* of female presence, regardless of whether those women represent the breadth of female experience. The "false assertion" of the old boardrooms is corrected simply by having a female body in the chair, even if it is the same body in every chair.

  **What it Leaves Open:**
  *   It does not settle whether the old boardrooms were actually sexist. The hoarding could simply mean the pool of "board-ready" women was artificially small due to historical pipeline issues (a structural problem), rather than current discrimination (an exclusionary problem).
  *   It leaves open whether the "efficiency" defense was sincere. It is possible lawmakers believed mixed boards were better, but accepted hoarding as a necessary transitional cost to hit the numbers quickly.

  ### 3. Alternative Policies Based on Other Readings

  If the policymakers had genuinely prioritized one of the other readings over the simple headcount, the policy architecture would have looked significantly different.

  **If the goal were truly Fairness (Distribution to the Class):**
  *   **Policy:** A quota combined with a **Cap on Multiple Directorships**.
  *   **Design:** No individual could hold more than two public board seats.
  *   **Rationale:** This would force the distribution of the "valuable good" across a wider pool of women, preventing the creation of a new female elite while excluding the majority. It might also require **Pipeline Subsidies** (state-funded training for mid-career women) to ensure the supply of directors expanded rather than just circulating.

  **If the goal were truly Deliberative Quality (Cognitive Diversity):**
  *   **Policy:** A **Competency Matrix Requirement** rather than a sex quota.
  *   **Design:** Companies would be required to demonstrate that their board possesses a diversity of *backgrounds* (e.g., labor, academic, geographic, industrial), with sex as only one variable among many.
  *   **Rationale:** This would prevent the "golden skirts" phenomenon because the same eight women would likely share too many other traits (elite education, corporate background) to satisfy the matrix. It targets the *input* of deliberation, not just the demographic *output*.

  **If the goal were truly Symbolic (Fitness to Govern):**
  *   **Policy:** **Blind Nomination Processes** and **Transparency Mandates**.
  *   **Design:** Require nomination committees to interview a minimum number of female candidates for every open seat ("Rooney Rule" style) and publish the criteria used for selection.
  *   **Rationale:** This addresses the *assertion* of fitness by forcing the gatekeepers to visibly consider women as equals. It changes the *process* of selection to signal that women are fit, rather than forcing the *result* which can look like tokenism (or hoarding).

  ### Conclusion
  The Norway law's reliance on a simple headcount allowed incompatible justifications to coexist peacefully. However, the resulting "directorship-hoarding" exposes that the mechanism was designed for **compliance**, not **transformation**. It settled that the state's primary concern was the arithmetic of the boardroom, leaving the deeper structural questions of who governs, how they deliberate, and who benefits largely untouched.
