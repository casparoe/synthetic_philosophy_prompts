answer: |-
  # Question-Period Strategy Sheet
  **Workshop:** Measurement and Values in Health Priority-Setting
  **Audience:** Health Economists (Majority), Bayesian Decision Analysts (Minority), Public Health Ethicists (Minority)
  **Speaker Thesis:** Measurement incommensurability forbids interpersonal aggregation; Serial Justification (pairwise comparison) replaces summing. Intrapersonal aggregation permitted.

  ## Opening Concessions (First Two Minutes)
  *Do not start by defending the moral theory. Start by acknowledging the constraint.*
  1.  **Concede the Budget Constraint:** Explicitly state that your proposal does not increase the budget. You are not arguing for more spending, but for a different rule for spending the fixed envelope. If you do not say this, the economists will assume you are ignoring opportunity cost.
  2.  **Concede the Heuristic Value of QALYs:** Acknowledge that QALYs are useful *descriptive* tools for within-disease comparison, even if they fail as *normative* currency across diseases. This prevents the room from dismissing you as anti-science.
  3.  **Concede Implementation Friction:** Admit that serial justification is computationally heavier than linear programming. Frame this as a necessary cost for moral coherence, not an oversight.

  ## The Single Reply That Must Land
  *If you lose the room on this, the proposal dies.*
  **The Claim:** "The QALY is not a ruler; it is a currency exchange rate that hides the conversion fee."
  **The Delivery:** When challenged on measurement, do not argue about ethics. Argue about *units*. "You cannot add meters to seconds. You cannot add years of life to pain relief unless you adopt a convention to make them comparable. That convention is not discovered; it is imposed. My proposal makes the imposition visible rather than hiding it inside the model."
  **Why:** This shifts the debate from "You are being inefficient" to "Your efficiency is an illusion created by unit conversion."

  ---

  ## Top 10 Objections (Ordered by Likelihood $\times$ Damage)

  ### 1. The Optimization Impossibility (Health Economist)
  **Objection:** "If we cannot sum health gains across patients, how do we maximize total health from a fixed budget? Without an objective function to maximize, aren't you leaving resources on the table or forcing us to allocate randomly? This looks like it ignores opportunity cost."
  **Reply (90s):** "I am not asking you to ignore opportunity cost; I am asking you to change the decision rule. Instead of maximizing the sum, we treat the budget as a constraint and satisfy claims in order of relevance until the budget is exhausted. We do not leave resources on the table; we stop spending when the next claim is not relevant enough to justify the cost, not when the marginal gain is too small. It is a satisficing model within a constraint, not an optimization model."
  **Soft Spot:** Satisficing can look like inefficiency if the 'relevance' ordering is vague.
  **Strategy:** **Reframe.** Shift from "maximization" to "constrained satisfaction."

  ### 2. The Threshold Incoherence (Health Economist)
  **Objection:** "National bodies like NICE use a cost-per-QALY threshold to determine value for money. If QALYs aren't comparable across persons, the threshold value becomes meaningless. How do you set a threshold without a common unit of outcome?"
  **Reply (90s):** "The threshold should not be a price per unit of health, but a budget cap per claim type. We can still say 'we will spend up to $X for this severity of condition,' but we do not translate that into a universal currency. The threshold becomes a series of local rules for specific disease areas rather than a single global exchange rate. It is more complex, but it reflects the reality that a dollar buys different moral claims in oncology than in orthopedics."
  **Soft Spot:** This fragments the system and makes cross-departmental equity hard to monitor.
  **Strategy:** **Concede & Hold.** Concede it is more complex; hold that complexity is the price of accuracy.

  ### 3. The Intrapersonal/Interpersonal Inconsistency (Ethicist/Analyst)
  **Objection:** "You permit aggregation across time for one person (a lifetime of pain vs. a year of life) but forbid it across persons. But a year is a year. If the units are incommensurable across people, why are they commensurable across time for the same person? This looks like an arbitrary line to save the theory."
  **Reply (90s):** "Because the 'person' is the unit of moral accounting. Within a life, trade-offs are constitutive of identity; I accept pain now for gain later as part of a single narrative. Across lives, there is no single narrative to absorb the loss. The unit of convention is fixed by the boundary of the life, not the clock. We are measuring claims *by* persons, not just claims *in* time."
  **Soft Spot:** This is the weakest philosophical link. It relies on a metaphysical claim about identity that economists will find mystical.
  **Strategy:** **Hold.** Do not waver here, or the whole distinction collapses.

  ### 4. The Transitivity/Cycle Risk (Bayesian Decision Analyst)
  **Objection:** "Serial justification involves pairwise comparisons. If Program A beats B, and B beats C, your method risks C beating A depending on the order of comparison. This violates transitivity. In decision theory, intransitive preferences lead to money pumps and incoherent policy."
  **Reply (90s):** "Serial justification is not a voting cycle; it is a lexicographic ordering. We establish an ordering of relevance *before* the pairwise comparison. We do not compare A to B, then B to C, then C to A. We compare the most relevant claim against the budget, then the next. The ordering is fixed by severity and dependency, not by the pairwise outcome itself."
  **Soft Spot:** If the 'ordering of relevance' is not itself transitive, the problem returns.
  **Strategy:** **Hold.** This is the **Fatal** objection if left standing. You must insist the relevance ordering is exogenous and stable.

  ### 5. The Ex Ante vs. Ex Post Problem (Decision Analyst)
  **Objection:** "Your method evaluates claims ex post (actual harm suffered). But health policy is ex ante (risk reduction). If we allocate based on actual complaints, we ignore the statistical lives saved by prevention. Does your model undervalue public health?"
  **Reply (90s):** "It does shift weight toward treatment, which I accept. However, a 'complaint' can include the risk burden borne by a population. We can treat the probability-weighted expectation of harm as the claim. But we still cannot sum those expectations across persons. We compare the risk burden of Group A against Group B, not the sum of their risks."
  **Soft Spot:** Hard to operationalize risk as a 'complaint' without reverting to expected utility sums.
  **Strategy:** **Reframe.** Define 'complaint' to include risk exposure.

  ### 6. The Measurement Validation Counter (Health Economist)
  **Objection:** "You say QALY units are arbitrary conventions. But we validate them through time-trade-off and willingness-to-pay elicitation. Patients themselves tell us the conversion rate between pain and life years. Aren't you ignoring empirical data?"
  **Reply (90s):** "You are measuring preference, not moral claim. A patient might say they would trade a year of life to avoid pain, but that is a description of their suffering, not a prescription for social allocation. Elicitation tells us the intensity of the claim, not the currency in which it should be settled against others. You are confusing the magnitude of the harm with the unit of account."
  **Soft Spot:** Economists view revealed preference as the only valid measure of value.
  **Strategy:** **Hold.** Distinguish between *value to the patient* and *value for allocation*.

  ### 7. The Severity Weight Redundancy (Public Health Ethicist)
  **Objection:** "We already use equity weights and severity modifiers in our models to prioritize the worse off. Isn't your serial justification just a complicated way of doing what severity weighting already does?"
  **Reply (90s):** "Severity weighting still sums. It says 'Person A's 1 QALY counts for 1.5, Person B's counts for 1.0,' and then you add them. I am saying you cannot add them at all. Even weighted, the sum implies the surplus of one can cancel the deficit of the other. My method prevents the cancellation entirely. It is a structural difference, not a parameter tweak."
  **Soft Spot:** In practice, the outcomes might look very similar, making your method seem like unnecessary friction.
  **Strategy:** **Reframe.** Emphasize the structural prohibition on cancellation.

  ### 8. The Identifiable Patient Bias (Health Economist)
  **Objection:** "Your focus on specific complaints favors identifiable patients over statistical lives. This is a known cognitive bias we try to correct. Are you building a bias into the normative framework?"
  **Reply (90s):** "I am not favoring the identifiable; I am favoring the specific claim. A statistical life represents a probability of a claim arising. I allow that claim to be entered into the serial order. The bias comes from summing probabilities; I am refusing the sum. The specificity is required to define the unit of measurement, not to grant privilege."
  **Soft Spot:** Hard to distinguish in practice.
  **Strategy:** **Reframe.** Focus on claim definition, not identity.

  ### 9. The Sensitivity Analysis Brittleness (Decision Analyst)
  **Objection:** "Our models use probabilistic sensitivity analysis to handle uncertainty. Your pairwise method seems brittle; a small change in the measurement of one complaint could flip the priority order entirely without a margin of error."
  **Reply (90s):** "That is correct, and it is a feature. It forces us to acknowledge when two claims are too close to distinguish. If a small measurement error flips the decision, the model should return 'indeterminate' and require a tie-breaking rule, not a false precision. We should be uncomfortable when decisions hinge on decimal points."
  **Soft Spot:** Policymakers hate 'indeterminate' results.
  **Strategy:** **Concede.** Admit it creates decisional paralysis in edge cases.

  ### 10. The Transition Cost (Health Economist)
  **Objection:** "Even if this is theoretically superior, the transition cost from current QALY-based contracts to serial justification would disrupt care for millions. Is the theoretical gain worth the implementation shock?"
  **Reply (90s):** "I propose this as a framework for high-stakes priority setting (e.g., rare diseases, end-of-life), not for every prescription. We can phase it in where the aggregation error is largest. We do not need to burn down the hospital to fix the accounting."
  **Soft Spot:** Limits the scope of your thesis significantly.
  **Strategy:** **Concede.** Limit the scope to protect the core theory.

