  Clause 1 (Constitutive Overlap): Where two scheduled items occupy the same spatial region simultaneously, coverage is limited to the item with the higher sortal priority (finished work over materials). No double recovery is permitted for coincident objects.
  Clause 2 (Reconstitution): Coverage for materials ceases upon intentional reconfiguration by a third party into a new form, regardless of modal continuity. Insured must notify Underwriting of any change in sortal classification.

  ***

  **Author's Note**
  The memo endorses Sortal Dominance (akin to constitution-as-identity for practical purposes), rejecting coincidentism to avoid double payment. It distorts metaphysics by treating ontological priority as a financial sublimit, reducing modal properties to "moral hazard." A specialist would find it unfair to coincidentalists, who argue distinct objects *can* share space; the memo dismisses this as merely "double recovery" rather than engaging the metaphysical possibility. Perdurantism is rejected not on truth grounds, but because it undermines the concept of "total loss," caricaturing the view as financially nihilistic.
