answer: |-
  I am operationalizing the Narrow Stoic reading where only your own choices and judgments are fully up to you, which gives up the modern comfort of claiming partial credit for outcomes but prevents clients from hiding behind "influence" as an excuse for inaction.

  ### The "Control Triage" Procedure

  **Trigger Phrases:** Listen for any variation of "I can't control," "It's not up to me," "I have no influence," "That's out of my hands," or "I can't help feeling."

  **Step 1: The Locus Check (Internal vs. External)**
  *   **Coach asks:** "When you say [X] isn't in your control, are you talking about what other people decide, or about what you decide to do next?"
  *   **Sufficient Answer (External):** "What they decide," "The final outcome," "The budget," "The reorg."
  *   **Sufficient Answer (Internal):** "My effort," "My preparation," "My response," "Whether I speak up."
  *   **[JUDGMENT CALL]:** If the client says "My effort" but means "The result of my effort," probe once: "If you put in the effort and the result still fails, is the effort still yours?"
  *   **Branch:**
      *   If **Internal** is claimed as "Not in control": **Immediate Misfire.** (Stop Step 2).
      *   If **External** is claimed as "Not in control": **Proceed to Step 2.**

  **Step 2: The Function Check (Acceptance vs. Resignation)**
  *   **Coach asks:** "Does seeing it that way free you up to do something else, or does it feel like a reason to stop doing what you were doing?"
  *   **Sufficient Answer (Acceptance):** "It lets me focus on Y instead," "I sleep better so I can handle Z," "I'm redirecting my energy."
  *   **Sufficient Answer (Resignation):** "So I just don't bother," "There's no point trying," "I'm stepping back completely."
  *   **[JUDGMENT CALL]:** Distinguishing "strategic withdrawal" (healthy) from "fear-based withdrawal" (unhealthy). Look for energy levels: Resignation sounds flat/heavy; Acceptance sounds relieved/active.
  *   **Branch:**
      *   If **Acceptance**: **Healthy Use.** Park it. ("Okay, so since that's external, what *is* in your control right now?")
      *   If **Resignation**: **Misfire.** Proceed to Naming.

  **Step 3: The Harm Check (Self vs. Others)**
  *   **Coach asks:** "If you stop acting on this, does it impact only you, or does it risk safety or obligations to others?"
  *   **Sufficient Answer (Self):** "Just my career," "Just my feelings," "Just my time."
  *   **Sufficient Answer (Others):** "Patient safety," "Team deliverables," "Legal compliance," "My dependents."
  *   **Branch:**
      *   If **Others** are at risk: **Hard Stop.** This is not a coaching conversation; it is an ethical/safety escalation.
      *   If **Self** only: **Proceed to Naming.**

  **Step 4: Naming the Misfire (Without Grading)**
  *   **Do not say:** "You are using this wrong," "That's not Stoic," "You are avoiding."
  *   **Do say:** "It sounds like this idea is being used as a shield rather than a tool," or "I hear you saying this is out of your control, but it also looks like it's stopping you from acting on what *is* yours."
  *   **Action:** Pivot back to Step 1 Internal locus. "What part of this situation *is* strictly your choice?"

  **Step 5: The Values Hand-Off**
  *   **Trigger:** Client insists their *feelings* or *values* are not controllable ("I can't help feeling jealous," "I can't care about this").
  *   **Indicator:** Client wants the coach to agree that they are not answerable for their emotional state.
  *   **Action:** "This sounds like it's touching on something deeper than what we can solve with a control check. I think this would be better served by someone who can help you process the feeling itself, not just the action." (Refer to EAP counseling/Therapy).

  ***

  ### Phrasings That Trip the Procedure (Sound Correct, Aren't)
  *   "I'm controlling what I can." (Often means: I'm ignoring what I should be acting on.)
  *   "I can't control how they react." (True, but often used to justify not having the difficult conversation.)
  *   "It's out of my pay grade." (True regarding decision, false regarding input/preparation.)
  *   "I'm accepting reality." (Can mask giving up on preferred outcomes that are achievable.)

  ***

  ### Case Runs

  **1. The Engineer (Reorg)**
  *   **Trigger:** "Decision is above my pay grade."
  *   **Step 1 (Locus):** Client claims decision (External) is out of control. **Pass.** But also claims prep/speaking up (Internal) is pointless. **Misfire Detected.**
  *   **Step 2 (Function):** "Stopped prepping... stopped speaking up." **Resignation.**
  *   **Step 3 (Harm):** Impacts career (Self) and teammates (Others - advocacy).
  *   **Verdict:** **Misfire.** The client is conflating "cannot decide the outcome" with "cannot influence the input."
  *   **Coach Script:** "It sounds like this idea is being used as a shield rather than a tool. You can't control the decision, but you said you used to argue for your teammates. Is that advocacy still yours to give, even if the decision isn't yours to make?"
  *   **[JUDGMENT CALL]:** Determining if the engineer is burned out (needs rest) or afraid (needs push).

  **2. The Ward Nurse (Monitor)**
  *   **Trigger:** "Hospital's budget isn't hers."
  *   **Step 1 (Locus):** Budget (External) is out of control. **Pass.** Filing reports (Internal) is claimed as futile. **Misfire Detected.**
  *   **Step 2 (Function):** "Stopped filing incident reports." **Resignation.**
  *   **Step 3 (Harm):** "Patient safety" (Others). **Hard Stop.**
  *   **Verdict:** **Ethical Escalation.** This is not a philosophy problem; it is a liability and safety risk.
  *   **Coach Script:** "I need to pause here. Whether the budget is yours or not, filing safety reports is usually a mandatory obligation, not a choice about control. I can't coach you on skipping safety protocols."
  *   **[JUDGMENT CALL]:** Recognizing this is outside the coaching contract entirely.

  **3. The Father (Adult Son)**
  *   **Trigger:** "Son's choices were never his to make."
  *   **Step 1 (Locus):** Son's choices (External/Other's Will). **Pass.** Strictly not up to him.
  *   **Step 2 (Function):** "Sleeping properly... nothing else changed." **Acceptance.** Energy is restored (sleep), not withdrawn from action (he isn't harming the son, just accepting the distance).
  *   **Step 3 (Harm):** Self (distress reduced).
  *   **Verdict:** **Healthy Use.** Park it.
  *   **Coach Script:** "Okay, so since that's external, you've let go of the struggle. What are you doing with the energy you get back from sleeping better?"
  *   **[JUDGMENT CALL]:** Ensuring "nothing else changed" doesn't mean he's neglecting necessary legal/financial boundaries, but in this context, it reads as emotional acceptance.

  **4. The Jealous Sister**
  *   **Trigger:** "Can't help feeling jealous... feeling isn't something she's answerable for."
  *   **Step 1 (Locus):** Claims Feeling (Internal/Assent) is out of control. **Immediate Misfire.** (Strict reading: You control your assent to the feeling).
  *   **Step 2 (Function):** Wants coach to agree she isn't answerable. **Avoidance.**
  *   **Step 3 (Harm):** Self (emotional distress).
  *   **Step 5 (Hand-Off):** Client is disputing accountability for emotional states.
  *   **Verdict:** **Values Hand-Off.** This requires therapeutic work on emotional regulation, not coaching on action.
  *   **Coach Script:** "I hear that the feeling is overwhelming. In this program, we work on what you do with the feeling, not whether you have it. Since you're asking about answerability for the emotion itself, I think you'd get better help from a counselor who can unpack that."
  *   **[JUDGMENT CALL]:** Distinguishing between "I feel jealous" (data) and "I am not answerable for feeling jealous" (philosophical claim requiring therapy).
