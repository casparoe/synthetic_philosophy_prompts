      *   **Mechanism vs. Event:** Distinguish between predicting a specific event (famine) and a structural condition (deficit). The latter happened, the former didn't.
      *   **Scoring/Time Horizon:** Address the Brier score/Popper argument. Who checks in 2050? It creates an accountability gap.
      *   **Recommendation & Rulebook Principle:** Propose the Mechanism Citation and draft the new rule language.

  4.  **Drafting - Content & Tone Check (Iterative Process):**

      *   *Tone:* Needs to sound like a philosopher who knows the social science context. Not too academic, but precise.
