      *   **1. Accuracy Pass:**
          *   *Claim:* "Narrow-sense can in principle come out higher than broad-sense..."
              *   *Analysis:* This is mathematically suspicious. $H^2 = V_G / V_P$. $h^2 = V_A / V_P$. Since $V_G$ includes $V_A$ + $V_D$ + $V_I$, $V_G \ge V_A$. Therefore $H^2 \ge h^2$. The draft says non-additive effects get counted twice in the *denominator*? No, variance components sum to total variance. If non-additive is in $V_G$, it's in the numerator of $H^2$. If it's not in $V_A$, it's not in the numerator of $h^2$. The only way $h^2 > H^2$ is estimation error or specific model misspecification (e.g., shared environment confounding in twin studies masquerading as additive genetics).
