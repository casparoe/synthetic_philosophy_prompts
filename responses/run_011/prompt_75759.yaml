      *Let's select the top 8-9:*
      1.  Cliometrician: Unfalsifiable/Unmeasurable PNR.
      2.  Modeler: Rediscovering Stochastic Stability.
      3.  Cliometrician: Persistence *is* the phenomenon (why complicate?).
      4.  Historian: Counterfactuals are fiction.
      5.  Philosopher: Level of Description is gerrymandering.
      6.  Policy: Early intervention implications.
      7.  Modeler: Feedback mechanisms *define* PD, why switch them off?
      8.  Cliometrician: Support of the data (admissible perturbations).
      9.  Philosopher: Dissolution vs. Explanation.

