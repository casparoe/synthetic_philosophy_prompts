  ### The Access/Phenomenal Decision Tree

  **Starting Point:** We agree it makes sense to ask "what it is like" to be a subject at a time, and we agree that some information a subject discriminates and acts upon is not reported.

  **Node 1 (Sperling Array)**
  *Scenario:* A briefly displayed array of twelve letters which the subject can report almost any row of when cued after offset but only about four items of when asked for all of them, and who insists that a moment later the whole array was still there, fading.
  *Claim:* Does the phenomenal field exceed the reportable capacity at the moment of display?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 2.

  **Node 2 (Loss of Confidence)**
  *Scenario:* A subject whose first-order discrimination is flawless but who has lost all confidence in it, saying that she can tell you the patch is blue though it does not seem to her that she sees blue.
  *Claim:* Is the subject's denial of "seeming" correct (there is no phenomenology) or incorrect (there is phenomenology despite the denial)?
  *   **Correct (No Phenomenology):** Go to Node 3.
  *   **Incorrect (Phenomenology Exists):** Go to Node 4.

  **Node 3 (Illusionism Check)**
  *Scenario:* A word rendered unreportable by a following mask which nonetheless speeds a related judgment.
  *Claim:* Is the "feeling" of consciousness in normal cases a genuine property or a cognitive impression generated by the same mechanisms producing the priming?
  *   **Cognitive Impression (Illusion):** **Leaf 1.**
  *   **Genuine Property (Realism):** Go to Node 4.

  **Node 4 (CFS Variant)**
  *Scenario:* An image held invisible for seconds by suppression, where forced-choice guesses about its orientation run above chance while the subject says there was nothing it was like — set against a variant subject who reports a contentless sense that something was there.
  *Claim:* Is access all-or-none, or can there be a graded phenomenal state without full reportability?
  *   **Graded State Possible:** **Leaf 2.**
  *   **All-or-None:** Go to Node 5.

  **Node 5 (Blindsight)**
  *Scenario:* A subject who localizes and discriminates within a scotoma while sincerely denying that she sees anything there.
  *Claim:* Does consciousness require a higher-order state about the first-order discrimination, or is the first-order state sufficient?
  *   **Requires Higher-Order State:** **Leaf 3.**
  *   **First-Order Sufficient:** Go to Node 5b.

  **Node 5b (Global Workspace Robot)**
  *Scenario:* A system engineered as a literal global workspace — competing specialist modules, a shared bus, broadcast to consumers — which was never trained to talk about experience and which, once given a language module, denies that there is anything it is like to be it.
  *Claim:* Is the broadcasting mechanism constitutive of consciousness, or is it merely a mechanism for access in a conscious system?
  *   **Constitutive:** **Leaf 4.**
  *   **Merely Access:** **Leaf 5.**

  **Node 6 (Masked Priming)**
  *Scenario:* A word rendered unreportable by a following mask which nonetheless speeds a related judgment.
  *Claim:* Does semantic processing without report imply the presence of phenomenal consciousness?
  *   **No (Unconscious Semantics):** Return to Node 1 (No Branch).
  *   **Yes (Phenomenal Semantics):** Go to Node 7.

  **Node 7 (Custom: The Silicon Twin)**
  *Scenario:* A perfect functional duplicate of a human brain made of silicon chips rather than neurons, exhibiting identical behavior and report.
  *Claim:* Can phenomenal consciousness be fully constituted by functional relations, or does it require specific biological or intrinsic properties?
  *   **Functional Relations Sufficient:** Go to Node 8.
  *   **Requires Intrinsic/Biological Properties:** Go to Node 9.

  **Node 8 (Anesthesia)**
  *Scenario:* A patient who shows implicit memory for words presented under light anaesthesia and no report at all.
  *Claim:* Is recurrent processing between higher and lower cortical areas required for phenomenal consciousness, or is feedforward first-order representation sufficient?
  *   **Recurrent Processing Required:** **Leaf 6.**
  *   **Feedforward Sufficient:** **Leaf 7.**

  **Node 9 (Custom: The Causal Gap)**
  *Scenario:* A conceivable world physically identical to ours where subjects discriminate and report exactly as we do, but there is nothing it is like to be them (Zombie World).
  *Claim:* Does the existence of phenomenal consciousness violate the causal closure of the physical domain?
  *   **Yes (Violates Closure):** **Leaf 8.**
  *   **No (Compatible with Closure):** **Leaf 9.**

  ***

  ### The Leaves

  **Leaf 1: Illusionism / Deflationism**
  *   **Verdict:** The subject in Node 2 is correct; there is no phenomenal property, only a cognitive judgment.
  *   **Awkward Commitment:** Must explain why the illusion of consciousness is itself so persistent and resistant to correction without appealing to a real feeling.
  *   *(Canonical Defender: Frankish)*

  **Leaf 2: Graded Access**
  *   **Verdict:** The variant subject in Node 4 is right; consciousness is not all-or-none but admits of degrees matching confidence.
  *   **Awkward Commitment:** Must define the metric for "degrees" of consciousness without collapsing back into a measure of access capacity.
  *   *(Canonical Defender: Phillips)*

  **Leaf 3: Higher-Order View**
  *   **Verdict:** The blindsighter in Node 5 lacks consciousness because they lack a higher-order thought about their state.
  *   **Awkward Commitment:** Must attribute consciousness to infants or animals only if they possess the conceptual capacity for higher-order thought.
  *   *(Canonical Defender: Rosenthal)*

  **Leaf 4: Broadcast View (Global Workspace)**
  *   **Verdict:** The robot in Node 5b is conscious if and only if information is broadcast to the global workspace.
  *   **Awkward Commitment:** Must deny consciousness to systems with rich local processing but no global broadcast, even if they behave identically to conscious agents.
  *   *(Canonical Defender: Dehaene)*

  **Leaf 5: Identity View (Access = Phenomenal)**
  *   **Verdict:** The robot in Node 5b is conscious, but broadcasting is not the definition; consciousness is simply the availability of information for report.
  *   **Awkward Commitment:** Must deny the Sperling intuition (Node 1) that more is seen than reported, treating rich experience as confabulation.
  *   *(Canonical Defender: Dennett)*

  **Leaf 6: Local / Recurrent-Processing View**
  *   **Verdict:** The anesthetized patient in Node 8 had no consciousness because recurrent loops were broken, despite first-order registration.
  *   **Awkward Commitment:** Must locate consciousness in specific cortical loops, risking the claim that subcortical or feedforward states are never phenomenal.
  *   *(Canonical Defender: Lamme)*

  **Leaf 7: First-Order Representational View**
  *   **Verdict:** The anesthetized patient in Node 8 had consciousness if the first-order representation was formed, regardless of recurrence or report.
  *   **Awkward Commitment:** Must attribute rich phenomenal experience to systems that are behaviorally unresponsive and unable to integrate information globally.
  *   *(Canonical Defender: Tye)*

  **Leaf 8: Substance Dualism**
  *   **Verdict:** The Zombie World in Node 9 is metaphysically possible; consciousness is a non-physical substance.
  *   **Awkward Commitment:** Must explain how a non-physical substance interacts with the physical brain without violating conservation laws.
  *   *(Canonical Defender: Descartes)*

  **Leaf 9: Russellian Monism / Panpsychism**
  *   **Verdict:** The Zombie World in Node 9 is impossible; consciousness is the intrinsic nature of the physical.
  *   **Awkward Commitment:** Must explain how micro-phenomenal properties combine to form macro-subjects without falling into the combination problem.
  *   *(Canonical Defender: Chalmers / Goff)*

  ***

  ### Map of the Space

  **Unoccupied Regions**
  1.  **Overflow + Illusionism:** Empty because incoherent. One cannot claim experience overflows access while simultaneously claiming experience is an illusion.
  2.  **Access + Dualism:** Empty because unattractive. If consciousness is limited to access (functional report), positing a non-physical substance adds explanatory cost without solving the hard problem.
  3.  **Higher-Order + Overflow:** Empty because nobody has yet thought to stand there. While logically possible (unconscious HO states?), standard HOT theory ties consciousness tightly to cognitive access.
  4.  **First-Order + Dualism:** Occupied (Leaf 8 covers this), but **First-Order + Russellian** is merged with **Local + Russellian** (Leaf 9). The tree's questions on mechanism (Node 8) do not distinguish the metaphysical ground (Node 9).

  **Inseparable Leaves**
  *   **Russian Monism and Panpsychism (Leaf 9):** The tree cannot separate these. Both affirm consciousness is intrinsic to the physical and compatible with causal closure. Distinguishing them requires cosmological questions (does *all* matter have experience?) rather than cognitive scenarios.
  *   **Illusionism and Identity (Leaf 1 vs Leaf 5):** These are the hardest to separate. Both deny Overflow. Both affirm Physicalism. The distinction rests entirely on the interpretation of the *error* in Node 2. If the student says the subject is *confabulating a property*, it is Illusionism. If the student says the subject is *misdescribing a functional state*, it is Identity.
      *   *Tie-Breaker:* Ask: "Is the feeling of 'what it is like' a real datum to be explained, or a heuristic error to be explained away?"

  **Confidence Ratings**
  *   **Leaf 1 (Illusionism):** High Confidence. The Node 2/3 split isolates the view that phenomenality is a user-illusion.
  *   **Leaf 2 (Graded):** High Confidence. Node 4 specifically targets the all-or-none assumption.
  *   **Leaf 3 (HOT):** High Confidence. Node 5 targets the requirement for meta-representation.
  *   **Leaf 4 (Broadcast):** Medium Confidence. Node 5b isolates the GW claim, but GW theorists often overlap with Identity theorists.
  *   **Leaf 5 (Identity):** Medium Confidence. Distinguishing from Illusionism (Leaf 1) is the shakiest joint in the tree.
  *   **Leaf 6 (Local):** High Confidence. Node 8 targets the recurrent processing requirement.
  *   **Leaf 7 (FOR):** High Confidence. Node 8 targets the sufficiency of first-order states.
  *   **Leaf 8 (Dualism):** High Confidence. Node 9 targets causal closure violation.
  *   **Leaf 9 (Russellian/Pan):** High Confidence. Node 9 targets intrinsic nature without closure violation.

  **The Shakiest Joint**
  I agree with your suspicion: the boundary between **Illusionism (Leaf 1)** and **Identity (Leaf 5)** is the weakest point in the instrument.
  *   **Why:** Both views yield the same verdict on every scenario involving Overflow (they deny it) and every scenario involving Unconscious Processing (they deny P). They differ only on the ontological status of the *report* of experience. The Identity theorist says "The report of experience reports the Access state." The Illusionist says "The report of experience reports a non-existent property generated by the Access state."
  *   **The Wedge:** The only thing that drives a wedge between them is the student's willingness to call the feeling of qualia a "mistake." If they say "The feeling is real, it just *is* access," they are Identity. If they say "The feeling is a user-interface icon, not the file," they are Illusionist.
  *   **Mislocation:** You located this shakiness correctly. However, I would add that the boundary between **Broadcast (Leaf 4)** and **Identity (Leaf 5)** is also porous. Many Global Workspace theorists are Identity theorists. The tree forces a choice at Node 5b that some students may find artificial (one can believe GW is the mechanism of Access *and* P without believing GW is the *definition* of P). The tree treats Broadcast as a constitutive claim to force a leaf, but in the wild, it is often a mechanistic claim compatible with Identity.
