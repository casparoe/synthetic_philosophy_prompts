  ### Part 3: The Lewis Orthodoxy Check

  Your suspicion is correct: she has bolted on conditions Lewis never required. Here is where she deviates from the text of *Convention: A Philosophical Study* (1969).

  **1. The Authority Condition (Her biggest deviation)**
  *   **Her View:** Authority origin disqualifies a convention (Code Comments, ISO Dates).
  *   **Lewis's View:** **Orthodox.** Lewis explicitly states that conventions *can* begin by explicit agreement or decree. He writes that once an agreement is made, if it is sustained by mutual expectations of conformity rather than the threat of punishment, it *becomes* a convention. The origin does not matter; the *sustenance* does.
  *   **Breakfast Ammo:** "Lewis says explicit agreement can *create* a convention if it becomes self-policing. You're ruling out ISO dates based on genesis, but Lewis cares about maintenance."

  **2. The Population Condition (QWERTY)**
  *   **Her View:** Typists don't coordinate with typists; they coordinate with manufacturers.
  *   **Lewis's View:** **Debatable/Strict.** Lewis defines the population *P* as the group for whom the regularity holds. If typists conform because they expect *other typists* to conform (to ensure file compatibility), it's a convention. If they conform only because they expect *manufacturers* to build QWERTY, it's less clear. However, Lewis generally allows for indirect coordination. Her exclusion is a defensible but strict reading.

  **3. The Stability Condition (DST)**
  *   **Her View:** Contested regularities aren't conventions.
  *   **Lewis's View:** **Unorthodox.** Lewis acknowledges that conventions can be suboptimal and that populations can have preferences over which convention to have. As long as the current regularity is a coordination equilibrium (I do it because you do), it counts, even if we'd both rather be on a different equilibrium.
  *   **Breakfast Ammo:** "Lewis allows for 'suboptimal' conventions. The fact that we want to switch to Standard Time doesn't mean DST isn't the convention we currently have."

  **Summary for Breakfast:**
  She is running a **hybrid theory** that mixes Lewis's Coordination Problem with Margaret Gilbert's or Cristina Bicchieri's work on **Social Norms**. Specifically, she is treating "Convention" as a normative ideal (stable, spontaneous, functional) rather than Lewis's descriptive game-theoretic category (any self-sustaining coordination equilibrium).

  **Your winning move:** Don't fight her on the *intuition* (she's the expert). Fight her on the **text**. Point out that Lewis explicitly allows for **authority origins** and **suboptimal equilibria**. If she wants to be a Lewis scholar, she has to account for why she's stricter than Lewis himself. If she says "Lewis was wrong," you win. If she says "I'm applying Lewis correctly," you show her the passages on explicit agreement (Chapter 3, Section 4.3) and suboptimal conventions. Good luck.
