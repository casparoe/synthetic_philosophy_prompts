  ### Part 2: The Rules

  **The Housemate's Rule: "Strict Consensus Lewis"**
  To count as a convention, a regularity must satisfy five conditions:
  1.  **Conditionality:** Agents prefer to conform *only if* others do (Excludes Tipping, Queue).
  2.  **Directness:** The coordinating population must be the conforming population (Excludes QWERTY).
  3.  **Spontaneity:** The regularity must not originate from authority/decree (Excludes Code Comments, ISO Dates).
  4.  **Vitality:** The practice must serve a current coordinating function, not just historical inertia (Excludes *Bless You*, Logbook).
  5.  **Stability:** The equilibrium must not be subject to significant political contestation or resentment (Excludes DST).

  **The Rival Rule: "Equilibrium Lewis"**
  To count as a convention, a regularity must satisfy four conditions:
  1.  **Conditionality:** Agents prefer to conform *only if* others do.
  2.  **Directness:** The coordinating population must be the conforming population.
  3.  **Spontaneity:** The regularity must not originate from authority/decree.
  4.  **Vitality:** The practice must serve a current coordinating function.
  *(Note: This rule drops the **Stability** requirement.)*

  **Why this Rival Rule works:**
  It fits all nine of her past verdicts. None of her "Yes" cases were contested, and none of her "No" cases were merely contested (they failed on Conditionality, Directness, Spontaneity, or Vitality). However, it diverges on **Daylight Saving Time**.
  *   **Housemate:** No (because of the grumble/instability).
  *   **Rival:** **Yes.** (Because it *is* a coordination equilibrium. Everyone conforms because others do. The fact that they would collectively prefer a *different* equilibrium doesn't stop the current one from being a convention. Lewis explicitly allows for suboptimal conventions).

  **The Crucial Test Case:**
  **Daylight Saving Time.**
  This is the wedge. If you can convince her that a convention can be a "bad" or "contested" equilibrium (as Lewis argues regarding suboptimal standards), her rule collapses into the Rival Rule, and DST becomes a convention. If she holds firm that contested regularities aren't conventions, she is running "Strict Consensus Lewis."

