  *   **Reasoning:** Her rejection of *Bless You* relied on the idea that the practice is held up by inertia and beliefs about beliefs, without a functioning coordination payoff. The Logbook is worse: it is held up by *false* beliefs ("I assumed others expected it" -> they don't). Lewis requires common knowledge of the regularity and the preferences. If the expectations sustaining the action are false, it's not a convention; it's a mass mistake. She will likely view this as a "zombie practice" similar to *Bless You*.

