answer: |-
  Your summary of the Paradox of Phenomenal Judgment (PPJ) is precise, and your intuition about the structural kinship with Sharon Street's Darwinian Dilemma (SDD) is correct. You have identified a genuine isomorphism in the argument form: both are challenges to **causally isolated truths**. In both cases, a domain of facts (phenomenal/moral) is posited as ontologically distinct from the causal machinery that produces judgments about them (neural/evolutionary), creating an explanatory gap regarding the correlation between judgment and fact.

  Your label "borrowed tracking" is apt. It describes the maneuver where the defender explains the correlation not by the facts causing the judgments, but by a third factor (physical states/fitness) causing the judgments while coinciding with the facts via some law or relation.

  Here is the structural comparison, the breakdown of the analogy, and the verdict you requested.

  ### 1. The Structural Isomorphism

  Both arguments rely on a **Causal Exclusion Premise** and a **Correlation Observation**.

  *   **PPJ (Chalmers):**
      *   *Exclusion:* Phenomenal states (qualia) are causally inert regarding physical reports (due to physical causal closure).
      *   *Correlation:* Physical reports reliably match phenomenal states (I say "red" when I see red).
      *   *Challenge:* Explain the correlation without causal interaction.
  *   **SDD (Street):**
      *   *Exclusion:* Moral facts are causally inert regarding evolutionary pressures (moral facts don't cause survival).
      *   *Correlation:* Evolutionary pressures reliably shaped judgments that match moral facts (we judge survival-promoting acts as "good," and let's assume they *are* good).
      *   *Challenge:* Explain the correlation without causal interaction.

  In both cases, the "Borrowed Tracking" reply posits a **Common Cause or Nomological Link**.
  *   **Chalmers:** Psychophysical laws link brain state $P$ and experience $E$. $P$ causes Report $R$. Therefore, $R$ correlates with $E$.
  *   **Street:** Conceptual or substantive links link Fitness $F$ and Moral Truth $T$. $F$ causes Judgment $J$. Therefore, $J$ correlates with $T$.

  ### 2. Where the Analogy Breaks (The Asymmetries)

  You suspected asymmetries regarding self-refutation, granularity, and the availability of laws. You are right on all three, but the implications are deeper than they first appear.

  **A. The Self-Refutation vs. Skepticism Asymmetry**
  This is the critical divergence.
  *   **SDD:** If the realist fails to explain the correlation, the conclusion is **skepticism**. We must admit our moral judgments are likely false or unjustified. The *moral facts* might still exist; we just can't know them. The theory (Realism) survives, but our access to it is severed.
  *   **PPJ:** If the epiphenomenalist fails to explain the correlation, the conclusion is **incoherence**. The report "I have an experience" is a physical event. If the experience played no role in causing the report, the report is not *about* the experience in any causal-historical sense. It is a "blind" utterance. If the utterance is accurate, it is a miracle. If it is inaccurate, epiphenomenalism is false (because we know we have experiences).
      *   *Crucial Point:* In SDD, the realist can say, "We are wrong about morality, but morality exists." In PPJ, the epiphenomenalist cannot say, "I am wrong about my experience," because the *seeming* of the experience is the only evidence for its existence. To doubt the report is to doubt the datum that motivates epiphenomenalism in the first place. PPJ saws off the branch *while* you are sitting on it; SDD saws off the ladder *after* you have climbed up.

  **B. The Granularity Asymmetry**
  Your point on color gradients is devastating for "luck" explanations.
  *   **PPJ:** Phenomenal discrimination is hyper-fine-grained (e.g., distinguishing shade #A00 from #A01). The neural machinery tracks this. If qualia are epiphenomenal, the psychophysical law must map *every* discriminable neural state to a *unique* phenomenal state that matches the report. The "space" of possible qualia mappings is vast; the space of *truthful* mappings is tiny. Positing a law that guarantees this alignment without causal feedback looks like a pre-established harmony of Leibnizian proportions.
  *   **SDD:** Moral intuitions are coarse-grained ("murder is wrong," "care for offspring"). There are far fewer moral "truths" required to match evolutionary outputs. A third-factor explanation (e.g., "survival is generally good") covers a broad swath of judgments with a single principle. The "coincidence" is statistically less improbable because the resolution of the tracking is lower.

  **C. The "Borrowed Tracking" Mechanism**
  *   **Chalmers:** Invokes **Psychophysical Laws**. These are brute, fundamental laws of nature. He is already committed to them to solve the Hard Problem. Adding a clause that ensures *veridical judgment* is ontologically "cheap" for him but explanatorily expensive.
  *   **Street:** Invokes **Conceptual/Substantive Truths**. The realist cannot posit a "Moral-Evolutionary Law" without begging the question. They must argue that the *content* of morality overlaps with fitness (e.g., "It is true that survival is good"). This is not a brute law; it is a moral claim that requires independent justification. If the justification is "because evolution shaped us to think so," it's circular. If it's "because survival is objectively valuable," it requires a moral argument that Street argues is unavailable without begging the question.

  ### 3. Deep Dive: Does Borrowed Tracking Dissolve the Paradox?

  You asked if invoking psychophysical laws dissolves PPJ or relocates the coincidence. **It relocates the coincidence, and fatally.**

  Here is the pressure point: A psychophysical law explains why Experience $E$ occurs when Brain State $P$ occurs. It does *not* explain why Brain State $P$ causes Report $R$ *with the content "I am having E."*

  If $E$ is epiphenomenal, $P$ is doing all the causal work. $P$ would exist in a Zombie twin. The Zombie twin produces Report $R$ ("I see red"). In the Zombie, $R$ is false (no red experience). In the Epiphenomenalist, $P$ is identical, so the causal history of $R$ is identical. The only difference is the presence of $E$. But since $E$ does nothing, it cannot fix the reference of $R$.

  Therefore, the *truth* of $R$ is extrinsic to the causal history of $R$. The report is true only because a law *happens* to attach an experience to the brain state that produced the report. This makes the truth of the report **modally fragile**. In the nearest possible world where the psychophysical law is slightly different (e.g., $P$ maps to Green Experience), the subject says "I see Red" (because $P$ is unchanged) but sees Green. The report is false.

  So, Chalmers has not explained why our reports are *reliable*; he has only posited a law that *stipulates* they are reliable in the actual world. He has replaced a causal mystery with a nomological coincidence. The question "Why are the laws arranged so that experiences line up with truthful reports?" remains unanswered.

  **Is this maneuver open to the Value Realist?**
  No, not in the same way. Street's realist cannot posit a brute "Moral-Psychological Law." They must argue for a substantive overlap between fitness and truth.
  *   **Chalmers** can say: "It is a fundamental law that $P \rightarrow E$ and $P \rightarrow \text{Report 'I see E'}$." (He can build veridicality into the law).
  *   **Street's Realist** cannot say: "It is a fundamental law that Fitness $\rightarrow$ Judgment and Fitness $\rightarrow$ Moral Truth." Moral truths are not the kind of things that are linked to fitness by fundamental laws; they are normative.
  *   Consequently, the Realist's "borrowed tracking" is more vulnerable. They have to argue that the *reasons* for fitness align with the *reasons* for moral truth. Street argues this is implausible (fitness is about reproduction, truth is about normativity). Chalmers argues the alignment is brute. Brute alignment is mysterious, but substantive alignment is arguably contradictory.

  ### 4. The Verdict

  **The Paradox of Phenomenal Judgment is the more damaging problem for its target.**

  **Reasons:**

  1.  **Self-Undermining vs. External Skepticism:** PPJ renders Epiphenomenalism **self-refuting** in a way SDD does not render Moral Realism self-refuting. If I accept PPJ, I must accept that my belief in epiphenomenalism is not caused by the evidence (my experience) but by a physical chain that would exist even if the evidence were absent. This severs the justification for the belief itself. SDD leaves the moral realist with the claim "Moral facts exist, but we might be wrong about them." This is a stable, albeit skeptical, position. Epiphenomenalism + PPJ yields "Experiences exist, but my belief in them is causally unconnected to them," which undermines the *aboutness* of the belief.
  2.  **The Reference Problem:** PPJ attacks **intentionality**. If qualia do nothing, how does the neural state refer to *them* specifically? In the moral case, reference can be fixed by description ("the property that plays the 'good' role"). In the phenomenal case, reference is supposed to be by **acquaintance**. If acquaintance is epiphenomenal, it cannot fix reference. This makes the epiphenomenalist's language literally meaningless. Street's dilemma does not render moral language meaningless, only potentially false.
  3.  **Granularity of Coincidence:** As you noted, the precision of phenomenal reporting makes the "nomological coincidence" required by Chalmers far more improbable than the coarse overlap required by the Moral Realist. To save Epiphenomenalism, you need a law that tracks million-shade color gradients without causal feedback. To save Moral Realism, you need a principle that tracks "survival is good." The former is a miracle of engineering; the latter is a philosophical disagreement.

  **Conclusion:**
  Your group's intuition is correct. While the argument forms are isomorphic, the PPJ is lethal because it attacks the **intelligibility** of the theory from the first-person perspective, whereas SDD attacks the **justification** of the theory from a third-person perspective. Chalmers' "borrowed tracking" via psychophysical laws does not dissolve the paradox; it merely codifies the miracle into a law. Street's realist has even less room to maneuver, but the cost of failure is lower (skepticism vs. incoherence). Epiphenomenalism is the view in greater peril.
