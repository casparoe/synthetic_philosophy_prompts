answer: |-
  It is a genuine pleasure to correspond with someone who brings the rigor of metrology to the *Nicomachean Ethics*. Your analogy of the 2019 kilogram redefinition is not merely apt; it is, I would argue, the most illuminating modern parallel to Aristotle's problem in Book V. You are asking the right questions, and your instinct that there is a hierarchy rather than a contradiction in the text is correct.

  I will address your five difficulties in order, sticking closely to the Greek terms behind Rackham's translation, as you requested.

  ### 1. One Standard or Two? (*Chreia* vs. *Nomisma*)

  You ask whether "in reality" (*tēi alētheiai*) marks a correction of opinion or a statement of the normal case. It marks an ontological priority.

  There are not two competing standards, but rather a distinction between the **ground** of commensurability and the **instrument** of commensurability.
  *   **The Ground:** *Chreia* (need/demand). This is what makes exchange possible at all. If no one needed shoes, shoes would have no value to exchange for a house. *Chreia* is the "physical quantity" in your analogy.
  *   **The Instrument:** *Nomisma* (currency). This is the "artifact standard" (the IPK).

  When Aristotle says the standard "is in reality demand," he is identifying the cause (*aitia*). When he says all things are measured by money, he is identifying the tool (*organon*). The text is not inconsistent; it is layered. Money is the *representative* of demand. Just as the kilogram artifact represented mass, money represents *chreia*.

  The phrase "in reality" is Aristotle's way of peeling back the convention to find the natural basis. He is correcting the opinion that money *is* the value, rather than the *sign* of the value. So, to use your hierarchy: Need is the measure in principle (the definition of the quantity); Coin is its conventional deputy (the realization of the unit).

  ### 2. The Impossibility of Strict Commensurability

  You ask if this is a failure of kind (undefined quantity) or precision (bias). In Aristotelian terms, it is a failure of kind, but one that is bridged by convention for the sake of *praxis*.

  The Greek word is *summetra* (commensurable). In mathematics, two magnitudes are commensurable if they share a common measure (a ratio of integers). A line and a number are not *summetra* in the strict sense because they belong to different categories (*katēgoriai*). Similarly, a house (substance/shelter) and a shoe (substance/protection) are qualitatively different. There is no "value" particle inside them that we can count.

  Therefore, strictly speaking, the ratio is **undefined**. No amount of calibration can find a common natural unit between a house and a shoe.

  However, Aristotle immediately qualifies this: "our demand furnishes a sufficiently accurate common measure for practical purposes." This is a direct application of the methodological principle from Book I, Chapter 3: we must not seek the same degree of exactness in all discussions. In ethics and politics, we deal with things that are "true only for the most part."

  So, is it a defect? No, it is the whole point. Justice in exchange is not a geometric truth; it is a political achievement. We *make* them commensurable by agreeing to treat them as such. The "approximation" is not a failure of the theory; it is an acknowledgment that human association (*koinōnia*) rests on agreement, not natural law. If you demand strict commensurability here, you destroy the possibility of the *polis*.

  ### 3. Diagonal Conjunction

  You suspect the geometry is a device for bookkeeping. You are correct. It is not load-bearing mathematics; it is a schematic for reciprocity.

  Let us reconstruct the figure Aristotle implies.
  *   A = Builder
  *   B = Shoemaker
  *   C = House (Builder's product)
  *   D = Shoe (Shoemaker's product)

  If we arrange these in a square (A top-left, B top-right, C bottom-left, D bottom-right), a direct horizontal exchange would be A exchanging with C (Builder taking his own house), which is nonsense.
  The "diagonal conjunction" (*diagōnios*) pairs the producer with the *other's* product.
  *   Diagonal 1: A (Builder) is joined to D (Shoe).
  *   Diagonal 2: B (Shoemaker) is joined to C (House).

  The proportion runs: **Builder : Shoemaker :: Shoes : House.**
  (Or, in modern terms: $A/B = D/C$).

  The geometry ensures that the *persons* are equated only through the *products* of the other. It prevents self-reference. It is a visual aid to ensure that reciprocity (*antipeponthos*) is maintained. The "diagonal" is simply the line of exchange. It has no deeper metaphysical weight than ensuring A gets what B made, and B gets what A made.

  ### 4. Money by Custom (*Nomos*) and the Kilogram Analogy

  Your intuition here is excellent. When Aristotle says money "does not exist by nature but by custom (*nomos*)," he is distinguishing between the **material** (silver/bronze) and the **function** (measure).

  *   **What alteration?** He primarily has in view legal revaluation or debasement. The *polis* can stamp a piece of metal and declare it worth a drachma, and later declare it worth two, or withdraw the stamp entirely. The "uselessness" comes from the withdrawal of the legal guarantee (*nomos*), not the disappearance of the metal.
  *   **Politics vs. Ethics:** In the *Politics*, Aristotle describes the *genealogy* of money (people naturally drifted to metal for convenience). In the *Ethics*, he describes its *logic* (its status as a measure depends on agreement). These are not contradictory. One explains how it arose historically; the other explains how it functions normatively.
  *   **The Kilogram:** Your 2019 analogy is precise. When the kilogram ceased to be the IPK (the artifact) and became a fixed numerical value of a constant (the convention), the *measure* changed, but *mass* (what is measured) did not. Aristotle would say the IPK was *nomisma*. It existed by custom. When you changed the definition, you "altered it at will" by agreement.
  *   **Change of Measure vs. Measured:** In Aristotle's framework, the redefinition is a change of *measure* (the *nomisma*), not a change of *what is measured* (the *chreia* or the physical quantity). The "reality" (mass/need) remains the anchor; the "name" (kilogram/drachma) is the variable convention.

  ### 5. Stability, Future, and the Arithmetic

  You note the tension between money as a "guarantee" and money as "liable to fluctuation."

  *   **Drifting Reference:** Yes, Aristotle notices the drift. He says money's purchasing power varies "at different times." He does not think this drift can be perfectly corrected, but it can be managed. When he says "the proper thing is for all commodities to have their prices fixed," he is not advocating central planning in the modern sense. He is suggesting that the *nomos* (the law setting the price) should be stable to counteract the natural fluctuation of *chreia*. It is an attempt to freeze the convention so that association remains possible.
  *   **The Arithmetic (5 Beds = 1 House):** This is the crux of your final question. Does the mina do explanatory work, or does it transcribe need?
      *   **Before Money:** The ratio exists potentially in *chreia*. People *could* say "5 beds for a house," but this exchange is specific and limited. It binds the bedmaker to the housebuilder directly.
      *   **With Money:** The mina makes the ratio **universal**. By expressing both as multiples of a middle term (B), Aristotle shows that money allows the ratio to be calculated *indirectly*.
      *   **The Work Money Does:** Money is not merely a recording device. It is a **store of demand**. As he says, it "ensures that exchange shall be possible when a need arises." If I build a house today but need shoes next month, I cannot store "house." I can store "money." Money allows the *chreia* to be decoupled from the immediate transaction.

  So, the arithmetic shows that while the *ratio* is grounded in need (5 beds = 1 house), the *commensurability* is enabled by the unit (minae). The mina explains *how* the comparison is held in mind across time and between third parties. It transforms a barter ratio into a price system.

  ### Summary for your Thursday Group

  1.  **Standard:** Hierarchy. Need is the quantity; Money is the unit.
  2.  **Commensurability:** Strictly undefined (category error); practically defined by convention (ethical sufficiency).
  3.  **Diagonal:** A schematic for reciprocity (Producer A gets Product B).
  4.  **Custom:** The status of money is legal/conventional, even if the material is natural. Your Kilogram analogy holds: changing the definition changes the measure, not the quantity.
  5.  **Arithmetic:** Money universalizes the barter ratio and allows demand to be stored for future exchange.

  You are reading the text with the eyes of a metrologist, which is perhaps the best way to read Aristotle on this subject. He is, after all, trying to solve the problem of how to measure the unmeasurable (human need) to sustain a community. The "uncertainty budget" he arrives at is simply that the measure is conventional, not natural, and must be maintained by the *polis*.

  I hope this aids your Thursday discussion. It is a formidable way to spend retirement.
