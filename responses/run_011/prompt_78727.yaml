      *   *Check:* Is the tone appropriate for a seminar case study? *Yes, analytical and probing.*

  10. **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts.)
answer: |-
  ### The Decisiveness Discount: Explanatory Posit or Artifact?

  The "Decisiveness Discount" (DD) proposes a hybrid psychology: voters possess a fixed budget for expressive voting, which they expend when the perceived probability of decisiveness is low, reserving instrumental rationality for high-stakes moments. In the context of the 2002 election, DD suggests the two-round system incentivized voters to treat Round 1 as a "free" expressive space and Round 2 as the "cash-in" for instrumental damage control.

  **Explanatory Power vs. Post-Hoc Artifact**
  DD has genuine explanatory traction regarding the *shift* between rounds. The turnout jump (71.6% to 79.7%) and the surge in blank ballots (1m to 1.8m) support the idea that the electorate recalibrated its mode of participation once the stakes became existential. The slogan "prefer the crook to the fascist" is a quintessential DD statement: Round 1 allowed for purity; Round 2 demanded containment.

  However, DD risks being a post-hoc rationalization for a miscalculation. For DD to hold, voters must have *believed* Round 1 was insulated from their influence. Yet, polls showed fragmentation for months. If voters understood the arithmetic—that a 7-tenths of a percent margin separated Jospin from elimination—the "discount" was not a rational budgeting of expression but an epistemic failure. DD explains the behavior only if we assume voters systematically underestimated their collective decisiveness in Round 1.

  **Support and Undercutting Evidence**
  *   **Support:** The blank-ballot surge in Round 2 is strong evidence. It indicates voters who felt compelled to act instrumentally (stop Le Pen) but refused to spend expressive capital on Chirac. This aligns with DD's claim that expression is rationed, not abandoned.
  *   **Undercutting:** The stability of small-party polling prior to the election undercuts DD. If voters believed Round 1 was "free," support for fringe candidates should have been stable or rising as a form of protest. Instead, the shock suggests voters *intended* to support Jospin but failed to coordinate. DD describes a strategy; the evidence points to a coordination failure.

  **Falsification Conditions**
  DD would be falsified if expressive voting remained constant regardless of perceived closeness. If, in a hypothetical election where the margin is known to be one vote, voters still cast purely expressive ballots at the same rate as in a landslide, DD is false. Conversely, if voters in "safe" districts (low decisiveness) vote *more* strategically than those in swing districts (high decisiveness), DD is falsified.

  **Normative Status**
  DD is a psychological description, not a normative ethic. It tells us how voters *do* allocate moral risk, not how they *should*. None of the three accounts gives the voter a reason to adopt DD as a rule.
  *   **Instrumental:** Rejects DD. If the stakes are high enough (Le Pen), even a negligible probability demands instrumental voting immediately.
  *   **Expressive:** Rejects DD. Expression is a duty or right independent of stakes. Rationing identity based on utility calculations corrupts the expression.
  *   **Lesser-Evil:** Rejects DD. If the evil is present in Round 1 (as a candidate), the duty to block it exists in Round 1.

  DD is best understood as a heuristic voters use to reconcile the tension between Expressive and Lesser-Evil accounts, but it offers no ethical justification for doing so.

  ***

  ### 1. Map the Agents

  **The Individual Voter (Left, Round 1)**
  *   **Instrumental:** Act was irrational. The expected utility of a Trotskyist vote was near zero; the risk of enabling Le Pen was non-zero.
  *   **Expressive:** Act was authentic. The voter declared allegiance to their specific ideology.
  *   **Lesser-Evil:** Act was impermissible. By not consolidating behind Jospin, the voter permitted a greater evil to advance.
  *   **Silence:** None of the accounts account for the *epistemic uncertainty* the voter faced regarding the final margin.

  **Lionel Jospin**
  *   **Instrumental:** Failed to maximize collective utility. Refusing to call for allied withdrawals preserved party integrity but sacrificed the outcome.
  *   **Expressive:** Maintained integrity. Refusing to beg for votes preserved the Socialist brand identity.
  *   **Lesser-Evil:** Negligent. Allowed the "lesser evil" (himself) to be eliminated by failing to neutralize the "greater evil."
  *   **Silence:** The ethics of voting generally ignores the *candidate's* duty to withdraw or consolidate. It treats candidates as fixed options rather than agents.

  **Chevènement / Trotskyist Candidates**
  *   **Instrumental:** Spoilers. Their participation reduced the probability of the optimal outcome.
  *   **Expressive:** Necessary voices. They ensured specific platforms were represented in the public sphere.
  *   **Lesser-Evil:** Irresponsible. They prioritized ideological purity over the prevention of harm.
  *   **Silence:** No account addresses the *right to stand*. Is it unethical to run if you split the vote?

  **Jacques Chirac**
  *   **Instrumental:** Beneficiary of others' failures. His refusal to debate minimized risk (no gaffes) and maximized the "Republican Front" effect.
  *   **Expressive:** Silent. By refusing to debate, he declined to express a vision, treating the election as a referendum on Le Pen.
  *   **Lesser-Evil:** The "Lesser" option. He was the vessel for blocking, not the object of desire.
  *   **Silence:** Instrumentalism struggles with a winner who wins by *not* acting (debating).

  **The Press**
  *   **Instrumental:** Failed to signal the risk adequately until too late.
  *   **Expressive:** Amplified the fragmentation as a story of "diversity" until it became a story of "disaster."
  *   **Lesser-Evil:** Complicit in normalizing the fringe by treating all 16 candidates as equivalent voices.
  *   **Silence:** All three accounts are silent on the media's role in constructing the *perception* of decisiveness.

  **The Abstainers (8 Million in Round 1)**
  *   **Instrumental:** Rational ignorance. The cost of voting outweighed the negligible probability of influence.
  *   **Expressive:** Silence is a statement. Non-participation expressed disillusionment with the Fifth Republic.
  *   **Lesser-Evil:** Complicit. By not voting for the lesser evil, they allowed the greater evil to advance.
  *   **Silence:** Instrumentalism cannot distinguish between abstention due to apathy and abstention due to strategic calculation.

  ***

  ### 2. Take Seriously the Arithmetic

  **The Probability of Decisiveness**
  The Instrumental Account rests on the premise that the probability ($P$) of a single vote altering the outcome is negligible. In 2002, the margin between Jospin and Le Pen was ~195,000 votes.
  *   **Does this falsify the premise?** No. Even with a 195,000 vote margin, the probability of a *single* vote being the tie-breaker remains statistically vanishingly small (roughly 1 in several million, depending on the distribution model). The episode does not prove that one vote was likely to be decisive.
  *   **Does it challenge the conclusion?** Yes. The Instrumental Account argues that because $P$ is negligible, voting cannot be obligatory. However, Expected Utility = $P \times Value$. If the $Value$ of the difference (Chirac vs. Le Pen) is sufficiently high (existential threat to democracy), then even a negligible $P$ can yield a significant Expected Utility.
  *   **Implication:** The episode suggests the Instrumental Account's error is not in the calculation of $P$, but in the underestimation of $Value$. If the stakes are infinite (or near enough), the negligible probability becomes morally weighty. The 2002 election illustrates that small probabilities attach to very large stakes, potentially restoring the obligation to vote instrumentally even when decisiveness is low.

  ***

  ### 3. The Problem of Timing

  **Ex Ante vs. Ex Post**
  *   **Ex Ante (April 20):** Polls showed Jospin leading, though fragmentation was visible. A vote for a Trotskyist candidate appeared safe—a way to signal dissatisfaction without risking the runoff. The wrongness is low; the epistemic condition suggested Jospin would advance.
  *   **Ex Post (April 21):** The same vote resulted in Le Pen's advancement. The wrongness appears catastrophic.
  *   **Divergence:** The moral assessment of the act depends entirely on the outcome, which the voter could not control. This is moral luck.

  **Doctrine of Luck**
  None of the three accounts has room for moral luck.
  *   **Instrumental:** Relies on *Expected* Utility (ex ante). If the calculation was reasonable based on available polls, the vote was rational ex ante, even if disastrous ex post. But Instrumentalism often judges by outcome (the "wasted vote" label).
  *   **Expressive:** Immune to luck. The expression was sincere on the 20th and the 22nd. The outcome is irrelevant to the moral worth of the act.
  *   **Lesser-Evil:** Vulnerable to luck. The duty exists only if the evil is *viable*. On April 20, Le Pen's viability was low. On April 22, it was high. The duty shifted overnight without the voter changing their behavior.

  **Epistemic Honesty**
  Le Pen's rise was visible in the final week. The fragmentation was not a secret. An ethics of voting requires an epistemic duty: voters must update their probabilities as new information arrives. The failure of the Left voter was not just expressive indulgence but epistemic negligence. They treated a probabilistic risk as a certainty of safety. The ethics of voting requires a doctrine of *risk management* that none of the three accounts currently possess.

  ***

  ### 4. The Second Round as a Stress Test

  **Blocking as a Third Category?**
  82.2% voted for Chirac; many did not want him. They voted to *stop* Le Pen.
  *   **Instrumental:** This is still instrumental. Negative utility (preventing Le Pen) outweighs positive utility (electing Chirac). It is not a third thing; it is instrumental voting with a negative ceiling.
  *   **Lesser-Evil:** This is the paradigmatic case for Lesser-Evil.
  *   **Taxonomy:** "Blocking" does not require a new category, but it does require the Instrumental Account to acknowledge that *prevention* is a distinct utility function from *promotion*.

  **The Blank-Ballot Surge**
  Blank ballots nearly doubled (1m to 1.8m).
  *   **Refutes Expressive?** No. It confirms it. A blank ballot is a high-cost expression (forgoing influence to register refusal).
  *   **Confirms Expressive?** Yes, but it exposes a limitation. Pure Expressive theory assumes expression is aimed at affirming identity. Here, expression was aimed at *rejecting the menu*.
  *   **Category Distinction:** The surge reveals **Reflexive Expression**. Standard Expressive theory posits expression aimed at the public/candidate. The blank ballot is expression aimed at *oneself* (maintaining moral cleanliness) or the *system* (registering protest). The taxonomy misses the distinction between expression *for* a candidate and expression *against* the choice architecture.

  **Republican Front**
  The event was named a "Republican Front," not an endorsement. This suggests a collective agreement to suspend normal voting norms.
  *   **Implication:** This challenges the Individual Ballot as the unit of analysis. The "Front" was a collective pact. Individual instrumental voting cannot explain a coordinated 80% shift. This suggests a **Collective Instrumentalism** that the standard accounts (focused on individual rationality) cannot capture.

  ***

  ### 5. Scope

  **Escaping the Literature**
  The literature on the ethics of voting focuses almost exclusively on the individual voter's duty. This case escapes that scope in three ways:
  1.  **Ethics of Candidates:** Is it unethical for Chevènement or the Trotskyists to run? They knew the system was plurality-based and that splitting the vote could be fatal. The literature treats candidates as static options, not moral agents responsible for the structure of choice.
  2.  **Ethics of Institutions:** The two-round system structurally incentivized the "Decisiveness Discount." It told voters Round 1 was for preference and Round 2 was for decision. When the preference phase eliminated the decision phase, the institution failed. An ethics of voting that ignores institutional design is incomplete.
  3.  **Collective Action:** The disaster was a coordination failure, not a sum of individual errors. If 195,000 voters had shifted, the outcome changes. The problem was not individual rationality but collective aggregation.

  **The Unit of Analysis**
  The episode suggests the individual ballot *is* the wrong unit of analysis for this type of failure.
  *   **Instrumental:** Fails because it cannot solve the coordination problem (why should *I* shift if *others* don't?).
  *   **Expressive:** Fails because it ignores the systemic cost of aggregated expression.
  *   **Lesser-Evil:** Fails because it places the burden of systemic stability on the individual voter rather than the institution.

  **Conclusion on Scope**
  The 2002 election indicates that the ethics of voting must expand into the **ethics of electoral systems**. If a system translates individual sincerity into collective disaster, the moral fault lies not solely with the voter spending their "expressive budget," but with the machine that allowed them to spend it at such a high cost. The case study demands a shift from "How should I vote?" to "What systems make voting ethically safe?"
