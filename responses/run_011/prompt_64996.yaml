answer: |-
  Your view is highly exposed because asymmetric knowledge converts appeals to shared convention into tools of exclusion, rendering the theory unfalsifiable whenever communication breaks down between insiders and outsiders.

  The fatal defeater is the asymmetric distribution of convention you identified. If politeness codes function as markers of status rather than mutual safeguards, the "shared" premise collapses. When a senior manager tells a junior employee that a project is "ambitious" (meaning "impossible"), the manager knows the code, but the employee may not. If the employee proceeds and fails, the manager claims plausible deniability ("I told you it was difficult"), while the employee is blamed for incompetence. This is not good faith; it is gatekeeping. Your account cannot distinguish between a protective hedge and a trap without an objective measure of sharedness, which is unavailable in the moment of speech. Consequently, the view licenses power abuses by retroactively defining victims of ambiguity as culturally incompetent.

  Regarding lying versus misleading, your appeal to convention carries little moral weight if the speaker's intent is to preserve deniability for self-protection rather than face-saving for the hearer. Philosophical analyses of misleading (e.g., by Carson or Fallis) suggest that deliberately inducing a false belief is morally equivalent to lying if the speaker intends the hearer to believe the falsehood, even temporarily. If the convention exists primarily to let the speaker avoid accountability ("I never said no"), then the convention facilitates deception rather than mitigating it. Your view pushes the problem up a level, but that higher level is unstable: if the hearer was not entitled to rely on the convention because they lacked status, the speaker has misled them without recourse.

  Your position lacks distinct predictive power compared to its rivals, which is a theoretical defect. A deontological account predicts friction whenever literal truth is violated; a consequentialist account predicts friction whenever harm occurs. Your account predicts friction whenever conventions mismatch. In practice, convention mismatches almost always correlate with harm (confusion, wasted time), so your view collapses into consequentialism. When it does not collapse—such as when a shared polite falsehood causes no harm but violates duty—your view aligns with consequentialism against deontology. Because your view can be redescribed as either duty-based (adherence to convention) or outcome-based (successful decoding), it offers no unique explanatory leverage. It is compatible with both rivals, which suggests it is a description of social mechanics rather than a normative ethical framework.

  A committed defender would concede that asymmetric knowledge is fatal, as it directly negates the "shared" condition required for the theory to function. They would also concede that strategic ambiguity used to evade accountability counts against the view, as this violates the "good faith" requirement. They would dismiss cross-cultural friction as merely awkward, arguing that participants in cross-cultural exchanges are not yet "competent" in the joint convention, thus preserving the theory's core. However, this dismissal reinforces the falsifiability problem.

  The risk of unfalsifiability is genuine and severe. By defining moral permissibility through "shared convention" and "competent participants," you insulate the view from refutation. If communication succeeds, the convention was shared; if it fails, the participants were incompetent. This circularity allows any utterance to be redescribed as licensed by some convention, exactly as you feared. To avoid this, you would need an independent metric for convention sharedness that does not rely on the success of the communication itself, which your current account lacks. Without that metric, the view is not well defended; it is tautological.
