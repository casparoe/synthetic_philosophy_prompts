answer: |-
  # EXAMINATION PAPER: FORMAL SYSTEMS AND SELF-REFERENCE

  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Instructions:** Answer all parts. Be precise. In derivations, cite the rule used at every step. In proofs, ensure your logic covers all possible derivations, not just examples.

  **System Setup:**
  Consider the alphabet $\{M, I, U\}$ and the axiom **MI**.
  Rules I, II, and IV are standard:
  *   **Rule I:** If a string ends in **M**, you may add **U** at the end. ($x\text{M} \to x\text{MU}$)
  *   **Rule II:** You may double the string after the initial **M**. ($\text{M}x \to \text{M}xx$)
  *   **Rule IV:** You may delete any adjacent pair of **U**'s. ($x\text{UU}y \to xy$)

  **Rule III** is modified in the two systems below:
  *   **System A:** Any run of four **I**'s may be replaced by a single **U**. ($x\text{IIII}y \to x\text{U}y$)
  *   **System B:** Any run of three **I**'s may be replaced by two **U**'s. ($x\text{III}y \to x\text{UU}y$)

  ---

  **Part 1 (14 Marks)**
  For **System A**, is the string **MU** derivable from **MI**? If yes, provide a line-by-line derivation. If no, prove it.
  For **System B**, is the string **MU** derivable from **MI**? If yes, provide a line-by-line derivation. If no, prove it.
  *(Note: For the negative case, you must use induction on the length of the derivation.)*

  **Part 2 (6 Marks)**
  Evaluate the following excerpt from a student's exam script last year:

  > "Since the rule that turns I's into U's has been changed in both systems, the old argument that the number of I's is never a multiple of three can't be used in either of them."

  Is this statement true, false, or partially correct? Justify your evaluation by referencing the arithmetic properties of the specific Rule III variants in A and B.

  **Part 3 (5 Marks)**
  Contrast the work you did in Part 1 for the solvable system against the unsolvable system. Specifically, identify the precise step in your unsolvability proof where your reasoning necessarily left the formal system itself. What licenses that step, and why could that step not be performed by a machine operating strictly inside the system?
  *(Note: Using terms like "JOOTSing", "strange loop", or naming specific authors earns zero marks for this section. You must describe the logical mechanism.)*

  ---
  # MODEL ANSWER

  **Part 1: Derivability**

  **System A: Derivable.**
  The string **MU** is derivable in System A. The following derivation demonstrates this:
  1.  **MI** (Axiom)
  2.  **MII** (Rule II applied to line 1: $\text{M}I \to \text{M}II$)
  3.  **MIIII** (Rule II applied to line 2: $\text{M}II \to \text{M}IIII$)
  4.  **MU** (Rule III-A applied to line 3: $\text{M}\text{IIII} \to \text{M}\text{U}$)
  Since **MU** appears on line 4, it is derivable.

  **System B: Not Derivable.**
  The string **MU** is not derivable in System B. We prove this by induction on the length $n$ of the derivation sequence. Let $N_I(S)$ denote the number of **I**'s in string $S$. We claim that for any string $S$ derivable in System B, $N_I(S) \not\equiv 0 \pmod 3$.

  *Base Case:* The axiom is **MI**. $N_I(\text{MI}) = 1$. Since $1 \not\equiv 0 \pmod 3$, the property holds for $n=0$.

  *Inductive Step:* Assume that for any string $S_k$ derived in $k$ steps, $N_I(S_k) \not\equiv 0 \pmod 3$. We show that any string $S_{k+1}$ produced from $S_k$ by a single rule application also satisfies the property.
  1.  **Rule I:** Appends **U**. $N_I$ is unchanged. $N_I(S_{k+1}) \equiv N_I(S_k) \not\equiv 0 \pmod 3$.
  2.  **Rule II:** Doubles the string after **M**. $N_I(S_{k+1}) = 2 \cdot N_I(S_k)$. Since 3 is prime and $N_I(S_k)$ is not a multiple of 3, $2 \cdot N_I(S_k)$ is not a multiple of 3.
  3.  **Rule III-B:** Replaces **III** with **UU**. This removes three **I**'s. $N_I(S_{k+1}) = N_I(S_k) - 3$. In modular arithmetic, $N_I(S_k) - 3 \equiv N_I(S_k) \pmod 3$. Since $N_I(S_k) \not\equiv 0$, the new count is not $0 \pmod 3$.
  4.  **Rule IV:** Deletes **UU**. $N_I$ is unchanged. Property holds.

  *Conclusion:* By induction, no derivable string has a number of **I**'s divisible by 3. The target string **MU** has $N_I(\text{MU}) = 0$, and $0 \equiv 0 \pmod 3$. Therefore, **MU** cannot be derived.

  **Part 2: Evaluation of Student Excerpt**

  The statement is **partially correct (false regarding System B)**.
  The student correctly identifies that changing Rule III requires re-evaluating the invariant. However, they incorrectly conclude the mod-3 argument fails for *both*.
  In System A, Rule III removes 4 **I**'s. Since $4 \equiv 1 \pmod 3$, this operation changes the count modulo 3 ($n \to n-1$). The invariant is destroyed, so the old argument fails.
  In System B, Rule III removes 3 **I**'s. Since $3 \equiv 0 \pmod 3$, this operation preserves the count modulo 3 ($n \to n$). The structural change to the tokens does not alter the arithmetic invariant. The old argument remains valid for System B despite the rule change.

  **Part 3: Object-Level vs. Meta-Level Reasoning**

  In the derivation for System A, reasoning stays inside the system: tokens are manipulated according to explicit permissions. In the impossibility proof for System B, the reasoning leaves the system at the **Inductive Step**, specifically when analyzing the effect of the rules on the integer count $N_I(S)$.
  This step is licensed by **mapping**: we assign a mathematical property (integer value) to the formal strings. This licenses the step because integer arithmetic is a consistent meta-system outside the MIU rules. A machine operating strictly inside the system cannot perform this step because it only "sees" symbol patterns, not their global numerical properties. It cannot "count" all possible future derivations; it can only apply rules to current strings. The proof requires a global view of the system's state space, which is unavailable to the system's internal mechanisms.

  ---
  # MARKING SCHEME

  **Total: 25 Marks**

  **Part 1: Derivability (14 Marks)**
  *   **System A (7 Marks):**
      *   **Correct Verdict (Yes):** 1 mark.
      *   **Derivation Steps:** 4 marks. (1 mark per valid transition MI→MII→MIIII→MU).
      *   **Rule Citation:** 2 marks. (Must explicitly name Rule II and Rule III-A).
      *   *Penalty:* -3 marks if derivation uses standard Rule III (`III`→`U`) instead of Variant A. Recovery: Show correct Variant A derivation.
  *   **System B (7 Marks):**
      *   **Correct Verdict (No):** 1 mark.
      *   **Invariant Definition:** 2 marks. (Must specify $N_I \not\equiv 0 \pmod 3$).
      *   **Induction Structure:** 3 marks. (1 for Base Case, 2 for Inductive Step covering all 4 rules).
      *   **Rule Analysis:** 1 mark. (Must explicitly note Rule III-B subtracts 3, preserving mod 3).
      *   *Penalty:* -4 marks for asserting invariant without induction (e.g., "Rules preserve mod 3"). Recovery: Rewrite as formal induction with Base/Step.
      *   *Penalty:* -3 marks for checking only Rule III and assuming others preserve invariant without statement. Recovery: Explicitly list Rules I, II, IV effects.

  **Part 2: Quote Evaluation (6 Marks)**
  *   **Truth Value:** 2 marks. (Must identify it is wrong about B).
  *   **System A Analysis:** 2 marks. (Explain $4 \not\equiv 0 \pmod 3$ breaks invariant).
  *   **System B Analysis:** 2 marks. (Explain $3 \equiv 0 \pmod 3$ keeps invariant).
  *   *Penalty:* -3 marks for claiming the quote is entirely true. Recovery: Explain why B preserves the mod-3 property.
  *   *Penalty:* -3 marks for claiming the quote is entirely false. Recovery: Explain why A breaks the mod-3 property.

  **Part 3: Meta-Reasoning (5 Marks)**
  *   **Identification of Step:** 2 marks. (Identify the mapping/counting or induction step).
  *   **Licensing:** 2 marks. (Explain that arithmetic/meta-system validates the mapping).
  *   **System Limitation:** 1 mark. (Explain internal mechanism lacks global state access).
  *   *Penalty:* -5 marks for using forbidden jargon ("JOOTS", "Hofstadter", "Strange Loop"). Recovery: Rewrite using "mapping", "meta-system", or "global properties".
  *   *Penalty:* -3 marks for general homily ("Machines can't think"). Recovery: Specific reference to the inability to count tokens or check all derivations.

  **General Penalties**
  *   **Memory Failure:** -2 marks if student attempts to recall Rules I/II/IV from memory and gets them wrong, provided logic on Variants is sound.
  *   **Length:** No penalty for brevity if logic is complete. Penalty for excessive verbosity obscuring logic (-1 mark).
