answer: |-
  Your example is not rigged; it is a canonical construction in social choice theory. It does not rely on arcane arithmetic but on a structural feature of political preferences that your friend's "tracking" model assumes away. The divergence you observe is not a curiosity; it is the general case whenever policy dimensions are interdependent.

  Here is the conceptual distinction you were unable to state cleanly, applied to your five points.

  ### 1. The Property: Separability
  The property required for item-by-item majority rule to faithfully decompose "what the majority wants" is **preferential separability**.

  Preferences are separable if a voter's ranking of one provision does not depend on the status of the other. If I prefer *Tax* to *No Tax* regardless of whether *Housing* passes, my preferences are separable. In your example, they are not.
  *   **Bloc A** prefers *Tax* to *No Tax* only if *Housing* fails. If *Housing* passes, A prefers *No Tax* to *Tax*.
  *   **Bloc B** prefers *Housing* to *No Housing* only if *Tax* fails.

  Your friend's model assumes that a vote on T reveals a fixed demand for T. Your example demonstrates that for 80% of the electorate (A and B), the demand for T is **conditional**. When you unbundle the measures, you strip the vote of its conditionality. You ask A, "Do you want T?" and A says "Yes" (interpreting the question as "T without H"). You ask B, "Do you want H?" and B says "Yes" (interpreting the question as "H without T"). But the outcome is "T and H," which neither A nor B wanted.

  The divergence occurs because separate voting treats interdependent goods as independent goods. The "majority will" over the bundle (Neither) exists, but it is invisible to procedure that forces a vector sum of the parts. Your construction does more work than you realized: it proves that "what the majority wants" is not a pre-existing vector that can be measured component-by-component. It is a property of the *outcome space*, not the *issue space*.

  ### 2. The Wrinkle: Indeterminacy and Equilibria
  Your count is correct. There are two Nash equilibria in the separate-vote game:
  1.  **Both Pass:** C expects both to pass, so C votes Yes/Yes (preferring Both to Neither). A votes Yes on T; B votes Yes on H. Result: 60–40 for both. Expectations confirmed.
  2.  **Both Fail:** C expects both to fail, so C votes No/No (preferring Neither to T-alone or H-alone). A votes Yes on T, but T fails 40–60. B votes Yes on H, but H fails 40–60. Result: Neither passes. Expectations confirmed.

  This devastates your friend's position. His theory relies on the ballot functioning as a **measuring instrument** for an **antecedent fact**. If there are two self-consistent outcomes, there is no single antecedent fact to track. The outcome is not determined by "what voters want" (which is fixed in your setup) but by "what voters expect each other to do."

  This helps your side. It shows that unbundling does not recover a distorted truth; it introduces **coordination indeterminacy**. The package vote resolves this by forcing a choice between coherent outcomes (Both vs. Neither). The separate vote dissolves the coherence, leaving the result dependent on focal points or mood rather than preference. The "genuine popular verdict" your friend seeks does not exist as a unique object to be found.

  ### 3. "Voted Yes" vs. "Want This"
  The inference from "60 percent voted yes" to "60 percent want this" relies on the **ceteris paribus assumption**. It assumes the voter is saying, "I prefer this state of the world to the alternative, holding all else constant."

  For this inference to be sound, two things must be true:
  1.  **Sincerity:** Voters are not voting strategically (as Bloc C might).
  2.  **Independence:** The "all else" actually remains constant or is irrelevant to the voter's utility.

  In your example, when A votes Yes on T, A is *not* saying "I want T." A is saying "I want T *given the probability that H will fail*." If the procedure changes the probability of H passing (by unbundling it), the meaning of the Yes vote changes.

  The distinction is between **marginal preference** and **global preference**. A referendum records marginal preferences on specific questions. Your friend assumes the sum of marginal preferences equals the global preference. Your example proves that when preferences are non-separable, the sum of the parts is hostile to the whole. "60 percent voted yes" is a procedural fact; "60 percent want this" is a psychological claim that requires the structure of the vote to match the structure of the mind. When they mismatch, the vote is a false signal.

  ### 4. Legislatures vs. Direct Democracy
  The pathology is not specific to referendums; it is specific to **majority rule over multi-dimensional spaces**. This is the domain of McKelvey's Chaos Theorem and the Ostrogorski Paradox.

  However, your friend's claim that direct democracy has a *distinctive* difficulty is partially right, but for the wrong reason.
  *   **Legislatures:** They suffer the same mathematical instability. However, they possess **agenda control** and **logrolling**. A party leader or committee chair bundles T and H *deliberately* to create a stable majority (like your Bloc C, but manufactured). They suppress the instability by restricting the votes available. They do not "recover" the will; they *construct* a stable coalition.
  *   **Direct Democracy:** It lacks the negotiation phase. The bundle is fixed by drafters, not negotiated by voters. If the drafters bundle poorly (or if voters have preferences like your Blocs A and B), the instability is exposed directly to the electorate without a filter.

  So, the claim that survives is this: Direct democracy does not have a distinctive *mathematical* difficulty, but it lacks the **institutional filters** (parties, committees, amendment processes) that representative systems use to hide or resolve that difficulty. Your friend thinks unbundling removes the distortion. You are correct that unbundling removes the *mechanism* (bundling) that makes majority rule possible in multi-dimensional space. If you unbundle everything, you may get "purer" votes, but you will likely get incoherent policy or cycling majorities.

  ### 5. Design Choices: Switzerland vs. California
  Switzerland's "single subject" rule is indeed an attempt to enforce **separability** by fiat. It assumes that if two provisions belong to the same "subject," they are functionally linked enough that voters should judge them together. If they are different subjects, they should be split.

  *   **Why limit initiative power?** Because you cannot change the counting rule to accommodate non-separable preferences without making the ballot impossible. To truly capture "what the majority wants" in your example, voters would need to vote on all four combinations (T&H, T&~H, ~T&H, ~T&~H). This is cognitively demanding and creates its own paradoxes (Condorcet cycles). Limiting the *input* (what can be proposed) is the only feasible way to try to ensure the *question* matches the *preference structure*.
  *   **The Trade-off:** Switzerland's rule protects the "tracking" illusion by forbidding complex trade-offs. It ensures that when a measure passes, it likely satisfies separability. But it also prevents coherent policy packages (like Tax + Rail) from being voted on as units. California allows the coherent package but risks the "Neither is best" paradox you identified.

  **Where your construction does more work than you realized:**
  You might worry your example is a "black swan"—a rare configuration of preferences. It is not. Non-separable preferences are the norm in public policy. Taxes are linked to spending; rights are linked to restrictions; environmental rules are linked to economic impacts. Voters rarely want "Tax" in the abstract; they want "Tax for School."

  Your friend's error is **ontological**. He believes "the majority will" is a pre-existing object that the ballot measures. Your example proves it is a **procedural output**. The will is not found; it is formed by the rules of aggregation. When you change the rules (unbundling), you do not get a clearer picture of the same will; you generate a different will entirely.

  Your example is not a curiosity. It is a proof that the "tracking" theory of referendums is mathematically incoherent whenever policy issues interact. The ballot does not measure the temperature; it sets the thermostat.
