prompt: |-
  I've got 75 minutes with our ML master's cohort next month — every one of them can train and debug a transformer, none has read a word of philosophy, and maybe a third already think interpretability features are just vibes, a useful fiction for predicting what a model does. What I want to teach is narrow: what would make the claim that a network represents X true rather than merely handy. Plan how I teach it, don't teach it to me.

  So: the order the pieces go in and what depends on what (I suspect superposition and polysemanticity have to land before anything about probes or the whole thing falls apart — check me on that); one running example to hang it on, plus what that example has to have and what it must not have; where I slot my live demo, which is a little sentiment model I trained myself and a linear probe that pulls "the input contains a negation" out of layer 2 at like 94%; the misconceptions they'll arrive with or form along the way, and the exact point in the sequence to head each off — including the one I currently can't answer, which is some version of "if the feature only shows up once you've picked the right probe, isn't it in the probe and not the network?", and its mirror image, where a good probe is treated as settling the question; one closing question that tells me whether it landed or whether they've just learned the vocabulary; and what I should openly refuse to cover at this level and say so (I'm guessing scientific realism in general, but tell me if thats the wrong cut).
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** ML Master's cohort (75 mins). High technical skill (train/debug transformers), zero philosophy background, skeptical/pragmatic about interpretability ("just vibes").
      *   **Goal:** Teach *what makes the claim that a network represents X true* rather than merely useful/handy. (Metaphysics of representation/realism vs. instrumentalism in MechInterp).
      *   **Constraints:** Plan the teaching, don't teach the content. Focus on order/dependencies, running example, demo placement, misconceptions/preemptions, closing question, and scope exclusions.
      *   **Specific Hypothesis to Check:** Do superposition and polysemanticity need to land before probes? (User suspects yes).
      *   **Specific Demo:** Sentiment model + linear probe finding "negation" in layer 2 (94% acc).
      *   **Specific Misconception to Address:** "If the feature only shows up once you've picked the right probe, isn't it in the probe and not the network?" (and the mirror: good probe = settled question).
      *   **Specific Exclusion:** Scientific realism in general? (User guesses yes).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The central tension is *Realism* (the feature exists in the weights/activations independently of us) vs. *Instrumentalism* (the feature is a useful tool we impose on the weights to predict behavior).
      *   To make this stick for engineers, we need to move from "I can predict accuracy" to "I can explain mechanism."
      *   The "Probe Problem" is the crux. A linear probe finding a concept doesn't prove the concept is *used* by the model, only that the information is *present*.

  3.  **Evaluate the User's Hypothesis (Superposition/Polysemanticity before Probes):**
      *   *User's thought:* Superposition/polysemanticity must land before probes.
      *   *My assessment:* Yes, absolutely. If neurons were one-to-one with features (localist), a probe finding a feature would be trivial evidence of representation. But because of superposition (features distributed) and polysemanticity (neurons multi-purpose), the mapping is non-trivial. This creates the *need* for a philosophical stance. If the representation were obvious, the philosophy wouldn't matter.
      *   *Refinement:* Actually, it's slightly more nuanced. You need to establish the *difficulty* of reading the code (superposition) to show why a probe isn't enough. But you also need to show what a probe *does* to show why it's tempting. So: Superposition -> The Probe Temptation -> The Philosophical Gap.

  4.  **Design the Running Example:**
      *   *Requirements:* Needs to be simple enough to grasp quickly, complex enough to show ambiguity, relevant to the demo (sentiment/negation).
      *   *Idea:* "Negation" in sentiment analysis is classic.
      *   *Constraint:* Must not be *too* clean. If it's perfectly linearly separable, the realism argument is too easy. It needs to show context dependence.
      *   *Selection:* The "Not Good" vs. "Good Not" vs. "Not Bad" problem. Or simpler: The "Negation Switch." Let's go with a specific circuit: The "Negation Flipper."
      *   *What it must have:* Context dependence (negation flips sentiment only sometimes).
      *   *What it must not have:* It must not be a hand-coded rule (e.g., regex). It must be learned emergent behavior.

  5.  **Structure the 75 Minutes:**
      *   *Total:* 75 mins.
      *   *Intro (10):* Hook, define the stakes (Vibes vs. Truth).
      *   *Section 1 (15):* The Technical Setup (Superposition/Polysemanticity). Why reading is hard.
      *   *Section 2 (20):* The Demo & The Trap. Show the probe working. Then break it.
      *   *Section 3 (20):* The Philosophical Criterion. Causality vs. Correlation. The "True Representation" test.
      *   *Closing (10):* The Test Question & Q&A.

  6.  **Address the Specific Misconception ("It's in the probe"):**
      *   This is the *Readout vs. Representation* problem.
      *   *Preemption Point:* Immediately after the demo shows 94% accuracy. Before moving to causality.
      *   *Argument:* Information presence $\neq$ Mechanism usage. (The "Library Book" analogy: The book contains the answer, but did the student read it?)

  7.  **Address the Scope Exclusion (Scientific Realism):**
      *   User suggests excluding "scientific realism in general."
      *   *Verdict:* Correct. Don't get into Quine/Putnam or general philosophy of science. Keep it *Internal Realism* specific to MechInterp. Focus on "Causal Realism" (does the model *use* this?) vs. "Informational Realism" (is the info *there*?).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Order:*
          1.  Motivation (Why care if it's 'true'?)
          2.  The Obstacle (Superposition/Polysemanticity) -> *Validates user hypothesis.*
          3.  The Tool (Probes) + Demo.
          4.  The Failure of the Tool (The Misconception).
          5.  The Solution (Causal Intervention).
          6.  The Test.

      *   *Demo Placement:* Needs to be the pivot point. Show it working (wow), then show it failing to explain (oh no). Place it at minute 25.

      *   *Running Example:* Let's refine the "Negation" example. It needs to show that "Negation" isn't a single boolean flag. It interacts with "Sentiment."
      *   *Example:* "The movie was not good." vs "The movie was not bad."
      *   *Requirement:* The feature "Negation" must be entangled with "Sentiment" in the activation space (superposition).

      *   *Misconception Handling:*
          *   "It's in the probe": Address via *Causal Mediation Analysis*. If you ablate the direction the probe found, does performance drop? If not, the probe found a correlate, not the cause.
          *   "Good probe = Truth": Address via *Overfitting the latent space*. You can find a plane that separates any high-dim data.

      *   *Closing Question:* Needs to distinguish vocabulary from understanding. "If I zero out the 'negation' direction and accuracy stays the same, did the feature exist?"

  9.  **Refining the "True vs. Handy" Criterion:**
      *   Handy = Predictive power (Probe accuracy).
      *   True = Causal involvement (Intervention changes output).
      *   This is the core distinction.

  10. **Final Review against Constraints:**
      *   75 mins? Yes, timing looks tight but doable.
      *   Order dependencies? Superposition first is crucial.
      *   Running example specs? Defined.
      *   Demo slot? Mid-point pivot.
      *   Misconceptions? Specifically the "Probe vs. Network" one.
      *   Exclusions? Scientific Realism generalities excluded.

  11. **Self-Correction on "Superposition before Probes":**
      *   Actually, if I explain superposition *too* abstractly, they'll zone out. I should introduce the *promise* of probes first (Demo), then explain why the Demo isn't enough (Superposition/Polysemanticity makes correlation easy, causation hard).
      *   *Wait, re-reading user prompt:* "I suspect superposition and polysemanticity have to land before anything about probes or the whole thing falls apart."
      *   *Decision:* I will agree with the user but with a caveat. You need to motivate *why* superposition matters. If neurons were localist, probes would be truth. Because they aren't, probes are ambiguous. So: Superposition -> Probes. I will stick to the user's intuition here as it's structurally sound for *MechInterp* specifically.

