answer: |-
  Here is the lesson plan. It is designed to move from technical constraints to philosophical necessity, using your demo as the pivot point between "instrumental success" and "ontological claim."

  ### 1. The Sequence & Dependencies (75 Minutes)

  **00:00 – 00:10 | The Hook: Vibes vs. Mechanism**
  *   **Goal:** Validate their skepticism while raising the stakes.
  *   **Content:** Acknowledge that "interpretability" is often just post-hoc storytelling. State the thesis: *A feature is not real because you can find it; it is real because the model needs it to compute.*
  *   **Dependency:** None. Sets the stage.

  **00:10 – 00:25 | The Constraint: Superposition & Polysemanticity**
  *   **Goal:** Establish why the "truth" question is hard.
  *   **Content:** Briefly define superposition (more features than dimensions) and polysemanticity (neurons fire for unrelated concepts).
  *   **Why here?** You are correct: this must land before probes. If the students believe in a localist representation (1 neuron = 1 concept), a probe finding that neuron is trivial proof of representation. You must destroy the localist intuition first. Superposition creates the *ambiguity* that requires a philosophical standard to resolve.
  *   **Dependency:** Required to make the subsequent probe demo ambiguous rather than definitive.

  **00:25 – 00:35 | The Demo: The Sentiment Probe**
  *   **Goal:** Show the "Handy" claim in action.
  *   **Content:** Run your live demo. Show the sentiment model. Train/show the linear probe on Layer 2 extracting "negation" at 94% accuracy.
  *   **Dependency:** Relies on the previous section to imply this might be too easy.

  **00:35 – 00:50 | The Trap: Correlation vs. Causation (The Misconception Slot)**
  *   **Goal:** Dismantle the idea that probe accuracy = representation.
  *   **Content:** This is where you address the "It's in the probe" objection.
  *   **Dependency:** Requires the Demo to have just succeeded. If the demo failed, the point is moot. If the demo succeeded, the temptation to believe it is high.
  *   **Key Argument:** High-dimensional space allows linear separation of almost *any* property (even random noise) if you look hard enough. Finding a plane proves information *presence*, not mechanism *usage*.

  **00:50 – 01:05 | The Criterion: Causal Intervention**
  *   **Goal:** Define what makes the claim "True."
  *   **Content:** Introduce Causal Mediation Analysis or Activation Patching. To claim the network *represents* X, manipulating the direction associated with X must change the output in a predictable way *specific to X*.
  *   **Dependency:** Requires the "Trap" section to have established that correlation is insufficient.

  **01:05 – 01:15 | The Test & Close**
  *   **Goal:** Verify learning.
  *   **Content:** The Closing Question (see below) and Q&A.

  ---

  ### 2. The Running Example: "The Negation Flipper"

  You are using your sentiment model, but you must frame the example carefully to avoid triviality.

  *   **What it must have:** **Contextual Entanglement.** The "negation" feature cannot be a simple boolean flag that always flips sentiment. It must interact with the sentiment embedding.
      *   *Case A:* "Not good" -> Negative.
      *   *Case B:* "Not bad" -> Positive.
      *   *Case C:* "Not great" -> Ambiguous/Negative.
      *   *Why:* If negation is just a global inverter, the feature is too distinct. It needs to be superposed with sentiment valence to make the "is it real?" question non-trivial.
  *   **What it must not have:** **Hand-Engineered Structure.** You cannot have hard-coded the negation logic (e.g., via attention masks or specific architecture constraints). The circuit must have emerged from gradient descent. If it's engineered, the realism question is answered by the codebase, not the weights.

  ---

  ### 3. Demo Placement & Function

  *   **Slot:** Minute 25 (The Pivot).
  *   **Function:** The demo is not the *proof*; it is the *temptation*.
  *   **Execution:**
      1.  Show the 94% probe accuracy. Let them feel the satisfaction of "We found it."
      2.  Immediately freeze that satisfaction. Ask: "Did we find a circuit, or did we just find a plane that correlates with the output?"
      3.  This transitions directly into the Misconception section. Do not let the demo stand as the climax of the lecture. It is the setup for the philosophical problem.

  ---

  ### 4. Misconceptions & Preemption Points

  **Misconception 1: "If the feature only shows up once you've picked the right probe, isn't it in the probe and not the network?"**
  *   **The Worry:** The feature is observer-relative (Instrumentalism).
  *   **Preemption Point:** Minute 35 (Start of "The Trap").
  *   **The Counter:** Use the **Library Analogy**.
      *   *Argument:* "A library contains the answer to a math problem in one of its books. A probe is like finding that book. But did the student (the model) *read* the book to solve the problem, or did they guess the answer using a different book?"
      *   *Technical translation:* Information presence (probe accuracy) $\neq$ Causal pathway (forward pass usage). The feature is in the network only if the network *reads* that direction to compute the output.

  **Misconception 2: "A good probe settles the question."**
  *   **The Worry:** High probe accuracy is treated as sufficient evidence for representation.
  *   **Preemption Point:** Minute 40 (During "The Trap").
  *   **The Counter:** **The Random Label Test.**
      *   *Argument:* Remind them that in high dimensions, you can find linear probes for random labels with decent accuracy. If you can probe for "contains a negation" *and* "contains an even number of vowels" in the same layer, are both "real features" the model uses? No. One is a byproduct of the geometry, the other is a mechanism.
      *   *Takeaway:* Probe accuracy measures *linear accessibility*, not *computational relevance*.

  **Misconception 3: "Causal intervention proves the feature is semantic."**
  *   **The Worry:** They swing too far the other way, thinking intervention proves the *meaning* (X) is real, rather than just the *direction*.
  *   **Preemption Point:** Minute 55 (During "The Criterion").
  *   **The Counter:** **The Orthogonality Caveat.**
      *   *Argument:* Intervening on a direction proves that *direction* is causal. It does not prove your *label* for that direction is correct. You might intervene on a "negation" direction and break the model, but that direction might actually be "syntactic complexity" which correlates with negation.
      *   *Takeaway:* Causal evidence validates the *mechanism*, but the *semantic label* (X) remains a hypothesis requiring converging evidence.

  ---

  ### 5. The Closing Question

  Do not ask them to define realism. Ask them to evaluate a scenario.

  **The Question:**
  > "I train a probe on Layer 6 that predicts 'Input is about Politics' with 98% accuracy. I then zero-out that projection direction during the forward pass. The model's output logits do not change at all.
  >
  > **Does the model represent 'Politics'?**"

  **Why this works:**
  *   **If they say Yes:** They haven't learned the lesson. They still think information presence = representation.
  *   **If they say No:** They understand the causal criterion.
  *   **If they say "It represents the information, but doesn't use it":** They have nailed the distinction between Instrumentalism (handy) and Realism (true/mechanistic).

  ---

  ### 6. Scope Exclusions (What to Refuse)

  **Exclude: General Scientific Realism.**
  *   **Your instinct is correct.** Do not discuss Quine, Putnam, or the general debate about whether electrons are "real."
  *   **Why:** That debate is about the relationship between theory and the physical universe. Your debate is about the relationship between *interpretation* and *weights*.
  *   **The Cut:** Explicitly state: *"We are not asking if the model is real. We are asking if the features we name are causal variables within the system."* Keep it to **Internal Causal Realism**.

  **Exclude: The "True" Semantics Problem.**
  *   **Refuse to solve:** How do we know the feature is actually "negation" and not "subjunctive mood"?
  *   **Why:** That is the grounding problem. It will suck you into a black hole.
  *   **The Cut:** *"We assume the label 'negation' is the best hypothesis we have. We are testing if that hypothesis corresponds to a causal switch, not if the word 'negation' is the perfect descriptor."*

  **Exclude: Training Dynamics.**
  *   **Refuse to cover:** How the feature formed during training.
  *   **Why:** That's developmental MechInterp. It complicates the ontological status of the *current* weights.
  *   **The Cut:** *"We are analyzing the static snapshot. How it got there is a separate question from whether it is there now."*
