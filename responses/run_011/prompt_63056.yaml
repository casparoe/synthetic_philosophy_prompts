answer: |-
  Two number theorists are pitching a conjecture to a department head.

  "We have two independent lines of evidence," says the first. "The heuristic model says it's 90% likely. The numerical data says it's 90% likely."

  "Perfect," says the second. "We multiply the error rates. Combined confidence is 99%."

  A grad student raises a hand. "But didn't you tune the model's constants using that numerical data?"

  They pause.

  "Well," says the first, "they're conditionally independent."

  "Conditioned on what?"

  "Conditioned on us wanting the grant," says the second.

  "So it's not two arguments," says the student. "It's the same argument twice."

  "No," says the first. "It's one argument... wearing a trench coat."

  "And the math?"

  "If I square the confidence interval," says the second, "nobody checks the lining."
