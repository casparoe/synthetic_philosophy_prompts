answer: |-
  This is a brilliant framing. By treating Resolution 5A not as a discovery of fact but as a performance of language, we expose the machinery of scientific consensus as a political and linguistic construct. The Prague vote was not a telescope pointing at truth; it was a gavel striking a table.

  Here is an analysis of Resolution 5A through the lens of speech act theory, addressing the categorization, the felicity conditions, and the problem of deontic power.

  ### 1. Categorizing the Act: Declaration, Verdictive, or Exercitive?

  Resolution 5A is a hybrid act, but its failure stems from a confusion about which kind of act it was attempting to be.

  **The Verdictive Mask:**
  Most astronomers and the public initially received the vote as an **Austinian verdictive**. A verdictive is a finding of fact based on evidence (like a jury verdict or a referee's call). The rhetoric surrounding the vote ("We finally know what a planet is") implied that the IAU was *discovering* a pre-existing boundary in nature. Under this reading, the vote was infelicitous because you cannot vote on ontology. If Pluto possesses the physical properties of a planet, a show of hands cannot strip them away. The dissent from planetary scientists (e.g., Alan Stern) relies on this: they treat "planet" as a natural kind, not a social category.

  **The Exercitive Reality:**
  Textually, the resolution functions as an **Austinian exercitive**. It is the exercise of authority to set a rule. The resolution explicitly states it is a definition "for the IAU's own usage." It establishes a bylaw for how the Union's Working Group for Planetary System Nomenclature (WGPSN) shall catalog objects. As an exercitive, it is perfectly valid: the IAU has the right to decide what words *its members* use in *its publications*.

  **The Searlean Declaration:**
  However, the *effect* the IAU desired was a **Searlean Declaration**. Declarations are speech acts that change the world to match the content of the speech (e.g., "You are hired," "War is declared"). The IAU wanted the utterance "Pluto is not a planet" to make it the case that Pluto is not a planet.
  *   **Verdict:** It was a **Declaration attempting to pass as a Verdictive.** It tried to use institutional power to create a status function ("Planet") that would be accepted as a mind-independent fact. The friction arises because Declarations require institutional authority, while Verdictives require evidentiary accuracy. The IAU had the authority but lacked the consensus to make the declaration stick as a fact.

  ### 2. The Felicity Conditions

  If we treat Resolution 5A as a Declaration, we must test it against the conditions required for the act to "misfire" or be "abused."

  **A. Authority and Procedure (The Conventional Procedure)**
  *   *Condition:* There must be an accepted conventional procedure for this specific effect.
  *   *Analysis:* The IAU is the recognized body for nomenclature. However, the procedure in Prague was procedurally fragile. The vote occurred on the final afternoon after a draft was rewritten in the preceding 48 hours. Many members had already left.
  *   *Verdict:* **Partially Infelicitous.** While the IAU has the *general* authority, the specific procedure (424 of 10,000 members, late in the session) violated the implicit condition of "representative consensus." In speech act terms, the "conventional procedure" for changing solar system ontology requires broader uptake than a simple majority of a quorum at a business meeting.

  **B. Persons and Circumstances**
  *   *Condition:* The right persons in the right circumstances.
  *   *Analysis:* Were the 424 voters the "right persons"? They were astronomers, but notably, *planetary* scientists were a minority in the room; many were stellar or galactic astronomers with less stake in solar system taxonomy.
  *   *Verdict:* **Contested.** The circumstances (a general assembly rather than a specialized divisional vote) weakened the performative force. It was as if a general shareholders' meeting voted on the specific chemical formula for a product rather than the R&D department.

  **C. Scope and Content (The Exoplanet Problem)**
  *   *Condition:* The content must be clear and executable.
  *   *Analysis:* The definition restricts itself to bodies orbiting *the Sun*. By 2006, hundreds of exoplanets were known.
  *   *Verdict:* **Infelicitous Universality.** This restriction reveals the act as a local bylaw (Exercitive) rather than a universal truth (Verdictive). If "Planet" is a natural kind, the definition should apply to Jupiter-analogs around other stars. By limiting it to the Sun, the IAU admitted they were legislating a local zoning law, not defining a cosmic category. This undermines the Declaration's claim to reality.

  **D. Uptake**
  *   *Condition:* The audience must understand and accept the act for it to be consummated.
  *   *Analysis:* Uptake was fractured.
      *   *Institutional Uptake:* High. Textbooks, museums, and media adopted the change quickly.
      *   *Scientific Uptake:* Low. Many planetary scientists (including the New Horizons mission team) continued to refer to Pluto as a planet in technical contexts.
  *   *Verdict:* **Fractured Felicity.** A Declaration requires collective intentionality ("We accept that X counts as Y"). Because the relevant community (planetary scientists) did not fully accept the status function, the declaration remains socially effective but scientifically porous.

  ### 3. The Deontic Power Problem

  This is the philosophical crux. Searle insists that status functions ($X$ counts as $Y$ in context $C$) are created to serve a function, and that function is always **deontic**. To be a "President," "Owner," or "Husband" is to have specific rights, duties, and obligations.

  **The Observation:**
  When Pluto was demoted, no one's obligations actually changed. NASA was not obligated to stop studying it. Teachers were not legally obligated to remove it from slides (though they felt socially pressured). Funding was not automatically diverted. Pluto did not lose "rights."

  **Option A: It Was Not a Declaration (Searle is Right)**
  If we hold strictly to Searle, Resolution 5A failed to create a genuine status function because it failed to attach deontic powers. It created a *label*, not a *status*.
  *   *Implication:* The IAU performed a **naming act**, not a **constitutive act**. They changed the name tag, but not the job description. This explains the lingering dissent: scientists recognize the IAU has the power to name (nomenclature), but deny they have the power to constitute ontology (what things *are*). If "planet" carries no deontic weight, then the vote was merely a recommendation on vocabulary, which scientists are free to ignore in their research.

  **Option B: Searle's Account is Too Tight (The Deontics are Diffuse)**
  Alternatively, the vote *did* create deontic powers, but they are soft, social, and resource-based rather than legal.
  *   *Curriculum Obligations:* Teachers now have an obligation to teach the "eight planets" model to avoid confusing students.
  *   *Funding Priorities:* "Planets" often get higher priority in mission decadal surveys than "dwarf planets." The status affects the *obligation* of review committees to prioritize missions.
  *   *Museum Display:* Curators have a new duty to categorize Pluto in the "Dwarf Planet" hall, not the "Planetary" hall.
  *   *Argument:* These are deontic powers. They are rights to resources and obligations of classification. The fact that they are social rather than physical doesn't negate them.

  **Option C: Declarations Without Deontics (The Semantic Status)**
  The third option is the most disturbing for Searle's framework: **What if a declaration can create a status with no deontic payoff?**
  *   If "Planet" is purely a descriptive category (like "Red" or "Large"), then the IAU attempted a Declaration on a concept that resists status functions. You can declare someone "Married" (deontic), but you cannot declare a star "Red" (descriptive) and make it so by voting.
  *   *Resolution:* The 2006 vote reveals the limit of institutional power. The IAU tried to turn a descriptive property (hydrostatic equilibrium, orbit clearing) into a status function. Because the deontic powers are weak (no one goes to jail for calling Pluto a planet), the status function is unstable.
  *   *Conclusion:* A declaration without deontic payoff is merely a **stipulation**. It tells you how we *will speak*, not how the world *is*. The IAU tried to legislate how the world is, but because they could not attach strong deontic powers (obligations/rights) to the term "planet," the act degraded from a Declaration into a mere Exercitive rule about vocabulary.

  ### Summary

  Resolution 5A was an **Exercitive** (a rule for IAU vocabulary) masquerading as a **Verdictive** (a finding of fact) with the intent of being a **Declaration** (changing the status of Pluto).

  It suffered from **procedural infelicity** (the 424 voters), **scope infelicity** (Sun-only), and **fractured uptake** (scientists vs. public).

  Regarding Searle: The lack of clear deontic power suggests that **Searle is right that status functions require deontics, which means "Planet" is not a true status function.** It is a natural kind term that the IAU tried to treat as an institutional fact. The vote didn't fail because the astronomers were grumpy; it failed because you cannot generate deontic power (obligations) out of descriptive physics (orbit clearing) without a broader social contract. The IAU declared a status, but because the universe does not recognize deontic powers, and the scientific community refused to enforce them, Pluto remains a planet in the only place that matters: the language of those who study it.
