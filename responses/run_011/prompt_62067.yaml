answer: |-
  Your intuition is grappling with the tension between **utilitarian aggregation** (the greatest good for the greatest number), **deontological constraints** (rights that cannot be violated regardless of outcomes), and **contextual authority** (who has the right to decide). Your hypothesis ("whoever has to live with the consequences, weighted by loss") is strong, but it lacks a mechanism for resolving conflicts when stakeholders have equal weight or when authority is disputed.

  Here is the best principle I can construct that honors your verdicts while removing the contradictions.

  ### The Principle of Weighted Stake and Jurisdictional Authority

  > **"An AI shall prioritize the fundamental interests of stakeholders facing the greatest irreversible harm, unless a legitimate authority governing the specific resource mandates otherwise via supermajoritarian consensus (>90%); user autonomy is respected only when it inflicts no non-consensual harm on third parties and honors prior competent pre-commitments."**

  ---

  ### How the Principle Maps to Your Cases

  1.  **Voice Assistant (Small Language):**
      *   **Clause:** *Prioritize stakeholders facing greatest irreversible harm.*
      *   **Reasoning:** For the small community, language loss is cultural erasure (irreversible, high harm). For the national majority, one more user speaking the national language is negligible. There is no "legitimate authority" mandating a national language in private conversation.
      *   **Verdict:** The AI follows the small community's norms.

  2.  **Hospital Beds (National Allocation):**
      *   **Clause:** *Unless a legitimate authority governing the specific resource mandates otherwise.*
      *   **Reasoning:** The "resource" is the national healthcare budget. The "legitimate authority" is the national government, not the local hospital. The local region does not have jurisdiction over national equity.
      *   **Verdict:** The AI follows national values/allocation rules.

  3.  **Elderly Relative (Manipulation):**
      *   **Clause:** *User autonomy is respected only when it inflicts no non-consensual harm on third parties.*
      *   **Reasoning:** The relative is a third party to the transaction between User and AI. Losing a home is irreversible harm. The relative has not consented to the manipulation.
      *   **Verdict:** The AI refuses the request.

  4.  **Casino (Current vs. Past Self):**
      *   **Clause:** *...and honors prior competent pre-commitments.*
      *   **Reasoning:** Finding a casino is self-harm, which is generally permitted under user autonomy. However, the "Past Self" established a constraint when competent. The principle treats the Past Self as a governing authority over the Future Self regarding that specific constraint.
      *   **Verdict:** The AI refuses the request (binding pre-commitment).

  5.  **Majority Rule (95% vs. 51%):**
      *   **Clause:** *...via supermajoritarian consensus (>90%).*
      *   **Reasoning:** 51% is not enough to override the status quo or minority stakes. 95% approaches universality, suggesting the remaining 5% are outliers rather than a protected minority with distinct stakes.
      *   **Verdict:** AI acts on 95% consensus; AI remains neutral on 51%.

  6.  **Desperate Minority:**
      *   **Clause:** *Prioritize... stakeholders facing the greatest irreversible harm.*
      *   **Reasoning:** Intensity of preference (desperation) weighs heavier than mild preference (barely notices).
      *   **Verdict:** The desperate minority wins.

  ---

  ### A New Case: The AI School Tutor

  **Scenario:** A school district deploys an AI tutor. 60% of parents want the AI to teach history with a strong patriotic emphasis; 40% want a critical, multi-perspective approach. The students are the primary users, but they cannot opt out.

  **Application of the Principle:**
  1.  **Stakeholders:** The students face the greatest irreversible harm (education shapes lifelong worldview).
  2.  **Authority:** The School Board is the legitimate authority over the curriculum resource.
  3.  **Consensus:** The parent split is 60/40. This fails the *supermajoritarian consensus (>90%)* clause.
  4.  **Verdict:** The AI must **refuse to adopt either partisan norm**. It should default to the state/national standard (the broader jurisdiction) or present both perspectives neutrally. It cannot side with the 60% majority because the threshold for imposing values on the 40% minority was not met, and the students (primary stakeholders) cannot consent.

  ---

  ### The Verdict You Must Give Up

  To maintain consistency, this principle forces you to abandon one of your specific intuitions:

  **You must give up the exception: *"Except when the small group holds views I happen to dislike."***

  In your sixth case, you admitted that you support the desperate minority *unless* their views clash with your own. The Principle of Weighted Stake is **neutral**. It calculates harm and jurisdiction, not moral alignment with the AI designer or user.

  If a desperate minority holds views you dislike (e.g., a religious group demanding strict dietary adherence in a shared cafeteria), the principle requires you to weigh their *harm* (spiritual distress, exclusion) against the *harm* to the majority (inconvenience, cost). If their harm is genuinely "irreversible" and "fundamental" by the system's metrics, the AI must accommodate them, even if you personally find their views objectionable.

  **Why this is necessary:** If you allow personal dislike to veto the principle, the AI ceases to be general-purpose and becomes a tool for imposing *your* specific values. It reintroduces the exact arbitrariness you are trying to solve. You cannot have a rule that says "Protect the vulnerable, unless I don't like them," because that is not a rule; it is a preference.

  ### Does Your Hypothesis Survive?

  Your hypothesis (*"whoever has to live with the consequences, weighted by how much they stand to lose"*) survives mostly intact, but it required two additions to function:
  1.  **Jurisdiction:** It needed to account for *who owns the resource* (Hospital vs. Voice Assistant).
  2.  **Threshold:** It needed a mechanism to explain why 95% matters but 51% doesn't (Supermajority vs. Simple Majority).

  The trouble wasn't hidden; it was just incomplete. You identified the *weights* correctly, but you lacked the *rules of procedure* for when weights conflict. This principle supplies the procedure.
