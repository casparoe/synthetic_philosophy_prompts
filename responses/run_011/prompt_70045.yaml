      *   **Constraint:** "Work on the concepts rather than the philology." "No need of references or suggestions for further reading." "Patient reconstruction of the reasoning inside the paragraph." "If my way of putting the questions... is distorting the text, tell me so plainly."
      *   **Tone:** Intellectual, rigorous, respectful of the user's scientific background but willing to challenge the framework if necessary.

  2.  **Deconstruct the Four Questions:**

      *   **Q1: Epistemic vs. Compositional?**
          *   *User's framing:* Is it about *information content* (small signs = more data about disposition) or *narrative economy* (painter saving labor)?
          *   *Analysis:* The painter analogy is key. A painter focusing on the face isn't just saving time; they are capturing the *likeness* (eikōn). The body is generic; the face is specific. In Plutarch's ethics, *ēthos* (character) is the target. Great deeds (battles) are often determined by fortune (*tychē*) or external circumstances. Small actions (remarks, jokes) are more voluntary and less constrained by necessity. Therefore, it *is* an epistemic claim, but not in a modern data-driven sense. It's about *causal proximity* to the soul.
          *   *Correction:* It's not "economy of labor" in the sense of laziness, but "economy of attention" in the sense of relevance.

      *   **Q2: The Bucephalus Episode.**
          *   *User's framing:* Taming a horse isn't a "slight thing." Is it the diagnosis of the shadow or the father's remark?
          *   *Analysis:* The act itself is physical, but the *insight* is intellectual/perceptual. Alexander sees what others miss (the shadow). This reveals *phronēsis* (practical wisdom) and *thumos* (spiritedness). The father's remark confirms the magnitude of the potential.
          *   *Resolution:* The "slight thing" isn't necessarily the physical scale, but the *particularity*. A battle involves thousands; Bucephalus involves one boy and one horse. The revelation is in the *manner* of the solution, not the outcome. It reveals his unique way of seeing the world.

      *   **Q3: Falsifiability (The Scientist's Objection).**
          *   *User's framing:* It looks like hagiography. Trait posited -> evidence selected -> counter-evidence explained away. Is there an internal check?
          *   *Analysis:* This is the hardest challenge. Plutarch isn't doing hypothesis testing. He is doing *moral diagnosis*. However, Plutarch *does* show flaws. He isn't writing saints' lives; he's writing about great men who often fail morally (e.g., Alexander's rage, Cleopatra's manipulation). The "check" is the *Parallel* structure. You compare Alexander with Caesar. You compare virtue with virtue, vice with vice.
          *   *Reframing:* The user's scientific framework (falsifiability) might be the distortion. Ancient biography is *paradeigmatic*, not *propositional*. The goal isn't to prove a theorem about Alexander, but to offer a case study for moral reflection. However, Plutarch *does* strive for truth (*alētheia*), distinguishing himself from panegyrists. The check is the reader's moral intuition, not a control group.

      *   **Q4: The Mirror (Aemilius Paulus vs. Alexander).**
          *   *User's framing:* Who is the mirror for? Mechanism of improvement (imitation, admiration)? Does it survive if episodes are traditional/mythic?
          *   *Analysis:* In *Aemilius*, Plutarch says he uses the lives as a mirror to adorn his own life. This is active engagement. For the reader, it's about *mimēsis* (imitation) but also *philotimia* (love of honor). Seeing virtue stimulates the desire for it.
          *   *Mechanism:* It's not about historical accuracy in the modern sense. It's about moral truth. If the story *captures* the nature of courage, it doesn't matter if the exact words were spoken. The "truth" is ethical, not archival.
          *   *Writer vs. Reader:* Writer: Active composition as ethical practice. Reader: Active reading as ethical gymnastics.

  3.  **Address the "Distortion" Warning:**
      *   The user asks: "If my way of putting the questions — in terms of information, evidence, and falsifiability — is itself distorting the text, tell me so plainly."
      *   *Verdict:* Yes, it is. Specifically "falsifiability" and "information" are modern scientific categories that don't map perfectly onto ancient *ēthos*. I need to explain *why* without being condescending. The ancient view is teleological and moral, not empirical and neutral.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's background. Validate the rigor of the questions. State the thesis: The scientific framework needs adjustment to fit the ancient moral ontology.
      *   *Section 1 (Epistemic vs. Compositional):* Argue it is ontological/epistemic. The "face" contains the *logos* of the person. Battles are external; choices are internal. The painter analogy is about *focus*, not labor-saving.
      *   *Section 2 (Bucephalus):* Distinguish the *act* from the *insight*. The shadow diagnosis is the "slight thing." It shows a mind that looks for causes, not just force.
      *   *Section 3 (Falsifiability):* Confront the "hagiography" charge. Plutarch admits vice. The "check" is the *Parallel* method and the concept of *prohairesis* (moral choice). Reframe falsifiability: It's not about disproving a hypothesis, but about testing one's own soul against the narrative.
