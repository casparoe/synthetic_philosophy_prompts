answer: |-
  ### The Verdict on Terminology

  There is no single existing term in epistemology, social choice, or intelligence analysis that fully captures the specific workflow you describe: the combination of good-faith conciliation, the resulting convergence, and the subsequent misrepresentation of that convergence as independent corroboration.

  "Groupthink" is incorrect because it implies psychological pathology and pressure. "Echo chamber" is incorrect because it implies isolation from external data. "Double counting" is the underlying mathematical error, but it is too broad (it applies to data, not just judgments). "Pseudoreplication" is the statistical equivalent, but it is unfamiliar to most policy audiences.

  Therefore, I am coining the term **Artifactual Consensus**.

  **Definition:** Artifactual Consensus occurs when a group's agreement is generated primarily by the process of mutual adjustment (conciliation) rather than by independent convergence on the evidence, yet the agreement is reported or treated as if it constitutes independent corroboration.

  **Root Concept:** The logical error driving Artifactual Consensus is a **Violation of Conditional Independence**. In a methods document, you can define it thus:

  > *Two judgments are conditionally independent if, assuming the hypothesis is true (or false), the probability of Analyst A making a judgment does not change based on knowing Analyst B's judgment. In Artifactual Consensus, the analysts' judgments are conditionally dependent because they are causally linked through the negotiation process. Treating them as independent inflates the evidential weight of the conclusion.*

  This term is precise enough for a methods manual. It distinguishes the phenomenon from social pressure (Groupthink) and identifies the statistical sin (Violating Independence) without requiring the audience to understand Bayesian calculus.

  ### The Conciliatory View: Where the Bug Lies

  You asked whether the conciliatory view (the norm that reasonable peers should move toward each other) is itself committed to licensing this self-support, or if the bug is downstream.

  **My verdict:** The bug is downstream. The conciliatory view does not license the self-support; the misrepresentation of the *status* of the agreement does.

  **Reasoning:**
  Conciliationism is a rule for *updating belief*, not a rule for *reporting evidence*. If Analyst A and Analyst B share the same evidence and disagree, moving toward the middle is a rational way to account for the possibility that one of you has made a reasoning error. It is an admission of fallibility.

  However, once that update has occurred, the resulting agreement is a *single* data point derived from a *single* body of evidence, processed through two linked minds. It is not *two* data points. The error occurs when the panel report claims "Eleven experts agreed," implying eleven independent tests of the hypothesis. That is a false claim about the history of the judgment, not a necessary consequence of the judgment itself.

  **How to Quarantine It:**
  A conciliator can quarantine this error by separating the **Deliberative Phase** from the **Evidentiary Phase**.
  1.  **Deliberative Phase:** Analysts discuss, conciliate, and converge to produce a unified recommendation. This is valid.
  2.  **Evidentiary Phase:** When documenting the strength of the evidence, the report must state: *"The panel reached a unanimous recommendation following deliberation."* It must **not** state: *"The recommendation is supported by the independent agreement of eleven experts."*

  To operationalize this, your methods document should require a **Dependency Disclosure**. If panelists converge through discussion, the report must explicitly state that the consensus is *deliberative*, not *independent*. This preserves the value of the discussion (error-checking) without claiming false statistical weight.

  ### Edge Cases

  Here is how the definition of **Artifactual Consensus** applies to your four scenarios.

  **1. Only one analyst moves; the other holds firm.**
  *   **Verdict:** Inside the phenomenon.
  *   **Why:** The definition relies on the *dependence* of the final state on the interaction, not on symmetry. If Analyst A changes their mind *because* Analyst B held firm, Analyst A's final view is causally dependent on Analyst B. Citing Analyst B's steadfastness as "corroboration" of Analyst A's new view is still Artifactual Consensus. The "independence" is broken because the final alignment was negotiated, not independently derived. The only exception is if Analyst A provides a *new reason* for changing their mind that is rooted in the evidence, not merely in B's stance. If the move is purely deferential, the consensus is artifactual.

  **2. The two started from genuinely non-overlapping evidence.**
  *   **Verdict:** Outside the phenomenon (provided the overlap is truly zero).
  *   **Why:** Conditional independence is preserved if the evidence sets are disjoint. If Analyst A reviews Clinical Trial X and Analyst B reviews Clinical Trial Y, and they converge on "Intervention Works," that *is* genuine corroboration. Their agreement suggests the hypothesis explains two distinct datasets.
  *   **The Boundary:** The boundary is **Shared Data**. In HTA, "non-overlapping" is rare. Usually, analysts see the same systematic review but weigh the studies differently. If they are weighing the *same* studies, they are not independent, even if they use different statistical models. The consensus is artifactual if the convergence is driven by compromising on the *weight* of shared studies, rather than by each finding support in unique data.

  **3. A third party cites the agreement without knowing it was negotiated.**
  *   **Verdict:** The defect is in the convergence (specifically, the reporting of it).
  *   **Why:** The epistemic sin is the production of a document that implies independence where there is none. The third party is a victim of the misinformation, not the perpetrator. However, this highlights why the **Dependency Disclosure** (mentioned above) is mandatory. The panel's output must carry a "label" of its own dependency status. If the report says "Unanimous" without qualifying "Following Deliberation," the panel has committed the error, regardless of who cites it.

  **4. Neither party thinks the other is a peer; one defers to seniority.**
  *   **Verdict:** Inside the phenomenon (and often worse).
  *   **Why:** The "Peer Disagreement" literature focuses on equals, but the logical error of **Violating Conditional Independence** applies regardless of status. If Junior defers to Senior, Junior's judgment is now a function of Senior's judgment. They are not independent samples. Citing this as "Two Experts Agree" is still Artifactual Consensus. In fact, this is often **Deference Bias**, a subtype of Artifactual Consensus where the "averaging" is weighted 100% toward the senior member, yet the headcount is still inflated in the final report.

  ### Summary for Your Methods Document

  To address this professionally, I recommend inserting the following protocol into your guidance for panel chairs and report drafters:

  **Protocol: Reporting Consensus**
  1.  **Distinction:** Panels must distinguish between *Independent Convergence* (analysts reach the same conclusion without discussing) and *Deliberative Consensus* (analysts reach the same conclusion through discussion).
  2.  **Disclosure:** Reports must not cite the number of agreeing panelists (e.g., "11 of 11") as a measure of evidential strength if Deliberative Consensus was used.
  3.  **Wording:** Use phrasing such as *"The panel unanimously recommended..."* rather than *"Eleven independent experts confirmed..."*
  4.  **Rationale:** This prevents **Artifactual Consensus**, where the process of agreement is mistakenly counted as additional evidence.

  This approach validates the work your panels do (conciliation is good for accuracy) while preventing the statistical inflation that undermines your body's credibility.
