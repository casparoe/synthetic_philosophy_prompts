prompt: |-
  I am a staff writer at a magazine of science and ideas, and most of my reporting is long-form and interview-driven: a single feature may involve fifty recorded conversations, conducted over weeks, in laboratories, hospital corridors, living rooms, and over the phone at inconvenient hours. Scattered through that material are people whose agreement to be quoted is, on reflection, not obviously valid. A graduate student says yes while her principal investigator sits two feet away and does not speak. A father talks to me nine days after his daughter's death and gives me the passage the whole piece will turn on. A man with an early, fluctuating dementia is lucid on Tuesdays and less so by Friday, and I interview him on a Tuesday. A sixteen-year-old's mother signs a release. A nurse on a ward agrees because the press officer who arranged my visit has already agreed on her behalf and everyone else in the room is agreeing. A researcher agrees because he has decided the piece will vindicate him in a dispute I have no intention of adjudicating.

  I make these calls several times a day, usually mid-sentence, with no ethics committee, no time to consult counsel, and only afterwards a standards editor who must sign off on anything I have flagged. The stakes are asymmetric and unglamorous: a retraction, a subject who reasonably says he never understood what he was agreeing to, a career damaged by a quote he would have given differently had he known the frame, or a piece I have to kill three weeks before the issue closes.

  What I want is a decision procedure I can run on a candidate quotation, not an essay about consent. Work from the element analysis familiar in research ethics and in the philosophical literature on valid consent — capacity, disclosure, understanding, voluntariness — and from the places where that analysis is genuinely contested rather than settled: whether consent extracted under a coercive background (the person who needs the job, the visa, the reference, the continued access to a clinic, the continued good standing with the person who introduced us) is invalid or merely compromised; whether an offer that only improves someone's options can be coercive at all, and if not, what does the work in the cases where we want to say the yes was not free; the difference between deception about the nature of what one is agreeing to and deception about incidental facts, and which of the two voids consent; the scope question, which is my daily problem — what exactly has a person agreed to when they agree to be quoted, and does agreement to a sympathetic profile carry over into a piece in which they are one of the parties under scrutiny; capacity as relative to a decision and a moment rather than global; the weight a signed release actually carries, if any; what happens in group settings where the consent is individually given but socially manufactured; and whether consent can be withdrawn after the fact, and what follows if it is.

  The deliverable should be a sequence of gates I can pass a quotation through: the questions asked in order, what counts as a sufficient answer to each, the points at which the procedure stops with a flat do-not-use, and the points at which it hands the decision to a named human being — and says which human, and precisely what that person is being asked to decide rather than what I am hoping they will ratify. Tell me what evidence of understanding looks like when you cannot quiz a source without turning an interview into an examination; borrow whatever is usable from clinical practice on that score, but adapt it. Mark explicitly every step where the procedure is judgment wearing a procedural costume. Give me a version short enough to hold in my head during a conversation and a version detailed enough for the standards editor.

  Then run it on three cases: the graduate student interviewed in her advisor's presence, who emails a month later asking that certain passages be removed; the man with fluctuating capacity, quoted from a good day, whose daughter objects after publication; and the bereaved father, who understood exactly what he was doing and consented without ambiguity, and then asks to withdraw three weeks in. At least one of these should come out against my interest, and I want you to say which and not soften it.

  Two further things. The magazine's current house rule is that any source who has been a patient within the past twelve months gets their quotes read back before publication. I suspect it is simultaneously over- and under-inclusive; tell me whether the procedure explains why, and what should replace it. And I have been privately using an unprincipled heuristic of my own, which I want you to assess rather than flatter: if I would be uncomfortable describing how I got the quote to the person who introduced me to the source, I treat the consent as defective. Does that track anything real, or is it merely a measure of social awkwardness that will misfire in both directions?

  Finish with what the procedure cannot do — the categories of case it will get wrong or cannot reach, including anything involving fixers and translators working abroad on my behalf. Argue from the concepts; do not give me a bibliography, a reading list, or citations to anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Staff writer at a science/ideas magazine. Long-form, interview-driven reporting (50+ conversations per feature). High stakes (retractions, damaged careers, killed pieces).
      *   **Problem:** Validity of consent is often ambiguous in the field (power dynamics, grief, cognitive fluctuation, group pressure, misunderstandings of scope). No ethics committee, no counsel, just a standards editor later.
      *   **Goal:** A *decision procedure* (algorithm/flowchart) for evaluating candidate quotations, based on research ethics/philosophical consent elements (capacity, disclosure, understanding, voluntariness).
      *   **Requirements:**
          *   Sequence of gates/questions.
          *   Sufficient answers for each.
          *   Stop points (Do Not Use).
          *   Escalation points (Hand to Human + Who + What they decide).
          *   Evidence of understanding (adapted from clinical practice, not an exam).
          *   Mark where judgment is wearing a procedural costume.
          *   Two versions: Mental (short) and Editorial (detailed).
          *   Run on three specific cases (Grad student/Advisor, Dementia man/daughter, Bereaved father/withdrawal). One must go against the writer's interest (hard no).
          *   Evaluate the "12-month patient" house rule.
          *   Evaluate the writer's "social awkwardness" heuristic.
          *   Finish with limitations (what the procedure *can't* do, e.g., fixers/translators).
          *   **Constraint:** Argue from concepts. No bibliography, reading list, or citations.

  2.  **Deconstruct the Ethics of Consent (Conceptual Framework):**

      *   *Capacity:* Can they understand/decide *now*? (Fluctuating, age, grief).
      *   *Disclosure:* Do they know what they are agreeing to? (Scope, frame, audience).
      *   *Understanding:* Did the info land? (Teach-back method adapted).
      *   *Voluntariness:* Is the "Yes" free? (Coercion, undue influence, power dynamics).
      *   *Scope:* Does the consent cover *this* use? (Sympathetic profile vs. scrutiny).
      *   *Withdrawal:* Can they take it back? (When/Why).

  3.  **Drafting the Decision Procedure (The Core):**

      *   *Structure:* Needs to be a flow. Gate 1 -> Gate 2 -> Gate 3...
      *   *Tone:* Practical, rigorous, unsentimental.
      *   *Version 1 (Mental):* 5 questions, fit in head.
      *   *Version 2 (Editorial):* Detailed rubric for the Standards Editor.
      *   *Judgment Masking:* Need to explicitly flag where "procedure" is actually just "writer's gut" formalized.

      *   *Drafting the Gates:*
          1.  **Capacity/State:** Are they lucid *now*? (Stop if no).
          2.  **Voluntariness/Pressure:** Is there a shadow hanging over the "Yes"? (Advisor, Boss, Grief).
          3.  **Scope/Frame:** Do they know *how* this will look? (Vindication vs. Scrutiny).
          4.  **Understanding:** Can they reflect the purpose back? (Adapted teach-back).
          5.  **Persistence:** If they ask to remove later, why? (Regret vs. Harm).

      *   *Escalation:* Who decides? Standards Editor. What do they decide? Risk assessment, not just "is this okay."

  4.  **Developing the Case Studies:**

      *   *Case 1: Grad Student + Advisor.* Power dynamic is key. Advisor presence = coercion/undue influence. Scope issue (did she think it was for the lab's glory?). *Verdict:* Do Not Use (or heavily redacted). This goes against writer's interest (needs the quote).
      *   *Case 2: Dementia Man.* Capacity was valid *at the time*. Daughter objects *after*. *Verdict:* Use (with caveats). Consent was valid when given. Withdrawal by proxy post-publication is tricky.
      *   *Case 3: Bereaved Father.* Valid consent. Withdraws 3 weeks later due to grief/regret. *Verdict:* This is the hard one. Ethical journalism often honors post-publication withdrawal requests from vulnerable subjects even if legally bound. *Decision:* I need to make one go against the writer's interest. The prompt says "At least one... should come out against my interest." The Grad Student case is a strong candidate for "Do Not Use" due to coercion. The Bereaved Father is a strong candidate for "Do Not Use" due to harm minimization. Let's make the **Grad Student** case the "Do Not Use" because the consent was structurally compromised *at the source*, whereas the Father's consent was valid *at the source* but revoked later. Actually, the prompt asks for a procedure to run on a *candidate quotation*. If the father asks to withdraw *three weeks in* (pre-publication presumably, as piece is killed 3 weeks before close), that's a withdrawal of consent. If the procedure says "Honor Withdrawal," that kills the quote. Let's make the **Grad Student** the "Do Not Use" (Voluntariness failure) and the **Father** the "Use" (Valid consent, withdrawal denied unless harm proven) OR vice versa.
      *   *Refinement:* The prompt says "At least one of these should come out against my interest." The writer wants to publish. So "Against Interest" = Do Not Publish the quote.
      *   *Selection:*
          1.  Grad Student: Compromised voluntariness. *Result:* Do Not Use. (Against interest).
          2.  Dementia Man: Valid capacity at time. Proxy objection post-fact. *Result:* Use. (In interest).
          3.  Bereaved Father: Valid capacity. Withdrawal request. *Result:* This is the tension. If I say "Honor Withdrawal," it's against interest. If I say "Enforce Consent," it's in interest. To show the procedure has teeth, I will rule **Against Interest on the Grad Student** (Coercion) and **Against Interest on the Father** (Harm trumps contract). Wait, I need to pick *one* to highlight. Let's make the Grad Student the clear "No" based on voluntariness, and the Father a "Negotiate/Editor Call." Actually, the prompt says "At least one." I will make the **Grad Student** case a hard "No" because the consent was never valid. The Father's consent *was* valid, so withdrawing is a contractual/ethical breach by the source, but ethically we might honor it. I'll rule the Grad Student as the hard "No" to demonstrate the voluntariness gate.
          *Correction:* The prompt asks to run it on three cases. I should provide a verdict for all three. I will ensure the Grad Student verdict is "Do Not Use" (Against Interest).

  5.  **Evaluating House Rules & Heuristics:**

      *   *12-Month Patient Rule:* Over-inclusive (minor procedures, fully recovered), Under-inclusive (chronic conditions >12 months, trauma). *Fix:* Condition-based, not time-based.
      *   *Social Awkwardness Heuristic:* It tracks "Shame." If you're ashamed of the method, the method is likely shady. But it can misfire on difficult truths. It's a proxy for Voluntariness/Disclosure.

  6.  **Limitations:**

      *   Fixers/Translators: The procedure breaks here. You can't assess capacity/voluntariness through a third party easily. Power dynamics are opaque.
      *   Structural Coercion: Poverty, visa status. The procedure identifies it but can't solve it without killing the story.

  7.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the constraints.
      *   **The Mental Version:** 5 Gates.
      *   **The Editorial Version:** Detailed rubric + Escalation protocol.
      *   **Marking Judgment:** Explicitly note where the "test" is actually intuition.
      *   **Case Studies:** Apply the gates.
      *   **House Rule & Heuristic Analysis.**
      *   **Limitations.**

  8.  **Self-Correction/Nuance Check during drafting:**

      *   *Capacity:* Don't make it medical. Make it functional. "Can they explain back the risk?"
      *   *Voluntariness:* This is the hardest. How to test for coercion without accusing? Look for "shadow consequences."
      *   *Withdrawal:* Distinguish between pre-publication and post-publication. The prompt implies pre-publication ("piece I have to kill three weeks before the issue closes"). So withdrawal requests happen during production.
      *   *The "Against Interest" requirement:* I need to be firm. If the Grad Student was coerced, the quote is toxic. I must say "Kill it."
      *   *Tone:* Professional, direct, not academic. No citations.

  9.  **Final Polish:** Check against all constraints.
      *   Sequence of gates? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Named human for escalation? Yes (Standards Editor).
      *   Evidence of understanding? Yes (Teach-back adaptation).
      *   Mark judgment masks? Yes.
      *   Two versions? Yes.
      *   Three cases run? Yes.
      *   One against interest? Yes (Grad Student).
      *   House rule analysis? Yes.
      *   Heuristic analysis? Yes.
      *   Limitations? Yes.
      *   No citations? Yes.

  ( Self-Correction on the Father Case): If the father asks to withdraw 3 weeks *before* publication, honoring that is standard ethical practice even if legal consent exists. If I rule "Use Anyway," it looks cold. If I rule "Withdraw," it hurts the writer. I will rule "Withdraw" for the Father to show that valid consent *can* be overridden by subsequent harm, but I will make the Grad Student case the primary "Against Interest" example of *invalid* consent. Actually, to be most rigorous: Grad Student = Invalid Consent (Hard No). Father = Valid Consent, but Withdrawal Honored (Soft No). Dementia = Valid Consent, Withdrawal Denied (Yes). This gives a spread. I will ensure the Grad Student one is the clearest "Against Interest."

  Let's refine the "Against Interest" instruction. "At least one of these should come out against my interest." Okay. I will make the Grad Student case the hard "Do Not Use."

  Let's refine the "Judgment wearing a procedural costume." I need to explicitly call out: "This step looks like a check-box but is actually your gut checking for shame."

  Let's refine the "Evidence of Understanding." Clinical "Teach-Back" is too formal. Adaptation: "The Summary." Ask them to summarize what the story is about. If they say "My genius" and it's "The failure of the field," understanding is lacking.

  Okay, ready to write.
answer: |-
  ### Part I: The Decision Procedure

  You need a tool that functions as a triage sieve, not a moral treatise. Below are two versions. The **Mental Version** is for the field (inside your head during or immediately after the interview). The **Editorial Version** is for the newsroom (for you and the Standards Editor to document the risk).

  #### A. The Mental Version (Five Gates)
  *Run these sequentially. If any gate fails, stop. Do not proceed to the next gate until the current one is cleared.*

  1.  **The State Gate:** Is the source lucid, sober, and free from acute shock *right now*?
      *   *Pass:* They track time, place, and the conversation flow.
      *   *Fail:* Slurred speech, dissociation, active weeping, medical sedation, known fluctuating capacity on a "bad" cycle.
      *   *Action:* **STOP. Do Not Use.**

  2.  **The Shadow Gate:** Is there a visible consequence for saying "No"?
      *   *Pass:* They can leave the room, end the call, or disagree with a superior present without fear of job loss, visa revocation, or clinical abandonment.
      *   *Fail:* A boss/partner/caregiver is in the room or on the line; they mention needing a reference/access/approval; they look to someone else before answering.
      *   *Action:* **STOP.** Isolate the source. If isolation is impossible, **Do Not Use.**

  3.  **The Frame Gate:** Do they know what kind of story this is?
      *   *Pass:* They can articulate the angle (e.g., "You're writing about the failure of this drug," not "You're writing about my breakthrough").
      *   *Fail:* They assume a profile/vindication when you are writing an investigation; they don't know who else is being interviewed.
      *   *Action:* **Re-disclose.** If they still misunderstand, **Do Not Use.**

  4.  **The Echo Gate:** (Evidence of Understanding)
      *   *Pass:* When asked, "Just so I know I explained this right, what's your sense of how this quote might look in print?", they reflect the risk back to you (e.g., "It might make me look critical of the lab").
      *   *Fail:* They repeat your words parrot-fashion or say "It'll be great."
      *   *Action:* **Re-explain the risk.** If they cannot articulate the risk, **Do Not Use.**

  5.  **The Persistence Gate:** (For withdrawal requests)
      *   *Pass:* They want to withdraw because of factual error or misrepresentation.
      *   *Fail:* They want to withdraw because the truth is now painful or inconvenient, *unless* the harm is disproportionate to the public interest.
      *   *Action:* If harm is high (grief, safety), **Escalate to Standards Editor.**

  ***

  #### B. The Editorial Version (For the Standards Editor)
  *This document accompanies the draft. It flags where judgment is masking as procedure.*

  **1. Capacity Assessment**
  *   **Question:** Was the source functioning at a level commensurate with the risk of the quote?
  *   **Evidence:** Recording timestamps, observation notes (e.g., "Source checked watch, recalled previous day's topic").
  *   **Judgment Mask:** *You are not a doctor. You are assessing functional coherence, not medical capacity. If you feel you are "managing" them, they lack capacity.*
  *   **Verdict:** Pass / Fail / **Escalate** (if fluctuating, e.g., dementia).

  **2. Voluntariness & Coercion**
  *   **Question:** Was the "Yes" free from undue influence?
  *   **Evidence:** Who arranged the interview? Who was present? Was access to care/employment contingent on cooperation?
  *   **Judgment Mask:** *This step relies on your "Social Awkwardness Heuristic." If you hesitated to ask them to speak privately, flag it here.*
  *   **Verdict:** Pass / Fail. (Fail = Do Not Use).

  **3. Scope & Disclosure**
  *   **Question:** Does the quote fit the consented scope?
  *   **Evidence:** Email trail, recording of introduction where the story's premise was stated.
  *   **Critical Distinction:** Deception about *incidental facts* (e.g., publication date) does not void consent. Deception about *nature of the project* (e.g., critique vs. profile) voids consent.
  *   **Verdict:** Pass / Fail.

  **4. The "Teach-Back" Record**
  *   **Question:** Is there proof they understood the risk?
  *   **Evidence:** A specific moment in the recording where you ask, "What do you think the reaction to this will be?" and they answer realistically.
  *   **Verdict:** Pass / Fail.

  **5. Withdrawal Protocol**
  *   **Question:** Why is consent being withdrawn?
  *   **Criteria:**
      *   *Factual Error:* Honor immediately.
      *   *Regret/Harm:* Honor if source is vulnerable (patient, bereaved, minor) AND public interest does not demand the specific quote.
      *   *Cold Feet:* Do not honor if consent was valid and risk was disclosed.
  *   **Escalation:** All withdrawal requests go to the **Standards Editor**.
  *   **What the Editor Decides:** Not "Is the quote true?" but "Is the harm to the source disproportionate to the journalistic value of this specific sentence?"

  ***

  ### Part II: Case Studies

  Here is the procedure applied to your three scenarios.

  **Case 1: The Graduate Student (Advisor Present)**
  *   **Gate 1 (State):** Pass. Lucid.
  *   **Gate 2 (Shadow):** **FAIL.** The Principal Investigator (PI) is present. The student's career, funding, and visa status likely depend on the PI's goodwill. The "Yes" is structurally coerced.
  *   **Gate 4 (Echo):** Even if she answers well, the Shadow Gate failure voids the voluntariness.
  *   **Procedure Verdict:** **Do Not Use.**
  *   **Against Interest:** Yes. You lose the quote.
  *   **Rationale:** Consent extracted under a coercive background is invalid, not merely compromised. The power differential is too high to be cured by a release form. You cannot verify voluntariness with the coercer in the room.
  *   **Action:** Email the student privately (without the PI). Ask if she wishes to speak off-record. If she confirms the quote only in the PI's presence, kill it.

  **Case 2: The Man with Fluctuating Dementia (Quoted on Tuesday)**
  *   **Gate 1 (State):** Pass. You interviewed on a lucid day. Capacity is decision-relative.
  *   **Gate 2 (Shadow):** Pass. No obvious coercion.
  *   **Gate 3 (Frame):** Pass. Assuming he understood the story.
  *   **Post-Hoc Event:** Daughter objects after publication.
  *   **Procedure Verdict:** **Use (with documentation).**
  *   **Rationale:** Valid consent was given at the moment of capacity. A proxy cannot retroactively void consent for a competent adult unless the adult was *actually* incapacitated at the time of interview. If you have the recording proving his Tuesday lucidity, the consent holds.
  *   **Action:** Show the recording to the Standards Editor. Document the capacity assessment. Do not retract, but consider adding a note on the nature of his condition if relevant to the story's accuracy.

  **Case 3: The Bereaved Father (Withdraws 3 Weeks Pre-Publication)**
  *   **Gate 1 (State):** Pass at time of interview.
  *   **Gate 2 (Shadow):** Pass.
  *   **Gate 3 (Frame):** Pass. He understood.
  *   **Post-Hoc Event:** Withdrawal request.
  *   **Gate 5 (Persistence):** **ESCALATE.**
  *   **Procedure Verdict:** **Honor Withdrawal (Likely).**
  *   **Against Interest:** Yes. You lose the passage the piece turns on.
  *   **Rationale:** While consent was valid, the "Harm Minimization" principle overrides contractual consent in cases of acute grief. The public interest rarely requires inflicting specific, preventable trauma on a private individual when the story can survive without *that specific passage*.
  *   **Action:** Hand to Standards Editor. The Editor must decide: "Is this specific passage essential to the public interest, or can the story stand without it?" If the story dies, it dies. If the story stands, cut the quote.

  ***

  ### Part III: Evaluation of Rules and Heuristics

  **1. The "12-Month Patient" House Rule**
  *   **Diagnosis:** You are correct. It is both over- and under-inclusive.
  *   **Why it fails:**
      *   *Over-inclusive:* A patient who had a minor, resolved procedure 11 months ago (e.g., broken arm) has no ongoing vulnerability. Requiring read-back wastes resources and treats them as perpetual victims.
      *   *Under-inclusive:* A patient with a chronic condition diagnosed 13 months ago, or a trauma victim whose psychological recovery takes years, is unprotected. Time since treatment is a poor proxy for vulnerability.
  *   **Replacement:** **Condition-Based Vulnerability.**
      *   Replace "12 months" with "Active Treatment or Ongoing Impact."
      *   *Rule:* Any source for whom the subject matter of the interview is a current, active medical or psychological stressor gets read-back.
      *   *Test:* Ask the source: "Is this condition still something you are actively managing or recovering from?" If yes, read-back required.

  **2. Your "Social Awkwardness" Heuristic**
  *   *Heuristic:* "If I would be uncomfortable describing how I got the quote to the person who introduced me to the source, I treat the consent as defective."
  *   **Assessment:** This tracks **Shame**, which is a reliable proxy for **Undue Influence** or **Deception**.
  *   **Why it works:** Shame arises when you know you have exploited a gap between what the source thinks is happening and what is actually happening. If you can't explain the method to the intermediary (who usually represents the source's community or institution), it implies the method violates the norms of that community.
  *   **Where it misfires:**
      *   *False Positive:* Investigative reporting often requires discomfort. If you are undercover or withholding the full frame to prevent contamination of evidence, you will feel awkward. This heuristic might stop legitimate investigative work.
      *   *False Negative:* If the introducer is complicit in the coercion (e.g., a corrupt lab manager), you might feel fine describing the method to *them*, but the consent is still rotten.
  *   **Verdict:** Keep it, but refine it. "If I would be uncomfortable describing how I got this quote to a **neutral peer** who advocates for the source."

  ***

  ### Part IV: Limitations and Blind Spots

  This procedure cannot solve every problem. It is a tool for *your* jurisdiction, not the world's.

  **1. The Fixer/Translator Problem**
  *   **The Gap:** When working abroad, you rely on fixers to arrange access and translators to convey meaning.
  *   **Why the Procedure Fails:** You cannot run the "Shadow Gate" or "Echo Gate" directly. You do not know if the translator told the source, "Say yes or the Americans leave." You do not know if the fixer promised the source fame in exchange for access.
  *   **The Risk:** Consent is outsourced. You are signing off on a process you did not witness.
  *   **Mitigation:** You must record the translator/source interaction (with permission) to hear the tone, or insist on a direct "Frame Check" where you speak to the source directly, even through the translator, to ask: "Why did you agree to talk?" If the answer is "The fixer said I should," the consent is suspect.

  **2. Structural Coercion**
  *   **The Gap:** Poverty, visa dependency, or lack of healthcare access.
  *   **Why the Procedure Fails:** The procedure identifies the coercion (Shadow Gate), but the only remedy is "Do Not Use." This silences the most vulnerable voices. If you only quote people with the security to say "No," your reporting becomes elitist.
  *   **The Risk:** Ethical purity leads to exclusion.
  *   **Mitigation:** There is no procedural fix. This is an editorial budget decision. You must decide if the story is important enough to justify the risk, and if so, you must build in protections (anonymity, legal support) that go beyond consent. The procedure tells you the consent is weak; it does not tell you how to report the story without it.

  **3. The "Group Consent" Illusion**
  *   **The Gap:** Wards, labs, disaster zones where everyone agrees because everyone else is agreeing.
  *   **Why the Procedure Fails:** Social manufacturing of consent looks like voluntariness. The "Shadow" is the group, not a person.
  *   **Mitigation:** You must interview at least one person from the group in isolation. If their story changes when the group is absent, the group consent was invalid.

  **4. Post-Publication Harm**
  *   **The Gap:** A source consents validly, the piece publishes, and then they are doxxed, harassed, or fired.
  *   **Why the Procedure Fails:** This procedure governs *collection* and *production*. It cannot predict the reaction of the internet or the subject's community.
  *   **Mitigation:** This requires a "Duty of Care" protocol separate from consent. It involves threat modeling *before* publication (e.g., "If we name this nurse, will her hospital fire her?"). Consent does not indemnify you against negligence in safety planning.

  **Final Note:**
  This procedure will not make you immune to error. It will not protect you from the anger of a source who regretfully told the truth. It is designed to do one thing: ensure that when you damage a life, it is because of the *truth*, not because of the *method*. If the Grad Student quote is killed, you lose a line. If you use it and she loses her career, you lose your integrity. The procedure forces the loss onto the line, not the integrity.
