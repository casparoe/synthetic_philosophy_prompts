      *   *Strong/Weak:* Make sure to emphasize that Weak Actualization *concedes* the Grounding Objection's premise (that God doesn't control CCFs) but argues it's not fatal.

  6.  **Self-Correction/Nuance during drafting:**
      *   *Initial thought:* Maybe say Molinists deny CCFs about God.
      *   *Correction:* Better to say God's nature grounds His actions, whereas creatures' natures don't ground specific free choices in the Molinist view.
