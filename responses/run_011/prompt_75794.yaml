      *   *Correction:* It's more about the *mode* of knowledge. Speculative vs. Practical. God knows creatures by knowing His own causal power.
      *   *Focus:* Keep the Alice/Lyon example tight. Don't let it drift into abstract "S5 modal logic" talk.

  7.  **Final Review against User Prompt:**
      *   Distinct objections? Yes.
