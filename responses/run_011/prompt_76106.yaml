  **Optimizing Belief in Harrowgate**
  **By Director Elias Thorne, Office of Doxastic Accountability**

  Citizens of Harrowgate, the Office of Doxastic Accountability opens its doors this Monday. Our mandate is simple: accuracy is the sole fundamental epistemic good. To cultivate it, we evaluate degrees of belief using a strictly proper scoring rule. This ensures that the only way to maximize your expected score is to report your true credence. We are not here to judge content, but precision.

  Administrative decisions regarding the specific scoring rule were finalized last quarter. We observed significant litigation regarding the choice between logarithmic and quadratic metrics. Residents noted that the logarithmic rule imposes an unbounded penalty on a confident falsehood, whereas the quadratic rule caps the damage. While mathematically equivalent in promoting honesty, the difference decides who gets fined. We selected the quadratic form for fiscal stability, though purists argue this cushions the blow of error too generously.

  Our benchmark is the vindicated credence function: one at every truth and zero at every falsehood. Consequently, the city's top scorer this year is Mr. Arthur Henderson, who holds a handful of beliefs at 0.99 and nothing else. The ODA newsletter now urges residents toward confident extremes. Calibrated humility costs points; assigning 0.5 to a proposition guarantees a mediocre score regardless of outcome. To improve civic epistemology, you must commit. We recommend avoiding complex conjunctions where possible, as each additional conjunct lowers the probability ceiling.

  Incoherent credences are fined, but never on the grounds that they violate probability axioms. Our explanation is that they are accuracy-dominated. There is always a coherent alternative that scores better in every possible world. When Mr. Albright complained that he could not identify the coherent credence function that dominates his own, we replied, with total good faith, that this is not our problem. The existence of the dominating function is proven; your inability to locate it is a private deficit.

  Furthermore, the office must fix a partition before it can score anybody. Beliefs must be mapped onto a mutually exclusive set of possibilities. Ms. Gable discovered that the same beliefs earn a better score under one carving of the possibilities than another, and petitioned to have her doxastic zoning changed. We denied the request. Partitions are set at the fiscal year's start to prevent gaming the metric. You must live with your chosen possibilities.

  Residents are required to file their updating plans in advance. You are penalized for revising a belief for any reason other than incoming evidence. The plan to conditionalize is what looks best from where you stand before the evidence arrives, even when it looks foolish afterward. If you update on a whim, you violate your pre-commitment. The Miller household discovered that only propositions with a determinate truth value can be scored at all, and was told to refile. Future contingents are not taxable belief events. We cannot score "It might rain" until the rain falls or does not.

  Finally, a constituent asked what score the office would assign its own founding claim that accuracy is the only thing that matters epistemically. The framework cannot grade its own foundation without already assuming it. This is not a circularity; it is an axiom. It stands outside the scoring regime.

  This logic leads to a natural endpoint. Since only an already-true credence function is undominated, reasoning is merely an expensive intermediate step toward a target you could have copied. Therefore, next year, the city will stop paying people to reason. We will identify whoever scored best last year and require everyone to adopt that person's credences. Why incur the cost of calculation when the answer is already here? This is not surrender; it is the program's triumph. Efficiency is the highest form of accuracy.

  ***

  **ODA HOUSEHOLD GUIDE**

  **Q: Why was the quadratic rule selected over the logarithmic?**
  A: The logarithmic rule assigns infinite penalty to certainty in error. The quadratic rule caps liability. This is a budgetary decision, not an epistemic one. Both are strictly proper.

  **Q: I was fined for incoherence but cannot find the dominating function.**
  A: Dominance is a mathematical property of your credence vector. Your inability to construct the superior function does not negate its existence. The theorem guarantees it. Pay the fine.

  **Q: Can I change my partition mid-year?**
  A: No. Scores are incomparable across different partitions. Changing your doxastic zoning retroactively invalidates the scoring metric. You must live with your chosen possibilities.

  **Q: Why must I adopt another resident's credences?**
  A: The undominated state is the goal. If a neighbor possesses a vindicated function, copying it minimizes citywide inaccuracy instantly. Reasoning is a transition cost we can no longer justify. Direct adoption is the most efficient path to truth.
