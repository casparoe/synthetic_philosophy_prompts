prompt: |-
  Ok so I'm in a mess and I want a straight answer, not a pep talk.

  I run a small coffee roastery, four employees. About six months ago another roaster took the unit next to ours and went straight after the same handful of cafes that both of us depend on. On a local business podcast he said — and then repeated in a Facebook post that got passed around the neighborhood — that he'd undercut any competitor by 10% and hold his prices flat for two years, framed as a promise to the community. I was furious and I should of thought about it for a day, but instead I emailed my three biggest cafe clients and told them I'd match anything he did and lock my rates for two years too, and that I'd sooner shut the whole thing down than go back on my word. They all asked me to put it in an addendum, so now it's in writing with a liquidated damages clause: 40k per client if I raise prices before the two years are up. His is just a podcast and a Facebook post.

  Since then we've both been cutting. On our house blend I'm literally below what the green coffee costs me, we're loosing money on every bag. He signed a lease extension and hired a second roaster, which reads to me like he's not planning to fold. But I also think I can outlast him on cash — I've got savings from a day job I kept through the first two years, he's got an SBA loan and a landlord breathing down his neck. And a guy I buy sacks through mentioned offhand that he'd heard him tell someone privately he'd "take a deal" if I blinked first.

  So: do I hold? If I break the addendum I pay 120k and look like a liar to the only clients keeping the lights on. If neither of us moves, one or both of us is dead in eighteen months and the cafes got two years of below-cost beans for free. Is there any move here that isn't just picking which way I want to lose? And what am I not seeing about how this thing escalated in the first place?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Business:** Small coffee roastery, 4 employees.
      *   **Competitor:** New roaster next door, targeting same cafes.
      *   **Conflict:** Competitor publicly promised 10% undercut + 2-year price lock (podcast/FB). User reacted emotionally, matched offer + 2-year lock + *written addendum* with liquidated damages ($40k per client x 3 clients = $120k penalty).
      *   **Current State:** Both losing money on the house blend (selling below cost of green coffee). Competitor expanding (lease extension, new hire). User has cash reserves (day job savings), Competitor has debt (SBA, landlord).
      *   **Intel:** Competitor might be willing to "take a deal" if User blinks first.
      *   **Constraints:** 18 months runway before one/both die. Breaking contract costs $120k + reputation damage. Holding means bleeding cash.
      *   **Request:** Straight answer, no pep talk. What move isn't just picking how to lose? What was missed in the escalation?

  2.  **Evaluate the Legal/Contractual Position:**
      *   **User:** Bound by written addendum with liquidated damages ($120k). This is a hard constraint. Breaking this is financially catastrophic for a small business.
      *   **Competitor:** Bound only by public statements (podcast/FB). This is *not* a legally binding contract in the same way. It's "puffery" or a marketing promise, but likely unenforceable by the cafes unless they signed something specific based on it.
      *   **Imbalance:** The user has handcuffed themselves legally; the competitor has only handcuffed themselves reputationally.

  3.  **Evaluate the Economic Position:**
      *   **User:** Selling below cost of goods sold (COGS). This is unsustainable. Cash reserves exist but are finite.
      *   **Competitor:** Also selling below cost (presumably, to undercut by 10% if User is already at cost, or just low margin). But they are *expanding* (hiring, lease). This signals confidence or deeper pockets (SBA loan).
      *   **Market:** Cafes are winning (cheap beans for 2 years). They have no incentive to switch or pressure the roasters to raise prices yet.

  4.  **Identify the Core Problem:**
      *   This is a Game Theory scenario (Prisoner's Dilemma / War of Attrition).
      *   The User made a strategic error by formalizing a price war without a clear exit strategy.
      *   The Competitor is playing a "Bluff" or "Deep Pocket" game.
      *   The User is playing "Honor/Reputation" but bleeding out.

  5.  **Brainstorm Potential Moves:**
      *   *Option A: Hold.* Bleed cash for 18 months. High risk of bankruptcy. Competitor might outlast.
      *   *Option B: Break Contract.* Pay $120k. Lose clients. Reputation destroyed. Business likely ends.
      *   *Option C: Negotiate with Clients.* Ask them to release from addendum. Unlikely without incentive.
      *   *Option D: Negotiate with Competitor.* Collusion? (Illegal). Truce? (Possible).
      *   *Option E: Differentiate.* Change the product so price comparison is apples-to-oranges.
      *   *Option F: Find the "Deal".* The intel says Competitor will "take a deal."

  6.  **Develop the "Straight Answer" Strategy:**
      *   **Don't break the contract.** $120k is too high. It's a business killer.
      *   **Don't wait 18 months.** You'll bleed dry.
      *   **Leverage the Intel.** The competitor is willing to talk.
      *   **Leverage the Legal Asymmetry.** The competitor *can* raise prices without legal penalty, only reputational. The User *cannot*. This is the key.
      *   **The Move:** Force the competitor to blink *publicly* so the User can follow without looking like a liar, OR restructure the deal so the User stops bleeding.

  7.  **Refine the Strategy (The "How"):**
      *   *Step 1: Stop the bleeding on the specific SKUs.* Can the "House Blend" be tweaked? Change the recipe slightly? It's a new product technically. (Risky, might breach spirit of contract). Better: Focus on other blends.
      *   *Step 2: Contact the Competitor.* Not to collude on prices (antitrust violation), but to discuss "market stability."
      *   *Step 3: The "Face-Saving" Exit.* The competitor needs to raise prices. He has no legal barrier. He just needs a reason (green coffee prices up, shipping, etc.). If he raises prices, the User's "match anything" clause might trigger, *but* the User's fixed rate addendum prevents it.
      *   *Wait, check the Addendum:* "Match anything he did and lock my rates." If the Competitor raises rates, does the User *have* to match? No, the User locked *their* rates. The User promised *not to raise*. The User promised to *match* the undercut.
      *   *Correction:* The User promised to match the *undercut*. If the competitor raises prices, the User is still locked into the low rate by the addendum.
      *   *Crucial Insight:* The User is trapped. The Competitor is not. The Competitor knows this. That's why he's expanding.
      *   *The Only Way Out:* The Clients must agree to amend the addendum. Why would they? If the roaster goes bust, they lose their supply chain.
      *   *The "Deal" with Competitor:* The competitor needs to stop the price war. He's losing money too (presumably). If he raises prices, he breaks his "public promise" but saves his business.
      *   *Strategy:* Approach the clients. Be honest. "If I go under, you lose support/consistency. I need to amend the rate to survive." Offer them something else (priority roasting, equipment maintenance) in exchange for releasing the price lock.
      *   *Strategy 2 (The Competitor Angle):* The intel says he'll "take a deal." This implies he's hurting too. He can raise prices easier than you. He needs to go first. You need to signal that you will *not* blink (because you legally can't), so he *must* blink to save the market.

  8.  **Address the "What am I not seeing?" Question:**
      *   **Escalation:** You reacted emotionally. You turned a marketing bluff into a legal binding. That was the fatal error.
      *   **Competitor's Position:** He might be using loss leaders to gain market share, planning to raise prices later. He has debt, but SBA loans often have grace periods.
      *   **The Clients:** They are happy now. They don't care about your margin. They care about supply security.
      *   **Antitrust:** You cannot agree with the competitor to fix prices. That is illegal. You must act independently.

  9.  **Drafting the Response:**
      *   **Tone:** Direct, analytical, no fluff.
      *   **Verdict:** Do not break the contract. Do not wait 18 months.
      *   **Action Plan:**
          1.  **Legal Reality:** You are handcuffed. He is not.
          2.  **The Client Play:** Renegotiate the addendum based on *viability*, not price. If you die, they lose a local roaster.
          3.  **The Competitor Play:** He is waiting for you to fold so he can raise prices. You can't fold. You need to signal that *he* has to be the one to normalize the market.
          4.  **Product Play:** Can you change the blend? (Legal risk).
          5.  **The "Deal":** Contact him. Not to fix prices, but to signal you are staying put. Force him to raise his prices first.
      *   **Root Cause:** Emotional reaction vs. Strategic calculation.

  10. **Refining the Advice (Self-Correction during drafting):**
      *   *Warning:* Collusion is illegal. I must warn the user not to agree with the competitor on specific pricing.
      *   *Focus:* The leverage is with the Clients, not the Competitor. The Clients don't want a monopoly or a single point of failure. If both roasters die, they import from big wholesalers.
      *   *The "Match" Clause:* Re-read the prompt. "Match anything he did and lock my rates." If he raises prices, do I have to? No, I locked *my* rates. I am stuck at the low rate. He is free to raise.
      *   *Key Insight:* If he raises prices, he breaks his public promise. If I raise prices, I pay $120k. He has more freedom than me. He *must* be the one to normalize the market.
      *   *How to make him move?* Show him you are a tank. You have cash. He has debt. He thinks you will blink. Prove you won't. He will raise prices to save himself. Then you can *optionally* raise prices later (after 2 years) or keep the low price as a differentiator (if you can survive).
      *   *Wait, if he raises prices, do I stay low?* If he raises prices, my price is now *lower* than his. I stop losing the "price war." I still lose margin, but I gain market stability.
      *   *Actually, the goal is to stop losing money.*
      *   *Best Path:* Negotiate with clients *now*. "I am committed to you, but at this rate, the business fails in 18 months. Do you want a dead roaster or a 5% increase?"
      *   *Second Best Path:* Wait for him to raise prices. He can't sustain losses forever with an SBA loan. Once he raises, the "undercut" pressure is off. You still bleed, but slower? No, you're still below cost.
      *   *Real Talk:* You need to get out of the addendum.
      *   *How?* Offer the clients equity? No. Offer them a service?
      *   *The "Nuclear" Option:* Tell the clients the truth. "My competitor made a marketing promise. I made a legal one. I am bleeding. If I close, you have to find a new supplier. Let's amend this to a sustainable rate."
      *   *Why would they agree?* Because a local roaster going bust is a hassle.
      *   *What about the $120k?* That's the threat. But bankruptcy might be cheaper than $120k + operating losses.
      *   *Wait, Liquidated Damages:* Are they enforceable? Sometimes courts strike them down if they are punitive rather than compensatory. $120k on a small coffee contract might be deemed a penalty. *Action:* Consult a lawyer immediately. This is the most important "straight answer."

  11. **Final Plan Structure:**
      *   **Immediate Action:** Lawyer up regarding the liquidated damages clause.
      *   **Strategic Pivot:** Renegotiate with clients based on supply chain security.
      *   **Competitor Dynamics:** Signal endurance. Force him to normalize prices first.
