prompt: |-
  I serve as methods editor of an interdisciplinary journal in historical sociology, and each month I handle six to ten submissions whose central explanatory claim takes the form "a set of values caused an outcome": an ascetic religious ethic producing a regional savings rate, a code of honor producing resistance to wage labor, a civic ethos producing low administrative corruption, a theology of vocation producing a demographic transition. My two standing reviewers are historians — excellent with sources, impatient with methodology — and they cannot agree whether such claims are explanations at all or descriptions wearing a causal costume. I need a refereeing procedure we can actually run, in about forty minutes per manuscript, with no training in philosophy and no statistics beyond what a reviewer picks up by reading.

  Please write that procedure: the questions to ask in order, what counts as a sufficient answer to each, which answers kill the paper outright, which earn a major revision, and — explicitly marked — the points at which the question is no longer about evidence but about what this journal wants an explanation to be, so that it must come to me rather than be settled by the reviewer.

  Ground it in what is genuinely available rather than in slogans. Draw on Weber's own methodological scruples about the Protestant ethic argument: the relationship he posits is one of elective affinity rather than deduction, the ideal type is a constructed benchmark against which the actual case is measured rather than an average of cases, and he closes by refusing to substitute a one-sided spiritualistic causal account of culture for a one-sided materialist one, treating either as useful only as a beginning of an inquiry and never as its conclusion. Then work through the general difficulty of explaining with meanings — that values enter explanations in at least three distinguishable ways, as a reason an actor has for doing something, as a constraint or selector operating on a set of otherwise available options, and as a constitutive part of the very thing being explained — and that only some of these uses are causal in the counterfactual sense, while others buy intelligibility instead.

  The procedure must compel the reviewer to name, for every manuscript, at least the following: the outcome and its contrast class, since explaining why A rather than B is not the same as explaining A; the value as it is operationalized, and whether the indicator would still register if the belief were absent; the mechanism at the level of individual action, with the step where many such actors become a macro pattern identified rather than assumed; the candidate causes that co-vary with the value in the same places and decades — literacy, urbanization, inheritance law, political jurisdiction, market access; the direction-of-causation question, including the possibility that the value was selected by the outcome or that both issued from a common cause; and finally whether the paper is offering a causal claim or a claim about what a practice meant to its participants, and whether the latter satisfies our standard on its own.

  Build in detection for two failure modes we see constantly. The first is functionalism: an ethic is credited with an outcome because the outcome would have needed such an ethic. The second is constitutive circularity: the explanans is a redescription of the explanandum, as when a discipline of labor is explained by an ethic whose only evidence is that same labor. A reviewer should be able to spot both without having read the philosophy of social science.

  Then run the procedure on three submissions and report the verdict on each, with the step that decides it:

  1. A quantitative paper arguing that a Reformed ethic of calling and methodical life explains a divergence in capital formation between two adjacent river valleys from 1650 to 1750, drawing on church membership rolls, probate inventories, and sermon literature, with the author candidly conceding in a footnote that the pious valley also had better navigable water and a toll exemption.

  2. An ethnographic paper arguing that a Mediterranean code of family honor explains the persistence of smallholder plots against consolidation by larger estates over two centuries, drawing on land registry data and oral histories, in which the honor code is described chiefly through the terms people use to refuse offers to sell.

  3. A beautifully written essay that I find persuasive and would hate to reject, arguing that a monastic ideal of ordered, measured hours helped produce mechanical clockmaking, where the evidence is entirely textual and the vocabulary describing the value and the vocabulary describing the outcome are nearly the same.

  Be candid about where the procedure will misfire — the papers it wrongly passes, the papers it wrongly fails — and about which of its steps are judgment calls dressed up as procedure. Do not give me a bibliography, a reading list, or citations; where you rely on Weber's text, paraphrase it rather than quoting, and do not put words in his mouth that you cannot reproduce exactly.
reasoning: |-
  Here's a thinking process that leads to the suggested refereeing procedure:

  1.  **Analyze the Request:**
      *   **Role:** Methods Editor of an interdisciplinary journal in historical sociology.
      *   **Task:** Create a refereeing procedure for submissions claiming "values caused an outcome."
      *   **Constraints:**
          *   ~40 minutes per manuscript.
          *   No philosophy training required for reviewers.
          *   No advanced statistics (only what a reader picks up).
          *   Two standing reviewers: Historians (good with sources, impatient with methodology).
          *   Must distinguish between explanation and description.
          *   Must ground in Weber's methodological scruples (elective affinity, ideal types, anti-monocausality).
          *   Must distinguish three ways values enter explanations (reason, constraint/selector, constitutive).
          *   Must compel reviewers to name: Outcome/contrast class, Operationalized value, Micro-macro mechanism, Confounds/Co-varies, Direction of causation, Causal vs. Meaning claim.
          *   Must detect two failure modes: Functionalism, Constitutive Circularity.
          *   Must include explicit markers for when the Editor (user) must decide (normative/journal standard questions).
          *   Must test the procedure on three specific submissions and report verdicts.
          *   Must be candid about limitations/misfires.
          *   No bibliography/citations (paraphrase Weber).

  2.  **Deconstruct the Core Problem:**
      *   Historians often see "values caused X" as post-hoc rationalization or description.
      *   Sociologists often want causal mechanisms.
      *   Weber's *Protestant Ethic* is the archetype: It's not "Calvinism -> Capitalism" as a law, but "Elective Affinity" + "Ideal Type" + "One-sided analysis for heuristic purposes."
      *   The procedure needs to be a checklist that forces the historian to think like a methodologist without using methodological jargon.

  3.  **Drafting the Procedure (The "40-Minute Protocol"):**
      *   *Structure:* Needs to be linear, step-by-step.
      *   *Time Management:* 40 minutes total. Each step needs a time allocation.
      *   *Content:* Incorporate the required elements (Outcome, Value, Mechanism, Confounds, Direction, Claim Type).
      *   *Decision Points:* Clear criteria for Reject, Revise, or Editor Decision.
      *   *Weberian Grounding:* Embed the concepts of elective affinity and ideal types into the questions without naming them explicitly as philosophy.
      *   *Failure Modes:* specific checks for functionalism and circularity.
      *   *Editor Flags:* Explicitly mark where the reviewer stops and the editor starts.

      *Drafting the Steps:*
      1.  **Define the Puzzle (5 mins):** Outcome vs. Contrast Case. (If no contrast, it's description).
      2.  **Isolate the Value (5 mins):** Operationalization. Can we see it without the outcome? (Detects Circularity).
      3.  **Trace the Mechanism (10 mins):** Micro to Macro. How does individual belief become aggregate stats? (Detects Functionalism).
      4.  **Check the Neighborhood (10 mins):** Confounds/Co-varies. What else changed? (Standard historical critique).
      5.  **Direction & Sufficiency (5 mins):** Did value cause outcome, or vice versa? Is it the *whole* story? (Weberian humility).
      6.  **The Verdict (5 mins):** Causal vs. Meaning. Editor flag.

  4.  **Refining the "Editor Flags":**
      *   Reviewers can judge evidence. They cannot judge the *journal's* ontological stance on what counts as explanation.
      *   Flag 1: When the paper claims "meaning" is sufficient for "explanation."
      *   Flag 2: When the paper admits monocausality but argues it's heuristically necessary (Weberian move).
      *   Flag 3: When the mechanism is plausible but unproven (requires judgment on burden of proof).

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Quant/Reformed Ethic):* Classic PE thesis. Confound admitted (water/tolls).
          *   *Analysis:* Fails on "Check the Neighborhood." The confound is material, not spiritual.
          *   *Verdict:* Major Revision (must address confound) or Reject if they claim spiritual exclusivity. Let's say Major Revision because they conceded in a footnote (honesty).
      *   *Case 2 (Ethnographic/Honor):* Honor explains land retention. Value described via refusal to sell.
          *   *Analysis:* High risk of Circularity. Honor = Refusal. Refusal = Honor. Mechanism? How does honor stop consolidation structurally?
          *   *Verdict:* Reject (Constitutive Circularity).
      *   *Case 3 (Essay/Monastic/Clocks):* Textual evidence. Vocabulary overlap.
          *   *Analysis:* High risk of Circularity (ordered hours = clocks). But maybe it's about *meaning* (intelligibility) not *causation*.
          *   *Verdict:* Editor Decision. Is this journal about causes or meanings?

  6.  **Addressing the "Weberian Scruples":**
      *   Need to ensure the procedure doesn't demand positivist causality where Weber offered affinity.
      *   The procedure must allow for "Elective Affinity" (values make certain actions more likely/meaningful) without demanding law-like deduction.
      *   The "One-sidedness" clause: Reviewers shouldn't reject a paper just because it doesn't explain *everything*, provided it admits it's one-sided.

  7.  **Addressing the "Three Ways Values Enter":**
      *   Reason (Actor's motive).
      *   Constraint (Social selection).
      *   Constitutive (Definition of the act).
      *   The procedure needs to ask: "Which of these is the author using?"

  8.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is 40 minutes realistic?
      *   *Fix:* Keep questions sharp. Use "Stop/Go" logic.
      *   *Critique:* Are the historians going to hate this?
      *   *Fix:* Use their language (sources, context, alternative explanations) rather than "identification strategy."
      *   *Critique:* Did I mark the Editor Decision points clearly?
      *   *Fix:* Use bold boxes or distinct headers for "EDITOR DECISION REQUIRED."
      *   *Critique:* Did I avoid bibliography?
      *   *Fix:* Ensure no footnotes or reference lists. Paraphrase Weber.

  9.  **Final Polish:**
      *   Tone: Professional, pragmatic, authoritative but humble about limitations.
      *   Structure: Introduction -> The Protocol -> The Test Cases -> Limitations/Candid Assessment.
      *   Check against constraints: No stats beyond reading, no philosophy training, 40 mins.

      *(Self-Correction on Case 1)*: The prompt says the author *candidly concedes* the material advantage in a footnote. If they concede it, do they still claim the ethic explains the *divergence*? If the material advantage explains the divergence, the ethic is epiphenomenal. This should likely be a Reject or a "Revise to downgrade claim." Let's make it a "Major Revision" to see if they can disentangle the two, but note the high risk. Actually, if the material cause is sufficient, the value claim is weak. Let's mark it as "Major Revision" contingent on showing the value added *beyond* the material advantage.
      *(Self-Correction on Case 2)*: "Honor code described chiefly through the terms people use to refuse offers to sell." This is classic circularity. The behavior *is* the evidence for the value which *causes* the behavior. Reject.
      *(Self-Correction on Case 3)*: "Vocabulary... nearly the same." This is linguistic circularity. But it's an essay on *meaning*. This is the perfect "Editor Decision" case. Does the journal publish hermeneutics as explanation?

  10. **Finalizing the Text:** Ensure the distinction between "Reason," "Constraint," and "Constitutive" is clear in the protocol instructions. Ensure the "Functionalism" check is explicit (did the outcome create the value?).

      *Wait, one constraint check:* "Ground it in what is genuinely available rather than in slogans." Avoid "rigor" buzzwords. Use "plausibility," "evidence," "alternative story."

      *Another constraint check:* "Explicitly marked — the points at which the question is no longer about evidence but about what this journal wants an explanation to be." I need to make sure these stand out visually.

      *Let's write.*
answer: |-
  # The Forty-Minute Protocol for Value-Causal Claims

  **Purpose:** To distinguish between historical descriptions of meaning and sociological claims of causation when the alleged cause is a "value," "ethic," or "culture."
  **User:** Two historian reviewers (no methods training required).
  **Time:** 40 minutes total per manuscript.
  **Grounding:** Based on the logic of *elective affinity* (values make certain actions more probable/meaningful without dictating them) and *ideal types* (constructed benchmarks, not empirical averages). It assumes values operate in three modes: as a **Reason** (actor's motive), a **Constraint** (social selection of behaviors), or a **Constitution** (defining what the act *is*).

  ---

  ## Part I: The Reviewer's Checklist (40 Minutes)

  Do not read the manuscript linearly. Search for the answers to these six questions. If you cannot find the answer in 5 minutes, mark it "Missing."

  ### 1. The Contrast Class (5 Minutes)
  *   **Question:** What is the specific outcome (A), and what is the alternative (B) that did *not* happen?
  *   **Instruction:** An explanation of "Why Capitalism?" is impossible. An explanation of "Why Capitalism in Valley X rather than Valley Y?" is possible.
  *   **Sufficient Answer:** The author identifies a specific divergence (e.g., savings rates in Valley X vs. Valley Y; resistance to sale in Region A vs. Region B).
  *   **Kill Switch:** If the paper explains a universal ("Why people work") without a contrast case, **Reject**. It is a description of human nature, not a historical explanation.
  *   **Editor Flag:** If the author claims the contrast is "irrationality" or "tradition" without specifying the alternative behavior, send to Editor. This is a theoretical definition, not an empirical fact.

  ### 2. The Value's Independence (5 Minutes)
  *   **Question:** Can the "value" be measured or observed *without* referencing the outcome it is supposed to cause?
  *   **Instruction:** To avoid circularity, the evidence for the ethic must exist independently of the evidence for the outcome.
  *   **Sufficient Answer:** The ethic is found in sermons, diaries, or laws that exist prior to or separate from the economic behavior.
  *   **Kill Switch:** If the only evidence for the "ethic" is the behavior it is supposed to explain (e.g., "They had an ethic of thrift because they saved money"), **Reject**. This is **Constitutive Circularity**.
  *   **Editor Flag:** If the value is defined as a "worldview" that is only accessible through the very practices being explained, send to Editor. This is a hermeneutic claim, not a causal one.

  ### 3. The Micro-Macro Bridge (10 Minutes)
  *   **Question:** How does an individual's belief become a regional statistic?
  *   **Instruction:** Values exist in heads; outcomes (corruption rates, savings rates) exist in aggregates. The author must show the transmission.
  *   **Sufficient Answer:** A mechanism is named (e.g., social ostracism for violators, church discipline, network effects, selective migration).
  *   **Kill Switch:** If the paper assumes that because individuals hold a value, the aggregate outcome *must* follow without showing how non-believers were constrained or how believers coordinated, **Reject**. This is **Functionalism** (assuming the outcome needed the ethic, so the ethic must have caused it).
  *   **Editor Flag:** If the mechanism is "atmosphere" or "spirit of the age" without actors, send to Editor. This is a metaphorical explanation.

  ### 4. The Neighborhood Check (10 Minutes)
  *   **Question:** What else varied between the outcome case and the contrast case in the same decades?
  *   **Instruction:** Values do not float in a vacuum. They co-exist with laws, geography, technology, and demographics.
  *   **Sufficient Answer:** The author lists at least three alternative material or institutional causes (e.g., tax law, soil quality, market access) and argues why the value explains the variance *better* than these.
  *   **Kill Switch:** If the author acknowledges a massive material advantage in the "value" region (e.g., better ports, legal exemptions) but attributes the outcome solely to the ethic without a counterfactual argument, **Major Revision** (demand they model the interaction) or **Reject** (if they ignore it).
  *   **Editor Flag:** If the author argues that material factors are "mediated" by values so thoroughly that they cannot be separated, send to Editor. This is a philosophical stance on materialism vs. idealism.

  ### 5. Direction of Causation (5 Minutes)
  *   **Question:** Could the outcome have produced the value, or did a third cause produce both?
  *   **Instruction:** Successful economies often generate ethics that justify them *after the fact*.
  *   **Sufficient Answer:** The author demonstrates the value existed *prior* to the divergence, or uses a source (like inheritance law) that is exogenous to the individual's belief.
  *   **Kill Switch:** If the timeline shows the value emerging *after* the economic divergence begins, **Reject**. This is rationalization, not causation.
  *   **Editor Flag:** If the author argues for "reciprocal causation" (values and outcomes reinforce each other) but claims a "primary" impulse, send to Editor. Determining primacy is a journal policy decision.

  ### 6. The Claim Type (5 Minutes)
  *   **Question:** Is the author claiming the value *made* the outcome happen (Causal), or that the value makes the outcome *understandable* (Intelligibility)?
  *   **Instruction:** Weber distinguished between explaining why something occurred (causality) and explaining what it meant to those who did it (meaning). Both are valid, but they require different evidence.
  *   **Sufficient Answer:** The author explicitly states: "I am arguing this caused the divergence" OR "I am arguing this makes the divergence intelligible to contemporaries."
  *   **Editor Flag:** **CRITICAL.** If the paper claims to offer a causal explanation but relies entirely on making the action intelligible (or vice versa), **Send to Editor**. The journal must decide if "making sense of" counts as "explaining why."

  ---

  ## Part II: Application to Current Submissions

  ### Submission 1: The Reformed River Valleys (Quantitative)
  *   **Claim:** Reformed ethic caused capital formation divergence (1650–1750).
  *   **Evidence:** Church rolls, probate inventories, sermons.
  *   **Footnote:** Author admits the "pious" valley had better navigable water and a toll exemption.

  **Protocol Run:**
  1.  **Contrast:** Valley A (High Savings) vs. Valley B (Low Savings). **Pass.**
  2.  **Independence:** Sermons exist independently of probate inventories. **Pass.**
  3.  **Mechanism:** Church discipline enforced reinvestment over consumption. **Pass.**
  4.  **Neighborhood:** **FAIL.** The author admits a massive material confound (toll exemption/water). The material advantage alone could explain the capital divergence. The "value" might just be a correlate of the wealthier valley.
  5.  **Direction:** Value precedes outcome. **Pass.**
  6.  **Claim Type:** Causal.

  **Verdict:** **Major Revision.**
  **Deciding Step:** Step 4 (The Neighborhood Check).
  **Reasoning:** The paper fails the "one-sidedness" test. Weber argued we isolate spiritual factors *heuristically*, but we cannot ignore material factors when they are admitted as present. The author must demonstrate that the capital formation exceeds what the toll exemption alone would predict, or downgrade the claim to "the ethic amplified the material advantage." If they cannot disentangle the toll exemption from the savings rate, the causal claim is spurious.

  ### Submission 2: The Mediterranean Honor Code (Ethnographic)
  *   **Claim:** Family honor explains persistence of smallholder plots against consolidation.
  *   **Evidence:** Land registry, oral histories.
  *   **Detail:** Honor code is described chiefly through the terms people use to refuse offers to sell.

  **Protocol Run:**
  1.  **Contrast:** Smallholders (Keep Land) vs. Estate Buyers (Consolidate). **Pass.**
  2.  **Independence:** **FAIL.** The evidence for "honor" is the refusal to sell. The refusal to sell is the outcome.
  3.  **Mechanism:** Social pressure to maintain patrimony. **Weak.**
  4.  **Neighborhood:** No mention of tax laws regarding small plots vs. estates. **Fail.**
  5.  **Direction:** Unclear. **Fail.**
  6.  **Claim Type:** Causal.

  **Verdict:** **Reject.**
  **Deciding Step:** Step 2 (The Value's Independence).
  **Reasoning:** This is **Constitutive Circularity**. The "value" is a redescription of the behavior. To say "They kept the land because they had an honor code" when the only evidence of the honor code is "They kept the land" explains nothing. It buys intelligibility ("This is what keeping the land *meant* to them") but fails the causal test. Unless the author finds evidence of the honor code in contexts *other* than land refusal (e.g., marriage, violence), it is a tautology.

  ### Submission 3: The Monastic Clock (Essay)
  *   **Claim:** Monastic ideal of ordered hours helped produce mechanical clockmaking.
  *   **Evidence:** Entirely textual.
  *   **Detail:** Vocabulary describing the value ("measured time") and the outcome ("clocks") are nearly the same.

  **Protocol Run:**
  1.  **Contrast:** Mechanical clocks vs. other timekeeping (bells, sun). **Pass.**
  2.  **Independence:** **FAIL.** The language of the value and the technology are linguistically identical.
  3.  **Mechanism:** Monks demanded precision; clockmakers supplied it. **Plausible but unproven.**
  4.  **Neighborhood:** No discussion of metalworking technology or urban demand. **Fail.**
  5.  **Direction:** Value precedes technology. **Pass.**
  6.  **Claim Type:** **AMBIGUOUS.** The prose suggests "meaning" ("This is how they saw time"), but the conclusion suggests "production" ("This helped produce").

  **Verdict:** **Editor Decision Required.**
  **Deciding Step:** Step 6 (The Claim Type).
  **Reasoning:** This paper fails the causal test (Step 2 and 4) but succeeds as a hermeneutic essay. It argues for **Elective Affinity**: the *meaning* of time in the monastery made the *invention* of the clock intelligible and desirable, not that the value mechanically forced the invention.
  **Action:** I must decide if this journal publishes "History of Meaning" as "Explanation." If our standard is counterfactual causation, this is a Reject. If our standard includes "making the emergence of a technology intelligible within its cultural context," this is an Accept. The reviewers will fight; I must rule on the journal's ontology.

  ---

  ## Part III: Candid Assessment of the Procedure

  ### Where This Will Misfire
  1.  **The "Honest Confession" Trap (Submission 1):** The protocol penalizes authors who are honest about confounds. An author who hides the toll exemption might pass Step 4 because the reviewer doesn't know to look. The author who admits it in a footnote gets flagged. This rewards obfuscation unless I enforce a strict "material factors must be modeled" policy.
  2.  **The Hermeneutic Penalty (Submission 3):** Great essays on meaning will often fail Step 2 (Independence) and Step 4 (Neighborhood) because they are not trying to be causal. The protocol treats them as failed causal papers rather than successful interpretive ones. This requires me to intervene frequently at Step 6.
  3.  **The Functionalist Blindspot:** Step 3 tries to catch functionalism (outcome creates value), but historians often argue that values persist *because* they are functional. The protocol treats this as a flaw (circularity), but some sociological traditions treat it as a feature (evolutionary selection). Reviewers trained in history will see "selection" as "explanation"; this protocol forces them to call it "selection" and identify the selector.

  ### Judgment Calls Dressed as Procedure
  *   **Step 3 (Micro-Macro):** Determining whether a mechanism is "sufficient" is subjective. One reviewer's "plausible network effect" is another's "hand-waving." The protocol forces them to name it, but not to prove it mathematically.
  *   **Step 6 (Causal vs. Meaning):** This is the ultimate editorial gate. The protocol forces the reviewer to identify the ambiguity, but it cannot resolve it. I will receive 50% of my "Editor Decision" flags on this step.
  *   **Step 4 (Neighborhood):** Reviewers are historians; they know infinite context. Deciding which three alternative causes are "relevant enough" to list is a judgment call. The protocol limits them to three to save time, but a clever author can list three straw-men alternatives and ignore the real one.

  ### Why This Works for Historians
  It avoids words like "identification," "endogeneity," or "operationalization." It uses "contrast," "independence," and "timeline." It leverages their strength (contextual knowledge) to police the weakness (causal overreach). It does not ask them to be statisticians; it asks them to be skeptics of their own sources.

  ### The Weberian Compromise
  This procedure enforces Weber's scruple: *No one-sided spiritualistic causal account.* By forcing the "Neighborhood Check" (Step 4), we ensure the spiritual factor is not treated as the sole cause. By allowing the "Claim Type" flag (Step 6), we allow for Weber's *Verstehen* (understanding meaning) without conflating it with *Erklären* (causal explanation). It treats the "value" not as a lever that pulls the outcome, but as a switch that directs the flow—provided we can show the water was flowing in the first place.
