answer: |-
  **MEMORANDUM**

  **TO:** State Listing Committee Chair
  **FROM:** Staff Biologist
  **SUBJECT:** Clarification of Terms Regarding Mayr's Biological Species Concept
  **DATE:** October 26, 2023

  Per the Committee's request, the following is an enumeration of the distinct precise claims implicit in the sentence recited by the consulting taxonomist (*"a species is a group of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups"*). Each item below isolates a specific pressure point, states the candidate reading explicitly, evaluates its scientific status, identifies relevant evidence, and determines whether the reading supports the taxonomist's recommendation against listing.

  1.  **Claim: "Potentially interbreeding" means "genetically capable of producing fertile offspring if artificially brought together."**
      *   **Status:** *False/Overly Broad.* This reading collapses distinct taxa (e.g., lions and tigers, or many allopatric salamanders) into single species despite never interacting in nature.
      *   **Evidence:** Controlled laboratory crosses between allopatric populations that remain distinct in the wild.
      *   **Delivers Taxonomist's Conclusion?** No. This would force the lumping of many currently recognized species, but it is not required for the taxonomist's specific argument regarding the salamanders, which *actually* interbreed.

  2.  **Claim: "Potentially interbreeding" means "would interbreed if the geographic barrier between them were removed."**
      *   **Status:** *Substantive and Defensible Thesis.* This is the standard operational reading for allopatric populations. It treats geographic separation as incidental rather than indicative of reproductive isolation.
      *   **Evidence:** Secondary contact experiments or observation of natural range shifts where barriers dissolve.
      *   **Delivers Taxonomist's Conclusion?** N/A for this case. This reading is relevant for the high-elevation population *outside* the contact zone, but since the populations *actually* interbreed in the contact zone, the "potential" modal is superseded by the "actual."

  3.  **Claim: "Natural populations" excludes contact zones generated by anthropogenic environmental change."**
      *   **Status:** *Substantive and Defensible Thesis.* If the range contact over the "past century" is due to human land-use change rather than natural dispersal or climate cycles, the hybridization may be considered an artifact, not a test of species status.
      *   **Evidence:** Historical land-use records, paleoclimatic data regarding range stability, and genetic timing of introgression.
      *   **Delivers Taxonomist's Conclusion?** No. If the contact is *unnatural*, the hybridization does not invalidate their status as distinct species. This reading supports the *Committee Member's* position (listing), not the taxonomist's.

  4.  **Claim: "Natural populations" includes contact zones produced by climate-driven range expansion."**
      *   **Status:** *Platitude.* Range shifts driven by broad climatic trends are generally considered natural processes in biogeography.
      *   **Evidence:** Correlation of range shift with regional temperature/precipitation trends absent direct human translocation.
      *   **Delivers Taxonomist's Conclusion?** Yes. If the contact is natural, the observed hybridization counts against species distinctness under the Biological Species Concept (BSC).

  5.  **Claim: "Reproductively isolated" requires the absolute absence of gene flow."**
      *   **Status:** *False.* Few recognized biological species exhibit zero gene flow; hybrid zones are common between distinct species.
      *   **Evidence:** Genetic analysis of recognized species pairs showing low-level introgression.
      *   **Delivers Taxonomist's Conclusion?** Yes, but relies on a false premise. If the taxonomist argues that *any* hybridization negates isolation, he is using a biologically unrealistic standard.

  6.  **Claim: "Reproductively isolated" means "gene flow is sufficiently reduced to maintain distinct evolutionary trajectories."**
      *   **Status:** *Substantive and Defensible Thesis.* This allows for limited hybridization (e.g., in a tension zone) without collapsing two species into one.
      *   **Evidence:** Genomic clines showing steep transitions and selection against hybrids outside the contact zone; maintenance of distinct morphological characters outside the hybrid zone.
      *   **Delivers Taxonomist's Conclusion?** No. This reading allows for the possibility that the salamanders are distinct species *despite* hybridization, supporting the Committee Member's view.

  7.  **Claim: "Reproductively isolated" refers to intrinsic barriers (genetic/behavioral) rather than extrinsic barriers (distance)."**
      *   **Status:** *Substantive and Defensible Thesis.* Isolation must be a property of the organisms, not their geography.
      *   **Evidence:** Reciprocal transplant experiments or mate-choice trials in neutral environments.
      *   **Delivers Taxonomist's Conclusion?** Ambiguous. If the only barrier preventing total fusion is distance (extrinsic), they are one species. If there are intrinsic barriers limiting the hybrid zone width, they may be two.

  8.  **Claim: The sentence functions as a strict definition supplying necessary and sufficient conditions.**
      *   **Status:** *Substantive Thesis (Methodological).* This treats the BSC as a logical rule rather than a heuristic.
      *   **Evidence:** N/A (Philosophical stance).
      *   **Delivers Taxonomist's Conclusion?** Yes. The taxonomist's remark ("there is nothing left to decide") implies that satisfying the definition logically precludes listing.

  9.  **Claim: The sentence functions as a claim about which properties make populations independent evolutionary units.**
      *   **Status:** *Substantive Thesis (Theoretical).* This aligns closer to the Phylogenetic Species Concept (PSC) used by the Committee Member, focusing on lineage independence rather than interbreeding.
      *   **Evidence:** Fixed character differences, monophyly in gene trees.
      *   **Delivers Taxonomist's Conclusion?** No. This supports the Committee Member's argument that diagnosability equals species status, regardless of hybridization.

  10. **Synthesis and Recommendation Regarding the Petition.**
      *   **Taxonomist's Required Reading:** To reach his conclusion, the taxonomist requires Claims 4, 5, and 8 (Contact is natural; *Any* hybridization negates isolation; BSC is a strict definition).
      *   **Do Salamanders Satisfy This?** They satisfy "Actually interbreeding" and likely "Natural" (unless anthropogenic cause is proven). They do *not* satisfy Claim 5 (Absolute isolation is false biologically), but they satisfy the taxonomist's *interpretation* of it.
      *   **Nature of Disagreement:** The taxonomist and Committee Member are not merely using one word in two senses; they are applying two incompatible operational frameworks (BSC vs. PSC). The BSC prioritizes *process* (gene flow); the PSC prioritizes *pattern* (diagnosability).
      *   **Procedural Implication:** Clarifying terms does not settle the petition; it relocates the decision. The Committee must determine whether the Statute's use of "species" mandates the Biological Species Concept (favoring the taxonomist/no listing) or allows for the Phylogenetic Species Concept (favoring the member/listing). If the Statute is silent, the Committee must vote on which conceptual framework governs state listings.

  **Recommendation:** The minutes should record that the petition is tabled not for lack of biological data, but for lack of policy guidance on which Species Concept governs the Statute. A policy vote is required before biological evidence can be weighed.
