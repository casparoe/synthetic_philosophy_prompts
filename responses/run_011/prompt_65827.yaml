answer: |-
  The residue is not a defect in your vocabulary but evidence that anti-Humeans are reifying an epistemic constraint—stable generalization—into an ontological engine that your mathematics deliberately excludes.

  ### 1. The Humean Translation (Lewis's Best System Account)

  **The Mosaic:** In Lewis's metaphysics, the mosaic is the totality of local particular facts across all space-time. In your vocabulary, this is not the training dataset (which is a sample), but the **true population distribution support over the infinite horizon**. It is the complete realization of the stochastic process $P(X_{1:\infty})$. You never see the mosaic; you only see empirical samples (sensor logs).

  **The Best System:** This is the **selected model class and parameter set** that minimizes a structural risk functional. It is not merely the model with the lowest training loss (which overfits the mosaic), but the model that optimizes the trade-off between fit and complexity over the whole mosaic.

  **Simplicity vs. Strength:** This maps directly to **Minimum Description Length (MDL)** or **Information Criteria (AIC/BIC)**.
  *   *Strength* is the likelihood term (how well the model compresses the data/log-loss).
  *   *Simplicity* is the penalty term (parameter count, VC dimension, or norm constraints).
  *   The "Best System" is the model $\hat{f}$ that minimizes $Loss(Data|f) + \lambda \cdot Complexity(f)$.
  *   *Crucial Note:* For the Humean, there is no "true model" hidden behind the data. The Best System *is* the law. If the mosaic changes (e.g., a massive solar flare alters heating dynamics globally), the Best System changes. There is no underlying mechanism that stayed the same; the laws supervene on the facts.

  **Identifiability & Supervenience:** If the mosaic does not contain enough variation to distinguish between two model classes (unidentifiability), the Humean says there is no fact of the matter about which law is true. The "law" is whichever systemization wins the simplicity/strength balance given the available mosaic. If the data is ambiguous, the law is ambiguous.

  ### 2. The Anti-Humean Translation (Necessitarianism)

  **Necessitation:** This is the claim that there exists a **structural causal model (SCM)** where the parameters are fixed constants independent of the data realization. The equations $Y := f(X) + \epsilon$ are not summaries; they are **generative mechanisms**. In estimation terms, this is the assumption that the **loss landscape has a unique global minimum corresponding to physical reality**, regardless of whether your data sample finds it.

  **Governance:** This is the claim that the model **causes the data**, not vice versa. In your workflow, you minimize loss to find parameters. The Anti-Humean says the parameters exist *prior* to the minimization and constrain the data generation. This reverses the direction of fit: you are not compressing the mosaic; you are recovering the generator.

  **Counterfactuals & Intervention:** Anti-Humeans argue laws support counterfactuals ("If I had turned the valve, pressure *would* have risen"). In estimation, this maps to **invariance under intervention** (Pearl's $do$-operator). A model supports counterfactuals only if its parameters are **stable under distributional shift** induced by interventions. If your fitted model fails when you change the setpoint (OOD generalization failure), the Anti-Humean says you found a correlation, not a law.

  **Locality Objection:** The Humean worry that "changing a distant fact changes the laws" maps to **model selection instability**. If a single outlier in the sensor data causes your BIC criterion to switch from a linear to a nonlinear model class, your "laws" are hypersensitive to local particular facts. The Anti-Humean insists the true model class should be robust to noise in the mosaic (regularization should not just be a trick, but a reflection of underlying stability).

  ### 3. Residue Report

  **Clean Maps:**
  *   **Simplicity/Strength $\leftrightarrow$ Regularization/Model Selection:** This is isomorphic. MDL is practically identical to BSA.
  *   **Mosaic $\leftrightarrow$ Population Distribution:** Conceptually sound, though you only access it via samples.
  *   **Counterfactuals $\leftrightarrow$ Invariance:** If a model holds under $do(X)$, it supports the counterfactuals required by both sides.

  **Distorted Maps (Flagged Fudges):**
  *   **"Best" System $\leftrightarrow$ Selected Model:** *Fudge.* Lewis's "Best" is objective (God's eye view of the whole mosaic). Your "Selected" is epistemic (based on finite samples + inductive bias). You are mapping an ontological claim (what the laws *are*) to an epistemological procedure (how we *find* them). The Humean claims the Best System *exists* even if you can't compute it; your vocabulary only contains the estimator $\hat{f}$.
  *   **Necessitation $\leftrightarrow$ Identifiability:** *Fudge.* Identifiability means parameters are uniquely determined by the distribution. Necessitation means the parameters *force* the distribution. You can have identifiability without necessitation (a perfect fit that is still just a summary). Equating them smuggles ontology into linear algebra.

  **Unmappable Concepts (The Residue):**
  *   **Governance:** There is no operator in estimation theory for "makes happen." Your loss functions measure discrepancy, not production. You can write $Y = f(X)$, but the equals sign denotes equivalence or assignment, not ontological grounding. To say the equation *governs* the data is to add a modal operator $\Box$ that does not exist in your calculus.
  *   **Metaphysical Necessity:** You can test for stability (invariance), but you cannot test for necessity. You can verify that a parameter held steady across 10 interventions, but you cannot verify it *must* hold steady in the 11th. The Anti-Humean claim is about the 11th case being *bound* by the previous 10. Your vocabulary handles this as **inductive bias** or **prior belief**, not as a feature of the world.
  *   **The "Argument with Engineers":** When the engineer says, "That's just a fit, not the physics," they are invoking the unmappable residue. They are claiming there is a distinction between *predictive adequacy* (Humean law) and *mechanistic truth* (Anti-Humean law). Your math collapses this distinction into generalization error. If it predicts OOD, it's "physics" to you; if it fails, it's "noise." The engineer wants a guarantee of *why* it predicts, which is outside the loss function.

  ### 4. Hypothesis Test: Is Governing Just Invariance-under-Intervention?

  **Verdict:** This is a **bait-and-switch** that trades metaphysical necessity for causal stability, though it is the only switch worth making.

  **Reasoning:**
  1.  **The Trade:** "Invariance-under-intervention" is an empirical property of a model relative to a set of manipulations. "Governing" is an ontological property of the world. If you define law as "that which remains invariant," you have naturalized the concept (à la Woodward), but you have stripped the Anti-Humean of their core claim: that there is a *reason* why it remains invariant.
  2.  **The Bait:** The Anti-Humean wants invariance *because* of governance. They argue: "It stays invariant *because* it is a law." Your hypothesis flips this: "It is a law *because* it stays invariant."
  3.  **The Switch:** In estimation theory, invariance is assumed via **structural assumptions** (e.g., assuming the mechanism $f$ is independent of the noise distribution $P(\epsilon)$). This is an **identification assumption**, not a discovered fact. You cannot estimate invariance without already assuming some things are invariant (the "causal sufficiency" or "modularity" assumption).
  4.  **Conclusion:** Your hypothesis works *pragmatically*. If a parameter is invariant under interventions, you treat it as a law. But it fails *metaphysically*. It does not capture the "necessitation" relation. It captures the *signature* of governance without the *engine*.

  **Strict Assessment:**
  If you accept "Governing = Invariance," you have become a Humean who cares about causal structure (a Salmon/Dowe process theorist or a Woodward interventionist). You have not saved Anti-Humeanism. You have translated their metaphysical posit into a testable statistical constraint. The "residue" you feel when arguing with engineers is the gap between *stable prediction* (which you can prove) and *mechanistic truth* (which you cannot). The engineers are demanding Anti-Humean guarantees from Humean tools. Your math cannot give them that; it can only offer consistency proofs and generalization bounds. The "necessity" they want is a prior, not a posterior.
