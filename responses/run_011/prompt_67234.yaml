  *Wait, constraint says:* "free-riding genuinely pays less than committing."
  *Okay:* Committing (and winning) = +20. Not committing = 0. Committing (and losing) = -20.
  *If Group 2 is 100% sure, they commit.*
  *If Group 1 is 50% sure, they might not.*
  *To ensure Group 1 feels the cost:* Make the baseline credit dependent on ending points.
  *Okay, I will set the payoff structure carefully in the Rules section.*

