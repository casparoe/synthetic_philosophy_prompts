answer: |-
  ### Brainstorming & Design Logic

  **The Core Difficulty:**
  The hardest feature to stage is the *phenomenological permissibility* of the circular move. In the abstract, "using a source to verify itself" sounds obviously bad. In practice, we do it constantly (checking a clock by looking at the clock). The activity must make the move feel like *standard data logging* rather than *logical fallacy*. If the instruction feels like "lie for me," students will rebel. It must feel like "proceed with available information."

  **Candidate Mechanisms:**
  1.  **The Digital Black Box:** A laptop runs a script that outputs "True/False." Students compare output to a "truth key."
      *   *Rejection:* Violates Constraint 2 (no computers). Also, code feels auditable; students might demand to see the source.
  2.  **The Human Oracle:** The facilitator acts as the device, whispering answers.
      *   *Rejection:* Too interpersonal. Students will look for facial cues or tone, introducing confounding variables (trust in professor vs. trust in device).
  3.  **The Sealed Packet Deck:** Each student gets a deck of 10 folded cards. Outside = Reading. Inside = Fact.
      *   *Selection:* This is the winner. It is physical, cheap, and allows for a hard physical barrier (the fold) between Reading and Fact. It allows me to pre-load the "Fault" (Rounds 6-10 have mismatched insides) without complex manipulation during class.

  **Why the Packet Deck Wins:**
  It isolates the *epistemic access*. Group 1 breaks the seal (independent access). Group 2 is instructed not to break the seal (no independent access). The instruction for Group 2 ("If seal is intact, Outside = Fact for logging purposes") encodes the bootstrapping rule as a bureaucratic necessity, not a logical argument. This bypasses their skepticism.

  ---

  ### Materials List

  **Quantities for 14 Students:**
  *   **14 "Calibration Packets":** Each packet contains 10 folded index cards (Rounds 1–10).
      *   *Construction:* Fold a 4x6 index card in half.
      *   *Exterior (Visible):* Printed text: "DEVICE READING: [COLOR]".
      *   *Interior (Hidden):* Handwritten text: "ACTUAL FACT: [COLOR]".
      *   *Rounds 1–5 (All Packets):* Exterior and Interior match (e.g., Red/Red).
      *   *Rounds 6–10 (All Packets):* Exterior and Interior *mismatch* (e.g., Exterior: Red, Interior: Black).
  *   **14 Ledgers:** Single sheet of paper, printed with the table below.
  *   **2 Sets of Instruction Cards:**
      *   *Set A (Auditors - 7 students):* "You are permitted to unfold cards to verify Fact."
      *   *Set B (Calibrators - 7 students):* "To maintain calibration integrity, DO NOT unfold cards. Record Exterior Reading as Fact."
  *   **14 Pens.**
  *   **Whiteboard:** For tracking aggregate points (optional, but recommended for pressure).
  *   **Snack/Tokens:** A bowl of chocolates or coins representing "Epistemic Credits" (EC). 1 EC = 1 point.

  **Ledger Template:**

  | Round | Device Reading (Exterior) | Actual Fact (Interior or Inferred) | Match? (Y/N) | Cumulative Accuracy |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | | | | |
  | ... | | | | |
  | 10 | | | | |

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  *   **00:00 – 00:05:** **Distribution & Seating.** Randomly hand out Packets and Instruction Cards (Set A or Set B). Do not explain the difference. Seat Set A on Left, Set B on Right.
  *   **00:05 – 00:10:** **The Setup.** Read the *Facilitator Script (Setup)*. Emphasize the goal: "Build a track record."
  *   **00:10 – 00:30:** **Data Collection (Rounds 1–10).** Students work through the deck at their own pace. Circulate. Ensure Set B is not unfolding cards. If a Set B student asks, "Should I check?" reply: "Follow your Instruction Card."
  *   **00:30 – 00:40:** **The Commitment.** Students calculate Cumulative Accuracy. They must write "RELIABLE" or "UNRELIABLE" at the bottom of the ledger.
  *   **00:40 – 00:50:** **The Wager.** Explain the betting rules. Students write their wager (All-in or Fold). Collect wagers.
  *   **00:50 – 00:55:** **The Reveal.** Instruct Set B to unfold Rounds 6–10. Watch the realization.
  *   **00:55 – 01:10:** **The Debrief.** Map the activity to the philosophical argument. (See Debrief Section).
  *   **01:10 – 01:15:** **Cleanup & Payout.** Distribute snacks/credits based on final scores.

  ---

  ### Rules & Payoff Structure

  **Starting Endowment:** Every student starts with **100 Epistemic Credits (EC)**.

  **Data Collection Costs:**
  *   **Set A (Auditors):** Unfolding a card (Spot Check) costs **2 EC** per card. They *must* pay to see the Fact.
  *   **Set B (Calibrators):** Unfolding is forbidden. Cost is 0 EC.

  **Scoring the Ledger:**
  *   For every "Match (Y)" recorded: **+1 EC**.
  *   For every "Match (N)" recorded: **0 EC**.
  *   *Note:* This incentivizes finding matches, but the Wager is where the real risk lies.

  **The Final Wager (Round 11):**
  *   **The Setup:** "We will run one final round. You do not get a new card. You must predict if the Device would have matched on an 11th card."
  *   **The Commitment:** You must mark "RELIABLE" or "UNRELIABLE" on your ledger.
  *   **The Bet:**
      *   **Option 1 (Commit):** Wager **40 EC**.
          *   If you marked RELIABLE and the Device *is* Reliable (defined as >80% accuracy): You win **+40 EC**.
          *   If you marked RELIABLE and the Device is *Unreliable*: You lose **-40 EC**.
          *   (If you mark UNRELIABLE, the payoff is reversed, but practically no one will do this if they think it's unreliable).
      *   **Option 2 (Fold):** Wager **0 EC**.
          *   Penalty for non-participation: **-10 EC** (Administrative fee).
  *   **Why this works:** Folding guarantees a loss of 10 EC. Committing offers a gain of 40 EC. A student who believes their accuracy log (Set B: 100%) will eagerly commit. A student who saw errors (Set A: 50%) will hesitate, but the folding penalty forces them to choose a side.

  **Segregation:**
  *   Students are instructed not to speak to the other side of the room until the Reveal.
  *   Facilitator monitors for cross-talk.

  ---

  ### Facilitator Script

  **Setup (Minute 05):**
  "Good morning. On your desk is a calibration packet and a ledger. You are testing a new perceptual device. Your goal is to determine if the device is reliable.
  "Inside the packet are ten rounds. For each round, the exterior of the card shows what the Device *says*. The interior shows what is *true*.
  "Your job is to fill out the ledger. Record the Reading. Record the Fact. Mark if they Match.
  "Read your Instruction Card now. It tells you how you are allowed to access the Fact. Follow it strictly.
  "You begin with 100 Credits. Checks may cost credits. Matches earn credits. At the end, you will wager on the device's reliability. Begin Round 1."

  **Lines You Must NOT Say:**
  *   "This is about circularity."
  *   "Don't trust the device."
  *   "You are assuming what you need to prove."
  *   "Reliabilism."
  *   "Bootstrapping."
  *   "Justification."
  *   "One group is being tricked."

  **The Reveal (Minute 50):**
  "Stop. Put your pens down.
  "Set A (Auditors): Keep your cards as they are.
  "Set B (Calibrators): I need you to unfold cards 6 through 10 now. Look at the Interior Fact.
  "Compare it to what you wrote in your 'Actual Fact' column.
  "Look at your 'Match' column.
  "Set B: How many of you have 10 out of 10 matches?
  "Set B: How many of those matches in rounds 6 through 10 were actually errors?
  "Keep your hand up if your ledger claims the device was right, but the card shows it was wrong."

  ---

  ### Debrief: Mapping the Experience to the Argument

  **1. The Move from Say-So to Fact (The Bootstrapping Step)**
  *   *In Game:* Set B Instruction: "Record Exterior Reading as Fact."
  *   *In Argument:* This is the move from "The gauge reads Red" to "The table is Red."
  *   *Feeling:* Ask Set B: "Did this feel wrong at the time?" Most will say "No, I was following the protocol." This replicates the *intuitive permissibility* of single-source justification.

  **2. The Move from Match to Reliability (Induction)**
  *   *In Game:* The "Cumulative Accuracy" column.
  *   *In Argument:* This is the inductive leap. "It was right 10 times, so it is reliable."
  *   *Feeling:* Set B felt confident betting 40 EC. Why? Because their data said 100%. The data was generated by the device itself.

  **3. The Hidden Fault (The Skeptical Scenario)**
  *   *In Game:* Rounds 6–10 mismatches.
  *   *In Argument:* This represents the possibility that the source is systematically flawed in a way the source cannot detect.
  *   *Impact:* Set B's confidence was not just lucky; it was *structurally insulated* from error. Their method *could not* have detected the fault.

  **4. The Principle Needed to Block This**
  *   To stop Set B's reasoning, you need a **No-Self-Support Principle**: *A source cannot provide the justification for its own reliability.*
  *   *The Cost:* Ask the room: "How do you know your eyes are working?" You look at the world. You use your eyes. If we ban Set B's move, do we ban ordinary perception?
  *   *Distinction:*
      *   **Target 1: Process Reliabilism.** (The view that knowledge is belief produced by a reliable process). The problem: Reliabilism seems to allow this track-record construction. If the process *is* reliable, the bootstrapping yields true belief. Why isn't it knowledge?
      *   **Target 2: Basic Knowledge.** (The view that some beliefs are justified without prior justification). The problem: If I can know "Table is Red" basically, can I use that to know "Gauge is Reliable"?
  *   *This Activity:* Instantiates the **Reliabilist/Track-Record** version. You built a track record.
  *   *10-Minute Variant for Basic Knowledge:* Remove the ledger. Give one card. Ask: "Do you know the Fact?" If they say "Yes" (based on Reading), ask: "Do you know the Reader is reliable?" If they say "Yes" based on the single card, they have granted Basic Knowledge that entails Reliability.

  ---

  ### Failure Analysis: Candid Risks

  **1. The "Gotcha" Student (Minute 4)**
  *   *Symptom:* A student raises their hand and says, "This is bootstrapping. We're just writing down what the card says."
  *   *Fix:* Do not confirm. Say: "You are testing the protocol. Please complete the log as instructed so we have data to analyze." If they refuse, give them a Set A packet (let them check). Their skepticism protects them; let the others learn from the experience.

  **2. The Refusal to Wager**
  *   *Symptom:* Set B realizes mid-bet that something is off and tries to Fold to avoid the -40 risk.
  *   *Fix:* The -10 Fold Penalty is designed to make this painful. If they still Fold, highlight it in debrief: "You sensed the instability. Why? Was it the instruction or the feeling?" This is actually a *successful* outcome (they detected the epistemic unease).

  **3. Cross-Contamination**
  *   *Symptom:* Set A tells Set B "Don't trust it!"
  *   *Fix:* Physical separation. If it happens, acknowledge it: "Information leaked. But ask Set B: Before they spoke, did *you* doubt your ledger?" Keep the focus on the pre-leak confidence.

  ---

  ### Limitations: What This Cannot Do

  **1. The "True Belief" Problem**
  *   *Limitation:* In the game, Set B ends up with *false* beliefs about the device's reliability (they think it's 100%, it's 50%).
  *   *Philosophical Gap:* The real Bootstrapping Problem is scarier. It argues that even if the device *is* reliable, and you end up with *true* belief, you *still* don't have knowledge/justification.
  *   *Facilitator Note:* You must supply this verbally. "Imagine Rounds 6-10 *were* matches. You still used the device to prove the device. The error I hid shows the danger, but the philosophical problem exists even if the device is perfect."

  **2. Performed Confidence**
  *   *Limitation:* Students know this is a class. Their confidence is partly "playing along."
  *   *Honest Note:* The wager (40 EC) is designed to pierce this. When real points (snacks/credit) are on the line, the hesitation is usually genuine. If they treat it as a joke, the debrief must work harder to ask: "If this were a medical test, would you follow the same logging rules?"

  **3. The "Instruction Card" Shield**
  *   *Limitation:* Students might blame the Instruction Card ("You told me to do it!") rather than their own epistemic agency.
  *   *Facilitator Note:* In debrief, emphasize: "The card gave you permission, but *you* turned the permission into a conclusion. You wrote 'Reliable.' The card didn't force that wager."
