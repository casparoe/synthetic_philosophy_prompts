prompt: |-
  I'm writing my comps on social ontology and I want a story I can hand to first-years, because the Lewis material goes in one ear and out the other when it's stated abstractly. Could you write me a short story, maybe 1500 words, about a small isolated community — research station, fishing camp, whatever you like — that has to settle on some utterly arbitrary regularity, one where two options are exactly as good as each other and nobody has the standing to decide. Not which side of the road to drive on and not which language to speak; pick something mundane and slightly weird.

  What I actually want dramatised is three moments. First, the pre-convergence mess: nobody knows what to expect of anybody, so the coorindation problem doesn't solve, there are false starts, and the tie ends up broken by something trivial — somebody does it once for reasons entirely of their own. Second, the point where everyone knows that everyone knows, and matching stops being a gamble. Third, and this is the part I care most about: years later the original problem has simply evaporated, maybe because of some new bit of kit that makes either option costless, and yet the regularity is still there, and now people punish anyone who breaks it, and a character has come to think it's correct rather than merely convenient. I want that belief to look silly and, in some practical sense, defensible at the same time — don't settle it for me in the narration.

  After the story, give me a JSON object with these fields: "regularity" (what they settle on), "coordination_problem" (what goes wrong when people mismatch), "rival_equilibrium" (the option that would have worked just as well), "salience_event" (the accident that broke the tie), "false_starts" (array of strings), "common_knowledge_route" (how it became mutually known), "problem_evaporates" (what changed), "punishment" (how deviants get treated afterwards), "objectivist" (the character who thinks it's objectively right, plus the strongest thing you can say for them). A sentence or two per field, max.
