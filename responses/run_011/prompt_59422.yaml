answer: |-
  The Antarctic station sat on a shelf of ice so remote the satellites barely glanced off it. Inside Module Four, the galley hummed with the low vibration of the generators, a sound that had gotten into the marrow of everyone who wintered there. The trouble was the compactor. It was a stainless-steel box built into the counter, designed to crush waste before incineration. The lid, however, was a manual affair. It could be operated in two ways: you could lift the handle straight up (the Flip) or you could shove it horizontally to the left (the Slide). Mechanically, both disengaged the lock equally well. Both required the same force. Both were perfectly balanced.

  In the first month, chaos reigned.

  Novak was the first to arrive at the bin that Tuesday. He lifted the handle straight up. The latch clicked, the lid rose, he dumped his tray scraps, and he closed it by dropping it. Ten minutes later, Chen arrived. Chen had been taught by the previous winterer, who preferred the Slide. Chen shoved the handle left. It didn't move. Chen shoved harder. The mechanism groaned. Novak, watching from the table, frowned. "You're binding the rails," Novak said. "You have to lift."

  "I was told to slide," Chen replied, wrenching the handle. The metal shrieked. The latch didn't release. Chen gave up, leaving the bin locked, and walked away.

  For three weeks, this was the rhythm of the galley. Sometimes it was Flip, sometimes Slide. Sometimes one person would Flip, and the next person, finding it resistant, would assume it was already unlocked and try to Slide, jamming the cross-beam. The bin jammed four times in five days. The station mechanic had to come down with lubricant and a pry bar, cursing the cheap manufacturing. There was no rule, only preference, and preference was collision. Nobody had the authority to mandate a method; the station manager believed in flat hierarchy. The coordination problem was pure friction. Everyone wanted the bin open; nobody knew how to expect the others to open it.

  The tie broke on a Thursday during a blizzard. The station shook violently with a gust of wind. Novak was rushing to the bin, holding a scalding pot of coffee in one hand and a tray in the other. He reached for the handle to Flip it, but a sudden turbulence knocked him sideways. His elbow jerked. Instead of lifting, his hand slipped and shoved the handle hard to the left.

  It slid. Smoothly.

  Novak blinked, surprised. He dumped the grounds. He slid it back. It clicked. He didn't think much of it, except that the slip had felt easier than the lift, mostly because he was already leaning that way. But Chen saw it. Chen saw Novak Slide. Chen saw that the bin did not jam.

  The next morning, Chen Slid. Novak saw Chen Slide. Novak realized Chen had seen him Slide the day before. Novak Slid again. By lunch, the third winterer, Aris, walked in. He saw Novak Slide. He saw Chen Slide. He saw the bin open without a shriek. Aris Slid.

  Within forty-eight hours, the knowledge had circled the module. It wasn't that anyone announced it. It was that everyone walked into the galley and saw the handle positioned horizontally, ready for a Slide. To Flip it now would require resetting the handle to vertical first, an extra, unnecessary motion. The regularity had crystallized. It was no longer a gamble. You knew what to do, you knew they knew what to do, and you knew they knew you knew. The bin never jammed again.

  Ten years later, the station was upgraded. Module Four was retrofitted with sensor-activated compactors. The lid vanished entirely. You simply waved your hand over the infrared beam, and the mouth of the machine opened. There was no handle. There was no latch. There was no mechanical reason to move your hand left or up. The coordination problem had evaporated; the technology made the old choice costless.

  And yet, every person who entered the galley moved their hand in a sharp, horizontal slashing motion before waving it over the sensor.

  Aris, now the senior technician, stood by the new unit. He watched a new recruit, a kid named Evans, approach the bin. Evans waved his hand vertically over the sensor. The bin opened. It worked perfectly. There was no jam. There was no resistance.

  Aris cleared his throat. "Do it properly," he said.

  Evans paused. "Sir? It opened."

  "You're disturbing the flow," Aris said. He moved his own hand in the sharp horizontal slash, then waved. "Slide first. Then activate."

  "There's no handle," Evans pointed out. "The sensor is omnidirectional."

  "It's about discipline," Aris said, his voice tight. "The horizontal motion aligns your center of gravity with the unit. It prevents accidental bumps. If you wave vertically, you risk leaning into the sterile field."

  This was nonsense. The sterile field was internal. The sensor was wide-angle. But Aris believed it. He remembered the jams of ten years ago. He remembered the lubricant, the pry bar, the frustration. In his mind, the Slide wasn't just a habit; it was the *correct* way to interact with waste disposal. The Flip was not merely different; it was wrong. It was sloppy. It was dangerous.

  When Evans vertically waved again the next day, Aris didn't speak. He simply logged a minor infraction in the shift report: *Failure to adhere to safety protocol.* Evans was denied access to the premium coffee stores for a week. The community rallied behind Aris. They nodded when he slashed horizontally. They frowned when someone forgot. The original reason—the jamming latch—was gone, buried under layers of new steel and wiring. But the norm remained, hardened into morality. To Slide was to be a member of the station. To Flip (or vertical wave) was to be an outsider who didn't care about the team.

  Novak, passing through on a consultancy visit, watched Evans suffer the coffee ban. He looked at the sensor bin. He looked at Aris, who was passionately explaining the aerodynamics of the hand slash to a captive audience. Novak remembered the sneeze, the slip, the accident that started it all. He opened his mouth to explain that it was just a mistake, a trivial accident fossilized into law.

  He closed his mouth. The station ran smoothly. The bin never jammed. The team was cohesive. If telling them it was arbitrary broke the spell, was it worth it? Novak turned and walked out, slashing his hand horizontally as he passed the sensor, just to keep the peace.

