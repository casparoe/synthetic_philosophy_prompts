  1. A national treasury chooses between building a durable renewable grid (Option A) requiring heavy upfront investment versus extending existing fossil infrastructure (Option B) with minimal initial cost. Both policies secure energy welfare for infinite discrete 25-year generations, ensuring no generation suffers zero welfare. The decision locks in the welfare sequence for all future time without violating rights or causing immediate harm.

  2. Option B yields 100 welfare units every generation $t \ge 0$, while Option A yields 0 at $t=0$ and 101 units for all $t \ge 1$. Constant positive welfare ensures both sums diverge to infinity, yet B leads cumulatively until generation 101, far beyond any 200-year planning horizon.

  3. The cumulative sum for A exceeds B once $101T > 100(T+1)$, which occurs strictly for all generations $T > 100$. Thus, the eventually-ahead rule strictly prefers A because its cumulative welfare stays higher after that crossover point.

  4. At any treasury rate $r \ge 0.02$, Present Value $B = 100(1+r)/r$ exceeds $A = 101/r$ because $100(1+r) > 101$. As $r$ falls toward zero, the ranking flips at exactly $r=0.01$, eventually favoring A once the discounting penalty on delayed benefits vanishes.

  5. The decisive feature is A's initial welfare deficit, which if removed lets A dominate immediately, whereas its presence forces the discounted ranking to flip only when the rate drops below 1%. Defenders argue discounting reflects capital opportunity costs, but this fails here because the comparison concerns final welfare consumption, not investment returns.
