          *   *Status:* Accurate.
      *   *Claim 4:* Middle scale = conjuncture, Part Two: events, wars, diplomacy, decisions of Philip II, battles like Lepanto.
          *   *Fact:* **Wrong.** Part Two is "Collective Destinies and General Trends" (economies, states, societies, cycles). Part Three is "Events, Politics and People" (histoire événementielle). The student has swapped Part 2 and Part 3.
