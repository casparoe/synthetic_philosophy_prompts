prompt: |-
  I'm marking second-year essays for a historiography module ("Doing History: theory and method") and one of them is sitting on my desk undecided. I'd like a second read on it before I commit to a mark. I've got 40 to get through by Friday, so what I need is the point-by-point work done for me, not a general impression.

  The question they were given, one hour, unseen, no notes:

  > Braudel's *The Mediterranean and the Mediterranean World in the Age of Philip II* is organised around three different scales of historical time. Explain the distinction between them and how it shapes the book, and then assess the charge that Braudel's account leaves no room for human agency.

  The mark scheme I'm supposed to use:

  - 70+ — a correct account of the three scales, including what each one is about and how the book's own structure reflects it, plus a verdict on the agency charge that goes beyond "he's a bit determinist but not really"
  - 60–69 — broadly right, some imprecision, evaluation underdeveloped
  - 50–59 — recognisable grasp of the big picture but with substantive errors, or a conclusion that doesn't follow from what came before it
  - below 50 — major confusion about the material

  Here is the whole answer as handed in (about 500 words, which is normal for a one-hour script):

  ---

  Braudel's *The Mediterranean and the Mediterranean World in the Age of Philip II* (published 1947, though he wrote much of it as a prisoner of war in Germany) is the classic statement of the Annales rejection of event-based history. Braudel, together with Marc Bloch, founded the Annales approach in 1929, and in this book he organises his material around three scales of historical time, which he sets out in the preface and then embodies in the structure of the book itself.

  The slowest scale is the longue durée, the subject of Part One: the relationship between men and their environment — mountains and plains, coastlines, the seasonal winds, the distances between ports. Braudel is explicit that this level is almost motionless; the same patterns of transhumance, the same tension between mountain dwellers and plain dwellers, recur across the whole of Mediterranean history. The point of the longue durée is that it looks at a very long stretch of time, centuries rather than decades, so that the historian can see trends a narrative of a single reign would miss.

  The middle scale is the conjuncture, which is what Part Two deals with: events. Wars, diplomacy, the decisions of Philip II and his ministers, battles like Lepanto. The conjuncture is where the historian narrates what actually happened, and it is the scale that most history before the Annales was written at.

  Part Three then deals with the slow movement of economies, societies and civilizations — trade routes, price cycles, the great urban civilisations of the Mediterranean — which is the level Braudel thinks really matters, and the level at which he does most of his own original work.

  On agency: because Braudel holds that individuals are carried along by currents they do not see and could not describe, events being for him mere surface agitation above much deeper movements, he cannot consistently hold that Philip II or Don John of Austria made free choices that changed anything. Part Three of the book is therefore a concession to the old Sorbonne historians he was arguing against rather than something he believed in. His geohistory is deterministic in the way Ratzel's was: the environment sets limits, and what happens inside those limits is more or less forced. So the charge that Braudel leaves no room for agency is broadly correct, though he would have denied it. The best that can be said for him is that he leaves room for collective agency: Mediterranean societies respond over generations to the constraints of the sea, and in that limited sense they make their own history, but not in conditions of their own choosing.

  ---

  What I want from you: check every claim in it, not just the argument's shape. Some of what's wrong in scripts like this is factual and some is conceptual, and some of it is a step that just doesn't follow, and those shouldn't cost the same. Tell me which single problem does the most damage to the mark. Write the comments as though they were going in the margins and the student will actually read them.

  Reply with one JSON object and nothing else, matching this schema:

  - `mark`: integer 0–100
  - `band`: string, one of "70+", "60–69", "50–59", "below 50"
  - `verdict`: string, one or two sentences, neutral enough to go on a coversheet
  - `claims`: array of objects, one per checkable claim in the answer, each with `claim` (short paraphrase of what the student asserts), `status` ("accurate" | "imprecise" | "wrong"), `kind` ("factual" | "conceptual" | "inference"), `diagnosis` (what exactly is off, and what the correct version is), `severity` ("minor" | "moderate" | "major"), `margin_comment` (one sentence addressed to the student)
  - `strengths`: array of strings
  - `biggest_single_problem`: string
  - `what_would_move_it_up_a_band`: string
  - `least_confident_criticism`: string — which of your own diagnoses you're shakiest on and why
  - `strongest_defence_of_the_student`: string — the best case that something you've called wrong is actually defensible on a charitable reading of Braudel
  - `where_my_grading_most_likely_goes_wrong`: string
  - `mark_scheme_complaint`: string or null, if you think one of my bands doesn't fit this script and you've had to bend it

  Be honest about the shakiness bits rather than tidying them away — I'd rather know which of your criticisms to double-check myself than get a confident-looking report I can't rely on.
