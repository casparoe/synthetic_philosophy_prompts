answer: |-
  Here is the diagnosis you asked for, followed by two competing principles, their mapping, and the costs.

  ### The Hard Truth
  You are caught in the **Mere Addition Paradox**. It is logically impossible to hold all of the following simultaneously:
  1.  **Transitivity:** If A $\ge$ B and B $\ge$ C, then A $\ge$ C.
  2.  **Mere Addition is Not Worse:** Adding lives worth living without harming existing people is not bad (Cases 1, 4).
  3.  **The Repugnant Conclusion is False:** A is better than Z (Case 3).
  4.  **Context Sensitivity:** Adding a low-welfare life is okay in a large population but bad in a small elite one (Case 4 vs. 5).

  Any mechanical principle will force you to abandon at least one of these. Below are the two most defensible mechanical principles for a seminar setting.

  ---

  ### Principle 1: High Critical-Level Utilitarianism (H-CLU)
  **The Rule:** An outcome is better than another if and only if the sum of the differences between each person's welfare and a fixed **Critical Level (C)** is greater.
  *   **Constraint:** $C$ is set significantly above "a life worth living" (e.g., at the level of a "very good life" in World A).
  *   **Wronging:** An act is wrong if it chooses an outcome with lower total critical-level value, even if no existing person is harmed (Impersonal Harm).

  #### Mapping to Your Cases
  *   **Case 1 (Mere Addition):** **Worse.** The added ten billion are below $C$. Their negative contribution ($Welfare - C < 0$) lowers the total value.
      *   *Clause:* The Critical Level threshold.
  *   **Case 2 (Levelling):** **Better.** The twenty billion are now at or above $C$. Total value increases massively compared to A+.
      *   *Clause:* Summation of positive differences.
  *   **Case 3 (Repugnant Conclusion):** **A is Better than Z.** Z's population is below $C$. Their existence contributes negative value. A's population contributes positive value.
      *   *Clause:* The Critical Level threshold.
  *   **Case 4 (Add to Huge Pop):** **Bad.** The added person is below $C$. The size of the existing population is irrelevant to the *valence* of the addition, only the sum.
      *   *Clause:* Impersonal Summation.
  *   **Case 5 (Add to Small Elite):** **Bad.** The added person is below $C$.
      *   *Clause:* Impersonal Summation. (Note: This erases your distinction between 4 and 5).
  *   **Case 6 (Ecstasy vs. Trillion):** **Ecstasy Wins.** One life vastly above $C$ can outweigh trillions slightly below $C$ (depending on the gap), or trillions barely above "worth living" but below $C$ contribute negative value.
      *   *Clause:* Magnitude of difference from $C$.
  *   **Case 7 & 8 (Non-Identity):** **Wrong.** The alternative outcome has higher impersonal value. The fact that different people exist is irrelevant.
      *   *Clause:* Impersonal Harm definition.

  #### The Cost
  *   **Abandon Case 1:** You must admit Mere Addition is *worse*, not "not worse."
  *   **Abandon Case 4:** You must admit adding a barely-living person to a huge population is *bad*, not neutral.
  *   **Merge 4 & 5:** You lose the intuition that context (population size) changes the moral valence of the addition. Both are bad.
  *   **Gain:** You save Case 3 (A > Z) and Case 6 (Quality) without epicycles.

  ---

  ### Principle 2: Average Utilitarianism (AU)
  **The Rule:** An outcome is better than another if and only if the **average welfare** per person is higher.
  *   **Wronging:** An act is wrong if it lowers the average welfare of the resulting population, even if no existing person is harmed.

  #### Mapping to Your Cases
  *   **Case 1 (Mere Addition):** **Worse.** Adding people below the current average lowers the average.
      *   *Clause:* Average calculation.
  *   **Case 2 (Levelling):** **Better.** Levelling up the lower group raises the average (assuming the "high" group stays high or the new average is higher than A+'s average).
      *   *Clause:* Average calculation.
  *   **Case 3 (Repugnant Conclusion):** **A is Better than Z.** A's average is "very good." Z's average is "barely worth living."
      *   *Clause:* Average calculation.
  *   **Case 4 (Add to Huge Pop):** **Negligibly Bad.** The average drops, but by a mathematically trivial amount. You can classify this as "Not Bad" for practical purposes.
      *   *Clause:* Magnitude of average change.
  *   **Case 5 (Add to Small Elite):** **Bad.** The average drops significantly.
      *   *Clause:* Magnitude of average change. (Note: This **saves** your distinction between 4 and 5).
  *   **Case 6 (Ecstasy vs. Trillion):** **Trillion Wins.** Unless the ecstatic life is infinitely good, a trillion positive lives will outweigh one.
      *   *Clause:* Summation implicit in average (Total / N). *This is a major failure point for your intuition.*
  *   **Case 7 & 8 (Non-Identity):** **Wrong.** The alternative outcome has a higher average welfare.
      *   *Clause:* Impersonal Average definition.

  #### The Cost
  *   **Abandon Case 1:** Like CLU, you must admit Mere Addition is worse.
  *   **Abandon Case 6:** You must accept that quantity can swamp quality (The "Sadistic Conclusion" risk).
  *   **Keep 4 vs 5:** This is the only principle that mechanically justifies why 5 feels worse than 4 (the denominator effect).

  ---

  ### Application to New Cases (Using H-CLU)
  *I recommend H-CLU for a graduate seminar because it handles the Repugnant Conclusion and Quality/Quantity trade-offs (Case 6) better than AU, which is the standard "fix" in the literature.*

  **(a) Segregated Z vs. Integrated A**
  *   **Verdict:** A is vastly better than Segregated Z.
  *   **Reasoning:** H-CLU is insensitive to segregation or integration. It sums welfare relative to $C$. Since Z's lives are below $C$, they contribute negative value regardless of isolation.
  *   **Implication:** Isolation does not mitigate the Repugnant Conclusion. If the lives are below the critical level, adding them is bad even if they never meet the high-welfare group.

  **(b) Subtracting from Z (Survivors never notice)**
  *   **Verdict:** Better.
  *   **Reasoning:** Removing people below $C$ removes negative value from the sum.
  *   **Existence vs. Removal:** H-CLU is **Impersonal**. It does not matter if they are removed or never existed. The value of the outcome is determined by the set of people who exist in that outcome. "Never existed" is the baseline for comparison.
  *   **Implication:** This bites the "Non-Identity" bullet hard. It implies we have reasons to prefer outcomes where fewer miserable people exist, even if those people never know they were "removed."

  **(c) Adding a trillion animals (barely worth living) to flourishing people**
  *   **Verdict:** Worse (assuming animals count as moral patients).
  *   **Reasoning:** If animals fall below the Critical Level $C$ (set at human "very good life"), their addition subtracts from the total value.
  *   **Implication:** This principle is species-neutral regarding welfare but strict regarding the threshold. If animal lives are "barely worth living," adding them is morally costly, analogous to Case 4.

  ---

  ### Final Recommendation: What to Throw Out

  You asked me to be straight. You cannot keep your verdicts on **Case 1 (Mere Addition)** and **Case 3 (Repugnant Conclusion)**. They are logically incompatible given transitivity.

  **My advice: Abandon Case 1 and the 4/5 distinction.**
  Adopt **High Critical-Level Utilitarianism**.

  **Why?**
  1.  **Case 3 is your anchor.** You said Z is "worse than A, and not just slightly worse." This is the most robust moral intuition in population ethics. CLU secures this.
  2.  **Case 6 is your quality constraint.** You want quality to have lexical force. CLU allows high welfare to outweigh low welfare; Average Utilitarianism does not.
  3.  **The 4/5 distinction is unstable.** Your intuition that adding a happy-ish person is "okay" in a large world but "bad" in a small world is likely a heuristic for Average Utilitarianism, but it collapses under scrutiny. If the life is worth living, why does the *number of strangers* determine if their existence is bad? CLU forces you to admit that adding lives below a high standard is always a loss of value, regardless of the crowd.
  4.  **Case 1 is the weak link.** The intuition that Mere Addition is "not worse" is what drives the paradox. Admitting that adding lives below a high standard *is* worse (even if no one is harmed) is a costly but coherent bullet to bite. It aligns with your verdict on Case 5.

  **The Simple Principle for your Students:**
  > "An outcome is better if it contains more total welfare above a high threshold of sufficiency. Adding lives below this threshold makes an outcome worse, even if those lives are worth living and no one else is harmed."

  **What you lose:**
  *   You lose the "Mere Addition is harmless" intuition (Cases 1 & 4).
  *   You lose the distinction between adding to a small vs. large population (Cases 4 & 5 become identical in valence).
  *   You gain a system that mechanically explains why Z is repugnant, why Quality matters (Case 6), and why Non-Identity choices (7 & 8) are wrong without needing to find a specific victim.
