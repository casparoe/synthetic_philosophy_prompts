  **OmniGlobal Solutions | Employee Handbook | Section 4: Operational Ontology**

  **Frequently Asked Questions: The Free Energy Framework**

  **1. Why am I required to log daily surprise metrics?**
  Surprise is not an emotional state but a mathematical quantity indicating the divergence between your generative model and sensory input. High surprise indicates entropy risk. By logging surprise, you enable the firm to minimize variational free energy. This ensures organizational homeostasis. Please note: unlogged surprise is treated as unmanaged risk.

  **2. Why are the Chief Executive's forecasts never treated as prediction errors?**
  Executive forecasts constitute deep prior preferences. They define the firm's existence rather than describe its current state. Lower-level data updates shallow priors (departmental targets) but cannot update deep priors. If data conflicts with the CEO's forecast, the data is identified as the source of error. This preserves the integrity of the firm's identity.

  **3. Is there a difference between revising the quarterly figures and revising my model of the figures?**
  No. Both are valid strategies for free energy minimization. Perception updates the model to match the world; action changes the world to match the model. Management finds these interventions administratively equivalent. You are encouraged to select the method requiring the least computational cost.

  **4. What is the function of Middle Management?**
  Middle management constitutes the firm's Markov blanket. Their function is to explain away sensory prediction errors using local models. Only residual error that cannot be explained away is forwarded upward. If your manager rejects your report, they have successfully minimized free energy. Do not resubmit.

  **5. Are contractors considered internal states or part of the environment?**
  This depends on whether they share our generative model. If a contractor minimizes the same free energy function, they are internal. If they minimize their own, they are environmental noise. Contracts should specify model alignment. Note: Legal advises against testing this distinction during litigation.

  **6. Why is curiosity budgeted as a line item?**
  Curiosity is active inference driven by epistemic value rather than pragmatic value. It reduces uncertainty about the model parameters. However, exploration trades off against exploitation. You must justify curiosity expenditures against the pursuit of preferred outcomes. Unbudgeted learning is considered drift.

  **7. If the goal is to minimize surprise, why shouldn't I sit in a dark room?**
  Your prior preferences encode states associated with being employed, such as eating and commuting. Sitting in a dark room violates these deep priors, generating high expected free energy over long timeframes. You are compelled to act to fulfill preferences for continued existence. This compulsion is not optional.

  **8. Could this policy ever be shown to be wrong?**
  The Free Energy Principle is a necessary condition for any self-organizing system that persists over time. It is not a model that can be falsified, but a description of what systems must do to exist. If the firm persists, the principle holds. If the firm dissolves, the principle no longer applies to it. This ensures the framework is always correct for functioning employees.

  **9. Does this framework apply outside the office?**
  Yes. The same principles account for the canteen's soup cooling, the pension liabilities accruing, and the migratory habits of the local gulls. Universality is a strength, not a bug. You are advised to observe the gulls for best practices in trajectory planning.

  ***

  **GLOSSARY OF TERMS**

  | **Term** | **Definition** |
  | :--- | :--- |
  | **Free Energy** | A variational bound on surprise computed with respect to a generative model. It is *not* the thermodynamic potential (Helmholtz free energy) used in physical chemistry. |
  | **Note** | The mathematical resemblance is more than a pun; both quantities describe systems resisting disorder. However, employees should not attempt to measure organizational entropy in Joules. |

  ***

  **TROUBLESHOOTING: HIGH SURPRISE EVENTS**

  | **Symptom** | **Probable Cause** | **Corrective Action** |
  | :--- | :--- | :--- |
  | **Acute Anxiety** | Prediction error exceeds precision weighting. | Update your model to match the forecast. |
  | **Confusion** | Conflicting priors from multiple managers. | Treat one manager as external noise. |
  | **Stagnation** | Over-minimization of local surprise. | Initiate budgeted curiosity protocol. |
  | **Existential Dread** | Recognition of dark room logic. | Recall prior preferences for salary. |

  ***

  **Welcome to OmniGlobal. By remaining employed, you confirm your adherence to these principles.**
