answer: |-
  There is no single, canonical noun in the literature (like "Gerrymandering" or "Prisoner's Dilemma") that captures this exact configuration of preferences and outcomes. However, the phenomenon is a composite of several well-established concepts in social choice theory, game theory, and political economy.

  The closest technical description is a **Pareto-Inefficient Settlement arising from Double-Peaked Preferences.**

  Below is the carving you requested: the concepts that come close, the specific conditions required for the middle to rank last, the function of the "silence shield," and a proposed term for the phenomenon.

  ### 1. Closest Established Concepts (and where they fall short)

  **A. Double-Peaked Preferences (Social Choice Theory)**
  *   **The Concept:** In standard voting theory, it is assumed that voters have "single-peaked" preferences: they have an ideal point, and utility declines as policy moves away from it in either direction. This guarantees a stable majority outcome (the Median Voter Theorem).
  *   **The Fit:** Your scenario describes **double-peaked preferences**. Each party has two peaks (their own victory and their opponent's victory) and a trough (the compromise) in between.
  *   **Where it falls short:** This describes the *psychology* of the actors, not the *negotiated outcome*. Social choice theory usually predicts that double-peaked preferences lead to instability or cycling (no decision is reached). Your observation is notable because a decision *is* reached and is stable, despite the preferences.

  **B. The Condorcet Loser**
  *   **The Concept:** A candidate or policy that would lose a head-to-head vote against every other available option.
  *   **The Fit:** In your examples, the Compromise is a Condorcet Loser among the set {Side A Wins, Side B Wins, Compromise}. If you could vote between "Compromise" and "Side A Wins," both sides would vote for "Side A Wins" (because Side A prefers winning, and Side B prefers Side A winning to the Compromise).
  *   **Where it falls short:** A Condorcet Loser is typically not selected in a democratic process. Your examples show the Condorcet Loser being *selected* via negotiation. This implies the "votes" (Side A Wins / Side B Wins) were not feasible options on the table, likely due to transaction costs or the threat of the Status Quo.

  **C. The Theory of the Second Best (Welfare Economics)**
  *   **The Concept:** If one optimality condition cannot be met (e.g., Side A cannot win outright), satisfying the remaining conditions (e.g., partial reform/compromise) may not lead to the next-best outcome; it may lead to a outcome worse than doing nothing or letting the "wrong" side win.
  *   **The Fit:** This explains *why* the middle is ranked last. The hybrid system creates distortions (legitimacy + bureaucracy) that neither pure system possesses.
  *   **Where it falls short:** This is an economic diagnostic, not a negotiation term. It explains the utility function but not the social dynamic of why parties sign the deal and then defend it.

  **D. Preference Falsification (Timur Kuran)**
  *   **The Concept:** Individuals publicly support a norm or policy they privately reject, often due to reputational pressure.
  *   **The Fit:** This perfectly explains your "Silence Shield." Parties call the merger a "success" because admitting they prefer the opponent's victory signals weakness or ideological impurity.
  *   **Where it falls short:** This explains the *post-hoc* behavior, not the structural reason the compromise is worse than the extremes.

  ### 2. The Condition: Why the Middle Ranks Last

  For a compromise to be ranked below *both* extremes by *both* parties, a specific condition must be true about how they evaluate the options.

  **In Plain Terms:**
  The compromise must not merely be a dilution of the two extremes; it must be a **hybrid that combines the specific costs of both systems while neutralizing the specific benefits of both.**

  In a standard compromise, I give up some of what I want to get some of what I want. In your scenario, the compromise creates a *new* category of toxicity.
  *   **Example 1 (Licensing):** The Prohibitionist gets the cost of bureaucracy (which they hate) without the benefit of eradication. The Deregulator gets the cost of state legitimacy (which they hate) without the benefit of market freedom. The hybrid creates a "legitimized bureaucracy"—the worst possible entity for both.
  *   **Example 2 (Merger):** Foundation A loses its distinct voice (cost) without gaining the resources of a monopoly (benefit, because the budget is split). Foundation B faces the same. The umbrella body creates competition for attention *inside* the organization, which is more draining than competition *outside* the organization.

  **The Technical Name:**
  This requires **Non-Convex Utility Functions** over the policy space.
  In standard negotiation, the utility curve is concave (the middle is the peak). In your cases, the utility curve is **convex** (the middle is the trough). The "interaction effect" of the two value systems is negative.

  ### 3. The "Silence Shield" Diagnosis

  You asked if the difficulty in objecting belongs to the same phenomenon. It is a **reinforcing mechanism** that stabilizes what would otherwise be an unstable equilibrium.

  *   **The Mechanism:** This is **Pluralistic Ignorance** reinforced by **Reputational Constraints**.
  *   **Why it matters:** If Side A admitted, "I prefer Side B's victory to this Compromise," they would undermine their own legitimacy. It signals that their mission is not distinct enough to warrant independence, or that they lack the confidence to win.
  *   **The Result:** The Compromise becomes **Self-Sealing**. Criticism is disarmed because the only honest criticism ("This is worse than your victory") is politically suicidal. This allows a Pareto-inefficient outcome to persist indefinitely, described as "sensible" precisely because it generates no *visible* opposition, only private resignation.

  ### 4. Does the Diagnosis Change if the Public Benefits?

  Yes. The moral and structural classification shifts depending on who bears the cost.

  *   **Case 1: Bargainers Hate It, Public Hates It.**
      *   **Classification:** **Collusive Stagnation.**
      *   **Dynamic:** The elites protect their own status by avoiding the risk of a clean victory for either side, dumping the inefficiency costs on the public. (e.g., A coalition government that passes no legislation).
  *   **Case 2: Bargainers Hate It, Public Loves It.**
      *   **Classification:** **Paternalistic Stabilization.**
      *   **Dynamic:** The extremists (the bargainers) are radicalized; the moderate public benefits from the dilution. The "Silence Shield" here protects the public from the bargainers' true desires.
      *   **Nuance:** In your examples, the "public" (donors, citizens) seems to be misled or neutral. If the public is actively better off, the compromise is functionally a **Elite Cartel acting as a Buffer.** The organizations absorb the frustration so the ecosystem remains stable.

  ### 5. Distinguishing from Ordinary Compromise

  The line is drawn at the **Ranking of the Opponent's Victory.**

  *   **Ordinary Compromise:**
      *   My Win > Compromise > Your Win.
      *   *Logic:* I accept less than I want to avoid getting nothing (or losing).
  *   **Your Phenomenon:**
      *   My Win > Your Win > Compromise.
      *   *Logic:* I accept the Compromise only because the Status Quo (No Deal) is worse than the Compromise. But if forced to choose between a Dictatorship (yours) and this Compromise, I would choose the Dictatorship.

  This is the critical carve. In ordinary compromise, the middle is a **shelter**. In your phenomenon, the middle is a **trap** that is merely preferable to the *fight*, but not to the *loss*.

  ### 6. Proposed Terminology

  Since no single term exists, I propose labeling this **"The Double-Peaked Compromise."**

  **Definition:** A negotiated settlement in which all participating parties rank the agreed-upon outcome lower than either party's unilateral victory, due to non-convex utility functions where the hybridization of systems creates unique costs absent in the pure forms.

  **Boundary Cases (What falls just outside):**
  *   **Logrolling:** "I vote for your bill, you vote for mine." Here, both get their *peaks* on different issues. In the Double-Peaked Compromise, both get their *trough* on the same issue.
  *   **Ambiguous Agreement:** Parties sign because they interpret the text differently (each thinks they won). In the Double-Peaked Compromise, the parties are "clear-eyed" (as you noted); they know exactly what they are signing and that it disadvantages them.
  *   **Prisoner's Dilemma:** Both defect and get a bad outcome. But in PD, they *could* have cooperated for a good outcome. Here, the "cooperation" (Compromise) *is* the bad outcome; the "defection" (One side winning) would have been better for *both* than the cooperation.

  **Summary:** You have identified a **Pareto-Inefficient Equilibrium** sustained by **Preference Falsification**, driven by **Double-Peaked Preferences**. It is a stable settlement that all parties agree is worse than the alternative of losing, but which they accept to avoid the cost of fighting.
