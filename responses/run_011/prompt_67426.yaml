answer: |-
  **Project Title:** Graded Normative Autonomy: Reframing the Original/Derived Intentionality Dispute

  **Principal Investigator:** [Your Name]
  **Duration:** 3 Months
  **Requested Support:** Internal Research Grant

  **1. Research Question and Claim**
  The standard dispute over intentionality asks whether content is intrinsic to a state (Searle) or relative to an interpretive stance (Dennett). Both sides assume that if content exists, it is determinate. This project proposes that the impasse arises from this shared assumption. The live question is not *where* content comes from, but *who or what fixes the standard against which a state can be wrong*.

  **Specific Claim:** I request funding to test the hypothesis that "Original Intentionality" is not a binary property but tracks the **Autonomy of the Semantic Norm (ASN)**. ASN is the degree to which a system generates its own standards of correctness internally, rather than having them imposed externally.

  **Success Criteria:**
  *   **Yes:** The ASN gradient predicts intuitive attributions of intentionality across the proposed case ladder better than the Intrinsic/Extrinsic binary, particularly in edge cases involving adaptive AI.
  *   **No:** ASN collapses into mere complexity, fails to distinguish the critical cases, or proves indistinguishable from existing teleosemantic accounts.

  **2. Theoretical Gap**
  Searle's Chinese Room argues that syntax manipulation lacks intrinsic aboutness; Dennett's Two-Bitser argues that aboutness is always stance-relative. Both assume determinacy. My proposal shifts the locus to *normativity*.

  Naturalist middle routes (e.g., teleosemantics, information theory) do not absorb this proposal. Teleosemantics grounds content in evolutionary history or proper function. However, a system can have a proper function (e.g., a thermostat) without having the capacity to *revise* the norm defining that function. Naturalism typically asks, "What are the conditions for content?" This project asks, "What is the architectural source of the error signal?" If the error signal is externally supplied (by a designer or loss function), ASN is low. If the system generates the error signal via internal homeostatic or predictive modeling, ASN is high. This distinction remains live even if one accepts a naturalistic grounding of function.

  **3. Method: The Ladder of Cases**
  I will construct a comparative analysis across five specific systems. For each, I will evaluate the verdicts of Intrinsicism (Searle), Interpretivism (Dennett), and the ASN model.

  1.  **Passive Sensor (Thermometer):** State correlates with temperature.
      *   *Traditional:* No content (Searle); Derived content (Dennett).
      *   *ASN:* Zero. Norm is entirely external (the reader).
  2.  **Feedback Controller (Thermostat):** State drives action to match setpoint.
      *   *Traditional:* Disputed (Simple intentionality vs. None).
      *   *ASN:* Low. Norm (setpoint) is fixed externally. Error is detected, but standard is static.
  3.  **Self-Revising Setpoint (Adaptive Controller):** System adjusts setpoint based on error history.
      *   *Traditional:* Still "derived" (programmed adaptation).
      *   *ASN:* Moderate. The system modifies the standard of correctness, but within meta-constraints.
  4.  **Trained Model (Transformer/LLM):** Internal representations optimized via external loss.
      *   *Traditional:* The battleground. Searle says None; Dennett says Enough.
      *   *ASN:* Low-to-Moderate. During inference, the norm is frozen. During training, the norm (loss function) is external. *Critical Test:* Does the model encode internal consistency checks that function as self-generated norms independent of the loss function?
  5.  **Nonhuman Animal (Homeostatic/Learning):**
      *   *Traditional:* Original intentionality (Biological).
      *   *ASN:* High. Norms are tied to survival conditions the system actively maintains and revises.

  **Critical Rungs:** Rungs 3 and 4 do the heavy lifting. If ASN is valid, the Adaptive Controller should intuitively feel more "agent-like" than the Thermostat, and the Trained Model should be distinguished from the Animal not by "biology" but by the *source of the loss function*. If the Model cannot generate its own loss function, its ASN remains low, regardless of behavioral complexity.

  **4. Objections and Responses**
  *   **Objection 1: ASN is just a count of feedback loops.**
      *   *Response:* A feedback loop stabilizes a variable. Normative autonomy requires the system to represent the *value* of that variable as subject to revision based on internal goals. A double-loop controller is still distinct from a system that negotiates its own goals. ASN tracks the *source* of the goal, not the existence of the loop.
  *   **Objection 2: Correctness is intentional; the account is circular.**
      *   *Response:* I concede partial circularity. However, mapping the *structure* of the norm-generation is explanatory progress even if the concept of "norm" is primitive. We are not defining intentionality out of existence; we are mapping its structural prerequisites.
  *   **Objection 3: This collapses into Dennett's Instrumentalism.**
      *   *Response:* Dennett makes intentionality entirely observer-relative. ASN posits an architectural fact about the system (internal vs. external error generation) that exists independent of the observer. A system with high ASN commands the intentional stance; it does not merely invite it.

  **5. Impact on Systems and Robot Replies**
  The Systems Reply argues that while the man in the Chinese Room doesn't understand Chinese, the *whole system* does. The Robot Reply argues that embedding the system in a body grants content.

  My reframing concedes ground to Searle here. If the "System" or the "Robot" operates solely on code or wiring where the standards of correctness are fixed by the designer (external loss function or hard-coded logic), the ASN remains low. Merely adding a body (Robot Reply) or scaling the program (Systems Reply) does not increase normative autonomy if the system cannot revise its own semantic norms. This proposal vindicates Searle's skepticism regarding *original* intentionality in current AI, but grounds it in normative architecture rather than mysterious biological causation.

  **6. Plan, Deliverables, and Feasibility**

  *   **Month 1: Conceptual Formalization.** Refine the definition of ASN. Map the Traditional vs. ASN verdicts for Rungs 1–3.
  *   **Month 2: AI/ML Collaboration.** Work with committee members from the ML group to analyze internal representations in trained models (Rung 4). Specifically: Can we identify internal mechanisms that function as self-generated error signals distinct from the training loss?
  *   **Month 3: Synthesis and Drafting.** Integrate findings with the Nonhuman Animal case (Rung 5). Draft the paper.

  **Deliverable:** One manuscript suitable for submission to a journal intersecting philosophy of mind and cognitive science (e.g., *Philosophy of Science* or *Minds and Machines*), plus one internal workshop presentation.

  **Failure Conditions:** The project fails if the ASN metric maps perfectly onto "computational complexity" (rendering it redundant) or if the ML analysis shows no structural distinction between external loss and internal consistency checks in modern architectures.

  **Feasibility Assessment:** Three months is aggressive. The conceptual work (Month 1 & 3) is within my control. Month 2 depends on access to model interpretability tools and colleague time. If the ML analysis proves too time-intensive, I will restrict Rung 4 to a theoretical analysis of backpropagation architectures, which is sufficient to test the core philosophical claim. The scope is narrow enough to be completed, provided the ML collaboration remains focused on the specific question of error signal sourcing.
