answer: |-
  **What the theorem does and doesn't buy you**

  The Gibbard–Satterthwaite theorem proves that no rank-order voting system with three or more options is immune to strategic voting. If members can rank candidates, someone can sometimes benefit by lying about their preferences. This is not a flaw in your implementation; it is a mathematical limit. However, the theorem relies on specific assumptions you can change. You can escape it by: (1) limiting choices to two options; (2) using cardinal scores (e.g., 1–5) instead of ranks; (3) introducing randomization; or (4) restricting who can propose options. This procedure does not promise a perfect system. It promises a defensible one. Your goal is not to eliminate strategy—which is impossible—but to make manipulation difficult, obvious, or costly enough that it rarely succeeds. If a rule requires members to act against their own interest to be honest, reject it. If a rule requires a mathematician to explain the winner, reject it.

  **Pre-adoption procedure**

  Before adopting any voting rule, the Elections Subcommittee must complete this checklist. If any step triggers a "STOP," the rule is rejected unless the Council votes to override with a written justification.

  1.  **Define the Objective:** State in one sentence what the election measures (e.g., "Broadest support" vs. "Most passionate support"). If the objective conflicts with the rule (e.g., using Plurality to measure broad support), STOP.
  2.  **Count the Options:** Will there ever be more than two options? If yes, Gibbard–Satterthwaite applies. You must justify why the chosen rule handles strategy better than the status quo.
  3.  **Input Method:** Does the platform support scores (0–5) or only ranks? Score voting reduces strategic incentive compared to ranking. If using ranks, verify the count method (e.g., Instant Runoff) handles "clone" candidates. If the platform cannot execute the count automatically, STOP.
  4.  **Strategy Stress Test:** Simulate a "clone" scenario (two similar candidates vs. one rival) and a "spoiler" scenario (one weak candidate splits the vote). If a voter gains an advantage by ranking a candidate lower than they truly prefer, note this. If the advantage is easy to exploit (e.g., requires only 5% of voters), STOP.
  5.  **Transparency Test:** Can the Chair explain the counting method in under two minutes without using words like "quota," "transfer," or "weighting"? If no, STOP. Members must trust the process without understanding the math.
  6.  **Value Check:** Ask three non-committee members: "Would you feel cheated if a candidate won with 30% of the vote because the rest split?" If yes, Plurality is unacceptable. If the rule requires accepting a tie-breaker that feels like a "small dictator" (e.g., Chair decides ties), confirm this is written in bylaws. If not, STOP.

  **Complaint-triage procedure**

  When a member alleges manipulation, use this filter to determine if an investigation is warranted. Do not investigate mere dissatisfaction.

  1.  **Specificity:** Does the complainant identify the specific rule exploited (e.g., "Vote splitting in Plurality") rather than general suspicion? If no, close the complaint.
  2.  **Counterfactual:** Can the complainant demonstrate that changing *only* their vote (or a small bloc's) would change the outcome? If the margin of victory exceeds the plausible number of strategic voters, close the complaint.
  3.  **Intent vs. Structure:** Distinguish between "people voted strategically" (allowed) and "the rule encouraged strategy" (problematic). If the rule was followed but produced a counter-intuitive result (e.g., a Condorcet loser won), proceed to Step 4. If the rule was violated, refer to Ethics.
  4.  **Remedy:** If the structure is at fault, do not overturn the election. Instead, flag the rule for the Pre-adoption Procedure. Overturning results destroys trust faster than a bad winner.
  5.  **Documentation:** Record the complaint and the triage decision. If three similar complaints arise over two years, trigger an automatic rule review.

  **The three cases**

  **1. President-elect race (Plurality vs. Clones)**
  *Application:* Step 2 (Options >2) and Step 4 (Strategy Test) trigger immediately. Under Plurality, a bloc nominating two near-identical candidates guarantees one splits the vote, allowing a rival with a solid minority to win. This is a known failure mode.
  *Verdict:* **Abandon Plurality.** The procedure dictates a STOP at Step 4. The platform supports scoring. Switch to Score Voting (0–5). It handles clones robustly (voters score both high) and passes the Transparency Test ("highest average wins").
  *Loss:* You lose the simplicity of "one mark per person." You gain resistance to bloc manipulation. The subcommittee must educate members that scoring two allies highly is safe, whereas in Plurality, it is fatal.

  **2. Best-paper prize (Committee of Nine)**
  *Application:* Step 1 (Objective: Quality) and Step 3 (Input). With only nine voters, strategic ranking is easy (burying rivals). However, the domain is restricted (pre-screened finalists).
  *Verdict:* **Keep Ranked, Add Score.** The procedure allows this because the option set is controlled (Step 2 escape hatch). However, Step 4 suggests scores reduce strategy. Since the platform allows it, switch the committee to Score Voting.
  *Loss:* None significant. The committee size is too small for complex statistical manipulation to hide. The main risk is collusion, which voting rules cannot fix. The procedure passes this with a note to rotate committee members to prevent entrenched blocs.

  **3. Bylaw referendum (Council Decoy)**
  *Application:* Step 2 (Options >2) and Step 6 (Value Check). The Council controls the wording. Option C is a decoy to make Option B look moderate against Option A. This is agenda control, not voting strategy.
  *Verdict:* **Suspend Referendum Process.** The procedure fails here. No voting rule fixes agenda manipulation. Step 6 triggers a STOP because members will feel cheated if they discover the decoy. The only fix is removing the Council's power to set wording, which requires a bylaw change you cannot pass via referendum.
  *Loss:* You lose the ability to pass bylaw changes efficiently. You must admit to members: "We cannot guarantee fair referenda until the Council surrenders wording control." This is politically ugly and halts governance.

  **Where the procedure breaks**

  This procedure assumes the Subcommittee can accurately simulate strategy in Step 4. They cannot. Volunteers lack the data to model voter behavior, so the "Strategy Stress Test" is often a guess. It also assumes members answer the "Value Check" honestly; often, they answer based on who is currently winning. Finally, the procedure cannot detect hidden collusion (e.g., private emails coordinating votes). It treats the voting booth as the only arena of strategy, ignoring the campaign trail. In Case 3, the procedure correctly identifies the failure but offers no operational solution, leaving the Secretary with a broken process and no authority to fix it. It gives confident-sounding answers about rule mechanics but cannot adjudicate power dynamics.

  **Confidence Note**

  I am highly confident in the structural logic: Score Voting generally outperforms Plurality regarding clone independence, and agenda control cannot be solved by ballot design. I am least sure about **Step 4 (Strategy Stress Test)** in the Pre-adoption procedure. I claim volunteers can simulate exploitation scenarios, but without historical data or game theory training, they may underestimate how easily a rule can be gamed. They might approve a rule that looks robust in a tabletop exercise but fails with 1,400 diverse actors. This step relies on competence the subcommittee may not possess, potentially giving false confidence to flawed rules.
