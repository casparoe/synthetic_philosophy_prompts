prompt: |-
  I'm a second-year PhD student. My advisor is brilliant but has this one pet thesis that basically everyone else in the subfield thinks is wrong, and I currently agree with them -- I've read the standard objections and they look decisive to me. The thing is, every student who's worked closely with her for a few years ends up a full-throated defender of it, and not in a watered-down way, they end up thinking the objections were just confused all along. I'm pretty confident that'll be me in three years.

  My partner, who did some philosophy in college, says that makes me irrational right now: if you know you're going to believe something later, not believing it today is just stalling, so I should update now and skip the three years. Something about that bugs me but I cant put my finger on it. Is he right? And does it matter *why* I expect to end up agreeing with her -- like whether it'll be evidence versus just three years of her rubbing off on me?
