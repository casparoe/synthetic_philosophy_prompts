          *   Evaluate if the film is aware of the distinction (revising vs. never having seen).
          *   Evaluate if the film offers anything new to the debate compared to the lab case (re-watchability).
          *   **Tone/Style:** Philosophy of Mind unit context, critical analysis (no plot summary), candid verdict on where the reading fails.

  2.  **Understand the Philosophical Framework (Dennett's Color-Phi):**

      *   *The Phenomenon:* Two spots flash in different locations/colors. Subjects see one spot moving and changing color *mid-stream*.
      *   *The Problem:* When did the consciousness of the movement/color change happen?
      *   *Stalinesque:* The brain waits for all data, then constructs the experience *before* presenting it to consciousness (a "theater" with a delay).
      *   *Orwellian:* The brain presents the initial data, then *rewrites the memory* after the fact to fit the new data (a "Ministry of Truth" revision).
      *   *Dennett's Conclusion:* The distinction is spurious. There is no "finish line" in the brain where consciousness happens. It's a "Multiple Drafts" model. The question "When did it *really* happen?" presupposes a Cartesian Theater that doesn't exist.

  3.  **Analyze *Arrival* through this Lens:**

      *   *The Viewer's Experience:* We see the montage. We assume it's memory (past). Later we learn it's prophecy (future).
      *   *The Parallel:*
