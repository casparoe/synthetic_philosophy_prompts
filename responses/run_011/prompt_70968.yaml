          *   *Louise:* She experiences time non-linearly due to Heptapod B. Her "now" includes "later."
      *   *Illumination:*
          *   *Louise's Consciousness:* She doesn't "remember" the future; she experiences it. This challenges the linear "Orwellian/Stalinesque" timeline because the causal order is disrupted.
          *   *The Choice:* Knowing the end (pain) doesn't stop the beginning. This mirrors Dennett's idea that the "content" of experience is less important than the functional output (the choice to live it).
      *   *Category Mistake:*
          *   *Film vs. Mind:* A film is a fixed artifact. The "revision" happens in the *viewer's interpretation*, not in the *viewer's perceptual apparatus*. Dennett is talking about neural processing timing; the film is playing with narrative epistemology.
          *   *Determinacy:* In Color-Phi, the neural timing is indeterminate. In *Arrival*, the timeline is determinate (the editor cut it that way), but the *diegetic time* is ambiguous.

