answer: |-
  Subject: Thursday's session plan

  Hi there,

  I know exactly the stalemate you are describing, and it is frustrating because both sides are technically correct from within their own frameworks. The CS students are right that information is physically present in the activations, and the philosophers are right that presence does not imply usage or ontological status. To break this, you need to make them feel the gap between correlation and causation physically, not just verbally. The activity below is designed to create that double bruise you asked for, where both sides walk away feeling the limits of their position. You will need to divide the room into two groups, roughly six students as the Network and twelve as the Researchers. The Network students will sit in a chain or cluster at the back or side of the room, facing away from the Researchers if possible, or separated by a barrier of tables. The Researchers sit at the main tables with the whiteboard visible to them.

  You will prepare index cards for the Network students beforehand. Each Network student represents a neuron or a layer. For a group of six, I suggest an input layer of two students, a hidden layer of three students, and an output layer of one student. The input students receive cards from the Researchers with two numbers written on them, let's call them X and Y. You must write fixed rules on cards for the hidden layer students. Here is the critical setup for the double failure. Hidden Student A gets a card that says write down X. Hidden Student B gets a card that says write down Y. Hidden Student C gets a card that says write down X plus Y. The Output Student gets a card that says if A is greater than B write 1 else write 0. This means the network actually computes X greater than Y using students A and B, and completely ignores Student C. However, you will give the Researchers a dataset of input cards where Y is fixed at 5 and X varies from 1 to 10. In this specific dataset, the sum X plus Y is perfectly correlated with the output. If X is 6, sum is 11, output is 1. If X is 4, sum is 9, output is 0. The Researchers can probe the hidden layer by submitting inputs and asking to see the card written by one hidden student of their choice. They will see that Student C's card predicts the output perfectly. They will naturally conclude the network represents the sum. This is your phantom feature. It is decodable and reliable but causally inert.

  To create the second bruise, the hidden feature that is used but undecodable, you need to restrict the probing method. Tell the Researchers they are only allowed to inspect one hidden student at a time and they cannot compare them directly in a single query. They must build a univariate probe. The actual mechanism relies on the relationship between A and B. Since they cannot query the relationship directly, only the individual values, they will struggle to formulate a rule that generalizes if you change the dataset slightly in the second round. But the stronger undecodable feature comes from the incentive structure. You will tell the Researchers their goal is to write a one paragraph abstract explaining what the network represents. The Network students, who know the ground truth rules on their cards, will vote on which abstract is most plausible. The prize goes to the simplest story, not necessarily the true one. This pressures the Researchers to ignore the messy truth of the comparison mechanism in favor of the clean story about the sum, because the sum is easier to write about and fits the data they saw. They will confabulate a tidy interpretation to win the vote, enacting the instrumentalist move in real time.

  Run the session in three blocks of about twenty minutes each with buffer time. In the first block, let the Researchers submit ten inputs and record the outputs and hidden activations. They will find the sum correlation immediately. In the second block, allow them to formulate their theory and write their abstract. In the third block, have them present the abstract and let the Network students vote. Then reveal the ground truth rules on the cards. This is where the tension peaks. The CS students will feel betrayed that the sum didn't matter, and the philosophers will feel vindicated but also challenged because the sum was real in the activations. To keep the Network students from getting bored and freelancing, which is your predicted failure mode, you will introduce a constraint halfway through the second block without calling it a patch. Announce that the model is experiencing drift and hand the Network students a die. Tell them if they roll a 1 they must invert their output card for that turn. This keeps them engaged with the mechanics and simulates noise, but it also subtly disrupts the perfect correlation of the phantom feature if they roll enough times, forcing the Researchers to confront robustness issues without you having to stop the game to fix boredom.

  There is one limitation you must be honest about in the debrief. You cannot reproduce high-dimensional superposition with humans passing cards. In a real neural network, a single neuron might store a linear combination of multiple features in a way that requires projecting the whole activation space to disentangle. Here, our students are storing single scalars. You will need to stand up and explicitly state that real interpretability work deals with geometry in thousands of dimensions, whereas this game was limited to scalar logic. This is the moment to validate the CS students by acknowledging that their intuition about structure is correct, even if this specific game hid it.

  For the debrief, map the game moments directly to the literature. When the Researchers found the sum feature, that was the decodability argument. When the Network revealed they ignored it, that was the causal use argument. When the Researchers wrote the abstract to win the vote rather than to describe the mechanism, that was the instrumentalist move. When they struggled to describe the comparison mechanism because they could only probe one neuron at a time, that was the limitation of linear probes versus distributed representations. You want them to leave feeling that both sides were right but incomplete. The CS students should see that decoding is not explaining. The philosophy students should see that activations are not blank slates. The bruise comes from realizing that a feature can be real enough to decode but fake enough to ignore, and real enough to use but hidden enough to miss.

  Make sure you have extra index cards and markers in case they run out of space for notes. Keep the timing tight because eighty minutes will vanish quickly if the Researchers get stuck on data collection. If they finish early, use the extra time to let them propose a new experiment they would run if they could reconfigure the probing rules, which transitions nicely into the discussion on what better interpretability tools might look like. Good luck on Thursday, this is a hard topic to teach but this setup should get them talking to each other rather than past each other.

  Best regards
