          *   *Carens:* If movement is free, why are they stopped? The police blockades violate the baseline.
          *   *Fair-shares:* Everyone passes the buck.
          *   *Synthesis:* The handbills definitely implicate California growers under Miller, but Steinbeck's systemic critique suggests Miller's agent-focused view is insufficient.
      *   **Parekh (Reception Harms):** The novel is a catalog of these harms. Limbo (Hoovervilles), no right to work (wage suppression), encampment (burned camps), feeling like an intruder (the "Okie" slur). *Addition:* Steinbeck adds *dehumanization* via mechanization. They aren't just intruders; they are treated as broken machines.
