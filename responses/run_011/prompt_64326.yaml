      *   *Key Challenge:* The prompt asks me to "push back... wherever it does not fit." I need to ensure I don't just agree with everything. The strongest pushback points are likely the "Admission vs. Membership" distinction (since they *are* citizens, "admission" is metaphorical) and the "Failure Mode 1" (the racial exclusion is a major ethical hole, not just a rhetorical strategy).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Start by validating the choice of *Grapes of Wrath*. It disrupts the "crossing a border" paradigm. It forces a look at *internal* displacement.
      *   **Admission vs. Membership:** The prompt suggests California "admits" but denies "membership." *Pushback:* Since they are citizens, "admission" is the wrong word. They have the right to enter. The issue is *integration* or *participation*. Weedpatch is crucial here. It shows self-governance. Is it a model? It's a federal island in a hostile sea. It works *because* it's temporary and insulated. It suggests membership requires structural protection, not just goodwill. It's not just a palliative; it's a proof of concept that fails because it isn't scalable.
      *   **Allocation of Duty:**
