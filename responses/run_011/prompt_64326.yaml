      *   **Failure Mode 2 (The Ending):** Rose of Sharon breastfeeding the starving man. Is it political collapse? *Argument:* It's the ultimate reduction of the social to the biological. When the state fails, the body becomes the only welfare system. It's not a solution; it's an indictment. It shows that without political structure, ethics is reduced to survival. It supports the idea that private charity cannot replace public justice.
      *   **Conclusion:** Summarize. The book works for "internal displacement" but fails on "border crossing." It highlights the need for membership, not just entry. But the racial exclusion is a warning about who gets counted as human.

