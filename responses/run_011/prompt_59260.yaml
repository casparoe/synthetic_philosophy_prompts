prompt: |-
  ok so I got into a three hour argument with a friend last night and I couldnt let it go, so I'm dumping it on you instead. Background: I run the clinical ethics consultation service at a mid-size hospital and my friend is a chaplain here. We get ten or twelve consults a month — family blowups about goals of care, a nurse who charted an intervention she didn't actually give because she's convinced it helped, an attending who wants to overide a competent refusal — and whoever's on call is often a social worker or a chaplain, not a philosopher. Every one of those cases forces the same fork and we have no framework for it: do you build the consult around drawing out the spontaneous reactions of the people in the room and treating those reactions as basically trustworthy, or do you treat them as raw material that has to be overriden and reshaped by a trained procedure? I keep insisting that fork isn't vibes, it's the Mencius/Xunzi disagreement with a hospital as the setting. Mencius thinks the sprouts are already in there — the jolt you get from the idea of a toddler crawling toward a well, the sense of shame, the impulse to yield to someone else, the sense that some things are just not done — and the whole job is to protect and cultivate them, so that moral failure is always a story about stunted growth, bad soil, not enough rain, not enough human effort. Xunzi thinks the raw stuff tends toward grabbing and strife and that everything decent in us is an artifact, trained in from outside by ritual, teachers and repetition, like warped wood getting straightened in a frame. My service picks a side every single time it decides whether to open with "tell me your gut reaction" or "here's the protocol we're going to follow," and we've never once admitted that out loud.

  My friend says I'm decorating. Her argument is good: at the level of what people actually do, the two agree on nearly everything — both want role models, both want practice, both pay a lot of attention to environment, both think people are improvable — and the disagreement is only about a metaphor for the starting point, and metaphors don't generate procedures. Her prediction is that any checklist I write will be the same checklist either way and I'll just have relabeled the heading. I can already see one problem myself: if the diagnostic question is "why did this person's reaction go wrong," Mencius says bad soil and Xunzi says soil is all there ever was, and I get the identical instruction both times — so whatever test I build has to key on something other than explanation. Please act as someone who is both a professional philosopher working on early Chinese philosophy and someone who has actually written clinical protocols for non-experts, and before you draft anything, brainstorm out loud for a few paragraphs: strip the disagreement down to what could possibly make a behavioral difference, name two or three places where the Mencian and the Xunzian genuinely prescribe different moves in a consult, and say which of those divergences survives being flattened into a checklist that a tired person can run. If you conclude there aren't any real divergences, say so plainly and tell me my friend won — I'd rather know.

  Then write the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops with a "don't proceed this way," and where it hands the call to a human being because the question is about values rather than facts. I've got a half-formed set of three tests you can improve, replace, or throw out — but tell me what you changed and why: convergence (do the gut reactions of parties who haven't coordinated actually line up once you strip the framing out of the question you asked them?), corruption (is there a specific, nameable reason to think the reaction is distorted — self-interest, exhaustion, who's senior in the room, a script the family has been repeating for years?), and availability (is there a settled practice or protocol on the shelf to substitute, since the Xunzian move needs something to overide with and if there's no practice to invoke, you fall back by default). Run it on three cases: a patient in his forties with no directive where two adult siblings independently both volunteer that he would never want to be kept alive like this; a competent 24-year-old with a progressive condition refusing a low-burden intervention that would buy her years, where the whole team's gut says she doesn't appreciate what she's turning down and a formal capacity route exists; and one you construct where the procedure tells me to trust a family's spontaneous, convergent, obviously-not-self-interested insistence that their mother's same-sex partner be shut out of decisions, because I want to see whether my framework has any place to catch that or whether it just waves it through. Be honest about the misfires — groupthink that reads as convergence, a clinician's revulsion that is itself the pathology, cases where the two views collapse into one instruction — and end with one paragraph on what I could cheaply log over a year of consults that would tell me which mode was actually working. Constraints: the deliverable is a one-page laminated card for the on-call person plus a longer rationale for the committee, the card can't contain the words Confucian or virtue ethics because staff glaze over, nobody here will read a primary text, and sign-off is the attending plus the committee chair. Don't give me citations or a reading list, I'll add references myself, but do name positions and arguments where it helps. Think carefully and don't pad it.
