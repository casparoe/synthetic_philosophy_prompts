prompt: |-
  so, background: I work in a county environmental health division (small metro, ~400k people) and I'm the one who writes the risk memos that the board actually votes on. Last month we had a genuinely ugly fight about a permit — a manufacturer wants to swap a fluorosurfactant we already know has contaminated a well field for a newer replacement that's much less studied. Approve it and you trade a documented bad for an undocumented one; deny it and the documented bad keeps leaching while the plant runs on the old process, which also has known occupational harms. Afterwards two board members asked me to put on one page what decision rule I'm actually using, so they can check whether I'm just deciding case by case and dressing it up in principle-language. I did it, and now I want someone to attack it before it goes in front of them.

  Here's the package I landed on: (1) for ordinary, reversible, well-measured risks — traffic design, routine immunization scheduling, that kind of thing — I do straight expected value; if the data is good we multiply and compare, no heroics. (2) For risks that are plausibly catastrophic and irreversible I go maximin: pick the alternative whose worst case is least bad, and don't demand a probability for it, because in these cases we usually don't have one worth the name. (3) I reject the standard objection that this makes the precautionary principle self-undermining, the one that says it condemns everything including doing nothing — I don't think the status quo gets any presumption in its favor, inaction is a choice like any other, and when both directions have a catastrophic tail my rule still tells you to take the side whose tail is less catastrophic. (4) I also refuse Pascalian moves: I dont think you get to move a decision just because someone can't rule a harm out and says it's infinitely bad — no probability and no evidential support for the mechanism, no standing in the analysis. (5) The threshold between "ordinary" in (1) and "catastrophic" in (2) has to be written down in advance and not gerrymandered to produce the verdict I happened to want; the board sets it before it hears the case. (6) Where the two sides are unequally informed — the applicant knows its own chemistry, we don't — I think it's legitimate to make the proponent carry the burden of showing safety, even though I'm explicitly not claiming they're probably unsafe.

  So: which of these actually pull against each other, and how hard? Rank the conflicts by severity rather than giving me a flat list where everything sounds equally bad. For each real one I want the cheapest available fix and what that fix costs me in practice — including whether fixing it wrecks my answer to the board member who said I was being inconsistent, since that's the whole reason the page exists. Then tell me which pairs only look like a contradiction because they're operating at different levels (decision rule vs. evidential standard vs. procedural default), because I suspect at least one of them is fine and I'd rather not spend the meeting defending something I don't have to. Two more things: does the permit case I described above actually land inside my rule, or in a gap between two of the clauses — I have a bad feeling about that one. And is any item on the list just a restatement of another one, i.e. am I padding the page and should I cut it?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User and Context:**
      *   **User Role:** Environmental Health Division staff (technical expert/risk analyst) in a small metro county (~400k people).
      *   **Task:** Writes risk memos for a Board to vote on.
      *   **Situation:** Recent contentious permit fight (fluorosurfactant swap: known bad vs. unknown new). Board members suspect ad hoc decision-making disguised as principle.
      *   **Deliverable:** A one-page "decision rule" document.
      *   **Goal:** Stress-test the document *before* presenting it to the Board. Specifically, look for internal contradictions, rank them by severity, propose fixes with costs, identify false conflicts (level mismatches), check if the specific permit case fits, and check for redundancy.
      *   **Tone:** Professional, analytical, direct, slightly cynical/pragmatic (given the political context).

  2.  **Deconstruct the Six Clauses:**
      *   (1) *Ordinary Risks:* Expected Value (EV). Data good $\rightarrow$ multiply and compare.
      *   (2) *Catastrophic/Irreversible Risks:* Maximin. Worst-case focus. No probability needed.
      *   (3) *Status Quo/Precaution:* Status quo gets no presumption. Inaction = action. If both have catastrophic tails, pick the lesser tail.
      *   (4) *Pascalian Moves:* Reject infinite harm claims without mechanism/probability. No "cannot rule out" veto.
      *   (5) *Threshold Setting:* Board sets the "ordinary vs. catastrophic" threshold *ex ante*. No gerrymandering.
      *   (6) *Information Asymmetry:* Proponent bears burden of proof on safety (due to info asymmetry), without presuming unsafe.

  3.  **Identify Potential Conflicts (Brainstorming):**
      *   (2) vs. (4): Maximin says "ignore probability, look at worst case." Pascalian rejection says "ignore worst case if no mechanism/probability." If the worst case is "infinite harm" but mechanism is weak, which wins?
      *   (2) vs. (6): Maximin says "pick least bad worst case." Burden of proof says "if you don't show safety, we deny." What if the proponent *can't* show safety (unknowns) but the status quo is also bad? Does burden of proof force a denial that Maximin might not?
      *   (3) vs. (6): (3) says status quo gets no presumption. (6) says proponent bears burden. Doesn't placing the burden on the proponent effectively privilege the status quo (denial = status quo)?
      *   (1) vs. (2): How do we classify the risk? If the threshold (5) is vague, this is a conflict engine.
      *   (5) vs. Everything: If the Board sets the threshold, does that undermine the expert's authority? (Not a logical conflict, but a practical one).
      *   Redundancy: (3) and (6) both touch on status quo/burden. (2) and (4) both touch on uncertainty.

  4.  **Rank and Analyze Conflicts (Severity Assessment):**

      *   *Conflict A: The Status Quo Paradox (3) vs. (6).*
          *   **Severity:** High. This is the most legally and politically vulnerable point.
          *   **Logic:** (3) says "Inaction is a choice, no presumption for status quo." (6) says "Proponent must prove safety." If Proponent fails, result = Status Quo. This *is* a presumption for the status quo.
          *   **Fix:** Clarify that burden of proof is procedural/epistemic, not normative. Or acknowledge the tension.
          *   **Cost:** Admitting that in practice, burden of proof *does* favor status quo, even if principle doesn't.
          *   **Board Consistency:** Fixing this helps consistency. It admits the practical reality.

      *   *Conflict B: The Uncertainty Clash (2) vs. (4).*
          *   **Severity:** Medium-High.
          *   **Logic:** (2) says "Don't demand probability for catastrophic tails." (4) says "No standing without evidential support for mechanism." If a claimant says "This new chemical causes global warming" (catastrophic) but has zero evidence, (2) might say "check the tail," (4) says "ignore it."
          *   **Fix:** Clarify that (4) is the *gatekeeper* for (2). You need *some* mechanism to trigger Maximin.
          *   **Cost:** Raises the bar for triggering Maximin. Might look like weakening precaution.
          *   **Board Consistency:** Strengthens consistency by preventing frivolous catastrophic claims.

      *   *Conflict C: The Threshold Game (1) vs. (2) vs. (5).*
          *   **Severity:** Medium.
          *   **Logic:** If the Board sets the threshold (5), they can manipulate it to force EV or Maximin to get the result they want.
          *   **Fix:** Define technical criteria for the threshold, not just "Board decides."
          *   **Cost:** Reduces Board's political flexibility (they might hate this).
          *   **Board Consistency:** Crucial for the "no gerrymandering" claim.

  5.  **Identify False Conflicts (Level Mismatches):**
      *   (1) vs. (2) is not a conflict if (5) works. It's a conditional switch.
      *   (3) is a philosophical justification for (2) and (6), not a separate rule.
      *   (6) is an evidential standard, (3) is a normative stance. They operate at different layers.

  6.  **Analyze the Specific Permit Case:**
      *   **Scenario:** Swap known contaminant (bad) for unknown (less studied).
      *   **Application:**
          *   Is it catastrophic? Well field contamination is serious, maybe irreversible. Likely triggers (2).
          *   If (2) applies: Maximin.
              *   Option A (Old): Known leaching. Worst case = Continued contamination + occupational harm.
              *   Option B (New): Unknown. Worst case = ? If unknown, how do we score the tail?
          *   Here's the gap: (6) says Proponent must show safety. If they can't (because it's new), do we deny? If we deny, we stay with Old (Known Bad).
          *   (3) says Status Quo (Old) gets no presumption.
          *   **Verdict:** The case lands in the gap between (2) and (6). Maximin requires comparing worst cases. If the new chemical's worst case is undefined, Maximin stalls. Burden of proof (6) says "they didn't show safety, so no." But "no" means "keep the known bad."
          *   **Problem:** The rule might force keeping the known bad because the new one is unknown, which contradicts the spirit of solving the known bad.
          *   **Fix:** Need a "comparative uncertainty" clause. If both have bad tails, but one is known and one is unknown, how to weigh?

  7.  **Check for Redundancy:**
      *   (3) is largely explanatory/defensive rhetoric for (2) and (6). It might be padding.
      *   (5) is procedural, distinct from the decision logic.
      *   (1) and (2) are the core engine.
      *   (4) is a constraint on (2).
      *   (6) is an evidential rule.
      *   *Candidate for cutting:* (3). It's a justification, not a rule. The Board asked for the *rule*, not the philosophy defending it. Keeping it invites debate on philosophy rather than application.

  8.  **Drafting the Response:**
      *   **Structure:**
          1.  Executive Summary (The "Bad News/Good News").
          2.  Ranked Conflicts (Severity, Fix, Cost, Consistency Impact).
          3.  False Conflicts (Level Mismatches).
          4.  The Permit Case Analysis (Gap vs. Fit).
          5.  Redundancy Check (Cutting Padding).
      *   **Tone:** Peer-to-peer, sharp, pragmatic. Acknowledge the political tightrope.
      *   **Key Insight:** The tension between "Status Quo has no presumption" and "Proponent bears burden" is the killer. If the proponent fails, the status quo wins. That *is* a presumption.

  9.  **Refining the "Permit Case" Analysis:**
      *   The user says: "Approve it and you trade a documented bad for an undocumented one; deny it and the documented bad keeps leaching."
      *   Under (6): Proponent must show safety. If they can't (undocumented), you deny. Result: Documented bad continues.
      *   Under (3): Status quo (documented bad) gets no presumption.
      *   *Contradiction:* (6) effectively creates the presumption (3) denies.
      *   *Resolution:* The rule needs to handle "Uncertainty vs. Known Harm." Maximin usually favors the *known* devil if the unknown devil *could* be worse. But if the known devil is *guaranteed* harm and the unknown is *potential* harm, Maximin might actually favor the unknown if the known worst-case is worse than the unknown plausible worst-case.
      *   *Wait, re-reading (2):* "Pick the alternative whose worst case is least bad."
      *   Old Chemical Worst Case: Known contamination levels + health effects.
      *   New Chemical Worst Case: Unknown. If truly unknown, is it "infinite"? (4) says no. So it must be bounded by class effects.
      *   *The Gap:* How do you score the worst case of an unknown? If you can't score it, Maximin breaks.
      *   *Advice:* The rule needs a default for "unquantifiable uncertainty" vs "quantified harm."

  10. **Final Polish:** Ensure the distinction between "Decision Rule" (math/logic) and "Procedural Default" (who speaks first) is clear. Ensure the advice on cutting (3) is firm—it's the most "academic" part and least useful for a Board memo.

  **(Self-Correction during drafting):** I initially thought (3) was redundant. But (3) addresses the "Precautionary Principle self-undermining" objection. That's specific. However, for a *one-pager* to a Board, philosophical defense is weak. They want to know *what you will do*. I will recommend condensing (3) into the others.
  Also, the "Status Quo" conflict is the most dangerous legally. If a company sues saying "You denied me based on uncertainty, but your rule says status quo gets no preference," the burden of proof clause undermines that. I need to highlight this legal vulnerability.

  Let's organize the conflicts by severity.
  1. Status Quo vs. Burden of Proof (3 vs 6).
  2. Maximin vs. Pascalian (2 vs 4).
  3. Threshold Setting (5) vs. Expert Authority (Implicit).

  Let's organize the False Conflicts.
  1. EV vs Maximin (1 vs 2) - handled by Threshold (5).
  2. Burden of Proof vs Decision Rule (6 vs 1/2) - Evidential vs Logical.

  Let's tackle the Permit Case. It exposes the "Unknown Worst Case" problem in Maximin.

  Let's tackle Redundancy. (3) is the main candidate.

  Okay, ready to write.
answer: |-
  This is a sharp piece of work. It's clear you've thought hard about the decision theory underneath the regulatory grind. But you are right to be worried: Board members asking for a "decision rule" are usually looking for a way to pin you down if the outcome goes political. They want to know if the rule constrains *them* or just *you*.

  Here is the stress test. I have ranked the internal conflicts by severity (legal/political vulnerability), identified the false conflicts, analyzed your specific permit case, and flagged the padding.

  ### Part 1: Real Conflicts (Ranked by Severity)

  **1. The "Status Quo" Paradox (Clause 3 vs. Clause 6)**
  *   **Severity:** **Critical.** This is the hole a lawyer or a disgruntled applicant will drive a truck through.
  *   **The Conflict:** Clause (3) explicitly states the status quo gets no presumption; inaction is a choice. Clause (6) places the burden of proof on the proponent. In practice, if the proponent fails to meet the burden of proof, the permit is denied, and the status quo remains. **Operationally, a burden of proof *is* a presumption for the status quo.** You cannot claim (3) while enforcing (6) without appearing contradictory.
  *   **The Fix:** Reframe Clause (6). Instead of "Proponent must show safety," write: "Where information is asymmetric, the analysis treats unverified claims of safety as *uncertain* rather than *safe*." Then, link this to Clause (2). If the new process is uncertain, its "worst case" in the Maximin calculation must reflect that uncertainty (e.g., class-effects bounding), not an automatic denial.
  *   **The Cost:** You lose the automatic "deny if unknown" lever. You have to do the work of bounding the unknown worst-case rather than just saying "you didn't prove it safe."
  *   **Consistency Impact:** **High.** Fixing this saves you from the Board member who accused you of inconsistency. It aligns your procedural default with your normative claim.

  **2. The "Gatekeeper" Clash (Clause 2 vs. Clause 4)**
  *   **Severity:** **High.**
  *   **The Conflict:** Clause (2) says "don't demand a probability" for catastrophic risks (Maximin). Clause (4) says "no standing... no evidential support for the mechanism." If an objector claims a new chemical causes "irreversible ecosystem collapse" (catastrophic) but has zero mechanistic evidence, Clause (2) invites you to look at the tail, while Clause (4) tells you to ignore it. Where is the line between "plausibly catastrophic" and "Pascalian fantasy"?
  *   **The Fix:** Make Clause (4) the *entry criterion* for Clause (2). Add a phrase to (2): "For risks that pass the evidential threshold in (4) but lack probability data..."
  *   **The Cost:** You raise the bar for triggering the Precautionary Principle. Community groups may argue you are requiring too much science before allowing precaution.
  *   **Consistency Impact:** **Medium.** It clarifies the workflow. It prevents you from being accused of using Maximin to block projects based on rumors.

  **3. The Threshold Trap (Clause 5 vs. Your Authority)**
  *   **Severity:** **Medium.**
  *   **The Conflict:** Clause (5) says the Board sets the threshold between "ordinary" and "catastrophic" *ex ante*. This protects you from accusations of gerrymandering. However, if the Board sets a threshold that is technically nonsensical (e.g., "any cancer risk is catastrophic"), it forces you into Maximin for routine issues, breaking Clause (1).
  *   **The Fix:** Add a technical caveat: "The Board sets the policy threshold, subject to technical feasibility of classification."
  *   **The Cost:** It slightly undermines the "Board decides" purity. They might resent the "technical feasibility" escape hatch.
  *   **Consistency Impact:** **Low.** This is more about political cover than logical consistency.

  ### Part 2: False Conflicts (Level Mismatches)

  These look like contradictions but are actually operating at different layers. Do not waste political capital defending these; simply explain the distinction.

  *   **Clause (1) vs. Clause (2) [EV vs. Maximin]:** This is not a conflict; it is a **conditional switch**. As long as Clause (5) (the threshold) is clear, these do not fight. One applies if $X < Threshold$, the other if $X > Threshold$.
  *   **Clause (6) vs. Clauses (1) & (2) [Evidence vs. Logic]:** Clause (6) is an **evidential standard** (how we treat data gaps). Clauses (1) and (2) are **decision functions** (what we do with the data). You can have a burden of proof (6) that feeds into an Expected Value calculation (1). No conflict here, provided you fix the Status Quo Paradox above.

  ### Part 3: The Permit Case (The "Bad Feeling")

  **Verdict:** The permit case lands in a **gap**, specifically between Clause (2) and Clause (6).

  *   **The Problem:** You have a "Known Bad" (Old Chemical) vs. an "Unknown" (New Chemical).
      *   **Clause (2) (Maximin):** Requires comparing the worst case of Option A vs. Option B.
          *   Option A Worst Case: Known contamination levels + health outcomes. (Quantifiable).
          *   Option B Worst Case: Unknown. If you apply Clause (6) strictly ("Proponent didn't prove safety"), Option B becomes "Unbounded Uncertainty." Maximin hates unbounded uncertainty. It will default to the Known Bad because the Unknown *could* be worse.
      *   **Clause (3) (Status Quo):** Says don't privilege the Known Bad.
      *   **The Gap:** Your rule forces you to keep the known contaminant because the replacement is insufficiently studied. This is the "technology lock-in" problem. Your rule prevents the swap, keeping the documented harm in place, which feels like a violation of the environmental health mission.

  *   **The Fix:** You need a **"Comparative Uncertainty"** addendum to Clause (2).
      *   *Drafting:* "Where the status quo involves *known* irreversible harm and the alternative involves *uncertain* risk, the 'worst case' of the alternative is bounded by the worst case of its chemical class or functional analogues, not treated as infinite. If the known harm exceeds the bounded unknown risk, the alternative is preferred."
      *   **Cost:** This requires you to do more toxicological legwork to find "analogues" for the new chemical. You can't just say "we don't know."
      *   **Consistency:** This directly answers the Board's worry. It shows you aren't just blocking change; you are managing the *type* of uncertainty.

  ### Part 4: Redundancy Check (Cut the Padding)

  **Cut Clause (3).**
  *   **Why:** It is philosophical defense, not a decision rule. It explains *why* you don't privilege the status quo, but it doesn't tell the Board *how* you decide. It is also the source of your biggest logical vulnerability (vs. Clause 6).
  *   **Replacement:** Fold the useful part of (3) into the fix for the Permit Case (the "Comparative Uncertainty" note above). The Board doesn't need to know you've read the literature on the self-undermining precautionary principle; they need to know how you handle the "known bad vs. unknown risk" scenario.
  *   **Benefit:** Shortens the page. Removes the target on your back regarding the "presumption" argument.

  ### Summary of Recommendations

  1.  **Kill Clause (3).** It's theory, not procedure, and it contradicts Clause (6).
  2.  **Fix Clause (6).** Change "Proponent must show safety" to "Unverified safety claims are treated as uncertain inputs." This resolves the Status Quo Paradox.
  3.  **Patch the Permit Gap.** Add the "Comparative Uncertainty" language to Clause (2) so you aren't forced to keep known contaminants just because the replacement is new.
  4.  **Clarify (4) as a Gatekeeper.** Ensure (4) is explicitly the filter that allows a risk to enter the Maximin analysis in (2).

  **Final Advice for the Meeting:**
  When you present this, lead with the **Permit Case**. Say: *"I wrote this specifically because the fluorosurfactant case showed me where my previous implicit rules failed. Specifically, how to handle known harm vs. unknown risk without locking in technology."* This frames the document as a solution to *their* problem (the ugly fight), not a defense of *your* methodology. It makes you look proactive rather than defensive.
