  **The Daily Consensus: Twelve Months of the Voice That Is No One's**

  **No bylines, no editors, no responsibility. The proprietor insists he has no views. The circulation is up. Our media correspondent reports on the year the press stopped writing.**

  **By Our Media Correspondent**

  When *The Daily Consensus* launched on 14 February last year, the press pack was told there would be no editor, no masthead names, and no letters page signed by individuals. Sir Julian Fenchurch, the paper's proprietor, addressed the gathering from behind a lectern bearing only the logo—a grey circle—and stated that he possessed no views on the state of the nation, the economy, or the venture itself. "Opinion is a bottleneck," Sir Julian said. "I am merely the infrastructure."

  Twelve months on, the ABC audited figures suggest the infrastructure is sound. Launch month circulation stood at 42,000 copy. By month three, following the removal of the weather forecaster's name, figures dipped to 38,500. However, after the editorial decision in month six to cease distinguishing between news reports and leader columns, circulation climbed to 55,000. The most recent audit, covering the period ending 31 January, shows a daily average of 61,200, with a weekend supplement reaching 74,000. Digital unique browsers are not counted, as the paper does not recognise the individual user.

  A spokesman for the title, who this magazine was informed is not employed by the publishing group and cannot be contacted for comment, issued a written statement regarding the growth. "The readership is not a collection of people but an abstraction which comes into existence only through the paper's own activity," the statement read. "We are not addressing an audience so much as manufacturing the thing that reads us. The figures confirm the abstraction is cohering."

  **Manufacturing the Reader**

  The production process remains unique in the national market. There is no editorial conference. Instead, the online comment section beneath each article is monitored by algorithms that identify the most frequently repeated sentiments. These sentiments are collated, smoothed into a neutral register, and printed as the following day's leader column. Responsibility for the content is attributed to 'The Readership'.

  This method has streamlined production costs. There are no columnists to pay, only moderators to aggregate. It has also resolved the issue of bias. A saint and a fraud are copy of equal length; the paper's proudest technical achievement is that a reader cannot tell which of its stories would cost them anything to believe. Reflection is preferable to passion, and talk about an event is preferable to the event. Ideal copy is that which can only be discussed and never decided; the paper measures success in the volume of remark it provokes rather than in anything done.

  Gossip is treated as the truest form the age has, and the paper's job is to convert everything that happens into what people are saying about what happened. Reading is offered as the pleasure of holding opinions without the burden of holding them.

  **Liability and Absence**

  The abolition of authorship has generated complex legal conditions. In November, a defamation claim was filed regarding a report on a local councillor's expenses. The paper cannot lose the action, as there is no defendant to serve; the masthead lists no editor, and the proprietor denies holding views that could constitute malice. Equally, the paper cannot defend the claim, as no individual can be found to sign the defence. The case remains in the High Court list, status unchanged, costs accumulating against a null party.

  The obituary desk presents similar structural challenges. The page runs daily, filling the standard column inches with descriptions of the atmosphere at funerals, the quality of the floral arrangements, and the general sense of loss felt by the community. No names are printed, as no identifiable human being can be held responsible for having died. The space is filled with prose about the concept of absence, ensuring nothing printed is such that one identifiable human being could be held responsible for it. Responsibility is treated as a production error.

  The paper's flagship investigative series, published over three weeks in October, focused on a private man seen daily in Chelmsford. The reporting covered his umbrella, the manner in which he removed his hat, and the fact that one of his trouser legs hung a little longer than the other. Following publication, schoolchildren began following him home. The subject has since ceased to leave his residence. The paper counts the series as its finest work, on the grounds that it converted a man nobody had heard of into something everyone had a view about.

  Circulation continues to rise. The spokesman indicated that the next phase of development involves removing the date from the masthead, as time is also a construct imposed upon the reader. Sir Julian Fenchurch was seen yesterday entering the building. He declined to speak. The doors were locked behind him.
