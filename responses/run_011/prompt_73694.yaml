answer: |-
  Here is the brainstorming sorting you asked for. The phenomena that actually break theories are not the clever puzzles found in textbooks, but the mundane cases where context does heavy lifting without announcement. The AI failure you described—treating "Can you pass the salt?" as a capacity inquiry—is a failure of *enrichment*, not just implication. It shows that some pragmatic work is mandatory for the sentence to function as a proposition at all. The political evasion case is the inverse: the pragmatic work is done so effectively it creates a commitment, yet the structure allows the speaker to retreat to the bare code. Red herrings include the status of metaphor and idioms; these are often lexicalized or special cases that don't stress the general mechanism. The real pressure points are reference resolution (how much context is needed to fix a pronoun?), free enrichment (does "It's raining" mean raining *here*?), and scalar inference (does "some" automatically suggest "not all"?). Any theory that cannot explain why the AI misses the enrichment while the politician exploits it is failing to capture the boundary itself.

  Here are the desiderata for any adequate account of the semantics-pragmatics boundary.

  **1. The Layered Architecture Requirement**
  *   **Motivation:** An account must distinguish between the linguistic code (sentence meaning), the proposition expressed (what is said), and the additional content conveyed (what is implicated). Without this, we cannot explain how two different sentences can convey the same point, or how one sentence can convey multiple points.
  *   **Status:** **Non-negotiable.** While the number of layers varies by theory, collapsing code directly into conveyed content makes it impossible to explain translation, misunderstanding, or the specific failure mode of the conversational systems you mentioned.

  **2. The Cancellation and Deniability Diagnostic**
  *   **Motivation:** A candidate piece of conveyed content must be testable by whether it can be explicitly denied without contradiction. If I say "Some of the students passed, but not all," there is no contradiction. If I say "Some of the students passed, in fact all of them," there is tension. This diagnostic separates what is logically encoded from what is inferred.
  *   **Status:** **Non-negotiable.** This is the primary empirical tool for separating semantic commitment from pragmatic inference.

  **3. The Truth-Evaluability of the Residue**
  *   **Motivation:** Whatever remains after stripping away implicatures—the literal residue—must amount to a claim that can be assessed as true or false. If the literal meaning is too fragmentary to be judged, the distinction between semantics and pragmatics loses its logical utility.
  *   **Status:** **Badge of a Particular Camp (Minimalism).** Contextualists argue that the literal residue is often too thin to be truth-evaluable without pragmatic enrichment. Insisting on this requirement forces a specific view of semantics as context-free.

  **4. The Intrusion Ceiling**
  *   **Motivation:** The account must specify how much pragmatic input is allowed into the determination of "what is said" before the distinction between said and implicated dissolves. If context determines everything, semantics disappears; if context determines nothing, communication fails.
  *   **Status:** **Badge of a Particular Camp (Minimalism vs. Contextualism).** Minimalists demand a low ceiling to protect semantics; Contextualists argue the ceiling is high or non-existent because pragmatic processes penetrate the core proposition.

  **5. The Selectivity and Immediacy Principle**
  *   **Motivation:** The account must explain why hearers do not compute every inference the context would license, and why some inferences (like the polite request in "Can you pass the salt?") feel immediate while others feel like work. The AI systems you mention fail because they lack this selectivity filter.
  *   **Status:** **Non-negotiable.** This is a psychological reality of processing. A theory that predicts infinite inferences is empirically false.

  **6. The Flouting-as-Signal Requirement**
  *   **Motivation:** The account must explain how ostentatiously breaking a communicative norm (such as being obviously irrelevant or overly verbose) generates meaning rather than causing a breakdown. This covers irony, sarcasm, and political hedging.
  *   **Status:** **Non-negotiable.** This is a robust phenomenon across cultures. If a theory cannot explain how violation creates meaning, it cannot explain strategic communication.

  **7. The Commitment/Deniability Paradox**
  *   **Motivation:** The account must explain how conveyed content can be binding enough for a hearer to act on (voting, buying, obeying) yet deniable enough for the speaker to disavow. This is the core of your political evasion case. The content must be robust enough to guide action but structurally distinct from assertion enough to allow retreat.
  *   **Status:** **Non-negotiable.** This is the social reality of high-stakes communication.

  ### The Collision and the Cost

  There is a direct collision between **The Truth-Evaluability of the Residue** (Requirement 3) and **The Commitment/Deniability Paradox** (Requirement 7), mediated by **The Intrusion Ceiling** (Requirement 4).

  If you maintain a strict Truth-Evaluability requirement, you must keep the literal residue context-free (a low Intrusion Ceiling). This creates a "minimal proposition." However, in the political and AI cases, the content that is *binding* on the hearer is almost never the minimal proposition. No one acts on the literal truth of "It is cold in here"; they act on the enriched request "Turn up the heat." If the enriched content is treated as merely implicated to preserve the literal residue, it becomes fully deniable—but then it is hard to explain why it is socially binding. If the enriched content is treated as "what is said" to make it binding, it becomes harder to deny, and the literal residue dissolves (violating Requirement 3 and 4).

  **I would drop The Truth-Evaluability of the Residue (Requirement 3) in its strict, context-free form.**
  *   **The Cost:** You lose the ability to treat semantics as a purely formal, logical system independent of use. Semantics becomes "truth-evaluable only in context," which blurs the line between linguistics and psychology.
  *   **The Gain:** You can explain the political and AI phenomena. The "literal" meaning is just a schematic prompt for enrichment. The deniability comes not from retreating to a minimal proposition (which no one heard), but from exploiting the fact that the enrichment was not explicitly asserted. This matches the reality that audiences know they were misled, even if the speaker technically told the truth.

  ### The Single Most Discriminating Requirement

  **The Cancellation and Deniability Diagnostic (Requirement 2)** does the most work in ruling out candidate accounts.
  Many theories can propose layers of meaning, but when pressed to show where one layer ends and another begins, they fail this test. If a theory claims a piece of content is "encoded" but it can be cancelled without contradiction, the theory is wrong. If it claims content is "implicated" but cancelling it creates a contradiction, the theory is wrong. This diagnostic forces theories to make falsifiable claims about the status of specific inferences, filtering out vague appeals to "context" or "usage."

  ### Framework Scoring

  The classical maxims-based picture scores well on Flouting and the Layered Architecture but poorly on Selectivity, as it implies a deliberative calculation that contradicts the immediacy of standard inferences. The single-principle relevance-theoretic picture excels at Selectivity and Immediacy, explaining why we stop inferring when effort outweighs effect, but it struggles with the Layered Architecture, often dissolving the distinction between said and implicated into a single continuum of explicitness. The neo-Gricean picture involving default triggers handles Selectivity well by automating common inferences, but it frequently fails the Cancellation Diagnostic in complex contexts, treating what should be cancellable implications as rigid defaults. None of the three perfectly resolves the Commitment/Deniability Paradox, but the relevance-theoretic approach comes closest by treating deniability as a function of the speaker's manifest intentions rather than a rigid semantic boundary.
