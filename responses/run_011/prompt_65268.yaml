          4.  **Nudge/Ideals:** Where does this leave the argument that influence aimed at the target's own good/ideals isn't manipulation?
          5.  **Efficacy vs. Action:** Does the disputed efficacy (trend was already moving) change the verdict? Is manipulation about the *act* or the *outcome*?
      *   **Constraint:** Skip sales figures and health impacts; focus on the boundary work of persuasion/manipulation.

  2.  **Initial Brainstorming & Categorization:**
