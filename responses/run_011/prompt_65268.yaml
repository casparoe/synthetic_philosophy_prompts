      *   *The Actors:* Bernays (agent), American Tobacco (client), Debutantes (performers), Press (amplifier), Public (ultimate target).
      *   *The Concealment:* The public wasn't told it was a paid ad stunt. They were told it was a feminist protest.
      *   *The Truth Claim:* Smoking bans *were* sexist. Women *did* want equality.
      *   *The Manipulation Question:* Is it manipulation if you trick people into doing something that aligns with their values, using a lie about the *source* of the action?

  3.  **Drafting the Mapping (Target Identification):**
      *   *Group A: The Debutantes.* They were paid (or at least recruited/compensated indirectly through social capital). They knew they were lighting cigarettes. Did they know it was an ad stunt? Bernays usually kept the clients hidden. They were *employed* as props, but perhaps *persuaded* that they were making a statement. Let's call them "instrumentalized."
      *   *Group B: The Reading Public.* They saw the photos. They read the "feminist" framing. They didn't know it was Lucky Strike paying for it. They are the primary *manipulated* party.
      *   *Distinction:* The debutantes were means; the public was the end.

  4.  **Analyzing the Tests (Concealment, Mechanism, Content):**
      *   *Concealment:* High. The commercial origin was hidden. The staging was hidden (planted photographers).
      *   *Mechanism:* It bypassed rational deliberation about "should I smoke?" and went straight to "I want to be a modern, free woman." It used emotional signaling (freedom) rather than product utility.
      *   *Content:* The message ("women should be allowed to smoke publicly") was arguably morally sound/true. The taboo *was* sexist.
      *   *Tension:* Standard manipulation definitions focus on *how* you get someone to believe/act (deception, coercion, bypassing reason). If the *what* is good, does the *how* matter? Most philosophical accounts say yes. Manipulation is non-rational influence or deception, regardless of the truth of the conclusion.

  5.  **Addressing the "True Claim" & "Own Ideals" Argument:**
      *   *Nudge/Thaler & Sunstein:* Nudges are okay if they align with the agent's welfare/values.
