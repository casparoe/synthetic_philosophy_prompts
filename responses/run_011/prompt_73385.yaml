      *   **Task:** Draft five numbered points (each a sentence or two) outlining implications of the Epicurean argument vs. deprivation-based objections regarding compensation for shortened life expectancy.
      *   **Context:** A statutory scheme following English personal injury law (post-1982 rules: no damages for loss of life itself, but awareness counts for pain/suffering; living claimants get lost earnings minus living expenses; estate loses this claim on death, dependents get support + bereavement).
      *   **Criticism:** The current package is seen as incoherent (compensates awareness of dying, but not the loss of life itself if extinguished without warning).
      *   **Philosophical Core:** Epicurean argument (death is no harm because no subject exists) vs. Deprivation-based objections (death is harm because it deprives one of future goods).
      *   **Goal:** Address whether the rules are principled or arbitrary, specifically regarding whether a shortened life is a loss to the person living it and when that loss falls.
      *   **Constraint:** Exactly five numbered points. Each point must be one or two sentences. No introduction or conclusion.

  2.  **Deconstruct the Philosophical Arguments:**
      *   *Epicurean Argument:* Death is nothing to us; when we exist, death is not present, and when death is present, we do not exist. Therefore, death cannot harm the deceased.
      *   *Deprivation Account (e.g., Nagel):* Death is a harm because it deprives the individual of the good life they would have otherwise had.
      *   *Legal Context:* English law currently aligns somewhat with Epicureanism regarding the *estate* (no claim for loss of life itself after death) but aligns with Deprivation regarding the *living claimant* (lost earnings during lost years). This creates the alleged incoherence.

