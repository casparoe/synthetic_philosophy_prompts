answer: |-
  1. The Epicurean view implies the rules are principled in denying estate claims, as death cannot harm a non-existent subject who would receive the compensation.
  2. Deprivation objections contend that death harms the individual by stealing their future, implying the loss falls on the living person at the moment their life is shortened.
  3. The scheme appears arbitrary because it accepts the deprivation account for living claimants recovering lost earnings but reverts to Epicureanism to deny the estate recovery for the same loss.
  4. If the loss is truly to the person living the shortened life, the damage accrues immediately upon exposure, meaning the claim should survive death as a vested property right.
  5. Resolving this incoherence requires choosing consistently either to deny all loss-of-life damages or to allow the estate to recover the value of the lost future years.
