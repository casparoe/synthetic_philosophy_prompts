      *   *Point 2: Deprivation Objection.* Conversely, the deprivation account asserts that death is a profound harm because it denies the individual the future goods they would have enjoyed, suggesting the loss occurs at the moment of life-shortening exposure rather than death.
      *   *Point 3: Legal Incoherence.* The current rules appear arbitrary because they accept the deprivation view for living claimants recovering lost earnings yet revert to the Epicurean view upon death to deny the estate compensation for the lost years themselves.
      *   *Point 4: Timing of Loss.* If the deprivation view holds, the loss falls upon the living person whose future is curtailed, implying compensation should attach to the claimant personally regardless of whether they survive to trial.
      *   *Point 5: Principled Consistency.* To be principled rather than incoherent, the scheme must choose either to deny all loss-of-life damages consistent with Epicureanism or to allow the estate to recover the value of the lost future consistent with the deprivation account.

