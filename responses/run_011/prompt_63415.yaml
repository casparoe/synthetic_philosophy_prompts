  The first stanza establishes the scheme with perfect end-rhymes (night/sight, down/town). The second maintains the positions using only assonance and consonance (press/pass, tear/air), echoing the Martian intuition that the substrate (red soil) differs while the role persists. The third relies on eye rhyme: the spellings match (lead/lead, bow/bow) but the pronunciations diverge, preserving the visual pattern while the sound shifts. The fourth realizes the scheme semantically; the rhyming pairs are synonyms or categorical associates (hand/arm, sun/moon, head/thought, low/climb) rather than phonetic matches, nodding to the limb that acts independently. The fifth invents a structural displacement: the rhyme is verified by the initial letter of the final word (white/warmth, deep/dark), showing the slot survives even when sound and sense are replaced by arbitrary code. The sixth returns to the original phonetic scheme exactly, but the content enacts the China Brain objection: the functional roles are filled perfectly, yet the qualia are absent, leaving the final image to demand either the surrender of the intuition that function is enough, or the admission that the crown implies a head.
