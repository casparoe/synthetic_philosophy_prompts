      *   *Decision:* The most robust philosophical answer acknowledges that (3) does *not* straightforwardly follow from (1) and (2) in a dialectical context against a skeptic, due to **Transmission Failure**. It's not that the logic is invalid, but that the *warrant* doesn't flow.
      *   *Alternative:* Restricting (1). The "Hinge Propositions" view (Wittgenstein/Wright). Some propositions (like "there is an external world") are not objects of knowledge but preconditions for knowledge games.

