answer: |-
  Good morning. Welcome to everyone. I see our usual coalition: half philosophers who worry about foundations, half applied Bayesians who worry about getting things done, and—welcome—two actuaries who I believe are primarily here for the catering. Please know we value your presence; someone needs to keep us solvent.

  We have a tradition here. Last year, the opener gave a single number representing the probability that the replication crisis would reach our subfield within a decade. The number was 0.42. Well, the crisis arrived, sort of, and nobody agrees on whether that counts as a hit. Which feels appropriate.

  This year, the Dean has asked me to escalate. The funder wants measurable outputs. Specifically, I am required to state, out loud, a single probability that this field—imprecise probability—still exists in thirty years.

  Now, I know what half of you are thinking. Our friends who prefer sharp priors often worry that using a set of probabilities is just a refusal to commit. A way to hide behind vagueness when the data demands a decision. And I know what the other half is thinking: that giving a single number is a lie.

  Here is the thing about our field: sometimes, learning more makes you less sure. In standard theory, more data shrinks your error bars. In imprecise probability, we have something called *dilation*. It's where getting new information widens your interval. It's the statistical equivalent of Googling your symptoms and becoming *less* certain you're healthy than you were before you looked.

  I want you to feel that tension. Please, raise your right hand if you believe this field exists today. Keep them up. Now, keep your hand up if you are willing to assign a sharp, point-value probability to its existence in 2055. Look around. Hands dropped. Keep them up if you would bet your tenure on that point-value at 4-to-1 odds. Fewer still.

  That drop-off isn't cowardice. It's honesty.

  Keynes reminded us that the *weight* of evidence is not the same as the *precision* of probability. You can have massive evidence and still lack the grounds for a sharp number. To demand sharpness is to demand a specific kind of courage that the evidence doesn't always support.

  So, I must give the Dean a number. I will not collapse my credal state to a point to do it. I will treat this as a betting quotient. I am willing to buy a ticket that pays $1 if this field exists in 2055, for a price of **0.75**.

  That is the number. 0.75. It is not my whole state. It is my lower bound. It is the commitment I can make without pretending I know more than I do.

  We are here to explore what happens between 0.75 and 1, and what happens when the interval widens. Let's have a productive workshop, and please, save some lunch for the actuaries.

