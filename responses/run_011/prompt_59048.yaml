answer: |-
  ### Part 1: Brainstorming the Boundary

  Okay, let's lay the cards on the table before we build the machine. The boundary problem is the original sin of democracy: you have to be inside the demos to decide who is inside the demos. Since your Charter hands that knife to the Authority, we aren't solving the paradox, we're managing the legitimacy deficit.

  **Candidate Principles:**
  1.  **All-Subjected to Coercion (ASC):** If the District can arrest you, tax you, or zone your land, you vote.
      *   *Weird Case:* The tourist. If they jaywalk, they get fined. Do they get a vote on policing?
      *   *Implication:* Commuters get voting rights on congestion charges. Residents might hate sharing power with "daytime only" people.
  2.  **All-Affected Interests (AAI):** If a decision changes your welfare, you have a say.
      *   *Weird Case:* The downstream town. If our drainage floods them, they are affected. Do they get a veto?
      *   *Implication:* The boundary becomes infinite. A supplier in another country is affected by our procurement rules.
  3.  **Stakeholder/Residency:** Formal legal ties (lease, deed, incorporation).
      *   *Weird Case:* The dorm worker. They live there but don't hold a lease. The corporate campus owns the land but isn't a person.
      *   *Implication:* Excludes the most precarious (dorms, temp housing) while empowering absentee landlords.
  4.  **Fiscal Contribution:** Paying for the service buys the say.
      *   *Weird Case:* The corporate campus pays 40% of revenue. Do they get 40% of the vote?
      *   *Implication:* Plutocracy. Violates political equality. But in a "business improvement district" model, it's standard.

  **Contradictions:**
  *   **ASC vs. AAI:** A downstream resident is *affected* (AAI) but not *subjected* to District law (ASC). If we follow ASC, they have no recourse against our flooding. If we follow AAI, we cede sovereignty to non-members.
  *   **Fiscal vs. Equality:** Your boss wants weighting. If we weight by contribution, we treat the District as a corporation (shares = votes). If we don't, we treat it as a polity (people = votes). You can't be both.

  **Fatal vs. Annoying:**
  *   **Fatal:** Excluding those subjected to coercion without recourse (tyranny). Including those with no stake (capture).
  *   **Annoying:** Administrative burden of verifying "affectedness."

  **The Choice:**
  We cannot use pure AAI; the clerks will drown in causal chains. We cannot use pure Residency; it ignores the commuters and downstream victims. We must use **All-Subjected to Coercion (ASC)** as the baseline for *binding* votes, but we must stretch the definition of "Coercion" to include **Physical Externalities** (stormwater) to capture the downstream case without opening the floodgates to everyone "affected."

  For the Fiscal Roll: We will acknowledge contribution as a threshold for *entry*, but we will cap the *standing type* to prevent the Boss's weighting from becoming oligarchic control. The procedure will force the Boss to appeal to the Commission if he wants true weighting, exposing the value judgment.

  ---

  ### Part 2: The Eligibility Procedure (Clerk Version)

  **Workflow:**
  1.  **Intake:** Applicant submits form + evidence (ID, lease, tax bill, flood map).
  2.  **Triage:** Clerk runs the 5 Questions.
  3.  **Output:** System generates Reason Code + Standing Assignment.
  4.  **Escalation:** If "Commission Review" code triggers, file is locked and sent to the 7-member body.

  #### The Questions (Order Matters)

  **Q1: Legal Capacity & Identity**
  *   *Ask:* Is the applicant a natural person aged 18+ OR a registered legal entity in good standing?
  *   *Sufficient:* Govt ID showing DOB OR Certificate of Incorporation/Registration.
  *   *Insufficient:* Birth certificate without ID, expired business license, verbal claim of representation.
  *   *Stop Point:* If NO, output **CODE-OUT-01**. Stop.

  **Q2: Domain Linkage (The "Hook")**
  *   *Ask:* Does the applicant have a verifiable link to the specific domain requested?
      *   *Fiscal:* Paid District fees/taxes in last 12 months?
      *   *Policing:* Physically present in District >15 days/quarter OR resides?
      *   *Land-Use:* Holds lease, deed, or resides >6 months?
      *   *Stormwater:* Property is within District OR is within the documented downstream floodplain (per Engineering Map v1.0)?
  *   *Sufficient:* Tax receipt, badge swipe logs, lease agreement, Engineering Map coordinate match.
  *   *Insufficient:* "I shop here," "I might move here," "I think the water flows that way."
  *   *Stop Point:* If NO for all requested domains, output **CODE-OUT-02**. Stop.

  **Q3: Subjection vs. Affectedness**
  *   *Ask:* Is the applicant subject to the *enforcement* of the rule, or only the *consequence*?
      *   *Enforcement:* Can the District fine/arrest/regulate them directly? (Yes = Subjection)
      *   *Consequence:* Does the rule change their environment without direct regulation? (Yes = Affected)
  *   *Sufficient:* "Yes, I can be fined" (Subjection). "Yes, my basement floods" (Affected).
  *   *Insufficient:* "It's unfair," "It lowers my property value" (unless mapped in Q2).
  *   *Note:* This determines Standing Type. Subjection = Vote. Affected (Externalities only) = Veto/Consult.

  **Q4: Contribution Threshold (Fiscal Domain Only)**
  *   *Ask:* Does the applicant's annual contribution exceed the "Significant Stakeholder" threshold (set at $50k/year)?
  *   *Sufficient:* Audited statement or tax form showing >$50k.
  *   *Insufficient:* Self-declaration, estimates.
  *   *Note:* This addresses the Boss's weighting concern by creating tiers.

  **Q5: Conflict of Interest / Double Voting**
  *   *Ask:* Does this applicant already hold a Full Vote in this domain through another capacity (e.g., a person voting individually and as a business owner)?
  *   *Sufficient:* Cross-reference ID/Tax ID against existing roll.
  *   *Insufficient:* "It's different hats."
  *   *Rule:* One human, one vote per domain. Entities get separate standing.

  #### Fixed Reason-Code List

  **Eligibility Grants:**
  *   **CODE-IN-FULL:** Eligible for Full Binding Vote. (Requires Q1 Yes, Q2 Subjection, Q5 Clear).
  *   **CODE-IN-ADV:** Eligible for Recorded-but-Non-Binding Vote. (Requires Q1 Yes, Q2 Subjection, but Entity or <6mo residency).
  *   **CODE-IN-VETO:** Eligible for Narrow Veto only. (Requires Q1 Yes, Q2 Affected/Externality, Stormwater Domain only).
  *   **CODE-IN-NOTICE:** Eligible for Notice-and-Comment only. (Requires Q1 Yes, Q2 Weak Link, or Age 16-17).

  **Eligibility Denials:**
  *   **CODE-OUT-01:** Failure of Legal Capacity (Under 18 or Unregistered Entity).
  *   **CODE-OUT-02:** No Domain Linkage (No stake in this specific issue).
  *   **CODE-OUT-03:** Duplicate Voting Right (Already registered in this domain).

  **Escalations (Commission Review):**
  *   **CODE-ESC-VAL:** Values Call. (Applicant claims "Affectedness" outside Stormwater map, or claims "Coercion" without legal basis).
  *   **CODE-ESC-POL:** Policy Conflict. (Applicant qualifies for Fiscal Full Vote, but Boss's Weighting Protocol would alter their weight. Requires Commission to authorize weighting schema).
  *   **CODE-ESC-RIGHT:** Rights Claim. (Applicant claims exclusion violates higher-level human/civil rights).

  #### Stop Points & Escalation Logic

  *   **Hard Stop (Clerk Decision):** Codes OUT-01, OUT-02, OUT-03, IN-NOTICE. These are factual. Either you have the ID or you don't. Either you are 17 or 18.
  *   **Commission Handoff:** Codes ESC-VAL, ESC-POL, ESC-RIGHT.
      *   *Why:* These are "values calls wearing fact questions' clothes."
      *   *Example:* A commuter claims the congestion charge is "coercion" (ASC) not just a fee. Clerk can't decide the political theory; Commission must decide if "fee" equals "law."
      *   *Example:* The Boss wants the $50k+ payers to have 10x votes. The procedure qualifies them for *a* vote. The *weight* is a policy decision that risks legitimacy. The Commission must ratify the weighting schema publicly.

  ---

  ### Part 3: The Tie-Breaking Principle

  **Principle:** **The Principle of All-Subjected to Coercion (ASC).**

  **Defense:**
  I am rejecting *All-Affected Interests (AAI)* as the primary tie-breaker because it is administratively infinite. Everyone is affected by everything in a connected economy. If we use AAI, the clerks cannot distinguish between a downstream flood victim and a foreign supplier concerned about zoning.

  ASC is the only principle that defines a *political* community rather than a *causal* network. It asks: "Who is bound by the Authority's enforcement power?"

  **However,** I am stretching ASC to cover the **Stormwater/Externality** case. Physical imposition of water is treated as a form of "coercion" (force without consent). This allows us to grant downstream residents standing without admitting that *any* affected party gets a vote. It keeps the boundary finite (geographic/hydrological) rather than infinite (economic/causal).

  **Why not Fiscal Contribution?**
  Because it converts citizenship into shareholding. It solves the "revenue" problem but creates a "legitimacy" crisis. We use contribution for *tiering* (access to information/veto), not for *weighting* votes, unless the Commission explicitly overrides this (see CODE-ESC-POL).

  ---

  ### Part 4: Entrenchment & Revision

  The roll cannot be static, or it becomes a gerrymandered fortress. But we cannot allow the Authority to rewrite the rules before every election.

  **Mechanism:** **The Sunset & Convention Clause.**
  1.  **Automatic Sunset:** The Eligibility Procedure expires every 5 years.
  2.  **Trigger:** 6 months before expiration, a **Citizens' Convention** is convened.
  3.  **Composition:** 50% Sortition from the *existing* Full Vote roll, 25% Sortition from the *Advisory/Notice* roll, 25% Appointed by the Commission (to ensure expertise/downstream representation).
  4.  **Power:** This Convention has sole power to propose changes to the Eligibility Procedure. The Authority can only accept or reject the package (no amendments).
  5.  **Why:** This prevents the current "ins" from rigging the rules to keep "outs" out forever. It forces the demos to re-constitute itself periodically.

  ---

  ### Part 5: Limitations (The Honest Section)

  **What this procedure cannot do:**
  1.  **Measure Intensity:** It treats a downstream resident whose house floods once a decade the same as one whose house floods weekly. Both get Veto standing. It cannot weight by *severity* of harm.
  2.  **Future Generations:** It has no mechanism for unborn residents or long-term climate impacts. It is strictly present-tense.
  3.  **Non-Human Interests:** It cannot grant standing to the ecosystem itself, only to humans affected by the ecosystem's treatment.
  4.  **Faking Precision:** The "15 days/quarter" rule for policing is arbitrary. A person present 14 days is treated fundamentally differently than one present 15 days. This is a necessary administrative fiction, but it is a fiction.
  5.  **Systematic Error:** It will systematically under-represent **precarious labor**. Dorm workers on 2-year contracts may fall through the residency cracks (Q2) while being highly subjected to policing. They will end up with Notice standing, not Vote.

  ---

  ### Part 6: Test Cases

  #### Case A: The 16-Year-Old Dorm Resident
  *   **Profile:** 16 years old. Lives in corporate dorms (2-year contract). Wants Policing & Land-Use Vote.
  *   **Procedure Run:**
      *   Q1 (Capacity): **FAIL.** Natural person, but age < 18.
      *   Q2 (Link): **PASS.** Resides in District.
      *   Q3 (Subjection): **PASS.** Subject to policing/zoning.
      *   **Decision:** **CODE-IN-NOTICE.** (Eligible for Notice-and-Comment only).
      *   **Escalation:** None. Clerk issues decision.
  *   **Reasoning:** Legal capacity is a bright line for clerks. While theoretically, they are subjected to coercion, the administrative cost of assessing "competence" for under-18s is too high. They get a voice, not a vote.
  *   **Who is Angry:** **You (The Theorist).**
  *   **Why They Are Right:** You know that "legal capacity" is a social construct, not a moral reality. This kid is subjected to the District's police power. Excluding them from the binding vote creates a class of subjects without representation. The procedure prioritizes administrative ease over democratic purity here.

  #### Case B: The Corporate Campus (Fiscal Roll)
  *   **Profile:** Large entity. Pays $2M/year in District fees. Wants Full Vote on Fiscal Roll.
  *   **Procedure Run:**
      *   Q1 (Capacity): **PASS.** Registered Entity.
      *   Q2 (Link): **PASS.** Fiscal contribution >$50k.
      *   Q3 (Subjection): **PASS.** Subject to fiscal rules.
      *   Q4 (Contribution): **PASS.** High tier.
      *   **Decision:** **CODE-ESC-POL.** (Policy Conflict).
      *   **Reasoning:** The applicant qualifies for *entry* to the roll. However, granting a *Full Vote* to an entity conflicts with the "One Person, One Vote" norm inherent in the Charter's democratic language, while granting *Weighted Vote* conflicts with political equality. The Boss wants weighting. The procedure flags this for the Commission to decide if entities get votes, and if so, whether they are weighted.
      *   **Who is Angry:** **Your Boss.**
      *   **Why They Are Right:** He was promised a procedure that handles his weighting idea. This procedure effectively kicks it upstairs, delaying his goal. However, he is *wrong* to expect a clerk to solve the tension between plutocracy and democracy. The procedure correctly identifies this as a values call, not a fact check.

  #### Case C: Downstream Town Residents (Stormwater)
  *   **Profile:** Residents 5 miles away. Not in District. Their basements flood when District changes drainage rules. Want Standing on Stormwater Roll.
  *   **Procedure Run:**
      *   Q1 (Capacity): **PASS.** Natural persons 18+.
      *   Q2 (Link): **PASS.** Engineering Map v1.0 confirms they are in the downstream floodplain.
      *   Q3 (Subjection): **PASS (Stretched).** Physical imposition of water is ruled as "Coercion/Force."
      *   **Decision:** **CODE-IN-VETO.** (Eligible for Narrow Veto on Stormwater changes that increase flow volume).
      *   **Escalation:** None. Clerk issues decision based on Map v1.0.
  *   **Reasoning:** Under the stretched ASC principle, forcing water onto their land is a coercive act. They are not subjected to District *law*, but they are subjected to District *physics*. They get a Veto to protect their baseline welfare, but not a Full Vote on other issues.
  *   **Who is Angry:** **Your Boss (and the District Residents).**
  *   **Why They Are Right:** This is politically toxic. You are giving outsiders veto power over local infrastructure. It looks like a loss of sovereignty.
  *   **Why They Are Wrong (Theoretically):** They are exporting harm. If the District can flood the town without the town's consent, the District is acting as a tyrant over that town. The Veto is the minimum corrective for an externality. This is the "Unpopular Outcome" that saves the District's moral legitimacy while costing it political convenience.

  ---

  ### Final Note to the Authority
  This procedure is designed to be run by clerks, but it is designed to *fail* gracefully where politics intrudes. The **CODE-ESC** series is your pressure valve. If the Boss pushes for weighting, or if the Downstream town sues, the procedure doesn't break; it escalates. That is the only way to survive the boundary problem without lying about it.
