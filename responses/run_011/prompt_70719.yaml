  **TO:** Group Risk Committee
  **FROM:** Group Actuary
  **DATE:** 24 October 2023
  **SUBJECT:** Capital Treatment for Instrument AX-9
  **CLASSIFICATION:** INTERNAL / CONFIDENTIAL

  **1. Purpose**
  This memorandum recommends a reserve position for the newly submitted reinsurance structure codenamed AX-9. The instrument involves a contingent liability schedule triggered by a binary stochastic process. Management requires a Best Estimate Liability (BEL) figure to determine capital allocation and pricing authority.

  **2. Payoff Structure**
  The instrument pays based on the trial number $n$ of the first successful event in a sequence of independent Bernoulli trials with $p=0.5$. The payoff is $+2^n/n$ for odd $n$ and $−2^n/n$ for even $n$. The probability of termination at trial $n$ is $2^{-n}$. The expected contribution of each branch is therefore $(-1)^{n+1}/n$. The first six branches are detailed below:

  | Trial ($n$) | Probability | Payoff ($) | Expected Contribution ($) |
  | :--- | :--- | :--- | :--- |
  | 1 | 1/2 | +2.00 | +1.00 |
  | 2 | 1/4 | −2.00 | −0.50 |
  | 3 | 1/8 | +2.67 | +0.33 |
  | 4 | 1/16 | −4.00 | −0.25 |
  | 5 | 1/32 | +6.40 | +0.20 |
  | 6 | 1/64 | −10.67 | −0.17 |

  **3. Valuation Methodology**
  Summing the expected contributions in ascending order of $n$ produces the alternating harmonic series. This series converges to $\ln 2$. Accordingly, the model outputs a Best Estimate Liability of $0.693147. This figure is reported to six decimal places to maintain consistency with group rounding policies.

  While the aggregate expectation is positive, the tail risk is significant. The probability that the first head falls on toss 30 is approximately one in one billion. The loss in that branch is approximately $35.8 million. Standard Value-at-Risk metrics do not capture this exposure within standard confidence intervals, yet the solvency impact would be material.

  **4. Enumeration Protocol**
  The positive branches alone diverge to infinity, and the negative branches alone diverge to negative infinity. Consequently, the expectation is not well-defined independent of the summation order. The reported $0.69 is an artefact of the order in which the branches happen to have been listed. It has been observed that the group's reserve for this risk is a consequence of the spreadsheet's default sort order.

  Per the Model Risk Policy, a standing function has been created to select whichever enumeration of the state space yields a reserve consistent with the group's stated risk appetite. This function rearranges the sequence of positive and negative terms to target a specific convergence value. This procedure is treated as a standard calibration step. The relationship to model-risk governance is documented in the Model Inventory, where the enumeration strategy is classified as a business rule rather than a model assumption.

  **5. Alternative Mitigations**
  Several escape routes were evaluated and dismissed for operational reasons. Truncating the schedule at a finite toss was considered; however, the truncation point must be set by committee. It was noted that moving the truncation point from 60 to 61 shifts the reserve by roughly 1.6 cents, some 2.4 per cent of the best estimate. This sensitivity was deemed unacceptable for financial reporting stability.

  Substituting a bounded utility function was rejected because the offering document promises dollars, not utils. Retroceding the tail to an entity that has not read the schedule was deemed incompatible with counterparty due diligence requirements. Finally, the possibility that the correct treatment is that expected-value reasoning delivers no verdict here at all was discarded, as the governance framework requires a numeric input to proceed.

  **6. Audit Observation**
  The external auditor's management letter addressed the valuation methodology directly:

  > "While the summation technique is arithmetically valid for the selected sequence, the reliance on sequence integrity introduces unquantified model risk. The financial statements imply a unique fair value where none exists mathematically. We recommend fixing the sequence permanently in the general ledger to ensure consistency across reporting periods."

  The objection is technically exact regarding the non-uniqueness of the value. The proposed remedy ensures consistency without addressing the arbitrariness of the selected consistency.

  **7. Recommendation**
  The Risk Committee is asked to approve the instrument with a reserve of $0.69. This recommendation follows the memorandum's own logic consistently: the value is valid provided the enumeration remains unchanged. We recommend approving the risk contingent on the IT department maintaining the current sort order in the valuation database. Any change to the indexing protocol will require a restatement of reserves.

  ***

  **SIDEBAR: MODEL RISK NOTE**

  **FAQ for Brokers**
  **Q: Why does the reserve change if we reorder the cash flows?**
  A: The instrument exhibits conditional convergence. The reserve reflects the specific sequence approved by the Risk Committee.
  **Q: Can we reorder the cash flows to reduce capital charges?**
  A: Yes, subject to Model Risk approval and alignment with the Group Risk Appetite Statement.
  **Q: Is the $35.8 million tail risk covered?**
  A: The tail risk is covered by the surplus generated from the rearrangement of earlier terms.
