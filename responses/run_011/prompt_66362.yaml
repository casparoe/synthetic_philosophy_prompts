answer: |-
  # The Signalling Game: Lesson Plan

  ## I. Game Design & Materials

  **Class Size:** 18 Students.
  **Roles:** 12 Senders (6 High Quality, 6 Low Quality), 6 Receivers.
  **Grouping:** 6 Tables. Each table has 2 Senders and 1 Receiver.
  *Note: Senders do not know the other Sender's type at their table. Receivers do not know the distribution of types in the room.*

  **Materials Needed:**
  1.  **Role Cards (18 total):**
      *   6 "High Quality" (HQ) Sender cards.
      *   6 "Low Quality" (LQ) Sender cards.
      *   6 "Receiver" cards.
  2.  **Decision Slips (60+ total):** Small slips for Senders to write signal choices.
  3.  **Match Slips (60+ total):** Small slips for Receivers to write match choices.
  4.  **Score Sheets (18 total):** One per student (see template below).
  5.  **Projector/Board:** To display Payoff Rules for each Round.

  **Vocabulary Ban:** Do not distribute any text containing the words *handicap, costly signal, index, cheap talk, equilibrium,* or *separation*. Use "Display," "Trait," "Message," "Cost," "Benefit."

  ### Score Sheet Template
  *(Print one per student)*
  ```text
  NAME: ___________________  ROLE: _______________  ROUND: _____

  1. Did you send/display a signal? (Y/N) ______
  2. Did you get matched? (Y/N) ______
  3. Benefit Points (if matched): ______
  4. Cost Points (if signal sent): ______
  5. Audit/Penalty Points: ______
  6. TOTAL SCORE (Benefit - Cost - Penalty): ______
  ```

  ---

  ## II. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup & Distribution**
  *   Hand out Role Cards face down. Tell students not to reveal their Type (HQ/LQ) to anyone.
  *   Hand out Score Sheets.
  *   Explain the basic loop: Senders choose a Display Level. Receivers choose a Sender to match with. Matches yield points. Displays cost points.

  **00:05 – 00:15 | Round 1: The Uniform Cost (Pooling)**
  *   **Project Rules:**
      *   **Benefit:** If Receiver matches with you: **+30 points**.
      *   **Cost:** If you choose Display Level 1: **-10 points** (Everyone pays 10).
      *   **Cost:** If you choose Display Level 0: **0 points**.
      *   **Receiver Goal:** Match with High Quality Senders. (Tell Receivers: "You get +10 bonus if you match HQ, 0 if LQ." Tell Senders: "Receivers prefer HQ.")
  *   **Play (3 mins):** Senders write 0 or 1 on Decision Slip. Receivers view signals, write ID of chosen Sender on Match Slip.
  *   **Score (2 mins):** Reveal matches. Students calculate scores.
  *   **Expected Outcome:** Both HQ and LQ choose Level 1. Receivers cannot distinguish. Random matches. LQ gains net +20.

  **00:15 – 00:25 | Round 2: The Differential Cost (Separation)**
  *   **Project Rules:**
      *   **Benefit:** Match = **+30 points**.
      *   **Cost:** Display Level 1.
          *   If you hold **HQ Card**: **-5 points**.
          *   If you hold **LQ Card**: **-40 points**.
      *   **Cost:** Display Level 0 = **0 points**.
  *   **Play (3 mins):** Same procedure.
  *   **Score (2 mins):** Calculate scores.
  *   **Expected Outcome:** HQ chooses Level 1 (Net +25). LQ chooses Level 0 (Net 0, because signaling yields -10). Receivers match only Level 1. Separation achieved.

  **00:25 – 00:35 | Round 3: The Fixed Trait (Index)**
  *   **Project Rules:**
      *   **Benefit:** Match = **+30 points**.
      *   **Signal:** No choice. You must show your Role Card color (e.g., HQ = Blue, LQ = Red).
      *   **Cost:** **0 points** for everyone.
  *   **Play (2 mins):** Senders reveal card color. Receivers match.
  *   **Score (3 mins):** Calculate.
  *   **Expected Outcome:** Perfect matching. No cost incurred. Honesty guaranteed by physics/biology, not choice.

  **00:35 – 00:45 | Round 4: The Policed Message (Conventional)**
  *   **Project Rules:**
      *   **Benefit:** Match = **+30 points**.
      *   **Signal Cost:** **0 points** (Free to send "I am HQ").
      *   **Audit:** Receiver may pay **-5 points** to check true Type.
      *   **Penalty:** If Sender lied and was Audited: Sender gets **-50 points**. Receiver gets **+10 bonus**.
  *   **Play (4 mins):** Senders claim HQ or LQ. Receivers decide: Match without Audit, Match with Audit, or Reject.
  *   **Score (1 min):** Calculate.
  *   **Expected Outcome:** Senders claim HQ. Receivers audit randomly or threaten to audit. If audit threat is credible, LQ stops lying.

  **00:45 – 00:50 | Round 5 (Optional/Survival)**
  *   *Only if running ahead of schedule.*
  *   **Rule:** Signal Cost is not subtracted from score. Signal Level reduces *probability* of surviving to collect score. (e.g., Level 1 = 50% chance to keep points).
  *   *Skip if tight on time; address conceptually in debrief.*

  **00:50 – 01:15 | Debrief & Adjudication**
  *   See Script Below.

  ---

  ## III. The Debrief Script (25 Minutes)

  ### Part 1: Mapping the Rounds (5 Minutes)
  **Instructor:** "Look at your score sheets. In Round 1, everyone signaled. Did the Receivers find the High Quality senders?"
  *(Students: No.)*
  **Instructor:** "Cost was real. Points were lost. But information was zero. In Round 2, the cost changed. Who signaled?"
  *(Students: Only HQ.)*
  **Instructor:** "Receivers found HQ every time. In Round 3, cost vanished. Honesty remained. In Round 4, cost vanished, but punishment appeared."

  ### Part 2: Adjudicating the Slogans (10 Minutes)
  **Instructor:** "I want you to judge two claims about why signals work."
  *   **Claim A:** "A signal is honest because it is wasteful. If it doesn't hurt, it doesn't count."
  *   **Claim B:** "A signal is honest because it hurts the liar more than the truth-teller."

  **Instructor:** "Look at Round 1. The signal was wasteful (10 points). Was it honest?"
  *(Class: No.)*
  **Instructor:** "So Claim A is insufficient. Waste alone buys nothing."

  **Instructor:** "Look at Round 2. The signal cost HQ 5 points. It cost LQ 40 points. Why did LQ stop?"
  *(Class: Too expensive.)*
  **Instructor:** "Did HQ find it expensive?"
  *(Class: Less so.)*
  **Instructor:** "Claim B fits Round 2. The *difference* in cost created the truth. The waste HQ endured was not the source of reliability; the ruin LQ avoided was."

  **Instructor:** "But look at Round 3. No cost. Total honesty. Claim A fails completely here. Claim B is irrelevant because there was no choice."

  **Instructor:** "And Round 4? The signal was free. But the *risk* was differential. LQ risked -50. HQ risked nothing (because they told truth). Honesty enforced by punishment, not physiology."

  **Verdict:** "Claim A (Waste) describes *some* signals (Round 2 HQ), but mistakes the side-effect for the cause. Claim B (Differential Cost) describes the *mechanism* of stability in Round 2. But neither covers Round 3 or 4. Honesty can be physical (Round 3) or social (Round 4)."

  ### Part 3: The "Honest but Cheap" Intervention (10 Minutes)
  **Instructor:** "There is a trap in Round 2. You paid 5 points to be honest. You might think: 'Honesty always costs something.'"
  **Instructor:** "Imagine Round 2 again. HQ Cost is 5. LQ Cost is 40. Separation works."
  **Instructor:** "Now, imagine LQ Cost is 1,000. They will never signal. What is the *minimum* HQ must signal to be believed?"
  *(Pause for thought)*
  **Instructor:** "If LQ cannot mimic *any* signal, HQ could signal at Level 0.1. Cost = 0.5. Or Level 0.01. Cost = 0.05."
  **Instructor:** "In the limit, if the LQ is weak enough, the HQ signal becomes trivial. It is still honest. It still separates. But it is no longer 'wasteful' for the HQ."
  **Instructor:** "This is the crucial philosophical point: **Stability requires the lie to be expensive, not the truth.** If the liar is physically incapable of mimicking you, your signal can be free. Your friend argued waste guarantees truth. You argued differential cost guarantees truth. The math shows: The liar's cost guarantees truth. The truth-teller's cost is just what remains after the liar quits."

  ---

  ## IV. Predictable Failure Modes & Fixes

  **1. The Accidental Bluff (Round 2)**
  *   **Problem:** An LQ student calculates: "If I signal, I lose 40. If I don't, I get 0. But if I bluff and the Receiver doesn't check the math, I might get +30." They signal anyway.
  *   **Result:** Pooling returns. Receivers get burned.
  *   **Fix:** During scoring, publicly announce: "Did any LQ signal? You lost points." Make the loss visceral. If Receivers stop trusting, pause and remind them: "Rational Senders maximize points. LQ signaling is suicide."

  **2. Receiver Apathy (Round 3 & 4)**
  *   **Problem:** Receivers realize matching is easy or tedious. They pick randomly to finish faster.
  *   **Result:** Data noise.
  *   **Fix:** Add a small competition element. "The Receiver with the most HQ matches gets 5 bonus points on the participation grade."

  **3. Collusion (All Rounds)**
  *   **Problem:** Friends at a table agree: "You signal, I won't, we split the points."
  *   **Result:** Artificial separation.
  *   **Fix:** **Anonymity.** Senders submit slips to the instructor, who shuffles them before giving to Receivers. Or, rotate tables every round so groupings change. *Recommendation:* Rotate roles every two rounds so no one stays with the same partners.

  **4. The "Honest but Cheap" Gap**
  *   **Problem:** As designed, Round 2 *does* cost HQ points (5). Students will fixate on this cost as necessary.
  *   **Fix:** This is why Part 3 of the Debrief is scripted as a counterfactual thought experiment. Do not skip the "Imagine LQ Cost is 1,000" question. It forces them to decouple honesty from HQ cost.

  ---

  ## V. Limitations: What the Game Cannot Reproduce

  You must verbally supply these caveats at the very end of class. The game simulates **rational choice**, but nature runs on **selection**.

  1.  **Reasoning vs. Replication:**
      *   *In Class:* Students looked at the payoff table and calculated the best move.
      *   *In Nature:* Peacocks do not calculate. Genes that produced tails too heavy for weak birds died out. Genes that produced tails manageable for strong birds survived. The "calculation" was done by extinction over millennia, not by brains in minutes.
      *   *Teaching Point:* "You acted like economists. Evolution acts like a filter. The outcome is the same (stable signaling), but the mechanism is blind."

  2.  **One-Shot vs. Repeated:**
      *   *In Class:* This was a single interaction.
      *   *In Nature:* Signaling systems exist in populations over generations.
      *   *Teaching Point:* "In Round 4, you trusted the audit threat. In nature, that trust is built because bluffers *actually died* or failed to reproduce in the past. The history is in the instinct."

  3.  **Discrete vs. Continuous:**
      *   *In Class:* You chose Level 0 or 1.
      *   *In Nature:* Tail length is a continuum.
      *   *Teaching Point:* "The logic holds for continuous traits, but the 'margin' where separation happens is a sliding scale, not a switch."

  4.  **The Currency Problem:**
      *   *In Class:* Points were additive (Benefit - Cost).
      *   *In Nature:* Costs are often multiplicative (Survival Probability). A heavy tail doesn't just subtract energy; it increases the chance of being eaten by a tiger *before* you mate.
      *   *Teaching Point:* "If we played Round 5, you'd see that high costs don't just reduce your score; they remove you from the game entirely. This makes the 'Differential Cost' argument even stronger, because the LQ doesn't just lose points, they vanish."

  **Final Instruction to Instructor:**
  "When you dismiss them, restate the core philosophical victory: Your friend was right that cost is often present, but wrong that cost is the *source* of honesty. You were right that differential cost is the source, but remember to acknowledge that sometimes (Round 3 & 4), cost isn't needed at all. The truth is messier than either slogan."
