  10. **Final Polish:** Ensure tone is professional and supportive of the user's ethical stance. (The user is right to be worried; "Copilot" is marketing fluff here).

  *(Self-Correction on the "Copilot" definition)*: In software (like GitHub Copilot), the code doesn't run until the human accepts it. In this nonprofit's case, the message *sends*. This is the crux. I must highlight this discrepancy.

