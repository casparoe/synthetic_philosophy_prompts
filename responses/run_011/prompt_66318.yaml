  Bottom line: Your position is salvageable only with a specific repair, because the "re-ranking" patch handles the surface grammar but doesn't yet explain why some rankings are valid and others aren't. You can keep the expressivist core, but if you want to preserve the idea that someone can be *wrong* (not just different), you will need to adopt a "quasi-realist" framework that earns the right to talk about truth and error within the practice without smuggling in realist metaphysics.

