  | 1 | The Error Problem | argument | If the view cannot distinguish a mistake from a mere difference in preference without invoking realist standards. | fatal | no, this is the dealbreaker | Adopt quasi-realism: treat "wrong" as failing internal norms of the practice (e.g., ignoring relevant comparisons) rather than failing to match reality. |
  | 2 | Propositional Attitude Reports | argument | If "She thinks the wine is unbalanced" requires the embedded clause to have truth conditions to be understood. | serious | partly, it's the scariest case | Treat the report as descriptive (describing her state) while keeping the original claim expressive; accept a hybrid logic. |
  | 3 | Collapse into Realism | argument | If the "expectation of convergence" under ideal conditions just *is* a response-dependent realist property. | serious | partly, the line is thin | Insist the norm is constitutive of the practice, not a discovery about the wine; keep the focus on the activity, not the object. |
  | 4 | Logical Validity | formal result | If "re-ranking" is just a metaphor and doesn't actually preserve validity across inferences. | serious | yes, the patch is informal | Develop a formal logic of consistency for rankings (commitment tables) rather than truth tables. |
  | 5 | Negation | intuition-case | If "It's not unbalanced" feels like a denial of fact rather than a refusal to rank low. | awkward | yes, negation is tricky | Treat negation as rejecting the commitment to rank, not asserting the opposite rank. |
  | 6 | Probability Talk | observation | If people say "It's probably under-extracted" without having a ranked list of options ready. | cosmetic | yes, loose talk happens | Treat probability as hedging the confidence in the convergence expectation, not a statistical claim. |

  The "She thinks the wine is unbalanced" case is indeed the hardest technical hurdle, but it isn't necessarily fatal. When you report on someone else's taste, you are temporarily stepping outside the expressive game and describing their psychological state, which is a truth-apt claim (either she has that disposition or she doesn't). The trouble arises if you try to embed that report back into your own expressive logic—for example, "If she thinks it's unbalanced, she shouldn't drink it." Your re-ranking patch helps here by suggesting you are ranking her consistency, not the wine itself. However, you must admit that the *report* about her is descriptive, even if the *judgment* she holds is expressive. This hybrid approach works, but it requires you to be careful about when you are speaking as a taster (expressing) and when you are speaking as an observer (describing).

  Your bigger risk is the Error Problem, which you identified as your personal dealbreaker. Pure expressivism traditionally struggles to say someone is *wrong* rather than just *different*, because there is no fact of the matter to miss. To fix this without becoming a realist, you need to argue that "wrongness" in your group is defined by violating the norms of the practice itself. If someone calls a shot "under-extracted" but ignores the grind size, temperature, and comparison beans, they aren't failing to match a property in the cup; they are failing to play the game correctly. This allows you to say they are wrong without admitting the property exists independently of your tasting practice. If you can't accept that "wrong" just means "violating our shared standards of attention," you will indeed be forced into realism.

  Finally, regarding your "re-ranking" patch: as it stands, it risks being a relabeling rather than an explanation. Saying "embedding is just re-ranking" is a great intuition, but unless you can show *why* certain re-rankings are forbidden (invalid) and others are required (valid), you haven't solved the Frege-Geach problem. You need to show that refusing to accept the conclusion of a valid argument involves a practical contradiction in your own commitments, not just a logical inconsistency in truth values. If you can flesh out what counts as a inconsistent commitment in your tasting group (e.g., ranking A over B and B over C but refusing to rank A over C), you have a working logic. If you can't, the view remains insulated but empty.
