answer: |-
  This is a classic instantiation of the **Spectrum Argument** (or Continuum Argument), formalized in population ethics by Gustaf Arrhenius's Impossibility Theorems. You have stumbled onto the central structural problem of long-term value theory.

  You asked for a specification (desiderata) before axiom selection. Below is the spec, followed by the impossibility proof, the identification of the "killer" constraint, and the scorecard.

  ### Part 1: The Desiderata Specification

  I have categorized these into **Logical**, **Structural**, and **Practical** requirements. I have flagged which are non-negotiable for a *policy ranking tool* versus which are contested in *pure axiology*.

  #### 1. Transitivity of All-Things-Considered Betterness
  *   **The Requirement:** If Scenario $A$ is better than $B$, and $B$ is better than $C$, then $A$ must be better than $C$.
  *   **The Case:** Without this, you cannot rank a set of options. If $A \succ B \succ C \succ A$, there is no maximal element. You cannot advise a policymaker to "pick the best" if the relation cycles.
  *   **Status:** **Non-Negotiable for Policy.** (Contested in pure axiology; Temkin and Rachels argue value itself may be intransitive).

  #### 2. Completeness (Comparability)
  *   **The Requirement:** For any two scenarios $A$ and $B$, either $A \succeq B$, $B \succeq A$, or they are equally good. (No "incomparable" or "on a par" outcomes).
  *   **The Case:** You have a dozen scenarios to sort. If the theory returns "A and B are incomparable," you have no decision procedure. You need a strict ordering or at least a maximal set.
  *   **Status:** **Non-Negotiable for Policy.** (Contested in pure axiology; Chang and Broome argue value can be incomplete).

  #### 3. Pareto (Dominance) Condition
  *   **The Requirement:** If Scenario $A$ has the same population as $B$, and everyone in $A$ is at least as well off as in $B$, with some strictly better off, then $A \succ B$.
  *   **The Case:** It seems sadistic or irrational to prefer a world where everyone is worse off.
  *   **Status:** **Camp Preference.** (In population ethics, this is tricky. If populations differ, the "Non-Identity Problem" arises. Many total views accept a version of this; person-affecting views struggle with it. For fixed-population comparisons, it is near-universal).

  #### 4. Granularity Invariance (Sorites-Stability)
  *   **The Requirement:** The verdict on the chain ($A$ vs. $Z$) should not depend on how finely you carve the intermediate steps. If you describe the transition from $A$ to $Z$ as 10 steps or 10,000 steps, the relation between endpoints should remain stable.
  *   **The Case:** If a theory says $A \succ Z$ when there are 10 steps, but $Z \succ A$ when there are 1,000 steps (because a "threshold" was crossed in the finer description), the theory is sensitive to description rather than reality. This is a form of framing bias.
  *   **Status:** **Non-Negotiable.** (This is a robustness condition. If value is real, it shouldn't depend on the resolution of your model).

  #### 5. Phenomenological Fidelity
  *   **The Requirement:** The theory must explain *why* experts judge $B \succ A$ in adjacent steps, rather than simply declaring the intuition false.
  *   **The Case:** If 100 experts say "B looks slightly better than A," a theory that says "You are hallucinating; they are equal" loses credibility. A theory that says "They are on a par, but B has a slight advantage on dimension X" preserves the intuition without committing to strict betterness.
  *   **Status:** **Preference.** (Hardliners like Broome will bite the bullet and say the intuition is mistaken. Softliners like Parfit try to accommodate it).

  #### 6. Auditability (Traceability)
  *   **The Requirement:** For any verdict $A \succ B$, the theory must identify which dimension(s) of value drove the difference (e.g., "A wins on liberty, B wins on welfare, but liberty is weighted higher").
  *   **The Case:** In policy, you must defend the ranking. "The black box said so" is insufficient. You need to know if a scenario was rejected because of low welfare or high existential risk.
  *   **Status:** **Smuggled Practical Requirement.** (Pure axiologists do not care about auditability; they care about truth. This is a constraint of your institutional setting, not value theory itself).

  #### 7. Dynamic Consistency (Money-Pump Immunity)
  *   **The Requirement:** The preference relation should not expose the agent to a sequence of trades that leaves them worse off than they started (a money pump).
  *   **The Case:** If $A \succ B \succ C \succ A$, an agent could trade $A \to C$ (paying a fee), $C \to B$ (paying a fee), $B \to A$ (paying a fee), ending with $A$ but less money.
  *   **Status:** **Conditional.** You noted this is a one-shot decision. In a one-shot context, money pumps cannot *actually* exploit you. However, Dynamic Consistency is usually taken as a proxy for Rationality. If your ranking is money-pumpable, it implies your preferences are structurally irrational, even if you only act once.
  *   **Verdict:** Keep it as a **Soft Constraint**. It signals structural coherence even if exploitation is impossible.

  ---

  ### Part 2: The Impossibility Result

  You suspected that $\{Transitivity, Pareto, No Sharp Cutoff, Completeness\}$ cannot all hold. **You are correct.**

  This is not just a suspicion; it is the core of **Arrhenius's Impossibility Theorems** and the logic behind Parfit's *Repugnant Conclusion*.

  **The Argument:**
  1.  **Assume Transitivity & Completeness:** You have a coherent ranking.
  2.  **Assume Pareto:** A world with more happy people is better (ceteris paribus).
  3.  **Assume No Sharp Cutoff (Continuity):** For any world $A$ with very high quality of life, there is a world $B$ with slightly lower quality but significantly more people that is at least as good as $A$. There is no specific point where a tiny loss in quality suddenly becomes catastrophic.
  4.  **The Chain:** By repeating step 3, you generate a chain $A \succ B \succ C \dots \succ Z$.
  5.  **The Endpoint:** $Z$ is a world with massive population but lives barely worth living.
  6.  **The Contradiction:** Transitivity forces $A \succ Z$. This is the **Repugnant Conclusion**. Most people (and your experts) intuit $Z$ is *not* better than $A$ (or that $A$ is better than $Z$).
  7.  **The Spectrum Variant:** If your experts say $A \succ B \succ \dots \succ Z$ but also $Z \succ A$ (or $Z$ not worse than $A$), they are explicitly violating Transitivity.

  **Conclusion:** There is **no adequate theory** that satisfies all these desiderata simultaneously. You must drop one.

  ---

  ### Part 3: The "Killer" Constraint

  Which requirement knocks out the most candidates?

  **The Killer is: "No Sharp Cutoff" (Continuity).**

  *   **Why:** To avoid the Repugnant Conclusion *and* keep Transitivity, you must posit a **Lexical Threshold** (a Sharp Cutoff). You must claim that at some point in the chain, a tiny decrease in quality of life *cannot* be compensated by any increase in population.
  *   **The Cost:** This violates **Granularity Invariance** and **Phenomenological Fidelity**. It implies that between Step 50 and Step 51, a microscopic change in welfare triggers a massive change in value rank. This seems arbitrary ("dodgy," as you put it).
  *   **Alternative:** If you keep Continuity (No Sharp Cutoff), you must drop **Transitivity** (Temkin's view) or accept the **Repugnant Conclusion** (Total Utilitarianism).

  **Secondary Killer: Completeness.**
  *   If you allow **Incomparability** (Chang's Parity), you can block the chain. $A$ is better than $B$, $B$ better than $C$... but at some point $Y$ and $Z$ are "on a par." Transitivity doesn't apply across parity.
  *   **The Cost:** This violates your **Policy Non-Negotiable**. You cannot rank a dozen scenarios if some are "on a par." You need a decision.

  ---

  ### Part 4: Smuggled vs. Pure Requirements

  You asked to flag requirements smuggled in from your practical setting.

  1.  **Completeness (Maximality):**
      *   *Pure Axiology:* Value can be incomplete. It is a fact about the world that $A$ and $B$ might not be comparable.
      *   *Your Setting:* You must pick one. You have smuggled **Decision-Readiness** into the theory of value. You are demanding that *value* be actionable, which it may not be.
  2.  **Auditability:**
      *   *Pure Axiology:* Irrelevant. If Utilitarianism is true, it's true, even if calculating the utility is opaque.
      *   *Your Setting:* Essential for legitimacy.
  3.  **Pareto (in Population Contexts):**
      *   *Pure Axiology:* Highly controversial. Does adding a happy person make the world better if no existing person is affected? (The Mere Addition Paradox).
      *   *Your Setting:* You likely assume "More happy people = Good." This biases you toward Total Utilitarianism, which guarantees the Repugnant Conclusion.

  **Challenge to your "Obviously In There" list:**
  You listed **Pareto** as obvious. In long-run scenarios where population size varies, **Pareto is not obviously valid.** If Scenario $A$ has 1 billion very happy people, and Scenario $B$ has 1 billion + 1 very happy people, is $B$ strictly better? Total views say yes. Average views say no (if the average drops). Critical-level views say no (if the new person is below the critical level). Demanding Pareto here pre-judges the population ethics debate.

  ---

  ### Part 5: Scorecard of Existing Theories

  Here is how the major contenders fare against your spec.

  | Theory | Transitivity | Completeness | Avoids Repugnant Conclusion | Granularity Invariance | Auditability | Verdict for You |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** (Parfit's target) | Yes | Yes | **No** (Embraces RC) | Yes | High (Single metric) | **Fail.** Delivers the result your experts reject. |
  | **Intransitivism** (Temkin, Rachels) | **No** | Yes | Yes | Yes | Medium | **Fail.** Violates your Non-Negotiable #1. Cannot rank options for policy. |
  | **Hard Transitivity** (Broome) | Yes | Yes | **No** (Bites bullet on RC or Cutoff) | **No** (Requires lexical thresholds) | High | **Fail.** Requires accepting "Sharp Cutoffs" experts will reject. |
  | **Parity / Incompleteness** (Chang) | Yes* | **No** | Yes | Yes | Low | **Fail.** Violates your Non-Negotiable #2. Leaves you with unranked options. |
  | **Lexical Threshold Views** (Rawls, Griffin) | Yes | Yes | Yes | **No** (Sharp Cutoffs) | Medium | **Possible.** But you must defend the "cliff" where small changes matter massively. |
  | **Vagueness / Imprecision** (Parfit's later view) | Yes | Yes (with imprecision) | Yes | Yes | Low | **Best Fit.** Allows "imprecise equality" to block the chain without formal intransitivity. |

  *\*Broome argues parity preserves transitivity of "better than," but blocks the chain via "incomparable."*

  ### Final Recommendation

  You are looking for a theory that is **Policy-Actionable** (Transitive, Complete) but **Intuition-Preserving** (No Repugnant Conclusion, No Sharp Cutoff).

  **The honest conclusion:** **No such theory exists.**

  You must choose your poison:
  1.  **Accept Intransitivity:** Tell the policy outfit, "We cannot rank these linearly. We have a cycle." (Likely career-limiting).
  2.  **Accept Incompleteness:** Tell them, "We can narrow it to 3 top candidates, but cannot distinguish between them." (Politically difficult, but honest).
  3.  **Accept a Sharp Cutoff:** Defend a Lexical View. "At some point, quality of life trumps quantity, even by a margin of 0.0001%." (Philosophically defensible, intuitively harsh).
  4.  **Accept Imprecision (Parfit):** Use a model that allows for "rough equality." $A$ is not better than $B$, $B$ is not better than $A$, but they are not *exactly* equal. They are *imprecisely* equal. This blocks the transitivity chain without formal intransitivity.

  **My advice:** Adopt **Imprecise Comparability** (a la Parfit or Broome's "imprecise equality"). It is the only framework that respects Transitivity (strictly speaking), avoids the Repugnant Conclusion, and explains the expert intuition without declaring them irrational. However, you must warn your outfit that this yields **partial orderings**, not a single winner. If they demand a single winner, they are demanding a fiction.
