      *   **[Stated]:** All things are "closely bound" (determinism/entanglement).
      *   **[Stated]:** This Moment determines the Future ("draweth all coming things after it").
      *   **[Imported] (Draw-Along]:** If A determines B, and B eventually leads back to A, A determines A.
      *   **[Imported] (Draw-Along]:** The "binding" is strong enough to enforce identity, not just similarity.
  *   "For whatever CAN run its course of all things, also in this long lane OUTWARD—MUST it once more run!"
      *   **[Stated]:** The logic of the Past lane applies to the Future lane.
      *   **[Stated]:** Possibility ("CAN") converts to Necessity ("MUST") in the future direction.
  *   "And this slow spider... and thou and I... must we not all have already existed?"
      *   **[Stated]:** The recurrence includes specific, trivial details (identity of indiscernibles).
  *   "—And must we not return and run in that other lane out before us... must we not eternally return?"
      *   **[Conclusion 2]:** Eternal Recurrence is necessary.

