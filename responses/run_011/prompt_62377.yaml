prompt: |-
  So slightly embarrasing situation I could use some help thinking through. I spent about two years saving for a 1968 chronograph — the exact reference I'd been reading about forever — and the seller swore it was all original, never touched. Last week some guy on a forum pointed out that the dial had been refinished, probably sometime in the 90s. The movement runs great, it keeps better time than my phone, and I genuinely love wearing it. Nothing about the watch actually changed, but now it feels different in my hand, like I got played.

  My friend says it's worth maybe half what I paid, but I never planned on selling, so I don't think that's what's bothering me. What I can't work out is: if I couldn't see the difference before and I still can't, what exactly did I lose? And someone told me that if the redial had been done by the factory's own service department instead of an independent guy, collectors wouldn't have blinked — which makes even less sense, because either way it's not the original dial.

  Is there anything real going on with this feeling besides snobbery and caring what a forum thinks? And would it be the same thing I'd feel if I found out a "handmade" table I bought was actually factory-made but looked identical, or is that a different problem entirely?
