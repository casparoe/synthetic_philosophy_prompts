          1.  **Item 4 vs. Items 2 & 3.** (The biggest problem). Item 4 suggests you *should* take the quantum gamble because you'll experience survival. Items 2 & 3 say you *shouldn't* because the weight is low. You can't have both.
          2.  **Item 7 vs. Item 1.** (The Uncertainty Problem). If all happens, probability is hard to define.
