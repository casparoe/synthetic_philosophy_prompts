answer: |-
  **Activity: The Vessel Vote**

  **Setup & Roles**
  Select one volunteer (the **Target**) to leave the room. They write a difficult personal choice (A or B) on a slip, seal it in an envelope, and leave. The remaining 13 students (**Fragments**) receive index cards. Each card contains one true psychological trait or memory of the Target (e.g., "Target values loyalty over honesty," "Target fears being pitied"). No single card reveals the choice.

  **Rules & Materials**
  Whiteboard, envelope, index cards. Fragments must discuss the Target's likely choice using only the information on their cards. They cannot guess randomly; they must reason from the traits.

  **The Forced Choice & Stake**
  After 20 minutes, the Fragments must nominate one among them to become the **Vessel**. This person is not voting *for* the Target; they are voting *as* the Target. They open the envelope and read the choice aloud.
  *Stake:* If the Vessel's reasoning convinces the returning Target that "yes, that is truly how I think," the Vessel chooses the seminar topic for next week. If the Target rejects the Vessel's authenticity ("That's not me"), the entire class must stand for the remainder of the next session. This makes the nomination politically uncomfortable; you are betting your comfort on someone else's claim to *be* you.

  **Running Order (90 mins)**
  *   **0–10:** Target exits, writes choice, distributes cards.
  *   **10–30:** Fragments discuss. Encourage first-person speech ("I value loyalty...").
  *   **30–50:** Nomination process. Who embodies the pattern best? Debate must be explicit about *why* this person holds the self.
  *   **50–60:** Vessel votes. Target returns, opens envelope, judges authenticity.
  *   **60–90:** Debrief.

  **Debrief**
  Do not mention Hofstadter yet. Ask: "When the Vessel spoke, who was speaking?" Map their answers to Hofstadter's "strange loop": the Target's pattern was distributed across the Fragments (the cards) and temporarily consolidated in the Vessel. The "self" survived the Target's exit because the syntax of their personality was instantiated in the room.

  **Handling Pushback:** Students will say, "Predicting Mom's reaction isn't having Mom inside me."
  *Response:* Ask, "What is 'Mom' made of? If not her reactions, values, and memories, what remains?" Hofstadter argues the pattern *is* the substance. If you run the software perfectly, the ghost is in the machine. The discomfort they felt nominating the Vessel proves they sensed the ontological weight, not just epistemic guessing.

  **Failure Modes & Recovery**
  *   **Predictable Failure:** Students treat it as a logic puzzle ("Card 3 + Card 5 = Choice A"). They detach emotionally.
  *   **Recovery:** Freeze the discussion. Ask the current speaker: "Whose voice is coming out of your mouth?" Force them to acknowledge the role-play is becoming identity-claiming.
  *   **The Missing Feature:** This activity cannot reproduce **qualia**. It demonstrates structural/behavioral distribution, not the *feeling* of being the other. The Fragments hold the Target's data, but not their pain. You must supply this by hand in the debrief: acknowledge that while the pattern survives, the "inner light" is unique, yet Hofstadter argues the pattern is what matters for identity survival. The activity proves the smearing; you must argue why the smearing counts as survival.
