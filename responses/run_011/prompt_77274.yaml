answer: |-
  Elias works in his family's hardware store. He spends weekends re-sorting bins of obsolete brass screws by thread pitch instead of size. This slows nothing, harms no customers, and increases no profit. No one values this order but Elias. He knows the screws will never be sold and that outsiders see no point. He does not do it to learn skills or please his father. He does it because maintaining this specific order is the central commitment around which he structures his daily identity. He imagines the chaos vividly and rejects it. The act is permissible; no one cares. Outsiders see no market or aesthetic worth in the arrangement.

  (a) Internalism holds reasons derive from the subjective motivational set. The route begins with Elias's ground project of identity-through-order. Deliberation confirms sorting sustains this project. Since the motivation survives scrutiny, he has a reason.
  (b) Value-based externalism holds reasons derive from objective goodness. The sorting creates no utility, beauty, or moral worth recognizable outside Elias's psyche. Since the act lacks independent value, there is no reason to do it, though it is not forbidden.
  (c) The feature is the absence of objective value coinciding with subjective commitment. If removed by adding objective worth, the externalist verdict becomes yes while the internalist remains yes. If removed by eliminating subjective commitment, the internalist verdict becomes no while the externalist remains no. In either alignment, the disagreement vanishes.
  (d) Williams argues external reason statements are false if they cannot link to motivation via rational deliberation. He would claim the externalist merely expresses a wish that Elias valued what they value. Given condition 3, this attack succeeds; the externalist cannot point to any fact Elias ignores that would generate motivation, rendering their claim empty.
