  She is running the **Capital Ownership** rule. For Marxists, exploitation is a structural relationship between wages and value produced, not a measure of suffering or freedom. Your stock grants are a retention mechanism, not ownership control. The founders and VCs retain the right to the residual profit, which defines the exploitative relation.

