      *   **The Defense (Defenders):** Hume is a naturalist. It's calibration, not definition. Qualities of judges are inferred inductively from persistent agreement among experienced observers. Rules are too coarse; authority lies in persons. The objection assumes a standard must be a pre-executable procedure. Hume rejects this.
