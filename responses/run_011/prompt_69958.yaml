answer: |-
  You are absolutely right to feel that "nothing moves at an instant" is a shapeshifter. In the literature on Zeno and the metaphysics of time, that sentence is a homonym for at least four distinct claims. Your housemate is sliding between them to make the "begging the question" charge stick.

  Here is the menu of distinct precise claims that sentence could be expressing, evaluated by your criteria.

  ### The Menu of Claims

  #### 1. The Kinematic Truism
  **Claim:** "Displacement requires duration. Since an instant has zero duration, zero displacement occurs *within* it."
  *   **Compatible with Derivative?** **Yes.** This is built into the definition of the derivative ($\lim_{\Delta t \to 0}$). It acknowledges that $dx$ is not a distance traveled *in* $dt$, but a rate.
  *   **Licenses 'Begging the Question'?** **No.** This is a definition, not a metaphysical denial of motion. It doesn't imply the arrow is "at rest"; it implies "moving at an instant" is a category error if you mean "traversing space inside the instant."
  *   **Defended By:** **Everyone.** Physicists and metaphysicians agree on this. It is analytically true given standard definitions of "instant" and "displacement."

  #### 2. The Russellian Reduction (The "At-At" Theory)
  **Claim:** "Velocity is not a primitive property of an object at $t$; it is a logical construction out of the object's positions at $t$ and times neighboring $t$."
  *   **Compatible with Derivative?** **Yes.** This *is* the standard calculus solution (championed by Bertrand Russell). It says motion *just is* occupying different places at different times.
  *   **Licenses 'Begging the Question'?** **Only if you assume Zeno's definition of motion.** If you think motion must be an intrinsic "glow" at $t$, then yes, this begs the question. But the standard reply is that Zeno's definition is the incoherent one.
  *   **Defended By:** **Most Physicists & "Ockhamist" Metaphysicians.** Physicists treat velocity as a state variable derived from the trajectory. Metaphysicians like David Lewis defend this reductionist view.

  #### 3. The Intrinsicness Denial
  **Claim:** "The intrinsic physical state of the world at $t$ (the 'snapshot') does not fix whether the object is moving or at rest. Two worlds could be identical at $t$ but differ on motion."
  *   **Compatible with Derivative?** **Yes, technically.** The derivative depends on the neighborhood, not just the point. However, in classical mechanics, we treat position and momentum ($mv$) as the "state" at $t$. This claim challenges whether momentum is *really* at $t$ or just a label for the trajectory.
  *   **Licenses 'Begging the Question'?** **Yes.** This is the strongest version of your housemate's charge. If the state at $t$ doesn't determine motion, then explaining motion via derivatives explains it via *non-instantaneous* facts, allegedly conceding that nothing is happening *at* $t$.
  *   **Defended By:** **Some Metaphysicians (e.g., Michael Tooley).** This is a live debate. Tooley argues for "Instantaneous Velocity Realism" (velocity *is* intrinsic/causal) against the Russellian view. Physicists generally don't care, provided the math works.

  #### 4. The Bergsonian Flow (Process Philosophy)
  **Claim:** "Real motion involves a qualitative 'passage' or 'flux' that cannot be captured by a static series of coordinates (the 'cinematographic' illusion)."
  *   **Compatible with Derivative?** **No.** Calculus staticizes time into a map of coordinates. This claim asserts that the map leaves out the territory (the actual moving).
  *   **Licenses 'Begging the Question'?** **Yes.** If this is what "motion" means, then calculus explicitly fails to describe it.
  *   **Defended By:** **Process Philosophers (Henri Bergson, Whitehead).** **Not** by working physicists, who find the distinction operationally meaningless.

  ---

  ### Diagnosis: What Your Housemate Needs

  For your housemate's argument to go through (that Zeno was never answered and calculus begs the question), he needs **Claim 4 (The Bergsonian Flow)** or a very strong version of **Claim 3 (The Intrinsicness Denial)**.

  *   **If he means Claim 1 (Truism):** He is right, but it doesn't support his conclusion. (See "The Loophole" below).
  *   **If he means Claim 2 (Russellian):** He is wrong that it begs the question. This *is* the answer. It redefines motion to make it coherent.
  *   **If he means Claim 3 or 4:** He is making a substantive metaphysical claim that contradicts standard physical ontology. He is no longer doing physics; he is doing process metaphysics.

  **The "Begging the Question" Charge:**
  The charge only sticks if you assume **Claim 4**. If motion *requires* a flux that isn't captured by coordinates, then defining velocity as a derivative *does* beg the question against that definition. But the standard philosophical consensus is that Claim 4 is incoherent (you can't measure or define "flux" without coordinates). So, while he is logically consistent *if* he assumes Bergson, he is assuming a premise most philosophers and all physicists reject.

  ### The Loophole: Literally Right, Conclusion Wrong

  There is a reading on which he is **literally right** but his **conclusion does not follow**. This relies on **Claim 1 (The Kinematic Truism)**.

  *   **He is right:** "Nothing moves *in* an instant." (No distance is covered in zero time).
  *   **His Conclusion:** "Therefore, the arrow is always at rest, and motion is impossible."
  *   **Why it fails:** This is a **Fallacy of Composition**. Just because no displacement happens *in* any single instant, it does not follow that no displacement happens *across* the series of instants.
      *   *Analogy:* A movie consists of static frames. Nothing moves *in* a single frame. It does not follow that nothing moves *in* the movie.
      *   The derivative bridges this gap. It shows how a property (velocity) can be defined at a point without requiring displacement *inside* the point. He is treating "motion at an instant" as if it must mean "displacement inside an instant," which is the confusion Zeno exploited.

  ### Bonus: Do the Arrow and Dichotomy Stand or Fall Together?

  **Verdict: No. He is mostly wrong, but there is a nuanced connection.**

  1.  **Different Problems:**
      *   **The Dichotomy** is about the **sum of an infinite series** (Can you traverse infinitely many intervals?). This is solved by the convergence of geometric series ($\sum 1/2^n = 1$).
      *   **The Arrow** is about the **nature of the instant** (Is motion intrinsic to a moment?). This is solved by the Russellian "At-At" theory of motion.

  2.  **Why they are distinct:**
      *   You can accept that infinite sums converge (solving Dichotomy) but still be puzzled by how an object "knows" where to go next if it's static at every instant (Arrow).
      *   Conversely, you could accept the "At-At" theory of motion (solving Arrow) but deny that infinite sums are physically real (e.g., if space is discrete, the Dichotomy doesn't even get off the ground).

  3.  **Where he might be onto something:**
      *   They stand together only if you adopt a specific view of **Time's Structure**. If you believe time is "gunky" (every interval has sub-intervals, no point-like instants exist), then the Arrow paradox dissolves (because there are no instants to be at rest in), but the Dichotomy becomes harder (how do you sum intervals without points?).
      *   If you believe time is **discrete** (atoms of time), the Dichotomy vanishes (finite steps), but the Arrow returns with a vengeance (how do you jump from one atom to the next without traversing the gap?).

  **Summary for your next argument:**
  Tell him he's conflating the **Kinematic Truism** (no distance in zero time) with the **Bergsonian Flow** (motion requires magic flux). He's right about the first, but the first doesn't prove the second. And regarding the Dichotomy: tell him to check a textbook on convergent series; that puzzle was killed by Cauchy in the 1820s, while the Arrow is still a metaphysical debate about intrinsic properties. They live in different houses.
