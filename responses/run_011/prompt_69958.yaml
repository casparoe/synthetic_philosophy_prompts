prompt: |-
  My housemate's a physics undergrad and he's been running Zeno's arrow at me all week — the one where the arrow supposedly occupies a space equal to itself at every instant, and so is at rest at every instant, and so never moves. Every time I say "that's just Zeno, calculus answers it, velocity at an instant is a perfectly well defined derivative," he says the exact same sentence back: nothing moves at an instant. And he's not using it as a throwaway line. He's using it to argue that the calculus reply begs the question, because the derivative at t is fixed by what happens at times other than t — so if that's your account of motion, you've already granted that motion isn't anything real at a moment, which was Zeno's whole point. Then he adds that this means the arrow was never really answered, and that the dichotomy was the only one of them that was ever a genuine puzzle about adding up infinitely many bits.

  I keep feeling like "nothing moves at an instant" is doing at least four different jobs in that conversation and I can't seperate them. Could you lay out the menu? I want the distinct precise claims that sentence could be expressing, ranging from the ones that are just true given what "motion" means to the ones that are substantive theses with actual philosophers on both sides. For each reading, tell me: is it compatible with the standard derivative reply, would it license his begging-the-question charge, and is it something a working physicist or a metaphysician would seriously defend? Then say which reading he actually needs for his argument to go through, and whether there's a reading on which he's literally right but his conclusion still doesn't follow.

  Bonus: is he onto anything with the claim that the arrow and the dichotomy stand or fall together?
