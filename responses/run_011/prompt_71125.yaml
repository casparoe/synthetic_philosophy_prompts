answer: |-
  Here are three ways we could tackle this. First, we could go full formalist, deriving dilation from the axioms of lower and upper probabilities using measure theory; this would be rigorous but likely drown the narrative utility in notation. Second, we could use a pure analogy, comparing credal sets to a committee of experts; this is intuitive but might obscure the mechanical *why*—specifically, how the math forces the interval wider. Third, we could do a hybrid: a concrete, numerical worked example grounded in an intelligence context that mirrors your book, followed by the philosophical implications of that mechanism.

  I am taking the third angle. You asked for the intellectual life to be "right rather than decorative," which means your narrator needs to understand the engine, not just the paint job. A pure analogy won't let her defend herself against a boss who demands rigor, but full measure theory won't help her write dialogue. We need to show exactly how the set mechanics produce the widening effect so she can explain *why* the uncertainty grows without apologizing for it.

  ### Part 1: The Mechanics of Dilation

  To understand dilation, we first need to define the tools. In standard probability, you have a single function that assigns a number to every hypothesis. In **imprecise probability**, you represent an agent's belief not as one function, but as a **credal set**: a collection of compatible probability functions. Instead of saying "The probability is 0.5," you say, "Any probability between 0.4 and 0.6 is rationally permissible given what I know." We call the bottom of that interval the **lower probability** and the top the **upper probability**.

  **Conditioning** is the process of updating these beliefs when new evidence arrives. In the single-number view, you plug the evidence into Bayes' theorem and get a new number. In the credal set view, you update *every* function in the set individually, then look at the new range spanned by the results.

  Dilation occurs when the new range is *wider* than the old one, regardless of what the evidence says. Here is how that happens mechanically.

  **The Setup**
  Imagine your narrator is assessing a hypothesis $H$: "The target facility is active."
  She also knows a piece of evidence $E$ is about to arrive: "A specific sensor will blip (Heads) or stay silent (Tails)."

  Her current state of mind (her credal set) is represented by just two possible probability functions, $P_1$ and $P_2$. These represent the two most extreme reasonable interpretations of the current intel.

  1.  **Prior Belief in $H$:**
      *   $P_1$ thinks the facility is unlikely to be active: $P_1(H) = 0.4$.
      *   $P_2$ thinks the facility is likely to be active: $P_2(H) = 0.6$.
      *   **Current Interval:** $[0.4, 0.6]$. The width of her uncertainty is **0.2**.

  2.  **The Relationship between $H$ and $E$:**
      This is the crucial part. In standard probability, you must commit to *one* relationship between the hypothesis and the evidence (e.g., "If the facility is active, the sensor blips 80% of the time"). In a credal set, different functions can model this relationship differently.
      *   **In $P_1$:** The sensor is reliable. If active, it blips. If inactive, it stays silent.
          *   $P_1(E | H) = 0.9$ (High chance of blip if active)
          *   $P_1(E | \text{not-}H) = 0.1$ (Low chance of blip if inactive)
      *   **In $P_2$:** The sensor is misleading (or hacked). If active, it stays silent. If inactive, it blips.
          *   $P_2(E | H) = 0.1$ (Low chance of blip if active)
          *   $P_2(E | \text{not-}H) = 0.9$ (High chance of blip if inactive)

  Notice that both functions are internally consistent. They just disagree radically on what the evidence *means*.

  **The Update (Conditioning)**
  Now the sensor reports. There are two possible outcomes: $E$ (Blip) or $\text{not-}E$ (Silent). Let's run the numbers for both.

  *Scenario A: The Sensor Blips ($E$)*
  We update both functions using Bayes' theorem.
  *   **For $P_1$:** Since $P_1$ thinks blips mean "active," its probability for $H$ shoots up.
      *   Calculation: $(0.9 \times 0.4) / [(0.9 \times 0.4) + (0.1 \times 0.6)] = 0.36 / 0.42 \approx \mathbf{0.86}$.
  *   **For $P_2$:** Since $P_2$ thinks blips mean "inactive," its probability for $H$ crashes down.
      *   Calculation: $(0.1 \times 0.6) / [(0.1 \times 0.6) + (0.9 \times 0.4)] = 0.06 / 0.42 \approx \mathbf{0.14}$.
  *   **New Interval:** $[0.14, 0.86]$.
  *   **New Width:** $0.72$.

  *Scenario B: The Sensor is Silent ($\text{not-}E$)*
  *   **For $P_1$:** Silence means "inactive." Probability crashes.
      *   Calculation: $\approx \mathbf{0.07}$.
  *   **For $P_2$:** Silence means "active." Probability shoots up.
      *   Calculation: $\approx \mathbf{0.93}$.
  *   **New Interval:** $[0.07, 0.93]$.
  *   **New Width:** $0.86$.

  **The Result**
  Before looking at the sensor, her uncertainty width was **0.2**.
  After looking at the sensor, her uncertainty width is **0.72** (if blip) or **0.86** (if silent).
  No matter what the sensor says, she is *less* precise than she was before. The evidence has **dilated** her belief.

  **Where did the width come from?**
  With a single number, you force a commitment to how $E$ relates to $H$. You decide upfront whether $E$ supports $H$ or undermines it. With a set, you admit you don't know the *direction* of the correlation. When the evidence arrives, it pulls the models in opposite directions. One model says "Great news!" and the other says "Disaster!" The set captures both reactions, and the gap between "Great" and "Disaster" is wider than the original gap between "Unlikely" and "Likely."

  ### Part 2: The Stakes and The Defense

  Why do philosophers and statisticians fight about this? Because dilation looks like a bug. It violates a strong intuition: **Learning should not make you more ignorant.** If I give you a free piece of data, your uncertainty should go down, or stay the same if the data is garbage. It shouldn't actively get worse.

  **The Boss's Attack (Why it's seen as defective)**
  Your boss represents the "Single Number" camp (often called Bayesian Orthodoxy). Their argument is pragmatic and sharp:
  1.  **Paralysis:** If every piece of intel dilates your judgments, you will never reach a threshold for action. You start 40-60% sure. You get a report. Now you're 14-86% sure. You get another report. Now you're 5-95% sure. You end up maximally uncertain about everything despite having all the data.
  2.  **Incoherence:** It looks like you are saying, "I know something about the sensor now, but that knowledge makes me know *less* about the target." That sounds like a contradiction.
  3.  **The Demand:** "Pick a prior. Commit to a correlation. Stop hiding behind the interval."

  **The Narrator's Defense (Why the set picture is right)**
  Your narrator's refusal to collapse the numbers isn't stubbornness; it's fidelity to the state of the evidence. Here are the three lines of defense she can use, ranging from conciliatory to aggressive.

  **Defense 1: "I Didn't Lose Information, I Located the Conflict."**
  *The Argument:* Before the sensor report, the interval $[0.4, 0.6]$ was hiding a secret. It averaged over two contradictory models of reality. One model thought the sensor was a friend; the other thought it was a foe. When the sensor blipped, that average was no longer honest. The data exposed the structural disagreement between the models.
  *The Cost:* It admits that action is harder. She has to tell the boss, "We don't just disagree on the answer; we disagree on what the question means."
  *Dialogue Line:* "Sir, the interval didn't widen because I'm confused. It widened because the data proved our models are fighting each other. A single number would lie and say they agree."

  **Defense 2: "Restrict the Set." (The Concession)**
  *The Argument:* Some philosophers argue dilation only happens if your credal set is "too wild." Maybe a rational analyst shouldn't allow models where the correlation flips signs so drastically. If she restricts her set to only include models where $E$ supports $H$ (or is neutral), dilation disappears.
  *The Cost:* This forces her to be more precise than the evidence warrants. It requires her to throw out valid possibilities just to keep the math tidy. It risks "false precision."
  *Dialogue Line:* "I could force the numbers to converge by ignoring the possibility that the sensor is compromised. But that's not analysis, that's wishful thinking."

  **Defense 3: "Decisions Don't Require Precision." (The Power Move)**
  *The Argument:* This is the strongest philosophical defense. Dilation is only a problem if you think belief *must* translate directly to a single betting quotient. But in decision theory, there are rules for imprecise probabilities (like **E-admissibility** or **Maximin**). You can still make a decision even with a wide interval. For example, if the cost of missing the target is high enough, you act even if the lower probability is low. Dilation changes the *confidence*, not necessarily the *choice*.
  *The Cost:* It requires the boss to understand that risk management isn't the same as probability estimation.
  *Dialogue Line:* "You want a number so you can plug it into your risk matrix. Fine. But if I give you 0.5, I'm telling you the odds are even. If I give you [0.14, 0.86], I'm telling you the stakes are unknown. You can still order the strike, but don't pretend you know the risk."

  **Where the Disagreement Bites**
  The core friction isn't math; it's authority. The single-number view assumes the analyst's job is to *resolve* uncertainty. The imprecise view assumes the analyst's job is to *represent* uncertainty.
  Dilation proves that sometimes, resolving one uncertainty (what did the sensor do?) exposes deeper uncertainties (how does the sensor work?).
  Your narrator's boss wants a compass needle that points North. Your narrator is handing him a compass that spins wildly when near iron, telling him, "There is iron here." The boss sees a broken tool; she sees a detection mechanism.

  For the novel, the key is that she isn't refusing to decide; she is refusing to lie about the *structure* of her ignorance. Dilation is the mathematical proof that "more data" does not always equal "less ambiguity," especially when the reliability of the data itself is part of the hypothesis.
