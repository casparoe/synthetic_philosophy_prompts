      *   *Wait, is (7) Wrong?* R says "method doesn't require explanation to succeed." If the theory fails to explain why the belief exists, HP fails. But M's point is HP can't fail to find *qualia*. R is conflating explaining the *belief* with explaining the *qualia*. So R is Wrong/Misleading.

