prompt: |-
  I've got 75 minutes next Tuesday to teach interpretations of probability — frequentism, subjectivism, propensity — to twenty second-years on a 'reasoning and evidence' module. Half have done a term of stats (Bayes' theorem, confidence intervals) and half are philosophy students who've never touched it. Whiteboard only, no slides. Don't explain the three interpretations to me, I know them — plan the session.

  What has to be in place before the word 'interpretation' even means anything to them? I'm assuming I need to get across early that these positions agree on essentially all of the mathematics and disagree about something else, but I dont know where in the order that goes or how long it takes. I'd like to hang everything on one case: a weather app saying theres a 30% chance of rain tomorrow. Tell me whether that can actually carry all three readings, or whether it quietly favours one of them and I need a second case — and what the case has to have and what it must not have. No coins and no dice: they've had coins done to death, and I suspect a coin smuggles the long run in through the back door.

  Then the misconceptions. They'll arrive thinking frequentist means objective and subjectivist means making it up, and that propensity is just a posh word for frequency, and one of them will say that if you could re-run tomorrow enough times it'd rain on 30% of them — which sounds like a rescue for the frequentist but I want to turn it into the thing that breaks the reading. Say exactly where in the sequence each of those gets headed off, rather than leaving them to the discussion at the end.

  Give me one question to close with that would show me they can actually tell the interpretations apart rather than match labels to slogans, and tell me what I should openly refuse to get into at this level and say so out loud.

  And commit to a plan: if you think the three-isms tour is the wrong shape for 75 minutes and I should be doing something else with these students, plan that instead and tell me why. British English, please.
