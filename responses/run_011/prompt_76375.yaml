answer: |-
  Here is the plan. I am committing to the **three-isms tour**, but structured as **"Three Truth-Conditions for One Statement"**. A pure inquiry-based session risks drifting into metaphysics without anchoring the vocabulary; a straight lecture risks slogan-matching. This hybrid ensures they leave with the labels attached to specific metaphysical commitments.

  ### 1. The Pre-requisites (0–10 minutes)
  **Goal:** Establish that the *calculus* is neutral before discussing the *meaning*.

  **Whiteboard:** Write the Kolmogorov axioms (simplified).
  1.  $0 \le P(A) \le 1$
  2.  $P(\text{Certain}) = 1$
  3.  $P(A \text{ or } B) = P(A) + P(B)$ (if mutually exclusive)

  **Script:**
  "Look at these rules. The stats half of you recognise them; the philosophy half, take them as read. Every interpretation I'm about to show you accepts these. They agree on the *math*. They disagree on what the world must look like for $P(A) = 0.3$ to be a **true statement**."

  **The Case:**
  Write: *"The Met Office says there is a 30% chance of rain in Oxford tomorrow."*
  "Can this single sentence carry all three interpretations? **Yes.** But each interpretation claims a different 'truth-maker' makes that sentence true. We are not arguing about the number 0.3. We are arguing about what 0.3 *is*."

  ---

  ### 2. The Sequence & Misconception Management (10–65 minutes)
  *Divide the board into three columns. Fill them as you go.*

  #### A. Frequentism (10–30 minutes)
  **The Move:** Ask the class: "For a Frequentist, what is happening in the world right now that makes '30%' true?"
  *   **Expected Answer:** "It rains 30% of the time."
  *   **Correction:** "On days *like* tomorrow." (Introduce **Reference Class**).
  *   **Board:** *Truth-maker: Long-run relative frequency in a reference class.*

  **Head off Misconception 1: 'Frequentist = Objective'**
  *   **When:** Immediately after defining the reference class.
  *   **Action:** Ask: "Who decides which features define 'days like tomorrow'? Pressure? Humidity? Day of the week?"
  *   **Point:** "The *data* is objective. The *class selection* is not. Frequentism smuggles subjectivity into the setup."

  **Head off Misconception 2: 'Re-running Tomorrow'**
  *   **When:** A student suggests: "If we could re-run tomorrow 100 times, it would rain 30 times."
  *   **Action:** **Do not let this pass as a rescue.** Use it as the critique.
  *   **Script:** "That sounds like a solution, but it's a metaphysical claim. Tomorrow happens once. To say it *would* happen 30 times in 100 re-runs is to talk about possible worlds, not actual frequencies. If you need 're-runs' of a singular event to define probability, you have quietly left Frequentism and entered Propensity or Modal Realism. For a strict Frequentist, 'probability of rain tomorrow' is shorthand for 'frequency of rain in this class of days'."

  #### B. Subjectivism / Bayesianism (30–50 minutes)
  **The Move:** "If I ban the long-run, what is left?"
  *   **Board:** *Truth-maker: Degree of belief (Credence).*
  *   **Script:** "It is a statement about the forecaster's state of mind, calibrated to evidence."

  **Head off Misconception 3: 'Subjectivist = Making it Up'**
  *   **When:** Defining credence.
  *   **Action:** Invoke **Coherence**.
  *   **Script:** "If you think 'subjective' means 'arbitrary', you will fail this module. If your probabilities don't sum to 1, or if you accept a set of bets that guarantees a loss (Dutch Book), you are irrational. The math constrains the belief. It is subjective in *location* (in the head), not in *discipline*."
  *   **Differentiation:** Ask the stats students: "Where does the prior come from?" Ask the philosophers: "Is a lie a probability?" (No, it violates coherence with evidence).

  #### C. Propensity (50–65 minutes)
  **The Move:** "Frequentism needs a long run. Subjectivism needs a mind. Is there a third option? A physical chance?"
  *   **Board:** *Truth-maker: Physical disposition / Causal tendency.*
  *   **Script:** "The atmosphere has a physical setup that *tends* towards rain. Like a loaded die, but for weather."

  **Head off Misconception 4: 'Propensity = Posh Frequency'**
  *   **When:** Defining the tendency.
  *   **Action:** The **Single Case** test.
  *   **Script:** "Imagine a radioactive atom with a 50% chance of decay in one hour. It decays in 1 minute. The frequency of decay for *that* atom is 100% (1 out of 1). The propensity was 50%. Propensity exists in the single case; frequency only exists in the aggregate. If you think they are the same, you cannot explain single-case physical chance."
  *   **Note on the Weather Case:** Acknowledge here that the weather case is slightly imperfect for Propensity because atmospheric physics is chaotic/deterministic, but it serves as a placeholder for 'physical chance'.

  ---

  ### 3. The Closing Question (65–75 minutes)
  **Goal:** Test application, not recall. Do not ask "Define Frequentism."

  **The Question:**
  *"The app says 30%. It does **not** rain. Who was wrong?"*

  **Desired Responses:**
  *   **Frequentist:** "Nobody. The statement was about the class, not the singular event. The class frequency might still be 30% even if today was in the 70% dry chunk."
  *   **Subjectivist:** "Nobody. A 30% credence means you expect dryness more than wetness. You were calibrated, not incorrect."
  *   **Propensity:** "Debatable. If the physical setup was truly measured, the propensity existed, but the outcome wasn't determined. But if the setup was misidentified, the propensity attribution was wrong."

  **Why this works:** It forces them to articulate the **truth conditions**. If they say "The app was wrong," they haven't understood any of the interpretations. If they say "The Frequentist was right because...", they must explain the reference class.

  ---

  ### 4. What to Explicitly Refuse (Say this out loud)
  To keep to 75 minutes, you must draw a boundary. Write **"OUT OF SCOPE"** on the board.

  1.  **P-values and Hypothesis Testing:** "We are discussing the *meaning* of probability, not the mechanics of significance testing. Do not ask me about null hypotheses today."
  2.  **Dutch Book Proofs:** "We accept that incoherent betting leads to loss. We will not prove the theorem on the board."
  3.  **Quantum Mechanics:** "Propensity is often linked to QM. We are using it as a macroscopic concept today. Do not derail this with Heisenberg."

  ### 5. Why this shape?
  I have rejected a pure "inquiry" session because 75 minutes is too short to let 20 students discover the distinctions without you feeding them the vocabulary. I have rejected a pure "lecture" because the misconceptions need to be triggered by student intuition to be dispelled.

  The **Weather Case** is sufficient. A second case (e.g., a medical test) eats 15 minutes and risks confusing the "singular event" problem which is the core philosophical tension here. The weather case is singular (tomorrow), which stresses the Frequentist, and physical (atmosphere), which supports the Propensity view, and epistemic (forecast), which supports Subjectivism. It is the most efficient triangle.

  **Final Instruction:**
  Keep your hand on the clock. If you are at 50 minutes and still on Frequentism, cut the Propensity section short and merge it into the closing discussion. It is better they understand the Frequentist/Subjectivist split (the most common real-world conflict) than rush all three.
