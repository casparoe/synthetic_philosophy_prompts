  # Seminar Plan: The Backward-Induction Paradox (80 Minutes)

  ## 1. Learning Objective
  To demonstrate the tension between **Backward Induction (BI)**—which recommends ending the game immediately—and **Pareto Efficiency**—where continuing yields higher payoffs for both. Students will experience the breakdown of BI when beliefs about opponent rationality are updated off the predicted path.

  ## 2. The Game Structure & Payoffs
  **Game:** Finite Alternating-Offers (6 Nodes).
  **Players:** P1 moves at nodes 1, 3, 5. P2 moves at nodes 2, 4, 6.
  **Action:** At any node, the mover chooses **STOP** (game ends, payoffs awarded) or **PASS** (game proceeds to next node).
  **Terminal:** If P2 chooses PASS at Node 6, the game ends with the "Cooperation Payoff."

  ### Payoff Matrix (P1, P2)
  *Print these figures clearly on the decision cards.*

  | Node | Mover | STOP Payoff | PASS Leads To... | If Opponent Stops Next | Payer's STOP > PASS? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | P1 | **(10, 2)** | Node 2 | P2 Stops at 2 → P1 gets **5** | **10 > 5** (Strict) |
  | **2** | P2 | **(5, 25)** | Node 3 | P1 Stops at 3 → P2 gets **5** | **25 > 5** (Strict) |
  | **3** | P1 | **(20, 5)** | Node 4 | P2 Stops at 4 → P1 gets **10** | **20 > 10** (Strict) |
  | **4** | P2 | **(10, 50)** | Node 5 | P1 Stops at 5 → P2 gets **10** | **50 > 10** (Strict) |
  | **5** | P1 | **(40, 10)** | Node 6 | P2 Stops at 6 → P1 gets **20** | **40 > 20** (Strict) |
  | **6** | P2 | **(20, 100)** | **END** | Game Ends → P2 gets **90** | **100 > 90** (Strict) |

  **Pareto Check:**
  *   BI Outcome (Stop at Node 1): **(10, 2)**
  *   Cooperation Outcome (Pass at Node 6): **(30, 90)**
  *   *Both* players are strictly better off if play continues to the end (30 > 10 and 90 > 2).

  ### Stakes (Non-Monetary)
  To ensure seriousness without using cash:
  1.  **Individual Stake:** Any pair that reaches **Node 5 or higher** receives a **"Homework Pass"** (valid for one 500-word seminar response paper this term).
  2.  **Collective Stake:** The pair with the **highest joint score** in the room allocates a **$200 Department Donation** to a charity of their choice.
  *Note: The Homework Pass is the primary driver. It is valuable enough to be taken seriously but creates a conflict between individual rationality (Stop at 1) and mutual benefit (Reach 5).*

  ## 3. Materials List
  *   **18 Decision Booklets:** One per student. Each contains 6 tear-off slips (one per potential node) and a record sheet.
  *   **9 "Game Boards":** Laminated cards showing the payoff tree for reference.
  *   **Collection Box:** For prediction slips.
  *   **Deck of Cards:** For pairing.
  *   **Script Card:** For TA/Instructor (for the scripted rounds).

  ## 4. Pairing Procedure (5 Minutes)
  To prevent friends from pairing up (which introduces pre-existing trust):
  1.  Hand each student a playing card as they enter. 9 Red, 9 Black.
  2.  **Rule:** Red cards are Player 1. Black cards are Player 2.
  3.  **Rule:** Number values (Ace-9) determine partners. Ace pairs with Ace, 2 with 2, etc.
  4.  **Anti-Collusion:** "If you are friends with your match, you must swap cards with another pair immediately. I will be watching."

  ## 5. Minute-by-Minute Timeline

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute booklets. Explain stakes (Homework Pass + Charity). Emphasize: "Maximize your own payoff." |
  | **05-10** | **Instructions** | Walk through the payoff tree. **Do not mention "Backward Induction" or "Centipede."** Explain the "Prediction Slip": Before moving, write what you think the *other* will do at the *next* node and why. |
  | **10-30** | **Round 1 (Student vs. Student)** | All 9 pairs play. <br> *Constraint:* They must submit the prediction slip *before* making their move. <br> *Collection:* TA collects slips at the end of each game. |
  | **30-35** | **Reset** | Collect all booklets. Reshuffle pairs using the same cards (keep P1/P2 roles). Tell half the room (Pairs 1-5) they are now playing against the Instructor/TA. |
  | **35-55** | **Round 2 (Mixed)** | **Pairs 1-5 (Student vs. TA):** TA plays P2. **Script:** PASS at Node 2, PASS at Node 4, STOP at Node 6.<br>**Pairs 6-9 (Student vs. Student):** Control group. Play normally.<br>*TA moves instantly to keep pace.* |
  | **55-80** | **Debrief** | Project the tree. Analyze slips. Discuss the paradox, reputation, and CKR. |

  ## 6. The Activity Mechanics
  **The Prediction Slip:**
  Each page in the booklet corresponds to a node. Before checking "STOP" or "PASS," the student must fill in:
  > *At the next node, my partner will: [ ] STOP [ ] PASS*
  > *My reason is:* _________________________________________________

  **Collection:**
  Students place completed slips into a box *before* revealing their move to their partner. This prevents the partner from seeing the prediction and adjusting behavior strategically (which would contaminate the belief data).

  ## 7. Debrief Strategy (25 Minutes)

  ### Phase 1: The Data (5 Mins)
  *   Ask for a show of hands: "Who stopped at Node 1 in Round 1?" (Expect many).
  *   "Who reached Node 5?" (Expect few).
  *   Reveal the payoffs: "If you stopped at 1, you got 10 points. If you reached 5, you got 40. Why didn't you take the 40?"

  ### Phase 2: The Induction (5 Mins)
  *   Draw the tree on the board.
  *   Walk backward from Node 6. "At Node 6, P2 gets 100 for Stop, 90 for Pass. P2 Stops."
  *   "At Node 5, P1 knows P2 Stops at 6. P1 gets 20 if Pass, 40 if Stop. P1 Stops."
  *   Continue to Node 1. "This logic forces P1 to Stop immediately."
  *   **The Collision:** "But you *saw* pairs get 40 and 90 points. The argument says that's impossible. The data says it happened. Where did the argument break?"

  ### Phase 3: The Prediction Slips & Off-Path Beliefs (10 Mins)
  *   **Focus on Round 2 (Scripted TA).**
  *   Retrieve slips from Students who played the TA.
  *   **Node 3 Analysis:** Find a slip from a student at Node 3 (against the TA).
      *   *Context:* The TA (P2) Passed at Node 2.
      *   *BI Assumption:* P2 is rational, so P2 *should* have Stopped at 2.
      *   *Reality:* P2 Passed.
      *   *Student Prediction:* Look at what they wrote for Node 4. Did they predict P2 would Stop at 4?
      *   **The Point:** "If P2 deviated from rationality at Node 2, why do you assume they will return to rationality at Node 4?"
      *   This exposes the fragility of **Common Knowledge of Rationality (CKR)**. BI requires me to know you are rational, know that you know I am rational, etc. Once you Pass at 2, I have evidence you might not be rational. If there is a chance you are 'irrational' (i.e., you will Pass again), it becomes rational for *me* to Pass at 3 to ride your coattails.

  ### Phase 4: Reputation (5 Mins)
  *   Explain the **Kreps/Milgrom/Roberts/Wilson** insight.
  *   "Even if you are rational, if there is a 1% chance I think you are 'crazy' (always Pass), you should Pass early to build a reputation."
  *   **Sharpening the Paradox:** Do not let this dissolve the tension. Ask: "But *you* know *you* are rational. Do you know that *they* know *you* know?"
  *   The paradox isn't solved by saying 'people are nice.' It's sharpened by asking: **Why do we assume CKR in a room of humans where we can clearly observe deviations?**

  ## 8. Responses to Predictable Objections

  ### Objection 1: "I passed because I'm a decent person, not because of reasoning."
  *   **Response:** "That changes the *payoffs*, not the *logic*."
  *   If your utility function includes your partner's welfare (e.g., $U_1 = Payoff_1 + 0.5 \times Payoff_2$), recalculate the tree.
  *   *Check:* At Node 6, P2 Stop = 100. Pass = 90. Even with altruism, 100 > 90.
  *   At Node 1, P1 Stop = 10 + 0.5(2) = 11. Pass (if P2 stops at 2) = 5 + 0.5(25) = 17.5.
  *   *Result:* Altruism might make Passing rational at Node 1, but it doesn't fix the end-game. At Node 6, a purely altruistic player might still Stop if their own need is weighted higher.
  *   **Deepening:** "If you are decent, you should Pass. But BI assumes Self-Interest. If we add 'decency' to the model, does BI return? Usually, yes, at the very last node. The paradox survives unless your altruism is *lexicographic* (infinite)."

  ### Objection 2: "This is just because the stakes are chocolate/homework. If it were millions, everyone Stops at 1."
  *   **Response:** "Backward Induction is scale-invariant."
  *   The inequality $100 > 90$ holds for dollars, points, or lives.
  *   "If you say you would Pass for millions, you are claiming that *rationality itself* breaks down at high stakes, or that trust becomes more valuable than millions. That is a profound claim about practical reason, not a dismissal of the game."
  *   **Empirical Check:** "Actually, experiments show cooperation *increases* with stakes up to a point, because the cost of testing trust is worth the potential gain."

  ## 9. Reflection: What Will Go Wrong?

  ### 1. The "Prediction Slip" Effect
  *   **Risk:** Asking students to write down a prediction makes them hyper-reflective. It may force them into "theoretical mode," making them *more* likely to follow Backward Induction than they would in a spontaneous interaction.
  *   **Mitigation:** Acknowledge this in the debrief. "Writing the slip made you act like a game theorist. In the real world, you don't write slips. You just feel the tension."

  ### 2. The Scripted Partner Timing
  *   **Risk:** The TA takes too long to "decide" at Nodes 2 and 4, breaking the flow.
  *   **Mitigation:** TA must move instantly. The script is rigid. Pass immediately.

  ### 3. The Missing Feature: Common Knowledge of Rationality (CKR)
  *   **The Gap:** The classroom version *cannot* reproduce CKR. Students do not know if their partners understand the logic.
  *   **What You Must Supply:** You must explicitly state in the debrief: "The paradox assumes that *everyone knows everyone is rational*. In this room, that assumption was false. The paradox isn't that people are irrational; it's that **rationality requires a level of mutual certainty that humans rarely possess.**"
  *   **The Hand-Supply:** You must articulate the *idealized* condition that failed. "Imagine a room of robots who know they are all robots. They Stop at 1. You are not robots. You have doubt. That doubt is the space where cooperation lives."

  ### 4. Pairing Leakage
  *   **Risk:** Friends pair up despite the card rule.
  *   **Mitigation:** Enforce the "Swap if Friends" rule aggressively. If you see two friends, separate them.

  ## 10. Final Note to Instructor
  The goal is not to prove Backward Induction "wrong." It is to show that Backward Induction relies on a premise (CKR) that is empirically fragile. The activity succeeds if students leave believing that **rationality is not just about calculation, but about the beliefs we hold regarding the calculators standing opposite us.**
