answer: |-
  ### Desiderata for a Theory of Diachronic Rational Choice

  The following list specifies the conditions any adequate theory of diachronic rationality must meet. The labels indicate the status of each demand: **Non-Negotiable** means a theory failing this is defective as a theory of rationality; **Matter of Taste** means it reflects a specific conception of agency that rivals might reject. **Genuinely Required** means it follows from the concept of guidance or normativity; **Substantive Commitment** means it privileges a specific school of thought (e.g., consequentialism, evidentialism, resoluteness) while masquerading as a formal constraint.

  #### 1. The No-Sure-Loss Constraint (Pump Immunity)
  *   **Motivation:** An agent who ends up strictly worse off than they started, having had the opportunity to remain at the start, appears to have failed instrumentally. This covers both standard cyclic preference pumps and parity-based pumps where small improvements accumulate to a loss.
  *   **Labels:** Non-Negotiable / Substantive Commitment.
  *   **Justification:** It is non-negotiable because instrumental rationality is constitutively about effective pursuit of ends; self-defeat is the hallmark of irrationality. However, it is a substantive commitment because it presupposes that the *outcome* of the sequence is the primary locus of evaluation, rather than the *process* of choosing. Theories that privilege local integrity over global outcome (e.g., certain deontological or "sophisticated" choice models) may reject this as the primary metric.

  #### 2. Local Assessability (Separability)
  *   **Motivation:** At any decision node, the agent chooses based on information and preferences held *at that node*. Past costs are sunk; future plans are only relevant insofar as they inform current expectations. A choice should not be deemed irrational if it maximizes expected utility relative to the agent's state at the moment of choice.
  *   **Labels:** Matter of Taste / Substantive Commitment.
  *   **Justification:** This is the core commitment of standard dynamic decision theory (Savage/Strotz). It is not a logical truth. It privileges the "temporal slice" of the agent over the "temporal extended" agent. Rejecting this allows for resolute choice (sticking to a plan even when current preferences diverge), but accepting it makes money pumps inevitable for agents with shifting preferences.

  #### 3. Diachronic Coherence (Plan Stability)
  *   **Motivation:** An agent who forms a plan to avoid a known loss should not be rationally required to abandon that plan at a later node simply because their local preferences shift, provided the shift was anticipated. This handles the Ulysses case and the resolute agent who avoids the pump by commitment.
  *   **Labels:** Non-Negotiable / Genuinely Required.
  *   **Justification:** Without this, agency over time dissolves into a series of unconnected events. If a theory cannot account for the rationality of binding oneself to avoid anticipated self-sabotage, it fails to describe a single agent acting *across* time. However, note the tension: if Local Assessability (2) is held, Diachronic Coherence is often violated.

  #### 4. Deliberative Accessibility
  *   **Motivation:** The norms must be usable by the agent in real-time deliberation. A criterion that requires the agent to see the entire decision tree perfectly, calculate all future nodes, or possess infinite memory fails for bounded agents. This handles the case of the agent for whom the cycling pattern is too long to compute.
  *   **Labels:** Non-Negotiable / Genuinely Required.
  *   **Justification:** "Ought implies can." If a norm cannot guide choice because it exceeds cognitive capacity, it is a criterion for an oracle, not an agent. This eliminates theories that rely on perfect foresight or global optimization without a heuristic implementation.

  #### 5. Preference Integrity (Endogenous Change)
  *   **Motivation:** The theory must distinguish between rational preference change (learning, refinement) and irrational preference manipulation (steering, framing effects). An agent pumped because their preferences shift *due to the trades themselves* is in a different category than one pumped due to static cyclic preferences.
  *   **Labels:** Non-Negotiable / Genuinely Required.
  *   **Justification:** A theory of rationality must be able to diagnose the source of preference volatility. If every shift is treated as exogenous, the theory cannot criticize manipulation. If every shift is treated as rational, the theory cannot criticize weakness of will.

  #### 6. Frequency Independence
  *   **Motivation:** The verdict on rationality should not depend on whether the pump situation recurs. An agent is not rational only when they are being watched or tested repeatedly. The one-off pumped agent and the recurring pumped agent stand in the same normative relation to their choices.
  *   **Labels:** Non-Negotiable / Genuinely Required.
  *   **Justification:** Rationality is a property of the agent's structure, not the environment's frequency. Relying on recurrence to justify rationality (e.g., "evolutionary" defenses) conflates survival with rationality.

  ---

  ### The Object of Norms

  A theory must specify what bears the normative weight: individual acts, whole plans, standing dispositions, or the preference ordering itself.

  **Verdict:** The norms must attach to **Standing Dispositions (Policies)**.

  **Justification:**
  *   **Individual Acts:** Attaching norms to acts enforces Local Assessability. This guarantees failure on No-Sure-Loss for agents with shifting preferences (the Impossible Trinity).
  *   **Whole Plans:** Attaching norms to plans requires the agent to select a complete strategy at $t_0$. This violates Deliberative Accessibility for complex trees and fails to handle unanticipated information or endogenous preference change gracefully.
  *   **Preference Ordering:** Attaching norms to orderings ignores the implementation problem. An agent can have consistent preferences but lack the will to execute them.
  *   **Standing Dispositions:** This is the only object that satisfies the cluster. A disposition to "reject trades that are part of a known cycle" or "maintain prior commitments unless new information warrants change" allows the agent to avoid pumps (satisfying No-Sure-Loss) without requiring omniscient calculation at every node (satisfying Deliberative Accessibility) and without requiring that the local act be optimal at the moment of execution (rejecting Local Assessability). It treats the agent as a temporally extended entity governed by rules, not just a sequence of optimizers.

  ---

  ### Deliberative Availability Requirement

  **Verdict:** The list **must** include a deliberative-availability requirement.

  **Justification:** A criterion satisfied only by beings who can see the whole tree at once is no criterion for us. If a theory defines rationality as "choosing the globally optimal path" but provides no mechanism for a bounded agent to identify that path without already knowing the future, it is empty. The norm must be actionable. This eliminates "Sophisticated Choice" models that require the agent to backwardly induce the entire game tree perfectly at every node, as this is computationally prohibitive in complex real-world scenarios.

  ---

  ### Structural Analysis: The Impossible Trinity

  You suspected a conflict between **No-Sure-Loss**, **Local Assessability**, and **No-Foresight/Willpower Dependence**. This is not an artifact; it is a real structural impossibility.

  **The Argument:**
  1.  Assume **Local Assessability**: The agent must choose what looks best *now*.
  2.  Assume **No-Foresight/Willpower Dependence**: The agent cannot bind their future self or rely on supernatural prediction to override current preferences.
  3.  Consider a Money Pump with Cyclic Preferences (A > B > C > A) + Cost.
  4.  At node 1, A for B+$ looks good (Local Assessability). The agent cannot bind themselves to stop later (No Willpower Dependence).
  5.  At node 2, B for C+$ looks good. At node 3, C for A+$ looks good.
  6.  The agent ends with A minus costs. **Sure Loss** occurs.
  7.  To avoid Sure Loss while maintaining Local Assessability, the agent must have the Foresight/Willpower to stop at node 1 *against* their current preference (violating No-Foresight/Willpower Dependence).
  8.  To avoid Sure Loss while maintaining No-Foresight/Willpower Dependence, the agent must ignore Local Assessability (i.e., choose B over A at node 1 because it serves the plan, even if A is locally preferred).

  **Conclusion:** You cannot jointly satisfy all three. Standard decision theory resolves this by treating **Local Assessability (Separability)** as a logical truth. This is a mistake. Separability is a substantive commitment to the idea that the "self" at $t_1$ is normatively independent of the "self" at $t_0$. To save the No-Sure-Loss constraint and Deliberative Accessibility for bounded agents, **Local Assessability must be rejected.** Rationality must permit (and sometimes require) acting against current local preference to satisfy a prior rational policy.

  ---

  ### Neutrality Assessment

  **Is a genuinely camp-neutral list achievable?**
  **No.** Neutrality here is a pretense.

  **Reasoning:** The very definition of "diachronic rationality" forces a choice between two conceptions of the agent: the **Sequence of Selves** (where Local Assessability holds) and the **Extended Self** (where Plan Stability holds). Any list of desiderata that demands both No-Sure-Loss and Local Assessability is secretly arguing for the Sequence of Selves while pretending to demand consistency. Any list that demands No-Sure-Loss and Plan Stability is secretly arguing for the Extended Self.

  The only "neutral" move is to explicitly flag the trade-off, as done above. However, even the choice of **No-Sure-Loss** as a Non-Negotiable desideratum is a consequentialist commitment. A deontological theory of choice might argue that if each step was justified at the time, the agent is blameless regardless of the loss. To be useful for your dissertation, you must abandon the pretense of neutrality and admit that fixing the target requires choosing which conception of agency you are modeling. I recommend choosing the **Extended Self** (rejecting Local Assessability) because it is the only one that accommodates self-binding and avoids the pump without requiring omniscience.

  **The Single Most Eliminative Desideratum:**
  **Deliberative Accessibility.**
  This eliminates the largest number of sophisticated theoretical models. Many accounts of dynamic consistency assume the agent can perform backward induction on complex trees or perfectly predict their own future utility functions. For bounded agents, these models are descriptively and normatively inert. If the agent cannot compute the "rational" plan, the plan cannot be a norm. This filter kills most game-theoretic applications of rational choice to diachronic problems.

  ---

  ### Assessment of Contenders

  **Dynamic Consistency (Standard Theory):** Fails. It privileges Local Assessability, making it impossible to avoid money pumps without assuming the agent never changes preferences. It treats the pump as a failure of the preference ordering, not the choice mechanism, and cannot handle Ulysses cases without ad-hoc modifications.

  **Resolute Choice (McClennen-style):** Strongest fit. It rejects Local Assessability, allowing the agent to stick to a plan even when local preferences shift. It satisfies No-Sure-Loss and Diachronic Coherence. However, it struggles with Deliberative Accessibility if the "resolution" requires heavy cognitive load to maintain against strong local temptation.

  **Sophisticated Choice (Backward-Looking):** Fails Deliberative Accessibility. It requires the agent to predict their own future irrationality and constrain current choice accordingly. It avoids the pump but turns the agent into a preemptive self-saboteur who cannot genuinely commit, only manipulate options.

  **Pump-Irrelevance (Local Integrity):** Fails No-Sure-Loss. It argues that if every step was locally rational, the global loss is not a rational failure. This is untenable for instrumental rationality; it severs the link between rationality and success.

  **Disposition/Policy-Based Accounts:** Best overall. By attaching norms to dispositions rather than acts, it bypasses the Local Assessability trap. An agent with a disposition "do not trade in cycles" avoids the pump without needing to calculate the tree at every node. It satisfies Deliberative Accessibility (heuristics) and No-Sure-Loss. It is the only view that successfully dissolves the Impossible Trinity by changing the object of evaluation.
