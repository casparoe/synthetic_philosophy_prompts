  2.  **Deconstruct Question 1: Is she right? (Analysis of the Evidence)**

      *   *Amartya Sen's Entitlement Approach:* This is a classic case study setup for Sen's theory of famine. Famines often occur not because food disappears, but because people lose the *entitlement* to access it (jobs, wages, trade).
