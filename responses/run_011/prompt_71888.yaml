  ### The Anthropic Location Tree

  **Instructions:** Proceed from the root. At each node, select the claim that best matches your intuition. Follow the branch to the next node or to a terminal leaf.

  **Node 1.** Suppose a complete physical description of the universe exists, including a record of your current perceptions. Does this description still leave it an open question *which* of the observers described is you?
  *   **No, that is not a genuine further question.** → **Leaf 1**
  *   **Yes, there is a fact about which one I am.** → **Node 2**

  **Node 2.** When you imagine the collection of observers you might have been (the "urn"), is its content determined by how the world is, by how you choose to define your group, or is the urn merely a temporary tool?
  *   **The urn is just scaffolding a better theory would discard.** → **Leaf 2**
  *   **The urn is fixed by how I define my group.** → **Leaf 3**
  *   **The urn is fixed by the world itself.** → **Node 3**

  **Node 3.** In this urn, does each ball represent a whole living person, or a single moment of conscious experience?
  *   **A single moment of experience.** → **Node 4**
  *   **A whole living person.** → **Node 5**

  **Node 4.** (Moments) If one hypothesis implies there are a million times more such moments than another, does that fact alone make the first hypothesis more likely?
  *   **No, count moments equally.** → **Leaf 4**
  *   **Yes, weight by the number of moments.** → **Leaf 5**

  **Node 5.** (Persons) If one hypothesis implies there are a million times more such persons than another, does that fact alone make the first hypothesis more likely?
  *   **No, do not weight by number.** → **Node 6**
  *   **Yes, weight by number (sample over everything possible).** → **Node 7**

  **Node 6.** (No Weighting) Does this view force you to believe humanity is likely to go extinct sooner rather than later, simply because you are alive now?
  *   **Yes, I accept this conclusion.** → **Leaf 6**
  *   **No, I reject this conclusion.** → **Leaf 7**
  *   **The argument is valid but relies on false premises.** → **Leaf 8**

  **Node 7.** (Weighting) If the number of observers is infinite, or only known to within a power of ten, does your method still produce a definite probability?
  *   **No, the method breaks down.** → **Leaf 9**
  *   **Yes, the method is robust.** → **Node 8**

  **Node 8.** (Weighting + Infinity) If a theory predicts a vastly larger universe solely to increase the number of observers, is this a reason to believe it, a reason to doubt it, or a mistake in counting?
  *   **A reason to believe it.** → **Leaf 10**
  *   **A reason to doubt it.** → **Leaf 11**
  *   **A mistake in counting (double counting).** → **Leaf 12**

  ***

  ### Terminal Leaves

  **Leaf 1. Eliminativism.**
  *   **Awkward Commitment:** Your sense of being a specific person is an illusion, so you cannot reason about your location.

  **Leaf 2. Instrumentalism.**
  *   **Awkward Commitment:** You cannot claim your conclusion is true, only that it is useful for calculation.

  **Leaf 3. Subjective Bayesianism.**
  *   **Awkward Commitment:** Two people with the same evidence can rationally disagree about the probability of the world.

  **Leaf 4. Temporal SSA.**
  *   **Awkward Commitment:** You are not the same entity you were five minutes ago, and you should expect to die immediately.

  **Leaf 5. Temporal SIA.**
  *   **Awkward Commitment:** You should believe you are in a universe filled with fleeting conscious flashes rather than long lives.

  **Leaf 6. Standard SSA.**
  *   **Awkward Commitment:** You should have been surprised to be born so early in human history.

  **Leaf 7. SSA with Reference Class Restriction.**
  *   **Awkward Commitment:** You must arbitrarily exclude most observers from your comparison group to avoid absurd results.

  **Leaf 8. Doomsday Skeptic.**
  *   **Awkward Commitment:** The argument is logically valid but relies on false premises about sampling.

  **Leaf 9. Naive SIA.**
  *   **Awkward Commitment:** You cannot reason about cosmological theories involving eternal inflation.

  **Leaf 10. Presumptuous Philosopher.**
  *   **Awkward Commitment:** You can refute physical theories from your armchair based on observer counts.

  **Leaf 11. Consistent SIA.**
  *   **Awkward Commitment:** You must accept a penalty against theories that posit vast empty spaces.

  **Leaf 12. Double-Counting Critic.**
  *   **Awkward Commitment:** You treat existence as evidence twice, once for the theory and once for the observer.

  ***

  ### Test Case: The Survey-Limited Case

  **Scenario:** Hypothesis A ($10^{11}$ galaxies/observers). Hypothesis B ($10^{22}$ galaxies/observers). Locally indistinguishable. You hold one entry (your galaxy) without selecting it.
  **Task:** Favor A or B? By what factor? Does learning your galaxy is in an atypical density region change this?

  | Leaf | Position | Favored Hypothesis | Approx. Factor | Impact of Atypical Density |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Eliminativism | **Undefined** | N/A | Question dissolves. |
  | **2** | Instrumentalism | **Undefined** | N/A | Depends on utility, not truth. |
  | **3** | Subjective Bayesian | **Prior Dependent** | 1:1 | No change (no sampling update). |
  | **4** | Temporal SSA | **A** | $>10^{11}$ | Reduces factor (atypicality undermines random sample). |
  | **5** | Temporal SIA | **B** | $>10^{11}$ | No change (existence is the only data). |
  | **6** | Standard SSA | **A** | $10^{11}$ | Reduces factor (I should be typical). |
  | **7** | SSA Restriction | **A** | $10^{11}$ | May exclude me from class (undefined). |
  | **8** | Doomsday Skeptic | **Neither** | 1:1 | No change (sampling premise rejected). |
  | **9** | Naive SIA | **B** | $10^{11}$ | No change. |
  | **10** | Presumptuous | **B** | $10^{11}$ | No change. |
  | **11** | Consistent SIA | **B** | $10^{11}$ | No change. |
  | **12** | Double-Counting | **A** | $10^{11}$ | No change. |

  **Mergers:** This case fails to separate Leaves 9, 10, and 11 (all favor B by $10^{11}$). It also fails to separate Leaves 6, 7, and 12 (all favor A by $10^{11}$, though for different reasons). It distinguishes Weighting (SIA) from No-Weighting (SSA) positions, but not the internal disputes within those camps.

  ***

  ### Unoccupied Cells

  The following combinations of answers are logically available within the tree structure but correspond to no known held position:

  1.  **Weighting = Yes + Doomsday = Accept.**
      *   **Status:** **Incoherent.**
      *   **Reason:** If you weight by the number of observers (SIA), the probability of being an early observer drops as the total number of observers rises. This mathematically cancels the Doomsday effect. Holding both implies a failure to follow the probability calculus of one's own assumptions.

  2.  **Urn = Fixed by Me + Weighting = Yes.**
      *   **Status:** **Untried / Likely Incoherent.**
      *   **Reason:** Weighting by observer count (SIA) requires an objective count of observers in the world. If the urn is fixed subjectively by the agent ("Fixed by Me"), there is no objective count to weight. No one has successfully combined subjective reference classes with objective existence weighting.

  3.  **Infinity = Works + Presumptuous = Reject (without Double Counting).**
      *   **Status:** **Unattractive.**
      *   **Reason:** This cell represents someone who believes their method handles infinite universes perfectly, yet rejects the conclusion that larger universes are more likely, without claiming it is a counting error. This is merely an ad hoc penalty to avoid the "Presumptuous Philosopher" bullet, lacking a principled justification.

  ***

  ### Note on Mergers
  Per your caution: Leaves 6 (Standard SSA) and 7 (SSA with Restriction) are ordinarily treated as rivals. However, in the **Survey-Limited Case**, they yield identical predictions (Favor A, factor $10^{11}$). They are separated in the tree by **Node 6** (attitude toward Doomsday), not by the test case. Similarly, Leaves 9, 10, and 11 merge on the test case predictions despite their philosophical disagreements at **Node 8**. The tree locates the *source* of the disagreement, even where the *output* converges.
