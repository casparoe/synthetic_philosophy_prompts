answer: |-
  The water in the bay was the color of bruised iron, cold enough to numb the fingers inside neoprene gloves. Elara hauled the trap aboard, the chain rattling against the gunwale, and wiped the slime from the tag. The metal was corroded, the number barely legible beneath the encrustation of bryozoans and sediment. Thirty-one seasons of this. Thirty-one years of marking things that refused to stay distinct.

  She logged the capture in the waterproof notebook. Tag 4092. Location: Sector 7. Status: Fused.

  In the tank back at the station, the specimen from Sector 7 lay spread across the glass bottom. It was a quilt, a sheet of pale zooids pulsing faintly in the artificial current. But it was not alone. It had merged with two others during the winter storms. The boundary where they met was visible as a pale, calcified scar running through the colony. A seam. It looked like a stitch holding together a wound that never quite healed. Elara traced the line with a probe. The fluid beneath was shared. The circulatory system of three former individuals now moved as one.

  Her technician, Ren, stood over the sink, scrubbing a tray of forceps. He hadn't looked at the specimen. He hadn't looked at the data sheet either. He stopped believing the hypothesis five years ago, though he never said it. He just scrubbed harder.

  "The count is down again," Elara said. She didn't need to specify which count.

  "Nine or forty thousand?" Ren asked. He didn't turn around.

  "Depending on the statute."

  The conservation act protected individuals. It set a minimum viable population threshold. If the bay held three organisms—the fused conglomerates—it was below the threshold. The protection lapsed. The warming waters brought the pathogen, and the quilts died. If the bay held forty thousand organisms—the individual quilts before fusion—it was safe. But the resistance to the pathogen lived in the motes, the cytoplasmic particles drifting in the shared fluid. The motes cared nothing for the quilt's boundary. They moved horizontally. They overproduced in the fused state. Protecting the quilt might not protect the resistance. Protecting the conglomerate might save the resistance but lose the legal status.

  Elara opened her laptop to draft the annual report. She needed to justify the transplant experiment. She had moved quilts from the warm south bay to the cold north bay. She had tracked the motes.

  She typed the first measurement into the draft. In the lab analysis, the fidelity of mote copying into propagules was high. For every hundred buds produced by a zooid carrying Type A motes, ninety-eight contained the particle. The loss rate to the water column was negligible in isolation. The particles persisted. They were copied with a precision that rivaled nucleic acid.

  She minimized the window and opened the field log. She needed the survival data to match. The reproduction rate of the quilts was low. For every hundred colonies established at the margin, only forty survived the first season. The loss rate to storms was high. Thirty percent of the tissue was torn back during gales. The organisms struggled. They died.

  She stared at the two numbers. Ninety-eight percent persistence versus forty percent survival. They described the same history, the same bay, the same winter. They should have correlated. They didn't. She saved the file without highlighting the discrepancy.

  The legal meeting was scheduled for Thursday. The committee wanted clarity. They wanted to know what to count. Elara poured coffee into a thermos. The steam rose in the cold lab. She looked back at the tank. The seam on Specimen 4092 had widened. It wasn't healing. It was a border.

  She remembered the first time she saw a rejection. Two quilts touched, sensed the incompatibility at the locus, and withdrew. They left a bare strip of substrate between them. A seam of emptiness. That was the default state of the world: separation. Fusion was the exception, granted only to kin or strangers with matching alleles. But the motes didn't care about alleles. They slipped through the fused tissue. They hitched rides in the water.

  Her experiment was supposed to settle the heritability. She had isolated the quilts. She had prevented fusion. But she hadn't varied the horizontal transmission. She couldn't. The water was the water. The motes drifted. If a quilt survived because it acquired motes from a neighbor through the water, was that adaptation? Or was it infection?

  Ren walked over, holding a sample vial. "Sector 9. New variant."

  Elara took the vial. Inside, a small quilt floated. It was dense, compact. She put it in the tank with a standard specimen. They touched. Usually, they would fuse within the hour. The fluid would mix. The seam would dissolve.

  They didn't fuse.

  The standard quilt extended its zooids, seeking the connection. The variant retracted. They sat against each other, edge to edge, for six hours. No sharing. No mixing. A hard boundary.

  "What did you do to it?" Elara asked.

  "Nothing. It came up like that."

  Elara looked at the edge where they met. It was clean. No scar. No calcified stitch. Just two things refusing to become one. The variant carried a mote that suppressed the compatibility locus. It forced the host to maintain a hard boundary. It refused the shared fluid.

  She sat back in her chair. The implications spread out like a stain. For thirty-one seasons, she had recorded fusions and splits. She had counted the conglomerates as individuals when it suited the conservation model, and the quilts when it suited the census. She thought she was tracking the stability of a population. She thought the boundary was a property of the animal.

  It wasn't. The boundary was a phenotype of the mote.

  When the motes wanted to spread, they allowed fusion. They blurred the seam. They turned thousands of quilts into a single vessel to ride out the storm. When the motes wanted to protect their lineage from dilution, they forced the quilt to reject neighbors. They drew the line. The individuality of the bay was not a fact to be discovered. It was a variable being manipulated from below by things she could never see without a microscope.

  She had built her career on the assumption that the quilt was the unit. The statute assumed the individual was the unit. The law required a count. If she counted the conglomerates, the bay was dead. If she counted the quilts, the bay was safe, but the resistance might vanish because the motes needed the conglomerate to overproduce.

  She looked at the variant in the tank. It was safe. It was distinct. It was an individual by the strictest definition. But it was alone. If the pathogen hit hard, it would die. The conglomerates would survive. The law would protect the variant and let the resistance perish.

  Elara began to type the report. She had to make a recommendation. She wrote that the quilt should be considered the individual for the purpose of the count. It was the only way to meet the threshold. It was the only way to keep the boats in the water and the tags in the sea.

  She knew it was wrong. The resistance wasn't in the quilt. It was in the fluid. It was in the network. By defining the individual as the quilt, she was protecting the shell and ignoring the engine. She was preserving the count while sacrificing the mechanism of survival.

  Ren watched her type. He knew she was lying. He didn't say anything. He just capped the vial with the variant and put it in the rack.

  The storm season was coming. The water would churn. The quilts would tear. Some would fuse. Some would reject. The seams would open and close. The motes would move. The count would change again.

  Elara hit send on the report. The legal question remained open. The committee would argue. The lawyers would parse the definition of individual. The quilts would grow at the margin. They would be torn back.

  She closed the laptop. The lab was quiet. The tank hummed. The seam on Specimen 4092 glowed faintly under the UV light, a white line dividing the dark water. It looked like a crack in a windshield. It looked like a horizon. It looked like nothing at all.

  She packed her bag. She left the light on.

  ***

  **Afterword**

  The evidence licenses the description of the resistance as the phenotype of a self-propagating element. The motes manipulate the host's fusion behavior to optimize their own transmission, acting as the genuine **replicators**. The quilts and conglomerates are merely transient **interactors**, their boundaries drawn or dissolved by the motes' interests. The transplant experiment fails to settle the unit of selection because it did not isolate horizontal transmission; thus, it cannot distinguish whether resistance spreads via host reproduction (quilt fitness) or particle infection (mote fitness). Elara's error lies in treating the host boundary as biologically fixed rather than manipulatable.
