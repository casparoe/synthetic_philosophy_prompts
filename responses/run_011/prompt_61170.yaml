answer: |-
  **MEMORANDUM**

  **TO:** All Contributors
  **FROM:** Dr. Silas Vane, Editor-in-Chief, *Journal of Predictive Sufficiency*
  **SUBJECT:** Mandatory Assumption Unrealism Statements (Volume 42+)

  Effective immediately, all submissions must include a certified Assumption Unrealism Statement (AUS). This policy protects the discipline from untestable metaphysics by ensuring assumptions are sufficiently abstract to guarantee predictive validity.

  **1. Scoring Rubric**
  Every assumption receives an Unrealism Score (US) from 0–100. A low US indicates dangerous descriptive accuracy. Submissions with an average US below 50 will be desk-rejected. Conversely, models whose assumptions turn out to be broadly accurate will be returned with instructions to weaken them. If a model predicts successfully, its assumptions are proven sufficiently unrealistic. If it fails, the assumptions were insufficiently abstract. Appeals regarding US classification are processed within 4–6 weeks.

  **2. Tagging Requirements**
  Authors must tag every assumption as one of the following:
  *   **Type I (Domain Claim):** Defines the boundary of application.
  *   **Type II (Scaffolding):** Used in derivation, discarded thereafter.
  *   **Type III (Negligible Exclusion):** Claims omitted factors do not matter.

  Tagging is final. Once an assumption is categorized, disputes regarding its empirical content are considered settled permanently.

  **3. Worked Examples**
  *   *Example A:* "Firms maximize returns." Subject firms have never performed calculations. **Tag:** Type I. **US:** 85. **Status:** Acceptable. The inaccuracy is irrelevant because the prediction holds.
  *   *Example B:* "Leaves distribute themselves to maximize sunlight." Leaves possess no agency. **Tag:** Type III. **US:** 95. **Status:** Excellent. If leaves clustered in shade, the assumption would be relevant, and the model would have failed. Since the model works, the unrealism is confirmed as irrelevant.

  **4. Frequently Asked Questions**

  *Q: Surely the assumption has to be roughly right where it matters?*
  A: Descriptive accuracy is irrelevant to validity. However, if an inaccuracy mattered, the predictions would have failed. Since we only publish successful predictions, you may proceed.

  *Q: What if the errors don't cancel?*
  A: Then the model will not predict successfully. Please resubmit with a higher US.

  *Q: Can I get credit for an assumption that's true but extremely detailed?*
  A: No. Detail reduces unrealism. Simplify until the assumption is false but useful.

  *Q: Is there a minimum number of assumptions?*
  A: Only that there must be enough to generate a prediction, but few enough to remain unrealistic.

  **5. Application to This Memo**
  This policy assumes authors read memoranda. If compliance is high, the assumption was sufficiently unrealistic to govern behavior. If compliance is low, the assumption was too realistic, proving authors do not actually read memos, which renders the instruction irrelevant. Either way, the policy stands validated.
