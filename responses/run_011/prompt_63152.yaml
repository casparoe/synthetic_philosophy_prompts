      *   **Specific Question:** How should students weigh Gödel's conclusion (time is not objective) vs. the rival reading (CTCs vindicate passage because the past is a place one can travel to)? Is the second reading available to someone accepting Gödel's premises?
      *   **Tone/Style:** American English, academic but candid, rigorous, respectful of the user's expertise.

