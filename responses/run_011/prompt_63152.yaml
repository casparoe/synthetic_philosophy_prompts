          *   Explain why the rival reading collapses: If the past is accessible, the A-theoretic "moving now" is incoherent. Thus, Gödel's conclusion (time is ideal/not objective passage) stands stronger than the rival reading.
      *   *Pedagogical Advice:* How to frame this for students. Use the error as a teaching moment? Or correct it silently? Suggest correcting it to maintain credibility.
