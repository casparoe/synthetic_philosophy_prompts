  If you find a past case with this vote split that resulted in **Misconduct**, the Panel has always run PBP. If it resulted in **No Misconduct**, the Panel has always run CBP. Given the five recorded cases do not show this, check the secretary's internal ballot sheets for any "hung" panels or cases where the draft determination was rewritten to match the conclusion vote rather than the element vote. If no such case exists, you are setting the precedent today.
