answer: |-
  # Take-Home Examination: Political Philosophy Seminar
  **Topic:** The Justification of Institutions  
  **Time Allowed:** 2 Hours  
  **Total Marks:** 25  

  **Instructions:** Answer the following question. You may rely only on the conceptual vocabulary defined below and the facts provided in the case. No external research or citation is required or permitted.

  **Conceptual Vocabulary:**  
  In seminar, we distinguished two distinct claims often grouped under the label "conservatism regarding institutions":  
  1.  **The Procedural Presumption:** A rule of argumentative burden. If an existing arrangement's original rationale is lost or opaque, the burden of proof lies on those who would dismantle it to show that removal is safe. Persistence creates a default presumption against change.  
  2.  **The Substantive Wisdom Thesis:** A claim about social reality. Inherited arrangements tend to encode functional wisdom or latent utility that no individual reformer is in a position to reconstruct. Persistence is evidence of function.

  **Case:**  
  *A county ordinance adopted in 1937 requires that any newly drilled residential well be sited at least one hundred feet from any adjoining property line. The ordinance's preamble was destroyed in a 1972 courthouse fire, and no statement of legislative reasons survives; the county's own archivists report that no living official can say why the distance was set at one hundred feet rather than fifty. The planning staff now propose repeal, relying on hydrogeological modeling which indicates that fifty feet is adequate for the county's soils. A well-water users' association objects, arguing that the burden lies on those who would remove a rule whose purpose has been lost. The staff's alternative proposal is a five-year pilot: the setback is waived on a defined set of lots, with quarterly groundwater sampling and automatic reinstatement of the rule if any sample exceeds a contamination threshold. Separately, the setback has made infill construction infeasible on the small lots concentrated in one unincorporated part of the county, and the association supporting repeal notes that the resulting housing scarcity falls mainly on renters, none of whom had any voice in 1937 and none of whom are represented in the current proceedings.*

  **Essay Question:**  
  Evaluate the well-water users' association's objection to the repeal proposal. In your answer, you must:  
  1.  Determine whether the objectors rely on the **Procedural Presumption**, the **Substantive Wisdom Thesis**, or both. Explain what happens to their argument if only one of these claims is available to them.  
  2.  Identify the premises each component requires to be true *of this specific ordinance* for the objection to hold. Say which of those premises the stated facts support, which they leave open, and which they undercut.  
  3.  Confront the objection that persistence is not evidence of function. You must address both: (a) the ambiguity of the eight-decade lack of contamination events, and (b) the possibility that the rule survived for non-functional reasons (e.g., inertia).  
  4.  Reach a verdict on the repeal proposal, including the pilot program. Defend this verdict. Specifically, address whether the monitored, reversible nature of the pilot discharges the burden the Procedural Presumption assigns, or whether the monitoring is itself a removal that the principle forbids.

  ***

  # Model Answer

  The well-water users' association relies primarily on the **Procedural Presumption**, though they often rhetorically slide into the **Substantive Wisdom Thesis**. This distinction is critical. If the objectors possess only the Procedural Presumption, their claim is merely that the planning staff must prove safety before changing the status quo; the rule stays not because it is wise, but because the risk of change is unproven. If they rely solely on the Substantive Wisdom Thesis, they claim the 100-foot rule is likely optimal despite lost records. If the latter is false (i.e., the rule is arbitrary), the Procedural Presumption can still hold: we may retain a potentially useless rule simply because we lack certainty that removing it is safe. However, without the Procedural Presumption, the Substantive Thesis collapses into mere speculation; without evidence of wisdom, there is no reason to keep the rule.

  Applied to this ordinance, the Procedural Presumption requires only that the rule existed and its rationale is now opaque. The facts support this: the preamble is destroyed, and no official knows the reason. The Substantive Wisdom Thesis, however, requires that the rule *actually* served a function worth preserving. Here, the facts undercut this premise. Hydrogeological modeling suggests 50 feet is adequate, implying the 100-foot requirement may be excessive rather than wise. The Presumption survives this data (demanding certainty before repeal), but the Wisdom Thesis is weakened by it.

  The objection that persistence is not evidence of function strikes at the Wisdom Thesis. First, the eight-decade absence of contamination is ambiguous. It supports the hypothesis that the rule prevented harm, but equally supports the hypothesis that the soil geometry made contamination unlikely regardless of the setback. We cannot distinguish prevention from luck without counterfactuals. Second, rules often survive due to inertia or the interests of beneficiaries (e.g., large lot owners) rather than functional efficacy. The fact that the rule hindered infill construction suggests it may have served exclusionary interests rather than safety. If the rule survived due to inertia, the Substantive Wisdom Thesis is false.

  *[Note: The following verdict represents one defensible position within the seminar's framework; the contrary verdict earns full credit if justified by the same conceptual distinctions.]*  
  Despite the weakness of the Wisdom Thesis, the Procedural Presumption warrants rejecting immediate full repeal. However, the pilot program is permissible. The Presumption forbids *irreversible* removal without proof of safety. The pilot is reversible; automatic reinstatement upon contamination preserves the status quo as a safety net. Thus, the pilot discharges the procedural burden by treating the repeal as a hypothesis test rather than a finalized dismantling. It respects the Presumption (by maintaining a return path) while acknowledging the lack of evidence for the Wisdom Thesis (by allowing reduction). The housing scarcity argument highlights the cost of the Presumption but does not negate the epistemic burden regarding safety. Therefore, the pilot should proceed, but full repeal remains barred until the pilot confirms safety over time.

  ***

  # Marking Scheme (25 Marks)

  **Allocation of Marks**  
  1.  **Distinction of Claims (5 marks):**  
      *   **A (5):** Explicitly identifies that objectors need the Procedural Presumption primarily; explains that the Wisdom Thesis strengthens but is not strictly necessary for the procedural claim. Notes that without the Presumption, the Wisdom Thesis is merely speculative.  
      *   **B (3):** Identifies the two claims but treats them as interchangeable or fails to explain the consequence of losing one (e.g., argues both must stand or fall together).  
      *   **C (1):** Fails to distinguish the claims; treats the objection as purely about "tradition."

  2.  **Application to Ordinance Premises (5 marks):**  
      *   **A (5):** Correctly identifies that the Presumption requires only opacity of rationale (supported by facts), while Wisdom requires actual functionality (undercut by hydrogeology).  
      *   **B (3):** Correctly identifies premises but misclassifies which facts support/undercut them (e.g., claims hydrogeology supports the Wisdom Thesis).  
      *   **C (1):** Discusses premises in the abstract without applying them to the specific facts of the case.

  3.  **Persistence ≠ Function Objection (5 marks):**  
      *   **A (5):** Addresses both edges: (a) the ambiguity of no contamination (prevention vs. low risk) and (b) non-functional survival (inertia/interests).  
      *   **B (3):** Addresses only one edge (usually the contamination ambiguity) or treats persistence as strong evidence despite the objection.  
      *   **C (1):** Ignores the objection or asserts persistence proves function.

  4.  **Verdict and Pilot Analysis (5 marks):**  
      *   **A (5):** Reaches a clear verdict. Analyzes the pilot specifically regarding reversibility vs. removal. Defends whether the pilot satisfies the Procedural Presumption.  
      *   **B (3):** Reaches a verdict but treats the pilot as irrelevant or fails to connect reversibility to the procedural burden.  
      *   **C (1):** Asserts a verdict without defense or ignores the pilot component.

  5.  **Argumentative Coherence (5 marks):**  
      *   **A (5):** Essay is structured logically; distinctions are maintained throughout; no internal contradictions.  
      *   **B (3):** Generally clear but slips into conflation of terms in later sections.  
      *   **C (1):** Disorganized or difficult to follow.

  **Characteristic Errors and Costs**  
  *   **Conflating Procedure and Substance (Cost: 5 marks):** Treating the Procedural Presumption as a claim about the wisdom of traditions. This invalidates Task 1 and Task 4.  
  *   **Precautionary Principle Confusion (Cost: 3 marks):** Framing the argument as looking forward to risks of *new* interventions only, rather than backward at the rationale of *existing* arrangements.  
  *   **False Dichotomy (Model vs. Tradition) (Cost: 3 marks):** Treating the hydrogeological model as "reason" and the ordinance as "mere tradition," ignoring that the ordinance is also evidence (precedent) and the model is also theoretical.  
  *   **Ignoring Reversibility (Cost: 3 marks):** Failing to analyze whether the pilot's automatic reinstatement clause satisfies the burden of proof.  
  *   **Distractor Focus (Cost: 2 marks):** Focusing primarily on the renter/housing scarcity issue. While relevant to policy, it is secondary to the epistemic justification question central to the prompt.

  **Epistemic Note for Markers**  
  The Model Answer takes a specific line on the verdict (approving the pilot). **Candidates who argue for immediate repeal or for maintaining the status quo without a pilot must receive full credit for Task 4**, provided they correctly apply the distinction between the Procedural Presumption and the Substantive Wisdom Thesis to justify their position. For example, a candidate may argue the pilot *is* a removal forbidden by the Presumption because monitoring is costly/burdensome, or that the hydrogeological model *discharges* the burden entirely. The grade depends on the rigor of the conceptual application, not the policy outcome.
