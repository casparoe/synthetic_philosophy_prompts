      *   **Addressing "Right to the City":** Don't let it be a slogan. Define it as a right to *participate*, not necessarily to *decide* outside one's jurisdiction.
      *   **Legal/Charter Distinction:** What can we decide vs. what needs voters? Interpretation of "community affected" is ours. Changing residency requirements is voters'.
      *   **The Exclusion Statement:** Be blunt. Who are we leaving out and why? (Commuters/Displaced due to legal standing/enforceability).
      *   **Fallback Plan:** What if sued? (Downgrade non-resident seats to advisory).
      *   **Closing:** Call to action for Thursday.

  4.  **Refining Tone and Word Count:**

      *   *Tone Check:* Needs to sound like a Chair speaking to peers. "Colleagues," "We," "Our duty." Avoid bureaucratic passive voice.
      *   *Word Count Check:* Keep an eye on the 900-1,200 range.
      *   *Specific Constraints:* Ensure the "Right to the City" and "Exclusion" sentences are sharp.

  5.  **Drafting - Iteration 1 (Mental Outline):**
