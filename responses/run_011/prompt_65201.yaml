answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** Chair
  **DATE:** October 10
  **SUBJECT:** Interpretation of "Community Affected" for Marbury Corridor Assembly

  Colleagues,

  We are out of time to argue past one another. The sortition procedure must be published in thirty days, and the Marbury Assembly convenes in eleven weeks. Our stalemate stems from conflating two distinct questions: who is *governed* by this plan, and who *stands to gain or lose* from it. The charter amendment requires members be drawn from the "community affected," but it establishes a body whose recommendations bind the Council absent a supermajority override. This binding authority imposes a legal ceiling on our philosophical ambitions.

  We cannot treat the Land Use Citizens' Assembly (LUCA) as a town hall for every stakeholder. It is a governing adjunct. Therefore, this opinion recommends we interpret "community affected" primarily through the lens of legal jurisdiction and residency, secondarily through citywide interest, and exclude regional or non-resident claims from the voting draw.

  **Recommended Composition Rule**

  For the Marbury Corridor and subsequent transit-area plans, the Commission adopts the following stratification for the sortition pool:

  1.  **Plan Area Residents (80% of seats):** Drawn from the 9,400 residents within the plan boundary. This ensures the majority of the assembly bears the direct burden of construction, displacement pressure, and neighborhood change.
  2.  **Citywide Residents (20% of seats):** Drawn from the remaining 180,000 city residents. This acknowledges that housing policy redistributes opportunity across the municipality and prevents the plan area from functioning as a veto-wielding enclave.
  3.  **Non-Voting Liaisons:** The displaced 1998 residents and a representative for future residents shall be invited as non-voting liaisons with full access to testimony and deliberation, but no ballot.
  4.  **Excluded Pools:** Regional commuters and non-resident workers are excluded from the draw.

  **Rationale and Legal Constraint**

  The City Attorney has warned that seating non-residents on a body with supermajority override power is legally unsettled. A challenge filed *after* sortition would invalidate the assembly's work, wasting public funds and destroying trust. We must interpret the charter to survive contact with the courts. "Community affected" in a legal instrument implies a community capable of being bound by the result. Residents are bound by zoning; commuters are not.

  This creates a defensible precedent for future area plans. We are establishing that "affected" means "subject to the regulatory authority of the city within the plan boundary," with a minority allowance for citywide interest. This avoids reopening this fight for the next corridor.

  **The Strongest Counter-Argument: Trust and Stacking**

  We must take seriously the argument that legitimacy requires the people who live under the plan to be the ones deciding it. If we allocate too many seats to outsiders, we risk the perception that the assembly was stacked to impose a outcome the neighborhood rejected. If Marbury residents conclude that a regional majority is dictating their street's character, they will view the LUCA not as a democratic innovation but as a tool of dispossession. The enterprise collapses in trust if the neighbors feel colonized by the city.

  However, the inverse is also true. If we restrict the draw *only* to plan residents, we empower a small committee to veto citywide housing needs, effectively exporting our housing problem to neighboring jurisdictions as our regional partners have warned. The 80/20 split balances these risks. It preserves the neighborhood's veto power within the assembly while ensuring the recommendation cannot be made in total ignorance of the city's broader housing crisis.

  **On the "Right to the City"**

  One colleague has invoked Lefebvre's "right to the city" to argue for commuter and displaced representation. As a moral claim, this is potent: those who build the city or are pushed out by it have a moral stake in its shape. As an operative rule for this charter, it is untenable. The "right to the city" cannot grant binding legislative power to those outside the municipality's jurisdiction. We can honor that right through testimony, liaison status, and council consideration, but not through the sortition ballot. To do otherwise confuses moral standing with legal authority.

  **Exclusion and Defense**

  We are excluding regional commuters and displaced former residents from the voting draw because the charter creates a binding body, and binding authority requires legal standing and residency we cannot grant without inviting successful litigation.

  **Charter Interpretation vs. Voter Amendment**

  This Commission has the authority to interpret "community affected" for the purpose of implementing the sortition mechanics. We are not changing the charter; we are defining its terms. However, if we wished to grant voting power to non-residents permanently, that would require a charter amendment voted on by the electorate. We are choosing the path of interpretation to meet the immediate deadline.

  **Political Cost and Fallback**

  We will pay politically for this. Plan residents may argue we diluted their voice; regional advocates will argue we ignored their stake. We must own both complaints.

  If a legal challenge is filed after the draw but before the first session, we have a fallback that does not require re-running sortition. The Commission shall issue an emergency re-interpretation converting all Citywide (20%) seats to advisory status for the duration of the litigation. The assembly may continue deliberating with a quorum of Plan Area residents only. This preserves the work product while mitigating the legal risk of non-resident voting power.

  **Conclusion**

  We cannot defer this. We cannot satisfy everyone. We must choose a rule that allows the assembly to convene, deliberate, and issue a recommendation that stands. The 80/20 resident split is the only path that respects the legal constraints of the charter while acknowledging the citywide stakes of land use.

  I move we adopt this interpretation Thursday.
