      *   **The Problem:** The charter says assembly members must be drawn from the "community affected by the plan," but doesn't define it. Five candidate pools are debated (Plan Area Residents, All City Residents, Regional Commuters, Displaced Former Residents, Future Residents).
      *   **Legal Constraint:** City Attorney warns that seating non-residents on a body with supermajority override power is legally unsettled/risky. Challenge *after* sortition is worse than *before*.
      *   **Core Tension:** "Who is governed?" vs. "Who stands to gain/lose?"
      *   **Requirements:**
          *   Length: 900-1,200 words.
          *   Tone: Commission opinion (collegial, authoritative, deliberative), *not* a policy brief.
          *   Content: Recommend concrete composition rule (pools, seats, reserves, etc.), criteria for future plans, fallback if challenged.
          *   Specific Instruction: Address the strongest counter-argument seriously (legitimacy/trust/stacking).
          *   Specific Instruction: Address "Right to the City" (Lefebvre) – operationalize it or dismiss it.
          *   Specific Instruction: Distinguish between Charter Interpretation (Commission power) vs. Charter Amendment (Voter power).
          *   Specific Instruction: Name exactly who is excluded and why.
          *   Negative Constraint: No "broader outreach," no "everyone should feel heard," no "defer to next cycle."

  2.  **Determine the Recommendation:**

      *   *Legal Reality:* The City Attorney's warning is the hard constraint. If non-residents create legal vulnerability that kills the assembly's work, we must prioritize residents.
      *   *Philosophical Balance:* We need to balance "who is governed" (residents) with "who is affected" (region/commuters/displaced).
      *   *Solution:* A hybrid model that prioritizes Plan Area Residents for the voting majority (to satisfy legal safety and "governed" principle) but allocates a minority of seats to Citywide Residents (to satisfy "citywide opportunity").
      *   *Exclusions:* Commuters, Displaced, Future Residents must be excluded from the *voting* draw due to legal/logistical constraints, but given non-voting liaison roles.
      *   *Lefebvre:* "Right to the City" means participation in decision-making, but in a representative democracy (even sortitional), that right is bounded by jurisdiction and legal standing. It cannot override the charter's residency implication.
      *   *Fallback:* If challenged, convert non-resident seats to advisory only, preserving the quorum of residents.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
