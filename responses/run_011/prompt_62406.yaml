      *   *Audience Friction Points:*
          *   **Kantians:** Will hate the idea of "trading" rights or treating moral principles as negotiable commodities. Duty vs. Prudence.
          *   **Contractarians (Legitimacy/Scanlonian):** Will ask about "reasonable rejection." Is a bargain legitimate if based on power/costs rather than justification?
          *   **Reasonable Pluralists:** Will question if "certainty" undermines the basis of pluralism. Is this just modus vivendi?
          *   **Economists/Game Theorists:** Will attack the Coasean analogy. Initial endowments matter. Threat points define the surplus. Transaction costs aren't neutral.
          *   **General Philosophers:** Is this just pragmatism masking relativism? Does it dissolve moral obligation into prudence?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (High Damage):* The Kantian/Deontological objection. If I know you're wrong, allowing you to do wrong is complicity. Trading rights over "conduct" implies I own the right to stop you, but maybe I don't have the right to *not* stop you if it's evil.
      *   *Objection 2 (High Damage):* The Contractarian/Legitimacy objection. This is a *modus vivendi*, not a moral obligation. It's based on power/cost, not justification. It fails the "reasonable rejection" test if one side is coerced by high enforcement costs.
      *   *Objection 3 (High Damage - Formal):* The Endowment Effect. Coase theorem requires defined property rights. Who owns the "control right" initially? If you own the right to intervene, I have to buy it. If I own the right to non-interference, you have to pay me. The "gains from trade" depend entirely on this initial assignment, which is a moral question, not an economic one.
      *   *Objection 4 (Medium-High):* The "Wrongdoing" objection (Williams/Integrity). Compromising on core values damages integrity. It's not just a cost; it's a constitutive loss.
      *   *Objection 5 (Medium):* The Game Theorist. Threat points. If one side has lower enforcement costs (tyranny is cheap), the "trade" favors the tyrant. This entrenches power, not justice.
      *   *Objection 6 (Medium):* Reasonable Pluralism. You assume certainty. But the whole point of liberal politics is managing *disagreement*, not certainty. Your model precludes the actual political problem.
      *   *Objection 7 (Low-Medium):* The EA/Representation objection. Who is at the table? Future generations? Animals? They can't bargain. Your model excludes voiceless stakeholders.
      *   *Objection 8 (Low):* Semantic/Category Error. Calling it "moral compromise" is misleading. It's just prudence. Don't relabel self-interest as morality.

