          6.  **Pluralist (Certainty):** If certainty is unrealistic, the model doesn't apply. (Moderate).
          7.  **EA (Representation):** Excludes stakeholders. (Moderate).
          8.  **Semantic (Prudence):** Just renaming. (Low).

      *Let's adjust the "Must Land" and "Pray Doesn't Come" based on this.*
