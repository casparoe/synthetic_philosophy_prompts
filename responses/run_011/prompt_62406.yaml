answer: |-
  # QUESTION-PERIOD SHEET
  **Workshop:** Interdisciplinary PPE  
  **Topic:** Moral Compromise as Coasean Trade  
  **Time Allocation:** 20 Minutes Q&A  
  **Prepared By:** [Your Name]

  ---

  ### 1. The Initial Endowment Objection (Formal/Economist)
  **Vocabulary:** Coase Theorem, Property Rights, Invariance Thesis, Baseline Allocation.
  **The Challenge:** "The Coase Theorem only guarantees efficiency *given* an initial allocation of entitlements. It says nothing about which allocation is just. By defining the trade as one over 'control rights,' you've implicitly assigned the initial right to interfere (or not) without moral argument. If the initial assignment is moral, your 'trade' is derivative. If it isn't, the resulting equilibrium has no normative force. You haven't solved the moral problem; you've just assumed a property regime."
  **Damage:** **Fatal.** If the initial allocation does the moral work, the thesis that trade *generates* the obligation collapses.
  **2-Minute Reply:** "I concede the Coasean invariance thesis holds for efficiency, but I reject that it holds for the *existence* of the surplus. My claim is that the 'endowment' is the physical capacity to act and interfere, which is a brute fact, not a moral right. The 'trade' isn't transferring a moral right; it's a mutual restraint on physical capacity to avoid destruction. The moral obligation arises not from the initial allocation, but from the *refusal* of a positive-sum move when transaction costs are low. That refusal is a Pareto-domination of your own values."
  **Weakness:** **High.** This leans heavily on distinguishing "capacity" from "right," which philosophers will treat as a distinction without a difference. It risks begging the question on why physical capacity generates a pro tanto obligation.
  **Concede Up Front?** **No.** This is the core fight. Flag it in the talk as a "brute fact baseline" to prepare the ground.

  ### 2. The Complicity Objection (Kantian/Deontologist)
  **Vocabulary:** Categorical Imperative, Duty, Complicity, Commodification, Second-Personal Reasons.
  **The Challenge:** "You treat moral principles as preferences to be satisfied. But if I am certain your action is wrong, allowing it is not a 'cost-saving measure'; it is complicity in wrongdoing. I have a duty to prevent evil, not a preference to minimize enforcement costs. To trade away my duty for 'cooperation' commodifies the moral law. You are describing prudence, not morality."
  **Damage:** **Severe.** Undermines the claim that this is a *moral* obligation rather than mere prudence.
  **2-Minute Reply:** "I am not asking you to trade away the judgment that the act is wrong. I am asking you to recognize that *enforcing* that judgment has a cost denominated in your own values (e.g., social stability, resources for other good works). If the cost of enforcement destroys more value *by your own lights* than the wrong act does, you are not fulfilling your duty by enforcing; you are engaging in moral vanity. The obligation is to maximize the good as you see it, not to perform purity spirals."
  **Weakness:** **Medium.** Risks sounding consequentialist to a deontologist. They may insist some duties are side-constraints regardless of cost.
  **Concede Up Front?** **Yes, partially.** Concede that this applies only to "non-catastrophic" disagreements to avoid the "Nazi" counterexample.

  ### 3. The Legitimacy Objection (Contractarian/Scanlonian)
  **Vocabulary:** Reasonable Rejection, Justification, Modus Vivendi, Public Reason.
  **The Challenge:** "This is a classic *modus vivendi*. It rests on a balance of power and enforcement costs, not on reasons that the other party can accept as justified. If my enforcement costs rise (I get weaker), the 'obligation' to compromise shifts. A theory of moral compromise that changes its verdicts based on who has the bigger stick is not a theory of legitimacy; it's a theory of coercion."
  **Damage:** **Severe.** Attacks the stability and normative authority of the obligation.
  **2-Minute Reply:** "I agree it is not a theory of justification in the sense of convincing the other they are wrong. It is a theory of *coexistence* under certainty. The obligation isn't grounded in the other's acceptance, but in the *waste* of value. However, because the trade is reciprocal and positive-sum on *both* scales, it mimics the stability of a contract without requiring shared premises. It's not coercion if both parties prefer the waiver to the war."
  **Weakness:** **Medium.** "Preferring war to peace" is rarely the frame; usually, it's "submitting to injustice vs. fighting."
  **Concede Up Front?** **No.** Distinguish clearly between *justification of values* and *justification of social arrangement*.

  ### 4. The Asymmetric Tyranny Objection (Game Theorist)
  **Vocabulary:** Threat Points, Asymmetric Costs, Equilibrium Selection, Commitment.
  **The Challenge:** "Suppression costs are not symmetric. If Agent A is a tyrant who cares nothing for social cost, and Agent B is liberal and bears high costs for conflict, the Coasean bargain favors A. The 'compromise' will be A doing whatever they want and B paying them to stop. Your model doesn't just describe compromise; it incentivizes raising enforcement costs (threatening violence) to shift the threat point."
  **Damage:** **High.** Makes the theory normatively repugnant and strategically unstable.
  **2-Minute Reply:** "That is a feature of the real world, not a bug of the model. My claim is descriptive and normative: if B refuses to trade, B gets war, which B values less. The obligation is *pro tanto*. It does not preclude building institutions that lower the threat point of tyrants. But in the absence of such institutions, refusing the trade is self-harm, not heroism."
  **Weakness:** **High.** Sounds like appeasement. Hard to defend as "moral."
  **Concede Up Front?** **Yes.** Acknowledge this limits the theory's application to contexts with rough symmetry or external enforcement.

  ### 5. The Integrity Objection (Williams/Identity)
  **Vocabulary:** Integrity, Ground Projects, Constitutive Commitments, Alienation.
  **The Challenge:** "Some commitments are constitutive of the agent. To trade them is not to incur a cost; it is to cease to be the same agent. If my value system forbids X, allowing X isn't a 'waiver'; it's an alienation of my moral agency. You assume agents are stable preference-buckets. They aren't."
  **Damage:** **Medium-High.** Attacks the psychological realism of the agent model.
  **2-Minute Reply:** "I distinguish between *core identity* and *policy demands*. The trade is over conduct in the shared social sphere, not internal belief. I am not asking you to believe X is good. I am asking you to waive enforcement of your ban on X in zone Y. Integrity is preserved if the waiver is itself consistent with your higher-order value of social peace."
  **Weakness:** **Medium.** The line between "policy" and "identity" is exactly where philosophers fight.
  **Concede Up Front?** **No.** Keep the distinction sharp in the talk.

  ### 6. The Certainty Objection (Political Philosopher/Pluralist)
  **Vocabulary:** Reasonable Pluralism, Epistemic Humility, Fact of Reasonable Disagreement.
  **The Challenge:** "You assume agents are *certain* they are right. But the modern political problem arises because reasonable people *know* they might be wrong. Your model ignores the epistemic virtue of humility. If I admit uncertainty, I don't need Coasean trade; I need truth-tracking. If I don't, I'm a fanatic. Your model only works for fanatics."
  **Damage:** **Medium.** Limits the scope of the theory to unrealistic agents.
  **2-Minute Reply:** "I am solving the harder problem. If compromise is required under certainty, it is *a fortiori* required under uncertainty. By removing moral uncertainty from the equation, I show that compromise does not depend on doubting your values. It depends on respecting the *cost* of imposing them. This makes the obligation robust even for the true believer."
  **Weakness:** **Low.** A strong defensive move, but may irritate pluralists who think certainty is the root evil.
  **Concede Up Front?** **No.** This is your unique selling point.

  ### 7. The Representation Objection (EA/Utilitarian)
  **Vocabulary:** Stakeholders, Voiceless Interests, Aggregation, Representation.
  **The Challenge:** "Who is at the bargaining table? Your model requires bilateral trade. But what about future generations, animals, or the global poor who cannot enforce costs? If they can't threaten suppression, they get no 'control rights' to trade. Your Coasean market excludes those without leverage."
  **Damage:** **Medium.** Highlights a major blind spot in the "gains from trade" framework.
  **2-Minute Reply:** "Correct. This is a theory of *inter-agent* compromise, not ideal justice. Agents with leverage must act as proxies for those without, internalizing their costs into their own value systems. If you value animals, their suffering is *your* cost. The trade happens between you and the other human, but your utility function should represent the voiceless."
  **Weakness:** **Medium.** Relies on the agent actually caring about the voiceless. If they don't, the model fails them.
  **Concede Up Front?** **Yes.** Explicitly state the theory assumes agents have comprehensive value functions.

  ### 8. The Category Error Objection (General Philosopher)
  **Vocabulary:** Prudence, Morality, Is-Ought, Redescription.
  **The Challenge:** "You've simply redescribed prudential restraint as moral obligation. 'I won't stop you because it's too expensive' is not a moral claim. Calling it a 'pro tanto obligation' is just linguistic inflation to make realpolitik sound like ethics."
  **Damage:** **Low.** Semantic, but annoying.
  **2-Minute Reply:** "If 'morality' includes the obligation not to waste value when cooperation is possible, then this is moral. If morality requires self-sacrifice without return, I reject that definition. I am offering a naturalized account of obligation grounded in the structure of agency and scarcity, not in supernatural duty."
  **Weakness:** **Low.** Just a definitional standoff.
  **Concede Up Front?** **No.** Stand firm on the definition of obligation.

  ### 9. The Dynamic Inconsistency Objection (Game Theorist)
  **Vocabulary:** Time Consistency, Renegotiation, Holdout.
  **The Challenge:** "Even if the trade is optimal now, what stops me from accepting the waiver, building strength, and reneging later? Without an external enforcer, Coasean bargains over moral conduct are dynamically inconsistent. The 'obligation' evaporates the moment the threat point shifts."
  **Damage:** **Low-Medium.** Practical implementation issue.
  **2-Minute Reply:** "True, which is why the obligation is *pro tanto* and continuous. It requires ongoing monitoring and re-trading. It's not a one-off contract; it's a repeated game equilibrium. The obligation is to maintain the equilibrium, not to sign a treaty."
  **Weakness:** **Low.** Acceptable limitation.
  **Concede Up Front?** **No.**

  ---

  ### STRATEGIC ADD-ONS

  **1. The Single Reply That Must Land**
  **Objection:** #1 (The Initial Endowment Objection).
  **Why:** If the economists convince the room that the "initial allocation of control rights" is a moral premise disguised as a brute fact, your claim that this model avoids moral aggregation collapses. You must convince them that the *physical capacity to interfere* is pre-moral, and that the *obligation* arises solely from the refusal of the surplus. If you fail here, you are just doing standard contract theory with extra steps.

  **2. The Objection to Pray Nobody Raises**
  **Objection:** **The "Atrocity" Case (Variant of #2 & #4).**
  **Scenario:** "Suppose Agent B is a genocidal maniac. Suppression costs are high (civil war). Your model suggests Agent A has a *pro tanto obligation* to compromise (waive enforcement) to avoid the cost of war. Are you arguing we are obligated to compromise with evil if the price of stopping it is too high?"
  **Why:** You have no good answer. If you say "Yes," you lose the room morally. If you say "No," you must introduce a moral threshold external to the Coasean calculus, which admits that the trade model is insufficient to handle the most important moral cases. It exposes the theory as working only for "civilized" disagreements.
  **Mitigation:** If raised, pivot hard to the *pro tanto* nature. "The obligation is real but easily overridden by the catastrophic disvalue of the atrocity itself in the suppressor's calculus." (This is weak, but it's all you have).

  **3. Where the Economists Say You Smuggled Entitlements**
  **Location:** **In the definition of "Suppression Costs."**
  **The Trap:** To calculate the cost of "suppressing the other system's demands," you must define a baseline where the other system is *acting*. By treating their action as the default state that requires resources to stop, you have implicitly assigned them the **property right to act**.
  **The Counter:** If you had assigned the *victim* the right to safety, the "cost" would be denominated as "damages paid to the victim," not "enforcement costs." By framing it as enforcement costs, you assume the aggressor has the right to aggress unless bought off. The economists will spot that your "neutral" cost metric is actually a libertarian initial entitlement.
  **Defense:** Argue that "capacity to act" is the physical baseline, distinct from "right to act." The trade is about restraining capacity, not validating rights. (See Reply #1).
