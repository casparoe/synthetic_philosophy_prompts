      *   *Must Land:* The Endowment/Initial Rights objection (Economist). If the initial allocation is moral, the trade is derivative. Need to argue the *process* generates the moral content, or that the default is non-interference.
      *   *Pray Doesn't Come:* The "Complicity/Integrity" objection (Williams/Kantian hybrid). If allowing evil is itself evil, the calculus breaks. Hard to answer without conceding the thesis is only for "permissible" disagreements.
