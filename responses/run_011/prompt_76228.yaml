answer: |-
  The heat off the salt flats past Kalida didn't shimmer; it hammered. It pressed down on the corrugated tin roof of the towing co-op shack until the metal groaned. Inside, the air smelled of ozone and stale coffee. Marisol sat on a bench bolted to the floor, feeling the hum of the anchor in her blood. It was a low-frequency vibration, a chemical metronome counting down the weeks of her stability. Five weeks. Thirty-five days. Then the compound metabolized, and she would be herself again: fluid, changeable, free.

  Today was Day Zero. The bill was due on Day Sixty.

  The operator, a man named Senn with eyes clouded by cataracts, waved the first traveler forward. His name was Kael. He looked dry, lips cracked, dust caked in the creases of his neck. He stood before the console where the headset rested on a foam pad.

  "Know the deal," Senn said. His voice was flat, practiced. "We tow you to Kalida. You pay upon arrival. No courts touch us. No contracts bind us. Only the probe."

  Kael kicked at the leg of the console. "And if I say I'll pay, but when I'm warm and fed, I decide not to?"

  "Then you stay here," Senn said. "Put it on."

  Kael hesitated, then strapped the headset over his eyes. The machine whirred, a sound like insects waking up. On the monitor facing Senn, a waveform spiked.

  "Show me the projection," Kael said. His voice muffled slightly by the gear.

  "Sixty days out," Senn murmured, typing. "Render active."

  Marisol watched the screen. It showed a simulation of Kael, sitting in a cafe in Kalida. He looked healthier, but the eyes were the same. A text box scrolled beside the image: *Intent Endorsement: Negative.*

  "See that?" Senn said, pointing. "Sixty days from now, you look at this promise and you call it a mistake. You say you'd rather keep the credits."

  Kael ripped the headset off. "Because it *is* a mistake. Once I'm in town, I have the leverage. Why would I give you money for something you've already done?"

  "Because if everyone thought like that, we'd turn the trucks off," Senn said. "And you'd bake out there."

  "Maybe I won't bake," Kael said, tossing the headset onto the pad. "Maybe I'll walk. Maybe someone else comes along. I'm not buying a leash just to get a ride."

  "Then you don't get the ride," Senn said. He hit a switch. The heavy lock on the shack door clicked shut. "Wait here until the next survey plane passes. Could be a week. Could be never."

  Kael swore, slammed his hand against the metal wall, but he didn't argue further. He slumped into the corner where the shade barely reached. He looked at Marisol. "You're next. Don't let them weld your brain shut for a truck ride."

  Marisol stood up. Her legs felt heavy, weighted by the anchor. She sat in the chair and pulled the headset down. The foam was warm from Kael's skin.

  "Ready," she said.

  "Focus on the transaction," Senn instructed. "Form the intention. I will pay upon arrival. Hold it."

  Marisol closed her eyes. She felt the anchor surge, a cool wash locking the thought into place. *I will pay.* It wasn't just a thought; it was a structural beam in her mind. She couldn't imagine not paying. The chemistry wouldn't let her.

  "Render," Senn said.

  Marisol saw the cafe. She saw herself sixty days out. She looked tired, but steady. The text box scrolled: *Intent Endorsement: Positive.*

  "Subject confirms," Senn said. "Even post-decay?"

  "Decay is irrelevant to the commitment," Marisol said. Her voice sounded strange to her, amplified by the headset. "The person I am then knows the person I am now needed this."

  "Pass," Senn said. He hit the unlock switch. "Truck's outside. Load up."

  Marisol took the headset off. Kael was watching her from the shadows.

  "You know that thing in your neck expires," Kael said. "I heard about that clinic. Five weeks. You're owing money on day sixty-one with no lock on your head."

  "I know," Marisol said.

  "Then you're a fool," Kael said. "You're paying for a virtue you won't feel when the bill comes."

  "Maybe," Marisol said. She walked out into the blinding white.

  The tow took four hours. The driver didn't speak. He dropped her at the edge of Kalida, where the pavement started, and drove back toward the salt without waiting for a handshake. Marisol went to a clinic to rent a room and wait out the decay.

  The weeks passed. The hum in her blood faded. By week four, the certainty began to fray. She found herself calculating costs. The tow had been expensive. The clinic had been more expensive. She could buy a new identity for what she owed the co-op. She could leave Kalida. The co-op had no courts. No bonds. They had only the probe, and the probe was back on the salt flat.

  On Day Fifty-Eight, she heard the news in a diner. A local freight hauler was talking about the dry lake.

  "Survey bird went down near the co-op shack," the hauler said. "Mechanical failure. Grounded for three days."

  "Anyone out there?" a waitress asked.

  "Found a traveler," the hauler said. "Guy named Kael. Been sitting on the salt. Storm kicked up, confused the sensors. Rescue team spotted his heat signature. Brought him in free. Standard protocol for distress signals."

  Marisol froze, her fork halfway to her mouth.

  "So he didn't pay?" the waitress asked.

  "Couldn't pay. Didn't get towed. Got rescued. Walks away clean."

  Marisol put the fork down. The metal clicked against the ceramic. She felt a sudden, sharp hollowness in her chest. Kael had gambled on chaos and won. He had refused the binding, refused the anchor, and the universe had rewarded his stubbornness with luck. She had bought the lock. She had paid for the certainty. And now, on the eve of the payment, the lock was gone, and she was just a woman with a bill and a choice.

  Day Sixty-One. The sun rose over Kalida, bright and indifferent. Marisol walked to the transfer office where the co-op collected their dues. The line was short. When she reached the window, the clerk didn't look up.

  "Name?"

  "Marisol."

  "Origin?"

  "Salt Flat Sector 4."

  "Amount due." The clerk slid a tablet across the counter. The number was high. It represented the fuel, the wear, the risk.

  Marisol looked at the number. She thought of Kael, sitting in a government shelter, drinking free water, laughing about the suckers who paid. She thought of the anchor, now fully metabolized, leaving no trace in her system. She was free. She could walk away. There was no hand to stop her. No probe to scan her. No chemical hum to force her hand.

  She looked at her own reflection in the dark glass of the window. She looked like the woman in the simulation. Tired. Steady.

  She reached into her bag. Her fingers brushed against the credits, cold and smooth. She could put them back. She could turn around. She could be the person who keeps her assets instead of her promises. She could be the person who survives by luck.

  Her hand moved. She didn't think about the system. She didn't think about the next traveler who would stand in the shack. She didn't think about virtue. She thought about the promise she had made when she was still welded to herself.

  She slid the credits across the counter. The clerk stamped a receipt without looking at her face.

  Marisol took the paper. It was thin, cheap stock. She folded it once, then twice, until it was a small square in her palm. She walked out into the street, the receipt crumpled tight in her fist, knuckles white against the dust.

  ***

  **Author's Note**

  In writing the ending, I sided with the position that the *disposition* to keep promises holds value independent of the immediate outcome or enforcement. Marisol pays not because she is caught, but because she chooses to remain the kind of person who honors the commitment, even when the chemical "lock" has dissolved and the foil's luck suggests cheating is viable. I built it this way to argue that trust systems collapse if individuals opt out whenever enforcement disappears, regardless of whether they get away with it personally.

  However, the story takes liberties with the philosophy. First, the "consistency probe" assumes a knowable, static future self, whereas many philosophers argue personal identity is too fluid to predict endorsement sixty days out. Second, the chemical anchor simplifies the concept of "binding oneself." In the actual debate, the binding is usually logical or psychological, not a pharmaceutical with a half-life. By making it chemical, I sacrificed the nuance of *why* one stays committed (reason vs. biology) to heighten the dramatic tension of the decay curve. I gave up the exploration of internal moral reasoning for the clearer stakes of a ticking clock.
