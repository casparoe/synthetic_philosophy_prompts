  Here is the complete mechanical plan, including the solution to the Phase Two logical puzzle, the timeline, card contents, and failure analysis.

  ### 1. The Phase Two Puzzle: Solution and Recommendation

  **The Problem:** You are correct to be worried. If your vocabulary includes relational predicates like *"is one mile from,"* a complete description of a two-sphere world **must** differ from a one-sphere world. The two-sphere description entails $\exists x \exists y (x \neq y)$, while the one-sphere description entails $\neg \exists x \exists y (x \neq y)$. If students produce identical descriptions, they have either failed to describe the world completely or the vocabulary is too weak to describe Black's case.

  **The Fix:** You must decouple the **Vocabulary** from the **Ontology** in Phase One.
  Do not give them relational predicates in Phase One. Give them only **Monadic Predicates** (e.g., *Is Iron, Is Spherical, Has Mass M*).
  *   **World Card A:** "This world contains exactly **one** object."
  *   **World Card B:** "This world contains exactly **two** objects."
  *   **Task:** "List every **property type** instantiated in your world. Do not count objects. Do not use numbers."
  *   **Result:** Both groups produce the identical list: *{Iron, Spherical, Mass M}.*
  *   **The Reveal:** In Phase Two, they discover the lists match. You then reveal the hidden object counts.
  *   **The Lesson:** Qualitative description (the list) failed to capture numerical difference (the count). This sets up PII perfectly without lying about spatial relations.
  *   **Phase Three:** You then *add* spatial relations to the vocabulary. Students try to use them to distinguish the spheres. The Auditor blocks any attempt to name/label the spheres ("Sphere A is left..."). This forces them toward weak discernibility ("Something is distance $d$ from something else").

  **Recommendation:** Do not use the "1 vs 2" trick for the *spatial* case. Use it for the *monadic* case to show the insufficiency of qualities, then move to the "2 vs 2" symmetric case for the spatial debate. However, to preserve your architecture, I have designed the cards below to use the **Monadic Restriction** in Phase One to make the 1-vs-2 logic work, then expand the vocabulary in Phase Three.

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Move desks into 6 trios. Distribute **Vocabulary Card V1** (Monadic only) and **World Cards** (3 groups get "1 Object", 3 groups get "2 Objects"). |
  | **05-20** | **Phase 1** | **The Blind Description.** Trios write a "World Profile" listing all property types instantiated. They cannot mention object count or names. |
  | **20-30** | **Phase 2** | **The Match & The Bet.** Pair up a "1 Object" trio with a "2 Object" trio. They compare Profiles (they match). You reveal the hidden object counts. Students place bets (tokens) on: *"Can a qualitative description ever distinguish these worlds?"* |
  | **30-45** | **Phase 3** | **The Auditor.** Distribute **Vocabulary Card V2** (Adds Spatial Relations). Students try to write a description that distinguishes the spheres. The **Auditor** (rotating role) vetoes any use of names, indexicals, or asymmetric relations. |
  | **45-55** | **Phase 4** | **The Inconsistency.** Hand out two identical index cards to every student. Ask: "Are these the same card?" Discuss why they say "no" (location/history). Ask: "If we strip location (like the spheres), are they still two?" |
  | **55-70** | **Debrief** | Connect activity to Leibniz, Black, PII, Haecceity, Weak Discernibility. (See Debrief Map below). |
  | **70-75** | **Close** | Collect bets. Announce Week 6 reading based on majority vote. |

  ### 3. Card Contents

  #### **Vocabulary Card V1 (Minutes 0-20)**
  > **ALLOWED PREDICATES:**
  > *   Is Iron
  > *   Is Spherical
  > *   Has Mass M
  > *   Is Red (optional distractor)
  >
  > **RULES:**
  > 1.  List the **types of properties** present in your world.
  > 2.  Do **NOT** use numbers (one, two, first, second).
  > 3.  Do **NOT** use names (A, B, Alpha, Beta).
  > 4.  Do **NOT** use spatial terms (left, right, here, there, distance).
  > 5.  Do **NOT** count the objects.

  #### **World Cards (Minutes 0-20)**
  *   **Card Type A (3 copies):** "You are observing a universe. It contains exactly **ONE** object. That object possesses the properties listed on Vocabulary Card V1."
  *   **Card Type B (3 copies):** "You are observing a universe. It contains exactly **TWO** objects. Both objects possess the properties listed on Vocabulary Card V1."

  #### **Vocabulary Card V2 (Minutes 30-45)**
  > **NEW ALLOWED PREDICATES:**
  > *   Is at distance *d* from...
  > *   Is to the left of... (Banned by Auditor Rule 3)
  >
  > **TASK:** Write a sentence that distinguishes the two objects in the Type B world.

  ### 4. The Auditor Role & Rules

  In Phase Three, one student per trio acts as **Auditor**. They hold a red pen. They must strike through any violation.

  **The Auditor's Three Veto Rules:**
  1.  **No Proper Names:** You cannot label an object "Sphere A" or "The First Sphere."
  2.  **No Indexicals:** You cannot use "this," "that," "here," or "there."
  3.  **No Asymmetric Relations:** You cannot say "Sphere 1 is left of Sphere 2" unless "Left" is in the vocabulary (it is not; only "Distance" is). Even with "Distance," you cannot say "$a$ is distance $d$ from $b$" if $a$ and $b$ are names. You must say: *"There exist x and y such that x is distance d from y."*

  **Adjudicating New Properties:**
  If a student proposes a property not on the card (e.g., "Is the leftmost object"):
  *   **Auditor Action:** Strike it out.
  *   **Rationale:** "That property is not in the shared vocabulary. We are testing if *these* resources can distinguish the objects."
  *   **If the class protests:** "Write it on the board for the Debrief." (This validates their intuition without breaking the game).

  ### 5. Payoff Scheme (No Money)

  **The Stake:** Control over the syllabus.
  *   **Option A:** A dense, primary text excerpt (e.g., Black's original *Mind* paper).
  *   **Option B:** A clearer, secondary guide (e.g., a Stanford Encyclopedia entry or textbook chapter).

  **The Mechanism:**
  1.  In Phase 2, each student receives 1 token (a scrap of paper).
  2.  They bet the token on: *"The Qualitative Description IS sufficient"* (Option A path) vs. *"The Qualitative Description IS NOT sufficient"* (Option B path).
  3.  **Winning Condition:** There is no "correct" answer in metaphysics. However, tell them: "If the majority of the class can successfully write a description in Phase 3 that survives the Auditor without using forbidden terms, Option A wins. If the Auditor strikes out everyone's attempt, Option B wins."
  4.  **Result:** Usually, the Auditor wins (Option B). This validates their struggle and gives them agency in the reading difficulty.

  ### 6. The Built-In Inconsistency (Phase 4)

  **The Setup:**
  Hand every student two identical index cards from your stack.
  **Ask:** "Are these the same card?"
  **Expected Answer:** "No."
  **Ask:** "Why? They share all properties on Vocabulary Card V1."
  **Expected Answer:** "They are in different hands." / "They have different histories."
  **The Collision:** "In the Sphere Case (Phase 3), you agreed location doesn't count as a distinguishing property (because we banned spatial indexicals and the spheres are symmetric). Why does location count for the cards?"
  **Goal:** Force them to see that in ordinary life, we rely on **spatiotemporal path** (which Black excludes) or **haecceity** (primitive "thisness"). When those are removed in the thought experiment, their ordinary intuition collapses.

  ### 7. Debrief Map (55-70 Minutes)

  Use the two whiteboards. Label one **"The Activity"**, the other **"The Metaphysics"**. Draw lines connecting them.

  | Activity Moment | Metaphysical Concept | Lecturer Script (Key Phrases) |
  | :--- | :--- | :--- |
  | **Phase 1 Match** (1-object vs 2-object profiles matched) | **PII (Principle of Identity of Indiscernibles)** | "Your lists were identical. Leibniz says if properties match, objects match. Your lists said 'Iron', but the worlds differed. Did your language fail, or is there a difference without a property?" |
  | **Phase 3 Auditor Vetoes** (Striking out "Sphere A") | **Haecceity / Thisness** | "When you tried to say 'This sphere', the Auditor stopped you. That 'thisness' you wanted to use is what philosophers call *haecceity*. It's a property of being *this* particular thing, distinct from all qualities." |
  | **Phase 3 Failure** (Cannot distinguish symmetric spheres) | **Black's Counterexample** | "Max Black argued exactly this. If the universe is symmetric, there are no unique qualities. If you still think they are two, you are rejecting Leibniz." |
  | **Phase 4 Cards** (Location distinguishes cards) | **Spatiotemporal Relations** | "You used location for the cards. Black asks: Is location a *property* of the object, or just a relation? If relations count, PII is trivial. If they don't, Black wins." |
  | **Weak Discernibility** (The "Distance" move) | **Weak Discernibility** | "Did anyone say 'Something is distance d from something'? That doesn't name them, but it implies plurality. This is *weak discernibility*. It saves PII only if relations count as properties." |

  ### 8. The Physics Majors (Quantum Particles)

  **Strategy:** **Defuse and Park.**
  If they raise it in the first 10 minutes:
  *   **Say:** "That is an excellent point about quantum mechanics. In QM, particles can be indistinguishable in a way that violates PII. However, this week we are doing **classical metaphysics**. We are testing the logic of identity *before* we add the physics. If we solve it for iron spheres, we have a baseline for the quantum case."
  *   **Extension (If they persist in Debrief):** Spend 5 minutes explaining that Black's case anticipated quantum bosons.
  *   **Cost:** 5 minutes from Q&A. Do not let it derail Phase 3.

  ### 9. Failure Analysis: What Will Go Wrong

  **1. The "Gotcha" Feeling (Phase 2 Reveal)**
  *   **Risk:** Students feel tricked by the 1-vs-2 card setup. "Of course the descriptions matched, you wouldn't let us write numbers!"
  *   **Mitigation:** Frame it explicitly as a **limitation of qualitative language**. "I didn't trick you; I restricted the tools to show that *qualities alone* might not capture *number*." Acknowledge the constraint openly.
  *   **If the room turns:** Stop the game. "Okay, the constraint feels artificial. Let's talk about why I imposed it. I wanted to see if you could distinguish them *without* counting. You couldn't. Why?"

  **2. The Auditor Becomes a Tyrant**
  *   **Risk:** The Auditor enjoys vetoing everything, causing frustration.
  *   **Mitigation:** Give the Auditor a script: "I am not saying you are wrong about the world. I am saying that sentence is not in the allowed vocabulary."
  *   **Backup:** If a trio stalls, step in as "Chief Auditor" and allow one "Appeal" to the whiteboard (writing the forbidden term for later discussion).

  **3. Weak Discernibility Confusion**
  *   **Risk:** Students think "Distance" solves everything.
  *   **Reality:** Black argues that if $a$ is distance $d$ from $b$, and $b$ is distance $d$ from $a$, they still share the relational property "being distance $d$ from something."
  *   **Your Move:** In Debrief, clarify: "Does 'being distance $d$ from *something*' distinguish $a$ from $b$? Or does it just distinguish the *pair* from a single sphere?" This is the crux of the debate you must supply by hand.

  **4. What The Activity Cannot Reproduce**
  *   **The Modal Intuition:** Black's case relies on the *possibility* of such a universe. Students often say "But that universe is impossible." The activity treats it as actual. You must explicitly state in the Debrief: "We are talking about *metaphysical possibility*, not physical likelihood."
  *   **The Triviality Worry:** If relations count, PII is trivially true. You must explain why philosophers care about *intrinsic* vs. *extrinsic* properties. The activity treats all predicates equally; you must restore that distinction in the talk.

  ### 10. Final Logistics Check
  *   **Budget:** 18 Index cards for World Cards, 18 for Vocabulary, 18 for Betting Tokens. 6 Pens for Auditors. Total cost < $5.
  *   **Boards:** Use Board 1 for "The Activity" timeline, Board 2 for "The Metaphysics" terms. Keep them visible simultaneously during Debrief.
  *   **Desks:** 6 clusters of 3. Ensure clusters are far enough apart that Phase 1 descriptions remain secret until the Swap.

  This plan blocks the "different places" escape mechanically (by banning spatial indexicals in the vocabulary) and blocks the "naming" escape mechanically (via the Auditor). It forces the students to feel the gap between *qualitative description* and *numerical identity* before you name it.
