answer: |-
  You haven't reinvented the wheel badly; you've hit on a substantive critique that often gets glossed over in introductory materials. In effective altruism and animal welfare circles, this touches on debates about "moral weight" and "intensity of experience." The idea that probability of sentience and capacity for suffering are correlated (rather than independent) is a known counter-argument, but your engineering framing (model stability under deep uncertainty) is a fresh and valuable way to articulate it.

  Here are the exam materials designed to force that specific tension into the open.

  ***

  ### Essay Question

  **"A common argument for prioritising insect welfare relies on expected value: even if the probability of sentience is low, the vast population size makes the total expected moral weight enormous.**

  **Critically evaluate this calculation. Specifically, address whether the factors determining the *probability* of sentience should also constrain the *intensity* or *moral weight* of that sentience, and whether treating these as independent variables undermines the conclusion. Discuss whether standard decision-making models are appropriate when input variables are uncertain across orders of magnitude."**

  ***

  ### Model Answer

  The standard argument for prioritising insect welfare employs an expected value framework: Total Moral Weight = Population × Probability of Sentience × Intensity of Experience. Given the astronomical population of insects, proponents argue that even a minuscule probability of sentience yields a massive expected moral weight, demanding immediate action. This calculation is logically valid but empirically fragile. It fails to account for both the instability of its inputs and the biological correlation between those inputs.

  The first critique concerns model stability. In engineering, a system dominated by an input variable uncertain across orders of magnitude is considered brittle. If the probability of sentience is unknowable within a range of 0.001% to 1%, and our moral obligation flips from "negligible" to "paramount" across that range, the model fails to guide action. A competent decision theory under deep uncertainty does not rely on expected value maximisation using point estimates. Instead, it requires robustness: choosing policies that avoid catastrophic outcomes across the whole range of plausible inputs. The engineering objection lands here: we cannot pretend the midpoint is known. We must acknowledge the variance. When a model's output is dominated by an unconstrained input, the output is not a number; it is a reflection of our ignorance.

  The second, deeper critique challenges the independence of the variables. The standard calculation often treats the probability of sentience and the intensity of experience as separate inputs. However, the evidence driving the probability down is typically neural simplicity or behavioural rigidity. These same features likely constrain the *capacity* for suffering. A nervous system too simple to convincingly generate sentience is likely too simple to generate complex, high-intensity suffering. Therefore, probability and intensity are correlated. As you lower the probability based on physical evidence, you must also lower the estimated intensity. You cannot claim an insect is unlikely to feel anything, but if it does, it feels as much as a mammal. This correlation significantly dampens the total expected weight, blunting the force of the vast numbers argument.

  Does this refute the concern entirely? No. Even a faint capacity for suffering, multiplied by quadrillions, remains morally significant. The objection does not prove insects don't matter; it proves the calculation is less decisive than claimed. It shifts the burden from "act immediately based on this sum" to "reduce uncertainty before committing resources."

  Ultimately, the engineering objection highlights a category error in applying precise calculations to vague moral concepts. The correlation objection highlights a biological constraint on moral magnitude. A first-class response recognises that while the vast numbers argument survives qualitatively, it fails quantitatively. The correct ethical stance is not dismissal, but humility: prioritising research into sentience markers and adopting precautionary principles that do not rely on unstable multiplications. We must build moral models that are robust to the very uncertainty they describe.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade Bands**

  *   **17–20 (First Class):** Answer integrates both the engineering (uncertainty/robustness) and philosophical (correlation of probability/intensity) objections. Explicitly argues that $P$ and $I$ are not independent variables. Concludes that while the moral weight isn't zero, the *calculation* is unfit for decision-making without robustness checks.
  *   **13–16 (Upper Second):** Identifies the expected value framework and critiques the uncertainty of the probability input. Mentions that intensity might be lower for insects but treats it as a separate point rather than a correlated variable. Good structure but lacks synthesis.
  *   **9–12 (Lower Second):** Explains the "vast numbers" argument correctly. Notes that we don't know if insects feel pain. Concludes we should be careful. Fails to engage with the modeling/decision theory aspect or the correlation between complexity and intensity.
  *   **0–8 (Fail):** Misunderstands the expected value argument. Claims the argument is definitely true or definitely false without nuance. Relies on emotional appeals rather than structural critique.

  **Specific Credit Moves (Award marks for presence)**

  *   **[5 marks]** Correctly reconstructs the Expected Value formula (Population × Probability × Intensity) and explains why the population size is used to overwhelm the low probability.
  *   **[5 marks]** **The Engineering Objection:** Identifies that when an input is uncertain by orders of magnitude, the output is unstable. Uses terms like "robustness," "sensitivity," or "decision rules under uncertainty" rather than just saying "we don't know."
  *   **[5 marks]** **The Correlation Objection:** Explicitly states that the evidence lowering probability (neural simplicity) also lowers intensity. Argues against treating these variables as independent.
  *   **[5 marks]** **Synthesis:** Avoids the binary trap. Does not conclude "therefore insects don't matter" nor "therefore we must save them all." Concludes that the *method of calculation* is the flaw, suggesting research or precaution instead of maximisation.

  **Specific Penalties (Deduct marks for presence)**

  *   **[-3 marks]** **The Independence Fallacy:** Explicitly treats the probability of sentience and the intensity of suffering as unrelated variables (e.g., "Even if they are unlikely to feel, they might feel a lot").
  *   **[-3 marks]** **The Precision Trap:** Pretends the probability can be known or averaged meaningfully (e.g., "If we assume 5%...").
  *   **[-3 marks]** **The Dismissal:** Concludes that because the math is hard, the moral problem disappears entirely.
  *   **[-2 marks]** **Name-dropping/Citation:** Attempts to cite specific philosophers or papers (violates exam constraints).

  **Examiner's Note:**
  *To achieve a First, the candidate must demonstrate that the "vast numbers" argument is not just empirically uncertain, but *structurally* unsound because it relies on independent variables that are biologically linked. The engineering analogy should be used to critique the decision rule, not just the data.*
