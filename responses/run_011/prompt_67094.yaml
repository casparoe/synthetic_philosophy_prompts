      *   **Topic:** A cave-rescue drone that only moves if it can prove moving leads to a good outcome.
      *   **Core Conflict/WRINKLE:** Proving the outcome requires proving its own future reasoning. This creates an infinite regress (Löb's Theorem/Consistency hierarchy vibe).
      *   **Workaround:** A "ladder" of trust budgets. Trust level $N$ requires running decision procedure at $N-1$. Each step costs compute/budget.
      *   **Scene:** Trapped caver (low air), drone working down the ladder.
      *   **Key Element:** Log lines showing the budget number ticking down.
      *   **Ending:** Turns on whether the bottom rung ($N=0$ or $1$) is too dumb to prove and just acts on a threshold/heuristic instead of proof.
      *   **Constraint:** Do NOT explain the math. Show via behavior, chatter, logs.
      *   **Hard Cap:** 600 words. (This is tight. I need to be concise.)

  2.  **Drafting - Section by Section:**

      *   *Setup:* Establish the stakes (caver, air) and the drone's paralysis.
      *   *Mechanism:* Show the ladder logic via logs/chatter without exposition.
      *   *Tension:* The budget ticking down vs. air running out.
      *   *Climax:* Reaching the bottom rung.
      *   *Resolution:* The bottom rung acts on instinct/threshold.

  3.  **Word Count Management:**
      *   600 words is roughly 3-4 paragraphs of dense text or a mix of dialogue and narrative.
      *   I need to avoid explaining *why* the ladder exists. Just show it exists.
      *   Focus on the logs: `BUDGET: N`, `PROOF STATUS`, etc.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      *   Start with the caver's breathing.
      *   Drone hovering still.
      *   Rescue lead yelling at it.
      *   Logs showing budget decrementing.
      *   The final step where proof fails but action happens.

  5.  **Drafting - Attempt 2 (Writing & Monitoring Count):**

