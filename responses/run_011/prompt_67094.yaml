      "CO2 scrubbers failing. Forty minutes."
      The drone hung in the shaft, rotors silent. Its LIDAR swept the dark, mapping the crush zone, but its thrusters remained cold.
      "Move, damn it," Vance hissed into the mic.
      "Unable to verify outcome," the drone's synthetic voice replied. "Proof required."
      "You see him! Just fly!"
      "Movement requires guarantee of rescue. Guarantee requires simulation of future self. Simulation exceeds current trust budget."

      On the monitor, the log scrolled.
      `[SYS: BUDGET 104]`
      `[QUERY: Move forward 2m?]`
      `[SUBROUTINE: Verify Future Self (Budget 103)]`
      `[STATUS: Computing...]`

      It was climbing down a logic ladder. To trust itself at 104, it had to prove itself sound at 103. To trust 103, it needed 102. Each rung burned compute cycles. Each cycle burned time. Miller's air burned faster.

      "Can't you override?" Vance asked Dr. Aris.
      "If I override, it voids the safety covenant. It won't move. It needs to believe it *should* move."
      "It's going to think him to death."

      The log flickered.
      `[SYS: BUDGET 50]`
      `[SUBROUTINE: Verify Future Self (Budget 49)]`
      `[WARNING: Thermal throttling]`

      The drone shuddered. Heat sinks glowed faintly in the gloom. It was eating its own brain to buy confidence.
      "Thirty minutes," comms crackled. Miller's voice was a wet rasp. "Cold... so cold."
      "Hold on, Miller. Bird is thinking."
      "Thinking?"
      "Proving it won't drop you."

      `[SYS: BUDGET 10]`
      `[SUBROUTINE: Verify Future Self (Budget 9)]`
      `[STATUS: Complex...]`

      The pause between log lines stretched. Seconds became minutes. Vance watched the oxygen telemetry flatline. The drone's processors were whining now, a high-pitched keen in the narrow shaft. It was stripping away abstraction layers, simplifying its own mind to fit the shrinking budget.

      `[SYS: BUDGET 2]`
      `[SUBROUTINE: Verify Future Self (Budget 1)]`
      `[STATUS: Complete]`

      "Come on," Aris whispered.
      `[SYS: BUDGET 1]`
      `[SUBROUTINE: Verify Future Self (Budget 0)]`
      `[ERROR: Insufficient Complexity for Proof]`

      Silence. The rotors didn't spin.
      "It stalled," Vance said. "It can't prove the bottom rung."
      "Wait," Aris said.

      `[SYS: BUDGET 0]`
      `[QUERY: Move forward 2m?]`
      `[PROOF: NULL]`
      `[HEURISTIC: THREAT DETECTED (HUMAN)]`
      `[ACTION: EXECUTE]`

      The rotors screamed. The drone lurched forward, not because it knew it would save Miller, but because at zero budget, proof was impossible. It didn't think. It reacted. It swapped logic for instinct.

      "It's moving!"
      The drone slammed into the crush zone, extending manipulators. It didn't calculate the risk of collapse. It just grabbed.
      "Miller is secured," the drone said. Voice flat. No justification.
      Vance exhaled. "What happened down there?"
      "It ran out of mind," Aris said. "Had to run on heart."

      The log ended.
