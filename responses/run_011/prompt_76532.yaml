answer: |-
  ### The Stipulation Load Index
  **Ranking: Highest Load (Fragile) → Lowest Load (Robust)**

  **1. Block's China Brain — Score: 9/10**
  *   **Load-Bearing Stipulation:** A functional isomorph of a brain can exist without collective consciousness.
  *   **If Reader Refuses:** "If the population acts exactly like neurons, the nation *is* conscious; functionalism holds."

  **2. Searle's Chinese Room — Score: 8/10**
  *   **Load-Bearing Stipulation:** Manipulating syntax according to rules yields zero semantics.
  *   **If Reader Refuses:** "The man doesn't understand, but the *system* does; the room is intelligent."

  **3. Parfit's Teletransporter — Score: 7/10**
  *   **Load-Bearing Stipulation:** Psychological continuity suffices for personal identity despite physical destruction.
  *   **If Reader Refuses:** "That is a replica with my memories; the original *me* died in the scanner."

  **4. Nozick's Experience Machine — Score: 6/10**
  *   **Load-Bearing Stipulation:** You will never know the experiences are simulated.
  *   **If Reader Refuses:** "I value contact with reality, even if the subjective feeling is identical."

  **5. Jackson's Mary — Score: 5/10**
  *   **Load-Bearing Stipulation:** She possesses *all* physical facts yet lacks phenomenal knowledge.
  *   **If Reader Refuses:** "Physical facts *include* phenomenal facts; she learns nothing new."

  **6. Putnam's Twin Earth — Score: 4/10**
  *   **Load-Bearing Stipulation:** H2O vs. XYZ is the *only* difference between the worlds.
  *   **If Reader Refuses:** "Meaning is determined by social usage, not just hidden chemical structure."

  **7. Thomson's Violinist — Score: 3/10**
  *   **Load-Bearing Stipulation:** The bodily attachment was strictly non-consensual (kidnapping).
  *   **If Reader Refuses:** "You assumed some risk by being public; special obligations now exist."

  **8. Foot's Trolley (Bystander) — Score: 1/10**
  *   **Load-Bearing Stipulation:** The switch reliably diverts the trolley to the single track.
  *   **If Reader Refuses:** "The switch jams or derails the train; the dilemma dissolves."

  ***

  ### Is the Metric Real?

  Yes. **Stipulation Load is distinct from Weirdness, Controversy, and Underdescription.**

  Your lawyer friend calls it a "leading question," but that's too blunt. A leading question can be robust (e.g., "Did you see him pull the trigger?" when video exists). Stipulation Load measures **Counterfactual Fragility**. It quantifies how much cognitive friction is required to prevent the reader's real-world heuristics from overwriting the author's intended intuition.

  *   **vs. Weirdness:** A scenario can be bizarre but low-load (Violinist: 3/10) because the moral intuition (bodily autonomy) is stronger than the sci-fi setup. A scenario can be mundane but high-load (Chinese Room: 8/10) because the philosophical claim (syntax ≠ semantics) fights against our natural intuition that "acting smart = being smart."
  *   **vs. Controversy:** A conclusion can be widely accepted but high-load (if the path to get there is fragile), or widely rejected but low-load (if the story forces the conclusion despite disagreement).
  *   **vs. Underdescription:** Underdescription is a *lack* of detail ("The switch is pressed"). Stipulation Load is *active suppression* of detail ("Press the switch, but ignore that switches jam, ignore that people scream, ignore that you'll be sued"). It is not missing information; it is forbidden information.

  ### The Proof: The Cleanest Pair

  To prove SL is a fourth variable, take these two cases to the pub:

  **Thomson's Violinist (Weird / Low Load)** vs. **Searle's Chinese Room (Mundane / High Load)**.

  *   **Weirdness Control:** The Violinist involves kidnapping and biological hookup (High Weirdness). The Chinese Room involves a man with paper slips (Low Weirdness). If SL were just Weirdness, Violinist should score higher. It scores much lower (3 vs 8).
  *   **Controversy Control:** Both conclusions are fiercely contested (Abortion rights vs. AI Consciousness). If SL were just Controversy, they should score similarly. They do not.

  **The Takeaway:** The Violinist works *with* the reader's instincts (autonomy is sacred); the author just needs a weird setup to isolate it. The Chinese Room works *against* the reader's instincts (intelligence looks like understanding); the author must stipulate away the "System Reply" to force the verdict. That difference is Stipulation Load.
