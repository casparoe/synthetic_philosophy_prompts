      *   The crucial point: The intuition that the data file is "hard" comes from assuming the causal arrow runs 2026 -> 2034. The intuition that God's belief is "soft" comes from assuming the explanatory arrow runs 2034 -> 2026 (God sees what you do).
      *   If you accept the Ockhamist view on God (future explains past belief), you must accept it for the data file (future event explains past bits). If you do that, the "fixity" intuition dissolves in both cases.
      *   Therefore, the Hard/Soft distinction isn't the tool solving the problem; it's the *Explanatory Direction* that determines whether we call it Hard or Soft.

