      *   *Premise 3:* In a mindless time-travel case (data file from 2034 received in 2026), the file's content entails the future outcome. By the Ockhamist definition, this is a "soft fact."
      *   *Premise 4:* But the data file *intuitively* feels fixed/hard. It's just bits on a disk.
