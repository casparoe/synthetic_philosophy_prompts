answer: |-
  You are right. The hard/soft fact distinction is a philosophical placebo. It creates the illusion of a solution without providing the metaphysical machinery to sustain it. Your worry is not just a niche objection; it is the fatal flaw in the standard Ockhamist defense. The distinction does not track metaphysical fixity. It tracks explanatory dependence, and once you admit that, the vocabulary of "hard" and "soft" facts becomes not just unnecessary, but actively obscuring.

  Here is the case for why you should abandon the distinction entirely and pivot to explanatory direction.

  ### The Vacuity of the Entailment Criterion

  The standard Ockhamist definition of a soft fact is roughly this: a fact about the past is soft if it entails a contingent truth about the future. God's belief yesterday that *p* entails *p* tomorrow. Therefore, it is soft. Therefore, it is not fixed. Therefore, fatalism fails.

  Your data file case exposes the circularity immediately. The data file in 2026 entails the experiment outcome in 2034. By the Ockhamist's own definition, the state of the disk is a soft fact. But this violates the very intuition the distinction was meant to capture. A pattern of magnetization on a platter is the paradigm case of a "settled" physical state. It is causally inert regarding the future unless acted upon. It sits there. If the Ockhamist bites the bullet and says, "Yes, the disk is a soft fact," they have stretched the term "soft" until it snaps. They are now claiming that a physical object existing in the past is not "fixed" simply because it carries information about the future.

  If they instead say, "No, the disk is a hard fact," they have abandoned the entailment criterion. They are implicitly appealing to a different metric: intrinsic vs. extrinsic properties, or perhaps causal independence. But if they appeal to causal independence, they have already conceded your point. They are no longer talking about "facts"; they are talking about *dependence relations*.

  The hard/soft distinction is merely a label we slap on *after* we have decided whether the past item depends on the future. It is a conclusion, not a premise. To say "God's belief is soft" is just a shorthand for "God's belief depends on the future." To say "The disk is hard" is shorthand for "The disk does not depend on the future." Using the labels to argue for the dependence is begging the question.

  ### The Real Work: Explanatory Direction

  The only thing doing metaphysical work in the Ockhamist solution is the claim about explanatory direction. The Ockhamist wants to say that the truth of the future proposition explains the past belief, not vice versa. God believes *p* because *p* will happen. This is a claim about the order of metaphysical determination.

  In the data file case, the explanatory direction is ambiguous, which is why your intuition wavers. If the channel transmits information backwards, the 2034 event explains the 2026 file. If that is the case, the file is metaphysically on par with God's belief. It is a "record" in the same way a memory is a record. If the Ockhamist is consistent, they must treat the file as dependent on the future.

  But here is where the hard/soft vocabulary fails us. It tries to categorize the *fact* (the belief, the bits) rather than the *relation*. A fact isn't intrinsically hard or soft. It is hard or soft relative to what determines it. The disk's state is hard relative to 2025 causes, but soft relative to the 2034 event if the 2034 event is its ground. The vocabulary of "hard fact" suggests a monadic property of the past state, as if it has a quality of "fixedness" inherent to it. It doesn't. Fixity is a function of independence.

  By dropping the hard/soft language, we force the debate onto the actual terrain: Is the past belief (or data file) counterfactually dependent on the future action? If yes, the fatalist argument collapses, but not because the past is "unfixed." It collapses because the premise "the past is fixed" applies only to past facts that are not dependent on the future. We don't need a special category of "soft facts." We just need a precise account of dependence.

  ### The Bilking Objection and the Illusion of Disanalogy

  Now, let's tackle the objection you raised. In the data file case, it seems I can bilk the result. I read "Battle" on the disk in 2026. In 2034, I decide to prevent the battle. If I succeed, the file was wrong. If the file cannot be wrong (infallible transmission), then I must fail. The objection claims this makes the cases different: with God, I can't bilk because God is infallible. With the disk, maybe I can, which suggests the disk is a hard constraint in a way God's belief isn't.

  This objection fails because it confuses *causal* power with *metaphysical* grounding.

  In the bilking scenario, if the transmission is truly infallible (analogous to divine infallibility), you cannot succeed in doing the opposite. If you try to prevent the battle, something will intervene. The machine will break, you will change your mind, a meteor will strike. Why? Not because the disk exerts a causal force on you. The disk is a lump of plastic and metal; it has no causal leverage over your will in 2034.

  You fail to bilk for the exact same reason you fail to bilk God: the future event is the explanatory ground of the past record. If the future event does not occur, the past record never had that content. Since the past record *does* have that content (it is right there in front of you), the future event *must* occur.

  The intuition that the disk is "harder" than God's belief comes from a tacit assumption that the causal arrow runs 2026 → 2034. We are used to records being caused by events, not causing them. When we see a record, we assume it was caused by a *past* event. But in this setup, it is caused by a *future* event. The discomfort you feel—the sense that the disk is "nailed down"—is the discomfort of backwards causation.

  If the Ockhamist says, "God's belief is soft because it depends on the future," they must say the same of the disk. If they say the disk is hard because "it's just matter," they are smuggling in the assumption that matter cannot depend on the future. But that is precisely what the fatalist argument challenges.

  The bilking paradox does not show the cases are different. It shows that *any* infallible record of the future, whether mental or physical, creates a constraint on the future. The only way to resolve that constraint without fatalism is to deny that the record is an independent constraint. You must say the record's existence is contingent on the action.

  If you accept that for God (Ockhamism), you must accept it for the disk. If you accept it for the disk, the "hardness" of the disk evaporates. It is no more "nailed down" than God's belief. The fact that it is physical is irrelevant. A physical state can be metaphysically dependent on a future event just as a mental state can.

  Therefore, the bilking objection does not rescue the hard/soft distinction. It merely highlights that we have stronger intuitions about the fixity of physical objects than mental states. But intuitions about fixity are not arguments. They are the data to be explained. The explanation is explanatory direction.

  ### The Verdict: Drop the Vocabulary

  The hard/soft distinction invites confusion because it suggests there are two kinds of past facts. There are not. There are only past facts that are metaphysically independent of the future and past facts that are metaphysically dependent on the future.

  When the Ockhamist says, "God's belief is a soft fact," they are trying to have it both ways. They want to say it is in the past (to satisfy the setup) but not fixed (to save freedom). The term "soft fact" papers over the tension. It makes it sound like the belief is somehow less real, or less past, than other facts. It isn't. It is fully in the past. It is just dependent.

  By switching to the language of explanatory direction, you strip away the camouflage. The argument becomes:
  1.  Fatalism requires that the past belief is fixed.
  2.  Fixity requires independence from the future.
  3.  God's belief is dependent on the future (it is a consequence of divine foreknowledge which tracks truth).
  4.  Therefore, God's belief is not fixed in the relevant sense.

  This is a clean argument. It doesn't rely on a mysterious taxonomy of facts. It relies on a specific claim about the nature of divine cognition (that it is quasi-perceptual and responsive to truth).

  If you keep the hard/soft vocabulary, you invite the data file counter-example. The file is a past fact. It entails the future. Is it hard or soft?
  *   If soft: You lose the intuition that physical past states are fixed.
  *   If hard: You lose the entailment criterion for softness.
  *   If you say "It depends": You have admitted that "hard/soft" is not a property of the fact, but of the relation.

  So, drop the terms. They are relics of a debate that thought it could solve metaphysical problems with semantic categorization. The problem of foreknowledge is not about whether a belief counts as a "hard fact." It is about whether the past is explanatorily prior to the future. In the case of infallible foreknowledge, it is not. The future event explains the past belief. The data file case proves that this holds for physical records too. The "fixity" we feel is just the shadow of our usual temporal perspective. Once you align your explanatory arrow with the metaphysical dependence, the fatalism vanishes, and you don't need the hard/soft distinction to do the lifting. It was never carrying the weight.
