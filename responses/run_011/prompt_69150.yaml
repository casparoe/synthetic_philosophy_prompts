      *   **Specific Challenge:** Engage with the "Backwards Transmission" (time-travel data) counter-example. The objection is that the data file *feels* fixed in a way God's belief doesn't, especially regarding "bilking" (trying to do the opposite). I need to explain why they are parallel or precisely where they differ and whether that difference saves the Hard/Soft distinction or just moves the problem.
      *   **Constraints:** No bibliography, no citations, no reading list, no hedging/surveying. Take a side and defend it hard.

  2.  **Deconstruct the User's Argument:**
