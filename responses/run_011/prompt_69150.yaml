      *   To call something a "soft fact" is just to say "this past thing depends on the future."
      *   To call something a "hard fact" is just to say "this past thing does not depend on the future."
      *   Therefore, using the distinction to *prove* that the past belief isn't fixed is circular. It assumes the dependence relation it's trying to prove.
      *   The real heavy lifter is the claim that God's belief is *counterfactually dependent* on the future action, not the other way around.
      *   The data file case exposes this because it strips away the "mind" element. If the Ockhamist says the file is soft, they admit the definition is too broad. If they say it's hard, they admit the definition (entailment) is wrong. Either way, "Hard/Soft" is doing no work.

  4.  **Address the "Backwards Transmission/Bilking" Objection:**
