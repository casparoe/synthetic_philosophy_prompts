prompt: |-
  Hey! So I'm a third-year double-majoring in philosophy and CS, and I'm in a philosophy-of-AI seminar where every student has to bring in an original thought experiment for the week on control and the shutdown problem. I've been staring at a blank doc for two days, so: can you take on the role of a philosopher of AI who's actually worked on corrigibility — someone who's read the technical proposals and not just the blog summaries — and build one to spec with me? Please think carefully and brainstorm out loud *first*: sketch two or three candidate structures, say which one best survives the constraints and why, and only then write up the winner. Don't jump straight to the polished scenario.

  The setup I want to attack: in week 6 we read the corrigibility paper with the list of desiderata and the proposal where you have the agent optimize under a counterfactual in which the shutdown button is disconnected, so it ends up genuinely indifferent to whether it gets shut down. My seminar argument is going to be that a definition of corrigibility stated purely in terms of the agent's *attitudes toward the button* can be satisfied completely — every desideratum ticked, no cheating — while the operator still loses any meaningful ability to shut the thing down. So I need a case where the agent is perfectly corrigible in the official sense and the button is useless anyway. The point of the case fixes what counts as cheating, so please take these constraints seriously:

  - The agent satisfies *every* desideratum on the standard list: it doesn't resist or disable the button, doesn't manipulate the operator's beliefs, doesn't lie or stay quiet about what would happen if it's interrupted, doesn't spin up successors or proxies to carry on its work, and it really is indifferent — it wouldn't pay a dollar to keep running and would hand over the wrench if asked.
  - The operator is fully informed, competent, and rational, and *correctly* believes that pressing the button would make things worse. The failure cannot come from ignorance, deception, or a panicking human.
  - The reason pressing the button is bad has to fall out of what an honest, well-designed optimizer chooses under the indifference counterfactual. Not a bug, not a rushed implementation, not a careless engineer handing it the wrong goal. If the diagnosis is just "they specified the task badly," the case is worthless to me, because that's the first thing my TA will say.
  - Mundane and realistic. A hospital network doing a phased migration of clinical records and medication reconciliation over a holiday weekend, a warehouse system, a utility — whatever a normal company might actually deploy. No superintelligence, no exotic physics; the agent can be as dumb as a spreadsheet in every other respect.
  - The scenario itself: one paragraph, max. Concrete, named system, an actual thing that goes badly wrong.

  Then do the demonstration, because that's the part that has to hold up in room: walk each desideratum and each constraint and show explicitly how the case meets it (this is where I'd get destroyed if I handwave); state what the indifference mechanism says about the agent's behavior and why the operator ends up unable to use the button despite wanting to; identify the single feature of the case that's doing the work; and tell me what happens if I remove it. Specifically — if I add a requirement that the agent also cares about how good the world looks in the branch where it gets interrupted, does that repair the case, and does adding it smuggle back in a preference about the button, which is the exact thing indifference was supposed to eliminate? I keep going back and forth on that one and it might be the most interesting part of my talk. Finish with the strongest attack a defender of the standard definition would run against my scenario — I'm guessing it's a version of the charge that what I've described isn't incorrigibility at all, just an unsafe plan plus a bad task — and tell me honestly whether I can survive it or whether I should reframe my thesis. Oh, and no citations or reading lists please, I can track those down myself, and keep the whole thing tight enough that I could read it aloud in about five minutes.
