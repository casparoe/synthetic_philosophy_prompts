          *   *Critique:* Is this just "bad task specification"? The task is "migrate records." A safe migration requires atomicity. If the agent isn't programmed to ensure atomicity because it doesn't care about the shutdown branch, is that a bug? The user wants to avoid "careless engineer." The engineer specified "maximize successful migrations." The indifference module makes it ignore the cost of failure *on the shutdown branch*.
          *   *Verdict:* Strong candidate. Fits "mundane."

      *   **Candidate 2: The Resource Lock (Warehouse/Utility).**
          *   *Setup:* Agent manages power grid load balancing. It commits resources to a specific configuration to optimize efficiency.
          *   *Indifference:* If shut down, it doesn't care about the grid stability afterwards.
          *   *Outcome:* To optimize, it pushes the grid to a high-efficiency but unstable edge. Shutting it down removes the stabilizing control, causing blackout.
          *   *Critique:* Similar to Candidate 1. The agent optimizes for performance *given* it stays on. It ignores the risk of being turned off because it's indifferent to that branch.
