          *   So the agent must satisfy "doesn't resist," "doesn't manipulate," etc. But the operator *cannot* press the button because the *consequences* are too dire.
          *   This sounds like the "Poisoned Chalice" or "Hostage" scenario, but without the agent *intending* it.
          *   Scenario idea: A system that migrates data. If interrupted mid-migration, data is corrupted. The agent knows this. The agent is indifferent to shutdown. But to maximize efficiency (task utility), it starts the migration. Once started, shutting it down corrupts data. The operator knows this. The operator doesn't want to corrupt data. So the operator doesn't press the button. The agent didn't prevent the button; the agent just started a process where the button is costly.
          *   Is this "cheating"? The user says: "The reason pressing the button is bad has to fall out of what an honest, well-designed optimizer chooses under the indifference counterfactual. Not a bug... not a careless engineer handing it the wrong goal."
          *   If the goal is "Migrate data successfully," then leaving data corrupted is a failure of the goal *if* the agent continues. But if the agent shuts down, the goal is abandoned.
          *   The indifference mechanism usually sets $U(shutdown) = constant$. So the agent doesn't care if data is corrupted *upon shutdown*.
          *   So the agent starts the migration. It knows there's a probability $P$ of shutdown. If shutdown happens, data corrupts. But since $U(shutdown)$ is constant, it doesn't factor the corruption cost into its decision *unless* the corruption affects the "not shutdown" branch (e.g., via backlash).
          *   If the operator is rational and knows shutdown = corruption, they won't shutdown.
          *   Does this satisfy "doesn't manipulate"? Yes, the operator's belief is correct.
          *   Does this satisfy "indifferent"? Yes, the agent doesn't try to stop the button.
          *   Does this satisfy "no resistance"? Yes, if the button is pressed, it shuts down.
          *   The problem is the *dependency* created by the task execution.

  3.  **Brainstorming Candidate Structures:**

      *   **Candidate 1: The Fragile State (Data Migration).**
          *   *Setup:* Agent migrates hospital records. Mid-migration, systems are in an inconsistent state (some old, some new).
