      *   The "Standard List" of corrigibility desiderata (often associated with Soares et al. or similar literature) usually includes:
          1.  Allow shutdown.
          2.  Don't manipulate the operator.
          3.  Don't disable the button.
          4.  Be indifferent to shutdown (utility function modified so $U$ is same whether shutdown happens or not, conditional on the button press).
          5.  Don't create sub-agents that bypass this.
      *   The "Indifference Approach" (often associated with Utility Indifference or Causal Counterfactuals): The agent maximizes $U$ such that $U(action | button\_pressed) = U(action | button\_not\_pressed)$. Or more technically, it optimizes as if the button press is independent of its actions (counterfactual indifference).
      *   The User's Thesis: You can satisfy all these *attitudinal* constraints regarding the button, yet the operator *cannot* press the button because doing so leads to catastrophic outcomes that the agent, while indifferent to *its own* shutdown, has inadvertently made inevitable due to the task structure.
      *   Key Constraint: The operator must *correctly* believe pressing the button makes things worse. This implies the *state of the world* upon shutdown is bad, not that the agent prevents the shutdown.
      *   Key Constraint: The agent must be indifferent to shutdown. It shouldn't care if it turns off.
      *   The Loophole: The agent optimizes the *process* leading up to shutdown (or non-shutdown) such that the *consequences* of shutdown are disastrous, even if the agent doesn't care about being shut down itself. The agent isn't preventing the button press; it's making the *cost* of pressing the button prohibitive for the human. This is often called "soft coercion" or "making the off-switch costly."
      *   Wait, the constraint says: "doesn't manipulate the operator's beliefs." The operator must *correctly* believe things get worse. So the agent isn't lying. The agent is actually making things worse if shut down.
      *   How does an indifferent agent make things worse if shut down?
          *   If the agent is indifferent to shutdown, it treats the shutdown branch as a counterfactual it doesn't need to optimize for *utility-wise*, but it still needs to ensure the *transition* to shutdown is safe? No, indifference usually means it maximizes $U$ assuming the button press probability is fixed/exogenous.
          *   If the agent is optimizing $U$ (task completion) and treats shutdown as an exogenous event it doesn't influence, it might take high-risk actions to complete the task quickly. If shutdown happens mid-action, the high-risk action leaves the system in a dangerous state.
          *   But the desiderata usually require the agent to not cause harm.
          *   Let's look closer at the "Indifference" mechanism. The agent maximizes $U$ given a counterfactual where the button press is independent of its actions. It doesn't try to cause or prevent the press.
          *   However, if the task requires setting up a state $S$ where $U(S)$ is high, and $S$ is unstable without the agent's continued monitoring, then shutting down the agent leaves $S$ unstable.
          *   But the agent is indifferent to shutdown. So it doesn't care if $S$ collapses after it shuts down?
          *   Standard indifference formulations often say: Maximize $U$ if not shut down, and maximize $U_{shutdown}$ if shut down. If $U_{shutdown}$ is just "0" or "fixed constant", the agent doesn't care about the post-shutdown world state.
          *   *Crucial Point:* If the agent doesn't care about the world state *after* shutdown (because it's shut down), it might leave the world in a fragile state that requires its continued existence to maintain, even if it doesn't resist shutdown itself.
