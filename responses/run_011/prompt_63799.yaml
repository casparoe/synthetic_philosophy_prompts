answer: |-
  First off, please tell your reading group that "the guy who brought the snacks" is currently doing a better job of tracking the philosophical stakes than most undergraduate seminars I've sat in. The *Gongsun Longzi* (specifically the "White Horse Dialogue" or *Bai Ma Lun*) is notoriously difficult, even for sinologists who can read the classical Chinese. The text is likely deliberately slippery; it belongs to the "School of Names" (*Ming Jia*), whose entire project was to expose how language creates metaphysical traps.

  You are using the Chinese Text Project (CTP) rendering, which is heavily based on A.C. Graham's translation in *Disputers of the Tao*. Graham is the gold standard for English, but even he admits the text is corrupted and ambiguous.

  Here is a breakdown of your group's specific sticking points, evaluated against the current scholarly consensus.

  ### 1. The Missing Premise and Your Group's Three Theories

  You are absolutely right that the opening argument contains a gap.
  *   **Premise 1:** "Horse" names shape.
  *   **Premise 2:** "White" names color.
  *   **Premise 3:** Naming color is not naming shape.
  *   **Conclusion:** Therefore, "White Horse" is not "Horse."

  Logically, this is a non-sequitur unless you assume a premise about **compounds**. The hidden premise is roughly: *"The name of a compound entity is not identical to the name of one of its constituents."*

  Here is the verdict on your group's reconstructions:

  *   **The Backend Dev (Set Theory/Intersection):** This is the most logically robust reconstruction. If $H$ = the set of horses, and $W$ = the set of white things, then "White Horse" = $H \cap W$. The claim $H \cap W \neq H$ is trivially true in set theory.
      *   *Is it fair to the text?* Yes, in spirit. Gongsun Long is treating "Horse" and "White Horse" as distinct *names* for distinct *extensions*.
      *   *Does it make it trivial?* Yes, which is why critics have always hated this dialogue. If it just means "The subset is not identical to the superset," it's a tautology. However, in Classical Chinese, the copula "is" (*fei*) often denotes identity, not class membership. He is saying "The concept 'White Horse' is not identical to the concept 'Horse'," not "A white horse is not a member of the class horse." The Dev is right that it's about referents/extensions, but the point is the *name* refers to a different abstraction.

  *   **You (Sense and Reference):** This is the Fregean reading. "Morning Star" and "Evening Star" refer to the same planet but have different senses. Similarly, "Horse" and "White Horse" might pick out the same animals in some contexts, but they have different *meanings* (senses).
      *   *Is it fair?* Very. This aligns with the School of Names' focus on *Ming* (Name) vs. *Shi* (Actuality). The "Name" carries a specific conceptual load.
      *   *Verdict:* This is probably the most philosophically charitable reading. It saves the argument from being a trivial set-theory error and makes it about semantic content.

  *   **The Linguist (Speech Acts/Requests):** This focuses on the second paragraph you quoted ("Requesting a horse...").
      *   *Is it fair?* This is actually the strongest textual evidence. Gongsun Long moves quickly from metaphysics to pragmatics. He argues that if you ask for a horse, a black horse satisfies the request. If you ask for a white horse, it does not. Therefore, the *conditions of satisfaction* differ.
      *   *Verdict:* The linguist is right that the text *uses* this to prove the point. However, this is evidence *for* the conclusion, not the logical bridge in the first paragraph.

  **Synthesis:** The Dev explains the *logic* (extensions differ), you explain the *semantics* (senses differ), and the Linguist explains the *pragmatics* (usage differs). All three are needed to fully reconstruct the argument. None of them make it "pointless"; rather, they show that Gongsun Long is attacking the assumption that language is transparent.

  ### 2. "Naming" vs. "Describing" (Ontology vs. Function)

  You asked if the translation difference ("names color" vs. "describes color") matters. **Yes, it matters immensely.**

  *   **"Names" (Graham/CTP):** This implies a rigid designation theory. "Horse" is the label for the universal "Shape-of-Horse." "White" is the label for the universal "Color-White." This fits the "Rectification of Names" project. It suggests that "Horse" and "White" are ontological categories that exist independently.
  *   **"Describes" (Other translations):** This implies predication. "Horse" describes a shape. This makes it more about linguistic function than metaphysical reality.

  Given the School of Names' obsession with *Ming* (Names), the "Naming" translation is likely more faithful to their intent. They believed Names had a correct correspondence to Reality. If you use the Name "Horse" to refer to a White Horse, you are blurring the distinction between the universal "Horse" (which has no color) and the particular "White Horse" (which does).

  ### 3. The "Fixing" Passage and Intersective Adjectives

  Your linguist friend is sharp, but the "intersective adjective" analogy needs a slight tweak.
  In modern semantics, "white" is an intersective adjective (a white horse is white and a horse). "Small" is non-intersective (a small elephant is not a small thing, necessarily).

  Gongsun Long's point in the "Fixing" passage is about **determinacy**.
  *   **Bare "White":** This is a universal. It doesn't "fix" (determine) *what* is white. It could be white stone, white feather, white horse. It is uncommitted.
  *   **"White Horse":** Here, "White" is "fixed" to "Horse." The universal "White" is restricted to the domain of "Horse."

  So, the linguist is right that the *semantic scope* changes. When "White" combines with "Horse," it loses its universal independence. Gongsun Long argues that because the *role* of "White" changes in the compound, the compound name ("White Horse") cannot be identical to the simple name ("Horse").

  Is this anachronistic? A little. But the School of Names was doing proto-linguistics. They were analyzing how modifiers alter the reference of head nouns. Your linguist is seeing a real structural feature of the text, even if the terminology is modern.

  ### 4. The Objector's Reductio and Scholarly Interpretations

  **The Reductio:** The objector says: "If a horse with color is not a horse, and there are no colorless horses, then there are no horses in the world."
  **The Advocate's Answer:** Gongsun Long essentially bites the bullet. He argues that "Horse" (the universal) *does not* have color. Particular horses have color. The universal "Horse" is an abstraction. Therefore, "White Horse" (a particularized abstraction) is not "Horse" (the pure abstraction).

  **Feng Youlan (Abstract vs. Concrete):** This is the standard 20th-century interpretation. Feng argued Gongsun Long was a Platonic realist. "Horse" = The Form of Horse. "White Horse" = The Form of Horse + The Form of White. Since Form A $\neq$ Form A+B, White Horse $\neq$ Horse.
  *   *Does it square with the ending?* Yes. It explains why the advocate doesn't deny the existence of animals, only the identity of the *names*.

  **Van Norden (Deflationary/Sentence Truth):** Bryan Van Norden suggests we shouldn't read this as heavy metaphysics. He argues Gongsun Long is making a point about **assertibility**. The sentence "This is a white horse" has different truth conditions than "This is a horse."
  *   *Does it square?* It makes the text less "woo-woo" metaphysical and more about logic/language. It fits the "Requesting" passage well.

  **The Objector Borrowing "Separation of White":** You noticed the objector mentions "Separation of White" (*Li Bai*). This is a reference to another chapter in the book (*On the Separation of Hard and White*). The objector is saying: "You claim hardness and whiteness are separate in a stone; now you're claiming whiteness and horse-ness are separate. But if you separate them too much, nothing exists." This shows the objector is well-versed in the Advocate's own system and turning it against him.

  ### 5. Rectification of Names and Governance

  This is the hardest pill to swallow: How does "White Horse is not Horse" help a ruler govern?

  The "Rectification of Names" (*Zheng Ming*) is about legal and bureaucratic precision.
  *   **Scenario:** A law says "Horses are forbidden in the park."
  *   **Loophole:** A nobleman rides in on a white horse. He argues, "The law says 'Horse'. My white horse is a specific category. Or, conversely, 'Horse' implies a standard color (e.g., brown/black in ritual context), so my white horse is exempt."
  *   **Gongsun Long's Point:** If names are not precise, laws cannot be enforced. If "White Horse" is treated as perfectly identical to "Horse" in all contexts, you lose the ability to make specific distinctions (e.g., "Only white horses may be used for this ritual").

  The text is performing the mismatch. It shows that if you aren't careful about how you define your terms (Names), you end up in absurdities where "there are no horses in the world." The goal isn't to convince people that white horses aren't horses; it's to shock them into realizing that **language requires precise definitions to function.**

  ### Recommendations for Your Group

  Since you don't read Classical Chinese, you need secondary sources that bridge the gap without demanding linguistics skills.

  1.  **A.C. Graham, *Disputers of the Tao*:** You are already using his translation via CTP. Read his commentary chapters on the School of Names. He treats them as serious logicians, not sophists.
  2.  **Bryan Van Norden, *Introduction to Classical Chinese Philosophy*:** His chapter on the School of Names is very accessible and covers the "White Horse" dialogue specifically. He favors the semantic/assertibility reading.
  3.  **Chad Hansen, *A Daoist Theory of Chinese Thought*:** Hansen argues that Classical Chinese nouns are "mass nouns" (like "water" or "sand") rather than count nouns. This changes the logic entirely (White Horse stuff vs. Horse stuff). This might blow your linguist's mind.
  4.  **Janusz Chmielewski, "Notes on Early Chinese Logic":** If your group wants to get into the weeds of the formal logic, this is the classic paper.

  **Final Verdict:** Your group is doing great. The Dev is right about the logic, you are right about the meaning, and the Linguist is right about the usage. Gongsun Long is arguing that **Identity** (A = B) fails when the *definitions* (Names) differ, even if the *reference* (the animal standing there) is the same. It's not biology; it's bureaucracy and semantics.

  Keep bringing the snacks. You're the glue holding the ontology together.
