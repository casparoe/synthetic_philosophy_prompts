answer: |-
  ### The Kitchen Table Decision Tree

  **Instructions:** Answer each question honestly based on your current view. Do not worry about where the path leads. There are no wrong answers, only different commitments.

  **Q1.** When conflicting definitions of the core concept are presented, is the conflict best resolved by choosing the more accurate description of a single phenomenon, or by assigning different jobs to the terms?
  *   **A.** Choosing the accurate description. (Go to Q2)
  *   **B.** Assigning different jobs. (Go to Q6)

  **Q2.** Does a claim possess its correctness status independently of when it is assessed, or does it acquire that status only through the process of being tested?
  *   **A.** Independently of time. (Go to Q3)
  *   **B.** Only through testing. (Go to Q4)

  **Q3.** Does the validation of a claim require that agreement is actually reached, or is it sufficient that agreement *would* be reached if investigation proceeded indefinitely?
  *   **A.** Actually reached. (Go to Leaf: The Consensus Actualist)
  *   **B.** Would be reached. (Go to Q4)

  **Q4.** If the community investigating a claim ceases to exist before reaching a conclusion, does the claim lose its determinate status?
  *   **A.** Yes, it becomes undecided. (Go to Leaf: The Situated Pragmatist)
  *   **B.** No, the status remains fixed. (Go to Q5)

  **Q5.** If a belief yields successful action now but is rejected by future investigation, did it possess correctness at the earlier time?
  *   **A.** Yes, it was correct then. (Go to Leaf: The Retroactive Instrumentalist)
  *   **B.** No, it was merely useful. (Go to Q6)

  **Q6.** Are the terms for "justified assertion" and "correctness" interchangeable, or do they mark distinct properties?
  *   **A.** Interchangeable. (Go to Q7)
  *   **B.** Distinct properties. (Go to Q7)

  **Q7.** Is the primary methodological rule intended to clarify concepts, or for determining what is the case?
  *   **A.** Clarify concepts. (Go to Q8)
  *   **B.** Determine what is the case. (Go to Leaf: The Methodological Realist)

  **Q8.** Do hypotheses regarding moral or religious matters require the same evidentiary standards as empirical claims about the physical world?
  *   **A.** Yes, same standards. (Go to Leaf: The Deflationary Reconciler)
  *   **B.** No, special standards. (Go to Leaf: The Pluralist Pragmatist)

  ***

  ### The Leaves

  **1. The Consensus Actualist**
  *   **Path:** Q1(A) → Q2(A) → Q3(A)
  *   **Awkward Commitment:** Must admit that for most of history, almost nothing was true because no one ever actually agreed on it.

  **2. The Situated Pragmatist**
  *   **Path:** Q1(A) → Q2(B) → Q4(A)
  *   **Awkward Commitment:** Must admit that if our research program goes extinct, the facts we discovered literally cease to be facts.

  **3. The Retroactive Instrumentalist**
  *   **Path:** Q1(A) → Q2(B) → Q4(B) → Q5(A)
  *   **Awkward Commitment:** Must admit that a claim can be true today and false next year without the world changing, only our luck.

  **4. The Methodological Realist**
  *   **Path:** Q1(A) → Q2(A/B) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(B)
  *   **Awkward Commitment:** Must defend the claim that there is a single method capable of settling both chemical equations and questions of justice.

  **5. The Deflationary Reconciler (Ray's Spot)**
  *   **Path:** Q1(B) → Q6(A) → Q7(A) → Q8(A)
  *   **Awkward Commitment:** Must admit that the group's four-month debate has been about dictionary preferences rather than reality.

  **6. The Pluralist Pragmatist**
  *   **Path:** Q1(B) → Q6(A) → Q7(A) → Q8(B)
  *   **Awkward Commitment:** Must explain why religious beliefs get a free pass on evidence that would get a chemistry paper retracted.

  **7. The Subjunctive Realist (Modern Peircean)**
  *   **Path:** Q1(A) → Q2(A) → Q3(B) → Q4(B) → Q5(B) → Q6(B) → Q7(A) → Q8(A)
  *   **Awkward Commitment:** Must admit that defining truth as "what would be believed" is either trivially true of all beliefs or circularly relies on a prior notion of truth to define "ideal inquiry."

  **8. The Semantic Dissolutionist**
  *   **Path:** Q1(B) → Q6(A) → Q7(A) → Q8(A) *(Note: Overlaps with Deflationary Reconciler, see below)*
  *   **Awkward Commitment:** Must admit that the intense passion of the debate is misplaced because the participants are merely expressing different stylistic preferences for vocabulary.

  ***

  ### Empty Combinations

  **1. The Timeless Extinctionist**
  *   **Combination:** Q2(A) [Truth is timeless] + Q4(A) [Inquiry cut-off destroys status].
  *   **Status:** **Incoherent.**
  *   **Explanation:** If correctness is independent of time and assessment, the physical survival of the inquirers cannot logically alter the status of the claim. Nobody occupies this because it requires believing truth is both eternal and fragile.

  **2. The Useful Dualist**
  *   **Combination:** Q5(A) [Payoff makes it true] + Q6(B) [Warrant and Truth are distinct].
  *   **Status:** **Unattractive.**
  *   **Explanation:** If successful payoff is sufficient for truth, there is no work left for a distinct property of "warrant" to do. Nobody occupies this because it multiplies entities without necessity while collapsing the distinction it tries to maintain.

  ***

  ### Indistinguishable Leaves

  **The Problem:** The tree cannot reliably separate **The Deflationary Reconciler** from **The Semantic Dissolutionist**.
  *   **Why:** Both paths rely on answering that the dispute is verbal (Q1-B), that warrant and truth are interchangeable (Q6-A), and that the method clarifies concepts (Q7-A). In practice, a person who thinks the dispute is verbal will almost always treat the terms as interchangeable and the method as clarificatory.
  *   **The Missing Question:** To separate them, you would need to ask: *"Is the purpose of the vocabulary to eliminate the concept of truth entirely, or to preserve it by lowering its metaphysical cost?"* The Reconciler wants to save the concept; the Dissolutionist wants to show it was never needed.

  **The Problem:** The tree cannot reliably separate **The Subjunctive Realist** from **The Methodological Realist**.
  *   **Why:** Both commit to truth being distinct from warrant, independent of current time, and resilient to inquiry ending. Both treat the method as determining what is the case (or clarifying it to that end).
  *   **The Missing Question:** To separate them, you would need to ask: *"Does the eventual agreement happen **because** the claim is true, or does the claim become true **because** agreement happens?"* The Realist says truth drives convergence; the Verificationist says convergence constitutes truth.
