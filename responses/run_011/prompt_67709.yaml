answer: |-
  You have stumbled onto a specific friction point in social science that doesn't have a single, universally agreed-upon label, though it is widely recognized. The phenomenon you are describing is real, it is distinct, and your intuition that the standard terms don't quite fit is correct.

  Here is the carving you asked for.

  ### 1. The Name
  There is no single word in the common lexicon for this. In academic circles, the closest machinery comes from organizational sociology, specifically **Institutional Decoupling** (Meyer & Rowan, 1977). Usually, this describes organizations separating their formal rules from their actual work practices to maintain legitimacy.

  Applied to your context, I would call this **Mnemonic Decoupling**.

  **Definition:** A state in which a group maintains two parallel truth-regimes: an *Archival Regime* (facts, minutes, corrections) and a *Ritual Regime* (speeches, memorials, stories). The group accepts corrections in the Archival Regime sincerely, but systematically excludes them from the Ritual Regime because the Ritual serves a cohesive function that factual precision would disrupt. Crucially, this exclusion happens without cognitive dissonance or active deception.

  ### 2. Evaluating the Concepts You Mentioned
  You asked where the standard terms come closest and where they fail.

  **Collective Memory (Halbwachs)**
  *   **Where it fits:** It correctly identifies that memory is a social framework, not just individual recall. It explains *why* the story persists (it binds the group).
  *   **Where it fails:** Collective Memory theory usually assumes the group *believes* the memory is the history. It struggles to explain a group that *knows* the history is different but tells the memory anyway. In your case, the "memory" isn't replacing the "history"; they are living side-by-side. Collective Memory implies a merger; you are observing a separation.

  **Invented Tradition (Hobsbawm)**
  *   **Where it fits:** It captures the ritual aspect (the memorial, the plaque) and the idea that the story is constructed for social cohesion.
  *   **Where it fails:** "Invented" implies the origin was fabricated or the continuity is fake. Your union's strike *did* happen; the pension *was* saved. The facts aren't fake; the *narrative priority* is stylized. Also, Invented Tradition usually suggests resistance to correction. Your old-timers accepted the correction warmly; they just didn't let it change the speech.

  **Memory vs. History (Nora)**
  *   **Where it fits:** Pierre Nora distinguishes *milieux de mémoire* (living memory) from *lieux de mémoire* (sites of memory/archives). He argues History destroys Memory.
  *   **Where it fails:** Nora predicts a war where one kills the other. You are describing a peace treaty. The Archive (History) and the Memorial (Memory) are not fighting; they have agreed to stay in separate lanes. Nora doesn't account for the *stable coexistence* of known truth and performed myth.

  ### 3. Distinguishing Your Thing from the Imposters
  Here is how you tell **Mnemonic Decoupling** apart from the three scenarios you listed.

  **(a) A group that's just wrong (Ignorance)**
  *   **The Test:** Quiz them privately.
  *   **The Difference:** In ignorance, if you show them the minutes, they change the story because they want to be right. In Mnemonic Decoupling, they thank you for the minutes, file them, and tell the story the same way. The knowledge is present but performatively inactive.

  **(b) A group that's winking (Cynical Myth)**
  *   **The Test:** Look for irony or signaling.
  *   **The Difference:** In a cynical myth (like "George Washington chopped down a cherry tree"), the teller knows it's fake and the audience knows it's fake; it's a shared game. In your union, the teller is *not* winking. The president tells the death-first story with solemn sincerity. The audience nods with solemn sincerity. It is treated as truth *within the ritual context*, even if it is treated as data *in the archival context*.

  **(c) A group that buried the correction (Suppression)**
  *   **The Test:** Check access to the record.
  *   **The Difference:** In suppression, the minutes are "lost," or the correction is voted down, or the archivist is told to stop digging. In your case, you published the photocopies. The local voted to accept the correction. The barrier is not access; it is *relevance*. The correction is deemed irrelevant to the *function* of the memorial.

  ### 4. The "Ought": Story vs. Record
  You asked for a view on which should give way.

  **The Principle:** The Record wins on *Attribution*; the Story wins on *Emotional Geometry*.

  *   **Attribution (Who did the work):** The Record must win here. In your second example, crediting the man instead of the woman isn't just a narrative flourish; it's a material erasure of labor. If the union values equity, the Ritual *must* update to reflect the Archival correction. To do otherwise reinforces the very power dynamics the union likely fights against.
  *   **Emotional Geometry (The shape of the event):** The Story can hold here. In the first example (death vs. pay), the "death first" narrative creates a moral imperative (we struck for safety/humanity) rather than a transactional one (we struck for wages). If the group agrees that the *meaning* of the strike is more important for solidarity than the *chronology*, the Ritual can remain stylized, provided the Archive remains accurate.

  **Verdict:** If the decoupling hides *who* built the power, fix the story. If the decoupling hides *why* the power was needed, keep the story but keep the archive accessible.

  ### 5. Confidence Statement
  **Confidence Level:** High on the phenomenon; Medium on the terminology.

  I am highly confident that the dynamic you are observing is a stable, documented social behavior. It is not a glitch; it is a feature of how groups maintain cohesion while managing accuracy.

  However, social science does not have a periodic table of elements. Terms are tools, not laws. "Mnemonic Decoupling" is a descriptive label I am constructing for you based on existing sociological frameworks (specifically Institutional Decoupling applied to Memory Studies). It is not a term you will find in a dictionary yet, but it accurately maps the boundaries you described.

  **The Claim I Am Least Certain Of:**
  I am least certain about the claim that the participants experience **no cognitive dissonance**.
  In my analysis above, I stated they are "not embarrassed" and "nodding along." While this appears to be true behaviorally, it is possible there is low-level, suppressed dissonance that they manage by strictly compartmentalizing the "hallway talk" (facts) from the "podium talk" (ritual). I cannot know their internal state for sure. It is possible the "sincerity" you see is a highly practiced social skill rather than a genuine lack of conflict. I am betting on the former (genuine compartmentalization), but the latter (suppressed conflict) is a viable alternative explanation.
