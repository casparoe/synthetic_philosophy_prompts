answer: |-
  0.15

  **Decomposition of Credence**

  1.  **0.60** — I assign this probability to the claim that a theory-theoretic account of folk psychology is correct, as interpretivist and simulationist accounts successfully capture significant portions of our predictive competence without committing to internal posit-existence.
  2.  **0.85** — Conditional on theory-theory being correct, I judge it highly likely that the folk conception treats attitudes as propositional, causally efficacious, and rational, since this triad is the explicit structural commitment of standard belief-desire explanation.
  3.  **0.50** — Conditional on the folk conception being fixed, I assign even odds that a completed cognitive science will posit sub-personal states (e.g., distributed vectors) that lack the discrete, sentence-like structure required to satisfy the folk constraints directly.
  4.  **0.59** — Conditional on a structural mismatch between folk and science, I judge it slightly more likely than not that reference fails rather than succeeds, acknowledging the strength of reference-magnetism arguments but weighing them against the possibility of radical incommensurability.

  **Historical Analogy Distribution**

  *   **Heat (Smooth Reduction): 0.20**
  *   **Gene (Reference Drift): 0.55**
  *   **Humours (Genuine Abandonment): 0.25**

  The headline figure propagates primarily from the "Humours" allocation. Strict eliminativism requires the "Humours" outcome (abandonment) *and* the failure of reference to salvage the term via error theory or magnetism. Mathematically, my headline 0.15 is approximately the product of the "Humours" probability (0.25) and the conditional probability that reference fails given abandonment (0.59). The "Gene" analogy dominates the remaining probability mass because it allows for retention via mapping, which falsifies the strict eliminativist thesis even if the underlying ontology shifts.

  **Gap Analysis: User (0.12) vs. Colleague (0.55)**

  The gap most plausibly sits in term **3 (Science Mismatch)**. Your colleague's work on distributed vector representations likely drives their credence that sentence-shaped posits will not survive contact with the brain, pushing their probability for term 3 toward 0.90 or higher. Your lower credence suggests you either believe functional abstraction will preserve the sentence-shaped structure at a higher level, or that the brain's implementation details are irrelevant to the ontology of cognitive science.

  I estimate the probability that a substantial part of the dispute is merely verbal at **0.65**. If "belief" is defined by your colleague as "a localist neural activation pattern" and by you as "a functional role abstractable from implementation," you are evaluating different target propositions. Convergence is likely if you agree on whether cognitive science ontology is constrained by implementation fidelity or by explanatory utility.

  **Sensitivity Analysis**

  The total is most sensitive to term **4 (Reference Failure)**. If I were to change my mind and decide that reference magnetism or causal-historical chains successfully latch onto distributed states despite structural mismatch (lowering this term from 0.59 to 0.10), the headline number would drop from 0.15 to roughly 0.02.

  The non-philosophical development that would shift this term is the success or failure of **mechanistic interpretability in large-scale neural networks**. If researchers demonstrate that high-level symbolic reasoning in artificial systems systematically maps onto identifiable, stable sub-networks or directions in vector space, this would suggest the world's joints do support the referent (shifting term 4 down, lowering eliminativism). Conversely, if it is proven that high-level explanatory categories are irreducibly emergent and cannot be mapped to any stable lower-dimensional structure without loss of predictive power, this would support reference failure (shifting term 4 up, raising eliminativism).
