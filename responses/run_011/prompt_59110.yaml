answer: |-
  ### Standards of Adequacy for Accuracy-First Epistemology

  The following specification distinguishes between requirements essential to any normative epistemology (Non-Negotiable), requirements specific to the accuracy-first research program (Program-Specific), and assumptions that reflect partisan commitments rather than neutral standards (Partisan/Prejudicial). The goal is to isolate whether failures are due to the mathematical machinery or the philosophical commitments.

  #### I. The Desiderata

  | # | Requirement | Classification | Motivating Case / Rationale |
  | :--- | :--- | :--- | :--- |
  | **1** | **Coverage** | Non-Negotiable | A normative theory must evaluate the states it purports to regulate. If dominance arguments only apply to coherent states, they cannot justify coherence. The framework must assign values to grossly incoherent credences to show why they are suboptimal. |
  | **2** | **Guidance** | Non-Negotiable | Normativity implies possibility. If the theory recommends credal states that are cognitively inaccessible (e.g., logical omniscience regarding complex truths) or requires adopting a scoring rule one cannot grasp, it fails as a guide for agents. |
  | **3** | **Granularity Invariance** | Non-Negotiable | Epistemic rationality should not depend on the descriptive granularity of the possibility space. A credal state should not be rated superior merely because the algebra was refined (e.g., splitting a cell into irrelevant sub-cases) or coarsened. |
  | **4** | **Evidence-Link** | Non-Negotiable | Epistemology concerns the regulation of belief by evidence. If the accuracy-maximizing state in a given world diverges systematically from the evidentially supported state (e.g., if ignoring evidence yields higher expected accuracy), the theory fails to capture *epistemic* rationality. |
  | **5** | **Robustness** | Program-Specific | *Revision of Candidate (ii).* Strict measure-independence is mathematically untenable. The genuine demand is that normative verdicts (e.g., Probabilism) hold across a *justified class* of proper scoring rules, not just one. If a norm holds only for the Brier score but fails for the Log score, the norm is an artifact of the metric. |
  | **6** | **Propriety** | Program-Specific | The scoring rule must be "proper," meaning it maximizes expected score only when the reported credence matches the agent's actual credence. Without this, the link between accuracy and rational credence is broken, as the math would recommend lying about one's confidence. |
  | **7** | **Additivity** | Partisan | *Revision of Candidate (iii).* This demands that the value of a whole credence function is the sum of the values of individual propositions. **Holists** reject this, arguing that the epistemic value of a system involves structural relations (explanatory power, coherence) not captured by summation. |
  | **8** | **Extensionality** | Partisan | This demands that the score depends *only* on the credence and the truth-value (1 or 0), ignoring content, meaning, or naturalness. **Veritists** accept this; **Epistemic Utility Pluralists** reject it, arguing that believing truths about significant matters matters more than trivial truths. |
  | **9** | **Anti-Consequentialism** | Partisan | *Revision of Candidate (viii).* This forbids trading accuracy on one proposition for gains on another. **Epistemic Consequentialists** accept trade-offs (maximize total truth); **Deontological** accuracy theorists reject them (each proposition has a distinct norm). |
  | **10** | **Anti-Luck** | Prejudicial | *Revision of Candidate (v).* This is not a genuine desideratum for accuracy-first views. Accuracy is defined as proximity to truth; proximity to truth is inherently luck-sensitive in single cases. Demanding immunity to luck is demanding the theory abandon its core value-theoretic claim. The theory must explain why luck is acceptable, not eliminate it. |
  | **11** | **Full-Belief Accommodation** | Scope-Dependent | *Revision of Candidate (ix).* If the theory claims to be a general epistemology, it must bridge credence and outright belief. If it claims only to be a theory of graded belief, this is outside its scope. Failure here is a limitation of scope, not necessarily a theoretical defect. |

  #### II. The Most Exclusionary Requirement

  **Guidance (specifically regarding Logical Omniscience).**

  This requirement does the most work to exclude candidate theories. Most accuracy arguments derive Probabilism by showing that incoherent credences are accuracy-dominated by coherent ones. However, the dominating coherent state often requires logical omniscience (e.g., assigning 0 to contradictions that are computationally intractable).
  *   **What it knocks out:** It excludes idealized accuracy accounts that cannot accommodate bounded rationality. If an agent *cannot* adopt the dominating state due to cognitive limitations, the dominance argument fails to generate an "ought." Any theory that cannot explain why agents are not irrational for failing to be logically omniscient is excluded by this desideratum.

  #### III. Jointly Unsatisfiable Subset (The Impossibility Result)

  Your suspicion is correct: **Additivity**, **Granularity Invariance**, and **Extensionality** form a jointly unsatisfiable triad under standard assumptions.

  **The Argument Sketch:**
  1.  **Extensionality** dictates that the score for a proposition depends only on the credence assigned and whether that proposition is true or false.
  2.  **Additivity** dictates that the total score of a credence function is the sum of the scores for each proposition in the partition.
  3.  **Granularity Invariance** dictates that refining the partition (e.g., splitting a false proposition $P$ into $P \land Q$ and $P \land \neg Q$) should not change the total epistemic value of the agent's state, provided the agent's doxastic attitude toward the underlying reality hasn't changed.
  4.  **The Conflict:** If you split a false proposition into two false sub-propositions, Additivity requires you to sum two negative scores. Extensionality requires those scores to be determined by the truth-values (both false). Unless the scoring rule is trivial (assigning 0 value to everything) or the weights are adjusted dynamically based on the partition size, the total score will drop simply because you counted the error twice. To maintain Granularity Invariance, the score for each cell must diminish as the partition grows, which violates Extensionality (the value of believing $P$ depends on how many other propositions exist) or Additivity (the whole is not the sum of fixed parts).

  **Where the tension lies:** The tension is not merely mathematical but axiological. It forces a choice between **Atomism** (truths have independent value, sacrificing Granularity) and **Holism/Contextualism** (value depends on the question under discussion, sacrificing Extensionality).

  #### IV. Evaluation of Broad Lines of Response

  | Line of Response | Characterization | Performance against Desiderata |
  | :--- | :--- | :--- |
  | **The Permissive Line** | Admits any proper scoring rule; accepts that normative verdicts may vary slightly depending on the measure chosen. | **Fails Robustness.** It concedes that "rationality" is partially relative to the choice of metric. It survives the Impossibility Result by dropping Granularity or Extensionality, but at the cost of making the normative upshot less distinctively *epistemic* and more *methodological*. |
  | **The Axiomatic Line** | Imposes extra conditions on admissible measures (e.g., symmetry, continuity) to narrow the class until only one family remains, then re-derives theorems. | **Risks Circularity on Evidence.** It satisfies Robustness within the constrained class but faces the challenge of justifying the constraints without appealing to the very norms (like Probabilism) it seeks to derive. It typically resolves the Impossibility Result by restricting Granularity Invariance to "natural" partitions, which reintroduces Extensionality violations. |
  | **The Pluralist Line** | Treats accuracy as one *pro tanto* epistemic value among others (e.g., understanding, coherence, evidence-responsiveness). | **Dissolves the Impossibility.** By denying that accuracy is the *sole* source of value, it can allow accuracy to violate Granularity if another value (e.g., simplicity) compensates. However, it **Fails the Accuracy-First Claim.** It abandons the value-theoretic monism that defines the research program, effectively conceding that accuracy cannot ground the norms alone. |

  ### Summary for the Prospectus

  To proceed, you must decide whether your project aims to **solve** the impossibility result (by proposing a new axiology that modifies Additivity or Extensionality) or **dissolve** it (by arguing the constraints are misplaced). If you retain **Guidance** and **Evidence-Link** as non-negotiable, you are forced to address how accuracy maximization aligns with human cognitive limits and evidential norms, which is where the substantive philosophical work lies, distinct from the representation theorems.
