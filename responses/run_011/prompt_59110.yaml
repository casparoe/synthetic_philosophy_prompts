prompt: |-
  I am drafting the opening chapter of a dissertation prospectus on accuracy-first epistemology, and before committing to any technical machinery I want to be clear about what the research program is actually being asked to deliver. Part of my difficulty is that the label seems to cover three claims that are routinely run together: a statistical claim that certain scoring rules reward well-calibrated degrees of belief; a value-theoretic claim that accuracy is the fundamental, perhaps the only, source of distinctively epistemic value; and a normative claim that familiar coherence requirements — probabilism, conditionalization, and the rest — are derivative, holding only insofar as they are accuracy-conducive. My committee has asked me to fix the standards of adequacy first, so that we can tell whether disagreements in the literature are substantive or merely reflect which of these three claims a given author is defending. So please write the desiderata: the requirements any accuracy-first account must meet to count as a theory of epistemic rationality rather than a collection of representation theorems, each with the case or consideration that motivates it, and each marked either as non-negotiable or as a demand peculiar to one camp.

  Treat at least the following as candidates, add whatever I have missed, and — this matters as much as the additions — tell me which of my candidates are not genuine desiderata at all but prejudices of a particular side. (i) Coverage: the framework must deliver comparative verdicts over every credal state it claims to regulate, including grossly incoherent ones and ones no real agent entertains, since a dominance argument only bites if the offending state is outperformed across all the possibilities the agent takes seriously. (ii) Measure-independence: the normative upshot must not be an artifact of the scoring rule selected; if probabilism follows from a Brier-like measure but fails under some other proper measure, the theorem is a fact about measures rather than about rationality, and the account owes a non-circular justification of whatever constraints it imposes on admissible measures. (iii) Aggregation: it must take a position on whether the accuracy of a whole credal state is the sum of the accuracies of its components, given that credences in a proposition, its negation, and their conjunction can each look acceptable in isolation while the package is clearly worse. (iv) Granularity: verdicts should not flip when the algebra of propositions is refined or coarsened, as when the same state of mind is scored against a three-way partition and then against a nine-way refinement of it. (v) Anti-luck: accuracy is standardly a function of credence and truth value alone, so a wild hunch that happens to be confident and right scores exactly as well as knowledge; the program must say why that is not a counterexample to the claim that accuracy is the whole of epistemic value. (vi) Guidance: dominance arguments must recommend states an agent can actually adopt, which forces the program to confront credences about necessary truths, about propositions too complex to have been considered, and about the very scoring rule in dispute. (vii) Evidence: it must explain why deferring to one's total evidence is accuracy-conducive without smuggling in a norm that is not itself about accuracy, given that in any particular world the evidentially reckless agent may turn out better calibrated than the careful one. (viii) Anti-consequentialism: it must answer the charge that maximizing expected accuracy licenses trading a badly inaccurate credence on one proposition for gains elsewhere, and that this misconstrues the relation between an inquirer and each individual truth. (ix) Full belief: it must either accommodate the connection between high credence and outright belief or explain why the program is entitled to remain silent about it.

  On top of the list, I want three things. First, identify the single requirement that does the most to exclude candidate theories, and say what kind of view it knocks out. Second, identify any subset that is jointly unsatisfiable — my own suspicion is that measure-independence, additivity, granularity-invariance, and the extensional conception of accuracy cannot all be had at once, and if that is right the list is itself a result rather than a shopping list — but I want the argument sketched, not the conclusion asserted, and I want to be told if the tension really lies elsewhere. Third, and briefly, say how three broad lines of response fare against the list: the permissive line that admits any proper scoring rule and lives with measure-relative verdicts; the axiomatic line that imposes conditions on measures to narrow the field and re-derives the theorems for the whole resulting family; and the pluralist line that treats accuracy as one pro tanto epistemic consideration among several. If any of those three labels mischaracterizes a real position, correct the label rather than the position. A numbered list or a table is fine. Please keep the weight on the requirements and their motivating cases rather than on the scoring, and do not include references, a reading list, or attributions — I have the bibliography in hand and want the specification, not the survey.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Draft the "desiderata" (standards of adequacy) for an accuracy-first epistemology dissertation prospectus.
      *   **Goal:** Distinguish substantive disagreements from mere differences in which of the three core claims (statistical, value-theoretic, normative) are being defended.
      *   **Input:** A list of nine candidate desiderata (Coverage, Measure-independence, Aggregation, Granularity, Anti-luck, Guidance, Evidence, Anti-consequentialism, Full belief).
      *   **Requirements:**
          1.  Evaluate the nine candidates (keep, discard, or mark as partisan).
          2.  Add missing desiderata.
          3.  Identify the single most exclusionary requirement.
          4.  Identify any jointly unsatisfiable subset (impossibility results) and sketch the argument.
          5.  Evaluate three broad lines of response (Permissive, Axiomatic, Pluralist).
          6.  Format: Numbered list or table (focusing on requirements/motivation).
          7.  Constraint: No references, reading lists, or attributions. Focus on specification, not survey.

  2.  **Evaluate the Nine Candidates:**
      *   *(i) Coverage:* Essential. If the theory can't judge incoherent states, it fails as a normative theory of rationality. *Status: Non-negotiable.*
      *   *(ii) Measure-independence:* Tricky. Strict independence is likely impossible (see Joyce's non-pragmatic argument vs. specific Brier score derivations). Demanding *total* independence might be a prejudice of those who want a unique "Truth" metric. However, *robustness* across a class of proper measures is a standard demand. *Status: Partisan/Refinable.* (Strict independence is too strong; robustness is the real demand).
      *   *(iii) Aggregation (Additivity):* This is a major flashpoint. Separability is often assumed for mathematical tractability but challenged philosophically (holism). *Status: Partisan.* (Holists reject this).
      *   *(iv) Granularity (Partition Invariance):* Crucial. Rationality shouldn't depend on how you carve up the possibility space. *Status: Non-negotiable.*
      *   *(v) Anti-luck:* This attacks the core definition of accuracy (veritism). If accuracy is *just* closeness to truth, luck is inherent. Demanding an "anti-luck" clause might beg the question against pure veritism. *Status: Partisan/Category Error.* (This is a challenge to the value claim, not a desideratum for the *structure* of the theory).
      *   *(vi) Guidance (Ought Implies Can):* Standard normative demand. If the theory recommends impossible states (e.g., logical omniscience without a path), it fails as a guide. *Status: Non-negotiable.*
      *   *(vii) Evidence:* The link between accuracy and evidence is the "bridge principle." If accuracy doesn't track evidence, it's not epistemology. *Status: Non-negotiable.*
      *   *(viii) Anti-consequentialism:* The "separability" vs. "trade-off" issue. Can I believe a falsehood if it helps me believe more truths overall? *Status: Partisan.* (Consequentialists about truth accept trade-offs; deontologists don't).
      *   *(ix) Full belief:* Scope issue. If the theory is only about credence, this isn't a failure of the theory, but a limitation of scope. *Status: Conditional.* (Only non-negotiable if the theory claims to be general epistemology).

  3.  **Identify Missing Desiderata:**
      *   *Extensionality:* The score should depend only on the credence and the truth value, not on the content or meaning of the proposition. (Related to Measure-independence but distinct).
      *   *Propriety:* The scoring rule must encourage honesty (reporting true credence). This is usually built-in, but worth stating as a baseline.
      *   *Continuity:* Small changes in credence shouldn't lead to massive jumps in epistemic value.
      *   *Symmetry:* Errors of overconfidence and underconfidence should be treated similarly (unless there's a reason not to).

  4.  **Identify the Most Exclusionary Requirement:**
      *   *Measure-independence (strict)* or *Granularity*. Actually, *Guidance* (Logical Omniscience) is often the biggest killer. But looking at the "impossibility" hint in the prompt, *Measure-independence + Aggregation + Granularity* is the tension point.
      *   However, the prompt asks for the *single* requirement that excludes the most. *Guidance* (specifically regarding logical omniscience) knocks out idealized models that can't account for bounded rationality. But *Measure-independence* (interpreted strictly) knocks out almost all specific accuracy arguments because most theorems rely on specific properties of Brier or Log scores.
      *   Let's look closer at the prompt's hint: "measure-independence, additivity, granularity-invariance, and the extensional conception of accuracy cannot all be had at once."
      *   The most exclusionary *philosophical* demand is likely **Evidence** (connecting accuracy to evidence without circularity). Many accuracy arguments fail to derive evidential norms without assuming them.
      *   Actually, **Guidance** (Ought Implies Can) is the hardest for formal epistemology. It knocks out ideal probabilism for non-ideal agents.
      *   Decision: **Guidance** is the most practically exclusionary, but **Measure-Independence** is the most theoretically exclusionary regarding the *accuracy-first* claim itself. Let's go with **Measure-Independence** (strictly construed) because it targets the core claim that accuracy *itself* drives the norm, not the math tool.

  5.  **Identify Jointly Unsatisfiable Subset (Impossibility):**
      *   The prompt suspects: Measure-independence, Additivity, Granularity, Extensionality.
      *   This sounds like the "Accuracy and Inaccuracy" impossibility results (e.g., issues with scoring rules on different partitions).
      *   Argument sketch: If accuracy is extensional (depends only on truth value), additive (sum of parts), and granularity-invariant (same verdict on refined partitions), you run into problems where refining a partition changes the total score of a credence function even if the "truth" hasn't changed, unless the scoring rule is trivial or constrained in ways that violate propriety. Specifically, truth-value dependence + additivity often conflicts with partition invariance because the number of components changes.
      *   Correction: The tension often lies in **Extensionality + Granularity**. If value depends only on truth value, refining the partition (adding tautologies or irrelevant distinctions) changes the aggregate score unless the rule is zero-sum or trivial.

  6.  **Evaluate Three Lines of Response:**
      *   *Permissive (Any proper rule):* Fails Measure-independence. Verdicts vary by rule.
      *   *Axiomatic (Constrain the rules):* Tries to save Measure-independence by narrowing the class. Risks circularity (choosing axioms to get desired results).
      *   *Pluralist (Accuracy is one value among many):* Dissolves the tension by lowering the stakes. Accuracy doesn't have to do all the work. Fails the "Accuracy-First" monism claim.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Academic, precise, prospectus-ready.
      *   *Structure:*
          1.  Introduction (Setting the stage).
          2.  The Desiderata Table (Candidate, Status, Motivation).
          3.  The Exclusionary Requirement.
          4.  The Impossibility Result.
          5.  Evaluation of Responses.
      *   *Refining the Candidates:*
          *   (i) Coverage: Keep (Non-negotiable).
          *   (ii) Measure-independence: Mark as Partisan (Strict version). The non-negotiable version is "Robustness."
          *   (iii) Aggregation: Mark as Partisan (Additivity is contested).
          *   (iv) Granularity: Keep (Non-negotiable).
          *   (v) Anti-luck: Mark as Prejudice/Category Error. Accuracy *is* luck-prone by definition. The theory needs to explain why that's okay, not eliminate it.
          *   (vi) Guidance: Keep (Non-negotiable).
          *   (vii) Evidence: Keep (Non-negotiable).
          *   (viii) Anti-consequentialism: Mark as Partisan (Deontological constraint).
          *   (ix) Full belief: Mark as Scope-dependent.
      *   *Additions:* Propriety (baseline), Extensionality (often assumed), Continuity.
      *   *Impossibility:* Focus on the tension between Additivity, Granularity, and Extensionality. (The "Partition Problem").

  8.  **Final Review against Constraints:**
      *   No references? Check.
      *   No attributions? Check.
      *   Focus on requirements? Check.
      *   Address the three specific tasks (Exclusionary, Impossibility, Responses)? Check.

  9.  **Self-Correction on "Anti-luck":** The prompt asks me to tell them which candidates are *not* genuine desiderata but prejudices. Anti-luck is a strong candidate for this. Accuracy-first epistemology defines epistemic value as proximity to truth. Proximity to truth *is* vulnerable to luck. Demanding "Anti-luck" is demanding the theory *not* be accuracy-first in the standard sense. I will flag this clearly.

  10. **Self-Correction on "Measure-independence":** Strict independence is impossible. The desideratum should be formulated as "Robustness across a non-arbitrary class of proper measures." I will classify the strict version as a prejudice/impossibility and the robust version as the genuine desideratum.

  11. **Refining the Impossibility Argument:** The core tension is that if you sum scores (Additivity) over a partition, and you refine the partition (Granularity), the total score changes unless the scoring rule is trivial, *provided* the score depends only on the truth value of the cells (Extensionality). This is the "Partition Sensitivity" problem.

  12. **Final Polish:** Ensure the distinction between the three claims (Statistical, Value-theoretic, Normative) is respected in the analysis.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Additivity is partisan." I need to explain *why* it's partisan (Holists vs. Atomists). Same for Anti-consequentialism.

