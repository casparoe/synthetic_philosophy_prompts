answer: |-
  The Terri Schiavo episode functions less as a test of the doing/allowing distinction's moral truth and more as a stress test of its institutional durability. When stretched across seven years of litigation, legislative intervention, and sustained biological maintenance, the distinction does not break, but it distorts, revealing that its application depends less on the metaphysics of action than on the administrative categorization of the intervention. Below is the mapping of the four decision points, followed by an analysis of the structural pressures you identified, the explanatory limits of the distinction, and a verdict on its theoretical status in this context.

  ### I. Mapping the Decision Points

  **1. The 1998 Petition**
  *   **Agent:** Michael Schiavo (legal guardian).
  *   **Option Set:** Petition the court for authority to withdraw the feeding tube vs. maintain the status quo of artificial nutrition and hydration (ANH).
  *   **Classification:**
      *   *Pro-Withdrawal (Court/Husband):* **Allowing.** The criterion is the *moralized baseline* of bodily integrity. Since a competent person has a right to refuse treatment, the guardian's petition is an attempt to restore the patient to the baseline she would have chosen. The tube is an intrusion; removing the petition for its continuation is allowing the underlying pathology (anoxic brain damage) to proceed.
      *   *Pro-Life/Parents:* **Doing.** The criterion is the *counterfactual structure* of survival. Absent the petition, the tube remains, and life continues. The petition initiates a causal chain leading to death. Because the agent (husband) introduces a new variable (the legal request) that changes the outcome from life to death, this is classified as a positive act of killing.
  *   **Tension:** The classification hinges entirely on whether the tube is viewed as a *barrier* to death (removing it allows death) or a *provision* of life (removing it causes death).

  **2. The 2001 Removal and Reinsertion**
  *   **Agent:** Medical personnel (executing court order) / Governor Jeb Bush (executing emergency stay).
  *   **Option Set:** Physically disconnect the tube / Physically reconnect the tube.
  *   **Classification:**
      *   *Removal:* **Allowing.** Criterion: *Bodily movement* is acknowledged (hands disconnected the tube), but the *moralized baseline* overrides it. The act is legally construed as the cessation of a medical procedure. The movement is incidental to the omission of further care.
      *   *Reinsertion:* **Doing.** Criterion: *Counterfactual structure.* The patient had been returned to the "natural" course (dying). Reinsertion requires a new intrusion, a new invasion of bodily integrity to alter the trajectory back toward life.
  *   **Tension:** The physical symmetry is perfect (hands on, hands off), but the moral asymmetry is total. The distinction survives here only by treating the first removal as the "real" decision and the reinsertion as an anomalous correction of a process already deemed complete.

  **3. The 2003 Statutory Stay ("Terri's Law")**
  *   **Agent:** Florida Legislature and Governor.
  *   **Option Set:** Enact special legislation authorizing the Governor to stay the removal vs. defer to the judicial branch's final ruling.
  *   **Classification:**
      *   *Enactment:* **Doing.** Criterion: *Institutional baseline.* In the separation of powers, the judiciary is the baseline arbiter of rights. Legislative intervention to override a specific judicial order is an active intrusion into the judicial function. It forces a "doing" (reinsertion) that the courts had classified as an "allowing."
      *   *Striking Down (Florida Supreme Court):* **Allowing.** Criterion: *Procedural default.* By striking the law, the Court allowed the original judicial order to stand. It refused to *do* anything new, thereby permitting the prior "allowing" of death to resume.
  *   **Tension:** This point shifts the distinction from the bedside to the statehouse. The Legislature argued they were *allowing* the family (parents) to protect their daughter; the Court argued the Legislature was *doing* violence to the constitutional order. The doing/allowing distinction is repurposed here as a tool of jurisdictional boundary-marking.

  **4. The March 2005 Sequence (Final Removal to Death)**
  *   **Agent:** Hospice staff and Federal Courts.
  *   **Option Set:** Reinsert the tube during the 13-day dying process vs. maintain comfort care only.
  *   **Classification:**
      *   *Non-Reinsertion:* **Allowing.** Criterion: *Standing-intervention.* Once the tube was out, the "treatment" had ceased. Every subsequent hour was an omission to restart. The courts treated the 13 days not as a continuous act of killing, but as a sustained period of allowing the pathology to conclude.
      *   *Opponent View:* **Doing.** Criterion: *Causal proximity.* The agents knew that without intervention, death was certain. Choosing not to intervene when intervention was physically possible and legally petitioned is, on this view, a deliberate choice of outcome, functionally equivalent to a positive act.
  *   **Tension:** This is the point where the distinction is most strained by time. A discrete omission becomes a sustained state of affairs.

  ### II. The Three Pressures and the Epistemic Question

  **The Standing-Intervention Problem**
  The standard doing/allowing apparatus is designed for discrete events (pushing a man, pulling a switch). In Schiavo, the feeding tube was a sustained intervention, a continuous flow of matter maintained by technology. Consequently, the March 2005 decision was not a single act of withdrawal but the cessation of a *doing* (the pumping of nutrients) followed by thirteen consecutive days of decisions *not to restart* it. Under the standard description, the distinction survives by fiat: the law defines the *initiation* of ANH as the treatment and the *cessation* as the return to baseline. However, ontologically, the hospice staff engaged in a continuous course of conduct (monitoring, withholding food) that sustained the dying process. If "allowing" requires passivity, the 13 days were not passive; they were actively managed dying. The distinction survives here only by treating the *status* of the patient (untreated) as morally static, ignoring that maintaining that status required continuous institutional effort. It becomes a legal fiction: the "act" was the removal; the "dying" was nature. In reality, the dying was managed by humans.

  **Baseline Dependence**
  The litigants were not fighting over the physics of the tube; they were fighting over the counterfactual baseline.
  *   *Baseline A (Pathology):* The body is dying. The tube is a machine holding it back. Removing the tube = Allowing the body to do what it was already doing.
  *   *Baseline B (Functioning Intervention):* The patient is alive and functioning (digesting, metabolizing). The tube is the method of feeding. Removing the tube = Switching off a functioning life-support system.
  The "starvation" description had rhetorical purchase because it successfully shifted the public baseline from A to B. If the baseline is "a person who is being fed," then stopping feeding is killing. If the baseline is "a body in PVS," then stopping feeding is ceasing treatment. The doing/allowing distinction cannot resolve this because it is parasitic on the baseline. It tells you what follows *once* the baseline is set, but it offers no resources for setting the baseline itself. The legal system resolved this by categorizing ANH as medical treatment (Baseline A), but the moral conflict persisted because the opponents rejected that categorization.

  **ANH Categorization (Treatment vs. Ordinary Care)**
  You note that this categorization appears to have done most of the work. This is correct. The doing/allowing distinction is morally load-bearing only if the act in question is optional. If ANH is "ordinary care" (like spoon-feeding), there is a duty to provide it; withholding it is a violation of duty, hence a "doing" of harm. If ANH is "medical treatment" (like a ventilator), there is no duty to provide it if it is futile or unwanted; withholding it is "allowing." The courts did not derive the "treatment" classification from the doing/allowing distinction; they imported it from bioethics precedents (e.g., *Cruzan*) to *make* the distinction work. The classification drove the moral intuition, not vice versa. The distinction is merely the grammatical structure that accommodates the classification.

  **Epistemic Status: Facts vs. Beliefs**
  Should the classification be indexed to the facts (was she truly in PVS?) or the decision-makers' beliefs (did the court find she was in PVS)? The doing/allowing distinction is typically fact-sensitive: if you push a man thinking he is a dummy, you still *did* the pushing, but the moral weight changes. In Schiavo, the diagnosis was contested for years. If the parents were right (she was minimally conscious), withdrawal was killing (doing). If the husband was right (PVS), it was allowing. The courts operated on *adjudicated fact* (belief based on evidence). They ruled that withdrawal was "allowing" based on the *belief* that she was in PVS and would have refused treatment. This creates a fragility: the moral justification (allowing) is contingent on a medical fact that was never independently verified to the satisfaction of all parties. The distinction collapses if the epistemic premise is false. The legal system treats the adjudicated belief as the fact, but the moral reality depends on the actual state of the organism.

  ### III. Reverse Mapping: Explanatory Power and Silences

  **What the Distinction Explains**
  1.  **Legal Symmetry:** It explains why courts could permit withdrawal while refusing to entertain active euthanasia. Active euthanasia introduces a new causal agent (a lethal injection) that interrupts the natural baseline. Withdrawal removes an interrupting agent. The distinction provides the logical architecture for the "right to die" without legalizing the "right to kill."
  2.  **Political Form:** It explains why political interventions took the form of "stays" and "reinsertion orders." Legislators could not simply declare "she shall live"; they had to mandate a *doing* (reinsertion) to counteract the judicial *allowing*. They had to speak the language of the distinction to intervene.
  3.  **Rhetorical Purchase:** It explains the "starvation" rhetoric. Opponents knew that if they could characterize the event as "withholding food" (ordinary care) rather than "withdrawing treatment" (medical intervention), the doing/allowing distinction would flip, turning the doctors into killers. They fought on the terrain of the distinction because they knew it determined the moral valence.

  **The Silences**
  1.  **The Question of Authority:** The distinction has nothing to say about *who* gets to decide the baseline. It assumes a legitimate agent (guardian vs. parents). The seven-year fight was largely about standing, not metaphysics. The doing/allowing framework is silent on the conflict of interest between a husband and parents.
  2.  **The Suffering of the Process:** The distinction focuses on the *cause* of death (act vs. omission). It is silent on the *experience* of death. Whether the 13 days were painful, or whether the dehydration was distressing, is morally relevant to many but irrelevant to the doing/allowing calculus. The distinction sanitizes the physical reality of the dying process.
  3.  **The Institutional Drag:** It cannot explain the delay. If withdrawal is merely "allowing," why did it take seven years? The distinction treats the decision as a moment, but the reality was a process. It misdescribes the episode as a series of binary choices rather than a war of attrition.
  4.  **The Moral Weight of the 13 Days:** If the final 13 days were an "allowing," does the moral weight diminish over time? Is day 13 of allowing different from day 1? The distinction offers no gradient. It treats the entire period as morally equivalent to the moment of disconnection, which fails to capture the accumulating weight of sustained non-intervention.

  ### IV. Verdict and the Coordination Hypothesis

  Is this episode a confirmation, an anomaly, or a category error? It is a **category error**. The doing/allowing distinction emerged from a tradition of one-off thought experiments involving discrete agents (a rescuer, a bystander) and immediate consequences. It was not built to handle institutions making repeatable, appealable, politically contested decisions about sustained interventions over nearly a decade. In the thought experiments, the facts are stipulated. In Schiavo, the facts were the battlefield.

  I argue **for** your suspicion: the episode shows the distinction operating in two different registers at once, and conflating them is the source of the bad faith accusations.

  **Register 1: First-Order Moral Claim.**
  For the parents and the public, the distinction was an ontological claim about the nature of the death. "Is this killing or letting die?" was a question about the moral reality of the event. If it is killing, it is murder. If it is letting die, it is tragedy. In this register, the distinction is truth-apt and absolute.

  **Register 2: Coordination Device.**
  For the courts and the legal system, the distinction was a procedural tool to assign decision rights and default outcomes. By classifying ANH as "treatment" and withdrawal as "allowing," the law established a default rule: *Guardians may refuse treatment.* This allows the legal system to resolve cases without resolving the underlying moral question of whether withdrawal is ontologically identical to killing. It coordinates behavior by setting a bright line: "We treat this *as if* it were allowing."

  **The Conflation:**
  The bad faith accusations arose because each side was operating in a different register. The opponents (parents/legislators) argued in Register 1: "You are killing her, and you know it." They saw the legal classification as a lie covering up a moral truth. The courts argued in Register 2: "We are applying the standard for refusal of treatment." They saw the opposition as refusing to accept the procedural default.

  When the Florida Legislature passed "Terri's Law," they were trying to force Register 1 (the moral truth of life) onto Register 2 (the legal procedure). When the Courts struck it down, they were defending Register 2 (the integrity of the procedural default) against Register 1.

  The doing/allowing distinction survived the case not because it successfully described the moral reality, but because it successfully functioned as a coordination device. It allowed the courts to close the case. But it failed to persuade the public because, in Register 1, the distinction is far less stable than in Register 2. In the real world, sustained omission looks and feels like action. The distinction is robust enough to sustain a legal verdict, but too brittle to sustain a moral consensus when the "omission" takes thirteen days to kill and is fought over for seven years. The Schiavo case demonstrates that the doing/allowing distinction is a powerful tool for legal closure, but a poor instrument for moral resolution in complex, sustained, institutional contexts. It resolves the case by fiat, not by insight.
