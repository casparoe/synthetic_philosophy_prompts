answer: |-
  Good afternoon, everyone. Thank you for coming.

  Thirty-five people is a good number. It feels like a structure that holds. We are here for Dad. Eighty-four years is a significant span.

  He spent forty years as a structural engineer. He designed for load cases that would never occur. He provided for winds he would not live to feel. That is the job. You build for safety. You build for stability. You plan for conditions the designer will not see. Some of his colleagues are here today. They know the frames he drew. They know the bridges he inspected. They know he was a man who respected the margin of safety. He understood that a thing must stand even when the weather turns.

  Today, the load is lighter. The only thing we are asking this structure to do is stand. And it does.

  Dad, you are sitting there. You are wearing that tie. You are listening to the hum of this room. I know your attention moves like tide water. Sometimes it is high, and we talk about the bridge you inspected in 1978. Sometimes it is low, and the thread of a sentence slips away. That is alright. We are not here to test you. We are here to be with you.

  My brother is here. He has carried much of this recent weight. He visits often. He watches you eat. He sees the pleasure you take in a warm meal. He sees the smile when the carers arrive. He sees the comfort of the afternoon. He argues, quietly and with love, that the man in the chair matters most. That the present tense is the only one we can truly hold. He believes loyalty belongs to the person breathing, not the person who wrote.

  I know what was decided twenty-two years ago. I know what was feared then. I know what is enjoyed now. There is a question in this room. It is not about engineering. It is about time. Does a decision made in one season bind us in another? Does the fear of a winter past dictate the warmth of this summer?

  I will not answer that question now. Not because I do not care, but because today is not for answering. Today is for witnessing.

  We have your sister here, ninety-one years young. She remembers when you were both small. She remembers the before. We have your colleagues. They remember the work. They remember the calculations. We have the carers. They remember the mornings. They remember the tea. They know the routine of your day better than anyone. They keep you clean. They keep you company.

