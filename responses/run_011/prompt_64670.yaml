      Thirty-five people is a good number. It feels like a structure that holds.
      We are here for Dad. Eighty-four years.
      He spent forty years designing steel and concrete. He thought about loads. He thought about winds that might blow once in a century. He built provisions into the frame for conditions he would not live to see. That is what engineers do. They plan for safety. They plan for stability.
      Today, the load is lighter. The only thing we are asking this structure to do is stand. And it does.
      Dad, you are sitting there. You are wearing that tie. You are listening to the hum of this room.
      I know your attention moves like tide water. Sometimes it is high, and we talk about the bridge in '78. Sometimes it is low, and the words slip away. That is alright. We are not here to test you. We are here to be with you.
      My brother is here. He has carried much of this recent weight. He looks at you and sees the man who enjoys his lunch. He sees the smile when the carers arrive. He sees the comfort of the afternoon. He argues, quietly and with love, that the man in the chair matters most. That the present tense is the only one we can truly hold.
      I have read the documents. I know what was written twenty-two years ago. I know what was feared then. I know what is enjoyed now.
      There is a question in this room. It is not about engineering. It is about time. Does the signature on a page bind the hand that holds the spoon today? Does the fear of a winter past dictate the warmth of this summer?
      I will not answer that question now. Not because I do not care, but because today is not for answering. Today is for witnessing.
      We have your sister here, ninety-one years young. She remembers when you were both small. She remembers the before.
      We have your colleagues. They remember the work. They remember the calculations.
      We have the carers. They remember the mornings. They remember the tea.
      And we have your children. We remember everything. We remember the wife you lost. We remember the promises made in grief. We also remember the laughter in this room today.
      To say you are unchanged would be a lie. Time moves through us like water through stone.
      To say you are gone would be a lie too. You are here. You are warm. You are known.
      So we stand in the middle. We hold the past and the present together, without forcing them to match.
      We honour the man who planned for the storm. We also honour the man who sits in the sun.
      There is no conflict in this room that needs solving before lunch. There is only love, which is large enough to hold the contradiction.
      My brother and I stand together. We may look at the map differently, but we are walking the same path. We are both your sons. We both want your comfort. We both want your dignity.
      Dad, look around. This is your load case. This is the provision that holds. Thirty-five people who want you to be safe. Who want you to be fed. Who want you to be here.
      So I will not make a promise about the future. I will make a statement about now.
      You are welcome here. You are valued here. You are loved here.
      Please raise your glasses.
      To Dad. To the structure that stands. To the man in the chair.
      Happy Birthday.

