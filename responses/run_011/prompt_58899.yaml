  Dear Colleagues,

  For our closing session, I propose we set aside the usual catalog of growth hormone and modafinil cases and consider two patients, Mr. A and Mr. B, both presenting with Circadian Rhythm Sleep-Wake Disorder, specifically the delayed sleep phase type. Both report an identical functional shortfall: an inability to maintain alertness during the standard 0800 to 1700 window required for their employment, measured objectively by a Psychomotor Vigilance Task where both score in the bottom fifth of the general population. Both are prescribed the same dose of ramelteon, a melatonin receptor agonist, which successfully shifts their sleep onset to 2300 and restores their vigilance scores to the population mean. The critical difference lies in their reference populations. Mr. A lives in a conventional metropolitan center where ninety percent of adults naturally sleep between 2300 and 0700. Mr. B lives in a remote, self-contained industrial enclave where continuous operations require ninety percent of adults to naturally sleep between 1100 and 1900. For Mr. A, the intervention restores a statistically typical function relative to his local reference class. For Mr. B, the intervention induces a state that is statistically atypical relative to his local reference class, even though it resolves the identical functional impairment. Ten years later, assume the global economy shifts such that the industrial model of Mr. B's enclave becomes the dominant employment structure worldwide, making the 1100 to 1900 sleep cycle the statistical norm for the species-level reference class, while the treatment remains routine in that population but unchanged for Mr. A.

  This scenario isolates the structural conflict between a biostatistical account of health, following Christopher Boorse, and a normal opportunity range account, following Norman Daniels, without relying on contested intuitions about fairness or competition. Under the biostatistical account, health is statistically typical part-functioning relative to a reference class. Initially, Mr. A's treatment is therapy because it restores him to the species-typical sleep phase, while Mr. B's treatment is enhancement because it pushes him away from the modal condition of his reference class, despite the identical clinical indication. Daniels's account, which defines health as the maintenance of the normal opportunity range, classifies both as therapy because both interventions restore the capacity to pursue reasonable life plans, specifically standard employment. In the temporal shift, the biostatistical account's verdict for Mr. A flips from therapy to enhancement. Because the global reference class has shifted to favor the later sleep cycle, Mr. A's treated state (2300 onset) is now statistically atypical, whereas his untreated state would have been typical; thus, the intervention is no longer restoring typical function but deviating from it. Daniels's account remains unchanged, as Mr. A's opportunity range is still restricted without the drug. The single feature doing the work here is the reliance on statistical typicality as the constitutive norm of health, which makes the verdict sensitive to demographic shifts rather than individual welfare. If this feature is removed, and health is defined solely by functional capacity or opportunity, the case collapses back into a standard treatment scenario indistinguishable from the familiar examples we sought to avoid.

  The strongest reply on behalf of the biostatistical account is to argue that reference classes should be fixed by natural kinds, such as age and sex, rather than contingent social or economic arrangements like work shifts. A proponent would argue that the industrial enclave's sleep pattern is an environmental distortion, not a biological norm, and therefore the species-typical design function remains the 2300 sleep cycle regardless of statistical prevalence. On this view, the verdict for Mr. B is therapy from the start, and the temporal shift does not alter the verdict for Mr. A, because the biological reference class has not changed. This objection dissolves the case by rejecting the premise that social statistics can redefine biological health. I would concede that the scenario fails to meet the specification of a genuine disagreement between the two accounts if one accepts that reference classes must be biologically fixed rather than statistically derived from the living population. The step in my reasoning most likely to be challenged is the assumption that a biostatistical theorist would allow the reference class to shift based on economic dominance rather than physiological design, as this conflates statistical normality with functional adequacy in a way Boorse explicitly tried to prevent.
