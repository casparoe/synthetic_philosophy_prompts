  I

  We lay the real line out upon the floor,
  And sort the numbers by their difference.
  Where two differ by a fraction, they are kin,
  And fall into the same appointed bin.
  Infinite piles await our searching hand,
  Like socks without a left or right to stand.
  I take one from each pile without a rule,
  No instruction says which is the tool.
  Thus gathered up, the set begins to swell,
  A collection built beyond all tell.
  We ask the measure for a length to grant,
  It offers none; there is no length to want.

