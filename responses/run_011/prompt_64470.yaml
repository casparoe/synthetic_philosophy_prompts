answer: |-
  The requirement for Mind-Independent Fixity eliminates the most candidates, but it cannot be jointly satisfied with the requirement for Genuine Pluralism without Permissiveness, forcing the abandonment of either objective uniqueness or descriptive richness.

  1.  **Triviality Resistance**
      *   **Requirement:** Physical state transitions must map to computational states only under constraints that exclude arbitrary or gerrymandered mappings.
      *   **Motivation:** A convective pattern in a star can be mapped to any finite automaton if disjunctive state groupings are allowed; this must not count as computation.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Pancomputationalism, where every physical system implements every program, rendering the claim empirically empty.

  2.  **Objective Pluralism**
      *   **Requirement:** Multiple distinct computational descriptions (e.g., RL, Bayesian, Control) must be simultaneously true of the same system without relying on ascriber interest to select the valid one.
      *   **Motivation:** Neural tissue supports multiple successful modeling frameworks; if only one is literal, the others are merely instrumental, which conflicts with robust scientific practice.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Monism, where only one description is literally true, or Subjectivism, where truth depends on the modeler's choice.

  3.  **Grain Fixity**
      *   **Requirement:** The theory must specify a principle for selecting the physical level (spikes, membranes, chemistry) that realizes the computation without appealing to explanatory convenience.
      *   **Motivation:** A neuron can be modeled as a spike generator or a chemical bath; without a fixing principle, the implementation claim floats arbitrarily between levels.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Level Relativism, where the system computes at one grain for one observer and a different grain for another.

  4.  **Interface Naturalization**
      *   **Requirement:** Inputs and outputs must be identified via physical causal boundaries rather than stipulated by the modeler.
      *   **Motivation:** Brains operate in closed loops with no clear terminals; textbook automata require distinguished I/O ports to define the function.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Stipulative I/O, where the ascriber draws the boundary arbitrarily to fit the desired computation.

  5.  **Counterfactual Grounding**
      *   **Requirement:** Dispositional states (what the system *would* do) must be grounded in the system's intrinsic physical structure, not in external backup mechanisms.
      *   **Motivation:** If a technician fixes faults that never occur, the machine's computational identity shouldn't depend on the technician's presence unless that presence alters the machine's physical dispositions.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Extrinsic Dispositionality, where implementation depends on factors outside the physical system's boundary.

  6.  **Capacity versus Activity**
      *   **Requirement:** The theory must distinguish between possessing a computational structure and actively executing it.
      *   **Motivation:** An idle laptop or anesthetized cortex retains the capacity to compute but is not currently processing; conflating the two misdescribes the system's current state.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** State Confusion, where a powered-off system is said to be computing simply because it could.

  7.  **Co-implementation Resolution**
      *   **Requirement:** The theory must determine whether non-isomorphic programs mapped onto the same physical process are co-implemented, mutually exclusive, or ill-posed.
      *   **Motivation:** One physical trajectory might satisfy the transition rules of two distinct algorithms; the theory cannot remain silent on whether both are literally running.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Contradiction or Indeterminacy, where the system literally runs incompatible programs simultaneously.

  8.  **Undesigned Compatibility**
      *   **Requirement:** Implementation must not require a designer, intention, or prior recognition of the program by an agent.
      *   **Motivation:** Evolved circuitry computes without a programmer; requiring design excludes the primary subject of cognitive science.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Intelligent Design Bias, where natural systems are excluded from computational ontology unless interpreted by a human.

  9.  **Determinacy under Noise**
      *   **Requirement:** The theory must specify a tolerance threshold for physical variance before a discrete computational description fails.
      *   **Motivation:** Real neurons are noisy and analog; without a threshold, any analog process could be described as any discrete computation via error correction.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Fragility or Over-permissiveness, where noise either destroys implementation claims or is ignored to fit any model.

  10. **Explanatory Sufficiency**
      *   **Requirement:** The identified computation must do the causal work required to explain the system's capacities.
      *   **Motivation:** A system might physically implement a program that is epiphenomenal to its actual behavior; this does not support cognitive scientific explanation.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Epiphenomenal Computation, where the computation exists but explains nothing about the system's performance.

  11. **Falsifiability (Risk)**
      *   **Requirement:** The theory must specify physical conditions under which a system definitively does *not* compute.
      *   **Motivation:** If no physical finding could refute a computational claim, the claim is metaphysical rather than scientific.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Unfalsifiable Posit, where the theory accommodates any physical evidence by adjusting the interpretation.

  12. **Mind-Independent Fixity**
      *   **Requirement:** The facts determining implementation must reside entirely in the physical system, independent of an observer's interests or purposes.
      *   **Motivation:** If the ascriber's interests decide what is computed, the claim is about the description, not the brain, violating the "literal" criterion.
      *   **Tag:** Non-negotiable (Job).
      *   **Failure Mode:** Subjectivism, where computation is a feature of the model, not the world.

  The subset of requirements that cannot all be satisfied is **Mind-Independent Fixity (12)** and **Objective Pluralism (2)**. If physical facts alone fix implementation without ascriber interest, they typically privilege a single causal carving of the system, making only one computational description literally true. To maintain Genuine Pluralism where multiple distinct descriptions are equally literal, one must concede that ascriber interests select the relevant variables, violating Fixity. For your paper's job, **Objective Pluralism** has to go; you must accept that if computation is literal and mind-independent, only one description can be the fundamental truth, while others are merely useful approximations.

  **Formal Mapping Accounts:** These define computation purely by state-to-state isomorphism without causal constraints. They flunk **Triviality Resistance (1)** immediately, as they allow any physical system with enough states to implement any program via gerrymandered mappings.

  **Mechanistic Accounts:** These define computation as a functional kind of causal organization realized by mechanisms. They flunk **Mind-Independent Fixity (12)** because mechanistic decomposition often relies on explanatory interests to determine which causal pathways count as the mechanism.

  **Semantic Accounts:** These require physical states to carry content or represent external conditions to count as computation. They flunk **Undesigned Compatibility (8)** because naturalizing content without appealing to history, design, or interpretation remains an unsolved problem that risks reintroducing ascriber dependence.

  **Deflationary Views:** These claim computation is a description we impose rather than a feature of the world. They flunk **Mind-Independent Fixity (12)** by definition, as they deny the literal status you are tasked to assess, making the claim true by stipulation of the framework.

  **Dynamical-Systems Views:** These deny the brain computes at all, modeling it as continuous state evolution instead. They flunk **Explanatory Sufficiency (10)** relative to your paper's goal, as they reject the premise that computational claims account for the capacities you intend to explain.
