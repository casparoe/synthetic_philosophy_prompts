  - **Bottom line**
  This example discriminates successfully because the community's reaction flips while the man's actual rank remains identical. The Veblenian redescription cannot fully absorb the case without stretching the definition of "rank" until it loses meaning. It succeeds only if we count mannerisms as status currency, which blurs the line between having and acting.

  - **The example**
  Ray Miller grew up here when the big manufacturing plant still hummed, before the economy shifted to the hospital and the laptops. He took over his father's machining shop just before the shutdown, pivoting early to fix medical equipment for the regional hospital. Ten years ago, Ray landed a contract that doubled his income and let him hire twenty neighbors who used to work the line. At the Chamber of Commerce dinner, he stood up, loosened his tie, and said, "I got lucky with the timing, and you folks kept the lights on when I was scared." He bought a keg for the VFW hall and stayed until closing. People slapped his back and called him a hero. He was one of us who made it, but he remembered where he started. His bank account grew, but his place at the table felt the same. He was tall, but he bent down to listen. The waitresses poured his coffee without asking.

  Last month, Ray landed the same size contract again. He hired another twenty people from the same pool. His wealth is identical to what it was a decade ago relative to the town, and his influence over local jobs is unchanged. But at the dinner, he stood straighter and said, "Most guys couldn't see the shift coming. I saw it. You have to have the grit to lead, not just follow." He didn't buy the keg. He left early to get back to his "important work," ignoring the handshakes. Now, when he walks into the diner, the booth is suddenly full. When he speaks at the council, people check their phones. He hasn't gotten richer than before, and he hasn't gotten richer than the hospital administrators everyone tolerates. The money gap is the same. The job title is the same. But the warmth is gone. The town hasn't cut him down to size financially; they have cut him out of the story. They tolerate the wealth, but they punish the voice. The machinery of the town runs the same, but the social oil has dried up. People who borrowed money from him ten years ago pay him back on time now, but they don't look him in the eye.

  - **The discriminating feature**
  The single difference is the story Ray tells about why he is rich. In the first episode, he attributes success to luck and community support, which keeps his social standing equal even if his bank account is higher. In the second, he attributes it to personal superiority, asserting a moral rank above his neighbors. Standing-resentment cannot explain the flip because the inequality—the gap in money and power—is identical in both years. If the grievance were purely about someone occupying a higher rank, Ray should have been shunned ten years ago too. The resentment only triggers when he claims the rank is due to his own nature rather than shared fortune. The object of the anger is not the height of the ladder, but the claim that he climbed it alone. This proves the community objects to the assertion of entitlement, not the existence of inequality.

  - **The Veblenian reply**
  A Veblenian defender would argue that status is not just money, but honor and reputability. By claiming "grit" and "vision," Ray isn't just describing his work; he is insulting the neighbors' lack of it. In the first episode, his humility lowered his social height, narrowing the gap between him and the town. In the second, his arrogance widened the gap without changing his wallet. The community cuts him down not because he is rich, but because he is claiming a superior *kind* of personhood. This is still invidious comparison. The neighbors are protecting their own reputability by refusing to let Ray define the terms of worth. If he says success is about grit, and they lack grit, they are losers. So they reject his claim to protect their own rank. It is all one ranking game, played with words instead of dollars. The resentment is still about standing, just a social standing rather than an economic one. The Veblenian says you cannot separate the claim from the rank, because the claim *is* the move in the game.

  - **What would settle it**
  To separate the accounts, we need a third episode where Ray claims superiority but explicitly renounces the benefits of rank. Suppose he says, "I am smarter than you, so I will work harder for the same pay." If the community accepts this, Claim-resentment wins: they oppose entitlement, not hierarchy. If they still reject him, Veblen wins: the claim of superiority itself is the threat, regardless of material sacrifice. The distinction fails if any claim of difference is treated as a status attack, but holds if modesty about privilege neutralizes the hostility. We need to see if the town punishes the thought or the benefit. If they forgive the claim when the wallet is closed, it is about claims. If they punish the claim even when the wallet is closed, it is about ranking.

