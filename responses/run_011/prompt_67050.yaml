answer: |-
  Here is the carving you requested, addressing your four constraints in order.

  ### 1. Is there an established concept?

  There is no single settled label that captures this configuration in its entirety. You are correctly identifying a gap between three existing frameworks, each of which captures a facet of the pattern but fails to encompass the whole.

  *   **Ian Hacking's "Looping Effects":** This is the genus, but your objection is valid. Hacking's paradigmatic cases (multiple personality, autism, child abuse) rely heavily on *subjectification*—the classified person coming to understand themselves through the label. While Hacking acknowledges that institutions participate in the loop (e.g., schools creating spaces for "autistic children"), the *mechanism* of change in his theory is typically reflexive agency. Your pattern describes a loop where the agency resides in the *classifier* and the *payer*, not the classified. To use Hacking's term without qualification commits you to the claim that the classified are somehow reacting to the label, which your evidence contradicts.
  *   **Goodhart's Law / Campbell's Law:** ("When a measure becomes a target, it ceases to be a good measure.") This captures the *mechanism* (incentive distortion) perfectly. However, it is an epistemic claim about *metrics*, not an ontological claim about *kinds*. Goodhart's Law suggests the data becomes useless; your pattern suggests the *clinical reality* itself is being reconfigured. Goodhart does not account for the phenotypic drift or the revision of reference manuals.
  *   **Annemarie Mol's "Enactment" (The Body Multiple):** This is the strongest philosophical fit for the ontological shift. Mol argues that diseases are not pre-existing objects discovered by science, but realities *enacted* in specific practices (the lab, the clinic, the policy meeting). Your pattern describes a clash of enactments: the clinical enactment is being displaced by the administrative enactment. However, "enactment" is a broad praxiographic framework, not a specific label for *incentive-driven* drift.

  **Verdict:** You are not missing a term; you are identifying a specific *species* of looping effect that sits between Hacking (ontology of people) and Goodhart (sociology of metrics). If you use "Looping Effect," you must explicitly qualify it as **Institutional Looping** to distinguish it from Hacking's standard **Personal Looping**.

  ### 2. Sorting against the neighbours

  Here is the boundary work distinguishing your pattern from the four neighbours you identified.

  | Neighbour | What your pattern has that the neighbour lacks | What your pattern lacks that makes the neighbour the wrong tool |
  | :--- | :--- | :--- |
  | **Mere Inflation** | **Phenotypic Drift.** In mere inflation, the criteria stay fixed and more people fit them (or are squeezed into them). In your pattern, the *clinical description* of the disorder changes over time to match the new intake. The "textbook case" in 2025 is clinically distinct from the 1995 version. | **Ontological Stability.** Mere inflation assumes the underlying kind is stable and only the count is wrong. Your pattern asserts the kind *itself* is mutable. |
  | **Semantic Drift** | **Incentive Structure.** Semantic drift is driven by usage, culture, or scientific discovery. Your pattern is driven by *entitlement*. The meaning changes not because language evolved, but because a specific code unlocks a specific resource. | **Organic Evolution.** Semantic drift implies a decentralized, cultural process. Your pattern is often centralized and regulatory (e.g., a specific change in insurance reimbursement codes). |
  | **Goodhart's Law** | **Ontological Feedback.** Goodhart's Law predicts the measure becomes corrupt. Your pattern predicts the *referent* changes. The clinicians do not just lie on the form; they begin to *see* the patient differently, and the manuals are rewritten to match the new population. | **Epistemic Nihilism.** Goodhart implies the data is now "broken." Your pattern implies the data is "accurate" for a *new* reality that has been brought into being by the bureaucracy. |
  | **Interactive Kinds (Hacking)** | **Institutional Uptake.** Standard interactive kinds require the classified to take up the label (identity formation). Your pattern functions even if the classified is unconscious, indifferent, or hostile. The loop is closed by the *system*, not the *self*. | **Reflexive Agency.** Hacking's model relies on the human capacity to react to being classified. Your pattern works on populations (children, incapacitated adults) where that capacity is absent or irrelevant. |

  **The Boundary:** The boundary between your pattern and Hacking's Interactive Kinds is the **locus of reflexivity**. In Hacking's model, the person changes themselves to fit the kind. In your model, the *system* changes the kind to fit the person (so the person can be processed).

  ### 3. Can a kind be interactive via institutional uptake?

  **Yes.** This is the pivotal philosophical claim.

  A "kind" in psychiatry is not a natural species waiting to be found; it is a **stabilized node in a network of practice**. For a kind to be "interactive," it does not require the *consciousness* of the classified; it requires that the *classification changes the conditions of existence* for the members of the kind.

  *   **The Mechanism:** The feedback loop is closed by the *assessors* and the *manuals*, not the patients. When a clinician learns that "Code A" gets funding and "Code B" does not, the clinician's attention shifts. They begin to look for symptoms of A. They ask different questions. They interpret ambiguities in favour of A. Over time, the population of people labelled A changes. The manuals are revised to reflect this new population. The "kind" has interacted with the "classifiers," and through them, the extension and intension of the kind have shifted.
  *   **The Status of the Classified:** Whether the classified is unaware, indifferent, or hostile is irrelevant to the *ontology* of the kind, though it matters for the *ethics*. The kind is interactive because the *practice of classification* is responsive to the *utility of the classification*.
  *   **The Distinction:** If the classified is unaware, it is not an interactive kind *for them* (it does not shape their identity). But it remains an interactive kind *for the discipline* (it shapes the science). You are describing a **System-Interactive Kind** rather than a **Subject-Interactive Kind**.

  ### 4. Diagnostic Signatures

  To distinguish this from genuine epidemiological change, you need evidence that decouples the *administrative logic* from the *clinical logic*.

  **Diagnostic Evidence (Strong Signals):**
  1.  **The Step-Function:** Genuine epidemiological shifts are usually gradual. Administrative loops often produce sharp discontinuities in time-series data coinciding exactly with policy changes (e.g., a 40% rise in diagnoses the quarter after a new funding bill passes).
  2.  **Zero-Sum Displacement:** If the underlying pathology is constant, the rise in Category A should be mirrored by a decline in Category B (Diagnostic Substitution). If "Autism" rises while "Intellectual Disability" falls in the same cohort, with no change in overall impairment rates, this signals administrative migration.
  3.  **The Clinician-Record Divergence:** Compare cohorts assembled by *research criteria* (strict, unpaid) vs. *administrative records* (billing, funded). If the administrative cohort shows higher prevalence and milder symptoms than the research cohort, and this gap widens after incentive changes, the administrative loop is active.
  4.  **Geographic/Payer Variance:** If prevalence varies wildly between jurisdictions with different funding rules but similar demographics, the driver is likely administrative, not biological.

  **Merely Suggestive Evidence (Weak Signals):**
  1.  **Overall Prevalence Rise:** This feels diagnostic but could be genuine (e.g., environmental toxins).
  2.  **Clinician Testimony:** "We see it more often." This is confounded by the very drift you are studying; their perception is part of the loop.
  3.  **Manual Revisions:** Changes in DSM/ICD criteria are necessary for the loop to stabilize, but they can also result from genuine scientific progress.

  ### 5. Proposal for a Label

  Since no settled term fits, I propose you carve this out as:

  **The Administrative Loop** (Process)
  **Administrative Kind** (Ontology)

  **Definition:**
  An **Administrative Kind** is a diagnostic category whose extension and intension are stabilized not primarily by clinical pathology or patient self-conception, but by the incentives and constraints of the bureaucratic systems that process them. **The Administrative Loop** is the mechanism by which the utility of the label for resource allocation alters the behaviour of classifiers, thereby changing the population captured by the label, which in turn revises the clinical definition of the label.

  **Exclusion by Construction:**
  *   It excludes **Fraud/Upcoding**: Fraud implies deception against the system. The Administrative Loop implies the *system* is driving the change, and clinicians are acting within the rules (compliance, not deception).
  *   It excludes **Standard Looping Effects**: Standard looping requires the *classified* to react to the label (identity). Administrative looping requires only the *classifier* to react to the label (utility).

  **Boundary Cases:**

  1.  **Looks like the thing but is not: Intentional Upcoding.**
      *   *Scenario:* A clinician knowingly applies a more severe code to a patient to secure funding, while privately maintaining the patient does not meet criteria.
      *   *Why it's not:* The clinical picture does not drift. The clinician knows the "real" diagnosis. The manual does not change. The kind itself remains stable; only the record is corrupted. This is Goodhart's Law without the ontological shift.

  2.  **Does not look like the thing but is: The Rise of Dyslexia (1980s-90s).**
      *   *Scenario:* Many attribute the rise in Dyslexia diagnoses to better awareness and testing.
      *   *Why it is:* In many jurisdictions, the rise correlated precisely with legislation mandating specific educational accommodations *only* for students with the "Dyslexia" code, not for general "reading difficulties." Clinicians began to interpret borderline reading deficits as Dyslexia to secure help. The *phenotype* of Dyslexia broadened to include children who would previously have been called "slow readers." The children did not identify as "Dyslexic" (often too young); the loop was closed by the school system and the psychologist. This is an Administrative Kind masquerading as increased awareness.

  **Recommendation for your notes:**
  Use **"The Administrative Loop"** to describe the mechanism. It signals familiarity with Hacking ("Looping") while immediately qualifying the agent ("Administrative"). It allows you to acknowledge the Hackingian heritage without accepting the commitment to "subjectification" that bothers you. It is precise enough to exclude mere fraud or semantic drift, and it captures the ontological consequence (the kind changes) that Goodhart's Law misses.
