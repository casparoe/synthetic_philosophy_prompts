      *Does it smuggle probability?* Yes, it relies on the probability that *others* are also reasoning this way. If they aren't, the set fails.
      *Is it Rule Consequentialism?* Essentially, yes.

      *Decision:* I will be direct. The Expressive view changes the subject. The Collective view tries to answer it but relies on a assumption of coordination. And yes, it is very close to Rule Consequentialism. Honesty serves the writer best here.

  8.  **Final Review against constraints:**
