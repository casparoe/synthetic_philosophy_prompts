          3.  The Collective View (The "Rowing Crew").
          4.  Tackling the "Changing the Subject" charge.
          5.  Tackling the "Smuggling Probability" charge.
          6.  Tackling the "Rule Consequentialism" charge.
          7.  Conclusion/Summary for the article.

      *   *Refining the "Smuggling Probability" point:* This is the trickiest. I need to explain that the collective view treats the vote as a *necessary condition* rather than a *sufficient condition*. It's not about the odds of the set succeeding, but the obligation to complete the set. *Correction:* Actually, the Parfit view (Reasons and Persons) is often about "overdetermination" or "imperfect duties." But for a lay audience, the "Bucket Brigade" analogy works best. If the fire burns down because the line broke, did my passing the bucket matter? Yes, because I did my part. The risk isn't "will we win," it's "did I do my part."
      *   *Wait, does it smuggle probability?* If the argument is "My vote matters because it's part of a winning coalition," then yes, you need to know the coalition will win. But if the argument is "My vote matters because it's part of a *democratic process*," then the outcome matters less. I need to distinguish between "Instrumental Collective" (we need to win) and "Principled Collective" (we need to participate). The user is asking about the Parfit-ish view, which is usually about the *difference-making* of sets.
      *   *Key Insight:* The Parfit view argues that in cases where many people act together, the moral math changes. It's not that probability disappears, but that *individual causal impact* is the wrong metric.
      *   *Addressing the Rule Consequentialism point:* Be honest. It *is* a form of consequentialism, but it focuses on the *pattern* of actions rather than the *rule* as an abstraction.

  7.  **Final Polish:** Check against constraints. No jargon ("deontology," "contractualism," "expected utility" is okay since user used it). Keep it punchy. Ensure the distinction between "Expressive" (internal) and "Collective" (external but shared) is crystal clear.

      *(Self-Correction during drafting)*: I need to be careful not to validate the "Collective" view as definitively *correct*, but rather explain its internal logic. The user wants to understand the *difference*, not get a verdict on truth.

      *Refining the "Smuggling Probability" answer:* The user asks: "Doesn't that set only deliver the goods when enough other people join in?"
      *Answer:* Yes. But the defense is that you can't know that in advance, so you must act *as if* your part is needed. Or, more strongly: The value is in the *attempt* to form the set, not the success.
      *Actually, the strongest Parfit-style argument:* It's about "triggering cases." If enough people vote, the result changes. My vote is one of the triggers. I don't need to know *which* vote is the trigger. I just need to know I'm in the group of triggers.
      *Wait, that brings probability back.*
      *Okay, let's look at the "Fairness" angle.* If everyone reasons "my vote doesn't matter," democracy collapses. Therefore, to sustain the system, I must vote. This is the Rule Consequentialist angle.
