  #### Clause 2: Source Dependence (Ambiguity Aversion)
  *   **The Math:** $\pi(p, \text{Known}) > \pi(p, \text{Ambiguous})$. Even if $p$ is numerically identical.
  *   **Log Evidence:**
      *   **Item 6 (Ellsberg):** You prefer known 1/3 (Red) over unknown 1/3 (Black). This establishes $\delta < 1$.
      *   **Item 7 (The "Undefendable" One):** You prefer Red even when the unknown split is resolved by a known random process.
      *   **Cost:** This clause is the most expensive. It violates the **Reduction of Compound Lotteries** axiom. Normatively, if you know the second-order distribution is uniform, the objective chance of Black *is* 1/3. By treating it differently, you are vulnerable to a "Dutch Book" (a set of bets that guarantees a loss).
      *   **Verdict:** This is a psychological reality for you, but it is a logical vulnerability. If you want coherence, this is the verdict to drop.

  #### Clause 3: Reference Dependence (Loss Aversion)
  *   **The Math:** The value of an object depends on whether it is part of your endowment ($r$). Losses loom larger than gains: $v(-x) \approx -\lambda v(x)$ where $\lambda > 1$.
  *   **Log Evidence:**
      *   **Item 8 (Endowment):**
          *   **Buying:** Reference = $0$. You gain Ticket, lose $45. $v(\text{Ticket}) \approx v(45)$.
          *   **Selling:** Reference = Ticket. You lose Ticket, gain $55. $v(55) \approx \lambda v(\text{Ticket})$.
          *   **Implied $\lambda$:** $55 / 45 \approx 1.22$. You feel the loss of the ticket 22% more intensely than the gain of the cash.
      *   **Conflict:** This clause is incompatible with Items 1-7 *unless* you explicitly model the reference point shift. In 1-7, you are a neutral observer. In 8, you are an owner. Your model must include a state variable for "Ownership."

