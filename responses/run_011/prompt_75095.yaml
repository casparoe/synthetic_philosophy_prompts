answer: |-
  ### Part I: The Logical Space

  Before presenting the diagnostic instrument, we must map the terrain. The debate over biological information is not a single disagreement but a tangle of four independent axes. Your position is defined by where you stand on each.

  **The Four Axes**
  1.  **Localization:** Is information a property of the DNA molecule specifically, or of the developing system (DNA + cytoplasm + environment) as a whole?
  2.  **Semantics:** Does the genome possess "meaning" (aboutness) derived from evolutionary function, or is it merely a physical cause correlated with an effect?
  3.  **Ontology:** Is information a real physical property (like mass), or is it an instrumental tool (like "center of gravity") useful for description but not fundamental?
  4.  **Measure:** Is "information" a qualitative concept (instructions, programs) or a quantitative one (bits, Shannon entropy)?

  **The Occupied Positions (The Leaves)**
  *   **The Literal Program:** DNA-specific, Semantic, Real, Qualitative.
  *   **The Derivative Function:** DNA-specific, Semantic, Instrumental, Qualitative.
  *   **The Deflationary Causal:** DNA-specific, No Semantics, Instrumental, Qualitative.
  *   **The Quantitative Unit:** DNA-specific, No Semantics, Real, Quantitative.
  *   **The Distributed System:** System-wide, No Semantics, Instrumental, Qualitative.
  *   **The Dissolver:** Rejects the axes as ill-posed.

  **The Unoccupied Combinations**
  1.  **System-wide + Semantic + Real:** *Diagnosis: Incoherent.* It is difficult to argue that a sprawling, dynamic developmental system has a fixed "meaning" in the same way a text does, while also claiming that meaning is a mind-independent physical property.
  2.  **DNA-specific + Semantic + Real + Quantitative:** *Diagnosis: Unattractive.* This combines the strong claim that DNA has real meaning with the claim that meaning is just bit-counting. Most who argue for real meaning want it to be about *function*, not just capacity.
  3.  **System-wide + Semantic + Instrumental:** *Diagnosis: Unexplored.* One could argue the whole system "interprets" itself usefully, but proponents of systems biology usually drop semantic talk entirely to avoid the baggage of "code."

  ***

  ### Part II: The Diagnostic Tree

  **Instructions:** Read each scenario or claim. Choose the option that best matches your intuition. Follow the branch to the next question number.

  **Q1. The Database Case**
  Consider the exact same nucleotide sequence (A, C, G, T) in two places: stored as text in a public database on a server, and physically instantiated inside a living cell.
  *   **A.** The informational content is identical in both places; the medium doesn't change the message. (Go to Q2)
  *   **B.** The content is present only in the cell; the database is just a record of it. (Go to Q2)
  *   **C.** The question assumes a distinction between "content" and "physical state" that doesn't hold up. (Go to Q8)

  **Q2. The Dismantled Machine**
  Imagine a cell where all cytoplasmic machinery (ribosomes, polymerases) is chemically dismantled, but the DNA remains perfectly intact.
  *   **A.** The instructions are still there, waiting for a machine to read them. (Go to Q3)
  *   **B.** The instructions are gone; without the machinery to interpret them, it is just a molecule. (Go to Q5)

  **Q3. The Synthetic Reassignment**
  Scientists synthesize a genome where the codon triplet "GGC" (which normally codes for Glycine) is reassigned to code for Tryptophan. The organism develops normally using this new rule.
  *   **A.** The instructions have changed because the meaning of the symbols has changed. (Go to Q4)
  *   **B.** The physical sequence is the same, so the information is the same; only the outcome differs. (Go to Q4)

  **Q4. The Perfect Reader**
  If you had a perfect "reader" device and the complete DNA sequence, would that suffice to reconstruct the organism, assuming standard physical laws?
  *   **A.** Yes, the sequence contains the necessary program. (Go to Q6)
  *   **B.** No, the sequence requires context that isn't contained in the text. (Go to Q5)

  **Q5. The Epigenetic Mark**
  A heritable chemical mark on the DNA (methylation) alters the phenotype without changing the base sequence.
  *   **A.** This mark is information in the same sense as the base sequence. (Go to Q7)
  *   **B.** This is a causal influence, but not "information" in the genetic sense. (Go to Q6)

  **Q6. The Explanatory Value**
  Suppose you have a complete causal description of every molecular interaction in development. Does talking about "genetic information" explain anything further?
  *   **A.** Yes, it captures the functional organization that causal talk misses. (Go to Q7)
  *   **B.** No, it is just a shorthand for the causal story. (Go to Q7)

  **Q7. The Unit of Measure**
  When biologists speak of information, are they referring to a measurable quantity (bits of difference) or a qualitative role (instructions/function)?
  *   **A.** Primarily a measurable quantity; the rest is loose talk. (Go to Leaf: **The Quantitative Unit**)
  *   **B.** Primarily a qualitative role; bits don't capture the function. (Go to Q8)

  **Q8. The Coherence Check**
  Looking back at the previous answers: does the distinction between "code" and "cause" seem like a genuine feature of biology, or a confusion imposed by human language?
  *   **A.** It is a genuine feature; biology really does process symbols. (Go to Leaf: **The Literal Program**)
  *   **B.** It is a useful fiction grounded in evolutionary history. (Go to Leaf: **The Derivative Function**)
  *   **C.** It is a confusion; there are only causes. (Go to Leaf: **The Deflationary Causal**)
  *   **D.** The framework itself is the problem; development is not computation. (Go to Leaf: **The Dissolver**)

  *(Note: Branching from Q5 Option A leads to Leaf: **The Distributed System**)*

  ***

  ### Part III: The Key

  **Leaf 1: The Literal Program**
  *   **Path:** Q1(A/B) → Q2(A) → Q3(A) → Q4(A) → Q5(B) → Q6(A) → Q7(B) → Q8(A)
  *   **The View:** The genome literally is a coded program whose semantics is fixed by the cellular machinery that reads it.
  *   **Awkward Commitment:** You must accept that a molecule can possess "meaning" in a mind-independent world, akin to a sentence written in nature.

  **Leaf 2: The Derivative Function**
  *   **Path:** Q1(A/B) → Q2(A) → Q3(A) → Q4(A) → Q5(B) → Q6(A) → Q7(B) → Q8(B)
  *   **The View:** Genetic information is real but derivative, grounded in evolved function rather than intrinsic physics.
  *   **Awkward Commitment:** You must accept that "information" is not fundamental to physics but emerges only when natural selection creates a "purpose."

  **Leaf 3: The Deflationary Causal**
  *   **Path:** Q1(A/B) → Q2(A) → Q3(B) → Q4(A) → Q5(B) → Q6(B) → Q7(B) → Q8(C)
  *   **The View:** Reduces information to measurable difference-making and treats the rest as metaphor.
  *   **Awkward Commitment:** You must explain why biologists cannot simply delete the word "information" from their textbooks without losing explanatory power.

  **Leaf 4: The Quantitative Unit**
  *   **Path:** Q1(A) → Q2(A) → Q3(B) → Q4(A) → Q5(B) → Q6(B) → Q7(A)
  *   **The View:** Takes the term to name a unit (bits) and nothing further; semantics are irrelevant.
  *   **Awkward Commitment:** You must accept that a random DNA sequence has the same "information" as a functional gene if they are equally complex, stripping the word of its biological utility.

  **Leaf 5: The Distributed System**
  *   **Path:** Q1(B) → Q2(B) → Q4(B) → Q5(A)
  *   **The View:** Information belongs to the distributed developmental system with no privileged factor.
  *   **Awkward Commitment:** You must accept that the egg cytoplasm contributes "instructions" in the same categorical sense as the sperm DNA, challenging the central dogma.

  **Leaf 6: The Dissolver**
  *   **Path:** Q1(C) → Q8(D)
  *   **The View:** The question is not well posed; "code" is a category error when applied to chemistry.
  *   **Awkward Commitment:** You must reject the dominant metaphor of modern biology without offering a replacement vocabulary that allows for prediction.

  ***

  ### Part IV: Unseparated Pairs

  **Pair:** *The Deflationary Causal* vs. *The Quantitative Unit*
  **Diagnosis:** The current tree separates these at Q7 (Qualitative Role vs. Measurable Quantity), but in practice, a reader might agree that information is "just bits" (Quantitative) while also believing those bits are "just shorthand for causes" (Deflationary). The distinction between "Real Unit" and "Instrumental Shorthand" is subtle for a layperson.
  **Further Question:** "If we discovered a physical law that conserved 'biological bits' like energy, would you consider information a fundamental constituent of the universe?"
  *   **Yes:** Confirms **The Quantitative Unit** (Ontological Realism).
  *   **No:** Confirms **The Deflationary Causal** (Instrumentalism).

  **Pair:** *The Literal Program* vs. *The Derivative Function*
  **Diagnosis:** Both views treat DNA as privileged and semantic. The tree separates them at Q8 based on whether the semantics are "genuine features" or "useful fictions." This is a dense metaphysical distinction.
  **Further Question:** "If humans went extinct, would the DNA in a seed still contain 'instructions' for a tree, or merely the physical disposition to become one?"
  *   **Instructions:** Confirms **The Literal Program** (Semantics exist without interpreters).
  *   **Disposition:** Confirms **The Derivative Function** (Semantics require an evolutionary context/interpreter).
