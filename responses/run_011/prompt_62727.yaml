answer: |-
  **Research Proposal: Process, Outcome, and the Regress of Supervision**

  **Research Question**
  Is process-based supervision conceptually distinct from outcome-based supervision, or is it merely outcome supervision with the target metric shifted to a higher order?

  In AI alignment and human quality assurance, a standard distinction is drawn between outcome supervision (rewarding the final result) and process supervision (rewarding the steps taken to reach the result). The prevailing view is that process supervision is robust against 'reward hacking', where a system produces a correct answer via flawed reasoning. My project tests the hypothesis that this distinction is structural rather than substantive. I propose that process supervision does not escape the logic of outcome measurement; it simply redefines the 'outcome' as 'the appearance of correct reasoning'. If this is true, it generates a regress problem: if the process is checked by an outcome metric (did the check look right?), who checks the checker? The project asks whether this regress is vicious, and whether the epistemic burden of checking reasoning is necessarily lower than checking results.

  **Background and Context**
  The debate is currently active in AI safety literature. Proponents of process supervision argue that for complex tasks, verifying the chain of thought is more reliable than verifying the answer, particularly when the answer is hard to evaluate. They argue this prevents systems from learning to deceive. Proponents of outcome supervision argue that it is more scalable and directly aligns with human values.

  Both positions assume the two methods are fundamentally different kinds of evaluation. However, neither position adequately addresses the structural similarity between them. In my professional experience managing quality assurance in a call centre, we switched from outcome-based metrics (did the customer's problem resolve?) to process-based metrics (did the agent follow the script?) in 2019. Process scores rose immediately and stayed high. However, the rate of customers calling back about the same issue increased. The system was successfully optimised for the appearance of competence rather than competence itself.

  This suggests that process supervision is vulnerable to the same gaming as outcome supervision, because the 'process' becomes the new 'outcome' for the agent. The literature currently treats the regress worry as a practical implementation hurdle rather than a conceptual flaw. My project treats it as a conceptual problem. If checking the reasoning is harder than checking the answer, process supervision may not solve the verification problem but merely displace it to a less visible layer.

  **Methodology**
  This is a conceptual project, not an empirical one. I will not be running experiments on AI models or call centre agents. Instead, I will use conceptual analysis to map the logical structure of supervision.

  *Term 1: Mapping the Distinction*
  Weeks 1-4: I will formalise the definitions of 'process' and 'outcome' supervision. I need to establish if there is a clear boundary where one ends and the other begins. I will test edge cases: is checking a proof process or outcome? Is checking a code compilation process or outcome?
  Weeks 5-8: I will construct the regress argument formally. If a process is supervised by an outcome (the quality of the check), does this require a further process to supervise that outcome? I will look for existing philosophical treatments of infinite regress in justification to see if they apply here.
  Weeks 9-11: I will draft the core argument: that process supervision is second-order outcome supervision.

  *Term 2: Testing the Limits*
  Weeks 1-4: I will apply this framework to the specific claim that process supervision is 'harder to game'. I will analyse whether 'gaming the process' is actually distinct from 'gaming the outcome', or if it is just a different surface for the same activity.
  Weeks 5-8: I will address the epistemic burden. Under what conditions is checking the reasoning easier than checking the result? If the answer is 'rarely', the practical case for process supervision weakens.
  Weeks 9-11: Final synthesis and writing. I will produce a draft dissertation chapter that argues for the 'shifted metric' view, while fairly representing the counter-argument that the shift is valuable even if it is structurally similar.

  **Justification of Method**
  Colleagues have suggested I run empirical experiments, comparing process and outcome scores in a controlled setting. I have decided against this for two reasons. First, an experiment can show *that* process scores diverge from outcomes, but it cannot show *why*. My claim is about the logical structure of the supervision, not the statistical correlation of scores. Data cannot resolve a definitional regress.

  Second, as a part-time student with a full-time job, a conceptual project is more feasible. Empirical work requires access to models or large datasets and ethical clearance. Conceptual work requires time and clarity. I can control the pace of reading and writing around my work schedule. The risk in a conceptual project is not data collection failure, but argumentative circularity. I will mitigate this by ensuring every claim about the 'structure' of supervision is tested against a concrete example from either AI literature or my professional context. If the concept cannot describe the practice, the concept is wrong.

  **Expected Outcomes and Success Criteria**
  At the end of the project, I will have a 10,000-word dissertation chapter. It will provide a taxonomy of supervision types and a clear argument regarding the regress problem.

  Success looks like this: I can clearly state whether process supervision is a distinct category or a subset of outcome supervision. I will have identified exactly where the regress stops (if it does) or why it is unavoidable. I will have a defensible position on whether the epistemic burden of process checking is justified.

  Failure looks like this: If, during Term 1, I find that the distinction between process and outcome is already robustly defined in a way that blocks my regress argument, the project loses its novelty. If I cannot formalise the 'shifted metric' idea without it collapsing into a triviality (i.e., 'everything is an outcome eventually'), then the hypothesis is too broad to be useful. If I find myself merely asserting that 'process checking is hard' without proving why it is structurally harder than outcome checking, the project will not have met the philosophical standard required.

  **Feasibility**
  I work full-time in quality assurance. I have protected three evenings a week for study. The methodology relies on reading, thinking, and writing, which fits this schedule. I do not need lab access or participant recruitment. The risk is burnout or scope creep. I will manage this by sticking to the two-term schedule above and treating the call centre example as a source of intuition pumps, not as data to be analysed ethnographically. This keeps the workload within the limits of a part-time MA.

  The project is realistic because it leverages my professional background without relying on it for data. It turns my day job into a philosophical resource rather than a case study, allowing me to focus on the argument's logic rather than the logistics of fieldwork.
