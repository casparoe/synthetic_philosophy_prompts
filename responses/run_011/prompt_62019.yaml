answer: |-
  # The Implicature Audit Procedure (IAP)

  **Purpose:** To determine whether a written workplace communication conveys a meaning (directive, threat, or signal) that is not explicitly stated, based on the reasonable inference of the recipient.
  **Time Limit:** 45 Minutes.
  **Inputs:** The Message + One Page of Agreed Background Facts.
  **Output:** Either (1) **No Implicature Found** (Case Dismissed) or (2) **Implicature Supported** (Handed to Panel for Value Judgment).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Literal Baseline
  **Action:** Isolate the explicit propositional content of the message. What facts are asserted? What requests are grammatically explicit?
  **Test:** Can the alleged meaning be found in the dictionary definitions of the words used?
  *   **If Yes:** The meaning is *said*, not *implicated*. Proceed to Panel (as a standard conduct issue).
  *   **If No:** Proceed to Step 2.

  ### Step 2: The Relevance Check (Maxim of Relation)
  **Action:** Compare the Literal Baseline against the Agreed Background Facts. Ask: "If the writer meant *only* what they literally said, why send this message *now*, to *this person*, in *this context*?"
  **Test:** Is the literal information sufficient to explain the timing and audience?
  *   **If Yes (Literal is Sufficient):** The message is likely informational. **Result: No Implicature Found.** (End Case).
  *   **If No (Literal is Insufficient):** The message appears under-informative or oddly timed. The recipient must infer extra meaning to make the message "make sense." Proceed to Step 3.

  ### Step 3: The Cooperative Inference
  **Action:** Assume the writer is adhering to workplace norms of cooperation (being helpful, relevant, and clear). Based *only* on that assumption, what is the single most logical reason for sending the message?
  **Test:** Does the Alleged Meaning bridge the gap identified in Step 2?
  *   **If No:** The Alleged Meaning does not solve the relevance puzzle. **Result: No Implicature Found.** (End Case).
  *   **If Yes:** The Alleged Meaning makes the message coherent. Proceed to Step 4.

  ### Step 4: The Weighted Denial Test (Addressing the Deniability Worry)
  **Action:** Acknowledge that the writer *could* technically deny the Alleged Meaning without contradicting the text (Cancellability). Do not stop there. Assess the **Credibility** of that denial given the power dynamic.
  **Test:** If the writer claimed, "I meant nothing by this," would a reasonable person in the *recipient's* position believe them?
  *   **Constraint:** If the sender holds authority over the recipient, the benefit of the doubt shifts to the recipient. A denial is only credible if there is a plausible, non-coercive alternative explanation (e.g., standard procedure, routine update).
  *   **If Denial is Credible:** **Result: No Implicature Found.** (End Case).
  *   **If Denial is Not Credible:** The ambiguity serves the sender's interest. **Result: Implicature Supported.** (Hand to Panel).

  ---

  ## Part 2: Theory Notes for Analysts

  ### What Must Survive Simplification
  1.  **The Cooperative Principle:** You must assume communication is intended to make sense. If a message makes no sense literally, the recipient is licensed to look for hidden meaning.
  2.  **Context Dependence:** Meaning is not in the text; it is in the text *plus* the situation. You cannot analyze the email without the "One Page of Facts."
  3.  **Calculability:** The implied meaning must be derivable. It cannot be a random guess; it must be the logical bridge that fixes the "Relevance" problem in Step 2.

  ### What Can Be Dropped
  1.  **The Four Maxims (Quantity, Quality, Manner):** Do not analyze these separately. Collapse them into **Step 2 (Relevance)**. In a workplace, most implicatures arise because information is oddly timed or incomplete (Relation/Quantity).
  2.  **Generalized vs. Particularized Implicature:** Do not worry about whether the meaning is universal. Focus only on *this* recipient in *this* context.
  3.  **Logical Cancellability:** Grice teaches that if you can deny an implication without contradiction, it is an implication. **Ignore this for the final ruling.** In a power dynamic, logical cancellability is a weapon, not a test. Use **Step 4 (Weighted Denial)** instead.

  ### Where Analyst "Feel" Intrudes
  You cannot eliminate intuition. It enters at **Step 2 (Relevance)** and **Step 4 (Credibility)**.
  *   **Step 2:** Deciding if a message is "oddly timed" requires a feel for your workplace's rhythm.
  *   **Step 4:** Deciding if a denial is "credible" requires a feel for power dynamics.
  *   **Mitigation:** Document *why* the timing is odd or the denial is incredible using the Agreed Facts. If you cannot point to a fact, you are guessing. Stop and hand to Panel.

  ---

  ## Part 3: Addressing the Deniability Worry

  **The Worry:** A test that treats the availability of an unproblematic denial as evidence against an implied meaning will clear deliberate offenders who write ambiguously on purpose.

  **The Procedure's Solution:**
  Standard Gricean theory treats *cancellability* (the ability to deny) as a defining feature of implicature. If you can say "I didn't mean that" without contradicting yourself, Grice says the meaning was merely implicated, not said. In a legalistic or HR context, this allows bad actors to hide behind technicalities.

  The IAP modifies this in **Step 4**. We distinguish between **Logical Cancellability** (Can I say it?) and **Pragmatic Credibility** (Will I be believed?).
  *   A deliberate offender relies on Logical Cancellability.
  *   The IAP tests Pragmatic Credibility.
  *   **Rule:** If the ambiguity benefits the sender (e.g., allows them to coerce while maintaining deniability), the denial is deemed **Not Credible** regardless of logical possibility. The procedure assumes that in a power imbalance, strategic ambiguity is a form of communication, not a lack thereof.

  ---

  ## Part 4: Case Applications

  ### Case (a): The VP Email
  *Message:* "Just so you're aware, the VP has been asking who is closest to this file."
  *Context:* Night before subordinate must approve vendor contract.
  *Alleged:* Instruction to approve + offer of credit.

  1.  **Literal Baseline:** The VP is asking a question. No instruction to approve is present.
  2.  **Relevance Check:** Why tell the subordinate this the night before a decision? Literal information alone does not explain the urgency or the specific timing. It is insufficient. (Proceed).
  3.  **Cooperative Inference:** If the manager is being helpful/relevant, they are signaling that approval links the subordinate to the file, satisfying the VP. This bridges the gap. (Proceed).
  4.  **Weighted Denial:** Can the manager deny? Logically, yes ("I was just updating you"). Credibly? No. The timing creates pressure. The ambiguity benefits the manager (pressure without order). Denial is not credible.
  *   **Result:** **Implicature Supported.** Hand to Panel.

  ### Case (b): The Recruitment Dinner
  *Message:* "I imagine you'd find this town very quiet after the city."
  *Context:* Department head to leading candidate.
  *Alleged:* Coded signal candidate will not fit in.

  1.  **Literal Baseline:** Observation about noise levels/geography.
  2.  **Relevance Check:** Why mention this at a recruitment dinner? It could be small talk (sufficient) OR a test of reaction (insufficient). It is ambiguous whether the literal meaning explains the choice of topic. (Proceed).
  3.  **Cooperative Inference:** Does the alleged meaning ("you won't fit") make the message coherent? Yes, it frames the candidate as an outsider. However, "You might get bored" is also a cooperative inference. There are two equally strong inferences.
  4.  **Weighted Denial:** Can the head deny? Yes ("Just making conversation"). Is it credible? Yes. Social chit-chat is a standard norm at dinners. There is no clear power leverage being exercised *in this moment* to force a specific action.
  *   **Result:** **Indeterminate.** The Relevance Check failed to isolate a single necessary inference. Hand to Panel as a matter of institutional values (what counts as "coding" in recruitment).

  ### Case (c): The Record Compilation
  *Message:* "For your information, I've been asked to compile a record of the interactions connected to this matter, and the ones involving you are included in it."
  *Context:* Supervisor to employee who just filed a complaint.
  *Alleged:* Threat of surveillance and retaliation.

  1.  **Literal Baseline:** A record is being compiled; the employee's interactions are part of it. This is factually true in almost all grievance procedures.
  2.  **Relevance Check:** Why send this? To ensure procedural transparency. The literal information *is* sufficient to explain the message. It fulfills a standard administrative duty.
  3.  **Cooperative Inference:** Because Step 2 was satisfied (Literal is Sufficient), we do not need to infer extra meaning to make the message make sense. The message makes perfect sense as a routine compliance update.
  4.  **Weighted Denial:** (Not strictly reached, but for clarity): If the supervisor denied a threat ("It's standard HR protocol"), the denial is highly credible because it aligns with institutional norms.
  *   **Result:** **No Implicature Found.** Case Dismissed.
  *   **Note:** The clearing happens at **Step 2**. The message does not violate the Maxim of Quantity or Relation; it is literally informative and relevant to procedure. The "threat" is not in the *message's implication*, but potentially in the *context of retaliation*. This procedure tests the message, not the history. If the retaliation is real, it must be proven by actions, not this text.

  ---

  ## Part 5: Limits of the Procedure

  **1. The "Clean Hands" Misfire**
  This procedure will fail to catch a sophisticated offender who sends a literally meaningful, procedurally standard message (like Case C) with malicious intent. The IAP tests *what the text conveys*, not *what the writer intended*. If a manager intends to threaten but writes a perfect compliance email, the IAP will clear the message. This is not a bug; it is a boundary. You cannot adjudicate mind-reading.

  **2. Institutional Indeterminacy**
  In cases like (b), where social norms (small talk) and power signals (coding) overlap, the procedure will output "Hand to Panel." It cannot distinguish between rudeness and coercion without a value judgment on what constitutes "appropriate" recruitment conversation. That is a policy question, not a linguistic one.

  **3. The "Shared History" Blind Spot**
  The IAP relies on "One Page of Agreed Facts." If the implication relies on a shared history not captured in those facts (e.g., a private joke, a prior verbal warning), the Relevance Check will fail. The procedure will clear the writer because the *analyst* cannot see the relevance. This requires a better intake form, not a better test.

  **4. What It Cannot Settle**
  The IAP cannot settle whether an implied directive is *unlawful* or *unethical*. It only settles whether the directive was *conveyed*. Whether a "hint" to approve a contract is harassment, mismanagement, or standard leadership is a matter for the Panel. The IAP hands them the finding: "Yes, a directive was conveyed." The Panel decides: "And that was wrong."
