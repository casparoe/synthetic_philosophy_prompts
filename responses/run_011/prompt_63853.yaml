answer: |-
  Dave's chronological revision is almost certainly false, but labeling it pseudohistory rather than merely erroneous history relies on demarcation criteria that collapse under scrutiny.

  Your headache is understandable because you are encountering the gap between the textbook philosophy of science and the messy reality of historical inquiry. You want a rule that says Dave is out of bounds, but the rules you have been taught are designed to protect inquiry, not police it. To see why Dave occupies a legitimate, if precarious, position within scientific discourse rather than outside it, we must examine the criteria you are using to judge him and show why they fail to exclude him without also excluding respectable work.

  Consider first the criterion of falsifiability. A theory is often deemed pseudoscientific if it is constructed so that no possible observation could count against it. Dave passes this test easily. He has offered specific stratigraphic predictions, and he acknowledges when data conflicts with his model. The fact that he is likely wrong about the outcome does not make the method pseudoscientific; most scientific hypotheses are wrong. The mere act of sticking to a falsifiable claim, even a bold and improbable one, places him within the Popperian fold. He is not retreating into mystery or claiming the evidence is invisible to the uninitiated; he is claiming the evidence is misinterpreted. That is the bread and butter of normal archaeology.

  The harder test is the Lakatosian criterion regarding ad hoc modifications. The criterion states that a research programme is degenerating, and thus scientifically suspect, if it protects its core theory from falsification solely by adding auxiliary hypotheses that generate no new predictions. You reached for this label when Dave explained away the missing destruction layer by claiming the site was misidentified. This looks like a classic immunizing strategy. However, applying this criterion rigidly fails to distinguish between a degenerating programme and a normal scientific correction. In legitimate science, anomalies are frequently resolved by questioning the data rather than the theory. When Uranus's orbit disagreed with Newtonian mechanics, scientists did not abandon gravity; they hypothesized an unseen planet, Neptune, which was an auxiliary claim that saved the core theory. Claiming a site is misidentified is archaeologically analogous to claiming an instrument was miscalibrated. It is only pseudoscientific if the researcher refuses to independently verify the auxiliary claim. If Dave returns to the site, re-excavates, or produces new stratigraphic proof of the misidentification, his move was a legitimate correction. If he simply asserts it forever without new evidence, he degenerates. He is currently in the probationary period where science allows a theorist to troubleshoot data before abandoning the hypothesis. To exile him now is to demand that every anomaly kills a theory immediately, which would have destroyed plate tectonics and quantum mechanics in their infancy.

  The second hard point is the radiocarbon calibration. You note that his claim about tree-ring sequences being dependent on historical chronology is factually wrong, as dendrochronology relies on cross-matching ring patterns independent of historical dates. The criterion here is that scientific theories cannot rest on circular reasoning or factual howlers about evidence independence. However, a theory can be methodologically scientific even if its empirical premises are false. Dave's argument is not that radiocarbon is magic, but that the calibration curve is contaminated. This is an empirical claim about the construction of the curve, not a rejection of physics. If he is wrong about the tree rings, he loses on the evidence, not on the method. Pseudoscience is characterized by a refusal to engage with the evidentiary standards of the field, not by losing the argument within those standards. Many respected scientists have built programmes on data that turned out to be flawed or misinterpreted; they were mistaken, not pseudoscientists. Dave is challenging the independence of a dataset. That is a valid scientific move, even if the specific challenge fails upon inspection. To call it pseudohistory because the premise is false is to confuse truth with scientific status. If factual error equated to pseudoscience, the majority of past scientific literature would be pseudoscientific.

  Finally, consider his sociological claim that professionals defend chronologies built into their careers. The criterion is that conspiracy theories are markers of pseudoscience. Yet, the sociology of knowledge teaches us that professional inertia is real. Kuhn demonstrated that paradigms are defended by communities until the anomalies become overwhelming. Dave is not alleging a secret cabal meeting in a basement; he is alleging institutional inertia and confirmation bias. This is a standard, testable sociological hypothesis about the field, not an untestable conspiracy. It may be cynical, but it is not pseudoscientific.

  So you are left with the question of whether there is anything left that separates Dave from the ancient-aliens people, or whether you have to admit there isn't. There is a distinction, and it lies in the mechanism of explanation. The ancient-aliens hypothesis invokes agents and technologies outside the known laws of physics and history to explain gaps in the record, rendering the evidence untestable by definition because the capabilities of the agents are unlimited. Dave invokes only standard human mechanisms—war, migration, trade, and dating errors—operating within known physical laws. He is playing the same game as you are, arguing over the interpretation of pottery, stratigraphy, and text, whereas the aliens crowd changes the game entirely. Dave is a player making a bad bet on the board; the aliens crowd denies the board exists. You can reject his hand without accusing him of cheating, because he is at least holding cards.
