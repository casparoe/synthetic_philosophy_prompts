prompt: |-
  I've just come off a five hour arguement with my friend Dave and my head is spinning, so I want a second opinion from someone who isn't either of us. I'm doing an archaeology MA; Dave is a structural engineer who reads about ancient history the way other people read about football, and he has a sixty-slide deck plus a domain name registered for his theory. The theory: the whole Late Bronze Age collapse package — the destruction layers around the eastern Med, the Sea Peoples reliefs on the walls at Medinet Habu, the palace-economy endings, all of it — is dated about five centuries too early. He reckons the destructions are really somewhere around 700 BCE, that the Egyptian reliefs have been read backwards through a chronology that was assumed in the first place, that the ships and helmets in the carvings match Aegean depictions everyone agrees are much later, and that the radiocarbon dates don't rescue anything because the calibration curve is built out of tree-ring sequences that where themselves matched to the historical chronology. Which sounds circular enough to make me want to scream, except he also made one prediction that came off: he said a particular kind of coastal site would turn out to have its destruction horizon stratigraphically above a pottery type nobody expected above it, and a couple of years later a report came out that looked a lot like that. Not a smoking gun, but not nothing. When his second prediction failed — a destruction layer that should have appeared at his revised date and didn't — he said the site had been misidentified in the original publication, and that's the moment I reached for the word ad hoc. So far the professional response to him has been two blog posts calling him a crank and zero engagement with the ship-typology point, which he brings up roughly every twenty minutes.

  Here's the part that's got me. Every demarcation move I've been taught either doesn't touch his theory or touches far too much. It's falsifiable — he's already had a prediction fail. It's bold. It engages with actual data instead of retreating into mystery, and it explains several things at once rather than one thing at a time. I want to call it a degenerating research programme propped up by face-saving auxiliaries, except plenty of respectable work has been rescued by auxiliaries and gone on to be fine, and a successful novel prediction is supposed to be exactly the marker of a progressive shift — which he has one of. The whole extraordinary claims need extraordinary evidence thing isn't a criterion, it's a vibe with good PR. And the conspiracy angle cuts against me rather than for me, since his core sociological claim is that a professional community is defending a chronology its members' careers are built on, which is at least occasionally true of professional communities. So: argue his side for me. Make the case that Dave's theory is not pseudohistory in any sense that does justificatory work — that it's an ordinary, if eccentric and probably false, historical hypothesis, and that the Popper-and-Lakatos vocabulary I keep throwing at him is doing no real work here at all. Steelman it properly, the version that would survive a philosopher of science who is already annoyed at you before reading the first paragraph.

  Ground rules. No references, no reading list, no bibliography — I don't want you guessing at sources, I just want the argument. Lay out each criterion before you show it failing, so I can check you're not knocking down a weak version of it. Take the two hardest things for your side head on rather than around: (1) the failed prediction followed immediately by the misidentification excuse, and (2) the fact that his circularity charge about the calibration curve looks to me like it's just factually wrong, since you can count and cross-match tree rings without knowing a single king list — if that's right, explain why a theory can be legitimately scientific and still rest on a factual howler. If you think the thesis is false, say so in one sentence at the top and then argue it anyway, as hard as you can. Then close with a single paragraph answering the question I actually can't settle: whether there's anything left that separates Dave from the ancient-aliens people, or whether I have to admit there isn't. Prose, a couple of pages max, and please no bullet-point avalanche.
