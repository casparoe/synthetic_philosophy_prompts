answer: |-
  The Wikipedia content regime operates on a specific, reconstructed epistemology that can be identified as **Institutional Social Reliabilism**. This view holds that justification is not a property of an individual's relation to evidence, but a status conferred by social and institutional processes. Under this reconstruction, the site's policies function as follows:

  **1. Justification, Testimony, and Consensus**
  The regime presupposes a **Hardwig-style epistemic dependence**, where the individual editor is structurally incompetent to assess primary evidence directly. The prohibition on Original Research (NOR) is not merely a rule against copyright infringement or synthesis; it is an epistemic barrier asserting that knowledge claims require a division of cognitive labor where the "expert" (the source) validates the data and the "non-expert" (the editor) validates the source. Justification is thus **proxy-based**: a claim is justified if it has passed through a vetted institutional channel (peer review, editorial fact-checking), regardless of the raw evidential weight an individual might assign to a leaked document or memoir.

  Regarding testimony, the regime adopts a **Humean discounting mechanism**, but applied institutionally rather than individually. Just as Hume argued we should weigh testimony against the uniformity of experience, Wikipedia weighs testimony against the consensus of reliable sources. However, the "uniformity of experience" is replaced by the "consensus of the credentialed community." Consequently, the relation between consensus and truth is **pragmatically realist**: the regime does not claim consensus *constitutes* truth, but it operates on the axiom that institutional consensus is the only reliable *tracker* of truth available for a crowdsourced project. To treat consensus as fallible in real-time would paralyze the editing process; thus, consensus is treated as provisionally authoritative.

  **2. Strict Presupposition vs. Compatibility**
  The practice **strictly presupposes** that institutional standing is a necessary condition for knowledge inclusion. Without this, Verifiability and NOR collapse, as editors would be forced to evaluate primary evidence (leaks, raw data) themselves. This rules out **Radical Individualist Evidentialism**, the view that a competent reader can weigh primary evidence for herself. The regime also rules out the view that institutional consensus is itself a thing needing justification *within the article space*; the consensus of sources is the bedrock, not a claim to be debated.

  The practice is merely **compatible** with a **Pragmatic/Prudential** defense (i.e., "we do this to avoid lawsuits or vandalism"). While these benefits exist, they do not explain the specific structure of the Fringe Theories guideline, which makes epistemic distinctions (mainstream vs. fringe) rather than legal ones. It is also compatible with **Humean Skepticism** regarding the antecedent improbability of conspiracies, but this is not required; the system would function the same way if it treated conspiracy theories as probable but still required institutional uptake for inclusion.

  **3. Content vs. Uptake Criterion**
  The operative criterion for treating a belief as a "conspiracy theory" (or fringe) is **Uptake-based and Provenance-based**, not Content-based. A claim about secret coordination is not rejected because it posits secrecy (content), but because it lacks endorsement from credentialed institutions (uptake). This is evidenced by the "alternative theoretical formulations" exception: continental drift was accepted not because its evidence was initially stronger than conspiracy claims, but because it was advanced *by* geologists *to* geologists.

  This commits the practice to the acknowledgment that **true conspiracy theories are epistemically invisible while live**. The regime admits no mechanism for distinguishing a true covert program from a false one prior to institutional validation (e.g., a government admission or a congressional report). The retro-vindication asymmetry you noted (Tuskegee/COINTELPRO are valid now, but would have been fringe then) is not a contradiction the practice cannot acknowledge; it is a **feature of the epistemic lag** inherent to Institutional Social Reliabilism. The regime treats the *status* of the claim as changing when the *institutional consensus* changes, not when the *facts* change. It cannot operate otherwise because it has no access to the facts independent of the sources.

  **4. Rival Views and Underdetermination**
  The regime quietly rules out **Strong Realism** in the editing space (the idea that editors should represent the truth regardless of publication status) and **Epistemic Individualism**. However, there is genuine **underdetermination** regarding the definition of "Reliable Source." The current hierarchy (academic > journalistic > self-published) could be justified by Social Reliabilism (process reliability) or by a **Liability Model** (risk management). Both theories license the same edits but imply different reasons for rejecting a leak: one says the leak is unjustified knowledge, the other says the leak is a legal or reputational risk.

  **5. Implications of a Content-Based Criterion**
  If the uptake criterion were replaced by a **Content-Based Criterion** (where claims are judged on the structure of evidence, e.g., "does this leaked document plausibly indicate coordination?"), the following changes would be required:
  *   **Policy Rewrites:** NOR would need to be amended to allow editors to synthesize primary documents to establish "covert coordination" without a secondary source explicitly stating the conspiracy exists. Verifiability would need to accept declassified or leaked documents as self-validating if they meet internal consistency checks.
  *   **Dispute Outcomes:** Live claims about ongoing covert programs (e.g., specific surveillance operations not yet admitted) would be treated as valid hypotheses rather than fringe theories, provided the leaked evidence was robust. Articles would shift from reporting "X alleged Y" to "Evidence suggests Y."
  *   **Cost:** The cost would be a massive inflation of false positives. Without the institutional filter, the encyclopedia would become a repository for every plausible-sounding allegation supported by cherry-picked documents. The reference utility would collapse because the signal-to-noise ratio would depend on individual editor competence rather than institutional vetting. The regime chooses to err on the side of excluding true live claims to avoid including false ones, a trade-off inherent to its reliance on uptake.

  Verdict: PRESUPPOSED — The regime cannot function without the assumption that institutional consensus tracks justification better than individual assessment of primary evidence.
