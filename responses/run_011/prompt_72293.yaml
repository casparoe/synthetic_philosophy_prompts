  2.  **Deconstruct the Wikipedia Regime (Epistemological Analysis):**
      *   *Verifiability (V):* Truth is replaced by verifiability. "Article content is determined by published information." This shifts epistemic authority from the editor to the source.
      *   *No Original Research (NOR):* Editors cannot synthesize. This forbids individual reasoning from primary data. It enforces epistemic dependence.
      *   *Neutral Point of View (NPOV):* Proportionality based on prominence in reliable sources. Consensus in sources dictates weight.
      *   *Fringe Theories:* Defines fringe by departure from mainstream views (scholarly opinion). Conspiracy theories are paradigm cases.
      *   *Reliability:* Graded by institutional process (peer review, fact-checking).

      *   *Epistemological Classification:* This looks strongly like **Social Reliabilism** combined with **Epistemic Dependence** (Hardwig). The reliability of a belief depends on the reliability of the social process producing it, not the individual's access to evidence. It is also **Credentialist/Institutionalist**: The standing of the source matters more than the raw data.
      *   *Consensus/Truth:* The regime doesn't claim consensus *is* truth, but consensus *tracks* truth sufficiently for the purpose of a reference work. It treats institutional consensus as a proxy for justification.

  3.  **Address the Two Puzzles:**
      *   *Puzzle 1 (The Exception):* Why are continental drift/Troy allowed but conspiracy theories aren't, even if both lacked mechanism/evidence initially?
          *   *Answer:* Provenance. The former came from within the credentialed community (scientists/historians); the latter come from outside. The regime trusts the *institution* more than the *argument*.
      *   *Puzzle 2 (The Asymmetry):* Why are leaks/memoirs bad for live claims but good for past claims?
          *   *Answer:* Retrospective institutional validation. Once the state admits COINTELPRO, the memoirs become "verified" by the institutional admission. Before that, they are "allegations." The regime requires the *institutional stamp* to convert testimony into "reliable source" material. It cannot operate on "live" leaks because there is no consensus yet to validate the leak's reliability.

  4.  **Strict Presupposition vs. Compatibility:**
      *   *Presupposed:* The regime *must* assume that institutional process correlates with truth (Social Reliabilism). It *must* assume editors are not competent to evaluate primary evidence directly (Anti-Individualist Evidentialism). It *must* treat "significance" as a function of uptake (NPOV weight).
      *   *Compatible:* It is compatible with Humean skepticism (miracles/conspiracies are improbable), but not strictly required. It's compatible with Pragmatism (avoiding liability), but the rules are framed epistemically.

  5.  **Content vs. Uptake Criterion:**
      *   *Current State:* It is **Uptake/Provenance-based**. A claim is a "fringe conspiracy theory" not because it posits secret coordination (many true things do), but because credentialed institutions haven't adopted it.
      *   *Commitment:* This commits the practice to the possibility that true conspiracy theories exist but must remain unlabeled or excluded until institutional uptake occurs.
      *   *Asymmetry:* The retro-vindication is a feature, not a bug, in this view. It acknowledges the regime cannot distinguish true live conspiracies from false ones, so it waits for the "all-clear" from authority.
      *   *Rival Views Ruled Out:* Radical Individualist Evidentialism (I can read the document and decide), Skeptical Invariantism (all conspiracy claims are false), Strong Realism (truth is independent of publication).

