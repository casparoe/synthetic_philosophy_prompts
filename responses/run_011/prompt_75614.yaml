answer: |-
  # Diagnostic Instrument: Moral Development and Human Material

  ## Part 1: The Logical Space (Branch Axes)

  This tree is built on metaphysical and practical commitments, not moral valuations. The "Good/Bad" labels are outputs, not inputs.

  **Axis 1: The Definition of "Nature" (The First Split)**
  *Claim:* What do we mean when we say "human nature"?
  *   **Branch A (Fixed Given):** Nature is everything one is born with and cannot help (e.g., hunger, eyesight, immediate desires). It is static raw material.
  *   **Branch B (Growing Tendency):** Nature is the characteristic direction a human being develops in under favorable conditions (e.g., an acorn's path to an oak). It is dynamic and teleological.
  *   **Branch C (Neutral Plasticity):** Nature is raw capacity with no direction built in (e.g., water flowing east or west). It is indeterminate potential.

  **Axis 2: The Source of Moral Order**
  *Claim:* Where does the standard for right behavior originate?
  *   **Branch A (Endogenous):** The resources for morality are already present within the person (seeds, feelings).
  *   **Branch B (Exogenous):** The resources for morality must be brought in from outside (teachers, rules, models).

  **Axis 3: The Metaphor of Cultivation**
  *Claim:* How does moral improvement happen?
  *   **Branch A (Gardening):** Cultivation extends, nourishes, and protects what is already growing.
  *   **Branch B (Crafting):** Cultivation restrains, straightens, and remakes the raw material into a new shape.
  *   **Branch C (Subtraction):** Cultivation removes artificial impositions to reveal what was obscured.

  **Axis 4: The Origin of Norms and Ritual**
  *Claim:* Did the ancient sages discover or invent the rules of society?
  *   **Branch A (Discovery):** Sages recognized a pattern already inherent in the world or human heart.
  *   **Branch B (Invention):** Sages created artifacts to fix a chaotic situation that had no prior order.

  **Axis 5: Uniformity of Potential**
  *Claim:* Do all people share the same capacity for moral perfection?
  *   **Branch A (Universal):** Anyone can become a sage; differences are due to effort or environment.
  *   **Branch B (Graded):** Natures differ in kind; teaching reaches only some, while others are fixed.
  *   **Branch C (Irrelevant):** The question is moot; only behavior matters, not inner transformation.

  *(Note: I have not added further axes. Five axes generate 3 × 2 × 3 × 2 × 3 = 108 logical cells, which is sufficient density for this period's thought without becoming unmanageable for a 30-minute session.)*

  ---

  ## Part 2: Diagnostic Items

  *Instructions for Students: Read each short situation. Choose the answer that best matches your intuition about how the world *is*, not how you wish it to be. Do not worry about technical terms.*

  **1. The Crying Infant**
  A baby cries when it sees another toddler fall and hurt themselves. Is this reaction:
  *   (A) A reflex like hunger, seeking comfort for itself.
  *   (B) The first sign of a care that will grow if protected.
  *   (C) A random reaction that could just as easily be laughter.

  **2. The Hungry Apprentice**
  A young apprentice is starving. They steal food. Later, they are fed and educated, and stop stealing. Why did they stop?
  *   (A) Their natural desire for fairness finally had room to grow.
  *   (B) They were taught that stealing brings shame and disorder.
  *   (C) They were trained to suppress the hunger-driven impulse.

  **3. The Gardener and the Carpenter**
  To make a person good, a teacher is most like:
  *   (A) A gardener watering a plant that wants to grow.
  *   (B) A carpenter straightening warped wood with heat and pressure.
  *   (C) A sculptor chipping away stone to find the shape inside.

  **4. The Origin of Rules**
  Why do we have rules about greeting elders and sharing food?
  *   (A) Because these actions naturally feel right to a calm human heart.
  *   (B) Because wise leaders made them up to stop people from fighting.
  *   (C) Because these rules are useful tools to manage behavior.

  **5. The Unexplainable Good Deed**
  Someone saves a stranger from a fire but cannot explain why they did it. They just acted.
  *   (A) This is the best kind of goodness; it flowed from their nature.
  *   (B) This is dangerous; action should follow conscious reasoning and training.
  *   (C) This is irrelevant; only the fact that the stranger was saved matters.

  **6. The Default State**
  If you leave a group of children alone on an island with plenty of food and no adults, what happens?
  *   (A) They eventually cooperate and care for one another.
  *   (B) They fight over the best toys and sleeping spots.
  *   (C) They do whatever happens to occur to them; no pattern emerges.

  **7. The Punishment Policy**
  A government wants to reduce crime. What works best?
  *   (A) Teaching people to feel shame when they do wrong.
  *   (B) Making sure punishment is certain and severe.
  *   (C) Removing the laws that create the concept of "crime."

  **8. The Sage's Achievement**
  Can a person born into a criminal family become a perfectly wise moral leader?
  *   (A) Yes, everyone has the same seed of wisdom.
  *   (B) Yes, but only through immense artificial effort and study.
  *   (C) No, some people are born with materials that cannot be perfected.

  **9. Learning and Loss**
  As a person learns more rules and social distinctions, they become:
  *   (A) More fully human and complete.
  *   (B) More useful to society but less spontaneous.
  *   (C) More confused and distant from their true self.

  **10. The Difference Between People**
  Why is one person kind and another cruel?
  *   (A) They nurtured or neglected the same inner beginnings.
  *   (B) They were shaped by different external environments and teachers.
  *   (C) They are fundamentally different kinds of beings.

  ---

  ## Part 3: Scoring Key and Leaf Mapping

  *Instructions for Instructor: Tally the responses. Patterns will cluster around the following "Leaves." Do not expect perfect consistency; look for the dominant trend.*

  ### The Leaves

  **1. The Sprout View (Mencius)**
  *   **Pattern:** 1B, 2A, 3A, 4A, 5A, 6A, 7A, 8A, 9A, 10A.
  *   **Core:** Nature is a growing tendency; virtue is internal extension.
  *   **Awkward Commitment:** Must explain why evil exists if the seeds are universal and good.

  **2. The Deliberate-Activity View (Xunzi)**
  *   **Pattern:** 1A, 2B/C, 3B, 4B, 5B (on effort), 6B, 7A, 8B, 9A, 10B.
  *   **Core:** Nature is fixed/raw; virtue is external accumulation and remaking.
  *   **Awkward Commitment:** Must explain why we bother being good if goodness is entirely unnatural.

  **3. The Indifference View (Gaozi)**
  *   **Pattern:** 1C, 2C, 3B (Willow) or 3C (Water), 4B, 6C, 10C.
  *   **Core:** Nature is neutral plasticity; direction is imposed from outside.
  *   **Awkward Commitment:** Must explain where the standard for "right" comes from if nature provides no direction.
  *   *Note:* If a student mixes "Water" (1C, 6C) and "Willow" (3B), they are capturing the tension in the original text. Treat this as a valid Gaozi profile.

  **4. The Mixed View (Han Synthesis)**
  *   **Pattern:** Mixed A/B on 1, 2, 6. Often 10A/B hybrid.
  *   **Core:** Everyone contains both good and bad strands; cultivation decides which wins.
  *   **Awkward Commitment:** Must explain how to tell which strand is winning in a specific moment.

  **5. The Graded View (Dong Zhongshu / Han Yu)**
  *   **Pattern:** 8C, 10C. Often 5B (on capacity).
  *   **Core:** Natures differ in kind; teaching reaches only some.
  *   **Awkward Commitment:** Must justify giving up on the moral transformation of some people.

  **6. The Legalist Position**
  *   **Pattern:** 5C, 7B, 8C/B, 4B.
  *   **Core:** Moral sentiment is irrelevant; incentives and laws control behavior.
  *   **Awkward Commitment:** Must accept that moral sentiment is irrelevant even for the ruler.

  **7. The Subtraction View (Daoist-leaning)**
  *   **Pattern:** 3C, 7C, 9C, 4A (but anti-rule).
  *   **Core:** Inborn spontaneity is adequate; norms ruin it.
  *   **Awkward Commitment:** Must accept that civilization causes suffering.

  **8. The Underdetermined Start (Confucius)**
  *   **Pattern:** 10B ("Practices carry them apart"), vague on 1 and 2.
  *   **Core:** Natures are near alike; practice is what matters. Theory is secondary.
  *   **Awkward Commitment:** Must accept theoretical vagueness about the source of the practice.

  ### Handling Inconsistencies

  *   **Incomplete Patterns:** If a student answers only 5 items, map them to the leaf sharing the most matches. If the split is 3 vs 2, assign the "Nearest Leaf" but flag as "Provisional."
  *   **Internal Inconsistencies (Philosophically Interesting):**
      *   *Case:* Believes Nature is Bad (Item 6B) but Cultivation is Gardening (Item 3A).
      *   *Diagnosis:* This is not a scoring error; it is the "Pessimistic Gardener" problem. It suggests a view where we nurture the *capacity to restrain* rather than virtue itself. Map to **Deliberate-Activity**, but note the tension.
      *   *Case:* Believes Norms are Invented (Item 4B) but Source is Internal (Item 2A).
      *   *Diagnosis:* This suggests norms are external expressions of internal feelings. Map to **Sprout View**, noting a sophisticated reading of ritual.
  *   **Internal Inconsistencies (Scoring Errors):**
      *   *Case:* Item 8C (Some can't be sages) AND Item 5A (Anyone can become wise).
      *   *Diagnosis:* Logical contradiction on potential. Ask the student to clarify Item 8. If they hold firm, map to **Graded View** (Item 8 is usually the stronger commitment).

  ### Empty Cells (Unoccupied Logical Space)

  1.  **Nature Bad + Untransformable:** (Axis 1A + Axis 5 "No").
      *   *Diagnosis:* **Fatalism.** Incoherent for this period because it makes teaching pointless. Foreclosed by the shared assumption that sage-teaching exists. Live today in some biological determinisms.
  2.  **Nature Good + No Cultivation Needed:** (Axis 1B + Axis 3 "None").
      *   *Diagnosis:* **Anarchism.** Merely unattractive to these thinkers because it ignores social chaos. Live today in radical unschooling movements.
  3.  **Norms Invented + Nature Indifferent + Internal Norms:** (Axis 4B + Axis 1C + Axis 2A).
      *   *Diagnosis:* **Contradiction.** If norms are invented and nature is indifferent, they cannot be internal. Incoherent.

  ---

  ## Part 4: Limits of the Instrument

  **1. The Mencius/Xunzi Problem**
  *   **Issue:** Both thinkers agree that *anyone can become a sage* (Item 8). This instrument cannot separate them based on the *goal* or *potential*.
  *   **Separator:** The separation depends almost entirely on **Axis 1 (Definition of Nature)** and **Item 3 (Metaphor of Cultivation)**.
      *   If a student chooses 1B (Tendency) and 3A (Gardening), they are in the Mencius camp.
      *   If a student chooses 1A (Fixed) and 3B (Crafting), they are in the Xunzi camp.
  *   **Honesty:** This is not ten independent measurements. Items 1 and 3 do 80% of the work distinguishing these two. Items 4 and 6 support, but if a student mixes them (e.g., Nature is Fixed, but Norms are Discovered), they fall into a "Syncretic" gap not fully covered by the leaves.

  **2. The Gaozi Tension**
  *   **Issue:** Gaozi's "Water" analogy implies indifference (Axis 1C), but his "Willow" analogy implies raw material for artifacts (Axis 1A/3B).
  *   **Limit:** The instrument treats these as one leaf. A student who strongly distinguishes them will score as "Inconsistent."
  *   **Guidance:** Treat this inconsistency as a successful reading of the text's ambiguity rather than a student error.

  **3. Confucius's Vagueness**
  *   **Issue:** Confucius's "Natures are near alike" (Item 10B) is compatible with both Sprout and Deliberate views.
  *   **Limit:** This leaf is a "residual category." It captures students who refuse to metaphysically commit. It cannot reliably separate Confucius from a pragmatic Mencian or Xunzian.

  **4. Contested Readings**
  *   **Issue:** Xunzi's definition of *nature* (Axis 1). Some scholars argue Xunzi sees nature as having a *direction* (toward chaos), which looks like Axis 1B but negative.
  *   **Limit:** If a student argues "Nature has a direction, but it's bad," they may score as Mencius (Axis 1B) but Xunzi (Item 6B).
  *   **Guidance:** Prioritize Item 3 (Metaphor). If they say "Straightening Wood," they are Xunzian, regardless of Axis 1.

  ---

  ## Part 5: Epistemic Note on the Design

  **Least Confidence: The Gaozi Leaf**
  I am least confident in the stability of the "Indifference View" leaf. Gaozi is a foil in the *Mencius*, and his positions may be caricatured. A specialist might dispute whether "Water" and "Willow" belong on the same leaf at all. I have grouped them because they share the commitment that *morality is external*, but the metaphysical basis differs (indeterminacy vs. malleability). If students consistently split these, the "Indifference" leaf should be merged into "Deliberate-Activity" (Willow) and a new "Chaos" leaf (Water).

  **Weakest Axis: Axis 1 (Definition of Nature)**
  This is the weakest branch because it is metaphysical and abstract. Students often answer based on *valuation* (Is nature good?) rather than *ontology* (What is nature?).
  *   *What would change my mind:* If, in a trial run, >40% of students answer Item 1 based on "Good/Bad" rather than "Fixed/Growing," Axis 1 is failing. I would replace Item 1 with a more concrete analogy (e.g., "Is a human more like a rock, a river, or a seed?") and remove the abstract phrasing.

  **Likely Failure Mode: The Legalist/Daoist Overlap**
  The instrument may fail to separate Legalists (Item 7B, 5C) from hard-line Xunzians (Item 7A, 5A). Both emphasize external control. The separation relies on Item 5 (Can anyone be a sage?). Legalists don't care about sagehood; Xunzians do. If students answer "Yes" to sagehood but "Punishment" to policy, they are in a "Realist Xunzian" cell not explicitly named. I would merge this into Deliberate-Activity for the sake of the seminar, noting the political divergence.

  **Redrawing the Branch:**
  If the Mencius/Xunzi separation remains too dependent on Item 3 (Metaphor), I would elevate "Metaphor of Cultivation" to Axis 1. It is more intuitive for students than "Definition of Nature." The current design prioritizes philosophical rigor (Nature first), but pedagogical efficacy might demand "Practice first." If the seminar stalls on metaphysics, swap Axis 1 and Axis 3.
