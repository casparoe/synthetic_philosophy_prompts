  TO: Collections Committee
  FROM: Collections Committee Member
  DATE: October 24, 2023
  SUBJECT: Decision Framework and Recommendation for Case 3 (Kögler Landscape)

  **Common Ground**
  Before voting, we must record the facts neither faction disputes. Conservation constraints are decisive: the autograph sheet tolerates at most eight weeks at 50 lux, after which it requires a five-year dark period. Imaging data confirms the autograph sheet is a composite: an unrelated graphite underdrawing by a different hand exists beneath ink and wash containing pigments unavailable before the 1850s. The visitor study shows enjoyment ratings are statistically indistinguishable across label conditions, but dwell time is forty percent longer and awe ratings higher when the label reads "autograph." Thirty-one percent of visitors feel cheated if a facsimile is undisclosed. Finally, we agree that a declared replica differs fundamentally from a forgery; the distinction lies in the intent to deceive.

  **Disagreement and Operational Definitions**
  Our conflict stems from undefined terms in the 2016 Exhibition Standards. To act, we must separate verbal disputes from substantive ones. I propose we adopt the following operational definitions:
  *   **Work:** For exhibition purposes, the "work" is the visual composition authorized by the creator, distinct from the physical artifact.
  *   **Authentic:** Possessing the physical history of manufacture. A facsimile is visually authentic but materially distinct.
  *   **Proportionate Disclosure:** Labeling that prevents the feeling of being cheated without dominating the visual field.

  Two cruxes remain. First, the imaging result undermines the claim that the autograph sheet represents a single achievement. If the sheet is a palimpsest of multiple episodes, the argument that the facsimile lacks the "artist's touch" weakens; the touch itself is fragmented. This should move the Curatorial faction toward accepting the facsimile as a faithful representation of the *visible* achievement. Second, the dwell-time effect. Is this evidence of enhanced aesthetic value derived from knowledge, or merely status signaling? If the former, the Empiricist claim that "looking is all" is false. If the latter, the feeling of being cheated is a social anxiety, not an aesthetic loss. This requires the Empiricist faction to acknowledge that belief alters experience, even if the object does not.

  **Recommendation**
  I recommend we display the studio facsimile in Case 3 for the full three-year cycle. The autograph sheet should be housed in the study room, available by appointment. The 1911 trade copy should be retained in storage, catalogued as part of the museum's reception history, but not displayed. This respects the donor's wish to avoid public confusion without destroying evidence.

  **Schedule:** Facsimile installed immediately. Autograph sheet rotated into Case 3 only for a special eight-week viewing coinciding with a symposium, otherwise study room only.

  **Label Wording:**
  "Anselm Kögler (1796–1861)
  Landscape Drawing
  Facsimile produced 2023 from the autograph sheet.
  The original sheet is fragile and held in the study room.
  This composition combines materials from multiple periods."

  This meets the "proportionate" standard: it declares the status clearly to prevent the "cheated" response but does not apologize for the object's validity as a visual experience.

  **The Opposing Case**
  The strongest case against this recommendation is not aura-fetishism. It is that the facsimile erases the material evidence revealed by imaging. By flattening the composite history into a single stable image, we present a lie of unity. The autograph sheet's instability and layered pigments are themselves historical data about the object's life. Displaying the facsimile prioritizes visual comfort over historical truth. If the museum's mission is evidence-based, the fragile original, however limited its viewing window, holds more information than the perfect copy. To choose the facsimile is to choose aesthetics over epistemology.

  **Future Criteria and Pre-registration**
  For future substitutions, junior curators should apply this test: Is the visual composition the primary informational value? If yes, and conservation prohibits display, a facsimile is permissible. Is the physical material the primary informational value? If yes, the original must be shown or the substitution declined.

  To settle the dwell-time crux, we should pre-register a follow-up study. Evidence counting against my recommendation would be a blinded study showing that visitors who cannot distinguish the facsimile from the original rate the aesthetic experience lower *only after* being informed of the substitution, indicating that the loss of value is retroactive and knowledge-based rather than perceptual. Specifically, a study comparing Group A (told "original" then shown facsimile) versus Group B (told "facsimile" then shown facsimile) must show no significant difference in "feeling cheated" metrics to validate the claim that disclosure solves the trust issue. If Group B still reports feeling cheated despite honest labeling, the institution must acknowledge that some value is strictly non-fungible and vote on whether to preserve that value at conservation cost.

  **Conclusion**
  This dispute is partially unresolvable by fact. The weight given to physical trace versus visual composition is a matter of institutional taste. We must vote on whether we are a museum of objects or a museum of images. I vote for images. The facsimile delivers the perceptual goods to the public while preserving the fragile original for scholarship. We should not hold the public hostage to conservation limits when a visually indistinguishable alternative exists.
