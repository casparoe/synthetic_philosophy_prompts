          *   *Crustaceans:* Sold alive, killed by cooking. Sentience recognized in policy (e.g., UK Animal Welfare (Sentience) Act) but enforcement is weak (committee reports vs. offenses).
      *   **Questions to Answer:**
          1.  What theory of welfare does this patchwork presuppose?
