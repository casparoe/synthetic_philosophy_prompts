      *   *Slaughter (Momentary vs. Life Shape):* Slaughter protocols focus on the *end state* (pain-free death). This leans towards a negative utilitarian view (minimize suffering) rather than a "shape of a life" view (flourishing). Can a regulator hold both? Yes, if they view rearing as "risk management" and slaughter as "critical control point." It's coherent administratively, if not philosophically.
