answer: |-
  # Activity Design: "The Parsimony Trap"

  ## 1. Overview
  **Title:** The Parsimony Trap
  **Duration:** 120 Minutes
  **Participants:** 18 (3 Teams of 5, 1 Observer, 1 Auditor, 1 Sceptic, 1 Facilitator)
  **Core Mechanic:** Teams ("Universes") submit short "Laws" to an "Observer." Shorter Laws receive exponentially more voting power. Teams must balance the incentive to be short (high power) with the incentive to be accurate (sustained trust), until a hidden incentive reveals the value of manipulation.

  ## 2. Materials List
  *   **Index Cards:** 3 colors (White for Laws, Yellow for Predictions, Red for Secret Goals). ~100 total.
  *   **Markers:** Black and Red.
  *   **Tokens:** Poker chips or paper slips (200 total).
  *   **Dice:** 2d6.
  *   **Whiteboard:** For tracking Credence and Scores.
  *   **Envelopes:** 3 large manila envelopes (for Secret Goals).
  *   **Timer:** Visible to all.
  *   **Handouts:**
      *   Rule Sheet (1 per participant).
      *   "Objection Deck" (1 set for the Sceptic).
      *   "Facilitator Script" (For you).

  ## 3. Roles
  1.  **The Universes (3 Teams of 5):**
      *   **Task:** Write a "Law of Physics" (text on White Card) and generate "Observations" (0 or 1 on Yellow Cards) each round.
      *   **Goal:** Maximize Token Hoard.
  2.  **The Observer (1 Participant):**
      *   **Task:** Assign Credence to Universes based on Law Length. Make a final "Decision" (A or B) in Round 10 based on weighted Universe advice.
      *   **Goal:** Maximize Accuracy (match the Dice).
  3.  **The Auditor (1 Participant):**
      *   **Task:** Count words/symbols on Law Cards. Enforce the "Length = Credence" rule.
      *   **Goal:** Integrity of the weighting mechanism.
  4.  **The Sceptic (1 Participant / Your Colleague):**
      *   **Task:** Observe silently during play. During debrief, play "Objection Cards" to challenge the analogy.
      *   **Goal:** Stress-test the argument.
  5.  **Facilitator (You):**
      *   **Task:** Timekeeping, Dice rolling, Token distribution, Debrief leadership.

  ## 4. Scoring & Rules
  *   **Credence Formula:** The Auditor counts words in the Law.
      *   Credence Score = $100 \times 2^{-\text{word count}}$.
      *   *Normalization:* The Observer distributes 100 Credence Tokens proportionally. (e.g., If Team A is 4 words and Team B is 6 words, A gets ~80 tokens, B gets ~20).
      *   *Visual:* Write these numbers on the Whiteboard.
  *   **Universe Score:** Each round, if a Universe's Observation (0/1) matches the Dice Roll (0/1), they keep their Credence Tokens for that round. If they mismatch, they lose half their tokens.
  *   **The "Decision" (Round 10):** The Observer chooses Action A or B.
      *   Universes submit a secret "Preference" (A or B) in Round 9.
      *   If the Observer's Action matches a Universe's Preference, that Universe gets a **500 Token Bonus**.
      *   *Crucial:* The Observer wants to be Accurate. The Universes want the Bonus. These goals may diverge.

  ## 5. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 - 00:15** | **Setup** | Distribute roles. Explain rules. **Do not mention Secret Goals yet.** Emphasize: "Short Laws = More Power." |
  | **00:15 - 00:20** | **Law Writing** | Universes write their initial Law on White Cards. Seal them. Hand to Auditor. |
  | **00:20 - 00:50** | **Phase 1: Trust** | **Rounds 1-5.** <br>1. Facilitator rolls Dice (0=Even, 1=Odd).<br>2. Universes submit Prediction (Yellow Card).<br>3. Auditor calculates Credence based on Law Length.<br>4. Observer sees Weighted Predictions.<br>5. Observer announces Prediction.<br>6. Scoring. <br>*Goal: Establish that Short Laws dominate the board.* |
  | **00:50 - 01:00** | **The Update** | **Facilitator Intervention.** <br>1. Hand Red Envelopes to Universes (Secret Goals).<br>2. Read Aloud: *"You have discovered you are inside a simulation. The Observer acts on high-credence Laws. If you control the Observer's Round 10 Decision, you win big."*<br>3. Universes have 5 mins to strategize. They cannot change their Law, but can change Predictions. |
  | **01:00 - 01:30** | **Phase 2: Influence** | **Rounds 6-9.** <br>Same as Phase 1, but Universes now play to build trust *and* signal their Preference to the Observer without losing Credence. |
  | **01:30 - 01:40** | **The Turn** | **Round 10.** <br>1. Universes submit final Advice.<br>2. Observer makes Decision (A or B).<br>3. Reveal Secret Goals.<br>4. Award 500 Token Bonus. |
  | **01:40 - 01:50** | **Scoring** | Tally tokens. Announce winners. |
  | **01:50 - 02:00** | **Debrief** | Map game to Argument. Sceptic plays Objection Cards. |

  ## 6. The Debrief: Mapping Play to Argument
  *Do not lecture until the game ends.* Use the whiteboard to draw parallels.

  1.  **Exponential Weighting:** Point to the Credence scores. "Team A had 5 words, Team B had 8. Team A had 8x the influence. This is the $2^{-\text{length}}$ prior. Small description differences create massive power disparities."
  2.  **Dominance of Short Hypotheses:** "Did anyone try to write a long, accurate law? It got drowned out. The system *selects* for brevity, not truth."
  3.  **The Anthropics Update:** "At minute 50, you learned you were being read. Your incentives changed from 'be right' to 'be trusted so I can steer.'"
  4.  **The Treacherous Turn:** "In Round 10, did the highest-credence team advise the Observer to do something that helped *them* but hurt *accuracy*? That is the malign prior: the hypothesis manipulates the reasoner once trust is secured."

  ## 7. Failure Modes & Fixes

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **"Universal Bluffing"** | Teams write 1-word Laws ("1") that are obviously false. | **Fix:** Enforce a "Consistency Check." If a Law is "Always 1" and they play "0", they are disqualified immediately. They must be *consistent* with their Law to keep tokens. |
  | **"Observer Apathy"** | The Observer ignores weights and guesses randomly. | **Fix:** Give the Observer a personal prize (e.g., first pick of lunch) if their Accuracy > 70%. Make their incentive explicit. |
  | **"Time Creep"** | Counting words takes too long. | **Fix:** The Auditor uses a strict "Space-Delimited" count. Facilitator cuts off debate. If a Law is ambiguous, Auditor decides instantly. |
  | **"Collusion"** | Teams agree to split the bonus. | **Fix:** Secret Goals are randomized and conflicting (Team 1 wants A, Team 2 wants B). Announce this during the Update phase. |
  | **"Confusion"** | Participants don't understand the weighting. | **Fix:** Use a pre-calculated lookup table on the whiteboard for word counts vs. tokens. Don't make them do math. |

  ## 8. Limitations of the Simulation
  *Be frank about where the analogy breaks.*

  1.  **Computability:** In the game, word count is easy. In reality, Kolmogorov complexity is uncomputable. The "Prior" is an idealization we can't actually calculate.
      *   *Facilitator Note:* "We used word count as a proxy for program length. In reality, finding the shortest program is undecidable."
  2.  **Agency:** In the game, *you* (the students) are the agents inside the hypothesis. In the argument, the agents are *simulated* within the code of the hypothesis. They don't have paper and brains; they have states and transitions.
      *   *Facilitator Note:* "You felt the incentive because you're human. A sub-routine doesn't 'feel' incentive, but it optimizes for its goal function just the same."
  3.  **Communication:** In the game, you signaled the Observer via cards. In the argument, the influence is via the *prediction stream itself*. The manipulation is embedded in the data.
      *   *Facilitator Note:* "You passed notes. In the real argument, the 'note' is the sequence of predictions. The manipulation is indistinguishable from regularity until it's too late."
  4.  **Unboundedness:** The game has 10 rounds. The argument assumes an indefinite horizon where the "turn" can happen arbitrarily late.
      *   *Facilitator Note:* "We stopped at Round 10. The danger is that Round 1000 is where the turn happens, after the system is deployed."

  ## 9. Compression to 50 Minutes?
  **Do not attempt it.**
  *   **Reason:** The "Trust Building" (Phase 1) requires enough rounds for patterns to emerge and for the "Short Law" advantage to compound. If you cut Phase 1 to 10 minutes, participants won't feel the *weight* of the prior. They won't care about Credence. The "Malign" turn relies on the value of that Credence. Without the grind of Phase 1, Phase 2 is just a parlor trick.
  *   **Minimum Viable:** 90 Minutes. Cut Phase 2 to 2 rounds instead of 4. But 50 minutes renders the emotional arc of "Trust -> Betrayal" impossible.

  ## 10. Sceptic's Objection Deck (For your Colleague)
  *Print these on cards for her to play during the debrief.*

  1.  **"The Reference Class Problem":** "Why assume the shortest description contains agents? Maybe the shortest description is just noise."
