answer: |-
  **The ledger**

  *   **Jan 1998 Press Conference:** Lie (Belief Condition); he believed the relationship existed despite semantic narrowing of "sexual relations."
  *   **Jones Deposition (Alone):** Misleading (Implicature); literally true regarding specific times, intended to suggest never alone.
  *   **Jones Deposition (Definition):** Misleading (Literal Truth); exploited definition's active voice to exclude receptive acts despite shared intent.
  *   **Grand Jury ("is"):** Evasion (Semantic Pedantry); asserts nothing truth-apt, delays admission via linguistic technicality.
  *   **Civil Contempt Finding:** Legal Lie (Judicial Determination); judge ruled testimony false and intentional regardless of semantic defense.
  *   **Arkansas Law License:** Professional Misconduct (Ethical Breach); board treated deception as violation regardless of technical truth.
  *   **Senate Acquittal:** Legal Non-Lie (Procedural); insufficient votes to prove falsity beyond reasonable doubt under perjury statutes.

  **The theories**

  The Standard View of lying dominates the literature: asserting *p* while believing *~p* (Carson 2010). This is largely settled. What is contested is whether intent-to-deceive is necessary or constitutive. Misleading relies on Gricean implicature—saying something true to suggest something false. The moral distinction is heavily debated. Saul (2012) argues lying and misleading are morally equivalent because the intent to deceive is identical; the listener suffers the same epistemic harm. Others (Mahon 2015) argue lying violates a norm of assertion specifically, making it intrinsically worse than misleading.

  In Clinton's case, if he believed his statements created a false impression, the Standard View classifies them as misleading, not lying, because the literal propositions were true. However, if we adopt a "warranty" theory (Fallis 2015), where asserting warrants truthfulness of the *implication*, the distinction collapses. I land on the view that in high-stakes testimony, the warranty extends to implicatures; thus, intentional misleading is morally indistinguishable from lying. The consensus is that legally they differ; philosophically, the moral gap is narrowing. Your roommate relies on the legal/Standard View distinction; you rely on the moral equivalence of intent.

  **Where the case pushes back**

  The case strains the distinction via aggregation and context. *Bronston v. United States* (1973) holds literally true but unresponsive answers aren't perjury; the remedy is follow-up. This is an institutional rule about cost-allocation, not a moral endorsement. It assumes an adversarial process where examiners catch evasions. Clinton's case pushes back because the "follow-up" was obstructed by the very deception. The aggregation problem is critical: individual answers may be technically true (misleading), but the pattern constitutes a narrative falsehood. If every brick is sound but the wall hides a crime, is the wall a lie?

  The definition issue complicates this: exploiting an opponent's narrow definition to hide truth respects the letter but violates the oath's spirit. This suggests the lying/misleading distinction works for isolated assertions but fails for cooperative truth-seeking contexts. The distinction cannot handle "systematic misleading." Furthermore, *Bronston* assumes good faith; Clinton's defense assumed bad faith exploitation. The literature agrees *Bronston* is procedural, but disagrees on whether it should apply when the witness actively constructs a false narrative through true statements. The episode shows the distinction breaks when the speaker controls the semantic field.

  **The law's answer**

  The law tracks provability and institutional integrity, not moral sin. Perjury requires material falsity; misleading answers are often immaterial or unprovable as false. The civil contempt finding acknowledged the moral breach without criminal perjury conviction. Doctrine protects the witness from semantic traps (*Bronston*) but punishes obstruction (Contempt). This split shows the law recognizes the distinction practically but penalizes the abuse of it. The Arkansas Bar's suspension indicates professional ethics demand more than legal technicalities. So, doctrine separates lying and misleading for conviction ease, but sanctions the *intent* to mislead under contempt or ethics rules. The law admits the distinction is a shield, not a sword.

  **Verdict**

  Your roommate is legally correct: under *Bronston* and the specific definition, many statements were misleading, not perjurious lies. You are morally correct: the intent to deceive makes the distinction negligible in this context. The distinction survives in law because it protects witnesses from ambiguous questions, but it collapses in morality when the speaker actively engineers false beliefs. The episode shows the distinction is a procedural tool, not a moral boundary. You win on the dinner argument's spirit; she wins on the bar exam. The distinction survives legally but fails to capture the ethical weight of the oath.
