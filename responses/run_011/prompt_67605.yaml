  So this started as a dinner argument and I cant let it go. My roommate's a 2L and she was explaining why the Clinton/Lewinsky perjury business didn't actually amount to perjury, and I said fine, legally — but morally he lied, obviously. She said no, that's exactly the point: most of what he did was technically true and misleading rather than lying, and those are different kinds of act, not just different degrees of the same one. I want to work through the actual episode instead of trading intuitions, and I want a real case analysis, not a recap of the scandal — I lived through it, I know the story.

  Here are the pieces I think matter, so you don't have to reconstruct them from memory: the January 1998 press conference denial about having had sexual relations with that woman; the sworn deposition in the Jones case days earlier, where he was asked about being alone with Lewinsky and said he didn't believe he ever had been, and where the definition of sexual relations had been drafted by Jones's lawyers and adopted by the judge, which he later said his conduct fell outside of because he was on the recieving end; the August 1998 grand jury testimony, where he defended an earlier answer by saying it depends on what the meaning of the word "is" is; the civil contempt finding and the $90,000 fine, which rested on testimony the judge treated as false and misleading; the five year suspension of his Arkansas law license; and the Senate acquittal. If any of that is wrong, or you think some detail I've left out changes the analysis, say so up front rather than quietly working around it.

  Now the task. Run the lying/misleading distinction across the case item by item, then turn it around and ask what the case does to the distinction. So: classify each of those as a lie, a misleading-but-true assertion, an evasion that asserted nothing at all, or something else, and say which classification depends on which theory — the belief condition, the intent-to-deceive condition, the idea that asserting gives the hearer a kind of warranty, the view that you can lie without believing the negation. Then take on the two big arguments that the distinction doesn't do any moral work: the practical equivalence point, and the point that misleading pushes the inferential labor onto the hearer, which cuts either way depending on how you look at it. I'm also curious about Bronston — the 1973 case holding that a literally true but unresponsive answer under oath isn't perjury because the remedy is the examiner's own follow-up question. Is that just the assertion-based view of lying coded into doctrine, or is it an institutional rule about who eats the cost of ambiguity that's perfectly consistent with thinking the witness did something worse than lying? And the aggregation problem: if every individual answer was permissible, what do you say about the pattern, and about the fact that the narrow definition was written by the other side?

  Format it with these sections in this order: "The ledger" (around 200 words, one line per item giving the classification and the theory it hinges on); "The theories" (around 350, on how the main accounts sort these statements); "Where the case pushes back" (around 350, on what the episode shows the distinction can't handle, including Bronston and aggregation); "The law's answer" (around 200, on whether the doctrine is tracking the morality or something else entirely); and "Verdict" (around 150, on whether she or I am closer to right, and how much of the episode the distinction actually survives). And throughout, be explicit about what's settled in this literature versus what's genuinely contested among people who work on it — I don't want to walk into the next dinner assuming there's a consensus on, say, whether lying requires an intent to deceive when there isn't one. Don't soften everything into "some philosophers think X, others think Y," though; tell me where you land and what's doing the work in that judgment.
