          *   *Better:* Each student builds a "Portfolio." At the end, we compare portfolios. The one with the most "Ethical Consistency Score" (determined by the facilitator based on the diagnostic) gets to choose the break. No, that's too subjective.
          *   *Best:* The "Veto Token." Each student gets 1 Veto Token. If they play it, the class loses the points for that round. This forces the Lexical holders to *spend* their conviction. If they claim lexicality but don't veto, they revealed themselves as steep-rate.

  4.  **Drafting the Design - "The Compensation Protocol"**

      *   **Materials:** 2 Sheets per student. Sheet 1: The Price List. Sheet 2: The Voting Ballot. Whiteboard for tracking Class Pool.
      *   **Currency:** "Welfare Units" (WU).
      *   **Stakes:** Control over the final 10 minutes of *next* seminar (topic, format, etc.).
      *   **Timeline:**
          *   0-10: Setup & Rules (Silent).
          *   10-30: Phase 1 (Pricing the Unpriceable).
