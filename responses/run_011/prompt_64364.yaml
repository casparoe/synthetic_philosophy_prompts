      *   *Debrief mapping?* Yes.
      *   *Predict failures?* Yes.
      *   *What words are forbidden?* "Negative utilitarianism, lexical, threshold." (Must ensure I don't use them in the plan instructions to the user, but I can use them in the *debrief section* of the plan).

  8.  **Self-Correction on "Stakes":**
      *   The user said "who has to open next week's presentation or how the break is scheduled."
      *   Let's make it: "The Winner chooses the Break Time and the Opener for Next Week."
      *   How is a winner chosen? The "Class Pot" determines if *anyone* wins. If the Pot is emptied by Vetoes, no one chooses (Professor decides). If the Pot survives, the person with the most "Consistency Points" chooses.
      *   Actually, simpler: If the Class Pot reaches $X, the class votes on who decides. If Vetoes kill the Pot, the Professor decides. This makes the Veto costly to the *group*, pressuring the Lexicalists.

      *   *Wait, one more constraint:* "The points they earn should nevertheless buy something they actually care about."
