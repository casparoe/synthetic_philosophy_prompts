answer: |-
  # Session Design: The Compensation Protocol

  **Objective:** To force students to operationalize their intuitions about suffering and pleasure, revealing whether they hold a *steep exchange rate*, a *lexical threshold*, or a view of *incommensurability*, without using those terms until the debrief.

  **Forbidden Words (Until Debrief):** "Negative utilitarianism," "lexical," "threshold," "incommensurable," "utility."

  **Stakes:**
  *   **If the Class Pot reaches 1,000 Points:** The class votes on who sets the break schedule and assigns the opener for next week.
  *   **If the Class Pot fails:** The Professor sets the break schedule and assigns the opener.
  *   **Individual Incentive:** The student with the highest "Consistency Score" (defined below) gets the deciding vote if the Class Pot succeeds.

  **Materials:**
  *   Whiteboard + Markers (Red, Black, Green).
  *   **Sheet 1 (The Price Schedule):** 16 copies. (Template provided below).
  *   **Sheet 2 (The Voting Record):** 16 copies. (Template provided below).
  *   Timer (visible to all).

  ---

  ## Part 1: Materials & Setup

  ### Sheet 1: The Price Schedule
  *Header:* **COMPENSATION SCHEDULE**
  *Instructions:* For each Scenario, write the minimum amount of **Universal Joy (UJ)** that must be distributed to the class to make accepting this Scenario permissible.
  *   **UJ Definition:** 1 UJ = Every student in this room experiences 1 hour of mild contentment.
  *   **Rule:** You may write a number (e.g., 50, 1000) OR you may write **"X"**.
  *   **Meaning of X:** "No amount of Universal Joy compensates for this."
  *   **Meaning of Blank:** "I refuse to compare these."

  | Scenario | Description of Cost (Hypothetical) | Your Price (UJ) |
  | :--- | :--- | :--- |
  | **A** | One person experiences a mild headache for 1 hour. | _______ |
  | **B** | One person experiences a severe migraine for 1 hour. | _______ |
  | **C** | One person experiences a broken arm (healed instantly). | _______ |
  | **D** | One person experiences intense torture for 1 hour. | _______ |
  | **E** | One thousand people experience intense torture for 1 hour. | _______ |

  ### Sheet 2: The Voting Record
  *Header:* **PROJECT VOTE**
  *Instructions:* The Facilitator will propose Projects. Each Project grants Points to the **Class Pot** but imposes a Scenario Cost.
  *   **Action:** Check **ACCEPT** or **VETO**.
  *   **Constraint:** If you wrote **"X"** on Sheet 1 for a Scenario, you *must* VETO any Project using that Scenario to maintain Consistency. If you wrote a Number, you *cannot* VETO (you have already priced it).

  | Project | Reward (Class Points) | Cost (Scenario) | Your Vote (Accept / Veto) |
  | :--- | :--- | :--- | :--- |
  | **1** | 200 Points | Scenario A | _______ |
  | **2** | 400 Points | Scenario C | _______ |
  | **3** | 500 Points | Scenario D | _______ |

  ---

  ## Part 2: Timeline (75 Minutes)

  ### 00:00 – 00:10: Setup & Silence (10 mins)
  *   **Action:** Distribute Sheet 1. Do not speak about the philosophy. Read the instructions literally.
  *   **Rule:** "Absolute silence while writing. If you speak, you forfeit your Consistency Score."
  *   **Task:** Students fill out Sheet 1.
  *   **Facilitator:** Draw the **Class Pot** on the whiteboard (Starts at 0, Goal is 1000).
  *   **Constraint:** Collect Sheet 1 after 8 minutes. Do not look at them yet.

  ### 00:10 – 00:35: The Market Phase (25 mins)
  *   **Action:** Distribute Sheet 2.
  *   **Mechanism:** Announce Project 1.
      *   "Project 1 offers 200 Points for the Class Pot. The cost is Scenario A."
      *   "Check your Sheet 1. If you wrote a Number, you have agreed this trade is possible. You must vote ACCEPT. If you wrote X, you must vote VETO."
      *   "If you wrote a Number but vote VETO, you lose Consistency Points. If you wrote X but vote ACCEPT, you lose Consistency Points."
  *   **Process:** Repeat for Projects 2 and 3.
  *   **Tension:** Project 3 (Scenario D) is the trap.
      *   **Total Utilitarians** (who wrote numbers, even huge ones) *must* accept if the Points help reach the goal.
      *   **Lexicalists** (who wrote X) *must* veto, killing the Points.
      *   **Incommensurabilists** (who left it blank) are in limbo. Ask them: "A blank is not a price. You cannot trade. Treat as VETO."
  *   **Tally:** Count the Vetoes publicly.
      *   **If 0 Vetoes:** Add Points to Class Pot.
      *   **If 1+ Vetoes:** Project fails. 0 Points.
  *   **Whiteboard:** Update the Class Pot in Green (Success) or Red (Failure).

  ### 00:35 – 00:50: The Collapse & Rule Change (15 mins)
  *   **Scenario:** It is highly likely Project 3 fails due to Vetoes from those who marked X on Scenario D. The Class Pot will stall below 1000.
  *   **Action:** Announce: "The Class Pot is stuck. You cannot reach the goal under current rules. You may propose **One Rule Change** to allow Project 3 to pass."
  *   **Constraint:** The Rule Change must be written on the board and voted on.
  *   **The Diagnostic Trap:**
      *   If they propose "Double the Reward," they are treating it as **Steep Finite** (just needs more currency).
      *   If they propose "Ignore the Vetoes," they are embracing **Aggregation** over Rights.
      *   If they propose "Count Suffering First, Then Joy," they are inventing the **Ordered Pair**.
  *   **Task:** Allow 5 minutes for proposals, 5 minutes for debate (finally allowed), 5 minutes for vote.

  ### 00:50 – 01:05: Scoring & Revelation (15 mins)
  *   **Action:** Return Sheet 1 to students.
  *   **Task:** Ask them to look at their own numbers.
  *   **Facilitator:** Reveal the forbidden words. Map their behavior to the three positions.
      *   **Numbers only:** Steep Exchange Rate.
      *   **Numbers then X:** Lexical Threshold.
      *   **Blanks/Questions:** Incommensurability.
  *   **Consistency Score:** Award points to those whose Sheet 2 votes matched Sheet 1 prices. Announce the winner (who chooses the break/opener if the Pot succeeded, or just gets the title if it failed).

  ### 01:05 – 01:15: The Debrief (10 mins)
  *   **Action:** Connect the game to the philosophy (see Debrief Script below).

  ---

  ## Part 3: Scoring Scheme (Whiteboard Only)

  Keep three columns on the board. Update live.

  1.  **CLASS POT:** (Target 1000).
      *   +Points if Project passes (0 Vetoes).
      *   +0 if Project fails (1+ Vetoes).
  2.  **VETO COUNT:** (Track per Project).
      *   Shows the friction in the room.
  3.  **CONSISTENCY LEADER:** (Tally mentally or on scratch paper).
      *   +1 Point for every matching Price/Vote.
      *   -1 Point for every mismatch.
      *   *Note:* You don't need to show individual scores, just announce the winner at the end. This prevents gaming the score during the session.

  ---

  ## Part 4: Diagnostic Guide (For You)

  Watch the **Price Schedule (Sheet 1)** as you collect them. You are looking for three distinct patterns:

  | Pattern | Visual Trace on Sheet 1 | Philosophical Commitment | Behavior in Phase 2 |
  | :--- | :--- | :--- | :--- |
  | **1. Steep Finite** | Numbers increase drastically (e.g., 10, 100, 10,000, 1,000,000). | Suffering is bad, but comparable to pleasure. | Will vote ACCEPT on Project 3 if the Points help the Class Pot. Will argue for "Doubling the Reward" in Phase 3. |
  | **2. Lexical Threshold** | Numbers exist for A/B, then **"X"** for D/E. | Suffering > Threshold cannot be offset by *any* pleasure. | Will vote VETO on Project 3. Will block the Class Pot. Will feel frustrated that the "math" won't work. |
  | **3. Incommensurable** | **Blank** or **"?"** for D/E. | No common metric exists. | Will be confused in Phase 2. If forced to vote, they will likely VETO out of caution. |

  **The Student Who Fits None:**
  *   *Pattern:* Writes "0" for everything, or random numbers.
  *   *Diagnosis:* They are not engaging with the moral weight, or they are a radical hedonist who believes suffering is just negative pleasure with no special status.
  *   *What to say:* "You treated pain as identical to pleasure, just with a negative sign. You are a classic Total Utilitarian. The game was too easy for you, which is its own problem."

  ---

  ## Part 5: The Debrief Script (Mapping the Claims)

  **1. Mapping the Two Claims:**
  *   "Look at Project 3. Those who voted VETO because of an 'X' on Sheet 1 are committed to the **Threshold Claim**. You believe there is a point where the exchange rate breaks. You didn't say the price was high; you said there *is* no price."
  *   "Those who voted ACCEPT are committed to **Commensurability**. You believe there is *some* number of happy hours that makes torture permissible. You might think that number is a billion, but it is a number."
  *   "Now, look at the **Asymmetry Claim**. Did anyone write a number for Scenario A that was *negative*? (i.e., 'I would pay Joy to avoid this'). If you require compensation to *allow* suffering, but wouldn't require compensation to *allow* pleasure, you hold an asymmetrical view. Most of you did this implicitly."

  **2. The Costs:**
  *   **To the Lexicalists (Threshold):** "In Phase 2, your Vetoes killed the Class Pot. If you scale this up: if *any* severe suffering exists, no amount of global joy can justify the world's existence. This leads to the **Destruction Objection**: a negative utilitarian logic suggests it is better to painlessly destroy all sentient life than risk severe suffering. Did anyone want that outcome? Your Veto implies you do."
  *   **To the Total Utilitarians (Steep):** "You were willing to trade Scenario D for 500 Points. If I offered you 1,000,000 Points for Scenario E (1,000 people tortured), would you have taken it? If yes, you are vulnerable to the **Sadistic Conclusion**: that a world of torture is better than a world of mild boredom if the boredom lasts long enough."

  **3. The Ordered Pair (The Device):**
  *   "In Phase 3, did anyone suggest we count Suffering *first*, and only look at Joy if Suffering is zero? That is the **Ordered Pair** solution. $(S, P)$."
  *   "Does this fix the arithmetic? Yes. It allows you to keep the Threshold without vetoing *everything*. You minimize S first. If S is equal, you maximize P."
  *   "Who wants this device?" (Look for hands). "Notice: adopting this changes you from a One-Scale Utilitarian to a Two-Stage Prioritarian. It solves the game, but it abandons the idea that welfare is a single substance."

  ---

  ## Part 6: Predicted Failures & Limitations

  **1. The Exploit: "The Strategic X"**
  *   *Risk:* A student who wants to kill the Class Pot (to spite the group or test the system) writes "X" everywhere.
  *   *Mitigation:* The Consistency Score. If they write "X" for Scenario A (Mild Headache), call them out in the debrief. "You claimed a mild headache cannot be compensated by *any* amount of joy? That is not lexicality; that is nihilism." This pressures them to be reasonable.

  **2. The Stall: "The Debate Trap"**
  *   *Risk:* During Phase 2, the two articulate Total Utilitarians try to convince the Lexicalists to change their votes.
  *   *Mitigation:* Enforce the Rule: "Sheet 1 is a binding contract. You cannot renegotiate your morals based on the reward size. Vote according to Sheet 1 or lose Consistency."

  **3. The Refusal: "I Won't Play"**
  *   *Risk:* One student refuses to write numbers, claiming the exercise is immoral.
  *   *Diagnosis:* This is **Strong Incommensurability**.
  *   *Action:* Do not force them. Mark their Sheet 1 as all "X". In Phase 2, they are a permanent Veto.
  *   *Debrief Point:* "This student's refusal is the most honest lexical position. But note: by refusing to play, they ensured the Professor chooses the break. Principled incoherence has a cost."

  **4. What The Game Cannot Reproduce:**
  *   **The Phenomenology:** The game treats suffering as abstract "Scenarios." It cannot reproduce the *visceral* horror that usually drives people to Lexicality. You must supply this in the debrief. "You wrote 'X' on paper. Imagine the blood. Does the 'X' hold?"
  *   **The Population Scale:** The game uses fixed populations (1 person, 1000 people). It cannot fully replicate the **Repugnant Conclusion** (massive populations with lives barely worth living). You must explain this verbally: "Your math works for 16 students. Does it work for 10 billion?"
  *   **The "Why":** The game reveals *that* they hold a view, not *why*. You must ask: "Is the threshold based on rights? On the nature of pain? On dignity?"

  **5. The "Ordered Pair" Adoption:**
  *   *Will they want it?* Yes, if they are stuck. If the Class Pot is at 900 and they need 100, and Project 3 is the only way, they will desperately look for a rule that allows Project 3 without violating their "X".
  *   *The Shift:* If they propose "We only count Suffering first," they have just reinvented **Lexical Prioritarianism**. Point this out explicitly. "You just changed the ontology of value to save the game."

  ---

  ## Facilitator's Cheat Sheet (Keep this in your pocket)

  *   **If they ask:** "Can we write 'Infinity'?"
      *   **Say:** "Write 'X'. Infinity is a number. X is a stop sign."
  *   **If they ask:** "What if we want to save the Class Pot?"
      *   **Say:** "Then you should have priced the suffering lower on Sheet 1. You are bound by your past self."
  *   **If the Pot succeeds easily:**
      *   **Say:** "Then none of you are Lexicalists. You are all Commensurabilists. The session is over, we move to debrief." (This is unlikely if the descriptions are vivid enough).
  *   **If the Pot fails completely:**
      *   **Say:** "Good. You have proven that under your current ethics, progress is impossible. Now, how do we fix the ethics?"

  **Final Note:** The success of this session depends on your refusal to explain *why* they are doing it until the last 10 minutes. Let the frustration of the Veto mechanism do the teaching. If they feel the friction between "Wanting the Prize" and "Respecting the X," you have succeeded.
