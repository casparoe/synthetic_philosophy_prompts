              3.  Broken bone for 1 person.
              4.  Torture for 1 person.
              5.  Torture for 1,000 people.
          *   *Task:* Write the amount of "Universal Joy" (distributed to everyone) required to compensate.
          *   *Diagnostic:*
              *   Steep: 10, 100, 1000, 10000, 100000. (Continuous function).
              *   Lexical: 10, 100, 1000, NONE, NONE. (Discontinuous).
              *   Incommensurable: 10, 100, ?, ?, ?. (Category error).

      *   **The Trap (Phase 2):**
          *   The Facilitator offers a deal: "We can have the Break Extension (worth 500 WU to the class) if we accept Scenario 3."
