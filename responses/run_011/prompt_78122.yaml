prompt: |-
  I am a staff writer at a British magazine of science and ideas, where I cover the history of science and of ideas and also commission two or three long reads a month from outside contributors — mostly working academics and freelancers who have never met a page of historiographical method and would be puzzled if I sent them one. The anniversary cycle governs a great deal of what we publish: the two-hundred-and-fiftieth year of an expedition, the centenary of a paper, the fiftieth of an institutional scandal. After a decade of this I have come to suspect that nearly everything we run in that genre commits the same fault in slightly different clothes. It treats the past as a rehearsal for the present; it congratulates dead investigators for having got things right, meaning for having agreed with us; it converts their opponents into foils who contributed nothing to anything; and it smuggles inevitability into the syntax — that the field was 'finally ready', that it was 'only a matter of time'. Last month we ran a 1,400-word feature on a nineteenth-century naturalist whose work was neglected in his lifetime, and an academic historian wrote in to say, quite fairly, that we had turned a man who asked questions nobody now asks into a man who had answered ours. My commissioning editor keeps Herbert Butterfield's remark about the whig interpretation of history, that it 'studies the past with reference to the present', on a card above her desk; she takes it as a warning, though I suspect she mostly likes it as a phrase. What I need from you is not another essay on the problem but something a desk can run.

  Please write a decision procedure — a sequenced set of tests that can be applied to a pitch in about fifteen minutes and to a draft in about half an hour — for deciding whether a piece of journalism about the past is whiggish in the damaging sense, in which particular way, and what would have to change for it to be defensible. Ground it in whatever the historiographical critique of progress narratives actually says, but write it for contributors who have never encountered the argument: no technical vocabulary unless you define it in a subordinate clause. For each test, give the question to be asked, what counts as a sufficient answer to it, and what the procedure does on failure — whether that is a repairable sentence, a structural rewrite, or a kill. Repairs must be achievable inside 1,200 to 1,800 words with no room for a hedging paragraph or a footnote, so please be concrete about what gets cut rather than what gets qualified. Mark plainly which steps are editorial judgment rather than matters of fact, since I do not want a false precision that a commissioner can hide behind; I would rather be told where the procedure runs out than given a score. And the procedure must not overcorrect into a ban on saying that a past claim was simply wrong, that some things really did improve, or that we know more than the people we are writing about — a magazine that could not say so would be useless, and I think dishonest.

  Then run it on three cases. First, a commissioned anniversary feature on a forgotten precursor said to have 'anticipated' a modern theory, arriving with a strong narrative spine and exclusive access to family papers. Second, a profile of a researcher whose correct idea was rejected by contemporaries and who is now being rehabilitated as a martyr; here I expect the procedure to hurt, because the martyr frame is precisely what makes the piece publishable, and I want you to say plainly whether it has to go and whether anything can be salvaged in its place. Third, a piece on the collapse of a now-discredited nineteenth-century medical framework, where I want to say without embarrassment that its replacement was an improvement: tell me whether the procedure permits that, and on what conditions. Finish by stating what the procedure cannot settle — which questions it can raise but not answer, where it depends on a distinction (between our questions and theirs, for instance) that historians themselves dispute, and what a commissioner should do when the two errors, flattery of the present and an antiquarian refusal to judge, pull a single draft in opposite directions. Please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Staff writer at a British magazine of science and ideas.
      *   **Task:** Create a "decision procedure" (a sequenced set of tests) to identify and fix "Whiggish" history in journalism pitches and drafts.
      *   **Audience:** Commissioners and contributors (academics/freelancers) who don't know historiographical jargon.
      *   **Constraints:**
          *   Grounded in historiographical critique (Butterfield, etc.) but accessible (no undefined jargon).
          *   Time limits: 15 mins for pitch, 30 mins for draft.
          *   Word count context: Pieces are 1,200–1,800 words. Repairs must fit this constraint (cut, don't hedge).
          *   Tone: British English, pragmatic, editorial (not academic), honest about limitations (mark editorial judgment vs. fact).
          *   Must not overcorrect (allow saying past claims were wrong or things improved).
          *   Apply the procedure to three specific cases (Precursor/Anticipation, Martyr/Rehabilitation, Discredited Framework/Improvement).
          *   Conclude with limitations of the procedure.

  2.  **Deconstruct "Whiggish History" for Journalists:**

      *   *Core definition:* Judging the past by the standards of the present; seeing history as a straight line of progress leading to *us*.
      *   *Symptoms:* "Anticipated," "Finally," "Only a matter of time," "Neglected genius," "Obstacles removed."
      *   *Nuance:* We *can* say they were wrong. We *can* say we know more. We just can't pretend they were trying to do *our* job.
      *   *The Fix:* Contextualize the past on its own terms. Show the branching paths, not just the winning one.

  3.  **Drafting the Decision Procedure:**

      *   *Structure:* Needs to be a checklist or flow. Let's use a "Gate" system (Gate 1, Gate 2, Gate 3).
      *   *Language:* Direct, imperative, British spelling (colour, programme, centre).
      *   *Content:*
          *   Test 1: The Teleology Test (Inevitability).
          *   Test 2: The Motivation Test (Anachronism).
          *   Test 3: The Loser Test (Opponents).
          *   Test 4: The Improvement Test (Allowing progress without inevitability).
      *   *Outcomes:* Pass, Repair (specific cuts), Kill.

  4.  **Developing the Three Cases:**

      *   *Case 1: The Precursor.* (The "He anticipated Einstein" trope).
          *   *Risk:* High. Making the past figure a proto-modern.
          *   *Procedure outcome:* Likely needs structural rewrite. Shift focus from "what he got right" to "why he asked that question then."
      *   *Case 2: The Martyr.* (The "Persecuted Genius" trope).
          *   *Risk:* Very High. This is pure Whiggism (we are right, they were blind).
          *   *Procedure outcome:* Kill the frame. Salvage the biography but lose the moral victory narrative.
      *   *Case 3: The Discredited Framework.* (e.g., Miasma vs. Germ).
          *   *Risk:* Low/Medium. We need to say Germ Theory is better.
          *   *Procedure outcome:* Pass, provided we explain *why* Miasma made sense then, and avoid saying "finally we saw the light."

  5.  **Refining the Limitations/Conclusion:**

      *   What can't this solve? The tension between readability (narrative arc) and historical accuracy (messiness). The definition of "progress" itself. The commissioner's own bias.

  6.  **Writing - Section by Section (incorporating constraints):**

      *   *Intro:* Acknowledge the editor's Butterfield card. Set the tone (pragmatic, not pedantic).
      *   *The Procedure:* Four Tests.
          *   *Test 1 (The Arrow of Time):* Look for "finally," "culminated." *Fix:* Cut the adverb, explain the contingency.
          *   *Test 2 (The Question):* Did they ask our question? *Fix:* Reframe their goal.
          *   *Test 3 (The Opposition):* Are the losers stupid? *Fix:* Give them a rational motive.
          *   *Test 4 (The Verdict):* Can we say they were wrong? *Yes,* but distinguish error from stupidity.
      *   *The Cases:* Apply the tests rigorously.
      *   *The Limitations:* Be honest about where the tool breaks.

  7.  **Review against Constraints:**

      *   *British English?* Check (sceptical, programme, centre, honour).
      *   *Jargon?* Define "teleology" if used (better to avoid or explain simply). Let's use "inevitability."
      *   *Word Count/Repairs?* Be specific about cutting "setup" paragraphs.
      *   *Tone?* Professional, slightly weary but constructive (matching the user's persona).
      *   *Editorial Judgment?* Explicitly mark where the editor must decide.

  8.  **Self-Correction during drafting:**

      *   *Initial thought:* Maybe include a scoring system.
      *   *Correction:* No, the prompt explicitly says "I would rather be told where the procedure runs out than given a score." Remove scoring.
      *   *Initial thought:* Allow footnotes for context.
      *   *Correction:* Prompt says "no room for a hedging paragraph or a footnote." Repairs must be cuts/rewrites within the word count.
      *   *Check:* Did I address the "Martyr" case honestly? It needs to hurt. If the piece *is* the martyrdom, the piece might need to die. I should be firm on that.

  9.  **Final Polish:** Ensure the distinction between "Whiggish" (bad) and "Progressive" (acceptable) is clear in Test 4. Ensure the British spelling is consistent throughout. (e.g., *programme, centre, honour, sceptical*).

  *(Self-Correction on Tone)*: The user is a staff writer talking to an editor or creating a tool for the desk. The voice should be collegial but authoritative. "Here is the tool you asked for."

  *(Final check on the "Martyr" case)*: The prompt says "I expect the procedure to hurt." I need to make sure I don't waffle. If the narrative spine is the martyrdom, and that's Whiggish, the spine must break.

  *(Final check on "Improvement")*: Ensure I don't ban saying Germ Theory is better than Miasma. The test must allow for *epistemic improvement* without *historical inevitability*.

