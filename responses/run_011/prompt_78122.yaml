answer: |-
  **TO:** Commissioning Editor
  **FROM:** Staff Writer
  **SUBJECT:** A Decision Procedure for Historical Pitches and Drafts

  You have the Butterfield card on the wall; I have the red pen. We both know the problem. We publish pieces that treat the history of science as a relay race where the baton is 'Truth', and every runner who dropped it is cut from the team photo. The historian's letter last month was correct: we turned a nineteenth-century naturalist into a time-traveller who happened to wear a frock coat.

  We cannot commission academic monographs. We need narratives. But we can stop smuggling inevitability into the syntax. Below is a decision procedure designed for the desk. It takes fifteen minutes on a pitch and thirty on a draft. It is not a scoring system. It is a series of gates. If a text fails a gate, the remedy is specified. If the remedy requires more words than we have, the piece is killed.

  I have marked where this procedure relies on editorial judgment rather than objective fact. Do not hide behind these tests; they are tools, not shields.

  ***

  ### THE PROCEDURE: FOUR GATES

  **Gate 1: The Inevitability Test (Syntax and Structure)**
  *   **The Question:** Does the text imply that the outcome was bound to happen, regardless of the specific people involved?
  *   **Look for:** Adverbs and phrases such as 'finally', 'inevitably', 'only a matter of time', 'culminated in', 'paved the way for', 'the stage was set'. Look for narrative structures where obstacles are merely 'overcome' rather than 'contingently bypassed'.
  *   **Sufficient Answer:** The text acknowledges that things could have gone differently. The discovery appears as an event, not a destination.
  *   **On Failure:**
      *   *Repairable:* If the offending phrases are local (e.g., "Finally, in 1923, he found it"), cut the adverb and replace with the specific condition that allowed it (e.g., "In 1923, funded by a new grant, he found it").
      *   *Structural Rewrite:* If the narrative arc depends on a 'march of progress' (e.g., "Three centuries of error were swept away"), the middle section must be rewritten to show why the 'error' was rational at the time.
      *   *Kill:* If the pitch promises to tell the story of "How we finally solved X," kill it. We are not solving X; we are recounting how they understood X.
  *   **Editorial Judgment:** Distinguishing between 'inevitability' and 'causality'. It is a fact that B followed A; it is a judgment whether A *made* B necessary.

  **Gate 2: The Motivation Test (Anachronism)**
  *   **The Question:** Are the historical actors trying to answer *our* questions, or *theirs*?
  *   **Look for:** Claims that a figure 'anticipated', 'foresaw', or 'predicted' a modern theory. Claims that a researcher was 'ignored' because they were 'ahead of their time' (unless you can prove the technology to verify them literally did not exist).
  *   **Sufficient Answer:** The text explains what the actor was trying to do within their own intellectual framework (e.g., "He sought to classify God's creation," not "He sought to build a phylogenetic tree").
  *   **On Failure:**
      *   *Repairable:* Change the verb. Instead of "He anticipated DNA," write "He identified a hereditary substance which we now call DNA." Cut the claim that he understood its function as we do.
      *   *Structural Rewrite:* If the piece is built on the 'Forgotten Genius' trope (he had the answer but nobody listened), you must shift the focus to *why* the answer was unintelligible then. This usually requires adding 300 words on the contemporary context. If you cannot cut elsewhere to make room, kill the pitch.
      *   *Kill:* If the contributor insists the subject's value lies primarily in their agreement with current consensus.
  *   **Editorial Judgment:** Determining whether a similarity in ideas is substantive or superficial.

  **Gate 3: The Loser Test (Characterisation of Opponents)**
  *   **The Question:** Are the people who disagreed with the protagonist treated as obstacles, villains, or fools?
  *   **Look for:** Descriptions of opponents as 'dogmatic', 'blinded by tradition', 'refusing to look through the telescope'.
  *   **Sufficient Answer:** The opponents are granted a rational motive. Their resistance is explained by evidence available *at the time*, not by their stubbornness.
  *   **On Failure:**
      *   *Repairable:* Add one sentence explaining the opponent's best argument. (e.g., "Semmelweis was rejected not merely due to pride, but because his mechanism contradicted established pathology.")
      *   *Structural Rewrite:* If the drama relies on a 'Hero vs. Villain' dynamic, the conflict must be reframed as 'Theory A vs. Theory B'. This often removes the emotional spine of the piece.
      *   *Kill:* If the contributor refuses to grant the opposition rationality.
  *   **Editorial Judgment:** Assessing whether an opponent was actually negligent or merely conservative.

  **Gate 4: The Verdict Test (Progress and Error)**
  *   **The Question:** Does the procedure forbid us from saying the past was wrong or the present is better?
  *   **Rule:** No. We are not relativists. We can state that a theory was false or that a new method is more effective.
  *   **Sufficient Answer:** The text distinguishes between *being wrong* and *being stupid*. It allows for improvement without implying the improvement was pre-ordained.
  *   **On Failure:**
      *   *Repairable:* If the text refuses to judge the past (antiquarianism), insert a clear statement of current consensus.
      *   *Kill:* Rarely necessary here, unless the piece is so committed to 'everything is relative' that it becomes dishonest about scientific efficacy.
  *   **Editorial Judgment:** This is the balancing point. We must avoid the Scylla of Whiggism (they are us, but slower) and the Charybdis of Relativism (no one is ever wrong).

  ***

  ### APPLICATION TO THREE CASES

  **Case 1: The Precursor (Anniversary Feature)**
  *   **Pitch:** A 1,500-word feature on a forgotten 19th-century naturalist who 'anticipated' plate tectonics. Contributor has family papers showing he mapped fault lines. Narrative spine: "He knew it all along."
  *   **Application:**
      *   *Gate 1 (Inevitability):* **Fail.** The spine implies the theory was waiting to be found.
      *   *Gate 2 (Motivation):* **Fail.** 'Anticipated' suggests he was doing modern geology. He was likely doing natural theology or descriptive geography.
      *   *Gate 3 (Losers):* **Pass.** (Assuming contemporaries are just 'neglectful').
      *   *Verdict:* **Structural Rewrite Required.**
  *   **Remedy:** The contributor must cut the claim that he 'anticipated' the theory. He observed phenomena that *fit* the theory. The narrative must shift from "Why didn't they listen to him?" to "Why did his observations make sense within a different framework?"
  *   **Word Count Impact:** You will lose the 'tragedy of neglect' angle (approx. 400 words). You must gain 400 words on the geological consensus of the 1870s. If the contributor cannot access that context without bloating the draft, **Kill**. The exclusive family papers are a trap; they encourage the 'great man' view.

  **Case 2: The Martyr (Profile of Rehabilitated Researcher)**
  *   **Pitch:** A profile of a researcher whose correct idea was rejected, now being vindicated. The hook is her persecution and subsequent 'martyrdom' for the truth.
  *   **Application:**
      *   *Gate 1 (Inevitability):* **Fail.** Implies truth always wins eventually.
      *   *Gate 2 (Motivation):* **Fail.** 'Martyr' implies she suffered for *our* truth, not her own.
      *   *Gate 3 (Losers):* **Fail.** The 'persecution' frame necessitates villains. It rarely allows for rational scientific scepticism.
      *   *Verdict:* **Kill the Frame.**
  *   **Remedy:** This will hurt. The 'Martyr' frame is likely 60% of the word count and 100% of the emotional appeal. You cannot repair this with a sentence. You must ask the contributor to rewrite the piece as a study of *community standards*, not individual suffering.
  *   **Salvage:** Can we publish the biography without the moral victory? Yes, if the focus shifts to the social mechanisms of rejection. Was she rejected because she was right, or because she was abrasive, or a woman, or outside the network? If the contributor insists the *only* reason was her correctness, **Kill**. That is hagiography, not history. We can publish a tragedy, but not a sermon.

  **Case 3: The Discredited Framework (Medical History)**
  *   **Pitch:** The collapse of Miasma Theory and the rise of Germ Theory. The contributor wants to say Germ Theory was an 'improvement' and Miasma was 'wrong'.
  *   **Application:**
      *   *Gate 1 (Inevitability):* **Check.** Watch for "Finally, science discovered the truth."
      *   *Gate 2 (Motivation):* **Check.** Did Miasma theorists ask the wrong questions? No, they asked the right questions with the wrong tools.
      *   *Gate 3 (Losers):* **Check.** Were Miasma proponents stupid? No, they observed correlation (smell and disease) accurately.
      *   *Gate 4 (Verdict):* **Pass.** We can say Germ Theory is better.
      *   *Verdict:* **Pass with Conditions.**
  *   **Remedy:** The piece is defensible *if* it explains why Miasma was a rational conclusion given the evidence of the 1850s. The 'improvement' must be framed as epistemic (better tools, better data), not moral (we are smarter).
  *   **Constraint:** Ensure the text does not imply Miasma theory contributed *nothing*. It drove sanitation reforms which saved lives regardless of the mechanism. Cut any paragraph that dismisses the utility of the 'wrong' theory.

  ***

  ### LIMITATIONS OF THE PROCEDURE

  This tool is not a tribunal. It cannot settle the following:

  1.  **The Distinction Between 'Our Questions' and 'Theirs':** Historians dispute where this line is drawn. Did Darwin intend to explain genetics? No. Did he intend to explain inheritance? Yes. A commissioner must judge whether a link is a legitimate lineage or a forced connection. The procedure flags the risk; it does not adjudicate the nuance.
  2.  **Narrative vs. Accuracy:** A clean story is often Whiggish. A truly accurate story is often messy and boring. This procedure may demand a rewrite that makes a piece less 'punchy'. You must decide if a duller, honest piece is better than a lively, misleading one. I argue it is, but the procedure cannot prove that.
  3.  **The Tension of Judgment:** Gate 4 permits us to say the past was wrong. Gate 2 warns us not to judge them by our standards. In a single draft, these will pull in opposite directions. For example: "Pasteur was right, but Lister was not wrong to doubt him." The procedure identifies the tension but does not resolve the syntax. You will have to edit for balance by ear.
  4.  **Commissioner Bias:** This procedure assumes the commissioner wants to avoid Whiggism. If you decide that a 'Great Man' narrative sells more copies, this checklist will not stop you. It only tells you what you are sacrificing.

  Use this to clear the weeds, not to plant the garden. The contributors bring the history; we ensure it isn't a mirror.
