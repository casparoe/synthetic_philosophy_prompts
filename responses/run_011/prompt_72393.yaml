  I'm a software engineer, and I've never taken a philosophy or a sociology course, so please don't assume technical vocabulary on my part — but don't avoid it either: if a term genuinely applies to what I'm describing, name it and gloss it in a single clause.

  Last month two friends of mine argued for the better part of an hour at a dinner I was sitting at, and I still can't tell you who was winning. It started from a chart in a magazine article claiming that members of Gen Z report worse mental health than any previous generation did at the same age. I didn't take a side, and I'm deliberately not going to tell you which of them sounded more persuasive to me, because I honestly don't know — that's what I want from you.

  Dana and Marcus, roughly in their own words:

  1. **Dana:** That chart compares a 19-year-old today with a 65-year-old today and calls the gap generational. But being 19 and being 65 are different situations — different stakes, different social roles, different willingness to admit distress to a survey. Until you hold age constant, the chart is perfectly consistent with generations being alike and age doing all the work.

  2. **Marcus:** Age *is* held constant in the comparisons that matter: how 19-year-olds score now versus how 19-year-olds scored in 1994 or 2004. Those same-age gaps have widened over time. So something about the birth window itself changed people, and "generation" is the name for that.

  3. **Dana:** Grant the effect; the label still isn't the right unit. Nobody is transformed by crossing a line a polling organization happened to draw at 1997 — that cutoff is a convention, not a discovery — and the things that actually do the explaining (a smartphone at twelve, tuition levels, entering the job market during a pandemic) vary continuously and cut right across it. If you had panel data following the same individuals for decades, you'd model their exposures, and the cohort variable would drop out of the model. "Gen Z" survives because a name travels better than a coefficient.

  4. **Marcus:** Two answers. Fuzzy boundaries don't make a category unreal — "tall" and "middle-aged" have no sharp edges either, and there's plainly something there. And the label isn't inert: employers, marketers, and politicians now plan around "Gen Z," and being planned around changes how those people see and present themselves, so the category partly constitutes what it describes. That self-reinforcement is exactly why it's a real feature of the world rather than a bookkeeping convenience.

  Here's what I'd like you to do. Rate each of the four moves on this scale — clearly mistaken, mostly mistaken, mixed, mostly right, clearly right — and justify each rating in a sentence or two. Rate the strongest version of what each of them was saying, not the sloppiest phrasing they happened to use, and don't let a move inherit credit or blame from the move it's replying to; where a move depends on an empirical claim that is itself contested, say so rather than granting it.

  Then use a fifth item to tell me which of the two is more right overall, and to name the single most important consideration that neither of them raised — the one that, if it had come up at the table, would most have changed how the argument went.

  Format: exactly five numbered items, one or two sentences each, with no introduction, no conclusion, and no framing remarks before or after the list.
