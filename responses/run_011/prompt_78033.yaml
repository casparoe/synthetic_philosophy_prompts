answer: |-
  Here is the translation of the Gibbard-Satterthwaite theorem into the vocabulary of craft, followed by the residue analysis you asked for.

  ### The Translation

  **The Social Choice Function = The Scene Logic**
  In the theorem, a "social choice function" is the machine that takes everyone's input and spits out a winner. In your novel, this is the *logic of the meeting*. It isn't just Robert's Rules; it is the dramatic causality. If Councilor A speaks, then Councilor B reacts, then the vote is called. It is the set of constraints that determines how the collective decision is reached. If your scene is written such that the outcome is determined by the strength of the arguments, that's one function. If it's determined by vote-counting, that's another. If it's determined by who has leverage over whom, that's a third.

  **Strategy-Proof = The Absence of Subtext**
  A voting rule is "strategy-proof" if no voter can ever benefit by lying about their preferences. In narrative terms: A scene is strategy-proof if every character achieves their best possible outcome by stating their true desire aloud.
  If your Councilor wants the land to be a park, but knows that arguing for "park" will get her outvoted, so she argues for "heritage site" instead (knowing "heritage" is the second-best option and more popular), she is strategizing.
  The theorem says: You cannot write a meeting with nine independent agents and three or more outcomes where everyone is honest *and* the result isn't controlled by one person. If everyone is honest, the system breaks. If the system works, someone is lying.

  **The Dictator = The Structural Pivot**
  In the math, a "dictator" isn't necessarily a tyrant with a gun. It is a voter whose top preference *always* becomes the group's decision, regardless of what the others want.
  On the page, the "dictator" is the character whose internal arc is structurally privileged over the ensemble. If the theme of the book is "Greed Corrupts," and the vote *must* go to the developer for the theme to land, then the Councilor voting for the developer is the dictator. The other eight councilors are essentially set dressing; their votes don't actually matter to the function. The outcome is fixed to their preference.
  If you want a genuine ensemble where any of the nine could win, the theorem says you *must* have insincere argumentation.

  **The Three Options = The Triangulation of Conflict**
  Why three? With two options (Yes/No, Park/Condos), you have a binary fight. You count heads. Lying doesn't help much; if you prefer Park, you vote Park.
  With three options (Park, Condos, Heritage Site), you have cycles.
  *   Group A prefers Park > Condos > Heritage.
  *   Group B prefers Condos > Heritage > Park.
  *   Group C prefers Heritage > Park > Condos.
  If you vote Park vs. Condos, Park wins. If you vote Condos vs. Heritage, Condos wins. If you vote Heritage vs. Park, Heritage wins. It spins forever.
  In story terms: Two options is a duel. Three options is a web. The "three" represents *complexity of motive*. As long as your council is arguing binary (Build vs. Don't Build), the scheming is simple. As soon as a third viable use for the land enters the room, the logic becomes unstable, and characters *must* scheme to prevent the cycle from spinning out of control. They lie to collapse the options back to a binary they can win.

  ***

  ### The Residue

  You asked for blunt. Here is what falls out of the translation, and where the theorem fails you.

  **1. Fixed Preferences vs. Character Arcs**
  The theorem assumes preferences are fixed inputs. Councilor A likes Park best, always. The math does not know what it means to change your mind.
  *   **The Verdict:** This is a category error. The theorem is about *aggregation*, you are writing about *transformation*.
  *   **The Craft Implication:** The theorem isn't about people; it's about systems. It describes a snapshot, not a movie. However, this is useful for your *middle act*. In the middle of a book, characters often dig in. They entrench. For the duration of the council scenes, treat their desires as fixed. If they change their minds mid-scene without new information, it feels like bad writing. If they change their *arguments* while keeping their *goals* fixed (the strategizing you described), that is high-tension drama.
  *   **Blunt Truth:** The theorem assumes robots. You write humans. But for the specific mechanic of the vote, pretend they are robots. If they are fluid, the vote doesn't matter. If the vote matters, they must be rigid.

  **2. The Single Axis (Median Voter) vs. The One Wound**
  Your hunch is correct. If every character's preference can be arranged on a single line (e.g., from "Most Development" to "Least Development"), the Median Voter Theorem applies. The person in the middle controls the outcome. Manipulation becomes much harder.
  *   **The Verdict:** This corresponds to *Thematic Unity*.
  *   **The Craft Implication:** If your council feels "orderly," it's likely because everyone is arguing about the same thing (e.g., Money). If you want the Gibbard-Satterthwaite chaos (where scheming is necessary and inevitable), you need *orthogonal* conflicts.
      *   Councilor 1 cares about Money.
      *   Councilor 2 cares about Legacy.
      *   Councilor 3 cares about Love (a developer is their spouse).
      *   Councilor 4 cares about Votes (re-election).
  When preferences are multi-dimensional, there is no "middle." There is only a battlefield.
  *   **Blunt Truth:** If your novel is "quietly like that" (single axis), your conflict is too simple. A single wound makes for a clean theme but a predictable plot. To make the council scenes sing with the anxiety of the theorem, you need to ensure their motivations are *incommensurable*. They shouldn't just want different amounts of the same thing; they should want different *things* entirely.

  **3. The Author as Dictator**
  You are not the dictator in the Gibbard-Satterthwaite sense. The theorem's dictator is a player *inside* the game whose preference function dictates the output. You are the *designer* of the game.
  *   **The Verdict:** You are flattering yourself, but not in the way you think.
  *   **The Craft Implication:** If you decide the outcome before you write the scenes, and then force the characters to vote that way, you haven't created a Dictator character; you've created a *Rigged Function*. That is the definition of a plot hole or a deus ex machina.
  *   **The Real Dictator:** The "dictator" in your book must be a character. If the story *requires* the waterfront to become a park for the ending to work, then the character who wants the park must be structurally empowered to win, regardless of the other eight. Maybe they have blackmail. Maybe they have the narrative focus.
  *   **Blunt Truth:** If you manipulate the vote from the outside, the scene feels fake. If you allow the vote to be genuine, one character will emerge as the dictator (the one whose will prevails). If you want an ensemble outcome where no one dictates, you *must* write the strategizing. You cannot have an honest vote among nine people with three options and a surprise ending. One of those four things has to give.

  ### Summary for the Draft

  The theorem tells you this: **You cannot have an honest ensemble vote on a complex issue.**

  If you want the council to feel real, stop trying to make them argue for what they truly want. Lean into the lie. Let them argue for the "Heritage Site" when they want the "Park." Let the reader know what they truly want (dramatic irony), and let the tension come from whether their bluff will hold.

  If you try to make them all honest, you will either end up with a boring binary fight (two options) or you will accidentally make one character the dictator (the one who wins despite the odds). The math proves that the scheming you are already writing isn't just realistic; it's structurally necessary.
