      *   *Narrative Translation:*
          *   Voters -> Characters with agency.
          *   Alternatives -> Plot outcomes (Build park? Sell to devs? Keep industrial?).
          *   Social Choice Function -> The Scene/Meeting Structure (Robert's Rules, the vote count, the narrative logic that determines the ending).
          *   Strategy-proof -> "Honest Scene." A scene where saying what you truly want is the best way to get it.
          *   Dictator -> The Character whose will *must* prevail regardless of others (not necessarily a tyrant, but the structural pivot).
          *   3 Alternatives -> Complexity. Binary choices are easy; triangulation creates paradox.

  3.  **Drafting the Translation (The "Faithful" Part):**
      *   *Social Choice Function:* It's the "Rules of the Scene." Not just Robert's Rules, but the dramatic logic. If Character A says X, and Character B says Y, how does the story decide Z happens?
      *   *Strategy-Proof:* A story where no character ever needs to subtext. If they want the park, they argue for the park, and that argument is their best move. G-S says this is impossible (unless there's a dictator).
      *   *The Dictator:* In math, it's a function $f$ where outcome = Dictator's preference. In a novel, it's the Protagonist or the Antagonist whose internal arc *forces* the external result. If the council votes, but the outcome *must* align with Councilor X's arc for the theme to work, Councilor X is the dictator.
      *   *Three Options:* Why 3? Binary is conflict (Yes/No). Ternary is *politics* (Yes/No/Maybe, or Park/Condos/Marina). With 2 options, you just outvote. With 3, you can split the vote, trade, cycle. In story terms: Binary is a duel; Ternary is a web.

  4.  **Addressing the "Residue" (The "Blunt" Part):**
      *   *Question 1: Fixed Preferences.*
