      *   *Question 2: Single Axis (Median Voter).*
          *   Math: Preferences on a line (Left < Center < Right).
          *   Fiction: "One Wound." If every councilor's stance on the land is determined by *one* underlying trauma (e.g., "Safety" vs. "Profit"), it collapses to a line.
          *   *Verdict:* Hunch is real. If the conflict is one-dimensional, the scheming feels "orderly." To make it messy (and realistic per G-S), you need orthogonal conflicts (e.g., one cares about money, one about legacy, one about love).
      *   *Question 3: The Author as Dictator.*
          *   Math: Dictator is inside the system.
          *   Fiction: Author is outside the system (God).
          *   *Verdict:* You are not the G-S dictator. You are the *function*. The G-S dictator is a character *within* the logic who overrides others. If you force an outcome against character logic, that's bad writing (deus ex machina), not G-S dictatorship. If a character's will structurally overrides others, *they* are the dictator.

