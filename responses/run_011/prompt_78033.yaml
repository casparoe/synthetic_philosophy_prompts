      *   *Check:* Is the distinction between Author and Dictator clear? *Adjustment:* Use the "Rules of the Game" vs. "Player" analogy.

  7.  **Final Polish:** Check against constraints (no citations, no flattery, blunt). Ensure the translation feels useful for the specific "waterfront land" plot. (e.g., mention Park vs. Condos vs. Heritage Site).

  8.  *(Final thought before generating)*: The user is smart. They know the math is a metaphor. They want to know if the metaphor holds water. I need to validate the metaphor without over-selling the math. The math describes *僵局* (deadlock/stalemate mechanics), the novel describes *resolution*.

