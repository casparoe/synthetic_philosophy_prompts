      *   **Tone:** Blunt, no flattery, no bibliography/citations, practical craft focus.

  2.  **Deconstruct Gibbard-Satterthwaite (G-S) for Translation:**
      *   *Core components:*
          *   Voters (Council members).
          *   Alternatives (Outcomes for the land).
          *   Social Choice Function (The voting rule/process).
          *   Strategy-proofness (No lying about preferences helps you).
          *   Dictatorship (One person dictates the outcome).
