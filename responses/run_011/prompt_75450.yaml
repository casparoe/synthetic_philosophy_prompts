  (1) **Bottom line**
  Rejected. I am 85% confident this will not pass in its current form. The committee prioritizes guaranteed operational control at the point of death over methodological equivalence, and your client's audit plan is too weak to bridge that gap.

  (2) **The candidate rules**
  Three core principles emerge from the precedents. First, **Controlled Point of Death**: killing must occur within certified operational boundaries (supported by Precedent 7's "on-farm" specification; contradicted by the client's off-site proposal). Second, **No Live Consumer Interface**: animals cannot enter spaces where consumers might handle or cook them alive (supported by Precedents 1 and 2). Third, **Transport vs. Destination**: live transport is permissible only if the destination guarantees immediate, certified killing (supported by Precedent 6). 

  There are also negative rules. **Invasive Procedure Ban**: certain interventions are prohibited regardless of analgesia (Precedent 3 kills the rule that "anaesthesia validates all procedures"). **Reversible Stress**: brief stressors are allowed if recovery is immediate (Precedent 5). A tempting but killed rule is "No live transport whatsoever," which Precedent 6 explicitly disproves. Another killed rule is "Only mechanical killing allowed," disproven by Precedent 7's manual cut. The committee distinguishes between "process steps" (transport, grading) and "supply chain boundaries" (farm vs. restaurant). They prioritize systemic guarantees over methodological equivalence. The lack of data on audit compliance is a secondary but fatal flaw under the Controlled Point of Death principle. The standards imply that welfare assurance ends where certification control ends.

  (3) **What each rule says about my client**
  Under **Controlled Point of Death**, the client fails. Precedent 7 specifies "on-farm," implying direct certification oversight at the moment of death. Restaurants are outside this boundary. Under **No Live Consumer Interface**, the proposal is high-risk. Precedent 2 rejected "fresh to order" boiling on-site; sending live shrimp to restaurants enables exactly this downstream, even if contracted otherwise. **Transport vs. Destination** is the client's strongest point; Precedent 6 allows 10-hour live transport. However, Prec 6 likely assumes transport to a processor, not a kitchen. The 12-hour hold plus transport likely exceeds the stress limits of Prec 6 anyway. The audit plan (2x/year, no data) is insufficient to satisfy Principle 1's requirement for guaranteed control. The colleague's "Sentience Act" theory is too broad (killed by Prec 6), but the underlying caution about live animals leaving certified control is correct. The client's argument that "harm is identical" ignores the risk of non-compliance outside the farm gate.

  (4) **My best guess, and why that rule**
  Verdict: Rejected. The governing rule is **Controlled Point of Death**. Precedent 7 is the key differentiator: it approves the cut method specifically "on-farm." If the method were universally approved, the location wouldn't matter. Precedent 2 reinforces this by rejecting "fresh to order" killing even on a processing site, signaling that demand-driven killing of live animals is unacceptable. The committee values certainty over flexibility. Your client's reliance on contracts and sparse audits cannot match the certainty of on-farm killing. Precedent 6 allows transport, but never implies transport to a non-certified endpoint. The lack of compliance data makes the proposal speculative. The committee will not certify a system where welfare depends on a restaurant chef's compliance during a dinner rush.

  (5) **The case that would settle it**
  To split **Controlled Point of Death** from a stricter "On-Farm Only" rule, ask about two scenarios. First: Transporting live shrimp to a certified central slaughterhouse (not on-farm) for immediate killing. Second: Transporting live shrimp to a retail tank where staff kill them behind the counter before handing to customers. If the first is approved and the second rejected, the rule is "Certified Control at Death," not "On-Farm Only." This clarifies if restaurants could qualify if they were themselves certified processing sites, or if the boundary is strictly the farm gate.

  (6) **How to re-file it**
  Re-file proposing on-farm killing immediately after harvest, or transport to a certified central processing facility only. Remove the restaurant killing component entirely. Ship dead, chilled product (per Precedent 4) if live transport isn't essential. This invites the committee to adopt the principle: "Certification covers the point of death, requiring direct operational control or certified processing partners." It aligns with Precedent 7 and avoids the Precedent 1/2 risks. It sacrifices supply chain flexibility but guarantees the welfare outcome the committee prioritizes.
