answer: |-
  Here is the sorting instrument you requested. It is built from the logical space of the decision problem, not from the history of the ideas. The questions are phrased for an ordinary intuition; the technical commitments are bracketed.

  ### The Decision Tree

  **Node 1:** "Are you deciding for yourself alone, or for the pair of you together?"
  *[Unit of Agency: Individual vs. Collective]*

  *   **If "For the pair":** Go to Node 2.
  *   **If "For myself":** Go to Node 3.

  **Node 2:** "Does the pair want to maximize the total points, or follow a rule both could accept?"
  *[Collective Consequentialism vs. Collective Deontology]*

  *   **If "Maximize points":** Leaf A (Team Reasoning).
  *   **If "Follow a rule":** Leaf B (Social Contract/Collective Duty).

  **Node 3:** "If you changed your choice, would their choice change because you *made* it change, or not at all?"
  *[Belief in Causal Dependence vs. Causal Independence]*

  *   **If "I made it change":** Go to Node 4. *(Note: This assumes a non-standard PD where you have leverage.)*
  *   **If "Not at all":** Go to Node 5. *(Note: This is the standard PD assumption.)*

  **Node 4:** "Since you control them, do you make them cooperate to get points, or defect to punish them?"
  *[Instrumental Control vs. Malicious Control]*

  *   **If "Cooperate":** Leaf C (Benevolent Control).
  *   **If "Defect":** Leaf D (Tyrannical Defection).

  **Node 5:** "Even if you don't change their choice, does your choice tell you what they chose?"
  *[Evidential Correlation vs. Causal Independence]*

  *   **If "Yes, it tells me":** Go to Node 6.
  *   **If "No, it tells me nothing":** Go to Node 7.

  **Node 6:** "Does it tell you because you are effectively the same mind, or just because you think alike?"
  *[Logical Identity vs. Statistical Similarity]*

  *   **If "Same mind":** Go to Node 8.
  *   **If "Think alike":** Go to Node 9.

  **Node 7:** "Do you defect to get the best score, or follow a rule even if it costs points?"
  *[Instrumentalism vs. Deontology]*

  *   **If "Best score":** Leaf E (Plain Defection).
  *   **If "Follow a rule":** Leaf F (Kantian Individual).

  **Node 8:** "Are you choosing a single move, or the method that generates the move?"
  *[Act vs. Algorithm]*

  *   **If "Single move":** Leaf G (Naive Superrationality).
  *   **If "The method":** Go to Node 10.

  **Node 9:** "Are you choosing a single move, or the method that generates the move?"
  *[Act vs. Rule]*

  *   **If "Single move":** Leaf H (Evidential Decision Theory).
  *   **If "The method":** Leaf I (Rule Utilitarianism).

  **Node 10:** "Do you pick that method because it wins, or because everyone should use it?"
  *[Functional Consequentialism vs. Moral Universalizability]*

  *   **If "Because it wins":** Leaf J (Functional Decision Theory).
  *   **If "Everyone should use it":** Leaf K (Kantian Universal).

  ***

  ### The Leaves (Positions)

  *   **Leaf A: Team Reasoning.** You maximize the group's payoff. Cooperation is rational because "we" are the agent.
  *   **Leaf B: Collective Duty.** You cooperate because it is the only rule the "team" could rationally endorse, regardless of specific payoff in this instance.
  *   **Leaf C: Benevolent Control.** (Theoretical) You have causal power over the other and force cooperation for mutual gain.
  *   **Leaf D: Tyrannical Defection.** (Theoretical) You have causal power and force defection to dominate.
  *   **Leaf E: Plain Defection.** Pre-theoretic intuition. No link exists; defecting dominates.
  *   **Leaf F: Kantian Individual.** You follow a personal maxim (e.g., "do not exploit") even if causally independent.
  *   **Leaf G: Naive Superrationality.** Hofstadter's early formulation. You cooperate because you are identical, treating the choice as a single logical event.
  *   **Leaf H: Evidential Decision Theory (EDT).** You cooperate because your choice is *news* that they likely cooperated too (statistical correlation).
  *   **Leaf I: Rule Utilitarianism.** You follow the rule that, if generally followed by similar people, yields the best results.
  *   **Leaf J: Functional Decision Theory (FDT).** You choose the output of your decision *algorithm*. Since you run the same algorithm, your output logically determines theirs.
  *   **Leaf K: Kantian Universal.** You cooperate because the maxim of your algorithm must be universalizable law, not just because it wins.

  ***

  ### Empty Cells and Incoherencies

  You asked which combinations of the logical space are empty. In a rigorous assay, these are the controls that fail to grow.

  1.  **Causal Link + Defection (Leaf D variant):**
      *   *Status:* **Unappealing / Non-Standard.**
      *   *Why:* If you believe your choice *causes* theirs (Node 3 "Yes"), defecting implies you are causally forcing them to defect. If your goal is points (Node 4), this is irrational (you force a mutual loss). This cell is only occupied by agents with malicious utility functions (wanting the other to lose more than they want to win). In standard game theory, this cell is empty because causal independence is an axiom of the Prisoner's Dilemma.
  2.  **No Correlation + Cooperate (Node 5 "No" + Cooperate):**
      *   *Status:* **Incoherent (Magical Thinking).**
      *   *Why:* If there is no causal link and no evidential link, cooperating reduces your expected utility with no counterbalancing logic. This is "wishful thinking," not a decision theory. No serious theorist defends this.
  3.  **Logical Identity + Algorithm + Defect (Node 8/10 + Defect):**
      *   *Status:* **Unstable.**
      *   *Why:* If you acknowledge you are logically identical and choose an *algorithm*, you cannot defect while expecting them to cooperate. The algorithm outputs the same for both. You can *choose* the "Defect Algorithm," but that leads to mutual defection. While logically possible, it is pragmatically dominated by the "Cooperate Algorithm" in a symmetric PD. It is rarely defended as an optimal strategy, only as a failure mode.

  ***

  ### Indistinguishable Leaves

  You suspected some positions give the same verdict in this specific game but differ elsewhere. Your suspicion is correct. The Prisoner's Dilemma is too blunt an instrument to separate these.

  1.  **Superrationality (G) vs. Functional Decision Theory (J):**
      *   *Verdict in PD:* **Identical (Cooperate).**
      *   *The Split:* **Newcomb's Problem / Asymmetric Games.** Hofstadter's Superrationality is often vague on *how* the identity is enforced (psychological vs. logical). FDT specifies it as a logical fact about the computation. In Newcomb's Problem, EDT one-boxes, CDT two-boxes. FDT one-boxes. Superrationality one-boxes. They split when the symmetry is broken (e.g., one player knows the other's source code, but not vice versa). FDT handles this; naive Superrationality often struggles.
  2.  **Kantian Universal (K) vs. Team Reasoning (A):**
      *   *Verdict in PD:* **Identical (Cooperate).**
      *   *The Split:* **Unfair Distributions.** If "We" can win more by exploiting a third party, Team Reasoning (Consequentialist) might say "Exploit." Kantian Universal (Deontological) says "No, that rule cannot be universalized." They diverge when group utility conflicts with moral law.
  3.  **Evidential Decision Theory (H) vs. Superrationality (G):**
      *   *Verdict in PD:* **Identical (Cooperate) — *if* correlation is high.**
      *   *The Split:* **The Source of Correlation.** EDT cooperates if $P(They=C | I=C)$ is high, even if we are just similar strangers. Superrationality requires the stronger claim that we are *logically* the same. In a case where you are similar but know you are *not* identical (e.g., you have different information), EDT might still cooperate, while Superrationality/FDT would defect.

  ***

  ### State of the Field: What is Settled?

  You asked for honesty about consensus. As a scientist, you know the difference between a textbook fact and a preprint.

  1.  **The Majority View:** **Causal Decision Theory (CDT) / Defection.**
      *   *Confidence:* **High.** In standard economics and classical game theory, the Nash Equilibrium (Defect/Defect) is the settled solution. CDT is the formal justification for this. If you walk into a standard economics department, superrationality is treated as a curiosity or a error, not standard theory.
  2.  **The Contested View:** **Evidential & Functional Decision Theory.**
      *   *Confidence:* **Medium.** In philosophy of decision and AI safety research, CDT is heavily criticized for "leaving money on the table" in Newcomb-like problems. FDT (and its precursor TDT) is a serious competitor, but it is not "settled." It is an active research program.
  3.  **Superrationality's Status:**
      *   *Confidence:* **Low (as formal theory).** Hofstadter's argument is widely read but rarely cited in formal papers *as* "Superrationality." It has largely been absorbed and formalized into **Functional Decision Theory** or **Timeless Decision Theory**. If you cite "Superrationality" today, many will hear "Informal FDT."
  4.  **Team Reasoning:**
      *   *Confidence:* **Medium (in Social Sciences).** In psychology and sociology, "We-mode" reasoning is well-supported empirically (people *do* act this way). In normative decision theory (how they *should* act), it remains controversial whether it is rational or just a preference change.

  **Summary:** The "textbook" answer is Defection (CDT). The "live debate" is between FDT/Superrationality (Cooperate via logic) and Team Reasoning (Cooperate via agency shift). There is no consensus that Superrationality has overturned standard game theory, but there is a growing consensus that CDT is incomplete for agents that can model each other (like AIs, or humans reading Hofstadter).
