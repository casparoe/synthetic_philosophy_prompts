  3.  **Evaluate Claims against Williams's Actual Texts (primarily "A Critique of Utilitarianism" in *Utilitarianism: For and Against*):**

      *   *Claim 1 ("Asks too much"):* This is usually associated with Peter Singer or the "demandingness objection." Williams's critique is more about *integrity* and *identity* than mere demandingness. He worries about the alienation of the agent from their actions. *Verdict:* Misleading simplification.
