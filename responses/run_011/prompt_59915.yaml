answer: |-
  Here is a line-by-line breakdown of the passage, followed by an analysis of the two specific conceptual points you flagged, and a final recommendation on whether to include it in your seminar packet.

  ### Line-by-Line Analysis

  **1. "Williams's complaint is that utilitarianism asks too much."**
  *   **Verdict:** **Misleading Simplification.**
  *   **Analysis:** This phrasing aligns Williams with the "demandingness objection" (often associated with Peter Singer or Richard Miller), which argues utilitarianism requires too much *sacrifice*. Williams's critique is distinct; it is about **integrity**. He argues utilitarianism alienates the agent from their own actions and commitments, making them a mere channel for the satisfaction of others' utilities. It's not just that it asks for *more*, but that it asks for the wrong *kind* of psychological engagement.

  **2. "It makes you abandon your own projects whenever doing so would produce a bit more good, so that nothing is left for the person to live from."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Analysis:** This captures the spirit of Williams's "ground projects" argument. Williams argues that our "ground projects" give us reason to live. If utilitarianism requires us to hold these projects contingently (i.e., only keep them as long as they maximize utility), it attacks the integrity of the person. "Nothing is left" is hyperbolic, but for a survey summary, it passes.

  **3. "A man can pull only one of two people out of the water and one of them is his wife: Williams says that if he stops to work out whether saving her maximizes utility he has had one thought too many..."**
  *   **Verdict:** **Roughly Accurate.**
  *   **Analysis:** This is a fair paraphrase of the setup. Williams does suggest that introducing a utilitarian calculation here is absurd.

  **4. "...and that the decent thing is just to act, since a morality that makes you check first isn't worth having."**
  *   **Verdict:** **Flatly Rejected (by Williams).**
  *   **Analysis:** This mangles the point. Williams is not offering a rival rule ("Just act on impulse!"). He is making a point about **justification**. His claim is that if the *only* moral justification available for saving your wife is "it maximizes utility," then the moral theory has failed to capture the nature of personal relationships. He isn't saying the husband *shouldn't think*; he's saying the *moral theory* shouldn't require that thought as a justification. The summary turns a meta-ethical point about justification into a first-order rule of conduct.

  **5. "And Jim, offered the chance to shoot one protester so that the other nineteen are released, should refuse on grounds of integrity even though nineteen people die..."**
  *   **Verdict:** **Flatly Rejected (by Williams).**
  *   **Analysis:** Williams explicitly **refuses** to tell Jim what to do. In *A Critique of Utilitarianism*, Williams presents the dilemma to show the cost of utilitarianism. He says that if Jim shoots, he is being a good utilitarian but violating his integrity. If he refuses, he preserves his integrity but is responsible (in the utilitarian calculus) for the deaths of the nineteen. Williams validates Jim's "revulsion," but he does not issue a verdict that Jim *should* refuse. He leaves the conflict unresolved to highlight the absurdity of the utilitarian demand.

  **6. "...which shows the doctrine of negative responsibility is simply false, because you are never responsible for what other people choose to do."**
  *   **Verdict:** **Flatly Rejected.**
  *   **Analysis:** Williams does not argue that negative responsibility is "simply false" as a general metaphysical claim (e.g., "I am never responsible for omissions"). His argument is that the **utilitarian version** of negative responsibility is unacceptable because it erases the distinction between what *I* do and what *happens*. He argues that making me responsible for the actions of others (the captain shooting the nineteen if I don't shoot the one) invades my integrity. The summary's claim ("you are never responsible") is far too strong and philosophically indefensible; Williams's claim is that utilitarianism extends responsibility too far, not that it doesn't exist.

  **7. "So utilitarianism isn't merely hard to live with, it's refuted: any theory that treats your own commitments as one more input to an optimization problem fails."**
  *   **Verdict:** **Williams Would Accept.**
  *   **Analysis:** Despite the errors leading up to it, this concluding sentence is actually an excellent summary of Williams's core objection. It captures the idea that utilitarianism renders the agent's own commitments impersonal.

  ---

  ### Pinning Down the Two Big Questions

  #### 1. What is the "One Thought Too Many" remark really about?
  The survey chapter treats this as a heuristic for decision-making (i.e., "Don't calculate, just save her"). Williams would reject this.

  For Williams, the remark is about the **structure of moral justification**. He is attacking the idea that a moral theory must provide the *motivating reason* for every action. In the drowning case, the husband saves his wife because she is his wife. That is a sufficient reason. If utilitarianism insists that the *moral* reason must be "saving her produces the best overall consequences," it alienates the agent from the relationship. It turns the wife into a vessel of utility rather than a beloved person.
  *   **Correction:** The point isn't that thinking is forbidden; it's that a moral theory that cannot accommodate non-utilitarian motivations for personal acts is deficient.

  #### 2. What work is "Negative Responsibility" doing in the Jim argument, and does Williams give a verdict?
  **Negative Responsibility** is the doctrine that I am responsible for the consequences of my actions *and* the consequences of my inactions (what I allow to happen). In the Jim case, utilitarianism uses negative responsibility to argue that if Jim refuses to shoot the one, he is responsible for the captain shooting the nineteen.

  *   **What work is it doing?** It is the mechanism by which utilitarianism invades Jim's integrity. It collapses the distinction between "Jim's project" (not killing) and "The World's State" (fewer deaths). Williams uses it to show that utilitarianism makes the agent responsible for the actions of others (the captain), which attacks the agent's identity.
  *   **Does Williams give a verdict?** **No.** This is the most critical error in the summary. Williams does not say Jim should refuse. He says utilitarianism *requires* Jim to shoot, and that this requirement is what makes utilitarianism repugnant. He wants the reader to feel the conflict, not to resolve it with a rule. By saying Jim "should refuse," the summary turns Williams into a deontologist, which he explicitly denies being.

  ---

  ### Does the Last Sentence Survive?
  **Yes.**
  Once you strip away the errors regarding the "verdict" on Jim and the "rule" about the drowning wife, the final sentence remains robust: *"Any theory that treats your own commitments as one more input to an optimization problem fails."* This is a genuine Williams-ism. It accurately reflects his view that utilitarianism fails to respect the boundary between the self and the world.

  ### Recommendation for the Packet

  **Do not include this paragraph as-is.**
  For a grad seminar on moral theory, this passage is dangerous. It contains three significant errors that your students will likely be tested on or expected to critique:
  1.  It conflates Williams with the demandingness objection.
  2.  It claims Williams gives a normative verdict in the Jim case (he doesn't).
  3.  It claims Williams denies negative responsibility simpliciter (he denies the utilitarian extension of it).

  If your students read this before reading Williams, they will misunderstand the primary texts. If they read it after, they will be confused by the discrepancies.

  **Option A (Best):** Ask your colleague to revise it. The errors are correctable without changing the length.
  **Option B (Acceptable):** Include it **only with a substantial headnote or footnote** written by you. You would need to explicitly flag that the summary simplifies the "one thought" argument into a rule of action and incorrectly attributes a deontological verdict to the Jim case.

  **Suggested Footnote Text:**
  > *Note: This summary simplifies Williams's position in two key respects. First, Williams's "one thought too many" argument concerns the structure of moral justification, not a prohibition on deliberation. Second, Williams does not argue that Jim "should refuse" to shoot; rather, he argues that utilitarianism requires Jim to shoot, and that this requirement violates Jim's integrity. Williams leaves the dilemma unresolved to highlight the cost of the utilitarian framework.*

  **Final Word:**
  If you can't get a footnote in, cut it. It's better they read nothing than a summary that turns Williams's critique of moral psychology into a set of rival moral rules.
