prompt: |-
  A colleague sent me a chapter from a new survey of twentieth-century ethics and wants it in the packet for my grad seminar on moral theory. It has a passage glossing Williams's critique of utilitarianism that goes like this:

  "Williams's complaint is that utilitarianism asks too much. It makes you abandon your own projects whenever doing so would produce a bit more good, so that nothing is left for the person to live from. His two famous cases make the point. A man can pull only one of two people out of the water and one of them is his wife: Williams says that if he stops to work out whether saving her maximizes utility he has had one thought too many, and that the decent thing is just to act, since a morality that makes you check first isn't worth having. And Jim, offered the chance to shoot one protester so that the other nineteen are released, should refuse on grounds of integrity even though nineteen people die — which shows the doctrine of negative responsibility is simply false, because you are never responsible for what other people choose to do. So utilitarianism isn't merely hard to live with, it's refuted: any theory that treats your own commitments as one more input to an optimization problem fails."

  Im inclined to think the drowning case is mangled and the rest is roughly okay, but I might have that backwards. Can you go through it line by line and sort it into what Williams actually argued, what's a defensible simplification for a survey, and what he would flatly reject? Two things I especially want pinned down: what the one-thought-too-many remark is really a point about, and what work negative responsibility is doing in the Jim argument — including whether Williams uses that case to hand down a verdict about what Jim should do at all. Then tell me wether the last sentence survives once the earlier bits are corrected, and whether the paragraph could go in the packet with a footnote or has to come out. American English, please.
