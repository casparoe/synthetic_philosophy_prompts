answer: |-
  Your argument is a elegant *reductio*, but it collapses at step (6). You have constructed a trap that successfully catches any theory relying on uniform costs, but costly-signalling theory does not rely on uniform costs; it relies on differential marginal costs. By rejecting (6), you preserve the logic of behavioural ecology without sacrificing your falsifiability constraint in (2) or your selection worry in (8).

  The defect in (6) is an equivocation on the word 'cost'. You treat cost as an objective expenditure of energy or time (the 'price'), whereas signalling theory defines it as the marginal impact on fitness or utility (the 'pain'). A fast consumes the same calories for a believer and a sceptic, but the psychological dissonance suffered by the sceptic adds a residual cost the believer does not bear. Similarly, the 'payoff' in (5) and (3) is not identical; a believer gains spiritual utility from the act itself, which a faker does not. Step (6) assumes type-independence where the theory explicitly posits type-dependence. It looked acceptable because public acts are observable, tempting us to assume their internal metabolic or psychological toll is equally observable and uniform. It is not.

  Giving up (6) costs the theory some empirical ease. If cost is partly subjective (psychological congruence), it is harder to measure than calories burned. You risk smuggling unfalsifiability back in through the back door of 'internal state'. However, this is manageable if you proxy internal state via behavioural consistency over time, which keeps (2) intact.

  Regarding the camps you mentioned: the cheap-talk camp is correct that aligned interests help, but wrong that cost is unnecessary when interests diverge; cost restores honesty when interests conflict. The Grafen-style models depend entirely on rejecting (6); they require the cost curve for the low-quality type to be steeper than for the high-quality type. The CREDS move (Henrich) sidesteps this by signalling *credence* rather than loyalty; faking belief is cognitively costly, so (6) fails there too. On filter versus signal, it is partly real. It distinguishes who moves first (principal screens vs. agent signals), but both mechanisms rely on the same mathematical condition: differential marginal costs must separate the types. Without that, neither works.

  You can keep (8). Selection and signalling are not mutually exclusive; they are often complementary. Selection fills the group with low-cost signalers, and signalling maintains trust within the selected group. Your conclusion (9) does not follow because the differential required for signalling exists in the marginal utility, not the gross expenditure.

