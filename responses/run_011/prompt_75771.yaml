  Then decompose. Terms I think belong (throw out or add as you see fit):

  - P(causal closure of the physical holds in the strong, exceptionless form EP needs, not just as a working approximation in the sciences)
  - P(zombie-style conceivability gets you from there to metaphysical possibility)
  - P(the explanatory gap and knowledge arguments genuinely rule out physicalism rather than tracking a limit in our concepts)
  - P(the paradox of phenomenal judgment is a real reductio of EP rather than a cost EP can absorb)

  One wrinkle I want taken seriously, because I keep watching people wave it off: there's an escape route I'll call the shadow-cause reply. The epiphenomenalist says the quale is constituted by, or supervenes on, some neural state N; N does all the causal work in producing the judgment "there's something it's like to see red"; and the judgment is still about the quale rather than about N, because of how the phenomenal concept gets deployed — something acquaintance-like, or the idea that the concept's content is fixed by the quale's presence rather than by any causal traffic. On that view nothing feels disconnected from the inside, and the paradox of phenomenal judgment never gets off the ground, since the report is caused by the shadow and refers to the thing casting it.

  So I want a separate term for P(the shadow-cause reply works), and I want you to say how much of that term rides on the prior question of whether aboutness can be secured without causal contact — which strikes me as a question that belongs to philosophy of language and metaphysics and gets mostly ignored inside the consciousness debate. If you think the shadow-cause reply collapses into something already on the table (a Russellian monism, a type-identity sneak-back, whatever), say so and tell me what's left over.

  Then combine and give me the bottom line, and tell me which single term the whole product is most sensitive to — where a 0.2 shift moves the answer the most — plus what argument or empirical finding would move that term. My own gut number is around 0.15 and my advisor would put EP at 0.02 or lower, so also tell me which term you think the two of us are actually disagreeing about, because we've argued about this twice and neither of us can say.

  Last thing, and it matters: please mark clearly which of your sub-claims are settled-ish among people who work on this and which are genuinely contested, and don't slide one camp's talking points into the background as if they were the state of the field. If you think the causal closure term is a live fight rather than shared premises, say that. And flag any spot where you suspect you're pattern-matching a familiar version of the debate instead of reasoning about the one I actually stated.
