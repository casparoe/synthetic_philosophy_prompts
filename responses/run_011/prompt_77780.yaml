answer: |-
  ### (1) Exam Question

  **Question 4: The Empirical Content of the Measure (25 Marks)**

  Consider a spin-1/2 system prepared in state $\psi = \sqrt{2/3}|\uparrow\rangle + \sqrt{1/3}|\downarrow\rangle$. This system is measured in the $\{|\uparrow\rangle, |\downarrow\rangle\}$ basis, reset, and remeasured $N$ times. Assume perfect decoherence between trials, resulting in $2^N$ distinct, equally real branch-histories in the Everettian multiverse. Let $k$ be the number of $\uparrow$ outcomes in a given history.

  Three rival rules assign a weight $W$ to each branch-history:
  *   **Rule A (Branch Counting):** Every history has equal weight $W = 2^{-N}$.
  *   **Rule B (Amplitude Foil):** A history with $k$ ups has weight proportional to $(\sqrt{2/3})^k (\sqrt{1/3})^{N-k}$, normalized so the sum of weights over all $2^N$ histories is 1.
  *   **Rule C (Born Rule):** A history with $k$ ups has weight $(2/3)^k (1/3)^{N-k}$.

  **(a)** Calculate the predicted relative frequency of $\uparrow$ outcomes ($k/N$) in the limit $N \to \infty$ for an observer typical under each Rule. Show your derivation for Rule B explicitly. (5 marks)

  **(b)** Are Everettian Quantum Mechanics (using Rule C) and an "Amplitude Theory" (using Rule B) empirically distinguishable? If yes, estimate the order of magnitude of $N$ required to distinguish them at a $3\sigma$ confidence level. (5 marks)

  **(c)** A skeptic argues: "Under Rule A, the majority of branches contain observers seeing $k/N \approx 0.5$. Unless we assume we are 'special', we should expect 50% ups. Therefore, Rule C requires an unjustified preference for high-weight branches." Explain why the Everettian reply—that "majority of branches" smuggles in a uniform measure—is not merely question-begging. In your answer, define *self-locating uncertainty* if you use it, and explain what evidential weight attaches to a low-weight branch where an observer sees 100 $\uparrow$s in a row. (15 marks)

  *Note: Closed book. Calculators permitted. Define any technical terms not standard to introductory quantum mechanics.*

  ***

  ### (2) Model Answer

  **(a) Frequency Limits**
  Under **Rule A**, every history has equal weight. The distribution of $k$ is determined purely by combinatorics: there are $\binom{N}{k}$ histories with $k$ ups. This forms a binomial distribution with $p=0.5$. As $N \to \infty$, the frequency $k/N$ converges to **0.5**.

  Under **Rule C** (Born), the weight for $k$ ups is $\binom{N}{k}(2/3)^k(1/3)^{N-k}$. This is a binomial distribution with $p=2/3$. As $N \to \infty$, $k/N$ converges to **2/3 (≈0.667)**.

  Under **Rule B**, the unnormalized weight of a specific history with $k$ ups is $w = (\sqrt{2/3})^k (\sqrt{1/3})^{N-k}$. The total normalization sum over all $2^N$ histories is $Z = (\sqrt{2/3} + \sqrt{1/3})^N$. The probability of observing $k$ ups is:
  $$P_B(k) = \frac{\binom{N}{k} (\sqrt{2/3})^k (\sqrt{1/3})^{N-k}}{(\sqrt{2/3} + \sqrt{1/3})^N} = \binom{N}{k} (p')^k (1-p')^{N-k}$$
  where $p' = \frac{\sqrt{2/3}}{\sqrt{2/3} + \sqrt{1/3}} \approx \frac{0.816}{0.816 + 0.577} \approx 0.585$.
  As $N \to \infty$, $k/N$ converges to **≈0.585**.

  **(b) Empirical Distinguishability**
  Yes, they are distinguishable. Rule C predicts a frequency of 0.667; Rule B predicts 0.585. These are distinct physical predictions about the relative frequency of outcomes observed by typical agents.
  To distinguish $p_1 = 2/3$ from $p_2 \approx 0.585$ at $3\sigma$, we require the standard error $\sigma_f = \sqrt{p(1-p)/N}$ to satisfy $3\sigma_f < |p_1 - p_2| \approx 0.082$.
  Using $p \approx 0.6$, $\sigma_f \approx \sqrt{0.24/N}$.
  $3\sqrt{0.24/N} < 0.082 \Rightarrow \sqrt{N} > \frac{3 \times 0.49}{0.082} \approx 17.9 \Rightarrow N \gtrsim 320$.
  With $N \approx 350$ trials, an observer would find themselves in a branch where the frequency rules out one theory at high confidence. Thus, the choice of measure is not interpretive fluff; it carries empirical content. An Everettian theory using Rule B is falsified by standard QM data.

  **(c) The Typicality and Measure Problem**
  The skeptic's Rule A argument fails because "majority of branches" is ill-defined without a measure. In the Hilbert space formalism, branching is continuous and basis-dependent; counting discrete "worlds" requires a prior granularity that the physics does not provide. To count branches equally is to implicitly impose a uniform measure over a decomposition that is not unique. The Everettian reply is not question-begging because it identifies the *physical* measure (the squared amplitude) as the only one invariant under unitary transformations that respects the dynamical structure of the theory.

  However, identifying the physical measure is insufficient; one must justify why *credence* should track this measure. This is where self-locating uncertainty is relevant. *Self-locating uncertainty* is the uncertainty an agent feels about which branch they occupy post-measurement but pre-observation, despite knowing the global wavefunction. If rational agents must assign credences to self-location, and if we accept the Principal Principle (credence should match objective chance), we must identify the objective "chance" analogue in EQM.

  Decision-theoretic arguments (Deutsch-Wallace) attempt to show that a rational agent *must* bet according to the Born rule to avoid diachronic Dutch books. However, even without full decision theory, the empirical distinguishability shown in (b) provides a pragmatic justification: if agents adopt Rule A or B, they will make bad predictions about their future experiences (frequencies).

  Regarding the low-weight branch (100 $\uparrow$s in a row): Under Rule C, this branch exists. Its existence does not falsify the theory, but its low weight means it is *atypical*. If an observer finds themselves in this branch, they should update their credence against Rule C, but only if they assume they are a typical observer. The evidential weight of this branch is low because the theory assigns it low measure. The "falsifiability" of EQM relies on the assumption that we are typical observers within the measure provided by the theory. If we abandon typicality, no probabilistic theory is testable. Thus, the Born rule is saved not by denying the existence of low-weight branches, but by asserting that rational expectation is governed by the measure that yields correct frequency predictions.

  ***

  ### (3) Marking Scheme (Total: 25 Marks)

  **Part (a): Calculations (5 Marks)**
  *   **2 Marks:** Correct limit for Rule A (0.5) and Rule C (2/3).
  *   **3 Marks:** Correct derivation for Rule B. Must identify the renormalization factor $(\sqrt{2/3} + \sqrt{1/3})^N$ and derive the effective $p' \approx 0.585$.
      *   *Deduction:* -1 if they assume Rule B yields Born probabilities without calculation.

  **Part (b): Distinguishability (5 Marks)**
  *   **2 Marks:** Explicit "Yes".
  *   **3 Marks:** Correct order-of-magnitude estimate for $N$ (200–500 range). Must show understanding that distinct measures yield distinct frequencies.
      *   *Common Mistake:* Claiming EQM is not falsifiable because "everything happens." (0 marks for this section).

  **Part (c): Typicality & Measure (15 Marks)**
  *   **5 Marks (The Measure Problem):** Identifies that "branch counting" assumes an arbitrary uniform measure over a basis-dependent decomposition. Must state that the Born measure is physically privileged (unitary invariance/dynamics).
      *   *B Grade:* Merely states "branches aren't countable" without explaining why the uniform measure is the smuggled assumption.
      *   *A Grade:* Explicitly connects the arbitrariness of the decomposition to the empirical failure of Rule A.
  *   **5 Marks (Self-Location/Credence):** Defines self-locating uncertainty (uncertainty about *which* branch one is in). Explains why credence must track measure (either via Decision Theory or the empirical success argument from Part B).
      *   *Constraint:* Reciting Deutsch-Wallace without applying it to *why* Rule B fails earns 0 marks here. Must link rationality to the specific frequency predictions.
  *   **5 Marks (Low-Weight Branches):** Acknowledges the branch exists. Explains that falsification relies on a *typicality assumption*. If we see 100 ups, we update against the theory, but the theory isn't logically contradicted, only probabilistically disfavored.
      *   *Common Mistake:* Claiming the branch "doesn't count" or "isn't real." (0 marks for this point).

  **Differentiation (A vs B)**
  *   **B Answer (15-19/25):** Gets the math right. Argues that Rule A is wrong because "amplitude is more real." Treats the Born rule as a postulate that solves the problem. Vague on why typicality is justified.
  *   **A Answer (20-25/25):** Explicitly argues that the *measure itself* is the empirical claim. Shows that Rule B is a rival physical theory, not just an interpretation. Explains that the "majority of branches" objection fails because it relies on a measure (uniform) that yields wrong frequencies, making it empirically inadequate, not just philosophically suspect.

  **Common Bad Answers**
  1.  **"Everything Happens":** Claims no prediction is possible because all outcomes occur. (Fails Part B).
  2.  **"DW Solves It":** Summarizes Deutsch-Wallace axioms without calculating the Rule B frequencies. (Fails Part C).
  3.  **"Amplitude = Probability":** Assumes Rule B yields the same result as Rule C without checking normalization. (Fails Part A).
  4.  **"Unreal Branches":** Claims low-weight branches don't exist or don't contain observers. (Fails Part C, misunderstands EQM).
