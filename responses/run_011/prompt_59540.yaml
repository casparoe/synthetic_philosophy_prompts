  7.  **Final Polish:** Check against "Do not lecture." Keep it tight. Use the user's numbering.

      *   *Wait, one nuance:* (3) says "roughly" possible. MEC *can* work with rough estimates (imprecise probabilities/utilities). So (2) and (3) are compatible if (2) is interpreted loosely. But (2) says "weight by credence... take highest total." That implies precision.
      *   *Revision for (2)/(3):* Acknowledge imprecision in (2).
