          3.  (2) vs (4): Switching models is messy, but less fundamental than breaking the math or the principle.

      *   *Wait, (2) vs (3) is arguably the deepest.* But (5) is more practically disruptive to the *logic* of maximization. Let's look at the "Single Revision" goal. If I change (2) to be a "Pluralistic Decision Procedure" rather than "MEC," it solves (2)/(3), (2)/(4), and (2)/(5).
      *   Let's check (6) and (1). (6) says doing the objectively wrong thing is wrong. (1) says there is an objective truth. This is consistent.
      *   Let's check (7). It limits the input for (2). Not a tension, just a domain restriction.

      *   *Final Plan:*
          *   Tension 1 (Severe): (2) vs (3). Math vs. Metaphysics of value.
