      *   *Future:* "Neuroscience will validate FP categories" vs. "Neuroscience will replace FP categories."
      *   *Verbal Disputes:* Often about the word "real" or "existence." Need to flag this. (e.g., Does a "table" exist? Yes, but not fundamentally. Does a "belief" exist? R says yes like a table, E says no like phlogiston.)

