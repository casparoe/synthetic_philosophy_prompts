answer: |-
  # JOINT STATEMENT ON THE STATUS OF FOLK PSYCHOLOGY
  **Prepared for the Workshop on Adversarial Collaboration in Philosophy of Mind**
  **Signatories:** [The Eliminativist] & [The Realist]

  ### PREAMBLE
  We, the undersigned, acknowledge a deep disagreement regarding the ontological status and future of "folk psychology" (FP)—the everyday practice of explaining behavior via propositional attitudes (beliefs, desires, intentions). However, through adversarial collaboration, we have identified significant common ground regarding the empirical data, the limitations of current frameworks, and the specific conditions under which this debate could be resolved. This document outlines our shared commitments, our specific disagreements, and a research agenda designed to render our dispute empirically tractable.

  ---

  ### I. AGREED CLAIMS
  *Both signatories affirm the following propositions:*

  1.  **The Physical Basis:** Human cognitive agents are physical systems. Any mental phenomenon must be consistent with the laws of physics and implementable via neural (or synthetic) substrate.
  2.  **The Utility of FP:** Folk psychology is currently indispensable for social coordination, legal responsibility, and macro-level behavioral prediction. Neither signatory advocates for the immediate cessation of FP talk in daily life.
  3.  **Empirical Failures of FP:** Both agree that FP fails or struggles significantly in the following domains:
      *   **Psychopathology:** Explaining the phenomenology and etiology of schizophrenia, dissociation, and severe mania without recourse to neurochemistry.
      *   **Self-Deception & Confabulation:** The inability of FP to coherently model how one can simultaneously hold and not hold a belief (or generate false reasons for actions, per Nisbett & Wilson).
      *   **Sub-symbolic Processing:** Explaining perceptual learning, motor control, and implicit bias, which operate without conscious propositional mediation.
      *   **Sleep/Deprivation:** The degradation of "rational agency" under physiological stress suggests FP describes a fragile surface layer, not a robust underlying architecture.
  4.  **The Theory-Theory Baseline:** We agree that FP functions *as if* it were a theory. The disagreement lies in whether being a "theory" makes it false (Eliminativist) or merely abstract/functional (Realist).

  ---

  ### II. MUTUAL CONCESSIONS
  *What each side grants to the other:*

  | **The Eliminativist Concedes:** | **The Realist Concedes:** |
  | :--- | :--- |
  | That FP is not a "final vocabulary." It is historically situated and likely will not map 1:1 onto fundamental neuroscience. | That FP is not infallible. Its success rate, while high for macro-behavior, is not evidence of *truth* in the same way that successful alchemy was not evidence of transmutation. |
  | That "elimination" is a long-term scientific horizon, not a policy for tomorrow. We cannot currently navigate society without FP. | That if neuroscience reveals no structural counterpart to propositional attitudes (no "sentence in the head"), the realist ontology must be downgraded to a purely instrumental status. |
  | That the *phenomenology* of believing is real, even if the *ontology* of belief is not. | That connectionist/AI models demonstrate that intelligent prediction can occur without explicit symbolic representation. |

  ---

  ### III. TABLE OF DISAGREEMENTS
  *Disputes are worded such that each proponent accepts the characterization of their own view.*

  | Domain | Eliminativist Position | Realist Position | Merely Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | "Belief" is a theoretical posit of a false theory (like *phlogiston*). It refers to nothing. | "Belief" is a real, higher-order pattern (like a *table* or *storm*). It exists via supervenience or functional role. | **Partially.** Depends on the definition of "exist." If "exist" means "fundamental physical kind," R agrees with E. If it means "indispensable explanatory category," E disagrees with R. |
  | **Neuroscience** | Future mature neuroscience will replace FP vocabulary, not reduce it. | Future mature neuroscience will constrain and refine FP vocabulary, showing its implementation. | **No.** This is an empirical prediction about the structure of future science. |
  | **Intentionality** | Content is illusory. There is only causal covariance and structural isomorphism. | Content is real, grounded in causal history, function, or normative conditions. | **No.** This is a substantive metaphysical disagreement about meaning. |
  | **Error** | When FP fails (e.g., implicit bias), it reveals the theory is false. | When FP fails, it reveals the *application* of the theory is difficult or the agent is irrational, not that the theory is false. | **No.** Disagreement on how to interpret falsification conditions. |

  ---

  ### IV. CRUXES AND PRE-REGISTERED TESTS
  *We identify three specific sub-questions where an answer would force at least one of us to update our position. For each, we specify a test and our pre-registered predictions.*

  #### CRUX 1: Structural Isomorphism
  **Question:** Does the brain encode propositional attitudes in discrete, functionally isolable states that map to the logical structure of the attitude (e.g., does the neural state for "Belief that P" share components with "Belief that P or Q")?
  *   **Test:** High-resolution neural decoding (fMRI/BCI) during complex logical reasoning tasks. Search for compositional neural syntax.
  *   **Eliminativist Prediction:** Neural states will be distributed, holistic, and non-compositional. No "belief box" or syntactic structure will be found.
  *   **Realist Prediction:** Neural states will show functional modularity and compositional structure, even if implemented in parallel distributed processing.
  *   **Update Condition:** E concedes if compositional neural syntax is robustly identified. R concedes if cognitive processing is proven to be entirely holistic/connectionist with no discrete state boundaries.

  #### CRUX 2: The Developmental Trajectory
  **Question:** Do children acquire FP as a theory (involving hypothesis testing and falsification) or as a practical skill (involving simulation and interaction)?
  *   **Test:** Longitudinal studies on theory-blind children or cross-cultural variations in FP acquisition that decouple predictive success from theoretical understanding.
  *   **Eliminativist Prediction:** Acquisition will look like theory change (paradigm shifts, distinct stages of falsification).
  *   **Realist Prediction:** Acquisition will look like skill learning (gradual refinement, no distinct "falsification" events).
  *   **Update Condition:** E concedes if FP is acquired purely as a skill without theoretical posits. R concedes if children treat FP as a falsifiable hypothesis that gets replaced.

  #### CRUX 3: The LLM Challenge (Artificial Propositional Attitudes)
  **Question:** Large Language Models produce fluent first-person reports ("I believe," "I want") and reason over them. Sometimes they confabulate; sometimes they track context accurately. Does this support the idea that FP is just surface grammar (Eliminativism) or that FP is a functional pattern independent of substrate (Realism)?

  *   **Specific Phenomenon:** LLMs generate self-reports that are behaviorally indistinguishable from humans in standard FP tests, despite having no biological history or embodied needs.
  *   **Eliminativist Prior Prediction:** "I predicted machines could mimic FP syntax without having semantics. The fact that LLMs work *without* beliefs proves beliefs aren't needed for the behavior. The 'confabulation' is the default state; 'tracking' is just statistical alignment."
      *   **Current Stance:** Evidence has **strengthened** my view. LLMs show FP is a generative linguistic game, not a report on inner states.
  *   **Realist Prior Prediction:** "I predicted that if a system masters the functional role of belief (prediction, explanation, coordination), it enters the space of reasons. Substrate doesn't matter."
      *   **Current Stance:** Evidence has **complicated** my view. I must clarify if 'belief' requires biological homeostasis or if functional role is sufficient.
  *   **Concrete Test:** **The Perturbation & Coherence Test.**
      *   *Method:* Systematically perturb the model's weights or context window to induce a change in a reported "belief." Observe if the change propagates logically through the system's other reported beliefs and actions (coherence) or if it results in fragmentation (confabulation).
      *   **Eliminativist Prediction:** Perturbation will reveal fragmentation. The system will assert $P$ and $\neg P$ in nearby contexts without resolution, proving there is no underlying state being reported, only text generation.
      *   **Realist Prediction:** Advanced models will maintain coherence under perturbation (error correction), behaving like a system trying to maintain consistency among real states. If they fail, it is no worse than human inconsistency.
      *   **Update Condition:**
          *   **E** will move toward Realism if LLMs demonstrate robust, long-term coherence and self-correction indistinguishable from human belief revision under perturbation.
          *   **R** will move toward Eliminativism if LLMs prove to be inherently incapable of coherent belief-tracking across novel contexts, confirming FP is merely a "stochastic parrot" trick that humans also fall for.

  ---

  ### V. CONCLUSION
  We agree that the debate is no longer purely conceptual. It hinges on the architecture of intelligence, biological or artificial. We commit to reviewing the results of the tests above in five years. Until then, we will continue to use folk psychology in the coffee line, while acknowledging that one of us is describing a reality and the other is telling a useful story.

  **Signed:**

  _________________________ (The Eliminativist)

  _________________________ (The Realist)

  **Date:** _________________
