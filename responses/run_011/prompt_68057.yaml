answer: |-
  This is a formidable intersection. You are right that the overlap between the linguistic precision of the School of Names and the ontological anxiety of Dick is sparse territory. Your hypothesis regarding "colour-loaded terms"—where the stated criterion for a name diverges from the policed criterion—is a sharp tool. It cuts directly into the tension between the Voight-Kampff test's stated purpose (measuring empathy) and its actual function (sorting origin).

  Here is the breakdown of scenes, the reading, and the honest assessment of where the lens fractures.

  ### Scene Selection

  I brainstormed four candidate moments that structurally mirror the logical moves in Gongsun Long's dialogue.

  1.  **Deckard's Morning Routine:** The protagonist checking his electric sheep against the neighbor's real animals. This establishes the status hierarchy and the shame of the compound term.
  2.  **The Voight-Kampff Test on Rachael Rosen:** The explicit attempt to distinguish classes based on a physiological response to a hypothetical request (the spider scene within the test).
  3.  **Isidore and the Spider:** The "special" human preventing the androids from mutilating a spider. This isolates empathy from legal classification.
  4.  **The Resch Verification:** Deckard suspecting a fellow bounty hunter is an android due to cruelty, testing him, finding him human, and realizing the criterion has failed.

  **Decision:** I am keeping all four.
  **Why:** Each scene maps directly to one of your four mandatory analytical constraints (a, b, c, d). Dropping any one would weaken the structural integrity of the reading. The opening handles the title term (a); the Rachael test handles the sliding "not" (b); Isidore handles the objection case (c); and Resch handles the criterion failure (d). Together, they form a complete logical proof analogous to the dialogue's progression from definition to request to negation.

  ### The Reading

  **(a) The Compound Term: Electric Sheep vs. White Horse**
  Gongsun Long argues that "white horse" is not "horse" because the compound restricts the class. "Horse" accepts any color; "white horse" accepts only one. In the novel, the title term functions similarly. "Sheep" implies a biological organism with status. "Electric" modifies the origin. When Deckard opens the novel, he treats "electric sheep" as fundamentally distinct from "sheep." He feels shame because the compound term excludes him from the community of owners of real animals. The name fixes the object by two things at once: shape (sheep) and origin (electric).

  However, the novel shifts the value of this compound by the end. When Deckard finds the toad, he initially treats it as a "real toad" (the simple term). Upon discovering the mechanical panel, it becomes an "electric toad" (the compound). In a Gongsun Long framework, this should diminish its value. Instead, Deckard's care remains. The novel suggests that while the *name* distinguishes the compound from the simple, the *request* has changed. Initially, the request was "give me status." By the end, the request is "give me something to care for." The term "electric sheep" shifts from a marker of deficiency to a marker of responsibility. The compound is still not the simple term, but the moral weight attached to the difference collapses.

  **(b) The Sliding "Not": Non-Identity vs. Exclusion**
  The horror of the novel relies entirely on the ambiguity of the little word "not," precisely as you outlined. When the society says "an android is not human," it oscillates between two meanings.
  1.  **Non-Identity:** An android is not identical to a human (it is built, not born). This is logically sound, akin to "white horse is not horse."
  2.  **Exclusion:** An android does not fall under the protection of the class human (it can be killed).

  The Voight-Kampff test is the mechanism that forces the slide from the first meaning to the second. The test measures physiological response to establish non-identity (origin). Once non-identity is established, the society assumes exclusion follows. The horror arises when the reader suspects that exclusion should depend on empathy, not identity. When Deckard retires an android, he comforts himself with non-identity ("it is a machine"). When he feels guilt, he recognizes that exclusion was unjustified ("it felt like a human"). The violence of the novel is the violence of treating a logical distinction (not identical) as a moral permission (does not fall under).

  **(c) Isidore: The Objector's Best Case**
  Isidore is the "yellow horse" in the argument. If you ask for a "human" (defined by empathy), Isidore answers. If you ask for a "standard human" (defined by intellectual capacity and lack of radiation damage), he does not.
  He is the objector's best case against the advocates of the rigid classification. The society announces "human" as a biological category but polices it by intellectual capacity (calling him "special" or "chickenhead"). Yet, he possesses the announced criterion of empathy in greater measure than the bounty hunters.
  Through your lens, Isidore proves the term "human" is colour-loaded. The criterion announced is moral capacity (empathy/Mercerism), but the criterion policed is genetic purity. Isidore is genetically pure enough to be human, but damaged enough to be excluded. He demonstrates that the name "human" fails to pick out the thing it claims to value. He is the counter-example that breaks the rule: he is a human who is treated as less than human, while the androids are less than humans treated as non-humans. He exposes that the request "give me a human" is actually a request for "give me a useful human."

  **(d) The Bounty Hunter: Criterion Firing Correctly, Feeling Wrong**
  The incident with Resch confirms Gongsun Long in a tragic register. Deckard suspects Resch is an android because Resch lacks empathy (the color). He tests Resch. The test confirms Resch is human (the shape).
  Does this refute Gongsun Long? No. It confirms the danger of the name. Gongsun Long warns that compounds restrict meaning. Here, the simple term "human" picks out the shape (biology), but the moral weight requires the color (empathy). Because the term "human" does not include "empathic" in its official definition (only in its social announcement), a cruel human is still a human.
  This confirms your "colour-loaded" hypothesis. The term is loaded with moral expectation but policed by biological origin. Resch is the proof that the loading is arbitrary. The test fires correctly (he is biologically human) but feels wrong (he is morally monstrous). This suggests that the class "human" is too broad to carry the moral weight assigned to it, just as "horse" is too broad to specify "white horse." The novel suggests we need a new name for the thing we actually value, because "human" includes too many things that do not answer the request for kindness.

  ### Where the Lens Breaks

  I must be honest about where this semantic mapping strains against the text. Gongsun Long is concerned with the precision of language to align with reality. He assumes that if we fix the names, the governance will follow. PKD is fundamentally skeptical that language can ever align with reality.

  1.  **Simulacra vs. Semantics:** Gongsun Long assumes the "white" and the "horse" are distinct, stable properties. In the novel, the properties themselves are decaying. Empathy is mediated by a mood organ; religion is mediated by a empathy box. The "colour" (empathy) is itself artificial. You cannot run a "colour-loaded" argument when the colour is synthesized. The novel suggests the criterion isn't just policed differently; the criterion itself is broken.
  2.  **Mercerism:** The philosophical framework of the book is Mercerism, which is about shared suffering, not categorical distinction. Gongsun Long separates; Mercerism merges. When Deckard merges with Mercer, the distinction between "human" and "android" becomes less important than the shared experience of falling. The School of Names seeks to distinguish; the novel seeks to dissolve distinctions through suffering.
  3.  **The Ontological Stakes:** For Gongsun Long, getting the name wrong is a logical error. For Deckard, getting the name wrong is a murder. The semantic lens risks sanitizing the violence. When you analyze the "not" as a logical slide, you risk missing that the slide is covered in blood. The novel is not interested in whether the term is precise, but whether the term is lethal.

  ### What the Novel Adds

  The School of Names offers a logical puzzle; the novel offers a consequence. Gongsun Long's argument ends in a paradox of language. *Do Androids Dream of Electric Sheep?* ends in a paradox of care.

  The novel adds the dimension of *responsibility* to the naming problem. Gongsun Long asks: "Does the name fit the object?" PKD asks: "If I name this object incorrectly, what do I owe it?" The ending with the toad suggests that the name matters less than the obligation. Even if the toad is "electric" (the compound term), Deckard owes it care. The novel argues that the "request" changes based on the relationship, not the definition. You don't ask for a "white horse" to ride; you ask for a "living thing" to protect.

  The text ultimately suggests that the "colour-loaded" term is unavoidable. We will always announce one criterion and police another. The solution isn't better semantics, as the School of Names might hope, but better mercy. We must act as if the circle of exclusion is smaller than the logic dictates.

  The film dropped the sheep entirely, which is a pity; it missed the point that the electric animal is the only one you can truly own without dominating.
