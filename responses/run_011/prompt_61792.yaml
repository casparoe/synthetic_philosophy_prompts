  Elias stands in the archive room he has managed for fifteen years. He knows slot 4B is empty because he holds the only file it contained in his left hand, having removed it seconds ago to log the ID. Yet, looking at 4B, he sees a manila folder sitting squarely on the shelf. The vision is sharp, casting a slight shadow, indistinguishable in clarity from his view of the file in his hand. He is sober, rested, and has no history of visual disturbance; he simply sees the folder there while knowing physically it cannot be there.

  The common-factor theorist asserts Elias's experience possesses positive phenomenal character identical to veridical perception; the folder looks real because the underlying mental state is the same. The strong disjunctivist claims the character is exhausted by its indistinguishability from perception. Given Elias's collateral knowledge, the disjunctivist must argue the character remains only because the experience retains the *capacity* to fool reflection, not because it has intrinsic content.

  The central question is whether the borrowed-character view has anything left to point to once the subject knows they are hallucinating. If the character is *nothing over and above* the impossibility of telling, then establishing that telling is possible (via the file in hand) should dissolve the character. But the experience remains vivid. The character does not go missing; it persists despite the epistemic breach. This suggests the character cannot be merely borrowed from indistinguishability; it must be positive and intrinsic, or the disjunctivist must relocate the borrowing to a counterfactual inability (you *wouldn't* be able to tell if you lacked the file). If the view concedes the latter, it admits the character is stable across knowledge states, undermining the claim that it is constituted by the relation to the good case.

  The single feature doing the work is the collateral knowledge that breaks epistemic symmetry without altering phenomenology. If removed, Elias becomes an ordinary hallucinator who believes the folder is real. In that ordinary case, both theories describe the situation identically from the subject's perspective, masking the metaphysical disagreement. The case only works because Elias knows the truth while the experience lies, forcing the theories to diverge on the description of the experience itself.

  The best reply for the borrowed-character defender is to insist that "indistinguishable by reflection alone" excludes collateral knowledge. Elias knows via proprioception (holding the file), not introspection. Therefore, the experience remains introspectively indistinguishable from seeing, preserving the disjunctivist condition. This reply saves the definition from falsification but exposes a weakness: it renders the "borrowed" claim trivial. If the character persists even when the subject knows it is fake, calling it "borrowed" from the good case becomes metaphorical rather than explanatory. It postpones the difficulty by narrowing "telling" to a specific channel, but it fails to explain why the experience feels positive when the subject knows it is not, risking the circularity the essay seeks to avoid—defining the feeling by a capacity to deceive that the subject no longer possesses.

  Verdict: NEEDS REVISION (Collateral knowledge)
