answer: |-
  # OPERATIONAL PROCEDURE: PROBABILISTIC SHIFT HANDOVER (V-4)
  **Effective Date:** Immediate  
  **Authority:** Observatory Duty Coordinator  
  **Applicability:** All Duty Analysts, Shift Handovers  
  **Tool:** "Handover_Calculator_v4.xlsx" (Locked cells protected; Input cells highlighted yellow)

  ## 1. PURPOSE
  To update the **Board Probability** (chance of eruption > stated size in next 30 days) using the new software's *soft classifications* without discarding uncertainty. This procedure prevents "hardening" errors (ignoring near-ties) and reduces double-counting of correlated signals (Tremor/Gas).

  ## 2. PRE-REQUISITES
  *   **The Board Probability:** The single number currently displayed on the duty board (e.g., 0.14).
  *   **The Reference Card:** A laminated card at the station providing the **Evidence Weight (EW)** for each channel and bin. *Note: These values were derived by the Science Lead from historical data. Do not change them.*
      *   *Example structure:*
          *   Tremor: Quiet=0.7, Elevated=1.1, High=2.5
          *   Gas: Quiet=0.8, Elevated=1.2, High=2.0
          *   GPS: Quiet=0.9, Elevated=1.0, High=1.8
  *   **Sensor Status Flags:** The software status light (Green=OK, Red=Fail/Maint).

  ## 3. THE PROCEDURE (20-Minute Window)

  ### Step 1: Sensor Health Check (2 Minutes)
  **Action:** Look at the Sensor Status Flag for Tremor, Gas, and GPS.
  **Rule:**
  *   If **Green**: Proceed to Step 2.
  *   If **Red/Fail**: The software numbers are invalid.
      *   **Action:** In the spreadsheet, set the Evidence Vector for that channel to `(0, 0, 0)`.
      *   **Effect:** The calculator will assign a Weight of **1.0** (Neutral). This means "We know nothing," not "We know it is Elevated."
      *   **[JUDGMENT CALL]:** We assume a dead sensor provides zero information. We do not assume it is "quiet."
      *   **Log:** Write "Sensor [Name] failed. Weight set to 1.0 (Neutral)."

  ### Step 2: Input Soft Vectors (3 Minutes)
  **Action:** Copy the three numbers from the new software for each active channel into the yellow cells.
  *   Example: Tremor `(0.15, 0.55, 0.30)`
  *   **Do not round.** Enter exactly as shown.
  *   **Do not pick the highest number.** The spreadsheet calculates the risk using all three numbers.
      *   *Why:* A split decision (0.42, 0.39, 0.19) carries more risk than a confident Quiet (0.90, 0.05, 0.05). The math handles the "near-tie" automatically.

  ### Step 3: Calculate Channel Weights (5 Minutes)
  **Action:** The spreadsheet automatically multiplies your input vector by the **Reference Card** values and sums them.
  *   *Formula:* $Weight = (p_{quiet} \times EW_{quiet}) + (p_{elev} \times EW_{elev}) + (p_{high} \times EW_{high})$
  *   **Check:** Ensure the resulting Weight for each channel is visible.
      *   Weight < 1.0: Signal lowers risk.
      *   Weight = 1.0: Signal is neutral.
      *   Weight > 1.0: Signal raises risk.

  ### Step 4: Apply the "Plumbing Discount" (Correlation Check) (5 Minutes)
  **Assumption:** Tremor and Gas flux are driven by the same magma plumbing. If both move in the same direction, they are not two independent witnesses; they are one witness speaking twice.
  **Rule:** Compare the Tremor Weight ($W_T$) and Gas Weight ($W_G$).
  *   **Case A (Opposite Directions):** One is >1.0, one is <1.0.
      *   **Action:** Multiply them normally. ($W_{combined} = W_T \times W_G$).
  *   **Case B (Same Direction):** Both >1.0 OR Both <1.0.
      *   **Action:** Apply the Discount.
      *   *Formula:* $W_{combined} = 1 + (W_{larger} - 1) + 0.5 \times (W_{smaller} - 1)$
      *   **[JUDGMENT CALL]:** The "0.5" factor is an operational estimate to prevent double-counting. It assumes 50% redundancy.
      *   *Spreadsheet:* This is automated if you flag "Tremor/Gas Correlation = YES".
  *   **GPS:** Always multiply the GPS Weight separately. It measures structure, not plumbing.
      *   $Total\_Weight = W_{combined(T/G)} \times W_{GPS}$

  ### Step 5: Update the Board Probability (3 Minutes)
  **Action:** The spreadsheet converts the current Board Probability to **Odds**, applies the $Total\_Weight$, and converts back.
  *   *Math:* $Odds_{old} = P_{old} / (1 - P_{old})$
  *   *Math:* $Odds_{new} = Odds_{old} \times Total\_Weight$
  *   *Math:* $P_{new} = Odds_{new} / (1 + Odds_{new})$
  *   **Rounding:** Write the new Board Probability to **two decimal places** (e.g., 0.17).
      *   *Reason:* Three decimals imply false precision given the model uncertainty.

  ### Step 6: The "Public Commitment" Check (2 Minutes)
  **Action:** Compare $P_{new}$ with the current Alert Level and recent public statements.
  *   **Rule:** If $P_{new}$ suggests a *lower* alert than publicly stated, or contradicts a statement made by Leadership in the last 12 hours:
      *   **DO NOT** update the public board yet.
      *   **DO** record the number in the "Internal Draft" field.
      *   **DO** proceed to Step 7 (Case III Protocol).
  *   **Assumption:** The Board Probability is a scientific input, but the Alert Level is a socio-political contract. They are allowed to diverge temporarily to prevent loss of credibility.

  ### Step 7: Logging and Sign-off
  **Action:** Enter the following into the Shift Log:
  1.  Input Vectors (T, G, GPS).
  2.  Calculated Weights (T, G, GPS).
  3.  Correlation Discount Applied? (Yes/No).
  4.  Old Probability / New Probability.
  5.  **Analyst Signature.**
  **[JUDGMENT CALL]:** Your signature certifies that the arithmetic was followed, not that the volcano agrees with the result.

  ---

  ## 4. TEST CASES (WALKTHROUGH)

  **Baseline:** Board Probability = **0.14**
  **Baseline Odds:** $0.14 / 0.86 = \mathbf{0.1628}$
  **Reference Weights (Hypothetical for this exercise):**
  *   Tremor: Q=0.7, E=1.2, H=2.5
  *   Gas: Q=0.8, E=1.3, H=2.2
  *   GPS: Q=0.9, E=1.0, H=1.8

  ### Case (i): Tremor Uncertain, Others Quiet
  *   **Inputs:**
      *   Tremor: (0.10, 0.60, 0.30)
      *   Gas: (1.00, 0.00, 0.00) [Firmly Quiet]
      *   GPS: (1.00, 0.00, 0.00) [Firmly Quiet]
  *   **Step 3 (Channel Weights):**
      *   Tremor: $(0.1 \times 0.7) + (0.6 \times 1.2) + (0.3 \times 2.5) = 0.07 + 0.72 + 0.75 = \mathbf{1.54}$
      *   Gas: $(1.0 \times 0.8) = \mathbf{0.80}$
      *   GPS: $(1.0 \times 0.9) = \mathbf{0.90}$
  *   **Step 4 (Correlation):**
      *   Tremor (1.54) is Up. Gas (0.80) is Down. Opposite directions.
      *   No Discount. Multiply all.
      *   $Total = 1.54 \times 0.80 \times 0.90 = \mathbf{1.1088}$
  *   **Step 5 (Update):**
      *   $New Odds = 0.1628 \times 1.1088 = 0.1805$
      *   $New Prob = 0.1805 / 1.1805 = \mathbf{0.15}$
  *   **Result:** Board moves from 0.14 to **0.15**.
  *   **Log Note:** "Tremor uncertainty (60% Elev, 30% High) drove slight increase despite quiet gas."

  ### Case (ii): Tremor & Gas Ambiguous, GPS Down
  *   **Inputs:**
      *   Tremor: (0.20, 0.50, 0.30)
      *   Gas: (0.15, 0.45, 0.40)
      *   GPS: **DEAD** (Status Red)
  *   **Step 1 (Sensor Check):**
      *   GPS is Dead. Vector ignored. Weight = **1.00**.
  *   **Step 3 (Channel Weights):**
      *   Tremor: $(0.2 \times 0.7) + (0.5 \times 1.2) + (0.3 \times 2.5) = 0.14 + 0.60 + 0.75 = \mathbf{1.49}$
      *   Gas: $(0.15 \times 0.8) + (0.45 \times 1.3) + (0.40 \times 2.2) = 0.12 + 0.585 + 0.88 = \mathbf{1.585}$
  *   **Step 4 (Correlation):**
      *   Both > 1.0 (Same direction). Apply Plumbing Discount.
      *   Larger (Gas) = 1.585. Smaller (Tremor) = 1.49.
      *   $Combined = 1 + (1.585 - 1) + 0.5 \times (1.49 - 1)$
      *   $Combined = 1 + 0.585 + 0.245 = \mathbf{1.83}$
      *   Total Weight = $1.83 \times 1.00 (GPS) = \mathbf{1.83}$
  *   **Step 5 (Update):**
      *   $New Odds = 0.1628 \times 1.83 = 0.2979$
      *   $New Prob = 0.2979 / 1.2979 = \mathbf{0.23}$
  *   **Result:** Board moves from 0.14 to **0.23**.
  *   **Log Note:** "GPS failed (Weight 1.0). Tremor/Gas correlation discount applied (50% redundancy). Significant risk increase."

  ### Case (iii): The Political Conflict (The "Noon" Problem)
  *   **Context:** Deputy Director told radio at 11:00: "We expect to raise Alert Level at noon." (Implies Probability is rising).
  *   **Input:** Midday run calculates a **lower** number (e.g., 0.11) due to a sudden drop in Gas Flux that the Director hasn't seen.
  *   **Procedure:**
      1.  **Do not change the public Board Number.** Keep it at the morning value (or the value consistent with the Alert Level raise).
      2.  **Enter the calculated number (0.11)** into the "Internal Draft" field only.
      3.  **Log Entry:** "12:00 Run: Calculated Probability 0.11 (Decrease). Public Commitment: Alert Raise expected. **DISCREPANCY FLAGGED.**"
      4.  **Telephone:** Call the **Deputy Director** immediately.
          *   *Script:* "Duty Analyst here. The 12:00 model run shows a probability drop to 0.11 driven by Gas Flux. This contradicts the 11:00 broadcast. I have not updated the public board. Requesting instruction on whether to hold the Alert raise or issue a correction."
      5.  **Action:** Wait for verbal authorization before moving the public number.
  *   **Why:** The arithmetic is right, but the credibility cost of a "flip-flop" within one hour is higher than the risk of a 2-hour delay. The Director owns the public interface; you own the calculation.

  ---

  ## 5. LIMITATIONS AND FAILURE MODES

  **1. What this procedure cannot deliver:**
  *   **Truth:** It produces a consistent number, not a correct one. If the Reference Card weights are wrong (e.g., we underestimated how dangerous "Elevated" tremor is), the Board Probability will be systematically biased.
  *   **Prediction:** It updates risk based on *current* state. It does not predict *future* changes in the software vectors.
  *   **Independence:** The "Plumbing Discount" (Step 4) is a heuristic. It assumes 50% redundancy between Gas and Tremor. In a specific eruption type, they might be 90% redundant or 0% redundant. The spreadsheet cannot know this.

  **2. Where it will systematically err:**
  *   **The "Middle Bin" Trap:** If the software is poorly calibrated and consistently outputs (0.33, 0.34, 0.33) during stable periods, the math will treat this as "Uncertainty" rather than "Quiet." This may keep the Board Probability artificially high during long periods of unrest without eruption.
      *   *Mitigation:* The Science Lead must recalibrate the Reference Card every 6 months.
  *   **Cascading Failure:** If two sensors die, the Weight becomes 1.0 (Neutral). The Board Probability will freeze. It will not decay to zero. Analysts must manually review a "Frozen Board" after 48 hours of missing data.

  **3. Where arithmetic stops and signature takes over:**
  *   **The "Black Swan" Event:** If a sensor reads "High" but the analyst looks out the window and sees nothing, the analyst must override the math.
      *   *Procedure:* Set Weight to 1.0. Log: "Analyst Override. Visual confirmation contradicts Sensor X."
  *   **The "Political" Threshold:** When the Board Probability crosses a threshold that triggers a specific civil defence action (e.g., 0.25 triggers bus pre-positioning), the Analyst must telephone the Civil Defence Liaison *before* writing the number. The number is no longer just data; it is an order.
  *   **Case III Conflicts:** As shown in Test Case (iii), when the math contradicts public commitment, the signature of the Duty Director is required to publish the number.

  **Final Instruction:**
  You are the filter, not the source. The software provides the evidence; this procedure provides the consistency; your judgment provides the safety. If the spreadsheet gives you a number that makes your stomach turn, trust your stomach, call the Coordinator, and write down why you ignored the math.

