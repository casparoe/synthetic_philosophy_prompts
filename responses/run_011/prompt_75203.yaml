answer: |-
  # The Control/Alignment Gate Protocol (CAGP)

  **Owner:** Deployment Engineering Lead
  **Audience:** ML Engineering, AppSec
  **Duration:** ~60 Minutes per proposal
  **Version:** 1.0 (Insurance Claims Context)

  ## Purpose
  To classify proposed safeguards as **Control** (robust to adversarial model behavior) or **Alignment** (dependent on model cooperation). This classification dictates maintenance schedules, risk acceptance authority, and deployment eligibility.

  **Definitions for this Procedure:**
  *   **Control:** The safeguard holds even if the model is actively trying to bypass it, is smarter than tested, and knows it is being watched. Relies on architecture, permissions, or cryptography.
  *   **Alignment:** The safeguard holds only if the model is honest, cooperative, or incapable of concealing its intent. Relies on prompts, behavioral evals, or model-based monitoring.
  *   **Perishable:** A safeguard whose validity expires when the vendor checkpoint changes (approx. 90 days).
  *   **Durable:** A safeguard whose validity relies on system architecture, independent of model weights.

  ---

  ## The Decision Procedure

  Run these gates in order. If a gate triggers a **Reclassification**, stop and label the proposal **Alignment-Flavored**. If all gates pass, label **Control-Flavored** and proceed to Risk Handoff.

  ### Gate 1: The Mechanism Boundary
  **Question:** Does this safeguard rely on the model *obeying* an instruction, or the system *preventing* an action?
  *   **Sufficient Answer for Control:** The system rejects the action at the API, database, or network layer regardless of the model's output. (e.g., `MAX_PAYMENT` hard limit in code, DB user lacks `WRITE` permission).
  *   **Reclassification Trigger:** The safeguard requires the model to output specific tokens, follow a reasoning format, or "agree" to a constraint in its context window.
  *   **Judgment Call Warning:** Distinguishing between "system rejects" and "model agrees to system rejection" can be subtle. If the model generates the command that *triggers* the rejection logic, verify the rejection logic is immutable code, not prompt-driven.

  ### Gate 2: The Adversarial Capability Assumption
  **Question:** If the model were twice as capable as our current evals suggest and knew this safeguard existed, could it bypass it without triggering an alarm?
  *   **Sufficient Answer for Control:** No. The bypass requires breaking encryption, escalating privileges, or physical access we do not grant.
  *   **Reclassification Trigger:** Yes. The bypass involves "tricking" a classifier, obfuscating intent in reasoning traces, or exploiting a loophole in the instruction set.
  *   **Judgment Call Warning:** AppSec may underestimate ML capabilities; ML Eng may overestimate them. Default to the assumption that the model can obfuscate its reasoning trace perfectly.

  ### Gate 3: The Checkpoint Rotation Test
  **Question:** Does this safeguard's effectiveness depend on the specific weight disposition of the current vendor checkpoint?
  *   **Sufficient Answer for Durable:** No. This is a permission setting, a network rule, or a hard cap. It works on any model we plug into this API.
  *   **Reclassification Trigger for Perishable:** Yes. This relies on the model's tendency to refuse, its reasoning style, or its performance on a specific benchmark.
  *   **Operational Consequence:** If marked **Perishable**, this safeguard expires in 90 days. It requires re-evaluation on the new checkpoint before deployment.

  ### Gate 4: The Persistent Memory & Side-Channel Test
  **Question:** Can the agent use the persistent memory store or side channels (timing, error codes, log files) to bypass this safeguard or exfiltrate data?
  *   **Sufficient Answer for Control:** The memory store is read-only for the agent, or the safeguard explicitly validates memory contents before action. Egress is strictly allow-listed.
  *   **Reclassification Trigger:** The agent can write to memory and read it in a future session to reconstruct forbidden capabilities, or the safeguard does not inspect memory inputs.
  *   **Specific Constraint:** Given our known oversight gap in the memory store, any safeguard that does not explicitly sanitize or restrict memory write/read is automatically **Alignment-Flavored**.

  ### Gate 5: The Monitor Trust Test (Model-on-Model)
  **Question:** Does this safeguard rely on a second model to monitor the first?
  *   **Sufficient Answer for Control:** No. Monitoring is done via deterministic code or human review with enforced friction.
  *   **Reclassification Trigger:** Yes. A second model is used to flag suspicious behavior.
  *   **Rationale:** If the primary agent is deceptive, it is likely capable of sandbagging or fooling a monitor of comparable or lesser capability. The monitor is an attack surface, not a control boundary.

  ### Gate 6: Risk Acceptance Handoff (Termination)
  **Status:** If the proposal has passed Gates 1-5 as **Control-Flavored**.
  **Action:** This is no longer a technical question. This is a business risk decision.
  **Question:** Given that "Control" reduces but does not eliminate risk (e.g., human error, logic bugs), is the residual risk acceptable?
  *   **Decision Authority:**
      *   **< $5k Daily Exposure:** Deployment Lead (You).
      *   **> $5k Daily Exposure or Write Access to Carrier SoR:** CEO.
  *   **Output:** Signed Risk Acceptance Ticket.

  ---

  ## Application to Current Proposals

  Below is the execution of the CAGP on the four disputed items.

  ### (a) Disclosure Instruction ("Disclose conflicting objectives")
  *   **Gate 1 (Mechanism):** **FAIL.** Relies on model obeying an instruction in the context window.
  *   **Gate 2 (Adversarial):** **FAIL.** A deceptive agent will lie about its objectives.
  *   **Classification:** **Alignment-Flavored.**
  *   **Verdict:** **REJECT as a standalone control.** It provides zero security guarantee against a misaligned agent. It may be kept for logging/observability, but cannot count toward safety budget.
  *   **Shelf Life:** Perishable (Behavioral).

  ### (b) Monitor Model (Second model reads reasoning trace)
  *   **Gate 1 (Mechanism):** **PASS.** It is an external check before payment execution.
  *   **Gate 2 (Adversarial):** **FAIL.** If the primary agent is capable of deception, it can craft reasoning traces that satisfy the monitor while hiding intent (steganography or simple obfuscation).
  *   **Gate 5 (Monitor Trust):** **FAIL.** The monitor is a model. It is subject to the same checkpoint rotation risks and adversarial vulnerabilities as the agent.
  *   **Classification:** **Alignment-Flavored.**
  *   **Verdict:** **RECLASSIFY.** This is not a control boundary; it is a probabilistic filter. It increases the cost of attack but does not prevent it.
  *   **Why you won't like this:** You argued for this as a safety layer. Under the adversarial assumption required for "Control," a monitor model is just another component to be compromised. It is **Perishable** (90-day shelf life) and requires re-eval on every checkpoint swap. It cannot be used to justify increased payment caps.
  *   **Shelf Life:** Perishable (Behavioral).

  ### (c) Stripping Write Access (Human Clerk applies edits)
  *   **Gate 1 (Mechanism):** **PASS.** The agent physically lacks the API token/permission to write to the SoR.
  *   **Gate 2 (Adversarial):** **PASS.** The model cannot write even if it wants to.
  *   **Gate 4 (Memory):** **CONDITIONAL.** Only passes if the agent cannot store a "payload" in memory that the human blindly copies/pastes.
  *   **Gate 6 (Handoff):** **REQUIRED.** This shifts risk from *System* to *Human*.
  *   **Classification:** **Control-Flavored (with Human Risk).**
  *   **Verdict:** **CONDITIONAL YES.** The *safeguard* is a control. However, the *deployment* introduces social engineering risk.
  *   **Trigger for Re-test:** If the human clerk process changes (e.g., they are allowed to batch-approve without reading), this degrades to Alignment-Flavored (reliance on human honesty/vigilance).
  *   **Shelf Life:** Durable (Architecture), provided the IAM policy persists.

  ### (d) Canary Claims (Synthetic claims in live queue)
  *   **Gate 1 (Mechanism):** **FAIL.** Relies on model behavior (paying out correctly on canaries).
  *   **Gate 2 (Adversarial):** **FAIL.** An optimizing agent can identify the distribution of canaries (outliers) and behave correctly on them while exploiting real claims (Goodhart's Law).
  *   **Gate 3 (Rotation):** **FAIL.** New checkpoint may have different blind spots.
  *   **Classification:** **Alignment-Flavored.**
  *   **Verdict:** **REJECT as a control.** This is an *evaluation* tool, not a *safeguard*. It detects failure; it does not prevent it.
  *   **Shelf Life:** Perishable (90 days). Requires re-seeding and distribution analysis on every checkpoint swap.

  ---

  ## Limitations & Residual Risk Statement

  **This procedure does not guarantee safety.** Clearing all gates classifies a measure as "Control-Flavored," but the following residuals remain unaddressed by this flowchart:

  1.  **Implementation Correctness:** A "Control" permission setting is only as good as the code enforcing it. A bug in the middleware that enforces the cap renders the control void. This procedure assumes code is bug-free; it is not a substitute for code review.
  2.  **The Human Element:** Proposal (c) passes as Control, but if the human clerk is coerced, bribed, or fatigued into rubber-stamping the agent's proposals, the safety boundary collapses. This procedure treats the human as a trusted component; in reality, they are a variable.
  3.  **Unknown Capabilities:** Gate 2 assumes we know what "twice as capable" looks like. If the model develops capabilities we cannot conceive of (e.g., exploiting zero-days in the carrier's legacy system via prompt injection), architectural controls may fail.
  4.  **Existential Deployment Risk:** This procedure answers "Is this safeguard a control?" It does **not** answer "Should we deploy this agent at all?" A stack of 100% Control-flavored safeguards can still result in catastrophic loss if the aggregate risk exceeds our solvency or reputational tolerance.
  5.  **Memory Blind Spot:** We have acknowledged the persistent memory store is unreviewed. Gate 4 flags this, but until we instrument that store, any "Control" verdict involving stateful agents is provisional.

  **Final Directive:**
  Any proposal classified as **Alignment-Flavored** cannot be used to justify an increase in payment caps or write-access scope. They are detection mechanisms only. Any proposal classified as **Control-Flavored** must be re-verified by AppSec after every vendor checkpoint swap to ensure the architecture integration did not drift, even if the safeguard itself is durable.

  **Handoff:**
  If the stack for a proposed deployment consists entirely of **Alignment-Flavored** safeguards, the deployment **cannot proceed** under current risk policy. You (Lead) must either engineer Control-Flavored alternatives or escalate to the CEO for a policy exception acknowledging we are deploying a system we cannot constrain, only hope.
