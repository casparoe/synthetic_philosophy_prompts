  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Hart's actual view:* Hart didn't argue for retroactive punishment as a *general rule* (Step 9). He argued it was the *least bad* solution for *this specific transitional justice* problem. Step (8) is the overreach by the friend.
