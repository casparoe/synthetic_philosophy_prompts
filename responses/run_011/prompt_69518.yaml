      *   **Point B: The Description of the Court's Action (Step 6 & 11).** Did the post-war court actually apply a *retroactive statute*? Or did they use a principle of statutory interpretation or a natural law principle inherent in the *new* system to interpret the *old* code? Hart says they should have passed a retroactive statute. The actual court used the 1871 Code + a moral principle.
