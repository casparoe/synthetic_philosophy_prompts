      *   *Selected Analogy:* **Smart Contracts in Escrow.**
          *   Why: It emphasizes that code *executes* based on conditions. It highlights that you need to write the *right* code to cooperate, not just show code. It captures the "if-then" logic of Program Equilibrium (e.g., "I cooperate if I can prove you cooperate").
          *   Alternative: **The Glass House Standoff.** Two people in glass houses with guns. You can see each other's finger on the trigger. Does this make you lower the gun? No, it makes you tense. Unless you have a mechanism to lower them *together*.

      *   *Refining the Better Analogy:* Let's go with **"Smart Contracts"** or **"Automated Escrow."**
          *   It captures the "code is law" aspect.
