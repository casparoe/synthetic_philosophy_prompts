          *   It captures the technical difficulty (bugs, exploits).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the elegance of the hook but state clearly that it breaks down under technical scrutiny.
      *   *Section 1: The Mapping.* Do the requested table (Hand, Bluff, etc.).
      *   *Section 2: The Critical Disanalogies.*
          *   Focus heavily on Zero-Sum vs. Non-Zero-Sum. This is the biggest killer. In poker, face-up ends the game. In PD, face-up starts the real game.
          *   Focus on Computational Cost (Halting Problem). Reading isn't free.
          *   Focus on Recursion (Quining).
      *   *Section 3: Policy Audit.* "For free" is the dangerous phrase. Cooperation requires *specific* algorithms (FairBot), not just openness. Openness without the right logic leads to transparent defection.
      *   *Section 4: Better Analogy.* Smart Contracts / Automated Escrow. Explain why it fits better (conditional execution, need for specific logic).

  7.  **Self-Correction/Review during drafting:**
