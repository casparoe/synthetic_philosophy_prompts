prompt: |-
  a friend of mine is drafting a blog post about program equilibrium — the setup where each player in a prisoner's dilemma hands in a program that gets to read the other player's source code before deciding what to do. his hook is an analogy: mutual code inspection is like playing poker with your cards face up, once the bluff is impossible the table settles into honesty on its own. he uses that to argue that if we push deployed AI systems toward open weights and mutual interpretability, cooperation basically falls out for free and we don't have to design anything clever on top.

  can you audit the analogy for me? I want the mapping spelled out — what plays the hand, the bluff, the tell, the reveal, the pot — and then the disanalogies that actually matter for his argument, as opposed to the ones that are just surface detail. I especially want to know what features of poker he's quietly importing that the program game doesn't have (my vague sense is that it's something about the reading step being treated as free, and about the game having a determinate answer once everything is visible, but I can't articulate why that's a problem). then: does his policy conclusion survive once those are on the table, and if the poker picture is just wrong, what would be a better analogy that doesn't overpromise?
