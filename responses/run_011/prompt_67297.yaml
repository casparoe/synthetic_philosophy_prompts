  1. The paired case
  Alice and Bob audit invoices for the same firm, sharing an identical prior: $N$ is uniform over integers from 40 to 200. Both confirm the document before them is the 40th invoice produced this month. Their evidence differs solely in assignment mechanism. Alice draws a file blindly from the month's completed stack; her holding #40 is a random sample from $N$. Bob is the senior auditor; protocol mandates he *always* audits the 40th invoice regardless of $N$. The protocol carries no information about $N$. Both know their mechanism.

  2. The likelihood and posterior mean
  For Alice, likelihood $P(\text{obs}=40|N) = 1/N$. Her posterior mean (the expected value of $N$ updated on observation) is calculated as $\sum_{N=40}^{200} 1 / \sum_{N=40}^{200} (1/N)$. The numerator is 161; the denominator sums reciprocals to approx 1.62. Result: 99. For Bob, likelihood $P(\text{obs}=40|N) = 1$ for all $N \ge 40$. His posterior mean equals the prior mean, 120. Alice revises downward; Bob revises not at all. The arithmetic follows directly from the likelihood ratios.

  3. The feature and removal test
  The working feature is selection bias versus fixed designation. Removal test: If Bob's rule targets a fraction of $N$ (e.g., audit the 25% mark), observing 40 implies $N=160$. This licenses an upward revision from 120 to 160. The divergence inverts: Alice revises down, Bob now revises up. The vanishing of the "no revision" result shows the original immunity depended on the rule's independence from $N$. If the rule tracks $N$, Bob becomes informative.

  4. The mapping onto the doomsday argument
  In the human case, the "draw" corresponds to being a random sample from all humans; the "standing rule" corresponds to birth rank being fixed by laws independent of total population. I argue we occupy the "draw" branch. Birth rank is indexical within the total set of humans, not fixed by a law that guarantees specific ranks regardless of population size, so we are samples from the set rather than fixed points outside it.

  5. The best reply available to a committed defender
  A defender replies by restricting the reference class to "observers unaware of selection mechanisms." This redescription is ad hoc unless backed by an independent criterion, such as causal independence of observer generation from total $N$. Without such a criterion, the restriction merely rigs the math to avoid the downward revision licensed by the sampling assumption. To be principled, the criterion must identify why human birth ranks are causally insulated from total population size, which remains unsupported.
