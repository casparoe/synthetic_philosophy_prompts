answer: |-
  ### The Menu of Readings

  The slogan "the wavefunction isn't a thing" functions as a placeholder for at least five distinct metaphysical theses. Below, each is stated precisely, classified by its dialectical status, and analyzed against your three criteria: (a) $\psi$-epistemicity (overlap of distributions over underlying states $\lambda$), (b) Ontological vs. Nomological status, and (c) Separability/Local Supervenience.

  **1. The Radical Anti-Realist Reading (QBism)**
  *   **Thesis:** The wavefunction is exclusively a catalog of an agent's subjective degrees of belief regarding future measurement outcomes; it has no counterpart in external reality.
  *   **Classification:** Substantive and defensible (requires a rejection of the ontological-models framework).
  *   **Commitments:**
      *   (a) **Yes.** Distinct pure states can correspond to the same underlying reality (because there is no commitment to an underlying $\lambda$ fixed by the state; $\lambda$ is either non-existent or irrelevant to the assignment of $\psi$).
      *   (b) **Neither.** It belongs to the epistemology of the agent, not the ontology or dynamics of the world.
      *   (c) **N/A.** Since $\psi$ is not a feature of the world, questions of worldly separability do not apply to it.

  **2. The $\psi$-Epistemic Reading (Spekkens-style)**
  *   **Thesis:** The wavefunction represents incomplete knowledge about an underlying physical state $\lambda$; distinct wavefunctions can be compatible with the same $\lambda$.
  *   **Classification:** Substantive, but empirically pressured (by PBR, conditional on framework acceptance).
  *   **Commitments:**
      *   (a) **Yes.** By definition, probability distributions over $\lambda$ for distinct $\psi$ overlap.
      *   (b) **Ontology (Derivative).** It describes the ontology ($\lambda$) but is not itself part of the fundamental furniture.
      *   (c) **Contingent.** Depends on the nature of $\lambda$. If $\lambda$ is local, the picture can be separable; if $\lambda$ is holistic, it is not.

  **3. The Nomological Reading (Bohmian Humeanism)**
  *   **Thesis:** The wavefunction is a real component of the best system of laws governing the motion of particles, analogous to a Hamiltonian, rather than a physical field or substance.
  *   **Classification:** Substantive and defensible.
  *   **Commitments:**
      *   (a) **No.** The law is fixed for the universe; there is no distribution over $\lambda$ in the sense of ignorance. (Though in Bohmian mechanics, $\psi$ uniquely determines the guidance equation).
      *   (b) **Dynamical Law.** It is part of the nomic structure, not the material ontology.
      *   (c) **No.** The law acts globally on the configuration of all particles; it does not supervene locally on 3D regions.

  **4. The Dispositional Reading (Propensity Ontology)**
  *   **Thesis:** The wavefunction is a real, physical property of a system, specifically a dispositional power or propensity to produce measurement outcomes, not a categorical substance.
  *   **Classification:** Substantive and defensible.
  *   **Commitments:**
      *   (a) **No.** The disposition is fixed by the physical state; distinct states imply distinct dispositional profiles.
      *   (b) **Ontology (Property).** It is a real property of the system, distinct from the substance bearing it.
      *   (c) **No.** Quantum dispositions are typically holistic; the propensity of a subsystem is not defined independently of the whole.

  **5. The Fictionalist Reading (Eliminativism)**
  *   **Thesis:** The wavefunction is a useful mathematical fiction; the fundamental ontology consists solely of discrete events (e.g., flashes or hits), and $\psi$ is merely a tool to calculate their probabilities.
  *   **Classification:** Substantive and defensible (e.g., in GRW flash ontology).
  *   **Commitments:**
      *   (a) **N/A.** There is no underlying $\lambda$ that $\psi$ describes; $\psi$ is false but useful.
      *   (b) **Neither.** It is not ontological furniture nor law, but a heuristic device.
      *   (c) **Yes (for the ontology).** The flashes are local events in 3D space; the fiction ($\psi$) is global, but the reality is separable.

  ***

  ### Addressing the Three Questions

  **1. Does the Pusey–Barrett–Rudolph (PBR) argument rule any of these readings out?**
  PBR rules out **Reading 2 ($\psi$-Epistemic)**, *provided* one accepts the **ontological-models framework**. The argument demonstrates that if distinct pure quantum states correspond to overlapping probability distributions over an underlying physical state $\lambda$, and if systems prepared independently have independent physical states (preparation independence), then predictions will contradict quantum mechanics.

  However, PBR leaves the other readings untouched because they reject the presuppositions of the framework:
  *   **Reading 1 (Anti-Realist)** rejects the existence of the observer-independent $\lambda$ required by the framework.
  *   **Reading 3 (Nomological)** rejects the categorization of $\psi$ as a state of a system $\lambda$; laws are not states subject to statistical overlap in the same way.
  *   **Reading 5 (Fictionalist)** denies that $\psi$ describes $\lambda$ at all.

  Therefore, the force of PBR changes entirely depending on whether one accepts the ontological-models framework. For a QBist or a Nomological Bohmian, PBR is often viewed as a *reductio* of the framework itself, not a proof of $\psi$-ontology.

  **2. Which reading dissolves the objection that a fundamental ontology on configuration space is not the space we inhabit?**
  **Reading 3 (The Nomological Reading)** dissolves this objection most effectively.
  *   **Relocating the Objection:** Configuration Space Realism (the view that $\psi$ is a concrete field on 3N space) *relocates* the objection. It admits we inhabit 3D space but claims reality is 3N-dimensional, requiring an error theory of perception to explain why we see 3D.
  *   **Dissolving the Objection:** The Nomological reading makes the spatial location of $\psi$ a category mistake. Laws do not "inhabit" space in the way objects do; they govern objects that inhabit space. If $\psi$ is a law governing particles in 3D space, it does not need to *be* in 3D space, nor does it require us to inhabit 3N space. It renders the dimensionality of the domain of $\psi$ mathematically necessary but ontologically inert regarding "inhabitation."
  *   **Reading 1 (Anti-Realist)** also dissolves the worry, but at the cost of removing $\psi$ from reality entirely, which may be too high a price for a realist reading group.

  **3. What exactly is being equivocated when a Bohmian and a QBist both say the wavefunction is not a thing?**
  They are equivocating on the **positive account of what the wavefunction is**, while agreeing only on the **negative account of what it is not**.
  *   **The Agreement (Negative):** Both deny that $\psi$ is a *concrete material substance* or a *classical field* residing in 3-dimensional space. They agree it is not a "thing" in the sense of a local beable.
  *   **The Equivocation (Positive):**
      *   The **Bohmian** asserts: "It is not a thing; it is a **Law**." (Objective, mind-independent, world-guiding).
      *   The **QBist** asserts: "It is not a thing; it is a **Belief**." (Subjective, mind-dependent, action-guiding).
  *   **The Consequence:** They take themselves to be allies against the Configuration Space Realist, but they are actually diametrically opposed on the status of reality. The Bohmian saves realism by changing the category of $\psi$ (from object to law); the QBist saves locality/intuition by sacrificing realism about $\psi$ (from world to mind).

  ***

  ### Testing the Conjecture

  Your working guess is that the ambiguity turns on two separable questions:
  1.  **Ingredient vs. Description:** Is $\psi$ part of the world or a way of describing it?
  2.  **State vs. Rule:** Is $\psi$ a state of a system or a rule governing systems?

  **Verdict:** This conjecture is **incomplete and slightly misaligned**.

  **Critique:**
  1.  **"Description" is ambiguous.** A law can be described. A belief is a description. The crucial distinction in Question 1 is not whether it describes, but *what the description is of* (the world vs. the agent) and whether the description *corresponds to a real entity*. "Ingredient of the world" conflates Ontology (furniture) with Reality (mind-independence). A law is real but not an "ingredient" (furniture).
  2.  **"State vs. Rule" misses Dispositionalism.** Reading 4 (Dispositionalism) treats $\psi$ as a real property (State/Ingredient) but not a categorical substance. It is a "rule-like" property (a power), blurring your second dichotomy.
  3.  **Missing the Spatial/Dimensional Axis.** The specific worry driving your reading group is about *Configuration Space*. Your taxonomy does not explicitly track where the entity is supposed to reside (3D, 3N, or Non-spatial).

  **Proposed Replacement Taxonomy:**
  To capture the equivocation precisely, replace your two questions with a **three-axis taxonomy**:

  1.  **Mind-Dependence:** Is $\psi$ objective (world-involving) or subjective (agent-involving)?
      *   *Splits QBism (Subjective) from Bohmianism/Realism (Objective).*
  2.  **Categorical Kind:** Is $\psi$ a Substance, a Property, a Law, or Information?
      *   *Splits Configuration Space Realism (Substance/Field) from Nomological (Law) from Epistemic (Information).*
  3.  **Locus of Supervenience:** Does $\psi$ supervene on local 3D facts, global 3N facts, or nothing?
      *   *Splits Separable models from Holistic models from Anti-Realist models.*

  **Why this is better:**
  Your "Ingredient vs. Description" maps roughly to Axis 1 (Mind-Dependence), but fails to distinguish between a Law (Objective, not Ingredient) and a Substance (Objective, Ingredient). Your "State vs. Rule" maps to Axis 2 (Categorical Kind), but fails to capture Dispositional properties which are states that act like rules. By adding Axis 3, you directly address the configuration space worry, allowing you to see that the Bohmian and QBist agree on Axis 3 (it doesn't supervene on 3D local facts) but disagree fundamentally on Axis 1 and 2.
