answer: |-
  Standfirst
  Showing people a grid stops Allais violations, but this saves expected utility theory only by sacrificing description invariance or changing the subject entirely.

  The thesis, precisely
  The claim is not that subjects violate independence in the grid—they do not. Nor is it that expected utility theory is false as a normative ideal. The claim is that the display thesis fails to vindicate the independence axiom as a constraint on rational choice over the original prospects. If the grid alters the object of choice, the data no longer address the canonical paradox. If the grid preserves the object of choice, the reversal demonstrates a failure of description invariance, which is itself a rationality defect. The theorist cannot claim the axiom stands unchallenged. The victory is illusory because it purchases compliance with independence at the cost of another rationality requirement, or it purchases relevance at the cost of changing the subject. There is no third horn where the axiom is saved without cost. The independence axiom remains unsupported by this manoeuvre.

  The display thesis at its strongest
  The display theorist argues that standard text obscures the logical structure of the gamble. When options are printed as paragraphs, the common consequence—the eighty-nine per cent chance of one million in the first problem—is buried in the arithmetic rather than displayed in the geometry. The grid makes the state-space explicit. It aligns the tickets so the commonality is perceptually immediate, not computationally derived. On this view, expected utility theory is a theory of choice under known risk, and risk is defined over states of the world. If the description fails to map states to outcomes clearly, the subject is not evaluating the intended lottery. Therefore, the theory is entitled to stipulate the canonical format. Just as we do not test arithmetic competence with ambiguous notation, we should not test rationality with ambiguous displays. The grid does not manufacture preference; it removes friction. It reveals the underlying preference that was always there, masked by cognitive load. If subjects choose consistently on the grid, they are satisfying independence where it matters. The standard violation was a performance error, not a competence failure. The axiom survives because the counter-evidence was artefactual. Furthermore, normative theory need not accommodate every cognitive quirk. If the grid aligns with the mathematical structure required by Savage's framework, it is the correct description. The standard text is merely a corrupted signal. By correcting the signal, the theorist restores the link between choice and principle. The violation disappears because the confusion disappears. This is not evasion; it is clarification. The subject is finally seeing the problem as the theory sees it.

  The dilemma
  1. **Conceptual Claim:** The standard text and the normalized grid are either descriptions of the same decision problem or descriptions of distinct decision problems. There is no middle ground where they are distinct yet equivalent for the purpose of testing axioms. Identity of prospects is determined by outcomes and probabilities, not by visual layout, unless layout alters the psychological experience of risk. If the layout changes the experience, it changes the object.

  2. **Empirical Bet:** The display thesis relies on the observation that choice patterns differ between these two formats. Subjects violate independence in the standard text but comply in the grid. This empirical fact is the engine of the theorist's claim. Without this reversal, the grid is merely a stylistic choice. With it, the grid becomes a diagnostic tool.

  3. **Formal Result:** If the formats describe distinct problems, then compliance in the grid establishes nothing about preferences over the standard text. The theorist has substituted a new object of choice. The original Allais paradox concerns the canonical description; solving a different problem leaves the original paradox intact. You cannot test sensitivity to common consequences using a display that makes those consequences perceptually salient if the original test was about logical inference. The axiom applies to lotteries, not to grid-interpretations.

  4. **Conceptual Claim:** If the formats describe the same problem, then the shift in choice constitutes a framing effect. The prospects remain identical in probability and outcome; only the presentation changes. The physical lottery ticket is the same; the ink on the page differs.

  5. **Conceptual Claim:** Description invariance—the requirement that preference should not depend on irrelevant descriptive features—is a necessary condition of rational choice. This is distinct from independence, but equally foundational. Rational agents should not be swayed by typography when mathematics is constant. If invariance fails, the agent is not maximizing utility over outcomes, but over descriptions. This requirement is not merely procedural; it ensures that preferences track value rather than cognition. If value changes with font, value is not stable.

  6. **Formal Result:** Therefore, if the problems are the same, the subjects violate description invariance. The data show a failure of rationality, merely shifting the locus from independence to invariance. The theorist claims to have saved rationality, but has merely moved the goalpost to a different rationality constraint.

  7. **Conceptual Claim:** A vindication of the independence axiom requires showing that rational agents satisfy it over the relevant prospects. Showing they satisfy it only when description invariance is artificially enforced proves only that independence holds conditional on invariance. It does not prove the agents are rational simpliciter.

  8. **Conclusion:** Either the display thesis is irrelevant to the canonical paradox, or it confirms a different rationality failure. The independence axiom is not vindicated. The theorist wants to say the axiom was never threatened, but the threat was simply relocated. If the grid changes the problem, the threat remains in the original. If the grid keeps the problem, the threat emerges as a violation of invariance. There is no escape. The cost of saving independence is admitting that human choice is fragile under redescription. The theorist hoped to show the paradox was an illusion. Instead, they show the paradox is robust, merely migrating from one axiom to another.

  9. **Conceptual Claim:** Consequently, the display thesis cannot support the strong conclusion that expected utility theory is descriptively adequate. It shows adequacy only under privileged conditions that do not obtain in the wild.

  10. **Final Deduction:** The independence axiom remains unsupported by this manoeuvre.

  Objections and replies
  (i) A theorist may stipulate canonical descriptions without changing the subject, much as logic stipulates valid forms. But stipulation cannot force compliance. If the theory demands a format humans do not naturally use, it ceases to be descriptive. It becomes a prescription for how to think, not a model of how we choose. The display thesis claims descriptive adequacy; stipulation undermines that claim. You cannot claim people are rational maximizers if they only maximize when you hand them a calculator.

  (ii) If violations fade under repeated, incentivized play, this satisfies invariance rather than violating it. But this removes the second horn only by admitting the initial state was irrational. Learning to be invariant confirms invariance was initially violated. The axiom is not saved; the agent is trained. Rationality is shown to be a skill, not a state. The display thesis argues the axiom was never threatened. But if threats are removed by training, the threat was real.

  (iii) This argument proves too much, since no framing effect could ever count as evidence about any axiom. Not so. Framing data remains evidence; it simply evidences invariance failure rather than independence failure. The data are not inert; they are reinterpreted. The total weight against rationality remains. We still know agents are not ideal expected utility maximizers. The epistemic value of the data is preserved, even if the specific axiom violated changes.

  (iv) The strongest objection is that the grid is the true canonical form, and text is merely noise. I choose this because it attacks the first horn directly. If the text is a corrupted signal, testing it is like testing arithmetic with smudged numbers. But risk in the real world arrives as text, not grids. A theory of choice must handle the interface of reality. If the grid is required for rationality, then rationality is fragile. The theory fails to guide action where it is needed most. If the grid is the only safe harbor, then the open sea of standard description is where the theory shipwrecks.

  What would settle it
  To drop this thesis, one would need to demonstrate that description invariance is not a requirement of rationality, but merely a heuristic. If rationality allows for framing sensitivity, the second horn dissolves. Alternatively, if it could be proven that the standard text actually alters the probabilities perceived by the agent—making it a different problem by definition—the first horn would close. A study showing that grid-compliant subjects also fail invariance in non-Allais contexts would seal the second horn. I suspect the second horn is harder to escape. Invariance is too central to the concept of preference. If preferences change with ink, they are not preferences over outcomes. The first horn is easier to dodge by simply declaring the grid canonical. But the second horn strikes at the heart of what it means to have a stable utility function. Until invariance is dethroned, the display thesis remains a relocation of failure, not a resolution. The burden is on the theorist to show why invariance matters less than independence.
