prompt: |-
  I'm a backend engineer, no philosophy training beyond random late-night reading, so bear with me if I frame this weirdly.

  Our team owns an internal data pipeline that about 40 other teams depend on. For the last year I've been spending Sunday mornings building an observibility layer for it that nobody asked for and that isn't on anyone's roadmap. Its saved the downstream teams a ton of 3am pain. Here's the part that's bugging me though: at review cycle it got counted as a promotion-level contribution, my skip-level gave a talk about it, and now two other people I know are doing similar extra work — and one of them told me straight out that they feel like they have to, because after what I did it's kind of the baseline now.

  The word I found for the thing I thought I was doing is supererogation — acts that are morally good but beyond the call of duty, where you get praised for doing them but can't be blamed for skipping them. My worry is that the category doesn't survive contact with a case like mine, where a few people's "beyond duty" acts ratchet up what everyone else is expected to do, so the extra work stops being extra.

  So: what's your actual credence, as a number, that supererogation is a genuine and non-reducible category of moral evaluation? By that I mean — there really are acts that are morally better than duty requires, that it would be wrong to demand of someone, and this isn't just a confusing way of describing either (a) duties we're too squeamish to enforce or (b) points on a single better-to-worse scale with no line drawn anywhere.

  Please decompose it rather than just give me the number. I want rough probabilities on the sub-questions it rests on, something like: whether there's any principled agent-centered permission to not maximize the good; whether the required/permitted line can be non-arbitrary if goodness is scalar all the way down; whether praise-without-blame is even a coherent attitude to hold toward an act; whether supererogation needs the act to be net costly to the agent, and if so whether career credit like mine converts the act into self-interest and drops it out of the category entirely; and whether the ratchet effect I described actually eats the category or is just a contingent fact about how social enforcement happens to work in a company. Show me how you'd combine those into the final number, say which one your credence is most sensitive to, and what argument or observation would move it most.

  And if you think my ratchet worry is actually the decisive issue rather than a side note, just say so — I suspect I'm overweighting it because it's the part that's messing with me personally.
