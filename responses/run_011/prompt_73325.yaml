answer: |-
  The patchwork of intellectual property regimes presupposes a theory of **legal instrumentalism** rather than any coherent moral theory of natural ownership. It does not treat the 'owned object' as a singular metaphysical entity—be it mental content, labour, or personality—but rather as a **statutory privilege** calibrated to specific economic contexts. In this view, the object of ownership is not the idea itself, but a **state-sanctioned market advantage** whose contours shift depending on the cost of production, the ease of concealment, and the public benefit of disclosure. Consequently, the 'object' is a chameleon: in trade secret law, it is a **relationship of trust**; in patent law, it is an **entry in a public register**; and in copyright, it is a **fixed expression** linked to an author's labour, albeit one permeable to independent recreation.

  This pattern decisively **rules out** rival accounts based on **Natural Law**, specifically Lockean labour theory and Hegelian personality theory. A strict Lockean account holds that mixing one's labour with resources creates a natural property right; yet patent law denies title to the second inventor despite their independent labour, ruling out labour as a sufficient condition for entitlement. Similarly, a Hegelian personality theory posits that creations are extensions of the self; yet copyright permits two authors to hold rights in identical expressions (provided independent creation), while patent law forbids the second author from exercising rights over their own mental content. These regimes do not merely fail to support natural rights theories; they actively contradict them by making entitlement contingent upon statutory compliance (filing, secrecy measures) rather than moral desert.

  Could a purely instrumental, incentive-based story license all three attitudes without a theory of ownership? **Yes.** A utilitarian framework explains the divergences as calibrated solutions to different market failures. Copyright permits independent creation because the cost of monitoring all human expression would stifle creativity; the 'subconscious copying' exception (as in *Bright Tunes Music v. Harrisongs Music*, 1976) is not a moral assertion of ownership over melodies, but a negligence standard to discourage careless exposure to prior works. Patent law bars independent invention to secure the 'bargain' of disclosure: the state grants a temporary monopoly to induce the inventor to publish the method, and barring later inventors ensures the first filer recoups the high costs of R&D and patenting. Trade secret law encourages security measures without granting a monopoly, fostering competition through reverse engineering.

  Are the differences genuine contradictions? Mostly, they are **apparent**, reflecting distinct policy goals for distinct industries. However, the doctrine of **subconscious copying** in copyright represents a genuine tension. It imports a patent-like strictness into a regime predicated on independent creation, effectively punishing a mental state (forgetting) rather than a wrongful act (taking). This sits uneasily with the instrumental justification for copyright, which is to promote production, not to police the subconscious.

  If a legislature imposed a single rule that **entitlement tracks causal contribution**—meaning a person owns what they actually produced and is liable only for what they actually took—the regimes would react as follows:

  1.  **Trade Secret Law:** Would require **little to no change**. It already aligns with this principle, as liability attaches only to improper acquisition or breach of confidence, not to independent derivation.
  2.  **Copyright Law:** Would have to **abolish the doctrine of subconscious copying**. George Harrison would not be liable if he causally produced the melody himself, regardless of prior exposure. It would also clarify that striking similarity alone is insufficient for liability without proof of actual access and copying.
  3.  **Patent Law:** Would face **total incompatibility**. The core of patent law is the right to exclude others from practising an invention they independently conceived. To comply, patent law would have to cease being an exclusionary right and become a system of **bounties or rewards** paid to the first inventor, without preventing the second from using their own causal contribution.

  The existing doctrine hardest to reconcile with the principle of causal contribution is **Patent Law**. Its entire architecture is built upon the 'first-to-file' (or 'first-to-invent') priority, which explicitly severs the link between causal contribution and entitlement for all but the first claimant. To align patent law with causal contribution would be to dismantle the patent system as it is currently understood, transforming it from a property right into a mere prize. Thus, the patchwork reveals that intellectual 'property' is not a unified field of ownership, but a collection of regulatory tools where the notion of 'theft' is defined by the statute, not by the act of creation itself.
