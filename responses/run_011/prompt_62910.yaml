      *   **The Failure:** A specific night. A birth or death. The fires don't light. The reason: Kael didn't light because he thought the others wouldn't expect him to, because he's new/different.
      *   **Conclusion:** The disagreement remains.

  6.  **Writing - Focusing on Constraints:**

      *   *Word Count Check:* Need to expand descriptions and internal monologue to hit 1,200-1,800.
