      *   *Ending:* Elara and Silas looking at the dark ridge.

  8.  **Refining the "Failure" (Lewis's R-Condition):**
      *   Lewis emphasizes that conventions persist because of *mutual expectations*.
      *   The failure must be a breakdown in *mutual* expectations of *mutual* expectations.
      *   Kael: "I will not light because I believe they do not expect me to light."
      *   Silas: "I will not light because I believe Kael will not light."
