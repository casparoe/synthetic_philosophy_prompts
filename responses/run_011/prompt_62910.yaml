answer: |-
  The valley of High Stone lay like a cupped hand holding the dark. On the ridges surrounding the floor, seven farms clung to the rock, each with a pyre of dry pine stacked on a stone altar. For four generations, the people of the valley had spoken to one another not with words, but with flame.

  Elara stood on the porch of the lowest farm, her breath pluming in the frost. It was the evening of the Winter Solstice, the night the fires were meant to burn steady and white to signify survival through the coming snows. Above her, six other points of light ignited in a slow cascade, starting from the north and moving south. When the final fire, old Silas's on the western spur, caught, the valley was whole.

  It had always been this way. The order mattered. The color mattered. A blue flare meant avalanche danger; a double-peak of flame meant a birth; a single, dying ember meant a death. There was no law written down that said the northern farm must light first. There was no penalty if a farmer lit late, or used wet wood that smoked black. Yet, no one ever did. They lit when they saw the neighbor light. They used dry pine because the neighbor used dry pine.

  Then came the surveyor.

  Miss Vance arrived in late spring with a theodolite and a notebook. She stayed in the inn on the valley floor and spent a week mapping the ridges. On her final evening, she invited the farmers to the common hall. She unrolled a chart showing the valley as a network of lines.

  "I have calculated the sightlines," Vance said, her voice crisp. "Your fire code works, but it is slow. Smoke obscures the third ridge. I propose a system of mirrored flashes. Sun by day, lantern by night. One flash for safety, three for danger. It cuts the time of transmission in half. It is immune to wind."

  Silas, whose hands were gnarled like the roots of the pines he burned, leaned on his staff. "The fire warms the blood as it rises," he said. "The mirror is cold."

  "The message arrives the same," Vance countered. "If the goal is to know if your neighbor is safe, the mirror tells you faster."

  Elara watched the room. She saw the farmers shift in their seats. They did not argue that the mirror was worse. They did not claim the fire was truer. They simply looked at one another. Elara realized then that the value was not in the signal itself, but in the matching. If Elara used a mirror and Silas used fire, they were no longer speaking the same tongue. If Elara switched to mirrors, but Silas stayed with fire, she would be shouting into a silence of his making.

  She preferred to use fire, provided Silas used fire. Silas preferred fire, provided Elara used fire. Vance's system was perfect, but it required everyone to step off the ledge at the same moment. No one was willing to be the first to fall, even if the net below was stronger. So, the mirrors remained in Vance's pack, and the pine stacks grew higher.

  Years turned. The snows came and went. In the fifth year after Vance's departure, the telegraph line crept up the valley pass. Copper wire strung on wooden poles hummed with a voice from the lowlands. News of market prices, weather fronts, and political shifts arrived instantly in the postmaster's office. The fires were no longer needed for information. If an avalanche buried the northern road, the wire would tell them before the smoke cleared.

  Yet, the fires remained.

  One evening, Elara found Silas stacking wood on his ridge. The telegraph pole stood stark and black against the twilight sky, useless and silent.

  "Why do we still burn?" Elara asked, handing him a bundle of kindling. "The wire tells us the weather. The doctor sends word by rider."

  Silas struck a flint. The spark caught the tinder. "The wire tells us facts," he said. "The fire tells us who we are."

  "Vance said it was just a way to move news," Elara said. "Now the news moves another way. The fire is just... habit."

  "Habit is the root of belonging," Silas replied. He stood back as the flame took hold. "If you stop lighting, you say you are no longer of the ridge. It is not about the news anymore. It is about the light."

  Elara looked down at the valley floor. She saw the telegraph office, warm and lit by oil. She looked up at the seven ridges. She felt the pull of Silas's words, but she also remembered Vance's charts. The fire was arbitrary. It could have been anything. Now that the need was gone, was it a bond, or was it a chain?

  The disagreement settled over the valley like the winter mist. Some, like Silas, tended their pyres with religious care. Others, younger farmers who traded often with the lowlands, began to let the wood grow damp. They lit them only on the solstices, treating the ritual as a holiday rather than a duty.

  The break came on a Tuesday in deep winter. There was no solstice, no festival. It was simply a night like any other.

  Kael, a newcomer who had bought the eastern farm two years prior, stood by his pyre. He had a new daughter, born that morning. By the old code, a birth was signaled by a double-peak flame, lit within the hour of sunset. Kael had the wood ready. He wanted to light. He looked across the valley to Silas's ridge and to Elara's below.

  Kael knew the rule: *We all light when there is news.*
  Kael believed: *They will light if they know there is news.*
  But Kael also thought: *They do not know my child is born. The telegraph is down; the rider has not reached them. They think I have no news.*

  Kael paused, the match in his hand.
  If he lit the double-peak, and they did not know why, would they understand? Or would they think he was signaling danger?
  More importantly, Kael thought about the others.
  *Silas expects me to light only if I have news,* Kael thought. *Silas does not know I have news. Therefore, Silas expects me not to light.*
  *If Silas expects me not to light, Silas will not light his own fire in response.*
  *If Silas does not light, the chain is broken.*
  *If the chain is broken, my fire stands alone. A lone fire means isolation. A lone fire means I am not one of them.*

  Kael wanted to light. He believed that if he lit, the others *would* light—they were good people, they kept the rhythm. But he believed that *they believed* he would not light, because they lacked the knowledge of the birth. And because he believed they believed he would not light, he concluded they would not light themselves.

  If they did not light, and he did, he would be the outlier. He would be the man who broke the pattern.

  So Kael stepped back. He let the match burn down to his fingers before dropping it into the snow. He told himself he would wait for the rider to spread the word, and then tomorrow night, they would all light together. It was a decision made of love for the pattern, a desire to match the others.

  Across the valley, Silas stood on the western spur. He had seen the rider pass Kael's farm earlier. He suspected a birth. He had his wood ready.
  Silas thought: *Kael is new. He does not know the weight of the fire. He will not light unless he is sure we are watching.*
  *If I light, and Kael does not, I am shouting at a closed door.*
  *So I will wait for Kael.*

  Elara, on the lower ridge, watched both of them. She saw the darkness on the eastern spur. She saw the darkness on the western.
  *They are waiting for each other,* she realized.
  But she did not light either. To light alone would be to claim a voice the others were not using. She waited for the chorus.

  The valley remained dark. The telegraph wire hummed in the wind, carrying messages of grain prices to the capital. In the silence of the high stone, seven families sat in their warm houses, assuming their neighbors were doing the same, assuming the silence meant peace, assuming the darkness was shared.

  The next morning, the rider arrived. The news of the birth spread. That evening, all seven fires burned double-peak, bright and furious. The pattern was restored.

  But the doubt remained.

  Elara met Silas at the trail head a week later. The snow was hard under their boots.

  "Kael didn't light," Silas said. It was an accusation, but a soft one.

  "He thought you wouldn't," Elara replied. "And you thought he wouldn't."

  "We light to show we are together," Silas said. "If we stop because we guess what the other is thinking, the light dies."

  "Vance would say the system failed," Elara said. "She would say we relied on something that wasn't there. We trusted a feeling instead of a wire."

  "The wire doesn't care if I freeze," Silas said. He looked up at the eastern ridge, where Kael's smoke was just beginning to rise for the evening. "The fire cares. The fire requires us to be sure of each other."

  "And if we can't be sure?" Elara asked. "If the valley grows? If more people come who don't know the wood, or the order, or the look of the smoke? Do we stop lighting then? Do we say the light is only for those who remember the first spark?"

  Silas tightened his scarf. He looked at the telegraph pole, then at the pyre on his ridge. "We light," he said. "And we hope the others see."

  "We light," Elara agreed. "But we don't know why anymore."

  They stood in the cold, looking up at the ridges. The sun was setting. The first star appeared, cold and distant. On the western spur, a flame flickered to life. On the eastern, another followed. They were not perfectly synchronized. One lagged behind the other by a heartbeat, a hesitation born of the week before.

  Elara watched the gap between the lights. It was small, but it was there. She did not know if it would close in the winter to come, or if it would widen until the fires were just separate bonfires burning for no one. She walked toward her own farm to gather wood, leaving the question hanging in the thin air, unresolved as the twilight.
