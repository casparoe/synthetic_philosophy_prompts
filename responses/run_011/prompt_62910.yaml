      *   **Constraint 2 (Arbitrariness):** Show the old code is arbitrary. The new one works equally well. No punishment for wrong fires, yet the old code holds due to precedent/expectations.
      *   **Constraint 3 (Persistence & Shift):** The code persists even after a telegraph line makes it obsolete (final third). Two characters must disagree on whether it's still useful or now a test of belonging.
      *   **Constraint 4 (The Failure):** One night the fires fail due to a specific epistemic failure (mistake about expectations), not a change of heart. Someone didn't light because they thought others thought *they* wouldn't light (higher-order belief failure).
      *   **Ending:** Do not settle the disagreement between the two characters.

  2.  **Deconstruct Lewis's Theory (for internal guidance):**
      *   Convention is a regularity in behavior.
      *   It solves a coordination problem (everyone prefers to do the same as others).
      *   It is arbitrary (another regularity could have solved it).
      *   It is sustained by mutual expectations (I do it because I expect you to do it, and you expect me to).
      *   *Key constraint for the story:* I need to show the *mechanism* of expectation without naming it. The "Failure" constraint specifically targets higher-order beliefs (I think that you think that I think...).

  3.  **Character Development:**
      *   **Protagonist:** Elara, a younger farmer, perhaps skeptical but respectful.
