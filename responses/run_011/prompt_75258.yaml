  # LOTH Triage Protocol (v1.0)
  **For:** Graduate Student Readers, Methods-Review Panel
  **Time Limit:** 45–60 Minutes per Manuscript
  **Goal:** Determine if behavioral or neural data *licenses* a claim of Constituent Structure (Language of Thought).

  ## Part I: The Procedure

  Ask the following questions in order. If the answer is **NO**, stop and issue the corresponding verdict. If **YES**, proceed. If **UNCLEAR**, mark as **Judgment Call** and refer to faculty.

  ### Step 1: The Task-Environment Filter (Structure in World vs. Mind)
  **Question:** Does the structure required to solve the task exist *independently* of the subject's mind (e.g., physical slots, explicit instructions to combine parts), or must the subject *impose* the structure to succeed?
  *   **Distinction:** *Structured Task Environment* vs. *Structured Representational Format*.
  *   **Sufficient Answer:** The subject succeeds on trials where the external cues do not dictate the specific constituent grouping (e.g., no physical blocks forcing order, no explicit instruction on *how* to combine).
  *   **Verdict if NO:** **FLAT STOP.** "This datum does not license the claim." The structure is in the task, not necessarily the cognition.
  *   **Judgment Call:** Determining if a cue is "directive" or "suggestive" is interpretive. If ambiguous, refer up.

  ### Step 2: The Generalization Filter (Memory vs. Rule)
  **Question:** Does the subject succeed on stimuli that differ *both* in surface features (items) and structural configuration from training, controlling for statistical regularities (e.g., bigram frequency, item familiarity)?
  *   **Distinction:** *Productivity/Systematicity* vs. *Associative Generalization*.
  *   **Sufficient Answer:** Performance remains above chance on novel combinations of novel items, and the authors have explicitly ruled out simple statistical matching (e.g., n-gram models) as an alternative explanation.
  *   **Verdict if NO:** **FLAT STOP.** "This datum does not license the claim." The effect may be memorization or similarity-based generalization.
  *   **Judgment Call:** Assessing whether controls for statistical regularities are "sufficient" is a methodological judgment. If the control model is weak, refer up.

  ### Step 3: The Vehicle Filter (Content vs. Format)
  **Question:** Does the evidence address the *format* of the representation (the vehicle), or only the *content* of the thought (the function/behavior)?
  *   **Distinction:** *Vehicle of Representation* vs. *Content of Representation*.
  *   **Sufficient Answer:** The manuscript provides evidence of internal processing states that mirror syntactic combination (e.g., neural probing of constituent units, reaction time costs for structural edits) *OR* explicitly argues why behavioral systematicity necessitates a classical architecture over connectionist alternatives.
  *   **Verdict if NO:** **REFER UP.** "Evidence supports Systematicity, but LOTH claim requires architectural interpretation."
      *   *Note:* Purely behavioral data cannot distinguish a Classical (LOTH) architecture from a Connectionist one that mimics systematicity. A claim of "Constituent Structure" is an architectural claim.
  *   **Judgment Call:** **HIGH.** Determining whether a neural probe indicates *syntax* or merely *correlated encoding* is a philosophical/technical interpretation. **All manuscripts passing Step 2 but lacking direct causal evidence of syntactic manipulation must be referred.**

  ### Step 4: The Competence Filter (Noise vs. Limit)
  **Question:** If the subject fails some structured trials, does the manuscript distinguish between *performance errors* (noise, attention) and *competence limits* (inability to represent the structure)?
  *   **Distinction:** *Competence* vs. *Performance*.
  *   **Sufficient Answer:** Failures are accounted for by non-structural factors (e.g., memory load, motor error) without undermining the structural generalization.
  *   **Verdict if NO:** **REFER UP.** "Performance data confounds structural capacity."

  ---

  ## Part II: Protocol Limitations & Judgment Calls

  **Explicit Judgment Calls:**
  1.  **Step 1 (Task Structure):** Distinguishing whether a cue forces structure or merely affords it is not algorithmic. Students must flag this if the manuscript is vague.
  2.  **Step 3 (Vehicle Interpretation):** This is the critical bottleneck. The procedure *cannot* settle whether a system that passes every behavioral test while lacking syntax-like vehicles counts as confirming the hypothesis. This is the **Functionalism vs. Classicism** debate. The procedure treats LOTH as a claim about *vehicles* (Classicism). If the authors mean LOTH functionally, the procedure will flag a mismatch.

  **What the Procedure Cannot Settle:**
  *   **Implementation Independence:** Whether a connectionist system exhibiting systematicity *is* a Language of Thought system in disguise.
  *   **Semantic Atomism:** Whether the primitives are innate or learned.
  *   **Conscious Access:** Whether the representations are accessible to the subject.

  ---

  ## Part III: Application to Submissions

  ### Submission (a): Corvid Relational Reasoning
  *   **Step 1 (Task):** Pass. The birds must judge relations (above/left) between icons. The spatial arrangement is the stimulus, but the *relation* is abstract.
  *   **Step 2 (Generalization):** Pass. Tested on untrained pairings and *novel icons*. Controls for item-specific memory.
  *   **Step 3 (Vehicle):** **Fail/Refer.** Evidence is purely behavioral. No neural or process data indicates *how* the relation is bound to the arguments (e.g., $Above(x,y)$ vs. holistic pattern match).
  *   **Verdict:** **REFER UP.**
  *   **Rationale:** While the behavior is impressive, the claim "birds compose relations" implies a specific vehicle structure. A connectionist vision system could potentially solve this without compositional syntax. The procedure cannot license the *LOTH* claim specifically, only the *Relational Capacity* claim.

  ### Submission (b): Adult Artificial Grammar (Reduplication)
  *   **Step 1 (Task):** Pass. Structure is in the grammar, not forced by physical slots.
  *   **Step 2 (Generalization):** Pass. Novel strings, matched for length and bigram frequency. Rules out simple statistical learning.
  *   **Step 3 (Vehicle):** **Fail/Refer.** Evidence is purely behavioral (accept/reject judgments).
  *   **Verdict:** **REFER UP.** (Contrary to natural reading).
  *   **Rationale:** This is the standard "Gold Standard" for rule learning. Authors and Panelists naturally read this as evidence for "rules quantifying over variables" (LOTH). However, the Procedure flags that behavioral systematicity is *compatible* with trained neural networks that lack explicit variables. To claim LOTH (constituent structure), one needs evidence of the *vehicle*, not just the *content*. The procedure forces a referral because the architectural claim outstrips the behavioral evidence.

  ### Submission (c): Transformer Systematicity & Probing
  *   **Step 1 (Task):** Pass.
  *   **Step 2 (Generalization):** Pass. Novel operands and digit ranges.
  *   **Step 3 (Vehicle):** **Pass/Refer.** Probing study finds units tracking place value. This addresses the *vehicle*.
  *   **Step 4 (Competence):** Pass.
  *   **Verdict:** **REFER UP.** (Unstable).
  *   **Rationale:** While probing provides vehicle data, the step from "units track place value" to "structured, compositional internal representations" is a **Judgment Call**. Does the unit activation *cause* the output via syntactic rules, or does it merely correlate with the input structure? The procedure cannot settle if this counts as "syntax" in the LOTH sense.

  ---

  ## Part IV: Panelist Notes & Contradictions

  ### The Contrary Verdict: Submission (b)
  **Verdict:** **REFER UP** (Claim not licensed by data provided).
  **Natural Reading:** Both the authors and I (candidly) find it natural to conclude that adults learning a reduplication rule with controlled statistics are employing a rule quantifying over variables. This is the canonical evidence for LOTH in human cognition.
  **Why the Procedure is Unmoved:** The Procedure enforces the **Vehicle vs. Content** distinction strictly. LOTH is a hypothesis about the *format* of cognition (classical architecture), not just its *function* (systematicity). Since Submission (b) offers only behavioral data, it licenses a claim of *Systematicity*, but not a claim of *Constituent Structure*. A connectionist model could, in principle, replicate this data. To claim LOTH, the authors must either provide neural/process evidence of symbolic vehicles or argue philosophically why connectionism is impossible here. The triage treats this as an interpretive leap requiring faculty review.

  ### Unstable Verdict: Submission (c)
  **Flag:** **High Instability.**
  **Reason:** The move from "interpretable units" to "compositional syntax" is the current frontier of AI interpretation. Whether a transformer's attention heads constitute "constituents" in the LOTH sense is a live philosophical debate, not a methodological checklist item. My signature on a recommendation here would be vulnerable to shifting consensus in the field. I recommend this be discussed by the full committee, not triaged.

  ### Stable Verdict: Submission (a)
  **Flag:** **Stable Referral.**
  **Reason:** While the behavior is robust, the leap from "relational behavior" to "compositional representation" in non-linguistic animals is historically contentious. The Procedure correctly identifies the lack of vehicle evidence. This referral is defensible because it demands a higher standard of evidence for architectural claims than behavior alone can provide.

  ---

  **Recommendation to Committee:**
  Adopt the Protocol. It prevents the conflation of *functional systematicity* with *architectural classicism*. Be prepared to defend the referral of Submission (b); it will be the most contentious, as it challenges the standard operationalization of LOTH in behavioral cognitive science.
