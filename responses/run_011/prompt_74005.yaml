answer: |-
  The kettle clicked off, but the steam kept rising, a thin white wire between them. Nadia held the chipped mug with both hands. The chip was on the rim, left side, sharp enough to catch a lip.

  "You're treating them like a voting bloc," Elias said. He was leaning against the counter, arms crossed. He hadn't moved since she came in. "You think if you raise your hand, they raise theirs. That's not physics, Nadia. That's magic thinking with extra steps."

  "It's not coordination. Nothing travels." She took a sip. The tea was already lukewarm. "It's evidence. When I lift the drive, I'm not pulling a lever out there. I'm finding out which thing I am. And since I'm evidence for them, I'm... tuning the signal."

  "A thermostat doesn't cooperate with other thermostats," Elias said. "It just reacts. If you're identical, you do the same thing automatically. There's no gap for you to close. No credit to earn. The 'we' in your sentence is decorative."

  "It's not decorative. It's structural."

  "Is it midnight?" he asked.

  "Ten."

  "Feels like midnight." He pushed off the counter and walked to the table, sat down opposite her. "Okay. Let's play your game. Infinite space. Infinite Nadias. Half mail the drive, half bury it. Both sets are infinite. You cannot add to infinity by behaving well. You think you're changing a sum, but the total size of the 'good' set doesn't grow because you clicked 'send'. It's already full. It's already done."

  Nadia looked at the mug. The chip caught the light. "They aren't exact."

  Elias blinked. "What?"

  "The exact ones. The ones with this chip, this tea, this headache. Maybe they are locked. Maybe you're right, maybe they're just thermostats." She set the mug down. The clink was too loud. "But most of them aren't exact. There's infinitely many where the chip is on the right. Where I'm five minutes more tired. Where you're asleep upstairs instead of here."

  "Did you feed the cat?"

  "Yes. Elias, listen. The exact copies are... negligible. It's the near-copies that matter. They're running something close to my algorithm, not the same code. When I make this choice, I'm not voting for the locked ones. I'm sending evidence to the fuzzy ones. The ones where the decision is still soft."

  "So you're betting on strangers," Elias said. "You're saying your action here is evidence for a woman in a kitchen in Ohio who doesn't exist yet, who has a different husband and a heavier mug."

  "I'm saying I'm placing a bet on the character of people I can never check on." Her voice tightened. "If I bury the drive, I'm telling the fuzzy Nadias that this is how we handle it. We look away. If I mail it, I'm telling them we don't."

  "You're answerable for what they do," Elias said. "If a man in the next valley poisons a reservoir, is that on you because you were the sort of person who'd have done it? That's the exact structure you'd call corrupt in any other context. Guilt by association with a ghost."

  "It's not guilt. It's... alignment."

  "Why?" Elias leaned forward. The light caught the grey in his beard. "Even granting all of it. The fuzzy copies, the evidence, the betting. Why is *how situations like this go* the thing to care about, rather than what you cause? You can't cause anything out there. You can only cause things here. So why care about the pattern?"

  Nadia opened her mouth. She looked at the thumb drive sitting on the table between them, black and dull against the wood. It looked smaller than it felt in her pocket.

  "Because," she said. "Because if I don't care about the pattern, then I'm just... noise."

  "That's not an answer."

  "It's the only one I have."

  Elias sat back. He looked tired, suddenly. Not the tired of the argument, but the tired of the universe. "Noise is fine, Nadia. Noise is honest."

  He reached out and touched the chipped mug. He ran his thumb over the sharp edge, testing it. "You're bleeding on the principle," he said softly. "But you're asking me to drink from it."

  He left his hand there. Nadia didn't move. The kettle began to hum again, a low, rising heat, though neither of them reached to turn it off.

