  2.  **Deconstruct the Philosophy (FEP/PEM):**
      *   *Core Claim:* Organisms minimize variational free energy (surprise/prediction error).
      *   *The "Dark Room" Objection:* If I just want to minimize surprise, I should find a dark, quiet room and stay there forever (minimize sensory input variance). Why don't we?
      *   *The FEP Response:* We have *priors* about being alive/active. We minimize *expected* free energy. We need to sample the world to resolve uncertainty (epistemic value) to fulfill long-term priors (pragmatic value). Precision weighting determines how much we trust sensory data vs. priors.
