          *   Phase 1: Accuracy rewarded, abstention permitted $\rightarrow$ Rational strategy is to abstain (Dark Room analogue).
          *   Phase 2: Abstention costs, Sampling/Looking costs $\rightarrow$ Trade-off (Active Inference analogue).
          *   Phase 3: Strong Prior $\rightarrow$ Bias/Hallucination analogue.
