          *   "Sample" (Peek at card) = -0.5 cost, then Guess +1/-2.
          *   If I peek, I know the answer. Payoff = $1 - 0.5 = 0.5$.
          *   If I guess blind, EV = -0.5.
          *   If I abstain, Payoff = -1.
