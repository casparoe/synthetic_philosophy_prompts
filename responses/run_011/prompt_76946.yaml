      *   16 students? Yes (split into groups or play collectively). *Decision:* Play collectively to save time, or 4 groups of 4. Groups allow discussion. Let's do 4 groups of 4. They agree on a group strategy.
      *   Props: Cards, paper, pencils.
      *   No real money.
      *   Mark settled vs. contested.

  10. **Final Polish:** Ensure tone is pedagogical but philosophically rigorous. Avoid selling FEP as truth, present it as a framework being tested. (Self-Correction: Make sure the scoring in Phase 1 clearly incentivizes abstention. If EV is equal, students might guess. Make Abstain strictly better.)

