      *(Refining the "Domestic Case")*: If the domestic case fails (we *do* have determinate reference), then the behaviorist premise is false. If the behaviorist premise is false, the Gavagai argument fails. So Seth gains ground if the domestic extension fails.

      *(Refining the "Relative Determinacy")*: It's the "Ontological Relativity" doctrine. It is coherent. It is substantive (rejects metaphysical realism about reference). It dissolves the disagreement by changing the question from "What is the reference?" to "What is the reference relative to manual M?"

      *(What's missing)*: The normative constraint on interpretation (Charity). Also, the causal theory of reference (which Seth gestures at but doesn't use to block the behaviorist premise effectively).

