answer: |-
  You promised your brother you would witness his property deed signing at 2 PM; without a second witness, his home purchase collapses. Weeks ago, you promised your best friend you would witness her wedding ceremony at 2 PM; without a second witness, the marriage is legally void. Both promises were reasonable when made. At 1 PM, a sudden bridge collapse isolates your neighborhood. You can drive to the lawyer's office or the chapel, but travel time now excludes both. You cannot contact either party; both rely on you exclusively and are unaware of the collapse until you fail to appear. There is no substitute witness available on short notice. You must choose one. Whichever you abandon suffers a significant, irreversible loss due to your absence. You know you cannot fulfill both promises, yet both friends have entrusted you with this specific duty.

  ***

  1.  **Constraint Check:**
      *   **Realistic/Small-scale:** Met (family/friend, local travel, legal/ceremonial stakes).
      *   **No Villain/Self-Inflicted:** Met (bridge collapse is external; promises were reasonable when made, avoiding recklessness).
      *   **Two Options/No Compromise:** Met (physical travel time excludes both; no substitutes available).
      *   **Specific Persons:** Met (brother and friend have legitimate complaints).
      *   **No Professional Code:** Met (personal promises, not job duties).
      *   **Honesty:** The "no substitute" clause is stipulated but plausible for specific legal/wedding witnesses requiring identity verification.

  2.  **Requirements & Sources:**
      *   **Requirement A:** Witness the deed signing. **Source:** The specific promise to the brother + his reliance on it for housing security.
      *   **Requirement B:** Witness the wedding. **Source:** The specific promise to the friend + her reliance on it for marital validity.
      *   Both are *all-things-considered* because the promises are binding, the stakes are symmetric and high, and no overriding duty (like saving a life) trumps either.

  3.  **Blocking Escapes:**
      *   **Not Pro Tanto:** These aren't weak reasons outvoted by a stronger one; they are binding obligations with serious consequences for failure.
      *   **Not Permissible Symmetry:** If it were merely permissible to choose either, the abandoned party would have no legitimate complaint. Here, the abandoned party is *wronged*, not just unlucky.
      *   **No Third Option:** Stipulated physical impossibility (travel time) and communication blackout prevent contacting them to release the promise or finding a substitute.

  4.  **Sacrificed Premise:**
      *   **Agglomeration.** The case forces us to deny that if I ought to do A and ought to do B, I ought to do (A and B). I maintain both individual obligations hold ATC, but the conjunctive obligation does not, because it violates *Ought Implies Can*. Sacrificing agglomeration is cheaper than denying *Ought Implies Can* (which is foundational to rational action) or Consistency (which defines the logic of requirements).

  5.  **Key Feature:**
      *   **Exclusive Reliance + Unexpected Impossibility.** The parties rely *only* on her, and the impossibility arises *after* the obligations are fixed.
      *   **Collapse:** If you delete this (e.g., she can call them), she can release herself from one promise, dissolving the conflict into a single obligation.

  6.  **Best Attack:**
      *   **The "Obligation Dissolution" Move:** A dilemma-denier will argue that at 1 PM (when the bridge collapses), *Ought Implies Can* instantly dissolves the obligation to the impossible option. You only ought to do the one you *can* reach. The guilt felt for the other is merely "agent-regret" for a bad outcome, not moral wrongdoing. They will insist that if you truly cannot do it, you literally do not owe it.
