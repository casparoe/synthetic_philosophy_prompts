      *   Premise 3: Consistency. There are no contradictory all-things-considered (ATC) obligations.
      *   Conclusion: Genuine dilemmas (where I ought to do A, ought to do B, but cannot do both) are impossible.
      *   To make a dilemma plausible, I need a case where intuitively, the agent *must* do A (ATC) and *must* do B (ATC), but physically/circumstantially cannot do both, and doing either leaves a moral residue (wronging someone).

