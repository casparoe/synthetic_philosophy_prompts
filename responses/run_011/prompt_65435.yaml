answer: |-
  This is a heavy situation, and it is understandable that you want to meet your brother on intellectual ground rather than just emotional ground. You are right to be suspicious of the summary he sent you. It has the veneer of scholarship but contains a critical error and several oversimplifications that change the practical outcome.

  Here is an audit of the summary based on standard scholarly consensus regarding Augustine's ethics, followed by what that means for your mother.

  ### 1. Audit of the Brother's Summary

  **What is Accurate:**
  *   **The Teleology of Speech:** The summary is correct that Augustine grounds his argument in the purpose of language. He argues in *On Lying* (*De Mendacio*) and *Against Lying* (*Contra Mendacium*) that words are signs meant to convey the speaker's mind. To use them to convey something else is a perversion of their nature.
  *   **Silence is Permitted:** The summary is correct that Augustine allows for silence. He explicitly states that withholding the truth is not the same as asserting a falsehood. You are not obligated to speak every truth you know.
  *   **The Core Prohibition:** It is true that Augustine is the primary architect of the Christian absolutist position that lying is intrinsically wrong, regardless of consequences.

  **What is a Acceptable Simplification:**
  *   **"Where the West's line comes from":** A historian might quibble that he inherited this from earlier traditions (Stoics, earlier Church Fathers), but Augustine is undoubtedly the systematizer who cemented this view for Western Christianity and, later, secular philosophy (via Kant). For a lay summary, this is passable.
  *   **"Wrong is in the act not the outcome":** This is a fair shorthand for his deontological stance. He believes the moral quality resides in the will to deceive, not the result of the deception.

  **What is Genuinely Wrong:**
  *   **The Priscillianist Claim:** This is the most significant error in the text your brother sent. It is backwards. The controversy was that some Catholics wanted to infiltrate the Priscillianist heretics by pretending to be one of them. Augustine wrote *Against Lying* specifically to argue **against** this. He did *not* concede that a lie for the sake of the faith is permitted; he argued that lying to catch heretics was a double sin (lying plus sacrilege). Your brother's source has flipped the historical record to make Augustine look slightly more flexible than he was, or simply misread the conclusion.
  *   **The "No Degrees" Claim:** This is the error that matters most to you. Augustine **does** distinguish degrees of sinfulness in lying. In *On Lying*, he outlines eight types of lies, ranging from lies in religious doctrine (the worst) to lies told to save someone from bodily defilement (the least worst). He categorizes lies told to be helpful or spare pain (officious lies) as less grievous than lies told to harm. He maintains they are all *sins*, but he explicitly rejects the idea that they are "exactly as bad." A lie to spare grief is not morally equivalent to a lie that ruins a reputation.

  ### 2. Does the Conclusion Still Hold?

  The brother's conclusion is: *"There is no situation in which you may assert what you believe to be false, and the comforting fib told to a person with dementia is a sin like any other."*

  If we correct the errors:
  1.  **"No situation... to assert what is false":** This largely holds for Augustine. He is very strict on the *assertion* of falsehood.
  2.  **"A sin like any other":** This **does not hold**. Augustine's own distinctions mean a comforting fib is a *lesser* sin than a malicious lie.

  However, there is a deeper Augustinian principle your brother is missing: **Charity (*Caritas*).** For Augustine, all ethics are subordinate to the command to love God and love your neighbor. If telling the "truth" causes gratuitous suffering to a neighbor who cannot process that truth, you risk violating Charity. Augustine would argue that causing repeated, fresh grief to a confused mind is not an act of love.

  So, while the technical prohibition on lying remains in his theory, the *pastoral* application is not as robotic as your brother suggests. The "sin" of the fib is weighed against the "sin" of cruelty.

  ### 3. What This Leaves You With at 2pm on a Tuesday

  If you want to operate within an Augustinian framework (to satisfy your brother or your own conscience) without traumatizing your mother, Augustine actually gives you tools other than "brutal truth."

  **Option A: The Loophole of Silence (Augustine's Preference)**
  Augustine explicitly permits declining to answer. You are not obligated to validate her premise.
  *   *Her:* "Where is your father?"
  *   *You:* "He's not here right now." (Technically true, he is not here.)
  *   *Or:* "Let's look at this photo album." (Deflection/Silence on the specific question.)
  *   *Or:* "I know you miss him." (Addressing the emotion, not the fact.)
  Augustine would prefer this. It avoids the assertion of falsehood while avoiding the cruelty of re-breaking the news.

  **Option B: The "Obediential" or "Officious" Lie**
  If she presses and becomes agitated, and you feel you must speak to calm her:
  Augustine classifies lies told to help someone (officious) as low on the hierarchy of sin. If you tell her, "He's at the store," you are technically committing a fault in his system, but it is a venial one, weighed against the charity of sparing her pain.
  *   *Correction to Brother:* If you must argue with him, point out that even Augustine admitted some lies are less sinful than others. Causing repeated trauma violates the higher law of Charity.

  **Option C: The Reality of Memory**
  There is one more thing to consider that Augustine didn't have neuroscience for: In mid-stage Alzheimer's, short-term memory is gone. When you tell her he died, she processes the grief, but within minutes (or the next time she asks), the memory of the death is gone, while the feeling of loss remains. Telling her the truth does not "let her grieve and move on"; it forces her to grieve the same death dozens of times a week without ever reaching acceptance.
  Even a strict Augustinian would likely argue that "truth" requires the capacity to understand it. If she cannot retain the truth, asserting it is not truly communicating; it is merely making noise that causes pain.

  ### 4. A Note on My Limitations
  I need to be honest with you: I am synthesizing this from general scholarly consensus on Augustine's ethics (*De Mendacio*, *Contra Mendacium*, and his letters). I am not pulling a specific book off a shelf right now. However, the error regarding the Priscillianists is a well-known historical fact in patristic studies, and the hierarchy of lies is the central feature of his treatise *On Lying*.

  ### Summary for Your Brother
  You can tell him this:
  1.  **He has the Priscillianist story backwards.** Augustine argued *against* lying to heretics, not for it.
  2.  **Augustine admits degrees of sin.** A lie to spare grief is not "exactly as bad" as a lie to harm.
  3.  **Augustine permits silence.** You do not have to answer the question directly.
  4.  **Charity trumps technicality.** Inflicting repeated trauma violates the command to love thy neighbor, which is the foundation of Augustine's entire ethics.

  **Recommendation:** Do not tell her he died again. Use deflection or silence. It is more consistent with Augustine's allowance for withholding truth than your brother's strategy is with Augustine's command for Charity.
