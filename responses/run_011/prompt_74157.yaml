answer: |-
  The smoke in Bay 12 smelled of ozone and melted polymer, a sharp chemical tang that stuck to the back of the throat. I clipped my flashlight to the collar of my high-vis vest and stepped over the wet line where the sprinklers had done their work. The water pooled around the base of the racking, reflecting the emergency lights in oily sheens. My clipboard felt heavy. Box 14 on the Loss Adjustment Form required a single integer: *Quantity of Units Affected*.

  Behind me, Mark kicked a piece of charred cardboard. He wasn't supposed to be on the floor—insurance adjusters usually wait in the conference room—but he'd flashed a consultant badge that looked just real enough to slip past security. He was my brother-in-law, the one with the philosophy doctorate who now wrote code for a living. He looked at the wreckage not with concern for the value, but with the detached curiosity of a man watching an ant farm burn.

  "The manifest says three thousand items," Mark said. He picked up a twisted bracket, turned it over, and dropped it. "But the fire fused that stack of shelving into a single lattice. If cohesion defines objecthood, you've lost one big thing, not three thousand small ones."

  I didn't answer him. I walked to the center of the bay. This was the crux consignment: the Helios Turbine Assembly. It was the reason the warehouse existed, a high-value unit held under bond pending export. The policy had a per-item cap of fifty thousand dollars. If the turbine counted as one unit, the payout covered the loss. If it counted as three thousand individual components, the cap applied to each, but the deductible per claim would swallow the total. Conversely, if it was nothing but scrap metal, the value was negligible. The count was the claim.

  The turbine core sat on its transport skid, blackened but intact. Around it lay the chaos of the assembly process. Twenty-four blade cartridges were bolted to the core hub. They had been tightened to torque specifications yesterday. Another forty cartridges sat in their original wooden crates, unopened, stacked against the rear wall. The crates had caught fire; the wood was gone, leaving the crates' contents exposed to heat and water. A third group, twelve blades, was missing entirely. They had been pilfered from an open crate three weeks prior, a discrepancy I had flagged but not resolved before the fire.

  I uncapped my pen. I needed to decide if the Helios was one object, twenty-four objects, or three thousand.

  I moved to the left rack. Here, the fire had been hottest. Steel brackets, originally separate, had melted together into a single jagged mass. This tested cohesion. The metal had lost its individual boundaries, flowing into a new shape. If I counted this as one object, I reduced the item count, lowering the administrative burden but potentially undervaluing the loss if the brackets were high-value individually. I tapped the mass with my boot. It rang solid. It was one thing now, physically. But legally, it was inventory lot B-404, which contained five hundred distinct brackets. I wrote *500* on my scratch pad, ignoring the fusion. The fire's accident shouldn't rewrite the inventory history.

  Next, the fastening. I climbed the ladder to the turbine hub. The bolted blades were secure. They hadn't moved during the collapse. They were distinct pieces of metal held by distinct bolts. Yet, without the core, they were useless weights. Without them, the core was a paperweight. I ran a gloved hand over a blade root. It was cold. I moved to the crates. The heat had warped the metal inside, but they were still separate entities, wrapped in grease paper.

  Mark leaned against a upright beam. "You're drawing lines where there aren't any," he said. "Those bolts are just contact points. The grease paper is just a barrier. You're pretending the boundary of the crate is the boundary of the object."

  He looked at the turbine, then at the melted rack. "Any plurality of things whatsoever composes a further object; the manifest is just one convenient carving among infinitely many equally real fusions."

  That was his one thesis statement. He'd said it before, over beer, but here it hung in the smoky air. If he was right, the bay contained not three thousand items, but billions. Every combination of bolt and blade and melted bracket was an object. The claim would be infinite, or zero.

  I ignored him and moved to the corner where the live consignment was stored. This was the only item nobody disputed. A glass tank, cracked but holding water, contained a colony of *Nanomia bijuga*. Siphonophores. They looked like strings of translucent beads drifting in the current. Biologically, each bead was a zooid, an individual animal incapable of survival on its own. Together, they formed a single functioning organism. The heat had killed them; they hung limp in the water.

  I checked the tank tag. *Quantity: 1*.
  If I applied Mark's logic, the tank contained hundreds of objects. If I applied the nihilist view, it contained only cells. But the insurance schedule listed it as *One Live Specimen*. The premium was calculated on that unity. If I counted them as zooids, the value plummeted. If I counted them as one, the payout was significant. The biology enforced the metaphysics. The thing swam as one, ate as one, died as one. I wrote *1* on the pad. The unity wasn't in the glass; it was in the life process.

  I walked back to the turbine. There were two more complications. The control module for the turbine was not in the bay. It was still on a vessel in the North Sea, scheduled to arrive next week. It was shipped under the same contract number, same serial identity. Was the turbine here one object without its brain? This was the scattered object problem. The contract treated it as one unit. The physics treated it as two separated masses.

  Then there was the coolant pump sitting on the adjacent skid. It was a cannibalised object. I knew the history because I'd signed the intake form. It was built from scrap parts stripped from three different decommissioned units to keep the facility running during the turbine installation. One of the donor units still existed in a warehouse in Hamburg. Did the pump exist? Or was it just a ghost of the Hamburg machine?

  I returned to the desk in the site office. The form lay open. Box 14 waited.
  Mark stood by the window, watching the rain mix with the runoff outside. "If you count the turbine as one," he said, "you're saying the missing blades don't matter. If you count it as parts, you're saying the assembly never happened."

  He was right about the missing blades. If I claimed it as one assembled machine, I was lying about the pilfered parts. If I claimed it as parts, I was denying the functional reality of the bolted assembly.

  I looked at the scratch pad.
  Melted brackets: 500 (Contact ignored, history preserved).
  Siphonophores: 1 (Functional unity respected).
  Control Module: 0 (Not on site, not part of the loss event).
  Coolant Pump: 1 (Functional unity created by assembly, regardless of donor history).
  Helios Turbine: ?

  The bolted blades worked with the core. We had run them on a test stand for four minutes before the fire. They vibrated together. They shared a load. The crated blades did not. They were potential, not actual. The missing blades were gone.

  If I counted the turbine as one unit, I claimed the functional whole was destroyed. But the whole wasn't complete. If I counted it as parts, I claimed the function never existed. But it had run.

  I thought about the siphonophores. They were one because their functions were integrated to sustain a single life. The turbine was one because its functions were integrated to generate power. The missing blades were like lost cells; an organism can survive damage and remain an organism. The crated blades were spare cells in storage, not part of the body. The control module was a distant nerve, not yet connected.

  The insurance policy covered "Finished Articles." It excluded "Loose Components."
  If I wrote *3,000*, the adjusters would classify it as loose components. The claim would be denied as misdeclared cargo.
  If I wrote *1*, I asserted it was a finished article. The auditors would check the test stand logs. They would see the four-minute run. They would see the bolted blades. They might overlook the missing twelve if the unit was deemed "operable."

  But there was a cost. If I claimed it as one unit, and the auditors found the missing blades, I would be flagged for fraud. If I claimed it as parts, the client would sue for undervaluation.

  I picked up the pen. The ink flowed black onto the white paper.
  I wrote *1*.
  But in the remarks section, I added: *Assembly incomplete. 12 components missing per prior discrepancy report #409. 40 components uninstalled.*

  I handed the form to the senior adjuster waiting in the hall. He looked at the number, then at the remarks. He frowned. "This makes it a machine loss. High deductible."

  "It's a machine," I said. "It ran."

  "It's missing parts."

  "It's a wounded machine, not a pile of parts."

  He took the form. "We'll audit the test logs."

  Three months later, the settlement letter arrived. The insurance company had accepted the claim as one unit, citing the test stand certification as proof of functional integration. They deducted the value of the missing twelve blades based on my remark, but paid the full value of the assembled core and bolted blades. The client was satisfied. The audit passed.

  Mark came over for dinner that night. I put the settlement letter on the table.
  "You counted it as one," he said, reading the summary.
  "It was one."
  "It was missing pieces. It was scattered. It was next to a pump made of ghosts."
  "The pump worked," I said. "The turbine spun. The siphonophores swam. The melted brackets didn't do anything but sit there."

  Mark traced the edge of the paper. "You got lucky. The auditor liked the test logs."
  "No," I said. "The auditor liked that the thing did what it was supposed to do before it broke. The bolts didn't make it one. The running did."

  Mark looked at me, then at the letter. He didn't argue. He just nodded, folded the paper, and put it in his pocket. He knew that for all his talk of infinite fusions, when the money changed hands, the world demanded a single number. And the world had agreed with me.

  The cost was the sleep I lost waiting for the audit. The gain was the knowledge that the boundary wasn't in my head. It was in the spin of the shaft. When the turbine ran, it was one thing. When it stopped, it was just metal. I had counted the moment it was alive.

  ***

  **Author's Note**

  This story endorses a moderate restrictivist view of composition, specifically grounded in *functional integration*. The narrative argues that objects compose a further thing when their parts engage in a unified causal process (the turbine running, the siphonophore swimming), rather than through mere contact, fastening, or arbitrary classification. This is presented as true, not merely useful, because the insurance payout validates the reality of the functional unit over the physical disjointedness (missing parts) or the physical fusion (melted brackets).

  To make this work as fiction, I had to distort the insurance process. In reality, policies are rarely so metaphysically sensitive; adjusters usually follow strict contractual definitions rather than ontological reasoning. I simplified this to force the metaphysical choice into the financial outcome. I also compressed the timeline; audits of this magnitude take longer than three months.

  By the story's lights, the protagonist's ruling was right. The settlement confirms that the functional unity held legal and financial weight, validating the claim that the turbine was "one thing" despite the missing components.

  The story leans on a contested reading of functional integration: that function is objective rather than observer-relative. A nihilist would argue the "function" is imposed by humans. I commit to the view that the causal power (the spin, the swim) is mind-independent, making the composition real. I wrote it this way to show that metaphysics has teeth in the material world, contrary to the rival's view that it is merely linguistic.
