answer: |-
  **Bottom line**

  The impossibility results settle the logical consistency of the COMPAS dispute but resolve none of its ethical substance. They demonstrate that ProPublica and Northpointe were not contradicting each other empirically; they were optimising for mutually exclusive mathematical definitions of fairness. The theorem proves that given the observed disparity in base rates (re-arrest frequencies), satisfying both calibration and error-rate balance is structurally impossible. However, the theorem is silent on which metric ought to be prioritised. It transforms the dispute from a question of computational accuracy into a question of distributive justice. Consequently, the mathematics validates the existence of the trade-off but offers no algorithm for choosing sides. It tells us we cannot have our cake and eat it, but it does not tell us which slice of cake to discard.

  **The dispute in outline**

  The conflict emerged when ProPublica analysed COMPAS scores in Broward County. They argued the algorithm was racially biased because it failed the test of *error rate balance*. Specifically, Black defendants who did not re-offend were far more likely to be falsely flagged as high risk (45%) compared to White defendants (23%). Conversely, White defendants who did re-offend were more likely to be falsely flagged as low risk. ProPublica took this disparate impact as evidence of systemic bias.

  Northpointe (the vendor) countered that the score was *calibrated*. They argued that for any given risk score, the probability of re-offending was roughly the same regardless of race. A Black defendant scored '7' and a White defendant scored '7' re-offended at similar rates. They claimed ProPublica used the wrong metric, arguing that calibration is the necessary condition for individual fairness.

  Both sides relied on the same dataset: the 2013–2014 arrests and subsequent two-year follow-up. The divergence was not in the data, but in the normative weight assigned to different statistical properties. ProPublica prioritised equalising the burden of errors across groups; Northpointe prioritised the reliability of the risk estimate itself. The impossibility theorems later provided the mathematical vocabulary for this stalemate.

  **The mapping**

  To test the theorem, we must map the legal reality onto the statistical formalism. The table below outlines the correspondence between the COMPAS case and the variables required for the impossibility proof.

  | Component | Formal Definition | COMPAS Equivalent | Invoked By | Satisfied on Data? | Mathematically Possible? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Score ($S$)** | Continuous risk probability | COMPAS Decile (1–10) | Both | N/A | Yes |
  | **Decision ($D$)** | Binary classification | High Risk (4+) vs Low | ProPublica | N/A | Yes |
  | **Attribute ($A$)** | Protected group | Race (Black/White) | Both | N/A | Yes |
  | **Target ($Y$)** | Ground truth outcome | Re-arrest within 2 years | Both | N/A | Yes |
  | **Calibration** | $P(Y=1|S=s, A=a)$ constant | Risk meaning consistent | Northpointe | Yes | Yes |
  | **Error Balance** | Equal FPR/FNR across $A$ | Equal false flags | ProPublica | No | **No** (given base rates) |

  There are significant points of looseness in this mapping. First, the **Target Variable ($Y$)** is treated as ground truth, but "re-arrest" is a proxy for "re-offending." Policing intensity affects $Y$, meaning the base rate is not a natural constant but a measurement artifact. Second, the **Decision ($D$)** is binarised for the sake of the theorem (High vs. Low), but judicial outcomes are graded (bail amount, supervision level). The theorem assumes the score drives the decision, but judges often override scores. Third, the **Score ($S$)** is treated as the output of a fixed function, but the public debate focused on a specific threshold (decile 4), whereas the theorem applies to the score distribution as a whole. Despite these frictions, the core tension holds: the observed base rate difference makes the simultaneous satisfaction of the bottom two rows impossible.

  **What the theorem explains**

  The impossibility result renders intelligible the phenomenon of two competent parties looking at identical data and accusing each other of falsehood. Without the theorem, one might assume one side is lying or miscalculating. The theorem reveals that the dispute is not epistemic (about what is true) but normative (about what matters).

  It explains why Northpointe could claim fairness via calibration while ProPublica demonstrated unfairness via error rates. Because the base rate of re-arrest was higher for Black defendants in the sample, mathematical consistency dictates that if calibration holds, error rates *must* diverge. Specifically, to maintain calibration with a higher base rate, the threshold for "high risk" must effectively be lower for the higher-risk group, inevitably capturing more false positives.

  This removes the charge of dishonesty from the vendor. They were not hiding bias; they were optimising for a different constraint. Conversely, it validates ProPublica's findings without requiring the vendor to have made a coding error. The theorem identifies the base rate disparity as the engine of the conflict. It shows that the "bias" ProPublica found is the mathematical shadow of the base rate difference. Thus, the theorem explains the *inevitability* of the clash. It clarifies that the disagreement is not about the algorithm's performance per se, but about which statistical failure is more ethically tolerable in a context of historical inequality.

  **Where it runs out**

  The theorem fails when the assumptions underlying the variables collapse. The most critical failure point is the **Target Variable ($Y$)**. The impossibility proof assumes $Y$ is a fixed property of the world. In criminal justice, $Y$ (re-arrest) is endogenous to the system. If Black defendants are policed more intensively, their base rate of arrest will be higher even if their rate of offending is identical to White defendants.

  If the base rate difference is an artifact of policing rather than behaviour, the theorem does not prove a trade-off between fairness metrics; it proves that *any* metric relying on arrest data will encode that policing bias. The theorem treats the base rate as a constraint to be managed, not a variable to be questioned. It runs out when we ask *why* the base rates differ.

  Furthermore, the theorem assumes the cost of errors is symmetrical or irrelevant. It does not account for the social cost of a false positive (unnecessary detention) versus a false negative (a violent crime). In the COMPAS case, the harm of detaining an innocent person is arguably different from the harm of releasing a risky one. The mathematics treats these as abstract counts. Finally, the theorem assumes the score is the sole determinant of the outcome. In Broward, judges had discretion. If judges adjust for the known bias, the mathematical impossibility at the algorithmic level might not translate to an impossibility at the decisional level. The theorem describes the tool, not the hand that wields it.

  **Three probes of my own**

  **Granularity:** The theorem concerns the score at every threshold, but the public argument turned on one cut-point between low risk and everything above it. The judicial decision is not a switch but a graded one—bail amount, conditions, level of supervision. Is the theorem's force in this case partly an artefact of collapsing a continuous score and a graded decision into one binary?
  *Analysis:* Collapsing the decision exacerbates the tension. If the score is used continuously (e.g., to set bail proportionally), calibration might be preserved without triggering the binary error-rate violation at a specific threshold. However, the harm often comes from categorical thresholds (e.g., eligibility for diversion programs). The theorem highlights a risk in *binarisation*, but does not prove that continuous use solves the ethical problem. If the underlying score is miscalibrated due to biased training data, granularity merely smooths the bias rather than removing it.

  **Base Rates:** The result bites only because the groups' base rates differ, but the relevant base rate here is recorded re-arrest, which is produced by policing intensity as much as by behaviour. Does that demote the theorem from a claim about the world to a claim about a measurement, and if so what follows?
  *Analysis:* This demotes the theorem from a law of nature to a law of measurement. If base rates are socially constructed, the "impossibility" is not a fundamental limit of fairness, but a limit of using arrest data as a proxy for guilt. It follows that the solution is not choosing between fairness metrics, but changing the target variable. The theorem becomes a diagnostic tool: if satisfying fairness metrics is impossible, it signals that the base rates are likely contaminated by systemic bias.

  **Symmetry of appropriation:** Explain how a single result can be cited as vindication by both camps within a year, and say whether that marks the theorem's depth or its indeterminacy.
  *Analysis:* Both camps cite it because it validates their internal consistency while invalidating their opponent's feasibility. Northpointe cites it to say "ProPublica's demand is mathematically impossible." ProPublica cites it to say "Northpointe's calibration guarantees disparate error rates." This marks the theorem's *depth* regarding logical constraints, but its *indeterminacy* regarding ethical guidance. It is a boundary condition, not a compass. It reveals the structure of the dilemma without providing an exit, allowing both sides to claim the math is on their side because the math confirms the conflict exists.

  **Relocation or dissolution**

  Your hypothesis is that the theorem dissolved nothing and merely relocated the dispute onto normative ground. This is largely correct, but with an empirical caveat. The mathematics successfully dissolves the claim that one side is objectively "right" about the algorithm's performance. It relocates the argument to values: do we prioritise individual accuracy (calibration) or group equity (error rates)?

  However, not all remaining questions are normative. The empirical question of *why* the base rates differ remains open and is not answered by the theorem. If the base rate disparity is due to differential offending, the trade-off is tragic but perhaps necessary. If it is due to differential policing, the trade-off is an artifact of injustice. The theorem treats these scenarios identically. Therefore, the dispute is relocated to a mix of normative choice (which metric to prefer) and empirical investigation (what generates the base rates). The mathematics clears the fog of "accuracy" but leaves the fog of "causality" untouched.

  **What the theorem does not speak to**

  There are live questions in the COMPAS dispute on which the impossibility results are silent. First, **utility**: the theorem does not weigh the social cost of false positives against false negatives; it treats them as equal counts. Second, **transparency**: the theorem applies to the input-output relationship, not the proprietary secrecy of the code. A fair score could still be ethically untenable if defendants cannot challenge it. Third, **alternatives**: the theorem assumes we must use this score. It does not address whether risk assessment should be used at all, or if resources should be diverted to social interventions that lower base rates. Finally, it does not address **legal liability**: under equal protection law, does disparate impact constitute discrimination even if the algorithm is calibrated? The math cannot answer the law.
