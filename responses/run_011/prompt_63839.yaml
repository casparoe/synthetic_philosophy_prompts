      *   *Business:* This is the tricky one. Did the user have revenue? Or just "I started"? If just "I started", the principle says trust stats. If "I have customers", inside wins. The prompt implies "When I started... I decided that number wasn't about me." This suggests *optimism at the start*. This might be the one to sacrifice.
      *   *Betting:* System (Theory). (Stats win).
      *   *Nephew:* Practice (Input). (Stats win).
      *   *Daughter:* Skill (Input/Assessment). (Stats win).

      *   *Alternative Principle:* **The "Causal Independence" Principle.**
      *   Base rates apply when outcomes are determined by systemic factors outside your control. Inside view applies when outcomes are determined by factors you control *and* can measure.
      *   Kitchen: Contractors/Permits (Outside).
      *   PhD: Writing/Research (Inside).
      *   Betting: Variance/House Edge (Outside).
