      *   Daughter case? Yes.
      *   No precedent project? Yes.
      *   Which verdict to give up? Yes (Business).

      *(Self-Correction during drafting)*: Is there a way to save the Business case? Maybe if the user had "industry experience"? The prompt says "When I started... I read that most... fail". It implies early stage. If the user had 10 years experience, that's a milestone. But it sounds like "I'm starting, I know the stats, I'm different." That's classic overconfidence. It's the right one to sacrifice.

      *(Refining the Novelty Case)*: If there's no precedent, there is no base rate. So the rule is: You *must* use the inside view, but you must discount it heavily because you cannot verify barriers. It becomes "Inside View with a Penalty."

