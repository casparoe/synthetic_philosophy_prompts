      *   Sports: Relative Talent (Outside - depends on others).

      *   *Let's go with the "Predictive Evidence vs. Intentional Planning" distinction.*
      *   Principle: **Private knowledge overrides base rates only when it provides *evidence of outcome* rather than *evidence of effort*.**
      *   Kitchen: "6 weeks" is a prediction of effort/time. (Stats).
      *   PhD: "Papers" are evidence of outcome (progress). (Inside).
      *   Business: "I'm working hard" is effort. (Stats). *This forces a change.*
      *   Betting: "System" is theory/effort. (Stats).
      *   Nephew: "Practice" is effort. (Stats).
      *   Daughter: "Skill" is potential/effort. (Stats).

      *   *Wait, is there a way to save the Business case?*
      *   Business success isn't purely relative (like sports) or purely random (like betting). It's skill-based. But so is the PhD.
      *   The difference between Business and Betting is **Expected Value**.
      *   The difference between PhD and Kitchen is **Agency**.
      *   The difference between Nephew/Daughter and PhD is **Competition**. PhD is mostly "can you do the work?" (though job market is competitive, finishing the degree is less so). Sports are "are you better than everyone else?"

      *   *Refined Principle:* **The "Zero-Sum vs. Absolute Standard" Principle.**
      *   Base rates dominate when success is **relative** (beating others) or **structural** (uncontrollable delays). Inside view dominates when success is **absolute** (meeting a fixed standard) and you have **verified progress**.
      *   Kitchen: Structural delays. (Stats).
      *   PhD: Absolute standard (thesis quality). Verified progress (papers). (Inside).
      *   Business: Absolute standard (profitability). (Inside? Maybe).
      *   Betting: Relative/Structural (House edge). (Stats).
      *   Nephew/Daughter: Relative (roster spots). (Stats).

      *   *This looks promising.* It groups Kitchen (structural), Betting (structural/math), Sports (relative) vs. PhD (absolute + progress) vs. Business (absolute?).
      *   But Business failure rates are high. Why? Market fit. That's structural.
      *   If I use the **"Verified Progress" Principle**:
          *   You can ignore base rates if you have *completed* the critical path items that cause failure.
          *   Kitchen: Haven't started. (Stats).
          *   PhD: Papers done. (Inside).
          *   Business: Just started. (Stats). *Sacrifice this.*
          *   Betting: System tested? Usually backtested (illusion). (Stats).
          *   Sports: Practice done, but haven't won spot. (Stats).

      *   *Let's try to formulate the "Single Principle" clearly.*
      *   **Principle:** "You may privilege the inside view over the base rate only when your private information consists of **verified, causal milestones** that have already been achieved, not **inputs, intentions, or self-assessments of capability**."
      *   *Why:* Base rates capture the probability of *getting through* the process. If you have already gotten through the hard parts (papers), the base rate of "starting to finishing" no longer applies. If you are just *planning* (kitchen) or *practicing* (sports) or *starting* (business), you are still subject to the attrition the base rate measures.

      *   *Applying to Daughter:* She wants to *try out*. She has skill (input/capability). She hasn't made the team (milestone). -> **Give her the base rate.** (Be realistic).
      *   *Applying to Novel Project:* No precedent class. -> **Base rate is undefined.** You must use the inside view, but break it down into causal milestones. If no milestones, assume high risk (conservative inside view).
      *   *Which verdict to sacrifice?*
          *   User trusts their Business start ("I decided that number wasn't about me").
          *   Under this principle, starting a business is like the kitchen renovation. You haven't achieved the milestones (profit, retention). You are planning.
          *   So I must tell the user: **Your confidence in your own business startup was statistically unjustified optimism, even if it worked out.**
          *   This fits the prompt: "tell me which of the verdicts above it can't save — I'd rather give one up than end up with a rule that's just a pile of exceptions."

  4.  **Drafting the Response:**
      *   **The Principle:** Call it the **"Milestone vs. Input" Rule**. (Or "Completed Causal Work"). Let's refine the wording for precision. "The Principle of Verified Causal Progress."
      *   **Definition:** Private knowledge overrides base rates *if and only if* it constitutes evidence that the specific *barriers* responsible for the base rate's failure probability have already been surmounted. Inputs (effort, skill, plans) do not count; Outputs (completed critical steps) do.
      *   **Daughter Case:** Soccer selection is a barrier not yet surmounted. Practice is input. -> **Tell her the base rate.**
      *   **Novel Project:** No base rate exists. You must use inside view, but you must treat your assumptions as unverified. -> **Treat as high risk until milestones hit.**
      *   **The Sacrifice:** The **Business Startup**. The user said "I basically decided that number wasn't about me" at the *start*. At the start, you have no verified milestones. You have inputs (effort, idea). Therefore, the base rate *did* apply. The user was engaging in the same bias as the cousin (betting) or friend (kitchen), even if the outcome was different.
      *   *Wait, check the Nephew case.* User is conflicted. The principle resolves the conflict: Practice is input. Audition is the barrier. -> Base rate applies to the *audition*, though the narrow class (hard workers) is better than general population, it's still an input. The principle says stick to the harder stats unless the "hard work" guarantees the spot (it doesn't). So the principle aligns with the "honest reference class is everyone who auditions" half.
      *   *Check Sister:* Papers are outputs. Barrier is "doing the research". She did it. -> Inside view applies. Principle saves this.
      *   *Check Kitchen:* Plan is input. Barrier is "construction delays". Not surmounted. -> Base rate applies. Principle saves this.
      *   *Check Betting:* System is input/theory. Barrier is "mathematical edge". Not surmounted (unless proven with real money track record). -> Base rate applies. Principle saves this.

      *   *Conclusion:* The principle is robust. It saves Kitchen, Sister, Betting, Nephew (resolves conflict), Daughter. It sacrifices the User's Business Startup confidence.

  5.  **Refining the Wording:**
      *   Make the principle sharp. "The Principle of Surmounted Barriers."
      *   Explain *why* base rates exist (they measure the difficulty of barriers).
      *   Explain *why* inside view fails (it measures intent/capacity, not barrier clearance).
      *   Address the "Novelty" case carefully. If no class, you can't use base rates, but you must simulate them by identifying barriers.
      *   Be firm on the sacrifice. It's the most valuable part of the answer.

  6.  **Final Review against constraints:**
