prompt: |-
  I've been going around in circles on when you're allowed to trust your own read of your situation versus the stats on people like you, and I think my answers contradict each other. Here's what I actually think, case by case:

  My friend is redoing his kitchen and swears it'll be six weeks. Everyone I know who's done a renovation says three months at minimum, and he knows that. I think he's just wrong to plan around six — knowing your own kitchen in detail doesn't get you out of the base rate.

  My sister says she'll finish her PhD in two years. She's got two papers out and most of a chapter drafted. I think she's entitled to expect two years even though the average is like five, and that doesn't feel like wishful thinking to me the way the kitchen one does.

  When I started my landscaping business I read that most of them fail within five years, and I basically decided that number wasn't about me. I dont feel bad about that. But when my cousin pulled the same move with a sports betting system he'd worked out, I told him he was kidding himself.

  My nephew wants to audition for a music program that takes maybe 4% of applicants. Half of me says the honest reference class is everyone who auditions; the other half says it's kids who've practiced four hours a day since they were nine, which he is. And I've noticed I can almost always find some narrower group that makes the odds look good, which seems like a bad sign — except sometimes the narrow group really is the right one, like with my sister.

  Then the one I keep flip flopping on: my daughter wants to try out for a pro soccer team. I want to tell her to be realistic, but if she asked me straight out what her chances are, I don't know whether to give her the base rate or my read on her.

  Is there a single principle that says when private knowledge of your own case legitimately overrides the statistics and when it's just you flattering yourself? Please state it as exactly as you can, say what it comes out to for the daughter case and for a project where there's no real precedent to draw a class from at all, and tell me which of the verdicts above it can't save — I'd rather give one up than end up with a rule that's just a pile of exceptions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Problem:** The user is struggling with the tension between "inside view" (private knowledge, specific details) and "outside view" (base rates, statistics of similar cases). They have a set of intuitions about specific cases (friend's kitchen, sister's PhD, own business vs. cousin's betting, nephew's audition, daughter's soccer) that feel contradictory.
      *   **Goal:** Find a *single principle* that distinguishes when private knowledge legitimately overrides statistics vs. when it's self-deception.
      *   **Requirements:**
          1.  State the principle as exactly as possible.
          2.  Apply it to the daughter's soccer case.
          3.  Apply it to a project with no real precedent (novelty).
          4.  Identify which of the user's existing verdicts the principle *cannot* save (i.e., force the user to change their mind on one).

  2.  **Deconstruct the Cases:**
      *   *Friend's Kitchen:* User says trust stats (3 months), not inside view (6 weeks). Why? Renovations are plagued by unknown unknowns, supply chains, contractor issues. The friend's "detailed knowledge" doesn't actually control the critical variables.
      *   *Sister's PhD:* User says trust inside view (2 years), not stats (5 years). Why? She has tangible outputs (papers, chapter). The "average" includes dropouts, unfunded students, those without direction. Her specific progress is a *causal* indicator of completion.
      *   *User's Business vs. Cousin's Betting:* User trusts self (business), distrusts cousin (betting). Why? Business success correlates with skill, effort, market fit (controllable/observable). Betting systems (unless actual arbitrage, which is rare) usually fight against a negative expected value house edge. The "system" is likely an illusion of pattern in noise.
      *   *Nephew's Music Audition:* User is conflicted. 4% acceptance vs. "practiced 4 hours/day". The conflict is about whether the practice *causally* links to acceptance or if it's just a necessary but insufficient condition.
      *   *Daughter's Soccer:* The flip-flop case. Pro sports are extremely low base rate. Does skill override this?

  3.  **Search for the Underlying Principle:**
      *   *Hypothesis 1: Control.* Can you control the outcome?
          *   Kitchen: Low control (contractors).
          *   PhD: High control (writing).
          *   Business: Medium/High control.
          *   Betting: Low control (luck/variance).
          *   Soccer: Medium control (skill), but high competition.
          *   *Critique:* Too vague. You can't fully control a PhD either.
      *   *Hypothesis 2: Causal Link vs. Correlation.* Does the private knowledge *cause* the success, or just describe the attempt?
          *   Kitchen: Knowing the layout doesn't fix plumbing surprises.
          *   PhD: Papers drafted *are* the work required.
          *   Betting: Past wins don't cause future wins in independent events.
          *   Soccer: Skill causes performance, but selection is relative.
      *   *Hypothesis 3: Predictive Validity of the Evidence.* Is the private knowledge *evidence of progress* or just *intent/optimism*?
          *   Kitchen: "Six weeks" is an estimate/intent.
          *   PhD: "Two papers" is completed work.
          *   Business: "I have a plan/skill" vs. Betting "I have a system".
      *   *Hypothesis 4 (The Winner):* **The Causal Mechanism Test.** Does your private information identify a *causal mechanism* that bypasses the constraints creating the base rate?
          *   Base rates exist because of structural constraints (time, randomness, competition).
          *   Inside view wins only if it identifies a specific factor that *neutralizes* the structural constraint.
          *   Kitchen: Structural constraint = supply chains/contractor availability. Friend's knowledge doesn't neutralize this. -> Trust Stats.
          *   PhD: Structural constraint = research difficulty/writing. Sister's papers = constraint already overcome. -> Trust Inside.
          *   Business: Structural constraint = market viability. User's skill/effort = can overcome. Betting: Structural constraint = negative EV. System = cannot overcome math. -> Trust Stats on cousin.
          *   Soccer: Structural constraint = limited roster spots + relative talent. Daughter's skill = necessary, but is it *sufficient* to beat the relative comparison?

      *   *Refining the Principle:* It's about **Predictive vs. Explanatory** information. Or better: **Is the private information a leading indicator of the specific bottleneck?**
      *   *Even Better:* **The "Bottleneck" Principle.** Base rates reflect the difficulty of specific bottlenecks. You can ignore the base rate only if your private knowledge proves you have already cleared or uniquely bypassed the *actual* bottleneck that causes the failure rate.

      *   *Let's try a formulation based on "Screening" vs. "Causal Power".*
      *   Actually, the most robust philosophical framework here is **Reference Class Forecasting** (Kahneman/Lovallo). The rule is: Use the outside view unless you have *hard, verifiable evidence* that places you in a *causally relevant* subclass.
      *   *The "Hard Evidence" Rule:* You can override the base rate only if your private knowledge consists of **completed milestones** that are **causally necessary and sufficient** for the outcome, not just **inputs** or **intentions**.
      *   *Kitchen:* "6 weeks" is an intention/input. (Trust Stats).
      *   *PhD:* "Papers/Chapter" are completed milestones. (Trust Inside).
      *   *Business:* "Skill/Work" is input. (Wait, user trusts self here). Maybe business is different because it's not a zero-sum game like betting or sports?
      *   *Betting:* "System" is input/theory. (Trust Stats).
      *   *Soccer:* "Practice" is input. (Trust Stats?).

      *   *Wait, I need to find a principle that saves most but sacrifices one.*
      *   Let's look at the "Business vs. Betting" distinction. Why is business okay but betting not? Business creates value (positive sum). Betting is zero/negative sum.
      *   Let's look at "Sister vs. Kitchen". Sister has *output*. Friend has *estimate*.
      *   Let's look at "Nephew". Practice is *input*.
      *   Let's look at "Daughter". Tryout is the test.

      *   *Proposed Principle:* **The "Completed Work" Principle.**
      *   You may override the base rate only when your private knowledge consists of **tangible, completed artifacts** that constitute a significant portion of the success criteria, rather than **plans, inputs, or self-assessments of ability.**
      *   *Kitchen:* Plan/Estimate. (Stats win).
