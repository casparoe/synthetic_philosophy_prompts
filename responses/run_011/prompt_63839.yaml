      If there is no reference class, you *cannot* use the outside view. You are forced to use the inside view. The principle must address how to use the inside view safely in that vacuum.
      *Adjustment:* In the absence of a base rate, you must treat your inside view as a *hypothesis* and apply a "uncertainty discount." But strictly speaking, the principle is about *when to trust inside over outside*. If outside is null, inside wins by default, but with caveats. I should state that clearly.

      *Wait, let's look at the Business case again.* Is it possible the principle saves it? If the user had "private knowledge" of their own skill? No, skill is input. If they had "signed contracts" before launching? That's a milestone. The prompt says "When I started...". Implies day 1. Okay, sticking with sacrificing the Business verdict.

