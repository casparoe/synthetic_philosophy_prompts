answer: |-
  Here is the principle, the applications, and the cost.

  ### The Principle: The Surmounted Barrier Rule

  **You are permitted to override the base rate only when your private knowledge provides evidence that the specific causal bottlenecks responsible for the statistical failure rate have already been irreversibly cleared.**

  **Explanation:** Base rates exist because there are structural barriers (time, complexity, competition, randomness) that stop most people. The "inside view" (your private knowledge) is usually composed of **inputs** (effort, skill, plans, optimism) or **intentions**. Inputs do not clear barriers; they only attempt to. You may only trust your read of the situation when your private knowledge consists of **outputs** (completed milestones, verifiable artifacts, secured resources) that prove the barrier is no longer in play.

  *   **Kitchen:** The barrier is supply chains/contractor availability. Your friend's "detailed knowledge" is an input/plan. The barrier remains. **Trust Stats.**
  *   **Sister:** The barrier is producing novel research/writing. Her papers are outputs. The barrier is cleared. **Trust Inside.**
  *   **Betting:** The barrier is negative expected value/math. A "system" is a theory/input. The barrier remains. **Trust Stats.**
  *   **Nephew:** The barrier is being better than the other 96%. Practice is an input. The barrier remains. **Trust Stats (of the qualified pool).**

  ### Application: The Daughter (Soccer)

  **Verdict:** Give her the base rate.

  **Reasoning:** Professional selection is a **relative** barrier, not an absolute one. Even if she is incredibly skilled (input), her success depends on whether she is *more* skilled than the other applicants and whether the coach needs her specific position. Unless she has already been offered a contract (a cleared barrier), her private knowledge of her own ability is just an input. Telling her the 4% stat is not discouraging realism; it is accurately describing the hurdle she has not yet jumped. You can encourage her effort without lying about the odds.

  ### Application: The Novel Project (No Precedent)

  **Verdict:** You must use the inside view, but you must apply a "Uncertainty Discount."

  **Reasoning:** If there is no reference class, there is no base rate to override. You are forced to rely on your read of the situation. However, because you cannot verify your assumptions against historical data, you must treat every assumption in your inside view as a **potential hidden barrier**.
  *   **The Rule:** Break the project down into its causal bottlenecks. For each bottleneck where you lack verified output (e.g., "I *think* people will buy this" vs. "People *have* prepaid for this"), you must assign a high probability of failure. You cannot use optimism to fill the gap where data should be.

  ### The Sacrifice: Your Landscaping Business

  **Verdict:** This is the one the rule cannot save.

  **Reasoning:** You wrote: *"When I started my landscaping business... I basically decided that number wasn't about me."*
  At the *start* of the business, you had inputs (drive, skill, a plan), but you had not cleared the causal bottlenecks that cause 5-year failure rates (cash flow stability, customer retention, market shifts). You were in the exact same epistemic position as your friend with the kitchen or your cousin with the betting system. You were privileging your intent over the structural reality of small business attrition.

  **Why you must give this up:**
  It is tempting to say, "But my business succeeded!" That is outcome bias. The rule isn't about whether you *were* right in the end; it's about whether you were *rational* at the start. You were not. You got lucky, or you were exceptionally skilled in a way you couldn't verify at the time. To keep a consistent rule, you must admit that your confidence then was statistically unjustified optimism, indistinguishable from your cousin's betting confidence until the results came in.

  ### Summary
  If you adopt the **Surmounted Barrier Rule**, you keep your judgments on the Kitchen, Sister, Cousin, and Nephew. You get a clear answer on the Daughter. You get a safe method for Novel Projects. But you must accept that your own entrepreneurial confidence was a form of the very bias you criticize in others. That is the price of a rule that actually works.
