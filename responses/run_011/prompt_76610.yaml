      *   The Inspector needs a principle that sounds consistent but applies differently over time as the "practice" evolves.
      *   Principle Idea: "The letter must remain legible within the continuity of the city's hand." (Vague enough to shift).
      *   Actually, the prompt says: "the inspector must be able to defend both while stating the same principle on both occasions. Do not resolve this by revealing that the principle was secretly a different one all along. The point I want made is that the principle does not settle the cases; the cases settle it, afterwards."
