  # Handout: Counterexamples to Good's Theorem

  **Context:** Good's Theorem states that for a Bayesian expected-utility maximizer, the expected utility of observing a costless signal is never less than the expected utility of acting immediately. The proof relies on specific structural hypotheses. The following two cases describe realistic scenarios where a rational agent declines a costless observation. In each case, exactly one hypothesis of the theorem is violated.

  ---

  ## Case 1: The Compliance Gamble

  **(a) Scenario**
  A project manager must decide whether to launch a software update by Friday. There is a 20% chance the update contains a minor compliance violation (State $V$) and an 80% chance it is clean (State $\neg V$). The manager has two options: **Launch** or **Halt**. If she launches and the software is clean, the company gains a market advantage (Utility 100). If she launches and there is a violation, the violation is minor enough that the profit from speed outweighs the regulatory fine (Utility 60). If she Halts, she incurs a delay cost regardless of the state (Utility 50). Company policy stipulates that if the manager *knows* a violation exists, she is legally prohibited from Launching; she must Halt. However, if she remains ignorant, she is permitted to Launch. The compliance report is available instantly and for free.

  **(b) Expected Utility Calculation**

  | Decision Point | Calculation | Expected Utility |
  | :--- | :--- | :--- |
  | **Decide Now** (Ignorant) | $0.8 \times U(\text{Launch}, \neg V) + 0.2 \times U(\text{Launch}, V)$ <br> $0.8(100) + 0.2(60)$ | **92** |
  | **Observe First** (Informed) | $0.8 \times \max[U(\text{Launch}, \neg V), U(\text{Halt})] + 0.2 \times \max[U(\text{Halt})]$ <br> *(Note: If $V$ is observed, Launch is unavailable)* <br> $0.8(100) + 0.2(50)$ | **90** |

  **Result:** The agent rationally declines the observation ($92 > 90$).

  **(c) Failed Hypothesis**
  **The Fixed Set of Acts Hypothesis.** Good's theorem assumes the set of available acts $A$ is identical whether the agent observes or not. Here, the act *Launch* is available ex-ante but is removed from the choice set ex-post if state $V$ is revealed. The inequality breaks because the "maximum of the average" (Decide Now) allows a gamble that the "average of the maxima" (Observe First) forbids in one branch.

  **(d) Redescription and Verdict**
  *Redescription:* A defender of the theorem would expand the state space to include the regulatory status. Let $S_1 = (\neg V)$, $S_2 = (V \text{ \& Ignorant})$, $S_3 = (V \text{ \& Known})$. The act *Launch* is now defined over all states. We assign $U(\text{Launch}, S_3) = -\infty$ (or simply make it dominated).
  *Verdict:* This relocates the problem rather than settling it. It preserves the theorem formally by baking the institutional constraint into the utility function or state definition, but it concedes that the "Fixed Acts" hypothesis is not a neutral structural feature but a substantive claim about institutional permeability. The theorem holds only if we define acts so finely that they include their own permission conditions, rendering the "Fixed Acts" hypothesis trivial.

  ---

  ## Case 2: The Duty to Rescue

  **(a) Scenario**
  A commuter walks past a construction site daily. There is a 10% chance a worker is trapped and unseen behind a barrier (State $D$) and a 90% chance the site is clear (State $\neg D$). The commuter can **Ignore** (continue walking) or **Help** (investigate/assist). If the site is clear, Ignoring saves time (Utility 100) while Helping is wasted effort (Utility 80). If a worker is trapped, Helping saves a life (Utility 20, net of effort). If the commuter Ignores a trapped worker *unknowingly*, it is a tragic accident (Utility 100, no blame). However, if the commuter *observes* the distress signal (a costless glance over the barrier) and then Ignores, they are liable for criminal negligence (Utility -500). The commuter can choose to glance or not glance before deciding whether to Help.

  **(b) Expected Utility Calculation**

  | Decision Point | Calculation | Expected Utility |
  | :--- | :--- | :--- |
  | **Decide Now** (Ignorant) | $0.9 \times U(\text{Ignore}, \neg D) + 0.1 \times U(\text{Ignore}, D)$ <br> $0.9(100) + 0.1(100)$ | **100** |
  | **Observe First** (Informed) | $0.9 \times \max[U(\text{Ignore}, \neg D), U(\text{Help}, \neg D)] + 0.1 \times \max[U(\text{Ignore}, D)^*, U(\text{Help}, D)]$ <br> *($U(\text{Ignore}, D)^*$ is -500 due to liability)* <br> $0.9(100) + 0.1(20)$ | **92** |

  **Result:** The agent rationally declines the observation ($100 > 92$).

  **(c) Failed Hypothesis**
  **The Utility Independence Hypothesis.** Good's theorem assumes $U(a, s)$ is invariant to the information partition. Here, the utility of the pair (Ignore, $D$) depends on whether the agent knows $D$. The physical consequences are identical, but the normative consequences (liability) attach only to the *known* state. The proof breaks because the posterior utility function differs from the prior utility function; the "average of the maxima" uses a different utility scale in the $D$ branch than the "weighted average" of the prior.

  **(d) Redescription and Verdict**
  *Redescription:* A defender would expand the consequence space. The consequence is not just "Worker Dies" but "Worker Dies \& Agent is Liable." The state remains $D$, but the act-state pair (Ignore, $D$) yields different consequences depending on the epistemic path. We define $U(\text{Ignore}, D, \text{Known}) \neq U(\text{Ignore}, D, \text{Unknown})$.
  *Verdict:* This settles the matter formally but at the cost of making "Utility" absorb all normative context. It suggests the theorem is a tautology: information has non-negative value *provided* we define value such that knowledge cannot alter the valuation of outcomes. This strips the theorem of its normative force, as the "value" of information becomes dependent on how we individuate consequences.

  ---

  ## Comparative Judgment

  **Teaching Value:**
  **Case 1 (Compliance)** is the superior teaching case for a first pass. The violation (act availability) is discrete and easy to model in a decision tree; students can immediately see the branch being pruned. It highlights how institutional rules interact with rational choice. **Case 2 (Liability)** is philosophically deeper but technically trickier; it requires students to grasp that utility functions are not merely over physical states but over epistemic-normative states. It is better suited for a follow-up discussion on the definition of "consequences."

  **Philosophical Implication:**
  Taken together, these cases suggest that Good's Theorem is less a substantive constraint on rational choice and more a structural identity that holds only within a tightly sealed formal system. The theorem guarantees the value of information only if we assume that information cannot change what we are allowed to do (Case 1) or how we are evaluated for what we do (Case 2). In the real world, knowledge is often constitutive of responsibility and permission. Therefore, the theorem's hypotheses do not merely frame the problem; they guarantee the conclusion by excluding the very mechanisms (liability, prohibition) that make ignorance rational in practice. The theorem is true, but its truth is purchased by idealizing away the social and normative costs of knowing.
