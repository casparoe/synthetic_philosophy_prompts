      Act: Launch. Payoff Good: 100. Payoff Bad: 10 (Risk is low).
      EU(Launch) = 0.8(100) + 0.2(10) = 82.
      Act: Halt. Payoff: 50.
      Decision Now: Launch (82 > 50).
      Info:
      Good (0.8): Launch (100).
      Bad (0.2): Launch *Forbidden*. Must Halt (50).
      EU(Info) = 0.8(100) + 0.2(50) = 90.
      *Wait, 90 > 82.* Info is GOOD.
      *I need Info to be BAD.*
      *Why?* Because avoiding the bad state (by Halting) is valuable.
      *To make Info BAD:* The "Ignorant" act (Launch) must yield a *higher* payoff in the Bad state than the "Forced" act (Halt).
      *Revised Case 1:*
      Act: Launch. Payoff Good: 100. Payoff Bad: 60 (Bonus for speed outweighs risk).
      Act: Halt. Payoff: 50.
      Prior P(Bad) = 0.2.
      EU(Launch) = 0.8(100) + 0.2(60) = 92.
      EU(Halt) = 50.
      Decision Now: Launch.
      Info:
      Good (0.8): Launch (100).
      Bad (0.2): Launch Forbidden. Must Halt (50).
      EU(Info) = 0.8(100) + 0.2(50) = 90.
      90 < 92. **Success.**
      *Logic:* Ignorance allows you to gamble on the Bad state and win (60 > 50). Knowledge forces you to take the safe option (50).

      *Refining Case 2 Numbers:*
      Prior P(Danger) = 0.1.
      Act: Ignore. Payoff Safe: 100. Payoff Danger (Ignorant): 100 (No liability).
      Act: Help. Payoff Safe: 80. Payoff Danger: 20.
      EU(Ignore) = 0.9(100) + 0.1(100) = 100.
      EU(Help) = 0.9(80) + 0.1(20) = 74.
      Decision Now: Ignore.
      Info:
      Safe (0.9): Ignore (100).
      Danger (0.1): Ignore (Known) -> -500 (Liability). Help -> 20. Max is 20.
      EU(Info) = 0.9(100) + 0.1(20) = 92.
      92 < 100. **Success.**

      *Ready to write.*
