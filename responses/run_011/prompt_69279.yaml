answer: |-
  The specification is jointly satisfiable and the feature that does the work is the Discursive Dilemma.

  A university tenure committee comprising three senior faculty members must decide whether to grant tenure ($C$) to a candidate, bound by a statutory rule requiring affirmative findings on three distinct criteria: research excellence ($P$), teaching competence ($Q$), and service contribution ($R$), such that tenure is warranted if and only if $P \land Q \land R$ are all true. The committee members possess specialized expertise that leads to substantive, good-faith disagreements on the evidence: the research specialist (Member 1) identifies fatal flaws in the candidate's publication record ($\neg P$) but affirms teaching and service; the teaching specialist (Member 2) finds the pedagogical evaluations insufficient ($\neg Q$) but affirms research and service; and the administrative lead (Member 3) determines the service load was not met ($\neg R$) but affirms research and teaching. Because each member believes at least one necessary condition fails, each individually concludes that tenure is unwarranted ($\neg C$), yet because each criterion is affirmed by a majority of the panel, the collective record supports all three premises.

  | Member | Research ($P$) | Teaching ($Q$) | Service ($R$) | Decision ($C$) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1** | No | Yes | Yes | No |
  | **2** | Yes | No | Yes | No |
  | **3** | Yes | Yes | No | No |
  | **Majority** | **Yes** | **Yes** | **Yes** | **No** |
  | **PBP Outcome** | **Yes** | **Yes** | **Yes** | **Yes** |
  | **CBP Outcome** | — | — | — | **No** |

  (a) Under the conclusion-based procedure (CBP), the panel aggregates votes directly on the decision $C$; since all three members vote No, the outcome is No. Under the premise-based procedure (PBP), the panel aggregates votes on $P, Q,$ and $R$ individually; since each premise receives two Yes votes against one No, the collective judgment accepts all three premises, and the logical rule ($P \land Q \land R \to C$) forces the collective decision to be Yes.

  (b) The structural feature generating the divergence is the non-monotonicity of collective rationality under premise-based aggregation when dissent is distributed across distinct premises rather than concentrated on the conclusion. If the panel is raised to five members, the paradox remains logically possible but requires a specific distribution of dissent (e.g., two members reject $P$, two reject $Q$, one rejects $R$) to maintain majority support on all premises while unanimity rejects the conclusion; random expansion typically dilutes this configuration. If the premises are evidentially correlated rather than independent, a member rejecting $P$ becomes likely to reject $Q$ and $R$, collapsing the disjoint dissent required for the majority to accept all premises, thereby dissolving the paradox.

  (c) A defender of conclusion-based aggregation would attack the design by charging the panel with collective insincerity or "lying," arguing that an institution cannot legitimately assert a judgment ($C$) that no single member believes to be true, thereby violating democratic integrity. A premise-based theorist must respond that individual integrity is preserved because members vote sincerely on the reasons within their expertise, and that institutional rationality requires the collective output to be logically consistent with its stated reasons, even if this decouples the collective conclusion from individual mental states.
