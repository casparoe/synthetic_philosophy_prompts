  Good evening. For those of you who don't know me, I'm the one who fixes the furnace when it stops blowing hot air in January. I work with my hands. I deal in ducts and motors and things that make noise when they're broken. Ray deals in silence.

  Ray and I have a tradition. Every Thanksgiving, after the plates are cleared, we sit in the living room and argue about things we can't prove. Ray has spent thirty-three years running the sleep lab at the county hospital. I spend my days crawling through attics. And yet, somehow, he asked me to stand up here and say a few words about his career. I think he did it on purpose. He knows I'm the only one in the family who won't just say the nice, easy thing.

  Because the easy thing is to say Ray spent his life watching people dream. But I look at furnaces, and I know that just because a machine is running doesn't mean you know what it's doing inside the casing. And Ray knows I've read the books. He knows I know that all we ever really have is the story we tell when the lights come on.

  But here is what I know for sure. I know that at three in the morning, in a room with the lights low, Ray was the first voice a stranger heard. I know that when someone woke up confused, frightened, or wondering what had just happened to them, Ray was the one holding the notebook. He was the one who said, "Take your time. I'm listening."

  We talk about his career starting with his dad. We all know the story. Ray's father punched a hole through the headboard. Wood splinters, blood on the sheets. A physical thing, in the dark. That was the spark. That was the moment Ray decided he needed to understand what happens when we close our eyes. Whether that punch was driven by a movie playing in the brain or a story written the moment his eyes opened, the wood still broke. The mystery still mattered.

  For thirty-three years, Ray didn't try to prove the dream was real. He tried to make the waking up safe.

  There are people in this room—techs, doctors, researchers—who know how complicated the night is. They know the arguments about memory and impression and when exactly a narrative begins. And there are people in this room—family, neighbors, patients—who just know that Ray helped them sleep better.

  I think both groups are looking at the same truth. Because it doesn't actually matter if the story started in the dark or started the moment the light came on. What matters is that Ray treated every single report like it was sacred. He didn't judge the story. He didn't tell you it was just a misfiring neuron. He wrote it down. He validated the fear. He validated the joy.

  In my line of work, if a system is broken, I fix the parts. In Ray's line of work, if a person is broken, he fixes the morning. He gave people a place to bring the things they saw in the dark, and he made sure those things were heard by a human being who cared.

  Ray, you know I'm not going to say you monitored thirty-three years of dreams. But I will say this: You witnessed thirty-three years of people trusting you with their minds the moment they regained them. That is a hell of a lot of trust. And you earned every page of those notebooks.

  So, to Ray. May your nights be deep, may your mornings be clear, and may you never have to argue with me about the nature of consciousness again. Unless, of course, it's Thanksgiving.

  To Ray.

