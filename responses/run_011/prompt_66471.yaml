answer: |-
  Right, let's unpick this. It is a proper puzzle, and you're both half-right, which is why you couldn't land it. Your mate sees the mechanical inertia; you sense the philosophical architecture. The trick is realising that German privacy isn't about "secrecy" in the abstract; it's about "power" in the specific.

  Here is the breakdown of how that contradiction holds together, where it wobbles, and what happens if you change the axioms.

  ### 1. The Coherent Picture: Privacy as Defence Against the State
  The picture of privacy that makes this coherent is **Informational Self-Determination** (*informationelle Selbstbestimmung*), established in the 1983 Census Judgment. But crucially, this right was conceived primarily as a **vertical defence** (citizen vs. state), not a **horizontal one** (citizen vs. citizen).

  The German logic runs like this:
  *   **The Threat:** The existential threat to human dignity is the *state* constructing a comprehensive profile of your life, because that allows for control and chilling effects on freedom.
  *   **The Solution:** Fragment the state's knowledge. Keep the police separate from the intelligence services. Keep the tax office separate from the health service. Prevent the creation of a centralised "Big Brother" database.
  *   **The Exception:** To function in a civil society, individuals must be locatable by one another. If I lend you money, sue you, or send you a letter, I must be able to find you.

  Therefore, the coherence is this: **Privacy protects you from being *known* by the state, but transparency protects you from being *hidden* from your peers.**

  The address register (*Melderegister*) is not viewed as a tool for profiling; it is viewed as a tool for legal certainty. The state holds the data not to watch you, but to act as a neutral noticeboard so other citizens can interact with you legally. The "dignity" harm comes from aggregation and surveillance, not from a neighbour knowing where you sleep.

  ### 2. Strict Presuppositions vs. Nice Fits
  You asked to separate what the practice *strictly presupposes* from what merely *fits nicely*.

  **What is Strictly Presupposed:**
  1.  **Data Minimisation by the State:** The government may only hold the specific data points required for a specific statutory task. It cannot hold your address *and* your shopping habits *and* your travel history in one linked file.
  2.  **Purpose Limitation:** The data collected for the registration office cannot be automatically transferred to the police or the tax authorities without a specific legal bridge.
  3.  **Individual Identifiability:** The system presupposes that a citizen *must* be identifiable to be a legal actor. You cannot have full rights if you are untraceable.

  **What Merely Fits Nicely (but isn't essential):**
  1.  **The "Harmless Address" Assumption:** The system operates on the assumption that a home address is low-sensitivity data. This fits nicely with the 19th-century view of the postman and the neighbour, but it fits less nicely in the age of doxxing and stalking.
  2.  **Administrative Convenience:** It is certainly convenient for the state to have a single source of truth for mail. This supports the practice, but the practice could survive without it (e.g., if private insurers held the data instead).
  3.  **The €10 Fee:** The fee suggests a commercial transaction, which makes it look like a service. In reality, this is just cost recovery. The principle would hold even if it were free or £50.

  ### 3. Where It Is Philosophically Underdetermined
  This is where your mate's "inertia" argument gains traction, and where you need to be careful. The German model is underdetermined on the question of **private sector aggregation**.

  The 1983 judgment was about the *state*. It did not originally account for private data brokers, credit reference agencies (like Schufa), or stalkers using public registers to build a private profile.
  *   **The Gap:** The law prevents the *state* from combining your address with your political views. It is historically much looser on preventing a *private company* from combining your public address with your public voting record and your social media posts.
  *   **The Wobble:** If the core principle is "dignity through self-determination," why does the state facilitate a private stranger accessing your location without your consent? The philosophical bridge here is shaky. It relies on the idea that "public law" requires public findability, but it underestimates the power of private actors to weaponise that findability.

  Recent changes (specifically the 2019 amendments to the Federal Registration Act) have tightened this due to stalking concerns. You can now block data access more easily. This admits that the old "harmless address" assumption was philosophically weak.

  ### 4. The "Nobody Assembles a Picture" Swap
  If you swapped the current principle for a blunt **"Nobody gets to assemble a picture of me"** (a radical right to obscurity or contextual integrity), the system would break in the following ways:

  **In Law:**
  *   **The Register Closes:** The *Melderegisterauskunft* would have to be abolished or moved behind a strict "legitimate interest" court order. You couldn't just pay €10; you'd have to prove you need to serve a legal writ.
  *   **Schufa Collapse:** Credit reference agencies would be largely unlawful. They exist precisely to assemble a picture of your financial reliability from disparate data points.
  *   **Journalistic Exemption:** Investigative journalism would become legally perilous. Finding where a corrupt official lives to verify their lifestyle against their income would be "assembling a picture."

  **In Reasoning:**
  *   **Shift from Power to Secrecy:** The focus would shift from limiting *state power* to limiting *knowledge itself*. The German model says, "The state can know X, but not Y, and never X+Y." Your proposed model says, "No one can know X+Y, and preferably not X alone."
  *   **Burden of Proof:** Currently, the burden is on the data *user* to show they have a right to access (in theory). Under your swap, the burden would shift to the data *subject* to prove why they should be found at all.
  *   **Civil Friction:** Debt collection, child support enforcement, and serving legal notices would become nightmarishly difficult. The "legal certainty" pillar of the German civil code would crumble.

  ### The Verdict
  Your mate is being too dismissive. It isn't *just* dull administration; it is a deliberate choice to prioritise **civil findability** over **private obscurity**.

  However, you are right to feel the tension. The coherence holds only so long as you accept that the primary threat to dignity is the *totalitarian state*, not the *harassing individual* or the *commercial profiler*.

  The German model is consistent if you view privacy as a **shield against sovereignty**, not a **veil against society**. If you view privacy as a veil against society, the address register is indefensible. If you view it as a shield against sovereignty, the address register is permissible, provided the state itself doesn't use that register to track your movements.

  **To win the argument:** Concede that the *mechanism* is old (mate's point), but insist that the *justification* is principled (your point). The principle is that the state must not be the gatekeeper of social contact, even if that means sacrificing some degree of personal obscurity. The recent tightening of the rules due to stalking proves the principle is evolving, not that it was never there.
