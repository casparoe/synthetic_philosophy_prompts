answer: |-
  **Memorandum: Procedure for Historical Redress Assessment**

  **To:** The Redress Panel
  **From:** Chair
  **Subject:** Operational Framework for Historical Liability

  You ask for a method to transpose physical attribution into moral accounting. The first task is to dismantle the analogy. In atmospheric physics, fractional attribution ($FAR = 1 - P_0/P_1$) isolates a causal variable against a counterfactual baseline. It describes *force*, not *fault*.

  **The "30 Per Cent" Prohibition**
  You asked whether the panel should ever write "the Society bears 30 per cent of the responsibility." The answer is an unqualified no. This is a category error.
  1.  **Non-Additivity:** Moral responsibility is not a conserved quantity. If ten men hold a beam that crushes a victim, each bears full responsibility for the act of holding, not one-tenth.
  2.  **The Fischer Lesson:** The Fischer controversy demonstrates that state responsibility turns on *intent* and *structure*, not merely causal contribution. To assign a percentage implies the remaining 70% is "not our problem." In ethics, if you are complicit, you are liable for the remedy appropriate to your position, regardless of the share of causality.
  3.  **False Precision:** Given the archival thinness you note, a percentage suggests an evidentiary rigour that does not exist. It invites the very haggling you wish to avoid.

  The panel must deal in qualitative typologies (Primary, Complicit, Beneficiary), not fractions. The following procedure is designed to separate questions of fact (where evidence rules) from questions of value (where voting rules).

  ***

  ### The Procedure: Four Gates

  **Time Allocation:** 90 Minutes
  **Quorum:** 5 Members
  **Evidence Standard:** Balance of Probabilities (unless specified)

  #### Gate 1: The Connection (Fact)
  *Time: 20 mins*
  **Question:** Did the Society, as a corporate entity, have a tangible link to the person, object, or fund in question at the time of the harm or acquisition?
  **Sufficient Answer:** Documentary evidence of accessioning, employment, formal acceptance of funds, or public endorsement.
  **Termination (No):** If the link is purely incidental (e.g., a member acted entirely privately without Society knowledge or ratification *at the time*).
  **Note:** "Private capacity" is often a fiction. If the Society leveraged the result (published the account, kept the object), the link is established.
  **Output:** Pass/Fail. If Fail, request rejected on facts. Chair signs off.

  #### Gate 2: Corporate Agency (Fact/Interpretation)
  *Time: 25 mins*
  **Question:** Did the Society's decision structures facilitate, enable, or ratify the harm?
  **Philosophical Ground:** Corporate Agency. An organisation is an agent if it has decision-making structures distinct from its members.
  **Sufficient Answer:** Evidence that the action was consistent with Society policy, or that the Society failed to exercise due diligence available at the time.
  **Termination (No):** If the individual acted *against* explicit Society policy and the Society took steps to distance itself *contemporaneously*.
  **Tension Point:** This is where "Complicity" meets "Benefit." If the Society benefited (prestige, assets) without direct causation, it passes Gate 2 but moves to "Remedial Responsibility" rather than "Culpability."
  **Output:** Finding of Agency (Direct, Complicit, or Beneficiary).

  #### Gate 3: Typology of Guilt (Interpretation)
  *Time: 25 mins*
  **Question:** Which of Jaspers' categories applies to the Society?
  1.  **Criminal:** Violation of law (then or now). *Rarely applies to institutions retrospectively.*
  2.  **Political:** Liability for the actions of the state or community to which one belongs. *Applies if the Society acted as a state proxy.*
  3.  **Moral:** Individual conscience. *Institutions do not have consciences, but they have ethical mandates.*
  4.  **Metaphysical:** Solidarity with humanity. *The baseline for all members.*
  **Sufficient Answer:** Consensus on the dominant category.
  **Transition to Vote:** If the panel agrees on the category but disagrees on the *consequence* (e.g., "We are politically liable, but does that require renaming?"), the matter moves to Gate 4.
  **Output:** Classification of Liability.

  #### Gate 4: Remedial Action (Value)
  *Time: 20 mins*
  **Question:** Given the Liability Classification, what is the proportionate remedy?
  **Standard:** Majority Vote.
  **Options:** Return/Repatriate; Rename/Remove; Apologise (Private/Public); No Action.
  **Constraint:** The remedy must address the harm, not merely soothe the present membership.
  **Output:** Recommendation to Council.

  ***

  ### Application to Cases

  #### Case 1: Colonial Remains (1897)
  *   **Gate 1 (Connection):** Pass. The Society accessioned the material and published the account. This ratifies the acquisition. The "private capacity" of the member is negated by institutional acceptance.
  *   **Gate 2 (Agency):** Complicit. The Society provided the reputational cover and the repository. Without the Society, the expedition's "scientific" value would have been diminished.
  *   **Gate 3 (Guilt):** Political and Metaphysical. The Society acted as an arm of imperial knowledge-gathering.
  *   **Gate 4 (Remedy):**
      *   *Return:* Mandatory. You cannot hold stolen human remains on a "balance of probabilities." The default must be return unless impossible.
      *   *Apology:* Required. Acknowledges the Political guilt.
      *   *Vote:* Unlikely to be needed on return. Apology wording may require a vote.
  *   **Verdict:** Return and Apologise. Chair signs off on return; Council approves apology text.

  #### Case 2: Wartime Director (1942–45)
  *   **Gate 1 (Connection):** Pass. He was the Director. The building is named by the Society.
  *   **Gate 2 (Agency):** Direct. The Society employed him. The work was done under Society auspices, even if funded by the state. The existence of internal objection (minutes) mitigates *moral* guilt of the *fellows*, but not the *political* liability of the *corporation*. The corporation is the sum of its decisions, and the decision was to employ him and keep the building named.
  *   **Gate 3 (Guilt):** Political. The Society was part of the war effort.
  *   **Gate 4 (Remedy):**
      *   *Rename:* This is a value judgment. Does the name honour the man or the era? If the name functions as a memorial, it conflicts with current values.
      *   *Apology:* Complex. To whom? The victims of the bombing? This admits liability for the deaths, which may exceed the Society's actual causal role (providing the director vs. dropping the bombs).
      *   *Vote:* Required. The tension is between "Historical Record" (leave it) and "Current Values" (remove it).
  *   **Verdict:** Likely Rename. Apology restricted to "regret for the Society's role in the war effort" rather than specific casualties. Council must approve due to reputational risk.

  #### Case 3: Eugenics Bequest (1920s)
  *   **Gate 1 (Connection):** Pass. The Society accepted the money and named the prize.
  *   **Gate 2 (Agency):** Beneficiary. You argue he was a private citizen. This is the weak point. By naming a prize after him, the Society did not merely take money; it adopted his legacy as an exemplar. That is an active corporate decision, distinct from the donation itself.
  *   **Gate 3 (Guilt):** Moral/Political. By retaining the name, the Society signals endorsement of his views, or at least indifference to them.
  *   **Gate 4 (Remedy):**
      *   *Your Objection:* "You can't disown one gift without insulting every donor."
      *   *Procedure's Counter:* This is a consequentialist argument (fear of future outcome) masking a deontological failure (current endorsement of harm). Remedial responsibility arises from *benefiting* from a tainted source while maintaining the association.
      *   *Vote:* Required. The question is whether the prize name constitutes an ongoing endorsement.
      *   *Repudiation:* The money is spent. You cannot return it. You can only rename the prize and contextualise the history.
  *   **Verdict:** Rename the prize. Add a plaque explaining the origin. Do not return funds (impossible). Council approves.

  ***

  ### Sign-Off and Authority

  *   **Chair Sign-Off:** Cases terminating at Gate 1 (No Connection). Cases where the remedy is purely administrative (e.g., returning an object with no public profile).
  *   **Council Referral:** Any case requiring a public apology, a name change on a building, or where the panel vote was not unanimous. Council retains fiduciary and reputational oversight.

  ***

  ### Limitations and Misfires

  You asked where this procedure will fail. It will fail in three specific places.

  **1. The "Values" Masking as "Facts"**
  Gate 2 (Corporate Agency) looks like a fact-finding mission, but it is not. Deciding whether "accessioning an object" equals "ratifying a theft" is a moral judgment, not a historical one. The procedure dresses this in evidentiary language ("Balance of Probabilities"), but it is really a question of how strictly we define our corporate boundaries. A solicitor on your panel will spot this: it is a judgment call wearing a procedural uniform.

  **2. The Problem of Changing Moral Baselines**
  The procedure assumes a stable definition of "harm." It does not account for the fact that what counts as a remedy changes. In ten years, an apology may be seen as insufficient; in fifty years, it may be seen as performative. The procedure locks in a decision based on *current* panel values, which Council may view as transient. You are codifying the moral sensibilities of 2024 into permanent minutes.

  **3. The "Beneficiary" Trap**
  In Case 3, the procedure forces a rename because the Society *benefited*. If applied rigorously, this logic could consume the Society. Almost all endowments from that era carry some taint (empire, industry, inequality). If "benefiting from harm" creates "remedial responsibility," you risk an infinite regress of renaming. The procedure has no off-ramp for "ubiquitous taint." It relies on the panel's gut feel at Gate 4 to say "this is too much," which undermines the methodological rigour you seek.

  **Final Advice**
  Do not seek the precision of physics. In attribution science, you isolate the signal from the noise. In ethics, the noise *is* the signal. The ambiguity of the archives is not a problem to be solved; it is the condition of the judgment. Use the procedure to ensure you have asked the right questions, not to guarantee the right answer.

  Ban the percentages. They are a refuge for the cowardly. If the Society is responsible, it is responsible. If it is not, it is not. Anything in between is merely hedging.
