prompt: |-
  I'm a retired atmospheric physicist. Most of my career was in attribution work — the business of saying how much of the increased likelihood of a given heatwave or flood you can pin on human-caused warming, which in practice means producing a fraction and defending it against people who want it to be smaller. Since I stopped going into the office I've drifted into philosophy, and last year I let myself be talked into chairing a small panel at my old learned society. We recieve three or four requests a year asking the society to acknowledge something in its own past: return human remains and objects aquired on a colonial expedition, apologise for what a wartime laboratory did, rename a prize, that sort of thing. At the moment we settle each one by argument and gut feel, which is a bit rich in a body that publishes journals about method.

  What I want is a procedure my panel can run on paper, in about ninety minutes, with eight of us round the table — half of whom have no philosophy at all (a retired headteacher, a solicitor, two postdocs, me). Someone should be able to pick it up cold and work down it. So: the questions in order, what counts as a sufficient answer to each, where the run terminates in a flat no, where it stops being a matter of fact and hands over to a vote because it's really a question of values, and what standard of evidence applies at each stage, given that the archives are usually thin and everybody who did the thing is a century dead. I'd also want it to say what the chair signs off on and what has to go to council.

  Ground it in whatever the collective-responsibility literature actually offers rather than in slogans. I'd like it to take seriously: the difference between guilt and responsibility; Jaspers' four-way split after the war — criminal, political, moral and metaphysical guilt, as I remember it — and whether any of those can transfer to an institution at all; the corporate-agency line of argument that an organisation can be an agent in its own right because it has decision structures that no individual has; complicity versus merely benefiting; and remedial responsibility, the idea that you can owe a fix for a harm you didn't cause. Tell me where those pull against each other, because they do.

  Second thing, and here I'd rather you were blunt than agreeable. I've been reading up on the Fischer controversy — the row that broke in 1961 over whether Germany bore primary responsibility for the First World War, with one side pointing at the leadership's expansionist war aims and the September Programme of 1914, and the other at an alliance system, mobilisation timetables and mutual misreading that no single government steered. Historians have been arguing about how to attribute blame to a state for over a century and I recognise the shape of my own trade in it. So: can the move I used to make — assigning a fraction of an event's likelihood to a cause — be carried over into moral responsibility? I suspect no, or only partly, but I want to know precisely where the analogy breaks down, and whether a panel should ever be allowed to write "the society bears 30 per cent of the responsibility" in a published decision, or whether that's a false precision we ought to ban from our minutes outright.

  Then run it on three cases.

  1. In 1897 a society member, on a punitive expedition he'd joined in a private capacity, sent back human remains and several sacred objects. The society never organised the expedition, but it published his account, accessioned the material and still holds it. A descendant community asks for return and an apology.

  2. Our main building is named after the director who, between 1942 and 1945, ran work for the strategic bombing programme. A group whose relatives were killed in one of the raids asks us to rename it and apologise. Our own committee minutes show several fellows objecting at the time, and being overruled.

  3. Part of the endowment comes from a bequest by a man whose published work in the 1920s argued for restricting immigration on hereditary grounds and who sat on a eugenics organisation. The request is that we repudiate the bequest and rename the prize it funds. My own view is that this isn't us: he was a private citizen, the money was freely given, and you can't disown one gift without insulting every donor since. I want to see whether the procedure respects that or simply walks over it — and if it walks over it, I want it to say why in terms I can't wave away.

  Finish with what the procedure can't do and where it will misfire, including any step that turns out to be a judgment call wearing a procedural uniform. British English please, and don't pad it: a couple of thousand words is plenty.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Retired atmospheric physicist (attribution specialist), now interested in philosophy/ethics. Chairs a panel at a learned society dealing with historical redress requests (repatriation, apologies, renaming).
      *   **Task:** Create a 90-minute procedural framework for the panel to evaluate these requests.
      *   **Requirements:**
          *   Grounded in collective responsibility literature (Jaspers, corporate agency, complicity vs. benefit, remedial responsibility).
          *   Address the tension between these concepts.
          *   Address the "Fischer Controversy" analogy: Can probabilistic attribution (like climate science) apply to moral responsibility? (Specifically: Is "30% responsible" valid?)
          *   Run the procedure on three specific cases (Colonial remains, Wartime building director, Eugenics bequest).
          *   Include limitations/misfires of the procedure.
          *   Tone: Blunt, precise, British English, no padding (~2000 words).
          *   Structure: Questions in order, sufficiency criteria, termination points (No vs. Vote), evidence standards, sign-off authority.

  2.  **Deconstruct the Core Philosophical Challenge:**

      *   *Attribution vs. Responsibility:* In physics, $P(E|C) - P(E|\neg C)$ gives a fraction. In ethics, responsibility isn't additive in the same way. You can't say "30% guilty." It's binary (liable/not liable) or qualitative (types of guilt).
      *   *Jaspers' Four Guilt:* Criminal (court), Political (citizen/state), Moral (individual conscience), Metaphysical (solidarity). Which applies to an *institution*? Mostly Political (corporate) and potentially Moral (if the institution has a moral persona).
      *   *Corporate Agency:* An organisation acts through structures. If the structure facilitated harm, the organisation bears responsibility, even if individuals varied.
      *   *Remedial Responsibility:* Who is best placed to fix it? (Connects to "benefiting" vs. "causing").
      *   *The "30%" Question:* Needs a hard "No." Moral responsibility isn't probabilistic in that sense. It dilutes accountability.

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   Need a flowchart style but in text.
      *   *Stage 1: Fact-Finding (Evidence Standard: Balance of Probabilities).* Did it happen? Did we hold the asset/name/money?
      *   *Stage 2: Agency & Causality (Evidence Standard: Preponderance of Evidence).* Was the Society an agent? (Corporate Agency test).
      *   *Stage 3: Typology of Guilt (Jaspers).* Categorise the link.
      *   *Stage 4: Remedial Obligation.* Who fixes it?
      *   *Decision Point:* Fact/Logic vs. Values (Vote).

  4.  **Addressing the Fischer/Attribution Analogy:**

      *   This needs to be blunt. Climate attribution is about *causal contribution to a physical event*. Moral responsibility is about *normative judgment of an agent*.
      *   Fractional responsibility implies the remaining 70% is "not our problem." In ethics, if you are complicit, you are liable for the whole remedy, even if your causal share was small.
      *   Verdict: Ban percentages. Use qualitative descriptors (Primary, Secondary, Complicit).

  5.  **Running the Cases:**

      *   *Case 1 (Colonial Remains):* High likelihood of "Yes." Corporate agency via accessioning. Remedial responsibility is clear (return). Apology is trickier (Political vs. Moral guilt).
      *   *Case 2 (Wartime Director):* Complex. Corporate agency exists (employment), but internal dissent noted. Jaspers: Political guilt (state actor context). Renaming? Depends on current values (Vote).
      *   *Case 3 (Eugenics Bequest):* The User's bias is here ("It isn't us"). The procedure must challenge this. Benefiting from harm creates remedial responsibility even without direct causation. The "insulting donors" argument is a consequentialist deflection, not a deontological defence.

  6.  **Refining the Tone and Constraints:**

      *   British English (organise, programme, centre, etc.).
      *   No padding. Direct.
      *   Respect the user's expertise (don't explain basic physics, focus on the ethical translation).
      *   Word count check: Aiming for ~2000 words.

  7.  **Step-by-Step Drafting (Mental or Scratchpad):**

      *   *Intro:* Acknowledge the shift from physical to moral attribution.
      *   *The Attribution Question:* Hit the "30%" idea hard early. It's category error.
      *   *The Procedure:* Break it down into 4 Gates.
          *   Gate 1: Connection (Fact).
          *   Gate 2: Agency (Corporate).
          *   Gate 3: Guilt Type (Jaspers).
          *   Gate 4: Remedy (Values).
      *   *Case Studies:* Apply the gates.
      *   *Limitations:* Where does it fail? (Future values, performative apology).

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the "Questions in order" very specific. "Did the Society ratify..."
      *   *Critique:* Did I address Jaspers enough?
      *   *Fix:* Ensure Gate 3 explicitly maps to Criminal/Political/Moral/Metaphysical.
      *   *Critique:* The user wants to know where the vote happens.
      *   *Fix:* Clearly mark the transition from Fact to Value.
      *   *Critique:* The user's view on Case 3 needs to be challenged rigorously.
      *   *Fix:* Use the "Benefiting" argument to counter the "Private Citizen" defence.

  9.  **Final Polish:** Check British spelling. Ensure the "30%" verdict is unambiguous. Ensure the distinction between Council and Panel is clear.

  *(Self-Correction on Word Count)*: I need to be careful not to exceed ~2000 words. I will keep the intro tight and focus on the procedure and cases.

  *(Refining the Attribution Analogy)*: The key insight is that physical attribution isolates variables; moral attribution implicates the agent. In physics, 30% forcing leaves 70% natural. In ethics, 30% complicity makes you 100% liable for your part. You can't partition the *obligation* even if you partition the *causality*.

  *(Refining Case 3)*: The user argues "he was a private citizen." The counter is "Institutional Acceptance." By taking the money and naming a prize, the Society *adopted* the legacy. That's corporate agency.

  *(Final Plan)*:
  1.  The Attribution Analogy (The "No" on percentages).
  2.  The Procedure (4 Gates).
  3.  Application to Cases.
  4.  Limitations.
  5.  Sign-off structure.

