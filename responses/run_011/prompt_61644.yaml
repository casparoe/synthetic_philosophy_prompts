  2. "Simulated annealing is just random search with extra steps." Refused. His line was that annealing is a bet about what the landscape looks like, random search is a different bet, and each one wins somewhere and loses somewhere else.
  3. "The demand model has held up on about 1,200 held-out customers across four regions for nine months, so it'll hold up on the next customer we onboard from the same pool." Signed off.
  4. "Same model, same record, so it'll hold up when we open Indonesia." Refused. Said nobody had told him what was the same about the two pools.
  5. "No algorithm beats random search averaged over all possible objective functions, therefore all our benchmarking is a waste of time." Refused, hard. Said the theorem averages over everything and everything is not our workload.
  6. "Our new ranker is better, it wins the public leaderboard." Refused. Assumed everybody tunes against the leaderboard.
  7. "New ranker won a six-week A/B on live traffic, no overlap with anything in training." Signed off.
  8. "The solver's numerics rest on physics that's been confirmed for four centuries, so we can trust the extrapolation into the pressure regime we've never tested." Refused.
